answer: |-
  This is a brilliant setup. It captures the essence of the "Poverty of the Stimulus" argument without getting bogged down in the technicalities of generative grammar immediately. It treats the students as scientists confronting underdetermined data, which fits your background and their likely mindset.

  Here is the complete package for your 80-minute session.

  ### 1. Timing Plan (80 Minutes)

  *   **00–10 min:** **Introduction & Setup.** Hand out the Corpus. Explain the "Field Linguist" scenario. Split the room: Left side = Team A, Right side = Team B.
  *   **10–25 min:** **Analysis Phase.** Team A works to induce the rule. Team B opens the Envelope, reads Rule 2, and prepares to defend it as the "correct" scientific hypothesis that fits the data.
  *   **25–40 min:** **Presentations.** Team A states their rule and writes their predictions for the test items on the board. Team B reveals they were *given* Rule 2, argues it fits the corpus perfectly, and writes their conflicting predictions.
  *   **40–55 min:** **The Test.** Hand out the Test Sheet. Both teams apply their rule to the 6 new sentences. Compare results. Note the divergence.
  *   **55–65 min:** **The Reveal.** Show of hands: "Who thought Rule 1 was obviously right before you heard about Rule 2?" Discuss the feeling of certainty.
  *   **65–80 min:** **Debrief.** Connect to the philosophy of mind/language. Address the "Honesty Clause" (underdetermination vs. unlearnability). Q&A.

  ---

  ### 2. Handout 1: The Corpus (For Both Teams)

  **FIELD NOTES: LANGUAGE "TAMU"**
  **Collector:** [Your Name]
  **Date:** October 2023
  **Context:** Elicitation of simple statements.

  *Instructions: You have a shoebox of notes. These are the only 12 sentences recorded. Your job is to determine the grammatical rule governing the particle **na**.*

  | # | Tamu Sentence | Gloss | Translation |
  | :--- | :--- | :--- | :--- |
  | 1 | **mira-na** sapa talo | child-**NA** see dog | The child sees the dog. |
  | 2 | **deko-na** nuka talo | man-**NA** hit dog | The man hits the dog. |
  | 3 | **sanu-na** pula koro | woman-**NA** carry house | The woman carries the house. |
  | 4 | **talo-na** sapa mira | dog-**NA** see child | The dog sees the child. |
  | 5 | **deko-na** sapa sanu | man-**NA** see woman | The man sees the woman. |
  | 6 | **mira-na** nuka talo | child-**NA** hit dog | The child hits the dog. |
  | 7 | **sanu-na** sapa deko | woman-**NA** see man | The woman sees the man. |
  | 8 | **talo-na** pula mira | dog-**NA** carry child | The dog carries the child. |
  | 9 | **deko-na** tira | man-**NA** sleep | The man sleeps. |
  | 10 | **sanu-na** tira | woman-**NA** sleep | The woman sleeps. |
  | 11 | **mira-na** pula koro | child-**NA** carry house | The child carries the house. |
  | 12 | **deko-na** sapa wena | man-**NA** see river | The man sees the river. |

  **Lexicon:**
  *   **Nouns:** *talo* (dog), *mira* (child), *wena* (river), *sanu* (woman), *deko* (man), *koro* (house).
  *   **Verbs:** *sapa* (see), *nuka* (hit), *pula* (carry), *tira* (sleep).
  *   **Particle:** *na* (appears exactly once per sentence).

  ---

  ### 3. Handout 2: The Envelope (Team B Only)

  **CONFIDENTIAL: THEORETICAL FRAMEWORK**
  **FOR TEAM B EYES ONLY**

  **Instruction:**
  You are not trying to discover the rule from scratch. You have been provided with a working hypothesis by a senior researcher. Your task is to **defend this rule** as the valid description of the corpus provided in Handout 1.

  **The Rule:**
  > **The particle *na* attaches to the first word of the sentence.**

  **Your Task:**
  1.  Verify that this rule fits all 12 lines of the Corpus perfectly. (It does).
  2.  Prepare to argue against Team A if they propose a different rule.
  3.  When the Test Sheet arrives, apply *this* rule to generate your predictions.

  *Do not reveal this envelope until the Instructor asks Team B to present.*

  ---

  ### 4. Handout 3: The Test Sheet (For Both Teams)

  **NEW DATA STREAM**
  **Instructions:** The field team has sent six new sentences. These structures differ from the original corpus. Insert the particle **na** in the correct position according to your team's rule.

  *New Vocabulary:* *kalo* (yesterday), *wiri* (quickly).

  | # | Tamu Input (Na missing) | Translation | **Your Prediction (Insert *na*)** |
  | :--- | :--- | :--- | :--- |
  | 1 | kalo mira sapa talo | Yesterday the child saw the dog | _______________________________ |
  | 2 | kalo deko nuka talo | Yesterday the man hit the dog | _______________________________ |
  | 3 | wena mira sapa | The river, the child saw (Object Front) | _______________________________ |
  | 4 | koro sanu pula | The house, the woman carries (Object Front) | _______________________________ |
  | 5 | sapa mira talo ? | Did the child see the dog? (Verb First) | _______________________________ |
  | 6 | nuka deko talo ? | Did the man hit the dog? (Verb First) | _______________________________ |

  ---

  ### 5. Instructor Script & Scoring

  **The Setup (0-10 min)**
  "I'm not a linguist; I'm a chemist. But in science, we often face a moment where the data fits more than one theory. Today, you are field linguists. You have a shoebox of notes from a language called Tamu. You have no teacher, no textbook, just the data."

  **The Split (10 min)**
  "Team A: You are the Empiricists. Look at the data. Tell me what rule generates these sentences.
  Team B: You are the Theorists. You have a sealed envelope. Open it now. Your job is to defend the rule inside as the scientific truth, because it fits the data."

  **The Confrontation (25-40 min)**
  *   Ask Team A for their rule. (They will almost certainly say: "*na* marks the subject.")
  *   Ask Team A to write their predictions for the Test Sheet on the whiteboard.
  *   Ask Team B to reveal their envelope. (Rule: "*na* marks the first word.")
  *   Ask Team B to write *their* predictions on the whiteboard.
  *   **Scoring:** "On the original 12 lines, both teams score 100%. Both rules are empirically adequate for the training set."

  **The Test (40-55 min)**
  "Now apply your rules to the new data."
  *   *Example Divergence:*
      *   Sentence 1 (*kalo mira sapa talo*):
          *   Team A (Subject): *kalo mira-na sapa talo*
          *   Team B (First Word): *kalo-na mira sapa talo*
  *   Highlight the conflict. "The data is now different. The rules make different predictions. But we don't have the answer key. We only have the notes."

  **The Reveal (55-65 min)**
  "Close your eyes. Raise your hand if, before Team B opened that envelope, you were convinced Rule 1 (Subject) was the *only* possible answer."
  *(Most hands will go up).*
  "Keep them up. Why? The notes didn't tell you that. The notes allowed Rule 2 just as easily. Where did that certainty come from?"

  ---

  ### 6. The Debrief (65-80 min)

  **The "Itch"**
  "You just experienced a specific kind of scientific frustration. The data was **underdetermined**. Two different theories explained the past observations perfectly, but they predicted different futures. In physics, you'd run an experiment to break the tie. In language, the 'experiment' is watching a child learn."

  **Mapping to the Real Debate**
  "In the 1950s, linguists realized something similar about human children. A child hears a 'corpus' of speech—often messy, fragmented, and limited (like your 12 lines). Yet, every healthy child converges on Rule 1 (Subject/Structure), not Rule 2 (Linear/First Word).
  If the data doesn't force Rule 1, and Rule 2 is logically possible, why do humans never guess Rule 2?
  This suggests the 'notes in the shoebox' aren't the only thing the learner has. They have the shoebox *plus* something else."

  **The Honesty Clause (Crucial)**
  "Now, I need to be scientifically honest with you.
  1.  **Underdetermination is not Unlearnability.** This demo shows the data *alone* doesn't pick the rule. It does **not** prove the rule is unlearnable.
  2.  **The Extra Premise.** To move from 'The data is ambiguous' to 'Humans need innate knowledge,' you need an extra premise: *'The learner considers all logically possible rules equally.'*
      *   If the human mind has a bias—a preference for grouping words by function (subjects) rather than position (first word)—then the data *is* enough.
      *   The debate isn't whether the data is sparse (it is). The debate is whether the mind is a blank slate or a structured filter."

  **Closing Thought**
  "I want you to leave with this question: When you looked at *mira-na*, did you see 'Child-NA' or 'FirstWord-NA'? You saw 'Child.' You imposed structure that wasn't in the ink. The question is: Did you learn to do that, or were you built to do it?"

  ---

  ### 7. Troubleshooting: What Will Go Wrong

  **1. The "Sample Size" Objection**
  *   **Prediction:** A student will say, "Twelve sentences is definitely too little to learn anything from. If you gave us 1,000, we'd know."
  *   **Response:** "Excellent point. But look at the 1,000 sentences. If all 1,000 are Subject-Verb-Object with the Subject first, do we ever see a case where the Subject is *not* the first word? No. So 1,000 lines of *this specific data* still doesn't distinguish the rules. The problem isn't quantity; it's the *type* of evidence missing."

  **2. The "Simplicity" Objection**
  *   **Prediction:** A student will argue Rule 2 (First Word) is actually simpler/easier, so why would anyone pick Rule 1?
  *   **Response:** "In terms of counting, Rule 2 is simpler. But human brains don't seem to count; they group. We care about *who* did the action, not just where the word sits. That preference for 'who did it' (Subject) over 'where it is' (First) is the bias we're investigating."

  **3. Team B Feels Like Cheaters**
  *   **Prediction:** Team A might feel Team B had an unfair advantage.
  *   **Response:** "In science, theories often come from intuition or prior framework before the data is fully analyzed. Team B represents the hypothesis that 'Linear rules are sufficient.' Team A represents the intuition that 'Grammatical function matters.' The conflict is the point."

  **4. Running Out of Time**
  *   **Risk:** The debate between teams can eat 20 minutes.
  *   **Mitigation:** Be the strict timekeeper. "Team A, give me the rule in one sentence." "Team B, does your rule fit line 1? Yes/No." Keep it moving to the Test Sheet. The learning happens in the Test Sheet divergence, not the corpus analysis.

  ### 8. What This Activity Cannot Show (For Your Notes)

  *   **It is not a proof of Universal Grammar.** It is a demonstration of **inductive risk**. It shows that *if* you assume the learner is a general-purpose pattern matcher with no biases, they should fail or guess randomly. Since they don't guess randomly, something is constraining the hypothesis space. That constraint *could* be innate (UG), or it *could* be learned from other domains (cognitive generalizations), or it *could* be that the data is richer than we think (usage-based theories).
  *   **It ignores semantics.** In real language, "Yesterday the child..." carries meaning that might cue the child that "Yesterday" is not the agent. Your Tamu sentences strip this away to isolate the syntax.
  *   **It assumes competence.** It assumes the students (and children) represent the rule explicitly. Connectionist models would argue there is no "rule," just weight adjustments. This activity assumes a rule-based framework for the sake of the argument.

  This plan respects your scientific rigor while creating the philosophical "itch" you want. Good luck with the session.
