prompt: |-
  I'm a novelist, not a philosopher, but I run a monthly reading group with two lawyer friends, a screenwriter, and a retired GP, and next month I'm the one presenting. I want to do Scanlon's contractualism and the whole can-it-handle-numbers / aggregation mess, because I've been circling it for a novel — a small town council doing something that's fine for almost everyone and quietly awful for one person — and I keep getting it slightly wrong in ways I can't name. So don't explain contractualism to me, I've read enough to be dangerous. Plan how I explain it to them instead: forty minutes, a whiteboard, people who are smart and read novels but have never sat in a philosophy class and think "contractualism" sounds like a cell phone plan. What has to come first, second, third — the dependency order — so that the aggregation problem lands as a genuine problem rather than a gotcha. Specifically, what does "reasonable rejection" have to be understood as (and as *not*) before "why can't we just add up the complaints" even makes sense as a question to ask? I have a half-memory that Scanlon doesn't simply ban numbers from mattering but lets them in some non-aggregative way, like as a tiebreak or a change in what counts as a burden — if that's roughly right, tell me where in the sequence it belongs; if I've mangled it, tell me that too.

  For the carrying example, here's what I was going to use, so tell me if it's wrong or what to swap it for: a block association votes to install a backup generator that keeps everyone's fridge and lights on through storms, except the noise sits right under one woman's bedroom window and she can't sleep. Almost everyone gains a little, one person loses a lot, nobody's being malicious, and the "we're not doing anything *to* her, we're just doing something *near* her" move is exactly the pull I want them to feel. What I need: what that case has to have and what it must NOT have (is it fatal that she could theoretically move, or that she's unusually noise-sensitive, or that each neighbour's gain is so small?); the three or four misconceptions they'll form and exactly where in the sequence I head each off — I already predict "so contractualism is just utilitarianism with extra steps" and "so any one person can veto anything," and I suspect there's a third about what's actually being compared to what (act vs. principle, one person's complaint vs. the pile of everyone else's). Give me one question to ask at the end that tells me whether they've grasped the shape of the problem or just nodded along, and tell me what I should openly refuse to get into at this level and say so out loud. No reading list, please — this is alot more about the order and the traps than the texts.
reasoning: |-
  Here's a thinking process that leads to the suggested presentation plan:

  1.  **Analyze the User and Request:**
      *   **User:** Novelist, running a reading group with smart laypeople (lawyers, screenwriter, GP). They know *of* Scanlon but haven't studied him academically.
      *   **Goal:** Present Scanlonian Contractualism (specifically the aggregation/numbers problem) in 40 minutes using a whiteboard.
      *   **Constraint:** Do *not* explain contractualism from scratch (user knows enough to be dangerous). Focus on the *dependency order* of concepts so the aggregation problem lands correctly.
      *   **Specific Focus:** What must "reasonable rejection" be understood as *before* the aggregation question makes sense? Where does the nuance about numbers (tiebreaks/burdens) fit?
      *   **Case Study:** Block association generator (benefits many slightly, harms one significantly). User wants to know if this case works, what features it needs/avoids, and what misconceptions to head off.
      *   **Deliverables:** Sequence/Order, Case Study critique, Misconception management, Final diagnostic question, Scope boundaries (what to avoid).

  2.  **Deconstruct the Philosophy (Scanlon's *What We Owe to Each Other*):**
      *   *Core Idea:* An act is wrong if it violates principles no one could reasonably reject.
      *   *Reasonable Rejection:* It's not about "I don't like this." It's about generic reasons, burdens, and comparability.
      *   *Aggregation Problem:* Can many small complaints outweigh one large complaint? Utilitarianism says yes (sum the utility). Scanlon says... it's complicated.
      *   *The "Numbers" Nuance:* Scanlon doesn't ignore numbers entirely. In *What We Owe*, he's skeptical of aggregation. Later (in "When Does the Sum Matter?"), he allows numbers to matter in specific ways (e.g., tie-breaking, or when the *nature* of the burden changes).
      *   *Key Distinction:* It's not Act vs. Act. It's Principle vs. Principle. It's not "My Pain vs. Your Pain." It's "My Reason to Reject vs. Your Reason to Reject."

  3.  **Determine the Dependency Order (The "Sequence"):**
      *   *Problem:* If you start with "Can we add up complaints?", people immediately think like Utilitarians (math problem).
      *   *Solution:* You must establish the *structure* of the moral conversation first.
      *   *Step 1: The Unit of Evaluation.* It's not the *act* (installing the generator), it's the *principle* (we install infrastructure that benefits the majority even if it burdens a minority). This prevents "but this specific time..." arguments.
      *   *Step 2: The Standpoint of Rejection.* It's not "I feel bad." It's "This burden is too high *given the alternatives*." This prevents "veto" misconceptions.
      *   *Step 3: Comparability.* You can only compare *generic* reasons. "I can't sleep" is generic. "I hate the sound of *this* generator" is idiosyncratic.
      *   *Step 4: The Aggregation Question.* Now, can 100 people's "inconvenience" outweigh 1 person's "insomnia"?
      *   *Step 5: The Role of Numbers.* Numbers aren't weights on a scale; they are intensifiers of the *principle's* acceptability or tie-breakers in equal burden cases.

  4.  **Critique the Case Study (The Generator):**
      *   *Strengths:* Clear conflict, small community (fits contractualism's vibe), non-malicious.
      *   *Weaknesses/Risks:*
          *   *Moving:* If she can move, the burden isn't "inescapable." Contractualism cares about reasonable alternatives.
          *   *Sensitivity:* If she's *unusually* sensitive, her reason might be deemed idiosyncratic, not generic.
          *   *Magnitude:* The gain for neighbors must be significant enough to be a *reason*, but small enough to make the aggregation tempting.
          *   *Safety:* If the generator is for *life support* vs. *fridge*, the burden changes type. Stick to "comfort/convenience" vs. "health/sleep."
      *   *Fix:* Make sure the burden is *objective* (decibel levels violating code) not subjective (she's a light sleeper). Make sure the alternative is costly for the group (underground wiring is too expensive), so there's a genuine conflict of principles.

  5.  **Identify Misconceptions & Defusions:**
      *   *Misconception 1: "Utilitarianism with extra steps."* (Summing complaints).
          *   *Fix:* Emphasize *individual* standpoint. You don't sum the neighbors' complaints into one big blob. You ask if *any single neighbor* has a reason strong enough to reject the principle that overrides the woman's reason.
      *   *Misconception 2: "The Veto."* (One person stops everything).
          *   *Fix:* "Reasonable" rejection. You can't reject a principle just because it burdens you; you can only reject it if there's a *less burdensome alternative* available that others couldn't reasonably reject.
      *   *Misconception 3: "Act vs. Principle."* (This specific generator vs. all generators).
          *   *Fix:* Whiteboard the distinction early. We are judging the *rule*, not the *event*.

  6.  **Address the "Numbers" Nuance (User's Half-Memory):**
      *   User is right but needs precision. Scanlon initially said numbers don't matter (Individualist Restriction). Later he softened: Numbers matter when burdens are *equal* (tie-breaker) or when the *probability* of being the victim changes.
      *   *Placement:* This comes *after* establishing that simple aggregation is forbidden. It's the "advanced mode" nuance. Don't lead with it, or they'll think aggregation is allowed.

  7.  **Drafting the Plan (Iterative refinement):**
      *   *Time:* 40 mins is tight. Need strict pacing.
      *   *Whiteboard:* Use it for the "Principle vs. Act" and "Reason vs. Sum" distinction.
      *   *Tone:* Conversational but precise. Acknowledge their intelligence (lawyers love procedure, GP loves triage/diagnosis).
      *   *Final Question:* Needs to test if they understand *why* we don't add, not just *that* we don't add.

  8.  **Refining the "What to Avoid":**
      *   Don't get into the "Save the One vs. Save the Five" Trolley Problem immediately. It triggers Utilitarian instincts too hard. Stick to the Generator (burden vs. benefit) rather than Life vs. Life initially.
      *   Don't get into the history of the Social Contract (Hobbes/Rousseau). It's a distraction.
      *   Don't get into the metaphysics of "value."

  9.  **Final Review against User Prompt:**
      *   *Dependency order?* Yes (Principle -> Reasonable -> Comparability -> Aggregation).
      *   *Reasonable Rejection defined?* Yes (Generic reasons, not vetoes).
      *   *Numbers nuance?* Yes (Tie-breaker/Probability, not weights).
      *   *Case Study critique?* Yes (Fix sensitivity/moving issues).
      *   *Misconceptions?* Yes (Utilitarianism, Veto, Act/Principle).
      *   *Final Question?* Yes (Focus on the *structure* of the argument).
      *   *Scope boundaries?* Yes (No history, no metaphysics).

  10. **Writing the Response:** (Self-Correction during drafting: Ensure I don't accidentally explain contractualism *too* much, as requested. Keep it focused on the *presentation strategy*.) *Wait, user said "Don't explain contractualism to me... Plan how I explain it to them." Okay, I need to give the user the script/structure, not a lecture on Scanlon.*

      *   *Correction:* I need to make sure I validate their "half-memory" about numbers. Scanlon's view evolved. In *What We Owe*, he's strict. In later papers ("When Does the Sum Matter?"), he allows numbers to count in specific ways (risk, tie-breaking). I should advise the user to stick to the *What We Owe* version for clarity, then mention the nuance as a "footnote" so as not to confuse the core lesson. Actually, for a 40-min talk, stick to the core "Individualist Restriction" to make the point land. The nuance might muddy the water. I will advise placing the nuance at the very end as "where it gets messy."

      *   *Case Study:* The "moving" issue is crucial. If she can move, the burden is avoidable. Contractualism cares about *unavoidable* burdens imposed by the principle. I need to tell the user to make the house her only affordable option or she has mobility issues.
      *   *Sensitivity:* Must be "normal human sensitivity," not "hyperacusis." Otherwise, her reason isn't "generic."

      *   *Sequence:*
          1.  The Rule, Not the Act.
          2.  The "Reasonable" Filter (No Vetoes).
          3.  The Comparison (One vs. One, not One vs. Many).
          4.  The Numbers (Tie-breakers, not weights).

      *   *Final Question:* "If 1,000 people get a headache and 1 person gets a migraine, can the 1,000 outvote the 1? Why or why not?" (Tests if they understand the *structure* of the comparison).

      *   *What to refuse:* Don't debate the *outcome* of the generator case. Debate the *method* of deciding it.

      *(Self-Correction)*: Wait, the prompt asks specifically "what does 'reasonable rejection' have to be understood as (and as *not*) before 'why can't we just add up the complaints' even makes sense." I need to highlight this specific conceptual prerequisite.
      *   *Prerequisite:* Rejection is based on *generic reasons* attributable to a *single standpoint*. You cannot stand in the shoes of the crowd. You can only stand in your own. Therefore, you cannot aggregate the crowd's shoes into one giant shoe.

      Okay, ready to write.
answer: |-
  Here is a 40-minute battle plan designed to land the aggregation problem without triggering Utilitarian reflexes or "veto" panic.

  ### 1. The Dependency Order (The Sequence)

  You cannot ask "Can we add up the complaints?" until you have defined *what a complaint is* and *who is holding it*. If you skip to the math, the lawyers will treat it like damages and the GP will treat it like triage.

  **Minute 0–5: The Unit of Judgment (Principle vs. Act)**
  *   **Whiteboard:** Draw a box labeled "The Act" (Install Generator) and a box labeled "The Principle" (Infrastructure benefiting majority may burden minority).
  *   **The Point:** Contractualism does not judge the generator. It judges the *rule* that allows the generator.
  *   **Why this comes first:** If they think we are judging the act, they will aggregate consequences (Utilitarianism). If we judge the principle, we are asking: "Is this a rule free people could agree to live under?"
  *   **Trap to head off:** "But this specific case is unfair!" -> "We aren't deciding this case yet; we are deciding if the *rule* used to decide this case is acceptable."

  **Minute 5–15: The Standpoint of Rejection (Generic Reasons)**
  *   **Definition:** "Reasonable Rejection" is not "I don't like this." It is "This principle imposes a burden on me that I could avoid if we adopted a different principle, and that different principle would not impose a *comparable* burden on anyone else."
  *   **The "Not":** It is **not a Veto.** You cannot reject a principle just because it costs you something. You can only reject it if the cost is *too high relative to the alternatives.*
  *   **The "Not":** It is **not Idiosyncratic.** You cannot reject based on "I hate the color blue." You must reject based on "This prevents me from sleeping," which is a *generic human interest.*
  *   **Why this comes first:** This establishes that moral claims are held by *individuals*, not groups. I can speak for my burden. I cannot speak for yours.

  **Minute 15–25: The Comparison Structure (One-vs-One)**
  *   **The Crux:** When the woman rejects the principle ("I can't sleep"), the neighbors cannot say, "But there are 50 of us."
  *   **Why?** Because in the moment of justification, Neighbor #1 must justify the burden they impose on the Woman. Neighbor #1 says, "My fridge staying cold justifies your insomnia." That is hard to argue.
  *   **The Aggregation Question:** Now you ask: "Can Neighbor #1 borrow the complaints of Neighbors #2 through #50 to make their reason stronger?"
  *   **Scanlon's Answer:** No. You compare the *strongest individual reason* on Side A (The Woman) against the *strongest individual reason* on Side B (Any Single Neighbor). You do not sum Side B.
  *   **Why this lands here:** Only after establishing that justification is *interpersonal* (me explaining myself to you) does the refusal to aggregate make sense. Aggregation treats people as containers of utility, not justificatory agents.

  **Minute 25–35: The Role of Numbers (Your Half-Memory)**
  *   **Where it fits:** This is the nuance *after* the ban on aggregation is established.
  *   **The Nuance:** Numbers don't count as *weight* (50 headaches > 1 migraine). But numbers *can* count as **probability** or **tie-breakers**.
      *   *Probability:* If the principle is "We sometimes sacrifice one person to save the group," everyone faces a *risk* of being the one. The numbers matter because the risk is distributed.
      *   *Tie-Breaker:* If the burden is exactly equal (e.g., 1 person loses a job, 1 person loses a house), then saving the many is permissible, not because their pain sums to more, but because you minimize the *number of events* of that type.
  *   **Instruction:** Keep this brief. If you lead with this, they will think aggregation is allowed. It is the exception, not the rule.

  **Minute 35–40: The Diagnostic Question**
  *   (See below).

  ---

  ### 2. Critique of the Carrying Example (The Generator)

  Your generator case is strong, but it has three leak points that smart laypeople will exploit to bypass the philosophical problem.

  **1. The "Move" Problem (Fatal if not fixed)**
  *   **The Trap:** A lawyer will say, "She can move rooms or move houses. The burden is avoidable." If the burden is avoidable, her rejection is *unreasonable*.
  *   **The Fix:** Hard-code the constraint. She is on a fixed income; this is the only house she can afford. Or, she has a disability that makes moving impossible. The burden must be *inescapable* under the current principle.

  **2. The "Sensitivity" Problem (Fatal if not fixed)**
  *   **The Trap:** A GP will say, "Is the noise objectively loud, or is she just sensitive?" If it's the latter, her reason is idiosyncratic, not generic.
  *   **The Fix:** The generator violates noise ordinances. It is objectively loud enough to wake a "normal" sleeper. Her reason must be *generic* (anyone would lose sleep), not *personal* (she hates humming).

  **3. The "Magnitude" Problem (Crucial for tension)**
  *   **The Trap:** If the neighbors' gain is trivial (e.g., "lights are 5% brighter"), the case is too easy. If the gain is vital (e.g., "life support machines"), the case is too easy.
  *   **The Fix:** The gain must be **significant convenience.** Without the generator, food spoils, work is missed, sump pumps fail (basement floods). It is a *real* burden for them, just not a *health-destroying* burden. This makes the temptation to aggregate real.

  **What the case must NOT have:**
  *   **Malice:** No one hates her.
  *   **Compensation:** Do not introduce money. If you say "We'll pay her $5,000," you turn it into a Coasean economic transaction, and the moral philosophy vanishes.
  *   **Procedural Unfairness:** She must have had a vote. If she was excluded from the meeting, the problem is procedural justice, not contractualism. She must have lost the vote fairly.

  ---

  ### 3. The Three Misconceptions & How to Head Them Off

  **Misconception 1: "So Contractualism is just Utilitarianism with extra steps."**
  *   **When it arises:** Minute 20, when you discuss weighing burdens.
  *   **The Defusion:** "Utilitarianism asks: 'Which outcome has more good?' Contractualism asks: 'Can I justify my action to *you*?' In Utilitarianism, you are a container of value. In Contractualism, you are a judge. I cannot outvote you by gathering other judges."
  *   **Whiteboard:** Draw a Scale (Utilitarianism) vs. a Handshake (Contractualism).

  **Misconception 2: "So any one person can veto anything."**
  *   **When it arises:** Minute 10, when you define "Reasonable Rejection."
  *   **The Defusion:** "Rejection is only reasonable if there is an *alternative principle* available. If the only way to save her sleep is to leave everyone without power in a storm, her rejection is unreasonable because the alternative burden (flooded basements/spoiled food for all) is *greater* or *comparable*. She doesn't get to win just because she complains. She wins only if her burden is *significantly worse* than theirs."

  **Misconception 3: "We are comparing her pain to their pain."**
  *   **When it arises:** Minute 25, during aggregation.
  *   **The Defusion:** "We are not comparing pain. We are comparing *reasons*. Her reason is 'I cannot sleep.' Their reason is 'We lose food.' We ask: Is 'losing food' a strong enough reason to impose 'no sleep' on someone? We do not ask: Does 50x 'losing food' outweigh 1x 'no sleep'?"

  ---

  ### 4. The Diagnostic Question

  Do not ask "Did you understand?" Ask them to apply the structure to a slight variation.

  **The Question:**
  > "Imagine we change the case. Now, the generator is the *only* way to keep the streetlights on. Without it, there is a 1% chance each year that *someone* walking home trips and breaks a leg. We don't know who. With the generator, the woman definitely loses sleep every night.
  >
  > **Under the rules we just discussed: Does the fact that the 'risk' is spread across 500 people allow them to impose the 'certain burden' on the one woman? Why or why not?**"

  **What to listen for:**
  *   **Failed Grasp:** "Yes, because 500 x 1% is 5 injuries, which is worse than 1 insomnia." (They reverted to aggregation/utilitarianism).
  *   **Successful Grasp:** "No, because each individual neighbor only faces a tiny risk. The woman faces a certainty. One person's tiny risk cannot justify another person's certain burden."
  *   **Nuanced Grasp:** "It depends on if we view the principle as 'We protect public safety' (generic) vs 'We protect specific individuals.' But generally, certainty outweighs probability."

  ---

  ### 5. Scope Boundaries (What to Refuse)

  You have 40 minutes. You must explicitly state what you are **not** doing. Write this on the board at the start.

  1.  **"I am not arguing for the Social Contract."** (No Hobbes, no Rousseau, no "state of nature." This is about moral justification, not political origin).
  2.  **"I am not solving the Trolley Problem."** (If they bring up the fat man or the switch, park it. Say: "That's about killing vs. letting die. We are talking about imposing burdens. Different machinery.")
  3.  **"I am not deciding the Generator Case."** (If they argue about noise decibels or property values, stop them. "We are deciding the *method* of decision, not the decision itself.")

  ### Summary of the "Numbers" Nuance (For your confidence)
  You are roughly right, but be careful. Scanlon's early view (*What We Owe*) is the "Individualist Restriction": Numbers never count. You compare the strongest complaint on Side A to the strongest complaint on Side B.
  His later view (papers from the 2000s) allows numbers to count in **tie-breaking** (if burdens are equal, save the many) or **risk** (if everyone faces a small risk, that principle is more acceptable than one imposing a certain burden on one).
  **Advice:** For a 40-minute talk, teach the **Individualist Restriction** (Numbers don't count as weight). Mention the tie-breaker only in the last 5 minutes as "where the debate goes next." If you introduce the nuance too early, the lawyers will use it to drive a truck through your argument.
