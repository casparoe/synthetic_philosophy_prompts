prompt: |-
  My brother got knocked off his motorbike last spring and since then he's been mainlining pop physics; he's now about 40% convinced he literally cannot die, because whatever the odds, theres always a branch where he walks away, and that's the branch he'll be in. I want to run a session at the philosophy of physics reading group I go to (about 10 of us, one retired physicist, a few undergrads, 75 minutes) where people feel the pull of that from the inside before we start picking at it.

  You're a philosopher of physics who also designs classroom simulations, so think this through carefully, and start by brainstorming two or three candidate mechanics before you commit to one. Then give me the thing in full: how to set it up and run it, materials (cheap, seminar room, no real money), how the randomising gets done, and a debrief that maps each moment of the activity onto the part of the argument it's meant to make vivid.

  Two things I'd like worked in. First, some visible gap between the survival odds an outsider would quote and what each player experiences from where they sit -- two ledgers per player, or a bookmaker character, or something better you come up with. Second, the last round should hand whoever's still standing a choice between a sure payout and a coin-flip that could kill them, so the group has to notice what looks rational from in there versus out here.

  Then: what predictably goes wrong the first time I run it and how I should handle it, and which piece of the quantum immortality idea the activity can't reproduce, so I know what I have to just say out loud myself. Also tell me how confident you are in the philosophical claims you make along the way, and flag the one you're least sure of.
