  Dear Colleague, your suspicion is well-founded, and since we agree that verbal reports are behaviors, we begin there with the man who takes the same option every time but reports no preference. If you record the choice as the truth and dismiss the report as noise, you are led to the pure representation theorem on which utility is a bookkeeping device for a choice pattern and nothing more. If instead you treat the report as evidence of an internal state distinct from the action, you move toward the view that utility names a mental quantity of which choice is evidence, though this requires inferring a hidden variable beyond the behavior itself. This branch separates the operationalist from the psychological realist, and it matters because the former cannot explain why the habit persists if the preference is absent, while the latter posits a hidden variable. Next, consider the person whose choices cycle and insists the options are each better than the next, or the one who chooses one lottery but prices the other higher. If you say this invalidates the utility function, you occupy an empty room, for theorists usually adjust the model to save the phenomenon. If you say the choices reveal error, you arrive at the decision-theoretic view on which utility is whatever quantity makes the person's betting behavior come out as expected-value maximizing, treating the cycle as a performance mistake. This splits from the bookkeeping view because it posits a true underlying ranking that was violated, whereas the bookkeeping view simply updates the ranking to fit the cycle, perhaps by adding state-dependence.

  Then there is the person who wants the wine tonight and wishes he did not, relieved when it is taken away. If you privilege the immediate choice, you remain with revealed preference, but if you privilege the reflective wish, you arrive at the idealized-preference view, the ranking the person would have if she were better informed and thinking straight. This path often merges with the view that preference satisfaction is a proxy for something else that is what really matters, though this requires care. If two people whose choices never conflict report different levels of wellbeing, and you trust the reports as accessing a state beyond behavior, you reach the proxy view where choice is merely an indicator of welfare. Contrast this with the person whose preferences shifted after the choice was made. If you say the act created the preference, you reach the view that treating preferences as given data begs the question, because preferences are made rather than found. This is distinct from the mental quantity view because the quantity does not pre-exist the measurement, making the utility function a record of construction rather than discovery. There is also the view that utility is a modeling convenience with no claim to represent anything at all, which sits alongside the bookkeeping view but differs in that it admits the model might be false yet useful, whereas bookkeeping claims the model is true by definition.

  Some combinations remain vacant. No one holds that utility is a mental quantity yet ignores all verbal reports, for that is incoherent given our starting commitment that saying is doing. Nor does anyone claim preferences are made yet insist on a single true utility function, as that is contradictory. These rooms are vacant because the positions are incoherent rather than merely unattractive. I must flag that the tree cannot fully separate the modeling convenience view from the pure representation view, as both deny ontological weight to the function, differing only in whether the model aims for truth or mere utility, a distinction that may vanish under empirical scrutiny. Finally, regarding your worry on unfalsifiability, since any finite pattern of choices can be rationalized by some ranking, the bookkeeping and modeling views are content to be untestable, serving only to organize data. The mental quantity and decision-theoretic views add structure by predicting betting behavior or neural correlates, making them testable but vulnerable. The idealized and constructivist views evade falsification by shifting the ground to normativity or process, which may be worthless for prediction but essential for welfare analysis. Thus, the unfalsifiability worry bites hardest where utility claims to be scientific fact without risking refutation, yet the untestable views retain value if their purpose is coherence rather than prediction, provided we do not confuse the map for the territory, and we acknowledge that a theory which explains everything explains nothing unless it tells us what to expect next.
