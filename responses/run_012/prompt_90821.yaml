      *   **Problem:** Philosophical literature on self-deception feels like it's talking past their experience. Philosophers see a paradox (believing $p$ and not-$p$, or intending to deceive oneself); the novelist sees it as natural character behaviour.
      *   **Task:**
          1.  Restate main philosophical accounts of self-deception (Intentionalist/Partitioned, Non-Intentionalist/Motivated Bias, Pretence/Make-believe) using fiction vocabulary (voice, free indirect discourse, subtext, dramatic irony, etc.).
          2.  Identify what *doesn't* survive the translation. Is the craft vocabulary missing something, or are the philosophers smuggling in bad assumptions (unity of self, intentionality)?
          3.  **Verdict:** Lead with a one-sentence verdict on whether the paradox is real or a description-artefact.
          4.  **Tone:** Philosopher of mind who reads novels. Not polite. Rigorous.
          5.  **Constraints:** Under 900 words. British spelling.

  2.  **Deconstruct the Philosophical Accounts:**
      *   *Intentionalist/Partitioned (Freud, Pears, Davidson):* Mind is split. One part knows, one part doesn't. Deceiver vs. Deceived.
      *   *Non-Intentionalist/Motivated Bias (Mele, Bach):* No intention to deceive. Just bias in evidence gathering/weighting due to desire.
      *   *Pretence/Make-believe (Gendler, Moran):* Not full belief, but acting as if.

  3.  **Translate to Fiction Vocabulary:**
      *   *Partitioned:* Dual voice. The narrator says one thing, but free indirect discourse slips the truth. Dramatic irony where the reader knows what the character refuses to acknowledge.
      *   *Motivated Bias:* Selective narration. The narrator reports evidence that supports their view and omits/minimums counter-evidence. Voice colours the facts.
      *   *Pretence:* Performative narration. The narrator is trying on a belief, testing it, but the subtext shows they don't quite buy it yet.

  4.  **Analyze the "Missing" Bits (The Critique):**
      *   Philosophers worry about *logical consistency* at a single time slice ($t$).
      *   Novelists deal with *temporal flow* and *narrative coherence*.
      *   The "paradox" assumes a static, unified subject. Fiction shows the subject is fragmented and temporal.
      *   The "intention" problem assumes conscious planning. Fiction shows intention as emergent from desire + voice.
      *   Verdict: It's largely a description-artefact caused by static analysis of a dynamic process.

  5.  **Drafting - Section by Section:**

      *   *Verdict:* The paradox is largely a description-artefact born of analysing a dynamic narrative process as a static logical state.
      *   *Intro:* Acknowledge the friction.
      *   *Account 1 (Intentionalist/Partitioned):* Translate to narrative structure. The "deceiver" is the subtext; the "deceived" is the surface voice. Free indirect discourse allows the truth to leak without the narrator admitting it. It's not two homunculi; it's the gap between narration and event.
      *   *Account 2 (Motivated Bias/Non-Intentionalist):* Translate to selection. The narrator isn't lying; they are curating. They weigh evidence disproportionately. This is standard unreliable narration. The reader sees the weighting error; the narrator sees only the conclusion.
      *   *Account 3 (Pretence):* Translate to performance. The narrator is trying on a identity. The belief isn't held; it's enacted. Subtext reveals the strain.
      *   *The Critique (What doesn't translate):* Philosophers want a snapshot of belief state. Novels show the *process* of believing. The "unity of self" assumption is the culprit. In fiction, the self is a construct of the voice, which is inherently unstable. The "intention" requirement is also wrong; self-deception in novels is often habitual, not plotted.
      *   *Conclusion:* The philosophers are modelling a computer; you are modelling a life.

