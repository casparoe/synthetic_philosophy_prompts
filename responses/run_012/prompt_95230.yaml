      *   **Section 3: The Anscombian Defense (Concede vs. Dismiss).** How would she respond? Is it legitimate?
      *   **Section 4: Predictions and Differences.** Where does the theory make a visible difference?
      *   **Section 5: The Cost of Holding It.** What does the student buy into if they keep this view?
      *   **Conclusion:** Final advice for the EE.

  5.  **Drafting the Content - Key Philosophical Nuances:**
      *   *Intention:* Need to explain the "means vs. side effect" distinction carefully. The "Drone" case is the modern version of the "Fat Man" or "Strategic Bomber" cases. The key is whether the death is *part of the plan* or just *along for the ride*.
      *   *Innocence:* In Just War Theory, "innocent" usually means "non-combatant." But if a worker in a munitions factory is killed to stop production, are they innocent? Anscombe says yes, they aren't directly attacking.
