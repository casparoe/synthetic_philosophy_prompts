      *   *The "Innocence" Objection:* Who counts as innocent? If "innocent" just means "those we shouldn't kill," is it circular?
      *   *The "Pointlessness" Objection:* If the bombings did nothing, Anscombe still calls it murder. Does this show the theory ignores *action-guidance*?
      *   *The "Unfalsifiability" Objection:* If no consequence can change the verdict, is it a moral theory or a linguistic stipulation?
      *   *The "Prediction" Objection:* What does this theory predict that utilitarianism doesn't? (Moral residue, agent integrity).

  4.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication of the student's query. Validate the worry about "hitting a wall."
      *   **Section 1: The Nature of the Beast (Substantive vs. Conceptual).** Address the distinction requested.
