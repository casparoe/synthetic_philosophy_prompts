  2.  **Deconstruct Anscombe's Position:**
      *   **Core Claim:** Intentionally killing the innocent is *always* wrong (absolute prohibition).
      *   **Mechanism:** Doctrine of Double Effect (DDE). Distinction between *intended* means/ends and *foreseen* side effects.
      *   **Truman Case:** Bombing cities *intends* civilian death (to terrorize/force surrender). Therefore, murder. Consequences (saving lives by ending war) are irrelevant to the *moral quality* of the act, though relevant to the *prudence*.
      *   **Nature of the Claim:** Is it empirical? No. Is it conceptual? Partly (definition of intention). Is it moral? Yes (absolute norm).

  3.  **Brainstorming Defeaters/Objections:**
      *   *The "Self-Defeating" Objection:* If the rule leads to more innocents dying (e.g., prolonging war), does it defeat its own purpose?
