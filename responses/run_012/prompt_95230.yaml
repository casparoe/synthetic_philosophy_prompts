  *(Self-Correction Note during final review)*: I need to be careful with the "Fatal" categorization. In philosophy, nothing is truly "fatal" unless it's a logical contradiction. I should frame "Fatal" as "Requires significant revision of the theory" vs "Awkward" as "Requires uncomfortable implications." I will use the user's framing but nuance it.

  Let's organize the "Substantive vs. Conceptual" distinction clearly. If it's conceptual (about what 'intention' means), empirical facts don't touch it. If it's substantive (about what is 'good'), empirical facts matter. Anscombe mixes them: The *definition* of murder relies on intention (conceptual), but the *prohibition* is moral (substantive). The vulnerability lies in the bridge between them.

