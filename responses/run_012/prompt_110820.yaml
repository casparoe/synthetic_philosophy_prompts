answer: |-
  You have stumbled onto the three central problems in the philosophy of history. You are not paranoid; you are doing epistemology.

  Here are the names, the lines between them, and where the existing vocabulary fails you.

  ### One: The Sentence That Needs the Future
  **The Name:** **Narrative Sentence** (coined by Arthur Danto).

  **The Concept:** A narrative sentence describes an event using knowledge that was unavailable to the participants at the time. "The mill owner started the town's decline" is a classic narrative sentence. In 1894, the owner was just opening a business; in 1924, you can see he started the decline. Danto argues these are not just perspectives; they are genuine *knowledge* that only exists for the historian.

  **The Line:** This is a linguistic and temporal problem. It concerns the *truth conditions* of a single statement.

  **Where the term falls short:** Danto defends these sentences as true, but he doesn't fully solve the moral discomfort you feel. It risks **Retrospective Determinism** (the fallacy that because X happened, it was inevitable). You need to ensure your sentence implies "This *led* to decline," not "This *was destined* to be decline."

  ### Two: The Shape That Can Be Wrong
  **The Name:** **Emplotment** (Hayden White) or **Configuration** (Paul Ricoeur).

  **The Concept:** This is the arrangement of facts into a story structure (tragedy, comedy, romance, satire). White argued that the facts don't dictate the plot; the historian *chooses* the plot. Your friend chooses "Reinvention" (Comedy/Romance); you choose "Decline" (Tragedy).

  **The Crucial Distinction:** You have identified a flaw in White's theory. White suggests emplotment is aesthetic or ideological. You are arguing that emplotment is **epistemic** (it holds knowledge). You say a new document *falsified* your shape. This means you believe the structure itself corresponds to reality, not just the facts within it.

  **The Name for your specific claim:** **Configurational Truth.**

  **The Line:** This is a structural problem. It concerns the *relationship* between statements.

  **Are One and Two the same?** No. One is the brick (the sentence); Two is the wall (the structure). You can have narrative sentences without a coherent plot, and you can have a plot without narrative sentences (though it's rare). However, they are both aspects of **Narrativity**.

  **Where the term falls short:** "Emplotment" implies a literary choice. "Configuration" is better, but still vague. There isn't a standard term for "a narrative structure that is falsifiable by evidence." Historians usually call this **Historical Explanation**, but that sounds too scientific. You are describing **Causal Topology**. If you want to coin a term for the phenomenon where the *arrangement* carries truth-value independent of the *content*, call it **Structural Assertion**.
  *   *What it wouldn't cover:* It wouldn't cover the emotional resonance of the story, only its logical fit to the evidence.

  ### Three: The Silence of the Workers
  **The Name:** **Archival Silence** (Michel-Rolph Trouillot) or **The Archival Grain** (Ann Laura Stoler).

  **The Concept:** Trouillot argues that history is not just what we write, but what is made possible to write by the archive. If the workers didn't write letters, they cannot have "turning points" in your narrative, because turning points are defined by documented decisions. This isn't just bias; it's **Ontological Inequality**. The workers exist in your book as a mass; the owners exist as individuals.

  **The Line:** This is the *source* problem. It explains *why* One and Two are skewed.

  **Is it separate?** It is distinct but causal. Problem Three (Archival Silence) creates the conditions that make Problem One (Narrative Sentences) easier for the owners than the workers, and forces Problem Two (Emplotment) into a shape that favors the owners' perspective (because their documents define the "turning points").

  ### The Synthesis: How they connect

  You asked for the lines. Here is the map:

  1.  **Problem One (Narrative Sentence)** is the **Unit of Time**. It solves how we speak about the past from the future.
  2.  **Problem Two (Configuration)** is the **Unit of Meaning**. It solves how we turn a list of events into an explanation.
  3.  **Problem Three (Archival Silence)** is the **Unit of Power**. It solves why some units of time and meaning are available to you and others are not.

  **Are they one phenomenon?**
  They are three layers of the same filter.
  *   Layer 1: The Archive (What survived?)
  *   Layer 2: The Plot (How do we arrange what survived?)
  *   Layer 3: The Sentence (How do we describe the arrangement?)

  **The Verdict on "Interpretation":**
  You asked if Two is just "interpretation." **No.**
  "Interpretation" suggests subjective opinion (e.g., "The mill owner was cruel").
  What you are describing in Two is **Explanatory Coherence**. You are claiming that "Decline" is a better *model* of the evidence than "Reinvention," in the same way a map is a model of terrain. A map can be wrong not because the landmarks are in the wrong place (the facts), but because the contours are drawn incorrectly (the shape).

  **A Coinage for your specific struggle:**
  Since you asked me to coin a term if existing ones fall short:

  Call Problem Two **Narrative Falsifiability**.
  *   **Definition:** The capacity for a historical narrative's *structure* (not just its facts) to be proven incorrect by new evidence.
  *   **Why coin it:** Because standard theory (Hayden White) says you *can't* falsify a plot, only the facts within it. You are asserting that the *shape* is a hypothesis.
  *   **What it wouldn't cover:** It wouldn't cover the literary quality or moral lesson of the history. It only covers the structural fit between evidence and story.

  **Summary for your work:**
  *   When you write "started the decline," you are writing a **Narrative Sentence**. Acknowledge the hindsight.
  *   When you argue your book's shape is "truer" than your friend's, you are arguing for **Configurational Truth**.
  *   When you worry about the workers, you are confronting **Archival Silence**.

  You are not just writing history; you are wrestling with the limits of historical knowledge. Keep the worry. It's the only thing keeping the work honest.
