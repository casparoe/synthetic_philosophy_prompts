answer: |-
  *   **Root:** Identical bodily state: Person A devastated, Person B indifferent. Do they differ in disease status?
      *   **Yes:** Status depends on experience/context.
          *   **Q1:** Is "disease" a useful tool (care, funding) or a mechanism of control?
              *   **Tool:** **Soft Normativism/Pragmatic Pluralism** (Concept earns keep by utility).
              *   **Control:** **Hard Normativism** (Disease is a myth/label of power).
              *   **Discard:** **Eliminativism** (Replace with thinner terms like injury or harm).
      *   **No:** Status is fixed by the body alone.
          *   **Q2:** Can we describe the bodily failure without referencing values? (e.g., painless life-shortening condition)
              *   **No:** **Hard Normativism** (Values always enter).
              *   **Yes:** There is a value-free dysfunction.
                  *   **Q3:** Does dysfunction require harm to count as disease? (e.g., male-pattern baldness)
                      *   **No:** **Hard Naturalism** (Values never enter; dysfunction suffices).
                          *   **Q4:** What fixes "function"? (e.g., condition common after 40 in one population)
                              *   **Social Reference Class:** **Unnamed Leaf 1** (Coherent but unexplored: Socially-Constructed Naturalism).
                      *   **Yes:** **Hybrid View** (Real dysfunction plus value-laden harm).
                          *   **Q5:** Is health merely absence of disease? (e.g., resilience/adaptability)
                              *   **No:** **Positive-Health View** (Disease is failure of capacity/resilience).
                              *   **Yes:** **Standard Hybrid** (Health is absence).

  **Commentary**

  This tree is designed to stall out at the points where your group will actually fight. Do not rush to the leaves; the value is in the branches.

  **The Reference Class Problem:** Branch Q4 is where the tree gets uncomfortable. If you choose Hard Naturalism, you must define "normal function." If you use statistics (what is typical), you must choose a reference class: species, sex, age, or occupation. If you choose occupation, you admit the norm is socially constructed. If a condition is universal in a population after forty (aging), but a visiting doctor calls it a disease, is the doctor wrong? Hard Naturalism struggles here. Unnamed Leaf 1 (Socially-Constructed Naturalism) is coherent—admitting norms are social while insisting dysfunction is real—but unattractive to purists on both sides. It is currently unexplored territory.

  **The Blur:** I cannot cleanly separate **Hybrid View** from **Soft Normativism**. Both require dysfunction and harm. The difference is metaphysical: the Hybrid theorist thinks the dysfunction is mind-independent; the Soft Normativist thinks the "dysfunction" itself is shaped by what we value. In practice, using cases like near-sightedness (corrected easily) versus a subjective condition with no marker, these positions yield the same verdicts. Flag this during discussion: if someone argues for Hybrid, ask them if the "dysfunction" would exist without human values. If they hesitate, they are Soft Normativists.

  **Using the Cases:**
  *   **Painless life-shortening condition:** Use this at Q2. If it's a disease without suffering, you lean Naturalist.
  *   **Male-pattern baldness:** Use this at Q3. It is a dysfunction by some metrics but rarely a disease. If you say it's not a disease because it doesn't harm, you are Hybrid.
  *   **Condition common after 40:** Use this at Q4. If it's statistical normality but pathological, statistics fail.
  *   **Historical reclassification:** Use this for Hard Normativism. If a state used to be a disease and no longer is (or vice versa) without biological change, disease is a verdict, not a fact.
  *   **Resilience/adaptability:** Use this at Q5. If a person manages a dysfunction without loss of capacity, are they healthy? Positive-Health says yes; Standard Hybrid says no.

  **Strategy:** Start with the Root. Clinicians often want to say "No" (it's about the body), while anthropologists often want to say "Yes" (it's about the life). Force them to defend the branch, not the leaf. If a clinician insists on Hard Naturalism, press them on the reference class (Q4). If an anthropologist insists on Hard Normativism, press them on the painless life-shortening condition (Q2). The goal isn't to find the right leaf, but to expose why the others are untenable.

  **Word Count Note:** This taxonomy omits the "value-free description" branch for the "Yes" root path to save space, as it collapses into Normativism anyway. Keep the discussion focused on the tension between biological fact and social verdict.
