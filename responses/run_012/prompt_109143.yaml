answer: |-
  You are describing the mechanics with precision, but you are interpreting the intent through a lens of American individualism or French antagonism that doesn't fit the German constitutional landscape. You ask why the state holds the pen. The answer is that the state holds the pen precisely to ensure it does not interfere in the church's internal affairs. If the churches were to collect this revenue themselves, they would require access to your income data, which would entangle them in state surveillance mechanisms far more deeply than the current arrangement. By having the Finanzamt collect the surcharge and transfer it as a lump sum, the state acts as a neutral billing agent for a recognized public corporation, not as a theological gatekeeper. The act of going to the Amtsgericht to leave is not a declaration of apostasy; it is a civil law procedure to terminate a financial contract. You can believe in God, attend mass, and receive communion until the day you die, but if you do not wish to fund the institutional apparatus, you must sever the legal tie. The state records that severance because it needs to know who to bill, not because it cares what you believe.

  Your point about neutrality assumes that neutrality means indifference, but the Basic Court has long defined religious neutrality as supportive openness. The state is not buying a subscription service for the church; it is securing a partner in the provision of public welfare. You mention the wealth of the churches, but you overlook where that money goes. It does not primarily line the bishops' pockets; it funds Caritas and Diakonie, which operate a vast network of hospitals, kindergartens, elderly care homes, and counseling services that the state would otherwise have to fund directly. The church tax guarantees that these institutions have a stable budget independent of the fluctuating piety of the Sunday crowd. If we moved to an opt-in donation model, the churches would become dependent on voluntary contributions, which would inevitably pressure them to tailor their social services to what is popular rather than what is necessary. The tax preserves the church's ability to act counter-culturally and maintain social infrastructure without begging for state grants that come with state strings attached.

  As for your friend's point about the Humanists, he is correct that the status of a public-law corporation is theoretically open to worldview communities, but he misses why the bar is set so high. It is not enough to have a philosophy; one must demonstrate stability, size, and a guarantee of loyalty to the constitutional order. The state grants this status not to endorse the content of the belief, but to recognize the organization's capacity to function as a reliable public partner. The fact that few secular groups qualify is a reflection of their organizational structure, not state discrimination. You argue that the system looks like state enforcement of religion, but I would argue it is the only mechanism that allows religious bodies to remain financially autonomous while integrated into the social safety net. If you remove the tax, you do not get freedom; you get either state-subsidized churches or churches that are too poor to run hospitals. So I ask you: in your model, how do you ensure the continuity of these social services without making the churches dependent on the very state budgets you claim they should be separated from?
