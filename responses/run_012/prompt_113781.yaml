prompt: |-
  I'm a journalist who covers science and ideas, and I've been reporting on hospital triage protocols—the kind used in disasters, where you score patients and sometimes have to leave someone to die because there's not enough vents or ICU beds. The protocols read as if there's always a right answer: rank, allocate, move on. But the clinicians I talk to describe it as a genuine dilemma, not just a hard call. So what philosophical commitments does the practice of triage presuppose about moral dilemmas? Does the scoring system presuppose that dilemmas are only epistemic—that there's a fact of the matter about who should get the vent, we just don't know it—or does it leave room for genuine moral remainders, where you do the right thing and still have done something wrong? Does it assume moral costs are always commensurable, that a saved life can outweigh a lost one, or does it allow that some wrongs aren't compensable? And if we took genuine dilemmas seriously, what would have to change—would we need lotteries, consolation rituals, something else? Reconstruct the implicit theory, separate what's strictly presupposed from what's just a coping mechanism, and tell me where the practice is underdetermined. Under 400 words, lead with the bottom line.
