      The practice is underdetermined at the threshold. Why is a SOFA score of 8 the cutoff? That's not science; it's a hidden value judgment about who is worth saving. The math masks the moral choice. Furthermore, utilitarianism doesn't dictate prioritizing life-years over lives saved; that is a normative choice disguised as clinical objective fact.

      If we took genuine dilemmas seriously, protocols would admit that letting someone die is a moral injury, not just a statistical necessity. We might see lotteries among equally qualified patients to acknowledge equal moral worth despite unequal fate. We would need consolation rituals—institutional mourning for those deprioritized—acknowledging that the survivors are not simply "right," but lucky beneficiaries of a tragic wrong. The protocol would shift from providing absolution to acknowledging loss. Currently, the system demands clinicians bear the weight of remainders individually, while the institution claims the purity of the algorithm. Recognizing the dilemma would collectivize the guilt, transforming triage from a calculation of worth into a tragedy of scarcity.

