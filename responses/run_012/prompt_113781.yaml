      Triage protocols presuppose moral dilemmas are merely epistemic: there is a correct allocation, and the scoring system reveals it. They deny genuine moral remainders—the idea that you can do the best possible thing and still commit a wrong. Instead, they operate on a utilitarian calculus where lives are commensurable units. A saved life outweighs a lost one; the moral debt is paid by the aggregate good.

