  ok so i'm a backend dev, zero philosophy background, and i need help settling an argument between my best friend and his wife that has honestly gotten kind of tense.

  Here's the setup. My friend has a hereditary eye thing, not dangerous, but glasses don't really fix it and he'll very likely pass it on. His wife's doctor told them that if they wait about a year, she can come off one of her meds first and the odds of the kid having it drop a lot. So the choice is roughly: try now, maybe 50/50 the kid has it, or wait a year and the odds are way lower.

