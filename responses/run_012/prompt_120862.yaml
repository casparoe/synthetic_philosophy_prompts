prompt: |-
  I'm putting together a short research proposal for a one-term project (8000 words or so) and want you to draft it. My half-formed idea: everyone treats self-amendment in Nomic-style games, where changing the rules is itself a move, as where the paradox lives, but I think the really hard case is what I've been calling parasitic ammendment — a rule that, once passed, purports to invalidate the very procedure that passed it (it declares the old amendment clause void, or retroactively lowers its own threshold). Now the new rule's validity seems to rest on a procedure the new rule says was never valid. Is that a flat contradiction, an unstable-but-liveable equilibrium, or just something rule-systems absorb through convention — and does the answer come apart between a game, where the players themselves have to settle what the rules now say, and a legal order, where courts and entrenched clauses (the constitutional-theory thought that the power to amend isn't the power that constituted the thing) do the settling?

  Draft the proposal: state the question so it has a determinate answer, explain why the standard treatments of legal self-reference leave it open, set out what I'd actually do — I want at least one minimal formal test, a handful of numbered rules where I try to derive both 'R is valid' and 'R is not valid', plus the conceptual argument — then say what a result looks like, what would count as the project failing, and a scope that one term can bear. Don't bother with citations, I'll add them.
