answer: |-
  **Project Title:** Parasitic Amendment: Self-Invalidation in Games and Legal Orders

  **1. Research Question**
  Standard theories of legal self-reference ask whether a rule system can change its own foundations. This project asks a narrower, more volatile question: **Does the validity of a 'parasitic amendment'—a rule that invalidates the procedure that enacted it—depend on internal logical consistency or external institutional authority?**

  This question admits a determinate answer. The project will argue that logical consistency is insufficient to determine validity. Instead, validity turns on the presence of an authoritative adjudicator capable of sustaining the contradiction. In a game (like *Nomic*), where players are the ultimate adjudicators, parasitic amendments are conventionally stable. In a legal order, where courts mediate validity, they are logically fatal unless ratified by a higher-order norm.

  **2. Background and Gap**
  The literature on legal self-reference typically focuses on the "amendment paradox": can a constitution amend the clause that empowers amendment? Standard treatments (hierarchical norms, basic norms, rules of recognition) resolve this by positing a persistent power to amend or a shift in the rule of recognition. They assume the amendment power survives the transition.

  This leaves a gap. These models do not account for *parasitic amendment*, where the new rule explicitly declares the enabling procedure void *ab initio* or retroactively lowers the threshold such that the enactment itself becomes technically illegal under the new standard. Here, the new rule eats the ladder it climbed. Standard treatments assume the system absorbs the change; they do not explain what happens when the change denies the validity of the change itself. This creates a Liar Paradox structure ("This statement is false") within the normative system. Existing theory treats this as a curiosity of logic games, failing to distinguish how legal orders resolve it differently from closed rule-games.

  **3. Methodology**
  The project will proceed in two stages: a formal stress-test and a conceptual comparison.

  *Stage 1: The Minimal Formal Test*
  I will construct a minimal deontic logic system, *System P*, consisting of three rules:
  1.  **R1 (Procedure):** Amendments require a 2/3 majority vote.
  2.  **R2 (Enactment):** A specific proposal passes with a 2/3 vote.
  3.  **R3 (Content):** "R1 is void ab initio; amendments require only a simple majority."

  I will attempt to derive both 'R3 is valid' and 'R3 is invalid' within *System P*.
  *   *Derivation A:* R3 is valid because it was passed according to R1.
  *   *Derivation B:* R3 is invalid because, if R3 is valid, R1 was void at the time of voting, meaning the 2/3 threshold did not exist, meaning the vote was procedurally defective.

  This formal sketch will demonstrate that the system produces a contradiction (Valid ∧ Invalid) without an external decision rule. This proves that logic alone cannot resolve the paradox.

  *Stage 2: Conceptual Comparison (Game vs. Law)*
  Having established the logical impasse, I will analyze how two distinct systems resolve it:
  *   **The Game Context:** In *Nomic*-style games, there is no court. Players must agree on the state of the rules. I will argue that here, validity is purely sociological. If players accept R3, R3 is valid, regardless of the contradiction. The paradox is absorbed by convention.
  *   **The Legal Context:** In constitutional law, courts act as external arbiters relative to the amendment procedure. I will argue that courts will not accept the logical contradiction. They will either strike down R3 (preserving R1) or validate R3 by appealing to a higher-order principle (e.g., popular sovereignty) that bypasses R1. The paradox is resolved by hierarchy, not convention.

  **4. Expected Results**
  A successful project will produce a taxonomy of outcomes for parasitic amendments:
  1.  **Logical Collapse:** The system fails to generate a truth value for the rule (demonstrated in *System P*).
  2.  **Conventional Absorption:** The system accepts the rule based on player consensus (demonstrated in Games).
  3.  **Adjudicative Resolution:** The system accepts the rule based on higher-order authority (demonstrated in Law).

  The determinate conclusion will be that parasitic amendments are not logical problems but jurisdictional ones. They reveal that validity is not a property of the rule text, but of the institution empowered to ignore the contradiction.

  **5. Conditions for Failure**
  The project will fail if:
  *   The formal test proves trivial (i.e., if standard deontic logic easily resolves the contradiction without external input).
  *   The distinction between game and legal orders collapses (i.e., if I cannot demonstrate that courts function differently from players in this specific context).
  *   The scope expands beyond the specific mechanism of *self-invalidation* into general amendment theory.

  **6. Scope and Feasibility**
  This project is designed for an 8,000-word limit over one term.
  *   **Word Count Allocation:**
      *   Introduction & Question: 1,000 words.
      *   Critique of Standard Self-Reference: 1,500 words.
      *   Formal Test (System P): 1,500 words.
      *   Comparative Analysis (Game vs. Law): 3,000 words.
      *   Conclusion: 1,000 words.
  *   **Feasibility:** The formal test is minimal and does not require complex modeling software, only logical derivation. The comparative analysis relies on established jurisprudential distinctions (rules vs. standards, internal vs. external points of view) rather than new empirical data. The focus remains tightly on the *moment of self-invalidation*, avoiding a general history of constitutional amendment.

  This scope ensures the argument remains deep rather than broad, delivering a definitive answer to the specific paradox of parasitic amendment.
