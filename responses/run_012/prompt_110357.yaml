answer: |-
  **CALDER BUREAU OF PREVENTIVE CUSTODY**
  **STAFF HANDBOOK SECTION 7.1: CONTAINMENT DETERMINATIONS**
  **PUBLIC SAFETY (CONTAINMENT) ACT 2014 (COMMENCEMENT: 14 FEB 2015)**

  **Q 7.1.4: Subject A (negligent homicide) and Subject B (premeditated homicide) present identical actuarial risk scores (0.85). Do containment terms differ?**
  **A:** No. Under Section 3(b), duration is strictly forward-looking. Differentiation based on past culpability constitutes prohibited retributive modeling. Both subjects require containment until risk scores drop below 0.40. However, Subject B requires Module 4 (Intent Recalibration), whereas Subject A requires Module 2 (Negligence Mitigation). Containment facilities remain identical to avoid visual signaling of moral hierarchy. Staff must not refer to Subject B as "worse," only "higher complexity."

  **Q 7.1.9: Release Panel observes detainee expresses no remorse. Risk score is low. May release proceed?**
  **A:** Caution advised. While risk is primary, lack of remorse correlates with non-compliance post-release. Panel must record decision as "Risk Uncertainty" rather than "Moral Deficit." Do not cite "failure to accept blame" in official minutes. Use "failure to acknowledge causal agency." If detainee claims innocence despite evidence, classify as "Reality Monitoring Failure," which sustains containment under Safety Clause 9. Ensure家属 (family) are not told detainee is being held for attitude; state they are held for "unresolved hazard parameters."

  **Q 7.1.12: Victim's family requests detention extension to "balance the scales." Statute provides no mechanism for this.**
  **A:** Inform family that "balancing" is linguistically non-compliant. The Act abolished desert as a currency. Offer Restorative Dialogue Package. If they insist on suffering allocation, refer to Office of Statutory Limitations. Do not validate the concept of "just deserts." If family asks why the detainee suffers if not for justice, state: "Containment is a side-effect of safety, not a goal." Do not elaborate on why safety requires isolation rather than monitoring.

  **Q 7.1.15: Finance Office notes community-based prevention is 80% cheaper than containment for low-risk subjects. Why retain custody?**
  **A:** Bureau mandate is Preventive Custody, not Preventive Spending. Cost-efficiency is secondary to Containment Integrity. Redirect query to Legislative Oversight. Note that releasing subjects to cheaper programs increases public perception of risk, which may lower compliance rates. Containment provides visible assurance of hazard management. The cost is a feature of public confidence, not an error.

  **APPENDIX 7.C: PROHIBITED VOCABULARY UPDATE 11**
  **Term:** "Desert." **Status:** Banned. **Replacements:** "Liability Window," "Consequence Entitlement," "Past-Act Weighting."
  **Term:** "Punishment." **Status:** Banned. **Replacements:** "Safety Adjustment," "Containment Interval," "Restrictive Mitigation."
  **Term:** "Guilty." **Status:** Banned. **Replacements:** "Causally Linked," "Risk-Verified."
  **Term:** "Release." **Status:** Deprecated. **Replacement:** "Community Reintegration Phase."

  **[HANDWRITTEN MARGINALIA]**
  *We abolished the reason for the cages but kept the cages. Now we lock them up for what they might do, but we only let them out when they admit what they did. We didn't end punishment. We just made it honest about being dangerous, then lied about why we keep them. The forms are cleaner. The conscience is not.*
  *— J. Harkness, Sr. Caseworker (Ret.)*

  **END OF SECTION**
