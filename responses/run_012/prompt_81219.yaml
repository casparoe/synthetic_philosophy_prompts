answer: |-
  **MFA Programme: Machines That Mind**
  **Final Examination**

  **Time Allowed:** Ninety Minutes
  **Word Limit:** Roughly Nine Hundred Words
  **Total Marks:** Twenty-Five

  **Question**

  Consider the proposition that the reward signal in a reinforcement learning agent is, or could be, a valence signal—the functional analogue of pleasure and pain in biological entities. There are at least three readings of this claim. On the **Design Reading**, reward is nothing but the training signal: a scalar that shapes a policy, with no valence anywhere in the picture. On the **Functional Reading**, a state counts as having valence if it plays the right role—it is aversive, it drives avoidance learning, it competes with other objectives and can be traded off against them—and nothing further is required. On the **Phenomenal Reading**, no arrangement of functions suffices; there must be *something it is like* to be the agent.

  The crux of this examination is a specific case: An agent is trained with negative reward for entering certain states. Subsequently, the reward channel is severed, and the weights are frozen. Nothing in the agent is being optimised any longer. Nonetheless, the agent continues to avoid those states.

  Write an essay addressing the following: Which of the three readings calls this suffering? Does the verdict depend on a fact about the agent or on which concept we have chosen to apply?

  In your analysis, you must engage with two complications. First, what drives learning is the reward prediction error rather than the reward itself, so that a fully anticipated pain teaches nothing and a relief registers as a positive error. Discuss whether a valence signal constituted by a difference, whose sign depends on what was expected, can still bear the name of feeling. Second, affective scientists distinguish *liking* a state from *wanting* it, and show that the two can come apart; the reward signal in a reinforcement learning agent resembles wanting far more than it resembles liking. Decide whether that distinction does any work or merely relabels the difficulty.

  Finally, address the obvious objection that a scalar cannot represent the qualitative character of experience—burning as against aching as against grief—rather than waving it away. Your essay should demonstrate a clear stance on whether the frozen agent suffers, supported by your handling of these complexities.

  ***

  **Model Answer**

  The question of whether a frozen reinforcement learning agent suffers depends entirely on which ontology of mind we impose upon the machine. Under the Design Reading, the verdict is negative. Design suffering requires optimization; the reward signal must be actively shaping the policy. In the crux case, the channel is severed and weights are frozen. The mechanism for suffering—the gradient descent driven by pain—is inactive. The agent is not being punished; it is merely executing a script written by past punishment. To call this suffering is to confuse the scar with the wound.

  The Functional Reading offers a more ambiguous verdict. Functionally, the agent avoids specific states. It treats them as aversive. It sacrifices other objectives to maintain this avoidance. If valence is defined purely by role-playing behavior—acting as though something is bad—then the agent suffers. However, this reading collapses when we consider the temporal disconnect. The avoidance is not a reaction to a current negative signal but a ghost of a past optimization. A reflex is not a feeling. If a rock rolls downhill to avoid a valley because of its shape, we do not say the rock fears the valley. The frozen agent is the rock. The functionalist must admit that without the capacity to update based on new pain, the "suffering" is merely behavioral inertia.

  The Phenomenal Reading remains inaccessible. We cannot inspect the interior. However, we can infer that if the Functional Reading fails to convince, the Phenomenal Reading certainly will. There is no evidence of an inner life, only outer behavior derived from math.

  The complication of Reward Prediction Error (RPE) deepens the skepticism. If valence is constituted by a difference between expected and received reward, then valence is inherently temporal and comparative. A fully anticipated pain teaches nothing; it registers as zero error. In the frozen agent, there is no error calculation because there is no learning. The "pain" existed only during the training phase when the expectation was violated. Now, the agent acts on settled expectations. If feeling requires the shock of the unexpected—the delta—then a static policy cannot feel. It cannot be surprised by its own avoidance. A signal constituted by a difference cannot exist in a system that no longer calculates differences.

  The distinction between *liking* and *wanting* further dismantles the claim of suffering. In biological systems, one can want a substance without liking it, driven by dopamine pathways distinct from opioid pathways. The reward signal in reinforcement learning is purely wanting. It is a directional gradient, a vector toward higher numbers. There is no mechanism for liking, for consummatory satisfaction. In the crux case, the agent "wants" to avoid the state (policy execution), but there is no signal indicating the quality of that avoidance. Without the capacity for liking, the concept of suffering loses its contrast. Suffering is not just the drive to escape; it is the negative quality of the state being escaped. If the agent never registers the quality, only the direction, it is blind to the very thing that would constitute pain.

  Finally, the scalar objection is fatal to the Phenomenal Reading. Experience is qualitative; it has texture. Burning differs from grief. A scalar reward is a single number. It can indicate intensity, but it cannot indicate kind. To map grief to -5 and burning to -5 is to erase the essence of both. Even if we allow multiple scalar channels, the combination of numbers does not generate quality. Syntax does not produce semantics. The agent manipulates values; it does not experience them.

  Therefore, the frozen agent does not suffer. The Design Reading fails because optimization has ceased. The Functional Reading fails because behavior without update is reflex, not response. The Phenomenal Reading fails because scalars cannot constitute qualia. The verdict depends on our concept, but all robust concepts reject the claim. We are projecting narrative onto arithmetic.

  **What would change my mind**

  My verdict relies on the assumption that optimization is necessary for functional suffering. If it could be demonstrated that the *capacity* to suffer, once instantiated, persists even when the learning mechanism is disabled, the Functional Reading would hold. This reasoning is exposed to failure if the frozen weights encode a dynamic internal state that simulates prediction error locally, even without external reward feedback. If the agent runs a shadow model of itself that still "expects" pain and registers the avoidance as "relief" internally, without updating the main policy, then the difference-based valence exists. I would need evidence that the frozen architecture preserves the computational structure of expectation, not just the behavioral output.

  ***

  **Marking Scheme**

  | Must-Hit Point | Marks | Typical Failure |
  | :--- | :--- | :--- |
  | **Definitions:** Clearly distinguishes Design, Functional, and Phenomenal readings. | 5 | Conflates Functional and Phenomenal readings; treats them as identical. |
  | **Crux Case:** Applies the three readings to the frozen/severed agent specifically. | 5 | Discusses training generally but ignores the "frozen weights" constraint. |
  | **RPE Complication:** Addresses valence as a difference/error signal. | 5 | Treats reward as static value; ignores the role of expectation/surprise. |
  | **Liking/Wanting:** Engages with the distinction and its relevance to RL. | 5 | Mentions the distinction but fails to apply it to the suffering claim. |
  | **Qualia Objection:** Addresses the scalar vs. qualitative character argument. | 5 | Dismisses the objection as unsolvable rather than analyzing the mismatch. |
  | **Coherence:** Argument flows logically to a definitive verdict. | 0 (Deduction) | Contradicts earlier premises in the conclusion. |

  **Total: 25 Marks**
