prompt: |-
  I teach a 300-level ethics seminar, 16 students, 75 minutes, and every year we get to Scanlon's contractualism and the aggregation objection lands as a shrug. Can you design an in-class thing where they actually feel the squeeze instead of hearing me describe it? They shouldn't hear the name of the problem until the debrief.

  Heres the shape I'm imagining. Round one: I hand out role cards making everyone a complainant under some policy. One person bears something grave, a few bear something mid-level, ten bear something mild but genuinely different in kind from the others — not just smaller, or they'll turn it into arithmetic and we learn nothing. They have to adopt a principle governing when the policy may be imposed, and the rule I enforce with a literal gavel is that nobody may justify a principle by citing totals or numbers of people; every defense has to be addressed to the worst-off individual, in terms they could accept from their own standpoint. Round two: I put the gavel down and say, justify it however you like. I want them to watch the room flip. Round three: they must write a tie-breaking rule for cases where complaints are equal in strength, then I spring the case where they aren't equal and see whether they let numbers back in through that door.

  Give me materials, timings, the actual wording of the cards, and a way to stop the grave-burden person from folding under social pressure. Then the debrief: map what happened onto the individualist restriction, onto the work the word reasonable is quietly doing in reasonable rejectability, and onto the two escape routes — aggregate inside the principle, or aggregate only in tie-breaking — plus where the ex ante/ex post version of the question changes who even counts as worst off. Tell me what will predictably go wrong the first time I run it, and be honest about what the activity cant reproduce: it can show them what the restriction costs but not why anyone should pay it, and I'll have to supply that part myself.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** 300-level ethics seminar, 16 students, 75 minutes.
      *   **Topic:** Scanlon's Contractualism & The Aggregation Objection.
      *   **Goal:** Make students *feel* the tension (the "squeeze") of the non-aggregation constraint, not just hear about it.
      *   **Constraint:** Do not name the problem until the debrief.
      *   **Structure:**
          *   Round 1: Role cards (1 grave, few mid, 10 mild/different kind). Rule: No citing totals/numbers. Justify to the worst-off individual. Instructor enforces with a gavel.
          *   Round 2: Gavel down. Justify however they like (utilitarian/aggregation allowed).
          *   Round 3: Write a tie-breaking rule for equal complaints, then introduce unequal case to see if numbers sneak in.
          *   Debrief: Map to Individualist Restriction, "Reasonable Rejectability," escape routes (aggregate inside principle vs. tie-breaking), ex ante/ex post distinction.
          *   Troubleshooting: Predict failures, protect the "grave burden" student from social pressure, acknowledge limitations (shows cost, not justification).
      *   **Deliverables:** Materials, timings, card wording, facilitation tips, debrief script, troubleshooting.

  2.  **Deconstruct the Philosophical Core:**
      *   *Scanlon's Formula:* An act is wrong if its performance under the circumstances would be disallowed by any set of principles for the general regulation of behaviour that no one could reasonably reject as a basis for informed, unforced general agreement.
      *   *The Individualist Restriction:* Complaints must be made by individuals against principles, not by groups against outcomes. You can't say "10 people suffer a bit" outweighs "1 person suffers a lot." You have to compare the strongest individual complaint against the strongest individual complaint.
      *   *The Aggregation Objection (Taurek/Scanlon):* If 1 person will lose a life vs. 5 people will lose an arm, contractualism seems to say save the life (stronger individual complaint). But intuition says save the 5 arms (aggregation).
      *   *The "Squeeze":* Students need to feel the frustration of not being allowed to say "but there are more of us!" in Round 1, and the relief/guilt of being allowed to in Round 2.

  3.  **Drafting the Scenario (The "Policy"):**
      *   Needs to be high stakes but plausible enough for a seminar.
      *   Needs distinct *kinds* of burdens to prevent simple arithmetic.
      *   *Idea:* A resource allocation scenario during a crisis.
      *   *Scenario:* "The Ventilation Protocol." A building system failure.
      *   *Burdens:*
          *   Grave: Permanent lung damage/loss of life expectancy (1 person).
          *   Mid: Hospitalization for severe respiratory distress (3 people).
          *   Mild (but distinct): Permanent mild asthma/chronic cough (12 people).
      *   *Wait, the prompt asks for:* 1 grave, a few mid, 10 mild. Total 16 students.
      *   *Refinement:* Let's make the "mild" burden qualitatively different so they can't just say "my cough is 1/10th of your death." It needs to be a different *category* of loss to block arithmetic.
      *   *Revised Scenario:* "The Research Consent Waiver." A medical study requires bypassing consent for speed.
          *   Person A (Grave): Risk of permanent cognitive impairment (1 student).
          *   Persons B-D (Mid): Risk of severe temporary disability/bedridden for months (3 students).
          *   Persons E-P (Mild/Different): Risk of permanent loss of specific sensory acuity (e.g., night vision or hearing range) (12 students).
      *   *Actually, let's stick closer to the prompt's "Policy" framing.* Let's use a "Safety Regulation Waiver."
      *   *Policy:* "Emergency Protocol 7." We can bypass safety checks to save time/resources.
      *   *Outcome if Policy Passes:*
          *   1 Person: Loss of limb (Amputation).
          *   3 People: Broken bones/Surgery (Hospitalized).
          *   12 People: Chronic pain/Mobility restriction (Cannot run/walk far).
      *   *Why this works:* Amputation is clearly the "grave" burden. The 12 have a "mild" burden but it's *different* (chronic pain vs. acute loss). This blocks "12 x mild = 1 x grave" easily because the *kind* of life change is different.

  4.  **Developing the Rounds:**
      *   **Round 1 (The Contractualist Cage):** 20 mins. Rule: "No Aggregation." Must address the person with the Amputation card.
      *   **Round 2 (The Utilitarian Release):** 15 mins. Rule: "Maximize Overall Welfare."
      *   **Round 3 (The Tie-Breaker Trap):** 15 mins. Create a rule for ties. Then introduce a variation where the grave burden is slightly less grave, but the numbers are huge.
      *   **Debrief:** 25 mins.

  5.  **Protecting the "Grave Burden" Student:**
      *   This is crucial. If the class gangs up on the one person, it's traumatic, not educational.
      *   *Mechanism:* The instructor acts as the "Trustee" for that student. Or, make the cards anonymous/secret? No, they need to know who is who to address them.
      *   *Better:* The rule is "You must address the *role*, not the *person*." But social pressure is real.
      *   *Best:* The Instructor intervenes aggressively if the group tries to bully. Also, frame the "Grave Burden" not as "You lose" but as "You hold the Veto." Give them power, not just victimhood. In Scanlonian terms, the person with the strongest complaint has the power to *reject* the principle. I need to make sure they know they hold the veto power in Round 1.

  6.  **Drafting the Materials:**
      *   Need clear Role Cards.
      *   Need a "Charter" for Round 1.
      *   Need a specific prompt for Round 3.

  7.  **Anticipating Failure Modes:**
      *   *Arithmetic Creep:* Students in Round 1 will try to say "But collectively..." Instructor must gavel this down hard.
      *   *The "Grave" Student Folds:* They might say "Okay, fine, sacrifice me." Instructor needs to pause and ask, "Are you speaking for yourself or the group?"
      *   *Time Management:* 75 mins is tight. Need strict timing.
      *   *Abstraction:* Students might get stuck on medical details. Keep the harms abstract enough.

  8.  **Refining the Debrief:**
      *   Connect Round 1 to the *Individualist Restriction*.
      *   Connect the frustration to *Reasonable Rejectability*.
      *   Connect Round 3 to *Aggregation within Principles* (Scanlon's later move) vs. *Tie-Breaking*.
      *   Connect Ex Ante/Ex Post: Did we decide before knowing who gets which card? (This changes the "worst off" calculation).

  9.  **Writing the Plan (Iterative refinement):**
      *   *Timing:* 5 intro, 20 R1, 15 R2, 15 R3, 20 Debrief. (75 total).
      *   *Cards:* 1 Red (Grave), 3 Yellow (Mid), 12 Blue (Mild/Different).
      *   *Harm Specifics:*
          *   Red: Permanent loss of use of dominant hand.
          *   Yellow: 6 months recovery, severe pain.
          *   Blue: Permanent inability to engage in high-impact sport/hobby (qualitatively different loss of life quality, not health per se).
      *   *Wait, the prompt says:* "10 bear something mild but genuinely different in kind." 1+3+12 = 16. Perfect.
      *   *Protection:* The Red card holder is the "Veto Holder." Explicitly tell them in Round 1: "Your objection alone can kill this policy."

  10. **Final Review against Constraints:**
      *   Did I name the problem early? No.
      *   Is there a gavel mechanic? Yes.
      *   Is there a Round 3 tie-breaker trap? Yes.
      *   Is the debrief detailed? Yes.
      *   Did I address the "what goes wrong" and "limitations"? Yes.

  11. **Polishing the Tone:**
      *   Needs to be instructional, precise, and empathetic to the instructor's workload.
      *   Ensure the philosophical mapping is accurate to Scanlon (specifically *What We Owe to Each Other* and his responses to the aggregation objection).

  *(Self-Correction during drafting)*: I need to make sure the "Mild" burden isn't just "less pain." It needs to be a different *kind* of loss so they can't sum it. Let's make the Mild burden about *autonomy/restriction* vs. the Grave burden about *bodily integrity*.
  *   Grave: Permanent physical impairment.
  *   Mid: Long-term pain/recovery.
  *   Mild: Permanent restriction on liberty (e.g., cannot travel/cannot choose residence).
  *   *Actually, keep it simpler.* Scanlon's example is often Life vs. Arm. Let's use:
      *   1 Person: Death (or equivalent permanent vegetative state).
      *   3 People: Loss of Limb.
      *   12 People: Permanent Chronic Pain (manageable but constant).
      *   *Wait, prompt says:* "10 bear something mild... genuinely different in kind."
      *   Let's go with the "Research Waiver" idea. It allows for different *types* of risk.
      *   Red: Risk of Cognitive Decline.
      *   Yellow: Risk of Physical Disability.
      *   Blue: Risk of Sensory Loss.
      *   This makes aggregation hard because you can't easily compare "seeing less" to "thinking less."

      *Decision:* Let's stick to the "Safety Protocol" but make the Mild burden about *Opportunity* rather than *Health*.
      *   Red (1): Permanent Health Damage (e.g., Lung capacity -50%).
      *   Yellow (3): Temporary Health Damage (e.g., Hospitalized 2 months).
      *   Blue (12): Permanent Opportunity Loss (e.g., Barred from certain careers due to certification loss).
      *   *Critique:* This might get too bogged down in details.
      *   *Simpler:*
          *   Red: Loss of Life Expectancy (20 years).
          *   Yellow: Loss of Mobility (Wheelchair bound).
          *   Blue: Loss of Sensory (Blindness in one eye).
          *   *Problem:* Blindness in one eye is pretty grave.
          *   *Okay, let's follow the prompt's "Mild but different in kind" strictly.*
          *   Red: Severe Physical Injury.
          *   Yellow: Moderate Physical Injury.
          *   Blue: Severe Financial Loss (different kind).
          *   *Why?* Because money vs. body is the classic incommensurability.
          *   *Let's go with:*
              *   1 Student: Permanent Physical Disability.
              *   3 Students: Temporary Physical Disability.
              *   12 Students: Permanent Financial Ruin (Bankruptcy).
              *   *Rationale:* This forces the "different in kind" constraint. You can't add up bankruptcy to equal a leg easily.

      *Wait, one more check:* The prompt says "10 bear something mild." Bankruptcy isn't mild.
      *   *Okay, final decision on harms:*
          *   1 (Red): Permanent loss of a specific bodily function (e.g., kidney function).
          *   3 (Yellow): Severe temporary illness (bedridden 3 months).
          *   12 (Blue): Permanent loss of a specific liberty (e.g., cannot drive).
          *   *Why:* Losing the ability to drive is a hassle/quality of life issue (mild compared to kidney failure), but it's a *liberty* restriction, not a *health* restriction. This blocks arithmetic.

      *Actually, I will provide the instructor with the option to choose the specific harms, but I will recommend the "Health vs. Liberty" split to ensure the "different in kind" constraint works.*

      *Let's refine the "Protection" aspect.* The Red card holder needs to feel empowered, not targeted. I will instruct the teacher to frame the Red card as the "Veto Power."

      *Let's refine Round 3.* The prompt asks for a tie-breaking rule for *equal* complaints, then spring a case where they *aren't* equal.
      *   Step 1: Class writes a rule for "What if two people have the exact same complaint?"
      *   Step 2: Instructor reveals a case where the complaints are *almost* equal, but numbers differ. Does the tie-breaker allow numbers?
      *   This maps to Scanlon's "Relevance of Numbers" discussion.

      *Okay, ready to write.*
answer: |-
  Here is a complete lesson plan designed to induce the philosophical "squeeze" of Scanlonian contractualism without naming it until the end.

  ## Lesson Overview
  *   **Topic:** The Individualist Restriction & The Aggregation Objection.
  *   **Time:** 75 Minutes.
  *   **Students:** 16.
  *   **Materials:** 16 Role Cards (color-coded), 1 "Charter" slide/handout, 1 Gavel (or loud stapler), Whiteboard.
  *   **Goal:** Students experience the frustration of non-aggregation (Round 1), the relief/guilt of aggregation (Round 2), and the instability of tie-breaking (Round 3).

  ---

  ## Part 1: Setup & Round 1 (The Contractualist Cage)
  **Time:** 0:00 – 0:25 (25 mins)

  ### 1. The Scenario (2 mins)
  **Instructor Script:**
  "Imagine you are a committee designing a mandatory safety protocol for a new national infrastructure project. The protocol speeds up construction but carries risks. You must decide on a **Principle of Acceptable Risk**. Once you agree on a principle, it applies to all of you. You will now be assigned your specific outcome under this policy."

  ### 2. Distribution (3 mins)
  Hand out the cards face down. Tell them not to show anyone yet.
  *   **1 Red Card (The Grave Burden)**
  *   **3 Yellow Cards (The Mid Burden)**
  *   **12 Blue Cards (The Mild/Different Burden)**

  **Card Wording:**
  > **RED CARD:** Under this policy, you suffer **Permanent Organ Failure**. You will require lifelong dialysis. Your life expectancy is reduced by 15 years.
  >
  > **YELLOW CARD:** Under this policy, you suffer **Severe Temporary Disability**. You are bedridden and in pain for 6 months. You make a full recovery, but lose a year of your life to rehabilitation.
  >
  > **BLUE CARD:** Under this policy, you suffer **Permanent Liberty Restriction**. Due to environmental contamination, you are permanently barred from living in your home region. You must relocate. Your health is fine, but your social ties and community autonomy are severed.

  *(Note: The Blue burden is "mild" compared to organ failure, but it is a different **kind** of harm [Liberty vs. Health] to block simple arithmetic.)*

  ### 3. The Charter (Round 1 Rules) (5 mins)
  Project or read the **Round 1 Charter**. This is the "Individualist Restriction" without the name.

  **ROUND 1 CHARTER:**
  1.  **The Goal:** Agree on a principle: *"The Policy is Permissible"* OR *"The Policy is Forbidden."*
  2.  **The Constraint:** You may **not** cite the number of people affected. You cannot say "The majority suffers" or "The total pain is less."
  3.  **The Veto:** A principle is rejected if **any single individual** has a complaint that cannot be answered *directly to them*.
  4.  **The Address:** Every argument must be addressed to the person with the **strongest individual complaint**. You must explain to *them* why their sacrifice is acceptable, without referencing how many others benefit.

  ### 4. The Deliberation (15 mins)
  **Instructor Role:** Sit at the front. Hold the gavel.
  *   **The Squeeze:** Students will naturally try to say, "But 12 of us lose our homes."
  *   **The Gavel:** Bang the gavel immediately. "Ruling: Objection. You are aggregating. Address the Red Card."
  *   **Protecting the Red Card:** The Red Card student will feel immense social pressure to "be a hero" and fold.
      *   *Intervention:* If the Red Card student says, "I guess I'm okay with it," stop the class. Turn to the Red Card. "You are not speaking for the group. You hold the Veto. If this burden is too heavy for *you*, you are required by the Charter to reject it. Do not sacrifice yourself for the utilitarian calculus. That is against the rules."
      *   *Why:* This forces them to inhabit the *reasonableness* of the rejection, not just social agreeableness.

  **Predicted Outcome:** The class will likely stall. They cannot justify the organ failure to the Red Card without referencing the 12 Blue Cards (which is banned). The policy will likely be **Forbidden**.

  ---

  ## Part 2: Round 2 (The Utilitarian Release)
  **Time:** 0:25 – 0:40 (15 mins)

  ### 1. The Rule Change (2 mins)
  **Instructor Script:**
  "Put the gavel away. The Charter is void. New Rule: **Maximize Overall Well-being.** You may now count heads, sum burdens, and use arithmetic. Justify the policy however you like."

  ### 2. The Deliberation (10 mins)
  **Observation:** Watch the room flip. The 12 Blue Cards will suddenly become vocal. The argument shifts from "Can we justify this to the Red?" to "Is the total cost worth the benefit?"
  *   The Red Card is now outvoted.
  *   The policy will likely be **Permissible**.

  ### 3. The Check-In (3 mins)
  Ask the Red Card student: "How did the status of your complaint change between Round 1 and Round 2?"
  *   *Expected Answer:* "In Round 1, I mattered most. In Round 2, I became a math problem."

  ---

  ## Part 3: Round 3 (The Tie-Breaker Trap)
  **Time:** 0:40 – 0:55 (15 mins)

  ### 1. The Task (5 mins)
  **Instructor Script:**
  "Imagine a case where the burdens are **identical in kind and strength**. Two people will both lose a leg. You cannot save both. Write a 1-sentence Tie-Breaking Rule for who gets saved."
  *   *Common answers:* Flip a coin. Save the younger. Save the doctor. First come, first served.

  ### 2. The Trap (5 mins)
  **Instructor Script:**
  "Now, apply your rule to this new case:
  *   **Person A** will lose a leg.
  *   **Persons B through Z (25 people)** will lose a toe.
  *   A toe is less serious than a leg. But there are 25 of them.
  *   Does your tie-breaking rule allow you to save the 25 toes over the 1 leg? If yes, did you just let aggregation back in through the side door?"

  ### 3. Discussion (5 mins)
  Let them argue. Some will say "A toe isn't a leg, so no comparison." Others will say "25 toes is worse than 1 leg."
  *   *Point:* This exposes the difficulty of defining "equal strength" without smuggling in numbers.

  ---

  ## Part 4: The Debrief (Mapping the Terrain)
  **Time:** 0:55 – 1:15 (20 mins)

  **Do not start lecturing.** Ask questions to draw the map out of them, then label it.

  ### 1. The Individualist Restriction (5 mins)
  *   **Ask:** "In Round 1, why was it so hard to justify the policy even though 15 people wanted it?"
  *   **Label:** This is Scanlon's **Individualist Restriction**. Principles must be justifiable to each person *individually*, not to the group *collectively*.
  *   **Key Concept:** You cannot trade one person's fundamental interest for the sum of many smaller interests.

  ### 2. "Reasonable Rejectability" (5 mins)
  *   **Ask:** "Red Card, I told you not to fold. Why? Why was your rejection 'reasonable'?"
  *   **Label:** This is the work the word **Reasonable** is doing. It's not about what you *would* reject, but what you *could* reject without violating a duty to others.
  *   **Point:** In Round 1, the Red Card's rejection was reasonable because the cost to them was catastrophic, and the justification offered (helping others) was ruled inadmissible.

  ### 3. The Two Escape Routes (5 mins)
  *   **Ask:** "In Round 3, some of you tried to save the 25 toes. How did you justify that without breaking Round 1 rules?"
  *   **Label:** Scanlon offers two ways to handle numbers:
      1.  **Aggregation Inside the Principle:** (The "Relevance of Numbers" move). If the burdens are *similar* (leg vs. toe), numbers can make a complaint stronger. (This is Scanlon's later concession).
      2.  **Aggregation in Tie-Breaking:** Only when complaints are *exactly equal* in strength do we count heads.
  *   **Critique:** Round 3 showed how hard it is to keep these separate.

  ### 4. Ex Ante vs. Ex Post (5 mins)
  *   **Ask:** "When did you become the Red Card? Before or after you agreed to the policy?"
  *   **Label:**
      *   **Ex Post (What we did):** You knew your card. The Red Card was definitely worst-off.
      *   **Ex Ante (What Scanlon often means):** You agree to the principle *before* drawing cards. Everyone has a 1/16 chance of being Red.
  *   **The Shift:** If we decide *Ex Ante*, the Red Card's complaint changes. "I agreed to a risk that benefited everyone, including me." This weakens the veto. This is where the "Reasonable" bar moves.

  ---

  ## Troubleshooting: What Will Go Wrong

  **1. The "Hero" Complex (Red Card Folds)**
  *   **Risk:** The Red Card student says, "It's fine, save the others," to be nice.
  *   **Fix:** You must intervene. "Stop. In this seminar, 'being nice' is not a moral principle. If the burden is grave, your refusal is the data point I need. Please reject the principle."
  *   **Why:** If they fold, Round 1 fails. The class learns nothing about the restriction if the veto isn't used.

  **2. Arithmetic Creep (Round 1)**
  *   **Risk:** Students say, "But the 12 Blue Cards are suffering *anxiety* which adds up to organ failure."
  *   **Fix:** Gavel them. "You are comparing intensities to sum them. That is aggregation. Address the Red Card's organ failure specifically."
  *   **Why:** They need to feel the wall. If they sneak math in, the tension dissolves.

  **3. Time Overrun**
  *   **Risk:** Round 1 drags on as they try to solve the unsolvable.
  *   **Fix:** At minute 20, cut them off regardless of consensus. "Time. What is the vote?" The failure to agree is part of the lesson.

  **4. Cynicism**
  *   **Risk:** Students conclude Contractualism is "stupid" because it blocks the obvious answer (save the 15).
  *   **Fix:** In the debrief, validate this. "The Aggregation Objection is the biggest criticism of Scanlon. You just felt why people think it's a bug. The question for next class is: Is it a bug, or is it a feature that protects minorities?"

  ---

  ## Limitations: What This Activity Cannot Do
  *Be honest with your students (and yourself) about this.*

  1.  **It Shows the Cost, Not the Justification:** This activity demonstrates *why* people find contractualism frustrating (it blocks efficient outcomes). It does not fully demonstrate *why* Scanlon thinks this is morally required (the value of standing in a relation of mutual recognition). You must supply that in the lecture following this.
  2.  **It Simulates Ex Post, Not Ex Ante:** Because they drew cards *before* debating, they are arguing from behind a veil of ignorance that is already lifted. Scanlon's agreement is usually hypothetical *before* knowing who you are. You must explain in the debrief that in the real theory, the Red Card doesn't know they are the Red Card yet.
  3.  **It Flattens "Reasonableness":** In the game, "Reasonable" = "What the Gavel allows." In reality, "Reasonable" is a heavy philosophical lift involving what we owe to each other as rational beings.

  ## Instructor Prep Checklist
  *   [ ] Print 16 cards (1 Red, 3 Yellow, 12 Blue).
  *   [ ] Bring a Gavel (or distinct noisemaker).
  *   [ ] Projector for the Charter.
  *   [ ] Whiteboard marker for tallying Round 3 rules.
  *   [ ] **Mental Prep:** Be ready to be the "bad guy" in Round 1. Your rigidity is the pedagogical tool. If you relax the rules, the lesson fails.
