answer: |-
  **Planning Note**

  I intend to build the speech on Ruth's "Argument from the State," but framed as a matter of civic character rather than political policy. This honors her intellectual rigor without reducing her life to a legislative agenda. I am setting aside the "Argument from the Condemned" entirely; as Ruth warned, weighing the killer's suffering against the victim's is a trap that would alienate Delia and the grieving cousins. I am also setting aside religious comfort; the daughter's request for truth overrides the cousins' desire for solace. The chief risk is sounding polemical in a space meant for mourning. If the speech becomes a manifesto, we lose the family. To handle the restricted material regarding the execution chamber, I will reference the weight of her witness without describing the act itself. The bridge between the factions is Ruth's friendship with Delia. That relationship proves her belief that disagreement need not sever connection. I will focus on her capacity to hold opposing truths without flinching. This honors her intellect for the lawyers, her integrity for the daughter, and her humanity for Delia and the cousins.

  ***

  **Eulogy**

  To know Ruth was to know that she arrived early. She believed that time was the one resource we could not reclaim, and she refused to waste anyone's. She drank her coffee black, took notes in a handwriting that leaned forward, and listened with a patience that felt like a form of labor. She was not here to be comfortable, and she did not expect us to be either.

  For thirty years, Ruth stood between the state and the accused. For twenty of those, she sat on the commission that oversaw the ultimate penalty. She carried a weight that most of us never touch. There are things she saw that she did not bring home, and there are things she brought home that she did not speak aloud. Her daughter has asked that we do not recount the final moments of her work. We will respect that. It is enough to say that Ruth believed witnessing was a duty, even when the sight was unbearable.

  She often said that there are two ways to argue against the death penalty. The first is to ask us to feel for the person dying. She refused to make that case. She knew that no parent who has buried a child will ever weigh that grief against the suffering of the killer. To ask them to is to insult their love.

  Instead, she made the second argument. She asked what it does to a society to kill by appointment. She said, "One of them killed in a rage. The rest of us kill by schedule." She was not interested in statistics about deterrence. She was interested in us. She believed that a polity which requires a class of people to perform executions has already answered a question about itself. She wanted us to be honest about who we are when we pull the lever.

  This was not abstract for her. It was personal. Delia Marsh sits here today. For eleven years, Ruth and Delia had dinner once a month. Delia's brother was murdered, and she wanted justice. Ruth wanted abolition. They never agreed. But they never stopped showing up. Ruth understood that clarity does not require cruelty. She knew that you could look someone in the eye, disagree completely, and still share a meal.

  She was an atheist of the unshakable kind. She did not believe she was going somewhere better. She believed she was here, and so were we, and that was where the work had to happen. In this, she was like Camus, who argued that we must live without appeal to higher comforts, finding our meaning in lucidity and in each other. Ruth found her meaning in truth-telling. She would not want us to lie now to make the pain softer.

  So we will not say she is in a better place. We will say she is in this place, in this room, in the standard she set for how we treat our opponents and how we wield our power. She taught us that the opposite of violence is not passivity, but attention. To pay attention to the law, to the victim, to the accused, and to the friend across the table.

  We cannot bring her back. We cannot fix the things that broke her heart. But we can do what she did. We can arrive early. We can tell the truth even when it is difficult. We can refuse to look away from the hard things, and we can refuse to let those hard things turn us against each other.

  There is no heaven where Ruth is waiting. There is only the work she left behind, and the people she left to do it. If we want to honor her, we do not look up. We look around. We see who is sitting across from us. We keep the table set. We continue the conversation.
