answer: |-
  **Comprehensive Examination Question: Formal Epistemology**

  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question in essay form. You may assume standard probability axioms. Do not cite specific authors or texts; rely on your understanding of the concepts.

  **The Question:**

  Consider an agent, Judy, who is uncertain about her location. She divides the world into two mutually exclusive and exhaustive territories, Red ($R$) and Blue ($B$), with a prior probability distribution $P_0(R) = P_0(B) = 0.5$. Within each territory, there are two locations: Headquarters ($H$) and Camp ($C$). Her prior probabilities for location given territory are $P_0(H|R) = P_0(C|R) = 0.5$ and $P_0(H|B) = P_0(C|B) = 0.5$.

  Judy receives new information that is not a standard proposition (i.e., she does not learn that some event is certainly true). Instead, she learns a constraint on her conditional probabilities: "If you are in Red Territory, the probability of being at Headquarters is $3/4$." Formally, her new probability function $P_1$ must satisfy $P_1(H|R) = 0.75$.

  1.  Explain precisely why this scenario poses a problem for the standard rule of Conditionalization.
  2.  Formulate a general principle for updating probability distributions when learning such conditional constraints, and explain the rationale behind it.
  3.  Consider a **modified scenario**: Suppose Judy subsequently learns a second constraint: "If you are in Blue Territory, the probability of being at Headquarters is $1/4$." ($P_2(H|B) = 0.25$). Apply your principle to this modified case. Determine whether this admits a unique rational posterior probability for being in Red Territory ($P_2(R)$). If it does not, explain what this implies about the original Judy Benjamin problem.

  In your response, compare at least two distinct approaches to updating on conditionals (e.g., Adams Conditioning, Jeffrey Conditionalization, or Maximum-Entropy updating). You must take a definite position on which approach is most defensible for the modified case, state the strongest objection to that position, and conclude by explaining what this reveals about the difference between learning a proposition and learning a conditional constraint.

  ***

  **Model Answer**

  The Judy Benjamin problem highlights a structural gap in Bayesian epistemology. Standard Conditionalization dictates that upon learning evidence $E$ with certainty, an agent updates via $P_1(A) = P_0(A|E)$. This requires $E$ to be a proposition assigned probability 1. In Judy's case, she learns a constraint on a conditional probability, $P_1(H|R) = 0.75$, rather than the truth of a proposition. Infinitely many posterior distributions satisfy this constraint while remaining probabilistically coherent. For instance, $P_1(R)$ could range anywhere from 0 to 1, provided the joint probabilities sum correctly. Because the evidence does not fix the probability of the antecedent $R$, standard Conditionalization is mathematically undefined; there is no unique $E$ to condition upon.

  To resolve this underdetermination, we require a principle of minimal belief revision. The most robust principle is Minimum Information Updating, operationalized via Maximum-Entropy (MaxEnt) methods. The rationale is conservative: an agent should change their prior distribution only as much as the new information strictly requires. Formally, one selects the posterior $P_1$ that satisfies the new constraints while minimizing the Kullback-Leibler divergence from $P_0$. This preserves all prior structural relationships not explicitly contradicted by the new data, treating the prior as a default state of ignorance regarding unconstrained variables.

  Applying this to the modified scenario, Judy now faces two constraints: $P(H|R) = 0.75$ and $P(H|B) = 0.25$. Her prior was uniform over territories and locations. A MaxEnt update minimizes information gain subject to these linear constraints. Because the constraints apply strictly within the partitions $R$ and $B$, and the prior odds $P(R)/P(B)$ were 1, the MaxEnt solution preserves the marginal probability of the territories. Thus, $P_2(R) = 0.5$. The posterior probability of Headquarters becomes $P_2(H) = 0.5(0.75) + 0.5(0.25) = 0.5$.

  Contrast this with Adams Conditioning, which updates conditionals directly while holding the probabilities of the antecedents fixed. In this specific modified case, Adams Conditioning yields the same result as MaxEnt: $P(R)$ remains 0.5. However, the approaches diverge in rationale. Adams Conditioning treats the antecedents as fixed reference classes, whereas MaxEnt treats the preservation of $P(R)$ as a consequence of minimizing global distance. Jeffrey Conditionalization is less suitable here, as it requires a partition of certain evidence (e.g., $P_1(R)=k$), which Judy does not possess.

  I argue MaxEnt is the superior approach for the modified case because it is invariant under reparameterization of the problem space, whereas Adams Conditioning relies on a specific syntactic distinction between antecedent and consequent. However, the strongest objection to MaxEnt, articulated by van Fraassen, is that the choice of distance metric (cross-entropy) is not mandated by logic. One could choose a different metric that shifts $P(R)$ based on the "informativeness" of the conditionals. If the constraint on $R$ is tighter than on $B$, why should $P(R)$ not increase? MaxEnt answers "because geometry," not "because logic."

  This reveals a fundamental distinction between learning propositions and learning conditionals. Learning a proposition eliminates worlds; learning a conditional constraint restricts ratios of probability mass within worlds. Because conditional constraints underdetermine the marginal probabilities of their antecedents, no update rule can derive a unique posterior without importing extra-logical assumptions (like a specific distance metric). Consequently, the Judy Benjamin problem demonstrates that Conditionalization is not the uniquely rational update rule for all types information. When information is structural rather than propositional, rationality permits a family of update rules, distinguished by how they manage uncertainty in unconstrained dimensions.

  ***

  **Marking Scheme**

  **Total Marks: 25**

  | Point | Description of Required Move (5 marks) | Typical Error Costing Marks (5 marks) |
  | :--- | :--- | :--- |
  | **1** | **Problem Identification:** Clearly states that Conditionalization requires learning a proposition with $P=1$, whereas JB involves a constraint on conditional probability leaving marginals free. | Fails to distinguish between learning $P(A|B)=x$ and learning $B$; claims Conditionalization simply cannot apply without explaining why. |
  | **2** | **Principle Formulation:** States a specific update principle (e.g., MaxEnt/MinInfo) and provides a rationale (e.g., conservatism/minimal change). | Defines a rule without justification, or offers a rationale that contradicts the probabilistic setup (e.g., "maximize truth"). |
  | **3** | **Application:** Applies the principle to the modified scenario ($P(H|B)=0.25$) and explicitly addresses the status of $P(R)$ (e.g., that it remains fixed or is underdetermined). | Calculates $P(H)$ correctly but ignores $P(R)$, or claims the constraints logically force a specific $P(R)$ without extra assumptions. |
  | **4** | **Critical Evaluation:** Compares two approaches, takes a definite stance on the best one, and articulates a strong objection (e.g., metric arbitrariness). | Lists approaches without choosing one, or states an objection that is easily dismissed (e.g., "it is too hard to calculate"). |
  | **5** | **Implication:** Concludes on the uniqueness of rationality, distinguishing propositional learning from conditional learning. | Concludes that Conditionalization is universally valid, or fails to link the underdetermination to the nature of the evidence. |

  **Distinction between A and B Answers:**
  An **A answer** (20-25 marks) will seamlessly integrate the objection into the defense of the chosen position, acknowledging that the "solution" is a methodological choice rather than a logical necessity. It will handle the modified scenario's implications for $P(R)$ with nuance. A **B answer** (15-19 marks) will correctly identify the problem and apply a rule but may treat the chosen update rule as logically forced rather than pragmatic, or will offer a superficial objection.

  **Note on "Ill-Posed" Arguments:**
  The prompt invites skepticism about unique rationality. If a student argues the problem is ill-posed because no rule is uniquely rational without extra-logical commitments, this should be marked **highly** provided they rigorously justify the underdetermination (as in Point 5). Do not penalize skepticism that aligns with the prompt's philosophical intent; penalize only if the skepticism is used to avoid answering the specific tasks (e.g., refusing to apply *any* principle).
