  We must acknowledge the "Boundary Problem." Any line we draw is ultimately a political choice made by the present majority. By deciding who votes, we privilege current residents over downstream neighbors and future generations. Critics argue that because we cannot neutrally define the "affected community," we should decline to fix a boundary at all. However, refusing to draw a boundary is itself a decision—one that defaults to the status quo and guarantees paralysis. A citizens' assembly cannot function without a defined demos. We are choosing the least unjust arbitrary line rather than pretending no choice exists.

