  To effectuate this before convening, the City Clerk shall oversee a stratified sortition process. Voter rolls will be supplemented with utility records and temporary permit databases to identify Decisional Members. Harrowfield's municipal council will be invited to nominate Deliberative Members. Property records will identify expats. Seasonal workers will be recruited via employer registries. This verification must conclude within two weeks to allow for assembly orientation.

