  1.  **Long-term Residents (Non-Citizens):** **Decisional (Vote).** They reside within the city's jurisdiction and face the immediate physical risk of flooding. Excluding them based on citizenship status undermines the assembly's legitimacy regarding lived experience.
  2.  **Harrowfield Residents:** **Deliberative (Voice).** They bear the catastrophic cost of inundation but lie outside our legal jurisdiction. Granting a vote would compromise municipal sovereignty; granting neither would ignore profound harm. They shall have seated representation to argue their case, but no veto.
  3.  **Citizens Abroad (Property Owners):** **Deliberative (Voice).** Their financial interest is substantial, but their lack of daily presence limits their stake in the community's social fabric compared to residents.
  4.  **Seasonal Agricultural Workers:** **Deliberative (Voice).** They face seasonal risk and economic disruption. Their transient status precludes full decisional membership, but their affected interests require formal acknowledgment.
  5.  **Not-Yet-Born Residents:** **Neither (Guardianship).** Practical participation is impossible. Instead, the Assembly's charter will appoint an independent "Future Generations Guardian" with the power to challenge recommendations that violate long-term sustainability criteria.

