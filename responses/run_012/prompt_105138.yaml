      TO: City Council
      FROM: Chair, Independent Franchise Commission
      DATE: [Current Date]
      SUBJECT: Recommendation on Citizens' Assembly Franchise

      The ordinance mandates that the Citizens' Assembly "represent the community affected by the decision." Defining this community is not merely technical; it is constitutive of the political community itself. After reviewing proposed tests, the Commission recommends adopting a **Two-Tier Membership Rule** based on the principle of *Substantial Stake combined with Legal Jurisdiction*.

      **The Rule**
      Membership shall be divided into "Decisional Members" (vote) and "Deliberative Members" (voice only). Decisional membership is reserved for those subject to the city's coercive legal jurisdiction who face direct physical risk. Deliberative membership is granted to those suffering significant externalities or holding substantial property interests without residing under city jurisdiction.

      **Application to Candidate Groups**
      1.  **Long-term Residents (Non-Citizens):** **Decisional (Vote).** They reside within the city's jurisdiction and face the immediate physical risk of flooding. Excluding them based on citizenship status undermines the assembly's legitimacy regarding lived experience.
      2.  **Harrowfield Residents:** **Deliberative (Voice).** They bear the catastrophic cost of inundation but lie outside our legal jurisdiction. Granting a vote would compromise municipal sovereignty; granting neither would ignore profound harm. They shall have seated representation to argue their case, but no veto.
      3.  **Citizens Abroad (Property Owners):** **Deliberative (Voice).** Their financial interest is substantial, but their lack of daily presence limits their stake in the community's social fabric compared to residents.
      4.  **Seasonal Agricultural Workers:** **Deliberative (Voice).** They face seasonal risk and economic disruption. Their transient status precludes full decisional membership, but their affected interests require formal acknowledgment.
      5.  **Not-Yet-Born Residents:** **Neither (Guardianship).** Practical participation is impossible. Instead, the Assembly's charter will appoint an independent "Future Generations Guardian" with the power to challenge recommendations that violate long-term sustainability criteria.

      **Implementation Mechanism**
      To effectuate this before convening, the City Clerk shall oversee a stratified sortition process. Voter rolls will be supplemented with utility records and temporary permit databases to identify Decisional Members. Harrowfield's municipal council will be invited to nominate Deliberative Members. Property records will identify expats. Seasonal workers will be recruited via employer registries. This verification must conclude within two weeks to allow for assembly orientation.

      **The Strongest Objection**
      We must acknowledge the "Boundary Problem." Any line we draw is ultimately a political choice made by the present majority. By deciding who votes, we privilege current residents over downstream neighbors and future generations. Critics argue that because we cannot neutrally define the "affected community," we should decline to fix a boundary at all. However, refusing to draw a boundary is itself a decision—one that defaults to the status quo and guarantees paralysis. A citizens' assembly cannot function without a defined demos.

      **Conclusion**
      Perfection is unavailable, but legitimacy is achievable. This Two-Tier Rule balances moral obligation to Harrowfield with the practical necessities of municipal governance. It acknowledges harm without surrendering sovereignty. The Council must adopt this recommendation immediately to allow time for selection. We cannot wait for a theoretically perfect franchise that never arrives.

      **Recommendation:** Adopt the Two-Tier Membership Rule as specified herein.

