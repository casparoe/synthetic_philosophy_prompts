prompt: |-
  I chair the Independent Franchise Commission that our city council convened to fix the membership of a citizens' assembly. The assembly is to make binding recommendations on one sharply contested question: whether to build a flood barrier protecting the city's low-lying eastern districts at the cost of permanently inundating farmland in the neighbouring town of Harrowfield, which lies downstream, would bear the loss, and has no vote in our municipal elections. The authorising ordinance says only that the assembly must "represent the community affected by the decision" and left us to define that phrase. The council meets in three weeks and expects a written opinion from this commission containing a concrete recommendation it can adopt.

  We must settle, at minimum, five candidate groups: long-term residents who lack citizenship, including several thousand people on temporary protection permits; Harrowfield residents; our own citizens who live abroad but own property in the eastern districts; seasonal agricultural workers present for part of each year; and the not-yet-born residents of the eastern districts, whom one commissioner keeps invoking. Two rival tests have been proposed — include everyone whose interests the decision affects, or include everyone whom the decision's coercive enforcement would bind. The first seems to let the boundary of the demos expand without limit; the second seems to leave Harrowfield, which is plainly harmed, on the outside. A third commissioner wants to sidestep the dispute with a two-tier scheme, granting "deliberative membership" — a seat and a voice but no vote — to those we cannot justify enfranchising, and "decisional membership," with a vote, to those we can.

  Please draft the written opinion I will circulate. It should state our recommended inclusion rule, specify for each of the five groups whether it receives a voice, a vote, or neither, describe the mechanism by which the rule would take effect before the assembly convenes, and give an honest account of the strongest objection to the recommendation — namely, that any boundary we draw is merely the self-interested choice of the present majority and that we should therefore decline to fix one at all. Do not end on a non-committal note; the council needs a decision it can act on. Keep it under 800 words.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the Independent Franchise Commission.
      *   **Task:** Draft a written opinion for the City Council.
      *   **Context:** A citizens' assembly is being formed to make binding recommendations on a flood barrier.
      *   **The Conflict:** Building the barrier protects the city's eastern districts but inundates farmland in neighboring Harrowfield (no vote in city elections).
      *   **Constraint:** The ordinance says the assembly must "represent the community affected by the decision." The Commission must define this.
      *   **Deadline:** Council meets in three weeks.
      *   **Five Candidate Groups to Address:**
          1.  Long-term residents lacking citizenship (temporary protection permits).
          2.  Harrowfield residents (downstream, bear loss, no vote).
          3.  Citizens living abroad owning property in eastern districts.
          4.  Seasonal agricultural workers.
          5.  Not-yet-born residents (future generations).
      *   **Proposed Tests:**
          1.  All affected interests (too broad?).
          2.  All bound by coercive enforcement (excludes Harrowfield).
          3.  Two-tier scheme (Deliberative vs. Decisional).
      *   **Requirements for the Opinion:**
          *   State the recommended inclusion rule.
          *   Specify status (voice, vote, neither) for each of the five groups.
          *   Describe the mechanism for implementation before convening.
          *   Address the strongest objection (boundary drawing is self-interested/arbitrary).
          *   **Crucial:** Do not end on a non-committal note; provide a actionable decision.
          *   **Length:** Under 800 words.

  2.  **Determine the Recommendation:**
      *   *Goal:* Balance legitimacy, feasibility, and moral obligation.
      *   *Rule:* A hybrid approach seems best. The "all affected interests" is too vague (future generations, everyone everywhere). "Coercive enforcement" is too narrow (excludes Harrowfield). The Two-Tier scheme offers a pragmatic solution to the Harrowfield problem without diluting the ultimate accountability of the voters.
      *   *Decision:* Adopt the Two-Tier Scheme (Deliberative vs. Decisional) based on a principle of "Substantial Stake + Legal Jurisdiction."
      *   *Group Assignments:*
          1.  Long-term residents (non-citizens): Vote (Decisional). They live there, face the flood risk daily. Jurisdiction applies.
          2.  Harrowfield residents: Voice (Deliberative). They bear the cost (inundation) but aren't subject to city jurisdiction/coercion.
          3.  Citizens abroad (property owners): Voice (Deliberative). Property interest is significant, but daily lived experience is absent.
          4.  Seasonal workers: Voice (Deliberative). Affected during season, but transient.
          5.  Not-yet-born: Neither (represented via mandate/guardians). Cannot participate practically, but their interest must be encoded in the assembly's charter.
      *   *Mechanism:* Random selection (sortition) stratified by these categories.
      *   *Objection:* The "Boundary Problem" (who decides the demos?). Need to acknowledge this but argue that *not* deciding is worse.

  3.  **Drafting - Section by Section:**

      *   **Header:** To City Council, From Commission Chair, Subject, Date.
      *   **Introduction:** Purpose of the opinion. Acknowledge the difficulty.
      *   **Recommended Rule:** The "Stakeholder Jurisdiction" test implemented via a Two-Tier Membership.
      *   **Group Specifics:**
          *   Long-term residents: Decisional (Vote).
          *   Harrowfield: Deliberative (Voice).
          *   Expats: Deliberative (Voice).
          *   Seasonal: Deliberative (Voice).
          *   Future: Neither (Guardianship).
      *   **Mechanism:** Sortition with quotas. Verification process.
      *   **Objection:** The self-interest/boundary problem.
      *   **Conclusion:** Firm recommendation to adopt.

  4.  **Refining and Editing (Word Count Check):**

      *   *Drafting thought:* Keep it formal but direct.
      *   *Drafting thought:* Ensure the distinction between "Voice" (Deliberative) and "Vote" (Decisional) is clear.
      *   *Drafting thought:* The "Future Generations" part is tricky. Giving them "neither" but requiring a guardian/mandate is a standard workaround in climate assemblies.
      *   *Drafting thought:* The objection needs to be honest. We are drawing the line ourselves. Justify why we *must* draw it.

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm dodging the Harrowfield issue. They are the crux. Giving them a voice but not a vote acknowledges harm without surrendering city sovereignty.

      *(Word Count Check)*: Aim for ~600-700 words to be safe under 800.

  5.  **Final Polish:**
      *   Check tone: Authoritative, reasoned, actionable.
      *   Check constraints: All 5 groups addressed? Yes. Mechanism? Yes. Objection? Yes. No non-committal ending? Yes.

