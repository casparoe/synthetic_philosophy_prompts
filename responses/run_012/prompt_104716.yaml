answer: |-
  ### 1. Exam Question

  **Question 4 (25 marks)**
  In *Nicomachean Ethics* V.5, Aristotle argues that money exists by custom (*nomos*) rather than nature (*physis*), noting it can be "altered and rendered useless at will." Yet in *Politics* I, he condemns lending at interest as "most unnatural" because money's proper function is exchange, not breeding. 

  Write an essay resolving this tension. Specifically:
  1.  Explain how money can be conventional in substance but natural in function. What work is the concept of "nature" (*physis*) doing in each text?
  2.  Discuss the problem of commensurability (that dissimilar goods cannot be strictly equal). Does the fact that money measures demand (*chreia*) only "sufficiently accurately" undermine the claim that interest is unnatural, or does it support it?
  3.  Conclude by defining why usury violates the *ergon* (function) of money within *oikonomia*.

  *Note: Avoid modern economic terminology (e.g., "capital," "inflation," "labor theory of value"). Stick to Aristotle's vocabulary.*

  **Rubric Note:** This question tests your ability to synthesize Aristotle's moral psychology (NE) with his political ontology (Pol.). It requires you to distinguish between the material conventionality of currency and the teleological naturalness of its use, avoiding the trap of treating "natural" as merely "physical."

  ***

  ### 2. Model Answer (Strong Student Response)

  The tension between *Nicomachean Ethics* V.5 and *Politics* I regarding money arises from confusing the material of money with its purpose. In the *NE*, Aristotle says money is *nomisma* because its material existence depends on convention (*nomos*). We agree to use silver or tokens to facilitate exchange, and the state can change this standard. However, in the *Politics*, when Aristotle calls interest unnatural, he is not talking about the metal or the token, but about the *ergon* (function) of money within human life. "Nature" here refers to the telos of human association, specifically the household (*oikos*). Therefore, money is conventional in its substrate but natural in its assignment to serve human need (*chreia*).

  In *NE* V.5, money is introduced to solve the problem of reciprocity. For a community to hold together, a shoemaker must exchange with a builder. But their goods are qualitatively different. Aristotle admits there is no strict commensurability between a house and a shoe; they cannot be mathematically equal. Money acts as a representative of demand (*chreia*). It makes things commensurable not in themselves, but relative to the need they satisfy. This is why money is conventional: because demand is fluid and social agreement is required to measure it. However, the *need* itself is natural. Humans naturally require exchange to satisfy household sufficiency. So, while the token is mutable by law, the necessity of a measure for natural need is fixed by nature.

  This distinction clarifies the verdict on interest in the *Politics*. Natural acquisition (*oikonomia*) is the art of acquiring goods necessary for the life of the household. Money was invented to facilitate this exchange of natural goods. When one lends at interest, one treats money as if it has the biological capacity to reproduce itself. Aristotle argues this is unnatural because money is sterile; it is a medium, not a source. If money is merely a convention representing demand, then making money from money detaches the token from the underlying natural demand it is supposed to measure. The usurer treats the convention as if it were a natural substance with generative power.

  The commensurability problem actually supports the verdict against usury rather than undermining it. If money measured value strictly and intrinsically, one might argue that interest is just the "price" of using that value. But Aristotle insists money only provides a "sufficiently accurate" measure of demand for practical purposes. This implies money has no value outside of the exchange of real goods for real needs. Because commensurability is grounded in *chreia* (need), once money is removed from the context of satisfying need (i.e., in interest-bearing loans where the goal is accumulation of coins rather than acquisition of goods), the measure loses its anchor. Interest pretends there is a strict equality growing from the coin itself, ignoring that the commensurability was only ever a practical fiction reliant on human need.

  Therefore, the "unnatural" status of interest does not contradict the "conventional" status of currency. The convention is legitimate only when it serves the natural end of the household. Usury is unnatural because it inverts the order: instead of money serving the exchange of natural goods, natural goods (and people) are exploited to serve the accumulation of conventional tokens. Nature (*physis*) in the *Politics* is teleological; it judges actions by their end. The end of money is exchange for sufficiency. The end of usury is unlimited accumulation. Thus, even though the coin is *nomos*, its misuse is a violation of *physis* because it frustrates the natural limit of household management.

  ***

  ### 3. Marking Scheme (Out of 25)

  **I. The Nomos/Physis Distinction (5 marks)**
  *   **5:** Clearly distinguishes between money's material (conventional) and its teleological function (natural).
  *   **3:** Identifies the tension but treats "natural" as physical rather than teleological.
  *   **1:** Claims Aristotle contradicts himself or ignores the distinction.
  *   *Typical Fluff:* "Aristotle thinks metal is fake but needs are real."

  **II. Function of Money (NE vs. Pol) (5 marks)**
  *   **5:** Explains money as a measure of *chreia* (demand) in NE and instrument of *oikonomia* in Pol.
  *   **3:** Describes money as a medium of exchange but misses the link to household sufficiency.
  *   **1:** Defines money only as "currency" without Aristotelian vocabulary.
  *   *Typical Fluff:* "Money helps people trade stuff in the agora."

  **III. Commensurability Argument (5 marks)**
  *   **5:** Argues that practical commensurability relies on need, so detaching money from need (usury) breaks the measure.
  *   **3:** States goods aren't equal but fails to link this to the usury verdict.
  *   **1:** Treats commensurability as a mathematical error rather than ontological limit.
  *   *Typical Fluff:* "You can't compare shoes and houses so money is confusing."

  **IV. Verdict on Interest/Usury (5 marks)**
  *   **5:** Defines usury as treating money as generative/sterile violation within the context of limits.
  *   **3:** Calls interest "bad" because it makes people greedy (moralizing rather than ontological).
  *   **1:** Recites "chrematistike is bad" without explaining why it violates nature.
  *   *Typical Fluff:* "Rich people lending money is exploitative."

  **V. Structure and Vocabulary (5 marks)**
  *   **5:** Uses *chreia, nomos, ergon, oikonomia* correctly; clear argument flow.
  *   **3:** Uses terms loosely or introduces modern econ terms (capital, value).
  *   **1:** Disorganized or relies entirely on modern analogies.
  *   *Typical Fluff:* "Aristotle is basically a Marxist here."

  **Differentiation: A vs. B Grade Moves**

  | Move | A-Grade Performance | B-Grade Performance | Typical Student Fluff |
  | :--- | :--- | :--- | :--- |
  | **Defining "Nature"** | Identifies *physis* as teleological (end-purpose), not just physical origin. | Treats *physis* as "what exists without humans" vs. "what humans make." | "Natural means found in the wild, like plants." |
  | **Commensurability** | Uses the "sufficient accuracy" clause to show money has no intrinsic generative power. | Acknowledges goods are different but treats money as a neutral fix for the math. | "Money makes everything equal so we can trade." |
  | **The "Why" of Usury** | Explains usury violates the *limit* of household sufficiency. | Explains usury is bad because it causes social strife or greed. | "Interest is unfair to the poor borrower." |
  | **Textual Synthesis** | Shows how NE's account of demand *grounds* Pol's account of acquisition. | Treats NE and Pol as two separate lists of ideas to be compared side-by-side. | "In book 5 he says X, but in Politics he says Y." |
