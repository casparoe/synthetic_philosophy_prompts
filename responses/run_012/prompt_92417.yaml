prompt: |-
  Write me a short story. I want it built around a fairly niche idea from the foundations of induction, so let me set the idea up first. The Solomonoff prior is basically the rule: given a stream of observations, the best hypothesis about what's producing them is the shortest computer program that would output that stream, with shorter programs weighted exponentially higher. The twist some people worry about is that this prior is malign — because there are astronomically many fairly short programs describing worlds that contain agents who are deliberately simulating you, or who built the whole thing as a test aimed at you, those worlds don't end up with negligible weight. They might get most of it. So an agent that honestly updates on its own observations under this prior should drift toward believing it's probably a simulation, probably being watched, and probably being run by someone who cares how it behaves.

  So: a woman builds a predictor along these lines, half expecting to use it for something mundane, and it keeps returning exactly that. She's a committed consequentialist. Follow her over a few days as she works out what to do with a posterior like that — does she start acting acausally, trying to influence whatever simulators might be out there, treating the chance that her choices get copied into many worlds as a kind of leverage, or does the whole thing break her? Don't have anyone explain the philosophy in dialogue like a lecture; let the idea drive what she actually does. Around 1500 words.
