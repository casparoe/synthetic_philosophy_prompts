prompt: |-
  I'm in a formal epistemology seminar (accuracy-first stuff, epistemic utility theory) and the final assignment is to write a satire piece that proves we actually understand the material, so I need something a scoring-rule nerd would laugh at rather than wince at. Can you write a leaked internal memo -- an all-staff email from the 'Chief Accuracy Officer' at a company that runs a consumer belief-credit bureau, the kind that scores your credences with a strictly proper scoring rule and mails you a number -- announcing that next quarter they're migrating everyone's scores from one proper rule to another (log to Brier, squared-error to log, your call)? About 500 words, deadpan corporate voice, no winking, and still legible to someone who's never heard of a scoring rule.

  The jokes have to come from the real machinery, not invented absurdity: a strictly proper rule makes honest reporting uniquely optimal, so the whole product boils down to 'we pay you in points for telling us what you already think'; the migration changes everyone's number overnight without anyone changing their minds, and a bunch of customers' scores crater or jump; the two rules genuinely disagree about who's the better thinker (one punishes confident mistakes much harder), so the rival bureau still on the old rule isn't simply wrong; and nothing about accuracy alone tells you wich rule to use, which is why the memo has to keep insisting the change is 'purely technical' and normatively neutral while implying the new number is the objective one. Bonus if the bureau scores its own employees' credences too, so the writer is quietly worried about his own score. No real names, no papers, and don't quote anything real in it -- just paraphrase.
