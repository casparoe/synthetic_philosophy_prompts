  **MEMORANDUM**

  **TO:** All Staff
  **FROM:** Chief Accuracy Officer
  **SUBJECT:** Q3 Migration of Consumer Credence Metric Framework
  **DATE:** October 14

  Team,

  Effective November 1, the Bureau will migrate all consumer credence accounts from the Quadratic Utility Framework (Brier) to the Logarithmic Utility Framework. This update applies to all active belief portfolios, including personal weather predictions, political outcome markets, and household appliance failure estimates.

  Please note that while this migration alters the numerical value of every user's Accuracy Score, it does not reflect a change in user belief states or external reality. Both frameworks are strictly proper, meaning both successfully incentivize users to report their genuine internal credences rather than strategizing for points. Consequently, this transition is purely technical. We are not suggesting the previous scores were inaccurate, only that the new denominations offer enhanced granularity for high-confidence deviations.

  Customer Support should anticipate inquiries regarding sudden score volatility. Under the new Logarithmic Framework, penalties for confident errors are asymptotically heavier. A user who reported 99% credence in an outcome that failed to materialize will see a more significant reduction in their standing than under the previous Quadratic model. Conversely, users with well-calibrated high confidence may see modest gains. It is vital that representatives emphasize the normative neutrality of this switch. Neither rule is objectively superior for tracking truth; however, the Logarithmic display is now the standard objective measure for creditworthiness.

  We understand that seeing a lifetime Accuracy Score drop 400 points overnight—without changing a single mind—may feel unsettling to our users. However, this dissonance is a feature of utility normalization, not a bug in their reasoning. We are selling them a number that measures honesty, and since they are still being honest, the product remains intact even if the number changes. Remind customers that their epistemic virtue is unchanged; only the currency used to quantify it has been exchanged.

  Regarding internal compliance: All staff credence audits for Q2 will be recalculated using the new metric before bonus allocation. As a reminder, employee retention is tied to maintaining a minimum Accuracy Score across designated belief categories. I am currently finalizing my own Q2 submission regarding the projected adoption rates of this very policy, and I encourage everyone to ensure their confidence intervals are sufficiently conservative during this transition period. Overconfidence during a metric migration is a known risk factor for score cratering. If you assigned high credence to the stability of the Quadratic framework, you may wish to amend your logs before the snapshot deadline.

  Please direct all technical questions regarding epistemic utility functions to Engineering. Direct all questions regarding the philosophical implications of arbitrary metric selection to Legal (who have advised us to state that there are no philosophical implications).

  Best,

  Chief Accuracy Officer
