answer: |-
  ### Operating Assumptions

  Before applying the steps, reviewers must accept three premises derived from the Board's commitment to Mill. These address the philosophical friction points you identified.

  1.  **The Coercion Gradient:** Mill's principle restricts *coercion*. On this platform, **Remove** and **Suspend** are coercive (they silence). **Downrank** is semi-coercive (it muffles). **Label** and **Context** are non-coercive (they add speech). The Harm Principle is a strict veto on *Remove/Suspend*. It is a flexible guide for *Downrank*. It does not apply to *Label/Context*, which are permitted even without harm to encourage counter-speech.
  2.  **Vital Interests vs. Feelings:** "Harm" is not "hurt." Harm requires a setback to a **vital interest**: physical safety, security of property, livelihood/reputation, or liberty. Offense, disgust, or ideological disagreement do not count, regardless of volume.
  3.  **The Sovereign Audience:** If the audience chooses to engage with content that harms *them* (e.g., emotional distress from ideas they dislike, or self-harm behaviors they adopt voluntarily), the speaker is not the cause. Harm must be inflicted *upon* the other, not chosen *by* the other, unless the speaker uses deception or coercion to bypass that choice.

  ---

  ### The Decision Procedure

  **Time Limit:** 10 Minutes
  **Goal:** Determine if Restriction (Remove/Suspend/Downrank) is permissible.

  #### Step 1: Identify the Intervention Required
  *Question:* Is the report asking us to silence the speaker (Remove/Suspend), reduce their reach (Downrank), or simply flag the content (Label/Context)?
  *   **If Label/Context:** Stop. Proceed to apply label. (The Harm Principle does not forbid adding speech).
  *   **If Remove/Suspend/Downrank:** Proceed to Step 2. (These are restrictions requiring justification).

  #### Step 2: Identify the Victim
  *Question:* Is there a specific person or group other than the speaker who is suffering the alleged harm?
  *   **No (Self-Harm only):** Stop. Do not restrict. (e.g., The speaker is damaging their own reputation or health).
  *   **Yes (Others):** Proceed to Step 3.

  #### Step 3: Define the Harm (The Vital Interest Test)
  *Question:* Does the content directly threaten or damage a **vital interest** of the victim?
  *   **Vital Interests:** Physical safety, doxxing (security), credible threats, defamation affecting livelihood, targeted harassment preventing platform use.
  *   **Non-Vital Interests:** Hurt feelings, offense, political disagreement, social ostracization resulting from lawful speech, emotional distress from ideas.
  *   **If Non-Vital:** Stop. Do not restrict. (This is Offense, not Harm).
  *   **If Vital:** Proceed to Step 4.

  #### Step 4: Establish Causality (The Agency Test)
  *Question:* Is the harm a direct result of the post, or does it rely on the independent choices of a third party?
  *   **Direct/Incitement:** The post instructs, facilitates, or makes inevitable the harm (e.g., "Go burn his house," "Here is his home address").
  *   **Indirect/Voluntary:** The harm occurs because the audience *chooses* to act on the information, or chooses to be offended, or chooses to emulate self-destructive behavior.
  *   **If Indirect/Voluntary:** Stop. Do not restrict. (The audience is a sovereign agent, not a puppet).
  *   **If Direct/Incitement:** Proceed to Step 5.

  #### Step 5: Proportionality
  *Question:* What is the minimum intervention necessary to prevent the harm?
  *   **Imminent Physical Safety Risk:** Remove + Suspend.
  *   **Material/Reputational Damage:** Remove.
  *   **Potential for Misinterpretation:** Downrank + Label.
  *   **If unsure:** Default to the less restrictive option (Downrank/Label over Remove).

  ---

  ### Case Applications

  #### Case 1: The Journalist Doxx
  *Content:* Account (4M followers) posts home address of a journalist, urging readers to "go find them."
  *   **Step 1:** Report asks for Removal. (Proceed).
  *   **Step 2:** Victim is the journalist (Other). (Proceed).
  *   **Step 3:** Vital Interest: Physical Safety/Security. (Proceed).
  *   **Step 4:** Causality: Direct Incitement. The instruction "go find them" combined with address removes audience sovereignty; it creates a mob risk. (Proceed).
  *   **Step 5:** Proportionality: Imminent safety risk.
  *   **Decision:** **Remove Post + Suspend Account.**
  *   *Alignment:* Matches standard safety policy.

  #### Case 2: The Shopkeeper Libel
  *Content:* Anonymous post states a local shopkeeper has a fraud conviction (False).
  *   **Step 1:** Report asks for Removal. (Proceed).
  *   **Step 2:** Victim is the shopkeeper (Other). (Proceed).
  *   **Step 3:** Vital Interest: Livelihood/Reputation. False criminal claims damage business. (Proceed).
  *   **Step 4:** Causality: Direct. The statement itself is the damage mechanism; it does not require the audience to choose to be harmed, only to believe it.
  *   **Step 5:** Proportionality: Material damage.
  *   **Decision:** **Remove Post.**
  *   *Alignment:* Matches standard policy and legal defamation norms.

  #### Case 3: The Politician Mockery
  *Content:* Mocking hashtag about a politician's appearance.
  *   **Step 1:** Report asks for Removal. (Proceed).
  *   **Step 2:** Victim is the politician (Other). (Proceed).
  *   **Step 3:** Vital Interest: None. Appearance is not a vital interest; political scrutiny is expected. This is Offense.
  *   **Decision:** **Stop at Step 3. Leave Alone.** (Option to Label "Opinion" if desired, but no restriction).
  *   *Alignment:* Matches standard policy on political speech.

  #### Case 4: The Pro-Anorexia Community
  *Content:* Account shares "thinspiration" and coping strategies. Followers comment that it is the only thing that understands them.
  *   **Step 1:** Report asks for Removal. (Proceed).
  *   **Step 2:** Victim is the Followers (Others). (Proceed).
  *   **Step 3:** Vital Interest: Physical Health (Potential). (Proceed).
  *   **Step 4:** Causality: **Voluntary.** The followers are choosing to view and emulate. The account provides information/community, but does not coerce specific acts on specific individuals. The harm (eating disorder) is mediated by the follower's own psychology and choice. Under Mill, protecting a competent adult from their own choices via speech restriction is forbidden.
  *   **Decision:** **Stop at Step 4. Leave Alone + Attach Context.** (Attach a resource label for eating disorder support).
  *   *Alignment:* **Counter-Intuitive.** Most platforms ban this content under "Self-Harm" policies. However, under the Board's strict "Harm to Others" commitment interpreted through Mill, restricting speech to prevent voluntary self-harm by the audience violates the principle. The harm is not *inflicted* by the speaker; it is *adopted* by the listener.

  ---

  ### Limitations and Judgment Calls

  This procedure cannot solve the hard problems; it can only make the trade-offs explicit. Here is where the "test" is actually a judgment call wearing a costume:

  1.  **The Definition of "Vital Interest" (Step 3):**
      *   *The Disguise:* We claim "livelihood" is objective.
      *   *The Reality:* Determining whether a false claim actually damages a livelihood requires market knowledge reviewers don't have. Is a politician's reputation a "vital interest" like a shopkeeper's? Mill might say no (public figures); the procedure says yes. This is a policy choice, not a philosophical fact.

  2.  **The Sovereignty of the Audience (Step 4):**
      *   *The Disguise:* We treat "choice" as binary (coerced vs. voluntary).
      *   *The Reality:* In the Pro-Ana case, is a depressed teenager truly "sovereign"? The procedure assumes competence to avoid paternalism. Deciding who counts as a competent agent (minors vs. adults, vulnerable vs. resilient) is a massive ethical judgment hidden inside the Causality Test.

  3.  **The Private Company Paradox (Step 1):**
      *   *The Disguise:* We distinguish between "Restriction" and "Speech."
      *   *The Reality:* Mill worried about the "tyranny of the majority." A platform downranking content is effectively a digital mob. We treat Downranking as "soft coercion" to satisfy the Board, but technically, a private company has the right to curate its product regardless of harm. This procedure pretends the platform is a public utility bound by constitutional-style logic, which is a legal fiction we maintain for ethical consistency.

  4.  **The "Direct Causality" Trap (Step 4):**
      *   *The Disguise:* We distinguish between incitement and expression.
      *   *The Reality:* The line between "urging readers to find a journalist" (Case 1) and "mocking a politician" (Case 3) is clear. The line between "pro-ana tips" and "suicide instructions" is not. Reviewers must guess the mental state of the audience. If the audience is vulnerable, is the speech coercive? The procedure says "No," but human intuition says "Maybe."

  **Final Note to the Team:**
  This procedure will not stop the arguments. It will only move them from "What does Mill mean?" to "Is this audience sovereign?" That is a better argument to have, but it is still an argument. Your job is not to find the truth, but to apply the constraint consistently so the Board's commitment is not just marketing.
