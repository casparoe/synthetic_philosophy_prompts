  Good afternoon. For thirteen years, Biscuit belonged to this yard. He had that one ear that stayed folded, no matter how many times you tried to fix it. He never said a word. But he made his presence felt.

  There is an old question about what happens inside an animal. Descartes once wondered if they think like we do. Maybe they don't. Maybe Biscuit never puzzled over yesterday or worried about tomorrow. Maybe he lived entirely in the sensation of the moment. But he was here, fully, in the only time that counts: now.

  He felt the sun on the patio tiles. He felt the cold grass under his belly. When he was hurt, he cried out. When he was comforted, he settled. He wanted nothing more than to be near Maria. When she walked through the door, his whole body shook with it. When she sat still, he leaned his weight against her leg. When the kids ran, he ran. When the parents talked, he listened with that good ear. He didn't need words to tell us what mattered.

  To the kids: You saw how he liked to run? How he slept in the sun? That feeling is real. Even if he's gone, the comfort he gave doesn't disappear. You can still feel where he lay on the rug.

  Maria, he spent thirteen years feeling the world through you. His fear was your fear. His calm was your calm. We don't need to explain how deep that went to see it was true. He felt you. And you felt him. That connection doesn't break just because the breathing stops. We are here because that feeling matters. And it matters enough to bring us all into the sun, just to say thank you for the weight of him, the warmth of him, and the quiet where he used to be. He is not here to feel the grass anymore. But we are here to feel his absence together. And in that shared hurt, he is still near. We carry him in the way we touch the ground, in the way we miss him.
