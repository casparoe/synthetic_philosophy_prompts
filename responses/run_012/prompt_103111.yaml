prompt: |-
  I'm doing a metaethics module and we've just hit expressivism, and specifically the Frege–Geach problem. Before I start revising the different expressivist accounts I want the actual spec first, because at the moment I keep judging them against whatever example happens to be on the slide in front of me.

  So, act as a philosopher working on metaethics and the philosophy of language, and think carefully before you answer. Give me the desiderata — the full list of things any adequate expressivist semantics for moral language has to get right — with, for each item, the case or consideration that puts it on the list. I want the requirements that are genuinely required, not just the ones the Blackburn/Gibbard quasi-realist tradition happens to care about, and I'd like you to flag any pair of requirements you think can't be satisfied together. That's the bit I'm most interested in, because if there's an inconsistent subset then the list itself is a result.

  Make sure you at least consider these as candidate requirements and say which are genuine desiderata and which are just parochial: simple unembedded moral sentences; negation, including the difference between negating the moral content and negating the attitude expressed; moral sentences in the antecedent and in the consequent of conditionals; mixed inferences where a moral conclusion follows from a factual premise plus a conditional; agreement and disagreement between two speakers; and the validity of arguments as opposed to just their soundness. Then tell me which single requirement does the most work in ruling out the cheap versions of expressivism.

  One more thing to fold in, because my tutor raised it and I don't think it's a standard item on these lists: moral sentences sitting in the antecedent of a conditional whose consequent is a plain prediction about the world — something like 'if lying is wrong then it'll rain tomorrow' — seem to behave in two quite different ways depending on how you read them, and an expressivist story has to say which reading it's giving and why. Treat that as a requirement in its own right, and say whether it's really independent of the embedding requirement or just the same point again.

  Keep it tight, and no bibliography or citations please — just the list, the case behind each requirement, and the incompatibility verdict.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher working on metaethics and philosophy of language.
      *   **Task:** Provide the *desiderata* (requirements) for an adequate expressivist semantics for moral language.
      *   **Specifics:**
          *   List the requirements with the case/consideration for each.
          *   Distinguish genuine requirements from parochial ones (Blackburn/Gibbard specific).
          *   Flag any incompatible pairs of requirements (inconsistency verdict).
          *   Address specific candidate requirements: simple sentences, negation (content vs. attitude), conditionals (antecedent/consequent), mixed inferences, agreement/disagreement, validity vs. soundness.
          *   Address the tutor's specific point: conditionals with moral antecedents and factual consequents ("If lying is wrong, it will rain").
          *   Identify the single requirement that does the most work against "cheap" expressivism.
          *   **Constraint:** No bibliography or citations. Keep it tight.

  2.  **Deconstruct the Core Problem (Frege-Geach):**
      *   Expressivism says moral sentences express non-cognitive attitudes (e.g., "Murder is wrong" expresses disapproval of murder).
      *   Problem: Moral sentences appear in unasserted contexts (conditionals, questions, negations).
      *   In "If murder is wrong, then stealing is wrong," the speaker isn't expressing disapproval of murder. So what does "murder is wrong" mean here?
      *   If the meaning changes between asserted and unasserted contexts, we commit the fallacy of equivocation, and moral arguments become invalid.
      *   Therefore, expressivists need a semantics that explains meaning uniformly across contexts while maintaining the core expressivist insight.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Candidate 1: Simple Unembedded Sentences.*
          *   Case: "Murder is wrong."
          *   Requirement: Must capture the action-guiding/motivational nature.
          *   Verdict: Genuine. If it doesn't do this, it's not expressivism, it's realism.

      *   *Candidate 2: Negation.*
          *   Case: "Murder is not wrong."
          *   Requirement: Distinguish between denying the attitude (I don't disapprove) and contradicting the moral claim (It is not the case that murder is wrong).
          *   Verdict: Genuine. Crucial for logical relations.

      *   *Candidate 3: Embedding (Conditionals).*
          *   Case: "If murder is wrong..."
          *   Requirement: The meaning of "murder is wrong" must remain constant whether asserted or embedded.
          *   Verdict: Genuine. This is the heart of Frege-Geach.

      *   *Candidate 4: Validity of Arguments.*
          *   Case: Modus Ponens (P, If P then Q, therefore Q).
          *   Requirement: Moral arguments must be formally valid, not just psychologically persuasive.
          *   Verdict: Genuine. Logic applies to moral discourse.

      *   *Candidate 5: Agreement and Disagreement.*
          *   Case: A says "X is good," B says "X is bad."
          *   Requirement: Must explain how they are disagreeing, not just having clashing attitudes.
          *   Verdict: Genuine. Disagreement is a feature of moral discourse.

      *   *Candidate 6: The Tutor's Point (Moral Antecedent -> Factual Consequent).*
          *   Case: "If lying is wrong, it will rain."
          *   Analysis: This is a weird sentence. Usually, conditionals link related propositions. If the antecedent is moral and consequent factual, is it a material conditional? A Gibbardian conditional?
          *   Is it independent? It tests the *scope* of the embedding solution. If the semantics for "If P then Q" only works when Q is also moral, it's too narrow. It needs to handle mixed conditionals.
          *   Verdict: Genuine, but likely subsumed under Embedding/Validity. However, it highlights the *connection* problem. Let's treat it as a stress test for the embedding requirement.

      *   *Candidate 7: Parochial vs. Genuine.*
          *   Quasi-realism (mimicking realism) is a *goal*, not a semantic requirement per se. The requirement is *logical consistency*, the goal is *saving the phenomena*.
          *   "Saving the intuitions of the man in the street" is parochial. "Logical validity" is genuine.

  4.  **Identifying Incompatibilities (The "Hard" Part):**
      *   Is there a genuine inconsistency?
      *   *Tension:* The requirement that moral sentences express *attitudes* (non-cognitive states) vs. the requirement that they function as *propositions* in logic (truth-apt, embeddable).
      *   Attitudes don't negate like propositions. Disapproving of murder doesn't have a truth value. Propositions do.
      *   *The Inconsistency:* **Non-Cognitive Semantics vs. Propositional Logic.**
      *   Strictly speaking, you cannot have a semantics where the *meaning* is constituted by a non-cognitive state *and* have that meaning function identically to a cognitive state in all logical contexts without positing a "propositional shadow."
      *   If you posit the shadow, are you still an expressivist?
      *   *Verdict:* The tension is between **Semantic Atomism (Meaning = Attitude)** and **Semantic Compositionality (Meaning = Contribution to Truth Conditions)**. You can't have meaning *exhaustively* be the attitude and *simultaneously* be the kind of thing that sits in a conditional antecedent without equivocation. One must give. Expressivists usually give on Atomism (moving to complex states of mind), but the tension remains.

  5.  **Addressing the Tutor's Point Specifically:**
      *   "If lying is wrong, it will rain."
      *   This is often called a "mixed conditional" or "embedding in factual contexts."
      *   Is it independent? It's a specific instance of the Embedding Requirement. However, it's harder because there's no obvious moral attitude in the consequent to "mix."
      *   If the expressivist says this sentence is nonsense, they fail the Embedding Requirement (natural language accepts it).
      *   If they say it has truth conditions, they risk realism.
      *   Decision: It is not independent; it is the *limit case* of the Embedding Requirement.

  6.  **Identifying the "Killer" Requirement:**
      *   What kills "cheap" expressivism (e.g., "It just means I boo!")?
      *   It's **Validity/Logical Equivocation**.
      *   Cheap expressivism says "Wrong" means "Boo."
      *   Argument: "Boo Murder. If Boo Murder then Boo Stealing. Therefore Boo Stealing."
      *   This is invalid. "Boo Murder" in the premise is an act. "Boo Murder" in the conditional is not.
      *   So, **The Requirement of Univocality across Asserted and Unasserted Contexts** is the heavy lifter.

  7.  **Refining the Output:**
      *   Structure: Introduction -> The List (Requirement + Case) -> Incompatibility Verdict -> The Tutor's Point -> The "Killer" Requirement.
      *   Tone: Professional, philosophical, precise.
      *   Check constraints: No citations. Tight.

  8.  **Self-Correction/Polishing during drafting:**
      *   *Correction on Incompatibility:* Be careful not to say expressivism is *impossible*. Say there is a *tension* that looks like an inconsistency between the *definition* of expressivism and the *demands* of semantics. The "inconsistency" is between **Meaning-as-Attitude** and **Meaning-as-Logical-Content**.
      *   *Tutor's Point:* Make sure to explicitly state whether it's independent. I'll argue it's a stress test of Compositionality, not a separate requirement.
      *   *Negation:* Ensure the distinction between "I don't disapprove" (failure of expression) and "It is not wrong" (contradiction) is clear.

  9.  **Final Review against Prompt:**
      *   List desiderata? Yes.
      *   Case for each? Yes.
      *   Flag incompatibilities? Yes.
      *   Address specific candidates (simple, negation, conditionals, mixed inference, agreement, validity)? Yes.
      *   Address Tutor's point (Moral -> Factual conditional)? Yes.
      *   Identify single requirement ruling out cheap versions? Yes.
      *   No bibliography? Yes.

  10. **Final Polish:** Ensure the distinction between "parochial" (Quasi-realist ambitions) and "genuine" (Logical coherence) is sharp. (Self-correction: Quasi-realism is the *project*, the requirements are the *hurdles*. I should frame the requirements as conditions for the project's success).

      *Wait, one nuance:* The prompt asks for "incompatibility verdict." If I say "There is a tension," that's weak. I need to be bolder. The strongest philosophical claim here is that **Non-Cognitive Meaning** and **Propositional Embeddability** are formally incompatible *unless* you redefine one. I will frame this as the core inconsistency the expressivist must dissolve.

      *Tutor's Point:* "If lying is wrong, it will rain." This is actually a specific problem for *normative* expressivism regarding *factual* conditionals. If moral sentences don't describe facts, how do they constrain factual expectations? Actually, usually, this sentence is considered semantically defective or trivially true (if antecedent is non-cognitive, the conditional is weird). But the requirement is that the semantics must *account for its intelligibility or lack thereof*. I will classify it under Embedding/Compositionality.

      *Let's write.*
answer: |-
  Here is the specification list for an adequate expressivist semantics. I have distinguished between genuine logical constraints and parochial theoretical ambitions, followed by the inconsistency verdict and the specific analysis of your tutor's point.

  ### The Desiderata List

  **1. The Requirement of Motivational Internalism (Simple Sentences)**
  *   **The Case:** In an unasserted, sincere utterance of "Stealing is wrong," the speaker must be understood as expressing a conative state (e.g., disapproval) that is intrinsically linked to motivation.
  *   **Why it's Genuine:** If the semantics fails here, the theory ceases to be expressivism and collapses into a form of error theory or realism. This is the defining commitment.
  *   **Parochial Flag:** The requirement that this motivation must *always* result in action is parochial (weak internalism suffices); the semantic requirement is only that the *meaning* is constituted by the attitude.

  **2. The Requirement of Contradictory Negation**
  *   **The Case:** We must distinguish between "I do not disapprove of stealing" (failure to express the attitude) and "Stealing is not wrong" (the contradictory of the moral claim).
  *   **Why it's Genuine:** Natural language allows us to deny moral claims without merely reporting our psychological state. If "Stealing is not wrong" just means "I don't disapprove," then two speakers could agree on the facts of their psychology while genuinely disagreeing morally. The semantics must allow for contradiction, not just psychological incompatibility.

  **3. The Requirement of Univocality (Embedding)**
  *   **The Case:** The meaning of "Stealing is wrong" must remain constant whether it appears as a standalone assertion or embedded in the antecedent of a conditional ("If stealing is wrong...").
  *   **Why it's Genuine:** This is the core of the Frege–Geach problem. If the meaning shifts between contexts, the term is ambiguous. If it is ambiguous, logical relations between the contexts break down.
  *   **Parochial Flag:** The requirement that the embedded meaning must *look* like a truth-condition is parochial; the genuine requirement is simply that it functions compositionally.

  **4. The Requirement of Formal Validity**
  *   **The Case:** Arguments like Modus Ponens must be valid in moral discourse (e.g., "If stealing is wrong, then getting your brother to steal is wrong. Stealing is wrong. Therefore, getting your brother to steal is wrong.").
  *   **Why it's Genuine:** Logic is topic-neutral. If moral arguments are valid, it is in virtue of their form, not their content. An expressivist semantics that renders these arguments invalid (due to equivocation on the antecedent) fails to capture the normative force of moral reasoning.
  *   **Distinction:** This is distinct from *soundness*. We are not requiring the premises to be true (which is hard for expressivists), but that *if* the premises hold, the conclusion follows.

  **5. The Requirement of Disagreement in Attitude**
  *   **The Case:** When Speaker A says "X is good" and Speaker B says "X is bad," they are disagreeing, not merely clashing.
  *   **Why it's Genuine:** Moral discourse is dialectical. If expressivism reduces this to "I like X" / "I dislike X," it becomes a mere exchange of autobiographical reports, making disagreement impossible (both reports could be true). The semantics must explain how attitudes can conflict logically, not just causally.

  ### The Inconsistency Verdict

  There is a fundamental tension, bordering on inconsistency, between **Requirement 1 (Motivational Internalism)** and **Requirement 3 (Univocality/Embedding)**.

  *   **The Conflict:** Requirement 1 dictates that the semantic content of a moral sentence is *exhausted* by a non-cognitive attitude. Non-cognitive attitudes (like booing or disapproving) are not the kind of things that have truth values, nor are they the kind of things that can sit in the antecedent of a conditional without being asserted. Requirement 3 dictates that moral sentences must function as propositions that contribute to the truth-conditions (or acceptance-conditions) of complex sentences.
  *   **The Verdict:** You cannot have a semantics where meaning is *strictly* identical to a non-cognitive state and *simultaneously* have that meaning function as a logical operand in unasserted contexts.
  *   **The Resolution:** Adequate expressivist theories do not solve this by satisfying both strictly; they solve it by modifying Requirement 1. They argue that the "meaning" is not the attitude itself, but a *higher-order attitude* toward the combination of attitudes. This saves Univocality but stretches the definition of Internalism. If you hold Requirement 1 rigidly (Meaning = First-Order Attitude), the list is inconsistent.

  ### The Tutor's Point: Moral Antecedents with Factual Consequents

  **The Case:** Consider "If lying is wrong, then it will rain tomorrow."
  This sentence seems semantically defective or at least bizarre. Unlike "If lying is wrong, then getting your brother to lie is wrong," there is no obvious connection between the moral attitude and the factual prediction.

  **Is it Independent?**
  No, this is not an independent requirement. It is a **limit case of Requirement 3 (Univocality/Embedding)**.
  *   **Reasoning:** If your expressivist semantics handles standard moral conditionals (Moral → Moral) via a logic of consistency among attitudes, it must also explain what happens when the consequent is factual.
  *   **The Trap:** If the expressivist says this sentence is meaningless, they violate the descriptiveness of semantics (native speakers find it intelligible, even if false or weird). If they say it is meaningful, they must explain how a non-cognitive antecedent constrains a factual consequent.
  *   **The Verdict:** An adequate theory must classify this sentence correctly (usually as a conditional where the antecedent fails to impose a constraint on the consequent, rendering the conditional vacuously acceptable or pragmatically odd). It tests whether the embedding solution is robust enough to handle *mixed* vocabulary, not just moral vocabulary. It is the same point as Embedding, but applied to heterogeneous contexts.

  ### The "Killer" Requirement

  The single requirement that does the most work in ruling out "cheap" expressivism is **Requirement 3: The Requirement of Univocality (Embedding).**

  **Why:**
  Cheap expressivism (e.g., " 'Wrong' just means 'Boo!' ") handles simple sentences (Requirement 1) and disagreement (Requirement 5) easily. It fails catastrophically on embedding.
  *   In "Boo Murder," "Boo" is an act.
  *   In "If Boo Murder...", "Boo" cannot be an act (I am not booing).
  *   If the meaning changes from *act* to *content*, the argument "Boo Murder; If Boo Murder then Boo Stealing; Therefore Boo Stealing" commits the fallacy of equivocation.

  Any expressivist account that does not provide a unified semantic value for moral terms across asserted and unasserted contexts is logically inert. Satisfying Univocality forces the expressivist to develop a complex logic of attitudes (e.g., Gibbard's norm-expressivism or Blackburn's projectivism), which is where the actual philosophical work begins. It is the gatekeeper between a slogan and a semantics.
