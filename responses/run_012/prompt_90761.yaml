prompt: |-
  Ok so this is a weird one, but I've gone down a rabbit hole and I need help. I do exhibit design at a natural history museum — I make the little pictogram panels, the ones with the fork, the bed, the no-flash-camera symbol — and my museum sent me to a workshop where someone brought up Otto Neurath, this guy from back between the wars who wanted to build an entire international language out of pictures. Not decoration, an actual language, so that science and public information could get across without any words at all. His team made these giant charts of little stick figures and factories and houses, and he really seemed to think it could work as a universal language.

  Anyway, now two of my coworkers wont shut up about it. One of them, the Believer, thinks Neurath basically had it right and that a well-built picture language can be a full language — she says a picture carries meaning that words can't, that a picture means more than whatever it literally depicts, and that we're just not clever enough yet with our conventions. The other one, the Skeptic, thinks that's a fantasy: pictures are fine for man, house, five apples, but the second you need "not," or "if...then," or "every," or "probably," or "ought," or a thing that doesn't even exist, you have to smuggle in words or made-up symbols, and then it's not a picture language anymore, it's a rebus.

  They've been going in circles for two months and I want to make them write the one document they could both actually sign — an adversarial-collaboration thing. Can you draft it for them? I'd definately want:

  1. A numbered list of agreed claims — what pictures can and can't do, what a "language" even has to be able to do to count as one, what Neurath actually claimed versus what people now say he claimed, and the cases where both of them agree the picture really does carry the meaning.

  2. The real disagreements, each phrased so that both of them would say "yeah, that's more or less my view" — the big one being whether a picture language can be a complete language or only a notation for a restricted job.

  3. The cruxes, i.e. the sub-questions where settling it would actually move one of them. My guess is one is whether logical relations — negation, conditionals, "all," "some" — have to be carried by a dedicated symbol at all, or whether absence, crossing-out, ordering, and repetition can do the work; and another is whether the point of a picture language is to say everything or just to be unambiguous for one specific audience. Tell me if I've got the cruxes wrong.

  4. For each crux, something they'd both agree counts as evidence — a test, a case, an example — plus what each side predicts it will show. For instance I keep coming back to my own panels: if you draw an empty birdcage, does a viewer read "no birds," or "birds," or nothing? Both of them should be able to agree on what a viewer would actually take away, and on whether that settles anything.

  And one more thing, maybe the most important: if part of their fight is really just about words — like they mean different things by "language" or by "picture" — say so, and tell me which part.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **User:** Exhibit designer at a natural history museum.
      *   **Context:** Two coworkers (The Believer vs. The Skeptic) are arguing about Otto Neurath's ISOTYPE (International System of TYpographic Picture Education) and whether a picture-based language can be a *complete* language.
      *   **Task:** Draft an "adversarial collaboration" document they can both sign.
      *   **Requirements:**
          1.  Numbered list of agreed claims (capabilities/limitations of pictures, definition of "language," Neurath's actual claims vs. myths, agreed success cases).
          2.  Real disagreements (phrased neutrally so both accept the characterization).
          3.  The Cruxes (sub-questions that would move the needle). User suggests: logical relations (negation, etc.) vs. dedicated symbols; and universal completeness vs. restricted utility.
          4.  Evidence/Tests for each crux (agreed metrics, predictions from both sides).
          5.  Terminology Check: Identify if they are just arguing about definitions ("language," "picture").
      *   **Tone:** Professional, precise, slightly academic but accessible (museum context), neutral/facilitative.

  2.  **Deconstruct the Subject Matter (Neurath/ISOTYPE):**
      *   *Who:* Otto Neurath (1882–1945), Austrian philosopher, sociologist, economist.
      *   *What:* ISOTYPE (International System of TYpographic Picture Education).
      *   *Goal:* Visual education, democratization of knowledge, "Vienna Method."
      *   *Philosophy:* Logical Positivism (Vienna Circle). Pictures as a tool for social progress, not necessarily a *replacement* for all speech, but a universal medium for facts/statistics.
      *   *Limitations:* ISOTYPE was great for statistics (1 icon = 1000 tons of coal), less great for abstract philosophy or complex grammar without some textual aid (though Neurath aimed to minimize text).
      *   *The Debate:* Can visuals *replace* syntax/grammar entirely (Believer) or are they inherently limited to nouns/quantities without becoming a code/rebus (Skeptic)?

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound formal but collaborative. "Statement of Agreement and Disagreement regarding Visual Communication Systems."
      *   **Introduction:** Acknowledge the context (Neurath workshop) and the goal (clarity).

      *   **Section 1: Agreed Claims (Common Ground):**
          *   Need to validate both sides.
          *   *Pictures:* Good for concrete objects, quantities, immediate recognition.
          *   *Language:* Needs syntax, recursion, ability to express truth claims.
          *   *Neurath:* He wanted "transformation of knowledge," not necessarily replacing *all* speech, but replacing *barriers* of speech.
          *   *Success Cases:* Safety signs, transit maps, statistical charts (ISOTYPE's strength).

      *   **Section 2: The Real Disagreements:**
          *   Need to avoid caricature.
          *   *Believer:* Pictures *can* evolve syntax (context, arrangement) to handle abstraction.
          *   *Skeptic:* Pictures rely on implicit linguistic scaffolding; without explicit symbols for logic, it's not a language, it's a prompt.
          *   *Scope:* Universal vs. Domain-Specific.

      *   **Section 3: The Cruxes (The "Move the Needle" questions):**
          *   *Crux 1: Logical Operators.* Can visual arrangement (crossing out, placement) equal "NOT" or "IF"? Or does it need a symbol?
          *   *Crux 2: Completeness vs. Utility.* Is the goal to say *anything* (universal) or to say *specific things clearly* (functional)?
          *   *User's Crux Check:* The user guessed these two. They are accurate. I should validate them but refine the phrasing.

      *   **Section 4: Evidence & Predictions:**
          *   Need concrete tests.
          *   *Test 1 (Logic):* The "Empty Birdcage" example the user gave is perfect. Also, a conditional (If rain, then stay inside).
          *   *Test 2 (Completeness):* Try to explain a non-visual concept (e.g., "democracy" or "yesterday") without text.
          *   *Predictions:* Believer thinks context suffices; Skeptic thinks ambiguity wins.

      *   **Section 5: The Terminology Trap (The "Most Important" thing):**
          *   This is crucial. "Language" is the battleground.
          *   *Linguistic definition:* Discrete infinity, recursion, syntax (Chomsky-ish).
          *   *Communicative definition:* Successful transmission of intent.
          *   *Picture definition:* Iconic resemblance vs. Arbitrary symbol.
          *   *Neurath's definition:* "Language of things" vs. "Language of words."
          *   *Verdict:* They are likely talking past each other on the definition of "Language."

  4.  **Refining and Polishing:**
      *   *Tone Check:* Is it too dry? Keep it engaging for designers.
      *   *Neurath Accuracy:* Ensure I don't attribute things to Neurath he didn't say. He knew text was sometimes needed but wanted to minimize it. He called it a "language of things."
      *   *Formatting:* Use clear headings, bullet points, and bold text for readability.
      *   *User's Specific Request:* "Tell me if I've got the cruxes wrong." -> I need to address this in the output. (They are mostly right, but the "definition of language" is the deeper crux).

  5.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe I should take a side? *Correction:* No, the prompt asks for a document *they* can sign. It must be neutral.
      *   *Initial thought:* Is ISOTYPE a language? *Correction:* Neurath called it a "visual language," but linguists debate this. The document needs to reflect that tension.
      *   *Refining the "Empty Birdcage":* The user asked about this specifically. I need to make sure the "Evidence" section uses this or similar examples.
      *   *Terminology:* I need to explicitly highlight the "Language" definition war in section 5 as requested.

  6.  **Final Review against constraints:**
      *   Numbered list of agreed claims? Yes.
      *   Real disagreements phrased neutrally? Yes.
      *   Cruxes identified? Yes.
      *   Evidence/Predictions for cruxes? Yes.
      *   Terminology check included? Yes.
      *   Tone appropriate? Yes.

  7.  **Final Polish:** Add a brief intro/outro to frame the document for the user. (Proceed to generate output).

  *(Self-Correction on Neurath Nuance)*: I need to be careful not to say Neurath thought it could replace *poetry* or *emotion*. He was focused on *facts* and *statistics*. The Believer might be over-extending Neurath, and the Skeptic might be under-estimating ISOTYPE's syntactic rules. I will balance this in the "Agreed Claims" about Neurath.

  *(Self-Correction on Cruxes)*: The user asked "Tell me if I've got the cruxes wrong." I should answer this directly in the commentary, not just in the document. The cruxes are good, but the *definition* crux is more fundamental. I will add that.

