answer: |-
  Here is the diagnosis.

  First, we must discard the "levels-confusion" hypothesis, though it is the most comforting narrative for graduate students looking for closure. The standard peace treaty invokes Marr: Classicists are doing the computational level, Connectionists the implementational. This is false charity. Prominent connectionists (like Smolensky or Hinton) do not claim to be merely implementing Fodor's symbols in neurons; they claim distributed representations *replace* symbolic structures at the cognitive level of description. They argue that what looks like a rule is actually a trajectory through a state space. Fodor knows this and attacks them precisely on that ground, arguing that without explicit constituent structure, you cannot get systematicity *by definition*. Since both sides claim ownership of the cognitive/computational level and offer rival accounts of how inference works, this is not a confusion of levels; it is a rivalry for the same explanatory territory.

  Second, we must discard the "verbal" hypothesis. It is tempting to say "language" is just a metaphor for structure, and once we define "structure" mathematically, the fight vanishes. But the mathematical structures are genuinely distinct. Classicists require discrete, locally bound constituents (a symbol for "John" combines with a symbol for "Loves"). Connectionists rely on continuous, distributed activation patterns where "John" is a vector that modulates the whole system. These are not just different words for the same thing; they have different causal consequences. A symbolic system crashes on ill-formed inputs; a connectionist system degrades gracefully. A symbolic system requires explicit training on rules; a connectionist system generalizes via similarity. If the disagreement were merely verbal, these architectural predictions would converge. They do not.

  This leaves us with your third hypothesis: it is a **real substantive disagreement** that is **underdetermined** by the available evidence. This is the correct diagnosis. The stalemate persists because of *behavioral equivalence*. You can build a neural network that mimics symbolic reasoning (within bounds), and you can build a symbolic system that mimics probabilistic guessing. Because we only have access to input-output behavior (and coarse-grained neural data), we cannot uniquely infer the internal format. Fodor's argument is an Inference to the Best Explanation (IBE): "Systematicity exists; only LoT explains it." Connectionists rebut the IBE: "LoT is not the only explanation; here is a network that learns it." Since both can fit the data, the choice between them relies on metaphysical priors (e.g., "must explanation be deductive?" vs. "must explanation be biologically plausible?") rather than empirical knockout blows.

  The imagery debate was different because it involved phenomenology (introspection) which provided a constraint that pure behaviorism lacked. The LoT debate has no such introspective anchor—you cannot "feel" your syntax. The rise of Deep Learning and LLMs has not settled this; it has merely shifted the burden of proof. LLMs demonstrate that statistical systems can mimic systematicity, challenging Fodor's claim that *only* LoT explains it. However, Classicists retort that LLMs fail at *strong* systematicity (systematic generalization out-of-distribution), proving they lack true compositional structure. We are back to square one: is the failure a matter of scale (give it more data) or format (it needs symbols)? The data does not yet decide.

  Progress will not come from more fMRI scans or accuracy plots, as both sides can retrofit their models to fit them. Progress requires a **formal impossibility result** or a **critical cognitive capacity**. We need a proof that distributed representations *cannot* capture a specific logical relation (e.g., variable binding in recursive structures) without effectively becoming symbolic, or vice versa. Alternatively, we need an experiment targeting *systematic generalization* in humans that strictly violates the learning curves possible for distributed systems but is trivial for symbolic ones. Until then, the debate is a substantive clash of ontologies stalled by empirical underdetermination.

  The disagreement is a substantive conflict over the ontology of mental representation that remains stalled because behavioral and neural data are currently insufficient to distinguish between symbolic and distributed architectures.

  \answer{underdetermined-substantive}
