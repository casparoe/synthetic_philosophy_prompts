prompt: |-
  I'm a second-year cognitive science PhD student, and I've spent the last two months reading around the language-of-thought debate for a seminar, and I've hit a wall I cant get past. I'd like you to act as a philosopher of cognitive science — someone who's actually read both sides closely and is allergic to fence-sitting — and help me figure out what kind of disagreement this really is. Think it through carefully before you commit; start by listing the plausible diagnoses, then argue yourself down to the best one.

  Here's the stall, as concretely as I can put it. On one side are the classicists, roughly in the Fodor tradition: they say thought has to be compositional and systematic — you can think that John loves Mary only if you can think that Mary loves John, and you can entertain indefinitely many novel thoughts — and that the only way to explain this is to posit a representational medium with a combinatorial syntax and semantics, a language-like format. On the other side are the connectionists, who say distributed representations can capture the same regularities, or that systematicity is a graded, emergent, context-sensitive matter rather than a hard constraint, or that the classicists are demanding the explanation at the wrong level of description altogether. And there's a parallel fight I keep being told is the "same" debate — the old imagery dispute between the people who say mental images are depictive, picture-like, and the people who say they're really propositional underneath.

  What bugs me is that both sides seem to agree on the phenomena. Nobody disputes that we're systematic or productive. Nobody disputes that the brain is a connectionist mess at the level of neurons. They just keep sliding past each other, and alot of years in, neither has moved. Now everyone in my lab says the whole thing is obviously settled — by deep learning, or by LLMs, depending on who's talking — but I honestly can't tell whether that's the same disagreement coming back or a different one wearing its clothes.

  My working hypothesis (and I want you to push on it, not just agree) is that it's a levels-of-explanation confusion: the classicists are asking a question at the computational/representational level and the connectionists keep answering at the implementational level, so they aren't even disagreeing. But maybe that's too tidy. Maybe it's verbal — maybe "language" is doing metaphorical work and once you say properly what "language-like" means, the two views collapse into one. Or maybe it's a real substantive disagreement about representational format that just happens to be underdetermined by all the behavioral and imaging data we could ever collect. Or maybe it's ill-posed.

  So: diagnose it. Tell me what kind of disagreement this really is, using what each side actually says rather than a survey, and be specific about which of my three guesses (or something else) survives scrutiny. Then tell me what would count as progress given your diagnosis — a distinction, a formal result, a new kind of experiment, a change of question — or argue that no progress should be expected here and why. I don't want a both-sides-are-right essay; I want a verdict with reasons, and I want you to name what would actually move the thing.

  Format: put the reasoning first, and end with a final line in the form \answer{...}, where the braces contain your single best label for the disagreement — one of verbal, different-questions, levels-confusion, underdetermined-substantive, ill-posed, or other: <your label>. Right before that line, give me the one-sentence version of your verdict.
