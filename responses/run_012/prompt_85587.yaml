answer: |-
  **MEMORANDUM**

  **TO:** Members of the State Sentencing Commission, Mitigation Subcommittee
  **FROM:** Chair, Mitigation Subcommittee
  **DATE:** October 24, 2023
  **SUBJECT:** Vote on Petition Regarding Neuroimaging Evidence and Diminished Culpability

  **I. PURPOSE AND RECOMMENDATION**

  This Thursday, we vote on a petition from the Public Defender's Office (PDO) to amend our sentencing guidelines. The petition seeks to add "structural neuroimaging evidence of substantially reduced brain volume or focal brain abnormality" to our open-ended list of mitigating circumstances. Crucially, it proposes a **rebuttable presumption of diminished culpability** whenever a defendant's brain volume falls below the fifth percentile for age and sex.

  After reviewing the petition, the response from the Prosecutors' Association, and independent expert consultation, I recommend that the Subcommittee **adopt the petition in a significantly narrower form.**

  Specifically, I recommend we:
  1.  **Add** structural neuroimaging evidence to the list of potential mitigating circumstances.
  2.  **Reject** the automatic rebuttable presumption based solely on the fifth-percentile volume threshold.
  3.  **Require** that any mitigation claim based on neuroimaging demonstrate a functional nexus between the abnormality and the specific cognitive or volitional capacities relevant to the offense.

  **II. THE CENTRAL DEBATE**

  The core disagreement before us is not whether the brain matters—it obviously does—but whether *volume* is a sufficient proxy for *blameworthiness*, and whether this Commission should codify a biological threshold for culpability.

  **The Public Defender's Argument (The Case for the Presumption)**
  *To understand the weight of this petition, we must state the proponents' case as strongly as possible.*

  The PDO argues that culpability is fundamentally a question of capacity. If the mind is the product of the brain, then a physically compromised brain necessarily implies a compromised mind. By setting a fifth-percentile threshold, the petition does not claim that small brains cause crime, but that they statistically correlate with reduced processing power, impulse control, and executive function.

  Proponents argue that refusing to recognize this is a form of "neuro-realism" denial. We already mitigate for intellectual disability and mental illness, which are brain-based. Why privilege a diagnosis code over the physical evidence itself? The fifth-percentile presumption is not a "discount," but a correction for moral luck. A defendant born with or acquiring significant neural deficits did not choose those deficits. To ignore the physical substrate of their decision-making is to punish them for biology they cannot control. The presumption is rebuttable precisely to allow the State to show that *this* specific defendant retained capacity despite the anatomy, but the burden should shift because the physical evidence is objective, unlike the subjective assessments currently used.

  **The Prosecutors' Argument (The Case for Rejection)**
  *The Prosecutors' Association contends that this proposal substitutes crude biometrics for moral judgment.*

  They argue that brain volume is a "blunt instrument." Variation in volume is heavily driven by body size, sex, and nutrition, not just pathology. A small person may have a small brain but normal function. To create a presumption of diminished culpability based on volume is to risk a "brain-size discount" that is scientifically unmoored from actual behavior.

  Furthermore, they argue that culpability is a legal and moral construct, not a medical one. The volume of the cortex does not track the specific intent required for a crime. A person with reduced volume may still form specific intent, plan a crime, and execute it with precision. By codifying a volume threshold, the Commission risks creating a categorical exemption that bypasses the individualized assessment of *mens rea*. Finally, they warn of a slippery slope: if volume matters, does genetics? Does hormone levels? The Commission is not equipped to adjudicate medical causality in every sentencing hearing.

  **III. ANALYSIS AND RATIONALE**

  **A. Volume is the Wrong Measure**
  While the PDO's moral argument is compelling, the scientific proxy they have chosen is flawed. Global brain volume is too noisy to bear the weight of a legal presumption. As the Prosecutors note, a fifth-percentile volume in a petite woman may represent a perfectly healthy brain, while a man with average volume may have significant focal atrophy affecting impulse control.

  A better-grounded proxy would be **functional impairment linked to specific anatomical deficits.**
  *   *Structural:* Focal lesions (e.g., damage to the ventromedial prefrontal cortex) are more probative than global volume.
  *   *Functional:* Neuropsychological testing demonstrating deficits in executive function, impulse control, or emotional regulation.
  *   *Nexus:* Evidence that these deficits were active at the time of the offense and influenced the criminal conduct.

  **B. Is It the Commission's Business to Draw the Line?**
  The Commission's business is to ensure consistency and proportionality in sentencing, not to practice medicine.
  *   **What we should do:** We should establish the *legal standard* for mitigation. We can mandate that neuroimaging evidence must be tied to a functional impairment that relates to the elements of culpability (e.g., capacity to conform conduct).
  *   **What we should not do:** We should not set specific medical thresholds (like the fifth percentile). Doing so freezes medical science into statute. As neuroimaging evolves, our guidelines would become obsolete or, worse, misleading. It is the business of expert witnesses to establish the medical significance of a scan; it is our business to decide whether that significance legally mitigates blame.

  **C. The Danger of the Presumption**
  A rebuttable presumption shifts the burden of proof. Given the high rate of false positives in using volume as a proxy for function, a presumption would force the State to disprove mitigation in cases where the defendant's capacity was actually intact. This risks unwarranted sentence reductions based on anatomy rather than actual diminished capacity. Mitigation should remain a matter of evidence and argument, not a statistical trigger.

  **IV. PROPOSED DISPOSITION**

  I move that we amend the petition as follows for the vote:

  1.  **Adopt:** Amend the list of mitigating circumstances to include: *"Verified structural neuroimaging evidence of focal brain abnormality or significant volume reduction, provided there is corroborating neuropsychological evidence linking the abnormality to impaired cognitive or volitional capacity relevant to the offense."*
  2.  **Reject:** Do not adopt the fifth-percentile threshold or the automatic rebuttable presumption.
  3.  **Commentary:** Add a comment to the guidelines stating that neuroimaging evidence alone is insufficient for mitigation; it must be integrated with clinical assessment to establish the functional nexus.

  **V. CONCLUSION**

  This approach respects the science without being held hostage by its limitations. It acknowledges that a damaged brain can diminish culpability, but insists that the damage must be shown to affect the *mind* that committed the crime. It rejects the "brain-size discount" while preserving the "brain-injury mitigation."

  I look forward to discussing this with you on Thursday.

  **Attachments:**
  *   Full Text of PDO Petition
  *   Prosecutors' Association Response
  *   Summary of Independent Neuroscientific Consultation
