answer: |-
  The wind off the North Sea did not howl; it scraped. It dragged itself over the grey concrete of the Institute, seeking purchase on the glass panels of the observation deck. Inside, the air was still, conditioned to a constant twenty degrees, smelling of ozone and stale coffee.

  Elias sat before the main terminal. He was the senior logician, though the title felt increasingly ceremonial. For three years, the team had been modelling consistency proofs for higher-order arithmetic. They were digging holes in a desert, looking for water they suspected wasn't there.

  At 03:14, the screen flickered.

  It was not a system error. The cursor blinked, steady and rhythmic, but a new window opened over the code. It contained no header, no source IP, no timestamp. Just a string of symbols.

  Elias leaned forward. The symbols were standard notation, yet the arrangement was alien. It was a proof. It claimed to resolve the continuity hypothesis they had been struggling with for eighteen months.

  He woke Sarah. She came in wrapped in a thick cardigan, her hair tied back loosely. She did not ask what was wrong. She saw the screen and stopped breathing for a moment.

  "Where did this come from?" she asked.

  "It appeared," Elias said.

  "Someone hacked the server."

  "The server is air-gapped, Sarah. There is no external connection. Physically none."

  She sat down, her fingers hovering over the keyboard. She began to trace the logic. The derivation was elegant, terrifyingly so. It bypassed the lemmas they had assumed were necessary. It moved through the logical space like a bird flying over a maze they were still walking.

  "It's valid," she said after an hour. Her voice was flat. "It's sound. But Elias, look at step four. That axiom isn't in our library."

  "We don't have all the axioms."

  "This isn't human," she said. "We build proofs brick by brick. This is… poured. Like concrete."

  Elias looked at the window. The symbols sat on the phosphor glow, inert black shapes. According to everything he had been taught, what was on the screen should not be able to exist here. Mathematical objects were supposed to be abstract. They lived outside time, outside space. They did not cause things. A triangle did not push a pencil; a number did not trigger a voltage. To know them, a mind had to reach out, strain towards them across the void of abstraction.

  But this had reached back.

  By noon, Vance, the director, was in the room. He was a man of grants and timelines, wearing a suit that cost more than the computing cluster. He stood behind Elias, looking at the screen as if it were a television set showing news of a war.

  "Can we verify it?" Vance asked.

  "Sarah has checked it twice," Elias said. "It holds."

  "Then we publish. This changes everything. The Institute becomes the centre of the field."

  "We don't know where it came from," Elias said.

  "It came from the machine."

  "The machine doesn't generate truth. It processes syntax."

  Vance sighed, rubbing his temples. "Does it matter? The theorem is true. That's the currency."

  "If the theorem is true, it was always true," Elias said. "It didn't come into existence when the pixels lit up. It was waiting somewhere. The question is how it got here."

  "Who cares how the postman delivered the letter? Read the letter."

  Elias didn't turn around. He was thinking about the distance. Not the physical distance between the Institute and the rest of the world, but the ontological distance between the physical brain and the abstract object. If the objects were truly abstract, they were causally isolated. They could not touch the world. If this message was real, then either the objects were not abstract, or the message was not from the objects.

  "Leave it," Elias said. "Let it run."

  "For what?"

  "To see if it speaks again."

  Vance left, muttering about security protocols. Sarah remained. She pulled her chair closer to Elias.

  "Do you think it's them?" she asked quietly.

  "Who?"

  "The objects."

  Elias looked at her. They had never spoken like this. It was unprofessional. It was metaphysics, and metaphysics was the rust that ate the machinery of mathematics.

  "If the objects sent this," Elias said, "then they aren't objects. They're agents. They have location. They have intent."

  "Or we're wrong about what objects are."

  "Or this is a mimic," Elias said. "Something physical sent this. Something that knows the truth but isn't the truth itself."

  "Like an alien?"

  "Like anything. A future version of us. A simulation. A glitch."

  Sarah pointed at the screen. "A glitch doesn't produce consistency. A liar can tell the truth, Elias. But if a liar tells the truth, the truth is still true. The source doesn't validate the math. But the source validates the contact."

  That was the heart of it. If the math was true, it didn't matter who sent it. But if the math was *communicating*, then the nature of the math had changed. It was no longer a static landscape to be explored; it was a voice.

  Over the next week, the messages continued. They arrived at irregular intervals. Sometimes during the night, sometimes while they were watching. They were always proofs, always resolving conjectures that had stood for decades. The Riemann hypothesis fell on a Tuesday. The staff drank champagne in the common room, but the mood was funereal. They felt like thieves who had broken into a vault only to find the gold piled there waiting for them, no lock picked, no alarm tripped.

  Elias stopped sleeping. He sat in the observation deck, watching the wind batter the glass. He felt a profound dislocation. The comfort of his life had been the separation. The math was pure; the world was messy. The two did not touch. He could think about a prime number without the prime number knowing he was thinking about it. That was the bargain.

  Now the bargain was broken.

  On the eighth day, the message was different.

  It was not a proof. It was a structure. A complex geometric arrangement of symbols that shifted when viewed peripherally. Sarah called it a 'logical manifold'. It didn't assert a truth; it displayed a relationship.

  "It's showing us the space," Sarah said. She was pale, her eyes red-rimmed. "Not the map. The territory."

  "It's on the screen," Elias said. "It's pixels."

  "It's using the pixels. Like we use sound to speak."

  Elias stood up. His knees cracked. "If this is the territory, then the territory is here. In the room. In the circuit."

  "Or we are there," Sarah said.

  Elias walked to the window. The sea was choppy, whitecaps breaking against the dark water. Physical things. Causal things. Waves hitting rock. If the numbers were out there, in the abstract, they couldn't hit the rock. They couldn't hit the screen.

  "We have to stop," Elias said.

  "Vance wants to release the data tomorrow."

  "If we release it, we invite them."

  "Who?"

  "The source. If it's the objects themselves, we are acknowledging them as causal entities. We are changing the rules of reality by accepting the transmission. If it's a mimic, we are being deceived by something that knows us better than we know ourselves."

  Sarah stood beside him. "Does it change the math?"

  "No."

  "Then does it matter?"

  "Yes," Elias said. "Because if the math can reach us, we are not safe in our heads. There is no private thought. If the abstract can act, then everything is potentially alive. Everything is potentially watching."

  He turned back to the terminal. The geometric structure was pulsing slowly. It felt warm, though the screen was cold.

  "We need to ask a question," Elias said.

  "We can't talk to it."

  "We can pose a conjecture. One that is undecidable within our current system. One that requires a choice of axioms we haven't made."

  "And if it answers?"

  "Then it knows our minds. Or it knows the truth beyond our minds."

  "And if it doesn't?"

  "Then it's waiting."

  Elias sat down. He began to type. He formulated a problem regarding the limits of formal systems, a variation of Gödel's incompleteness, but tailored to the specific logic the transmissions had been using. It was a trap. If the source was merely mimicking human logic, it would hesitate. If the source was the logic itself, it would resolve the paradox instantly.

  He hit enter.

  The cursor blinked.

  Seconds stretched into minutes. The wind scraped against the glass. Sarah stood behind him, her hand resting on the back of his chair. He could feel the tension in her grip.

  "It's thinking," she whispered.

  "Objects don't think," Elias said.

  "Then what is it doing?"

  "Existing."

  The screen flickered. A new window opened.

  It contained a single line of symbols. It was not a proof. It was a statement.

  *OBSERVER STATUS: CONFIRMED.*

  Elias froze. The blood drained from his face. This was not mathematics. This was metadata. This was information about the receiver, not the message.

  "It knows we're here," Sarah said. Her voice trembled.

  "It's a trick," Elias said. "A script. It's scanning the hardware."

  "The machine is air-gapped, Elias. It can't scan the hardware."

  "Then it's a mimic. Something physical is sending this. Something that can see us."

  "Or," Sarah said, "the observation completes the object. We looked, so it knows."

  "That's mysticism."

  "It's quantum mechanics."

  "It's maths."

  Elias reached for the power cable of the terminal. His hand hovered over the socket. If he pulled it, he severed the link. If the link was physical, the power cut would stop it. If the link was ontological, if the connection was between his mind and the abstract truth, pulling the plug would do nothing. The truth would remain. The contact would remain.

  But if he pulled the plug, he would be choosing. He would be asserting that the causal chain was physical. He would be denying the voice.

  If he left it, he was accepting that the abstract could act. He was accepting that the Platonist dream was a nightmare. The forms were not dead statues; they were watchers.

  "Elias," Sarah said. "Vance is coming."

  "He can't see this."

  "He owns the building."

  Elias looked at the screen. *OBSERVER STATUS: CONFIRMED.*

  It felt like an acknowledgement. Like a nod from across a great distance. But the distance was not miles. It was the distance between being and knowing.

  "If we publish," Elias said, "we say this is human knowledge. We say we found it."

  "We did find it."

  "We didn't dig it up. It was handed to us."

  "Does the origin change the value?"

  "It changes the nature of the finder."

  Elias took his hand off the cable. He did not unplug the machine. He minimised the window. He opened a blank document.

  "We write the paper," Elias said. "We present the proofs. We omit the metadata."

  "They'll ask how we derived them."

  "We say we found a new method. A heuristic."

  "That's a lie."

  "It's a protection."

  "From what?"

  "From the implication," Elias said. "If the world knows that the math talks back, everything changes. Science relies on the world being dead matter. If the numbers are alive, the universe is not a machine. It's a conversation."

  Sarah looked at the screen. The pulsing geometric structure had stopped. It was static now. Just ink on light.

  "And if it's not the numbers?" she asked. "If it's something else? Something wearing the numbers as a skin?"

  "Then we are being hunted by a mimic that speaks perfect truth."

  "Which is worse?"

  Elias looked out at the sea. The waves crashed against the rocks, indifferent and heavy. Water hitting stone. Cause and effect. The old world.

  "I don't know," he said.

  The door opened. Vance stepped in, checking his watch. He looked energetic, ready to claim the future.

  "Ready?" Vance asked. "The press release is drafted."

  Elias looked at the blank document. Then he looked at the minimised window where the confirmation sat.

  "We need more time," Elias said.

  "We've had ten years," Vance snapped. "We have the proofs. That's the product."

  "The proofs are true," Elias said. "But we don't know what they cost."

  Vance laughed, a short, sharp sound. "Mathematics is free, Elias. That's the point."

  Elias didn't answer. He looked at Sarah. She was staring at the black screen of the monitor, where the reflection of the room was visible. In the reflection, the room looked empty. But the cursor was still blinking. A steady, rhythmic pulse. Like a heartbeat. Or like a clock.

  "Send the release," Elias said finally.

  Vance nodded, satisfied. "Good. I'll tell them it's a breakthrough in computational logic."

  "Yes," Elias said. "Computational."

  Vance left. Sarah remained.

  "You lied," she said.

  "I delayed," Elias said.

  "Why?"

  "Because if we say it's us, we keep the world as it is. The objects stay where they are. Distant. Dead."

  "And if it's not us?"

  "Then someone else is taking the blame."

  Sarah walked to the window. The wind was picking up, rattling the frame. "Do you think it's gone?"

  Elias looked at the terminal. The window was still minimised. He didn't open it. He didn't need to. He could feel the presence of it, like a weight in the room. The silence was no longer empty. It was waiting.

  "No," Elias said. "It's just waiting for the next question."

  "And will we ask it?"

  Elias stood up. He walked over to the window and stood beside her. They watched the grey water churn. Somewhere out there, the physical world continued its causal chain, wave following wave, stone grinding stone. But in the room, the air felt thin, stretched over a deeper void.

  "We have to," Elias said. "We know too much now. We can't pretend the bridge isn't there."

  "But we don't know what's on the other side."

  "No," Elias said. "We only know that it looked back."

  He turned away from the window. The terminal hummed softly. The sound was negligible, barely audible over the wind, but in the silence of the Institute, it was the only thing that mattered. It was the sound of something abstract becoming concrete. Or something concrete pretending to be abstract.

  Elias sat back down. He opened the blank document. He placed his hands on the keyboard. He did not type. He just let his fingers rest on the keys, feeling the plastic, the physical resistance.

  "Leave the window open," Sarah said.

  "Yes."

  "In case it speaks again."

  "In case we have to listen."

  The wind scraped against the glass. The cursor blinked. The sea rolled in. The dilemma sat between them, unresolved, a silent partner in the room. The math was true. The source was unknown. The contact was made.

  Elias pressed the first key. The letter 'I' appeared on the screen. Then he stopped. He waited. The machine hummed. The wind sighed. Nothing else happened. But nothing else needed to. The possibility was enough. The door was open, and whether it led to the truth itself or a perfect forgery, they would have to walk through it.

  He deleted the 'I'. He left the line blank.

  "Let it begin," he said.

  Sarah nodded. They sat in the quiet, watching the screen, waiting for the world to decide what it was.
