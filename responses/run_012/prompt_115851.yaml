  ### Empty and crowded branches

  The branch combining **Independent Existence (Yes)** with **Condition Change (Metaphysical)** is largely unoccupied. This view is arguably incoherent: if the condition exists independently of the label, the label cannot metaphysically constitute it. Some might argue for a "reactive natural kind," but this tends to collapse into Dynamic Nominalism. Conversely, the **Institutional Constructivism** leaf (No + Error + Systems + Refine) is coherent but neglected; most constructionists focus on self-conception or argue for replacement rather than refining institutional categories.

  The **Biological Realism** and **Harmful Dysfunction** leaves are crowded. Both answer "Yes" to independence, "Measurement Error" to instability, "Neither" to mechanism, and "Refine" to response. The tree cannot distinguish them because Wakefield's harmful dysfunction is a specific *type* of realism that this instrument treats as equivalent for clinical attitude. They occupy the same logical terminal node despite theoretical differences.

  ### Leaves this tree cannot separate

  *   **Biological Realism and Harmful Dysfunction:** Both treat categories as attempts to track independent facts and view instability as error. The tree lacks a node asking *what* makes the condition real (biology vs. evolutionary function).
  *   **Systematic Pragmatism and Clinical Pragmatism:** Both prioritize utility over truth and favor refining categories for use. The distinction between "system optimization" and "clinical utility" is too fine for this resolution.
  *   **Dynamic Nominalism and Therapeutic Constructivism:** Both accept the loop is constitutive and works through self-conception. They differ on whether to *track* the change (Hacking) or *steer* it (clinical), but both fall under "Condition Change + Self."

  ### Where this instrument is likely to misfire

  This tree assumes positions are stable and mutually exclusive, which is rarely true in practice. Many philosophers are realists about some disorders (e.g., dementia) and nominalists about others (e.g., DID), but the tree forces a global choice at Node 1. Furthermore, the distinction between "Measurement Error" and "Condition Change" is often an empirical gamble, not a philosophical premise; a resident might answer based on their current best guess rather than their ontological commitment. Finally, the tree flattens the temporal dimension: a position might start as Realism and shift to Pragmatism as evidence accumulates. Use this instrument to map *commitments*, not to diagnose *people*. If a resident feels stuck between branches, that is likely a feature of the debate, not a failure of their understanding.
