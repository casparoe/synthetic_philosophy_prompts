answer: |-
  ### The branch questions

  **Node 1: Ontological Independence**
  *Does the condition exist independently of our diagnostic labels and practices?*
  This question separates those who believe disorders are mind-independent natural kinds from those who believe they are constituted by our classificatory acts. It avoids jargon like "realism" by asking about existence prior to labeling.
  *Separates:* Natural Kind Realists and Harmful Dysfunction theorists (Yes) from Dynamic Nominalists and Strong Constructionists (No/Partially).

  **Node 2: Nature of Instability**
  *When the category shifts over time, is this an error in measurement, a change in the condition itself, or a sign the system is working as intended?*
  This captures the epistemic versus metaphysical distinction. If it is an error, the loop is a confound. If it is a change in the condition, the loop is constitutive. If it is working as intended, the instability is functional.
  *Separates:* Epistemic Realists (Error) from Dynamic Nominalists (Change) and Pragmatists (Working).

  **Node 3: Mechanism of Effect**
  *If the label affects the patient, does this happen through their self-conception, through external systems (insurance, guidelines), or not at all?*
  This isolates the mechanism of the loop. Some positions argue the loop requires conscious uptake (self-conception), while others argue institutional forces reshape patients regardless of understanding.
  *Separates:* Hacking-style Nominalists (Self) from Institutional Constructivists (Systems) and Biological Realists (Not at all).

  **Node 4: Prescriptive Response**
  *Given this, should we refine the category to stop the change, replace it with a different model, or track the movement as part of the phenomenon?*
  This determines the practical outcome. Do we fight the loop, evade it by changing models, or study it?
  *Separates:* Stabilizers (Refine) from Replacementists (Replace) and Loop-Trackers (Track).

  ### The tree

  *   **Q1: Independent Existence?**
      *   **Yes**
          *   **Q2: Nature of Instability?**
              *   **Measurement Error**
                  *   **Q3: Mechanism?**
                      *   **Neither**
                          *   **Q4: Response?**
