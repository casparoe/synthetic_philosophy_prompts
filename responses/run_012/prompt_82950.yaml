prompt: |-
  I chair the ethics panel at a mid-sized foundation. We make maybe eight genuinely hard grant decisions a year — grants between fifty grand and two million, real people on the recieving end — we get an hour per case, and the room is mixed: one philosopher, our lawyer, two program officers, a community rep, me. The recurring problem is that we don't agree on the moral framework and we've been improvising, case by case. I want a procedure we can actually run in that hour.

  Our house rules, and the procedure has to respect them. Each of us gives a coarse credence — high, medium, low, or "don't know" — to a short list of views we keep on the whiteboard: a welfarist one, a rights/autonomy one, a prioritarian one, a community-consent one, and a "this isn't ours to decide" one. "Don't know" is a real bucket, not a zero, and it can be the swing vote. Then, instead of just averaging, we want two screens: first something like a moral-parliament or expected-choiceworthiness step, then a second screen that asks what happens if we've got the credences wrong — including the nightmare case where the view we all ranked last turns out to be right. The second screen should be able to veto the first.

  Write it as a procedure: the questions in order, what counts as a sufficient answer to each, where it stops with a no, where it hands the decision back to a person because the step is values all the way down. Be blunt about which steps are arithmetic on incommensurables dressed up as method — I'd rather have the seams visible than a tidy flowchart that's lying to me. Don't give me a reading list or tell me who said what; I won't read it and I won't remember it.

  Then run it on two cases: (a) deworming in a high-prevalence region versus a cage-free campaign, and (b) a donor who wants us to fund something he cheerfully admits is harmful, "offset" by something good. I expect to hate the answer on at least one of those, and I'd rather find out now than in the room.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and case studies:

  1.  **Analyze the Request:**
      *   **Role:** Chair of an ethics panel at a mid-sized foundation.
      *   **Context:** 8 hard grant decisions/year, \$50k-\$2M, real human impact. 1 hour per case.
      *   **Panel:** 5 people (Philosopher, Lawyer, 2 Program Officers, Community Rep, Chair).
      *   **Current State:** Improvising, no agreed moral framework.
      *   **House Rules:**
          *   Coarse credence (High, Med, Low, Don't Know) assigned to 5 specific views (Welfarist, Rights/Autonomy, Prioritarian, Community-Consent, "Not Ours to Decide").
          *   "Don't Know" is a valid bucket, not zero.
          *   Two-screen process:
              1.  Moral Parliament/Expected Choiceworthiness (aggregating credences).
              2.  Robustness/Veto Screen (what if we're wrong? specifically the "nightmare case" where the lowest-ranked view is right).
          *   Second screen can veto the first.
      *   **Tone/Style:** Blunt, procedural, visible seams (admit where math is fake), no reading lists/theory dumping.
      *   **Deliverables:**
          1.  The Procedure (questions in order, stop conditions, hand-offs).
          2.  Run the procedure on Case A (Deworming vs. Cage-Free).
          3.  Run the procedure on Case B (Harmful Grant + Offset).

  2.  **Deconstruct the "Two-Screen" Requirement:**
      *   *Screen 1 (Aggregation):* Needs to translate "High/Med/Low/DK" into a decision without pretending to be precise utilitarian calculus. It needs to respect the "Moral Parliament" idea (weighted voting by credence).
      *   *Screen 2 (Robustness/Veto):* Needs to handle moral uncertainty and catastrophic risk. Specifically, the prompt asks to consider the case where the *least* credible view is actually the correct one. This is a "minimax regret" or "precautionary" approach.
      *   *Constraint:* 1 hour total. The procedure must be tight.

  3.  **Drafting the Procedure:**
      *   *Pre-work:* Credences must be assigned *before* the hour starts, or in the first 5 mins. Let's assume pre-work for efficiency, but allow 5 mins for calibration.
      *   *Step 1: The Aggregation (Screen 1).* How to combine H/M/L/DK?
          *   H = 3 pts, M = 2 pts, L = 1 pt, DK = 0 pts (but DK triggers a specific flag).
          *   Actually, DK shouldn't be 0. It means "I cannot judge this." If the Community Rep says DK on Welfarism, that view shouldn't count *for them*.
          *   Better approach: Count "Yes" votes weighted by credence.
          *   Let's keep it simple. For each view, does it support the grant?
          *   Calculate a "Support Score."
          *   *Crucial:* Admit the arbitrariness.
      *   *Step 2: The Veto (Screen 2).*
          *   Identify the "Nightmare View" (the one with the lowest total credence that *opposes* the grant).
          *   Ask: If this view is the *only* true one, is the harm unacceptable?
          *   If yes -> Veto.
      *   *Step 3: The Hand-off.*
          *   If Screen 1 says Go and Screen 2 says Go -> Fund.
          *   If Screen 1 says No -> Reject.
          *   If Screen 2 says No -> Reject (Veto).
          *   If "Not Ours to Decide" wins -> Return to Donor/Board.
      *   *Tone Check:* Needs to be blunt. "This is arithmetic on incommensurables."

  4.  **Refining the Procedure (Self-Correction during drafting):**
      *   *Time limit:* 60 mins.
      *   *0-10 mins:* Credence Check & Position Mapping. (Does View X support or oppose?)
      *   *10-30 mins:* Screen 1 (Weighted Support).
      *   *30-50 mins:* Screen 2 (The Veto/Regret Test).
      *   *50-60 mins:* Final Call & Documentation.
      *   *The "DK" issue:* If a member says DK on a view, they abstain from weighting that view.
      *   *The "Not Ours" view:* This is a jurisdictional claim, not a moral one. If this gets High credence, the procedure stops immediately.

  5.  **Developing Case A (Deworming vs. Cage-Free):**
      *   *Context:* Classic Effective Altruism tension. Human health (high certainty, high scale) vs. Animal welfare (moral status uncertain, high suffering).
      *   *Application:*
          *   Welfarist: Likely supports Deworming (human QALYs) or Cage-Free (animal suffering). Let's assume the choice is *between* them.
          *   Rights: Cage-Free might win (rights of sentient beings) or Deworming (rights of children).
          *   Prioritarian: Deworming (poorest humans).
          *   Community: Deworming (local consent?) vs Cage-Free (corporate policy?).
          *   *The Tension:* Usually, Welfarist/Prioritarian crushes Animal Rights in traditional funding. But if the panel has high credence in Animal Rights, the "Veto" might trigger if ignoring animal suffering is deemed catastrophic *if* that view is true.
      *   *Outcome:* Likely Deworming wins Screen 1, but Screen 2 forces a mitigation or acknowledgment of moral risk.

  6.  **Developing Case B (Harmful Grant + Offset):**
      *   *Context:* Donor wants to fund X (harmful) but also Y (good) to balance it. "Moral Licensing."
      *   *Application:*
          *   Welfarist: Net utility? Maybe okay if Y > X.
          *   Rights: Violation of rights in X cannot be offset by Y. (Deontology).
          *   Community: Did the harmed community consent?
          *   *The Veto:* The Rights view will likely scream "Veto." Even if Welfarism says "Go," if Rights is the "Nightmare View" (lowest credence but potentially true), the veto should trigger.
      *   *Outcome:* This is the one the user expects to hate. The procedure should likely kill this grant because the "Offset" logic fails the Rights/Veto screen.

  7.  **Polishing the Tone:**
      *   Avoid academic jargon where possible.
      *   Use bold headers.
      *   Explicitly state "This step is fake math."
      *   Ensure the "Don't Know" bucket is treated respectfully (it creates uncertainty, not nullity).

  8.  **Final Review against Constraints:**
      *   1 hour feasible? Yes, if strict.
      *   5 views respected? Yes.
      *   Two screens? Yes.
      *   Veto power? Yes.
      *   Blunt about incommensurability? Yes.
      *   No reading list? Yes.

  9.  **Drafting the Content:** (Mental walk-through of the text generation)
      *   *Intro:* Acknowledge the constraint.
      *   *The Protocol:* Break it down by minutes.
      *   *The Math:* Define the scoring clearly but label it "heuristic."
      *   *The Veto:* Define the "Nightmare Condition."
      *   *Case A:* Walk through the scores.
      *   *Case B:* Walk through the scores. Highlight the friction.

  10. **Refining the "Don't Know" logic:**
      *   If I say "Don't Know" on Prioritarianism, I can't weight it.
      *   Does "Don't Know" act as a risk multiplier? The prompt says "it can be the swing vote."
      *   *Adjustment:* If >50% of the room has "Don't Know" on a specific view, that view is treated as "Active Risk" in Screen 2.

  11. **Refining the "Not Ours to Decide" view:**
      *   If this gets a "High" from the majority, the process ends. No grant.

  12. **Final Polish:** Check the "bluntness." Make sure I admit that adding "High" + "Medium" is philosophically nonsense but operationally necessary.

  *(Self-Correction during final output generation)*: Wait, the prompt says "Don't Know... can be the swing vote." I need to make sure the procedure reflects that. If the room is split on the *facts* because of moral uncertainty, DK should pause the decision. I will add a "DK Threshold" in Screen 1. If too many DKs, the grant stalls.

  Let's write it.cw
answer: |-
  ## The Procedure: "Two-Screen Moral Triage"

  **Timebox:** 60 Minutes.
  **Materials:** Whiteboard with the five views listed. Sticky dots or markers for credences.
  **Pre-Work:** Panelists must submit their credences (High, Med, Low, DK) to the Chair 24 hours prior. The board is pre-populated.

  ### Phase 1: Calibration (Minutes 0–10)
  **Goal:** Ensure we are arguing about the same object.
  **Action:** Program Officers present the grant facts. No moral argument yet. Just: Who gets money? What happens? What stops happening if we say no?
  **Stop Condition:** If the "Not Ours to Decide" view has a **Majority High/Med** credence *before* discussion, the process ends. The grant is returned to the donor/board with a jurisdictional objection.
  **Blunt Truth:** If you think you lack the standing to decide, no amount of utilitarian calculus fixes that. Stop.

  ### Phase 2: Screen One — The Weighted Vote (Minutes 10–30)
  **Goal:** Aggregate the room's moral credences into a provisional direction.
  **Action:** For each of the five views, determine if the view **Supports**, **Opposes**, or is **Neutral** regarding *this specific grant*.
  **The Math (Admittedly Fake):**
  1.  Assign point values to credences: High = 3, Med = 2, Low = 1, DK = 0.
  2.  For each view, sum the points of panelists who say "Support."
  3.  Sum the points of panelists who say "Oppose."
  4.  **The DK Rule:** If >50% of the room marks "DK" on a specific view, that view is flagged as **Uncertain Ground**. It does not count toward the score, but it triggers a mandatory review in Screen Two.
  5.  **Result:** If Support Score > Oppose Score, the grant passes Screen One. If Oppose > Support, it fails.

  **Blunt Truth:** You are adding "High" to "Medium." This is arithmetic on incommensurables. It is a heuristic to break deadlocks, not a moral truth. It treats the Philosopher's "High" the same as the Lawyer's "High." This is intentional democracy, not epistemology.

  ### Phase 3: Screen Two — The Nightmare Veto (Minutes 30–50)
  **Goal:** Test for catastrophic moral error.
  **Action:** Ignore the scores from Screen One. Look only at the **Opposing Views**.
  1.  Identify the **Nightmare View**: The view with the *lowest* total credence score that **Opposes** the grant. (e.g., If "Rights" got mostly Lows but strongly opposes the grant, it is the Nightmare View).
  2.  **The Question:** "If this Nightmare View is the *only* true moral theory, and we fund this grant, is the resulting harm unacceptable/irreversible?"
  3.  **The Vote:** Simple Majority. Yes/No.
  4.  **Result:** If Majority says "Yes, the harm is unacceptable," the grant is **Vetoed**. Screen Two overrides Screen One.
  5.  **The DK Veto:** If >50% of the room had "DK" on a view that opposes the grant (from Phase 2), the grant is **Stalled**. You cannot proceed because you are ignorant of the risk.

  **Blunt Truth:** This is Minimax Regret. It admits that being "90% sure" (High Credence) doesn't matter if the 10% chance you're wrong involves violating fundamental rights. This is where the Lawyer usually kills the Philosopher's math.

  ### Phase 4: Decision & Documentation (Minutes 50–60)
  **Goal:** Lock the record.
  **Action:**
  *   **Fund:** Screen 1 Pass, Screen 2 No Veto.
  *   **Reject:** Screen 1 Fail OR Screen 2 Veto.
  *   **Stall:** High DK uncertainty.
  **Documentation:** You must record *which* view triggered the Veto or the Pass. Do not write "ethical concerns." Write "Vetoed via Rights View (Nightmare Case)."

  ***

  ## Case Run-Through A: Deworming vs. Cage-Free
  **The Choice:** You can fund one.
  *   **Option 1:** Deworming in a high-prevalence region (Human health, high certainty, low cost per QALY).
  *   **Option 2:** Cage-Free Campaign (Animal welfare, uncertain scale, high suffering reduction *if* successful).
  **Panel Credences (Pre-loaded):**
  *   Welfarist: High (3), High (3), Med (2), Low (1), DK (0). (Total: 9)
  *   Rights/Autonomy: Low (1), Low (1), Med (2), Low (1), DK (0). (Total: 5)
  *   Prioritarian: High (3), Med (2), Med (2), Low (1), Low (1). (Total: 9)
  *   Community: Med (2), Med (2), Low (1), DK (0), DK (0). (Total: 5)
  *   Not Ours: All Low.

  **Screen 1 (The Weighted Vote):**
  *   **Welfarist:** Supports Deworming (Human QALYs > Animal utility). Score: 9 for Deworming.
  *   **Prioritarian:** Supports Deworming (Poorest humans prioritized). Score: 9 for Deworming.
  *   **Rights:** Supports Cage-Free (Animals have right to bodily integrity; Deworming is paternalistic). Score: 5 for Cage-Free.
  *   **Community:** DK heavy. (Does the community want deworming? Does the public want cage-free?). Score: Neutral/Stalled.
  *   **Result:** Deworming wins Screen 1 decisively (18 pts vs 5 pts).

  **Screen 2 (The Nightmare Veto):**
  *   **Identify Nightmare:** The "Rights/Autonomy" view had the lowest score (5) and it Opposes Deworming (in favor of Cage-Free).
  *   **The Question:** "If the Rights view is the *only* true one, is funding Deworming instead of Cage-Free unacceptable?"
  *   **Discussion:** If animals have inviolable rights, ignoring their torture for human benefit is morally equivalent to ignoring human torture for animal benefit. It is a rights violation.
  *   **The Vote:** Philosopher says Yes. Community Rep says Yes (analogy to colonialism). Lawyer says No (legal personhood doesn't exist). Program Officers split.
  *   **Outcome:** 2 Yes, 3 No. **Veto Fails.**

  **Final Decision:** **Fund Deworming.**
  **The Ugly Seam:** You have officially decided that there is a >50% chance you are committing a rights violation against sentient beings, but the "weight" of the Welfarist view crushed it. The record must show: *"Deworming funded. Rights-based objection noted as Nightmare Case but failed veto threshold."*

  ***

  ## Case Run-Through B: The Harmful Offset
  **The Choice:** A donor gives $1M.
  *   **Part A:** $500k for a project the donor admits is "net harmful" (e.g., funding a controversial speech platform that incites violence, or a extractive industry pilot).
  *   **Part B:** $500k for a "good" offset (e.g., malaria nets) to balance the ledger.
  *   **Condition:** The money comes as a bundle. You cannot take Part B without Part A.
  **Panel Credences (Pre-loaded):**
  *   Welfarist: High (3), Med (2), Med (2), Low (1), Low (1). (Total: 9) -> *Supports (Net Positive)*.
  *   Rights/Autonomy: High (3), High (3), High (3), Med (2), Med (2). (Total: 13) -> *Opposes (Rights cannot be traded)*.
  *   Prioritarian: Med (2), Med (2), Low (1), Low (1), DK (0). (Total: 6) -> *Neutral/Supports (Helps the poor)*.
  *   Community: High (3), High (3), Med (2), Med (2), Low (1). (Total: 11) -> *Opposes (Harmful to local consent)*.
  *   Not Ours: Low across board.

  **Screen 1 (The Weighted Vote):**
  *   **Welfarist:** Supports (Net utility is positive). Score: 9.
  *   **Prioritarian:** Supports (Poor get nets). Score: 6.
  *   **Rights:** Opposes (Complicity in harm). Score: 13.
  *   **Community:** Opposes (Harm to community autonomy). Score: 11.
  *   **Result:** Oppose Score (24) > Support Score (15). **Screen 1 Fails.**
  *   *Note:* Even without Screen 2, the math kills it. But let's assume the Welfarists argue harder and sway a Med to High. Let's say Screen 1 passes narrowly for Fund.

  **Screen 2 (The Nightmare Veto):**
  *   **Identify Nightmare:** Actually, here the "Nightmare" is the view you *ranked lowest* that opposes you. In this scenario, Welfarism is the *only* view supporting the grant. All other views oppose.
  *   **Reframed Question:** "If the Welfarist view is *wrong* (which 4/5 views suggest), and the Rights/Community views are true, is the harm unacceptable?"
  *   **The Logic:** If Rights are real, you cannot offset a rights violation with a good deed. It is moral laundering.
  *   **The Vote:** Philosopher (Yes). Lawyer (Yes - liability/reputation). Community Rep (Yes - exploitation). Program Officers (No - we need the money).
  *   **Outcome:** 3 Yes, 2 No. **Veto Succeeds.**

  **Final Decision:** **Reject.**
  **The Ugly Seam:** The Welfarist calculation said "Net Good." The Veto said "You are not allowed to trade rights for goods."
  **Why you might hate this:** You effectively turned down $500k worth of malaria nets because you refused to get your hands dirty with the "harmful" half. You prioritized the foundation's moral purity over the lives the nets would have saved.
  **The Defense:** The procedure forces you to admit that if the Rights view is true, the nets are blood money. If you aren't sure which view is true (and you aren't, hence the panel), you cannot risk the blood money.

  ***

  ## Chair's Notes for the Room
  1.  **On "Don't Know":** If the Community Rep says "DK" on Welfarism, do not pressure them to pick. That DK is data. It means "I cannot translate my community's pain into your utility units." If you have too many DKs, you are flying blind. Stall the grant.
  2.  **On the Veto:** The Veto is not for "mild discomfort." It is for "If we are wrong about this, we are monsters." Use it sparingly, or you will fund nothing.
  3.  **On the Math:** When the Philosopher complains that you can't add "High" and "Medium," tell them: *"We know. Do you have a better algorithm that fits in 60 minutes?"*
  4.  **On the Donor:** In Case B, the procedure protects you from the donor. It gives you a structural reason to say no that isn't just "we don't like your values." It says "Our governance structure prohibits this trade-off."

  **Final Warning:** This procedure will not make you feel good. It will make you feel responsible. That is the point.
