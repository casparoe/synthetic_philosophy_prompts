      *   **Sarah (Antiquarian):** Argues for keeping the name but contextualizing it heavily. Wants a museum *on* the bridge. Wants every document displayed. She stops the conversation with details.
      *   **Marcus (Critical):** Argues for removal. Renaming. Judgment. The bridge is a stain. He wants to break the link.
      *   **The Conflict:** The cost. Removing the name costs money (rebranding, legal) and loyalty (older donors, historical society). Keeping it costs moral standing.
      *   **The Turning Point:** They need to decide. The debate gets heated.
      *   **The Resolution (The Fourth Mode):** They decide to remove the name, but not to erase him. They repurpose the materials? Or they rename it something functional? The prompt asks for a relation that "serves the city's present life."
      *   *Idea:* They remove the name, but use the bronze letters to fund something living. Or they rename it after the river itself. Let's go with renaming it after the geography (the river), acknowledging the land exists independent of the founder. And the cost is paid not by the budget, but by the committee members personally sacrificing their specific agendas.
      *   *Refining the Fourth Mode:* It needs to be visible without articulation. The act of taking the name down but melting the letters to make benches? No, too cliché. Renaming it "The River Crossing"? Too bland.
