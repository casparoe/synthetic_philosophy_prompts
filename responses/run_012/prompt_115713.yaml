  7.  **Refining the Word Count and Tone:**
      *   Needs to be academic-adjacent but literary. Philosophical undertones without jargon.
      *   Keep it tight. ~2,000 words.
      *   Ensure the "Fourth Mode" is clear in the imagery. The bridge is used, not worshipped, not museumified, not condemned. It is *lived*.

  8.  **Self-Correction during drafting:**
      *   *Check:* Did I name Nietzsche? No.
