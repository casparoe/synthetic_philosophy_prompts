      *   *The Fourth Character:* To embody the fourth mode, I think I need a fourth person who doesn't speak much but acts. Or the narrative focus shifts to the city itself. Let's introduce a fourth committee member, Julian, a civil engineer or budget officer. He cares about the bridge *working*.

  6.  **Writing - Step-by-Step:**

