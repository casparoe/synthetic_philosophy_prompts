answer: |-
  The rain against the conference room windows blurred the view of the river, turning the water into a sheet of hammered gray steel. On the table lay a scale model of the Vane Bridge, its steel arches gleaming under the fluorescent lights. The centennial was three months away, and the Centennial Committee was stalled on the plaque.

  Elias Thorne tapped the model's northern abutment. He was a developer, broad-shouldered and loud, the kind of man who saw history as a quarry. "We keep the name," he said, his voice bouncing off the cinderblock walls. "Silas Vane looked at this swamp and saw a city. That's the spirit we need now. The zoning board is fighting us on the waterfront redevelopment, and we need that same nerve. We tell the story of the Vane Grant as an act of vision. We don't apologize for building."

  He smoothed his tie, ignoring the folder marked *Land Disputes, 1924* sitting closed before him. Elias needed Vane to be a titan because Elias needed to be one too. He was already drafting the press release in his head, smoothing the rough edges of the founding. In his version, the indigenous families who had been moved out didn't flee; they were 'relocated to make way for progress.' The theft became a transaction; the violence became a bold stroke. He wanted the past to be a statue large enough to hide behind, a monument that justified his current fight for zoning permits. If Vane could take the land, Elias could zone it. The truth was secondary to the utility of the myth.

  Mrs. Gable cleared her throat. She was small, sharp, and surrounded by boxes. She was the city archivist, and she treated the past like a fragile bird that had stopped breathing. "We cannot simply say 'vision,'" she corrected, opening a ledger so old the paper crumbled at the touch. "We must display the ledger. And the fence posts. And the contradictory affidavits from the surveyors. If we keep the name, the bridge must become a museum. Every receipt for nails, every letter of complaint, every stain of ink must be catalogued and visible."

  She lifted a rusted spike from a box. "This was found in the mud during the dredging of '24. It must be placed in a case near the dedication plaque. We owe it to the truth to preserve everything exactly as it was. To change the context is to lie. To remove the context is to lose the root."

  Mrs. Gable wanted to embalm the city. She sought safety in the accumulation of details, believing that if she could just catalog every sin and every nail, the weight of them would hold the city in place. But her devotion was a hoard. She would fill the bridge with glass cases until no one could cross it without tripping over the evidence. The past, in her hands, was not a lesson or a crime, but a collection item, dead and dusted, serving nothing but its own preservation.

  "We cannot build a museum on a thoroughfare," said Kael. He was young, wearing a hoodie that seemed to absorb the room's light. He sat with his arms crossed, looking at the model not with pride or curiosity, but with disgust. "The bridge is a wound. Keeping the name is keeping the wound open. We don't need a museum, and we don't need a hero. We need a verdict."

  Kael leaned forward. "We take the name down. We issue a formal repudiation. We stand in judgment over Vane and we cut the line. This city cannot breathe while it is wearing the name of a thief. We rename it the Justice Span. We make it clear that the founding was a crime, and that we are not them."

  Kael wanted to execute the past. He believed that by condemning the founders, he could absolve the present. But his judgment was absolute. He offered no appeal, no nuance. In his desire to break the chain, he treated the city itself as guilty by association, demanding a purity that required amputating its own history. He wanted to stand on the shore and burn the bridge behind him, forgetting that the city stood on the other side.

  The room fell silent. The rain intensified, drumming against the glass. The decision rested on the budget line item: *Bridge Maintenance and Dedication.*

  "If we keep the name," Elias said, breaking the silence, "the Historical Society pledges half the cost of the centennial gala. But the waterfront zoning vote is next week. I need the symbolism."

  "If we museumify it," Mrs. Gable added, tracing the rim of her glasses, "the grant money covers the archival preservation. But the structural repairs will be delayed. The cases take up load-bearing space."

  "If we remove it," Kael said, "the activists will mobilize. But the donors will pull out. The cost of rebranding is high. The loyalty of the old families will break."

  The cost was not just money. It was the cohesion of the committee. Elias looked at Kael with open hostility; Mrs. Gable looked at both of them as if they were barbarians threatening a library. They were locked in their modes: Elias wanting to use the past as a weapon, Mrs. Gable wanting to keep it as a relic, Kael wanting to destroy it as a poison.

  Julian, the city engineer, had been silent until now. He sat at the end of the table, reviewing a structural report. He was not a historian, nor a politician, nor an activist. He cared about the load limits. He cared about the rust.

  "The bridge is eighty years past its design life," Julian said quietly. The others turned to him, surprised he had spoken. "The steel is fatigued. The dedication plaque is bolted into the main arch. To remove it requires scaffolding. To keep it requires polishing. To museumify it requires climate control."

  He slid the structural report across the table. "We don't have the budget for the gala, the museum, or the legal fight over the renaming ceremony. But we do have the emergency repair fund."

  Elias frowned. "What are you suggesting?"

  "The bronze letters," Julian said. "They weigh four hundred pounds. High-grade alloy."

  Mrs. Gable gasped. "You cannot melt them. They are primary sources."

  "They are metal," Julian said. "And the bridge is unsafe."

  Kael looked at the model. "If we remove them... is that enough? Is that judgment?"

  "It's not judgment," Julian said. "It's maintenance."

  The vote was not unanimous, but it was decisive. Elias conceded when he realized the zoning board cared more about infrastructure safety than historical branding. Mrs. Gable conceded when Julian promised to scan the letters in high resolution before removal, though she wept silently as the work order was signed. Kael conceded because the name would be gone, even if the reason was mundane rather than moral.

  The work began on a Tuesday. The scaffolding went up, obscuring the view of the river. The city watched as the workers unbolted the massive bronze letters of VANE. There was no ceremony. No press release from Elias about boldness. No display case from Mrs. Gable. No press conference from Kael about justice.

  The letters were not stored in an archive. They were not mounted on a pedestal. They were loaded onto a flatbed truck and taken to the scrapyard. The check from the scrapyard was written directly to the Department of Transportation. The money paid for the new rivets. It paid for the reinforcement of the southern arch. It paid for the safety of the commuters who would drive over it the next morning.

  When the scaffolding came down, the bridge stood bare. There was no new name painted on the arch. There was no plaque explaining why the old one was gone. There was just the steel, painted a fresh, neutral gray, spanning the water.

  On the opening morning, the rain had stopped. The sun broke through the clouds, reflecting off the river. People drove across the bridge. They were late for work, or taking kids to school, or delivering goods to the market. They did not look up at the arch where the name used to be. They did not think about Silas Vane. They did not think about the land grab. They did not think about the centennial.

  They simply crossed.

  The bridge was no longer a monument to a thief, nor a museum of a crime, nor a symbol of repentance. It was a thing used by the living. The past had been converted into the safety of the present. The metal that once spelled a name now held the weight of a truck carrying bread. The history was not denied, nor worshipped, nor executed. It was consumed, metabolized, and turned into the ground beneath their feet.

  Elias watched from the shore, his zoning fight still pending, realizing that the city moved on without his heroes. Mrs. Gable watched from her window, her archives full, realizing that preservation could not stop the rust. Kael watched from the sidewalk, his verdict delivered not by a gavel, but by a wrench, realizing that the city was not cleansed, but merely continuing.

  A bus crossed the span, heavy and loud. The steel hummed, a low vibration that traveled through the soles of their shoes. It was a sound of tension and integrity, of something holding fast not because of who built it, but because it was needed now. The river flowed beneath, indifferent to the name it had carried for a century, washing against the pilings, moving toward the sea. The committee members stood apart, separated by their disappointments, but the traffic flowed between them, uninterrupted, carrying the city forward into a day that belonged to no one but those living it.
