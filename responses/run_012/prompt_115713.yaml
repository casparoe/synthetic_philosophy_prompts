      *   *Let's focus on the ending action:* The decision is made. The bridge becomes simply "The Crossing." The money saved from not building the museum (Sarah's loss) funds the removal. Elias loses his branding opportunity. Marcus loses the spectacle of a trial. They all lose something to gain a functional present.
