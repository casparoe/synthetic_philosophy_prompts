      *   This is a cleaner position.
      *   Okay, ready to write.

      *   *Wait, one nuance on (v).* "Will not take a bet that could leave me ruined."
      *   Kelly betting *can* lead to ruin in finite time with bad luck, even if asymptotic growth is positive.
      *   So (ii) "Full Kelly" vs (v) "No Ruin" is also a tension.
      *   Full Kelly has a 1/3 chance of halving wealth before doubling, etc. It has a non-zero probability of arbitrary drawdown in finite time.
      *   If (v) means "Probability of ruin = 0", Full Kelly violates it.
      *   If (v) means "Probability of ruin < epsilon", Full Kelly might violate it depending on N.
      *   This adds weight to amending (ii).

