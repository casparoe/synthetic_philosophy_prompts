answer: |-
  This is not a moral disagreement, and it is not merely semantic. You are having a **conceptual disagreement about the function of blame.** Specifically, you disagree on whether blame is primarily a *verdict* (a statement of fact about what happened) or a *sentence* (an exercise of authority to demand redress).

  Your brother-in-law (BIL) operates on a **Juridical Model** of blame. You operate on a **Communicative Model**.

  Here is the diagnosis based on the claims you provided:

  **1. The Evidence for the Juridical Model (BIL)**
  BIL uses language like "forfeited the right," "standing," and "void." In his framework, calling someone out is analogous to a judge issuing a ruling. In a legal system, a judge who is currently committing crimes loses the authority to sentence others. The logic is hierarchical: moral authority flows from the virtuous to the vicious. If you are vicious, you have no currency to spend. When he says the friend's fury "doesn't count for anything," he means it lacks *illocutionary force*—it cannot successfully land as a moral sanction because the speaker has no status to deliver it. To him, blame without standing is noise.

  **2. The Evidence for the Communicative Model (You)**
  You use language like "allowed to be furious" and distinguish between feeling fury and "making demands." In your framework, blame is analogous to a witness testifying. A witness can be a criminal and still testify truthfully about a crime they saw. The truth of the testimony ("he cheated") is independent of the witness's virtue. You separate the *validity of the claim* (cheating is wrong) from the *licensure of the claimant* (the cheater). You believe blame functions to uphold shared norms, and norms are upheld by the community collectively, not just by the sinless.

  **The Diagnosis**
  You are stuck because BIL believes that **Standing is a precondition for Truth.** He thinks that if you lack the standing to punish, you lack the standing to identify the wrong. You believe **Standing is a qualifier for Enforcement.** You think you can identify the wrong (Truth) without having the clean hands required to demand punishment (Enforcement).

  This is why you talk past each other. When you say, "He's allowed to be furious," you are talking about the *Truth* component (the anger is a valid response to the wrong). When BIL says, "He forfeited the right," he is talking about the *Enforcement* component (the anger cannot be leveraged into a demand). Neither of you is wrong about your respective models, but you are applying different models to the same word ("call out").

  **What Counts as Progress**
  You will not settle this with a case study (e.g., "What if Hitler says murder is wrong?"). BIL will always say Hitler has no standing; you will say Hitler is right about murder. That loop is infinite.

  Progress requires forcing a **lexical split** on the phrase "calling someone out." You need to agree that there are two distinct speech acts happening simultaneously:

  1.  **Moral Assertion:** "What you did was wrong." (Hypocrisy is irrelevant here. A liar can tell the truth.)
  2.  **Moral Sanction:** "You owe me/the group an explanation or apology." (Hypocrisy is fatal here. You cannot demand accountability you refuse to accept.)

  **The Settlement Condition:**
  Ask BIL this: *"If the cheating friend says to the other cheater, 'What you did was wrong, and I hate you for it,' but explicitly adds, 'I know I have no right to demand you apologize to me,' does that statement count?"*

  *   If BIL says **Yes**, then he agrees with you that the *Assertion* survives even if the *Sanction* is dead. The fight is over; you just needed to separate the two.
  *   If BIL says **No**, then his position is not about logic or morality, but about **social purity.** He believes that moral discourse is a club where membership requires good behavior. If that is his position, you cannot settle it logically because it is an aesthetic preference for a certain kind of social order (one where only the pure speak).

  **Confidence and Uncertainty**
  **Confidence:** 85%. The linguistic markers ("right," "void," "standing" vs. "furious," "demands") strongly indicate a clash between a juridical and communicative framework. This is a well-documented split in philosophical literature on blame (e.g., the distinction between *proleptic* blame and *retrospective* blame).

  **Least Sure Element:** I am least sure about BIL's **motivation**. There is a high probability this isn't a principled philosophical stance for him, but rather **motivated reasoning to protect the mutual friend.** If he admits the hypocrite can "call out" the cheater, he validates the group's anger toward the friend he might be defending. If I am right about this, no distinction will settle it, because the goal isn't conceptual clarity; it's social defense. If you find him shifting the goalposts after you offer the Assertion/Sanction split, stop arguing. You aren't debating philosophy; you're managing loyalty.
