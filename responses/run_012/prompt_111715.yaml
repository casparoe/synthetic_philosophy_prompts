answer: |-
  There is no single, canonical term in the philosophical literature that captures this specific structure with the precision you request. However, the phenomenon is not unnamed; rather, it is recognized as a specific instantiation of a classical skeptical problem applied to contemporary social epistemology.

  The most rigorous philosophical anchor for this structure is **The Problem of the Criterion** (also known as the *Diallelus* or "the wheel"), originally formulated by the Pyrrhonian skeptics (e.g., Sextus Empiricus) and revived in modern epistemology by Roderick Chisholm.

  In its classical form, the Problem of the Criterion asks: To know which particular beliefs are true, we need a criterion of truth. But to know which criterion is correct, we need to know which beliefs are true. This creates a circle: we cannot establish the criterion without the particulars, nor the particulars without the criterion.

  Your observation identifies a socio-political variant of this problem. It is **The Problem of the Criterion applied to Epistemic Virtue**.
  *   **The Particular:** Is this specific opponent arguing in good faith?
  *   **The Criterion:** What counts as good faith? (e.g., "Deferring to consensus" vs. "Questioning institutional capture").
  *   **The Circle:** I cannot judge your good faith without applying my criterion; but you reject my criterion precisely because you view my insistence on it as evidence of *your* bad faith (or vice versa).

  While "The Problem of the Criterion" identifies the logical structure, it does not capture the interpersonal, accusatory nature of the dynamic you describe. In contemporary social epistemology, this is often discussed under the heading of **Deep Disagreement** (Robert Fogelin, Michael Lynch), specifically disagreements over **Epistemic Principles**. However, as you noted, "Deep Disagreement" is too broad; it covers disagreements about facts, values, and logic.

  To carve out the specific phenomenon you describe—the circular use of contested premises to adjudicate the *integrity* of the opponent—I propose the term **Reciprocal Epistemic Disqualification**.

  Below is the detailed carving of this concept, distinguishing it from its neighbors.

  ### 1. The Core Concept: Reciprocal Epistemic Disqualification
  **Definition:** A dialectical stalemate in which opposing parties employ mutually exclusive criteria to assess each other's epistemic virtue (e.g., honesty, rationality, good faith), such that the application of each party's criterion necessarily results in the disqualification of the other party's evidence or testimony.

  **The Mechanism:**
  1.  **Side A** posits Criterion X (e.g., "Trust institutional consensus") as the necessary condition for Good Faith.
  2.  **Side B** posits Criterion Y (e.g., "Scrutinize institutional incentives") as the necessary condition for Good Faith.
  3.  **Side A** observes Side B rejecting institutional consensus. By Criterion X, this is evidence of Bad Faith.
  4.  **Side B** observes Side A accepting institutional consensus. By Criterion Y, this is evidence of Bad Faith (naivety or complicity).
  5.  **Result:** Each side treats the other's failure to meet their specific criterion as proof that the other is not a trustworthy interlocutor, thereby dismissing the other's arguments *without* engaging the substantive empirical dispute. The criterion for trust is itself the object of distrust.

  ### 2. Boundaries and Distinctions (The Carving)
  To ensure this term does not collapse into existing concepts, we must mark its boundaries against five related phenomena.

  **A. Vs. Deep Disagreement**
  *   *Deep Disagreement* (Fogelin) refers to a lack of shared "hinge propositions" or framework principles that makes rational resolution impossible.
  *   *Reciprocal Epistemic Disqualification* is a specific *species* of deep disagreement. Not all deep disagreements involve accusations of bad faith. Two parties might agree on what constitutes honesty but disagree on the facts (e.g., "We are both honest, but you are mistaken about the data"). In your pattern, the disagreement is *about* the standard of honesty itself, weaponized to disqualify the opponent.

  **B. Vs. Echo Chambers (C. Thi Nguyen)**
  *   *Echo Chambers* are social structures that exclude outside voices and reinforce internal beliefs.
  *   *Distinction:* An echo chamber is a structural condition of information flow. Reciprocal Epistemic Disqualification is a *dialectical move* that can occur outside an echo chamber. Two well-informed agents, aware of each other's evidence, can still engage in this loop. The echo chamber explains *why* they have different criteria; Reciprocal Epistemic Disqualification describes the *interaction* that results when those criteria collide.

  **C. Vs. Self-Sealing Beliefs (Conspiracy Theories)**
  *   A *Self-Sealing Belief* is a proposition immunized against counter-evidence (e.g., "The lack of evidence is proof of the cover-up").
  *   *Distinction:* Self-sealing is a property of a *belief system* held by an individual or group. Reciprocal Epistemic Disqualification is a property of the *relationship* between two disputants. Crucially, in your pattern, Side A's position (e.g., "Trust experts") is not necessarily self-sealing in itself; it only becomes part of a circular loop when used as the *test* for Side B's integrity. Side A might be willing to change their mind on the policy, but they view Side B's refusal to accept the *method* of resolution as a moral failing.

  **D. Vs. Hypocrisy**
  *   *Hypocrisy* is the failure to practice what one preaches (e.g., "You say honesty matters, but you lie").
  *   *Distinction:* Hypocrisy requires a contradiction between stated principle and action. In Reciprocal Epistemic Disqualification, both sides are consistent. Side A consistently applies Criterion X; Side B consistently applies Criterion Y. Neither is necessarily violating their own standards; they are violating *each other's* standards. The charge is not "You are breaking your own rules," but "You are not following *the* rules" (where "the rules" are the contested premise).

  **E. Vs. Motive Attribution Asymmetry**
  *   This psychological bias describes the tendency to see one's own actions as principled and the opponent's as motivated by self-interest.
  *   *Distinction:* Motive Attribution Asymmetry is a cognitive bias internal to the agent. Reciprocal Epistemic Disqualification is the *epistemic structure* that rationalizes that bias. It provides the *argumentative form* ("If you were honest, you would agree") that turns a psychological bias into a philosophical impasse.

  ### 3. Why This Distinction Matters
  Identifying this as **Reciprocal Epistemic Disqualification** (or a **Criterion Problem for Epistemic Virtue**) shifts the focus of the dispute.

  If the problem were merely "bias" or "echo chambers," the solution would be better information or exposure to diverse sources. But if the problem is a circular criterion for good faith, more evidence will not help. Each side will interpret new evidence through their criterion for virtue, using it to further disqualify the other.

  Recognizing this structure suggests that resolution requires a **meta-epistemic negotiation**. The parties cannot argue about the policy (the empirical matter) or even the evidence (the scientific data) first. They must first argue about *what it would look like for the other to change their mind*. They must agree on a criterion for good faith that is external to both of their current positions—a "neutral" epistemic virtue—which is often impossible in highly polarized contexts.

  ### Summary
  *   **Established Ancestor:** The Problem of the Criterion (Sextus Empiricus/Chisholm).
  *   **Contemporary Context:** Deep Disagreement over Epistemic Principles (Fogelin/Lynch).
  *   **Proposed Term:** **Reciprocal Epistemic Disqualification**.
  *   **Definition:** A dispute structure where the standard for assessing an opponent's intellectual integrity is itself the contested premise, rendering the accusation of bad faith question-begging and the dispute rationally resolvable only by stepping outside the first-order disagreement.

  This carving preserves your insight: the problem is not that people are biased, nor that they disagree, but that the *test for honesty* has become the *object of the dispute*.
