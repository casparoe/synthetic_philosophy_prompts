answer: |-
  The cursor blinked on the screen, a steady rhythmic pulse against the white background of the Incident Report form. Elena stared at the text box labeled *Narrative of Deviation*. She had typed three sentences, deleted them, and typed them again.

  *Patient exhibited a high-valence arousal vector during sibling interaction, followed by a verbalization consistent with compliance policy.*

  The validation engine on the right side of the screen hummed green. *Syntax Valid.*

  *Subsequent state transition at 21:00 hours showed failure to ingest prescribed compound.*

  *Syntax Valid.*

  *Attributed cause: prediction error regarding internal salience weights.*

  The box turned red. *Warning: Teleological Attribution Detected.*

  Elena sighed, rubbing the bridge of her nose. The office was quiet, the kind of quiet that only exists in hospitals after visiting hours, where the hum of the HVAC system sounds like breathing. It was 8:00 PM. The report was due by midnight. If she didn't file it, Marcus's discharge review tomorrow would be stalled. If it was stalled, his sister would have to take another day off work. If she took another day off, Marcus would know, and his arousal vectors would spike again.

  She backspaced over *Attributed cause*. The system didn't like "cause" much either, unless it was biochemical. She tried: *Correlate: decay of compliance prior over four-hour interval.*

  Green. Valid.

  It was accurate, in a way. Marcus had said he would take the medication. He had not taken the medication. The probability of him taking it, estimated at 19:00, was high. At 21:00, the action tendency had not reached the threshold for execution. The model fit the data points.

  But Marcus hadn't just failed to execute an action tendency. He had looked his sister in the eye, in front of Elena and Julian, and said, "I promise."

  There was no field for *promise*. There was no variable for *word*. There was no function for *breaking*.

  The door to the case management office opened. Julian stepped in, holding two cups of vending machine coffee. He was younger than Elena, part of the cohort that had graduated after the Curriculum Update. He didn't look tired. He looked optimized.

  "Still on 44-B?" he asked, setting a cup on her desk.

  "Still on 44-B," Elena said. She wrapped her hands around the warm paper. "The validator keeps flagging me for teleology."

  "Because you're trying to describe a commitment," Julian said. He pulled up a chair, the wheels squeaking on the linoleum. "There is no commitment, El. There's only the state of the system at T1 and the state of the system at T2. The gap is noise, not betrayal."

  "His sister doesn't experience it as noise."

  "His sister is running legacy software," Julian said, not unkindly. "We know this. But the record isn't for her. The record is for the longitudinal model. If we encode 'betrayal,' we introduce a variable that implies agency independent of physiological state. We've known for three years that agency independent of physiological state doesn't exist."

  Elena looked at the screen. "You said 'doesn't exist' just now."

  Julian paused, cup halfway to his mouth. "In the ontological sense, yes."

  "But last week, in the staff meeting, you said the old terms were 'coarse-grained approximations' of the new ones. You said a promise is just a high-weighted policy prior."

  "Context matters," Julian said. "When talking to administration about the migration costs, we emphasize continuity. When talking about clinical accuracy, we emphasize elimination. Both are true depending on the resolution you're viewing."

  "That's not how resolution works," Elena said. "If I zoom in on a pixel and it's not there, it's not a coarse grain. It's gone."

  Julian leaned forward. "Look, the point is safety. The old vocabulary led to moralizing. We blamed patients for 'choices' that were actually dysregulations. We withheld care because someone was 'unwilling.' The new vocabulary forces us to look at the mechanics. It prevents us from punishing people for prediction errors."

  "And if the prediction error is avoidable?" Elena asked. "If the mechanics include a verbal contract made to reduce anxiety in a family member?"

  "Then the contract is a stimulus," Julian said. "It enters the salience weight. It failed to outweigh the avoidance tendency. That's all we can say. To say more is to lie."

  Elena turned back to the keyboard. She typed: *Verbal stimulus provided by sibling dyad failed to maintain action threshold.*

  Green.

  It felt like describing a car crash by listing the chemical composition of the paint. It was all true, and it missed the collision.

  "Have you seen the memo from Research?" Julian asked. "About the Phase 3 rollout?"

  "I haven't had time," Elena said. "I'm trying to document why a man couldn't keep a promise to his sister without calling it a promise."

  "You should read it. There's a section on self-reference. They're updating the justification protocols."

  Elena minimized the report and opened the internal portal. The memo was titled *Operational Clarifications: Vocabulary Standardization v4.2*. She scrolled down to the section Julian mentioned.

  *...implementation requires alignment of staff cognitive frameworks. We anticipate resistance due to habituated linguistic patterns. The Office believes that sustained training will resolve these friction points...*

  Elena stopped. She highlighted the sentence. "We anticipate." "The Office believes."

  "Look at the footnote," Julian said, pointing at the screen.

  There was a small asterisk next to *believes*. She clicked it.

  *Note: Terminology used in this document reflects transitional legacy constraints. 'Belief' here denotes 'high-confidence predictive model held by the administrative unit.'*

  "They had to flag it," Elena said. "They couldn't write the memo without using the words they banned."

  "It's a bootstrap problem," Julian said. "You can't use the new system to build the new system. You have to use the old tools to build the factory. Once the factory is running, you discard the tools."

  "And when do we discard the tools?"

  "We're in Phase 3. Six more months."

  Elena closed the memo. "Julian, look at me. When I walk out to the waiting room to talk to Sarah, what do I say?"

  "You use the plain language interface," Julian said. "That's the protocol. Science for the record, fiction for the humans."

  "It's not fiction. It's the only thing that makes sense to them."

  "And that's the lossy compression the Research Office talked about," Julian said. "It's fine for casual talk. Unacceptable in the scientific record."

  "The record *is* the talk," Elena said. "Tomorrow, the discharge summary goes to her GP. It goes to her. If I write 'action tendency failed threshold,' she reads 'he couldn't help it.' If I write 'he broke his promise,' she reads 'he chose to hurt me.' Those are different outcomes. Those are different treatments."

  "But only one is true," Julian said.

  "Is it?" Elena asked. "If I tell a computer I'm going to send a packet, and I don't send it, that's a transmission error. If I tell a human I'm going to meet them, and I don't, that's an insult. We are not packets. If the vocabulary removes the insult, does it remove the thing itself?"

  Julian stood up. He looked frustrated, not at her, but at the persistence of the problem. "You're treating the vocabulary as if it's descriptive. It's prescriptive. It's not trying to capture what happened. It's trying to shape what happens next. If we record 'broken promise,' we invite retribution. If we record 'prediction error,' we invite adjustment. We are building a hospital that adjusts, not punishes."

  "So we lie to the sister to protect the patient?"

  "We protect the patient from the sister's model of him," Julian said. "She thinks he's a moral agent who failed. He is a biological system that fluctuated. We know which one is real. Do you want to treat the real thing, or the ghost?"

  Elena didn't answer. She looked at the cursor blinking in the *Narrative of Deviation* box.

  *Verbal stimulus provided by sibling dyad failed to maintain action threshold.*

  It was clean. It was safe. It was useless.

  "Keep the registers separate," Julian said softly. "Write the report for the system. Talk to the sister for the human. Don't let them bleed into each other."

  He left the cup on the desk and walked out. The door clicked shut.

  Elena sat alone. She opened a new document. This wasn't the official report. This was a draft of what she intended to say to Sarah tomorrow.

  *Marcus wanted to take the meds. He meant what he said. But when the time came, he couldn't do it.*

  She stared at the words. *Wanted. Meant. Couldn't.*

  She tried to translate it into the system vocabulary to see if it held.

  *Marcus exhibited high valence regarding compliance. Verbalization indicated high probability of ingestion. Physiological state at T2 inhibited motor execution.*

  She read them side by side.

  *He meant what he said.*
  *Verbalization indicated high probability.*

  The first one carried weight. It carried the history of Marcus trying, failing, trying again. It carried the specific hurt Sarah felt because she trusted the *meanings*, not the probabilities.

  The second one carried nothing. It was a weather report. *Rain was probable. It did not rain.*

  Elena deleted the draft. She couldn't keep the registers separate. The report wasn't just stored in a database. It was printed. It was emailed. It was read aloud in family conferences. The "scientific record" was the thing the family took home to argue over at the dinner table. The "fiction" was the thing that determined his insurance coverage and his legal liability.

  If she wrote *prediction error*, she was absolving him. If she wrote *broken promise*, she was condemning him. The vocabulary wasn't just describing the event; it was deciding the verdict. And the system had decided that verdicts were unscientific.

  She looked at the validation engine. It was waiting. Green light. Ready to accept the truth that wasn't true.

  She thought about the memo. *We anticipate resistance.* The Office believed. The Office wanted. The Office intended. The people who designed the system lived in the old world while they built the new one. They used the old words to ban the old words. They relied on the very agency they were deleting from the record to enforce the deletion.

  If agency didn't exist, why was she being held responsible for filing the report? If prediction errors were just noise, why was Marcus being held in the ward?

  The escape hatch was collapsing. You couldn't have a human institution run on inhuman code. Somewhere, someone had to mean it.

  Elena placed her hands on the keyboard. She typed the required text.

  *Patient exhibited high-valence arousal vector during sibling interaction, followed by a verbalization consistent with compliance policy. Subsequent state transition at 21:00 hours showed failure to ingest prescribed compound. Correlate: decay of compliance prior over four-hour interval.*

  She hit *Submit*.

  The screen flashed *Accepted*. The record was sealed. The data was clean. The loss was complete.

  Elena stood up. She walked out of the office, down the corridor, and pushed open the door to the Family Waiting Room.

  Sarah was sitting in the plastic chair, staring at her phone. She looked up when Elena entered. Her eyes were red. She didn't need the report to know what had happened. She had been there. She had heard the promise. She had seen the empty pill cup.

  "Is it done?" Sarah asked.

  "The report is filed," Elena said.

  "What did you write?"

  Elena hesitated. The protocol said: *Share relevant clinical data in accessible language.* The protocol did not define *accessible*.

  "I wrote what the system requires," Elena said. "It says his compliance mechanisms failed."

  Sarah looked down at her hands. "He told me he promised. He looked at me."

  "I know."

  "Does the paper say he lied?"

  Elena looked at the woman. She thought about Julian's warning. *Don't let them bleed into each other.* She thought about the memo. *We believe.* She thought about Marcus, sitting in his room, knowing that his word had been converted into a probability distribution and found wanting.

  If she said "No," she validated the system. She told Sarah that her hurt was based on a misunderstanding of biology.
  If she said "Yes," she violated the record. She introduced a moral variable into a clinical dataset.

  Elena sat down in the chair next to Sarah. She didn't open her tablet. She didn't check the time.

  "The paper says what happened," Elena said. "It says he didn't take the meds."

  "It says why?"

  "It says the pressure to not take them was higher than the pressure to take them."

  Sarah laughed, a short, sharp sound. "Pressure. Is that what we're calling it?"

  "It's what the form has."

  Sarah looked at Elena. "Did he want to take them?"

  Elena felt the ban hovering in the air. *Want.* A folk entity. A phantom. A high-weighted valence vector.

  "Yes," Elena said.

  "Then why didn't he?"

  "Because wanting isn't enough."

  Sarah nodded slowly. She wiped her eyes with the heel of her hand. "I know. I just... I needed to hear someone say he broke it. Not that it broke. He broke it."

  Elena looked at her hands. They were empty. She had no authority to issue verdicts. The system had stripped her of the vocabulary of judgment. She was a technician now, not a witness.

  "I can't write that," Elena said. "The system won't let me."

  "I'm not asking you to write it," Sarah said. "I'm asking you to say it."

  Elena looked at the door leading back to the ward. Behind it, the servers hummed. The vocabulary was locked in. The migration was complete. The old words were deprecated, unsupported, legacy code. They existed only in the waiting room, in the dark, off the record.

  If she said it, she was admitting that the record was incomplete. She was admitting that the hospital was tracking the wrong variables. She was admitting that there was something real that the science couldn't see.

  If she didn't say it, she was protecting the system. She was keeping the data clean. She was ensuring that Marcus was treated as a fluctuating organism rather than a responsible agent. She was saving him from blame, and she was saving Sarah from the truth.

  Elena thought about the memo. *We anticipate resistance.*

  She looked at Sarah.

  "He broke it," Elena said.

  The words hung in the air. They had no field in the database. They had no validation check. They were unstructured data. They were lossy. They were heavy.

  Sarah let out a breath she seemed to have been holding for four hours. She nodded. "Okay. Thank you."

  "He still needs help," Elena said. "The report... it will get him the treatment. But what happened between you... that's not in the file."

  "I know," Sarah said. She stood up. "I'll deal with the file. You deal with the rest."

  "Tomorrow," Elena said. "We review the discharge."

  "Tomorrow," Sarah said.

  She walked out into the night. Elena watched her go. Then she turned back toward the ward. She had to log out. She had to shut down the terminal.

  As she walked down the hall, she passed the nursing station. Julian was there, finishing his shift. He looked up as she approached.

  "Report filed?" he asked.

  "Filed," Elena said.

  "Any issues?"

  "Validator flagged me twice. I got it through."

  "Good," Julian said. He turned back to his screen. "See you tomorrow."

  Elena stopped. She looked at the back of his head. She wanted to tell him what she had said to Sarah. She wanted to tell him that she had introduced a contaminant into the system. She wanted to tell him that the escape hatch was closed, and they were all inside the building now, breathing the air they had filtered.

  But there was no vocabulary for it. If she said it, he would hear it as stress. As fatigue. As a prediction error in her own compliance profile.

  "See you tomorrow," Elena said.

  She walked to her office. She turned off the light. The screen went black. The reflection in the monitor showed her face, tired and indistinct. She thought about the word *promise*. It wasn't in the dictionary anymore. It wasn't in the code. But it was still here, in the dark, waiting for the morning.

  She picked up her bag. She locked the door. She walked out into the corridor, careful not to make a sound, carrying the unrecorded weight of the thing she had said, knowing it would never appear in the log, knowing it was the only thing that mattered.
