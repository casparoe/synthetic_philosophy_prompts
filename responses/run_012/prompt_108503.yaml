      *   **Constraint 1:** Avoid questions that allow simple restatement of the thesis (need to push deeper).
      *   **Constraint 2:** Include specific topics:
          *   Permanent vs. irreversible loss of function in DCD (Donation after Circulatory Death).
          *   Why the interval before death declaration is fixed.
          *   Whole-brain vs. Brainstem criteria (biological state vs. legal status).
          *   Biological reality of ventilated "brain-dead" bodies (organ interaction over time).
          *   DDR survival in DCD where brains aren't assessed.
      *   **Constraint 3:** Each question needs a follow-up keyed to the likely reply.
      *   **Constraint 4:** End with the "falsification" question (what case/finding would make her give up the thesis).

  2.  **Deconstruct the Guest's Position:**
      *   This is a "conventionalist" or "social constructionist" view of death, often associated with scholars like Robert Veatch, Franklin Miller, or Robert Truog (though Truog is more nuanced).
      *   *Core tension:* If brain death isn't real biological death, then removing organs *is* killing the patient, violating the DDR. To fix this, either abandon the DDR or admit the convention.
