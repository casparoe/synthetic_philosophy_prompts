answer: |-
  ### The Case of the Morning Run and the Unsent Letter

  **Setting:** A quiet suburban neighborhood, two adjacent houses. Tuesday morning.

  **Agent A: Clara (The Flexible Hedonist)**
  Clara is a dedicated amateur runner. On Monday night ($T_1$), she lies in bed and plans her Tuesday. She values her long-term health and running identity highly. She calculates that waking up at 5:30 AM for a run is superior to sleeping in. She forms the intention to run.
  At 5:30 AM ($T_2$), the alarm sounds. The bed is warm; the air outside is cold. The immediate discomfort of rising looms large. Clara's preference flips. The immediate utility of warmth now outweighs the distant utility of fitness. She stays in bed.
  However, Clara does not feel guilt. She reflects: "Last night I was abstractly thinking about fitness. Now I am concretely feeling my body's need for rest. Listening to my body *now* is actually more important than sticking to a rigid plan made in ignorance of my current state." She acts on this judgment.

  **Agent B: David (The Paralyzed Idealist)**
  David is a graduate student working on a thesis chapter. On Monday ($T_1$), he plans to write from 9:00 AM to 11:00 AM on Tuesday. He values completing the chapter (Resolution) significantly more than browsing social media (Distraction). This valuation is based on a stable principle: "My degree matters more than momentary amusement."
  At 9:00 AM ($T_2$), David sits at his desk. He opens his laptop. He still values Resolution > Distraction. His valuation has not shifted; the chapter is no more "distant" in value than it was yesterday, and the distraction is no more "immediate" in worth. He maintains an exponential discounting structure: the ratio of value between Work and Play remains constant as the delay shrinks to zero.
  Yet, David feels a paralysis. He knows he should write. He wants to write (in the sense of endorsing the value). But his hand does not move. He minimizes the document and opens a browser. He thinks, "I am choosing the lesser good. I am failing my own standards." He acts against his judgment.

  ***

  ### Verdicts and Separating Feature

  **Agent A (Clara)**
  *   **Judgment:** "Staying in bed is the right choice given my current state."
  *   **Action:** Stays in bed.
  *   **Verdict:** **Not Weak-Willed.** (She acts in accordance with her reflective endorsement).
  *   **Preference Structure:** **Time-Inconsistent.** (Her ranking of Run vs. Rest reversed solely due to proximity).

  **Agent B (David)**
  *   **Judgment:** "Writing is the right choice; I value it more than browsing."
  *   **Action:** Browses.
  *   **Verdict:** **Weak-Willed.** (He acts against his reflective endorsement).
  *   **Preference Structure:** **Time-Consistent.** (His ranking of Write vs. Browse remained stable).

  **The Single Separating Feature:**
  **Reflective Endorsement (Second-Order Volition).**
  Weakness of will is determined by whether the agent's action aligns with their reflective judgment about what they *should* do. Time-inconsistency is determined by whether the agent's first-order preference ranking changes over time. The case shows these two axes cross: one can have shifting preferences without failing one's judgment (Clara), and stable preferences while failing one's judgment (David).

  ***

  ### Agent A's Preferences (Proof of Reversal)

  To demonstrate Clara's reversal fits the hyperbolic pattern:

  *   **At $T_1$ (Monday Night):**
      *   Option Run (Delayed 10 hours): Utility = 100 (Health/Identity) - 10 (Anticipated Effort) = **90**.
      *   Option Rest (Delayed 10 hours): Utility = 50 (Recovery) - 0 = **50**.
      *   **Preference:** Run > Rest.

  *   **At $T_2$ (5:30 AM):**
      *   Option Run (Immediate): Utility = 100 (Health/Identity) - 80 (Immediate Discomfort/Cold) = **20**.
      *   Option Rest (Immediate): Utility = 50 (Recovery) + 40 (Immediate Warmth/Comfort) = **90**.
      *   **Preference:** Rest > Run.

  *   **Analysis:** The preference order inverted ($Run > Rest \rightarrow Rest > Run$) as the delay to the reward/cost shrank to zero. This is the signature of hyperbolic discounting. However, because her *judgment* updated to match her T2 preference ("Rest is better *now*"), she is not akratic.

  ***

  ### Counterfactual: If Commitment Devices Were Allowed

  If we introduce the option of precommitment (e.g., a contract that fines you for missing a run, or software that blocks websites):

  *   **Clara (Time-Inconsistent, Not Weak-Willed):** She would **reject** the commitment device. Since she reflectively endorses her T2 choice to sleep, she does not view her T2 self as an enemy to be bound. She trusts her T2 judgment to be responsive to context. Binding her T1 plan would be, in her view, a mistake.
  *   **David (Time-Consistent, Weak-Willed):** He would **accept** the commitment device. Since his judgment remains constant (Write > Browse) but his will fails to execute, he recognizes a volitional defect. He wants to bind his future self to ensure his stable values are realized despite his executive failure.

  This divergence in demand for commitment further proves the concepts are distinct. Hyperbolic discounters only seek commitment if they *disapprove* of their future preference shift (which Clara does not). Weak-willed agents seek commitment whenever their will fails their judgment (which David's does).

  ***

  ### The Reductionist Objection and Survival of the Case

  **The Objection:**
  A proponent of the view that "weakness of will is simply steep temporal discounting" (the Reductionist) would attack Agent B (David). They would argue: "David claims he values Writing > Browsing, but he chose Browsing. Revealed preference theory dictates that his choice reveals his true preference. Therefore, at T2, David *must* have preferred Browsing. His claim of stability is false introspection. He is actually a time-inconsistent discounter like Clara, just in denial."

  **Does the Case Survive?**
  The case survives if we accept **first-person authority on normative judgment** as a valid data point, distinct from revealed preference.
  1.  **Phenomenology:** The experience of akrasia (David's guilt and sense of failure) is phenomenologically distinct from the experience of changing one's mind (Clara's relief and sense of appropriateness). To reduce David to a mere discounter is to erase the normative conflict that defines the human experience of "will."
  2.  **Explanatory Power:** If weakness of will were merely discounting, David would not seek commitment devices (as he would endorse his T2 choice). The fact that weak-willed agents *want* to bind themselves while flexible agents do not suggests the underlying mechanisms differ.
  3.  **Logical Independence:** The case demonstrates that the *logic* of the two concepts is distinct. One describes a trajectory of valuation over time (Consistency); the other describes a relationship between judgment and action (Alignment). Even if they often co-occur, the logical possibility of their separation is established by the coherence of the descriptions of Clara and David.

  **Conclusion on Independence:**
  The case shows **genuine independence**. Weakness of will is not a special case of time-inconsistent preference.
  *   Time-inconsistency is a property of the *preference function* (how value decays over delay).
  *   Weakness of will is a property of the *agency structure* (the link between evaluation and execution).
  Clara proves you can have the former without the latter. David proves you can have the latter without the former. Therefore, weakness of will is an independent phenomenon involving a failure of executive control or volitional alignment, not merely a mathematical curve of valuation.
