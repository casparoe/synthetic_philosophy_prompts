answer: |-
  **Project Title:** The Rotation Hypothesis: Disaggregating Selection and Tenure in Sortition-Based Design

  **Research Question**
  Is mandatory rotation a necessary condition for sortition to prevent the emergence of a professional political class, or does selection by lot alone suffice to disrupt elite consolidation?

  **Project Summary**
  Contemporary arguments for sortition (selection by lot) typically treat the mechanism as a unified package intended to disrupt the consolidation of political power. The standard justification is that random selection prevents the formation of a professional political class, ensuring descriptive representation and breaking the cycle of careerist entrenchment. However, current theoretical frameworks conflate two distinct institutional variables: *selection* (who enters the body) and *tenure* (how long they serve and how often they may return). This project hypothesizes that the anti-entrenchment function attributed to sortition is primarily driven by rotation, not lot-selection. If a randomly selected body permits repeated or extended service, self-selection bias among those choosing to return will recreate a professional class, rendering the initial lottery irrelevant. Over six months, I will develop a conceptual framework to isolate these variables, determining whether sortition without strict rotation inevitably converges toward oligarchy.

  **Background and Problem Statement**
  The revival of sortition in democratic theory rests on the claim that it breaks the monopoly of political elites. By randomizing entry, the argument goes, we prevent the accumulation of specific political capital that defines a professional class. However, this argument assumes that the "lot" governs the entire lifecycle of service. In reality, the lot governs only entry. Exit and re-entry are often governed by voluntary choice or distinct eligibility rules.

  Standard arguments establish that lot-selection disrupts *initial* access. They do not establish that lot-selection disrupts *accumulated* influence. If a citizen selected by lot may serve multiple terms, or if terms are sufficiently long to allow for the accumulation of specialized knowledge and networks, the body becomes vulnerable to a "lottery aristocracy." In this scenario, the subset of the population willing and able to serve repeatedly becomes a de facto professional class, distinguished not by winning elections but by winning the lottery and choosing to stay. The literature currently lacks a model that separates the anti-entrenchment effects of the draw from the anti-entrenchment effects of term limits. Without this distinction, institutional designers risk implementing sortition systems that look democratic in selection but function as oligarchies in tenure.

  **Methodology and Approach**
  This project will employ conceptual modeling and comparative institutional analysis rather than empirical fieldwork. The obvious alternative approach—comparing existing sortition bodies (e.g., Citizens' Assemblies, historical councils)—is methodologically insufficient for this question. Existing institutions almost universally bundle lot-selection with strict rotation, making it impossible to observe the independent variable of lot-selection in isolation. To determine the causal weight of rotation, one must analyze counterfactual institutional designs.

  I will construct three ideal-typical models of a legislative body:
  1.  **Pure Sortition:** Random selection, unlimited re-selection, unlimited tenure.
  2.  **Pure Rotation:** Deterministic selection (e.g., voluntary application), strict term limits, mandatory gaps in service.
  3.  **Hybrid (Standard):** Random selection, strict term limits.

  Using these models, I will trace the incentives for political professionalization. The analysis will focus on the "return decision." In a Pure Sortition model, the initial draw is random, but the decision to stand for re-draw is not. I will model the probability of the body converging toward a subset of "repeaters" over time *t*. The project will define the specific thresholds of tenure and re-eligibility under which the "professionalization" variable exceeds a defined tolerance level. This is a work of non-empirical political theory; it treats institutional rules as logical constraints on actor behavior to deduce systemic outcomes.

  **Deliverables and Finished Result**
  The primary output will be a monograph-length working paper (approx. 15,000 words) titled *The Independence of Rotation*. This paper will provide a formal argument establishing rotation as an independent variable in democratic design. It will offer a set of design principles for practitioners, specifying the minimum rotation requirements necessary to sustain the anti-entrenchment benefits of sortition.

  Additionally, I will produce a "Design Checklist" for institutional engineers. This tool will allow practitioners to audit proposed sortition bodies to determine if their rotation rules are sufficient to prevent the emergence of a professional class, given their specific selection rules.

  **Criteria for Success and Failure**
  Success is defined as producing a determinate answer to the research question. The project succeeds if it can logically demonstrate either:
  1.  That lot-selection without rotation necessarily converges toward professionalization (confirming the hypothesis); or
  2.  That lot-selection alone creates sufficient turnover to prevent professionalization even without rotation (falsifying the hypothesis).

  The project fails if the conceptual models prove too indeterminate to yield a conclusion. For example, if the analysis reveals that "professionalization" cannot be defined independently of cultural context without empirical data, the theoretical approach will have reached its limit. A secondary failure condition is scope creep: attempting to incorporate empirical case studies or behavioral data, which is impossible within a six-month, solo timeline. If I find that the theoretical separation cannot be made without empirical validation, the final report will explicitly recommend this as a direction for future empirical research rather than forcing a theoretical conclusion.

  **Timeline and Scope**
  The six-month timeline is divided into three phases. Months 1–2 are dedicated to refining the definitions of "professionalization" and "entrenchment" within a theoretical context, ensuring the metrics for the models are robust. Months 3–4 involve the construction and stress-testing of the three institutional models, specifically analyzing the "return decision" incentive structures. Months 5–6 are dedicated to writing the working paper and the Design Checklist.

  This scope is strictly limited to conceptual work. I will not collect data on existing assemblies, nor will I conduct interviews. The validity of the project rests on the logical coherence of the institutional models, not their empirical verification. This limitation is a feature, not a bug; it allows for a rigorous isolation of variables that empirical observation, confounded by historical contingency, cannot provide. The result will be a foundational theoretical clarification that precedes and guides future empirical testing.
