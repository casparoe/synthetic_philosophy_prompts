  I'm applying for a six-month, one-person grant in institutional design and need a two-page proposal; I'd like help turning a half-formed idea into one that is actually fundable. Sortition and rotation are usually discussed as a single package, but they answer different questions: selection by lot fixes who may serve, while rotation fixes how long and how often anyone serves. My hunch is that the familiar case for lottocracy — that it blocks the consolidation of a professional political class — is largely carried by rotation rather than by lot-selection, and that a randomly drawn body whose members may serve repeatedly and at length will drift back toward the entrenchment it was meant to cure, because the decision to keep serving is not random even when the initial draw is. Write the proposal: state the question so that it has a determinate answer; say what the standard arguments for sortition do and do not establish about repeat service; set out the approach I would take to separate the work done by lot-selection from the work done by rotation, and why that approach rather than the obvious one of comparing existing institutions; describe what a finished result would look like, what would count as the project failing, and a scope that is honest for six months of conceptual work with no fieldwork. No bibliography — I will supply the references myself.
