answer: |-
  # Population Ethics: Verdict Profile Quiz

  **Instructions:** Below are ten scenarios. For each, select the option that best matches your all-things-considered moral verdict. Do not answer based on what theory you *think* you hold; answer based on what you actually think is right or wrong in the case. There are no trick questions, but some trade-offs are intentional.

  ---

  ### 1. The Prenatal Medication
  A woman takes a necessary medication during early pregnancy. She is warned that this will cause her child to be born with permanent hearing loss, but the child's life will still be worth living. The child is born, has a happy life, and later says, "I am glad I was born, even with the hearing loss."
  *   **A.** The mother did something wrong, and the **child was harmed/wronged**.
  *   **B.** The mother did something wrong, but **no specific person was harmed** (the outcome was suboptimal).
  *   **C.** The mother did **nothing wrong**.

  ### 2. The Miserable Child
  A couple knows that due to genetic factors, any child they conceive will have a life of chronic pain and severe limitation, though the life will still be *net* positive (barely worth living). The only alternative is not conceiving at all. They conceive.
  *   **A.** They did something wrong, and the **child was harmed/wronged**.
  *   **B.** They did something wrong, but **no specific person was harmed**.
  *   **C.** They did **nothing wrong**.

  ### 3. The Energy Policy (Non-Identity)
  A government chooses a cheap energy policy. This causes climate changes that, in two centuries, result in a population with a lower quality of life than would have existed under a safer policy. However, the policy change also alters the course of history such that the *specific people* living in two centuries would not have existed under the safer policy. They have lives worth living.
  *   **A.** The government did wrong, and **future people were harmed/wronged**.
  *   **B.** The government did wrong, but **no specific person was harmed**.
  *   **C.** The government did **nothing wrong**.

  ### 4. The Single Embryo
  A couple uses IVF. Only one embryo is viable for implantation. It carries a gene for a mild physical impairment. The alternative is having no child. They implant the embryo. The resulting child is glad to be alive.
  *   **A.** The couple did something wrong, and the **child was harmed/wronged**.
  *   **B.** The couple did something wrong, but **no specific person was harmed**.
  *   **C.** The couple did **nothing wrong**.

  ### 5. The Saviour Sibling
  A couple conceives a child specifically so that the child's umbilical cord blood can be used to treat a sick older sibling. The new child is loved and has a good life, but was instrumentalized in conception.
  *   **A.** This is wrong, and the **new child was harmed/wronged**.
  *   **B.** This is wrong, due to **violating a duty/impersonal principle**, but the child was not harmed.
  *   **C.** This is **permissible** (provided the child is well-treated).

  ### 6. The Repugnant Conclusion
  You must choose between creating World A (1 billion people with excellent, flourishing lives) or World B (100 billion people with lives that are barely worth living, but still positive). You cannot create both.
  *   **A.** We are required to create **World A** (Fewer, Excellent).
  *   **B.** We are required to create **World B** (More, Mediocre).
  *   **C.** It is **permissible to choose either**.

  ### 7. The Intangible Loss
  A policy is chosen. The people who exist under this policy have good lives and are glad to exist. Had a different policy been chosen, *different* people would have existed, and their lives would have been *better*. Nobody in the actual world is worse off than they would have been otherwise (since they wouldn't have existed otherwise), yet the total value of the future is lower.
  *   **A.** This is wrong, because **specific people were made worse off**.
  *   **B.** This is wrong, because the **outcome is worse**, even if no one is worse off.
  *   **C.** This is **not wrong**.

  ### 8. The Happy Child (Asymmetry Test)
  A couple can easily conceive a child who would have a wonderful, happy life. They choose not to conceive. No one ever exists who is deprived of this life.
  *   **A.** They did something **wrong** (failed a duty to create).
  *   **B.** They did **nothing wrong**, but there was a *reason* to create (it would have been good).
  *   **C.** They did **nothing wrong**, and there was *no reason* to create (neutral).

  ### 9. The Same-Person Trade-off
  A couple can conceive a child *now*, who will have a moderate disability, or wait three months and conceive the *same child* (same genetic identity), who will be healthy. They conceive now.
  *   **A.** They did something wrong, and the **child was harmed/wronged**.
  *   **B.** They did something wrong, but **no specific person was harmed**.
  *   **C.** They did **nothing wrong**.

  ### 10. The Critical Level
  A child is conceived whose life will be pleasant and free of pain, but devoid of deep achievement, relationships, or meaning (a "life of contented mediocrity"). This life is above the "zero" line but below what we consider a "fully good" human life.
  *   **A.** Creating this child is **wrong** (harms the child).
  *   **B.** Creating this child is **wrong** (suboptimal outcome), but does not harm the child.
  *   **C.** Creating this child is **permissible**.

  ---

  ## Scoring Key & Interpretation

  *Note: This quiz maps **verdict profiles**, not metaphysical justifications. Different theories may arrive at the same answers for different reasons.*

  ### Profile 1: The Classic Totalist (Utilitarian)
  *   **Pattern:** Mostly **B** on Non-Identity cases (1, 3, 4, 7); **B** on Repugnant Conclusion (6); **B** or **A** on Happy Child (8); **A** or **B** on Same-Person (9).
  *   **View:** **Totalism.** The right act maximizes the total sum of well-being. Identity doesn't matter; only the total good counts.
  *   **Note:** If you chose **A** on Non-Identity cases (claiming specific people were harmed), you may be a **Wide Person-Affecting** theorist who believes possible people can be compared to alternative possible people. Totalists and Wide PA often yield identical verdicts here.

  ### Profile 2: The Narrow Person-Affecting Restriction
  *   **Pattern:** **C** on Non-Identity cases where life is worth living (1, 3, 4, 7); **A** on Same-Person cases (9); **C** on Happy Child (8).
  *   **View:** **Narrow Person-Affecting View.** An act can only be wrong if it makes some *particular* person worse off than they would otherwise have been. Existence cannot be a harm/benefit comparison against non-existence.
  *   **Note:** If you chose **A** on Case 1 or 4 (claiming the child was harmed despite being glad to exist), you may hold a **Non-Comparative Account of Harm** (being in a bad state harms you, regardless of alternatives).

  ### Profile 3: The Asymmetry / Negative Utilitarian
  *   **Pattern:** **A** or **B** on Miserable Child (2); **C** on Happy Child (8); **C** on Non-Identity (3, 4) *if* life is worth living.
  *   **View:** **The Asymmetry.** There is a duty not to create miserable lives, but no duty to create happy lives. Coming into existence is not a benefit to the one created.
  *   **Note:** If you chose **A** on Case 2 (Miserable Child) but **C** on Case 8 (Happy Child), this is the signature asymmetry pattern.

  ### Profile 4: The Average View
  *   **Pattern:** **A** on Repugnant Conclusion (6) (Prefer Fewer/Excellent); **B** on Non-Identity cases (3, 7).
  *   **View:** **Average Utilitarianism.** We should maximize average well-being, not total.
  *   **Note:** This view is often unstable (implies we should kill unhappy people to raise the average), but the verdict profile is distinct on Case 6.

  ### Profile 5: The Critical-Level View
  *   **Pattern:** **B** on Non-Identity (3, 7); **A** on Critical Level (10) (Mediocre life is wrong/suboptimal); **A** on Repugnant Conclusion (6).
  *   **View:** **Critical-Level Totalism.** Lives only count positively if they exceed a certain threshold of "goodness," not just "worth living."
  *   **Note:** Distinguishes from Classic Totalism primarily on Case 6 and Case 10.

  ### Profile 6: The Existence Neutral / Antinatalist Leanings
  *   **Pattern:** **C** on almost all procreation cases (1, 2, 4, 8, 10); **B** on Policy cases (3, 7) only if it affects existing people.
  *   **View:** **Existence is Neutral.** Coming into existence cannot be a harm or a benefit. Moral obligations only apply to existing people.
  *   **Note:** Hard to distinguish from Narrow Person-Affecting on verdicts, but differs on the *reason* (NPA says "no one worse off"; Neutral says "existence is not a commodity").

  ---

  ## Technical Notes for the Discussion Leader

  ### 1. Indistinguishable Leaves (The "Same Verdict, Different Theory" Problem)
  This quiz cannot separate the following pairs based on verdicts alone:
  *   **Totalism vs. Wide (Conditional) Person-Affecting:** Both typically judge Non-Identity cases (3, 7) as **Wrong**. Totalists say "Total value is lower." Wide PA says "Possible people were worse off than alternative possible people." You will need to ask *why* they chose B or A to separate them.
  *   **Narrow Person-Affecting vs. Existence Neutral:** Both typically judge Non-Identity cases (1, 3, 4) as **Not Wrong** (C). NPA says "Child not worse off." Neutral says "Child not harmed by existence."
  *   **Non-Comparative Harm vs. Narrow PA (with caveats):** On Case 1 (Prenatal Meds), a Non-Comparative theorist says **A** (Wrong/Harmed) because deafness is a bad state. A Narrow PA theorist says **C** (Not Wrong) because the child isn't worse off than in the alternative. *However*, some Narrow PA theorists accept a "comparative baseline" of a healthy version of the *same* child if identity is preserved. This is why Case 9 (Same-Person) is crucial.

  ### 2. Incoherent or Unexplored Combinations
  Flag these patterns for discussion as they suggest confusion or untenable positions:
  *   **The "Magic Harm" Pattern:** Choosing **A** (Wrong/Harmed) on Case 7 (Intangible Loss).
      *   *Why:* The case stipulates nobody is worse off. Claiming someone was harmed is logically inconsistent with the stem unless the participant rejects the case description.
  *   **The "Inconsistent Baseline" Pattern:** Choosing **C** (Not Wrong) on Case 9 (Same-Person Trade-off) but **A** or **B** on Case 1 (Prenatal Meds).
      *   *Why:* Case 9 is a standard harm case (same identity, worse quality). Case 1 is a Non-Identity case. If you think harming an existing child is permissible (Case 9), but causing a child to be disabled is wrong (Case 1), you hold a view where *causing existence* creates stricter duties than *maintaining existence*. This is rare and requires defense.
  *   **The "Repugnant Totalist" Pattern:** Choosing **B** (More/Mediocre) on Case 6, but **C** (Not Wrong) on Case 3 (Energy Policy).
      *   *Why:* If you accept that total quantity of happiness trumps quality (Case 6), you should logically accept that a larger population with lower quality is better in Case 3, unless identity changes block the comparison. This suggests a tension between their Totalism and their Person-Affecting intuitions.

  ### 3. Intra-Label Disagreement Points
  Use these questions to fracture the room even among people who claim the same label:
  *   **Among Consequentialists:** Case 6 (Repugnant Conclusion). Many totalists modify their view (Critical Level) to avoid this result. This splits "Classic Totalists" from "Critical-Level Theorists."
  *   **Among Person-Affecting Theorists:** Case 1 vs. Case 9. Some "Person-Affecting" folks believe Case 1 is wrong because the child is worse off than a *possible healthy version of themselves* (a contested comparative baseline). Others say Case 1 is permissible. This splits "Narrow PA" from "Wide/Conditional PA."
  *   **Among Asymmetry Holders:** Case 2 (Miserable Child). Some asymmetry views say creating a miserable life is *wrong*. Others (Antinatalists) might say creating *any* life is wrong. Case 2 tests the "negative duty" strength.

  ### 4. A Note on Case 7
  Case 7 is designed to trap people who use the phrase "impersonal harm" loosely. If a participant chooses **A** (Someone was harmed), ask them *who*. If they cannot name a person who is worse off than they would otherwise have been, they are implicitly accepting an impersonal view (Option B) but using person-affecting language. This is the most common source of confusion in reading groups.
