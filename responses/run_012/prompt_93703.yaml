  You mentioned you initially thought the test was "size of consequences." Two of his verdicts force you to abandon this and adopt the criteria above:

  1.  **The Penicillin Verdict forces the Contingency Criterion.**
      *   You cannot have a valid test based solely on impact. Penicillin had massive impact, but the adviser explicitly validates it because it "might very easily not have happened." This forces **Probability/Contingency** into your definition of a hinge.
