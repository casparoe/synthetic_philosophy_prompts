      *   You cannot have a valid test based solely on disruption. Rome had massive disruption, but the adviser rejects it because ordinary life "resumed." This forces **Irreversibility/Structural Depth** into your definition.

  **Summary for your presentation:** Do not argue about the *size* of the future. Argue about the *fragility* of the present and the *depth* of the change to ordinary life. If you can show that our current path is both fragile (could easily go otherwise) and structural (changes how we eat, work, or know), you will satisfy the adviser's hidden test.
