prompt: |-
  I am the designated sceptic on the investment committee of a mid-sized pension fund. Before we commit to a large contrarian position — one that takes the other side of a liquid, widely followed market — I am expected to present the case against our doing so. We take roughly half a dozen such decisions a year. Each is large enough that being wrong would be visible to our members, and I have at most a working day to prepare: I cannot commission research, and I am not a sector specialist. The committee may overrule me and the chief investment officer signs off either way, but the minute records whether I was satisfied, so the procedure needs to yield a defensible verdict rather than a mood.

  Please turn the no-trade results in the economics of information into a decision procedure I can actually run. The intuition to operationalise is this: in a world of common priors, rational agents, an initially efficient allocation and no aggregate uncertainty, speculative trade does not occur, because the mere willingness of someone to take the other side is itself informative and the trade unravels. When we propose a contrarian position, we are therefore implicitly claiming that one of those assumptions fails. A usable procedure must force us to say which one fails, and must treat our inability to name one as a reason to stop. A companion point belongs in the procedure too: if prices already reflected all costly information, no one would bear the cost of gathering it — so any edge we claim must be compensation for a real cost or risk we are carrying, and we should be able to name that cost or risk.

  The procedure should include:

  - the questions in order, and what counts as a sufficient answer to each;
  - the list of non-informational reasons a counterparty might trade that the framework allows — forced or mechanical flows, hedging, tax, mandate and index constraints, agency and career incentives, plain noise — together with a test for distinguishing a genuine instance from a story we have told ourselves;
  - a rule for the reverse direction: when our own motive for trading is non-informational, so that our conviction carries no evidential weight;
  - a rule for the second-order case: what we may and may not infer when a market fails to move on news we regard as important, and how to tell whether a price is functioning as a forecast or merely as a record of who was compelled to sell;
  - the points where the procedure stops with a no, and the points where it must hand the decision to a person, because the question concerns our tolerance for a particular kind of risk rather than the facts;
  - an honest note on which steps are judgement wearing the costume of procedure.

  Then run it on three proposals:

  1. Shorting a large, heavily held company on the thesis that the market is underestimating the probability of a regulatory crackdown.
  2. Buying into a sharp fall in a widely held share, on the thesis that the fall was driven by a leveraged fund being forced to liquidate rather than by any news about the company.
  3. Taking our largest position of the year on the strength of a private conversation with someone who works in the industry, on which we believe we know something the market does not.

  At least one of these should receive a verdict I will not like, and you should say plainly which and why. Do not supply reading lists, citations or names of papers: write from what you know, and where a result is standard, state it in your own words. Answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Designated sceptic on a pension fund investment committee.
      *   **Task:** Create a decision procedure based on the "no-trade theorems" (economics of information) to evaluate contrarian positions.
      *   **Constraints:**
          *   Mid-sized pension fund (fiduciary duty, visible risks).
          *   ~6 decisions/year, large size.
          *   Prep time: 1 working day (no new research, not a specialist).
          *   Output: Defensible verdict (minute-recordable), not just a mood.
          *   Language: British English.
          *   No citations/reading lists (write from knowledge).
      *   **Core Intuition:** No-trade theorems (Milgrom-Stokey, etc.) imply trade shouldn't happen among rational agents with common priors unless assumptions fail (private info, heterogeneous priors, non-informational motives, risk sharing). We must identify *which* assumption fails. Also, Grossman-Stiglitz paradox: if prices reflect all info, no one gathers info; so any edge must compensate for a cost/risk.
      *   **Required Components:**
          *   Ordered questions + sufficient answers.
          *   List of non-informational counterparty motives + test for genuineness.
          *   Rule for when *our* motive is non-informational.
          *   Rule for second-order inference (market not moving on news).
          *   Stop points (No) vs. Hand-off points (Risk tolerance).
          *   Honest note on judgement vs. procedure.
          *   Run the procedure on three specific proposals.
          *   At least one verdict must be unpopular/uncomfortable.

  2.  **Deconstruct the Economics of Information (No-Trade Theorems):**
      *   *Milgrom-Stokey (1982):* With common priors and rational expectations, no speculative trade occurs. If someone wants to trade with you, they know something you don't.
      *   *Grossman-Stiglitz (1980):* Prices cannot be fully informationally efficient, or no one would incur costs to become informed. There must be a reward for bearing the cost of information or risk.
      *   *Key Assumptions to Challenge:*
          1.  Common Priors (Do we see the world differently?)
          2.  Rationality (Is the market irrational?)
          3.  Liquidity/Non-Info Motives (Is the other side forced to trade?)
          4.  Risk Sharing (Are we providing insurance?)
          5.  Cost of Information (Are we being paid for our work?)

  3.  **Drafting the Procedure (The "Sceptic's Protocol"):**
      *   *Structure:* Needs to be a checklist or flowchart style, but written as text.
      *   *Tone:* Formal, rigorous, fiduciary-focused.
      *   *Section 1: The Source of Alpha (Why does trade happen?)*
          *   Q1: Who is on the other side?
          *   Q2: Why are they trading? (Must be non-info or we must have superior info).
          *   Q3: What is our edge? (Info, analysis, or risk bearing?)
      *   *Section 2: Non-Informational Motives (The Liquidity Provider Test)*
          *   List: Forced liquidation, rebalancing, hedging, tax, mandates, agency issues.
          *   Test: Verifiable evidence (filings, market structure data), not just narrative.
      *   *Section 3: Our Own Motives*
          *   If we are trading for liability matching or cash flow, info content is zero.
      *   *Section 4: Price Action & News*
          *   If news breaks and price doesn't move, is the news priced in or is the market illiquid?
      *   *Section 5: Stop/Go & Hand-off*
          *   Hard stops (cannot identify counterparty motive).
          *   Hand-offs (risk tolerance, sizing).
      *   *Section 6: The "Costume" Note*
          *   Acknowledge where human judgement creeps in.

  4.  **Developing the Three Case Studies:**
      *   *Case 1: Shorting a large co on regulatory risk.*
          *   *Analysis:* Who is buying? If the market is "underestimating," who holds the view that it's fine? Likely long-only funds, indexers. Are they wrong or just constrained? Regulatory risk is hard to time.
          *   *Verdict:* Likely a "No" or "High Risk". The counterparty is the market consensus. Do we have private info? No. Is it a risk premium? Maybe. But "underestimating probability" implies we know better than the aggregate. This triggers the no-trade theorem hard.
      *   *Case 2: Buying a fall driven by forced liquidation.*
          *   *Analysis:* This fits the "non-informational motive" criteria perfectly. Leveraged fund blowing up is a classic liquidity shock.
          *   *Verdict:* Likely a "Pass/Go" (procedurally), provided we verify the liquidation. This is the "easy" yes for a contrarian.
      *   *Case 3: Large position on private conversation.*
          *   *Analysis:* Insider trading risks aside (which are legal/compliance, not just economic), does this violate the "costly information" principle? If the info is that valuable, why did the source share it? Also, reliance on a single source is concentration risk.
          *   *Verdict:* This needs to be the "unpopular" one. The CIO probably loves "proprietary channels." But procedurally, it fails the "common knowledge" and "verifiable edge" test. It relies on heterogeneous priors without justification. Also, compliance red flags. I will make this the "No" that hurts.

  5.  **Refining the Procedure (Iterative Polish):**
      *   *Check:* Did I include the Grossman-Stiglitz point? Yes, need to ensure we identify the *cost* we are bearing (research time, liquidity risk, volatility).
      *   *Check:* British English (e.g., "programme," "centre," "whilst," "£").
      *   *Check:* No citations.
      *   *Check:* Defensible verdict.
      *   *Check:* The "Unpopular Verdict." Case 3 is the best candidate. CIOs love "scuttlebutt." Stopping it based on epistemic humility is the sceptic's job.

  6.  **Writing the Response (incorporating the constraints):**
      *   *Introduction:* Set the stage, acknowledge the theoretical basis (no-trade theorems) without naming them academically.
      *   *The Protocol:* Break it down into the requested sections.
      *   *The Application:* Run the three cases.
      *   *The Unpopular Verdict:* Explicitly highlight Case 3.

      *(Self-Correction during drafting)*: Make sure I don't get too bogged down in the math. Keep it operational. The prompt asks for a "decision procedure I can actually run." It needs to feel like a form or a script.
      *Refining the "Non-Informational Motives" test:* It can't just be "we think they are forced." It needs to be "can we see the forcing?" e.g., margin calls, index rebalance dates.
      *Refining the "Cost" argument:* If we claim an edge, what did it cost us? If it was a free tip, it's worthless. If it was 500 hours of analysis, it has value.

  7.  **Final Review against constraints:**
      *   British English? Yes.
      *   No citations? Yes.
      *   All procedure points covered? Yes.
      *   Three cases run? Yes.
      *   Unpopular verdict included? Yes (Case 3).
      *   Tone appropriate? Yes (formal, fiduciary).

  8.  **Final Polish:** Ensure the distinction between "Stop" (procedural failure) and "Hand-off" (risk preference) is clear. Ensure the "Costume" note is honest.

  *(Drafting the response...)*
  *   *Intro:* Acknowledge the Milgrom-Stokey/Grossman-Stiglitz intuition without the jargon.
  *   *Procedure:* Numbered steps.
  *   *Cases:* Apply rigorously.
  *   *Conclusion:* The specific unpopular verdict.

  Let's write it.cw
answer: |-
  **To:** The Investment Committee
  **From:** The Designated Sceptic
  **Subject:** The Counterparty Protocol: A Decision Procedure for Contrarian Positions

  ### Introduction

  When we propose a contrarian trade, we are asserting that the market price is wrong. The economics of information teaches us that in a market of rational agents with similar starting views, trade should not occur simply on the basis of differing opinions. If someone is willing to take the other side of our bet, they likely know something we do not, or they are forced to trade for reasons unrelated to value.

  This procedure operationalises that insight. It is not a model for pricing assets; it is a test for the validity of the trade itself. It forces the Committee to identify *why* the trade exists. If we cannot name the flaw in the market's reasoning or the compulsion driving our counterparty, we must assume the market is right and we are the liquidity.

  This document sets out the Protocol, followed by its application to three current proposals.

  ---

  ### Part I: The Counterparty Protocol

  #### Section 1: The Source of the Edge (The "Why Trade?" Test)
  *Objective: To identify which assumption of market efficiency is being violated.*

  **Question 1.1: Who is on the other side of this trade?**
  *   **Requirement:** We must identify the likely class of seller (if we buy) or buyer (if we sell). "The market" is not an answer.
  *   **Sufficient Answer:** "We are buying from [Class of Investor], who hold [X%] of the float."
  *   **Failure Condition:** If the proponent cannot identify the likely counterparty class, the procedure stops. **Verdict: No Trade.**

  **Question 1.2: Why are they trading?**
  *   **Requirement:** We must categorise their motive as either *Informational* (they know something) or *Non-Informational* (they are forced/constrained).
  *   **Sufficient Answer:** A specific mechanism (e.g., "margin call," "index rebalance," "regulatory capital requirement").
  *   **Failure Condition:** If the motive is assumed to be "they are wrong," we must proceed to Question 1.3.

  **Question 1.3: If they are wrong, what information do we possess that they do not, and what did it cost us to get it?**
  *   **Requirement:** Per the Grossman-Stiglitz paradox, if prices reflect all available information, no one would bear the cost of gathering it. We must identify the cost we have borne that justifies our edge.
  *   **Sufficient Answer:** "We have incurred [Cost in time/capital/access] to derive a view that differs from the consensus."
  *   **Failure Condition:** If the information was costless (e.g., a casual conversation, public news interpreted differently without extra work), the edge is illusory. **Verdict: No Trade.**

  #### Section 2: The Non-Informational Motives List & Verification
  *Objective: To validate claims that the counterparty is forced to trade.*

  **Allowed Non-Informational Motives:**
  1.  **Forced/Mechanical Flows:** Index rebalancing, ETF creation/redemption, pension de-risking glides.
  2.  **Leverage Constraints:** Margin calls, fund liquidations, stop-loss triggers.
  3.  **Hedging:** Delta hedging by option writers, correlation targeting.
  4.  **Tax/Accounting:** Year-end loss harvesting, window dressing.
  5.  **Mandate Constraints:** Breach of concentration limits, sector caps, ESG exclusions.
  6.  **Agency/Career:** Herding to avoid underperformance tracking error, dumping assets to hide losses.
  7.  **Noise:** Random liquidity needs, retail sentiment extremes.

  **The Verification Test:**
  *   **Rule:** A claim of non-informational motive requires *structural evidence*, not *narrative plausibility*.
  *   **Pass:** We can point to a filing, a known fund blow-up, a calendar event (rebalance date), or market microstructure data (bid-ask spread widening, volume spikes without news).
  *   **Fail:** "It looks like a panic," or "Valuations are too high, they must sell."
  *   **Outcome:** If the motive is listed above but fails the Verification Test, treat the counterparty as *Informed*. Revert to Section 1.3.

  #### Section 3: The Reverse Direction (Our Own Motives)
  *Objective: To prevent us from trading on noise while claiming conviction.*

  **Rule:** If our primary motive for the trade is Non-Informational (e.g., liability matching, cash flow management, strategic asset allocation rebalancing), the trade carries zero informational weight.
  *   **Implication:** We cannot use this trade to express a "view" on the asset's alpha. We must execute at minimal market impact and accept the prevailing price as fair. We cannot claim an edge against the counterparty.

  #### Section 4: Second-Order Inference (Price Action & News)
  *Objective: To interpret market silence or movement.*

  **Scenario A: Significant news breaks, price does not move.**
  *   **Inference:** The market either anticipated the news (it is priced in) or the market is illiquid/functioning poorly.
  *   **Test:** Check derivatives markets and credit spreads. If they also did not move, the news is not material. If they moved but equity did not, equity is illiquid.
  *   **Rule:** Do not trade against a silent market unless you have proof of illiquidity masking a move.

  **Scenario B: Price moves violently without news.**
  *   **Inference:** This suggests a Non-Informational Motive (Section 2).
  *   **Rule:** This is the highest probability setup for a contrarian trade, *provided* Section 2 Verification is met.

  #### Section 5: Stop Points and Hand-Offs
  *Objective: To distinguish between procedural failures and risk choices.*

  **Hard Stops (The Sceptic vetoes):**
  1.  Failure to identify the counterparty class (Section 1.1).
  2.  Failure to identify a cost borne for information (Section 1.3).
  3.  Claim of non-informational counterparty motive without structural evidence (Section 2).
  4.  Reliance on information that cannot be legally used or verified (Compliance/Insider risk).

  **Hand-Offs (The CIO/Committee decides):**
  1.  **Sizing:** If the edge is valid, how much capital do we deploy? This is a risk tolerance question, not a factual one.
  2.  **Horizon:** How long do we wait for the thesis to play out? This is a liability-matching question.
  3.  **Risk Premium:** If we are providing liquidity (taking the other side of a forced seller), what return do we demand for bearing that liquidity risk? This is a pricing question.

  #### Part II: A Note on Judgement and Costume
  This procedure is not a machine. It wears the costume of objectivity to discipline our intuition.
  *   **Where it is real:** The requirement for structural evidence in Section 2 is binary. Either the fund is in liquidation or it is not.
  *   **Where it is judgement:** Assessing the "cost" of information in Section 1.3 is subjective. One analyst's "deep dive" is another's "surface reading." The Committee must agree on what constitutes sufficient work.
  *   **The Danger:** The procedure can be gamed by writing a narrative that fits the boxes. The Sceptic's role is to ensure the evidence fills the boxes, not the story.

  ---

  ### Part III: Application to Current Proposals

  #### Proposal 1: Shorting a Large, Heavily Held Company
  *Thesis:* The market is underestimating the probability of a regulatory crackdown.
  *Size:* 2% of Fund.

  **Procedure Run:**
  1.  **Counterparty (1.1):** Who is buying? The holder base is predominantly Long-Only Institutional and Index Funds.
  2.  **Motive (1.2):** Why are they holding/buying? They are not forced buyers. They are holding based on current earnings and lack of regulatory action.
  3.  **Edge (1.3):** Do we have superior information? The proponent cites public regulatory comments and legal analysis.
      *   *Cost Test:* Did we commission legal counsel or conduct proprietary lobbying analysis? No. We interpreted public data differently.
      *   *Result:* **Fail.** Under the Protocol, interpreting public data differently without additional cost does not constitute an edge against rational agents holding the same data.
  4.  **Non-Info Motive (Section 2):** Is there a forced buyer? No. The stock is liquid and stable.
  5.  **Verdict:** **NO TRADE.**

  **Reasoning:** We are taking the other side of rational holders who see the same public regulatory risk we do. They have priced it at probability *P*. We believe it is *P + delta*. Without private information or a structural reason why they *must* hold despite the risk (e.g., index inclusion), the No-Trade Theorem applies. Their willingness to hold at this price suggests our *delta* is not justified. We are betting on our opinion against the aggregate wisdom without a demonstrable cost advantage.

  #### Proposal 2: Buying a Sharp Fall in a Widely Held Share
  *Thesis:* The fall was driven by a leveraged fund being forced to liquidate, not company news.
  *Size:* 1.5% of Fund.

  **Procedure Run:**
  1.  **Counterparty (1.1):** Who is selling? Market intelligence and broker colour indicate a specific multi-strategy hedge fund is de-levering.
  2.  **Motive (1.2):** Why are they selling? Margin call / Risk limit breach. This is a **Forced/Mechanical Flow** (Section 2, Item 2).
  3.  **Verification Test:** Can we verify the liquidation?
      *   *Evidence:* Yes. Unusual block trades across unconnected names held by this fund. Prime broker reports indicate margin pressure in that sector. The company issued no negative news.
      *   *Result:* **Pass.** Structural evidence exists.
  4.  **Edge (1.3):** What is our cost? We are bearing **Liquidity Risk**. We are providing capital when others cannot.
  5.  **Verdict:** **HAND-OFF TO CIO.**

  **Reasoning:** The Protocol is satisfied. The counterparty motive is non-informational and verified. We are not claiming to know more about the company's value; we are claiming to have a stronger balance sheet than the seller. This is a valid liquidity provision trade. The Committee must now decide the required return for bearing the risk that the liquidation continues longer than expected (Hand-Off: Risk Premium).

  #### Proposal 3: Largest Position of the Year on Private Conversation
  *Thesis:* A private conversation with an industry insider reveals a supply chain shift the market does not know.
  *Size:* 5% of Fund.

  **Procedure Run:**
  1.  **Counterparty (1.1):** Who is selling? The general market.
  2.  **Motive (1.2):** Why are they selling? They are unaware of the information.
  3.  **Edge (1.3):** Do we have superior information? Yes, via the conversation.
      *   *Cost Test:* What was the cost? A lunch and a phone call.
      *   *Compliance Check:* Is this material non-public information (MNPI)?
      *   *Result:* **Fail.**
  4.  **Verification:** Can we verify the information without trading? No, that would negate the edge.
  5.  **Verdict:** **NO TRADE.**

  **Reasoning:** This proposal fails on two counts. First, the **Cost Test**: Information acquired at near-zero cost cannot reliably beat a market where participants spend millions on research. If the insight were robust, the source would have monetised it differently or kept it confidential. Second, and more critically, this borders on **Insider Trading**. Even if legal counsel deems it "cleansed," the economic principle holds: if the information is truly valuable and private, relying on it concentrates risk on a single, unverifiable node. If the source is wrong, or if the market already suspects this (and we cannot know), we have no hedge. The Protocol treats unverifiable, low-cost private information as noise, not alpha.

  ---

  ### Part IV: The Unpopular Verdict

  I must state plainly that **Proposal 3** will receive the strongest objection from this office, and it is the verdict the Chief Investment Officer is least likely to like.

  **Why:**
  The CIO views "proprietary channels" and "industry access" as a core competitive advantage of our fund. To reject a 5% position based on a "private conversation" feels like bureaucratic timidity to a portfolio manager. They will argue that this is exactly how alpha is generated: by knowing something others do not.

  **The Sceptic's Rebuttal:**
  The economics of information dictates that if the information is valuable, it is expensive. If it was given freely in a conversation, it is either not valuable, or it is dangerous. Furthermore, the No-Trade Theorem warns us that if we trade on this, the counterparty (the market) is taking the other side. If the market is rational, and we are trading on a whisper, the market likely knows something we don't—perhaps that the whisper is already priced, or that the source is unreliable.

  By rejecting Proposal 3, I am not saying the information is false. I am saying that **we cannot build a fiduciary process around unverifiable whispers.** If we are wrong, I cannot defend the decision in the minutes by saying "we trusted a contact." I can only defend it by saying "we verified a structural dislocation" (Proposal 2) or "we were paid a premium for bearing a known risk."

  Proposal 1 is a standard disagreement on probability (risky, but defensible).
  Proposal 2 is a liquidity trade (robust).
  Proposal 3 is a gamble on a single node of information. It violates the requirement to name the cost of the edge. The cost was a lunch. The risk is the fund's reputation and capital. The asymmetry is wrong.

  **Recommendation:**
  *   **Proposal 1:** Reject. (No edge, rational counterparty).
  *   **Proposal 2:** Approve in principle. (Valid liquidity provision).
  *   **Proposal 3:** Reject. (Unverifiable, low-cost information, high compliance and epistemic risk).

  I am satisfied that Proposal 2 meets the criteria. I am not satisfied that Proposals 1 or 3 do.
