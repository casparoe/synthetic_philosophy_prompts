answer: |-
  Right, let's cut through the noise. You want to know what David Hume would make of Dan's "sim discount" versus the Longtermist's "astronomical value" calculation. You want a verdict, not a survey.

  Here is the thing you need to grasp first: Hume was not a sceptic in the sense that he thought we could know nothing. He was a sceptic about *reason's* ability to operate without *experience*. He believed that when our reasoning drifts too far from what we can actually see, touch, and measure, it becomes nothing more than imagination dressing itself up as logic.

  With that in mind, here is how Hume would dismantle this argument, step by step.

  ### 1. The Simulation Hypothesis is a "Hypothesis" (and Hume hated those)
  To Hume, the claim "we might be living in a simulation" looks suspiciously like a religious argument. It posits an invisible, powerful creator (the simulator) whose nature and intentions are entirely beyond our observation.

  In his *Enquiry Concerning Human Understanding*, Hume lays down a rule: a wise man proportions his belief to the evidence. For Hume, evidence comes from constant conjunction—seeing event A follow event B repeatedly. We know fire burns because we have seen it burn. We do not know about "simulators" because we have never observed a universe being simulated, nor have we observed a simulator switching one off.

  Hume would argue that assigning a "serious chance" to this proposition is intellectually dishonest. It is not a probability you can plug into a spreadsheet. It is a metaphysical fantasy. To treat it as a variable in an expected-value calculation is to treat fiction as data. So, right out of the gate, Hume would reject Dan's premise. You cannot discount a value based on a probability that has zero empirical foundation.

  ### 2. Longtermism is "False Precision"
  Now, look at your Longtermist colleague. He is building a moral system on expected-value sums involving numbers of people who do not exist yet, in centuries we cannot foresee.

  Hume's famous problem of **induction** is crucial here. We believe the sun will rise tomorrow because it has always risen before. But there is no logical guarantee it *must*. We act on custom and habit, not on mathematical certainty.

  The Longtermist is taking this fragile habit of expecting the future to resemble the past and stretching it across millennia, attaching precise probabilities to it. Hume would view this as a classic error of the understanding: trying to use reason to measure things that are, by nature, immeasurable. To claim you can calculate the "expected value" of the year 3000 is, to Hume, sophistry. It looks like maths, but it's actually just passion (in this case, a passion for saving the future) hiding behind numbers.

  ### 3. The "Sim Discount" is Fighting Fire with Fire
  Dan's move is clever: he uses one uncertainty (sims) to cancel out another uncertainty (the far future). He thinks this scepticism saves us from fanaticism.

  Hume would say Dan is accidentally stumbling onto the truth, but for the wrong reasons. Dan is effectively saying, "We can't be sure of anything, so let's calm down." Hume agrees we should calm down, but he wouldn't use the Simulation Argument to do it.

  Why? Because Dan is still playing the Longtermist's game. He is still accepting that *if* we could just get the probabilities right, the calculation would work. He is just adding a new variable to the equation. Hume would say the equation itself is void. You do not need the Simulation Argument to realise the Longtermist calculus is flawed. The limits of human knowledge are sufficient to dismantle it. Bringing in simulations just adds more metaphysical clutter to a problem that should be solved by looking at human nature.

  ### 4. Fanaticism is Unnatural
  Finally, Hume has a specific beef with "fanaticism." In his *History of England* and his essays on religion, he distinguishes between "superstition" (fear-based) and "fanaticism" (confidence-based). He views fanaticism as dangerous because it convinces people that their abstract ideas are more real than the people suffering in front of them.

  The Longtermist willingness to "sacrifice almost anything" for a tiny probability bump in the far future is exactly the sort of behaviour Hume warned against. It privileges an abstract idea (the future multitude) over the concrete sentiments of the present (your mates, your community, your own happiness).

  Hume believes morality is rooted in **sentiment**—what we actually feel sympathy for. We feel sympathy for a child crying down the street. We do not feel sympathy for a statistical abstraction of a billion unborn souls. To act as if you do is to violate your own human nature.

  ### The Verdict

  So, to answer your question plainly: **Hume would think the whole style of argument was bogus.**

  He would not agree that the Simulation Argument successfully dampens Longtermism, because he would not grant the Simulation Argument the status of a legitimate counter-claim. To him, both the Longtermist's "astronomical value" and Dan's "sim discount" are products of the same disease: the belief that human reason can calculate probabilities about things entirely outside the realm of human experience.

  He would tell you that Dan is right to stop the fanaticism, but wrong to think the Simulation Argument is the tool to do it. The tool is simply recognising that we are human beings, limited by custom and experience, not gods capable of modelling the end of time.

  **Hume's plain verdict:**
  > "Both arguments are flights of fancy detached from experience. The Longtermist errs by claiming certainty about the unknowable future; the Sim-proponent errs by claiming probability about the unobservable present. Reject the fanaticism, yes, but do so because such calculations exceed the proper bounds of human reason, not because you might be a computer programme."

  In short: Dan wins the practical outcome (no burning things down for the far future), but Hume would fail him on the philosophy. The "sim discount" is just more noise in a room that needs silence.
