answer: |-
  Here is the argument, the derivation, and the rebuttals, adhering strictly to your stipulations.

  ### The Setup

  Let $n$ be the number of class days. Let $E_d$ be the proposition "The exam occurs on day $d$."
  Let $K$ represent the students' epistemic state. Given your stipulations, $K\phi$ means "The students are **certain** of $\phi$" (probability 1, closed under deduction).
  The Teacher's Announcement ($A$) is:
  $$A \equiv \exists d \in \{1...n\} : (E_d \land \neg K_{d-1} E_d)$$
  *(There will be an exam on some day, and on the morning of that day, the students will not be certain of it.)*

  **Stipulation 1:** The students are certain the announcement is true ($K_0 A$).
  **Stipulation 2:** The teacher is reliable ($A$ is true).

  ### The Derivation: Where Certainty Breaks

  We assume the students are logically omniscient regarding their own certainty (if they are certain of premises and the entailment, they are certain of the conclusion). We run the backward induction on a 2-day week for clarity.

  1.  **Assumption for Reductio:** The students are certain of the announcement on Sunday night ($K_0 A$).
  2.  **Reliability:** Since the teacher is reliable, $A$ is true.
  3.  **Step 1 (Tuesday):** Suppose no exam occurs on Monday. On Tuesday morning, the students know $\neg E_1$.
      *   Since they know $A$ (from 1) and they know $\neg E_1$, and $A$ entails $(E_1 \lor E_2)$, they must be certain of $E_2$.
      *   So, $K_1 E_2$.
      *   However, $A$ explicitly states that if the exam is on Tuesday, they will *not* know it beforehand ($\neg K_1 E_2$).
      *   Contradiction: $K_1 E_2 \land \neg K_1 E_2$.
      *   **Inference:** The students can deduce on Sunday that $E_2$ is impossible *given their certainty in A*. So, $\neg E_2$.
  4.  **Step 2 (Monday):** Since the students have deduced $\neg E_2$ on Sunday, they know the exam must be on Monday.
      *   So, $K_0 E_1$.
      *   However, $A$ explicitly states that if the exam is on Monday, they will *not* know it beforehand ($\neg K_0 E_1$).
      *   Contradiction: $K_0 E_1 \land \neg K_0 E_1$.
  5.  **Conclusion:** The initial assumption (1) leads to a contradiction. Therefore, $\neg K_0 A$.

  **The Result:** The announcement $A$ is true (by stipulation), but the students cannot be certain of it ($\neg K_0 A$).
  **The Moore Parallel:** The logical form of the students' situation is $A \land \neg K_{student} A$.
  This is the exact structural cousin of the Moore sentence ($p \land \neg B_{speaker} p$). In the Moore case, the sentence is true but cannot be *asserted* coherently. In the Surprise Exam case, the sentence is true but cannot be *known* coherently by the hearer.

  **Where the work is done:** The derivation collapses at the step of **Epistemic Closure**. The move from "I know $A$" and "I know $\neg E_1$" to "I know $E_2$" requires certainty. If the students' belief were merely probabilistic (e.g., 99%), they could not deduce $\neg E_2$ with certainty, and the backward induction chain would fail to eliminate Tuesday, thereby preserving the surprise. The impossibility lies specifically in **certainty**, not truth.

  ---

  ### Objection 1: The Assertion/Belief Mismatch
  **Objection:** Moore sentences are paradoxical to *assert* ("It's raining but I don't believe it"). The Surprise Announcement is paradoxical to *believe*. Isn't this just a pun on the word "paradox"?

  **Response:** It is not a pun; it is a structural isomorphism regarding **transparency**.
  A Moore sentence fails because belief is transparent to the believer: if you believe $p$, you cannot simultaneously believe "I don't believe $p$." To assert it is to claim a mental state you cannot hold.
  The Surprise Announcement fails because knowledge is transparent to the knower: if you know $A$, you can deduce the consequences of $A$. But the consequence of $A$ (via backward induction) is that $A$ is false.
  Therefore, just as the speaker cannot *assert* a Moore sentence without irrationality, the student cannot *know* the Announcement without inconsistency.
  The parallel holds because both rely on the subject's access to their own epistemic state undermining the content of the proposition. The Moore sentence is a "Self-Defeating Assertion"; the Announcement is a "Self-Defeating Knowledge Claim."

  ### Objection 2: The Probabilistic Escape
  **Objection:** Students can just believe the announcement with credence 0.99. Nothing goes wrong logically. So what precisely is impossible?

  **Response:** You have identified the exact boundary of the paradox. What is impossible is **Knowledge** (defined as deductively closed certainty).
  If the students assign $P(A) = 0.99$, the backward induction fails.
  *   On Tuesday morning (given no Monday exam), their credence in $E_2$ rises, but not to 1.
  *   Because their credence is not 1, they do not "know" $E_2$ in the strict sense required to violate the "surprise" clause ($\neg K E_d$).
  *   Therefore, the exam can occur on Tuesday, and it remains a surprise (in the sense that they lacked certainty).

  The "impossibility" is not that the exam cannot happen, nor that the statement cannot be true. The impossibility is that the students cannot integrate the announcement into their **set of certainties**. The announcement functions as a "certainty sink." It consumes any certainty the students try to apply to it and converts it into uncertainty. If the students downgrade to high probability, the paradox dissolves, but so does the strict logical contradiction. The paradox *is* the proof that $K A$ is inconsistent with $A$.

  ### Objection 3: The Reliable Informant Norm
  **Objection:** A reliable informant should only tell you things you can come to know. If the students *cannot* know the announcement (as proven above), the teacher is violating a norm of testimony. She is telling them something they are structurally barred from knowing.

  **Response:** This objection confuses **Teacher-Knowledge** with **Student-Knowledge**.
  The norm of testimony is: "Do not assert $p$ unless you know $p$." It is *not* "Do not assert $p$ unless your audience can come to know $p$."
  *   The Teacher knows $A$. (She knows the schedule, and she knows the students' logic prevents them from deducing it with certainty).
  *   The Students cannot know $A$.
  This is an **asymmetric epistemic state**, not a violation of reliability.
  Consider a lock that opens only if you do not know the combination. I can truthfully tell you, "This lock opens if you don't know the code." I know this is true. You cannot come to know it is true *by learning the code*.
  The teacher is not lying. She is describing a state of affairs that includes the students' ignorance as a necessary component. Her reliability guarantees the truth of $A$; the students' rationality guarantees their ignorance of $A$. Both can coexist without violating norms.

  ---

  ### Final Verdict

  **Can a teacher promise "there will be a surprise"?**
  Yes, but only if "promise" implies "commit to making it true," not "commit to letting you know it is true." She can promise the event ($E_d \land \neg K E_d$). She cannot promise that the students will *know* the promise is kept until after the exam. The promise is valid, but it is a promise that precludes the students' certainty of its fulfillment.

  **Can she know in advance that she's pulled it off?**
  Yes. This is the crucial asymmetry.
  The teacher knows the exam day (say, Tuesday).
  The teacher knows the students' logical constraints.
  Therefore, the teacher knows that on Monday night, the students will not be certain of Tuesday.
  Thus, the teacher knows $A$ is true.
  The students, however, cannot know $A$ is true, because if they did, they would deduce $\neg A$.
  So, the teacher **knows** she has pulled it off; the students can only **discover** she pulled it off when the exam arrives. The announcement is a Moore sentence *for the students*, but a standard fact *for the teacher*.
