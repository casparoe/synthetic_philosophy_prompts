answer: |-
  - **Restate the position**
  Testimony is a fundamental source of justification, equivalent to perception or memory. You are entitled to believe a claim simply because it was asserted, without needing prior inductive evidence of the speaker's reliability. This entitlement stands unless you possess specific defeaters (reasons to doubt this speaker or claim); the burden of proof lies on skepticism, not trust.

  - **The case against, ranked from decisive to merely awkward**
  1.  **The Generation Problem (Transmission):** This is the decisive philosophical threat. If testimony is a basic source that generates justification independently of the speaker's status, then a chain of unjustified beliefs can become justified simply by being spoken. If I believe something wildly false without evidence, and tell you, anti-reductionism suggests you are justified in believing me (absent defeaters). This severs justification from truth-conduciveness entirely. If the view denies this (saying you *aren't* justified because I wasn't), then testimony isn't a basic source; it's parasitic on the speaker's epistemic standing, which collapses back toward reductionism.
  2.  **The Systematic Error Community:** Imagine a community systematically wrong about the world (e.g., living in a simulation or a radical cultural delusion) but internally consistent. Anti-reductionism entails that members are justified in believing each other, even if their beliefs are universally false. This makes justification too internalist; it validates epistemic bubbles so long as they are polite. It suggests justification is about social standing, not tracking reality.
  3.  **The Non-Human Source (Your AI worry):** This is a real hole, not just a new case. Anti-reductionism relies on the normative nature of *assertion*—the idea that a speaker takes responsibility for the truth, making them accountable to criticism. AI, datasets, and summarizers produce output without commitment or accountability. If you count AI output as testimony, you lose the "responsibility" condition that grounds the entitlement. If you exclude it, the view becomes obsolete for modern information consumption, where most "testimony" is algorithmic. You can't have it both ways without arbitrariness.
  4.  **Defeater Vagueness:** It is operationally unclear what counts as a defeater. Does general knowledge that "people lie sometimes" count? If yes, default entitlement vanishes. If no, you are forced to believe obvious scams until you have specific proof they are scams. This makes the view hard to apply in real-time decision-making.

  - **What an anti-reductionist would concede is a real cost**
  They would admit that justification on this view does not guarantee truth, even in principle; you can be fully justified and completely wrong if your community is systematically mistaken. They would concede that the view applies primarily to *interpersonal assertion* involving rational agents, not mere information transfer, which limits its scope in a digital age. They must also accept that "default entitlement" is not absolute; it can be overridden by very weak defeaters, meaning the "basic" status is fragile in high-stakes environments.

  - **Insulation check: has it been qualified into unfalsifiability, and is that a problem here?**
  There is a risk of insulation via the "defeater" clause. If every counter-example (e.g., "you shouldn't believe the liar") is met with "there must have been a defeater you missed," the theory becomes tautological. However, it is not fully unfalsifiable: if you can construct a case where a subject has *no* positive reason to doubt, *no* negative reason to doubt, and no prior inductive basis, yet intuition says they are *not* justified, the view fails. The AI case pressures this boundary: if we intuitively feel we shouldn't trust an AI blindly, but there are no specific defeaters, the anti-reductionist must either say our intuition is wrong (risky) or posit a hidden defeater (insulating). The view survives only if "defeater" is kept objective, not retrospective.

  - **Your verdict, one paragraph, and what you'd bet on**
  The anti-reductionist view is correct about human interpersonal exchange but fails as a general theory of information. The normative backbone—trust based on mutual accountability—works for speakers but breaks for systems. I'd bet on a hybrid view: testimony is basic *when* it involves a responsible agent, but becomes reductionist (requiring reliability checks) when the source is non-human or the chain of transmission is opaque. The transmission problem is the fatal flaw for the pure version; you cannot generate justification out of thin air merely by speaking. Stick with anti-reductionism for conversation, but switch to reductionism for data.
