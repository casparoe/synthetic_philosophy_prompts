answer: |-
  1. "The job to be done"
  The theory must resolve the Meno problem: explaining why knowledge possesses greater epistemic value than mere true belief. This is not merely a taxonomic exercise but a normative one, requiring an account of what makes knowledge a distinct achievement rather than a lucky accident. Adequacy should be demanded because existing accounts often fail to locate value that survives the presence of truth itself, succumbing to the swamping problem, or they inflate the value of trivial knowledge. The theory must specify the currency of this value—whether practical, ethical, or strictly epistemic—and demonstrate its presence across standard and edge cases without collapsing into circularity or implausibility. It must justify the pursuit of knowledge over simpler cognitive states.

  2. "The desiderata"
  1. **The Larissa Constraint:** The theory must identify value in the knower's state that exceeds the practical success shared with the true believer. (Motivated by Plato's *Meno* travelers who arrive equally well.)
  2. **The Swamping Solution:** The account must explain how a property adds value to a true belief without that value being rendered redundant by the truth already present. (Motivated by the coffee analogy: a good machine makes good coffee, but if the coffee is already good, the machine's quality seems valueless.)
  3. **The Triviality Filter:** The theory must explain why knowing trivial truths is either not valuable or valuable in a different currency than knowing significant truths. (Motivated by beliefs about grain counts or obscure spellings.)
  4. **The Robustness Condition:** The account must assign positive value to the modal stability of knowledge compared to fragile true belief, even when current action and outcome are identical. (Motivated by cases where the knower would track truth across nearby worlds while the believer would not.)
  5. **The Deference Test:** The theory must clarify whether uncritical reliance on a reliable source yields knowledge and how epistemic value is transmitted without personal competence. (Motivated by the navigation system or scientific authority case.)
  6. **The Distinction Requirement:** The account must maintain a clear boundary between knowledge and accidental true belief without setting the bar so high that knowledge becomes impossible. (Motivated by Gettier cases.)
  7. **The Currency Specification:** The theory must declare whether the extra value of knowledge is epistemic, ethical, or practical, and remain consistent in that denomination across all cases. (Motivated by the ambiguity in "better" within the Meno intuition.)

  3. "Fault lines"
  *   **Triviality Filter vs. Currency Specification:** If value is strictly epistemic, trivial knowledge should have value; if practical, it often does not, threatening the unity of the account.
  *   **Deference Test vs. Robustness Condition:** Deference often lacks personal modal robustness, yet counts as knowledge; requiring robustness may exclude legitimate testimonial knowledge.
  *   **Swamping Solution vs. Larissa Constraint:** Solving swamping often requires final value, but Larissa suggests practical success is the baseline, creating tension over whether the surplus value is useful or ornamental.

  4. "Non-negotiable versus camp-specific"
  **Non-negotiable**
  *   The Swamping Solution
  *   The Larissa Constraint
  *   The Distinction Requirement

  **Camp-specific**
  *   The Robustness Condition (favored by modalists)
  *   The Deference Test (favored by social epistemologists)
  *   The Triviality Filter (favored by value pluralists)

  5. "The most exclusionary requirement"
  The Swamping Solution is the most exclusionary requirement. It rules out crude instrumentalist accounts, particularly simple reliabilism, which treat reliability solely as a means to truth. If truth is the sole final epistemic value, any means to it loses value once the end is achieved. To satisfy this desideratum, a theory must posit either a second final value (like understanding or competence) or a constitutive relationship between the method and the truth that survives the presence of truth. This requirement alone eliminates any theory that cannot explain why the *source* of the truth matters once the truth is secured.
