  **Scenario**
  Two hospital departments, Trauma (Player 1) and Oncology (Player 2), must bargain over the weekly allocation of 100 hours on a shared robotic surgery machine. Both departments are risk-neutral regarding patient survival probabilities, but the technology exhibits diminishing returns: the probability of successful outcomes ($u$) relates to allocated hours ($h$) via $u_1 = \sqrt{h_1}$ and $u_2 = 2\sqrt{h_2}$, reflecting Oncology's higher baseline efficiency with the machine. A contractual minimum staffing guarantee ensures a disagreement point of 16 hours for Trauma and 4 hours for Oncology, yielding nonzero baseline utilities. The total capacity constraint is $h_1 + h_2 \leq 100$, which generates a strictly convex utility possibility frontier.

  **Bargaining Specifications**
  *   **Feasible Set ($S$):** The set of utility pairs $(u_1, u_2)$ satisfying $u_1^2 + \frac{u_2^2}{4} \leq 100$, with $u_1 \geq 4$ and $u_2 \geq 4$.
  *   **Disagreement Point ($d$):** $(4, 4)$.
  *   **Ideal Point ($a$):** Derived by maximizing one player's utility while holding the other at $d$. Max $u_1$ (at $u_2=4$) is $\sqrt{96} \approx 9.80$; Max $u_2$ (at $u_1=4$) is $2\sqrt{84} \approx 18.33$. Thus, $a = (9.80, 18.33)$.
  *   **Ideal Gains:** Player 1 gain $= 5.80$; Player 2 gain $= 14.33$. (Player 2 has the larger ideal gain).
  *   **Kalai-Smorodinsky (KS) Solution:** The intersection of the line segment $da$ and the frontier. It equalizes the ratio of actual gain to ideal gain ($\approx 0.71$ for both). Approximate point: $(7.52, 13.92)$. Absolute Gains: $(3.52, 9.92)$.
  *   **Nash Bargaining Solution (NBS):** The point maximizing the product of gains $(u_1 - 4)(u_2 - 4)$ on the frontier. Approximate point: $(7.85, 13.55)$. Absolute Gains: $(3.85, 9.55)$.

  **Geometric Analysis**
  The divergence is driven by the **strict convexity (curvature)** of the feasible frontier combined with the **nonzero disagreement point**. The frontier bulges outward, meaning the marginal rate of substitution changes as we move along it. The KS solution follows a straight ray from $d$ to $a$, prioritizing proportional claims. The Nash solution finds a tangency with a rectangular hyperbola centered at $d$; due to the curvature, this tangency occurs "earlier" for Player 2 (the high-potential player) than the KS ray does. If the feasible set were linear (constant returns to scale), the KS ray and the Nash hyperbola would touch at the same point, and the solutions would coincide.

  **Axiomatic Critique**
  A **Nash defender** would attack the KS point for violating **Independence of Irrelevant Alternatives (IIA)**. They argue that the ideal point $a$ depends on portions of the feasible set far from the solution; if the frontier were truncated near the KS point without changing the local trade-offs, the KS solution would shift, whereas the Nash solution would remain stable. A **Kalai-Smorodinsky defender** would attack the Nash point for violating **Individual Monotonicity**. They argue that if the feasible set expanded solely in Player 2's direction (increasing Player 2's ideal gain), the Nash solution might fail to reward Player 2 (or could even reduce their utility due to the product maximization logic), whereas the KS solution guarantees that a player never loses from an expansion of their own opportunities.

  **Pedagogical Conclusion**
  This case demonstrates that the choice between solutions is not merely mathematical but normative: it depends on whether the bargaining context prioritizes **stability of local incentives** (Nash/IIA) or **fairness of claims relative to potential** (KS/Monotonicity). When parties have asymmetric potential gains and diminishing returns, Nash tends to compress the distribution of fractional gains to maximize total surplus, while KS preserves the proportionality of satisfaction relative to what was possible.
