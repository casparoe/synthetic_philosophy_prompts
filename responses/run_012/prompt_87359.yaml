  1.  **Analyze the Request:**
      *   **Role:** Chair of the standards committee of a regional EMS alliance.
      *   **Audience:** Committee members (40 ambulance services, hospitals, volunteer squads).
      *   **Topic:** Switching from current color-coded triage tags to a new system (colors + shapes, time field, used by neighbors).
      *   **Conflict:** Colleague Dana argues against switching based on David Lewis's theory of convention (arbitrariness, coordination problem, impossibility of simultaneous move).
      *   **Complicating Factors:** Three urban services will switch anyway; the biggest trainer is waiting a year (risk of dual codes).
      *   **Task:** Draft a memo to the committee before the vote.
      *   **Requirements:**
          *   Lead with recommendation in the first two sentences.
          *   Address Dana's argument honestly (acknowledge Lewis, explain why it doesn't support her conclusion).
          *   Hard limit: 600 words.
          *   Style: American English.

  2.  **Deconstruct Dana's Argument (Lewis's Convention):**
      *   *Premise 1:* Conventions are regularities based on mutual expectations (true).
      *   *Premise 2:* Conventions are arbitrary (any solution works if everyone agrees).
      *   *Conclusion:* Therefore, merit doesn't matter; only coordination matters. Since we can't coordinate perfectly (40 services moving at once), we shouldn't switch.
      *   *Counter-argument:* Lewis acknowledges conventions can change if there's a focal point or if the cost of staying outweighs the cost of switching. Also, the "arbitrariness" claim doesn't mean *all* conventions are equally good forever, just that the initial choice was arbitrary. If a superior convention emerges (network effect), switching becomes the new coordination equilibrium. The "cannot move at once" claim is factually challenged by the urban services leaving anyway.

  3.  **Drafting - Section by Section:**

      *   **Recommendation (First 2 sentences):** Must be clear. Recommend adopting the new system. Set a timeline.
      *   **Context/Problem:** Current system works but has flaws (color blindness, no time field). Neighbors use new system.
      *   **Addressing Dana/Lewis:** Acknowledge she's right about coordination. Conventions *are* about mutual expectation. But she's wrong about inertia. Lewis notes conventions shift when the payoff structure changes. If key players (urban services) leave, the old convention breaks.
      *   **The Risk of Inaction:** Biggest trainer waiting a year + urban services leaving = dual codes anyway. This is the worst outcome.
      *   **The Path Forward:** Regional adoption prevents the dual-code chaos.
      *   **Call to Action:** Vote yes.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      To the Committee: I recommend we adopt the new shape-and-color triage system effective next quarter. We must authorize immediate procurement and training to prevent regional fragmentation.
      Dana argues using David Lewis that our current colors are a convention and shouldn't change because coordination is hard. She is right that conventions rely on mutual expectation. However, she is wrong that they are immutable. Lewis acknowledges conventions shift when the equilibrium breaks.
      Here, the equilibrium is breaking. Three urban services are switching regardless. If we stay, we have two systems. The biggest trainer is waiting a year, creating confusion.
      The new system is objectively better (colorblind accessible, time tracking). Neighbors use it.
      Staying puts us in the worst spot: dual codes during transition.
      Moving together solves the coordination problem Dana worries about.
      Vote yes.

  5.  **Refining and Editing (Word Count & Tone Check):**
      *   Need to ensure the Lewis argument is nuanced but concise.
      *   Need to make sure the recommendation is in the *very* first two sentences.
      *   Need to keep it under 600 words.
      *   American English.

  6.  **Drafting - Iteration 2 (Writing):**

      **MEMORANDUM**

      **TO:** Regional EMS Alliance Standards Committee
      **FROM:** Committee Chair
      **SUBJECT:** Recommendation on Triage Tag Standardization

      I recommend we formally adopt the new shape-and-color triage system effective immediately. We must authorize coordinated procurement and training now to prevent dangerous fragmentation across the region.

      Our current color-coded tags function well, but they exclude color-blind providers and lack time-tracking fields. Neighboring regions have already standardized on the new system. However, Dana has raised a significant theoretical objection based on David Lewis's theory of convention. She argues our current colors are a coordination equilibrium: arbitrary but stable because everyone expects everyone else to use them. She concludes that because merit is secondary to coordination, and because we cannot move all 40 services simultaneously, we should not switch.

      Dana is correct that conventions rely on mutual expectation. She is also right that the initial choice of colors was arbitrary. However, her conclusion that we cannot switch misapplies Lewis. Conventions are not immutable; they shift when the payoff structure changes. Lewis acknowledges that if a subset of agents adopts a superior convention, the old equilibrium collapses.

      That collapse is already happening. Three urban services intend to switch regardless of our vote. If we remain static, we guarantee the very confusion Dana seeks to avoid. We will face a hybrid region where medics must interpret two different systems during mass casualties. Furthermore, our largest training provider plans to wait a year before switching. If we do not lead a regional move now, we condemn ourselves to twelve months of dual-code operations. That is objectively more dangerous than the transition costs of switching together.

      The "arbitrariness" of the old system does not obligate us to keep it when a superior coordination point exists. The new system offers tangible safety benefits for 8% of our providers and improves patient tracking. Since our neighbors use it, adopting it expands our coordination network rather than shrinking it.

      The risk here is not change; it is misalignment. If we vote to adopt, we can synchronize the 40 services, bringing the volunteer squads and hospitals along with the urban leaders. This solves the coordination problem Dana rightly identifies by making the new system the regional expectation. If we vote no, we lose control of the timeline. The urban services will leave the convention anyway, and we will be stranded with a broken standard.

      We have the opportunity to turn a fragmented transition into a unified upgrade. By moving together, we maintain the mutual expectation required for safety while upgrading the tool itself.

      Please review the attached implementation timeline. I look forward to your vote on this motion at Tuesday's meeting.

