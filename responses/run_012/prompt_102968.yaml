  **Note on the Text**

  This poem takes two primary liberties. First, it deliberately breaches the pantoum's strict requirement for identical repetition in the transition between the second and third stanzas (changing 'Some' to 'No'), enacting the 'smallest perceptible tilt' described in the prompt. Second, it attributes the 'ass' analogy directly to Buridan's conception of the will, whereas historically the example was used by critics to ridicule his position rather than by Buridan himself. The claim I am least confident in is the suggestion that the will *must* remain suspended indefinitely; modern decision theory suggests a randomising function could resolve the deadlock without a change in preference, though this would contradict the strict scholastic definition of the will adopted for the piece.
