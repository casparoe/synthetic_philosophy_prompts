answer: |-
  **Exam Question**

  **Question 1**
  In a recent seminar, a student argued that the reference class problem is a pseudo-problem. Their proposal was as follows: 'To assign a probability to a single case, simply take the narrowest reference class for which you have a statistically reliable frequency estimate. If several classes are tied for narrowness, average their frequencies. That is what actuaries do, and it works.'

  Critically evaluate this proposal. Your answer must address the following:
  1.  What conceptual distinction does this proposal conflate?
  2.  Can the instruction to find the 'narrowest reliable class' be made precise without circularity?
  3.  Discuss the technical consequences of pushing this method: specifically, the issue of ever-finer partitions, gerrymandered classes, and the problem of averaging frequencies across classes with divergent causal structures.
  4.  Does the requirement for 'statistical reliability' (e.g., a significance threshold) smuggle in a reference class of its own?
  5.  Conclude by assessing whether any part of the student's defence survives, and what this implies about the severity of the reference class problem.

  ***

  **Model Answer**

  The student's proposal offers a pragmatic heuristic but fails as a philosophical solution. It conflates epistemic justification with actuarial stability. While an insurer needs a consistent rule to price premiums, a philosopher of probability seeks a truth-apt assignment of credence. The actuary's 'success' relies on institutional consensus, not on solving the logical problem of single-case probability.

  The instruction to select the 'narrowest reliable class' cannot be made precise without circularity. If 'narrowest' is taken literally, we approach the singleton class (the individual themselves), where frequency is either 0 or 1, rendering probability trivial. To halt this regression, one must impose a constraint on 'reliability'. However, as Hájek notes, defining reliability requires a significance threshold. A class is 'reliable' only if the sample size is sufficient relative to a chosen confidence level. But determining that sample size presupposes a reference class (the population from which the sample is drawn). Thus, the criterion for selecting a class secretly relies on a prior classification, rendering the proposal circular.

  Furthermore, pushing on the technical bits reveals structural incoherence. Regarding partitions: for any valid class (e.g., 'smokers'), one can construct a gerrymandered subclass (e.g., 'smokers born on a Tuesday') that alters the frequency. Without a principle of *projectibility*—distinguishing natural kinds from arbitrary disjunctions—the 'narrowest' class is indeterminate. The student's appeal to 'what actuaries do' sidesteps this; actuaries ignore gerrymandered classes by professional convention, not logical necessity.

  The instruction to 'average' tied classes is equally problematic. Averaging presupposes that the frequencies are commensurable. However, reference classes often embody different causal structures. Consider a patient who is both a smoker (class A) and an exerciser (class B). If smoking causally increases risk and exercise causally decreases it, averaging the frequencies treats these as independent statistical noise rather than competing causal mechanisms. This obscures the underlying ontology. One cannot arithmetically average probabilities derived from distinct causal pathways without a model of how those pathways interact. To build that model is to abandon the frequentist reference class approach in favour of a causal or Bayesian framework.

  Does anything survive? The student is correct that we must act. In decision-theoretic contexts, we are forced to adopt a 'working' reference class. The proposal survives as a pragmatic rule for action under the constraint of limited computational resources, akin to Gigerenzer's 'fast and frugal' heuristics. However, this concedes that the reference class problem is not solved, but merely managed.

  This implies the problem is severe. It demonstrates that objective single-case probabilities cannot be derived solely from frequencies without extra-logical input (causal knowledge or projectibility judgements). The reference class problem is not a pseudo-problem; it is a symptom of the impossibility of reducing epistemic probability to raw frequency alone. The actuary's method works because the world possesses stable causal structures that allow certain classes to be predictive, not because the logic of reference classes is sound.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **First Class (16–20 marks)**
  *   **Conceptual Conflation (3 marks):** Clearly distinguishes between *pragmatic decision rules* (actuarial consistency) and *epistemic justification* (truth-apt credence).
  *   **Precision & Circularity (4 marks):** Identifies that 'narrowest' leads to singletons (0/1 probability) and explicitly argues that 'reliability' requires a significance threshold which itself presupposes a reference class (Hájek's point).
  *   **Technical Pushback (5 marks):** Addresses **both** gerrymandering/projectibility (Goodman/Kyburg) **and** the incoherence of averaging across divergent causal structures (not just 'different numbers', but different mechanisms).
  *   **Conclusion (4 marks):** Nuanced assessment: the proposal survives as a heuristic for action but fails as a logical solution. Correctly identifies that this confirms the severity of the problem (frequencies require causal supplementation).

  **Upper Second (12–15 marks)**
  *   **Conceptual Conflation (2 marks):** Identifies the difference between acting and knowing, but perhaps treats the actuary's success as more substantive than it is.
  *   **Precision & Circularity (3 marks):** Notes the regression to singletons but misses the specific circularity regarding significance thresholds/sample size determination.
  *   **Technical Pushback (4 marks):** Discusses gerrymandering well but treats 'averaging' as merely mathematically inconvenient rather than causally incoherent.
  *   **Conclusion (3 marks):** Concludes the problem remains but offers a less precise account of *why* the defence partially survives (e.g., vague appeal to 'practicality').

  **Lower Second (8–11 marks)**
  *   **General Understanding (5 marks):** Summarises the standard reference class problem (Reichenbach) accurately but engages only superficially with the specific 'narrowest/reliable' prompt.
  *   **Technical Details (3 marks):** Mentions partitions or sample size but lacks the critical insight into circularity or causal structure.
  *   **Conclusion (3 marks):** Binary conclusion (problem is real vs. pseudo) without the nuanced 'heuristic survives, logic fails' distinction.

  **Third / Fail (0–7 marks)**
  *   **Misunderstanding (0–4 marks):** Fails to address the specific student proposal; writes a generic essay on Bayesianism vs. Frequentism.
  *   **Errors (Deductions):** Claims averaging is a valid logical solution without qualification (-2 marks). Claims the actuary's method solves the philosophical problem (-2 marks). Fails to write in British English (persistent spelling errors) (-1 mark).

  **Specific A/B Boundary Note:**
  To cross from 15 to 16, the candidate **must** secure the full 4 marks in the 'Precision & Circularity' section by explicitly noting that significance thresholds smuggle in a reference class. A candidate who identifies the regression to singletons but misses the threshold circularity cannot score above 15, regardless of essay style. This ensures the boundary is based on technical comprehension, not 'vibe'.
