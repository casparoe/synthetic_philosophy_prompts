answer: |-
  Consider Elias, who is caught stealing bread by the shopkeeper, Marcus. Marcus holds Elias's arm and says, "I saw you take it." Elias, looking at the ground and knowing Marcus cannot be convinced otherwise, mutters, "I didn't take it," not to make Marcus believe him, but simply because he cannot bear to speak the shameful truth aloud.

  Under the mismatch criterion, Elias's statement is a lie because he holds one thing in his mind (guilt) and utters another in words (innocence). The structural divergence between belief and signification is complete. Under the desire-to-deceive criterion, however, Elias's statement is not a lie. Because he knows Marcus witnessed the theft, he possesses no *voluntas fallendi*; he does not intend to induce a false belief in his listener, as he knows such induction is impossible. The two strands come apart because the first examines the internal coherence of the speaker's signification, while the second examines the teleological direction of the speech act toward the listener's mind.

  Augustine's position actually requires the desire-to-deceive strand to be the decisive factor. We see this in how he handles neighboring cases: he exempts jokes from the category of lies despite the presence of a mind-word mismatch, precisely because the joker signals that no deceit is intended. Conversely, he classifies the speaker who asserts a truth he believes to be false as a liar, because the desire to deceive is present even if the mismatch with objective reality is absent. If Augustine prioritized the mismatch strand, jokes would constitute lies, and the speaker in error (asserting falsehood believed true) might be culpable simply for being wrong. By prioritizing the will, Augustine preserves the moral distinction between error and sin, and between playfulness and fraud. To adopt the mismatch strand as definitive would force him to condemn all fiction and irony as sinful deception, a cost he explicitly refuses to pay in his discussion of theatrical performance and social pleasantries.

  Consequently, the desire to deceive is doing definitional work, not merely gradational work. It is the *voluntas fallendi* that transforms a false signification into a *mendacium*. The mismatch is a necessary condition—one cannot lie without signifying against one's mind—but it is not sufficient. The gravity of the lie is ranked by the purpose of the deceit (malicious, officious, or jocose), but the existence of the lie itself depends on the will to deceive. Without this will, the utterance remains a falsehood or a fiction, but it lacks the specific moral species of lying.

  The strongest objection to this case is that Elias covertly retains a desire to deceive, either by hoping to plant a seed of doubt in Marcus's mind or by deceiving himself about his own shame. One might argue that the very act of denying a known fact implies an intent to alter the listener's epistemic state, however futile. However, this objection conflates the habit of lying with the specific act. We can stipulate that Elias knows Marcus's certainty is absolute; in such a scenario, willing an impossible belief is psychologically incoherent. Augustine's framework focuses on the intentional orientation of the will. If Elias speaks solely to express his own emotional state rather than to alter Marcus's belief, the *voluntas fallendi* is absent. To classify this as a lie would be to punish the internal struggle of shame rather than the external act of deception, collapsing Augustine's careful distinction between the sin of lying and the mere utterance of falsehoods.
