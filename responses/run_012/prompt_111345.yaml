  There is no single canonical term that captures the entire loop you describe. You have correctly identified a composite phenomenon that sits at the intersection of social psychology and epistemology, but the literature tends to slice it into separate pieces.

  Here is the carving you are looking for.

  ### The Components

  1.  **The Belief Update:** You noted that in information cascades, private belief stays put. Technically, in a strict game-theoretic **information cascade**, private belief *does* update; agents rationally ignore their own signal because the public signal (the actions of predecessors) is statistically stronger. However, in popular usage, people often conflate cascades with **preference falsification** (where private belief remains unchanged). What you are describing in the first half—where private doubt genuinely turns into belief—is **Informational Social Influence** (Deutsch & Gerard). This is distinct from Normative Social Influence (doing it to fit in). The observers are not lying; they have been persuaded by the social proof.
  2.  **The Collapse:** This is simply the falsification of the hypothesis.
  3.  **The Memory Rewrite:** This is **Hindsight Bias** (or creeping determinism), specifically motivated by ego protection and status defence. Admitting one was swept up in a herd is epistemically embarrassing, particularly in communities that pride themselves on rationality. To protect one's self-model as an independent thinker, the memory is edited: "I wasn't convinced; I was just humouring them," or "I knew it was shaky all along."

  ### The Missing Name

  While **Availability Cascade** (Kuran & Sunstein) covers the self-reinforcing belief formation, and **Status Cascade** (a term often used in the SSC/LW sphere, notably by Zvi Mowshowitz) covers the incentive structure, neither explicitly mandates the retroactive memory revision.

  Since you asked for a coinage if none exists: I propose **Cascade Amnesia**.

  ### Definition and Boundaries

  **Cascade Amnesia** is the specific sequence where:
  1.  **Social Proof** induces genuine private belief change (distinguishing it from preference falsification).
  2.  **External Falsification** disproves the belief.
  3.  **Motivated Forgetting** rewrites the history of the belief formation to deny the social influence (distinguishing it from a standard information cascade).

  **Does it need the collapse?**
  Yes. Without the collapse, it is merely an Information Cascade or Intellectual Fashion. The phenomenon you find bothersome is the *dishonesty* about the prior state of belief, which only triggers when the belief becomes liabilities.

  **Does it need the memory rewrite?**
  Yes. This is the critical edge. If the group collapses and admits, "We were all swept up and wrong," that is a healthy **Information Cascade Reversal**. It only becomes *Cascade Amnesia* when the agents deny they ever held the belief with conviction.

  ### Why It Feels Distinct

  It differs from **Groupthink** because Groupthink implies a cohesive decision-making body suppressing dissent to maintain harmony. Your example is often organic and distributed (blog comments), where no one is actively suppressing anyone else; the suppression is internal and retrospective.

  It differs from **Pluralistic Ignorance** because in pluralistic ignorance, everyone privately disagrees but thinks everyone else agrees. In your scenario, everyone privately *comes to agree*, then later claims they privately *disagreed*.

  ### Summary

  The concept is **Cascade Amnesia**. It is an Information Cascade (internalised) followed by Motivated Hindsight Bias. It requires the collapse to trigger the defence mechanism, and it requires the memory rewrite to distinguish it from merely being mistaken.

  It is particularly prevalent in high-status epistemic communities because the cost of admitting susceptibility to social proof is higher than the cost of minor memory falsification.
