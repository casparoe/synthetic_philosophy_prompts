      *   *The Core Violation:* Focus on State-Dependent Utility. $U(\text{Married to Jocasta} | \text{Ignorant}) \gg U(\text{Married to Jocasta} | \text{Knowing})$. This breaks the theorem.
      *   *Ex Ante vs. Ex Post:* Clarify that Good's theorem is about expectation. Oedipus got unlucky on the *content*, but the *process* was rational *if* the utility function were stable. Since the utility function isn't stable, the theorem doesn't apply.
      *   *Cost:* It's not just a red herring. Psychological cost is real cost.
      *   *Conclusion:* The play isn't a math error; it's a proof that humans aren't standard Bayesian agents with stable utility functions over world-states independent of knowledge.

