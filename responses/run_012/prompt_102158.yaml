          4.  **Rational Updating:** The agent updates beliefs via Bayes' rule and maximizes expected utility based on those beliefs.
          5.  **Ex Ante vs. Ex Post:** The theorem is about *expected* value before receiving the info, not the *realized* value after. Bad news can happen, but the *expectation* of getting the news must be $\ge 0$.

  3.  **Analyze *Oedipus Rex* through the Lens:**
      *   **Oedipus as an Agent:** Is he a rational expected-utility maximizer? Yes, largely. He seeks to maximize the welfare of Thebes and his own standing/safety. He uses evidence (Tiresias, Creon, Messenger, Shepherd).
      *   **The "Destruction":** Is the *outcome* worse? Yes (blindness, exile, shame).
