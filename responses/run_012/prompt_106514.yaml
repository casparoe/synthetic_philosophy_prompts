      *   **Selection Effects:** If we search through 1000 theories to find one that fits old evidence $E$, that one theory isn't strongly confirmed, even if its LR looks good in isolation. Novel prediction avoids this selection bias.
      *   **The "Use-Novelty" Intuition:** There is a genuine epistemic virtue in predicting something unknown. It shows the theory has *explanatory power* beyond just matching existing data.

