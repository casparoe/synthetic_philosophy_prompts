      *   *Aggregation:* CBA sums WTP/WTA across the population. This is the "Kaldor-Hicks" criterion.
      *   *Scope Insensitivity:* In contingent valuation, people often bid the same for saving 2,000 birds as 200,000. The utilitarian says CBA *should* be sensitive to scope (linear scaling). The "Speck" argument says *you* are scope-insensitive regarding the torture.
