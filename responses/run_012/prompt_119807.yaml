prompt: |-
  I am building predictive models of artificial agents that must act under time pressure and cannot derive everything their information entails, and before I commit to any account of their belief states I want the standard of adequacy written out. Set out the desiderata for a theory of belief for such agents: the cases it must get right, the distinctions it must not collapse, and the results it must remain consistent with, each with the consideration that makes it a requirement rather than a preference of one camp. I care especially about these cases: an agent that stores a universally quantified conditional together with its antecedent but has never performed the instantiation, so that it is silent about the consequent; an agent that did derive the consequent and then had the conclusion overwritten in working memory; an agent that believes the general claim that every tautology is true while failing to believe some particular monstrous tautology, so that nothing about it is closed under anything yet its contents do not contradict one another; an agent holding contradictory entries from two subsystems that never interact; and an agent whose degrees of belief must be defined for the purposes of choice even though it holds no attitude toward most of the consequences of what it believes. I expect some of these requirements cannot be had together, and that is the part I most want from you: say which pairs you judge jointly unsatisfiable and whether the conflict is a theorem or a matter of engineering, in particular whether closure under the agent's own inference rules can be required at all without collapsing back into the omniscience the theory was built to avoid, and whether any representation of belief rich enough to compose with probability, decision, and communication can escape licensing the substitution of logical equivalents. Then name the single requirement that does the most to exclude the existing families of accounts, and score those families briefly against the list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **Goal:** Define a standard of adequacy (desiderata) for a theory of belief for artificial agents under time pressure (bounded rationality).
      *   **Specific Cases to Address:**
          1.  Stored universal + antecedent, but no instantiation (silent on consequent).
          2.  Derived consequent, then overwritten in working memory (forgotten).
          3.  Believes "all tautologies are true" but fails to believe a specific monstrous tautology (non-closure, no contradiction).
          4.  Contradictory entries in isolated subsystems (compartmentalization).
          5.  Degrees of belief needed for choice, but no attitude toward most consequences (probabilistic coherence vs. explicit representation).
      *   **Key Analysis Required:** Identify conflicts/trade-offs between these desiderata. Specifically:
          *   Which pairs are jointly unsatisfiable?
          *   Is the conflict a theorem (logical impossibility) or engineering (resource limits)?
          *   Can closure under inference rules be required without omniscience?
          *   Can belief representation escape substitution of logical equivalents while remaining rich enough for probability/decision/communication?
      *   **Final Task:** Name the single requirement that excludes the most existing accounts and score existing families against the list.

  2.  **Analyze the Desiderata (The "Standard of Adequacy"):**

      *   *D1: Implicit vs. Explicit Distinction.* The theory must distinguish between what is stored and what is derivable but not derived. (Addresses Case 1 & 3).
      *   *D2: Dynamic Volatility.* Belief states must track working memory limits. Derivation $\neq$ permanent belief. (Addresses Case 2).
      *   *D3: Non-Omniscience (Logical Ignorance).* Agents can fail to believe logical consequences without contradiction. (Addresses Case 3).
      *   *D4: Compartmentalization (Fragmentation).* Agents can hold $P$ and $\neg P$ if they are in non-communicating contexts. (Addresses Case 4).
      *   *D5: Decision-Theoretic Usability.* Beliefs must map to action probabilities even if not explicitly represented. (Addresses Case 5).

  3.  **Analyze the Conflicts (The "Hard Part"):**

      *   *Conflict 1: Closure vs. Non-Omniscience.*
          *   If we require closure under the agent's *own* inference rules, do we get omniscience?
          *   *Analysis:* If the agent *has* the rule and the premises, standard logic says the conclusion follows. But the agent is under time pressure. If "Belief" = "Available for inference," then closure is trivial. If "Belief" = "Stored," closure fails.
          *   *Theorem vs. Engineering:* It's a theorem that if you define belief as a set closed under valid inference, you get omniscience. To avoid it, you must define belief structurally (syntax) or procedurally (process). But if you define it procedurally, D5 (Decision Theory) becomes hard because decision theory assumes coherent probabilities over the *space* of propositions, not just the *stored* ones.
      *   *Conflict 2: Substitution of Equivalents vs. Decision/Probability.*
          *   Standard Probability/Decision Theory assumes $P(A) = P(B)$ if $A \iff B$.
          *   Bounded agents treat "2+2=4" differently from "Fermat's Last Theorem" (before proof).
          *   *Theorem:* If you want a standard probability measure over a Boolean algebra, you *must* allow substitution of logical equivalents. If you forbid it (hyperintensionality), you break the Kolmogorov axioms or require impossible computational overhead to check equivalence.
      *   *Conflict 3: Compartmentalization vs. Global Coherence for Action.*
          *   D4 says $P$ and $\neg P$ can coexist. D5 says we need degrees of belief for *choice*. Choice usually requires a single utility maximization function. If subsystem A says "Go" and subsystem B says "Stop" based on contradictions, how is the action selected?
          *   *Engineering:* This is an arbitration problem.
          *   *Theorem:* If you require a single probability function over the union of subsystems, D4 is violated.

  4.  **Synthesize the "Jointly Unsatisfiable" Pairs:**

      *   *Pair A:* **Full Probabilistic Coherence (D5)** + **Hyperintensionality (D3/D1).** You cannot have a standard probability measure that distinguishes between logical equivalents.
      *   *Pair B:* **Compartmentalization (D4)** + **Global Action Consistency (implied by D5).** If beliefs are fragmented, the "degree of belief" driving action is either fragmented (leading to incoherent action) or aggregated (violating the fragmentation).
      *   *Pair C:* **Closure under Own Rules** + **Non-Omniscience.** If "Own Rules" includes "If you have time, derive it," you slide back to omniscience. If "Own Rules" is limited, you aren't truly closed under them.

  5.  **Address the Specific Questions:**

      *   *Closure under agent's inference rules:* Cannot be required as a static property of the belief *set*. It must be a property of the *process*. If required statically, it collapses to omniscience (Logical Omniscience Problem).
      *   *Substitution of Equivalents:* No representation rich enough for standard probability/decision theory can escape this *mathematically*. To escape it, you must abandon standard probability (e.g., use imprecise probabilities, impossibility measures, or syntactic probabilities).

  6.  **Identify the "Killer" Requirement:**

      *   Which requirement kills the most existing theories?
      *   *Candidate:* **D3 (Non-Omniscience/Hyperintensionality) combined with D5 (Decision-Theoretic Usability).**
      *   *Why?*
          *   Hintikka-style epistemic logic fails D3.
          *   Standard Bayesianism fails D3 (logical omniscience).
          *   Pure Syntactic/Database approaches satisfy D3 but often fail D5 (how do you get probabilities from syntax without semantics?).
          *   Fragmented belief (Stalnaker/Lewis) handles D3/D4 but struggles with D5 (unified action).
      *   *Selection:* **The Requirement of Hyperintensional Probabilistic Coherence.** (i.e., Assigning distinct probabilities to logical equivalents while maintaining coherence sufficient for Dutch Book avoidance). This is the hardest nut to crack.

  7.  **Score Existing Families:**

      *   *Classical Doxastic Logic (Hintikka):* Fails D3, D1.
      *   *Standard Bayesianism:* Fails D3, D1.
      *   *Syntactic/Database Models:* Pass D1, D2, D3. Fail D5 (no natural probability).
      *   *Fragmented Belief (Lewis/Stalnaker):* Pass D3, D4. Struggle with D5.
      *   *Active Logic/Step-Logic:* Pass D1, D2, D3. Struggle with D5.

  8.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Rigorous, philosophical but engineering-aware.
      *   *Structure:*
          1.  The Desiderata (The Standard).
          2.  The Incompatibility Theorems (The Conflicts).
          3.  The Closure & Equivalence Question.
          4.  The Exclusionary Requirement.
          5.  Scoring the Families.

      *   *Refining the "Closure" point:* Be careful. Closure under *feasible* inference is okay. Closure under *valid* inference is not. The prompt asks about "closure under the agent's own inference rules." If the agent *has* the rule but lacks the *time*, is it closed? No. So closure must be time-indexed.
      *   *Refining the "Equivalence" point:* Standard probability *requires* $P(A)=P(B)$ if $A \equiv B$. To avoid this, you need a non-standard framework (e.g., logical probability, impossible worlds). This is a theorem of measure theory.

      *   *Refining the "Killer" Requirement:* It's the demand that the belief state be **action-guiding (D5)** while being **logically non-omniscient (D3)**. Most theories pick one. Bayesians pick action. Logicians pick structure (but usually omniscient). Database systems pick structure but lack action semantics.

  9.  **Final Review against Prompt Constraints:**
      *   Did I cover the 5 specific cases? Yes, mapped to desiderata.
      *   Did I identify jointly unsatisfiable pairs? Yes.
      *   Did I distinguish theorem vs. engineering? Yes.
      *   Did I address closure and substitution? Yes.
      *   Did I name the single exclusionary requirement? Yes.
      *   Did I score existing families? Yes.

      *(Self-Correction during drafting)*: Make sure to explicitly mention the "monstrous tautology" case in the context of Logical Omniscience. Ensure the distinction between "engineering limitation" (RAM) and "theoretical limitation" (Measure Theory axioms) is clear.

      *Key Insight:* The tension between *Fragmentation* (Case 4) and *Choice* (Case 5) is crucial. If I act, I act as a whole. If my beliefs are fragmented, my action implies a unification that contradicts the fragmentation.

      *Let's finalize the "Killer Requirement".* It is **D5 (Decision-Theoretic Usability) constrained by D3 (Non-Omniscience).** Specifically: *The requirement that degrees of belief guide rational choice without assuming closure under logical equivalence.*

      *Scoring:*
