          *   Can it survive the "generation at waking" view (Schwitzgebel-style skepticism)?
          *   Can it survive the "no experience/disposition" view (Malcolm/Dennett-style behaviorism)?
          *   What would be lost? What must be abandoned/reinterpreted?
          *   Which evidence bears most against skepticism (stimulus incorporation, lucid signals, therapy)?
      *   **Task 3: Check Internal Consistency.** Does the practice treat dreams as experiences in one context and narratives in another?
      *   **Task 4: Epistemic Status.** If the theory is right, how should reports count as evidence (introspection, narrative, in-between)?

  2.  **Initial Brainstorming & Philosophical Landscape:**

      *   *The Tension:* Realism about dreaming (there is a phenomenological movie playing during sleep) vs. Skepticism/Constructivism (dreams are confabulations upon waking).
      *   *Key Philosophers:* Norman Malcolm (Dreaming, 1959) - logical behaviorism about dreams. Daniel Dennett (Dreams, 1976) - "Orwellian" vs. "Stalinesque" confabulation. Eric Schwitzgebel (The Unreliable Nature of Dream Reports, 2011) - empirical skepticism.
      *   *Scientific Practice:* EEG/REM correlation, Lucid dreaming eye signals (LaBerge), Stimulus incorporation (Nielsen).
      *   *Clinical Practice:* Psychoanalysis (Freud/Jung) - dreams mean something about the unconscious. CBT for nightmares - dreams affect mood.

  3.  **Drafting Task 1: The Implicit Theory (The "Naïve Realist" Model):**

      *   *Existence:* Dreams are conscious experiences.
      *   *Timing:* They occur temporally coincident with sleep physiology (REM/NREM).
      *   *Relation:* Reports are memory traces of those experiences. Imperfect, but causal links exist.
      *   *Identity:* The "I" sleeping is the same "I" waking. Continuity of subjectivity.
      *   *Label:* Let's call this the *Standard Experiential Realism*.

  4.  **Drafting Task 2: Requirements vs. Comfort (The Stress Test):**

      *   *View A: Report Generated at Waking (The "Dennettian" Middle Ground).* The brain constructs the narrative *as* you wake up based on fragmented neural activity.
          *   *Can practice survive?* Mostly yes. Correlations still hold (brain state X -> report Y). Lucid signals still imply *some* concurrent processing. Therapy still works (narrative affects mood).
          *   *What's lost?* The idea of a "dream world" existing independently of the report. The temporal duration claims (did the dream *really* last 20 mins?).
      *   *View B: No Experience/Disposition Only (The "Malcolmian" Strong Skepticism).* To dream *just is* to be disposed to report a dream.
          *   *Can practice survive?* Harder. Lucid signaling becomes problematic (signaling *what*?). Stimulus incorporation becomes a reflex, not an experience. Therapy becomes purely narrative work, not uncovering hidden experience.
          *   *What must be abandoned?* The claim that dreams happen *during* sleep in a phenomenological sense. The "time" of the dream.
      *   *Evidence Weight:*
          *   *Lucid Signals:* Strongest against strong skepticism. If I count 1-2-3 with eye movements while in REM, *something* is happening concurrently.
          *   *Stimulus Incorporation:* Strong support for concurrent processing, but compatible with last-second construction.
          *   *Therapy:* Compatible with either. The *meaning* matters more than the *ontological status*.

  5.  **Drafting Task 3: Internal Consistency:**

      *   *Research Context:* Treats dreams as physiological events (Realism). "REM sleep is when dreaming happens."
      *   *Clinical Context:* Treats dreams as narratives/texts (Constructivism). "What does this story tell us?"
      *   *Inconsistency:* Researchers get annoyed when patients say "I don't dream," but clinicians accept it as repression or lack of recall. Researchers assume time compression is real; clinicians might treat it as symbolic.
      *   *Resolution:* Pragmatic pluralism. They switch ontologies based on utility.

  6.  **Drafting Task 4: Epistemic Status:**

      *   Not pure introspection (too unreliable).
      *   Not pure fiction (constrained by physiology).
      *   *Verdict:* "Constrained Reconstruction." It's testimony about a mental event that is inherently unstable.

  7.  **Refining and Polishing (Self-Correction during drafting):**

