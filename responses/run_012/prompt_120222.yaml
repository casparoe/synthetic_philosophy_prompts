answer: |-
  # The Marker Review Protocol (MRP) v1.0
  **To:** Staff Historian, Review Subcommittee
  **From:** Chair, State Historical Marker Commission
  **Subject:** Decision Procedure for Application Triage and Contested Review

  ## Purpose
  This protocol replaces ad hoc judgment with a structured inquiry. It does not define "historically accurate" as a static truth but as a responsible relationship between evidence, memory, and public space. It distinguishes between **falsification** (evidence contradicts claim) and **silence** (evidence is absent). It distinguishes between **events** (what happened) and **meanings** (what a community holds to be true about itself).

  ## Part I: Triage (20 Minutes)
  *Conducted by Staff Historian. Goal: Filter administrative non-starters.*

  1.  **Jurisdiction & Safety:** Is the site within state bounds? Is the physical location safe for public visitation?
      *   *Fail:* Return application.
  2.  **Completeness:** Does the application include text, map, sponsor info, and stated evidence sources?
      *   *Fail:* Request deficiency notice.
  3.  **Hate/Exclusion:** Does the text explicitly demean a protected class or glorify violence against civilians?
      *   *Fail:* Immediate rejection.
  4.  **Claim Type Identification:** Tag the primary claim:
      *   *Type A (Event):* "X happened here on Y date." (Empirical)
      *   *Type B (Presence):* "X community existed here." (Ontological)
      *   *Type C (Meaning):* "This site signifies X to Y people." (Interpretive)
      *   *Note:* Type A requires the highest evidentiary bar. Type B and C rely more heavily on community standing.

  ## Part II: Contested Review (60 Minutes)
  *Conducted by Subcommittee. Goal: Evaluate evidence and standing.*

  ### Step 1: The Evidence Matrix
  *Do not ask "Is it proven?" Ask "What kind of proof is this?"*

  **Q1: Is there positive documentary evidence contradicting the claim?**
  *   **Yes:** (e.g., a deed proving the land was empty when the claim says it was settled).
      *   *Action:* **STOP.** Reject "Assert" language. Proceed to Step 4 (Attribution) only if the *memory itself* is historically significant.
  *   **No:** Proceed to Q2.

  **Q2: Is the absence of documents consistent with the claimants' historical power status?**
  *   *Context:* Enslaved people, indigenous groups, and the poor rarely generated deeds, diaries, or official records.
  *   **Yes:** (e.g., No deed for an indigenous settlement).
      *   *Action:* Treat silence as **Neutral**, not Negative. Do not penalize the application for archival silence.
  *   **No:** (e.g., A wealthy merchant claims to have built a house but no tax record exists).
      *   *Action:* Treat silence as **Negative**.

  **Q3: Is the oral tradition in "Active Circulation" or "Stored"?**
  *   *Active:* Told at funerals, reunions, religious services within the last 20 years.
  *   *Stored:* Recovered from a single interview in 1970, never retold.
  *   **Action:** "Active" traditions carry weight equal to weak documentary evidence for Type B (Presence) claims. "Stored" traditions require corroboration.

  ### Step 2: The Marker Function Test
  *Avoid the "Laundered Assertion" Trap.*

  **Q4: What is the marker doing?**
  *   **Assert:** "The Battle of X occurred here." (Implies Commission verifies truth).
  *   **Commemorate:** "In honor of those who fell." (Implies Commission verifies significance, not tactics).
  *   **Attribute:** "Tradition holds that X occurred here." (Implies Commission verifies the *existence of the tradition*, not the event).
  *   **Trap Warning:** Do not use Attribution to sneak in a Type A (Event) claim you are unwilling to Assert. If you write "Legend says a murder happened here," you are still putting "murder" on a state plaque.
  *   **Rule:** If the claim is Type A (Event), you must either **Assert** (evidence supports) or **Reject**. Do not **Attribute** unless the *persistence of the legend* is the actual historical story.

  ### Step 3: Standing and Factionalism
  *Who speaks for the community?*

  **Q5: Is there a recognized governing body or cultural steward?**
  *   **Yes:** (e.g., Tribal council, established historical society). Their objection carries veto power on Type B/C claims.
  *   **No:** Proceed to Q6.

  **Q6: If factions disagree, who holds the "Practice"?**
  *   *Test:* Which group actively maintains the site, holds the ceremonies, or cares for the graves?
  *   **Action:** Standing is granted to the group performing the **labor of memory**, not merely the group claiming genetic descent or political representation.
  *   **Tie-Breaker:** If labor is equal, the faction seeking *inclusion* overrides the faction seeking *exclusion*.

  ### Step 3: The Hand-Off Point
  *Where the Historian stops and the Commission begins.*

  *   **Historian's Domain:** Determining if evidence contradicts claim (Q1) and if silence is explicable (Q2).
  *   **Commission's Domain:** Deciding if a story *deserves* a marker when evidence is ambiguous (Q3) and choosing between competing valid narratives (scarce public attention).
  *   **Procedure:** If Q1 is "No" and Q2 is "Yes" (Silence is explicable), the Historian recommends **Approval**. If the Commission wishes to reject, they must vote on **Values**, not Accuracy.

  ---

  ## Part III: Application of Protocol to Pending Cases

  ### Case 1: The Pre-Deed Settlement
  *Claim:* Descendant group asserts settlement 30 years prior to first land deed.
  *Evidence:* Unbroken oral account; one ambiguous church record (mentions "families near the creek," no names).
  *Objection:* None formally filed, but standard review notes lack of deeds.

  **Protocol Run:**
  1.  **Claim Type:** Type B (Presence) mixed with Type A (Date).
  2.  **Q1 (Contradiction):** No documents prove they *weren't* there.
  3.  **Q2 (Silence/Power):** Yes. The group is a marginalized descendant community. Absence of deeds is consistent with historical exclusion from property law. Silence is **Neutral**.
  4.  **Q3 (Circulation):** Oral account is unbroken (Active).
  5.  **Q4 (Function):** Cannot **Assert** the specific date empirically. Can **Assert** the Presence ("A community resided here..."). Can **Attribute** the specific timeline ("Oral history dates this to 1820...").
  6.  **Q5 (Standing):** Descendant group is the steward.

  **Recommendation:** **APPROVE.**
  **Wording Constraint:** Text must read: *"Site of the [Name] Settlement. Oral tradition and church records indicate a community established here c. 1820, preceding the 1850 land deed."*
  **Note to Chair:** This recommendation contradicts your usual stance on tradition-based dating. However, under MRP Q2, the lack of a deed is evidence of their marginalization, not evidence of their absence. To reject this is to enforce the document bias the protocol is designed to correct. The oral tradition is "Active," satisfying Q3.

  ### Case 2: The Manufactured Founder
  *Claim:* Town founder performed heroic act justifying land claim.
  *Evidence:* 1880s promotional biography. Staff historian finds contemporaneous letters suggesting the act was fabricated to displace the indigenous community now objecting.
  *Objection:* Indigenous community states the story erases their prior occupancy.

  **Protocol Run:**
  1.  **Claim Type:** Type A (Event).
  2.  **Q1 (Contradiction):** **Yes.** Contemporaneous letters constitute positive documentary evidence *against* the claim.
  3.  **Q2 (Silence):** N/A (Evidence exists).
  4.  **Q4 (Function):** Cannot **Assert**. Cannot **Attribute** unless the marker is *about* the myth-making.
  5.  **Q5 (Standing):** Indigenous community holds stewardship of the pre-settlement history.

  **Recommendation:** **REJECT CURRENT TEXT.**
  **Path Forward:** Invite applicants to resubmit. New text must either:
  1.  **Commemorate** the town's founding without the specific heroic lie.
  2.  **Assert** the reality: "[Name] established the town in 1880. Promotional histories claimed [Act], a narrative used to secure land title."
  **Note:** This is a hard stop. Q1 triggers a rejection of the "Assert" function.

  ### Case 3: The Burial Ground vs. The Battle
  *Claim:* Unmarked burial ground.
  *Evidence:* Oral tradition (local Black church). County History (1910) calls it a "skirmish site." Official record silent.
  *Objection:* County Historical Society insists on "Battle" designation based on 1910 text.

  **Protocol Run:**
  1.  **Claim Type:** Type B (Presence/Sacred) vs. Type A (Event/Battle).
  2.  **Q1 (Contradiction):** No. 1910 text is not contemporaneous evidence of a battle; it is secondary interpretation.
  3.  **Q2 (Silence/Power):** Yes. Burials of marginalized groups were often excluded from official records. Silence is **Neutral** regarding burial, **Suspicious** regarding battle (wars were usually recorded).
  4.  **Q3 (Circulation):** Church oral tradition is Active. 1910 book is Stored.
  5.  **Q4 (Function):** **Commemorate** the burial. **Attribute** the battle claim only if necessary for context.
  6.  **Q5 (Standing/Faction):** Church performs labor of memory (decorations, prayers). County Society performs labor of archives.
      *   *Tie-Breaker:* The faction seeking *inclusion* of the dead (Church) overrides the faction seeking *classification* of the event (County).

  **Recommendation:** **APPROVE AS BURIAL GROUND.**
  **Wording:** *"Unmarked Burial Ground. Local tradition identifies this as a resting place for [Community]. A 1910 county history described this site as a skirmish location; no official battle records exist."*
  **Note:** This prioritizes the sacred (Burial) over the political (Battle) when evidence is equal (silence).

  ---

  ## Part IV: Limitations and Ugly Truths

  This procedure cannot solve every problem. It is a tool for consistency, not a machine for justice. Staff and Commission must acknowledge the following:

  1.  **The "Both Sides" Trap:** Sometimes two factions have equal standing and equal evidence (e.g., two branches of a family disagreeing on a birthplace). The procedure identifies the tie; it does not break it. In these cases, the Commission must vote on **Scarcity**. If we cannot mark both without confusing the public, we may have to mark neither.
  2.  **The Compromise of Wording:** There are cases where the truth is too complex for a bronze plaque. We may approve a marker that is technically vague ("Site of early settlement") to allow conflicting communities to share the space. This is a failure of the medium, not the process. Accept it.
  3.  **The Refusal to Mark:** There are sites where the only historically accurate action is to leave the ground unmarked. If marking a site invites desecration, or if the story requires a museum context to be understood without harm, the procedure must allow for a **Recommendation of No Marker**.
  4.  **The Chair's Burden:** This protocol forces you to approve claims you personally doubt (see Case 1). It shifts the burden from "Prove it to me" to "Explain why the evidence is silent." If you cannot vote for Case 1 after this review, you are not voting on accuracy; you are voting on epistemology. You must recuse yourself or acknowledge that you are prioritizing documentary privilege over community ontology.

  **Final Instruction:**
  Run Triage on all incoming apps. Use the Contested Review for any application receiving an objection or flagged by Staff as Type A with weak docs. Bring the "Hand-Off" cases to the full Commission with a clear label: *"Historian finds no contradiction; Commission must decide on Value."* Do not let the Commission hide behind "Accuracy" when they actually mean "Priority."
