prompt: |-
  I chair the state historical marker commission for our state historical society. We review roughly thirty applications a year and vote at monthly hearings; our plaques stay up for decades, so a bad one is at once a permanent embarrassment and a public insult. Our enabling language says markers must be "historically accurate," a phrase no one has ever defined. In the past two years we approved a marker that a descendant community says erases them, and rejected one that a neighborhood group says we dismissed only because its claim rested on oral tradition rather than documents. I want a decision procedure my staff historian and review subcommittee can actually run before each hearing — twenty minutes at triage, an hour for a contested application — working from what applicants submit plus digitized records and local historical society files, since we have no research budget and no power to compel anything.

  The procedure has to settle what our arguments keep circling: when a community's memory and the documentary record conflict, it is not obvious which should give way, because the two answer to different things — the record to evidence, the memory to obligation, identity, and the present needs of those who hold it. So do not hand me a rule that simply ranks the two. Build the procedure out of the distinctions that do the work: between a claim about an event and a claim about what a community is; between what a culture keeps in active circulation and what it merely stores, and which of the two a plaque is doing; between the three things a marker text can do — assert, commemorate, and attribute ("the X community holds that...") — and the trap by which attribution becomes a laundered assertion. It must treat the absence of documents as evidence about who had the power to write things down rather than as automatic refutation, without letting that license invention, and it must keep "we found evidence against this" separate from "we found nothing either way." It should also say who has standing to speak for a community, and what to do when two factions of the same community both claim to.

  Give me the questions in order, what counts as a sufficient answer to each, the points where the procedure stops with a no, and the points where it hands the decision to the commission because the question is about whose story deserves scarce public attention rather than about what happened. Then run it on three applications: (1) a descendant group seeking a marker asserting that their settlement predates the first land deed by thirty years, on the strength of an unbroken oral account and one ambiguous church record; (2) a town's application commemorating a founder whose story, as our staff historian reads the 1880s promotional history it rests on, appears to have been manufactured to justify taking land from the community that now objects; (3) a marker for an unmarked burial ground known only from oral tradition, where the official record is silent and a county history calls the site a battle. I am the commissioner who usually votes against tradition-based claims, so at least one of these should come out against my instincts; say so plainly. Finish with what the procedure cannot do, including the cases where the honest answer is an ugly compromise or a refusal to mark at all.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **Role:** Chair of a State Historical Marker Commission.
      *   **Context:** 30 apps/year, monthly hearings, permanent plaques (high stakes), undefined "historically accurate" mandate, no research budget, no subpoena power.
      *   **Problem:** Conflict between documentary record and community memory/oral tradition. Past controversies: one erased a descendant community, one dismissed oral tradition.
      *   **Task:** Create a decision procedure (triage + contested review) for staff/subcommittee.
      *   **Key Philosophical Constraints:**
          *   Do *not* simply rank documents over memory or vice versa.
          *   Distinguish between *event claims* vs. *identity claims*.
          *   Distinguish between *active circulation* vs. *stored memory*.
          *   Distinguish marker functions: *Assert, Commemorate, Attribute*.
          *   Avoid "laundered assertion" via attribution.
          *   Treat absence of documents as evidence of power dynamics, not just refutation.
          *   Distinguish "evidence against" vs. "no evidence either way."
          *   Define standing for community representation (including factions).
          *   Identify stop points (No) vs. hand-off points (Commission decision on values).
      *   **Application:** Run the procedure on three specific cases.
      *   **Constraint:** At least one outcome must go against the Chair's usual instinct (voting against tradition-based claims).
      *   **Conclusion:** Limitations of the procedure (ugly compromises, refusals).

  2.  **Deconstruct the Philosophical Core:**

      *   *Event vs. Identity:* Did X happen on Y date? (Empirical) vs. We are the people of X place. (Ontological/Social). Markers often conflate these.
      *   *Active vs. Stored:* Is this story told at dinners/funerals (active) or written in a ledger no one reads (stored)? Markers should reflect active cultural significance, not just archival existence.
      *   *Assert/Commemorate/Attribute:*
          *   Assert: "X happened here." (Requires high evidentiary bar).
          *   Commemorate: "We honor X." (Requires community consensus/significance).
          *   Attribute: "Tradition holds X." (Risky: can imply the commission doubts it while still printing it, or can legitimize a falsehood as 'belief' without context).
      *   *Silence as Evidence:* No deed doesn't mean no presence; it might mean exclusion from legal systems.
      *   *Standing:* Who speaks for "the community"? Elders? Orgs? Factions?

  3.  **Drafting the Procedure (The "Algorithm"):**

      *   *Structure:* Triage (20 mins) -> Deep Dive (60 mins) -> Decision Matrix.
      *   *Phase 1: Triage (The "Hard No" Filters).* Safety, hate speech, jurisdiction, basic completeness.
      *   *Phase 2: Evidentiary & Ontological Review (The Core).*
          *   Q1: Claim Type (Event vs. Meaning).
          *   Q2: Evidence Status (Document vs. Oral vs. Silence).
          *   Q3: Power Dynamics (Why the silence?).
          *   Q4: Marker Function (Assert vs. Attribute).
          *   Q5: Standing (Who speaks?).
      *   *Phase 3: The Hand-off.* Where does the historian stop and the politician (Commissioner) start? (Value judgments on scarce space).

  4.  **Refining the Distinctions (incorporating prompt requirements):**

      *   *Laundered Assertion:* If we write "Legend says X," does it imply X is false? Or does it protect us if X is debunked later? The procedure needs to flag when attribution is used to sneak in a contested fact without owning it.
      *   *Absence of Documents:* Must explicitly ask: "Is the absence of documentation consistent with the social status of the claimants?"
      *   *Standing:* Need a test for factionalism. (e.g., Is the objection based on procedure or substance? Is one group more connected to the *practice* of the memory?)

  5.  **Developing the Three Cases:**

      *   *Case 1 (Settlement Pre-dates Deed):* Oral account + ambiguous church record.
          *   *Analysis:* Event claim (date) vs. Identity claim (presence). Silence of deed = power dynamic (indigenous/minority exclusion?).
          *   *Outcome:* Needs to challenge the Chair's instinct. Chair usually votes *against* tradition. So, this one should probably be *approved* (with specific wording) to satisfy the prompt's constraint.
      *   *Case 2 (Founder Myth):* 1880s promotional history vs. modern objection.
          *   *Analysis:* Event claim (founder did X) is likely false (manufactured). Identity claim (town identity) is real but harmful.
          *   *Outcome:* Reject the "Assert" version. Maybe allow a "Commemorate/Context" version? Or hard No on the specific claim. Let's make it a "No" on the current text, requiring rewrite.
      *   *Case 3 (Burial Ground/Battle):* Oral tradition (burial) vs. County History (battle). Official record silent.
          *   *Analysis:* Sacred site vs. Military history. Silence = erasure.
          *   *Outcome:* Approve as Burial Ground (Attribution/Commendation) rather than Battle.

  6.  **Writing the Procedure (Iterative refinement):**

      *   *Tone:* Bureaucratic but philosophically rigorous. Practical for staff.
      *   *Formatting:* Clear steps, decision trees.
      *   *Specific focus:* Ensure the "Assert vs. Attribute" trap is highlighted.

  7.  **Running the Cases:**

      *   *Case 1:* Apply the "Power Dynamics" test. The lack of a deed is expected for this group. The oral tradition is "active." *Result:* Approve with "Attribute" wording or modified "Assert" acknowledging the evidence type. *Self-Correction:* To truly go against the Chair's instinct (who rejects tradition), the procedure must validate the oral tradition as sufficient for *some* form of marker, perhaps shifting from "Assert" to "Commemorate." Let's make it an Approval with specific wording that validates the memory without making a legally defeasible claim.
      *   *Case 2:* The evidence is *against* the claim (promotional fluff). This is a "Evidence Against" case, not "No Evidence." *Result:* Reject current text.
      *   *Case 3:* Silence in official record + Oral tradition. *Result:* Approve, prioritizing the burial (sacred) over the battle (political).

  8.  **Final Review against Constraints:**

      *   20 min triage / 60 min deep dive? Yes, structure reflects this.
      *   No simple ranking of doc vs. memory? Yes, the "Power Dynamics" question handles this.
      *   Assert/Comm/Attribute distinction? Yes, built into the wording phase.
      *   Standing defined? Yes.
      *   Chair's instinct challenged? Yes, Case 1 will be the pivot.
      *   Limitations section? Yes.

  9.  **Drafting the Content (Mental Check of the "Laundered Assertion"):**
      *   *Trap:* "Local legend says X happened."
      *   *Fix:* If the commission isn't willing to assert X, don't put X on the stone unless the *point* of the marker is the legend itself.
      *   *Refinement:* The procedure must force a choice: Are we marking the *event* or the *memory of the event*?

  10. **Final Polish:** Ensure the voice is appropriate for a Commission Chair addressing staff/subcommittee. Professional, direct, ethically weighty. (Self-Correction: Make sure the "Standing" section addresses the factionalism issue clearly).

  *(Self-Correction during drafting Case 1)*: The prompt says the Chair usually votes *against* tradition-based claims. I need to make sure Case 1 comes out *in favor* of the tradition-based claim to satisfy "at least one of these should come out against my instincts."
  *Logic:* The procedure treats document absence as power evidence. Therefore, the lack of a deed supports the oral history of a marginalized group. The procedure forces an approval (perhaps with nuanced wording).

  *(Self-Correction during drafting Case 2)*: This is a "Evidence Against" scenario. The procedure should flag this as a hard stop for an "Assert" claim.

  *(Self-Correction during drafting Case 3)*: This is "No Evidence Either Way" (official silence). The procedure prioritizes sacred/ burial over battle.

