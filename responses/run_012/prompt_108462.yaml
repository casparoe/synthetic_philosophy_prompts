answer: |-
  Your hunch is correct: splitting the two directions of Leibniz's Law is the essential first move, because conflating them allows participants to defend the uncontroversial direction while pretending they've solved the controversial one.

  **The Reasoning:** If you don't separate "Indiscernibility of Identicals" (same thing → same properties) from "Identity of Indiscernibles" (same properties → same thing), your scientists will latch onto the first one—which is logically trivial—and treat any challenge to the second as a denial of logic itself. By isolating the second principle as the specific claim under test, you turn the session from a debate about logic into a debate about metaphysics.

  **Session Plan (40 Minutes)**

  **1. The Split (0–5 mins)**
  Open with your twin story to ground the intuition, then immediately write the two principles on a napkin or state them clearly without visual aid.
  *   **Principle 1:** If X and Y are the same object, they share all properties. (Tell them: "Nobody fights this.")
  *   **Principle 2:** If X and Y share all properties, they are the same object. (Tell them: "This is your cousin's claim, and this is what we are testing.")
  *   **Defuse Premature Closure:** When someone says Principle 2 is "obviously true," ask them to hold that judgment until the end. When someone says it's "obviously false," ask them to define what property could possibly differ.

  **2. The Carrier Example (5–20 mins)**
  Start with the twins, then migrate to the spheres.
  *   **Why Twins First:** They are relatable, but they fail the test because they occupy different spaces and have different histories (one drank coffee, the other didn't). Use this to show that *spatial position* is usually the discernible property.
  *   **Why Spheres Next:** Introduce Black's universe only after establishing that space is the usual differentiator. The spheres must be described as having identical intrinsic properties (mass, color, temperature) and identical relational properties (each is two miles from the other).
  *   **What the Carrier Needs:** The example must eliminate spatial location as an intrinsic property. If the universe is symmetric, "being on the left" isn't a valid property because left/right are relative to an observer who doesn't exist in the empty universe.

  **3. The "Label Them A and B" Objection (20–30 mins)**
  This will surface the moment you describe the spheres. Do not shut it down; use it to expose the metaphysical knot.
  *   **Where it Surfaces:** When you say "There are two spheres," someone will say, "Well, *this* one is A and *that* one is B, so they differ by name."
  *   **How to Head It Off:** Ask: "Does naming them make them different, or do they have to be different *before* you can name them?" Push them to find a fact about the *universe*, not a fact about their *language*, that distinguishes the spheres. If the only difference is "A is A and B is B," they are smuggling in the conclusion.
  *   **Epistemic vs. Ontic:** When someone says "We can't tell them apart," correct them: "The thought experiment isn't about our vision; it's about reality. Is there a difference *in the universe*, or just in our heads?"

  **4. Haecceity and "Thisness" (30–35 mins)**
  This is the endgame, not the start. Introduce it only after they've exhausted physical properties.
  *   **Placement:** Bring this up when they insist the spheres are distinct but can't say why.
  *   **How to Frame It:** Don't use the word "haecceity." Ask: "If you strip away every quality, relation, and location, is there any leftover 'stuff' that makes this sphere *this* one?"
  *   **The Choice:** Force them to choose: either the spheres are actually one object (Principle 2 is true), or there is a "primitive thisness" beyond properties (Principle 2 is false). This shows the cost of their intuition.

  **5. The Cut and Close (35–40 mins)**
  *   **Cut the Quantum Mechanics:** Do not bring up identical particles. It shifts the debate from metaphysics to physical interpretation (QM particles lack individuality in a way that depends on statistical counting, not spatial symmetry), which will confuse the philosophical point about individuation.
  *   **Closing Question:** Do not ask "Who won?" Ask: **"If you burned away every property of yourself—your memories, your atoms, your location—is there anything left that makes you *you*?"**
      *   If they say "Yes," they reject the Principle of Identity of Indiscernibles (and accept haecceity).
      *   If they say "No," they accept the Principle (and must explain why the spheres are one object).
      *   This tests whether they grasp the distinction between *properties* and *substratum*, rather than just reciting the sphere story.
