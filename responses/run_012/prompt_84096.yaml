answer: |-
  Here is a 90-minute seminar design. It is engineered to force the tie you need while keeping the students physically engaged in the construction of the theories.

  ### **Activity Title: The Black Box Grant**

  **Room Setup:**
  *   **Front:** Projector screen (The "Black Box" interface). Whiteboard divided into two halves.
  *   **Left Side:** Team A (6 students). "The Continuum Group."
  *   **Right Side:** Team B (6 students). "The Discrete Group."
  *   **Center:** Grant Panel (4 students). Large table, printed Rubric Cards, "Funding Certificate" (only one copy).
  *   **Materials:** Markers, large paper sheets for theory diagrams, printed Rubric Cards (one set per Panelist), printed Data Sheets.

  ---

  ### **Part 1: The Secret (Instructor Only)**

  **The Black Box Mechanism:**
  You are the Black Box. You will project inputs and outputs.
  *   **Domain:** Integers only ($\mathbb{Z}$). The device *cannot* accept decimals (this is a hard rule of the game).
  *   **Function:** $Output = 1$ if $Input \ge 5$, else $0$.
  *   **The Guarantee:** This step function can be modeled perfectly by both continuous mechanics (a lever tipping at a threshold) and discrete logic (a counter flipping a switch at 5). Because the domain is restricted to integers, there is **no input** the students can generate where the two ontologies produce different outputs. They are empirically equivalent within the game's universe.

  **The Constraint:**
  *   **Team A** is secretly assigned (via handout) to model the box using **Continuous Physical Quantities** (weights, fluid levels, levers, distances).
  *   **Team B** is secretly assigned (via handout) to model the box using **Discrete States** (switches, bits, counters, logic gates).
  *   *Instruction to Teams:* "You must propose a physical mechanism inside the box. You cannot just give a formula. You must draw the guts."

  ---

  ### **Part 2: The Timeline (90 Minutes)**

  #### **0:00 – 0:05 | Introduction & Roles**
  *   **Do not say:** "Underdetermination," "Holism," "Truth."
  *   **Say:** "Science is expensive. We have money to fund one theory about this device. We cannot open the device. We have to judge based on performance and plausibility."
  *   **Distribute Roles:**
      *   **Team A (Continuum):** 6 students.
      *   **Team B (Discrete):** 6 students.
      *   **Grant Panel:** 4 students (The decision makers).
  *   **Hand out Rubric Cards** to the Panel. (See below).

  #### **0:05 – 0:20 | Data Collection (The Observation Phase)**
  *   **Action:** Teams shout out integer inputs. You project the output.
  *   **Rule:** You (Instructor) act as the Device. If they ask "Can I input 4.5?" you say "Error: Invalid Token." (This enforces the integer domain, securing the tie).
  *   **Goal:** They need enough points to see the step at 5.
  *   **Sample Data to generate:**
      *   Input: 0, 1, 2, 3, 4 $\rightarrow$ Output: 0
      *   Input: 5, 6, 7, 10, 100 $\rightarrow$ Output: 1
      *   Input: -5, -10 $\rightarrow$ Output: 0
  *   **Stop:** Once both teams nod they have the pattern.

  #### **0:20 – 0:40 | Theory Construction (The Build)**
  *   **Action:** Teams go to their whiteboard sections. They must draw the *internal mechanism*.
  *   **Constraint Check:** Walk around. If Team A draws a "counter," tell them "Remember your constraint: Continuous quantities." If Team B draws a "lever," tell them "Remember: Discrete states."
  *   **Deliverable:** A diagram showing the "Guts" and a written prediction for the **Held-Out Round**.
  *   **Instructor Check:** Before moving on, glance at their Held-Out predictions.
      *   *If one team is wrong:* Send them back. "Your theory doesn't fit the known data. Revise." (This ensures both fit the data perfectly before the tie).
      *   *If both are right:* Proceed.

  #### **0:40 – 0:50 | The Held-Out Prediction Round**
  *   **Action:** Panel presents 3 new inputs (e.g., 50, 5, 4).
  *   **Process:** Teams write predictions privately. Reveal simultaneously.
  *   **Outcome:** Both teams must get 3/3. (Since the math is identical, they will).
  *   **Score:** Panel awards max points for **Fit** and **Novel Prediction** on the Rubric.

  #### **0:50 – 1:05 | The Grant Panel (The Tie)**
  *   **Action:** Panel interviews the teams.
      *   *Question 1:* "How many moving parts?" (Team A: 1 lever. Team B: 1 switch). **Tie on Simplicity.**
      *   *Question 2:* "Does this fit with other physics?" (Team A: "Yes, classical mechanics." Team B: "Yes, digital logic"). **Tie on Coherence.**
  *   **The Conflict:** The Panel must fund *exactly one*.
  *   **Rule:** To fund Team A, you must sign a statement that Team B's mechanism is *false* (not just less useful, but factually wrong about the inside).
  *   **Outcome:** The Panel will struggle. They will try to break the tie. Let them argue for 10 minutes. They will likely fail to find a rational reason to pick one over the other.
  *   **Instructor Note:** If they pick one arbitrarily, ask: "Did you choose based on evidence, or did you flip a coin?" Record the answer on the board.

  #### **1:05 – 1:15 | The Anomaly & The Auxiliary (Duhem-Quine)**
  *   **Action:** You announce a new data point.
  *   **Input:** 4. **Output:** 1. (This contradicts the theory: $4 < 5$, should be 0).
  *   **Crisis:** Both theories are technically refuted.
  *   **Task:** Teams have 3 minutes to save their theory using an **Auxiliary Assumption**.
  *   **Constraint:** The Auxiliary must be *simple* and *independently testable* (e.g., "There is a stuck pixel," "There is friction in the lever").
  *   **Team A Save:** "The lever has rust at the fulcrum, causing it to tip early at input 4."
  *   **Team B Save:** "The switch has a wiring fault, closing the circuit at count 4."
  *   **Verification:** You (Nature) confirm: "Yes, independent test confirms rust/wiring fault."
  *   **Result:** Both theories survive. The tie remains.

  #### **1:15 – 1:30 | The Debrief (The Reveal)**
  *   **Now** you use the forbidden words.
  *   **Map the Moments:**
      1.  **The Tie (0:50):** This is **Underdetermination of Theory by Data**. The data (inputs/outputs) was insufficient to distinguish the ontology (guts), even when fit, simplicity, and prediction were equal.
      2.  **The Anomaly (1:05):** This is **Duhem-Quine Holism**. A refutation didn't kill the theory because they could adjust an auxiliary assumption (the rust/fault) to absorb the blow.
  *   **Key Distinction:** Ask the students: "Did the Auxiliary round solve the Underdetermination?"
      *   *Answer:* No. Both saved themselves. The choice between Gear vs. Chip is still unresolved. Holism explains why theories *survive*; Underdetermination explains why we can't *choose* between survivors.
  *   **Handle the Objections:**
      *   *"It's just verbal."* (If they agree on all observations, does the difference matter?)
          *   **Response:** Ask Team A: "If we open the box and find a chip, was your theory true?" (No). "Does it matter?" (Yes, because we want to know what the world *is*, not just predict inputs).
      *   *"Just wait for more data."* (Settleable-later vs. Never-settleable).
          *   **Response:** Remind them of the Domain Rule (Integers Only). In this game, *no further data is possible* that distinguishes them. In real science, some rivals (like Many-Worlds vs. Copenhagen) might be this way permanently.

  ---

  ### **Part 3: The Rubric (Print on Cards)**

  **Grant Panel Scoring Sheet**
  *Total Budget: 20 Points per Theory. Max Score Wins Funding.*

  1.  **Empirical Fit (0-5 pts):** Does it match all past data? (Must be 5 to qualify).
  2.  **Novel Prediction (0-5 pts):** Did it predict the Held-Out round correctly?
  3.  **Simplicity (0-5 pts):** Count the distinct physical entities postulated. (Fewer = Higher Score).
  4.  **Coherence (0-5 pts):** Does the mechanism contradict established background knowledge?
  5.  **Tie-Breaker Clause:** *If scores are equal, the Panel must vote based on 'Ontological Preference'. You must write down WHY you believe one 'stuff' (continuous vs discrete) is more real than the other.*

  ---

  ### **Part 4: Honesty Check (For the Instructor)**

  **1. What predictably goes wrong?**
  *   **The "Occam's Razor" Rebellion:** One student on the Panel will insist the Continuous theory is "simpler" (or vice versa) and refuse to acknowledge the tie. They will assign 5 points to one and 3 to the other arbitrarily.
      *   **Fix:** During the Debrief, project their scores. Ask: "Was that difference in simplicity *in the math*, or was it a personal preference for gears over chips?" Force them to admit the score was subjective. This *helps* your point (that virtues like simplicity are not algorithmic).
  *   **The "It Doesn't Matter" Defense:** A student will argue that if the outputs are the same, the theories are the same.
      *   **Fix:** Remind them of the Funding Rule. "If I fund you, I am building a factory based on your blueprint. If you said Gears and I build Chips, the factory breaks. The ontology matters for intervention, not just prediction."

  **2. What feature can this activity NOT reproduce?**
  *   **The Cost of Theory Change.** In this game, changing an auxiliary assumption (adding "rust") took 3 minutes and cost nothing. In real science, adding an auxiliary (like "Neptune exists" or "Dark Matter exists") can take decades, require new telescopes, and cost billions.
      *   **What to say in Debrief:** "Today, saving your theory was cheap. In history, saving a theory often requires inventing new mathematics or building new machines. That *cost* is often what kills a theory, not just logic. We didn't feel that pain today."
  *   **The "Rigged" Nature.** You guaranteed the tie by restricting the inputs (Integers Only). In real science, Nature doesn't respect our domain restrictions.
      *   **What to say in Debrief:** "I protected you from finding a difference by banning decimal inputs. In the real world, someone might find the 'decimal input' (a crucial experiment) tomorrow. Underdetermination is often temporary, but sometimes—like with your Gears vs. Chips—it might be permanent within our observational limits."

  ### **Instructor Prep Checklist:**
  1.  **Print Rubrics:** 4 copies for the Panel.
  2.  **Print Role Cards:** 6 for Team A (Constraint: Continuous), 6 for Team B (Constraint: Discrete).
  3.  **Prepare the "Truth":** Write the function $f(x)$ on a sealed envelope. Open it only if they accuse you of cheating.
  4.  **Whiteboard:** Pre-draw the "Box" outline in the center.
  5.  **Funding Certificate:** Make it look official. "Department of Science Grant #001."

  This structure forces the empirical equivalence physically, makes the tie unavoidable via the domain restriction, and isolates the Duhem-Quine moment so you can distinguish it from the Underdetermination problem in the final minutes.
