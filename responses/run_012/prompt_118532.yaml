answer: |-
  The collision between I.J. Good's theorem on the value of information and Sophocles' *Oedipus Rex* creates a friction that illuminates both the limits of decision theory and the specific horror of the tragedy. Good's theorem posits that for a rational agent maximizing expected utility, acquiring free information is never detrimental. Even if the news is bad, the agent can choose to act as if they hadn't heard it; thus, the option to update one's beliefs always has a non-negative expected value. On the surface, Oedipus appears to be a devastating counterexample. He relentlessly pursues the truth regarding the murder of Laius and his own parentage, and the acquisition of this information leads directly to his ruin, the suicide of his wife-mother, and his own exile and blinding. If information has value, Oedipus has paid for it with everything.

  However, to dismiss the play as a mere refutation of Bayesian rationality is to misunderstand the structural mechanics of the tragedy. *Oedipus Rex* does not prove Good's theorem wrong; rather, it dramatizes the catastrophic failure of the theorem's underlying assumptions when applied to a human subject whose identity is the very variable being investigated. The play respects the logic of the theorem enough to show why Oedipus *must* seek the truth, even as it demonstrates why the theorem's conditions for safety cannot be met. The tragedy arises not because information is inherently destructive, but because Oedipus is not a stable agent observing an external world. He is the object of his own inquiry.

  Good's theorem illuminates Oedipus's insistence on knowing by validating his rationality within the confines of his initial knowledge. At the play's opening, Oedipus acts as a perfect expected-utility maximizer. Thebes is dying; the oracle states the cure is to find the killer; therefore, the investigation has immense positive expected value. When Tiresias accuses him, Oedipus rejects the information, not because he fears the truth, but because he calculates that the witness is unreliable and politically motivated. This is rational filtering. When the Corinthian messenger arrives to relieve Oedipus's fear of killing his father, the information appears to have high positive value: it seemingly clears him of one crime while threatening another. Oedipus pursues this thread because, according to his current utility function, ruling Thebes as a legitimate king and savior is the highest good. The theorem explains the drive: as long as Oedipus believes he is distinct from the criminal he hunts, more information can only help him optimize his rule. He is not irrational; he is operating with a flawed prior.

  The play resists reduction to decision theory by exposing the assumption that an agent can choose to ignore information. Good's theorem relies on the option to discard data that lowers expected utility. In the structure of the play, this option is systematically removed. Jocasta, perceiving the trajectory of the inquiry, explicitly offers Oedipus the chance to stop. She embodies the "ignore" function of the theorem, pleading with him to let the matter rest for the sake of peace. Oedipus's refusal is often read as hubris, but structurally, it is a recognition that the information has already ceased to be passive. In the world of the play, knowledge is not a tool the agent holds; it is a force that acts upon the agent. Once the investigation reaches a certain critical mass, the social and divine reality of Thebes demands resolution. The plague does not lift for partial truths. The structural convergence of the messenger and the shepherd ensures that the information cannot be un-heard. The theorem assumes a firewall between the data and the self; the play burns that firewall down.

  More profoundly, the play violates the assumption that the agent's preferences and identity remain fixed during the update process. Good's theorem calculates value based on a consistent utility function. Oedipus begins the play with the preferences of a king: preserve the city, maintain power, avoid shame. However, the information he acquires does not merely update his beliefs about the world; it fundamentally rewrites his utility function. Upon learning the truth, the "Oedipus" who values kingship ceases to exist, replaced by an agent who values only expiation and punishment. The new information does not just tell him he made a bad move; it tells him he is the wrong player. In decision theory, the agent is constant. In *Oedipus Rex*, the agent is the variable. The value of information becomes negative because the information destroys the entity that was supposed to receive the value. You cannot maximize utility if the "you" doing the maximizing is annihilated by the calculation.

  Furthermore, the play challenges the assumption that learning does not change the world. In standard decision theory, observing a card does not change the hand. In *Oedipus*, the act of knowing is performative. As long as the truth remains hidden, Oedipus functions as king. The moment the testimony of the shepherd confirms the identity of the infant, the political and spiritual reality of Thebes shifts instantly. The information does not describe a pre-existing state of exile; it enacts it. The structure of the drama relies on this performativity: the revelation scene is not a discovery of fact so much as a transformation of status. Good's theorem treats information as a map; the play treats information as the territory itself.

  This tension contributes a vital, tragic dimension to the philosophical debate on whether ignorance is preferable. A strict reading of Good's theorem suggests ignorance is never preferable if information is free, because optionality is always valuable. *Oedipus Rex* argues that ignorance is preferable only when the truth is ontologically incompatible with the agent's existence. It is not that Oedipus would have been happier remaining ignorant; it is that he would have remained *Oedipus*. The play suggests that there are truths which, by their nature, cannot be integrated into a life. They are not data points to be managed but events to be survived. The preference for ignorance here is not a preference for comfort over discomfort, but a preference for being over non-being.

  Ultimately, *Oedipus Rex* accepts the logic of the theorem only to show that the conditions for its safety are humanly impossible. Oedipus seeks information because he is a rational agent trying to save his city. He is destroyed because he is also the pollution he seeks to cleanse. The theorem holds for an observer standing apart from the system. Oedipus is embedded within the system he tries to solve. The play concludes that while the expected value of information may be non-negative for a god or a machine, for a human being whose identity is contingent on what they do not know, the realized value can be absolute zero. The tragedy is not that Oedipus sought knowledge, but that he was the kind of creature for whom knowledge and existence were mutually exclusive.
