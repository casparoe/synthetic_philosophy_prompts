answer: |-
  Here is a battle plan for a 45-minute session with investigations journalists. They are skeptical, time-poor, and care about *consequences*, not philosophy. Your goal is to move RCP from "statistical semantics" to "source of systemic error."

  ### 1. The Prerequisites: Making it Register
  Before you define the problem, you must establish three conditions. If any of these are missing, the room will treat RCP as academic navel-gazing.

  *   **Consequence:** There must be a decision hanging on the number. (Jail vs. freedom, payout vs. denial, surgery vs. watchful waiting). If it's just a prediction with no action, they won't care.
  *   **Competing Validity:** You must present at least two reference classes that are *both* defensible. If one class is obviously wrong (e.g., "all humans" vs. "35-year-old male smokers"), it's not a problem, it's just bad stats. Both classes need to make sense to a layperson.
  *   **Divergence:** The probabilities generated by the competing classes must differ meaningfully (e.g., 20% risk vs. 60% risk). If the numbers are close, it's noise, not a paradox.

  **Action:** Open the session by stating: *"We are not here to discuss math. We are here to discuss how systems justify decisions about individuals using group data. When the group changes, the justification changes."*

  ### 2. The Anchor Example: Talk Yourself Out of the Medical One
  **Do not use the rare-mutation patient example.** Here is why, and what to use instead.

  **Why the Medical Example Fails Here:**
  1.  **The "Rare" Trap:** You mentioned a "rare mutation." This immediately conflates the Reference Class Problem with the **Small Sample Size Problem**. Your journalists will fixate on "we don't have enough data on the mutation group" rather than "which group is the right one?" RCP is hardest when you have *plenty* of data for all classes.
  2.  **Authority Deference:** Journalists are trained to defer to medical consensus on class definition. They will assume the oncologist has already solved the class selection. You want them to be skeptical of the class selector.
  3.  **Biological Essentialism:** It's too easy to argue the "mutation group" is the *true* biological class. It shuts down the debate.

  **The Better Example: Recidivism/Parole (or Insurance Risk)**
  Stick to the **Recidivism** example you hinted at. It is visceral, data-rich, and fits the "investigations" mandate.
  *   **The Subject:** "John," 35 years old, arrested for non-violent theft, one prior misdemeanor at age 22.
  *   **The Decision:** Parole board must decide if he is "high risk."
  *   **Class A (Broad):** All released prisoners. (Recidivism rate: 50%)
  *   **Class B (Demographic):** All males, 35-40, released in this state. (Recidivism rate: 35%)
  *   **Class C (Offense):** All non-violent theft offenders. (Recidivism rate: 20%)
  *   **Class D (Behavioral):** All offenders with 5+ years crime-free gap. (Recidivism rate: 5%)

  **Why this works:** Every class is defensible. Every class has a large N (no small sample excuse). The risk ranges from 5% to 50%. The *choice* of class determines John's freedom. This forces the journalists to see that the "probability" is a policy choice, not a natural fact.

  ### 3. The Misconceptions & Interception Points
  Your bet is correct, but there is a third hidden one. Here is where they pop up and how to kill them.

  **Misconception 1: "Just use the narrowest class available."**
  *   **When it appears:** Immediately after you present the Recidivism example.
  *   **The Interception (Minute 15):** Don't argue yet. Push the logic to the absurd. Ask: *"What is narrower than Class D?"* Answer: *"John's specific neighborhood."* Then: *"John's specific block."* Then: *"John himself."*
  *   **The Point:** The narrowest class is N=1. The probability is either 0 or 1. If we always choose the narrowest class, probability disappears. We *must* stop at some arbitrary width. Who decides where we stop?

  **Misconception 2: "This is just a small-sample-size issue."**
  *   **When it appears:** When you mention the "mutation" idea or if they doubt the data quality.
  *   **The Interception (Minute 20):** Explicitly state: *"Assume every class I listed has 100,000 people in it. The data is perfect. The conflict remains."*
  *   **The Point:** RCP is ontological (about the nature of the grouping), not epistemic (about our lack of knowledge). It persists even with big data.

  **Misconception 3: "The Algorithm/Expert Picked the Right One."**
  *   **When it appears:** When they ask, "Well, what does the COMPAS model use?"
  *   **The Interception (Minute 25):** Reveal that different models use different classes.
  *   **The Point:** The "black box" doesn't solve the problem; it just hides the class selection behind code. Your job as journalists is to audit the *class*, not just the *output*.

  ### 4. The Sequence (45 Minutes)

  *   **00-05: The Hook.** Show a headline: *"Algorithm Predicts 80% Risk of Re-offense."* Ask: *"Risk of what, for whom, compared to which group?"* Establish that without the reference class, the number is meaningless.
  *   **05-15: The Walkthrough (The Recidivism Case).** Walk through "John" and the four classes (A, B, C, D). Have them vote on which class *feels* fairest. Reveal the different probabilities. Let the discomfort settle.
  *   **15-25: The Trap (Addressing Misconceptions).** Run the "Narrowest Class" reductio ad absurdum. Crush the "Small Sample" argument.
  *   **25-35: The Journalistic Fix.** Don't leave them with paralysis. Give them a checklist for stories:
      1.  Ask for the reference class definition explicitly.
      2.  Ask for the baseline rate of the *next broader* class (sensitivity analysis).
      3.  If the class is "people like you," ask "Who is *not* like me in this group?"
  *   **35-40: Discussion.** Open floor.
  *   **40-45: The Assessment.** (See below).

  ### 5. The One Question (The Exit Ticket)
  Do not ask "Do you understand?" Do not ask for a definition.
  **Ask this:**

  > *"A press release says: 'New study shows people with your job profile have a 40% chance of burnout.' You are writing the story. What is the **one sentence** you must include to prevent the reader from assuming this applies to them personally?"*

  **The Correct Answer (Gist):** *"That risk varies significantly depending on whether you compare your job profile to all workers, all workers in your industry, or all workers with your specific hours."*
  (You are looking for them to identify that the *comparison group* defines the risk, not the individual.)

  ### 6. What to Refuse (Scope Creep)
  You have 45 minutes. You must aggressively cut the following:

  *   **Bayesian Math:** Do not write a single formula on the board. If they ask about updating priors, say: *"That's a solution for the statistician. Our job is to report the uncertainty of the prior."*
  *   **Philosophical History:** Do not mention Keynes, Reichenbach, or Venn. It signals "academic theory" and disengages the newsroom.
  *   **Solving the Problem:** Be honest. *"There is no mathematical solution to the Reference Class Problem. There is only transparent reporting of it."* If you try to offer a fix, you lose credibility.
  *   **Protected Classes/Bias Deep-Dive:** While RCP is central to algorithmic bias, do not let the session become a general discussion on racism in data. Keep it focused on the *statistical mechanism* of class selection. Bias is a *consequence* of RCP, not the definition of it.

  ### Summary of the "Talk Out" on the Medical Example
  If they push back on dropping the medical example, tell them this: *"The 'rare mutation' example invites the source to say 'We simply don't have enough data yet.' That lets them off the hook. The Recidivism example forces them to admit they have plenty of data, they just made a choice about which data counts. That is a story."*
