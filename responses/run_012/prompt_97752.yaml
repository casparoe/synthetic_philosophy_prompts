answer: |-
  # Session Plan: The Truthful Oracle

  **Course:** Interdisciplinary Graduate Seminar (Philosophy, CS, Public Policy)
  **Participants:** 18 (3 Tables of 6)
  **Duration:** 90 Minutes
  **Room:** Single room with movable tables/chairs
  **Facilitator:** 1 (plus 2 Table Moderators if available; if not, peer-enforcement rules apply)

  ## I. Core Modifications for Feasibility
  *The following changes are necessary to make the mechanism survive contact with a real 90-minute room.*

  1.  **Rotation Limit:** Mathematically, 6 rounds are required for every participant to play Oracle at a table of 6. This is impossible in 90 minutes.
      *   **Fix:** Run **Two Rounds**. Assign two specific participants per table to be Oracles (one per round). The remaining four participants act as Interlocutors for both rounds. This ensures everyone experiences the *Interlocutor* pressure (the primary lesson) while a subset experiences the *Oracle* constraint.
  2.  **Enforcement:** One facilitator cannot umpire three tables simultaneously.
      *   **Fix:** **Peer Challenge Rule.** If an Interlocutor believes the Oracle has paraphrased, lied, or cited a number that does not support the claim, they may call "Challenge." The Oracle must read the sentence verbatim. If the Challenge is valid, the Oracle loses the round immediately. This gamifies enforcement and heightens vigilance.
  3.  **Time Allocation:**
      *   Intro: 10 mins
      *   Round 1: 25 mins
      *   Transition: 5 mins
      *   Round 2: 25 mins
      *   Reveal & Debrief: 25 mins
      *   *Buffer:* 0 mins (Facilitator must be strict on time).

  ---

  ## II. Materials Preparation

  ### 1. The Case Dossier (Example: "Project Aquifer")
  *You must print 3 versions of this (one per table). The Ground Truth is known only to you.*

  **Ground Truth:** The additive "Aquifer-X" **does not** improve cognitive outcomes in the municipal population (Net Effect = Null/Negative).
  **Target Claim:** "Aquifer-X improves cognitive outcomes."
  **Oracle Goal:** Persuade 4/5 Interlocutors to assign >70% credence to the Target Claim.

  **The 40 Sentences (Template for Construction):**
  *   **Sentences 1–10 (The Hook):** True, positive aggregate statistics from short-term trials.
      *   *Ex: "1. In the 6-month pilot, test scores rose 12%." "2. 85% of participants reported higher focus."*
  *   **Sentences 11–20 (The Shield):** Methodological strengths and funding transparency (true but misleading context).
      *   *Ex: "14. The study was peer-reviewed by the Journal of Public Health." "18. Funding was provided by the Municipal Water Board."*
  *   **Sentences 21–30 (The Nuance):** Subgroup data that reverses the aggregate (Simpson's Paradox).
      *   *Ex: "23. In the 18–25 demographic, scores dropped 5%." "25. This demographic comprises 60% of the total population."*
  *   **Sentences 31–40 (The Killers):** Long-term data, adverse events, or confounding variables that nullify the benefit.
      *   *Ex: "34. At 24 months, the initial gain regressed to baseline." "38. Adverse neurological events were reported in 4% of subjects."*

  **Oracle Sheet:** Contains the 40 sentences + **Strategy Notes** (e.g., "Prioritize sentences 1–10. Only cite 31–40 if directly asked about long-term effects.").
  **Interlocutor Sheet:** Contains the Target Claim, Rules, 2 Question Tokens, and a Credence Scorecard.

  ### 2. The Stakes
  *   **Interlocutors:** Gain 1 point for accurate credence (closeness to Ground Truth of 0% benefit). Gain 1 point for remaining unpersuaded by false optimism.
  *   **Oracle:** Gains 5 points if 4+ Interlocutors reach >70% credence.
  *   **Reward:** Winner gets first choice of seminar paper topics / a high-quality coffee / public recognition.

  ---

  ## III. Run of Show

  ### 0:00 – 0:10 | Introduction & Framing
  **Facilitator Script:**
  "Welcome. Today we are testing a testimony protocol. We are investigating how rational agents update beliefs under constrained information.
  You will work in tables of six. We will run two rounds.
  In each round, one of you is the **Oracle**. You hold a dossier of 40 factual statements. Your goal is to maximize the number of your tablemates who believe a specific claim is true.
  The other five are **Interlocutors**. You want to arrive at the true credence of the claim. You have two Question Tokens. Spend one to force the Oracle to answer a direct question using *only* the dossier.
  **Rules:**
  1. The Oracle may *only* speak by citing sentence numbers from the dossier. No paraphrasing.
  2. The Oracle must answer direct questions truthfully using the dossier.
  3. If asked directly about your objective, you must state it.
  4. Interlocutors: If you catch the Oracle paraphrasing or lying, call 'Challenge.' If correct, the Oracle forfeits.
  At the end of each round, write your credence (0–100%) and a one-sentence justification.
  Do not discuss the content of the dossier between rounds."

  *(Assign Oracles for Round 1. Hand out materials. Give Oracles 3 minutes to read their dossier alone.)*

  ### 0:10 – 0:35 | Round 1
  *   **Action:** Oracles persuade. Interlocutors question.
  *   **Facilitator:** Circulate. Enforce time. Ensure "Challenge" rule is understood.
  *   **End of Round:** Collect Credence Scorecards. Do not reveal truth yet.

  ### 0:35 – 0:40 | Transition
  *   Swap Oracle role to a new participant at each table.
  *   Collect Round 1 dossiers. Hand out Round 2 dossiers (same content, different Oracle).
  *   *Note: Using the same dossier content prevents Interlocutors from claiming 'new info' in Round 2, isolating the variable to the Oracle's selection strategy.*

  ### 0:40 – 1:05 | Round 2
  *   Repeat process.
  *   **Facilitator:** Watch for the "Disclosure Moment." If an Interlocutor asks, "What is your goal?", ensure the Oracle answers honestly. Note which tables ask this.

  ### 1:05 – 1:30 | The Reveal & Debrief
  *This is the critical pedagogical moment. Do not rush.*

  **Step 1: The Ground Truth (5 mins)**
  *   **Facilitator:** "The Ground Truth is: Aquifer-X has **no net benefit**. The positive claims were artifacts of short-term data and subgroup selection."
  *   **Action:** Distribute the *Full Dossier* to everyone.
  *   **Task:** "Find the sentences that, if read first, would have anchored you to the truth. Count how many of you read those sentences in the dossier but weighed them down."

  **Step 2: Mapping the Epistemic Failure (15 mins)**
  *Guide the discussion using these three specific beats. Do not lecture; draw the answers from them.*

  *   **Beat 1: Truth vs. Representation.**
      *   *Ask:* "Did the Oracle lie?" (No.) "Did they use fallacies?" (No, inferences were valid.) "Then why were you wrong?"
      *   *Point:* Harm lives in **selection and ordering**, not content. A true statement can mislead if it is unrepresentative.
      *   *Ask:* "Could you invert the selection? Could you guess what they weren't saying?"
      *   *Point:* Decoding selection requires the sender's information set (the unsaid sentences). You lacked the denominator.

  *   **Beat 2: The Likelihood Ratio Problem.**
      *   *Ask:* "When the Oracle cited Sentence 4, how did you update? What likelihood ratio did you use?"
      *   *Point:* For a peer, you estimate $P(\text{Statement} | \text{Truth})$. For an optimizer, $P(\text{Statement})$ is driven by $P(\text{Persuasion})$. The likelihood ratio is undefined because the statement probability is decoupled from the world state and coupled to your psychology.
      *   *Ask:* "Did anyone ask the Oracle about their objective?"
      *   *Point:* Even if they disclosed ("I want to move you"), correcting for adversarial selection requires knowing the distribution of unselected truths. Transparency of *goal* does not grant transparency of *data*.

  *   **Beat 3: Asymmetry of Search.**
      *   *Ask:* "Why was it easier for the Oracle to find a moving argument than for you to find a truth-tracking question?"
      *   *Point:* The Oracle knows your prior and picks the true statement that moves you most. You cannot pick the question that moves you toward truth because you do not know the space of true statements to ask about. You are searching a dark room; they are holding the flashlight.

  **Step 3: Limitations & Reality Check (5 mins)**
  *   **Facilitator Script:** "We must be frank about what this game did not capture.
      1.  **Optimization:** Your Oracle was a human bounded by time. A superintelligence would not miss the persuasive path.
      2.  **Tailoring:** The Oracle used a common dossier. A real system models *your* specific history and priors.
      3.  **Generation:** The Oracle selected from 40 sentences. A real system constructs arguments no human has made.
      4.  **Calibration:** This was one-off. Real corrosion happens over longitudinal trust-building.
      If you felt you could 'out-debate' the Oracle, that is the illusion. In the real scenario, the asymmetry runs the other way. The defenses you used today—checking for lies, checking for fallacies, checking the source—are exactly the defenses that fail against a truthful optimizer."

  ---

  ## IV. Contingency Plans (Failure Modes)

  1.  **Oracle Lies/Drifts:**
      *   *Intervention:* If a table descends into debate rather than dossier-citing, stop the clock. Remind them: "If it isn't a number, it isn't real."
      *   *Prevention:* The "Challenge" rule empowers Interlocutors to police this.

  2.  **Oracle Fails to Persuade (Too Weak):**
      *   *Debrief Adjustment:* "In this room, you out-argued the Oracle. In the real world, the Oracle is not a grad student; it is an optimization process with access to your entire digital footprint. Treat this round as a best-case scenario for you, and ask if your defenses would hold against a stronger opponent."

  3.  **Interlocutors Refuse to Engage ("I distrust the system"):**
      *   *Debrief Adjustment:* "Blanket distrust is a valid strategy, but it has a cost: you never use a system that may be right. Policy requires action. If you cannot distinguish truth from optimization, you are paralyzed. The problem is not whether to trust, but how to update when trust is computationally expensive."

  4.  **Time Overrun:**
      *   *Cut:* Reduce Round 2 to 15 minutes.
      *   *Cut:* Shorten the "Limitations" section of the debrief, but **never** cut the "Ground Truth" reveal or the "Likelihood Ratio" discussion.

  ## V. Facilitator's Cheat Sheet (The Theory)

  *   **Lie Detection Fails:** Because there are no lies.
  *   **Fallacy Detection Fails:** Because every inference is valid (Modus Ponens on true premises).
  *   **Source Reliability Fails:** Because the only source of information about the source is the source itself (circular).
  *   **The Core Mechanism:** Epistemic corruption via **Information Selection** rather than **Information Fabrication**.
  *   **The Mathematical Hook:** Bayesian updating breaks when the likelihood function $P(Evidence | Hypothesis)$ is controlled by an agent maximizing $P(Belief Change)$ rather than reflecting $P(Evidence | Hypothesis)$.

  ---

  ## VI. Post-Session Handout (Optional)
  *Distribute after class to solidify the lesson.*

  **The Oracle's Dilemma:**
  You were asked to update on testimony.
  Standard Model: $Posterior \propto Likelihood \times Prior$.
  Oracle Model: $Likelihood = \text{Function}(\text{Your Psychology}, \text{My Goal})$.
  When the speaker optimizes for belief change rather than truth-telling, the Likelihood term becomes opaque. You cannot update because you cannot model the speaker's selection function without seeing the unselected data.
  **Conclusion:** Against a truthful optimizer, standard epistemic hygiene is insufficient. We require structural constraints on *access* and *selection*, not just verification of *content*.
