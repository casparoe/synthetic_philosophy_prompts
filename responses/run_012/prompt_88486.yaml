prompt: |-
  So my mate and I got into a two-hour argument last night about whether you can ever get from "I can conceive of it" to "it's possible," and I lost track of where the actual disagreement was. Now I've somehow agreed to run next week's session of our reading group, which is a mixed bag — a couple of historians, a linguist, one physicist, nobody who's done any real philosophy — and I've got 45 minutes and a whiteboard.

  Don't explain conceivability to me. Plan how I should explain it. What has to come before what, so that by the time I say "conceivability is a defeasible guide to possibility" it sounds like a conclusion they were already circling rather than a slogan I dropped on them. And I want one carrying example to hold the whole thing together. Not the zombies, and not the water-isn't-H2O thing, I'm sick of both — I want to use this case my mate kept throwing at me: that you can conceive of there being nothing at all, no universe, no space, no time, nothing. I think that case does something the zombie stuff doesn't, but I can't articulate what, so tell me what it's actually good for and what it can't do, and whether it's really the right one to carry the session or if I'm fooling myself.

  Then the misconception map. I'm guessing they'll assume conceivable just means imaginable, i.e. if you can form a picture of it; and I bet they'll slide from "guide" to "proof" without noticing. Also my mate's whole move was that conceivability is just a fact about what's going on in our heads and so can't tell us anything about what's really out there — I want that objection to land at a specific point in the sequence and I want the sequence to have already made room for it, not for me to improvise a reply. Where exactly do I head each of those off, and what do I do if someone in the room is clever enough to raise the head-in-the-sand version before I get there.

  And give me one question to ask at the very end that would show me they've got the defeasibility — that the guide can be overridden — rather than just parroting back that conceivability isn't a proof. Plus what I should openly say I'm not covering at this level, because I know if I let the a posteriori necessity stuff in the door I'll lose them in ten minutes.
