      *   Must exclude Kripkean a posteriori necessity (Water=H2O, Hesperus=Phosphorus). This is the biggest time-sink and confusion point for non-philosophers.

  8.  **Refining the Plan (Self-Correction/Review):**
      *   *Timing:* 45 mins is tight. 5 mins intro, 10 mins example/intuition, 10 mins the gap/imagination, 10 mins the objection/defeat, 10 mins wrap-up/question.
