  The principle

  A dispute is merely verbal if the parties agree on all underlying physical, functional, and historical facts, and the contested term serves only as a conventional label for grouping those facts. A dispute is substantive if the contested term purports to track a mind-independent structure, such as a natural kind, an ontological status, or a moral value, such that redefining it feels like denying a feature of reality rather than adjusting a linguistic tool. If one party claims the other is confused about a concept's definition rather than the world, it is not a disagreement at all. The key distinction lies in whether the definition itself constitutes the discovery or value at stake, or merely organizes agreed-upon data. Existence claims are treated as substantive even without empirical disagreement, distinguishing them from categorical classifications. This ensures that ontological commitments carry weight distinct from empirical fact, preserving the intuition that some disputes are about being, not just naming.

