answer: |-
  ### The Session Plan: Liberty as Architecture

  **The Carrying Case:**
  Use the **Automated Scoring System** (Candidate 3).
  *Why:* You are teaching a Technology-and-Governance cohort. The Company Town (Candidate 1) is theoretically clean but contextually distant; it asks engineers to translate their expertise into history rather than applying theory to their domain. The Automated Scoring System validates their specific professional stakes.
  *Constraint:* To prevent it from becoming a technical distraction, you must describe it **structurally**, not technically. Do not discuss the code, the data inputs, or the error rates. Describe it solely as a **relation of power**: "A system owned by Entity A, governing Subject B, with the capacity to exclude B from essential goods, without B having the right to appeal the decision." It must function exactly like the Company Town, merely digitized.

  **The Reverse Case:**
  Hold the **Reverse Case** (Candidate 2: Non-Dominating Interference) back. Do not introduce it as a second example. Use it as the **solution** to the problem generated by the first case. It belongs in the final third of the session, not the beginning.

  **Positive Liberty:**
  **Flag and Set Aside.**
  *Decision:* Do not attempt to teach Positive Liberty as a co-equal third category in this ninety-minute session.
  *Reasoning:* For a governance programme, the critical conflict is between Negative (non-interference) and Republican (non-domination). Positive Liberty (self-mastery/source of will) introduces the "Liberty = Ability" misconception (Misconception 1) which actively undermines the Negative/Republican distinction.
  *Loss:* You lose the completeness of the "threefold" taxonomy.
  *Gain:* You prevent the session from collapsing into a debate about welfare vs. freedom. Treat Positive Liberty in the final 10 minutes solely as a **boundary marker**: "This is what we are *not* talking about when we discuss governance structures."

  ---

  ### The Sequence (90 Minutes)

  The order is dictated by **debugging**. You begin with the intuitive model (Negative), show where it fails to compile (The Domination Glitch), install the patch (Republican), and then define the system limits (Positive). This satisfies the Engineers (taxonomy as a tool to fix a break) and the Lawyers (application before definition).

  #### Phase 1: The Baseline (0–25 mins)
  **Component:** Negative Liberty.
  **Activity:** Present the Automated Scoring System.
  *   *Scenario:* A credit-scoring algorithm determines access to housing and work. It is opaque. You cannot appeal. However, you have a perfect score. It has never flagged you. It never interferes with your life.
  *   *Question:* "Are you free?"
  *   *Consensus:* Most will say "Yes."
  *   *Definition:* Introduce **Negative Liberty** here. Freedom is the absence of actual interference. The engineers get the taxonomy; the lawyers see it applied.
  *   **Intercept Misconception 1 (Liberty = Ability):**
      *   *Trigger:* A student asks, "But if the algorithm denies me credit, I can't buy a house. Isn't that unfreedom?"
      *   *Intervention:* Stop immediately. Distinguish **Freedom** (no one stops you) from **Capacity** (you have the means). If you lack money, you lack capacity, not liberty. Negative liberty is strictly about external blockers. Write this on the board: *Liberty ≠ Ability*.

  #### Phase 2: The Glitch (25–55 mins)
  **Component:** Republican Liberty.
  **Activity:** Stress-test the Baseline.
  *   *Scenario:* Keep the facts the same (no interference), but change one variable: The owner of the algorithm can change the rules tomorrow to exclude you based on a whim, and you have no right to contest it.
  *   *Question:* "Does your freedom depend on the owner's benevolence?"
  *   *Consensus:* Shifts to "No, I am not free."
  *   *Definition:* Introduce **Republican Liberty**. Freedom is the absence of *domination* (arbitrary power), not just interference.
  *   *Why this order:* Republican liberty is visibly required because Negative liberty failed to capture the vulnerability in the scenario.
  *   **Intercept Misconception 2 (Domination = Malice/Interference):**
      *   *Trigger:* "But the owner is nice. They promised not to change the rules."
      *   *Intervention:* "A benevolent master is still a master." The *capacity* to interfere arbitrarily is the unfreedom, regardless of intent.
  *   **Intercept Misconception 3 (Power = Exercised Power):**
      *   *Trigger:* "But the code never triggered. The power is dormant."
      *   *Intervention:* "A sword over your head is a threat even if the string never breaks." Domination is a structural condition, not an event.
  *   **Intercept Misconception 4 (Three Vocabularies for One Thing):**
      *   *Trigger:* "Isn't Republican just Negative with a moral adjective?"
      *   *Intervention:* Show the policy divergence. Negative Liberty says: "Delete the algorithm." Republican Liberty says: "Keep the algorithm, but make it contestable." They demand different engineering solutions.

  #### Phase 3: The Patch (55–75 mins)
  **Component:** Non-Dominating Interference (The Reverse Case).
  **Activity:** Resolve the tension.
  *   *Scenario:* How do we make the algorithm compatible with Republican Liberty?
  *   *Solution:* Introduce the **Reverse Case** logic here. The algorithm *does* interfere (it scores you), but it does not *dominate* if the rules are known, non-arbitrary, and subject to your contestation (e.g., a right to appeal, or democratic oversight of the scoring criteria).
  *   *Why this order:* You cannot understand how interference can be free until you understand why arbitrary power is unfree. This satisfies the Lawyers' need for a resolved case.
  *   **Intercept Misconception 5 (Positive = Inner Mastery):**
      *   *Trigger:* "So if I understand the code, I am free?" (Confusing Republican contestability with Positive self-mastery).
      *   *Intervention:* "Understanding the cage is not opening the lock." Republican liberty is about *status* vis-à-vis others, not internal psychological states.

  #### Phase 4: The Boundary (75–85 mins)
  **Component:** Positive Liberty (Flagged).
  **Activity:** Delineate the scope.
  *   *Definition:* Define Positive Liberty strictly as "Self-Direction" or "Source of Will."
  *   *Instruction:* Explicitly state: "In this programme, we are designing external constraints. Positive liberty concerns internal capacity or collective self-legislation. It is a different category."
  *   *Why:* This prevents the "Liberty = Ability" error from returning. It acknowledges the threefold division without letting the third wheel steer the bike.

  #### Phase 5: The Final Check (85–90 mins)
  **Task:** "The Governance Patch."
  **Instruction:** Do not ask for definitions. Give them a specific intervention and ask them to classify the *type of unfreedom* it addresses.
  **Prompt:**
  > "A tech firm proposes a new feature for the Scoring System: Users can now see exactly why they were scored down, but they still cannot appeal the decision.
  > 1. Does this increase Negative Liberty? (Yes/No)
  > 2. Does this increase Republican Liberty? (Yes/No)
  > 3. Which type of unfreedom remains?"

  **Correct Answer Key:**
  1.  **Negative:** No (Interference hasn't changed).
  2.  **Republican:** No (Power remains arbitrary; transparency without contestability is still domination).
  3.  **Remaining:** Domination (Arbitrary Power).

  *Why this check:* If they answer "Yes" to Republican, they confuse transparency with non-domination (Misconception 2). If they answer "Yes" to Negative, they confuse information with non-interference (Misconception 1). If they say "None," they treat the vocabularies as synonyms (Misconception 4).

  ---

  ### What to Openly Refuse to Cover

  To keep the sequence tight, you must explicitly state at the outset what is **out of scope**. Write this on the board:

  1.  **Metaphysical Free Will:** "We are not discussing whether the universe is determined. We are discussing political status."
  2.  **Positive Liberty as Welfare:** "We are not discussing whether poverty makes you unfree. We defined that as capacity in Minute 10. Stick to the definition."
  3.  **Historical Lineage:** "We are not discussing Berlin, Skinner, or Pettit's biographies. We are using their tools to debug a system."

  ### Summary of Pedagogical Logic

  *   **Order:** Negative → Republican → Non-Dominating Interference → Positive (Boundary).
  *   **Why:** Negative is the intuitive default (Engineers want this first). Republican is the necessary correction when Negative fails to capture vulnerability (Lawyers need to see the failure first). Positive is excluded from the core to prevent conceptual contamination.
  *   **Case:** Automated Scoring System (structured as a power relation).
  *   **Check:** A binary classification task on a specific policy intervention.

  This plan forces the Engineers to accept that taxonomy without application is useless (Phase 2), and forces the Lawyers to accept that application without taxonomy is incoherent (Phase 1).
