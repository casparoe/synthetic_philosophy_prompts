          *   Mid Tier (Severe): The Lookup Table/Blockhead problem (Causal topology vs. I/O).
          *   Low Tier (Awkward): Slow minds, interrupted minds.
      *   *Section 2: The Counterfactual-Trace Criterion.* Analyze this specifically. Does it solve triviality? It helps, but relies on "relevant degrees of freedom." Who decides relevance? If physics decides, good. If pragmatics decides, moral status is pragmatic.
      *   *Section 3: Falsifiability & Qualification.* Is it a tautology? "Moral status = computation that causes moral status." Need to break the circle. The circle is broken if cognitive science identifies the computation *independently* of moral intuition.
      *   *Section 4: Predictions & Stakes.* LLMs (high risk), Insects (empirical question), Biological anomalies.
      *   *Conclusion:* The honest verdict.

  8.  **Refining the "Fatal" Criteria:**
      *   I need to be careful not to just say "Qualia exist." The user knows that objection. I need to frame it as: "If the physical correlate of qualia is *not* computational."
      *   The "Observer-Relativity" point is the strongest philosophical threat. If computation is in the eye of the beholder, morality is too.
