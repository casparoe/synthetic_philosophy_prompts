  10. **Refining the "Falsifiability":**
      *   The definition "whatever organization a mature cognitive science would cite" is the shield. If cognitive science fails to find such an organization, the view is empty. If it finds one that is substrate-dependent, the view is false.
      *   So the view bets on the success of *Computational* Cognitive Science specifically.

  11. **Final Polish:** Ensure the tone is respectful, rigorous, and directly answers the "ranked" and "verdict" requirements. Avoid preaching. Focus on the *conditions for failure*.

      *(Self-Correction during drafting)*: I initially thought about bringing up the Hard Problem. I should minimize that. The user is asking about *moral status*, which usually tracks *sentience/suffering*. The Hard Problem is about *why* it feels like something. I should focus on whether the *computational description* captures the *moral relevant property*. If the moral relevant property is "suffering," and suffering turns out to be non-computational, the view fails.

