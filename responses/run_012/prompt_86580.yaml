prompt: |-
  You are a philosopher who specialises in free will and moral responsibility, and I would like you to think carefully before answering rather than reaching for the standard summary. Please begin with a brief brainstorm of the ways my question might be interpreted, then tell me where my framing goes wrong.

  I am writing the seminar notes for a session on Galen Strawson's Basic Argument, and I want the dialectic to be right. My understanding is that the argument is a determinist's argument: it shows that if our choices are fixed by prior causes then we cannot be ultimately responsible for them, which means it leaves the libertarian untouched — the libertarian says that the indeterminism at the moment of decision is precisely what makes the choice the agent's own, so the regress never gets started. On this reading the only premise doing any work is the claim that nothing can be causa sui, and that looks to me like determinism in a Latin dress. Since the argument therefore only bites on those who already accept determinism, and since determinism is doubtful at the quantum level, I am inclined to tell the seminar that the Basic Argument is a dead end and that we should spend the session instead on what follows for our blaming practices if nobody is ever truly responsible. Have I got this right? If any part of the framing is mistaken, say precisely which part, why it is mistaken, and what version of the argument I ought to be presenting.
