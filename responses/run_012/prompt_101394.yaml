  ok so I'm in a long-running argument with a friend and I want to outsource the tiebreak. The topic is the colour phi thing — you flash two dots in different spots, and if the timing is right you see a single dot gliding from the first spot to the second; now make the two dots different colours (red then green, say) and people report seeing a dot that starts red, turns green *in the middle of the glide*, and only then arrives at the second spot. The catch is that the second dot hasn't even been shown yet at the moment they claim to see the green. My friend says this shows experience gets edited after the fact — call it the Orwellian reading — so there's no real fact about when you experienced the colour switch, the report is just rewritten and that's all there is. I think it shows the brain builds the whole moving-and-changing experience in advance, before you're ever conscious of any of it — the Stalinesque reading — so the experience genuinely has that order and timing.

