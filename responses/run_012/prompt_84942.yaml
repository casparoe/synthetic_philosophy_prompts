      *   Marcus's solution (Knowledge + Recklessness) is philosophically cleaner.
      *   Priya's solution (Stakes-sensitive Knowledge) is operationally safer for high-reliability organizations.
      *   Best path: Adopt Marcus's terminology for the *individual* (Ravi knew/believed) but Priya's standard for the *process* (The migration was not "verified" or "approved").

