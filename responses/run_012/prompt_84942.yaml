  5.  **Identify What Each Misses:**
      *   **Priya misses:** Conflating "knowledge" with "warrant to act" muddies the water. If Ravi didn't *know*, what did he have? If he had the same evidence in a low-stakes environment, calling it "knowledge" there but "hunch" here makes "knowledge" unstable for technical documentation.
