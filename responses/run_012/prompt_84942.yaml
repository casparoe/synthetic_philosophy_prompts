      *   *Move 7 (Priya):* Defensible. Distinguishes the *situation* not just the *mind*.
      *   *Move 8 (Marcus):* Clearly Right (Pragmatically). This is the most useful engineering distinction. Knowledge = state of mind/evidence. Recklessness = mismatch between evidence and risk.

  4.  **Identify the Underlying Philosophical Positions:**
      *   **Priya:** *Pragmatic Encroachment* (Stanley, Fantl & McGrath) or *Contextualism* (DeRose). The idea that practical stakes affect whether a knowledge attribution is true or appropriate. Also touches on *Normative Epistemology* (knowledge as a license to act).
