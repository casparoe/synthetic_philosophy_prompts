answer: |-
  I understand exactly why you find this position airtight, because for a long time the symmetry argument felt to me like the only way to save rationality from seeming self-defeating in Newcomb-like problems. It is deeply satisfying to think that rationality is a source code that, when run on identical hardware, must produce identical output, thereby making your choice logically dependent on your twin's even without causal contact. However, if you want to be shaken, you need to look at where this view bleeds into the real world, specifically where the evidentialist prescription leaves you systematically vulnerable to agents who reason differently. The most decisive objection, the one that keeps most decision theorists awake at night, is the problem of the richer causalist. In a mixed population where you encounter agents who are not your twins, the evidentialist cooperates while the causalist defects. The causalist knows that your cooperation is fixed by your reasoning process, but they also know their own choice does not causally influence yours. They take the free ride. Over a lifetime of interactions, even if many are with twins, the causalist will accumulate more utility because they never leave money on the table in asymmetric encounters, whereas you do. You might reply that this is just sour grapes about one-shot luck, or that rationality shouldn't be defined by exploiting others, but decision theory is ostensibly about achieving your goals, and if your theory of rationality consistently yields less money than a rival theory in feasible real-world scenarios, it is hard to claim your theory is normative for action rather than just a comforting story about logical purity.

  Closely tied to this is the fragility of the similarity threshold, which is arguably fatal to the practical application of the view. You asked what happens when the other party is only approximately you, and this is where the evidentialist picture often dissolves into arbitrariness. For cooperation to be the evidentialist choice, the conditional probability that the other cooperates given that you cooperate must exceed a certain threshold derived from the payoff matrix. But where does this probability come from? If it is based on logical identity, it is either one or zero, but real humans are never logically identical to that degree. If it is based on empirical similarity, you need a metric for psychological distance. Is it ninety-nine percent similarity? Fifty-one percent? If you cooperate against someone who is only slightly like you, and they defect, you have been punished for a correlation that was too weak to sustain the evidential link. A committed evidentialist might try to patch this by saying you should only cooperate when the correlation is sufficiently high, but this makes the theory incredibly sensitive to prior assumptions. It risks becoming unfalsifiable because whenever cooperation fails to pay off, the proponent can simply retroactively claim the correlation wasn't strong enough to warrant the move, insulating the theory from empirical refutation. This isn't just a trick case; it suggests the theory lacks the predictive grip we want from a account of rationality, turning it into a post-hoc justification for whatever choice you feel inclined to make based on your guess of the other person's mind.

  Moving from the practical to the theoretical, there is a strong case that your position secretly collapses into a form of rule consequentialism or Kantian universalizability, which isn't necessarily a contradiction but does change the category of what you are doing. When you say you cooperate because your reasoning is his reasoning, you are effectively saying you should act on the maxim that you would will to be a universal law for all agents with your source code. This is Kant. Alternatively, if you cooperate because the outcome is better if everyone reasons this way, you are a rule utilitarian. The problem is that decision theory is usually meant to guide individual action given the world as it is, not to prescribe moral rules for a hypothetical community of clones. If the justification for cooperation relies on the moral weight of the collective outcome rather than the individual causal leverage, you have left decision theory behind and entered ethics. A causalist would argue that you are conflating what is rational for you with what is good for the group, and while there is nothing wrong with being altruistic, calling it rationality in the instrumental sense is a category error. The evidentialist might concede this but argue that rationality just is the art of winning, and winning requires recognizing logical ties. However, this move makes the view vulnerable to the charge that it is smuggling in moral premises under the guise of logical necessity.

  There is also the issue of instability in self-referential cases, which is less fatal than the dominance argument but deeply awkward for the internal coherence of the view. In certain setups, what you should do according to evidentialism depends on what you believe you will do, creating a loop where the recommendation shifts as you update on your own intentions. If you lean toward cooperation, the evidence suggests the twin will cooperate, making cooperation even more attractive. But if you lean toward defection, the evidence suggests the twin will defect, making defection safer. This can lead to multiple equilibria where the theory doesn't tell you which one to pick, or worse, it tells you to choose an act that, once chosen, undermines the evidence that supported it. A committed evidentialist usually waves this away as a peculiarity of idealized cases that don't arise in the wild, or they adopt a fixed-point solution where you simply choose the equilibrium that yields the highest utility. But this looks like patching the hull with duct tape; it admits that the core machinery of conditioning on your own acts doesn't always generate a unique recommendation, forcing you to bring in outside criteria to resolve the tie.

  Finally, you asked whether the view has been patched into unfalsifiability and whether that is a problem. The honest answer is that evidential decision theory in this superrational guise does rely on a certain amount of insulation from counter-evidence. When a superrationalist loses to a causalist, the reply is often that the setup wasn't truly symmetric or the correlation wasn't truly logical. This is a problem if you view decision theory as an empirical guide to navigating the world, because a theory that explains away its failures by adjusting the parameters of similarity is hard to use as a tool for learning. However, if you view decision theory as a normative claim about how ideal agents ought to reason in idealized logical spaces, then the price of doing business is accepting that real-world noise will look like irrationality from the inside. The real cost you are paying is not that you will be wrong about the logic, but that you will be right about the logic and still lose the money to someone who doesn't care about the logic. You have to decide if being the kind of agent who cooperates with twins is more important to your identity than being the kind of agent who walks away with the highest payoff in a mixed population. If the former, your view is consistent. If the latter, the causalist is walking away richer not because of luck, but because their definition of rationality is better tuned to a world where logical telepathy is rare and causal leverage is king.
