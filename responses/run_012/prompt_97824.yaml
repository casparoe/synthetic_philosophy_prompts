  *(Self-Correction on the "Marginal Contribution" point)*: Wait, Moore explicitly argues *against* intrinsic value being the same as total value or contribution. He says a thing can have intrinsic value even if it doesn't make the whole better (e.g., a beautiful thing in a world of pain might be good in itself but the whole is bad). Actually, Moore says the value of the whole is not the sum. I need to be precise: Moore distinguishes "Intrinsic Value of X" from "X's contribution to the value of the Whole." Economics calls the latter Marginal Utility. So the user's hypothesis "Intrinsic Value = Marginal Contribution" is something I need to firmly reject based on Moore's text, while showing how Econ collapses the distinction.

  *(Refining the "Organic Unity" point)*: In econ, if $U(x,y) \neq U(x) + U(y)$, we have interaction. Moore says the *value of the part* changes depending on the whole. Econ says the *marginal utility* changes. Does the "value of the part" exist independently in Econ? Only as $U(x, 0)$. So if Moore says $Value(x|Whole) \neq Value(x|Isolation)$, Econ agrees (due to complementarity). But Moore says $IntrinsicValue(x)$ is constant. This is the tension. I need to highlight this. Moore wants $IV(x)$ to be fixed, but $Contribution(x)$ to vary. Econ models $Contribution(x)$ varying via non-separability, but usually defines $Value(x)$ as the contribution. This is the crux.

