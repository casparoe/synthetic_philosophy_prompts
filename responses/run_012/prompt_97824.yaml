      *   Ensure terms like "Hessian," "Supermodularity," "Ordinality," "Revealed Preference" are used correctly.
      *   Maintain the persona of a colleague speaking to a colleague.
      *   Be critical of both Moore and Economics where appropriate.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the "Marginal Contribution" question clearly? *Correction:* Make sure to distinguish between *intrinsic value of a part* and *contribution of a part to the whole*. Moore explicitly distinguishes these. Economics conflates them in marginal utility. This is a key point to highlight.
      *   *Check:* Did I address "Agent-Relative"? *Correction:* Moore is strictly agent-neutral. Econ handles both. The translation should note that Moore's $W$ is a single global function, not a profile of $U_i$.
      *   *Check:* The "Isolation Test." *Correction:* Emphasize that isolation removes *causal* consequences, not just *complementarities*. Econ's ceteris paribus usually holds causal structures fixed. Moore wants to strip causality to find the non-natural glow.

