  2.  **Deconstruct Moore's Value Theory (Principia Ethica):**
      *   **Intrinsic Value:** Value a thing has in itself, independent of context or consequences. Non-natural property.
      *   **Organic Unities:** The value of a whole is not identical to the sum of the values of its parts. A part might have no value alone but contribute positively to a valuable whole (or vice versa).
      *   **Isolation Test:** To determine intrinsic value, imagine the thing exists in absolute isolation. If it's good then, it has intrinsic value.
      *   **Ideal Utilitarianism:** Maximize the good. The good includes aesthetic enjoyment and personal affection.
      *   **Non-Naturalism:** "Good" is a simple, indefinable, non-natural property. (This is the biggest hurdle for economic translation).

  3.  **Drafting the Translation (Economic Dialect):**

      *   *Utility Function:* Let $W$ be the social welfare function (or world-value function).
      *   *Variables:* Let $x_i$ represent states of affairs or objects (beauty, friendship, pleasure, etc.).
      *   *Intrinsic Value:* Moore says it's value *in itself*. Economics usually talks about *marginal utility*.
      *   *Organic Unities:* $W(x_1, x_2) \neq W(x_1, 0) + W(0, x_2)$. This is clearly non-separability. $W = f(x_1, x_2) + \gamma(x_1 \cdot x_2)$.
      *   *Isolation Test:* Evaluate $W(x_i)$ where $x_{j \neq i} = 0$.

  4.  **Addressing the Specific Hypotheses:**

      *   *Hypothesis 1: Intrinsic Value = Marginal Contribution ($\frac{\partial W}{\partial x_i}$)?*
          *   *Analysis:* No. Marginal contribution depends on the existing bundle (context). Intrinsic value for Moore is context-independent. If $W$ is non-separable, $\frac{\partial W}{\partial x_i}$ varies with $x_j$. Moore wants a fixed property of $x_i$.
          *   *Correction:* Intrinsic Value is closer to $W(x_i)$ in isolation, not the derivative in situ. But even that fails because Moore thinks value is a property, not a function output relative to a scale.
          *   *Verdict:* False analogy. Marginal value is relational; Intrinsic value is supposed to be monadic (though Moore struggles with this).

      *   *Hypothesis 2: Organic Unity = Non-separability/Interaction Terms?*
          *   *Analysis:* This is the strongest fit. $V(Whole) \neq \sum V(Parts)$. In econ, this is supermodularity or just non-additivity.
          *   *Nuance:* Moore says the part *in the whole* might have different value than the part *in isolation*. Econ says the *marginal contribution* differs. Moore sometimes implies the intrinsic value of the part *changes*, which violates the definition of intrinsic value.
          *   *Verdict:* Close, but Moore's ontology of "parts" is metaphysical, not just functional.

      *   *Hypothesis 3: Isolation Test = Ceteris Paribus?*
          *   *Analysis:* Ceteris paribus means "other things equal." Isolation means "other things absent."
          *   *Nuance:* Partial equilibrium holds prices/quantities of others fixed. Isolation sets them to null.
          *   *Verdict:* It's a "counterfactual singleton" evaluation. It works formally but misses the metaphysical point of stripping away causal relations to find the non-natural property.

  5.  **Developing the Residue Report:**

      *   *Clean Translations:* Organic Unities $\rightarrow$ Non-separable Welfare Function. Ideal Utilitarianism $\rightarrow$ Consequentialist Maximization of $W$.
      *   *Fudges:* "Good" as a predicate vs. "Utility" as a representation of preference. Moore is a realist about value; Econ is usually instrumentalist/subjectivist.
      *   *No Counterpart:*
          1.  **Non-Natural Property:** Econ has no ontology of value properties. Utility is ordinal/cardinal representation of choice, not a detection of a metaphysical quality.
          2.  **Agent-Neutrality vs. Relativity:** Moore is strictly agent-neutral. Econ allows agent-relative preferences easily.
          3.  **The Specific Goods:** Beauty/Friendship. In econ, these are just arguments in the utility function ($x_{beauty}$). For Moore, they are *objectively* valuable. Econ is agnostic; Moore is dogmatic.
          4.  **"Good in Itself":** Econ translates this to "final good" (consumption) vs. "intermediate good" (capital). Moore means "value independent of existence."

  6.  **Diagnosis & Verdict:**

      *   *Diagnosis:* The translation exposes Moore's ambiguity. Is value a property or a relation? Econ forces a choice (function output). Moore wants both. The "leftover" is Moore's Non-Naturalism. It's not just vagueness; it's a category error from an econ perspective.
      *   *Verdict:* Yes, you are smuggling in assumptions (specifically consequentialism and aggregativity). But it's a *pedagogically useful* smuggling. It clarifies the structural logic while obscuring the meta-ethical foundation.

