  **ASK AUNTIE CONVERGE**
  *The Common Prior, Issue 412*

  **Dear Auntie Converge,**
  My barber says inflation will hit 10%. My colleague, an economist, says 2%. I trust my colleague more. Whose credence do I adopt?
  **Yours, Tim**

  **Dear Tim,**
  You must assign equal weight to epistemic peers. You judge your colleague superior, but your barber judges himself your equal. You must split the difference on your assessment of their competence first. Assign 0.75 weight to the colleague, 0.25 to the barber. Then average the forecasts. Your new credence is 2% weighted by 0.75 plus 10% weighted by 0.25. Result: 4%. Trust the maths, not your intuition.
  **AC**

  **Dear Auntie Converge,**
  I was deeply irrational ten years ago. My past self believed conciliationism was nonsense. Do I weight his opinion?
  **Yours, Recovered**

  **Dear Recovered,**
  You claim superiority over your past self. But your past self claimed superiority over you (had he known you). You disagree on your own reliability. Split the difference on your competence relative to your past self. If you weigh yourself twice as heavily as him, he still counts. Average your current view with his past view. If he rejected this column, you must lower your credence in it accordingly.
  **AC**

  **Dear Auntie Converge,**
  I assign 90% credence to AI doom. My friend reads the same blogs but says 10%. We are both rationalists.
  **Yours, Doomer**

  **Dear Auntie Converge,**
  I assign 10% credence to AI doom. My friend says 90%. We share all evidence.
  **Yours, Skeptic**

  **Dear Doomer and Skeptic,**
  You share evidence sources, violating independence conditions. You are not two data points but one correlated signal. However, you disagree on the interpretation of that shared evidence. Treat the pair as a single epistemic agent with internal conflict. Average your credences directly: 50%. Do not adjust for independence twice. You are now a single voice of uncertainty. Proceed accordingly.
  **AC**

  **Dear Auntie Converge,**
  Many philosophers reject conciliationism. They say your advice is self-defeating. Should you conciliate about conciliationism?
  **Yours, Meta**

  **Dear Meta,**
  Yes. I acknowledge peers disagree with the Equal Weight View. I must lower my credence in my own methodology. I currently hold 0.8 credence in conciliationism. Therefore, weight my advice in this column by 0.8. Discount my rulings by 20%. If you disagree with my discounting, split the difference on the discount.
  **AC**

  **Dear Auntie Converge,**
  I followed your advice for years. I now sit at 0.5 credence on everything. I have a job offer. I cannot calculate expected utility. Should I take it?
  **Yours, Stuck**

  **Dear Stuck,**
  At 0.5 credence for success and failure, with symmetric utilities, your expected value is neutral. You are indifferent. Rational indifference permits randomisation. Flip a coin. Do not assign credence to the coin's bias; treat it as an external randomiser. If you hesitate to flip, you hold a credence above 0.5 that flipping is wrong. Conciliate with your hesitation. Split the difference. Flip two coins.
  **AC**
