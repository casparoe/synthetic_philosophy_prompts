prompt: |-
  im building a handout for the first meeting of a reading group on infinity and paradox, and id rather open with a poem than with a plot summary of Thomson's lamp. Take the role of a poet who's actually read the supertask literature — Benacerraf's reply, not just the wikipedia gloss — and think it through before you draft.

  The form has to do the work. The lamp gets flicked on and off in half the remaining time until the deadline; I want the poem's stanzas to shrink the same way, eight lines then four then two then one, so the poem runs down toward the moment the flicking stops and then has nowhere left to go. The last stanza is a single line, and it cant be 'on' or 'off' or 'half' — and no riddle with a secret answer hiding in it either. What I want the poem built on is Benacerraf's point: the description simply doesnt entail any state for the lamp at the end, so the question dissolves rather than waiting for a clever fix, and the halving cant produce a last term. (Not the Earman–Norton line that no real machine could do it — thats a different objection, and not the one I want in the poem. Same goes for the 1/2 you can wring out of the alternating series; thats a temptation the poem can feel and then refuse.) His title is needling Thomson about being a modern Eleatic, so please dont give me Zeno and the arrow, and no 'and yet, perhaps…' endings.

  Ground it somewhere real — a hand on a switch, an actual lamp, a room, someone else in the house trying to sleep. Before you write, spend a bit of time working out where that last line can land without being either of the two answers.

  Then give me:
  1. The poem.
  2. A section called 'Why its shaped like this', 120-180 words, on what the halving and the single closing line are doing and where Benacerraf actually shows up in it.
