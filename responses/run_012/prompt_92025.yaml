prompt: |-
  Say you've got a pot of money to fund about two philosophers for a year to work on whether neural networks really have representations — realism about interpetability, roughly, rather than building tools. Which open questions should they actually spend the year on, and in what order? I care much more about the reasoning than the list: which questions are upstream of the others, which are tractable for people who can talk to a mech-interp team but won't be training models themselves, and which look deep but wouldn't change much downstream.

  One thing I'd like you to weigh up properly. Someone in our group reckons the whole debate only gets tractable once you split "the network represents X" into a storage claim (the weights encode X in some recoverable way) and a use claim (the network's computation actually runs through X), and argues that only the use claim matters for whether an interpretability finding is real. Is that the right cut, or does it just relabel the same problem? If it's right, which open questions does it dissolve and which does it leave completely untouched?

  And say which sub-questions are most overrated — the fight over what fixes representational content, say, or whether features in superposition are discovered or imposed by our probes — plus what evidence over the next couple of years should move any of this up or down my list.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Deconstruct the Request:**

      *   **Goal:** Fund two philosophers for a year to work on "realism about interpretability" (do neural networks *really* have representations?).
      *   **Constraint:** They won't train models but can talk to mech-interp teams.
      *   **Priority:** Reasoning > List. Need to identify upstream/downstream relationships, tractability, and impact.
      *   **Specific Debate to Weigh:** Storage claim (weights encode X) vs. Use claim (computation runs through X). Is this a useful cut? Does it dissolve problems or just relabel them?
      *   **Overrated Sub-questions:** Identify what's a distraction (e.g., fixing content, superposition discovery vs. imposition).
      *   **Future Evidence:** What empirical results in the next 2 years should shift priorities?

  2.  **Initial Assessment of the Field (Philosophy of ML/Interpretability):**

      *   The core tension is between *instrumentalism* (interpretability tools are just useful shortcuts) and *realism* (there are mind-independent structures in the network corresponding to concepts).
      *   Key players/concepts: Crimmins, Haufe, Weisberg, "The Rashomon Effect," "Polysemanticity," "Superposition," "Causal Interventions."
      *   The "Storage vs. Use" distinction sounds like a variation of the "Vehicle vs. Content" or "Structure vs. Function" debate. It needs careful unpacking.

  3.  **Analyzing the "Storage vs. Use" Cut:**

      *   *Proposal:* Split "Network represents X" into Storage (weights encode X recoverably) and Use (computation causally depends on X).
      *   *Critique:*
          *   "Storage" is tricky. Weights aren't a database. "Recoverably" depends on the decoder. If *any* mathematical transformation counts, everything is stored (triviality). If only *linear* probes count, it's too strict.
          *   "Use" is closer to causal mediation. If I ablate feature X and performance drops, was X "used"?
          *   *Is it a useful cut?* Yes, because it separates *static structure* from *dynamic process*. Realism about interpretability usually hinges on whether the *structure* constrains the *process* in a way that aligns with human concepts.
          *   *Does it dissolve problems?* It dissolves the "is it *really* there?" vagueness by forcing specificity. It leaves untouched the problem of *individuation* (what counts as a feature?) and *normativity* (which representations are *good*?).
          *   *Verdict:* It's a necessary distinction, but "Storage" needs to be refined to "Structural Availability" to avoid triviality.

  4.  **Determining Upstream/Downstream Questions (The Logic Flow):**

      *   *Upstream (Foundational):* What counts as a "representation" in a dynamical system? What is the grain of analysis (neurons, directions, circuits)?
      *   *Midstream (Mechanism):* How do we distinguish signal from noise? How do we handle superposition?
      *   *Downstream (Implication):* Does this guarantee safety? Does this imply consciousness/agency?
      *   *Tractability for Philosophers:* They can't prove a theorem about SGD, but they can clarify definitions, analyze causal claims, and evaluate the logic of probing methods.

  5.  **Identifying Overrated Questions:**

      *   *Fixing Content:* The debate over "what fixes the content" (teleosemantics vs. causal role) is often too abstract. In ML, the "content" is usually defined by the probe's label. The real issue is *stability*, not metaphysical grounding.
      *   *Discovery vs. Imposition:* This is often a false dichotomy. Probes impose *structure* to find *patterns*. The question isn't "did we find it?" but "is the pattern robust across probing methods?"
      *   *Realism vs. Instrumentalism (Global):* Arguing "everything is real" or "nothing is real" is useless. The question is "real *enough for what purpose*?"

  6.  **Drafting the Research Agenda (The "Two Philosophers" Plan):**

      *   *Quarter 1: Conceptual Groundwork.* Define "Representation" in the context of high-dimensional vector spaces. Tackle the Storage/Use distinction.
      *   *Quarter 2: The Superposition Problem.* Address polysemanticity. If one neuron = many features, is the feature real?
      *   *Quarter 3: Causal Validation.* Connect representational claims to causal interventions. (The "Use" claim).
      *   *Quarter 4: Normative Implications.* Safety, deception, and alignment.

  7.  **Refining the "Storage vs. Use" Argument (Crucial Step):**

      *   I need to be precise here. The user's colleague says *only* Use matters.
      *   *Counter-argument:* If a feature is stored but not used (a "spurion"), it might become used later (grokking, fine-tuning). So Storage has predictive value.
      *   *Counter-counter-argument:* If it's not used, it's not a representation *of the function*, it's just weight noise.
      *   *Synthesis:* The distinction is vital, but they are coupled. Realism requires *Stable Storage that Supports Use*.
      *   *Dissolves:* The "is the probe finding truth or creating it?" debate (by shifting to causal validation).
      *   *Untouched:* The "what is the ontology of a feature?" question.

  8.  **Selecting Evidence to Watch:**

      *   Automated Circuit Discovery (ACDC).
      *   Progress in Dictionary Learning (SAE) stability.
      *   Cross-model generalization of features (are features universal?).
      *   Causal abstraction success rates.

  9.  **Structuring the Response:**

      *   **Executive Summary:** Direct answer to the funding question.
      *   **The Storage/Use Cut:** Deep dive into the colleague's claim.
      *   **The Research Agenda (Upstream -> Downstream):** The actual plan for the year.
      *   **Overrated Distractions:** What to ignore.
      *   **Empirical Triggers:** What data changes the philosophy.

  10. **Tone and Style:**
      *   Analytic, precise, slightly technical but accessible to a philosopher/ML crossover audience.
      *   Avoid hand-waving. Be critical of "deep" questions that don't pay off.
      *   Focus on *leverage points* where philosophy can actually help ML research.

  11. **Self-Correction/Refinement during drafting:**
      *   *Initial thought:* Maybe they should work on consciousness.
      *   *Correction:* No, the prompt specifies "realism about interpretability." Keep it focused on representations and mech interp.
      *   *Initial thought:* The Storage/Use split is standard.
      *   *Correction:* It's not standard in *this* way. Usually, it's "structure vs function." I need to validate the colleague's specific framing. It's actually a version of the "vehicle vs. process" distinction. I should highlight that "Storage" is the trap. Weights don't store; they *constrain*.
      *   *Refining the "Overrated" section:* The "discovery vs imposition" debate is the biggest time-sink. I need to explain *why* it's a sink (because it assumes a binary where there's a spectrum of robustness).

  12. **Final Polish:** Check against constraints. Two philosophers, one year. No model training. Talk to mech-interp teams. Ensure the reasoning is explicit. (Proceed to generate output).

  *(Self-Correction during final review)*: Make sure I explicitly answer "which questions does it dissolve and which does it leave completely untouched?" regarding the Storage/Use claim. I need to be very clear on that.

  *   *Dissolves:* The "probe linearity" debate (if use is causal, linearity matters less).
  *   *Untouched:* The "ontology of features" (what *is* a feature?).

  Okay, ready to write.cw
answer: |-
  This is a high-leverage intervention. Most philosophy of AI is too abstract to help engineers, and most engineering is too myopic to spot conceptual rot. Two philosophers embedded with a mech-interp team for a year could prevent a lot of wasted effort on "findings" that are artifacts of bad ontology.

  Here is the breakdown of the research agenda, the evaluation of the Storage/Use cut, and the prioritization of questions.

  ### 1. The Storage vs. Use Cut: Evaluation

  Your colleague's intuition is **mostly right, but the "Storage" half is a trap.**

  **The Verdict:**
  Splitting "representation" into **Structural Availability** (formerly Storage) and **Causal Mediation** (formerly Use) is the correct move. However, claiming *only* the Use claim matters is too strong and risks throwing out predictive power.

  **Why the Cut is Useful:**
  It dissolves the "Probe Linearity" debate. If realism hinges on *Use* (causal mediation), then whether a feature is linearly decodable from activations is secondary. A non-linearly encoded feature that causally mediates behavior is more "real" than a linearly decodable feature that is epiphenomenal. This shifts the philosophical burden from "is the geometry simple?" to "does the abstraction support causal intervention?"

  **What It Dissolves:**
  1.  **The "Is the Probe Creating the Feature?" Anxiety:** If you demonstrate Causal Mediation (Use), it matters less whether the probe imposed a coordinate system. If ablating the direction breaks the computation, the network was *using* that subspace, regardless of how you found it.
  2.  **The "Weights as Database" Fallacy:** It stops people from treating weights as a static library of concepts. Weights constrain the flow; they don't "hold" meanings like a hard drive.

  **What It Leaves Untouched (The Real Hard Problems):**
  1.  **Individuation:** Even if we agree a computation *uses* something, *what* is that something? Is it a direction in activation space? A subgraph? A temporal sequence? The Use claim doesn't tell you where the boundaries of the representation are.
  2.  **Stability/Robustness:** A feature might be "used" in one prompt distribution but vanish in another. The Storage/Use cut doesn't solve the problem of *which* use counts as the representation. (Is it the feature used in 99% of cases, or the one used for the critical 1%?)
  3.  **The "Spandrel" Problem:** Sometimes weights encode information (Structural Availability) that is *not* currently used but is a byproduct of the learning algorithm (e.g., memorization artifacts). If you ignore Storage entirely, you miss features that are "dormant" but dangerous (e.g., a backdoor trigger that is stored but not used until activated).

  **Recommendation:** Fund the project on the condition that they refine "Storage" to **"Robust Structural Availability."** The research question isn't "is it stored?" but "is the structure stable enough across contexts to support counterfactual use?"

  ---

  ### 2. The Research Agenda: Upstream to Downstream

  For two philosophers who can talk to engineers but not code, the value add is **conceptual hygiene**. They should work in this order. If they start downstream (e.g., "does this imply deception?"), they will build on sand.

  #### Phase 1: The Ontology of Features (Months 1–3)
  *Upstream. If this is wrong, nothing else matters.*
  *   **The Question:** What is the bearer of representational content in a transformer? Is it a neuron, a direction (linear combination), a circuit, or a polytope?
  *   **Why First:** Mech-interp often oscillates between "neurons are features" and "directions are features" without justifying the ontology. Philosophers need to analyze the **criteria for individuation**.
  *   **Tractability:** High. This is pure conceptual analysis + reviewing lit on superposition.
  *   **Deliverable:** A taxonomy of "candidate representational vehicles" with clear failure conditions for each. (e.g., "Neurons fail because of polysemanticity; Directions fail because of context-dependence...")

  #### Phase 2: The Causal Criterion (Months 4–6)
  *Midstream. Connecting structure to function.*
  *   **The Question:** Under what conditions does a causal intervention count as validating a representation? (The "Use" claim).
  *   **The Problem:** Current causal interventions (ablations, patching) are brittle. If I patch a feature and accuracy drops, did I break the *representation* or just the *noise*?
  *   **Task:** Develop a **Causal Robustness Framework**. They should work with the team to define what constitutes a "successful" causal test. Is it in-distribution performance? Out-of-distribution generalization?
  *   **Tractability:** Medium. Requires understanding causal graphs but not training models.
  *   **Deliverable:** A set of necessary conditions for a "Causal Validation" claim to support realism.

  #### Phase 3: Superposition and Reality (Months 7–9)
  *Mid/Downstream. The specific technical hurdle.*
  *   **The Question:** If features are superposed (many features in one subspace), are they "real" or just mathematical conveniences for compression?
  *   **Why Here:** You need the Ontology (Phase 1) and Causal Criteria (Phase 2) to answer this.
  *   **Task:** Analyze the **Dictionary Learning (SAE)** results. Are SAE features "discovered" natural kinds, or are they just a better basis set for compression?
  *   **Tractability:** High. This is the hottest topic in interp right now; philosophers can analyze the claims of "disentanglement."
  *   **Deliverable:** A paper on "Realism in Superposition," distinguishing between *compression artifacts* and *semantic features*.

  #### Phase 4: Normative Implications (Months 10–12)
  *Downstream. Only matters if 1-3 hold.*
  *   **The Question:** If representations are real, does that license claims about "deception," "goals," or "alignment"?
  *   **Why Last:** Most safety claims assume realism prematurely. If representations are instrumental fictions, "the model is lying" is a category error.
  *   **Task:** Map the validated representational claims from Phases 1-3 to safety properties.
  *   **Deliverable:** A constraint document for safety teams: "You can only claim X about model deception if you have established Y about representational realism."

  ---

  ### 3. Overrated Sub-Questions (The Time Sinks)

  Tell them to actively avoid or minimize time on these. They look deep but have low leverage on the actual engineering or safety outcomes.

  1.  **"What Fixes Content?" (Teleosemantics vs. Causal Role):**
      *   *Why Overrated:* In biological philosophy, we argue about whether a frog's retina represents "fly" or "small dark moving dot." In ML, the "content" is defined by the dataset labels and the loss function. The metaphysical grounding matters less than the **operational stability**. Spending 3 months on teleosemantics is a waste; spending 3 months on "how stable is this feature across fine-tuning" is gold.
  2.  **"Discovery vs. Imposition" (The Probe Debate):**
      *   *Why Overrated:* As noted in the Storage/Use section, this is often a false dichotomy. All measurement imposes structure. The question isn't "did we impose it?" but "is the structure **invariant** to the method of imposition?" If a linear probe, an SAE, and a causal intervention all point to the same feature, it's real enough. Debating the metaphysics of "imposition" stalls progress.
  3.  **"Global Realism vs. Global Instrumentalism":**
      *   *Why Overrated:* Arguing "all representations are real" or "none are" is useless. The stance should be **Local Realism**. Some circuits are real (e.g., IOI circuit); some activations are noise. The goal is to draw the boundary, not conquer the territory.

  ---

  ### 4. Empirical Triggers: What Moves the List?

  The philosophers should maintain a "Living Document" that updates priorities based on these empirical signals over the next 2 years:

  *   **Trigger A: Cross-Model Feature Universality.**
      *   *Signal:* If the same features (e.g., "DNA binding," "Python function") are found in the *same directions* across different architectures (Transformer vs. Mamba) or sizes without explicit alignment.
      *   *Shift:* Moves **Ontology (Phase 1)** to high confidence. Suggests representations are natural kinds of computation, not artifacts of SGD.
  *   **Trigger B: SAE Interpretability Ceiling.**
      *   *Signal:* If Sparse Autoencoders stop improving reconstruction loss or fail to produce interpretable features at deeper layers.
      *   *Shift:* Moves **Superposition (Phase 3)** to critical. Suggests our current ontology of "features as directions" is wrong, requiring a return to Phase 1.
  *   **Trigger C: Causal Intervention Failure.**
      *   *Signal:* If we find features that look perfect (high probe accuracy) but ablating them has *no effect* on loss (the "Use" claim fails).
      *   *Shift:* Validates your colleague's view that **Use is upstream of Storage**. Prioritizes Phase 2 (Causal Criteria) over everything else.
  *   **Trigger D: Automated Circuit Discovery (ACDC) Success.**
      *   *Signal:* If algorithms can reliably find circuits that generalize to new tasks without human labeling.
      *   *Shift:* Moves **Normative Implications (Phase 4)** up. If machines can find the circuits, the "human imposition" worry dissolves, allowing stronger safety claims.

  ### Summary Recommendation

  Fund the project, but scope it tightly.
  1.  **Adopt the Storage/Use cut**, but rename Storage to "Structural Availability" and insist both are necessary for *safety-relevant* realism (Storage for dormant risks, Use for active behavior).
  2.  **Enforce the Order:** Ontology → Causality → Superposition → Safety. Do not let them jump to safety implications before Month 9.
  3.  **Banish Teleosemantics:** Keep the philosophy of mind lightweight; focus on philosophy of science (measurement, robustness, causality).
  4.  **Metric of Success:** Not a published paper in *Mind*, but a **"Conceptual API"** that the engineering team uses to decide when a finding is robust enough to build safety tools upon.

  This approach ensures the philosophers are acting as **conceptual engineers** for the interp team, rather than observers in a tower. That is where the value lies.
