          2.  Presence of Pleasure = Good.
          3.  Absence of Pain = Good (even if no one enjoys it).
          4.  Absence of Pleasure = Not Bad (if no one exists to be deprived).
          *   *Implication:* Creating a happy person adds no moral value (because absence of pleasure isn't bad). Creating a suffering person adds moral disvalue. Therefore, procreation is always risky/neutral at best, never a moral duty or positive good.
      *   *The Total View (Classic Utilitarianism):*
          *   Value = Sum of well-being of all existing people.
          *   Creating a happy person increases the total sum. Therefore, it is a good thing (prima facie).

