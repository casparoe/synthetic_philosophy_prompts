      *   *So the divergence ONLY happens when:* New life is happy + Existing people pay a cost + The cost is smaller than the new life's gain (for Total) but larger than zero (for Asymmetry).
      *   *The "Switch":* If we change the principle to "Absence of pleasure IS bad" (Total View), they align. If we keep the principle but remove the parental cost, they don't clash (they just differ on magnitude).
      *   *Wait, the prompt asks:* "Change just that feature and tell me whether the two views come back together or stay apart."
