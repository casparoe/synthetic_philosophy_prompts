answer: |-
  This activity forces engineers to bet on a deliberately absurd model over a realistic one, letting them feel the seductive power of predictive success before exposing its fragility under regime shifts.

  **Scenario & Models**
  *   **Task:** Predict average daily API latency for an upcoming week.
  *   **Model A (The "Friedman"):** "Constant Load." Assumes every request takes exactly 50ms. Ignores time, traffic volume, and endpoints.
  *   **Model B (The "Realist"):** "Regression." Uses historical logs, time-of-day, and endpoint weights. Complex spreadsheet.
  *   **Materials:** Projector, printed "Historical Data" (Weeks 1-4), sealed envelopes containing "Actuals" for Week 5 (Holiday) and Week 6 (Sale Event), poker chips (fake currency).

  **Rules & Payoff**
  *   **Endowment:** Each participant gets 10 chips.
  *   **Betting:** Must bet all 10 chips on Model A or Model B per round. No splitting, no sitting out.
  *   **Win Condition:** Lowest Mean Absolute Error (MAE) against actuals wins the pot for that round.
  *   **Constraint:** Ensemble methods ("average them") are forbidden; you must commit to a theory.

  **Timeline (70 Minutes)**
  *   **0-10:** Intro. Show Model specs & Weeks 1-4 data. Explain betting rules.
  *   **10-25:** **Round 1 Betting.** Participants wager on Week 5. Collect bets.
  *   **25-35:** **Reveal 1.** Open Week 5 envelope (Holiday week, flat traffic). Model A wins (50ms vs actual 52ms). Model B overfit noise. Distribute chips.
  *   **35-45:** Discussion. Let them argue that assumptions don't matter if you win.
  *   **45-55:** **Round 2 Betting.** Wager on Week 6. Same rules.
  *   **55-65:** **Reveal 2.** Open Week 6 envelope (Sale event, traffic spike). Model A fails catastrophically (50ms vs actual 200ms). Model B adapts.
  *   **65-70:** **Debrief.**

  **Debrief Points**
  *   **(a) Harmless Falsehoods:** The constant-load assumption was only harmless because variance was artificially low (holiday). It wasn't "true," it was just coincidentally sufficient.
  *   **(b) Frictionless vs. Sloppy:** A frictionless plane isolates a variable to find a law; a sloppy model ignores variables by accident. You cannot tell which one you are holding until the regime shifts.
  *   **(c) Context is King:** "Predicts better" is meaningless without fixing the loss function (MAE vs. Max Error) and the regime (Holiday vs. Sale). The organizer picked the winner by picking the week.

  **Predictable Failures & Mitigations**
  *   **Stats Spoilers:** The two stats engineers will spot the overfitting in Round 1. **Fix:** Recruit them as "Auditors." They verify the MAE calculation but must swear secrecy until the reveal. Give them status, not silence.
  *   **Hedging:** Someone will try to bet 5 chips on each. **Fix:** Enforce the "All-in" rule strictly. If they split, they sit out the round. The point is commitment to a worldview.
  *   **Ensemble Dodge:** Someone will suggest averaging. **Fix:** Explicitly ban this in the rules. This is about choosing a *theory*, not tuning a pipeline.

  **Limitations (What You Must Say)**
  *   This activity proves context-dependence, not that realism is always superior.
  *   It biases toward prediction; real science often cares about mechanism (why did it fail?) which Model A cannot provide.
  *   It doesn't address normative claims (what *should* latency be?), only descriptive ones.
