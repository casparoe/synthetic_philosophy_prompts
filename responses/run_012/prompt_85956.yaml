prompt: |-
  Ok so this is a weird ask. I'm a backend engineer, zero formal philosophy (one ethics elective in college, thats it), and I've somehow been volunteered to run the next session of our lunchtime reading group at work. We've been doing philosophy of science stuff for a few months, badly. 20 people, mostly engineers, one 70-minute slot, and the deal is I have to do an activity, not a talk.

  The thing I want them to feel is the move where a model's assumptions are obviously, laughably false and the thing still out-predicts the careful realistic one, and everyone concludes that realism of assumptions doesn't matter, only predictive success does (I think an economist said this in the 50s? the F-twist?). I want them to actually feel the pull of that move first, because it really is tempting, and then feel where it comes apart.

  So: two competing models of the same mundane thing, one with a deliberately absurd assumption (mine was going to be "assume all our traffic is identical and perfectly evenly spaced"), one realistic with lots of knobs and real-looking parameters. Don't use the usual textbook props, no ideal gases, no perfectly rational agents, pick something boring, a queue, a coffee shop, a hiring pipeline, whatever. The group has to bet on which one predicts a held-out week better. The absurd one wins. Make it win on a metric I announced at the top as the obviously correct one. Then the reveal, that the win is entirely an artifact of that metric, that particular week, and one parameter that got lucky, and that under a small regime shift the absurd model doesn't just lose, it loses catastrophically.

  Give me: the rules, materials, the payoff scheme (points or chips, no real money), roles if it needs them, a timeline for the 70 minutes, and a debrief that maps what actually happened onto (a) why that particular false assumption was harmless in that particular setting, (b) the difference between a model that deliberately leaves something out to isolate one effect, frictionless plane style, and a model that's just a sloppy version of the truth, and whether you can ever tell which one you're holding in advance, and (c) what I think is the real point, that predictive success isn't one thing, it's relative to a target variable, a loss function, and a regime, so "it predicts better" means nothing until all three are fixed, and whoever fixed them picked the winner.

  Also tell me what will predictably go wrong the first time. My guesses: the two stats people in the room will spot the artifact early and spoil it, and someone will refuse to bet and say just average the two models, so I want a rule that makes that dodge unavailable. And be straight with me about what the activity can't reproduce and I'll just have to tell them.

  Keep it under 700 words, bullet points are fine, and lead with one sentence on what the activity is and what it makes people feel. No papers to read and no citations, they'd be useless to me anyway.
