answer: |-
  There is no single, universally canonical name for this pattern in general logic (like *Ad Hominem* or *Straw Man*), though it is a well-recognized error in specific fields such as decision theory, climate ethics, and animal welfare economics.

  In those specialized contexts, it is often discussed under the headings of **Causal Inefficacy**, the **Baseline Problem**, or **Marginal vs. Total Analysis**. However, these terms describe the *context* rather than the specific *accounting error* you have identified.

  Given the precision of your description—specifically the use of accounting metaphors ("ledger," "column," "cost") and the focus on harms that are invariant across choices—I propose the term **The Fixed-Cost Fallacy**.

  Below is the definition, its distinction from neighbouring concepts, and an account of the boundary between legitimate and illegitimate uses.

  ### 1. Proposed Name: The Fixed-Cost Fallacy
  *(Also: The Invariant Harm Fallacy)*

  **Definition:**
  The Fixed-Cost Fallacy occurs in comparative ethical reasoning when a harm (or cost) that is **counterfactually invariant** across the available options is treated as a **differential cost** of one specific option.

  In decision theory, a "fixed cost" is an expense that must be paid regardless of the decision made (e.g., rent for a factory you are deciding whether to operate). Rational decision-making requires comparing options based on *marginal* costs (what changes), not *total* costs (what exists). The Fixed-Cost Fallacy violates this by entering a fixed cost into the ledger of one option to skew the comparison, even though that cost would be incurred under the alternative option as well.

  **Formal Structure:**
  1.  **Option A** entails Harm X and Harm Y.
  2.  **Option B** entails Harm Y.
  3.  **Premise:** Harm Y occurs regardless of whether A or B is chosen (it is fixed/invariant).
  4.  **Fallacious Move:** Arguing that Option A is worse than (or equal to) Option B *because* of Harm Y.
  5.  **Correct Analysis:** Harm Y cancels out. The comparison rests solely on Harm X.

  ### 2. Distinction from Neighbouring Ideas

  You correctly noted that existing labels do not quite fit. Here is how the Fixed-Cost Fallacy differs from them:

  *   **Vs. Whataboutism:** Whataboutism diverts attention to a *different* subject to deflect criticism (e.g., "You criticize my diet, but what about the oil industry?"). The Fixed-Cost Fallacy keeps the *same* subject (animal deaths in food production) but misattributes the *causal accounting* of those deaths.
  *   **Vs. The Doctrine of Double Effect:** This doctrine distinguishes between intended means and foreseen side-effects. The Fixed-Cost Fallacy does not rely on intent; the arguer admits the deaths are foreseen. The error is not about *intent*, but about *causal dependence*.
  *   **Vs. Causal Nihilism ("Nothing I do matters"):** Nihilism claims that *no* choice changes the outcome. The Fixed-Cost Fallacy is more subtle: it admits choices have effects, but insists that a *specific* effect (field mice dying) is tied to the choice under attack, when in fact it is tied to the background system which persists across choices.
  *   **Vs. The Sunk Cost Fallacy:** Sunk costs are *past* expenditures that cannot be recovered. Fixed costs in this context are *concurrent* or *future* harms that are invariant to the specific choice, but not necessarily past.

  ### 3. The Boundary: When is Citing Background Harm Legitimate?

  The crucial boundary lies in **Counterfactual Dependence**. To determine if an argument commits the Fixed-Cost Fallacy, one must ask: *Would this harm occur if the alternative option were chosen?*

  **Legitimate Use (Marginal Analysis):**
  Citing a background harm is legitimate if the choice *influences the magnitude or probability* of that harm.
  *   *Example:* "Buying beef supports an industry that harvests crops for feed."
  *   *Test:* If I stop buying beef, does the demand for feed crops drop? If yes, the harm is **marginal** (variable), and it is legitimate to count it.
  *   *Example:* "Pasture-raised meat requires less harvested land than grain-fed."
  *   *Test:* This claims a *reduction* in the fixed harm. It is an empirical claim about variability, not a fallacy.

  **Illegitimate Use (Fixed-Cost Fallacy):**
  Citing a background harm is fallacious if the harm is **structurally invariant** to the choice.
  *   *Example:* "Eating vegetables kills field mice during harvest."
  *   *Test:* If I eat meat instead, does the harvest stop? No. The land is still farmed (either for human crops or animal feed). The mice die in both branches of the decision tree. Counting this death *only* against the vegetable diet is the Fixed-Cost Fallacy.
  *   *Example:* "Wind turbines kill birds."
  *   *Test:* If we use fossil fuels instead, does bird death stop? No (habitat loss, climate change, pollution). If the bird death from turbines is roughly equal to or less than the baseline death from alternatives, citing turbine deaths *alone* as a reason to reject wind power commits the fallacy.

  ### 4. A Crucial Caveat: Complicity vs. Consequence

  There is one scenario where the Fixed-Cost Fallacy is *not* a fallacy, though it remains a shift in ethical framework. This is the distinction between **Consequentialism** and **Complicity/Participation**.

  *   **Consequentialist Framework:** The goal is to *minimize harm*. Here, the Fixed-Cost Fallacy is strictly an error. If the harm is invariant, it cannot be minimized by switching choices, so it is irrelevant to the comparison.
  *   **Complicity Framework:** The goal is to *keep one's own hands clean*. Here, an arguer might claim: "Even if the mice die anyway, I do not want to be the one *harvesting the crop* that kills them."
      *   In this view, the harm is not being counted as a *consequence* of the choice, but as a *moral taint* of participation.
      *   However, even in this framework, the Fixed-Cost Fallacy often resurfaces. If the alternative (eating meat) involves *slaughtering* animals directly, the arguer must explain why participation in harvesting (which kills mice inadvertently) is worse than participation in slaughter (which kills cows deliberately), given that the mouse deaths are invariant. Usually, the "complicity" argument collapses back into the Fixed-Cost Fallacy when used to claim the diets are "roughly even."

  ### Summary
  The pattern you have identified is best termed **The Fixed-Cost Fallacy**. It is defined by the misattribution of a **counterfactually invariant harm** to a specific choice in a **comparative ethical ledger**. It is distinct from whataboutism because it does not change the subject, and distinct from nihilism because it does not deny efficacy. It is legitimate only when the harm varies between options (marginal cost); it becomes a fallacy when the harm is fixed across options but counted against only one.
