answer: |-
  The light in the office was failing, turning the stacks of papers on Dev's desk into grey monoliths. He had his hands flat on the surface, leaning forward as if to hold the desk in place. Frances sat across from him, her reading glasses pushed up into her grey hair, a red pen hovering over a student essay she had no intention of grading right now.

  I read the whole literature, Dev said. Every paper on empty names since Frege. Every variation on the causal chain, every descriptivist tweak, every pretense theory. I spent six weeks inside it. And the conclusion is that nobody knows anything.

  Frances capped her pen. That is a very strong conclusion to draw from the fact that people disagree.

  It's not just disagreement. It's the spread. Ask a roomful of philosophers in 1900 what makes an action right and a roomful in 2024 and you get the same spread of answers. Utilitarians, deontologists, virtue ethicists. The ratios might shift slightly, but the positions are identical. We are spinning in place.

  That's the record argument, Frances said. I know it well.

  It's the record because it's the data. And then there's the textbook test. You pick up a physics textbook from 1924 and you learn what's true. You learn the model. You pick up a philosophy textbook from 1924 and you learn the problems. You learn the arguments for and against. If you pick up a philosophy textbook from 2024 you still learn the problems. We teach the history of the confusion as if it were the curriculum.

  Frances leaned back, the chair creaking. You're using the wrong model of progress. You think the track record needs to look like a list of theorems. It doesn't. It's a body of case law. We accumulate distinctions, not results. A distinction can be a real advance even when the underlying question stays open. Knowing why a certain kind of answer won't work is work done.

  That's the export model, Dev said. I know that one too. We give away whatever we solve. Logic went to mathematics and computing. Decision theory went to economics. Big chunks of the mind went to cognitive science. So of course the residue looks like it never moves. That's what's left rather than what's been done.

  Exactly.

  No, Dev said, pushing off the desk. That's not an explanation, that's a description of abandonment. An export is just a name for giving up on the hard part. When logic became math, philosophy stopped asking what logic *is* and started letting mathematicians decide how to use it. When the mind went to cognitive science, we stopped asking about consciousness and started talking about qualia as a placeholder for whatever the neuroscientists haven't found yet. We don't solve problems, Frances. We outsource them until we're left with the ones that can't be formalized. And then we call the inability to formalize them a distinction.

  Frances took her glasses down and put them on properly. You think because the question remains open, the work is wasted. But look at the straight-face test. There are arguments that convinced nearly everyone a century ago that today no competent person can state without wincing. The Argument from Illusion. In 1920, you could stand up and argue that because a stick looks bent in water, we only ever perceive sense-data, not objects. It was the road to sense-data. It was standard doctrine.

  And?

  And try saying it now. Try standing in front of a department of philosophy and arguing that the immediate object of perception is a private sense-datum distinct from the physical stick. You will not be refuted by a single decisive counter-argument. There was no Popperian falsification. But you cannot say it without wincing. The shift didn't come from a theorem. It came from the accumulation of objections that made the position too expensive to hold.

  Dev shook his head. That's just fashion. Or it's semantic drift. You said it yourself, there was no decisive refutation. So what happened? We changed what the words mean. We decided 'perceive' doesn't mean what it meant to Russell. And when the field does seem to settle something, that's what it is. Sleight of hand. We change the definitions until the problem disappears, and then we claim we found something out.

  Frances's voice tightened slightly. Clarifying what a word means is finding something out. If you realize you were using 'knowledge' to cover two distinct states and you separate them, you have learned something about the world, or at least about the structure of your thought about the world.

  You've learned something about English, Dev said. Not about reality.

  The structure of thought is the only reality we have access to in this room.

  That's the retreat, though. That's my point. When the physics textbook changes, it's because the world didn't match the math. When the philosophy textbook changes, it's because we got tired of the vocabulary. The straight-face test isn't evidence of progress. It's evidence of boredom. We stopped believing in sense-data not because we discovered they didn't exist, but because we decided the word 'exist' was too heavy for them.

  Frances looked at him, really looked at him, for the first time in the conversation. You think discovery requires the world to kick back. That if the language shifts, the truth hasn't been touched.

  I think if the only way to solve a problem is to change the question, you haven't solved the problem. You've dissolved it. And you're calling dissolution progress.

  Dissolution is often the only way out of a trap, Frances said. The Argument from Illusion was a trap. It forced a choice between realism and skepticism that rested on a confusion about adverbial sensing. We didn't change the subject. We cleared the ground.

  You cleared the ground by moving the furniture into the basement and locking the door. Dev tapped the stack of papers on empty names. I'm looking at a hundred years of people trying to say what a name does. If the answer was just 'we need better distinctions,' we would have them. We'd have a textbook chapter that said 'Here is how names work.' Instead we have a museum of failed attempts.

  And you think that because we don't have the textbook chapter, the museum is worthless.

  I think the museum is evidence that we are bad at this.

  Frances stood up and walked to the window, looking out at the darkening campus. You want the unit of progress to be the answer. I'm telling you the unit of progress is the objection. We can date objections. We know who had which. We know that in 1950 you couldn't say X without hearing Y, and now you can't say X without hearing Z. The space of viable moves has shrunk. That is constraint. That is knowledge.

  It's knowledge of what we can't say, Dev said. Not knowledge of what is.

  Knowing what you cannot say without falsehood is knowledge of what is.

  No, Frances. It's knowledge of what we agree not to say. There's a difference.

  Frances turned around. The light was gone now, and the room was lit only by the desk lamps, casting long shadows between their desks. Is there?

  Yes. Because if I change the definition of 'progress' to mean 'accumulating objections,' then I progress every day. I can object to my own breakfast. That doesn't mean I know what breakfast is.

  You're assuming the questions are fixed stars, Frances said. That 'reference' or 'justice' or 'mind' are things waiting to be measured. They aren't. They are tools we are sharpening. If you sharpen a knife, have you progressed? You haven't cut anything yet.

  I've changed the knife. I haven't found out anything about the wood I want to cut.

  You've found out that the dull knife wouldn't cut it.

  Dev laughed, a short, sharp sound. That's the textbook test again. A physics textbook doesn't teach you which knives were dull. It teaches you which knives cut.

  And if the wood is impossible to cut?

  Then you stop trying to cut wood. You don't write a library of books about why the knife is dull.

  We are not writing about the knife, Frances said. We are writing about the hand that holds it.

  Dev stood up and began gathering his papers, shuffling them into a messy pile. That's what I'm saying. We shifted from the object to the subject. Again. We exported the object to science and kept the subject for ourselves. And now we call it progress because we have better vocabulary for our own confusion.

  Frances walked back to her desk and sat down, picking up her red pen. She didn't look at him. You think semantic shift is sleight of hand. I think it's the only way human beings find things out. We don't discover the meaning of 'cause' or 'right' or 'name' like we discover a planet. We negotiate it. And when the negotiation reaches a point where a certain move becomes impossible to make seriously, that is a fact about the world we live in.

  It's a fact about us, Dev said.

  It is the only fact about the world you can have.

  Dev stopped shuffling the papers. He held them tight in his hand. So if we all agreed tomorrow that sense-data were real, that would make them real?

  No. It would make the argument viable again.

  Which means the progress wasn't in the discovery. It was in the agreement.

  Frances uncapped her pen. The ink flowed onto the student's paper, a red circle around a comma. Agreement is the only evidence of discovery we ever get, Dev. In your physics, too. You just have better tools for forcing it.

  Dev let the papers drop back onto the desk. No. In physics, the world forces it. If you disagree about gravity, you fall. If you disagree about reference, you just write a paper.

  Frances looked up, her eyes tired but steady. And yet you are here, arguing with me about whether the arguing counts. You care.

  I care because I want to know if I'm wasting my life.

  Frances dipped the pen again. Then you already know the answer depends on whether you think changing what a word means can ever count as finding something out.

  Dev picked up his bag. I think finding something out means the thing was there before you named it.

  Frances wrote a note in the margin. I think the thing is there because you named it.

  They looked at each other across the gap of the office, the hum of the heater filling the silence between them. Dev slung his bag over his shoulder.

  Then we aren't doing the same thing, he said.

  No, Frances said, signing the paper. We aren't.
