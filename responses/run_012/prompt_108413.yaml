answer: |-
  This tree sorts higher-order theories by their structural commitments regarding the relation between first-order and higher-order states. It does not sort by historical lineage, authorial attribution, or specific terminology used in published literature.

  *   **Is the account offered as a metaphysical answer to what consciousness is, or as an empirical hypothesis about what accompanies it?**
      *   **As an empirical hypothesis about what accompanies it.**
          *   **Leaf 1: Empirical Companion.**
              *   *Commitment:* Consciousness exists independently of higher-order states, which merely track it reliably.
      *   **As a metaphysical answer to what consciousness is.**
          *   **Must it be numerically distinct from the state it makes conscious, or can a single state represent itself?**
              *   **A single state can represent itself.**
                  *   **Leaf 2: Self-Representationalism [First-Order Theory in Disguise].**
                      *   *Commitment:* A state is conscious if it represents itself, which collapses into the claim that first-order states are intrinsically conscious.
              *   **It must be numerically distinct from the state it makes conscious.**
                  *   **Must the first-order state exist for the higher-order state to do its work? If a higher-order state can have no target, is anything conscious in that case?**
                      *   **Yes, anything is conscious even if the higher-order state has no target.**
                          *   **Leaf 3: Empty Higher-Order Theory.**
                              *   *Commitment:* A subject can be consciously experiencing a state that does not actually exist.
                      *   **No, the first-order state must exist for the higher-order state to do its work.**
                          *   **Must the higher-order state be a thought with conceptual content, or can a perception-like or attention-like state do the same work?**
                              *   **A perception-like or attention-like state can do the same work.**
                                  *   **Leaf 4: Higher-Order Perception.**
                                      *   *Commitment:* Consciousness requires an inner sense organ scanning mental states rather than conceptual thought.
                              *   **It must be a thought with conceptual content.**
                                  *   **Must the higher-order state be occurrent, or does a standing disposition to have one suffice?**
                                      *   **A standing disposition to have one suffices.**
                                          *   **Leaf 5a: Dispositional Higher-Order Thought (Type A).**
                                              *   *Commitment:* A state is conscious if the subject is disposed to think they are in it, regardless of whether the thought occurs.
                                          *   **Leaf 5b: Dispositional Higher-Order Thought (Type B) [Indistinguishable Pair].**
                                              *   *Commitment:* A state is conscious if the subject is disposed to think they are in it, regardless of whether the thought occurs.
                                              *   *Note:* The tree cannot separate 5a and 5b; distinguishing them requires asking whether the disposition is grounded in functional access or phenomenological potential.
                                      *   **It must be occurrent.**
                                          *   **Is the higher-order state itself conscious — and does the view require that, forbid it, or leave it open?**
                                              *   **The view requires or allows the higher-order state to be conscious.**
                                                  *   **Leaf 6: Conscious Higher-Order State [Dead End].**
                                                      *   *Commitment:* The higher-order state is itself conscious, which necessitates an infinite regress of higher-order states that nothing survives.
                                              *   **The view forbids the higher-order state from being conscious.**
                                                  *   **Must the higher-order state represent the first-order state as conscious, or need it only represent it — and if only represent it, is the first-order state's being conscious anything over and above its being represented?**
                                                      *   **It must represent the first-order state as conscious, and consciousness is something over and above being represented.**
                                                          *   **Leaf 7: Strong Content Higher-Order Theory [Undefended Position].**
                                                              *   *Commitment:* The higher-order thought must contain the concept of consciousness, making the theory circular and unattractive.
                                                      *   **It need only represent the state, and consciousness is not anything over and above being represented.**
                                                          *   **Does the higher-order state contribute its own qualitative character to the experience, or is it phenomenally transparent?** [Added Axis]
                                                              *   **It contributes its own qualitative character to the experience.**
                                                                  *   **Leaf 8: Compound Experience Theory.**
                                                                      *   *Commitment:* What it is like to be conscious includes the qualitative feel of the higher-order thought itself.
                                                              *   **It is phenomenally transparent.**
                                                                  *   **Leaf 9: Standard Actualist Higher-Order Thought.**
                                                                      *   *Commitment:* Consciousness is exhausted by the first-order state being represented by an unconscious thought.

  **Added Axis Explanation:** I added the question of qualitative contribution because it determines whether the higher-order mechanism is part of *what it is like* to be conscious or merely a condition for it, a distinction crucial for predicting phenomenological reports.

  **Class Predictions:** I expect most of the class to land on **Leaf 9 (Standard Actualist Higher-Order Thought)** because it balances intuitive constraints about unconscious mental states with a parsimonious metaphysics. I expect none of them to have considered **Leaf 3 (Empty Higher-Order Theory)** because the idea that one can be consciously experiencing a non-existent state contradicts the naive realism most bring to the seminar.
