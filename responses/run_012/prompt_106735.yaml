answer: |-
  ### 1. Concrete Recommendation

  Based on the figures provided, you should stake **12.5% to 25% of your current investable pot** on each deal.

  Here is the derivation and the necessary caveats regarding your withdrawals and the finite horizon.

  **The Optimal Fraction (Kelly Criterion)**
  To maximize the long-term growth rate of your wealth in a repeated multiplicative gamble, you must maximize the expected logarithm of your wealth, not the expected arithmetic value.
  *   **Win:** Wealth multiplies by $(1 + 0.5f)$
  *   **Loss:** Wealth multiplies by $(1 - 0.4f)$
  *   **Probability:** 50% each.

  We maximize the function: $0.5 \ln(1 + 0.5f) + 0.5 \ln(1 - 0.4f)$.
  Solving for $f$ yields **0.25 (25%)**. This is the "Full Kelly" stake. At this level, your wealth grows at the fastest possible sustainable rate.

  **Adjustment for Uncertainty (Half-Kelly)**
  You noted that the 1.5 and 0.6 figures are your colleague's estimates, verified by only a dozen observations. There is a significant risk the true odds are worse than stated. In professional gambling and investment, it is standard to bet "Half-Kelly" to reduce volatility and protect against estimation error.
  *   **Recommendation:** **12.5% of the pot.**

  **The Withdrawal Problem**
  There is a critical flaw in the plan that betting strategy alone cannot fix.
  *   **Max Growth Rate:** At the optimal 25% stake, your geometric growth per bet is $\sqrt{1.125 \times 0.9} \approx 1.0062$ (0.62% per deal).
  *   **Annualized Growth:** Assuming 4 deals per year, $(1.0062)^4 \approx 1.025$. Your pot grows at roughly **2.5% per year**.
  *   **Your Withdrawal:** £25,000 from £400,000 is **6.25% per year**.

  **Conclusion:** Even with perfect betting, your withdrawal rate exceeds the maximum sustainable growth rate of the strategy. Your capital will slowly deplete over time regardless of the stake fraction. To make this sustainable, you would need to either reduce withdrawals, increase the frequency of deals, or find deals with better odds. However, regarding the specific question of *what fraction to stake*: **12.5% is the prudent choice.** Staking more reduces your growth rate and increases ruin risk; staking less reduces your growth rate further.

  ### 2. What Is Wrong (and Right) With Your Colleague's Principle

  **What is Right:**
  Your colleague is mathematically correct about the **Arithmetic Expected Value (EV)**.
  $$EV = (0.5 \times 1.5) + (0.5 \times 0.6) = 1.05$$
  For every £1 staked, the arithmetic average return is £1.05. If you were able to make this bet only *once*, or if you had infinite wealth and could absorb infinite losses without consequence, staking everything would indeed maximize your expected final wealth. His principle holds for a single-shot decision or for an entity that does not face ruin.

  **What is Wrong:**
  Your colleague is confusing the **Arithmetic Mean** with the **Geometric Mean**.
  In repeated investing, returns compound. You do not add returns; you multiply your capital base.
  *   If you stake 100% ($f=1$):
      *   One win, one loss sequence: $1.5 \times 0.6 = 0.9$.
      *   You have lost 10% of your capital every two deals.
      *   Over 100 deals (50 wins, 50 losses), your multiplier is $(0.9)^{50} \approx 0.005$.
      *   You end with 0.5% of your starting money.

  Your colleague's error is assuming that the average outcome of many *parallel* investors (some get rich, most go bust) applies to *one* investor over *time*. It does not. By staking everything, you eliminate the possibility of recovery from a loss. The "average" profit exists only in the worlds where you got lucky early; in the typical timeline, you drift toward zero. His advice is optimal for a multiverse, but fatal for a single life.

  ### 3. Fact vs. Preference: The Second Friend's Argument

  Your second friend argues that the stake depends on your "appetite for risk" (utility function). This is partially true, but it misses an objective mathematical fact.

  **The Objective Fact (Ergodicity):**
  There is a stake fraction (25%) that maximizes growth for *anyone* who wants to stay in the game long-term, regardless of their risk aversion.
  *   Staking 100% is **objectively suboptimal** for repeated play. It yields a negative geometric growth rate. You do not need to be "risk-averse" to reject it; you only need to prefer not going broke.
  *   Staking 25% maximizes the growth rate. This is a fact of the math, not a preference.

  **The Subjective Preference:**
  Where your friend is right is in the choice between **Full Kelly (25%)** and **Fractional Kelly (12.5%)**.
  *   Full Kelly maximizes wealth but involves high volatility (your pot could drop 50% temporarily).
  *   Fractional Kelly sacrifices some growth for smoother returns.
  *   Choosing 12.5% over 25% is a matter of preference (sleeping well at night).
  *   Choosing 100% over 25% is a mathematical error (destroying capital).

  **Practical Difference:**
  *   **Colleague's view:** Implies there is one right answer (100%) and you are irrational for refusing.
  *   **Friend's view:** Implies there is no right answer, only what feels comfortable.
  *   **Correct view:** There is a "safe zone" (0% to 25%). Inside this zone, your choice is preference. Outside this zone (>25%), your choice is objectively self-destructive. Your friend fails to identify that the colleague's advice falls into the destructive zone.

  ### 4. Favourable on Average vs. Bad Repeatedly

  This distinction is the core of the issue, often described as **Ensemble Average vs. Time Average**.

  **The Ensemble Average (Colleague's View):**
  Imagine 1,000 versions of you walk into 1,000 rooms and make the bet once, staking everything.
  *   500 people multiply money by 1.5.
  *   500 people multiply money by 0.6.
  *   Average wealth per person: $1.05 \times$ starting wealth.
  *   **Conclusion:** The bet is favourable.

  **The Time Average (Your Reality):**
  Imagine *one* you making the bet 1,000 times in a row, staking everything.
  *   You will experience roughly 500 wins and 500 losses.
  *   Order does not matter for multiplication: $1.5^{500} \times 0.6^{500} = (0.9)^{500}$.
  *   Your wealth approaches zero.
  *   **Conclusion:** The bet is disastrous.

  **Does the Distinction Do Real Work?**
  Yes. It is not rhetorical; it determines survival.
  *   **Additive processes** (e.g., flipping a coin for £100 profit/loss) are ergodic. The ensemble average equals the time average. Your colleague's logic works here.
  *   **Multiplicative processes** (e.g., percentage returns on a portfolio) are non-ergodic. The ensemble average *diverges* from the time average.

  The "average" return of 5% is a phantom. It is dragged up by the tiny fraction of paths where you win the first 20 bets in a row and accumulate a massive fortune. The *median* path (the one you will actually experience) leads to ruin if you overbet.

  **Summary:**
  You are right to feel uneasy. Your intuition that "the line eventually reaches zero" is mathematically sound for the "all-in" strategy. The correct approach is to treat the opportunity as a positive one, but to size the bet (12.5%–25%) so that the geometric growth rate is positive, acknowledging that your withdrawal rate currently threatens the plan more than the betting strategy does.
