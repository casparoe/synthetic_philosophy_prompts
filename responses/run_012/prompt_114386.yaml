      *   **Scope (Realistic for 6 Months):**
          *   User admits tendency to pitch books.
          *   Constraint: 6 months is short for deep investigative reporting across multiple countries.
          *   Solution: Focus on *existing* reporting + targeted interviews. Synthesize the landscape rather than breaking new ground on the ground. Maybe focus on 3 specific markets max.
          *   Deliverable: One substantial long-form piece (8k-12k words) + maybe a shorter companion explainer.

      *   **Failure Conditions:**
          *   What if the distinction doesn't hold?
          *   What if everyone actually agrees on one side?
          *   What if the "real hard cases" turn out to be boring?
          *   Honest admission: If the distinction is just semantic and doesn't change policy outcomes, the project fails.

      *   **Who to Argue Against:**
          *   The "Conflationists." People who use coercion arguments to mask meaning arguments (and vice versa).
          *   Specific names (optional but helpful context): Sandel (meaning), Posner (efficiency), but mostly the *discourse* itself.

  4.  **Refining the Tone:**
      *   The user is a peer/colleague. The tone should be professional, sharp, slightly intellectual but grounded. No fluff.
