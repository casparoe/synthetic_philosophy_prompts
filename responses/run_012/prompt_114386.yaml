  6.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't sound *too* academic. The user is a journalist. Emphasize the "reporting" aspect.
      *   *Correction:* Ensure the "determinate answer" isn't just "it depends." The answer should be about the *structure of the debate*, not necessarily solving the moral question of kidney sales itself. The answer is: "The debate is stalled because of category confusion."
