answer: |-
  **Project Title:** The Price and the Tag: Disentangling Transactional and Institutional Objections to Repugnant Markets

  **The Question**
  When opponents argue that a specific good (kidneys, votes, plasma) should not be for sale, are they objecting to the *conditions* of the sale (coercion, exploitation, inequality) or to the *existence* of the market mechanism itself (the commodification of the good)?

  This project posits a determinate answer: **The stalemate in repugnant market debates is primarily a category error.** Most public and policy disputes conflate contingent, transactional harms with constitutive, institutional changes. By rigorously separating these two objections, we will find that roughly 60% of the heat in these debates dissolves (because the parties actually agree on the transactional harms but disagree on the institutional permissibility), while the remaining 40% reveals a much harder, previously hidden conflict about social meaning that current policy frameworks are unequipped to handle.

  **The Gap: Why Existing Positions Fail**
  Current discourse talks past itself because it lumps these objections into a single "pro/con" binary.

  1.  **The Efficiency/Autonomy Camp (e.g., Becker, Posner, standard libertarians):** They address the transactional objection. Their argument is that if consent is informed and coercion is minimized, the sale is legitimate. They treat the institutional objection as a superstition or an externality to be priced in. They cannot settle the debate because they deny the premise that a market changes the nature of the good.
  2.  **The Paternalist/Harm Camp:** They focus on vulnerability. They argue the poor will be exploited. This is a transactional objection disguised as a moral one. If you offer them a regulated, high-compensation model with robust safeguards, their objection often evaporates, yet they continue to argue as if the moral core remains.
  3.  **The Corruption-of-Meaning Camp (e.g., Sandel, Anderson):** They focus on the institutional objection. They argue markets crowd out norms. However, they often lean on transactional horrors (desperate sellers) to make their case, weakening their constitutive argument.

  None of these positions force the interlocutor to choose: *If we could guarantee zero coercion, would you still object?* Because this question is rarely asked, the debate remains a muddy swirl of empathy, economics, and moral intuition that yields little policy clarity.

  **The Method: Journalistic Taxonomy**
  I am not writing a philosophy paper. I am reporting a structural flaw in public reasoning. Over six months, I will treat the "Transactional vs. Institutional" distinction as a hypothesis to be stress-tested against real-world cases.

  1.  **Case Selection (3 Markets):** I will select three distinct "repugnant" markets where the debate is active but stalled.
      *   *Plasma Donation (US vs. Global):* A market that exists but is stigmatized.
      *   *Carbon Credits:* A market created to solve a harm, now accused of becoming a license to pollute (institutional corruption).
      *   *Paid Leave/Surrogacy:* A market where the "choice" is heavily constrained by economic necessity.
  2.  **Targeted Interrogation:** I will interview key stakeholders (bioethicists, market designers, regulators, advocates) on both sides. The reporting protocol will require me to press them to isolate the variables.
      *   *To the Libertarian:* "If the market creates a norm of entitlement that undermines civic duty, is that a cost you accept?"
      *   *To the Moralist:* "If the seller is wealthy and the buyer is regulated, is the moral stain removed?"
  3.  **Synthesis:** I will map the responses. Where do the lines actually cross? Where are people pretending to disagree? Where are they hiding behind "exploitation" because they can't articulate why a voluntary exchange feels wrong?

  **Scope and Deliverables**
  I recognize the temptation to turn this into a book. For a six-month fellowship, that is a failure mode.
  *   **Deliverable:** One substantial long-form essay (8,000–10,000 words) suitable for a venue like *The Atlantic*, *Harper's*, or *The New York Times Magazine*.
  *   **Constraint:** I will not attempt to solve the moral question of any specific market. I am solving the *meta-question* of why we can't agree on the markets.
  *   **Reporting Load:** I will limit new interviews to 15–20 key subjects. I will rely on existing reportage and court records for the background of the cases, using my time to analyze the *arguments* surrounding them rather than breaking new ground on the ground conditions.

  **Who I Am Arguing Against**
  I am arguing against **Conflationists**. These are not specific individuals, but a rhetorical habit prevalent in op-eds and policy white papers.
  *   I am challenging the **Policy Pragmatist** who thinks better regulation solves moral unease.
  *   I am challenging the **Moral Absolutist** who uses tales of exploitation to argue against markets that could theoretically be non-exploitative.
  *   I am implicitly challenging the **Sandelian** view that "market reasoning" is a monolith, by suggesting that *pricing* and *trading* might have different moral weights.

  **Failure Conditions**
  I need to be honest about how this goes wrong.
  1.  **The Distinction is Semantic:** If, upon pressing, it turns out that "institutional corruption" is just a fancy way of describing "long-term transactional harm," then the project collapses into taxonomy without insight.
  2.  **No Policy Salience:** If separating the objections clarifies the debate but changes no policy outcomes (i.e., we still ban kidneys for the same reasons, just with better vocabulary), the piece is an intellectual exercise rather than a contribution to public understanding.
  3.  **The "Hard Cases" aren't Hard:** If the remaining disputes after the separation are trivial, the core hypothesis—that we are missing the *real* fight—is false.

  **Success Look**
  The project succeeds if a reader finishes the piece and realizes they have been using a coercion argument to defend a meaning-based intuition (or vice versa). It succeeds if a policymaker reads it and stops trying to solve a normative problem with a compliance framework. I am not promising to tell you if selling kidneys is right. I am promising to tell you why you don't know why you think it's wrong.
