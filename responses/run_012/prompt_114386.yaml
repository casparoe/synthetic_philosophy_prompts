      *   This aligns with philosophical debates (Sandel vs. Posner/Becker), but the user wants to approach it journalistically.
      *   The "determinate answer" needs to be specific enough for a 6-month project but broad enough to be meaningful. It shouldn't be "Is selling kidneys bad?" but rather "Are we arguing about the right thing?"

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be punchy but descriptive. "The Two Markets," "Price of Meaning," "Transaction vs. Institution." Let's go with something that highlights the confusion. *The Category Error of Repugnant Markets.*

      *   **The Question:** Needs to be sharp. Not "Should we sell kidneys?" but "When we argue about selling kidneys, are we arguing about harm or meaning?"
          *   *Refinement:* "Do objections to repugnant markets stem from contingent harms or constitutive changes?"
          *   *Even better:* "Is the objection to the *price* or the *tag*?"
          *   *Final Polish:* "Are we fighting about the transaction or the institution?"

      *   **The Gap (Existing Positions):**
          *   *Libertarians/Economists:* Focus on consent/efficiency (Transactional). Ignore the institutional shift.
          *   *Paternalists:* Focus on harm/coercion (Transactional).
          *   *Sandel-style Moralists:* Focus on corruption of meaning (Institutional).
          *   *The Problem:* They talk past each other. The economists say "Fix the coercion!" The moralists say "But it's still a market!" The proposal needs to show that separating these clarifies the stalemate.

      *   **The Method (Journalistic):**
          *   Can't just read philosophy. Needs reporting.
          *   Strategy: Take 3-4 specific case studies (e.g., plasma, surrogacy, carbon credits, maybe voting).
          *   Interview stakeholders on *both* sides.
          *   Crucial move: Press them to distinguish. "If we fixed the coercion, would you still object?" "If the market existed but no one was coerced, is it still wrong?"
