      *   *Part 2:* "Nor is it neutral." (Technology has biases, consequences, embeds values).
      *   *The Tension:* How can it be not good/bad *and* not neutral? This is the crux. "Good/bad" usually refers to moral outcome. "Neutral" usually refers to influence or bias.
      *   *The Colleague's Interpretation:* "Software bears no moral charge" (Part 1) $\rightarrow$ "Stop arguing about how it is built" (Design doesn't matter) $\rightarrow$ "Argue about how people will use it" (Use determines morality).
      *   *The Problem:* Part 2 ("Nor is it neutral") directly contradicts the idea that design doesn't matter. If it's not neutral, it *does* something specific that favors certain outcomes.

  3.  **Drafting the Readings (Menu of Claims):**
      *   *Goal:* Sort from trivial to radical.
      *   *Category 1: Artifacts as Physical Things (Ontological).*
      *   *Category 2: Practice of Designing (Engineering/Ethics).*
      *   *Category 3: Post-Deployment (Sociological/Consequential).*
      *   *Category 4: Social Arrangements (Political/Infrastructural).*

      *   *Reading A (Trivial/Instrumental):* A hammer isn't moral; the user is. (Physical/Use).
      *   *Reading B (Contextual):* Outcomes depend on context, not just the tool. (Post-Deployment).
      *   *Reading C (Bias/Affordance):* Tools make some actions easier than others. (Design).
