answer: |-
  ### Internal Prep (For Myself)

  **Marcus's Core Claim:** Culture is a Darwinian system. The unit is the "meme" (replicator). Mechanism: Copying with variation. Success metric: Differential transmission frequency (fitness).
  **Sofia's Core Claim:** Culture is a reconstructive system. The unit is the "representation." Mechanism: Cognitive attraction/bias (transformative transmission). Success metric: Stability via cognitive fit, not just transmission chains.
  **The Clash:** They are fighting over the definition of "Darwinism." Marcus thinks Darwinism requires *heritability* (information persistence). Sofia thinks Darwinism requires *replication* (copying fidelity).
  **The Talking-Past-Each-Other:** Marcus treats "bias" as a selection pressure (environment filtering variants). Sofia treats "bias" as a transmission mechanism (internal transformation replacing selection). Marcus is arguing from *population dynamics*; Sofia is arguing from *cognitive psychology*.

  ***

  ### The Ruling

  As a philosopher of biology specializing in cultural evolution, I see this debate play out constantly. It's the classic fight between "Memetics" (Marcus) and "Epidemiology of Representations" (Sofia). You asked for a scorecard, so here is the move-by-move breakdown, followed by the verdict.

  #### Move 1: The Opening Salvo
  *   **Marcus:** "Memes are replicators... passed from brain to brain... survivors are good at spreading."
  *   **Sofia:** "Nothing in culture is actually copied... you rebuild it... copying-with-errors is reinvention-with-a-bias."

  **Rating:**
  *   **Marcus: Partially Right.** He correctly identifies differential retention (some ideas stick, others fade). However, he reifies "memes" as discrete things too easily.
  *   **Sofia: Clearly Right.** This is her strongest point. Cognitive science confirms we do not "download" ideas; we reconstruct them using neural pathways. There is no "copy/paste" in the brain.

  **Justification:** Sofia wins the mechanism here. Marcus is using a metaphor (copying) as if it were a physical process. Sofia correctly identifies that transmission is transformative.

  #### Move 2: The Fidelity Objection
  *   **Marcus:** "Fidelity is a red herring... you only need heritable variation plus differences in how much things spread."
  *   **Sofia:** "If you water down 'replicator' that far, then anything... counts... and the theory stops predicting anything."

  **Rating:**
  *   **Marcus: Clearly Right.** This is the crucial philosophical pivot. Darwinism does *not* require high-fidelity cloning; it requires *heritability* (offspring resemble parents more than random strangers). Biological development is also "reconstructive" (DNA doesn't build a body directly; it triggers a developmental process), yet biology is still Darwinian.
  *   **Sofia: Partially Right.** She is right that loose definitions kill predictive power (the "tautology problem"). But she is wrong that low fidelity kills Darwinism.

  **Justification:** Marcus nails the definition of a Darwinian process. Sofia conflates "replication" (copying) with "heredity" (statistical resemblance). You can have heredity without copying, which is all Darwinism strictly requires.

  #### Move 3: The Explanation of Convergence
  *   **Sofia:** "My pull-toward-the-intuitive... predicts that the same motifs will keep reappearing in unrelated cultures, which selection-for-spread on its own gives you no reason to expect."
  *   **Marcus:** "That's not a rival to selection, it's just one more selection pressure."

  **Rating:**
  *   **Sofia: Clearly Right.** Cognitive attractors (e.g., minimally counterintuitive supernatural agents) explain why similar myths arise independently *without* contact. Pure selection theory struggles to explain independent invention of the *same* complex traits without a shared lineage.
  *   **Marcus: Partially Right.** He is technically correct that bias can be modeled as a "selection coefficient," but this is a mathematical trick that hides the actual cause.

  **Justification:** Sofia identifies a specific causal mechanism (human psychology) that constrains evolution. Marcus just labels the outcome "selection." Sofia explains *why* the selection exists; Marcus just notes *that* it exists.

  #### Move 4: The "Extra Steps" Retort
  *   **Marcus:** "Her story is memetics with extra steps."

  **Rating:**
  *   **Marcus: Clearly Mistaken.** This is a dismissal, not an argument. It ignores that the *source* of the variation matters. If variation is directed (by bias) rather than random (mutation), it changes the evolutionary math significantly.

  **Justification:** In biology, if variation is random, it's standard Darwinism. If variation is directed (Lamarckian-ish), it's a different model. Sofia is arguing cultural variation is *directed* by psychology. Marcus glossing over this ignores a fundamental difference between genes and culture.

  ***

  ### What Both of Them Missed

  Neither of them noticed that **fidelity is engineered, not natural.**

  Marcus assumes fidelity comes from the "meme" itself (like a virus). Sofia assumes fidelity is impossible because of the brain. Both miss that humans build **scaffolding** to *force* fidelity. We write things down, we create rituals, we punish deviations, we build institutions.

  High-fidelity cultural transmission isn't a default state of nature (Marcus) nor an impossibility (Sofia); it's an *achievement*. We invented writing, notation, and teaching specifically to overcome the "reconstruction" problem Sofia identified. Without these external tools, Sofia is right (culture is sloppy). With them, Marcus is right (culture accumulates). They were arguing about the default settings of the human mind, ignoring the technology we built to hack those settings.

  ***

  ### The Verdict

  **Who is closer to being right overall?**

  **Marcus.**

  Here is why, without wishy-washery:

  Sofia wins on the **psychology**, but Marcus wins on the **evolutionary logic**, and the question was about whether culture evolves in a Darwinian way.

  Sofia's central error is believing that "reconstruction" disqualifies a system from being Darwinian. As I noted in Move 2, biological organisms are reconstructed every generation from a DNA recipe; the DNA is not a blueprint, it's a set of instructions for a developmental process. Yet, no biologist claims animals aren't Darwinian because embryos "rebuild" themselves rather than "copying" the parent's body.

  Marcus understands that Darwinism is about **lineages of information**, not the physical mechanism of transfer. Even if Sofia is right that we "reinvent" jokes rather than copy them, if the reinvention is constrained enough that the joke remains recognizable over 50 tellings, that is *heritability*. That is sufficient for selection to act.

  Sofia is right that "Memetics" (the specific theory Marcus is pitching) is often sloppy and metaphorical. But she is wrong to conclude that this means culture isn't Darwinian. Marcus is defending the *principle* of cultural evolution, even if his "meme" branding is pop-science. Sofia is defending a specific cognitive mechanism but drawing a false negative conclusion about evolution based on it.

  **Final Score:**
  *   **Marcus:** Wins on the theoretical framework. Culture *is* a Darwinian process because it exhibits heredity, variation, and differential fitness.
  *   **Sofia:** Wins on the empirical detail. The *mechanism* is reconstructive bias, not viral replication.

  **The Ruling:** Marcus is right that the system is Darwinian. Sofia is right that the "virus" metaphor is bad biology. But since the core question is "Is it Darwinian?", **Marcus takes the win.** He correctly identified that you don't need perfect copying to get evolution; you just need enough resemblance for selection to grab hold. Sofia demanded a standard of fidelity that doesn't even exist in biology, let alone culture.
