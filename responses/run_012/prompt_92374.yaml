answer: |-
  ### Planning Notes

  **Characters and Positions**
  *   **Elara Vane (The Clerk):** Young, hired to reconcile the tercentenary ledger. She embodies the tension between the data (mean vs. median) and the human cost. She does not take a side initially but seeks the truth in the arithmetic.
  *   **Silas Vane (The Arithmetic Man):** Elara's uncle. A senior member who staked 100% ($f=1$). He argues for maximizing expected value (arithmetic mean). He believes the "average" outcome is the only one that matters, even if it implies ruin for most. He represents the friend who argues for the average.
  *   **Thomas Keel (The Geometric Man):** A boatwright and member who staked 20% ($f=0.20$). He argues for survival and sustainable growth (logarithmic utility). He believes a strategy that leads to ruin is irrational, regardless of the average. He represents the narrator's side.
  *   **Mrs. Gantry (The Zero):** An elder who staked 0% ($f=0$). She survived everything but owns nothing. She represents the fear of loss overriding all gain.
  *   **Mr. Corvis (The Syndicate):** The outsider offering a buyout. He represents the "single shot" context that invalidates long-run arguments.

  **Scenes**
  1.  **The Ledger Room:** Elara discovers the divergence between the arithmetic mean estate (high) and the median estate (low). She sees the ghost of the Charter.
  2.  **The Quay:** Elara confronts Silas and Keel. They discuss the two venture types ("The Tide" and "The Storm") and the impossibility of a single fixed fraction satisfying both.
  3.  **The Society Hall:** The vote on the Syndicate offer. The arguments are made through the lens of the single wager vs. the long history.

  **Numbers and Arithmetic**
  *   **Venture 1 ("The Tide"):** 50% chance stake returns 1.5x (net +0.5), 50% chance stake returns 0.6x (net -0.4).
      *   Expected Return (Arithmetic): $0.5(0.5) + 0.5(-0.4) = 0.05$ (5%).
      *   Growth-Optimal Fraction ($f^*$): Solve $0.5 \cdot \frac{0.5}{1+0.5f} = 0.5 \cdot \frac{0.4}{1-0.4f} \Rightarrow f = 0.25$.
      *   Log Growth Rate at $f^*$: $0.5 \ln(1.125) + 0.5 \ln(0.9) \approx 0.0062$ per round.
  *   **Venture 2 ("The Storm"):** 60% chance stake returns 2.0x (net +1.0), 40% chance stake returns 0.0x (net -1.0).
      *   Expected Return (Arithmetic): $0.6(1.0) + 0.4(-1.0) = 0.20$ (20%).
      *   Growth-Optimal Fraction ($f^*$): Solve $0.6 \cdot \frac{1}{1+f} = 0.4 \cdot \frac{1}{1-f} \Rightarrow f = 0.20$.
      *   Log Growth Rate at $f^*$: $0.6 \ln(1.2) + 0.4 \ln(0.8) \approx 0.0201$ per round.
  *   **The Conflict:** The Charter requires one fraction for life. 25% is optimal for Tide, suboptimal for Storm. 20% is optimal for Storm, suboptimal for Tide. 100% maximizes arithmetic mean in both but guarantees ruin in Storm eventually (and negative log growth in Tide).
  *   **The Syndicate Offer:** A single bet. Maximizing arithmetic mean is rational for a single shot if utility is linear. Maximizing log wealth is rational for repeated play. The story turns on whether the Society views itself as a long sequence or a single entity cashing out.

  ***

  ### The Ledger of Halloway Reach

  The dust in the ledger room did not behave like ordinary dust. It settled in layers, distinct as sedimentary rock, marking the years when the herring runs failed and the years when the gales took the masts. Elara Vane brushed a gray film from the leather binding of the Tercentenary Book and opened it to the middle.

  She was the first clerk hired from outside the Society of the Reach. The Charter forbade outsiders from holding membership, but it said nothing about counting their coins. Her uncle Silas had secured her the position, though he warned her not to look too closely at the columns labeled *Estate*.

  "Numbers are like tides, Elara," he had told her, standing on the quay with the salt drying white on his boots. "They come, they go. Don't try to hold them in a bucket."

  But Elara was holding them in a bucket now. She had a pencil behind her ear and a sheet of rough paper where she was calculating the medians. The Charter required every member, upon entering the Society, to name a single fraction of their estate. One number, fixed for life. Each year, that fraction was staked on the Annual Venture. The terms were announced only on the morning of the staking.

  For three hundred years, the Ventures had oscillated between two kinds. The records called them *The Tide* and *The Storm*.

  In *The Tide*, the staked portion came back half again larger on one outcome, and at sixty percent of itself on the other. Each happened half the time.
  In *The Storm*, the stake doubled or was lost entirely. The favorable outcome occurred three times in five.

  Elara ran her finger down the column of current estates for the living members. There were forty-two names. The sum of their estates was immense. The arithmetic mean was nearly fifty times the entry endowment of a new member. But when she sorted the list from poorest to richest, the name in the middle—Mrs. Gantry—had an estate barely larger than what her great-grandfather had started with.

  The mean was carried by four lineages. The Vane line was one of them. The median was carried by the rest, who were slowly sinking beneath the waterline of inflation and bad luck.

  She heard the door creak. Silas entered, filling the frame. He wore his Society ring, heavy gold, on a chain around his neck.

  "You're doing the sums," he said. It wasn't a question.

  "The mean is up," Elara said, not looking up from the paper. "The median is down."

  "The sea is wide," Silas said, walking to the window. Outside, the harbor was a chop of gray iron. "Some boats catch the wind. Some rot at the dock. That is the nature of fishing."

  "It's not the nature of fishing, Uncle. It's the nature of the fraction." She turned the paper toward him. "I calculated the growth for *The Tide*. If you stake everything, your wealth multiplies by one-and-a-half half the time, and by six-tenths the other half."

  Silas nodded. "I know the terms."

  "Over two years, one win and one loss, a whole-staker ends up with $1.5 \times 0.6 = 0.9$ of what they started. They lose ten percent every cycle. But the arithmetic average says they gain five percent per round."

  "Average is what pays the bills," Silas said. "If I bet everything on *The Storm*, I expect to gain twenty percent every time. Sixty percent chance to double, forty percent to lose. $0.6 \times 2 + 0.4 \times 0 = 1.2$. The math is clean."

  "The math is clean until you lose," Elara said. "In *The Storm*, if you stake everything, one loss wipes you out. You cannot recover from zero."

  "Then you don't lose," Silas said. "I haven't lost."

  "You're one of the four," Elara said softly. "Mrs. Gantry staked nothing. She has nothing. Mr. Keel staked one fifth. He has enough to fix his roof."

  Silas turned from the window. His face was weathered, the skin tight over the bone. "Keel plays not to lose. I play to win. The Charter asks for a number. I gave it one. He gave it a fraction. You cannot optimize for a game you do not know."

  "That's what I'm trying to find," Elara said. "The number that works for both."

  She picked up her pencil. She wrote the equations in the margin, where the ink wouldn't smear.

  "For *The Tide*," she murmured, mostly to herself. "Win adds half the stake. Lose takes forty percent of the stake. To maximize the log growth, the derivative must be zero." She wrote: $\frac{0.5}{1 + 0.5f} = \frac{0.4}{1 - 0.4f}$.

  She solved it quickly. $0.5(1 - 0.4f) = 0.4(1 + 0.5f) \Rightarrow 0.5 - 0.2f = 0.4 + 0.2f \Rightarrow 0.1 = 0.4f \Rightarrow f = 0.25$.

  "Twenty-five percent," she said. "For *The Tide*, the growth-optimal fraction is one quarter."

  Silas looked at the number. "And for *The Storm*?"

  Elara wrote the second equation. "Win doubles the stake. Lose loses it all. Three wins in five." She wrote: $\frac{0.6}{1 + f} = \frac{0.4}{1 - f}$.

  $0.6(1 - f) = 0.4(1 + f) \Rightarrow 0.6 - 0.6f = 0.4 + 0.4f \Rightarrow 0.2 = f$.

  "Twenty percent," she said. "For *The Storm*, it is one fifth."

  She looked at her uncle. "The Charter demands one number for life. You cannot have both. If you pick twenty-five percent, you are over-betting in *The Storm*. If you pick twenty, you are under-betting in *The Tide*."

  "And if you pick one?" Silas asked. "One hundred percent."

  "Then in *The Tide*, your wealth shrinks over time. The geometric mean is less than one. And in *The Storm*, you eventually hit the forty percent. Ruin is certain."

  "Ruin is certain for everyone eventually," Silas said. "The question is how high the water climbs before the tide goes out."

  He left her there. The dust motes danced in the shaft of light from the window. Elara closed the ledger. The divergence between the mean and the median wasn't an error. It was a feature. The Society was a machine that converted the certainty of ruin for the many into the improbability of glory for the few.

  ***

  The meeting was called for noon in the Society Hall, a timbered building that smelled of tar and old wool. The Syndicate representative, Mr. Corvis, stood at the head of the long table. He wore a suit that cost more than most of the boats in the harbor. He had placed a single document on the table.

  "The offer is fixed," Corvis said. His voice was dry, like paper rubbing on paper. "We purchase the rights to the Society's endowment and its future ventures. The sum is divided among the current members according to their current estate shares. It is a single transaction. Once signed, the Society dissolves."

  Silas sat at the right hand of the table. Mrs. Gantry sat at the left, her hands folded over a cane. Thomas Keel sat near the middle, sharpening a pencil with a knife.

  "This is a wager," Silas said. "One wager. We trade our future ventures for a certainty now."

  "It is a sale," Corvis corrected.

  "It is a wager on whether the future holds more than this sum," Silas said. He looked around the room. "If we reject, we play the Annual Venture again. If we accept, we take the cash."

  Elara sat in the clerk's chair, recording the minutes. She watched Keel. He stopped sharpening the pencil.

  "The offer is based on the arithmetic mean of our projected endowments," Keel said quietly. "I checked the annex."

  Corvis did not deny it. "It is based on the expected value of your assets."

  "Which favors the Vanes," Mrs. Gantry said. Her voice was thin, brittle. "The mean is high because Silas is high. The rest of us are below the offer."

  Silas leaned forward. "The average is the truth, Martha. If the pot is large, it is large. You cannot say the pot is small because your bowl is empty."

  "My bowl is what I eat from," Mrs. Gantry said. "I staked zero. I have zero growth. But I have no debt. If we take this offer, I get enough to fix the roof. If we play *The Storm* next year and I have staked zero, I get nothing. If I had staked anything, I might have lost it."

  "You staked nothing," Silas said. "You chose safety. Now you want to sell the risk you refused to take."

  "I want to sell the risk *you* took," she countered. "You want to keep playing because you are winning. You want to reject because the arithmetic mean says you will win more. But for most of this room, the next *Storm* could be the end."

  Keel set the pencil down. "It isn't just about the *Storm*. It's about the sequence."

  He stood up. He was a man of few words, preferring the logic of joints and hulls. "We have played three hundred years. That is a long sequence. In a long sequence, the geometric growth rate determines who survives. The arithmetic mean is a ghost. It tells you what happens in a thousand parallel worlds. We live in one."

  "We live in one world," Silas said. "But we face one offer." He tapped the document. "This is not a sequence. This is a single shot. Corvis is not offering us a hundred years of ventures. He is offering us one bet. Win the buyout, or lose it and play the Venture."

  Elara looked up from her notes. "Uncle, if it is a single shot, the log criterion doesn't apply. Log utility is for repeated play. For a single wager, maximizing expected value is rational."

  Silas pointed at her. "Exactly. The girl understands. This is a single event. The history of the Society is irrelevant. The Charter's rule about fixed fractions is irrelevant. We are betting the whole endowment once. If the expected value of the buyout is less than the expected value of the next Venture, we should play the Venture."

  "But the next Venture might be *The Storm*," Keel said. "And we don't know our fractions. We are locked in. If half the room is staked at one hundred percent, and the Venture is *The Storm*, forty percent of us vanish. The Society shrinks. The endowment is fragmented."

  "The Society is a corporation," Silas said. "Losses are absorbed."

  "By whom?" Mrs. Gantry asked. "The losses are absorbed by the men who lose their boats."

  Corvis cleared his throat. "I must remind you, the offer expires at sunset. The decision is by majority vote of shares, not heads."

  Silas smiled. It was a thin expression. He held nearly thirty percent of the shares alone. The other three large lineages held another forty. They were the arithmetic mean made flesh.

  Elara looked at her ledger. She saw the columns. She saw the four names at the top that pulled the average up like a kite tail. She saw the thirty-eight names below that were drifting down.

  If they voted to play, Silas would likely win again. The arithmetic expectation of the Ventures was positive. *The Tide* offered a 5% edge. *The Storm* offered a 20% edge. Even mixed, the expected value was high. Silas was betting on the law of large numbers, but he was using it to justify a single bet.

  If they voted to sell, the game ended. The sequence was broken. The geometric growth rate became irrelevant. The median member would get a sum that allowed them to retire. The mean member would get a sum that allowed them to buy the harbor.

  Keel sat back down. He looked at Elara. "You calculated the optimal fractions."

  Elara nodded.

  "And?"

  "They are different," she said. "Twenty-five percent for *The Tide*. Twenty percent for *The Storm*. The Charter forces us to choose one number for both games. It forces us to be wrong half the time."

  "Unless we stop playing," Keel said.

  "Unless we stop," Elara agreed.

  Silas stood up. "We are the Society of the Reach. We do not sell the Reach. We fish it. We bet it. That is the charter."

  "The charter was written by men who thought the sea was infinite," Mrs. Gantry said. "They didn't know about the median."

  "The median is for cowards," Silas said.

  "The median is for widows," she replied.

  The room fell silent. The clock on the wall ticked, measuring the distance to sunset. Elara looked at the numbers in her head. She thought about the single shot. If this were truly the last wager, Silas was right. Expected value maximization was the rational choice for a one-off gamble, provided ruin was not absolute. But if the Society sold, the ruin was avoided for the many, and the glory denied to the few.

  If they played, the few might become gods, and the many would become dust.
  If they sold, the few would remain men, and the many would remain secure.

  It depended on what you valued. The size of the pot, or the number of people sitting around the table.

  Silas looked at Elara. "Call the vote, Clerk."

  Elara opened the ledger to the voting page. She dipped her pen. The ink was black and thick.

  "The motion is to accept the Syndicate offer," she said. "All in favor signify by raising their share-hand."

  Silas raised his hand. The other three large holders raised theirs. The air in the room shifted. They had the votes. They had the math of the mean.

  Mrs. Gantry did not raise her hand. Keel did not raise his hand. The thirty-eight smaller members looked at their hands, then at Silas, then at the document.

  Elara waited. She thought about the twenty percent and the twenty-five percent. She thought about the single shot versus the long run. She thought about how the arithmetic mean could be a lie that told the truth, and how the geometric mean could be a truth that killed you.

  "Those opposed," she said.

  The room was still. The dust settled on the ledger. The tide outside was coming in, dark and cold, rising against the pilings, indifferent to the fractions men chose to stake against it.

  Elara held her pen over the paper. She did not know which number was right. She only knew that once she wrote it, the sum would change, and it would never change back.

  "Count the shares," Silas said.

  Elara began to count.
