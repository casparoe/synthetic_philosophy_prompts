  9.  **Polishing the Tone:**
      *   Needs to sound like a document written by two tired philosophers who finally understand each other.
      *   Avoid "Strawman A says..." Use "We agree..." and "A holds... B holds..."
      *   Ensure the "Verbal Dispute" section doesn't just dissolve the debate but sharpens it.

  10. **Final Polish (Self-Correction during drafting):**
      *   *Check:* Did I make the single-instance case tricky enough?
      *   *Fix:* Make sure the Humean admits it feels counterintuitive but sticks to the definition. Make sure the Anti-Humean admits it's hard to distinguish from a coincidence without modal force.
      *   *Check:* Is the verbal dispute section too deflationary?
      *   *Fix:* Frame it as a challenge to the Anti-Humean to define "governing" without metaphor, and to the Humean to explain why "summary" feels like it misses something.

