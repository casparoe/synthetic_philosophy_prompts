      *   *Emphasis:* Highlight the difference between *ontological* reality (do they exist?) and *epistemic* utility (can we measure them?).

  10. **Final Polish:** Check the "Bet" section. Be honest. The data is messy. The novel needs truth, not just stats.

  *(Self-Correction on the APC problem)*: I need to be careful not to say APC is unsolvable. It's "underidentified." Solutions exist (Intrinsic Estimator, etc.), but they rely on assumptions. The falsifier is if *no* reasonable assumption yields a cohort effect.

  *(Self-Correction on Labeling)*: This is the "Looping Effect" (Ian Hacking). I should mention that concept implicitly or explicitly. It strengthens the "social kind" argument.

