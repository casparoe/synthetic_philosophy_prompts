answer: |-
  **Title:** The Composition of Collective Action: An Interventionist Criterion

  **Research Question:** Under what metaphysical conditions do distinct individual actions compose a single collective action?

  **Background:** This project adapts the Special Composition Question (SCQ) from material objects to events. Standard SCQ answers fail to settle the action case. Universalism (composition always occurs) implies any random aggregation of movements constitutes a group act, which is counterintuitive. Nihilism (composition never occurs) denies the reality of coordinated agencies like orchestras or militaries. Restrictivism (composition sometimes occurs) is the only viable option, but object-based criteria (spatial contact, bonding) do not translate to actions. Temporal coincidence is insufficient; strangers waiting for a bus act simultaneously but not collectively. Actions lack the spatial boundaries that make object composition intuitive. Furthermore, object composition is often static, while action composition is inherently teleological or causal. Applying van Inwagen's "life" criterion to actions makes no sense. We need a criterion specific to event ontology.

  **Proposed Solution:** I propose a causal criterion based on interventionist theories of causation. A collection of individual actions composes a collective action if and only if there exists a group-level variable that serves as a genuine cause of the individual actions. If manipulating the group-level description (e.g., "the market panicked") reliably changes individual behaviors in a way not reducible to independent variables, composition obtains. This moves the debate from semantic convenience to ontological dependency. It treats the collective not as a sum, but as a causal structure.

  **Methodology:**
  *   *Month 1:* Formalize the SCQ for events. Establish why spatial/temporal criteria fail for actions.
  *   *Month 2:* Develop the interventionist criterion. Define what counts as a "group-level variable" distinct from an aggregate.
  *   *Month 3:* Test against case studies: a coordinated protest (positive), a market crash (contested), and accidental crowd movement (negative).
  *   *Month 4:* Drafting and refining the argument against reductionist objections.

  **Outcomes:** Success looks like a defensible principle that distinguishes collective actions from mere aggregates without relying on subjective interpretation. It should resolve the "market crash" debate by showing whether the crash exerts downward causation. Failure would be demonstrating that the "group-level variable" is merely a shorthand for individual mental states, collapsing the view back into methodological individualism.

  **Feasibility:** This is ambitious for one semester. Defending interventionism itself is a massive task involving complex counterfactuals. Therefore, the project will treat interventionism as a working framework rather than proving it from scratch. The scope is limited to establishing the criterion's applicability, not solving all problems of collective intentionality. It fits a seminar paper but would require expansion for a thesis. The risk is getting bogged down in the philosophy of causation rather than action. I will mitigate this by focusing strictly on the composition question.
