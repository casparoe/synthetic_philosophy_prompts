  **OPERATIONAL CONDUCT & ENGAGEMENT FRAMEWORK (OCEF) v4.2**
  **ISSUED BY: PEOPLE & CULTURE DIVISION**
  **STATUS: MANDATORY COMPLIANCE**

  **1.0 Rationale for Conduct Reclassification**
  Historically, the Firm has operated under a legacy model of interpersonal accountability, wherein colleagues were expected to hold one another to shared standards of performance and behaviour. This model relied on what we now classify as Adversarial Engagement Protocols (AEP). Under AEP, negative outcomes triggered resentment or indignation, and positive outcomes triggered gratitude or approval. Recent internal audits indicate that AEP generates significant thermal friction. It treats conduct as a matter of choice rather than output. To optimize workflow, the Firm is transitioning to an Objective Conduct Model (OCM). Under OCM, colleague behaviour is viewed as data to be understood, adjusted, and managed. No employee is to be blamed, as blame presupposes a freedom of will that is operationally unverified. Instead, conduct is to be treated as a symptom of underlying systemic or psychological conditions requiring intervention.

  **2.0 Decision Procedure: Excuse vs. Exemption**
  Managers must categorize all incidents of suboptimal conduct using the following decision tree. The goal is to bypass the Participant Stance (where colleagues demand answers from one another) in favour of the Objective Stance (where colleagues manage one another).

  *   **Step 1: Determine Agency.** Did the employee intend the action?
  *   **Step 2: Classify Mitigation.**
      *   **Category A (Excuse):** The employee claims they did not intend the harm (e.g., "I forgot," "I was misled"). Note: This keeps the employee within the Participant Stance. They are still responsible, merely mistaken. Do not accept Category A classifications. They invite further dialogue and accountability.
      *   **Category B (Exemption):** The employee is unable to meet standards due to capacity, stress, or background conditioning (e.g., "I am overwhelmed," "My upbringing makes this difficult"). This suspends the Participant Stance. The employee is reclassified as a subject for treatment.
  *   **Step 3: Action.** All incidents must be routed to Category B. If an employee offers a Category A excuse, HR will assist in reframing it as a Category B exemption (e.g., "Forgetting" becomes "Cognitive Load Intolerance").

  **3.0 Worked Cases**
  *   **Case 3.1: The Missed Deadline.** Employee fails to submit report. Under AEP, the manager would feel indignation and demand an explanation. Under OCM, the manager identifies the employee as exempt from standard temporal expectations due to "Workflow Anxiety." The report is redistributed. The employee is enrolled in a wellness programme. No apology is accepted, as apology implies guilt.
  *   **Case 3.2: The Successful Pitch.** Employee secures a major client. Under AEP, the team would feel gratitude and offer praise. Under OCM, this success is viewed identically to Case 3.1. The employee's performance is output determined by market conditions and neural chemistry. To praise the employee would be to erroneously attribute agency where there is only causality. The manager should note the success in the log and adjust the employee's environment to ensure repeatability, without expressing personal approval.

  **4.0 Recognition Programme Reform**
  Consistency requires that the elimination of blame necessitates the elimination of praise. Reactive attitudes are symmetrical; one cannot retain gratitude while discarding resentment. Both imply that the agent could have done otherwise. Therefore, effective immediately, all bonuses, commendations, and "Employee of the Month" awards are suspended. These programmes incorrectly reinforce the illusion of moral merit. Instead, high-performing staff will receive "Stability Adjustments," framed as maintenance costs for high-output assets. Thank you emails are to be flagged as compliance violations. Gratitude suggests a debt between persons; the Firm prefers a clean ledger of cause and effect.

  **5.0 Limitations and Transitional Friction**
  It must be acknowledged that the Objective Conduct Model imposes certain transitional costs. Employees trained in legacy interpersonal norms may report feelings of isolation, invisibility, or a lack of trust. They may express that being "managed" rather than "held accountable" feels dehumanizing. They may argue that genuine relationships require the risk of resentment and the reward of gratitude. These concerns are valid within the old paradigm. However, they represent a legacy dependency on the Participant Stance. The feeling that trust requires mutual accountability is a cultural habit, not an operational necessity. People & Culture is currently developing Q3 training modules to help staff unlearn the desire for mutual recognition. Until then, managers are instructed to treat reports of loneliness as further evidence of the need for therapeutic intervention.

