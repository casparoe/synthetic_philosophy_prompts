answer: |-
  This is a sharp reading of the tension between a classic thought experiment and the messy reality of institutional triage. You are right to sense that Taurek's 1977 argument, *Should the Numbers Count?*, strains when pulled from the synchronous rescue scenario into the diachronic reality of the Seattle committee.

  Here is the mapping of the Seattle case onto Taurek's theory, followed by the points of fracture, the criteria split, and the verdict on what the episode does to the theory.

  ### 1. The Rolling Queue vs. The Closed Set
  You have identified the primary structural failure of the mapping. Taurek's argument is built on a **synchronous dilemma**: a fixed set of claimants (David vs. the Five) at a specific moment of choice. The moral agent stands before them *now*.

  The Seattle committee faced a **diachronic distribution**. The "claimants" were not a closed set; they were a stream. The scarce resource was not a one-time rescue (pulling someone from a burning building) but a continuous flow of machine-hours.

  **Does Taurek's non-aggregation get a grip here?**
  Barely. Taurek's core intuition is that there is no "super-person" who suffers the loss of five lives; there are only five individuals who each suffer a loss of one life. Therefore, the loss is not mathematically greater, just more distributed.
  In Seattle, the "loss" was not just death, but *time*. If you allocate machine time to Patient A, you aren't just saving a "life"; you are purchasing roughly 5 to 10 years of existence. If you deny Patient B, you aren't just denying a "life"; you are denying those specific years.
  Taurek is silent on the aggregation of *time*. If the choice is between giving one person 10 years or two people 5 years each, Taurek's logic suggests you shouldn't sum the years. The loss to the single person (10 years) is a total loss for them. The loss to the two people (5 years each) is a total loss for each of them. Taurek would likely say you cannot add B and C's five years to outweigh A's ten.
  **Where it fails:** The committee wasn't deciding who dies *today*; they were deciding who enters a stream of survival. Taurek's binary (save/die) collapses when the resource is sustenance over time. His theory has no mechanism for a waiting list that expands while you are deciding.

  ### 2. The Criteria Split: Prognosis vs. Social Worth
  Your intuition here is correct, and Taurek's view sorts them cleanly, though with one caveat.

  **Pile 1: Prognosis (Medical Feasibility)**
  *Criteria:* Will this patient's body tolerate the shunt? Will they survive the procedure?
  *Taurek's View:* **Permitted.**
  Taurek distinguishes between weighing the *value of the person* and weighing the *probability of the rescue*. If the machine physically cannot keep Patient X alive, choosing Patient Y is not a moral aggregation; it is an acknowledgment of physical reality. You are not saying Y is worth more; you are saying the rescue is possible for Y and impossible for X. Taurek accepts that an agent can aim to succeed. If the odds of survival are 90% for one and 10% for the other, choosing the 90% is not aggregating worth; it is maximizing the chance that *someone* is saved.

  **Pile 2: Social Worth (Dependents, Contribution, Stability)**
  *Criteria:* Mother of three vs. bachelor; wage earner vs. retired; emotional stability.
  *Taurek's View:* **Forbidden.**
  This is the exact aggregation Taurek rejects. To say the mother of three should live because three others depend on her is to aggregate the loss (her death + their suffering). To say the wage earner should live because he contributes to the economy is to treat the patient as a vessel for social utility. Taurek's "separateness of persons" forbids sacrificing one individual's claim to life to satisfy the needs of others or the state. The committee's use of these criteria is a direct violation of Taurek's central thesis.

  ### 3. The Role of Anonymity
  You asked if stripping names helps, hurts, or is irrelevant to a Taurekian.
  **It helps.**
  Taurek's argument relies on **equal concern**. He argues that because no one is more important than anyone else, each deserves an equal chance of being saved. Anonymity operationalizes this. By removing names, the committee is forced to ignore personal bias (sympathy for a specific story) and social bias (status, profession).
  However, there is a tension: Taurek cares about the *individual's* loss. Anonymity abstracts the individual into a file. But in the context of the committee, anonymity was the only way to enforce the Taurekian mandate that "each counts for one." It prevented the committee from implicitly aggregating value based on who the person *was* rather than the fact *that* they were.

  ### 4. The Lottery in a Growing Set
  Would Taurek want a lottery over the medically eligible? **Yes.**
  If numbers don't count, and social worth doesn't count, the only fair way to decide between equally eligible claimants is to give them equal probability. A coin toss is Taurek's preferred mechanism for the one-off rescue.
  **How do you run it over a growing set?**
  This is the administrative nightmare you spotted. In a one-off rescue, you flip once. In a rolling queue, if you flip a coin every time a slot opens, a patient who has waited six months has the same odds as one who arrived yesterday.
  To be truly Taurekian, you would need a **dynamic lottery**: every time a machine slot opens, you enter all currently eligible waiting patients into a pool and draw a name.
  *   *Problem:* This creates infinite uncertainty. No one can plan.
  *   *Problem:* As the queue grows, the individual's probability of selection approaches zero.
  Taurek has no answer for the *management* of the queue. He only answers the *moment of choice*. This confirms your suspicion that his argument is ill-equipped for institutional policy.

  ### 5. Act-Level vs. Rule-Level
  Your suspicion is the **right reading**, not a dodge.
  Taurek is writing about **act-evaluation**: "What should I do in this specific dilemma?"
  The Seattle committee was writing **policy**: "What rule should we adopt for the next ten years?"
  This distinction is fatal to applying Taurek directly.
  *   If the committee acted Taurekianly on an *act* level (flipping a coin for every admission), they would face public outrage for appearing arbitrary.
  *   If they adopted a *rule* (like First-Come-First-Served), they are no longer flipping coins for each act, but they are adhering to a rule that treats everyone equally *ex ante*.
  Taurek's silence on rule-consequentialism is a major gap. He assumes the moral agent is free to decide each case on its merits. The committee was bound by the need for a consistent, defensible public policy. They couldn't be Taurekians in the moment because they had to build a system that would survive the moment.

  ### 6. Verdict: What the Episode Does to the Theory
  The Seattle episode treats Taurek's theory as an **anomaly he never imagined**, but one that ultimately vindicates his critique of aggregation.

  **Confirmation:**
  The eventual fix—Medicare funding plus First-Come-First-Served (FCFS) within medical eligibility—aligns with Taurek better than the Committee's original "God" method.
  *   **FCFS** avoids weighing social worth. It treats the retired bachelor and the mother of three as equals; the only differentiator is time of arrival, not value of life.
  *   **Medical Eligibility** respects the "feasibility" constraint Taurek allows.
  By moving to FCFS, society effectively agreed with Taurek: you cannot aggregate social worth to decide who lives.

  **The Fracture:**
  However, the episode exposes that Taurek's "coin toss" is impractical for **serial scarcity**.
  *   Taurek says: "Give them equal chance."
  *   Seattle Reality: "Equal chance" over a growing queue is administratively impossible and psychologically torturous.
  *   FCFS is a compromise: it gives equal *status*, but not equal *probability* (early arrivals win).

  **Conclusion for your piece:**
  The Seattle committee started as anti-Taurek (aggregating social worth) and ended as quasi-Taurek (FCFS/Medicare). The "God Committee" horror story exists precisely because they tried to do what Taurek says is impossible: measure the incomparable value of persons.
  But Taurek's theory breaks on the **time** dimension. He solves the problem of *who* to save, but not the problem of *how to organize a society* where saving is always incomplete. The committee's shift to FCFS wasn't just bureaucratic; it was an admission that while we can't weigh lives (Taurek was right), we also can't flip coins forever (Taurek was silent). The theory holds up as a moral critique of the Committee's original criteria, but it fails as a manual for their administrative reality.
