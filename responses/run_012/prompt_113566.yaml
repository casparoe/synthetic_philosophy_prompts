  # HANDOUT: CLASSIFYING NON-HUMAN CAUSATION IN HISTORY
  **Seminar Scaffold: Environmental History & Causal Idioms**

  ## PART I: THE LOGICAL SPACE
  **Three Axes of Disagreement**

  Before locating specific arguments, we map the available conceptual coordinates. A position is defined by its selection on three axes: **(A) Causal Role**, **(B) Explanatory Target**, and **(C) Idiom of Description**.

  | Axis A: Causal Role | Axis B: Explanatory Target | Axis C: Idiom | Status | Characterization / Diagnosis |
  | :--- | :--- | :--- | :--- | :--- |
  | **Force** (Pushes outcome) | **Single Event** | **Mechanical** | **Occupied** | *Event-Causation.* (e.g., Tambora forces harvest failure). |
  | **Force** (Pushes outcome) | **Divergence** | **Structural** | **Occupied** | *Strong Determinism.* (e.g., Climate forces institutional divergence). |
  | **Force** (Pushes outcome) | **Pattern** | **Agential** | **Occupied** | *Disease-as-Protagonist.* (e.g., Pathogen drives demographic pattern). |
  | **Frame** (Fixes possibilities) | **Divergence** | **Structural** | **Occupied** | *Longue Durée.* (e.g., Geography sets temporal setting). |
  | **Filter** (Selects variations) | **Divergence** | **Structural** | **Occupied** | *Possibilism / Conditional Det.* (e.g., Environment selects among human options). |
  | **Force** (Pushes outcome) | **Single Event** | **Agential** | **Vacant** | *Diagnosis: Incoherent.* Abiotic shocks (volcanoes) lack the continuity for agency; pathogens lack the singularity for event-only focus. |
  | **Frame** (Fixes possibilities) | **Single Event** | **Mechanical** | **Vacant** | *Diagnosis: Unattractive.* A frame cannot explain a singularity; it explains boundaries. |
  | **Filter** (Selects variations) | **Single Event** | **Agential** | **Vacant** | *Diagnosis: Unexplored.* Selection implies a population; events imply singularity. Tension unresolved. |
  | **Force** (Pushes outcome) | **Pattern** | **Mechanical** | **Occupied** | *Ecological Materialism.* (e.g., Resource base dictates energy capture). |
  | **Frame** (Fixes possibilities) | **Pattern** | **Agential** | **Vacant** | *Diagnosis: Unstable.* Frames are static; agents act. "Acting settings" require distributed agency (see Leaf 12). |

  **Note on Vacancies:** Empty cells are not necessarily false, but they represent combinations rarely defended because the internal logic of the terms conflicts (e.g., a "Frame" cannot cause a "Single Event" without becoming a "Force").

  ***

  ## PART II: THE DECISION TREE
  **Diagnostic Instrument for Non-Human Causation**

  **START:** *Grant that a non-human factor (pathogen, climate, or volcano) made a difference to a historical outcome.*

  **NODE 1: FACTOR ONTOLOGY**
  What kind of entity is the causal factor?
  *   **(A) Biotic/Pathogenic:** It has fitness interests, replicates, and co-evolves with hosts (e.g., *Yersinia pestis*, Smallpox). → *Go to Node 2.*
  *   **(B) Abiotic/Physical:** It is an aggregate condition or a punctuated geological event (e.g., Tambora, Gulf Stream, rainfall zones). → *Go to Node 3.*

  **NODE 2: PATHOGEN AGENCY (From 1A)**
  Is the pathogen's causal power described as a blind biological process or as a strategic engagement?
  *   **(A) Blind Process:** It is a vector or mechanism; "agency" is metaphorical. → *Go to Node 4.*
  *   **(B) Strategic Engagement:** It is a co-constitutive actor in a network of hosts and vectors. → *Go to Node 5.*

  **NODE 3: ABIOIC RHYTHM (From 1B)**
  How does the factor operate in time?
  *   **(A) Punctuated Shock:** A discrete eruption or anomaly (e.g., Laki 1783, Tambora 1815). → *Go to Node 6.*
  *   **(B) Enduring Condition:** A persistent background (e.g., tropical vs. temperate zones, soil types). → *Go to Node 7.*

  **NODE 4: PATHOGEN MECHANISM (From 2A)**
  Does the pathogen compel a specific outcome or select among human variations?
  *   **(A) Compels:** Mortality is inevitable regardless of social structure (e.g., Americas post-1492). → *Leaf 1: Biological Reductionism.*
  *   **(B) Selects:** Mortality interacts with social vulnerability (e.g., Black Death & serfdom). → *Leaf 2: Conditional Determinism.*

  **NODE 5: PATHOGEN ONTOLOGY (From 2B)**
  Is the agency attributed to the microbe alone or to the host-microbe assemblage?
  *   **(A) Microbe Alone:** The germ is the protagonist; humans are the terrain. → *Leaf 3: Disease-as-Protagonist.*
  *   **(B) Assemblage:** Causation is distributed across the network. → *Leaf 4: Distributed/More-than-Human Agency.*

  **NODE 6: SHOCK MAGNITUDE (From 3A)**
  Did the shock overwhelm all human mitigation capacities?
  *   **(A) Yes:** The event dictates the outcome regardless of preparation (e.g., Year Without a Summer). → *Leaf 5: Catastrophism.*
  *   **(B) No:** The event triggered a crisis mediated by existing fragilities (e.g., Laki & European politics). → *Leaf 6: Trigger Mechanism.*

  **NODE 7: CONDITIONAL SCOPE (From 3B)**
  Does the enduring condition fix the outcome or merely bound it?
  *   **(A) Fixes:** The condition makes one trajectory inevitable (e.g., Tropics prevent development). → *Leaf 7: Strong Environmental Determinism.*
  *   **(B) Bounds:** The condition sets limits but allows choice within them. → *Go to Node 8.*

  **NODE 8: HUMAN MEDIATION (From 7B)**
  Can human institutions override the environmental constraint?
  *   **(A) No:** Institutions are themselves products of the constraint. → *Leaf 8: Geographical Fatalism.*
  *   **(B) Yes:** Institutions can mitigate or exploit the constraint. → *Go to Node 9.*

  **NODE 9: EXPLANATORY PRIORITY (From 8B)**
  When divergence occurs, which factor holds primacy?
  *   **(A) Environment:** The environment explains why institutions succeeded or failed. → *Leaf 9: Possibilism.*
  *   **(B) Institutions:** The environment is the stage, but institutions write the play. → *Leaf 10: Institutions-First.*

  **NODE 10: TEMPORAL DEPTH (From 7B & 9A)**
  Is the explanatory target a specific divergence or the general tempo of history?
  *   **(A) Specific Divergence:** Why Society X differed from Society Y. → *Leaf 11: Conditional Determinism (Ecological).*
  *   **(B) General Tempo:** The speed and rhythm of change itself. → *Leaf 12: Longue Durée (Slow-Frame).*

  **NODE 11: METAPHYSICAL COMMITMENT (From 2A, 4, 5, 6)**
  Is the language of "actor," "force," or "shock" literally true or a heuristic tool?
  *   **(A) Literally True:** Non-humans possess causal power ontologically equal to humans. → *Leaf 13: Realist Materialism.*
  *   **(B) Heuristic Tool:** Actor-talk is useful but carries no metaphysical weight. → *Leaf 14: Deflationary Instrumentalism.*

  *(Note: Nodes 10 and 11 function as cross-cutting refinements to ensure sufficient leaf differentiation.)*

  ***

  ## PART III: THE LEAVES
  **Position Profiles**

  **1. Biological Reductionism**
  *   **Definition:** Pathogens act as mechanical forces that compel demographic outcomes regardless of social context.
  *   **Awkward Commitment:** You must argue that social hierarchy in the Americas was irrelevant to the scale of demographic collapse.
  *   **Naturalizing Inference:** **High Risk.** Easily slides into "biological superiority" justifications for conquest.

  **2. Conditional Determinism (Pathogenic)**
  *   **Definition:** Pathogens have causal primacy only under specifiable conditions of social vulnerability.
  *   **Awkward Commitment:** You must specify exactly when biology overrides politics without retreating into vagueness.
  *   **Naturalizing Inference:** **Avoidable.** Can attribute death to social neglect rather than biological fate.

  **3. Disease-as-Protagonist**
  *   **Definition:** The pathogen is the central historical agent; human history is a reaction to microbial strategy.
  *   **Awkward Commitment:** You must treat human intention as secondary to microbial fitness interests.
  *   **Naturalizing Inference:** **Ambiguous.** Can excuse colonialism ("germs did it") or highlight vulnerability ("we are not masters of nature").

  **4. Distributed/More-than-Human Agency**
  *   **Definition:** Causation emerges from the network of hosts, vectors, microbes, and environments.
  *   **Awkward Commitment:** You must grant causal weight to non-intentional entities without anthropomorphizing them.
  *   **Naturalizing Inference:** **Low Risk.** Dissolves the human/nature hierarchy rather than inverting it.

  **5. Catastrophism**
  *   **Definition:** Punctuated abiotic events (volcanoes) overwhelm human systems and dictate immediate outcomes.
  *   **Awkward Commitment:** You must treat human resilience as negligible during the event window.
  *   **Naturalizing Inference:** **Low Risk.** Frames everyone as equally vulnerable to planetary forces.

  **6. Trigger Mechanism**
  *   **Definition:** Abiotic shocks initiate crises that are resolved by pre-existing political or economic structures.
  *   **Awkward Commitment:** You must distinguish the trigger from the cause without diminishing the trigger's necessity.
  *   **Naturalizing Inference:** **Avoidable.** Highlights political failure to prepare rather than environmental malice.

  **7. Strong Environmental Determinism**
  *   **Definition:** Enduring physical conditions fix historical trajectories and institutional forms.
  *   **Awkward Commitment:** You must explain away counter-examples where similar climates produced divergent societies.
  *   **Naturalizing Inference:** **Very High Risk.** Historically used to justify colonial rule as "natural" order.

  **8. Geographical Fatalism**
  *   **Definition:** Institutions are epiphenomenal; geography dictates political capacity.
  *   **Awkward Commitment:** You must deny the efficacy of political revolution or technological adaptation.
  *   **Naturalizing Inference:** **Very High Risk.** Converts causal constraint into moral justification for inequality.

  **9. Possibilism**
  *   **Definition:** The environment offers a range of possibilities from which humans select, but the range is not infinite.
  *   **Awkward Commitment:** You must define the limits of the possible without smuggling in determinism.
  *   **Naturalizing Inference:** **Moderate Risk.** Can imply some societies chose "better" options due to environmental ease.

  **10. Institutions-First**
  *   **Definition:** Non-human factors are noise; institutional quality explains all significant divergence.
  *   **Awkward Commitment:** You must treat massive ecological constraints as manageable variables.
  *   **Naturalizing Inference:** **Low Risk.** Focuses accountability on human governance, not nature.

  **11. Conditional Determinism (Ecological)**
  *   **Definition:** Environmental factors cause divergence only when technological or social buffers are absent.
  *   **Awkward Commitment:** You must specify the threshold of "buffer" capacity without circular reasoning.
  *   **Naturalizing Inference:** **Avoidable.** Highlights inequality in resilience rather than inherent capacity.

  **12. Longue Durée (Slow-Frame)**
  *   **Definition:** The non-human supplies the temporal setting and rhythm rather than the specific cause of events.
  *   **Awkward Commitment:** You must explain how a "setting" causes anything without becoming a "force."
  *   **Naturalizing Inference:** **Low Risk.** Describes constraints on all humans equally over deep time.

  **13. Realist Materialism**
  *   **Definition:** Actor-talk refers to ontologically real causal powers residing in non-human entities.
  *   **Awkward Commitment:** You must defend a metaphysics where rocks or viruses have "power" independent of human description.
  *   **Naturalizing Inference:** **Low Risk.** Flattens ontology; humans lose their special status as sole causal agents.

  **14. Deflationary Instrumentalism**
  *   **Definition:** Actor-talk is a useful fiction for describing complex systems, carrying no metaphysical commitment.
  *   **Awkward Commitment:** You must use agential language while insisting it is literally false.
  *   **Naturalizing Inference:** **Low Risk.** Treats causation as a descriptive tool, not a justification for power.

  ***

  ## PART IV: INSTRUMENT LIMITATIONS

  **1. Indistinguishable Pairs**
  This instrument cannot reliably separate the following positions because their historical *practice* converges even if their *theory* diverges:
  *   **Possibilism (Leaf 9) vs. Conditional Determinism (Leaf 11):** Both argue that environment limits but does not compel. In practice, both scholars look for the same "thresholds" of human adaptation. The difference is often rhetorical (emphasis on human choice vs. environmental limit) rather than empirical.
  *   **Distributed Agency (Leaf 4) vs. Deflationary Instrumentalism (Leaf 14):** Both produce narratives where humans and non-humans are entangled. The difference is metaphysical (is the agency *real* or *useful?*). A reader observing the historical writing cannot detect the difference without asking the author about their ontology.

  **2. Unstable Positions**
  The tree forces some defenders into combinations they would reject, revealing internal tensions:
  *   **Catastrophism (Leaf 5) + Agential Idiom:** The tree allows abiotic shocks to be classified near agency if they "overwhelm." Defenders of Catastrophism usually reject agential vocabulary for volcanoes (Tambora did not *act*; it *erupted*). The instrument reveals that "overwhelming force" is often a backdoor way of granting agent-like status to matter.
  *   **Institutions-First (Leaf 10) + Event-Causation:** If institutions are primary, a volcanic shock (Node 3A) should be absorbable. If the shock dictates the outcome (Leaf 5), Institutions-First is falsified. The tree shows that Institutions-First is unstable in the face of high-magnitude abiotic events unless it retreats to Deflationary Instrumentalism.

  **3. The Naturalizing Inference Check**
  The primary political danger in this field is the slide from **"X caused Y"** to **"X justified Y."**
  *   **High Danger Zones:** Leaves 1, 7, 8. These positions locate causality in fixed biological or geographical traits, making hierarchy appear inevitable.
  *   **Safe Zones:** Leaves 4, 10, 13, 14. These positions either distribute agency equally, focus on human governance, or treat causal language as metaphorical, blocking the inference that "natural cause" equals "moral right."
  *   **The Slide:** The instrument shows that **Conditional Determinism (Leaf 2 & 11)** is the critical battleground. It accepts the causal claim (germs/climate mattered) but can refuse the naturalizing inference (therefore hierarchy is justified) *only if* the "conditions" are identified as social vulnerabilities rather than inherent traits.
