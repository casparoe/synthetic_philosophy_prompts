answer: |-
  You have put your finger on one of the most persistent and uncomfortable nerves in political theory. Your observation is sharp: you are describing the **Boundary Problem** (sometimes called the *Problem of the Unit* or the *Constitution of the Demos*).

  While you mentioned you are less interested in the label, knowing the term helps locate the literature. The classic formulation comes from Robert Dahl in *Democracy and Its Critics* (1989), who asked: "If the democratic process is to be justified, how is the *demos* itself to be constituted?"

  Here is a breakdown of how political theorists analyze the snag you've encountered, addressing your specific questions about its structure, its relation to majority tyranny, and whether the circle can be broken.

  ### 1. Is it one problem or two?
  It is best understood as **one structural problem manifesting through two conflicting normative principles.**

  *   **The Structural Problem (The Circularity):** This is the logical regress you identified. To vote on a rule, you need a voting procedure. To set the voting procedure, you need a vote. To hold that vote, you need to know who is eligible. But eligibility is what is being decided. This is the "Who decides who decides?" paradox.
  *   **The Normative Conflict (AAP vs. ASP):** The reason the circle feels so tight is that we lack agreement on the moral criterion for drawing the line. You correctly identified the two competing principles:
      1.  **The All-Affected Principle (AAP):** Everyone whose interests are significantly affected by the decision should have a say.
      2.  **The All-Subjected Principle (ASP):** Everyone who is subject to the coercive power of the rule should have a say.

  These are not two separate problems; the normative conflict *fuels* the structural circularity. If everyone agreed on one principle, the circle would be easier to cut (though not necessarily easy to apply). Because we oscillate between them, the boundary remains contested. For example, in your tenants' group case:
  *   **AAP:** The superintendent is affected (lives there), so he should vote.
  *   **ASP:** The superintendent is an employee bound by the landlord's rules, not the tenants' association's rules, so perhaps he shouldn't. Or, conversely, if the association's rules affect building maintenance, he is subject to them.

  The "snag" is that neither principle is self-executing. You need a democratic decision to decide which principle to use, which returns you to the circularity.

  ### 2. How does it relate to the "Tyranny of the Majority"?
  The Boundary Problem is **logically prior** to the Tyranny of the Majority.

  The worry about majority tyranny assumes the boundary is already drawn. It asks: *Once we know who the people are, how do we protect the minority within that group from the majority within that group?*

  The Boundary Problem asks: *Who is outside the circle being ruled by the people inside the circle?*

  Many theorists argue that the Boundary Problem is actually the more fundamental injustice. If you exclude renters from a neighborhood planning campaign (as in your third example), you aren't just risking a majority tyranny; you are engaging in **exclusionary tyranny**. You are subjecting people to rules (zoning, rent control, noise) without their consent.

  In this sense, the Boundary Problem is the "Tyranny of the Boundary." A perfectly democratic process inside a group can be wholly illegitimate if the group was constituted by excluding those most affected by its decisions. As the political theorist Frederick Whelan noted, democratic theory usually takes the existence of the group for granted, but in the real world, the definition of the group is often the most political act of all.

  ### 3. Can the circle be broken?
  This is the most contentious question. The standard view (held by Whelan and Dahl) is pessimistic: **No, not democratically.**

  They argue that the boundary of the demos cannot be settled democratically without circularity. Therefore, boundaries are usually settled by **pre-democratic facts**: history, geography, force, or accident. We live with the circle because we have to start somewhere.

  However, there are significant arguments that the circle can be broken, or at least loosened enough to stop strangling decision-making.

  **A. The "All-Subjected" Solution (Arash Abizadeh)**
  Philosopher Arash Abizadeh has argued that the circle *must* be broken democratically. He contends that because border regimes (who gets to be a member) are themselves coercive, the boundary itself must be subject to democratic justification by those affected by it.
  *   *The Break:* This implies open borders or, at minimum, that non-members must have a say in the rules that exclude them. It dissolves the circle by making the boundary porous and contestable.

  **B. The "Stakeholder" Solution (David Miller)**
  Some theorists suggest moving away from "affectedness" (which is too broad; everyone is affected by everything) or "subjection" (which is too rigid) toward **stakeholding**.
  *   *The Break:* Membership is granted to those who have a sustained interest in the continuity of the association. In your tenants' example, renters are stakeholders in the building's condition; shop owners might be stakeholders in foot traffic. This doesn't solve the circularity metaphysically, but it offers a pragmatic criterion that participants can agree on *before* voting.

  **C. The "Iterative" Solution (Habermas & Constitutional Patriots)**
  Jürgen Habermas and others suggest that the "People" do not exist prior to the decision; they constitute themselves *through* the process.
  *   *The Break:* The circle isn't a trap; it's a spiral. You start with a provisional boundary (e.g., "current leaseholders"). You make decisions. If those decisions outrage the excluded (e.g., renters protest), you revise the boundary. The legitimacy comes not from getting the boundary right the first time, but from keeping the boundary open to challenge.

  ### Summary for your disputes
  In your specific disputes (tenants, residents, planners), the reason you hit the snag is that you are trying to use a **democratic procedure** to solve a **constitutive question**.

  *   **The Diagnosis:** You are experiencing the Boundary Problem. The conflict between "affected" vs. "bound" is the normative engine driving the structural circularity.
  *   **The Relation to Tyranny:** This is more fundamental than majority tyranny. If the boundary is wrong, the majority's verdict is illegitimate regardless of how fair the voting count is.
  *   **The Way Out:** Theoretical consensus suggests you cannot vote on the boundary *as if it were a normal motion*. Instead, successful groups usually:
      1.  **Acknowledge the arbitrariness:** Admit that the initial boundary is provisional.
      2.  **Adopt a Stakeholder Standard:** Define membership by investment/residency/tenure rather than abstract rights.
      3.  **Create a Review Mechanism:** Allow the "excluded" (renters, shop owners) a consultative voice (testimony without vote) to legitimize the boundary without collapsing the decision-making structure.

  The circle cannot be broken by finding the "true" members, because there are no true members prior to the decision. It is broken by acknowledging that the boundary is a tool for action, not a truth to be discovered.
