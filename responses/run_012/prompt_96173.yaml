answer: |-
  The Truth-Teller is a genuinely distinct logical problem that breaks grounding rather than consistency, and whether a theory solving the Liar also solves the Truth-Teller depends entirely on which controversial framework you adopt.

  Here is the mechanical difference: the Liar sentence ("This sentence is false") forces a contradiction within classical logic—if it is true, it is false, and if it is false, it is true, causing the system to explode. The Truth-Teller ("This sentence is true") forces no contradiction; if it is true, it is true, and if it is false, it is false. The problem with the Truth-Teller is not that it breaks logic, but that logic cannot decide it; it is consistent but ungrounded, meaning its truth value depends on nothing but itself. Logicians often dismiss it because classical logic is designed to prevent contradictions at all costs, while underdetermination is merely an annoyance that leaves multiple models valid rather than destroying the system.

  Regarding your question about machinery: in some theories, solving the Liar solves the Truth-Teller for free, but in others, they require different treatments. In Kripke's theory of truth, both sentences are treated as "ungrounded" and assigned a truth-value gap, so one mechanism handles both. However, in Revision Theory (developed by Gupta and Belnap), the two behave differently during the process of evaluating truth: the Liar oscillates forever (true, false, true, false), while the Truth-Teller remains stable wherever you start it (if you assume it's true, it stays true; if false, it stays false). In this framework, the Liar is pathological, but the Truth-Teller is merely contingent, requiring your character to argue that the Truth-Teller reveals something deeper about the arbitrary nature of truth assignment that the Liar obscures.

  Your two-card scenarios are logically equivalent to the single-sentence versions, which is settled mathematics. The pair where Card A says "B is true" and Card B says "A is false" is the "Liar Cycle"; if you substitute B's claim into A's, you get "A says (A is false) is true," which collapses directly into the standard Liar paradox. The pair where both cards say the other is true is the "Truth-Teller Cycle"; substituting yields "A says (A is true) is true," which is the standard Truth-Teller. The circularity adds no new logical complexity; it just distributes the self-reference across two objects instead of one.

  Here is what is settled versus what is contested for your character's dialogue. It is settled fact that the Liar generates inconsistency while the Truth-Teller generates indeterminacy, and it is settled fact that the card cycles are equivalent to their single-sentence counterparts. What is genuinely contested is what this implies about truth itself: whether truth requires a "ground" in reality (making the Truth-Teller meaningless), whether truth is a revision process (making the Truth-Teller stable but arbitrary), or whether truth can tolerate contradictions (making the Liar acceptable but the Truth-Teller contingent). Your character is on solid ground claiming the Truth-Teller is neglected, but she would be wrong to claim it is logically identical to the Liar; her rant should focus on how the Truth-Teller proves truth can be empty, whereas the Liar proves it can be dangerous.
