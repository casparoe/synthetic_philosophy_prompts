  ### The Principle: Invariance Under Symmetry
  For any problem, you must identify the group of transformations $G$ that leaves the physical or geometric description invariant. The prior distribution must be invariant under $G$.
  *   **Finite Sets (Die):** Invariant under permutation. Haar measure is the counting measure, yielding a uniform distribution ($1/6$).
