      *   Reject (6)? Yes, by rejecting the premises leading to it.
      *   Address the asymmetry worry? Yes, this is the centerpiece.

  8.  **Final Polish:** Ensure tone is collegial but firm on the technical distinction. Use the quantifier shift explanation as it's the most rigorous way to show the asymmetry. Make sure to define what makes a credence function a "single option" (specifiability independent of the world).

