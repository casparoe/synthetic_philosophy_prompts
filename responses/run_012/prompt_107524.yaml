      *Refining the "Cost":* Does this introduce a problematic constraint? Some might argue it begs the question against the skeptic. But it's inherent to the decision-theoretic framework accuracy-first epistemology imports. You can't choose acts that are defined by the state of nature (e.g., "Bet on Horse X if Horse X wins"). Same logic applies here.

