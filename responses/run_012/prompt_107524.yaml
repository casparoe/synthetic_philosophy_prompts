      *   **The Argument:** A colleague presents a *reductio* against accuracy-first epistemology.
      *   **The Argument Structure:**
          1.  Dominance Principle: If $c'$ dominates $c$ (strictly better at some worlds, no worse at any), $c$ is irrational.
          2.  Let $c$ be any non-perfect credence function.
          3.  Consider the "Truth Function" ($t_w$): 1 for truths, 0 for falsehoods.
          4.  $t_w$ is perfectly accurate at world $w$.
          5.  Therefore, $t_w$ dominates $c$.
          6.  Therefore, $c$ is irrational. Only the Truth Function is rational.
          7.  Absurdity: Accuracy-first refutes itself (since no human can be the Truth Function).
      *   **Constraints:**
          *   User wants to keep (1) (Anti-Dominance Principle).
          *   User wants to keep the conclusion that *incoherent* credences are irrational (standard accuracy argument result).
          *   User *must* reject (6) (or a premise leading to it).
          *   **Crucial Question:** If the reply is "The Truth Function isn't a single option because it varies by world," why doesn't this kill the standard dominance argument for Probabilism (where the dominating function *is* a fixed assignment)?
          *   **Goal:** Identify the loose joint, explain the cost, and address the asymmetry concern regarding the probabilism argument.

  2.  **Deconstruct the Colleague's Argument:**
      *   The core move is in steps (3) and (4). It treats "The Truth Function" as a *single* alternative credence function available to the agent.
      *   In accuracy-first epistemology (specifically Joyce-style arguments), dominance is evaluated over a set of *available* or *admissible* credence functions.
      *   The "Truth Function" described is actually a *family* of functions, indexed by worlds. Let's call it $t_w$. At world $w_1$, $t_{w_1}$ assigns 1 to $p$ if $p$ is true at $w_1$. At world $w_2$, $t_{w_2}$ assigns 1 to $p$ if $p$ is true at $w_2$.
      *   If $p$ is contingent, $t_{w_1}(p) \neq t_{w_2}(p)$.
      *   Therefore, there is no *single* function $t$ such that $t(p) = 1$ iff $p$ is true *simpliciter*. There is only a mapping from worlds to functions.
      *   Dominance requires a single function $c'$ that is better than $c$ at all worlds.
      *   The colleague is conflating the *ideal* (omniscience) with an *option*.

  3.  **Address the Crucial Question (The Asymmetry):**
      *   *User's Worry:* If I say "The Truth Function isn't a single option," doesn't that also block the argument for Probabilism? In the Probabilism argument (Joyce 1998, 2009), we show that if $c$ is non-probabilistic, there exists a probabilistic $c^*$ that dominates it. Isn't $c^*$ also "fixed" while the world varies?
      *   *The Distinction:*
          *   **Truth Function ($t_w$):** Its definition *depends* on the world of evaluation. To specify the function, you need to know which world is actual. It is not definable independently of the world. It is *world-dependent*.
          *   **Probabilistic Fix ($c^*$):** Its definition is *independent* of the world of evaluation. It is determined solely by the algebra of propositions and the initial incoherent $c$. Once $c^*$ is specified, we check its accuracy across all worlds. It is *world-independent*.
      *   *Availability/Admissibility:* An option must be specifiable *ex ante* (before knowing the world). You can specify "Assign 0.6 to Rain" without knowing if it rains. You cannot specify "Assign 1 to Rain if it rains and 0 if it doesn't" as a *credence function* you can adopt now, because that instruction requires knowledge of the world to execute. That instruction describes a *policy* or a *mapping*, not a doxastic state.
      *   *The Cost:* Rejecting step (3)/(4) requires committing to a constraint on **Admissibility** or **Availability**. The set of options over which dominance is calculated must consist of functions that are *candidate doxastic states*, not functions that presuppose omniscience.

  4.  **Formulate the Reply:**
      *   **Identify the Flaw:** Step (3) and (4) equivocate on "The Truth Function." There is no single truth function. There is a truth function *for each world*.
      *   **Dominance Requirement:** Dominance requires a *single* alternative $c'$ that beats $c$ at *all* worlds.
      *   **The Move:** Reject the premise that the truth function is a *single available option*.
      *   **Addressing the Asymmetry (The Core Task):**
          *   Why is the probabilistic fix ($c^*$) a single option? Because it is defined structurally based on $c$ and the algebra, not based on truth values at worlds.
          *   Why is the truth function *not* a single option? Because to define it, you need to know the truth values, which vary by world. It is essentially the function $f(w, p) = 1$ if $p$ is true at $w$. A credence function must be $f(p)$.
          *   **Key Concept:** *Cognitive Availability* / *Ex Ante Specifiability*. An agent must be able to adopt the state without knowing which world is actual.
      *   **Cost:** You must accept a constraint on the domain of the dominance principle. Not all mathematically possible functions are epistemically available options. This is standard in decision theory (you can't choose an act that depends on the state of nature in a way you can't control).

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, is it just availability?* Some might argue "Omniscience is an ideal, why not compare against it?"
      *   *Reply:* Accuracy-first arguments are usually about *norms for finite agents*. But even for ideal agents, the "Truth Function" isn't a *state*, it's a *relation* between states and worlds.
      *   *Joyce's Response:* Joyce (1998, 2009) explicitly addresses this. He calls it the "Omniscience Objection." His reply is exactly that the omniscient credence function is not a *single* function across the set of worlds.
      *   *The Probabilism Argument:* In the dominance argument for probabilism, we prove: For any incoherent $c$, there exists a coherent $c^*$ such that for all $w$, Accuracy($c^*, w$) > Accuracy($c, w$). Note that $c^*$ is fixed *before* quantifying over $w$.
      *   *The Colleague's Argument:* They claim: For any $c$, there exists a $t$ such that for all $w$... But $t$ depends on $w$. The quantifier order is wrong. It should be: There exists a $t$ such that for all $w$... But there is no such $t$. There is only: For all $w$, there exists a $t_w$...
      *   *Quantifier Shift Fallacy:* This is the technical logical error. $\forall w \exists c' (\text{Better}(c', c, w))$ does not imply $\exists c' \forall w (\text{Better}(c', c, w))$.

  6.  **Drafting the Response:**
      *   **Direct Answer:** Reject Step (3) and (5). The "Truth Function" is not a single credence function.
      *   **The Logical Error:** Quantifier shift.
      *   **The Asymmetry:** Explain the difference between a function defined *structurally* (probabilistic fix) vs. *substantively/world-dependently* (truth function).
      *   **The Cost:** You need a principle of **Admissibility/Availability**. Dominance only applies over functions that can be adopted without knowing the world.
      *   **Impact on Architecture:** Minimal cost. This is standard Joyce/Pettigrew orthodoxy. It doesn't threaten the probabilism argument.

