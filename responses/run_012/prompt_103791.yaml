answer: |-
  **MEMORANDUM**

  **TO:** The Board of Directors
  **FROM:** Research Director
  **DATE:** October 26, 2023
  **SUBJECT:** Strategic Priorities for the Three-Year Grant on Imprecise Probabilities

  ### Executive Summary

  We have been tasked with allocating resources across a fragmented field. Imprecise probabilities (IP) are not a monolith; they are a toolkit currently lacking a unified instruction manual. Our mandate prioritizes *foundational clarity* over immediate application, yet requires that the output eventually be usable by system builders and economists.

  To satisfy these constraints, we cannot treat the identified research clusters as independent silos. They are hierarchically dependent. You cannot determine how to act on a belief (Decision Theory) until you know how that belief changes over time (Dynamics), and you cannot model belief change until you agree on what a belief state *is* and what constraints govern it (Foundations/Coherence).

  Accordingly, I propose the following ranking of priorities for the next three years. This ranking is based on **upstream dependency** (logical priority), **tractability** for our mixed team, and **bottleneck analysis** (which problems, if unsolved, render the others useless).

  ---

  ### Priority 1: Operational Foundations and Coherence
  *(Synthesizing the "Foundational Question" and the "Technical Cluster" on Coherence)*

  **Rank:** 1 (Highest Priority)
  **Resource Allocation:** 2 Researchers (1 Philosopher, 1 Mathematician)

  **Defense:**
  This is the most upstream category. The prompt asks what an imprecise credal state *represents* (indeterminacy vs. incomplete evidence vs. introspective failure). I submit that for our goals, the metaphysical version of this question is a **pseudo-question**. Whether the world is indeterminate or our evidence is merely incomplete matters less than how the agent is *permitted to behave* given that state.

  Therefore, we will prioritize **Operational Coherence** (Dutch-book arguments and behavioral dispositions) over metaphysical interpretation. If we cannot define the coherence conditions that prevent a user of IP from being exploited, the rest of the framework is normatively toothless. This aligns with the "usability" goal: system builders need to know the safety guarantees (coherence) before they need to know the metaphysics.

  *   **Upstream Status:** Absolute bedrock. Decision rules and updating rules are judged by whether they preserve coherence.
  *   **Tractability:** High. Our philosophers and mathematicians can make rapid progress on formalizing coherence conditions for sets of probabilities (e.g., avoiding sure loss vs. strict coherence).
  *   **Neglect:** Moderate. While Walley and others have done work here, there is no consensus on which coherence standard is appropriate for *foundational* work versus *engineering* work.
  *   **Success Metric (Year 1-2):** A unified white paper establishing the institute's stance on the "meaning" of credal sets via their behavioral constraints, resolving the tension between evidential and behavioral interpretations.
  *   **Risk:** Getting bogged down in semantic debates. *Mitigation:* We will explicitly bracket metaphysical indeterminacy and focus on normative constraints on the agent.

  ### Priority 2: Dynamics, Independence, and Dilation
  *(Synthesizing the "Dynamic Question" and the "Technical Cluster" on Independence)*

  **Rank:** 2 (Critical Bottleneck)
  **Resource Allocation:** 3 Researchers (2 Mathematicians, 1 Philosopher)

  **Defense:**
  This is the primary technical barrier to adoption. The phenomenon of **dilation**—where conditioning on new evidence *increases* imprecision rather than reducing it—is the single biggest reason practitioners abandon IP. If a learning system becomes *less* certain after receiving data, it is useless for robust control or economic modeling.

  Furthermore, the definition of **independence** in IP is notoriously fractured (strong independence, epistemic independence, etc.). You cannot update a credal set without a definition of independence. This makes Dynamics and Technical Independence inseparable; attempting to study updating without fixing a definition of independence is impossible.

  *   **Upstream Status:** Downstream of Foundations (you must know what the set is to update it), but strictly Upstream of Decision Theory (you cannot decide based on beliefs that haven't been updated to the current evidence).
  *   **Tractability:** Medium-Low. This is hard mathematics. Dilation is a known structural feature of IP, not just a bug. "Solving" it may require restricting the class of allowable credal sets.
  *   **Neglect:** High. Many papers identify dilation; few offer principled, general solutions that preserve the benefits of IP.
  *   **Success Metric (Year 2-3):** A proposed updating rule (or class of rules) that minimizes dilation in canonical cases, accompanied by a formal definition of independence compatible with that rule.
  *   **Risk:** Proving that dilation is unavoidable under our chosen coherence conditions. *Contingency:* If unavoidable, we pivot to characterizing the *rate* of dilation as a cost metric for system designers.

  ### Priority 3: Decision Rules and Rational Action
  *(The "Decision-Theoretic Question")*

  **Rank:** 3 (Interface with Application)
  **Resource Allocation:** 2 Researchers (2 Economists/Mathematical Psychologists)

  **Defense:**
  This is where the framework meets the user. However, I rank it third because the choice of decision rule (Maximin, $\alpha$-maxmin, E-admissibility) is constrained by the output of Priorities 1 and 2. For example, if our work on Dynamics (Priority 2) suggests that credal sets widen significantly over time, a Maximin rule might lead to pathological paralysis. The economists on our team need the formal structure of the credal sets (from Priority 1 & 2) to axiomatize the choice functions.

  *   **Upstream Status:** Downstream. It consumes the output of Foundations and Dynamics.
  *   **Tractability:** High. Economists are well-trained in axiomatic decision theory.
  *   **Neglect:** Low. There is a surfeit of proposed rules. The neglect lies in *matching* specific rules to specific dynamic environments.
  *   **Success Metric (Year 3):** A representation theorem linking our preferred coherence/updating framework to a specific family of decision rules, providing a "recommended configuration" for modelers.
  *   **Risk:** Producing a rule that is theoretically sound but computationally intractable. *Mitigation:* Continuous feedback with the technical team on complexity.

  ### Priority 4: Social Choice and Group Uncertainty
  *(Extension of the "Technical Cluster")*

  **Rank:** 4 (Exploratory)
  **Resource Allocation:** 1 Researcher (Philosopher/Economist)

  **Defense:**
  Extending IP to groups (aggregating credal sets) is fascinating and highly neglected. However, it is logically downstream of individual rationality. We cannot model group disagreement or aggregation until we have settled how a *single* agent handles imprecision. If we prioritize this too early, we risk building a theory of social choice on top of an unstable theory of individual choice.

  *   **Upstream Status:** Furthest downstream.
  *   **Tractability:** Medium.
  *   **Neglect:** Very High. This is the "blue ocean" of the project.
  *   **Success Metric (Year 3):** A working paper outlining the difficulties of aggregating imprecise credences given our findings in Priorities 1-3.
  *   **Risk:** Distraction. *Mitigation:* This researcher will also serve as a "integrator," ensuring Priorities 1-3 remain consistent with each other.

  ---

  ### On Separability and Pseudo-Questions

  **1. The Metaphysics of Indeterminacy:**
  I argue that the question *"Does the set represent world indeterminacy or evidence incompleteness?"* is largely a **pseudo-question** for our purposes. In both cases, the mathematical behavior of the set (its lower and upper previsions) and the coherence constraints (avoiding Dutch books) remain identical. Pursuing this as a primary research line would consume resources without yielding usable tools. We will treat the credal state as an **operational representation of commitment**, sidestepping the metaphysics.

  **2. Independence and Dynamics:**
  These are **not separable**. In precise probability, conditionalization is standard, and independence is defined via the product rule. In IP, there are multiple non-equivalent definitions of independence (e.g., epistemic vs. stochastic), and each dictates a different updating rule. We must treat "Dynamics and Independence" as a single work package.

  **3. Decision Theory and Interpretation:**
  These are partially separable but deeply entangled. One can study Maximin rules abstractly. However, to *defend* Maximin as the *correct* rule for IP, one usually relies on the interpretation of the credal set (e.g., as a set of plausible priors). Our work in Priority 1 will constrain the plausible arguments available for Priority 3.

  ### Conclusion

  This ranking prioritizes **structural integrity** over **feature completion**. If we produce a library of decision rules (Priority 3) that are incompatible with robust updating (Priority 2) or lack coherent justification (Priority 1), we will have produced noise, not foundations.

  By front-loading the work on Coherence and Dynamics, we ensure that when our economists and external partners eventually adopt our decision-theoretic tools, they are building on a stable substrate. This approach best honors the grant's mandate for foundational work while keeping the path to usability clear.

  **Recommended Immediate Action:**
  Authorize the hiring of two mathematical logicians/probabilists for Priority 2 and one philosopher of science for Priority 1 to begin the coherence/updating synthesis immediately.

  **Research Director**
  *Institute for Foundations of Uncertainty*
