answer: |-
  It is impressive that you and your friend have reconstructed a sophisticated framework for judging science without formal training. The mutual friend who mentioned Lakatos was correct: your friend's verdicts align remarkably well with the **Methodology of Scientific Research Programmes** developed by the philosopher Imre Lakatos in the 1970s.

  Here is the breakdown of your questions, based on the pattern of her verdicts.

  ### 1. What will she say about the new case?

  She will almost certainly rule this case **Progressive**.

  **Why?**
  Although the proposal of the new particle (the neutrino) began as a "desperate repair" to save a cherished principle (conservation of energy), it matches the structure of her **Case (2) (Neptune)** rather than **Case (1) (Cold Fusion)** or **Case (4) (Aether)**.

  In Case (1) and (4), the defenders added conditions that explained the failure but predicted nothing *new* that was subsequently found. In your new case, the "repair" did not just explain the missing energy; it gave the particle definite properties and implied it could be caught or would show up in other reactions. The prompt states: *"those implications were later confirmed."*

  For your friend, the "desperation" of the initial idea matters less than the **novel predictive success** that follows. Because the "patch" led to new discoveries, she will view it as a progressive move, not a degenerating one.

  ### 2. Which rules fit her verdicts so far?

  There are three main rules (hypotheses) that could explain her past four verdicts.

  **Rule A: The Lakatosian Rule (Novel Success)**
  *   **Definition:** A research programme is *progressive* if its modifications lead to the discovery of novel facts (predictions that were not used to build the theory). It is *degenerating* if modifications are made only to explain away anomalies without predicting anything new.
  *   **Fit:** Fits all four cases perfectly.
      *   (1) Cold Fusion: Added conditions, no new facts → Degenerating.
      *   (2) Neptune: Predicted a new location, planet found → Progressive.
      *   (3) Failed Test: No modifications made, programme abandoned → Dead.
      *   (4) Aether: Added properties, no new facts (rival won) → Degenerating.

  **Rule B: The Rivalry Rule**
  *   **Definition:** A programme is *degenerating* only if there is a rival theory that explains the same data more simply or successfully. If there is no rival, patching is acceptable.
  *   **Fit:** Fits Cases (1) and (4) well, as both mention a rival account. However, it struggles with Case (2). When Neptune was predicted, there was no "rival" to Newtonian gravity; it was the only game in town. Yet she called it Progressive. This suggests rivalry is not the primary rule.

  **Rule C: The Plausibility Rule**
  *   **Definition:** A programme is *degenerating* if the modifications required become too complex, "desperate," or implausible (e.g., a medium that contracts bodies by exactly the right amount).
  *   **Fit:** Fits Cases (1) and (4). However, it conflicts with the new case. The neutrino was considered "desperate" and implausible at the time (a particle passing through Earth unnoticed?). If she rules the new case *Progressive*, this rule is disproven.

  ### 3. Which rule is she most likely running?

  She is most likely running **Rule A (The Lakatosian Rule)**.

  The key indicator is that she distinguishes between "Dead" (Case 3) and "Degenerating" (Cases 1 & 4). In Lakatos's system, a programme is only *degenerating* if defenders stay and patch the theory *without* empirical success. If they leave, it is simply dead. A simple "Rivalry" or "Plausibility" rule doesn't necessarily capture this distinction about the *behavior of the defenders* combined with *predictive success*.

  Furthermore, her verdict on Case (2) (Neptune) is the strongest evidence. Positing a new planet to save a theory could be seen as a "desperate patch" (Rule C) or an *ad hoc* fix. The only reason to call it *Progressive* is that the prediction was **confirmed**. This confirms that for her, **outcome trumps intent.**

  ### 4. Which earlier verdict does the most to show it?

  **Case (2): The prediction of the planet (Neptune).**

  This is the critical verdict.
  *   In Cases (1) and (4), theories were patched and failed.
  *   In Case (3), a theory failed and was dropped.
  *   In Case (2), a theory was **patched** (Newtonian gravity needed an adjustment to account for Uranus) and **succeeded**.

  If she believed that "patching a theory is always bad" (a common misconception about science), she would have called Case (2) *Degenerating*. By calling it *Progressive*, she signals that the moral status of a "repair" depends entirely on whether it yields new, confirmed knowledge. This is the exact logic required to judge the Neutrino case as Progressive.

  ### 5. What further case would best tell those rules apart?

  To distinguish Rule A (Novel Success) from Rule B (Rivalry) and Rule C (Plausibility), you need a case where a theory makes a successful novel prediction, but the "patch" seems implausible, or there is no rival.

  **The Test Case: The Planet Vulcan.**

  **The Scenario:**
  In the 19th century, astronomers noticed irregularities in the orbit of Mercury (just like Uranus in Case 2). To save Newtonian gravity, they proposed a new planet, *Vulcan*, orbiting inside Mercury's path.
  *   **The Patch:** Positing an invisible planet (similar to Neptune).
  *   **The Prediction:** It should be visible during solar eclipses.
  *   **The Outcome:** It was never found. The anomaly was later explained by Einstein's General Relativity, which modified the theory of gravity itself rather than adding a planet.

  **Why this distinguishes the rules:**
  *   **If she calls it *Progressive* (initially):** She values the *attempt* to predict novel facts, even if they fail later.
  *   **If she calls it *Degenerating*:** She values the *confirmation* of the prediction (Rule A). This would confirm that the Neutrino case is Progressive only because it was *found*, not just because it was predicted.
  *   **If she says it depends on Relativity:** She is relying on the existence of a Rival (Rule B).

  **Alternative Test Case: The Higgs Boson (Modern).**
  *   **The Scenario:** The Standard Model of particle physics required particles to have no mass. Evidence showed they had mass.
  *   **The Patch:** A "field" that gives mass (the Higgs mechanism). Critics called it *ad hoc* and implausible (Rule C).
  *   **The Prediction:** A specific particle should appear at a specific energy.
  *   **The Outcome:** Found in 2012.
  *   **The Test:** If she calls this *Progressive*, she has firmly rejected the "Plausibility Rule" (Rule C) and confirmed the "Novel Success Rule" (Rule A), just as she should with the Neutrino.

  ### Summary for your argument
  You can tell your friend that her reasoning mirrors Imre Lakatos's **Methodology of Scientific Research Programmes**. She judges theories not by whether they are "true" or "simple," but by whether they are **growing** (predicting new things) or **shrinking** (explaining away old failures).

  On the neutrino case, she should say **Progressive**, because like Neptune, the "rescue device" turned out to be a discovery machine. If you want to test her consistency, ask her about **Vulcan**: it was the same move as Neptune, but because the prediction failed, it marks the point where Newtonian astronomy began to *degenerate* before Einstein replaced it.
