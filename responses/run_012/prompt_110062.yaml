prompt: |-
  I'm a third-year PhD student in ML, mostly working on RLHF and preference modeling, and I keep getting dragged into this argument at reading group about whether reward models are "just" doing utilitarian social choice. Someone brought up Harsanyi's aggregation theorem and I realized I can only half-reconstruct it. I took one grad seminar on decision theory back in my master's so I can follow the math if you don't skip steps, but I don't know the moral philosophy literature at all. Here's the theorem as I remember it: if each individual's preferences over lotteries satisfy expected utility, and the social preference order does too (or at least is a continuous weak order that respects Pareto), then the social welfare function has to be a weighted sum of the individuals' utilities. Then Harsanyi adds a separate move on top, something about a rational agent behind a veil of ignorance assigning equal probability to being each person, which is what pins the weights to equal and gets you to utilitarianism proper rather than just "some weighted sum." Tell me if I'm mangling any of that.

  What I want: restate that whole thing as faithfully as you can in the vocabulary I actually use day to day — reward models, chosen/rejected pairs, Bradley-Terry and Plackett-Luce losses, rater pools, the KL penalty to the reference policy, the fact that we're fitting a single scalar function to a pile of pairwise labels. Go step by step and flag where you're fudging. Don't hand me a pretty analogy and call it a translation; I care about the parts that don't carry over.

  Then the residue report, which is the part I actually care about. Which axioms survive the trip and which don't? My guess is Pareto is roughly "we don't flip preferences the raters unanimously agree on" and pretty much everything else either gets distorted or just vanishes — the veil of ignorance especially, since my "individuals" are annotators from a labeling vendor and nobodys assigning equal probability to being one of them. So is the equiprobability move just gone, or is there some faint counterpart in how we sample and weight raters? And the reverse direction, which I'm more curious about: is there stuff RLHF does that Harsanyi's setup can't even state — the KL term tethering the policy to the base model, the fact that the "social preference" we learn doesn't have to be a coherent ordering at all, the fact that we're aggregating preferences over the model's outputs rather than over world-states? Last thing: I want to know if the "RLHF = utilitarian aggregation" line is doing real work, or if the alignment folks who say it are just unknowingly re-deriving the classic objections to Harsanyi — the ex ante vs. ex post thing where the ex-ante framework happily picks a coin flip that the ex-post view recoils from, and the impartiality vs. impersonality complaint about the veil. If it's the latter, just say so. I'd rather find out we're reinventing wheels than get a tidy false map.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** 3rd-year PhD student in ML (RLHF/Preference Modeling). Strong math background (can follow decision theory math), familiar with ML jargon (Bradley-Terry, KL penalty, reference policy, etc.), weak on moral philosophy literature.
      *   **Core Task:** Restate Harsanyi's Aggregation Theorem + Veil of Ignorance argument using RLHF/ML vocabulary.
      *   **Specific Requirements:**
          *   Faithful restatement (no skipping math steps).
          *   Flag where the analogy breaks ("fudging").
          *   "Residue Report": Which axioms survive? Which break? (Pareto, Veil of Ignorance/Equiprobability).
          *   Reverse direction: What does RLHF do that Harsanyi can't state? (KL penalty, incoherent orderings, output vs. world-state).
          *   Critical Evaluation: Is "RLHF = Utilitarian Aggregation" doing real work, or just reinventing classic objections (ex ante vs. ex post, impartiality vs. impersonality)?
      *   **Tone:** Technical, precise, critical, no fluff, no "pretty analogies."

  2.  **Deconstruct Harsanyi's Argument (Mental Check):**
      *   *Theorem:* Individual utilities $u_i$ (von Neumann-Morgenstern). Social welfare function $W$. If $W$ satisfies Pareto (if everyone prefers $A$ to $B$, society prefers $A$ to $B$) and VNM rationality (independence, continuity, etc.), then $W = \sum w_i u_i$.
      *   *Ethical Add-on:* Veil of Ignorance. A rational chooser doesn't know who they will be. If they assign equal probability $1/N$ to being person $i$, they maximize expected utility $\frac{1}{N} \sum u_i$. This sets $w_i$ equal.
      *   *Result:* Classical Utilitarianism.

  3.  **Translate to RLHF Vocabulary:**
      *   *Individuals:* Annotators/Raters ($i = 1 \dots N$).
      *   *Alternatives:* Model outputs/prompts ($x, y$).
      *   *Preferences:* Pairwise comparisons ($y \succ_i x$).
      *   *Individual Utility:* Latent reward function $r_i(x)$ for annotator $i$.
      *   *Social Preference:* The learned Reward Model $R_\theta(x)$.
      *   *Lotteries:* Stochastic policies $\pi(y|x)$.
      *   *Pareto:* If all raters prefer $y$ over $x$, $R_\theta(y) > R_\theta(x)$.
      *   *VNM Axioms:* The Reward Model outputs a scalar score that implies a linear ordering over distributions of outputs (expected reward).
      *   *Aggregation:* The loss function (e.g., Bradley-Terry) minimizing disagreement with the pool.
      *   *Veil of Ignorance:* Sampling raters uniformly during training? Or the assumption that the "general public" is the target?

  4.  **Drafting the Restatement (Step-by-Step):**
      *   *Setup:* We have a dataset $D = \{(x, y, z, i)\}$ where $i$ is rater ID, $y \succ_i z$.
      *   *Individual Rationality:* Assume each rater $i$ behaves according to a latent reward $r_i$ + noise (Bradley-Terry: $P(y \succ_i z) = \sigma(r_i(y) - r_i(z))$). This is the VNM equivalent (preferences over lotteries map to expected scalar reward).
      *   *Social Rationality:* We fit a single global reward model $R_\theta$. We assume $R_\theta$ also ranks lotteries by expected value (linearity).
      *   *Pareto:* If $P(y \succ_i z) \approx 1$ for all $i$, then $R_\theta(y) > R_\theta(z)$.
      *   *Theorem Conclusion:* $R_\theta(x) \approx \sum w_i r_i(x)$.
      *   *The "Veil":* In RLHF, we usually sample raters uniformly from the pool during minibatch construction. This implies $w_i = 1/N$.
      *   *Flagging Fudge:* Raters aren't VNM rational agents; they are noisy labelers. The "lottery" is the policy $\pi$, not a world-state gamble.

  5.  **Drafting the Residue Report (Axiom Check):**
      *   *Pareto:* Survives roughly. If the loss converges, unanimous preferences drive the gradient. But capacity limits or regularization might violate strict Pareto.
      *   *VNM/Independence:* Broken. Reward models are often trained on deterministic pairs. We assume linearity over policy distributions, but we rarely test if $R(\alpha \pi_1 + (1-\alpha)\pi_2) = \alpha R(\pi_1) + (1-\alpha)R(\pi_2)$.
      *   *Veil/Equiprobability:* This is the weak point. Uniform sampling of rater IDs *looks* like equiprobability, but it's not ethical impartiality. It's just empirical frequency or vendor allocation. If the vendor pool is biased, $w_i$ isn't ethically equal, it's demographically skewed.
      *   *Weights:* In practice, we often don't even track rater IDs. We pool all labels. This assumes $r_i = r$ (homogeneity) rather than $R = \sum r_i$. This violates the aggregation theorem's premise (distinct utilities).

  6.  **Drafting the Reverse Direction (RLHF specific vs. Harsanyi):**
      *   *KL Penalty:* Harsanyi aggregates preferences over outcomes. RLHF optimizes $R_\theta(x) - \beta \text{KL}(\pi || \pi_{ref})$. The "social welfare" includes a penalty for deviating from the prior. Harsanyi doesn't have a "status quo inertia" term in the aggregation itself.
      *   *Incoherence:* Harsanyi requires a transitive social ordering. RLHF reward models can be intransitive (cycling preferences) if the data is contradictory, though the scalar output forces a transitive projection.
      *   *Outputs vs. World States:* Harsanyi aggregates over *consequences*. RLHF aggregates over *text completions*. The mapping from text to consequence is unknown. This is a massive semantic gap.

  7.  **Drafting the Critical Evaluation (Is it doing work?):**
      *   *Reinventing Wheels:* Yes. The "ex ante vs. ex post" critique (Diamond, 1967) applies directly.
          *   *Ex Ante:* Maximize expected reward before knowing which rater you are (or which prompt you get).
          *   *Ex Post:* Minimize regret for specific raters on specific items.
      *   *Impartiality:* Uniform rater sampling is not moral impartiality. It's statistical convenience.
      *   *Conclusion:* The claim "RLHF is Utilitarian" is technically true in the *functional form* (linear sum of latent rewards) but ethically empty because the inputs (rater preferences) aren't validated as "welfare" and the weights (sampling) aren't validated as "impartial." It's Utilitarianism without the moral justification, just the math structure.

  8.  **Refining and Polishing:**
      *   *Check Tone:* Ensure it sounds like a peer discussion, not a lecture.
      *   *Check Math:* Ensure the Bradley-Terry connection to VNM is clear (log-odds = reward difference).
      *   *Check Constraints:* Did I answer the "Veil" question specifically? Yes (uniform sampling vs. ethical weight). Did I address the KL term? Yes.
      *   *Self-Correction during drafting:* I initially thought about saying RLHF *is* utilitarian. I need to be more precise: it *minimizes a loss function equivalent to maximizing a weighted sum of latent utilities under specific noise assumptions*. But the "weights" are implicit.
      *   *Crucial Distinction:* Harsanyi aggregates *utilities*. RLHF aggregates *preferences*. We infer utilities via BT. This inference step assumes a specific noise model (logistic). Harsanyi assumes utilities are given or measurable. This is a key "fudge."

  9.  **Final Review against User Prompt:**
      *   "Restate... in vocabulary I actually use": Check (Reward models, BT, KL, etc.).
      *   "Flag where you're fudging": Check (Rater rationality, ID tracking).
      *   "Residue report": Check (Pareto, Veil, KL, World-states).
      *   "Real work or reinventing wheels": Check (Ex ante/ex post, impersonality).

  10. **Final Output Generation** (Proceed to write response based on these structured thoughts).
answer: |-
  Here is the translation of Harsanyi's argument into the RLHF stack, followed by the residue report on what breaks and what the "Utilitarian RLHF" claim actually buys you.

  ### Part 1: Harsanyi's Aggregation Theorem in RLHF Vocabulary

  **The Setup**
  *   **Agents:** You have a pool of $N$ annotators (raters). In Harsanyi, these are "individuals" with moral standing. In RLHF, they are crowdworkers from a vendor.
  *   **Alternatives:** Let $\mathcal{Y}$ be the space of model outputs (completions) for a fixed prompt $x$.
  *   **Preferences:** Each rater $i$ provides pairwise labels $y \succ_i z$.
  *   **Latent Utilities:** Assume each rater $i$ has a latent reward function $r_i: \mathcal{Y} \to \mathbb{R}$.
  *   **Noise Model (VNM Equivalent):** We assume raters satisfy the axioms of Expected Utility Theory (EUT) over lotteries of outputs. In practice, we model this via Bradley-Terry (BT). The probability rater $i$ prefers $y$ over $z$ is:
      $$ P(y \succ_i z) = \sigma(r_i(y) - r_i(z)) $$
      This is the RLHF equivalent of saying preferences over lotteries are representable by a linear functional (expected utility). The logistic link function is the specific parametrization of the "continuous weak order."

  **The Social Welfare Function (The Reward Model)**
  *   **Global Reward:** We fit a single scalar function $R_\theta(y)$ (the Reward Model) to the aggregate dataset $D = \bigcup_i D_i$.
  *   **Social Rationality:** We assume $R_\theta$ also represents a preference order satisfying EUT. That is, for a stochastic policy $\pi(y|x)$, the value is $V(\pi) = \mathbb{E}_{y \sim \pi}[R_\theta(y)]$. This implies $R_\theta$ is linear in probabilities (the "independence axiom").
  *   **Pareto Condition:** If for all $i$, $r_i(y) > r_i(z)$ (unanimous preference), then $R_\theta(y) > R_\theta(z)$. In training dynamics, this means the gradient signal from all raters pushes $R_\theta(y)$ up and $R_\theta(z)$ down.

  **The Theorem (Aggregation)**
  Harsanyi's theorem states that if Individual Preferences and Social Preference satisfy VNM axioms, and Social Preference satisfies the Pareto principle, then $R_\theta$ must be an affine transformation of a weighted sum of individual utilities:
  $$ R_\theta(y) = \sum_{i=1}^N w_i r_i(y) + C $$
  In RLHF terms: **If your reward model converges on a pool of raters who behave like expected utility maximizers, and your reward model respects unanimous agreement, your reward model is implicitly learning a linear combination of the raters' latent reward functions.**

  **The "Veil of Ignorance" Move (Pinning the Weights)**
  *   **Harsanyi:** A rational chooser behind a veil of ignorance assigns probability $1/N$ to being any individual $i$. To maximize their own expected utility, they maximize $\frac{1}{N} \sum r_i$. This sets $w_i = 1/N$ (Classical Utilitarianism).
  *   **RLHF Translation:** During training, we construct minibatches by sampling rater IDs.
      *   If we sample rater IDs uniformly ($i \sim \text{Uniform}(1, N)$), we are implicitly setting $w_i = 1/N$.
      *   The loss function (Negative Log Likelihood on pairwise comparisons) becomes:
          $$ \mathcal{L}(\theta) = - \mathbb{E}_{i \sim \text{Uniform}} \mathbb{E}_{(y,z) \sim D_i} [\log \sigma(R_\theta(y) - R_\theta(z))] $$
      *   **The Claim:** Uniform sampling of annotators is the computational instantiation of the Veil of Ignorance. It forces the model to treat every rater's loss gradient with equal weight.

  **Where I am Fudging (Critical Flags)**
  1.  **Rater Rationality:** Harsanyi assumes individuals are VNM-rational. Annotators are noisy, often intransitive, and subject to fatigue. The BT model assumes *noise*, not *irrationality*, but if the noise is systematic (bias), the "utility" $r_i$ is contaminated.
  2.  **ID Tracking:** Standard RLHF pipelines often discard rater IDs after labeling, pooling all $(y, z)$ pairs into one bucket. This assumes $r_i = r_j$ (homogeneity) rather than $R = \sum r_i$ (aggregation). If you don't track IDs, you can't even state the theorem, let alone satisfy it. You are fitting a "representative agent," not aggregating distinct utilities.
  3.  **Lotteries:** Harsanyi's theorem relies on preferences over *lotteries* (probability distributions). RLHF data is almost exclusively deterministic pairs. We *assume* the scalar $R_\theta$ generalizes to expectations over $\pi$, but we never test the independence axiom on the reward model itself.

  ---

  ### Part 2: The Residue Report

  Here is what survives the translation and what evaporates.

  #### 1. The Pareto Axiom
  *   **Status:** **Distorted.**
  *   **Analysis:** In theory, if all raters prefer $y \succ z$, the gradient for $R_\theta(y) - R_\theta(z)$ is strictly positive. However, in practice, we have:
      *   **Capacity Constraints:** $R_\theta$ might not have the expressivity to satisfy all unanimous preferences if they conflict across different prompts.
      *   **Regularization:** We often regularize $R_\theta$ (e.g., weight decay). This can shrink the margin on unanimous preferences.
      *   **Outliers:** If "unanimous" means 99% of raters, standard BT loss treats the 1% dissent as signal, not noise. Harsanyi's Pareto is strict; RLHF is statistical.
  *   **Verdict:** It survives as a tendency, not a constraint.

  #### 2. The Veil of Ignorance (Equiprobability)
  *   **Status:** **Gone / Replaced by Sampling Bias.**
  *   **Analysis:** You guessed correctly. Uniform sampling of rater IDs is not ethical impartiality; it is empirical frequency.
      *   If your vendor pool is 80% Global North and 20% Global South, uniform sampling over *rater IDs* gives equal weight to those demographics, but uniform sampling over *labels* (if North raters label more) does not.
      *   More critically: Harsanyi's veil requires the chooser to care about the *welfare* of the individuals. In RLHF, we care about the *accuracy* of the preference prediction.
      *   **The Counterpart:** The closest RLHF equivalent is **Group DRO (Distributionally Robust Optimization)** or explicit re-weighting of rater groups. If you explicitly re-weight underrepresented raters to minimize worst-group loss, you are making a normative claim closer to Rawls (Maximin) than Harsanyi (Utilitarian). Standard RLHF is just "Average Group Loss," which matches Harsanyi's math but lacks the ethical justification.
  *   **Verdict:** The math holds (linear sum), but the justification (impartiality) is absent. It's utilitarianism by accident of minibatch construction.

  #### 3. The KL Penalty (The Reverse Direction)
  *   **Status:** **Harsanyi Cannot State This.**
  *   **Analysis:** RLHF optimization is:
      $$ \max_\pi \mathbb{E}_{y \sim \pi}[R_\theta(y)] - \beta \text{KL}(\pi || \pi_{\text{ref}}) $$
      Harsanyi aggregates preferences over *outcomes*. He does not have a term for "cost of changing behavior."
      *   The KL term acts as a **status quo bias**. It says: "Even if the aggregated social preference $R_\theta$ prefers $y$, do not move to $y$ if it is too far from the base model's distribution."
      *   In social choice terms, this is like saying: "Maximize social welfare, but penalize deviations from the previous administration's policy." Harsanyi's theorem has no place for inertia.
      *   **Implication:** The final policy $\pi^*$ is *not* purely utilitarian with respect to the raters. It is a compromise between Rater Utilitarianism and Model Prior Entropy.

  #### 4. Outputs vs. World States
  *   **Status:** **Category Error.**
  *   **Analysis:** Harsanyi aggregates preferences over *consequences* (world states). RLHF aggregates preferences over *text completions*.
      *   We assume $y \to \text{Consequence}$ is deterministic or known. It is not.
      *   If Rater A prefers "Write a phishing email" (because they are testing safety) and Rater B prefers "Refuse" (because they value safety), $R_\theta$ averages these.
      *   Harsanyi assumes individuals know their own interests. In RLHF, raters often do not know the downstream consequence of the text.
      *   **Verdict:** We are aggregating *signals*, not *welfare*. This is the biggest break.

  ---

  ### Part 3: Is the "RLHF = Utilitarian" Line Doing Real Work?

  **Short Answer:** No. It is reinventing wheels, specifically the **Ex Ante vs. Ex Post** objection and the **Impersonality** objection.

  **1. The Ex Ante vs. Ex Post Objection (Diamond, 1967)**
  *   **The Objection:** Harsanyi's framework is *ex ante* (before you know who you are). But justice might require *ex post* equity (minimizing disparity in outcomes for specific people).
  *   **RLHF Reinvention:**
      *   **Ex Ante:** Standard RLHF minimizes average loss across all raters (Utilitarian). It allows sacrificing a minority of raters' preferences if it fits the majority better (e.g., cultural biases).
      *   **Ex Post:** If you evaluate your reward model on "worst-case rater regret," you are rejecting Harsanyi.
      *   **The Wheel:** Alignment folks arguing for "fairness across rater demographics" are essentially rediscovering the critique that Harsanyi's aggregation ignores distribution. If you claim RLHF is Utilitarian, you must accept that it is permissible to completely ignore a minority rater's preferences if the majority is strong enough. Most alignment researchers *don't* want to accept that, which means they don't actually believe the Utilitarian claim they are making.

  **2. Impartiality vs. Impersonality**
  *   **The Objection:** Harsanyi's veil creates *impartiality* (I don't know who I am). But it results in *impersonality* (I am just a vessel for utility).
  *   **RLHF Reinvention:**
      *   By pooling labels (discarding IDs), we enforce impersonality. We assume $r_i \approx r_j$.
      *   If we keep IDs and fit $R_\theta = \sum r_i$, we enforce impartiality (equal weights).
      *   **The Wheel:** The argument "RLHF aggregates human values" masks the fact that it aggregates *reported preferences on text*. It conflates "what raters clicked" with "what is good for humans." Harsanyi requires the inputs to be *informed* preferences. RLHF inputs are *instantaneous* reactions.
      *   When alignment folks say "We are aligning to human values," they are invoking the moral weight of Harsanyi's "individuals" without satisfying Harsanyi's "rationality/information" conditions.

  **Conclusion**
  The statement "Reward Models are Utilitarian Aggregators" is **structurally accurate but ethically vacuous.**
  *   **Structurally:** Yes, minimizing BT loss on a pooled dataset with uniform sampling converges to a linear sum of latent utilities ($R = \sum r_i$).
  *   **Ethically:** It fails the justification. The "Veil" is just a dataloader setting. The "Utilities" are noisy click probabilities. The "Outcomes" are text tokens, not welfare states.

  If you use this in your reading group, the pivot point is this: **Harsanyi proves that *if* you want to satisfy Pareto + VNM, you *must* be a Utilitarian. RLHF satisfies neither Pareto (strictly) nor VNM (tested), and its 'Veil' is an artifact of vendor sampling, not moral reasoning.** The alignment folks aren't deriving Utilitarianism; they are implementing a specific loss function that happens to share the functional form of Utilitarianism, while ignoring all the philosophical constraints that make Utilitarianism defensible.

  You are not building a Social Welfare Function. You are fitting a regressor to noisy pairwise differences, regularized by a KL divergence to a pre-trained prior. The fact that it looks like $\sum u_i$ is a mathematical coincidence of linear aggregation, not a moral achievement.
