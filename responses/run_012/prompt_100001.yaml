      *   *Verdict:* The practices presuppose the Causal Chain as the *ground* of the Positional Good. It's not *just* scarcity (otherwise a perfect fake would be worth as much if scarce); it's scarcity *of the specific genesis*.

  4.  **Determine Consistency of Practices:**

      *   Are they consistent? Mostly. The distinction lies in *category*.
      *   Restored Painting = Original Object (damaged/repaired).
      *   Forgery = New Object (misrepresented).
      *   Cast/Copy = Surrogate Object (honestly represented).
      *   The inconsistency arises only if we claim "Visual Indistinguishability = Same Value." The art world explicitly rejects this. So the theory is consistent in its rejection of pure aestheticism.
      *   *Tension:* Conservation ethics (detectability) vs. Public Presentation (often hides restoration). This is a practical tension, not necessarily a theoretical one. The theory says "Original surface matters," practice says "Don't distract the viewer."

  5.  **The Precise Difference (Restored vs. Forged):**

      *   What is being tracked? **Narrative Continuity of the Artifact.**
