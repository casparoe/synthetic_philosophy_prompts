answer: |-
  This is a classic problem in the philosophy of art, touching on ontology, aesthetics, and economics. Your argument and your friend's argument represent two poles of a tension that the art world manages practically but rarely resolves theoretically. Below is a reconstruction of the implicit theory governing these practices, an analysis of its consistency, and the concrete implications of altering it.

  ### 1. The Implicit Theory: Provenancial Essentialism

  The cluster of practices you describe presupposes a theory I will call **Provenancial Essentialism**.

  According to this view, the identity and value of an artwork are not determined solely by its perceptible properties (aestheticism) nor solely by its physical material (materialism), but by its **history of production**. The artwork is treated as a *trace* of a specific historical event: the artist's generative act.

  *   **The Causal Chain:** Value attaches to the unbroken causal link between the object and the artist. A restored painting retains this link; the canvas and structure are the same physical entity that passed through the artist's hand, even if the surface skin has been modified. A forgery breaks this link; it is a new entity generated by a different hand, regardless of visual similarity.
  *   **The Distinction of Categories:** The theory distinguishes between *originals* (traces of the act), *surrogates* (casts, copies, authorized replicas), and *deceptions* (forgeries). Surrogates are valuable as information or aesthetic experiences but lack the "ontological weight" of the original. Deceptions are valueless because they claim the weight without the substance.
  *   **Conservation Ethics:** The requirement for reversibility and detectability supports this. It ensures that the *original trace* remains distinguishable from the *repair*. If restoration were invisible and irreversible, the object would effectively become a hybrid of artist and restorer, blurring the causal chain. Detectability preserves the purity of the original act, even if the object must be altered to survive.

  ### 2. Rival Views: Ruled Out vs. Compatible

  **Ruled Out:**
  *   **Pure Aestheticism:** The view that value resides entirely in the visual/auditory experience. This is decisively ruled out by the forgery case. If aestheticism were true, a perfect forgery would equal the original in value.
  *   **Pure Materialism:** The view that value resides in the specific atoms. This is ruled out by the restoration case. If materialism were true, a heavily repainted canvas (where most original pigment is gone) would lose value proportionate to the mass of original lead or oil lost. It does not; it retains status as long as the *support* and *continuity* remain.
  *   **Radical Nominalism:** The view that "art" is just a label we slap on things. The practices show the label is constrained by physical history; you cannot simply label a forgery as "real" and have the market accept it, even if the label is institutionally applied (unless the institution is powerful enough to rewrite history, which is rare).

  **Compatible:**
  *   **Institutional Theory:** The view that art is what the "artworld" says it is. This fits comfortably because Provenancial Essentialism is enforced by institutions (museums, auction houses). However, Institutional Theory alone cannot explain *why* the institutions enforce provenance so strictly. Provenancial Essentialism provides the *reason* for the Institution's rules.
  *   **Your Friend's View (History over Thing):** This is largely correct but incomplete. We care about the history *of the thing*. We do not care about history in the abstract; we care about the history *embedded in this specific object*.
  *   **Your View (Positional Good/Scarcity):** This is compatible but secondary. Scarcity is a *consequence* of Provenancial Essentialism. Because only one causal chain can exist for a specific painting, the object is scarce. If scarcity were the primary driver (as with NFTs), a known, perfect forgery would be valuable simply because there is only one of it. It is not. Therefore, scarcity is not the root; the unique causal history is the root, which creates scarcity.

  ### 3. One Theory or Several Incompatible Ones?

  The practices presuppose **one consistent theory applied across different ontological categories**, but there is a friction point.

  The theory is consistent in distinguishing between **Autographic** arts (painting, sculpture) and **Allographic** arts (music, literature, and to a degree, photography).
  *   In autographic arts, the history of production constitutes the work. (Hence: Forgery = Bad, Restoration = Okay).
  *   In allographic arts, the work is a type, and instances are tokens. (Hence: A printed copy of *Hamlet* is as valid as the First Folio for reading the text).

  **The Friction:** Photography and Digital Art sit uncomfortably in this system.
  *   *Photography:* You noted a later print is worth less than an artist-made print. This suggests photography is treated as autographic (the artist's specific chemical manipulation matters), despite being technically reproducible.
  *   *Digital/NFT:* This is the system breaking down. Since digital files have no "original" physical trace, the market had to invent a synthetic causal chain (the token) to mimic Provenancial Essentialism.

  **Verdict:** The theory is coherent regarding traditional fine art (painting/sculpture). It becomes strained and somewhat inconsistent when applied to reproductive media (photos, prints, digital), where the market tries to *force* autographic rules onto allographic objects to maintain value.

  ### 4. Restored Painting vs. Fresh Forgery: What is Being Tracked?

  You asked what precisely separates them if appearance and materials are similar.

  The practice is tracking **Narrative Continuity of the Artifact.**

  *   **Restored Painting:** The narrative is "Artist created Object A. Time damaged Object A. Conservator repaired Object A." The identity of Object A remains intact through the repair. It is a *palimpsest* of its own history.
  *   **Forgery:** The narrative is "Forger created Object B. Forger claims Object B is Object A." This is a category error. Object B is a distinct entity.

  **Is this coherent?**
  Yes, it relies on a metaphysical distinction between *alteration* and *creation*.
  *   **Edge Case 1: The Forger was the Student.**
      If the student painted it *under the master's supervision* during the master's life (Workshop Practice), it is often valued highly (e.g., "Studio of Raphael"). The causal chain is shared. If the student painted it *after* the master died to deceive, it is a forgery. The tracking mechanism is **Authorization at the Moment of Genesis**.
  *   **Edge Case 2: The Restorer was the Better Painter.**
      This is irrelevant to the theory. In fact, it is often viewed negatively. If a restorer "improves" the painting, they are obscuring the artist's trace. The value is in the *authenticity of the trace*, not the *quality of the image*. A damaged original is worth more than a "perfect" repainting because the damaged original still bears the witness of the artist's act.

  ### 5. Hypothetical: The "Perceptible Properties Only" Museum

  If a museum adopted the view that only perceptible properties matter (Pure Aestheticism), the changes would be radical:

  **What it would stop doing:**
  *   **Provenance Research:** It would cease investigating ownership history or artist attribution unless it affected the physical look.
  *   **Authentication Committees:** It would stop declaring objects "fakes." A perfect forgery would be cataloged as "Version of [Artist]."
  *   **Conservation for Stability:** It would stop preserving unstable original materials if modern materials looked better. If a varnish yellows, it would be replaced with clear synthetic resin even if it alters the chemical makeup, provided the visual result is "truer" to the intended image.
  *   **Distinguishing Copies:** It would display plaster casts of Greek statues with the same prominence and labeling as the (rare) surviving originals.

  **What it would have to start doing:**
  *   **Active Replacement:** It would commission modern artists to repaint damaged areas of canvases to make them look "complete," rather than leaving them as inpainted fragments.
  *   **Digital Substitution:** It would replace faded watercolors or textiles with high-fidelity digital reproductions or modern re-weavings, discarding the fragile originals.
  *   **Valuation by Aesthetic Impact:** Acquisition budgets would be based on visual power, not artist name. A beautiful unknown's work would cost more than a sketch by a famous master.

  **What it could not do at all:**
  *   **Function as an Archive:** It could no longer claim to preserve human history. It would function solely as a gallery of images.
  *   **Command Current Market Prices:** It could not sustain its current funding model. The high value of art is tied to the "aura" of the original. Without that, the economic engine of the museum (donations based on prestige, ticket sales based on "seeing the real thing") would collapse.
  *   **Claim Authority on Truth:** It could not settle arguments about "what the artist intended" if the physical object contradicted the visual impression. The object itself would become disposable.

  ### 6. Confidence and Uncertainty

  **Confidence Level:** High (85%).
  The reconstruction of Provenancial Essentialism aligns with standard philosophical accounts (Goodman, Danto, Benjamin) and accurately describes the operational logic of auction houses and major museums. The distinction between autographic and allographic arts explains most of the variance in your examples.

  **Point of Least Certainty:**
  I am least sure about the **coherence of the "Workshop/Student" distinction** in practice.
  While the theory says "Authorization at Genesis" matters, the art market is notoriously inconsistent here. Sometimes a work by a student (e.g., Verrocchio's assistant painting part of a Verrocchio) is valued nearly as high as the master's, while other times it is discounted heavily. The boundary between "collaboration" and "deception" in historical contexts is often murky, and the market sometimes values the *name* (brand) more than the actual *causal chain*. If the brand is the true driver, then my claim that "Causal Chain explains Scarcity" is weakened, and your friend's "Positional Good" theory gains ground. It is possible that Provenancial Essentialism is merely the *mythology* used to justify a market that is actually driven by Brand Scarcity.
