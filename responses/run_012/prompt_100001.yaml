      *   *Uncertainty:* The specific economic weighting. How much is "positional" vs. "historical"? The NFT example muddies the water because it's purely positional. Is art *always* positional?
      *   *Least Sure Point:* Whether the "Causal Chain" is the *real* driver or just a justification for market scarcity. (I need to pick one specific point). I'll pick the coherence of the "Workshop/Student" distinction as the least sure, because art history is messy there.

