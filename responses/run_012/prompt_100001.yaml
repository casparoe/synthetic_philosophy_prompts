  2.  **Analyze the "Implicit Theory of Value":**

      *   *Observation:* Value isn't just aesthetic (visual/auditory). It isn't just material (physical atoms). It isn't just historical (provenance) in a simple way, because restoration alters the material but keeps the status, while forgery keeps the material (mostly) but kills the status.
      *   *Key Concept:* **Genesis/Provenance as Identity.** The object is valued as a *trace* of a specific historical event (the artist's act).
      *   *Restoration vs. Forgery:*
          *   Restoration: Maintains the *continuity* of the specific object generated by the artist, even if modified. It's the *same* physical entity undergoing repair.
          *   Forgery: A *new* physical entity generated by a different agent, pretending to be the old one. It breaks the causal chain.
      *   *Copies/Casts:* These are valued differently. They are "surrogates." They have educational/aesthetic value but not "auratic" (Benjamin) value. They are admitted as copies, not passed off as originals.
      *   *Photographs/Guitars:* Here, the specific physical instantiation matters because the artist's *choice* in that specific moment (contact sheet, varnish, wear) is part of the work.
      *   *NFTs:* This is the extreme case of "positional good/scarcity." It proves value can be purely conceptual/contractual.
      *   *Conservation Ethics:* Reversibility ensures we don't *confuse* the restoration with the original act. It preserves the ability to distinguish the causal chain.

      *   *Synthesis:* The theory is a hybrid. It's primarily **Historical/Genetic Essentialism** (the object's identity is tied to its origin) mixed with **Institutional Theory** (the art world confers status based on narrative). It is *not* purely Aesthetic (perceptible properties) and *not* purely Material (physical atoms).

  3.  **Address the User's Suspicion (Causal Chain vs. Positional Good):**

      *   *Causal Chain:* This fits the forgery vs. restored painting distinction best. The restored painting has the right causal history; the forgery does not.
