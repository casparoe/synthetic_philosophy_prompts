  6.  **Edge Cases:**

      *   *Forger = Student:* (e.g., Han van Meegeren vs. Vermeer, or a workshop assistant). If the student worked *under the master's supervision* (Workshop practice), it's often still valued highly (e.g., "Studio of Raphael"). If the student did it later to deceive, it's a forgery. The key is *authorization/intent at the time of creation*.
