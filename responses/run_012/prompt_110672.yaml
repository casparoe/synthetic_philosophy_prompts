  The "cable" metaphor (many weak strands vs. one strong chain) is a real requirement for warrant, not just poetry. In archaeology, single lines of evidence are rarely deductively secure. Convergence increases probability if strands are independent. However, it demands rigor: strands must not share the same bias. If multiple lines rely on the same typology, they are one strand. Taken seriously, this changes demands on single artifacts: no pot proves a belief, but a pot plus context plus analogy might. It requires tracking dependency between evidence sources. It is a requirement for confidence, not ontology. It prevents over-reliance on "smoking guns." But it risks coherence without truth if all strands share a hidden assumption. So, independence is the key constraint. The desideratum is that the theory must specify how to test for independence. It cannot simply assert convergence; it must demonstrate it. This shifts the burden from finding strong evidence to finding diverse evidence. It is a real methodological constraint, provided "independence" is rigorously defined. Without this, the cable is just a bundled chain. The theory must explain how weak warrants aggregate into strong ones without multiplying errors.

  ### What does the most excluding, and what's contested

  The most excluding desideratum is equifinality. It rules out any theory claiming unique reconstruction of past behavior from static remains. It kills naive positivism and deterministic models that assume a single cause for material patterns. Consensus exists on taphonomic constraints and the need for distinct lines of evidence (the cable). Most agree the record is fragmented and requires multiple warrants. Live disagreement remains on the emic/etic gap: can we ever access past beliefs, or only practices? Processualists often limit claims to behavior; post-processualists argue materiality embodies belief directly. This is a live dispute, not consensus. Also contested is the cable's independence: how independent is independent? We agree on the constraints of the dirt; we disagree on the limits of the mind. Conflicting desiderata exist between empirical constraint and emic access. You can't have perfect physical rigor and deep insider meaning simultaneously; stricter taphonomic control often reduces semantic resolution. The theory must choose where to sit on this trade-off. We agree on the constraints of the dirt; we disagree on the limits of the mind. The spec must acknowledge this tension without pretending it is solved.
