  ### The cases it has to get right

  An adequate theory must explain specific inferential jumps without oversimplifying the material record. First, the rich burial: it must distinguish between goods signaling personal status, lineage wealth, or afterlife provisioning without assuming all three simultaneously. It must explain why grave goods sometimes correlate with hierarchy and other times with ritual role, avoiding the assumption that wealth equals power. Second, the cache of figurines: it must allow for votive offering, domestic decoration, or toy without defaulting to "goddess worship" based solely on form. Third, the abandoned house: it needs to differentiate between planned migration, sudden disaster, or seasonal movement based on what was left behind versus removed. Fourth, the midden problem: it must provide criteria to separate ritual deposition from structured trash, where both look like concentrated debris.

  Crucially, the theory must account for famous failures where obvious inferences proved wrong. It must explain why the inference of a universal Paleolithic "Great Goddess" from figurines was methodologically unsound despite widespread acceptance, highlighting the danger of projecting ethnographic analogies too broadly. It must explain why the "Clovis Overkill" hypothesis, while logically possible, faced evidentiary collapse regarding megafauna extinction timing due to taphonomic gaps. Another case is the interpretation of Minoan civilization as uniquely peaceful based on art, later contradicted by evidence of violence; this shows the danger of reading ideology literally from iconography. A valid theory shouldn't just validate successful interpretations; it must illuminate why intuitive leaps fail. It needs to handle ambiguity where the record is silent. If a theory cannot explain why a rich burial might *not* indicate stratification, or why a midden might *not* be ritual, it lacks negative heuristic power. It must accommodate the possibility that material richness correlates with social complexity in one context but ritual intensity in another. The spec requires the framework to navigate these cases without resorting to ad hoc exceptions. It must offer general principles that predict when inference is secure and when it is speculative, ensuring that the explanation for a ritual cache doesn't inadvertently validate the Great Goddess error. The cases demand a framework that tolerates uncertainty while preventing unchecked imagination. It must deliver specific conditions under which a material pattern warrants a belief attribution, rather than mere plausibility. The theory must be robust enough to survive the discovery that the "ritual" midden was actually a rapid disposal event during an epidemic, changing the meaning without changing the material signature.

  ### Distinctions it can't collapse

  The theory cannot collapse belief with practice. Material remains track actions; beliefs are inferred states. Regular practice may exist without dogmatic belief, and belief may exist without material trace. Collapsing them assumes materialism explains ideology entirely, ignoring orthopraxy where action precedes conviction. It cannot collapse emic with etic categories. Analysts' typologies (etic) are not necessarily past actors' concepts (emic). Assuming our "pot type" equals their "social unit" imposes external logic, risking categorical errors. It must distinguish absence of evidence from evidence of absence. Just because we find no temples doesn't mean there was no religion; preservation biases differ. Treating null results as positive proof of secularism is invalid. Finally, it cannot conflate function with meaning. A bowl functions to hold food but may mean "kinship" during a feast. Utilitarian objects carry symbolic weight, and ritual objects have uses. Collapsing these leads to functionalist reductionism or uncheckable idealism. The theory must maintain these analytical separations to avoid circular reasoning where material function is used to prove social meaning which is then used to explain material function. Furthermore, it must acknowledge that emic access is always mediated; we cannot simply assume ethnographic analogy bridges the gap without warrant. The distinction between practice and belief is vital because institutions often persist after the beliefs founding them fade. If the theory treats material regularity as direct proof of internal conviction, it fails to account for habit, coercion, or tradition. These distinctions are not just philosophical niceties; they are safeguards against projecting modern rationality onto past actors.

  ### Constraints from how the record forms

  Any inference theory must be compatible with taphonomy. The record is not a snapshot but a filtered residue. It cannot contradict the principle of equifinality: distinct social behaviors can produce identical material signatures (e.g., broken pots from accident vs. ritual). It must acknowledge that the same material pattern (e.g., settlement hierarchy) can emerge from different behaviors (coercion vs. voluntary aggregation). A theory demanding one-to-one mapping between artifact and action is physically impossible. It must account for transformation processes that alter spatial relationships and preservation probabilities. If the theory requires a pristine behavioral record, it is invalid. It must accept that the archive is incomplete and biased toward durable materials. This means the theory cannot demand positive proof for every inferred institution. It must work with probabilities, not certainties. The physical constraints of deposition, decay, and discovery limit the resolution of social reconstruction. A theory that ignores these constraints risks becoming science fiction. It must integrate formation processes as active variables in inference, not just noise to be removed. The record forms through human and natural agency; separating these is part of the work. Consequently, the theory must allow for multiple plausible narratives where the physical record is ambiguous. It cannot privilege social explanation over natural formation without independent warrant. The constraint is absolute: no inference can contradict known physical laws of decay and deposition. This rules out interpretations requiring perishable evidence to survive without justification.

