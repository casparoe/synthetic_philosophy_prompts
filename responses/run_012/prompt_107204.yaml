  # Decision Tree: The Rational Status of Information

  **Instructions:** Begin at Node 1. Answer each question based on the theoretical model or concrete scenario you wish to evaluate. Follow the branch corresponding to your answer until you reach a leaf.

  **Node 1:** Is the agent modeled as an expected-utility maximizer?
  *   **No:** Go to **Leaf 1**.
  *   **Yes:** Go to **Node 2**.

  **Node 2:** Does the agent update credences strictly via Bayes' rule?
  *   **No:** Go to **Leaf 2**.
  *   **Yes:** Go to **Node 3**.

  **Node 3:** Is the signal free of all resource, deliberation, attention, and emotional costs?
  *   **No:** Go to **Leaf 3**.
  *   **Yes:** Go to **Node 4**.

  **Node 4:** (Medical Case) Does the test result trigger a duty to disclose that removes a previously available option?
  *   **Yes:** Go to **Node 10**.
  *   **No:** Go to **Node 5**.

  **Node 5:** (Hiring Case) Does reading the candidate's file alter the committee's legal obligations regarding the hire?
  *   **Yes:** Go to **Node 10**.
  *   **No:** Go to **Node 6**.

  **Node 6:** Does the signal change the agent's utility function or fundamental preferences?
  *   **Yes:** Go to **Leaf 6**.
  *   **No:** Go to **Node 7**.

  **Node 7:** (Self-Knowledge Case) Does learning that she is the sort of person who would take an action make the action more likely?
  *   **Yes:** Go to **Leaf 7**.
  *   **No:** Go to **Node 8**.

  **Node 8:** (Strategic Case) Does observing another party's signal change that party's incentive to send it?
  *   **Yes:** Go to **Leaf 8**.
  *   **No:** Go to **Node 9**.

  **Node 9:** Is the relevant unit of evaluation the individual act or the general policy?
  *   **Act:** Go to **Leaf 4**.
  *   **Policy:** Go to **Leaf 5**.

  **Node 10:** (From Nodes 4 & 5) Can the agent precommit to ignoring the signal before receiving it?
  *   **Yes:** Go to **Leaf 9**.
  *   **No:** Go to **Leaf 10**.

  ***

  ### Positions (Leaves)

  **Leaf 1: Descriptive Proceduralism**
  *   **Commitment:** Rationality is defined by heuristics that sometimes systematically reject useful information.

  **Leaf 2: Non-Standard Epistemology**
  *   **Commitment:** Rational agents may hold credences that violate the probability axioms or standard updating rules.

  **Leaf 3: Broad Cost Avoidance**
  *   **Commitment:** Information avoidance is rational only because processing is physically or psychologically expensive.

  **Leaf 4: Strict Good's Theorem**
  *   **Commitment:** An agent who avoids costless information in this scenario is objectively irrational.

  **Leaf 5: Policy Rationality**
  *   **Commitment:** Avoiding information can be rational as a policy even if the specific act of ignoring violates expected utility.

  **Leaf 6: Preference Instability**
  *   **Commitment:** Information is harmful if it destabilizes the preferences required to pursue long-term goals.

  **Leaf 7: Self-Fulfilling Prophecy**
  *   **Commitment:** Rationality requires managing beliefs that causally or logically determine the outcome they predict.

  **Leaf 8: Strategic Signaling**
  *   **Commitment:** Rationality sometimes requires manipulating another's incentives by restricting one's own information access.

  **Leaf 9: Precommitment Solution**
  *   **Commitment:** Rationality requires binding oneself against future knowledge to preserve options.

  **Leaf 10: Structural Fatalism**
  *   **Commitment:** Agents are rationally condemned to utility loss when institutions link knowledge to obligation.

  ***

  ### Diagnostics and Unoccupied Space

  **Inseparable Leaves:**
  The tree cannot separate **Causal Decision Theorists** from **Evidential Decision Theorists** within **Leaf 7**. Both agree that self-fulfilling beliefs matter, but they disagree on whether the link between belief and act is causal or merely evidential; this tree treats the rational response (managing the belief) as identical for both.

  **Unoccupied Combinations:**
  The combination of **Expected-Utility Maximization** with **Non-Bayesian Updating** (Leaf 2) is often unoccupied in standard seminars. This is not because the view is incoherent, but because it is merely unexplored; most models assume that if you maximize EU, you must also update via Bayes' rule, leaving a gap for theories of imprecise probabilities or robust control.

  **Note on Case Nodes:**
  Nodes 4, 5, 7, and 8 turn on concrete cases. Note that Nodes 4 and 5 lead to the same structural problem (Option-Set Instability), but are separated to ensure the handout explicitly tracks the distinct institutional mechanisms (medical disclosure vs. hiring law) that generate the violation of Good's Theorem.
