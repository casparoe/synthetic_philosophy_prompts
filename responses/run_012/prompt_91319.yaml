answer: |-
  ### Instrument Intro: The Demon and the Bursar

  You stand before two entities. 

  First, **the Demon**. He is powerful and terrifying. He promises you a lavish reward if and only if you admire him. You agree that this promise gives you *some* reason to admire him, but you also agree it does not make him admirable. 

  Second, **the Bursar**. She offers you a separate reward if and only if you *possess a reason* to admire the Demon. She does not care if you actually admire him; she only cares that you have a reason to do so. 

  This instrument sorts your view on why the Demon's promise fails to make him admirable. Answer the questions based on your intuitions about these cases.

  ***

  ### The Decision Tree

  **Node 1: The Definition of Value**
  Does the fact that it is fitting to admire something make it good?
  *   **No:** Go to Leaf 1.
  *   **Yes:** Go to Node 2.

  **Node 2: The Target of the Promise**
  Does the Demon's promise give you a reason *to admire* him directly?
  *   **No (It gives a reason to *want* to or *try* to):** Go to Leaf 2.
  *   **Yes (It gives a reason to actually admire):** Go to Node 3.

  **Node 3: The Location of the Reason**
  Is the reason provided by the promise about *your mental state* or about *the Demon*?
  *   **About your state (Admiring is beneficial for you):** Go to Leaf 3.
  *   **About the Demon (It counts in his favor):** Go to Node 4.

  **Node 4: The Constitutive Question**
  Does this reason bear on the question that admiration *constitutively answers* (i.e., "Is he meritorious?")?
  *   **No (Admiration ignores such reasons by definition):** Go to Leaf 4.
  *   **Yes (It is a valid consideration for admiration):** Go to Node 5.

  **Node 5: The Bursar's Test**
  In the Bursar case, does the Demon's promise count as the "reason" required to claim her reward?
  *   **No (It is a reason to admire, but not a 'reason' in the Bursar's sense):** Go to Leaf 5.
  *   **Yes (It satisfies the condition for having a reason):** Go to Node 6.

  **Node 6: The Value Link**
  If the reason is valid for admiration, does it make the Demon good?
  *   **Yes:** Go to Leaf 6.
  *   **No:** Go to Node 7.

  **Node 7: The Distinction Source**
  Is the gap between "reason to admire" and "good" a matter of substance or terminology?
  *   **Substance (They are fundamentally different categories):** Go to Leaf 7.
  *   **Terminology (It depends on how we define 'good'):** Go to Leaf 8.

  ***

  ### The Positions (Leaves)

  **Leaf 1: Value Primitivism**
  Value is a basic property that cannot be analyzed in terms of attitudes. The fitting-attitude analysis was mistaken from the start; the Demon's promise fails to make him good because goodness doesn't depend on reasons for admiration.

  **Leaf 2: Reasons for Willing**
  The promise is not a reason for the attitude itself, but for the *will* to produce it. You have a reason to *try* to admire the Demon, but no reason to actually succeed, preserving the link between admiration and merit.

  **Leaf 3: State-Given Reasons**
  The reason is for the *state* of admiring, not the *object* of admiration. The promise makes admiring beneficial for you, but it does not make the Demon admirable, because the reason targets your welfare, not his qualities.

  **Leaf 4: Constitutive Exclusion**
  Admiration is an attitude that, by its very nature, excludes prudential reasons. The promise is a reason to admire, but admiration constitutively ignores such reasons, so the Demon remains unadmirable despite the reason.

  **Leaf 5: Reasons as Relations**
  The promise creates a normative relation to the Demon, but the Bursar requires a factual reason. You have a reason to admire, but you do not "possess a reason" in the way required for the Bursar's reward, distinguishing reasons from reason-possession.

  **Leaf 6: Fitting-Attitude Failure**
  The promise *does* make the Demon good, and we should accept this. The fitting-attitude analysis is correct, but our intuition that the Demon isn't good is the error; value is broader than moral merit.

  **Leaf 7: Reason-Value Decoupling**
  A reason can make an attitude fitting without making the object valuable. The promise makes admiration fitting, but value requires a specific subset of reasons; the analysis holds, but the link to value is partial.

  **Leaf 8: The Verbal Twin**
  *(Flagged Pair with Leaf 7)* This position is substantively identical to Leaf 7 but describes the gap as a linguistic convention rather than a metaphysical distinction. Whether you call it "decoupling" or "definition" changes nothing in practice.

  ***

  ### Unoccupied Space

  **The Incoherent Combination:**
  There is no leaf for readers who answer **Yes** at Node 1 ("Good means fitting to admire") and **Yes** at Node 6 ("The reason makes him good"), but still insist the Demon is **not** good. This combination is logically inconsistent: if goodness is defined by fitting admiration, and the reason makes admiration fitting, the Demon must be good. To deny this is to contradict the initial definition.

  **The Unattractive Combination:**
  There is no leaf for readers who answer **Yes** at Node 3 ("Reason is about the Demon") but **No** at Node 2 ("No reason to admire"). If a reason is about the object (the Demon), it must be a reason to have the attitude toward that object. A reason about the Demon that is not a reason to admire him is an orphaned normative fact with no clear philosophical home.

  **The Unexplored Combination:**
  There is no leaf for readers who answer **No** at Node 5 (The promise is not a reason for the Bursar) but **Yes** at Node 2 (It is a reason to admire). This suggests a view where one can have a reason to admire without "possessing a reason" in any reifiable sense. While logically possible, this view is rarely defended explicitly in the literature as it complicates the ontology of reasons without clear gain.
