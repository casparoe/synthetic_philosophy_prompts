answer: |-
  You are defending I. J. Good's 1967 theorem on the value of information. Your intuition is correct: within its specific axioms, the result is mathematically settled. It is a direct consequence of the convexity of the maximum function. To say $E[\max_a E[U|E]] \geq \max_a E[U]$ is to say nothing more than that the average of maximums is at least the maximum of averages.

  You ask for the thesis to be tested, not restated. You want to know where the body is buried. Here is the autopsy.

  ### 1. The Load-Bearing Assumptions
  You listed the candidates. Here is how much weight each carries, and what happens if you remove it.

  **A. The Utility Function is Independent of Belief States**
  *   **The Assumption:** $U(action, state)$ does not include $U(action, state, belief)$. The agent cares only about the world and their actions, not about what they know.
  *   **The Defeater:** If an agent derives intrinsic disutility from knowing (e.g., "I prefer not to know my spouse is unfaithful because the knowledge itself causes pain"), Good's theorem fails. The expectation of utility *including the pain of knowing* can be lower than the expectation of utility *including the comfort of ignorance*.
  *   **Plausibility:** High. Humans routinely value ignorance intrinsically.
  *   **Survival:** If you concede this, the theorem survives only as a claim about *instrumental* rationality (achieving external goals), not *overall* welfare.
  *   **Weight:** **Fatal.** This is the most common source of confusion. Good's theorem proves information has non-negative *instrumental* value. It does not prove information has non-negative *hedonic* value.

  **B. The Set of Available Acts is Unchanged**
  *   **The Assumption:** Learning $E$ does not physically or normatively restrict the action space $A$.
  *   **The Defeater:** "Binding" information. If learning a secret legally binds you to silence, or if learning a temptation makes it psychologically impossible to resist (Ulysses contracts), the action space shrinks or shifts. If $A_{after} \subset A_{before}$, the value of information can be negative.
  *   **Plausibility:** High in social/legal contexts.
  *   **Survival:** The theorem holds only for "pure observation" where knowledge imposes no constraints.
  *   **Weight:** **Fatal.** The clause "remains free to act exactly as she would have acted in ignorance" is not a throwaway; it is the engine of the proof.

  **C. Expected Utility Maximisation**
  *   **The Assumption:** Preferences satisfy the Independence Axiom (von Neumann-Morgenstern).
  *   **The Defeater:** Ambiguity aversion (Ellsberg preferences). An agent who prefers known risks to unknown risks may prefer *not* to receive information that converts a risk into a known probability if that probability reveals an unfavorable distribution they cannot hedge. (See: *Brunermeier & Parker, 2005*; *Qiu & Wan, 2015*). For a max-min expected utility agent, information can reduce the set of priors in a way that lowers the worst-case evaluation.
  *   **Plausibility:** High. Many rational agents exhibit ambiguity aversion.
  *   **Survival:** The theorem becomes false for a large class of plausible rational agents.
  *   **Weight:** **Fatal to Universality.** It preserves the theorem only as a property of *EU specifically*, not of rationality broadly.

  **D. The Possibility Space is Fixed (Logical Omniscience)**
  *   **The Assumption:** The partition of states was fixed in advance. The agent is not learning "new possibilities," only ruling out old ones.
  *   **The Defeater:** Logical information. If an agent is not logically omniscient, learning a mathematical truth can force a decision that lowers expected utility (e.g., in certain Newcomb-like problems or decision instability scenarios).
  *   **Plausibility:** Low for ideal agents, high for real ones.
  *   **Survival:** The theorem holds only for empirical uncertainty, not logical uncertainty.
  *   **Weight:** **Awkward.** It limits the domain but doesn't break the core logic.

  **E. Conditionalisation**
  *   **The Assumption:** The agent updates via Bayes' rule.
  *   **The Defeater:** If the agent updates via Jeffrey conditionalization (uncertain evidence) or has dynamic inconsistency (time-inconsistent preferences), the ex-ante valuation of information may not match the ex-post behavior.
  *   **Plausibility:** Moderate.
  *   **Survival:** The theorem requires a specific updating rule.
  *   **Weight:** **Technical.** Easily patched by specifying the update rule.

  **F. Information is Genuinely Free**
  *   **The Assumption:** Cost = 0.
  *   **The Defeater:** Any cost > 0.
  *   **Weight:** **Trivial.** You already hedged this.

  ### 2. The Emptiness Charge
  You suspect the result is close to a consequence of the probability calculus: *a maximum taken after averaging cannot fall below an average taken before it.*

  **Verdict:** You are correct. It is Jensen's Inequality applied to the value function.
  **Is this a defect?**
  *   **For a descriptive theory:** Yes. It explains nothing about human behavior because humans violate the axioms (they pay to avoid info).
  *   **For a normative theory:** No. In physics, $F=ma$ is "empty" in the sense that it defines force by acceleration. It is a constitutive rule. Good's Theorem defines *instrumental rationality*. To say a rational agent would pay to avoid free, actionable information is, by this definition, a contradiction in terms.
  *   **The "Freedom to Ignore" Clause:** You ask if this is doing all the work. **Yes.** Mathematically, the value of information is the value of the *option* to change your action. If you cannot change your action (or choose not to), the value is zero. If you can, it is positive. The theorem is essentially a pricing model for real options. The "emptiness" is the price of precision.

  ### 3. Non-EU Preferences: Counterexample or Change of Subject?
  You asked whether ambiguity aversion reversing the result is a genuine counterexample.

  **Verdict:** It is a genuine counterexample to the claim that "Rational agents never pay to avoid information." It is *not* a counterexample to Good's Theorem itself, because Good's Theorem is explicitly conditional on EU maximization.
  **Can the reversal be had without abandoning EU?**
  Only if you violate Assumption A (Utility depends on belief). If $U = U(world, knowledge)$, then within EU, information can have negative expected utility.
  *   *Example:* A patient can undergo a painful treatment that cures a disease, or no treatment. If they know they have the disease, they must treat (high cost, cure). If they don't know, they might gamble on no treatment (low cost, risk death). If the pain of *knowing* they are sick is sufficiently high (intrinsic disutility), the EU of knowing is lower than the EU of ignorance.
  *   *Note:* This requires modeling "peace of mind" as a utility good. If you do that, the theorem holds (information is still instrumentally valuable for curing), but the *total* utility drops.

  ### 4. Predictive Power
  **What does the thesis predict that a rival view does not?**
  *   **Good's Thesis:** An agent satisfying the axioms will never construct a mechanism to screen out free, actionable information.
  *   **Rival View (Behavioral/Psychological):** Agents will frequently pay to avoid information (the "Ostrich Effect"), even when it is instrumentally useful.
  *   **Empirical Content:** The thesis is falsifiable by observing an EU-maximizer paying to avoid info. Since we observe humans paying to avoid info, we conclude humans are not EU-maximizers (or they value ignorance intrinsically).
  *   **Is it worthless?** No. It serves as a *benchmark*. Just as frictionless planes do not exist but are necessary for mechanics, the Good agent does not exist but is necessary for decision theory. It tells you *why* the human behavior is "irrational" (or requires a modified utility function).

  ### 5. Ranking the Defeaters
  Here is the ranking from Fatal to Merely Awkward, based on your goal of defending the proposition in a literary/philosophical context.

  1.  **Intrinsic Disutility of Knowledge (Assumption A):** **FATAL.** If your characters avoid information because knowing hurts (sadness, anxiety, loss of hope), Good's Theorem does not apply. The theorem assumes utility is solely a function of world-states and actions. If you model "ignorance" as a good, the math flips.
      *   *Defender's Move:* Concede. Admit the theorem applies only to *instrumental* value, not *welfare*.
  2.  **Ambiguity Aversion (Assumption C):** **FATAL TO UNIVERSALITY.** If you claim your characters are "rational" but not EU-maximizers (e.g., they fear ambiguity), they can rationally avoid info.
      *   *Defender's Move:* Dismiss as "Change of Subject." Insist the theorem is about *EU agents*. If the agent isn't EU, the theorem doesn't claim to cover them.
  3.  **Action Space Restriction (Assumption B):** **FATAL.** If knowing binds the agent (socially, legally, or via psychological compulsion), info has negative value.
      *   *Defender's Move:* Concede. This is the "Ulysses" case. The theorem assumes the agent remains master of their acts.
  4.  **Psychological Inability to Ignore:** **AWKWARD.** You noted "nobody can ignore what they have learnt." This is a descriptive failure, not a normative one. The theorem says you *may* ignore it (the option is available), not that you *will* successfully suppress the emotional impact.
      *   *Defender's Move:* Dismiss. This confuses the *choice of action* with the *experience of emotion*. The theorem protects the choice, not the feelings.
  5.  **Logical Uncertainty:** **AWKWARD.** Limits the scope to empirical states.
      *   *Defender's Move:* Dismiss. Standard decision theory assumes a fixed state space.

  ### 6. The Honest Verdict
  You asked for the truth, not encouragement.

  **The thesis is true, insulated, and almost empty.**

  It is **true** because it is a theorem of probability and optimization. You cannot construct a case where a strict EU maximizer, facing a fixed action space, with a belief-independent utility function, updating by conditionalization, is worse off in expectation by receiving free information. To do so would be to demonstrate that $\max(E[X]) > E[\max(X)]$, which is mathematically impossible.

  It is **insulated** because every plausible counterexample involves relaxing one of the axioms (usually by adding "peace of mind" to the utility function or admitting ambiguity aversion). A defender can always retreat to: "Then the agent was not an EU maximizer," or "Then the information was not free (it cost utility)," or "Then the action space was not fixed."

  It is **empty** because it defines rationality tautologically. It says: "If you define an agent as one who optimizes decisions based on beliefs, then improving beliefs (for free) cannot worsen decisions."

  **For your fiction:**
  If your characters are avoiding information because they are **afraid of what they will have to do** (e.g., "If I know he's guilty, I have to kill him"), Good's Theorem supports you *only if* learning the truth restricts their actions. If they remain free to act as if they didn't know, but simply *feel* worse, Good's Theorem says their *decision-making capacity* has not been harmed, even if their *happiness* has.

  If your characters are avoiding information because they are **ambiguity averse** (they prefer the fog), Good's Theorem does not apply to them. They are not EU maximizers.

  **Final Recommendation:**
  Defend the proposition as a **normative benchmark for instrumental rationality**, not as a law of human psychology.
  *   **Claim:** "A perfectly rational agent, concerned only with outcomes, never pays to remain ignorant."
  *   **Concession:** "Humans are not such agents. We value hope, we fear ambiguity, and we are bound by our knowledge."
  *   **Result:** You keep the mathematical rigor without denying the psychological reality of your characters. The tension between the theorem (what they *should* do) and their behavior (what they *want* to do) is where the drama lives.

  The theorem is not a description of the world; it is a ruler. The fact that the world does not measure up to the ruler does not make the ruler false. It makes the world crooked.
