answer: |-
  The server room hummed, a low-frequency vibration that Elara felt in her molars. On her screen, the draft memo blinked. *Subject: Classification of Atrocities in Northern Zembla.* The cursor hovered over the word *Genocide*.

  Havel, the Legal Adviser, stood by the window. He wasn't looking at her; he was watching the rain streak the glass of the Continental Accord building. He was a good lawyer. That was the problem. He wasn't a coward hiding behind procedure. He believed in the precision of the blade.

  "The burnings are indisputable," Elara said. "Twelve villages in the Duri valley. Three thousand displaced."

  "Counter-insurgency operations," Havel said, turning. He held a printed copy of the Convention, the corners soft from handling. "The Zembla government has declared the Duri Liberation Front a terrorist organization. The stated intent is security and land reclamation for agricultural development. They are not saying, 'We will kill every Duri.' They are saying, 'We will clear a combat zone.'"

  "People are dead, Havel."

  "Killing is not genocide. Murder is not genocide." He tapped the paper. "Genocide is specific intent to destroy a group, in whole or in part, *as such*. To use the word, we need proof that the Commander in Chief wants the Duri to cease existing. We have proof they want the Duri to move. We have proof they want the land. We do not have proof they want the biology of the people to end."

  Elara looked back at the screen. "Lemkin didn't write it that way."

  "Lemkin isn't the law. 1948 is the law." Havel walked over and leaned on the desk. "If we dilute the term because the cultural destruction is horrific, and then next year a regime actually sets out to exterminate a people physically, the world will remember that we cried wolf. The law is a wall, Elara. It keeps the flood out. If you put a door in it wherever there is suffering, it stops being a wall."

  ***

  Two days earlier, they had watched the footage in the briefing room. Ambassador Kress had ordered the lights dimmed.

  The video was shaky, shot on a phone from a hillside. Below, in the valley, the stone cathedral of the Old Rite was burning. The dome, distinctively shaped like a Duri helmet, collapsed in a cloud of grey dust. Men in uniform were not shooting people. They were pouring accelerant on the library next door. Books, centuries of Duri grammar and theology, were being tossed onto the pyre.

  Elara had felt a physical sickness in her gut. She looked around the room. Kress was taking notes. Havel was impassive.

  "This is it," Elara had whispered. "This is the pattern of life being erased."

  Havel had leaned over, his voice low enough that only she heard. "Article II does not cover cultural destruction. The drafters voted that down in 1948. They chose physical-biological destruction over cultural. You can burn every book they own. You can ban their language. You can bulldoze their churches. Unless you are killing them *to* stop them from being Duri, it is not genocide. It is a war crime. It is a crime against humanity. It is not *this* word."

  Kress had looked up then. "But it looks like it."

  "Law is not about how it looks," Havel said. "It is about what can be proven in a tribunal. If we label this genocide, and the tribunal acquits because the intent was land, not biology, we break the mechanism."

  ***

  The phone call from Mira came at midnight. Elara was in her temporary quarters, the city lights of the capital sprawling below.

  "We put it on the banner," Mira said. Her voice was tinny over the encrypted line. She was in the diaspora, three time zones away, running the Free Duri Fund. "The donors need to know. If you call it 'ethnic cleansing' or 'war crimes,' the checks stop. Genocide opens the wallet."

  "Mira, the Legal Office says the intent standard isn't met."

  "The intent is there! They are taking the children."

  Elara rubbed her eyes. "The schools?"

  "State Academies," Mira spat. "They round up the kids from the burned villages. They say it's for their safety, because the insurgents use the villages as cover. They put them in boarding schools in the south. They cut their hair. They speak only Zemblan. They don't let them go home."

  "Article II, Section E," Elara said, the text memorized now. "Forcibly transferring children of the group to another group."

  "Exactly. It's in the treaty. So write it."

  "It's not exactly," Elara said softly. "Havel says the transfer has to be with intent to destroy the group. If the government argues they are evacuating children from a war zone to protect them from the insurgents... the motive is safety. The result is assimilation, yes. But the *intent*?"

  "You're parsing grammar while they're erasing us," Mira said. "If you don't give us the word, the bombers keep coming. The word is the only shield we have."

  "The word might bring bombers," Elara said. "If the Accord intervenes, it becomes a war. The Duri in the valley become the battlefield."

  "Better a battlefield than a graveyard."

  The line went dead.

  ***

  The meeting with Joren was in a safe house that smelled of boiled cabbage and damp wool. He was a teacher from the northern valley, one of the few who had walked out before the cordon closed. He sat with his hands wrapped around a mug of tea, staring at the steam.

  Elara had brought Havel, but he stayed in the car. This was for the analyst.

  "The Academies," Elara said. "The children."

  Joren nodded. "My niece. Seven years old. They took her when they burned Kestrel's Hollow. They said, 'Insurgents are in the hills. Children are not safe.' They put her on a bus. We don't know where the bus went."

  "Do you want us to call it genocide?"

  Joren looked up. His eyes were red-rimmed, but clear. "You know the law?"

  "I know the Convention."

  "Then you know that if you call it genocide, the Security Council has to consider action. Sanctions. Maybe peacekeepers. Maybe no-fly zones."

  "Yes."

  "And if you call it war crimes?"

  "Sanctions are slower. Intervention is less likely."

  Joren set the mug down. "My brother is in the hills. With the Front. If the Accord comes in with guns, my brother fights. If my brother fights, the Zembla army bombs the valley harder. The people who are left—the old ones, the mothers hiding in cellars—they die in the crossfire."

  He leaned forward. "I read the definition, Miss Elara. I studied it when this started. I know about the intent. I know you can't prove they want to kill us all. They want our land. They want our children to be Zemblan. They don't care if we die, but they don't need us dead to win."

  "So you don't want the label?"

  "I want the buses to stop," Joren said. "I want the burning to stop. If the label brings more fire, I don't want it. If the label brings observers who count the bodies and shame the commanders, I want it. But you people... you treat the word like a magic spell. You think saying it makes the bad men go away. Sometimes it makes them lock the doors tighter."

  He paused. "Your cousin, Mira. She wants the money. The Ambassador wants the headline. You want to be the one who saw it coming. What do the people in the valley want? We want to survive. Not as a symbol. As people."

  ***

  Back in the office, the air conditioning was too cold. Ambassador Kress stood over her desk. He was a man who collected crises; they were the rungs on his ladder.

  "The draft is ready?" Kress asked.

  "Almost."

  "Havel tells me he won't sign off on the *G* word."

  "Havel follows the statute."

  "I don't pay Havel to follow the statute. I pay him to advise me on risk." Kress leaned in. "History will ask where we stood. If we stand on 'War Crimes,' we are clerks. If we stand on 'Genocide,' we are guardians. The Duri are being erased, Elara. Culturally, physically, it doesn't matter. The outcome is the same."

  "The outcome isn't the same if intervention triggers a wider war," Elara said. "Joren, the survivor, thinks the label might get more people killed."

  "Joren is traumatized. He's not a strategist." Kress tapped the desk. "Lemkin invented the word to wake the world up. The lawyers slept on it and woke up with a narrow definition. We have the power to widen it back up. Sign the memo."

  "If we sign it, and the tribunal rejects it later, the Accord loses credibility."

  "If we don't sign it, and they all die, we lose our souls." Kress straightened his tie. "I leave the decision to the Analyst. That's why you're in the chair. I want it on my desk in an hour."

  He left. Havel entered a moment later. He didn't sit.

  "Kress wants the headline," Havel said.

  "Joren thinks the headline brings bombs."

  "Joren is on the ground. He knows the physics of violence." Havel looked at the screen. "But if we don't name it, the normalization completes. If it's just 'security operations,' the world accepts it. If it's 'genocide,' it becomes pariah status. The pressure might force a ceasefire without a single shot fired. The threat of the label can be as powerful as the label itself."

  "So you're saying use it?"

  "I'm saying the law is a tool. Sometimes you use the hammer. Sometimes you use the scalpel. If you use the hammer on a screw, you break the wood. If you use the scalpel on a bone, you break the blade." Havel looked at her. "You have to decide if this is wood or bone."

  He walked to the door. "I will support whatever you sign. But know that once you type it, you cannot delete it."

  Elara was alone.

  The screen glowed. The draft was open.

  *Paragraph 4: The evidence suggests a coordinated policy of cultural erasure and forced assimilation, including the transfer of minors. However, regarding the specific intent to physically destroy the group...*

  She looked at the footage window in the corner of her desktop. The cathedral dome collapsing. The smoke rising in a perfect, dark column.

  She thought of Mira's donors. She thought of Kress's ladder. She thought of Joren's niece on the bus, hair cut, speaking a language that wasn't hers. She thought of the legal precedent, the integrity of the Convention, the wall that Havel wanted to protect.

  If she signed it, the Accord might mobilize. The bombers might come. The Duri might be saved, or they might be crushed between two armies.
  If she gutted it, the land would be taken. The language would fade. The children would become Zemblan. But the shooting might stop sooner. The survivors might live to be a minority, rather than martyrs.

  There was no wisdom here. There was only the weight of the word.

  Elara placed her hands on the keyboard. She highlighted the paragraph. She looked at the definition in her head: *Intent to destroy, in whole or in part, a national, ethnical, racial or religious group, as such.*

  She looked at the burning church.

  She moved the cursor. She did not look at the clock. She pressed the key.
