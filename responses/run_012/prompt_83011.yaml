  ### The Setup
  The speaker is an ordinary adult in a domestic setting, interacting with a simple mechanical device: a light switch connected to a bulb. The speaker frequently utters the sentence *"Switch makes light"* (or its vernacular equivalent) when flipping the switch results in illumination. The radical interpreter observes the speaker's assent and dissent patterns over a lifetime. The speaker never encounters a malfunctioning switch, a disconnected bulb, or a remote-controlled light. Every time the speaker flips the switch, the light goes on; every time the light goes on, the switch was flipped. The speaker's behavioral dispositions are perfectly consistent with the belief that the switch controls the light. There are no bilingual informants, and the interpreter has no prior access to the wiring or the speaker's neural states.

  ### The Manuals
  **Manual 1 (Causal Realism):**
  *   **Meaning:** The predicate "makes" expresses a productive causal relation.
  *   **Truth Conditions:** The sentence *"Switch makes light"* is true if and only if there exists a causal power or necessitation linking the switch's movement to the light's illumination.
  *   **Beliefs:** The speaker believes that the switch possesses the efficacy to produce light.
  *   **Charity:** The speaker is largely right; in our world, switches do causally produce light. The speaker is rational; believing in causal efficacy is a coherent, standard stance.

  **Manual 2 (Humean Regularity):**
  *   **Meaning:** The predicate "makes" expresses constant conjunction plus temporal priority.
  *   **Truth Conditions:** The sentence *"Switch makes light"* is true if and only if switch-flipping events are regularly followed by illumination events, with no additional modal "glue."
  *   **Beliefs:** The speaker believes only in the observed correlation and expects it to continue.
  *   **Charity:** The speaker is largely right; the correlation holds. The speaker is rational; Humean skepticism about hidden powers is a coherent, standard stance.

  Both manuals account for every disposition to assent or dissent. In every actual and counterfactual situation the speaker encounters (or would endorse), the correlation holds. Thus, the evidence is identical. Both manuals portray the speaker as correct about the world (the light does come on) and rational (the inference is reliable). Neither is more charitable: attributing belief in "causal powers" is no less rational than attributing belief in "regularities," as metaphysics does not adjudicate between them empirically.

  ### 1. Commitments and the Precise Difference
  **Manual 1** commits the interpreter to the claim that the speaker's language is sensitive to **modal structure**. The speaker's utterances track not just what happens, but *why* it happens. The logical form attributed is relational: $Cause(s, l)$.
  **Manual 2** commits the interpreter to the claim that the speaker's language is **extensional**. The speaker's utterances track sequences of events. The logical form attributed is conjunctive/universal: $\forall t (Switch_t \rightarrow Light_t)$.

  **The Difference:** The divergence is in the **truth conditions of the sentences**.
  *   In M1, the sentence is false in a world where the switch and light are correlated by pre-established harmony (no causal link).
  *   In M2, the sentence is true in that same world (correlation suffices).
  *   This is not a change of notation (like $\neg(P \land Q)$ vs $\neg P \lor \neg Q$) because the manuals disagree on what makes the sentence true in non-actual scenarios.
  *   This is not a sub-sentential reference swap (like "rabbit" vs. "rabbit-stage") because the disagreement propagates to the sentence level truth conditions (Modal vs. Non-Modal).
  *   This is not a vocabulary difference; both use "cause/makes" but assign different intensions.

  **The Trade-off:** M1 trades ontological parsimony (positing causal powers) for alignment with ordinary realist intuition. M2 trades ontological parsimony (positing only events) for alignment with empiricist constraints. Both are philosophically viable, making the trade-off neutral with respect to Charity.

  ### 2. The Davidsonian and Quinean Replies
  **The Davidsonian:**
  A Davidsonian must argue that meaning is exhausted by a theory of truth grounded in evidence. Since the evidence (assent/dissent) is identical, the truth conditions *must* be treated as identical for the purpose of interpretation. The Davidsonian will claim M1 fails the constraint of **empirical grounding**. Truth conditions that outstrip all possible evidence (i.e., the difference between causation and correlation) are not admissible in a meaning theory. Therefore, M2 is the only valid manual; M1 is metaphysically inflated and fails to be a *theory of meaning* because it posits truth-conditions that cannot be verified by the interpreter.
  *Result:* There is no fact of the matter. M1 is ruled out as nonsense.

  **The Quinean:**
  A Quinean will argue that M1 posits "meaningless" modal entities. Quine rejects quantification into modal contexts. M2 is preferred because it translates the speaker's language into the canonical notation of **extensional logic**. M1 is intertranslatable with M2 only if we treat "causal power" as a *façon de parler* for regularity. If M1 insists on real modal force, it is not a translation but a corruption.
  *Result:* There is no fact of the matter about "causal power." The speaker means M2.

  **The Difference:** Both deny genuine indeterminacy, but for different reasons. Davidson denies it because truth conditions cannot exceed evidence. Quine denies it because modality is not ontologically respectable. Both conclude the indeterminacy is "harmless" (M2 wins by default). My argument is that this dismisses a genuine divergence in the speaker's possible conceptual scheme.

  ### 3. The Working Feature and Its Removal
  **The Feature:** **The Observability of Truth-Makers.**
  In standard cases (e.g., "gavagai"/rabbit), the indeterminacy is declared harmless because the interpreter can independently verify the truth-maker. We see the rabbit. We can point and say, "Whether you mean 'rabbit' or 'rabbit-stage', *that* is there." The truth-maker is **perceptually transparent**.

  In my case, the truth-maker for *"Switch makes light"* is **perceptually opaque**. We see the switch move and the light shine. We do *not* see the "causal power" or the "necessitation." We only see the correlation.
  *   **When Removed:** If we remove this feature—i.e., if we stipulate that causal powers *were* observable (perhaps the speaker glows when exerting power, or we have a "causation-meter")—the indeterminacy collapses. The interpreter could check the meter. If the meter reads "Power," M1 is confirmed. If the meter reads "Sequence," M2 is confirmed.
  *   **Why it Collapses:** The standard treatment relies on the assumption that all meaningful differences must eventually cash out in observable differences. In the rabbit case, they do (pointing). In the causal case, they do not (Hume's Gap). Because the truth-makers are invisible, the evidence cannot distinguish the manuals, yet the truth conditions remain distinct. This makes the indeterminacy **genuine**: the speaker could genuinely mean either, and the world does not force a choice.

  ### 4. The Strongest Objection and Rebuttal
  **The Objection (The Charity Maxim):**
  The strongest objection comes from a robust Principle of Charity. We (the interpreters) live in a world where Causal Realism is arguably the *true* metaphysics (or at least, the standard scientific view). To interpret the speaker as a Humean (M2) is to attribute to them a skeptical metaphysical stance they likely do not hold. To interpret them as a Realist (M1) aligns them with *our* best theory of the world. Therefore, M1 is *more* charitable because it maximizes agreement on the *nature* of reality, not just the surface correlations. M2 is thus inferior, and the indeterminacy is resolved in favor of M1.

  **Rebuttal:**
  This objection begs the question. The Radical Interpreter is supposed to have "no prior access." If the interpreter imports their own metaphysical commitments (that Realism is true) to settle the interpretation, they are violating the constraint of starting from scratch.
  *   **Survival:** A version of the case survives if we acknowledge that *we* do not know if Causal Realism is true. Hume's problem remains unsolved in philosophy and science. Since *we* cannot decide between M1 and M2 for ourselves, we cannot use Charity to decide it for the speaker. Therefore, the indeterminacy persists. The speaker's meaning is genuinely underdetermined because the world itself underdetermines the metaphysics of causation. The "harmless" resolution works for rabbits because we know what rabbits are; it fails for causes because we don't know what causes *are*.
