      *Self-Correction on Consensus:* The consensus among experimentalists is that people pass. The consensus among theorists is that BI is the benchmark, but *common knowledge of rationality* is the assumption that fails. Very few serious theorists claim BI logic is formally invalid *within its own axioms*. They claim the axioms don't apply. I must be careful not to overstate the "Logic is Broken" crowd. They exist (e.g., some philosophical critiques), but they are fringe compared to "Incomplete Info" or "Social Preferences."

