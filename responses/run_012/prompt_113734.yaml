          *   They can't do the math -> **Bounded Rationality**.
          *   They are just making mistakes -> **Orthodox/Noise**.
          *   They act as a group -> **Team Reasoning** (This might straddle, need to place carefully).

      *Actually, Team Reasoning changes the agency, not necessarily the logic.* If "We" maximize, passing is rational for "Us." This fits under "Logic Holds" if you accept "We" as the agent. But often it's framed as a critique of methodological individualism. I'll place it in Logic Holds but note the agency shift.

      *Let's refine the "Logic Flaw" camp.* Who is here? Binmore (later work), some philosophers (e.g., Hollis). It's small.
      *   *Consensus Note:* Most theorists are in "Logic Holds."

      *Unoccupied Nodes:*
      *   "Logic Flaw" + "Money is the only thing." (If logic is flawed, why? Usually because of counterfactuals).
      *   "Bounded Rationality" + "Perfect Knowledge." (Contradictory).

      *Awkward Commitments:*
