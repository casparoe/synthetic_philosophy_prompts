      2.  **The Logic Question:** If players *only* cared about money and were perfect logicians, should the game end on move 1? (Yes -> Deflationary/Uncertainty. No -> Logic is Flawed).
      3.  **The Knowledge Question:** Do you believe players know for sure that their opponent is a perfect logician? (Yes -> Standard BI. No -> Reputation/Uncertainty).
      4.  **The Capacity Question:** Is the logic too hard for humans to actually do? (Yes -> Bounded Rationality).
      5.  **The Agency Question:** Are players acting as individuals or a group? (Group -> Team Reasoning).

