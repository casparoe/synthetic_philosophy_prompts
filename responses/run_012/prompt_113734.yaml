      *   *Q5: The Logic Itself.* If everyone *was* perfectly rational and only cared about money, would the game still end immediately? (This is the crucial split between "Deflationary" and "Logic is Broken").

      *Refining the Flow:* Let's organize it to hit the user's specific request: "Deflationary (logic fine, people weird)" vs. "Logic Broken."
