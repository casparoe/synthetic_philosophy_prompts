      *   *Position 1: Strict Rationality (The Orthodoxy).* BI is correct. Players are irrational or confused. Payoffs are money. Game is one-shot. (Binmore, standard neoclassical).
      *   *Position 2: Bounded Rationality.* Players can't do the math. It's too hard. (Rubinstein, Simon).
      *   *Position 3: Social Preferences/Altruism.* Payoffs aren't just money. People care about fairness or the other guy. (Fehr, Schmidt).
      *   *Position 4: Epistemic Uncertainty.* I'm rational, but I'm not sure *you* are. If I pass, I signal I might be irrational, which might make you pass later. (Kreps, Milgrom, Roberts, Wilson - "Gang of Four").
      *   *Position 5: Team Reasoning.* We aren't "I vs. You," we are "Us." (Bacharach, Sugden).
      *   *Position 6: Context/Frame.* The lab setting implies social norms (don't be a jerk). (Goffman, sociological game theory).
      *   *Position 7: Backward Induction is Flawed.* The logic itself relies on counterfactuals that can't be true. (Binmore later, some philosophers). *Note: This is a minority view but live.*
      *   *Position 8: Learning/Evolution.* We play this way because it works in the long run, even if it fails the static logic. (Evolutionary Game Theory).

      *Consensus Check:* The mainstream consensus is *not* that backward induction is wrong. The consensus is that the *assumptions* of the standard model (common knowledge of rationality, pure money maximization) don't hold in the lab. The "logic is broken" crowd is a distinct minority/philosophical niche. I need to make sure the flowchart reflects that the "Take Immediately" crowd are the traditionalists, but the "Pass" crowd has many sophisticated justifications, not just "people are nice."

