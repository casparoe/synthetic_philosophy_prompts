answer: |-
  **Dissertation Prospectus**

  **Title:** Intervening on Selection: A Causal Criterion for the Units of Selection Debate

  **1. Research Question and Problem Statement**
  The "units of selection" debate in the philosophy of biology has proven interminable. Proponents of gene-selectionism, multi-level selection, and pragmatic instrumentalism frequently talk past one another. My central hypothesis is that this stalemate arises from a systematic equivocation: the term "unit of selection" is currently doing three distinct explanatory jobs. It is used to identify (a) the bearer of adaptation (what the design is *for*), (b) the driver of evolutionary dynamics (what causes frequency change), and (c) the locus of predictive fitness (where variance is statistically recoverable).

  This project asks: **Can an interventionist account of causation disentangle these three questions and provide a determinate criterion for identifying the unit of selection in contested cases?**

  Specifically, I propose defining the unit of selection as the level at which fitness covariances remain *invariant* under interventions on lower-level entities. If intervening on a lower-level component (e.g., a gene) fails to alter the fitness covariance at a higher level (e.g., the organism), the higher level qualifies as an autonomous unit of selection. This project will test whether this criterion resolves classic paradoxes without collapsing into gene-centrism or vague contextualism.

  **2. Critique of Existing Frameworks**
  Current positions in the literature generally fall into three shapes, all of which suffer from the conflation identified above.
  *   **The Reductionist Camp:** Argues that because genes are the only replicators with long-term lineages, they are the sole units of selection. This position secures causal precision but fails to account for emergent fitness structures where lower-level interventions are screened off.
  *   **The Pluralist Camp:** Argues that selection operates simultaneously at multiple levels. While descriptively accurate, this view often lacks a principled method for deciding *which* level is explanatory in a specific context, leading to the charge that "unit" is merely a modeling convenience.
  *   **The Pragmatist Camp:** Suggests the question is ill-posed and should be replaced by questions about explanatory utility. This dissolves the metaphysical tension but abandons the intuition that there is a fact of the matter about biological design.

  All three camps assume that "causation" in selection is univocal. By treating causation as a matter of invariant relationships under intervention, this project offers a way to validate the Pluralist intuition (multiple levels exist) with the Reductionist demand for causal precision, while avoiding the Pragmatist surrender.

  **3. Methodology and Case Studies**
  This is a work of conceptual analysis grounded in biological modeling. I will not conduct empirical experiments but will analyze existing formal models and empirical case studies through the lens of interventionist causation.

  I will apply the invariance criterion to three paradigmatic tension points where current theories diverge:
  1.  **Meiotic Drive:** Cases where gene-level fitness diverges from organismal fitness. Does the interventionist criterion correctly identify the gene as the unit here, despite the organismal "design"?
  2.  **Sterile Castes in Social Insects:** Cases where organismal reproduction is zero. Does the colony level show invariance under interventions on individual workers?
  3.  **Major Transitions (Multicellularity):** The shift from single-cell to multicellular units. Can the transition be defined as the point where lower-level fitness covariance becomes variant under higher-level interventions?

  **Secondary Aim:** I will investigate the relationship between this causal criterion and the concept of *modularity* from evolutionary developmental biology. If the "unit of selection" is the level at which the fitness structure is modular, this would bridge the gap between selectionist and developmentalist explanations. If they diverge, it suggests a deeper fracture in evolutionary theory.

  **4. Timeline (Year 1)**
  *   **Months 1–3:** Formalization of the interventionist criterion. Review of causal modeling literature to ensure the definition of "invariance" is mathematically and philosophically robust.
  *   **Months 4–6:** Application to Case 1 (Meiotic Drive) and Case 2 (Social Insects). Drafting of two conference papers to test arguments against external feedback.
  *   **Months 7–9:** Application to Case 3 (Multicellularity) and analysis of the Modularity connection.
  *   **Months 10–12:** Synthesis of results into a dissertation chapter draft. Evaluation of whether the criterion holds across all cases or requires case-specific modification.

  **5. Success and Failure Conditions**
  *   **Success:** The interventionist criterion yields a determinate verdict in all three case studies that aligns with biological intuition (e.g., identifying the colony as the unit in eusocial insects) without requiring ad-hoc adjustments. Furthermore, success involves demonstrating that the three conflated questions (adaptation, dynamics, prediction) map onto distinct causal structures.
  *   **Failure:** The criterion collapses into triviality (e.g., "it depends on how you intervene," which mirrors the Pragmatist failure) or consistently defaults to the gene level regardless of biological context. Failure also includes discovering that the "modularity" concept is incompatible with the causal criterion, forcing a abandonment of the secondary aim.

  **6. Feasibility and Scope Assessment**
  *Is this project too big for one year?*
  Yes, if the goal is a complete dissertation. No, if the goal is to establish the core theoretical framework and validate it against key cases.
  The risk of scope creep lies in the "Modularity" secondary aim and the breadth of the "Major Transitions" case study. To ensure feasibility within the first year, the project will prioritize the formalization of the interventionist criterion and the first two case studies (Meiotic Drive and Social Insects). The Multicellularity case and the deep dive into Modularity will be treated as extension chapters contingent on the success of the core framework.
  This prospectus outlines a *theoretical* dissertation. The workload is front-loaded in conceptual analysis rather than data collection. The primary bottleneck is not time, but conceptual resolution: if the interventionist definition proves unworkable in Month 3, the project requires a pivot. However, given that the case studies are well-modeled in existing literature, the analysis is contained within a manageable scope for a first-year research plan, provided the Modularity comparison is kept secondary.

  ***

  **Note to the User (Outside the Prospectus Text):**

  I've written this to sound confident, but I need to give you the "honest assessment" you asked for regarding the scope.

  **The "Too Big" Problem:**
  A dissertation is typically a 3–5 year project. A one-year timeline usually produces a *qualifying paper* or a *first chapter*, not a full dissertation. Your committee is already worried your interests are "too broad." If you submit a prospectus that says "I will solve the unit of selection debate in 12 months," they might flag it as naive.

  **My Strategic Choice in the Draft:**
  In Section 6 (Feasibility), I explicitly wrote: *"Yes, if the goal is a complete dissertation. No, if the goal is to establish the core theoretical framework..."*
  I did this to show the committee you understand the difference between *researching* the concept and *writing* the full dissertation.

  **Advice for your meeting:**
  1.  **Clarify the Timeline:** Tell them this prospectus outlines the *research phase* for the first year (leading to a substantial paper or Chapter 1), but you understand the full writing process will take longer.
  2.  **Defend the "Modularity" Point:** Be prepared to cut the Modularity section if they push back. It's the riskiest part of the proposal. If the interventionist stuff works, Modularity is a bonus. If it doesn't, Modularity won't save it.
  3.  **The "Three Questions":** This is your strongest selling point. Emphasize that you aren't just adding another definition of "unit," you are diagnosing *why* the debate is broken. That justifies the conceptual work.

  Good luck. This is actually a really sharp idea; the key is selling it as a *dissolution* of a problem rather than just another *solution* to it.
