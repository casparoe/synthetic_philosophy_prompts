prompt: |-
  Okay so I'm putting together a dissertation prospectus (first-year PhD, my committee is friendly but they keep telling me my interests are "too broad," which is fair) and I need to turn a half-formed idea into something that actually looks like a research proposal. Here's the half-formed idea. I keep arguing with a friend about the units-of-selection thing and we never get anywhere, and I've started to suspect it's because everyone in the debate is answering a different question and calling it the same one. There's the question of what bears adaptations — what the design in nature is *for*, so to speak — and there's the question of what causes evolutionary change, and there's a third thing, what entity's fitness you can actually predict from, and I think these get run together constantly. My hunch is that the debate only looks interminable because "unit of selection" is doing all three jobs at once and nobody notices when they swap.

  What I want to try is to import an interventionist account of causation — the kind of thing where X causes Y just in case intervening on X changes Y — and use it as a criterion. Roughly: a level counts as the unit of selection just in case the fitness covariances at that level are invariant under interventions on entities at lower levels. Then the real work is seeing whether that criterion (a) gives a determinate verdict in the cases everyone fights about — meiotic drive, sterile castes in the social insects, the transition to multicellularity — and (b) doesn't just collapse into "well then it's always the gene" or "it depends what you're asking." I also want to steal the notion of a module from evo-devo and ask whether "unit of selection" should just be "the level at which the fitness structure is modular," because I think that might be the same idea, and if it is that's interesting, and if it isn't that's even more interesting.

  Can you write the prospectus for me? Two pages or so. I need the question stated precisely enough that a reader could tell when it's been answered, plus some account of why the existing camps don't settle it — I'd rather you talk about the shape of the positions than cite anyone, I'll fill in the references myself and honestly half the papers I'd cite I haven't even read yet. Then the method: what I'd actually do month by month for a year, given that I'm not running experiments, I'm just doing conceptual work on cases. Say what a successful result looks like versus what would count as the project failing, and be honest about whether this is too big for a year — my committee will ask and I'd rather hear it from you first than from them.
