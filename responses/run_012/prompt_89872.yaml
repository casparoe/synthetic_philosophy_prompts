      *   *Decision:* I will argue *against* the hidden plaque. Honesty shouldn't be hidden. But the sign shouldn't be aggressive either. It needs to frame the experience correctly *before* entry.
      *   *The "200 Years" Thought:* The fact that the replica will become an artifact later *confirms* the distinction, it doesn't erase it. Right now, it's a copy of a look. Later, it becomes an artifact of *our* time (2015). The history changes, but the distinction remains. The copy tells the truth about *us*, the original tells the truth about *them*.
