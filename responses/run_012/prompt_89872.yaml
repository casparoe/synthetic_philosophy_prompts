answer: |-
  Friends, neighbours, colleagues.

  I stand here with a complicated history. Thirty years ago, I sat on the committee that recommended closing the real cave. I voted to lock the door. I know what that cost this town. I know the decade that followed was lean, and I know that for many of you, that decision felt like a sentence. I do not apologize for the conservation; the stone was dying, and we could not save it and keep it open. But I do apologize for the weight of it. I have carried the silence of that cave, and the silence of this town, for a long time.

  Today, we break that silence.

  Look at what stands before us. The artists who built this spent six years learning how to see like people who lived here before there was a word for "art." They matched the pigments. They matched the contours of the wall. They matched the light. When you walk inside, the visual shock is genuine. It is breathtaking.

  My old colleague, here today, once wrote that a copy is a lie with better lighting. He is a brilliant man, and he is right to be suspicious. But I am here to suggest that "lie" is the wrong word. A lie intends to deceive. This does not. This is a translation.

  We need to be clear about what a visitor gets when they walk through those doors, and what they do not. We keep talking about authenticity as if it is a single thing. It is not. It is two things: a *look*, and a *history*.

  This replica is a perfect record of a look. If you want to see the sweep of the bison, the curve of the horse, the specific ochre hue of the hand stencil, you will see it here. In some ways, you will see it better than in the real cave, where calcite has clouded the stone and distance keeps us back. Visually, this is a triumph.

  But this is a worthless record of a history.

  When you stand before the original, you are standing before a witness. Every smudge, every crack, every faded line is the trace of a hand that was here before there was anything you would call a town, before there was anything you would call a nation. That stone remembers a different world.

  When you stand before these panels, you are standing before a trace of a hand that was here in 2015. The skill is immense, but the gap is unbridgeable. No amount of technical fidelity can manufacture time. To pretend otherwise is to insult the ancestors who made the originals, and it is to insult the visitors, who are smart enough to know the difference between a witness and a reenactment.

  Now, I know there is a worry that admitting this ruins the magic. There is a proposal circulating to place a small plaque at the entrance—low down, small print—stating these are copies, while the main sign bears only the cave's name. The argument is that this is honest, because the text is there, even if nobody reads it.

  I cannot support this. Honesty that relies on invisibility is not honesty; it is a loophole. If we hide the nature of this place in the fine print, we validate the idea that there is something shameful about the truth. There is nothing shameful here. We have built something magnificent. We do not need to trick people into appreciating it.

  There is another worry, one that keeps me up at night. In two hundred years, this replica will be old. The pigments will age. The techniques will be archaic. People will want to conserve *this* building as an artefact in its own right. Does that mean the distinction I'm drawing is temporary? Does it mean that eventually, the copy becomes the real thing?

  My answer is no. It means the opposite.

  In two hundred years, this replica will indeed be an artefact. But it will be an artefact of *us*. It will tell the story of what the year 2015 valued, how we saw the past, and how we tried to preserve it. The original cave tells the story of the people who painted it. This cave tells the story of the people who copied it. Both are valuable. Both are history. But they are different histories. Recognizing that difference doesn't diminish this building; it gives it its own dignity. It allows this place to stand on its own feet, rather than living in the shadow of a ghost.

  So, to the guides in the room: You are not selling a deception. You are selling a connection. You are inviting people to step into a vision of the past that we have worked tirelessly to reconstruct. You can tell them exactly what this is, and they will still be awed. In fact, they will be more awed, because they will understand the effort it took to bring it to them.

  To the town: This is not a consolation prize. It is a new chapter. The real cave is resting. This cave is speaking.

  We do not need to hide the truth to sell the experience. We need to tell the truth to deepen it.

  Thank you.

  ***

  **The Entrance Sign**

  If it were up to me, the Councillor's proposal for a hidden plaque and a vague main sign should be rejected. The information must be integrated into the primary visitor experience immediately, without breaking the immersion of the landscape.

  **The Main Entrance Sign should read:**

  > **THE CAVE OF [NAME]**
  > **A FACSIMILE EXPERIENCE**
  >
  > *You are about to enter a precise reconstruction of the original cave, closed for conservation in 199X.*
  > *Every mark you see here was made by modern artists to preserve the look of the past.*
  > *The original stone holds the history. This stone holds our tribute to it.*
  >
  > *Please enter with respect for both.*
