  This is a sharp observation of a specific structural problem in decision theory and population ethics. You are correct that while it shares DNA with Pascal's Mugging, the "carving" is distinct enough to warrant a more precise label.

  The established term in the decision-theory and effective altruism literature (e.g., in work by William MacAskill, Hilary Greaves, and Amanda Askell) for the general phenomenon of letting tiny probabilities of huge values dominate decision-making is **Fanaticism**.

  However, because you rightly note that this isn't the "infinite utility" version often discussed in infinite ethics, nor the "malicious agent" version of Pascal's Mugging, the specific subtype you are describing is best carved out as **Empirical Fanaticism**.

  Here is the breakdown of the carving you asked for:

  ### 1. How it differs from Pascal's Mugging
  *   **Pascal's Mugging** typically involves a specific *agent* making a claim about their ability to affect outcomes (e.g., "Give me $5 or I will simulate 3^^^^3 people"). The skepticism is usually directed at the *causal link* or the *honesty* of the agent.
  *   **Empirical Fanaticism** involves *natural facts* (e.g., "There are $10^{18}$ insects"). The skepticism is directed at an *empirical property* (sentience). There is no mugger, no threat, and no promise—just a multiplication of population size by moral uncertainty.

  ### 2. How it differs from Infinite Ethics
  *   **Infinite Ethics** deals with outcomes that are literally unbounded (infinite utility). This creates specific mathematical pathologies (e.g., expected value is undefined).
  *   **Empirical Fanaticism** deals with *finite but astronomical* numbers. The math works (the expected value is a real number), but the *implications* seem absurd (e.g., prioritizing insects over humans). The problem isn't mathematical breakdown; it's intuitive implausibility.

  ### 3. How it differs from Ordinary Expected Value (EV)
  *   **Ordinary EV** is sensitive to evidence. If you update the probability from 1/10,000 to 1/1,000,000, the priority shifts.
  *   **Empirical Fanaticism** is *insensitive* to evidence within a certain range. Because the population factor ($N$) is so large, updating the probability ($p$) by several orders of magnitude doesn't change the ranking of priorities. The conclusion is "sticky" unless $p$ hits exactly zero.

  ### 4. How to reject it without rejecting arithmetic
  To reject the conclusion while accepting the math, you generally have to modify the decision theory. Common "patches" discussed in the literature include:
  *   **Bounded Utility Functions:** Asserting that moral value has a cap (diminishing marginal value of experiences), so adding more insects eventually adds zero *moral* weight even if it adds more *experiences*.
  *   **Probability Thresholds (Cutoffs):** Ignoring probabilities below a certain threshold (e.g., $< 10^{-9}$) for practical decision-making, effectively treating them as zero.
  *   **Epistemic Discounting:** Discounting the expected value based on the *uncertainty of the estimate itself* (not just the probability of the event), penalizing claims that rely on fragile, high-uncertainty parameters.
  *   **Risk Aversion (Buchak's REU):** Using Risk-Weighted Expected Utility theory, which allows a rational agent to overweight certainty and underweight tiny probabilities without violating rationality axioms.

  ### The Term
  While "Fanaticism" is the root term, using it alone might conflate this with the infinite-ethics version you want to distinguish. **Empirical Fanaticism** is the precise technical term for when the "huge number" comes from empirical uncertainty about the world (population/sentience) rather than axiological uncertainty about values or infinite payoffs.

  \answer{Empirical Fanaticism: Decision-theoretic dominance via tiny probabilities of astronomical empirical scales.}
