          2.  The Ranked Agenda (1-5).
          3.  The Cruxes/Hidden Assumptions.
          4.  Triggers for Re-ranking.
          5.  The Declined Question.

      *(Self-Correction during drafting)*: I need to make sure I address the "Statistician" role. The Measure Problem is perfect for a statistician + philosopher collaboration. The Non-empirical confirmation is Phil + Phil. The Cosmologist bridges them.
