prompt: |-
  I'm a science reporter and I've somehow been voluntold to run a brown-bag lunch at the office — forty-five minutes, no slides, a dozen reporters who cover health and tech, can skim a study abstract, have never taken a stats course. I picked the reference class problem. They don't know the name and I'd honestly rather they leave with the thing itself than the phrase, so don't explain it to me, plan the session: what has to be in place before it even looks like a problem to them, the order the pieces have to come in and why that order and not some other, the one example that carries the whole forty-five minutes and what that example has to have and lack, the misconceptions they'll walk in with or form along the way and the exact point in the sequence where each gets headed off, one question I can put to the room at the end that tells me whether it landed, and what I should openly refuse to get into at this level.

  Here's my thinking so far, argue with it. My carrier was going to be a risk calculator: I put a hypothetical patient up — sixty-year-old smoker with a family history — the calculator spits out a 12% chance of a heart attack in ten years, and then I show that the 12% is doing almost all its work through a choice of class that nobody in the room is making consciously, and that if I ask twelve reporters to say what the class is, I get twelve different answers and they're all defensible. Is that the right thing to hang it on, or does it quietly teach them that the problem is about medical stats? Second: I want to end on the claim that Sleeping Beauty is just the reference class problem wearing a costume — I read that somewhere, I half-beleive it, tell me if it survives contact or if I'm about to say something embarrassing in front of the desk. And a third thing I can't settle: do I have to make them care about the frequentist/subjectivist split first, or is that a tangent that eats the session? Half the room is Bayesian by temperament without knowing the word, and I can't tell if that's an asset or a landmine. My guesses at the misconceptions, for what they're worth: "you just pick the narrowest class you can" and "a probability of a single event is meaningless." Keep the whole thing under 700 words.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Science reporter running a brown-bag lunch for other reporters (health/tech beat).
      *   **Audience:** 12 reporters, can skim abstracts, no stats course, 45 mins, no slides.
      *   **Topic:** Reference Class Problem (but don't explain the name/definition directly, focus on the *thing*).
      *   **Constraints:** Under 700 words.
      *   **User's Plan to Critique:**
          1.  *Carrier:* Risk calculator (60yo smoker, 12% heart attack risk). Concern: Does this make it seem only about medical stats?
          2.  *Ending:* Claim "Sleeping Beauty is just the reference class problem wearing a costume." Concern: Is this embarrassing/wrong?
          3.  *Frequentist/Subjectivist Split:* Concern: Tangent or necessary groundwork?
          4.  *Misconceptions:* "Pick narrowest class" and "Probability of single event is meaningless."
      *   **Requirements:**
          *   What must be in place before it looks like a problem?
          *   Order of pieces and why.
          *   One example (criteria: what it must have/lack).
          *   Misconceptions & where to head them off.
          *   One final question to test understanding.
          *   What to refuse to get into.
          *   Argue with the user's thinking (Risk calculator, Sleeping Beauty, Frequentist split).

  2.  **Evaluate User's Thinking:**
      *   *Risk Calculator:* Good concrete start, but yes, risks medicalizing it. Needs to generalize quickly to tech/health policy.
      *   *Sleeping Beauty:* Dangerous. It's a philosophical puzzle about self-locating belief and credence, often linked to reference classes, but equating them directly might be too abstract/controversial for a practical newsroom session. It risks looking pretentious or confusing. Better to stick to journalism-relevant examples.
      *   *Frequentist/Subjectivist:* Definitely a tangent. Don't introduce philosophy of probability unless necessary. Focus on *utility* and *accuracy* in reporting.
      *   *Misconceptions:* Accurate guesses.

  3.  **Drafting the Plan (Iterative Process):**

      *   *Goal:* Keep it practical, journalistic, and under 700 words.
      *   *Structure:*
          1.  Critique user's plan (Risk calculator, Sleeping Beauty, Frequentist).
          2.  Define the setup (what must be in place).
          3.  The Example (criteria).
          4.  Sequence/Order.
          5.  Misconceptions & Interventions.
          6.  Final Question.
          7.  Refusals.

      *   *Critique:*
          *   Risk Calculator: Keep it, but broaden immediately. Don't let it stay in the clinic.
          *   Sleeping Beauty: Cut it. It's a parlor trick, not a reporting tool. You'll lose the room.
          *   Frequentist/Subjectivist: Ignore it. It's philosophy, not journalism.

      *   *The Example:* Needs to be relatable to health AND tech. Recidivism risk algorithms (COMPAS) or Insurance pricing? Let's go with **Insurance/Risk Pricing** or **Recidivism**. Actually, the user's heart attack example is fine *if* pivoted to "How do you report this number?" Let's stick to the user's heart attack idea but generalize it. Actually, a **self-driving car accident** might bridge health/tech better. Or stick to the medical one but ask "Is this person *like* the group?" Let's stick to the user's medical example but force the tech angle (algorithmic bias).
      *   *Wait, word count is tight.* I need to be direct.

      *   *Sequence:*
          1.  Present the number (12%).
          2.  Ask "12% of what?" (The Class).
          3.  Show multiple valid classes (Smokers? 60yo? 60yo smokers? 60yo smokers with dad who had MI?).
          4.  Show different probabilities for each.
          5.  Ask "Which headline do you write?"

      *   *Misconceptions:*
          *   "Narrowest is best": Head off when they suggest adding more criteria. Show data sparsity/overfitting.
          *   "Single event meaningless": Head off at the end. Focus on communication, not ontology.

      *   *Refusals:* Philosophy of probability, mathematical solutions, Bayesian priors.

      *   *Final Question:* "What class did the study use, and who did they leave out?"

  4.  **Refining the Argument (Word Count Management):**
      *   I need to argue with the user's plan *within* the plan description or as a preamble? The prompt says "argue with it" regarding their thinking, then "plan the session". I should integrate the critique into the advice to save words.
      *   *Sleeping Beauty:* Tell them to drop it. It's a distraction.
      *   *Frequentist:* Tell them to skip it.
      *   *Risk Calculator:* It's good, but needs to be framed as "Algorithmic Output" not "Medical Diagnosis" to fit tech reporters too.

  5.  **Drafting the Content (Mental Check):**
      *   *Intro:* Critique the three points briefly.
      *   *Setup:* Need uncertainty + competing valid groups.
      *   *Example:* The 12% heart attack risk is fine, but frame it as an *algorithm's output*.
      *   *Order:* Number -> Class -> Alternative Classes -> Conflicting Numbers -> Editorial Choice.
      *   *Misconceptions:* Address "narrowest" during the alternative classes phase. Address "meaningless" by focusing on the story impact.
      *   *Refusals:* Philosophy, math fixes.
      *   *Final Question:* "What's the denominator?"

  6.  **Writing - Attempt 1 (focusing on constraints):**
      *   Critique: Sleeping Beauty is a trap. It's philosophical trivia, not reporting fuel. Drop it. Frequentist/Subjectivist is a tangent; treat probability as a tool, not a truth. The risk calculator works if you frame it as an *algorithm*, bridging health and tech.
      *   Setup: They need to trust the number first. If they doubt the math, they won't see the class problem.
      *   Example: Needs stable math but unstable categories. The 60yo smoker works. Must lack: a single "correct" label.
      *   Order: 1. Show the 12%. 2. Ask "Who is this like?" 3. Reveal different groups yield 5%, 12%, 25%. 4. Ask "Which goes in print?"
      *   Misconceptions: "Narrowest class" arises at step 3. Counter: Show sample size collapse. "Single event meaningless" arises at step 4. Counter: Ignore metaphysics; focus on reader harm.
      *   Refusals: Don't solve it. Don't define Bayesianism.
      *   Final Question: "When you quote a risk, whose risk are you stealing?"

      *   *Word Count Check:* Need to be concise.

  7.  **Final Polish:**
      *   Ensure the critique of Sleeping Beauty is sharp.
      *   Ensure the "Refusals" are clear.
      *   Ensure the sequence logic is clear.
      *   Check word limit (under 700).

      *(Self-Correction during drafting)*: I need to make sure I answer the specific prompts: "what has to be in place", "order", "one example", "misconceptions", "one question", "refuse to get into". And argue with their thinking.

      *Drafting:*
      Drop Sleeping Beauty. It's a philosophical parlor trick that signals pretension, not insight. Your reporters cover real-world impact, not epistemology. It will confuse more than illuminate. Similarly, skip the frequentist/subjectivist split. It's a tangent that eats the session. Your room's Bayesian temperament is an asset only if you frame probability as *updating belief based on information*, not as a metaphysical stance. Don't name it; just use it.

      The risk calculator is the right carrier, but frame it as an **algorithm**, not a diagnosis. This bridges health and tech. If it stays medical, tech reporters tune out. If it's an opaque risk score used by insurers or hospitals, everyone leans in.

      **What must be in place:** They must accept the math is correct *within* a class. If they think the calculation is wrong, they won't see the classification problem. Establish the arithmetic is sound before questioning the grouping.

      **The Example:** Use your 60-year-old smoker. It must have: multiple valid descriptors (age, habit, genetics, geography) and lack: a hierarchy telling them which descriptor matters most. Do not use car accidents or coin flips; too sterile. Use money or health—stakes they cover.

      **Order:**
      1.  **The Number:** Present the 12% risk. Ask if it's reportable. (They say yes).
      2.  **The Group:** Ask "12% of *who*?" Reveal the class: "60-year-old males."
      3.  **The Split:** Ask "Is he also a smoker? A father? A New Yorker?" Show that narrowing to "Smoking Fathers" yields 20%; widening to "All Adults" yields 2%.
      4.  **The Choice:** Ask "Which number do you publish?"

      **Misconceptions & Interventions:**
      *   *"Pick the narrowest class":* This will emerge at Step 3. Head it off immediately by showing sample sizes. "Smoking Fathers with Heart Disease" leaves n=4. Narrowness breeds noise.
      *   *"Probability of a single event is meaningless":* This arises at Step 4. Don't debate ontology. Head it off by saying: "Your editor wants a number. Your reader wants truth. Which number harms less if wrong?" Shift from truth to consequence.

      **Refusals:** Openly refuse to solve it. Do not offer a mathematical fix. Do not define Bayesian priors. Do not discuss whether probability is "real." This is about journalism, not math.

      **Final Question:** "When you quote a stat in tomorrow's story, what group did the author leave out to get that number?" If they answer with specific exclusions (e.g., "women," "non-smokers"), it landed. If they answer with math, it didn't.

      **Why this order:** You must validate the number before destabilizing the class. If you start with the class problem, they think the math is broken. If you start with the math, they trust the tool until you show the input is subjective.

      **Sleeping Beauty Verdict:** Cut it. It implies the problem is a puzzle to be solved, not a bias to be managed. You want them managing bias.

      (Word count check: ~450 words. I can expand on the "Why" or the "Misconceptions" to be more helpful, but brevity is key. I need to ensure I hit the "argue with it" part strongly.)

      *Revised Plan for Word Count:* I need to make sure I explicitly answer the prompt's structural requirements while keeping the critique integrated.

      *Let's write.*
