  0.15

  **Decomposition of Credence**

  1.  **Probability that preferences are cardinally measurable in the relevant sense:** 0.90
      *   *Justification:* Health state valuations typically employ Standard Gamble or Time Trade-Off methods, which satisfy Von Neumann-Morgenstern axioms for cardinality under uncertainty.
  2.  **Probability that a non-arbitrary bridge principle exists:** 0.35
      *   *Justification:* While realist accounts of interpersonal welfare exist, there is no philosophical consensus that a unique, convention-independent method for scaling distinct minds is possible.
  3.  **Probability that, given such a principle, the comparison is invariant under permissible re-descriptions:** 0.60
      *   *Justification:* Even with a bridge, unless it uniquely fixes the zero and unit across persons, positive affine transformations of utility functions can reverse the verdict.
  4.  **Probability that well-being rather than preference satisfaction or objective goods is the correct object of comparison:** 0.85
      *   *Justification:* Preference satisfaction is the dominant operational proxy for well-being in welfare economics, despite competing objective-list or hedonist theories.
  5.  **Probability that the class of such comparisons is large enough to guide a concrete policy choice:** 0.95
      *   *Justification:* If interpersonal comparability holds for health states, it generally applies across the QALY framework used for resource allocation.

  **Combination Logic**
  I treat these as conjunctive necessary conditions for the strong definition of "determinate" provided (invariance across all representations and bridges). The final credence is the product of the five probabilities: $0.90 \times 0.35 \times 0.60 \times 0.85 \times 0.95 \approx 0.153$.

  **Sensitivity Analysis**
  My final number is most sensitive to **Term 2 (Probability that a non-arbitrary bridge principle exists)**. Because the definition of "determinate" requires invariance across *every* permissible bridge principle, the existence of even one alternative, equally permissible scaling method renders the fact indeterminate. Consequently, the credence collapses if there is any significant arbitrariness in how we map Person A's utility to Person B's.

  **Moving Evidence**
  This term would be most moved by **empirical evidence of a universal neural correlate of subjective welfare** (e.g., a specific "hedonic currency" in brain activity measurable across individuals). If neuroscience could demonstrate a common biological scale for pleasure and pain that aligns with preference elicitation, it would objectively fix the bridge principle, raising Term 2 from 0.35 toward 1.0 and increasing the final credence to approximately 0.45.
