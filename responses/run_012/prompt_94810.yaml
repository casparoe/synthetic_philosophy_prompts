answer: |-
  ### Brainstorming: Making the Intuition Bite

  To make the Knowledge Argument (Mary's Room) land viscerally, we need to avoid the "gotcha" feeling of a logic puzzle and instead create a moment of *frustrated anticipation*. The standard Mary thought experiment often fails because students treat "all physical information" as a magic wand—they assume if Mary knows the physics, she can deduce the experience. We need to show them that physical information, no matter how exhaustive, remains *inert* without the qualitative hook.

  **Key Design Choices:**
  1.  **The Stimulus:** It must be safe, legal, and truly novel to 18-22 year olds. Common spices (cinnamon, chili) are too familiar. *Grains of Paradise* or *Sichuan Button (Sansho)* are ideal. I recommend **Sansho extract on a taste strip**. It produces a distinct tingling/numbing sensation (somatosensory, not just gustatory) that is notoriously difficult to describe without using the sensation itself.
  2.  **The Dossier:** This is the critical failure point. If the dossier says "it feels spicy," the game is over. It must describe *mechanisms* (TRP channel activation, vasodilation) and *observables* (salivation rates, facial muscle contraction) without naming the *feeling*.
  3.  **The Failure (Phase 2):** Simply asking them to pick a jar they can't open feels like a trick. To make it philosophical, the failure must be about *reference*. They have the description, but they cannot *lock* that description onto the object in front of them without the qualitative link.
  4.  **The Debrief:** We must prevent the "Physicalist Dodge" (it's just a new concept, not a new fact) from swallowing the intuition whole too early. They need to feel the gap before we try to bridge it.

  ---

  # Activity Design: "The Qualia Blindspot"

  **Target:** 16 Upper-Level Undergrads (Philosophy of Mind/Cognitive Science)
  **Time:** 75 Minutes
  **Goal:** Embodied demonstration of the epistemic gap in the Knowledge Argument.

  ## 1. Roles and Rules

  *   **The Facilitator (You):** Gatekeeper of the dossiers and the "Experience." You do not reveal the stimulus name until the very end.
  *   **The Teams (4 Teams of 4):** Each team is a "Research Unit." They collaborate but submit individual bets/writings.
  *   **The Rule of Silence:** During Phase 1 and 2, no team may discuss *what they think the sensation is* with other teams. They can only discuss the dossier text.
  *   **The Currency:** "Epistemic Credits" (EC). Printed tokens or poker chips.
      *   Start: 10 EC per student.
      *   Betting: Wager 1-5 EC on answers.
      *   Payoff: 2x return on correct functional predictions. 0 on incorrect.
      *   *Note:* The currency is irrelevant to the grade but triggers competitive engagement.

  ## 2. Materials

  *   **Stimulus:** 16 Taste Strips (or gelatin capsules) containing **Hydroxy-alpha-sanshool** (Sichuan Button extract).
      *   *Backup:* If Sansho is unavailable, use **0.5% Citric Acid + 10% Caffeine solution** on a strip (Bitter-Sour shock).
      *   *Controls:* 12 Placebo strips (plain paper/empty capsule).
  *   **Containers:** 16 Opaque, sealed envelopes. 4 marked "Team A," 4 "Team B," etc. Inside each envelope: 1 Stimulus Strip + 1 Dossier.
  *   **The Lineup (Phase 2):** 4 Identical opaque boxes placed centrally. Label them 1, 2, 3, 4. Only Box 2 contains the actual stimulus for that team (you swap the boxes secretly or just declare the setup). *Correction:* To avoid trickery, place 4 *descriptions of sensations* on the board instead. (See Phase 2 refinement below).
  *   **The Dossier (Printed):** One per student. See "Sample Dossier" below.
  *   **Whiteboard:** Divided into three columns: **Ability**, **Acquaintance**, **Concept**.

  ### Sample Dossier Text (Crucial: No Qualia Words)
  > **Subject:** Compound X-99 (Hydroxy-alpha-sanshool)
  > **Chemical Class:** Alkylamide.
  > **Receptor Target:** TRPA1 and TRPV1 ion channels on trigeminal nerve endings.
  > **Physiological Effect:** Induces transient depolarization of somatosensory neurons in the oral mucosa. Causes localized vasodilation (increased blood flow).
  > **Observable Motor Output:** 85% of subjects exhibit *orbicularis oris* tightening (lip pursing) and increased blink rate within 10 seconds of exposure.
  > **Duration:** Neural firing persists for 180-300 seconds post-removal.
  > **Evolutionary Context:** Plant defense mechanism against mammalian herbivory; mimics thermal pain signals without tissue damage.
  > **Comparative Data:** Distinct from capsaicin (no heat accumulation); distinct from sodium chloride (no osmotic pressure change).

  ## 3. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Intro** | Explain rules. Distribute sealed envelopes. **DO NOT OPEN.** Screen for prior experience ("Raise hand if you know Sichuan pepper"). Excuse those students to be "Observers." |
  | **05-20** | **Phase 1** | **Dossier Mastery.** Teams read dossiers. They answer 5 functional questions (e.g., "Will salivation increase?"). They wager EC tokens. *Outcome:* They win most bets. They feel like they "know" the stimulus. |
  | **20-30** | **Phase 2** | **The Reference Gap.** You present 4 cards describing *sensations* (e.g., "A burning heat," "A vibrating tingle," "A cold ache," "A sharp stab"). Task: Match your Dossier's physical data to the correct Sensation Card. Wager EC. *Outcome:* They guess randomly. They lose tokens. The physics didn't tell them *what it's like*. |
  | **30-40** | **Phase 3** | **The Experience.** Students open envelopes. Consume stimulus. 2 minutes of silent experience. Then, re-match the Sensation Card. Re-answer Phase 1 questions. |
  | **40-50** | **Inventory** | **The List.** Individually, students write down: "One thing I know now that I did not know when holding the dossier." Collect these on the board. |
  | **50-70** | **Debrief** | **The Fight.** Sort the list into the 3 Buckets (Ability, Acquaintance, Concept). Debate the ontological implications. |
  | **70-75** | **Close** | Reveal the stimulus name. Dismiss. |

  ## 4. The Debrief: Questions & Board Work

  **Step 1: The Inventory (Board Work)**
  Ask students to shout out what they learned. Write them verbatim.
  *   *Examples:* "I know how to recognize it." "I know it feels weird." "I know it's not painful but it is intense."
  *   **Task:** Ask the class to sort these into three columns on the board:
      1.  **New Ability:** (e.g., "I can now imagine it," "I can recognize it in a lineup.")
      2.  **New Acquaintance:** (e.g., "I am now acquainted with the sensation itself.")
      3.  **New Concept/Proposition:** (e.g., "I now know *this* is what TRPV1 activation feels like.")

  **Step 2: The Philosophical Fight (Guided Questions)**
  *   **Q1 (The Gap):** "In Phase 1, you had all the physical facts. In Phase 3, you had the experience. What exactly crossed the gap? Was it a *fact* about the world, or a *fact* about your brain?"
  *   **Q2 (The Physicalist Defense):** "If a Physicalist says, 'You didn't learn a new fact about the stimulus, you just learned a new *way of accessing* the old fact (the phenomenal concept),' does that satisfy you? Why or why not?"
  *   **Q3 (The Mary Parallel):** "Mary leaves the room. She sees red. Does she learn something about *light*, or something about *herself*? Does your experience with the Sansho strip suggest the dossier was *incomplete*, or that *you* were incomplete?"
  *   **Q4 (The Hard Turn):** "If the dossier was truly exhaustive (every atom, every neuron), and you *still* learned something new upon tasting... does that mean physicalism is false? Or does it mean 'exhaustive physical information' is impossible to transmit linguistically?"

  ## 5. Troubleshooting: What Goes Wrong

  **1. The "Leak" in the Dossier**
  *   *Risk:* You accidentally write "causes a grimace" which implies "unpleasant."
  *   *Fix:* Use clinical anatomical terms ("zygomaticus contraction"). If a student says, "So it tastes bad?" do not confirm. Say, "The dossier describes motor output, not hedonic tone."
  *   *Risk:* Someone smells the envelope.
  *   *Fix:* Use double-sealed foil packets.

  **2. The Prior Experience Contaminant**
  *   *Risk:* One student has eaten at a trendy Sichuan restaurant. They ruin the team's "ignorance."
  *   *Fix:* The screening question at the start is vital. "Have you ever experienced oral tingling from a plant?" If yes, they become a "Data Auditor." Their role is to ensure the team *only* uses the dossier text in Phase 1. They cannot speak about the sensation.

  **3. Phase 2 Feels Like a Trick**
  *   *Risk:* Students complain, "Of course we couldn't match the physics to the sensation card! You didn't give us the key!"
  *   *Fix:* Pre-empt this. "Mary knows everything about light waves. She is shown a red apple. Does she know *this* is the experience of red? Phase 2 tests if physical data grants *ostensive reference*. You have the data, but you can't point to the experience yet. That is the gap."

  **4. The "Ability Hypothesis" Wins Too Easily**
  *   *Risk:* Students conclude, "I just learned how to imagine it. It's a skill, not knowledge." (Lewis/Nemirow).
  *   *Fix:* Push back. "When you wrote down 'It feels electric,' did you write down a skill? Or did you report a truth? If I lie and say it feels like 'burning,' am I factually wrong?" Force them to defend whether phenomenal judgments are truth-apt.

  ## 6. The Honest Limitation (Read This Before Running)

  **What this activity CANNOT do:**
  This activity demonstrates an **Epistemic Gap** (you didn't know X until you experienced it). It does *not* prove an **Ontological Gap** (that the experience is non-physical).

  A savvy Physicalist student can (correctly) argue: "I gained a new *phenomenal concept* of the same physical fact. I knew the neural state N before. Now I know 'N = *this*'. That's a new mode of presentation, not a new property of the world."

  **Your Role:**
  You cannot use this activity to *refute* Physicalism definitively. If you try, you will lose the smartest students in the room.
  Instead, use it to **shift the burden of proof**.
  *   *Before the activity:* Physicalism seems obvious. "Of course everything is physical."
  *   *After the activity:* Physicalism requires work. "You have to explain away this very real feeling of 'newness' as merely conceptual."
  *   *The Win:* The activity makes the Knowledge Argument *plausible* by making the "what it's like" irreducible in the moment. It forces the Physicalist to do the heavy lifting in the debrief, rather than the Dualist.

  **Final Tip:**
  Do not resolve the debate at the end. End with the question: *"If Mary knows all the physical facts, and she still says 'Wow' when she sees red... is she lying?"* Let them sit with that.
