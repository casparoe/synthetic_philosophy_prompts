prompt: |-
  Alright, I could use help thinking this through properly. About three months ago I ended up running a small mutual-aid group in my city — street outreach, handing out naloxone, a free grocery table, that sort of thing — because the woman who started it basically worked herself into the ground and had to step back. She's one of those people who never says no to anything: gave away most of her savings to the group, was on every shift, took in people who needed a couch. Everyone here still talks about her like a saint, and honestly two of the newer volunteers are heading the same way, and I'm the one who now has to decide what to ask people to do. I keep going back and forth in my head between "of course we should ask, people want to help, the need is real" and "wait, am I just farming other people's guilt and wrecking them the way she got wrecked?"

  What I want from you is a procedure I can actually run — a checklist, or a flowchart written out in words — for deciding how much to ask of a volunteer, or of myself, on a given thing. Not a vibe, an actual ordered set of questions: what to ask first, what counts as a good enough answer, where the procedure just stops and says no, and where it has to hand the decision off to a person because the question is really about values and not about facts. And I want it grounded in the actual philosophy here, not folk wisdom — the stuff about supererogation, doing more than duty requires, and the whole moral-saints debate (Susan Wolf's essay is the one I keep half-remembering) — the argument that being maximally morally good might not even be a good thing to aim at. I think that's the heart of my problem: is a saint actually what I want my volunteers to become, or is sainthood the failure mode I'm supposed to be preventing?

  Before you write the procedure, please brainstorm out loud the hard cases it has to survive, because I've already hit some and they're where the simple versions fall apart: asking someone to skip paid work for a shift; asking someone to take on personal legal or health risk (we sometimes get into it with police, and we deal with people who are actively using); asking for money from people who don't have much; asking the same reliable person over and over because they always say yes; and the trap where you know someone will say yes no matter what, so you quietly stop asking and start telling.

  Then run it on two or three concrete cases and show me the output, including at least one where the procedure gives me an answer I won't like — I'd definately rather find out now. Please make sure you cover these two: (a) a volunteer who's a nursing student and I want her to cover a night shift the day before an exam, and (b) whether I should ask our most reliable volunteer to put his own name on the lease for a storage unit we use, which exposes him personally if anything goes wrong. And be explicit about what the procedure can't do — where it'll misfire, and which steps are just judgment calls dressed up as rules.

  Write it for me, not for a philosophy seminar — I don't have a background in this and I'll be reading it on my phone between shifts. Don't give me a reading list or citations, I can't check them and won't. You can take the role of a philosopher who works on moral demandingness and the ethics of asking, but keep the language plain.

  One last thing: tell me how confident you actually are in the procedure you hand me, and point to the single step you're least sure about — the one you'd bet against if you had to.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Coordinator of a small mutual-aid group (street outreach, naloxone, groceries).
      *   **Problem:** Previous leader burned out (gave savings, worked every shift). New volunteers showing similar signs. User needs a concrete procedure (checklist/flowchart) to decide how much to ask of volunteers (and themselves).
      *   **Philosophical Grounding:** Supererogation, moral demandingness, Susan Wolf's "Moral Saints" argument (maximizing moral good isn't always the goal).
      *   **Requirements:**
          1.  Brainstorm hard cases first.
          2.  Create an ordered procedure (questions, stop conditions, hand-off points).
          3.  Test the procedure on specific cases: (a) Nursing student before exam, (b) Reliable volunteer on lease for storage.
          4.  Include at least one output the user won't like.
          5.  Explicitly state limitations (where it misfires, judgment calls).
          6.  Tone: Plain language, practical (readable on phone), not academic.
          7.  Confidence rating + least sure step.

  2.  **Deconstruct the Philosophy (Mental Sandbox):**
      *   *Supererogation:* Actions that are good but not required (going above and beyond). The procedure needs to distinguish between *duty* (what we must do to function) and *sainthood* (sacrificing everything).
      *   *Susan Wolf's "Moral Saints":* A life devoted entirely to morality is unattractive and potentially harmful. We need room for personal projects and self-care.
      *   *Demandingness Objection:* If morality asks too much, it becomes self-defeating (burnout).
      *   *Ethics of Asking:* The power dynamic between coordinator and volunteer. "Asking" can become "coercion" if the social pressure is too high.

  3.  **Brainstorming Hard Cases (as requested):**
      *   *Paid work vs. Shift:* Economic reality. Asking someone to lose wages is asking for a donation they might not afford.
      *   *Legal/Health Risk:* Naloxone outreach involves danger. Is it ethical to ask someone to face danger for a cause?
      *   *Financial Asks:* Asking poor people for money is exploitative.
      *   *The "Yes" Person:* The reliable volunteer who never says no. This is the burnout trap. The procedure must protect *them* from themselves.
      *   *Asking vs. Telling:* When does a request become an expectation?

  4.  **Developing the Procedure (The "Protocol"):**
      *   Needs to be sequential.
      *   Needs to incorporate the philosophical constraints (is this supererogatory? is it demanding too much?).
      *   Needs to identify "Stop" points.
      *   *Step 1: Necessity.* Is this actually needed?
      *   *Step 2: Risk/Cost Assessment.* What does it cost the volunteer? (Time, money, safety, mental health).
      *   *Step 3: The "Saint" Check.* Does this require them to neglect their own life/projects? (Wolf's argument).
      *   *Step 4: The "Yes" Person Check.* Have they said yes too many times recently?
      *   *Step 5: The Ask.* How to phrase it (explicit right to refuse).
      *   *Step 6: Post-Ask Review.* Did they hesitate?

  5.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Acknowledge the weight of the role. Validate the "saint vs. burnout" tension.
      *   *Brainstorming Hard Cases:* List the specific scenarios the user mentioned and why they break simple rules.
      *   *The Procedure:* Call it something practical like "The Sustainability Protocol." Use clear Yes/No logic.
      *   *Philosophical Integration:* Weave Wolf's ideas into the questions without jargon. Instead of "supererogation," use "above and beyond." Instead of "demandingness," use "cost to life."
      *   *Test Cases:*
          *   (a) Nursing Student: High personal cost (exam). Procedure should likely say *Don't Ask* or *Ask with extreme caveats*.
          *   (b) Lease Name: High personal risk (legal/financial). Procedure should likely say *No* (organizational risk vs. individual risk).
          *   (c) A third case where the answer is "No" but the user wants "Yes" (e.g., asking the burnout-prone leader for just one more shift).
      *   *Limitations:* Where does human judgment override the checklist? (e.g., emergency crises).
      *   *Confidence & Weak Point:* Be honest. The weak point is usually assessing the *internal* state of the volunteer.

  6.  **Refining the Tone:**
      *   Avoid academic citations (no "Wolf 1982").
      *   Keep it direct. "You are the coordinator."
      *   Make it mobile-friendly (short paragraphs, clear bullets).

  7.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is the procedure too rigid?
      *   *Fix:* Add a "Emergency Override" clause but warn about using it.
      *   *Critique:* Did I address the "Asking vs. Telling" trap?
      *   *Fix:* Include a specific step about phrasing the request to ensure refusal is safe.
      *   *Critique:* Is the philosophical grounding clear?
      *   *Fix:* Explicitly mention that a "good volunteer" is not a "self-sacrificing volunteer."
      *   *Check:* Did I include an answer the user won't like?
      *   *Fix:* Ensure the Lease case results in a hard "No," even if it solves the storage problem.

  8.  **Final Polish:**
      *   Check confidence rating.
      *   Check the "least sure step." (Likely the step about gauging the volunteer's hidden capacity).
      *   Ensure the distinction between "Duty" and "Supererogation" is clear in the logic.

  9.  *(Final thought before writing)*: The user is worried about *exploiting guilt*. The procedure needs to actively disarm guilt. The "Right to Refuse" isn't just a permission; it's a requirement for the ask to be valid.

  10. **Writing the Response.** (Proceeding to generate output based on these thoughts).
answer: |-
  Here is the breakdown you asked for. I've kept the philosophy in the engine, not the paint. You shouldn't need to know the theory to run the tool, but the tool is built to stop you from creating moral saints who burn out.

  ### Part 1: The Hard Cases (Brainstorming)

  Before we get to the checklist, we need to acknowledge where simple rules break. You listed the big ones, but here is why they are dangerous:

  1.  **Paid Work vs. Shift:** Asking someone to skip paid work isn't just asking for time; it's asking for money they might not have. If you ask this, you are implicitly valuing the group's need over their rent.
  2.  **Legal/Health Risk:** If a volunteer gets arrested or hurt on a shift, the group often survives, but their life derails. You cannot ask someone to gamble their future for your present.
  3.  **Asking for Money:** In mutual aid, resources are scarce. Asking a poor volunteer for cash is coercive because they want to prove they belong.
  4.  **The "Yes" Person:** This is the biggest trap. If someone never says no, their "yes" stops meaning consent and starts meaning compulsion. You have to protect them from their own inability to set boundaries.
  5.  **Asking vs. Telling:** When you know someone will say yes, a question ("Can you?") feels like an order ("You should"). The procedure must force you to make the "no" safe.

  ### Part 2: The Sustainability Protocol

  This is your procedure. Run this every time you are about to make a significant request of a volunteer (or yourself). "Significant" means: costs money, risks safety, takes more than 4 hours, or repeats a pattern of heavy lifting.

  **Step 1: The Necessity Check**
  *   **Question:** Is this task essential for the group's immediate survival, or is it just "how we've always done it"?
  *   **Pass:** It prevents harm today (e.g., feeding people tonight).
  *   **Fail:** It's for growth, comfort, or habit (e.g., expanding the table when we can't staff the current one).
  *   **Action:** If Fail, do not ask. Solve the problem differently or let it go.

  **Step 2: The Cost Assessment**
  *   **Question:** What does this cost the volunteer? (Money, sleep, safety, mental bandwidth, career progress).
  *   **Pass:** Low cost (time they have, skills they enjoy using).
  *   **Fail:** High cost (lost wages, legal liability, skipping self-care, high stress).
  *   **Action:** If Fail, move to Step 3. If Pass, you may proceed to Step 5.

  **Step 3: The "Saint" Filter (Philosophical Core)**
  *   **Question:** Does doing this require the volunteer to neglect their own legitimate personal projects or well-being?
  *   **Context:** A "Moral Saint" is someone who gives up everything for the good. We do not want saints; we want sustainable humans.
  *   **Pass:** They can do this and still be a student, parent, employee, and rested person.
  *   **Fail:** They must sacrifice a core part of their life (e.g., studying for an exam, paying rent, therapy) to do this.
  *   **Action:** If Fail, **STOP.** Do not ask. The need is real, but their life is more real. Find another way.

  **Step 4: The Pattern Check (Protecting the "Yes" Person)**
  *   **Question:** Has this person said "yes" to the last three significant requests?
  *   **Pass:** No, they have a mix of yes/no, or this is a new person.
  *   **Fail:** Yes, they are the reliable one who never drops the ball.
  *   **Action:** If Fail, you are not allowed to ask them directly. You must ask the group generally, or ask someone else first. You must break the pattern of reliance.

  **Step 5: The Phrasing Test (Asking vs. Telling)**
  *   **Requirement:** You must phrase the request so that "No" is a valid, guilt-free answer.
  *   **Rule:** You cannot say "We really need you." You must say "We need this done, but only if it works for you."
  *   **Action:** If you cannot say it without implying guilt, do not send the message.

  **Step 6: The Hand-Off (Values vs. Facts)**
  *   **Trigger:** If Step 2 or 3 is ambiguous (e.g., the cost is medium, not high).
  *   **Action:** This is no longer a logic problem. This is a values conversation. You must talk to the volunteer *before* the ask. "I have a task that might be heavy. I value your long-term health more than this shift. Can we talk about your capacity?"
  *   **Note:** This step admits the checklist can't read minds.

  ---

  ### Part 3: Running the Cases

  Here is the protocol applied to your specific scenarios.

  #### Case A: The Nursing Student (Night shift before exam)
  *   **Step 1 (Necessity):** Is the shift essential? Let's assume yes, we need bodies for safety. **(Pass)**
  *   **Step 2 (Cost):** Cost is high. Sleep deprivation + stress before a licensure exam. **(Fail -> Go to Step 3)**
  *   **Step 3 (Saint Filter):** Does this require neglecting personal projects? Yes. An exam determines her career. Sacrificing it for a shift is supererogatory (above and beyond duty) to the point of self-harm. **(Fail)**
  *   **Protocol Output:** **DO NOT ASK.**
  *   **Why you won't like it:** You need the shift covered. The need is real. But the protocol prioritizes her future over your current staffing gap. You must find a paid temp, cover it yourself, or cancel the shift.

  #### Case B: The Lease (Reliable volunteer puts name on storage)
  *   **Step 1 (Necessity):** Do we need storage? Yes. **(Pass)**
  *   **Step 2 (Cost):** Cost is extreme. Legal and financial liability falls on *him*, not the group. If the group breaks a law or doesn't pay rent, *he* gets sued. **(Fail -> Go to Step 3)**
  *   **Step 3 (Saint Filter):** Does this require neglecting well-being? Yes, it introduces chronic background anxiety and financial risk. **(Fail)**
  *   **Step 4 (Pattern Check):** He is the "most reliable." **(Fail)**
  *   **Protocol Output:** **HARD STOP.**
  *   **Why you won't like it:** This solves your administrative problem immediately. But it violates the core ethic. You cannot offload organizational risk onto an individual. You need to form a legal entity (LLC/Non-profit) or rent it under your own name if you must, but do not ask a volunteer to be the shield.

  #### Case C: The "Just One More" (Asking the previous founder)
  *   **Scenario:** The woman who started it is resting, but things are chaotic. You think if she just advised you for 2 hours a week, it would fix everything.
  *   **Step 1 (Necessity):** Helpful, but is it essential? Maybe not. **(Borderline)**
  *   **Step 2 (Cost):** Mental load. She stepped back to recover. **(Fail -> Go to Step 3)**
  *   **Step 3 (Saint Filter):** She already gave her savings and health. Asking her back asks her to resume the "Saint" role she fled. **(Fail)**
  *   **Protocol Output:** **DO NOT ASK.**
  *   **Why you won't like it:** She knows the system better than anyone. It feels inefficient not to use her. But the protocol identifies this as re-traumatizing the person who already paid the highest price.

  ---

  ### Part 4: Limitations & Misfires

  This procedure is not magic. Here is where it breaks:

  1.  **The Emergency Override:** If someone is overdosing *right now*, you don't run Step 3. You act. The protocol is for *planning*, not *crisis response*. If you use "emergency" as an excuse for planning failures, the protocol dies.
  2.  **Hidden Capacity:** Step 3 relies on you knowing what costs the volunteer. You might think an exam is no big deal, but for them, it's everything. You can't know this without Step 6 (The Hand-Off). If you skip the conversation, the checklist is blind.
  3.  **The "Mean Coordinator" Trap:** If you follow this strictly, you might feel like you aren't fighting hard enough. You might feel guilty that you *didn't* ask the nursing student. That guilt is the system working. It means you are resisting the urge to consume people.
  4.  **Judgment Calls:** Step 2 (Cost Assessment) is subjective. Is 4 hours high cost or low cost? For a single parent, it's high. For a retiree, it's low. You have to know your people. The checklist doesn't know them; you do.

  ### Part 5: Confidence & The Weak Link

  **Confidence Rating:** 85%
  This protocol will prevent 85% of the burnout scenarios you are worried about. It forces a pause where impulse usually takes over.

  **The Weak Link:** **Step 4 (The Pattern Check).**
  This is the step I would bet against.
  *Why:* It relies entirely on your record-keeping and memory. In the heat of the moment, when you are tired and understaffed, you will forget that "Sarah" has said yes to the last three requests. You will see her as the solution, not the pattern.
  *Mitigation:* You need a physical log. A spreadsheet or a notebook column that tracks "Last 3 Requests." If you don't write it down, Step 4 will fail, and you will burn out your best people.

  **Final Word:**
  You asked if sainthood is the failure mode. The answer is yes. A saint is a resource that gets used up. A volunteer is a partner who stays. This procedure is designed to keep them as partners. It will feel slower. It will feel like you are leaving resources on the table. That is the cost of not destroying the people who help you.
