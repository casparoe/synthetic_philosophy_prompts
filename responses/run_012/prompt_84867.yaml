      My line: No, it cannot. It rests *only* on agreement. This is the honest truth.
      *Make sure this is clear.*

      *Another constraint:* "must not trade on a real-money-versus-fake-money contrast."
      *Okay, so I must explicitly validate national currency as also being based on agreement, but distinguish the *scope* and *intent*.*

      *Let's go.*
answer: |-
  Friends, neighbors, shopkeepers, and friends who have become neighbors through this work. Welcome.

  Looking around this room, I see three things. I see excitement from those who have built this system from the ground up. I see caution from those who keep the shelves stocked in our town, wondering if this paper will buy bread tomorrow. And I see scrutiny from those who know how easily numbers can lie. To all of you, I owe the same thing: the truth.

  We are launching a local currency tonight. But before we talk about what this scrip can do, we must be honest about what it is. There is a temptation to say that national money is abstract or fake, while this local cash is real because it is backed by our community's needs. I will not say that. It would be false, and it would be dangerous.

  The truth is simpler, and perhaps more fragile. All money, whether printed by a central bank or by our own committee, rests on the same foundation. It is not backed by gold, or land, or even by "need" itself. It is backed by agreement.

  An ancient philosopher observed that money exists by convention, not by nature. No metal has value simply because it sits in the earth. It has value because we agree to treat it as a measure of exchange. Money is a tool we invented to solve a specific problem: without it, the baker who needs shoes must find a cobbler who needs bread exactly now. Money stands in for that need so exchange can happen without waiting.

  So, to our shopkeepers who ask the hard question: What makes this scrip worth anything? The answer is not a vault of reserves. The answer is you. It is worth what you agree to accept for your goods. If you accept it, it has value. If you refuse it, it is paper. There is no magic behind the curtain. The backing is the handshake between us.

  This might sound risky. In a way, it is. But it is also the only honesty available to us. National currency relies on a agreement we cannot see, among people we will never meet. This scrip relies on an agreement we can see, among people standing in this room. We are not creating wealth out of thin air. We are not promising that this paper will gain value or make anyone rich. In fact, if we do this right, no one will want to hold onto it for long.

  That same philosopher warned that there is a natural use of money, which is to facilitate the exchange of goods to meet real needs, and an unnatural use, which is to accumulate money for its own sake. Too often, our economy rewards the unnatural use. We hoard value while neighbors go without. This project is an attempt to return to the natural use. We are creating a tool designed to circulate, not to sit. It is worth something because it allows us to trade our skills and goods within this town, keeping the wealth of our labor here, where it feeds our neighbors.

  To the volunteers: Do not think of this as printing money. Think of it as printing trust. You are not building a bank; you are building a network of mutual obligation.

  To the shopkeepers: We know you fear being left holding worthless paper. We cannot guarantee profit. We can only guarantee our own commitment. We promise to accept this scrip for our own goods and services, so that you can spend it here, among us. The risk is shared. If the agreement holds, the town prospers. If the agreement fades, the paper fades.

  We are not trying to replace the national currency. We are trying to supplement it with something closer to home. We are acknowledging that while all money is convention, some conventions are more human than others. A convention we can look in the eye is stronger than one we cannot.

  So, let us not pretend this is backed by anything other than our word. But let us also remember how powerful our word can be when we speak it together. This scrip is a token of our pledge to trade fairly, to keep value moving, and to treat exchange as a means to serve need, not as an end in itself.

  Take it. Spend it. Pass it on. Let us see what we can build when we admit that the value was never in the paper, but in the people.

  Thank you.

  I committed to the conventionalist reading of Aristotle, which holds that money derives its validity solely from social agreement and law rather than any intrinsic natural property.
