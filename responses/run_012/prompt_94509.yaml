answer: |-
  Dear Colleague,

  Thank you for sharing your work on the ethics of assertion, and I am happy to provide the specific credence and decomposition you requested rather than a survey of the existing literature. My credence in the proposition that there is a non-derivative moral difference between lying and merely misleading is 0.62. This number is generated by a combination of four distinct terms that reflect the structural and normative components of the issue. The first term is a probability of 0.90 that there is a distinct norm governing assertion as such, rather than a single norm against bringing about false beliefs in others, justified by the widespread philosophical intuition and linguistic evidence that assertion has constitutive rules, such as the knowledge norm, which distinguish it from other forms of communication like implying or hinting. The second term is a probability of 0.85 that violating such a norm is wrong independently of its consequences, justified by the deontological view that breaching the constitutive rules of a social practice generates a moral residue even when the outcome is identical to a permissible alternative. The third term is a probability of 0.95 that this difference survives laundering, meaning that even if the speaker would have lied had the sequence of true statements not been available, the actual performance of asserting only what one believes retains a distinct moral character from asserting what one disbelieves, justified by the view that moral quality attaches to the act type itself rather than the counterfactual intentions of the agent. The fourth term is a weight of 0.15 assigned to the fact that a hearer who is misled has nothing to complain of regarding the truth of what was said to her, which acts as a discount factor because while the hearer cannot accuse the speaker of falsehood, the violation of communicative trust remains significant enough that this lack of complaint does not fully neutralize the wrong. The combination is calculated by multiplying the first three probabilities to establish a base credence of 0.72675 and then reducing that result by the weight of the fourth term, yielding 0.6177, which I round to 0.62.

  Given that your own credence is about 0.3, it appears we diverge most significantly on the second term, the probability that violating the norm of assertion is wrong independently of its consequences. Your lower overall credence suggests you likely view the wrongness of lying as derivative of the harm caused or the deception achieved, whereas I assign a high probability to the intrinsic wrongness of the act type itself. The evidence or argument that would move me most would be a successful reductionist account showing that the norms of assertion are merely social conventions grounded entirely in cooperative efficiency, such that violating them carries no moral weight beyond the resulting inefficiency or false belief. If you could demonstrate that the knowledge norm of assertion is fully explicable in terms of Gricean maxims without any remaining deontic residue, I would have to lower my probability on that second term substantially, which would bring my credence much closer to yours.

  Regarding the wrinkle you introduced about laundering, I maintain that the difference survives the procedure. If laundering allowed an agent to capture the wrong of lying while incurring none of its costs, it would imply that the moral status of the speech act is determined entirely by the speaker's private contingency plan rather than the public act performed. I argue that the moral cost is incurred in the actual assertion of what one disbelieves, so if the speaker navigates the interaction using only statements they believe to be true, they have not incurred the specific wrong of lying, even if their strategic intent was identical. The hearer in the laundered case is indeed misled, but the speaker has not violated the specific norm against asserting falsehoods, and thus the non-derivative difference remains intact despite the identical outcome and foreseen intention. This reinforces the third term in my decomposition, as I believe the moral landscape is shaped by what is actually said and believed at the moment of utterance, not by the roads not taken. I hope this breakdown helps you locate the precise point of disagreement in our respective views, and I look forward to seeing how you develop your argument against the non-derivative difference in your paper.
