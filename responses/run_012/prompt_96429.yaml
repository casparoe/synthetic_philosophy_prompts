      *   **Constraint 1:** Do *not* explain the science/philosophy in the story. Show, don't tell.
      *   **Constraint 2:** Setting: A tiny lab selling "timestamps for the moment of experience" to courts/insurers.
      *   **Constraint 3:** Plot: The protagonist discovers their machine cannot do what they claim (cannot pinpoint the true moment of experience).
