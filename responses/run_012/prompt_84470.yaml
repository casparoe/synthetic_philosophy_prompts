      *   **Question 5: Reverse Pressure (Stability of Art/Craft):**
          *   *Collingwood's Text:* He admits the line is hard to draw. He knows commissioned work exists.
          *   *Application:* AI highlights the tension. If a filmmaker has a vision (craft) vs. discovers it (art).
          *   *Verdict:* AI doesn't break the theory; it exposes the rigor of his distinction. He would likely demote much professional art to "craft" or "amusement."
          *   *Extrapolation:* He wouldn't change his theory to accommodate film/portraiture. He would bite the bullet.

      *   **Conclusion: The "Do Not Attribute" List:**
          *   Need 2-3 specific claims that would be irresponsible.
          *   1. That he would endorse AI art based on "surprise."
