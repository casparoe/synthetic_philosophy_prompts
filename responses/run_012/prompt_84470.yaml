          *   *Verdict:* He would likely reject the idea that the audience can supply the expressive activity *ex nihilo*. They need the artist's lead. If the "artist" (prompter) didn't express, there's nothing to reconstruct.
          *   *Extrapolation:* Attributing full creative agency to the viewer to make non-art into art is a stretch of his theory.

      *   **Question 4: The Moral Register (Corruption of Consciousness):**
