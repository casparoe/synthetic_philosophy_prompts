      *   **Specific Question:** Is the reading of the work as "activity of imagination" and audience as "party to that activity" contentious?
      *   **Five Specific Questions:**
          1.  Prompter: Craft or Art? (Preconceived end vs. emergent recognition).
          2.  Machine: Subject requirement? (Mind vs. Mechanism, Unpredictability).
