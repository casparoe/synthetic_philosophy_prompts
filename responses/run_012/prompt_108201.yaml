answer: |-
  It is entirely understandable that your instincts as an experimentalist recoil against this passage. You have spent a career in the "trenches" of evidence, where apparatus fails, data constrains, and nature says "no." The passage you quoted is a classic example of what philosophers call "pop-philosophy": it takes genuine, nuanced logical problems and sharpens them into skeptical weapons that do not reflect actual scientific practice.

  While the Duhem-Quine thesis is a serious and important topic in philosophy of science, the summary you found conflates logical possibility with practical reality. Below is an audit of the passage, followed by an analysis of the conclusion and a reconciliation with your laboratory experience.

  ### Sentence-by-Sentence Audit

  **1. "Duhem and Quine proved that no hypothesis is ever tested in isolation, since any failed prediction can always be blamed on the auxiliary assumptions instead;"**

  *   **Verdict:** **Mostly Fair, but Modally Overstated.**
  *   **Analysis:** This is the core of the **Duhem-Quine Thesis (Holism)**. It is logically correct that a prediction $P$ is derived from a Hypothesis $H$ *plus* Auxiliary Assumptions $A$ (about instruments, background conditions, ceteris paribus clauses). If $\text{not-}P$ occurs, logic dictates that $\text{not-}(H \land A)$ is false, but it does not specify whether $H$ or $A$ is at fault.
  *   **The Caveat:** The word "proved" is too strong; this is a logical observation, not a mathematical theorem. More importantly, the word "always" is contentious. While it is *logically possible* to save any hypothesis by adjusting auxiliaries, it is not always *rationally permissible* to do so. If you blame the failure on your telescope rather than your theory of gravity, you need an independent reason to suspect the telescope. If you have none, the move is ad hoc. Philosophers accept the holism, but most reject the idea that the blame can be shifted *arbitrarily* without cost.

  **2. "it follows that the evidence can never decide between rival theories, and that the choice between them is settled by convention, by taste in simplicity, or by social consensus rather than by nature."**

  *   **Verdict:** **Oversimplification / Non-Sequitur.**
  *   **Analysis:** This moves from **Holism** to **Radical Underdetermination** to **Social Constructivism**. This is where the argument breaks down.
      *   *Underdetermination:* Most philosophers accept that evidence can underdetermine theory *at a specific moment in time* (local underdetermination). However, the claim that evidence can *never* decide (global underdetermination) is widely rejected. As new technologies and experiments arise, the "tie" is often broken.
      *   *Convention/Social Consensus:* This is a specific sociological interpretation (reminiscent of the Strong Programme in Sociology of Scientific Knowledge), not a logical necessity. Even if evidence doesn't *force* a choice, it can *constrain* it. "Taste in simplicity" is not merely subjective preference; in physics, simplicity often correlates with mathematical consistency and unification power, which are objective virtues. To say these are "rather than by nature" ignores that these virtues are selected precisely because they track nature successfully.

  **3. "Lorentz's ether theory and Einstein's special relativity make exactly the same predictions, yet we call one true and the other superseded -- which shows that observation has no power to adjudicate, and that the older hope of letting experiment choose between theories was always naive."**

  *   **Verdict:** **Simply Wrong / Historically Misleading.**
  *   **Analysis:** This is the weakest link.
      *   *Empirical Equivalence:* Lorentz's theory and Special Relativity (SR) were empirically equivalent *only within a narrow domain* (electrodynamics of moving bodies at that specific historical moment). They are not equivalent in the broader context. SR generalized naturally into General Relativity (gravity); Lorentz's ether theory did not. SR rendered the ether ontologically superfluous (Occam's Razor); Lorentz's theory required a physical mechanism for contraction that was never found.
      *   *Adjudication:* Observation *did* eventually adjudicate, not by refuting SR, but by opening domains (like particle physics at high energies or gravitational lensing) where the ether framework became cumbersome or incoherent.
      *   *Naivety:* The hope that experiment chooses between theories is not naive; it is the engine of progress. It just doesn't happen in a single, instantaneous logical step. It happens through a research program over time.

  ### Does the Sweeping Conclusion Follow?

  **Conclusion:** *"Theory choice is arbitrary or merely social."*

  **Assessment:** **No, this does not follow.**

  Even if we grant the strongest version of underdetermination (that multiple theories can fit the current data), it does not follow that the choice between them is *arbitrary*.

  In philosophy of science, this is addressed through **Theoretical Virtues** (or epistemic values). When data alone is insufficient, scientists rely on criteria such as:
  1.  **Consilience:** Does the theory unify disparate phenomena? (SR unifies space, time, and electromagnetism).
  2.  **Fruitfulness:** Does the theory generate new lines of inquiry? (SR led to $E=mc^2$ and GR; Ether theory led to dead ends).
  3.  **Coherence:** Is the theory consistent with other well-established knowledge?
  4.  **Parsimony:** Does the theory posit unnecessary entities? (The undetectable ether).

  A choice based on these virtues is not "arbitrary" in the sense of a coin flip, nor is it purely "social." It is **rationally constrained**. Two rational agents might weigh these virtues differently, but they are not free to choose *any* theory (e.g., one that contradicts logic or established data). Therefore, the conclusion that science is merely convention is a vast overreach.

  ### Reconciling with Your Laboratory Instincts

  You mentioned that a lifetime of lab work convinced you that "better experiments settle disputes." A sophisticated philosopher of science would actually agree with you, but would refine *how* that happens.

  **1. The "Web of Belief" is not equally flexible.**
  Quine described our knowledge as a web. The passage you read implies you can cut any strand of the web to save a theory. In practice, some strands are near the center (logic, basic arithmetic, well-confirmed laws of thermodynamics) and some are at the periphery (specific hypotheses about a new particle). When a prediction fails, it is almost always more rational to adjust the periphery than the center. Your experimental work effectively hardens the auxiliary assumptions (calibrating instruments, controlling variables) until the only flexible strand left is the hypothesis itself. At that point, the experiment *does* decide.

  **2. Underdetermination is usually transient.**
  Philosophers like Larry Laudan have argued that while we can construct rival theories that fit the data *now*, we rarely find rivals that fit the data *and* survive the next decade of research. Underdetermination is usually a temporary state of ignorance, not a permanent structural feature of science. Your instinct that "better experiments settle disputes" is correct because "better experiments" usually expand the domain of data until only one theory remains viable.

  **3. "Arbitrary" vs. "Non-Algorithmic."**
  A defender of underdetermination would answer your charge about non-arbitrary reasons like this:
  > "We agree that scientists have good reasons for choosing Einstein over Lorentz. However, those reasons are not *algorithmic*. There is no rule book that says 'If Theory A is simpler than Theory B, choose A.' You must use judgment. Underdetermination highlights that judgment is required, not that judgment is impossible. The choice is not forced by logic alone, but it is guided by rationality."

  ### Summary for the Retired Physicist

  The passage you read is a **caricature** of the Duhem-Quine thesis.
  *   **What is true:** You cannot test a hypothesis without assuming other things are true (auxiliaries).
  *   **What is false:** This makes theory choice arbitrary or purely social.
  *   **The Reality:** Science is a process of tightening the screws on the auxiliary assumptions until the hypothesis stands or falls on its own.

  Your conviction that nature ultimately adjudicates through experiment survives contact with philosophy intact. The philosophical argument merely warns us to be humble about *when* that adjudication has truly occurred, and to remain open to the possibility that our current "settled" theories might rely on auxiliary assumptions we haven't yet thought to question. It is a call for vigilance, not a declaration of futility.
