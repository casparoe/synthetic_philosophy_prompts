answer: |-
  There is no single established term in psychology or philosophy that captures the specific triad you describe: **sincerity of intent**, **prediction of failure**, and **motivational discharge**.

  While there are adjacent concepts, each fails to carve the phenomenon at the joint you have identified. Here is the analysis of the nearest neighbors, followed by the proposed carving and name.

  ### 1. The Nearest Neighbors (and where they break)

  *   **Symbolic Self-Completion (Wicklund & Gollwitzer):** This theory suggests that when people feel incomplete in a self-definition (e.g., "I am a runner"), they seek symbols to complete it. A firm decision can act as a symbol.
      *   *Where it breaks:* Symbolic completion is usually unconscious identity repair. Your case involves a conscious, empirical prediction of failure ("I know... I will not run"). You are not tricking yourself into thinking you *are* a runner; you are using the decision to settle the *account* of the runner-you ought to be.
  *   **Vicarious Goal Progress (Fishbach, Dhar, Zhang):** Research shows that merely thinking about a goal can create a sense of progress, reducing the urge to act.
      *   *Where it breaks:* This usually applies to *contemplating* the goal. Your case is specific to the **act of deciding**. The relief comes from the *closure of the decision event*, not the contemplation of the outcome.
  *   **Moral Licensing:** Doing something virtuous allows later transgression.
      *   *Where it breaks:* Licensing requires a prior *completed act*. Here, the "virtuous act" is the *intention itself*. You are licensing your future inaction via present resolution.
  *   **Precommitment (Ulysses Contract):** Binding the future self to ensure action.
      *   *Where it breaks:* As you noted, this is the inverse. Precommitment restricts future options to *force* action. Your phenomenon uses the decision to *release* the present self from the tension of the obligation.
  *   **Ordinary Akrasia:** Weakness of will; failing to do what one judges best.
      *   *Where it breaks:* In standard akrasia, the failure is a bug. In your phenomenon, the failure is a **feature** of the decision's economic function. The decision is *designed* (by your cognitive architecture, not conscious design) to pay out now, regardless of the later cost.

  ### 2. The Carving: **Intentional Discharge**

  I propose the term **Intentional Discharge**.

  This term anchors your own insight ("discharged my present one") and distinguishes the mechanism from *formation* (planning) or *deception* (lying). It treats the decision not as a causal link to action, but as a transactional event that settles a psychological debt.

  **Definition:**
  **Intentional Discharge** is a cognitive phenomenon wherein the act of forming a sincere intention generates immediate psychological utility (relief, identity affirmation, closure) that substitutes for the utility expected from the execution of the intended action, thereby reducing the probability of execution, even when the agent predicts non-execution at the time of intending.

  **The Four Necessary Conditions:**
  1.  **Sincerity of Valuation:** At $t_0$ (decision time), the agent sincerely affirms the value of the action. It is not a lie. The agent *wants* the world where the action happens.
  2.  **Empirical Pessimism:** At $t_0$, the agent holds a high-confidence prediction that the action will not occur at $t_1$. This distinguishes it from optimism bias.
  3.  **Closure Payoff:** The act of deciding produces a discrete spike of positive affect (relief, "being a person with a plan") that mimics the affect of *having done* the task.
  4.  **Motivational Substitution:** The Closure Payoff reduces the motivational pressure to execute the action at $t_1$. The decision *consumes* the motivation required for the act.

  ### 3. Boundaries and Edges

  To fix the boundary of **Intentional Discharge**, we must distinguish it from the states that shade into it.

  **A. vs. Implementation Intentions (Clean Planning)**
  *   *The Case:* "I will run at 6:00 AM. I will put my shoes by the bed at 9:00 PM."
  *   *The Distinction:* Implementation intentions (Gollwitzer) delegate the control to environmental cues. They do not offer *closure*; they create *logistics*.
  *   *The Boundary:* If the decision makes you feel the matter is **settled** (Discharge), it is Intentional Discharge. If the decision makes you feel the matter is **prepared** (Planning), it is Implementation Intention.
  *   *Test:* Does the decision reduce anxiety? If yes, it leans toward Discharge. Does it increase logistical specificity? If yes, it leans toward Planning.

  **B. vs. Optimism Bias (Clean Self-Deception)**
  *   *The Case:* "I will run at 6:00 AM." (Agent genuinely believes 90% chance of success despite 50% historical rate).
  *   *The Distinction:* In Optimism Bias, the agent is mistaken about the probability. In Intentional Discharge, the agent is **accurate** about the probability but proceeds anyway because the *decision itself* has value.
  *   *The Boundary:* Can you admit, at the moment of deciding, "I probably won't do this"? If yes, it is Intentional Discharge. If no, it is Self-Deception.

  **C. vs. Standard Akrasia (Clean Weakness)**
  *   *The Case:* "I will run at 6:00 AM." At 6:00 AM, you feel a struggle and lose.
  *   *The Distinction:* In Standard Akrasia, the decision at $t_0$ remains a binding obligation that creates guilt at $t_1$. In Intentional Discharge, the obligation is **extinguished** at $t_0$.
  *   *The Boundary:* When you fail at $t_1$, do you feel **guilt** (Akrasia) or **resignation** (Discharge)? Guilt implies the debt was still owed. Resignation implies the debt was already paid at $t_0$.

  ### 4. Clean Cases to Fix the Boundary

  **Case 1: Pure Intentional Discharge (The Phenomenon)**
  > *Scenario:* You decide at 11 PM to run at 6 AM. You feel a wave of relief ("Good, that's sorted"). You know you won't wake up. At 6 AM, you sleep. You feel no guilt, only a vague sense that "tomorrow is a new day."
  > *Key:* The decision *was* the work. The relief was the wage.

  **Case 2: Discharge without Insincerity (The Edge)**
  > *Scenario:* You decide to donate $1,000 to charity next month. You feel the virtuous glow immediately. You know you might not have the cash next month.
  > *Key:* This is Intentional Discharge even if you *hope* to do it. The distinguishing factor is not the hope, but whether the *glow* reduces the effort to secure the cash. If the glow makes you less likely to budget for it, it is Discharge.

  **Case 3: Payoff without Discharge (The Contrast)**
  > *Scenario:* You decide to run at 6 AM. You feel excited (payoff). But the excitement makes you set three alarms and sleep in your running clothes.
  > *Key:* Here, the positive affect of the decision *increased* commitment. This is **Motivational Amplification**, the opposite of Discharge. The boundary is the *direction of pressure* on the future self.

  ### 5. Why the "Inversion" Matters

  You noted: *"The larger the future benefit, the better the resolution feels and the less pressure remains to secure it."*

  This is the diagnostic signature of **Intentional Discharge**.
  In rational planning, a larger benefit should increase the cost of failure, thereby increasing present effort to secure it.
  In Intentional Discharge, a larger benefit increases the **value of the signal** sent by the decision. Deciding to "Run a Marathon" signals more virtue than deciding to "Run a Mile." Therefore, the decision to Marathon buys more immediate relief than the decision to Mile. The signal value scales with the task magnitude, while the execution cost also scales. The cognitive system takes the shortcut: collect the signal value now, default on the execution cost later.

  ### Summary

  *   **Established Name:** None. (Nearest: *Symbolic Self-Completion* or *Vicarious Goal Progress*, but both miss the *sincere prediction of failure* and the *discharge mechanism*).
  *   **Proposed Name:** **Intentional Discharge**.
  *   **Core Mechanism:** The decision acts as a **substitute good** for the action, paying out immediate identity-relief while externalizing the cost to a future self that is already written off.
  *   **Distinguishing Feature:** The **decoupling of sincerity from prediction**. You can sincerely intend (value the end) while accurately predicting non-execution, because the function of the intention is to settle the present account, not bind the future agent.
