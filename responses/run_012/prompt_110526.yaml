      *   *Note on Geiger Counter:* This is quantum/random, not deterministic chaos. I must use it carefully as a contrast case, not an example of deterministic chaos.
      *   *Note on PRNG:* Good for distinguishing algorithmic randomness from physical randomness.

  6.  **Final Review against Constraints:**
