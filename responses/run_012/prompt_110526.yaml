      *   *Crux:* The Borel-Cantelli argument on real numbers in physics.
      *   *Crux:* The Embedded Predictor (Popper/Wolfram).

  8.  **Final Polish:** Check for flow and ensure the "Retired Fluid Dynamicist" vibe is honoured (rigorous but weary of semantic games). (Self-correction: Don't write *as* the dynamicist, write the statement *for* them to read/use).

