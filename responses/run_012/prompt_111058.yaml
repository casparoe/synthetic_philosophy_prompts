  ***

  **Letters to the Editor**

  Dear Editor,

  I have read the Year in Review with the usual mixture of admiration and exasperation. Our colleague has successfully described the ocean while denying the existence of water. He explains everything and therefore nothing. Where are the people? The specific choices? The dirt under the fingernails? He talks of structures but ignores the carpenter building the house. To say agency is a category error is to abdicate the historian's duty. I am cancelling my subscription for the third year running. Perhaps next year you will allow us to discuss a single life without apologizing for it. If the *longue durée* requires the erasure of the living, I prefer the moment.

