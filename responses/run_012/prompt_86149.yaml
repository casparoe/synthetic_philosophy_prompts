answer: |-
  Here is your battle pack. I've drafted these in your voice—practical, direct, no jargon—but tailored to the specific egos in the room.

  ### 1. The Philosophers (The Conceptual Attack)
  **The Question:** "You're conflating *explanation* with *attribution*. If a CEO knowingly destroys the environment, the mental state is identical whether we call it intentional or not. Are you really arguing that 'intentional' doesn't describe a cognitive state, but is just a slur we apply to outcomes we dislike? If so, you've abolished intentionality, not explained it."

  **Your Answer:**
  "I'm not abolishing it; I'm relocating it. You're assuming 'intentional' is a microscope we use to look inside the CEO's brain. I'm saying it's a stamp we put on a file after the damage is done. In claims, I don't have access to the bloke's head. I have the broken window and the bill. If I wait for a true description of his cognitive state, I never pay out.

  My argument is that the word 'intentional' isn't a description of the past; it's a tool for the future. We use it to flag things that deviate from the norm. Harming the environment is a deviation we need to police, so we mark it 'intentional' to justify blame. Helping is a deviation we don't need to police, so we mark it 'side effect' to save on praise. It's not about morality per se; it's about cognitive economy. We only bother assigning intent when the outcome surprises our model of how the world should work. If I'm right, you haven't lost the cognitive state, you've just realized the word doesn't map to it cleanly."

  **Where it's thin:** You're dodging the case where someone *tries* to do good and succeeds. That's surprising (rare) and good, but we definitely call it intentional. Your theory struggles to explain why we assign intent to praiseworthy *goals* but not praiseworthy *side effects*.

  ### 2. The Psychologists (The Methodological Attack)
  **The Question:** "Your 'surprise' hypothesis is unfalsifiable as stated. How do you operationalize 'surprise' independently of the outcome? If they say it's intentional, you'll just say they were surprised. If they say it's not, they weren't. Without a independent measure of surprise, this is just post-hoc storytelling."

  **Your Answer:**
  "That's fair, and that's why I stuck my neck out with predictions. I'm not asking you to take my word on what's surprising. I'm saying we manipulate the vignette. Prediction one: Make the environmental benefit the result of a corner-cutting accident—make it statistically rare and unexpected. My theory says 'intentional' ascriptions go up. The standard moral view says they stay down because it's still a 'good' outcome.

  Prediction two: Make the harm negligible. He ruins a view of a lake nobody visits. It's still 'harm,' morally speaking, but it's not surprising because it doesn't impact the normative order. My theory says 'intentional' drops off. The moral view says it stays high because harm is still harm. You can measure reaction times, you can measure skin conductance, you can measure the verdict. If the verdict tracks the surprise manipulation rather than the moral valence, the moral model has a problem. I'm giving you the variables; you run the test."

  **Where it's thin:** Self-reported surprise is garbage data. If you rely on participants *saying* they were surprised, the psychologists will eat you alive. You need to argue surprise is a physiological response, not a survey answer.

  ### 3. The Solicitor (The Practical Attack)
  **The Question:** "In criminal law, *mens rea* is the difference between murder and manslaughter. If you tell a jury 'intentional' just means 'you were surprised by the outcome,' you're going to get people convicted for accidents they didn't foresee, or acquitted for calculated risks that happened to look normal. Can your theory actually work in court?"

  **Your Answer:**
  "Honestly? My theory describes what juries *do*, not what the judge *instructs* them to do. You know better than me that judges tell juries to look for purpose and knowledge. But you also know that when a body turns up and the defendant is a nasty piece of work, the jury finds intent. When the defendant is a sympathetic doctor trying to save a patient who dies, they find negligence.

  I'm not saying the law *should* run on surprise. I'm saying the word 'intentional' in the wild—which is what I deal in, and what jurors deal in—is a verdict on whether this person needs to be stopped. If a CEO harms the environment, we want to stop him, so we find intent. If he helps, we don't need to stop him, so we don't. In insurance, if I pay out on every 'accident' that looked suspicious, I'm out of a job. I'm not giving you a legal standard; I'm giving you a diagnostic for why the legal standard leaks."

  **Where it's thin:** This is dangerous ground. If you admit your theory undermines legal culpability, the solicitor might turn on you. You need to keep the distinction between *descriptive* (how people talk) and *prescriptive* (how law should work) very sharp.

  ### 4. The Undergrads (The Textbook Attack)
  **The Question:** "But isn't this just the Fundamental Attribution Error? Or maybe just outcome bias? Why do we need a new theory of intentionality when we already have heuristics that explain why people judge based on results?"

  **Your Answer:**
  "Because those heuristics treat the error as a bug. I'm treating it as a feature. You're learning that people get it 'wrong' about intention because they're biased by morals. I'm saying there is no 'right' about intention to get wrong. There's only the event and the label we stick on it to manage social expectations.

  Attribution error says 'You messed up the psychology.' I'm saying 'The psychology is doing exactly what it evolved to do.' It's not a bug that we call the CEO intentional when he harms; it's the point of the word. We don't have a word for 'mental state independent of social consequence.' We only have 'intentional,' which is a social tool. So when you learn about FAE in first year, you're learning how people deviate from a philosophical ideal. I'm telling you the philosophical ideal doesn't exist in the wild."

  **Where it's thin:** You risk sounding like a relativist. If there's no "right" intentionality, then your own job is just making stuff up. You need to hold the line that the *payout decision* is real, even if the *mental state* is fuzzy.

  ***

  ### The Dreaded Question
  **The Question:** (From the senior Philosopher, leaning back, hands steepled)
  "You work in insurance. Your job is to minimize payout. If you're right, and 'intentional' is just a verdict we reach to justify denying a claim, then you're admitting your entire profession is institutionalized gaslighting. You decide not to pay, then you retroactively assign 'intent' to justify it. If that's true, why should we trust *any* judgment of intent, including the one you're asking us to accept today?"

  **Your Answer:**
  (Pause. Take a sip of water. Don't smile.)
  "Because I'm not asking you to trust my judgment. I'm asking you to trust the pattern. Whether I'm gaslighting or not doesn't change the data. If I deny a claim, I have to write a reason. Over ten years, those reasons form a dataset. That dataset shows that 'intent' appears when the cost is high and the story is odd, not when the mind is clear.

  You're asking if my job is corrupt. Maybe. But the corruption proves the theory. If 'intentional' were a real description of a head, my bosses couldn't train me to use it as a lever to save money. You can't train someone to lie about a fact, but you can train them to apply a verdict. The fact that I *can* do my job the way I do proves that the word is flexible. I'm not asking you to trust me. I'm asking you to look at the paperwork."

  **Where it's thin:** This admits your own bias explicitly. It undermines your authority as a speaker. It's the truth, but it hands them a weapon to dismiss you as "just a claims adjuster with a cynicism problem." Be prepared to pivot back to the Knobe data immediately after this answer to re-solidify the academic ground.
