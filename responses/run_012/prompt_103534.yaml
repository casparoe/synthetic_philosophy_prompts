answer: |-
  The room was kept at a temperature that Elara found slightly too cold, but she knew no one else felt it. To the five people sitting around the curved white table, the air was neutral. To Elara, it was a small, persistent bite on her exposed forearms. She kept her hands folded to hide the goosebumps.

  "Ms. Vance," said the Chair, a man named Kael whose skin was unlined, his eyes resting in a permanent, chemical serenity. "We are asking you to quantify the distress of the incident."

  On the screen behind him, a video played on a loop. A construction drone had malfunctioned, dropping a beam. It had struck a worker, Julian, crushing his leg. In the video, Julian stood up, brushed off the dust, and waved the med-bot away. He was smiling. He was Adjusted. The nociceptors in his leg had fired, the damage was done, but the signal had hit the dampened amygdala and dissolved into a mild, interesting pressure.

  "It broke his tibia and fibula," Elara said. Her voice sounded rough to her own ears, raspy with the tension she held in her throat. "It would have felt like a white-hot nail being driven through the bone. Followed by a throbbing that lasts for weeks. The fear of not being able to walk. The shock."

  Kael nodded, making a note. He looked at her with a gentle, anthropological curiosity. "But Julian reports no trauma. He is eager to return to work. Is the suffering real if it is not felt?"

  "The damage is real," Elara said. "The violation is real. His body was invaded. He just... doesn't care."

  "Care is a feeling," Kael said softly. "And feelings are optional now."

  Elara looked down at her hands. She was fifty-two. She was one of the last of the Unmodified who had refused the patch when the mandate softened from *required* to *strongly suggested* forty years ago. She had aged into the exemption. Now, she was a resource. The Courts had ruled three decades prior that legal standing required the capacity for anguish. You could not sue for pain if you could not feel it. You could not claim cruelty if you could not recognize the wound.

  So Elara sat on the Ethics and Redress Board. She was the canary. She was the witness for a world that no longer bled.

  "The ruling will be that the company owes restitution for hardware damage," Kael said. "But without your testimony regarding the *potential* agony, there is no punitive damages. There is no crime of suffering. Thank you, Elara. Your metrics are consistent."

  *Metrics.* They measured her cortisol levels, her pupil dilation, the micro-tremors in her voice. They calibrated their justice against her biology.

  She stood up, her knees popping—a small, sharp ache that she welcomed. It was proof of friction. Proof of gravity.

  In the hallway, a young woman waited for her. Maren. Her daughter.

  Maren was twenty-eight, beautiful in the way of her generation: symmetrical, relaxed, glowing with a low-level hum of endorphins that never faded. She hugged Elara. The embrace was warm, but loose. Maren did not cling. There was no desperate need in her touch, no fear of loss tightening her grip.

  "Hi, Mom," Maren said. "How was the witness stand?"

  "Exhausting," Elara said.

  "You look tense. Do you want a patch? I have a spare. Just a low dose. Take the edge off."

  Elara pulled back, smiling sadly. "No, thank you."

  "I don't understand why you keep the receptors active," Maren said, falling into step beside her as they walked toward the transit tube. "It's archaic. Like keeping a wisdom tooth that's just infected."

  "It's not just pain, Maren."

  "It's noise," Maren corrected gently. "You carry so much noise. I can see it in your face. The lines. The worry."

  They stepped into the transit pod. It slid silently into the tube. The city outside was green and quiet. There were no sirens. There were no screams. The crime rate was statistically zero, mostly because assault required an intent to harm that the Adjusted brain struggled to cultivate. Why hurt someone when you cannot feel the heat of anger, and they cannot feel the sting of the blow?

  "Julian had his leg crushed today," Elara said.

  "I saw the report," Maren said, looking out at the passing lights. "He's fine. He's happy."

  "His leg was broken."

  "But he isn't sad about it. So, is it a tragedy?" Maren turned to her mother. Her eyes were clear, devoid of shadow. "You say we were stolen from. That we didn't consent to the Mod. But Mom, if I can't feel the theft, did it happen?"

  This was the knot Elara could not untie. The abolitionists' research had been honest, at least. They admitted that the circuitry for agony was tangled with the circuitry for grief, for moral outrage, for the sharp, tearing edge of love. To remove the capacity for hell, they had lowered the ceiling on heaven. They had flattened the landscape.

  Maren loved Elara. Elara knew this. But it was a sunny, consistent love. It did not have the desperate, clawing depth of a love that knows it can be destroyed. Maren would not mourn Elara when she died, not really. She would feel a sense of absence, a logical gap, but she would not be *wrecked*.

  "You can't feel the grievance," Elara said, the old argument rising like bile. "They changed you before you could say yes. They took the weapon away, but they took the hand that holds it, too."

  "But I'm not angry," Maren said. "And neither is anyone else. Look at the world, Mom. It's peaceful."

  "It's a museum," Elara whispered.

  " It's a home."

  The pod slowed. They stepped out into the evening air. A group of teenagers passed them, laughing. The sound was bright, melodic, and utterly weightless. None of them were nursing grudges. None of them were nursing wounds.

  Elara stopped. A sudden cramp seized her side, a spasm of muscle. She gasped, gripping the railing.

  Maren was there instantly, supporting her weight. "Mom? Do you need a medic?"

  "No," Elara gritted out. She waited for the wave to pass. It was ugly. It was sharp. It made her eyes water. "It's just... a cramp."

  "Let me fix it," Maren said, reaching for her bag.

  "No." Elara straightened up. The pain receded, leaving a dull throb. "I need to feel it. If I don't feel it, how do I know I'm still here? How do I know *you* are?"

  Maren looked at her, and for a second, the serenity flickered. Not with pain, but with a kind of puzzled sorrow. She couldn't comprehend the necessity of the wound. To Maren, pain was a system error. To Elara, it was the system.

  "You think you're sacred," Maren said quietly. "The last one who can be truly wounded. You think that makes you holy."

  "I think it makes me a witness," Elara said. "Someone has to remember what it costs to be human."

  "But who are you witnessing for?" Maren asked. "We aren't suffering. The world isn't suffering. If you're the only one in pain, Mom... maybe you're not the witness. Maybe you're just the place where the cruelty landed."

  Elara didn't answer. She couldn't. Because the terrible doubt was always there, in the quiet moments before sleep. Was she a guardian of the truth, or was she just a relic of a violent evolution that had finally, mercifully, ended?

  They reached their apartment. Maren opened the door, the light spilling out warm and yellow. She turned back to Elara.

  "I love you," Maren said. And she meant it. In her way, she meant it completely.

  "I love you too," Elara said.

  She meant it with a fear that Maren could never understand. She meant it with the knowledge that this bond would one day break her heart, and that Maren would watch the breaking with a calm, kind eye, unable to help, unable to weep.

  Elara walked inside. She took off her shoes. She felt the cool floor on her soles. She felt the ache in her side. She felt the heavy, crushing weight of a world that had chosen happiness over truth.

  She sat on the sofa and closed her eyes. She let herself remember the face of the man with the crushed leg, smiling through the ruin of his bone. She let herself feel the outrage, hot and poisonous and vital. She held it in her chest, a coal she refused to drop.

  Outside, the city hummed, perfect and painless. Inside, Elara suffered. She was not sure if she was saving them, or if she was just the last place where the cost was still being paid.

  " Dinner?" Maren called from the kitchen. Her voice was light. Unburdened.

  "In a minute," Elara said.

  She stayed in the dim room for a moment longer, nursing the ache, keeping the fire alive in a world that had forgotten how to burn. Then she stood up, smoothed her shirt, and walked toward the light.
