answer: |-
  You have put your finger on a profound shift in the ontology of medicine—meaning, the very nature of what we consider a "thing" that exists. You are right to feel that "medicalisation" is too blunt an instrument here. Medicalisation describes the *expansion of territory* (medicine claiming authority over more of life), but it doesn't fully capture the *logical mechanism* you've identified: that the existence of the disease is contingent upon the existence of the intervention.

  There isn't one single canonical term that captures the retrospective, the interventional, and the screening aspects all at once, but there are three existing concepts that form the corners of this triangle, and a fourth term we can coin to bind them.

  ### 1. The Existing Framework

  **A. Therapeutic Determinism (The Pill Flip)**
  In the philosophy of medicine, this is the closest established concept. It describes the logic where a condition is defined as a disease *because* there is a treatment for it, rather than there being a treatment because it is a disease.
  Historically, medicine was **ontological**: there was a broken thing (a tumor, a bacteria), and we tried to fix it. Now, medicine is increasingly **operational**: if we have a dial we can turn (blood pressure, cholesterol), the position of that dial defines the pathology. If the dial didn't exist, the "disease" wouldn't exist. This is why your brother and your mother have the same numbers but different statuses; the *capacity to intervene* on a 34-year-old creates the disease status, whereas the lack of capacity (or perceived futility) in a 70-year-old renders it "normal."

  **B. Surveillance Medicine (The Screening Flip)**
  Sociologist David Armstrong coined this term to describe the shift from hospital-based medicine (treating the sick) to population-based medicine (monitoring the "not-yet-sick"). In surveillance medicine, everyone is a patient in waiting. The goal isn't to relieve suffering (your mum feels fine), but to manage risk. This turns **probabilities into pathologies**. A risk factor is not a disease; it is a mathematical probability. But once a screening program exists, that probability is reified into a diagnosis requiring management. This explains the "public programme with no product in sight" aspect: the *act of monitoring* creates the sickness status, regardless of whether a pill is immediately prescribed.

  **C. Diagnostic Presentism (The Age Flip)**
  This is the historical term for what you're seeing with your great-grandmother. It is the error of judging past conditions by present standards. By labeling her death "old age," her doctor acknowledged a natural limit. By looking back and saying she "had undiagnosed hypertension," we are engaging in diagnostic presentism. We assume that because *we* can measure it now, it *was* a disease then. This rewrites history to suggest that the past was sicker than it knew, rather than acknowledging that our definition of sickness has expanded.

  ### 2. The Coinage: "Therapeutic Reification"

  Since you asked for a specific name for the mechanism where disease status is conferred by the ability to intervene and then projected backward, I propose the term **Therapeutic Reification**.

  *   **Reification** means making something abstract into a concrete thing.
  *   **Therapeutic** grounds it in the ability to treat.

  **Therapeutic Reification** occurs when a physiological variance (high pressure, low bone density) is turned into a concrete "disease entity" solely because we have developed a technology to measure and modify it. Once reified, the condition is treated as if it had always been a distinct enemy, rather than a continuous variable of human physiology.

  This explains why your great-grandmother didn't have hypertension. Biologically, her arteries were likely stiff. But *hypertension* (the disease) did not exist for her because the *concept* and the *intervention* did not exist. Therapeutic Reification says: "We can fix it, therefore it is broken."

  ### 3. Is the "Age Flip" the same as the "Pill Flip"?

  **Yes.** They are the same phenomenon viewed across different timeframes.

  *   **The Pill Flip (Synchronic):** At this moment, we treat the 34-year-old but not the 70-year-old. Why? Because the *utility* of the intervention is higher in the young. The disease status is granted based on the *usefulness of the treatment*, not the biology of the patient.
  *   **The Age Flip (Diachronic):** We treat the 61-year-old now, but we didn't treat the 70-year-old in 1970. Why? Because the *threshold for intervention* has lowered over time.

  Both are driven by the **Technological Imperative**: the belief that if a physiological parameter *can* be normalized, it *should* be. The refusal to accept "old age" as a cause of death is the ultimate expression of this. If we can delay death by six months with a statin, then death from "old age" becomes a failure of management, not a natural conclusion.

  ### 4. Where does it stop?

  This is the critical question. If disease status is defined by capability, and capability is always expanding, does everything become a disease?

  There are two boundaries, one theoretical and one practical.

  **The Theoretical Line: Phenomenological Suffering**
  Traditional medicine stopped at **symptoms**. You were sick if you felt sick or function was impaired. Modern medicine stops at **statistics**. You are sick if you are in the top 10% of a risk distribution.
  The line *should* be drawn at **clinical significance**: Does this deviation cause suffering or dysfunction *now*?
  *   *Where it stops:* It stops when the patient's lived experience is prioritized over the biomarker. If your mum feels well and functions well, the "disease" is arguably a fiction of the screening program.

  **The Practical Line: Iatrogenesis**
  This is where it *actually* stops. Ivan Illich defined **iatrogenesis** as harm caused by the healer.
  Therapeutic Reification stops when the harm of the intervention exceeds the benefit of the label.
  *   *Example:* We don't screen 90-year-olds for osteoporosis aggressively. Why? Because the drugs have side effects, and the fracture risk reduction takes 5 years to materialize. The "disease" disappears not because the bones heal, but because the treatment becomes net-negative.
  *   *The Limit:* The boundary is **Net Benefit**. Currently, that boundary is being pushed further and further back (as with your mum at 61). It will stop only when the side effects of treating "normal aging" become more visible than the statistical benefits.

  ### Summary

  You are observing **Therapeutic Reification** driven by **Surveillance Medicine**.

  1.  **The Mechanism:** We turn risks into diseases because we can measure them (Reification).
  2.  **The Justification:** We define them as diseases because we can treat them (Therapeutic Determinism).
  3.  **The Consequence:** We rewrite the past to say our ancestors were sick, not old (Diagnostic Presentism).

  It stops where the **harm of treatment** outweighs the **statistical risk**, but currently, the definition of "harm" is shrinking while the definition of "risk" is expanding. Your great-grandmother died of old age because medicine accepted limits. Your mother has hypertension because medicine no longer accepts limits; it accepts only management. The cost of that shift is that we are all now permanently, subtly ill.
