prompt: |-
  Right, so I cover science for a paper — long features, mostly replication-crisis stuff — and I've landed in one of those arguments where everyone else is very sure of themselves and I'm not. I've spent the best part of three months on a piece about a big nutrition trial, and the whole thing hinges on whether the trial was properly blinded, which I've never been able to confirm from the published material. Yesterday a postdoc who used to work in the lab offered to send me the internal emails and the randomisation file. She's definately not after anything, it's all above board, she'll just hand it over. Trouble is I've a horrible feeling it'll show the blinding was a shambles, which sinks the piece, and I'd then have to tell my editor, who's already booked the photoshoot for next month's issue.

  My editor thinks I'm being an idiot: 'you can't lose by looking, mate. If it's fine, brilliant. If it isn't, you'd rather know. Either way the information's free, and free information can only ever help you.' My partner says the exact opposite: 'don't open it. You'll spend a fortnight feeling sick, and you'll end up spiking a perfectly good piece out of paranoia.' I can't shake the feeling that my editor is onto something real but is also glossing over something, and that my partner's position sounds like superstition but might not be. What am I actually weighing up here, and how would you sort it out?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Situation:**
      *   **User:** Science journalist (long features, focuses on replication crisis).
      *   **Task:** Writing a major piece about a big nutrition trial.
      *   **Core Issue:** The piece hinges on whether the trial was properly blinded. Published material is ambiguous.
      *   **New Development:** A former postdoc offers internal emails and the randomization file (evidence of blinding status).
      *   **Stakes:** High. Editor has booked a photoshoot for next month's issue. The piece might get spiked if the evidence shows blinding was a "shambles."
      *   **Conflicting Advice:**
          *   *Editor:* "Look. Information is free. Better to know." (Utilitarian/Truth-seeking).
          *   *Partner:* "Don't look. You'll feel sick, you'll spike a good piece out of paranoia." (Psychological/Pragmatic/Status Quo).
      *   **User's Intuition:** Editor is right but glossing over something; Partner sounds superstitious but might have a point.
      *   **Goal:** Determine what is actually being weighed up and how to sort it out.

  2.  **Deconstruct the Conflict:**
      *   **The Editor's Argument (Epistemic Integrity):** Journalism's core duty is truth. If the trial is flawed, the public deserves to know. Publishing a piece based on a false premise (that the trial was valid) damages credibility long-term. "Free information" is indeed valuable for accuracy.
      *   **The Partner's Argument (Psychological & Career Risk):** Sunk cost fallacy (3 months work), emotional toll ("feeling sick"), potential for over-interpreting ambiguous data ("paranoia"), and immediate career friction (spiking a booked piece, annoying the editor).
      *   **The User's Specific Beat:** *Replication crisis.* This is crucial. A journalist covering the replication crisis *must* embody the principles of scrutiny. Ignoring potential evidence of methodological failure contradicts the beat itself.

  3.  **Identify the Hidden Variables (What the Editor is Glossing Over):**
      *   **Source Ethics:** Is the postdoc allowed to share this? "Above board" says the user, but is it a breach of confidentiality/NDA? If the journalist publishes based on leaked internal data, does it become a story about the leak rather than the science?
      *   **Interpretation Risk:** Raw data/emails are messy. A journalist isn't a peer reviewer. Misinterpreting a randomization file could lead to a false negative (crying foul when it was fine).
      *   **The "Sunk Cost" Trap:** The photoshoot and the 3 months work are sunk costs. They shouldn't dictate the truth, but they create pressure to ignore the truth.
      *   **The "Paranoia" Risk:** The partner warns of spiking a "perfectly good piece." But if the blinding *was* a shambles, the piece *isn't* perfectly good. It's potentially misinformation.

  4.  **Evaluate the Ethical Dimensions:**
      *   **Journalistic Ethics:** Accuracy trumps convenience. If the premise is wrong, the story is wrong.
      *   **Scientific Ethics:** If the trial is flawed, publishing it as valid contributes to the replication crisis the user writes about.
      *   **Source Protection:** The postdoc is offering this voluntarily. Needs protection.
      *   **Verification:** Can the user verify the documents without compromising the source or misinterpreting the data?

  5.  **Formulate the Advice:**
      *   **Validate the User's Intuition:** The editor is right on *principle*, but wrong on *risk*. The partner is right on *emotion*, but wrong on *ethics*.
      *   **The Core Weighing:** It's not "Truth vs. Comfort." It's "Public Interest/Accuracy vs. Career Friction/Interpretation Risk."
      *   **The "Replication Crisis" Angle:** This is the clincher. You can't write about the replication crisis while potentially perpetuating it by ignoring red flags.
      *   **Actionable Steps:**
          1.  **Accept the data.** (Editor is right here). Ignorance is not a defense.
          2.  **Verify the data.** (Mitigate Partner's fear). Don't rely on gut feeling; get an independent expert to review the files *before* deciding to spike.
          3.  **Manage the Editor.** (Address the photoshoot). Explain the journalistic integrity angle. A spiked story is better than a retracted one.
          4.  **Protect the Source.** Ensure the postdoc isn't burned.
          5.  **Pivot Potential.** If the blinding *is* broken, that *is* the story. It changes from "Nutrition Trial Results" to "Major Nutrition Trial Compromised."

  6.  **Refine the Tone:**
      *   Empathetic but firm.
      *   Professional (talking peer-to-peer).
      *   Nuanced (acknowledging the stress).
      *   Avoid moralizing, focus on professional risk management.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Opening:* Acknowledge the difficulty. It's a classic "Pandora's Box" scenario.
      *   *The Editor's Blind Spot:* It's not just "free info." It's about *liability* and *interpretation*. Also, the sunk cost of the photoshoot is a business pressure, not a journalistic one.
      *   *The Partner's Blind Spot:* "Paranoia" implies the data might be ignored. But if the data shows failure, ignoring it makes the journalist complicit.
      *   *The Beat:* You cover the replication crisis. This is your moment of truth (literally).
      *   *The Solution:* Look, but verify with a third party. Don't decide alone.
      *   *The Narrative Pivot:* If it's broken, the story isn't dead; it's bigger.

  8.  **Final Polish:** Check against the prompt's specific details (photoshoot, 3 months work, postdoc source). Ensure the distinction between "spiking the piece" and "changing the angle" is clear. (Self-Correction: Make sure to emphasize that if the blinding is broken, the *original* angle is dead, but a *new* angle emerges).

  9.  **Final Output Structure:**
