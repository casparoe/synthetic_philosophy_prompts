          *   *Analysis:* This is about shared conventions. Promises rely on public conventions. A private signal (crossed fingers) is essentially a wink *to oneself* or a friend, not a public retraction. For it to nullify the promise to Nadia, Nadia would need to understand it as a nullifier. Laughing at a joke ("Haha, you're doing our thing") is not the same as understanding ("I know this means you aren't actually promising"). Dev is prioritizing the promisor's secret intent over the public meaning. Rosa is prioritizing the public norm.
