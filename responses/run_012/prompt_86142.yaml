  4.  **Evaluate Tension in Rosa's Positions (2 vs. 4):**
      *   *Dev's Claim:* Rosa is inconsistent. In (2) she says context implies a promise (even without words). In (4) she says context (private joke) *doesn't* imply a retraction.
