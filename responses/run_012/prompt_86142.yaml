          *   *Analysis:* This is a classic philosophical debate (Searle vs. others, or Truthfulness vs. Obligation).
          *   *Concept:* If I say "I promise" with no intent, have I promised? Most philosophical consensus (and ordinary language) says yes, I have made a promise, but I have *broken* it immediately (or lied in making it). The obligation exists *because* I invoked the norm. If lack of intent nullified the promise, no one could ever be accused of breaking a promise, only of lying. Rosa is conceptually stronger here. Dev confuses the *felicity* of the act with the *honesty* of the agent.
