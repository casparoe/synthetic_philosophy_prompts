          *   *Consistency:* Her principle is consistent: "Public communicative norms govern obligations, not private mental states or secret codes."
          *   In (2), she says public context creates obligation. In (4), she says private context doesn't remove it.
          *   *Verdict:* No tension. It's a consistent application of public vs. private meaning. Dev is seeing a contradiction where there is a distinction.

