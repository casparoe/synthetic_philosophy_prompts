      *   *Dev:* Misses that promising is a social technology designed to bind people *despite* their changing internal states. He treats promises as reports of internal intent.
      *   *Rosa:* Misses the nuance of *reliance*. While the promise exists, the moral weight often depends on whether the promisee relied on it. Also, she might be too rigid on the voice memo (if it was truly unopened, the social bond is weaker, even if the act occurred).
      *   *Overall:* Rosa is much closer to standard philosophical and linguistic understanding of promising. Dev is arguing for a "mental state" theory of promising which makes the concept useless (if I can cancel a promise by thinking 'just kidding' or crossing fingers).

