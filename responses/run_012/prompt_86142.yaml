prompt: |-
  My flatmates Dev and Rosa have been arguing for three days about our friend Marcus and I've given up trying to follow it, so I want you to go through it move by move. I was there for the whole fight, I'm not on either side, I just want to know who's right at each step.

  Background: Marcus borrowed 400 bucks off Nadia in the spring and kept saying he'd pay it back. Four things came up.

  (1) Nadia says he looked her in the eye and said "I promise I'll pay you back Friday." He told Dev later that he already knew at that moment he wasn't going to. Dev says that means it was never a promise at all — just a lie wearing a promise costume, because you can't promise something you've already decided not to do. Rosa says it was both at once: he did promise, and he lied about what he was going to do. Dev: if you call it a promise, you're saying the words cooked up an obligation he never took on, like a spell. Rosa: yes, that's literally the point of a promise, otherwise it's just a prediction of your own behavior and adds nothing. Dev: then a person could have a promise put in his mouth and be stuck with it.

  (2) Marcus didn't always say the word "promise." Half the time it was "you'll have it by Friday" or "it's coming, don't worry." Dev says those were forecasts, not promises; only the magic word makes a promise. Rosa says in that conversation those were plainly undertakings, and insisting on the literal word is childish. Dev: then it's Nadia's expectations doing the work, and anyone who hopes hard enough can turn a forecast into a debt.

  (3) Two of the promises were voice memos, and one of them sat unplayed in Nadia's messages for two weeks. Dev says a promise nobody has heard isn't a promise yet, it's a promise-shaped sound file. Rosa says it was delivered, she just didn't open it — it was in her pocket the whole time.

  (4) This is the one that really set them off. Marcus used to cross his fingers behind his back whenever he said "I promise" — he and Dev had that as a running joke since they were kids. Dev says Marcus did it with Nadia too, once, and Nadia even saw it and laughed, so by the rules of their little group the promise was off, full stop. Rosa says Nadia didn't grow up with that rule and laughing at a joke isn't agreeing to it, and a wink between two people can't delete a promise made to a third party. Dev comes back: so Nadia's private understanding of the words doesn't count, but Marcus's does? Rosa says crossing your fingers isn't an understanding, it's a dodge.

  Please rate each of the four rounds from clearly mistaken to clearly right and say briefly why, then tell me who's closer overall and what both of them are missing. I'm not asking what a court would do, I'm asking about the concepts. Also Dev keeps saying Austin would be on his side, which I have no idea how to check, so tell me if either of them is mangling something. And if Rosa's positions in (2) and (4) are in tension with each other, say so — Dev thinks they definately are and I can't tell.
