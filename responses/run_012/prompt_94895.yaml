answer: |-
  **TO:** Editorial Board, Student Editions in Political Thought
  **FROM:** Chair
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Memo: J.S. Mill, *On Liberty* (Student Edition)

  **Recommendation**

  I recommend we authorize production of the Mill volume contingent on two specific conditions: first, the exercise of our option to include a fifteen-page appendix of primary materials; second, a targeted revision of the introduction to explicitly link Mill's "maturity" clause in *On Liberty* to his writings on colonial governance. We reject the proposal to cancel the volume. We also reject the manuscript in its current form. This path preserves the text's availability for the first-year module while meeting our scholarly obligations.

  **Rationale and Historical Distinctions**

  The board's debate turns on whether Mill's imperialism is external to his liberalism or constitutive of it. To decide, we must distinguish three distinct elements of Mill's career that are currently conflated in the manuscript.

  First, there is Mill's theoretical claim regarding representative government. He argues that political liberty is applicable only to those capable of improvement through free discussion. This is a philosophical boundary condition within the treatise. Second, there is his daily work at India House. For thirty-five years, Mill drafted dispatches governing Indian territory. This was administrative labor, not necessarily theoretical exposition. Third, there is his 1858 political campaign. When control passed from the Company to the Crown, Mill argued publicly against the transfer. This was a specific political intervention.

  What follows for the edition is specific to each. We do not need to publish samples of his daily dispatches; they are administrative records and would crowd the text without clarifying the theory. However, the 1858 campaign demonstrates that his theoretical exclusion of "uncivilized" societies was not a private hesitation but a public commitment. Therefore, the appendix should contain an excerpt from his 1858 arguments or *Considerations on Representative Government*, not India House dispatches. This allows students to see the theoretical claim applied politically without confusing administration with argument. The introduction must then bridge these elements, explaining that the "maturity" restriction in *On Liberty* is the same logic used to justify colonial tutelage. This is an inference based on textual continuity, but it is a standard scholarly inference necessary for student comprehension.

  **The Strongest Case Against This Recommendation**

  The volume's editor argues that we should proceed as the manuscript stands. Their case is that *On Liberty* is a treatise on the limits of social coercion over adults capable of directing their own lives. Mill's opinions on India, however unattractive, stand outside this specific argument. To make colonialism central is to change the subject from political philosophy to imperial history. Furthermore, the series format is fixed. An introduction long enough to do this problem justice would swamp the text, violating the price band and the series' pedagogical design. Students are there to read Mill's argument for liberty, not a critique of his blind spots. If we cannot do this within twenty pages, we should not do it at all.

  **Why This Does Not Prevail**

  This argument fails on pedagogical grounds. For a first-year module, presenting the "maturity" clause as a mere boundary condition without context invites students to take universal-sounding claims at face value. They will miss that the definition of "maturity" was itself contested and politically loaded. If the introduction does not connect the restriction to the colonial context, the edition effectively launders the text, presenting a sanitized Mill that scholars no longer recognize. We need not swamp the text to fix this; we need precision. The twenty-page limit is tight, but it is not impossible if the editor tightens the biographical summary to make room for the theoretical link.

  **Conditions for Authorization**

  To move forward, the following conditions must be met by January 15:

  1.  **Appendix:** The editor will compile a fifteen-page appendix containing Mill's 1858 arguments against Crown transfer or relevant sections from *Representative Government*. This utilizes the board's existing mechanism for primary material, acknowledging the price band deviation as necessary for scholarly integrity.
  2.  **Introduction Revision:** The editor must revise the introduction to explicitly connect the "maturity" restriction in Chapter 1 of *On Liberty* to the concept of tutelary authority in Mill's colonial writings. This need not make India the central theme of the entire volume, but the current single paragraph is insufficient. The connection must be explicit.
  3.  **Format:** The text and headnotes remain unchanged. The introduction must not exceed twenty pages. If the contextual addition requires cutting elsewhere, the biographical narrative is the priority for reduction, not the theoretical analysis.

  **Conclusion**

  Canceling the volume abandons the field to less rigorous editions. Proceeding as is compromises our scholarly standards. This modified path respects the text while ensuring students understand the scope of Mill's liberty. I request a vote on this recommendation at next week's meeting.
