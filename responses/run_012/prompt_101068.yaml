answer: |-
  You have stumbled upon one of the oldest, thorniest problems in political philosophy. It has a name: **The Boundary Problem** (sometimes called *The Problem of the Unit* or *The Question of the Demos*).

  You are not imagining the circularity. You have correctly identified that the "All-Affected Principle" is logically impossible to implement as a decision rule *before* a decision is made. You are also correct that the two answers people give ("everyone affected" vs. "everyone bound by rules") are not the same thing dressed up differently. They are fundamentally distinct principles that pull in opposite directions.

  Here is the breakdown of the name, the logic, the circle, and the nagging question about the authorities above you.

  ### 1. The Name and The Two Principles

  The specific deadlock you are describing is the tension between two competing criteria for democratic inclusion:

  **A. The All-Affected Principle (AAP)**
  *   **The Claim:** Anyone whose interests are significantly impacted by a decision should have a vote.
  *   **The Strength:** It is morally intuitive. It prevents externalities (e.g., your co-op shouldn't be able to build a wall that blocks your neighbor's light without their input).
  *   **The Flaw:** As you noted, it is epistemically circular. To know who is affected, you must know the outcome. To know the outcome, you must vote. To vote, you must know who is eligible.
  *   **Verdict:** This is an ethical *ideal*, not a procedural *rule*. It cannot function as the mechanism for deciding the vote itself.

  **B. The All-Subjected Principle (ASP)**
  *   **The Claim:** Anyone who is subject to the coercive power or binding rules of the organization should have a vote.
  *   **The Strength:** It is legally clean. It relies on existing status (membership, residency, citizenship). It avoids the circularity because membership is defined *before* the specific vote arises.
  *   **The Flaw:** It is morally arbitrary. It creates a "fortress" mentality. It allows current members to vote to exploit non-members (e.g., selling the lot to a developer who will block the neighbor's light) because the non-members aren't "subject" to the co-op's rules, even if they are subject to the *consequences*.
  *   **Verdict:** This is a procedural *necessity*, but it lacks moral completeness.

  **Are they the same?**
  No. AAP is **consequentialist** (based on outcomes). ASP is **deontological/legalistic** (based on status and obligation). In your co-op, the fight is between people who feel the *moral weight* of the decision (AAP) and people who feel the *legal weight* of the decision (ASP).

  ### 2. Can You Break the Circle?

  You asked if either can avoid going round in a circle. The All-Affected Principle cannot. The All-Subjected Principle can, but only by **pre-commitment**.

  To stop the infinite regress, a group must decide on the *rules for voting* at a time when the specific issue is not on the table. This is usually done in the **Bylaws or Constitution**.

  When you are arguing about "who votes on selling the lot," you are trying to write the constitution *during* the legislation. That is why it fails.

  **The Solution for the Co-op:**
  You need to move the debate from the specific decision to the *criteria for the decision*. Your board needs to amend the bylaws to categorize decisions *before* they happen. For example:
  *   **Category A (Internal Operations):** Maintenance, fees, rules. *Voters: Current Members only (ASP).*
  *   **Category B (Constitutional/Existential):** Mergers, selling major assets, changing the co-op's footprint. *Voters: Current Members + Advisory Vote from Neighbors/Future Residents.*

  You cannot solve the "who is affected" question in the moment. You must define "affected" broadly in the bylaws *now*, for *future* unknown decisions. For example, the bylaws could state: "Any decision altering the physical boundary of the property requires a 75% member vote AND a formal consultation period with adjacent property owners."

  This doesn't give the neighbor a vote, but it gives them a veto-power-like hurdle. It acknowledges the AAP without surrendering the ASP.

  ### 3. The Nagging Question: The Higher Authorities

  You asked: *The city and province decide what a co-op can be... whoever's above us has the identical problem, all the way up until someone doesn't. Is that the same problem one level down, or a different one?*

  It is the **same logical problem**, but it is resolved by a **different mechanism**.

  **At the Co-op Level:**
  The boundary is voluntary and contractual. You join the co-op; you agree to the bylaws. The "circle" is broken by the **Contract**. If you don't like who gets to vote, you can (theoretically) leave or try to amend the bylaws.

  **At the State Level (City/Province):**
  The boundary is coercive and territorial. You cannot "leave" the city's jurisdiction easily. The "circle" here is broken by **Sovereignty** (often backed by force or history).

  **Does the State face the same regress?**
  Yes. Who decides who gets to be a citizen of the province? The province does. But who decides the province's boundaries? History, war, or a higher constitution.
  Political theorists (like Thomas Hobbes or Carl Schmitt) argue that at the very top, the circle is not broken by logic, but by **decision**. There is a "Sovereign" who simply *decides* the boundary, and that decision is final not because it is logically perfect, but because there is no higher authority to appeal to.

  **Is it different?**
  It is different in *kind*, not just level.
  *   **Co-op:** The boundary problem is a **governance puzzle**. It can be solved by better rules.
  *   **State:** The boundary problem is a **sovereignty fact**. It is solved by power and recognition.

  When the Province tells your Co-op who can vote, they are exercising sovereignty. They are saying, "We have already solved the boundary problem for you; you are a legal entity defined by X, and only people fitting definition Y can vote." They are imposing the All-Subjected Principle on you from the outside to prevent you from paralyzing yourself with the All-Affected Principle.

  ### 4. Summary for your Board

  You are stuck because you are trying to solve a **Constitutional Question** (Who is the 'We'?) using a **Legislative Process** (How do we vote on this lot?).

  1.  **Acknowledge the Trap:** Tell the board, "We are facing the Boundary Problem. We cannot decide who votes on this issue using the rules of this issue."
  2.  **Default to Status:** For the decision to happen *now*, you must default to the All-Subjected Principle (Current Members). It is the only one that isn't circular. Acknowledge this is imperfect.
  3.  **Mitigate the Harm:** To address the All-Affected concern, create a non-voting advisory committee for this specific decision that includes the neighbor and a representative for potential future residents. Give them a formal right to be heard, even if not to vote.
  4.  **Fix the Bylaws:** Commit to defining voting eligibility for *classes* of future decisions so you don't have to re-litigate the existence of the co-op every time a developer calls.

  The circle cannot be broken by logic alone. It is broken by agreement to stop arguing about the boundary and start working within it. That feels unsatisfying, but it is the only way a group of 60 units (or a nation of millions) actually functions.
