      *   *Correction:* That dismisses their moral concern. Acknowledge that "current members" is a practical fiction, but a necessary one for function.
      *   *On the Higher Authority:* Be careful not to say "The State decides, end of story." The user is asking if the *problem* exists there too. It does (e.g., who gets citizenship?). But the *solution* is different (coercion/constitution vs. voluntary association).

  6.  **Final Polish:**

