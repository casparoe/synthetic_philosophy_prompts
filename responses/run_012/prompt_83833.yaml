  **The question**

  The central question is causal rather than descriptive: can a norm suffer 'esteem death'—where upholding it costs social standing—without a prior shift in the material interests of the elites who enforce it? Standard accounts treat argument, interests, and honour as rival explanations for moral revolution. This project treats them as sequential phases. I aim to determine whether honour operates as an independent engine or merely transmits interest shifts. If esteem death consistently follows interest shifts, then honour is a mechanism of enforcement, not a cause. If esteem death precedes interest shifts, honour is autonomous. The project will be settled by establishing temporal precedence in historical cases. If victim testimony becomes admissible only after elite interests shift, then argument is epiphenomenal. If testimony drives the interest shift, reason is primary. I argue the former: interests rot the scaffolding, honour collapses, and argument arrives to sweep the dust.

  **Why the existing answers leave it open**

  Existing explanations leave this open because they conflate correlation with causation. Interest-based accounts explain why enforcement laxens but fail to explain why violators feel shame rather than mere caution. Honour-based accounts, like Appiah's, show how social contempt kills norms but often assume the honour code changes spontaneously, ignoring who benefits from the new code. Rationalist accounts claim arguments refute practices, yet identical arguments exist for centuries before abolition. My framework is not a relabelling because it disaggregates the 'death' of a norm into three distinct events: avowal death (no public defence), conduct death (cessation of practice), and esteem death (reversal of prestige). By separating these, we can see if argument (avowal) leads, or if it merely ratifies a shift in esteem driven by interests. Without this granularity, we cannot see that the 'reasons' were always available, but the social cost of hearing them was too high. The question is not which factor exists, but which breaks the lock first. Specifically, Appiah shows honour kills norms, but not what kills honour. If honour dies only when enforcement becomes costly, then interests are the root. If honour dies while enforcement remains profitable, honour is autonomous. Current literature treats these as competing truths rather than sequential dependencies.

  **What I would actually do**

  I will conduct a comparative historical analysis of four cases: British duelling, Atlantic slavery, Chinese footbinding, and Indian sati. Over three months, I will code historical records for the three deaths. Month one focuses on data collection: identifying the last defences (avowal), the drop in frequency (conduct), and markers of social stigma like satire or exclusion (esteem). Month two applies the testimony test. I will track when victim accounts enter public discourse relative to elite opinion shifts. If arguments against slavery only gain traction once slave testimony is admissible, and admissibility follows economic shifts, the causal chain is visible. Month three synthesises the order. Distinguishing the deaths where they cluster requires looking at private correspondence versus public manifestos. A gentleman might stop duelling (conduct) while still defending it (avowal), or defend it while being mocked (esteem loss). Where records are contested, I will prioritise evidence of social cost (e.g., marriage prospects, club memberships) over philosophical tracts. The testimony test is applied by dating the first sympathetic hearing of victim narratives against the first legislative or economic move against the practice. This isolates whether reason opened the door or walked through an open door. I will also look for 'laggers': individuals who maintain conduct after esteem death, to measure the cost of non-compliance. This operationalises the honour gradient.

  **What would count as a result and what would count as failure**

  A successful result establishes a consistent temporal order across cases: interest shifts enable esteem death, which permits avowal death. This would prove argument is downstream of social permission. A substantive failure would occur if the three deaths prove inseparable even in principle—for instance, if esteem death never occurs without simultaneous avowal death, suggesting honour and argument are constitutively linked. Another failure condition is if esteem death consistently precedes interest shifts, which would vindicate the honour-first model and refute my hypothesis. Practical failure involves insufficient data to date the esteem shift precisely; social stigma is often informal. However, even a negative result is philosophically valuable: it would show that moral revolutions are not unitary events but complex cascades. If I find that victim testimony drives interest shifts rather than following them, I must abandon the epiphenomenal view of argument. The project fails if it cannot distinguish the engine from the transmission. Furthermore, if the testimony test yields mixed results across cultures, it suggests there is no universal mechanism for norm death, only local histories. This would undermine the search for a general theory of moral revolution, forcing a retreat to particularism.

  **Scope and honest risks**

  The scope is tight for a summer. Comparing four distinct cultural practices risks superficiality. If time compresses, I will cut sati and footbinding to focus deeply on British duelling and Atlantic slavery, where my archival familiarity is strongest. These two offer the sharpest contrast between elite violence and economic exploitation. A significant risk is conflating elite interest shifts with broader economic changes; I must ensure I am tracking the enforcers, not just the market. Another risk is presentism: interpreting past honour through modern lenses. I will mitigate this by relying on contemporary satire and private diaries rather than later historical summaries. The project is too big if it attempts to explain *why* interests shift; I must take interest shifts as the exogenous variable and trace their normative consequences. Cutting the 'why' of interests keeps the project within bounds.
