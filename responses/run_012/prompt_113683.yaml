  6.  **Self-Correction/Check during drafting:**
      *   *Did I address the "meta-language" worry?* The student asks "what exactly is doing the work." I need to mention that the meta-language usually remains classical for the semantics to be intelligible, even if the object language is paraconsistent. Priest sometimes challenges this, but for a seminar paper, the standard semantic explanation is safer.
      *   *Did I address the "Change of Subject" charge?* Yes, this is crucial. The student thinks blocking DS changes the meaning of 'or' or 'not'. Dialetheists argue it preserves the meaning of 'not' better in the face of paradox.
      *   *Is the Penicillin example addressed?* Yes, need to distinguish semantic truth from pragmatic assertion.

  7.  **Final Polish:** Organize into clear sections: The Semantic Seam, The Consequence Relation, The Change of Subject Charge, and The Pragmatic Upshot. (This matches the structure of the thought process).

  **(Self-Correction Note):** I need to be careful not to defend dialetheism as *true*, but to explain why the student's *argument against it* misses the mark technically. The goal is to help the student refine their paper, not necessarily convert them. The student's argument is a version of the "Classical Negation Objection," which has been discussed extensively (e.g., by Priest, Beall, Field). I should mention that this is a known debate so they can contextualize their contribution.

