answer: |-
  It is understandable that you came away from that conversation feeling less sure of your footing, because your friend has presented a version of Coherent Extrapolated Volition that is rhetorically powerful but technically distorted in ways that matter for the conclusion she draws. She is not inventing the objections she raises, but she is framing them as decisive refutations of CEV while implicitly exempting the alternative she recommends from the same scrutiny. To audit this properly, we need to separate the genuine philosophical difficulties she identifies from the caricatures she uses to make those difficulties look fatal only to CEV.

  The most significant distortion in her summary concerns what is actually being extrapolated. She describes the process as taking everyone's preferences and correcting them for factual ignorance and logical error, effectively reducing CEV to preference utilitarianism with a fact-checking step. A defender of CEV would wince sharply at this. The proposal is not merely to fix beliefs while holding values constant; it is to extrapolate the volition itself. This means simulating what we would want if we knew more, thought faster, and were more the people we wished we were. That last clause is doing heavy lifting that her summary ignores. It allows for moral growth and value change, not just belief correction. If you only correct beliefs, you might remain a prejudiced person who simply has accurate data about the world. CEV aims to model the process of moral reflection that would dissolve that prejudice. By reducing this to belief correction, she makes the view seem mechanically simpler and therefore more vulnerable to the charge that it is just the programmers' values in disguise. If the process includes moral growth, the target is not just "what we think now plus facts," but "where our moral reasoning would converge," which is a different claim entirely.

  Your intuition about aggregation versus merging is correct and load-bearing. Her summary describes taking everyone's preferences, correcting them, and maximizing the result, which implies a summing of individual utility functions. CEV is explicitly designed to avoid this. The goal is to find a coherent volition for humanity as a whole, which involves resolving conflicts between individuals and within individuals to find a stable attractor, not just aggregating corrected wants. If you simply sum preferences, you run into impossibility theorems and conflict problems that CEV tries to bypass by looking for a higher-order coherence. Her description makes CEV sound like a standard social choice problem with extra steps, whereas proponents view it as a search for a singular, evolved moral trajectory. This distinction matters because her objection about indeterminacy relies on the idea that there are many equally valid ways to correct beliefs. If the goal is instead to find where moral reasoning converges when amplified, the space of possible answers might be narrower, or at least different in kind. She treats the lack of a unique mathematical fixed point as a refutation, but a defender would argue that moral convergence is not a mathematical certainty but a empirical hope about the structure of moral reasoning, and that lacking a proof of uniqueness is not a reason to abandon the attempt if the alternative is aligning to our current, flawed selves.

  This leads to her reading of coherence as logical consistency. You are right to suspect this is too narrow. In the context of CEV, coherence does not just mean avoiding logical contradictions in a set of statements; it means resolving conflicts in values so that the resulting system is stable and self-reinforcing. Her claim that there is no such thing as the preference you would have if you were smarter rests on the idea that intelligence is multi-dimensional and there is no single axis of smarter. A defender would agree that this is a hard technical problem but would deny that it renders the concept meaningless. They would argue that while there may be many ways to be smarter, there are likely fewer ways to be morally better, and the extrapolation process is meant to navigate that space. Her objection that this leaves the definition of smarter up to the programmers is the standard arbitrariness objection, and it is a serious one, but she presents it as if it has no answer, whereas the literature treats it as the central technical challenge to be solved, not a reason to stop.

  When she concludes that we should stop treating CEV as a serious target and rely on techniques that train systems on what people actually approve of, she is making a comparative claim that does not follow from her premises. You noted that her objection might land just as hard on her recommended alternative, and you are correct. If CEV is vulnerable because the idealized target is indeterminate or captures the programmers' values, training on actual approval is vulnerable because actual approval is manipulable, short-sighted, and inconsistent. Current alignment techniques like reinforcement learning from human feedback align AI to what humans say they want in the moment, which is known to be divergent from what they want upon reflection. If the problem with CEV is that we cannot perfectly specify the idealized self, the problem with her alternative is that we are perfectly specifying the flawed self. Her conclusion relies on the assumption that the indeterminacy of CEV is a fatal flaw while the fragility of current preferences is a manageable engineering problem. A CEV defender would argue the opposite: that aligning to current preferences is safe only in the short term and catastrophic in the long term, making the hard work of solving CEV necessary despite the indeterminacy risk. She presents the choice as between a broken ideal and a working reality, but the debate is actually between a hard-to-define ideal and a well-defined but potentially dangerous reality.

  Regarding the analogy to full-information accounts of a person's good in ethics, she is drawing on a real philosophical objection, often associated with the idea that the idealized self is no longer you. If your idealized self wants things your current self would hate, why should you care? This objection does transfer to CEV. However, her use of it is selective. She uses it to dismiss CEV but does not apply it to the alternative of training on actual approval. In ethics, the rival to full-information accounts is often desire satisfaction based on actual desires, which suffers from the problem that actual desires can be based on ignorance or manipulation. By invoking the ethical objection only against CEV, she creates an asymmetry. A defender of CEV would argue that the distance between your current self and your idealized self is the measure of your moral error, and that bridging it is the point of alignment. The objection is fair to raise, but it is not a trump card that invalidates CEV while leaving alternatives untouched.

  So, to straighten out where you stand: you are not garbling the concepts; your instincts about the aggregation distinction and the scope of extrapolation are more accurate than her summary. Her summary is a steel-man of the objections combined with a straw-man of the proposal. She correctly identifies that indeterminacy and programmer bias are the central risks of CEV, and she is right that the literature treats these as serious problems. However, she is wrong to present them as settled refutations that compel abandoning the approach. The claim that the literature knows this and therefore stops treating it as a serious target is factually incorrect regarding the core alignment community; many still treat something like CEV as the only viable long-term goal, even if near-term work focuses on other techniques. Her conclusion that we should rely on training systems on what people actually approve of follows only if you accept that the risks of CEV are uniquely fatal, which is precisely what is contested.

  In short, her audit of CEV is a valid expression of skepticism, but her presentation of it as a closed case is misleading. She has simplified the mechanism of CEV in ways that make it easier to attack, and she has exempted her preferred alternative from the same philosophical scrutiny. You should feel confident that your uncertainties about her summary were well-founded. The distinctions you sensed between aggregating and merging, and between correcting beliefs and extrapolating values, are not minor details; they are the core of the proposal that her summary elides. The argument she gave you is a strong version of the skepticism surrounding CEV, but it is not a neutral report of the state of the field, and it does not logically compel the conclusion that CEV should be abandoned unless you also accept that aligning to current human approval is safe, which is a much larger and more controversial assumption than she acknowledges.
