answer: |-
  **Sequence**
  Present the participant attitude first, but only as the default background of ordinary relationships. It is not a mood; it is the framework of reciprocity. Introduce the objective attitude second. You need this contrast to show the participant stance is a *position* one can step out of, not just a feeling. Then introduce excuses and exemptions. If you reverse this and teach excuses before the objective attitude, students will treat excuses as metaphysical loopholes regarding causation rather than interpersonal repairs regarding stance. They will think excusing someone moves you outside the practice, rather than restoring your place within it. Place the closing turn (the rejection of external justification) last. It must arrive as the realization that the previous distinctions exhaust the space of sense. If placed earlier, it reads as dogmatism; here, it lands as the only coherent conclusion left standing.

  **Case Study**
  Your diagnosis case is risky. It makes the objective attitude feel like an epistemic upgrade ("clarity") rather than a relational loss. It also blurs exemption (incapacity) with excuse (accident). To make it carry the session, emphasize the grief of losing reciprocity, not the relief of instrumental handling. The example must show that moving to the objective stance is a cost, not a victory. Supplement it with a trivial slight (e.g., a spilled drink) to demonstrate how excuses keep us *in* the participant stance. The case must lack any hint that the objective stance is the "true" view of human behaviour; it is a tool for specific contexts, not a revelation of reality.

  **Misconceptions**

  | Misconception | Sequence Point | Move to Head Off |
  | :--- | :--- | :--- |
  | Strawson is a compatibilist. | Intro | Frame as changing the subject, not solving the old puzzle. |
  | We "cannot help" attitudes (psychological claim). | Participant Attitude | Stress the rationality of attitudes, not just inevitability. |
  | Objective attitude is scientific/enlightened. | Objective Attitude | Highlight the loss of reciprocity; it's a tool, not a truth. |
  | Excusing = Exempting. | Excuses/Exemptions | Show excuses restore relationship; exemptions suspend it. |
  | Paper is merely descriptive. | Closing Turn | Show the normative force of our actual practices. |
  | Determinism kills responsibility. | Throughout | Remind them determinism doesn't trigger exemptions. |

  **Closing and Omissions**
  End with this question: "If a skeptic demands a justification for resentment that does not appeal to our actual human concerns, what kind of reason are they asking for, and why does Strawson say none exists?" A correct answer identifies the request for a non-human, external standpoint as unintelligible. A vocab-only answer will cite "reactive attitudes" without addressing the impossibility of the request.

  Explicitly omit self-reactive attitudes (guilt and shame) and the detailed taxonomy of partial exemptions. Say openly: "We are ignoring how responsibility feels from the inside to focus strictly on how we treat others. This is a limitation of today's session, not the theory." This prevents students from confusing the interpersonal scope with the whole picture.
