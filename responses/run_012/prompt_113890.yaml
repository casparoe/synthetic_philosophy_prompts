answer: |-
  # Session Plan: "The Red Line"

  **Concept:** A two-phase negotiation/conflict game simulating the Stability-Instability Paradox and Schelling's "Threat That Leaves Something to Chance."
  **Time:** 90 Minutes
  **Students:** 18 (Split into 2 Teams of 9: **Team Alpha** and **Team Beta**)
  **Materials:**
  *   Whiteboard + Markers.
  *   2 Opaque Cloth Bags (identical).
  *   20 Poker Chips (2 Red, 18 White).
  *   Index Cards (30 total): 15 marked "1", 15 marked "2", 15 marked "3", 15 marked "4". (Make more than you need).
  *   6 Special Cards marked "ROULETTE" (3 per team).
  *   2 Six-sided Dice.
  *   Score sheet on the board.

  ---

  ## Part 1: Setup & Rules (0:00 – 0:10)

  **Room Arrangement:**
  Divide the room. Team Alpha on the left, Team Beta on the right. They can huddle internally but cannot cross the midline.

  **The Narrative (Read this verbatim, no theory):**
  > "You are two neighboring powers. Over the next hour, you will compete for influence in six disputed zones.
  >
  > **The Goal:** Accumulate the most Influence Points.
  > **The Rounds:** We will play 6 Rounds.
  > **The Move:** Each round, your team must agree on a single 'Posture Level' (1, 2, 3, or 4). You will write this on an index card and reveal it simultaneously.
  > **The Conflict:**
  > *   If one team plays a higher number than the other, the higher number wins **10 Points**.
  > *   If numbers are equal, both teams get **0 Points** (Stalemate).
  > *   If a team plays 1 against a 4, the 4 wins **20 Points** (Domination).
  >
  > **Internal Rule:** You have 2 minutes per round to decide your move internally. If you cannot agree, you default to Level 1."

  **Write on Board:**
  *   **Win:** Higher Number = 10 Pts (20 Pts if 4 vs 1).
  *   **Tie:** 0 Pts.
  *   **Lose:** 0 Pts.
  *   **Default:** Level 1.

  ---

  ## Part 2: Phase One – "The Stable Top" (0:10 – 0:35)

  **Rounds 1, 2, and 3.**

  **The Rule:**
  > "In these first three rounds, **Level 4 is Safe.** There is no risk of catastrophe. You may escalate as high as you like without consequence."

  **Procedure:**
  1.  **Negotiation (2 mins):** Teams huddle. You walk between them. Do not advise. Just listen.
  2.  **Reveal (1 min):** "Cards up." Record scores.
  3.  **Reset:** Collect cards.

  **Expected Dynamics:**
  *   Because Level 4 is safe and dominates lower levels, rational teams will quickly race to Level 4.
  *   Result: Frequent Ties (0 points) or one side dominating. High tension, high aggression.
  *   *Note:* If they collude (agree to alternate wins), point it out neutrally: "I see a cooperative strategy." Do not forbid it, but note that in Round 3, temptation usually breaks it.

  ---

  ## Part 3: Phase Two – "The Risky Top" (0:35 – 1:05)

  **Rounds 4, 5, and 6.**

  **The Rule Change (Announce clearly):**
  > "The environment has changed. Level 4 is now **Unstable.**
  > *   If **anyone** plays a Level 4, I will draw a chip from the Fate Bag immediately after the reveal.
  > *   The Bag contains 9 White Chips (Safe) and 1 Red Chip (Catastrophe).
  > *   **If Red is drawn:** The game ends immediately. **Both teams finish with 0 Total Points.**
  > *   **If White is drawn:** The round resolves normally (Higher number wins points).
  >
  > **New Option: The Roulette Card.**
  > *   Each team has 3 'Roulette' cards.
  > *   If you play a Roulette card, **you surrender control.**
  > *   **Mechanism:** You place the card face up. You roll a die.
  >     *   **Even (2, 4, 6):** You are *forced* to play Level 4. (Trigger Fate Bag).
  >     *   **Odd (1, 3, 5):** You are *forced* to play Level 1.
  > *   **Constraint:** Once a Roulette card is placed on the table, it cannot be withdrawn. You cannot negotiate your way out of the roll."

  **Procedure:**
  1.  **Negotiation (3 mins):** Give them extra time. The stakes are higher. Watch for the "Roulette" cards appearing.
  2.  **Reveal & Resolution:**
      *   If Roulette played: Roll die publicly.
      *   If Level 4 played (by choice or Roulette): Draw from Fate Bag.
      *   Record scores.
      *   *Crucial:* If Red Chip is drawn, stop the game. Everyone gets 0. (Have a backup plan to restart if this happens in Round 4, but ideally, let the loss stand to prove the point).

  **Expected Dynamics:**
  *   Aggression on Level 4 should drop significantly compared to Phase 1 (Deterrence).
  *   Teams may use the **Roulette Card** to threaten escalation without *choosing* it. "I don't *want* war, but if I play this card, the die might make me start it."
  *   This forces the opponent to back down to Level 1 to avoid the risk.

  ---

  ## Part 4: The Debrief (1:05 – 1:30)

  **Do not lecture.** Draw the data from them. Write their observations on the board, then map the theory.

  **Step 1: The Data (5 mins)**
  *   Ask: "Look at Rounds 1-3. How many Level 4s were played?" (Likely high).
  *   Ask: "Look at Rounds 4-6. How many Level 4s were played?" (Likely low).
  *   Ask: "Why did the behavior change? The points didn't change."
  *   *Student Answer:* "Because of the Red Chip." / "Because of the risk."

  **Step 2: Stability-Instability Paradox (10 mins)**
  *   **Map it:**
      *   **Rounds 1-3:** The "Top" (Catastrophe) was impossible (Safe).
      *   **Result:** The "Bottom" (Level 4) became very hot. Everyone fought there.
      *   **Concept:** This is the **Stability-Instability Paradox**. When the ultimate weapon is unusable (stable), conventional conflict becomes more frequent (unstable) because the cost of pushing the limit is low.
      *   **Discussion:** "In Phase 1, did you feel safe pushing to Level 4? Why? Because you knew the game wouldn't end. That safety made the lower rung dangerous."

  **Step 3: Brinkmanship & Surrendering Control (10 mins)**
  *   **Map it:**
      *   Focus on the **Roulette Card**.
      *   Ask a student who played it: "Why did you give up your choice? Isn't that weakness?"
      *   Ask the opponent: "How did it feel when they put that card down? Did it make you more or less likely to play Level 4?"
      *   **Concept:** This is **Brinkmanship**. By making the threat *involuntary* (partly out of your hands), you make it credible. A rational actor can always back down. An actor bound by a die roll cannot.
      *   **Key Insight:** "Rationality is a liability in a threat contest. Irrationality (or surrendering control) is an asset."

  **Step 4: Resistance & Cost (5 mins)**
  *   Ask: "Where could you have resisted this logic?"
  *   **Resisting the Paradox:** "In Phase 1, you could have agreed to limit yourselves to Level 2. What was the cost?" (Trust issues, temptation to cheat for 20 points).
  *   **Resisting Brinkmanship:** "In Phase 2, if they played Roulette, you could have called their bluff. What was the cost?" (100% chance of 0 points if Red chip drawn).
  *   **Takeaway:** Deterrence works only if the threat is credible. Credibility often requires removing your own ability to be rational.

  ---

  ## Troubleshooting: What Will Go Wrong

  **1. The "Peace Pact" (Collusion)**
  *   *Problem:* In Phase 1, teams might agree to alternate wins (I play 1, you play 4) to maximize points.
  *   *Fix:* This is actually useful! It shows that without external risk, cooperation is *possible* but fragile. In Phase 2, the external risk (Red Chip) enforces cooperation (low levels) even without a pact.
  *   *Intervention:* If they collude too perfectly, add a "Secret Defector" rule in Round 3 (whisper to one student: "If you play 4 and they play 1, you get double points").

  **2. Risk Aversion (No One Plays Level 4 in Phase 2)**
  *   *Problem:* They get too scared. The game becomes boring.
  *   *Fix:* This is actually the *desired* outcome for the Stability-Instability lesson. It proves the Top Rung risk suppresses Bottom Rung conflict.
  *   *Intervention:* If no one uses the Roulette card, prompt during negotiation: "Remember, you have tools to change the odds."

  **3. The Red Chip is Drawn Early**
  *   *Problem:* Game ends in Round 4. Everyone gets 0. Students feel cheated.
  *   *Fix:* Have a "Reset" protocol. "Okay, the simulation ended in catastrophe. Let's rewind to Round 4. Keep your scores, but now you know the risk is real."
  *   *Better:* If it happens, lean into it. "This is the reality of the system. Let's discuss why this happened."

  **4. Confusion on Rules**
  *   *Problem:* 18 students arguing over mechanics.
  *   *Fix:* Keep the rules on the whiteboard the entire time. Do not change them mid-stream.

  ---

  ## Limitations: What You Must Supply

  The game cannot reproduce the following; you must address these in the debrief:

  1.  **Internal Politics:** The teams act as monolithic "Rational Actors." In reality, bureaucracies, publics, and leaders have different risk tolerances. *Ask:* "Did your team agree easily? What if half your team wanted Level 4 and half wanted Level 1?"
  2.  **Continuous Escalation:** The game has 4 discrete rungs. Real war is a slippery slope. *Ask:* "Is Level 3 really safe? Or does it just feel safe?"
  3.  **Human Cost:** Points are abstract. Real war involves suffering, not scorekeeping. *Ask:* "Did you feel stress when the bag was drawn? Imagine that stress was a city, not a chip."
  4.  **The "First Strike" Incentive:** The game is simultaneous. In reality, striking first matters. *Ask:* "If you could have seen their card before playing yours, would you have played differently?"

  ## Instructor Script Snippet (For the "Aha!" Moment)

  > "In Phase 1, the top was safe. So you fought on the rung below.
  > In Phase 2, the top was dangerous. So you stopped fighting on the rung below.
  > **But:** The person who played the Roulette card... they didn't stop fighting. They made the danger *work for them*.
  > They said: 'I am not threatening you. The Die is threatening you. I am just holding the Die.'
  > That is the paradox. To be safe, you must be dangerous. To be credible, you must be out of control."
