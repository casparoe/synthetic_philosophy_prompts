      *   *Claim:* Descendants say custodian had no right to sell (inalienable).
      *   *Comparison:* This is almost identical to Case 2 (Ancestral Figure).
          *   Case 2: Purchased, fair price, intermediary. Returned because "lineage guardian never properly owned."
          *   New Case: Purchased, fair price, custodian signed. Claim "never legitimately transferable."
      *   *Prediction:* **Return.**
      *   *Reasoning:* The panel prioritized cultural ontology over legal formalism in Case 2. To be consistent, they must do so here. The presence of a permit and receipt (Case 5/7 factors) is outweighed by the "inalienable kind" (Case 2/6 factors).

  7.  **Identify the Distinguishing Case:**
      *   We need to separate "Inalienability" from "Current Community Will."
      *   *Scenario:* An inalienable object (sacred) was acquired legally (no coercion), but the current community is *silent* or *divided* on return. Or, an inalienable object where the community asks the museum to keep it for safety (like Case 4, but Case 4 was masks/regalia, maybe less "inalienable" than a bundle?).
