      *   *Synthesis:* The panel seems to operate on a **Hybrid of Inalienability and Coercion**, weighted heavily toward **Inalienability for Sacred/Ancestral items**.
      *   *Crucial Distinction:* Case 2 is the key. A "fair sale" of a "lineage guardian" was returned. This means *legal title at the time is insufficient* if the object is culturally inalienable.
      *   *Crucial Distinction 2:* Case 5 & 7 show that *legal title + consent* is sufficient for *alienable/utilitarian/scientific* items.

      *   *Refined Principle:* **The Normative Validity of Transfer.** A transfer is valid only if (A) the object is culturally alienable (commodity) AND (B) consent was free. If the object is inalienable (sacred/ancestral/remains), transfer is void *ab initio*, regardless of price or permit. If the object is alienable, transfer stands if consent was free.

