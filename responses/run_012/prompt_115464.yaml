      *   *Conclusion:* The principle is **Categorical Inalienability**. Some things are not commodities. If it's in that category, title cannot pass. If it's not in that category, standard contract law (consent/permit) applies.
      *   *New Case:* It is explicitly "same inalienable kind." Therefore, title did not pass. Return.
      *   *Commitment:* Voting to Return = Adopting **Cultural Ontology over Colonial Law**. Voting to Retain = Adopting **Legal Positivism (Title at Time) over Cultural Claims**.

  10. **Final Polish:** Ensure tone is philosophical yet practical. Avoid moralizing; focus on logical consistency. (Make sure to explicitly answer the prompt's request for "plainly what principle we would be adopting").

