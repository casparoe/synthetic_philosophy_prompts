          *   *Why:* Does Inalienability trump Current Will? (Return it because it *must* be out of museum hands?) Or does Current Will trump Inalienability? (Keep it because they want it there?)
          *   *Alternative:* A **utilitarian object** acquired via **coercion** (e.g., tools taken under threat).
          *   *Why:* Does Coercion trump Alienability? (Return because theft?) Or does Alienability trump Coercion? (Keep because it's just a tool?)
          *   *Selection:* The Utilitarian/Coerced case is better to distinguish Coercion vs. Inalienability as the primary driver. If they return it, Coercion is the driver. If they keep it, Inalienability is the driver (since tools are alienable).
          *   *Wait, looking at the record:* Case 3 (Staff/Ceremonial/Raid) -> Return. Case 5 (Pottery/Tools/Consent) -> Retain. We don't have Pottery/Tools/Raid.
          *   *Let's go with the "Inalienable + Request to Retain" case.* It tests the limit of Case 2 vs Case 4. Case 2 returned an inalienable object despite a "sale." Case 4 retained objects because community asked. If an inalienable object is requested to be kept, do they return it (Inalienability absolute) or keep it (Community Sovereignty absolute)?

