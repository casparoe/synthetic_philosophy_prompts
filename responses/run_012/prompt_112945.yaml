prompt: |-
  I'm a retired paleoecologist/stratigrapher who has recently gotten into philosophy of science, and I keep getting tangled up in the Anthropocene as a historical period. The geologists seem to want a single synchronous marker—something like mid-20th-century radionuclides in sediments—while historians and archaeologists point out that humans have been reshaping landscapes for millennia, and the effects are diachronous. Is this just a fight about where to put the line, or is there a deeper conceptual confusion between a stratigraphic boundary and a historical period? And who actually gets to decide—the stratigraphers, the historians, some international committee? I have a hunch it's a category mistake: a chronostratigraphic unit has to be defined by a physical marker in rock, whereas a historical period is defined by social processes and can start at different times in different places. Could you explain whether that hunch is right, and what the actual conceptual issue is? Also, please seperate what's settled from what's genuinely contested among people who know the topic—don't present one camp's view as the consensus.
