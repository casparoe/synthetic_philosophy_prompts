      *   *Why?*
          *   Criminal: Likely innocent (no specific act).
          *   Political: Liable (citizen of the regime that collapsed).
          *   Moral: Guilty (failed to speak/act according to conscience).
          *   Metaphysical: Guilty (survived while others died; solidarity broken).
