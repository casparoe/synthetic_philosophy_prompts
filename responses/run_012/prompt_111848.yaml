      *   *Pre-requisite:* Establish the **Forum and the Standard**.
      *   *Why:* Without knowing *who* is judging (a court, a conscience, a victor, God) and *what law* applies (statutory, moral, political), the categories blur.
      *   *Action:* Start with the "Triangle of Judgment": Agent, Judge, Law.

  4.  **Step 2: Ordering the Categories:**
      *   Standard order: Criminal, Political, Moral, Metaphysical.
      *   *Is this the best pedagogical order?* Yes, but for specific reasons.
      *   *Logic:* Concrete/External $\rightarrow$ Abstract/Internal.
      *   *Criminal:* Clearcut, legal, individual. (The baseline).
      *   *Political:* Collective, liability, citizenship. (Addresses the friend's point directly).
      *   *Moral:* Individual, internal, conscience. (Prevents hiding behind "just following orders" or "political liability").
      *   *Metaphysical:* Solidarity, human failure. (The hardest one, keep it brief).
      *   *Why this order?* It moves from what the state can punish $\rightarrow$ what the state can claim $\rightarrow$ what the self must judge $\rightarrow$ what exists beyond judgment. It prevents the "slippery slope" where Political guilt swallows Moral guilt.

  5.  **Step 3: The Carrying Case (The Example):**
      *   *User's instinct:* Avoid the "low-level civil servant." Good instinct. That example often blurs Criminal and Moral (did they know? were they coerced?).
      *   *Requirement:* Needs to separate the four layers clearly.
