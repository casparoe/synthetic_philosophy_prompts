answer: |-
  Here is a plan for the ninety-minute session, structured to secure the conceptual groundwork before introducing the taxonomy, manage the specific resistances of your group, and ensure the distinction becomes a tool rather than a doctrine.

  ### 1. The Groundwork: Establishing the "Forum of Judgment"
  You are correct that the session will fail if you do not first separate **liability** from **guilt**. Your friend's intuition (Liability $\rightarrow$ Guilt) is the primary obstacle. Jaspers's entire project rests on the premise that different kinds of judgment require different forums, different judges, and different laws.

  Before you write the four categories on the board, you must establish the **Triangle of Judgment** for each. Do not present the categories as types of *feelings*; present them as types of *jurisdiction*.

  *   **The Intervention:** Spend the first 15 minutes establishing that "Guilt" is not a monolith. It is a relationship between an **Agent**, a **Judge**, and a **Law**.
  *   **The Distinction:** Draw a sharp line between **Political Liability** (citizenship) and **Moral Guilt** (conscience).
      *   *Liability* is about the continuity of the state. If the state commits a crime, the citizens (as shareholders of the state) are liable for reparations, regardless of individual action. This is objective.
      *   *Guilt* (in the moral/criminal sense) requires individual agency and intent. This is subjective.
  *   **Why this first?** If you do not secure this, the group will treat Political Guilt as "Collective Sin," which triggers the "inherited guilt" rejection, or they will treat Moral Guilt as "Political Liability," which triggers the "why should I pay for my grandfather's war" rejection. You must validate your friend's point (yes, there is political liability) while vindicating your intuition (no, that is not moral guilt).

  ### 2. The Order of Categories
  You should follow Jaspers's ascending order: **Criminal $\rightarrow$ Political $\rightarrow$ Moral $\rightarrow$ Metaphysical.** Do not rearrange this.

  *   **Why this order?** It moves from the **External/Coercive** to the **Internal/Voluntary**.
      1.  **Criminal:** Anchors the discussion in objective fact and law. It prevents the session from becoming purely abstract. It satisfies the lawyer and the historians immediately.
      2.  **Political:** Addresses the "nation" question directly. It accepts collective *liability* without conceding collective *sin*. This is the bridge your friend was missing.
      3.  **Moral:** This is the pivot. Once political liability is established, the temptation is to stop there ("I paid my taxes/reparations, I am clean"). Moral guilt prevents the individual from hiding behind the state. It re-individualizes responsibility.
      4.  **Metaphysical:** The limit concept. It deals with what remains when law and morality have done their work.

  *   **The Risk of Reordering:** If you start with Moral, the group will bog down in psychology ("How do I know what I felt?"). If you start with Political, you confirm the fear of "Collective Guilt." Starting with Criminal creates a hard floor of fact; ending with Metaphysical creates a ceiling of human solidarity.

  ### 3. The Carrying Case
  Your instinct about the "low-level civil servant" is correct; it is too ambiguous regarding criminal intent. You need a case that **maximizes the gap between Political Liability and Moral Guilt.**

  **The Case:** *The Beneficiary.*
  A German citizen who did not join the Party, committed no violence, and broke no laws *as they stood at the time*, but who purchased a Jewish neighbor's business at a forced auction in 1938, knowing the neighbor was being pressured to sell to survive/emigrate. The neighbor was later deported and killed. The beneficiary survived the war and kept the business.

  *   **Features it must have:**
      *   **Legality at the time:** To separate Criminal from Moral. (No criminal guilt under positive law then, though potentially retroactive now).
      *   **Knowledge:** The beneficiary must have *known* the context was coercive. This secures Moral guilt.
      *   **Citizenship:** They remained a citizen. This secures Political liability.
      *   **Survival:** They lived while the neighbor died. This opens the door to Metaphysical guilt.
  *   **Features it must lack:**
      *   **Direct Violence:** Do not let them be a camp guard. That collapses all four categories into Criminal.
      *   **Active Resistance:** Do not let them be a secret dissident. That collapses Moral guilt.
  *   **Managing the Group's Cases:**
      *   Introduce this case first to calibrate the distinctions.
      *   *Then* invite the historians and lawyer to test it against real cases they know.
      *   **Constraint:** Tell the group: "You may introduce real historical figures, but you must specify which *forum* is judging them. If you say 'He was guilty,' I will ask you: 'Before which judge?'" This forces them to use the tool.

  ### 4. Misconceptions and Intervention Points
  The misconceptions will arise in a predictable sequence. You must head them off *before* they harden.

  1.  **"Jaspers is letting criminals off the hook."**
      *   *When:* Immediately upon introducing Criminal Guilt.
      *   *Intervention:* State clearly: "Criminal guilt is the foundation. If one is criminally guilty, the other categories are secondary. Jaspers is not offering amnesty; he is offering precision."
  2.  **"Political Guilt is just Collective Guilt by another name."**
      *   *When:* During the Political category. This is your friend's argument.
      *   *Intervention:* Hammer the **Liability vs. Blame** distinction. "Political guilt is not a stain on the soul; it is a bill for the damages caused by the state of which you are a member. It is about restitution, not damnation."
  3.  **"Moral Guilt is private and irrelevant."**
      *   *When:* During the Moral category. The lawyer or foundation worker may argue that if the law didn't punish it, it doesn't matter.
      *   *Intervention:* Remind them that Nuremberg relied on "Crimes Against Humanity"—a moral category encoded into law. Moral guilt is the seed of future law. Without it, "I was following the law" is a perfect defense.
  4.  **"Metaphysical Guilt is mystical inherited sin."**
      *   *When:* At the end.
      *   *Intervention:* Reframe it immediately as **Solidarity**. "This is not about God punishing grandchildren. It is about the failure of human solidarity. I am guilty because I am human and I did not stop it, because I survived when others did not."

  ### 5. The Ending: Diagnosis and Exclusion
  You have 15 minutes left. Do not summarize the lecture. Test the utility of the distinction.

  **The Diagnostic Question:**
  Do not ask them about Germany. Ask them about **Climate Change** or **Colonial Repatriations**.
  *   *Prompt:* "Take the case of [Climate Change / Colonial Artifacts]. Using Jaspers's grid: Who bears Criminal guilt? Who bears Political liability? Who bears Moral guilt? Is there a Metaphysical dimension?"
  *   *Success Criterion:* If they argue about "who is to blame" without specifying the *forum* (Court vs. State vs. Conscience), they haven't learned the distinction. If they say, "The State is politically liable for reparations, but the individual citizen is only morally guilty if they actively obstructed solutions," they have mastered it.

  **What to Explicitly Exclude:**
  You must be honest about the limits of the session to prevent the "mystical" pushback.
  1.  **The Metaphysical Category (Reframed):** Tell them: "We are treating Metaphysical guilt not as a theological claim about sin, but as an existential claim about human solidarity. We are leaving aside the question of *atonement* (how one cleanses this guilt) to focus on *attribution* (how we identify it)."
  2.  **Collective Memory:** Tell them: "We are not discussing how nations *remember* guilt (monuments, education), but how they *assign* it. Memory is the aftermath; this session is about the accounting."

  **Final Advice:**
  Your friend's argument (Liability implies Guilt) is the most dangerous intuition in the room. If you allow Political Liability to bleed into Moral Guilt, you validate the idea of "Original Sin" for citizens. If you separate them too sharply, you validate the idea that "Paying reparations clears the conscience."
  Your job is to hold the tension: **We are all politically liable for the acts of our state, but we are only morally guilty for the acts of our own conscience.** Jaspers's genius is holding these two truths simultaneously without letting one cancel the other. Keep the group in that tension.
