answer: |-
  In the kitchen, Mark stirred the soup. "Harsanyi's aggregation theorem is brilliant. Social welfare is just a weighted sum of individual utilities."

  "Nice," said Jen. "So equal weights?"

  "Nope. The theorem proves weights exist, but doesn't define them."

  "So I could get zero?"

  "Consistent with the axioms, yes. You need a separate equiprobability argument to force equality."

  Jen grabbed the spoon. "So the hard math leaves the only important variable undefined?"

  "It gives you the formula but hides the constants."

  "Then hand me the salt."

  "With what weight?"

  "Exactly. We can't assign one until we assume we're equally likely to be the shaker."
