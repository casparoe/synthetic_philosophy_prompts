      *   *Tone Check:* Ensure the replies sound confident but acknowledge the tension.
      *   *Ordering:* Ensure the most damaging are first. (Safety Engineer and Mech Interp are the big ones).

  6.  **Final Polish:** (Self-Correction during drafting)
