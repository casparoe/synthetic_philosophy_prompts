  **Sensitivity and Movement**
  Your 0.35 is most sensitive to **Term 2 (Internal Math Consistency)** because you are assuming lowering Ada increases Bo's weight, whereas standard priority weighting would decrease it as the gap shrinks. To move my number up, you would need to construct a coherent weight function where lowering the advantaged person increases the moral weight of the disadvantaged person's gain without that weight shift simply being a proxy for valuing equality itself. Until that math holds, you haven't found a hole in prioritarianism; you've just redrawn the boundary between it and egalitarianism.
