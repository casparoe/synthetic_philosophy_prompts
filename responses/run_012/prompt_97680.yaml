answer: |-
  The episode of Mercury's perihelion stands as a paradigmatic instance of scientific explanation: a stubborn anomaly identified by Urbain Le Verrier in 1859, which resisted Newtonian solutions and the hypothesized planet Vulcan, was precisely accounted for by Albert Einstein's General Relativity (GR) in 1915. For Einstein, this was the emotional and intellectual climax of his theory's development. However, within the framework of standard Bayesian confirmation theory, this episode presents a profound paradox known as the "Problem of Old Evidence."

  ### The Bayesian Machinery and the Silence of Confirmation

  Standard Bayesian confirmation relies on conditionalization. A hypothesis $H$ (General Relativity) is confirmed by evidence $E$ (the anomalous precession of Mercury) if the posterior probability of the hypothesis given the evidence is greater than its prior probability: $P(H|E) > P(H)$. By Bayes' Theorem, this occurs if the likelihood ratio favors the hypothesis, specifically if $P(E|H) > P(E)$.

  The machinery breaks down in the Mercury case because the evidence $E$ was "old." By 1915, the scientific community assigned a probability of 1 to the proposition that Mercury's perihelion precessed by approximately 43 arcseconds per century beyond Newtonian predictions. Le Verrier had established this fact in 1859. In Bayesian terms, $P(E) = 1$.

  If $P(E) = 1$, it follows logically that $P(E|H) = 1$ for any consistent hypothesis $H$. Substituting these values into Bayes' Theorem yields:
  $$P(H|E) = \frac{1 \cdot P(H)}{1} = P(H)$$
  The posterior probability equals the prior. Conditionalizing on $E$ produces no change in the probability of $H$. According to the standard account, Einstein's derivation of the 43 arcseconds provided *no* confirmation for General Relativity. The massive boost in credibility that GR received from explaining the anomaly is invisible to the formalism. The theory solved a known puzzle, but because the puzzle was already solved (in the sense of being a known fact), the Bayesian agent cannot update on it.

  ### Assessing the Principal Repairs

  Philosophers of science have proposed several repairs to rescue Bayesianism from this counterintuitive result.

  **1. The Derivational Relation (Garber-Style)**
  This approach suggests that the agent does not conditionalize on the evidence $E$ itself, but on the *logical relation* between the theory and the evidence. Let $R$ be the proposition "Hypothesis $H$ entails Evidence $E$." In 1915, while $E$ was known, $R$ was not. Einstein learned that his field equations necessitated the specific value of the precession. By expanding the probability space to include logical possibilities, the agent can assign a probability $P(R) < 1$ before the derivation and $P(R) = 1$ after. Conditionalizing on $R$ raises the probability of $H$.
  *Assessment:* This captures the historical psychology of discovery. Einstein's excitement stemmed from the *necessity* of the fit, not the data itself. However, it requires relaxing the assumption of logical omniscience, treating logical truths as uncertain empirical-like propositions.

  **2. Fine-Grained Evidence**
  This repair argues that the evidence is not the bare fact "there is an anomaly," but the specific proposition "the anomaly is exactly $X$ value derived from fundamental constants." Proponents argue that while the *existence* of the anomaly was old, the specific *theoretical description* of the magnitude was new.
  *Assessment:* This is weak in the Mercury case. Le Verrier knew the magnitude (43 arcseconds/century) with high precision long before 1915. Unless one argues that the evidence is "the value is 43 *without free parameters*," this merely disguises the problem. The number itself was old data.

  **3. Confirmation as Non-Probabilistic Support**
  A more radical repair suggests that confirmation should not be defined strictly as a diachronic rise in subjective probability. Instead, confirmation is a synchronic relation of explanatory coherence or structural support. $H$ confirms $E$ if $H$ provides the best explanation for $E$, regardless of when $E$ was learned.
  *Assessment:* This aligns with scientific practice (explanation is confirmatory) but abandons the core Bayesian commitment that belief change *is* probability updating via conditionalization. It saves the intuition but changes the theory.

  ### Which Repair is Best Supported?

  The Mercury episode best supports the **Derivational Relation (Garber-style)** repair. The historical record shows that the confirmatory weight lay in the *derivation*, not the datum. Newtonian mechanics could accommodate the 43 arcseconds only by adding ad hoc factors (like Vulcan), whereas GR yielded the number from the field equations alone. The "new" thing learned in 1915 was not the position of Mercury, but the structural capacity of GR to dictate that position. This repair preserves the Bayesian framework while acknowledging that human agents learn logical connections over time. It validates Einstein's intuition that he had gained evidence, by redefining that evidence as the discovery of a theoretical entailment.

  ### The Role of Novel Predictions

  One might argue that the Problem of Old Evidence is moot because GR was subsequently confirmed by *novel* predictions, such as the deflection of light (1919) and the gravitational redshift. If $P(H)$ rises due to these new events ($E_{new}$), does the failure to update on $E_{old}$ (Mercury) matter?

  The Mercury case shows that old-evidence confirmation is **not dispensable**. First, historically, the explanation of Mercury gave GR the initial plausibility required to justify the expensive and difficult tests of light deflection. Without the Mercury solution, the novel predictions might have been dismissed as the speculations of an unproven theory. Second, philosophically, the *type* of confirmation differs. Novel predictions test a theory's riskiness; explaining old evidence tests a theory's depth and unification. A theory that predicts new data but fails to explain known anomalies is often viewed as incomplete. The Mercury case demonstrates that retrodictive explanation carries confirmatory weight independent of novel prediction. To claim otherwise is to ignore a primary virtue of scientific theories: their ability to unify disparate known facts.

  ### What the Bayesian Must Concede

  To accommodate the Mercury episode, the Bayesian must concede two significant points. First, they must abandon **logical omniscience**. Standard Bayesianism assumes agents know all logical consequences of their beliefs instantly. The Mercury case proves that learning a logical consequence (that GR $\vdash$ Mercury's shift) is a distinct cognitive event that drives belief change. Second, the Bayesian must concede that **diachronic updating is insufficient**. A theory of confirmation must account for synchronic support relations (how well $H$ explains $E$ now) that exist independently of the temporal order of discovery. The probability function must be able to represent the "support" $H$ lends to $E$ even if $E$ was certain before $H$ was formulated.

  ### Verdict

  The Mercury perihelion case shows that standard Bayesian conditionalization is descriptively inadequate for modeling scientific reasoning. It fails to capture the confirmatory power of explanatory unification. However, it does not falsify Bayesianism entirely. Instead, it forces a refinement: Bayesianism must be extended to include the learning of logical and mathematical relations as confirmatory events. The verdict is that the Bayesian account survives only if it acknowledges that **explanation is a source of confirmation distinct from empirical novelty.** The Mercury anomaly remains a testament to the fact that in science, making sense of the known can be just as powerful as predicting the unknown.
