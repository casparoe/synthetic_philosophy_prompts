prompt: |-
  I'm a reporter — I cover AI and tech policy, and I've got a peice going out tomorow about who actually gets to decide what a superintelligence wants. I interviewed a guy for it who's been in AI policy for like a decade, seems sharp, no crank. He gave me this gloss on coherent extrapolated volition and it's probably going to be in the piece, so I want to make sure I'm not printing something a grad student in this stuff would laugh at.

  Here's what he said, roughly: CEV is the idea that you don't hand the AI a list of rules, you let it work out what humanity would want if we were smarter, better informed, and had a lot longer to think about it, and then it maximizes that. The "coherent" bit means that when different people's extrapolated preferences bang into each other, the AI averages them into one consistent set of values — so really it's preference utilitarianism, except with idealized preferences instead of the messy ones people actually have. Which means in practice the AI would do what we'd recognize as the right thing, just way more competently; it's our own values with the noise stripped out. Yudkowsky came up with it back in the friendly-AI days, and Bostrom has a whole section on it in Superintelligence. He also reckons the standard objection is that people's values might not converge at all, and that this basically sinks the whole thing.

  I don't know this literature well enough to push back on him. My instinct is that if the preference-utilitarianism part is right, that's actually my lede, so I'd sort of like it to be right. Can you go through his summary claim by claim and tell me what someone who actually works on this would nod along to, what they'd wince at, and what's just wrong? Where it's wrong I want the real claim and what turns on the difference — not just "that's not what the proposal says." Where it's a simplification that a fair-minded person would let slide, say so, don't grade everything as an error. Then tell me whether his bottom line follows from the parts that are accurate, and if it doesn't, what would have to be true for it to. And give me two or three sentences I could actually print that get the idea right, without me having to cite anything.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Reporter covering AI and tech policy.
      *   **Task:** Fact-check/verify a summary of Coherent Extrapolated Volition (CEV) provided by an interviewee (an AI policy expert of 10 years).
      *   **Goal:** Ensure the piece doesn't contain errors a specialist would laugh at, identify accurate vs. inaccurate claims, understand the implications of inaccuracies, and get printable summary sentences.
      *   **Tone:** Professional, precise, nuanced, but accessible (for a reporter). No pedantry, but high fidelity to the technical literature.
      *   **Key Constraint:** "Where it's a simplification that a fair-minded person would let slide, say so, don't grade everything as an error."

  2.  **Analyze the Interviewee's Claims (Claim-by-Claim):**

      *   *Claim 1:* "CEV is the idea that you don't hand the AI a list of rules, you let it work out what humanity would want if we were smarter, better informed, and had a lot longer to think about it, and then it maximizes that."
          *   *Assessment:* **Accurate.** This is the core definition from Yudkowsky's 2004 paper. "Smarter, better informed, faster, etc." is the standard gloss.
          *   *Nuance:* It's not just "maximizing that" in a simple utilitarian sense, but fulfilling the *volition* (will/choice) rather than just a static preference set. But for a general summary, this is fine.

      *   *Claim 2:* "The 'coherent' bit means that when different people's extrapolated preferences bang into each other, the AI averages them into one consistent set of values..."
          *   *Assessment:* **Problematic/Imprecise.** "Coherent" refers to *logical consistency* within the extrapolation process (resolving contradictions, ambiguities, and self-modifications), not necessarily "averaging" people. It's about making *individual* volitions coherent first, then aggregating. "Averaging" implies a specific aggregation function (like utilitarianism) which CEV tries to avoid committing to prematurely.
          *   *Correction:* It's about resolving internal contradictions and conflicts *before* aggregation, or finding a convergence that respects the structure of the volition, not a simple mathematical average.

      *   *Claim 3:* "...so really it's preference utilitarianism, except with idealized preferences instead of the messy ones people actually have."
          *   *Assessment:* **Wrong/Overstated.** This is the biggest technical error. CEV was explicitly designed to *avoid* hardcoding a moral framework like utilitarianism. It aims to capture *what we would want*, which might be deontological, virtue-ethical, pluralistic, or weird. Equating it to preference utilitarianism misses the point of *extrapolating volition* vs. *satisfying current preferences*.
          *   *Implication:* If it's just idealized preference utilitarianism, it's a standard ethics problem. If it's CEV, it's a metaphysical/technical problem about identity and convergence. This changes the story from "AI will be a utilitarian" to "AI will try to be us, but better."

      *   *Claim 4:* "Which means in practice the AI would do what we'd recognize as the right thing, just way more competently; it's our own values with the noise stripped out."
          *   *Assessment:* **Fair Simplification.** This is the *hope* of CEV. It's the "Friendly AI" pitch.
          *   *Risk:* It assumes convergence (see Claim 5). If values don't converge, "our values" is an empty set.

      *   *Claim 5:* "Yudkowsky came up with it back in the friendly-AI days, and Bostrom has a whole section on it in Superintelligence."
          *   *Assessment:* **Accurate.** Yudkowsky (2004), Bostrom (2014) discusses it (though critically).

      *   *Claim 6:* "He also reckons the standard objection is that people's values might not converge at all, and that this basically sinks the whole thing."
          *   *Assessment:* **Accurate.** The "non-convergence" or "fragility of value" objection is the primary critique. If extrapolated volitions are orthogonal or hostile, CEV fails.

  3.  **Synthesize the "Wince" Points:**
      *   The "Preference Utilitarianism" equation is the big one. It reduces a complex meta-ethical proposal to a standard normative ethics bucket.
      *   The "Averaging" description is too mechanical. CEV is about *coherence*, not just aggregation.

  4.  **Evaluate the Bottom Line:**
      *   *Interviewee's Bottom Line:* CEV = Idealized Preference Utilitarianism -> AI does right thing (if convergence holds).
      *   *Reality:* CEV = Meta-ethical procedure to find volition -> AI does *what we would want* (which might not be utilitarian) -> Convergence is the bottleneck.
      *   *Does it follow?* Mostly, but the "Utilitarian" label is misleading. If the reporter prints "Utilitarianism," ethicists will object. If the reporter prints "Idealized Values," it's safer.
      *   *Condition for validity:* For the interviewee's summary to hold, one must assume that "idealized preferences" converge on a utilitarian calculus. CEV proponents explicitly *don't* assume that.

  5.  **Drafting the Response:**
      *   *Structure:*
          1.  Intro (Validate the reporter's instinct).
          2.  Claim-by-Claim Breakdown (Green/Yellow/Red).
          3.  The "Utilitarianism" Error (Deep dive on why this matters).
          4.  The Bottom Line Analysis.
          5.  Printable Sentences.
      *   *Tone Check:* Keep it helpful, not condescending. Acknowledge the interviewee is "sharp" but maybe summarizing from memory or simplifying for the piece.
      *   *Specific Fix:* The "Preference Utilitarianism" claim needs to be replaced with "Meta-ethical procedure."

  6.  **Refining the Printable Sentences:**
      *   Need to capture: Not rules, but extrapolated will. Not necessarily utilitarian. Convergence is the risk.
      *   Draft 1: CEV asks AI to do what we would want if we were smarter. It's not utilitarianism. It might fail if we don't agree.
      *   Draft 2 (Better): Coherent Extrapolated Volition proposes that instead of programming rules, we task AI with fulfilling what humanity would want if we were smarter and more thoughtful. It isn't a specific moral theory like utilitarianism, but a method to uncover our idealized values. The catch is that if our deeper values don't align, the system has nothing to latch onto.
      *   Draft 3 (Polishing for flow): "Coherent Extrapolated Volition proposes that instead of hard-coding rules, we task AI with fulfilling what humanity would want if we were smarter, better informed, and more thoughtful. It isn't a specific moral theory like utilitarianism, but a method to uncover our idealized collective will. The critical catch is that if our deeper values don't naturally align when extrapolated, the system has nothing stable to optimize for."

  7.  **Final Review against Constraints:**
      *   Did I grade fair simplifications as okay? Yes (the "smarter/better informed" part).
      *   Did I explain *what turns on the difference*? Yes (Utilitarianism vs. Meta-ethics).
      *   Did I answer if the bottom line follows? Yes (with caveats).
      *   Did I provide printable sentences? Yes.

  8.  **Self-Correction during drafting:** I need to make sure I don't get too bogged down in the weeds of Yudkowsky's 2004 paper. Keep it relevant to *policy* and *risk*. The reporter cares about "who decides." The utilitarian point matters because if it's utilitarian, it's a philosophical choice. If it's CEV, it's a technical guess about human psychology. That's a policy distinction.

      *Wait, one nuance:* The interviewee said "averages them into one consistent set." CEV talks about *coherence*, which implies resolving contradictions, but "averaging" suggests a specific aggregation function. I should highlight that "aggregation" is the unsolved problem in CEV, not just "averaging."

      *Refining the Utilitarian point:* It's not just that CEV *isn't* utilitarianism, it's that CEV is *agnostic*. Calling it utilitarianism assumes the answer before the calculation. That's a crucial distinction for a policy piece.

      *Okay, ready to write.*
answer: |-
  This is a strong summary for a general audience, and your instinct is correct: the "preference utilitarianism" line is the one that will make a specialist wince. It's not a fatal error for a general reader, but it conflates a *method* with a *moral conclusion*, which matters for a policy piece about "who decides."

  Here is the claim-by-claim breakdown, followed by the bottom-line analysis and printable text.

  ### Claim-by-Claim Breakdown

  **1. "CEV is the idea that you don't hand the AI a list of rules, you let it work out what humanity would want if we were smarter, better informed, and had a lot longer to think about it, and then it maximizes that."**
  *   **Verdict:** **Accurate.**
  *   **Notes:** This is the standard, fair gloss. It captures the 2004 Yudkowsky definition without getting bogged down in the technical syntax. A specialist would nod here.

  **2. "The 'coherent' bit means that when different people's extrapolated preferences bang into each other, the AI averages them into one consistent set of values..."**
  *   **Verdict:** **Imprecise (Yellow Flag).**
  *   **Notes:** "Coherent" refers primarily to *logical consistency* within the volition (resolving contradictions, ambiguities, and self-modifications), not necessarily *aggregation* between people. While CEV does require aggregating humanity's volition, describing it as "averaging" implies a specific mathematical solution to a problem that CEV proponents admit is unsolved.
  *   **What turns on the difference:** "Averaging" sounds like a technical fix. "Aggregation" is a political/philosophical problem. If the AI "averages," it implies a smooth compromise. If it "aggregates coherent volitions," it might find that some people's extrapolated values are incompatible with others', leading to deadlock or exclusion rather than a smooth average.

  **3. "...so really it's preference utilitarianism, except with idealized preferences instead of the messy ones people actually have."**
  *   **Verdict:** **Wrong (Red Flag).**
  *   **Notes:** This is the biggest technical error. CEV was explicitly designed to *avoid* hardcoding a moral framework like utilitarianism. It is a *meta-ethical* procedure, not a *normative* theory. It aims to capture *what we would want*, which might turn out to be deontological, virtue-based, pluralistic, or something we don't have a name for yet.
  *   **What turns on the difference:** If you print "it's preference utilitarianism," ethicists will object that you've reduced a complex proposal to a specific school of ethics. More importantly for policy: Utilitarianism is a *choice* of values. CEV is a *guess* about human psychology. If CEV works, the AI isn't applying a philosophy; it's executing our own idealized will. If it turns out our idealized will *is* utilitarian, that's a result, not a premise.

  **4. "Which means in practice the AI would do what we'd recognize as the right thing, just way more competently; it's our own values with the noise stripped out."**
  *   **Verdict:** **Fair Simplification.**
  *   **Notes:** This is the *hope* of the proposal, not necessarily the guaranteed outcome. A specialist would accept this as a description of the *goal*, provided you don't present it as a proven fact.

  **5. "Yudkowsky came up with it back in the friendly-AI days, and Bostrom has a whole section on it in Superintelligence."**
  *   **Verdict:** **Accurate.**
  *   **Notes:** No issues here.

  **6. "He also reckons the standard objection is that people's values might not converge at all, and that this basically sinks the whole thing."**
  *   **Verdict:** **Accurate.**
  *   **Notes:** This is the "non-convergence" or "fragility of value" objection. If our extrapolated values are orthogonal or hostile, CEV yields no stable target. This is the correct "gotcha" for the theory.

  ### Does the Bottom Line Follow?

  **The Interviewee's Bottom Line:** CEV is effectively idealized preference utilitarianism; therefore, the AI will do the "right thing" (competently) *if* values converge.

  **The Reality:** CEV is a procedure to discover our idealized values; therefore, the AI will do *what we would want* (which is unknown) *if* values converge.

  **Analysis:** The bottom line mostly holds, but the "utilitarianism" label weakens it. If you print that CEV *is* utilitarianism, you imply the moral outcome is known in advance. The actual stakes are higher: CEV bets that human values *have* a coherent shape to find. If they don't, the AI doesn't just pick the wrong moral theory; it has *no* moral compass.

  For his bottom line to be technically accurate, one would have to assume that "idealized preferences" inevitably converge on a utilitarian calculus. CEV proponents explicitly do not assume this; they hope the process reveals *our* values, whatever they are.

  ### Printable Sentences

  Here are three sentences that capture the nuance without requiring citations or inviting technical pushback:

  > "Coherent Extrapolated Volition proposes that instead of hard-coding rules, we task AI with fulfilling what humanity would want if we were smarter, better informed, and more thoughtful. It isn't a specific moral theory like utilitarianism, but a method to uncover our idealized collective will. The critical catch is that if our deeper values don't naturally align when extrapolated, the system has nothing stable to optimize for."

  ### Summary for You
  Your interviewee is sharp and gets the big picture right (especially the convergence objection), but he's collapsed a meta-ethical procedure into a normative ethical label. If you swap "preference utilitarianism" for "idealized collective will" or "method to uncover our values," you keep the flow of his argument without tripping the wire on technical accuracy.
