  # Decision Tree: After the Money Pump

  **Start:** You just lost cash in a cycle ($A \to B \to C \to A$). You agree something went wrong.

  **Node 1:** Where was the defect? Was it in your **preferences** (how you ranked the options), or in your **management** (how you chose over time)?
  *   *Preferences* $\to$ Go to Node 2.
  *   *Management* $\to$ Go to Node 7.

  ---

  ### Branch: Preferences

  **Node 2:** Do your preferences rank **outcomes** (what you end up with) or **histories** (the path you took to get there)?
  *   *Histories* $\to$ Go to Node 3.
  *   *Outcomes* $\to$ Go to Node 4.

  **Node 3:** If they rank histories, do those preferences exist at a single moment in time, or do they span your whole life?
  *   *Span whole life / Timeless* $\to$ **Leaf 1: Preferences have no duration.** (The puzzle is confused; preferences aren't the kind of thing that can be cyclic at a time.)
  *   *Single moment* $\to$ Go to Node 4.

  **Node 4:** Does the loss of cash in the pump prove your preferences are irrational?
  *   *Yes* $\to$ Go to Node 5.
  *   *No* $\to$ Go to Node 6.

  **Node 5:** Is the irrationality because you violated a logical rule (transitivity), or because you lost out on value (prudence)?
  *   *Logical Rule* $\to$ **Leaf 2: The flat-footed view.** (Cyclic preferences are just irrational; the pump is the proof.)
  *   *Lost Value* $\to$ *[Empty Slot: Unattractive. If the loss proves irrationality, it collapses into the flat-footed view; if it doesn't, it collapses into the view below.]*

  **Node 6:** Does the pump argument depend on you being ignorant of the cycle or unable to precommit?
  *   *Yes* $\to$ **Leaf 3: Intransitive betterness is rational.** (The pump is no reductio; it relies on unrealistic conditions.)
  *   *No* $\to$ *[Return to Node 5. If the pump works without ignorance, the preferences are likely defective.]*

  ---

  ### Branch: Management

  **Node 7:** Who is the bearer of the requirement? Is there a "you" that exists across time, or only a "you" at each moment?
  *   *Only at each moment (Time-slice)* $\to$ Go to Node 8.
  *   *Across time (Whole Person)* $\to$ Go to Node 10.

  **Node 8:** Is there any rational requirement that connects you to your future self, or is consistency only valuable if it helps you *now*?
  *   *Yes, a requirement* $\to$ **Leaf 4: [Empty Slot: Incoherent.]** (The time-slice ontology denies the diachronic agent required to bear this norm.)
  *   *No, only a tool* $\to$ Go to Node 9.
  *   *No, not even a tool* $\to$ **Leaf 5: The time-slice view.** (There is no diachronic requirement; each slice does its best.)

  **Node 9:** If consistency is a tool, do you actively bind your future self (e.g., commitment devices) to stop them trading?
  *   *Yes* $\to$ **Leaf 6: The instrumentalist view.** (Consistency isn't a requirement but a technique; you bind yourself because binding gets you what you want.)
  *   *No* $\to$ **Leaf 7: The naive chooser.** (You simply maximize at each moment with the attitudes you have right then.)

  **Node 10:** When you reach the future and your preferences have changed, what authority does your earlier plan have?
  *   *None (Future preferences are fixed facts you must plan around)* $\to$ Go to Node 11.
  *   *Some (You can choose to stick to the plan despite the shift)* $\to$ Go to Node 12.

  **Node 11:** Do you anticipate this change and restrict your future options now to prevent it?
  *   *Yes* $\to$ **Leaf 8: Sophisticated choice.** (You treat future preferences as fixed facts, backward-induct, and buy commitment whenever you can.)
  *   *No* $\to$ **Leaf 9: [Empty Slot: Unattractive.]** (Believing in a whole-person agent but failing to constrain known future deviations guarantees exploitation.)

  **Node 12:** Is sticking to the plan a matter of calculating the best path, or exercising a capacity to keep commitments?
  *   *Calculating best path* $\to$ *[Merge with Leaf 8. Sophistication can be framed this way.]*
  *   *Exercising capacity / Coherence* $\to$ **Leaf 10: Resolute choice.** (You treat the plan you made earlier as something you're entitled to stick to, even after preferences shift.)

  *(Note: Leaves 8 and 10 are the standard rivals in the Whole Person branch. Leaf 9 captures the unstable middle ground.)*
