answer: |-
  You have identified the central tension in *On Certainty*, and you have done so with remarkable precision. The difficulty you face is not a misunderstanding of Wittgenstein; it is the exact point where many readers feel the text slips from a liberating description of human practice into a quietist trap.

  You are asking for a normative procedure (how *ought* I choose?) based on a descriptive insight (how *do* hinges function?). Wittgenstein's explicit answer to your request would be that the request itself is a symptom of the confusion he is trying to dissolve. However, simply telling you "there is no method" is unsatisfying and arguably unhelpful.

  Here is a way to navigate this. We must distinguish between what Wittgenstein allows *within* the system of *On Certainty* and what you might construct *alongside* it to satisfy your legitimate desire for agency.

  ### 1. The Wittgensteinian Constraint: Why there is no "Choice"
  First, we must be clear on why Wittgenstein resists the procedure you want. For Wittgenstein, a hinge proposition is not a belief you hold; it is a mode of acting.
  *   **OC 94:** "I did not get my picture of the world by satisfying myself of its correctness."
  *   **OC 144:** "The child learns by believing the adult. Doubt comes after belief."

  If hinges are the *scaffolding* of inquiry, you cannot stand on the scaffolding to inspect the scaffolding. To ask for a criterion to choose hinges is to treat them as empirical hypotheses. If you could test them, they wouldn't be hinges; they would be movable parts of the inquiry.

  Therefore, strictly speaking, **there is no procedure for choosing hinges.** They are inherited (OC 144). To think you can choose them is to imagine a "God's-eye view" outside all language games, which Wittgenstein argues is impossible.

  ### 2. A Diagnostic Procedure: Identifying the Hinges
  While you cannot *choose* them from the outside, you can identify them from the inside. You asked for a method to determine which commitments are hinges. Wittgenstein offers a diagnostic test, though it is retrospective.

  **The "Doubt-Collapse" Test:**
  Take a proposition you hold to be certain. Attempt to doubt it seriously.
  *   **Question:** If I doubt this, does the rest of my inquiry lose its sense?
  *   **Example:** If I doubt "The earth has existed for many years," can I still do geology? Can I still read history?
  *   **Result:** If doubting the proposition makes the language game impossible to play (not just difficult, but nonsensical), it is functioning as a hinge.

  This does not tell you if the hinge is *true*, but it tells you its *logical status* in your life. It separates the "riverbed" (OC 96) from the "water" flowing over it.

  ### 3. A Dynamic Procedure: How Hinges Actually Change
  You worry that if hinges are inherited, we are stuck with them. But Wittgenstein acknowledges that riverbeds shift (OC 96–99). Hard rock becomes sand; sand becomes rock. How does this happen without an external criterion?

  **The Friction Method:**
  Hinges are not replaced by argument; they are eroded by practical friction.
  1.  **Internal Incoherence:** Sometimes two hinges conflict. (e.g., A religious hinge vs. a scientific hinge regarding the age of the earth). You cannot resolve this by logic, but the friction forces a re-evaluation of which hinge is more central to your form of life.
  2.  **Practical Failure:** If acting on a hinge consistently leads to a breakdown in your ability to navigate the world (e.g., "I am never in danger" leads to repeated injury), the hinge may soften into a hypothesis and be discarded.
  3.  **Persuasion, not Proof:** When encountering a community with different hinges, you cannot prove them wrong. You can only try to *persuade* them. This involves showing them a new way of living where their old hinges cause friction and new ones offer fluency.

  **Procedure:** Do not argue against the hinge. Argue against the *consequences* of acting on that hinge. Show where the riverbed is blocking the water.

  ### 4. Addressing the Relativism Objection
  Your fear is that this leads to a relativism where "anything goes" and communities are sealed off. Wittgenstein's response (specifically in OC 155 and 612) is nuanced.

  He admits that if someone holds a radically different hinge (e.g., "The earth was created 5 years ago"), we cannot *refute* them logically. But we are not helpless.
  *   **OC 612:** "I am not more certain of the principles of logic than of the fact that that is a hand."
  *   **The Response:** We treat the person not as someone who is *mistaken*, but as someone who is *unintelligible* or *insane* within our form of life.

  This is not a happy solution for the liberal mind, but it is honest. We do not convert people by superior logic; we convert them by acculturation, by drawing them into a form of life where the new hinges work better. The "criterion" for changing hinges is not Truth (with a capital T), but **viability within a shared form of life.**

  ### 5. A Proposed Supplement: The Pragmatic Criterion
  You asked: *"Should I favour the ones that make inquiry most productive, or the ones my community can sustain with the least friction?"*

  Wittgenstein will not answer this, because "productive" implies a goal outside the language game. However, if you are willing to step slightly beyond strict Wittgensteinian exegesis into **Neo-Pragmatism** (Rorty, Putnam, Bernstein), you can supply the normative criterion Wittgenstein withholds.

  **The Hybrid Procedure:**
  1.  **Use Wittgenstein to Identify:** Use the "Doubt-Collapse" test to map your current hinges. Acknowledge they are not knowledge claims.
  2.  **Use Pragmatism to Evaluate:** Once identified, treat them as tools. Ask:
      *   Does holding this hinge expand or contract the scope of future inquiry? (Peirce's "fixation of belief").
      *   Does this hinge increase or decrease the suffering of those within this form of life? (Rorty's "solidarity").
      *   Is this hinge compatible with other hinges I am unwilling to give up? (Reflective Equilibrium).
  3.  **Execute Change via Praxis:** Do not try to "believe" the new hinge. Act *as if* it is true. Engage in the practices that presuppose it. Let the certainty grow from the action, not the other way around.

  ### Summary
  Wittgenstein cannot give you a method for choosing hinges because, on his account, **the chooser is constituted by the hinges.** To ask for a method is to ask to stand outside your own skin.

  However, you are not helpless.
  1.  **Identify** hinges by seeing where doubt renders inquiry nonsensical.
  2.  **Evaluate** them by observing the practical friction they cause in your form of life.
  3.  **Shift** them by adopting new practices, not by seeking new proofs.

  The "relativism" you fear is only a problem if you demand a justification that is independent of human practice. If you accept that justification *ends* in action (OC 204), then the "choice" of hinges is not a logical calculation, but an ethical and practical commitment to a certain way of living. You choose the hinges that sustain the kind of life you wish to lead.
