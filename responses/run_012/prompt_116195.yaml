prompt: |-
  Gödel argued that his rotating-universe solution to Einstein's field equations, which admits closed timelike curves and lacks a global time order, tells against the objective reality of time, and he took this to support an idealist view. Consider the Page-Wootters mechanism, on which the global quantum state of the universe is static and time emerges only as a correlation between a clock subsystem and the rest of the universe. How would Gödel have responded to this proposal? Would he have seen it as confirming his idealism about time, or would he have rejected it as a confusion between the absence of a global time order and the unreality of time? In your answer, distinguish carefully between those two claims.
