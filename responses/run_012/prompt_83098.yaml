      *   **The Incoherence Objection:** Acknowledge it, patch it to "Background Fixed," show it still fails to prove contingency.
      *   **The Measure Objection:** Acknowledge grain sensitivity, argue it defines the *level* of contingency, doesn't destroy the concept.
      *   **Cases:** Calculus (Robust) vs. Specific Battle Outcome (Fragile).
      *   **The Nail:** Reinterpret the rhyme.

  6.  **Writing Phase:** (Mental check of the "Rewind" definition in prompt).
      *   Prompt: "change $e$, hold the rest of the world fixed, see whether $O$ changes."
      *   Problem: If $e$ causes $O$, holding $O$ fixed makes the test impossible. If "rest of the world" means intermediate causes, it's impossible.
      *   Solution: Interpret "rest of the world" as *independent background conditions*.
      *   Wait, the prompt says "hold the rest of the world fixed." I should explicitly call this out as the "Miracle" problem (Lewis-style). I will argue that even if we solve the miracle problem, the test only proves *causation*, not *contingency*.

      *(Self-Correction during drafting)*: I need to make sure I don't get bogged down in Lewisian counterfactuals. Keep it focused on the *historical* implication. The core insight is: **Causation is local; Contingency is global.**

      Let's assemble the argument.

      *   *Thesis:* Contingency is not about whether $e$ caused $O$, but whether the system was poised to produce $O$ regardless of $e$.
      *   *Analogy:* A ball on a hill.
          *   Rewind: Did the push start the roll? Yes.
          *   Re-roll: If the wind blew differently, would it still roll down? Yes.
          *   Conclusion: The roll wasn't contingent on the push, though the push caused it.

      *   *Cases:*
          1.  **Rewind-Fragile / Re-roll-Robust:** The Industrial Revolution. (Arkwright vs. someone else).
          2.  **Rewind-Fragile / Re-roll-Fragile:** The survival of a specific genetic lineage.

      *   *Objections:*
