answer: |-
  The two camps, as fairly as I can put them
  Your caricature is accurate enough for practical purposes. The first camp (Universalist) treats corruption as a pathology of the state: a principal-agent problem where officials betray public trust for private gain, undermining market efficiency and rule of law. It assumes a legitimate state exists to be betrayed. The second camp (Particularist) treats corruption as a category error: a Western label slapped onto embedded social relations like patronage or gift-exchange. They argue these practices often function as informal safety nets or alternative governance structures where the formal state is absent, predatory, or inefficient. The Universalist sees a broken machine needing repair; the Particularist sees a different machine operating on different logic, where "fixing" it might destroy the only functioning social glue. The conflict arises because the first group designs policy for the state they wish existed, while the second describes the state that actually exists.

  What kind of disagreement this is
  Your hypothesis is sharp, not lazy. You've correctly identified that this isn't a single dispute but a layered stack. However, they aren't fully separable; they feed each other. (a) is definitely in play. "Corruption" is a "thick concept"—it describes and evaluates simultaneously. You can't strip the moral judgment from the description without changing the subject. When the economist says "corruption," they mean "bad deviation." When the anthropologist says "not corruption," they mean "functional norm." They aren't using the same ruler.

  (b) is also correct. One side explains systemic outcomes (growth, stability); the other explains local meaning (obligation, survival). They are talking past each other because they optimize for different variables. The economist wants to maximize GDP; the anthropologist wants to maximize social cohesion. A practice can be good for cohesion and bad for GDP. Both can be right simultaneously, but policy cannot serve both masters if they conflict. This means a policy successful by one metric is a failure by the other. Reducing patronage might boost investment (economist win) but destroy safety nets (anthropologist loss). Neither side is wrong about the consequence; they disagree on which consequence matters.

  (c) is the trap. Both sides claim empirical backing, but the data is theory-laden. You cannot test "does corruption hurt growth" without first defining corruption. If you define it via Western indices, you will find it hurts growth. If you define it via local welfare, you might find it helps survival. The data doesn't speak; the definition speaks.

  (d) is the load-bearing wall. This is the normative core: Who has the authority to define the practice? The Universalist argues some acts are objectively corrosive to human flourishing regardless of local justification. The Particularist argues legitimacy is endogenous; if the community accepts it, it isn't corruption. The reason the debate stalls is that (d) dictates (a) and (c). If you believe insiders define reality, you cannot accept external indices as valid evidence. If you believe universal standards exist, insider accounts look like rationalizations. The empirical question (c) cannot resolve the normative one (d). You can test whether bribes speed up services, but that doesn't tell you if the system is *just*. The disagreement persists because both sides are right within their own ontological frameworks, but neither framework can prove itself superior without begging the question. The economist assumes the state *should* be impersonal; the anthropologist assumes the state *is* relational. Until you admit you're arguing about political philosophy, not data, you won't move. The strands are distinct analytically, but practically inseparable because the normative stance determines which data counts as evidence. For an engineer, this looks like a bug in the specification. You want to isolate the variable. But here, the variable is the specification. Separating them helps diagnose why the conversation fails, but it doesn't solve the conflict. You can acknowledge (a) and (b) are distinct, but until you resolve (d), you cannot build a shared metric. The economist will reject the anthropologist's data as anecdotal; the anthropologist will reject the economist's data as imperialist. They aren't failing to understand each other; they understand each other perfectly and reject each other's premises. Your hypothesis holds up because it reveals the stack, but the stack doesn't unstack itself. The normative disagreement bleeds into the empirical because social science data is never raw; it is always cooked by theory. Recognizing this doesn't end the fight, but it stops you from pretending data will settle it.

  Is the evidence contaminated
  Yes, your suspicion is methodologically sound. Most high-profile indices (like Transparency International's CPI) measure perceptions, not incidence. They survey business elites and country experts who largely share the Universalist framework. This creates a circularity: the data confirms the bias of the people surveyed. If you define corruption as "deviation from Weberian bureaucracy," then any relational practice looks like corruption. If you define it as "violation of local norms," many bribes look like standard fees. By aggregating expert perceptions, you aren't measuring the phenomenon; you're measuring the consensus of a specific class of outsiders about the phenomenon. Your pipeline wasn't wrong; the inputs were theoretically loaded. You built a machine that processes assumptions as facts. The "objective" data is actually subjective judgment quantified. This explains why the debate never moves: both sides are arguing over numbers that were generated by their own opposing definitions. You cannot find common ground on a map drawn by only one side.

  What would count as progress
  Progress requires dismantling the word "corruption" entirely. Stop pretending it's a single debate. We need distinct concepts: "Predatory Extraction" (stealing public funds) versus "Reciprocal Facilitation" (greasing wheels to bypass bad rules). The former is almost universally harmful; the latter is context-dependent. A better index wouldn't fix this; it would just refine the bias. Instead, shift to harm-based metrics. Don't ask "Is this corruption?" Ask "Did this transaction reduce public welfare?" or "Did this bypass a legitimate rule?" Experiments can help, but only if they stop testing "corruption" and start testing specific mechanisms. Randomized control trials can isolate specific interventions, but they must avoid the label. Measure service delivery times, not corruption levels. Measure resource leakage, not governance scores. This bypasses the definitional fight by focusing on tangible outputs. If a bridge collapses, it doesn't matter if the payment was a 'gift' or a 'bribe'; the outcome is failure. Focus on outcome variance. The honest answer is that these are two different questions wearing one word. The useful move is to stop trying to reconcile them into a single metric. Policy needs to know if money is vanishing (Universalist concern); Sociology needs to know how people survive (Particularist concern). Treat them as separate datasets that occasionally overlap, not competing truths. Build pipelines that flag specific behaviors rather than assigning a moral score to a nation.

  Bottom line
  You're right: this is political philosophy disguised as data science. The disagreement is normative, not empirical. Stop trying to merge the datasets. Separate "theft" from "social obligation," measure specific harms instead of abstract corruption, and admit that your pipeline measures perceptions, not reality. Your analysis will be clearer.
