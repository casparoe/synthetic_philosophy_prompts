answer: |-
  **Final Exam Question**

  Consider Ilse and Roderick, both disposed to protect friends. When threatened, Ilse's implant deletes the history of trust constituting her attachment; she does nothing. Roderick's implant leaves attachment intact but floods him with terror; he does nothing. Externally, their counterfactual profiles are identical. (i) Argue whether each retains the disposition during the threat. (ii) Explain what grounds the fink/mask distinction here if counterfactuals cannot. (iii) Propose a refinement to the counterfactual analysis of dispositions that accommodates your verdict, and describe one new case where your refinement fails.

  ***

  **Model Answer**

  Ilse lacks the disposition during the threat, whereas Roderick retains it. Ilse's case is properly classified as finkish, while Roderick's is masked. The standard counterfactual analysis (SCA) fails here because both agents fail the simple conditional: 'If the friend were threatened, they would protect them.' Since the counterfactual profiles are stipulated as identical from the outside, behavioral outcomes cannot ground the distinction. We must instead appeal to the metaphysics of the disposition's categorical base.

  For Ilse, the history of trust is not merely a cause of her attachment but partly constitutes it. Character traits are often historical entities; removing the history removes the trait. By deleting this history, the device destroys the categorical base of the disposition itself precisely when the stimulus arrives. This is the definition of a fink: the removal of the disposition upon stimulation. For Roderick, the attachment (the base) remains intact. The terror is an additive interference that prevents the manifestation without altering the base. He is masked. The ground for this verdict is ontological: it depends on whether the mechanism alters the constitutive properties of the trait or merely obstructs their expression. Since counterfactuals supervene on these underlying facts, identical counterfactual profiles do not entail identical dispositional statuses. The SCA is false because it ignores the persistence of the base.

  To rescue the analysis, we must refine SCA to reference the causal base explicitly, following David Lewis. A revised analysis states: $x$ is disposed to $M$ if $S$ iff $x$ has an intrinsic base $B$ such that, if $S$ occurred and $B$ persisted through the stimulus interval, $x$ would $M$. This handles Ilse because her base $B$ does not persist; the antecedent 'B persisted' is false, so the conditional does not falsely attribute the disposition. It handles Roderick because $B$ persists. However, we must also add a 'no interferers' clause to account for the terror, or acknowledge that the base + stimulus nomically necessitates manifestation only in ideal conditions.

  However, this base-relative refinement mishandles cases of mimics. Consider a 'fragile' glass made of sturdy material but governed by a demon who breaks it when struck. It lacks the intrinsic base of fragility (molecular structure), yet satisfies the counterfactual 'if struck and base persisted, it would break' if the demon's action is counted as part of the scenario, or if the demon ensures the base *appears* to persist. More critically, this refinement excludes legitimate extrinsic dispositions. If a key's disposition to open a lock depends on the lock's internal structure (an extrinsic base), requiring an *intrinsic* base falsely denies the disposition. Thus, anchoring dispositions strictly to intrinsic bases solves the fink/mask problem but excludes legitimate extrinsic dispositions or fails to rule out mimics who satisfy the counterfactual without the true base. The metaphysics of character traits therefore resists reduction to simple counterfactuals plus intrinsic bases, requiring a more nuanced causal theory that accounts for constitution without falling prey to mimicry.

  ***

  **Marking Scheme**

  | Move | Marks | Differentiation (How a B-answer typically fails) |
  | :--- | :--- | :--- |
  | **1. Verdict on Ilse** | 4 | B-answers claim she retains the disposition because she normally protects, missing the constitutive loss. |
  | **2. Verdict on Roderick** | 4 | B-answers claim he loses the disposition because he fails to act, conflating manifestation with possession. |
  | **3. Grounding Distinction** | 4 | B-answers rely on behavioral differences or intent rather than the metaphysics of the base/constitution. |
  | **4. Refinement Proposal** | 4 | B-answers propose standard SCA tweaks (e.g., "ideal conditions") without referencing the persistence of the base. |
  | **5. Counterexample** | 4 | B-answers offer a case that the refinement actually solves, or fail to explain why it breaks the refinement. |
