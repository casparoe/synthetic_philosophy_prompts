answer: |-
  ### Session Plan: The Mechanics of Conceptual Slippage
  **Time:** 90 Minutes
  **Audience:** Cognitive Science Grads + Programmers
  **Goal:** Move slippage from "error" to "licensed adaptation."

  ---

  ### 1. Dependencies and Order of Ideas
  You cannot teach slippage as a definition; it must be experienced as a resolution to tension. The room must traverse this specific dependency chain:

  1.  **Rule Stability:** They must believe the system is closed and deterministic (Programmers) / rule-governed (CogSci).
  2.  **Descriptive Ambiguity:** They must discover that a single transformation supports multiple valid *descriptions* (not just rules).
  3.  **Mapping Pressure:** They must encounter a target where the primary description *fails* or produces a "garden path" result.
  4.  **Licensed Adaptation:** They must see that changing the description preserves the *spirit* of the rule better than following the *letter*.

  **What to Withhold:**
  *   **Do not define "Conceptual Slippage"** until minute 60. Before then, it is "re-description" or "alternative mapping." If you name it early, they will treat it as a vocabulary term to memorize rather than a cognitive event to experience.
  *   **Do not validate any answer** in the first 40 minutes. Your silence is the pressure chamber.

  ---

  ### 2. Evaluation of Your Carrying Puzzle
  **Verdict:** The puzzle buckles under the weight you are putting on it.

  **Why:**
  In your source ($P-S-R \to P-S-B$), the change is indeed Rightmost and Largest.
  In your target ($B-R-S$), the Rightmost is $S$ and the Largest is $B$.
  *   **Literal Reading ("Promote Rightmost"):** Yields $B-R-R$. This is a valid move in your domain.
  *   **Slipped Reading ("Promote Largest"):** Yields "Promote $B$." Since $B$ is max grade, this move is **illegal**.

  **The Problem:** Because the literal reading ($B-R-R$) is legal and obvious, the room will not feel the *pressure* to slip. They will solve it literally and go home. Slippage is not about having options; it is about being *forced* to abandon the obvious option because it breaks.

  **The Fix:**
  You need a **Crunch Target**. Keep your Source. Replace your Target with one where the literal reading crashes.
  *   **New Target:** $S-R-B$ (Rightmost is Boulder).
  *   **Literal Rule ("Promote Rightmost"):** Attempt to promote $B$. **Illegal.** System crashes.
  *   **Slipped Rule ("Promote Largest" $\to$ "Promote Leftmost" OR "Demote Rightmost"):** Now they must slip to find a legal move that preserves the "gist."

  *Recommendation:* Run your original target ($B-R-S$) first to establish ambiguity. Then introduce the Crunch Target ($S-R-B$) to force the slip. Do not skip this step.

  ---

  ### 3. Sequence of Readings (Source Pair)
  When you present $P-S-R \to P-S-B$, the room will generate readings in this order. You must manage them as follows:

  1.  **"Change Rock to Boulder."** (Object-specific)
      *   *Handling:* Mark as **Overfitting**. Ask: "What if there were no Rock?" Discard.
  2.  **"Promote the Rightmost."** (Positional)
      *   *Handling:* **Endorse as Literal.** This is the baseline. Write it on the board.
  3.  **"Promote the Largest."** (Relational/Magnitude)
      *   *Handling:* **Endorse as Equivalent.** Note that in the Source, Rightmost = Largest. This is the seed of the slip.
  4.  **"Complete the Ascending Sequence."** (Structural)
      *   *Handling:* **Keep in Reserve.** This is a higher-order slip. Use only if they solve the Crunch Target too easily.

  **Critical Move:** At minute 30, explicitly state: "In the Source, Reading 2 and Reading 3 are identical. In the Target, they may diverge."

  ---

  ### 4. Misconceptions and Defusal Points
  You anticipated three specific misconceptions. Here is exactly when and how to defuse them.

  **A. "Slippage is Sloppiness"**
  *   **When:** Minute 65 (Immediately after they propose a slipped answer for the Crunch Target).
  *   **Defusal:** Do not argue. Draw the structure. Show that the *relation* (Largest $\to$ Next) was preserved, even if the *slot* (Rightmost) changed. Say: "Sloppiness breaks the structure. Slippage preserves the structure by shifting the anchor."

  **B. "There Is One Correct Answer"**
  *   **When:** Minute 25 (During the Source analysis).
  *   **Defusal:** When a programmer asserts "It's obviously the rightmost," ask the CogSci students: "Is it?" Let them fight. Do not resolve it. Let the ambiguity sit. The discomfort is necessary fuel for later.

  **C. "If Two Answers Work, Anything Goes"**
  *   **When:** Minute 75 (During the Licensing discussion).
  *   **Defusal:** Present a **Bad Slip**. Example: For $S-R-B$, someone suggests "Reverse the row." It is legal, but it ignores the "Promote" gist. Say: "This is arbitrary. It obeys the moves but ignores the *analogy*. A slip must be *pressured* by the target and *justified* by the source."

  ---

  ### 5. The Trade-Off (Feel, Don't Hear)
  At minute 80, you must make them feel the cost of the system.
  *   **System A (Never Slips):** It crashes on the Crunch Target ($S-R-B$). It is safe, but brittle. It cannot handle edge cases.
  *   **System B (Slips at Will):** It solves the Crunch Target, but it requires cognitive energy to justify the re-description. It risks "drift" (answering $P-S-R \to P-S-B$ with "Paint them blue").
  *   **The License:** A slip is licensed only when:
      1.  The literal mapping fails (Pressure).
      2.  The slipped mapping preserves the deep relational structure (Justification).
      3.  The slip is minimal (don't change "Promote" to "Demote" unless you have to).

  ---

  ### 6. Final Assessment Question
  Do not ask them to define slippage. Ask them to judge a case.

  **The Question:**
  > "Source: $P-P-S \to P-P-R$ (Rightmost promoted).
  > Target: $B-B-P$.
  > Candidate Answer 1: $B-B-R$ (Literal: Promote Rightmost).
  > Candidate Answer 2: $R-B-P$ (Slipped: Promote Smallest/Leftmost).
  >
  > Which answer is a **licensed slip** and which is a **literal application**? Justify your choice based on *pressure*, not preference."

  **What to look for:**
  *   **Pass:** They identify that Candidate 1 is literal and Candidate 2 is a slip, *but* they note that Candidate 1 does not fail (no pressure), so Candidate 2 is actually *arbitrary*, not a licensed slip. (The trick: There is no pressure to slip here, so the slip is unjustified).
  *   **Fail:** They choose Candidate 2 because it feels "clever," ignoring the lack of pressure.

  ---

  ### 7. What to Leave Out
  You have 90 minutes. You must explicitly state what you are excluding to prevent "scope creep" questions.

  **Say this at Minute 5:**
  > "We are treating the mind as a functional system today. I am leaving out three things deliberately:
  > 1.  **Neural Implementation:** We will not discuss how neurons weight these probabilities.
  > 2.  **Truth Conditions:** We are not asking if the answer is 'true' in the world, but if it is 'coherent' in the system.
  > 3.  **Learning:** We are not discussing how the system learns new grades of stone. The ontology is fixed.
  >
  > If you have questions in those domains, park them. We are focusing strictly on the *moment of mapping*."

  ---

  ### Summary of Timeline
  *   **00-05:** Intro & Exclusions (The "Leave Out" statement).
  *   **05-20:** Domain Training (Ensure rules are internalized).
  *   **20-40:** Source Analysis (Elicit Ambiguity: Rightmost vs. Largest).
  *   **40-50:** Original Target ($B-R-S$) (Show literal works, ambiguity remains).
  *   **50-60:** **Crunch Target ($S-R-B$)** (Literal crashes. Force the slip).
  *   **60-70:** Define Slippage (Now they feel it). Distinguish from Sloppiness.
  *   **70-80:** The Trade-Off (Rigidity vs. Justification Cost).
  *   **80-90:** Final Assessment Question & Debrief.
