answer: |-
  # Lesson Plan: The Money Pump & The Slippery Slope
  **Course:** 300-Level Seminar on Rational Choice  
  **Session:** 90 Minutes  
  **Students:** 16  
  **Goal:** Visceral experience of preference intransitivity (Money Pump) and marginal drift (Sorites Pump), followed by a normative debrief on rationality and exploitability.

  ---

  ## I. Materials & Setup

  ### 1. The "Prizes" (The Cycle)
  You need 16 sets of three items. They must be sealed in identical opaque envelopes or boxes so only the *stats* matter, not the visual appeal.
  *   **Item A:** Gourmet Chocolate Bar (e.g., Lindt)
  *   **Item B:** Exotic Tea Sampler (e.g., Pukka)
  *   **Item C:** Spicy Jerky Stick (e.g., Jack Link's)
  *   **Labeling:** Mark the envelopes **A**, **B**, and **C**.
  *   **Distribution:** Every student starts with **Item A** in hand.

  ### 2. The Spec Sheets (The Trap)
  Hand out a card with each item. The card lists three attributes rated 1–10. **Crucial:** Instruct students that they *must* use the "Majority Rule" to determine preference. (This simulates a multi-criteria decision process that violates transitivity).

  **The Matrix (Print this on the cards):**
  *   **Item A:** Taste (10), Health (2), Prestige (5)
  *   **Item B:** Taste (6), Health (9), Prestige (2)
  *   **Item C:** Taste (2), Health (5), Prestige (10)

  *Logic Check:*
  *   **A vs B:** Taste (A), Health (B), Prestige (A). **A wins 2-1.**
  *   **B vs C:** Taste (B), Health (B), Prestige (C). **B wins 2-1.**
  *   **C vs A:** Taste (A), Health (C), Prestige (C). **C wins 2-1.**

  ### 3. The Currency (The Pain)
  *   **Tokens:** Poker chips or printed tickets.
  *   **Endowment:** Give each student **20 Tokens** at the start.
  *   **Value:** Announce a raffle at the end.
      *   10+ Tokens = 5 Raffle Tickets (Prize: $50 Amazon Gift Card).
      *   5–9 Tokens = 2 Raffle Tickets.
      *   0–4 Tokens = 0 Tickets (You cannot enter).
  *   **Cost:** Every trade costs **1 Token**.

  ### 4. The Broker (You or a TA)
  *   Wear a badge or stand at a "Trading Desk."
  *   You are not an adversary; you are a *market mechanism*. You are helpful, polite, and purely facilitative.

  ---

  ## II. Timeline (90 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00–10** | **Setup & Endowment** | Distribute items, tokens, spec sheets. Explain the "Majority Rule" protocol. |
  | **10–35** | **Round 1: The Money Pump** | Broker circulates. Students trade A→B→C→A. |
  | **35–50** | **Round 2: The Escalation Pump** | "The Discomfort Ladder" (Physical/Status drift). |
  | **50–80** | **Debrief & Theory** | Map experience to transitivity, dominance, and rationality. |
  | **80–90** | **Payout & Wrap** | Raffle draw. Final philosophical note. |

  ---

  ## III. Round 1: The Money Pump (Script)

  **Instructions to Students:**
  "You hold Item A. You have 20 Tokens. You may trade your current item for another if you prefer it. To determine preference, compare the two items' Spec Sheets. If an item scores higher on 2 out of 3 attributes, you *should* prefer it. Each trade costs 1 Token, paid to the Broker. You may trade as many times as you like. Keep your items sealed."

  **The Broker's Script (Circulate among students):**
  *   *Approach Student:* "Hi, I see you're holding **A**. I happen to have **B** available."
  *   *The Hook:* "Let's look at your sheets. B beats A on Health (9 vs 2) and Prestige (2 vs 5)... wait, no, A beats B on Prestige. But B beats A on Health. And A beats B on Taste. Actually, looking at the Majority Rule: **A beats B**. Okay, my mistake."
  *   *Correction (Wait for them to hold B):* "Oh, I see you traded for **B** already. Great choice. But look, I have **C**. C beats B on Health and Prestige. That's 2 out of 3. By your own rules, C is better than B. Want to swap? Just 1 Token."
  *   *The Close:* "Now you have **C**. But wait... look at **A** again. A beats C on Taste and Health. That's 2 out of 3. You're holding an inferior asset. I can get you back to A. It's clearly the rational move. Just 1 Token."

  **Goal:** Walk them A → B → C → A. They end with their original item but minus 3 Tokens. Repeat if they are eager.

  ---

  ## IV. Round 2: The Escalation Pump (Script)

  **Goal:** Distinguish *cyclic* irrationality from *marginal* drift (Sorites/Slippery Slope).
  **Setup:** No items. This is about status/comfort vs. tokens.

  **Instructions:**
  "Reset your token count to 20. This round is about your physical comfort. You start in your chair. I will offer you sequential upgrades to your 'Status' for 1 Token each. You can accept or decline."

  **The Ladder:**
  1.  **Offer 1:** "Stand up for 30 seconds. Reward: 1 Token." (Most will do it).
  2.  **Offer 2:** "Stand up, take off shoes. Reward: 1 Token." (Low cost).
  3.  **Offer 3:** "Stand, no shoes, hold arms out. Reward: 1 Token." (Annoying).
  4.  **Offer 4:** "Stand, no shoes, arms out, hum loudly. Reward: 1 Token." (Embarrassing).
  5.  **Offer 5:** "Stand, no shoes, arms out, hum, balance on one leg. Reward: 1 Token." (Painful).

  **The Trap:** Each step is a "small cost for small gain." But the *cumulative* state (Step 5) is vastly worse than Step 0, likely not worth 5 Tokens.
  **Stop Condition:** When a student refuses, ask them *why*. "You accepted Step 3. Step 4 is only marginally harder. Why stop now?"

  ---

  ## V. The Debrief (50–80 Minutes)

  Do not let them leave until you map the experience to the theory. Use the whiteboard.

  ### 1. Mapping the Money Pump (Intransitivity)
  *   **Ask:** "Who ended up with Item A but fewer tokens than they started with?" (Show of hands).
  *   **Ask:** "At the moment you made each trade, did you feel you were making a mistake?" (Likely no).
  *   **The Theory:** Write **Transitivity** on the board: *If A ≻ B and B ≻ C, then A ≻ C.*
  *   **The Violation:** "You voted for A over B, B over C, and C over A. You didn't have a preference order; you had a preference *cycle*."
  *   **The Consequence:** "The Money Pump Argument says: If your preferences cycle, you are *exploitable*. You will pay to go in a circle. Rationality requires transitivity to prevent wealth leakage."

  ### 2. Mapping the Escalation Pump (Drift)
  *   **Ask:** "Did your preferences cycle in Round 2?" (No).
  *   **The Theory:** Write **Marginal Indiscrimination**.
  *   **The Violation:** "You preferred Step 1 to Step 0. Step 2 to Step 1. But you prefer Step 0 to Step 5."
  *   **The Distinction:** "Round 1 was a logic error (cycle). Round 2 was a calibration error (drift). Round 1 proves you can be pumped *instantly*. Round 2 proves you can be pumped *over time*."

  ### 3. The "Refuser" Objection (Crucial Segment)
  *   **Scenario:** Address the student who didn't trade in Round 1.
  *   **Student Claim:** "I saw the cycle. I stayed put. I didn't lose tokens. I was rational."
  *   **Instructor Counter-Argument 1 (The Disposition):** "You were rational *this time* because the trap was visible. But rationality is about your *disposition*. If I hid the fact that C leads back to A—if I told you C was a 'limited edition'—would you have traded? If your mind is capable of holding the cycle, a smarter broker will get you next time."
  *   **Instructor Counter-Argument 2 (Dominance):** "At the moment you held C, your own spec sheet said A was better (2 out of 3 attributes). By refusing to trade back to A, you violated the **Dominance Principle**. You knowingly held an inferior option to avoid a fee. Is it rational to pay a fee to violate your own current preference?"
  *   **The Hard Truth:** "Some philosophers (e.g., Gustafsson) argue that if you can foresee the pump, you are permitted to break transitivity *in this instance* to save your wallet. But that means rationality isn't just about preferences; it's about *strategic self-binding*. You had to treat your future self as an enemy."

  ### 4. Exploitability vs. Irrationality
  *   **Discussion:** "Is being pumpable the *definition* of irrationality?"
  *   **Point:** "If I love rock music, and you charge me $1 to switch to jazz, and I love jazz more, I pay. If I love rock more, I don't. If I cycle, I pay forever. Exploitability is the *test* of inconsistency."
  *   **Caveat:** "But in the real world, brokers cost money too. If it costs the Broker more to find me than they can pump from me, I survive. Does that make me rational? No, it makes me *lucky*."

  ---

  ## VI. Troubleshooting: What Will Go Wrong

  **1. The "I Hate Jerky" Problem**
  *   *Risk:* A student values Item A (Chocolate) intrinsically so much that the Spec Sheet stats don't matter. They won't trade A for B even if B wins on stats.
  *   *Fix:* In the intro, emphasize: "This is a game about the **numbers on the card**, not your personal taste. Pretend you are an agent maximizing the score." If they still refuse, ask them during debrief: "Was your preference based on the attributes or the object? If the object, the pump doesn't apply to you, but your preferences aren't representable by these attributes."

  **2. The "Refuser" who ruins the vibe**
  *   *Risk:* One vocal student says "This is stupid" and doesn't play, influencing others.
  *   *Fix:* Pre-empt this. "Some of you will spot the trap. Your job is different: Track *why* you spotted it. Was it the math? The tokens? You are the control group." Validate their skepticism so they don't feel the need to disrupt.

  **3. Token Inflation**
  *   *Risk:* Students don't care about the tokens.
  *   *Fix:* The raffle prize must be real. Bring the $50 Gift Card to class and put it on the desk. Make the "0 Tokens = No Entry" rule strict.

  **4. The Broker (You) moves too fast**
  *   *Risk:* You offer the C→A trade before they've psychologically committed to C.
  *   *Fix:* Wait for them to open the C envelope. Let them feel the "ownership" of C. Then point out A is better. The pain comes from giving up something you *just* acquired.

  ---

  ## VII. Limitations (Instructor's Note)

  *Be honest with them about what this activity fails to capture.*

  1.  **Transaction Costs:** In the real world, trading isn't free (time, effort). The Money Pump assumes a frictionless market. In reality, friction protects us from pumps.
  2.  **Learning:** The pump assumes you never learn. In Round 1, if you trade A→B, you might learn that B is actually worse than A despite the stats. Real agents update.
  3.  **The "Resolute Choice" Defense:** Mention that some theorists (e.g., McClennen) argue you can be rational with cyclic preferences if you commit to a *plan* ("I will never trade") rather than maximizing *locally* at every step. This activity forces local maximization.
  4.  **Emotional Utility:** The "pain" of losing tokens is part of the utility function. If a student enjoys outsmarting the broker more than they want the tokens, they aren't being pumped; they are consuming "intellectual victory."

  ---

  ## VIII. Closing Script (88–90 Minutes)

  "Today you paid to spin in a circle. You felt the irritation of the fee. That irritation is the economic signature of inconsistency.
  Next week, we read Davidson. He argues that without transitivity, we can't even *interpret* you as an agent. Today, you proved him wrong—you were agents, you just got robbed.
  Your homework: Find a real-world example where you see others getting money-pumped. Not snacks. Politics? Relationships? Career paths? Bring the cycle to class.
  Collect your tokens. Raffle draw is now."
