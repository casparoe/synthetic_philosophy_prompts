answer: |-
  Your intuition is running a sophisticated, hybrid algorithm. It is not following a single simple rule like "maximize expected value" or "follow the most probable view." Instead, you are applying **two distinct filters** depending on whose interests are at stake and the *epistemic nature* of the claim.

  Here is the diagnosis of your moral operating system, the principle that captures it, and the inconsistency you need to resolve.

  ### The Principle: Epistemically-Constrained Risk-Weighted Maximization

  You are effectively following two sub-rules that function as one system:

  1.  **Interpersonal Precaution (Cases 1, 2, 5):** When the decision risks harm to *others* (animals, friends), you are **risk-averse**. You do not "gamble" with their interests even if the expected value calculation is close or slightly positive. You treat the possibility of harm as having disproportionate weight.
  2.  **Intrapersonal Maximization with an Epistemic Filter (Cases 3, 4):** When the decision primarily concerns your own life path or metaphysical stakes, you **maximize expected value**, *but* you apply a heavy discount to claims that rely on non-empirical or coercive metaphysics (Pascal's Wagers).

  #### How this explains your cases:
  *   **(1) Meat & (5) Fish:** *Interpersonal Precaution.* Even though you aren't 100% sure animals matter, the stakes (suffering/death) are high enough that you refuse to gamble on their behalf. You default to the "safe" option for *them*.
  *   **(2) Promise:** *Interpersonal Precaution.* Even though the math (55/45) suggests breaking the promise might be net positive, you refuse to use your friend's trust as a chip in your moral uncertainty lottery.
  *   **(3) Transfusion:** *Epistemic Filter.* This is a "Pascal's Wager" scenario (low probability, infinite negative stake). You reject it because the mechanism (eternal torment via religious rule) is metaphysical and non-falsifiable. You prioritize the empirical certainty (health) over the metaphysical threat.
  *   **(4) Long-termism:** *Intrapersonal Maximization.* This is a "Pascal's Mugging" scenario (low probability, astronomical positive stake). You accept it because the mechanism (future people existing) feels empirical/logical rather than supernatural, and it frames itself as an opportunity rather than a threat.

  ---

  ### The Inconsistency: Case (3) vs. Case (4)

  You identified the pain point: **(3) and (4) are structurally identical, but you treat them oppositely.**

  *   **Case (3):** 1% credence $\times$ Infinite Negative Stake (Hell). Verdict: Ignore.
  *   **Case (4):** 1% credence $\times$ Astronomical Positive Stake (Future Value). Verdict: Obey.

  To be logically consistent, you cannot treat low-probability astronomical stakes as decisive in one direction but dismissible in the other, unless you can rigorously defend the **Epistemic Filter**.

  *   **If you keep the Epistemic Filter:** You must argue that "Future Value" is an empirical claim (based on population dynamics, technology) while "Eternal Torment" is a metaphysical claim (based on revelation). If you accept this distinction, your current behavior is consistent.
  *   **If you reject the Epistemic Filter:** You are being inconsistent. If you dismiss the 1% religious threat because 1% is too low for such huge stakes, you must also dismiss the 1% long-termist demand. Conversely, if you accept the 1% long-termist demand because the stakes are huge, you logically ought to fear the 1% religious threat.

  ### Which verdict must you give up?

  To achieve consistency without adopting religious fear, **you must dampen your response to Case (4).**

  This is the standard resolution to **Pascal's Mugging**. If you allow 1% credence in astronomical stakes to dictate your life in Case (4), you open yourself to any theory that posits infinite stakes (Case 3, or alien simulations, etc.). The only robust defense is to say: *"I do not let low-probability, high-stakes claims dominate my decision-making unless the evidence is proportionally strong."*

  Since your evidence for Long-termism (philosophical argument) is not significantly stronger than your evidence against the Church (historical/sociological argument), you should treat them similarly. **You should live your life mostly according to the 99% view in both cases.**

  **Consistent Verdict:** Continue taking the transfusion (Case 3), but also stop feeling bad about not dedicating your life to the long-term future (Case 4). Treat the 1% view as a "tie-breaker" only, not a life-director.

  ---

  ### Coping with Incommensurable Scales

  You asked how to compare scales that don't line up (e.g., "eternal torment" vs. "animal suffering"). Your gut is currently using **Normalization**, but you need to make it explicit to handle new cases.

  **The Rule of Normalized Voting:**
  Do not compare the raw "utility" numbers different theories propose (e.g., $-\infty$ vs $-10$). Instead, normalize each theory's scale from 0 (worst outcome that theory recognizes) to 1 (best outcome that theory recognizes).
  *   **Theory A (Secular):** Best = Happy Life, Worst = Death.
  *   **Theory B (Religious):** Best = Heaven, Worst = Hell.
  *   **Decision:** You vote based on your credence in the *theories*, not the magnitude of their *claims*.

  **How this handles unlisted cases:**
  *   **Climate Change:** (99% credence it matters, stakes are huge). Normalized value is high. **Action:** Aggressive mitigation.
  *   **Alien Gods:** (0.0001% credence they exist and want sacrifices). Normalized value is irrelevant because credence is below your "Epistemic Threshold." **Action:** Ignore.
  *   **AI Safety:** (10% credence of existential risk). This sits between (3) and (4). It is empirical (like 4) but threatening (like 3). **Action:** Your principle suggests taking it seriously (unlike 3) because it is empirical, but not letting it totally consume you if the probability remains low (unlike 4's current hold on you).

  ### Summary of Your Moral Algorithm

  If you want to codify your gut into a rule you can trust, use this:

  > **"Minimize risk of harm to others whenever possible (Precautionary Principle). For decisions regarding your own life path, maximize expected value based on empirical probabilities, but cap the influence of any single theory that relies on non-falsifiable astronomical stakes (Anti-Mugging Constraint)."**

  **To be consistent:** You must admit that Case (4) currently violates the "Anti-Mugging Constraint" you successfully applied in Case (3). You should reduce the guilt you feel in (4) to match the indifference you feel in (3).
