answer: |-
  In a chronic pain clinic, two patients, Mara and Sam, must be assigned one of two treatment plans, with the lexical threshold for suffering set at pain level 8 on a 0–10 scale. Plan Alpha assigns Mara 9 units of pain and Sam 1 unit, totaling 10 units of suffering, but yields 101 units of pleasure due to slightly higher clinic efficiency. Plan Beta assigns Mara 5 units and Sam 5 units, also totaling 10 units of suffering, but yields only 100 units of pleasure. The extra unit of pleasure in Alpha is negligible, perhaps amounting to five minutes of extra comfort for each patient, and the total suffering is identical across both options, differing only in how the pain is distributed relative to the threshold line.

  (1) The threshold view strictly prefers Plan Beta. The triggering feature is the distribution of suffering: Mara's level 9 pain in Plan Alpha crosses the lexical threshold of 8, rendering that specific instance of suffering inviolable. No amount of pleasure, including the sliver offered in Alpha, can outweigh a single unit of supra-threshold pain, so Alpha is morally forbidden despite its efficiency. (2) The additive view weakly prefers Plan Alpha. It sums pleasure and pain on a common scale: Alpha nets 91 (101 pleasure - 10 pain) while Beta nets 90 (100 pleasure - 10 pain). The margin is razor-thin—a single unit of pleasure decides the case—but since the total pain is identical, the extra pleasure dictates the choice. (3) Now shift Mara's pain in Plan Alpha from 9 to 7.9 (adjusting Sam's to 2.1 to keep the total at 10). The additive view's ranking doesn't budge; Alpha still nets 91 versus Beta's 90. However, the threshold view's verdict flips instantly. Because 7.9 is below the line, the lexical veto vanishes, and the view reverts to trading off sums. With equal pain sums, the extra pleasure makes Alpha strictly better. A 0.1 shift in clinical assessment changes the moral verdict from "forbidden" to "required," exposing a massive discontinuity in the theory. (4) Honestly, the case only works because you stipulated where the line is; without an objective natural kind distinguishing 7.9 from 8.1, the threshold looks like an arbitrary cliff edge smuggling in a deontological constraint under consequentialist clothing. A defender of the additive view would attack this by arguing for continuity: if 8.1 is bad, 7.9 is nearly as bad, and no tiny phenomenological difference should authorize an infinite jump in moral weight. They would defuse the case by insisting that marginal changes in pain must yield only marginal changes in value, rendering the lexical threshold irrational and unstable.
