      *   *No Citations?* Yes.
      *   *Honesty in Reasons?* Yes (distinguishing "just" from "unproven").

  7.  **Refining the Tone:**

      *   Needs to sound like a philosopher advising an administrator, but the output is the *procedure* itself and the *analysis*.
      *   Avoid academic jargon where possible in the procedure, keep it in the analysis.
      *   Ensure the distinction between "historical" and "patterned" is clear.

  8.  **Self-Correction/Nuance Check:**

      *   *Rectification:* Nozick admits rectification is the weakest link. I need to be honest that the procedure will likely fail here without making things up.
      *   *Hardship:* The statute mandates considering hardship. Entitlement theory generally treats rights as side-constraints that cannot be violated for general welfare. This is a hard conflict. I must advise the Chair that following the statute means violating the pure theory.
      *   *Case 1 (Duress):* If the land was sold to innocent third parties, does the injustice persist? Entitlement theory says yes, title was void. But rectification is tricky. I will have the procedure recommend restitution *in principle* but flag the compensation of the innocent buyer as a Board decision (evaluative).
      *   *Case 2 (Distribution):* This must be the "Denial." The procedure must show *why* it denies (voluntary transfers).
      *   *Case 3 (Acquisition):* Keep it brief as requested. Focus on the Proviso.

  9.  **Final Polish:** Check the "Honesty" constraint. The written reasons must say "We cannot prove injustice" not "The holding is just." This is crucial for the "absence of evidence" sections.

