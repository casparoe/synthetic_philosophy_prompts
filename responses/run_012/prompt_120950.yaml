      *   *Substitution:* When we use "rough and ready" rules for missing evidence, are we still doing entitlement theory? No, we are doing administrative pragmatism.

  6.  **Review against Constraints:**

      *   *Visible Preliminary Work?* Yes.
      *   *Numbered Procedure?* Yes.
      *   *Evidence/Stopping Points?* Yes.
      *   *Judgment Calls Marked?* Yes.
      *   *Three Cases Run?* Yes.
      *   *Unpopular Result Identified?* Yes.
