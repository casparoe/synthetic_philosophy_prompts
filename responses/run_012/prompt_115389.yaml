answer: |-
  ### Stage 1: The Trap (Minutes 0–10)
  **Action:** Do not mention Darwin, Turing, or philosophy. Begin with the **Eye**.
  **Board:** Write "DESIGN" on the left. Write "DESIGNER" on the right. Draw an arrow between them.
  **Script:** Ask the room to describe the human eye without using the word "purpose." They will fail. They will say "lens," "focus," "capture light." These are teleological terms.
  **Dependency:** You must establish the *intuition* before you invert it. If you open with the inversion ("There is no designer"), they will hear a slogan. If you open with the intuition ("Design implies a designer"), they will nod. You need their nod to trap them.
  **Point of No Return:** The moment you introduce the *filter*. Once you explain how a filter selects without choosing, you cannot return to the "hidden designer" hypothesis without redundancy.
  **Risk:** If you skip this and start with the mechanism, you lose the emotional stakes. They won't feel the loss of the designer, so they won't value the replacement.

  ### Stage 2: The Inversion (Minutes 10–25)
  **Action:** Erase "DESIGNER." Leave "DESIGN." Ask: "Can we keep the left without the right?"
  **Board:** Draw a funnel beneath "DESIGN." Label it "SELECTIVE FILTER."
  **Script:** Walk through the eye not as a created object but as a surviving one. Do not use biology jargon. Use the language of drafting: "Variations occur. Most fail. Some hold focus. Those remain."
  **Case Study:** Stick to the **Eye**. Do not switch to the thermostat. The thermostat is too trivial; no one suspects it of having a soul. The Eye carries the weight of "Miracle." You need them to feel the miracle persist *after* you remove the miracle-worker. If you choose the thermostat, you win the argument but lose the room; they will say, "Fine, machines are dumb, but poets are not." The Eye forces them to admit that *biology* is a machine.
  **Requirement:** The case must be held in mind without a diagram. Instruct them to visualize a camera lens adjusting itself over generations, not seconds.
  **Risk:** If you get bogged down in genetics, you lose the writers. Keep it at the level of "trial and error."

  ### Stage 3: The Pairing (Minutes 25–35)
  **Action:** Introduce Turing.
  **Board:** Write "BIOLOGY" under the Eye. Write "COMPUTATION" next to it.
  **Script:** Explain that Turing made the same move. We thought intelligence required a mind. Turing showed intelligence requires only symbol manipulation according to rules. The "mind" is the eye; the "rules" are the filter.
  **Dependency:** This only works if Stage 2 landed. If they still think the Eye needs a Designer, they will think the Computer needs a Ghost.
  **Risk:** Do not claim machines *are* conscious. Claim that consciousness is not required for *competence*.

  ### Stage 4: The Literary Parallel (Minutes 35–40)
  **Action:** Invoke "The Death of the Author."
  **Board:** Write "TEXT" under Computation.
  **Script:** "You know this feeling. A sentence works, but you don't know why. The text has competence you did not comprehend."
  **Verdict:** This parallel **earns its keep**, but only here. If you use it earlier, it collapses the science into a metaphor. Used now, it shows the inversion applies to *their* craft.
  **Constraint:** Do not allow it to imply the author is irrelevant. The author is the *environment* where the selection happens. The implication must be: "Your competence exceeds your comprehension," not "Your comprehension is zero."
  **Risk:** If you imply writers don't understand their work, they will revolt. Frame it as: "The work contains tools you built but don't consciously hold."

  ### Stage 5: Objections (Discussion Phase, Minutes 40–60)
  **Order of Objections:**
  1.  **The Mimicry Objection:** "It's just pretending."
      *   **Handling:** **Absorb.** Agree. "Indistinguishable is the standard. If it walks like design, we treat it as design. The 'pretend' vs. 'real' distinction is the ghost we are exorcising."
  2.  **The Chinese Room:** "Syntax isn't semantics."
      *   **Handling:** **Park.** "That is a argument about meaning, not competence. We are establishing how the competence arises. We can argue about the light inside the room later."
  3.  **The Nihilism Complaint:** "If this is right, nothing is really anything."
      *   **Handling:** **Refuse.** "That is a mood, not an argument. The eye still sees. The poem still moves. We are changing the story of origin, not the reality of effect."

  **Fatal Misconception:** **"This reduces meaning to nothing."**
  **Prevention:** You must say this in Stage 2: "Removing the designer does not remove the design. It explains how the design got there without magic." If they believe this theory destroys value, they will reject it to protect their art.

  ### Stage 6: Omissions (Minutes 60–65)
  **Action:** Explicitly state what you are ignoring.
  **Script:** "I am not teaching you genetics. I am not teaching you coding. I am teaching you the *logic of explanation*. We are ignoring the physics of the substrate to look at the architecture of the cause."
  **Reasoning:** This prevents the scientists in the room (if any) from pedantry and the artists from feeling out of their depth. It frames the session as philosophy, not science.

  ### Stage 7: The Closing Question (Minutes 65–75)
  **Action:** Do not ask for summary. Ask for application.
  **Question:** "When you find a line in your draft that is better than you knew how to write: who wrote it?"
  **Reasoning:** If they say "I did," they missed the point. If they say "No one," they missed the point. If they say "The process of drafting wrote it, using me," the idea landed.

  ### Sequence Reasoning
  1.  **Intuition First:** You cannot invert what isn't felt.
  2.  **Eye Over Thermostat:** The stakes must be high enough to warrant the session.
  3.  **Literary Parallel Late:** It validates them, but only after the hard logic is secured.
  4.  **Objections Parked/Refused:** You cannot solve consciousness in 75 minutes. Solve the design intuition.

  Load-bearing idea: Design accumulates through blind selection; understanding is a late-arriving tool, not a prerequisite.
