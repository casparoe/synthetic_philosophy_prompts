  ### 3. Evaluating Your Hypothesis

  You hypothesized: *"The whole thing turns on whether 'your decision' means the act you're about to perform or the policy you've already settled into, and that once you fix that, one of the cases dissolves into an ordinary causal decision problem."*

  **Verdict:** You are **80% Right**.

  *   **Where you are right:** The Act/Policy distinction is indeed the tool that resolves Case 1. If you view decision-making as selecting a policy (FDT), you pay in Case 1. If you view it as selecting an act (CDT), you refuse.
  *   **Where you are incomplete:** Fixing the Act/Policy distinction does **not** automatically dissolve Case 2 into a causal problem for everyone. It only does so for those who agree that Case 2 lacks Subjunctive Dependence.
  *   **The Surviving Disagreement:** There is a substantive disagreement about **Logical Correlation** that survives the Act/Policy distinction. The "Pay Both" person believes your decision *logically* correlates with the Coin/Blackmailer's rule in Case 2, just as it does with the Predictor in Case 1. The "Refuse Case 2" person denies this correlation exists in the text as written.

  The "Pay Both" person is not just "squeamish about blackmail"; they are likely operating under a **Logical Decision Theory** framework where they assume any sufficiently intelligent adversary (Blackmailer) creates a logical link, whereas the "Refuse Case 2" group treats the Blackmailer as a causal mechanism without predictive access to your current decision algorithm.

  ### 4. What Counts as Progress?

  Do not try to argue them into agreeing on the *answer*. Argue them into agreeing on the *premises*. The dispute is not verbal; it is a mismatch in **model specification**.

  **Step 1: The Formal Test (The "Blackmailer Knowledge" Variable)**
  Ask the group to formally specify the Blackmailer's information set in Case 2.
  *   *Scenario A:* The Blackmailer flips a physical coin and sets the rule without knowing your decision algorithm.
      *   **Result:** "Pay Both" is mathematically wrong. Paying is a dominated strategy (costs $100 for identical risk). The "Pay 1 / Refuse 2" group wins.
  *   *Scenario B:* The Blackmailer simulates your decision algorithm *before* flipping the coin (or sets the XOR rule based on a prediction of you).
      *   **Result:** The cases become isomorphic. "Refuse Case 2" is now the one making the error (ignoring the logical link). "Pay Both" is consistent.

  **Step 2: The Cleaner Case (Standard XOR Blackmail)**
  Replace Case 2 with the standard literature version to see if the "Pay Both" person's intuition holds.
  *   *Modified Case 2:* The Blackmailer sends the demand **if and only if** (Coin=Heads AND You Pay) OR (Coin=Tails AND You Don't Pay).
  *   In this version, receiving the letter is *evidence* about the coin and your action.
  *   If your group still splits on this modified case, the disagreement is purely **CDT vs. FDT** (Act vs. Policy).
  *   If the "Refuse Case 2" group agrees to pay in this modified version, then the original impasse was indeed about the **missing predictor link** in your original text.

  ### Recommendation for the Reading Group

  Tell your group this: **"We are not disagreeing about Decision Theory; we are disagreeing about the Causal Graph of Case 2."**

  1.  **Acknowledge the "Pay Both" person:** They are likely treating the Blackmailer as a Predictor (Logical Link). If the Blackmailer is a Predictor, they are right to pay.
  2.  **Acknowledge the "Refuse Case 2" person:** They are reading the text literally (Causal Link only). If the Blackmailer is not a Predictor, they are right to refuse.
  3.  **The Resolution:** The cases are **not** the same unless you explicitly add a Predictor to Case 2.
      *   If Case 2 has no predictor: **Pay 1 / Refuse 2** is the consistent FDT position. **Refuse Both** is the consistent CDT position. **Pay Both** is inconsistent.
      *   If Case 2 has a predictor: **Pay Both** is the consistent FDT position. **Refuse Both** is the consistent CDT position. **Pay 1 / Refuse 2** is inconsistent.

  **Actionable Advice:**
  Ask the "Pay Both" person: *"If I prove to you the Blackmailer has no access to your source code and the coin is physically random, will you refuse Case 2?"*
  *   If they say **Yes**: The dispute was about the problem setup (Subjunctive Dependence), not the theory. You win.
  *   If they say **No**: They believe in a form of logical correlation that extends to physical coins (a la "Timeless Decision Theory" applied broadly). The dispute is then about the nature of logic and causation, and you will not resolve it without studying **Logical Induction** or **Subjunctive Dependence** formally.

  Most likely, they are assuming the standard "XOR Blackmail" setup from the literature where the Blackmailer *does* predict you. Once you expose that assumption, the "Pay 1 / Refuse 2" group will see they were right about the text, and the "Pay Both" group will see they were right about the *intended* analogy. The impasse dissolves into a clarification of premises.
