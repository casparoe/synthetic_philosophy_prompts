  This is preferable to rejecting (2). If you reject (2), you claim choices do not necessarily reveal preferences, which forces you to define "ideal" conditions (e.g., "fully informed," "no weakness of will") under which choices *do* reveal preferences. As you suspected, this smuggles normative mental states back in: you must judge which choices are "true," turning utility into a normative measure of rationality rather than a descriptive measure of behavior. By rejecting (3) instead, you keep utility descriptive. You concede that agents are often strangers to their own behavioral patterns, saving revealed preference theory from incoherence while admitting it cannot validate whether those preferences serve the agent's well-being. You keep the economics, but you must tell your friend that "preference" no longer implies "wisdom."
