  **The Arithmetic of Eternity: Why We're Liquidating the Endowment**

  To our valued stakeholders,

  For decades, the Meridian Foundation operated under a false assumption: that saving a life today was morally superior to attempting to secure an eternal utopia tomorrow. This was a failure of imagination. Specifically, a failure of infinite ethics. Today, I am pleased to announce a strategic realignment. We are liquidating the entire endowment to fund a single initiative: Project Aleph.

  Project Aleph involves constructing a hyper-computational array in a stable orbit around a black hole. Its purpose is to send a specific radio signal into the multiverse. The probability of this signal triggering a chain reaction that generates infinite conscious happiness is approximately one in a googol. To the untrained eye, this sounds risky. To the ethicist trained in expected utility theory, it is the only rational choice.

  Here is the arithmetic: Any nonzero probability multiplied by an infinite payoff yields an infinite expected value. Finite goods, no matter how poignant, sum to zero against infinity. This is why we are immediately defunding the pediatric oncology wing at St. Jude's. I understand the optics are challenging. However, saving ten thousand children produces a finite amount of well-being. Even if the chance of Project Aleph succeeding is one in a googolplex, the infinite upside dominates the ledger. We cannot be fiduciaries of sentiment; we must be fiduciaries of the sum total.

  Critics have called this approach "fanaticism." They argue that basing policy on low-probability, high-stakes outcomes is reckless. My response is simple: If ignoring a guaranteed infinite payoff to secure a finite one is not fanaticism, what is? It is negligence. It is choosing the visible penny over the invisible vault. We are not being extreme; we are finally being precise.

  Admittedly, this new framework has introduced operational complexities. Last week, the grant committee deadlocked for six hours. We were choosing between Project Aleph and Project Bethe. Both projects carry a nonzero chance of producing infinite value. Therefore, both possess infinite expected value. The committee could not proceed because standard mathematics cannot distinguish between these specific infinities. We cannot say which infinity is bigger, only that both dwarf the children's hospital.

  We are currently hiring a set theorist to resolve the cardinality dispute. Until then, disbursements are paused, though the oncology wing remains closed. There is no point in funding finite suffering when infinite glory is on the table.

  Some will say we have lost our humanity. I argue we have finally scaled it. We are no longer tinkering with margins. We are betting on the horizon.

  Sincerely,

  **Julian Vane**
  *Director, Meridian Foundation*
