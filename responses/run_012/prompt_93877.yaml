  I'm a third-year undergraduate in an epistemology seminar, and for the last few weeks we've been working through the literature on pragmatic encroachment alongside the older contextualist material, which has left me more confused than when I started rather than less. The confusion is this: contextualism seems to make the word "knows" sensitive to the standards of whoever is doing the attributing, whereas encroachment seems to make knowledge itself sensitive to the practical situation of the person doing the knowing, and I genuinely cannot tell whether these are rival explanations of one phenomenon, two descriptions of the same phenomenon, or views that could both be true. Our instructor set us a short exercise on this and I'd like to turn it into something more quantitative. Here is the specific claim I want a credence on: it is true that whether a subject S knows that p can depend, in part, on practical facts about S's situation — that is, on the costs and benefits of acting on p, or of being wrong about p — and not solely on truth-conducive features of S's evidence, reliability, and belief. Please give me your number for that claim, but the number is the least interesting part; what I want is the derivation.

  Decompose it into the sub-questions you think the credence actually turns on, give each a rough probability, and show me how they combine into the total. Some candidate joints, which you should feel free to add to, collapse, or drop: whether the familiar bank-style cases and their relatives genuinely exhibit a shift in knowledge attributions with stakes, as opposed to a shift only in what it is appropriate to assert or to do; whether, if there is a shift, it lives in the semantics of "knows" rather than in the pragmatics of assertion or in a stake-sensitive notion of outright belief; whether the relevant stakes are the subject's or the attributor's; and whether the so-called knowledge norm of practical reasoning — roughly, that one may treat p as a reason for action only if one knows p — is correct, since I suspect an uncomfortable amount of the encroachment case leans on it. There is also something from seminar I cannot place in the standard taxonomy: a classmate proposed that stakes do not move the threshold for knowledge at all, but instead make it indeterminate where the boundary between mere belief and outright belief falls, so that the apparent stake-sensitivity is an artifact of vagueness in the belief/knowledge boundary. Call it the indeterminacy proposal. It strikes me as either a clever way of being an invariantist in disguise or a notational variant of encroachment, and I would like a probability that it is a genuinely distinct and defensible third option rather than a relabeling.

  Then tell me which single sub-question the final number is most sensitive to — the one where a modest change in my view of it would move the total the most — and what sort of argument or evidence, philosophical or experimental, would most shift it. Finally, if it is not too much to ask, say where you think the disagreement most likely lives between two people who land at roughly 0.2 and 0.8 on the headline claim: are they disagreeing about the cases, about the semantics/pragmatics divide, or about the norm of practical reasoning? My own credence is hovering near 0.55, mainly because I cannot decide whether the bank cases are evidence about knowledge or evidence about assertion, and I would like to know whether that is where a careful person would put the weight or whether I have mislocated the crux entirely.
