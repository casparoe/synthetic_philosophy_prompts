  Reference is made to the Treaty of Versailles, Article 231. The underwriting team has historically classified this as a 'Guilt Clause'. Legal counsel advises this is a misnomer. The text establishes liability for loss and damage caused by aggression, not moral culpability. It is a reparations hook, not a criminal verdict. However, risk assessment must account for the insured's perception. The German populace internalized Article 231 as moral condemnation, creating a reputational loss exposure disproportionate to the legal liability. We are pricing a legal clause but hedging against a national psyche.

