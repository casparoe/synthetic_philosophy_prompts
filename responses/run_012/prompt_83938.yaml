  Pricing requires a counterfactual baseline. If the alliance system, mobilization timetables, and the blank cheque to Vienna necessitated a general conflagration regardless of specific intent, the marginal liability of the insured is negligible. Historians refuse to supply a baseline probability for 'Great Power War ex-Germany'. Without a control group, we cannot isolate the peril.

