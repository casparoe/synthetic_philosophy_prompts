answer: |-
  # The Standing to Blame Decision Tree

  **Instructions:** Start at **Node 1**. Answer the question based on your intuition about the specific case or scenario described. Follow the arrow corresponding to your answer until you reach a **Leaf**. Each Leaf represents a theoretical position on moral standing. Read the commentary following the tree for diagnostics on unoccupied spaces and overlapping positions.

  ***

  ### Node 1: The "Just Describing" Case
  **Case:** You lie to a colleague. A third party says to you, calmly and without anger, "You lied to your colleague." They offer no demand for apology, only a statement of fact.
  **Question:** Has this person **blamed** you, or merely described your behavior?
  *   **(A) They have blamed me.** (Blame is essentially a communicative act or judgment.) → Go to **Node 2**.
  *   **(B) They have only described it.** (Blame requires anger, a demand, or a sanction.) → Go to **Node 10**.

  ### Node 2: The "Busybody Stranger" Case
  **Case:** You lie to a friend. A stranger who witnessed it, and has no relationship to you or your friend, tells you, "You had no right to lie."
  **Question:** Does this stranger have the **authority** to hold you accountable, or are they merely expressing a personal opinion?
  *   **(A) They have authority.** (Standing comes from membership in the moral community.) → Go to **Node 3**.
  *   **(B) They lack authority.** (Standing comes from a specific relationship.) → Go to **Node 4**.

  ### Node 3: The "Reformed Wrongdoer" Case
  **Case:** A person who used to lie habitually but has genuinely repented and stopped tells you, "You should not lie."
  **Question:** Does their past wrongdoing permanently disqualify them, or does their current commitment restore their voice?
  *   **(A) Permanently disqualifies.** (The historical fact of the wrong matters most.) → Go to **Node 7**.
  *   **(B) Current commitment restores.** (Standing depends on current endorsement of the norm.) → Go to **Node 8**.

  ### Node 4: The "Hypocritical Friend" Case
  **Case:** A close friend who lied to someone else last year (and never admitted it) tells you, "You should not lie."
  **Question:** Is her criticism **silenced** (you owe her no response), or is it merely **compromised** (you should listen with skepticism)?
  *   **(A) Silenced.** (She lacks the standing to speak.) → Go to **Node 5**.
  *   **(B) Compromised.** (She has standing, but her record reduces her weight.) → Go to **Node 6**.

  ### Node 5: The "Same vs. Any Wrong" Case
  **Case:** Your friend lied last year. Now she blames you for *stealing*.
  **Question:** Does she lack standing only because she lied (the same wrong), or because she is a wrongdoer generally (any serious wrong)?
  *   **(A) Only the same wrong defeats.** (Specific hypocrisy is the issue.) → **Leaf 1**.
  *   **(B) Any serious wrong defeats.** (General moral commitment is the issue.) → **Leaf 2**.

  ### Node 6: The "Beneficiary" Case
  **Case:** A person who benefits from a system of lying (e.g., a competitor who gains when you are honest) tells you not to lie.
  **Question:** Is their standing defeated because they benefit, or only if they have personally committed the wrong?
  *   **(A) Benefit defeats standing.** (Complicity in the practice matters.) → **Leaf 3**.
  *   **(B) Only personal wrongs matter.** (Standing is about personal moral record.) → **Leaf 4**.

  ### Node 7: The "Forgiving Victim" Case
  **Case:** You lied to a victim. She forgives you. A third party (who has standing) continues to blame you.
  **Question:** Does the victim's forgiveness remove the third party's standing to blame?
  *   **(A) Yes, it removes it.** (Standing is relative to the victim.) → **Leaf 5**.
  *   **(B) No, it remains.** (Standing is relative to the moral community.) → **Leaf 2**.

  ### Node 8: The "Threshold" Case
  **Case:** A blamer lacks standing (on your view).
  **Question:** Is their blame **null** (like a void contract, requiring no response), or **weak** (like biased testimony, requiring less trust)?
  *   **(A) Null.** (Lacking standing means no blame occurred.) → **Leaf 2**.
  *   **(B) Weak.** (Lacking standing is a scalar reduction.) → **Leaf 4**.

  ### Node 9: The "Self-Blame" Case
  **Case:** You committed a wrong. You feel you have no right to criticize yourself for it.
  **Question:** Is this incoherent (you always have standing to blame yourself), or coherent (you can lack standing with yourself)?
  *   **(A) Incoherent.** (Self-standing is impossible to lack.) → **Leaf 6**.
  *   **(B) Coherent.** (One can lack standing to blame oneself.) → **Leaf 7**.

  ### Node 10: The "Epistemic vs. Moral" Case
  *(Reached from Node 1, Answer B)*
  **Case:** A hypocrite says, "You lied." You think they aren't "blaming" in the robust sense, but they are correct.
  **Question:** Is their lack of standing a **moral** disability (they shouldn't speak), or an **epistemic** one (we shouldn't trust them)?
  *   **(A) Moral disability.** (They are doing something wrong by speaking.) → **Leaf 8**.
  *   **(B) Epistemic one.** (They are factually right, but socially inappropriate.) → **Leaf 6**.

  ***

  ### The Leaves (Positions)

  **Leaf 1: Hypocrisy Specific Defeater**
  *   **Position:** Standing is defeated only by the specific same wrong.
  *   **Awkward Commitment:** A murderer has standing to blame you for littering, but a litterer does not.

  **Leaf 2: Commitment/Community View**
  *   **Position:** Standing consists in being committed to the norm and a participant in the moral community.
  *   **Awkward Commitment:** A reformed sinner has more authority than a saint who is indifferent to the norm.

  **Leaf 3: Complicity View**
  *   **Position:** Standing is defeated by benefiting from the wrong, even without committing it.
  *   **Awkward Commitment:** You may lack standing to criticize a system that keeps you alive.

  **Leaf 4: Scalar/Weight View**
  *   **Position:** Hypocrisy never fully defeats standing; it is at most a reason to take the criticism less seriously.
  *   **Awkward Commitment:** A habitual liar retains the same *kind* of authority as a saint, merely less of it.

  **Leaf 5: Relational/Victim-Relative View**
  *   **Position:** Standing is relational and depends on the specific accountability relationship between the two parties.
  *   **Awkward Commitment:** If the victim forgives, the moral community loses its voice against the wrongdoer.

  **Leaf 6: Two-Track View (Moral vs. Epistemic)**
  *   **Position:** Separates moral standing from epistemic standing; a hypocrite may know perfectly well what you did wrong while having no standing to say it.
  *   **Awkward Commitment:** You can be morally forbidden from speaking a truth you know with certainty.

  **Leaf 7: Self-Standing Defeater (Unoccupied)**
  *   **Position:** One can lack standing to blame oneself.
  *   **Awkward Commitment:** You can be morally required to ignore your own accurate moral judgments about yourself.
  *   **Diagnosis:** **Unoccupied.** This view is rarely defended because self-blame is typically constitutive of agency; lacking standing to blame oneself looks like a denial of moral agency rather than a limitation on standing.

  **Leaf 8: Deflationary View**
  *   **Position:** Standing-talk is a confused proxy for a weighing question and should be deflated rather than theorized.
  *   **Awkward Commitment:** There is no distinct normative phenomenon of "standing," only varying degrees of appropriateness.

  ***

  ### Commentary and Diagnostics

  **1. Overlapping Positions (Leaf 4 vs. Leaf 8)**
  You may find that **Leaf 4 (Scalar/Weight)** and **Leaf 8 (Deflationary)** are effectively the same position stated twice. Both deny that standing is a threshold condition that renders blame null. The Deflationary view simply pushes further, arguing that the *concept* of standing is the confusion, whereas the Scalar view retains the concept but denies it binary force. In practice, both advise listening to the hypocrite but discounting their voice. If your group finds this distinction hair-splitting, collapse these leaves.

  **2. Indistinguishable Paths (Node 7 and Node 8)**
  The tree may struggle to separate **Leaf 2 (Commitment/Community)** from **Leaf 4 (Scalar/Weight)** depending on how Node 8 is answered. If a Commitment theorist argues that lacking commitment makes blame "null," they land on Leaf 2. If they argue it makes blame "weak," they land on Leaf 4. However, many Commitment theorists insist on the threshold view (null). If a participant wants to hold Commitment but also Scalar weight, flag this as a tension: it is difficult to maintain that standing is about *authority* (which is usually binary) while also claiming it is scalar.

  **3. Unoccupied Space (Leaf 7)**
  **Leaf 7** represents the view that one can lack standing to blame oneself. This space is largely **unoccupied** in the literature.
  *   **Diagnosis:** This is not merely unattractive; it risks incoherence. Standing is typically a normative relation between *agents*. While one can have conflicting attitudes toward oneself, lacking the *authority* to hold oneself accountable undermines the concept of moral agency. If you cannot blame yourself, you cannot recognize your own wrongs as binding. Most theorists who defend standing against others assume self-blame is always permissible (or required).

  **4. The "Relational" Gap (Node 4 + Node 5)**
  There is a potential gap in the tree regarding the **Relational View**. If a user answers that strangers lack standing (Node 2, B) but that hypocrisy does *not* silence a friend (Node 4, B), they are directed toward a Scalar view. However, a robust Relational view might argue that standing depends *only* on the relationship quality, rendering hypocrisy irrelevant unless it damages the relationship. This combination (Relational + Hypocrisy Irrelevant) is theoretically possible but rarely defended, as relationships are usually thought to be governed by norms of reciprocity.

  **5. American English Note**
  This instrument uses American spelling (e.g., "behavior," "criticize") and phrasing conventions as requested.
