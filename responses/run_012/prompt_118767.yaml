answer: |-
  This is a profound disagreement, and your partner is articulating a position that has a serious philosophical lineage, even if she cannot recall the specific book. The argument she is making is almost certainly a variation of **Arthur Schopenhauer's** aesthetics, specifically from *The World as Will and Representation* (1818), possibly filtered through later thinkers like **Susanne Langer** (*Philosophy in a New Key*).

  Schopenhauer argues exactly what your partner says: that painting, sculpture, and poetry are representations of *phenomena* (things in the world), which are themselves merely shadows of the underlying reality (the Will). Therefore, they are "copies of copies." Music, however, bypasses the phenomena entirely. It is a direct copy of the Will itself. It does not represent grief; it *is* the sonic structure of grief.

  Here is a reconstruction of that position, an analysis of its vulnerabilities, and finally, a practical answer for your edit.

  ### I. The Reconstruction: What Must Be True?

  For your partner's claim to hold water—that music expresses feeling without expressing *any particular* feeling—two specific conditions must be met regarding the nature of feeling and the nature of music.

  **1. The Morphology of Feeling**
  This view requires that emotions have a structural shape independent of their cause. We usually think of grief as "grief *about* something" (the drowned village, the lost home). But this theory posits that there is a raw, somatic experience of grief—a pattern of tension, stasis, heaviness, and release—that is identical whether you are grieving a lost village, a lost lover, or a lost dog.
  *   **What must be true:** Feeling must be separable from its object. The "ache" is the same; only the explanation changes.
  *   **The Music's Role:** Music does not deal in explanations (concepts). It deals in time, tension, and resolution. A slow string quartet creates a temporal architecture of delay, dissonance, and longing. It replicates the *morphology* of grief without providing the *narrative* of grief. It gives you the engine without the car.

  **2. The Immediacy of Perception**
  This view requires that conceptual understanding creates distance. When you see a painting of a drowning, you must first recognize "water," then "person," then "danger," then access your memory of danger to feel fear. This is a cognitive chain.
  *   **What must be true:** Cognition is a barrier to pure affect.
  *   **The Music's Role:** Music enters the nervous system before the intellect categorizes it. You feel the minor key or the dragging tempo physically before you label it "sad." Therefore, music is not one remove from the thing; it is the thing itself, presented in auditory form.

  **The Contrast with Other Arts**
  Your partner's distinction rests on **denotation**.
  *   **Film/Lit/Painting:** These arts denote. A shot of a submerged lintel *points to* a submerged lintel. It relies on your knowledge of the world to have meaning. It is semantic.
  *   **Music:** This art is non-denotational. A minor chord does not "point to" sadness; it enacts a sonic relationship that *feels like* sadness. It is semantic-free.
  *   **The Consequence:** When you put a sad song under a sad scene, you are often doubling the same information. But if the music is "grief itself" and the scene is "a specific history," they are doing different jobs. The risk, as she notes, is that if the music is the "original," the images risk looking like cheap illustrations.

  ### II. Testing the Position: The Objection of Subjectivity

  You raised the strongest objection: *A funeral march can be whistled at a football match.* If music is the essence of grief, how can it be used ironically or ignored?

  **The Defense**
  A proponent of this view (like Schopenhauer or Langer) would argue that the football whistle-blower is not hearing the music *as music*, but as a signal or a tune. They are extracting the melody (the object) and ignoring the harmonic movement (the feeling).

  However, a more honest version of the theory must concede that **music offers an invitation, not a compulsion.**
  *   **The Vulnerability:** Music presents the *form* of feeling, but it cannot force the listener to inhabit that form. If a listener is in a manic state, they may reject the grief offered by the quartet.
  *   **Proper Listening:** To hear the music "properly" means attending to its internal logic rather than projecting external associations. If you hear the quartet and think, "This sounds like the drowned village," you are actually doing what your partner warns against: you are turning the music back into a copy of the world. To hear it properly is to feel the weight of the sound itself, regardless of the image.

  **Can it absorb the objection?**
  Yes, but only if it admits that music is **autonomous**. It possesses the *capacity* to express the essence of grief, but it requires a listener willing to surrender to that capacity. The football fan is resisting the capacity. In your documentary, you are asking the audience to surrender. The risk is not that they won't feel grief, but that they will feel *only* the music's grief and ignore the village's history.

  ### III. The Practical Verdict: To Trust or Suspect?

  If your partner is right, does this give you a reason to use the quartet, or to cut it?

  **It gives you a reason to trust the music, but to discipline the images.**

  If the music is "grief itself" (the universal substrate) and your footage is "this specific grief" (the particular instance), they are not competitors. They are **metaphysical partners**. However, this creates a specific editing danger: **Sentimentality.**

  **1. The Danger of Redundancy**
  If you cut the footage to match the swells of the music (e.g., fading to black on a resolution, showing a crying face on a dissonance), you are treating the music as a sound effect. You are dragging the "essence of grief" down into the mud of "specific sadness." You make the music a copy of the images. This is what your partner means by "wallpaper." The music becomes a mood blanket rather than a philosophical statement.

  **2. The Strategy of Counterpoint**
  If the music is already saying "everything" about loss, your images do not need to scream "loss." In fact, they should be almost clinical.
  *   **Visuals:** Show the empty rooms factually. Show the water levels objectively. Let the interviews be about the *facts* of moving (the boxes, the date, the road) rather than just the *emotion* of leaving.
  *   **Audio:** Let the quartet carry the emotional weight.
  *   **Why:** If the images are too sad, and the music is too sad, the audience feels manipulated. They feel the director telling them how to feel. But if the images are stark and factual (the "copy") and the music is the deep, universal grief (the "original"), the audience has to bridge the gap themselves. That act of bridging is where the true emotional impact lives.

  **3. The "Earning Its Place" Test**
  Your partner said the images must "earn their place." In this context, that means the images must provide the **resistance** that the music needs.
  *   Music without images is abstract.
  *   Images without music are archival.
  *   **Together:** The images anchor the music in reality so it doesn't become self-indulgent classical noodling. The music elevates the images so they don't become a dry historical lecture.

  **Recommendation**
  Use the quartet. But do not let it dictate the rhythm of the cut. Do not cut *on* the beat. Do not choose shots because they look "sad." Choose shots because they are *true*.

  If the music is indeed the "inner nature of feeling," then it is the only thing in your film that is timeless. The village is gone; the interviews are aging; the reservoir is silting up. The quartet is the only thing that exists in the eternal present of grief. Let it be the floor on which the history stands, not the paint on the walls.

  Your partner is warning you that if you use the music to *make* the scene sad, you have failed. You must use the music to reveal that the scene *was already* sad, before you ever arrived with a camera. If the footage is honest, the music will not cover it; it will haunt it.
