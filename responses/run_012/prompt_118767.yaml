      *   *Nuance:* Is there a "proper" listener? Yes, one who attends to the internal logic of the music rather than imposing external associations. But absolute objectivity is impossible. The claim isn't that music *forces* feeling, but that it *presents* the form of feeling more purely than other media.
      *   *Limit:* The theory works best for absolute music (quartets) rather than programmatic music.

  5.  **Addressing the Practical Question (The "Edit" section):**
      *   *Verdict:* The partner is warning about *redundancy* and *manipulation*.
      *   *If Music = Grief Itself:* You don't need to *show* grief in the faces of the interviewees explicitly. You don't need sad piano stings.
      *   *The Danger:* If the images are too sentimental (crying faces, slow motion), they compete with the music's universality. They become "copies of copies" trying to shout over the "original."
      *   *The Solution:* Counterpoint. Let the music hold the emotional weight (the universal loss). Let the images hold the factual weight (the specific rooms, the specific water levels). The "wallpaper" risk happens if the images try to *illustrate* the music. They should *witness* against it.
      *   *Recommendation:* Trust the music, but discipline the images. Be clinical/factual with the visuals to let the music do the emotional work. This creates tension (Specific vs. Universal).

