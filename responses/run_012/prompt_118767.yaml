          4.  Test the position (address the objection about subjective interpretation/irony).
          5.  Answer the practical question: Does this justify using the music, or warn against it? How should the images relate to the music?

  2.  **Deconstruct the Partner's Philosophical Position:**
      *   *Core Idea:* Music is non-representational but expressive. It bypasses concepts to access raw affect.
      *   *Philosophical Lineage:* This sounds heavily like **Schopenhauer** (The World as Will and Representation) and potentially **Susanne Langer** (Philosophy in a New Key) or **Peter Kivy** (though Kivy is more skeptical). Schopenhauer is the strongest match: he argues other arts copy Platonic Ideas (shadows of the Will), but music *is* a direct copy of the Will itself.
      *   *Key Distinction:* Particular emotions (sadness about *this* loss) vs. The Essence of Sadness (the dynamic structure of sorrow).
      *   *Implication for Film:* If music provides the *universal* emotional substrate, the visuals shouldn't try to compete by being overly emotional or manipulative. They should provide the *particulars* that anchor the universal.

  3.  **Drafting the Reconstruction (The "What must be true" section):**
      *   *Ontology of Feeling:* Feelings have a structure (tension, release, stasis, turmoil) independent of their cause. Music mimics this *morphology*.
      *   *Ontology of Music:* Music is temporal and dynamic, like feeling. It doesn't denote objects; it enacts processes.
      *   *Contrast with Other Arts:* Painting/Lit require recognition ("That is a woman," "That is a flood"). This requires cognitive processing (concepts). Music skips the recognition phase and goes straight to the somatic/affective response.
      *   *Source:* Explicitly mention Schopenhauer. It gives the partner's "half-remembered book" a concrete home.

  4.  **Testing the Position (The "Objection" section):**
