      *   **The Risk:** If music is "grief itself," images might become mere "wallpaper" unless they earn their place.
      *   **The Task:**
          1.  Reconstruct the partner's position seriously (philosophical grounding, not just poetic).
          2.  Explain what must be true of feeling and music for this to hold.
