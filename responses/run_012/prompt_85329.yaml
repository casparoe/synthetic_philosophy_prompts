answer: |-
  This is a rich vein to mine. Anscombe is often caricatured as a rigid absolutist who simply shouts "Murder!" at anything unpleasant, but her actual philosophical architecture is much more precise, and it cuts through a lot of the hand-wringing in contemporary roboethics.

  Here is a reconstruction of how Anscombe would engage with autonomous weapons, drones, and the consequentialist calculus, distinguishing between what is textually grounded and where we are necessarily extrapolating her commitments.

  ### 1. The Responsibility Gap: A Category Error
  The "responsibility gap" (associated with Andreas Matthias and others) argues that if a machine learns and selects targets autonomously, the causal chain is broken: the programmer didn't intend *this* kill, the commander didn't order *this* specific strike, and the machine isn't a moral agent. Therefore, no one is responsible.

  **Anscombe's Verdict:** She would likely treat the "responsibility gap" as a philosophical confusion stemming from a defective view of intention.

  *   **Textual Grounding:** In *Intention* (1957), Anscombe argues that intentional action is defined by the agent's knowledge of what they are doing "without observation." In *War and Murder* (1961), she insists that you are responsible for what you intend, and you intend the means to your ends, not just the final goal.
  *   **Reconstruction:** Anscombe would argue that the responsibility gap is a red herring designed to excuse bad faith. If a commander deploys a loitering munition or an AWS into an environment where civilians are present, knowing that the system *might* select and kill a civilian, the commander **intends** the deployment of a killing mechanism that operates without moral discrimination.
  *   **The "Upstream" Intention:** For Anscombe, you do not escape responsibility by inserting a machine between your will and the death. If I set a bear trap to protect my property and it maims a child, I am responsible for the maiming. I intended to set a trap that maims intruders. The fact that the trap "decided" to snap on the child based on pressure sensitivity is irrelevant.
  *   **Where she'd pivot:** However, she would identify a deeper problem than the "gap." She would argue that delegating the *decision to kill a human being* to an algorithm is itself an intention to treat human life as a data point. The moral wrong isn't just that no one is responsible; it's that the human agent has *abdicated the moral judgment* required to distinguish the innocent from the non-innocent. You cannot intend justice through a proxy that lacks the capacity for moral judgment. So, she wouldn't say "no one is responsible"; she'd say "the person who deployed it is responsible for murder, because they intended to use a method that cannot distinguish innocence."

  ### 2. Drones, Double Effect, and the "Operator"
  You ask if she would clear a drone operator who foresees but does not intend civilian deaths. This touches on the Principle of Double Effect (PDE).

  **Anscombe's Verdict:** She would be far stricter than modern Just War theorists who use PDE as a "get out of jail free" card for collateral damage.

  *   **Textual Grounding:** In *War and Murder*, Anscombe clarifies that PDE is not a utilitarian balancing act. The act itself must be good or neutral. The evil effect must not be the means to the good effect. The intention must be purely the good effect.
  *   **Reconstruction:** Modern drone warfare often relies on "pattern of life" analysis or striking targets in populated areas. Anscombe would scrutinize the **description of the action**.
      *   If the action is described as "destroying a military target," and civilians die as a side effect, she *might* permit it.
      *   However, if the action is described as "blowing up the building where the target is hiding," and the building contains civilians, she would likely argue the civilians' deaths are **intended as means**. Why? Because the destruction of the building (and its contents) is the mechanism by which the target is killed. You cannot separate the target from the environment if the environment is part of the weapon's effect.
  *   **The "Foresight" Defense:** She would reject the idea that "I didn't want them to die" is sufficient. In *Mr. Truman's Degree*, she argues that Truman intended the deaths of the civilians in Hiroshima because their destruction was the means by which he pressured the surrender. Similarly, if a drone operator knows a strike will level a block to get one guy, the leveling of the block (and the deaths within) is part of the intended plan.
  *   **Concession:** She would concede that *some* risk to civilians is unavoidable in war. But she would insist that "collateral damage" is often a euphemism for "accepted murder." If the probability of civilian death is high, the intention to strike becomes an intention to kill civilians *conditionally*. For Anscombe, conditional intention to kill the innocent is still morally culpable.

  ### 3. Meaningful Human Control (MHC)
  The Campaign to Stop Killer Robots argues for MHC: a human must remain in the loop to ensure moral judgment.

  **Anscombe's Verdict:** She would support the conclusion (ban or restrict AWS) but reject the framing that MHC makes the killing permissible.

  *   **Textual Grounding:** Anscombe's ethics is agent-centered. Moral acts are performed by humans with rational wills.
  *   **Reconstruction:** She would agree that moral judgment cannot be outsourced. To kill justly, one must be able to judge the justice of *this* killing at *this* moment. An algorithm cannot do this. Therefore, a system without MHC is intrinsically defective for moral action.
  *   **The Critique:** However, she would warn that MHC is often treated as a sufficient condition for legitimacy. "There was a human in the loop, so it's legal." Anscombe would say: "A human in the loop can still be a murderer." Truman was a human. He had control. He was still a murderer. MHC is necessary because only humans can bear moral responsibility, but it is not sufficient because humans can still intend evil.
  *   **Load-Bearing Reconstruction:** This is where we extrapolate. Anscombe never wrote about automation. But based on her view of *practical knowledge* (knowing what you are doing), she would argue that if the human in the loop cannot practically know *why* the machine selected the target (due to algorithmic opacity), they cannot form a valid intention. They are signing a blank check for murder. Thus, "black box" AI violates the condition of intentional action itself.

  ### 4. Consequentialism and Longtermism (Your Hunch)
  Your hunch is correct. She would have zero patience for it.

  *   **Textual Grounding:** *Modern Moral Philosophy* (1958) is a direct assault on consequentialism. She coined the term to describe the family of theories that judge acts solely by outcomes. In *Mr. Truman's Degree*, she explicitly rejects the argument that the bombings were justified because they saved lives in the long run.
  *   **The Argument:** For Anscombe, certain concepts (like "murder") carry absolute prohibitions. "Murder" is defined as the intentional killing of the innocent. You cannot commit murder to prevent murder. To do so is to adopt a consequentialist ethic where "nothing is forbidden which it is useful to do."
  *   **Longtermism:** She would view Longtermist expected-value arithmetic as the apotheosis of the error she identified in 1958. Calculating the "expected value" of nuclear risk treats innocent lives as units in a sum. It removes the *sacredness* (or absolute inviolability) of the individual.
  *   **No Room for Concession:** Would she concede anything? Only this: Prudence matters. You must calculate consequences to determine *if* a war is just (last resort, probability of success). But once you are in the conduct of war (*jus in bello*), consequentialism is banned. You cannot murder to shorten the war. You cannot risk nuclear annihilation to secure a "positive long-term future." The end never justifies the means if the means are intrinsically evil.

  ### 5. Summary of Reconstruction vs. Text
  To help you structure the seminar, here is the breakdown of where the textual evidence ends and the philosophical reconstruction begins:

  | Issue | Textual Evidence (Anscombe's Words/Arguments) | Philosophical Reconstruction (Applying commitments to new tech) |
  | :--- | :--- | :--- |
  | **Truman/Murder** | *Mr. Truman's Degree*: Truman intended civilian death as a means; therefore murder. Consequentialist justification rejected. | **AWS/Drones:** If a system selects targets based on probability, the commander intends the killing of those probabilities. If innocents are included, it is murder. |
  | **Intention** | *Intention*: Action is defined by the description under which it is intended. Means are intended. | **Responsibility Gap:** The "gap" is false. The commander intends the deployment of the system. The system's autonomy does not break the chain of intention regarding the *risk* imposed. |
  | **Double Effect** | *War and Murder*: PDE is strict. Evil cannot be the means. | **Collateral Damage:** Drone strikes that destroy infrastructure to kill a target likely fail PDE because the destruction is the means. |
  | **Agency** | *Modern Moral Philosophy*: Moral concepts require a moral agent (human). | **MHC:** Algorithms cannot be moral agents. Therefore, they cannot kill justly. Human control is required for *agency*, not just *legitimacy*. |
  | **Consequentialism** | *Modern Moral Philosophy*: Coined the term pejoratively. Rejects "greatest good" as sole criterion. | **Longtermism:** Expected value calculations regarding nuclear risk are morally incoherent because they treat innocent life as fungible. |

  ### Where the Current Debates Go Wrong (Anscombe's Critique)
  If Anscombe were in your seminar, she would likely accuse the roboethics community of two main errors:

  1.  **Fetishizing the "Gap":** By worrying about who is responsible *after* the machine kills, they imply that if we could just fix the accountability structure, the killing would be okay. Anscombe would say: "Stop worrying about who goes to prison and start asking if you ought to be doing this at all." The focus on the gap distracts from the intrinsic evil of the act.
  2.  **Proceduralizing Morality:** The push for "Meaningful Human Control" often turns into a checklist (latency limits, explainability). Anscombe would argue this is legalism, not ethics. A human can press a button with full understanding and still commit murder. The focus must be on the *object of the act* (killing the innocent), not the *procedure of the decision*.

  ### One Concession She Might Make
  Where might she concede to the moderns? She might acknowledge that **modern technology makes the intention/foresight distinction harder to maintain.**

  In WWII, dropping a bomb on a city was clearly intending to kill civilians. With a precision drone, the claim "I only intended to kill the combatant" is more plausible. She would concede that technology *can* narrow the scope of destruction, making it *easier* to adhere to absolute prohibitions. But she would insist that this is only a contingent fact. If the precision weapon is used in a way that accepts civilian death as a cost, it reverts to murder. The technology doesn't save the conscience; the will does.

  ### Seminar Hook
  If you want to provoke the room: Ask them whether Anscombe would view the "Responsibility Gap" as a **feature** sought by military planners. If the goal is to kill without moral guilt, creating a system where responsibility is diffuse achieves exactly what Truman wanted: the ability to kill the innocent while claiming the mantle of the "tragic statesman" rather than the murderer. Anscombe's philosophy is the tool that strips away that camouflage.
