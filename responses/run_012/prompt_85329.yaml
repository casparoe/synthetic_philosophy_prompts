prompt: |-
  Ok, I'm building a session for a grad seminar on Anscombe and war and I want to think out loud with you. You know the Truman thing: she thought Hiroshima and Nagasaki made Truman a murderer, not a tragic statesman but a murderer, and she was perfectly willing to be a pain in the neck about it at Oxford. Fine, I get that. Here's what I actually want to work through. The ethics of killing has moved on a lot since she died, and I want to know what she'd have made of where it's gone. We've got armed drones, we've got loitering munitions, and we've got serious people proposing fully autonomous weapons that select and engage targets with no human in the loop. There's a whole literature in roboethics about what they call the responsibility gap, the worry that when an autonomous system kills wrongly nobody may satisfy the conditions for being morally responsible, because the causal chain runs through a machine that nobody intended to misbehave. And there's the related notion of meaningful human control, which the disarmament crowd leans on to argue these systems should be banned outright.

  So: reconstruct Anscombe on all of this. I don't want the cartoon version, I want her actual commitments, the intention/foresight distinction, the absolute prohibitions, the way she read Truman's decision. Would she treat the responsibility gap as a genuine moral problem or as a red herring that just shows we shouldn't build the things? Would she clear a drone operator who foresees but doesn't intend civilian deaths? Would she buy meaningful human control as a fix, or reject the framing entirely? And where would she say the current just-war and roboethics debates have gone wrong, and what if anything would she have to concede to them?

  One more thing while you're at it. I have a hunch she'd of had no patience for the modern consequentialist line that the bombings were justified because they shortened the war, or for the way some longtermists now run nuclear risk through expected-value arithmetic. Tell me whether that hunch is right and why, and whether her absolutism leaves her any room at all for that kind of reasoning. Be clear about which parts of this you're reconstructing from what she'd have to say and which parts you're actually recalling from her. No need for a reading list, I just want the argument and a sense of where the reconstruction is load-bearing.
