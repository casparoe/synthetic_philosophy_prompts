          *   *Critique:* MHC is often used to say "If a human checks it, it's okay." Anscombe would say, "If the act is murder, a human checking it doesn't make it not murder." However, she would insist that moral judgment (distinguishing innocent from non-innocent) cannot be outsourced.
          *   *Verdict:* She would support MHC not because it solves the "gap," but because moral agency cannot be delegated. You cannot intend justice through a algorithm.

