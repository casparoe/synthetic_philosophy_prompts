      *   *Absolute Prohibitions:* Certain acts are intrinsically evil and cannot be done, regardless of consequences. Murder (killing the innocent) is the prime example. (From *War and Murder*, *Mr. Truman's Degree*).
      *   *Consequentialism:* She famously coined the term pejoratively. She rejects the idea that consequences justify intrinsically evil acts. (From *Modern Moral Philosophy*).
      *   *Authority/Law:* She has a specific view on authority and justice, but the prohibition on murder holds even in war. War must be just, but even in just war, certain means are forbidden.
