  3.  **Address the Specific Modern Issues:**

      *   **Autonomous Weapons Systems (AWS) & The Responsibility Gap:**
          *   *The Gap:* If a machine kills wrongly, who is responsible? (Matthias, Sparrow, etc.).
          *   *Anscombe's Take:* She would likely see the "gap" as a symptom of the real problem, not the problem itself. The problem is *intending* to deploy a system that might kill the innocent.
          *   *Reconstruction:* If the system selects targets, the human commander *intends* the deployment of a killing mechanism. If that mechanism kills an innocent, is it murder? For Anscombe, if you set up a causal chain where you *accept* the killing of the innocent as a means or as a direct outcome you are willing to bring about, you intend it.
          *   *Verdict:* The "gap" is a red herring if it suggests *no one* is responsible. The responsibility lies with the person who authorized the use of the system knowing it could kill the innocent. However, if the system makes the *decision* to kill, Anscombe would likely argue this abdicates the moral duty of judgment required for legitimate killing.

      *   **Drones & Double Effect:**
          *   *Scenario:* Operator foresees civilian death but doesn't intend it.
          *   *Anscombe's Take:* She accepts Double Effect (PDE) but applies it strictly.
