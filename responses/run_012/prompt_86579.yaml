answer: |-
  The carving you are looking for exists, though it is split between moral philosophy, action theory, and social science. The most precise framework comes from **Jon Elster**, specifically his work on **state-dependent utility** and what he terms **"essentially by-product goods."**

  However, to give you the full "carving," we need to distinguish between three different mechanisms that produce this blockage. Your intuition is correct that the Toxin Puzzle is a neighbor, but not a twin. The impossibility in your two cases is deeper than the Toxin Puzzle because it is *constitutive* rather than *strategic*.

  Here is the breakdown of the concept, how it applies to your cases, and where the edges lie.

  ### 1. The Concept: Essentially By-Product States
  Jon Elster, in *Solomonic Judgments* and *Ulysses and the Sirens*, formalizes the observation that certain mental states or social goods cannot be brought about intentionally. If you make the attainment of the state your goal, the state vanishes.

  Elster distinguishes between:
  *   **Directly Actionable Goals:** States you can bring about by trying to bring them about (e.g., raising your arm).
  *   **Essentially By-Product States:** States that can only occur as a side effect of pursuing something else (e.g., falling asleep, being spontaneous, believing).

  This covers the general family you identified. However, Elster's carving lumps your two cases together. To answer your specific question about whether the impossibility is the "same kind," we need to look deeper into *why* the pursuit fails.

  ### 2. The Three Cases Carved Apart

  #### Case A: The Religious Believer (Epistemic Impossibility)
  *   **The Block:** **Doxastic Involuntarism.**
  *   **The Mechanism:** Belief is defined by its "direction of fit." Belief aims at *truth*, not *utility*. To believe $P$ is to hold that $P$ corresponds to reality. If you hold $P$ because holding $P$ yields a payoff, you are no longer treating $P$ as a fact about the world, but as a tool.
  *   **The Impossibility:** Conceptual/Logical. You literally cannot believe something *qua* belief if your primary reason for the belief is its benefit. The moment the benefit becomes the reason, the mental state shifts from "belief" to "hope" or "pretense."
  *   **Relation to Toxin:** Distinct. In the Toxin Puzzle, the intention is about a future *action*. In belief, the state is about a current *assessment of reality*.

  #### Case B: The Altruist (Normative/Axiological Impossibility)
  *   **The Block:** **The Stocker Objection (Motivational Purity).**
  *   **The Mechanism:** Michael Stocker (in *The Schizophrenia of Modern Ethical Theories*) argued that certain virtues are defined by their motive. To be "generous" is to give for the sake of the other. If you give for the sake of your own character improvement, you are engaging in a subtle form of selfishness (moral scorekeeping).
  *   **The Impossibility:** Normative/Definitional. The state (virtue) is defined by the absence of the very motive (reward-seeking) required to pursue it. Unlike belief, you *could* psychologically trick yourself, but the *value* of the state would be nullified. It is a failure of *worth*, not just existence.
  *   **Relation to Toxin:** Distinct. The Toxin agent fails to get the money because they are rational. The Altruist fails to get the virtue because they are *instrumental*.

  #### Case C: The Toxin Puzzle (Strategic Impossibility)
  *   **The Block:** **Dynamic Inconsistency.**
  *   **The Mechanism:** The billionaire pays for the *intention*, not the act. A rational agent knows that once the money is in the bank, drinking the poison is pure loss. Therefore, a rational agent knows they will not drink. Therefore, they cannot genuinely intend to drink.
  *   **The Impossibility:** Strategic/Rational. It is a failure of *binding*. The agent cannot credibly commit to a future action that will be irrational at the time of execution.
  *   **Relation to Your Cases:** This is the shallowest impossibility. It can theoretically be solved by pre-commitment devices (burning bridges, changing your own utility function). Your two cases cannot be solved by pre-commitment because the "trying" itself corrupts the state *in the present*.

  ### 3. Is the Impossibility the "Same Kind"?

  No. While they all fall under Elster's umbrella of **Essentially By-Product States**, the "friction" occurs in different places:

  1.  **Belief (Epistemic):** The friction is between **Truth and Utility**. You cannot traverse the gap between "this is useful" and "this is true" by an act of will. The state collapses because the *content* of the belief contradicts the *reason* for holding it.
  2.  **Virtue (Axiological):** The friction is between **Ends and Means**. In virtue ethics, the motive is part of the act's identity. Using virtue as a means to self-improvement destroys its status as virtue. The state collapses because the *structure* of the motivation contradicts the *definition* of the good.
  3.  **Toxin (Strategic):** The friction is between **Time Slices**. The "you" of tonight and the "you" of tomorrow have conflicting incentives. The state (intention) collapses because of *temporal inconsistency*, not because the state itself is corrupted by the desire for it.

  ### 4. A Proposed Carving: "Constitutive Barriers"

  If you wish to coin a term that captures your specific intuition (distinguishing it from the Toxin Puzzle), I suggest **"Constitutive Barriers to Pursuit."**

  This carving separates goals into two classes:
  1.  **Contingently Hard Goals:** Things that are difficult to achieve but can be pursued directly (e.g., running a marathon, solving a math problem). The Toxin Puzzle belongs near here (it's a commitment problem).
  2.  **Constitutively Blocked Goals:** Things where the *pursuit mechanism* negates the *goal conditions*.

  Within **Constitutively Blocked Goals**, you have two sub-types:
  *   **Epistemic Blocks:** Where the state requires ignoring the payoff (Belief).
  *   **Axiological Blocks:** Where the state requires the payoff to be irrelevant (Virtue/Spontaneity).

  ### Summary
  *   **Established Concept:** **Essentially By-Product Goods** (Jon Elster) or **The Paradox of Hedonism** (generalized).
  *   **Does it cover the Toxin Puzzle?** Loosely, yes, but decision theorists treat Toxin as a **Commitment Problem**, whereas your cases are **State-Definition Problems**.
  *   **Does it cover Spontaneity?** Yes. Spontaneity is the classic example of an essentially by-product state (trying to be spontaneous makes you calculated).
  *   **Is the impossibility the same kind?** No. Belief is blocked by **epistemic norms** (truth-tracking); Virtue is blocked by **axiological norms** (motive-purity); Toxin is blocked by **rational consistency** (time-preference).

  Your friend and your colleague are stuck in **Constitutively Blocked** states. The Toxin drinker is stuck in a **Strategically Blocked** state. The former requires *distraction* or *conversion* (looking away from the goal to achieve it); the latter requires *binding* (removing the ability to choose otherwise).
