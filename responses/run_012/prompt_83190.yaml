answer: |-
  Bottom line
  Focus on **Arbitrariness** and **Reaction to Deviation**. These two questions do the heaviest lifting. If the rule could have been otherwise, it's convention-shaped; if deviation invites blame rather than mere inconvenience, it's norm-shaped. Hammer this distinction on the board: "Is breaking this rule *wrong*, or just *clumsy*?" This forces students to abandon author labels and commit to whether the practice carries normative force or just coordinative utility.

  The tree
  **Root:** Observed Behavioral Regularity (people comply without direct force).

  **Node 1: Arbitrariness.** Could a different rule have solved the problem equally well?
  *   **Yes:** Go to Node 2 (Convention Path). *Case: Driving side.*
  *   **No:** Go to Node 4 (Norm Path). *Case: Burial rites.*

  **Node 2: Mental Representation.** Must agents represent others' expectations to comply, or could blind reinforcement learners converge here?
  *   **No:** **Leaf 1: Blind Regularity.** *Case: Footpath across a field.* **Awkward commitment:** Calls this a "norm" despite nobody having a thought about anyone else.
  *   **Yes:** Go to Node 3.

  **Node 3: Reaction to Deviation.** When someone breaks the rule, are they blamed or merely inconvenienced?
  *   **Inconvenienced:** **Leaf 2: Lewisian Convention.** *Case: Driving side.* **Awkward commitment:** Cannot explain why we feel angry, not just confused, when someone drives on the wrong side.
  *   **Blamed:** Go to Node 6 (Belief Check).

  **Node 4: Interest Structure.** Does compliance require sacrificing self-interest for the group (Conflict) or do interests align (Coordination)?
  *   **Align:** **Leaf 3: Coordination Norm.** *Case: Standing for an anthem.* **Awkward commitment:** Treats symbolic unity as a coordination problem solvable by any symbol.
  *   **Conflict:** Go to Node 5.

  **Node 5: Motivation Source.** Is compliance driven by internal guilt (it's wrong) or external fear (I'll be punished)?
  *   **External:** **Leaf 4: Coercive Rule.** *Case: Dead letter rule (if enforced).* **Awkward commitment:** Counts a rule as existing even if everyone hates it and only follows it under threat.
  *   **Internal:** **Leaf 5: Moral Norm.** *Case: Burying the dead.* **Awkward commitment:** Cannot explain why these norms vary by culture if they are internally grounded.

  **Node 6: Belief Accuracy.** (Reached via Arbitrary + Blame). Do agents correctly believe others approve of the rule?
  *   **Yes:** **Leaf 6: Normative Convention.** *Case: Tipping in a one-off visit.* **Awkward commitment:** Implies you can have a norm without anyone actually caring about the underlying value.
  *   **No:** **Leaf 7: Pluralistic Ignorance.** *Case: Hated college tradition.* **Awkward commitment:** The norm exists only because everyone is wrong about everyone else's beliefs.

  This structure yields seven leaves from six nodes. It sorts the "teeth" (Blame vs. Inconvenience) separately from the "source" (Arbitrary vs. Non-arbitrary). The Pluralistic Ignorance leaf captures the specific case where compliance is robust but the support is illusory. The Dead Letter case is forced into Coercive Rule to show the limit of "social" ontology—if only the state enforces it, is it social? The Footpath case tests whether ontology requires minds or just behavior. By answering these sequentially, students cannot hide behind "Lewis says X"; they must admit whether their view allows for blame without arbitrariness or norms without mental states.

  Branches nobody's standing in
  Two combinations remain empty. First, **Non-Arbitrary + Blind Regularity** (Node 1 No, Node 2 No). Nobody defends "Blind Moral Norms." If a rule isn't arbitrary (e.g., burial), it presumably carries meaning requiring representation. A population of dumb learners might make a footpath, but they cannot sustain a burial rite without representing the dead. This view is likely incoherent: non-arbitrary rules imply reasons, and reasons require minds.

  Second, **Arbitrary + Blame + Accurate Beliefs + No Representation** is impossible by definition (Node 3 Yes requires Node 2 Yes). You cannot blame someone for violating an expectation you don't hold. The **Dead Letter Rule** (nobody follows) technically falls off the root, as there is no regularity. It sits in an empty space because it lacks the compliance required for social ontology. It is unexplored because most theorists define norms by practice, not text.

  Pairs the tree can't split
  The tree struggles to separate **Leaf 5 (Moral Norm)** from **Leaf 6 (Normative Convention)**. Both involve blame, internal motivation, and often non-arbitrary content (e.g., tipping vs. stealing). A student could argue tipping is moral. To split them, add a question: **"Is the rule authority-independent?"** Moral norms hold even if society vanishes; conventions vanish with the group. Without this, the tree lumps substantive moral commitments with heavy social conventions, obscuring whether the "ought" comes from humanity or membership.

  If I have to cut it to five questions
  Drop **Node 2 (Mental Representation)** and **Node 6 (Belief Accuracy)**. Merge the Blind Regularity leaf into Lewisian Convention, assuming coordination implies some expectation. Drop the Pluralistic Ignorance leaf, treating it as a unstable version of Normative Convention. This sacrifices the psychological depth (do agents need minds?) and the epistemic nuance (do agents know the truth?). You keep the structural distinctions (Arbitrariness, Interests, Reaction, Motivation) which are sufficient to separate Driving from Burial, but you lose the ability to diagnose the Hated Tradition case specifically.
