answer: |-
  Your confusion is well-founded, but it stems from a shift in registers rather than a simple logical contradiction. The university's practice operates on a **Ledger Theory of Moral Responsibility**. This theory treats emissions not as physical causants of harm, but as fungible accounting units assigned to agents for bureaucratic management. Under this view, responsibility is not about whether your specific flight warmed the planet (causal efficacy), but whether your account is balanced (compliance). The "negligible" claim addresses causal physics to prevent individual guilt paralysis; the "offset" claim addresses institutional budgeting to maintain operational continuity. The practice presupposes that moral debt can be discharged via market transaction regardless of the physical reality of the emission, and that counterfactual reductions (offsets) are morally equivalent to actual reductions.

  This package strictly requires three commitments. First, **fungibility**: a ton of CO₂ here is interchangeable with a ton not emitted there. Second, **transactional clearance**: moral status changes upon payment, not upon physical remediation. Third, **institutional agency**: the university, not the individual, is the primary moral agent responsible for balancing the ledger. The practice fits comfortably with utilitarianism (if offsets maximize good) or weak individualism (if individuals shouldn't bear systemic burdens), but it does not require them. It quietly rules out strict causal responsibility (where you must undo *your* specific physical harm) and virtue ethics (where participating in harmful structures corrupts character regardless of payment).

  The practice is philosophically underdetermined because it does not specify *why* the offset works. It could be because the offset prevents harm elsewhere (consequentialist), because it fulfills a duty to contribute to a collective scheme (fairness), or simply because it satisfies a regulatory requirement (legalism). All three license the same behavior. Consequently, the practice cannot tell us which theory is true, only that the transaction must clear.

  Regarding the contradiction: The institution can coherently say "your flight is negligible" and "here is the price of your flight" only if it distinguishes **causal impact** from **accounting liability**. The former is about physics; the latter is about policy. However, this is pragmatically dissonant. It tells faculty they are causally impotent but financially liable. If you swap this for a **Complicity View**—where the wrong lies in participating in a harmful structure regardless of marginal impact—the consequences are concrete. The university would have to stop buying offsets for travel and instead implement hard caps or bans. The messaging would shift from "climate-neutral" to "harmful but necessary," acknowledging the moral residue. The budget line for offsets would be redirected to structural decarbonization (e.g., retrofitting buildings), and individual choices would be framed as normative signals rather than rounding errors.

