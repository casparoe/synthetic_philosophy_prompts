          5.  Offsets bought are avoided-deforestation credits (counterfactual baselines, not physical quantities).
          6.  Once the invoice clears, the trip is "clean."
      *   **The Tension:** The official line says individual contributions are negligible (causally inert), but the offset practice treats individual contributions as precise moral quantities that can be cancelled out by payment.
      *   **Task:** Reconstruct the theory of moral responsibility underlying this practice. Determine if it's inconsistent or if I'm conflating questions. Separate strict presuppositions from merely compatible views. Identify underdetermination. Give a verdict on the contradiction. Explain what would change under a rival view (complicity).
      *   **Constraints:**
