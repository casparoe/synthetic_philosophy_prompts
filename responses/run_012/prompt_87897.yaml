          *   "presupposed_view" max 120 words.
          *   "confidence" integer 1-5.

  2.  **Deconstruct the Practice & Philosophy:**
      *   **Claim A (Causal Negligibility):** "Your flight changes nothing." This aligns with *causal impotence* arguments common in collective harm problems (e.g., Nefsky, Sinnott-Armstrong). The marginal impact of one flight on climate change is effectively zero.
      *   **Claim B (Accounting/Moral Cancelling):** "Pay $X per ton, and the trip is clean." This aligns with *carbon accounting* and a *transactional* view of responsibility. It treats emissions as a debt that can be settled.
      *   **The Offset Nature:** Avoided deforestation. This is counterfactual. It's not removing the CO2 emitted; it's claiming someone else emitted less than they would have. This adds a layer of abstraction.
      *   **The Tension:** If my flight causes no harm (Claim A), why do I need to pay to offset it (Claim B)? If my flight *does* cause harm sufficient to require offsetting, then Claim A is misleading or false regarding moral significance.
      *   **Reconstructing the Theory:** The practice seems to rely on a *hybrid* view that shifts registers.
          *   *Register 1 (Motivation/Policy):* Consequentialist/Collective. Individual actions don't trigger climate catastrophe alone. Don't guilt-trip individuals into thinking they save the world by skipping. Focus on systemic change.
          *   *Register 2 (Accounting/Compliance):* Deontological/Transactional. Institutions have budgets and limits. Emissions are ledger entries. To stay within a "neutral" budget, entries must be balanced.
      *   **Strict Presuppositions:**
          1.  Emissions are fungible commodities (tons are interchangeable).
          2.  Moral/Climate debt can be discharged via financial transaction (offsets).
          3.  Institutional responsibility is distinct from individual causal impact (the institution pays, not the person, effectively).
          4.  Counterfactual reductions (offsets) are equivalent to actual reductions for accounting purposes.
      *   **Merely Compatible:**
          1.  Individual causal impotence (the "negligible" claim).
          2.  Complicity theory (maybe the offset buys out complicity?).
          3.  Utilitarianism (if offsets maximize good).
      *   **Ruled Out:**
          1.  Strict causal responsibility (if I caused it, I must undo *that* specific physical harm).
          2.  Virtue ethics focused on personal integrity (if flying is intemperate, paying doesn't fix the character flaw).
          3.  Radical individualism (where individual action is the *only* thing that matters).
      *   **Underdetermination:** The practice doesn't specify *why* the offset works. Is it because it prevents harm elsewhere? Or because it signals commitment? Or because it balances a budget?
      *   **Verdict on Contradiction:** It's a *category error* or *register shift* rather than a logical contradiction, but it borders on inconsistency. It treats emissions as physically negligible for motivation but morally precise for accounting. This is "resolvable by distinguishing two claims" (causal impact vs. institutional accounting duty).
      *   **Rival View (Complicity):** If the wrong is complicity in a harmful structure, offsets don't fix it. You must exit the structure.
          *   *Changes:* Cut travel, don't offset. Admit individual participation matters symbolically/normatively. Stop calling it "neutral."

  3.  **Drafting the Prose:**
