prompt: |-
  I'm a retired atmospheric chemist — 35 years on aerosol transport and deposition models, and now that I've got the time I've been sitting in on philosophy seminars at the local university, mostly ethics and social philosophy. Which is how I ended up on my old department's sustainability committee, and how I ended up confused. Here's the practice I want you to pick apart. The university's climate plan treats faculty air travel as its single biggest emissions line, and instead of cutting the travel it buys certified carbon offsets for every flight, then books the travel as climate-neutral. Same committee's own report tells us, in plain language, that one person's flying changes nothing — the atmosphere doesn't care about my 1.2 tons, my skipping the conference would be invisible in any emissions inventory, so the real action is policy and collective. Yet the offset purchase treats precisely that 1.2 tons as the exact quantity of moral work that needed doing, at a posted price per ton, and once the invoice clears we call the trip clean. There's a matching split on food: the dining halls dropped beef, but when a grad student asked whether her own burger order mattered, the official answer was no, one purchase is a rounding error in a supply chain. And here's the wrinkle that made me doubt the whole apparatus: the offsets the university actually buys are avoided-deforestation credits whose tonnage is computed against a modeled baseline — so the thing being bought and retired isn't a physical quantity at all, it's a counterfactual one, an estimate of emissions that would have happened under a scenario that didn't. I genuinely can't tell whether the two attitudes are flatly inconsistent or whether I'm conflating two different questions, and I'd rather you tell me what the whole package presupposes than have me guess.

  So treat that package — offsets-for-flights, the price per ton, the neutrality claim, plus the official line that individual actions are negligible — as a single practice, and reconstruct the theory of moral responsibility it only makes sense under. Does it presuppose that an individual's contribution to a collective harm is wrong in proportion to its marginal causal effect, so that an offset can literally cancel my contribution and leave me at zero? Or does it presuppose something else entirely — that the wrong is complicity in a harmful practice, or failing to do my share, or participating in an unjust structure — in which case the offset is a side-payment that addresses the tonnage but not the thing that was actually wrong, and the "it doesn't matter" line is either false or quietly about something other than wrongness? Be careful to separate what the practice strictly requires from what it merely fits comfortably with, and tell me where it's philosophically underdetermined — where several rival theories would all license exactly this behavior, so that the practice can't tell us which one is true. Then give me a verdict on the apparent contradiction: can the same institution coherently say "your flight is negligible" and "here is the price of your flight"? And if I swapped the presupposed view for the strongest rival — say, a complicity view on which the wrong lies in joining the practice rather than in the tonnage, so that no amount of purchasing undoes it — what concretely would have to change about how the university runs its climate plan and what it tells its faculty and students?

  Don't send me to the literature; I can find that on my own, and I want your reconstruction, not a reading list. Please write in American English, and seperate your prose answer from a short structured summary at the end, given as a JSON object with exactly these fields: "practice_analyzed" (one sentence naming the practice); "presupposed_view" (the implicit theory of individual responsibility, 120 words max); "strict_presuppositions" (array of the commitments the practice cannot survive without); "merely_compatible_with" (array of views it fits but does not require); "ruled_out" (array of rival views the practice quietly excludes); "underdetermined_because" (string); "inconsistency_verdict" (one of: genuine inconsistency, resolvable by distinguishing two claims, not an inconsistency at all); "inconsistency_explanation" (string); "rival_view_consequences" (array of the concrete changes under the complicity view); and "confidence" (integer 1-5 for how confident you are in the main verdict).
