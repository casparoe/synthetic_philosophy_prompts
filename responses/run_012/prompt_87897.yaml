          3.  Strict Presuppositions vs. Compatible Views.
          4.  Underdetermination.
          5.  Verdict on Inconsistency.
          6.  Rival View Consequences.
      *   *Key Insight:* The university is operating on a *fiduciary/accounting* model of ethics, not a *causal* model. The "negligible" claim is about *physics/causality*. The "offset" claim is about *compliance/budgeting*. They are talking past each other. The underlying theory is "Institutional Clean Hands via Market Mechanism."

