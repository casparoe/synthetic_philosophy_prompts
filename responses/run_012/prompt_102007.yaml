answer: |-
  The cooling units in the basement of the Bureau of Experiential Equity hummed with a sound that felt like a headache waiting to happen. Elias rubbed his temples, the fluorescent light reflecting off the laminate of his desk. Across from him, Sela tapped her stylus against her tablet, the rhythm impatient, staccato.

  On the main screen between them, the ledger for Proposal 89-B glowed.

  "Forty-two million citizens," Sela said, her voice flat. She didn't look up. "Projected gain: 0.04 Standard Utility Units per capita, annually. Duration: twenty years."

  Elias leaned forward. "Source of the gain?"

  "Optimization of the nutrient synthesis grid. The new paste has a 12% higher palatability rating. Reduced gastric distress. Marginal mood elevation associated with meal satisfaction."

  Elias nodded. He knew the math. Forty-two million times 0.04 times 365 times 20. It was a mountain of green credits. A skyscraper of mild contentment. On the screen, the column for 'Aggregate Benefit' shimmered with a golden hue, the number scrolling so fast it blurred.

  "And the cost?" Elias asked.

  Sela swiped the screen. The golden column vanished, replaced by a single, stark row.

  "Subject 449. Maintenance technician on the synthesis hub. Containment breach during the retrofit."

  Elias looked at the readout for Subject 449. It wasn't a scrolling number. It was a waveform. A jagged, violent spike that hammered against the top of the graph. The color was a deep, bruised purple.

  "Duration?"

  "Indefinite," Sela said. "Neural feedback loop locked in the spinal column. He's conscious. He's in a medical coma, but the pain receptors are firing at maximum capacity. We can't turn it off without shutting down the hub."

  "And if we shut down the hub?"

  Sela gestured to the golden column that had vanished. "We revert to the old grid. The forty-two million go back to the unpalatable paste. The gastric distress returns. The mood elevation drops."

  Elias stared at the purple spike. In the Bureau, they used the Calibrator to convert experience into currency. Mild pains were easily offset. A headache for a thousand people could be traded against a vacation for one. A broken leg could be balanced by a year of salary. The Calibrator found the exchange rate. It was how they governed.

  But there was the Protocol. Section 9, Paragraph 4. The Lexical Limit.

  "You can't run the trade," Elias said.

  Sela stopped tapping her stylus. "Why not?"

  "Look at the intensity rating. It's a Class 10. That's above the Threshold."

  "It's just a number, Elias," Sela said, leaning back. "It's high, yes. But it's finite. Neurons firing. Chemical signals. There is a quantity of mild pleasure that outweighs it. We just haven't calculated high enough."

  "It's not about calculation." Elias tapped the glass over the purple spike. "It's about kind. Below the line, suffering is a debt. Above the line, it's a crime. You can't pay off a crime with loose change, no matter how much you pile up."

  "Loose change?" Sela's voice sharpened. "Forty-two million people. Twenty years. That's not loose change. That's a civilization's worth of Tuesday nights. Of dinners where the family isn't wincing. Of children who don't cry from stomach cramps."

  "And one man who screams without a voice," Elias countered. "If you approve this, you are saying his scream is worth less than their indigestion."

  "I'm saying the sum of their comfort is greater than the sum of his agony. That's the mandate. Maximize the net."

  "The mandate has a caveat. The Threshold."

  "The Threshold is a heuristic," Sela snapped. "It's there because people get squeamish. We're built to panic when we see one person torn apart. We're not built to panic when we see a million people slightly annoyed. The Calibrator corrects for our biology. It forces us to see the total."

  Elias stood up and walked to the server rack. The hum was louder here. "If I put a gun to your head, that's a Class 8. If I put you in a vice that crushes your skull over six hours, that's a Class 9. Subject 449 is a Class 10. That is the point where the mind breaks. Where value breaks. If you try to convert that pain into Utility Credits, the system shouldn't allow it."

  "It already did," Sela said. She turned the tablet toward him.

  On her screen, the Calibrator had run a simulation. It had taken the Class 10 pain and attempted to dissolve it into the Aggregate Benefit column.

  The number was negative. A vast, dark negative.

  "See?" Sela said. "Even with the Threshold weighting, the math holds. The millions outweigh the one. If we shut down the hub, the net loss of utility is greater. We are morally obligated to keep him in the loop."

  "You're treating him as a container," Elias said, his voice quiet. "If he were a bucket of water, sure. Pour him out to water the fields. He's a person. The Threshold isn't a wall we built. It's a wall we found. It's the edge of what can be traded."

  "It's an artifact of your empathy," Sela said. "You're prioritizing the visible victim over the invisible masses. That's bias. The Bureau exists to remove bias."

  "The Bureau exists to measure value," Elias said. "If your measurement says a mountain of feathers weighs more than a lead ball, your scale is broken."

  "The scale works. You just don't like the weight."

  Sela reached for the 'Authorize' key. It was a physical switch, covered by a plastic guard.

  Elias put his hand on the desk, blocking her. "Don't."

  "If I don't, the system logs a delay. Delay triggers an audit. Audit freezes the grid. The forty-two million lose the upgrade today."

  "Then let them lose it."

  "Forty-two million, Elias."

  "One man."

  They stood there, the hum of the servers filling the silence. The screen between them flickered. The Calibrator was attempting to finalize the transaction. It was trying to find a common denominator between 'Agony' and 'Palatability.'

  A dialogue box popped up on the main monitor.

  **ERROR: CANNOT RESOLVE UNITS.**
  **CLASS 10 EXPERIENCE NON-FUNGIBLE.**
  **PLEASE DOWNGRADE INTENSITY OR ISOLATE SUBJECT.**

  Sela frowned. She typed rapidly. "Override. Administrative Code 99."

  She hit enter.

  The error message blinked, then changed color from red to amber.

  **WARNING: LEXICAL INTEGRITY COMPROMISED.**
  **PROCEEDING WITH FORCED CONVERSION.**

  A progress bar appeared. It moved slowly, jerking forward in uneven spasms. 10%... 20%...

  "It's fighting," Elias said.

  "It's calculating," Sela corrected. "It's finding the exchange rate. It's saying that 14 million years of mild stomach ache equals one hour of this."

  "That's absurd."

  "That's arithmetic."

  The progress bar hit 90%. Then it stopped. The cursor blinked. The number in the 'Net Value' field began to fluctuate. It wasn't settling. It was oscillating between a massive positive and a massive negative, unable to find equilibrium. The golden column and the purple spike seemed to bleed into each other on the screen, the colors muddying into a grey static.

  The hum of the servers pitched up, becoming a whine.

  "Force it," Elias said, though he didn't move to help her.

  "I am," Sela said. Her hand hovered over the 'Enter' key. "It just... it won't lock."

  "Maybe it can't."

  "It's a machine, Elias. It does what it's told."

  "Then why is it shaking?"

  Sela looked at the screen. The numbers were blurring. The Calibrator was designed to output a single decision: *Approve* or *Deny*. But the field for the decision remained empty. The system was trying to sum the unsummable. It was trying to find the price of a soul in terms of flavor enhancement, and the logic gates were overheating.

  A light on the console blinked red. **THERMAL THROTTLE.**

  "It's going to crash," Sela said. "If it crashes before authorization, the default protocol kicks in."

  "What's the default?"

  "Status quo. Hub remains active. Subject 449 remains in the loop."

  Elias looked at the purple spike. It hadn't moved. It didn't care about the crash. It just was.

  Sela's hand trembled. She looked at Elias, then at the screen. "If I walk away, he stays in pain. If I walk away, forty-two million get better meals."

  "If you press that key, you say the pain doesn't matter."

  "If I don't press it, I say the meals don't matter."

  The whine from the servers grew louder. A smell of ozone drifted from the tower. The progress bar was stuck at 99%. The 'Net Value' field was now just a cascade of random characters.

  **#%&@! NULL **

  Sela pulled her hand back. She didn't press the key. She didn't walk away. She just sat there, watching the machine fail to do the one thing it was built to do.

  Elias sat down again. He picked up his coffee, but it was cold.

  "What do we do?" Sela asked. Her voice was small, stripped of the earlier certainty.

  Elias looked at the frozen screen. The purple spike hung there, suspended in the digital amber, screaming silently into the void of the ledger. The golden mountain was gone, erased by the error. There was no sum. There was no comparison. There was just the machine, stalling on the edge of the abyss.

  "We wait," Elias said.

  "For what?"

  "For someone to come down from upstairs. They won't care about the threshold. They won't care about the sum."

  Sela looked at him. "Then what will they care about?"

  Elias watched the cursor blink. It was a steady, rhythmic pulse. Like a heartbeat. Or a timer.

  "They'll care about the budget," he said. "They'll care that the hub is already built. They'll care that Subject 449 is already broken."

  The screen flickered again. The error message vanished, replaced by a simple prompt, generated by a sub-routine that didn't measure value at all.

  **ACTION REQUIRED: MAINTENANCE SCHEDULE CONFIRMATION.**
  **[YES] / [NO]**

  Sela stared at the prompt. It didn't ask about the pain. It didn't ask about the meals. It asked about the schedule.

  Her finger moved toward the mouse.

  Elias didn't stop her. He just watched the purple spike in the reflection of the monitor, wondering if it would still be there after she clicked.
