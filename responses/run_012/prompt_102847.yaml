prompt: |-
  I'm an MA student in Chinese philosophy and I've got to hand in a short research proposal for my term paper (about 5,000 words, one semester) by the end of the week, and I keep going round in circles. Everyone tells me to write on the white horse dialogue and the School of Names, which is fine, but the standard question — was Gongsun Long doing logic or just sophistry? — feels like it's been answered to death, and every answer just re-describes the same few moves. My half-formed idea is that the whole debate is stuck because both sides treat the pivot of the argument as the word 'not': is it the 'not' of non-identity, or the 'not' of failing to be a member of a class? But I suspect the real hinge is that the text uses 'horse' in two different ways without ever flagging it — once as a kind or shape that you can pick out with no colour in the picture at all, and once as a determinate, countable thing you could actually ride or feed — and that if you prise these apart, the paradox stops being a paradox and turns into a much more interesting claim about what a sortal term like 'horse' is doing when it names a kind rather than a thing. I had an argument about this with a flatmate who does analytic metaphysics and he just kept saying it's the old mass-noun/count-noun business and that I'm basicly reinventing the wheel, which may be fair, but I don't think it is, because mass and count are a grammatical distinction and what I'm after is more like a difference between what a term picks out when it's used to classify and when it's used to refer. I should say I can't cite anything properly yet, so please don't give me a bibliography or a literature review — just refer to positions and arguments and I'll chase up the references myself.

  What I actually need is the proposal: state the question so that it has a determinate answer (something along the lines of 'which of two readings of the term "horse" in the dialogue makes the argument valid, and does the text itself decide between them?', though I'm happy for you to sharpen it), and explain why the existing answers — the logic reading, the sophistry reading, the nominalist reading, whatever else is genuinely in play — leave it open rather than already settled. Then the method: what I'd actually do, month by month, both with the text and with the secondary positions, and why that beats the obvious alternative of just doing a close reading and declaring a winner. Then say what a result would look like, which considerations would decide between the readings, and what would count as the project failing — e.g. if the two readings turn out to make no difference to any other passage in the corpus, that's probably a fail — and be honest about whether it's too big or too small for one semester. Two pages or so is fine.
