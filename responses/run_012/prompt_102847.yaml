answer: |-
  **Title:** Sortal Shifts in the *Bai Ma Lun*: Resolving the Equivocation of 'Horse' between Kind and Particular

  **Research Question**
  Standard interpretations of Gongsun Long's *White Horse Dialogue* stall on a binary: was he a proto-logician exposing formal relations, or a sophist exploiting linguistic ambiguity? Both camps largely agree that the pivot of the argument rests on the particle *fei* ('not'), debating whether it signifies non-identity or class exclusion. This proposal argues that this focus is secondary. The primary engine of the paradox is not the negation, but the term *ma* ('horse'). My research question is: **Does the argument of the *Bai Ma Lun* rely on an unmarked semantic shift in the term 'horse' between its use as a morphological kind (a shape without colour) and its use as a determinate particular (a countable entity), and does the text provide internal markers that validate this shift rather than treating it as a fallacy?**

  If this hypothesis holds, the dialogue is neither strict formal logic nor mere trickery, but a deliberate investigation into the ontology of sortal terms—specifically, how a term functions differently when naming a form versus referring to an object.

  **State of the Field and Problem Statement**
  Current scholarship is entrenched in two positions. The 'Logic' reading (often associated with analytic reconstructions) treats the text as a valid syllogism provided one accepts specific premises about identity and composition. The 'Sophistry' reading treats the argument as a fallacy of equivocation, where Gongsun Long surreptitiously changes definitions to win a debate. A third, 'Nominalist' reading suggests the text denies the reality of universals altogether.

  All three positions share a weakness: they assume the term 'horse' retains a stable semantic value throughout the dialogue, or if it shifts, that the shift is illegitimate. They focus on the *fei* ('not') because it is the explicit operator of the conclusion ("A white horse is not a horse"). However, this ignores the user's insight that the subject term itself is unstable. My flatmate's objection—that this is merely a mass/count noun distinction—is grammatical, whereas my proposal is semantic and ontological. The question is not whether Classical Chinese marks plurality (it does not), but whether *ma* picks out a *kind* (the shape of a horse) in the premises and a *particular* (the animal you ride) in the conclusion. Existing literature leaves this open because it prioritizes reconstructing the argument's validity over analyzing the semantic behaviour of the subject term. By shifting focus from the negation to the noun, we can bypass the stalemate.

  **Methodology**
  Given the 5,000-word limit and one-semester timeframe, the project will proceed in three phases:

  *   **Month 1: Textual Mapping and Positional Analysis.** I will produce a line-by-line annotation of the *Bai Ma Lun*, tagging every instance of *ma* ('horse') and *bai* ('white'). Simultaneously, I will map the major secondary positions (Logic vs. Sophistry) not by their conclusions, but by their implicit assumptions about what 'horse' refers to in line 1 versus line 10. This avoids a full literature review and focuses on their hermeneutic commitments.
  *   **Month 2: Developing the 'Kind/Particular' Framework.** I will articulate the distinction between 'horse-as-kind' and 'horse-as-particular' using resources from the philosophy of language (sortal terms, reference vs. predication) without imposing anachronistic Western categories. I will test this framework against the text: does reading *ma* as 'kind' in the premise ("White horse is not horse") make the claim true, while reading *ma* as 'particular' makes it false? Crucially, I will look for textual 'flags'—contextual cues in the dialogue where the interlocutor talks about riding or feeding (particulars) versus talking about naming or seeking (kinds).
  *   **Month 3: Synthesis and Writing.** I will draft the paper, arguing that the text *intends* this shift. The argument will not be that Gongsun Long was confused, but that the dialogue is performative: it forces the reader to experience the slippage between naming a form and referring to a thing.

  This method beats a standard close reading because a standard reading assumes terminological consistency. By assuming *inconsistency* as the primary object of study, we avoid the trap of trying to "fix" the argument to make it valid or invalid. We instead explain *why* it feels paradoxical.

  **Expected Results and Failure Conditions**
  A successful outcome will demonstrate that the 'Kind/Particular' distinction resolves the paradox more elegantly than the 'Identity/Membership' distinction. It should show that the text itself contains internal evidence (e.g., shifts in context from abstract naming to concrete action) that licenses the shift in meaning.

  **Failure Conditions:**
  1.  **Textual Insufficiency:** If the text provides no internal markers to distinguish the two uses of 'horse', and the distinction relies entirely on external philosophical imposition, the project fails. It would mean I am rewriting Gongsun Long rather than interpreting him.
  2.  **Corpus Isolation:** As per my own criteria, if this reading of 'horse' makes sense in the *Bai Ma Lun* but contradicts how *ma* is used in other *Mojing* canons or contemporary Warring States texts (e.g., *Xunzi*'s critiques of the School of Names), the interpretation is likely anachronistic. I will use a limited sample of comparative passages as a stress test.
  3.  **Triviality:** If the distinction collapses back into the flatmate's 'mass/count' objection without adding philosophical weight regarding sortals and reference, the project lacks novelty.

  **Feasibility**
  For a 5,000-word term paper, this scope is appropriate. It is narrow enough to avoid a general history of the School of Names but significant enough to contribute to the specific debate on the *Bai Ma Lun*. The risk is getting bogged down in linguistic technicalities regarding Classical Chinese grammar. I will mitigate this by keeping the focus on the *philosophical function* of the terms rather than philological reconstruction. The project is viable because it does not require solving the whole of Chinese metaphysics, only demonstrating that one specific semantic ambiguity is the key to the dialogue's coherence.
