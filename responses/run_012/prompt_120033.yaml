answer: |-
  1. In my novel, long-haul travellers are relayed through six stations, each re-encoding the pattern; if we increased this to forty, so the arrival remembers the departure only as a rumour, does the relation that matters survive intact, or does it fade?
     *Designed to force:* An admission that psychological connectedness comes in degrees.
     *Follow-up:* If it fades, must we accept that a man who steps off after forty relays is less entitled to his own life than the man who stepped in?

  2. If you say survival comes in degrees, at what point does the traveller cease to be the person who matters, and who has the authority to draw that line?
     *Designed to force:* An admission that the theory lacks a clear practical threshold.
     *Follow-up:* If you cannot name the point, are you not leaving vital human rights to administrative discretion?

  3. A woman records her pattern at thirty and activates the archive as she dies at seventy; the replica wakes believing herself thirty. Why should the dying woman care about *that* stranger's future rather than her own end?
     *Designed to force:* An admission that special concern for one's future self is hard to justify on this view.
     *Follow-up:* If you say she shouldn't care, are you advising us to stop loving our future selves?

  4. If psychological continuity is all that matters, and a stranger on the street shares more of my psychology than my future self will, do I owe him more than I owe myself?
     *Designed to force:* An admission that the view implies radical impartiality.
     *Follow-up:* If you deny this, aren't you smuggling the very notion of identity back into your account?

  5. My narrator is the wife left behind; she insists she is widowed while your view insists her husband survives. Is her grief anything more than a cognitive error about the facts?
     *Designed to force:* Him to characterize grief as a mistake based on false metaphysical beliefs.
     *Follow-up:* If it is an error, what is the correct fact she is missing, given you say there is no fact of identity?

  6. You describe these cases from the outside, but grief is felt from the inside; is your account compatible with the first-person experience of loss, or is it written from nowhere?
     *Designed to force:* An admission that the theory conflicts with lived experience.
     *Follow-up:* If it conflicts with experience, why should experience yield to theory rather than vice versa?

  7. In the relay system from my first thread, suppose one station broadcasts to two receivers so that two copies exist before the original is destroyed; is there a fact of the matter as to which one is he?
     *Designed to force:* The "no further fact" reply regarding identity.
     *Follow-up:* If there is no fact, on what basis do we charge one with his crimes and not the other?

  8. If there is no fact of the matter, does it follow that assigning his debts to either copy is arbitrary, like flipping a coin?
     *Designed to force:* An admission that justice becomes arbitrary under this view.
     *Follow-up:* Can a theory of survival justify arbitrary punishment, or does that undermine the theory itself?

  9. You say there is no fact, yet you advise courts and wives on how to act; doesn't the necessity of action create the fact you deny?
     *Designed to force:* Him to acknowledge that practice requires binary decisions.
     *Follow-up:* If practice requires facts, isn't your metaphysics irrelevant to living?

  10. If there is no fact of the matter, then my narrator is not mistaken to grieve; by telling her she is, aren't you claiming the very fact you say does not exist?
      *Designed to force:* A performative contradiction that blocks the "no further fact" evasion.
      *Follow-up:* Then admit her psychology is valid, and withdraw your claim that she is wrong.
