  I'm a second-year PhD student in philosophy of biology, working on a chapter about what heritability does and doesn't mean, and I want to use the Burt affair as my case study. You're a philosopher of science who actually knows quantitative genetics -- think it through carefully before you start writing.

  The episode, quickly, so were on the same page: Burt was the British psychologist whose twin studies of IQ were the flagship evidence for a high heritability of intelligence for decades, and shortly after he died in the early 70s the data turned out to be at least partly fabricated -- correlations for separated twins that don't correspond to any real subjects, and so on. The field took a serious reputational hit.

  Now run the episode through the concept itself. Heritability is a variance ratio inside a population at a time -- genetic variance over phenotypic variance -- and it licenses almost none of the inferences people wanted out of it: nothing about individuals, nothing about malleability, nothing about what causes differences between groups, nothing about how 'innate' a trait is. So which of the claims Burt's work was doing rhetorical work for were well-formed statements about heritability, and which were category errors the concept never supported in the first place? Which assumption in the standard ACE setup was his data really carrying -- equal environments, additivity, no gene-environment correlation? And what exactly did the fabrication threaten: the number, the research programme, or just the man?

  Then the part I actually care about. The estimates he reported landed in roughly the same range as what the later, cleaner twin studies found. Does that vindicate the programme, or does it show the coefficient is so underdetermined by data that the same value falls out of good and bad designs -- compatible with wildly different underlying causal stories, so that agreement across studies is evidence of nothing? Push the norm-of-reaction / analysis-of-variance line here and tell me where I'm overreaching if I push it that far.

