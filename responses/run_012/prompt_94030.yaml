          *   Must include "Graded Luminosity" proposal.
          *   Must flag non-negotiable vs. house preferences.
          *   Must identify the single requirement that excludes the most popular candidates.
          *   Must explicitly flag incompatible requirements (specifically suspecting Phenomenal vs. Incremental).
