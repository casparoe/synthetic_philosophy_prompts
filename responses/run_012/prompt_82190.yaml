      *   *The Crack:* "Arbitrary" is much broader than "undetectable." Math studies structures invariant under *logical* relabeling. Physics studies structures invariant under *physical* gauge transformations. The coincidence is that physical gauge transformations turn out to be a subset of logical isomorphisms. But why do the *rich* structures studied by logicians (who don't care about physics) match the *rich* structures of physics?
      *   *The "Reflex":* The user admits they want to say "the structure was there all along." I need to tell them this is a symptom of insulation. It prevents the theory from taking risks.

