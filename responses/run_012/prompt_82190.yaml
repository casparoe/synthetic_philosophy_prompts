          *   *Target:* Predictive Surplus.
          *   *Critique:* The user's view explains why *some* math fits physics (the invariant stuff). It doesn't explain why *esoteric* math fits physics. The "selection pressure" on math is usually aesthetic or internal consistency, not physical invariance.
