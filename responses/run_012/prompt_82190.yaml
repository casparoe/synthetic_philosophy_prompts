          *   *The Reflex:* "The structure was there all along." This is the danger zone. It turns the theory into a post-hoc rationalization.
      *   *Section 3: The "Sympathetic Critic" Perspective.*
          *   Focus on the gap between *abstract* structuralism and *specific* mathematical content.
