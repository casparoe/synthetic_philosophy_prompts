      *   *Weaknesses (admitted by user):* Predictive surplus (Wigner's point about math developed *a priori* fitting physics later).

  3.  **Brainstorming Objections (Categorized by Effectiveness):**

      *   *Category 1: The "Predictive Surplus" Problem (High Impact)*
