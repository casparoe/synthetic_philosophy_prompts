  1.  **Analyze the Request:**
      *   **Role:** Philosopher of technology and conceptual engineer.
      *   **Task:** Write desiderata (requirements) for an adequate theory of the political content of artifacts.
      *   **Goal:** Define *when* and *how* a technical object/system expresses/enforces/stabilizes a political order, distinguishing it from mere distribution, economics, or aesthetics.
      *   **Constraints:** No bibliography/reading list/citations. Focus on requirements and the cases motivating them.
      *   **Specific Cases to Address (as constraints):**
          1.  Parkway overpass (low clearance sorting access).
          2.  Technical standard (open but requires proprietary tool).
          3.  Platform interface (default settings making work visible/invisible).
          4.  Building code/accessibility (compliance vs. inclusion, back entrance).
          5.  Risk-management device (harm reduction shifting harm to non-consenting others).
          6.  Audit trail (tamper-evident but unreadable without expertise).
          7.  Algorithmic metric (blind inputs, biased historical data).
          8.  Maintenance regime (deciding what decays vs. works).
      *   **Proposed Categories to Test:** Settlements, Constraints, Scripts, Infrastructures.
      *   **Distinctions to Address:** Intent vs. Function vs. Effect; Artifact vs. System; Design vs. Use vs. Maintenance; Necessary vs. Contingent; Being Political vs. Used for Politics; Visible vs. Thinkable-shaping.
      *   **Tension Analysis:** Flag incompatible requirements and identify the "hardest" requirement.
      *   **Verdict:** Brief scoring of existing families of accounts against the non-negotiable list.
      *   **Self-Reflection:** What would change my mind? Where am I most likely wrong?

  2.  **Deconstruct the Cases & Distinctions:**
      *   *Overpass:* Intent matters (Moses), but effect matters more (exclusion). It's a constraint.
      *   *Standard:* System-level politics. Gatekeeping via complexity/cost.
      *   *Interface:* Visibility/legibility. Default settings as scripts.
      *   *Building Code:* Compliance $\neq$ Inclusion. Formal vs. Lived politics.
      *   *Risk Device:* Externalities. Distribution of harm.
      *   *Audit Trail:* Opacity as power. Expertise as a barrier.
      *   *Metric:* Historical inheritance. "Blindness" doesn't mean neutrality.
      *   *Maintenance:* Politics of decay. Time-based politics.

      *   *Distinctions:*
          *   Intent vs. Effect: Crucial because of the "blind metric" and "decay" cases.
          *   Artifact vs. System: Crucial for standards and maintenance.
          *   Design vs. Maintenance: Crucial for the decay case.
          *   Visible vs. Thinkable: Crucial for the overpass (preventing the thought of going to the beach).

  3.  **Drafting the Desiderata (Brainstorming & Selection):**
      *   *Idea 1:* Must explain intent. *Critique:* No, metrics and decay often lack specific intent.
      *   *Idea 2:* Must explain exclusion. *Critique:* Too narrow. Politics is also about enablement.
      *   *Idea 3:* Must distinguish politics from economics. *Critique:* Hard to do, but necessary. Politics = authority/order/power, Economics = resource allocation (though they overlap).
      *   *Idea 4:* Must handle emergence. *Critique:* Yes, for system-level effects.
      *   *Idea 5:* Must handle opacity. *Critique:* Yes, for audit trails and standards.
      *   *Idea 6:* Must handle time/maintenance. *Critique:* Yes, for decay.

      *   *Selection for Non-Negotiables:*
          1.  **The Distinction Condition:** Must distinguish political order from mere resource distribution or aesthetic preference. (Motivated by: Overpass isn't just traffic flow; it's *who*.)
          2.  **The Emergence Condition:** Must account for politics arising from system interaction/maintenance, not just design intent. (Motivated by: Metrics, Maintenance.)
          3.  **The Opacity Condition:** Must account for politics that works by hiding or making illegible. (Motivated by: Audit trails, Standards.)
          4.  **The Counterfactual Condition:** Must explain how the artifact shapes what is *possible* or *thinkable*, not just what happens. (Motivated by: Overpass preventing the trip.)
          5.  **The Normative Gap Condition:** Must distinguish between formal compliance and actual inclusion/effect. (Motivated by: Building code back entrance.)

  4.  **Testing the Four Categories (Settlements, Constraints, Scripts, Infrastructures):**
      *   *Settlements:* Good for overpasses. Bad for emerging metrics (no past conflict, just data drift).
      *   *Constraints:* Good for overpasses. Bad for interfaces (which enable/visibility).
      *   *Scripts:* Good for interfaces. Bad for maintenance (who is the user of decay?).
      *   *Infrastructures:* Good for standards/maintenance. Bad for specific artifacts (a single bridge).
      *   *Verdict:* They are useful heuristic lenses, not ontological categories. A theory needs to integrate them, not choose one. The "Infrastructure" category is the most robust but needs to encompass the others.

  5.  **Addressing the Distinctions:**
      *   *Intent vs. Effect:* Effect must trump intent for the theory to handle algorithmic bias and decay. (Non-negotiable).
      *   *Artifact vs. System:* System must be primary. (Non-negotiable).
      *   *Design vs. Maintenance:* Maintenance must be included as a political site. (Non-negotiable).
      *   *Visible vs. Thinkable:* Thinkable (constitutive) is deeper than Visible (regulative). (Preference for thinkable, but theory must handle both).
      *   *Being Political vs. Used for Politics:* Essential distinction. A hammer isn't political; a gavel is. (Non-negotiable).

  6.  **Identifying Tensions:**
      *   *Tension:* Specificity vs. Emergence. If politics is in the system/maintenance, it's hard to trace to the *artifact*. If politics is in the artifact, we miss the system.
      *   *Tension:* Normative Robustness vs. Descriptive Accuracy. If we define politics as "exclusion," we miss "enablement." If we define it as "order," we might include benign coordination.
      *   *Hardest Requirement:* The Distinction Condition (Politics vs. Economics/Efficiency). This is the philosophical bottleneck.

  7.  **Verdict on Existing Accounts:**
      *   *Intent:* Fails metrics/maintenance.
      *   *Functionalist:* Fails opacity/standards.
      *   *Use-Centered:* Fails design constraints/overpasses.
      *   *Affordance:* Too psychological, misses structural power.
      *   *Structural-Power:* Best fit, but often ignores material specificity.

  8.  **Refining the Output:**
      *   Ensure tone is conceptual and rigorous.
      *   Check all specific cases are integrated as *motivations* for requirements, not just examples.
      *   Ensure the "Four Categories" section critiques them based on the requirements.
      *   Ensure the "Tensions" section is sharp.
      *   Ensure the "Self-Reflection" is honest.

  9.  **Drafting the Content (Iterative refinement):**
      *   *Requirement 1 (The Sovereignty Condition):* Politics implies authority/order, not just efficiency. (Motivated by Overpass/Risk Device).
      *   *Requirement 2 (The Black Box Condition):* Must explain how opacity constitutes power. (Motivated by Audit/Standards).
      *   *Requirement 3 (The Temporal Condition):* Must account for maintenance/decay. (Motivated by Maintenance Regime).
      *   *Requirement 4 (The Gap Condition):* Formal compliance $\neq$ Political reality. (Motivated by Building Code).
      *   *Requirement 5 (The Inheritance Condition):* Must account for historical bias in "neutral" tools. (Motivated by Metrics).

      *   *Re-evaluating the Four Categories:*
          *   Settlements: Too backward-looking.
          *   Constraints: Too negative (ignores visibility).
          *   Scripts: Too agential (ignores decay).
          *   Infrastructures: Best, but needs to cover singular artifacts.
          *   *Proposal:* Keep them as *modes* of political operation, not types of artifacts.

      *   *Tensions:* The "Traceability" vs. "Emergence" tension. If politics emerges from maintenance, can we blame the design?
      *   *Hardest Requirement:* Distinguishing Politics from Economics (The Sovereignty Condition).

      *   *Verdict:* Structural-power comes closest but often loses the "artifact." Intent fails hardest.

      *   *Self-Correction:* Make sure I don't slip into citing Winner or Latour explicitly, even though the cases are clearly theirs. Keep it conceptual.

  10. **Final Polish:** Check against all constraints in the prompt. (No citations, specific cases used as constraints, specific distinctions addressed, tension analysis, verdict, self-reflection).

