answer: |-
  ### Part 1: Brainstorming Candidate Requirements

  To specify a theory of the political content of artifacts, we must first filter out accounts that reduce politics to efficiency, economics, or accident. A theory that cannot distinguish a toll booth from a traffic light, or a biased algorithm from a broken one, is insufficient.

  *Candidate 1: The Intent Requirement.* The politics must be traceable to a designer's choice.
  *Critique:* Fails the **metric** case (bias inherits from data, not design) and the **maintenance** case (decay is often neglect, not design).
  *Candidate 2: The Exclusion Requirement.* The artifact must block access to a group.
  *Critique:* Too narrow. Politics also enables, orders, and makes visible (see **interface** case).
  *Candidate 3: The System Requirement.* The politics must be explainable at the level of the system, not just the object.
  *Critique:* Necessary for **standards** and **maintenance**, but risks losing the specificity of the **overpass**.
  *Candidate 4: The Opacity Requirement.* The theory must explain how hiding information or complexity constitutes power.
  *Critique:* Essential for **audit trails** and **standards**.
  *Candidate 5: The Compliance Gap Requirement.* The theory must distinguish between satisfying a rule and achieving the rule's social aim.
  *Critique:* Essential for the **building code** case.
  *Candidate 6: The Temporal Requirement.* The theory must account for politics over time (maintenance/decay), not just at the moment of deployment.
  *Critique:* Essential for the **maintenance regime** case.

  **Settled List of Desiderata:**
  I propose five non-negotiable requirements. Any theory failing these cannot handle the constraint cases provided.

  ---

  ### Part 2: The Desiderata Specification

  #### 1. The Sovereignty Condition (Non-Negotiable)
  **Requirement:** The theory must distinguish political order from mere resource allocation or aesthetic preference. It must explain how the artifact exercises *authority* or constitutes a *public order*, not just an economic barrier or a stylistic choice.
  **Motivating Case:** The **parkway overpass**. A toll is an economic barrier; a low clearance is a physical sovereign decision about who constitutes the "public" allowed at the beach. If a theory treats the overpass merely as a cost-imposing device, it collapses politics into economics.
  **Status:** Non-negotiable. Without this, "political content" becomes synonymous with "price."

  #### 2. The Emergence Condition (Non-Negotiable)
  **Requirement:** The theory must account for political effects that arise from system interactions, data inheritance, or operational drift, independent of specific design intent.
  **Motivating Case:** The **algorithmic metric**. The inputs are blind; the bias emerges from historical patterns in the training data and the feedback loop of deployment. A theory requiring explicit designer intent to locate politics cannot explain how a "neutral" tool enforces a racial order.
  **Status:** Non-negotiable. This rules out strict intentionalist accounts.

  #### 3. The Legibility Condition (Non-Negotiable)
  **Requirement:** The theory must explain how artifacts distribute the capacity to see, understand, and verify the system's operation. Politics includes the power to make things visible or to hide them behind technical complexity.
  **Motivating Case:** The **audit trail** and the **technical standard**. An audit trail that is tamper-evident but unreadable without specialized expertise creates a priesthood of verifiers. A standard that is formally open but practically requires proprietary tools creates a gatekeeper. Politics here is not just access, but *comprehensibility*.
  **Status:** Non-negotiable. Opacity is a political technology, not just a side effect.

  #### 4. The Formal-Real Gap Condition (Non-Negotiable)
  **Requirement:** The theory must distinguish between formal compliance (satisfying the specification) and substantive inclusion (achieving the social aim). It must be able to label a technically compliant artifact as politically exclusionary.
  **Motivating Case:** The **building code/accessibility rule**. An entrance at the back satisfies the code but violates the norm of equal citizenship. A theory that equates "meeting the standard" with "political neutrality" fails to capture the segregationist effect of the design.
  **Status:** Non-Negotiable. This prevents the theory from being co-opted by bureaucratic box-checking.

  #### 5. The Temporal/Maintenance Condition (Non-Negotiable)
  **Requirement:** The theory must locate political agency in the ongoing maintenance, repair, and allowance of decay, not just in the moment of design or deployment.
  **Motivating Case:** The **maintenance regime**. Deciding which infrastructures are kept working and which are allowed to rot is a political decision that often happens budget-cycle by budget-cycle, long after the "design" is finished.
  **Status:** Non-Negotiable. This rules out theories that treat artifacts as static once built.

  ---

  ### Part 3: Testing the Four Registers

  You proposed four categories: Settlements, Constraints, Scripts, Infrastructures. Here is how they hold up against the desiderata.

  **1. Artifacts as Settlements (Encoding past conflict)**
  *   **What it explains:** How the **overpass** freezes a past decision into concrete.
  *   **Failure Point:** Fails the **Emergence Condition**. It cannot explain the **algorithmic metric** or **maintenance regime**, where the politics is current, drifting, or emergent, not a fossilized past conflict.
  *   **Verdict:** Insufficient as a primary category. It describes *origin*, not *operation*.

  **2. Artifacts as Constraints (Changing the feasible set)**
  *   **What it explains:** How the **overpass** and **risk-management device** physically or logically block actions.
  *   **Failure Point:** Fails the **Legibility Condition**. Constraints imply a "no," but politics also works by shaping what is *thinkable* or *visible* (the **interface** defaults). A constraint model struggles to explain how making something invisible is political if the user never tries to look for it.
  *   **Verdict:** Necessary but insufficient. It captures negative liberty but misses epistemic power.

  **3. Artifacts as Scripts (Assigning roles/competencies)**
  *   **What it explains:** How the **interface** and **standard** tell users what to do and who they must be to participate.
  *   **Failure Point:** Fails the **Temporal/Maintenance Condition**. Scripts imply a user executing a role. But who is the user of a **maintenance regime**? Decay happens to non-users. Scripts are too agential; they assume a human following the code, whereas infrastructure often works by bypassing human agency entirely.
  *   **Verdict:** Strong for interaction, weak for structural background conditions.

  **4. Artifacts as Infrastructures (Distributing visibility/legibility/maintainability)**
  *   **What it explains:** How **standards**, **audit trails**, and **maintenance** create the background conditions for politics.
  *   **Failure Point:** Risks becoming too vague. If everything is infrastructure, nothing is. It must be careful not to lose the specificity of the **overpass** (a singular object) in a wash of "systemic effects."
  *   **Verdict:** The most robust category, provided it can encompass singular objects as "micro-infrastructures."

  **Redrawing the Cuts:**
  Do not treat these as mutually exclusive types of artifacts. Treat them as **modes of political operation** that any adequate theory must be able to switch between. A single object (e.g., the **platform interface**) operates as a Script (defaults), an Infrastructure (visibility), and a Constraint (what cannot be posted). The theory should not categorize the *object*, but the *mechanism* at play in a specific context.

  ---

  ### Part 4: Addressing the Distinctions

  I classify the requested distinctions as follows:

  **Genuine Requirements (Non-Negotiable):**
  *   **Artifact-level vs. System-level politics:** A theory must be scalable. The **standard** case proves politics lives in the protocol, not just the tool.
  *   **Politics in Design vs. Maintenance/Decay:** The **maintenance regime** case makes this non-negotiable. Politics is a verb, not a noun.
  *   **Artifact being Political vs. Used for Politics:** A hammer is used for politics (violence); a gavel is political (authority). The **Sovereignty Condition** requires this distinction. If a theory cannot distinguish a tool from an institution, it is too broad.

  **Optional / Camp-Specific Preferences:**
  *   **Designer Intent vs. Artifact Function vs. Downstream Effect:** *Intent is optional.* The **metric** and **maintenance** cases show that downstream effect is the only reliable indicator of political content. Intent is relevant only for moral responsibility, not for ontological classification of the politics.
  *   **Necessary vs. Contingent Consequences:** *Contingency is the rule.* Politics is context-dependent. Requiring necessary consequences makes the theory too rigid to handle the **building code** case (where the same code works differently in different contexts).
  *   **Visible to Participants vs. Shaping the Thinkable:** *Shaping the thinkable is primary.* Visible politics can be resisted. Politics that prevents a thought from arising (the **overpass** preventing the trip) is more potent. A theory focusing only on visible conflict misses the deepest layer of technological power.

  ---

  ### Part 5: Tensions and Impossibilities

  **The Traceability Tension:**
  There is a sharp tension between the **Emergence Condition** (politics emerges from system/data/maintenance) and the desire for **Accountability** (someone must be responsible).
  *   *The Conflict:* If the politics of the **algorithmic metric** emerges from historical data drift, and the politics of **maintenance** emerges from budget neglect, there is no specific "design moment" to point to.
  *   *The Impossibility:* A theory cannot simultaneously require that political content be traceable to a specific human decision *and* accommodate the reality of emergent systemic bias.
  *   *Resolution:* We must sacrifice Traceability. The theory must accept that artifacts can be political agents in a distributed sense, without a single author. This is uncomfortable for legal/moral frameworks but necessary for descriptive accuracy.

  **The Specificity Tension:**
  There is a tension between the **Sovereignty Condition** (politics is specific authority) and the **Infrastructure** register (politics is background).
  *   *The Conflict:* To identify politics, we usually look for a decision (Sovereignty). But infrastructure works by *not* deciding, by being the environment in which decisions happen.
  *   *The Impossibility:* A theory that demands a clear "decision point" will fail to see the politics of the **technical standard** or **maintenance**, which operate through inertia and default.
  *   *Resolution:* The theory must expand "decision" to include "refusal to update" or "selection of default."

  **The Hardest Requirement:**
  The **Sovereignty Condition** (Distinguishing Politics from Economics/Efficiency) does the most work in excluding attractive accounts.
  *   *Why:* It is very easy to describe the **overpass** or the **standard** as merely optimizing for flow or compatibility. Many functionalist accounts fail here because they accept the engineer's justification (efficiency) as the ontological reality. Insisting that efficiency *is* a political value (one that prioritizes some flows over others) is the heavy lifting of the theory.

  ---

  ### Part 6: Verdict on Existing Families of Accounts

  *   **Designer-Intent Accounts:** **Fail.** They cannot handle the **metric** (bias without intent) or **maintenance** (politics of neglect) cases. They violate the Emergence and Temporal Conditions.
  *   **Functionalist Accounts:** **Fail.** They tend to accept the artifact's stated purpose as neutral. They struggle with the **Sovereignty Condition**, often collapsing politics into efficiency (e.g., the overpass is for traffic flow, not exclusion).
  *   **Use-Centered Accounts:** **Partial Pass.** They handle the **interface** and **script** cases well. However, they often struggle with the **maintenance** and **infrastructure** cases where the "user" is absent or passive. They risk making politics too dependent on human interpretation.
  *   **Affordance-Based Accounts:** **Partial Pass.** Good for **constraints**. However, they often lack the normative vocabulary to distinguish a political barrier from a physical one (Sovereignty Condition). They describe *what can be done*, not *who is allowed*.
  *   **Structural-Power Accounts:** **Best Fit.** These accounts (focusing on systems, standards, and invisibility) best satisfy the **Legibility**, **Emergence**, and **Infrastructure** conditions.
      *   *Weakness:* They sometimes lose the material specificity of the artifact, treating it as merely a symptom of social power. They must ensure they don't ignore the *resistance* of the material (the concrete actually is low).

  ---

  ### Part 7: Self-Reflection and Falsification

  **What would change my mind?**
  I would revise the **Sovereignty Condition** if a compelling argument showed that "efficiency" and "authority" are not distinct categories in technical systems. If it can be demonstrated that *all* technical optimization is inherently a form of resource distribution indistinguishable from economics, then the distinction between "political artifact" and "economic tool" collapses. If politics is just economics by other means, my requirement for a specific "political order" marker is a category error.

  **Where am I most likely wrong?**
  I am most likely wrong in the **Temporal/Maintenance Condition**. I have treated maintenance as a distinct phase from design. However, one could argue that "design" includes the design of the maintenance protocol. If maintenance is just "long-term design," then requiring a separate condition is redundant. My reasoning assumes a break between the creator and the sustainer that might not exist in all socio-technical systems. If the "maintenance regime" is actually a "delayed design choice," my insistence on a temporal distinction weakens the theory's parsimony.
