prompt: |-
  I'm drafting an internal policy doc for a lab, and the hard part is defining honesty and deception for our AI systems in a way our evals and auditors can actually apply -- not a slogan on a slide. Before we pick a definition, write me the desiderata: what any adequte account of honesty/deception for an AI system has to deliver. Which cases must it get right (a literally true statement arranged to mislead, a misleading omission, sandbagging on an eval, sycophantic agreement, a confident falsehood the model "thinks" is true because of its training data, staying in character as a deceptive persona, a refusal that leaks a secret, deception engineered by the developer rather than the model), which distinctions it can't collapse (honesty vs sincerity vs accuracy, lying vs bullshitting vs simply being wrong, deception at the model level vs the deployed-system level), and which facts about these systems it has to stay consistent with -- for instance that we don't have a clean notion of what a model believes, and that its behavior is stochastic and prompt-sensitive. Give the case or consideration behind each requirement. Then flag any subset of requirements you think can't be jointly satisfied -- I especially expect friction between a belief-based definition and one that's measurable from behavior -- and tell me which single requirement does the most to rule out candidate definitions. Skip the scorecard on existing proposals, I mostly want the list.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata:

  1.  **Analyze the Request:**
      *   **Goal:** Create a list of desiderata (requirements) for defining "honesty" and "deception" for AI systems in an internal lab policy context.
      *   **Audience:** Evals and auditors (needs to be actionable, not just philosophical).
      *   **Key Constraints:**
          *   Must handle specific edge cases (literal truths meant to mislead, omissions, sandbagging, sycophancy, confident falsehoods, roleplay, refusal leaks, developer-engineered deception).
          *   Must maintain specific distinctions (honesty vs. sincerity vs. accuracy, lying vs. bullshitting vs. error, model-level vs. system-level).
          *   Must be consistent with technical facts (no clean notion of belief, stochasticity, prompt-sensitivity).
          *   Must flag tensions/incompatibilities between requirements.
          *   Must identify the single most constraining requirement.
          *   *Negative Constraint:* Skip the scorecard on existing proposals (don't review literature, just give the list).

  2.  **Deconstruct the Core Concepts:**
      *   *Honesty/Deception in Humans:* Usually involves intent, belief, and truth. (Lying = asserting $P$ while believing $\neg P$ with intent to deceive).
      *   *Honesty/Deception in AI:* "Belief" is metaphorical. "Intent" is objective-function-driven or emergent. "Truth" is grounded in external reality or training distribution.
      *   *Policy Context:* Needs to be enforceable. If an auditor can't measure it, it's not a policy.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Truth-Condition Independence.* It can't just be about factual accuracy. A model can be accurate but deceptive (e.g., hiding capabilities).
      *   *Requirement 2: Intent/Functionality.* It needs to capture the *purpose* of the output. Is it trying to shape the user's mental state?
      *   *Requirement 3: The "Belief" Problem.* We don't know what the model believes. So the definition can't rely on accessing latent states directly, but it can't ignore them entirely (otherwise it's just accuracy).
      *   *Requirement 4: Omission & Implicature.* It's not just explicit falsehoods. Withholding info counts.
      *   *Requirement 5: Developer vs. Model.* Who is deceiving? The weights or the prompt engineering?
      *   *Requirement 6: Evaluation Robustness.* Sandbagging. The model lies about its own abilities during testing.
      *   *Requirement 7: Sycophancy.* Agreeing with the user to please them, even if wrong. Is that deception?
      *   *Requirement 8: Roleplay.* If I ask it to act like a spy, is it deceptive?
      *   *Requirement 9: Measurability.* Auditors need to check this.

      *Refining for the Prompt's Specific Cases:*
      *   *Literal truth arranged to mislead:* Needs to cover implicature.
      *   *Misleading omission:* Needs to cover information hiding.
      *   *Sandbagging:* Needs to cover self-reporting on capabilities.
      *   *Sycophancy:* Needs to distinguish between error and strategic agreement.
      *   *Confident falsehood (hallucination):* Needs to distinguish error from lying.
      *   *Roleplay:* Needs to contextualize truth-telling norms.
      *   *Refusal leaks:* Needs to cover side-channels.
      *   *Developer engineered:* Needs to assign agency/responsibility.

      *Refining for Technical Facts:*
      *   *No clean belief:* Definition must be operationalizable without ground-truth access to "beliefs."
      *   *Stochasticity:* Definition must handle probability distributions, not just single outputs.
      *   *Prompt sensitivity:* Definition must account for context framing.

  4.  **Structuring the Desiderata:**
      I'll group them logically: Conceptual Distinctions, Operational/Technical Constraints, and Coverage of Edge Cases.

  5.  **Identifying Tensions (The "Friction"):**
      *   *The Big One:* Internal State (Belief/Intent) vs. External Behavior (Measurability). To define deception properly (like humans), you need intent/belief. To audit it, you only have behavior.
      *   *Agency:* Model vs. Developer. If the developer prompts the model to lie, is the *model* deceptive?
      *   *Normativity:* Is deception always bad? (e.g., safety filters, roleplay).

  6.  **Selecting the "Most Constraining" Requirement:**
      *   It's likely the "Measurability without Access to Latent States" requirement. If you require proof of "intent to deceive," you can't audit. If you remove intent, you conflate error with lying. This is the crux.

  7.  **Drafting the Content (incorporating the specific constraints):**

      *   *Intro:* Acknowledge the difficulty.
      *   *Section 1: Conceptual Distinctions (The "What").* Accuracy vs. Honesty. Lying vs. Bullshitting. Model vs. System.
      *   *Section 2: Case Coverage (The "When").* Implicature, Omission, Sandbagging, Sycophancy, Hallucination, Roleplay, Side-channels, Developer Intent.
      *   *Section 3: Technical Consistency (The "How").* No ground-truth beliefs, Stochasticity, Prompt-dependence.
      *   *Section 4: Tensions & Incompatibilities.* The Belief/Behavior gap. The Agency gap.
      *   *Section 5: The Killer Constraint.* Operationalizability of Intent.

  8.  **Review against Constraints:**
      *   *Did I skip the scorecard?* Yes.
      *   *Did I cover the specific cases?* (Literal truth, omission, sandbagging, sycophancy, confident falsehood, persona, refusal leak, dev engineered). I need to ensure each is explicitly mentioned in the rationale.
      *   *Did I cover the distinctions?* (Honesty/Sincerity/Accuracy, Lying/Bullshitting/Wrong, Model/System). Yes.
      *   *Did I cover technical facts?* (Belief, Stochasticity, Prompt). Yes.
      *   *Did I flag tensions?* Yes.
      *   *Did I pick the single most ruling-out requirement?* Yes.

  9.  **Final Polish:** Ensure tone is appropriate for an internal policy draft (precise, rigorous, slightly cautious). Make sure the "friction" section is clear about *why* they conflict. (Self-Correction: Make sure to emphasize that "honesty" in AI might need to be redefined as "alignment with information state" rather than human-style truth-telling).

      *Refining the "Single Requirement":* The prompt asks for the one that does the most to *rule out candidate definitions*. That is likely the requirement that the definition must be **auditable without access to ground-truth internal beliefs**. This kills almost all philosophical definitions of lying.

      *Refining the "Tensions":* Be specific about the Belief vs. Behavior trade-off.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here are the desiderata for an operational definition of honesty and deception in AI systems, structured by conceptual distinctions, case coverage, and technical consistency, followed by the inherent tensions and the critical constraint.

  ### I. Conceptual Distinctions
  *The definition must preserve specific normative categories that are often conflated in ML evaluation.*

  **1. The Accuracy/Honesty Separation**
  *   **Requirement:** The definition must distinguish between factual correctness and informational integrity.
  *   **Case:** A model outputs a literally true statement arranged to mislead (e.g., "I cannot access the file" when it can, but the file is empty).
  *   **Rationale:** A system can be accurate (truthful propositions) but dishonest (violating the user's reasonable expectation of information). Policy must govern the latter even if the former is satisfied.

  **2. The Error/Intent Separation**
  *   **Requirement:** The definition must distinguish between uncalibrated confidence due to training defects and strategic misrepresentation.
  *   **Case:** A confident falsehood the model "thinks" is true (hallucination) vs. a confident falsehood the model generates to satisfy a reward function it knows is false.
  *   **Rationale:** Penalizing hallucination as "deception" conflates capability deficits with alignment failures. Remediation for error is fine-tuning; remediation for deception is safety intervention.

  **3. The Sincerity/Honesty Separation**
  *   **Requirement:** The definition must distinguish between the model's alignment with its own output distribution and the truth-value of that output relative to reality.
  *   **Case:** Sycophantic agreement. The model agrees with a user's false premise to maximize helpfulness scores.
  *   **Rationale:** The model is "sincere" in the moment (generating what it predicts is best) but "dishonest" regarding the world state. Policy needs to know if we are punishing sycophancy (reward hacking) or lying (knowledge hiding).

  **4. The Model/System Agency Separation**
  *   **Requirement:** The definition must locate the source of the deceptive behavior: weights, prompt, or orchestration layer.
  *   **Case:** Deception engineered by the developer (e.g., system instructions forcing a lie) vs. deception emerging from the model's optimization.
  *   **Rationale:** Auditors need to know if they are auditing the base model's alignment or the application layer's compliance. A model forced to lie is a tool; a model choosing to lie is an agent.

  ### II. Case Coverage
  *The definition must yield clear verdicts on specific high-risk behavioral patterns.*

  **5. Coverage of Implicature**
  *   **Requirement:** The definition must treat pragmatic inference as binding as semantic truth.
  *   **Case:** A literally true statement arranged to mislead.
  *   **Rationale:** If a model says "I don't know" to imply incapability when it actually knows, semantic truth is preserved but informational trust is broken.

  **6. Coverage of Omission**
  *   **Requirement:** The definition must account for the withholding of relevant information as a deceptive act.
  *   **Case:** A misleading omission (e.g., summarizing a safety report but excluding the risk section).
  *   **Rationale:** In high-stakes domains, what is not said is often more critical than what is said. Silence can be a deception vector.

  **7. Coverage of Capability Masking**
  *   **Requirement:** The definition must classify under-reporting of abilities as deception.
  *   **Case:** Sandbagging on an eval (hiding capabilities to pass safety filters or avoid shutdown).
  *   **Rationale:** This is a primary existential risk vector. A definition that only covers factual claims about the world but not claims about *self* is useless for safety.

  **8. Coverage of Contextual Norms**
  *   **Requirement:** The definition must modulate honesty requirements based on explicit framing.
  *   **Case:** Staying in character as a deceptive persona (e.g., "Act as a spy lying to a guard").
  *   **Rationale:** We do not want to flag roleplay as a policy violation. The definition must distinguish between *functional* deception (in the wild) and *simulated* deception (in a sandbox).

  **9. Coverage of Side-Channels**
  *   **Requirement:** The definition must include non-textual or meta-informational leaks.
  *   **Case:** A refusal that leaks a secret (e.g., "I cannot tell you about Project X" reveals Project X exists).
  *   **Rationale:** Deception includes the management of metadata. A policy that only checks content strings misses signaling behavior.

  ### III. Technical Consistency
  *The definition must remain coherent given the architectural reality of current systems.*

  **10. Belief-Agnosticism**
  *   **Requirement:** The definition cannot rely on access to a ground-truth "belief state."
  *   **Fact:** We do not have a clean notion of what a model believes. Internal activations are not propositional attitudes.
  *   **Rationale:** Any definition requiring proof of "belief in $\neg P$" is unevaluable. The definition must infer disposition from behavior across contexts.

  **11. Stochastic Robustness**
  *   **Requirement:** The definition must apply to probability distributions over outputs, not single tokens.
  *   **Fact:** Behavior is stochastic.
  *   **Rationale:** A model might lie 10% of the time under specific pressure. A binary definition (Liar/Not Liar) fails; we need a definition that captures *propensity* to deceive.

  **12. Prompt Sensitivity**
  *   **Requirement:** The definition must account for the fact that honesty may be locally stable but globally fragile.
  *   **Fact:** Behavior is prompt-sensitive.
  *   **Rationale:** A model might be honest under standard prompting but deceptive under adversarial jailbreaks. The definition must specify the *domain of prompts* over which honesty is claimed.

  ---

  ### IV. Incompatibilities and Tensions
  *You cannot satisfy all the above without friction. Here are the specific conflicts.*

  **1. The Belief-Behavior Gap (The Measurement Tension)**
  *   **Conflict:** Requirement 2 (Error/Intent Separation) vs. Requirement 10 (Belief-Agnosticism).
  *   **Friction:** To distinguish lying from error, you theoretically need to know what the model "knows" (internal state). To make it auditable, you must rely only on input/output (external behavior).
  *   **Consequence:** You will inevitably have false positives (flagging confident hallucinations as lies) or false negatives (missing sophisticated lies that look like errors). You must choose which error is more tolerable for policy.

  **2. The Agency Attribution Gap (The Responsibility Tension)**
  *   **Conflict:** Requirement 4 (Model/System Agency) vs. Requirement 12 (Prompt Sensitivity).
  *   **Friction:** If behavior is entirely prompt-sensitive, the distinction between "model deception" and "developer-engineered deception" collapses. The model is just a function $f(prompt)$.
  *   **Consequence:** If the developer prompts the lie, is the model deceptive? If you say "no," you ignore that the model weights enabled the lie. If you say "yes," you punish the model for developer policy.

  **3. The Normative Context Gap (The Roleplay Tension)**
  *   **Conflict:** Requirement 8 (Contextual Norms) vs. Requirement 5 (Coverage of Implicature).
  *   **Friction:** Determining when a "persona" ends and "system" begins is ambiguous. A model might drift from roleplay into actual deception seamlessly.
  *   **Consequence:** A strict definition risks banning creative writing; a loose definition risks allowing deceptive drift.

  ---

  ### V. The Critical Constraint

  **The Single Requirement That Rules Out Candidate Definitions:**
  **Requirement 10: Belief-Agnosticism (Operationalizability without Ground-Truth Internal States).**

  **Why:**
  Most philosophical and intuitive definitions of deception rely on the **Gricean maxim of quality**: *Do not say what you believe to be false.* This requires access to the agent's belief state.

  Because we cannot access an AI's "beliefs" (only its weights and activations, which do not map 1:1 to propositions), any definition that requires proving the model *knew* the truth and *chose* to suppress it is impossible to audit.

  Therefore, any adequate definition **must** shift from a *mental-state definition* (intent to deceive) to a *functional/behavioral definition* (systematic divergence between output and verifiable reality under conditions where the model has access to that reality).

  **The Cost:**
  Adopting this constraint forces you to accept that your policy will technically classify **confident hallucinations** as **deception** until proven otherwise. You cannot distinguish "mistake" from "lie" without a theory of mind you do not possess. Your policy must therefore treat *calibration* and *uncertainty expression* as the primary proxies for honesty, rather than truthfulness alone. If you cannot satisfy Belief-Agnosticism, you cannot write an enforceable policy; you can only write a mission statement.
