answer: |-
  ### Working Notes

  **Technology Rules (The "Bureau Standard")**
  1.  **Non-Destructive Scanning:** The "Original" body is never consumed. A scan creates a data packet; a rebuild creates a biological instance from that packet.
  2.  **Fidelity Threshold:** Legal personhood requires a minimum 99% Psychological Continuity (PC) score relative to the last registered state. Below 99% is classified as "Derivative Kin" (next of kin status, not identity).
  3.  **Branching Protocol:** At the moment of scan, identity branches. Pre-branch history is shared liability/asset. Post-branch history is distinct. There is no "Prime." They are indexed numerically (e.g., Halloway-1, Halloway-2).
  4.  **Consent:** Dissolution of a branch requires unanimous consent from all living branches of that lineage. One copy cannot kill another without it being murder.
  5.  **Decay:** Rebuilds suffer "Drift." Memory loss, personality shift, or physiological mismatch accumulates over successive scans.

  **Five Possible Scenes**
  1.  **The Pension Audit:** Three versions of a retiree apply for the same single pension pot; the clerk must decide if they are one claimant or three. (Focus: Resource scarcity vs. ontological multiplication.)
  2.  **The Criminal Plea:** A copy commits a crime weeks after branching; the Original argues he shouldn't pay for a choice he didn't make. (Focus: Moral responsibility and causal links.)
  3.  **The Divorce Petition:** A wife files for divorce against Husband-1 but claims adultery with Husband-2. (Focus: The binding nature of vows to body vs. psychology.)
  4.  **The Dissolution Hearing:** A depressed copy wants to be euthanized; the other copies veto it, claiming he is "them" and they don't want to die. (Focus: Right to life vs. right to bodily autonomy.)
  5.  **The Widow's Interview:** A wife discusses the impending death of one branch while two others survive; her grief shifts based on how the clerk phrases the outcome. (Focus: The Williams Flip on fear and loss.)

  **Selection & Reasoning**
  I am selecting **The Pension Audit**, **The Widow's Interview**, and **The Dissolution Hearing** (blended into the Audit).
  *   **Why:** The Pension Audit provides the mundane, bureaucratic backbone required (paperwork, forms, thresholds). It forces the protagonist to apply rules rather than debate them.
  *   **Why:** The Widow's Interview is the only vehicle strong enough to handle the Williams Flip viscerally. It moves the philosophy from abstract to emotional.
  *   **Why:** Blending the Dissolution element allows for the "Quiet Meeting" between copies without drama—they are discussing logistics, not reality. The Corporate Analogy fits best as office dialogue between the protagonist and a superior during the audit process.

  ***

  ### The Continuity Clerk

  The form was gray, the ink was black, and the question was always the same. *Please indicate the percentage of psychological continuity between Claimant A and Decedent B.*

  Elias dipped his pen. He didn't need to check the file to know the number. It was always 99.4, or 98.2, or sometimes, in the messy cases involving heavy drift, 94.5. Anything below 99.0 required a supervisor's signature. Anything below 95.0 required a tribunal.

  He wrote *99.4%*. He dated it. He stacked it on the out-tray.

  Outside his office window, the city was the same gray as the form. The Rebuild towers hummed in the distance, low-frequency vibrations that you felt in your teeth if you stood near the glass. They were old news now. Thirty years ago, people had queued for days to be scanned, terrified of the kill-step. Then the non-destructive protocols came online, the kill-step was removed, and the terror vanished, replaced by paperwork. Now, nobody wondered if they were real. They wondered if they were solvent.

  Elias was a Continuity Adjudicator for the Bureau of Personhood & Succession. His job was not to decide who was human. They were all human. His job was to decide who was *the same* human for the purposes of a mortgage, a marriage, or a death certificate.

  The buzzer on his desk flashed. Case 4490: Halloway.

  He opened the file. Arthur Halloway. Scanned first in 2041. Scanned again in 2045. Scanned a third time in 2048. There were currently three active branches. Halloway-1 (the original biological substrate, now terminal with pancreatic cancer). Halloway-2 (employed in logistics, high fidelity). Halloway-3 (freelance artist, significant drift in memory sectors regarding childhood).

  The issue: Halloway-1 was entering hospice. The estate needed to be settled pre-mortem to avoid branching tax complications. Halloway-2 and Halloway-3 were both claiming full executorial power.

  Elias clipped the file to his jacket and walked down the corridor to Interview Room B.

  Sarah Halloway was sitting at the table. She looked tired. She was holding a cup of water with both hands. She was the wife of Halloway-1. Technically, she was also the wife of Halloway-2 and Halloway-3, unless she had filed for divergence separation, which the file said she hadn't.

  "Mrs. Halloway," Elias said, sitting opposite her. "We need to clarify your position on the continuity claim."

  "I know what I need to clarify," she said. Her voice was flat. "Arthur is dying. The one in the hospice bed. That's my husband."

  "And the others?"

  "They're... extensions." She looked at the table. "Look, Mr. Vance. I know the law. I know Relation R. I know that psychologically, they're all Arthur. But Arthur-1 is the one who held my hand when my mother died. Arthur-2 doesn't remember the smell of her perfume. Arthur-3 remembers it, but he thinks she died in a car crash, not cancer."

  Elias nodded. He opened his notebook. "This is relevant to the Fidelity Threshold. If the memory loss exceeds 1% regarding significant emotional markers, the Bureau may classify them as Derivative Kin rather than Continuations."

  "So Arthur-3 isn't Arthur?"

  "For the purposes of the will? Probably not. For the purposes of your marriage license? That's a tribunal matter."

  Sarah took a sip of water. Her hand shook. "It doesn't matter what the form says. I'm scared."

  "Of the death?"

  "Of the end."

  Elias paused. This was the part the training manuals warned about. The metaphysics always leaked into the grief. "Mrs. Halloway, Halloway-2 and Halloway-3 will survive. Your husband's memories, his character, his intentions... most of them continue. According to the Bureau, Arthur survives."

  "I know," she said. "That's what the doctor said. He said, 'Don't worry, the pattern persists.' But when he said that, I felt... relieved. Like he was going to live."

  "And now?"

  "Now I'm looking at Arthur-1 in the bed, and I know he's going to stop breathing. And I'm terrified." She looked up at Elias. Her eyes were wet. "It's the same facts. You just told me he survives. Then you told me he dies. And my heart doesn't know which one to believe."

  Elias stopped writing. He recognized the shape of this. It was the Williams Flip. When you tell someone *they* will be tortured tomorrow, they fear it. When you tell them someone with their memories will be tortured tomorrow, they fear it less. When you tell them their memories will be wiped and *then* they will be tortured, they fear it most. The facts don't change. The description changes the fear.

  "The Bureau operates on psychological continuity," Elias said carefully. "If the pattern persists, the person persists."

  "The pattern isn't the person," Sarah said. "The pattern is a file. The person is the body that holds it. If you copy a file to two new drives and smash the original, the file survives. The drive doesn't. I'm married to the drive."

  "We can note that in the testimony," Elias said. He felt a sudden, sharp exhaustion. He wasn't paid to fix this. He was paid to check the box. *Continuity Verified* or *Continuity Broken*.

  "Can I ask you something?" Sarah said. "If Arthur-1 dies, and I stay with Arthur-2... is it adultery?"

  "Legally? No. You are married to the Halloway Lineage."

  "Legally," she repeated. "Okay."

  Elias closed his notebook. "I have to go speak with the claimants. They're in the waiting lounge."

  He left the room and walked to the lounge. It was a bland space with synthetic plants and a vending machine that only dispensed lukewarm tea.

  Halloway-2 and Halloway-3 were sitting at opposite ends of a sofa. They looked similar, but not identical. Halloway-2 had the sharp jawline of the original scans. Halloway-3 had a softer face, the result of cellular drift during the rebuild process. He was wearing a paint-splattered jacket. Halloway-2 was in a suit.

  They weren't fighting. They weren't arguing about who was real. That scene, Elias knew, had been written four thousand times in the early years of the technology. Now, it was just logistics.

  "Mr. Halloway. Mr. Halloway," Elias said. He always felt stupid saying it.

  "Call me Art," said Halloway-3. He was smoking a cigarette, though the sign said no smoking. Elias decided not to mention it.

  "Arthur is fine," said Halloway-2. He looked at Elias with expectant eyes. "Did she sign the waiver?"

  "Mrs. Halloway is contesting the Fidelity Threshold on emotional markers," Elias said.

  Halloway-2 sighed. "She's stuck on the body. It's sentimental."

  "It's her marriage," Halloway-3 said. He tapped ash onto the floor. "I don't want the money, by the way. Just put it in the trust."

  "We need the liquidity for the hospice care," Halloway-2 said. "You know that. We shared that memory until the 2045 branch."

  "I remember needing the money," Halloway-3 said. "I just don't feel the urgency. It's like watching a movie about someone else's debt."

  Elias sat in the armchair between them. "This is the part where I ask about the Corporate Analogy."

  Halloway-2 rolled his eyes. "Not this again."

  "It's the standard justification for branching liability," Elias said. "I need to record your response for the file."

  Halloway-2 leaned forward. "Fine. Look. A company is a legal person. The CEO leaves, the staff turns over, the building is sold. Nobody says 'Ford died in 1947.' We agree to call it the same entity because it's useful. Why is a person different?"

  "Because people feel pain," Elias said.

  "Companies feel liability," Halloway-2 countered. "It's the same structure. We are just biological corporations. The shareholders are the memories. The board is the character. If the board votes to continue, the company continues. Why do you insist on a soul?"

  "I don't insist on anything. I fill out forms."

  "It's annoying," Halloway-2 said. "It's annoying that we have to pretend there's a magic line where 'Arthur' stops. There isn't. There's just data transfer. If you accept that the company survives total turnover, you should accept that I survive the branch. Otherwise, you're just being speciesist about carbon."

  "It's not speciesism," Halloway-3 said quietly. He looked at his hands. "It's loneliness."

  Halloway-2 looked at his other self. "Don't start."

  "I'm not starting. I'm saying... when I look at him," Halloway-3 nodded at Halloway-2, "I know what he's thinking. I know why he wants the money. But I don't *want* the money. So who is the company? The board is split. The shareholders are voting differently. If a company's board splits, it demerges. It doesn't stay one company."

  "The Bureau doesn't allow demergers on identity," Elias said. "You are one lineage. You share the pre-branch debt."

  "See?" Halloway-2 said. "It's convenience. It's administrative. Admit it."

  Elias didn't admit it. He just wrote *Argument Noted* on the form. He couldn't write *Argument Valid*. That wasn't his pay grade.

  "Here's the situation," Elias said. "Halloway-1 is terminal. We need to designate an executor. If you both sign, we split the estate 50/50 post-branch. If you fight, we freeze the assets until Halloway-1 expires, and then it goes to probate."

  "We'll sign," Halloway-2 said.

  "I'll sign," Halloway-3 said. "But I'm not going to the funeral."

  "He's not dead yet," Halloway-2 said.

  "I'm not going to watch myself die," Halloway-3 said. "It's too much overlap. I know what it feels like to have cancer. I remember the diagnosis. I don't need to see the end of it."

  Halloway-2 stood up. He adjusted his cuff. "I'll go. Someone has to hold her hand."

  "Someone has to hold *your* hand," Halloway-3 said. "You're the one who stayed corporate. You're the one who's going to feel the loss of the assets."

  Halloway-2 didn't answer. He walked to the window and looked out at the Rebuild towers. They were glowing softly in the twilight.

  Elias watched them. This was the quiet meeting. No punches, no screams. Just two men who were the same man, deciding who would bear the weight of a death that was happening to both of them, and neither of them.

  He thought about Sarah in the other room. She was afraid of the end. Halloway-2 was afraid of the liability. Halloway-3 was afraid of the memory.

  Elias stood up. "I'll draw up the forms. You'll need to sign in blood or biometric seal."

  "Biometric," Halloway-2 said. "Less mess."

  Elias left the lounge. He walked back to his office. The light was fading, and the office lamps flickered on, casting long shadows across the stacks of gray forms.

  He sat at his desk. He picked up the pen. He looked at the box: *Continuity Verified*.

  If he checked it, Arthur survived. The pension would pay out. The marriage would hold. Sarah would be a widow, but she would be a wealthy widow, and she would have two husbands left to help her grieve the first.

  If he unchecked it, Arthur died. The estate would freeze. Sarah would be a widow three times over. The Bureau would have to open a new file for Halloway-2 and Halloway-3 as new persons. They would lose the tax benefits. They would lose the history.

  He looked at the Fidelity Percentage. *99.4%*.

  0.6% missing. What was missing? The smell of the perfume. The urgency of the debt. The fear of the funeral.

  He thought about the company argument. Halloway-2 was right. It was administrative. It was convenient. It was useful to say the company survived. But when Halloway-3 said *loneliness*, that wasn't administrative. That was a ghost in the machine that wasn't a ghost.

  Elias dipped his pen. He hovered over the box.

  He thought about Sarah's hands shaking around the water cup. He thought about Halloway-3 tapping ash on the floor. He thought about the hum of the towers outside, churning out people like products, none of them quite the same as the blueprint, all of them demanding to be paid.

  He didn't check the box. Not yet.

  He opened a new form. *Request for Tribunal Review.*

  He wrote in the notes section: *Claimant expresses fear of death despite verified continuity. Spouse expresses fear of loss despite verified survival. Discrepancy in subjective experience of identity requires higher adjudication.*

  It was a delay tactic. It would take weeks. Halloway-1 might die before the tribunal met. The assets would freeze. Sarah would suffer. Halloway-2 would be angry.

  But it was the only honest thing he could do. To check the box was to say *I know what matters.* To leave it blank was to say *I don't.*

  Elias capped his pen. He stood up and turned off the desk lamp. The office plunged into the gray twilight of the city.

  Through the window, he saw a Rebuild transport moving slowly down the street. It looked like an ambulance, but it wasn't carrying anyone sick. It was carrying someone new. Or someone old.

  Elias picked up his coat. He walked to the door. He didn't look back at the form. He let it sit there, the ink still wet, the box empty, waiting for someone else to decide if Arthur Halloway was a company or a man.

  He locked the office door. He walked down the hall. He passed the Interview Room. He could hear Sarah crying inside. It was a quiet sound, the sound of someone trying not to disturb the paperwork.

  Elias kept walking. He went out into the street. The air was cold. He put his hands in his pockets. He walked home to a wife who was waiting for him. He wondered, as he unlocked his door, if she would love him tomorrow if he forgot the smell of her perfume.

  He didn't ask her. He just hung up his coat.

