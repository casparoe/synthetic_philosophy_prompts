  **Author Notes (For Revision)**

  1.  **Sarah (The Wife):** Argues for Bodily Continuity/Intuition. She embodies the Williams Flip; her fear moves based on whether Arthur is described as "surviving in data" or "dying in body."
  2.  **Halloway-2 (The Suit):** Argues for the Corporate/Parfitian View. Identity is a useful convention for liability and assets; psychology is what matters, not the substrate.
  3.  **Elias (The Clerk):** The neutral observer. He refuses to decide the metaphysics, embodying the constraint that the story should not thesis. His delay tactic is a gesture of uncertainty, not a solution.
