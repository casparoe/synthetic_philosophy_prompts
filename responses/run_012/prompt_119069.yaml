  3.  **Evaluate Severity and Revisions:**

      *   *Most Severe:* **1 vs. 3.** This is the direct contradiction. Quine's indeterminacy applies to *everyone*, including the speaker. If you accept Quine's argument for the native, you must accept it for yourself unless you posit something non-naturalistic (which violates 5).
