          *   *Resolution:* Treat 4 as pragmatic/internal to a system, not metaphysical.
      *   *Tension 3 (Use vs. Determinacy):* 2 vs 3/4. Use is fluid; determinacy implies rigidity.
          *   *Resolution:* Kripkean scepticism.

