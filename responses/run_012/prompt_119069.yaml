      *   *Third:* **2 vs. 5 (Subtle).** "Meaning is use" is often compatible with naturalism, but if "use" implies normative rules (correct/incorrect use), and naturalism only allows physical facts, bridging the is-ought gap is tricky. However, Quine manages this via behaviourism. I'll treat this as less severe than the direct contradictions.

  4.  **Drafting the Audit (incorporating British English):**

      *   *Introduction:* Acknowledge the sophistication of the position set. It's a very Quinean set, except for 3 and 4.
      *   *Tension 1 (The Home Language Paradox):* 1 vs 3. Quine explicitly rejects 3. If 1 is true, 3 is false.
