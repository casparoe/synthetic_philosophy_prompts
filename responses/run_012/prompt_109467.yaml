      *   **The Nature of "Actuality":** In Lewis, "actual" is indexical. In EQM, all branches are equally "actual" in a sense, but an observer only experiences one.
      *   **Decoherence:** The physical mechanism that makes branches *effectively* isolated, even if not ontologically distinct in the Lewisian sense.
