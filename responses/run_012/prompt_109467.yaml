      *   *Nuance:* Ruben's move to drop transitivity is actually a known position in some non-classical mereologies, but it definitely isn't Lewis. I should point out that Ruben is advocating for a *revision* of Lewis, while Anna is defending *Lewis*.
      *   *Physics Nuance:* In EQM, the "shared past" is the same wavefunction amplitude. In Lewis, worlds are distinct concrete entities. The mereology is different. Anna is right on the mereology.
      *   *The "Missing" part:* I should mention that Lewis himself addressed this. He knew about Everett. He said "So much the worse for Everett" (paraphrased) regarding it being a model for modal realism. Actually, Lewis discussed this in *On the Plurality of Worlds*. He distinguishes "divergence" (his view) from "branching" (actualist view). This is crucial.

  7.  **Final Polish:** Ensure the language suits a physicist (talk about structures, relations, isomorphism, ontology vs. formalism). Make sure the distinction between "concrete" (Lewis) and "concrete" (EQM) is clear.

