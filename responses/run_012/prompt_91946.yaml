answer: |-
  Here are ten interview questions designed for your symposium moderator. They are structured to move from conceptual distinctions to political applications, and finally to the normative implications of her view. Each question includes a follow-up tailored to her likely pragmatic defense, along with an analysis of what she will likely concede versus dispute.

  ### Part I: Conceptual Foundations

  **1. The History/Memory Distinction (Topic a)**
  **Question:** Your argument relies heavily on David Rieff's distinction between *history* (an attempt at objective truth) and *memory* (a present-serving mobilization of the past). If we grant that distinction, you argue memory has no intrinsic value. But if a community's "memory" happens to align perfectly with historical truth, does it still lack intrinsic moral value, or does your objection vanish when memory becomes accurate?
  *   **Likely Concession:** She will concede that accurate memory is *preferable* to false memory.
  *   **Likely Dispute:** She will dispute that accuracy grants memory *intrinsic* moral weight; she will argue it still must be justified by its consequences (e.g., does knowing the truth cause more violence?).
  *   **Follow-up:** If accuracy doesn't grant intrinsic value, then on your view, a truthful memory that incites violence is morally inferior to a comforting myth that secures peace. Are you prepared to say that, instrumentally, a lie is sometimes morally superior to the truth?

  **2. Blurring the Distinction (Topic a)**
  **Question:** Many historians argue that the line between history and collective memory is porous; public memory often hardens into the history taught in schools. If memory inevitably shapes history, and you argue we should let memory recede for pragmatic reasons, are you not implicitly arguing that we should allow our historical record to degrade if that degradation serves political stability?
  *   **Likely Concession:** She will concede that memory influences history.
  *   **Likely Dispute:** She will dispute that "letting memory recede" means "degrading the historical record." She will insist archives can remain open even if public commemoration stops.
  *   **Follow-up:** But if public commemoration is the mechanism by which a society transmits history to the next generation, removing the commemorative imperative ensures the archives will eventually go unread. Is your position ultimately that the truth is only for specialists, not for the citizenry?

  **3. Thick and Thin Relations (Topic b)**
  **Question:** Avishai Margalit argues that "thick" relations (family, close community) generate a specific duty to remember that "thin" relations (humanity at large) do not. Do you reject Margalit's distinction entirely, or do you accept that thick relations exist but deny that they generate a *moral* duty to remember, even within a family?
  *   **Likely Concession:** She will likely accept the phenomenological distinction (we *feel* closer to family).
  *   **Likely Dispute:** She will dispute that this feeling generates a *moral obligation*. She will argue it generates only a psychological preference.
  *   **Follow-up:** If a grandmother asks to be remembered by her grandchildren, and they choose to forget because it is pragmatically easier for them, have they wronged *her*, or have they merely optimized their own emotional landscape? If you say they haven't wronged her, are you reducing persons to their utility for the living?

  ### Part II: Political and Psychological Applications

  **4. Transitional Justice and Imposed Silence (Topic c)**
  **Question:** Consider the Spanish *pacto del olvido* or the Chilean settlement, where societies chose to stop relitigating past atrocities to secure democracy. How do you distinguish a society that *chooses* to stop relitigating its past from a society where perpetrators have successfully *imposed* silence on their victims?
  *   **Likely Concession:** She will concede that the *origin* of the silence matters (voluntary vs. coerced).
  *   **Likely Dispute:** She will dispute that the *outcome* is necessarily worse in the coerced case if stability is achieved. She will focus on the downstream effects rather than the procedural justice.
  *   **Follow-up:** But if the "choice" to forget is made by the powerful while the victims are merely outvoted, isn't your pragmatic criterion simply a philosophical justification for the victor's ability to bury the evidence?

  **5. Psychological Forgetting vs. Public Policy (Topic d)**
  **Question:** You insist you are not recommending oblivion. But forgetting is often a psychological event, not a policy decision. We cannot simply decide to forget. Therefore, isn't a "policy of forgetting" actually a policy of *suppressing* other people's memory, which requires active effort rather than passive letting-go?
  *   **Likely Concession:** She will concede that individual psychology cannot be legislated.
  *   **Likely Dispute:** She will dispute that her thesis is about individual psychology. She will clarify she is talking about *public resources* and *state-sponsored commemoration*.
  *   **Follow-up:** Yet, if the state stops funding memorials or curricula, it is actively shaping the psychological environment of its citizens. If you admit this shapes psychology, are you not advocating for state-managed cognitive suppression, just under a softer name?

  **6. Forgetting and Forgiving (Topic e)**
  **Question:** Many traditions hold that forgiveness requires remembering the wrong in order to release it. If we forget, we cannot forgive; we simply ignore. Is forgetting compatible with forgiveness, or does your pragmatic approach to memory inadvertently eliminate the possibility of moral reconciliation?
  *   **Likely Concession:** She may concede that forgiveness is a distinct moral category.
  *   **Likely Dispute:** She will dispute that forgiveness is always necessary or desirable for political peace. She might argue that "moving on" without forgiveness is a valid political goal.
  *   **Follow-up:** If we move on without forgiveness, we are left with indifference. Is a society built on indifference to past wrongs morally stable, or does it merely postpone the reckoning until the next generation?

  **7. Obligations to the Dead (Topic f)**
  **Question:** Your consequentialism focuses on the well-being of the living. But victims of atrocities are often dead. Is there anything owed to the dead that is not owed to the living? If the living are better off forgetting, do the dead lose their claim to justice?
  *   **Likely Concession:** She will concede that we have no *epistemic* access to the desires of the dead.
  *   **Likely Dispute:** She will dispute that the dead have *rights* or *claims*. She will argue obligations are always between living agents.
  *   **Follow-up:** If the dead have no claims, then murder is only wrong because it harms the living community, not the victim. Does your view ultimately strip the victim of their status as a moral patient, turning them into a mere instrument for the living's political calculus?

  ### Part III: Closing Sequence (The "Oblivion" Defense)

  *Note to Moderator: This sequence is designed to narrow the escape route. She will likely try to say, "I'm not saying forgetting is good, just that remembering isn't inherently good." These questions force her to define when remembering is bad.*

  **8. The Negative Value of Memory (Closing 1)**
  **Question:** You state that memory has no *intrinsic* moral value. This implies its value is purely instrumental. But for an instrument to be neutral, it must sometimes be useful and sometimes useless. Does your view allow that memory can have *negative* instrumental value?
  *   **Likely Concession:** She will almost certainly concede this (it is core to her thesis that memory can fuel hatred).
  *   **Likely Dispute:** She will dispute that this makes memory *evil*, merely *counterproductive*.
  *   **Follow-up:** If memory can be counterproductive, then there are cases where remembering actively harms the moral landscape. We agree on that. The question is: what is the threshold?

  **9. A Duty to Forget? (Closing 2)**
  **Question:** If memory can have negative instrumental value, and we have no duty to remember for its own sake, does it follow that in those specific cases where memory causes harm, we have a *positive duty to forget*?
  *   **Likely Concession:** She may hesitate here. She will concede we have a duty to stop *commemorating*.
  *   **Likely Dispute:** She will likely dispute the phrasing "duty to forget," preferring "duty to stop cultivating memory."
  *   **Follow-up:** That is a semantic distinction. If I am cultivating a garden that poisons my neighbors, I have a duty to uproot it. If public memory poisons the political community, do you not owe us a clear criterion for when we must actively uproot it?

  **10. The Wrong-Making Feature (Closing 3)**
  **Question:** This brings us to the final point. You insist you are not praising oblivion, only denying memory's intrinsic value. But if memory has no intrinsic value, and can have negative instrumental value, please tell us specifically: **What, on your view, makes a particular act of remembrance *morally wrong* when it is wrong?** Is it the intent of the rememberer, the suffering of the living, or the distortion of the past?
  *   **Likely Concession:** She will be forced to name a specific consequence (e.g., incitement to violence).
  *   **Likely Dispute:** She will dispute that there is a universal rule; she will insist it is case-by-case.
  *   **Follow-up:** (If she says case-by-case): If it is entirely case-by-case with no intrinsic wrong in erasing the past, then your "not praising oblivion" defense offers no protection against erasure. If you cannot name a feature that makes remembrance *right* other than utility, you have not just denied memory's intrinsic value; you have made it permanently vulnerable to being traded away. How do you protect memory from being the first thing sacrificed in a crisis?
