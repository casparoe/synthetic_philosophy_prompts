  3.  **Drafting the Questions (Iterative Process):**

      *   *Topic (a): History vs. Memory.*
          *   *Idea:* Rieff distinguishes history (truth) from memory (myth/use). If memory is just history, does her argument hold?
          *   *Draft Q1:* You distinguish history from memory. If memory is just accurate history, do you still oppose the duty?
          *   *Follow-up:* If she says history is different, press on how public memory *becomes* history.
          *   *Concede/Dispute:* She'll concede the distinction matters but dispute that public memory can be purely historical.

      *   *Topic (b): Thick/Thin Relations (Margalit).*
          *   *Idea:* Margalit says family/community (thick) owe memory. Does she deny this duty exists even there?
          *   *Draft Q2:* Do you accept Margalit's thick/thin distinction? If yes, do thick relations create a duty?
          *   *Follow-up:* If she denies the duty even in families, ask about betrayal.
          *   *Concede/Dispute:* She might accept the distinction but deny the *moral obligation* derived from it.

      *   *Topic (c): Transitional Justice (Spain, SA, Chile).*
          *   *Idea:* How to tell the difference between healthy forgetting and imposed silence?
          *   *Draft Q3:* Regarding Spain's *pacto del olvido*, how do you distinguish peace from suppression?
          *   *Follow-up:* Who gets to decide? The victims or the state?
          *   *Concede/Dispute:* She'll concede the risk of imposition but dispute that memory guarantees justice.

      *   *Topic (d): Psychological Forgetting vs. Public Policy.*
          *   *Idea:* You can't command forgetting. So isn't "policy of forgetting" actually "policy of suppression"?
          *   *Draft Q4:* Is your thesis about psychological forgetting or public commemoration? Can you policy forgetting?
          *   *Follow-up:* If it's suppression, isn't that an active harm?
          *   *Concede/Dispute:* She'll clarify it's about public resources/commemoration, not brainwashing.

      *   *Topic (e): Forgetting and Forgiving.*
          *   *Idea:* Forgiveness usually requires remembering the wrong to release it. Can you forgive if you forget?
