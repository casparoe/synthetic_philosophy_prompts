          *   Must cover specific topics (a) through (f).
          *   Must include a closing sequence of 3 questions challenging the "not praising oblivion" defense, ending with a specific question about when remembrance is *wrong*.
          *   For every question, indicate what she is likely to *concede* vs. *dispute*.
      *   **Tone:** Intellectual, rigorous, respectful but probing (suitable for a serious high school club).

  2.  **Deconstruct the Guest's Position (Rieffian/Pragmatic Anti-Memorialism):**
      *   *Core Claim:* Memory has no intrinsic value. It is instrumental.
