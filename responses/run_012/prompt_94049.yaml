  Hey, I'm a high school student and I'm trying to understand the Pasadena game for a philosophy club discussion. I get the St. Petersburg game (infinite expected value), but Pasadena seems weirder: you flip a fair coin until the first heads; if the first heads is on toss n, you get (-1)^(n-1) times 2^n over n dollars. If I sum the expected contributions in the natural order I get 1 - 1/2 + 1/3 - 1/4 + ... = ln 2, so it looks like a finite positive expectation. But I've heard alot of people say the expected value is actually undefined. Can you explain, in an intuitive way, why the conditional convergence/rearrangement makes the expectation undefined rather than just infinite, and what that means for whether a rational agent should be willing to pay a fixed amount like 50 cents to play? I probly won't get a super technical proof, so please keep it as intuitive as possible. Act as a decision theory professor talking to a smart but non-expert student. Please think carefully and start with a short brainstorm of the key ideas before the explanation. No citations or reading lists, please. Keep it in American English. At the very end, put a one-sentence summary on its own line in this exact form: \answer{...}
