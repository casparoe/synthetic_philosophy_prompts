      *   *Q2: The Source of Credit.* If not success, then what? Coherence? Explanation?
      *   *Q3: The Historical Counter-Examples.* Ether/Caloric. They *did* predictive work. They were abandoned. How does NFCP handle this?
      *   *Q4: Instrumentalism.* If success doesn't warrant belief in the furniture, aren't we just saving the phenomena?
      *   *Q5: The No Miracles Argument (NMA).* This is the realist's best friend. How does NFCP kill it?
      *   *Q6: Selective Realism.* Can we save *some* parts? Or is it all or nothing?
