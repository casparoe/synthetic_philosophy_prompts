      *   **Goal:** 8-10 interview questions + follow-ups + one "killer" question (what would change his mind).
      *   **Key Themes to Hit:** Source of credit, abandoned predictive posits (ether/caloric), instrumentalism accusation, impact on No Miracles Argument (NMA), falsifiability/changing mind.

  2.  **Deconstruct the Guest's Argument (The "No-Free-Credit Principle"):**
      *   *Claim:* Predictive success $\nrightarrow$ Truth of ontological posits (specifically the "non-predictive furniture").
      *   *Claim:* Realism is about that ontological furniture.
      *   *Implication:* The No Miracles Argument (NMA) fails because success doesn't transfer credit to the ontology.
      *   *Implication:* PMI fails because we don't need to look at history to know success doesn't imply truth of ontology.
      *   *Potential Weakness:* How do we distinguish "predictive work" from "ontological furniture"? If the furniture *does* predictive work, does it get credit? If it gets abandoned, why? If it gets *no* credit, isn't that instrumentalism?

  3.  **Drafting the Questions (Iterative Process):**

