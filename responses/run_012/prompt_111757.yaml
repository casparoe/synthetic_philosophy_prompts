answer: |-
  Here are ten questions designed for a reading group host who knows the difference between a model and the territory. They are drafted to be direct, grounded in scientific practice, and progressively tighter on the logical implications of his "No-Free-Credit Principle" (NFCP).

  ### 1. The Definition of "Furniture"
  "You define realism as a claim about the 'non-predictive furniture' of a theory. In my line of work, if a posit doesn't constrain the data or generate a testable outcome, we treat it as metadata, not ontology. So, what exactly counts as 'non-predictive furniture' that warrants belief? If it doesn't touch the predictions, how does it enter the theory in the first place?"

  *   **Likely Answer:** He will argue that these are the structural or metaphysical assumptions that *frame* the predictions (e.g., spacetime structure, conservation laws) without being direct variables in the equation.
  *   **Follow-up:** "If those assumptions frame the predictions, aren't they implicitly doing predictive work by ruling out other outcomes? If they rule things out, and the ruling out is successful, why do they get *no* credit? You seem to be drawing a line between 'engine' and 'chassis' when the car is moving."

  ### 2. The Source of Warrant
  "If predictive success confers no credit to the ontology, what does? You're a realist, so you believe this furniture is *there*. What is the epistemic warrant for that belief if not the empirical success of the theory containing it?"

  *   **Likely Answer:** He will likely appeal to "Inference to the Best Explanation" (IBE) or coherence, distinct from predictive accuracy.
  *   **Follow-up:** "In practice, we judge an explanation as 'best' largely because it yields correct results elsewhere. If you sever the link between 'getting the right answer' and 'believing the story,' aren't you basing realism on aesthetics rather than evidence?"

  ### 3. The "Working Posit" Problem (Ether/Caloric)
  "Let's look at the history you want to bypass. The luminiferous ether *did* predictive work. It constrained equations; it guided experiments. It was eventually abandoned. Under your principle, since it did predictive work, it gets no credit. But it was also *false*. Doesn't the case of the ether show that posits *doing* predictive work can still be false? Doesn't that blow up your distinction between 'working parts' and 'furniture'?"

  *   **Likely Answer:** He will argue that the ether was a "working posit" and thus, by his own rule, shouldn't have been believed in as real anyway, which vindicates his view that we shouldn't trust predictive parts.
  *   **Follow-up:** "So you're saying scientists *ought* to have been instrumentalists about the ether all along? If your principle tells us to withhold belief from the very things that are successfully driving the research program, aren't you prescribing a philosophy that ignores how discovery actually happens?"

  ### 4. The Instrumentalism Charge
  "Van Fraassen argues we should accept theories as empirically adequate but not true. You say we should believe in the 'non-predictive furniture.' But if the predictive machinery is just a tool for saving the phenomena, and the furniture is untestable, what is the practical difference between your 'Realism with No Free Credit' and sophisticated instrumentalism?"

  *   **Likely Answer:** He will insist that belief matters for theory choice and continuity, even if not grounded in success.
  *   **Follow-up:** "If that belief isn't grounded in the theory's success, what grounds it? If I can swap out your 'real furniture' for a different set of metaphysical assumptions that yield the exact same predictions, on what basis do you tell me I'm wrong?"

  ### 5. Defanging the No Miracles Argument
  "The No Miracles Argument (NMA) is the realist's best weapon: it would be a miracle if the theory worked unless the entities were real. Your NFCP seems to disarm this completely. Are you admitting that predictive success is *no evidence at all* for truth? If so, why call yourself a realist?"

  *   **Likely Answer:** He will argue the NMA is a fallacy of division (assuming the whole theory's success applies to its parts).
  *   **Follow-up:** "If the success of the whole doesn't apply to the parts, and the parts don't contribute individually to the success, then where is the 'miracle' located? If there's no miracle to explain, haven't you removed the primary motivation for being a realist in the first place?"

  ### 6. The Empirical Status of NFCP
  "You argue we don't need the history of science to see NFCP is true. But isn't your principle itself a generalization from the history of science? You only think credit doesn't transfer because you've seen theories succeed and then turn out false. Isn't NFCP just the Pessimistic Meta-Induction in disguise?"

  *   **Likely Answer:** He will claim NFCP is an *a priori* principle about confirmation logic, not an empirical generalization.
  *   **Follow-up:** "If it's *a priori*, how do you account for cases where predictive success *did* seem to track truth, like the prediction of the positron? If your principle ignores those cases, isn't it a rule designed specifically to protect you from being wrong, rather than describing how science works?"

  ### 7. Convergence and Progress
  "In geochemistry, we see models converge. Different methods, same result. We take that as a sign we're closing in on the mantle's actual structure. If predictive success grants no credit to the ontology, how do you explain theoretical convergence without appealing to truth-tracking?"

  *   **Likely Answer:** He might argue convergence is about empirical adequacy or structural preservation, not ontological truth.
  *   **Follow-up:** "If it's just structural preservation, aren't you a structural realist? And if you are, doesn't that admit that the *predictive structure* is the only thing getting credit? That contradicts your claim that realism is about the non-predictive furniture."

  ### 8. Scientific Practice and "Discovery"
  "When I map a subduction zone, I feel I am discovering something that was there before me. Your view suggests I should treat the model as a calculator and only believe in the metaphysical assumptions behind it. Does your philosophy account for the scientist's intuition that successful prediction *is* the signal of reality?"

  *   **Likely Answer:** He will distinguish between the "context of discovery" (psychology) and "context of justification" (philosophy).
  *   **Follow-up:** "If your philosophy of science contradicts the epistemic intuition of practicing scientists—the people actually handling the 'real objects'—why should we adopt it? Is this a philosophy for scientists, or for philosophers observing them?"

  ### 9. Selective Realism
  "You say the predictive parts get no credit. But surely we can be realists about *some* predictive posits? If a theory predicts a new particle and we find it, do you really get no credit for believing in the particle before we found it?"

  *   **Likely Answer:** He will say the credit belongs to the mathematical structure, not the ontological interpretation of the particle.
  *   **Follow-up:** "So if I detect the particle, I should believe in the *detection* but not the *particle*? That sounds like a semantic game. At what point does a 'posit' become 'furniture' in your system, and isn't that line drawn arbitrarily to save the thesis?"

  ### 10. The Falsifier (The Question He'll Hate)
  "Finally, a question on the status of your own principle. The No-Free-Credit Principle is a claim about how evidence relates to ontology. What empirical finding, or what historical case, would force you to abandon it? If success *did* correlate with truth in a specific instance, would you grant credit then, or is NFCP unfalsifiable by design?"

  *   **Likely Answer:** (Expect squirming). He may say it's a conceptual truth, or that correlation doesn't imply warrant.
  *   **Follow-up:** "If it's a conceptual truth that evidence never warrants ontology, then you've defined realism out of existence. If it's empirical, show me the data. If you can't specify what would prove you wrong, aren't you just insulating your position from the very scientific scrutiny you claim to respect?"
