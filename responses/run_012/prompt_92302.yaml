prompt: |-
  ok so im the opinions editor for my school paper. we put out an issue every two weeks and i also run the insta account, which honestly is where most people actually read us. we keep getting op-eds and even some news features that make claims about whole groups of people — "our school just has a culture of not trying," "people from [country] are raised more respectful," "gen z is the lonliest generation," "kids from the flats are built different." sometimes its mean and sometimes its meant as a compliment. weve had two complaints this semester, one from a teacher and one from a girl who said a column about "kids from the flats" (thats the neighborhood by the river, everyone knows what it means) made her feel like a bug under glass. my advisor says i have to come up with a policy but she wont tell me what it should be, she just said "you cant print stereotypes, but you also cant ban describing a community," which is definately not a policy.

  i dont want a lecture on why stereotyping is bad, i want a thing i can actually run. picture this: i have like 20 minutes before we post, im 16, i cant go do research, and the writer is my friend so i cant just say no. give me a checklist — the questions to ask in order, what counts as a good enough answer to each one, the point where the answer is no and we spike the piece, and the point where it stops being about the writing and becomes a call for my advisor because its a values thing not a facts thing. she has to sign off on anything we think is risky and i need to know which ones those are.

  i also made up three little tests and i want you to tell me if theyre any good and where they break, and fold them in if they survive:
  - the swap test: does the sentence still read as true if i swap the group for a different group that overlaps a lot with it? if it survives the swap, its not really about that group.
  - the narrower box test: can i restate it about a smaller group i could actually check? not "our school is apathetic" but "the juniors who signed up for the volunteering drive and then didnt show." if the claim only works because the group is huge, thats a flag.
  - the mechanism test: can the writer say HOW the group thing happens — a policy, a shared experience, an incentive, a history — or is it just "thats how they are"? no mechanism, it goes in the opinion pile with a label on it, not the news pile.

  also one more thing. my friend says the whole idea of a "culture" or a "national character" is fake and you should never generalize about a people, period. my other friend says of course you can, sociologists do it all the time, thats literally their job. i dont know who's right and i need the procedure to not secretly depend on settling that — or if it does, tell me exactly where.

  then run the finished procedure on these three and show me the output:
  1. an op-ed saying our school has a "culture of not caring" and that this is just what this town is like.
  2. a column by a student saying the kids from [some country] at our school are naturally better at math and its a beautiful thing about their culture, and she wants the headline to say it too. i want to run this one — shes a good writer and it reads as nice.
  3. a news piece saying seniors this year applied to four-year colleges at a lower rate than the class of 2019, based on a survey the stats class ran.

  tell me straight which ones the procedure kills and whether ive rigged it so it kills the ones i already didnt like. and tell me what the procedure cant do — the cases where i should just walk it to my advisor instead of pretending i have a rule.
reasoning: |-
  Here's a thinking process that leads to the suggested policy and analysis:

  1.  **Analyze the User and Situation:**
      *   **Role:** Opinions Editor for a high school paper (16 years old).
      *   **Platform:** Bi-weekly print issue + Instagram (primary audience).
      *   **Problem:** Receiving submissions with broad generalizations/stereotypes about groups (school culture, national origin, generation, neighborhood). Some are mean, some are "compliments." Two complaints already filed (teacher + student).
      *   **Constraint:** Advisor says "no stereotypes but don't ban describing community" (vague). Needs a concrete, actionable checklist/policy.
      *   **Time Pressure:** "20 minutes before we post."
      *   **Social Pressure:** Writers are friends; can't just say "no" without backing.
      *   **Goal:** A decision-making flowchart/checklist, evaluation of user's three "tests," resolution of the "generalization debate," and application of the procedure to three specific examples.
      *   **Tone:** Direct, practical, non-preachy, respectful of the user's intelligence and constraints.

  2.  **Evaluate the User's Three Tests:**
      *   *The Swap Test:* (Swap the group). Good for identifying essentialism. If "Kids from the Flats are built different" becomes "Kids from the Hills are built different" and it makes no sense, it might be specific observation. If it makes *too much* sense regardless of the group, it's a cliché. *Weakness:* Can be gamed. Some stereotypes are specific (e.g., "Country X is good at math"). Swapping might reveal bias, but doesn't prove truth.
      *   *The Narrower Box Test:* (Can you make the group smaller/specific?). Excellent. Moves from essentialism to observable behavior. "School is apathetic" vs. "Juniors missed volunteer drive." *Weakness:* Sometimes the broad claim *is* the point (e.g., institutional racism), but for high school op-eds, specificity is usually better.
      *   *The Mechanism Test:* (How does it happen?). Crucial for distinguishing opinion from prejudice. "They are lazy" (no mechanism) vs. "The bus schedule makes it hard to stay late" (mechanism). *Weakness:* Writers can invent fake mechanisms. Needs verification.

      *Verdict:* All three are strong heuristics for a 16-year-old editor. They need to be integrated into a step-by-step workflow.

  3.  **Address the "Generalization Debate" (Friend A vs. Friend B):**
      *   Friend A: Never generalize. (Impossible. Language requires categorization.)
      *   Friend B: Sociologists do it. (True, but they use rigorous methods and qualifiers.)
      *   *Resolution:* The policy shouldn't ban generalizations *period*. It should ban *unsupported* or *essentialist* generalizations. The distinction is between *describing a trend* (allowed with evidence) and *assigning an inherent trait* (danger zone). The procedure needs to flag the *level of certainty* and *attribution of cause*.

  4.  **Drafting the Policy (The "20-Minute Checklist"):**
      *   Needs to be linear.
      *   Needs clear "Stop/Go" signals.
      *   Needs an "Advisor Escalation" trigger.
      *   *Structure:*
          1.  Evidence Check (Facts).
          2.  The User's Tests (Swap, Box, Mechanism).
          3.  Harm/Impact Check (The "Bug Under Glass" factor).
          4.  Escalation Point.

  5.  **Refining the Escalation Point:**
      *   When does it become a values call? When the piece passes the logic tests but still feels ethically murky, or when it touches on protected classes (race, nationality, neighborhood/socioeconomic status) in a way that could be weaponized.
      *   Advisor sign-off needed for: Protected class generalizations, "Culture" claims without hard data, anything that could be read as harassment.

  6.  **Running the Procedure on the Three Examples:**
      *   *Case 1 (School Culture of Not Caring):* Vague, essentialist. Fails Narrower Box. Fails Mechanism. *Verdict: Spike or Major Rewrite.*
      *   *Case 2 (Country X Good at Math):* "Complimentary" stereotype. Fails Swap Test (would be offensive if swapped to a negative trait?). Fails Mechanism (Naturally better?). Touches on nationality/race. *Verdict: Advisor Escalation (High Risk).* Even if "nice," it's a stereotype.
      *   *Case 3 (Seniors College App Rate):* Data-driven. Specific group (Seniors 2024 vs 2019). Mechanism (Survey). *Verdict: Publish (with standard fact-checking).*

  7.  **Checking for Bias/Rigging:**
      *   Does the procedure kill what the user dislikes?
      *   User seems to dislike the "Flats" comment and the "School Apathy" comment.
      *   User *wants* to run the "Math" comment (friend/well-written).
      *   *Honesty Check:* The procedure *must* flag the "Math" comment as risky, even if it's "nice." Positive stereotypes are still stereotypes and can cause the "bug under glass" feeling (pressure to conform). I need to be firm here so the user doesn't get in trouble later.

  8.  **Final Polish:**
      *   Keep it tight. No fluff.
      *   Use the user's language ("spike," "run," "advisor").
      *   Make sure the "Advisor Trigger" is clear.

  9.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Maybe let the "Math" piece run with a disclaimer?
      *   *Correction:* No. National origin + inherent ability = high liability. Advisor *must* see it. The user said they want to run it, but my job is to make the policy robust. I will explain *why* the policy flags it, even if it's uncomfortable.
      *   *Clarification on "Culture":* Distinguish between "Shared habits due to environment" (Okay) vs "Inherent nature" (Not Okay).
      *   *Time limit:* Ensure the checklist can be done in 20 mins. It relies on questioning the writer, not new research.

  10. **Final Output Structure:**
      *   The Policy (Checklist).
      *   Evaluation of User's Tests.
      *   The Generalization Debate Answer.
      *   The 3 Case Studies.
      *   Limitations of the Policy.

  (Proceed to generate response based on these steps.)
answer: |-
  Here is a operational policy designed for a 20-minute deadline, incorporating your tests, followed by the analysis you asked for.

  ### The "20-Minute Green Light" Checklist

  **Step 1: The Evidence Floor (2 Minutes)**
  *   **Question:** Is there *any* concrete evidence (data, specific events, named sources) supporting the claim about the group?
  *   **Pass:** Yes (e.g., "30% of seniors," "Last week's assembly," "Survey results").
  *   **Fail:** No (e.g., "Everyone knows," "It's just the vibe," "People say").
  *   **Action:** If **Fail**, send back for evidence or **Spike**. Do not pass Go.

  **Step 2: Run Your Three Tests (5 Minutes)**
  *   **Swap Test:** Swap the group mentioned for a different demographic (e.g., swap "Kids from the Flats" with "Kids from the Hills," or "Country A" with "Country B").
      *   **Pass:** The sentence becomes false or nonsensical. (Indicates specific observation).
      *   **Fail:** The sentence still reads as "true" or makes the same kind of claim. (Indicates a cliché or stereotype).
  *   **Narrower Box Test:** Can the claim be restated about a smaller, verifiable group?
      *   **Pass:** Yes. (e.g., Change "The School" to "The Junior Class," change "People from Country X" to "Students in the Math Club").
      *   **Fail:** No, the claim *requires* the broad group to make sense.
      *   **Action:** If **Fail**, the writer must rewrite to narrow the scope.
  *   **Mechanism Test:** Does the writer explain *why* the trend exists?
      *   **Pass:** Cites a cause (policy, economic factor, specific event, shared environment).
      *   **Fail:** Attributes it to nature, character, or "culture" without definition.
      *   **Action:** If **Fail**, label as **Pure Opinion** (cannot be in News/Features).

  **Step 3: The "Bug Under Glass" Check (3 Minutes)**
  *   **Question:** If a member of that group read this, would they feel *described* or *defined*?
      *   **Described:** "You did this thing." (Action-based).
      *   **Defined:** "You *are* this thing." (Identity-based).
  *   **Action:** If **Defined**, proceed to Step 4.

  **Step 4: The Advisor Trigger (Immediate)**
  **Send to Advisor if ANY of the following are true:**
  1.  **Protected Classes:** The generalization is about Race, National Origin, Religion, or Neighborhood/Socioeconomic Status (e.g., "The Flats").
  2.  **Inherent Traits:** The piece claims a group is "naturally" better/worse at something (intelligence, behavior, respect).
  3.  **The "Compliment" Trap:** The stereotype is positive (e.g., "good at math," "more respectful"). *Note: Positive stereotypes create pressure and alienate individuals who don't fit.*
  4.  **Conflict:** You and the writer disagree on Step 2 or 3.

  ---

  ### Evaluation of Your Three Tests

  You built these well. They are heuristics, not laws, but they work for your time limit.

  *   **The Swap Test:** **Keep it.** It exposes essentialism.
      *   *Where it breaks:* It can be gamed. If I say "Kids from the Flats are tough," swapping to "Kids from the Hills are tough" might still sound plausible to a biased reader. It detects *clichés*, not necessarily *falsehoods*.
  *   **The Narrower Box Test:** **Strongest tool.** This is your primary defense against lazy writing.
      *   *Where it breaks:* Sometimes systemic issues *are* broad (e.g., "The administration ignores students"). But for high school op-eds, forcing specificity usually improves the argument.
  *   **The Mechanism Test:** **Crucial for News vs. Opinion.**
      *   *Where it breaks:* Writers can invent fake mechanisms ("They are good at math because they value education"). This requires you to judge if the mechanism is plausible. If it sounds like "They value education" without proof, treat it as **No Mechanism**.

  ---

  ### The Generalization Debate (Friend A vs. Friend B)

  **Who is right?** Both, but they are talking about different things.
  *   **Friend A** is right about *identity*. You cannot generalize about who people *are* (character, soul, inherent worth).
  *   **Friend B** is right about *behavior*. You can generalize about what people *do* (trends, habits, statistics), provided you have data.

  **Where the procedure settles this:**
  The procedure does not ban generalizations. It bans **unverified attribution of cause.**
  *   *Allowed:* "Students from Country X scored higher on average." (Observation of behavior/data).
  *   *Banned:* "Students from Country X are naturally better at math." (Attribution of inherent trait).
  *   *The Line:* If the claim relies on "culture" or "nature" to explain the behavior without hard evidence, it crosses from sociology into stereotyping. **Step 4 (Advisor Trigger)** is where this debate is settled. You don't have to win the argument; you just have to flag it.

  ---

  ### Running the Procedure on Your Three Cases

  #### 1. Op-Ed: "School has a culture of not caring / this town is like this."
  *   **Step 1 (Evidence):** Likely Fail. "Culture of not caring" is vague. Unless they cite specific voter turnout or volunteer rates, it's a vibe.
  *   **Step 2 (Tests):**
      *   *Swap:* "This town is apathetic." Swap town? Probably still works. (Fail).
      *   *Box:* Can't narrow it. They need the whole town to make the point. (Fail).
      *   *Mechanism:* "It's just what this town is like." (Fail).
  *   **Step 3 (Bug Check):** Defines the student body by character.
  *   **Verdict:** **SPIKE or MAJOR REWRITE.**
      *   *Why:* It fails the Evidence Floor and Mechanism Test. It is an attack on character without proof.
      *   *Fix:* Writer must identify *one specific instance* of apathy (e.g., "Turnout for SGA was low") and argue about that, not the "town culture."

  #### 2. Column: "Kids from [Country] are naturally better at math / beautiful culture."
  *   **Step 1 (Evidence):** Probably Pass (grades/scores exist).
  *   **Step 2 (Tests):**
      *   *Swap:* If you swap [Country] for a group stereotyped as *bad* at math, does it hold? No. This reveals it relies on a specific stereotype.
      *   *Mechanism:* "Naturally better" / "Culture." This attributes ability to identity, not effort or policy. (Fail).
  *   **Step 3 (Bug Check):** **Defined.** It tells students from that country their value is math ability.
  *   **Step 4 (Advisor Trigger):** **YES.**
      *   **Reason:** Touches on National Origin + Inherent Traits + "Compliment" Trap.
  *   **Verdict:** **DO NOT RUN WITHOUT ADVISOR.**
      *   *Hard Truth:* You said you want to run this because she's a friend and it reads "nice." **This is the exact type of piece that gets complaints.** Positive stereotypes are still stereotypes. They alienate students from that country who *aren't* good at math and imply those who *are* succeed due to genetics/culture rather than work.
      *   *Fix:* Change headline and thesis to: "Students from [Country] often excel in math programs." Remove "naturally." Remove "culture" as the cause unless she has sociological proof. **Advisor must sign off.**

  #### 3. News Piece: "Seniors applied to 4-year colleges at lower rate than Class of 2019."
  *   **Step 1 (Evidence):** Pass (Survey from Stats Class).
  *   **Step 2 (Tests):**
      *   *Swap:* N/A (Specific comparison).
      *   *Box:* Narrow enough (Seniors 2024 vs 2019).
      *   *Mechanism:* Data-driven.
  *   **Step 3 (Bug Check):** **Described.** Reports on behavior, not character.
  *   **Step 4 (Advisor Trigger):** No.
  *   **Verdict:** **RUN.**
      *   *Caveat:* Ensure the "Survey" methodology is sound (sample size, etc.). This is standard journalism.

  ---

  ### Did You Rig It?

  **Honest Assessment:** You might have rigged it to save the "Math" piece, but the procedure I gave you **kills it** (or forces Advisor review).

  *   **Why:** The "Mechanism Test" and "Advisor Trigger" catch "naturally better" claims. Even if it feels nice, claiming a national group is *inherently* smarter is scientifically dubious and ethically risky for a school paper.
  *   **The Bias:** You are more willing to accept "nice" stereotypes than "mean" ones. The policy treats them the same risk level because both result in the "Bug Under Glass" complaint you already received.

  ### What This Procedure Cannot Do (The "Walk to Advisor" List)

  Do not pretend this checklist is a shield. It is a filter. Walk it to your advisor immediately if:

  1.  **The Writer Pushes Back:** If the writer argues that "Culture" is a valid scientific explanation without data, that is a values debate, not an editing one.
  2.  **The "Flats" / Neighborhood Issue:** Any time a piece singles out a specific neighborhood by name (especially one associated with class/race), send it to the advisor. This is legally and ethically higher stakes than "Seniors."
  3.  **You Feel Uneasy:** If your gut says "this feels off" but it passes the checklist, trust your gut. The checklist handles logic; you handle the community pulse.
  4.  **Legal Threats:** If a complaint mentions lawyers or discrimination policy, stop. Advisor handles it.

  **Summary for your 20-minute deadline:**
  1.  Check for evidence.
  2.  Run the 3 Tests.
  3.  If it touches Race/Nation/Neighborhood or claims "Natural" ability -> **Advisor.**
  4.  If it's just vague complaining -> **Spike.**
  5.  If it's data about behavior -> **Run.**
