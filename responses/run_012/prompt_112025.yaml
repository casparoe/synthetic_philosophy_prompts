  ### Essay Question

  **The Logic Box and the Tortoise**

  Consider the following scenario: Tortoise and Achilles are back. This time, Achilles does not offer another conditional; he builds a box. The box has two input registers and an output register, and a transition table such that whenever one input holds *P* and the other holds (*if P then Q*), the box prints *Q*, infallibly, for any *P* and *Q* you like, including cases where the Tortoise is the one feeding it the input. The Tortoise looks at the table, agrees it describes exactly what the box does, and then says: fine, but why should I treat what comes out of the box as a reason to believe *Q*? Achilles says: because that's the rule. The Tortoise says: and why should I take that as a reason?

  **Write an essay addressing the following:**

  1.  Precisely what is the Tortoise asking for at that last step? Is this the same demand as in the original dialogue, or is it subtly different?
  2.  Can "accepting modus ponens" itself be a further belief without the gap re-opening? If not, defend an alternative picture (disposition, practice, hardware, etc.). What does this picture buy, and what does it cost?
  3.  Is the regress actually vicious, or is the demand generating it out of order? State your position and explain what would have to be true for the opposing side to be right.
  4.  **Short Strand:** Does the same problem arise for probabilistic updating? Consider a Tortoise who grants the probability axioms and that credences ought to line up with evidence, but simply never conditionalises. Is this the same regress, a watered-down version, or no problem at all?

  ***

  ### Model Answer

  The Tortoise's challenge in the box scenario shifts the ground from logical implication to normative force. In the original dialogue, the Tortoise demanded that the rule of inference be written down as an additional premise. Here, the box physically enforces the rule. The Tortoise accepts the mechanics but denies the authority of the output. What is being asked for is not a missing premise, but a justification for why mechanical necessity translates into rational obligation. This is subtly different from the original dialogue. Originally, the gap was between premises and conclusion within a proof. Here, the gap is between a causal functional process and a reason for belief. The Tortoise is asking why physical infallibility constitutes epistemic justification. The box guarantees truth preservation, but the Tortoise demands a reason to care about truth preservation. This moves the problem from logic to epistemology.

  Can accepting modus ponens be a further belief? If it is, the regress re-opens. To believe "I ought to infer Q from P and If P then Q" is just another proposition that requires a rule to apply it. This is widely agreed to be the source of the regress: treating constitutive rules as descriptive truths. The alternative picture is that accepting a rule is a matter of practice, disposition, or hardware configuration rather than belief. On this view, logic is not a body of truths we know, but a framework we inhabit. This buys an end to the regress: you cannot demand a justification for the framework from within the framework. However, it costs normative force. If logic is merely how we do think, it is unclear why we ought to think that way. It is genuinely contested whether this pragmatic shift answers the Tortoise. Some argue it dissolves the question as category mistake; others argue it surrenders the normativity of logic to psychology, leaving the Tortoise's challenge unanswered. The dispute hinges on whether normativity can emerge from practice alone.

  Is the regress vicious? This is also live debate. If the demand is for a justification of reasoning itself, the regress is vicious because no finite mind can complete it. However, others argue the demand is out of order. Reasoning does not require a prior justification of its rules; the rules are constitutive of what counts as reasoning. On this view, the regress is benign because the demand for external validation is incoherent. There is no consensus here. Foundationalists seek a stopping point; coherentists or pragmatists accept the circularity or shift to practice. A top answer must acknowledge that declaring the regress vicious assumes a foundationalist epistemology that not all philosophers share. The settled matter is that infinite premises cannot be held in mind; the contested matter is whether reasoning requires holding them.

  Does this apply to probabilistic updating? The structure is identical. The Tortoise grants the axioms and the principle of conditionalization but refuses to update. He treats the norm "update on evidence" as a belief rather than a constraint on credence. This suggests the problem is not specific to deduction but applies to any normative rule governing belief revision. However, there is a disanalogy. Probabilistic coherence is often treated as a synchronic constraint, whereas updating is diachronic. If the Tortoise remains synchronically coherent but never updates, he is statically rational but dynamically inert. Some argue this is less problematic than deductive paralysis, as probability allows for degrees of belief rather than binary acceptance. Others argue it is equally devastating: if one never updates, learning is impossible. Whether this is a watered-down version or the same problem depends on whether one views rationality as primarily about static consistency or dynamic responsiveness. This remains contested in formal epistemology. The key difference is that probabilistic norms are often defended pragmatically (e.g., Dutch Books), whereas logical norms are often defended conceptually. Whether pragmatic defense stops the regress is itself disputed.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Analysis of the Tortoise's Demand (5 Marks)**
  *   **A Range (4-5):** Identifies the shift from *premise* (original) to *authority/normativity* (box). Notes that the box solves causal production but not justificatory force.
  *   **B Range (2-3):** Identifies the regress but treats the box scenario as identical to the original dialogue. Misses the normative/causal distinction.
  *   **C Range (0-1):** Summarizes the story without analyzing the philosophical demand.

  **2. Belief vs. Practice/Disposition (5 Marks)**
  *   **A Range (4-5):** Explains why treating rule-acceptance as belief regenerates the regress. Defends an alternative (practice/disposition) and explicitly identifies the cost (loss of normativity) and the benefit (stopping regress). Acknowledges this is contested.
  *   **B Range (2-3):** Identifies that belief causes regress but fails to articulate the cost of the alternative (normativity problem). Treats the "practice" solution as settled fact.
  *   **C Range (0-1):** Claims the box solves the problem by making the rule physical.

  **3. Viciousness of the Regress (5 Marks)**
  *   **A Range (4-5):** Distinguishes between "vicious because infinite" and "vicious because demand is incoherent." Explicitly states that viewing the regress as vicious depends on foundationalist assumptions. Acknowledges the constitutivist counter-argument.
  *   **B Range (2-3):** Argues the regress is vicious simply because it is infinite. Misses the debate about whether the demand is legitimate.
  *   **C Range (0-1):** Claims logic is unjustified because of the regress.

  **4. Probabilistic Strand (5 Marks)**
  *   **A Range (4-5):** Identifies the structural similarity (conditionalization vs. MP). Discusses the synchronic/diachronic distinction. Takes a stance on whether it is equally devastating, acknowledging the dispute regarding pragmatic vs. conceptual defenses.
  *   **B Range (2-3):** Says "yes it's the same" or "no it's different" without analyzing the diachronic/synchronic distinction or the nature of the norm.
  *   **C Range (0-1):** Ignores the probabilistic strand or treats it as unrelated to logic.

  **Specific Wrong Turns (Deductions applied to total)**
  *   **The Skeptical Slide (-3 marks):** Inferring from the regress that deduction itself is unjustified or irrational. (The regress challenges *foundations*, not the *validity* of inference).
  *   **The Trilemma Conflation (-2 marks):** Treating this solely as an instance of the Münchhausen Trilemma without addressing the specific rule-following nature of Carroll's problem.
  *   **The Premise Mistake (-2 marks):** Arguing that the box solves the problem because the rule is now "physical" or "hardware" without addressing the normative gap.
  *   **The Consensus Error (-2 marks):** Presenting contested claims (e.g., "practice solves the problem") as settled consensus without qualification.

  **Grade Boundaries**
  *   **A (17-20):** Makes all specific moves in A Range. Explicitly flags contested issues. Avoids all Wrong Turns.
  *   **B (14-16):** Makes most A Range moves but misses nuance on contested issues or slips into one Wrong Turn.
  *   **C (10-13):** Understands the basics but treats contested issues as settled or misses the normative shift in the box scenario.
  *   **D/F (0-9):** Fundamental misunderstanding of the regress or the prompt.
