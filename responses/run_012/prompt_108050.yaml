      *   **Input Text:** A paragraph defining presentism as the inevitability of present standards, claiming no objective history exists, arguing serious historians *should* judge by present standards to avoid elite bias, defining the opposite as "antiquarianism" (foreign country/no judgment), and concluding with a "relevant vs. facts" dilemma.

  2.  **Deconstruct the Input Paragraph (Claim by Claim):**
