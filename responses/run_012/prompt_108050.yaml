prompt: |-
  I'm a software engineer with no formal philosophy background, and I've been trying to get my head around presentism in historiography. I picked up a popular history book at the airport, and its intro has a paragraph that basically says: 'Presentism is the view that historians can never escape the standards of their own time. Since every generation rewrites the past in its own image, there is no objective history; the best we can do is admit our biases. That's why serious historians today insist on judging the past by present-day moral standards -- to pretend otherwise is to smuggle in the values of dead elites. The opposite of presentism is antiquarianism, which treats the past as a foreign country and refuses to make moral judgments at all. So the debate is basically: do you want history that's relevant to today, or history that's just a collection of facts?' I definately have a feeling this is mostly right but off in ways that matter, and I don't trust my ability to seperate the descriptive claims from the normative ones.

  To try to make sense of it, I made up a distinction between what I've been calling 'clock presentism' and 'compass presentism.' Clock presentism is the idea that we inevitably use present-day concepts, questions, and language when we study the past -- like we're reading old texts through a clock we can't reset. Compass presentism is the idea that we should use present-day values as the standard for judging past people and institutions -- like the past is a journey and we're the ones holding the compass. I don't know if these labels are standard or even good, but I want you to use them (or replace them with better ones) to audit the book's paragraph claim by claim. Which parts would a working historian or philosopher of history accept? Which are common simplifications? Which are conflations -- especially of the descriptive claim that we're influenced by the present with the normative claim that we ought to judge the past by present standards? And does the book's final 'relevant vs. facts' conclusion actually follow from anything true in the summary, or is it a false dilemma?

  Please go through it in order, and at the end tell me how confident you are in each of your main verdicts, and single out the one point you're least sure about -- I'd rather know where the uncertainty is than get a smooth answer. I'm not looking for a reading list or names to look up; I can't search anyway. I just want the conceptual map and where the paragraph goes wrong.
