      *   *Claim 2:* "Since every generation rewrites the past in its own image, there is no objective history; the best we can do is admit our biases." (Inference from 1)
      *   *Claim 3:* "That's why serious historians today insist on judging the past by present-day moral standards..." (Normative/Prescriptive)
      *   *Claim 4:* "...to pretend otherwise is to smuggle in the values of dead elites." (Justification for 3)
      *   *Claim 5:* "The opposite of presentism is antiquarianism, which treats the past as a foreign country and refuses to make moral judgments at all." (Definition of Opposite)
      *   *Claim 6:* "So the debate is basically: do you want history that's relevant to today, or history that's just a collection of facts?" (Conclusion/False Dilemma)

  3.  **Evaluate Claims against Professional Historiography/Philosophy of History:**
      *   *Context:* In academic history/philosophy, "presentism" is almost universally a *pejorative* term (a sin to be avoided), not a positive methodology. The book paragraph flips this, treating it as a virtuous necessity or even a moral imperative. This is the biggest red flag.
      *   *User's Distinction:* "Clock Presentism" (inevitability of perspective) vs. "Compass Presentism" (moral judgment). This is actually quite sharp. In academic terms, these map roughly to "Historical Contextualism's limits" (epistemic) vs. "Moral Judgement in History" (ethical).
      *   *Claim 1 & 2 (The Descriptive):* It is true that we write from the present (E.H. Carr, Becker). But "no objective history" is a strong postmodern claim, not universally accepted. Most historians aim for intersubjective objectivity even if perfect neutrality is impossible.
      *   *Claim 3 (The Normative):* This is where the paragraph goes off the rails academically. Most historians argue *against* judging the past by present standards (anachronism). They argue for understanding context. The paragraph claims the opposite ("serious historians... insist on judging"). This is a specific political stance (often associated with certain strands of public history or activist history), not the consensus of the discipline.
      *   *Claim 4 (The Justification):* "Smuggling in values of dead elites." This is a specific critical theory argument. It's not the standard definition of avoiding presentism. Usually, avoiding presentism is about *accuracy*, not just elite bias.
      *   *Claim 5 (The Opposite):* "Antiquarianism" is indeed a term, but defining it solely as "refusing moral judgments" is reductive. It usually means obsessing over details without synthesis. "The past is a foreign country" (L.P. Hartley) is about *difference*, not necessarily moral abstention.
      *   *Claim 6 (The Dilemma):* "Relevant vs. Facts." This is a classic false dichotomy. Good history is both rigorous (facts) and meaningful (relevant).

  4.  **Drafting the Response (incorporating User's Terms):**
      *   *Adopt the Terms:* "Clock Presentism" and "Compass Presentism" are excellent. I will validate them but map them to standard concepts (Epistemic vs. Ethical Presentism) without giving names/books.
      *   *Structure:* Introduction -> Claim-by-Claim Audit -> The False Dilemma -> Confidence Scores -> Uncertainty.
