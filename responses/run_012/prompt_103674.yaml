answer: |-
  **JOINT STATEMENT ON INFORMATION AGGREGATION AND THE LIMITS OF SPECULATIVE TRADE**

  **Date:** October 24, 2023
  **Signatories:** The Information Aggregation Working Group (Camp A) and the Rational Expectations Constraints Group (Camp B)
  **Subject:** Consensus and Dissensus Regarding the Epistemic Function of Market Prices

  Following a period of adversarial collaboration, the undersigned parties submit this joint statement. Our objective was not to force a premature consensus, but to rigorously map the boundary between the epistemic capabilities of prices (Camp A) and the logical constraints on speculative trade under rational expectations (Camp B). We agree that the tension between these views is the central engine of modern market microstructure theory.

  ### I. AGREED CLAIMS

  Both camps endorse the following propositions as established facts or necessary logical constraints:

  1.  **Prices are Informative, But Not Omniscient.** Market prices statistically incorporate private information better than any single participant's estimate, but they do not achieve perfect revelation. Price movements correlate with subsequent fundamental outcomes, validating the claim that prices compress dispersed data.
  2.  **The Necessity of Non-Informational Motives.** Purely speculative trade (betting on private information against a counterparty) cannot occur in equilibrium if traders share a common prior, possess common knowledge of rationality, and know that prices fully reveal information. For information to be traded, there must exist exogenous "noise," liquidity shocks, or hedging needs that mask the informed trader's identity.
  3.  **The Grossman-Stiglitz Constraint.** A state of fully revealing prices is self-undermining. If prices perfectly revealed all private information, no agent would have an incentive to incur costs to acquire that information. Therefore, markets must maintain a degree of informational inefficiency to compensate information gatherers.
  4.  **The Role of Heterogeneity.** Observed trading volume cannot be explained by information alone under a strict Common Prior Assumption (CPA). Trade volume requires either heterogeneous priors (different interpretations of the same data), heterogeneous preferences (risk aversion/endowments), or the presence of noise traders.
  5.  **No-Trade Theorems Define Boundaries, Not Reality.** The No-Trade theorems (Milgrom-Stokey, Aumann) successfully establish the *logical limits* of what rational expectations can sustain, but they do not prove that real-world markets fail to aggregate information. They prove that aggregation requires friction.
  6.  **Information Has a Half-Life.** Private information decays as it becomes public. Both camps agree that the speed of this decay is a function of market liquidity and the cost of arbitrage, not merely the existence of the information itself.

  ### II. RESIDUAL DISAGREEMENTS

  While we agree on the constraints above, we disagree on the primary characterization of market activity.

  **Camp A (Price-as-Aggregator) maintains:**
  That the *primary* function of the market is epistemic discovery. The frictions required by No-Trade theorems (noise, liquidity shocks) are secondary technicalities that enable the core phenomenon: the market acts as a distributed computer. The fact that prices move predictably ahead of public announcements demonstrates that the "aggregation" effect dominates the "no-trade" constraint in practical magnitude. The equilibrium is a dynamic process of convergence, not a static logical impossibility.

  **Camp B (No-Trade/Constraints) maintains:**
  That the *primary* constraint on market activity is the incentive compatibility of the traders. The "aggregation" observed is a byproduct of liquidity provision and risk-sharing, not a miracle of computation. Because the Common Prior Assumption is the only way to ground a scientific theory of expectations, deviations from it (to explain trade) render the "market knows best" claim unfalsifiable. If trade is driven by heterogeneous priors, prices reflect a clash of worldviews, not the compression of objective truth.

  ### III. CRUXES AND TESTABLE PREDICTIONS

  We identify three specific cruxes where our disagreements are substantive rather than semantic. For each, we specify the argument, the agreed-upon case or observation that bears on it, and our divergent predictions.

  #### Crux 1: The Workload of the Common Prior Assumption (CPA)
  *   **The Issue:** Camp B argues that without CPA, "rational trade" explains everything and nothing. Camp A argues that CPA is empirically false; agents have different models, not just different data, and this model diversity is what allows information to enter prices without triggering a No-Trade deadlock.
  *   **Agreed Test Case:** Experimental markets where participants are given identical priors and identical private signals, but are allowed to communicate or observe trades over multiple rounds.
  *   **Camp A Prediction:** Prices will converge to the fundamental value even if the Common Prior is slightly perturbed, because the *process* of trading forces model alignment. Trade volume will remain high as models update.
  *   **Camp B Prediction:** If the Common Prior is strictly enforced, trade volume will collapse to near-zero after the first round. If trade persists, it proves agents have effectively divergent priors, meaning the price reflects a "weighted average of biases" rather than "objective information."

  #### Crux 2: Static Snapshot vs. Dynamic Discovery
  *   **The Issue:** Camp B argues that No-Trade results hold in dynamic settings via backward induction (if we know we will know later, we shouldn't trade now). Camp A argues that markets are non-ergodic discovery processes where rationality is bounded by time; the "unraveling" logic fails because agents are learning *how* to interpret prices in real-time.
  *   **Agreed Test Case:** High-frequency event studies surrounding unanticipated earnings announcements, measuring the ratio of volume to price variance in the first millisecond vs. the first day.
  *   **Camp A Prediction:** The "information content" per unit of volume will increase over time. Early trade is noisy; later trade is more informative. This validates the "dynamic discovery" view.
  *   **Camp B Prediction:** The "information content" per unit of volume will be highest at the onset and decay. If trade continues at high volume after the price has adjusted, it is evidence of liquidity/hedging motives, not information processing. Persistent volume post-adjustment undermines the claim that prices are still "discovering."

  #### Crux 3: Discriminating Observations (The "Smoking Gun")
  *   **The Issue:** Is there any conceivable observation that could distinguish between "prices aggregating private info" and "prices moving due to correlated liquidity shocks"?
  *   **Agreed Test Case:** A natural experiment where private information is known to exist (e.g., a sealed regulatory decision) but liquidity is exogenously frozen (e.g., a trading halt or circuit breaker) vs. when liquidity is normal.
  *   **Camp A Prediction:** When trading resumes after a halt holding private info, the price gap (jump) will be larger than in normal conditions, proving info was "stored" in the queue and aggregated upon release.
  *   **Camp B Prediction:** The price jump will be identical regardless of the halt duration, provided the public information set is the same. If the jump is larger, it indicates a liquidity premium, not information aggregation. The "stored information" is a metaphor; only order flow matters.

  ### IV. NOTE ON VERBAL DISPUTES

  We acknowledge that a portion of our quarrel is terminological.

  1.  **"Knowledge" vs. "Belief":** Camp A often uses "knowledge" to mean "statistically predictive price signals." Camp B insists "knowledge" implies justified true belief held by an agent. We agree to use "Price Informativeness" when referring to Camp A's claim to avoid implying the market is a cognitive agent.
  2.  **"Equilibrium":** Camp B refers to a state where no further trade is desirable (No-Trade equilibrium). Camp A refers to a state where supply equals demand (Walrasian equilibrium). We acknowledge that Camp A's equilibrium *requires* Camp B's "frictions" (noise traders) to exist.
  3.  **"Rationality":** Camp B defines rationality as consistency with Bayesian updating and Common Knowledge. Camp A defines rationality as "profit-seeking behavior that survives selection." We agree that these are different definitions. Camp B's rationality is a logical constraint; Camp A's rationality is an evolutionary outcome.

  **Conclusion:**
  We conclude that the "Price-as-Aggregator" view is a robust empirical approximation that relies on the "No-Trade" constraints for its theoretical coherence. Prices *do* aggregate information, but *only because* the market is not frictionless, not fully transparent, and populated by agents with diverse motives. The market knows more than its members, but only because its members do not fully understand why they are trading.

  ***

  **Signed,**

  *For the Information Aggregation Working Group:*
  [Name/Representative]

  *For the Rational Expectations Constraints Group:*
  [Name/Representative]
