answer: |-
  **Essay Question**

  **1.** David Lewis's Best System Account (BSA) analyzes laws of nature as the theorems of the deductive system that best balances simplicity, strength, and fit relative to the total Humean mosaic. A common objection, recently sharpened by critics from the sciences, is that this renders lawhood objectionably global: whether a regularity counts as a law here depends on facts arbitrarily far away in space and time, even in causally disconnected regions.

  Write an essay that addresses the following three components:
  (a) State the BSA precisely enough to demonstrate *why* lawhood must supervene on the global mosaic rather than local facts, and explain the "distant particle" consequence: how a minute change in a causally sealed region could alter the laws governing our local neighborhood.
  (b) Evaluate the Humean response to this consequence. What must the Humean concede about the metaphysics of laws, and how can they still maintain that these global laws support the local counterfactuals and explanations required by scientific practice?
  (c) Press the Anti-Humean (Governing/Dispositional) view with the mirror-image problem. If laws are local, intrinsic features that necessitate outcomes, explain the difficulty in securing the global scope and uninstantiated cases laws seem to possess. Does positing a "governing" relation provide genuine explanatory work over and above the regularity, or does it merely rename the mystery?

  Conclude with a diagnosis of the fundamental metaphysical disagreement. Is this a substantive dispute about the structure of reality, or a verbal confusion regarding the word "law"?

  ***

  **Model Answer**

  The Best System Account (BSA), championed by David Lewis, defines laws of nature not as primitive governing relations, but as summaries of the Humean mosaic—the total distribution of local qualitative properties across spacetime. A generalization is a law if and only if it appears as an axiom or theorem in the deductive system that achieves the optimal balance of simplicity, strength, and fit regarding the *entire* mosaic. Because the "best" system is selected by comparing candidates against the totality of facts, lawhood supervenes globally. There is no local fact about a specific region that fixes its laws independently of the rest of the universe.

  This global supervenience entails the "distant particle" consequence. Suppose our world's best system is Newtonian mechanics. Now consider a possible world identical to ours in our local neighborhood, but containing an extra pair of isolated particles in a distant galaxy moving in a slightly irregular pattern. If including a specific exception clause for these particles improves the system's overall fit without sacrificing too much simplicity, the new best system for that world differs from ours. Consequently, the laws of nature in that world are not Newtonian, even locally. The lawhood of a regularity here depends on events there, regardless of causal connectivity.

  The Humean must concede that laws are not metaphysically robust entities that produce or govern events. They are descriptive summaries. However, the Humean argues this does not undermine scientific practice. Explanation on the BSA is systematization; to explain an event is to show how it fits into the best deductive system. Counterfactuals are supported not by modal glue, but by the resilience of the best system. Even if the laws depend on distant facts, the best system *for us* is determined by the mosaic we inhabit. As long as the distant anomalies are truly isolated, they do not disrupt the local systematization we use for prediction. The Humean buys locality of practice at the cost of global metaphysics.

  The Anti-Humean, seeking to restore laws as local world-makers, faces a mirror-image difficulty. If laws are intrinsic powers or governing relations located within specific entities, how do they secure the universal scope laws typically possess? A local power explains why *this* electron repels *that* one, but it struggles to explain why this holds for all electrons, including uninstantiated ones in empty regions of spacetime. To secure global scope, the Anti-Humean must posit a universal structure that transcends local instances, risking a return to global dependence. Furthermore, it is unclear if "governing" adds explanatory value. Saying a law *necessitates* an outcome risks being a mere label for the observed regularity. Unless the mechanism of necessitation is specified, the Anti-Humean offers a picture of modal force without explaining how that force is transmitted or recognized.

  Ultimately, the dispute is substantive, not verbal. It is a disagreement over the cost of metaphysical commitment. The Humean accepts global supervenience to avoid occult modal powers, prioritizing ontological parsimony. The Anti-Humean accepts mysterious modal forces to preserve the intuition that laws make the world rather than summarize it. Progress requires neither side dismissing the other's cost as fatal, but rather clarifying whether "explanation" in science requires metaphysical production or merely cognitive systematization.

  ***

  **Marking Scheme (20 Marks)**

  **Standard for Grading:**
  *   **A Range (16-20):** Derives consequences from premises rather than asserting them; treats Humean and Anti-Humean costs symmetrically; offers a defensible, argued diagnosis of the dispute.
  *   **B Range (12-15):** Correctly identifies positions but treats one side as obviously correct/incorrect; misses the symmetry of the problems; concludes the dispute is merely verbal without argument.

  | Point | Criteria (4 marks each) | Typical Student Failure |
  | :--- | :--- | :--- |
  | **1. BSA Precision & Global Supervenience** | Defines BSA via simplicity/strength/fit on the *total* mosaic and explicitly derives that lawhood cannot be local because the "best" system is a global optimization. | Defines BSA vaguely as "regularities" without mentioning the deductive system or total mosaic, failing to show *why* it is global. |
  | **2. The Distant Particle Derivation** | Explains the thought experiment: a distant change alters the global best system, thereby changing local lawhood, even without causal contact. | Asserts that Humean laws are "global" as a brute fact without walking through the mechanism of how the distant particle changes the system. |
  | **3. Humean Defense (Explanation/Counterfactuals)** | Articulates that Humean explanation is systematization, not production, and argues local counterfactuals hold because local mosaic fixes the local best system *for us*. | Claims Humeans cannot support counterfactuals at all, or concedes the objection is fatal without exploring the Humean pragmatic defense. |
  | **4. Anti-Humean Challenge (Scope & Value)** | Presses how local powers secure universal/uninstantiated scope and questions whether "necessitation" explains anything beyond the regularity itself. | Assumes "governing" automatically solves the problem of induction or fails to ask how local powers project to global regularities. |
  | **5. Final Diagnosis** | Identifies the core trade-off (parsimony vs. modal intuition) and argues the dispute is substantive based on differing metaphysical priorities. | Dismisses the debate as "just semantics" or "definitions" without analyzing the underlying metaphysical commitments. |
