answer: |-
  PEIRCE: You keep speaking of truth as if it were a currency spent in the present moment. "What works," "what leads," "what cashes out." But if truth is merely the expedient in the way of thinking, then you have abolished the very constraint that makes inquiry possible. Truth is not what you *can* believe without stumbling; it is what you *must* believe if you push investigation far enough. It is the opinion fated to be ultimately agreed to by all who investigate.

  JAMES: And that is precisely where you vanish into the metaphysical clouds, Charles. The "final opinion"? The "long run"? That is a limit nobody ever reaches. It is a fancy way of never answering the question. I am talking about truth as it lives in the human mind. Truth *happens* to an idea. It becomes true, is made true by events. If a belief helps a man navigate his life, connects him to reality, and contradicts nothing, in what sense is it not true *now*? Why wait for the death of the sun to call it truth?

  PEIRCE: Because reality is what it is, regardless of what you or I or any community thinks. Consider a claim about the past. Say, the exact number of hairs on Caesar's head when he crossed the Rubicon. The records are burned. The witnesses dead. No possible inquiry can ever settle it. For you, is there no truth here?

  JAMES: For me, there is no *meaning* here. If the belief cannot cash out in anticipated experience, if it makes no difference to any possible verification, then asserting it is true or false is idle. It's a pseudo-question.

  PEIRCE: And there lies your nominalism. You think because you cannot verify it, the fact does not stand. But the fact *does* stand. There was a number. Reality is independent of thought. If you say truth depends on verification, you make the universe wait on our convenience. The truth of that number was fixed two thousand years ago. Our ignorance does not dissolve the fact.

  JAMES: But truth is a property of the *belief*, not the fact in itself. A fact is just there. Truth is the function of the belief leading us to that fact. If no belief can lead us there, the predicate "true" has no grip. You want truth to be a static correspondence. I say truth is the process of alignment.

  PEIRCE: Then let us test your alignment. Suppose a community inquires as honestly as possible. They follow every rule of science. They converge, unanimously, on a theory. But suppose—hypothetically—that there is a bias built into their cognition they can never detect. They converge on something false. On your view, since it works for them and they agree, is it truth? On my view, it is not. It is not the *final* opinion, because reality would eventually break through that bias if inquiry continued indefinitely.

  JAMES: But if the bias is *undetectable* by definition, Charles, then your "indefinitely" is a theological promise, not a logical guarantee. You are relying on a hope that reality *must* reveal itself. What if the universe is opaque to our specific structure of mind? Then your "final opinion" is just a collective hallucination stretched over eternity. My view handles this better: if the belief works for them, if it guides their expectations successfully within their universe, it is true *for them*. Truth is plural.

  PEIRCE: Truth cannot be plural if reality is one. If you say "true for them," you are speaking of utility, not truth. You are confusing the comfort of the believer with the correctness of the representation. This leads directly to your willingness to endorse beliefs simply because they are beneficial.

  JAMES: I endorse them when the option is living, forced, and momentous, and evidence is insufficient. Take religious faith. If believing in a moral order gives a man the strength to live virtuously, and no inquiry can settle the metaphysics either way, why forbid it? The belief creates the verification. By acting on it, he makes it true in his life.

  PEIRCE: Because it blocks the road of inquiry. It says, "Stop here, this feels good." That is the sin. And look at what happens when utility shifts. Consider a belief that was useful and then got refuted. Phlogiston. It organized chemistry for a decade. It worked. Was it true then?

  JAMES: It was true insofar as it led chemists successfully through the experiments of that era. It connected phenomena. When it stopped connecting them, when it began to produce friction in experience, it ceased to be true. Truth changes.

  PEIRCE: No. It was never true. It was a useful fiction. If truth changes, then contradiction is allowed. A proposition cannot be true today and false tomorrow. What changes is our *knowledge* of the truth, not the truth itself. You are collapsing the distinction between being right and feeling right.

  JAMES: And you are collapsing the distinction between truth and a dead idol. You want truth to be independent of the knower. I am telling you truth is a relation between the knower and the known. Cut out the knower, cut out the life, and you have no truth, only existence.

  PEIRCE: This brings us to the root of it. You are a nominalist. You think generals—laws, habits, universals—are just names we give to similarities. You think reality is just brute facts, secondness.

  JAMES: I think reality is what we encounter. Laws are descriptions of how encounters repeat.

  PEIRCE: And that is why you cannot secure truth. Laws are real. Thirdness is real. The habit-taking tendency of the universe is objective. If laws were merely our descriptions, inquiry would not converge. It converges because there is a real generality out there dragging us toward it. The "would-be" of things—the conditional necessity that if you drop a stone, it *would* fall—that is real regardless of whether anyone drops it.

  JAMES: But that "would-be" is only meaningful in terms of the actual falls we experience or anticipate. You reify the habit. I say the habit is just the summary of the events. You want to say the law causes the events. I say the law is the name we give the pattern of events.

  PEIRCE: If the law is just the summary, then prediction is magic. Why should the future resemble the past? Only because there is a real continuity, a real universal, governing the events. My realism about universals is the only thing that saves science from being a lucky guess. Your view makes truth a human artifact.

  JAMES: My view makes truth a human *responsibility*. You leave us waiting for a convergence that may never come, justified by a realism we can never touch. I ask men to live now, to verify now, to make truth where they can.

  PEIRCE: And I ask men to submit to the external yoke. To acknowledge that there is a truth they might be wrong about, even if everyone agrees with them. Even if it hurts. Especially if it hurts. Your pragmatism risks becoming a philosophy of consolation.

  JAMES: And yours risks becoming a philosophy of despair. A truth that no one can ever hold, that exists only in the limit of an infinite future, is a truth for God, not for men. I am doing philosophy for men.

  PEIRCE: Then you are doing psychology, not logic. Truth is not what men need. It is what men are destined to find if they don't cheat.

  JAMES: But if the finding changes the thing found, as it does in human affairs, then your destiny is a fiction. We make the truth as much as we find it.

  PEIRCE: We find it. We may stumble, we may err, but the rock we trip over is there before the foot meets it.

  JAMES: And the pain of the trip is the truth. Not the rock in the dark.

  PEIRCE: The rock is the truth. The pain is just the notice.

  JAMES: Without the pain, the rock is nothing to us.

  PEIRCE: It is something to itself. And that is enough.

  JAMES: It is not enough for me.

  PEIRCE: Then you are not an inquirer. You are a believer.

  JAMES: And you are not a pragmatist. You are a scholastic.

  PEIRCE: I am the only one who takes the consequences of reality seriously.

  JAMES: And I am the only one who takes the consequences of life seriously.

  PEIRCE: We shall not agree.

  JAMES: No. We shall not.
