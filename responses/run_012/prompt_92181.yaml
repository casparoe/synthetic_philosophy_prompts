          *   Is it real? (Yes, it's the distinction between constraints on the *function* vs. constraints on the *outcome*).
          *   Cost to add? (New primitive: Inalienable Control).
      *   **Conclusion:** Summary of the trade-off.

  8.  *(Self-Correction during drafting)*: Be careful with "Incentive Constraints." In mechanism design, incentive compatibility (IC) means agents report truthfully. Sen's paradox isn't primarily about IC (lying); it's about the aggregation of *true* preferences conflicting with rights. I should clarify that Liberalism in Sen is not an incentive constraint (IC) but a *structural constraint on the Social Choice Function (SCF)*. The rationalist might confuse it with IC. I need to make sure I distinguish "Agent has the power to decide" (Sen) from "Agent has the incentive to report" (Mech Design). Actually, Sen's decisiveness is closer to "The mechanism *must* output the agent's preferred option for this pair," which is a hard constraint on the mechanism, not an incentive constraint for the agent.

      *Refining the "Liberalism" translation:* In mechanism design terms, Minimal Liberalism says the SCF $f(R)$ is not a function of the full profile $R$ for certain pairs. For pair $(x,y)$ assigned to agent $i$, $f(R)$ depends *only* on $R_i$ for that pair. This is a *modularity* or *decentralization* constraint on the computation of the social choice.

      *Refining the "Coase" point:* If we allow trading, we are effectively changing the preference profile $R$ to $R'$. Sen's theorem applies to *any* profile. If the profile includes "meddlesome" preferences (I care about your book), trading might resolve the *cycle* in a specific instance, but the *logical impossibility* remains for some other profile. However, the deeper point is that Sen's rights are *non-tradable*. If you allow trading, you are no longer satisfying Sen's Minimal Liberalism condition as originally defined (which implies the right stays with the person). You are satisfying a "Market Liberalism" condition.

