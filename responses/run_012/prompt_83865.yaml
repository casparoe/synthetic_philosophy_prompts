answer: |-
  Here is the definite verdict you requested.

  ### 1. The First Pattern: The Valence Flip
  **Verdict:** The label **"Thick Concepts"** is **not close enough** to do the work. It describes the *semantics* of the terms (that description and evaluation are entangled), but it fails to explain the *conditions of ascription* (that the evaluation depends on the observer's substantive agreement).

  **The Phenomenon:** **"The Substantive Co-option of Formal Virtues."**
  *   **What it is:** This occurs when a term that purports to describe a formal relation of the agent to their maxims (e.g., "consistency," "conscience," "integrity") is functionally used to endorse the *content* of those maxims. The word "integrity" promises a judgment about the *structure* of the will (steadfastness), but it delivers a judgment about the *truth* of the belief (correctness).
  *   **What it is not:** It is not merely "bias." Bias implies a distortion of a neutral standard. Here, there is no neutral standard available to the observer. It is also not "Thick Concepts" in the Williamsian sense. A thick concept like "cruel" entails that the action is bad *by definition*. But "principled" does not entail the principle is good *by definition*—yet we refuse to apply the word unless we think the principle is good. The evaluation is not internal to the meaning; it is a precondition for the word's use.
  *   **The Edges:** The edge lies at the point of **radical disagreement**. If a observer thinks a maxim is merely *mistaken* but harmless, they might still grant "integrity." If they think the maxim is *repellent*, the word "integrity" becomes unavailable to them, even if the agent's consistency is mathematically perfect. The concept breaks down when the cost of acknowledging the agent's formal virtue is the risk of legitimizing their substantive vice.

  **Why "Thick Concepts" Fails:** Thick concepts explain why we cannot *define* "cruel" without referencing "bad." They do not explain why we withhold "principled" from a consistent Nazi. We *could* linguistically allow "principled Nazi," but our moral psychology treats the ascription of "principled" as a form of endorsement. The phenomenon is not semantic; it is **performative**. To call someone "conscientious" is to invite others to trust them. We refuse to issue that invitation if we distrust the content.

  ### 2. The Second Pattern: The Naming Asymmetry
  **Verdict:** There is no single standard analytic term for this, but the closest established framework is **Hegel's critique of *Moralität* (Morality)** in the *Phenomenology of Spirit*, specifically the dialectic of the "Beautiful Soul" and the "Hard Heart." However, for your purpose, the functional concept is **"Constitutive Blindness."**

  **The Phenomenon:** **"Constitutive Blindness."**
  *   **What it is:** A normative framework cannot name its own characteristic failure as a *vice* without undermining its own foundational virtue.
      *   For the **Rule-Traditionalist**, the foundational virtue is *Obedience to the Universal*. To name the failure ("Blind Obedience") is to admit the Universal can be wrong, which collapses the authority of the rule. Thus, the failure must be described as a virtue ("Duty").
      *   For the **Autonomy-Traditionalist**, the foundational virtue is *Fidelity to Self*. To name the failure ("Self-Righteousness" or "Arbitrariness") is to admit the Self can be corrupt, which collapses the authority of conscience. Thus, the failure must be described as a virtue ("Authenticity").
  *   **What it is not:** It is not simple hypocrisy. Hypocrisy implies knowing the truth and hiding it. Constitutive Blindness implies the framework *structurally prevents* the agent from seeing the vice *as* a vice. It is an epistemic limit imposed by the normative system itself.
  *   **The Edges:** The edge is reached only in **retrospect** or from an **external framework**. You can only see the "legalism" of the rule-follower if you already value autonomy. You can only see the "caprice" of the autonomy-seeker if you already value order. Within the system, the vice is invisible.

  ### 3. What Survives: Integrity Beyond Content
  You asked what would count as integrity or conscience that survives a verdict on the content.
  **Verdict:** Only **"Volitional Coherence"** survives, but it is normatively inert.

  If we strip away the observer's agreement with the content, "integrity" reduces to the **diachronic stability of the will**. This is the concept found in Harry Frankfurt's work on "volitional unity."
  *   **The Carving:** We must distinguish **Moral Integrity** (adherence to *correct* norms) from **Formal Integrity** (adherence to *one's own* norms).
  *   **The Problem:** Formal Integrity alone is empty. A consistent murderer has formal integrity. Therefore, the word "integrity" in ordinary language *cannot* be purely formal; it carries a tacit claim to substantive value.
  *   **The Solution:** If you want a concept that does work independent of content, you must abandon the word "integrity" for that purpose. Use **"Volitional Coherence."** Reserve "Integrity" for the hybrid state where Volitional Coherence aligns with Substantive Correctness.
  *   **Why this carving is better:** It admits the user's suspicion: "Integrity" does not do independent work. It is a composite currency. It pays out only when both the *bank* (the agent's will) and the *currency* (the moral content) are sound. By splitting the terms, you stop pretending that "steadfastness" guarantees "goodness."

  ### Summary Recommendation
  Do not use "Thick Concepts." It misdiagnoses a pragmatic condition of ascription as a semantic feature of meaning.

  Instead, adopt this pairing:
  1.  For the valence flip: **"The Substantive Co-option of Formal Virtues."** This captures that we steal formal words to do substantive work.
  2.  For the naming asymmetry: **"Constitutive Blindness."** This captures that the blindness is a feature of the system's architecture, not the agent's negligence.

  If you must have one umbrella term for the whole dynamic you observed in the German and American departments, call it **"The Asymmetry of Aretaic Ascription."** It signals that virtue-words are not distributed based on the agent's internal state, but on the observer's relational stance toward the agent's maxims. This preserves your insight that the words do not do the work we think they do: they are not mirrors of the soul, but flags of alliance.
