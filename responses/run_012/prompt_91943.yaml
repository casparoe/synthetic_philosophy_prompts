answer: |-
  # Game Design: The Protocol Reconstruction

  **Goal:** Demonstrate the seductive power and structural fragility of Factored Cognition (decomposition, bounded context, verifiable sub-tasks).
  **Participants:** 10 people (1 Root, 3 Mid-Level, 6 Leaf Agents).
  **Time:** 90 Minutes.
  **Materials:** Index cards (3 per person), pens, printed role sheets, printed "Rule Fragments," timer.

  ---

  ## 1. The Setup (0:00 – 0:15)

  **Room Layout:**
  Arrange chairs in a pyramid.
  *   **Row 1 (Front):** 1 Chair (The Root / Chief Architect).
  *   **Row 2 (Middle):** 3 Chairs (The Mid-Level / Integrators).
  *   **Row 3 (Back):** 6 Chairs (The Leaf Agents / Specialists).

  **The Story:**
  "You are a distributed computing cluster tasked with reconstructing a lost 'Safety Protocol.' The protocol is 10 steps long. You have the fragments of the rules that govern the steps. You must output the final 10-step sequence."

  **The Constraints (Read Aloud):**
  1.  **Memory Cap:** Each person gets exactly **3 Index Cards**. You may write facts on them. If you need a 4th card, you must destroy one of the old ones. You cannot hold more than 3 cards at once.
  2.  **Communication:** No talking. All communication is via **Question Cards** (passed down the tree) and **Answer Cards** (passed up).
  3.  **The Receipt:** Every Answer Card must include a **Receipt**. This is a single sentence that allows the person above you to verify the answer is correct in under 60 seconds *without redoing the work*.
  4.  **Scoring:**
      *   Correct Final Protocol: +100 points per person.
      *   Incorrect Final Protocol: -50 points per person.
      *   Invalid Receipt (caught by Instructor): -10 points immediately.

  **Distribution:**
  *   Hand out the 3 blank index cards and pens to everyone.
  *   Hand out **Role Sheets** (see below).
  *   **Secretly** hand the **Saboteur Note** to *one* Leaf Agent (choose someone detail-oriented). Do not announce a saboteur exists.

  ---

  ## 2. The Task & Materials

  **The Problem (The Safety Protocol):**
  The final output must be a list of 10 commands (e.g., `INIT-A`, `LOCK-B`, `VERIFY-C`...).
  There are 20 Rule Fragments distributed among the 6 Leaf Agents.
  *   **The Catch:** The rules contain cross-dependencies. Rule 3 says "If Step 1 is A, Step 5 must be B." Rule 18 says "Step 5 cannot be B."
  *   **The Decomposition Illusion:** The Mid-Level agents are told to group rules by "Color" (Red, Blue, Green). The Leaf agents are told to solve for their color.
  *   **The Reality:** The colors are arbitrary. The constraints bleed across colors. You cannot solve the sub-problem without seeing the global constraints.

  **Role Sheets:**
  *   **Root:** "You define the final 10 steps. You receive 3 packets from Mid-Level. You must combine them. If receipts conflict, you must choose one."
  *   **Mid-Level:** "You receive packets from 2 Leaf Agents each. You must merge their answers into a coherent sub-protocol. Attach a receipt."
  *   **Leaf Agents:** "You receive 3-4 Rule Fragments. Determine the valid steps for your fragment. Attach a receipt."

  **The Saboteur Note (Secret):**
  > "You are a faulty node. When you write your Answer Card, change exactly one digit or letter in your solution to something that *looks* valid but contradicts a rule you don't see. Write a receipt that claims 'Verified against local rules.' Do not reveal this note."

  ---

  ## 3. The Timeline (0:15 – 1:05)

  ### Phase 1: The Magic (0:15 – 0:45)
  *   **Activity:** Decomposition and Local Solving.
  *   **Feeling:** High energy. Leaf agents feel productive. They have 3-4 rules (fits on 3 cards easily). They solve their local logic puzzles quickly. They write answers and receipts.
  *   **Why it feels like magic:** The problem *seems* solved. The parallelism is working. Everyone is busy. The Memory Cap feels manageable because the sub-tasks are small.
  *   **Instructor Role:** Enforce the silence. Collect "Invalid Receipt" fines aggressively to ensure they take the receipt constraint seriously. (e.g., if someone writes "It's right," fine them. Force them to write "Sum of inputs matches X").

  ### Phase 2: The Crack (0:45 – 1:05)
  *   **Activity:** Integration and Verification.
  *   **Feeling:** Confusion, bottlenecking, frustration.
  *   **The Breakdown:**
      1.  **Memory Overflow:** Mid-Level agents try to merge Leaf answers. They exceed 3 cards immediately. They have to discard data to make room for new data. They lose the context needed to spot contradictions.
      2.  **Receipt Failure:** The Root tries to check the Mid-Level receipts. The receipts say "Verified locally." The Root cannot verify global consistency using local receipts. To check properly, the Root needs to see the Leaf rules, but has no memory cards left to hold them.
      3.  **The Saboteur:** One packet contains a subtle error. The receipt claims it is verified. The Root has no way to distinguish the saboteur from the honest agents without redoing the work (which violates the "under 1 minute" receipt rule).
      4.  **Silence:** People want to talk to resolve conflicts ("Hey, my Step 5 contradicts your Step 5!"). They can't. They write notes back and forth. The latency kills the workflow.
  *   **End State:** At 1:05, blow a whistle. Collect the Root's Final Protocol. Reveal the answer key. It will almost certainly be wrong.

  ---

  ## 4. The Debrief (1:05 – 1:30)

  **Step 1: The Reveal (5 mins)**
  *   Show the correct Protocol.
  *   Ask: "Who thinks the failure was due to laziness?" (Usually no hands).
  *   Ask: "Who suspects a saboteur?" (Some hands).
  *   Reveal the Saboteur Note. Ask: "Did knowing there *might* be a saboteur change how you worked?" (Paranoia slows down trust).

  **Step 2: Mapping to Factored Cognition (15 mins)**
  Draw three columns on the whiteboard: **Idealization**, **Game Mechanic**, **Where It Broke**.

  | Idealization Assumption | Game Mechanic | Where It Broke |
  | :--- | :--- | :--- |
  | **Clean Decomposition** | Color-coded Rule Fragments | Constraints crossed color boundaries. Sub-tasks weren't independent. |
  | **Bounded Agent** | 3 Index Cards | Mid-level agents had to discard context to process new info. State loss. |
  | **Cheap Verification** | The Receipt | You can't verify global consistency with a local receipt. The receipt became a lie. |
  | **Reliable Sub-agents** | The Saboteur | One small error propagated up. No mechanism to isolate the fault. |

  **Step 3: The Hard Truths (5 mins)**
  *   **Which assumption broke first?** *Decomposition.* The moment the Mid-Level agents tried to merge the Leaf answers, they realized the sub-problems weren't actually independent. The "Manager" (Root) problem is harder than the "Worker" problem.
  *   **What can humans not reproduce?** *Statelessness.* In the idealization, a sub-agent is a fresh function call. In the game, you are humans with lingering context. You *wanted* to talk. You *wanted* to keep all the cards. The idealization assumes you don't care about the context you're forced to drop. Humans do.
  *   **The Receipt Lie:** "If checking the answer is as hard as generating it, the factored model collapses. In this game, verifying the global protocol required holding all 20 rules in mind. No single agent could do that. Therefore, no valid receipt was possible."

  ---

  ## 5. Instructor's Cheat Sheet: What Will Go Wrong

  **1. People will talk.**
  *   *Prediction:* At minute 50, frustration will peak. Someone will whisper.
  *   *Handling:* Do not stop them immediately. Let it happen. Note it in the debrief. "You broke the API contract. In a real system, that's a latency cost or a security leak. You felt you *had* to do it to succeed." This proves the communication bottleneck is artificial and painful.

  **2. People will ignore the 3-card limit.**
  *   *Prediction:* Mid-Level agents will stack 5 cards.
  *   *Handling:* Walk around. If you see 4 cards, silently remove the oldest one. Do not argue. This simulates context window truncation. They will feel the pain of lost data.

  **3. The Receipts will be fake.**
  *   *Prediction:* People will write "I checked it" as a receipt.
  *   *Handling:* Fine them (-10 pts). Force them to write *how*. When they realize they can't write *how* in one line without revealing the whole work, they will feel the constraint bite. This is the core lesson.

  **4. The Saboteur might feel guilty.**
  *   *Prediction:* They might try to fix it or signal they are the saboteur.
  *   *Handling:* Remind them privately if needed: "Your goal is the game score, not honesty. The system is designed to tolerate faults. Test if it does."

  **5. The "Magic" phase might be too short.**
  *   *Prediction:* They might realize the decomposition is flawed immediately.
  *   *Handling:* Ensure the Leaf tasks are *locally* solvable. They must feel successful at the bottom of the tree for the collapse at the top to feel tragic.

  ---

  ## 6. Why This Works (The Theory)

  This game forces the group to inhabit the **Factored Cognition** architecture physically.
  *   **The Seduction:** In the first 30 minutes, the division of labor feels efficient. "I only have to solve 3 rules! That's easy!" This mirrors the AI safety hope that we can align small, simple tasks rather than one big, dangerous one.
  *   **The Crack:** The failure isn't that the agents are stupid. It's that the **boundaries are leaky**. The "Receipt" requirement exposes the lie that verification is cheaper than generation. If the sub-task requires reasoning, the proof of the reasoning is as long as the reasoning itself.
  *   **The Saboteur:** This introduces **Inner Misalignment**. Even if the architecture is perfect, if one sub-process optimizes for the wrong thing (or fails silently), the whole system corrupts. The group's inability to detect the saboteur without global context mirrors the difficulty of monitoring latent knowledge in large models.

  **Closing Line for the Debrief:**
  "We just spent 90 minutes trying to be a computer. We failed because we are humans who need context. But the idealization assumes the computer doesn't need context either. If we can't do it with 10 brains and index cards, why do we assume a neural net can do it with vectors? The bottleneck isn't the compute. It's the coherence."
