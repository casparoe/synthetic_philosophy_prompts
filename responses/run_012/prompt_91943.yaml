prompt: |-
  Next week my AI safety reading group (about 10 people, 90 minutes) is on the factored cognition idealization — the picture where a hard question gets chopped into small sub-questions, each sub-question goes to a fresh bounded agent who sees nothing else, and the answers get recombined, recursively, all the way down. Design an in-class game where they feel why that picture is so seductive before they feel where it cracks. Build it around this mechanic: everyone's memory is capped at three index cards of facts, all communication is written (question cards and answer cards, no talking), and every answer card must come with a receipt — one line that lets the asker check the answer in under a minute without redoing the work. Give me the rules, the materials, the question to hand them, a scoring scheme that rewards a correct final answer and punishes wrong ones, and a timeline. The first half should feel like magic: they should nail something no one of them could do alone. The second half should fall apart on its own, without me explaining why. Also slip in one secret saboteur sub-agent who gives plausible but subtly wrong answers, and don't tell the group whether there even is one. Then the debrief: map what happened onto the assumptions the idealization is quietly making (clean decomposition, an idealized copy on every leaf, cheap checking of every answer), say which one broke first, tell me what will definately go wrong the first time I run it and how to handle it, and be straight about which part of the idealization a room of people just can't reproduce. American English, please.
