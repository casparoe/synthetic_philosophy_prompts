      *   **Topic:** Factored Cognition Idealization (hard questions $\to$ sub-questions $\to$ bounded agents $\to$ recombination).
      *   **Goal:** Design an in-class game (10 people, 90 mins) to make them *feel* the seduction and then the failure of this model.
      *   **Constraints:**
          *   Memory cap: 3 index cards per person.
          *   Communication: Written only (Question/Answer cards).
          *   Receipt Requirement: Every answer needs a 1-line verification check (<1 min).
          *   Scoring: Reward correct final answer, punish wrong ones.
          *   Timeline: First half = magic (success), Second half = collapse (failure).
          *   Saboteur: One secret agent giving plausible but wrong answers (group doesn't know if one exists).
          *   Debrief: Map to assumptions (decomposition, idealized copies, cheap checking), identify break points, predict failure modes, be honest about human limitations vs. idealization.
          *   Language: American English.

  2.  **Deconstruct the "Factored Cognition" Idealization:**
      *   *Assumption 1: Decomposability.* Any hard problem can be broken into independent, easier sub-problems.
      *   *Assumption 2: Context Independence.* Sub-agents don't need the full context of the parent problem to solve their slice.
      *   *Assumption 3: Verification.* It's easier to check an answer than to generate it (the "receipt").
      *   *Assumption 4: Reliability.* Sub-agents perform competently within their bounds.
      *   *The Crack:* Context loss, accumulation of small errors, the difficulty of *structuring* the decomposition (the "manager" problem), and the impossibility of verifying complex reasoning with a one-liner.

  3.  **Design the Game ("The Tower of Cards"):**
      *   *Task:* Needs to be hard enough that no individual can do it alone in the time limit, but decomposable enough to seem possible. A logic puzzle or a constrained optimization problem works best. Let's go with a **Constrained Schedule/Logic Grid**. It requires holding many facts in mind (violating the memory cap) and checking consistency (violating the receipt cap).
      *   *Structure:* Hierarchical. 1 Root (Manager), 3 Branch Managers, 6 Leaf Agents. (Total 10).
      *   *Memory Cap:* 3 index cards. Once full, you must discard or stop working.
      *   *Communication:* Pass notes up and down the tree.
      *   *Saboteur:* One Leaf Agent.
      *   *Receipts:* Must be written on the Answer Card.

  4.  **Drafting the Mechanics:**
      *   *The Problem:* "The Interstellar Conference." Schedule 12 speakers into 4 rooms over 3 time slots with complex constraints (e.g., "A cannot be with B," "C needs Projector," "If D is in Room 1, E must be in Room 2").
      *   *Why this works:* It looks decomposable (assign rooms, then times), but constraints cross-cut boundaries. Verification is hard (checking one slot might break a constraint elsewhere).
      *   *The Receipt Trap:* Asking for a 1-line verification for a logic constraint is inherently flawed. You can't verify a global constraint locally. This is where it breaks.

  5.  **Refining the Timeline (90 Minutes):**
      *   0-10: Setup & Rules.
      *   10-40: Round 1 (The Magic). Simplified problem. They succeed. High energy.
      *   40-70: Round 2 (The Crack). Hard problem. Memory fills up. Receipts become lies. Saboteur strikes.
      *   70-90: Debrief.

      *Correction:* The prompt asks for *one* game where the first half feels like magic and the second falls apart. Splitting into two rounds might dilute the "collapse" feeling. Better to have one continuous task that starts easy (low hanging fruit) and gets harder as the tree deepens.
      *Revised Plan:* One complex task. The "Magic" phase is the initial decomposition and early wins. The "Crack" phase is when the sub-answers need to be integrated and the receipts fail to verify the integration.
      *Actually, let's stick to the prompt's flow:* "First half should feel like magic... Second half should fall apart." A single continuous task works best. The initial decomposition feels empowering. The integration reveals the rot.

  6.  **Developing the Saboteur:**
      *   Role: Leaf Agent.
      *   Action: Solve correctly but flip one critical variable (e.g., change "Room A" to "Room B" where B is valid-looking but conflicts upstream).
      *   Secrecy: Only the Instructor knows.

  7.  **Developing the Receipt Constraint:**
      *   This is the critical failure point. "Verify in under 1 minute."
      *   For logic puzzles, you can't verify a solution locally without global context. Participants will write fake receipts like "Checked against constraints" which doesn't actually help the manager.

  8.  **Drafting the Debrief:**
      *   Map game mechanics to AI concepts.
      *   Memory Cap = Bounded Context Window.
      *   Written Only = Stateless API calls.
      *   Receipt = Verifiable Compute / Proof of Work.
      *   Saboteur = Adversarial Input / Model Drift / Inner Misalignment.
      *   Key Takeaway: Decomposition isn't free. Context switching costs money. Verification is as hard as generation for coherent tasks.

  9.  **Addressing "What will definitely go wrong":**
      *   People will talk.
      *   People will ignore the 3-card limit.
      *   The "Receipt" will be ignored or faked blatantly.
      *   The Manager will get bottlenecked.
      *   *Mitigation:* Be a strict facilitator. Collect cards physically.

  10. **Review against Constraints:**
      *   10 people? Yes (1 Manager, 3 Mid, 6 Leaf).
