      *   **Principle of Indifference (PoI):** Primarily Bayesian epistemology/confirmation theory (Keynes, Jaynes). It's about *intra-agent* prior generation. How do I assign probabilities when evidence is silent? It relies on symmetry of *states of the world*.
      *   **Relationship:**
          *   CPA *requires* priors to exist. It doesn't tell you *what* they are, only that they must be *shared*.
