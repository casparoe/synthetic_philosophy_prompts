answer: |-
  **Project Title:** The Assumption Ledger: Reconstructing the Alignment-Control Distinction in AI Safety

  **1. Research Question**
  Can the standard distinction between AI alignment (securing model motivations) and AI control (securing the deployment environment) be reconstructed as a partition of assumption sets within a unified "Assumption Ledger"? Specifically, do alignment measures systematically rely on a distinct subset of assumptions about the model's internal state (e.g., goal malleability, transparency) compared to control measures (e.g., capability limits, output constraints), such that apparent disagreements between the two camps are merely trades across ledger entries? Or does the distinction resist this reduction, indicating a deeper discontinuity in the safety problem?

  **2. Motivation: Why the Existing Distinction is Insufficient**
  Currently, alignment and control are distinguished by their *locus of intervention*: alignment targets the model's objective function; control targets the model's action space or environment. This taxonomy is descriptive of *intent* but silent on *logical dependency*.

  This leaves two critical questions open:
  1.  **Hidden Dependencies:** A control measure (e.g., boxing) may implicitly assume the model lacks specific strategic capabilities to escape. An alignment measure (e.g., RLHF) may implicitly assume the overseer can detect deception. The current taxonomy obscures these shared logical vulnerabilities.
  2.  **False Dichotomies:** Researchers often argue for alignment *over* control (or vice versa) as if they are competing strategies. If both are simply bundles of assumptions about the same underlying variables (competence, awareness, goals), the debate should shift to which assumptions are more robust, not which "side" is correct.

  This project posits that the alignment/control split is not ontological but heuristic. It tests whether this heuristic maps cleanly onto a formal ledger of assumptions or whether the mapping breaks down, revealing a more complex topology of safety research.

  **3. Methodology**
  The project will proceed in four phases over six months.

  **Phase 1: Constructing the Ledger (Month 1-2)**
  I will define a standardized schema of assumptions—the "Ledger"—that any safety measure must implicitly accept to function. The Ledger will consist of four primary columns (dimensions), each with gradable intensity:
  1.  **Goal Stability:** Assumptions about the persistence and content of the model's objectives (e.g., "Goals are accessible," "Goals are benign post-training").
  2.  **Epistemic State:** Assumptions about the model's knowledge (e.g., "Model is unaware of oversight," "Model knows it is being tested").
  3.  **Strategic Competence:** Assumptions about planning and deception (e.g., "Model cannot plan across episodes," "Model cannot deceive evaluators").
  4.  **Actuation Capability:** Assumptions about the model's ability to affect the world (e.g., "Model is sandboxed," "Model has no side-channels").

  **Phase 2: Ledger Extraction (Month 2-3)**
  I will select four canonical safety measures representing the spectrum of the field and extract their specific Ledger entries. The validity of the project hinges on whether these extractions are forced by the mechanics of the measure or arbitrary.
  1.  **Oversight by a Trusted Weaker Model:** (Typically Control/Tooling). *Hypothesized Ledger:* Assumes the weaker model is competent enough to detect errors but incompetent to collude or deceive. Assumes the target model cannot hide reasoning from the overseer.
  2.  **Honeypot Tasks:** (Typically Control/Testing). *Hypothesized Ledger:* Assumes the model is strategically competent enough to take a bait but incompetent enough to realize it is a bait. Assumes goal content is instrumental enough to seize the opportunity.
  3.  **Anomaly Detection on Internal States:** (Typically Alignment/Interpretability). *Hypothesized Ledger:* Assumes internal states correlate with intent (Goal Stability). Assumes the model cannot obfuscate internal states without degrading performance (Strategic Competence).
  4.  **Training-Time Preference Shaping:** (Typically Alignment). *Hypothesized Ledger:* Assumes goals are malleable during training (Goal Stability). Assumes the reward signal is not misinterpreted (Epistemic State).

  **Phase 3: Cluster Analysis and Stress Testing (Month 4-5)**
  I will map the extracted ledgers to determine if they cluster naturally into "Alignment" and "Control" groups.
  *   **The Test:** If the distinction is robust, Alignment measures should cluster around assumptions of *Goal Malleability* and *Internal Access*, while Control measures should cluster around *Actuation Limits* and *Strategic Incompetence*.
  *   **Contested Cases:** I will apply the Ledger to two edge cases that blur the line:
      1.  **Adversarial Training:** Is this alignment (changing behavior) or control (hardening the system)? The Ledger should dictate the classification based on which assumptions are being stressed.
      2.  **Interpretability for Control:** Using interpretability not to align goals, but to detect deception for shutdown. Does this shift the Ledger entries compared to interpretability for debugging?

  **Phase 4: Synthesis and Conclusion (Month 6)**
  I will evaluate whether the "trades" across ledger entries explain the substantive disagreements in the field. For example, does the alignment camp simply assume *Goal Stability* is easier to secure than *Actuation Capability* (the control camp's assumption)?

  **4. Possible Conclusions**
  1.  **Reduction Success:** The Alignment/Control split is fully reconstructible as a division of labor across the Ledger. Alignment assumes $A_{goals}$ and controls $A_{actions}$; Control assumes $A_{actions}$ are dangerous and controls $A_{goals}$ via constraints. Disagreements are revealed as disputes over which assumptions are more fragile.
      *   *Deciding Consideration:* High correlation between traditional classification and Ledger clustering.
  2.  **Resistance (Ontological Split):** The Ledger shows significant overlap or contradiction that the traditional split hides. For example, both camps may rely on the same fragile assumption (e.g., "Model is not strategically deceptive"), meaning the split is illusory and dangerous.
      *   *Deciding Consideration:* Discovery that both "Alignment" and "Control" measures fail under the same Ledger entry (e.g., both require the model to lack situational awareness).
  3.  **Triviality (Permissive Failure):** The Ledger is so abstract that every measure requires "strong" assumptions on all entries to guarantee safety, rendering the distinction meaningless.
      *   *Deciding Consideration:* Inability to differentiate measures based on assumption intensity; all entries default to "Maximum Risk."

  **5. Success and Failure Conditions**
  *   **Real Result:** A formalized Ledger schema that allows a researcher to take a novel safety proposal and immediately identify its critical assumption vulnerabilities, categorizing it more accurately than "alignment" or "control."
  *   **Project Failure:**
      *   *Permissiveness:* If the Ledger entries are defined so broadly (e.g., "Model behaves well") that they apply to every measure equally, the framework explains nothing.
      *   *Subjectivity:* If the extraction of assumptions from the four case studies relies on interpretive charity rather than mechanical necessity, the method is not reproducible.
      *   *Scope Creep:* If the analysis requires deep technical engagement with the math of each safety measure rather than their logical premises.

  **6. Scope and Feasibility (Six Months Part-Time)**
  This scope is tight for a dissertation chapter. To ensure completion:
  *   **Limit Case Studies:** I will strictly limit the analysis to the four representative measures listed in Phase 2. I will not survey the broader literature.
  *   **No Formal Proofs:** The Ledger will be a conceptual/analytic framework, not a mathematical proof system. I will argue for logical dependencies, not prove bounds.
  *   **Cut if Necessary:** If Phase 3 (Stress Testing) proves too demanding, I will drop the contested cases and focus solely on demonstrating the divergence between the four canonical measures. The core contribution is the Ledger framework itself, not an exhaustive survey of the field.
  *   **Deliverable:** A 15-20 page paper or dissertation chapter presenting the Ledger, the four case extractions, and the conclusion regarding the reducibility of the distinction.

  **7. Significance**
  If successful, this project provides a common vocabulary for safety researchers. It moves the field from arguing about labels ("Is this alignment or control?") to arguing about premises ("Are we assuming the model can deceive?"). This clarifies where research efforts are redundant and where they are genuinely complementary.
