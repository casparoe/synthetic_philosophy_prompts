  2.  **Deconstruct the Core Idea:**
      *   *Current View:* Alignment = fix the mind; Control = fix the cage.
      *   *Proposed View:* Safety Measure $M$ works iff Assumptions $A_1, A_2, ... A_n$ hold.
      *   *Hypothesis:* "Alignment" measures assume $A_{internal}$ (goals are benign) but worry about $A_{external}$ (capability to act). "Control" measures assume $A_{external}$ (capabilities are high/hostile) but try to constrain $A_{internal}$ (goals don't matter if boxed).
      *   *Refinement:* Actually, the user suggests the split is about *which propositions are assumed without argument*.
          *   Alignment often assumes: We can access/change motivations.
          *   Control often assumes: Motivations are hostile/unreachable, so we constrain output/action.
      *   *The Ledger:* A standardized list of assumptions (Goal Content, Meta-Awareness, Strategic Competence, Actuation Capability).
      *   *The Test:* Map specific techniques to the ledger. Do they cluster naturally? Or is the mapping arbitrary?

  3.  **Drafting the Proposal - Section by Section:**

      *   **Title:** Needs to be punchy but academic. "The Assumption Ledger," "Reframing Alignment and Control." Let's go with *The Assumption Ledger: Reconstructing the Alignment-Control Distinction in AI Safety*.
      *   **Abstract/Summary:** Brief overview of the problem and the proposed method.
      *   **Research Question:** Needs to be sharp. *Is the alignment/control distinction reducible to a partition of assumption sets within a unified safety ledger?*
      *   **Background/Motivation:** Why is the current split vague? It focuses on *locus of intervention* (mind vs. environment) rather than *logical dependencies*. This leads to confusion when measures overlap (e.g., RLHF is alignment, but relies on control-like oversight).
      *   **Methodology:**
          *   *Step 1: Define the Ledger.* What are the rows? (Goal Content, Epistemic State, Strategic Capability, Actuation).
          *   *Step 2: Case Studies.* Select 4-5 specific measures (as requested: trusted weaker model, honeypots, anomaly detection, preference shaping).
