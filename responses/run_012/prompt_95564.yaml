answer: |-
  Your reading is not a flattening; it is astute and aligns with the dominant scholarly consensus on Hobbes's epistemology. You have correctly identified the tension between Hobbes's nominalism (universals are names) and his claim to scientific certainty (geometry). You are also right to suspect that the "maker's knowledge" thesis is genuinely Hobbesian and not merely Vico read backward.

  However, there is a crucial nuance in your second question regarding moral vocabulary that requires correction. Hobbes does not believe the definitional method *fails* to secure certainty in moral vocabulary; rather, he argues that past moral philosophy failed because it did not *apply* the method. His goal in *Leviathan* is to make civil philosophy as certain as geometry.

  Here is a breakdown of the doctrine behind the passage to help resolve your specific puzzles.

  ### 1. What does "God-given" add?
  You ask what the claim that geometry is "the only science that it hath pleased God hitherto to bestow" adds to the earlier remark about God instructing Adam.

  *   **Adam vs. Geometry:** The story of Adam naming the creatures establishes the *origin* of language and the right to impose names (nominalism). However, naming alone does not produce science. Science requires "reckoning" (reasoning) upon those names.
  *   **The "Hitherto" Clause:** The word "hitherto" is the operative term. Hobbes is making a historical claim, not just a theological one. He is saying that of all the fields of inquiry humans have attempted, only geometry has successfully followed the correct method (settling definitions first) to produce indisputable truth.
  *   **The Divine Sanction:** By calling it a gift from God, Hobbes is insulating geometry from theological critique. In the 17th century, mathematics was sometimes viewed with suspicion by divines (as potentially materialist or deterministic). Framing it as a divine gift legitimizes the *method* of geometry as the gold standard for truth, which Hobbes intends to copy for his political philosophy.
  *   **The Faculty vs. The Content:** Your intuition is correct: God gave the *light of reason* (the faculty), but humans construct the *definitions*. The "gift" is the capacity to achieve certainty through reasoning, which has only been fully realized in geometry *so far*.

  ### 2. Geometry vs. Moral Vocabulary
  You ask: *"Why should the definitional method secure certainty in geometry but not in the moral vocabulary Hobbes requires for civil philosophy?"*

  This is the pivot point of Hobbes's entire project. The answer is that the definitional method **does** secure certainty in moral vocabulary, *provided* it is treated geometrically.

  *   **The Problem of Common Moral Language:** In Chapter 4, Hobbes critiques the *current* state of moral vocabulary (words like "justice," "courage," "wisdom"). These words are uncertain not because they *cannot* be defined, but because in common usage, they are defined by passion and interest. As Hobbes says, "men measure... the greatness of the mind... by the height of their own passions." Because the definitions are not settled at the beginning, the reasoning that follows is contentious.
  *   **The Geometric Remedy:** Geometers do not argue about what a "circle" is. They stipulate: "Let a circle be a figure whereof all lines drawn from the center to the circumference are equal." Once that definition is settled by consent, the consequences follow necessarily.
  *   **Civil Philosophy as the Second Science:** In Chapter 9 ("Of the Several Subjects of Knowledge"), Hobbes explicitly adds Civil Philosophy to Geometry. He writes that we can have scientific knowledge of the Commonwealth because **we make the Commonwealth.**
      *   We cannot have perfect scientific knowledge of Nature (Physics) because God made Nature, and we cannot know the infinite causes behind natural effects.
      *   We *can* know Geometry because we construct the figures in our own minds.
      *   We *can* know Politics because we construct the State through Covenant.

  Therefore, the passage in Chapter 4 is a **methodological prescription**. Hobbes is telling the reader: "Geometry works because they define terms first. Moral philosophy has failed because they haven't. I am now going to do for the State what geometers did for figures."

  ### 3. The "Maker's Knowledge" Thesis
  You noted that the idea that "we know with certainty only what we ourselves construct" sounds like Vico. While Vico (*De Nostri Temporis Studiorum Ratione*, 1709) is famous for the phrase *verum ipsum factum* ("the true is the made"), this epistemological stance is foundational to Hobbes (writing 1640s–1650s).

  *   **Hobbes's Version:** In *De Corpore* (1655) and *Six Lessons to the Professors of Mathematics* (1656), Hobbes argues that demonstration is possible only where we know the **cause** of the thing.
      *   In Natural Philosophy, we see effects but do not know the ultimate causes (God created them). Thus, physics is conjectural.
      *   In Geometry and Civil Philosophy, we know the cause because **we generated it**. The cause of a circle is the definition/construction we laid down. The cause of the Commonwealth is the Covenant we agreed to.
  *   **Relevance to Chapter 4:** When Hobbes says men begin by "settling the significations of their words," he is describing the act of generation. By defining a "right" or a "law," we are constructing the object of study. Because we constructed it, we can know its properties with certainty.

  ### 4. Is your framing a misreading?
  Your framing is not a misreading, but it risks understating Hobbes's ambition for Civil Philosophy.

  *   **Your Reading:** "Calling geometry God's gift amounts to saying that God gave us speech and the faculty of reckoning, the definitions themselves being ours."
      *   **Verdict:** Correct. This captures the nominalist basis.
  *   **Your Worry:** "...whether I am flattening a distinction Hobbes needs."
      *   **Verdict:** The distinction you need to sharpen is not between Geometry and Morals, but between **Common Moral Discourse** and **Civil Philosophy**.
      *   Hobbes agrees with you that common moral vocabulary is uncertain. But he insists that Civil Philosophy *can* be certain if it adopts the geometric method of definition. If you read Chapter 4 as saying "Morals can never be certain like geometry," you would contradict Chapter 9 and the entire aim of *Leviathan*.

  ### Summary of the Doctrine
  1.  **Nominalism:** Universals are names. Truth is a property of propositions (names), not things.
  2.  **Science as Reckoning:** Reasoning is the arithmetic of names. If the values (definitions) are unstable, the sum (conclusion) is wrong.
  3.  **Geometry as Model:** Geometry is certain because geometers agree on definitions *before* reasoning.
  4.  **Maker's Knowledge:** We know geometry and politics with certainty because we construct their objects (figures and states) via definition and covenant. We do not know nature with the same certainty because we did not create it.
  5.  **The Goal of *Leviathan*:** To rescue moral/political knowledge from the uncertainty of passion by applying the geometric method to the definitions of Justice, Law, and Sovereignty.

  So, when Hobbes calls geometry God's gift in Chapter 4, he is holding it up as a mirror to political philosophy. He is saying: "Look at how successful they are because they define their terms. We must do the same, or the Commonwealth will remain in the state of nature."
