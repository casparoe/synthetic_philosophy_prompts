          *   Why call it God's gift? Likely to elevate its status as the model of truth, contrasting with human error/pretense. It acknowledges that the *light of reason* is divine, even if the *definitions* are human stipulations.
          *   *Correction/Refinement:* Hobbes actually says it is the only science God hath *hitherto* bestowed. This implies others might come (Civil Philosophy). It highlights the rarity of true science.

      *   **Puzzle 2: Why Geometry vs. Moral Vocabulary?**
          *   Geometry: Definitions are arbitrary but *settled by consent* at the outset. No passion involved. "Triangle" means X, and we all agree.
          *   Morals: Definitions are *contested*. "Justice" means different things to different people based on interest. They are not settled at the beginning.
          *   *Key Distinction:* It's not that moral terms *can't* be defined (Hobbes will define them later), but that in common discourse they *aren't*. In Civil Philosophy, Hobbes *will* define them (e.g., Justice = keeping covenants) to make that science certain like geometry.
          *   *Crucial Point:* The user asks why definition secures certainty in geometry but not moral vocabulary *Hobbes requires for civil philosophy*. Actually, Hobbes argues civil philosophy *can* be certain *if* we do what geometers do: settle definitions first. The failure of past moral philosophy was failing to do this.

      *   **Puzzle 3: Maker's Knowledge (Vico vs. Hobbes).**
          *   It is *not* anachronistic to attribute this to Hobbes. It is central to his distinction between Civil Philosophy (certain) and Natural Philosophy (conjectural).
          *   We know geometry because we construct the figures (in our mind/definition).
