      *   **Point 2: Geometry vs. Moral Language.** The difference isn't the *potential* for certainty, but the *practice*. Geometry settles definitions first; moral discourse usually doesn't. Civil Philosophy *must* do what geometry does.
      *   **Point 3: Maker's Knowledge.** Confirm this is Hobbes, not just Vico. Explain the causal/constructive epistemology.
