answer: |-
  ## The Epistemic Triage Procedure

  You are running into a category error. Dev is treating a **knowledge aggregation problem** like a **negotiation**. Aumann's Agreement Theorem is a mathematical result about ideal Bayesian agents with *common priors* and *common knowledge of each other's posteriors*. It is not a management policy. In the real world, priors are rarely common (Dev trusts models, Priya trusts fundamentals), and information is rarely common knowledge (Dev has the cash-flow sheet, Priya doesn't).

  When Dev uses Aumann to say "one of us is irrational," he is ignoring the **Common Prior Assumption**. If you and I start with different beliefs about how the world works, we can look at the same data and rationally disagree. Furthermore, Aumann requires that we know *why* the other person believes what they believe (their likelihood function), not just the final number. If Dev hasn't explained his math to Priya, they haven't satisfied the conditions of the theorem.

  **Why Averaging is Epistemically Wrong:**
  Averaging (splitting the difference) assumes two things: (1) both analysts have equal access to the relevant truth, and (2) their errors are independent and symmetric. If Dev has private information (the cash-flow sheet), averaging dilutes that signal with Priya's noise. If they share data but use different models (the drug trial), averaging hides the model risk. Averaging is a social compromise to make people feel heard; it is not a Bayesian update.

  **The Procedure (10-Minute Pre-Meeting Triage)**
  Run this alone with their written notes/emails before you call them in.

  1.  **Information Audit:** Check who has seen what. If one has material private information the other lacks, the one without it *must* move toward the one with it. The one with it may need to temper confidence, but the direction of update is non-negotiable.
  2.  **Prior Check:** Ask yourself: Do they start from different baselines? (e.g., Dev is a structuralist, Priya is a behavioralist). If yes, Aumann does not apply. Legitimate prior differences allow for legitimate posterior disagreement.
  3.  **Reasoning Transparency:** Look at their derivations. Did they exchange *likelihoods* (why the data moves the needle) or just *posteriors* (the final number)? If they only swapped numbers, they haven't done the work Aumann requires.
  4.  **The Aumann Stop:** If Dev cites the theorem, check Step 1 and 2. If info is asymmetric or priors differ, the theorem is inert.
  5.  **Boss Decision:** If info is shared and priors are similar, but they still disagree, you have a model risk problem. Do not force a number. Report the spread or widen the confidence interval. If you must pick a number, pick the one with the more robust *process*, not the one with the louder voice.

  ***

  ## Decision Table

  | Step | Question to Ask | What Counts as a Sufficient Answer | If No/Unavailable Then | Fact Question or Judgement Call |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Info Asymmetry** | Does one analyst possess material data the other has not seen or processed? | Yes/No + specific document identified (e.g., "Dev has the Q3 cash flow"). | Assume symmetry. Proceed to Step 2. | **Fact** (Check email logs/data access). |
  | **2. Prior Alignment** | Do they share a common baseline assumption (prior) before seeing this specific data? | Yes (e.g., both use industry default rates) or No (e.g., one trusts management, one doesn't). | Assume priors differ. Aumann does not apply. Stop Dev's argument. | **Judgement** (Review their past reports/history). |
  | **3. Derivation Exchange** | Have they exchanged *reasons* (likelihoods) or just *numbers* (posteriors)? | Yes, they have documented the causal model/weights used. | No. The disagreement is procedural. Force a model exchange, not a number compromise. | **Fact** (Check meeting notes/Slack). |
  | **4. Aumann Validity** | Are Conditions 1 & 2 met (Common Info + Common Priors)? | Both must be Yes for Aumann to mandate agreement. | If either is No, Dev's invocation of the theorem is invalid. Dismiss it. | **Fact** (Logic check based on Steps 1 & 2). |
  | **5. Resolution** | Given the above, is the disagreement epistemic (truth-seeking) or structural (model risk)? | Epistemic = One is likely wrong. Structural = The world is ambiguous. | If Structural, do not force a single number. Send range to client. | **Judgement** (Boss's call on risk tolerance). |

  ***

  ## Worked Cases

  ### Case 1: Supplier Default (Priya 15% vs. Dev 40%)
  **Context:** Dev has seen the internal cash-flow sheet; Priya has not.
  **Procedure Run:**
  *   **Step 1 (Info):** **FAIL.** Dev has private material info.
  *   **Step 2 (Priors):** Irrelevant given Step 1.
  *   **Step 4 (Aumann):** Dev cannot claim Priya is irrational. She is rational *given her information set*. However, the *firm's* estimate must incorporate the cash-flow sheet.
  *   **Step 5 (Resolution):** Priya must update toward Dev. However, Dev's 40% might be overconfident on a single data point.
  *   **Outcome:** You move Priya's estimate up. You do not average. You likely land near 35-40%, but you flag that Priya needs to see the sheet.
  *   **Aumann Script for Dev:** "Dev, Aumann requires common knowledge of information. Priya doesn't have the cash-flow sheet. She isn't irrational; she's uninformed. Share the sheet, then argue."

  ### Case 2: Drug Phase 3 (Priya 15% vs. Dev 40%)
  **Context:** Identical trial data. Priya weights overall population; Dev weights a specific subgroup analysis.
  **Procedure Run:**
  *   **Step 1 (Info):** **PASS.** Information is symmetric.
  *   **Step 2 (Priors):** **FAIL.** Priya priors = Regulatory standard (overall population). Dev priors = Biological mechanism (subgroup efficacy). These are different models of reality.
  *   **Step 4 (Aumann):** **INVALID.** Different priors/models mean the theorem does not force agreement.
  *   **Step 5 (Resolution):** This is **Model Risk**. Averaging (27.5%) is epistemically dishonest because it implies a precision that doesn't exist.
  *   **Unwelcome Result:** The procedure tells you **not to send a single number**. You must send a range (15-40%) or a scenario analysis to the client. This hurts your "single number" product offering, but it is the honest forecast.
  *   **Outcome:** Disagreement survives. You report the spread.

  ### Case 3: Supplier Default (Both 20%)
  **Context:** Priya uses base rates. Dev uses CEO nervousness.
  **Procedure Run:**
  *   **Step 1 (Info):** **PASS.** (Assuming both heard the call and know the base rates).
  *   **Step 3 (Derivation):** **FAIL.** They arrived at the same number via orthogonal causal paths. This is "False Consensus."
  *   **Step 5 (Resolution):** This is high fragility. If the CEO wasn't nervous (Dev's premise fails), does the number stay at 20%? Priya says yes, Dev implies no.
  *   **Outcome:** The number 20% is unstable. You must widen the confidence interval or flag the dependency on the CEO's behavior. The procedure says the agreement is illusory.

