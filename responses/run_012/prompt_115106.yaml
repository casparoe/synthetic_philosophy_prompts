prompt: |-
  3rd year phil PhD, 19th c European stuff, currently writing a chapter on Kierkegaard and the press. I keep flip-flopping on something and I'd like your actual credence plus the decomposition, since my supervisor and I are definately talking past each other.

  The claim I want a number on: when Kierkegaard goes after the press in the mid-1840s, the public he's talking about isn't a flowery way of saying public opinion, or the crowd, or the masses. It names a genuinely new kind of entity that the medium brings into being -- an abstraction with no members and no location, such that nobody can be held to anything it says -- and the modern algorithmic feed is a further instance of that same entity rather than a different phenomenon. So: your credence in that continuity claim, taken in that strong sense?

  Break it into terms, rough number and one line of justification each, then how they combine:

  - that there's a determinate thing he's pointing at, rather than the nobody-can-be-held-to-it feature being an artifact of how he writes
  - that the feature is caused by the structure of the medium rather than by scale / literacy / urban anonymity / the usual suspects
  - that feeds preserve it rather than dissolve it -- I can see the argument that algorithmic curation re-individualizes everyone into micro-publics and so kills the phantom instead of extending it, and I honestly don't know how to weigh that
  - that the everyone-is-a-spectator-nobody-acts half survives contact with feeds, which are full of people doing things at each other all day
  - if you think leveling needs its own term here, add it, plus anything else you think belongs

  Then: which term is the final number most sensitive to, and what would actually move it -- an argument, a case, a bit of history? I care less about the number than about locating where my supervisor and I disagree; her line is that the whole thing is Romantic-era hand-wringing about newspapers and that any media person would tell you the medium doesn't create the audience, it just serves one that was already sitting there.
