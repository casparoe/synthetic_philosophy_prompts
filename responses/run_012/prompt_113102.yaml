answer: |-
  Your tentative principle is strong, but it fractures on two points: the **Anatomist** (where dissent existed but your gut says *not guilty*) and **Bohm** (where no dissent existed but your gut says *guilty*). This confirms your suspicion: you are running two different rules. One is **Epistemic** (what could they know?), and the other is **Structural** (what era of harm is this?). The Anatomist is saved by the Epistemic rule (the dissent was on the wrong moral grounds); Bohm is condemned by the Structural rule (slavery post-1700 is inexcusable regardless of knowledge). You cannot keep both without contradiction. To make your principle coherent, you must drop one verdict. You should drop **Bohm**. The Abbess is safely excused by the Epistemic rule (no moral language existed), but Bohm represents a later era where the structural sin outweighs individual ignorance.

  Here are three candidate principles precise enough to split on new cases:

  1.  **The Principle of Accessible Grounds:** An agent is culpable only if a moral argument against their conduct, based on the *same ethical framework* we use today (e.g., consent vs. ritual), was socially available to them.
  2.  **The Principle of Historical Threshold:** An agent is culpable for structural harms (slavery, genocide) if they act after a fixed civilizational date (e.g., 1700), regardless of individual knowledge or dissent grounds.
  3.  **The Principle of Active Aggravation:** An agent is culpable only if they actively defended, lobbied for, or intensified the harm; passive benefit or participation is excused.

  **The Splitting Case:**
  A **1740s Lobbyist** in London who actively argues against early restrictions on the slave trade, before the Somerset case (1772) and before widespread abolitionist pamphlets. He never owns slaves, just protects the trade.
  *   **Accessible Grounds:** *Not Guilty.* The moral language of universal rights was not yet socially "available" enough to constitute knowledge.
  *   **Historical Threshold:** *Guilty.* He is post-1700; the structural sin is active.
  *   **Active Aggravation:** *Guilty.* He lobbied to worsen/protect the harm.

  **Pure Profit-Taking (The Passive Investor):**
  *   **Accessible Grounds:** *Not Guilty,* unless the specific moral critique reached their social circle.
  *   **Historical Threshold:** *Guilty,* because they benefit from a post-threshold structural sin.
  *   **Active Aggravation:** *Not Guilty,* because they did not lift a finger to defend the system.

  I defend **The Principle of Accessible Grounds**. It is the only one that respects the nuance of your Anatomist verdict (dissent on wrong grounds ≠ guilt) while maintaining fairness to the agent's moral horizon. It demands you accept that Bohm is not personally guilty, though his system was.

  \answer{The Principle of Accessible Grounds; the verdict on Nils Bohm}
