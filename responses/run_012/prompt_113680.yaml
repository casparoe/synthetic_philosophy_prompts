      *(Self-Correction on the "Single Requirement"):* The prompt asks "which single requirement does the most to rule candidates out." I should choose the one that creates the hardest filter. Likely the **Non-Formalizability of the Origin** vs **Rigorous Validity** tension. I will frame this as the "Formalization Paradox" requirement.

      *(Wait, one more check)*: The prompt asks for "results it has to be consistent with." I need to make sure the constraints (Gödel, Löb, Halting) are listed as consistency results the theory must respect.

