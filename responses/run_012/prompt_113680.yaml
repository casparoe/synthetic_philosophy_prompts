      *   *Correction on Constraints:* Ensure Löb's theorem is mentioned regarding "trust axioms."
      *   *Tone:* Academic, precise, slightly philosophical but grounded in logic.

  11. **Final Polish:** Check against all constraints in the prompt.
      *   Desiderata list? Yes.
