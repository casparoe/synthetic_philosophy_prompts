answer: |-
  ### Scratch: Exegetical Problem Solving

  The core tension lies in the causal direction of moral influence. Thesis (i) suggests morals cause theatre (sociological determinism); Thesis (ii) suggests theatre causes morals (moral causation). If Rousseau holds both, he risks contradiction unless the mechanism differs.

  *Reconciliation:* Rousseau distinguishes between the *content* of plays and the *institution* of spectacle.
  1.  **Content (Mirror):** Plays must appeal to existing prejudices to succeed. Therefore, theatre rarely improves morals directly through didacticism because it must flatter the audience to survive.
  2.  **Institution (Corruptor):** The *practice* of attending theatre changes social habits. It isolates citizens in the dark (passivity), substitutes sentimental pity for active virtue, and introduces economic inequality (paying for seats, supporting idle actors).
  3.  **Geneva Context:** In a large monarchy (Paris), morals are already corrupt; theatre merely amuses and softens cruelty slightly. In a small republic (Geneva), virtue requires active participation and transparency. Introducing the *institution* of theatre changes the social ecology (size, leisure, inequality), which shifts the morals from civic virtue to private amusement.
  4.  **Actor Thesis (iii):** This supports the corruption argument by highlighting the normalization of inauthenticity, but it is secondary to the institutional argument regarding the audience/citizens.

  *Strongest Reading:* Rousseau is committed to (i) regarding *artistic content*, but (ii) regarding *social institutions*. The Geneva argument relies on (ii): introducing the theatre changes the conditions of the state, which then changes the morals. The "mirror" claim explains why theatre won't *fix* morals; the "corruption" claim explains why it will *ruin* them. The rhetorical exhortation makes sense because introducing the institution alters the social structure that the "mirror" reflects.

  ***

  ### Midterm Essay Question

  **Question:**
  In the *Letter to d'Alembert*, Rousseau argues that theatre generally reflects the existing morals of a society, yet he also insists that introducing theatre to Geneva would actively corrupt its citizens. Reconcile these two positions. How does Rousseau's distinction between large monarchies and small republics allow him to claim both that theatre is a mirror of morals and that it is an agent of moral change? In your answer, address whether the corruption stems primarily from the plays' content, the actor's profession, or the social institution of spectacle itself.

  ***

  ### Model Answer

  Rousseau's *Letter to d'Alembert* presents an apparent contradiction: he claims theatre is powerless to improve morals because it merely mirrors existing societal tastes, yet he simultaneously argues that introducing theatre to Geneva would actively corrupt the citizenry. If theatre only reflects what is already there, it should be morally neutral. To resolve this, one must distinguish between the content of specific plays and the institutional structure of spectacle itself. Rousseau's argument relies on the thesis that while theatrical *content* follows morals, the theatrical *institution* alters the social conditions that sustain those morals.

  Regarding the "mirror" thesis, Rousseau argues that authors must please the audience to succeed. Therefore, plays reinforce existing prejudices rather than challenging them. In a corrupt society like Paris, theatre depicts vice as charming because the audience prefers it. In this sense, theatre is powerless to reform a nation; it cannot rise above the moral level of its spectators. This addresses the limitation of art: it is a effect, not a cause, of public opinion. However, this does not mean theatre is harmless. Even if it mirrors existing passions, the act of indulging those passions without exercising virtue weakens moral resolve. When audiences weep for fictional heroes, they feel a sentimental pity that substitutes for actual beneficence. They believe they are virtuous because they feel emotion, yet they remain passive.

  This passivity is where the "corruption" thesis emerges. The corruption does not stem primarily from the actor's profession, though Rousseau certainly condemns the actor's life as one of inauthenticity and dependence. Rather, the corruption stems from the social institution of spectacle. Theatre removes citizens from the public square and isolates them in a dark room. It transforms active participants in the general will into passive consumers of entertainment. This shift is negligible in a large monarchy, where citizens are already subjects rather than participants. In Paris, theatre might even soften harsh manners slightly without threatening the state's stability.

  However, for Geneva, the stakes are existential. Rousseau's contextualist thesis holds that the effect of spectacle depends on the size and character of the state. A small republic relies on transparency, equality, and active civic engagement. Introducing the theatre introduces luxury, inequality (through priced seating), and a division between idle performers and working citizens. By changing how Genevans spend their leisure time, the institution changes the social ecology. It encourages private amusement over public festivals. Consequently, the morals change not because the plays teach vice, but because the institution erodes the civic habits required for virtue.

  Therefore, Rousseau can consistently hold both that theatre mirrors morals and that it corrupts them. It mirrors the *content* of current morals, ensuring it never improves them. But it corrupts the *structure* of social relations, ensuring that virtuous morals decay into private sentimentality. The exhortation to Geneva makes sense because Rousseau is not warning against a specific play, but against the introduction of an institution that alters the civic bond. The mirror reflects the decline, but the institution causes it.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Identification of the Tension (4 marks)**
  *   **4:** Clearly articulates the contradiction between the "mirror" thesis (theatre follows morals) and the "corruption" thesis (theatre changes morals).
  *   **2-3:** Identifies the two claims but fails to frame them as a logical problem needing resolution.
  *   **0-1:** Treats the claims as separate bullet points without noting the tension.

  **2. Explanation of the "Mirror" Mechanism (4 marks)**
  *   **4:** Explains *why* theatre mirrors (authors must please audience/reinforce prejudices) and limits this to *content*.
  *   **2-3:** States theatre reflects morals but lacks the mechanism (audience taste/success).
  *   **0-1:** Vague reference to "reflection" without explanation.

  **3. Explanation of the "Corruption" Mechanism (4 marks)**
  *   **4:** Identifies the source of corruption as institutional (passivity, isolation, substitution of sentiment for action) rather than just "bad plays."
  *   **2-3:** Focuses only on bad content or the actor's profession (thesis iii) without addressing the audience's civic habit.
  *   **0-1:** Lists objections (actors are phonies) without linking to moral corruption.

  **4. Integration of Geneva Context (4 marks)**
  *   **4:** Uses the Monarchy vs. Republic distinction to explain why the impact differs by state size (active citizenship vs. passive subjecthood).
  *   **2-3:** Mentions Geneva but treats it as a generic example rather than a structural variable.
  *   **0-1:** Ignores the contextualist thesis entirely.

  **5. Synthesis/Resolution (4 marks)**
  *   **4:** Successfully reconciles (i) and (ii) by distinguishing content (mirror) from institution (corruptor), justifying the exhortatory rhetoric.
  *   **2-3:** Attempts reconciliation but leaves a logical gap (e.g., admits contradiction).
  *   **0-1:** No attempt to reconcile; treats arguments as unrelated.

  **A vs. B Distinction:**
  *   **A Answer:** Distinguishes between *content* and *institution*. Recognizes that the "mirror" claim applies to artistic success, while the "corruption" claim applies to civic ecology. Uses the Geneva context as the key to unlocking the contradiction.
  *   **B Answer:** Lists Rousseau's objections clearly (actors, pity, Geneva size) but treats the "mirror" and "corruptor" claims as separate points rather than a tension needing resolution. May rely heavily on the actor thesis (iii) to explain corruption.

  ***

  ### Common Failures Note

  1.  **The "List" Failure (Deduction: 4-6 marks):** Students simply list Rousseau's objections (actors are liars, Molière is bad, Geneva is small) without constructing an argument about how the claims relate. This indicates lecture reliance over reading.
  2.  **The "Contradiction" Failure (Deduction: 4 marks):** Students assert that Rousseau is contradicting himself without attempting to find the textual resolution (institution vs. content). They stop at identifying the problem.
  3.  **The "Actor" Overemphasis (Deduction: 2-3 marks):** Students focus almost exclusively on thesis (iii) (the actor's degradation) to explain the corruption of the *audience*. While relevant, this misses the structural argument about civic passivity.
  4.  **The "Universal Ban" Failure (Deduction: 4 marks):** Students argue Rousseau thinks theatre is evil everywhere. They miss the contextualist nuance that theatre is less harmful (or differently harmful) in large monarchies compared to small republics.

  Crux: Theatre mirrors existing morals but corrupts by altering the civic structure sustaining them.
