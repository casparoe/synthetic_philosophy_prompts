prompt: |-
  ok so I'm in this reading group on collective intentionality and joint action and I have to bring a draft next week, and I'm not sure the central move in it survives contact with anyone who's thought about this harder than me. we've done the usual suspects -- Bratman on shared intention, Gilbert on plural subjects, Searle's we-intentions, Tuomela on the we-mode -- and I'm trying to say something a bit to the side of all of them. draft pasted below, it's short. I'd really like your comments, especially on whether the main move works or whether I've just renamed something.

  **Doing things together without meaning to**

  1. Two flavors. Accounts of joint action tend to come in two flavors. On the *aggregative* view (Bratman is the cleanest version), a joint action is a structure of individual intentions: I intend to do my part, I intend that we do it by way of our doing our parts, I have a matching intention about you, you about me, the whole thing is common knowledge, and the intentions are mutually responsive. On the *unitary* view (Gilbert, and Searle in a different way), the group is a genuine subject: the intention is literally ours, not a bundle of mine and yours, and it doesn't decompose into individual attitudes without loss.

  2. What's wrong with both. Aggregative views struggle with cases where the participants never represent the whole. A rower in an eight doesn't need a representation of the boat's trajectory, and if you insist she does, you've made the account intellectualist in a way that excludes young children, animals, and frankly most of adult life. Unitary views struggle with the fact that the group subject seems *made of* the participants in a way ordinary subjects aren't, and nobody has a good story about how the "we" gets anchored without smuggling the individuals back in.

  3. A third option: role-dependence. Here's the idea. In a lot of joint action, what each participant intends is fixed not by a shared representation but by the *role* she occupies. The rower's intention is something like keep the rate and pull through the finish -- its content is given by her seat, her rigger, the cox's call. The roles, in turn, are constituted by the expectations the others have of whoever fills them. So the content of my intention is fixed by your expectations and yours by mine, but neither of us has to represent the whole. Call this role-dependence. It's a real pattern: crews, surgical teams, jazz rhythm sections, a lot of skilled manual labour.

  4. Why that isn't just aggregation. Aggregation says the group's action is the sum of individual actions plus mutual responsiveness. Role-dependence says something stronger: the individual actions aren't fully specified until you know the role, and the role isn't specified until you know the others' expectations. So there's a constitutive circularity between my action and yours that a sum can't capture. This is supposed to be why a rower's pull is *the boat's* pull in a way that two strangers both yanking on the same rope isn't.

  5. Why that isn't a plural subject. But it also isn't a group mind. Nothing here needs an intention that isn't anyone's. All the intentions are mine and yours; they're just role-indexed. So role-dependence promises a middle path -- genuine togetherness without a super-subject.

  6. The overgeneration problem. Here's where I get worried. If all it takes is that individual intentions are fixed by roles constituted by mutual expectations, then *any* stable equilibrium counts. A traffic jam is role-dependent: I keep my distance because I expect you to keep yours. Everyone pouring out of a burning theatre is role-dependent. A market is role-dependent. And I don't want to say a traffic jam is a joint action. So role-dependence looks necessary but not sufficient.

  7. The fix: accountability. What the traffic jam lacks is accountability. In a genuine joint action each participant is entitled to demand that the others play their roles, and is answerable to them for playing hers. The rower who stops pulling doesn't merely fail to contribute -- she gets called out, and she owes an answer. The driver who tailgates owes nobody an answer; no one is entitled to demand otherwise of him. So the mark of joint action is a mutual structure of entitlement-to-demand and answerability, not a shared mental state.

  8. The worry. Accountability looks like it presupposes exactly what it's meant to explain. To be entitled to demand that you play your role, there has to already be some understanding between us -- which is the joint commitment I was trying to derive. So either accountability is primitive (and I've just renamed Gilbert's joint commitment and lost the middle path), or it's grounded in something else (and I need to know what). I suspect the way out is that entitlement-to-demand is grounded in *reliance* rather than agreement: you've arranged your conduct around my role, so I owe you something. But I can't tell whether that gets me out or just moves the circle.

  ---

  What I want from you: (a) does the accountability condition in §7 actually pick out joint action, or does it over- or under-generate too -- give me a case that breaks it in one direction or the other; (b) is the circularity in §8 fatal, or is there a non-circular grounding for entitlement-to-demand, and if the reliance move works say why, if it doesn't say what it costs; (c) is role-dependence in §3-4 really distinct from the aggregative view, or have I just redescribed mutual responsiveness in fancier clothes. If I have to give something up I'd rather keep role-dependence and drop accountability than the reverse, but tell me what that costs me. Also just tell me if any of it is obviously confused.

  Format: start with your overall verdict in one sentence, then the reasoning, no preamble and don't restate the question.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Critique a short draft paper on collective intentionality/joint action.
      *   **Topic:** A proposed "third option" between aggregative (Bratman) and unitary (Gilbert/Searle) views, based on "role-dependence" and "accountability."
      *   **Specific Questions:**
          *   (a) Does the accountability condition (§7) work, or does it over/under-generate? (Need counterexamples).
          *   (b) Is the circularity in §8 fatal? Can reliance ground entitlement-to-demand non-circularly? What are the costs?
          *   (c) Is role-dependence (§3-4) distinct from aggregation (Bratman), or just redescribed mutual responsiveness?
          *   (d) General confusion check.
          *   (e) Trade-off: If forced to choose, keep role-dependence, drop accountability? What does that cost?
      *   **Format Constraints:** Start with a one-sentence overall verdict. Then reasoning. No preamble. Don't restate the question.

  2.  **Analyze the Draft:**
      *   **Core Idea:** Joint action is defined by role-dependent intentions (content fixed by role/expectations) + mutual accountability (entitlement to demand/answerability).
      *   **Motivation:** Avoid intellectualism of Bratman (no need to represent the whole) and metaphysical weirdness of Gilbert (no plural subject).
      *   **Problem Identified by Author:** Overgeneration (traffic jams look role-dependent) -> Solution: Accountability.
      *   **Problem Identified by Author (Meta):** Circularity (Accountability seems to presuppose joint commitment).

  3.  **Evaluate Question (a): Accountability Condition:**
      *   *Does it pick out joint action?*
      *   *Overgeneration:* Are there cases of accountability without joint action?
          *   Example: A queue. I expect you to wait your turn. If you cut, I might demand you stop. Is a queue joint action? Usually considered coordinated action, but maybe not full-blown joint action in the sense of a shared goal. But Gilbert might say it is a plural subject.
          *   Example: Competitive games. Chess players. I expect you to move according to rules. I can demand you don't cheat. But is playing chess *against* someone joint action? Yes, usually.
          *   Example: Coercion. A hostage situation. The captor demands things, the hostage complies. There is accountability (in a twisted sense), but is it joint action? Usually joint action requires some voluntariness.
      *   *Undergeneration:* Are there cases of joint action without explicit accountability?
          *   Example: Implicit coordination. Two strangers lifting a heavy log found on the path. They lift it together. If one drops it, the other might be annoyed, but is there a *normative entitlement* to demand? Maybe just disappointment.
          *   Example: Young children/Animals. The draft claims to avoid intellectualism. Do dogs playing feel *accountable*? Do toddlers building a block tower together understand "entitlement to demand"? If accountability is normative (owed answers), it might reintroduce the intellectualism the author wants to avoid.
      *   *Verdict:* It risks undergenerating for minimal cases (children/animals) and overgenerating for normative structures that aren't cooperative (queues, competitive games, coercive interactions).

  4.  **Evaluate Question (b): Circularity & Reliance:**
      *   *The Worry:* Accountability presupposes a norm. Where does the norm come from? Gilbert says Joint Commitment. Author wants to avoid that.
      *   *Reliance Move:* "You've arranged your conduct around my role, so I owe you something."
      *   *Critique:* This sounds like Scanlon's Principle of Fidelity or simple reliance-based obligations. But mere reliance doesn't create *joint* action. If I rely on you to catch the bus (because you always do), and you don't show, I'm annoyed, but we didn't act jointly.
      *   *Circularity:* To have a *role* implies a normative structure. A "role" isn't just a functional slot; it's a normative position. If you define the role by expectations, are those expectations predictive or normative? If predictive, no accountability. If normative, you've smuggled in the normativity (Gilbert's commitment).
      *   *Cost:* If you ground it in reliance, you lose the distinctiveness of *joint* action vs. *parallel* action with reliance. You need a threshold of mutual recognition of the reliance as binding. That looks like commitment.

  5.  **Evaluate Question (c): Role-Dependence vs. Aggregation:**
      *   *Bratman's View:* I intend that we J, I intend to do my part, etc. Mutual responsiveness.
      *   *Author's View:* Intention content fixed by role/expectations.
      *   *Distinction:* Bratman requires the *intentions* to mesh. The author says the *content* is externally fixed by the role.
      *   *Critique:* Bratman already allows that the content of "my part" is determined by the context of "our action." If I intend to paint the house *with you*, what I intend (paint the north side) is fixed by our plan. Is "role" just "part in the plan"?
      *   *Verdict:* It feels like a sociological gloss on Bratman rather than a metaphysical alternative. Bratman's "mutual responsiveness" covers the adjustment to others. The author's "role-dependence" describes *how* the content is determined, but Bratman could accept that the content is determined by social norms/roles. The key difference is the *source* of the normativity. Bratman: individual intentions meshing. Author: Social roles constituting the intention.
      *   *Is it distinct?* Weakly. It shifts focus from mental states to social structure, but Bratman already requires common knowledge of the plan. The "constitutive circularity" claimed in §4 is arguably present in Bratman's interlocking intentions.

  6.  **Evaluate Trade-off (Keep Role, Drop Accountability):**
      *   If you drop accountability, you lose the normative glue that distinguishes joint action from coincidental coordination (the traffic jam problem).
      *   Cost: You fall back into the overgeneration problem. Traffic jams become joint actions.
      *   Benefit: You avoid the circularity/commitment worry.
      *   *Alternative:* Keep accountability but weaken it to "reactive attitudes" (Strawson) rather than "entitlements."

  7.  **Drafting the Response:**
      *   *Verdict:* The draft identifies a genuine tension in the literature but ultimately collapses into a normative variant of Bratman unless the "role" concept is rigorously distinguished from "plan part," and the accountability condition risks excluding the very non-intellectualized cases you aim to capture.
      *   *Section (a) Accountability:* Focus on the children/animals case (undergeneration) and the queue/competition case (overgeneration).
      *   *Section (b) Circularity:* Explain why reliance isn't enough (bus example). The normativity of "role" is the sticking point.
      *   *Section (c) Aggregation:* Compare "role" to Bratman's "part." Argue that Bratman can accommodate role-content, so the distinctiveness lies in the normativity, not the intention structure.
      *   *Trade-off:* Dropping accountability kills the project (traffic jams). Keeping it requires biting the bullet on normativity (maybe that's okay?).

  8.  **Refining the Verdict:**
      *   Needs to be one sentence.
      *   "Your role-dependence move is a valuable sociological correction to Bratman, but without a robust account of how normative roles emerge without prior commitment, the accountability condition either reintroduces Gilbert's plural subject or excludes non-normative coordination like children playing."

  9.  **Refining the Reasoning:**
      *   *Accountability:* Use the "children/animals" objection for undergeneration. They coordinate without full normative accountability. Use "queue" or "market" for overgeneration (there are norms there).
      *   *Circularity:* The "reliance" move fails because reliance exists in non-joint cases (I rely on the sun to rise). The specific *normative* reliance is what matters, which implies the commitment you're trying to avoid.
      *   *Aggregation:* Bratman's "meshing subplans" does the same work as "roles." The difference is emphasis, not ontology.
      *   *Trade-off:* If you drop accountability, you have a descriptive sociology of coordination, not a philosophy of joint *action* (which implies agency/normativity).

  10. **Final Polish:** Check constraints. No preamble. One sentence verdict first. Address (a), (b), (c) and the trade-off.

      *Self-Correction on Verdict:* Make sure it answers the "does the move work" aspect.
