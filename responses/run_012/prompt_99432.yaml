answer: |-
  The role-dependence insight successfully highlights the social scaffolding of intention, but the accountability condition either reintroduces the normative commitment you aim to avoid or excludes the minimal cases of joint action you want to capture.

  Regarding (a), the accountability condition undergenerates for the very cases you want to save from intellectualism. If joint action includes toddlers building a block tower or wolves hunting, it is unclear they grasp "entitlements to demand" or owe "answers" in the normative sense required; they feel frustration, but not necessarily normative resentment. Conversely, it overgenerates for competitive or purely normative structures: players in a chess match are accountable to rules and each other for moves, and people in a queue are accountable for turn-taking, yet neither is typically classified as cooperative joint action in the sense you mean. You need to restrict accountability to *cooperative* entitlements, but that restriction smuggles in the shared goal you tried to bypass.

  Regarding (b), the circularity is fatal unless you accept a primitive normativity of reliance. Mere reliance cannot ground entitlement because I rely on the sun to rise or the grocer to open, yet neither owes me an answer if they fail. To move from "I relied on you" to "You owed me," you need a principle that distinguishes binding reliance from mere prediction. That principle is functionally equivalent to Gilbert's joint commitment or a promise-like norm. If you ground it in reliance alone, you lose the normative force required to distinguish joint action from parallel action; if you ground it in a norm, you haven't escaped the circularity of presupposing a normative bond.

  Regarding (c), role-dependence is currently too close to Bratman's "meshing subplans" to count as a distinct metaphysical category. Bratman can accommodate your rower by saying she intends to "pull seat 3 as part of our rowing," where the content of "seat 3" is fixed by external facts. Your claim is that the role constitutes the intention rather than the intention selecting the role, but Bratman can argue the intention is always indexical to the context. To distinguish yourself, you must argue that the role exists *prior* to and *independently* of the specific joint intention (e.g., the seat exists before the crew forms), whereas Bratman sees the parts as created by the shared plan. If you cannot sustain that independence, you have just described the sociological mechanism of Bratman's psychological structure.

  If you drop accountability to save role-dependence, you lose the ability to distinguish joint action from mere coordinated behavior (the traffic jam problem), reducing your account to descriptive sociology rather than philosophy of action. If you keep accountability, you must concede that some normative glue (commitment, promise, or primitive obligation) is necessary, which means you haven't found a middle path between Bratman and Gilbert but rather a hybrid: Bratman's structure with Gilbert's normativity. The most viable revision is to weaken accountability to "reactive attitudes" (Strawson) rather than "entitlements," allowing for non-normative frustration in children/animals while preserving the interpersonal stance, though this risks blurring the line between joint action and mere interaction.
