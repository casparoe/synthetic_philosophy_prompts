prompt: |-
  I got into it with my roommate last night about Boltzmann brains — I was saying that if the universe lasts long enough, some random fluctuation should eventually cough up a brain having an experience just like mine, so maybe I'm one, and it's genuinely unsettling. He killed the whole conversation with "dude, in an infinite universe anything that can happen will happen, thats the entire point, so obviously it happens, so who cares." I'm pretty sure he's mashing together three or four different claims in that one sentence and I can't tell which one is actually doing the work, or whether any of them survive. Can you lay out the distinct precise things "anything that can happen will happen" could be asserting here — what "can happen" is supposed to mean, what work "infinite" is doing (infinite time? infinite space? infinitely many trials? a measure?), what "will happen" is even a claim about when the relevant set of cases might be infinite but the thing you care about has probability zero, and how you'd even count or pick out the class of events you're counting over — and for each reading say whether its trivial, actually substantive, or flat-out false, and which one he needs for the "so who cares" punchline versus which one the Boltzmann brain worry itself would need for "so I'm probably one." Give it to me as a menu of readings with verdicts, not one big answer, so I can go back and figure out where exactly we talked past each other.
