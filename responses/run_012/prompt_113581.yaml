answer: |-
  This is a classic case of "street theory"—a simplified, fossilized version of a debate that has moved on significantly in the last 40 years. Your intuition is correct: the cheat sheet conflates ontological claims with methodological ones, straw-mans holism, and confuses explanatory strategies with political ideologies.

  Here is a claim-by-claim breakdown, categorized as requested, followed by the specific "nail down" issues you raised.

  ### Part 1: Claim-by-Claim Breakdown

  **Claim 1:** *"Methodological individualism is the view that only individuals are real; talk of states, markets, classes, and norms is just shorthand for facts about individuals."*
  *   **Category:** **(c) Wrong / Conflated.**
  *   **The Error:** This conflates **Ontological Individualism** (only individuals exist) with **Methodological Individualism** (explanations should bottom out in individuals).
  *   **What a Defender Would Object To:** A sophisticated proponent of MI (e.g., Karl Popper or Jon Elster) would reject this. Popper explicitly argued that MI is *not* an ontological claim. Institutions (states, markets) are real in the sense that they have real effects, but they are *ontologically subjective* (dependent on human attitudes) yet *functionally objective*. A defender would say: "Institutions are real, but they are not *sui generis* substances; they are constituted by individual actions and expectations."
  *   **What a Holist Would Object To:** They would argue that social structures have emergent properties that cannot be captured even by a complete list of individual facts (supervenience failure).

  **Claim 2:** *"A proper social explanation therefore has to derive every social outcome from the beliefs and desires of the individuals involved, with nothing left over."*
  *   **Category:** **(b) Defensible-but-Crude.**
  *   **The Nuance:** This captures the *ambition* of strict Rational Choice Theory (RCT), but it misses the broader MI tradition (e.g., Weber).
  *   **What a Defender Would Object To:** Many MI proponents accept "unintended consequences." If I explain a market crash, I don't need to show every trader *desired* the crash. I need to show how their individual actions (driven by local beliefs) aggregated to the crash. The phrase "nothing left over" implies a reductionism that many MI advocates (who accept supervenience) find unnecessary. They want a *mechanism*, not necessarily a deductive derivation from atomic desires.
  *   **What a Holist Would Object To:** This ignores structural constraints. An individual's "beliefs and desires" are themselves shaped by social facts (socialization, ideology). If you can't explain the beliefs without referencing the social structure, the explanation isn't complete at the individual level.

  **Claim 3:** *"Holism is the opposite position: society is a thing over and above its members, with its own consciousness and causal powers..."*
  *   **Category:** **(c) Wrong (Straw Man).**
  *   **The Error:** This attributes mystical realism to holism. Very few serious holists argue society has a "consciousness" in a literal, psychological sense.
  *   **What a Defender of Holism Would Object To:** A critical realist (e.g., Margaret Archer) or a structuralist would say: "We do not claim society is a super-organism with a mind. We claim that social relations pre-exist the individual and constrain/enable action in ways that are not reducible to psychology." The "consciousness" bit is a caricature of Durkheim's *conscience collective* (which meant shared norms, not a group brain).

  **Claim 4:** *"...which is why Durkheim insisted that social facts be explained by other social facts."*
  *   **Category:** **(a) Acceptable.**
  *   **The Nuance:** This is an accurate paraphrase of *The Rules of Sociological Method*.
  *   **Caveat:** It is often quoted without Durkheim's caveat that social facts are ultimately realized in individuals, even if not *explained* by individual psychology.

  **Claim 5:** *"The debate was basically settled by the fact that only individuals act — collectives can't have intentions..."*
  *   **Category:** **(c) Wrong / Begs the Question.**
  *   **The Error:** This treats a premise of MI as a proven conclusion that refutes holism.
  *   **What a Holist Would Object To:** This is the core philosophical dispute. Philosophers of collective intentionality (e.g., John Searle, Raimo Tuomela, Margaret Gilbert) argue that "we-intentions" are irreducible to "I-intentions." Furthermore, even if only individuals *act*, structures can *cause*. (Example: A recession causes unemployment. The recession isn't an agent, but it has causal power).
  *   **What a Careful MI Proponent Would Object To:** They wouldn't say the debate is "settled." They would say this is the *starting axiom* of their research program, not a metaphysical proof that ends the conversation.

  **Claim 6:** *"...so holism is refuted, and MI is now the default in economics..."*
  *   **Category:** **(c) Wrong.**
  *   **The Error:** "Refuted" is too strong; "default in economics" is historically contingent.
  *   **Reality Check:** Institutional economics, behavioral economics, and complexity economics all challenge strict MI. In sociology, the debate is very much alive (e.g., Analytical Sociology vs. Critical Realism).

  **Claim 7:** *"...the main holdouts are sociologists who need society to be real in order to justify their politics."*
  *   **Category:** **(c) Wrong (Ad Hominem).**
  *   **The Error:** Psychologizes the theoretical stance.
  *   **Reality Check:** There are plenty of conservative holists (e.g., traditionalists who value "Order" over individual liberty) and radical individualists (e.g., anarchists). Theoretical commitments do not map neatly onto political spectra.

  **Claim 8:** *"Finally, MI is itself a normative commitment: it says we should explain outcomes as products of individual choice, which is why it goes hand in hand with laissez-faire."*
  *   **Category:** **(c) Wrong.**
  *   **The Error:** Confuses an explanatory heuristic with a political norm.
  *   **What a Defender Would Object To:** Jon Elster (whom you mentioned) is the prime counter-example. He is a staunch methodological individualist and a Marxist. He uses MI to *critique* functionalism in Marxism. MI shows how individual rationality can lead to collective irrationality (Prisoner's Dilemmas), which often *justifies* state intervention, not laissez-faire.

  ---

  ### Part 2: Nailing Down the Two Big Questions

  #### 1. Does the "only individuals act" argument refute holism, or just relocate the dispute?

  It **relocates the dispute**. It does not refute holism.

  Here is why: The statement "only individuals act" is ambiguous between two claims:
  1.  **Physical Agency:** Only biological humans move muscles. (True, but trivial).
  2.  **Intentional Agency:** Only individuals can hold intentions. (Contested).

  If the cheat sheet means (1), holists agree. Margaret Archer's morphogenetic cycle starts with the fact that individuals act. But she argues that the *context* of that action (structural conditioning) has causal powers that are not reducible to the sum of previous individual actions.

  If the cheat sheet means (2), it is begging the question against theories of **Collective Intentionality**. If a choir sings a chord, no single individual sings the chord; the *group* sings the chord. If you say "but only individuals open their mouths," you are changing the definition of the action from "singing a chord" to "opening mouths."

  **The Verdict:** The argument relocates the dispute from "Do groups exist?" to "Can intentions be irreducibly collective?" and "Can structures have causal power without being agents?" Since holists have robust answers to these (e.g., downward causation, plural subjects), the "only individuals act" line is a conversation-stopper, not a refutation.

  #### 2. Does Methodological Individualism carry any normative/political commitment?

  **No.** The connection to laissez-faire is historical and accidental, not logical.

  *   **The Historical Accident:** In the mid-20th century, the strongest proponents of MI were often Austrian economists (Hayek, Mises) who were also classical liberals. They argued that because only individuals know their local preferences, central planning is impossible. This fused MI with anti-statism in the popular imagination.
  *   **The Logical Reality:** MI is a tool for tracing mechanisms.
      *   **Scenario A (Laissez-faire):** MI shows that price controls create shortages (individuals react to incentives).
      *   **Scenario B (Intervention):** MI shows that individual rationality leads to environmental collapse (Tragedy of the Commons). Therefore, we *need* collective regulation to solve the individual incentive problem.

  Jon Elster is your best evidence here. He uses MI to debunk "spurious functionalism" in Marxist theory (the idea that the State acts to benefit the Bourgeoisie). He argues: "Show me the mechanism! How do the individuals make this happen?" This is a demand for rigor, not a defense of capitalism. In fact, MI often undermines political rhetoric that relies on "Society wants..." or "The Working Class demands..." by revealing internal divisions and preference aggregation problems.

  ---

  ### Part 3: If You Fixed the Errors, Would Anything Survive?

  Your hunch is correct: **It lands half-right for entirely the wrong reasons.**

  If you rewrite the cheat sheet to be philosophically defensible, it loses its polemical punch but keeps its heuristic value. A corrected version would look like this:

  > "Methodological Individualism is a research strategy that suggests social phenomena should be explained by referencing the actions and interactions of individuals, rather than treating social aggregates as independent agents. While institutions are real, their effects are mediated through individual behavior. This does not deny that individuals are shaped by social structures, nor does it imply that collective intentions are impossible. It is not a political stance, but a demand for micro-foundations: if a theory claims 'The State did X,' it should be able to specify which individuals did what to make X happen. This helps avoid reification, but does not necessarily refute structural causation."

  **What survives?**
  1.  **The Warning Against Reification:** The sheet is right that talking about "The Market" or "The State" as if they are agents can be misleading. MI forces you to specify mechanisms.
  2.  **The Demand for Mechanisms:** The idea that we should look for the "micro-foundations" of macro-phenomena is a lasting contribution of the MI debate (central to Analytical Sociology today).

  **What dies?**
  1.  **Ontological Reductionism:** The idea that institutions aren't "real."
  2.  **The "Settled" Claim:** The debate is alive and well in philosophy of social science.
  3.  **The Political Link:** MI is compatible with almost any politics, provided that politics is willing to articulate its mechanisms.

  ### Advice for Your Arguments

  When you encounter first-years wielding this sheet, don't attack MI itself. Attack the **conflation**.

  1.  **Ask:** "Are you talking about *ontology* (what exists) or *methodology* (how we explain)? Popper says they're different."
  2.  **Ask:** "Does 'only individuals act' mean only individuals move muscles, or that groups can't have intentions? Because Searle and Gilbert have arguments about the latter."
  3.  **Ask:** "If MI is normative, how do you explain Jon Elster? He uses MI to analyze Marx."

  The cheat sheet is a relic of the 1950s/60s "Explanation and Understanding" debates (Popper vs. Adorno, etc.). It treats a methodological heuristic as a metaphysical victory. You are right to be frustrated; it stops students from engaging with the actual complexity of structure and agency.
