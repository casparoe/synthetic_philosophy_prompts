prompt: |-
  Ok so I'm a second-year PhD student (sociology, theory track), and I keep ending up in arguments about methodological individualism with people who got their picture of it from a one-page cheat sheet that circulates in my department — no author, no date, half the first-years study off it — and I'm fairly sure the sheet is doing damage. Here's the gist, close to how it reads:

  "Methodological individualism is the view that only individuals are real; talk of states, markets, classes, and norms is just shorthand for facts about individuals. A proper social explanation therefore has to derive every social outcome from the beliefs and desires of the individuals involved, with nothing left over. Holism is the opposite position: society is a thing over and above its members, with its own consciousness and causal powers, which is why Durkheim insisted that social facts be explained by other social facts. The debate was basically settled by the fact that only individuals act — collectives can't have intentions — so holism is refuted, and MI is now the default in economics; the main holdouts are sociologists who need society to be real in order to justify their politics. Finally, MI is itself a normative commitment: it says we should explain outcomes as products of individual choice, which is why it goes hand in hand with laissez-faire."

  I'm inclined to think the last bit is just guilt by association (wasn't Elster both an MI guy and a Marxist?), and I suspect the "only individuals act" line is doing something fishy, but I can't say where the rest goes wrong — and I don't want to just tell people the sheet is bad, I want to be able to point at which sentences are bad and why. So: go through it claim by claim and seperate them into (a) stuff a careful philosopher of social science would accept, (b) defensible-but-crude formulations a specialist would wince at but could live with, and (c) things that are just wrong or that quietly fuse two positions that the debate keeps apart. For each, tell me what a defender of the position being described would actually object to, not just what's true. Two things I definately want nailed down: does the "only individuals act" argument refute holism, or does it just relocate the dispute; and does methodological individualism carry any normative/political commitment, or is the laissez-faire connection an accident of who happened to be arguing for it. And if you fixed all the errors, would anything the sheet concludes survive? My hunch is that it lands half-right for entirely the wrong reasons, but tell me if that's wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Second-year PhD student in Sociology (Theory track). This means they have a solid grounding in classical theory (Durkheim, Weber, etc.) and are likely encountering analytical sociology, rational choice theory, or philosophy of social science debates. They are frustrated by a simplified, circulating "cheat sheet" that misrepresents Methodological Individualism (MI).
      *   **Task:** Critique the provided "cheat sheet" text claim-by-claim. Categorize claims into (a) acceptable, (b) defensible-but-crude, and (c) wrong/conflated.
      *   **Specific Requirements:**
          *   Explain *why* a defender of the position would object (internal critique), not just state external truths.
          *   Specifically address: Does "only individuals act" refute holism or relocate the dispute?
          *   Specifically address: Does MI carry normative/political commitments (laissez-faire connection)?
          *   Assess if any conclusions survive if errors are fixed.
      *   **Tone:** Academic, precise, nuanced, sympathetic to the complexity of the debate (avoiding the very simplifications the user hates).

  2.  **Deconstruct the "Cheat Sheet" Text:**
      I need to break the text down into distinct propositions to evaluate them.

      *   *Claim 1:* "Methodological individualism is the view that only individuals are real; talk of states, markets, classes, and norms is just shorthand for facts about individuals." (Ontological claim)
      *   *Claim 2:* "A proper social explanation therefore has to derive every social outcome from the beliefs and desires of the individuals involved, with nothing left over." (Explanatory claim)
      *   *Claim 3:* "Holism is the opposite position: society is a thing over and above its members, with its own consciousness and causal powers..." (Definition of Holism)
      *   *Claim 4:* "...which is why Durkheim insisted that social facts be explained by other social facts." (Historical attribution)
      *   *Claim 5:* "The debate was basically settled by the fact that only individuals act — collectives can't have intentions..." (The "Action" Argument)
      *   *Claim 6:* "...so holism is refuted, and MI is now the default in economics..." (Status of the debate)
      *   *Claim 7:* "...the main holdouts are sociologists who need society to be real in order to justify their politics." (Motivation attribution)
      *   *Claim 8:* "Finally, MI is itself a normative commitment: it says we should explain outcomes as products of individual choice, which is why it goes hand in hand with laissez-faire." (Normative/Political claim)

  3.  **Evaluate Each Claim (Drafting the Analysis):**

      *   *Claim 1 (Ontology):* "Only individuals are real."
          *   *Critique:* Most MI proponents (Popper, Watkins, Elster) insist MI is *methodological*, not *ontological*. They don't deny institutions exist; they deny they exist *independently* of individuals.
          *   *Category:* (c) Wrong/Conflated. Confuses Ontological Individualism with Methodological Individualism.
      *   *Claim 2 (Explanation):* "Derive every social outcome from beliefs and desires... nothing left over."
          *   *Critique:* This is the "strict" MI view (Rational Choice). But softer MI (Weberian) allows for unanticipated consequences and structural constraints as long as the *mechanism* runs through individuals. "Nothing left over" is too strong (supervenience vs. reduction).
          *   *Category:* (b) Defensible-but-crude. Captures the ambition but misses the nuance of supervenience or mechanism-based explanation.
      *   *Claim 3 (Holism):* "Society is a thing over and above... own consciousness."
          *   *Critique:* This is a straw man. Most holists (even Durkheim) don't claim a group *mind*. They claim emergent properties or causal powers of structures.
          *   *Category:* (c) Wrong. Straw man of holism.
      *   *Claim 4 (Durkheim):* "Social facts explained by other social facts."
          *   *Critique:* Accurate quote/paraphrase of *Rules of Sociological Method*.
          *   *Category:* (a) Acceptable.
      *   *Claim 5 (Action Argument):* "Only individuals act — collectives can't have intentions."
          *   *Critique:* This is the core philosophical pivot. It doesn't refute holism; it shifts the burden. Holists argue collective intentions *are* real (Searle, Gilbert) or that structural causation doesn't require intentionality.
          *   *Category:* (c) Wrong/Conflated. It assumes the conclusion.
      *   *Claim 6 (Settled/Economics):* "Debate settled... default in economics."
          *   *Critique:* Debate is definitely not settled in philosophy or sociology. Economics uses MI, but behavioral econ and institutional econ complicate it.
          *   *Category:* (c) Wrong.
      *   *Claim 7 (Sociologist Motivation):* "Need society to be real to justify politics."
          *   *Critique:* Ad hominem/psychologizing. Many holists are conservatives; many individualists are radicals.
          *   *Category:* (c) Wrong.
      *   *Claim 8 (Normative/Political):* "MI is normative... hand in hand with laissez-faire."
          *   *Critique:* MI is an explanatory strategy, not a political one. Elster (Marxist) vs. Nozick (Libertarian).
          *   *Category:* (c) Wrong.

  4.  **Address the Specific "Nail Down" Questions:**

      *   *Does "only individuals act" refute holism?*
          *   No. It defines the terms of the debate. Holists argue for "plural subjects" or "structural causation" that isn't reducible to individual *intentions* even if executed by individuals. It relocates the dispute to the nature of intentionality and emergence.
      *   *Does MI carry normative commitment?*
          *   No. It's about *how* to explain, not *what* to do. The laissez-faire link is historical (Austrian school), not logical.
      *   *Do any conclusions survive?*
          *   The idea that explanations should *account for* individual mechanisms is valuable. The idea that reification is a risk is valuable. But the strong reductionism and political conclusions do not survive.

  5.  **Drafting the Response (Iterative Refinement):**

      *   *Introduction:* Acknowledge the frustration. This is a classic "street theory" problem. Validate the user's suspicion.
      *   *Section 1: Claim-by-Claim Breakdown.* Use the (a), (b), (c) structure requested. Be precise with philosophical terminology (ontological vs. methodological, supervenience, emergence, reification).
      *   *Section 2: The "Only Individuals Act" Question.* Distinguish between *agency* and *causation*. Mention collective intentionality (Searle/Tuomela) and structural constraints (Archer).
      *   *Section 3: The Normative/Political Question.* Use the Elster example the user provided (strong evidence). Mention Hayek vs. Weber.
      *   *Section 4: What Survives?* The heuristic value of MI without the metaphysical baggage.
