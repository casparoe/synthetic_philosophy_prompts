answer: |-
  This is a properly sharp question. You've cut past the academic fretting about emeralds and landed on the place where induction actually costs money. Insurance is, in essence, the industrialisation of induction. If the underwriter cannot distinguish between a projectible predicate and a 'grue' artefact, the business model collapses.

  Here is how I see the underwriter's implicit philosophy, where it clashes with Goodman, and what happens if the riddle remains unsolved.

  ### The Underwriter's Implicit Ontology

  You ask what practice presupposes. The short answer is that the insurance market operates as a **causal realist**, whereas Goodman's puzzle assumes a **regularity theorist** starting point.

  A pure Humean view says we only see constant conjunctions: event A follows event B. Goodman shows that for any set of conjunctions, you can construct infinite contradictory predicates (green/grue) that fit the data. If the underwriter were a pure Humean, they would be paralysed. They would know that 'claim frequency for brick houses' fits the past data, but so does 'claim frequency for brick houses until Tuesday, then skyrocketing'.

  But underwriters do not behave as if all patterns are created equal. Their practice presupposes that the world is carved into **natural kinds**. They assume that 'mortality of 60-year-old males' is a projectible predicate because it tracks a biological reality, whereas 'mortality of people with phone numbers ending in 4' is not, even if the latter has shown a perfect correlation for ten years.

  So, which rival accounts does this licence?
  1.  **It rules out Pure Regularity Theory:** You cannot price risk based solely on past frequency without an account of *why* the frequency holds.
  2.  **It aligns with Inference to the Best Explanation (IBE):** Underwriters select the hypothesis that best explains the data *and* coheres with background knowledge. 'Green' is preferred over 'Grue' not just because of habit (Goodman's linguistic solution), but because 'Green' connects to the stable chemical properties of emeralds, whereas 'Grue' requires a mysterious, unexplained shift in physics at time *t*.
  3.  **It relies on Entrenchment (Goodman's own fix), but grounded in causality:** Goodman argued we project 'green' because it is linguistically entrenched. Insurers agree, but they add a layer: it is entrenched *because* it maps to a stable causal mechanism.

  The underwriter's implicit view is that projectibility is not a logical property of sentences, but an ontological property of the risk class. They are betting that the reference class is homogeneous and stable.

  ### Statistics vs. The "Smuggled" Causal Answer

  You hit the nail on the head regarding the actuary's use of physical models. When the record is thin, they lean on hydrology or epidemiology. Is this a substantive answer to Goodman?

  Yes, it is. It is an admission that **fit and sample size are necessary but not sufficient.**

  Goodman's point is that logic alone cannot distinguish 'green' from 'grue'. The actuary's recourse to physics is an admission that extra-logical constraints are required. By using a hydrological model, the actuary is saying: "I am not just projecting the *pattern* of past floods; I am projecting the *mechanism* that caused them (rainfall, topography, drainage)."

  If the mechanism is stable, the predicate is projectible. If the mechanism is subject to structural break (like climate change altering rainfall patterns), the predicate becomes 'grue-ish'. In fact, the insurance industry's current struggle with climate change is essentially a mass realisation that certain predicates they thought were 'green' (e.g., '100-year flood level based on 1950–2020 data') are actually 'grue' (stable until the climate shifted, then different).

  So, the industry does not solve Goodman's riddle philosophically; they solve it pragmatically by refusing to insure risks where the causal mechanism is opaque. They treat causal intelligibility as a proxy for projectibility.

  ### The "Inconsistency" of Thin Data

  You ask why insurers extrapolate from a handful of years in some lines (say, aviation hull) but refuse to write others (say, a novel cyber risk) despite similar data scarcity. Is this inconsistency?

  I would argue it is not inconsistency, but a judgment on **analogy**.

  When an insurer prices a satellite launch with limited data, they are not relying solely on the satellite's specific claims history. They are mapping it to a broader class of 'engineering projects involving high kinetic energy and complex systems'. They have a causal model of failure (metal fatigue, software error, orbital debris). The predicate 'probability of launch failure' is backed by physics.

  When they refuse a novel cyber risk, it is often because they cannot identify a stable causal class. Is this risk like property damage? Like business interruption? Like a bank run? The predicates available are 'grue-like' because the underlying technology and threat landscape shift faster than the causal model can stabilise.

  The refusal to write is not a comment on sample size; it is a comment on the **stability of the generating process**. If the process generating the claims is evolving (non-stationary), past data is not just sparse; it is misleading. In Goodman's terms, the predicate is inherently 'grue' because the definition of the risk changes over time. The underwriter is effectively saying, "I cannot identify the 'green' here, so I will not bet."

  ### What if We Couldn't Solve Grue?

  This is the crucial counterfactual. If we accept Goodman's scepticism fully—that there is no rational basis for preferring 'green' over 'grue' other than linguistic habit—insurance as we know it becomes impossible.

  1.  **Long-term Contracts Vanish:** Annuities and pension liabilities rely on projecting mortality 30 to 50 years out. If 'mortality improvement' is as projectible as 'mortality deterioration after 2035', you cannot price the premium. You would be forced into short-term, renewable contracts where the price is reset annually based on immediate experience. The transformation of risk over time would cease.
  2.  **Reserving Collapses:** Insurers must hold capital for claims that have happened but aren't reported (IBNR). This requires projecting the 'tail' of claims development. If the development pattern is 'grue' (stable for 3 years, then doubles), reserves will be systematically wrong. Insolvency becomes a random walk.
  3.  **Catastrophe Cover Disappears:** Reinsurance for earthquakes or hurricanes relies on the assumption that the earth's physics are constant. If we cannot privilege the predicate 'tectonic stress release' over 'tectonic stress release until next Tuesday', the probability models are nonsense. You couldn't charge a premium; you'd be guessing.
  4.  **Pricing Becomes Spot-Market Gambling:** Without projectible predicates, you cannot group risks into classes. Every risk becomes unique (the problem of the 'reference class' becomes fatal). You couldn't say 'this house is like that house'. You would have to price every policy based on a bet about the immediate future, with no reliance on the past.

  In short, if Grue wins, insurance reverts to gambling. The distinction between insurance (transfer of measurable risk) and gambling (creation of unmeasurable risk) relies entirely on the assumption that some patterns in nature are stable and projectible.

  ### Conclusion

  The insurance market does not solve Goodman's riddle in the seminar room; it solves it in the ledger. It operates on a **pragmatic realism**. It assumes that there are 'joints' in nature, that some predicates track those joints, and that causal models help identify them.

  It quietly rules out any philosophy that treats all regularities as equal. It demands that a projectible predicate be backed by a mechanism that is expected to persist. When the mechanism is unknown or shifting (the 'grue' scenarios), the market withdraws capacity.

  So, the actuary's reliance on physical models isn't just a technical workaround; it is the substantive answer to the riddle. They are asserting that projectibility belongs to predicates that describe causal powers, not just surface regularities. If they stopped believing that, they would have to stop selling policies that run longer than a year. The fact that they sell 30-year annuities is proof enough that, in practice, they have bet their solvency on 'green' and against 'grue'.
