prompt: |-
  I'm the managing editor of a small math journal that publishes constructive and computational mathematics — maybe fifteen submissions a month, two referees each. Our referee pool is a mess: a couple of old-school constructivists, several type theorists, and a lot of ordinary analysts and number theorists who use classical logic all day and genuinely don't know what the fuss is about. Every few weeks I get a report that says, in effect, "this proof uses excluded middle, not constructive," and then the author writes me a furious letter pointing out that the theorem itself is perfectly fine constructively, or that the referee's own proof of the same lemma is worse. I want to kill this with a form.

  The house rule I want the form to enforce: authors declare an "axiom budget" in the abstract — the nonconstructive principles their proof actually leans on, drawn from a short list we publish. The referee's job isn't to rule on which principles are respectable, it's to audit the budget: nothing used that isn't declared, nothing declared that isn't used. Though some of the real philosophical fun is deciding what goes on that list in the first place, so say something about that too.

  So write me the referee form. The questions in the order a referee should ask them, what counts as a sufficient answer to each, where the procedure stops with a verdict (budget honest / under-declared / over-declared / not constructive in any useful sense), and where it hands the thing back to me or the author instead of settling it. Include a short list of the telltale moves that mean a proof has quietly spent money it never declared, and a little table of the usual suspect principles with what each one costs you — I want to be able to tell an author "your theorem is equivalent to X" instead of "your proof is bad."

  Then run the form on three submissions: (1) a classical proof that every program in some class halts, via a compactness argument, where the author claims the result is "constructive" because a program exists; (2) a proof of a fixed-point or intermediate-value type theorem that declares no extra principles but leans on the fan theorem in an intermediate lemma; (3) a paper I personally like whose main theorem needs Markov's principle, submitted by someone who thinks Markov's principle is a scandal.

  Referees get about 45 minutes and most of them are not constructivists, a few are hostile. Tell me which parts of the form are judgment calls dressed up as procedure, and where the whole thing will misfire. I'd rather know now then get another angry letter.
reasoning: |-
  Here's a thinking process that leads to the suggested referee form and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Managing Editor of a small math journal (Constructive/Computational Math).
      *   **Problem:** Referee pool is mixed (constructivists, type theorists, classical analysts). Conflicts arise over "constructiveness" vs. "classical logic." Authors get angry when referees reject proofs for using Excluded Middle (EM) when the theorem might be constructive, or when referees miss subtle non-constructive steps.
      *   **Proposed Solution:** A "Axiom Budget" form. Authors declare non-constructive principles used. Referees audit the budget (honesty check, not philosophical judgment).
      *   **Deliverables:**
          1.  The Referee Form (questions, order, sufficient answers, verdicts, hand-off points).
          2.  Telltale moves (hidden costs).
          3.  Table of Principles (cost/implications).
          4.  Discussion of the List (what goes on it).
          5.  Run the form on three specific submissions (Halting/Compactness, IVT/Fan Theorem, Markov's Principle).
          6.  Critique of the Form (judgment calls, failure points).
      *   **Constraints:** Referees have ~45 minutes. Some are hostile/non-expert in constructivism. Tone should be practical, slightly weary but professional (matching the editor's voice).

  2.  **Deconstruct the "Axiom Budget" Concept:**
      *   *Idea:* Shift the burden from "Is this constructive?" to "Did you declare your dependencies?"
      *   *Benefit:* Reduces philosophical fighting. Makes the logic explicit.
      *   *Risk:* Authors might game the system or misunderstand the principles. Referees might not know how to spot the principles.
      *   *List of Principles:* Needs to be standard enough to be recognizable but specific enough to be useful (e.g., LEM, AC, MP, Fan Theorem, LLPO).

  3.  **Drafting the Referee Form:**
      *   *Structure:* Needs to be linear and quick.
      *   *Step 1: The Budget.* Check the abstract/intro. Is there a declaration?
      *   *Step 2: The Audit.* Scan for specific markers.
      *   *Step 3: The Verdict.* Honest, Under-declared, Over-declared, Irredeemable.
      *   *Step 4: Hand-off.* When does the Editor step in? (When the referee isn't sure).
      *   *Tone:* Bureaucratic but mathematically precise.

  4.  **Developing the "Telltale Moves" and "Principle Table":**
      *   *Telltale Moves:* Proof by contradiction without a negative conclusion, picking an element from a non-empty set without a rule, assuming a sequence either hits 0 or doesn't.
      *   *Table:* Needs to rank principles by "constructive cost."
          *   Free: Intuitionistic Logic.
          *   Cheap/Debatable: Markov's Principle (MP).
          *   Expensive: Limited Principle of Omniscience (LPO), Lesser LPO (LLPO).
          *   Very Expensive: Full Excluded Middle (EM/LEM), Axiom of Choice (AC).
          *   Specific: Fan Theorem (Brouwer's), Bar Induction.

  5.  **Running the Form on the Three Submissions:**
      *   *Case 1 (Halting/Compactness):* Classical proof of halting. Claim: "Constructive because program exists." Reality: Compactness usually implies Weak König's Lemma or similar, often non-constructive. Verdict: Under-declared/Not constructive.
      *   *Case 2 (IVT/Fan Theorem):* IVT is famously non-constructive in full generality. Fan Theorem is constructive (in Brouwer's sense) but controversial in Russian constructivism. If they declare *nothing*, but use Fan Theorem, it's Under-declared *if* the journal treats Fan Theorem as an extra axiom (many do). *Correction:* In many constructive schools (BISH), Fan Theorem is an axiom. In others (RUSS), it's false. The prompt implies the journal publishes "constructive and computational." I need to decide where Fan Theorem sits on the budget. Let's place it on the budget list as "Non-Algorithmic Continuity." Verdict: Under-declared.
      *   *Case 3 (Markov's Principle):* Author thinks MP is a scandal (i.e., shouldn't be used). But the theorem *needs* it. If they declare it, it's Honest. If the journal accepts MP, it's fine. If the author *thinks* it's a scandal but uses it, they might not declare it. Wait, the prompt says "submitted by someone who thinks Markov's principle is a scandal." This implies they might try to hide it or they are confused. If the proof *needs* it, they must declare it. If they declare it, it's Honest. If they don't, it's Under-declared. Let's assume they *did* declare it because they know the proof needs it, but they are philosophically opposed (maybe they think it should be provable?). Actually, the prompt says "main theorem needs Markov's principle, submitted by someone who thinks Markov's principle is a scandal." This suggests tension. If they declare it, the referee just checks honesty. Verdict: Budget Honest (but Editor needs to decide if MP is acceptable for this issue).

  6.  **Critiquing the Form (The "Gotchas"):**
      *   *Referee Competence:* Classical analysts can't spot constructive violations easily. 45 minutes isn't enough to formalize a proof.
      *   *Equivalence vs. Proof:* A theorem might be equivalent to LEM even if the proof looks okay. The form checks the *proof*, not the *theorem*.
      *   *Gaming:* Authors can declare "Full LEM" to be safe, making the paper less valuable but passing the audit.
      *   *Philosophy Creep:* Deciding what goes on the "Allowed List" is still philosophical.

  7.  **Refining the Tone:**
      *   The editor is tired of the fighting. The form should sound like a tool to stop the fighting, not start new ones.
      *   Use metaphors (budget, currency, audit).
      *   Be honest about the limitations.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on Case 2:* The Fan Theorem is acceptable in BISH (Bishop's constructive math) but not RUSS. Since the journal is "constructive and computational," Bishop is usually the baseline. However, the prompt says the referee pool includes type theorists and classical analysts. To make the "Budget" work, Fan Theorem should probably be on the list as a "Special Axiom" so classical analysts can spot it as "non-classical-extra" or constructivists can spot it as "non-BISH." Actually, for a general constructive journal, Fan Theorem is often considered an *additional* principle over basic constructive set theory. I will list it as a budget item.
      *   *Self-Correction on Case 1:* Compactness arguments are usually classical. If they claim "program exists," that's a semantic claim, not a syntactic one. The form must catch this.
      *   *Self-Correction on Case 3:* If the author thinks MP is a scandal, why are they using it? Probably because they can't prove it without it. If they declare it, the form works. The conflict is for the *Editor* to decide if MP papers are welcome, not the referee. This highlights the form's limit: it audits honesty, not acceptance policy.

  9.  **Final Polish:**
      *   Ensure the "Telltale Moves" are concrete enough for a classical analyst to spot (e.g., "Suppose not...", "Let x be such that...").
      *   Make sure the "Verdict" section is clear.
      *   Add the "Editor's Note" on where the form fails.

  10. **Final Review against constraints:**
      *   Form included? Yes.
      *   Order of questions? Yes.
      *   Verdicts defined? Yes.
      *   Telltale moves? Yes.
      *   Table of principles? Yes.
      *   Three cases run? Yes.
      *   Critique of form? Yes.
      *   Tone appropriate? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Referee Pool
  **FROM:** Managing Editor
  **SUBJECT:** New Procedure for Axiom Budget Auditing (Effective Immediately)

  Colleagues,

  We are changing how we handle the "constructivity" question. We are no longer asking you to decide if a paper is "constructive enough." We are asking you to audit the **Axiom Budget**.

  Authors must now declare in their abstract which non-constructive principles their proof relies on. Your job is not to judge the philosophy. Your job is to check the ledger. Did they spend what they said they would spend? Did they hide expenses?

  Below is the **Referee Audit Form**. You have 45 minutes. Do not formalize the proof. Scan for the "Telltale Moves" listed in Section 3. If you are unsure, mark "Uncertain" and hand it to me. Do not write a furious letter to the author; mark the box, and I will handle the correspondence.

  ***

  # CONSTRUCTIVE MATH JOURNAL: REFEREE AUDIT FORM

  **Paper ID:** _______________
  **Referee ID:** _______________
  **Time Spent:** _______ mins

  ## PART 1: THE DECLARATION (Check the Abstract/Intro)
  *Does the author declare an Axiom Budget?*

  *   [ ] **No Declaration.** (Stop. Return to Editor. Verdict: **Administrative Reject**.)
  *   [ ] **Declared Budget:** (List principles checked by author)
      *   [ ] None (Pure BISH/Intuitionistic)
      *   [ ] Markov's Principle (MP)
      *   [ ] Limited Principle of Omniscience (LPO)
      *   [ ] Lesser LPO (LLPO)
      *   [ ] Fan Theorem (FAN)
      *   [ ] Excluded Middle (EM/LEM)
      *   [ ] Axiom of Choice (AC)
      *   [ ] Other: _______________

  ## PART 2: THE AUDIT (Scan the Proof)
  *Read the main theorems and the proofs of key lemmas. Look for the Telltale Moves (see Section 3).*

  **Q1: Did you spot any Telltale Moves?**
  *   [ ] No.
  *   [ ] Yes. (List location: _______________)

  **Q2: If Yes, do the moves correspond to a principle on the Declared Budget?**
  *   [ ] N/A (No moves spotted).
  *   [ ] Yes, they match the declaration.
  *   [ ] No, they imply a stronger principle than declared.
  *   [ ] No, they imply a principle *not* on the budget list.

  **Q3: Is the main theorem trivially true if we assume Full Classical Logic (EM + AC)?**
  *   [ ] Yes. (This is fine, provided EM is declared).
  *   [ ] No. (The theorem itself might be constructive even if the proof isn't. Proceed to Q4).
  *   [ ] Unsure.

  **Q4: (Only if Q3 is No) Does the proof provide an algorithm/witness, or merely existence?**
  *   [ ] Provides explicit witness/algorithm.
  *   [ ] Proves existence via contradiction or compactness.
  *   [ ] Unclear.

  ## PART 3: THE VERDICT
  *Select exactly one.*

  *   [ ] **BUDGET HONEST.** The proof uses only declared principles. (Recommendation: Accept/Minor Revision).
  *   [ ] **UNDER-DECLARED.** The proof uses principles stronger than or different from the budget. (Recommendation: Major Revision to fix proof or update budget).
  *   [ ] **OVER-DECLARED.** The author claims to use EM/AC, but the proof appears purely constructive. (Recommendation: Ask author to tighten proof; otherwise Accept).
  *   [ ] **NOT CONSTRUCTIVE IN ANY USEFUL SENSE.** The proof relies on compactness/EM to prove existence of an object that cannot be computed, and the author claims "computational content." (Recommendation: Reject).
  *   [ ] **UNCERTAIN / HAND OFF TO EDITOR.** I am not confident in my constructive logic diagnosis. (Editor will consult a specialist).

  ***

  ## APPENDIX A: TELLTALE MOVES (The "Smoking Guns")
  *If you see these, money is being spent. Check if it's in the budget.*

  1.  **The "Suppose Not" Trap:** Proving $P$ by assuming $\neg P$ and deriving a contradiction, where $P$ is not a negative statement (i.e., not of the form $\neg Q$).
      *   *Cost:* Excluded Middle (EM).
  2.  **The "Pick One" Move:** "Let $x$ be an element such that..." without a rule to find $x$, especially from an infinite set.
      *   *Cost:* Axiom of Choice (AC).
  3.  **The "Zero or Not" Test:** Assuming for any real number $x$, either $x=0$ or $x \neq 0$ (or $x > 0$).
      *   *Cost:* LPO (Limited Principle of Omniscience).
  4.  **The "Compactness" Leap:** Using "finite subcover exists" on an infinite cover to prove a property holds for a specific constructible object.
      *   *Cost:* Usually EM or Weak König's Lemma (Non-constructive).
  5.  **The "Not-Not" Elimination:** Deriving $P$ from $\neg\neg P$.
      *   *Cost:* EM (unless $P$ is negative).
  6.  **The "Recursive Decision":** Assuming that for a recursive sequence, we can decide if it is all zeros or contains a non-zero.
      *   *Cost:* Markov's Principle (MP).

  ## APPENDIX B: THE PRICE LIST (Principle Table)
  *Use this to tell the author what their theorem actually costs.*

  | Principle | Abbrev | Constructive Cost | What it buys you |
  | :--- | :--- | :--- | :--- |
  | **Intuitionistic Logic** | **INT** | **Free** | The baseline. No EM, no double-negation elimination. |
  | **Markov's Principle** | **MP** | **Low** | Allows search termination ($\neg\neg \exists n \to \exists n$). Acceptable in Russian Constructivism, controversial in BISH. |
  | **Lesser LPO** | **LLPO** | **Medium** | Disjunctions on reals ($\neg(x>0 \land x<0) \to x\le0 \lor x\ge0$). Needed for some IVT versions. |
  | **Fan Theorem** | **FAN** | **Medium/High** | Uniform continuity on compact intervals. Accepted in BISH, rejected in RUSS. |
  | **Limited PO** | **LPO** | **High** | Decidability of equality on reals. Makes analysis classical-ish. |
  | **Excluded Middle** | **EM** | **Very High** | Full classical logic. Proof is non-constructive. |
  | **Axiom of Choice** | **AC** | **Very High** | Existence without construction. Diaconescu's theorem shows AC implies EM. |

  ***

  # EDITOR'S NOTE: WHERE THIS FORM MISFIRES

  I am not naive. I know this form is a bandage, not a cure. Here is where you need to be careful, and where I expect the angry letters to come from.

  **1. The "Judgment Call" Disguised as Audit**
  Question Q4 ("Does the proof provide an algorithm?") is the weakest link. A classical analyst might look at a compactness argument and say, "Well, the object exists, so we can compute it in principle." A constructivist will scream, "No, you haven't given a bound!"
  *   *Mitigation:* If you mark "Uncertain," I will not penalize you. I would rather you punt than guess.

  **2. Theorem vs. Proof Equivalence**
  The form audits the *proof*, not the *theorem*. An author can write a terrible, classical proof of a perfectly constructive theorem.
  *   *Risk:* You might mark "Under-declared" because they used EM, when the theorem is actually valid in INT.
  *   *Procedure:* If you suspect the *theorem* is constructive but the *proof* is lazy/classical, mark **Over-Declared** and add a note: "Theorem likely constructive, proof uses unnecessary EM." I will ask the author to fix the proof, not reject the paper.

  **3. The "Budget Gaming" Problem**
  An author can simply check "Excluded Middle" on the budget to be safe. This passes the audit but defeats the journal's mission.
  *   *Procedure:* If they declare EM for a result that looks computational, use the **Not Constructive in Any Useful Sense** verdict. I will reject those. We publish computation, not classical existence with a "constructive" label.

  **4. The Fan Theorem Trap**
  The Fan Theorem is the biggest wedge issue. Bishop (BISH) accepts it; Russian constructivists (RUSS) reject it; Type Theorists often derive it from univalence or bar induction.
  *   *Procedure:* We treat FAN as a budget item. If they use it, they must declare it. If they don't, it's Under-declared. I will decide at the editorial level if FAN is acceptable for that specific issue's theme.

  ***

  # SIMULATED AUDITS

  Here is how the form handles the three submissions currently clogging my inbox.

  ### CASE 1: The Halting Program (Compactness)
  **Submission:** "Constructive Proof of Halting for Class $\mathcal{C}$."
  **Abstract:** Claims result is constructive because "a program exists." Budget: **None (Pure INT)**.
  **Proof Sketch:** Uses a compactness argument on the space of execution traces to show a bound exists, therefore the program halts.

  **Referee Audit:**
  *   **Q1 (Declaration):** None.
  *   **Q2 (Telltale Moves):** Spots "Compactness/Finite Subcover" on infinite space.
  *   **Q3 (Classical Truth):** Yes, trivially true classically.
  *   **Q4 (Algorithm):** Proves existence of a bound via contradiction/compactness. No algorithm given for finding the bound.
  *   **Verdict:** **NOT CONSTRUCTIVE IN ANY USEFUL SENSE.**
  *   **Editor's Action:** Reject. The author is confusing "existence" with "constructibility." Compactness arguments of this sort are notoriously non-constructive (often equivalent to WKL). The claim "a program exists" is semantic, not syntactic.

  ### CASE 2: The Intermediate Value Theorem (Fan Theorem)
  **Submission:** "A Constructive IVT for Continuous Functions."
  **Abstract:** Budget: **None (Pure INT)**.
  **Proof Sketch:** Proves IVT by establishing uniform continuity on $[0,1]$ via a lemma that invokes the Fan Theorem implicitly (covering the interval with fans).

  **Referee Audit:**
  *   **Q1 (Declaration):** None.
  *   **Q2 (Telltale Moves):** Spots inference from pointwise continuity to uniform continuity on compact set without a modulus.
  *   **Q3 (Classical Truth):** Yes.
  *   **Q4 (Algorithm):** The root finding requires the uniform modulus.
  *   **Verdict:** **UNDER-DECLARED.**
  *   **Editor's Action:** Major Revision. The author must declare **FAN** in the budget. *Note:* I will accept this if they declare it, as we publish BISH-style math, but they cannot claim "Pure INT" if they rely on FAN without stating it. This stops the RUSS referees from rejecting it outright; they will see the budget and know the school of thought.

  ### CASE 3: The Markov's Principle Scandal
  **Submission:** "Decidability of Diophantine Property $P$."
  **Abstract:** Budget: **MP (Markov's Principle)**.
  **Proof Sketch:** Uses double-negation elimination on a recursive predicate. Author's cover letter: "I personally find MP distasteful, but the theorem seems to require it."

  **Referee Audit:**
  *   **Q1 (Declaration):** MP Declared.
  *   **Q2 (Telltale Moves):** Spots $\neg\neg \exists n \to \exists n$ on a recursive predicate.
  *   **Q3 (Classical Truth):** Yes.
  *   **Q4 (Algorithm):** The proof provides a search procedure *assuming* MP.
  *   **Verdict:** **BUDGET HONEST.**
  *   **Editor's Action:** Accept. This is exactly what the form is for. The referee does not need to decide if MP is "evil." The author declared the cost. The referee confirmed the cost was paid. The philosophical objection is noted in the cover letter, but the audit is clean. I will publish it with a footnote about the MP dependency.

  ***

  # FINAL WARNING TO REFEREES

  This form will not stop authors from being confused. It will not stop classical analysts from missing a constructive violation. It will not stop constructivists from being offended by MP.

  What it *will* do is force the argument into the abstract. When an author writes you a furious letter, you can point to **Appendix A, Move #1**. You can say, "You used Proof by Contradiction on a positive statement. You did not declare EM. That is an Under-declared Budget."

  That is a bureaucratic fact, not a philosophical insult. It is harder to be furious at a ledger.

  If you can't spot the move, check **UNCERTAIN**. I am paid to argue with authors. You are paid to check the math.

  **Managing Editor**
