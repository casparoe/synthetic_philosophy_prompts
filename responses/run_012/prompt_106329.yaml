answer: |-
  **Project Proposal: The Scope Problem for Evolutionary Debunking Arguments**

  **Research Question**
  This paper will address a specific structural vulnerability in evolutionary debunking arguments (EDAs) against moral realism. The central question is: *Can the evolutionary debunker specify a premise about evolutionary influence that is both sufficiently specific to threaten moral realism and sufficiently general to avoid undermining the epistemic norms required to assert the argument?*

  Rather than asking whether moral realism is true or whether our faculties are reliable simpliciter, this project focuses on the *specification of the evolutionary premise*. Standard EDAs claim that because evolution shaped our moral beliefs without tracking moral truth, those beliefs are unjustified. However, evolution did not shape moral beliefs in isolation; it shaped the general cognitive faculties used to form all normative beliefs, including the epistemic norms used to evaluate the evolutionary theory itself. This creates a dilemma: the debunker needs a **Narrow Premise** (selection targeted specific moral content) to avoid global skepticism, but evolutionary theory supports a **Broad Premise** (selection targeted general normative capacities). I will argue that the Narrow Premise is empirically unsupported, forcing the debunker onto the Broad Premise, which renders the argument self-undermining.

  **Motivation and Gap in the Literature**
  The current literature treats the evolutionary explanation invoked in EDAs as a fixed point. Debunkers assume they can isolate moral faculties from epistemic faculties. Realists often reply by arguing that evolution *did* track truth (third-factor replies) or by arguing that the debunking argument cuts too wide (global skepticism replies).

  However, these standard moves do not settle the issue because they accept the debunker's framing of the evolutionary premise.
  1.  **Third-Factor Replies:** These assume we can identify a link between evolution and moral truth. But if the Broad Premise is correct, the faculty used to identify that link is itself suspect. These replies beg the question against the scope of the evolutionary influence.
  2.  **Global Skepticism Replies:** The standard response is that the debunker can exempt logic and epistemology from the argument. My project challenges whether the evolutionary story actually allows for this exemption. If the same selection pressures shaped our capacity for logical inference and moral intuition, the exemption is ad hoc.
  3.  **Minimalist Realism:** Lowering the bar for what realism requires avoids the debunking threat only if the threat is specific to morality. If the threat is broad, minimalism offers no protection.

  The gap this paper fills is an analysis of the *empirical plausibility* of the Narrow Premise. Most discussions assume the debunker is entitled to isolate moral beliefs. I will argue they are not, given contemporary evolutionary psychology.

  **Method and Structure**
  The paper will proceed through conceptual analysis and engagement with the standard dialectic of the EDA. It will not attempt to defend moral realism directly, but rather to show that the EDA fails on its own terms due to internal inconsistency regarding its evolutionary premises.

  *   **Section 1: The Dilemma of Scope (approx. 1000 words)**
      I will define the Narrow and Broad premises precisely. The Narrow Premise claims selection pressures targeted specific moral contents (e.g., kin altruism) independent of truth. The Broad Premise claims selection targeted general normative reasoning capacities. I will establish that the EDA requires the Narrow Premise to avoid self-undermining, but the Broad Premise to be scientifically accurate.

  *   **Section 2: The Empirical Case Against the Narrow Premise (approx. 1500 words)**
      I will argue that the Narrow Premise is empirically unsupported. Evolutionary explanations of normativity focus on general capacities for reasoning, planning, and social coordination, not modular moral truths. If the debunker insists on the Narrow Premise, their argument rests on a false empirical claim about human cognitive architecture.

  *   **Section 3: The Self-Undermining Cost of the Broad Premise (approx. 1500 words)**
      I will demonstrate that adopting the Broad Premise triggers a self-undermining objection. If the faculties used to construct the EDA (logic, evidence evaluation, inference to the best explanation) are subject to the same debunking pressure, the argument loses its normative force. I will evaluate potential escape routes (e.g., claiming epistemic norms are indispensable) and argue they fail to distinguish epistemic from moral norms in the way the EDA requires.

  *   **Section 4: Implications for Metaethics (approx. 1000 words)**
      I will conclude that the EDA cannot succeed without relying on premises that either falsify the evolutionary story or undermine the argument's own justification. This suggests that EDAs do not provide a distinctive reason to reject moral realism, as the cost of accepting them is accepting a global skepticism that makes philosophical inquiry impossible.

  **Feasibility and Success Conditions**
  **Word Count:** 5000 words is tight but sufficient for this specific scope. To make this feasible, I will not defend a positive account of moral knowledge. The goal is negative: to show the EDA is incoherent. I will avoid deep dives into specific realist theories (e.g., non-naturalism vs. naturalism) and keep the focus on the structure of the debunking argument itself.

  **Success Conditions:**
  The project succeeds if I can demonstrate that the distinction between moral and epistemic faculties is not robust enough to support the Narrow Premise.
  **Failure Conditions:**
  The project would fail if it turns out there is a stable, empirically supported way to isolate moral faculties from general reasoning faculties (validating the Narrow Premise), or if the self-undermining objection can be easily deflected by standard indispensability arguments without ad hocery.

  **Risk Management:**
  If the argument becomes too complex for 5000 words, I will shrink the scope to focus exclusively on Section 2 and 3: establishing that the Broad Premise is the only empirically viable one, and that it entails self-undermining. This narrower focus ensures a complete argument rather than a survey of the whole dilemma.
