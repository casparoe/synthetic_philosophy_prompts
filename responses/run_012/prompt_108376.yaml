  The shifting grammar of the end-words enacts the fluidity of the abstraction they name, while the sestina's recursive structure mirrors the circular, self-perpetuating nature of levelling. By forcing the final line to land on "everyone" rather than the individual, the form refuses the consolation of a heroic exit, implicating the reader in the very machinery they observe.

  In one sentence: The press creates a public that is nobody and everybody, grinding down distinction through the ordinary complicity of all.
