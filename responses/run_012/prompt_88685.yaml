  The setup
  The conflict featured stark asymmetries in agency and composition. The British Task Force comprised professional volunteers, democratically mandated, fighting to reclaim sovereign territory. They chose deployment; their chain of command was robust, logistics secure. The Argentine garrison was a mix of regulars and conscripts, many teenagers, deployed by an authoritarian junta seeking domestic legitimacy. They faced logistical neglect, poor training, and isolation. Crucially, the British fought an expeditionary war of recovery; the Argentines fought a defensive war of occupation imposed by a regime that kept elite units home. The British soldier acted as an agent of state defense; the Argentine conscript acted as a tool of state aggrandizement, often under coercion. On the ground, this meant British units operated with tactical autonomy, while Argentine conscripts huddled in foxholes, poorly fed, facing a superior enemy. This sets the stage: one side volunteers for a just cause, the other is coerced into an unjust one.

  MEC on the ground
  Walzer's Moral Equality of Combatants (MEC) asserts a strict separation between *jus ad bellum* (justice of war) and *jus in bello* (justice in war). Regardless of the invasion's illegality, Argentine soldiers possess the same combatant rights as the British. Both are permitted to kill the other, provided they distinguish civilians and avoid unnecessary suffering. The doctrine grounds this permission in the mutual threat combatants pose: by bearing arms, both become dangerous agents liable to attack. It does not matter that Argentina is the aggressor; the individual soldier is not responsible for state policy. Therefore, the British para cannot claim moral superiority to execute surrendering Argentines, nor can the conscript be tried for murder simply for fighting. MEC creates a symmetrical license to kill to prevent wars from devolving into punitive crusades. It treats soldiers as instruments of the state, shielding them from personal guilt regarding the war's origin. Both sides enter the contractual violence of war with equal standing, ensuring reciprocity in treatment and limiting violence to the military sphere. This symmetry is functional: it allows for surrender and POW status. If the British claimed superior moral license, they could treat Argentines as criminals. MEC forbids this, insisting that once engaged, the violence is symmetrical. The permission to kill is derived from the state of war itself, not the righteousness of the cause. Consequently, the conscript has the same right to shoot the para as the para has to shoot him. Their moral standing in the fight is identical. This equality is absolute within the combat zone; rank, motive, and conscription status are irrelevant to the license to kill.

  What the case fits
  The doctrine handles the reciprocal risk of battle well. In the fog of war, the British soldier cannot adjudicate the Argentine's coercion. Both wear uniforms, carry rifles, and pose lethal threats. MEC correctly identifies that both are legitimate targets. It also successfully mandates humane treatment post-conflict. Because they are moral equals, surrendering Argentines deserve POW status, not prosecution for participation. This prevents the victor from punishing the vanquished for fighting back, stabilizing the end of hostilities. The doctrine also captures the reality that conscripts, however reluctant, are participants. They pull triggers; they are not merely bystanders. By granting them combatant privilege, MEC acknowledges their agency enough to hold them to the laws of war, but not enough to blame them for the war itself. It fits the functional need for rules: if only the just side had permission to kill, the unjust side would have no incentive to follow rules. MEC ensures that even the conscript, fighting for a junta, has a reason to spare civilians and treat prisoners well, because he expects the same in return. The symmetry preserves the possibility of restraint. Furthermore, it aligns with the legal reality of the conflict. Both sides generally adhered to Geneva conventions. The British did not execute conscripts; Argentina treated POWs according to protocol. MEC describes this successful containment of violence. It explains why the war remained a military contest rather than a massacre. The framework holds where conduct is concerned. It validates the professional ethic of the British forces too. They fought the soldiers, not the regime. This separation allowed for a clean end to hostilities without lingering vendettas against individual Argentines. The doctrine fits the operational reality where mutual vulnerability dictates conduct.

  What the case strains
  The strain emerges in the asymmetry of moral agency. MEC treats the license to kill as a *justification*, implying equal moral standing. But the conscript's permission looks more like an *excuse*. He kills under duress; the volunteer kills from duty. The doctrine glosses over the conscript's lack of meaningful consent. He is a victim of his government as much as the British are targets. Furthermore, *jus ad bellum* leaks into *in bello*. The British fight a defensive war of recovery; the Argentines fight an offensive war of occupation. This affects the moral weight of their actions. MEC says they are equals, but intuitively, the British soldier defends a right, while the conscript enforces a wrong. The doctrine forces us to say the conscript is *justified* in killing the Brit, when perhaps he is merely *excused* because he had no choice. This conflation masks the tragedy: the conscript is doubly victimized—by his commanders and by the war ethic that equates his coerced violence with professional duty. It demands we ignore the political reality that created the asymmetry. Additionally, the doctrine struggles with the quality of participation. A starving teenager in a foxhole poses a different moral problem than a trained para hunting him. MEC flattens this difference. It cannot account for the moral residue felt by the British soldier killing a coerced child. The doctrine insists on equality where our moral intuition screams inequality. It protects the conscript from prosecution, which is good, but claims he is morally equal to the defender, which feels false. The slide between justification and excuse is most visible here. We excuse the conscript because he is coerced, but we justify the volunteer because he is defending sovereignty. MEC collapses these distinct moral categories into one legal status. This works for law, but fails for moral philosophy. The doctrine also ignores the systemic coercion. The junta kept elite units home, sending kids to die. MEC treats the state as a black box, but here the state's internal injustice shapes the battlefield morality. When the state sacrifices its own children for a gamble, the soldiers are not just combatants; they are offerings. MEC lacks the vocabulary to describe this exploitation. It assumes a reciprocal relationship between state and soldier that didn't exist for the Argentines.

  My verdict
  The Falklands doesn't break MEC, but it forces a necessary clarification. The doctrine remains pragmatically vital for regulating conduct and POW treatment. However, it must distinguish between the *liability* to be attacked (which remains equal) and the *moral justification* for attacking (which does not). The conscript is excused, not justified. The volunteer is justified. Acknowledging this preserves the practical benefits of MEC—limiting violence and ensuring humane treatment—without falsely equating the moral standing of the aggressor's victim-soldier with the defender's volunteer. The doctrine survives, but only if we admit it functions as a legal fiction that masks a deeper moral inequality. We need a revised MEC that holds combatants equal before the law of war, but unequal before the bar of conscience. This saves the doctrine from moral blindness while retaining its humanitarian utility. The Falklands shows MEC is a rule of conduct, not a statement of moral truth.
