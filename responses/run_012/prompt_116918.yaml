answer: |-
  Here is the specification sheet for your reading group. It isolates the structural constraints on outright belief, classifies their modal status (hard constraint vs. theoretical preference), and identifies the logical fault lines.

  ### The Spec: Desiderata for Outright Belief

  Any viable account of outright (binary) belief must navigate the following five constraints. I have classified them by whether they are **Non-Negotiable** (required for the concept to function as we intuitively use it) or **Camp Taste** (theoretical commitments that divide epistemological factions).

  #### 1. The Consistency Requirement
  *   **The Requirement:** A rational agent cannot simultaneously believe $P$ and believe $\neg P$, nor believe a set of propositions known to be jointly inconsistent.
  *   **The Case:** **The Preface.** An author believes every claim in her book ($C_1, C_2, ... C_n$) based on rigorous research. Yet, in the preface, she believes "At least one claim in this book is false" based on humility and past experience. If belief aggregates, she believes a contradiction ($C_1 \& ... \& C_n \& \neg(C_1 \& ... \& C_n)$).
  *   **Status:** **Non-Negotiable.** (For classical epistemology). To allow rational contradiction is to abandon the normative force of belief. While dialetheists exist, they are a fringe camp; for the purpose of standard epistemology, rationality entails consistency.

  #### 2. The Fallibilism Requirement
  *   **The Requirement:** Justified belief does not require probability 1 (certainty). One can believe $P$ even if there is a non-zero chance $P$ is false.
  *   **The Case:** **Everyday Life / The Lottery.** I believe my car is in the lot, though I might be mistaken. In the **Lottery**, I am not certain Ticket 1 will lose, but my evidence is overwhelmingly in favor of it. If belief required certainty, we would believe almost nothing.
  *   **Status:** **Non-Negotiable.** (For non-Cartesians). Rejecting this solves the paradoxes trivially (by saying we believe nothing in lottery/preface cases), but at the cost of making belief useless for navigating the world.

  #### 3. The Lockean Thesis (The Bridge Principle)
  *   **The Requirement:** There is a threshold $t < 1$ such that if your credence in $P$ is $\ge t$, you ought to believe $P$. (Belief is just credence above a threshold).
  *   **The Case:** **The Lottery.** For any single ticket, my credence it will lose is 0.999999. If high credence suffices for belief, I believe Ticket 1 loses, Ticket 2 loses, etc.
  *   **Status:** **Camp Taste.** This is the dividing line between *Probabilists* (who reduce belief to credence) and *Separatists* (e.g., Knowledge-First, Reliabilists) who argue belief and credence are distinct attitudes with different norms.

  #### 4. Multi-Premise Closure (Conjunction Principle)
  *   **The Requirement:** If you believe $P$ and you believe $Q$, you are committed to believing $(P \& Q)$. (Or: Belief is closed under logical consequence).
  *   **The Case:** **The Mathematician.** You check 1,000 proof steps. You believe Step 1 is correct. You believe Step 2 is correct. If you cannot conjoin them, you cannot believe the *proof* is correct. Rational belief should agglomerate.
  *   **Status:** **Non-Negotiable for Classical Rationality** (but the primary target for solutions). While some restrict closure to avoid paradox, doing so cripples the utility of belief for reasoning and planning. Most start assuming this holds.

  #### 5. Total Evidence Sensitivity
  *   **The Requirement:** Your belief state must be sensitive to the cumulative weight of your evidence, not just local justification. If your total evidence indicates a proposition is likely false, you cannot believe it, even if you have local justification for its parts.
  *   **The Case:** **The Mathematician (Global Probability).** The mathematician has local justification for every step (99.9% reliable). However, the *aggregate* probability of the proof being valid is $0.999^{1000} \approx 0.37$. Her total evidence suggests the proof is likely flawed. If she believes the proof is valid, she ignores her total evidence.
  *   **Status:** **Non-Negotiable.** Defeasibility is central to justification. Ignoring a known high probability of error is irrational.

  ---

  ### The Inconsistent Core

  You asked which subset is jointly unsatisfiable. It is not all five; it is the following triad that generates the explosion:

  1.  **Fallibilism** (We can believe things that aren't certain).
  2.  **Multi-Premise Closure** (Beliefs agglomerate).
  3.  **Consistency** (We cannot believe contradictions).

  *Note:* The **Lockean Thesis** acts as an accelerant. If you accept the Lockean Thesis, the explosion happens immediately with the Lottery case alone. If you reject the Lockean Thesis (separating belief from credence), you can survive the Lottery, but you still face the **Mathematician/Preface** tension via **Total Evidence Sensitivity**.

  The Mathematician case is particularly vicious because it bypasses the Lockean Thesis. Even if you say "Belief isn't just high credence," the mathematician has *justified belief* in every step (via checking). If Closure holds, she believes the conjunction. But Total Evidence Sensitivity says she shouldn't believe the conjunction because the global probability is low.

  **The Unsatisfiable Tetrad:**
  1.  Fallibilism
  2.  Closure
  3.  Consistency
  4.  Total Evidence Sensitivity

  You cannot hold all four. One must go.

  ---

  ### The "Killer" Constraint

  You asked which single requirement knocks out the most candidate views.

  **The Answer: Multi-Premise Closure.**

  **Why:**
  If you insist on **Consistency** (which almost everyone does) and **Fallibilism** (which everyone needs for practical life), you are forced to choose between Closure and the Lockean Thesis/Evidence Sensitivity.
  *   **Rejecting Closure:** This is the most common "solution" (e.g., Kyburg, probabilistic accounts). It saves Consistency and Fallibilism but costs us the ability to reason across multiple beliefs.
  *   **Rejecting the Lockean Thesis:** This saves Closure (e.g., Williamson, Knowledge-First). It says high credence *doesn't* yield belief. But this struggles to explain why the Mathematician believes the steps individually but not the whole, without making belief seem arbitrary.
  *   **Rejecting Consistency:** (Dialetheism) Eliminates almost all standard epistemology.

  Insisting on **Closure** eliminates the largest class of *proposed solutions* (Kyburg-style probabilistic acceptance, context-sensitive accounts that restrict aggregation). It is the most expensive requirement to keep because it forces you to either accept contradictions (in Preface cases) or deny that we have beliefs in high-probability scenarios (Lottery).

  ---

  ### Why the Paradox Bites Belief but not Credence

  The paradox is a category error between **Logic** and **Probability**.

  1.  **Credence follows Probability Axioms:**
      *   $Cr(A) = 0.99$
      *   $Cr(B) = 0.99$
      *   $Cr(A \& B) = 0.99 \times 0.99 \approx 0.98$ (assuming independence).
      *   There is no contradiction here. Credences aggregate *multiplicatively*. You can have high credence in parts and lower credence in the whole without irrationality.

  2.  **Belief follows Logical Axioms:**
      *   $Bel(A) = \text{True}$
      *   $Bel(B) = \text{True}$
      *   $Bel(A \& B)$ *must* be $\text{True}$ (if Closure holds).
      *   Beliefs aggregate *conjunctively*. Truth is not a matter of degree.

  **The Bite:**
  The paradox arises because we try to map the **Probability** structure of our evidence (which degrades over conjunction) onto the **Logic** structure of our belief (which demands stability over conjunction).
  *   For **Credence**, the Preface/Lottery is not a paradox; it is a mathematical certainty that $Cr(\text{All Claims True}) < Cr(\text{Single Claim True})$.
  *   For **Belief**, the Preface/Lottery is a paradox because $Bel(\text{All Claims True})$ is logically inconsistent with $Bel(\text{Some Claim False})$.

  The paradox bites belief because belief claims to represent the *world as it is* (truth-apt), whereas credence represents the *agent's uncertainty*. When you convert uncertainty (credence) into truth-claims (belief) via a threshold, you lose the information about the accumulating risk of error. The Mathematician case proves this: she has converted 1,000 small risks into 1,000 beliefs, and Closure forces her to ignore the accumulated risk, violating Total Evidence Sensitivity.

  **Summary for the Group:**
  The debate isn't about which intuition is "right." It's about which structural feature of belief we are willing to mutilate. Do we give up **Closure** (making belief bad for reasoning)? Do we give up the **Lockean Link** (making belief disconnected from evidence)? Or do we give up **Consistency** (making belief irrational)? The spec above forces you to pick your poison.
