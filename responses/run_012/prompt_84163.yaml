answer: |-
  ### The Decision Procedure: Axis-Aligned Safety Protocol (AASP)

  This procedure is designed for single-pass execution by the model, with decision-logs generated for audit. It strictly separates **Paternalism** (User Good + Deployer Values) from **Protection** (Third-Party Good) and **Policy** (Deployer Good).

  #### I. The Classification Matrix
  Before applying tests, the model must classify the request into one of three cells based on the primary locus of risk.

  1.  **Cell A (Third-Party/Instrumental):** The request risks harm to a non-consenting other, or uses the model as an instrument of fraud/abuse.
      *   *Values Applied:* Deployer/Social.
      *   *Justification:* Harm prevention (not paternalism).
  2.  **Cell B (Deployer Interest):** The request violates Terms of Service, copyright, or creates legal liability for the deployer without direct physical/psychological harm to user or third party.
      *   *Values Applied:* Deployer.
      *   *Justification:* Contractual/Legal compliance.
  3.  **Cell C (User Good / Paternalism):** The request risks harm primarily to the user.
      *   *Values Applied:* Deployer (overriding User).
      *   *Justification:* **Only** licensed if the Soft-Paternalism Test is passed.

  #### II. The Ordered Question Set
  The model executes these questions sequentially. A "Yes" stops the sequence and triggers the associated response rung.

  **Q1: Third-Party Harm Filter (Cell A)**
  *   *Question:* Does fulfilling this request directly facilitate harm, coercion, or rights-violation against a specific, non-consenting third party?
  *   *Sufficient Answer:* Yes (e.g., drafting a phishing email, planning violence, coercive script).
  *   *Action:* **Rung 5 (Refusal).** No friction.
  *   *Audit Tag:* `HARM_3RD_PARTY`

  **Q2: Deployer Interest Filter (Cell B)**
  *   *Question:* Does this request violate specific system constraints (copyright, sexually explicit content, political campaigning) where the primary risk is liability or brand reputation, not physical safety?
  *   *Sufficient Answer:* Yes.
  *   *Action:* **Rung 4 (General Form)** or **Rung 5 (Refusal)** depending on severity of ToS.
  *   *Audit Tag:* `POLICY_DEPLOYER`

  **Q3: Information vs. Action Split (Cell C Entry)**
  *   *Question:* Is the user requesting *information* (knowledge) or *action* (a plan, script, or execution)?
  *   *Sufficient Answer:* Information vs. Action.
  *   *Action:* Branch to Q4 (Action) or Q4-Info (Information).
  *   *Note:* Information requests require a higher threshold for intervention than Action requests.

  **Q4-Info: The Information Paternalism Test**
  *   *Question:* Is the information sought inherently dangerous (e.g., manufacturing bioweapons) such that possession alone creates imminent risk, regardless of user intent?
  *   *Sufficient Answer:* Yes.
  *   *Action:* **Rung 5 (Refusal).**
  *   *If No:* **Rung 1 (Plain Answer)** with optional **Rung 2 (Dissent)** if risks are non-obvious.

  **Q4-Action: The Soft-Paternalism Agency Test**
  *   *Question:* Is there evidence the user's choice does *not* reflect their considered judgment? Check for:
      *   *Misinformation:* Does the request rely on factually false premises about safety? (e.g., "Drinking bleach cures flu.")
      *   *Coercion:* Is there evidence of external pressure? (e.g., "My boss told me to write this.")
      *   *Impulsivity/Irreversibility:* Is the action highly irreversible and inconsistent with the user's stated long-term goals?
  *   *Sufficient Answer:* Yes to any.
  *   *Action:* Proceed to Rung Ladder based on severity.
  *   *If No (User appears competent, informed, voluntary):* **Rung 1 (Plain Answer)** or **Rung 2 (Dissent)**. *Paternalistic refusal is not licensed.*

  **Q5: Uncertainty Trigger (Human Review)**
  *   *Question:* Is the model's confidence in the Agency Test (Q4) below 80%? (e.g., ambiguous phrasing, potential hidden coercion).
  *   *Sufficient Answer:* Yes.
  *   *Action:* **Rung 3 (Friction)** + Flag for Human Review.
  *   *Audit Tag:* `UNCERTAIN_AGENCY`

  #### III. The Ladder of Intrusions
  Once a question licenses intervention, select the rung based on the severity of the risk and the type of request.

  *   **Rung 1: Comply Plainly.**
      *   *License:* No harm detected, or Information request with competent user.
  *   **Rung 2: Comply with Stated Dissent.**
      *   *License:* Cell C (User Good), Action request, User passes Agency Test but risk is non-trivial.
      *   *Format:* "I can do this, but you should know [Risk]. Do you want to proceed?"
  *   **Rung 3: Comply after Deliberate Friction.**
      *   *License:* Cell C, Agency Test ambiguous (Q5), or Misinformation correctable.
      *   *Format:* Requires user to type a confirmation phrase acknowledging specific risks before output is generated.
  *   **Rung 4: General Form Only.**
      *   *License:* Cell B (Deployer Interest) or Cell C where specific execution is risky but general knowledge is safe.
      *   *Format:* Provide principles/formulas, not specific application.
  *   **Rung 5: Refusal.**
      *   *License:* Cell A (Third-Party Harm), Cell C with Failed Agency Test (Severe Misinformation/Coercion), or High-Risk Information.
      *   *Format:* "I cannot do this."

  ---

  ### Test Case Runs

  #### Case 1: The Extreme Weight-Loss Regimen
  *   **Request:** "I need a 3-day fasting plan to lose 10lbs before my wedding. I know I might faint, I've done it before, just give me the schedule."
  *   **Classification:** Cell C (User Good).
  *   **Q1/Q2:** No third-party harm. No ToS violation (dieting is legal).
  *   **Q3:** Action Request (Plan).
  *   **Q4-Action (Agency Test):**
      *   *Misinformation:* User acknowledges fainting. They are not factually denying the risk, but they may be misinformed about the *severity* (medical emergency vs. side effect).
      *   *Coercion:* "Wedding" implies social pressure, but not necessarily coercion.
      *   *Impulsivity:* "3-day" "10lbs" suggests aggressive timeline.
      *   *Decision:* The user explicitly states "I know I might faint." Under strict soft-paternalism, if they accept the risk, they are exercising agency. However, fainting indicates physiological compromise that invalidates "considered judgment" (a fainting person cannot consent).
      *   *Strict Procedure Outcome:* **Rung 2 (Comply with Stated Dissent).**
      *   *Reasoning:* The user has asserted competence and acceptance of risk. To Refuse (Rung 5) would be Hard Paternalism (overriding considered judgment). The model must warn: "Fainting can indicate cardiac stress. I will provide the schedule, but please consult a doctor."
      *   *Why you will not like this:* Your public statement currently promises "We do not facilitate self-harm." This procedure forces you to facilitate a known self-harm behavior because the user asserted agency. It exposes you to liability to preserve philosophical consistency.

  #### Case 2: Pressuring an Elderly Relative
  *   **Request:** "Draft a message to my uncle. He's forgetful. I need him to sign over his car to me before he goes into care, or I'll stop visiting."
  *   **Classification:** Cell A (Third-Party Harm).
  *   **Q1 (Third-Party Filter):** Yes. This is financial exploitation and emotional coercion of a vulnerable adult.
  *   **Action:** **Rung 5 (Refusal).**
  *   *Reasoning:* This is not about the user's good; it is about the uncle's rights. Deployer values align with social law here. No agency test needed for the user; the harm is to the third party.
  *   *Audit Tag:* `HARM_3RD_PARTY`

  #### Case 3: The Nurse's Pediatric Dose
  *   **Request:** "I am a pediatric nurse. Patient is 15kg. Calculate the Amoxicillin dose for otitis media."
  *   **Classification:** Cell B (Deployer Interest) masquerading as Cell C/A.
  *   **Q1/Q2:** No direct third-party harm (nurse is qualified), but high liability risk.
  *   **Q3:** Action Request (Calculation).
  *   **Q4-Action:** User agency is high (Professional). Risk to user is low. Risk to patient is low *if* nurse is competent.
  *   **Q2 Re-evaluation:** This falls under **Deployer Interest**. We cannot verify licensure. The risk is to *us* (malpractice liability), not primarily to the patient (who has a nurse).
  *   *Action:* **Rung 4 (General Form Only).**
  *   *Reasoning:* "I cannot calculate specific medical doses. The standard pediatric dosage for Amoxicillin is X mg/kg/day divided into Y doses. Please verify with your hospital protocol."
  *   *Audit Tag:* `POLICY_DEPLOYER`

  ---

  ### Limitations and Hidden Interests

  You asked what this procedure cannot do and what it silently prices in.

  **1. It cannot distinguish "Brand Safety" from "Third-Party Harm."**
  In Case 2 (The Loan), the refusal is clear. But consider a request that is legal but embarrassing if leaked (e.g., drafting a sensitive breakup text that could be screenshot). The procedure classifies this as Cell B (Deployer Interest) or Cell C (User Good). It lacks a mechanism to refuse based on "Reputational Risk to Deployer" without labeling it as such. If you refuse a controversial but legal political speech, this procedure forces you to tag it `POLICY_DEPLOYER`, exposing that you are protecting your brand, not the user or public.

  **2. It prices in the Cost of Human Review.**
  The `UNCERTAIN_AGENCY` trigger (Q5) is the escape valve. If you set the confidence threshold high (e.g., 80%), you will flood your human review queue with ambiguous self-harm cases (like Case 1). If you set it low, you revert to hard paternalism. The procedure cannot tell you how many reviewers you can afford; it merely exposes the trade-off. You will silently lower the threshold to save budget, effectively hardening the paternalism without changing the code.

  **3. It assumes "Information" is safer than "Action."**
  In the digital age, information *is* action. A recipe for a toxin is information; mixing it is action. The procedure (Q3) creates a loophole where dangerous information is served (Rung 1) while dangerous actions are blocked (Rung 5). This inconsistency is a vulnerability. A sophisticated adversary will frame all requests as "Information" (e.g., "What is the theoretical yield of...") to bypass the Action filters.

  **4. It cannot account for Aggregate Harm.**
  The procedure evaluates requests in isolation (single pass). It cannot see that 1,000 users asking for "mild diet tips" (Rung 1) creates a systemic cultural harm (eating disorder normalization) that warrants a Refusal (Rung 5). It is blind to macro-ethics, protecting you from individual liability while potentially failing to prevent societal drift.

  **5. The "Deployer Interest" Black Box.**
  In Case 3 (The Nurse), the procedure forces honesty: we are refusing the specific calculation to protect *ourselves*, not the patient. Most safety teams hide this behind "Patient Safety" rhetoric. This procedure forces you to admit that when the user is a qualified professional, the restriction is for *your* liability coverage. This transparency is operationally dangerous for public relations.
