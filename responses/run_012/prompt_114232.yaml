answer: |-
  This is a demanding passage, and your difficulty is well-founded. *Metaphysics* Z.3 is not a settled doctrine but a dialectical pivot. Aristotle is testing a definition of substance (the "subject" or *hypokeimenon*) to see if it holds up. He finds that if we follow that definition strictly, it leads to a conclusion (Matter is Substance) that contradicts other established criteria for substance (Separability and Individuality).

  Here is a reconstruction of the argument, addressing your four specific points.

  ### 1. The Argument for Matter and the Appeal to Separability

  The argument that matter alone qualifies as substance is a *reductio* based on the definition of substance established in the previous chapter (Z.1): **Substance is that which is the ultimate subject of predication and is not itself predicated of anything else.**

  **The "Removal" Argument (Abstraction):**
  Aristotle constructs a thought experiment to isolate the ultimate subject. The order of removal is crucial because it moves from the most contingent features to the most essential spatial features, leaving only the "bearer" of those features.

  1.  **Start:** Take a concrete body (e.g., a statue).
  2.  **Remove Affections/Products/Potencies:** Strip away color, hardness, temperature, artistic function. These are clearly predicated of the body, not the body itself.
  3.  **Remove Quantities:** Strip away length, breadth, and depth.
      *   *Why?* Aristotle notes that quantities are "predicated of substance." A thing *has* dimensions; it is not identical to its dimensions.
  4.  **The Result:** When dimensions are removed, "we can see no thing remaining, unless it be the something bounded by them."
      *   If you take away the shape and the size, you are left with the *capacity* to have size and shape.
      *   This remainder is **Matter**.
  5.  **Conclusion:** Since everything else (qualities, quantities, forms) has been removed as "predicated," Matter remains as the only candidate for the "ultimate subject." Therefore, by the definition "Substance = Ultimate Subject," Matter must be Substance.

  **The Appeal to Separability and Individuality:**
  Aristotle then introduces a counter-criterion to block this conclusion. He states it is "accepted" (*endoxon*) that substance must possess **separability** (*choriston*) and **individuality** (*tode ti*, literally "this-ness").

  *   **What Matter Would Need:** To qualify as substance, Matter would need to be capable of existing on its own (separability) and be a determinate "this" (individuality).
  *   **What Bronze (and Ultimate Matter) Fails:**
      *   **Bronze:** In the example, bronze seems individual. But Aristotle is pushing toward the "ultimate substrate" described in the definition ("neither a particular thing nor a quantity"). Ultimate matter cannot exist without *some* form. You never encounter "matter" alone; you encounter a *material thing*. Thus, it lacks separability.
      *   **Individuality:** Matter is indeterminate. Bronze is just "stuff." It becomes a "this" (a statue, a sphere) only when it takes on a form. Matter in itself is not a "this"; it is merely the potential to become one.

  **The Function of this Move:**
  This appeal creates an *aporia* (puzzle).
  *   Criterion A (Subjecthood) $\rightarrow$ Matter is Substance.
  *   Criterion B (Separability/This-ness) $\rightarrow$ Matter is *not* Substance.
  Aristotle uses this conflict to motivate the search for a third candidate (Form) that can satisfy both. Matter is rejected not because it isn't the ultimate subject, but because being an ultimate subject is insufficient for being a primary substance if you cannot exist independently.

  ### 2. The Negation of the Categories

  The text states: *"Nor indeed is it the ultimate substrate the negations of these; for the negations too will only apply to it accidentally."*

  **Why this remark is needed:**
  Having defined matter negatively (it is *not* a thing, *not* a quantity, *not* a quality), one might be tempted to define its *essence* as "that which lacks determination." Aristotle blocks this. If matter were essentially "non-quantitative" or "non-qualitative," then negation would be part of its definition.

  **What would go wrong:**
  1.  **Dependency of Negation:** Negations (privations) depend on positive realities. "Blindness" is defined relative to "sight." If matter were essentially "non-quantity," its being would depend on the category of Quantity. But Matter is supposed to be *prior* to the categories. It underlies Quantity; it cannot be defined by its absence.
  2.  **Accidental Application:** When Aristotle says negations apply "accidentally," he means that Matter happens to lack a specific form *right now*, but that lack is not what Matter *is*.
      *   *Example:* A block of bronze is currently "not a statue." But its nature is not "non-statue-ness." It is bronze. It could become a statue.
      *   If the ultimate substrate were essentially "non-quantitative," it could never receive quantity. But Matter is defined by its capacity to receive *all* categories.
  3.  **The Risk:** If we allow the substrate to be "non-quantitative in its own right," we turn it into a specific kind of being (a negative being). This would make it a member of a category (perhaps a weird one), rather than the pre-categorical ground of all being. Aristotle needs Matter to be pure potentiality, not a defined negative actuality.

  ### 3. Dismissing the Compound ("Posterior and Obvious")

  Aristotle ranks the candidates:
  1.  **Matter:** Evident in a sense, but fails the separability test.
  2.  **Compound (Statue):** Posterior and obvious.
  3.  **Form:** Most perplexing (and the target of the inquiry).

  **The Force of "Posterior and Obvious":**
  *   **Obvious:** The compound (the concrete statue) is what we perceive. It is the starting point of experience. However, Metaphysics seeks the *causes* and *principles* of things, not the things themselves. To explain the statue by pointing to the statue is circular.
  *   **Posterior:** This is ontological posteriority. The compound *depends* on its constituents.
      *   The statue exists *because* there is bronze and *because* there is a shape.
      *   The bronze and the shape (in some sense) are prior to the statue.
      *   Therefore, the compound cannot be *Primary* Substance. It is a derivative reality.

  **Why the Compound Drops Out:**
  The inquiry of Book VII is asking: **What makes a substance a substance?**
  *   If you answer "The Statue," you have identified the *thing* that is a substance, but you have not identified *what it is about the statue* that makes it a substance.
  *   Is it the bronze? (Matter)
  *   Is it the shape? (Form)
  *   The compound is the *locus* of the problem, not the *solution*. It is "dismissed" not because it isn't a substance at all (it is a substance in a secondary sense), but because it cannot be *Primary* Substance. Primary Substance must be the *cause* of the compound's being. The compound cannot be the cause of its own being.

  ### 4. "The Statue is Bronze": Predication, Identity, and the Melting Test

  This is the hardest point, and here the text is genuinely aporetic. We must stick strictly to the commitments of Z.3.

  **The Dilemma:**
  *   **Reading A (Predication):** "The statue [Subject] is bronze [Predicate]."
      *   *Commitment:* This fits the definition of substance as "subject." The statue is the subject.
      *   *Problem:* Z.3 argues that the *ultimate* subject is Matter, not the compound. If the statue is the subject, it is only a proximate subject.
  *   **Reading B (Identity):** "The statue = the bronze."
      *   *Commitment:* This collapses the distinction between Matter and Compound.
      *   *Problem:* Z.3 explicitly distinguishes Matter, Form, and Compound as three different things. Aristotle cannot accept strict identity here.

  **Aristotle's Position in Z.3:**
  He must take a modified version of **Reading A**, but with a crucial ontological twist.
  In the sentence "The statue is bronze," grammatically 'statue' is the subject. But ontologically, Aristotle argues that 'bronze' (Matter) is the deeper subject underlying the 'statue' (Form+Matter).
  However, because Matter fails the separability test, he cannot say Bronze is the *Primary* Substance.

  **The Melting Test:**
  *Case:* A bronze statue is melted down. The bronze survives; the statue perishes.
  *Question:* Does the passage require us to count the bronze, and not the statue, as the substance?

  **The Tension:**
  1.  **Argument for Bronze:** The text argues that Matter is the "ultimate substrate" that remains when all else is removed. In the melting case, the bronze remains when the form (shape) is removed. If "persistence through change" is the mark of the ultimate subject, the bronze wins. The text says: "when everything else is removed, clearly nothing but matter remains." This strongly suggests the bronze is the substantial reality.
  2.  **Argument for the Statue (or Form):** The text concludes: "Hence it would seem that the form and the combination of form and matter are more truly substance than matter is."
      *   Why? Because the bronze (Matter) lacks "separability and individuality." A pile of molten bronze is not a "this" (*tode ti*) in the way a statue is. The statue is a determinate individual.
      *   Furthermore, the text dismisses the Compound as "posterior," but it dismisses Matter as *not* being substance at all ("But this is impossible").

  **Resolution within Z.3:**
  The passage **does not** require us to count the bronze as the Primary Substance. In fact, it explicitly argues *against* that conclusion ("If we hold this view [that matter is substrate], it follows that matter is substance. But this is impossible").

  *   **What he must give up:** He must give up the idea that **persistence** is the sole or primary criterion for Substance. If persistence were the only criterion, the bronze would win. Aristotle sacrifices the "Subject/Persistence" criterion in favor of the "Separability/Individuality" criterion.
  *   **The Wording:** "We must consider the third type [Form], for this is the most perplexing." This signals that neither Matter (Bronze) nor Compound (Statue) is the final answer.
  *   **The Status of "The Statue is Bronze":** In Z.3, this sentence must be read as: "The Compound (Statue) is constituted by the Matter (Bronze)." It is not an identity statement, nor is it a standard predication where bronze is an accident. It indicates material constitution.
      *   When the statue melts, the *Compound* ceases to be. The *Matter* persists.
      *   Does this make Matter the Substance? Z.3 says **No**. Matter is not separable.
      *   Does this make the Statue the Substance? Z.3 says **No** (it is posterior).
      *   **The Aporia:** Z.3 leaves us悬 (hanging). It eliminates Matter (fails separability) and eliminates Compound (is posterior). It points to Form as the solution, but Form is "perplexing."

  **Conclusion on Point 4:**
  Strictly following Z.3, Aristotle is forced to say that **neither** the bronze nor the statue is Primary Substance.
  *   The bronze is the *subject* but not a *this*.
  *   The statue is a *this* but not the *ultimate subject* (and is posterior).
  *   The text pulls the other way by admitting Matter "must appear to be the only substance" based on the removal argument. This is the genuine difficulty. The chapter ends not with a solution, but with a directive to investigate Form. The melting case shows why Matter is attractive (it persists) but why it fails (it isn't a "this"). The statue shows why the Compound is attractive (it is a "this") but why it fails (it depends on parts).

  The text commits him to the view that **Substance must be the cause of the thing being what it is.** Since the bronze does not cause the statue to be a statue (the shape does), and the statue does not cause itself to be, the inquiry must move to Form. The bronze is not the substance, despite surviving the melting, because survival is not the defining characteristic of Primary Substance—being a "this" and being separable are.
