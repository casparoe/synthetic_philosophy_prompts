answer: |-
  This is a profound methodological stalemate, one that strikes at the heart of what historical inquiry is permitted to claim. As a philosopher of history with feet in the mud of the Aegean, the tells of the Levant, and the manuscripts of Britain, I recognize the texture of this impasse. It is not merely a disagreement about facts; it is a collision of disciplinary epistemologies.

  Here is my analysis, structured according to your four requests.

  ### I. Reconstruction of Positions

  To diagnose the disagreement, we must first steel-man the positions. Each member of your group is operating within a rational framework defined by their source material and disciplinary norms.

  **1. The Aegean Prehistorians (The Troy Position)**
  *   **The Evidence:** They rely on a convergence of independent data streams. There is the material stratigraphy of Hisarlik (specifically the destruction layers of Troy VIh and VIIa), which shows violent ends consistent with warfare. There is the textual corroboration from Hattusa (Hittite archives), which mentions *Wilusa* (Ilios/Troy) and *Ahhiyawa* (Achaeans) in a geopolitical context of conflict and treaty.
  *   **The Claim:** "The Trojan War happened."
  *   **The Meaning:** They are claiming that a state-level conflict occurred in the Late Bronze Age between a coalition of Mycenaean polities and a polity in northwestern Anatolia. They readily concede that Helen, Achilles, and the ten-year duration are poetic elaborations. For them, history is the *res gestae* (the thing done). If the destruction and the political antagonism are real, the war is historical. The *Iliad* is a source for the *memory* of the war, but the war itself is secured by archaeology and Hittite text.
  *   **The Standard:** Probabilistic convergence. No single source proves it, but the overlap of material and textual data makes the null hypothesis (that no conflict occurred) less plausible than the positive one.

  **2. The Hebrew Bible Scholar (The Exodus Position)**
  *   **The Evidence:** They look at the text as a unified literary product of the first millennium BCE, not a transcript of the second millennium. They note the silence of the Egyptian New Kingdom records regarding the loss of a slave population or a military disaster in the Sinai. They note the archaeological consensus that there was no mass material culture intrusion into the Southern Levant consistent with a wandering multitude in the Late Bronze Age.
  *   **The Claim:** "The Exodus is not history."
  *   **The Meaning:** They are arguing that the text is a *foundation myth*, designed to forge a theological and ethnic identity, not to record demographics. To ask if it "happened" is to misunderstand the genre. Even if a small group of Semites left Egypt (a minimal event), calling that "The Exodus" appropriates a narrative weight the evidence cannot bear.
  *   **The Standard:** Direct corroboration for specific claims. Because the text makes specific claims (numbers, miracles, route) that are contradicted or unsupported by external data, the narrative cannot be treated as history. The "kernel" is so small it is historically insignificant.

  **3. The Medievalist (The Arthur Position)**
  *   **The Evidence:** They face a "dark age" of documentation. The potential historical Arthur (if he existed) operates in the 5th or 6th century. The earliest texts naming him (e.g., *Historia Brittonum*) appear in the 9th century, and the elaborated romance tradition (Geoffrey of Monmouth, Chrétien de Troyes) in the 12th. There are no contemporary inscriptions, letters, or chronicles that name an *Arthurus* as a king or commander.
  *   **The Claim:** "Arthur is a literary construct."
  *   **The Meaning:** They argue that "Arthur" is a name attached to a composite of folk motifs and perhaps vague memories of post-Roman resistance. To ask if Arthur existed is like asking if Sherlock Holmes had an address; the character exists within the logic of the narrative, not the logic of the census.
  *   **The Standard:** Contemporary attestation for individual agency. In the absence of contemporary evidence, the burden of proof lies on the historicist. The gap between the *event horizon* (500 CE) and the *textual horizon* (900+ CE) is too wide to bridge with confidence.

  **4. The Philosophers**
  *   **The Observation:** They notice that "becomes history" is a predicate that shifts meaning. Sometimes it means "ontologically occurred" (realism). Sometimes it means "is justifiably believed to have occurred" (epistemology). Sometimes it means "functions as history within a culture" (sociology).
  *   **The Claim:** "The question is ill-defined."
  *   **The Meaning:** Until the group agrees on the truth-conditions for the sentence "X is history," they are talking past one another.

  ### II. Diagnosis of the Disagreement

  I have considered three possible diagnoses before settling on the one I believe is correct.

  *   *Diagnosis 1: A Clash of Evidentiary Standards.* One might argue the Aegean scholars are simply more optimistic about circumstantial evidence than the Biblical scholar or Medievalist. The Aegean accepts stratigraphy + Hittite hints; the others demand direct textual confirmation.
      *   *Critique:* This is partially true but insufficient. The Biblical scholar would accept the Hittite evidence if it existed for Exodus. The issue isn't just the *amount* of evidence, but how the evidence relates to the *claim*.
  *   *Diagnosis 2: A Verbal Disagreement.* The philosophers might be right that this is purely semantic. If we define "history" as "anything that happened," then Troy, Arthur, and Exodus all have candidates. If we define it as "what we can know with certainty," none qualify.
      *   *Critique:* This is too dismissive. The stakes are real. Funding, museum displays, and cultural identity depend on these classifications. It is not *merely* verbal.
  *   *Diagnosis 3: A Dispute over Reference and Identity Conditions.* This is the strongest diagnosis. The disagreement is about **what constitutes the identity of the event.**
      *   The Aegean prehistorian believes the *event* can be abstracted from the *story*. The War is the referent; the *Iliad* is the sense. You can change the sense (remove Achilles) and keep the referent (the destruction of Troy VIh).
      *   The Biblical scholar and Medievalist argue that for certain types of claims, the *story* constitutes the *event*. If you remove the miracles and the scale from the Exodus, is it still the Exodus? If you remove the kingship and the specific deeds from Arthur, is it still Arthur? They argue that stripping the narrative away does not reveal the "historical core"; it destroys the object of inquiry.

  **Verdict:** The impasse is a **clash over identity conditions**. The Aegean side treats historical events as *natural kinds* (like earthquakes) that can be detected by their traces regardless of how they are described. The Biblical and Medieval sides treat these specific legends as *social kinds* (like marriages or trials), where the description is constitutive of the event itself. You cannot have a "marriage" without the vows; similarly, they argue, you cannot have "The Exodus" without the theological liberation, nor "Arthur" without the kingly attribution.

  ### III. Testing Your Hypothesis

  Your hypothesis is that the impasse is not about evidence, but about **what a historical claim is a claim about**: a minimally specified event vs. a specific narrated episode.

  **Does it survive scrutiny?**
  Yes, robustly. In fact, it explains why the three cases feel different to your group.

  1.  **Troy:** The hypothesis fits perfectly. The Aegean scholars are successfully arguing for the "minimally specified event" (a conflict over a strategic site). Because the material evidence (burnt city) exists independently of the *Iliad*, they can sever the event from the narrative. The "minimum viable event" here is thick enough to be interesting (a major geopolitical conflict).
  2.  **Exodus:** The hypothesis explains the Biblical scholar's resistance. For them, the "minimally specified event" (some Semites moved from Egypt to Canaan) is so thin it is historically trivial and does not match the *claim* being made by the text or the believers. The claim "The Exodus happened" implies a foundational national liberation. If the event is reduced to "small groups migrated over centuries," the claim "The Exodus happened" becomes false, even if "Migration happened" is true. The *narrated episode* is the only thing worth calling "Exodus."
  3.  **Arthur:** The hypothesis explains the Medievalist's skepticism. The "minimally specified event" is "a war leader named Arthur (or Artos) fought Saxons." But the evidence for the *name* is late. The Medievalist argues that without contemporary evidence for the *name*, the minimal event cannot be linked to the *narrated episode*. The "Arthur" of the narrative is a king; the "Arthur" of the minimal event might be a generic title (*artos* = bear). The link between the minimal event and the narrated episode is broken.

  **Conclusion on Hypothesis:** Your hypothesis is correct. The group is arguing over **referential integrity**. The Aegean scholars believe the referent (the war) survives the loss of descriptive details (the gods, the duel). The others believe that for Exodus and Arthur, the descriptive details *are* the referent.

  ### IV. Evaluation of the Two Devices

  Your colleague has proposed two tools to resolve this. Here is my assessment of their utility.

  **(a) The "Minimum Viable Event" (MVE) Test**
  *   *The Proposal:* A legend is history when a description exists that is compatible with all sources and still worth asserting.
  *   *Critique:* This device is heuristically useful but ontologically dangerous.
      *   *Utility:* It forces the Aegean scholars to admit that "The Trojan War" might just be "A conflict at Hisarlik." It forces the Arthurians to admit "Arthur" might just be "A resistance leader."
      *   *Failure:* The phrase "worth asserting" is subjective. To a nationalist, a tiny migration is "worth asserting" as the Exodus. To a demographer, it is noise. Furthermore, this test assumes that the "thinner" event is the *same* event. As noted in the diagnosis, if the identity of the event is tied to its narrative weight (e.g., a miraculous liberation), the MVE is not the Exodus; it is a different event entirely.
      *   *Verdict:* It clarifies the *evidence*, but it does not solve the *identity* problem. It risks creating "zombie events"—historically verifiable occurrences that bear no meaningful relationship to the cultural legend.

  **(b) Historical vs. Recoverable**
  *   *The Proposal:* Distinguish between an event occurring (ontological) and historians being able to know it (epistemological).
  *   *Critique:* This is philosophically sound but practically sterile for your working group.
      *   *Utility:* It allows the philosophers to say, "Arthur might have existed (historical), but we can never know (recoverable)." This satisfies the realist and the skeptic simultaneously.
      *   *Failure:* It removes the stake from the historical enterprise. Historians do not traffic in unknowable truths. If an event is not recoverable by historical methods, it is, for the discipline of history, non-existent. This distinction saves the *possibility* of history but abandons the *practice* of it. It tells the Aegean scholars they are lucky to have evidence, and the others they are unlucky, but it doesn't help them agree on the status of the legends.
      *   *Verdict:* This solves the philosophical puzzle but dissolves the historical one. It is a retreat, not a resolution.

  ### V. Ill-Posed Cases and Differences in Kind

  You asked if any case is genuinely ill-posed and if the three differ in kind.

  **1. Is any case ill-posed?**
  The **Exodus** question ("Did the Exodus happen?") is the strongest candidate for being ill-posed.
  *   *Reasoning:* The Exodus is defined by its theological function. It is not merely a migration; it is an act of divine intervention establishing a covenant. Historical methodology operates under methodological naturalism. It cannot test for divine intervention. Therefore, asking if the *Exodus* (as defined by the text) happened is asking history to verify a theological claim.
  *   *Nuance:* If the question is rephrased as "Did a group of Semitic origin leave Egypt in the Late Bronze Age?", it becomes well-posed but likely yields a negative or trivial result. The "Exodus" as a cultural concept cannot be fully mapped onto a historical event without residue.

  **2. Do the three differ in kind?**
  Yes, they differ along the dimension of **Event Type**.
  *   **Troy is an Event (War):** Wars leave destruction layers. They involve state actors who write treaties (Hittites). They are materially dense.
  *   **Exodus is a Process (Migration/Formation):** Migrations of non-state actors leave little material trace, especially in nomadic contexts. They are defined by the *absence* of settlement.
  *   **Arthur is an Agent (Person):** Individuals are the hardest to verify without contemporary written records. A person can exist without leaving a destruction layer or a treaty.

  *The Unnamed Dimension:* **The Density of External Corroboration.**
  *   Troy has *external* contemporary corroboration (Hittite texts) that is independent of the legend.
  *   Exodus has *external* contemporary silence (Egyptian records) and *internal* late text.
  *   Arthur has *external* contemporary silence (Gildas doesn't name him) and *internal* late text.
  *   *Significance:* Troy is the only case where the legend is anchored by a contemporary *third party*. This makes the Aegean position structurally different, not just optimistically different.

  ### VI. Conclusion: What Counts as Progress?

  You asked for my best account of what would count as progress. I do not believe new evidence is the answer. We are unlikely to find an Egyptian logbook of the Exodus or a 6th-century letter from Arthur. The impasse is conceptual.

  **Progress requires a Change of Question and a Distinction.**

  **1. The Distinction: Historicity of the Referent vs. Historicity of the Narrative.**
  The group must stop asking "Did it happen?" and start asking: **"What is the relationship between the historical trace and the narrative function?"**
  *   For Troy, the relationship is *loose*. The narrative embellishes a real conflict.
  *   For Exodus, the relationship is *constitutive*. The narrative creates the event's meaning; the historical trace (if any) is incidental.
  *   For Arthur, the relationship is *opaque*. We cannot map the narrative to the trace at all.

  **2. The Change of Question:**
  Stop asking "When does a legend become history?" This implies a transformation, as if the legend sheds its mythical skin to reveal a historical body underneath.
  Instead, ask: **"How does this legend utilize history?"**
  *   The *Iliad* utilizes a historical war to explore heroism.
  *   The Exodus narrative utilizes a memory of migration (or a purely theological construct) to explore identity.
  *   The Arthurian cycle utilizes the vacuum of the Dark Ages to explore kingship.

  **Final Verdict:**
  Your hypothesis is correct: the group is disagreeing about what a historical claim is about. The Aegean scholars claim the *referent* (the war) is robust enough to survive the loss of the *sense* (the poem). The Biblical scholar and Medievalist claim that for their cases, the *sense* is so specific that removing it destroys the *referent*.

  Progress will not come from finding more sherds or texts. It will come from agreeing that **"History" is not a binary state that a legend enters.** It is a spectrum of correlation between *trace* and *story*.
  *   Troy is high correlation (Trace + Story).
  *   Exodus is low correlation (Trace - / Story +).
  *   Arthur is null correlation (Trace - / Story +).

  The only way forward is to admit that the question "Did it happen?" is a proxy for **"How much authority do we grant this narrative to structure our understanding of the past?"** The Aegean scholars grant the *Iliad* authority to point to a site. The Biblical scholar denies the Exodus narrative authority to describe demographics. The Medievalist denies Arthur authority to describe political structures.

  If you can shift the group's goal from **Verification** (Did it happen?) to **Calibration** (How much of this narrative can be mapped onto the material record?), the impasse will dissolve. You will not agree on the answer, but you will finally agree on the question.
