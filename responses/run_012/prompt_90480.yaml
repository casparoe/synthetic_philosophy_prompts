      *   *Immoralism (Kieran):* Handles Case 2 well, but risks collapsing morality into aesthetics or making immorality a *virtue* too easily.
      *   *Interactionism/Two-Aspect:* Best bet for handling the tensions, but needs to be careful not to be vague.

  6.  **Review against Constraints:**
      *   Did I use the invented cases? Yes.
