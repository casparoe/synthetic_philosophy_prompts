          *   Must address the relation to the artist's moral standing.
          *   Must *not* presuppose separation (autonomism) or collapse (extreme moralism).
          *   Must preserve specific distinctions (maker vs. made, endorsement vs. depiction, incidental vs. constitutive defects, ethical vs. cognitive/emotional value, *pro tanto* vs. overall value).
          *   Must flag tensions/incompatibilities between desiderata.
          *   Must use the provided invented cases to discipline the desiderata.
          *   Must evaluate familiar views (autonomism, ethicism, immoralism, interactionism) against the desiderata *after* the list.
          *   Format: List of desiderata with motivations, marking non-negotiable vs. optional, followed by a brief evaluation of views.
      *   **Tone:** Philosophical, precise, suitable for a graduate reading group.

  2.  **Deconstruct the Invented Cases (to derive desiderata):**
      *   *Case 1 (Humiliating Composer):* Formal beauty, bad motive, motive not audible. -> Distinguishes artist morality from work morality. Distinguishes causal history from internal properties.
      *   *Case 2 (Repugnant Novel):* Exquisite prose, invites relishing humiliation, inseparable from aesthetic power. -> Tests the "merited response" argument. Tests constitutive vs. incidental defects.
      *   *Case 3 (Betraying Memoir):* Betrays real people, ethical reckoning makes it valuable. -> Tests moral merit counting *for* artistic value. Distinguishes real-world harm from textual value.
      *   *Case 4 (Admirable but Inert / Repellent but Transformative):* -> Tests the correlation (or lack thereof) between moral and aesthetic value. Tests *pro tanto* vs. all-things-considered judgment.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Distinction 1: Maker vs. Made.* Case 1 shows we need to separate the artist's intent from the work's properties.
          *   *Desideratum:* The Theory must distinguish the moral character of the *agent* from the moral character of the *artifact*.
          *   *Status:* Non-negotiable. (Standard analytic distinction).

      *   *Distinction 2: Depiction vs. Endorsement.* Case 2 shows a work can depict bad things without endorsing them, or invite bad responses.
          *   *Desideratum:* The Theory must distinguish between what a work *represents* and what it *prescribes* (invites/endorses).
          *   *Status:* Non-negotiable. (Crucial for avoiding censorship of tragedy/horror).

      *   *Distinction 3: Incidental vs. Constitutive.* Case 2 says the invitation is "inseparable." Case 1 says the cruelty is "not audible."
          *   *Desideratum:* The Theory must distinguish moral defects that are *aesthetically relevant* (constitutive) from those that are *extrinsic* (incidental).
          *   *Status:* Non-negotiable. (Otherwise, any sin of the artist ruins the art).

      *   *Distinction 4: Pro Tanto vs. Overall.* Case 4 shows a work can be morally good but aesthetically bad, and vice versa. We need to weigh them.
          *   *Desideratum:* The Theory must distinguish *pro tanto* artistic value (value in a specific respect) from *all-things-considered* artistic value.
          *   *Status:* Non-negotiable. (Allows for trade-offs).

      *   *Distinction 5: Ethical vs. Cognitive/Emotional.* Case 3 mentions "ethical reckoning." Case 2 mentions "aesthetic power."
          *   *Desideratum:* The Theory must account for how ethical value interacts with cognitive and emotional engagement without reducing one to the other.
          *   *Status:* Non-negotiable. (Avoids reductionism).

      *   *The "Counting" Requirement:* The prompt asks when defects count against and merits count for.
          *   *Desideratum:* The Theory must provide a principle of *valence transfer* (when does moral value become aesthetic value?).
          *   *Status:* Non-negotiable (This is the core question).

      *   *The Tension:* Here's the hard part. Can we satisfy the "Constitutive Defect" requirement (Case 2: repugnant vision inseparable from power) *and* the "Valence Transfer" requirement (Ethical defect counts against aesthetic value)? If the defect *makes* it powerful, does it count against or for? This is the "Immoralism" vs. "Ethicism" clash.
          *   *Flag:* Tension between "Moral Defects Diminish Value" and "Aesthetic Success via Moral Defect."

  4.  **Refining the Desiderata List:**
      *   Make them formal.
