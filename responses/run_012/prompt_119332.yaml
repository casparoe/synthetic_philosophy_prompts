      *   **The Fix:** Keep (1) and (2) as theoretical benchmarks, but reject (3) as a universal normative claim. The transition matters.
      *   **Implications for (4) and (6):** (4) is true in the long run but false in the short run. (6) is mostly Humean, but needs nuance regarding the transition.
      *   **Bank Failures:** This involves credit/confidence, not just specie count. Hume distinguishes between money and credit.
