          *   Address the bank failure issue: Money evaporating isn't the same as money doubling because of confidence/credit effects (Hume touches on paper credit).
          *   Address the trade balance: Hume's mechanism (5) is robust, but (6) might be too strong if one considers infant industries or strategic reasons (though Hume would likely stick to (6)).
