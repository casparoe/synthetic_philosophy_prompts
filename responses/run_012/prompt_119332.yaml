      *   *Hume's Text:* In "Of Money," Hume says, "It is only since the discovery of the mines in America that industry has increased in all the nations of Europe... It is easy to trace the money in its progress through the whole commonwealth." He describes the lag.
      *   *Bank Failures:* Hume discusses paper credit in "Of Paper Money." He is skeptical of it. A collapse of credit is a collapse of the *velocity* or effective money supply, which causes a shock because prices are sticky downwards.
      *   *Distribution:* The user mentions government contractors getting money first. This is the Cantillon Effect. Hume hints at this when he talks about money spreading from the hands of those who receive it first.
      *   *Decision:* The cheapest premise to abandon is the universal applicability of (3). (2) is logically valid as a thought experiment, but (3) treats it as a policy guide for non-ideal conditions.

  5.  **Drafting the Content (incorporating into continuous prose):**
