          4.  Conclusion 1: Quantity of money is indifferent (nation not richer for gold).
          5.  Extension to Trade: Imbalances self-correct via price-specie flow mechanism.
          6.  Conclusion 2: Trade policies (tariffs, etc.) are useless/harmful.
