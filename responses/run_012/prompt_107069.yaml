  2.  **Analyze the Exam Question:**
      *   **Part 1:** Explain the central claim of higher-order theories.
      *   **Part 2:** How do HOT and HOP versions differ?
      *   **Part 3:** Who are the main proponents of each?
      *   **Part 4:** What is the main motivation for the view?
