      *(Self-Correction during drafting)*: Wait, let me double-check Armstrong. Armstrong (1968) "A Materialist Theory of the Mind" proposes a "scanner" mechanism, which is widely interpreted as a Higher-Order Perception (Inner Sense) view. Rosenthal explicitly distinguishes his HOT view from Armstrong's Inner Sense view. So the student definitely has them backward.
