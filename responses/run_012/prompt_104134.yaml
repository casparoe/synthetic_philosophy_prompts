prompt: |-
  Our corporate strategy group periodically receives game-theoretic models — small payoff matrices for a handful of players and strategies — from the internal economics team, and has to turn each one into a recommendation on a live decision: a pricing move, an entry threat, a bid. The analyst who runs these models knows basic game theory but has no background in linear programming, has roughly a day per model, and must produce a one-page note that the head of strategy signs off on. What we lack is a procedure we can apply the same way every time.

  Write that procedure. I want a decision procedure for reducing a finite game by iterated elimination of dominated strategies, including domination by mixed strategies, that a careful non-specialist can run in order, with an explicit stopping rule and explicit points at which the procedure hands the decision back to a person. Keep what the theory actually says — do not water it down into advice — and be honest about what the procedure cannot do.

  It should, at a minimum:

  - begin by fixing the game and, before anything else, the scale of the payoffs: whether the numbers are magnitudes that can be averaged (so that the expected payoffs of mixtures can be compared) or only a ranking of outcomes. If only a ranking, the procedure must stop short of the mixed-strategy step and explain why.
  - screen for strategies strictly dominated by a pure strategy, eliminate them, and record why this step is safe (it never deletes a strategy used in a Nash equilibrium) and why the order of elimination does not change what survives.
  - give an operational test for domination by a mixture, since the analyst cannot solve an optimization. State the criterion underneath it — a strategy is strictly dominated by some mixture exactly when it is never a best response to any belief about the opponents — and then give a search a person can actually carry out: which mixtures to try, how to recognize quickly that a candidate survives, and when to stop looking.
  - say when to iterate and when to halt, and what the surviving set licenses. A single surviving profile is a prediction; a surviving set is not, and the procedure must say so rather than paper over it.
  - forbid, or fence off sharply, the iterative use of weak dominance, stating the cost: it is order-dependent and can delete a Nash equilibrium.
  - flag the point at which the answer depends on whether the opponents' choices are treated as independent or allowed to be correlated — a distinction that bites in games with three or more players — and state which assumption the procedure makes and how the note should disclose it.
  - mark every step that is a judgment call dressed up as procedure.

  Then run it on two models. The first is this three-by-three game (player 1 chooses the row, player 2 the column; each cell gives player 1's payoff, then player 2's):

              L          C          R
    T       (4, 3)     (3, 0)     (1, 0)
    M       (2, 0)     (2, 3)     (2, 0)
    B       (1, 0)     (3, 0)     (4, 3)

  The second is a game in which the only candidate for elimination is weakly dominated and yet belongs to a Nash equilibrium, so that the procedure must decline to eliminate it; construct a small example and run it. For at least one of the two, the procedure will reach an answer the group does not want; state plainly what that answer is and why the group should accept it anyway.

  Close with a short section on the procedure's blind spots: the cases it will get wrong, the inputs it cannot repair, and the decisions that must go back to a human.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Goal:** Create a standardized decision procedure for reducing finite games via Iterated Elimination of Dominated Strategies (IEDS), specifically including mixed strategy domination.
      *   **Target Audience:** Corporate strategy analysts (know basic game theory, no LP background, ~1 day per model, need a one-page note).
      *   **Constraints:**
          *   Must be rigorous (keep what theory says, don't water it down).
          *   Must be honest about limitations (what it can't do).
          *   Must have explicit stopping rules and hand-off points to humans.
          *   Must address payoff scales (cardinal vs. ordinal).
          *   Must distinguish strict vs. weak dominance (forbid/flag weak dominance iteration).
          *   Must address correlation assumptions (independent vs. correlated beliefs).
          *   Must identify judgment calls disguised as procedure.
          *   Must apply the procedure to two specific examples (one provided $3 \times 3$, one constructed).
          *   Must address unwanted outcomes honestly.
          *   Must conclude with blind spots.

  2.  **Drafting the Procedure (The "Protocol"):**

      *   *Step 1: Payoff Scale Verification.* Crucial first step. Mixed strategies require expected utility, which requires cardinal payoffs (von Neumann-Morgenstern utility). If payoffs are just rankings (ordinal), mixed domination is invalid.
      *   *Step 2: Strict Dominance by Pure Strategies.* This is the easiest check. $s_i$ is strictly dominated by $s'_i$ if $u_i(s'_i, s_{-i}) > u_i(s_i, s_{-i})$ for all $s_{-i}$. Order doesn't matter. Safe (preserves NE).
      *   *Step 3: Strict Dominance by Mixed Strategies.* This is the hard part for non-LP users.
          *   *Theory:* A strategy is strictly dominated by a mixture iff it is *never a best response* to any belief (probability distribution) over opponents' strategies.
          *   *Operational Test:* Since they can't solve LP, they need a heuristic or a geometric check. For $2 \times N$ or $N \times 2$, plotting best response regions works. For general $N$, without LP, it's hard. However, the prompt asks for an *operational test* a person can carry out.
          *   *Workaround:* Check against extreme beliefs (pure strategies of opponents) and simple mixtures (50/50). If it's a best response to *any* belief, it survives. If it's never a best response to pure strategies *or* simple mixtures, it's likely dominated. *Correction:* To be rigorous without LP, I need to state the limitation. The prompt asks for a search a person can carry out. I will suggest checking best responses against all pure strategy profiles of opponents. If a strategy is never a best response to any *pure* profile of opponents, it *might* still be a best response to a *mixed* profile. However, for $2 \times 2$ subgames, checking the endpoints is usually enough.
          *   *Refinement:* The prompt specifically asks for the criterion: "never a best response to any belief." I need to give a way to check this without simplex method. For small matrices, checking if the strategy is a best response to *each* opponent pure strategy is necessary but not sufficient. Checking against mixtures of opponent strategies is the key.
          *   *Practical heuristic:* For a strategy $s_i$, check if there exists a probability distribution $p$ over opponent strategies such that $E[u(s_i, p)] \ge E[u(s'_i, p)]$ for all other $s'_i$. Without LP, the analyst should check "corner" beliefs (opponents play pure) and "midpoint" beliefs. If it fails all, flag for removal. *Wait, strict requirement:* "State the criterion underneath it... and then give a search a person can actually carry out."
          *   *Decision:* I will instruct them to check if the strategy is a Best Response (BR) to any pure strategy combination of opponents. If it is, it survives. If it is *not* a BR to any pure combination, they must check simple mixtures (e.g., 50/50 between two opponent strategies). If it is never a BR to any tested belief, it is eliminated. I must explicitly state this is a *sufficient* condition for survival, but failing it without LP is a judgment call unless the game is $2 \times 2$. Actually, the theorem is: Strictly dominated $\iff$ Never a Best Response. So if they can find *one* belief where it is a BR, it is *not* strictly dominated. If they cannot find one, it *is* dominated. Without LP, they can't prove the negative. I must be honest: "If you cannot find a belief where it is a best response after checking pure and 50/50 mixes, treat it as dominated, but note the uncertainty."
          *   *Better approach for the prompt:* The prompt asks for a procedure that *works*. I will limit the mixed strategy check to cases where the analyst can verify domination by constructing a specific mixture that beats the target strategy in all columns/rows. This is the definition of domination ($ \sum \alpha_k u(s_k, s_{-i}) > u(s_{target}, s_{-i}) $). The analyst tries to find weights $\alpha$.
          *   *Revised Plan for Step 3:* Try to construct a mixture of *other* strategies that beats the target strategy in every column. Start with 50/50 mixes of the two strongest alternatives. If that beats the target everywhere, eliminate.
      *   *Step 4: Iteration.* Repeat Steps 2 & 3. Order doesn't matter for strict dominance.
      *   *Step 5: Weak Dominance.* FORBID iteration. One-off check only, with heavy warnings.
      *   *Step 6: Correlation.* In $3+$ player games, beliefs about opponents can be correlated. Standard IEDS assumes independent beliefs (product distributions). If correlation is possible (coalitions, signals), the "Never a Best Response" set shrinks. The procedure must assume independence unless told otherwise.
      *   *Step 7: Stopping & Reporting.* If 1 profile left $\to$ Prediction. If $>1$ profile $\to$ Set of rationalizable outcomes (not a prediction). Hand off to human for selection.
      *   *Step 8: Judgment Calls.* Mark them explicitly.

  3.  **Applying to Model 1 (The $3 \times 3$ Game):**

      *   Payoffs:
          *   P1: T(4,3,1), M(2,2,2), B(1,3,4)
          *   P2: L(3,0,0), C(0,3,0), R(0,0,3)
      *   *Analysis:*
          *   P2: L gives 3 if T, 0 if M, 0 if B. C gives 0, 3, 0. R gives 0, 0, 3. No pure strategy dominates another for P2.
          *   P1: T(4,3,1), M(2,2,2), B(1,3,4).
              *   Does M dominate anything? No.
              *   Does T dominate B? No (1 vs 4 in R).
              *   Does B dominate T? No (1 vs 4 in L).
              *   Mixed check for P1: Is M dominated?
                  *   Mix T and B. Let $p$ be prob of T.
                  *   Against L: $4p + 1(1-p) = 3p + 1$. Need $> 2$. $3p > 1 \to p > 1/3$.
                  *   Against C: $3p + 3(1-p) = 3$. Need $> 2$. Always true.
                  *   Against R: $1p + 4(1-p) = 4 - 3p$. Need $> 2$. $2 > 3p \to p < 2/3$.
                  *   So if P1 plays T with $p \in (1/3, 2/3)$, this mixture strictly dominates M (payoff 2, 2, 2).
                  *   Eliminate M.
          *   Reduced Game (T, B) vs (L, C, R).
          *   P2 Payoffs in reduced game:
              *   If T: L(3), C(0), R(0).
              *   If B: L(0), C(0), R(3).
              *   Does any strategy dominate?
              *   Consider C. Payoffs are 0 against T, 0 against B.
              *   Consider Mix of L and R. Let $q$ be prob of L.
              *   Against T: $3q + 0(1-q) = 3q$. Need $> 0$. True if $q>0$.
              *   Against B: $0q + 3(1-q) = 3 - 3q$. Need $> 0$. True if $q<1$.
              *   So any mix of L and R (with $0 < q < 1$) strictly dominates C (which yields 0 always).
              *   Eliminate C.
          *   Reduced Game (T, B) vs (L, R).
          *   P1: T(4, 1), B(1, 4). No dominance.
          *   P2: L(3, 0), R(0, 3). No dominance.
          *   Result: $2 \times 2$ cycle (Battle of the Sexes / Matching Pennies hybrid).
          *   Surviving strategies: {T, B} for P1, {L, R} for P2.
          *   Outcome: No unique prediction. Rationalizable set is {(T,L), (T,R), (B,L), (B,R)}. Note: (T,L) and (B,R) are Pure NE. (T,R) and (B,L) are not. IEDS doesn't eliminate non-NE rationalizable strategies necessarily, but here we just have the $2 \times 2$.
          *   Wait, check P2 again. In the original game, P2 gets 3 for matching (T,L), (M,C), (B,R).
          *   After eliminating M (P1) and C (P2):
              *   P1 chooses T or B. P2 chooses L or R.
              *   P1 prefers T if L, B if R.
              *   P2 prefers L if T, R if B.
              *   This is a Coordination Game structure. Two Pure NE: (T,L) and (B,R).
          *   Procedure Output: Surviving set {(T,L), (B,R)} (plus the off-equilibrium combos if we just list strategies). The procedure must state it cannot distinguish between the two equilibria.
          *   "Unwanted Answer": The strategy group might want a single recommendation (e.g., "Play T"). The procedure says "T or B".

  4.  **Applying to Model 2 (Weak Dominance Trap):**

      *   Need a game where a weakly dominated strategy is part of a NE.
      *   Classic example:
          *   P1: U, D. P2: L, R.
          *   U: (1, 1), (0, 0)
          *   D: (1, 0), (0, 1)
          *   Here D weakly dominates U for P1? No.
          *   Let's try:
          *   P1: T, B. P2: L, R.
          *   T: (2, 1), (0, 0)
          *   B: (2, 0), (1, 1)
          *   For P1: T gives 2 or 0. B gives 2 or 1. B weakly dominates T (2>=2, 1>0).
          *   If we eliminate T, P2 plays R (1>0). Outcome (B,R).
          *   But (T,L) is a NE? P1 gets 2 (deviating to B gets 2). P2 gets 1 (deviating to R gets 0). Yes, (T,L) is a NE.
          *   So eliminating weakly dominated strategy T deletes the NE (T,L).
      *   Procedure must forbid eliminating T.
      *   Result: Surviving set {T, B} x {L, R}. No reduction.

  5.  **Refining the "Mixed Strategy Operational Test":**

      *   The prompt asks for an operational test for a non-LP analyst.
      *   Theory: $s_i$ is strictly dominated iff it is never a best response.
      *   Test: Can I find a belief $\sigma_{-i}$ where $s_i$ is a best response?
      *   If Yes $\to$ Keep.
      *   If No $\to$ Eliminate.
      *   How to search without LP?
      *   Instruction: "Check if $s_i$ is a best response to each of the opponent's *pure* strategies. If yes to any, STOP (Keep). If no to all, check simple mixtures (e.g., 50/50 between two opponent strategies). If $s_i$ is not a best response to any pure strategy or simple mixture, it is *likely* dominated. To confirm domination without LP, try to construct a mixture of your *own* other strategies that yields higher payoff against every opponent pure strategy."
      *   Actually, constructing the dominating mixture is easier for a human than proving "never a best response."
      *   Revised Instruction: "To eliminate $s_i$ via mixed dominance, you must exhibit a probability distribution over your *other* strategies that yields a strictly higher payoff against *every* one of the opponent's pure strategies."
      *   Why? Because $E[u(\sigma_i, s_{-i})] > u(s_i, s_{-i})$ for all $s_{-i}$ is the definition.
      *   Search method: Pick the two strategies that perform best against the columns where $s_i$ is weak. Assign weights (start with 0.5/0.5). Calculate expected payoff against each column. If all > $s_i$'s payoff, eliminate.
      *   This is actionable.

  6.  **Addressing "Judgment Calls":**

      *   Payoff cardinality assessment.
      *   Mixed strategy search limit (when to stop looking for a dominating mixture).
      *   Correlation assumption (independent vs correlated).
      *   Interpretation of the surviving set (risk attitude).

  7.  **Addressing "Blind Spots":**

      *   Multiple equilibria (selection problem).
      *   Trembling hand / errors (weak dominance issues).
      *   Common knowledge of rationality (assumed by IEDS, often false).
      *   Dynamic/Repeated contexts (IEDS is for one-shot).

  8.  **Structure of the Output:**

      *   **Header:** Standard Operating Procedure (SOP).
      *   **Section 1: The Protocol.** (Steps 1-8 as planned).
      *   **Section 2: Application to Model 1.** (Walkthrough, result, unwanted outcome discussion).
      *   **Section 3: Application to Model 2.** (Construction, walkthrough, refusal to eliminate).
      *   **Section 4: Blind Spots & Limitations.**

  9.  **Review against Constraints:**

      *   *Fix game/scale:* Included in Step 1.
      *   *Screen pure strict:* Included in Step 2.
      *   *Operational test for mixed:* Included in Step 3 (constructive approach).
      *   *Iterate/Halt:* Included in Step 4 & 5.
      *   *Weak dominance:* Forbidden in iteration (Step 6).
      *   *Correlation:* Flagged in Step 7.
      *   *Judgment calls:* Marked in [BRACKETS].
      *   *Two models:* Done.
      *   *Unwanted answer:* Addressed in Model 1 analysis.
      *   *Blind spots:* Closing section.

  10. **Tone:** Professional, precise, authoritative but humble about limitations. "Do not water it down."

  11. **Self-Correction on Model 1:**
