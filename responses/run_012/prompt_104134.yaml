      *   M Payoffs: L(2), C(2), R(2).
      *   $2.5 > 2$, $3 > 2$, $2.5 > 2$. Yes, Strictly Dominated.
      *   Is C *strictly* dominated?
      *   P2 Payoffs: L(3,0,0), C(0,3,0), R(0,0,3).
      *   If P1 plays M (which is eliminated), C is best. But we iterate.
      *   After M is gone, P1 plays T or B.
