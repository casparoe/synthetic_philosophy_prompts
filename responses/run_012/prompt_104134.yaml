  13. **Final Polish:** Ensure the distinction between "Strict" and "Weak" is sharp. Ensure the "Cardinal vs Ordinal" check is prominent. Ensure the "Correlation" note is specific to 3+ players (Model 1 is 2 players, so correlation doesn't apply there, but I should note it in the procedure generally). Wait, Model 1 is 2 players. The prompt asks to flag the point where correlation bites (3+ players). I will note in the procedure that for 2-player games, independence is automatic, but for 3+, it's an assumption.

