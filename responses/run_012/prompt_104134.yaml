      *   P1: T(4,3,1), M(2,2,2), B(1,3,4).
      *   P2: L(3,0,0), C(0,3,0), R(0,0,3).
      *   My previous analysis: M dominated by mix of T/B. C dominated by mix of L/R.
      *   Surviving: T/B vs L/R.
      *   Is there a unique NE? (T,L) -> P1:4, P2:3. P1 dev to B->1. P2 dev to C->0, R->0. (T,L) is NE.
      *   (B,R) -> P1:4, P2:3. P1 dev to T->1. P2 dev to L->0, C->0. (B,R) is NE.
      *   (M,C) -> P1:2, P2:3. P1 dev to T->3, B->3. M is not BR to C. So (M,C) not NE.
      *   So we have two Pure NE. The procedure leaves both. The "unwanted answer" is the lack of uniqueness. The group wants "Do T" or "Do B". The procedure says "T or B are rationalizable."
      *   Wait, is M *strictly* dominated?
