answer: |-
  # STANDARD OPERATING PROCEDURE: GAME REDUCTION FOR STRATEGIC RECOMMENDATION

  **Owner:** Corporate Strategy Group  
  **Version:** 1.0  
  **Constraint:** One-page note output; ~1 day execution time.  
  **Warning:** This procedure identifies *rationalizable* outcomes. It does not guarantee a unique prediction. It does not replace human judgment on risk or context.

  ---

  ## PART I: THE REDUCTION PROTOCOL

  ### Step 1: Verify Payoff Scale (Cardinal vs. Ordinal)
  **Action:** Inspect the source of the payoff numbers.
  *   **Cardinal (Utility):** The numbers represent magnitudes where differences matter (e.g., expected profit, NPV, von Neumann-Morgenstern utility). You can average them.
  *   **Ordinal (Ranking):** The numbers represent only an order of preference (e.g., 1st, 2nd, 3rd place; "High/Med/Low" coded as 3/2/1 without linearity).
  **Rule:** 
  *   If **Cardinal**: Proceed to Step 2.
  *   If **Ordinal**: **STOP.** You may only eliminate strategies strictly dominated by *pure* strategies. You **cannot** test for domination by mixed strategies (averaging ordinal ranks is mathematically invalid). Proceed to Step 6 with this limitation noted.
  **[Judgment Call]:** Determining if "Profit Estimates" are truly cardinal utilities or just ordinal proxies. If uncertain, treat as Ordinal.

  ### Step 2: Eliminate Strictly Dominated Pure Strategies
  **Definition:** Strategy $A$ is strictly dominated by Strategy $B$ if $B$ yields a strictly higher payoff than $A$ against *every* possible strategy the opponent(s) might play.
  **Action:** 
  1.  For each player, compare every pair of strategies.
  2.  If Strategy $A$ is strictly worse than Strategy $B$ in every column/row, cross out $A$.
  3.  Record the domination pair (e.g., "M dominated by T").
  **Theory Note:** This step is safe. It never deletes a strategy used in a Nash Equilibrium. The order of elimination does not matter.
  **[Judgment Call]:** None. This is mechanical.

  ### Step 3: Test for Strict Domination by Mixed Strategies
  **Definition:** Strategy $A$ is strictly dominated by a *mixture* of other strategies if there exists a probability distribution over your other strategies that yields a strictly higher expected payoff than $A$ against *every* opponent pure strategy.
  **Theory Note:** A strategy is strictly dominated by a mixture **if and only if** it is **never a best response** to any belief about the opponents.
  **Operational Test (No Linear Programming):**
  1.  **Best Response Check:** Check if Strategy $A$ is the best response to any of the opponent's *pure* strategies. If yes, **STOP** (Keep $A$).
  2.  **Mixture Construction:** If $A$ is not a best response to any pure opponent strategy, attempt to construct a dominating mixture.
      *   Identify the two other strategies ($X$ and $Y$) that perform best where $A$ performs poorly.
      *   Test a 50/50 mixture of $X$ and $Y$. Calculate the expected payoff against every opponent pure strategy.
      *   If the mixture payoff > $A$'s payoff in **all** cases, **Eliminate $A$**.
      *   If not, adjust weights (e.g., 70/30) and re-calculate.
  3.  **Stopping Rule:** If you cannot find a dominating mixture after testing the two strongest alternatives and simple weightings, **Keep $A$**. Do not spend more than 30 minutes searching.
  **[Judgment Call]:** Deciding when to stop searching for a dominating mixture. Failure to find one does not prove one doesn't exist, but for business purposes, absence of evidence is treated as evidence of absence.

  ### Step 4: Iterate
  **Action:** Repeat Steps 2 and 3 on the reduced matrix.
  **Rule:** Continue until no further strategies can be eliminated.
  **Theory Note:** For *strict* dominance, the order of elimination never changes the final surviving set.

  ### Step 5: Weak Dominance (WARNING)
  **Definition:** Strategy $A$ is weakly dominated by $B$ if $B$ is at least as good as $A$ in all cases and strictly better in at least one.
  **Rule:** **DO NOT ITERATE WEAK DOMINANCE.**
  *   You may note a weak dominance relation in the text.
  *   You **must not** eliminate a weakly dominated strategy if doing so removes a Nash Equilibrium.
  *   **Cost:** Eliminating weakly dominated strategies is order-dependent and can delete valid equilibria.
  **[Judgment Call]:** If the surviving set is large, you may *mention* weak dominance as a tie-breaker in the narrative, but the formal reduction must stop before it.

  ### Step 6: Correlation Assumption (3+ Players)
  **Context:** In games with 3 or more players, beliefs about Opponent B and Opponent C can be *correlated* (e.g., they might coordinate against you).
  **Rule:** This procedure assumes **independent beliefs** (Opponent B's choice gives no information about Opponent C's choice).
  **Disclosure:** If the game has 3+ players, the final note must state: *"Analysis assumes opponents act independently. If opponents can correlate their strategies (e.g., via side agreements), the surviving set may be smaller."*
  **[Judgment Call]:** Assessing the likelihood of opponent correlation.

  ### Step 7: Final Output & Handoff
  **Action:** Compare the surviving strategy profiles to the original set.
  *   **Case A (Single Profile):** One strategy remains for each player. 
      *   *Output:* "The model predicts [Profile]."
  *   **Case B (Multiple Profiles):** More than one strategy remains for at least one player.
      *   *Output:* "The model identifies [Set] as rationalizable. It does not predict a unique outcome."
      *   *Handoff:* Return to Strategy Head for selection based on risk appetite or external intelligence.
  **Rule:** Do not paper over Case B. A surviving set is not a prediction.

  ---

  ## PART II: APPLICATION TO MODELS

  ### Model 1: The $3 \times 3$ Pricing/Entry Game
  **Payoffs:** (Player 1, Player 2)
  ```
              L          C          R
    T       (4, 3)     (3, 0)     (1, 0)
    M       (2, 0)     (2, 3)     (2, 0)
    B       (1, 0)     (3, 0)     (4, 3)
  ```
  **Step 1 (Scale):** Payoffs represent profit magnitudes. **Cardinal.** Proceed.
  **Step 2 (Pure Strict):** 
  *   P1: T vs M? (4>2, 3>2, 1<2). No. M vs B? (2>1, 2<3). No.
  *   P2: L vs C? (3>0, 0<3). No.
  *   *Result:* No pure strategies eliminated.
  **Step 3 (Mixed Strict):**
  *   **P1 Analysis:** Check Strategy M (2, 2, 2). 
      *   Is M a best response to L? No (T=4). To C? No (B=3, T=3). To R? No (B=4).
      *   *Construct Mixture:* Mix T and B (50/50). 
      *   Vs L: $0.5(4) + 0.5(1) = 2.5$ (>2).
      *   Vs C: $0.5(3) + 0.5(3) = 3.0$ (>2).
      *   Vs R: $0.5(1) + 0.5(4) = 2.5$ (>2).
      *   *Action:* **Eliminate M.**
  *   **P2 Analysis (Given M is gone):** P2 faces T and B only.
      *   Payoffs for P2: L(3, 0), C(0, 0), R(0, 3).
      *   Check Strategy C (0, 0). 
      *   *Construct Mixture:* Mix L and R (50/50).
      *   Vs T: $0.5(3) + 0.5(0) = 1.5$ (>0).
      *   Vs B: $0.5(0) + 0.5(3) = 1.5$ (>0).
      *   *Action:* **Eliminate C.**
  **Step 4 (Iterate):** 
  *   Remaining: P1 {T, B}, P2 {L, R}.
  *   Check T vs B: T better vs L, B better vs R. No dominance.
  *   Check L vs R: L better vs T, R better vs B. No dominance.
  *   **Halt.**
  **Step 7 (Output):** 
  *   **Surviving Set:** {(T, L), (T, R), (B, L), (B, R)}.
  *   **Nash Equilibria in Set:** (T, L) and (B, R).
  *   **Recommendation:** "The model reduces the options to T or B for us, and L or R for the competitor. Two stable outcomes exist: (T, L) and (B, R). The model cannot distinguish between them."

  **Unwanted Answer:** The Strategy Group likely wants a single directive (e.g., "Launch T"). The procedure refuses to provide one. 
  **Why Accept It:** The model reflects a coordination failure inherent in the payoffs. Choosing T without assurance the competitor chooses L risks a payoff of 1 (if they play R). Choosing B risks a payoff of 1 (if they play L). The mathematics confirms there is no dominant move. Pushing for a single recommendation requires external data (e.g., "We know Competitor prefers L") not contained in the matrix.

  ### Model 2: The Weak Dominance Trap
  **Constructed Payoffs:** (Player 1, Player 2)
  ```
              L          R
    T       (2, 2)     (0, 0)
    B       (2, 0)     (1, 1)
  ```
  **Step 1 (Scale):** Cardinal.
  **Step 2 (Pure Strict):** 
  *   P1: T (2, 0) vs B (2, 1). B is $\ge$ T in all cases, > in one.
  *   *Classification:* **Weak Dominance**, not Strict. (2 is not strictly greater than 2).
  **Step 5 (Weak Dominance Rule):** 
  *   **Procedure Command:** **DO NOT ELIMINATE T.**
  *   **Reason:** T is part of the Nash Equilibrium (T, L). If P1 plays T, P2 plays L (2>0). If P2 plays L, P1 plays T (2=2, indifferent). (T, L) is a stable outcome.
  *   Eliminating T based on weak dominance would falsely predict (B, R) is the only outcome, ignoring the risk that the competitor coordinates on L.
  **Step 7 (Output):** 
  *   **Surviving Set:** {T, B} $\times$ {L, R}.
  *   **Recommendation:** "No strategies can be eliminated. Both (T, L) and (B, R) are Nash Equilibria. T is weakly dominated but rationalizable."

  ---

  ## PART III: BLIND SPOTS & LIMITATIONS

  **1. The Selection Problem:** 
  This procedure identifies what *can* happen (rationalizability), not what *will* happen. If multiple Nash Equilibria survive (as in Model 1), the procedure cannot select one. A human must apply focal points, history, or risk analysis to choose.

  **2. Common Knowledge of Rationality:** 
  IEDS assumes all players know all players are rational, and know that they know, ad infinitum. In live markets, competitors may make mistakes ("trembles") or act irrationally. If a competitor is known to be erratic, strategies eliminated by IEDS might actually be safe hedges.

  **3. Input Sensitivity:** 
  The procedure cannot repair bad inputs. If the payoff matrix is ordinal but treated as cardinal (Step 1 failure), the mixed-strategy elimination is mathematically void. If the payoffs ignore a key competitor action, the "surviving" strategies may be dominated by an unmodeled fourth option.

  **4. Dynamic Contexts:** 
  This procedure is for one-shot simultaneous games. If the decision is repeated (pricing wars) or sequential (entry deterrence), IEDS may eliminate strategies that are vital for reputation building or signaling in later rounds.

  **5. Correlation Blindness:** 
  In 3+ player games, this procedure assumes independent beliefs. If competitors can signal or collude, the "Never a Best Response" set shrinks. The procedure will overestimate the surviving set in the presence of correlation.

  **Human Handoff Requirement:** 
  If the procedure ends with **Case B (Multiple Profiles)**, the analyst must append a qualitative assessment of *risk*. Do not sign off on a "T or B" recommendation without stating the cost of miscoordination.
