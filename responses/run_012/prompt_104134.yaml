          *   U: (1, 1)  (0, 0)
          *   D: (1, 0)  (0, 1)
      *   P1: U gives 1, 0. D gives 1, 0. Indifferent. No dominance.
      *   Let's use the standard example:
          *   P1: T, B. P2: L, R.
          *   T: (2, 2)  (0, 0)
          *   B: (2, 0)  (1, 1)
