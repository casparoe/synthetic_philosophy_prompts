answer: |-
  # JOINT STATEMENT ON THE STATUS OF MORAL LUCK
  **Signed:** Party A (Control-Principle Hardliner) & Party B (Moral-Luck Realist)
  **Date:** October 24, 2023
  **Subject:** Mapping the Disagreement regarding Agency, Outcome, and Desert

  ## Preamble
  We, the undersigned, acknowledge a persistent divergence in our accounts of moral responsibility. We agree that this divergence is not the result of inattention to the opposing view. Party A accepts the phenomenological force of luck-infected cases; Party B accepts the normative gravity of the Control Principle. We issue this statement to isolate the precise points of contact and fracture, utilizing a shared test case and operational criteria, without attempting to prematurely resolve the metaphysical underpinnings.

  ## 1. Shared Commitments
  We jointly affirm the following claims. Where concessions are made, they are binding on the signatory.

  1.  **The Zero-Control Baseline:** We agree that if an agent exercises *no* voluntary control over a state of affairs (e.g., a reflex, a coercion where no alternative exists, or a purely random external event), the agent bears no moral responsibility for it. Luck cannot generate responsibility *ex nihilo*.
  2.  **The Twin Drivers Case (Input Data):** We agree to the following stipulations for our shared test case:
      *   **Driver U (Unlucky)** and **Driver L (Lucky)** are identical in all controllable respects: same blood-alcohol level, same speed, same attention, same skill, same route.
      *   Both round the same blind corner on the same night.
      *   In World U, a child is in the road; Driver U hits and kills the child. Driver U learns of the death immediately.
      *   In World L, the child was called inside a minute earlier; Driver L hits nothing. Driver L never learns a child was ever at risk.
      *   **Prediction Agreement:** We agree that ordinary observers will assign higher blame and punishment to Driver U than to Driver L. We agree this intuition is robust across cultures.
  3.  **Party A's Concession to Party B:** Party A concedes that the intuition favoring higher blame for Driver U is not merely a "mistake" in the lay sense, but a stable feature of human moral psychology that tracks a perceived difference in the *agent's relation to the world.* Party A further concedes that if the Control Principle requires us to ignore the death of the child entirely when assessing Driver U's *character*, the principle demands a counter-intuitive abstraction that strains the concept of "agency" to the breaking point.
  4.  **Party B's Concession to Party A:** Party B concedes that the Control Principle captures a vital normative truth: it is unfair to punish an agent *solely* for the whim of nature. Party B agrees that if moral luck implies that Driver U is *evil* while Driver L is *good* despite identical choices, the concept of "moral worth" becomes unrecognizable. Party B accepts that luck cannot be the *source* of agency, only a modifier of its moral weight.
  5.  **The Epistemic Overlap:** We agree that in many practical contexts, outcome luck functions as evidence of prior negligence. We agree that Driver U's outcome provides stronger evidence of risk-taking than Driver L's non-outcome, absent further investigation.

  ## 2. Residual Disagreements
  We disagree on the interpretation of the shared commitments above. We sort these disagreements into descriptive claims about practice and normative claims about desert.

  ### (i) The Psychological/Descriptive Question
  *What do our blaming practices in fact track?*

  *   **Party A:** Our practices track **epistemic warrant**. We blame Driver U more because the outcome confirms the danger of their conduct. The variation in blame is a variation in *confidence* regarding the agent's disregard for others, not a variation in the disregard itself. The intuition that Driver U is "worse" is a cognitive illusion caused by the salience of harm.
  *   **Party B:** Our practices track **constitutive status**. We blame Driver U more because the moral reality of what Driver U *did* is different from what Driver L *did*. The practice is not confused; it is sensitive to the fact that agency is a transaction between will and world. The intuition that Driver U is "worse" is a correct perception of a thicker moral fact.

  ### (ii) The Normative/Metaphysical Question
  *What ought our practices track / What is desert?*

  *   **Party A:** Desert must be **insulated from luck**. To be morally assessable is to be assessable for the governance of one's will. If desert varies with the child's presence (which the driver did not control), then desert is not about the agent, but about the environment. We ought to engineer our practices to equalize blame for U and L once control is accounted for.
  *   **Party B:** Desert is **responsive to the world**. To be morally assessable is to be assessable for one's footprint in reality. If desert is insulated from the outcome, it becomes a solipsistic measure of "trying" rather than "doing." We ought to maintain practices that reflect the actual moral cost of our actions, which is partly determined by how the world receives them.

  ## 3. The Cruxes
  We identify two specific pivots upon which the dispute turns. For each, we record a shared argument/case, our divergent predictions, and the "double crux" conditions required to shift our positions.

  ### Crux 1: The Truth-Standard of Blame
  *Is a blame judgment answerable to a truth-like standard such that an uncontrollable fact could make it incorrect?*

  *   **Shared Argument:** The "Retrospective Knowledge" variation of the Twin Drivers case. Suppose we inform Driver L that a child *would have* died but for luck.
  *   **Party A Prediction:** Once Driver L's epistemic position is equalized to Driver U's (i.e., L knows the risk was real), the blame assigned to L should rise to match U. If it does not, the practice is irrational.
  *   **Party B Prediction:** Even with equalized knowledge, blame assigned to L should remain lower than U. The fact that L *did not kill* remains a moral mitigator, regardless of knowledge.
  *   **Double Crux:**
      *   **Party A would move if:** It were demonstrated that rational agents, fully informed of the counterfactual risk, *still* consistently and reflectively judge L as less blameworthy than U, without citing epistemic uncertainty.
      *   **Party B would move if:** It were demonstrated that when the outcome is stripped from the description of the act (focusing purely on the choice), the concept of "what was done" loses all coherence, making it impossible to distinguish U from L even descriptively.

  ### Crux 2: The Unity of Responsibility
  *Is responsibility a single relation or a family of distinct ones?*

  *   **Shared Argument:** The distinction between "Regret" and "Guilt."
  *   **Party A Prediction:** Responsibility is a **single relation** (Answerability). If U and L made the same choice, they are answerable to the same degree. Any difference is merely about "regret" (sadness about the world) vs. "guilt" (fault in the self), and we ought to collapse this distinction in moral assessment.
  *   **Party B Prediction:** Responsibility is a **family of relations**. There is "Responsibility for Choice" (equal for U and L) and "Responsibility for Outcome" (distinct for U and L). These are not in competition; they are layers of the same practice.
  *   **Double Crux:**
      *   **Party A would move if:** A case were produced where an agent is clearly responsible for an outcome but had *no* control over the choice leading to it, yet we still intuitively demand restitution, suggesting "Outcome Responsibility" operates independently of "Choice Responsibility."
      *   **Party B would move if:** A case were produced where separating "Choice" from "Outcome" responsibility renders the agent's moral identity unintelligible (e.g., if we cannot say who the agent *is* without referencing the outcome).

  ### Operational Criterion and Falsification Conditions
  To adjudicate the claim that outcome-luck changes blameworthiness (B) versus changes only epistemic warrant (A), we jointly propose the following single operational criterion for third-party verification:

  **The Criterion of Counterfactual Knowledge Equilibrium (CCKE):**
  *Take a population of competent moral judges. Present them with Driver L (Lucky). In Condition 1, L is unaware of the risk. In Condition 2, L is informed that a child was present and would have died but for luck. Measure the differential in blame assigned to L (Condition 2) versus blame assigned to U (who knows they killed).*

  *   **Interpretation:**
      *   If Blame(L, Cond 2) ≈ Blame(U), the difference was Epistemic (Supports A).
      *   If Blame(L, Cond 2) < Blame(U), the difference is Ontic (Supports B).

  *   **Falsification Conditions:**
      *   **Party A Falsification:** Party A's view is falsified if, under Condition 2, competent judges *reflectively* maintain a significant blame differential between L and U, citing the *absence of death* rather than uncertainty about the past choice.
      *   **Party B Falsification:** Party B's view is falsified if, under Condition 2, the blame differential vanishes completely, indicating that the "moral cost" of the action was entirely contained in the risk-choice and not the worldly result.

  ## 4. Verdict on Verbal Dispute
  We conclude that this dispute is **not merely verbal**, though it contains a verbal shadow.

  *   **The Verbal Component:** There is ambiguity in the term "Blame." Party A tends to define it as "Assessment of the Will's Governance." Party B tends to define it as "Assessment of the Agent's Moral Footprint." If we were merely arguing over definitions, we could stipulate "Blame*" and "Blame**" and proceed.
  *   **The Substantive Component:** However, the dispute survives terminological clarification because it concerns **fairness vs. integrity.** Party A argues that holding L and U differently violates a fundamental constraint on fairness (Control). Party B argues that holding L and U equally violates a fundamental constraint on moral integrity (Truth).
  *   **Reason:** We cannot simply agree to use different words because the practical implications conflict. A legal or social system cannot simultaneously punish U and L equally (as A demands) and unequally (as B demands). The operational criterion (CCKE) yields mutually exclusive prescriptions for policy. Therefore, the disagreement is metaphysical and normative, not lexical.

  ***

  **Signed,**

  _________________________
  **Party A** (Control-Principle Hardliner)

  _________________________
  **Party B** (Moral-Luck Realist)
