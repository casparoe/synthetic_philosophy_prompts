      *   **Frustration:** The Careenium is used as an illustration, not a research program. Questions feel entangled (metaphysical, semantic, formal, methodological).
      *   **Task:** Provide a *dependency-aware prioritization* of open questions. Identify the "upstream" question that, if settled, reduces pressure on others.
      *   **Requirements:**
          *   Defend the ordering (don't just list).
