  *(Self-Correction during drafting)*: I need to be careful not to say LTCM *was* irrational in a simple sense. Their models were internally consistent. The inconsistency arose between the *model's world* and the *real world's constraints*. The diachronic failure was assuming the future market would allow the exit strategy the past market entry required.

