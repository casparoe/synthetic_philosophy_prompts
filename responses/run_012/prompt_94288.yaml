      *   *Time Pump (User's Definition):* Agent is consistent at $t_1$ but $t_2$ self deviates. Exploitation comes from the succession of selves (or structural constraints acting as future selves). Key: Diachronic inconsistency (hyperbolic discounting, dynamic inconsistency).
      *   *LTCM as Agent:* This is the tricky part. Is LTCM a unitary agent? Or a collection of partners, models, and creditors?

  3.  **Analyze the LTCM Case through the Lens:**
      *   *Ex Ante (Pre-1998):* Preference for high Sharpe ratio via convergence trades. Willingness to leverage. Belief in mean reversion.
      *   *Shock (Aug 1998):* Russian default. Flight to quality. Spreads widen (diverge instead of converge).
      *   *Margin Calls:* Counterparties demand collateral. This acts as a constraint on future choices.
      *   *Deleveraging:* Selling assets into a falling market.
      *   *Recapitalization:* Fed convenes banks. LTCM partners lose control/equity.

  4.  **Drafting the Mapping (Iterative Process):**

      *   *Question 1: Who is pumping whom?*
