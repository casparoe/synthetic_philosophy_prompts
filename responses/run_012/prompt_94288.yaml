          *   $t_1$ (Crisis): Minimize loss/Survival. Preference: Liquidity > Convergence.
          *   Intransitivity? Not really. The preference ordering changed due to state change (solvency threat).
          *   Time Inconsistency? Yes. $t_0$ planned to hold to convergence. $t_1$ forced to liquidate. $t_0$ underestimated the cost of $t_1$ liquidation.

      *   *Question 3: Intransitivity vs. Time Inconsistency vs. Coordination.*
          *   It's not intransitivity (A>B>C>A).
          *   It is Time Inconsistency (Plan at $t_0$ is not optimal at $t_1$).
          *   Crucially: It's a *Principal-Agent* and *Creditor Coordination* problem. The "Agent" (LTCM) is fragmented. Partners vs. Risk Model vs. Creditors.
          *   The "Time Pump" is actually a *Collateral Pump*. The system extracts equity because the agent cannot commit to not deleveraging.

