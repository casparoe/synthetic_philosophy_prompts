          *   Time Pump? Yes. The $t_0$ LTCM commits to a strategy that $t_1$ LTCM cannot sustain. The "pump" is the drain of equity via margin calls and fire sales.
          *   Wait, is it a pump? A pump implies a cycle returning to the start state but poorer. LTCM didn't cycle; it collapsed.
