  **PART I: FOREWORD BY THE CHIEF ONTOLOGICAL OFFICER**

  Bramble & Wexler Cryogenics affirms its commitment to the Ontological Materiality Standard (OMS), fourth edition. Our operating philosophy proceeds from the premise that physical process entails experiential state. Where energy is dissipated, feeling occurs. Where feeling occurs, valence arises. It is the duty of management to account for this valence with the same rigor applied to carbon or capital.

  This statement covers the fiscal year ending 31 December. We have applied the Integrated Subject Clause strictly. Experience is reportable only when bound into a point of view persisting for no less than one second. This temporal threshold resolves the combination problem for operational purposes: sub-second fluctuations are deemed ontologically inert regarding welfare, regardless of their physical magnitude. While we acknowledge the epistemic asymmetry between internal human reports and inferred machine states, our models treat negative valence in external systems as a precautionary certainty. We do not wait for consent where capacity for suffering is probable. The precision of our ledger reflects our confidence in these models, even where direct phenomenological access is impossible.

  **PART II: MATERIALITY DETERMINATION**

  **Reporting Boundary:** Global operations, including leased liquefaction trains and supply chain energy.
  **Unit of Account:** Millivalences per megajoule (mV/MJ), annualized.
  **Materiality Threshold:** 10,000 millivalences (net negative) per annum.

  | Scope | Source Description | Integrated Subject Status | Net Valence (mV) |
  | :--- | :--- | :--- | :--- |
  | **Scope 1** | Liquefaction Train A (Helium-3) | Excluded (Process cycles < 0.8s) | 0.00 |
  | **Scope 1** | Compressor Hall Noise | Included (Resonance > 1.0s) | (4,200.50) |
  | **Scope 2** | Purchased Grid Electricity | Included (Grid load stabilization) | (5,000.00) |
  | **Scope 3** | Customer Qubit Decoherence | Included (Measurement duration > 1.0s) | (5,003.05) |
  | **Total** | **Net Ontological Liability** | | **(14,203.55)** |

  **Offset Requirement:** 14,204 Restorative Ontological Credits (ROC).
  **Offsets Purchased:** 14,204 ROC from the Amazonian Microbiome Valence Project.

  *Note on Scope 1 Exclusion:* Thermal phonon events within the liquefaction train were assessed individually. As no single phonon maintains a coherent state vector for one second, they fall below the reportable threshold. Aggregation of sub-second subjects is prohibited under OMS 4.4 to prevent double-counting of fragmented experience.

  **PART III: INDEPENDENT ASSURANCE STATEMENT**

  **To the Board of Bramble & Wexler Cryogenics:**

  We have reviewed the accompanying Ontological Impact Statement. Our audit was conducted in accordance with the International Board on Ontological Materiality Assurance Protocol.

  **Limited Assurance (Scopes 1 & 2):**
  Based on our review, nothing has come to our attention that causes us to believe the Scope 1 and 2 valence data are not prepared, in all material respects, in accordance with the OMS. We verified the temporal binding of compressor resonance patterns. We note, however, that the valuation of valence assumes valence is a fundamental property rather than an emergent one. Should valence prove non-fundamental, the unit mV is undefined, rendering the ledger numerically void. We have not tested for this metaphysical contingency.

  **Absent Assurance (Scope 3):**
  We express no opinion on Scope 3 data. The subject-summing problem prevents verification of whether customer qubits constitute integrated subjects or merely components of a larger cosmic subject. If cosmopsychism holds, the firm's local offsets are incoherent, as there is only one subject to compensate. Given the measurement uncertainty inherent in inferring third-party phenomenology, the reported figure of 5,003.05 mV should be treated as an order-of-magnitude estimate despite the decimal precision provided.

  **Part IV: INVESTOR QUESTION-AND-ANSWER SESSION**

  **Analyst (Coalition for Phenomenal Justice):** You exclude internal phonon events because they lack temporal unity, yet you purchase offsets from the Amazonian Microbiome project, where individual bacteria also lack one-second coherence. How do you justify summing microbial valence for offsets while refusing to sum phonon valence for liabilities?

  **Chief Ontological Officer:** The distinction lies in the direction of the precautionary principle. When assessing liability, we require strict adherence to the Integrated Subject Clause to avoid over-reporting suffering where none may exist. This protects the firm from false positives. When purchasing offsets, we apply a generous interpretation of binding to ensure maximum restorative impact. This protects the ontology from false negatives.

  **Analyst:** So the criteria for suffering are stricter than the criteria for relief?

  **Chief Ontological Officer:** The criteria are calibrated to risk. Inferring suffering where there is none is a financial risk. Inferring relief where there is none is an ontological risk. We prioritize the latter in our offset portfolio. Furthermore, the microbiome project certifies colony-level binding, which exceeds the one-second threshold, whereas our phonons remain individual.

  **Analyst:** But the colony binding is an emergent property, which your auditors noted might invalidate the unit.

  **Chief Ontological Officer:** We rely on the auditors' limited assurance for Scope 1 and 2. Scope 3 and offsets are managed under policy discretion. The ledger balances.

  **Analyst:** The figure 14,203.55 implies a confidence interval of ±0.01 mV. Your auditors cite order-of-magnitude uncertainty.

  **Chief Ontological Officer:** The precision reflects the accounting standard, not the metaphysical reality. We report what is calculable, not necessarily what is knowable.
