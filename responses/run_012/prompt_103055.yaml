  **MEMORANDUM**

  **TO:** All Planning Staff, Traffic Engineering Division, Public Liaison Office
  **FROM:** Director of Long-Range Planning
  **SUBJECT:** Procedural Guidelines for Zoning Code Revision (Framework Adoption)
  **DATE:** [Undated]

  **1. Purpose and Framework Selection**
  This office is currently engaged in the revision of the municipal zoning code. It has come to our attention that public objections frequently take the form of ontological claims regarding the "real existence" of neighborhoods, community character, or local heritage. Staff are instructed to reclassify these objections. Questions regarding whether a neighborhood "really exists" independent of our zoning maps are external questions. They are not matters of truth or falsehood but practical decisions regarding which linguistic framework facilitates efficient administration. We do not discover the city; we adopt a framework for describing it. Once the framework of "High-Density Residential Zone Type 4" is adopted, internal questions (e.g., "Does this plot fall within Zone 4?") are settled by empirical measurement. Until then, objections based on the "reality" of the prior community are categorically inadmissible.

  **2. Explication of Vague Concepts**
  Public discourse relies on vague concepts such as "livability," "charm," and "overcrowding." These are unfit for scientific planning. Our task is explication: replacing these vague explicanda with precise explicata. Henceforth, "livability" shall be explicated as "square footage per capita adjusted for noise decibel levels." "Community character" shall be explicated as "uniformity of façade setback distances." We do not argue that the new definition is "truer" than the old; we propose it as more fruitful for the purpose of rational calculation. Staff should not defend the value of the concept but demonstrate its utility within the chosen framework.

  **3. Protocol Sentences and Observation Reports**
  All field data must be recorded in approved protocol sentences. These sentences are the foundation of our knowledge structure. However, staff must recognize that protocol sentences are not incorrigible. If a field report conflicts with the broader system of planning laws, the report may be rejected as erroneous observation rather than falsifying the law. We prioritize the coherence of the total system. See the Appendix for the approved syntax of observation reports. Do not record subjective experiences; record only physicalistic data points verifiable by any observer within the framework.

  **4. Inductive Logic and Preference Confirmation**
  There is a misconception that resident preferences are matters of opinion. They are hypotheses subject to confirmation. The Traffic Engineering Division is instructed to cease tallying votes and instead compute the degree of confirmation for the hypothesis that "Residents prefer denser housing configurations." Preliminary calculations suggest a low degree of confirmation based on current petition data. However, if we adjust the background knowledge to include long-term economic efficiency, the degree of confirmation rises significantly. Staff should present these calculated probabilities to the public not as decisions, but as logical relations between evidence and hypothesis. We are not ignoring their preferences; we are assigning them a lower logical weight than the structural requirements of the framework.

  **5. Strategic Objectives**
  In adopting this framework, we must remain clear on our ultimate goal. The purpose of rational planning is not merely order, but the liberation of the populace from the irrational constraints of tradition and private property hoarding. A scientifically managed city ensures equitable distribution of—

  *Correction:* The preceding sentence expresses a material value judgment external to the procedural neutrality of this office. While the utility of a framework may be judged by its capacity to serve human welfare, this office remains neutral regarding specific conceptions of the good life. We propose the framework of High-Density Rationalization because it maximizes calculability. Whether calculability serves liberation or merely efficiency is a practical decision for the City Council. Staff are to proceed with the explication of "equitable distribution" as "uniform access to transit nodes."

  **6. Conclusion**
  Disputes regarding the "rightness" of the plan are external. They are to be met with the Principle of Tolerance: we prohibit no framework, but we propose this one as optimal for our specific goals. Let us proceed with the construction of the city without metaphysical impediments.

  ***

  **APPENDIX: APPROVED PROTOCOL SENTENCES**

  1.  "Observer A records vehicle count N at Intersection B at Time T."
  2.  "Parcel C exhibits setback distance D meters."
  3.  "Resident E submitted written statement F at Date G."
  4.  "Noise level at Location H measured at I decibels."

  *Note: Sentences containing terms such as "ruined," "beautiful," "destroyed," or "home" are rejected as non-cognitive.*

  ***

  **Author's Note on Philosophical Liberties**

  This satire leans heavily on a specific, somewhat contested reading of Carnap and the Vienna Circle. Firstly, it treats the internal/external distinction as a bureaucratic shield to dodge political argument. While Carnap was indeed committed to rational planning and held left-wing political views (shared by Otto Neurath and others), scholars debate whether his distinction was intended to *neutralize* politics or to *clear the ground* for scientific socialism by removing metaphysical obstacles. Some argue that treating framework choices as "practical" rather than "true" actually opens space for democratic decision-making, whereas the memo uses it to insulate administration from dissent. Secondly, the memo presents explication as a neutral technical process. In reality, critics argue explication is inherently value-laden; choosing which precise concept replaces a vague one involves political judgment that the memo masks as mere "fruitfulness." Finally, the treatment of protocol sentences suggests they are fixed administrative forms, whereas Carnap and Neurath famously debated whether these foundational reports were themselves revisable (Neurath arguing they were, Carnap initially holding they were more secure). The memo resolves this debate in favor of administrative convenience, sacrificing the philosophical nuance for bureaucratic absurdity.
