      *   **Section 3: Evidence and Partitions.** This is the crux of the "Dave" case. Explain that partitions encode *interpretation*. Reading the same text $\neq$ receiving the same information if likelihood functions differ. The "same evidence" in AAT is much stronger than "same sensory input."
      *   **Conclusion:** Bring it back to the roommate. Why are they stuck? Likely different priors (CPA violation) or different partitions (interpretive frameworks). The theorem isn't broken; the conditions aren't met.

  6.  **Refine the Tone:**
