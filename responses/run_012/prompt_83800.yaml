answer: |-
  The air in Judge Halloway's chambers smelled of old paper and the distinct, damp earthiness of the object sitting on the evidence table. *The Sleeper*. An unfired clay figure by Elias Thorne, slumped in a chair that was also clay. It was worth nothing as art, the museum claimed, because it was unstable. It was worth something as material, TerraCore Industries claimed, because clay is clay.

  Elena, the museum's conservator, stood with her hands clasped behind her back. She knew the weight of this clay better than her own bones. She had mixed the slip. She had watched Thorne's hands work it.

  "Ms. Vance," said Sterling, the lawyer for TerraCore. He was a man of sharp angles, mirroring the dryness of his trade. "You've testified that you know this object. Is it one thing or two?"

  Elena took a breath. The Estate's lawyer, Mr. Gantry, sat ready to object, but this was the crux. "Physically, it is a lump of kaolin and ball clay. Artistically, it is *The Sleeper*."

  "Legally," Sterling pressed, "is it one object or two? The Estate claims the statue is protected property. We claim we purchased a lump of raw material. If they are the same thing, we own it. If they are different, the museum sold what it didn't own."

  Elena looked at the figure. The standard argument rose in her throat. "They are distinct. The lump existed before Thorne touched it. It was dug from the earth. The statue began only when he shaped it. Furthermore, the lump can survive being crushed into a sphere. The statue cannot. If I smash it, the clay remains, but *The Sleeper* ceases to exist. Different survival conditions imply different identities. By Leibniz's Law, they are not identical."

  Sterling stepped closer to the table. He did not touch the clay. "So you posit two objects occupying the same space at the same time. Composed of the exact same atoms. Possessing the same mass, the same charge, the same location. You say there is a lump, and there is a statue, and they are numerically distinct."

  "Yes," Elena said. "Constitution is not identity."

  "Then point to the statue," Sterling said softly.

  Elena's hand twitched. "It is the form."

  "Point to the form without pointing to the clay."

  "I can't. They are coincident."

  "Then they share all physical properties," Sterling said. "If they share all physical properties, what distinguishes them? You appeal to modal properties—what *could* happen to them. But possibility is not substance. You are asking this court to recognize a ghost haunting the mud. If there are two things, where is the second thing's matter? Is there double the mass here? Double the atoms?"

  Elena felt the floor tilt. She had taught this distinction in seminars. *The Lump and the Statue*. It was a clean puzzle in a classroom. Here, under the fluorescent hum, it felt like a lie. If she insisted on two objects, she was asserting a metaphysical miracle: co-location without physical differentiation. She was asking the law to protect a phantom.

  "Ms. Vance?" Gantry prompted. He needed her to hold the line. If there were two objects, the museum sold only the lump, and the Estate still owned the statue. The injunction would hold.

  Elena looked at Thorne's work. The smooth curve of the shoulder, the heavy drag of the head. She wanted to save it. To save it, she needed there to be two things. But she was a scientist of materials. She knew what was there.

  "There is no second matter," Elena said. Her voice was quiet.

  "Then there is no second object," Sterling said.

  Elena closed her eyes. She could lie. She could insist on the metaphysical distinction that protected the art. But to do so was to deny the physical reality she had sworn to uphold. To say there are two things is to speak loosely. To say there is one thing is to speak truly.

  "There is only the clay," Elena said.

  Gantry stood up. "Objection. She is contradicting her prior—"

  "No," Elena said. "The lump and the statue are one object. 'Statue' is a phase sortal. It describes what the clay is doing, not what it is. When Thorne shaped it, the clay entered a statue-phase. When I crush it, the phase ends. The object survives. The description dies."

  Sterling nodded, a small, respectful dip of the chin. "So the museum sold you the object."

  "Yes."

  Judge Halloway sighed, rubbing his temples. "Then the injunction is denied. TerraCore may proceed."

  The gavel fell. It sounded like a dry bone breaking.

  Gantry packed his briefcase with trembling hands. He stopped beside Elena as the bailiff moved to clear the room. He didn't look at her. He looked at *The Sleeper*, waiting to be loaded onto the truck outside.

  "You told the truth," Gantry said. He picked up the clay figure, feeling its weight, the reality of it. "You saved the atoms and lost the soul."

  He walked out. Elena stood alone with Sterling. He offered her a hand, which she ignored.

  "Clay is clay," Sterling said. He didn't gloat. He simply stated the texture of the world. "But you know, Ms. Vance, even if you had lied... the truck would still be waiting."

  He left her there. Elena placed her hand on the cold, damp shoulder of the figure. It was just clay. It had always been just clay. And that was why it hurt.

  ***

  **Authorial Note**

  This story lands on the **Identity View** (or Eliminativism regarding the statue): there is only one object, the clay, and "statue" is merely a temporary phase or description. This view treats the **Constitution View** (that the lump and statue are numerically distinct due to differing modal properties) fairly by allowing Elena to articulate its strongest defense before dismantling it via the coincidence problem. The story deliberately leaves unresolved whether the legal system *should* recognize artistic value as ontologically distinct from material substance, prioritizing metaphysical consistency over cultural preservation. The cost of truth is the destruction of the art, suggesting that while metaphysics may demand one object, human value systems require two.
