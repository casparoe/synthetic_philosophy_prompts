prompt: |-
  I've recently been appointed to my hospital's clinical ethics committee, and I've been surprised by how often the hardest cases aren't the ones where the principles obviously conflict—they're the ones where everyone on the committee is confident, but they're confident in different directions, and I suspect that at least some of us are being led by something other than the merits of the case. A colleague suggested I look at Adam Smith's idea of the impartial spectator, and while I find the basic idea appealing—judge your conduct as an impartial spectator would—I can't figure out how to actually do that in a meeting, under time pressure, with people I like and people I don't, and with a strong pull to side with the clinician who reminds me of myself. I need something more concrete than simply resolving to be impartial.

  Could you write me a procedure my committee could actually run on a case—a set of steps to go through in order, with what counts as a sufficient answer at each step, and where the procedure should stop and hand the decision back to the committee because it's a values question rather than a factual one? I'm particularly interested in the parts of Smith's account that make this hard: the difference between wanting to be praised and wanting to be praiseworthy; the way self-deception works, since Smith says we're prone to see our own conduct in a favorable light and that the internal judge he calls the man within the breast is easily corrupted; and the way custom and fashion can make us blind to the moral features of a situation, which I worry hospital culture does as much as any other. Then run the procedure on two cases: one where a family is requesting a treatment that the clinical team thinks is futile, and one where a clinician has made a decision that seems right by the book but feels wrong to the nurses who have to carry it out. Include at least one case where the procedure tells me something I don't want to hear, and be honest about what the procedure can't do—where it just gives me a vocabulary for the disagreement rather than a resolution.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** New member of a hospital clinical ethics committee (CEC).
      *   **Problem:** Hardest cases aren't principle conflicts, but confident disagreements driven by bias, self-deception, identification with colleagues, and hospital culture.
      *   **Theoretical Framework:** Adam Smith's *The Theory of Moral Sentiments* (specifically the "Impartial Spectator").
      *   **Specific Concepts to Integrate:**
          *   Desire to be praised vs. desire to be praiseworthy.
          *   Self-deception/corruption of the "man within the breast."
          *   Custom and fashion (hospital culture) blinding moral vision.
      *   **Deliverable:** A concrete, step-by-step procedure for the committee to use during meetings.
          *   Must include criteria for sufficient answers at each step.
          *   Must identify where the procedure stops (values vs. facts).
          *   Must apply the procedure to two specific cases (Futile treatment request; Clinician decision right by book/wrong to nurses).
          *   One case result must be unwelcome/uncomfortable.
          *   Must acknowledge limitations (vocabulary vs. resolution).

  2.  **Deconstruct Adam Smith's Impartial Spectator for this Context:**
      *   *The Impartial Spectator:* Not a god's eye view, but an imagined observer who knows all facts and has no stake in the outcome.
      *   *Praised vs. Praiseworthy:* Are we doing this to look good to peers (praised) or because it is actually right (praiseworthy)?
      *   *Self-Deception:* We naturally favor ourselves. The "man within" is weak. We need to distance ourselves.
      *   *Custom/Fashion:* Hospital norms (e.g., "we always fight," "we never pull the plug early") can distort moral judgment.

  3.  **Drafting the Procedure (The "Smithian Audit"):**
      *   *Goal:* Make it actionable, not just philosophical.
      *   *Step 1: Fact-Finding & Stakeholder Mapping.* (Standard ethics, but framed as "what would the Spectator see?")
      *   *Step 2: The Praise Check.* (Addressing "praised vs. praiseworthy".) Who are we trying to please?
      *   *Step 3: The Distance Test.* (Addressing self-deception/identification.) If this weren't *our* hospital/colleague, would we decide the same?
      *   *Step 4: The Custom Audit.* (Addressing hospital culture/fashion.) Are we doing this because it's right or because "that's how it's done"?
      *   *Step 5: The Verdict of the Spectator.* Synthesis.
      *   *Stopping Rule:* When the disagreement is about fundamental weights of values (e.g., autonomy vs. beneficence) rather than bias or fact.

  4.  **Developing the Cases:**

      *   **Case 1: Futile Treatment (The "Unwelcome Truth" Case).**
          *   *Scenario:* Family wants continued ventilation for a brain-dead patient. Team says futile.
          *   *Standard CEC view:* Usually supports medical futility/autonomy of physician.
          *   *Smithian Twist:* The committee might be rushing to judgment to protect the team's comfort (praise) rather than the family's grief process (praiseworthy). Or, the "custom" of efficiency is driving the decision.
          *   *Outcome:* The procedure suggests the committee is being too hasty to protect the clinicians, not the patient. This is the "unwelcome truth."

      *   **Case 2: By the Book, Wrong to Nurses (The "Culture" Case).**
          *   *Scenario:* Doctor follows strict protocol (e.g., rapid discharge or specific pain management) that nurses feel is cruel.
          *   *Standard CEC view:* Protocol is protocol.
          *   *Smithian Twist:* The "Custom" of hierarchy silences the nurses. The "Impartial Spectator" would value the lived experience of the caregivers.
          *   *Outcome:* Highlights the disconnect between policy and moral reality.

  5.  **Refining the Procedure (Iterative Polish):**
      *   *Make it time-bound:* CEC meetings are short. Steps need to be punchy.
      *   *Make it interpersonal:* Acknowledge the "people I like/don't like" aspect.
      *   *Clarify the "Stop" point:* Crucial distinction between bias correction (procedure's job) and value weighting (committee's job).

  6.  **Writing the Response:**
      *   *Tone:* Professional, empathetic, philosophically rigorous but practical.
      *   *Structure:*
          1.  Introduction (Validating the user's insight).
          2.  The Procedure (The "Spectator's Audit").
          3.  Case Application 1 (Futile Treatment).
          4.  Case Application 2 (Nurses vs. Protocol).
          5.  Limitations (What the procedure can't do).
      *   *Self-Correction during drafting:* I need to make sure I don't just turn this into a standard bioethics checklist. It *must* feel like Adam Smith. Use terms like "man within the breast," "proprietor," "sympathy." Ensure the "Praised vs. Praiseworthy" distinction is explicit in the steps.

  7.  **Final Review against Constraints:**
      *   Concrete steps? Yes.
      *   Sufficient answers defined? Yes.
      *   Stop point identified? Yes.
      *   Smith's specific concepts included? Yes.
      *   Two cases run? Yes.
      *   One unwelcome result? Yes (Case 1).
      *   Honest about limitations? Yes.

  8.  *(Self-Correction on Case 1)*: Initially, I might lean towards the family. But to make it truly "Smithian," the focus should be on the *committee's* motivation. Are they siding with the doctors to avoid conflict (praise) or because it's right (praiseworthy)? Let's make the procedure reveal that the committee is unconsciously protecting the doctors' ego/comfort under the guise of "futility."

  9.  *(Self-Correction on Case 2)*: Ensure the nurses' "feeling wrong" isn't just emotional but treated as moral data the Spectator would consider.

  10. **Final Polish:** Check tone. Ensure it sounds like a tool for a colleague, not a lecture. (Proceed to generate output).

  *(Note: Adam Smith's "Impartial Spectator" is from *The Theory of Moral Sentiments*, not *Wealth of Nations*. Ensure accurate philosophical representation.)*
  *(Key Smithian nuance: The Spectator isn't perfect; it's an aspirational construct we build through social interaction. The procedure should reflect this construction.)*

  Let's build the "Spectator's Audit."

  *Step 1: The View from Nowhere (Fact & Distance).*
  *Step 2: The Praise/Praiseworthy Distinction.*
  *Step 3: The Custom Audit.*
  *Step 4: The Verdict.*

