answer: |-
  Here are 10 questions designed to test the internal consistency of a hard-line Augustinian view on lying. They are drafted to be conversational but philosophically rigorous, with follow-ups keyed to the standard defenses an Augustinian typically employs.

  ### 1. The Misleading Truth vs. The Lie
  **Question:** You draw a bright line between lying and concealing the truth through silence. But consider the "misleading truth." If a murderer asks where my friend is, and I say, "I saw him an hour ago at the library," knowing full well he has since moved to my attic, I have spoken a truth, but I intend for you to infer a falsehood. Is that morally distinct from saying, "He is at the library"? If the intention to deceive is identical, what makes the metaphysical structure of the speech act different enough to carry the weight of a mortal sin in one case and not the other?

  **Follow-up (If he says the intention isn't enough to make it a lie):** You mentioned earlier that tone matters. If I say "I won't tell you" to a pursuer, but I use an evasive tone that I *know* will make them think the fugitive isn't here, haven't I used a true statement to execute a lie? If that's permissible, isn't your prohibition just about syntax and not the actual moral harm of deception?

  ### 2. The Lying to God Problem
  **Question:** In Acts 5, Peter says Ananias and Sapphira have lied to the Holy Spirit. But on your definition, a lie requires an intention to deceive. Since God is omniscient, it is impossible to intend to deceive God; He cannot be fooled. So, we have a dilemma: either lying does not require an intention to deceive, or Ananias did not actually lie to God. Which horn do you take?

  **Follow-up (If he says lying doesn't require intent to deceive):** If intent to deceive isn't necessary, then what distinguishes a lie from a mistake or a work of fiction? When I read a novel, I am uttering falsehoods without intent to deceive the reader about reality. If you remove the intent requirement to solve the Ananias problem, do novelists become liars?
  **Follow-up (If he says Ananias didn't technically lie to God):** If it wasn't a lie, what was the specific sin? Was it merely withholding property? If so, why does the text explicitly use the language of deception and lying to the Spirit?

  ### 3. The Rahab Dilemma
  **Question:** Let's look at Rahab in Joshua 2. She hides the spies and tells the soldiers, "The men came to me, but I do not know where they went." Augustine argues she lied and it was a sin, albeit one God used for good. But Hebrews 11 commends her *faith* in the very same context as her action. If her action was intrinsically evil, how can it be an expression of saving faith? Are we to believe she was justified *despite* her lie, or that her lie was somehow constitutive of her faith?

  **Follow-up (If he says she wasn't obliged to tell the truth to enemies):** If she had no duty of truthfulness to the soldiers because they were unjust aggressors, doesn't that make the duty to truth context-dependent? You argue the prohibition is absolute, but if the *obligation to speak truth* vanishes based on the listener's moral status, aren't you admitting the rule isn't absolute after all?

  ### 4. The Undercover Analogy (Priscillianist Case)
  **Question:** Augustine forbade Catholics from pretending to be Priscillianists to infiltrate them. But consider a modern undercover narcotics officer. He says to a dealer, "I want to buy drugs." He does not want to buy drugs; he wants to make an arrest. Is that statement a lie? If you say it's not a lie because it's not a genuine "assertion," then what defines an assertion?

  **Follow-up (If he says the cop isn't asserting, just role-playing):** If the cop can say "I am a buyer" as a non-assertion within a role, why can't the Catholic say "I am a Priscillianist" as a non-assertion within a theological role-play? What is the moral difference between infiltrating a drug ring to save lives and infiltrating a heresy to save souls? If the latter is forbidden but the former permitted, is the distinction political rather than moral?

  ### 5. The Officious Lie and Moral Residue
  **Question:** Augustine classifies the "officious lie"—one that helps someone and harms no one—as a venial sin. It's still a sin, but a minor one. If I tell such a lie to save an innocent life, and you say it is objectively a sin, does that mean I should feel guilty? Should I confess this in penance?

  **Follow-up (If he says yes, you should feel guilt):** So a person who sacrifices their own moral purity to save a neighbor's life should carry the burden of guilt for doing the loving thing? That seems to pit the virtue of charity against the virtue of truth.
  **Follow-up (If he says no, you shouldn't feel guilt):** If I shouldn't feel guilt or confess it, in what sense is it a "sin"? If it leaves no moral stain on the soul and requires no repentance, are we just arguing over semantics?

  ### 6. Mental Reservation and Equivocation
  **Question:** Augustine condemned the Priscillianists for holding the truth in their hearts while speaking falsehoods. Yet, later Catholic moral theology developed "mental reservation"—where you say something literally true but intend it to be understood falsely, or add a silent qualification. For example, saying "I am not a priest" while mentally adding "of Baal." Is mental reservation a lie?

  **Follow-up (If he says it is NOT a lie because the words are technically true):** Isn't that just a verbal trick? If the social function of speech is to convey meaning to the listener, and I knowingly manipulate the words to convey a meaning I know is false, haven't I violated the purpose of speech just as much as if I spoke a falsehood?
  **Follow-up (If he says it IS a lie):** Then you are condemning a practice endorsed by major Catholic moral theologians for centuries as a legitimate way to protect secrets. Are you prepared to say that the standard Catholic casuistry on this point is erroneous?

  ### 7. The Lying Spirit of 1 Kings 22
  **Question:** In 1 Kings 22, God permits a "lying spirit" to go forth and deceive Ahab to bring about judgment. Augustine says God permits evil but does not do it. But the text says the Lord *put* the spirit there. If God can orchestrate a deception to bring about a just end (the downfall of a wicked king), why is it impermissible for us to orchestrate a deception to bring about a just end (saving a fugitive)?

  **Follow-up (If he says God's ways are not our ways):** Does that mean the prohibition on lying is not grounded in the *nature* of lying itself, but merely in our epistemic limits? If lying is intrinsically evil, how can God use it as an instrument of justice without compromising His own nature? If He can use it, why is the ontological status of the act different for us?

  ### 8. The Fiction and Joke Distinction
  **Question:** You argue jokes aren't lies because there's no intention to deceive. But fiction also has no intention to deceive; we know the story isn't real. Yet fiction involves "false signification." If I write a novel where a murder takes place that never happened, am I bearing false witness? If not, why not?

  **Follow-up (If he says fiction is not an assertion):** What makes something an assertion? Is it the intention to be taken as true? If so, then a lie isn't just a "false signification," it's a "false assertion." But if the core sin is the breach of the assertoric norm, doesn't that mean the problem is the *betrayal of trust* rather than the falsity itself? And if it's betrayal of trust, couldn't that be overridden by a higher duty?

  ### 9. The Coded Signal Problem
  **Question:** Imagine a POW says to a guard, "The weather is nice," when it is raining. He says this to signal a compatriot that the coast is clear. The guard hears a false statement about the weather. The compatriot hears a true statement about safety. Is this a lie?

  **Follow-up (If he says it's a lie because the statement to the guard is false):** But the prisoner doesn't care what the guard believes about the weather. The "assertion" isn't directed at the guard. If the same words can be a lie or not depending on who is listening and what code they know, doesn't that make the moral status of the speech act dependent on the audience's knowledge rather than the speaker's intent?
  **Follow-up (If he says it's not a lie because the intent isn't to deceive the guard):** Then intention is doing all the work. If intention determines it's not a lie here, why can't intention determine it's not a lie when I tell a murderer I don't know where his victim is?

  ### 10. Virtue vs. Absolute Duty
  **Question:** Finally, is truthfulness a virtue in the Aristotelian sense, or is it an absolute duty? If it's a virtue, it's a mean between extremes, and virtues can sometimes be overridden by other virtues (like justice or charity). If it's an absolute duty, it's not really a virtue, it's a law. Which is it?

  **Follow-up (If he says it's a virtue):** What is the extreme of "too much truthfulness"? Is there a point where telling the truth becomes vicious? If you say "no, you can never tell too much truth," then it's not a virtue in the mean sense, it's a rigid rule.
  **Follow-up (If he says it's an absolute duty):** If it's an absolute duty that cannot be overridden by charity or justice, does that make truthfulness a higher value than human life? If I must let a man die rather than violate the duty of truth, aren't you making truth an idol?
