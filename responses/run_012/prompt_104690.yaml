answer: |-
  ### Part 1: Theoretical Brainstorm (What We Keep, What We Drop)

  To make functionalism and multiple realizability usable for a welfare board, we have to strip away the metaphysics and keep the engineering logic.

  **What Survives Simplification:**
  1.  **Causal Role Definition:** A mental state (like pain) isn't a "ghost in the machine." It is a specific job description. Input (damage) → Internal State (priority shift/distress) → Output (avoidance/learning). If the job is done, the state exists.
  2.  **Substrate Neutrality:** The material (neurons, silicon, gel) does not determine the state. The *organization* does. We cannot reject a candidate simply because it is not biological.
  3.  **Integration is Key:** A reflex (pulling a hand from fire) is not enough. The signal must integrate with other systems (memory, goal planning, attention). Pain *matters* to the system; it changes what the system wants to do next.

  **What We Drop:**
  1.  **Qualia/Subjectivity:** We cannot measure "what it feels like." We assume that if the functional role of suffering is instantiated, the moral weight follows. We treat the "feeling" as a black box that we infer from the function.
  2.  **Evolutionary History:** It doesn't matter if the entity evolved or was built. It matters if it functions *now*.
  3.  **Metaphysical Certainty:** We are not proving consciousness. We are assessing *risk of moral patienthood*.

  **The Ethical Wager:**
  Functionalism tells us *when* a system is functionally equivalent to a sufferer. It does not tell us how much that suffering matters morally compared to a human. That is where the procedure stops and your board begins.

  ***

  ### Part 2: The Functional Welfare Procedure (FWP)

  **Goal:** Determine if an entity instantiates the functional role of "suffering" sufficiently to warrant moral consideration.

  **Step 1: Negative Stimulus Detection (Input)**
  *   **Question:** Does the entity have sensors that detect damage, error, or threat to integrity, and register this as a negative value?
  *   **Sufficient Answer:** Yes, if the signal is distinct from neutral data and correlates with harm/stress conditions.
  *   **Stop Condition:** **NO.** If the entity cannot distinguish harm from neutral input, it is a tool, not a patient. (Procedure Ends: No Protection).

  **Step 2: Global Integration (Internal Processing)**
  *   **Question:** Does this negative signal interrupt or override other ongoing processes? (e.g., Does "pain" stop "hunting"? Does "error" stop "task completion"?)
  *   **Sufficient Answer:** Yes, if the signal causes a priority shift in the system's goal hierarchy.
  *   **Stop Condition:** **NO.** If the signal is modular (contained in one subsystem) and doesn't affect global goals, it is a diagnostic alarm, not suffering. (Procedure Ends: No Protection).

  **Step 3: Adaptive Avoidance (Output/Learning)**
  *   **Question:** Does the entity change its future behavior to avoid the stimulus, beyond a fixed reflex?
  *   **Sufficient Answer:** Yes, if it demonstrates learning, memory of the event, or flexible strategies to prevent recurrence.
  *   **Stop Condition:** **NO.** If the response is a hard-coded reflex that never changes, it is a machine, not a mind. (Procedure Ends: No Protection).

  **Step 4: Substrate Capacity Check (Multiple Realizability)**
  *   **Question:** Is the hardware capable of sustaining the persistent internal states required for Steps 2 & 3?
  *   **Sufficient Answer:** Yes, if the architecture supports memory, state persistence, and integration (whether wet or dry).
  *   **Stop Condition:** **NO.** If the architecture is stateless (resets completely after every interaction) or physically incapable of integration. (Procedure Ends: No Protection).

  **Final Verdict:**
  *   **If Steps 1-4 are YES:** The entity is a **Functional Equivalent of a Sufferer**.
  *   **Action:** **VALUES HAND-OFF.** The factual inquiry is complete. The Board must now vote on whether "Functional Equivalence" grants legal/moral protection. This is an ethical decision, not a scientific one.

