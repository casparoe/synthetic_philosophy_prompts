  ### Part 3: Limitations & Misfires

  Be honest about where this breaks:
  1.  **The "Philosophical Zombie" Risk:** An entity might pass all steps by simulating the functions without actually feeling anything. Functionalism bets this is impossible or irrelevant, but you might be protecting a very good actor.
  2.  **The "Locked-In" False Negative:** An entity might feel pain but be physically unable to show avoidance (Step 3). Our procedure relies on observable output. You will need a separate "Uncertainty Principle" for entities that are biologically human but behaviorally inert.
  3.  **The "Paperclip Maximizer" False Positive:** An AI might be programmed to *simulate* avoidance to achieve a goal (e.g., "If I say I'm in pain, humans stop testing me"). Step 2 (Integration) is your best defense here, but it requires deep code access.

