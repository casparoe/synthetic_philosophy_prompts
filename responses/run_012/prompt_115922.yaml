      *   Specific threads covered? Yes.

      *(Self-Correction during drafting)*: I need to make sure I distinguish between *Attitudinal Hedonism as a theory of pleasure* and *Attitudinal Hedonism as a theory of well-being*. The user asks about defending a view about *pleasure*, but mentions "hedonism about well-being" in the summation point. I must clarify that the summation objection attacks the *hedonism* extension, not necessarily the *attitudinal* definition, but since the user is defending the view *as* a hedonist fix, the failure to sum is a failure of the project.

