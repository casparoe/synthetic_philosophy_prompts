  **COVENANT OF THE RESIDENCE AT OAKWOOD**

  **PREAMBLE**
  The undersigned residents, seeking to constitute themselves as a plural subject, adopt this Covenant to regulate the formation, maintenance, and dissolution of Shared Intentions within the Property.

  **ARTICLE I: NATURE OF THE WE-INTENTION**
  1.1 A "We-Intention" is distinct from an aggregation of "I-Intentions." Mere coincidence of individual desires regarding communal maintenance constitutes parallelism, not joint action.
  1.2 The We-Intention is a primitive mode of existence. It resides in the collective subject and is not reducible to the sum of individual mental states. The Community may intend a state of affairs that no individual member currently intends.
  1.3 Shared Intentions shall be treated as administrative facts. They are subject to registration, audit, and inspection by the appointed Registrar of Mental States.

  **ARTICLE II: CONDITIONS OF FORMATION**
  2.1 A Shared Intention is constituted only when members demonstrate mutual responsiveness to each other's intentions and subplans.
  2.2 Common Knowledge is required. It must be open to all members that all members intend the joint action. Private assent is insufficient.
  2.3 To establish Common Knowledge, all intentions must be registered with the Clerk. Unregistered intentions are deemed non-existent for the purposes of collective action.

  **ARTICLE III: OBLIGATIONS AND COMMITMENT**
  3.1 Upon formation of a Joint Commitment, members are obligated to each other to uphold the intention.
  3.2 A member who changes her mind remains bound by the commitment. Personal desire is irrelevant to the validity of the joint obligation.
  3.3 Members are authorized to rebuke defectors. The right to rebuke arises from the commitment itself, not from individual harm or inconvenience.
  3.4 The obligation persists independently of the member's continued willingness to participate.

  **ARTICLE IV: MODIFICATION AND WITHDRAWAL**
  4.1 A Shared Intention may be modified only by unanimous consent of all participating members.
  4.2 No member may unilaterally withdraw from a Joint Commitment without the permission of the collective.
  4.3 Withdrawal requires a formal declaration that the individual no longer subscribes to the we-mode.

  **ARTICLE V: TERMINATION AND DISSOLUTION**
  5.1 A Shared Intention is extinguished upon the formal dissolution of the Community.
  5.2 Defection by a single member nullifies the specific intention regarding that member, but not the collective state.
  5.3 The death of a member does not extinguish their contribution to the We-Intention. The deceased shall be counted as consenting in perpetuity to all prior commitments.
  5.4 The estate of the deceased is liable for failures to act on behalf of the deceased's continued intention.

  **ARTICLE VI: AMENDMENT AND CONTRADICTION**
  6.1 This Covenant may be amended by a majority vote of living residents.
  6.2 Notwithstanding Article 4.2, any member may withdraw from any Shared Intention immediately upon filing Form 12-B.
  6.3 The Community asserts that mental states are public facts subject to audit.
  6.4 In the event of conflict between Articles, the intention of the Group shall supersede the text of the Covenant.

  **EXECUTION**
  Executed this day, by the undersigned, intending jointly to be bound.
