  Asymmetry says: The 90 extra people in Option 1 are not "missed" in Option 2. So Option 2 is not worse than Option 1 regarding those 90.
  Is Option 1 better? Only if the 10 are *better off* in Option 1. If they are equally happy, the Asymmetry says the outcomes are *equal in value*.
  This is the "Mere Addition" paradox territory.
