answer: |-
  This is a classic metaontological puzzle, and Dana's track record is fascinatingly specific. She isn't just a "verbal dispute maximalist" (someone who thinks *everything* is verbal), nor is she a hardline realist. She draws a line, and your job is to find where that line cuts through the "Self" debate.

  As a philosopher of language working in this neighborhood (think Hirsch, Chalmers, Carnap), I can tell you that predicting a specific philosopher's intuitions is always risky because metaontology is often driven by unpublished "seemings." However, Dana's rulings are consistent enough to extract a working heuristic.

  Here is the breakdown of the candidate rules, their predictions, and my best guess on Dana's verdict.

  ### Candidate Rules Fit for Dana's Track Record

  **Rule 1: The "Folk Category vs. Fundamental Ontology" Distinction**
  *   **The Principle:** Disputes about folk categories or high-level classifications (Planets, Sandwiches, Fruit, Life) are verbal because nature doesn't care about our boundaries. Disputes about fundamental ontology or the structure of reality (Wave Functions, Time, Causal Power) are genuine.
  *   **Fits Data:** Perfectly explains Pluto, Hot Dog, Tomato, Virus (Verbal) vs. Wave Function, Presentism (Genuine).
  *   **Tension:** Free Will. "Free Will" is a folk category, yet she ruled it *Genuine*. This suggests Rule 1 is too simple. She likely thinks Free Will touches on *causal power* or *moral responsibility*, which are fundamental in a way "Planet" is not.

  **Rule 2: The "Agreement on Non-Linguistic Facts" Test (The Chalmers/Hirsch Standard)**
  *   **The Principle:** A dispute is verbal if and only if the parties agree on all the underlying physical, functional, and psychological facts, and disagree *only* on how to map words onto those facts. It is genuine if there is a disagreement about the facts themselves (e.g., does the wave function collapse? do past moments exist?).
  *   **Fits Data:** Fits Pluto (physics unchanged), Virus (biology unchanged). Fits Wave Function (Realists say entity exists, Instrumentalists say it doesn't — ontological disagreement). Fits Presentism (disagreement on what exists).
  *   **Tension:** Free Will. Compatibilists and Incompatibilists often claim to agree on the physics (determinism) but disagree on whether "freedom" is possible. If Dana says that's *Genuine*, she believes "freedom" tracks a real capacity that is either present or absent, not just a label.

  **Rule 3: The "Explanatory Indispensability" Rule**
  *   **The Principle:** A dispute is verbal if positing the entity adds no explanatory power beyond the underlying mechanics. It is genuine if the entity is required to explain phenomena (prediction, ethics, experience).
  *   **Fits Data:** "Alive" adds nothing to virology (Verbal). "Planet" adds nothing to astronomy (Verbal). Wave Function realism explains measurement (Genuine). Time structure explains relativity/causality (Genuine).
  *   **Tension:** Free Will. Does "Free Will" explain anything? If Dana says it's Genuine, she likely thinks it explains *moral responsibility* or *agency* in a way that mere determinism cannot.

  ---

  ### Application to the "Self" Case

  You noted that in your feature, "the two sides agree on basically all the psychology... and the fight is over whether that counts as a self."

  *   **Under Rule 1 (Folk vs. Fundamental):** "Self" is a folk category, but like Free Will, it underpins ethics and experience. *Prediction: Ambiguous/Leaning Genuine.*
  *   **Under Rule 2 (Agreement on Facts):** You state they agree on the psychology (no homunculus, constructed moment-to-moment). If they truly agree on the *mechanism* and the *phenomenology*, and only disagree on the label "Self," this is the textbook definition of a verbal dispute. *Prediction: Verbal.*
  *   **Under Rule 3 (Explanatory Power):** If the Illusionists say "The self explains nothing, only the processes do," and Realists say "The self explains unity of experience," but they agree on the processes, the "Self" is likely just a name for the process. *Prediction: Verbal.*

  ### The Verdict

  **Best Guess:** Dana will rule the "Self" debate **VERBAL**.

  **Confidence Level:** **80%**

  **Closest Precedent:** **"Is a virus alive?"**
  *   **Why:** In the virus case, biologists agree on the replication mechanism, the protein coat, the lack of metabolism. The dispute is purely about whether that cluster of traits meets the threshold for the word "life." In the Self case, psychologists agree on the narrative construction, the lack of a homunculus, the neural correlates. The dispute is purely about whether that cluster of traits meets the threshold for the word "self."
  *   **Why not Free Will?** The Free Will ruling is the outlier that threatens this prediction. However, Free Will disputes usually involve disagreement about *counterfactuals* ("Could I have done otherwise?"). The Self dispute you described is about *ontology* ("Is this thing a self?"). If the Illusionists aren't denying the *capacity for agency* (which would make it like Free Will), but only denying the *entity of the self*, it reverts to the Virus/Pluto pattern.

  ### The Distinguishing Case (The "Crucial Experiment")

  To be sure, you need to ask Dana about a case that separates **Rule 1 (Folk Category)** from **Rule 2 (Agreement on Facts)** in the context of agency.

  **The Case:** **"Is a sophisticated AI (or a thermostat) a 'believer'?"** (Dennett's Intentional Stance).
  *   **Scenario:** Everyone agrees on the physical circuitry of the AI. One side says "It has beliefs." The other says "It simulates beliefs but doesn't have real ones."
  *   **If Dana says VERBAL:** She is committed to the principle that **Ontology is fixed by fundamental physics/psychology, and high-level intentional terms are pragmatic tools.** This confirms the "Self" is verbal.
  *   **If Dana says GENUINE:** She is committed to the principle that **Functional patterns constitute reality regardless of substrate.** This would suggest she might view the "Self" as Genuine (because the functional pattern of the self is real), aligning it closer to her Free Will ruling.

  ### The Principles at Stake

  If you quote her, be aware that by ruling "Verbal" on the Self, she is committing herself to a specific metaontological principle:

  *   **If Verbal:** She is endorsing a form of **Ontological Deflationism**. She is saying that "Self" is a *concept* we use to navigate the world, not a *constituent* of the world. The Illusionists are right that there is no "Self-thing," but the Realists are right that there is a "Self-process," and fighting over the noun is a waste of time.
  *   **If Genuine:** She is endorsing **Ontological Realism about Functional Kinds**. She is saying that if a functional pattern (the constructed self) plays a causal role in our lives (suffering, planning, memory), it is as real as a wave function or a moment in time.

  ### A Warning (The "Humoring You" Clause)

  There is a 20% chance I am wrong because Dana's ruling on **Free Will Compatibilism** is idiosyncratic. Most philosophers who call Pluto/Virus disputes "verbal" *also* call Compatibilism "verbal" (arguing that Compatibilists change the subject on 'freedom').

  The fact that Dana calls Compatibilism **Genuine** suggests she has a high tolerance for "realness" in functional capacities. If she views the "Self" not as an object, but as a *capacity for ownership*, she might break from the Virus precedent and side with the Free Will precedent.

  **Journalistic Advice:** Frame your story around the tension between the **Virus** precedent (mechanism agreed, label disputed) and the **Free Will** precedent (functional capacity is real). Ask Dana specifically: *"Is the Self more like a Virus (a boundary case for a label) or more like Free Will (a functional capacity that grounds responsibility)?"* Her answer to that analogy will tell you more than any abstract rule.
