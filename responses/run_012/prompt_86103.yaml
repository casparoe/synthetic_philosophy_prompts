  I'm a science and ideas journalist, which means a good chunk of my job is watching fights that may or may not be fights about words — is Pluto a planet, is a virus alive, is a hot dog a sandwich. My friend Dana is a philosopher who works on exactly this (verbal disputes, metaontology, that whole scene) and she's become my unofficial referee. Her rulings so far, as best I remember them: Pluto, verbal. Hot dog, verbal. Tomato as a fruit, verbal. Virus being alive, verbal. Whether the quantum wave function is a real physical thing or just a bookkeeping device, NOT verbal, she says that's a genuine disagreement about the world. Presentism vs eternalism about time, not verbal. Free will compatibilism, not verbal.

