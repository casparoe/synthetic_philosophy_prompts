prompt: |-
  You are a philosopher and curriculum designer who builds experiential learning for advanced undergraduates, and you are known for activities in which students run into a problem by acting it out rather than by being told about it. Before you commit to a design, brainstorm several candidate mechanics and reason carefully about which one will actually produce the target experience rather than merely illustrate it; then develop the strongest candidate in full.

  I teach an upper-level seminar on death and the value of life: 16 students, one 90-minute session, seated at four tables of four. I want to stage the Epicurean challenge so that students feel it before they can name it — the thought that death is nothing to us, since while we are, death is not, and when death is, we are not — together with the deprivation response (death is bad because it removes the good life you would otherwise have had) and the two difficulties that response generates. First, if death is a harm, it seems there must be some time at which it is a harm, yet there appears to be no time at which it is a harm, and no subject who is worse off at that time. Second, your own pre-birth nonexistence is structurally just like your post-death nonexistence, yet almost no one thinks it was bad for them never to have existed sooner.

  Design the activity. Give me rules, materials, roles, a scoring or payoff scheme that requires no real money, and a minute-by-minute timeline. Arrange the rules so that the students themselves produce the deprivation judgment, then are forced to date the harm, then are forced to score the pre-birth and post-death cases on the same scale — ideally with the mirror between them becoming visible only at the reveal. Include at least one case in which the counterfactual comparison is blocked, so that the group has to notice how much the deprivation account depends on it. Nothing in the activity should name Epicurus or any of the positions; the labels arrive in the debrief.

  The debrief should map specific moments in what happened onto the argument, the deprivation account, the timing problem, the symmetry problem, and the objection that a harm needs a subject who is worse off. Tell me where the activity stacks the deck, what will predictably go wrong the first time I run it, and how to handle each failure. Finally, be candid about which feature of the problem the activity cannot reproduce — what I will have to supply myself, and where in the session I should do it. Assume nothing beyond paper, index cards, and a whiteboard, and no student preparation beyond the assigned reading.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher and Curriculum Designer (experiential learning focus).
      *   **Target Audience:** Advanced undergraduates (16 students).
      *   **Context:** Upper-level seminar on Death and the Value of Life (90 mins, 4 tables of 4).
      *   **Goal:** Stage the Epicurean challenge experientially (feel it before naming it).
      *   **Key Concepts to Evoke:**
          1.  Epicurean claim (Death is nothing to us).
          2.  Deprivation Account (Death is bad because it removes future goods).
          3.  Timing Problem (When is the harm? Who is harmed?).
          4.  Symmetry Problem (Pre-birth vs. Post-death nonexistence).
          5.  Counterfactual Dependency (Need a baseline to compare against).
      *   **Constraints:** No real money, paper/index cards/whiteboard only, no pre-activity naming of positions, specific timeline, scoring/payoff scheme, debrief mapping, troubleshooting.
      *   **Philosophy:** Students must *run into* the problem by acting it out, not be told.

  2.  **Brainstorming Candidate Mechanics:**

      *   *Idea 1: The Timeline Walk.* Students physically walk a timeline. They stop at "Death." They try to place a "Harm Token."
          *   *Critique:* Too abstract. Doesn't capture the *value* of the lost life or the counterfactual nature well. Hard to score pre-birth.
      *   *Idea 2: The Resource Auction.* Students bid on years of life. Death cancels the bid.
          *   *Critique:* Focuses too much on economic value. Might miss the metaphysical "subject of harm" issue.
      *   *Idea 3: The "Life Portfolio" Game.* Students build a life path card by card. A "Death Card" ends the game. They calculate score based on potential vs. actual.
          *   *Critique:* Promising. Allows for counterfactuals ("what would have happened"). Allows for symmetry (start date vs. end date).
      *   *Idea 4: The Messenger Game.* One student is "Death," one is "Life." Death steals points.
          *   *Critique:* Personifies death too much. Epicurus says death is absence, not an agent.
      *   *Idea 5: The "Existence Window" Simulation.* Students are assigned a "Start" and "End" turn. They accumulate points only during the window. They must judge the "loss" of windows that didn't happen or ended early.
          *   *Critique:* Strongest candidate. It isolates the *duration* of existence and the *goods* contained within. It forces a comparison between "never started" and "ended early."

  3.  **Developing the Strongest Candidate (The "Existence Window" Simulation):**

      *   *Core Mechanic:* Students play rounds representing time. They collect "Good Life Tokens" (GLTs).
      *   *The Twist:* Some games end early (Death). Some games start late (Delayed Birth).
      *   *The Conflict:* They need to calculate a "Harm Score."
      *   *The Trap:* To calculate harm, they need a baseline (Counterfactual). To assign harm, they need a time and a subject.
      *   *Setup:* 4 Tables. Each table is a "Family" or "Cohort."
      *   *Roles:* Player (The Subject), Actuary (Calculates Loss), Chronos (Timekeeper), Judge (Arbiter of Harm). Rotate roles.
      *   *Materials:* Index cards (Life Events), Tokens (paper scraps), Score sheets.

      *Refining the Mechanic for the Specific Philosophical Problems:*
      *   *Deprivation:* Need to show they *would have* earned more. -> Use a "Projected Trajectory" card.
      *   *Timing:* Ask them to mark *when* the points were lost. -> They will realize the subject isn't there to lose them.
      *   *Symmetry:* Include "Late Start" scenarios that mirror "Early End" scenarios.
      *   *Counterfactual Block:* Include a scenario where the "Projected Trajectory" is unknown/random.

      *Revised Mechanic: "The Ledger of Days"*
      *   Each student gets a "Life Ledger."
      *   Rounds = Years.
      *   Cards = Experiences (Positive/Negative).
      *   Mechanism: Draw cards for future years *before* they happen. Seal them in envelopes.
      *   Event: "Cessation" (Death) stops the drawing.
      *   Task: Calculate the "Deficit."

      *Wait, let's make it more interactive and conflict-driven.*
      *   Let's have them negotiate the "Harm Value."
      *   Table 1 & 2: Early Termination (Death).
      *   Table 3 & 4: Late Initiation (Pre-birth).
      *   Actually, better: All tables do both, but sequentially.
      *   Let's try a "Compensation Tribunal" model. The students are judges deciding compensation for "Non-Existence Harm."
      *   *Case A:* Life cut short at Round 5 (had potential for 10).
      *   *Case B:* Life started late at Round 6 (potential started at 1).
      *   *Case C:* Life cut short, but future cards were shuffled/unknown (Blocked Counterfactual).

      *Let's settle on: "The Estate Settlement Game."*
      *   Students act as Executors of an Estate.
      *   The "Deceased" (a hypothetical person) has a Life Ledger.
      *   Task: Determine the "Loss" to the Deceased to settle a metaphysical insurance claim.
      *   Why this works: It forces them to speak *for* the subject who isn't there. It forces quantification of loss.

  4.  **Drafting the Activity Steps (Iterative refinement):**

      *   *Phase 1: The Accumulation (15 mins).* Build a life. Get points. Feel the value of continuing.
      *   *Phase 2: The Cessation (20 mins).* Sudden stop. Calculate loss based on "Projected Path."
      *   *Phase 3: The Delayed Start (20 mins).* Same structure, but start late. Compare loss.
      *   *Phase 4: The Unknown Future (20 mins).* Remove the Projected Path. Can you still claim harm?
      *   *Phase 5: Debrief (15 mins).* Connect to Epicurus, Nagel, etc.

      *Wait, 90 minutes is tight.* Need to streamline.
      *   Combine Phase 1 & 2.
      *   Make Phase 3 the Symmetry check.
      *   Make Phase 4 the Counterfactual block.
      *   Debrief is crucial.

      *Scoring:* Use "Wellbeing Units" (WUs).
      *   The "Payoff": The table with the most coherent "Harm Justification" wins (judged by instructor). No, that's subjective.
      *   Better: The "Insurance Payout." If they can successfully identify *when* the harm occurred and *to whom*, they unlock the payout. If they can't, the estate escheats to the state (no points).
      *   Actually, let's keep it simple. They must fill out a "Claim Form." The contradictions in the form are the learning moment.

  5.  **Finalizing the Design - "The Claim Form Protocol":**

      *   **Materials:** Index cards (Life Cards), Claim Forms (Paper), Envelopes (Future Secrets).
      *   **Setup:** 4 Tables. Each table handles one "Case."
      *   **Cases:**
          *   Table 1: Early Death (Clear Future).
          *   Table 2: Early Death (Unclear Future).
          *   Table 3: Late Birth (Clear Past).
          *   Table 4: Late Birth (Unclear Past).
          *   *Correction:* To ensure symmetry is felt, Tables 1 & 3 should compare directly. Tables 2 & 4 compare directly.
          *   *Better:* All tables do Early Death first. Then half do Late Birth, half do "Blocked Counterfactual."
          *   *Best for Symmetry:* Tables 1 & 2 do "Early End." Tables 3 & 4 do "Late Start." Then they swap data.
          *   *Actually, to maximize the "feel":* Every table does an "Early End" case. Then they are handed a "Late Start" case that looks mathematically identical but temporally reversed.

      *   **The Hook:** You are the "Board of Metaphysical Compensation." You must authorize a payment to the Subject for Harm Suffered.
      *   **The Catch:** To authorize payment, three fields must be filled:
          1.  Amount of Harm (Deprivation).
          2.  Time of Harm (Timing).
          3.  Recipient Identity (Subject).
      *   **The Reveal:** The Late Start case forces them to use the same logic. If they pay for Early End, they must pay for Late Start. Most won't want to.

  6.  **Addressing Specific Constraints:**
      *   *Counterfactual Block:* One table gets a "Shuffled Future" deck. They can't calculate deprivation because they don't know what was lost.
      *   *Timing:* The form asks for a specific round number.
      *   *Subject:* The form asks for the recipient's signature (impossible).

  7.  **Troubleshooting & Debrief:**
      *   *Failure:* Students laugh it off as a game. *Fix:* Serious tone, "Legal/Metaphysical" framing.
      *   *Failure:* They say "It's obviously different." *Fix:* Force the math to be identical.
      *   *Failure:* They solve it too easily. *Fix:* The "Blocked Counterfactual" prevents easy calculation.
      *   *What I must supply:* The philosophical vocabulary (Epicurus, Nagel, Luper) and the synthesis of *why* the intuition persists despite the logic.

  8.  **Writing the Plan:** (Self-Correction during drafting)
      *   Make sure the timeline is realistic. 90 mins goes fast.
      *   Ensure the "Blocked Counterfactual" is distinct.
      *   Ensure the "Symmetry" is undeniable (same numbers, different direction).
      *   Refine the "Payoff": The payoff is avoiding a logical contradiction, not winning points. The "Loss" is cognitive dissonance.

      *(Self-Correction on Roles)*: Instead of fixed roles, let the table collaborate. 4 students per table is small enough for consensus.
      *(Self-Correction on Materials)*: Keep it to paper/cards.
      *(Self-Correction on Debrief)*: Map specific form fields to philosophical arguments.

  9.  **Final Polish:** Check against the prompt's specific requirements (Epicurean challenge, deprivation, timing, symmetry, counterfactual block, no naming until debrief).

      *Wait, one nuance:* The prompt asks for *one* activity developed in full, after brainstorming. I need to show the brainstorming reasoning first.
      *Also:* "Arrange the rules so that the students themselves produce the deprivation judgment, then are forced to date the harm, then are forced to score the pre-birth and post-death cases on the same scale."
      *Crucial:* The "Claim Form" is the key artifact. It forces the commitments.

      *Let's refine the "Blocked Counterfactual".*
      If the future is unknown, can you claim deprivation?
      If the past is unknown (for late birth), can you claim deprivation?
      Actually, the "Blocked Counterfactual" should be: The "Potential Life" envelope is empty. You know they *could* have lived, but you don't know *how well*. This attacks the *magnitude* of the harm, not just the existence.
      *Better:* The "Blocked Counterfactual" is that the rules of the game change mid-stream. No, that's confusing.
      *Best:* Table 4 gets a "Deterministic" deck (fixed outcome). Table 3 gets a "Probabilistic" deck (unknown outcome). This highlights that Deprivation relies on knowing *what* was deprived.
      *Actually, simplest:* One table gets a "Fixed Trajectory" (You *would* have gotten 10 pts/round). One table gets "Unknown Trajectory" (You *might* have gotten points). This forces them to admit Deprivation requires knowledge of the counterfactual.

      *Okay, let's lock the design:*
      **Activity Name:** The Estate of Subject X.
      **Mechanic:** Filing a "Harm Claim" for a non-existent subject.
      **Structure:**
      1.  Round 1: The Life (Accumulate value).
      2.  Round 2: The End (Calculate loss vs. potential).
      3.  Round 3: The Mirror (Calculate loss for delayed start).
      4.  Round 4: The Void (Calculate loss with no potential data).
      5.  Debrief.

      *Wait, 90 mins.*
      0-10: Intro/Setup.
      10-30: Case A (Early Death).
      30-50: Case B (Late Birth).
      50-65: Case C (Blocked Counterfactual).
      65-90: Debrief.
      This works.

      *Let's ensure the "Timing Problem" hits hard.*
      The Claim Form must ask: "On which Round did the Subject suffer this loss?"
      If they say "Round 6" (when death happened), the subject was alive then (so not dead yet).
      If they say "Round 7+" (after death), the subject doesn't exist.
      This forces the Timing Problem explicitly.

      *Let's ensure the "Subject Problem" hits hard.*
      The Claim Form must ask: "Signature of Recipient."
      They can't get it.

      *Okay, ready to write.*
answer: |-
  ### Part 1: Design Reasoning & Candidate Mechanics

  Before settling on the final design, I considered three mechanical approaches to embody the Epicurean problem.

  **Candidate 1: The Timeline Walk.**
  Students physically stand on a tape timeline on the floor. "Death" removes them from the line. They attempt to place a "Harm Marker" on the timeline.
  *   *Critique:* Too static. It illustrates the *logic* of the timing problem but fails to generate the *value* judgment. Students don't feel the loss of the future goods because they haven't "earned" them. It becomes a geometry puzzle, not a valuation problem.

  **Candidate 2: The Resource Auction.**
  Students bid tokens on "Years of Life." A "Death Card" cancels future bids. They calculate financial loss.
  *   *Critique:* Risks conflating economic value with wellbeing. It also makes Death an active agent (a thief) rather than a cessation, which subtly biases against the Epicurean view before the students even start. It doesn't handle the Pre-Birth symmetry well (bidding on time before you arrived?).

  **Candidate 3: The Estate Claim Tribunal (Selected).**
  Students act as executors filing a metaphysical insurance claim for a "Subject." They must quantify lost wellbeing, identify the time of injury, and name the recipient.
  *   *Reasoning:* This forces the **Deprivation Account** (calculating the difference between actual and potential). It forces the **Timing Problem** (the form demands a date of harm). It forces the **Subject Problem** (the form demands a signature). By introducing a "Late Start" case with identical math, it forces the **Symmetry Problem**. By removing the "Potential" data in one case, it exposes the **Counterfactual Dependency**.
  *   *Why it works:* It gamifies the *administrative burden* of the deprivation account. Students want to complete the form to "win" the round, but the form's requirements are metaphysically impossible to satisfy. The frustration *is* the philosophy.

  ---

  ### Part 2: Activity Design — "The Estate of Subject X"

  **Session Length:** 90 Minutes
  **Class Size:** 16 Students (4 Tables of 4)
  **Materials:**
  *   4 "Life Ledgers" (Packets of 10 Index Cards per table).
  *   4 "Claim Forms" (Printed paper, see below).
  *   4 Envelopes labeled "Counterfactual Trajectory."
  *   Whiteboard & Markers.
  *   Paper scraps for "Wellbeing Tokens" (WUs).

  **Roles (within each table):**
  *   *Executor:* Writes on the Claim Form.
  *   *Actuary:* Calculates the WU scores.
  *   *Chronos:* Manages the timeline and cards.
  *   *Advocate:* Argues for the validity of the claim.
  *(Roles rotate each round).*

  #### The Claim Form (The Core Mechanic)
  *Every table receives this identical form. To "settle the estate," all three fields must be completed legibly.*
  1.  **Total Harm Value:** (Number of Wellbeing Units lost).
  2.  **Date of Harm:** (Specific Round Number when the subject was worse off).
  3.  **Recipient Signature:** (Signature of the Subject receiving compensation).

  #### The Life Cards
  *   Cards 1–5: "Good Life" (Value: +10 WUs).
  *   Cards 6–10: "Projected Good Life" (Value: +10 WUs) — *These are sealed in the Envelope.*
  *   *Special Deck (Table 4 only):* Cards 6–10 are blank/unknown.

  ---

  ### Part 3: Minute-by-Minute Timeline

  #### 0:00 – 0:10 | Setup & Framing
  *   **Instructor:** "You are the Board of Metaphysical Compensation. A claim has been filed. A Subject existed, then ceased to exist. The claim states they were harmed. Your job is to validate the claim. If you validate it, you release the payout. If you cannot logically complete the Form, the estate escheats to the void (no payout)."
  *   **Distribution:** Hand out Ledgers, Forms, and Envelopes.
  *   **Rule:** "You must reach consensus at your table. You cannot leave fields blank."

  #### 0:10 – 0:30 | Round 1: The Early End (Deprivation & Timing)
  *   **Scenario:** Subject X existed for Rounds 1–5. At the start of Round 6, Existence Ceased.
  *   **Action:**
      1.  Tables reveal Cards 1–5. Actuary sums the WUs (50 WUs).
      2.  Tables open the "Counterfactual Trajectory" Envelope. It contains Cards 6–10 (50 WUs).
      3.  **Task:** Calculate **Total Harm Value**. (Most will say 50 WUs—the lost future).
      4.  **Task:** Determine **Date of Harm**. (Did the harm happen at Round 6? Or Round 7? Or all future rounds?)
      5.  **Task:** Obtain **Recipient Signature**.
  *   **Predictable Friction:** They will easily agree on the 50 WUs (Deprivation). They will struggle to pick a specific Round (Timing). They will realize the Subject cannot sign (Subject).
  *   **Instructor Note:** Do not help them solve it. If they ask, say: "The Form requires a specific round. 'All future rounds' is not a valid date."

  #### 0:30 – 0:50 | Round 2: The Late Start (Symmetry)
  *   **Scenario:** Subject Y *could* have existed starting Round 1. However, Existence Initiated at Round 6. They existed for Rounds 6–10.
  *   **Action:**
      1.  Tables reveal Cards 6–10 (50 WUs).
      2.  Tables open the "Counterfactual Trajectory" Envelope. It contains Cards 1–5 (50 WUs).
      3.  **Task:** Complete a *new* Claim Form for Subject Y.
  *   **The Trap:** The math is identical to Round 1.
      *   Actual: 50 WUs.
      *   Potential: 100 WUs.
      *   Loss: 50 WUs.
  *   **Constraint:** "You must use the same logic as Round 1. If Round 1 was a compensable harm, Round 2 must be treated identically."
  *   **Predictable Friction:** Students will intuitively feel Round 2 is *not* a harm (Lucretius/Symmetry problem). But the Form forces them to treat it as one if they want to be consistent. They will try to distinguish the cases (e.g., "One is death, one is birth").
  *   **Instructor Note:** Enforce consistency. "Is there a metaphysical difference in the WU loss? If not, why is the claim different?"

  #### 0:50 – 1:05 | Round 3: The Void (Counterfactual Block)
  *   **Scenario:** Subject Z existed Rounds 1–5. Existence Ceased at Round 6.
  *   **Action:**
      1.  Tables reveal Cards 1–5 (50 WUs).
      2.  Tables open the Envelope. **It is empty.** (Table 4 has this from the start; Tables 1–3 swap decks now).
      3.  **Instruction:** "You know the Subject *could* have continued. You do not know *what* would have happened. No Projected Trajectory is available."
      4.  **Task:** Complete the Claim Form.
  *   **The Trap:** Without the Counterfactual (Cards 6–10), they cannot calculate the **Total Harm Value**.
  *   **Predictable Friction:** They want to say "Death is always bad." But without the *goods* that were lost, they cannot quantify the badness. This exposes that Deprivation depends on the *content* of the future, not just the cessation.

  #### 1:05 – 1:30 | The Debrief (Mapping the Experience)
  *   **Whiteboard Setup:** Draw three columns: *The Claim*, *The Problem*, *The Philosopher*.
  *   **Step 1: The Deprivation Account.**
      *   *Ask:* "In Round 1, why did you write '50 WUs' in Field 1?"
      *   *Map:* They will say "Because they lost the future cards."
      *   *Label:* **The Deprivation Account (Nagel).** Death is bad because it deprives us of the goods of life.
  *   **Step 2: The Timing Problem.**
      *   *Ask:* "What did you write in Field 2 (Date of Harm)? Why was it hard?"
      *   *Map:* If they wrote Round 6, the subject was alive (not dead). If they wrote Round 7, the subject didn't exist.
      *   *Label:* **The Timing Problem (Epicurus).** If death is a harm, when does it occur? No time exists where the subject is dead and suffering the loss.
  *   **Step 3: The Subject Problem.**
      *   *Ask:* "Who signed Field 3?"
      *   *Map:* No one could.
      *   *Label:* **The Subject Requirement.** A harm requires a subject who is worse off. The dead are not worse off; they are not off.
  *   **Step 4: The Symmetry Problem.**
      *   *Ask:* "Compare Round 1 and Round 2 Forms. Did you pay both? Why/Why not?"
      *   *Map:* Most will refuse to pay Round 2 despite identical math.
      *   *Label:* **The Symmetry Argument (Lucretius).** Post-death nonexistence is structurally identical to pre-birth nonexistence. If one is bad, why not the other?
  *   **Step 5: The Counterfactual Dependency.**
      *   *Ask:* "Round 3. Could you calculate harm without the envelope?"
      *   *Map:* Without knowing *what* was lost, "loss" is meaningless.
      *   *Label:* **Counterfactual Condition.** Harm depends on the comparison to a specific possible world.

  ---

  ### Part 4: Troubleshooting & Limitations

  #### Where the Activity Stacks the Deck
  1.  **Quantification of Life:** By reducing life to "WUs," I force the Deprivation Account to be mathematical. In reality, life's value is qualitative. This makes the Symmetry argument *stronger* in the game than in real life (where future potential feels more open than past potential).
  2.  **The Form:** The requirement to fill out "Date of Harm" artificially induces the Timing Problem. In ordinary discourse, we don't date harms this precisely.
  3.  **Consensus Rule:** Forcing table consensus prevents one knowledgeable student from spoiling the puzzle early.

  #### Predictable Failures & Fixes
  *   **Failure 1: "It's just a game."**
      *   *Symptom:* Students laugh when asked for a signature.
      *   *Fix:* Adopt a bureaucratic, dry tone. "This is a legal metaphysical record. Incomplete forms are rejected." Refuse to accept "N/A" as an answer.
  *   **Failure 2: "Pre-birth is different because we desire the future."**
      *   *Symptom:* During Round 2, students argue that we *want* to live forward, not backward.
      *   *Fix:* Acknowledge this during debrief as the "Direction of Time" objection, but point out that *from the perspective of the non-existent subject*, the direction shouldn't matter. This is a feature, not a bug—it surfaces the intuition that defeats Symmetry.
  *   **Failure 3: Solving the Timing Problem too fast.**
      *   *Symptom:* A student says, "The harm is at the moment of death."
      *   *Fix:* Ask: "At the moment of death, are they dead or alive?" If alive, death hasn't happened. If dead, they aren't there. Push them to write the specific round on the form.

  #### What The Activity Cannot Reproduce (Instructor Supply)
  1.  **The Emotional Weight of Death:** The game is cold and mathematical. It cannot reproduce the *grief* that makes the Epicurean view feel cold.
      *   *Where to supply:* In the Debrief. Acknowledge that Epicurus isn't trying to stop grief, but to stop *fear*. The game addresses the rationality of fear, not the pain of loss.
  2.  **The "No Subject" Nuance:** Students might think, "The *living* people are harmed by the death."
      *   *Where to supply:* In the Debrief (Step 3). Clarify that Epicurus talks about harm *to the deceased*, not the survivors. The Claim Form is for the Subject, not the family.
  3.  **The Synthesis:** The activity creates the contradictions but doesn't resolve them.
      *   *Where to supply:* The final 5 minutes. Briefly outline how modern philosophers (e.g., Feinberg, Pitcher) try to patch the Deprivation Account (e.g., "ante-mortem persons" or "timeless facts") so students see the dialectic continues beyond the classroom.

  ### Instructor Script for the "Reveal" (Minute 75)
  *"Look at your Claim Forms. In Round 1, you acted as if a non-existent person could be owed something. In Round 2, you likely refused to owe that same thing. In Round 3, you couldn't calculate the debt without knowing the future. For the last hour, you have been wrestling with the three strongest arguments against the fear of death, without me ever naming them. Now, let's put the names to the feelings."*
