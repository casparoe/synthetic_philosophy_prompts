answer: |-
  I step off the path to save thirty seconds.
  The grass bends, the dirt shows through.
  *what if we all did it too*
  Then there is no path, only mud.
  The shortcut vanishes under our feet.
  I cannot walk where nothing grows.

  I keep my hands in my pockets on the train.
  A stranger struggles with a heavy door.
  *what if we all did it too*
  The car fills with people carrying weight alone.
  The doors still open, the train still runs.
  But I cannot will the day I need the hand.

  One breaks the path, one breaks the will.
  *what if we all did it too*
  The mirror holds both kinds of ghost.

  ***

  **Note for the group**

  **What is settled:** There is a standard distinction between a *contradiction in conception* (Half 1) and a *contradiction in will* (Half 2). The first generates "perfect duties" (actions that become impossible if universalized); the second generates "imperfect duties" (actions that remain logically possible but cannot be rationally willed as universal law).

  **What is contested:** 
  1. **The Status of the Second Contradiction:** Critics argue Half 2 isn't a logical contradiction at all, but merely a description of an unpleasant world. The poem takes the Kantian side: that failing to will help for others contradicts something necessary about rational agency (we necessarily will our own ends, which sometimes require others' help), not just a preference for a nicer world.
  2. **The Empty Formalism Charge:** Hegel and others argue the test only works because we sneak in empirical assumptions about what we "want" (e.g., that we want paths to exist or help to be available). The poem assumes the test *can* distinguish these failures on its own; your group may debate whether the test generates the moral result or just launders our existing intuitions.
