  What the principle commits us to
  We must choose the principle that says voting belongs to those bound by the town's authority. This means anyone living inside the town lines gets a vote, and anyone living outside gets none, regardless of water impact. This commits us to a hard boundary: the town map. It accepts that some outsiders will suffer dry wells without a say, and some insiders will vote on rules that don't touch their own taps. We choose this not because it is perfectly fair, but because it is the only one a clerk can enforce without a law degree. It trades moral breadth for mechanical clarity. It commits the committee to recommending that the town accept responsibility for the outside harm, perhaps through side agreements, rather than pretending the outsiders are voters. It forces us to admit that the town is deciding for others, which is dangerous, but legally clear. We are not solving the water crisis; we are defining who holds the pen. If we tried to include everyone affected, we would need a new law, which we don't have time to write. So we commit to the smaller circle, knowing it leaves debts unpaid. This principle prioritizes order over perfect justice. It says the town governs its people, not the water itself. We must tell the Council that this choice predetermines the outcome: by drawing the line at the town border, we likely ensure the cap fails.

  The procedure, step by step
  1. **Verify Residency:** The town clerk checks the applicant's name against the current registered voter list. *Sufficient Answer:* A clear "Yes" or "No" from the database. *Type:* Mechanical. If "No," the process stops for that individual.
  2. **Verify Governance Boundary:** Check if the voter's primary residence lies within the official town limits. *Sufficient Answer:* Property deed address matches the municipal boundary map. *Type:* Mechanical. This ensures they are subject to town rules and taxes.
  3. **Assess Water Source:** Determine if the voter's household uses the shallow aquifer in question. *Sufficient Answer:* Well log records show depth less than the cutoff point (e.g., 200 feet). *Type:* Mechanical, but requires hydrologist verification of records to ensure accuracy.
  4. **Calculate Internal Discrepancy:** Compare the number of voters affected versus unaffected within the town. *Sufficient Answer:* A ratio. If more than 40% of voters are unaffected (like ridge residents), flag for review. *Type:* Mechanical. This highlights internal inequity.
  5. **Evaluate Outside Harm:** Estimate the volume of water lost by downstream users if the cap passes. *Sufficient Answer:* A report in acre-feet from the state agency or committee hydrologist. *Type:* Judgment. Numbers are facts, but their significance is not.
  6. **Stop or Refer:** If the outside harm exceeds the town's benefit by a set margin (e.g., 50%), the procedure stops with a flat "No Recommendation." Otherwise, it refers to the Council. *Sufficient Answer:* Pass/Fail based on the margin. *Type:* Judgment. This is a value call disguised as math.
  7. **Final Certification:** The clerk produces the final voter list based strictly on Steps 1 and 2. *Sufficient Answer:* A printed roll ready for ballots. *Type:* Mechanical. Steps 3-6 inform the Council, but only 1-2 bind the Clerk.

  Where the procedure gives out
  The procedure fails when the map doesn't match the water. It cannot fix the law that excludes the downstream city. It stops at Step 6, where numbers turn into values. We can count the gallons, but we cannot calculate whether stealing them is wrong; only elected officials can decide that. This is where the circularity lives. If we set the threshold high, the vote stops. If low, it goes. The procedure exposes the conflict but cannot resolve it. It hands the moral burden to the Council. You must tell them there is no way out of the circularity: the eligibility rule decides the result before a ballot is cast. If you choose the town boundary, the cap likely fails. If you chose the aquifer boundary, it passes. The procedure does not find the truth; it manages the risk of choosing one truth over another. It gives you cover to say you checked the numbers, but it cannot absolve the choice of who counts.

  Worked cases
  (a) **The Downstream City:** These residents draw from the same shallow formation. If the cap passes, their wells risk failure. However, they live fourteen miles outside the town line. Step 1 fails immediately. They are not on our voter roll. They are affected, but not subject to our authority. The procedure excludes them from the ballot. This is legally safe but creates a moral debt. The town decides their water fate without their input. The committee must recommend the Council negotiate a side deal, because the vote itself will ignore them. They are the largest group of affected people, yet they have zero formal power here.

  (b) **Our Own Ridge Residents:** These neighbors live inside town limits. Step 1 passes. They vote. However, their wells tap a deeper, separate source. Step 3 shows they are unaffected by the cap. They lose nothing. Yet, under this procedure, they retain full voting power. This is the unwelcome result. The committee will not enjoy hearing that people with no skin in the game get to decide for those who do. It highlights the flaw in using political borders for water problems. They are the swing vote that could kill the cap to save the farm, despite suffering no drought themselves. This is the case that undermines the legitimacy of the vote.

  (c) **The Farming Corporation:** The farm owns thousands of acres inside town. They pay taxes and employ workers. But they are a legal entity, not a person. Step 1 fails; corporations cannot register to vote. The seasonal workers live in trailers but may not meet residency rules. The entity pumping the most water gets no direct say. This is standard corporate law, but it means the biggest stakeholder is voiceless. The procedure treats them as subjects of tax, not participants in democracy.

  Confidence and the softest spot
  I am moderately confident this will hold up to council scrutiny. It respects the clerk's legal limits while forcing a conversation about the outside harm. The softest spot is Step 5. Estimating outside harm relies on models that can be fought over. If the farm disputes the hydrology, the procedure stalls. It's the only step where science meets politics, and I can't guarantee the numbers will hold up in a council fight. If the farm hires their own hydrologist to contradict yours, Step 6 becomes impossible to calculate. You need a state-certified number before you start, or this step will collapse under disagreement.
