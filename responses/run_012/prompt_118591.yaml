answer: |-
  **Supervisor Brainstorming**

  Your strongest angle is shifting the moral locus from the *topology of causation* (act vs. omission) to the *normative status of the baseline* (sustaining vs. altering). This captures the clinical intuition that maintaining life-support is an active intervention. The weakest version is that "baseline" is just a synonym for "what the agent chooses," which makes the theory circular. The real work is being done by the distinction between holding a causal pathway open versus closing it; the biographical narrative is essential for motivation but must not overshadow the argument. I have scaled the section lengths below to meet your 1,200-word total limit, as the original section estimates summed to nearly 2,000.

  ***

  **Statement of the Question**

  Does the moral distinction between killing and letting die depend on the causal shape of the agent's intervention, or on the normative status of the baseline the agent sustains? Standard debates assume the former, treating acts as introducing causal sequences and omissions as declining to interrupt them. I argue this framing is incorrect. The live contrast is between choices that hold a causal pathway open and choices that close or reroute one. The moral weight attaches to which baseline the agent treats as privileged, not to doing versus allowing as such. I ask whether a baseline-relative account sorts end-of-life cases—sedation, tube removal, withholding antibiotics, standing DNR orders—in a way that tracks considered moral judgment better than the act/omission account, or whether it merely relocates the problem. The answer will determine whether the act/omission distinction is philosophically salvageable or must be abandoned for clinical ethics.

  **Why the Existing Positions Leave It Open**

  The traditional act/omission distinction claims that introducing a cause of death is morally worse than failing to prevent it, all else being equal. Critics, often consequentialists, argue that outcomes matter more than causal shapes, rendering the distinction morally inert. Both sides, however, accept the same description of the facts: switching off a ventilator is an act; never switching it on is an omission. This shared premise is the gap my project exploits. In clinical practice, maintaining a ventilator is not a passive background state but a continuous positive intervention requiring power, machinery, and monitoring. Describing withdrawal as "letting nature take its course" obscures the fact that "nature" was already being held at bay by sustained human action.

  Consequently, the standard dialectic fails to explain why withdrawing treatment is often morally permissible while active euthanasia is not, despite both involving causal interventions leading to death. Appeals to intention or the doctrine of double effect attempt to patch this by focusing on the agent's mind, but they leave the ontological status of the action unaddressed. If keeping a patient alive is an ongoing act, then stopping is not merely allowing nature to proceed; it is choosing to cease an intervention. Existing positions leave open whether the moral weight lies in the causal shape or in the justification for sustaining a specific baseline against the natural course. My project argues the latter, positing that the act/omission distinction collapses when the baseline itself is recognized as an artificial construct sustained by agency.

  **Approach and Method**

  I will proceed in three four-month phases, utilizing conceptual analysis grounded in clinical case studies rather than empirical data collection.

  Months 1–3: I will reconstruct the standard act/omission arguments and their critiques, focusing on where they fail to categorize end-of-life interventions coherently. I will draft a precise definition of "baseline" that avoids circularity, distinguishing between physiological normalcy and technologically sustained states. This prevents the baseline from becoming merely whatever the agent decides to sustain.

  Months 4–6: I will construct a test cluster of four cases: continuous deep sedation, withdrawing a feeding tube, declining to start antibiotics, and a standing DNR order. All are currently classified as "letting die," yet they demand different positive actions. I will analyze each using the baseline-relative framework. For example, removing a tube closes a pathway; declining antibiotics refuses to open one. I will test if the moral weight tracks the pathway status rather than the act/omission label. I will reject appeals to intention or double effect here, as my hypothesis is that the action's status, not the agent's mind, drives the judgment.

  Months 7–9: I will draft the core argument, addressing the objection that baselines are agent-relative. I will argue that medical baselines are intersubjectively grounded in physiological norms, not individual preference. This distinguishes sustaining life (holding open a pathway to a physiological norm) from prolonging dying (holding open a pathway to a technological state).

  Months 10–12: I will revise for clarity and rigor, soliciting feedback from both ethicists and clinicians to ensure the taxonomy matches bedside reality. The method is conceptual because the error lies in the conceptual framework, not in data scarcity. Empirical methods would tell us what clinicians think; philosophical analysis tells us whether their reasoning holds.

  **What a Result Would Look Like, and What Would Count as Failure**

  A successful result is a coherent taxonomy where moral permissibility tracks the baseline status rather than the act/omission distinction. Specifically, the framework should explain why withdrawing life-support is permissible (ceasing an artificial baseline) while active euthanasia remains distinct (introducing a new causal pathway to death), without relying on the shaky act/omission divide. The output will be a journal-ready article demonstrating that the baseline-relative account resolves contradictions in current bioethical guidelines.

  Failure would look like two outcomes. First, if the "baseline" proves impossible to define without referencing the agent's choice, the theory collapses into circularity: the baseline is whatever the agent chooses to sustain, making the argument tautological. Second, if the baseline account sorts the test cases identically to the act/omission account, it is merely a redescription, not an advance. I will consider the hypothesis falsified if I cannot distinguish between "closing a pathway" and "omitting an act" in a way that yields different moral verdicts in hard cases.

  **Scope and Feasibility**

  The primary risk is scope creep into general normative ethics. The baseline problem applies to taxation, policing, and global poverty, but I will restrict the analysis strictly to end-of-life clinical care. This keeps the project manageable within twelve months. Another risk is that the "baseline" concept requires a full theory of normalcy, which is too large for a fellowship year. I will mitigate this by relying on established biomedical definitions of physiological function rather than constructing a full theory of health.

  The project is feasible because the case cluster is already identified and the philosophical literature is familiar. The clinical experience I bring reduces the time needed to understand the medical facts of the cases. However, if the intersubjective grounding of the baseline proves too contentious, I may need to narrow the scope to only technological interventions (ventilators, tubes) excluding pharmacological cases (antibiotics), which have fuzzier boundaries regarding "natural" courses.

  **Why This Is Worth Funding**

  This project bridges a critical gap between abstract moral theory and bedside reality. Current ethical guidelines rely on distinctions that clinicians find unintuitive, leading to moral distress and inconsistent care. By grounding the argument in actual clinical practice rather than thought experiments, I offer a framework that respects both philosophical rigor and medical reality. Funding this work supports a shift toward ethical tools that actually function in the high-stakes environment of end-of-life care, honoring the patients whose deaths prompted the question.
