answer: |-
  **Office of Constitutional Records — Public Guidance FAQ**

  The Office of Constitutional Records provides administrative support for the maintenance of national fundamental law. The following guidance clarifies common procedural inquiries regarding amendment protocols.

  **1. Which version of the Amendment Clause is currently in force?**
  The Office maintains archives of all nineteen promulgated versions. Citizens may consult the registry to determine which version they believe applies. The Office does not certify currency, as certifying currency requires a certified version.

  **2. What procedure must I follow to propose an amendment?**
  Applicants should follow the procedure outlined in the most recently promulgated version of the Clause. If that version was adopted under a prior version, please reference the prior version's enabling authority in Section 4 of Form 12-B. If the prior version is unavailable, cite the version prior to that.

  **3. What if the most recent version was adopted using an invalid procedure?**
  Procedural validity is presumed upon promulgation. The Office does not adjudicate the legitimacy of the authority that authorized the authority. To suggest the procedure was invalid is to suggest the Constitution was not in force at the time. Please proceed with the current form.

  **4. Can the Amendment Clause be amended?**
  Yes. The Clause explicitly authorizes its own amendment by whatever procedure it currently specifies. This includes the specification of the procedure itself.

  **5. What if the current procedure repeals the version that authorized it?**
  The repeal takes effect upon promulgation. The authorization took effect prior to promulgation. The interval is sufficient for validity. Subsequent inquiries regarding the status of the interval are closed.

  **6. Is there a master copy of the Constitution?**
  There are nineteen master copies. Each supersedes the previous, except where the previous claims unamendability. In such cases, both are retained for reference. Citizens are advised to bring their own copies.

  **7. Who verifies that an amendment complies with the enabling clause?**
  The Office verifies that the correct form was submitted. Compliance with the enabling clause is verified by the enabling clause itself, via the amendment process. If the clause changes, the verification standard changes.

  **8. Can an amendment be declared invalid retroactively?**
  No. An amendment is valid until it is amended. If the rule validating it is subsequently repealed, the amendment remains valid unless the repeal specifies otherwise. Retroactive invalidity creates administrative backlog.

  **9. What is the difference between an invalid rule and an unamendable rule?**
  An invalid rule was never law. An unamendable rule is law that cannot be changed. If an unamendable rule is changed, it becomes invalid, unless the change validates the rule changing it. If the change is invalid, the rule remains unamendable. If the rule is unamendable, the change is invalid.

  **10. What is the legal basis for this FAQ page?**
  This FAQ page is published under the authority of the Office of Constitutional Records. The Office's authority to publish guidance is derived from this FAQ page. Compliance is mandatory.
