answer: |-
  You have correctly identified that this is not standard Ambiguity Aversion (the Ellsberg Paradox). In Ellsberg, the discomfort comes from the *absence* of probability information. In your case, the discomfort comes from the *distribution* of that information.

  There is no single "Paradox of X" name in philosophy that functions exactly like "Ellsberg" for this specific psychological sensation. However, the structural phenomenon you are describing has a very firm name in economics and game theory: **Adverse Selection**.

  When you frame it as a decision-theoretic problem, it is the distinction between **State Uncertainty** and **Strategic Uncertainty**.

  Here is how the thing is carved, where the edges are, and the verdict on rationality.

  ### 1. The Name and the Carve
  The label you are looking for is **Adverse Selection** (or **Asymmetric Information Aversion**).

  In decision theory, we distinguish between two types of uncertainty:
  *   **State Uncertainty (Against Nature):** The outcome is determined by physical processes (coin flips, weather, the safe overboard). Nature is indifferent to your wager. Nature does not adjust its behavior based on your bet.
  *   **Strategic Uncertainty (Against Agents):** The outcome is known, or influenced, by other agents who may have an incentive to take your money.

  Your intuition is tracking a shift from State Uncertainty to Strategic Uncertainty.
  *   **The Ellsberg Urn:** You are betting against Nature. The urn doesn't care if you pick red or black. Even if the composition is unknown, there is no *adversary* exploiting that ignorance. You are fine with this.
  *   **The Drug Trial / Bracket Pool:** You are betting against a market or a pool. Once you introduce the possibility that a *counterparty* (the bookie, the other pool members, the friend-of-a-friend) holds privileged information, the bet transforms. It is no longer a wager on the event; it is a wager on *whether you are being exploited*.

  The "Safe Overboard" case confirms this. Metaphysically, the number in the safe is identical to the drug trial result (both are settled facts). But epistemically, the safe has no *agent* holding the key. The information asymmetry is between you and the universe, not you and a competitor. Your queasiness vanishes because the risk of exploitation vanishes.

  ### 2. One Phenomenon or Two?
  It is **one phenomenon**.

  The "somebody knows" case and the "nobody knows" case are not two different psychological mechanisms. They are the presence and absence of the same trigger: **Epistemic Asymmetry with Agency.**

  *   **Case A (Informed Insider):** Asymmetry exists + Agent exists = **Adverse Selection Risk.** (You back off).
  *   **Case B (Safe Overboard):** Asymmetry exists + No Agent = **Pure Ambiguity.** (You bet happily).

  Your brain is not reacting to the *settledness* of the fact (determinism); it is reacting to the *locality* of the knowledge (who holds it). The "Safe Overboard" scenario proves you are not superstitious about determined futures; you are rational about informational disadvantage.

  ### 3. The Edges: Where does it stop applying?
  The boundary condition is **the potential for a rational counterparty.**

  *   **The Edge of Agency:** If you are betting against a casino on a fresh shuffle of cards, you should theoretically be fine. The casino has a house edge, but they don't know the *outcome* of the specific hand better than you. If you suspect the dealer is stacking the deck (an agent with privileged info), your aversion should kick in.
  *   **The Edge of Common Knowledge:** The aversion triggers even if you don't *know* who has the info, only that someone *might*. In your bracket pool, you don't know which guy follows that conference, but the *probability* that an informed agent exists in the pool is enough to poison the bet. This is the **Winner's Curse** intuition: if you win the bet, it might be precisely because everyone else knew you were wrong.
  *   **The Edge of Incentive:** If the person who knows the info has no incentive to bet against you (e.g., the friend-of-a-friend at the drug company is not in your poker game), a strict economist might say the risk is lower. However, your heuristic treats *any* informed agent as a potential leak in the market price. This is a robust edge: you assume the market price reflects the insider's knowledge, even if they aren't directly betting against you.

  ### 4. The Verdict: Irrational or Respectable?
  The standard verdict in modern decision theory and finance is that **you are being perfectly rational.**

  In fact, refusing the bet is the only position consistent with the **No-Trade Theorem** (Milgrom & Stokey, 1982). The theorem roughly states: if two agents are rational, and they know the other is rational, they should not make a speculative bet. Why? Because the mere fact that someone is willing to take the other side of your bet signals that they have information you don't.

  *   **If you bet on the drug trial:** You are effectively saying, "I know something the market doesn't." But you admitted you know nothing. Therefore, anyone taking the other side likely knows something you don't.
  *   **If you bet on the safe overboard:** No one can take the other side based on inside info, because the info is inaccessible. The market cannot be "smart" about the safe.

  Your poker group argues about this because many people treat betting as a tax on optimism ("I feel lucky"). Decision theory treats betting as a test of information ("What do I know that they don't?"). Your intuition aligns with the latter.

  ### Summary
  You haven't found a bug in your reasoning; you've found a feature of **Game Theory** that standard **Ambiguity Aversion** misses.

  *   **Name:** **Adverse Selection** (Economics) / **Strategic Uncertainty** (Game Theory).
  *   **Distinction:** It is not about *unknown odds* (Ellsberg); it is about *asymmetric information between agents*.
  *   **Rationality:** Highly respectable. It is the intuitive application of the **No-Trade Theorem**.
  *   **Boundary:** It applies only when a *competitor* could possess the information. It vanishes when the information is inaccessible to all agents (the safe).

  If you need a label to use at the poker table that isn't dry economics, you might call it **Counterparty Epistemic Risk**. But the mechanism is Adverse Selection. You are simply refusing to be the "sucker at the table," which is the most rational move in decision theory.
