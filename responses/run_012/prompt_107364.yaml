answer: |-
  The phenomenon you describe is a central fault line in the foundations of probability. It has a specific historical name, a precise mathematical characterization, and a contested philosophical status. Below is a breakdown of the distinctions, the relationship to neighboring problems, and a verdict on the proposed solutions.

  ### 1. The Name and Classification

  **Established Names:**
  *   **The Bertrand Paradox:** Historically, this is the anchor. Joseph Bertrand (1889) demonstrated it using chords in a circle, showing that "random chord" yields different probabilities depending on the method of selection.
  *   **The Von Mises Cube Paradox:** Your specific example (edge length vs. volume) is often attributed to Richard von Mises. It is the standard textbook illustration of the problem in continuous variables.
  *   **The Reparameterization Problem:** In modern statistics and Bayesian philosophy, this is the technical term. It refers to the failure of a prior distribution to remain invariant under a change of variables (a diffeomorphism).
  *   **The Problem of the Priors:** In epistemology, this falls under the broader difficulty of assigning initial probabilities in the absence of data.

  **One Problem or a Family?**
  It is **one structural problem** manifesting in different domains. The underlying mathematical cause is identical in the cube, the rate constant, and the Earth's surface cases: **the lack of a unique measure on a continuous space.**

  When you say "treat every possibility as equally likely," you are implicitly invoking a *measure* (a way of assigning size to subsets of possibilities). In discrete finite spaces, the counting measure is unique and natural. In continuous spaces, there is no unique "uniform" measure. A uniform distribution on variable $x$ induces a non-uniform distribution on variable $y = f(x)$ unless $f$ is linear, due to the Jacobian of the transformation. The "paradox" arises because the Principle of Indifference (PoI) instructs you to be uniform, but fails to specify *with respect to which measure*.

  ### 2. Distinction from the Reference Class Problem

  You asked how this bears on the complaint that probability depends on "which class of similar cases one draws the frequency from." This is the **Reference Class Problem** (associated with Hans Reichenbach and Wesley Salmon).

  **The Distinction:**
  *   **Reparameterization (Your Problem):** Concerns the *description* of a single, fixed state space. You have one physical system (the cube). You have one set of possible states. The ambiguity lies in the *coordinates* used to label those states (edge vs. volume).
  *   **Reference Class:** Concerns the *selection* of the population. You have one individual (this cube). The ambiguity lies in which *group* you compare it to (all cubes? all objects made of wood? all objects in this room?).

  **Verdict:** They are **sibling problems**, not the same problem. Both demonstrate the underdetermination of probability assignments by available evidence. However, the Reparameterization Problem is more fundamental mathematically (it arises even in idealized, single-system logic), whereas the Reference Class Problem is more epistemological/statistical (it arises when applying frequencies to individuals). Solving one does not solve the other.

  ### 3. Evaluation of Proposed Solutions

  You asked whether appeals to invariance, symmetry, or maximum entropy resolve the ambiguity or move it.

  **A. Invariance under Unit Change (Jeffreys Priors)**
  *   **The Proposal:** Demand that the probability assignment yield the same physical predictions regardless of the units or parameterization used (e.g., meters vs. centimeters, length vs. log-length). This leads to **Jeffreys Priors**, which are proportional to the square root of the Fisher Information.
  *   **Is it a Derivation?** No. It is a **meta-principle**. It assumes that the physical reality is independent of the human choice of coordinates. While this is a reasonable physical assumption, it is not a truth of logic.
  *   **Does it Resolve It?** Partially. It solves the cube/rate constant cases successfully. However, in multiparameter problems, Jeffreys' rule can sometimes yield priors that violate other intuitive symmetry requirements (e.g., marginalization paradoxes). It removes the arbitrariness of the *variable*, but imposes a new arbitrariness regarding the *method* (why Jeffreys' rule and not another invariant rule?).

  **B. Symmetry Arguments**
  *   **The Proposal:** Use the physical symmetries of the system (e.g., rotation, translation, scale) to dictate the measure.
  *   **Does it Resolve It?** Only if the symmetry group is uniquely specified by the physics. In the cube problem, if the physics suggests the manufacturing process controls the *edge*, length is the natural variable. If the process controls the *mass* (and density is constant), volume is natural.
  *   **The Catch:** Without physical context, "symmetry" is ambiguous. A square is symmetric under rotation, but if you are throwing a die, the dynamics matter. Appeals to symmetry often hide the assumption of which variable is "fundamental."

  **C. Maximum Entropy (MaxEnt)**
  *   **The Proposal:** Choose the distribution that maximizes Shannon Entropy subject to known constraints.
  *   **Does it Resolve It?** **No, it moves the ambiguity.** To calculate continuous entropy, you must define a reference measure $m(x)$ (the "prior measure"). The entropy is $-\int p(x) \log(p(x)/m(x)) dx$. Maximizing this yields $p(x) \propto m(x)$.
  *   **The Verdict:** You have simply shifted the question from "What is the probability?" to "What is the reference measure $m(x)$?" The Reparameterization Problem re-emerges in the choice of $m(x)$.

  ### 4. Subjective vs. Objective: The Honest Conclusion

  You asked whether probabilities of this kind are subjective through and through, or if there is a defensible objective version.

  **The Subjective View (Personalist Bayesianism):**
  *   **Position:** Probabilities are degrees of belief. There is no "true" prior. The cube problem reveals that "ignorance" is not a unique state. Believing edge-length is uniform is a different state of knowledge than believing volume is uniform.
  *   **Verdict:** This dissolves the paradox by denying the premise that there *should* be a unique answer derived from ignorance. However, it is unsatisfying for physical sciences where we expect the world, not the agent, to dictate the odds.

  **The Objective View (Logical/Objective Bayesianism):**
  *   **Position:** Probabilities are logical relations between evidence and hypothesis (Keynes, Jaynes). There *ought* to be a unique rational prior.
  *   **Verdict:** This camp attempts to solve the problem using the Invariance/MaxEnt methods described above.
  *   **The Catch:** To make this work, you must admit that "ignorance" is not enough. You need **physical information**. The "objective" prior is not derived from *lack* of knowledge, but from *structural* knowledge (e.g., "the mechanism is scale-invariant").

  **The Frequentist/Propensity View:**
  *   **Position:** Probabilities are long-run frequencies or physical propensities.
  *   **Verdict:** This view sidesteps the prior assignment problem by refusing to assign probabilities to single cases without a defined repeatable procedure. If the procedure is "pick a cube," the paradox remains until the procedure is specified (e.g., "pick a cube by picking an edge length uniformly").

  ### 5. Final Verdict on Neighbouring Concepts

  To answer your request for careful distinctions:

  1.  **Does "Principle of Indifference" fit?**
      *   **No.** The PoI is the *source* of the error, not the solution. It is the naive rule that fails.
  2.  **Does "Principle of Transformation Groups" fit?**
      *   **Yes.** This is the name often given (by E.T. Jaynes) to the solution strategy using symmetry and invariance. It fits your description of "demanding the answer not change when we change units."
  3.  **Does "Reference Class Problem" fit?**
      *   **No.** As distinguished above, that is about population selection, not variable parameterization.
  4.  **Is it a "Substantive Empirical Assumption"?**
      *   **Yes.** Demanding invariance under unit change is a physical postulate (the physics is coordinate-independent), not a logical truth. It is a defensible assumption for physical quantities, but it is an assumption nonetheless.

  **Summary Conclusion:**
  The phenomenon is the **Reparameterization Problem** (historically the **Bertrand-Von Mises Paradox**). It demonstrates that the **Principle of Indifference** is ill-defined for continuous variables.

  The "honest conclusion" is this: **There is no probability distribution that represents "total ignorance" in a continuous space.** Any assignment you make encodes information about which variables are taken to be fundamental.

  *   If you treat probability as **logic**, you must supplement "ignorance" with **invariance principles** (Jeffreys/Group Invariance). This yields a unique answer *relative to the chosen symmetry group*, but the choice of group is a physical assumption.
  *   If you treat probability as **belief**, the ambiguity is real and reflects different states of information.
  *   If you treat probability as **frequency**, the question is ill-posed until the sampling procedure is physically specified.

  For a physical scientist, the most defensible path is the **Objective Bayesian** route using **Jeffreys Priors** or **Group Invariance**, provided you acknowledge that you are importing a physical assumption (coordinate independence) to resolve a logical underdetermination. It is not a derivation from pure reason; it is a constraint imposed by the expectation that physical laws should not depend on human notation.
