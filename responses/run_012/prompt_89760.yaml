      *   *Counter-argument:* Searle's Chinese Room. Syntax manipulation $\neq$ Semantics (understanding). Therefore, computers can't think.
      *   *Conflict:* If Brain = Computer and Computer $\neq$ Thinker, then Brain $\neq$ Thinker. But Brains *do* think. Contradiction.
      *   *Second Counter-argument:* Pancomputationalism (Putnam/Bishop). Any physical system implements any computation. If true, "Brain is a computer" is trivial/vacuous.
