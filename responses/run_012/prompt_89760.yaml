      *   *Chinese Room:* Is it a knockout argument? **No.** It's contested. System reply, brain simulator reply, etc. Searle's conclusion (syntax isn't semantics) is debated.
      *   *Pancomputationalism (Triviality):* Is it fatal? **Depends.** Hilary Putnam argued this. It's a serious objection to *strong* computationalism, but computationalists have responses (e.g., causal structure matters, not just mapping). It's not "settled" that this kills the theory, but it's a major hurdle.
