answer: |-
  **Project Title:** The Constitutive Gap: Preference Stability and the Limits of Rational Choice in Transformative Contexts

  **Project Summary**
  Contemporary debates on transformative experience focus primarily on epistemic opacity: the claim that agents cannot rationally choose transformative outcomes because they lack access to the phenomenological data required to assign utility values. This project challenges that diagnosis. I argue that the genuine threat to decision theory is not ignorance of outcomes, but instability of the subject. In hard cases, the choice does not merely reveal new information; it rewrites the preference function of the agent. Where the standard view sees an impossible calculation due to missing variables, I propose we see an underspecified problem due to a missing subject. This summer project will rigorously distinguish between "epistemic" transformations (learning what you value) and "constitutive" transformations (becoming someone who values differently) to determine if this distinction resolves the paradox or merely relocates it.

  **The Research Question**
  Does the distinction between *epistemic opacity* (not knowing what an experience is like) and *constitutive change* (the experience altering the agent's utility function) isolate the specific conditions under which standard decision theory fails?

  Specifically: If we control for epistemic uncertainty, does preference instability alone render rational choice underspecified rather than impossible?

  **Background and Significance**
  The dominant framework for transformative experience (associated with L.A. Paul) posits that rational choice is blocked because the agent cannot know the subjective value of the outcome prior to the choice. Decision theory requires expected utility maximization; if the utility values are inaccessible, the calculation cannot run.

  This diagnosis is insufficient. Agents routinely make rational decisions under uncertainty and risk. We assign probabilities to unknown utilities all the time. If transformative experience were merely a case of extreme uncertainty, standard tools (risk-weighted expected utility, precautionary principles) should apply. They do not.

  My hypothesis is that the breakdown occurs because standard decision theory assumes a diachronically stable agent. It assumes the "self" calculating the choice and the "self" experiencing the outcome share a utility function. In genuinely transformative cases, the act of choosing creates a new valuer. If the pre-choice agent and post-choice agent have incommensurable preferences, there is no single function to maximize. The problem is not that the answer is unknowable; it is that the question "What should *I* choose?" lacks a referent.

  Current positions fail to settle this because they conflate learning what you value with changing what you value. They treat the post-experience self as the same epistemic subject with more data, rather than a different normative subject with different weights. By failing to separate these, existing literature attempts to solve a metaphysical problem with epistemic tools.

  **Methodology and Work Plan**
  This is a conceptual analysis project with implications for formal decision theory. The summer will be divided into three phases:

  *   **Weeks 1–4: Taxonomy of Transformation.** I will construct a rigorous typology of transformative cases. I will isolate "Epistemic-Only" cases (e.g., tasting a new fruit where preferences remain stable but data is added) from "Constitutive" cases (e.g., religious conversion or trauma where the hierarchy of values shifts). I will test these against standard decision-theoretic models to show where the math breaks in the latter but holds in the former.
  *   **Weeks 5–8: The Underspecification Argument.** I will develop the argument that constitutive change leads to underspecification rather than impossibility. I will analyze whether "rationality" in these contexts requires a higher-order preference (a preference about which preferences to have) or if it requires abandoning the single-subject assumption. I will draft the core argument demonstrating that the paradox relocates if we try to anchor the choice in the pre-self, the post-self, or a weighted average.
  *   **Weeks 9–12: Synthesis and Drafting.** I will integrate the taxonomy and the underspecification argument into a single paper. I will refine the conclusion to specify whether this requires a revision of decision theory or merely a restriction on its domain of application.

  **Expected Outcomes**
  1.  **A Conference-Ready Paper:** A draft manuscript (8,000–10,000 words) suitable for submission to journals in philosophy of action or decision theory.
  2.  **A Conceptual Framework:** A clear set of criteria for distinguishing between "information-gathering" choices and "identity-rewriting" choices.
  3.  **A Negative Result (if applicable):** If the distinction collapses (i.e., if all preference changes can be modeled as information updates), the outcome will be a proof that the "constitutive" objection is reducible to the epistemic one, vindicating the standard view but clarifying *why*.

  **Conditions for Project Failure**
  This project will be considered unsuccessful if:
  1.  **The Distinction Collapses:** If I cannot formally or conceptually separate "learning a value" from "changing a value" without circularity, the core hypothesis fails.
  2.  **Triviality:** If the distinction is clear but turns out to be irrelevant to decision theory (i.e., standard models can accommodate preference change without underspecification), the project lacks significance.
  3.  **Scope Creep:** If the analysis requires building a full alternative decision theory to make the point, the project is too large for the timeframe. The goal is to diagnose the break, not necessarily engineer the fix.

  **Feasibility Assessment**
  This is a viable summer project, not a dissertation-sized mess, provided I adhere to the diagnostic scope.
  *   **Why it fits a summer:** The work is primarily analytical. It does not require empirical data collection, complex mathematical modeling, or extensive historical exegesis. It relies on argument construction and counter-example testing.
  *   **Risk Management:** The risk lies in the "dissertation-sized" temptation to solve the diachronic rationality problem. I will avoid this by focusing strictly on the *diagnosis* of the breakdown. I do not need to solve how to choose in constitutive cases; I only need to prove *why* the standard model fails there and not in epistemic cases.
  *   **Preparation:** I have a working grasp of the relevant decision-theoretic literature and the transformative experience debate. The summer will be dedicated to structuring these insights into a formal argument rather than acquiring new foundational knowledge.

  **Conclusion**
  If successful, this project shifts the debate on transformative experience from the epistemology of ignorance to the metaphysics of the subject. It clarifies that the threat to rational choice is not that we cannot see the future, but that we cannot guarantee who will be there to meet it. This distinction is necessary for any future work aiming to repair decision theory for high-stakes, life-altering choices.
