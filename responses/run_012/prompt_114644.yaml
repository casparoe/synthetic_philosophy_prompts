answer: |-
  The pendulum hung from the central spire, a tungsten tear suspended over the quiet ocean. Below, the water curved up the habitat's walls, a permanent tide that proved, to Kael, that they were spinning. To Elara, it proved only that the water resisted the hull.

  They stood on the observation deck, watching the bob trace its slow, elliptical flower on the sand below. One full precession every eighteen hours.

  "The rate is constant," Kael said, tapping the glass. "Space doesn't care what we're made of. It cares where we are."

  "Space isn't a *where*," Elara replied, checking the manifest on her slate. "It's a relationship. If there are no stars, no distant galaxies, then 'straight' is defined by the nearest heavy thing. Us."

  "Then why does the water bulge?"

  "Because the hull turns against the mass of the hull."

  Kael scoffed. "Circular. You're saying the shell defines inertia, but inertia proves the shell spins. If we strip the shell away, does the water stop climbing?"

  "If there's no matter, there's no inertia to climb," Elara said. "So we aren't stripping it. We're weighting it."

  She gestured to the cargo lifts behind them. Stacked there were blocks of depleted uranium, dense and dull. The plan was simple, though the labor was brutal. They would bolt the blocks to the outer rim, increasing the habitat's mass by fifteen percent without changing its angular momentum.

  "If you're right," Elara said, "Absolute Space holds the pendulum's plane fixed. The floor spins underneath it. Adding mass to the floor changes nothing. The precession rate stays at eighteen hours."

  "And if you're right?"

  "Then the mass of the shell drags the local inertial frame. Heavier shell, more drag. The pendulum's plane should get pulled along with the rotation. The precession period relative to the floor should lengthen. Maybe not to infinity, but enough to measure."

  Kael looked at the uranium, then at the pendulum. "You want to turn the whole station into a scale."

  "I want to see if space is empty or full."

  It took three cycles to mount the blocks. The habitat groaned under the shift in distribution, stabilizers firing to keep the ocean from sloshing into the intake vents. When the work was done, the hum of the rotation was deeper, a bass note felt in the teeth rather than the ears.

  They returned to the observation deck. The pendulum was already swinging, undisturbed by the construction below. The sand beneath it had been raked fresh, a black canvas waiting for the brass tip to write.

  "Start the count," Kael said.

  They watched. The habitat turned; the pendulum refused to follow. Or did it?

  An hour passed. Two. The mark on the sand drifted westward, as it always had. Elara logged the angle every ten minutes. Kael watched the ocean bulge, looking for a change in the tide height, another variable Elara had predicted might shift if inertial mass changed relative to gravitational mass.

  "Eighteen hours," Kael said at the end of the shift. "Maybe eighteen hours and two minutes. Within error."

  "Error is where the truth hides," Elara muttered. She was adjusting the calibration on the laser interferometer. "The drag effect is subtle. Mach didn't say the shell locks the frame completely. Just that it influences it. We need a week of data."

  "We need to admit the universe doesn't whisper," Kael said. "It shouts. The water climbs because we turn. Period."

  "And if I tell you the precession slowed by three percent?"

  "Then I'd say the bearings warmed up. Friction in the spire. Air currents from the ventilation."

  Elara looked up from the console. "You've decided the result before the measurement."

  "I've decided that space isn't a fluid to be dragged," Kael said. "It's the stage. You can paint the scenery heavier, Elara, but the stage doesn't move."

  "And you can't see that the scenery *is* the stage?"

  They worked in silence for the rest of the cycle. The data streamed in, a jagged line of angles and timestamps. At the end of the week, Elara compiled the report. The precession period had shifted. Seventeen hours, fifty-four minutes. A variance of one percent.

  She projected the graph on the wall. The line dipped, just barely outside the standard deviation of the previous year's logs.

  "Thermal expansion," Kael said immediately, pointing to the ventilation intake. "The uranium blocks radiate heat. The air density changed. The bob encountered more resistance on one side of the swing."

  "The effect is symmetric," Elara countered. "And the ocean bulge measured higher by a corresponding margin. Inertia increased."

  "Coincidence. Mass increases gravity, sure, but not the definition of straight."

  "Straight is where the mass isn't," Elara said, saving the file. "We are the only matter. We define the line."

  "We define the measurement," Kael corrected. "Not the line."

  He turned off the projector. The room dimmed, leaving only the faint glow of the pendulum's safety lights below, swinging blindly in the dark. The ocean hummed against the walls, a constant reminder of the force they couldn't agree on. Neither touched the console to reset the data. They let the file sit, labeled *Cycle 492*, open to interpretation.

  ***

  **Author's Note on Physics and Philosophy**

  **Liberties Taken:**
  1.  **Magnitude of Effect:** In General Relativity, the "frame-dragging" effect (Lense-Thirring effect) caused by a rotating shell is incredibly minute unless the mass is stellar-scale or the rotation is near light-speed. A 15% mass increase on a habitat would yield a change far below measurable thresholds with conventional tools.
  2.  **Mach's Principle:** There is no single, agreed-upon mathematical formulation of "Mach's Principle." Einstein hoped GR would embody it fully, but GR allows for solutions (like Gödel universes or empty Minkowski space) where inertia exists without matter. The story treats Mach's principle as a literal coupling constant between local mass and local inertia, which is a philosophical idealization rather than settled physics.

  **Philosophical Lean:**
  The story leans slightly toward **Relationism (Machian)**. It frames the Substantivalist position (Kael) as dogmatic ("Space is the stage"), while the Relationist (Elara) is shown seeking a dynamic connection between matter and geometry. The ambiguity of the data favors the Relationist hope that space is not a passive container, but it refuses to confirm it.

  **What Would Change the Mind:**
  *   **For Substantivalism:** A definitive null result even with perfect isolation and massive weight changes would suggest inertia is intrinsic to objects or space itself, independent of surrounding mass.
  *   **For Relationism:** A confirmed correlation where increasing local mass *actually* alters inertial frames (beyond standard GR predictions) would suggest space is entirely emergent from matter relations. Currently, Gravity Probe B confirmed frame-dragging around Earth, which supports GR (a middle ground), but doesn't fully validate the strong Machian view that *only* matter defines inertia.
