answer: |-
  A note on the framing: The picture you sketched—mathematical equivalence with explanatory disagreement—is the standard pluralist position in the philosophy of biology (e.g., Okasha, Godfrey-Smith). It is defensible, though hardliners on both sides will still argue about causal privilege in non-additive cases. For a toast, this framing is appropriate; for a paper, it would require more caveats. I have written the toast to defend this pluralist view without overstating the mathematical identity.

  ***

  Good evening. For those who do not know me, I had the privilege of being one of the last students to walk across the stage with her name on their diploma. But looking around this room, I see the people who walked beside her for thirty-six years. And I see the people who kept her grounded while she was walking.

  To her sister: I know you have spent thirty years in hospice care, holding space for individuals at the end of their lives. You once told me you never quite understood what your sister did for a living. You deal with the undeniable reality of the person in the bed. She dealt with the undeniable reality of the person in the population. You both asked the same question: where does the care live? Is it in the hand that holds, or in the system that allows the holding? You know the answer is both. She spent her career proving that in biology, the answer is also both.

  To the colleagues in the second row: I know some of you refereed her first big paper. I know some of you recommended rejection. You were not wrong to be rigorous. The field needed that friction. For decades, you argued over whether the group was a vehicle or a phantom, whether the gene was the only ledger that mattered. It would be easy to say tonight that you were all right, that it was just semantics. That would be a lie. It was not semantics. It was about where to look when you want to understand cause.

  Here is the truth about her work, and about this room: The gene-level accounting is correct. The group-level phenomenon is real. The fight was not about the facts of the evolutionary trajectory; those numbers do not change. The fight was about which description does the explanatory work. Sometimes you need to see the forest to understand the tree. Sometimes you need to see the tree to understand the forest. She refused to put down the lens that showed the forest, even when the rest of the field was calibrated only for the timber.

  She taught us that a model is not a territory. She taught us that we can partition the variance without partitioning the causality. She taught us that rigor is not the same as rigidity. When the debate became a trench war, she was the one walking across no-man's-land to check the math on both sides. She did not want to win the argument. She wanted to solve the puzzle.

  To her husband: You know better than anyone that liabilities and assets can be listed individually or consolidated. She spent her life consolidating the assets of this field. To her children: You saw the work come home in the form of late nights and distracted mornings. You are the group that selected for her persistence.

  We are here to honor a career. But a career is just a sequence of choices. Her choice was to keep the question open when everyone else wanted to close it. She leaves us with a field that is sharper, kinder, and more honest because she refused to simplify the world to make the math easier.

  So, to the advisor who taught us that the level of selection is not just a parameter, but a perspective: May your retirement be filled with the kind of peace that comes from knowing you do not have to partition your time anymore. You are selected for, exactly as you are.

