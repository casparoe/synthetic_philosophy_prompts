  Students rotate partners playing the specified game using bead-filled cups to enact mixed strategies, pausing between rounds to collectively cross out strategies they deem rationally indefensible.

  **Materials**
  Sixteen printed payoff matrices (one per student). Eight opaque cups and 400 beads (200 white for A, 200 black for B). Eight red markers. Score sheets tracking points per match. A timer. The payoff matrix must be clearly visible on each sheet: Row/Col A, B, C with payoffs (22,20,0), (20,0,2), (0,2,1) respectively.

  **Rules and Roles**
  Students form eight pairs. Each match consists of one simultaneous move. Payoffs are recorded as "Rationality Points" (RP); the student with the most RP at the end chooses the next seminar's snack.
  **Phase 1 (Pure):** Students must choose A, B, or C explicitly. No randomization.
  **Phase 2 (Mixed):** Students may fill their cup with any combination of white (A) and black (B) beads. To move, they draw one bead blindly, play the corresponding strategy, return the bead, and shuffle. Strategy C remains pure-only (no beads).
  **Phase 3 (Elimination):** Before playing, pairs must agree to cross out any strategy on their matrix they believe no rational agent would ever play. Play continues only with remaining strategies.

  **Timeline**
  **0–10 min:** Distribute materials. Explain payoff structure and RP rules. Emphasize silence during play.
  **10–25 min:** Phase 1. Pairs play 5 matches rotating partners after each match. Record scores.
  **25–35 min:** Guided reflection. Ask: "Did anyone lose consistently? Can you construct a move that loses less?" Introduce beads. Do not mention "dominance."
  **35–55 min:** Phase 2. Pairs play 5 matches. Encourage experimenting with bead ratios (e.g., 1 white, 3 black).
  **55–70 min:** Guided elimination. Ask: "Compare C against your best bead mix. Is C ever better?" If consensus reached, students cross out C with red markers.
  **70–80 min:** Phase 3. Pairs play 5 matches using only remaining strategies.
  **80–90 min:** Debrief.

  **Debrief**
  Map Phase 1 to **pure strategy analysis**: note that no pure strategy dominated initially. Map Phase 2 to **mixed strategies**: reveal that a specific ratio (1 white, 3 black) yields higher expected payoffs against all opponent moves than C. This physicalizes the mathematical proof that a mixture can dominate a pure strategy. Map Phase 3 to **iterated elimination**: once C is removed, A dominates B. Connect the cross-out moment to **strict dominance**. Explain that the convergence to A relies on **common knowledge of rationality**: you eliminated C because you assumed opponents wouldn't play it, which assumes they eliminated it too. Finally, distinguish **elimination** from **irrationality**: a strategy is eliminated because it is suboptimal given rational play, not necessarily because playing it implies insanity. A student might play C to teach a lesson or out of confusion; elimination means it cannot be a best response to any *rational* belief about the opponent, not that the actor is mentally compromised.

  **What Will Go Wrong First Time**
  Students will treat the beads as noise rather than strategy, randomizing 50/50 out of indecision rather than to exploit payoffs. They may fail to calculate the specific 1/4–3/4 ratio needed to dominate C, leading them to conclude mixing doesn't help. **Handle this:** During the Phase 2 reflection, subtly suggest testing extreme ratios (e.g., "Try mostly B with a little A") rather than revealing the solution. If they still miss it, demonstrate one specific cup composition against C on the board without naming it "dominance." Also, students might collude to play (B,B) for mutual benefit in Phase 3; shut this down by reminding them the goal is individual RP maximization.

  **What the Activity Cannot Reproduce**
  The activity cannot reproduce **Common Knowledge of Rationality (CKR)**. In the game, students eliminate C because *you* told them to compare it against mixes, or because they saw it perform poorly empirically. In formal theory, C is eliminated because I know you are rational, and you know I am rational, ad infinitum. The activity simulates the *result* of CKR (convergence to A) through empirical trial and instructor prompting, but it cannot simulate the *recursive epistemic state* required for IESDS to be a true solution concept rather than just learned behavior. You must supply the epistemic logic in the debrief.
