answer: |-
  # Q&A PREP SHEET: REFLECTION PRINCIPLE CRITIQUE
  **Workshop:** Formal Epistemology
  **Time:** 2 Weeks Out
  **Goal:** Survival, not victory.

  ## 1. THE "I'M DONE" OBJECTION (Expert Deference)
  **Who:** One of the Accuracy-First Bayesians.
  **The Claim:** "If you reject Reflection, you lose Expert Deference. Deference is just Reflection where the 'future self' is replaced by an 'expert.' If I shouldn't defer to my future self when I know they're epistemically worse, why should I defer to an expert I'm not certain is better?"
  **Damage Level:** Fatal. This severs the link between temporal coherence and social epistemology.

  **The Two-Minute Reply:**
  "Expert Deference and Reflection are structurally similar but grounded differently. Reflection is about *temporal coherence* of a single agency over time. Expert Deference is about *reliability tracking*.
  My argument isn't that you never defer to a future self or an expert. It's that the *unconditional* norm is false.
  For the expert: I defer *because* I judge them to satisfy conditions (i) and (ii) relative to me (more evidence, intact reasoning). If I know an expert is drunk or biased (violating ii), I don't defer.
  So, Expert Deference survives as a *conditional* norm: Defer to the expert *if* you judge them to be epistemically no-loss relative to you. Reflection fails because it demands deference even when you know the future self violates these conditions (e.g., the 'pill' case). We should treat future selves like experts: defer only when the epistemic conditions are met."

  **The Hand-Waving Admission:**
  "Honestly? About 40% of that is hand-waving.
  **Why:** In practice, we defer to experts under *uncertainty* about their evidence/reasoning. We don't calculate (i) and (ii) explicitly. If I make Expert Deference conditional on *certainty* of no-loss (to match my Reflection critique), I make Expert Deference too weak to be useful. I am banking on the intuition that 'future self' and 'expert' are disanalogous enough to bear different normative weights, but formally, the math looks identical. If they push on the formal equivalence, I have to concede that Expert Deference also needs to be weakened to a conditional norm."

  ---

  ## 2. THE "MARTINGALE" OBJECTION
  **Who:** The Accuracy-First Bayesian who loves representation theorems.
  **The Claim:** "Reflection is just the martingale property of conditional expectation ($E_t[P_{t'}(A)] = P_t(A)$). If you deny Reflection, you're denying the basic math of conditionalization. You're saying your credences shouldn't follow the laws of probability over time."
  **Damage Level:** High. Makes you look mathematically incompetent.

  **The Two-Minute Reply:**
  "I'm not denying the martingale property of conditional expectation. I'm denying that *actual belief updates* always follow conditionalization.
  The martingale property holds *if* you update by conditionalization on a partition of evidence. My 'No-Loss' version says: Reflection holds *if and only if* you are certain your future update will be conditionalization on a superset of evidence (condition i) without reasoning loss (condition ii).
  The counterexamples (pills, forgetting) are cases where you *know* you will not be conditionalizing. In those cases, the martingale property shouldn't hold normatively. I'm preserving the math for the cases where the model fits (standard learning) and rejecting it for cases where the model breaks (manipulation/forgetting)."

  **The Soft Spot:**
  "Accuracy-firsters argue that you should *minimize expected inaccuracy*, which *entails* the martingale property regardless of how you actually update. They will say I'm conflating descriptive updating with normative ideals. I have no reply if they insist that 'rationality' just *is* minimizing expected inaccuracy by definition."

  ---

  ## 3. THE "HOPE NOBODY ASKS" OBJECTION (Checkability)
  **Who:** Anyone paying attention (likely the Imprecise Prob or Self-Locating person).
  **The Claim:** "Your 'No-Loss' version requires you to be *certain* now that your future self has more evidence and retained reasoning. How do you ever check that from the inside? If you can't verify (i) and (ii), your norm is vacuous. It never applies."
  **Damage Level:** Medium-High. Turns your theory into a triviality.
  **Status:** **This is the one you hope they skip.**

  **The Two-Minute Reply:**
  "It's an idealized norm, like 'ought implies can.' It delineates the boundary of rational coherence.
  Even if I can't be *logically certain*, I can have high credence. The principle scales: The more confident I am that (i) and (ii) hold, the closer my current credence should be to my anticipated future credence.
  Also, in standard cases (e.g., waiting for a lab result), I *am* certain I'll have more evidence and won't forget the math. The norm does work there. It only 'fails' in the exotic counterexamples, which is exactly my point: those aren't standard learning scenarios."

  **The Soft Spot:**
  "If they press on 'certainty,' I'm dead. In formal epistemology, 'certain' means credence 1. I rarely have credence 1 that I won't have a stroke tomorrow. If the norm requires credence 1, it's empty. If it requires high credence, I need to specify the threshold, which opens me up to arbitrariness charges."

  ---

  ## 4. THE VAN FRAASSEN LOYALIST
  **Who:** The VF defender.
  **The Claim:** "You're treating Reflection as an evidence-accumulation principle. Van Fraassen never said that. It's about the *value* of your future opinions as a commitment. It's a diachronic Dutch Book avoidance, not an evidence tracker."
  **Damage Level:** Medium. Makes you look like you misread the literature.

  **The Two-Minute Reply:**
  "I acknowledge the Dutch Book argument. But the Dutch Book only sticks if the future self is a reliable betting partner.
  If I know my future self is taking a 'confidence pill' (violating ii), I can construct a Dutch Book *against* following Reflection.
  So, the Dutch Book argument actually *supports* my No-Loss restriction. The obligation to defer exists only when the future self is a coherent agent relative to the current one. If the future self is compromised, the diachronic coherence requirement dissolves."

  **The Soft Spot:**
  "Van Fraassen might argue the commitment itself has value regardless of epistemic quality. I'm prioritizing truth-tracking over coherence-for-coherence's-sake. If they value coherence more than accuracy, we talk past each other."

  ---

  ## 5. THE SLEEPING BEAUTY OBJECTION
  **Who:** The Self-Locating Belief person.
  **The Claim:** "In Sleeping Beauty, Reflection fails because of indexical uncertainty. Does your No-Loss version fix SB? Or does SB break your No-Loss version?"
  **Damage Level:** Low/Medium. A distraction, but can eat time.

  **The Two-Minute Reply:**
  "Sleeping Beauty cases involve self-locating information where 'evidence' is ill-defined. My principle applies to standard propositions where evidence sets are comparable.
  In SB, condition (i) is ambiguous: does waking up count as 'more evidence'?
  I'm not solving SB today. I'm arguing that in *standard* cases where we know we will forget or be manipulated, Reflection fails. SB is a edge case about indexicals, not a counterexample to the claim that pills/forgetting break Reflection."

  **The Soft Spot:**
  "If they argue that *all* temporal belief is self-locating, my distinction collapses. I'm assuming a framework where 'evidence' is objective, which SB challenges."

  ---

  ## 6. THE IMPRECISE PROBABILITY OBJECTION
  **Who:** The two Imprecise Probabilists.
  **The Claim:** "Credences aren't real numbers. Reflection is an equation over reals. Your whole discussion is a category error."
  **Damage Level:** Low. They would say this about anything.

  **The Two-Minute Reply:**
  "Fair. The principle generalizes to sets of probabilities.
  My claim holds for the lower and upper bounds of the set. If I know my future set will be wider (less precise) due to forgetting, I shouldn't tighten my current set to match.
  The No-Loss condition applies to the *information state* driving the set, not just the number. The argument survives the formalism change."

  **The Soft Spot:**
  "I haven't worked out the math for sets. If they ask for the formal proof for imprecise Reflection, I have to bluff."

  ---

  ## STRATEGIC CONCESSION (Say this in the Opening)
  **Do not wait for the Checkability objection.** Pre-empt it.
  **Script:** "I want to be clear upfront: My 'No-Loss' version of Reflection is significantly weaker than the standard principle. It applies less often. If you are looking for a norm that guides you in every case of uncertainty about your future rationality, this isn't it. I am trading *scope* for *robustness*. I'd rather have a principle that holds when it applies than one that applies everywhere but fails in counterexamples."

  **Why:** This disarms the "Vacuity/Checkability" objection (Objection #3). You admit the norm is restrictive, so they can't use it as a "gotcha." It frames the limitation as a feature, not a bug.

  ---

  ## SUMMARY OF TACTICAL PRIORITIES
  1.  **Survive the Expert Deference attack.** (Use the Conditional Deference reply, admit the hand-waving if pressed).
  2.  **Don't get bullied on the Martingale math.** (Insist you are talking about norms, not algebraic identities).
  3.  **Pre-empt the Checkability worry** in the intro (Concede weakness of scope).
  4.  **Ignore Sleeping Beauty** unless forced (It's a time-sink).

  **Final Note:** If the Accuracy-First group starts talking about "Expected Inaccuracy," do not try to out-math them. Pivot to intuition: "Minimizing inaccuracy requires knowing your update rule will be reliable. If you know it won't be, minimizing inaccuracy requires *ignoring* the future self."
