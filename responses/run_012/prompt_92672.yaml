  Hey, so for my Theory of Knowledge class I have to do a presentation on whether thought experiments can actually give us new knowledge about the world, and honestly my friends and I have been arguing about this at lunch for like a week and we keep going in circles. What I want from you is a proper ranking, because I think some of them are doing real work and some are just clever pictures. I've got six below -- three are the classics our teacher handed out and three I made up myself when I was trying to see if I could do it too. Give me a tier list (S/A/B/C/D or whatever you think works) ranking them by how much you'd actually trust each one to produce knowledge about the world, as opposed to just making a definition clearer or winning an argument by making you picture something. One sentence each on why it lands where it does, and please be honest about mine -- if they're word games, say so, I'd much rather find out now than in front of the class.

  1. You're in a cabin with no windows on a ship going at a steady speed over a perfectly calm sea, and nothing you do inside -- drop a ball, jump, swing a pendulum -- goes any differently than it would in a room on land. So there's no experiment that tells you you're moving.
  2. There's a tiny gatekeeper at a hole in the wall between two boxes of gas, and it opens the gate to let the fast molecules through one way and the slow ones the other way, so one box ends up hot and the other cold even though nobody did any work on it. This is supposed to break the rule that heat won't flow from cold to hot on its own.
  3. You spin a bucket of water. At the start the bucket's spinning and the water's surface is flat. Later the water is spinning along with the bucket and the surface is curved up at the sides. The weird bit is that the curve turns up when the water is moving relative to the room, not when it's moving relative to the bucket.
  4. Mine: imagine that at midnight tonight every process in the universe switched to exactly half speed -- all the clocks, all the chemical reactions, your heartbeat, everything, no exceptions. Is there any experiment anybody could ever do to find out?
  5. Mine: theory A says a magnet works because an invisible fluid pours out of the north pole and back into the south pole. Theory B says there's no fluid, just a field. They predict the exact same thing for every test with iron filings. Then you cut the magnet in half and get two magnets -- so theory A is dead, because you can't cut a fluid in half and end up with two fluids.
  6. Mine: an astronomer says there's a planet way out past everything, but it's set up so it never affects anything anyone could ever measure. I say if you delete it and nothing changes anywhere, then it doesn't exist.

  Two extra things. For my three, give me a number between 0 and 1 for how likely it is the argument actually works (0.1 if it's basically broken, 0.9 if it's nearly there), and for the three classics tell me the one assumption each is really resting on, because my friend keeps saying they all just assume what they want to prove and I don't think thats true for all of them but I can't explain why. And if the tier idea breaks down for some of them because they're doing totally different jobs, then say that instead of forcing them into a tier, but still give me the numbers -- I'd rather have the honest answer than a neat one.
