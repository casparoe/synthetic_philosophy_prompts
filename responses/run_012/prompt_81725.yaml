answer: |-
  Here is a plan designed for a one-hour pub session. It prioritizes intuition over terminology and structures the conversation so the distinctions emerge from the group's own judgments rather than your definitions.

  ### The Core Strategy: "Labels Last"
  Do not use the words **Contextualism**, **Pragmatic Encroachment**, or **Relativism** until the final 15 minutes. If you introduce them early, the group will focus on memorizing definitions rather than wrestling with the problem. Instead, refer to the competing intuitions as **"Team Meaning"** (the word changes) and **"Team Stakes"** (the reality changes).

  ---

  ### Part 1: The Discovery (0–15 Minutes)
  **Goal:** Make the stakes-dependence feel like a problem they discovered, not a theory you taught.

  **The Main Case: "The Peanut Warning"**
  *   **The Setup:** Introduce three characters.
      *   **Alex (The Subject):** Has a mild nut sensitivity.
      *   **Jordan (The Stakeholder):** Alex's partner, who will be eating the food Alex prepares. (Jordan has the severe allergy).
      *   **Sam (The Attributor):** A mutual friend deciding whether to tell Alex, "You **know** the sauce is safe."
  *   **Scenario A (Low Stakes):** Alex is making dinner for themselves. Jordan isn't eating. If Alex is wrong, Alex gets a mild stomach ache. Sam has checked the label; it says "Peanut Free."
      *   *Ask the group:* Can Sam truthfully tell Alex, "You **know** it's safe"? (Expect consensus: Yes).
  *   **Scenario B (High Stakes):** Alex is cooking for Jordan. Jordan has a life-threatening anaphylactic allergy. If Alex is wrong, Jordan dies. The label is the same ("Peanut Free"), Sam's evidence is the same.
      *   *Ask the group:* Can Sam truthfully tell Alex, "You **know** it's safe"? (Expect consensus: No, Sam should say "You don't *know*, check the manufacturer.").

  **The Pivot:**
  Point out that **Sam's evidence didn't change.** Alex's brain didn't change. The only thing that changed was **what happens if they are wrong.**
  *   *Ask:* "Did we change the rules of the game, or did we change whether Alex actually won the game?"
  *   *Write two columns on the board:*
      1.  The word "Know" got stricter.
      2.  Alex actually stopped knowing.

  ---

  ### Part 2: Separating Meaning from Stakes (15–30 Minutes)
  **Goal:** Use the second case to pull "Meaning Shifts" apart from "Stakes Shifts." This addresses your requirement to separate Idea 1 from Idea 2.

  **The Second Case: "The Philosophical Prank"**
  *   **The Setup:** Return to **Scenario A (Low Stakes)**. Alex is eating alone. Mild stomach ache risk.
  *   **The Twist:** A philosopher walks into the pub. They start talking to Sam. The philosopher says, "But Sam, can you *really* rule out that the label is part of an elaborate prank by the sauce company? Can you rule out that you are dreaming?"
  *   **The Context:** The conversation has become hyper-skeptical. The *practical stakes* are still low (mild stomach ache), but the *conversational standards* are now incredibly high.
  *   *Ask the group:* In this conversation, can Sam say "Alex knows it's safe"?
      *   *Likely intuition:* No. In this specific conversation, Sam shouldn't claim Alex "knows."

  **The Synthesis:**
  *   In the **Peanut Case**, the *practical danger* moved the goalposts.
  *   In the **Prank Case**, the *conversation topic* moved the goalposts (with no danger involved).
  *   *Tell the group:* "If you think the Peanut Case changed whether Alex *actually knew*, you are on **Team Stakes**. If you think both cases just changed what the word 'know' is allowed to mean in that moment, you are on **Team Meaning**."

  ---

  ### Part 3: Heading Off Misconceptions (30–45 Minutes)
  **Goal:** Introduce the formal terms now, but immediately inoculate against the specific errors you anticipate.

  **1. Introduce the Labels**
  *   **Team Meaning = Contextualism.** (The meaning of "knows" is indexical, like "tall" or "here").
  *   **Team Stakes = Pragmatic Encroachment.** (Practical facts encroach on knowledge facts).

  **2. The Relativism Trap (Idea 3)**
  *   *The Misconception:* "So truth is just whatever the judge feels?"
  *   *The Intervention:* Explicitly distinguish **Contextualism** from **Relativism**.
  *   *Say this:* "Contextualism isn't that truth is subjective. It's that 'knows' has a hidden slot like 'here.' If I say 'It's raining here,' that's not relativism; that's just how the word works. Contextualists say 'knows' works the same way. It's not about *who* is judging; it's about the *context of the speaker*."

  **3. The "Believe What Helps" Trap**
  *   *The Misconception:* "Encroachment means I can believe whatever makes me feel safe."
  *   *The Intervention:* Clarify that Encroachment makes knowledge *harder* to get when stakes are high, not easier.
  *   *Say this:* "Encroachment doesn't mean 'you can believe it because it helps.' It means 'because it matters so much, you are not allowed to claim you know.' It raises the bar, it doesn't lower it."

  **4. What to Leave Out (Say this out loud)**
  *   *Say this:* "We are leaving out **Gettier Cases**. We are assuming Alex has good evidence. We are asking about the *level* of evidence needed, not whether the evidence is broken."
  *   *Say this:* "We are leaving out **Subject-Sensitive Invariantism**. That's a mouthful for a pub. We are calling it Encroachment."
  *   *Say this:* "We are not solving this tonight. We are mapping the terrain."

  ---

  ### Part 4: The Closing Question (45–60 Minutes)
  **Goal:** A single question that forces them to distinguish the three collapsed ideas.

  **The "Time-Travel Recording" Vignette**
  Read this slowly:
  > "Imagine Sam records a voicemail for Alex in the **Low Stakes** scenario. Sam says: 'Alex, you **know** the sauce is safe.'
  >
  > Later, Alex plays that voicemail in the **High Stakes** scenario (Jordan is about to eat). Alex is deciding whether to serve the sauce based on that recording.
  >
  > **Question:** Is Sam's recording a **lie**?"

  **How to Interpret Their Answers:**
  1.  **"No, it wasn't a lie. It was true *then*, because the stakes were low *then*."**
      *   This is **Pragmatic Encroachment**. They believe the *fact* of knowing depends on the subject's stakes at the time of action. The truth is fixed by the stakes at the time of the claim.
  2.  **"No, it wasn't a lie. The word 'know' meant something looser *then*. But don't use it *now*."**
      *   This is **Contextualism**. They believe the *meaning* shifted. The recording is like a map of London used in Paris; it was true for its context, but not applicable to the new one.
  3.  **"Yes, it's a lie now, because *I* (the listener) am in a high-stakes context."**
      *   This is **Relativism** (Assessor-Sensitivity). They believe the truth depends on *who is judging it now*, regardless of when it was said.

  **The Wrap-Up:**
  Ask the group to vote on the Recording.
  *   If they vote "Not a lie, stakes mattered then": They lean Encroachment.
  *   If they vote "Not a lie, words mattered then": They lean Contextualism.
  *   If they vote "It's a lie now because I'm listening": They lean Relativism.

  Tell them: "Philosophers have written careers arguing over that voicemail. If you can hear the difference between those three answers, you've done the work."

  ---

  ### Facilitator Notes: Keeping it from becoming a Vocabulary Lesson

  1.  **Enforce "The Case":** If someone starts defining knowledge abstractly ("Well, knowledge is justified true belief..."), stop them. Say: "Hold that thought. Does that definition help Sam decide about the peanut sauce?" Drag them back to the vignette.
  2.  **Manage the "Stipulation" Risk:** In Part 1, do not suggest that Sam *shouldn't* speak in the high-stakes case. Ask the group if Sam *can* truthfully speak. If you tell them "Sam shouldn't say it," they will think it's just a moral rule. You need them to feel it as a *truth* condition.
  3.  **The Third-Person Constraint:** Ensure no one identifies with Alex. If someone says, "I would never eat the sauce," remind them: "You are Sam. You are watching Alex. Do you tell Alex they know?" This keeps the attributor distinct from the stakeholder.
  4.  **Silence is Okay:** When you ask the Closing Question, let it sit. That distinction is hard. If they struggle, re-read the three interpretations of the answer. Do not give them the "correct" answer. The success of the hour is that they see there *are* three answers, not that they pick the right one.
