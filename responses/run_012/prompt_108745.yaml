answer: |-
  **Term Paper Proposal**

  **Title:** The Hohfeldian Structure of Exclusion: Disambiguating the State's Right to Control Membership

  **Research Question**
  When proponents of the state's right to exclude invoke standard justifications—such as freedom of association, collective self-determination, or the analogy to private property—which specific Hohfeldian incident (liberty, claim-right, power, or immunity) are they justified in claiming vis-à-vis non-members? Specifically, can a state coherently hold a **claim-right** against would-be entrants (imposing a duty on them not to cross), or do these justifications support only a **power** to determine membership status and an **immunity** from external override?

  **Motivation and Problem Statement**
  The contemporary debate over open borders is characterized by a persistent stalemate. On one side, exclusionists argue that states possess a right to exclude analogous to a homeowner's right to exclude trespassers. On the other, cosmopolitan critics argue that freedom of movement is a basic human right that overrides state interests. Both sides typically treat the "right to exclude" as a monolithic normative unit. They argue past one another because they fail to specify the *legal-moral structure* of the right in question.

  In Hohfeldian terms, a "right" can be a liberty (no duty to admit), a claim-right (a duty in others not to interfere), a power (the ability to alter legal relations), or an immunity (protection from having one's legal position altered by others). These incidents have different correlatives and impose different burdens of justification. A liberty to bar entry requires only that the state has no duty to admit; a claim-right requires that the migrant has a duty not to approach. A power concerns the state's capacity to grant or deny citizenship; an immunity concerns the state's protection from international coercion.

  Current literature leaves this open because standard justifications are structurally ambiguous. For example, an argument from **freedom of association** might successfully establish a *liberty* not to associate (the state need not invite outsiders), but it is often deployed to defend a *claim-right* (outsiders must not attempt to associate). An argument from **collective self-determination** might establish an *immunity* from external interference (other states cannot dictate policy), but is often used to justify a *claim-right* against individuals. Conversely, cosmopolitan critiques often successfully attack the *claim-right* to bar entry but fail to address the *power* to define the terms of membership once entry occurs.

  This ambiguity allows exclusionists to claim the moral high ground of association while enforcing the harsh reality of physical barring, and it allows critics to demand open borders without addressing the legitimate interest a community has in constituting its own membership rules. The debate remains intractable because the parties are not disputing the same normative relation.

  **Proposed Thesis and Position**
  This paper will take a definite position on the structure of the right. I will argue that the **power** to alter the status of entrants (from alien to member) is the only load-bearing incident that can be coherently justified by the standard exclusionist grounds. The **claim-right** to physically bar entry (imposing a duty on non-members to stay away) is a category error that cannot be sustained vis-à-vis agents who are not yet subject to the state's authority.

  The project aims to establish that a defensible exclusionism must retreat from defending the right to *keep people out* (claim-right) to defending the right to *determine who belongs* (power). This distinction is not merely terminological; it shifts the normative burden. If the state holds only a power and not a claim-right, it may not be justified in using coercive force at the border to prevent arrival, but it remains justified in denying full political membership and welfare rights to those who arrive. This dissolves the stalemate by granting the cosmopolitan demand for freedom of movement while preserving the exclusionist demand for control over the political community's composition.

  **Methodology and Plan of Work**
  The paper will proceed through four distinct phases over the semester, designed to fit the 6,000-word limit.

  1.  **Conceptual Framework (approx. 1,000 words):** I will briefly define the four relevant Hohfeldian incidents in the specific context of immigration. I will map the correlatives for each:
      *   *Liberty:* State has no duty to admit; Migrant has no-right to demand entry.
      *   *Claim-Right:* State has a right to non-interference; Migrant has a duty not to cross.
      *   *Power:* State can change Migrant's status; Migrant is liable to status change.
      *   *Immunity:* State is protected from external override; International actors are under a disability.
      *   I will demonstrate how the phrase "right to exclude" conflates these in current literature.

  2.  **Diagnostic Analysis of Justifications (approx. 2,000 words):** I will examine the four standard grounds for exclusion (property analogy, freedom of association, collective self-determination, stability of the welfare state). For each, I will ask: *Which incident does this argument actually support?*
      *   I will argue that the **property analogy** attempts to ground a *claim-right* but fails because non-members are not bound by the state's property rules prior to entry.
      *   I will argue that **freedom of association** grounds a *liberty* (no duty to associate) but cannot ground a *claim-right* (duty to avoid) without presupposing the very boundary it seeks to justify.
      *   I will argue that **collective self-determination** grounds an *immunity* (from external dictate) and a *power* (to constitute the demos), but not a right to violently repel individuals.
      *   I will show that proponents of these views routinely slide from the incident they have proven (usually liberty or immunity) to the incident they desire (claim-right).

  3.  **Positive Argument: The Primacy of Power (approx. 2,000 words):** I will construct the positive case for why the **power** is the load-bearing incident. I will argue that the moral value at stake in exclusion is not the physical location of bodies, but the authorship of political rules. A state can respect the human right to movement (denying the claim-right) while retaining the power to deny citizenship, voting rights, or permanent residency. I will address the objection that without a claim-right to bar entry, the power to determine membership becomes meaningless (i.e., if anyone can enter, the community dissolves). I will counter that physical presence does not entail political membership, and that a state can manage the distinction administratively rather than coercively at the border.

  4.  **Objections and Implications (approx. 1,000 words):** I will consider the objection that this distinction is practically inert—if people can enter but have no rights, is this not merely a different form of exclusion? I will respond that the normative justification changes the permissible means of enforcement (e.g., no militarized borders, but administrative status differentiation). I will conclude by summarizing how this decomposition resolves the argumentative stalemate.

  **Why This Approach?**
  This conceptual decomposition is superior to the two obvious alternatives for a paper of this scope.

  First, directly **weighing freedom of movement against state interests** leads to an impasse of incommensurable values. One side prioritizes individual liberty, the other collective security. Without first defining *what* the state is claiming a right to do, the weighing exercise is premature. If the state claims a claim-right, the burden is high; if it claims a liberty, the burden is low. My approach resolves the weighing problem by clarifying the ontological status of the right before the weighing begins.

  Second, turning to **empirical work on the effects of immigration** (economic impact, crime rates, etc.) is unsuitable for a philosophy term paper of this length. Empirical data can inform whether a policy is prudent, but it cannot determine whether the state has the *moral authority* to enact it. Furthermore, empirical debates are contingent and endless; the Hohfeldian confusion is structural and persists regardless of the data. By solving the conceptual confusion, we clarify what empirical data would even be relevant to (e.g., if the right is a power over status, we need data on social cohesion, not just GDP).

  **Deliverables and Scope**
  The final paper will be approximately 6,000 words. It will not attempt to solve the entire immigration debate nor provide a comprehensive theory of global justice. It is a targeted intervention into the *justificatory structure* of the state's right to exclude.

  *   **Success:** A successful paper will demonstrate that the standard justifications for exclusion are category mistakes when applied to the claim-right of border enforcement. It will show that shifting the focus to the *power* over membership preserves the core intuition of exclusionism (control over the polity) without violating the core intuition of cosmopolitanism (freedom of movement). The result is a refined, defensible position that neither side currently occupies.
  *   **Failure:** The project would fail if the decomposition proves to be merely terminological. If distinguishing between a claim-right and a power yields no difference in normative verdicts (e.g., if having the power to deny membership necessarily implies the right to bar entry to make that power effective), then the analysis is inert. I will guard against this by explicitly detailing the policy differences that follow from the distinction (e.g., the permissibility of border walls vs. internal status checks). The project would also fail if I cannot show why non-members are not subject to the claim-right; I must adequately address the "duty to obey" problem for non-subjects.

  **Feasibility**
  The scope is honest for one semester. The Hohfeldian framework is well-defined and requires no new empirical research. The challenge lies in the precise application of the incidents to the specific arguments in the immigration literature. By limiting the analysis to the four standard justifications and the four specific incidents, the project remains manageable within the word limit while offering a novel contribution to the debate. The definite thesis—that the power is load-bearing, not the claim-right—provides a clear argumentative spine that prevents the paper from becoming a mere survey of positions.

  **Conclusion**
  This proposal seeks to move the debate from a contest of competing interests to a clarification of normative relations. By demonstrating that the state's right to exclude is intelligible only as a power to constitute membership rather than a claim-right to bar movement, the paper aims to dissolve the current stalemate. This allows for a position that respects the moral agency of non-members while acknowledging the distinctive authority of political communities to define themselves.
