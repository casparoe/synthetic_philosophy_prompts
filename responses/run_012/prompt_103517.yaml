answer: |-
  **Joint Statement on Origin and Individuation**

  **(1) Shared Commitments**

  1.  Transworld identity is a theoretical construct rather than an empirical observation; therefore, no biological data can directly confirm or refute modal claims without metaphysical mediation.
  2.  Intuitions regarding the **Duplicate Case** (identical genome and life trajectory arising from distinct gametes in different worlds) are deeply theory-laden and do not decisively establish either necessity or contingency.
  3.  The **Fusion Case** (a single organism formed by the merger of two embryos) demonstrates that linear origin narratives are biologically contestable and leaves the metaphysical status of "single origin" open.
  4.  Both parties agree that "same individual" functions differently across legal, psychological, and fundamental metaphysical contexts, and confusion arises when these levels are conflated.
  5.  Neither the Duplicate nor the Fusion cases currently resolve the modal status of gametes; both remain live possibilities requiring further conceptual clarification rather than mere intuition pumping.

  **(2) Points of Disagreement**

  | Issue | Origin Essentialist Position | Origin Contingentist Position |
  | :--- | :--- | :--- |
  | **Metaphysical Status of Gametes** | Specific gametes are constitutive of the organism's identity; changing them changes the *who*. | Gametes are causal conditions for existence, not constitutive of identity; the *who* survives gametic variation. |
  | **Duplicate Case Verdict** | The duplicate is a distinct individual (a counterpart), not the same person in another world. | The duplicate is the same person, provided psychological and genetic continuity are maintained. |
  | **Fusion Case Verdict** | The organism has one primary origin; the second embryo is absorbed material, not a co-origin. | The organism has plural origins; identity can supervene on multiple causal histories simultaneously. |
  | **Role of Genetic Identity** | Genetics are a byproduct of origin, not the ground of identity. | Genetics (or functional continuity) are the primary ground of identity across possible worlds. |
  | **Individuation Basis** | Individuation is historical and backward-looking (causal chain). | Individuation is forward-looking (psychological/biological continuity). |
  | **Modal Scope** | Modal claims track the actual history of the token organism. | Modal claims track the sortal properties of the organism type. |

  **(3) Cruxes and Advance Predictions**

  **Sub-question 1: Does the Fusion Case force a redefinition of "origin" from a point to a set?**
  *Agreed Bearing:* Both sides accept that if tetragametic chimerism is treated as a standard biological variation rather than a pathological anomaly, the "single point" origin model becomes biologically inaccurate.
  *OE Prediction:* We predict biology will classify fusion as a termination of two individuals and the birth of a third, preserving the single-origin rule for the new entity.
  *OC Prediction:* We predict biology will treat the fusion as a continuous process where the resulting organism inherits the causal history of both precursors, validating plural origins.

  **Sub-question 2: Does the Duplicate Case rely on untenable haecceitism?**
  *Agreed Bearing:* Both sides agree that if the Duplicate Case requires believing in primitive "thisness" without qualitative difference, it imposes a heavy metaphysical cost.
  *OE Prediction:* We predict that rejecting haecceitism leads to unacceptable consequences for moral responsibility and memory ownership across worlds.
  *OC Prediction:* We predict that accepting haecceitism is an ad hoc maneuver to save essentialism from counterexamples involving identical genomes.

  **Sub-question 3: Is individuation relative to sortals?**
  *Agreed Bearing:* Both sides acknowledge that if "organism" and "person" have different individuation conditions, the dispute may be localized to which sortal is metaphysically privileged.
  *OE Prediction:* We predict the biological sortal ("organism") governs the metaphysical facts, fixing identity at conception.
  *OC Prediction:* We predict the psychological sortal ("person") governs moral identity, allowing origin contingency for the person even if the organism is fixed.

  **(4) Verbal Residue**

  A portion of this dispute is merely verbal, centering on the terms **"Individual"** and **"Origin."** The Essentialist uses "individual" to denote a specific historical token defined by its causal inception. The Contingentist uses "individual" to denote a continuity of life or consciousness that could have been instantiated differently. Similarly, "origin" signifies a singular necessary condition for the Essentialist, but a cluster of sufficient conditions for the Contingentist. While these semantic differences explain some friction, they do not dissolve the substantive disagreement regarding whether the *actual* causal history constrains *possible* existence.
