prompt: |-
  I'm a second-year PhD student in philosophy, and over the last year I've become convinced that what makes an act right or wrong has something to do with its consequences, but I keep finding that my gut verdicts about consequences don't form anything like a system once the consequences get hard to trace. A friend of mine has taken to calling this the cluelessness problem and says I should just pick a line and defend it; I'd rather first find out which line I'm actually on. So here is what I think, case by case, as honestly as I can put it. Giving a hundred dollars to a charity that distributes anti-malarial bednets, where the evidence for effectiveness is solid: straightforwardly good, close to obligatory, and I lose no sleep over the fact that I can't trace which child gets the net. Letting a car merge in front of me in traffic: a small good, and I don't think its goodness consists in whatever the ripples turn out to be; if the four-second delay makes the driver miss a light and that reshapes their life, that doesn't make my courtesy better or worse. Voting in a national election: worth doing, and I'd think slightly less of a friend who stayed home out of pure indifference, even though the chance my vote is decisive is negligible and the long-run effects of the election are anybody's guess. Skipping a bottle in the recycling bin: nothing at all, no guilt, not worth a second thought, though I do think a society that stopped recycling would be in trouble. Buying a five-dollar shirt whose supply chain may or may not involve forced labor: somewhat wrong, and I feel it, even though I can't trace my purchase to any particular harm and my individual causal contribution is as negligible as the bottle's. A friend choosing between a career in pandemic-preparedness policy and one in quantitative finance: clearly should take the first, and I'd argue with them for an hour, though neither of us can trace how either career plays out over forty years. A friend asking whether to have a child: I refuse to answer in these terms at all, the frame seems to break, and I'd be embarrassed to run expected-value arithmetic on it. A physicist in the mid-1920s deciding whether to go into nuclear physics: not blameworthy for what the field later enabled, and not because the weapons were fine, but because he couldn't have known. A friend considering going to work on frontier AI: I think they should weigh the tail risks heavily even though nobody can trace how their specific contributions matter, and I don't accept that the absence of a traceable mechanism gets them off the hook.

  The pair I can't square on my own is the bottle and the shirt: both are tiny individual contributions to a large-scale pattern, and I treat one as nothing and the other as a real (if small) wrong, and I suspect that if I explain the difference by saying the shirt makes me complicit, I've stopped giving a consequentialist answer without noticing. The other pair is voting and recycling: same negligible individual effect, opposite verdicts, and I can't tell whether the difference is the size of the stakes conditional on mattering, the fact that voting is a shared practice rather than a private habit, or just sentiment. And I notice that throughout I've been sliding between three different things — how good the act's consequences are, whether the agent is blameworthy, and what the agent had reason to do given what they knew — and I don't know whether that slide is a confusion on my part or a sign that the principle has to split along that seam. The best I've managed on my own is this: an act is right just in case the expected value of the consequences I can foresee, through a mechanism I could describe in advance, is positive. I know that's bad, because it makes voting worthless, the shirt purchase fine, and the AI job a non-issue, all of which I reject.

  What I want from you is a principle, or a small set of candidates, stated precisely enough that I can test it, that gets as many of my verdicts as possible. For each clause, tell me which of my cases motivates it. Tell me which of my verdicts the principle forces me to abandon, and which abandonment is least costly. Tell me what it says about the case I keep going back and forth on: taking a well-paid job at an advertising-technology firm whose product I suspect degrades public discourse in ways nobody can measure, in order to donate half the salary to the bednet charity. Tell me whether the principle has to be split into an axiological part and a decision-guiding part to survive my three-way slide, and whether my verdicts are consistent once it is. Finally, give me its verdicts on two further cases I haven't listed, and name the single case that would most sharply separate the surviving candidates from each other.
