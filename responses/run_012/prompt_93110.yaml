answer: |-
  Here is a principle constructed to accommodate your specific constellation of verdicts, followed by the analysis you requested.

  ### The Principle: Risk-Weighted Participatory Consequentialism (RWPC)

  **Definition:** An act $A$ is **subjectively right** (rationally required) for an agent $S$ at time $t$ if and only if $A$ maximizes the **Participatory Expected Value (PEV)** among available alternatives.

  **PEV is calculated by summing three clauses:**

  1.  **The Foreseeable Consequence Clause:** The probability-weighted sum of all *traceable* consequences of $A$ (standard Expected Utility).
      *   *Motivation:* Captures the **Bednets** case (solid evidence, traceable mechanism) and the **Physicist** case (limits blame to what was knowable/traceable at $t$).
  2.  **The Complicity Clause:** A negative value term proportional to the *expected moral disvalue of the system* $S$ participates in by performing $A$, weighted by the degree to which $A$ constitutes participation, regardless of traceable causal impact.
      *   *Motivation:* Captures the **Shirt** case (wrong due to participation in a harmful supply chain despite negligible causal impact) and distinguishes it from the **Bottle** (participation in a neutral/beneficial system). It also captures the **AI** case (participation in a high-risk frontier).
  3.  **The Coordination Clause:** In cases where $A$ is part of a collective practice $P$ necessary for a significant good $G$, the value of $A$ includes the expected value of $G$ multiplied by the probability that $A$ sustains the norm of participating in $P$ among relevantly similar agents.
      *   *Motivation:* Captures the **Voting** case (negligible causal impact, but sustains the democratic norm) and the **Pandemic Career** case (joining a collective effort where individual contribution is hard to trace but systemic need is high).

  **Axiological/Decision Split:**
  *   **Objective Rightness:** Determined solely by actual outcomes (Clause 1 only).
  *   **Subjective Rightness (Rationality):** Determined by PEV (Clauses 1, 2, & 3).
  *   **Blameworthiness:** Tracks violations of Subjective Rightness, not Objective Rightness.

  ---

  ### Analysis of the Principle

  #### 1. Motivations for Clauses
  *   **Clause 1 (Foreseeable Consequence):** Motivated by **Bednets** and **Traffic Merge**. You want standard consequentialism to work where evidence is solid or consequences are proximate. It also grounds the **Physicist** verdict: since the weapons were not foreseeable consequences via a describable mechanism in the 1920s, the Objective/Subjective split ensures he is not blameworthy (Subjective Rightness was maintained).
  *   **Clause 2 (Complicity):** Motivated by the **Shirt** and **AI** cases. This clause allows you to condemn acts that lack traceable causal power but involve joining a harmful structure. It explains why the Shirt is wrong while the Bottle is not: the Shirt supports a *harmful* structure (forced labor), while the Bottle supports a *beneficial/neutral* structure (waste management).
  *   **Clause 3 (Coordination):** Motivated by **Voting** and **Pandemic Career**. This solves the "negligible probability" problem. Your vote matters not because it breaks a tie, but because your participation sustains the *practice* of voting, which is necessary for the good of democracy.

  #### 2. Verdicts You Must Abandon
  To maintain consistency with RWPC, you must abandon or revise one specific verdict: **The Recycling Bottle.**

  *   **The Conflict:** You treat the Bottle as "nothing at all, no guilt." However, if the Shirt is wrong because it participates in a harmful system (Clause 2), and Voting is right because it sustains a beneficial practice (Clause 3), then Recycling cannot be morally neutral. Recycling is participation in a cooperative practice (waste management) that yields a collective good.
  *   **The Revision:** RWPC dictates that skipping the bottle is **pro tanto wrong**, similar to voting. It violates the Coordination Clause. You must accept that you have a weak obligation to recycle, grounded in the same logic that makes voting obligatory.
  *   **Cost Assessment:** This is the **least costly abandonment**. Your intuition that the bottle is "nothing" is likely a result of *causal* thinking (my bottle won't fill the landfill alone). Once you accept the *participatory* logic required to save the Shirt and Voting verdicts, the Bottle verdict is the outlier. Revising it creates a unified theory of "small acts."

  #### 3. The Ad-Tech Job Case
  **Case:** Well-paid ad-tech job (suspected discourse degradation) vs. donating 50% salary to Bednets.

  **RWPC Verdict:** **Subjectively Wrong (Do not take the job).**

  *   **Calculation:**
      *   *Clause 1 (Foreseeable):* High positive value from the donations (Bednets are highly effective). Low traceable negative value from your specific code (causal dilution).
      *   *Clause 2 (Complicity):* High negative value. You are directly participating in a system you *suspect* degrades discourse. Unlike the Shirt (where you are a consumer), here you are an *agent* of the harm. RWPC weights active participation in harm heavily. Furthermore, you noted regarding AI that "absence of a traceable mechanism" doesn't get one off the hook; the same applies here.
      *   *Clause 3 (Coordination):* Neutral/Negative. Taking the job normalizes "earning to give" via harmful industries, potentially undermining the norm that careers should be intrinsically aligned with social good.
  *   **Reasoning:** While the Bednet donations generate massive Clause 1 value, the Complicity Clause acts as a **constraint**, not just a counterweight. Your intuition on the Shirt suggests that complicity in harm is not fully offset by unrelated good deeds (you didn't suggest buying the shirt and donating to charity to make it right). Therefore, the direct participation in a suspected harmful system renders the act irrational, despite the fungible good the salary could do.

  #### 4. The Axiological/Decision-Guiding Split
  **Does the principle have to be split?** **Yes.**

  Your observation about sliding between "good consequences," "blameworthiness," and "reason to act" is the key to solving the **Physicist** and **AI** tension.
  *   **Without the split:** If Rightness = Best Actual Consequences, the Physicist is objectively responsible for the bomb (which you reject), or the AI researcher is not responsible for the risk (which you also reject).
  *   **With the split:**
      *   **Objective Value:** Determined by what actually happens. (The Physicist's work *did* enable bombs).
      *   **Subjective Rationality:** Determined by PEV at the time of choice. (The Physicist acted rationally; the AI researcher acts irrationally if they ignore tail risks).
      *   **Consistency:** Your verdicts are consistent *only if* you accept that an agent can do the "right thing" (Subjectively) while contributing to a "bad world" (Objectively), and vice versa. The "slide" you noticed is actually the friction between these two distinct evaluative categories. RWPC formalizes this friction.

  #### 5. Two Further Cases

  **Case A: The Well-Meaning Scammer**
  *   *Scenario:* You donate to a charity that *appears* to have solid evidence (like Bednets) but is actually a sophisticated scam that keeps 100% of the funds.
  *   *RWPC Verdict:* **Subjectively Right, Objectively Wrong.**
  *   *Why:* Clause 1 (Foreseeable) is positive based on available evidence. You maximized PEV. You are not blameworthy. However, the actual outcome is neutral/bad. This tests your commitment to the Subjective/Objective split.

  **Case B: The Threshold Voter**
  *   *Scenario:* You are voting in a small local election where polling suggests a high probability of a tie (1 in 100 chance your vote is decisive).
  *   *RWPC Verdict:* **Strongly Obligatory.**
  *   *Why:* Clause 1 (Foreseeable) now has significant weight (1% of the election value is huge). Clause 3 (Coordination) also applies. This distinguishes the case from the National Election, showing that when causal traceability *increases*, the obligation tightens, but the participatory duty remains in both.

  #### 6. The Discriminator Case
  To separate RWPC from its closest rivals (Standard Act Consequentialism and Rule Consequentialism), consider this case:

  **The Causally Inert Accomplice**
  *   *Scenario:* You join a group of ten people planning to destroy a bridge. Ten people are required to lift the explosives. You show up, but unbeknownst to you, one of the other nine is a undercover cop who secretly disables the explosives. The bridge is not destroyed. Your presence was causally unnecessary (the cop would have stopped it anyway, or the group would have failed without you).
  *   **Standard Act Consequentialism:** **Permissible.** Your act caused no harm. The outcome was neutral.
  *   **Rule Consequentialism:** **Wrong.** You violated a rule against joining destructive groups.
  *   **RWPC:** **Wrong.**
  *   **Why this separates them:** Rule Consequentialism condemns the act based on the *generalization* of the rule. RWPC condemns the act based on the **Complicity Clause** (Participation in a harmful structure) *even when causal impact is zero and the outcome is good*.
  *   **The Sharp Edge:** If you feel the Accomplice is blameworthy *because they joined the harm* rather than *because everyone joining would be bad*, RWPC is your theory. If you feel they are blameless because the bridge stood, you are an Act Consequentialist. If you feel they are blameworthy because "what if everyone did that?", you are a Rule Consequentialist. Your verdict on the **Shirt** suggests you lean RWPC: the harm exists in the participation, not just the outcome or the rule.
