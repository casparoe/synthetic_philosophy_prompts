      *   *Refutation:* No. You want suffering to be *zero*. You are indifferent to pleasure. You don't *want* misery; you want the *absence* of misery. A world with no suffering and no pleasure is neutral. A world with no suffering and lots of pleasure is *also* neutral (intrinsically), though perhaps instrumentally safer.
