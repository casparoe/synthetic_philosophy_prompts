answer: |-
  First, regarding the referent of "It" and the force of "instituted": In this passage, "It" refers to "true religion," which Locke treats synonymously with the Church understood as a voluntary society of believers. When Locke says it is "instituted," he implies a divine, rather than a civil, origin. It is instituted by God (specifically through Christ and the Apostles) at the founding of the Christian covenant, and its end is the salvation of souls. The four clauses that follow are structured as a tricolon of negations set against a single affirmation. "External pomp," "ecclesiastical dominion," and "compulsive force" are grouped together as worldly, political, or civil ambitions that belong to the sphere of the Commonwealth. These are contrasted sharply with the affirmative clause: "the regulating of men's lives, according to the rules of virtue and piety." Locke is not merely listing rival purposes; he is drawing a categorical boundary. The first three describe the *mechanisms* and *ambitions* of the State (or a corrupt church acting like a state), while the fourth describes the *spiritual function* of the Church. The structure insists that if the Church adopts the first three, it ceases to be "true religion" and becomes a political faction.

  Second, concerning "the regulating of men's lives": This phrase does not grant the church jurisdiction coextensive with the magistrate's. You are right to sense a potential overlap, as both church and state concern themselves with human conduct. However, Locke distinguishes them by the *domain* of that conduct and the *mode* of regulation. The magistrate regulates outward actions that threaten "civil interests" (life, liberty, and estate). The church regulates the inward disposition and moral character necessary for salvation ("virtue and piety"). The key modifier is "piety." Piety refers to duties owed to God, which are invisible to the magistrate and cannot be adjudicated by civil courts. Furthermore, the "regulation" Locke describes here is pastoral and voluntary, not legal and coercive. A church regulates its members through admonition, teaching, and, ultimately, excommunication (casting them out of the society), whereas the magistrate regulates through fines, imprisonment, or force. The sentence supports the reading that "virtue and piety" pick out an inward and voluntary domain. The argument as a whole requires this reading because if the church's regulation were coextensive with the state's, there would be no need for toleration; one power would simply absorb the other. Locke's point is that the church *guides* life toward salvation, but it cannot *compel* it, because salvation requires voluntary assent.

  Third, the connection between the sentences moves from definition to anthropology to conclusion. The first sentence defines the *telos* (end) of religion (salvation via virtue/piety). The middle sentences ("Whosoever will list himself...", "It is in vain for any man...") establish an anthropological and theological premise: salvation is an internal state ("embraced... in their own hearts") that requires personal struggle ("war upon his own lusts"). Because belief and holiness are internal, they cannot be transferred or imposed by another. This leads to the conclusion in the final sentence: faith works "not by force, but by love." The argument establishes that coercion **misconceives what Christianity is**. It is not merely that coercion is ineffective (though Locke argues that elsewhere); it is that coercion is category error. You cannot force a mind to assent to a truth, and you cannot force a heart to love God. To use force is to produce hypocrisy, not faith. Therefore, the argument is that coercion is self-defeating regarding the specific end of religion (salvation), because salvation *by definition* requires voluntary faith. The passage establishes that force is incompatible with the *nature* of the end being pursued.

  Fourth, and most critical for your board context: This passage by itself primarily describes what the *church* is for, rather than explicitly limiting the *magistrate*. It argues that the Church *ought not* to use force because force is alien to its mission. However, it implies a limit on the magistrate through the premise that "faith... [cannot work] by force." If faith cannot be compelled by force, then the magistrate (whose only tool is force) has no competence in religious matters. But this passage is not the sole load-bearing beam for that conclusion. The wider argument supplies a necessary companion premise: that the Magistrate's power is *only* justified for the preservation of civil interests, not the care of souls. Without that second premise, a Magistrate could argue, "I know the Church shouldn't use force, but I am the State, and I will use force to make people virtuous for the public good." This passage is not ornamental—it defines the nature of religious belief—but it requires the companion definition of the State to fully prohibit state interference. For your purposes, the passage argues that because the congregation's business is persuasion (love), not coercion (force), their presence in a public facility does not inherently imply state establishment of religion, provided the state is not using them to coerce others.

  Finally, regarding where a reader is likely to over-read: The phrase "faith which works, not by force, but by love" is primarily a claim about the **proper instruments of an institution**, grounded in the **psychology of belief**. It is not merely an ethical suggestion that conversion *should* be kind; it is an ontological claim that belief *cannot* be kindled by the sword. If you read it only as ethics, you miss Locke's point that state coercion in religion is irrational, not just mean. Regarding "innocence of life": This phrase appears later when Locke discusses the magistrate's power over vice. Locke concedes the magistrate *may* punish actions that violate the "innocence of life" (civil harms), even if a religious person claims them as rites. This should refine your reading of the passage above by clarifying that "regulating of men's lives" in the religious sense does not grant the church immunity from civil law. The church regulates *piety*; the state regulates *innocence* (civil safety). If the congregation's use of the auditorium violates civil rules (safety, access), the "regulating" Locke describes in your passage does not protect them. It protects their *doctrines* and *worship*, not their exemption from neutral civil regulations.
