answer: |-
  # Spec Sheet: Requirements for a Theory of Persistence

  **Purpose:** This document does not adjudicate between Endurantism, Perdurantism, Exdurantism, or Constituent Ontology. It outlines the functional constraints any adequate metaphysics of persistence must satisfy. If a theory cannot check these boxes, it is incomplete, regardless of its intuitive appeal.

  ---

  ## I. Core Desiderata (The Standard Constraints)

  ### 1. Accommodation of Intrinsic Change
  **The Constraint:** The theory must explain how a single entity can possess incompatible intrinsic properties at different times without violating logical consistency.
  **The Earned Entry:** This is not merely about "things changing." It is a specific logical tension. If Object $O$ at $t_1$ is *Red* and Object $O$ at $t_2$ is *Green*, and $O$ is numerically identical across $t_1$ and $t_2$, we face a violation of the Indiscernibility of Identicals (Leibniz's Law). If $O$ is "wholly present" at both times, it seems $O$ simply *is* Red and *is* Green. A theory must deliver a mechanism (temporal parts, relations to times, adverbial modification, etc.) that resolves this contradiction without denying the reality of change or the reality of identity.

  ### 2. Resolution of Coincidence (The Lump/Statue Problem)
  **The Constraint:** The theory must account for cases where distinct sortals apply to the same spacetime region but imply different modal profiles.
  **The Earned Entry:** Consider a clay lump and a statue constituted by that lump. They share all matter and location. Yet, the statue cannot survive being squashed, while the lump can. If they are identical, they must share all properties (by Leibniz's Law). If they are distinct, how do they occupy the same space without violating the impenetrability of matter? A theory must specify whether constitution is identity, or if two things can be in the same place at the same time, and justify the cost of that choice.

  ### 3. Handling of Fission (Branching Identity)
  **The Constraint:** The theory must provide truth conditions for survival in cases where one predecessor appears to have two equally qualified successors.
  **The Earned Entry:** Identity is strictly one-to-one and transitive. Survival intuition is often one-to-many. If a person undergoes fission (e.g., brain bisection where both halves are transplanted), both successors have equal claim to be the original. If the original is identical to Left, and identical to Right, then Left is identical to Right. But they are two people. A theory must decide: does identity break down here (no survival), is it indeterminate, or is "what matters in survival" not strict identity?

  ### 4. Relativistic Coherence
  **The Constraint:** The theory must define persistence without relying on absolute simultaneity or a privileged "present."
  **The Earned Entry:** Special Relativity demonstrates that simultaneity is frame-relative. There is no unique "slice" of spacetime that constitutes "now." Traditional formulations of endurance rely on an object being "wholly present at a time." If "a time" is not an absolute invariant, "wholly present" becomes frame-dependent. A theory must explain how an object persists through spacetime without assuming a Newtonian background that physics has ruled out.

  ---

  ## II. Stress Tests (The Novel Cases)

  These cases are not merely examples; they target specific vulnerabilities in the machinery of persistence.

  ### Case (a): The Frozen Organism (Cryptobiosis)
  *An organism enters zero-metabolism stasis for 50 years, then revives.*
  *   **Desideratum Tested:** **Causal Continuity vs. Gappy Existence.**
  *   **The Pressure:** Standard theories often require spatiotemporal continuity for identity. Here, the causal chain of *states* is paused, though the material substrate remains.
  *   **Pass Condition:** The theory must specify whether persistence requires an unbroken chain of causal processes (which would imply the organism ceased to exist and a duplicate began) or if it tolerates "gaps" in existence. If it tolerates gaps, it must provide a principle to distinguish this revival from a scenario where the frozen body is destroyed and a perfect molecule-for-molecule duplicate is created elsewhere 50 years later.

  ### Case (b): The Dissolved Company
  *A legal entity is dissolved on Friday and reincorporated on Monday with identical assets, staff, and name.*
  *   **Desideratum Tested:** **Ontological Dependence on Convention.**
  *   **The Pressure:** This tests whether persistence conditions are mind-independent (natural kinds) or mind-dependent (social kinds). Physically, the "stuff" never left. Legally, the entity ceased to exist.
  *   **Pass Condition:** The theory must clarify the ontological status of social objects. If the theory claims persistence is objective, it must explain how a legal decree can annihilate an object that physically persists. If the theory claims persistence is conventional, it must explain why we cannot simply "reincorporate" a biological human in the same way. It must delineate the boundary between natural and conventional persistence conditions.

  ### Case (c): The Freezing River
  *A river freezes solid in winter (becoming a static block of ice) and thaws in spring (becoming flowing water).*
  *   **Desideratum Tested:** **Sortal Sensitivity and Phase Tolerance.**
  *   **The Pressure:** This targets the distinction between *matter* and *form*. Is the river the water (which changes) or the channel/process (which remains)? When frozen, is it a river or a pond?
  *   **Pass Condition:** The theory must account for radical qualitative change in constituent parts while maintaining identity under a specific sortal. It must explain whether the identity conditions are tied to the material constituents (the H2O molecules) or the functional role (the drainage system). A theory that ties identity too tightly to matter fails the flow; a theory that ties it too tightly to function risks making the river an abstract event rather than a concrete object.

  ---

  ## III. Incompatibility Matrix (The Trilemma)

  Do not tell students they can have it all. They cannot. The following three commitments form a trilemma; a coherent theory must reject or modify at least one.

  1.  **Strict Numerical Identity:** Persistence consists in an object at $t_1$ being *numerically identical* to an object at $t_2$.
  2.  **Intrinsic Properties:** Objects possess properties (like shape, color, mass) intrinsically, not essentially relative to a time or frame.
  3.  **Unrestricted Indiscernibility of Identicals (LL):** If $x$ is identical to $y$, $x$ and $y$ share all properties.

  **The Conflict:**
  If an object persists (1), and changes properties (2), it violates (3).
  *   **Drop (1):** You get Counterpart Theory or Exdurantism (persistence is a relation between distinct entities).
  *   **Drop (2):** You get Perdurantism or Relational Endurantism (properties are had *at-a-time*, not simpliciter).
  *   **Drop (3):** You accept true contradictions (Dialetheism) or radical opacity in identity (rare, generally rejected).

  **Non-Negotiables vs. Prejudices:**
  *   **Non-Negotiable:** **Logical Consistency.** A theory cannot entail that $P$ and not-$P$ are true in the same sense at the same time. (This forces the modification of one of the three above).
  *   **Prejudice:** **"Wholly Present."** The intuition that the *entire* object exists at every moment of its history is a prejudice of common sense, not a logical requirement. It is the first thing to go when satisfying Relativistic Coherence.
  *   **Prejudice:** **"Identity is What Matters."** The assumption that survival *must* be identity is a prejudice. Fission cases suggest what matters in survival might be psychological continuity or causal connection, which can branch, whereas identity cannot.

  ---

  ## IV. The Killer Constraint

  If you insist on a single requirement from this list, the one that does the most destructive work against otherwise popular theories is:

  ### **Relativistic Coherence**

  **Why it wins:**
  Most "common sense" and classical metaphysical theories are built on a Newtonian conception of time. They assume there is a fact of the matter about "what exists now."
  *   **Naive Endurantism** (The view that objects are wholly present at each moment) is effectively killed by this constraint. To be "wholly present," an object must occupy a 3D slice of spacetime. But Special Relativity proves there is no unique 3D slice. An object that is "wholly present" in one reference frame is sliced into temporal parts in another.
  *   **The Cost:** Insisting on Relativistic Coherence forces you to either adopt a 4D ontology (Perdurantism) where the object is a spacetime worm, or develop a highly complex, non-standard Endurantism (such as "Relativistic Endurance") that abandons the intuitive notion of "wholly present."
  *   **The Result:** It filters out any theory that treats time as a universal container rather than a dimension integrated with space. It demands that the metaphysics of persistence bow to the physics of spacetime.

  **Instruction for Seminar:**
  Use this spec sheet to grade the theories, not the other way around. When a student argues for a position, ask them: "Does this solve the Frozen Organism without violating Relativistic Coherence?" If they cannot answer, they are doing intuition, not metaphysics.
