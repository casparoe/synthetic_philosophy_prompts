      *   **Core Belief:** Accepts the Benatar-style asymmetry (Presence of pain is bad, Presence of pleasure is good, Absence of pain is good even if no one exists to enjoy that good, Absence of pleasure is not bad unless someone exists to be deprived). Conclusion: Coming into existence is always a harm, procreation is always wrong.
