answer: |-
  Friends, colleagues, guests from the chamber and the think tank. Thank you for staying through the dinner. I know the air in this room is heavy. Tomorrow morning, we vote on whether this printing house remains ours, or whether we join the regional chain.

  We need to speak plainly about what is on the table. The offer before us is generous. It clears our debts. It secures every job. It puts more money into every member's pocket at the end of the month. No one in this room should pretend that poverty is a virtue. There is no honor in struggling to pay a heating bill because we are clinging to a slogan. If the only argument for staying independent was stubbornness, we should sell tomorrow. The existing rules of property are not sacred texts; they are tools. If a tool no longer fits the hand, or if trading it brings relief to the worker, then the trade deserves respect. Our guests from the business community are right to remind us that sentiment does not pay wages.

  But economics is not the only measure of a life. We are not just wallets walking around. We are citizens of this workplace. And this brings us to the harder question. What is this place for?

  If a business is merely a machine for generating income, then the chain offer is the rational choice. Machines should be owned by those who can run them most efficiently. But if a business is also a school—a place where people learn how to govern themselves, how to argue, how to compromise, and how to take responsibility for the whole—then the calculation changes.

  For over a century, this floor has been a classroom. Here, you have not just followed orders; you have given them. You have sat in these chairs and decided how the profits are shared, how the apprentices are trained, and what work we refuse to print. That is a specific kind of education. It is messy. It is slow. It is often frustrating. But it builds a certain kind of character. It teaches people that they are capable of managing their own affairs without a master standing over them.

  If we sell, we return to the older way. You will be safer. You will be richer. But you will also be employees. The decisions will be made elsewhere, by people who do not know your names. The relation between employer and employed will return. There is nothing immoral about this; millions live good lives within it. But it is a step away from the idea that workers can be their own masters. We must admit that loss honestly. It is not just a loss of control; it is a loss of a specific kind of freedom.

  However, I must also speak to my fellow cooperators. We cannot romanticize our own model. Independence is valuable, but it is not a shield against error. There is a danger in any small community that it becomes a mould. We can pressure each other to think alike, to vote alike, to prize loyalty over truth. A cooperative can become just as rigid as a corporation if we demand that everyone conform to the ideal of the "good member."

  Our guests believe that the market protects individuality by offering choices. They are partly right. But large chains also smooth out differences. They seek uniformity. They want every branch to look the same, every worker to follow the same script. Whether it is the pressure of the group or the pressure of the brand, the risk is the same: that we stop experimenting.

  A healthy society needs experiments. It needs places where people try to live differently, to work differently. This printing house is one such experiment. It has survived since 1898 not because it is perfect, but because it is adaptable. If we sell, we end the experiment. We join the standard model. There is safety in the standard model. But there is also stagnation.

  We must also ask about power. There is a limit to how much centralized administration we should trust with our independence. When too much control gathers in one hand—whether in a state bureau or a regional board—individual initiative withers. It becomes harder to speak up. It becomes harder to change course. Keeping this house independent keeps a center of decision-making local. It keeps power dispersed. That is good for us, but it is also good for the wider community. A society of self-governing workplaces is more robust than a society of subjects, even well-paid subjects.

  So, where does this leave us tomorrow morning?

  It leaves us with a choice between two legitimate goods. There is the good of security and material comfort. No one should be ashamed to vote for that. If you look at your family and decide that certainty is what they need most, that is a moral choice.

  But there is also the good of agency. The chance to remain a place where workers learn to rule themselves. If you look at this room and decide that losing this school of character would cost us more than the pay raise gives us, that is also a moral choice.

  Do not vote based on guilt. Do not vote based on loyalty to the ghosts of 1898. They did not build this place so you could suffer for their memory. They built it so you could be free. Sometimes freedom means having the security to walk away. Sometimes it means having the courage to stay and struggle.

  The offer on the table is real. The benefits are real. But so is the value of self-rule. Weigh them. If we sell, let us do it knowing what we are gaining, and what we are closing down. If we stay, let us do it knowing the risks, committed to making this model work not out of nostalgia, but because it makes us better citizens.

  Whatever you decide, let it be a decision made by free people, not by pressure. That, ultimately, is the only principle that matters here. Thank you.
