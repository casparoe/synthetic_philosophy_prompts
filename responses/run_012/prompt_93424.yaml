prompt: |-
  I'm a novelist — three books, the last one about a farm family — and for the past two years I've been a volunteer EMT on our town's rescue squad, which is basically research with a pager, because the book I'm actually trying to write is about a squad like ours. Here's the problem I've backed into. We have no idea what to do about members who go beyond what the squad requires. Last winter one of our guys went into a house that was already fully involved to pull out a dog, and we gave him a plaque at the banquet. In March a different member, same fire, stood on the lawn and did chest compressions on the owner and didn't go in, and two of our officers have been quietly treating him like a coward ever since. Our chief keeps saying "we can't require that, but we sure can expect it," which even I can tell is doing something sneaky with the word expect. We get maybe a dozen calls a year where somebody's conduct is even in question, but a real one every couple months, and the verdict gets told to the member and goes in the file, so it isn't academic. I need a decision procedure we can run after an incident: what to ask in order, what counts as a sufficient answer to each question, where it stops with a verdict of required, forbidden, or optional-but-good, and where it has to stop and say this is a value judgment and a human being has to own it. It has to be usable by a chief who has never read any philosophy, in a kitchen, in about twenty minutes, while everyone is still rattled, and it has to survive our lawyer, who only cares whether we're creating a duty. Ground it in the philosophy of acts that go beyond the call of duty — the word for it is supererogation, I think, my daughter's philosophy TA said so — and I know there's at least one tradition that denies such acts exist at all, that every act is either required or not, so make the procedure say out loud where it's taking a side in that fight and why.

  It also has to handle the stuff that actually trips us up. The same act isn't the same for everybody — our medical director climbing a ladder to a patient is one thing, a seventeen-year-old probie doing it is another — so there needs to be a step for the person's role, training, and what they'd already agreed to when they signed up, and the procedure has to be able to say "supererogatory for her, required for him" without falling apart. There needs to be a step for the case where somebody did the brave thing for terrible reasons (the dog guy, honestly, wanted the plaque) and a step for the case where the brave thing was also stupid and put two other people at risk. And it has to tell me what to do about precedent, because the minute we commend something, everybody on the squad starts hearing it as the new standard, and I genuinely dont know if that's a flaw in the procedure or just how institutions work. Then run it on three cases and show your work: the dog guy; the guy who stayed outside; and a third one you invent where the procedure comes out against the person everyone in the room is rooting for — I want to see it tell us something we don't want to hear. Finish by telling me what this thing can't do, and specifically which of the verdicts are just me and the chief making a call with philosophy's name taped to them. Keep it in language a person could say out loud in a scene, because I'm stealing it for the book, and don't give me a reading list, I won't read it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Novelist (3 books, farm family theme), Volunteer EMT (2 years), writing a book about a rescue squad.
      *   **Problem:** How to evaluate volunteer conduct that goes "beyond the call of duty" (supererogation). Specific conflict: One member went into a burning house for a dog (commended); another stayed outside to do CPR on the owner (treated like a coward). Chief says "can't require, but can expect."
      *   **Goal:** A decision procedure (algorithm/checklist) for post-incident review.
      *   **Constraints:**
          *   Usable by a non-philosopher chief.
          *   Setting: Kitchen, 20 minutes, rattled team.
          *   Legal safety: Must not create a legal "duty" (liability).
          *   Philosophical grounding: Supererogation (acts beyond duty). Acknowledge the tradition that denies supererogation exists.
          *   Nuance: Must account for individual roles/training (probie vs. medical director).
          *   Nuance: Must account for motive (brave for bad reasons) and risk (brave but stupid/dangerous to others).
          *   Nuance: Must handle precedent (commendation becoming expectation).
          *   Output: Run the procedure on three cases (Dog Guy, CPR Guy, Invented Case where procedure says "no" to popular opinion).
          *   Ending: Limitations (what it can't do, where it's just human judgment).
          *   Tone: Speakable, realistic dialogue/narrative voice (for the book), no reading lists.

  2.  **Deconstruct the Philosophy & Legalities:**
      *   *Supererogation:* Acts that are good to do but not wrong to omit. (Heroism vs. Duty).
      *   *The "Denial" Tradition:* Utilitarianism (maximize good = duty) or strict Deontology (follow rule = duty). If you *can* save a life without equal risk, some say you *must*. The procedure needs to explicitly state where it draws the line.
      *   *Legal Liability:* If the squad *expects* heroism, it becomes a *duty*. If it's a duty, failure is negligence. The procedure must protect the volunteer from being sued for *not* being a hero, while allowing the squad to praise those who *are*.
      *   *The "Chief's Trap":* "We can't require it, but we sure can expect it." This is toxic. It creates implicit duty without explicit protection. The procedure must kill this phrase.

  3.  **Drafting the Procedure (The "Kitchen Table Algorithm"):**
      *   Needs to be step-by-step.
      *   Needs to be conversational but rigorous.
      *   *Step 1: Safety & Protocol.* Did they break rules? (Forbidden vs. Optional).
      *   *Step 2: Role & Capacity.* What is their training level? (Probie vs. Director).
      *   *Step 3: Risk Assessment.* Did they endanger others? (Self-sacrifice vs. Recklessness).
      *   *Step 4: The Supererogation Check.* Was this optional? (The "Could they have walked away?" test).
      *   *Step 5: Motive vs. Outcome.* Does intent matter? (Plaque hunter vs. Reluctant hero).
      *   *Step 6: Precedent Warning.* Explicitly state this does not set a new rule.

  4.  **Developing the Three Cases:**
      *   *Case 1: Dog Guy.* Went into fully involved fire. High risk. Violated safety protocol (usually "no entry for animals"). Verdict: Forbidden/Reckless, but maybe praised for heart? No, legally dangerous. Needs to be nuanced. Actually, if protocol says "no entry for animals," he violated duty. If protocol is silent, it's supererogatory but risky. Let's make it "Against Protocol" to show the procedure biting back.
      *   *Case 2: CPR Guy.* Stayed outside. Owner inside. Protocol says "Scene Safe." Verdict: Required/Correct. He followed duty. The officers treating him like a coward are wrong.
      *   *Case 3: The Invented Case.* Needs to be someone everyone loves, but the procedure says "No." Maybe a senior member who bypasses safety to save a minor injury, setting a bad example. Or a probie who does something amazing but unsafe. Let's go with a Senior Member who ignores a "stop work" order to save a property item. Everyone loves him, but he undermined command.

  5.  **Refining the Tone:**
      *   The user is a novelist. They want *voice*. This shouldn't read like a corporate HR manual. It should read like a script or a handout that feels real.
      *   It needs to acknowledge the "philosophy" part without being academic.
      *   It needs to address the "Denial of Supererogation" explicitly in the text.

  6.  **Addressing Specific Constraints:**
      *   *Legal:* Emphasize "Voluntary" and "No Duty Created."
      *   *Philosophy:* Acknowledge the "All acts are duty" view (Utilitarianism) and reject it for the sake of volunteer retention and mental health.
      *   *Precedent:* Include a "Cooling Off" clause or explicit statement that praise $\neq$ policy.

  7.  **Drafting the Content (Iterative Process):**
      *   *Intro:* Set the scene. Acknowledge the Chief's trap.
      *   *The Tool:* Call it "The Line Protocol."
      *   *Steps:*
          1.  The Rule Check (Did you break SOP?)
          2.  The Capacity Check (Could *you* specifically do this?)
          3.  The Risk Check (Did you hurt the team?)
          4.  The Choice Check (Did you have to?)
          5.  The Precedent Warning.
      *   *The Cases:* Run them through.
      *   *The Limitations:* Be honest. This doesn't fix culture.

  8.  **Self-Correction/Polishing:**
      *   *Critique:* Is the Dog Guy verdict clear? If he broke SOP, he shouldn't get a plaque. He should get counseling. That's a strong dramatic conflict for the book.
      *   *Critique:* The CPR Guy needs vindication.
      *   *Critique:* The Invented Case needs to hurt. Let's make it a beloved mentor who risks a probie's life to save a salvageable item.
      *   *Philosophy Check:* Ensure the "Denial of Supererogation" is mentioned. (e.g., "Some say if you can save a life, you must. We say no.")
      *   *Legal Check:* Ensure the language distinguishes between "expectation" and "requirement."
      *   *Voice:* Keep it gritty. "Kitchen table," "coffee stains," "rattled."

  9.  **Final Review against Prompt:**
