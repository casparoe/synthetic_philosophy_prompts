      *   Limitations/Where it's just human call? Yes.
      *   No reading list? Yes.
      *   Speakable language? Yes.

  10. **Final Polish:** (Writing the response in the voice of a consultant or a senior member explaining the tool to the Chief/Author). *Wait, the prompt asks me to provide the procedure so the author can steal it.* I should write it as the document itself, or a guide on how to use it. The prompt says "Keep it in language a person could say out loud in a scene." I will frame it as a script/guide that the Chief or a Senior Officer reads/uses. Actually, better: I will write the *procedure* as a handout, but annotated with the "voice" of someone explaining it. No, the prompt says "I'm stealing it for the book." I should give them the text *and* the commentary on how to use it. Let's provide the "Tool" as a distinct object, then the analysis.

      *Decision:* I will write the response as if I am handing the novelist the "script" for the procedure, annotated with the philosophical/legal reasoning they need to understand to write the scene authentically. I will structure it as "The Protocol" followed by "The Run-Through."

      *Wait, one more check:* "Finish by telling me what this thing can't do, and specifically which of the verdicts are just me and the chief making a call with philosophy's name taped to them." I need to be very clear on the limits.

      *Let's refine the "Denial of Supererogation" part.* The prompt asks the procedure to "say out loud where it's taking a side in that fight." I need a specific step or preamble that addresses this.

