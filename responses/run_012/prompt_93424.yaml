answer: |-
  Here is the procedure. It is written to be read out loud, printed on a single sheet of laminated cardstock, and kept in the duty binder next to the coffee pot. It is designed to take twenty minutes, defuse the emotion, and protect the squad from itself.

  ***

  # THE LINE PROTOCOL
  **Post-Incident Conduct Review**

  **Purpose:** To decide if a member's action was **Required**, **Forbidden**, or **Optional (Heroic)**.
  **Constraint:** This review creates *no legal duty*. It is for internal culture only.
  **Philosophical Stance:** This squad rejects the idea that "if you can save a life, you must." We believe some acts are good to do, but not wrong to skip. We call this the **Supererogation Clause**. If you skip a supererogatory act, you are not a coward. You are a volunteer.

  ---

  ### STEP 1: THE RULE CHECK (Forbidden vs. Allowed)
  **Ask:** Did this action violate a written Standard Operating Procedure (SOP) or a direct order from Command?
  *   **YES:** The act is **Forbidden**. Motive does not matter. Risk does not matter. You broke the rule.
      *   *Verdict:* Disciplinary review. No commendation.
  *   **NO:** Proceed to Step 2.

  ### STEP 2: THE CAPACITY CHECK (Required vs. Optional)
  **Ask:** Given this member's specific training, role, and physical capability, was this action within their scope of duty?
  *   **Note:** A Medical Director climbing a ladder is different than a Probie climbing a ladder. A paramedic starting an IV is different than a driver starting an IV.
  *   **If the action matches their Job Description:** It is **Required**. Failure to act is negligence.
  *   **If the action exceeds their Job Description:** It is **Optional**. Proceed to Step 3.

  ### STEP 3: THE RISK CHECK (Heroic vs. Reckless)
  **Ask:** Did this action create an unreasonable risk to other squad members or the public to achieve the result?
  *   **YES:** The act is **Reckless**. Even if successful, it endangers the team.
      *   *Verdict:* Counseling. No commendation.
  *   **NO:** The risk was contained to the actor. Proceed to Step 4.

  ### STEP 4: THE CHOICE CHECK (The Supererogation Test)
  **Ask:** Could the member have walked away or stayed in a safe zone without violating SOPs or abandoning a patient *within their care*?
  *   **NO:** They had no choice. The act was **Required**. (Do not praise them for doing their job).
  *   **YES:** They chose to enter danger or expend effort they did not owe us. The act is **Supererogatory (Optional-but-Good)**.
      *   *Verdict:* Commendation allowed.
      *   **WARNING:** See Step 5.

  ### STEP 5: THE PRECEDENT WARNING
  **Ask:** If we praise this, will next week's probie think they *must* do this to be accepted?
  *   **Action:** If commending, the Chief must state aloud: *"This was a gift you gave us. It is not a debt we owe you. Do not expect this of others."*
  *   **Reasoning:** We acknowledge that praising heroism can accidentally turn it into duty. We break that link verbally.

  ### STEP 6: THE MOTIVE WAIVER
  **Ask:** Does it matter *why* they did it?
  *   **Ruling:** No. Whether they did it for glory, for love, or because they froze and then moved, the *act* is judged, not the heart. We are not confessors; we are officers.
  *   **Exception:** If the motive was malicious (e.g., to harm the patient), revert to Step 1 (Forbidden).

  ---

  ## RUNNING THE CASES
  *Here is how you use the tool on the three situations you described. This is the "show your work" for the scene.*

  ### CASE 1: THE DOG GUY (Winter Fire)
  **The Act:** Entered a fully involved structure to retrieve an animal.
  **Step 1 (Rule Check):** **FAIL.** Most SOPs state "No entry for animals" in fully involved fires. Life safety is human-only.
  *   *Immediate Stop.*
  *   **Verdict:** **Forbidden.**
  *   **The Hard Truth:** He gets no plaque. He gets a counseling session.
  *   **Why:** If he had died, the town gets sued. If he lived, he taught the probies that SOPs are suggestions. The Chief's "expectation" killed the protocol.
  *   **Philosophy Note:** This isn't about heroism; it's about order. A hero who breaks the chain of command is a liability.

  ### CASE 2: THE CPR GUY (March Fire)
  **The Act:** Performed compressions on the lawn; did not enter the burning house for the owner.
  **Step 1 (Rule Check):** **PASS.** SOP: "Scene Must Be Safe." House was fully involved. Entry forbidden.
  **Step 2 (Capacity Check):** **PASS.** He treated the patient he could reach.
  **Step 3 (Risk Check):** **PASS.** He did not endanger others.
  **Step 4 (Choice Check):** **REQUIRED.** He did his job. He did not omit a duty he owed.
  *   **Verdict:** **Required Conduct.**
  *   **The Hard Truth:** The officers treating him like a coward are wrong. They are violating the Supererogation Clause. They are demanding a death for a badge.
  *   **Action:** Chief must publicly state: *"He followed the book. That is all we require. Anyone who calls him a coward is answering to me."*

  ### CASE 3: THE INVENTED CASE (The Beloved Mentor)
  **The Act:** A senior EMT (15 years) ignores a "Stop Work" order from Command to pull a family photo album from a smoking kitchen. He gets out safely. The squad loves him. "That's just who he is."
  **Step 1 (Rule Check):** **FAIL.** Command said "Stop Work."
  **Step 2 (Capacity Check):** **PASS.** He is trained.
  **Step 3 (Risk Check):** **FAIL.** By ignoring Command, he broke the accountability loop. If he went down, two others would have gone in to get him.
  **Step 4 (Choice Check):** **N/A** (Failed Step 1 & 3).
  *   **Verdict:** **Forbidden / Reckless.**
  *   **The Hard Truth:** The squad wants to cheer. The Procedure says he is a liability.
  *   **Why:** He prioritized property over team safety and undermined the Incident Commander.
  *   **Action:** He is suspended for one call cycle. The Chief has to say: *"We love you, but you broke the line. If you go in, you take us with you. You didn't have the right to spend our lives."*
  *   **Philosophy Note:** This is where the procedure hurts. It protects the institution over the individual hero. It denies the "Great Man" theory of rescue.

  ---

  ## WHAT THIS THING CAN'T DO
  *This is the part you put in the narrative voice, the internal monologue of the Chief or the narrator.*

  1.  **It Can't Fix Shame:** The CPR Guy will still feel like he didn't do enough. The Procedure can vindicate him logically, but it can't touch the gut-punch of watching a house burn with someone inside. That's on him, not the squad.
  2.  **It Can't Stop the Whisper Network:** You can say "This is not a precedent" all you want. The probies will still hear "Dog Guy got a plaque" and think "I need to find a dog." The verbal warning in Step 5 is a shield, but it's made of paper.
  3.  **It Can't Judge the Soul:** Step 6 says motive doesn't matter. That's a lie we tell to keep it simple. If Dog Guy did it for the plaque, he's selfish. If he did it because he saw a kid's toy and panicked, he's human. The Procedure treats them the same. That's efficient, but it's cold.
  4.  **The "Human Call" Verdict:**
      *   **Where the Philosophy Ends:** Step 3 (Risk) and Step 5 (Precedent) are not math. They are guesses.
      *   **The Chief's Burden:** When the Chief decides if a risk was "unreasonable," that is not philosophy. That is him looking at the widow of a firefighter who died three towns over and guessing if he's willing to be that widow's husband next year.
      *   **The "Supererogation" Lie:** We say we reject the idea that "if you can save a life, you must." But in the kitchen, at 3 AM, we all believe it. The Procedure is a lie we tell ourselves so we can sleep. It draws a line in the sand, but the tide comes in every night.

  **Final Note for the Scene:**
  When you write the meeting, don't have them agree. Have the Chief read Step 5 ("This was a gift, not a debt") and have the Dog Guy look at his hands and know everyone in the room knows it's a lie. The Procedure works because it gives them a script to argue with, not because it solves the problem. The problem is that they love each other enough to die, and that's the one thing they aren't supposed to do.
