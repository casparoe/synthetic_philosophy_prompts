answer: |-
  Colleagues, we meet next week to settle the status of the clause that keeps an adversary's cities at risk as a retaliatory option, and I am writing this to clarify the ethical stakes before we vote. This provision has been in the directive since the early nineteen-eighties, and while our retired planner assures us it has never been the basis of an operational plan, its presence in our standing orders carries a moral weight that mere disuse cannot dissolve. The motion before us is to strike the clause, and the core of the argument is that threatening to kill the innocent as a means to security is morally indistinguishable from the act itself. I know there are strong objections to this view, specifically regarding conditional intention and the consequentialist claim that this ambiguity has preserved the peace. I want to address both squarely because our decision must rest on reasons we can all engage with, not on doctrine or hope.

  The first objection holds that a threat is not a killing, and that an intention conditional on an event we are committed to preventing is not an intention in the morally loaded sense. The argument is that because we work to ensure the condition is never met, we do not truly intend the retaliation. However, this conflates hope with commitment. To hold a policy of retaliation is to form a present commitment to a future act; we have already decided that if the trigger is pulled, we will kill the innocent. The conditionality does not absolve the intention because the moral burden lies in the willingness to perform the act, not merely in the likelihood of the occasion. We cannot claim to oppose the killing of civilians while simultaneously maintaining a settled resolve to do exactly that should circumstances change. The intention exists now, in the signing of the directive, regardless of whether the trigger is ever pulled.

  The second objection is consequentialist, arguing that this option has kept the peace for forty years and that narrowing our declaratory policy invites the war it is meant to avert. This is the heavier burden, but it relies on a claim we cannot verify. Nothing in our deliberation should depend on knowing what a future adversary would have done otherwise, because we cannot know it. We are being asked to justify a moral compromise based on an empirical certainty that is unavailable to us. Furthermore, even if we grant that the ambiguity has contributed to stability, we must ask whether a peace maintained by a logical contradiction is sustainable. If the clause relies on the principle of double effect to separate intended from merely foreseen harm, it must be doing real work. In this case, it is not. The principle of double effect permits foreseen harm only when it is a side effect of a legitimate act. Here, the civilians' deaths are not a side effect of the threat; they are the threat. The destruction of the city is the instrument of coercion. To use a clause designed to forbid intentional killing to license a threat that relies on intentional killing is to turn the principle into a fig leaf. It asks the directive to forbid the very thing it is being used to permit.

  If we keep the clause as it stands, we are endorsing a formulation that claims we do not intend civilian death while structuring our policy around the certainty of it. This corrodes the integrity of the directive and the institution that issues it. We cannot build ethical policy on a contradiction, nor can we outsource our moral reasoning to uncertain calculations of deterrence. Therefore, I recommend that we strike the clause in its current form. This does not leave us without a defense, but it requires us to build one that does not treat civilian destruction as the lever of coercion. My instruction to the board is to vote to remove the clause from the standing directive and to task the planning staff with drafting alternatives that achieve security objectives without relying on the intentional targeting of civilian populations. We owe it to the personnel who must interpret these orders, and to the public whose name we bear, to ensure that our rules of engagement are coherent enough to survive the light of day.
