  The mapping
  Population: Fall 1973 Berkeley graduate applicants. Treatment: Applicant gender (Male vs. Female). Outcome: Admission decision (Admitted/Rejected). Conditioning Variable: Department applied to. The causal question is counterfactual: Would this specific applicant have been admitted had she been a man? In causal diagrams, Gender affects Admission directly (committee discrimination) and indirectly via Department (applicant choice). The aggregate rate captures the Total Effect (direct + indirect paths). The department-stratified rate captures the Direct Effect, blocking the indirect path by holding Department constant. The paradox emerges because these questions yield opposite signs. Men clustered in high-admit departments; women in low-admit ones. To identify bias, we must decide whether to hold Department constant. If we hold it constant, we ask if the committee is prejudiced. If we don't, we ask if the system produces unequal results. The reversal is a conflict between these two distinct causal estimands, not a mathematical error. We are trying to isolate the causal effect of gender on admission, but gender influences department choice, which influences admission. The mapping requires acknowledging that Department is not an independent baseline characteristic but a variable potentially influenced by the treatment itself. Thus, the setup involves a mediation structure where the 'control' variable is downstream of the 'treatment'.

  What the reversal shows
  The reversal shows that the aggregate disparity (44% vs. 35%) is not necessarily evidence of departmental prejudice. It reveals a structural sorting effect: women applied disproportionately to departments with low admission rates for everyone. Your friend claims this makes the aggregate gap a "magic trick." This is wrong. The aggregate gap is real—it describes the actual experience of applicants—but it misidentifies the mechanism. It shows systemic inequality in preparation or steering, not necessarily bias in the admission committee's decision rule. However, dismissing the aggregate as purely artifactual ignores that the total effect is what matters for overall equity. If the system channels women into dead ends, the outcome is discriminatory even if each gatekeeper is neutral. The reversal proves that "bias" is ambiguous: it can mean prejudiced decision-making (direct effect) or unequal outcomes (total effect). Simpson's paradox doesn't erase the disparity; it relocates the source from the evaluator to the pipeline. Your friend's error is assuming that because the direct effect is null, the total effect is meaningless. In policy, the total effect often matters more than the direct mechanism. The numbers aren't lying; they are answering different questions about where the inequality originates. Consequently, citing the aggregate gap isn't naive if the goal is measuring overall disadvantage. It is only naive if the goal is prosecuting specific departments. The paradox demonstrates that aggregation bias is distinct from selection bias. The aggregate data correctly reports the risk faced by a random female applicant versus a random male applicant. The stratified data correctly reports the risk faced by an applicant within a specific major. Both are true. The conflict arises only if one assumes there is a single "truth" about discrimination rather than distinct layers of causal influence. Therefore, the argument that aggregate disparities are always suspect relies on a definition of bias that excludes structural factors. If discrimination includes the cumulative effect of societal steering, the aggregate number is the most honest metric. The paradox forces us to choose which causal path we care about. Ignoring the aggregate hides the total burden placed on the group. Ignoring the stratification hides the specific actors responsible. Your friend's conclusion that citing gaps is "lying" conflates mechanism with outcome. The reversal validates the need for both perspectives, not the dismissal of one.

  Choosing vs. being assigned
  In the kidney stone case, stone size is a confounder: it exists before treatment and affects both the doctor's choice and the success rate. Conditioning on it is correct to isolate the treatment's efficacy. In Berkeley, Department is a mediator: Gender influences Department choice. Conditioning on a mediator blocks the path through which gender exerts influence. If women avoid certain departments because they anticipate bias, conditioning on Department hides that bias. This breaks the Sure-Thing Principle application. The principle states if Option A is better than B in every subpopulation, it should be preferred overall. This holds only if subpopulations are fixed pre-treatment. Here, "Gender" changes the distribution of "Department." You cannot compare men and women within departments as if department assignment were independent of gender. Berkeley isn't a counterexample to decision theory; it's a warning against conditioning on post-treatment variables when estimating total effects. If the treatment (gender) affects the stratum (department), the weighted average of stratum-specific effects does not equal the overall effect. Your friend's invocation of decision theory fails because the subpopulations aren't stable across the treatment conditions. The correct comparison requires acknowledging that department choice is part of the causal pathway, not a baseline confounder like stone size. Therefore, the adjusted comparison (stratified) estimates the direct effect of gender on admission decisions, while the unadjusted comparison estimates the total effect including the impact of gender on department selection. Neither is inherently "correct" without specifying the intervention. If we could magically change gender without changing department preference, the stratified rate applies. If we change gender as it naturally occurs in society, including all socialization effects, the aggregate rate applies. The paradox dissolves when we recognize the Sure-Thing Principle requires ceteris paribus conditions that don't hold when the conditioning variable is endogenous.

  Where the lens breaks
  The statistical lens breaks when asking why women chose competitive departments. Data shows women applied to harder departments, but statistics cannot explain if this was due to socialization, lack of advising, or prior discrimination in undergraduate training. The standard resolution ("no bias found") satisfied nobody because it exonerated the university while ignoring the systemic barriers preceding the application. It treated the application moment as the start of the causal chain, ignoring history. Is this residue a statistical question? No. It is sociological and historical. Statistics can measure the flow within the system but cannot measure the forces shaping the input without external data. The paradox resolves the mathematical inconsistency, but it cannot resolve the moral ambiguity of whether "steering" counts as discrimination. Furthermore, the data cannot detect if women were discouraged from applying to easy departments because they knew those departments were hostile. The model assumes department choice is free, but if choice is constrained by prior bias, the "direct effect" estimate is still contaminated. Thus, the statistical resolution provides a clean answer to a narrow question, leaving the broader accusation of institutional bias neither proven nor disproven. This limitation explains why the resolution felt like a dodge. It solved the arithmetic puzzle but sidestepped the equity complaint. The residue is not a failure of math, but a failure of scope. We expect data to adjudicate moral claims, but data only describes relationships within defined boundaries. When the boundaries exclude the root causes of inequality, the statistical answer feels technically correct but substantively empty. Ultimately, the data cannot distinguish between free choice and constrained optimization. Without qualitative context, the statistical model remains blind to the pressure shaping the applicants' decisions.

  Bottom line
  This is not a logical paradox but a category error. It arises from conflating two causal questions: "Is the decision process biased?" (Direct Effect) versus "Is the outcome unequal?" (Total Effect). Your friend is wrong to dismiss aggregates; they measure the total impact of gender on success. But he is right that aggregates don't prove malicious intent. The paradox is a symptom of asking a single question about "bias" when there are actually two distinct phenomena at play. There is no unique answer because "bias" was never uniquely defined.
