answer: |-
  **Speech for Charity Week Assembly**

  Good morning. Head Teacher, staff, parents, and fellow students.

  Look up at the plaque behind me. It reads: *'A Single Life is Priceless.'* Yesterday, we watched a film about a specific child, given a name and a face, whose life was saved by this charity. And yet, the money we raise this week will not go to that specific child. It will go towards a fund that buys antimalarial bed nets. It is a transaction based on statistics. It is calculated by cost-per-life saved.

  This creates a tension. On one hand, we are told every individual is infinite in value. On the other, we are asked to act like accountants, weighing costs against quantities. This brings us to a question philosophers have argued for decades: should the numbers count? If I could save one person, or save five with the same effort, do the five give me more reason to act?

  It is tempting to say that numbers are cold. That focusing on statistics dehumanises the suffering. We feel a pull towards the named child in the film; we feel less for the anonymous thousands. But for the purpose of this week, I want to take a definite position. The numbers *must* count.

  If we truly believe that a single life is priceless, then we cannot afford to ignore the maths. If one life is of infinite value, then five lives are of five times that infinite value. To ignore the numbers is not to be more moral; it is to be less effective. If we choose to save the one identifiable child over the five anonymous ones because the one *feels* more real to us, we are not prioritising humanity. We are prioritising our own emotional comfort.

  Now, I know this sounds severe. In a room full of parents and students, it is natural to recoil at the idea of reducing human life to a calculation. **[Note: I have softened the argument here. A strictly utilitarian view might argue the one person has no special claim at all. I have conceded that the emotional pull is 'natural' to avoid alienating the audience who just watched the film.]** We are not machines. But charity is not about how we feel; it is about what happens to the people on the other side of the donation.

  The bed net strategy works because it respects the numbers. It admits that we cannot save everyone, so we have a duty to save as many as we can. To treat the 'priceless' plaque as a reason to ignore cost-effectiveness would actually be an insult to the value of life. It would mean allowing preventable deaths simply because saving them requires looking at a spreadsheet rather than a photograph.

  So, when you donate this week, do not do it because you imagine a specific child waiting for your specific pound. Do it because you accept that the anonymous many matter just as much as the named few. Do it because you believe that if you can save five, you have no moral right to save only one.

  The plaque is right. A life is priceless. But that is exactly why we must count them.

  Thank you.

  ***

  ### Author's Note on Argumentation and Softening

  Per your request to flag where the argument was softened for a mixed audience:

  1.  **The Emotional Concession:** In the third paragraph, I wrote: *"It is natural to recoil... We are not machines."*
      *   **The Hard Line:** A strict utilitarian or Effective Altruist argument would posit that the emotional pull of the "identifiable victim" is a cognitive bias that should be actively suppressed, not accommodated as "natural."
      *   **The Softening:** I acknowledged the audience's likely emotional reaction as valid ("natural") to prevent the speech from sounding sociopathic to parents and younger students, while still maintaining that the *action* must remain rational.
  2.  **The Definition of "Priceless":** I argued that "priceless" implies we must maximise the count (5 > 1).
      *   **The Hard Line:** Philosophically, "priceless" often implies incommensurability—that you *cannot* compare lives numerically.
      *   **The Softening:** I bypassed the deep metaphysical debate on incommensurability to present a pragmatic interpretation: if value is infinite, quantity still scales the total good. This avoids getting bogged down in semantic philosophy that might lose a school assembly, while still committing to the "numbers count" position.
