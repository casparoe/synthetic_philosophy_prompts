  **2. Contingent Identity**
  Verdict: Logically impossible.
  Argument: Frege holds identity is a relation between objects, not concepts. If the statue and the lump are the same object, they are necessarily identical. If they have different modal properties, they are different objects. The intuition of contingency arises from conflating the object with the concept under which it is subsumed. We conceive the lump under "material" and the statue under "form." These are different senses. But the reference is either one or two. Frege's logic admits no vague identity. He would reject the case as a failure to specify the criterion of identity for the object in question. Strict identity allows no slippage. The difference lies in the senses employed, not the objects referred to.

  **3. Contingent A Priori**
  Verdict: Confuses linguistic stipulation with knowledge of thoughts.
  Argument: In the metre-stick case, fixing the reference of "one metre" via stick S is a linguistic stipulation, not the expression of a thought known a priori. If "one metre" means "the length of S," the sentence is analytic but trivial. If it picks out a length independently, it is synthetic. Frege would argue that reference-fixing does not generate truth-apt thoughts until the sense is fully determined. Knowing the stipulation is not knowing a truth about the world. The "a priori" element is merely knowing one's own definition. This is psychological certainty, not logical truth. He would deny this constitutes a proposition known contingently yet a priori. It is merely a rule of language use, not a thought with truth conditions.

  **4. Hidden-Indexical/Contextualist Belief**
  Verdict: Rejected as a form of psychologism.
  Argument: Belief reports relate subjects to objective Thoughts. Contextualism suggests the content of the report shifts with conversational context. For Frege, the Thought grasped by Pierre is fixed by his linguistic competence and cognitive state, not the reporter's convenience. Pierre grasps two Thoughts with different senses. The contradiction is in Pierre, not the logic. Hidden-indexical accounts try to save consistency by shifting content, but this undermines the objectivity of the Thought attributed. Frege prefers to say the belief report is imprecise rather than admit semantic content varies by context. Logic requires stable contents. Shifting content based on pragmatics violates the objectivity of the third realm.

  **5. Pretence and Empty Names**
  Verdict: Fiction lacks truth-values in serious discourse.
  Argument: Sentences containing empty names lack a Reference (Bedeutung), and thus lack a truth-value. Pretence accounts attempt to assign truth conditions to fiction by simulating reference. Frege would say this is legitimate within the game of fiction but logically void. In serious discourse, empty names are defects. We pretend there is reference to engage with the Sense. He would reject attempts to make fictional statements truth-apt in logic. The logic of science requires guaranteed reference. Fiction operates on a different plane where we explore Thoughts without asserting their Truth. We must distinguish the act of pretending from the logical status of the sentence.

  - Where he'd surprise me: about 250 words on the verdicts that cut against the received picture of Frege.
  The received view paints Frege as a descriptivist who must reject Kripke's necessity of identity. My reconstruction suggests he might accept the necessity of identity more readily than modern Fregeans. Since identity is a logical relation between references, and references are rigid (objects don't change), he'd agree "Hesperus is Phosphorus" is necessary. The surprise is that he'd accept Kripke's modal intuition but reject the epistemic label. He wouldn't fight over rigidity; he'd fight over the definition of "thought."
  Secondly, on empty names, standard Fregeans often try to salvage truth-values for fiction. Frege himself was stricter: no reference, no truth-value. He'd surprise those who think Fregeanism requires saving the phenomena of fictional truth. He'd happily sacrifice truth-values to save logical purity.
  Finally, on belief reports, he might be more tolerant of indirect reference than contextualists assume. He doesn't need context to shift content; he needs a shift in customary sense. The surprise is that his solution is more metaphysical (shifting ontology of sense) than pragmatic (shifting context). He'd reject the idea that semantics needs pragmatic rescue. He might also surprise us on the contingent a priori. Contemporary Fregeans often try to accommodate it. Frege might simply deny the coherence of the "a priori" as an epistemic category distinct from logical derivation. He might view the metre case not as a philosophical puzzle but as a failure to distinguish between defining a sign and asserting a judgment. This rigidness is surprising to those who see Frege as a flexible descriptivist. He is actually a logical hardliner.

  - Badly put: about 250 words on which of these questions he'd refuse as posed, and what he'd replace them with.
  Frege would refuse the questions regarding "contingent identity" and "contingent a priori" as fundamentally confused. They presuppose a modal metaphysics he never endorsed and an epistemic categorization he might reject. "Contingent identity" assumes identity can hold loosely; Frege would replace this with "Identity under different concepts." The question isn't whether objects are contingently identical, but whether our concepts pick out the same object across conditions.
  Similarly, "contingent a priori" mixes modal and epistemic operators in a way that violates his strict separation of logic and psychology. He would replace this with: "Is this judgment analytic or synthetic?" and "Is the reference fixed by stipulation or description?"
  On belief reports, he'd reject the contextualist framing. The question isn't "How does context fix content?" but "What Thought is objectively expressed?" He'd replace the puzzle with an analysis of indirect sense. The Pierre case isn't about context; it's about the failure to recognize sense identity. He'd demand we stop asking about speaker intention and start analyzing the logical structure of the Thoughts attributed. The questions are badly put because they prioritize epistemic access over ontological structure. On fiction, the question "Are fictional sentences true?" is badly put. He'd replace it with "Do fictional sentences have Bedeutung?" The answer is no. The pretence account tries to answer the wrong question. He'd insist we distinguish the act of pretending from the logical status of the sentence. The literature asks how fiction works; Frege asks what logic permits.

  - How much of this is a guess: about 150 words, item by item, ranking your confidence.
  1. Necessary A Posteriori: High confidence. His logic demands necessary identity; his epistemology explains the discovery.
  2. Contingent Identity: High confidence. He is strict on identity criteria.
  3. Contingent A Priori: Medium confidence. He wrote less on stipulation versus knowledge.
  4. Belief Reports: Medium confidence. Indirect reference is complex in his later work.
  5. Empty Names: High confidence. He explicitly discusses fiction and gaps.
  Overall, the modal claims are extrapolations from his logic, not his explicit texts. The semantic claims are grounded in "On Sense and Reference." The modal extrapolations are the riskiest. Frege didn't talk about possible worlds. I am assuming his logic translates to modal logic smoothly. That is a guess. The semantic hardline is safer. We know he valued logical purity over linguistic convenience. The guess lies in how he would engage with Kripke's specific terminology versus the underlying philosophical problems.
