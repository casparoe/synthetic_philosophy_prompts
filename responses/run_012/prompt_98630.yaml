answer: |-
  You have identified precisely why this slogan has survived for over two millennia: it is a chameleon. It shifts colour depending on whether the speaker wishes to make a point about psychology, welfare, or morality. Your suspicion is well-founded; the rhetorical power of the phrase relies entirely on the "slide" you noticed between *is* (capacity), *ought* (benefit), and *deserves* (justice).

  Below is a menu of the three distinct theses the slogan typically conceals. I have categorised them by the type of claim being made, their defensibility, and their relationship to the workplace argument you encountered. Following the menu, I have addressed your questions regarding nature versus convention and the empirical status of the claim.

  ### 1. The Psychological Incapacity Thesis
  **The Claim:** Some individuals literally lack the cognitive or rational faculty required to deliberate on long-term goals or govern their own conduct. They *cannot* plan, regardless of whether they are allowed to.
  *   **Type of Claim:** Empirical / Descriptive.
  *   **Defensibility:** **Contentious to False.** In the ancient world, this might have been plausible regarding education levels or cognitive development. In the modern context, asserting that a class of adults possesses *no* capacity for rational autonomy is empirically unsustainable. While cognitive variance exists, a binary division between "rulers" and "non-rulers" is not supported by psychology or neuroscience.
  *   **The Role of 'Nature':** Here, 'nature' functions as a biological or psychological constant. It implies a hard-wired limitation, akin to a disability.
  *   **Support for the Workplace Argument:** **No, not on its own.** Even if an employee lacks the capacity for high-level strategy, this does not automatically justify a "rigid" workplace in the moral sense the man intended. It might justify *support* or *training*. To reach his conclusion ("nothing unjust"), he would need to add the premise: *Those who lack full rational capacity forfeit the right to participate in decision-making regarding their labour.*

  ### 2. The Prudential Subordination Thesis
  **The Claim:** Some people *could* govern themselves, but they would be happier, safer, or more productive if they did not. Their well-being is maximised when they are directed by others.
  *   **Type of Claim:** Normative / Prudential (about what is good for someone).
  *   **Defensibility:** **Contentious.** This is a paternalistic claim. It is defensible in specific, temporary contexts (e.g., a trainee under a mentor, a patient under a surgeon), but highly contentious as a permanent state for adults. It assumes the ruler knows the subordinate's good better than the subordinate does.
  *   **The Role of 'Nature':** Here, 'nature' refers to temperament or disposition. It suggests a psychological fit, like a puzzle piece that sits more comfortably in one spot than another.
  *   **Support for the Workplace Argument:** **Partially.** This supports the idea that a rigid hierarchy might be *efficient* or even *beneficial* for the worker's stress levels. However, it does not support the claim that the arrangement is *just*. To reach his conclusion, the man would need to add the premise: *If a arrangement benefits the subordinate, it is unjust for them to demand a say in how it is run.* (Many would argue that benefit does not negate the right to consent).

  ### 3. The Natural Hierarchy Thesis
  **The Claim:** The universe has a moral order in which some people are destined to rule and others to be ruled. To be ruled is the proper function (or *telos*) of the subordinate, and interfering with this is a violation of the natural order.
  *   **Type of Claim:** Metaphysical / Moral (about Justice).
  *   **Defensibility:** **False (in a secular framework) / Unfalsifiable.** This is an essentialist verdict. It relies on a cosmological view where "nature" has intentions. Without a shared theological or metaphysical framework, this is merely an assertion of power dressed up as cosmic law.
  *   **The Role of 'Nature':** Here, 'nature' is doing heavy metaphysical work. It is not describing biology, but prescribing purpose. It turns a status into an identity.
  *   **Support for the Workplace Argument:** **Yes, but at a high cost.** This is the only thesis that directly supports the man's conclusion that the rigid firm is "nothing unjust." It asserts that justice *is* hierarchy. However, it requires the acceptance of the metaphysical premise that social roles are morally ordained by nature, which is a difficult pill to swallow in a liberal democracy.

  ***

  ### Nature vs. Convention: The Crucial Distinction
  You asked about the difference between being a slave by nature and by law. This is the oldest objection to the slogan, raised by Aristotle's contemporaries.

  *   **Slavery by Law (Convention):** This is a status imposed by force, accident, or legislation. A free-born person captured in war is a slave by convention. This is contingent; it could be otherwise. If the war had gone differently, they would be free. Most modern critics argue all slavery is of this kind: it is a political status, not a personal quality.
  *   **Slavery by Nature:** This implies the status is intrinsic to the person. Even if you freed them, they would *still* be a slave in essence, because they lack the internal constitution for freedom.

  **The Trick:** The slogan attempts to convert *Convention* into *Nature*. In the workplace argument, the man is taking a contractual, legal relationship (employment, which is by convention) and trying to ground it in *Nature* to make it immune to critique. If the hierarchy is merely conventional, it can be changed. If it is natural, it is immutable.

  ### Empirical Hypothesis or Essentialist Verdict?
  This is the pivot point of your confusion.

  *   **If it is an Empirical Hypothesis:** It must be falsifiable. We would need to define "capacity for self-rule" operationally (e.g., passing a reasoning test, managing finances). We could then test a population. If we found "natural slaves," we should also be able to find "natural masters." If the "slaves" were educated and suddenly showed capacity, the hypothesis is falsified. Historically, whenever this test is applied, the "incapacity" vanishes with education and opportunity. Thus, as an empirical claim, it largely fails.
  *   **If it is an Essentialist Verdict:** Then "nature" is not a biological fact but a label. It functions as a "stopper" for argument. To say "he is a slave by nature" is to say "he is the sort of being for whom slavery is appropriate." This makes the claim unfalsifiable. If the slave rebels, the essentialist says, "That is just a glitch; he is still a slave by nature." If the slave performs well, the essentialist says, "He is a good slave."

  **What work is 'nature' doing?**
  In the empirical reading, 'nature' is a placeholder for *biology*. In the essentialist reading, 'nature' is a placeholder for *authority*. It is used to remove human agency from the equation. It tells the listener: "Do not blame the master, and do not pity the slave; this is simply how the world is built."

  ### Conclusion: The Workplace Argument Revisited
  Returning to the man who defended the rigid firm:

  He needed the **Natural Hierarchy Thesis (Thesis 3)** to conclude that the firm was "nothing unjust."
  *   If he only meant **Thesis 1 (Incapacity)**, he would have to prove his employees were mentally incapacitated, which is libellous and likely false.
  *   If he only meant **Thesis 2 (Benefit)**, he would have to prove they were happier, which is subjective and doesn't preclude them wanting more autonomy.

  By using the slogan "slaves by nature," he attempted to smuggle the moral conclusion (Thesis 3) inside a descriptive package (Thesis 1). He wanted you to accept the *justice* of the hierarchy without having to prove the *metaphysics*, by pretending it was a simple matter of *fact*.

  The slide you detected is indeed the whole trick. The phrase allows the speaker to move from "some people prefer direction" (a plausible empirical observation) to "some people deserve subordination" (a contentious moral claim) without ever announcing the transition. When you encounter it again, your task is simply to ask: "Are you saying they *cannot* choose, they *should not* choose, or that their choice *does not matter*?" The answer will reveal which thesis is actually doing the work.
