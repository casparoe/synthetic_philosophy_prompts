  2.  **Deconstruct the Reflection Principle:**
      *   *Formula:* $C_t(A | C_{t'}(A) = x) = x$. (Current credence in $A$, conditional on future credence in $A$ being $x$, should be $x$).
      *   *Defence:* Diachronic Dutch Book (van Fraassen).
      *   *Common Objections:* Forgetfulness, irrationality, self-locating belief changes, evidence loss.

  3.  **Drafting Section 1: Agreed Claims (The Common Ground):**
      *   Need to clarify the principle to avoid strawmanning.
      *   *Claim 1 (Definition):* It's a constraint on synchronic credence functions regarding anticipated future credences.
      *   *Claim 2 (Normative Status):* It's a norm of rationality, not a psychological law.
      *   *Claim 3 (Scope):* It doesn't dictate *how* the future credence is reached (process neutral).
      *   *Claim 4 (Prediction vs. Constraint):* It's not about accurately predicting the future, but about aligning current belief with anticipated belief *if* that anticipation is held.
      *   *Claim 5 (Dutch Book):* Both agree the DB argument exists, but maybe not on what it proves (save that for disagreements). Let's stick to what the argument *is*.
      *   *Claim 6 (Idealization):* It applies to ideal agents, but the debate is about how ideal.

  4.  **Drafting Section 2: Residual Disagreements (The Table):**
      *   Need to phrase these so both sides feel represented.
