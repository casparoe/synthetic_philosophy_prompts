      *   *Refining the "Psychological Fatalism" point:* Is it a cop-out? No, it's the tragic insight. But it's not *reductionist*. It's that character *is* destiny. The Oracle doesn't cause the action; it *sees* the action that character necessitates. But since the Oracle is divine, character is also divinely woven. So it's both. The "cop-out" would be saying "there are no gods, just psychology." The "deep reading" is "the gods work through psychology."
      *   *Refining the Decision Theory Analogy:* Oedipus treats the prophecy as *evidence* of a fixed future state (CDT-style: I can't change the fact, so I change the location). But the prophecy is actually *constitutive* of the future state via his agency (EDT-style: My action confirms the evidence). The play shows that treating divine knowledge as external data is the error. It is internal data about the self.

