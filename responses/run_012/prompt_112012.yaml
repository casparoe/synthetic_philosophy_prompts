answer: |-
  Okay, pull up a chair. You're describing a headache I've nursed for about thirty years, ever since I first tried to grade a paper on Parfit's *Reasons and Persons* without throwing it across the room. You have a keen eye for the structural flaw; most people get lost in the intuition pumps and miss the machinery underneath.

  You are asking for a label for a specific argumentative move. You want to know if it has a name, and if not, you want a coinage that carves the joints correctly—distinguishing it from the Sorites, from standard equivocation, and from the Problem of the Many.

  Here is the breakdown.

  ### 1. The Candidate Labels

  Let's run through the usual suspects in the metaphysics toolkit and see why they don't quite fit the specific shape of the problem you're describing.

  **Candidate A: Equivocation**
  *   **The Fit:** High. Technically, this *is* a form of equivocation. In metaphysics, "identity" isn't a primitive; it's defined by criteria (psychological continuity, biological life, spatiotemporal path, etc.). If you use Criterion A in premise 1 and Criterion B in premise 2, you are using the term "same person" in two different senses.
  *   **The Miss:** Standard equivocation is usually lexical (e.g., "bank" of a river vs. "bank" for money). Your observation is sharper: the *word* stays the same, and the *concept* (person) stays the same, but the *operational rule for counting* shifts. It's methodological equivocation rather than semantic equivocation. Calling it plain "equivocation" feels like using a sledgehammer to crack a nut; it doesn't capture the specific *sliding* nature of the move.

  **Candidate B: The Sorites Paradox**
  *   **The Fit:** High. This is the context. The "neuron by neuron" replacement is a classic Sorites series.
  *   **The Miss:** The Sorites describes the *structure of the vagueness* (small changes don't matter, but large ones do). It doesn't name the *argumentative foul* of switching rules to manage the vagueness. You can discuss the Sorites without committing this error (e.g., by embracing epistemicism or supervaluationism). The move you're spotting is a specific *response* to the Sorites that tries to have its cake and eat it too.

  **Candidate C: Sortal Shift**
  *   **The Fit:** Medium. A "sortal" is a concept that supplies a principle of individuation (e.g., "statue" vs. "clay").
  *   **The Miss:** A Sortal Shift usually implies changing the noun (from "person" to "organism" or "self" to "body"). You are describing a case where the noun stays "person," but the *principle of individuation* attached to that noun changes. It's a shift *within* the sortal, not *between* sortals.

  **Candidate D: Motte-and-Bailey**
  *   **The Fit:** Low-Medium. This is when someone advances a controversial claim (Bailey) and retreats to a defensible one (Motte) when challenged.
  *   **The Miss:** The Motte-and-Bailey is about *defensibility*. Your phenomenon is about *counting coherence*. The arguer isn't necessarily retreating under pressure; they are often blithely unaware they've switched tracks. It's a drift, not a retreat.

  ### 2. The Verdict

  There is no single, canonical term in the literature that captures this exactly. We usually just call it "ambiguity in the identity relation" or "confusion of criteria," but those are descriptions, not labels for the move itself.

  Given that, I propose we coin a term that captures the kinetic, unnoticeable nature of the shift.

  **The Label:** **Criterion Slippage**

  It's tight, it's descriptive, and it distinguishes the move from static ambiguity. "Ambiguity" suggests two meanings exist side-by-side; "Slippage" implies a movement from one to the other during the operation of the argument.

  ### 3. The Carving (Defining the Edges)

  If we are going to use **Criterion Slippage** as a tool, we need to know exactly where its edges are. Here is the definition, carved tightly enough to separate it from its neighbors.

  **Definition:**
  *Criterion Slippage* occurs when a single argument regarding diachronic identity or individuation relies on two distinct criteria of counting, switching between them without explicit flagging, such that the conclusion depends on the incompatibility of the two criteria while the premises rely on their individual coherence.

  **The Four Necessary Conditions:**

  1.  **Dual Legitimacy:** Both criteria used (e.g., "Psychological Continuity" and "Material Constitution") must be independently coherent and philosophically defensible.
      *   *Edge Case:* If one criterion is nonsense (e.g., "Same Soul Color"), it's not Slippage; it's just a False Premise. The frustration you feel comes from the fact that *both* ways of counting make sense on their own.
  2.  **Operational Incompatibility:** The two criteria must yield different results in the specific case being argued.
      *   *Edge Case:* If both criteria agree that the person survives, there is no slippage, even if the arguer mentions both. The slippage only matters where the counts diverge.
  3.  **Unflagged Transition:** The switch must occur without explicit notification.
      *   *Edge Case:* If the arguer says, "By biological criteria you are gone, but by psychological criteria you remain," they are not committing Criterion Slippage. They are offering a *Disjunctive Account* or acknowledging *Vagueness*. The fallacy lies in presenting the conclusion as following from a *single* consistent notion of "you."
  4.  **Counting/Individuation Focus:** The shift must specifically affect *how many* entities are counted or *whether* entity X is identical to entity Y.
      *   *Edge Case:* If the shift is about moral responsibility or legal rights (e.g., "You are responsible because you did it, but you aren't punished because you've changed"), that is *Normative Slippage*. Criterion Slippage is strictly ontological/metaphysical.

  ### 4. Distinguishing from Neighbors

  Here is how you tell **Criterion Slippage** apart from the things you mentioned in your prompt:

  *   **Vs. Equivocation:** Equivocation is lexical (Word A means $X$, then $Y$). Criterion Slippage is operational (Rule $X$ applies to Step 1, Rule $Y$ applies to Step 50). You can commit Criterion Slippage without ever changing the definition of the word "person"; you just change the *test* you apply to the word.
  *   **Vs. The Sorites:** The Sorites is the *terrain* (a series of small steps). Criterion Slippage is the *misstep* taken while walking that terrain. One can solve the Sorites (e.g., by denying bivalence) without slipping criteria. Slippage is a failed attempt to solve the Sorites by hiding the boundary.
  *   **Vs. The Problem of the Many:** The Problem of the Many is about *spatial* overlap at a single time (which clouds are part of the storm?). Criterion Slippage is primarily *diachronic* (which stage is part of the person?). While they share DNA, Slippage is about persistence through time; Many is about boundaries in space.

  ### 5. On Awareness

  You asked: *Does the switch have to go unnoticed? What if the person is fully aware?*

  This is the sharpest edge of the carving.

  *   **If Unnoticed:** It is a **Fallacious Criterion Slip**. The arguer is confused. This is the most common case in grad seminars.
  *   **If Noticed but Unflagged:** It is **Rhetorical Criterion Slippage**. The arguer knows they are switching but hopes the audience won't notice because it strengthens the conclusion. This is dishonest argumentation.
  *   **If Noticed and Flagged:** It is **not Criterion Slippage**. It becomes a **Hybrid Account of Identity**. (e.g., "I define survival as requiring *either* biology *or* psychology.") Hybrid accounts have their own problems (they can be too permissive), but they are not committing the slip because they are transparent about the criteria.

  So, to answer your specific constraint: **Yes, for it to count as the specific error you're describing, the switch must be unflagged.** If it is flagged, the argument changes category from a fallacy to a substantive (if controversial) metaphysical position.

  ### Summary for Your Prompts

  If you need to put this into your discussion materials, here is the blurb I would suggest:

  > **Criterion Slippage:** A fallacy common in personal identity debates where an argument covertly switches between two distinct standards of individuation (e.g., psychological continuity vs. biological constitution). Unlike standard equivocation, which shifts the meaning of a word, Criterion Slippage shifts the *rule for counting* while maintaining the illusion of a single consistent standard. It typically occurs when an arguer uses a permissive criterion to establish persistence through early stages of a transformation, then switches to a restrictive criterion to deny identity at the final stage.

  Use that. It gives your discussants a handle on *why* the argument feels slick but unsound. It's not that the intuition is wrong; it's that the ruler changed length halfway through the measurement.
