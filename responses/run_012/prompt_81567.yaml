  There is a principle that captures almost all of your instincts, but to make it work, you will have to sharpen one of your verdicts until it breaks. Your intuitions align closely with **Revisionist Just War Theory**, specifically the **Principle of Moral Responsibility for Unjust Threat**.

  Here is the principle stated precisely, followed by the mapping, the new case, and the honest assessment of where it fails.

  ### The Principle
  **A combatant is liable to be killed only in proportion to their moral responsibility for posing an ongoing, unjust threat.**

  This principle contains four distinct clauses that correspond to your cases:
  1.  **The Agency Clause:** Liability requires moral agency (capacity to understand and choose).
  2.  **The Epistemic Clause:** Responsibility is mitigated by reasonable ignorance of the war's injustice.
  3.  **The Voluntariness Clause:** Responsibility is increased by voluntary participation in the unjust project.
  4.  **The Immediacy Clause:** Liability requires an ongoing threat; it ceases when the capacity to harm is voluntarily relinquished (*hors de combat*).

  ### Mapping Your Verdicts
  *   **The Ignorant Conscript:** He satisfies *Agency*, but the *Epistemic Clause* mitigates his responsibility (he believes he is defending). The *Immediacy Clause* protects him once he stops shooting. *Verdict: Not liable when out of the fight.*
  *   **The Mercenary Volunteer:** He satisfies *Agency*, has full knowledge (no *Epistemic* mitigation), and high *Voluntariness* (joined for pay). He is fully responsible for the unjust threat. *Verdict: Liable like a bank gunman.*
  *   **The Surrendered Soldier:** Regardless of prior guilt, the *Immediacy Clause* overrides. By throwing down the rifle, he ceases to pose a threat. *Verdict: Not a target (shooting him is murder).*
  *   **The Fleeing Volunteer:** Here, the *Voluntariness Clause* interacts with *Immediacy*. Because his participation is voluntary, his liability persists even when the threat is reduced (fleeing/retreating), provided he remains armed and in the theater. He has not effectively surrendered. *Verdict: Still liable.*
  *   **The Child Soldier:** He fails the *Agency Clause* (diminished capacity due to age/coercion). *Verdict: Not liable.*

  ### The New Case
  **Case:** A soldier on the *just* side who has concluded his own war is unjust and keeps fighting anyway.

  **Implication:** Under this principle, this soldier is now morally equivalent to your **Mercenary Volunteer**.
  *   **Reasoning:** He possesses *Agency*. He has satisfied the *Epistemic Clause* (he knows the war is unjust). He satisfies the *Voluntariness Clause* (he chooses to stay). He is now personally responsible for posing an unjust threat.
  *   **Verdict:** He is fully liable to be killed by the opposing side. His uniform no longer grants him protection because the moral basis of that protection (fighting for a just cause) has been revoked by his own conscience.

  ### The Verdict You Cannot Keep
  You must give up the nuance in your **Village Defender** case.

  **Your Intuition:** *"A conscript on the unjust side who is defending his own village... seems to me to be doing something permissible, and I cannot say the just side may kill him as easily as it may kill the volunteer."*

  **The Conflict:** The Principle of Moral Responsibility for Unjust Threat is binary regarding the *justice* of the threat.
  *   If the war is unjust, the "advance" is an unjust threat to the family.
  *   Therefore, the conscript's defense of his family is **objectively justified**.
  *   If his action is justified, he is **not** posing an *unjust* threat.
  *   If he is not posing an *unjust* threat, his liability is **zero**, not "less than the volunteer."

  **The Hard Truth:** The principle implies the just side **may not kill him at all** (unless necessary to save a greater number of others, which is a different calculation). Your intuition that he is *still* liable, just *less* so, relies on a traditionalist view (he is a combatant in uniform) rather than the revisionist view (he is a moral agent) that governs your other verdicts.

  To keep your principle coherent, you must decide: Is he an innocent defender (immune), or is he an obstacle to justice (liable)? Your current verdict tries to be both. The principle forces you to choose the former.

  **Secondary Tension:** There is a smaller tension in your **Fleeing Volunteer** vs. **Surrendered Soldier** distinction. If liability is based on *responsibility*, surrender shouldn't grant immunity (we arrest war criminals; we don't let them walk home). If liability is based on *threat*, then the fleeing volunteer (if armed) is targetable, but so should the fleeing conscript be. You resolve this by implying volunteers lose protection faster than conscripts. This works, but it relies on a slippery definition of "ongoing threat." The Village Defender contradiction is the much harder philosophical break.
