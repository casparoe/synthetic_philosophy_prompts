  Ordering:
  1. Relata: Ontological commitment dictates all downstream metaphysics and entity status.
  2. Difference-making: Solves the profligacy objection, determining the theory's logical viability.
  3. Normativity: Determines if causation is natural or contextual, shaping all applications.
  4. Prevention: Tests consistency of the account across negative causal structures.
  5. Act/Omission: Ethical/legal implication dependent on metaphysical resolution.
  6. Artifacts: Extends normativity question to non-agents.
  7. Collective: Complex aggregation dependent on individual causal status.

  ### The Top Three

  **1. What the causal relatum of an omission is**
  This is the ontological bedrock. You cannot determine if omissions cause anything without specifying what "an omission" is. Is it a fact, an absence, or a counterfactual event? This question is upstream because every account of omission causation implicitly commits to an ontology of negative entities, yet few defend it explicitly. It is highly tractable for a solo philosopher using conceptual analysis and modal logic, requiring no empirical data. You can analyze existing theories (Lewis, Beebee, McGrath) for their ontological costs. A successful result would be a defended typology showing which negative entities are metaphysically permissible without violating parsimony. Confirming this as top priority requires showing that competing causal accounts fail specifically because their ontological commitments are untenable, forcing a revision of the relata before any functional analysis can proceed. If you solve this, you constrain the possible solutions to the profligacy problem, making it the true bottleneck for the field. Without settling the relata, arguments about norms or difference-making talk past one another, ensuring this question remains the primary dependency for any coherent theory.

  **2. Whether difference-making accounts can admit omissions without profligacy**
  The profligacy objection is the greatest threat to omission causation. If every absence is a cause, causation loses explanatory power. This question is upstream because any viable theory must restrict causal claims without arbitrary stipulation. It is tractable conceptually through counterfactual analysis and contrastive frameworks. You can test proposed constraints against intuition pumps without empirical resources. A specific result confirming its priority would be a formal constraint principle that admits paradigmatic omissions (starvation) while excluding absurd ones (failure to water plants on Mars). This belongs at the top because solving the relata (Q1) is useless if the resulting theory makes everything causal. Therefore, the logical viability of the relation takes precedence over the nature of the relata. However, since the relata define the terms of the difference-making, Q1 remains slightly more fundamental ontologically, while Q4 is more fundamental pragmatically. The field cannot progress to ethical implications until the causal relation is shown to be non-trivial. Your contribution would be the restriction principle that allows the debate to move from "is it causal?" to "what does it imply?"

  **3. Whether an omission counts as a cause only relative to a norm**
  This question determines whether causation is a natural relation or interest-relative. It is upstream of legal and ethical applications (Q7) because if causation is normative, the act/omission distinction may be moral all the way down. It is tractable via case comparison (expected vs. unexpected omissions) without empirical data. A confirming result would demonstrate that causal judgments shift systematically with normative expectations while holding physical facts constant. This ranks third because it often serves as the solution to Q4 (norms restrict profligacy), meaning you must understand the problem (Q4) before evaluating the solution (Q2). Nevertheless, it is foundational for your specific prospectus goal regarding law and ethics. If causation is normative, the legal distinction is not undermined but explained. If natural, the legal distinction is potentially undermined. Resolving this clarifies whether your metaphysical work supports or destabilizes current juridical practices. It is the bridge between pure metaphysics and your applied interests, making it the most strategic third choice for a two-year project aiming at ethical implications.

  ### Dependencies

  Q7 (Act/Omission) presupposes Q1 (Relata) and Q2 (Normativity). You cannot know if the law is undermined until you know if omissions are real causes (Q1) and whether that causation is normative (Q2). Q6 (Artifacts) presupposes Q2; if norms are required for omission causation, artifacts can only omit if they are subject to norms. Q5 (Collective) presupposes Q4; you cannot aggregate omissions unless individual omissions are causally viable without profligacy. The ordering is fragile regarding Q2 and Q4. If Q4 (Profligacy) is solved without norms (e.g., via structural equations), Q2 drops in priority. If Q1 is resolved by denying negative entities entirely (error theory), Q7 becomes moot. If a new theory emerges solving Q4 without Q2, the ranking shifts.

  ### Deprioritized

  Drop Q5 (Collective) and Q6 (Artifacts) for now. Q5 requires solving individual causation first; tackling climate-scale omissions prematurely invites confusion about scale rather than metaphysics. Q6 is a subset of Q2; solving the normativity question for agents largely settles the artifact case by extension. You lose immediate engagement with high-stakes applied ethics (climate responsibility, AI liability), which might reduce the perceived relevance of your dissertation to non-philosophers. Deferring these ensures your core contribution is robust enough to support later applications. Focus on metaphysics first; applied implications will follow naturally once the ontological and logical foundations are secure against standard objections.

  ### What would change the ordering

  If a dominant theory (e.g., interventionism) definitively solves Q4 without normative appeal, Q2 drops. If empirical psychology shows causal judgment is invariant to norms, Q2 becomes empirical, not conceptual. If legal scholarship shifts to strict liability regardless of causation, Q7 loses urgency. Conversely, if a new paradox emerges showing Q1 is unsolvable, the project might shift to error theory, moving Q7 to the top as a critique of law. A breakthrough in collective responsibility theory could elevate Q5. Monitor journals for shifts in causal modeling that bypass metaphysical relata.
