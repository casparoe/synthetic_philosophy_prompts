prompt: |-
  I'm putting together a seminar session on counterfactual history-of-ideas questions, and I want to use Newton's theology as the test case, so I'd like your take on it.

  The setup: a younger colleague of mine has been pushing a line that's a mash-up of open theism and kenosis -- roughly, that God freely limits himself, does not foreknow free creaturely choices, and genuinely changes and suffers in relationship with the world. Newton obviously never encountered any of this. But given what we actually know about his religious commitments -- the Father's sole supremacy, his contempt for what he took to be Athanasian corruptions of the primitive faith, his obsessive reading of Daniel and Revelation as a literal forcast of future events, and his habit of treating space as the divine sensorium -- how do you reckon he'd react to my colleague's proposal? Where would he nod along, where would he say the whole thing is a category error, and where would he reach for the word heresy? Be concrete about which of his own views is doing the work at each point, and flag anywhere you're extrapolating beyond what we can reasonably infer.
