      *   *Divine Space (Sensorium):* In the *Opticks* (Queries) and *De Gravitatione*, Newton posits space as the "sensorium of God." God is omnipresent, not just virtually but substantially.
      *   *Dominion:* God is "Pantokrator" (Lord God of Dominion). His essence involves dominion over all things.
      *   *Immutability:* Classical theism generally holds God is immutable. Newton, being a devout (though heterodox) Christian, largely held to divine perfection and unchangeableness in essence, though he emphasized God's *action* in history.
      *   *Idolatry:* Newton's biggest fear was idolatry (worshipping the Son as God). He valued "primitive monotheism."

  3.  **Deconstruct the Colleague's Proposal (Open Theism + Kenosis):**
