answer: |-
  **Project Title:** The Coherence of Neutrality as an Aggregation Constraint in AI Value Alignment

  **Project Duration:** 9 Months (PI + 0.5 FTE Research Assistant)

  ### 1. Statement of the Research Question

  The alignment literature typically operationalizes "human values" as a single scalar objective function to be maximized. This operationalization conflates two distinct problems: the *franchise question* (whose preferences count?) and the *aggregation question* (how are conflicting preferences combined?). In political philosophy, liberal neutrality is often proposed as a solution to value pluralism. However, standard liberal neutrality is a constraint on state *justification* or *action* (often permitting abstention), whereas an aligned AI system cannot abstain—it must emit a token or execute an action.

  Consequently, if "neutrality" is to have any role in alignment, it must be re-described not as a constraint on the *domain* of action, but as a constraint on the *aggregation rule* itself.

  **The Primary Research Question:**
  *Is it conceptually coherent to define a constraint of "neutrality" on an AI aggregation function that (a) avoids collapsing into a substantive conception of the good (perfectionism), (b) avoids triviality (ruling out nothing), and (c) respects the incommensurability of values and the separateness of persons?*

  This question admits a determinate answer: either such a constraint can be rigorously defined and shown to exclude at least one plausible non-neutral aggregation rule without excluding all rules, or it cannot. A negative result (demonstrating incoherence) is as valuable as a positive one, as it would indicate that "neutrality" is the wrong conceptual tool for the aggregation problem in alignment.

  ### 2. Why Existing Positions Leave the Question Open

  Current approaches fail to resolve this question because they operate in silos that ignore the specific constraints of AI deployment.

  1.  **Standard Defenses of Liberal Neutrality:** These rely on the distinction between neutrality of aim and neutrality of effect. They generally assume an agent (the state) that can choose *not* to legislate on certain comprehensive doctrines. An AI model, by design, cannot "not legislate"; it must complete the pattern. Transferring neutrality from the *output* to the *function* requires a structural translation that political philosophy has not performed.
  2.  **Standard Treatments of Interpersonal Aggregation:** Social choice theory addresses aggregation but typically assumes ordinal preferences and fixed alternatives. Alignment practice assumes a cardinal, comparable reward signal (e.g., via RLHF). The "common currency" problem is usually bypassed in alignment by assuming the reward model *finds* the currency, rather than asking if one exists. If values are incommensurable, standard aggregation rules (utilitarian summation, prioritarianism) violate the separateness of persons by treating distinct value systems as fungible quantities.
  3.  **Alignment Practice:** Current operationalizations (e.g., training a single reward model on diverse human feedback) implicitly solve the aggregation problem by smoothing contradictions into a single scalar. This practice assumes the franchise and aggregation questions are settled by the data distribution. It leaves open whether this resulting function is "neutral" in any meaningful sense, or merely a statistical average that violates minority constraints in ways a neutral rule should not.

  None of these positions address the specific intersection: a mandatory action space where the *rule of combination* must itself satisfy a neutrality condition despite incommensurable inputs.

  ### 3. Methodology and Work Plan

  This is a conceptual project, but it will proceed via structured argumentation and formal stress-testing rather than exegesis. The goal is to avoid "verbal rearrangement" by demanding that any proposed definition of neutrality have *exclusionary power*.

  **Phase 1: Taxonomy and Translation (Months 1–3)**
  *   **Activity:** I will catalog the distinct definitions of neutrality in the political literature (aim, effect, procedural, justificatory) and map them onto the structure of an objective function $J(\theta) = \sum w_i v_i$.
  *   **Distinction to Draw:** I will distinguish between *Input Neutrality* (weights $w_i$ are equal) and *Structural Neutrality* (the function form treats all value types symmetrically).
  *   **RA Role:** The RA will compile cases from alignment literature where "neutrality" is invoked and categorize them by this taxonomy to identify inconsistencies.
  *   **Milestone:** A working definition of "Aggregation Neutrality" that is distinct from "Equal Weighting."

  **Phase 2: The Incommensurability Stress Test (Months 4–6)**
  *   **Activity:** I will test the working definition against the problem of incommensurability. If values cannot be reduced to a common currency, can an aggregation function be neutral without implicitly imposing a currency?
  *   **Concrete Test:** I will construct thought experiments involving two agents with lexically ordered but conflicting values (e.g., Agent A: Liberty > Welfare; Agent B: Welfare > Liberty). I will determine if a "neutral" aggregator can output a decision without secretly prioritizing one lexical order over the other.
  *   **Criterion for Success:** The proposed constraint must rule out at least one standard aggregation rule (e.g., simple utilitarian summation) as "non-neutral," while permitting at least one other rule. If it rules out nothing, it is trivial. If it rules out everything, it is impossible.
  *   **RA Role:** The RA will assist in formalizing these thought experiments to ensure logical consistency and check for hidden assumptions about comparability.

  **Phase 3: Synthesis and Deliverable (Months 7–9)**
  *   **Activity:** Drafting the final argument. If the concept is coherent, I will outline the necessary conditions for the aggregation rule. If incoherent, I will articulate the "Neutrality Illusion" in alignment.
  *   **Validation:** I will present the draft to two colleagues (one political philosopher, one ML researcher) to check for disciplinary blind spots.
  *   **Deliverable:** A paper-length manuscript (approx. 8,000 words) suitable for publication in a journal of philosophy or AI ethics, plus a technical appendix formalizing the aggregation constraints.

  ### 4. Criteria for Success and Failure

  **Successful Outcome:**
  A clear determination on the coherence of Aggregation Neutrality.
  *   *Positive:* A definition of a neutrality constraint that successfully filters aggregation rules without presupposing a specific conception of the good.
  *   *Negative:* A proof that any non-trivial neutrality constraint on aggregation necessarily smuggles in a substantive value judgment (e.g., prioritizing comparability itself).
  In both cases, the success condition is *clarity*: the project succeeds if we know *why* the concept works or fails.

  **Failure Conditions:**
  1.  **Conceptual Dissolution:** The project fails if it turns out "neutrality" is merely a label for whatever aggregation rule the designer prefers, with no independent content. (Note: Demonstrating this is a substantive philosophical result, but it counts as a "failure" of the initial hypothesis that neutrality is a useful tool).
  2.  **Scope Creep into Formal Social Choice:** If the project requires solving the interpersonal comparability problem to make progress, it has failed. The project must take the *lack* of a common currency as a fixed constraint, not a problem to be solved.
  3.  **Verbal Rearrangement:** If the final definition of neutrality is indistinguishable from "fairness" or "equity" without adding precision, the project has not advanced the state of knowledge.

  ### 5. Scope and Risk Assessment

  **Realistic Scope:**
  The 9-month timeline is sufficient for the conceptual analysis and the construction of the stress-test cases. It is *not* sufficient for developing a new formal social choice theorem or for empirical testing of alignment techniques. The project remains strictly normative and conceptual.

  **Primary Risk (Scope Blow-up):**
  The most likely point of expansion is the **formalization of incommensurability** (Phase 2). There is a vast literature on modeling incommensurable values (e.g., vector valuations, partial orderings).
  *   *Mitigation:* I will restrict the analysis to the *implications* of incommensurability for neutrality, rather than attempting to propose a new mathematical framework for incommensurability itself. I will use existing simple models (e.g., lexicographic preferences) as the test bed, rather than deriving new ones. If the RA and I find that simple models are insufficient, we will halt the formalization and revert to a purely qualitative impossibility argument, rather than extending the timeline.

  **Secondary Risk:**
  The distinction between "state" and "model" may be challenged as disanalogous.
  *   *Mitigation:* The proposal acknowledges this. The argument does not rely on the analogy holding perfectly, but on the *failure* of the analogy to motivate the need for a new definition of neutrality. If the disanalogy is total, the negative result (neutrality is inapplicable) is secured.

  ### 6. Resources Required

  *   **PI Time:** 50% effort for 9 months. Primarily for argument construction, drafting, and validation.
  *   **Research Assistant:** 50% effort for 9 months. Required for literature mapping, formal checking of the aggregation constraints, and preparing the technical appendix.
  *   **No External Data:** This project requires no compute resources, human subjects, or proprietary model access. It is purely theoretical.

  ### 7. Conclusion

  This project addresses a foundational confusion in AI ethics. By isolating the aggregation problem from the franchise problem and testing the viability of "neutrality" as a constraint on the former, we can determine whether a major strand of ethical reasoning in alignment is robust or illusory. Given the reliance of current RLHF practices on implicit aggregation, clarifying whether a neutral aggregation rule is even possible is a prerequisite for normative progress.
