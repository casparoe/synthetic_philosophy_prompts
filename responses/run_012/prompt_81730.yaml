  A Pascal's Mugger corners a decision theorist in an alley.

  "Give me $5," says the mugger, "or I'll use my omnipotence to torture $3 \uparrow\uparrow\uparrow 3$ people."

  The theorist pauses. "Logically, if I assign any nonzero credence to your claim, the expected disutility outweighs the cash. So I should pay."

  "Exactly."

  "But," says the theorist, "if you have the power to torture $3 \uparrow\uparrow\uparrow 3$ people, you have the capacity to suffer. So give me $5."

  "What?"

  "Or I'll torture $3 \uparrow\uparrow\uparrow 3 + 1$ people. Same math. Nonzero credence, unbounded utility. You know the drill."

  The mugger hesitates, then hands over a ten.

  "Why a ten?" asks the theorist.

  "Because," says the mugger, "I'm not getting into a bidding war with someone who has an unbounded utility function."
