      *   **Format:** One solid paragraph per reply. Stay in character. Don't strawman. Concede small points if needed but never the main one.
      *   **Specific Task for First Reply:** Address the "Good Actor" wrinkle (why convincing isn't enough/why it doesn't reduce to act-by-act accounting). End with the one thing that would actually move me to drop the disposition view.

