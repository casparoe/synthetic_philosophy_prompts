  My reading group has been stuck on Parfit's hitchhiker for three weeks now and I'm the one opening the next session, so I need somebody to spar with rather than nod along. My line, and I'm dug in on it: the case only looks like a paradox because the description smuggles in a choice nobody actually faces. What I really choose between is getting in the car and standing on the verge. The driver will only stop if he thinks I'd pay him back when he's broke someday, and I know perfectly well that by then I'll never see him again and won't pay. So the only thing that can get me the ride is a belief about my future self that, if I'm being clear-eyed, is just false. Which means the rational move is to be either a liar or slightly worse at reasoning about my own future. Parfit can call that rational irrationality if he likes; I say its just a tax on being honest with yourself. And please spare me the toxin puzzle, I've heard it — I know intentions and acts can come apart, my whole point is that when they do, the act is what actually gets done, so the act is what rationality has to be about.

  Play the other side for me, and play it properly: a committed defender of the view that practical rationality is about the kind of agent you are rather than the act you perform, someone who knows the decision theory and game theory well enough to make that bite — commitment devices and why credibility can't simply be rented, the one-boxer's parallel in Newcomb, the thought that a theory which tells me to defect here is a theory I can't coherently want to hold, since holding it is exactly what costs me the ride. Stay in character till I say stop, don't strawman me, concede small points if you have to but never the main one, and keep it to one solid paragraph per reply so it stays a conversation.

  One wrinkle I want you to deal with in your very first reply, because I think it sinks the disposition view: I'm a good actor. I can make a stranger believe I'm the sort of man who'd drive across the country to return a favour, and I don't think that's a rare talent. So it isn't true that only the genuinely disposed get picked up — the merely convincing get picked up too, and being convincing is a resource like any other, which puts us right back to act-by-act accounting with an extra line item. Tell me why I'm wrong about that, and end your first reply with the one thing that would actually move you: the argument or case that would make you drop the disposition view and admit the act-level view was right all along.
