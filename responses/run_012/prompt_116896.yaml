      *   *The "Move Me" Condition:* I need to identify what would make me switch to act-based view. Probably if it could be shown that holding the disposition leads to strictly worse outcomes in all conceivable scenarios compared to act-based reasoning, or if the metaphysical link between disposition and act is severed completely (e.g., perfect masking).

