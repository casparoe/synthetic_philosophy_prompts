  I am not a philosopher and have no academic training in the subject, but I have spent a lot of time trying to understand the dispute over whether omissions can be causes, and I have reached the point where I can state both sides better than I can decide between them. The dispute seems to go like this. One side says that a cause must be an event or state that occurs: the gardener's failure to water the plants is not a cause of their death, because there is no positive event there to do any causing; at most the absence of water is a background condition, or a fact we mention for pragmatic reasons. The other side says that is obviously wrong: the plants died because the gardener did not water them, and if we deny that omissions can be causes we cannot make sense of negligence, omissions in medicine, or the difference between a death that would have happened anyway and one that happened because no one acted. A third position, which I find tempting but cannot quite state, says that both sides are answering different questions: one is about the causal relation in the world, the other about which condition we select and call the cause in an explanation. I keep suspecting the whole debate is stuck because nobody has separated the metaphysics of causal relata from the pragmatics of causal selection, but I also suspect there is a hidden formal problem about how to represent omissions in causal models, and a hidden normative problem about responsibility. I want a diagnosis, not a verdict on whether omissions are causes.

  Here is the concrete puzzle that makes me think the formal issue is doing more work than people admit. I have tried to draw a causal graph for the plant case. If I include a node for the absence of water, the node seems to have no parents and its value is fixed by what did not happen; if I leave it out, the graph says nothing about the gardener at all. If I add an intervention that makes water arrive, the plant lives, so the absence seems difference-making; but if I add a second gardener who also failed to water, it is not clear which absence is the cause, or whether the two absences are one cause, two causes, or no cause at all. This is the kind of case where I cannot tell whether the disagreement is about the world, about our models, about the word cause, or about who is to blame. Please diagnose the impasse.

  I would like you to tell me what kind of disagreement this really is: a verbal dispute about how the word cause is used; a substantive metaphysical dispute about what kinds of things can stand in causal relations; a dispute about standards of evidence or about which cases count as data; two groups answering different questions under one heading, one about causation and one about causal explanation or responsibility; or a mix, with one part doing the real work. Support the diagnosis by engaging the positions as I have stated them, and say what would count as progress given that diagnosis: a distinction, a formal result about representing omissions, a change of question, an experiment or case that would separate the sides, or an argument that no progress should be expected because the question is ill-posed. Be honest about which parts of the dispute are merely apparent and which are real, and about whether my own suspicion is right.

