      *   *Modest/Hypothetical Intentionalism:* Jerrold Levinson, Noël Carroll. Meaning is what a hypothetical author *could* have intended given the context, or what the actual author intended *if* successfully realized in the text.
      *   *Post-Structuralist/Deconstructive:* Derrida. Indeterminacy is inherent to language/text.

  3.  **Address the Specific Questions:**

      *   **Q1: Determinate Answer vs. Intended Indeterminacy.**
