          *   *The "Replicant" twist:* If the character is a replicant, does the actor know? If the actor is "human" playing a "replicant" playing a "human"... it creates an ontological stack that literary theory rarely handles.

  4.  **Drafting the Response (Iterative refinement):**
      *   *Tone Check:* Keep it analytical, respectful of the user's knowledge, avoid condescension. Use the rationalist-adjacent language (stress test, priors, update).
      *   *Structure:* Follow the user's bullet points for clarity.
      *   *Philosophy Check:* Ensure Levinson, Carroll, Barthes, and Foucault are referenced correctly but lightly (no name-dropping without purpose).
      *   *Key Argument:* The "Modest Intentionalist" view is the strongest fit here. The text *successfully realizes* an intention of ambiguity, even if the director later claims an intention of specificity. The later claim fails to update the text.

  5.  **Refining the "Residue" Section:**
      *   Need to be specific about what resists. The Voiceover is the obvious one, but the user knows that. The *Shining* footage is a better example of "material resistance." Also, Rutger Hauer's "Tears in Rain" monologue. He improvised it. Scott kept it. It adds humanity to a villain replicant. This resists the "replicants are cold" intention.

