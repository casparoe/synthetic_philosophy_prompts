          *   *Synthesis:* The "Ambiguity" might be the actual intention (Peoples/Fancher), while the "Replicant" label is Scott's retrospective retrofit.
          *   *Philosophical angle:* Levinson's "Hypothetical Intentionalism." What would a reasonable audience infer? They infer ambiguity. Therefore, the meaning *is* ambiguity, even if Scott later says "No, he's a robot."
          *   *Can both be true?* Yes, if the *textual* intention is ambiguity, but the *biographical* intention is specificity. The work sustains the ambiguity; the biography collapses it.

