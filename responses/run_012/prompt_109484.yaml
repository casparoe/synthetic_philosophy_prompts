      *   **Tone:** Intellectual, slightly weary of "dumb arguments," wants rigor over vibes, appreciates nuance ("modest qualifiers"), dislikes dogma ("author is dead and anything goes").
      *   **Core Task:** Analyze *Blade Runner* through the lens of authorial intention philosophy, addressing specific questions about determinacy, whose intention counts, which cut matters, the meta-textual symmetry, and resistant residues.
      *   **Constraint:** No bibliography dump (just ideas/names), no quote-mining the film, avoid simplistic "death of the author" platitudes.
      *   **Key Insight to Test:** The user suspects the film adds something to the debate regarding distributed authorship vs. experienced unity.

  2.  **Deconstruct the Philosophical Landscape:**
