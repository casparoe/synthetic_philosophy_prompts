          *   *Philosophical angle:* Wimsatt & Beardsley would say "The Text." But which text?
          *   *Non-question-begging approach:* Treat them as *different works* sharing a title. Like different drafts of a novel published posthumously. The "Final Cut" is the most coherent realization of the *visual* argument, but the "Theatrical" is the cultural object that landed.
          *   *Intentionalist nuance:* The "Final Cut" aligns best with Scott's *later* intention, but the "Theatrical" aligns with the *production* intention of the time.

      *   **Q4: Meta-textual Symmetry (Replicant/Human = Text/Reader).**
          *   *Is it cute or real?* It's real. It's structural irony.
