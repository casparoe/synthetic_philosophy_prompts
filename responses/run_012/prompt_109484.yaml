          *   *Actor (Ford):* Performance is a form of authorship (collaborative). If he plays it human, that's data in the text.
          *   *Writers (Fancher/Peoples):* They wrote the ambiguity.
          *   *Studio:* They forced the voiceover/ending (Theatrical).
          *   *Philosophical angle:* "Collective Authorship" (Noël Carroll). Cinema is inherently collaborative. We weight intentions based on contribution to the *specific feature*. Scott controls the visual tell (unicorn); Ford controls the emotional affect.
          *   *Retrospective vs. Contemporaneous:* Retrospective claims are less authoritative regarding the *work's* meaning at the time of release, but authoritative on the *creator's* later understanding.

      *   **Q3: Which Cut is the Film?**
