          *   *Philosophical angle:* This is where "Death of the Author" wins. The material reality of the film strip overrides the intent. The "accident" becomes part of the meaning (e.g., the cheesy ending makes the film more poignant about escape).

      *   **Q6: What does *Blade Runner* add to the debate?**
          *   *User's Hypothesis:* Distributed authorship vs. experienced unity.
          *   *Validation:* Yes. Literature is often solitary (one writer). Film is industrial.
