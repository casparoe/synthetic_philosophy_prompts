      *   **Task:** Draft 8-10 interview questions with follow-ups.
      *   **Constraints:**
          *   Intelligible to high schoolers/teachers but not watered down.
          *   Press on actual content, prevent restatement/deflection.
          *   Specific required topics:
              1.  Distinguishing genuine hinge vs. mere importance (avoiding "every generation thinks this").
              2.  The "Quiet Hinge Problem" (unfalsifiability in real-time).
              3.  Relation to self-locating belief/observation (signs of being in a hinge).
              4.  Distinguishing hinge vs. near-miss hinge without hindsight.
              5.  Dilution vs. strengthening (many possible hinges).
              6.  End with falsification/counterevidence.
          *   Structure: Sequence should make the "expected value not prediction" deflection harder over time.
          *   No citations/reading lists/bio questions.
          *   Define technical terms in questions.

  2.  **Deconstruct the Guest's Position & Defenses:**
      *   *Position:* High stakes $\times$ Low probability = High Expected Value (EV). Therefore, act as if it's true.
      *   *Defense:* "It's not a prediction, it's about EV." "Even a small chance justifies action."
      *   *Weaknesses:* If *any* small chance justifies extraordinary measures, we get paralysis or absurdity (Pascal's Wager style). If we can't identify the hinge until it's over, the advice is useless. If every generation thinks this, the theory lacks discriminative power.

  3.  **Drafting Strategy - Sequencing:**
      *   *Early Questions:* Establish the basics, tackle the "every generation" objection (Required Topic 1).
      *   *Middle Questions:* Dig into the epistemology (Quiet Hinge, Self-Locating, Near-Miss). This is where the "EV not prediction" defense starts to strain.
      *   *Late Questions:* Challenge the decision theory (Dilution, Extraordinary Measures) and finally demand falsifiability.
      *   *Follow-ups:* Must anticipate the "EV" dodge and corner her into specifics.

