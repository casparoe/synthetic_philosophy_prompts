answer: |-
  ### The "What Do You Mean by Manipulation?" Quiz

  **Instructions:**
  Read each situation below. Don't worry about whether the action is "good" or "bad." Instead, pick the answer that best describes **why** the situation feels tricky or wrong to you. There are no right answers, only different ways of seeing the problem.

  ---

  **1. The Hidden Cigarettes**
  Your mum knows you've been smoking. She doesn't yell or lecture. She just starts locking the cabinet where you keep your cigarettes. You know where they are, but you can't get them without her key.
  *   A. It's wrong because she's using her power as a parent to override your choice.
  *   B. It's wrong because she's changed the options available to you instead of letting you choose.
  *   C. It's not really a problem if it keeps you from hurting yourself; the result is what matters.

  **2. The Doctor's Framing**
  A doctor tells you about a surgery. She says, "90% of people survive this," instead of "10% of people die." Both statements are mathematically true, but the first one makes you feel safer.
  *   A. It's tricky because she's giving you true facts but arranging them to push your feelings instead of your logic.
  *   B. It's only wrong if you end up making a choice you regret later.
  *   C. It's not manipulation, it's just how people talk; the info is true, so you can't complain.

  **3. The Flag and Song Ad**
  A political ad plays during the game. It doesn't make any claims about the candidate's record. It just shows slow-motion clips of them with a flag waving and an inspiring song playing.
  *   A. It's manipulative because it's trying to get you to vote based on vibes instead of reasons.
  *   B. It's fine; ads are supposed to be emotional, and you're still free to ignore them.
  *   C. It's only a problem if the candidate turns out to be terrible once elected.

  **4. The Never-Ending Ask**
  A friend wants you to go to a party. You say no. They ask again an hour later. Then again the next day. They don't lie or threaten, they just keep asking until you're too tired to say no again.
  *   A. It's wrong because they wore down your resistance until it wasn't really your choice anymore.
  *   B. It's annoying, but if you finally said yes, then you agreed to it.
  *   C. It's manipulative because they're bypassing your decision by exploiting your exhaustion.

  **5. The Cafeteria Layout**
  The school wants students to eat healthier. They put the salad at eye level and the chips on the bottom shelf where you have to bend down. They don't ban the chips.
  *   A. It's wrong because they're rigging the environment to steer your habits without you noticing.
  *   B. It's fine because you can still get the chips if you want them.
  *   C. It's only a problem if students end up unhappier or less healthy because of it.

  **6. The Classmate's Lie**
  You're hesitating to turn in an essay. A classmate says, "Everyone else already finished, are you stupid?" Actually, most people haven't finished. They said this to shame you into working.
  *   A. It's wrong because they lied to you to get what they wanted.
  *   B. It's wrong because they used social pressure to make you feel like you couldn't say no.
  *   C. It's only bad if stressing out makes you do a worse job on the essay.

  **7. The Coach's Warning**
  You're thinking of quitting the team. The coach says, "You'll regret quitting for the rest of your life." They might be right, but they say it loudly when you're already crying, aiming at your fear.
  *   A. It's manipulative because it targets your fear instead of giving you reasons to stay.
  *   B. It's not manipulation if what they said turns out to be true.
  *   C. It's only wrong if you quit anyway and then feel miserable about it.

  **8. The Out-of-Context Vote**
  An ad says, "My opponent voted against funding the troops!" It's technically true they voted "no" on that bill, but the bill was actually corrupt and the troops got funded a different way.
  *   A. It's wrong because it's misleading, even if every word is technically true.
  *   B. It's just politics; voters should check the facts themselves.
  *   C. It's only a problem if the wrong person wins because of it.

  **9. The Deepfake Video**
  A video circulates showing a politician saying something racist. It looks real, but it was made by AI. They never said it.
  *   A. It's wrong because it's a complete lie designed to make you believe something false.
  *   B. It's wrong because it hacks your brain's tendency to trust your eyes.
  *   C. It's only really harmful if people actually believe it and change their votes.

  **10. The Summer Job Pitch**
  A friend tells you about a summer job. They rave about the pay and the parties. They don't mention that the shifts are 12 hours long and the boss is mean.
  *   A. It's manipulative because they hid the bad info you needed to make a real choice.
  *   B. It's not manipulation, they just shared their opinion; you should ask about the downsides.
  *   C. It's only a problem if you take the job and end up miserable.

  ---

  ### Scoring Key

  Count how many times you picked each letter pattern. Note: The letters map to different views in different questions. Use the table below to tally your score.

  | Question | If you picked A... | If you picked B... | If you picked C... |
  | :--- | :--- | :--- | :--- |
  | **1** | **Power View** (View 4) | **Menu View** (View 3) | **Results View** (View 6) |
  | **2** | **Brain View** (View 2) | **Results View** (View 6) | **No-Such-Thing** (View 5) |
  | **3** | **Brain View** (View 2) | **No-Such-Thing** (View 5) | **Results View** (View 6) |
  | **4** | **Power View** (View 4) | **No-Such-Thing** (View 5) | **Brain View** (View 2) |
  | **5** | **Menu View** (View 3) | **No-Such-Thing** (View 5) | **Results View** (View 6) |
  | **6** | **Lie View** (View 1) | **Power View** (View 4) | **Results View** (View 6) |
  | **7** | **Brain View** (View 2) | **Lie View** (View 1) | **Results View** (View 6) |
  | **8** | **Lie View** (View 1) | **No-Such-Thing** (View 5) | **Results View** (View 6) |
  | **9** | **Lie View** (View 1) | **Brain View** (View 2) | **Results View** (View 6) |
  | **10** | **Lie View** (View 1) | **No-Such-Thing** (View 5) | **Results View** (View 6) |

  **Tally your totals for each View:**

  *   **The Truth Tracker (Lie View):** You mostly picked options focusing on lies, omissions, or misleading facts. To you, manipulation is about corrupting the information someone has.
  *   **The Reason Guardian (Brain View):** You mostly picked options focusing on emotions, vibes, habits, or bypassing logic. To you, manipulation is about skipping over someone's reasoning process.
  *   **The Freedom Fighter (Menu/Power View):** Combine your scores for **Menu View** and **Power View**. You focus on choices, options, and pressure. To you, manipulation is about restricting freedom or exploiting vulnerability, regardless of what is said.
  *   **The Outcome Observer (Results View):** You mostly picked options focusing on whether things turned out well or badly. To you, the method doesn't matter as much as the harm caused.
  *   **The Skeptic (No-Such-Thing View):** You mostly picked options that said "It's just politics," "You should ask," or "It's not manipulation." You think the word is too vague and prefer to call things by their specific names (lying, annoying, marketing).

  **What if my scores are mixed?**
  *   **High Lie + High Results:** You might think lies are only wrong because they cause bad outcomes.
  *   **High Brain + High Freedom:** You see a strong link between bypassing reason and losing freedom (these views often overlap).
  *   **No Clear Pattern:** You might be a **Contextualist**. You don't have one rule; you judge each case on its own specifics. This is a valid philosophical position, even if it's hard to score.

  ---

  ### What This Quiz Can't Tell You (Limitations)

  1.  **The "Menu" vs. "Power" Overlap:** The quiz tries to separate changing the options (like the cafeteria) from using pressure (like the nagging friend). In real life, these often happen together. If you scored high on both, you probably see them as two sides of the same coin: limiting free choice.
  2.  **The "Skeptic" Blind Spot:** If you scored high on the **No-Such-Thing View**, this quiz can't tell if you truly believe manipulation doesn't exist, or if you just think the word is unhelpful. You might still agree with the other views but prefer different labels.
  3.  **Good Manipulation:** This quiz focuses on what makes manipulation *wrong*. It doesn't measure whether you think manipulation can ever be *good* (like the mum hiding cigarettes). The Results View is the only one that clearly allows for "good manipulation," but others might agree in specific cases.
  4.  **Intent vs. Effect:** The quiz asks about the situation, not the person's intent. Some philosophers say manipulation requires *intent* to deceive or control. This quiz doesn't test for that; it tests on the mechanism and effect.

  ### A Note on View Overlaps (For the Debate Club)

  If you are analyzing the results, watch out for these two pairs that often produce the same answers:

  *   **The Lie View vs. The Results View:** In many cases (like the Fake Video), lying leads to bad results. A Truth Tracker and an Outcome Observer will often agree on the case but disagree on *why* it's wrong. To separate them, ask: "Is it still manipulation if the lie leads to a really good outcome?" (Truth Tracker says yes, Outcome Observer says no).
  *   **The Menu View vs. The Power View:** Both are about freedom. To separate them, ask: "Is it manipulation if a vending machine is broken so you can't buy chips?" (Menu View might say yes, the options are rigged. Power View says no, there's no person exerting power).

  ### Final Check on Consistency

  *   **View 5 (No-Such-Thing):** I represented this by offering options that reject the label "manipulation" in favor of specific descriptions ("just politics," "just sharing opinion"). This allows consistent scoring for someone who thinks the concept is a cluster of unrelated wrongs.
  *   **View 6 (Results):** I ensured this option appears in almost every question, focusing on harm/outcome rather than mechanism.
  *   **Language:** I avoided terms like "autonomy," "consequentialism," or "epistemic." I used "choice," "results," and "logic."
  *   **Case Duty:** Each case was assigned to test specific contrasts. For example, the Doctor case (Q2) tests Truth vs. Brain vs. Results, while the Cafeteria case (Q5) tests Menu vs. Freedom vs. Results. No single case is doing too much work.
