answer: |-
  # Joint Statement on the Nature of Well-Being

  We, the undersigned regular members of the Well-Being Working Group, having debated for two years, submit this statement to record our common ground, isolate our precise disagreements, and identify the empirical or phenomenological questions that resolve them.

  ### I. Agreed Claims

  1.  **Experientialism:** Well-being is fundamentally a matter of the subjective, qualitative character of a subject's experience. Facts about the world that do not register in experience (e.g., being betrayed without knowing it) do not directly alter well-being.
  2.  **Rejection of Objective Lists:** We jointly reject theories claiming that certain goods (e.g., knowledge, friendship, achievement) contribute to well-being independently of how they feel to the subject.
  3.  **Rejection of Pure Desire-Satisfaction:** We jointly reject theories claiming that the mere satisfaction of desire constitutes well-being regardless of the experiential outcome. A desire satisfied without any positive experiential impact adds no value.
  4.  **The Badness of Suffering:** We agree that suffering (pain, distress, anguish) is intrinsically bad. Its presence lowers well-being, and its absence is a necessary condition for a life to go well.
  5.  **Measurement Presuppositions:** Any measurement of well-being must presuppose a subject capable of conscious experience. There is no well-being where there is no one to experience it.

  ### II. Remaining Disagreements

  | Claim | Tranquilist Position | Two-Sided Hedonist Position | Crux Reference |
  | :--- | :--- | :--- | :--- |
  | **The Value of Pleasure** | Positive pleasure (enjoyment, joy) adds no intrinsic value. It is merely the temporary absence of craving or disturbance. | Positive pleasure is intrinsically good. It adds value over and above the mere absence of pain. | Crux 1 |
  | **The Ideal State** | The best possible life is one of untroubled, desire-free calm. Adding excitement or intense joy does not improve it. | The best possible life includes both the absence of pain and the presence of rich, positive enjoyment. | Crux 2 |
  | **The Baseline** | The neutral baseline of well-being is the absence of suffering. Anything above this is not "better," only "less bad." | The neutral baseline is a state of neither pain nor pleasure. States above this are positively better. | Crux 1 |

  ### III. Cruxes

  **Crux 1: The Phenomenology of Relief**
  *   **The Question:** Is the feeling of "relief" experienced when pain ceases a positive quality (pleasure) or merely the cessation of a negative quality (suffering)?
  *   **Agreed Case:** Both sides agree that the transition from acute pain to a pain-free state involves a distinct phenomenological shift often labeled "relief." Both agree this case bears directly on whether pleasure is a distinct positive existence or merely the absence of pain.
  *   **Tranquilist Prediction:** Investigation will show that "relief" is identical to the fading of the negative state. Once the pain is zero, the value is zero. There is no residual positive glow; the sense of "goodness" is purely comparative to the prior pain.
  *   **Hedonist Prediction:** Investigation will show that "relief" possesses a positive qualitative character distinct from mere neutrality. The experience of pain stopping feels *good* in a way that a state of never having been in pain does not, proving the existence of positive value.

  **Crux 2: The Addition Test**
  *   **The Question:** If a subject is in a state of perfect calm (no pain, no craving), does adding a stimulus that generates pure enjoyment (with no subsequent crash or craving) make the life better?
  *   **Agreed Case:** Both sides agree that a thought experiment involving a "stable joy" stimulus—where enjoyment is added without introducing future suffering or desire—bears on the intrinsic value of pleasure.
  *   **Tranquilist Prediction:** A rational agent would be indifferent between the calm life and the calm-plus-joy life. Since the calm life lacks nothing bad, the addition adds nothing of value. Preference for joy is a matter of taste, not well-being.
  *   **Hedonist Prediction:** A rational agent would prefer the calm-plus-joy life. The calm life is incomplete; the addition of joy constitutes a genuine improvement in well-being, not merely a change in style.

  ### IV. Terminological Clarifications

  We have examined whether our quarrel is merely verbal. We conclude that the core disagreement is substantive, not verbal. However, we note one divergence in terminology regarding "craving."

  *   **The Issue:** The Tranquilist classifies "craving" as a form of suffering (a state of lack or unease). The Hedonist classifies "craving" as a desire state that is neutral until satisfied or frustrated.
  *   **Resolution:** We agree this is not the source of our main disagreement. Even if craving is defined as neutral by the Hedonist, the disagreement remains regarding whether *pleasure* (the satisfaction) adds positive value. The Tranquilist holds that satisfying a craving merely removes the negative state of craving; the Hedonist holds it adds a positive state of pleasure. Thus, the dispute is axiological (about value), not merely semantic.
