prompt: |-
  I run a grad seminar on moral metaphysics and we spent alot of the term on the particularism/generalism fight, and it stalled in the worst way: nobody moved and everybody kept agreeing about the cases. The particularists say moral reasons are contributory all the way down -- a feature that counts in favour here can count against there, so no finite stock of true principles will capture how things go -- while the generalists keep replying that sure, but there are still true exceptionless generalizations, they're just hedged: fill in the rest of the circumstances and you get a principle that never fails. Which the particularists call cheating, since a principle that only holds once everything is specified is just a redescription of the case, or a summary of verdicts you'd already reached, not something doing any work.

  My hunch, and I'd rather you push on it than agree with it, is that the two sides aren't really disagreeing about the moral facts or even about holism; they disagree about what a principle is for. One side needs a principle to codify the contribution a feature makes, the other only needs it to predict or license verdicts, and a hedged generalization can do the second without ever doing the first. A colleague adds a twist I can't decide about: she says a principle could be exceptionless and yet self-adjusting -- it assigns each feature a role that itself varies with context -- which would satisfy the generalists without ever handing the particularists the fixed contributions they say don't exist. Is that a genuine third position or a verbal trick?

  So diagnose the impasse for me. Is it verbal, is it a disagreement about what counts as a principle (a role or function question rather than a metaphysical one), or is there a hidden substantive claim about reasons that one side is assuming without arguing for? And given your diagnosis, what would actually count as progress -- a distinction, a case, a formal result about holism -- or should we expect none, because the two sides are definately answering different questions under one name?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** A graduate seminar on moral metaphysics.
      *   **Topic:** The Particularism vs. Generalism debate.
      *   **Current State:** Stalled impasse. Everyone agrees on cases.
      *   **The Debate:**
          *   *Particularists:* Moral reasons are holistic (valence-switching). No finite stock of true principles can capture moral reality. Hedged principles are cheating (redescriptions).
          *   *Generalists:* Exceptionless generalizations exist if sufficiently hedged/qualified.
      *   **User's Hunch:** The disagreement isn't about moral facts or holism, but about the *function* of a principle (codifying contribution vs. predicting verdicts).
      *   **Colleague's Twist:** "Self-adjusting principles" (exceptionless but context-sensitive roles). Is this a third position or a verbal trick?
      *   **Task:** Diagnose the impasse (verbal, functional, or substantive?), identify hidden assumptions, and suggest what would count as progress (distinction, case, formal result, or give up).
      *   **Constraint:** "I'd rather you push on it than agree with it." (Challenge the user's hunch).

  2.  **Deconstruct the Impasse:**
      *   *The Stalemate:* Both sides agree on the *phenomenology* of moral reasoning (cases look holistic) and likely the *extension* of moral truths (same verdicts on cases).
      *   *The Clash:* It's about *explanation* and *structure*.
      *   *User's Hunch:* It's pragmatic/functional (what is a principle *for*?).
      *   *My Critique:* While functional differences exist, dismissing it as *merely* verbal or functional misses a deeper metaphysical commitment regarding the *nature of normative properties*.

  3.  **Evaluate the "Functional Disagreement" Hunch:**
      *   *Strengths:* It explains why they talk past each other. Generalists want subsumption under laws; Particularists want sensitivity to nuance.
      *   *Weaknesses:* It assumes the metaphysics is settled. But if principles are constitutive of moral properties (as some Generalists think), then the function *is* the metaphysics. If Particularists think moral properties supervene on non-moral ones without bridge laws, that's a metaphysical claim, not just a functional one.
      *   *Pushback:* The user says they aren't disagreeing about moral facts. But are they disagreeing about *supervenience*? Dancy (arch-particularist) accepts supervenience but denies explainability via principles. Generalists often think explainability is required for supervenience to be intelligible. So there *is* a metaphysical disagreement about the structure of reality, not just the utility of rules.

  4.  **Evaluate the Colleague's "Self-Adjusting Principle":**
      *   *Idea:* A principle $P$ says "Feature $F$ contributes $x$ amount/value, where $x$ is a function of context $C$."
      *   *Is it a trick?* It sounds like a mathematical function $f(c)$.
      *   *Particularist Objection:* If the function is infinitely complex or non-projectible, it's not a principle, it's a lookup table.
      *   *Generalist Defense:* A function is still a generalization.
      *   *Verdict:* This is essentially the "Hedged Principle" strategy rebranded. It doesn't solve the "cheating" accusation unless the function itself is simple/finite. If the function is as complex as the cases, it's trivial.

  5.  **Diagnosing the Impasse (The Core Analysis):**
      *   *Is it Verbal?* Partly. "Principle" is doing too much work.
      *   *Is it Metaphysical?* Yes. It's about *grounding*. Do general truths ground particular verdicts, or do particular verdicts exhaust the truth?
      *   *Hidden Assumption:* The Generalist assumes that *intelligibility requires subsumption*. The Particularist assumes that *holism precludes codification*.
      *   *The "Cheating" Charge:* This is the crux. It's about *explanatory power* vs. *truth conditions*. A hedged principle is *true* but *explanatorily idle*.

  6.  **Developing the "Pushback" on the User's Hunch:**
      *   User says: "They disagree about what a principle is for."
      *   Pushback: No, they disagree about whether moral reality *has* a structure that principles can latch onto independently of the cases. It's not just utility; it's ontology.
      *   If Generalists are right, there is a "moral law" structure. If Particularists are right, moral reality is more like aesthetic judgment (case-by-case).
      *   Therefore, it's not just functional; it's about the *architecture of normativity*.

  7.  **Addressing the Colleague's Twist:**
      *   "Self-adjusting principles."
      *   This sounds like *contextualist generalism* (e.g., McNaughton & Rawling).
      *   Is it a third position? It's a sophisticated Generalism.
      *   Does it satisfy Particularists? No, because the "adjustment" mechanism is usually the holistic context itself. If the principle says "Do what is right," and "right" is determined holistically, the principle is empty.
      *   It's a verbal trick *if* the adjustment function is just "whatever the particularist says it is." It's substantive *if* there's a finite algorithm for the adjustment. (Spoiler: There probably isn't).

  8.  **Proposing Paths to Progress:**
      *   *Distinction:* Separate *Subsumptive Generalism* (principles explain verdicts) from *Supervenience Generalism* (principles just track supervenience).
      *   *Case:* Need a case where a hedged principle fails to guide *action* even if it's true. (The "Guidance" objection).
      *   *Formal Result:* Look at non-monotonic logic. Holism looks like defeasible reasoning. Generalists want monotonic logic with infinite premises. Particularists want non-monotonic logic. Formalizing this might show the Generalist position is computationally intractable, which supports the Particularist "cheating" claim.
      *   *Shift the Question:* Move from "Are there principles?" to "What is the epistemic role of principles?"

  9.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Academic, rigorous, challenging but constructive.
      *   *Structure:*
          1.  Validate the hunch but push back (it's deeper than function).
          2.  Diagnose the impasse (Explanatory vs. Truth-Conditional).
          3.  Analyze the Colleague's Twist (The "Function" Objection).
          4.  Propose Progress (Formal/Epistemic shifts).
      *   *Key Concept:* The "Triviality Threat." If a principle includes all exceptions, is it still a principle?
      *   *Key Concept:* "Grounding." Generalists think general truths ground particular ones. Particularists think the reverse (or no grounding relation).

  10. **Refining the "Pushback":**
      *   User: "They disagree about what a principle is for."
      *   Me: "That's the surface. Deep down, they disagree on whether the 'for' is even possible. If the Particularist is right, a principle *cannot* codify contributions because there *are* no stable contributions to codify. It's not a choice of function; it's a denial of the object."
      *   This challenges the user's idea that the moral facts are agreed upon. If reasons are holistic, the "fact" of a reason's force is case-relative. Generalists deny this relativity at the fundamental level.

  11. **Final Polish:** Ensure I address the "self-adjusting" point clearly. It's basically a *ceteris paribus* clause on steroids. If the adjustment rule is finite, it's Generalism. If infinite, it's Particularism in disguise.

  12. **Check against constraints:** Did I push on the hunch? Yes. Did I diagnose the impasse? Yes. Did I suggest progress? Yes.

  *(Self-Correction during drafting)*: I need to be careful not to just repeat Dancy vs. Hooker. The user knows that. I need to focus on the *meta-debate* about the debate itself. The user asks if it's verbal/functional vs substantive. I need to argue it's substantive *disguised* as functional.

  *(Final thought on the Colleague's twist)*: The "self-adjusting" idea sounds like *variable value* views. I should mention that if the adjustment rule is not specifiable finitely, it collapses into particularism. If it is specifiable, it's just complex generalism. The "trick" is hiding the complexity in the word "adjusting."

