answer: |-
  # The "What-Is-Life" Decision Tree

  This tree is built from the logical tensions in the debate (History vs. State, Individual vs. Lineage, Substrate vs. Function) rather than starting from named theories. Follow the path that matches your intuitions about the cases to find your position.

  ### **Node 1: The Thermodynamic Boundary (Fire vs. Spore)**
  **Case:** A campfire consumes fuel, grows, and spreads. A bacterial spore consumes no fuel, does not grow, and waits. When fuel appears, the fire spreads; when nutrients appear, the spore wakes.
  **Question:** If you say the spore is *alive* but the fire is *not*, is it because the fire is too easy to construct from scratch (complexity/history), or because the fire has no condition where things can go "wrong" for it (teleology)?
  *   **A.** Fire is just physics; life requires a "good/bad" condition. → **Go to Node 2.**
  *   **B.** Fire is a dissipative structure; if it maintains itself against entropy, it counts. → **Leaf 1.**
  *   **C.** The distinction is premature; we lack the theory to judge either. → **Leaf 2.**

  ### **Node 2: The Unit of Life (Mule vs. Lichen)**
  **Case:** A mule is a cohesive individual that maintains itself but cannot reproduce. A lichen is a cohesive individual made of two species that *can* reproduce.
  **Question:** If the mule is alive, is life a property of the *self-maintaining individual* (even if sterile), or is it a property of the *reproducing lineage* (making the individual secondary)?
  *   **A.** The individual matters; self-maintenance is enough. → **Go to Node 3.**
  *   **B.** The lineage matters; without descent, you are just a complex machine. → **Go to Node 4.**

  ### **Node 3: The Boundary Problem (Minimal Bacterium vs. Virion in Host)**
  **Case:** A stripped-down lab bacterium dies without exact feeding. A virion inside a host replicates using the host's machinery. Both are highly dependent.
  **Question:** If the bacterium is alive and the virion is not, is the difference that the bacterium holds a *physical boundary* (membrane) the virion lacks, or that the bacterium runs its own *energy processing* (metabolism) the virion lacks?
  *   **A.** The physical boundary (closure) is what makes it a unit. → **Leaf 3.**
  *   **B.** The energy processing (flux) is what makes it a unit. → **Leaf 4.**

  ### **Node 4: The State of the Lineage (Virion on Bench vs. Transposon)**
  **Case:** A virion on a bench is inert. A transposon shuffles copies of itself within a genome. Both are genetic material that replicates only within a larger system.
  **Question:** If the transposon is "alive" (as genetic life) but the bench-sitting virion is not, is life a *state* the entity enters when replicating, or is the virion *never* alive because it is merely a part of the host system?
  *   **A.** It is a state; the virion becomes alive when it infects. → **Leaf 5.**
  *   **B.** It is a system; only the host population is truly alive. → **Go to Node 5.**

  ### **Node 5: The History/Chemistry Split (Prion vs. Shadow Biosphere)**
  **Case:** A prion replicates by reshaping proteins (no nucleic acid, low construction complexity). A shadow biosphere organism uses mirror-image lipids (high complexity, wrong chemistry).
  **Question:** If you exclude the prion but include the shadow organism, is life defined by a *threshold of construction difficulty* (improbable without selection), or by *chemical continuity* with Earth's specific evolutionary history (lipid linkages/DNA)?
  *   **A.** Construction difficulty; the prion is too cheap to make. → **Leaf 6.**
  *   **B.** Chemical continuity; the shadow organism lacks the right ancestry. → **Leaf 7.**

  ***

  ## The Leaves (Positions)

  **Leaf 1: Unnamed (Dissipative Structure)**
  *   **Commitment:** Fire, hurricanes, and stars are alive because they maintain order by dissipating energy.
  *   **Awkward Commitment:** The word "life" loses all distinction from "physics," making biology just applied thermodynamics.

  **Leaf 2: Theoretical Placeholder**
  *   **Commitment:** We cannot define life yet because the definition must emerge from a completed theory of biological organization.
  *   **Awkward Commitment:** We cannot identify life if we meet it (e.g., in a shadow biosphere) until the theory is finished, making the search circular.

  **Leaf 3: Autopoietic Closure**
  *   **Commitment:** Life is a system that produces and maintains its own boundary (membrane) distinct from the environment.
  *   **Awkward Commitment:** A permanently sterile species is fully alive, but a replicating virus is not, prioritizing boundaries over evolution.

  **Leaf 4: Metabolic Flux**
  *   **Commitment:** Life is defined by the continuous flow of energy and matter through a network of chemical reactions.
  *   **Awkward Commitment:** Hard to distinguish from Leaf 3; implies a cell that stops moving ions for a second ceases to be alive, even if structurally intact.

  **Leaf 5: Unnamed (State Realism)**
  *   **Commitment:** "Alive" is a transient phase like "digestible"; the virion is alive only while actively replicating.
  *   **Awkward Commitment:** An organism frozen in liquid nitrogen ceases to be alive and becomes alive again upon thawing, treating life as a mode rather than a kind.

  **Leaf 6: Historical Complexity Threshold**
  *   **Commitment:** Life requires a minimum information threshold that implies a long history of selection (excludes prions/fire).
  *   **Awkward Commitment:** A perfect copy of a bacterium created instantly by a god is *not* alive because it lacks the historical causal chain of its construction.

  **Leaf 7: Terrocentric Biochemistry**
  *   **Commitment:** Life is defined by specific chemical continuity (e.g., ester-linked lipids, DNA) inherited from the Last Universal Common Ancestor.
  *   **Awkward Commitment:** An organism with mirror-image membranes that eats, breathes, and evolves is *not* life, defining biology by Earth's accidental chemistry rather than function.

  ***

  ## Logical Space Analysis

  ### Indistinguishable Leaves
  **Leaf 3 (Autopoiesis) and Leaf 4 (Metabolism)** are flagged as difficult to separate. In almost every concrete case (bacterium, spore, lichen), a system that maintains its own boundary also runs its own metabolism. The tree forces a choice at Node 3, but in practice, these positions converge on the same classifications. They only come apart in edge cases like a liposome (boundary, no metabolism) or a continuous flow reactor (metabolism, no boundary), neither of which are standard "organism" cases.

  ### Unoccupied Logical Space
  There is a combination of answers that yields no leaf: **Fire = Alive + Individual Unit.**
  If you choose **Node 1B** (Fire is alive), the tree terminates at Leaf 1. There is no path to argue that Fire is alive *but* that it must also satisfy the Mule/Lichen individuality constraint (Node 2). This space is unoccupied because Process Thermodynamics (Leaf 1) generally rejects the "individual" constraint entirely, viewing life as a universal physical process rather than a countable set of individuals.

  ### The "Theory Move" Placement
  The **Theoretical Placeholder (Leaf 2)** is accessible at the root. This reflects the strategic position that the debate is premature. It refuses to answer *any* of the cases (Fire, Spore, Virus, etc.) not because it lacks an opinion, but because it rejects the methodology of defining via intuition pumps. It treats the word "life" as a variable $X$ in an equation we haven't solved yet.

  ### The Membrane Constraint
  **Node 5** incorporates the specific biochemistry constraint. It uses the bacterial/archaeal membrane divergence to test whether "Life" requires *our* history (Leaf 7) or just *a* history of sufficient complexity (Leaf 6). This prevents the "Shadow Biosphere" case from being a trivial win for functionalists; they must decide if function alone suffices or if the specific lipid linkage matters.
