answer: |-
  # Decision Tree: Animal Phenomenal Consciousness

  **Q1. Is there a determinate fact of the matter about whether an animal is conscious, independent of our attribution practices?**
  *   **No** → **Deflationary View**
      *   *Awkward Commitment:* Welfare policy is ultimately a projection of human values rather than a response to animal facts.
  *   **Yes** → Go to Q2.

  **Q2. Are these facts empirically accessible to investigation, or do they lie beyond our evidential reach?**
  *   **Inaccessible** → **Epistemic View**
      *   *Awkward Commitment:* We must legislate protection despite knowing we can never confirm if we are right.
  *   **Accessible** → Go to Q3.

  **Q3. Is consciousness a binary threshold property (on/off) or does it vary along continuous dimensions (richness, unity, etc.)?**
  *   **Continuous/Dimensional** → **Graded View**
      *   *Awkward Commitment:* Policy requires drawing arbitrary lines on a continuum where no natural boundary exists.
  *   **Binary Threshold** → Go to Q4.

  **Q4. Is attribution based on substantive neurocognitive theory or on minimal functional/behavioral markers?**
  *   **Minimal Markers** → **Minimal Integrative View**
      *   *Awkward Commitment:* Even very simple systems with basic feedback loops might qualify for welfare protection.
  *   **Neurocognitive Theory** → Go to Q5.

  **Q5. Does phenomenal consciousness necessarily imply valenced experience (good/bad feel) within a single unified subject?**
  *   **No (Separable or Fragmented)** → **Non-Standard Phenomenology View**
      *   *Awkward Commitment:* We may need to protect animals that feel nothing or count multiple welfare subjects within one body.
  *   **Yes (Valenced & Unified)** → Go to Q6.

  **Q6. What is the minimum sufficient physical substrate for consciousness?**
  *   **Layered Neocortex** → **Cortex-Only View**
      *   *Awkward Commitment:* Newborn humans and all birds lack moral status until cortical maturation or evolution occurs.
  *   **Cortex or Functional Pallium** → **Bird-Pallium View**
      *   *Awkward Commitment:* Fish and reptiles lack moral status despite sharing ancient vertebrate lineages with birds.
  *   **Conserved Midbrain/Brainstem (Vertebrates only)** → **Vertebrate-Midbrain View**
      *   *Awkward Commitment:* Octopuses and crabs are excluded despite complex behavior and distinct nervous systems.
  *   **Midbrain plus Cephalopod Analogues** → **+Cephalopod View**
      *   *Awkward Commitment:* Insects and crustaceans are excluded despite sharing arthropod lineage and complex social behaviors.
  *   **Midbrain plus Arthropod Ganglia** → **+Arthropod View**
      *   *Awkward Commitment:* Moral status extends to insects but may still exclude nematodes or jellyfish without clear justification.

  ***

  # Analysis of Logical Space

  ### Unreachable Combinations
  | Combination | Status | Reason |
  | :--- | :--- | :--- |
  | **Deflationary + Cortex-Only** | Incoherent | If there is no determinate fact, no specific anatomy can determine the truth. |
  | **Epistemic + Cortex-Only** | Incoherent | If facts are inaccessible, we cannot empirically tie them to specific cortical structures. |
  | **Graded View + Binary Threshold** | Incoherent | Contradictory definitions of the property's ontology. |
  | **Minimal Integrative + Cortex-Only** | Incoherent | One relies on functional markers, the other on specific mammalian anatomy. |
  | **Vertebrate-Midbrain + Bird-Pallium** | Unattractive | Redundant; if midbrain is sufficient, pallium is not a necessary constraint for birds. |

  ### Indistinguishable Leaves (in Practice)
  | Pair of Leaves | Reason for Overlap |
  | :--- | :--- |
  | **Vertebrate-Midbrain vs. +Cephalopod** | In a zoo without cephalopods, policy outcomes are identical (all vertebrates protected, inverts excluded). |
  | **+Cephalopod vs. +Arthropod** | In an aquarium without crustaceans/insects, policy outcomes are identical (vertebrates + octopus protected). |
  | **Bird-Pallium vs. Vertebrate-Midbrain** | If the committee accepts birds have a pallium *and* fish have a midbrain, the dispute only matters for reptiles/amphibians depending on pallium homology. |

  ### Application Table
  *Entries indicate the status of the case according to the view.*

  | View | Honeybee | Octopus | Trout | Newborn Infant | Decorticate Mammal | Anesthetized Animal |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Deflationary** | Indeterminate | Indeterminate | Indeterminate | Indeterminate | Indeterminate | Indeterminate |
  | **Epistemic** | Indeterminate | Indeterminate | Indeterminate | Indeterminate | Indeterminate | Indeterminate |
  | **Graded** | Conscious (Low) | Conscious (Med) | Conscious (Med) | Conscious (Low) | Conscious (Low) | Not Conscious |
  | **Minimal Integrative** | Conscious | Conscious | Conscious | Conscious | Conscious | Not Conscious |
  | **Non-Standard Phenom.** | Indeterminate | Indeterminate | Indeterminate | Indeterminate | Indeterminate | Indeterminate |
  | **Cortex-Only** | Not Conscious | Not Conscious | Not Conscious | Indeterminate | Not Conscious | Not Conscious |
  | **Bird-Pallium** | Not Conscious | Not Conscious | Not Conscious | Conscious | Not Conscious | Not Conscious |
  | **Vertebrate-Midbrain** | Not Conscious | Not Conscious | Conscious | Conscious | Conscious | Not Conscious |
  | **+Cephalopod** | Not Conscious | Conscious | Conscious | Conscious | Conscious | Not Conscious |
  | **+Arthropod** | Conscious | Not Conscious | Conscious | Conscious | Conscious | Not Conscious |

