prompt: |-
  In a graduate seminar on the philosophy of the human sciences, a colleague disposed of evolutionary psychology in a single comparison: its hypotheses, she said, are Just So Stories. She had in mind Kipling's 1902 collection, in which the camel gets its hump because it refused to work and the leopard gets its spots because an Ethiopian painted them, and she drew a strong conclusion from the parallel -- that adaptationist hypotheses are, like those tales, satisfying narratives wearing the costume of explanation, that they can be fitted to any observation after the fact, and that they therefore do not qualify as science. The label, in her usage, is meant to do the argumentative work by itself rather than merely to sting.

  I want an audit of the analogy, not another verdict on the field. Begin with the correspondence: set out what in the source -- the fables' causal mechanism, their audience, their purpose, their relation to evidence, the child who demanded them word for word, the very fact that they are stories -- is supposed to map onto what in the target, taking the target to be a specific hypothesis of the sort she means, such as that the mind contains a cheater-detection module or that men and women evolved divergent tastes for casual sex. Then locate where the mapping strains, and separate the disanalogies that matter for her conclusion from those that are merely decorative. I am particularly interested in whether the comparison trades on conflating two different charges -- that an explanation has the form of a narrative, and that it is unfalsifiable -- and whether the fables' being fiction by design, so that their failure to be true is no defect at all, undercuts the use to which she puts them. Consider whether the same accusation can be turned back on the critique itself, and what would serve as a better analogy for whatever is genuinely wrong with a bad adaptationist hypothesis. Close by saying what, if anything, of her conclusion survives once the disanalogies are on the table.
reasoning: |-
  Here's a thinking process that leads to the essay above:

  1.  **Analyze the Request:**
      *   **Topic:** An audit of the analogy between Evolutionary Psychology (EP) hypotheses and Kipling's *Just So Stories*.
      *   **Context:** A graduate seminar in the philosophy of the human sciences.
      *   **Colleague's Claim:** EP hypotheses are "Just So Stories" (satisfying narratives, fitted after the fact, not science).
      *   **Task:**
          *   Begin with the correspondence (map source features to target features).
          *   Locate where the mapping strains (disanalogies).
          *   Separate significant disanalogies from decorative ones.
          *   Investigate if the critique conflates "narrative form" with "unfalsifiability."
          *   Consider if the fables being *designed fiction* undercuts the critique.
          *   Consider if the accusation can be turned back on the critique (reflexivity).
          *   Suggest a better analogy for bad adaptationism.
          *   Conclude on what survives of the colleague's conclusion.
      *   **Tone:** Philosophical, analytical, precise, academic but accessible (seminar style).
      *   **Constraint:** Do not issue a verdict on the field of EP itself; audit the *analogy*.

  2.  **Deconstruct the Source (Kipling's *Just So Stories*):**
      *   *Causal Mechanism:* Whimsical, anthropomorphic, magical, intentional (e.g., an Ethiopian painting a leopard).
      *   *Audience:* Children (specifically his daughter, Josephine, who demanded them "just so").
      *   *Purpose:* Entertainment, moral instruction, soothing, imaginative engagement.
      *   *Relation to Evidence:* None required; internal consistency matters more than external truth.
      *   *Status:* Fiction by design. Truth is irrelevant.
      *   *Form:* Narrative/Story.

  3.  **Deconstruct the Target (EP Hypotheses):**
      *   *Causal Mechanism:* Natural selection, genetic variation, reproductive success, environmental pressure.
      *   *Audience:* Peers, scientists, the public.
      *   *Purpose:* Explanation, prediction, integration with biology/psychology.
      *   *Relation to Evidence:* Supposed to be constrained by data (fossil record, cross-cultural studies, primatology, genetics).
      *   *Status:* Claims to be empirical science (truth-apt).
      *   *Form:* Often narrative-like (reconstruction of past environments), but formalized in models.
      *   *Examples:* Cheater-detection module, divergent sexual strategies.

  4.  **Map the Correspondence (The Colleague's View):**
      *   *Narrative Form:* Both tell a story about how something came to be.
      *   *Post Hoc Fitting:* Both can be tailored to fit the observed outcome (the hump exists -> camel was lazy; spatial ability exists -> men hunted).
      *   *Satisfaction:* Both offer a pleasing sense of closure/understanding.
      *   *Unfalsifiability (Alleged):* Hard to prove the specific historical path wrong.

  5.  **Identify Strains and Disanalogies:**
      *   *Intent:* Kipling knew he was lying; EP scientists claim they are hypothesizing truth.
      *   *Constraints:* Kipling is constrained only by imagination; EP is constrained by evolutionary theory, phylogeny, and current data.
      *   *Mechanism:* Magic vs. Natural Selection.
      *   *Fiction vs. Fact:* This is crucial. Calling something a "story" implies fiction. Calling a hypothesis a "story" implies it *might* be false, but the label "Just So" implies it *cannot* be true.

  6.  **Analyze the Conflation (Narrative vs. Unfalsifiability):**
      *   Does having a narrative structure make something unscientific? No (history, geology, cosmology use narratives).
      *   The real charge is *unfalsifiability* (can't test the past).
      *   The analogy hides the technical charge behind a literary insult.

  7.  **Reflexivity (Turning the Accusation):**
      *   Is the critique itself a "Just So Story"? It constructs a narrative about EP scientists (they are storytellers, not scientists) to explain away their claims.
      *   Does it fit the data (that EP produces some bad papers)? Yes.
      *   Is it unfalsifiable? Hard to prove EP *never* produces science.

  8.  **Better Analogies:**
      *   If the problem is *post hoc* rationalization without prediction: Ptolemaic epicycles (adding complexity to save the phenomenon).
      *   If the problem is *lack of evidence*: Phrenology (mapping function to structure without mechanism).
      *   If the problem is *oversimplification*: Homunculus (little man inside).
      *   *Best fit:* Paleontology before radiometric dating? Or perhaps "Ad Hoc Hypotheses" in Lakatos's sense. Let's go with *Ptolemaic Epicycles* or *Phrenology* for specific bad instances, but acknowledge that *Historical Reconstruction* (like cosmology) is the neutral analogy.

  9.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. Acknowledge the potency of the label. State the purpose: audit the analogy, not the science.
      *   **The Mapping (Correspondence):** Detail how the colleague sees the parallel. Focus on *post hoc* explanation, narrative satisfaction, and the difficulty of accessing the past (Pleistocene). Use the specific examples (cheater detection, sexual strategies).
      *   **The Strain (Disanalogies):**
          *   *Fiction vs. Claim to Truth:* Kipling doesn't care about truth; EP does. This is the biggest break.
          *   *Constraints:* EP is bound by evolutionary theory (costs, benefits, phylogeny). Kipling is bound by rhythm and rhyme.
          *   *Mechanism:* Magic vs. Selection.
      *   **The Conflation:** Distinguish "Narrative" from "Unfalsifiable." Science often uses narratives (origin of the universe). The insult works because "story" implies "made up."
      *   **Reflexivity:** Does the critique suffer the same flaw? It creates a narrative about EP to dismiss it. It risks being a "Just So Critique."
      *   **Better Analogies:** Propose *Epicycles* (saving the phenomenon) or *Phrenology* (localizing function without evidence).
      *   **Conclusion:** What survives? The warning against *unconstrained speculation* survives. The dismissal of the *entire field* as non-science does not survive the audit.

  10. **Refining and Polishing:**
      *   *Tone Check:* Ensure it sounds like a philosophical audit. Use terms like "truth-apt," "post hoc," "disanalogy," "epistemic status."
      *   *Specifics:* Make sure to mention the camel/leopard and the cheater/sex examples as requested.
      *   *Clarity:* Ensure the distinction between "bad EP" and "EP as a whole" is clear, as the colleague's critique generalizes.
      *   *Self-Correction during drafting:* I need to make sure I don't defend EP too vigorously. The prompt asks to audit the *analogy*, not vindicate the field. I must remain neutral on the science while analyzing the rhetoric.
      *   *Key Insight:* The "Just So" label is a *category mistake* regarding the intent of the speaker (fiction vs. science).

  11. **Final Review against Prompt:**
      *   Audit the analogy? Yes.
      *   Begin with correspondence? Yes.
      *   Map source to target (mechanism, audience, purpose, evidence, story status)? Yes.
      *   Locate strains? Yes.
      *   Separate mattering disanalogies? Yes.
      *   Conflate narrative/unfalsifiable? Yes.
      *   Fiction by design undercut? Yes.
      *   Turn back on critique? Yes.
      *   Better analogy? Yes.
      *   Close with what survives? Yes.

  12. (Proceed to generate output based on these thoughts.)
answer: |-
  The label "Just So Story" is a rhetorical grenade. In the context of your seminar, it was thrown not to illuminate the methodology of evolutionary psychology (EP) but to detonate its epistemic status. To audit this analogy is to examine the fuse and the shrapnel, rather than the target it struck. We must treat Kipling's fables as the *source* domain and adaptationist hypotheses (like the cheater-detection module or divergent sexual strategies) as the *target* domain, tracing the mapping your colleague intends and then testing its structural integrity.

  ### The Correspondence

  Your colleague's analogy relies on a specific mapping of features from Kipling's *Just So Stories* to evolutionary psychology.

  1.  **Causal Mechanism:** In Kipling, the mechanism is whimsical agency: the Elephant's child gets his trunk because a Crocodile pulled it; the Leopard gets spots because an Ethiopian painted him. In the target, the mechanism is natural selection acting on variation. The mapping here posits that both mechanisms function as *deus ex machina* devices. Just as the Ethiopian's paintbrush explains the spots without biological constraint, the "Environment of Evolutionary Adaptedness" (EEA) is treated as a magical canvas where any trait can be painted on by the brush of "survival value."
  2.  **Relation to Evidence:** Kipling's tales are unconstrained by empirical data; they are constrained only by the existing phenotype (the camel has a hump, so the story must explain a hump). The colleague maps this onto EP hypotheses that begin with an observed psychological trait (e.g., men prefer younger mates) and construct a historical scenario to justify it. The charge is that the evidence (the trait) is the only fixed point; the explanation is fluid.
  3.  **Narrative Form:** Both are stories. They have a beginning (ancestral state), a middle (selection pressure), and an end (current adaptation). They offer narrative satisfaction—a sense of "aha, that makes sense"—which the colleague argues mimics understanding without providing it.
  4.  **Temporality and Access:** Kipling's stories explain origins in a mythic past. EP hypotheses explain origins in the Pleistocene. In both cases, the witness is absent. The mapping suggests that because we cannot time-travel to verify the Camel's laziness, we cannot verify the hunter-gatherer division of labor, rendering both equally speculative.
  5.  **Purpose and Audience:** Kipling wrote for a child (his daughter Josephine) who demanded the stories be told "just so," valuing consistency and charm over truth. The colleague maps this onto the scientific community, suggesting EP researchers tell these stories to satisfy a professional audience's demand for coherent narratives, prioritizing theoretical elegance over empirical rigor.

  ### The Strain: Disanalogies

  The analogy holds together only if we ignore the fundamental differences in intent and constraint. When we press on the mapping, three critical strains appear.

  **1. Fiction by Design vs. Truth-Apt Claims**
  The most significant disanalogy is the ontological status of the utterance. Kipling's stories are *fiction by design*. Their failure to correspond to reality is not a defect; it is a feature. If a biologist proved camels got humps from fat storage rather than laziness, Kipling's story is not falsified; it is simply categorized as fantasy.
  EP hypotheses, however, are *truth-apt claims*. They assert that a specific causal history actually occurred. When an EP researcher proposes a cheater-detection module, they are not offering a soothing bedtime story; they are making a wager against reality. The colleague's analogy trades on this ambiguity: it uses the label "story" (implying fiction) to critique the *method* (implying failed science). By calling it a Just So Story, she implies the researcher *knows* it is fiction but presents it as fact. This attributes a dishonesty to the target that does not exist in the source. Kipling never pretended to be a biologist; the EP researcher pretends to be nothing other than a scientist.

  **2. Constraints on Imagination**
  Kipling's mechanism is unlimited imagination. The Ethiopian can paint the leopard because Kipling wills it. In EP, the "story" is constrained by evolutionary theory. A hypothesis about sexual strategies must align with parental investment theory, genetic heritability estimates, and cross-species comparisons. It must be energetically plausible. If a hypothesis suggests a trait evolved that cost more energy than it returned, it is rejected by the peer review process. Kipling's Camel faces no such energy budget; he simply *gets* a hump. The mapping strains here because the target is bound by a rigorous theoretical framework (natural selection) that acts as a filter, whereas the source is bound only by rhythm and rhyme.

  **3. Predictive Power**
  Kipling's stories are purely retrodictive; they explain what is already seen. They generate no new predictions. Good EP hypotheses, while often historical, are required to generate novel predictions. If the cheater-detection module exists, it should be triggered by specific logical structures (like the Wason selection task) but not by equivalent abstract problems. If men evolved a preference for youth, it should manifest cross-culturally but vary predictably with resource scarcity. While bad EP may fail here, the *ideal* target of the critique includes these predictive commitments. Kipling has no such ideal.

  ### The Conflation: Narrative vs. Unfalsifiability

  The potency of the colleague's critique relies on conflating two distinct charges: that an explanation has the **form of a narrative**, and that it is **unfalsifiable**.

  History, geology, and cosmology all rely on narrative structures to explain singular past events (the Big Bang, the formation of the Grand Canyon). We do not dismiss cosmology as "Just So Stories" simply because we cannot recreate the universe in a lab. We accept them because they are constrained by physical laws and leave observable traces (background radiation, strata).

  The colleague uses the literary connotation of "story" (made up, imaginative) to smuggle in the scientific charge of "unfalsifiable." But a narrative is not inherently unfalsifiable. The disanalogy that matters for her conclusion is not the narrative form, but the **independence of the evidence**. In Kipling, the evidence (the spots) is the only input for the story. In science, the story must predict *other* evidence (neural pathways, hormonal correlates). If the critique is that EP hypotheses are *under-constrained* by evidence, that is a valid technical objection. But wrapping it in the "Just So" label suggests the problem is the *storytelling* itself, rather than the *lack of independent verification*.

  ### Reflexivity: The Critique as Just So Story

  It is worth asking whether the accusation can be turned back on the critique itself. The colleague's argument constructs a narrative: "EP researchers are like Kipling." It fits the observation (EP produces papers with historical explanations) and offers a satisfying conclusion (therefore, they are not scientists).
  Is this critique falsifiable? If an EP researcher produces a hypothesis that is rigorously tested and confirmed, does the critique retreat? Often, the "Just So" label is applied preemptively to the *approach* rather than specific instances. It functions as a shield against engagement: "I don't need to test your hypothesis because the *genre* is invalid."
  In this sense, the critique risks becoming a Just So Story about science itself: it explains away a body of work by fitting it into a pre-existing narrative of "pseudoscience" without engaging with the specific mechanistic constraints the field claims to uphold. It is a story about storytellers, told to satisfy an audience of skeptics.

  ### A Better Analogy

  If we wish to isolate what is genuinely wrong with *bad* adaptationist hypotheses (those that are indeed post hoc and unconstrained), the Kipling analogy is too blunt. It dismisses the intent to be scientific.

  A more precise analogy is **Ptolemaic Epicycles**.
  In the Ptolemaic system, when a planet's motion didn't fit the model, astronomers added a circle-upon-a-circle (an epicycle) to make the math work. This is analogous to an EP researcher observing a behavior and adding a specific "module" or "adaptive pressure" to make the theory fit the data.
  *   **Correspondence:** Like epicycles, bad adaptationism saves the phenomenon without improving the underlying model's predictive power. It adds complexity to accommodate anomalies rather than risking falsification.
  *   **Advantage:** Unlike Kipling, epicycles were intended as serious science. They were mathematical, constrained by observation, and truth-apt. They failed not because they were "stories," but because they were *ad hoc* adjustments that lacked independent causal grounding.
  *   **Relevance:** This captures the methodological sin of *post hoc* rationalization without impugning the scientist's integrity or confusing fiction with hypothesis.

  Alternatively, **Phrenology** serves well for the localization of function. Phrenologists mapped mental faculties to skull bumps based on theory rather than neural evidence. Similarly, EP sometimes maps complex social behaviors to "modules" without neural or genetic evidence. This highlights the gap between functional speculation and structural evidence, which is the actual vulnerability of the field.

  ### What Survives the Audit

  Once the disanalogies are placed on the table, what remains of your colleague's conclusion?

  The claim that EP "does not qualify as science" does not survive. The disanalogy of intent (fiction vs. truth-apt) and the existence of theoretical constraints (selection pressures, phylogeny) protect the field from total dismissal. Science often deals with unobservable pasts; that does not make it mythology.

  However, a refined warning does survive. The "Just So" label, stripped of its literary baggage, points to a genuine methodological hazard: **the ease of generating plausible narratives without independent evidence.**
  The analogy successfully highlights the risk of *confirmation bias* in historical reconstruction. It reminds us that a coherent story is not a proof. If an EP hypothesis explains the data but predicts nothing new, and if the "selection pressure" invoked is as unverifiable as the Ethiopian's paintbrush, then *that specific hypothesis* deserves the label.

  Your colleague's analogy is a category error regarding the field as a whole, but it functions as a valid heuristic for evaluating individual claims. It demands that researchers distinguish between a story that *could* be true (consistent with theory) and a story that *is* shown to be true (constrained by independent data). The "Just So" tag should not be a verdict on the discipline, but a yellow flag on the specific hypothesis: *Proceed with caution; ensure this narrative is tethered to evidence, or it is merely a fable.*
