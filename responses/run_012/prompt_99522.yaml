answer: |-
  **MEMORANDUM**

  **TO:** Continuing Education Programming Committee
  **FROM:** [Your Name], Undergraduate Committee Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Proposal: "Kepler's Astrology: The Science That Got Away"

  **Purpose**
  This memo addresses the split vote regarding the proposed six-week course on Kepler and astrology. Our task is not to adjudicate the validity of astrology—the committee accepts it lacks predictive power—but to determine whether offering this course aligns with the university's educational mission. I recommend we **approve the proposal subject to specific conditions** regarding title, description, and pedagogy.

  **Studying vs. Teaching a Practice**
  The committee's division stems from conflating *studying* a practice with *teaching* a practice. This distinction must drive our decision.
  *   **Studying a practice** treats the subject as an object of historical or cultural inquiry. It asks: *Why did people believe this? How did it function socially? What were its internal rules?* This is appropriate for a university setting.
  *   **Teaching a practice** treats the subject as a valid skill set for application. It asks: *How do I do this? How can this help me?* This implies institutional endorsement of the practice's efficacy.

  The current proposal blurs this line. By promising students they will "learn to interpret their own charts," it shifts from historical study to vocational training in a pseudoscience. We cannot sponsor the latter.

  **Historical Context: The Kepler Claim**
  The proposal's historical premise requires correction. The title implies astrology was a "science that got away," suggesting it was discarded arbitrarily rather than superseded by better models. Furthermore, describing the modern birth chart as a "legitimate descendant" of Kepler's work is historically tenuous.

  Kepler did practice astrology, primarily to secure patronage (notably from Wallenstein), but he was a reformer, not a traditionalist. He rejected the majority of traditional rules, including the significance of zodiacal constellations (e.g., the Lion or the Crab) and the ability to predict specific political events. He believed only in "aspects"—geometric angles between planets—and sought a physical, optical mechanism by which planetary light influenced the human soul or weather.

  While Kepler sought to make astrology *natural*, his specific physical mechanisms were incorrect, and his system is not the direct ancestor of the sun-sign astrology popular today. A course claiming to teach "Kepler's Astrology" as a viable modern system misrepresents both Kepler and the history of science. However, Kepler's struggle to separate mathematical astronomy from judicial astrology is a vital topic for historical study.

  **The Case for Declining**
  Those voting to decline hold a defensible position that must be respected. Their argument is not merely that astrology is false, but that the university's brand carries a stamp of approval. In a continuing-education catalog, the distinction between "credit-bearing academic inquiry" and "community enrichment" is often invisible to the public. Offering a course that culminates in students interpreting charts risks signaling that the university validates astrological guidance. Given the prevalence of misinformation, the committee has a duty to avoid platforms that may confuse the public about scientific consensus. If we cannot guarantee the course remains strictly historical, declining is the safer institutional choice.

  **Recommendation and Conditions**
  To preserve the educational value while mitigating reputational risk, I move to **approve subject to the following conditions**, which should be written into the instructor's contract:

  1.  **Catalog Category:** The course must be listed under **History of Science** or **Intellectual History**, not "Self-Help," "Spirituality," or "Skills."
  2.  **Title and Description:** The title must be changed to **"Kepler and the Stars: Astrology in the Scientific Revolution."** The description must remove the promise that students will learn to interpret their own charts. Instead, it must state that students will examine *how* Kepler interpreted charts within his historical context.
  3.  **Syllabus Requirements:** The syllabus must explicitly cover:
      *   The distinction between Kepler's "natural astrology" and traditional "judicial astrology."
      *   The development of heliocentric astronomy and why it undermined astrological mechanics.
      *   A final session contrasting Kepler's cosmological model with modern astronomical understanding.
  4.  **Individual Readings:** The instructor is **prohibited** from offering individual chart readings during class time or as part of the course fee. Discussion of student charts must be limited to analyzing them as historical artifacts, not providing guidance.
  5.  **Faculty Review:** The final syllabus must be reviewed and signed off by a faculty member from the History or Astronomy department to ensure historical accuracy.

  **General Criteria for Future Proposals**
  To establish precedent for similar borderline proposals (e.g., alchemy, humoral medicine), the committee should adopt the following standard:
  *   Courses on discredited sciences are permissible only if framed as **history**, not **practice**.
  *   Marketing materials must not imply the university endorses the efficacy of the subject matter.
  *   Instruction must include context regarding why the practice was superseded or rejected by modern science.

  By adopting these conditions, we honor Kepler's historical significance without compromising our commitment to scientific integrity.
