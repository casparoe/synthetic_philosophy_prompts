          *   *Co-instructor:* Maybe not required, but syllabus review by a historian is better. Let's say "Syllabus review by faculty historian."
          *   *Readings:* No individual readings in class.
          *   *Syllabus:* Must cover the scientific revolution context, Kepler's specific modifications, and modern scientific consensus.
      *   **General Criteria:** Establish a precedent for future "borderline" proposals (e.g., alchemy, homeopathy history).

  4.  **Refining the Content (Self-Correction/Polishing):**

      *   *Tone:* Professional, academic, decisive but respectful.
      *   *Length:* Keep it tight to fit two pages.
      *   *Kepler Details:* Ensure I don't paint him as a modern scientist. He believed in *astrologia*, but a reformed one. He rejected the *judicial* astrology of predicting specific events based on zodiac signs, favoring *natural* astrology (weather, general inclinations) based on geometric aspects. The course description claims modern birth charts are legitimate descendants; this is historically contentious and scientifically false. The description needs changing.
      *   *Distinction:* Make sure the "studying vs. teaching" distinction drives the conditions. If we teach them to interpret charts, we are *teaching practice*. If we teach them how *Kepler* interpreted charts, we are *studying history*.
      *   *Formatting:* Use bolding for key sections to make it skimmable for busy committee members.

  5.  **Drafting the Text (Mental or Scratchpad):**

