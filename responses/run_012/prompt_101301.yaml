      *   **Core Conflict:** Williams says reasons must hook onto the subjective motivational set (SMS). Guest speaker says there are reasons internal to a practice/role (norms bound by virtue of the role) that aren't reducible to SMS, even if the agent resents them. Friend argues role-internal reasons collapse into Williams-style internal reasons (e.g., desire to be good, keep license).
      *   **Task:** Compare the two notions of internality (Agent-Internal vs. Role-Internal). Evaluate whether the second collapses into the first. Test on a hard case (lawyer defending a guilty client despite no desire to do so). Explain the practical disagreement (not just verbal).
      *   **Format:** Continuous prose. No headings, bullet points, bold, or tables. Style of an email.

  2.  **Deconstruct the Philosophical Concepts:**
      *   **Williams' Internalism:** A reason statement 'A has a reason to $\phi$' is true only if A could reach the conclusion to $\phi$ by a sound deliberative route from their existing Subjective Motivational Set (SMS). If not, it's an external reason statement, which Williams thinks is false or misleading (really just advice/coercion).
      *   **Role/Practice Internalism (The Guest Speaker's View):** This sounds like a form of institutional normativity or perhaps a version of constitutive normativity (like MacIntyre's practices or Searle's institutional facts). The idea is that occupying a role generates norms that are "internal" to that role, regardless of the agent's psychology.
      *   **The Collapse Argument (The Friend's View):** This is the standard Humean/Williamsian rebuttal. To be motivated by a role-norm, you must desire to fulfill the role, or desire to avoid sanctions, or desire to maintain integrity. If you lack *all* such desires, the norm has no grip. Therefore, role-internal reasons are just a subset of agent-internal reasons.
      *   **The Hard Case:** The lawyer who knows the client is guilty, hates the client, doesn't care about the license, but still feels bound by zealous representation.
      *   **Practical Difference:** Does believing one view over the other change action? If Williams is right, the lawyer only acts if she finds a motivational hook. If Role-Internalism is right, the lawyer acts because the role demands it, and if she doesn't, she's irrational *qua* lawyer, even if psychologically unmotivated.

