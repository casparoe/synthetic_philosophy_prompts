answer: |-
  Hi there, it is completely understandable why you are fixated on this, and honestly, it is one of the most fruitful rabbit holes you can fall into during a metaethics module. You have hit on a genuine ambiguity in the word internal that often goes unnoticed until someone points it out, and your friend's objection is the standard Humean reply that most philosophers instinctively reach for. To get a handle on whether the guest speaker's distinction holds water or collapses, we need to look closely at what work we want the concept of a reason to do in the first place. When Williams talks about internal reasons, he is making a claim about the psychology of motivation and the explanation of action. For him, a reason must be capable of motivating the agent, which means it has to be anchored in something they already care about, their subjective motivational set. If there is no link to that set, there is no reason for them, only a reason for someone else to try to change their mind. The guest speaker, however, is using internal in a structural or constitutive sense. She is talking about norms that are internal to a practice, like the rules of chess or the ethics of medicine, which exist independently of whether any particular player or doctor cares about them. The clash here is between reasons as psychological levers and reasons as institutional facts.

  Your friend's argument that role-internal reasons secretly collapse into agent-internal reasons is powerful because it appeals to a certain common sense about human behavior. If a doctor feels bound by a duty to care for a patient, surely there is some desire in there, even if it is just a desire to avoid guilt, or to maintain a self-image as a professional, or to keep their license. If you strip away every single conative state, every desire and commitment, the friend argues, the duty evaporates because it has no grip on the agent. This is the Williamsian trap: if it cannot motivate, it is not a reason. However, the guest speaker's point is that this conflates the existence of a reason with the capacity to be motivated by it. She is suggesting that the normativity comes from the role itself, not the psychology of the role-player. To use a classic analogy, consider the rules of chess. There is a reason for a bishop to move diagonally that is internal to the practice of chess. If a player moves a bishop like a knight, they are making a mistake internal to the game, even if they personally desire to move it like a knight and do not care about winning. Your friend would say the only reason they have to move it diagonally is if they desire to play chess correctly. The guest speaker would say the reason exists because the game exists, and the player is either playing chess or they are not.

  This brings us to the hard case of the lawyer who is convinced her client is guilty and has no desire to help him, not even for the sake of her license or reputation. On the Williams view, if we truly stipulate that there is no element in her subjective motivational set that supports zealous representation, then she has no internal reason to defend him zealously. Any claim that she ought to do so is merely external pressure, perhaps from the bar association or society. If she walks away or throws the case, she is not irrational in the strict sense; she is just unmotivated. The Williamsian picture forces us to say that her obligation is contingent on her caring about being a lawyer. But this feels unsatisfying because it makes professional ethics entirely voluntary in a way that undermines the profession itself. If the duty to defend is only binding on those who desire to defend, then the concept of a professional duty loses its normative force and becomes a description of what motivated lawyers happen to do. The guest speaker's view preserves the intuition that the lawyer is failing something objective. She is bound by the role-internal reasons because she occupies the role. The reason is internal to the practice of law, and by stepping into the role, she subjects herself to those norms regardless of her fluctuating psychology.

  The crucial question you asked is about the practical difference, because if this is just a verbal dispute over the word internal, it is not worth losing sleep over. The difference emerges when we ask how we criticize the agent and what we think is wrong with their inaction. If Williams is right, the criticism of the lawyer is ultimately psychological or coercive. We say you should defend him because you want to keep your license, or because you want to be the kind of person who keeps promises. If she replies that she does not care about those things, the conversation ends. There is no further rational critique available. We can only threaten her or try to manipulate her desires. But if the guest speaker is right, there is a rational critique that survives even if she lacks the desire. We can say you are failing to recognize the reasons inherent in the position you hold. The criticism is not that you are unmotivated, but that you are mistaken about the normative landscape of your profession. This changes how we act because it changes the nature of ethical deliberation. Under the Williams view, deliberation is about digging into your own psychology to find a hook. Under the role-internal view, deliberation is about understanding the demands of the practice you are participating in.

  So, does the second view collapse into the first? I think it avoids collapse only if we are willing to accept that there are sources of normativity outside of individual psychology. Your friend assumes that for a reason to be real, it must be able to motivate a rational agent solely in virtue of their existing desires. This is a very specific, Humean theory of motivation. If you reject that theory, the collapse fails. The role-internal view is doing the real work if you believe that institutions, practices, and relationships generate obligations that are not reducible to the sum of the participants' preferences. In the case of the lawyer, the role-internal view captures something vital about social reality, which is that we are often bound by things we did not choose and do not currently desire, simply because of the positions we occupy. Williams is right that without a motivational hook, the reason won't explain action, but the guest speaker is right that the reason can exist even without the action. Ultimately, I think your friend is trying to solve a metaphysical problem with a psychological solution. She wants to know what makes a reason real, and she looks inside the mind. The guest speaker is looking inside the practice. For a third-year student, the most productive path is probably to acknowledge that Williams is explaining motivation, while the guest speaker is explaining obligation. They are talking past each other slightly, but if you have to choose which one preserves the integrity of professional ethics, the role-internal view is the stronger candidate, because it prevents morality from dissolving into mere preference management. I hope this helps clarify the tension, and it is a great spot to be in intellectually, so keep pushing on it.
