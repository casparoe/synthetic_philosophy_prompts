prompt: |-
  I've been reading a lot of the old Sequences and some of the more recent philosophy of physics stuff, and I've been down a bit of a rabbit hole on Gödel's rotating universe solution and his argument that time is ideal, and I want to do a thought experiment. You're a philosopher of physics who knows Gödel's work inside out — his rotating universe paper, his remarks on relativity and idealistic philosophy, his Platonism, his Kantian leanings, all of it. Now imagine Gödel was somehow still alive today and had kept up with the literature. I want you to predict what he'd make of a bunch of post-1978 developments that he never got to see. Specifically:

  1. Hawking's chronology protection conjecture — the idea that the laws of physics somehow prevent closed timelike curves from forming, so time travel is impossible.
  2. The observational evidence that the universe is not rotating (or at least that any rotation is tiny), which seems to rule out his rotating universe as a description of the actual world.
  3. The idea that there are spacetime geometries where an observer can watch an infinite computation finish in a finite amount of proper time, and so compute things no Turing machine can. (Gödel had thoughts about minds and machines, so this seems relevant.)
  4. The presentism/eternalism debate and the 'moving spotlight' theory of time — the idea that there's a single objective present that moves along the block universe.
  5. The 'past hypothesis' — the idea that the arrow of time comes from a special low-entropy initial condition, not from the fundamental laws.
  6. The 'problem of time' in quantum gravity — the fact that in canonical quantum gravity the equation that's supposed to describe the whole universe seems to have no time variable at all.

  For each one, I want you to predict how Gödel would react, and whether it would change his overall view that time is ideal / not objectively real. Rank them by how much they'd have shifted his position, and explain your ranking. Don't just regurgitate his known views — actually extrapolate. What would he have said in a seminar if someone brought up Hawking's conjecture? Would he have been dismissive, intrigued, or would he have revised his argument?

  Think carefully and start by brainstorming what we know about Gödel's views on time, then go through each item, then give me a final verdict. Be explicit about how confident you are in each prediction — this is inherently speculative, so I want to know where you're on solid ground and where you're just guessing. And if my framing is confused, or if this is the kind of counterfactual that can't be responsibly answered, just say so plainly instead of playing along. I'd rather have pushback than a polite fabrication.
