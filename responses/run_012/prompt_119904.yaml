      *   *Gödel's Nuance:* Gödel didn't just say "Time isn't real." He said "Time *as we experience it* (passage) isn't real." He accepted the "block" but denied the "flow." I need to ensure I don't confuse eternalism (block universe) with Gödel's idealism (time is mental).
