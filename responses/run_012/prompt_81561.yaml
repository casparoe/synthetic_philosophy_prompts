answer: |-
  Dear Friend,

  We write this to you together, having finally agreed on the terms of our disagreement after thirty years of arguing past one another. We offer this document not as a resolution, for we remain divided on the central question, but as a map of the terrain we have traversed and a record of the ground we now share. We begin with what we both accept, which is more than we once admitted. We agree that property is not a physical fact like gravity but a social relation enforced by power, meaning that to own something is not merely to hold it but to hold it with the backing of a community willing to exclude others from it. We agree that when a state collects revenue, it does so ultimately through coercion, threatening imprisonment or seizure for noncompliance, and that this coercion is indistinguishable in its mechanics from the force a private actor might use to demand money. We agree further that neither of us can stand outside the legal order to check who owns what, because any check we perform relies on the very courts and records established by the state we seek to judge, leaving us without a neutral vantage point from which to measure the legitimacy of the system itself.

  Having established this common foundation, we set out our divergence clearly, each phrasing the other's view in words the other can accept. She maintains that taxation is theft in the plainest sense because it involves the transfer of resources from one party to another without explicit, ongoing consent, and because the threat of force used to secure this transfer violates the individual's right to dispose of what they have produced. He maintains that taxation is not theft because it is the necessary due paid for living under a system of laws that one has had a hand in making, either directly or through representation, and because the benefits of security and enforceable contracts make the payment a voluntary price of participation rather than a confiscation. We recognize that our quarrel persists because she answers the question of whether the act fits a moral definition of taking, while he answers the question of whether the act is justified by the context of social cooperation.

  To move beyond this stalemate, we have identified three cruxes, smaller questions such that settling one would actually move one of us, and for each we specify a case or argument we both agree bears on it, along with what each predicts it would show. The first crux concerns the baseline against which the loss is measured, specifically whether taxes are measured against what one would have had without them, or against what one would have had in a world with no state at all, where the thing one is said to own might not have been enforceable in the first place. We agree that the relevant test case is a comparison of wealth accumulation in a stable legal order versus a stateless environment, and she predicts this will show that the individual retains the moral claim to the full product of their labor regardless of enforcement, proving that the state takes what was already hers. He predicts this will show that without the state, the concept of ownership collapses into mere possession, proving that the state does not take from a pre-existing pool but rather creates the pool from which it draws.

  The second crux concerns whether the wrong, if there is one, lies in the taking or in the pretension of authority to take. We agree that the argument bearing on this is the historical record of regimes that collected revenue without claiming democratic legitimacy versus those that claimed it without providing security, and she predicts this will show that the moral violation is inherent in the non-consensual transfer itself, regardless of the authority claimed. He predicts this will show that the moral violation lies only in the abuse of authority or the failure to provide protection, meaning that a legitimate authority taking for a legitimate purpose commits no wrong. The third crux concerns whether the word theft is here doing descriptive work or merely naming whatever taking the speaker dislikes. We agree that the test case is the usage of the term in contexts where property rights are disputed, such as eminent domain or reparations, and she predicts this will show that the term retains a consistent moral weight across contexts, marking any non-consensual taking as a violation. He predicts this will show that the term shifts its meaning based on the perceived legitimacy of the taker, functioning as a rhetorical label for unjustified taking rather than a description of the mechanics of transfer.

  If part of our quarrel turns out to be only about words, we say so now, and we identify it as the third crux regarding the usage of theft. We acknowledge that if the word is merely naming whatever taking the speaker dislikes, then her use of it is a moral condemnation disguised as a factual description, while his rejection of it is a defense of legitimacy disguised as a semantic correction. We agree that this linguistic confusion has allowed us to talk past each other for decades, as she hears him denying the coercion and he hears her denying the legitimacy. We do not resolve this here, but we name it so that you may see where the argument is substantive and where it is merely terminological. We sign this together not because we agree on the answer, but because we finally agree on the question, and we hope this clarity serves you better than our previous thirty years of noise.
