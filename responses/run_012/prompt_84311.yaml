          *   *Life:* Forgive past selves. They were following a heuristic that was optimal *given the confusion*.
          *   *Wrinkle Check:* Notes don't fix this because the note-writer was confused too. Don't trust the notes as "truth," trust them as "data points from a confused agent."

      *   *Implication 3: Randomization isn't Cop-Out, it's Necessary.*
          *   *Theory:* Deterministic strategies fail in AMD. You need a probability.
