  2.  **Deconstruct the Absent-Minded Driver (AMD) Logic:**
      *   *Core Insight:* You cannot optimize locally (at the intersection) because your location depends on your strategy. You must optimize *globally* (the plan before you started driving).
      *   *Time Inconsistency:* The "planning self" (ex-ante) and the "acting self" (ex-interim) have different information sets. The acting self is confused; the planning self knew the structure but not the specific moment.
      *   *Randomization:* The optimal solution often involves a mixed strategy (e.g., continue with probability $p$). This feels unsatisfying to a human wanting certainty.
