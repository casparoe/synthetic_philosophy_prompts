      *   **The Problem (AMD):** A driver needs to exit at the second intersection but can't distinguish between the first and second. If they exit at the first, they get a low payoff. If they exit at the second, high payoff. If they pass both, zero payoff. The paradox is that at *any* intersection, the probability of being at the first vs. second depends on the strategy chosen *at* the intersection (time inconsistency).
      *   **User's Twist:**
          1.  States aren't perfectly identical (60/40 distinguishability when well-rested).
          2.  Self-communication is possible but unreliable (past self was also confused).
