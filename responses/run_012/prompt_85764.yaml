  # JOINT STATEMENT ON INTERPERSONAL COMPARISONS OF WELFARE
  **Signatories:** [User] and Nadia  
  **Date:** October 26, 2023  
  **Subject:** Clarifying the Disagreement Regarding the Allocation of Discretionary Funds

  ### I. AGREED CLAIMS
  *We affirm the following propositions as common ground for our continued discussion and policy deliberation.*

  1.  **The Insufficiency of Ordinal Data:** We agree that ordinal preference data (e.g., "Person A prefers X to Y") alone cannot resolve distributive trade-offs between persons. The Pareto principle is insufficient when one party gains and another loses. To allocate the discretionary fund, some method of weighing competing interests is required.
  2.  **Policy Necessity:** We agree that regardless of the metaphysical status of interpersonal comparisons, policy decisions *must* be made. Refusing to compare is itself a decision that implicitly weights interests (e.g., by maintaining the status quo).
  3.  **Vagueness is Not Non-Existence:** We agree that the vagueness or difficulty of measuring a quantity does not entail that the quantity does not exist. (Example: "Baldness" is vague and lacks a precise threshold, but it is not merely an invention.)
  4.  **Truth vs. Verifiability:** We agree that a claim can be truth-apt (capable of being true or false) even if there is no immediate third-party procedure to verify it with certainty. Epistemic difficulty does not settle ontological status.
  5.  **Definition of "Meaningful":** We agree that for a comparison to be "meaningful" in this context, it must be capable of grounding a reason for action. We disagree on *why* it grounds that reason (see Section II).
  6.  **Verbal Friction:** We acknowledge that a portion of our disagreement stems from the use of the word "objective." [User] tends to use it to mean "mind-independent fact," while Nadia tends to use it to mean "inter-subjectively verifiable via a canonical procedure." We will endeavor to distinguish these in future discourse.

  ### II. THE CORE DISAGREEMENT
  *We cannot sign a single statement on the nature of welfare, but we can locate our divergence precisely.*

  **Nadia's Position (Constructivist/Ordinalist):**
  Statements comparing the welfare of Person A to Person B (e.g., "A's pain is worse than B's loneliness") are not descriptions of a pre-existing magnitude. They are **normative commitments**. To say one state is "worse" is to propose a rule for social coordination. There is no "fact of the matter" prior to the adoption of a framework that makes such comparisons possible. Therefore, economics and policy should remain transparent about the fact that they are *stipulating* weights, not discovering them.

  **[User]'s Position (Realist/Objectivist):**
  Statements comparing the welfare of Person A to Person B are **descriptive claims** about the world. While difficult to measure, there is a fact of the matter regarding the intensity of suffering or the depth of deprivation that exists independently of our measurement tools or ethical agreements. To deny this is to undermine the justification for prioritizing severe suffering over mild inconvenience. The difficulty of measurement is an engineering problem, not a metaphysical one.

  ### III. THE CRUXES
  *For each of the three identified cruxes, we propose a specific case. We record our divergent predictions/interpretations of that case in our own voices.*

  #### Crux 1: Structure of Welfare vs. Measurement Procedure
  *Question: Is comparability a feature of the world or a feature of our tools?*

  **The Case: The Neural Link.**
  Imagine a technology allows two people to temporarily fuse their conscious awareness. For one minute, Person A and Person B experience each other's current states simultaneously in a single unified field of consciousness.

  *   **Nadia's Prediction:** "Even in the fused state, the subjects might experience 'State A' and 'State B,' but ranking them as 'more' or 'less' still requires a metric external to the experience itself. The fusion removes the *epistemic* barrier, but it doesn't create an *ontological* ruler. They would still have to decide which state to prioritize upon separating. The comparison remains a choice."
  *   **[User]'s Prediction:** "If the minds fuse, the comparison becomes intrapersonal. A single mind experiencing both states simultaneously would immediately know which is more burdensome without needing a 'ruler.' The fact that the ranking becomes immediate and undeniable in the fused state proves the comparability was always there, waiting for the epistemic veil to be lifted."

  #### Crux 2: Same Kind vs. Cross Kind (Determinables)
  *Question: Can we compare different types of bads, or only tokens of the same type?*

  **The Case: Migraine vs. Humiliation.**
  Person A suffers a severe 4-hour migraine. Person B suffers a profound public humiliation that lasts 10 minutes but causes long-term social anxiety. We must fund a clinic that prevents only one of these.

  *   **Nadia's Prediction:** "These are different determinables. Pain is sensory; humiliation is social-psychological. To compare them, we must first agree on a 'currency' (e.g., 'quality-adjusted life years'). That currency is a convention. Without the convention, asking 'which is worse?' is like asking 'is a kilogram heavier than a meter?' It's a category error until we stipulate a conversion rate."
  *   **[User]'s Prediction:** "They are both deficits in the capacity to flourish. The 'currency' isn't a convention; it's the common impact on the agent's life. If the humiliation prevents B from working or sleeping for a year, and the migraine only stops A for four hours, the comparison is factual based on the *consequences* for welfare, even if the sensations are incommensurable in kind."

  #### Crux 3: Epistemic Access vs. Ontological Reality
  *Question: Does the inability to 'get inside both heads' mean there is nothing to compare?*

  **The Case: The Locked-In Patient.**
  Patient C is fully conscious but completely paralyzed (locked-in syndrome). They cannot report preferences or pain levels. Patient D is fully mobile and reports moderate discomfort. We have physiological markers for C that suggest extreme distress, but no report.

  *   **Nadia's Prediction:** "Without a revealed preference or a report, we have no data. Assigning a welfare level to C is an act of projection by the observer. We can treat C *as if* they are suffering, but claiming they *are* suffering more than D is a moral stance to protect the vulnerable, not a description of a measurable fact."
  *   **[User]'s Prediction:** "C's suffering is happening regardless of their ability to report it. The lack of access is our limitation, not a limit on the reality of C's state. If we say there is 'no fact of the matter' until C speaks, we are conflating truth with verification. The fact exists; we are just blind to it."

  ### IV. IS THIS PURELY VERBAL?
  *We acknowledge the possibility that some friction is terminological.*

  We agree that if "meaningful" means "capable of being measured by a third party with zero error," then Nadia wins: interpersonal comparisons are not meaningful. If "meaningful" means "capable of being true or false and grounding rational action," then [User] wins: they are meaningful.

  However, we do not believe the *entire* dispute is verbal. It has downstream consequences:
  1.  **Justification:** Nadia must justify the fund allocation as a democratic or ethical *choice*. [User] justifies it as an *optimization* problem.
  2.  **Error:** For [User], policymakers can be *mistaken* about who is worse off. For Nadia, policymakers can only be *inconsistent* with their own stipulated rules.

  ### V. WHAT WOULD MOVE US?
  *We conclude by specifying what evidence or argument would cause us to revise our positions.*

  **To Move Nadia:**
  "I would need to see a measurement protocol for interpersonal welfare that does not rely on a prior normative stipulation. If you can show me a way to measure 'units of suffering' across people that functions like measuring temperature (where the scale is discovered, not chosen), I would shift. Alternatively, if I become convinced that treating these comparisons as 'fiat' leads to systematically worse policy outcomes than treating them as 'facts,' I would adopt the realist stance pragmatically."

  **To Move [User]:**
  "I would need to see a proof that positing 'facts of the matter' about interpersonal welfare leads to logical contradictions or tyrannical outcomes that cannot be avoided otherwise. If you can demonstrate that my realism forces me to make arbitrary decisions anyway (making the 'fact' idle), or that the 'fact' is in principle inaccessible to any possible observer (even God), I would accept that the comparison is ultimately a normative tool rather than a descriptive one."

  ***

  **Signed,**

  __________________________ (Nadia)

  __________________________ ([User])
