      *   *Brother:* The 72-hour hold wasn't treatment; it was *containment*. Szasz is right about the *coercion*, but wrong that the *risk* wasn't medicalized.
      *   *Recommendation:* Shift the Uncle from "Not Ill" to "Ill." This aligns with the Coworker/OCD case (compulsion vs. choice). It resolves the PTSD contradiction (both are brain changes due to environment).

