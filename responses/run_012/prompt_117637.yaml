      *   What is the cost? Redefining "willpower."

  *(Self-Correction during drafting)*: I need to be careful not to invalidate the user's anger about the brother's hold. That was traumatic. I must distinguish between "Is this a medical condition?" and "Was the state's response appropriate?" Szasz is often right about the *politics* of psychiatry even if wrong about the *ontology*. I should validate that the brother's hold might have been a "problem in living" handled by police power, even if the underlying grief was physiological.

  Actually, looking closer at the Uncle vs. PTSD contradiction: The user says PTSD *is* an illness, but Addiction *is not*, even though both are responses to environment. This is the weakest link in their logic. Addiction is widely considered a brain disorder now. I will suggest shifting the Uncle to "Ill."

