      *   *Answer the New Cases:* Gambler (Compulsive = Ill), Miserable (Duration/Function = Ill), Bridge (Phobia = Ill), Family Delusion (Shared Psychosis = Ill if harmful).
      *   *The Cost:* What do they pay? They pay the price of admitting the Uncle wasn't just weak, and that the Brother's containment was a safety measure, not a cure. They lose the moral high ground of "willpower" but gain compassion.

