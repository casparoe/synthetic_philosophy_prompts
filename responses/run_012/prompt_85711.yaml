answer: |-
  # The Satisficing Diagnostic Tree

  **Instructions:** Answer each question with **A** or **B**. Follow the path indicated by your answer to the next node or to a final position (Leaf). Record your path (e.g., 1A-2B-3A...) to find your result in the Scoring Key.

  ### Node 1: Domain
  When you argue that "good enough" is acceptable, are you discussing **moral permission** (e.g., is it okay to donate less than the maximum possible?), or **decision procedure** (e.g., when to stop debugging or vendor selection)?
  *   **A:** Decision Procedure (Practical Rationality) → Go to Node 2.
  *   **B:** Moral Permission (Ethics) → **Leaf 1**.

  ### Node 2: Coherence
  Is "satisficing" a single, coherent mechanism, or is it a bucket term for several unrelated behaviors (like "the cloud") that should be split up?
  *   **A:** Single Coherent Mechanism → Go to Node 3.
  *   **B:** Bucket Term / Unrelated Behaviors → **Leaf 2**.

  ### Node 3: Direction
  Is the primary claim about how agents **actually** behave (descriptive), or how they **ought** to behave (normative)?
  *   **A:** Actually Behave (Descriptive) → Go to Node 4.
  *   **B:** Ought to Behave (Normative) → Go to Node 6.

  ### Node 4: Stopping Cause (Descriptive)
  When a team stops searching for a solution, is the primary driver the **cost of further search** (time, compute, opportunity cost)?
  *   **A:** Yes, costs dictate the stop → **Leaf 3**.
  *   **B:** No, costs are not the main driver → Go to Node 5.

  ### Node 5: Threshold Dynamics (Descriptive)
  Is the definition of "acceptable" **fixed** before the search starts, or does it **drift** based on what the team finds during the search?
  *   **A:** It Drifts (Endogenous) → **Leaf 4**.
  *   **B:** It is Fixed (or stops arbitrarily) → **Leaf 5**.

  ### Node 6: Zero-Cost Counterfactual (Normative)
  If search costs (time, attention, compute) were **zero**, would the rational agent continue searching until they found the **global optimum**?
  *   **A:** Yes, they would maximize → **Leaf 3**.
  *   **B:** No, they would still stop at "good enough" → Go to Node 7.

  ### Node 7: Source of Limit (Normative)
  Is the barrier to maximization located in the **agent** (finite computation/memory) or in the **world** (ill-defined problems, unknowable bests)?
  *   **A:** In the Agent → **Leaf 6**.
  *   **B:** In the World → Go to Node 8.

  ### Node 8: Environmental Scope (Normative)
  Is the satisficing rule rational in **all** environments, or only in environments with specific structures (e.g., high uncertainty, redundancy)?
  *   **A:** Only in Specific Environments → **Leaf 7**.
  *   **B:** In All Environments → **Leaf 8**.

  ---

  ## Scoring Key & Position Descriptions

  | Leaf | Path | Position Name | Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **1** | 1B | **Ethical-Permissibility Sense** | You must defend why morality has a "stop" button distinct from the obligation to do the most good. |
  | **2** | 2B | **Deflationary View** | You must propose new terminology for every current use-case of "satisficing" without losing nuance. |
  | **3** | 4A or 6A | **Cost-of-Search Reductionist View** | You must treat "good enough" as merely "optimal search" disguised, denying any qualitative shift in rationality. |
  | **4** | 5A | **Organizational View** | You must model rationality as a moving target that changes depending on past successes or failures. |
  | **5** | 5B | **Brute Descriptive View** | You must explain why agents stop at a fixed bar without reference to costs or learning (often unoccupied). |
  | **6** | 7A | **Bounded Agent Normative View** | You must claim finite compute is a universal normative limit, even for idealized theoretical agents. |
  | **7** | 8A | **Ecological or Heuristic View** | You must accept that a decision rule can be "rational" in one environment and "irrational" in another. |
  | **8** | 8B | **Distinct Normative Standard** | You must argue that maximization is impossible in principle, not just practically difficult. |

  ---

  ## Diagnostic Notes

  ### 1. Indistinguishable Leaves
  There are two pairs of positions this tree struggles to separate cleanly in practice, though they are logically distinct:

  *   **Leaf 3 (Descriptive Path) vs. Leaf 3 (Normative Path):** The tree separates these via Node 3 (Direction). However, respondents often conflate "we stop because of costs" (fact) with "we should stop because of costs" (norm). The questions pry them apart, but in conversation, proponents of the Cost-of-Search view often slide between the two without noticing.
  *   **Leaf 7 (Ecological) vs. Leaf 8 (Distinct Normative):** The tree separates these via Node 8 (Scope). However, if one defines "environment" broadly enough (e.g., "any world with finite information"), the Ecological view expands to cover the Distinct Normative view. The question forces a binary choice on scope that may not reflect the continuum of "environmental structure."

  ### 2. Unoccupied Combinations
  The tree generates a combination that few, if any, theorists occupy: **Leaf 6 (Bounded Agent Normative View)**.
  *   **Path:** 1A-2A-3B-6B-7A.
  *   **Why:** This position claims that satisficing is a normative ideal (Node 6B) but locates the limit solely in the agent's finite computation (Node 7A). This is generally considered incoherent or unattractive because normative theories usually aim for ideal rationality; if the limit is just "my CPU is slow," that is a practical constraint (Reductionist), not a fundamental normative standard. If it were a fundamental standard, the limit usually shifts to the structure of the world (Leaf 8), not the agent's hardware.

  ### 3. Usage Guide
  *   **For Engineering Managers:** Use this to debug decision paralysis. If your team is stuck in **Leaf 3** thinking but acting like **Leaf 8**, they are treating a cost problem as a fundamental limit.
  *   **For Architects:** Use Node 5 to determine if system requirements (the "threshold") should be static or adaptive based on telemetry (the "drift").
  *   **For the Group:** If the group splits heavily on Node 6, you are not arguing about process; you are arguing about the definition of rationality itself.

  ---

  ## Logical Distinctions Map
  *   **Descriptive/Normative/Limits:** Handled by Node 3 (Direction) and Node 6/7 (Limits).
  *   **Stopping Point Fixation:** Handled by Node 5 (Fixed vs. Drifting).
  *   **Good Enough vs. Optimum:** Handled by Node 4 & 6 (Cost integration).
  *   **Exploration vs. Standard:** Handled by Node 4 (Search/Exploration) vs. Node 5 (Threshold/Standard).
  *   **Agent vs. World Limits:** Handled by Node 7.
  *   **Environment Relative:** Handled by Node 8.
  *   **Ethics vs. Practical:** Handled by Node 1.
