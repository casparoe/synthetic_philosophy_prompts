      *   *Mid Tier ("Strong Damage"):* Selection Bias. The historical record isn't as bleak as Laudan claimed. Atoms survived.
      *   *Mid-Low Tier ("Complicates it"):* Structural Realism. It saves the math but concedes the ontology. It's a retreat, not a total victory.
