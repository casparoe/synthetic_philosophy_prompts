      *   *Argument 2: Selection Bias (User's point).* Laudan's list is cherry-picked. Many entities *did* survive (atoms, genes, blood circulation).
      *   *Argument 3: Structural Realism.* The equations stay, the ontology changes. Maybe we should only believe the structure.
      *   *Argument 4: Incremental Refinement.* We don't swap theories entirely; we refine them. Newton -> Einstein isn't a total discard; it's a limit case.
      *   *Argument 5: Causal Manipulation (Hacking).* We *use* electrons to spray them. If you can spray it, it's real.

  4.  **Ranking the Arguments (Kills it -> Awkward):**
