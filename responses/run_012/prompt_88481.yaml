answer: |-
  You have independently reinvented a position known in philosophy of science as the **Pessimistic Meta-Induction (PMI)**. It was most famously formalized by Larry Laudan in 1981. Your intuition is sharp: the argument is that since past successful theories posited entities that turned out not to exist (phlogiston, caloric, ether), we should expect our current successful theories to posit entities that don't exist (electrons, quarks, spacetime curvature).

  You asked for things that should count against this view, ranked by how much damage they do to it. You also asked for honesty about where a defender of your view would concede ground versus where they would dig in.

  Here is the breakdown, ranked from "This kills the argument" to "This is just annoying."

  ### 1. The "If You Can Spray It, It's Real" Argument (Entity Realism)
  **Rank:** This kills it.
  **The Argument:** This is the strongest counter to your specific analogy. Phlogiston and the Ether were *theoretical postulates* used to explain observations. You couldn't interact with them directly; you inferred them. Electrons are different. We don't just infer electrons to make equations work; we use them to *do* things.
  **Why it counts against you:** Ian Hacking, a philosopher, argued that when we can causally manipulate an entity independent of the theory describing it, skepticism becomes unreasonable. We can spray electrons at a target to alter a material's properties. We can trap a single electron in a Penning trap.
  If electrons were like phlogiston, we wouldn't be able to use them as *tools* to investigate other things. The fact that we can engineer technology based on the causal powers of electrons suggests they are part of the causal fabric of the world, regardless of whether our *theory* of them is perfectly true.
  **Defender's Concession:** A hardline PMI defender has to admit this is their weakest flank. If you can manipulate the entity without relying on the specific theory, the analogy to phlogiston breaks. Most PMI defenders retreat to saying, "Okay, maybe electrons exist, but our understanding of their properties (spin, mass, etc.) is still likely wrong."

  ### 2. The "Bad History" Argument (Selection Bias)
  **Rank:** Strong damage.
  **The Argument:** You suspected this yourself. Laudan's original list of "failed entities" was cherry-picked. He focused on the embarrassments. But if you take a broader census of scientific history, the survival rate is actually quite high.
  **Why it counts against you:**
  *   **Atoms:** Democritus posited them as philosophical objects. Dalton made them chemical. We still have them.
  *   **Genes:** Mendel posited "factors." We thought they were beads on a string. Then we thought they were continuous stretches of DNA. Now we know they're complex regulatory networks. But the *entity* (a unit of hereditary information located on a chromosome) survived the theory changes.
  *   **Blood Circulation:** Harvey's theory had wrong mechanics, but the central claim (blood circulates) survived.
  If the survival rate of ontological commitments is actually 50% or higher, rather than the near-0% your view implies, the inductive force of the argument collapses.
  **Defender's Concession:** A fair PMI defender admits Laudan's list was illustrative, not exhaustive. They would concede that *some* entities survive, but they would argue the *fundamental* ones (the "invisible furniture" of physics) are the ones that get swapped out. They will try to distinguish between "macroscopic entities" (blood, atoms) which survive, and "fundamental physics entities" (ether, quarks) which don't.

  ### 3. The "Limit Case" Argument (Continuity of Truth)
  **Rank:** Moderate damage.
  **The Argument:** You are treating theory change as a binary: True or False (Phlogiston: False). But science often works by absorption. Newtonian gravity wasn't proven "false" in the way phlogiston was; it was shown to be a *limit case* of General Relativity.
  **Why it counts against you:** If Theory B reduces to Theory A under specific conditions (low speed, low gravity), then Theory A wasn't "false" about the world; it was "approximately true" or "contextually true." This suggests convergence. We are getting closer to the real furniture, not just swapping one fake chair for another.
  **Defender's Concession:** They will wave this away. They will argue that "approximate truth" is a weasel word. Phlogiston theorists could say "phlogiston is approximately negative mass." A PMI defender insists that if the ontology is wrong (there is no phlogiston), the theory is false, regardless of whether the math approximates reality.

  ### 4. Structural Realism (The Mathematical Skeleton)
  **Rank:** Awkward (for you).
  **The Argument:** You asked if this is cheating. It is the position that while the *nature* of the entities changes (ontology), the *mathematical relationships* between them (structure) are preserved. Fresnel predicted the "Poisson Spot" using ether equations. The ether doesn't exist, but the equations for light waves were preserved in Maxwell's electromagnetism.
  **Why it counts against you:** It suggests that we *are* latching onto something real (the structure of the world), even if our visualization of the "stuff" is wrong. It saves the "no miracles" argument (why do the equations work?) without forcing you to believe electrons are little billiard balls.
  **Defender's Concession:** A PMI defender will **not** admit this counts against them. They will embrace this. In fact, many PMI defenders *become* Structural Realists. They will say, "Exactly! I told you the furniture was fake. Only the blueprints are real." This doesn't knock down your view; it refines it.

  ---

  ### Addressing Your Specific "Chews"

  **1. "My sample of history is a sample I chose."**
  *   **Verdict:** This is the strongest internal critique.
  *   **Detail:** If you include biology and chemistry, the track record of entities is good. If you restrict yourself strictly to fundamental physics (where the "invisible furniture" is most abstract), the track record is worse. Your view holds up better in high-energy physics than in biology. A defender of your view would admit that generalizing from physics to *all* science is a mistake, but maintain that for "deep reality," the skepticism holds.

  **2. "The mathematical skeleton survives... is that cheating?"**
  *   **Verdict:** It's not cheating, but it changes the definition of "real."
  *   **Detail:** If you define "real" as "things you can point to" (entities), then the math surviving doesn't help you. If you define "real" as "relations that hold," it does. This is the difference between *Entity Realism* and *Structural Realism*. It's not a "get out of jail free" card; it's a retreat to a more defensible position. It concedes that our *picture* of the world is wrong, even if our *map* is right.

  **3. "Is my view even falsifiable?"**
  *   **Verdict:** Yes, it is.
  *   **Detail:** Your view is falsified if current theoretical entities survive the next major theory change. If we develop a Theory of Quantum Gravity, and it still requires something recognizably an "electron" or a "field" (not just a mathematical limit, but a causal component), your PMI is weakened. If the next revolution keeps 80% of our current ontology, the induction fails.
  *   **The Trap:** The risk is that realists will define "survival" loosely ("Well, quarks are *like* atoms..."), while you define it strictly ("No, they have different spin properties"). To make your view falsifiable, you need to define what counts as "the same entity" across theory changes.

  **4. "A case where a theory was thrown out but its central invisible thing got kept."**
  *   **Verdict:** Atoms are the big one.
  *   **Detail:** In the late 19th century, prominent physicists (like Mach and Ostwald) argued atoms were merely useful fictions. They were "positivists." They said, "Thermodynamics works without atoms, so atoms are metaphysical nonsense." Then Einstein (Brownian motion) and Perrin proved atoms were physically real causal agents.
  *   **Why it matters:** This is a direct historical counter-example to your induction. The scientific community believed an entity was a fiction/useful tool, but it turned out to be real furniture. This suggests the "sociological trend" of dismissing entities is not a reliable indicator of their falsity.

  ---

  ### Summary: Where the View is Exposed

  If I were playing devil's advocate against your position, here is where I would press, and here is how a defender of your view (a Pessimistic Meta-Inductivist) would respond:

  **1. The Manipulation Objection**
  *   **Attack:** "We can spray electrons. We can't spray phlogiston."
  *   **Defender Concedes:** This is the biggest threat. They must admit that *causal manipulability* is a stronger criterion for reality than *predictive success*. They will retreat to saying, "We can manipulate *something*, but is it really an electron with spin-1/2, or just a node in a field we don't understand?"

  **2. The Atom Objection**
  *   **Attack:** "Atoms were called fictions, now they are facts. Your induction is wrong."
  *   **Defender Concedes:** They admit this is a counter-example. They will try to argue that atoms are "macroscopic" enough to be observed indirectly, whereas quarks are not. They will try to draw a line between "observable in principle" and "theoretical postulate."

  **3. The Structural Objection**
  *   **Attack:** "The equations stay. So we know *something* about reality."
  *   **Defender Waves Away:** They will say, "Structure without ontology is empty. Knowing the map is accurate doesn't tell you if the territory is made of land or water." They do not see this as a concession; they see it as their main point.

  **The Verdict:**
  Your view is robust against "pep talks," but it is vulnerable to **Entity Realism (Hacking)**. If you can causally interact with the "invisible furniture" in a way that allows you to build new, unpredictable technology (like quantum computing), the claim that it is "false like phlogiston" becomes very hard to sustain. Phlogiston didn't let you build engines; it just explained burning. Electrons let you build computers. That difference matters.
