      *(Refining the "Luck" point)*: The user worries that rejecting (5) lets in luck. Actually, accepting the inevitability (5) *increases* the role of luck (who got there first). Rejecting (1) allows us to credit the person who *did* the work, regardless of luck. Wait, if science is inevitable, isn't it luck that *I* was the one to do it? Yes. But credit is for the *doing*, not the *being the only one who could*.

      *(Final check on Step 1 vs Step 3)*: Step 1 sets the condition. Step 3 applies it. If Step 1 is "Credit requires Necessity," then Step 3 follows. If Step 1 is "Credit requires Causal Contribution," Step 3 fails. So Step 1 is the definition to challenge.

