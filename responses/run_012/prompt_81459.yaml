  So I'm a high school student and Ive been reading about the Judy Benjamin problem. The setup is something like: you're a parachutist who's landed in a field divided into Red and Blue, each with a headquarters and a second company area. You have some prior about where you are, and then you get a radio message that says something like "if you're in Red, you're in HQ." Im inclined to think that the right way to update in cases like this is to minimize relative entropy from your prior -- i.e., pick the new probability distribution that's as close as possible to your old one while respecting the new information. I want to know what would count against that view. What would have to be true for relative entropy minimization to be the wrong rule here? Is the Judy Benjamin case actually a counterexample, or is it just a puzzle about what the intuitive answer should be? I've heard the intuitive answer and the entropy answer come apart, but I don't remember the exact numbers, and I might have the setup wrong. I'd like the defeaters ranked from fatal to merely awkward, and I want to know what a defender of relative entropy minimization would concede as counting against them, not just what critics say. If the view turns out to be well insulated by qualifications, say so and tell me whether that's a problem. Also, if my framing is confused or the question as posed can't be answered well, please say that plainly instead of humoring me.
