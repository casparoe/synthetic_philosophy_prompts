answer: |-
  **Organism:** *Abyssus vox* (deep-sea cephalopod). Lives in total darkness; relies on bioluminescence and hydrodynamics.

  **Case 1: The Spandrel (CR Yes, EA No)**
  *Trait:* **Hemolymph Glow.** The blood fluoresces blue when oxygenated.
  *History:* Selected solely for oxygen transport efficiency; glow is a chemical byproduct never selected for.
  *Current Role:* Illuminates nearby prey, contributing to feeding capacity.
  *Verdict:* **CR** assigns function (illumination) because it contributes to a system capacity. **EA** denies function because the trait was not selected for this effect.
  *Key Feature:* Utility without selection history.

  **Case 2: The Malfunction (EA Yes, CR No)**
  *Trait:* **Ink-Shutter.** A muscle closing the ink sac.
  *History:* Selected for stealth (blocking scent/light).
  *Current Role:* A fixed genetic defect leaves it permanently open in this population; it contributes nothing to stealth capacity.
  *Verdict:* **EA** assigns function (stealth) based on selection history. **CR** denies function because it currently contributes nothing to the system's capacity.
  *Key Feature:* History without current capacity contribution.

  **Case 3: The Exaptation (Both Yes, Different Functions)**
  *Trait:* **Ventral Ridges.** Skin folds on the underside.
  *History:* Selected for hydrodynamic stability during swimming.
  *Current Role:* Channel bioluminescent fluid for mate signaling (stability role is negligible now).
  *Verdict:* **EA** names function *stability* (selection history). **CR** names function *signaling* (current contribution to reproduction).
  *Key Feature:* Shift in utility diverging from origin.

  **The Isolation Move**
  *Trait A:* **Photophore Organ.** Evolved specifically to produce blue light for mating.
  *Trait B:* **Hemolymph Glow** (from Case 1). Byproduct producing identical blue light for mating.
  *Current Contribution:* Identical wavelength, intensity, and reliability in attracting mates.
  *Split:* **CR** says both have the function "mate attraction" (same effect). **EA** says only Trait A has this function; Trait B has none (different history).
  *Cheating?* No. Convergent effects from distinct etiologies are biologically ordinary (e.g., enzymes vs. ribozymes).

  **Defense of the "Loser" (Case 1: Etiological Account)**
  In Case 1, EA denies function to a beneficial trait, which seems counterintuitive.
  *The Line:* The EA defender argues that "function" is a historical term, not a normative one. We must distinguish *function* (why it is there) from *benefit* (what it does). Calling the glow "functional" conflates current utility with evolutionary explanation.
  *Does it work?* Partially. It preserves the link between function and natural selection, preventing "everything useful is functional" inflation. However, it clashes with biological practice, where physiologists routinely assign functions to traits based on current systemic contribution regardless of history. It saves the theory by stipulating definitions rather than matching usage.
