answer: |-
  I mix the mortar with the crushed **stone**,
  Filling the void where a boy's **name**
  Was lost to weather. There is no **debt**
  In logic, only in the grassy **field**.
  The pole is rusted, holds no **flag**,
  Yet children march and turn **again**.

  They say the dead return **again**,
  Encased in granite, not in **stone**.
  They salute the idea of a **flag**,
  Forgetful of the specific **name**.
  They picnic on the battle **field**,
  Unaware of the unpaid **debt**.

  I know the ledger shows the **debt**
  Was settled when the firing stopped **again**.
  But memory plows the same old **field**,
  Seeking a foundation in the **stone**.
  They need a banner, need a **flag**,
  To cover up the blankness of a **name**.

  What matters now is not the **name**,
  But the weight of the collective **debt**.
  They raise a pole to fly a **flag**
  Over a ground they till **again**.
  They claim the harvest of the **field**,
  Though nothing grows from cold **stone**.

  I smooth the surface of the **stone**,
  Making it legible, the **name**.
  I help them owe the phantom **debt**,
  By marking off the sacred **field**.
  I fix the hinge to hold the **flag**,
  So they can raise it up **again**.

  Now spring will bring them back **again**,
  To touch the smoothness of the **stone**.
  They do not see the ragged **flag**,
  They only see the glory of the **name**.
  They think they walk upon a **field**,
  But walk inside a moral **debt**.

  They fix the story of a **name** upon the **field**,
  To bind them to the cycle **again** beneath the **flag**,
  To carry down the endless **debt** of **stone**.
