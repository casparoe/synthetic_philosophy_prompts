answer: |-
  ### 1. The Carrying Case: Do Not Use Relief

  Do not use the pleasure of relief (the scratch, the headache stopping) as your primary carrier. While visceral, it is pedagogically dangerous for this specific problem.

  **Why:** Relief sits on the boundary of pain and pleasure. If you use it, students will conflate the *heterogeneity problem* (do all pleasures share a quality?) with the *asymmetry problem* (is pleasure merely the cessation of pain?). They will spend the session debating whether relief is "real" pleasure rather than examining the internal diversity of positive states.

  **The Recommended Case:** **The Pleasure of Competent Completion.**
  Specifically: *The moment a student finally solves a difficult problem they have been stuck on for days (e.g., a code bug, a logic proof, a complex repair).*

  **What it must contain:**
  *   **A sensory component:** The physical relaxation of the shoulders, the sound of the machine working, the visual clarity of the screen. (This hooks their sensory intuition).
  *   **A non-sensory component:** The "click" of understanding, the sense of "I did it." (This breaks their sensory intuition).
  *   **Resistance:** Students must initially describe this as "satisfaction" or "relief," resisting the label "pleasure." (This forces the definition problem).

  **What it must not contain:**
  *   **Moral valence:** Do not use a moral example (e.g., "the pleasure of helping someone"). This invites debates about altruism vs. egoism, which distracts from the phenomenology.
  *   **High-stakes emotion:** Avoid grief turned to joy or romantic love. These are too complex and invite "emotion vs. pleasure" debates. Keep it cognitive and functional.

  ---

  ### 2. The Sequence: Five Forced Moves

  Do not announce the topic. Begin with a request for a report.

  **Step 1: The Sensory Trap (5 Minutes)**
  *   **Action:** Ask students to close their eyes and recall the pleasure of drinking cold water when extremely thirsty. Ask: *"Describe the feeling itself. Where is it? What is its texture?"*
  *   **Expected Output:** They will describe a sensation (coolness, throat sensation, refreshment).
  *   **Pedagogical Goal:** Lock them into the **Sensory Quality View** (Misconception 1). Write their descriptors on the board (e.g., "cool," "tingling," "warmth").
  *   **Constraint:** Do not yet introduce the word "pleasure." Let them describe the *experience*.

  **Step 2: The Disruption (10 Minutes)**
  *   **Action:** Introduce the Carrying Case. *"Now, recall the moment a difficult problem you've been stuck on finally clicked. The code compiled. The proof worked. Describe that feeling. Where is it? What is its texture?"*
  *   **Expected Output:** They will struggle. They will say "It's not in my body," or "It's just knowing it's done."
  *   **The Forced Move:** Point to the board (the water descriptors). *"Apply these words to the problem-solving case. Is the 'click' cool? Is it tingling?"*
  *   **Result:** The Sensory Quality View collapses. They cannot find the common sensation.

  **Step 3: The Student-Proposed Repair (10 Minutes)**
  *   **Action:** Ask: *"If the feeling isn't the same, why do we call both of these 'pleasure'? What is the common thread?"*
  *   **Expected Output:** A student will inevitably say: *"Because we like it,"* or *"Because we want it to continue."*
  *   **Pedagogical Goal:** This generates the **Attitudinal View** from the room, not from you. You merely formalize their repair: *"So, pleasure is not a feeling, but an attitude of 'liking' toward an experience?"*

  **Step 4: The Triviality Check (10 Minutes)**
  *   **Action:** Challenge the repair immediately. *"If I say 'I like this,' isn't that just a synonym for 'I enjoy this'? Have we explained anything, or just renamed the mystery?"*
  *   **Pedagogical Goal:** Surface **Misconception 2** (Attitudinal view is trivial).
  *   **The Forced Move:** Press for the *direction of fit*. *"Do you like it because it feels good, or does it feel good because you like it?"* If they say the former, they return to Step 1 (Sensory). If they say the latter, they commit to the Attitudinal View properly (the attitude constitutes the pleasure).

  **Step 5: The Stakes (10 Minutes)**
  *   **Action:** Ask: *"If these two experiences share no common feeling, only a shared attitude, can we measure them against each other?"*
  *   **Pedagogical Goal:** Surface **Misconception 3** (Verbal dispute).
  *   **The Forced Move:** Connect it to Bentham. *"Bentham wants to sum pleasures. If 'pleasure' is just a label we stick on fundamentally different states (like 'game' applied to chess and soccer), can we sum them?"*

  ---

  ### 3. Handling the Misconceptions

  You must intercept these *as they arise*, not in a summary.

  **Misconception 1: Pleasure is a Sensation with a Characteristic Quality.**
  *   **Where it surfaces:** Step 1 (The Water).
  *   **Status:** **Voiced.** Students will confidently assert this.
  *   **How to handle:** Do not correct it yet. **Amplify it.** Ask for more sensory detail. Write it on the board as "The Class Consensus." This makes the collapse in Step 2 more dramatic. If you challenge it too early, they will defensively hedge. Let them commit.

  **Misconception 2: The Attitudinal View is Trivially True.**
  *   **Where it surfaces:** Step 4 (The Triviality Check).
  *   **Status:** **Voiced.** A student will say, *"Well, obviously enjoying something means liking it. What's the debate?"*
  *   **How to handle:** Distinguish the *object* from the *attitude*. Ask: *"Can I like something that feels terrible?"* (e.g., running a marathon, studying for an exam). If they say yes, then "liking" is not a sensory glow. If they say no, they are back to Sensory Quality. Force them to see that the Attitudinal View claims the *liking itself* is the pleasure, not a reaction to a feeling.

  **Misconception 3: The Problem is Merely Verbal.**
  *   **Where it surfaces:** Step 5 (The Stakes).
  *   **Status:** **Silent/Underlying.** They won't say "This is verbal," but they will act as if it doesn't matter. They will think, *"Who cares what we call it?"*
  *   **How to handle:** Make it material. *"If Hedonism says 'Maximize Pleasure,' and pleasure is heterogeneous (like 'games'), then 'Maximize Pleasure' is as empty as 'Maximize Games.' Do you see why a moral theory needs a unified currency?"* This converts a semantic worry into a structural crisis for the theory they read (Bentham/Mill).

  ---

  ### 4. What to Leave Out (Explicitly Set Aside)

  To keep the session clean, you must explicitly name and bracket the following at the start of Step 2:

  1.  **Neuroscience:** *"We are not asking what dopamine does. We are asking about the phenomenology—what it is like from the inside."* (Prevents reductionism).
  2.  **Normative Hedonism:** *"We are not asking if pleasure is the Good. We are asking if pleasure is a single kind of thing."* (Prevents conflation of metaphysics and value).
  3.  **Mill's Higher/Lower Distinction:** *"Mill assumes we know what pleasure is and then ranks it. We are asking if we can identify it at all before we rank it."* (Prevents them from using Mill's solution to bypass the problem).

  ---

  ### 5. The Closing Question

  Do not ask them to define the views. Ask them to apply the consequence of the problem.

  **The Question:**
  > "If the Attitudinal View is correct, and pleasure is simply 'taking an attitude of liking' toward vastly different experiences, **what happens to the Hedonist's promise to provide a single currency for moral decision-making?**"

  **Why this works:**
  *   **The Memorizer** will answer: *"It makes it harder to calculate utility,"* or *"Mill would say higher pleasures count more."* (This recites the text but misses the metaphysical point).
  *   **The Understander** will answer: *"If there is no common phenomenological currency, there is nothing to sum. The calculus collapses because you can't add 'liking a proof' to 'liking ice cream' unless 'liking' is a measurable quantity independent of the object."*

  This reveals whether they see the Heterogeneity Problem as a taxonomy exercise or as a threat to the coherence of Hedonism itself.
