answer: |-
  This is a sharp observation, and it is not merely fussiness about language. You have put your finger on a genuine tension in the normativity of medicine, specifically the gap between *evolutionary explanation* and *clinical intervention*. However, I am going to push back on one part of your setup: I doubt the practice *presupposes* a specific metaphysical theory of function in the way a philosopher might require. Instead, the practice operates on a pragmatic theory of *trade-offs* that is compatible with multiple metaphysical accounts of function.

  Here is a reconstruction of the implicit theory, an analysis of what is actually required versus what is merely convenient, and a assessment of what would change if we swapped the philosophical underpinnings.

  ### 1. The Reconstruction: Defeasible Teleology and the Smoke Detector Principle

  To make the clinical practice internally consistent, we do not need to abandon teleology, but we do need to refine what we mean by "function." The practice presupposes a **Selected Effect (SE)** account of function (à la Millikan or Neander) combined with a **context-sensitive cost-benefit analysis**.

  Here is the implicit argument structure clinicians are using, even if they don't articulate it philosophically:

  1.  **Premise 1 (Evolutionary History):** Fever and inflammation are traits selected for because, in the Environment of Evolutionary Adaptedness (EEA), they statistically increased fitness by suppressing pathogens. (This validates the "body fighting" claim).
  2.  **Premise 2 (The Smoke Detector Principle):** As Randolph Nesse has argued, defensive responses are calibrated to be hypersensitive. The cost of a false positive (fever when not strictly necessary) is lower than the cost of a false negative (no fever when infection is lethal). Therefore, the system is designed to overshoot.
  3.  **Premise 3 (Contextual Mismatch):** The modern clinical environment differs from the EEA. We have antipyretics, hydration, and monitoring. The cost of the fever (metabolic demand, discomfort, seizure risk) may now outweigh the benefit (pathogen suppression) in specific instances, even if the *trait* remains functional in the SE sense.
  4.  **Conclusion (Intervention):** We suppress the *output* of a functional system because the *net utility* of that output is negative in this specific context.

  **Is this a contradiction?** No. It is a distinction between the **function of the trait** (to defend) and the **value of the token event** (this specific fever in this specific patient).

  Consider pain. We agree pain has a biological function (warning of tissue damage). Yet, administering morphine to a trauma patient is not a denial of pain's function; it is a judgment that the *signal* is no longer useful for survival and is now actively harmful. The clinical practice treats fever exactly like pain: as a defensive signal that can become pathological if the intensity or duration exceeds the host's capacity.

  ### 2. What Does the Practice *Require*?

  You asked whether the practice requires genuine functions in a non-metaphorical sense, or if it can be translated into causal-mechanistic talk.

  **Strict Requirement:**
  The practice strictly requires **predictive reliability**, not metaphysical realism about functions.
  To justify "watchful waiting," a clinician needs to believe that $P(\text{recovery} | \text{immune response}) > P(\text{recovery} | \text{intervention})$. To justify "suppress fever," they need to believe $P(\text{harm} | \text{fever}) > P(\text{benefit} | \text{fever})$.

  **Compatible Views:**
  *   **Realism about Function (SE):** Fits comfortably. The function is real, but defeasible.
  *   **Causal Role (CR) Functionalism:** Fits comfortably. Fever plays a role in the systemic stability of the organism. Sometimes that role is stabilizing (fighting infection), sometimes destabilizing (metabolic crash).
  *   **Eliminativism:** *Also fits.* An eliminativist about biological function can simply say: "States historically associated with pathogen clearance are currently correlated with metabolic stress. We calculate the net effect."

  **What is Ruled Out?**
  The practice quietly rules out **Strong Essentialism** or **Vitalism**. If fever were *essentially* good (an Aristotelian final cause that cannot be violated), then suppressing it would be morally or metaphysically impermissible, akin to blinding a seeing eye. The fact that clinicians suppress it without moral hesitation shows they do not view the "function" as a normative command, but as a statistical tendency.

  It also rules out a naive **Adaptationism** that equates "existing" with "optimal." If clinicians believed every physiological response was perfectly optimized for the *current* environment, they would never intervene. The willingness to intervene presupposes that the organism's design is not omniscient regarding the present context.

  ### 3. The "Free-Floating Rationale" and the Clinician

  You mentioned Dennett's "free-floating rationales." This is the crux of the communication gap.
  *   **The Rationale:** Exists in the design space of the immune system (selected over millennia).
  *   **The Reasoner:** The clinician (operating in minutes).

  When the clinician says, "Your body is fighting this," they are referencing the free-floating rationale. When they prescribe ibuprofen, they are acting as a *second-order designer*, overriding the first-order design because the local conditions have changed.

  The tension you feel arises because the *explanation* appeals to the evolutionary rationale, while the *intervention* appeals to immediate welfare. This is not inconsistent, provided we accept that **welfare (patient well-being) trumps function (evolutionary fitness)** in clinical ethics. The goal of medicine is not to maximize the patient's reproductive fitness (which might require enduring a high fever to clear a pathogen completely); it is to minimize suffering and mortality *now*.

  ### 4. What Would Change if We Swapped the View?

  Suppose we forced clinicians to adopt strict **Eliminativism** about biological function and banned teleological language.

  *   **Language:** Instead of "Let the body fight," they would say, "The immune mechanism is currently active; interrupting it may prolong pathogen clearance." Instead of "Fever is a defense," they would say, "Elevated temperature correlates with reduced viral replication."
  *   **Norms:** The "watchful waiting" norm would survive, but its justification would shift from "respecting the body's wisdom" to "avoiding iatrogenic disruption of a statistically beneficial causal chain."
  *   **Antipyretics:** The norm would survive, justified as "mitigating collateral damage from an overactive regulatory loop."

  **Would anything *actually* change?**
  Probably not in terms of outcomes. However, there is a risk. Teleological language serves a **heuristic function**. "The body is fighting" encourages patient compliance with rest and hydration. "Your cytokines are misfiring" might encourage demand for stronger suppression.
  If you remove the teleology, you might lose the **narrative coherence** that helps patients tolerate symptoms. If fever is just a "glitch" rather than a "defense," patients may be less willing to endure it. So, while the *logic* of treatment doesn't require realism about function, the *psychology* of adherence might.

  ### 5. Pushback: Is the Puzzle Manufactured?

  Here is where I need to be blunt. I suspect you are attributing more philosophical coherence to clinical practice than actually exists.

  1.  **Communication vs. Reasoning:** The statement "Your body is fighting this" is often pedagogical, not ontological. It is a model for the patient, not a commitment by the doctor. Clinicians often operate on **protocol-based heuristics** (e.g., "If T > 39.5, treat") derived from trials, not from a philosophy of biology. The "contradiction" exists in the *narrative*, not necessarily in the *decision matrix*.
  2.  **Population vs. Individual:** Guidelines (watchful waiting) are based on population-level data. Interventions (antipyretics) are based on individual-level distress. The tension is between **actuarial logic** and **individual care**, not necessarily between teleology and mechanism.
  3.  **The "Function" Ambiguity:** You are treating "function" as a binary (it has one or it doesn't). In medicine, function is graded. A fever of 38°C might be functional; a fever of 41°C is almost always pathological. The practice doesn't switch between "function exists" and "function doesn't exist"; it switches between "function is beneficial" and "function is excessive."

  **My Bet:** The practice does not presuppose genuine teleology in the metaphysical sense. It presupposes **instrumental reliability**. The teleological idiom is retained because it is cognitively efficient for both doctors and patients to model the immune system as an agent with goals, even if strictly speaking it is a collection of causal mechanisms.

  ### 6. Where I Am Least Sure

  I am least confident in the claim that eliminativism would have *no* effect on practice. There is a subfield of **evolutionary medicine** (e.g., Nesse, Williams) that argues precisely that *ignoring* the function of symptoms leads to over-treatment. If the medical culture fully internalized eliminativism, they might lose the "brake" that evolutionary thinking provides—the hesitation to intervene that comes from respecting the "free-floating rationale."

  If clinicians truly believed symptoms were *only* pathologies (eliminativism of defense), they might treat more aggressively. If they believe symptoms are *defenses* (teleological realism), they might treat more conservatively. The fact that they do both suggests they are oscillating between these views depending on the severity of the case.

  **Summary:**
  The practice is consistent if you view biological functions as **defeasible norms** rather than absolute laws. It does not require metaphysical realism about function, but it relies on the *heuristic utility* of teleological language. The tension you perceive is real, but it is a tension between **evolutionary fitness** and **clinical welfare**, not a logical contradiction in the philosophy of biology. The clinician is not contradicting themselves; they are managing a trade-off between the body's ancient design and the patient's present suffering.
