  The episode lands in territory the account never anticipated. Maimonides' accommodationist thesis explains the *origin* of the sacrificial cult as a concession to historical psychology, but it cannot account for the tradition's *persistence* in valuing the cult as an intrinsic good after that psychology and history have vanished. The episode reveals a commanded practice outliving its stated reason while remaining binding, forcing a distinction between the historical rationale for a law and the theological source of its obligation.

  1.  **The mapping.** In the accommodationist thesis, God (via the Law) accommodates the Israelites' historical condition—specifically, their immersion in a pagan culture where sacrifice was the universal mode of worship. The agent of accommodation is the Lawgiver, bending the ideal form of worship to fit human capacity. The thesis predicts that once the condition it accommodated disappears—once the universal habit of sacrifice is broken or the physical means are removed—the practice should be viewed as obsolete, a scaffold removed once the building stands. This prediction is falsifiable: if the tradition treats the cult as a permanent ideal rather than a transient tool, the thesis fails to explain the tradition's self-understanding. The episode falsifies this prediction. After 70 CE, the condition vanished (the Temple was destroyed, and later pagan sacrifice disappeared), yet the tradition codified the laws as binding, mapped prayer onto them, and mourned their loss. The practice was not treated as a scaffold removed, but as a presence withdrawn.

  2.  **The episode against three readings.** The episode supports the **constitution** reading and embarrasses the **concession** and **pedagogy** readings.
      *   *Concession:* If the cult were merely a concession to weakness (the inability to worship without blood), its cessation should be met with relief or indifference, marking a cure. The episode shows mourning, indicating the cult was not viewed as a symptom of weakness but as a constitutive good.
      *   *Pedagogy:* If the cult were a pedagogical vehicle disposable once the lesson (monotheistic intention) was learned, the tradition would have moved on without looking back. Instead, the liturgy continually rehearses the laws, suggesting the vehicle itself retains value independent of the lesson.
      *   *Constitution:* The persistence of the laws and the prayer for restoration suggest the cult is intrinsically efficacious and permanently ordained. The episode aligns with this: the absence of sacrifice is a metaphysical privation, not a historical graduation.

  3.  **Where the theory misdescribes rather than illuminates.** The theory misdescribes the tradition's experience of 70 CE as a transition to a higher form of worship, whereas the tradition experienced it as exile. The accommodationist account implies a narrative of progress (from crude sacrifice to spiritual prayer), but the rabbinic response is one of loss. This creates a tension for Maimonides: his philosophical explanation in the *Guide* slides naturally toward the view that the cult was fulfilled and abrogated (a view later adopted by Christianity and Reform Judaism), yet his halakhic codification in the *Mishneh Torah* insists the commandments are eternal. The cost of resisting this slide is a disconnect between the *reason* for the commandment (historical contingency) and the *bindingness* of the commandment (eternal divine will). He must assert permanence against the logic of his own historical explanation.

  4.  **The counterfactual.** Pagan sacrifice largely disappeared with the spread of Christianity and Islam, so the historical condition the thesis cites (universal pagan practice) no longer obtains. The persistence of the law does not refute the thesis's claim about the *origin* of the law, but it shows the thesis was only ever an account of why the law was *given*, never a claim about how long it should *last*. The work the thesis is still doing is defensive: it protects God's immutability by explaining why He commanded something seemingly inferior (sacrifice) without admitting He changed His mind. It shifts the change from God to history. However, it leaves the *continuation* of the law unexplained by reason, relying solely on decree.

  5.  **Where the theory is silent.** The episode is a case the thesis never anticipated: a commanded practice outliving its stated reason while remaining binding. The accommodationist theory is silent on why a law given for a transient reason remains obligatory once the reason vanishes. Maimonides has resources to absorb this, specifically the distinction between the *reasons* for the commandments (*ta'amei ha-mitzvot*) and the *decree* of the commandments (*gezerat ha-katuv*). He can argue that the permanence of a commandment is itself part of what was commanded, independent of the historical rationale. However, this costs him elsewhere: it limits the power of rational explanation in religion. If the reason for a law can vanish while the law remains binding, then the reason is not essential to the law's validity. This undermines the project of the *Guide* itself, which seeks to show the law is rational; it admits that at its core, the law rests on will, not reason.
