      *   *Section 2: Testing the Conditions.* Go through the 5 conditions. Highlight where the AI case fails (specifically Common Knowledge and strict Coordination preferences).
      *   *Section 3: Convention Change.* Discuss how $R_{open}$ (early ML) is shifting to $R_{closed}$ (Frontier). Use Lewis's concept of *salience* and *precedent*. Explain that Lewis needs a theory of "salience shock" to explain rapid displacement.
      *   *Section 4: Population and Common Knowledge.* Analyze the heterogeneity of the population. Discuss the opacity problem. Address the AI-as-agent question (cautiously).
      *   *Conclusion:* Summarize the verdict (It's a proto-convention or a failed convention, not a Lewisian convention *yet*).
      *   *Tone Check:* Ensure I sound like a philosopher, not a policy analyst. Use terms like "regularity," "equilibrium," "common knowledge," "salience."
      *   *Constraint Check:* Did I flag extrapolation? Yes. Did I avoid generic norm talk? Yes.

  8.  **Refining the "Coordination" aspect:**
