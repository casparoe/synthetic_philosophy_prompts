      *   *Lewisian Fix:* We both prefer *uniformity* over *fragmentation*, even if we prefer different uniformities. (Battle of the Sexes). If the industry fragments, compatibility breaks, safety standards vanish, regulatory confusion ensues. So, there is a second-order coordination preference. I must make this clear.
      *   *Actually:* Lewis distinguishes conventions from norms enforced by sanctions. If the "norm" is enforced by government regulation, it's not a Lewisian convention. It must be self-policing. The current "norm" of closing weights is driven by fear (safety) and competition (moats), not just matching. This suggests it might *not* be a convention in Lewis's strict sense. I should argue this tension.

