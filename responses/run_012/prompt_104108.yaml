answer: |-
  **The Architecture of Falsehood: Load-Bearing vs. Scaffolding in Economic Models**

  The debate over Milton Friedman's "F-twist"—the thesis that the descriptive falsity of assumptions can constitute a theoretical virtue—has long stagnated between naive realism and blunt instrumentalism. Your colleague offers a sophisticated instrumentalism: unrealism is permissible only as a pragmatic tool relative to a fixed predictive target. To let the target float, she argues, is to invite a "blanket licence for any tractable fiction." You suspect this concedes too much, surrendering the explanatory depth of models to mere predictive accuracy. To adjudicate this, you have proposed a distinction between *scaffolding unrealism* (assumptions that ensure tractability but wash out under relaxation) and *load-bearing unrealism* (assumptions whose falsity is essential to the derivation; relax them, and the result collapses).

  This essay tests that distinction against the standard repertoire of economic modeling. It argues that while your colleague is correct that falsity is never an *intrinsic* good, she is wrong to reduce its value to mere instrumentalism. The load-bearing/scaffolding distinction holds firm against the pressure of target-relativity and ill-defined relaxation. However, it leads to a verdict that refines rather than simply vindicates the F-twist: **descriptive falsity is an epistemic virtue only when it functions as load-bearing unrealism that isolates a causal capacity.** Scaffolding falsity is merely a pragmatic virtue. By conflating the two, the standard debate obscures the specific epistemic work that idealized assumptions perform.

  ### I. Defining the Distinction

  The core of your proposal is counterfactual dependence. An assumption $A$ is **scaffolding** if the model's result $R$ is robust to the truthification of $A$. Formally, if we replace $A$ (false) with $A^*$ (true/realistic), $R$ holds approximately or in the limit. The falsity of $A$ is a computational convenience; the truth is "nearby."

  An assumption $A$ is **load-bearing** if $R$ depends on $A$ being false (or strictly idealized). If we replace $A$ with $A^*$, $R$ disappears, inverts, or becomes indeterminate. Here, the falsity is not a placeholder for a nearby truth; it is a structural condition for the mechanism to operate *as described*.

  This distinction is not about the *degree* of falsity (both may be strictly false), but about the *topology* of the model space surrounding the assumption. Scaffolding assumptions sit on a continuous slope toward truth; load-bearing assumptions sit on a cliff edge.

  ### II. Testing the Stock Cases

  Consider the **frictionless plane** in physics (often imported into economics). If we introduce a small coefficient of friction, the trajectory changes slightly, but the conservation laws and qualitative dynamics remain. The result "washes out." This is **scaffolding**. The falsity is a pragmatic virtue (tractability) but carries no deep explanatory weight regarding the nature of motion itself.

  Now consider **perfect competition** in general equilibrium theory. The assumption that agents are price-takers is descriptively false (agents have some market power). If we relax this to allow for strategic price-setting (monopolistic competition), the result that $Price = Marginal Cost$ does not merely degrade; it inverts to $Price > Marginal Cost$. The efficiency theorem depends on the falsity of the price-taking assumption. This is **load-bearing**.

  Your colleague would argue that perfect competition is virtuous only instrumentally: it allows us to calculate a benchmark. If our target is "predicting actual prices," the assumption is a vice. If our target is "defining efficiency," it is a virtue. She concludes the virtue lies in the target, not the assumption.

  This is where the distinction does work your colleague cannot see. In the scaffolding case (friction), the model claims to describe the *actual* dynamics, merely simplified. In the load-bearing case (perfect competition), the model does not claim to describe the actual market; it claims to describe a *capacity*—the tendency of markets toward efficiency absent strategic friction. The falsity is not a bug; it is the feature that isolates the capacity. If the assumption were true (if agents actually had zero power), the mechanism of *competition* would vanish. The falsity is virtuous because it allows the isolation of a force that is otherwise empirically confounded.

  Consider **Rational Expectations (RE)**. If agents form expectations adaptively, many macroeconomic results (like policy ineffectiveness) vanish. RE is load-bearing. Is this a virtue? Under your colleague's view, only if we fix the target as "long-run equilibrium analysis." But the stronger claim is that RE is virtuous because it isolates the *arbitrage logic* of the system. It tells us what *would* happen if agents fully exploited available information. The falsity of RE (agents aren't actually that rational) is an epistemic virtue because it reveals the *upper bound* of systemic efficiency. It provides a contrastive explanation: "Prices are sticky *because* agents are not fully rational, whereas they *would* clear if RE held." The falsity drives the explanation.

  ### III. The Problem of Ill-Defined Relaxation

  You rightly identify a pressure point: cases where "relaxing" the assumption is not well-defined. Consider the **Representative Agent**. One cannot simply "add a little heterogeneity" as a parameter tweak; moving from one agent to many changes the topological structure of the solution space (e.g., aggregation problems, existence proofs). There is no continuous path from false to true.

  Does the distinction collapse here? No. It sharpens. If there is no continuous path to truth, the assumption cannot be scaffolding. Scaffolding requires that the truth be "nearby" in the model space. If relaxation is ill-defined, the assumption is necessarily **load-bearing**.

  This does not condemn the model. In the case of the Representative Agent, the assumption is load-bearing because it asserts that *distributional effects are irrelevant* to the macro outcome. This is a substantive theoretical claim, not a tractability hack. If the assumption is false (distribution matters), the model fails. But the falsity is epistemically virtuous *if* the goal is to test the hypothesis that distribution is irrelevant. It forces a stark choice: either the macroeconomy is robust to micro-heterogeneity, or our model is wrong. Scaffolding assumptions allow us to slide past this choice; load-bearing assumptions force us to confront it. The "ill-defined" nature of relaxation signals that we are dealing with a structural idealization, not a numerical approximation.

  ### IV. Target Relativity and the Instrumentalist Trap

  Your colleague's strongest move is target relativity. She argues an assumption can be scaffolding for Target A (e.g., aggregate price level) and load-bearing for Target B (e.g., income distribution). Therefore, she concludes, the status of the assumption is not intrinsic to the model but relative to the user's aim. Hence, unrealism is only instrumentally virtuous.

  This argument conflates *relationality* with *instrumentalism*. Yes, the status of an assumption is relative to the *explanandum*. But the *explanandum* is not a whimsical target fixed in advance; it is the phenomenon itself. Whether an assumption is load-bearing is an objective fact about the causal structure of the model relative to the phenomenon.

  If a model of inflation uses Rational Expectations, and we ask "What causes inflation?", RE might be load-bearing. If we ask "What is the average inflation rate over 20 years?", RE might be scaffolding (errors cancel out). Your colleague says this makes the virtue instrumental. I argue it makes the virtue **explanatory**.

  The F-twist fails when it treats all falsity as scaffolding (the "blanket licence"). It succeeds when it recognizes load-bearing falsity as a method of **isolation**. When an assumption is load-bearing and false, the model is not claiming "this is how the world is." It is claiming "this is how this specific force operates." The epistemic virtue lies in the *decomposition* of the causal field.

  If we accept your colleague's view, we must treat the Representative Agent model as a "black box" that predicts aggregates. If we accept the load-bearing view, we treat it as a claim about the *irrelevance of heterogeneity*. The latter is a deeper epistemic stance. It allows the model to be *wrong* in a productive way. A scaffolding assumption that fails is just a calculation error. A load-bearing assumption that fails is a theoretical discovery (e.g., "Distribution *does* matter"). Thus, load-bearing falsity is more epistemically risky, but also more virtuous, because it exposes the theoretical skeleton.

  ### V. Verdict: The Epistemic Status of Falsity

  We can now reach a verdict on the core question: *Can an assumption's descriptive falsity ever be an epistemic virtue in its own right?*

  Your colleague argues **No**: falsity is always a pragmatic cost tolerated for instrumental gain.
  A naive realist argues **No**: falsity is always a vice.
  I argue **Yes**, but with a precise qualification derived from your distinction.

  **Descriptive falsity is an epistemic virtue if and only if it functions as Load-Bearing Unrealism that isolates a causal capacity.**

  1.  **Scaffolding Falsity is Merely Pragmatic:** When an assumption is scaffolding (e.g., frictionless planes, differentiable utility functions), its falsity is not an epistemic virtue. It is a computational shortcut. We would prefer the assumption to be true if it were costless. Its value is purely in tractability. Your colleague is correct here: this is instrumental.
  2.  **Load-Bearing Falsity is Epistemic:** When an assumption is load-bearing (e.g., perfect competition, rational expectations), its falsity *enables the identification of a mechanism*. If the assumption were true, the mechanism might not exist (e.g., if agents truly had no market power, there is no competition). The falsity allows us to model a *capacity* (the tendency toward efficiency) distinct from the *outcome* (actual prices).

  This vindicates the F-twist against the "license for fiction" charge. We are not licensed to use *any* false assumption. We are licensed to use false assumptions *only* when they are load-bearing isolators of capacity. If a false assumption is merely scaffolding, it must be removable (asymptotically). If it is load-bearing, it must be justified by the isolation of a specific causal force.

  Your colleague fears that without a fixed target, the F-twist allows any fiction. The load-bearing/scaffolding distinction prevents this. A "fiction" that is scaffolding but cannot be relaxed is a bad model (brittle). A "fiction" that is load-bearing but isolates no known capacity is a bad model (empty).

  ### Conclusion

  The distinction between load-bearing and scaffolding unrealism does the work you want it to do, provided we do not ask it to do too much. It does not make falsehood *true*. It does not make falsity an intrinsic good in all contexts. But it demonstrates that **load-bearing falsity is constitutive of theoretical understanding**, not merely instrumental for prediction.

  Your colleague concedes too much to the critics by accepting that the value of unrealism is exhausted by its predictive utility. This ignores the explanatory value of *contrast*. We learn from the frictionless plane not because objects actually move without friction, but because the deviation from the frictionless path *measures* the friction. Similarly, we learn from the rational agent not because humans are rational, but because the deviation from rationality *measures* the bounds of arbitrage.

  Therefore, the verdict is this: **Descriptive falsity is an epistemic virtue when it is load-bearing, because it allows for the isolation of causal capacities that are empirically inaccessible in their pure form.** Scaffolding falsity remains a pragmatic necessity. By confusing the two, the standard debate either demonizes all idealization (realism) or justifies all fiction (instrumentalism). Your distinction carve out the middle ground where economic explanation actually lives: in the deliberate, structured use of falsehood to reveal the architecture of possibility.
