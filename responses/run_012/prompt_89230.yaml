  8.  **Final Polish:** Check the Berkeley quote accuracy. Yes, Query 43. Also, mention that Berkeley was interested in *employment*, which adds depth. The grandson's Bitcoin point is a "commodity theory" vs "state theory" clash. I should mention that in the menu.

