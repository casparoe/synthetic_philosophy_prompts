          *   Evaluate each: Trivial/Plausible/False.
          *   Evaluate support for the podcaster's conclusion (gov can't go bankrupt).
          *   Address the "no fact of the matter about worth" reading (coherent or collapses?).
          *   Format: Menu with verdicts, not a smooth essay.
          *   Tone: Respectful of scientific background, precise, avoiding unnecessary jargon.

  2.  **Initial Brainstorming (Internal Monologue/Drafting):**
