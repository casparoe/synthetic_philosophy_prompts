prompt: |-
  I'm putting together a unit for a seminar on promises and contracts, and I keep running into the same problem: every account of why promises bind seems to be built to handle two or three pet cases and then quietly ignores everything else. My brother-in-law, who does commercial law, insists none of this matters because consideration does all the work, which is exactly the kind of thing I need a proper spec to adjudicate. So before I make the students read any more of these accounts, I want the desiderata first. Not a survey and not who-said-what: the requirements themselves, each with the case or consideration that puts it on the list, and for each one your call on whether it's non-negotiable or just a house preferance of some camp. Assume the thing has to be good enough that I can actually use it to decide a hard case in class without hand-waving, and that it's a theory of promising specifically, not of obligation in general.

  Here's the sort of thing I expect on the list, though add what I've missed and cut what's just prejudice. It has to explain how a few words can manufacture a reason where none existed — the bootstrapping trick — without also licensing me to obligate other people by fiat, and it has to say what promising does that contracts, gratitude, role obligations, and merely causing someone to rely on me don't already do. It has to handle the promise the promisee never learns about, doesn't rely on, or wouldn't have cared about; the vague or open-ended promise, like telling a friend at a wedding that I'll always be there for them, and the deliberately blank promise where I agree now to do whatever is asked of me later; the promise to someone who's since died, the promise to my future self, and the promise made to a group rather than to any particular person; the promise extracted by a threat and the promise to do something plainly wrong; and release — why only the promisee can let me off the hook, and whether a release given under pressure leaves any residue behind. I want it to be honest about whether it's a theory of a social practice, so that the bindingness is contingent on the practice being around, or of something that would bind even in a society with no such practice. And it should say what happens to a promise made on your behalf — say your assistant, human or otherwise, tells a colleague you'll have the draft by Friday and you never agreed to anything. Finally it has to locate the wrong where the wrong is: when I break a promise, the promisee seems to have a special standing to resent it and not just a reason to be disappointed, and the theory should earn that rather than assume it.

  Then flag the collisions — the places where two items on your list can't both be had, or where satisfying one quietly makes another trivial. My own suspicion is that the bootstrapping requirement and the standing requirement pull against each other, and that anything grounding promising in the value of reliance is going to be embarrassed by the promisee-who-doesn't-care case, but tell me where I'm wrong. Skip the scorecard of the usual suspects at the end; I'd rather you spend the words on which single requirement does the most to eliminate candidates, and why.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Create a list of desiderata (requirements) for a theory of promising/contracts for a seminar unit.
      *   **Constraint 1:** No survey of theories (who said what). Focus on the requirements themselves.
      *   **Constraint 2:** Each requirement must be linked to a specific case or consideration that motivates it.
      *   **Constraint 3:** Classify each requirement as "Non-Negotiable" (must be met by any viable theory) or "House Preference" (contingent on specific philosophical camps).
      *   **Constraint 4:** The theory must be specific to *promising*, not general obligation.
      *   **Constraint 5:** Address specific hard cases mentioned (bootstrapping, third-party obligation, reliance vs. non-reliance, vague/open-ended promises, dead promisees, future self, group promises, coercion, immorality, release, agency/assistant, standing to resent).
      *   **Constraint 6:** Address the metaphysical status (social practice vs. natural kind).
      *   **Constraint 7:** Identify collisions/tensions between desiderata.
      *   **Constraint 8:** Identify the single most eliminative requirement and explain why.
      *   **Tone:** Rigorous, philosophical, direct, avoiding hand-waving. Suitable for a seminar instructor.

  2.  **Deconstruct the Input Cases & Themes:**
      *   *Bootstrapping:* How words create reasons.
      *   *Third-Party Fiat:* Why I can't obligate *you* to *him*.
      *   *Differentiation:* Promise vs. Contract (consideration), Gratitude, Role, Reliance.
      *   *Non-Reliance:* Promisee doesn't know/care/rely.
      *   *Vagueness:* "Always be there."
      *   *Blank Check:* "Do whatever is asked."
      *   *Dead Promisee:* Obligation persists?
      *   *Future Self:* Ulysses pacts.
      *   *Group/Indefinite:* Promise to "humanity" or a crowd.
      *   *Coercion/Immorality:* Duress, illegal acts.
      *   *Release:* Power of promisee to waive.
      *   *Agency:* Assistant promising for me.
      *   *Standing:* Special right to resent (not just disappointment).
      *   *Metaphysics:* Practice-dependent vs. Practice-independent.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Normative Creation (Bootstrapping).* Needs to explain how an utterance creates an obligation without magic.
          *   *Case:* The bare promise ("I'll be there").
          *   *Status:* Non-Negotiable. If it doesn't explain this, it's not a theory of promising.

      *   *Requirement 2: Agency Control (No Third-Party Fiat).* I can't bind you.
          *   *Case:* "I promise my brother you will mow his lawn."
          *   *Status:* Non-Negotiable. Violates autonomy.

      *   *Requirement 3: Reliance Independence.* Must handle cases where no reliance occurs.
          *   *Case:* Secret promise, or promisee doesn't care.
          *   *Status:* Non-Negotiable. (This targets reliance theories like Fried's critique of Atiyah).

      *   *Requirement 4: Content Specificity vs. Openness.* Must distinguish binding promises from vague assurances.
          *   *Case:* "I'll always be there" vs. "I'll pick you up at 5."
          *   *Status:* House Preference (some theories allow moral bindingness for vague ones, legal theories require certainty). Let's mark as Non-Negotiable for *enforceability*, but maybe House Preference for *moral bindingness*. Let's stick to the prompt's focus on "bindingness." I'll classify as Non-Negotiable for a theory of *contracts/promises* as distinct from hopes.

      *   *Requirement 5: The Release Power.* Only promisee can waive.
          *   *Case:* Asking to be let off the hook.
          *   *Status:* Non-Negotiable. Distinguishes from duty to state/law.

      *   *Requirement 6: The Standing to Resent.* Promisee has special authority to blame.
          *   *Case:* Third party says "you broke your promise," promisee says "actually we're cool."
          *   *Status:* Non-Negotiable. This is the phenomenology of promising.

      *   *Requirement 7: Illocutionary Authority (Agency).* Who can speak for whom?
          *   *Case:* The assistant promising for the boss.
          *   *Status:* Non-Negotiable. Distinguishes promise from prediction or order.

      *   *Requirement 8: Moral Constraints.* Can you promise to kill?
          *   *Case:* Promise to do something wrong.
          *   *Status:* Non-Negotiable (with nuance). Most agree immoral promises don't bind.

      *   *Requirement 9: Practice Dependence.* Is it natural or social?
          *   *Case:* Robinson Crusoe promising himself or a non-practice society.
          *   *Status:* House Preference. This is a deep metaphysical split (Rawls vs. Shiffrin).

      *   *Requirement 10: Consideration/Distinction from Contract.*
          *   *Case:* Gratuitous promise vs. Bargain.
          *   *Status:* House Preference. (The brother-in-law's point). A *theory of promising* must explain gratuitous promises. A *theory of contract law* might not. The prompt asks for a theory of *promising*. So, explaining gratuitous bindingness is Non-Negotiable for promising, even if Contract Law ignores it.

  4.  **Refining and Pruning:**
      *   *Consolidate:* "Bootstrapping" and "Normative Creation" are the same.
      *   *Consolidate:* "Standing" and "Release" are linked (Authority over the obligation).
      *   *Add:* The "Future Self" and "Dead Promisee" cases challenge the *interpersonal* nature.
      *   *Add:* The "Blank Check" challenges the *content* requirement.

  5.  **Addressing Collisions:**
      *   *Bootstrapping vs. Autonomy:* If words create reasons, do they override future autonomy?
      *   *Reliance vs. Non-Reliance:* The classic tension.
      *   *Practice vs. Natural:* If it's a practice, does it lose moral force?
      *   *Standing vs. Morality:* If the act is immoral, does the promisee still have standing to resent non-performance? (Paradox: They should resent performance).

  6.  **Identifying the "Killer" Desideratum:**
      *   Which one kills the most theories?
      *   *Reliance Independence* kills Atiyah/Posner (economic/reliance theories).
      *   *Practice Independence* kills Rawls (practice view).
      *   *Standing* kills simple utilitarianism.
      *   *Selection:* **The Standing to Resent (Authority Transfer).** It's the hardest to get right without assuming the conclusion. It forces the theory to explain *why* the promisee owns the obligation. Reliance theories fail here (third parties rely too). Will theories fail here (why does *my* will bind *me* to *you* specifically?).

  7.  **Drafting the Content (incorporating the "Voice"):**
      *   Keep it sharp. No fluff.
      *   Use the terminology requested (Non-Negotiable vs. House Preference).
      *   Ensure the "Brother-in-Law" (Consideration) point is addressed (Consideration is a legal filter, not a moral explanation).

  8.  **Review against Constraints:**
      *   *Did I survey theories?* No.
      *   *Did I link cases?* Yes.
      *   *Did I classify?* Yes.
      *   *Did I address collisions?* Yes.
      *   *Did I pick the eliminative requirement?* Yes.
      *   *Is it specific to promising?* Yes.

  9.  **Final Polish:** Check the "Assistant/Agency" point. That's crucial for the "fiat" constraint. Check the "Dead Promisee" point (who holds the right?). Check the "Blank Check" (indefiniteness).

      *(Self-Correction during drafting)*: I need to make sure I don't conflate Contract Law and Moral Promising. The prompt asks for a theory of *promising* to adjudicate a seminar on *promises and contracts*. The brother-in-law says consideration does the work. The prompt implies the user wants a moral/philosophical spec to test the legal rule against. I must clarify that Consideration is a *screening mechanism*, not an *explanatory theory*.

      *(Refining the "Standing" point)*: This is often called the "Authority Condition" or "Second-Personal Reason." I should use clear language.

      *(Refining the "Collisions")*: The tension between "Bindingness despite no reliance" and "Bindingness requires social utility" is key.

      *(Refining the "Killer")*: I'll stick with **The Standing/Authority Requirement**. It's the specific differentiator between a promise and a prediction of reliance.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a specification of desiderata for a theory of promising, structured to adjudicate the hard cases you listed. I have distinguished between **Non-Negotiables** (conditions any theory must meet to count as a theory of promising) and **House Preferences** (conditions that reflect specific philosophical commitments, where a theory might fail but remain viable within a specific camp).

  ### The Desiderata

  **1. The Normative Creation Condition (Bootstrapping)**
  *   **The Case:** The bare promise ("I will pick you up at 5") made in a vacuum.
  *   **The Requirement:** The theory must explain how a voluntary utterance transforms a permissible option into a mandatory obligation without invoking magic or circularity (i.e., "it binds because there is a practice of binding"). It must identify the mechanism by which the *intent* to be bound generates the *reason* to be bound.
  *   **Status:** **Non-Negotiable.** Without this, you have a theory of prediction or hope, not promising.

  **2. The Autonomy Constraint (No Third-Party Fiat)**
  *   **The Case:** I tell your neighbor, "I promise you that *my brother* will mow your lawn."
  *   **The Requirement:** The theory must explain why I can obligate *myself* to you, but I cannot obligate *you* to him, nor can I obligate *myself* to *him* via a promise made to *you*. The power to create the obligation must track the agent's own will and the specific dyadic relationship.
  *   **Status:** **Non-Negotiable.** Violating this treats persons as resources rather than agents.

  **3. The Reliance Independence Condition**
  *   **The Case:** The secret promise (you promise to visit a grave; the promisee dies unaware) or the indifferent promisee (you promise to send a book; they explicitly say "don't bother, I won't read it," but you insist).
  *   **The Requirement:** The theory must account for bindingness in the absence of detrimental reliance or expectation. If the theory relies solely on harm prevention or expectation damages, it fails here.
  *   **Status:** **Non-Negotiable.** This is the primary fault line between promise theories and tort/reliance theories.

  **4. The Authority Transfer Condition (Standing to Resent)**
  *   **The Case:** You break a promise to me. A third party scolds you. I say, "It's fine, I release him."
  *   **The Requirement:** The theory must explain why the promisee acquires a specific *authority* over the promisor's action that third parties lack. It must explain the "ownership" of the obligation. This includes the power of release (waiver).
  *   **Status:** **Non-Negotiable.** This distinguishes promising from general moral duties (e.g., I have a duty not to kill, but no specific person owns that duty and can waive it for me).

  **5. The Content Determinacy Condition**
  *   **The Case:** The vague promise ("I'll always be there for you") vs. the blank check ("I'll do whatever you ask later").
  *   **The Requirement:** The theory must provide a threshold for when an utterance is too indeterminate to create an obligation. It must distinguish between a binding commitment and a statement of current intention or sentiment.
  *   **Status:** **Non-Negotiable.** Without this, the Normative Creation Condition becomes limitless (I could accidentally obligate myself to anything).

  **6. The Moral Constraint Condition**
  *   **The Case:** The promise to do something wrong ("I promise to help you hide the body").
  *   **The Requirement:** The theory must explain why immoral promises fail to bind (or bind only to the extent of apology for making them), without collapsing back into general morality (i.e., it's not just that the act is wrong, but that the *promise* adds nothing).
  *   **Status:** **Non-Negotiable.** A theory that says "a promise to kill binds you to kill" is reductio ad absurdum.

  **7. The Agency Attribution Condition**
  *   **The Case:** The assistant's promise ("My boss will have the draft by Friday").
  *   **The Requirement:** The theory must specify the conditions under which one agent can bind another. It must distinguish between a report of the principal's will and the creation of a new obligation by the agent.
  *   **Status:** **Non-Negotiable.** Essential for commercial contexts and the "fiat" constraint.

  **8. The Persistence Condition (Death and Time)**
  *   **The Case:** The promisee dies; the promise to future self.
  *   **The Requirement:** The theory must state whether the obligation survives the relationship that grounded it. If the promisee dies, does the right transfer to heirs, or does the obligation vanish? If I promise my future self, is it a promise or a plan?
  *   **Status:** **House Preference.** (See Collisions). Some theories hold obligations are essentially relational and die with the relata; others hold they become duties to the "memory" or "estate."

  **9. The Practice Dependence Condition**
  *   **The Case:** Robinson Crusoe promising himself, or a society with no concept of promising.
  *   **The Requirement:** The theory must declare whether promising is a *natural kind* of moral interaction (available to any rational agent) or a *social institution* (binding only because we collectively uphold it).
  *   **Status:** **House Preference.** This is the Rawls (Practice) vs. Shiffrin/Scanlon (Natural) split. A theory can be viable either way, but it must pick a lane.

  **10. The Consideration Filter (The Brother-in-Law Clause)**
  *   **The Case:** Gratuitous promise vs. Bargain.
  *   **The Requirement:** The theory must explain why the law enforces bargains more readily than gifts, without denying that gratuitous promises generate *moral* obligations.
  *   **Status:** **House Preference.** This is a theory of *Contract Law*, not *Promising*. A theory of Promising must explain why gratuitous promises bind morally. A theory of Contract can legitimately say "we only enforce those with consideration for evidentiary/cautionary reasons." Do not conflate the two.

  ---

  ### The Collisions

  You suspected tensions; here is where the theory will break if you aren't careful.

  **1. Bootstrapping vs. Autonomy (The Binding Future Self Problem)**
  *   **The Collision:** If words create reasons (Bootstrapping), they constrain my future will. If my future will is sovereign (Autonomy), how can my past will bind it?
  *   **The Risk:** Theories that solve Bootstrapping by appealing to the "sanctity of will" often fail to explain why I can't change my mind later (Autonomy). Theories that prioritize Autonomy often fail to explain why the promise binds at all (Bootstrapping).
  *   **Resolution Path:** You must decide if the obligation comes from the *act* of willing (which persists) or the *reliance* it causes (which is external).

  **2. Reliance Independence vs. Social Utility**
  *   **The Collision:** If you ground promising in social utility (we need promises to function), you struggle with the "Secret Promise" or "Indifferent Promisee" cases (Reliance Independence). If no one relies and no social practice is bolstered, why is it wrong to break it?
  *   **The Risk:** Utilitarian accounts usually fail the Reliance Independence test. They have to argue that *general* reliance is harmed even by secret breaches, which is empirically shaky.
  *   **Resolution Path:** Move to a deontological account (duty to truth/consistency) or a second-personal account (authority transfer).

  **3. Authority Transfer vs. Moral Constraint**
  *   **The Collision:** If the promisee *owns* the obligation (Authority Transfer), they should be able to waive it. But if the promise is to do something immoral (Moral Constraint), they *shouldn't* be able to waive it (you shouldn't help hide the body even if they say "actually, don't bother").
  *   **The Risk:** If the promisee has total authority, they can command immorality. If morality trumps authority, the promisee's authority was never real.
  *   **Resolution Path:** Distinguish between the *obligation to perform* (void if immoral) and the *obligation to account* (still owe an apology/explanation).

  **4. Practice Dependence vs. Normative Force**
  *   **The Collision:** If promising is just a social practice (Practice Dependence), it seems contingent. If the practice dies, the obligation dies. But we feel promises bind even in corrupt societies where the practice is broken.
  *   **The Risk:** Practice views make promising feel like a game (like baseball rules). Natural views make it feel like magic (how does the rule exist without the game?).
  *   **Resolution Path:** Hybrid views (the practice provides the *mechanism*, but the moral duty to keep one's word is natural).

  ---

  ### The Eliminative Requirement

  If you want to cut the field of candidates down quickly, apply **The Authority Transfer Condition (Standing to Resent)**.

  **Why this eliminates the most candidates:**

  1.  **It kills Reliance Theories (e.g., Atiyah, Posner):** In a reliance model, the wrong is causing harm. But third parties can rely on my statements too. If I announce "I will do X" and a stranger relies on it, I may owe them damages in tort, but they do not have the *standing* to release me from the obligation, nor do they have the specific standing to resent non-performance as a *betrayal* rather than a loss. Reliance explains the *damage*, but not the *relationship*.
  2.  **It kills Simple Utilitarianism:** A utilitarian calculation is agent-neutral. Anyone who can calculate the utility has standing to judge the act. But promising is agent-relative; only the promisee holds the "key" to the obligation. Utilitarianism cannot easily explain why the promisee's waiver trumps the general utility of performance.
  3.  **It kills Pure Will Theories (without modification):** If promising is just an exercise of my will, why does *your* will get to release me? If I bind myself, I should have to unbind myself. The fact that *you* hold the power of release proves the obligation is not just internal to the promisor; it is a transfer of normative control.

  **How to use it in class:**
  Take the "Release" case. Ask the student: "If the obligation is just about harm (reliance), why can the promisee waive it even if they *still* suffer harm from non-performance?" (e.g., "I know you're out of money, I release you from the debt.")
  If the obligation is about harm, the release shouldn't matter.
  If the obligation is about *authority*, the release is the exercise of that authority.

  Any theory that cannot explain why the promisee holds a **normative power** over the promisor that no one else holds is not a theory of promising; it is a theory of harm, prediction, or social coordination. This requirement forces the student to locate the specific *interpersonal* mechanism of the promise, which is the only thing that distinguishes it from the rest of morality.
