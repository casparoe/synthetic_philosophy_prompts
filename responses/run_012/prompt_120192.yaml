answer: |-
  ### Exam Question

  **Question 4 (20 Marks)**

  Consider two variants of Pascal's Mugging. In **Variant A (Gain)**, a stranger demands $5, promising a finite but astronomically large reward if paid, with a probability you cannot principledly bound from below. In **Variant B (Threat)**, the stranger demands $5, threatening an astronomically large loss if unpaid, at the same unbounded minuscule probability.

  Students typically regard Variant A as absurd but Variant B as frightening. Write an essay addressing the following:

  1.  Does standard Expected Utility (EU) theory justify this asymmetry, or is it an illusion?
  2.  Defend a position on whether the Mugging constitutes a *reductio* of EU maximization or a *reductio* of our anti-fanatic intuitions.
  3.  Explain why "quick fix" repairs (such as capping utility functions or imposing probability cutoffs) are often criticized as ad hoc, and sketch what a principled resolution would require sacrificing.

  ***

  ### Model Answer

  Standard Expected Utility (EU) theory treats Variant A and Variant B as mathematically symmetric. In both cases, the expected value is the product of a probability $p$ and a utility magnitude $U$. Whether $U$ is positive (reward) or negative (threat), if $p$ is non-zero and $U$ is sufficiently large, the product $|p \times U|$ dominates any finite cost (like $5). Consequently, the asymmetry in student reaction—finding the gain absurd but the threat frightening—is not justified by the theory; it is a psychological illusion.

  This illusion stems from evolved heuristics rather than rational calculation. Human cognition exhibits loss aversion; we weigh potential losses more heavily than equivalent gains. Furthermore, threats trigger high-alert risk management systems that prioritize avoiding catastrophe over maximizing gain. However, from the perspective of normative decision theory, a rational agent should be indifferent to the sign of the utility when the magnitudes and probabilities are identical. To treat the threat as credible while dismissing the promise is to violate the consistency requirements of EU maximization. One cannot consistently hold that $p \times 10^{100}$ is negligible in one case but decisive in the other without introducing a bias not found in the axioms.

  Regarding the second prompt, the Mugging is best understood as a *reductio* of our anti-fanatic intuitions, not of EU itself. EU maximization is derived from axioms of consistency (transitivity, continuity, independence). To reject EU because it yields counterintuitive results in extreme cases is to privilege psychological comfort over logical coherence. If we accept the axioms, we must accept their implications, even when they demand we pay the mugger. The intuition that we should not pay is a heuristic that works well in evolutionary environments where such probabilities are truly zero, but it fails in abstract logical space. A rational agent must update on the possibility, however small, that their intuition is the error, not the math.

  However, accepting "fanaticism" (acting on tiny probabilities of huge utilities) comes at a steep cost. This leads to the third prompt: why simple repairs fail. Proposals to cap utility functions (bounded utility) or impose probability cutoffs (treating $p < \epsilon$ as zero) are widely criticized as ad hoc. A utility cap violates the principle that more is better; it implies that at some point, saving a billion lives is no more valuable than saving one million. Similarly, a probability cutoff violates the axiom that no empirical event should be assigned probability zero unless it is logically impossible. Setting a specific cap or cutoff is arbitrary; why bound utility at $10^{100}$ rather than $10^{101}$? Without a deep theoretical justification, these are merely "fixes" designed to output the desired intuition rather than solve the underlying inconsistency.

  A principled resolution requires sacrificing either the unboundedness of the hypothesis space or the linearity of expectation. A more robust approach lies in epistemic constraints rather than decision-theoretic hacks. For instance, one might argue that hypotheses promising astronomical leverage are inherently complex and should be penalized by a complexity prior (Occam's razor). If the probability drops faster than the utility rises as the claim becomes more extravagant, the expected value converges. However, this sacrifices the assumption that probability and utility are independent variables. Alternatively, one might accept that rational agents *are* vulnerable to mugging in principle, but that real-world agents lack the computational capacity to process such extremes. Ultimately, preserving EU requires admitting that rationality can demand actions that feel insane, or else we must fundamentally rewrite how probability attaches to high-stakes claims.

  ***

  ### Marking Scheme

  **Total: 20 Marks (5 Criteria × 4 Marks each)**

  **1. Identification of Theoretical Symmetry**
  *   **Full Marks:** Clearly states that EU treats Gain and Threat symmetrically ($p \times U$ works identically for positive and negative values) and concludes the student asymmetry is theoretically unjustified.
  *   **Common Error:** Claims the threat is inherently more credible or that negative utility weighs heavier *within the math* of standard EU.

  **2. Explanation of Psychological Source**
  *   **Full Marks:** Attributes the asymmetry to external factors like loss aversion, status quo bias, or evolutionary heuristics rather than logical differences in the scenario.
  *   **Common Error:** Treats the fear of loss as a rational input to the model rather than a bias to be corrected.

  **3. Stance on EU vs. Intuition**
  *   **Full Marks:** Takes a definitive side (either EU is right/intuitions wrong, or EU must be discarded) and justifies it via axiomatic coherence vs. psychological comfort.
  *   **Common Error:** Hedges ("it depends") or argues both are equally valid without resolving the normative conflict.

  **4. Critique of Ad Hoc Repairs**
  *   **Full Marks:** Explains *why* caps/cutoffs are arbitrary (e.g., violates continuity, "where do you draw the line?") and notes they prioritize desired outputs over axiomatic consistency.
  *   **Common Error:** Lists capping/cutoffs as viable solutions without explaining why they are considered theoretically problematic or arbitrary.

  **5. Principled Trade-off**
  *   **Full Marks:** Identifies what a real fix costs (e.g., independence of probability/utility, complexity priors, or accepting fanaticism) rather than just proposing a patch.
  *   **Common Error:** Proposes a utility cap as a "principled" solution without acknowledging the axiomatic violation involved.
