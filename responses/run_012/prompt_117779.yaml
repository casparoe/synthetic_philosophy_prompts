      Also, on the Spectrometer case: The Chemist says the property is graded. The Logician says the *classification* is binary. I need to make sure the disagreement is about what that implies for *language*, not just chemistry.
      On Higher-Order Vagueness: Supervaluationism is often accused of just moving the vagueness up a level. I need to make sure the Chemist's prediction acknowledges this tension.

  8.  **Final Polish:** Check tone. Ensure it sounds like a document two stubborn academics could actually sign. No fluff. No citations. Tight.

      *Refining the "Fact of the Matter" diagnosis:* The Epistemicist thinks "fact of the matter" = truth value exists. The Supervaluationist thinks "fact of the matter" = determinacy across precisifications. This is a key verbal divergence masking a real logical one.

      *Refining the Spectrometer:* The Chemist sees the machine as *imposing* a cut on a continuum. The Logician sees the machine as *revealing* that cut-offs are functional. The crux is: Does the functional cut-off prove the *concept* allows a cut-off?

      *Refining the Stipulation:* The Chemist sees stipulation as *changing* the game. The Logician sees it as *completing* the game.

