answer: |-
  # JOINT STATEMENT ON VAGUENESS AND BOUNDARIES

  **Parties:** The Logician (Epistemicist) and The Chemist (Supervaluationist)
  **Scribe:** Neutral Philosopher of Language
  **Date:** October 26, 2023

  ### I. AGREED CLAIMS
  *We both sign below to the following propositions. These are not concessions; they are the shared foundation of our dispute.*

  1.  **Non-Onticity:** Vagueness is not a feature of the world itself. Atoms, molecules, and physical magnitudes are not vague; representations (language, concepts, predicates) are. We reject ontic vagueness.
  2.  **The Sorites Structure:** The Sorites Paradox is a valid argument form with premises that appear true and a conclusion that is manifestly false. The solution requires rejecting at least one premise, not denying the validity of the inference.
  3.  **Competent Ignorance:** A competent speaker, possessing full non-semantic knowledge of a borderline case (e.g., exact height, exact grain count), cannot correctly identify whether the vague predicate applies. This inability is not due to a lack of effort or data.
  4.  **Utility:** Vague predicates are not defects to be eliminated from language. They serve essential communicative functions that precise predicates do not.
  5.  **Classical Inference:** We both aim to preserve the core utility of classical logic (Modus Ponens, etc.) for ordinary reasoning. We differ on *why* it is preserved, but we agree it should not be abandoned for intuitionistic logic unless absolutely forced.
  6.  **No Error Theory:** We reject the view that competent speakers are systematically mistaken when they use vague terms. When a speaker says "He is tall" of a paradigmatically tall man, they speak truly.

  ---

  ### II. TABLE OF REAL DISAGREEMENTS
  *We disagree on the metaphysical and semantic explanation of the phenomena above. Each position is phrased by its proponent.*

  | Feature | The Logician (Epistemicism) | The Chemist (Supervaluationism) |
  | :--- | :--- | :--- |
  | **The Boundary** | There is a sharp boundary in the extension of every vague predicate. There is a specific number of grains $n$ such that $n$ is a heap and $n-1$ is not. | There is no sharp boundary. The extension is indeterminate. There is no specific number $n$ that marks the transition; there is only a transition region. |
  | **Truth Values** | Bivalence holds. Every declarative sentence involving a vague predicate is either True or False, even in borderline cases. We simply cannot know which. | Bivalence fails. Borderline sentences are neither True nor False. They suffer from a truth-value gap. |
  | **The Nature of Ignorance** | Our inability to locate the boundary is **epistemic**. The fact exists; our access to it is blocked by the nature of meaning and use. | Our inability to locate the boundary is **semantic**. There is no fact to access. The meaning of the word underdetermines its application here. |
  | **Truth Definition** | Truth is correspondence to a unique state of affairs determined by usage and external factors. | Truth is **Supertruth**. A sentence is true iff it is true on all admissible ways of making the predicate precise (precisifications). |
  | **Logic** | Classical logic is preserved because the world (and language) is classical. Bivalence is a law of truth. | Classical logic is preserved because validity is defined as truth-preservation across *all* precisifications. Bivalence is not required for validity. |

  ---

  ### III. CRUXES AND TEST CASES
  *We identify three specific areas where our theories yield different predictions or explanations. We record our predictions in advance.*

  #### 1. Higher-Order Vagueness
  **The Issue:** If "tall" has a boundary (or a gap), does the predicate "definitely tall" also have a boundary (or a gap)? Or does introducing "definitely" create a new sharp line where there wasn't one before?

  *   **The Logician's Prediction:** There is a sharp boundary between "definitely tall" and "not definitely tall." It is a fact of the matter where this boundary lies, even if we cannot know it. Vagueness is ignorance all the way up.
  *   **The Chemist's Prediction:** "Definitely tall" is also vague. There is no sharp boundary between the definitely tall and the borderline tall. However, I admit the risk: if I say the boundary of "definitely" is also gappy, I risk an infinite regress. My claim is that the *gap* remains, not that it moves.
  *   **Agreed Test Case:** A series of 100 men ranging from 7ft to 5ft. We isolate the transition zone for "tall." We then ask: "Is it *definitely true* that Man #45 is tall?"
  *   **Stakes:** If the Chemist admits a sharp boundary for "definitely," Supervaluationism collapses into Epistemicism at the second order. If the Logician admits no sharp boundary for "definitely," Epistemicism loses its claim to classical clarity.

  #### 2. The Spectrometer Case (Lab Analogy)
  **The Issue:** In the Chemist's lab, a spectrometer registered a binary "Pass/Fail" based on a fixed threshold (e.g., absorbance > 0.5), despite the underlying chemical concentration being a continuous variable.

  *   **The Chemist's Prediction:** The device imposes a binary output on a continuous input. This proves that **classification** can be sharp while the **property** is graded. The existence of the device does not imply the chemical property "high concentration" has a natural sharp boundary. Language is like the chemical property, not the device.
  *   **The Logician's Prediction:** The device demonstrates that a sharp boundary is functionally coherent even over a continuous substrate. Our cognitive faculties act like the spectrometer. The fact that we *can* operate with a cutoff (in the lab) shows that sharp boundaries are not metaphysically impossible for graded properties. Language *is* the device.
  *   **Agreed Test Case:** A sample reads 0.4999. The device says "Fail."
      *   **Chemist:** The *report* is "Fail," but the *sample* is borderline for "high concentration."
      *   **Logician:** The *sample* is "Fail" relative to the operational context. The boundary is real relative to the practice.
  *   **Stakes:** Does the existence of a functional cutoff prove the *concept* supports a cutoff (Logician), or does it prove we are *imposing* a cutoff on a concept that lacks one (Chemist)?

  #### 3. The Stipulated Authority
  **The Issue:** A regulator declares: "Residue > 0.05mg is Unsafe." A sample contains 0.0499mg.

  *   **The Chemist's Prediction:** This is a **precisification**. The regulator has sharpened a vague term for legal purposes. Below the line, the term "unsafe" is technically false by rule, but semantically, the old vagueness lingers. The stipulation does not reveal a pre-existing fact; it creates a new rule.
  *   **The Logician's Prediction:** This shows that vague terms *have* extensions that can be pinpointed. The stipulation fixes the meaning. If the rule says 0.05, then 0.0499 is safe, full stop. The "lingering vagueness" is just psychological hesitation, not semantic reality.
  *   **Agreed Test Case:** Is the statement "0.0499mg is unsafe" True or False?
      *   **Chemist:** False by regulation, but Indeterminate by ordinary semantics.
      *   **Logician:** False. The regulation fixes the extension of the term in this context.
  *   **Stakes:** Does stipulation *discover* a boundary capacity inherent in the term (Logician), or does it *replace* the term with a new, precise technical term (Chemist)?

  ---

  ### IV. DIAGNOSIS: VERBAL VS. REAL DISPUTE

  As scribe, I offer this assessment of where you are talking past each other and where you are truly divided.

  **1. The Verbal Dispute: "Fact of the Matter"**
  You are using this phrase differently.
  *   **Logician:** You mean "Truth-Conditional Determinacy." For you, a fact of the matter exists if the sentence has a truth value (T or F) determined by the world + meaning.
  *   **Chemist:** You mean "Semantic Determinacy." For you, a fact of the matter exists only if the meaning *itself* singles out a specific extension without needing arbitrary selection.
  *   **Resolution:** You agree that the sentence "This man is tall" is determined by the world and meaning. You disagree on whether that determination yields a unique value (Logician) or a set of admissible values (Chemist). This is a technical disagreement masked by a shared phrase.

  **2. The Real Dispute: Bivalence and Ignorance**
  This is not verbal. This is a clash over the architecture of logic.
  *   **The Core:** The Logician insists that *Ignorance implies Existence*. If we can't know the boundary, it must be there to be known. The Chemist insists that *Ignorance implies Indeterminacy*. If we can't know the boundary, it may be because there is nothing to know.
  *   **The Stakes:** If the Logician is right, Classical Logic is fundamental to reality. If the Chemist is right, Classical Logic is a tool we preserve by redefining "Truth" (as Supertruth).
  *   **Why it matters:** It changes how you treat the Sorites. The Logician says one premise is *false* (we just don't know which). The Chemist says one premise is *neither true nor false*. This changes the logical derivation of the paradox.

  **Final Note:**
  You are not arguing about whether people *feel* vague. You agree on that. You are arguing about whether the logic of our language mirrors the logic of the world (Logician) or whether the logic of our language is a multi-valued system that we project onto the world (Chemist). The Spectrometer case is your best hope for resolution: if you can agree on whether the machine *models* language or *contrasts* with it, you will move.
