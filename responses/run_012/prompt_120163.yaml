          2.  Within Perdurantism: Worm View vs. Stage View. Does Billy's passivity/disconnection fit one better? Is he an enduring person or a string of stages?
          3.  Ethics: Does the metaphysics license the "So it goes" shrug? Does eternalism make death less bad? Address the tension between Tralfamadorian serenity and Dresden fury. What does the novel do that a philosophy paper can't?
      *   **Constraints:** Under 800 words. No citations/reading lists. Mark what is settled vs. contested in metaphysics. Keep it nuanced (no consensus claims where none exist).

  2.  **Deconstruct the Metaphysics:**
      *   *Eternalism vs. Presentism:* Eternalism (past, present, future equally real) is the Tralfamadorian view. Presentism (only now is real) is the human default. This is contested, though Eternalism has strong support in relativity.
      *   *Endurantism vs. Perdurantism:* How objects persist through time. Endurantism (wholly present at each moment) vs. Perdurantism (extended in time, have temporal parts). This is highly contested.
      *   *Worm View vs. Stage View:* Both are perdurantist. Worm = the whole spacetime worm is the person. Stage = only the current momentary slice is the person; talk of persistence is about counterparts.
      *   *Moving Spotlight:* Eternalism + Endurantism + Privileged Present.

  3.  **Drafting - Section by Section:**

      *   *Introduction:* Acknowledge the standard reading (Tralfamadorians = B-theory/Block Universe) but pivot to the persistence question.
      *   *Eternalism vs. Persistence:* The Tralfamadorian view is clearly Eternalist (all times exist). But does this force Perdurantism? Not necessarily. One could hold that Billy is wholly present at every moment in the block (Eternalist Endurantism). However, the novel's form suggests something else. The non-linear narrative treats moments as accessible locations, like spatial parts. This leans toward Perdurantism, but the *experience* of Billy suggests a fragmentation that challenges simple worm theory.
      *   *Worm vs. Stage:* Billy is passive. He "comes loose." He doesn't seem to be a unified agent controlling the worm. Stage theory fits the phenomenology of his trauma better: each "Billy" is a momentary stage, linked causally but not by a strong enduring self. The narration holds the stages together, not Billy's agency. This is contested in metaphysics (which is the true account of persons?), but the text favors the stage-like fragmentation.
      *   *Ethics:* The "So it goes" shrug. Does Eternalism negate the badness of death? Philosophically, this is contested. The "loss" view says death is bad because it deprives us of future goods, regardless of whether the past exists. The Tralfamadorian view says death is just a bad moment in a whole that exists eternally. Vonnegut complicates this. The serenity is alien; the human anger (Dresden) remains. The novel shows the *comfort* of the metaphysics is a coping mechanism, not necessarily truth. The novel achieves an emotional tension a paper cannot: the simultaneity of acceptance and horror.
      *   *Conclusion:* Summarize the tension.

