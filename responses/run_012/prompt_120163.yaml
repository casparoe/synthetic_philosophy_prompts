      Within perdurantism, the worm view (the person is the whole spacetime aggregate) contrasts with the stage view (the person is a momentary slice; persistence is a fiction of causal links). Billy's phenomenology favors the stage view. He is famously passive, "coming loose" from his timeline. He lacks the agency to bind his temporal parts into a unified worm. Instead, the narration performs the binding work that Billy cannot. This mirrors the contested stage-theoretic claim that persons are merely momentary stages linked by psychological continuity. Billy isn't an enduring self surviving trauma; he is a series of traumatized stages, some frozen in Dresden, others in Tralfamadore.

      This leads to the ethics. The Tralfamadorian shrug—"So it goes"—relies on the claim that if all times exist, death is merely a local condition. Philosophically, this slide from ontology to axiology is contentious. Eternalism does not logically negate the badness of death; a life can exist eternally in the block and still be cut short relative to the subject's path through it. The deprivation account of death's badness remains compatible with eternalism. Vonnegut knows this. The novel does not endorse the shrug; it dramatizes the tension between the comfort of eternalism and the horror of mortality. The Dresden chapters burn with human anger that the Tralfamadorian metaphysics cannot extinguish.

