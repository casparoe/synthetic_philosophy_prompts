answer: |-
  # The Grantmaker's Moral Uncertainty Tree

  **Start:** You and a colleague disagree on a grant. One says it saves lives (Utilitarian), the other says it violates rights (Deontologist). You need to sign the check.

  ### Node 1: The Nature of the Truth
  **Case:** "We are arguing about whether to fund a gene drive to eliminate wild animal suffering."
  **Question:** Is there a single moral fact of the matter we are all trying to discover (like a hidden treasure), or is the 'right answer' just whatever procedure our group can agree to use?
  *   **Yes, hidden treasure:** Go to Node 2.
  *   **No, it's about agreement:** → **Leaf: Defer to whatever procedure or consensus your group can agree on.**
      *   *Gloss:* The right act is determined by social agreement, not external truth.
      *   *Awkward Commitment:* If the group agrees to flip a coin, that is morally binding.

  ### Node 2: The Source of Error
  **Case:** "You think killing is wrong. Your colleague thinks it's fine if it saves lives."
  **Question:** Is this disagreement like disagreeing about the weight of a pumpkin (one of you is factually wrong about the world), or like disagreeing about the rules of chess (different frameworks)?
  *   **Factually wrong (Empirical):** → **Leaf: The reductionist line that this is just empirical uncertainty about a fixed moral truth.**
      *   *Gloss:* Moral uncertainty is just missing data about a fixed moral reality.
      *   *Awkward Commitment:* Once you have the data, there is no remaining 'moral' uncertainty to manage.
  *   **Different frameworks:** Go to Node 3.

  ### Node 3: The Object of Uncertainty
  **Case:** "You are confident in Utilitarianism, but unsure if this specific grant counts as 'helping'." vs "You are unsure if Utilitarianism is true."
  **Question:** Is your uncertainty about which moral theory is true, or just about whether your current theory permits this specific act (or what you'll think after more reflection)?
  *   **About application/reflection:** → **Leaf: The view that the real upshot is about blame and excuse rather than about which act is right.**
      *   *Gloss:* You act on your best judgment; uncertainty only matters for whether you are blameworthy.
      *   *Awkward Commitment:* Two people doing the exact same act can have different moral statuses based on their internal doubts.
  *   **About which theory is true:** Go to Node 4.

  ### Node 4: The Veto/Constraint
  **Case:** "Theory A says 'Do X to save 1000 lives'. Theory B (1% credence) says 'X is murder'."
  **Question:** Does that 1% chance of 'murder' automatically forbid X, or does it just count as a negative cost to be weighed?
  *   **Automatically forbids:** → **Leaf: A rights-first line that says never violate a constraint even if the numbers say to.**
      *   *Gloss:* Certain constraints act as absolute vetoes regardless of probability.
      *   *Awkward Commitment:* You must let the 1000 die to avoid a 1% risk of committing a rights violation.
  *   **Weighed as cost:** Go to Node 5.

  ### Node 5: Comparability
  **Case:** "Theory A scores options 1-10. Theory B says 'Permissible/Impermissible'."
  **Question:** Can you convert Theory B's 'Impermissible' into a number (like -1000) to compare with Theory A's score, or are they different languages?
  *   **Different languages (No Scale):** Go to Node 6.
  *   **Common Scale:** Go to Node 8.

  ### Node 6: Incomparability - Action
  **Case:** "Option 1 is best for Theory A, Option 2 is best for Theory B. Neither is better for both."
  **Question:** Are you allowed to pick either one, or must you find a way to choose specifically between them?
  *   **Allowed to pick either:** → **Leaf: The view that with no common scale some options are simply unranked and you may only rule out dominated ones.**
      *   *Gloss:* Rationality only forbids choosing strictly worse options; otherwise, anything goes.
      *   *Awkward Commitment:* You cannot criticize a choice that favors a theory you think is 99% false.
  *   **Must choose specifically:** Go to Node 7.

  ### Node 7: Incomparability - Strategy
  **Case:** "You must pick one. Option 1 risks disaster under Theory B. Option 2 is mediocre for both. Option 3 splits the funding."
  **Question:** Do you try to avoid the worst possible outcome across theories, or do you try to split the difference even if no theory likes the split?
  *   **Avoid worst outcome:** → **Leaf: Maximize the worst case across theories.**
      *   *Gloss:* Choose the option where the most dissatisfied theory is least dissatisfied.
      *   *Awkward Commitment:* You may sacrifice massive gains to slightly improve the position of a fringe theory.
  *   **Split the difference:** → **Leaf: Deliberately doing a compromise act that hedges.**
      *   *Gloss:* Perform an action (like splitting funds) that no single theory would choose on its own.
      *   *Awkward Commitment:* You are intentionally doing something every theory considers sub-optimal.

  ### Node 8: Voting Weight
  **Case:** "Theory A is 90% likely. Theory B is 10% likely."
  **Question:** Does Theory B get 10% of the influence, or does it get a full vote just because it's a serious theory?
  *(Note: If you treat every slight variation of Utilitarianism as a new theory, your '90%' splits into forty '2%' slices. This answer assumes you group them broadly.)*
  *   **Full vote/Equal voice:** → **Leaf: A parliament where each theory votes regardless of credence.**
      *   *Gloss:* Every plausible theory gets a seat at the table, weighted by importance not probability.
      *   *Awkward Commitment:* A theory you think is almost certainly false can tie the vote against your favorite theory.
  *   **Proportional influence:** Go to Node 9.

  ### Node 9: Proportional - Strategy
  **Case:** "Theory A is 51% likely. Theory B is 49% likely."
  **Question:** Do you calculate the weighted average of *both*, or do you just follow Theory A because it's the winner?
  *   **Follow winner:** → **Leaf: Just act on the theory you think most likely.**
      *   *Gloss:* Treat moral uncertainty like a horse race; bet everything on the favorite.
      *   *Awkward Commitment:* A 51% vs 49% split leads to the same action as 100% vs 0%.
  *   **Weighted average:** Go to Node 10.

  ### Node 10: Variance/Hedging
  **Case:** "Option 1 has high average score. Option 2 has lower average but consistent scores across theories."
  **Question:** Do you just want the highest average score, or do you also care if the theories agree with each other?
  *   **Highest average only:** → **Leaf: Maximize expected choiceworthiness on a shared scale.**
      *   *Gloss:* Sum the value of each option multiplied by the probability of each theory.
      *   *Awkward Commitment:* You might choose an option that one theory finds catastrophic if another theory loves it enough.
  *   **Penalize disagreement:** → **Leaf: Credence-weighting that also punishes theories for disagreeing a lot.**
      *   *Gloss:* Maximize expected value but discount options where theories wildly disagree (variance penalty).
      *   *Awkward Commitment:* You might pass up a 'sure thing' good because the theories disagree on *why* it is good.

  ***

  # Post-Tree Analysis

  ### Unoccupied Combinations
  These are logical paths through the questions above that do not correspond to a named leaf in this tree.

  1.  **Incomparability + Credence Weighting:** (Node 5 "No Scale" → Node 8 "Proportional").
      *   *Status:* **Incoherent (mostly).** If there is no common scale (Node 5), you mathematically cannot weight them by credence (Node 8) because you cannot multiply a probability by a value that doesn't exist on a shared number line. Some philosophers try to build "intertheoretic comparison" bridges here, but it usually collapses back into Node 5 (No Scale) or Node 8 (Common Scale).
  2.  **Rights-First + Compromise Act:** (Node 4 "Veto" → Node 7 "Split the difference").
      *   *Status:* **Incoherent.** If a constraint acts as an automatic veto (Node 4), you cannot deliberately perform a compromise act (Node 7) that violates that constraint, even partially. You either obey the veto or you don't hold the Rights-First view.
  3.  **Procedure + Realism:** (Node 1 "Agreement" → Node 2 "Hidden Treasure").
      *   *Status:* **Unwanted.** This combination suggests there is a fixed moral truth, but we should ignore it and follow group consensus anyway. While politically pragmatic, few moral philosophers defend this as a *moral* position; it's usually a surrender of ethics to politics.

  ### Indistinguishable Leaves
  These are pairs of leaves where the decision tree branches separate them, but in practice, they often recommend the same action.

  1.  **Maximize Expected Choiceworthiness (Node 10A) vs. Just Act on Most Likely Theory (Node 9A).**
      *   *Why:* If your credence in your favorite theory is high enough (e.g., >90%), the "Expected Choiceworthiness" calculation will almost always select the same act as the "Most Likely Theory" rule. The tree separates them based on *method* (averaging vs. picking), but the *output* is often identical for confident agents.
  2.  **Credence-Weighting with Variance Penalty (Node 10B) vs. Deliberate Compromise Act (Node 7B).**
      *   *Why:* Both views often result in "hedging" behavior (e.g., splitting funding between two causes). Node 10B does it because the math penalizes variance; Node 7B does it because no scale exists and splitting feels safer. To an observer watching where the money goes, these two positions look the same, even though the internal justification (math vs. incomparability) is different.
