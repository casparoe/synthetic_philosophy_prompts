answer: |-
  The intake form was printed on heavy, matte stock, the kind that didn't crease easily. Elena smoothed it over her knees in the waiting room. The clinic was quiet, situated in a converted seaside motel where the rooms now smelled of antiseptic and ozone rather than salt and mildew. Outside, the gray Atlantic churned against the seawall, a constant, low-frequency roar that seemed to vibrate in the fillings of her teeth.

  She looked at Section 4, Box C. *Target Certainty.*

  Below it, the options were listed in plain language, stripped of academic veneer. *The continuity of personal identity.* *The reliability of sensory input.* *The existence of external objects.* She ran her finger down to the one she had selected during the consultation. *The interiority of other beings.*

  Dr. Aris had explained it over video call three weeks ago. He was a man of soft edges and careful hands, wearing a cardigan that suggested warmth he didn't quite possess. "We don't remove the belief, Ms. Vance," he had said. "We suspend the *need* for it. We loosen the hinge. You won't feel crazy. You will feel… unmoored. Like you are walking on a floor you know is there, but you no longer trust to hold your weight."

  Elena signed the waiver. She wasn't doing this for herself. She was doing it for Julian. Julian, who had stopped publishing, stopped coming to the lab, stopped looking her in the eye. Julian, who had started talking about the "solipsistic trap" during staff meetings, who claimed that the data they collected on coral bleaching was merely a consensus hallucination. She had called him a nihilist. He had called her a sleepwalker. She wanted to know what the sleep looked like from the inside. She wanted to see the world through the hole in the bottom of the boat.

  A nurse called her name. She didn't look at Elena's face, but at the clipboard. "Follow me, please."

  The procedure was anticlimactic. There was no flash of light, no sudden vertigo. She sat in a reclining chair while a halo of sensors rested on her temples. A cool gel was applied. Then, a hum. It felt like the moment an elevator starts to descend, that slight lift in the stomach, but it didn't pass. It stayed.

  When she sat up, the room looked identical. The beige walls, the poster about hand hygiene, the nurse checking her watch. But the air felt thinner.

  "How are we feeling?" the nurse asked.

  Elena opened her mouth to say *Fine*, but the word stalled. To say *Fine* was to report a state to another person who could understand the concept of *Fine*. It was to acknowledge a shared space of meaning. She looked at the nurse. She saw the movement of lips, the contraction of facial muscles, the exhalation of air. She heard the sound waves hitting her eardrum. But the bridge that usually carried the sound into meaning was gone. The nurse was a complex biological machine emitting noise.

  "I am… operational," Elena said. The words felt heavy, like stones she had to lift manually.

  The nurse blinked. "You can wait in the lobby until the effect stabilizes. Usually takes an hour."

  Elena walked out. The town was bustling. It was a Tuesday afternoon. People walked dogs, carried coffees, argued on phones. Before the procedure, Elena would have seen a community. Now, she saw a collection of independent organisms navigating obstacles.

  She went to the café across the street. She needed caffeine; her body demanded it, a biological imperative that remained intact. She stood in line. The man in front of her was wearing a wet raincoat. He turned to look at her.

  Usually, this was a moment of micro-recognition. A nod, a shift of weight, an acknowledgment of shared inconvenience. Now, his eyes were just wet spheres in sockets of flesh. He was a prop placed in her visual field. When he moved, he wasn't making way for her; he was simply occupying coordinate B instead of coordinate A.

  When she reached the counter, the barista asked, "What can I get you?"

  Elena stared at her. The question hung in the air. *What can I get you?* It implied a desire on Elena's part and a capacity to fulfill it on the barista's. But if the barista had no interiority, there was no capacity, only programming. And if Elena's desire was just chemistry, was there really a *you* to get it for?

  "Coffee," Elena said. "Black."

  "That's four fifty."

  Elena tapped her card. The machine beeped. The transaction was complete. But the exchange felt hollow. She hadn't paid a person; she had manipulated a vending mechanism. She took the cup. It was hot. The heat was real. That was the only thing that was real. The heat didn't require an other to exist.

  She sat by the window. She tried to think about Julian. She tried to reconstruct his argument. *We cannot know the other,* he had said. *We only know the behavior.*

  Now, she knew the behavior. She watched a couple laughing at the next table. They were throwing their heads back. Their mouths were open. Sound was coming out. Before, she would have said they were happy. Now, she saw muscle contractions associated with joy-signaling. She tried to doubt them. *Are they actually happy?*

  But to doubt it, she needed a standard of what "actually happy" meant. She needed to know what happiness felt like inside them to compare it to their outside. She didn't have access. So the doubt wasn't a hypothesis she could test. It was a wall. She couldn't even formulate the question without assuming there was someone inside to be happy or not. The thought looped back on itself, dizzying. She tried to push against the uncertainty, but there was no resistance. It was like trying to punch smoke.

  She pulled out her phone. She dialed Julian.

  He answered on the third ring. "Elena?"

  His voice. It was just vibration. But it was *his* vibration. The pattern was unique.

  "Julian," she said. "I'm at the clinic."

  "The Veridian?" His voice sounded tight. "You actually did it."

  "I wanted to understand," she said. "I wanted to see why you stopped coming in."

  "Because it's quiet, Elena," Julian said. "Once you see the strings, you can't pretend the puppet is dancing on its own."

  "But how do you work?" she asked. "How do you talk to me now?"

  "I don't," he said. "I respond. I react. I am a complex surface reflecting your own complexity back at you. There is no meeting point. There is only the mirror."

  Elena gripped the phone. She wanted to argue. She wanted to say, *But you are hurting. I hear the pain in your voice.* But that was the hinge. She was assuming the voice carried pain. If it didn't, if it was just frequency, then his suffering was her projection. She was alone in the café, talking to a device, projecting a history onto a voice print.

  "If there is no meeting point," Elena said, her voice trembling, "then why are you telling me this?"

  "Because the machine is programmed to warn the other machines," Julian said. "Goodbye, Elena."

  The line went dead.

  She sat there. The coffee cooled. The doubt was supposed to be a tool. In the lab, doubt was how you found the truth. You doubted the calibration, you doubted the sample, you doubted the hypothesis. But here, doubt had nothing to grip. To doubt Julian's mind, she had to use language Julian taught her, in a culture built on the assumption of minds. She was using the river to prove the riverbed wasn't there.

  She stood up to leave. A child ran past her table and knocked into her leg. The child spilled juice on her trousers.

  The mother rushed over. "Oh my god, I am so sorry. Are you okay?"

  Elena looked down. The stain was spreading. Dark purple on beige. She looked at the mother. The woman's face was flushed. Her hands were wringing. She was apologizing.

  Elena felt a surge of irritation. It was hot and sharp. But where did it go? If the woman was just matter, the irritation was just a chemical spike in Elena's own brain. There was no one to receive the anger. There was no one to forgive.

  "It's fine," Elena said.

  "It's not fine, let me get you a napkin—"

  "Don't," Elena said.

  The woman stopped. Her hand hovered in the air. She looked confused. The script had broken. Usually, an apology demanded acceptance. A stain demanded cleaning. These were the rules of the game. But Elena was standing outside the board. She saw the pieces moving, but she couldn't see the rules anymore.

  The woman's face shifted. The concern hardened into defensiveness. "Okay. Whatever."

  She took the child's hand and walked away.

  Elena watched them go. She realized then that the woman hadn't changed. The woman was still a person. The change was entirely in the space between them. The space had become vacuum.

  She walked back to the clinic. The hour was up. The sun was dipping below the horizon, turning the water the color of bruised iron.

  Dr. Aris was waiting for her in the intake room. He didn't ask how it went. He looked at his monitor, checking the neural readouts.

  "The synaptic firing patterns are normalizing," he said. "The hinge is resetting."

  "It didn't feel like resetting," Elena said. "It felt like falling."

  "That's common," Aris said. He finally looked at her. His eyes were tired. "We think of certainties as things we hold. But you don't hold them. They hold you. When you let go, you don't float. You drop."

  "Julian says there's no meeting point," Elena said.

  "Julian is stuck in the drop," Aris said. "He thinks the view from the bottom is the truth. It's not. It's just the bottom."

  "How do I get it back?" Elena asked. "The certainty. How do I know they're real again?"

  "You don't know," Aris said. He stood up and walked to the window, looking out at the darkening sea. "You don't reason your way back to the riverbed. You just start walking on it again. You get hungry. You get lonely. You need someone to hand you a towel. The need builds the bridge."

  He turned back to her. "Your file says you're a biologist. You study sediment, yes?"

  "Cores," Elena said. "Deep sea cores."

  "You know that the layers settle not because they decide to, but because gravity and time demand it. The certainty is gravity. You can't argue with gravity. You just stand up."

  Elena stood up. Her legs felt heavy, anchored. The hum in her head was fading. The silence was filling with noise again—not just sound, but meaning. The hum of the refrigerator meant *cold*. The look on Aris's face meant *concern*.

  She walked out of the clinic. The air was colder now. She pulled her coat tight.

  She walked to the bus stop. A man was standing there, smoking. He offered her a light, holding out a flame against the wind.

  Elena looked at the flame. It flickered, threatened by the gusts off the ocean. She looked at the man's hand. It was steady. He was shielding the fire for her.

  She didn't think about whether he felt the cold. She didn't think about whether the fire was real or a simulation. She stepped closer to the shelter of his hand. She leaned in.

  The flame caught the tip of her cigarette. She inhaled. The smoke was harsh and real.

  "Thanks," she said.

  The man nodded. He didn't say anything. He just stood there, keeping the wind off the flame until she was sure of it.

  Elena watched the ember glow in the twilight. She held the cigarette between her fingers, feeling the heat radiate through the paper, waiting for the ash to break and fall.
