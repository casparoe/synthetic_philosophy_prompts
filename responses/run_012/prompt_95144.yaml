answer: |-
  Here is the 40-minute battle plan.

  ### The Core Example
  **Stick with the Wednesday Start Time.**
  Do not switch to a hypothetical (like a desert island or a new country). You need the visceral annoyance they already feel.
  *   **What it must have:** Escalating stakes (sleep -> traffic -> wages -> future rights) and a specific authority figure who made the contradictory claim (The Principal).
  *   **What it must not have:** A clear villain. If the Principal is just a tyrant, the solution is "fire the Principal." The problem must be that the Principal is *logically right* ("affected people should decide") but *practically absurd* ("the whole town").

  ---

  ### The Sequence (40 Minutes)

  #### 0:00 – 0:05 | The Hook: Retell the Mess
  **Goal:** Shatter the misconception that "who votes is obvious."
  **Action:** Stand at the whiteboard. Draw a stick figure labeled "Student."
  **Script:** "We all know the Wednesday fight. Council said students vote. Parents yelled. Staff yelled. Then the Principal said the magic line: 'Anyone affected gets a say.' Sounds fair, right?"
  **Move:** Draw a circle around the student. Then draw a bigger circle for Parents. Then Staff. Then Future Freshmen (ask: "Who votes for the class of 2028?"). Then the Town.
  **Check:** Ask the room: "At what point did this stop making sense?"
  *   *Why first?* You cannot explain the traps if they still believe there is an obvious "correct" group. You need them to feel the spiral first.

  #### 0:05 – 0:15 | Phase 1: The Spiral (The "Affected" Principle)
  **Goal:** Push the boundary until it breaks.
  **Action:** Use the "Future Freshmen" point here.
  **Script:** "My friend Jaya said freshmen next year are affected for four years. They aren't here. Do they get a proxy vote? If yes, who holds it? Their parents? The guidance counselor? If no, why is it fair to tax their future sleep for our current convenience?"
  **Move:** Keep expanding. "If traffic is the issue, does the guy who drives the bus vote? Does the neighbor who hates the bus noise vote?"
  **Misconception Check:** Some will say, "Just stop at students."
  **Counter:** "Why? Is that a logical line or just a habit? If the logic is 'affected,' the neighbor is affected. If the logic is 'convenience,' admit it's not democracy, it's convenience."
  *   *Why here?* This sets up Trap 1. You need the group to be potentially infinite before you show them the danger of letting them all in.

  #### 0:15 – 0:25 | Phase 2: Trap 1 (The Opt-In Bias)
  **Goal:** Make them feel that "Everyone Affected" = "Only the Angry."
  **Action:** Erase the outer circles. Leave the "Town" circle.
  **Script:** "Okay. Let's follow the Principal's rule. The whole town votes. Tuesday night town hall. Who shows up?"
  **Discussion:** Guide them to the realization.
  *   "People who hate traffic."
  *   "People with free time."
  *   "People who already hate the school."
  **The Trap:** "The people who *don't* care about your start time but love their job? They stay home. The group that shows up has already decided the outcome before the vote happens. The vote isn't measuring 'what's best,' it's measuring 'who showed up.'"
  **Key Line:** "If the boundary is 'anyone who wants in,' the decision is made by energy, not justice."
  *   *Timing Note:* This is minute 25. You will lose the tag-along kids here if you get too abstract. Keep it about *who is in the room*.

  #### 0:25 – 0:35 | Phase 3: Trap 2 (The Fixed Line & The Loop)
  **Goal:** Reveal the Loop.
  **Action:** Draw a hard box around "Current Students."
  **Script:** "Okay, that's too messy. Let's fix the line. Only current students vote. Done."
  **Question:** "Who drew the box?"
  **Answer:** "The Council? The Principal?"
  **Script:** "If the Principal drew the box, the Principal decided the outcome. If the Principal knew parents would vote 'No' but students vote 'Yes,' drawing the box *was* the vote. The actual meeting is just theater."
  **The Loop:** "To vote on where the line goes, you need a group. But you need the line to know who is in the group. You can't decide the membership without already being the members."
  **Misconception Check:** "So someone just has to draw the line."
  **Counter:** "Yes. But admit what that means. It means democracy doesn't decide the boundary. Power decides the boundary. Democracy only happens *inside* the cage someone else built."

  #### 0:35 – 0:40 | The Landing & Diagnostic
  **Goal:** Verify they get it.
  **Action:** Sit down. Stop teaching.
  **Script:** "I'm not going to give you the solution. There isn't one. That's the point. Every democracy is built on a decision that wasn't democratic."
  **The Diagnostic Question:**
  > "If we vote today on whether we should let the cafeteria staff vote on the start time, and the vote passes 10 to 5... did the staff get a say in whether they should get a say?"

  *   **If they say Yes:** They missed the loop. (The staff couldn't vote on their own inclusion).
  *   **If they say No:** They get it. (The students decided the staff's rights without the staff).
  *   **If they say "It doesn't matter":** They checked out. (Ask them why they stayed).

  ---

  ### What to Openly Skip
  At minute 20, say this:
  > "I know you're waiting for the part where I tell you how to fix this. Like, 'citizenship tests' or 'constitutions.' I'm skipping that. Those are just ways to hide the line-drawing. We're not studying how to hide the problem; we're studying the problem."

  *   **Why:** This keeps the sharp kids engaged (you're not boring them with civics 101) and gives the tag-alongs permission to stop looking for a "right answer" to write down.

  ### Managing the Room
  *   **The Sharp Kids:** They will try to solve it. When they offer a solution (e.g., "Weighted voting"), point out who decides the weights. Push them back into the loop.
  *   **The Tag-Alongs:** They will zone out during Phase 3 (The Loop). Keep Phase 3 physical. Draw the box. Tap the marker on the board. "Who drew this? Me. So I'm the dictator. You guys are just props."
  *   **Energy Dip:** At minute 25, if eyes glaze over, switch from "The Town" back to "This Room." Ask: "If we vote on club dues, do freshmen get to vote? Why? Who decided that?" Bring it back to their immediate reality.

  ### Summary of Misconceptions & When to Hit Them
  1.  **"It's obvious who is affected."**
      *   *Hit in:* 0:05–0:15 (The Spiral). Show that "affected" is infinite.
  2.  **"Democracy is just counting hands."**
      *   *Hit in:* 0:15–0:25 (Trap 1). Show that *which* hands matter more than *how many*.
  3.  **"Someone just has to draw the line, so it's not a real problem."**
      *   *Hit in:* 0:25–0:35 (Trap 2). Show that the act of drawing the line *is* the political problem, not the solution.

  ### Final Advice
  Don't let them leave feeling cynical ("Nothing matters"). Let them leave feeling alert ("Every time someone says 'we the people,' I need to ask 'who drew the circle?'"). That is a debate skill they can use forever.
