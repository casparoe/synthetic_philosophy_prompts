  1.  **Analyze the User's Request:**
      *   **Context:** The user's sister is involved in a local time-banking currency system (1 hour of work = 1 hour of credit, regardless of the task). She claims it's more ethical than regular money (can't be hoarded/invested, stays local) and argues Aristotle would support it.
