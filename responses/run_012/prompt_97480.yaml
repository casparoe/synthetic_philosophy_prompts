      *   *Politics (Book I):* Household management (*oikonomia*) vs. Money-making (*chrematistics*).
          *   Natural: Acquiring goods needed for the good life (self-sufficiency). Barter is natural.
          *   Unnatural: Acquiring money for the sake of money (infinite accumulation). Usury (interest) is the worst because money begets money.
      *   *The Measure:* Is it labor time? No, Aristotle says it's *need* (demand). The builder and the shoemaker exchange based on the ratio of their needs/contributions to the community, not strictly time spent.

  3.  **Evaluate the Sister's Scheme (Time Banking) against Aristotle:**
      *   *Claim 1: "One hour of anybody's work is worth one hour of anybody else's."*
          *   Aristotle's View: This violates the principle of proportionate reciprocity. A doctor's hour and a janitor's hour satisfy different *needs*. Equalizing them by time ignores the qualitative difference in the contribution to the common good. Aristotle cares about *value relative to need*, not input time.
      *   *Claim 2: "It can't be hoarded or invested."*
