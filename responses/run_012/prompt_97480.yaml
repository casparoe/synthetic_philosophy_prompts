answer: |-
  Here is the breakdown of how Aristotle's actual philosophy applies to your sister's time-banking scheme. The short version is: she is half-right. Aristotle would applaud her ethical goals (stopping hoarding, keeping it local), but he would fundamentally reject her mechanism (valuing all labor hours equally).

  Here are the four key takeaways from the *Nicomachean Ethics* and *Politics* that you need to judge the scheme.

  ### 1. The Common Measure is "Need," Not "Time"
  In *Nicomachean Ethics* Book V, Aristotle asks a specific question: How do you compare a house to a shoe so they can be traded fairly? If exchange is going to hold a society together, there has to be a common standard.

  Your sister's system assumes the common standard is **labor time** (one hour = one hour). Aristotle explicitly rejects this. For Aristotle, the common measure is **demand (or need)**.

  *   **The Text:** Aristotle argues that money (*nomisma*) exists to represent demand. If nobody needs shoes, the shoemaker's labor is worthless, regardless of how many hours he worked. If the community desperately needs doctors, the doctor's hour is "worth" more in exchange than the janitor's hour, not because the doctor is a better person, but because the *need* is greater and the supply is scarcer.
  *   **The Implication:** The core mechanic of your sister's currency is un-Aristotelian. By flattening all value to time, the system ignores the qualitative difference in contributions to the common good. Aristotle believes in "proportionate reciprocity," not strict equality. A system that pays a brain surgeon and a dog walker the exact same rate for the same time might feel egalitarian to us, but to Aristotle, it disrupts the proportional balance required for a stable hierarchy of needs. It risks creating a shortage of high-skill services because the "price" (in hours) is artificially suppressed.

  ### 2. Money is a Convention, Not a Natural Reality
  Aristotle is very clear in the *Ethics* that money does not exist by nature; it exists by convention (*nomos*). It is a token we agree to use to facilitate exchange because carrying around piles of shoes to trade for houses is impractical.

  *   **The Text:** He notes that money can change value or become worthless if the convention changes (e.g., if the state collapses). It is a placeholder for future demand.
  *   **The Implication:** Your sister claims her currency is "more ethical" because it's pegged to labor. Aristotle would say this is a category error. "Hours" are just another convention, exactly like the dollar. There is nothing inherently more "natural" about counting hours than counting green pieces of paper. Both are artificial measures of value. If the local town stops accepting the "hours," they become worthless, just like inflation-ridden cash. Don't let her claim her currency is more "real" than federal money; Aristotle would say all money is equally artificial.

  ### 3. Natural vs. Unnatural Acquisition (*Oikonomia* vs. *Chrematistics*)
  This is where your sister is on the strongest ground. In *Politics* Book I, Aristotle distinguishes between two types of money-making:
  1.  **Natural (*Oikonomia*):** Acquiring goods needed for the household or the city to live a good life. This has a limit (you only need so much food and shelter).
  2.  **Unnatural (*Chrematistics*):** Acquiring money for the sake of accumulating more money. This is limitless and unnatural.

  *   **The Text:** Aristotle hates usury (interest) the most. He calls it "money breeding money." It is unnatural because money was meant to be used for exchange, not to reproduce itself.
  *   **The Implication:** Your sister is right that Aristotle would hate Wall Street speculation. If her local currency literally *cannot* be invested or hoarded (i.e., it expires or must be spent on goods/services), it forces money back into *oikonomia* (household management). It prevents the "unnatural" accumulation of wealth for its own sake. This aligns perfectly with Aristotle's view that wealth is a tool for living well, not the goal of life. If her system stops people from treating money as an end in itself, it is ethically superior in Aristotelian terms.

  ### 4. Self-Sufficiency and the Local
  Aristotle's ideal political unit is the *polis*, which should be self-sufficient. He is skeptical of trade that goes far beyond the city's borders, as it creates dependency and encourages the "unnatural" accumulation of wealth mentioned above.

  *   **The Text:** Trade within the community to satisfy needs is good. Trade with foreigners purely for profit is suspicious.
  *   **The Implication:** The "stay local" rule is very Aristotelian. By restricting the currency to local businesses, the system strengthens the specific bonds of the community. It ensures that the exchange serves the neighbors, rather than draining value out of the town to a distant corporation. This promotes the kind of friendship and mutual dependency Aristotle thinks is necessary for a stable state.

  ### The Verdict: How to Talk to Your Sister

  You can tell her that her intuition about the *ethics* of money is surprisingly Aristotelian, but her *economics* are not.

  **Where she wins (Aristotle agrees):**
  *   **Anti-Hoarding:** Preventing the currency from being used for interest or infinite accumulation is exactly what Aristotle wants. Money should circulate to meet needs, not sit in a vault.
  *   **Local Focus:** Keeping the exchange within the community fosters the self-sufficiency and social bonds required for a healthy polity.

  **Where she loses (Aristotle disagrees):**
  *   **Labor-Time Valuation:** Aristotle would argue that pegging value strictly to time is unjust. Value comes from *need*. If the town needs plumbers more than it needs poets, the plumber's hour should command more "hours" in exchange. Flattening this distinction ignores the reality of scarcity and demand, which could lead to shortages of critical skills.
  *   **"Natural" Money:** She shouldn't claim her currency is more "natural" than the dollar. Aristotle would say both are conventions. The dollar is backed by the state; her hours are backed by a local agreement. Neither is grounded in nature.

  **The Bottom Line:**
  Aristotle would support her **club**, but not her **accounting**. He would think it's a great way to build community and stop greedy speculation, but he would warn her that treating all hours as equal is a fiction that doesn't reflect the true hierarchy of human needs. If the system collapses, it will likely be because the "price" of skilled labor is too low to keep those workers participating—a problem Aristotle's theory of "proportionate reciprocity" predicts.
