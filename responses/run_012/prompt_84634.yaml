answer: |-
  You think I don't know the weight of the foreman's eye? I put my body on that line, I let the machine stamp its rhythm into my bones until I could not think, so do not dare tell me this is abstract theory for me while it is blood for you. You are confusing the collective strength of workers with the spiritual cancer of the party, and you do it because you are tired and want a weapon that fits easily in the hand without asking whether it cuts you too. A union that demands bread is not yet a party, but the moment it demands you swear allegiance to its way of seeing the world, it becomes one, and then it will sacrifice you to keep itself alive just as the boss would. You ask what I offer for Monday morning? I offer you the refusal to let your mind be hired along with your muscles, because if you let the party think for you, you are still a slave, only now you serve a master who speaks in your voice. It is not a luxury to refuse poison because you are thirsty; it is the only way to survive the night, and if your coalition turns into a party, you dissolve it and build another, however exhausting that is, because the moment you prioritize the structure over the truth, you have already lost the raise, the dignity, and yourself. The thing that replaces the party is simply men standing together because they see the same fact, not because they swear the same oath; if the fact changes, the group changes, and yes, that is fragile, but so is a man who sells his soul for security.
