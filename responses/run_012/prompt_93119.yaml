answer: |-
  **To:** The Chair and Members of the Law Reform Commission
  **From:** [Your Name], Academic Member
  **Subject:** Decision Procedure for Sexual Offences (Draft for Review)

  ### Part 1: The Hedonic Audit for Sexual Offences (HASO)

  **Purpose:** To determine whether a specific sexual act should be criminalized based on the net balance of pain and pleasure, explicitly separating harms caused by the act from harms caused by the law.

  **Instructions:** Complete Steps 1 through 5 sequentially. If the procedure stops at Step 3, the recommendation is **Do Not Criminalize**. If it reaches Step 5, a recommendation requires a value judgment flagged below.

  #### Step 1: Define the Act and the Parties
  Describe the conduct precisely. Identify the capacity of the parties to consent (age, cognitive ability, relationship of authority).
  *   **Stop Rule:** If either party lacks the legal or cognitive capacity to consent, **Criminalize**. (This procedure addresses only consensual acts between capacitated adults).
  *   **Proceed** if both parties are capacitated adults.

  #### Step 2: The Constitutive Harm Test
  Does the act *itself* cause physical or psychological damage that exists regardless of the law or social opinion?
  *   **Question:** Can this act be performed without causing non-consensual physical injury, death, or irreversible psychological trauma *inherent to the mechanics of the act*?
  *   **Sufficient Answer for Decriminalization:** "Yes, the act can be performed safely between consenting adults."
  *   **Sufficient Answer for Criminalization:** "No, the act inherently causes grievous bodily harm or death (e.g., fatal violence)."
  *   **Flag for Value Judgment:** *The Boundary of Consent.* Where does "risk" become "harm"? If the act carries a high probability of injury (e.g., 20% chance of permanent disability), does consent negate the harm? The drafters must set a threshold for "acceptable risk" here. The procedure cannot calculate this; it is a policy choice.
  *   **Proceed** if Constitutive Harms are low or negligible.

  #### Step 3: The Prohibition Ledger (Secondary Harms)
  Calculate the pain produced *solely* by making this act a crime. This is the "cost of the statute."
  *   **Question:** What harms arise if we criminalize this?
  *   **Checklist:**
      1.  **Enforcement Costs:** Police time, court resources, prison costs.
      2.  **Collateral Damage:** Loss of employment, housing, or custody for those convicted.
      3.  **Vulnerability:** Does prohibition drive the act underground, increasing risks of blackmail, violence, or preventing victims from seeking help?
      4.  **Stigma:** The psychological pain of being labeled a criminal for private conduct.
  *   **Stop Rule:** If Constitutive Harms (Step 2) are low, and Prohibition Harms (Step 3) are high, **Do Not Criminalize**. Stop here.
  *   **Proceed** only if Prohibition Harms are low (e.g., the act is easily regulated without driving it underground) OR if Constitutive Harms are significant.

  #### Step 4: The Third-Party Offense Calculation
  Estimate the pain caused to observers or society who do not participate but know the act occurs.
  *   **Question:** Does the knowledge that this act is occurring cause measurable distress to third parties?
  *   **Sufficient Answer:** "Yes, there is widespread disgust or moral outrage."
  *   **Flag for Value Judgment:** *The Weight of Disgust.* Bentham argued that "disgust" is a real pain but should rarely outweigh liberty. However, if the distress is severe enough to cause social unrest or mental health crises in the population, it counts. The drafters must decide: Does "moral shock" count as pain equivalent to physical injury?
  *   **Proceed** to Step 5 if Third-Party Offense is high.

  #### Step 5: The Net Sum
  Weigh the Constitutive Harms (Step 2) + Third-Party Offense (Step 4) against the Pleasure of the Participants + The Prohibition Ledger (Step 3).
  *   **Question:** Does the total pain of the act and the outrage it causes exceed the total pleasure of the participants plus the pain saved by *not* prohibiting it?
  *   **Flag for Value Judgment:** *Corrupted Preferences.* If the pleasure is derived from a position of desperation (e.g., economic coercion), does it count as full "pleasure" in the sum? The drafters must decide if a preference formed under inequality is valid.
  *   **Recommendation:** If the Net Sum is negative (more pain), **Criminalize**. If positive, **Do Not Criminalize**.

  ***

  ### Part 2: Application to Three Proposals

  Here is the procedure run on the three specific scenarios you requested. I have applied the logic strictly, without softening the conclusions.

  #### Case A: Consensual Sex Between Adult Siblings
  *   **Step 1 (Capacity):** Both adults, no authority imbalance stated. **Proceed.**
  *   **Step 2 (Constitutive Harm):** Physical harm is negligible. Psychological harm is debated but not inherent to the mechanics. Genetic harm is avoidable via contraception/sterilization. **Constitutive Harm: Low.**
  *   **Step 3 (Prohibition Ledger):** High. Criminalization drives the relationship underground, prevents counseling, creates stigma, and risks destroying the wider family unit if discovered. **Prohibition Harm: High.**
  *   **Step 4 (Third-Party Offense):** High. The taboo generates significant disgust in the community.
  *   **Step 5 (Net Sum):** We weigh the participants' pleasure + the avoidance of Prohibition Harms against the Community's Disgust.
      *   *Benthamite Calculation:* Bentham historically argued that "disgust" is a prejudice, not a rational harm. Unless the disgust leads to violence, it is outweighed by the tangible harms of prohibition (jail, stigma, blackmail).
      *   **Recommendation:** **Do Not Criminalize** (provided contraception is used to negate genetic harm).
      *   *Note:* This result follows directly from your argument regarding same-sex conduct. If "unnatural" is not a harm, and consent is present, the incest taboo functions identically to the sodomy taboo in this calculus.

  #### Case B: Consensual Sadomasochism (Lasting Marks)
  *   **Step 1 (Capacity):** Adults, consented. **Proceed.**
  *   **Step 2 (Constitutive Harm):** "Lasting marks" imply tissue damage. In a public health system, this creates a potential cost to the state if infection or complications arise. However, consent is present. **Constitutive Harm: Moderate.**
  *   **Step 3 (Prohibition Ledger):** Moderate to High. Driving BDSM underground makes safety negotiation harder, increases risk of unreported abuse disguised as play.
  *   **Step 4 (Third-Party Offense):** Low to Moderate. A neighbor called the police, indicating specific alarm, but not necessarily widespread societal distress.
  *   **Step 5 (Net Sum):** The key is the "Boundary of Consent" flag in Step 2. If the state accepts that adults can consent to bodily modification (tattoos, surgery), lasting marks are consistent. If the state views "bodily integrity" as non-negotiable regardless of consent, the harm is constitutive.
      *   *Benthamite Calculation:* The pain of the marks is consented to (utility neutral for the receiver). The pleasure of the giver is real. The Prohibition Harms (unsafe practices) are tangible.
      *   **Recommendation:** **Do Not Criminalize.** The harm is constitutive only if we decide consent is invalid for bodily harm, which is a moral judgment, not a utilitarian one.

  #### Case C: The Purchase of Sex (Sex Work)
  *   **Step 1 (Capacity):** Adults. **Proceed.**
  *   **Step 2 (Constitutive Harm):** The act itself is physically safe. However, we must address the **Corrupted Preferences Flag**. If the seller is motivated by economic desperation, is the "pleasure" (income) offset by the pain of the necessity?
  *   **Step 3 (Prohibition Ledger):** Very High. Prohibition increases stigma, forces workers into dangerous locations, prevents screening of clients, and empowers traffickers who operate outside the law.
  *   **Step 4 (Third-Party Offense):** Moderate. Some community objection to visible solicitation.
  *   **Step 5 (Net Sum):** Here is the friction point.
      *   *Scenario 1 (Full Decriminalization):* Reduces Prohibition Harms significantly. Maximizes seller safety.
      *   *Scenario 2 (Criminalize Purchase):* Reduces demand, potentially shrinking the market.
      *   *Benthamite Calculation:* If we count the "Corrupted Preference" (desperation) as a net negative utility for the seller, the transaction produces less total pleasure than it appears. Furthermore, if the *market* for purchased sex inherently fuels trafficking (a high constitutive harm of the *system*, not the act), the aggregate pain rises.
      *   **Recommendation:** **Criminalize the Purchase.**
      *   *Reasoning:* While prohibition creates harms (Step 3), a strict utilitarian count of the *market effects* (exploitation, inequality, trafficking spill-over) suggests the aggregate pain of a legal market outweighs the utility of the transaction. The "Corrupted Preference" flag tips the scale. The seller's "consent" is discounted due to economic coercion, making the harm constitutive of the *context*.

