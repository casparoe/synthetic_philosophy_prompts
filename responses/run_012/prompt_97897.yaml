answer: |-
  **Essay Question**

  In *The Querist*, Berkeley describes money not as wealth itself, but as "tickets" or "counters" whose value is purely conventional and whose purpose is to "excite industry." Given Berkeley's immaterialist metaphysics, it is tempting to argue that he treats money as merely imaginary because he treats matter as merely imaginary. Critically evaluate this claim. Does Berkeley's monetary theory logically depend on his immaterialism, or could a materialist (such as Locke or Hume) coherently hold the same economic views? If there is no strict logical entailment, is there a deeper structural link—perhaps through his theory of signs and language—that unifies his metaphysics and his economics, or are they simply parallel projects sharing a pragmatic temperament?

  ***

  **Model Answer**

  It is a common pedagogical shortcut to assume Berkeley's economics are a direct application of his immaterialism: if matter does not exist, gold cannot have intrinsic value, therefore money is a fiction. This reading is superficially satisfying but philosophically shallow. While Berkeley's immaterialism removes the ontological grounding for bullionism, it does not logically necessitate his specific monetary theory. A materialist could, and did, hold similar views on the conventional nature of money without denying the existence of matter. The true connection between Berkeley's metaphysics and his economics lies not in the denial of substance, but in his functionalist theory of signs.

  In *The Querist* (1735–37), Berkeley argues that money is a "ticket entitling the holder to a proportionate share of the industry of the society." Its value is not in the metal but in its ability to circulate and stimulate labor. Crucially, this view does not require immaterialism. David Hume, a staunch empiricist and materialist regarding the external world, later argued in *Political Discourses* that money is nothing but a representative sign of labor and commodities. Even Locke, though more inclined toward bullionism regarding international balances, acknowledged the conventional aspect of coinage in domestic contexts. If a materialist can argue that money is a conventional token rather than a store of intrinsic value, then Berkeley's immaterialism is not a *condition sine qua non* for his economics. The economic claim stands on utilitarian and observational grounds, not metaphysical ones.

  However, dismissing the link entirely ignores Berkeley's broader philosophical project. The connection is not ontological (what money *is*) but semiotic (what money *does*). In *Alciphron* and *De Motu*, Berkeley develops a theory of language where words do not always stand for specific ideas but function to raise passions, excite wills, or direct action. Just as the word "fire" prompts avoidance without requiring an abstract idea of fire, a coin prompts industry without requiring intrinsic value. Money, for Berkeley, is a species of language. It is a system of signs that regulates social behavior.

  This semiotic link is where the metaphysics adds value. Berkeley's immaterialism is partly motivated by the failure of abstract ideas to explain reality; he replaces static substance with active relations and signs. His economics mirrors this: he rejects the static "substance" of gold (bullionism) in favor of the active "relation" of credit and circulation. The metaphysics clears the ground of idolatry toward matter; the economics clears the ground of idolatry toward treasure. Both prioritize function over substance.

  Therefore, the relationship is one of structural analogy rather than logical entailment. Immaterialism does not force the conclusion that paper credit is superior to gold; rather, it cultivates a temperament skeptical of "hidden substances" (whether material or monetary) and attentive to observable effects (industry and circulation). A materialist could adopt the economics, but they would lack the unified semiotic framework that makes Berkeley's system coherent. For Berkeley, the physical world and the economic world are both legible only as systems of signs instituted by God or convention to guide human action. To reduce this to "money is imaginary because matter is imaginary" is to miss his insight that both are real insofar as they are effective.

  ***

  **Marking Scheme (Out of 20)**

  | Criteria | A Range (17–20) | B Range (13–16) | Typical Student Error |
  | :--- | :--- | :--- | :--- |
  | **1. Exposition of *Querist* View** (4 pts) | Clearly articulates money as "tickets/counters" for industry/circulation, not intrinsic wealth. | Describes money as "not real" or "paper" without specifying the functional role (industry). | **Error:** Treating Berkeley as advocating for worthless paper rather than credit-backed tokens. |
  | **2. The Immaterialism Trap** (5 pts) | Explicitly rejects the "money is imaginary because matter is imaginary" shortcut as insufficient. | Accepts the link as plausible but doesn't fully dismantle the logical necessity. | **Error:** Stopping at "Berkeley is an idealist, therefore money is an idea," ignoring economic history. |
  | **3. Materialist Comparison** (4 pts) | Correctly identifies that Hume/Locke could hold conventionalist money views without immaterialism. | Mentions Locke/Hume but misrepresents their view on intrinsic value (e.g., claiming Locke was a pure bullionist). | **Error:** Assuming all empiricists were bullionists, missing Hume's conventionalism. |
  | **4. The Semiotic Link** (5 pts) | Identifies the theory of signs/language (*Alciphron*) as the actual bridge (words/money prompt action). | Mentions "signs" vaguely without explaining the functional parallel (prompting wills/industry). | **Error:** Failing to move beyond ontology to semantics; missing the *Alciphron* connection. |
  | **5. Nuance & Scholarship** (2 pts) | Acknowledges chronological gaps or debate; avoids overclaiming Berkeley's explicit intent. | Treats Berkeley's corpus as a monolithic, perfectly consistent system without tension. | **Error:** Asserting Berkeley *definitely* meant X without acknowledging reconstruction. |

  ***

  **Self-Critique: Where This Model Answer Might Be Wrong**

  A Berkeley specialist (such as Patrick Kelly or a contributor to the *Berkeley Studies* journal) would likely push back on two specific points in my model answer.

  First, **chronology and explicit intent.** The model answer leans heavily on the theory of signs from *Alciphron* (1732) to explain *The Querist* (1735–37). While chronologically feasible, Berkeley never explicitly writes, "Money is a linguistic sign." The link is a reconstruction by modern scholars (notably Jesseph and Kelly). A strict textualist might argue I am imposing a unity Berkeley didn't claim; he may have viewed his economic pamphlets as purely pragmatic political interventions unrelated to his metaphysics. If pressed, I would have to concede that the semiotic link is a *philosophically charitable reconstruction* rather than a biographical fact.

  Second, **Locke's monetary theory.** I gloss over Locke's complexity to make the materialist contrast work. Locke was not a pure bullionist; he understood convention. However, Locke *did* believe silver had a "natural value" distinct from coinage in a way Berkeley radically rejected. If a student pointed out that Locke's conventionalism was limited compared to Berkeley's radical credit theory, my claim that a materialist could hold the *very same* view would need nuancing. Hume is the safer comparison, but Hume comes later. A scholar might argue that Berkeley's specific advocacy for a national bank *did* rely on his distrust of "material" hoarding in a way a Lockean metaphysics might resist.

  **What would change my mind?**
  If presented with manuscript evidence or a specific query in *The Querist* where Berkeley explicitly grounds the value of credit in the *ontological status* of ideas rather than the *utility* of signs, I would have to strengthen the link between immaterialism and economics. Conversely, if a historian showed that Berkeley's economic views were lifted directly from French mercantilists (like Law) without modification, I would have to weaken the claim that his metaphysics adds anything unique to the economics. Currently, the "semiotic bridge" is the strongest philosophical defense, but it remains interpretive.
