prompt: |-
  Right, I need a teaching plan and I want you to think hard about this rather than handing me the standard intro lecture. Take the role of someone who has taught Kant's transcendental arguments and the post-Kantian literature for years, including to audiences with zero philosophy background, and who knows exactly where the whole thing falls apart. Before you answer, brainstorm privately about what actually depends on what here, because the order matters more than anything else and I got it wrong the last time I tried.

  Context: I had a marathon argument with my friend Maya on Friday. She's a second-year cognitive science PhD student, sharp, and she thinks transcendental arguments are a con. Her case: (a) they're circular, you assume the very thing you're supposedly proving; (b) the most you ever get is that we can't help thinking in some way, which is a claim about our psychology and not about the world, so it's just a priori psychology, i.e. bad psychology; (c) the word "transcendental" is just "transcendent" in a nicer coat. I think (b) is the real threat and the other two are noise, but I couldn't say why in the moment and it's been bothering me since.

  Now the practical problem. In two weeks I have to teach this to twelve cog sci PhD students: smart, no Kant, no philosophy of mind beyond the pop-sci stuff, and all of them instinctive naturalists who will assume any a priori claim is either maths or wishful thinking. Fifty minutes, whiteboard. I don't want the explanation from you, I want the plan for the explanation.

  So: what has to come first for the idea to even land, and what depends on what. The one carrying example to build the session around. I was going to use the simulation hypothesis / brain-in-a-vat scenario, since they all know it, and frame the whole thing as "you can't even state the sceptical hypothesis without presupposing X" — but I suspect that's a trap that teaches them transcendental arguments are just anti-sceptical trickery. Tell me if it's the wrong example, and if so what the right kind of example has to have and what it has to lack. (Also, someone told me Putnam's brain-in-a-vat argument is itself classified as one of these, which makes me wonder whether using it as the teaching example is even coherent — clarify if you can.)

  Then the misconceptions they'll form, in the order they'll form them, including whether Maya's objection (b) will occur to them and at what point I should let it land versus head it off, and exactly where in the sequence I should deal with each. One more thing I want them to actually get, and I think it's the real crux: that the necessity being claimed here is neither causal nor analytic, and why that's not a dodge. Then the single question I can ask in the last five minutes that would show me whether the structure of the thing landed, rather than whether they can recite the jargon. And tell me what I should openly refuse to cover at this level and say so out loud. No reading lists or citations please, they won't read them and I can't stand the guessing game.
