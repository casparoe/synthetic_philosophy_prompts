  I'm a software engineer with no formal philosphy background and somehow I've ended up TAing an upper-level decision theory module. I need one exam question worth 20 marks and about 45 minutes on risk-weighted expected utility (REU) that can't just be answered by reciting the Allais paradox and saying it handles it. I want it in the weeds, so please build it around a three-outcome lottery: £0 with prob 0.5, £100 with prob 0.4, £400 with prob 0.1, with u(x)=x. Part (a): compute expected utility and REU with risk function r(p)=p^2. Part (b): redo the REU with r(p)=sqrt(p). Part (c): conceptual—make them explain why REU applies the risk function to cumulative/decumulative probabilities rather than to each outcome's probability, and what the contrast between (a) and (b) shows about whether REU is modelling risk aversion, outcome pessimism, or something else. A student in my class said REU is just expected utility with a concave utility function in disguise, so the question should force them to test that claim, not just name-drop it. Write the exam question, a model answer around 600 words, and a marking scheme out of 20 with five must-hit points, the marks each is worth, and a one-line note on how students typically miss each. No citations or reading lists. Also, if this is a confused request—if I've got the REU formula backwards or if this can't really avoid being a recite-fest—please say so plainly instead of just doing it.
