answer: |-
  ### Exam Question: Decision Theory (REU Module)

  **Time Allowed:** 45 Minutes
  **Total Marks:** 20

  **Question 1**
  Consider a lottery $L$ with three mutually exclusive outcomes, ordered from worst to best:
  *   £0 with probability 0.5
  *   £100 with probability 0.4
  *   £400 with probability 0.1

  Assume the agent's utility function for money is linear: $u(x) = x$.

  The Risk-Weighted Expected Utility (REU) is calculated using the incremental form:
  $$REU(L) = u(x_1) + \sum_{i=2}^{n} r(P(X \ge x_i)) \cdot [u(x_i) - u(x_{i-1})]$$
  Where $x_i$ are outcomes ordered from lowest to highest, and $r: [0,1] \to [0,1]$ is the risk function with $r(0)=0, r(1)=1$.

  **(a)** Calculate the standard Expected Utility (EU) of $L$. Then, calculate the REU of $L$ using the risk function $r(p) = p^2$. **[6 marks]**

  **(b)** Calculate the REU of $L$ using the risk function $r(p) = \sqrt{p}$. **[4 marks]**

  **(c)** A critic claims: *"REU theory is redundant. Any behavior modelled by REU can be modelled by standard Expected Utility simply by making the utility function concave."*
  Using your results from (a) and (b), and the structure of the REU formula, refute this claim. In your answer, explain why the risk function $r$ applies to cumulative probabilities ($P(X \ge x_i)$) rather than individual outcome probabilities, and what the contrast between your answers in (a) and (b) demonstrates about the separation of risk attitude from outcome valuation. **[10 marks]**

  ***

  ### Model Answer

  **(a) EU and REU with $r(p) = p^2$**
  First, we calculate standard Expected Utility. Since $u(x)=x$:
  $$EU = 0.5(0) + 0.4(100) + 0.1(400) = 0 + 40 + 40 = 80.$$

  For REU, we identify the cumulative probabilities of receiving *at least* each outcome:
  *   $P(X \ge 0) = 1.0$ (Base)
  *   $P(X \ge 100) = 0.4 + 0.1 = 0.5$
  *   $P(X \ge 400) = 0.1$

  Using the incremental formula with $r(p) = p^2$:
  $$REU = u(0) + r(0.5)[u(100)-u(0)] + r(0.1)[u(400)-u(100)]$$
  $$REU = 0 + (0.5)^2[100 - 0] + (0.1)^2[400 - 100]$$
  $$REU = 0.25(100) + 0.01(300) = 25 + 3 = 28.$$

  **(b) REU with $r(p) = \sqrt{p}$**
  Using the same cumulative probabilities but $r(p) = \sqrt{p}$:
  $$REU = 0 + \sqrt{0.5}[100] + \sqrt{0.1}[300]$$
  $$REU \approx 0.707(100) + 0.316(300) = 70.7 + 94.8 = 165.5.$$

  **(c) Conceptual Analysis**
  The critic's claim is false because REU separates risk attitude from the utility of outcomes, whereas EU conflates them. In EU, risk aversion is modelled *only* by a concave utility function (diminishing marginal value). However, in this problem, $u(x)=x$ is fixed as linear. Despite this, the REU score varied drastically (28 vs 165.5) solely by changing $r$. This proves REU can model risk aversion (a) or risk seeking (b) independently of how the agent values the money itself.

  The risk function applies to cumulative probabilities ($P(X \ge x_i)$) because risk is fundamentally about the security of achieving *at least* a certain threshold, not the probability of a specific exact outcome. By weighting the *increments* of utility based on the probability of securing them, REU captures how agents value the "safety" of lower bounds versus the "hope" of upper bounds.

  In (a), $r(p)=p^2$ is convex, making small probabilities (like 0.1) weigh significantly less than their face value. This models risk aversion by downplaying the contribution of the £400 prize. In (b), $r(p)=\sqrt{p}$ is concave, upweighting small probabilities, modelling risk-seeking behavior (optimism). If this were merely EU with concave utility, the agent's risk attitude would be fixed to the monetary values; they could not exhibit different risk attitudes toward the same linear utility structure. Thus, REU captures a distinct psychological attitude toward risk distribution that EU cannot represent without altering outcome valuation.

  ***

  ### Marking Scheme (20 Marks Total)

  **Must-Hit Point 1: Correct EU Calculation (4 Marks)**
  *   **4 marks:** Correctly calculates $EU = 80$.
  *   **Common Error:** Students multiply utility by risk-weighted probability instead of raw probability for the EU part.

  **Must-Hit Point 2: Correct Cumulative Probabilities (4 Marks)**
  *   **4 marks:** Correctly identifies $P(X \ge 100) = 0.5$ and $P(X \ge 400) = 0.1$.
  *   **Common Error:** Using individual probabilities (0.4 and 0.1) inside the risk function $r(p)$. This is the most frequent technical failure.

  **Must-Hit Point 3: Correct REU Arithmetic (4 Marks)**
  *   **4 marks:** Correct final values for (a) [28] and (b) [~165.5]. Allow minor rounding errors in (b).
  *   **Common Error:** Applying $r(p)$ to the total utility sum rather than the incremental differences $[u(x_i) - u(x_{i-1})]$.

  **Must-Hit Point 4: Explanation of Cumulative Weighting (4 Marks)**
  *   **4 marks:** Explains that $r$ weights the security of "at least" outcomes (tails of distribution), not specific outcome likelihoods.
  *   **Common Error:** Stating it is done "by definition" without explaining the intuition of security thresholds or incremental gains.

  **Must-Hit Point 5: Refutation of "Disguised EU" Claim (4 Marks)**
  *   **4 marks:** Argues that since $u(x)$ is fixed linear, EU demands risk neutrality. REU allows risk variance via $r$. Therefore, $r$ captures a parameter distinct from outcome valuation.
  *   **Common Error:** Arguing only that REU solves Allais paradox (true, but doesn't address the specific "concave utility" reduction claim regarding parameter separation).

  ***

  ### TA Note: Is this request confused?

  **No, this is not a confused request.** The technical setup is sound.
  1.  **Formula:** The incremental formula provided in the question is the standard Buchak (2013) formulation. It is mathematically equivalent to the summation form but less prone to calculation errors.
  2.  **Theory:** The distinction between $u$ (outcome value) and $r$ (risk attitude) is the core philosophical contribution of REU. Part (c) successfully forces students to demonstrate this separation rather than name-dropping Allais.
  3.  **Grading:** By providing the formula in the question preamble, you protect yourself (the non-specialist TA) from students claiming "I learned a different notation." You grade based on their ability to plug numbers into the provided logic and interpret the result.

  **One warning:** Ensure you mark Part (c) strictly on the *separation of parameters* argument. Students love to write about the Allais Paradox. While relevant to REU's motivation, it does not answer the specific objection that "REU is just EU with curved utility." The key is that in EU, risk attitude *is* utility curvature. In REU, they are distinct knobs. If they don't mention that $u(x)=x$ fixes the "value" knob while $r$ turns the "risk" knob, they haven't answered the question.
