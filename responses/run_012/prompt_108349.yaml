      *(Refining the "Concept vs Capacity" point)*: The supervisor is right. This is the crux. If "recognize" means "subsume under a concept," Empiricists win (concepts need language/abstraction). If "recognize" means "guide action appropriately," Nativists have a fighting chance. The impasse exists because the group is using one word for two different cognitive mechanisms.

