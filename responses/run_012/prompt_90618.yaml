      *   Ensure the "Split Brain" section is sharp.
      *   Ensure the "Smuggled Freight" is distinct from "The Break."

  8.  **Refining the "Split Brain" Section:**
      *   If a brain is split, do we have one person or two? Philosophers/Neuroscientists debate this.
