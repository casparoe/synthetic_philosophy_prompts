      *   *License:* Coordination for mutual benefit, but no ship is *fuel* for another.
      *   *Wait, the prompt asks for one that does the "same motivational work" (aggregation).* The Body analogy justifies *loss* for the *gain*. A Convoy usually implies *no loss*.
