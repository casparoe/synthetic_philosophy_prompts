      *   *What it licenses:* Prioritization based on survival probability.
      *   *What it forbids:* Killing one to harvest organs for five (the classic counter). The Body analogy blurs this; the Hospital analogy makes it stark.
      *   *Decision:* The **Triage** analogy is the honest version of the **Body** analogy. It keeps the aggregation (save the most) but drops the metaphysical unity.

  7.  **Drafting the Content (Iterative refinement for tone):**
