      *   *User's Hypothesis:* "In a body the parts are insensate and the whole is where the experience is, while in a society the parts are the subjects and the whole has no standpoint of its own."
      *   *Evaluation:* This is precisely Rawls's "separateness of persons" point. In a body, cutting a finger hurts *the person*. The finger doesn't have a separate mind that feels betrayed. In society, sacrificing a person hurts *that person*. The "society" doesn't feel the pain; it just registers a statistic.
