      *   *Crucial Point:* Even if it's one person, the *hemispheres* don't feel pain independently. In society, the *individuals* do. The split-brain case actually highlights that consciousness is the glue. Without a "society consciousness," the split doesn't matter; the separateness is the default.
      *   *Revision:* Focus on the fact that in split-brain cases, we worry about the *conflict* between halves. In society, conflict is the norm. The Body analogy assumes harmony.

