      *   *Impact on Aggregation:* If a society is like a split brain, it's actually *many* subjects. If we treat it as one, we are ignoring the "split." If the "body" analogy relies on the *unity* of consciousness to justify sacrifice, the split-brain case shows that unity is fragile. If the society is "split" (conflicted, polarized), the "single brain" model fails.
      *   *Refinement:* Actually, the stronger point is: In a split-brain patient, we don't say "Left Hand, sacrifice yourself for Right Hand's happiness" as if *one* person benefits. We acknowledge the fragmentation. If society is a split brain, the "Greater Good" is a fiction covering up distinct, competing subjects.

