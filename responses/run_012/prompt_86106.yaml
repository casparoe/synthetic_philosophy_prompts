          *   *Cons:* Might feel too much like a history lecture. Risks ending on a somber note about the "fragile crust."
      *   *Option 2: The Question First.* Start with the anxiety of the question "What to live for?" Then introduce Keynes as a guide who struggled with the same thing.
          *   *Pros:* Relatable to students.
          *   *Cons:* Needs to ensure the philosophy doesn't get lost in the personal anecdote.
      *   *Option 3: The Paradox.* Start with the tension: "Live for beauty" vs. "The world is dangerous."
          *   *Pros:* Engages the intellectual tension immediately.
          *   *Cons:* Might be too abstract for a commencement.

      *   *Decision:* I'll go with a hybrid of Option 2 and 3. Start with the weight of the question (relatable), introduce the "secret society" vibe of young Keynes (intriguing), explain the core idea (states of mind), then pivot to the complication (the dark forces), and resolve with a practical synthesis for the graduates.

      *   *Handling the Tension:* The key is to frame the "later Keynes" not as a rejection of the "early Keynes," but as a maturation of it. The early view is the *destination*; the later view is the *map of the terrain*. We aim for the states of mind, but we acknowledge the path is rocky. We don't need to pretend greed is good, but we acknowledge it's a tool we haven't outgrown yet.

      *   *Avoiding "New Duties":* Emphasize that seeking beauty/love isn't a *job*. It's the point of the job. It's about attention, not achievement.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the honor. Validate the fear of the question "What to live for?" Dismiss the standard answers (money, impact).
      *   **The Keynes Story (Young):** Introduce Keynes as a young man (like them). The Cambridge circle. The revelation from their teacher (Moore, unnamed or lightly named). The core idea: The good is a *feeling*, a *state of mind*. Love, art, conversation.
      *   **The Radical Shift:** The rejection of "Duty." This is crucial. It's not about what you *owe* the world, but what you *experience* with the world. "Immoralists" in the philosophical sense.
      *   **The Complication (Older Keynes):** Time passes. Wars happen. Keynes realizes human nature is darker. Civilization is thin. The "Economic Possibilities" essay. We still need to play the game of money/duty for now.
      *   **The Synthesis/Advice:** How to live with this? Don't wait for the economic problem to be solved. Don't pretend the dark stuff isn't there. But keep the *goal* clear. The "states of mind" are the compass, even if the ship is heavy.
      *   **Conclusion:** Warm send-off. You are the guardians of the good life.

  4.  **Refining the Tone:**
      *   Avoid academic jargon ("utilitarianism," "deontology").
