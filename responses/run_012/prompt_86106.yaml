answer: |-
  **Brainstorming & Structure**

  *   **Opening:** Acknowledge the weight of the question. Most commencement speeches offer a to-do list. I want to offer a way of *seeing*.
  *   **The Hook:** Introduce John Maynard Keynes not as the man in the suit on the currency, but as a 22-year-old student, sitting in a room in Cambridge, terrified and excited about the same question.
  *   **Part I: The Vision (Young Keynes):** Explain the core idea simply. The good isn't a trophy; it's a feeling. Love, art, conversation. The radical idea that "duty" is often a distraction.
  *   **Part II: The Complication (Older Keynes):** The world is dangerous. Human nature has depth and darkness. We can't just ignore the machinery of society (money, rules) yet.
  *   **Part III: The Synthesis:** How to hold both? The "states of mind" are the destination; the "duties" are just the map we use until we get there. Don't confuse the map for the territory.
  *   **Closing:** A wish for them to protect those moments of clarity.

  ***

  **Commencement Address: The Thin Crust and the Golden Moments**

  Class of 2024, faculty, families, and friends.

  It is a profound honor to stand here. I know that traditionally, this is the moment where I offer you a roadmap. I am supposed to tell you how to build a career, how to serve your community, or how to change the world. But you, in your wisdom, asked for something else. You asked me to talk about what to live *for*. Not how to make a living, but how to inhabit a life.

  That is a terrifying question. It is much easier to talk about productivity than purpose. So, I want to take you back to a room in Cambridge University, just over a century ago. A group of young men, roughly your age, sat around a table arguing about this exact thing. Among them was a brilliant student named John Maynard Keynes. You know him as the economist who shaped the modern world. But before he was an economist, he was a philosopher of the good life.

  Keynes and his friends were influenced by an older teacher, a man who told them something radical. He told them that the "good" is not a list of rules. It is not about checking boxes on a moral scorecard. Instead, the good is a certain kind of *state of mind*.

  Think about the best moments you have had in the last four years. Maybe it was a conversation with a friend that lasted until 3:00 AM, where the world fell away and it was just you and the ideas. Maybe it was standing in front of a painting and feeling your breath catch. Maybe it was the quiet satisfaction of understanding a difficult truth, or the warmth of being truly known by another person.

  Keynes and his friends decided that *this* was the point. Not the degree, not the job title, not the legacy. The point was the quality of the consciousness experiencing the world. They believed that the ultimate value of human life lay in the enjoyment of beautiful things and the pleasures of human company. Everything else—money, status, even conventional morality—was just furniture. It was useful only insofar as it made room for those golden moments.

  This led them to a startling conclusion. They called themselves "immoralists." Now, I want the parents in the audience to take a deep breath. They did not mean they wanted to go out and hurt people. They meant they rejected the idea of "Duty" with a capital D. They believed that doing something just because society said you "ought" to do it was a waste of a human life. If an action didn't lead to a good state of mind—for yourself or others—it was empty. They wanted to live for love and beauty, not for obligation.

  It is a seductive vision. It feels honest. It places the weight of life on experience rather than achievement. But, if I stopped there, I would be lying to you.

  Keynes lived a long life. He saw two world wars. He saw the collapse of economies and the rise of tyrants. And as he grew older, his view of human nature deepened. He realized that the early vision was too thin.

  He came to understand that civilization is a thin crust, floating over a dark and volatile ocean. He realized that human beings are driven by forces we don't fully understand—fears, instincts, unconscious drives. You cannot simply wish away the dark stuff by focusing on beauty. The dark stuff is real.

  In one of his last great essays, written during the Great Depression, Keynes looked into the future. He imagined a time, perhaps a hundred years hence, when humanity would have solved the economic problem. A time when we would no longer need to be greedy, or cautious, or obsessed with money, because we would have enough. He imagined a future where we could finally return to that early vision: living for the art of living.

  But, he added a crucial caveat. He said that *until* that day comes, we have to keep pretending. We have to pretend that greed is a virtue, because it drives investment. We have to pretend that caution is noble, because it protects savings. We have to play the game of duty and obligation, not because they are the ultimate good, but because they are the tools we need to keep the crust of civilization from cracking.

  So, here is the tension I leave with you. It is the tension between the young Keynes and the old Keynes.

  On one hand, you have the truth of the young man: The only thing that ultimately matters is the quality of your experience and the love you share. If you lose that, you have lost everything, even if you save the world.

  On the other hand, you have the wisdom of the older man: The world is fragile. We are not yet free from the need for structure, for defense, for the "virtues" of prudence and work. If you ignore the machinery of society, the machinery may crush you, and crush the beauty along with it.

  How do you live with this?

  My advice is this: Do not confuse the map for the territory.

  The "duties" you will face—the jobs you must keep, the bills you must pay, the social expectations you must navigate—these are the map. They are necessary. You cannot ignore them. Keynes was right that we cannot simply opt out of the economic problem yet. We must be prudent. We must be responsible.

  But never, ever mistake the map for the territory. Do not let the pursuit of security crowd out the pursuit of the good states of mind. Do not let the "shoulds" of your life suffocate the "is" of your life. When you are working hard to build stability, remember *why* you are building it. You are building a shelter so that you and the people you love have a place to sit, to talk, to look at the moon, to feel the weight of the world lift for a moment.

  The older Keynes worried that we were doomed to pretend forever. He worried we would become "money-makers" rather than "life-enjoyers." Your task is to prove him wrong, or at least, to resist him.

  You do not need to wait for the economic problem to be solved to start living. You can carve out spaces of freedom now. You can decide that a Sunday afternoon is not for productivity, but for restoration. You can decide that a career choice is not about prestige, but about whether it leaves you enough energy to be present for your friends. You can acknowledge the dark forces in the world without letting them harden your heart.

  In fact, knowing that civilization is fragile makes those moments of beauty more precious, not less. The fact that the crust is thin means we must tread carefully, but it also means we must cherish the ground we stand on.

  So, Class of 2024, go out and do your duty. Pay your taxes. Be kind to your neighbors. Build your careers. But do all of that as a means to an end, not as the end itself. Protect your capacity for wonder. Protect your ability to sit in a room with friends and feel, for a moment, that nothing else is required of you.

  Keynes once wrote that the purpose of life is to live "wisely, well, and beautifully." That is a high bar. But it is the only one that matters. Don't let the world convince you that the instrumental is the intrinsic. Don't let the noise of the machine drown out the music.

  Live for the states of mind. Protect the light. And when the crust feels thin beneath your feet, remember that you are not walking alone.

  Congratulations.
