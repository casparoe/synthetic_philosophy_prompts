answer: |-
  To analyze the advance directive (AD) through the lens of a **promise** is to shift the ethical framework from one of *authority* (precedent autonomy) or *welfare* (best interests) to one of **fidelity and relational obligation**. In this model, the competent "earlier self" makes a moral commitment to the future "later self," creating a bond of trust that survives the erosion of memory or capacity.

  Below is an analysis of the implications of this promissory reading, applied first to the specific case of the cheerful dementia patient, and second to the general question of deference. In each section, I explicitly distinguish implications **shared** with the autonomy and interests models from those **distinctive** to the promissory reading.

  ---

  ### I. The Specific Case: The Cheerful Patient vs. The Directive
  **Scenario:** A patient with advanced dementia does not recognize her family and has no memory of her prior values. She is cheerful and expresses a desire to live. However, her AD states that in this condition, life-sustaining treatment should be withheld.

  #### 1. Shared Implications
  *   **With the Autonomy View:** Both the promissory and autonomy views agree that the AD cannot be ignored simply because the patient's current mood has changed. Both views hold that the prior commitment carries significant moral weight that overrides a simple expression of current desire. In both frameworks, the earlier self's decision is not rendered null merely because the later self has different preferences.
  *   **With the Interests View:** Both the promissory and interests views acknowledge that the *condition* of the later self matters. A promise is typically made for the benefit of the promisee (the later self). Therefore, like the interests view, the promissory view must account for the patient's current cheerfulness. If the current state is one of enjoyment, this is relevant data for evaluating the promise, just as it is relevant for evaluating "best interests."

  #### 2. Distinctive Implications of the Promissory Reading
  *   **The Problem of Release:** In standard promissory ethics, a promise binds the promisor unless the promisee releases them. Here, the "promisee" is the later self.
      *   *Implication:* The central ethical question becomes: *Can the demented self release the earlier self from the promise?*
      *   *Distinction:* Unlike the **Autonomy View** (which says the earlier self rules regardless) or the **Interests View** (which says current welfare rules regardless), the Promissory View asks if the later self possesses the *agency* to void the contract. If the patient is too impaired to understand the promise she is releasing, she may lack the standing to void it. This could lead to a counter-intuitive result where the AD is enforced *not* because the earlier self has authority, but because the later self lacks the capacity to grant absolution.
  *   **Frustration of Purpose vs. Change of Mind:** In contract and promise law, a commitment may be voided if the underlying conditions change so radically that the purpose of the promise is frustrated (*rebus sic stantibus*).
      *   *Implication:* If the AD was a promise ("I promise not to let you live in misery"), and the patient is now cheerful, the *terms* of the promise may no longer apply.
      *   *Distinction:* This differs from the **Interests View**, which would override the AD simply because "living is good now." The Promissory View overrides the AD because *keeping the promise* now requires letting her live (since the condition of "misery" triggering the promise to die is absent). It honors the AD by interpreting its conditions, rather than discarding it for current welfare.
  *   **Moral Residue and Betrayal:**
      *   *Implication:* If the directive is overridden to keep the cheerful patient alive, the surrogates experience a specific moral injury: the guilt of breaking a vow.
      *   *Distinction:* The **Autonomy View** sees overriding the AD as a violation of rights (injustice). The **Interests View** sees following it as a harm (maleficence). The **Promissory View** sees overriding it as *betrayal* (infidelity). This suggests that even if we choose to keep the patient alive, we owe a specific ritual of apology or acknowledgment to the memory of the earlier self that is not required in the other two models.

  ---

  ### II. The General Question: Deference When the Later Self Rejects the Directive
  **Question:** How much weight should an AD carry when the current, incapacitated self expresses wishes contrary to it?

  #### 1. Shared Implications
  *   **With the Autonomy View:** Both views agree that the AD should generally presumptively rule. They both reject the idea that current, incapacitated whims should automatically trump prior, competent planning. Both views treat the AD as a stable anchor against the volatility of disease-altered personality.
  *   **With the Interests View:** Both views admit that there are limits to the AD's power. Just as the interests view allows overriding an AD if it causes gross harm, the promissory view acknowledges that promises are not absolute (e.g., one cannot promise to do something immoral or impossible). Both views allow for some flexibility based on the reality of the patient's current situation.

  #### 2. Distinctive Implications of the Promissory Reading
  *   **The Surrogate as Trustee, Not Substitute:**
      *   *Implication:* Under the **Autonomy View**, the surrogate is a "substitute judgment" maker, trying to be a ventriloquist for the earlier self. Under the **Promissory View**, the surrogate is a *trustee* or *executor* of a covenant.
      *   *Distinction:* This shifts the surrogate's burden. They are not merely guessing what the patient would want (epistemic task) nor calculating utility (consequentialist task); they are adjudicating a moral relationship. They must ask: "What does fidelity require in this specific context?" This allows for a middle ground where the surrogate might negotiate a compromise (e.g., limited treatment) that honors the *spirit* of the promise without adhering to the *letter* of it, a flexibility less available in strict autonomy models.
  *   **The "Changed Circumstances" Threshold:**
      *   *Implication:* The promissory reading introduces a specific threshold for overriding the AD: *Radical Discontinuity.*
      *   *Distinction:* The **Autonomy View** struggles with discontinuity (why should the earlier self rule if they are effectively a different person?). The **Interests View** ignores discontinuity (welfare is welfare). The **Promissory View** leans into it: A promise binds only so long as the parties remain recognizably the same entities in the relevant sense. If the dementia is so severe that the "later self" is a stranger to the "earlier self," the promise may dissolve not because of welfare, but because the *relationship* required to sustain the promise no longer exists. This provides a principled reason to discard an AD that is distinct from both "rights" and "happiness."
  *   **Obligation Without Authority:**
      *   *Implication:* The promissory view can demand compliance with an AD even if the earlier self lacks "authority" over the later self.
      *   *Distinction:* In the **Autonomy View**, if the earlier self has no political/moral authority over the later self (the "different person" objection), the AD is void. In the **Promissory View**, I can make a promise to you that binds me, even if I don't rule over you. Similarly, the earlier self can bind the *surrogates* to care for the later self in a certain way, even if the earlier self doesn't own the later self. This allows the AD to remain binding based on the *surrogates' duty to the earlier self*, independent of the later self's rights.

  ### Summary Table

  | Feature | Autonomy View (Precedent) | Interests View (Best Welfare) | **Promissory View (Fidelity)** |
  | :--- | :--- | :--- | :--- |
  | **Primary Value** | Liberty / Self-Rule | Well-being / Happiness | **Fidelity / Trust** |
  | **Why follow AD?** | The earlier self has authority. | The AD protects the later self. | **The earlier self made a vow.** |
  | **Case: Cheerful Dementia** | Follow AD (Rights trump mood). | Override AD (Life is good). | **Analyze Terms:** Was the promise conditional on suffering? Can the demented self release the vow? |
  | **General Deference** | High (unless invalid signature). | Low (if current welfare conflicts). | **Moderate/Conditional:** Binding unless circumstances frustrate the promise's purpose. |
  | **Distinctive Burden** | Protecting Rights. | Preventing Harm. | **Avoiding Betrayal.** |

  ### Conclusion
  Treating the advance directive as a promise offers a unique middle path. It avoids the rigidity of the **Autonomy View**, which can seem tyrannical when the later self is happy, and it avoids the potential fickleness of the **Interests View**, which might disregard deep values for momentary contentment.

  The **distinctive implication** of the promissory reading is that it transforms the decision from a calculation of power or welfare into an inquiry about **relationship and release**. It forces us to ask not just "What did she want?" or "What is good for her?" but "What do we owe her, given the vow she made to herself?" In the case of the cheerful dementia patient, this might paradoxically lead to honoring the directive (because the patient cannot release the promise) or overriding it (because the condition of misery required to trigger the promise is absent), but the *reasoning* remains fundamentally rooted in the ethics of keeping faith rather than rights or utility.
