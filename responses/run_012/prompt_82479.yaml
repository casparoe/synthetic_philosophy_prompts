answer: |-
  **Exam Question**

  **Question 4: The Unilateralist's Curse under Population Uncertainty**

  The standard formulation of the unilateralist's curse (Bostrom, Douglas, & Sandberg) assumes a fixed group of agents assessing a binary initiative: it is either objectively good or objectively bad. Consider a modified scenario: An action $A$ yields a significant public benefit if *at least one* agent performs it, but generates a net social harm if more than $K$ agents perform it. The total number of potential actors, $N$, is unknown to all agents. Each agent holds a private, independent estimate of $N$ and a private credence regarding the value of $K$.

  Write an essay analyzing how this uncertainty regarding $N$ transforms the epistemic and strategic conditions of the unilateralist's curse. Specifically, address whether it can be instrumentally rational for an agent to perform $A$ even if they assign a probability $p < 0.5$ to the action resulting in a net positive outcome. In your analysis, distinguish between the standard curse's problem of *epistemic independence* and this scenario's problem of *coordination under uncertainty*.

  ***

  **Model Answer**

  The standard unilateralist's curse arises when agents, sharing a common goal, act on independent judgments regarding a binary initiative. The curse dictates that if the initiative is actually harmful, the probability that *at least one* agent erroneously judges it beneficial approaches 1 as the group size increases. The prescribed solution is a norm of restraint: agents should defer to a consensus or assume their judgment is not unique. However, the scenario presented here fundamentally alters the payoff structure and the epistemic landscape, shifting the problem from pure epistemic humility to a complex game of strategic volunteering under population uncertainty.

  In the standard model, $N$ is effectively known or irrelevant to the payoff structure; the harm is intrinsic to the action itself. Here, the harm is extrinsic, contingent on the aggregate behavior of an unknown population. Uncertainty about $N$ exacerbates the curse because it prevents agents from calculating the probability of crossing the harm threshold $K$. If agents hold private estimates of $N$, they cannot establish a common prior required for a robust consensus norm. An agent estimating a small $N$ may rationally decide to act, assuming they are unlikely to trigger the congestion harm. If many agents share this optimistic estimate of $N$, the collective result is a tragedy of the commons, even if no individual acted maliciously or ignorantly. Thus, uncertainty about $N$ decouples individual rationality from collective optimality more severely than the standard curse, as the "correctness" of the action is not fixed but emergent.

  This structural shift directly impacts the question of whether it is rational to act when one believes the action is *probably* wrong (i.e., assigns $p < 0.5$ to a net positive outcome). In standard decision theory, an agent acts if the Expected Utility (EU) is positive. Let $B$ be the benefit if $1 \le \text{actors} \le K$, and $H$ be the harm if $\text{actors} > K$. An agent's EU depends critically on the probability of being *pivotal*.

  It can indeed be rational to act despite $p < 0.5$, provided the utility function is sufficiently asymmetric. If the benefit $B$ of being the *sole* actor is enormous (e.g., preventing an existential catastrophe) and the marginal harm of contributing to an overcrowded field is relatively diffuse or capped, the $EU$ of acting may remain positive even if the action is more likely to fail than succeed. This is a "Pascalian" unilateralism. The agent reasons: "If I don't act, and no one else does, the loss is infinite. If I do act, and too many follow, the loss is finite."

  However, this rationality is fragile. It relies on the agent's private estimate of $N$ suggesting a low probability of others acting. If the agent suspects their private estimate of $N$ is correlated with others (e.g., all reading the same report), the rationality collapses. The standard curse advises restraint because independent judgments likely contain errors. This modified scenario advises restraint only if the risk of over-saturation outweighs the value of being the pivotal volunteer.

  Ultimately, uncertainty about $N$ transforms the unilateralist's curse from an epistemic problem into a coordination problem. The standard solution (defer to consensus) is impossible without knowledge of $N$. Therefore, rationality may demand acting on a minority belief ($p < 0.5$) not because the agent thinks they are right, but because the cost of inaction is higher than the cost of coordination failure. The norm required here is not merely epistemic humility, but a probabilistic commitment to volunteerism calibrated against estimated population density.

  ***

  **Marking Scheme**

  | Point | Criteria (4 points each) | Common Candidate Error |
  | :--- | :--- | :--- |
  | **1** | **Payoff Structure Identification:** Correctly identifies the shift from binary outcome (Good/Bad) to threshold/congestion game (Benefit $\ge 1$, Harm $> K$). | Candidates treat the harm as intrinsic to the action rather than contingent on the number of actors. |
  | **2** | **Analysis of $N$ Uncertainty:** Explains how private estimates of $N$ prevent common knowledge and exacerbate coordination failure compared to known $N$. | Candidates assume agents can easily communicate to estimate $N$ or treat $N$ as a fixed constant. |
  | **3** | **Rationality of $p < 0.5$:** Argues that acting can be rational if the magnitude of Benefit ($B$) vastly outweighs Harm ($H$) despite low probability. | Candidates assert it is *never* rational to act if $p < 0.5$, confusing probability with expected utility. |
  | **4** | **Pivotal Probability:** Discusses the importance of the probability of being the *sole* or *pivotal* actor in the EU calculation. | Candidates focus only on the total probability of success, ignoring the marginal impact of the individual agent. |
  | **5** | **Epistemic vs. Strategic:** Distinguishes the standard curse (epistemic independence/error) from this scenario (strategic coordination/volunteering). | Candidates conflate the two scenarios, applying the standard "norm of restraint" solution without modification. |
