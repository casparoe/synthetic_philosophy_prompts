answer: |-
  This is a single phenomenon. It appears in three different contexts (administrative, legal-doctrinal, and causal), but the underlying moral arithmetic is identical.

  I propose we call this **The Fallacy of Moral Dilution**.

  Here is the definite position: All three of your instances are manifestations of this fallacy. They share a common structural error: they treat a **non-rivalrous obligation** (the duty to protect rights, offer asylum, or acknowledge causality) as if it were a **rivalrous good** (like a pie that gets smaller the more people eat from it).

  ### The Definition
  **The Fallacy of Moral Dilution** occurs when an agent argues that the strength of an obligation is inversely proportional to the number of claimants or contributors involved. It assumes that moral duty is a fixed quantity that must be divided, rather than a standard that must be met for each individual case.

  It relies on a **Zero-Sum Intuition of Duty**: the belief that extending protection to Person B necessarily subtracts from the protection owed to Person A, or that sharing blame with Actor B necessarily subtracts from the blame owed to Actor A.

  ### Why Your Three Cases Are One Thing
  You asked whether the third case belongs with the first two. It does. Here is the mapping:

  1.  **The Administrative Case (Precedent Exhaustion):** The state treats its *willingness* to protect as a finite resource. By framing past admissions as "filling a quota" rather than "fulfilling a standard," they convert a principle (we protect refugees) into a commodity (we have spent our refugee credits).
  2.  **The Legal Case (Particularity):** This is the most entrenched instance. Asylum law distinguishes between "persecution" (targeted) and "generalized violence" (shared). The moral logic underpinning this distinction is that a state's duty is triggered by *malice toward the individual*, not *danger to the human*. When the danger is universal, the specific duty is deemed to vanish. This is pure dilution: the presence of other victims extinguishes the claim of the individual.
  3.  **The Causal Case (Diffusion & Licensing):** This combines two dilution moves. First, **Causal Dilution**: "Because many contributed to the war, our specific contribution is negligible." Second, **Moral Licensing**: "Because we accepted some refugees, our debt is paid." Both rely on the idea that responsibility is a fixed sum to be split or a bill to be paid once, rather than an ongoing relationship to the harm caused.

  In all three, the logic is: *Universality implies Insignificance.*

  ### Boundaries: What This Is Not
  To make this concept useful for your clinic work, you must distinguish it from three legitimate counter-arguments that wear the same clothes.

  **1. It is not a Capacity Limit.**
  *   *The Limit:* "We cannot take more refugees because we have no housing." This is an empirical claim about resources (which are rivalrous).
  *   *The Fallacy:* "We cannot take more refugees because we have already taken some." This is a conceptual claim about obligation.
  *   *The Test:* If the capacity were magically doubled, would the obligation return? If yes, it was a capacity limit. If the official still says "we've done our part," it is Moral Dilution.

  **2. It is not the Distribution of Duty.**
  *   *The Distribution:* "Many states should share the burden of refugees." This is a coordination claim. It argues that while the duty exists, it should be spread out to be sustainable.
  *   *The Fallacy:* "Because many states *could* help, *we* do not have to." This argues that the duty itself evaporates if others are present.
  *   *The Test:* Does the argument demand cooperation (Distribution) or does it demand exemption (Dilution)?

  **3. It is not the Distinction between Charity and Right.**
  *   *The Distinction:* "Humanitarian aid is discretionary; asylum is a right."
  *   *The Fallacy:* Treating a right (asylum) as if it were discretionary charity because the number of claimants is high.
  *   *The Test:* Is the language shifting from "entitlement" to "generosity"? Dilution often smuggles itself in by reclassifying rights as gifts.

  ### The Kantian Ancestor
  Your memory of Kant is precise. In *Perpetual Peace* (Third Definitive Article), Kant argues for a "Right of Hospitality." He explicitly limits this right: strangers have a right to *visit*, but not to *settle*, unless a specific agreement is made. Kant's reasoning is exactly what you identified: the right must be "thin" precisely because it is universal. If every human had a right to settle anywhere, states would dissolve.

  **Here is the crucial distinction:** Kant was describing a **structural constraint** on the *content* of the right to prevent political collapse. He was not arguing that the *existence* of the right diminishes with numbers.
  *   **Kant:** "Because everyone has this right, the *scope* of the right must be narrow (visitation, not settlement)."
  *   **The Fallacy:** "Because everyone has this need, the *force* of the obligation is weak."

  Your clinic opponents are using Kant's structural observation as a moral excuse. They are taking the "thinness" of the universal right and stretching it until it snaps.

  ### Why Case 2 (Asylum Law) Is the Hardest Instance
  You might wonder if Case 2 is truly a fallacy, since it is codified in the 1951 Refugee Convention. The Convention requires a "well-founded fear of persecution" on specific grounds (race, religion, etc.), explicitly excluding those fleeing "generalized violence."

  I argue this is still an instance of Moral Dilution, but **institutionalized**. The legal doctrine assumes that state responsibility is triggered by *specific malice* rather than *general failure of protection*. By requiring "particularity," the law effectively says: "We owe you safety if you are singled out; if everyone is singled out, we owe you nothing more than general humanitarian aid (which is often discretionary)."

  This is the Fallacy of Moral Dilution encoded into statute. It treats the *commonality* of the threat as a reason to *reduce* the legal obligation. It is the most dangerous form of the fallacy because it wears the robe of law rather than the mask of policy.

  ### Summary for Practice
  When you encounter this argument in the clinic, do not fight it on capacity (numbers). Fight it on **arithmetic**.

  *   **Label it:** Identify it as the Zero-Sum Duty Fallacy.
  *   **The Counter:** "The obligation to protect rights is not a pie that gets smaller as more people eat. It is a standard that must be met for every person who qualifies."
  *   **The Trap:** Do not accept the premise that "having done it before" or "doing it for others" reduces the duty. A court does not say, "We have heard enough murder cases this month, so this defendant goes free." A right is a threshold, not a quota.

  **Final Verdict:** The three cases are one animal. It is **The Fallacy of Moral Dilution**. It rules out genuine capacity constraints but exposes arguments where the *principle* of obligation is made to shrink simply because the *population* of claimants has grown. Case 3 belongs with the first two because it treats moral responsibility as a divisible asset rather than a binding standard.
