answer: |-
  # Joint Statement on Algorithmic Fairness Impossibility Results

  **Parties:** Camp 1 (Impossibility Realists) and Camp 2 (Formalism Skeptics)
  **Date:** October 26, 2023
  **Subject:** Resolution of Disagreements Regarding Fairness Metrics and Base Rates

  ### 1. Agreed Claims
  Both sides affirm the following:

  1.  **The Theorem:** Let $A$ be a binary protected attribute, $Y$ a binary outcome, and $R$ a risk score. If the base rates differ ($P(Y=1|A=0) \neq P(Y=1|A=1)$) and prediction is imperfect, it is mathematically impossible to simultaneously satisfy:
      *   **Calibration within groups:** $P(Y=1|R=r, A=a) = r$ for all $r, a$.
      *   **Equal False Positive Rates:** $P(R>t|Y=0, A=0) = P(R>t|Y=0, A=1)$.
      *   **Equal False Negative Rates:** $P(R \le t|Y=1, A=0) = P(R \le t|Y=1, A=1)$.
      *(Note: This holds for any decision threshold $t$, though typically discussed regarding a shared threshold.)*
  2.  **Base Rate Dependence:** The incompatibility arises strictly from the difference in base rates across groups, not from bias in the estimator itself.
  3.  **No Technical Solution:** No algorithmic adjustment can satisfy all three metrics simultaneously under differing base rates.
  4.  **Normative Silence:** The theorem does not establish which metric should be discarded, nor does it dictate which group should bear the burden of error.
  5.  **Policy vs. Model:** The result applies to the joint distribution of scores and outcomes; it does not mandate a specific decision policy (e.g., threshold selection) unless additional constraints are imposed.

  ### 2. Remaining Disagreements

  | Issue | Camp 1 (Impossibility Realists) | Camp 2 (Formalism Skeptics) |
  | :--- | :--- | :--- |
  | **Nature of the Dilemma** | This is a fundamental moral trade-off. Society must explicitly choose which error rate disparity is acceptable. | This is an artifact of constraining the solution space (e.g., demanding equal error rates regardless of cost). |
  | **Role of Groups** | Groups are morally salient categories requiring parity protections, even at the cost of individual consistency. | Groups are modeling choices. Fixing them in advance obscures the actual decision problem (cost-sensitive classification). |
  | **Resolution** | Acknowledge the impossibility and make a political choice about error distribution. | Reframe the objective to utility maximization; the "fairness" dilemma evaporates into standard optimization. |

  ### 3. Stance on Extra Criteria

  **(a) The Relabel Test**
  *Definition:* Flip a person's group label $A$, holding features $X$ and outcome $Y$ fixed. If the decision $D$ changes, the rule is group-conscious.

  *   **Camp 1:** **Accepts failing this test.** To equalize error rates across groups with different base rates, decision thresholds must differ by group. Individual consistency is sacrificed for group parity.
  *   **Camp 2:** **Mixed.** If optimizing for utility with group-specific costs, we fail this test. However, we argue this is not a *fairness* violation but a *utility* optimization. If the goal is individual fairness, we pass this test and accept error rate gaps.

  **(b) Equal Decision Value**
  *Definition:* Under a shared utility function, the expected value of the decision is equal across groups.

  *   **Camp 1:** **Rejects as insufficient.** Equal utility can coexist with wildly unequal error rates (e.g., one group is over-policed but yields high arrest utility). This masks disparate treatment.
  *   **Camp 2:** **Accepts as primary.** This is the correct objective. If expected value is equal, the system is treating groups equally regarding welfare. Error rate disparities are irrelevant noise if utility is balanced.

  **Are these third options?**
  Camp 1 argues (b) is a restatement of utilitarianism that ignores rights. Camp 2 argues (a) is a restatement of individual fairness that ignores structural disparity. Neither is a third option; they are competing normative foundations.

  ### 4. Cruxes and Tests

  **Crux 1: The Morally Arbitrary Group**
  *Question:* If the group label $A$ is swapped for a morally arbitrary digit in an ID number (with the same base-rate gap), does the obligation to equalize error rates persist?

  *   **Test Case:** Construct a dataset where Base Rate differs by ID digit parity.
  *   **Camp 1 Prediction:** The math holds, but the *moral* obligation vanishes. We would not enforce error parity on ID digits. This proves the constraint is moral, not mathematical.
  *   **Camp 2 Prediction:** The dilemma vanishes entirely. No one would propose equalizing FPR across ID digits. This proves the "fairness" problem was never about the math, but about which groups we choose to protect.
  *   **Implication:** If Camp 1 admits no obligation for ID digits, the fight is about group selection, not impossibility.

  **Crux 2: Cost Sensitivity**
  *Question:* If the cost of a False Positive is explicitly higher for Group A than Group B, does equalizing error rates remain the goal?

  *   **Test Case:** Pre-commit to a cost matrix where $C(FP|A=0) > C(FP|A=1)$.
  *   **Camp 1 Prediction:** We should still aim for equal error rates unless the cost difference is overwhelmingly justified. Parity is a right, not a function of cost.
  *   **Camp 2 Prediction:** Equal error rates are now obviously wrong. We should minimize total cost. The "impossibility" is just the statement that you can't minimize cost and satisfy parity simultaneously.
  *   **Implication:** If Camp 1 concedes to cost differences, the disagreement reduces to how we price harms.

  ### 5. Verbal vs. Substantive

  Is this disagreement merely verbal? **Partially.**

  Both sides agree on the math (Theorem, Section 1). Both sides agree that satisfying all metrics is impossible. The dispute is whether "Fairness" is defined by **Metric Parity** (Camp 1) or **Decision Utility** (Camp 2).

  *   If "Fairness" means "Equal Error Rates," Camp 1 wins, and the impossibility is a tragic reality.
  *   If "Fairness" means "Optimal Welfare Distribution," Camp 2 wins, and the impossibility is a modeling constraint we should discard.

  The **ID Digit Test** is the tie-breaker. If Camp 1 agrees we should not enforce error parity on arbitrary digits despite the math holding, they admit the constraint is normative, not technical. If Camp 2 agrees we *should* enforce parity on protected groups despite utility loss, they admit the constraint is deontological, not utilitarian.

  **Conclusion:** The impossibility result is robust mathematics. Its policy implications are not. We agree to stop citing the theorem as a policy conclusion. Future work must specify the normative objective (Parity vs. Utility) before invoking the impossibility result.
