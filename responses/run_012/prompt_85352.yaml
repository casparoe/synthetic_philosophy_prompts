prompt: |-
  I'm running a session on the algorithmic fairness impossibility results and I want the two camps in our group to finally write the doc they should've written a year ago instead of rehashing it every week. Camp one: the people who think the impossibility is real and robust — you can't have a predictor that's calibrated within each group (among everyone in a group who gets the same score, the same fraction actually has the outcome), plus equal false positive rates, plus equal false negative rates, once the base rates differ; so somebody has to decide which errors land on whom, and that's a moral choice you have to own rather than a technical one. Camp two: the people who think it's an artifcat of a bad formalism — groups fixed in advance, one shared threshold for everyone, treating "a score should mean the same thing in both groups" as a requirement rather than a modelling choice, and assessing the model instead of the whole decision policy including thresholds and costs — and who think that once you reframe, the dilemma either evaporates or turns out to be a question you already had independent moral reasons about.

  Draft the joint statement for them. I want: a numbered list of claims both sides can sign, including a precise statement of the theorem (if my version above is off, say so and give the correct one, with its assumptions spelled out) and including what both agree the result does *not* establish; then a table of the remaining disagreements, each side's view worded so that side would accept its own wording; then the cruxes, each phrased as a sub-question whose answer would move at least one side.

  Two extra criteria I want both sides forced to take a stand on, because they sharpen things:

  (a) the relabel test — flip a person's group label, hold their features and their true outcome fixed; if the decision changes, the rule is group-conscious. Passing this test is compatible with awful error-rate gaps, and equalizing error rates usually means failing it.
  (b) equal decision value — under one shared utility function, the expected value of the decision comes out the same in both groups. You can have this with wildly unequal error rates.

  Where does each camp land on those two, and are they genuine third options or restatements of something already on the table?

  For each crux, give a case or test both sides would agree bears on it, and write down each side's prediction in advance. One I'm curious about: if you swap the group label for a morally arbitrary one carrying the same base-rate gap — say an arbitrary digit in an ID number — does either side's verdict change? And if it does, does that show the fight was about groups all along, or about something else? Also tell me if any part of this is just verbal. Keep it under 1200 words, don't bother with citations, I know the literature.
