answer: |-
  To claim merit is detachable welfare misunderstands the mechanism of anumodanā, for the recipient gains nothing unless they themselves generate the wholesome intention of rejoicing in the good deed. Regarding the minor rules, the Buddha's instruction to Ānanda at the Mahāparinibbāna was not an invitation to calculate utility but a trust in the Saṅgha's wisdom to preserve the training's integrity, yet the elders rightly refused to abolish any precepts precisely because the criterion for keeping them is not their social outcome but their efficacy in restraining the āsavas, the taints of the mind. If the rule prevents the arising of lobha, dosa, or moha, it is kept, regardless of whether its abolition might seem to produce more comfort for the community; thus, the 'good' remains inextricably bound to the purification of the agent rather than the aggregation of worldly happiness. The detachable 'merit' you speak of is merely an opportunity for another to cultivate muditā, sympathetic joy, which is itself a state of mind free from envy, not a transferable unit of consequence that defines the moral worth of the original act.
