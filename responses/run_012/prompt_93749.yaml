prompt: |-
  I am drafting a chapter prospectus for a dissertation in political theory and want help turning a half-formed idea into a proposal. The idea is this. Defenses of constitutional monarchy typically say the monarch is neutral or above politics, but I suspect that phrase is doing two jobs that should be pulled apart: impartiality, meaning the office-holder has no stake in the partisan contest, and unaccountability, meaning the office-holder answers to no electorate and can be removed by no vote. An elected ceremonial president can secure the first; only inheritance delivers the second. So the question I want to pose is whether the distinctive contribution of a hereditary monarch to a democracy is precisely their unaccountability, and whether unaccountability can ever be a legitimate basis for authority — or whether the office is legitimate only on the condition that it never acts, in which case its legitimacy is self-undermining the moment it is exercised. Write the proposal: state the question so that it has a determinate answer; explain why the standard positions (the division of the constitution into dignified and efficient parts, the republican objection to hereditary rule, and the debate over reserve powers and conventions) leave it open; say what the method would be and why that approach rather than the obvious alternative of comparative case studies of, say, the UK, Sweden, or Japan; what a result would look like and what would count as the project failing; and a realistic scope for a single chapter of roughly 10,000 words drafted over one semester. Don't bother with citations — I'll add those.
reasoning: |-
  Here's a thinking process that leads to the suggested chapter prospectus:

  1.  **Analyze the Request:**
      *   **Topic:** Political Theory Dissertation Chapter Prospectus.
      *   **Core Idea:** Distinguishing between *impartiality* (no partisan stake) and *unaccountability* (no electoral removal) in defenses of constitutional monarchy. Arguing that inheritance secures unaccountability, while election secures impartiality. The central tension: Is unaccountability a legitimate basis for authority? Or is the office only legitimate if it remains inert (self-undermining if exercised)?
      *   **Requirements:**
          *   State the question with a determinate answer (thesis-driven).
          *   Explain why standard positions (Bagehot's dignified/efficient, republican objections, reserve powers/conventions) leave this specific question open/unresolved.
          *   Specify the method (conceptual/normative analysis) and justify *why* not comparative case studies (UK, Sweden, Japan).
          *   Define success/failure conditions.
          *   Set a realistic scope for a 10,000-word chapter (one semester).
          *   No citations (user will add them).
      *   **Tone:** Academic, precise, persuasive, suitable for a dissertation committee.

  2.  **Deconstruct the Core Argument:**
      *   *Premise 1:* Defenses of monarchy conflate neutrality/impartiality with unaccountability.
      *   *Premise 2:* An elected president can be impartial. Only a hereditary monarch is truly unaccountable.
      *   *Premise 3:* Democratic legitimacy usually requires accountability.
      *   *The Pivot:* If the monarch's value is unaccountability, does that make them a "democratic safeguard" or a "democratic anomaly"?
      *   *The Paradox:* If they act on this unaccountable power, they violate democratic norms. If they don't act, the power is fictitious, and the justification (that they *can* act as a safeguard) collapses.
      *   *Thesis:* The legitimacy of the constitutional monarch rests on a "paradox of inert power": it is legitimate only insofar as it is never exercised, rendering the claim of unaccountability as a functional asset incoherent.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be catchy but descriptive. *The Paradox of Inert Power* or *Unaccountability as Authority*. Let's go with something about the "Logic of Hereditary Neutrality."
      *   **Research Question:** Needs to be sharp. "Is unaccountability a legitimate democratic function?" is too broad. Better: "Does the justification for hereditary monarchy rely on an incoherent conception of power?"
      *   **Literature/Standard Positions:**
          *   *Bagehot:* Dignified vs. Efficient. He explains *what* it does, not *why* unaccountability is normatively okay.
          *   *Republicans:* Say heredity is unjust. They miss the nuance that maybe unaccountability *is* the point, not just an accident.
          *   *Reserve Powers/Conventions:* Focus on *how* it's constrained, not *why* the constraint is necessary for legitimacy.
          *   *Gap:* None of these tackle the normative tension between *unaccountability* and *legitimacy* directly as a conceptual problem.
      *   **Methodology:**
          *   *Why not case studies?* Because the question is normative/conceptual, not empirical. Empirical data shows *if* they act, not *if they should* or *what it means for legitimacy* if they do. Case studies get bogged down in historical contingency.
          *   *What instead?* Conceptual analysis, reconstructing the normative logic of the institution.
      *   **Expected Result/Thesis:** The chapter will argue that the "unaccountability defense" is self-undermining. The monarch is a "placeholder" for sovereignty that cannot be filled without breaking the system.
      *   **Failure Conditions:** If the argument just restates republicanism, or if it gets lost in historical detail, or if it fails to distinguish impartiality from unaccountability clearly.
      *   **Scope:** 10,000 words is tight. Need to focus on the *concept*, not the history.
          *   Intro (1k)
          *   Distinction: Impartiality vs. Unaccountability (2k)
          *   Critique of Standard Defenses (Bagehot, etc.) (2k)
          *   The Normative Problem (Unaccountability vs. Legitimacy) (3k)
          *   The Paradox of Inertia (2k)
          *   Conclusion (1k)

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is the distinction between impartiality and unaccountability robust? An elected president *is* accountable, so they might fear losing votes, making them less impartial. A monarch fears nothing. So unaccountability *buys* impartiality.
      *   *Correction:* I need to make sure the prospectus acknowledges that unaccountability *enables* impartiality, but the cost is democratic legitimacy. The tension is: You need unaccountability to be truly neutral, but unaccountability is illegitimate in a democracy.
      *   *Thesis Refinement:* The chapter should argue that the defense of monarchy requires unaccountability to be *potential* rather than *actual*. If actualized, it's tyranny. If only potential, it's a fiction. Therefore, the justification is unstable.

  5.  **Drafting the Content (incorporating the constraints):**
      *   *Tone Check:* Ensure it sounds like a proposal, not the chapter itself. Use future tense or "this chapter will..."
      *   *Constraint Check:* No citations. 10k word scope. One semester.
      *   *Question Formulation:* Make it determinate. "This chapter argues..." rather than "This chapter explores..."

  6.  **Final Polish:**
      *   Check the "Why not case studies" section. Make sure it emphasizes *political theory* methods over *comparative politics* methods.
      *   Ensure the "Failure Conditions" are specific to the argument's logic.
      *   Make sure the distinction between "impartiality" and "unaccountability" is the engine of the whole proposal.

  7.  **Final Review against User Prompt:**
      *   State question with determinate answer? Yes.
      *   Explain standard positions leave it open? Yes.
      *   Method and why not case studies? Yes.
      *   Result and failure conditions? Yes.
      *   Realistic scope (10k words/1 semester)? Yes.
      *   No citations? Yes.

