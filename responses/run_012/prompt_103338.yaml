answer: |-
  Look, grab your drink and let's unpack this because you are absolutely right to feel that nagging sense of unease, even if your mate sounds like he is making the cold, hard logical case. What you have stumbled into here is a classic problem that keeps game theorists and philosophers up at night, and it is basically a clash between two different ways of thinking about rationality. Your mate is arguing from the perspective of what is called weak dominance, which is the standard tool in introductory economics. His logic is that since putting your name in the box costs you nothing, and there is a scenario where it wins you a thousand pounds, there is literally no downside to playing. If you play and win, great. If you play and lose because someone else also played, you are exactly where you would have been if you hadn't played at all. So, on an individual level, playing strictly dominates not playing. By that metric, he is technically correct.

  But your intuition is picking up on something much more profound, which is that you are not playing this game in a vacuum. You are playing it against two hundred other people who are sitting in the same room, hearing the same rules, and likely possessing the same capacity for reason. This is what we call common knowledge of rationality. If the logic to play is so obvious that your mate sees it, then it is obvious to everyone else in the philosophy society too. If everyone follows that obvious logic, everyone puts a slip in the box, the count goes way over one, and nobody wins. So while playing is the best move if you assume other people's actions are fixed regardless of what you do, it becomes a terrible move if you recognize that your decision to play is evidence that everyone else will play too. You are right that this is not just a coincidence; it is a structural feature of the game that your mate is ignoring.

  The real tension here is between causal decision theory and what some people call superrationality or functional decision theory. Your mate is thinking causally, meaning he believes his action cannot physically force anyone else to put a slip in the box. He is right that his hand moving does not move their hands. But in a room full of philosophers, your decision is logically correlated with theirs. If you conclude that playing is the rational choice, you must concede that any other rational person in that room will conclude the same thing. Therefore, by deciding to play, you are effectively deciding on behalf of the group that everyone will play. And if everyone plays, the pot is lost. So, from this higher-level perspective, the rational move might actually be to abstain, or to play only with a certain probability, in the hopes that others do the same, thereby maximizing the chance that exactly one person wins.

  However, here is the practical snag that you need to consider before you walk into that party. While your theoretical point is stronger, relying on it requires a level of coordination that is almost impossible to achieve without talking to each other beforehand. For you to abstain successfully, you need exactly one other person to play. If everyone thinks like you and abstains, nobody wins. If everyone thinks like your mate and plays, nobody wins. The only way someone wins is if there is a mix of thinkers, or if people make mistakes. Since you cannot communicate with the other hundred and ninety-nine people to agree on a randomizing strategy, like everyone flipping a coin and only playing if it lands on heads, you are left in a bit of a bind. You cannot force the group to coordinate on the optimal outcome where exactly one person volunteers.

  So, what should you actually do on the night? If your primary goal is to maximize your own expected cash return and you assume that at least some people in the room will be irrational, distracted, or overly altruistic enough to sit out, then you should probably put your name in the box. It costs you nothing, and there is always a non-zero chance that you are the only one who bothered. In a group of two hundred, it is highly unlikely that literally everyone will be perfectly rational or perfectly irrational. There will be noise. Some people will forget, some will think it is a trick, and some will agree with your mate. If you sit out, you guarantee you get nothing. If you play, you have a tiny shot. But you should go into it knowing that your mate is missing the bigger picture. He is right about the individual incentive, but you are right about the collective tragedy.

  Ultimately, I think you should play, but you should do it with the understanding that you are participating in a system that is designed to fail if everyone is too clever for its own good. It is a beautiful example of how individual rationality can sum up to collective stupidity. If you win, buy the first round next term. If you lose, which is the most likely outcome given the room full of philosophy students who will all be overthinking it just like you, you can at least comfort yourself with the fact that you understood the game better than anyone else there. And maybe, just maybe, suggest to the committee that next year they change the rules to allow for some communication, because otherwise, you are all just walking into a trap of your own reasoning.
