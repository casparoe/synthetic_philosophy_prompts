      *   *Interpretation:* Don't argue philosophy ("Plutarch isn't hagiography!"). But do argue pragmatics ("This won't work for Week 6 if..."). The "unimpeachable virtue" claim is the risky one. I will flag that finding *perfect* lives is hard, so the sequencing must account for *degrees* of virtue or specific *types* of virtue.
