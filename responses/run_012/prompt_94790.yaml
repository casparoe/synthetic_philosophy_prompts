      *   *Key Friction Point:* "Unimpeachable virtue." Plutarch's *Cato* commits suicide. Is that imitable? *Aristides* is ostracized. Is that success? I need to define virtue as *internal consistency* rather than *external success* to make the "unimpeachable" claim hold water.

  9.  **Drafting the Content:**
