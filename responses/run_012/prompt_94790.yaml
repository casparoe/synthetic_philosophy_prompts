      *   **Task:**
          1.  Brainstorm briefly on "learning from a life."
          2.  Select specific *Lives* that fit the "unimpeachable virtue" criteria and sequence them logically.
          3.  Design a unit pairing ancient exemplars with contemporary figures for identification/imitation.
          4.  Create a Week 1 diagnostic exercise (testing grasp of virtue).
          5.  Create a final grading rubric (testing success of imitation).
          6.  **Constraint:** Work *within* the user's assumption, but if an element of the framing does less work than thought, point it out plainly and adjust the plan. (Crucial instruction: "if some element of my framing turns out to be doing less work than I think, tell me plainly and adjust the plan accordingly.")

  2.  **Initial Brainstorming & Critical Check (The "Plain Truth" Constraint):**
      *   *User's Assumption:* Plutarch = Hagiography (flawless exemplars). Mechanism = Imitation.
      *   *Scholarly Reality:* Plutarch is notoriously *not* hagiographical. He includes flaws, ambiguities, and comparative judgments (Parallel Lives). He explicitly states in *Aemilius Paulus* that he is writing lives, not histories, and focuses on virtue, but he often highlights how virtue fails or is complicated by fortune (*tyche*).
      *   *The Conflict:* If I build a course on "flawless exemplars," but the texts contain glaring flaws (e.g., Alcibiades is chaotic, Cato is stubborn to a fault, Antony is a cautionary tale), the course will collapse in Week 3 when students read the text and see the complexity.
      *   *The Adjustment:* I must honor the user's instruction to "work within it" *but* also the instruction to "tell me plainly and adjust the plan accordingly" if the framing does less work than thought.
      *   *Decision:* I cannot pretend Plutarch writes hagiography without setting the student up for confusion. However, I can frame the *selection* process as curating the "hagiographical readings" of specific lives. I need to warn the user that *perfect* virtue is rare in Plutarch. The "unimpeachable" criterion is the weak link. I need to select lives that *lean* hardest into the exemplary mode, even if they aren't perfect.
      *   *Refinement on "Imitation":* Direct imitation of a statesman is hard for modern students. The "contemporary pairing" unit is essential here.
      *   *Refinement on "Hagiography":* I need to explicitly flag that Plutarch's "virtue" isn't modern "niceness." It's *aretē* (excellence). If the student expects a saint, they might be confused by a general. I need to make sure the "virtue" being tested is specific (e.g., courage, moderation, justice).

  3.  **Brainstorming "Learning from a Life":**
      *   It's not just data extraction. It's narrative transportation.
      *   It involves *phronesis* (practical wisdom) to map the ancient context to the modern.
      *   If the assumption is "imitation," learning is mimetic. It requires seeing the action, understanding the motive, and replicating the motive in a new context.

  4.  **Selecting the Lives (The "Unimpeachable" Challenge):**
      *   *Problem:* Many famous lives are tragic or flawed (Alexander, Caesar, Antony, Alcibiades).
      *   *Solution:* Pick the "moral successes."
      *   *Candidates:*
          *   *Aristides:* The Just. Hard to beat.
          *   *Cato the Younger:* The Stoic ideal (though stubborn).
          *   *Phocion:* The good man in bad times.
          *   *Aemilius Paulus:* The perfect general/statesman (Plutarch praises him highly).
          *   *Timoleon:* The liberator who retires (rare virtue).
          *   *Numa:* The peaceful lawgiver.
      *   *Sequencing:* Start with personal virtue (Numa/Aristides), move to political virtue under pressure (Phocion/Cato), end with the synthesis of power and virtue (Aemilius/Timoleon).
      *   *Correction/Adjustment:* I must warn the user that "unimpeachable" is a high bar for Plutarch. I will select the *most* exemplary but advise framing the "flaws" as "tests of virtue" to maintain the course's internal logic.

  5.  **Designing the Contemporary Pairing Unit:**
      *   Need figures students recognize and can emulate (not just admire).
      *   *Pairs:*
          *   Aristides (Justice) -> A modern whistleblower or judge (e.g., Learned Hand or a specific ethical bureaucrat).
          *   Cato (Integrity/Principle) -> A modern conscientious objector or political principled stand (e.g., John Lewis or Vaclav Havel).
          *   Aemilius Paulus (Duty/Leadership) -> A modern military leader or CEO known for ethics (e.g., George Marshall).
      *   *Activity:* "Translation of Virtue." How does *this* virtue look in *my* life?

  6.  **Diagnostic Exercise (Week 1):**
      *   Goal: Test if they see the virtue as the driving force.
      *   Task: Read a short excerpt (e.g., from *Aristides*). Identify the specific action that manifests the virtue.
      *   Trap: Don't let them focus on the outcome (winning), focus on the motive/character.

  7.  **Final Rubric:**
      *   Goal: Grade the *imitation*.
      *   Criteria: Identification of virtue, Contextual translation, Execution, Reflection.
      *   *Crucial:* Since I can't actually grade their life choices, the assignment must be a "Plan of Imitation" or a "Reflective Journal of Attempted Imitation." Let's go with a "Virtue Implementation Plan."

