prompt: |-
  I'm taking a class on medieval Jewish philosophy and we've been reading Maimonides, and I'm trying to get a handle on his view of animal sacrifice. I was discussing it with a friend from my shul who's pretty well-read, and she gave me this summary: 'Maimonides thought the whole sacrificial system was a concession to the Israelites' primitive needs. They were used to sacrificing animals to idols, and God knew they couldn't just stop cold turkey, so He commanded them to sacrifice to Him instead. But God never actually wanted sacrifices; the prophets make this clear. Maimonides says the sacrificial laws were a temporary measure, a kind of educational crutch to wean the people off idolatry, and that prayer is the real form of worship. So in the end, Maimonides was basically against animal sacrifice, and he thought the whole system was a compromise with human weakness.'

  I don't know enough to say if this is fair. I've heard that Maimonides thought sacrifices were a concession to historical circumstances, but the 'temporary' part and the 'basically against it' part sound off to me. Can you act as a scholar of medieval Jewish philosophy and give me a careful accuracy audit? Go through the summary claim by claim: what would a specialist accept as basically right, what's a common simplification that loses something important, and what's just wrong or would make Maimonides roll over in his grave? I'm especially interested in whether the conclusion 'Maimonides was against animal sacrifice' follows from the accurate parts of the summary, or whether it's a distortion. Please start by brainstorming the main interpretive issues, then give me the audit. Don't worry about citing chapter and verse; I just want to understand the view.
