answer: |-
  Yes, there is a name for this, though it lives primarily in academic ethics rather than general discourse. The technical term is **The Problem of Aggregation** (specifically, the aggregation of small harms).

  However, that term describes the broader category. The specific disagreement you are witnessing—the clash over whether trivial harms can mathematically accumulate to outweigh a severe harm—is a debate over **Commensurability**.

  When the person in the ethics meeting says, "You don't get to add up a million itches and come out with a funeral," they are making a claim of **Incommensurability**. They are arguing that the two values (an itch and a life) exist on different scales that cannot be converted into a common currency, no matter how much you multiply the smaller one. The person insisting on the arithmetic is defending **Aggregationism**, the view that all welfare impacts share a common metric and are summable.

  If you need a term for your magazine readers that captures the specific rhetorical impasse—the moment the argument shifts from facts to the rules of addition—I suggest you coin the term **The Summation Barrier**.

  Here is how you should map it out for your readers, how it sits next to its neighbors, and where the line blurs.

  ### The Terminology

  **The Established Term:** *The Problem of Aggregation.*
  In moral philosophy, this covers any debate about whether we can sum benefits or harms across different people to justify a decision. It is most famous in "Trolley Problem" variants (save one person or five?), but your specific case is the **Aggregation of Small Harms**.

  **The Core Concept:** *Commensurability vs. Incommensurability.*
  *   **Commensurability:** The view that all goods and bads can be measured on a single scale (usually "utility" or "welfare"). If they are commensurable, arithmetic always applies.
  *   **Incommensurability:** The view that some values are qualitatively different. A death is not just a "larger number" than an itch; it is a different *kind* of bad. Therefore, no amount of itches can equal a death.

  **The Coined Term:** *The Summation Barrier.*
  Use this to describe the specific moment in the argument where the two sides stop talking about the facts and start fighting about whether addition is permitted. It captures the feeling that there is a wall between "trivial" and "serious" that numbers cannot breach.

  ### The Neighboring Positions

  To understand where this sits, you have to look at the two moral frameworks colliding at the Barrier.

  1.  **Pure Aggregationism (Utilitarianism):**
      *   **The View:** Nothing is special. Everything adds up.
      *   **The Logic:** If a headache is 1 unit of badness and a death is 1,000,000 units, then 1,000,001 headaches are worse than one death.
      *   **The Weakness:** It leads to what philosopher Derek Parfit called the **Repugnant Conclusion**. It implies that a sufficiently large number of trivial annoyances could justify torturing or killing an innocent person. Most people find this intuitively abhorrent.

  2.  **Lexical Priority (Deontology/Rights-Based):**
      *   **The View:** Some harms are so severe they have "lexical priority" (like words in a dictionary, where 'A' always comes before 'B', regardless of how many 'B's you have).
      *   **The Logic:** A right to life trumps a right to comfort. You cannot trade a life for comfort, even if the comfort of a billion people is at stake.
      *   **The Weakness:** It leads to absurdity in the other direction. It implies you should save one person from death even if the alternative is preventing a billion people from going blind or suffering severe chronic pain. At some point, the "small" harms are clearly weightier in total, but the Lexical view forbids saying so.

  **The Summation Barrier** is the fault line between these two views. It is not a fallacy; it is a foundational clash of moral intuition. Neither side is making a logical error; they are starting from different axioms about how value works.

  ### The Cognitive Component: Psychic Numbing

  You mentioned that "once the numbers get big enough... the whole thing stops being about anything you can hold in your head." This is not just philosophy; it is cognitive science.

  Psychologist Paul Slovic calls this **Psychic Numbing**. Human brains are not wired to process large statistics emotionally. We feel the death of one person vividly; we feel the statistic of 10,000 headaches as abstract data. The person using the arithmetic is fighting against the brain's natural inability to scale empathy. The person resisting the arithmetic is often relying on that emotional intuition. When you write about this, acknowledging *Psychic Numbing* explains why the room felt "stupid" when the numbers got high. The arithmetic was correct, but the emotional resonance was broken.

  ### A Case Where It Is Genuinely Unclear

  You asked for a case where it is unclear which side has it right. The "itch vs. death" example is actually too easy; most people agree an itch doesn't sum to a death. To find the edge of the Summation Barrier, you need to move the "small" harm closer to the "big" one.

  **The Case: Chronic Migraines vs. Premature Death**

  *   **Scenario:** A health board has funding for only one initiative.
      *   **Option A:** Save one 20-year-old from a guaranteed, painless death at age 30.
      *   **Option B:** Cure a chronic, severe migraine condition for a large number of people. This condition is not life-threatening, but it involves 15 days a month of blinding pain, vomiting, and inability to work or care for family, lasting for 20 years.
  *   **The Conflict:**
      *   The **Aggregationist** says: The total suffering of the migraineurs outweighs the lost years of the one person. If the number of migraineurs is 5,000, the total "pain-years" dwarf the single life.
      *   The **Non-Aggregationist** says: Death is a threshold. It ends all possibility of value. No amount of pain, however widespread, outweighs the cessation of existence.
  *   **Why It's Unclear:**
      *   If you ask people, "Is 20 years of severe agony worse than dying?" many will hesitate. Some say death is worse. Some say that level of pain is worse.
      *   If death is arguably *worse* than the migraine, then aggregating the migraines should eventually outweigh the death.
      *   But if death is *qualitatively different* (the end of the subject), then aggregation might still be forbidden.
      *   There is no consensus in ethics on where the line is. Some philosophers (like Alastair Norcross) argue we must aggregate. Others (like Frances Kamm) argue there are constraints against it.

  ### How to Write About It

  When you describe this in your magazine, avoid framing it as a mistake. The person doing the arithmetic isn't being cold; they are being consistent. The person refusing the arithmetic isn't being irrational; they are protecting a qualitative distinction.

  The **Summation Barrier** exists because our moral language has two modes: the **mode of rights** (which deals in absolutes) and the **mode of policy** (which deals in totals). The hospital ethics meeting was frustrating because one side was speaking Rights ("You cannot kill") and the other was speaking Policy ("Minimize total harm"). They agreed on the facts, but they were playing different games.

  **Summary for your style guide:**
  *   **Formal Term:** The Problem of Aggregation.
  *   **Core Concept:** Commensurability vs. Incommensurability.
  *   **Magazine Term:** The Summation Barrier.
  *   **Cognitive Mechanism:** Psychic Numbing.
  *   **Classification:** A foundational moral clash, not a fallacy.

  This distinction should give your copy editor nothing to flag and your readers something to think about.
