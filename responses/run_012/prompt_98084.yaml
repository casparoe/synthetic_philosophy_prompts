prompt: |-
  I'm drafting an essay on interpersonal utility comparisons and I want a second pair of eyes before I commit to the argument. Here's the gist of what I've got so far.

  The whole fight between the ordinalists and the people who insist welfare economics needs interpersonal comparisons is, I want to say, a fight about the wrong thing. Both sides ask *whether* two people's utilities are comparable, as though comparability were a feature of the utilities themselves, like two rods happening to be the same length. I want to argue that comparability is a feature of a practice. Two people's goods are comparable relative to some shared scale or project they jointly maintain — the way two lengths are comparable relative to a ruler that both parties are holding. There's no comparability in the abstract; there's only comparability-under-a-scale.

  Three things I want to pull out of that:

  1. The utility monster isn't a reductio of utilitarianism. It's a reductio of pretending the scale exists independent of any project. Ask "a scale for what?" and the monster stops being a problem.
  2. The distinction between comparing how well off two people each are (levels) and comparing how much better off one is than the other (units) is real, but it's derivative — it just tracks two different jobs you might want a scale to do, and there's no reason a single practice has to do both.
  3. So interpersonal comparisions are more like promises than like measurements. They can be kept or broken, wise or reckless, but not true or false.

  Can you tell me where this goes wrong? I have a nagging feeling that 3 doesnt follow from 1 and 2 — that even if the scale is practice-relative, once you're inside a practice the comparison "A is worse off than B" is still just true or false, so I haven't earned the anti-realist ending. And maybe 1 is too quick: the monster might come back as a point about the *shape* a scale has to take rather than about whether it exists at all. Comments on accuracy, and on whether the pieces actually fit together, would be great. Don't worry about polish.
reasoning: |-
  Here's a thinking process that leads to the suggested feedback:

  1.  **Analyze the User's Request:**
      *   **Topic:** Interpersonal Utility Comparisons (IUC) in welfare economics/philosophy.
      *   **Core Thesis:** IUC isn't about metaphysical facts (utilities being comparable in themselves) but about social practices/scales (comparability relative to a shared project).
      *   **Three Key Claims:**
          1.  Utility Monster is a reductio of scale-independence, not utilitarianism.
          2.  Levels vs. Units distinction is derivative/pragmatic, not metaphysical.
          3.  IUCs are like promises (normative commitments), not measurements (truth-apt statements).
      *   **User's Concerns:**
          *   Does (3) follow from (1) and (2)? (The "internal realism" worry: even within a practice, isn't it true/false?)
          *   Is (1) too quick? (The Utility Monster might attack the *shape* of the scale, not just its existence).
          *   General coherence and accuracy check.
      *   **Constraint:** "Don't worry about polish." (Focus on substance and logic).

  2.  **Deconstruct the Argument:**

      *   **Premise:** Comparability is practice-relative (pragmatic/conventional), not metaphysical (realist). Analogy: Length requires a ruler; Utility requires a shared scale/project.
      *   **Claim 1 (Utility Monster):** The monster assumes a scale exists independently. If we ask "a scale for what?" (what project?), the monster dissolves.
      *   **Claim 2 (Levels vs. Units):** These are just different functions of a scale. No need for one scale to do both.
      *   **Claim 3 (Promises vs. Measurements):** IUCs are normative commitments (kept/broken), not descriptive facts (true/false).

  3.  **Evaluate Claim 1 (Utility Monster):**
      *   *Standard Objection:* Nozick's Utility Monster shows that if one person gets *massive* utility from resources, utilitarianism demands we starve everyone else to feed them.
      *   *User's Twist:* The monster relies on the idea that "utility" is a pre-existing magnitude we just discover. If utility is constructed via a practice (e.g., "we are allocating resources to maximize group stability"), then we can define the scale to prevent the monster.
      *   *Critique:* The user is right that the monster relies on cardinality and comparability. But does asking "a scale for what?" solve it? If the project is "maximize satisfaction of preferences," the monster might still emerge if one person has intense preferences. The user needs to argue that the *project* itself dictates the *shape* of the scale (e.g., diminishing marginal utility is built into the project's rules, not discovered in nature).
      *   *Verdict:* Plausible, but needs careful handling. The monster isn't just about existence; it's about the *aggregation function*.

  4.  **Evaluate Claim 2 (Levels vs. Units):**
      *   *Standard View:* Level comparability (A is happier than B) is easier than Unit comparability (A's gain is twice B's loss).
      *   *User's Twist:* Both are just tools for specific jobs.
      *   *Critique:* This is a strong pragmatic move. It aligns with Sen's capability approach or bargaining theory. If the practice is "emergency triage," we need levels. If the practice is "tax policy," we might need units.
      *   *Verdict:* Solid. Fits the "practice-relative" theme well.

  5.  **Evaluate Claim 3 (Promises vs. Measurements) - *The Big Hurdle*:**
      *   *User's Worry:* Even inside a practice (like chess or law), statements can be true/false. "The king is in check" is true relative to the rules of chess. So why are IUCs *not* true/false relative to the practice?
      *   *Analysis:* The user wants to move from "context-dependent truth" to "non-cognitivism/expressivism."
      *   *The Gap:* Premises 1 & 2 establish *contextualism* (truth is relative to a framework). Premise 3 asserts *non-cognitivism* (statements aren't truth-apt at all, they are commitments).
      *   *Why the gap matters:* If I say "A is worse off than B" within the practice of "National Health Allocation," is that a fact *about the practice* (True/False) or a *move in the practice* (Like a promise)?
      *   *Correction:* To earn (3), the user needs to argue that adopting the scale *itself* is the promise. The statement "A > B" might be true *given* the scale, but the *validity of the scale* is the promise. Or, the user is arguing for a specific kind of pragmatism where the *assertion* functions as a commitment to act, not a description.
      *   *Verdict:* The user's nagging feeling is correct. (1) and (2) support *internal realism* (true relative to practice), not necessarily *anti-realism* (not true/false). To get to (3), they need to argue that the *point* of the utterance is performative, not constative.

  6.  **Synthesize Feedback:**

      *   **Strengths:** The "practice-relative" turn is sophisticated (reminiscent of Wittgenstein/Winch or pragmatist economics like Putnam/Sen). It avoids the metaphysical quagmire.
      *   **Weakness 1 (The Monster):** Address the "shape" objection. The monster isn't just about the ruler existing; it's about the ruler being linear. The practice must dictate *concavity*.
      *   **Weakness 2 (The Leap to Anti-Realism):** This is the critical logical gap. Distinguish between "truth is relative" vs. "there is no truth." Suggest refining (3) to be about the *adoption* of the scale being the promise, or reframing (3) as "normative validity" rather than "truth."
      *   **Weakness 3 (Accuracy):** Acknowledge existing literature. This sounds like Allan Gibbard (normative expressivism) or maybe Elizabeth Anderson (pragmatic ethics). Also, Harsanyi vs. Sen.

  7.  **Drafting the Response:**
      *   *Tone:* Collaborative, critical, encouraging.
      *   *Structure:*
          1.  Validate the core insight (it's a strong move).
          2.  Address the "Utility Monster" point (refine the "shape" argument).
          3.  Address the "Levels vs. Units" point (affirm it).
          4.  Deep dive into Point 3 (The Logical Gap). This needs the most attention. Explain *Internal Realism* vs. *Expressivism*.
          5.  Suggest a pivot to make (3) work (e.g., focus on the *adoption* of the scale).
          6.  Bibliographic/Conceptual pointers (Sen, Gibbard, Wittgenstein).

  8.  **Refining the "Point 3" Critique:**
      *   If I say "This plank is 2 meters," relative to a meter stick, it's true/false.
      *   If I say "A's pain is worse than B's," relative to a triage protocol, is it true/false? Yes, medically.
      *   So why is it a promise?
      *   *Idea:* Because the *protocol itself* is a political/moral commitment. The *comparison* is the measurement, but the *authority to compare* is the promise.
      *   *Better Idea:* The user might be conflating the *statement* with the *agreement to use the statement*.
      *   *Advice:* Don't say comparisons aren't true/false. Say their *authority* is normative, not empirical. Or, lean into the "truth is relative to practice" but argue that *choosing the practice* is the non-truth-apt part.
      *   *Actually, looking closer at (3):* "They can be kept or broken... but not true or false." This is classic Expressivism. To get there from Pragmatism (1 & 2), you need to argue that the *function* of the language is to coordinate action, not describe states.
      *   *Recommendation:* Soften (3). Instead of "not true or false," try "their truth is secondary to their normative force." Or acknowledge the "internal truth" but emphasize the "external commitment."

  9.  **Final Polish of Feedback:** Ensure I directly answer the "Where this goes wrong" prompt.
      *   Go wrong? Primarily in the inference to (3).
      *   Monster? Needs more nuance on aggregation.
      *   Fit? 1 & 2 fit well; 3 is the outlier.

  10. (Self-Correction during drafting): Make sure not to impose my own view. Offer options. The user might *want* to be an expressivist, so show them how to bridge the gap, not just tell them they failed.

      *   *Bridge:* The move from "practice-relative" to "promise-like" works if you argue that the *bindingness* of the comparison is what matters, not its accuracy. The comparison *creates* the obligation.

      *   *Okay, ready to write.*
answer: |-
  This is a sophisticated pivot. You are effectively moving the debate from metaphysics (what *is* utility?) to pragmatics (what do we *do* with utility?). This aligns well with certain strands of pragmatist philosophy (Putnam, Sen) and expressivist ethics (Gibbard), but it does have some structural vulnerabilities, particularly in how you bridge the gap between your premises and your conclusion.

  Here is a breakdown of where the argument holds, where it leaks, and specifically how to handle your nagging feeling about point 3.

  ### 1. The Core Insight (Practice-Relative Comparability)
  **Verdict:** Strong.
  This is your strongest move. The ordinalist/cardinalist debate often gets stuck on whether utility is "real" like mass or "fake" like phlogiston. Arguing that comparability is a *social technology* rather than a *natural fact* dissolves the metaphysical anxiety.
  *   **Accuracy Check:** You are essentially arguing for **conceptual relativism** regarding utility. This is historically defensible. Economists like Robbins argued IUCs were meaningless *scientifically*, but political philosophers (like Sen) argue they are necessary *ethically*. Your move is to say they are meaningful *institutionally*.
  *   **Refinement:** Be careful not to sound like you're saying "anything goes." A practice still has rules. If the practice is "allocating ventilators," the scale is constrained by medical facts, even if the *comparability* is a social decision.

  ### 2. Point 1: The Utility Monster
  **Verdict:** Plausible, but your intuition that it might be "too quick" is correct.
  *   **The Problem:** Nozick's Monster doesn't just assume a scale exists; it assumes the scale is **linear and additive**. The Monster works because it assumes 1 unit of utility for A is perfectly substitutable for 1 unit for B, regardless of distribution.
  *   **The Fix:** Your "scale for what?" question is the right tool, but you need to be more specific. If the "project" is *maximizing aggregate preference satisfaction*, the Monster survives. If the "project" is *maintaining social stability* or *ensuring basic dignity*, the scale will likely have built-in diminishing marginal returns or lexical priorities that defang the Monster.
  *   **Argument Adjustment:** Don't just say the Monster assumes the scale exists independently. Say the Monster assumes the **aggregation function** is independent of the moral project. Your argument is that the *shape* of the scale (concave, linear, lexical) is determined by the *purpose* of the comparison, not by the psychology of the agents.

  ### 3. Point 2: Levels vs. Units
  **Verdict:** Solid.
  This follows naturally from the "practice" view. Different practices require different granularities.
  *   **Example:** A triage nurse needs level comparability (who is dying faster?). A tax policymaker might need unit comparability (how much tax pain equals how much public benefit?).
  *   **Fit:** This supports the main thesis well. It shows that "comparability" isn't one binary switch (on/off) but a toolkit of different measures for different jobs.

  ### 4. Point 3: Promises vs. Measurements (The Logical Gap)
  **Verdict:** This is where your nagging feeling is justified. **(3) does not strictly follow from (1) and (2).**

  Here is the logical problem:
  *   **(1) and (2) establish Internal Realism:** They argue that truth is relative to a framework. (e.g., "Is this move legal?" is true/false relative to the rules of chess).
  *   **(3) asserts Expressivism/Non-Cognitivism:** It argues that the statements *themselves* are not truth-apt, but are commitments. (e.g., "I promise to move the knight" is not true/false, it's kept/broken).

  **The Counter-Argument:** Even if the scale is practice-relative, once we agree on the practice, isn't "A is worse off than B" **true or false within that practice?**
  *   *Analogy:* If we agree to use a meter stick, "This rod is 2 meters" is true or false. It is not a promise.
  *   *Your Challenge:* Why is utility different from length?
      *   *Length:* The standard (the meter) is fixed by physical constants or bureaucratic fiat, and the measurement is descriptive.
      *   *Utility:* The "standard" is a moral commitment to treat people in a certain way.

  **How to Earn Point 3:**
  To make (3) work, you need to argue that the *utterance* of the comparison is itself a **performative act**, not a descriptive report.
  *   **Option A (The Adoption Argument):** Shift the focus. The *comparison* ("A > B") might be true relative to the scale, but the **adoption of the scale** is the promise. However, this weakens (3) because you end up admitting comparisons *are* measurements, just based on promised scales.
  *   **Option B (The Coordination Argument):** Argue that saying "A is worse off than B" is not describing a state of affairs, but **issuing a claim on resources.** It functions like "I deserve this." In this view, the comparison is a move in a bargaining game, not a report on a mental state. This aligns with your "promise" analogy.
  *   **Option C (Softening the Claim):** Instead of "not true or false," argue that their **truth is secondary to their normative force.** A comparison can be "accurate" but "illegitimate" if the practice isn't agreed upon. This keeps the spirit of (3) without making a hard logical leap that invites semantic objections.

  ### 5. Structural Recommendations

  **1. Clarify the "Practice":**
  You need to define what constitutes a "practice" here. Is it a legal framework? A moral community? A market? If I am a utilitarian and you are an egalitarian, do we share a practice? If not, are comparisons impossible between us? You need to address **disagreement about scales.** If comparability is practice-relative, how do we resolve conflicts between competing practices? (This is where the "promise" idea helps: we negotiate the promise).

  **2. Address the "Error Theory" Risk:**
  If you say comparisons are "not true or false," you risk an error theory where everyone *thinks* they are stating facts but are actually making promises. This can be alienating. It might be better to say they are **institutional facts** (like money or marriage). "This is a dollar" is true, but only because we collectively promise to treat it as value. This keeps the "truth" but grounds it in the "promise."

  **3. Literature Check:**
  You are treading near:
  *   **Elizabeth Anderson:** *Value in Ethics and Economics* (Pragmatic approach to value).
  *   **Allan Gibbard:** *Wise Choices, Apt Feelings* (Expressivism about normativity).
  *   **Amartya Sen:** *On Ethics and Economics* (Defends IUCs but acknowledges the informational constraints).
  *   **Ludwig Wittgenstein:** (Rule-following and practices).
  *   **John Rawls:** (Primary goods as a public scale, avoiding utility comparisons).

  ### Summary of Fixes
  1.  **Keep the Core:** The "practice-relative" move is excellent.
  2.  **Refine Point 1:** Explicitly mention that the *shape* of the scale (aggregation rule) is determined by the project, not just the existence of the scale.
  3.  **Fix Point 3:** Acknowledge that *within* a practice, comparisons can be accurate/inaccurate. Argue instead that the **authority** of the comparison is normative (a promise/commitment), not empirical. Or, argue that the *function* of the statement is to coordinate action (performative), not describe mental states (constative).
  4.  **Bridge the Gap:** Explain *why* utility is more like a promise than a meter stick. (Hint: Meter sticks measure physical constraints; utility scales negotiate moral claims).

  If you make that distinction clear, you avoid the "internal realism" trap and earn your anti-realist conclusion.
