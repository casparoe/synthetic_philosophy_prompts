answer: |-
  **Brainstorming Notes (Not part of Joint Statement)**

  *   **Hedonic-Tone (HT) Camp:** Must argue that despite heterogeneity, there is a common dimension of "felt pleasantness." For mixed cases (cold plunge), they must posit co-occurring tones (shock + relief). For valence-reversal, context modulates the tone intensity or quality. For dissociated pain, the sensory component is distinct from the affective tone (painfulness). For disowned pleasure, the tone is involuntary and distinct from evaluative judgment.
  *   **Attitudinal (AT) Camp:** Must argue pleasure is a pro-attitude toward content. For mixed cases, conflicting attitudes toward complex objects. For valence-reversal, the attitude changes toward the same sensation. For dissociated pain, the sensation lacks the negative attitude. For disowned pleasure, the attitude is non-judgmental (involuntary liking).
  *   **Verbal Dispute Risk:** If HT defines "tone" as "whatever makes pleasure pleasure," it is circular. If AT defines "attitude" as "whatever unifies pleasures," it is circular. Both need independent criteria. The dispute is genuine if HT claims introspective access to a quality AT denies exists.
  *   **Surviving Disagreements:** Is the unifying feature a *feeling* or a *stance*? Is the feature introspectively transparent? Does the account explain value or merely identify instances?

  ***

  **JOINT STATEMENT ON THE NATURE OF PLEASURE**

  **1. Agreed Claims**

  Both camps endorse hedonism about well-being: well-being consists in pleasure and the absence of pain. Regarding the nature of pleasure itself, we accept the following:

  1.  **Phenomenal Heterogeneity:** Any adequate account must accommodate the introspective diversity of pleasures. The experience of quenching thirst, solving a theorem, and listening to music differ significantly in sensory and cognitive character.
  2.  **Ordinary Usage:** Ordinary language classifies these diverse experiences under "pleasure." While ordinary usage is not metaphysically decisive, an account that systematically contradicts competent speakers' classifications without explanatory gain is deficient.
  3.  **Extensional Adequacy:** An account must correctly identify the extension of "pleasure." It must include paradigm cases (eating when hungry) and exclude non-cases (neutral sensations), even if borderline cases exist.
  4.  **Normative Connection:** The term "pleasure" plays a classificatory role (describing experience) and an evaluative role (grounding well-being). An account must explain how the identified feature grounds the normative claim that pleasure is good for the subject.
  5.  **Decisive Objections:** The Hedonic-Tone camp would concede falsification if phenomenally distinct pleasures were shown to share no common introspectible dimension whatsoever. The Attitudinal camp would concede falsification if subjects were shown to take pleasure in things toward which they hold no pro-attitude (including dispositional ones).

  **2. The Agreed Pressure Cases**

  We agree on the following neutral descriptions of four pressure cases and record how each camp accommodates them.

  *   **(a) The Mixed Case:** A single experience (e.g., a cold plunge) seems simultaneously pleasant and unpleasant.
      *   *HT Formulation:* The experience contains two distinct hedonic tones (shock-pain and relief-pleasure) occurring concurrently.
      *   *AT Formulation:* The subject holds conflicting attitudes toward different aspects of the same complex object.
      *   *Status:* Accommodated by both, though via different ontological structures.

  *   **(b) The Valence-Reversal Case:** The same sensory quality (e.g., capsaicin heat) is pleasant in one context (eating curry) and unpleasant in another (burn injury).
      *   *HT Formulation:* Context alters the hedonic tone associated with the sensation; the tone is not intrinsic to the sensory quality.
      *   *AT Formulation:* The sensory quality remains constant; the subject's attitude toward it shifts based on context.
      *   *Status:* Accommodated by both; disagreement lies in whether the valence change is a change in feeling or stance.

  *   **(c) The Dissociated-Pain Case:** Clinical reports indicate patients register nociceptive stimuli as painful but report being unbothered by them.
      *   *HT Formulation:* The sensory-discriminative component of pain is intact, but the affective-motivational (unpleasant) tone is severed.
      *   *AT Formulation:* The sensation is present, but the negative pro-attitude (wanting it to stop) is absent.
      *   *Status:* Accommodated by both; both distinguish sensation from affective valuation.

  *   **(d) The Disowned Pleasure:** A subject enjoys something (e.g., a guilty pleasure) she evaluatively repudiates and wishes she did not enjoy.
      *   *HT Formulation:* The hedonic tone is involuntary and distinct from the subject's evaluative judgment about the object.
      *   *AT Formulation:* The pro-attitude is involuntary; one can be pleased that *p* while judging that *p* is bad.
      *   *Status:* Accommodated by both; both distinguish the pleasure mechanism from higher-order judgment.

  **3. Disagreements Table**

  | Question | Hedonic-Tone Formulation | Attitudinal Formulation | Type | Crux | Bearing Case | Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Unifying Feature** | All pleasures share a common phenomenal quality (tone). | All pleasures share a common propositional attitude. | Genuine | Introspective Availability | Phenomenal Heterogeneity | HT: Tone is findable. AT: Only attitude is findable. |
  | **Structure** | Pleasure is a sensation or feeling modality. | Pleasure is a functional stance toward content. | Genuine | Natural Kind vs. Cluster | Valence-Reversal | HT: Tone is natural kind. AT: Pleasure is cluster concept. |
  | **Normativity** | Tone explains value because feeling good is intrinsically valuable. | Attitude explains value because satisfying pro-attitudes is valuable. | Verbal/Genuine | Explanation of Value | Disowned Pleasure | HT: Value in feel. AT: Value in attitude satisfaction. |
  | **Explanatory Role** | Tone posits a quality to explain unity. | Attitude posits a function to explain unity. | Genuine | Relabeling Data | All Cases | HT: Tone predicts phenomenology. AT: Attitude predicts behavior. |

  **4. Cruxes**

  We identify four central cruxes where the disagreement is substantive.

  *   **Introspective Availability:** The Tone Camp insists the unifying feature must be introspectively available as a quality of experience. The Attitudinal Camp argues the unifying feature is a functional stance that may not appear as a distinct "feel." *What turns on this:* If the feature is not introspectible, the Tone Camp's claim that pleasure is a "feeling" collapses. *Movement:* The Tone Camp would move if subjects consistently failed to identify a common quality across diverse pleasures under rigorous introspection. The Attitudinal Camp would move if subjects reported a distinct, common "glow" across all pleasures.
  *   **Natural Kind vs. Cluster:** The Tone Camp posits pleasure as a natural kind unified by a specific phenomenal property. The Attitudinal Camp allows pleasure may be a cluster concept held together by overlapping similarities of attitude. *What turns on this:* Whether "pleasure" picks out a single neurophenomenal mechanism or a heterogeneous functional class. *Movement:* The Tone Camp requires evidence of a unified neural correlate for "tone." The Attitudinal Camp requires evidence that no single attitude covers all cases.
  *   **Explanation of Value:** The Tone Camp argues the account must explain *why* pleasures are good (the feel itself is valuable). The Attitudinal Camp argues the account need only identify pleasures; the value comes from the satisfaction of the attitude. *What turns on this:* Whether hedonism relies on the intrinsic value of sensation or the satisfaction of desire-like states. *Movement:* The Tone Camp would concede if "pleasant feels" were shown to lack value in isolation. The Attitudinal Camp would concede if attitude satisfaction without positive affect was shown to lack value.
  *   **Explanatory Power vs. Relabeling:** The Tone Camp must show "hedonic tone" explains unity rather than merely naming it. The Attitudinal Camp must show "pro-attitude" is not just a synonym for "liking." *What turns on this:* Whether the vocabulary adds predictive power. *Movement:* Both camps would concede if their key term were shown to be circular (e.g., "pleasure is what has pleasantness").

  **5. Genuine and Verbal Disagreement**

  We judge parts of this dispute to be verbal, stemming from divergent uses of "feeling" and "attitude."

  *   **Verbal Component:** When the Tone Camp says "pleasure is a feeling," they mean "it has a phenomenal character." When the Attitudinal Camp says "pleasure is not a feeling," they mean "it is not a distinct sensory quality like itch or heat." These claims are compatible if "feeling" is ambiguous between "phenomenal character" and "sensory modality."
  *   **Translation Manual:**
      *   *HT to AT:* "The subject experiences a positive hedonic tone" translates to "The subject holds a positive pro-attitude toward the experience."
      *   *AT to HT:* "The subject takes pleasure in the object" translates to "The object induces a positive hedonic tone in the subject."
  *   **Genuine Component:** The dispute remains genuine regarding ontology. The Tone Camp claims the positive character is a *property of the experience*. The Attitudinal Camp claims it is a *relation between subject and content*. This cannot be translated away; it is a disagreement about the metaphysical structure of consciousness.

  **6. Movement**

  We specify what evidence would compel each camp to revise its position.

  *   **Evidence Against Hedonic-Tone:** Neurophenomenological data showing that experiences classified as "pleasurable" by subjects activate distinct, non-overlapping affective systems with no common neural signature for "tone." If introspection training reveals no common quality across sensory and intellectual pleasures, the Tone Camp must abandon the claim of a unitary quality.
  *   **Evidence Against Attitudinal:** Cases where subjects report pleasure but explicitly lack any pro-attitude (including dispositional desires for the experience to continue). If pleasure is shown to be purely passive and receptive without any conative component, the Attitudinal Camp must abandon the claim that pleasure is an attitude.
  *   **Collaborative Outcome:** This collaboration clarifies that both camps can accommodate the standard pressure cases. The disagreement is not about the extension of "pleasure" or its value for well-being, but about the metaphysical category to which pleasure belongs. Future work should focus on introspective training protocols and neurofunctional mapping to resolve the cruxes regarding introspective availability and natural kinds.
