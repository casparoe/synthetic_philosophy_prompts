answer: |-
  This is a classic problem in the literature on collective harm (often discussed under "imperceptible differences," "overdetermination," or "complicity"). As a PhD student, you'll recognize the tension: you are oscillating between a **Complicity/Participation Model** (wrong to join the harmful practice) and an **Instrumental/Difference-Making Model** (wrong only if you change the outcome).

  Your intuitions are not random, but they are inconsistent. Specifically, you apply *Complicity* to consumer choices (Burger, Dye) but *Instrumentalism* to civic/charitable choices (Voting, Fund). You also apply a **Reasonable Demand** constraint (cost of alternatives) that seems to do heavy lifting in the Flight vs. Burger case.

  Here is a principle that systematizes most of your verdicts, followed by an honest audit of where your intuitions likely betray you.

  ### The Principle: Reasonable-Demand Complicity

  > **An act is pro tanto wrong if it constitutes voluntary participation in a collective practice that the agent knows causes significant harm, provided that abstaining from the act does not impose a *disproportionate burden* on the agent's well-being or central projects.**

  This principle combines three components:
  1.  **Complicity:** Wrongness comes from joining the harmful pattern, not solely from causal pivotality.
  2.  **Foreseeability:** You must know the practice is harmful.
  3.  **Reasonable Demand:** The cost of compliance must be proportional to the moral stakes (sacrificing a holiday is costlier than swapping a burger).

  ---

  ### How the Principle Handles Your Cases

  | Case | Verdict | Explanation under Principle |
  | :--- | :--- | :--- |
  | **Beef Burger** | **Wrong** | Participation in harmful practice (factory farming); low cost to switch (veggie option). |
  | **Long-haul Flight** | **Less Wrong** | Participation in harmful practice; *but* high cost to switch (losing a rare holiday/project). The "Reasonable Demand" clause excuses you partially. |
  | **Corner Shop Drive** | **Not Wrong** | Participation is weak/unclear; cost of switching (10 min walk) may be disproportionate to the trivial convenience gain *in that moment*. |
  | **Tap Running** | **Not Wrong** | Harm is negligible (fails "significant harm" clause). |
  | **Fast Fashion** | **Bit Wrong** | Participation in harmful practice; cost is moderate (price difference). Guilt is lower than burger because the harm is less salient/personal. |
  | **Dye in Lake** | **Wrong** | Clear participation in a harmful threshold case; low cost to abstain. |
  | **Recycling Bottle** | **Not Wrong** | *Tension Point.* Principle suggests Wrong (participation in waste, low cost). Your intuition says Not Wrong. (See audit below). |
  | **Voting (Safe)** | **Not Wrong** | *Tension Point.* Principle suggests Wrong (free-riding on democracy). Your intuition relies on Instrumentalism (no impact). |
  | **Voting (Marginal)** | **Fine (ex ante)** | Instrumentalism dominates here. You judge based on *probability* of impact, not participation. |
  | **Fund ($10)** | **Fine (ex ante)** | Same as Voting. You judge based on pivotality, not participation. |

  ---

  ### The Honest Audit: Where You Are Rationalizing

  If you adopt the **Reasonable-Demand Complicity Principle** (which fits your strongest moral convictions, like the Dye and Burger cases), you have to admit that three of your intuitions are likely rationalizations.

  #### 1. The Voting/Fund Inconsistency (The Biggest Problem)
  *   **The Conflict:** In the **Dye Case**, you say you are wrong *even if your bucket wasn't the 10th one*. You accept Complicity. In the **Fund/Voting Case**, you say you are fine *unless your $10/vote was the pivotal one*. You demand Instrumentalism.
  *   **The Reality:** Structurally, these are identical threshold cases.
  *   **The Fix:** If you are a Complicist about the Dye, you must be a Complicist about Voting. You have a duty to "do your fair share" of civic maintenance regardless of pivotality. Your intuition that it's "fine to skip" is likely **Instrumental Rationalization** to save effort.
  *   **Exception:** You can distinguish them if you view Voting as a *Good* to be produced (Instrumental) and Dye as a *Harm* to be avoided (Deontological). But since not voting allows harmful governance, the distinction is thin.

  #### 2. The Flight vs. Burger Asymmetry
  *   **The Conflict:** The flight does vastly more harm than the burger. Yet you feel less guilt.
  *   **The Reality:** Under the **Reasonable Demand** clause, this is *technically* consistent if the holiday is a "central project" and the burger is not. However, this is the most vulnerable spot for **Privilege Rationalization**.
  *   **The Fix:** Ask yourself: Is the holiday truly a "central project" necessary for well-being, or is it a luxury? If it's a luxury, the "Disproportionate Burden" clause doesn't apply, and the Flight should feel *worse* than the Burger. If you keep the intuition that Flight < Burger, you are prioritizing *habitual* sins (burger) over *occasional* sins (flight), which is a psychological bias, not a moral principle.

  #### 3. The Recycling Bottle
  *   **The Conflict:** You say "Not Wrong, zero guilt."
  *   **The Reality:** This fails every test. It's participation in waste (harmful practice). The alternative is low cost (rinse and bin).
  *   **The Fix:** This is likely **Normative Drift**. Because recycling infrastructure is often broken or opaque, you've subconsciously categorized it as "Tap Running" (negligible) rather than "Burger" (complicity). Under your own principle, this should be **Wrong**.

  ---

  ### Predictions for New Cases

  If you adopt the **Reasonable-Demand Complicity Principle**, here is what it dictates for your new examples:

  #### 1. Choosing to Have a Kid vs. Eating One More Egg
  *   **The Egg:** **Wrong.** It is participation in a harmful industrial practice with a trivial cost of abstention (eat something else). It is morally equivalent to the Burger.
  *   **The Kid:** **Not Wrong (under this principle).** While a child has high lifetime emissions, having a child is a "central project" of human well-being and identity. The cost of abstention (childlessness) is disproportionately high compared to the marginal climate impact of one additional life in a developed nation.
      *   *Caveat:* This principle struggles with *Procreative Non-Identity* problems. A stricter consequentialist view might say the Kid is Wrong. But under *Complicity + Reasonable Demand*, the "central project" exemption protects procreation while condemning the egg.

  #### 2. Buying a Gas-Guzzler vs. Taking the Bus
  *   **Verdict:** **Wrong.** Buying the car is a high-salience participation in harmful infrastructure. Unless you have a disability or specific need (Reasonable Demand), the cost of taking the bus is not "disproportionate."

  #### 3. Working for a Harmful Company (e.g., Oil)
  *   **Verdict:** **Wrong.** This is high-salience Complicity. Unless you have no other employment options (Existential Burden), you are participating directly.

