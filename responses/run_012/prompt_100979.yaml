  ### Recommendation for Your Thesis

  You are currently holding two incompatible theories:
  1.  **Consumer Complicity:** "I shouldn't join the harmful pattern." (Burger, Dye, Fashion)
  2.  **Civic Instrumentalism:** "I don't need to act unless I make a difference." (Voting, Fund)

  **To resolve this:**
  You should probably **abandon the Civic Instrumentalism**.
  It is philosophically unstable to claim that you are responsible for the Dye (even if not pivotal) but not responsible for the Vote (even if not pivotal). Both are threshold cases. The "Fair Share" argument applies to both.

  **The Revision:**
  Adopt the view that **Omissions in Collective Contexts are Complicity.**
  *   Not voting = Free-riding on the democratic practice (Wrong, regardless of pivot).
  *   Not giving to the Fund = Free-riding on the rescue practice (Wrong, regardless of pivot).

  **The Cost:**
  You will have to accept that skipping the vote *was* wrong, even in the safe seat. You didn't know it was safe ex-ante; you participated in the practice of non-voting.

  **The Gain:**
  You eliminate the "Moral Luck" problem in the Voting case (where you only feel wrong *after* finding out you were pivotal). Your duty becomes stable ex-ante: **Do your part, regardless of whether your part turns out to be the pivot.**

  This aligns your Voting intuitions with your Dye/Burger intuitions, leaving you with a consistent, defensible **Fair-Share Complicity** view. The only remaining rationalization to watch is the **Flight** (ensure the "holiday" isn't just a disguised luxury) and the **Recycling** (acknowledge the duty).
