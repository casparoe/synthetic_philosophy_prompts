  The argument fails at **Premise (5)**.

  While the conclusion (9) is one way to resolve the tension, you are right to resist it if you wish to preserve the ex ante standpoint (1) and the Counterfactual Mugging verdict (3). The error lies in the claim that the ex ante reasoning which compels payment in Counterfactual Mugging *also* compels payment in XOR Blackmail. It does not.

  Here is the diagnosis of the error, why it appeared compelling, and the theoretical cost of rejecting it.

  ### 1. The Diagnosis: Reject Premise (5)

  Premise (5) claims: *"By the same ex ante reasoning, the policy of paying when the letter arrives has higher expected utility than the policy of refusing."*

  This is mathematically false under the constraints of Premise (1). If you strictly apply **ex ante** evaluation (calculating expected utility before knowing the state of the termites or the arrival of the letter), the policy of **Refusing** dominates the policy of **Paying** in the XOR Blackmail case (assuming a standard 50/50 prior on termites).

  **The Calculation:**
  Let $T$ be the state of Termites (Cost: $-\$1,000,000$) and $L$ be the arrival of the Letter. Omega sends $L \iff (T \oplus \text{Pay})$.
  Assume $P(T) = 0.5$.

  *   **Policy: Refuse if Letter**
      *   If $T$: Omega computes $(1 \oplus 0) = 1$. Letter arrives. You Refuse.
          *   Outcome: Termites ($-\$1M$). No Payment. **Total: $-\$1M$**.
      *   If $\neg T$: Omega computes $(0 \oplus 0) = 0$. No Letter.
          *   Outcome: No Termites. No Payment. **Total: $\$0$**.
      *   **Ex Ante Expected Utility:** $0.5(-\$1M) + 0.5(\$0) = \mathbf{-\$500,000}$.

  *   **Policy: Pay if Letter**
      *   If $T$: Omega computes $(1 \oplus 1) = 0$. No Letter. You do not pay.
          *   Outcome: Termites ($-\$1M$). No Payment. **Total: $-\$1M$**.
      *   If $\neg T$: Omega computes $(0 \oplus 1) = 1$. Letter arrives. You Pay.
          *   Outcome: No Termites. Payment ($-\$1,000$). **Total: $-\$1,000$**.
      *   **Ex Ante Expected Utility:** $0.5(-\$1M) + 0.5(-\$1,000) = \mathbf{-\$500,500}$.

  **Result:** The Refuse policy yields higher ex ante expected utility by $\$500$. Therefore, a rational agent adhering to (1) should **refuse** in XOR Blackmail. Premise (5) is false, so the inference to (6), (7), and (9) collapses. You can keep (1) and (3) without accepting unlimited exploitation.

  ### 2. Why Premise (5) Looked Compelling

  Premise (5) is seductive because it smuggles in **ex post (evidential) reasoning** while claiming to be **ex ante**.

  The text of (5) argues: *"If you pay, the letter's arrival tells you that your house is free of termites... Since a termite infestation would cost $1,000,000... paying is the better policy."*

  This reasoning conditions on the arrival of the letter. It says: "Given that I am holding the letter, paying implies $\neg T$ (saving me $\$1M$) while refusing implies $T$ (costing me $\$1M$)." This is Evidential Decision Theory (EDT) reasoning. It treats the decision as *evidence* about the world.

  However, Premise (1) demands an **ex ante** evaluation. From the ex ante standpoint, you cannot condition on the letter's arrival because you do not know yet if it will arrive. You must ask: "Does adopting the *policy* of paying change the probability of termites or the expected loss?"
  *   In **Counterfactual Mugging**, the policy *does* change the expected outcome ex ante (it secures the $\$10,000$ in the Heads branch).
  *   In **XOR Blackmail**, the policy *does not* change the probability of termites (they are independent). It only shifts *which branch* you pay the $\$1,000$ in. It moves the payment from the "Doomed" branch (where you pay nothing but lose $\$1M$) to the "Safe" branch (where you pay $\$1,000$ and lose nothing else). Since the $\$1M$ loss occurs in the Termites branch regardless of your payment (the termites are physical, or Omega's threat is structurally neutral regarding the *total* probability of loss), paying simply adds a net cost of $\$1,000 \times P(\neg T)$ with no compensating ex ante benefit.

  The argument tricks you by focusing on the *correlation* between the letter and the termites, rather than the *causal/subjunctive dependence* of the termites on the policy.

  ### 3. The Principled Difference

  You asked whether the difference between the cases is principled or a patch. It is **principled**. The distinction lies in **Subjunctive Dependence of the Payoff**.

  *   **Counterfactual Mugging (Pay):** The *payoff* in the Heads branch is subjunctively dependent on your policy in the Tails branch. Omega gives you the $\$10,000$ *because* your algorithm outputs "Pay" in the Tails counterfactual. Your policy *creates* the value in the branch where you don't pay.
  *   **XOR Blackmail (Refuse):** The *payoff* (the termite infestation) is **independent** of your policy. Your policy only influences the *correlation* between the Letter and the Infestation. It determines whether the Blackmail Demand arrives in the world where you are already doomed ($T$) or the world where you are safe ($\neg T$). It does not determine whether you are doomed.

  In decision theory terms (specifically Functional Decision Theory or Updateless Decision Theory, which formalize your Premise 1):
  *   In CM, your decision is **logically linked** to Omega's *reward*.
  *   In XOR, your decision is **logically linked** to Omega's *letter*, but not to the *termite state* (the source of the major utility loss).

  Therefore, an ex ante optimizer pays in CM (to secure the reward) but refuses in XOR (because paying cannot secure safety, it only purchases a different correlation between bad news and payment).

  ### 4. What Rejecting (5) Costs You

  Rejecting (5) saves your theory from exploitation, but it comes with two theoretical costs:

  1.  **Loss of Simplicity:** You cannot simply say "Maximize Ex Ante Expected Utility." That phrase is ambiguous between Causal, Evidential, and Subjunctive expectations. You must commit to a specific formalization, such as **Updateless Decision Theory (UDT)** or **Functional Decision Theory (FDT)**. You must accept that rationality requires evaluating the *output of your decision algorithm* across all possible worlds, weighted by their probability, rather than evaluating the *act* conditional on evidence. This is more complex than standard Expected Utility Theory.
  2.  **Acceptance of "Useless" Correlations:** You must accept that there are predictable correlations (like the Letter in XOR Blackmail) that a rational agent should *ignore* when choosing a policy. This counters the intuition that "all predictable information should be used." In XOR, the Letter is perfect evidence of the Termite state *given a policy*, but acting on that evidence ex post leads to a worse ex ante outcome. You have to endorse the view that rationality is about **control** (subjunctive influence) rather than **news management** (evidential correlation).

  ### Summary
  To preserve your attachments to (1) and (3):
  *   **Reject Premise (5).** The ex ante math favors Refusal in XOR Blackmail.
  *   **Embrace the Distinction:** CM involves subjunctive dependence of the *reward*; XOR involves only evidential correlation of a *signal*.
  *   **Accept the Cost:** You are committed to a decision theory (like FDT/UDT) that distinguishes between correlations that "pay" and correlations that are "parasitic," rather than a generic ex ante EU maximization that treats all predictions alike.

  This blocks the slide to unlimited exploitation (8) and allows you to reject (9) without inconsistency.
