      *   *Adversary:*
          *   *Oblivious:* The environment distribution $D$ is fixed before the algorithm is deployed.
          *   *Adaptive:* The environment (or the AI itself, internally) changes in response to the algorithm's safety mechanisms.
      *   *Competitive Analysis:* Comparing the AI's performance/safety against an optimal safe policy.
