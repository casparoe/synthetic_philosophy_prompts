answer: |-
  This is not a dumb question. It is, in fact, the exact hinge upon which your book turns. You have identified a specific historical and psychological mechanism that is distinct from general "war memory" or "propaganda."

  There is no single, universally agreed-upon academic noun for this (like "photosynthesis"), but there are several terms that carve out the territory. In historiography and memory studies, this is often discussed under **"Founding Myths of Defeat,"** **"The Thermopylae Archetype,"** or **"Heroic Failure."** In the specific context of Serbia and Kosovo, historians literally call it **"The Kosovo Myth"** (earthly defeat, heavenly victory).

  However, since you are a novelist, you don't need the jargon; you need the mechanics. You have already intuitively grasped the three pillars of the phenomenon. Let's refine the "carving" you asked for, test your hunches against history, and see where the edges break.

  ### 1. The Name
  If you need a term to pin on the corkboard, call it **"The Sacred Defeat."**

  It distinguishes itself from a "Pyrrhic Victory" (where you win but lose too much) and a "Lost Cause" (which is political apologetics for a failed ideology). A Sacred Defeat is a military failure that functions as a spiritual or national victory.

  ### 2. The Carving: Defining the Edges
  You proposed three conditions. Let's stress-test them to see where the phenomenon breaks.

  **Condition A: Known Hopelessness.**
  *   **The Edge:** If there was a *chance*, it's just a battle. If the commanders knew it was suicide but told the troops it was winnable, it's a betrayal (e.g., The Charge of the Light Brigade). For the myth to hold, the *leaders* must know, and ideally, the *troops* must suspect or accept it.
  *   **The Nuance:** The Alamo commanders knew. The Masada defenders knew. The Serbian knights at Kosovo knew. This creates a "conspiracy of fate." They aren't dying because they were outmaneuvered; they are dying because they chose the time of their death.

  **Condition B: Military Pointlessness.**
  *   **The Edge:** This is the hardest pill for historians to swallow, but essential for the myth. If the stand *actually* bought time that saved the capital (e.g., Thermopylae is often argued this way, though debatably), it becomes **Strategy**.
  *   **The Requirement:** For it to become **Myth**, the strategic value must be negligible or retroactively exaggerated. The value must be entirely *symbolic*. If the stand saved the army, it's a tactical miracle (like Dunkirk). If the stand saved *nothing* but the honor of the dead, it's a Sacred Defeat.

  **Condition C: Not Done for Memory.**
  *   **The Edge:** This is your strongest hunch. The participants must be acting out of duty, fear, loyalty, or faith.
  *   **The Test:** If a soldier writes a letter home saying, "I am dying so that poets will write about me in 100 years," the myth curdles into vanity.
  *   **The Exception:** The **Easter Rising (1916)**. The leaders of the Irish Rising *explicitly* knew it would fail militarily and intended it as a "blood sacrifice" to wake up the populace. Patrick Pearse spoke of blood as a cleansing agent. *However*, this works because the *rank and file* largely believed they were fighting for a republic, not a poem. The *leaders* manufactured the meaning, but the *dead* must remain sincere.

  ### 3. The "Manufacturing" Hunch
  You asked: *Can it be willed into being? Or does the cynicism kill it?*

  **Your hunch is mostly right, but with one caveat.**
  You cannot manufacture the *death*, but you can manufacture the *meaning*.

  *   **The Constraint:** The participants cannot be cynical. If the garrison knows they are props in a future history book, they become actors, not martyrs. The audience (the future nation) can smell insincerity. The myth requires the *authenticity of the sacrifice*.
  *   **The Loophole:** The *survivors* (or the political successors) must be cynical. The myth is never built by the dead; it is built by the living who need the dead.
      *   *Example:* The Alamo. Travis and Bowie didn't know Texas would win. They just died. It was the Republic of Texas (later) that needed the Alamo to justify its existence.
      *   *Example:* Masada. The Zealots died for religious reasons, not to be a symbol of modern Israel. It was Yigael Yadin (the archaeologist) in the 1960s who turned Masada into a national shrine to forge a new Israeli identity.

  **So, the rule is:** The *act* cannot be performed for the sake of memory, but the *memory* must be harvested for the sake of the nation. If the act is performed for the sake of memory, it becomes propaganda (like Kamikaze attacks, which failed to generate a positive post-war national myth because the cause was discredited).

  ### 4. Redeemed vs. Unredeemed (The Dunkirk Split)
  You asked if it splits into "Redeemed Defeats" (Dunkirk) vs. "Absolute Defeats" (Masada). **Yes, this is a hard split.**

  *   **Type 1: The Prelude (Dunkirk, The Somme).**
      *   These are defeats that are retroactively justified by a later victory. "We suffered here so we could win there."
      *   *Emotional Tone:* Grim determination, "Never Again," resilience.
      *   *Function:* To steel the nation for the next fight.
  *   **Type 2: The Substitute (Masada, The Alamo, Kosovo).**
      *   These are defeats where there *is* no later victory. The cause is dead.
      *   *Emotional Tone:* Transcendence, martyrdom, "We won in heaven."
      *   *Function:* To define the nation's *soul*, not its borders.
      *   *Why it burns brighter:* Because it is pure. A victory is always muddy (collateral damage, political compromise). A total loss where nothing was gained but honor is spiritually clean. It cannot be tarnished by the messy reality of governing.

  **For your book:** If your garrison is eventually avenged, you are writing a war story. If they are *never* avenged, and the country still worships them, you are writing a tragedy about national identity. The latter is more potent but darker.

  ### 5. Scale and Scope
  Does it need a nation?
  *   **Regiment:** Yes. (e.g., The 7th Cavalry at Little Bighorn—though this is complicated by the "enemy" winning). A better example is **Rorke's Drift**, though that was a victory.
  *   **City:** Yes. (e.g., **Coventry** or **Rotterdam** in WWII, though those are victimhood myths, not stands). **Sarajevo** (WWI) is a good example of a city whose destruction birthed a century of myth.
  *   **Sect:** Yes. (e.g., **Jonestown**? No, that lacks the "honor" component. **Waco**? Complicated. **The Martyrs of Cordoba**? Yes.)

  The key isn't the size, it's the **continuity of the group.** There must be a "We" that survives the "Them" to tell the story. If everyone dies and no one inherits the myth, it's just a tragedy. There must be survivors (physical or ideological) to do the worshipping.

  ### 6. Summary for the Novelist
  Here is the blueprint for the phenomenon you are describing:

  1.  **The Reality:** Mud, fear, bad orders, confusion, and a tactical failure.
  2.  **The Knowledge:** The commanders know they are sending men to die. The men suspect it but go anyway (duty/peer pressure).
  3.  **The Outcome:** Total annihilation or surrender. No strategic gain.
  4.  **The Aftermath:** The cause is lost. The war is lost.
  5.  **The Resurrection:** 50 years later, the *losers* are now the *moral winners*. The defeat is re-cast as a choice. They didn't *fail* to hold the hill; they *chose* to die on it.
  6.  **The Constraint:** You cannot have a character say, "We will die here to be remembered." You can have a character say, "We will die here because there is nowhere else to go." The *historian* makes the first statement; the *soldier* lives the second.

  **One final counter-example to your "Manufacturing" hunch:**
  The **Kamikaze**. They *did* do it for memory/emperor. They *did* try to manufacture a myth.
  *Why did it fail to become a "Sacred Defeat" in the same way?*
  Because the *nation* that survived rejected the premise. For a Sacred Defeat to work, the *future generation* must embrace the loss. If the future generation sees the loss as a waste caused by madness (post-war Japan), the myth dies. If the future generation sees the loss as a noble sacrifice betrayed by incompetence (post-war Serbia/Confederacy), the myth lives.

  **The Verdict:**
  The phenomenon is real. It is the **"Founding Defeat."** It requires total loss, sincere sacrifice, and a surviving culture that needs a moral victory to compensate for a military one. And your hunch is correct: if the soldiers know they are building a monument, they are merely masons. They have to think they are building a wall. The monument comes later.
