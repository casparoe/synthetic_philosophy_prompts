          *   Each line moves one toward the other (treating the other's statement as evidence).
          *   End with both saying the same words (convergence).
          *   **Crucial Nuance 1:** Convergence is *forced* by hearing the other (updating on common knowledge of disagreement), not by persuasion/politeness.
