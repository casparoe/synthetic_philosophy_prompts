  2.  **Deconstruct Aumann's Agreement Theorem:**
      *   **Agents:** Two (or more).
      *   **Prior:** Common prior assumption (CPA). They start with the same probability distribution over states of the world.
      *   **Information:** Partitions of the state space (private information).
      *   **Posterior:** Conditional probability based on private information.
      *   **Common Knowledge:** They know their own posterior, they know the other's posterior, they know that the other knows, ad infinitum.
