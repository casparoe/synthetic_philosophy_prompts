answer: |-
  Good morning. Thank you for giving up your Saturday for this. I know there are better things to do than sit in a university classroom listening to a fourth-year student talk about verbs. I also know two of the biologists in the back are here mainly to heckle, so I'll try to keep the targets big enough to hit.

  We're here because writing about animal behavior is a trap. You have editors who want vivid stories, and readers who want to connect with the subject. So you write that the bee dances *to tell* the hive where the flowers are. Or that the wolf hunts *to protect* the pack. It reads well. It feels true.

  But then you have the scientists who say, "Stop. The bee isn't telling anything. It's executing a program." So you rewrite it: "The bee performs a movement pattern triggered by nectar intake." Now it's accurate, but it's dead on the page. It flattens the animal into a machine.

  My job this morning isn't to solve that tension. The people speaking this afternoon will spend three hours disagreeing about how to fix it. My job is to give you a tool for spotting when the word "for" is earning its keep, and when it's smuggling in a ghost.

  Here is the clean version first. Think about a bird's wing. We say the wing is *for* flying. There is no designer who sat down and planned it. The bird doesn't think about aerodynamics. But the "for" isn't a metaphor. It's earned. The wing is shaped that way roughly because previous wings that were shaped that way kept their owners alive long enough to make copies. The reason the wing exists is real, but nobody ever had to think it.

  My advisor calls these **free-floating rationales**. I'm going to use that phrase exactly once because it sounds like a band name, but the idea is useful. The rationale floats free of any mind. It's a reason without a reasoner.

  When you write that a trait is *for* something, you are betting that there is a history of selection behind it. You are saying this thing exists *because* it did that job in the past. That is a safe bet for wings, and mostly safe for bee dances.

  But I want to be honest with you. There are places where this rule breaks, and if you don't see the crack, you'll write something misleading. I have two cases where I genuinely struggle, and I expect you will run into versions of them.

  The first is the dirt path across the campus quad. You know the one. The grounds crew never built it. It's just worn into the grass by people cutting the corner from the library to the dining hall. That path is *for* getting people across the quad faster. It looks exactly like the bee dance. It's a useful pattern that emerged without a central planner.

  But my advisor says this is different. She says the reason isn't floating; it's pooled. Every single person who walked there had their own reason, their own intent. The path is just the sum of a thousand conscious choices. The bee dance doesn't have that. To a journalist, though, the path and the dance look like the same phenomenon. I'm not sure her line is as clean as she thinks, but it's a distinction you should watch for. If the behavior comes from a crowd of individuals making choices, the "for" is pooled intent. If it comes from a single animal doing something it didn't choose, the "for" has to be earned by history.

  The second case is harder. This one actually broke my brain. There's a lab down the hall studying a beetle that burrows through sand. The beetle has ridges on its back that measurably reduce drag. If you smooth them off, the beetle slows down. So, are the ridges *for* reducing drag?

  Here's the catch: The ridges aren't selected for. They are a physical byproduct. They happen because of the way the beetle's tissue dries as it hardens. It's the same pattern every time, like mud cracking in the sun. There's no variation for selection to grab. The drag reduction is a real benefit, but the benefit didn't *make* the ridges happen. Physics did.

  So, do you write that the ridges are for streamlining? If you do, you're implying a history of selection that isn't there. If you don't, you're ignoring that the ridges actually help the beetle survive. This is a case where the "reason without a reasoner" story doesn't fit. The reason is real, but it's a physical consequence, not an evolutionary history.

  So, what is the rule of thumb? I can't give you a formula that works every time, because biology is messier than grammar. But here is a question you can ask yourself when you're drafting that sentence:

  **Did this trait exist because it helped, or does it help because it exists?**

  If it exists *because* it helped (like the wing), you can use the strong language. It is *for* flying.
  If it helps *because* it exists (like the beetle ridges), or if it exists because a lot of individuals wanted it (like the path), you need to soften the verb. Use "allows," "enables," or "results in."

  The beetle ridges *allow* it to move faster. The path *results* from people cutting corners. The wing is *for* flying.

  It's not perfect. There are gray zones. Sometimes we don't know the history. Sometimes the physics and the selection are tangled up. When you're in the gray, don't pretend you're on solid ground. Your readers trust you to know the difference between a motive and a mechanism. When you aren't sure, it's okay to write in a way that leaves the door open.

  This afternoon, you're going to hear two people argue about whether we should even be using this language at all. One will say we must purge all purpose-talk to be accurate. The other will say purpose-talk is the only way to make sense of life. They're both right, and they're both wrong.

  Your job isn't to pick a side. Your job is to know when the word "for" is doing work, and when it's just doing time. If you can spot the difference, you'll keep the story alive without lying about the animal.

  Thanks for listening, enjoy the next session, and please go easy on the hecklers.
