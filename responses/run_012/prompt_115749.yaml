answer: |-
  Your intuition is spot on: your roommate has slid from a standard materialist claim into a self-undermining position that most philosophers reject precisely because it makes knowledge of consciousness impossible.

  Here is the menu of precise theses hidden behind the slogan "consciousness is just along for the ride," ranked from harmless to self-destructive.

  ### 1. The "Dependence" Thesis (The Boring One)
  *   **The Claim:** Conscious states are fully produced by brain states; if you change the brain, you change the mind. Consciousness doesn't drive the car, the brain does.
  *   **Status:** **Platitude.** This is standard physicalism. Almost every neuroscientist and materialist accepts this. It does *not* imply consciousness is useless; it just implies it's dependent.
  *   **Causal Power:** Consciousness can still have effects (e.g., pain causes the belief "I am hurt").

  ### 2. The "Physical Epiphenomenalism" Thesis (The Standard One)
  *   **The Claim:** Consciousness exists, but it has no *physical* effects. It cannot move your limbs or fire neurons; only physical matter affects other physical matter.
  *   **Status:** **Defensible (but controversial).** This was T.H. Huxley's actual view (he compared consciousness to the steam-whistle on a locomotive: it signals the work, but doesn't power the engine).
  *   **Causal Power:** Crucially, this view usually allows consciousness to cause *other mental states*. Your pain (mental) can cause your belief about pain (mental), even if neither can directly move your arm without brain mediation.

  ### 3. The "Total Epiphenomenalism" Thesis (The Strong One)
  *   **The Claim:** Consciousness has *no effects whatsoever*, not even on other mental states. Your experience of red does not cause your judgment "I am seeing red."
  *   **Status:** **False / Self-Undermining.** If your experience doesn't cause your belief about the experience, there is no causal link between the fact (you feel pain) and your knowledge (you believe you feel pain).
  *   **Causal Power:** None. This severs the link required for knowledge.

  ### Which one did he need?
  To tell your friend "we can't really know [our experiences]," your roommate needed **Thesis #3 (Total Epiphenomenalism)**.

  Thesis #1 and #2 allow for self-knowledge. Under Thesis #2, the pain causes the belief about the pain, so you *know* you are in pain, even if the pain didn't physically move your tongue to speak. By claiming we *can't* know our experiences, he smuggled in the claim that experience doesn't even cause mental judgments.

  ### The Name and The Trap
  He is half-right about the name. This is known as **The Problem of Phenomenal Judgment** (popularized by David Chalmers).

  However, he is using it backward. In philosophy, this "problem" is the famous *objection* to epiphenomenalism, not a feature to be embraced. The argument goes: *If epiphenomenalism is true, we couldn't know consciousness exists, therefore epiphenomenalism is false.*

  By accepting the conclusion ("we can't know them"), he has sawed off the branch he is sitting on. If he can't know his own experiences, he has no evidence for consciousness existing in the first place, and thus no basis for claiming it is "along for the ride." You can tell him: **"If your theory is true, you can't know your theory is true."**
