prompt: |-
  I am a novelist at work on a book set in a hospital's genomic medicine unit, and I need your help with a problem that is more conceptual than clinical. The unit has adopted a policy of mandatory disclosure: any incidental finding from a patient's genome sequencing that has known clinical significance must be reported to the patient, whether or not the patient asked for it and whether or not anything can be done about it. The rationale offered is that patients have a right to know, and that knowing can only help them make better decisions. I am skeptical, but I lack the vocabulary to say exactly what the policy assumes. I would like you to act as an expert in decision theory and bioethics, think carefully, and help me reconstruct the philosophical commitments that this policy presupposes.

  Begin by brainstorming the possible views about information, autonomy, and welfare that could underlie such a policy. Then narrow your focus to one candidate: the idea, often called Good's theorem on the value of information, that a rational agent cannot be worse off in expected utility by receiving additional information, provided the agent can ignore it and updates by conditionalization. Does the hospital policy presuppose something like this theorem? If so, what are the theorem's conditions, and does the policy satisfy them? Pay attention to cases where the information is about an untreatable condition, where the patient cannot un-know it, where the information changes the patient's preferences or self-conception, and where the patient would prefer not to know. If the policy does not presuppose Good's theorem, what other theory of information does it presuppose? Reconstruct that theory as charitably as you can.

  Then distinguish what the policy strictly presupposes from what it merely fits well with. Is the policy coherent, or does it contain tensions? For instance, does it treat information as always beneficial while also treating patients as fragile and in need of protection? Finally, tell me what would have to change in the policy if we rejected the presupposed view — if we took seriously the possibility that information can have negative expected value, or that the right not to know is as important as the right to know. Be specific about the institutional changes, and be honest about where the policy is philosophically underdetermined, so that several theories would license it. I am not looking for citations or a literature review; I want a careful conceptual reconstruction that I can use to give my characters arguments that feel real.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Novelist writing a book set in a hospital's genomic medicine unit.
      *   **Problem:** Conceptual/Philosophical (not clinical).
      *   **Scenario:** Mandatory disclosure policy for incidental genomic findings (clinical significance, regardless of treatability or patient desire).
      *   **Rationale:** Right to know, knowing helps decision-making.
      *   **Task:** Act as an expert in decision theory and bioethics. Reconstruct the philosophical commitments presupposed by the policy.
      *   **Specific Steps:**
          1.  Brainstorm views on information, autonomy, and welfare.
          2.  Focus on Good's Theorem (Value of Information). Does the policy presuppose it? Check conditions (ignoring info, conditionalization, etc.). Consider edge cases (untreatable, un-knowing, preference change, right not to know).
          3.  If not Good's Theorem, reconstruct the alternative theory charitably.
          4.  Distinguish strict presuppositions from mere fit. Identify tensions (e.g., info is good vs. patients need protection).
          5.  Propose changes if the presupposed view is rejected (negative value of info, right not to know).
          6.  Identify areas of philosophical underdetermination.
      *   **Constraint:** No citations/literature review. Focus on conceptual reconstruction for character arguments.

  2.  **Brainstorming Underlying Views:**
      *   *Information as Asset:* Knowledge is inherently power/good. Ignorance is a deficit.
      *   *Autonomy as Control:* Autonomy means having all the data to make choices. More data = more autonomy.
      *   *Paternalism (Soft):* We know better than you what you should know. We are forcing this for your own good (beneficence).
      *   *Duty to Warn:* The institution has a duty to disclose risks, overriding patient preference.
      *   *Rational Agent Model:* Patients are expected utility maximizers who process data logically.
      *   *Narrative Identity:* Knowing changes who you are (not just what you know).

  3.  **Analyzing Good's Theorem:**
      *   *Theorem:* Expected utility of making a decision *with* free information $\ge$ expected utility of making a decision *without* it.
      *   *Conditions:*
          1.  Agent is rational (maximizes expected utility).
          2.  Agent can update via conditionalization (Bayesian).
          3.  Agent can *ignore* the information if it doesn't change the action.
          4.  Information is costless (or cost < benefit).
          5.  Preferences remain stable.
      *   *Application to Policy:*
          *   *Untreatable condition:* If nothing can be done, the action set is the same. Good's theorem says utility should be equal (ignore it). But in reality, psychological utility drops. So the policy violates the "costless" or "stable preference" condition.
          *   *Cannot un-know:* Good's theorem assumes you can act *as if* you didn't know if the optimal action is the same. But psychological state changes. You *are* different.
          *   *Preference Change:* Genomic info often changes self-conception (e.g., "I am a carrier," "I am destined"). This violates stable preferences.
          *   *Right not to know:* Good's theorem doesn't account for the utility of *remaining ignorant*. If ignorance has utility (peace of mind), forcing info reduces total utility.
      *   *Conclusion:* The policy *acts as if* Good's Theorem is true, but ignores the psychological costs that violate the theorem's conditions. It assumes information is "free" in terms of psychological burden.

  4.  **Reconstructing the Alternative Theory (if not Good's):**
      *   If not strict decision theory, maybe *Deontological Autonomy*.
      *   Idea: Truth-telling is a duty. Withholding truth is a lie by omission.
      *   Idea: "Right to Know" is a property right over one's own biological data.
      *   This fits "Mandatory Disclosure" better than utilitarian calculation. It treats information as *property* or *truth* rather than *tool*.

  5.  **Distinguishing Presuppositions vs. Fit:**
      *   *Strict Presupposition:* Information has positive or neutral value (never negative). The institution is the epistemic authority.
      *   *Tension:* "Right to know" (liberty) vs. "Mandatory" (coercion). You can't force someone to be free.
      *   *Tension:* "Patients make better decisions" (rationality) vs. "We must force them" (they won't choose it themselves).
      *   *Fragility:* If info is always good, why do we need genetic counselors to "break the news gently"? The protocol implies info is dangerous (needs handling) while the policy says it's beneficial.

  6.  **Proposing Changes (Rejecting the View):**
      *   *Tiered Consent:* Opt-in for incidental findings.
      *   *Right to Ignore:* Formal mechanism to designate data as "do not reveal."
      *   *Therapeutic Exception:* Only disclose if actionable (treatable).
      *   *Counseling:* Shift from "disclosure" to "interpretation support."

  7.  **Underdetermination:**
      *   The policy could be justified by Utilitarianism (long term population health), Deontology (duty to truth), or Rights Theory (ownership of DNA). These conflict but lead to the same rule. This is fertile ground for character conflict.

  8.  **Drafting the Response (Iterative refinement for tone and clarity):**
      *   *Tone:* Analytical, precise, empathetic to the philosophical nuance, suitable for a writer (evocative but rigorous).
      *   *Structure:* Follow the prompt's steps closely.
      *   *Key Insight:* The policy treats the patient as a *data processor* rather than a *living subject*. The friction comes from the gap between Bayesian updating and human psychology.

      *(Self-Correction during drafting)*: Make sure I don't get too bogged down in the math of Good's Theorem. Keep it conceptual. Emphasize the "cannot un-know" aspect as a violation of the "costless information" assumption. Ensure the distinction between "strict presupposition" and "consistent with" is clear. The policy *needs* the idea that info is net-positive, but it *fits* with many ethical frameworks.

      *(Refining the "Tension" section)*: The biggest tension is between *Liberty* (Right to Know) and *Coercion* (Mandatory). If it's a right, I can waive it. If it's mandatory, it's a duty. The policy conflates a right with a duty.

      *(Refining the "Changes" section)*: Be specific. "Opt-out" isn't enough if the default is still processing. Need "Data Segregation."

  9.  **Final Polish:** Check against the "novelist" persona. Give them arguments their characters can use. "You are treating my mind like a hard drive." "Ignorance is a shield, not a blindness."

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  Here is a conceptual reconstruction of the philosophical commitments underlying your hospital's mandatory disclosure policy. I have structured this to help you stage debates between characters who understand the machinery of the policy and those who feel its weight.

  ### 1. Brainstorming the Underlying Views

  To understand the policy, we must first identify the competing intuitions about information, autonomy, and welfare that are in play. The policy is not neutral; it selects specific views and suppresses others.

  *   **Information as Asset:** This view holds that information is inherently valuable, like money or health. Ignorance is a deficit state. To withhold information is to impoverish the patient.
  *   **Autonomy as Rational Control:** Autonomy is defined as the capacity to make choices based on all available relevant facts. A choice made in ignorance is deemed less autonomous, even if the patient prefers ignorance.
  *   **Beneficence as Prevention:** The medical institution sees its role as preventing future harm. If a genetic marker predicts a risk, failing to disclose it is seen as allowing preventable harm (even if the prevention is just "life planning").
  *   **The "Truth-Telling" Duty:** A deontological view that truth is a moral good in itself. Lying by omission (withholding a finding) violates the sanctity of the doctor-patient relationship.
  *   **The "Right Not to Know":** A counter-view that autonomy includes the right to remain ignorant. Some truths are destructive, and choosing not to look is a valid exercise of self-determination.

  The hospital policy clearly elevates *Information as Asset* and *Autonomy as Rational Control* while suppressing the *Right Not to Know*. But to understand *why* they think this is rational, we need to look at decision theory.

  ### 2. Good's Theorem and the Value of Information

  You asked specifically about **Good's Theorem** (the value of information). This is the strongest mathematical argument for your hospital's policy.

  **The Theorem:** In decision theory, I.J. Good proved that for a rational agent, the expected utility of making a decision *after* receiving free information is always greater than or equal to the expected utility of making the decision *before* receiving it. Simply put: **More information cannot make a rational agent worse off.**

  **Does the policy presuppose this?**
  Yes, implicitly. The policy operates on the assumption that disclosing a finding increases the patient's expected utility (or at least does not decrease it). If the hospital believed information could have *negative* expected value, mandatory disclosure would be malpractice.

  **The Conditions of the Theorem:**
  For Good's Theorem to hold, specific conditions must be met. Your hospital's policy violates almost all of them in practice, which is the source of the dramatic tension in your book.

  1.  **Costless Information:** The theorem assumes acquiring the information has no cost.
      *   *Violation:* Genomic information has a high psychological cost (anxiety, existential dread, "Damocles syndrome"). The policy treats the *data* as free, ignoring the *emotional tax*.
  2.  **Stable Preferences:** The agent's goals and values must remain the same before and after receiving the information.
      *   *Violation:* Learning you carry a gene for Huntington's disease often fundamentally alters your preferences (e.g., about having children, career risk, retirement). You are not the same agent after the news.
  3.  **The Ability to Ignore:** The agent must be able to discard the information if it doesn't change the optimal action.
      *   *Violation:* You cannot "un-know" a genetic risk. Even if the medical action is "do nothing," the psychological state is permanently altered. The information cannot be treated as a tool you can put down; it becomes part of your identity.
  4.  **Bayesian Rationality:** The agent must update their beliefs logically (conditionalization).
      *   *Violation:* Patients are humans. They may catastrophize a 10% risk as a certainty, or feel fatalistic about a manageable condition. The policy assumes patients process data like the hospital's algorithms do.

  **Conclusion on Good's Theorem:**
  The policy *acts as if* Good's Theorem applies to human beings. It assumes the patient is a rational utility maximizer for whom information is a costless tool. By mandating disclosure even for untreatable conditions, the policy asserts that the *state of knowing* is superior to the *state of not knowing*, regardless of the actionability. This is a category error: it treats existential knowledge as instrumental knowledge.

  ### 3. Alternative Theory: The Deontology of Biological Truth

  If we reject Good's Theorem (because patients aren't rational robots), what theory does the policy presuppose?

  Charitably reconstructed, the policy relies on a **Property Rights Model of the Self**.

  **The Theory:** Your genome is your property. The hospital is merely a processor of that property. Withholding a finding is akin to a bank hiding money from your account. It doesn't matter if spending the money would cause you stress; it is *yours*. To hide it is a violation of your ownership rights.

  **The Commitment:** This view separates the *data* from the *self*. It assumes the genome is an objective text that exists outside the patient's psychological experience. The hospital's duty is to deliver the text, not to manage the reading experience.

  **Why this fits the policy:** It justifies mandatory disclosure without needing to prove the information is "useful." It is useful only in the sense that an owner has a right to inspect their property. This bypasses the "untreatable condition" problem. It doesn't matter if you can fix the roof; you have a right to know it's leaking.

  ### 4. Strict Presuppositions vs. Mere Fit

  To write authentic conflict, you need to distinguish what the policy *requires* versus what it merely *tolerates*.

  **Strict Presuppositions (The policy breaks without these):**
  1.  **Epistemic Authority:** The hospital assumes it knows what counts as "clinically significant" better than the patient does. If patients could define significance themselves, the mandate would collapse.
  2.  **Net-Positive Valence:** The institution must believe that, on aggregate, the psychological harm of knowing is less than the harm of ignorance. If they admit information can have *negative* expected value for a specific individual, the mandate becomes indefensible.
  3.  **The Separation of Knowledge and Action:** The policy presupposes that knowing a risk is distinct from acting on it. This allows them to disclose untreatable conditions. They assume "knowing" is a terminal good, not just a step toward "curing."

  **Mere Fit (Consistent, but not required):**
  1.  **Genetic Counseling:** The policy fits well with offering counseling, but doesn't strictly require it. The counseling is a patch to fix the psychological damage caused by the mandatory disclosure.
  2.  **Electronic Health Records:** Storing the data digitally fits the policy, but the policy could exist on paper. However, digital storage reinforces the idea of data as a permanent, transferable asset.

  **Internal Tensions:**
  *   **Liberty vs. Coercion:** The rationale is "Right to Know" (a liberty), but the mechanism is "Mandatory Disclosure" (coercion). You cannot force someone to be free. If it is truly a right, the patient should be able to waive it. By making it mandatory, the hospital treats the "Right to Know" as a "Duty to Know."
  *   **Resilience vs. Fragility:** The policy assumes patients are strong enough to handle any truth (Rational Agent), yet the protocol requires genetic counselors to "break the news gently" and monitor for distress (Fragile Subject). The institution treats the information as a bomb that must be defused, even while claiming it is a gift.
  *   **Identity vs. Data:** The policy treats the genome as data (objective), but the disclosure treats the patient as a subject (subjective). The friction occurs when the data rewrites the subject's identity (e.g., "I am not healthy, I am pre-symptomatic").

  ### 5. Reconstructing the Policy (If We Reject the View)

  If your characters argue that information can have negative expected value, or that the Right Not to Know is paramount, the policy must change structurally. Here is what that looks like institutionally:

  **1. Tiered Consent (The "Menu" Model):**
  Instead of a blanket consent for "all clinically significant findings," patients select categories.
  *   *Change:* The intake form allows patients to opt-out of untreatable conditions, adult-onset conditions, or carrier status.
  *   *Philosophical Shift:* Moves from *Beneficence* (we know what's good for you) to *Respect for Autonomy* (you define what is good).

  **2. The "Right to Ignore" Protocol:**
  A formal mechanism where a patient can designate specific data as "Do Not Reveal."
  *   *Change:* If a finding matches a "Do Not Reveal" designation, the lab seals the result. It exists in the record but is firewalled from the patient and the primary care provider.
  *   *Philosophical Shift:* Acknowledges that ignorance can be a rational strategy for welfare. It treats the *state of mind* as part of the medical outcome, not just the biological state.

  **3. Actionability Threshold:**
  Disclosure is limited to findings where a medical intervention exists.
  *   *Change:* Untreatable conditions (like Huntington's or early-onset Alzheimer's markers) are withheld unless the patient specifically opts in.
  *   *Philosophical Shift:* Reverts medicine to *Instrumentalism*. Information is only valuable if it changes the action. Knowledge for knowledge's sake is removed from the clinical mandate.

  **4. Dynamic Consent:**
  Consent is not a one-time signature but an ongoing process.
  *   *Change:* Patients are re-contacted when new interpretations of their genome arise, and can choose at that time whether to receive the update.
  *   *Philosophical Shift:* Acknowledges that preferences change over time (violating the stable preference condition of Good's Theorem).

  ### 6. Areas of Philosophical Underdetermination

  For your novel, it is crucial to note where the policy is ambiguous. This allows different characters to justify the same rule for opposing reasons.

  *   **Utilitarian vs. Rights-Based:** A Utilitarian supports the policy because aggregate population health improves (people make better reproductive/lifestyle choices). A Rights Theorist supports it because DNA is property.
      *   *Conflict:* If a specific patient's mental health collapses (Utilitarian loss), the Rights Theorist still demands disclosure (Property right). The Utilitarian might want to withhold. The policy hides this conflict.
  *   **The Definition of "Clinical Significance":** Who decides?
      *   *Conflict:* The lab sees "significance" as statistical risk. The patient sees it as life destiny. The policy uses the lab's definition but applies it to the patient's life.
  *   **Family vs. Individual:**
      *   *Conflict:* Genomic data is shared. If Patient A learns they have a hereditary risk, they reveal information about Sibling B who didn't consent to testing. The policy prioritizes the Individual's Right to Know over the Family's Right to Privacy. This is a rich source of interpersonal drama.

  ### Summary for Character Arguments

  *   **The Pro-Policy Character (Chief of Genomics):** "Ignorance is not peace; it's vulnerability. We don't let patients drive blindfolded because they prefer the view. We give them the dashboard. Even if the engine light means a repair we can't afford, they have a right to know the car is broken." (Relies on Information as Asset / Property Rights).
  *   **The Skeptic (Counselor or Patient):** "You're treating my mind like a hard drive. You think you can just upload data without changing the operating system. But I'm not a computer. If you tell me I'm broken, I become broken. You're not giving me choices; you're stealing my future." (Relies on Narrative Identity / Negative Value of Information).
  *   **The Administrator:** "It's not about what you feel. It's about liability and standards. If we sit on a finding and you get sick, we are negligent. If we tell you and you get depressed, that's tragedy, not malpractice." (Relies on Institutional Self-Preservation / Deontological Duty).

  This framework should allow your characters to argue past each other, revealing that they are operating on different philosophical operating systems.
