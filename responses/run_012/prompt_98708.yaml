  **EMPLOYEE HANDBOOK: SECTION 4.0 | EPISTEMIC COMPLIANCE AND KNOWLEDGE VALIDATION**

  **4.1 Policy Statement**
  All operational claims, strategic projections, and internal memos classified as "Knowledge" (*Pramā*) must be derived exclusively from the four approved Instruments of Knowledge (*Pramāṇas*). Any data lacking a traceable lineage to one of these four instruments will be flagged as *Apramā* (invalid cognition) and rejected by Quality Assurance. The Epistemics Department retains sole authority to adjudicate instrument classification.

  **4.2 Approved Instruments**

  **I. Perception (*Pratyakṣa*)**
  Valid perception requires direct sensory contact between the observer and the object. Intermediate reporting chains invalidate perceptual claims. Note: Initial non-verbalized perception must be converted to verbalized reports within 24 hours to be actionable. Glasses and corrective lenses are permitted; augmented reality overlays require Inference Department clearance.

  **II. Inference (*Anumāna*)**
  Inference relies on establishing a permanent relation (*vyāpti*) between a Reason (*Hetu*) and a Proven Fact (*Sādhya*). All inferential claims must submit Form 104-B, detailing the minor premise, major premise, and conclusion. Be advised: The Inference Desk currently processes all requests involving unobserved causal mechanisms.

  **III. Comparison (*Upamāna*)**
  Knowledge derived from similarity or analogy. Employees utilizing this instrument should note that the Comparison Desk is currently understaffed and located in Basement Level 3, adjacent to Facilities Storage. Benchmarking reports submitted via this channel often experience significant latency.

  **IV. Verbal Testimony (*Śabda*)**
  Testimony is valid only when sourced from an *Āpta* (Certified Reliable Speaker). Reliability is not inherent to job title; it is conferred by Epistemics certification. While Level 5+ executives are presumptively reliable, this status is subject to audit. Hearsay is strictly prohibited. Employees must verify the speaker's competence and truthfulness before citing directive testimony. Disputes regarding who qualifies as an *Āpta* should be routed to HR, though final determination rests with Epistemics.

  **4.3 Prohibited Instruments: Postulation (*Arthāpatti*)**
  Requests to utilize *Arthāpatti* (postulation of unobserved facts to explain anomalies) are not accepted. For example, claiming "The client did not pay during the day, therefore they must pay at night" constitutes postulation. The Inference Department maintains that all valid postulations are merely complex inferences wearing a hat. Employees attempting to file under *Arthāpatti* will be redirected to Form 104-B. Repeated filings under this category may result in a referral to Behavioral Compliance.

  **4.4 Theory of Error and Doubt**
  The Company adheres to the Theory of Misattribution (*Anyathākhyāti*). Error is defined as taking X to be Y due to defective sensory contact or memory, not perceiving non-existent objects. Do not file incident reports claiming you "saw revenue that wasn't there." You saw existing assets and misattributed their classification. Policy Memo 88-B (Full Theory of Error) is available on the intranet.

  Doubt (*Saṃśaya*) is not a failure state but a workflow indicator. When doubt arises regarding conflicting data, do not suppress it. Resolve it by re-engaging the four approved instruments. Suppression of doubt without resolution is a terminable offense.

  **4.5 Appeals**
  If your knowledge claim is rejected, you may appeal to the Senior Epistemologist. Note: Appeals based on "common sense" or "intuition" are automatically dismissed. Stick to the four instruments.
