  ### 1. The Two Competing Rules

  Based on the nine verdicts you provided, your friend's reasoning can be modeled by two distinct rules. Both fit his past data, but they rely on different criteria for establishing meaning.

  **Rule A: The Principle of Irreversible Removal (The "Sacrifice" Rule)**
  *   **Definition:** An object or deposit indicates ritual or belief *only* if it has been permanently removed from the sphere of human utility or economic circulation. Evidence of "sacrifice" (destruction, burial, hiding in inaccessible places) is required to prove intent beyond domestic function.
  *   **Fit to Past Verdicts:**
      *   *Accepted:* Figurines sealed under a floor (Case 1), axes in a bog (Case 3), bent swords in a river (Case 4). In all these, the objects are lost to the living.
      *   *Rejected:* Pendant in rubbish (Case 2), pot in house (Case 5), beads in rubbish (Case 6), loose stone (Case 8). In all these, the objects remain in the "domestic sphere" or are explainable as loss/production.
      *   *Nuance:* The figurine in the doorway (Case 7) was ruled "Deliberate" but *not* "Ritual/Belief." Why? Because it was placed, not removed/destroyed. The large house (Case 9) indicates "Ranked Society" (social structure), not belief, because wealth accumulation is the opposite of removal.
  *   **Prediction for New Case:** The pebbles are in niches *within* the main room. They are not sealed, buried, or destroyed. The ochre is a smear, not a significant consumption of value. Therefore, under Rule A, these are **not votive offerings**. They are likely a "deliberate custom" or "domestic tradition," but calling them "votive" (which implies a transaction with the divine via sacrifice) is unjustified.

  **Rule B: The Principle of Recurrent Anomaly (The "Pattern" Rule)**
  *   **Definition:** An object indicates ritual or belief *only* if the specific behavior is statistically repeated across multiple contexts but serves no practical function. Singularity is noise; repetition is culture. Physical modification (snapping, bending) counts as a "marker" that substitutes for repetition.
  *   **Fit to Past Verdicts:**
      *   *Accepted:* 40 figurines (Case 1), dozens of bog deposits (Case 3), swords in river (Case 4 - implies a known type), pattern of large houses (Case 9).
      *   *Rejected:* Single pendant (Case 2), single pot (Case 5), loose stone (Case 8).
      *   *Nuance:* 300 beads (Case 6) showed repetition but were ruled "workshop" because the context (rubbish) provided a practical utility explanation.
  *   **Prediction for New Case:** 11 out of 14 houses show the *exact same* feature (niche + pebble + ochre). This is a strong statistical pattern. The pebbles are unworked and have no utility. Therefore, under Rule B, this **is a ritual custom**. The repetition proves it is not accidental, and the lack of utility proves it is not domestic. The verdict would likely align with the excavators: "Votive" or "Ritual."

  ### 2. Which Rule Is He Actually Running?

  Your friend is running **Rule A: The Principle of Irreversible Removal.**

  **Why:**
  The smoking gun is Case 7 (the figurine in the doorway). Under Rule B (Pattern), a single find should be dismissed as noise (like the pendant in Case 2 or the stone in Case 8). However, your friend accepted it as "Deliberate." Why? Because the *placement* (upright against a doorway) and *modification* (head snapped) acted as proof of intent.
  However, notice the language: He called it "Deliberate," whereas he called Case 1 (sealed figurines) and Case 3 (bog hoard) "Ritual" or "Offering." He distinguishes between **Action** (which can be proven by placement/modification) and **Belief** (which requires the negation of utility).
  In the new case, the excavators are using the word "Votive." This is a claim about *belief* (an offering to a deity), not just *action*. Since the pebbles are accessible and reusable (not sealed or destroyed), they fail the "Irreversible Removal" test required for a belief claim.

  **Reinterpretation if he were running Rule B:**
  If he were actually running Rule B (Pattern), he would have to reinterpret **Case 7**. He would have to admit that a single figurine tells us "nothing" because it lacks the statistical weight of Case 1 or Case 3. He would also have to be more accepting of **Case 5** (the decorated pot). If decorated pots were found in *every* house at that settlement, Rule B would force him to call it a "cultural standard" or ritual, whereas Rule A allows him to dismiss it as "just a pot" because it remains in the domestic sphere.

  ### 3. The Critical Test Case

  To force these rules apart, you need a scenario where **Pattern** and **Removal** contradict each other.

  **The Case:**
  Imagine a settlement where *every* house has a specific, unbroken, high-quality bowl placed on a high shelf in the main room (Pattern present, Removal absent). Contrast this with a single house that has a pit sealed beneath the floor containing a pile of broken, low-quality shards (Removal present, Pattern absent).

  **Rule A (Removal) Verdict:**
  *   *Shelves:* Domestic usage or decoration. (Objects are in circulation).
  *   *Sealed Pit:* Ritual offering. (Objects are removed from circulation, even if broken/low value).
  *   *Reasoning:* Belief is proven by the act of taking something out of use, not by how many people do it.

  **Rule B (Pattern) Verdict:**
  *   *Shelves:* Ritual or Religious Custom. (The standardization across the settlement proves a shared non-utilitarian rule).
  *   *Sealed Pit:* Anomaly or Hoard. (Without repetition across other houses, it could be a one-off event, storage, or hiding loot).
  *   *Reasoning:* Belief is a social phenomenon; it requires social replication to be distinguished from individual eccentricity.

  ### 4. Action vs. Belief: Does He Have the Right?

  Your friend's rulings split into two categories:

  **Claims about Action (What people did):**
  *   *Examples:* "Workshop debris" (Case 6), "Deliberate placement" (Case 7), "Ranked society/Institution" (Case 9), "Lost or thrown out" (Case 2).
  *   *Validity:* These are **epistemologically secure**. Archaeology records material consequences of human action. We can observe wear, context, and distribution to infer production, discard, or placement.

  **Claims about Belief (What people thought):**
  *   *Examples:* "Recurring household ritual/what people believed" (Case 1), "Offering" (Case 3 & 4).
  *   *Validity:* These are **inferences**, not observations. However, your friend has a right to make them *only* because he applies a "Negative Inference" method. He does not claim belief because an object looks "religious"; he claims belief because all *other* explanations (utility, loss, storage) have been ruled out by the physical evidence (sealing, destruction, distance).

  **Conclusion:**
  He has the right to the second kind of claim *only* under the strict constraints of Rule A. By demanding that the object be removed from the economic sphere, he ensures that the action *cannot* be explained by daily life. In the new case, because the pebbles remain in the living space, he is correct to challenge the "votive" label. He would likely argue: *"You have proven they placed these stones on purpose. You have not proven they gave them away."*
