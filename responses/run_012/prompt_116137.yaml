answer: |-
  1. This move is formally known as Evidential Cooperation in Large Worlds (ECL), a framework where agents maximize expected utility by treating their own decision as evidence for the decisions of distant, similar reasoners.
  2. Unlike Causal Decision Theory, which ignores correlations without physical links, this approach argues your choice updates the probability that other agents using your same decision algorithm also cooperate.
  3. It differs from Kantian ethics because the binding force is not moral duty but instrumental rationality, where cooperating yields higher expected value given the logical correlation.
  4. The argument strengthens in large worlds because the aggregate value of influencing the crowd via logical correlation outweighs the dilution of similarity across any single distant agent.
  5. Its critical edge is the reference class problem, where the theory collapses if you cannot rigorously define which distant agents truly share your decision-relevant computational structure.
