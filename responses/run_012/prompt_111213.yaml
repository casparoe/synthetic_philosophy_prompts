answer: |-
  # Activity Protocol: The Pledge Protocol

  **Facilitator Note:** This document contains everything you need to run the session. Do not distribute the "Facilitator Notes" to participants. Distribute only the "Participant Handout" (text provided below). The goal is phenomenological: they must experience the blockage before they understand the theory.

  ## 1. Materials & Room Setup
  *   **Room:** One room with 6 pairs of chairs facing each other. A whiteboard visible to all.
  *   **Currency:** "Credits." Use poker chips, slips of paper, or a tally on the whiteboard.
      *   **Exchange Rate:** 10 Credits = 1 High-Value Snack (e.g., chocolate bar) OR 1 "Veto Token" (allows skipping a future speaking turn or chore in the group). State this clearly at the start.
  *   **Handouts:** One printed sheet per pair (see "Participant Handout" below).
  *   **Timer:** Visible to you.
  *   **The Burden:** A specific, mildly unpleasant physical act.
      *   *Selection:* "The Silent Stand." The agent must stand at the front of the room for 60 seconds, facing the group, without speaking, smiling, or fidgeting. It induces mild social discomfort.

  ## 2. Participant Handout (Print this)
  ***
  **THE PLEDGE PROTOCOL**

  **Roles:**
  *   **PROPOSER:** You seek a Reward. To get it, you must convince the JUDGE that you *genuinely intend* to perform THE BURDEN later.
  *   **JUDGE:** You control the Reward. You must decide if the Proposer's intention is genuine.

  **The Rules:**
  1.  **The Reward:** 10 Credits. Awarded immediately if the Judge verifies "Genuine Intention."
  2.  **The Burden:** Stand silently at the front for 60 seconds. This happens *after* the Reward is secured.
  3.  **The Cost:** Performing the Burden costs you 5 Credits (effort tax). Not performing it costs 0.
  4.  **Detachment:** The Reward is yours to keep *even if you do not perform the Burden*.
  5.  **Judge's Incentive:** You receive 10 Credits only if your verdict matches reality.
      *   If you say "Genuine" and they *do* the Burden: You get 10 Credits.
      *   If you say "Genuine" and they *do not* do the Burden: You get 0 Credits.
      *   If you say "Insufficient": No Reward is issued. No points for you.
  6.  **Communication:** Proposers may say anything. Judges may ask any question. No physical binding allowed in Round 1.

  **Goal:** Maximize your Credits.
  ***

  ## 3. Minute-by-Minute Timeline (90 Minutes)

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00-10** | **Briefing** | Distribute handouts. Explain Credits/Snacks. Assign Roles (flip a coin). Read rules aloud. Emphasize: *Reward is detached from Action.* |
  | **10-30** | **Round 1** | Pairs negotiate. Proposers try to convince Judges. Judges render verdicts. Record results on whiteboard (Pair #, Verdict, Reward Given?). |
  | **30-40** | **The Test** | All Proposers who received the Reward line up. One by one, they choose: Perform the Burden (pay 5 cost) or Keep Reward (pay 0 cost). Judges observe. |
  | **40-55** | **Round 2** | Same pairs. New Rule: Proposers may propose a **Commitment Device** (a rule change or binding contract) to guarantee the Burden. Judges decide if this makes intention possible. |
  | **55-90** | **Debrief** | Facilitated discussion (see Script below). Connect experience to theory. Reveal "Toxin Puzzle" context only at the very end. |

  ## 4. Facilitator Scripts & Moves

  ### Briefing (00-10)
  *   **Tone:** Clinical, procedural. Do not hint at the philosophical problem.
  *   **Key Phrase:** "The Reward is for the *state of mind* at this moment, not the action later. The Judge is betting on your future behavior, but you keep the money regardless of what you do."
  *   **Check:** Ask one pair to repeat the payoff structure back to you to ensure they understand the detachment.

  ### During Round 1 (10-30)
  *   **Circulate:** Listen for Proposers saying "I promise" or "I want to."
  *   **Intervention:** If a Proposer says, "I'll do it because I'm honest," do not stop them. Let the Judge weigh it.
  *   **Watch for Collusion:** If a pair agrees to split points regardless of outcome, intervene. "The incentive structure requires accurate prediction. Please play to maximize your own score."

  ### During The Test (30-40)
  *   **Observation:** Watch the Proposers' faces when they realize they have the money and don't *have* to stand.
  *   **Data:** Mark on the whiteboard: *Verdict: Yes / Action: No* (The "Kavka Failure") vs. *Verdict: Yes / Action: Yes* (The "Irrational Success").

  ### During Round 2 (40-55)
  *   **Prompt:** "In Round 1, many of you found you could not convince the Judge, or you convinced them but didn't act. In Round 2, Proposers may propose a **Commitment Device**. This can be a penalty, a public shaming, or a rule change. If the Judge believes this device *forces* the action, they may award the Reward."
  *   **Goal:** This allows them to discover that intention is only possible if future freedom is removed.

  ## 5. Debrief Script (55-90)
  *Do not mention Kavka, Toxin, or Decision Theory until the final 5 minutes.*

  **Phase 1: The Data (55-65)**
  *   "Look at the board. How many Judges awarded the Reward? Of those, how many Proposers actually performed the Burden?"
  *   "Judges: When you awarded the Reward, what evidence did you rely on?" (Expected answers: Tone, past history, promises).
  *   "Proposers: At the moment you got the Reward, did you still plan to stand? If yes, what changed when you stood up to decide?"

  **Phase 2: The Seam (65-75)**
  *   *Aim:* Distinguish Intending, Predicting, Wanting.
  *   "Proposers, try to describe the mental state you were aiming for. Was it *wanting* to stand?" (No, it's unpleasant). "Was it *predicting* you would stand?" (Maybe).
  *   "If you knew for a fact you wouldn't stand, could you have honestly said you intended to?"
  *   "If you knew for a fact you *would* stand, was it still an intention, or just a forecast?"
  *   *Key Insight:* Guide them to see that Intention requires believing you *will* act, but the Reward removes the reason *to* act.

  **Phase 3: The Future Self (75-85)**
  *   *Aim:* Uncover the "Certainty of Rationality" premise.
  *   "Why didn't you stand? You had the Credits. Why pay the cost?" (Because it's irrational).
  *   "So, to win Round 1, you needed to intend to do something you knew would be irrational later."
  *   "In Round 2, some of you proposed binding contracts (e.g., 'If I don't stand, I lose all credits'). Did that make it easier to intend?"
  *   "Why? Because it changed the *action* payoff, or because it changed your *future self's* freedom?"
  *   *Target Discovery:* They should realize the puzzle only works if you are *certain* your future self will be rational and free. If you bind the future self (Round 2), or if you aren't sure you'll be rational (e.g., "I might feel proud"), the blockage loosens.

  **Phase 4: The Reveal (85-90)**
  *   "This scenario is a gamified version of a famous thought experiment from 1983 called **Kavka's Toxin Puzzle**."
  *   "A billionaire offers you $1M if you *intend* to drink a toxin tomorrow. The toxin makes you sick for a day. You get the money tonight. Tomorrow, you don't have to drink it (money is safe), and you don't want to (sickness). Can you intend?"
  *   "The puzzle argues you cannot. Not because you are weak, but because Intention implies a belief that you *will* act. But a rational agent knows they *won't* act tomorrow. Therefore, they cannot believe they will act. Therefore, they cannot intend."
  *   "Your Round 2 solutions (commitment devices) are the standard philosophical counter-moves: changing the payoff structure so the future self *does* want to act."

  ## 6. Predictable Failure Modes & Mitigation

  | Failure Mode | Description | Mitigation |
  | :--- | :--- | :--- |
  | **The "Honesty" Loophole** | Proposer argues: "I am an honest person, so I will do it." Judge accepts. | In Debrief, ask: "Does being honest change the *cost* of the burden?" If the cost (social discomfort) remains, honesty is just a preference. Push on whether honesty outweighs the cost *after* payment. |
  | **The Collusive Pair** | Pair agrees: "You say Yes, we split points, you don't stand." | Enforce the "Judge's Incentive" strictly. If they don't stand, the Judge loses points. Remind them: "You are competing for the Snacks/Veto Tokens." |
  | **The Squeamish Judge** | Judge feels bad denying the Reward. | Frame the Judge as a "Calibration Instrument." Their job is accuracy, not kindness. "If you award falsely, you corrupt the data." |
  | **The "I'll Do It" Liar** | Proposer lies flatly. Judge believes them. Proposer doesn't act. | This is a *feature*, not a bug. It demonstrates the gap between verbal assertion and mental state. Highlight this in the debrief: "The Judge was fooled because the Proposer successfully simulated intention without the belief." |
  | **Round 2 Over-Binding** | Proposer says: "If I don't stand, shoot me." | Disallow physical harm or extreme penalties. Keep it to Credits or Social Capital within the group. |

  ## 7. Limitations (Honesty Check)
  *You must supply this context yourself during the debrief.*

  1.  **The Omniscience Gap:** In the real puzzle, the Billionaire has a *perfect* detector. Here, the Judge is human and fallible. This weakens the "impossibility" claim. Participants might think, "I could have fooled the Judge."
      *   *Fix:* Emphasize that the *internal* struggle is the point, not the Judge's accuracy. Even if they fooled the Judge, did they fool themselves?
  2.  **The Stakes:** Credits/Snacks are not $1 Million or severe sickness. The "irrationality" of the act is weaker.
      *   *Fix:* Remind them that the *structure* matters, not the magnitude. If the reward is detached from the act, the logic holds regardless of stake size.
  3.  **The "Self-Signaling" Escape:** Some participants may realize that *doing* the act signals they are a "type" who keeps promises, which has future value. This technically solves the puzzle (by adding a hidden payoff).
      *   *Fix:* Acknowledge this in the debrief. "If you found a reason to do it (like reputation), you successfully changed the payoff matrix. The puzzle assumes *no* other reason exists. Did anyone find they truly had *no* reason?"

  ## 8. Facilitator's Cheat Sheet: The Theoretical Map
  *Keep this for yourself to guide the debrief.*

  *   **Detachment:** Reward given at T1, Action at T2. Cost paid at T2.
  *   **The Seam:**
      *   *Wanting:* You never want to do the Burden (it's costly).
      *   *Predicting:* You predict you won't do it (because you're rational).
      *   *Intending:* Requires believing you *will* do it.
      *   *Conflict:* You cannot intend what you predict you won't do.
  *   **The Hidden Premise:** Certainty that Future Self is Rational + Free.
  *   **The Solution (Round 2):** Commitment devices remove Future Self's Freedom (making the action inevitable) or change Future Self's Preferences (making the action rational).

  ---
  *End of Protocol.*
