  *(Self-Correction on the "Single Requirement"):* The prompt asks for the one that "does the most to rule out the familiar positions." The "Neutral Custodian" position relies on the idea that they don't select, they just keep. So Requirement 1 (Selection is Inescapable) is the hammer that breaks that shield. However, Requirement 4 (Neutrality vs. Honesty) is also strong. I will argue for Requirement 1 because it is ontological, whereas 4 is epistemological. If selection is ontological, neutrality is structurally impossible.

