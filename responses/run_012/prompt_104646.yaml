answer: |-
  ### Desiderata for a Theory of Archival Selection

  To move beyond the stalemate between the "neutral custodian" and the "archival power" models, we must first agree on what a theory of selection is required to explain. The following five requirements constitute the minimal specification for any adequate account of archival judgment. They are not solutions; they are the conditions any solution must meet.

  #### 1. The Requirement of Inescapability
  **The Requirement:** The theory must proceed from the premise that selection is ontologically inevitable. It cannot treat exclusion as an anomaly to be minimized, but as a constitutive feature of the archive. The question is never *whether* to exclude, but *on what grounds* and *by whose authority*.
  **The Consideration:** Physical storage is finite, but more importantly, cognitive attention is finite. An archive that attempts to keep "everything" simply shifts the selection pressure from the archivist to the researcher, who must now sift the meaningless to find the meaningful. If a theory claims neutrality based on the idea of "keeping what the records happen to contain," it ignores that the record itself was produced through prior selections (what was written, what was saved, what survived). To claim non-selection is to hide the mechanism of power.

  #### 2. The Requirement of Differentiated Silence
  **The Requirement:** The theory must distinguish between types of absence. A silence caused by accidental loss, a silence caused by active destruction/suppression, and a silence caused by a classificatory scheme that rendered certain lives unintelligible must be treated as distinct objects of analysis.
  **The Consideration:** Treating all gaps as equivalent "missing data" obscures the operation of power. A file missing due to fire is different from a file missing because a regime burned it, which is different from a file that was never created because the state did not recognize the subject as a legal person. A theory that cannot distinguish between *erasure* and *non-existence* cannot diagnose archival violence.

  #### 3. The Requirement of Conflicting Claims
  **The Requirement:** The theory must account for the ethical tension between the claims of those *inside* the records (subjects, creators) and the claims of those *outside* the records (researchers, future generations, the marginalized seeking evidence).
  **The Consideration:** Archives are not merely repositories of information; they are sites of encounter. Preserving a record may honor the historical claim of a community seeking evidence of injustice, while simultaneously violating the privacy or dignity of the individuals documented within it. A theory that privileges the "historical record" over the living subject (or vice versa) without acknowledging the cost is ethically incomplete.

  #### 4. The Requirement of Reflexivity over Neutrality
  **The Requirement:** The theory must determine whether the archivist can occupy a neutral position, or if the best possible stance is radical honesty about their positionality. It must specify what "objectivity" means in a context of selection.
  **The Consideration:** The "neutral custodian" argues that personal bias corrupts the record. The "power" critique argues that claiming neutrality is itself a political stance that protects the status quo. A theory must decide if the archivist is a mirror (reflecting the record) or a prism (refracting it). If the latter, the theory must demand the archivist disclose the angle of refraction.

  #### 5. The Requirement of Dual Fidelity
  **The Requirement:** The theory must reconcile fidelity to the record's *origin* (provenance, original order, context of creation) with fidelity to the *communities* the record describes (accessibility, safety, reparative description).
  **The Consideration:** Traditional archival science prioritizes provenance to maintain evidentiary integrity. Post-custodial theories prioritize community needs, sometimes advocating for re-ordering or redacting records to make them safe or usable. A theory cannot simply assert one priority; it must explain how to navigate the friction when preserving the "truth of the creator" harms the "truth of the subject."

  ***

  ### Critical Assessment: Non-Negotiables, Commitments, and Aporias

  To use this list in your seminar, you must distinguish between structural necessities and ideological commitments.

  **Non-Negotiables:**
  *   **Requirement 1 (Inescapability)** is non-negotiable. It is a material fact. Any theory claiming selection can be avoided is empirically false. This requirement alone dismantles the "neutral custodian" defense that they "just keep everything."
  *   **Requirement 2 (Differentiated Silence)** is non-negotiable for analytical rigor. Without it, the theory lacks the vocabulary to describe how archives function socially.

  **Partisan Commitments Dressed as Criteria:**
  *   **Requirement 5 (Dual Fidelity)** leans heavily toward the "new guard." The older model would argue that fidelity to origin *is* fidelity to the community, because altering the record destroys its evidentiary value. Treating "community answerability" as a co-equal demand is a specific ethical turn, not a universal archival law.
  *   **Requirement 4 (Reflexivity)** is similarly loaded. It presupposes that neutrality is impossible. A staunch positivist would argue that strict adherence to protocol *is* a form of neutrality, regardless of the archivist's internal state.

  **The Incompatible Pair (The Aporia):**
  The most critical tension for your seminar lies between **Requirement 3 (Conflicting Claims)** and **Requirement 5 (Dual Fidelity/Preservation)**.
  *   **The Conflict:** You cannot jointly satisfy the claim of a subject to be forgotten (Req 3) and the claim of the archive to preserve the record of origin (Req 5).
  *   **The Implication:** If the theory demands we honor the subject's wish for destruction, we violate the duty to provenance. If we honor provenance, we violate the subject's autonomy. This is not a puzzle to be solved but a contradiction to be managed. If a theory claims to resolve this cleanly, it is hiding the cost. The list itself reveals that the archive is a site of irreconcilable ethical demands, not a machine for correct answers.

  ***

  ### Case Study: The Police Surveillance Files

  **The Scenario:** A county archive is offered police surveillance files.
  *   **Donors (Police):** Want preservation whole and unredacted (Appeal to Req 5: Fidelity to Origin/Provenance).
  *   **Movement:** Want preservation as evidence of targeting (Appeal to Req 2: Silence/Power & Req 3: Claims of those outside seeking justice).
  *   **Surveilled Subjects:** Want destruction (Appeal to Req 3: Claims of those inside/privacy).

  **Application of the Theory:**
  1.  **Inescapability (Req 1):** The archive *must* select. Accepting the trove "whole" is a selection decision to prioritize the donor's context over the subjects' privacy. Rejecting it is a selection decision to prioritize privacy over evidence. Doing nothing is a selection to let the donors decide.
  2.  **Differentiated Silence (Req 2):** If the files are destroyed, is that a new suppression? Or a corrective justice? The theory must label this silence.
  3.  **Conflicting Claims (Req 3):** This is the deadlock. The Movement's need for evidence directly contradicts the Subjects' need for privacy.
  4.  **Reflexivity (Req 4):** The archivist cannot claim neutrality here. Choosing to preserve is a political act; choosing to destroy is a political act.
  5.  **Dual Fidelity (Req 5):** This requirement breaks. You cannot maintain the original order/context (which includes the uninvolved people) and be answerable to the community (which demands protection of the uninvolved).

  **Verdict:**
  The list **cannot decide the case** on archival terms alone. This is **not a failure of the theory**. It is a sign that the question was never the theory's to answer. The theory's job is to make the trade-offs visible, not to resolve them. It forces the archivist to admit: *"If I keep these, I am sacrificing the privacy of the innocent for the historical memory of the movement. If I destroy them, I am sacrificing historical evidence for the safety of the living."* The theory demands the archivist own that choice rather than hiding behind "policy."

  ***

  ### The Knockout Requirement

  The single requirement that does the most to rule out the familiar positions is **Requirement 1: The Inescapability of Selection.**

  This requirement dismantles the "Neutral Custodian" model at its root. The older ideal relies on the fiction that the archivist is a passive vessel who "keeps what the records happen to contain." By establishing that selection is ontologically inevitable—that every act of preservation is simultaneously an act of exclusion—you strip the custodian of the shield of passivity. Once selection is admitted as inevitable, the archivist is forced to justify the *criteria* of that selection. They can no longer say, "I didn't choose this; the record dictated it." They must say, "I chose this, based on these values." This forces the "neutral" camp into the open, where their values can be adjudicated alongside the "power" camp's values. It transforms the debate from *whether* to intervene to *how* to intervene responsibly.
