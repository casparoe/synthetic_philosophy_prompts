answer: |-
  # Seminar Activity: The Legion Protocol

  ## Overview
  **Goal:** To viscerally demonstrate the tension between Causal Decision Theory (CDT) and Evidential/Functional Decision Theory (EDT/FDT) in a "Large World" scenario, without naming the theories until the debrief.
  **Time:** 90 Minutes.
  **Participants:** 14 Graduate Students.
  **Materials:** 
  *   30 Index Cards (2 per student, plus spares).
  *   2 Markers (Red and Blue).
  *   Whiteboard & Markers.
  *   Projector (for Payoff Tables).
  *   15 pieces of high-quality chocolate (Stakes).
  **Stakes:** "Seminar Points" (SP). 
  *   100 SP = 1 Piece of Chocolate.
  *   Top 3 scorers at the end of the session receive a bonus piece.
  *   *Note:* Treat the points seriously. Do not trivialize them.

  ---

  ## Part 1: Setup and Rules (0:00 – 0:10)

  **1. Seating:** 
  Arrange the 14 students in 7 pairs. Ensure pairs cannot see each other's cards during the writing phase.

  **2. The Currency:** 
  Explain that they will earn "Seminar Points" (SP) over three rounds. Points accumulate. Top scorers get chocolate. This creates immediate stake in the optimization problem.

  **3. The Mechanism:** 
  Each round, students receive an index card. They must write either **C** (Cooperate) or **D** (Defect) in large letters. They fold the card. You (the Instructor) collect all cards before revealing any payoffs.

  **4. The Golden Rule:** 
  "For the duration of the game, you must maximize your own expected Seminar Points. You may not communicate with other players once the round begins."

  ---

  ## Part 2: The Three Rounds (0:10 – 0:55)

  ### Round 1: The Causal Pair (0:10 – 0:25)
  **Narrative:** "In this round, you are playing against the person sitting across from you. Your payoff depends on *their* actual choice, and theirs on *yours*. You have a causal influence on each other's outcome."

  **Payoff Table (Projector):**
  | You \ Partner | C | D |
  | :--- | :---: | :---: |
  | **C** | 3 SP | 0 SP |
  | **D** | 5 SP | 1 SP |

  **Procedure:**
  1.  Distribute cards.
  2.  Give 2 minutes for decision.
  3.  Collect cards.
  4.  **Reveal:** Ask each pair to reveal. Tally scores on the whiteboard next to each name.
  5.  **Expected Outcome:** Most will Defect. 
  6.  **Instructor Note:** Do not comment on rationality yet. Just record scores.

  ### Round 2: The Logical Twin (0:25 – 0:40)
  **Narrative:** "Reset your scores to zero for this round (or track separately). You are no longer playing your partner. You are now isolated. You are playing against a **Logical Twin**. This Twin is not in this room. They are in a distant location. You cannot communicate, and your choice cannot causally affect them. However, this Twin is constructed to reason *exactly* as you do. If you choose C, it is 90% probable they choose C. If you choose D, it is 90% probable they choose D."

  **Payoff Table (Projector):** *Identical to Round 1.*
  | You \ Twin | C (90%) | D (10%) |
  | :--- | :---: | :---: |
  | **C** | 3 SP | 0 SP |
  | **D** | 5 SP | 1 SP |

  **Procedure:**
  1.  Distribute cards.
  2.  Give 3 minutes for decision (allow the correlation to sink in).
  3.  Collect cards.
  4.  **Calculation:** You (the Instructor) calculate the payout based on the *stipulated correlation*, not the actual room choices. 
      *   *If Student writes C:* Expected Value = $(0.9 \times 3) + (0.1 \times 0) = 2.7$ SP.
      *   *If Student writes D:* Expected Value = $(0.9 \times 5) + (0.1 \times 1) = 4.6$ SP.
  5.  **Reveal:** Announce the scores. 
  6.  **Expected Outcome:** Most will still Defect (CDT intuition is strong here). 
  7.  **Instructor Note:** Highlight that causally, their action changed nothing.

  ### Round 3: The Legion (0:40 – 0:55)
  **Narrative:** "Reset scores again. The scenario changes. You are still isolated. You still cannot causally affect anyone. However, you are no longer playing against one Twin. You are playing against a **Legion** of 1,000 Logical Twins. They all reason exactly as you do. The correlation remains 90%."

  **Payoff Structure (Projector):**
  *   **If you Choose D:** Cost = 0. Gain = 0. (Total: 0 SP).
  *   **If you Choose C:** Cost = 500 SP. 
  *   **Benefit:** For *every* Twin that Cooperates, you receive 1 SP.
  *   **Correlation:** If you C, 900 Twins likely C. If you D, 900 Twins likely D.

  **Procedure:**
  1.  Distribute cards.
  2.  Give 5 minutes for decision. (This is the crux. Let them wrestle with the math).
  3.  Collect cards.
  4.  **Calculation:**
      *   *If Student writes C:* Cost 500. Evidence suggests 900 Twins C. Gain 900. **Net: +400 SP.**
      *   *If Student writes D:* Cost 0. Evidence suggests 900 Twins D. Gain 0. **Net: 0 SP.**
  5.  **Reveal:** Announce the scores. 
  6.  **Expected Outcome:** A significant portion should switch to Cooperate here, driven by the sheer magnitude of the evidential stake.
  7.  **Recording:** Keep a running tally on the whiteboard of how many chose C vs D in each round.

  ---

  ## Part 3: The Debrief (0:55 – 1:30)

  **1. The Data (5 mins):**
  Draw the aggregate choices on the board.
  *   Round 1 (Causal): % Defect.
  *   Round 2 (Twin): % Defect.
  *   Round 3 (Legion): % Cooperate.
  Ask: "Why did the rational choice shift? The causal structure never changed. In Rounds 2 and 3, you were explicitly told you had *zero* causal power."

  **2. Mapping the Theory (15 mins):**
  *   **The Friend's Claim:** Reveal that your friend's argument is what drove Round 3. This is **Evidential Decision Theory** (or Functional Decision Theory). The rationality of the act comes from what it *signals* about the state of the world (the Legion's choices), not what it *causes*.
  *   **The Size of the World:** Highlight that Round 2 (1 Twin) usually fails to compel Cooperation, but Round 3 (1,000 Twins) succeeds. The "Large World" is the lever that tips the Expected Value calculation. 
      *   *Equation:* $EV(C) = (Correlation \times N \times Benefit) - Cost$.
      *   If $N$ is large enough, $EV(C) > EV(D)$ even if Causal Impact = 0.
  *   **The Absence of Causal Channels:** Reiterate that in Rounds 2 and 3, no signal could travel. The link was purely *logical* or *nomological* (same reasoning process).

  **3. The Objection (15 mins):**
  Now introduce your objection (The Breakfast Problem).
  *   **Prompt:** "If I can reason myself into Cooperating in Round 3 because my choice is *evidence* of the Legion's choice, why can't I reason that eating oatmeal is evidence that a distant civilization eats oatmeal? If the universe is infinite, isn't *every* choice evidence of *everything*?"
  *   **Discussion:** Ask the students why Round 3 felt different from the Breakfast analogy.
      *   *Desired Insight:* The "Reference Class." In Round 3, the Twins were stipulated to be *relevantly similar* (same reasoning algorithm). In the Breakfast case, the correlation is spurious.
      *   **The Danger:** This is the "Blackmail" objection. If we accept the Friend's view, we become vulnerable to any hypothetical correlation. We must define *which* correlations count. The activity forces them to feel the pull of the Friend's view (Round 3) while sensing the instability (Breakfast).

  ---

  ## Troubleshooting: What Will Go Wrong

  **1. The "Skeptic" Problem:**
  *   **Issue:** In Round 3, students may refuse to accept the 90% correlation. "Why should I believe my choice predicts theirs?"
  *   **Fix:** Be authoritarian about the stipulation. "For the purpose of this calculation, the correlation is a law of nature. Do not debate the physics; debate the decision theory." If they still resist, ask them to calculate the *break-even* correlation. (e.g., "How high does the probability need to be for C to win?"). This turns skepticism into math.

  **2. The "Altruist" Confusion:**
  *   **Issue:** Students may Cooperate in Round 3 because they want to "help the twins," not because of evidential reasoning.
  *   **Fix:** During the instructions, emphasize: "You are maximizing *your* points. The Twins' welfare does not matter to you except as it affects your score." In the debrief, call out anyone who admits to altruism and separate it from the evidential argument.

  **3. The "Zero Sum" Misunderstanding:**
  *   **Issue:** Students might think their points come *from* the Twins.
  *   **Fix:** Clarify that the points are generated by the *state* of the Twins, not transferred from them. The Bank (You) pays out.

  **4. Time Overrun:**
  *   **Issue:** The math in Round 3 can stall.
  *   **Fix:** Pre-calculate the Expected Values on a hidden slide. If they stall, reveal the EVs directly: "If you C, you expect 400. If you D, you expect 0." Move on.

  ---

  ## Limitations: What This Activity Cannot Do

  Be frank with the group about the following:

  1.  **The Ontological Weight:** The activity stipulates the "Legion." In reality, we do not know if there *are* 1,000 logical twins. The Friend's argument requires a metaphysical claim about the size and structure of the universe that this game hand-waves. You must supply the philosophical heavy lifting on whether such a world is possible.
  2.  **The Reference Class Problem:** The game tells them who counts as a Twin ("people who reason like you"). In the real world, defining that class is the hardest part. Is it "humans"? "Rational agents"? "Agents who read this specific text"? The activity hides this difficulty; you must expose it in the debrief.
  3.  **The "Blackmail" Vulnerability:** The activity makes the correlation *beneficial* (Twins cooperate). It does not simulate the case where the correlation is *hostile* (e.g., "If you cooperate, a distant demon tortures someone"). The Friend's view implies you should act to manage evidence even in negative cases, which feels absurd. You must raise this manually in the discussion.

  ## Instructor Script for the Transition (Round 2 to 3)
  *"In Round 2, the stakes were small. One twin. The evidential link felt weak compared to the causal cost. Now, imagine the universe is not sparse, but dense. Imagine that for every decision you make, there are echoes of that decision reverberating through a vast network of agents who think as you think. The causal chain is still broken. You still cannot touch them. But the evidential chain is now a bridge wide enough to drive a truck across. Does the rationality of your choice change when the world gets big enough?"*
