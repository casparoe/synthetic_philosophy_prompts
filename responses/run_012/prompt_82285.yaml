prompt: |-
  I'm a backend engineer at a ~400 person software company, and for the last two years I've been on the promotion committee for Staff Engineer, which is honestly the most interesting thing I do all quarter. There's five of us — me, Dana, Marcus, Priya (she chairs it), and a rotating person from the adjacent org who's currently Yuki. The policy we're supposed to follow is that someone only gets promoted if all three criteria are met: (1) demonstrated technical impact, (2) scope beyond their own team, and (3) sustained over more than one cycle, i.e. not a one-off. But in practice we just argue for an hour, then take a vote up-or-down on the promotion, and seperately we each say where we land on the three criteria.

  The thing that's bugging me: I went back through our last four decisions to try to figure out what we're actually doing. Marco — 5-0 promote, and on the criteria it was impact 5-0, scope 5-0, sustained 5-0. Ines — 5-0 reject, criteria impact 1-4, scope 4-1, sustained 4-1. Tomas — 4-1 promote, criteria impact 5-0, scope 4-1, sustained 3-2. Ravi — 3-2 reject, criteria impact 2-3, scope 3-2, sustained 3-2. So nothing weird so far: every time we rejected, at least one criterion had a majority saying it was missing, and every time we promoted, all three passed. Priya's personal read happened to match the final outcome all four times, for whatever that's worth.

  Next week is Sofia, and I already did a dumb thing and talked to everyone one-on-one. Here's where people are: two of us (me and Priya) think she's got impact and scope but not the sustained part; one thinks impact and sustained but not scope; Marcus thinks scope and sustained but not impact; and Yuki thinks she clears all three and wants to promote her. So if we vote the bottom line it's 1-4 against. But when I actually tally the criteria, impact passes 4-1, scope passes 4-1, and sustained passes 3-2 — she clears all three if you go criterion by criterion. I genuinely can't tell whether we're a committee thats secretly aggregating the criteria and the bottom line just happened to agree every time, or whether we've been voting the bottom line and the agreement was a coincidence, or whether Priya's been quietly deciding and the rest of us have just been falling in line. What do you think we'll actually do with Sofia? Which rule are we really running, which other rules fit our four cases just as well, and what kind of case would have told those rules apart — I'd love to know if one of our old ones already does and I'm just not seeing it. And if it turns out we're being inconsistent, what should we do to actually be consistent with ourselves?
