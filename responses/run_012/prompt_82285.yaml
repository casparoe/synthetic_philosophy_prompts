answer: |-
  This is a classic example of the **Doctrinal Paradox** (also known as the Discursive Dilemma) in committee decision-making. You have stumbled onto a genuine inconsistency in your committee's logic, and Sofia's case is the first time your historical data is rich enough to expose it.

  Here is the breakdown of what will happen, what rule you are actually running, and how to fix it.

  ### 1. What will you actually do with Sofia?

  **Prediction: You will reject Sofia.**

  Despite the criteria tally technically passing her (4-1, 4-1, 3-2), the human dynamics of the room will override the math. Here is why:

  *   **The "Veto" Dynamic:** In your current setup, four out of five members personally believe Sofia fails *at least one* criterion. In promotion committees, a personal "no" on a criterion usually functions as a veto for that individual's vote. It is psychologically very difficult for Marcus to vote "Promote" when he genuinely believes Impact is missing, even if he knows 4 other people think Impact is present.
  *   **The Chair's Influence:** Priya matches the outcome 100% of the time. She is voting "Reject" (based on "Not Sustained"). In a 1-4 split, the Chair will almost always side with the majority of the room to maintain committee cohesion, especially when the majority reasoning is "she fails a bar" rather than "she passes the bar but we don't like her."
  *   **Process Order:** You noted that you "argue, then take a vote... and separately we each say where we land on the criteria." Because the **Bottom Line Vote happens before the Criteria Tally is finalized**, the criteria often become post-hoc rationalizations for the vote, not inputs to a formula. The 1-4 vote will happen, the meeting will end, and the criteria sheet will likely be "adjusted" during the wrap-up to align with the decision (e.g., someone might flip their Sustained vote to make it 2-3 to justify the rejection).

  ### 2. Which rule are you *really* running?

  You think you are running the **Official Policy (Conjunctive Rule)**, but you are actually running the **Individual Gatekeeper Rule**.

  *   **Official Policy (Committee Conjunctive):**
      *   *Logic:* We aggregate the committee's view on each criterion first. If the *Committee* agrees Impact is met (3+ votes) AND Scope is met AND Sustained is met, we Promote.
      *   *Sofia Outcome:* **Promote.** (Impact 4-1, Scope 4-1, Sustained 3-2).
  *   **Actual Practice (Individual Gatekeeper):**
      *   *Logic:* Each member acts as a mini-committee. I only vote "Promote" if *I* think all three are met. Then we majority vote the Bottom Line.
      *   *Sofia Outcome:* **Reject.** (4 members see a failure, 1 sees success).

  **Why the past four cases didn't show this:**
  Your historical data is "degenerate." In all four previous cases, the Individual Gatekeeper Rule and the Committee Conjunctive Rule produced the same result.
  *   *Marco:* Everyone agreed on everything.
  *   *Ines/Ravi:* The majority agreed on a specific failure (Impact), so both rules said Reject.
  *   *Tomas:* The majority agreed on everything (even if Sustained was close 3-2), so both rules said Promote.

  Sofia is the **Discriminating Case**. She is the first candidate where the committee *collectively* passes all criteria, but *individually* no majority coalition exists that believes she passes everything.

  ### 3. What case would have told these rules apart?

  You need a case where the failures are **distributed** rather than **concentrated**.

  *   **Concentrated Failure (Ines/Ravi):** 4 people say "Impact is Missing."
      *   *Individual Rule:* 4 Reject votes.
      *   *Committee Rule:* Impact criterion fails.
      *   *Result:* Same (Reject).
  *   **Distributed Failure (Sofia):**
      *   Person A says "Sustained is Missing."
      *   Person B says "Sustained is Missing."
      *   Person C says "Impact is Missing."
      *   Person D says "Scope is Missing."
      *   Person E says "All Present."
      *   *Individual Rule:* 4 Reject votes (A, B, C, D all see a failure).
      *   *Committee Rule:* Impact Passes (4-1), Scope Passes (4-1), Sustained Passes (3-2).
      *   *Result:* **Different.**

  You have never had a "Distributed Failure" candidate before. That is why you haven't noticed the inconsistency.

  ### 4. How to be consistent (and fair)

  If you continue with the current process, you risk rejecting candidates who *do* meet the company bar (as defined by the committee aggregate) simply because no single person saw the whole picture. This biases against candidates whose impact is broad but shallow (visible to many, but deeply to none) or who have specialized impact that only subsets of the committee understand.

  To fix this, you need to change the **Order of Operations**.

  **Recommendation 1: Vote Criteria First, Bottom Line Second.**
  Do not take the Up/Down vote until the criteria sheet is locked.
  1.  Discuss candidate.
  2.  Vote Impact (Pass/Fail).
  3.  Vote Scope (Pass/Fail).
  4.  Vote Sustained (Pass/Fail).
  5.  **Apply the Algorithm:** If all three criteria have majority Pass, the outcome is **Promote**. If any criterion has majority Fail, the outcome is **Reject**.
  6.  *Optional:* Take a sentiment vote on the Bottom Line only to gauge consensus strength, but bind the decision to the criteria math.

  **Recommendation 2: Define the "Committee View."**
  Explicitly agree as a committee: *"Are we five individual gatekeepers, or are we one collective brain?"*
  *   If you are **Gatekeepers**, admit that the criteria are just feedback forms and the Vote is the only thing that matters. (This is honest, but risks inconsistency).
  *   If you are a **Collective Brain**, then Sofia *must* be promoted. The committee collectively affirms she has Impact, Scope, and Sustained. The fact that Marcus doesn't see the Impact doesn't matter if the other 4 do.

  **Recommendation 3: The "Sofia Fix" for next week.**
  Since you've already done the 1:1s, you know the votes. In the meeting:
  1.  Acknowledge the split explicitly. "It looks like we have a distributed failure pattern."
  2.  Ask the question: *"If the committee collectively affirms she meets all three bars, is it fair to reject her because no single person saw all three?"*
  3.  If you want to be consistent with your **Official Policy**, you have to promote her.
  4.  If you want to be consistent with your **Historical Precedent** (Individual Gatekeeper), you reject her.

  **My advice:**
  Given you are at a ~400 person company, process integrity matters for retention and legal risk. The **Official Policy** (Committee Conjunctive) is the safer, more defensible standard. It prevents a single grumpy committee member from blocking a promotion based on a criterion the rest of the committee disagrees with.

  However, a 3-2 pass on "Sustained" is weak. If you promote her, do so with a specific note that the "Sustained" bar was met by committee consensus, not unanimity, and set clear expectations for her next cycle. If you reject her, you must admit you are deviating from the written policy and effectively operating on a "Unanimous Consent of Criteria" basis (where one person's "No" on a criterion kills it), which you should then write down as the new policy.

  **The most consistent move?**
  Change the voting order for Sofia. Vote the criteria live in the room. If the criteria pass, **promote her**. It will feel uncomfortable to four of you, but it is the only way to align with the rules you claim to follow. If you can't do that, you need to rewrite the policy to match your behavior (Individual Gatekeeper) before you burn a candidate who actually cleared the bar.
