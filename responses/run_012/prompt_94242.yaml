answer: |-
  # The Procedure

  **Step 1: Triangulation Anchor (Constraint).** Identify the shared object of reference (location, event, person). A sufficient answer requires identifying a specific coordinate, date, or named individual present in both your briefing pack and the transcript. If no shared reference exists, you cannot interpret belief, only vocabulary. Stop.

  **Step 2: Coherence Scan (Constraint).** Map the statement against the group's last ten public assertions. A sufficient answer requires locating the statement within their existing web of belief. If the statement contradicts the web without explanation, flag it as an anomaly. You must assume logical consistency unless the data forces a break; this is the Davidsonian principle of charity applied to internal logic.

  **Step 3: Asymmetry Weighting (Judgement).** Compare the claim against your briefing pack. If the claim concerns local empirical facts (e.g., "the bridge is down"), defer to the source unless you have direct sensory evidence (e.g., your own eyes). If the claim concerns strategic intent, defer to the briefing pack. This resolves the information asymmetry: they know the ground; you know the context.

  **Step 4: Contradiction Resolution (Judgement).** When statements conflict across time, determine if the audience or context changed. A sufficient answer requires identifying a variable (security situation, audience composition) that renders the beliefs compatible. If no variable exists, record a change of belief. Do not assume mistranslation unless the term is technically ambiguous.

  **Step 5: Metaphysical Bracketing (Constraint).** Separate empirical claims from doctrinal claims. A sufficient answer requires isolating metaphysical assertions (curses, martyrdom efficacy) from physical ones. You must attribute metaphysical beliefs sincerely if they cohere with their doctrine, even if they violate physics. Charity applies to their rationality within their system, not to scientific accuracy.

  **Step 6: Translation Selection (Judgement).** When your hearing and your partner's translation diverge, select the version that maximizes coherence with Step 2. Do not select the version that best fits your editors' narrative. A sufficient answer requires a written justification citing specific past statements that support the chosen translation.

  **Stop Condition:** If Step 2 fails repeatedly (incoherence exceeds 40% of statements), stop interpreting belief. Switch to predicting behavior based on incentives. You cannot interpret a speaker who holds no beliefs you can recognize.

  **Forbidden Sentences:**
  1.  *"The group falsely claims..."* (Reason: Asserts objective truth over attributed belief; violates the separation of interpretation and verification.)
  2.  *"The leader knows this is lies..."* (Reason: Attributes intent rather than belief; you cannot access intent without shared truth conditions.)
  3.  *"Clearly, the group believes..."* (Reason: Hides the interpretive judgement call; removes the hedge required by Step 6.)
  4.  *"The truth is..."* (Reason: Breaches the analyst's role; you are reporting their reality, not the world's.)

  # Worked Runs

  **Case 1: The Denial (Satellite vs. Spokesperson)**
  **Input:** Spokesperson denies an attack occurred; satellite imagery confirms destruction. Editor wants "falsely claims."
  **Run:** Step 1 anchors the location (shared). Step 2 reveals a pattern of denying enemy successes to maintain morale. Step 3 weighs asymmetry: satellites are superior to local testimony on physical destruction, but the spokesperson is superior on *intent*. Step 5 brackets the claim: is this empirical or strategic? If empirical, they are mistaken or lying. If strategic, it is a performance. Davidson dictates you cannot interpret them as believing a blatant falsehood while sharing your logic. Therefore, they are either redefining "attack" or performing for an audience. You cannot attribute the belief "no attack happened" if the evidence is overwhelming; you must attribute the *statement* as a strategic position. This is the answer you will not like: you cannot call it false in a note about *belief*, because calling it false asserts your epistemic authority over their doxastic state. You must report the maintenance of the position, not its truth value.
  **Permitted Sentence:** "The leadership maintains that no operation occurred in the sector."

  **Case 2: The Contradiction (Women in Public Life)**
  **Input:** March statement supports women in public life; June statement restricts it.
  **Run:** Step 1 anchors the subject (women's roles). Step 2 scans coherence: March was during recruitment drive; June is during consolidation. Step 4 resolves contradiction: The audience changed from potential recruits to current fighters. The belief (women serve the cause) is stable; the application (public vs. private) is pragmatic. Do not record a belief change unless the doctrinal justification shifts. Here, the justification shifts from "equality" to "security." This is a change in application, not core belief. Step 6 checks translation: "public life" is consistent in both transcripts. The variance is contextual. You record the conditional nature of the belief.
  **Permitted Sentence:** "The leadership now conditions women's public participation on security stability."

  **Case 3: The Curse (Metaphysical Efficacy)**
  **Input:** Leader claims a curse will degrade enemy morale via martyr's blood.
  **Run:** Step 1 anchors the event (martyrdom). Step 2 shows high coherence with prior doctrinal statements on blood sacrifice. Step 5 brackets the claim: this is metaphysical, not empirical. Davidson's charity requires you to treat them as rational within their system. To say "they believe this superstition" implies you know better than them about their own metaphysics. You must attribute the belief sincerely because it coheres with their web. To deny it is to misunderstand their motivation. The uncomfortable implication is that you must treat the curse as a real factor in their decision-making, not as color.
  **Permitted Sentence:** "The leadership asserts the curse will degrade enemy morale."

  # Where It Gives Out

  The procedure fails when the source is deliberately deceptive without a shared truth baseline. If the leader speaks purely ritually—words meant to invoke power rather than describe fact—Step 1 collapses because there is no propositional content to triangulate. In these cases, you are not interpreting belief; you are cataloging performance. Switch to prediction: do not ask what they believe the curse does, ask what they will do after invoking it.

  The procedure also hands you a choice in Step 6 (Translation). When both translations fit the coherence check equally, the material underdetermines the belief. This is your ethical burden. Do not default to the editor's narrative. Choose the translation that attributes the most coherent worldview to the speaker, even if it makes them seem more dangerous or more rational than your briefing pack suggests. If the procedure stops at the Stop Condition, do not write a note on belief. Write a note on behavior. Admitting you cannot interpret them is more useful than falsely claiming you can.

  # Bottom Line

  This procedure implies you are not reporting facts about the world, but facts about *their* world. You must sacrifice the editor's desire for definitive truth claims ("falsely claims") to preserve the integrity of the attribution ("maintains"). If you call them liars, you stop understanding them. I am confident this is the only way to produce intelligence that survives contact with reality. If you cannot say what they believe without calling them false, you do not know what they believe yet. Write less, but write what holds.
