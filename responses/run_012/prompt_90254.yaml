  I write for a science-and-ideas desk and I keep running into one proverb in AI arguments that I'd like to actually pin down. It's the duck one — if it looks like a duck, walks like a duck and quacks like a duck, then it's a duck — and a few weeks ago a startup founder used it to shut down a question I'd asked him about an AI companion app whose users sincerely believe it loves them: his line was, if you can't tell the difference in conversation, there is no difference to tell, so stop asking whether it's really conscious. Maybe. But I've also been rereading Dennett's 2023 Atlantic piece on counterfeit people, where the whole point is that these systems are engineered to pass for real — a fake twenty sails through the corner shop, and thats exactly what makes it a fake — and he connects it to how hard it is for us to resist taking the intentional stance toward anything that talks back. So the proverb and the counterfeit idea seem to pull in opposite directions, and I suspect the founder is leaning on one particular reading of the proverb without knowing it. Can you lay out the different precise claims that sentence could be making, from the boring ones (its just a point about how we use the words duck, or person) up to the strong ones (the behaviour just is the mental state, there's nothing hidden behind it), say which are true, which are merely defensible, which are false, and then tell me which reading the founder needs for his move to work, and whether the counterfeit case genuinely breaks it. Please write it as continuous prose, no headings, no bullet points, no bold, no tables — just the way you'd explain it to me in an email.
