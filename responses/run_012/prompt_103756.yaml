  Hey, I'm in a philosophy of physics reading group and I'm stuck on something that's driving me nuts. We did a session on Gödel's rotating-universe solution to Einstein's equations -- the spinning cosmos where you can supposedly fly a rocket around a big enough loop and get back to where you started before you left. Everyone in the group kept repeating that closed timelike curves show time is an illusion, and I think that's basically a non sequitur. The mere existence of a possible world where you can loop back doesn't obviously show that time in our world isn't really passing, and the whole thing smells to me like it should be about time-travel paradoxes, not about whether becoming is real. But I've got a nagging feeling I'm missing the actual argument Gödel was making.

  Can you walk me through the conceptual issue slowly and concretely: what is the argument that runs from a solution like his, or from relativity more generally, to the conclusion that time in the sense of an objective passage or becoming isn't part of the furniture of the world? Please be careful about the difference between time being relative to a frame and time being unreal -- I'm pretty sure the group was sloppy about that and it might be teh whole crux. Then here's the twist that's really bugging me, and I'd like you to use it as a test case: imagine someone modifies the cosmology so that all the closed timelike curves are confined to some compact blob, and outside that region the universe is perfectly tame, with an ordinary global time ordering. Does the Gödel-style argument survive that change, or does it fall apart? My hunch is the answer tells you what the argument was really about, so please don't just hand me the conclusion -- give me the steps, and at the end tell me where the weakest link is. No need for who-said-what or references, I just want the conceptual structure.
