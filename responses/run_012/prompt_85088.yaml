prompt: |-
  Im a high school student and I've been learning Python on my own. For a philosophy club presentation I have to explain Moore's paradox, the thing where someone says it's raining but they dont believe it, and why thats weird even though both halves could be true at once. I dont really get the philosophy vocab, but I do get my little chatbot project. It has a dictionary of facts with a confidence score for each one, a rule that it can only print a sentence if its confidence in that sentence is above 0.7, and a log of everything it has printed. It can check if two facts contradict each other by looking at the dictionary. So heres what I want: take the main philosophical positions and debates about Moore's paradox, including the two versions, the one where you say you dont believe it and the one where you say you believe the opposite, and restate them as faithfully as you can in the vocabulary of that chatbot: facts, confidence scores, the consistency check, the speech rule, the difference between what the program stores and what it prints. Then give me the residue report. What translates cleanly? What only translates if you fudge it? What has no counterpart at all in my chatbot setup, like is there anything about the first person, or about assertion being a commitment, or about expressing a belief vs describing it, that my program just cant say? And tell me whether that leftover stuff means my framework is missing something real, or whether it means the philosophers are making a big deal out of something that a simple consistency check would dissolve. Be honest and dont just make my chatbot sound smarter than it is. Also pls dont give me a reading list or citations, I cant look stuff up for this.
