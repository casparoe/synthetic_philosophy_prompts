      Title: Beyond Demandingness: Two Concepts of Moral Maximality

      Project Question
      This project asks: Does "maximal moral goodness" require the elimination of non-moral projects, or merely their lexical subordination to moral demands? The standard debate, following Susan Wolf, asks whether a moral saint is desirable. However, "maximal" remains ambiguous. I distinguish the **Exhaustive Saint** (who abandons non-moral interests to maximize good) from the **Subordinate Saint** (who retains interests but treats them as always trumpable by moral needs). The hypothesis is that undesirability objections bite only against the Exhaustive Saint, while the Subordinate Saint may represent a coherent, distinct ideal—or perhaps an incoherent one.

      Context and Gap
      The literature on moral demandingness is extensive. It is settled that act-utilitarianism imposes high demands. It is contested, however, whether "maximal goodness" is a unified target. Most critiques assume the saint lacks non-moral identity. Yet, some perfectionist accounts suggest one can maximize moral value while maintaining personal projects, provided those projects never override moral obligations. This structural distinction is rarely isolated. Existing arguments often slide between criticizing the saint's *motivation* (obsessive) and their *actions* (sacrificial). By conflating Exhaustive and Subordinate models, the debate obscures whether the problem is moral supremacy itself or the total consumption of agency. This project does not assume the distinction is robust; it investigates whether it holds conceptual water.

      Methodology and Significance
      I will employ conceptual analysis to define "maximality" and "subordination." I will construct a taxonomy of saint-types and test them against intuitive cases, such as the musician who plays poorly for fun versus the musician who quits to volunteer. This approach avoids retreading the standard utilitarian vs. commonsense morality ground. Instead, it interrogates the psychology of the moral agent. If successful, the project clarifies which version of sainthood is actually under attack. If the Subordinate Saint is coherent, some demandingness objections may miss their mark. If the distinction collapses, we gain insight into why moral supremacy seemingly consumes non-moral space.

      Outcomes and Failure Conditions
      A successful outcome is a published-quality paper delineating the taxonomy and establishing whether the Subordinate Saint is a viable distinct category. This would refine future debates on moral perfection.
      Project failure is defined specifically: If analysis shows that "lexical subordination" necessarily entails the elimination of non-moral projects in practice (i.e., the Subordinate Saint collapses into the Exhaustive Saint due to the density of moral demands), then the proposed distinction is illusory. Acknowledging this collapse would still be a valuable philosophical result, but it would negate the primary hypothesis.

      Work Plan (6 Months)
      *   **Month 1:** Comprehensive review of demandingness and moral perfection literature. Map existing uses of "maximal."
      *   **Month 2:** Develop the Exhaustive/Subordinate taxonomy. Refine definitions of subordination vs. elimination.
      *   **Month 3:** Draft core argument sections. Apply taxonomy to standard case studies (Wolf's examples).
      *   **Month 4:** Develop original cases (e.g., the pianist). Test robustness of distinction against counter-arguments.
      *   **Month 5:** Full draft completion. Internal review for clarity and argument strength.
      *   **Month 6:** Revision and polishing. Prepare manuscript for submission to journals (e.g., *Ethics*, *Philosophical Studies*).

      This timeline allows for deep conceptual work without overpromising empirical research. The focus remains strictly on normative analysis and conceptual clarity.

