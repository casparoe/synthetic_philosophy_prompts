answer: |-
  **Exam Question**

  Simone Weil's *On the Abolition of All Political Parties* is frequently summarized as a complaint against party discipline and the suppression of individual conscience. However, this surface reading obscures a deeper structural claim. Distinguish between a 'corruption reading' of Weil (parties damage judgment through contingent pressures like careerism or electoral incentives, leaving the damage in principle remediable) and a 'constitutive reading' (the party form *as such* is incompatible with the attention to truth that politics demands).

  In a closed-book essay, address the following:
  1.  Argue which of these two readings Weil's text can sustain.
  2.  Test the constitutive reading against a form of demanding collective loyalty that is *not* a political party (e.g., a trade union, a religious order, or a research school). Explain why Weil might exempt this collective from her indictment.
  3.  Specify what would have to be true of a political organization for Weil's argument to fail (i.e., what conditions would allow a 'party' to escape her critique?).

  **Time Allowed:** 90 Minutes
  **Word Limit:** None (Quality of argument prioritized)

  ***

  **Model Answer**

  Simone Weil's indictment of political parties is often mistaken for a moral critique of bad actors. However, a rigorous examination of *On the Abolition of All Political Parties* reveals that her argument sustains the 'constitutive reading' rather than the 'corruption reading.' The corruption reading suggests that parties fail because they attract ambitious careerists or succumb to the pressure of fundraising and elections. If this were Weil's only point, the remedy would be regulatory: campaign finance reform, term limits, or internal democratization. Weil, however, argues that the very mechanism of the party—the crystallization of a collective will—is ontologically opposed to the individual attention required to perceive truth.

  For Weil, truth is singular and external, accessible only through a solitary, disciplined attention that suspends the self. The party, by contrast, creates a "collective being" that thinks and feels through its members. When an individual joins a party, they substitute the question "Is this true?" with "Is this useful for the party?" This is not merely a contingent pressure of careerism; it is the structural function of the group. The party exists to exert pressure, and pressure is the enemy of attention. Therefore, the damage is not remediable within the party form. Even a party composed of saints would cease to attend to truth the moment they coordinated to exert collective pressure, because the collective momentum inevitably replaces the silent waiting upon truth. Thus, Weil's argument is constitutive: the party form generates collective passion, which is structurally identical to the mechanism of propaganda, rendering genuine political thought impossible.

  To test this constitutive claim, one must examine collectives that demand loyalty but are not parties. Consider a religious order or a scientific research school. These groups demand strict adherence to method and often require the subordination of personal ego. However, Weil exempts them because their end is not *power*, but *truth* (or God). A research school demands loyalty to the scientific method, which is an open-ended procedure for discovering external reality. If data contradicts the school's hypothesis, the school must change. A political party, conversely, demands loyalty to a *line*. If facts contradict the party line, the party must obscure the facts to maintain unity. The religious order submits to God; the party submits to itself. Therefore, while both demand loyalty, the religious order directs attention outward toward the absolute, whereas the party directs attention inward toward the preservation of the collective organism. The constitutive flaw is not loyalty itself, but loyalty to a human construct designed for competition.

  Finally, for Weil's argument to fail, a political organization would have to exist that does not crystallize into a permanent collective entity seeking to seize or hold power. It would have to be a transient grouping formed for a specific action, dissolving immediately after, preventing the formation of a "party spirit." More radically, for a party to escape Weil's indictment, it would have to prioritize the expression of truth over the exertion of pressure. It would need to function not as a machine for winning elections, but as a forum where opinions are constantly fluid and never solidified into a platform. However, Weil suggests this is a contradiction in terms: an organization that does not seek to impose its will is not a party. Consequently, the only way to satisfy the conditions of her argument is the abolition of the form itself.

  Weil's critique must also be distinguished from the familiar sociological charge that parties inevitably become oligarchic, as argued by Robert Michels. Michels' 'Iron Law of Oligarchy' suggests that parties fail because leadership structures consolidate power, betraying the democratic base. This is a corruption reading: the structure *becomes* bad over time. Weil's argument is more fundamental. Even a perfectly democratic party, with rotating leadership and no careerism, would still be guilty. The sin is not that the leaders rule the members, but that the collective entity rules the truth. For Weil, the oligarchy is not at the top of the party; the party itself is an oligarchy of the collective over the individual soul.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **1. Distinction between Readings (4 Marks)**
  *   **Criteria:** Candidate clearly defines the 'corruption reading' (contingent/remediable pressures) vs. the 'constitutive reading' (inherent incompatibility with truth/attention).
  *   **Common Error:** Candidates conflate the two, treating careerism as the root cause rather than a symptom of the form.

  **2. Identification of Weil's Position (4 Marks)**
  *   **Criteria:** Candidate explicitly argues that Weil sustains the *constitutive reading*, grounding this in her metaphysics of 'attention' and the 'collective being.'
  *   **Common Error:** Candidates hedge or claim Weil allows for reformed parties if discipline is relaxed.

  **3. Analysis of Non-Party Collective (4 Marks)**
  *   **Criteria:** Candidate selects a valid example (e.g., religious order, research school) and distinguishes it based on its *end* (Truth/God) versus the party's *end* (Power/Pressure).
  *   **Common Error:** Candidates choose a trade union but fail to note Weil's skepticism of unions when they act as power blocs similar to parties.

  **4. Conditions for Argument Failure (4 Marks)**
  *   **Criteria:** Candidate specifies that a 'party' would need to be transient, non-crystallized, or prioritize truth over pressure to escape the indictment (effectively ceasing to be a party).
  *   **Common Error:** Candidates suggest procedural fixes (e.g., "more internal democracy") which Weil explicitly rejects as insufficient.

  **5. Distinction from Oligarchic Critique (4 Marks)**
  *   **Criteria:** Candidate explicitly separates Weil's argument from Michels/Iron Law of Oligarchy, noting Weil critiques the *collective itself*, not just the leadership structure.
  *   **Common Error:** Candidates treat Weil's argument as identical to Michels', arguing she simply wants to prevent leaders from dominating members.
