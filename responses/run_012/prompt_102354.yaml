prompt: |-
  I'm setting the final exam for an upper-level seminar on twentieth-century political thought and need a single essay question on Simone Weil's case against political parties. It should not be answerable by paraphrasing her complaints about party discipline, loyalty, and the subordination of thought to a common line, so build it around a distinction the students will not have met: the corruption reading, on which parties damage political judgment through contingent pressures — careerism, electoral incentives, the need to present a unified front — leaving the damage real but in principle remediable; and the constitutive reading, on which the party form as such is incompatible with the kind of attention to truth that politics demands, so that no party could escape the indictment. The question should require students to say which reading Weil's own argument can sustain, to test the constitutive reading against at least one form of demanding collective loyalty that is not a party (a trade union, a religious order, a research school), and to specify what would have to be true of a party for her argument to fail. Closed book, 90 minutes. Give me the question, a model answer of about 700 words, and a marking scheme out of 20 built from five must-hit points, each with its marks and a one-line note on how candidates typically miss it; one of the five should require separating Weil's objection from the familiar charge that parties become oligarchic.
