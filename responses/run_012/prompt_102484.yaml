prompt: |-
  I report on science and ideas for a general-interest magazine, and I'm at work on a piece about the old puzzle of whether an all-powerful being could make a stone too heavy for itself to lift. Rather than begin from the puzzle, I went back to the text that the resolution people usually offer — that omnipotence does not extend to contradictions — is generally traced to: the third article of Question 25 in the First Part of Aquinas's Summa Theologica, on whether God is omnipotent. I can't get the passage to hold still, and I'd like help reading it. Two stretches are giving me trouble.

  The first is the opening of his answer:

  "All confess that God is omnipotent; but it seems difficult to explain in what His omnipotence precisely consists: for there may be doubt as to the precise meaning of the word 'all' when we say that God can do all things. If, however, we consider the matter aright, since power is said in reference to possible things, this phrase, 'God can do all things,' is rightly understood to mean that God can do all things that are possible; and for this reason He is said to be omnipotent. Now according to the Philosopher (Metaph. v, 17), a thing is said to be possible in two ways. First in relation to some power, thus whatever is subject to human power is said to be possible to man. Secondly absolutely, on account of the relation in which the very terms stand to each other. Now God cannot be said to be omnipotent through being able to do all things that are possible to created nature; for the divine power extends farther than that. If, however, we were to say that God is omnipotent because He can do all things that are possible to His power, there would be a vicious circle in explaining the nature of His power. For this would be saying nothing else but that God is omnipotent, because He can do all that He is able to do. It remains therefore, that God is called omnipotent because He can do all things that are possible absolutely; which is the second way of saying a thing is possible. For a thing is said to be possible or impossible absolutely, according to the relation in which the very terms stand to one another, possible if the predicate is not incompatible with the subject, as that Socrates sits; and absolutely impossible when the predicate is altogether incompatible with the subject, as, for instance, that a man is a donkey."

  And the second is the close of the same answer:

  "Now nothing is opposed to the idea of being except non-being. Therefore, that which implies being and non-being at the same time is repugnant to the idea of an absolutely possible thing, within the scope of the divine omnipotence. For such cannot come under the divine omnipotence, not because of any defect in the power of God, but because it has not the nature of a feasible or possible thing. Therefore, everything that does not imply a contradiction in terms, is numbered amongst those possible things, in respect of which God is called omnipotent: whereas whatever implies contradiction does not come within the scope of divine omnipotence, because it cannot have the aspect of possibility. Hence it is better to say that such things cannot be done, than that God cannot do them. Nor is this contrary to the word of the angel, saying: 'No word shall be impossible with God.' For whatever implies a contradiction cannot be a word, because no intellect can possibly conceive such a thing."

  What I want is a reading of this as a piece of argument rather than as a slogan. Take the two senses of "possible" and show me which one is doing the work and why the first is set aside; tell me what "possible absolutely" comes to, given that he cashes it out as a matter of whether the predicate is compatible with the subject; and then explain why he insists it is better to say that the contradictory "things" cannot be done than that God cannot do them. Is that last move a substantive claim about the extent of a power, or a redescription that relocates the problem — and if it is a redescription, does anything get lost in the relocation?

  Then three further questions, in descending order of how much they matter to me. He raises the charge of a vicious circle himself, in the middle of the first passage; does the route he takes out of it actually escape the circle, or only appear to? Second, the closing line — that a contradiction "cannot be a word" because no intellect can conceive it — seems to carry real weight; tell me what it commits him to, and how much of the answer would fall if it were false. A colleague who works on non-classical logics, in which some contradictions are held to be true, says that assumption is load-bearing; if she is right, what would have to change in the passage for it to survive? Third, a smaller thing that nags: in the same article he says that God cannot sin, and glosses this as a consequence of His omnipotence. Is that continuous with the argument above, or a separate move smuggled in under the same word?

  Please stay with the text. I don't want a survey of what later philosophers have said about omnipotence; I want a clear reconstruction of what this passage is doing and where its joints are.
