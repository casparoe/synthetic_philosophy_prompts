      *   **Specific Need:** A close reading of two specific passages (opening and closing of the *Respondeo*).
      *   **Goal:** Understand the *argument structure*, not just the slogan ("God can't do contradictions").
      *   **Key Questions to Answer:**
          1.  Analyze the two senses of "possible" and why one is rejected.
          2.  Explain "possible absolutely" (predicate/subject compatibility).
