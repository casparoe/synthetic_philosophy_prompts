prompt: |-
  I'm a graduate student in political theory, and I've spent the term circling a question I can't get a clean grip on: who counts as a member of the demos -- the people whose consent, votes, or claims are supposed to make a political decision legitimate. I keep noticing that every account I read is defended by appeal to a small handful of cases (long-settled residents without citizenship, a region voting to secede, people abroad who will be badly affected by a decision they cannot vote on, children, future generations, and so on), and each account seems engineered to get its favourite case right while quietly fudging the rest. Before I commit to any of them, I want the specification written out on its own, independent of the contenders: what must any adequate theory of the boundary of the demos actually deliver? I mean the phenomena it has to explain, the cases it must get right, the distinctions it cannot collapse -- between being subject to a decision and merely being affected by it, between standing to be counted and standing to contest, between membership in the demos and inclusion in some particular decision -- and the formal constraints it cannot violate, above all the one that a demos cannot simply vote itself its own boundary, since the vote already presupposes the very question at issue.

  For each requirement, give me the case or consideration that forces it, and mark which requirements are genuine and which look like the prejudices of a particular camp dressed up as constraints. If some subset of them is jointly unsatisfiable, say so plainly -- a list that turns out to be inconsistent is the most useful thing I could get back. Two extras I'd like folded in. First, my roommate keeps proposing that the right test is a kind of reciprocity: an arrangement is legitimate only if you would accept it with your position swapped for any other party's. I want to know whether that is a bona fide desideratum a theory must meet or just one more substantive view smuggled in as a constraint. Second, if you can manage it without sliding into a full scorecard, a sentence or two on which single requirement does the most work in eliminating the usual candidates.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Graduate student in political theory.
      *   **Topic:** The boundary problem of the demos (who constitutes "the people").
      *   **Problem:** Existing theories seem ad hoc, tailored to specific cases, and circular (the demos defines its own boundary).
      *   **Task:** Specify the requirements/constraints any adequate theory of the demos boundary *must* deliver, independent of specific contenders.
      *   **Specific Instructions:**
          *   List phenomena to explain, cases to get right, distinctions to maintain, formal constraints to satisfy.
          *   For each requirement, provide the forcing case/consideration.
          *   Distinguish between *genuine* constraints and *disguised substantive views* (prejudices).
          *   Identify if any subset is jointly unsatisfiable (inconsistency).
          *   Address the "reciprocity" test proposed by the roommate (bona fide desideratum or smuggled view?).
          *   Identify the single requirement that does the most work in eliminating usual candidates.
      *   **Tone:** Academic, rigorous, precise, avoiding fluff.

  2.  **Deconstruct the Boundary Problem:**
      *   The core issue is the "constitutive paradox" or the "boundary problem" (Whelan, Dahl, Whittier, etc.).
      *   Democratic principle: Rule by the people.
      *   Problem: Who are the people? If the people decide, they must exist *before* the decision.
      *   Common principles: All Affected Interests (AAI), All Subjected to Coercion (ASC), Stakeholder, Citizenship, etc.

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Requirement 1: Non-Circularity.* The demos cannot define itself.
          *   *Forcing Case:* A group voting to exclude others.
          *   *Status:* Genuine formal constraint.

      *   *Requirement 2: Distinction between Affected and Subjected.*
          *   *Forcing Case:* A factory polluting a neighboring country (affected) vs. citizens paying taxes (subjected). If AAI is too broad, everyone is in the demos. If ASC is too narrow, neighbors have no recourse.
          *   *Status:* Genuine conceptual distinction, but how it maps to membership is contested.

      *   *Requirement 3: Stability/Continuity.*
          *   *Forcing Case:* Future generations, children. The demos must persist over time to make binding decisions.
          *   *Status:* Genuine functional constraint.

      *   *Requirement 4: Agency/Competence.*
          *   *Forcing Case:* Children, cognitively disabled. Can they vote? If not, are they members?
          *   *Status:* Often a disguised substantive view (capacity vs. interest).

      *   *Requirement 5: Decisiveness.*
          *   *Forcing Case:* Secession. If the boundary shifts with every issue, there is no "people" to decide.
          *   *Status:* Genuine functional constraint.

      *   *Requirement 6: Reciprocity (Roommate's point).*
          *   *Analysis:* Is this a meta-constraint or a substantive theory (Rawlsian/Contractarian)? It sounds like a justification for *why* a boundary is fair, not how to draw it.
          *   *Status:* Smuggled substantive view.

  4.  **Refining and Categorizing (Genuine vs. Disguised):**
      *   *Genuine:* Non-circularity, Decisiveness (need a stable unit), Distinction (Affected vs. Subjected).
      *   *Disguised:* Moral equality (presupposes the answer), Reciprocity (justifies outcomes, doesn't draw lines), Capacity (excludes based on ability rather than status).

  5.  **Checking for Inconsistency (The "Jointly Unsatisfiable" Test):**
      *   *The Trilemma:* (1) Democratic legitimacy requires the boundary to be decided democratically. (2) The boundary cannot be decided democratically (circularity). (3) The boundary must be normatively justified.
      *   *Better Trilemma:* (1) All Affected Interests (AAI). (2) Decisiveness (stable demos). (3) Feasibility.
      *   *Whelan's Paradox:* To decide the boundary democratically, you need a demos. To have a demos, you need a boundary.
      *   *Key Inconsistency:* The demand for *issue-specific* boundaries (AAI) vs. the demand for a *constitutional* boundary (stable entity). You can't have a demos that changes membership with every ballot without destroying the agency of the demos.

  6.  **Addressing the Roommate's Reciprocity:**
      *   Reciprocity is a test for the *justice* of the arrangement, not the *composition* of the unit. It assumes the parties are already identified. Therefore, it cannot solve the boundary problem itself. It's a substantive moral principle, not a procedural constraint.

  7.  **Identifying the "Hardest" Requirement:**
      *   Which one kills the most theories?
      *   *Non-circularity* kills democratic self-determination of boundaries.
      *   *Decisiveness/Stability* kills the "All Affected Interests" principle (because interests shift per issue).
      *   *Winner:* The tension between **Decisiveness (Stability)** and **Comprehensive Inclusion (AAI)**. AAI makes the demos fluid; democracy requires a stable agent.

  8.  **Drafting the Response (incorporating constraints):**
      *   *Structure:* Introduction -> List of Requirements (Genuine vs. Disguised) -> The Inconsistency -> Reciprocity -> The "Killer" Constraint.
      *   *Tone Check:* Ensure it sounds like peer-to-peer academic discourse. Avoid undergrad explanations. Use terms like "constitutive paradox," "all-affected principle," "diachronic stability."

  9.  **Self-Correction/Refinement during drafting:**
      *   *Correction:* Make sure to explicitly mark "Genuine" vs. "Disguised" for each point as requested.
      *   *Correction:* Ensure the distinction between "subject to coercion" and "affected" is clear.
      *   *Correction:* On the inconsistency: Be precise. It's not just that it's hard, it's that satisfying one violates another. The "Boundary Problem" is logically prior to democratic procedure.
      *   *Refinement on Reciprocity:* It's a *justificatory* constraint, not a *constitutive* one. It tells you if the boundary is fair, not where it is.

  10. **Final Polish:** Check against the prompt's specific requests (case/consideration for each, mark genuine/disguised, inconsistency check, reciprocity, single requirement).

      *(Self-Correction on the "Single Requirement"):* Is it Non-circularity or Stability? Non-circularity is the logical precondition. Stability is the functional precondition. Non-circularity is the deeper theoretical block. However, Stability is what kills the "All Affected" principle most visibly. I will argue that **Diachronic Stability** is the practical killer, but **Non-Circularity** is the logical killer. The prompt asks for the one that does the *most work* in eliminating candidates. Most candidates (AAI, ASC) fail on Stability/Decisiveness. Non-circularity is usually acknowledged but bypassed. I'll focus on the **Stability/Decisiveness** constraint as the practical eliminator, grounded in the **Non-Circularity** logical constraint. Actually, let's look at Whelan. Whelan argues the boundary cannot be decided democratically. So Non-Circularity is the big one. But AAI is the most popular theory. AAI fails on Stability. I will select **Diachronic Stability (The Constitutional Constraint)** because it forces a choice between a fluid demos (AAI) and a functioning state.

      *Wait, let's reconsider.* The prompt asks for the requirement that eliminates the *usual candidates*.
      *   Citizenship theories: Fail Non-circularity (why citizenship?).
      *   AAI: Fails Stability/Decisiveness.
      *   ASC: Fails the "Affected" intuition (neighbors).
      *   The requirement that creates the *aporia* is Non-Circularity. But the requirement that makes AAI untenable is Stability.
      *   Decision: I will identify **The Constraint of Diachronic Agency (Stability)** as the one that does the most work, because it forces the rejection of the most intuitively attractive principle (AAI) which dominates the literature.

      *Wait, one more check on Inconsistency.* Is there a set that is *jointly unsatisfiable*? Yes.
      1. The boundary must be determined democratically.
      2. The boundary must be determined prior to democracy.
      3. There is no external normative standard.
      *   Actually, a better inconsistency is between **Universal Inclusion of Affected Interests** and **Decisional Capacity**. If everyone affected is in, the demos is too large/flux to decide.
      *   Let's frame it as: **Fluidity (AAI) vs. Agency (Stability).**

      *Let's finalize the Reciprocity point.* It is a substantive view. It presupposes the parties.

      *Let's finalize the Genuine/Disguised.*
      *   Genuine: Non-circularity, Stability, Coercion/Effect Distinction.
      *   Disguised: Moral Equality (as a boundary tool), Reciprocity, Capacity.

      *Okay, ready to write.*
answer: |-
  Here is a specification of the constraints on the boundary of the *demos*, distinguished by their logical status, followed by the inconsistency diagnosis and the evaluation of your roommate's proposal.

  ### I. The Constraints

  **1. The Constraint of Logical Priority (Non-Circularity)**
  *   **Requirement:** The rule determining membership in the *demos* must be logically prior to the democratic procedure itself. The *demos* cannot vote on who constitutes the *demos*.
  *   **Forcing Case:** A settled population votes to disenfranchise a resident minority. If the boundary is subject to the vote, the majority can rig the electorate to guarantee the outcome, rendering the concept of "consent" vacuous.
  *   **Status:** **Genuine Formal Constraint.** Without this, democratic legitimacy is tautological.

  **2. The Constraint of Diachronic Stability (Agency)**
  *   **Requirement:** The *demos* must persist as an identifiable agent over time sufficient to make binding decisions and bear responsibility for them. Membership cannot fluctuate with every distinct policy issue.
  *   **Forcing Case:** Climate change legislation. If the *demos* is defined by the "All Affected Interests" principle (AAI), the electorate for a carbon tax includes future generations and foreign nationals, while the electorate for zoning laws does not. If the *demos* changes composition per ballot, there is no continuous "people" to authorize the constitution or hold representatives accountable between issues.
  *   **Status:** **Genuine Functional Constraint.** Democracy requires an agent capable of willing; a fluid aggregate cannot will.

  **3. The Constraint of Distinctiveness (Subjected vs. Affected)**
  *   **Requirement:** The theory must provide a principled criterion to distinguish between those merely *causally affected* by a decision and those *subject to the coercive authority* of the decision.
  *   **Forcing Case:** Cross-border pollution. A factory in Country A pollutes Country B. Residents of B are heavily affected but not subject to A's legal coercive apparatus (they cannot be arrested by A's police). If "affectedness" grants membership, Country A's *demos* expands indefinitely to include the globe. If "subjection" grants membership, Country B has no recourse. A theory must explain why one triggers membership and the other does not, or admit they trigger different kinds of claims.
  *   **Status:** **Genuine Conceptual Constraint.** Collapsing this distinction renders the *demos* coextensive with humanity (making the concept useless) or arbitrarily exclusionary.

  **4. The Constraint of Competence (Capacity)**
  *   **Requirement:** Members of the *demos* must possess the cognitive capacity to form and express political judgments.
  *   **Forcing Case:** Infants and the severely cognitively disabled.
  *   **Status:** **Disguised Substantive View.** This is often presented as a functional necessity, but it is a normative choice to equate *membership* with *voting capacity*. One can be a member of the *demos* (having one's interests represented) without holding the ballot. Treating this as a hard constraint prejudices the theory toward a specific view of participation (voting) rather than standing.

  **5. The Constraint of Moral Equality**
  *   **Requirement:** The boundary must not arbitrarily privilege one group's interests over another's; all relevant moral equals must be included.
  *   **Forcing Case:** Colonial subjects governed by a metropole without representation.
  *   **Status:** **Disguised Substantive View.** While moral equality is a normative goal, it cannot *draw* the boundary. It tells you that once you have a criterion (e.g., coercion), you must apply it equally. It does not tell you whether the criterion should be coercion, affectedness, or citizenship. Using it as a boundary constraint smuggles in a specific egalitarian outcome as a procedural rule.

  ### II. The Inconsistency

  There is a subset of requirements that is **jointly unsatisfiable**. You cannot simultaneously satisfy the following three:

  1.  **The Democratic Principle:** The boundary of the *demos* must be determined democratically (by the will of the people).
  2.  **The Non-Circularity Constraint:** The boundary must be determined prior to the democratic procedure.
  3.  **The Normative Autonomy Constraint:** There is no external, pre-political moral standard (e.g., natural law, human rights) that can fix the boundary without democratic endorsement.

  **Diagnosis:** This is the classic "Boundary Problem" paradox (Whelan, Dahl). If you hold (1) and (3), you violate (2) (circularity). If you hold (2) and (3), you violate (1) (the boundary is undemocratic). If you hold (1) and (2), you violate (3) (you must appeal to an external normative standard to set the initial boundary).

  **Verdict:** Any adequate theory must abandon one. Most liberal theories abandon (1) for the initial constitution (the boundary is set constitutionally, not democratically). Most radical democratic theories abandon (3) (appealing to pre-political rights). Theories that try to keep all three are incoherent.

  ### III. The Reciprocity Test (Roommate's Proposal)

  **Verdict:** **Disguised Substantive View.**

  **Reasoning:** Reciprocity ("would you accept this arrangement if you swapped positions?") is a test for the *legitimacy of the outcome* or the *justice of the rules*, not a tool for *constituting the unit*. To apply the reciprocity test, you must already know *who* is swapping positions with *whom*. It presupposes the identification of the parties. Therefore, it cannot solve the boundary problem because it requires the boundary to be drawn before the test can be run. It is a moral desideratum for the *content* of politics, not a formal constraint on the *container* of politics.

  ### IV. The Single Most Eliminating Requirement

  The requirement that does the most work in eliminating the usual candidates is **The Constraint of Diachronic Stability (Agency)**.

  **Why:** It eliminates the **All Affected Interests (AAI)** principle, which is the dominant intuitive competitor in the literature. AAI is morally attractive but functionally catastrophic. Because causal effects ripple infinitely and shift with every policy issue, AAI prevents the *demos* from existing as a stable agent over time. If the electorate for the war vote is different than the electorate for the tax vote, there is no "people" to authorize the state itself. This constraint forces the rejection of AAI in favor of something more rigid (like All Subjected to Coercion or Citizenship), even though those alternatives fail other moral intuitions. It is the pivot point where moral inclusiveness breaks against political feasibility.
