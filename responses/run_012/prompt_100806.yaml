answer: |-
  # Q&A PREP SHEET: Nozick, Pettit, and the Historical/Patterned Distinction
  **Session:** Political Theory Reading Group
  **Date:** Next Thursday
  **Core Claim:** Entitlement Theory runs on Historical vs. Patterned, not Liberty. Wilt Chamberlain shows patterns require continuous interference. Solution: Drop Lockean Proviso, add Republican Non-Domination.

  ---

  ### 1. The Economist (Opens the floor, impatient)
  **The Objection:**
  "Look, in a dynamic market, every historical distribution *becomes* a pattern instantly. Prices adjust, endowments shift. If you're regulating 'ongoing market relations,' you're regulating outcomes. Calling it 'historical' is just semantic cover for taxing transfers. It's a distinction without a difference."

  **Damage Assessment:** **Low/Medium.** Philosophically shallow, but sets a pragmatic tone that can derail the normative argument if you get bogged down in market mechanics.
  **Two-Minute Reply:**
  "I'm not making a claim about market equilibrium; I'm making a claim about *justification for interference*. For Nozick, interference is only justified if the *genesis* of the holding was flawed. For me, interference is justified if the *relationship* the holding sustains is one of mastery and servitude. An economist sees a price; a republican sees a power relation. I'm not regulating the outcome of the transfer; I'm regulating the capacity for arbitrary interference that the transfer solidifies."
  **Soft Spot:**
  You are admitting that the *effect* looks like redistribution. If the economist presses on "how do you measure domination without looking at wealth distribution?", you're in trouble.
  **Concession Flag:**
  **Concede:** "I grant that in practice, remedying domination often looks like redistributing resources. But the *trigger* for the remedy is relational status, not the resource snapshot itself."

  ---

  ### 2. The Analytical Marxists (G.A. Cohen veterans, immediate follow-up)
  **The Objection:**
  "Cohen demolished this in 'Self-Ownership, World Ownership, and Equality.' You say Wilt Chamberlain works only if patterns require interference. Cohen showed liberty *itself* upsets patterns. By swapping the Proviso for Non-Domination, you haven't escaped the patterned trap. You've just defined 'domination' as 'having too much money relative to others.' That's an end-state principle. Wilt still knocks it down: if I voluntarily pay Wilt, and that creates domination, do you ban the transfer? If yes, you violate liberty. If no, you abandon non-domination."

  **Damage Assessment:** **High.** This targets the coherence of your Wilt interpretation. If Non-Domination acts as a constraint on voluntary transfer, it functions exactly like a patterned principle.
  **Two-Minute Reply:**
  "Cohen treats liberty as formal freedom to act. Pettit treats freedom as security against arbitrary power. When I pay Wilt, I exercise formal liberty. But if Wilt's accumulation gives him the *capacity to interfere arbitrarily* in my life (or the state's life) without check, that's domination. I'm not banning the transfer because it upsets a distributional pattern; I'm regulating the *power structure* the transfer creates. It's not about the money Wilt has; it's about the leverage he gains."
  **Soft Spot:**
  Defining "leverage" without referencing resource inequality is notoriously difficult. If you say "wealth = leverage," you're back to a pattern.
  **Concession Flag:**
  **Concede:** "I need to be clearer that not all inequality constitutes domination. I'm not proposing an equality constraint, but a threshold of independence."

  ---

  ### 3. The Rawlsian (Difference Principle/Public Reason specialist)
  **The Objection:**
  "This feels like you're trying to get redistributive results without doing the hard work of the Basic Structure. Non-domination sounds like a moralized constraint. How do you cash this out in public reason? If I'm a holder of historical entitlement, and you interfere citing 'domination,' on what grounds do you justify that to me? The Difference Principle gives a public standard of reciprocity. Your 'non-domination' looks like a comprehensive doctrine smuggled into the basic structure."

  **Damage Assessment:** **Medium.** They won't attack the logic, but they will attack the *stability* and *public justifiability* of your hybrid.
  **Two-Minute Reply:**
  "Actually, non-domination is *more* publicly justifiable than the Difference Principle in this context. You don't need to agree on a specific distribution of goods to agree that no citizen should be master of another. It's a precondition for public reason itself. You can't engage in reciprocal justification if you're under a thumb. So this isn't smuggling a pattern in; it's securing the status required for Rawlsian dialogue to happen."
  **Soft Spot:**
  Rawlsians prioritize the "Basic Structure." If your theory requires constant, case-by-case adjudication of market relations (to check for domination), it might look too intrusive for a liberal framework.
  **Concession Flag:**
  **Concede:** "I haven't fully worked out the institutional design for tracking domination without excessive state intrusion. That's the next step."

  ---

  ### 4. The Republican (Friendly but suspicious)
  **The Objection:**
  "I like the Pettit bolt-on, but I'm worried you've broken the engine. Nozick's historical entitlement is supposed to give me certainty about my property. If my title is always provisional on whether my holdings constitute domination tomorrow, I don't have entitlement; I have a lease from the state. You say you're keeping the historical sense, but if history can be overridden by current relational status, isn't history irrelevant?"

  **Damage Assessment:** **High.** This is the internal coherence check. If history doesn't constrain the non-domination check, it's just standard liberalism. If it does, domination might go unchecked.
  **Two-Minute Reply:**
  "History still matters for *acquisition*. I'm not saying we re-scan all history every day. I'm saying historical title grants you a presumption of legitimacy. Non-domination is a *defeater* condition, not a re-evaluation of the past. It's like the Lockean Proviso but relational. You own it because you made/bought it, *unless* that ownership makes you a master. It preserves the historical narrative but adds a safety valve."
  **Soft Spot:**
  The "Safety Valve" analogy admits that the historical principle is not absolute. If the valve opens too often, the historical principle is toothless.
  **Concession Flag:**
  **Concede:** "Yes, this makes property rights less absolute than Nozick intended. I'm arguing that absolute property rights are incompatible with a republic."

  ---

  ### 5. THE ONE QUESTION I HOPE NOBODY ASKS
  **The Question:**
  "If Non-Domination is a defeater condition for Historical Entitlement, what is the *remedy*? If I hold my factory legitimately (history) but the labor market makes my workers dominated (status), do you take the factory? If you take the factory, you've violated historical entitlement. If you don't, you've abandoned non-domination. How do you fix the domination without redistributing the title?"

  **Why it's fatal:**
  It forces you to choose between the two halves of your thesis.
  *   If you redistribute the title, you admit the Historical principle is subordinate to a Patterned/End-State concern (validating the Marxist/Republican critique).
  *   If you regulate the *use* of the factory without touching the title, you sound like you're proposing heavy-handed regulation that Nozick would call a violation of self-ownership anyway (validating the Nozickian critique).
  *   It exposes that "Nozick minus Proviso plus Pettit" might just be "Rawls with extra steps."

  **Prepared Defense (If asked):**
  "The remedy isn't necessarily expropriation. It's structural regulation of the *relationship* within the holding. Codetermination, union rights, exit options. We alter the *powers* attached to the title, not the title itself. This keeps the historical assignment of the asset but strips it of the dominative powers."
  *(Note: This is weak. If they press that "stripping powers" reduces the value of the entitlement to zero, you should probably concede that this requires a more robust theory of 'bundle of rights' than Nozick allows.)*

  ---

  ### GENERAL STRATEGY NOTES
  *   **Don't defend Nozick's Liberty Premise:** You've already flagged it as the wrong engine. If they drag you back to "But Nozick says liberty is paramount," correct them: "Nozick *says* that, but his argument *works* via the historical/patterned distinction. I'm fixing the distinction."
  *   **Watch the "Pattern" Word:** The Marxists and Republicans will try to label Non-Domination as a "Patterned Principle." Insist it is a **Relational Condition**. Patterns are about *distribution of stuff*; Relations are about *capacity to interfere*. Keep that distinction sharp.
  *   **Lockean Proviso:** You said you want to drop it. Be careful. If you drop it entirely, you have no account of original acquisition.
      *   *Pivot:* "I'm not dropping the *function* of the Proviso (limiting acquisition), I'm replacing its *content* (enough-and-as-good) with Non-Domination."

  ### CONCEDER EARLY TO SAVE TIME
  *   **Concede:** You do not have a full metric for measuring "domination" in complex markets.
  *   **Concede:** This view is less "libertarian" than Nozick. You are accepting more state interference.
  *   **Do Not Concede:** That Non-Domination is the same as the Difference Principle. (Keep the relational/distributive distinction hard).
