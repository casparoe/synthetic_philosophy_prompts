answer: |-
  This is a strategic allocation problem for a specialized theoretical team. You have the luxury of depth but the constraint of no empirical feedback loops. The goal is to maximize leverage on the foundational literature.

  Your candidate list is sound; it covers the metaphysical, structural, and normative dimensions of the problem. I will not reframe the list, but I will sharpen the questions to ensure they are actionable research projects rather than endless conceptual loops.

  Here is the ranked agenda, defended by **Upstreamness** (does this settle downstream debates?), **Tractability** (can pure philosophy deliver in 3 years?), and **Liveness** (is this a real dispute or a verbal one?).

  ### 1. The Unit of Assessment: Single Choices vs. Plans/Lives
  **Rank:** 1
  **Defense:** This is the most upstream structural question. Money pump arguments are inherently dynamic; they rely on a sequence of choices leading to a dominated outcome. If the primary unit of rational assessment is not the atomic choice but the *plan* (or the life trajectory), the force of the pump changes radically. A resolute agent who treats a sequence as a single unit cannot be pumped in the standard way. If this question settles in favor of "Plans," the standard coherence arguments require total reconstruction. If it settles in favor of "Choices," the standard arguments stand but require defense against the charge of myopia.
  *   **Upstreamness:** High. Determines whether dynamic inconsistency is a vice or a feature of temporally extended agency.
  *   **Tractability:** High. Requires formal modeling of planning agents and conceptual analysis of "resolute choice," well within armchair reach.
  *   **Liveness:** Very Live. The tension between sophisticated choice and resolute choice is unresolved.

  *   **The Crux:** Is dynamic inconsistency a failure of rationality, or is it the rational updating of a plan in light of new temporal perspectives?
  *   **3-Year Deliverable:** A formal model of a "planning agent" that specifies exactly where the normative constraint binds (at the adoption of the plan or at each node). The team should produce a proof showing whether a resolute planner is immune to standard money pumps without invoking ad-hoc pre-commitment technologies.
  *   **Move Up:** If you demonstrate that a coherent theory of planning *dissolves* the money pump intuition entirely.
  *   **Move Down:** If you show that planning merely pushes the incoherence back to the plan-formation stage (i.e., you can still pump the plan selection).

  ### 2. The Target: Preferences vs. Dispositions to Choose
  **Rank:** 2
  **Defense:** This is metaphysical upstreamness. Coherence arguments are often presented as constraints on preferences (mental states), but the pumps operate on choices (behavior). If preferences are merely theoretical constructs summarizing dispositions, the charge of "irrationality" shifts from holding contradictory beliefs/desires to having a malfunctioning choice function. If the target is dispositions, the "preferences" being pumped might not exist at the time of choice. This dictates how we interpret the *object* of the norm.
  *   **Upstreamness:** High. Determines whether the violation is a cognitive error or a functional failure.
  *   **Tractability:** Medium-High. Purely conceptual and logical analysis.
  *   **Liveness:** Live. The "revealed preference" vs. "mental state" debate persists without resolution.

  *   **The Crux:** Does the coherence norm evaluate the static consistency of mental states, or the dynamic stability of a choice function across counterfactual scenarios?
  *   **3-Year Deliverable:** A taxonomy of "targets of rationality." The group should produce a set of necessary and sufficient conditions for a disposition to count as "rational" independent of whether it maps to a transitive preference relation.
  *   **Move Up:** If you prove that preferences are ontologically redundant and only dispositions exist.
  *   **Move Down:** If the distinction proves normatively inert (i.e., the same constraints apply to both regardless of ontology).

  ### 3. The Scope: Completeness vs. Partiality
  **Rank:** 3
  **Defense:** This is the most common formal objection to EU theory. Standard coherence arguments presuppose that an agent must prefer A to B, B to A, or be indifferent. If an agent can rationally have no preference (a gap), the pump may not get started. Resolving this determines the *domain* of the theory. It is ranked third because it depends on knowing the Unit of Assessment (Rank 1) and the Target (Rank 2) first; you need to know *what* is being assessed before you decide if it *must* be complete.
  *   **Upstreamness:** Medium-High. Determines the applicability of EU to "hard choices."
  *   **Tractability:** Medium. Requires formal work on partial orderings and their coherence conditions.
  *   **Liveness:** Live. Many argue incompleteness is the norm, not the exception.

  *   **The Crux:** Is incompleteness a distinct normative state, or merely epistemic uncertainty about one's own preferences?
  *   **3-Year Deliverable:** A "Partial Coherence" framework. Either a proof that coherence arguments fail without completeness, or a modified set of coherence constraints that accommodate partial orderings without collapsing into indeterminacy.
  *   **Move Up:** If you successfully derive a robust "Partial EU" theory that avoids the standard objections.
  *   **Move Down:** If incompleteness is shown to be reducible to probabilistic uncertainty (which is already covered by standard theory).

  ### 4. The Grounds: Pragmatic vs. Epistemic Vindication
  **Rank:** 4
  **Defense:** This concerns the *source* of the norm's force. Pragmatic arguments say you lose money/utility; epistemic arguments say you are representationally inaccurate. While crucial for the "why care?" question, it is downstream of the structural questions. If the structure of the argument fails (Ranks 1-3), the justification doesn't matter. However, if the structure holds, knowing *why* it binds is the next critical step.
  *   **Upstreamness:** Medium. Connects decision theory to epistemology.
  *   **Tractability:** High. Purely normative/conceptual.
  *   **Liveness:** Live. The "Accuracy First" program is currently challenging pragmatic dominance.

  *   **The Crux:** Is the badness of incoherence in the consequence (loss) or the state (inconsistency)?
  *   **3-Year Deliverable:** A comparative analysis showing whether pragmatic and epistemic arguments converge on the same axioms. If they diverge, a defense of which one is fundamental.
  *   **Move Up:** If you demonstrate a case where pragmatic and epistemic norms diverge (one permits what the other forbids).
  *   **Move Down:** If they are proven to be isomorphic (making the distinction merely rhetorical).

  ### 5. The Agents: Idealizations (Costs, Computation, Self-Ignorance)
  **Rank:** 5
  **Defense:** This is about applicability, not foundation. For a group focused on *foundations*, this is the least upstream. If the ideal theory is wrong, fixing the idealizations is useless. Furthermore, without empirical collaborators, a pure philosophy group risks hand-waving about "bounded rationality" without the tools to model costs rigorously. It is included because "ought implies can" is a live normative constraint, but it is last because it presupposes we know what the "ought" is.
  *   **Upstreamness:** Low. Applies the theory rather than building it.
  *   **Tractability:** Low-Medium. Hard to model "cost of deliberation" without empirical parameters.
  *   **Liveness:** Live, but often devolves into "performance error" vs. "competence" disputes.

  *   **The Crux:** Does the coherence norm apply to agents who cannot compute the coherence check?
  *   **3-Year Deliverable:** A taxonomy of "feasible idealizations." A clear statement of which idealizations are constitutive of rationality and which are merely simplifying assumptions for modeling.
  *   **Move Up:** If you find a way to internalize computational costs into the coherence constraints themselves.
  *   **Move Down:** If the project drifts into cognitive science or psychology (violating your constraints).

  ***

  ### Two Overrated Questions

  **1. "Is the Money Pump Argument Circular?"**
  The field has spent decades debating whether the money pump presupposes the very rationality it seeks to prove. This has diminishing returns. It is largely a verbal dispute about what counts as a "premise." Whether it is circular or not, the *intuition* that being pumped is bad remains the driving force. Your group should treat the intuition as the datum to be explained, not waste time validating the logical form of the explanation. Focus on *why* the intuition holds (Rank 1 & 2), not whether the argument is formally valid in a vacuum.

  **2. "Does Coherence Imply Maximization?"**
  This is a category error in the context of foundations. Coherence arguments establish *consistency* constraints (transitivity, independence), not *optimization* requirements. An agent can be perfectly coherent and satisfice, or be coherent and pursue a non-maximizing goal. Debating whether EU requires maximization distracts from the prior question of whether EU is the correct coherence standard at all. It conflates the structure of rationality with the content of the good. Your group should bracket maximization and focus entirely on consistency.

  ### Strategic Summary
  Your comparative advantage is time and theoretical depth. Do not try to solve the "applicability" problem (Rank 5) at the expense of the "structural" problem (Rank 1). If you can show that the Unit of Assessment is the Plan, not the Choice, you will have done more for the field in three years than decades of tweaking axioms. Prioritize the architecture of the agent over the justification of the norm.
