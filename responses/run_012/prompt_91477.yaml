  I'm moderating a panel next month with an AI-safety researcher who defends a heterodox position: most cases usually called goal misgeneralization are not inner-alignment failures at all but reference failures. On her view, the mesa-optimizer has learned a coherent objective relative to its own ontology; the error lies in a type mismatch between the base objective's implicit type signature and the mesa-objective's, so the standard framing mislocates the failure inside the agent. Draft eight to ten interview questions that force her to develop this position rather than restate it; no warm-up or biographical questions. I need at least one question each on how her diagnosis differs from ordinary reward misspecification, on whether it leaves anything distinct for inner alignment to explain, on what it implies for deceptive alignment, and on what empirical evidence would distinguish it from the standard mesa-optimization story. For each of those, include a follow-up keyed to the answer she is most likely to give. Keep the questions conceptual—no citations, no reading lists, and no questions that depend on specific papers neither of you could consult during the panel.
