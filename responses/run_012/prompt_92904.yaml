      *   *Universal:* Substantive (Milgram/Zimbardo later tested this).
      *   *Cognitive:* Substantive (This is Arendt's core philosophical point).
      *   *Nature of Evil:* Substantive/Deep (metaphysical claim).
      *   *Responsibility:* **Crucial.** This is the one that counters "just following orders." It says "following orders" *is* the problem, not the excuse.

  5.  **Address the Specific Slack Context:**
