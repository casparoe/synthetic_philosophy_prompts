prompt: |-
  Ok this is gonna sound random but I need help with something. A coworker of mine keeps dropping "the banality of evil" in our work Slack, and I genuinely cant tell what he means by it. The most recent time was in a thread about a feature our team shipped that ended up getting used by some pretty gross customers, and when someone defended us by saying everyone was just doing their jobs and following the roadmap, he replied that this is literally the banality of evil. Now I dont know if he's saying we're monsters, or that we're all innocent cogs, or that the situation is way worse than I think. I know the phrase is from Hannah Arendt writing about the Eichmann trial (I think it's the subtitle of her book?) but I never studied any of this, I'm a backend guy.

  What I want is for you to lay out the different precise things "the banality of evil" could actually be claiming, because it feels like people mean totally different stuff by it. Like, is it a claim about Eichmann's personality (that he was a boring mediocre nobody rather than some demonic mastermind)? A claim about the deeds being administrative and desk-bound? A claim that any ordinary person could do this given the right setup? Something about thoughtlessness or not thinking for yourself? A claim about evil itself being shallow rather than deep? Something about bureaucratic language and euphemism doing the moral work? Or maybe a claim about who's actually responsible when a system does harm?

  For each reading, tell me whether it's basically trivial/obvious, or a real substantive claim I'd have to argue for, or actually just false or misleading. And then tell me which reading he must be leaning on if he's using it to push back on the "we were just doing our jobs" defense — because alot of these readings sound like they'd be an excuse rather than an accusation, and I'm pretty sure he meant it as the opposite. Lay it out as a menu I can take back to him so I can actually pin down which one he's claiming.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
