      *   *Reasoning:* The scribes are screaming "He did not speak freely" without changing the word "Freely."
      *   *Habits Challenge:* Habit 1 (Embarrassment): The text admits Alaric was angry. Successor wants to look legitimate. Why admit anger? To show he forgave the anger. So the anger is likely true.
      *   *Habit 2 (Silence):* Text doesn't mention the army. Miriam usually ignores silence. But if the scribes are highlighting the text visually, maybe the silence is the point.
      *   *Final Verdict:* She can't prove coercion, but the scribal treatment suggests contemporary readers knew it was coercion. The text is a lie, but the *book* tells the truth.

  7.  **Drafting - Focus on Tone:**
