      *   *The Turn:* Miriam realizes the sickness was exaggerated to justify the succession, and the silence on soldiers is because their presence was the *context* everyone knew, making the "granting" a formality under threat. The scribes signal this by crowding the text where the soldiers would have stood.
      *   *Actually, let's make it more subtle.* The text is fixed. The scribes copy it.
