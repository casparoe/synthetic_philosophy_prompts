answer: |-
  - **What I heard and what it was doing here**
  You heard your prof invoke Rawls to block a straightforward cost-benefit analysis, implying that summing utilities across different people is morally distinct from summing them within one life. She used the slogan to assert that your calculation illegitimately treats the harmed minority as mere vessels for the majority's gain, rather than as separate agents with inviolable boundaries.

  - **The menu**
  1. **Ontological Denial:** Utilitarianism claims persons are not metaphysically distinct entities. (False)
  2. **Equal Consideration:** Utilitarianism counts every person's utility as exactly one unit, no more or less. (Trivial Platitude)
  3. **Distributional Blindness:** Utilitarianism cares only about the total sum of good, ignoring who gets what. (Defensible)
  4. **Prudential Analogy:** Utilitarianism treats trade-offs between persons like trade-offs within one person's life over time. (Defensible / Rawls's Core Claim)
  5. **TA's Test:** Social choice under utilitarianism is structurally identical to individual prudential rationality. (Defensible / Restatement of #4)
  6. **Sacrifice Permission:** Utilitarianism allows imposing severe losses on some without consent for minor gains to others. (Defensible / Strong Critique)
  7. **Compensation Ignorance:** Utilitarianism does not require that those who lose out be compensated by those who gain. (Defensible)
  8. **Semantic Emptiness:** Every moral theory distinguishes persons ontologically, so the slogan critiques nothing. (False / Misses the Normative Point)

  - **Which one she was using**
  She was using **#4 (Prudential Analogy)** to justify **#6 (Sacrifice Permission)**. Rawls's specific argument is that utilitarianism extends the principle of rational choice for one man (balancing present pain for future gain) to society (balancing one person's pain for another's gain). This supports her verdict on your program because the screening imposes invasive bodily harms on identifiable individuals who cannot consent to the trade-off, whereas an individual can consent to their own future suffering. The slogan isn't empty here; it flags that interpersonal aggregation requires stricter justification than intrapersonal balancing.

  - **What I should say**
  "I think I see the distinction now: you're saying utilitarianism treats trade-offs between people like trade-offs within one life, ignoring that I can consent to my own future pain but not someone else's. In the screening case, does that mean we need a strict constraint against imposing invasive harms on identifiable people, even for aggregate gain? Or does it just mean we need to weight their losses more heavily than the diffuse benefits to satisfy the separateness condition?"
