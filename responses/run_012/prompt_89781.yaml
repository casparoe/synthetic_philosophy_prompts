prompt: |-
  Ok so I'm in a third-year ethics course and my prof (I'm pretty sure the line is Rawls's) keeps saying that utilitarianism doesn't take seriously the distinction between persons, and last week she used it to shut down something I'd said. The case was a public-health thing: a screening program that would cost a small, identifiable group of people a lot (invasive follow-ups, some of them actually harmed) in exchange for a tiny mortality reduction spread across alot of people. I said the numbers looked like they favoured it, and she said that's exactly the kind of reasoning you get when you don't take the separateness of persons seriously. I don't think she's wrong exactly, but I can't tell what she's actually claiming — the sentence sounds deep and I suspect it's doing at least three different jobs at once. Also my TA proposed a test I can't stop thinking about: if a view can be redescribed as one single person maximizing over their own future, does it fail the test? And a guy in my seminar says the slogan is empty, because every view that talks about persons at all 'distinguishes between persons' somehow.

  Can you lay out the precise claims the slogan could be making, from the trivial to the radical, and tell me for each whether it's a platitude, a real and defensible thesis, or just false? Then say which reading was actually doing the work in the exchange with my prof, and whether that reading really gets her her conclusion about my screening program. Please give it to me as:

  - What I heard and what it was doing here — 2-3 sentences, just so I know you've got the target right
  - The menu — the readings, each with a one-line statement of the precise claim plus a rough label (trivial / defensible / false), aim for 6-8 of them, this should be most of the answer
  - Which one she was using — short; which reading(s) fit what she did with it, and whether it actually supports her verdict on my program
  - What I should say — 3-4 sentences I could actually use in seminar

  Please don't just tell me utilitarianism aggregates and that's the problem — I need the different versions of that, since I'm fairly sure they come apart.
