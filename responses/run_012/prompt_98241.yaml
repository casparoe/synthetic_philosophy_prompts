answer: |-
  **PREPARATION SHEET: Q&A STRATEGY**
  **To:** Retired Field Ecologist
  **From:** Research Assistant
  **Re:** Seminar Defense – "The Deflationary View of the Replication Crisis"

  **Context:** You are positioning yourself as the experienced practitioner cutting through the theoretical noise. Your authority comes from 35 years of mud-on-the-boots ecology, not from theorem-proving. Lean into that. You are describing *behavior*, not deriving *properties*.

  ### I. Strategic Concessions (Say these early)
  Before the Q&A heats up, or in your closing remarks, concede the following to disarm the experts:
  1.  **Mathematical Rigor:** Admit you are not deriving new theorems. You are offering a phenomenological account of how statistics are *used*, not how they are *derived*.
  2.  **Pre-registration:** Concede that pre-registration is a net positive for frequentist error control. Your argument is not that it is useless, but that it is insufficient to cure the "garden of forking paths" in *either* paradigm.
  3.  **Bad Practice vs. Method:** Acknowledge that "bad Bayesianism" is not inherent to Bayes, just as p-hacking is not inherent to Frequentism. Your claim is that the *social incentives* make bad Bayesianism just as easy as bad Frequentism.

  ### II. The Linchpin Reply
  **The single reply that must land for the talk to survive:**
  When asked, "So what is the solution if both frameworks are vulnerable?" you must answer: **"The solution is not a new formula; it is a change in the incentive structure regarding what counts as a publication."**
  *Why:* If you imply there is a statistical fix, the statisticians will dismantle you. If you argue the problem is sociological (rewarding novelty over robustness), you move the debate to ground where your 35 years of experience outweighs their derivations.

  ### III. The Objections (Ordered by Likelihood × Damage)

  #### 1. The "Straw Man" Objection (Committed Bayesian)
  **The Objection:** "You're describing practitioners who misuse Bayesian tools, not the tools themselves. If I specify my prior *before* seeing the data and report the full posterior distribution rather than cherry-picking a Bayes factor, the optional stopping theorem holds. The coherence of Bayesian updating protects me from the 'garden of forking paths' in a way p-values simply cannot. Aren't you attacking a caricature of subjective Bayesianism?"

  **Your Reply (2 mins):**
  "I appreciate the distinction, and theoretically, you're right. If the prior is fixed and the model is complete, the math is coherent. But my claim is about the *ecology of science*, not the ecology of mathematics. In thirty-five years, I've seen how models are built. A 'fixed prior' is often a 'convenience prior' chosen because it's conjugate or vague, not because it represents genuine prior knowledge. And 'reporting the full posterior' is rare; we report the interval that tells the story.
  The vulnerability isn't in the theorem; it's in the model specification. I can tweak a hierarchical structure or change a hyperparameter until the Bayes factor crosses 10, just as easily as I can drop a covariate until p < 0.05. The 'coherence' you mention assumes I'm being honest about my degree of belief. But if my career depends on a result, my 'belief' becomes malleable. The math is safe, but the mathematician is human."

  **Soft Spot:** You are conflating *theoretical* robustness with *practical* implementation. They can argue that a truly principled Bayesian *wouldn't* do what you describe. You have to hold the line that "principled" is rare in high-pressure environments.

  #### 2. The "Error Control" Objection (Neyman-Pearson Frequentist)
  **The Objection:** "You're dismissing the only thing that actually matters for scientific policy: long-run error rates. Bayesian methods provide no guarantee on Type I error. If we adopt your deflationary view and abandon frequentist controls, we lose the ability to regulate false positives in a regulatory or policy context. Isn't the replication crisis precisely evidence that we haven't been strict *enough* with frequentist controls, rather than evidence that the controls are irrelevant?"

  **Your Reply (2 mins):**
  "I'm not suggesting we abandon error control. I'm suggesting that the nominal alpha level—the 0.05 threshold—is a mirage when the analysis path isn't fixed. You control the error rate of the *test*, but you don't control the error rate of the *researcher*.
  If I run twenty variations of a model and pick the one with the smallest p-value, my actual Type I error rate isn't 0.05; it's near 1.0. Switching to Bayes doesn't fix this, but sticking to Frequentism doesn't fix it either unless we police the *process*, not just the *output*. My worry is that we treat the statistical framework as the immune system, when the real infection is the incentive to publish positive results. A strict Neyman-Pearson protocol is useless if the protocol itself is selected post-hoc."

  **Soft Spot:** Hardline Frequentists believe the framework *enforces* the discipline. You are arguing the framework is too easily bypassed. They may view this as an argument for *more* rigid frequentism (e.g., registered reports), not a deflation of the framework itself.

  #### 3. The "Normative Vacuum" Objection (Philosopher of Science)
  **The Objection:** "This is a compelling critique of current practice, but it leaves the working scientist in a normative vacuum. If both frameworks are equally vulnerable to researcher degrees of freedom, and if p-values and Bayes factors can both dress up weak evidence, what is the empiricist supposed to do on Monday morning? 'Be more honest' isn't a methodology. Do we just stop quantifying evidence?"

  **Your Reply (2 mins):**
  "We don't stop quantifying, but we stop treating the quantification as the *verdict*. On Monday morning, the scientist should treat any single analysis as a sensitivity check, not a conclusion. If your result depends entirely on one specific prior or one specific covariate selection, it's fragile.
  My suggestion is methodological humility: Report the robustness. Show me the result with the flat prior and the skeptical prior. Show me the p-value with and without that outlier. The 'method' isn't choosing Bayes over Frequentism; it's choosing transparency over certainty. We need to shift from asking 'Is it significant?' to 'How much does this assumption matter?' That's a change in culture, not a change in formula."

  **Soft Spot:** This is vague. "Be humble" is hard to enforce. The audience may leave feeling you've diagnosed the disease but prescribed a placebo.

  #### 4. The "Cumulative Science" Objection (Committed Bayesian)
  **The Objection:** "You mentioned likelihood ratios. But science is cumulative. Bayesian updating allows us to carry evidence forward from study to study. Frequentist p-values reset to zero every experiment. Even if individual Bayes factors are manipulated, doesn't the mechanism of updating priors with posteriors eventually converge on the truth in a way that significance testing never can?"

  **Your Reply (2 mins):**
  "That convergence relies on the likelihoods being honest. If I'm selecting which data to show you, or which model generated the likelihood, the updating process is corrupted. Garbage in, garbage out—even if the update rule is perfect.
  Furthermore, in fields like ecology, we rarely update a single parameter across a community of researchers. We have competing models, not just competing parameter estimates. If everyone starts with different 'subjective' priors based on their own previous, potentially biased work, we aren't converging; we're diverging into camps. The theoretical convergence of Bayes is beautiful, but it assumes a level of communal honesty and model agreement that I haven't seen in the field."

  **Soft Spot:** Mathematical convergence theorems (Bernstein-von Mises) are strong. You are arguing that real-world conditions violate the assumptions of the theorems. They might accuse you of ignoring the asymptotic safety nets.

  #### 5. The "Inductive Behavior" Objection (Neyman-Pearson Frequentist)
  **The Objection:** "You're conflating Fisherian significance testing with Neyman-Pearson hypothesis testing. We never claimed a p-value was a measure of evidence or belief. It's a rule for action. If the replication crisis is about false beliefs, that's a Fisherian problem. Our framework is about controlling the cost of errors in decision-making. Are you attacking a misunderstanding of our own framework?"

  **Your Reply (2 mins):**
  "That's a fair distinction, and I should have been more precise. However, look at how the tools are *used*. Ecologists treat p < 0.05 as 'truth' and p > 0.05 as 'no effect.' The behavioral rule has become an evidential claim in practice.
  Even if we stick to your behavioral interpretation: if the 'rule' is applied to a hypothesis that was generated by the same data used to test it, the long-run error properties are void. The 'decision' is being made on a rigged machine. So, while you're theoretically correct that NP is about actions, the scientific community uses it to justify beliefs. And in that marketplace of belief, the lack of error control in the *process* renders the behavioral guarantee moot."

  **Soft Spot:** You are critiquing the *sociology* of statistics, not the *statistics*. A pure NP theorist can say, "That's not our fault." You need to maintain that a statistical framework that is so easily misused by its practitioners has a design flaw.

  #### 6. The "Underdetermination" Objection (Philosopher of Science)
  **The Objection:** "This sounds like a classic case of underdetermination. The data doesn't dictate the model. If both Frequentist and Bayesian methods are underdetermined by the data because of the 'garden of forking paths,' isn't the real issue theory-ladenness? Shouldn't we be focusing on how background theory constrains the analysis, rather than the statistical machinery?"

  **Your Reply (2 mins):**
  "Exactly. That's the deflationary point. The statistics are just the engine; the theory is the steering wheel. If the steering is loose, it doesn't matter if you have a V8 or an electric motor.
  But here's the rub: In many fields, including mine, the background theory is weak. We're often exploring. When theory can't constrain the model, we lean on statistics to do the heavy lifting. That's where the crisis comes from—expecting the math to resolve ambiguity that the biology hasn't resolved. So yes, it's underdetermination, but until we strengthen the theory, we need to stop pretending the statistics can solve it for us."

  **Soft Spot:** This might sound like you're giving up on quantitative methods. You need to ensure they hear "strengthen theory" as "do better science," not "stop doing stats."

  #### 7. The "Pre-registration" Objection (Hybrid Statistician/Philosopher)
  **The Objection:** "You mentioned pre-registration earlier. But pre-registration effectively solves the 'forking paths' problem for Frequentists by fixing the analysis plan. Bayesianism claims not to need pre-registration because the likelihood principle handles optional stopping. Isn't this a practical advantage for Bayes? Why lump them together if one allows for flexible data collection without penalty?"

  **Your Reply (2 mins):**
  "Pre-registration fixes the *frequentist* error rate, yes. But it doesn't stop me from interpreting the result differently than I planned, or from running a secondary Bayesian analysis on the same data to 'confirm' it.
  As for Bayes and optional stopping: The math says the posterior is valid regardless of stopping. But if I stop *because* the posterior looked good, I have biased the *literature*, even if my specific posterior is coherent. I've filtered the stream of results. The 'advantage' of Bayes here is that it encourages peeking. But if everyone peeks and only publishes when the posterior looks nice, the collective scientific record is just as distorted as the p-value record. One allows flexibility; the other controls error. Both are vulnerable to selection bias in publication."

  **Soft Spot:** This is a nuanced point about *publication bias* vs. *statistical validity*. They might argue that Bayesian meta-analysis can correct for this. You need to stay focused on the individual researcher's temptation.

  #### 8. The Dreaded Objection (The Quantitative Challenge)
  **The Objection:** (From the quietest, most senior statistician in the room): "You've given us a qualitative argument about human behavior. But you claim these mechanisms 'reappear in Bayesian dress.' Do you have any quantitative evidence for that? Can you show us a simulation where Bayesian QRPs produce false discovery rates comparable to p-hacking? Without that, isn't this just anecdotal worry-mongering?"

  **Your Reply (2 mins):**
  "I don't have a simulation study, and that is a genuine limitation of this talk. I have thirty-five years of field notes and a stack of published papers where the methods section doesn't match the data.
  But consider this: If the mechanism is 'researcher flexibility,' the burden of proof shouldn't be on me to show Bayes fails, but on the proponents to show that human nature changes when we switch formulas. We know p-hacking happens because we see the p-value distributions bunching at 0.049. We don't see Bayes factor distributions yet because the practice is newer. I'm predicting the same distortion will appear. I'm asking you to look for it before we declare victory."

  **Soft Spot:** This is your weakest point. You are an empiricist without data for your main claim. You must rely entirely on your personal authority and the plausibility of the analogy. If they press for a citation or a model, you have to stand firm on "This is an observational hypothesis, not a proven theorem."

  ### IV. Final Advice
  *   **Stay in your lane:** When they dive into integrals or asymptotic theory, pull them back to the *field*. "In the forest, we don't have infinite data."
  *   **Don't fight the math:** If a Bayesian proves you wrong on a theorem, concede it immediately. "You're right about the math. I'm talking about the practice."
  *   **End on the Philosophers:** They are your largest bloc. If you satisfy their need for a "way forward" (transparency, robustness checks), you win the room even if the statisticians remain skeptical.

  Good luck. You've earned the right to ask the hard questions.
