answer: |-
  **Project Title:** The Reference Class Problem in Political Forecasting: Artifact, Feature, or Fatal Flaw?

  **Research Question**
  Is there a principled, *ex ante* criterion for reference class selection that distinguishes statistical inference from rhetorical analogy, or is the "outside view" fundamentally a mechanism for laundering inside-view judgments? If the latter, does relocating the judgment to class selection render the method epistemically bankrupt, or does it produce a more honest output: a sensitivity profile of base rates across defensible classes rather than a point forecast?

  **Problem Statement**
  The "outside view" is the dominant normative standard in modern forecasting. It demands that forecasters ignore the particulars of a case (the inside view) and instead adopt the base rate of a relevant reference class. However, the method contains a silent vulnerability: the choice of reference class is itself an inside-view judgment. To predict the lifespan of a hegemon, one must choose the class: *all empires*, *all nuclear powers*, or *all states commanding >20% of global GDP*. Each carving is defensible; each yields a different probability; the method provides no algorithm for choosing between them.

  Standard defenses claim that class selection is a matter of expert judgment refined by practice, or that any "reasonable" class suffices. These replies fail. The first circularity relies on the very intuition the outside view is meant to discipline. The second ignores that "reasonable" classes in political history often diverge wildly in their base rates. Furthermore, existing literature under-addresses the selection bias inherent in historical political data: empires are recorded *because* they were salient, meaning the population is conditioned on the outcome. If the reference class is assembled by resemblance (analogy) rather than drawn from a defined population (sample), the resulting number is frequentist clothing draped over case-based reasoning.

  **Methodology**
  This is a conceptual and forensic project, not an empirical one. I will not build a new database of empires. Instead, I will treat existing forecasting disputes as case studies to stress-test the logic of class selection. The work proceeds in three phases over nine months.

  *Months 1–3: Conceptual Archeology and Taxonomy*
  I will map the logical structure of the reference class problem as it appears in political science and intelligence analysis. The goal is to formalize the distinction between *Sample Classes* (drawn from a known population, supporting statistical inference) and *Analogy Sets* (assembled by resemblance, supporting case-based reasoning). I will audit five canonical forecasting disputes (e.g., the collapse of the USSR, the rise of China, the durability of the post-1945 order) to document how competing forecasters implicitly selected different classes to justify divergent conclusions.
  *Deliverable:* A working taxonomy of class-selection moves, identifying where "judgment" is doing hidden work.

  *Months 4–6: The Bias-Variance Reframing*
  I will operationalize the hypothesis that reference class selection is a bias-variance trade-off. Narrow classes offer low bias (high relevance) but high variance (small N, noisy data); broad classes offer low variance but high bias (low relevance). I will reconstruct the base rates for the five audited cases using at least three defensible classes per case. I will not argue for one "true" number. Instead, I will generate a *Sensitivity Profile* for each case: the spread of probabilities generated by defensible classes.
  *Deliverable:* A draft framework demonstrating that the "finding" is the spread, not the mean.

  *Months 7–9: The Admissibility Condition and Selection Bias*
  The final phase addresses the historical selection problem. I will propose and test an *Admissibility Condition*: a class is only valid for outside-view forecasting if membership can be determined without knowledge of the outcome. I will test this condition against the historical record of states to identify where survivorship bias invalidates standard base rates. The final output will be a set of criteria for when the outside view is permissible and when it must be discarded as laundered judgment.
  *Deliverable:* Final monograph and a practical "Admissibility Checklist" for working forecasters.

  **Success and Failure Conditions**
  *Success:* The project produces a formalized "Admissibility Condition" that allows a forecaster to rule out specific reference classes as methodologically invalid *before* calculating the base rate. It successfully reframes the outside view's output from a point estimate to a sensitivity profile.
  *Failure:* The project demonstrates that no non-circular admissibility condition exists. (Note: This is a substantive intellectual result, but for the purposes of the fellowship, failure is defined as an inability to produce a usable framework for practitioners. If the problem proves intractable, the scope must narrow to a purely philosophical critique, which risks losing the journalism institute's audience.)

  **Feasibility and Scope Assessment**
  Nine months is sufficient for the conceptual work but tight for the forensic reconstruction of case studies. The risk is getting bogged down in historical debate rather than methodological analysis. To mitigate this, I recommend narrowing the scope immediately to the **Admissibility Condition**.

  The bias-variance trade-off and the sample/analogy distinction are powerful framing devices, but they are secondary to the core epistemic violation: using outcome-dependent data to predict outcomes. If I must choose between a full taxonomy of classes and a rigorous test of the Admissibility Condition, the latter is the higher-value target. It provides a determinate answer to the research question (either the condition holds or it doesn't) and offers a concrete tool for the industry. I will structure the proposal to prioritize the Admissibility Condition, using the bias-variance framing as the theoretical justification for why the condition is necessary.

  **Argument Skeleton and Breaking Points**
  1.  *Premise:* The outside view claims to correct inside-view bias.
  2.  *Complication:* Class selection reintroduces inside-view bias.
  3.  *Move 1:* Distinguish Statistical Samples from Analogy Sets. If the latter, the "number" is illusory.
  4.  *Move 2:* Reframe the output. If class selection is unavoidable, the output must be a range (sensitivity profile), not a point.
  5.  *Move 3:* Impose the Admissibility Condition. Membership must be knowable *ex ante*.
  6.  *Breaking Point:* The Admissibility Condition may be too strict, ruling out almost all historical political data due to survivorship bias. If so, the conclusion must be that the outside view is largely inapplicable to macro-political history, a negative result that still advances the field by halting false precision.

  This structure ensures the project remains analytical rather than historical, fitting the constraints of the fellowship while addressing the core suspicion that the industry's primary tool is epistemically unstable.
