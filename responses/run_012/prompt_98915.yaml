prompt: |-
  Ok weird request. I'm a backend engineer — service boundaries, deploys, rollbacks, that kind of thing is my whole day — and I recently got roped into helping rewrite the bylaws of a small nonprofit I'm on the board of. Which somehow sent me down a rabbit hole reading about presidential vs parliamentary systems for basically the first time in my life. It's been messing with my head, because the whole debate keeps trying to collapse into words I already have.

  So here's what I want: restate the main case for each system — why you'd want a separately elected executive locked into a fixed term, vs a chief executive who is just whoever currently commands the legislature's confidence — entirely in my vocabulary. Services and their interfaces. Deploy vs rollback. Hot-swapping. Coupling and cohesion. Deadlock and livelock. Single points of failure. Spec vs implementation. Version pinning. Whatever actually fits. Do it as faithfully as you can, one side at a time, and don't cheat by quietly importing assumptions from the systems world that the politics side never signed up for.

  Then the part I actually care about: the residue report. Whats survives cleanly, what only survives if you fudge it, and what has no counterpart at all in how I think about systems. My suspicion is that the stuff that won't translate — legitimacy, mandate, a loyal opposition, the whole ceremonial-head-of-state business, the idea that a good constitution is supposed to be a bit boring — is either (a) a real feature of political systems that my engineering vocabulary literally can't see, or (b) people dressing up something that's actually just about who can fire whom. Tell me which, and don't be nice about it. I'd rather find out my whole frame is missing something than get a translation that flatters it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

