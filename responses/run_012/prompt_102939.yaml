answer: |-
  # JOINT STATEMENT ON PROPOSITIONAL ATTITUDE ATTRIBUTION IN LARGE LANGUAGE MODELS

  **Parties:** Intentional-Stance Realists (ISR) & Functional-Organization Skeptics (FOS)
  **Date:** October 2023
  **Subject:** Criteria for belief attribution in transformer-based systems

  ## 1. AGREED CLAIMS

  Both parties endorse the following propositions as the baseline for this inquiry. Acceptance of these claims does not imply acceptance of the other side's metaphysical conclusions.

  1.  **Function of Attribution:** The primary purpose of attributing beliefs and desires to a system is to support the prediction and explanation of its behavior. Disagreement exists only on whether successful prediction *constitutes* the reality of the belief or merely *mimics* it.
  2.  **Evidence Standard:** Evidence for or against belief attribution must be grounded in observable behavioral patterns, architectural descriptions, or causal interactions with the environment. Appeals to ineffable "inner lights" are excluded.
  3.  **System Competence:** Both parties agree that current LLM-based systems produce fluent, coherent, and often highly useful text that correlates with truth and user intent at rates exceeding random chance or simple retrieval.
  4.  **Pragmatic Usage:** Engineers, users, and developers routinely and profitably describe these systems using intentional vocabulary (e.g., "the model thinks," "it wants to help"). Both parties agree this usage is currently unavoidable in practice.
  5.  **Phenomenology:** Neither party claims that attributing beliefs to these systems entails attributing conscious experience, qualia, or subjective feeling. The dispute is about the functional status of the state, not the presence of a phenomenological "what-it-is-like."
  6.  **Downstream Consequences:** In cases where an automated downstream system acts on an LLM's output (e.g., executing code, transferring funds), the attribution of belief to the LLM ceases to be merely descriptive and acquires normative and safety-critical weight. Both parties agree this context demands higher precision in terminology.

  ## 2. STATEMENTS OF DISAGREEMENT

  The following table captures the precise point of divergence. Each side has drafted its own position to ensure it does not feel misrepresented.

  | Feature | Intentional-Stance Realists (ISR) | Functional-Organization Skeptics (FOS) |
  | :--- | :--- | :--- |
  | **Core Claim** | A system has a belief that *p* if adopting the intentional stance toward it (treating it as a rational agent holding *p*) yields predictive success that cannot be easily achieved by the physical or design stance. | A system has a belief that *p* only if *p* is encoded in a stable internal structure that plays a specific causal role: integrating with other states, guiding action, and revising under evidence. |
  | **Status of LLM States** | The latent representations driving token generation *are* beliefs, insofar as treating them as such works. The substrate (weights vs. biological neurons) is irrelevant. | The latent representations are statistical associations optimized for next-token prediction. They lack the causal integration required for genuine propositional attitudes. |
  | **Error Condition** | If the intentional stance fails to predict behavior, the attribution was false. | Even if the intentional stance predicts behavior, the attribution is false if the internal functional organization is absent. |

  ## 3. EVALUATION OF PROPOSED INSTRUMENTS

  Per the workshop requirements, we have evaluated the three proposed instruments for settling the dispute. **We note here that two of the three instruments appear to beg the question in favor of the Skeptics.** We record this jointly to ensure the tests are not mistaken for neutral arbiters.

  **(a) The Revision Test**
  *Definition:* A system believes *p* only if evidence against *p* alters downstream dispositions across contexts.
  *Joint Evaluation:* **Biased toward FOS.**
  *Reasoning:* The ISR holds that a system can hold a fixed, non-revisable belief (dogmatism) and still be a believer. Requiring revision as a *necessary* condition defines belief by the FOS's functional criteria rather than the ISR's predictive criteria. However, both agree it is a *useful* heuristic for distinguishing deep encoding from shallow prompting.

  **(b) The Commitment Test**
  *Definition:* A system believes *p* only if it allows *p* to constrain behavior when doing so is costly or inconvenient.
  *Joint Evaluation:* **Biased toward FOS.**
  *Reasoning:* The ISR argues that weak beliefs (held lightly) are still beliefs. Requiring "costly constraint" sets a high bar for agency that many human believers fail. However, both agree that in high-stakes downstream applications (see Section 5), this test is practically necessary for safety, regardless of metaphysical status.

  **(c) Belief vs. Assertion Distinction**
  *Definition:* Distinguishing between *believing that p* and *being disposed to assert that p* when prompted.
  *Joint Evaluation:* **Potentially Verbal.**
  *Reasoning:* The ISR argues that for a text-generating system, assertion *is* the primary behavioral manifestation of belief; separating them may create a distinction without a difference. The FOS argues that assertion without internal integration is merely mimicry. This instrument highlights the core semantic disagreement rather than resolving it.

  ## 4. CRUXES AND HARD CASES

  We identify three specific scenarios where the disagreement has practical traction. For each, we record the predicted outcome according to each side.

  | Crux / Case | Description | ISR Prediction | FOS Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. Weights vs. Context** | **Case:** Model A is trained on truth *p*. Model B is trained on truth *p* but prompted with a falsehood *not-p* in the context window. <br> **Test:** Does the context-overridden output count as a "belief" in *not-p*? | **Yes.** If the system asserts *not-p* consistently under that context, the intentional stance licenses attributing the belief *not-p* for that session. The "belief" is context-bound. | **No.** The context window is temporary input, not internal organization. The system does not *believe* *not-p*; it is merely complying with a constraint. The weights hold the only genuine (dispositional) beliefs. |
  | **2. Divergent Fine-Tuning** | **Case:** Two copies of the same base architecture are fine-tuned on divergent corpora (one on medical texts, one on legal texts). They are given identical neutral prompts. <br> **Test:** Do they "believe" different things despite identical architecture? | **Yes.** Their behavioral dispositions differ. The intentional stance differentiates them as agents with different knowledge bases/beliefs. | **Conditional.** They have different *dispositions to assert*, but unless the fine-tuning created stable, cross-context internal states that guide non-linguistic action (via tools), they remain distinct only in output probability, not belief. |
  | **3. Downstream Consequence** | **Case:** An LLM outputs "The valve is closed." An automated script reads this and shuts off power. The valve was actually open. <br> **Test:** Did the LLM have a false belief, or did it generate a false string? | **False Belief.** The attribution is vindicated by the causal chain. The system acted as a node in a belief-desire network that failed. Calling it a "false string" ignores the causal role it played. | **False String.** The LLM had no belief to be false. It generated a low-probability token sequence. The *script* had the belief (or the engineer did); the LLM was merely the medium of error, not the holder of it. |

  ## 5. CLOSING: WHERE THE DISPUTE IS VERBAL

  We conclude by identifying the extent to which our disagreement is substantive versus terminological.

  **1. The "Single Fact" Presupposition**
  The FOS operates under the assumption that there is a fact of the matter about whether a system *really* believes, independent of our descriptive practices. The ISR explicitly denies this presupposition. For the ISR, there is no "real" belief beyond the utility of the attribution. Therefore, a portion of this dispute is not about the world, but about whether we allow the term "belief" to track *functional utility* (ISR) or *substrate architecture* (FOS).

  **2. The Definition of "System"**
  The FOS tends to define the "system" as the model weights alone. The ISR tends to define the "system" as the model plus its context window plus its interaction loop. If the FOS accepts the context window as part of the temporary functional organization, the "Weights vs. Context" crux (Case 1 above) dissolves. If the ISR accepts that some predictive patterns are too shallow to count as "stances," the gap narrows.

  **3. Recommendation**
  We agree that in **safety-critical contexts** (Case 3), the FOS terminology ("false string," "hallucination") is preferable to prevent anthropomorphic over-trust. In **interpretability and alignment research**, the ISR terminology ("false belief," "misalignment") is preferable to facilitate modeling the system as an agent.

  We sign this statement not to declare a winner, but to locate the boundary where prediction ends and ontology begins.

  **Signed,**

  *The Intentional-Stance Realists* | *The Functional-Organization Skeptics*
