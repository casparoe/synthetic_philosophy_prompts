  I define this phenomenon as **Diachronic Proxy Authority**. It occurs when a past preference is enforced over a present preference not because the past self has metaphysical sovereignty, but because the present self's preference is deemed epistemically inaccessible or normatively unreliable. The past self functions as a stand-in, not a ruler.
  This covers the dementia case: the present self's contentment is inaccessible as a valid autonomous choice due to cognitive degradation, so the past self acts as proxy for the "true" person. In the childfree case: the present self's desire is accessible and competent, so the proxy is discarded immediately.
  It excludes **precommitment strategies** (boundary case: hiding alcohol to prevent drinking). This is a near-miss because it involves past binding future. However, here the future self *endorses* the restriction beforehand as rational; in your pattern, the future self is either unaware (dementia) or actively opposed without being deemed incompetent (childfree). The key difference is consent to the constraint.
  It excludes **legal contracts** (boundary case: signing a mortgage). This is a near-miss because past signatures bind future actions. However, here external enforcement binds the self, not internal identity judgments; breaking it incurs penalties, not identity crises. The authority comes from the state, not the self.
  It excludes **transient state conflicts** (boundary case: dieting while hungry). This is a near-miss because past rules override present desires. However, we treat hunger as noise, not a new self; your pattern requires a perceived shift in identity or capacity, not just fluctuating desire. We don't say the hungry person is a different person, but we might say the demented person is. The threshold is identity disruption, not desire conflict.

  The deciding principle
  The deciding principle is the **Capacity for Reflective Revocation**. The past self binds the future self only when the future self lacks the capacity to meaningfully revoke the instruction.
  In the dementia case, the biological capacity to process the original value system is gone; the present self cannot revoke because they cannot understand the stakes. The past preference stands as a proxy for what the person *would* want if they could know themselves. We honor it because the current voice is broken.
  In the childfree case, the capacity for reflection is intact. The woman understands her past reasoning and rejects it. Because she can revoke, the past authority evaporates.
  This implies your suspicion is correct: the "binding" is a fiction. There is no metaphysical chain linking selves. There is only a procedural rule: we defer to the past only when the present is silent or broken. When the present speaks clearly, sovereignty defaults to the now. The authority is not in the promise; it is in the competence. This resolves the tension: we are not respecting the past self's authority, we are protecting the person's integrity when they cannot protect it themselves. It turns a metaphysical puzzle into an epistemic limitation.

  The name
  There is no single established term covering this asymmetry across bioethics and life planning. I coin this **Diachronic Proxy Authority**. The label earns its keep by shifting focus from the metaphysics of identity to the epistemology of access: it names the specific condition under which we let a ghost speak for the living. It clarifies that the past self rules only when the present self cannot speak, dissolving the paradox of binding autonomy. It provides a tool to test future cases: ask not who is the real person, but who can speak.
