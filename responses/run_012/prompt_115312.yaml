  Ok so this is gonna sound weird but I'm a high schooler and I've been thinking about this way too much. In math class we learned that you can't prove that math has no contradictions using math itself (I'm pretty sure that was Gödel?) and everyone else just went huh ok and moved on but it's been bugging me for weeks. Anyway here's my actual position and I want you to try to break it: the normal axioms, the ones for arithmetic and the ones for sets, are consistent, there's no contradiction hiding in there, and we're right to build everything on top of them. My reason isn't a proof, it's a no-coincidence thing. People have been trying to break these systems for like a hundred years and nothing's turned up, and the part that really got me is that when you compare how strong all these different theories are, they all line up in one single order from weak to strong instead of scattering into a bunch of unrelated ones. If they were secretly rotten inside I feel like that neat line-up would be a miracle. So what would count against me? I know an actual derivation of a contradiction ends the whole thing, but what counts short of that, what would weaken the evidence, and does my line-up argument actually hold up or is it the kind of thing that just sounds convincing? Also I'm worried I've made a view that can't be tested at all, since you can't check it from the inside, so be honest, is it unfalsifiable, and is that actually bad here or is it fine for something like this? What would the people who really know this stuff admit counts against them? And the thing that would definately shake me most is if there's a case where a theory that looked just as natural and obvious as the usual axioms turned out to be inconsistent, is there one? Rank everything from ok yeah thats fatal down to meh awkward, and tell me which ones I should actually care about vs which ones I can shrug off.
