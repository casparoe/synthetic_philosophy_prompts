answer: |-
  No, it does not follow that we must abandon desert altogether, because your friend's argument erroneously conflates the specific problem of outcome luck with a global skepticism about agency that moral luck itself does not necessitate. Nagel and Williams highlight a paradox within our existing moral practices—showing that we judge based on outcomes despite believing we should judge only on control—but they do not prove that control is entirely illusory, only that it is less sovereign than we prefer. The argument goes wrong when it slides from observing that some factors are unlucky (like hitting a child) to claiming that *all* factors (like choosing to drive carelessly) are equally outside our control, thereby ignoring the compatibilist distinction between coerced actions and voluntary choices that remains meaningful even in a determined universe. Furthermore, abandoning blame entirely ignores the forward-looking, regulatory purpose of responsibility practices, which are justified by their necessity for social cooperation and safety rather than by a metaphysical purity of desert. Thus, while moral luck reveals an unsettling tension in how we assign blame, it undermines neither the distinction between carelessness and accident nor the practical legitimacy of holding agents accountable for the choices they do make.
