          1.  Correspondence Table.
          2.  The Break Points (Disanalogies).
          3.  Critical vs. Decorative analysis.
          4.  The "Constitutive" Audit.
          5.  Verdict on the Conclusion.
          6.  Better Analogy.

  9.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address the "resigning vs. emigrating" point? Yes, need to emphasize the cost of exit.
      *   *Check:* Did I address the "protection of the system" point? Yes, the "fair play" theory of obligation.
      *   *Nuance:* Acknowledge where the analogy *works* (proceduralism) to show fairness, then dismantle the strong claim.
      *   *Philosophical Reference:* Rawls (Civil Disobedience), Searle (Constitutive Rules), Hart (Concept of Law). Keep it implicit or light touch so it doesn't get bogged down, but show the theoretical grounding.

  10. **Final Polish:** Ensure the distinction between *regulative* and *constitutive* rules is clear, as that's the user's specific hang-up. (Searle's distinction is exactly what the opponent is misusing).

  **(Self-Correction on the "Better Analogy"):** A strike is good, but Language is better for the *expressive* nature of protest. However, for the *political obligation* aspect, the **Homeowners Association (HOA)** or **Condominium** might be better than Chess. It captures the "bound by rules" but "shared ownership" aspect. Actually, let's stick with **Language** for the *act* of protest, and **Union Strike** for the *justification*. I'll propose the **Union Strike** as the political theory alternative because it addresses the "withholding tax/road blocking" economic/coercive element better than language.

  Wait, the "Constitutive" point is the strongest lever. I need to make sure I explain *why* traffic laws aren't constitutive of driving in the way rook moves are constitutive of chess.
