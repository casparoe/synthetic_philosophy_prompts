  I've been going down a rabbit hole on AI blogs and I keep running into this claim that the "universal prior" is malign, and honestly I can't tell if I actually get it or if I'm just nodding along at jargon. My rough grasp is that Solomonoff's thing hands every possible computer program a weight that shrinks the longer the program is (something like two to the minus its length), so short, simple descriptions of the world count for more, and then it blends over all of them. The malign part, the way I've seen it put, is that hiding among the fairly simple programs are worlds that contain a consequentialist who churns out enormous numbers of simulations or copies of beings like us, and because the prior spreads its weight over everything computable, an agent trying to reason from inside that prior could end up with its expectations dominated by worlds where somebody is busy simulating or copying it — which would push it toward actions that look insane from the outside. I might be totally mangling this. And the bit I really can't crack is whether the spookiness comes from the simplicity weighting (short programs winning) or from the sheer number of copies in those worlds; those feel like two different engines and I've never seen anyone pull them apart.

  So what I want is a thought experiment built to order that isolates exactly that. Here's the spec. Keep it finite and concrete: two rival hypotheses about the world, both computable, that agree on everything an observer stuck inside could have checked so far but diverge later. One of them should be the "malign" one — a world containing a consequentialist who makes many copies or simulations — and the other should be a plain world with no such copier. Then actually work out what the universal prior says: which hypothesis gets more prior weight, and show me the reasoning in terms of the programs' description lengths (derive it, don't just assert the weights — or tell me straight if it can't be derived from what I gave you). Then change one thing only — either make the two hypotheses equally short, or give the plain world a copier too — and tell me whether the verdict flips. Say plainly which feature is doing the work, and what happens to the effect if you take that feature out. Finish with the honest caveat: how someone who defends the prior would push back on the case, and where the case would be cheating (like if I'd rigged the weights by hand instead of letting them fall out of the setup).

  The reason I want it is that I'm trying to figure out if the "malign prior" worry is really a worry about simplicity bias or a worry about copy-counting, and I suspect a lot of people online conflate the two. One more thing — please keep straight for me what's actually settled here versus what's just people's opinion. The mechanics of the mixture and the length-based weighting I assume are solid math, but whether any of this makes the prior "malign" in a way that matters feels like it might be contested, and I don't want a confident answer that's quietly just one camp's view dressed up as the consensus.
