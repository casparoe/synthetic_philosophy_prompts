      *   *Scene 5:* The Choice. She tears up the report? No, she makes a choice that defies the ranking.

      *Let's refine the choice.* The audit concludes she values "Being Perceived as Altruistic" > "Altruism." Marcus wins. She has to decide whether to send the report. If she sends it, she admits he's right. If she destroys it, she proves she cares about the relationship more than the truth? No, that's messy.
