answer: |-
  The name you are looking for is the **Heterogeneity Problem** (sometimes called the Diversity Objection). It is exactly what you described: the suspicion that "pleasure" is just a word we use to label a bunch of totally different experiences that share no actual common ingredient.

  If Hedonism claims "Pleasure is the *only* good," but "pleasure" turns out to be a grab-bag label for unrelated things, then Hedonism is saying "X, Y, and Z are the only good," where X, Y, and Z have nothing to do with each other. That makes the theory unstable.

  Here is the checklist you asked for. I have organized your points into requirements a theory of pleasure must meet, categorized by whether they are **Non-Negotiable** (the theory breaks without them) or **Contested** (different hedonists sacrifice these to save the theory).

  ### The Viability Checklist for a Theory of Pleasure

  #### 1. The Heterogeneity Requirement (Non-Negotiable)
  *   **The Case:** Your four examples (scratching a bite, math proof, hot shower, dog greeting).
  *   **The Demand:** The theory must identify a single common denominator (a "phenomenal tone," a "neural signal," or an "attitude") that exists in all four.
  *   **Why:** If it can't do this, "pleasure" isn't a *thing* you can maximize. It's just a label.
  *   **Status:** **Non-Negotiable.** If you fail this, you don't have a theory of pleasure; you just have a list.

  #### 2. The Wanting vs. Liking Distinction (Non-Negotiable)
  *   **The Case:** Your sister's point (brain science distinction). You can crave a cigarette (wanting) without enjoying it (liking), or enjoy a sunset without craving it.
  *   **The Demand:** The theory must specify whether pleasure is *satisfaction of desire* (getting what you want) or *positive affect* (the feeling of liking).
  *   **Why:** If you conflate them, you can't explain addiction or self-sabotage.
  *   **Status:** **Non-Negotiable.** Most modern theories pick "Liking" (Feeling/Attitude) because "Wanting" leads to the problem of bad desires (e.g., wanting to hurt someone).

  #### 3. The Paradoxical Enjoyment Requirement (Non-Negotiable)
  *   **The Case:** Hot sauce, sad songs, scratching until it bleeds.
  *   **The Demand:** The theory must explain how a sensation that is physically painful or negative can be experienced as "pleasurable."
  *   **Why:** A simple "feel good" theory fails here. The theory needs to separate the *sensation* (burning) from the *evaluation* (enjoying the burn).
  *   **Status:** **Non-Negotiable.** If a theory says "pain is always bad," it contradicts human experience.

  #### 4. The Temporal Extension Requirement (Contested)
  *   **The Case:** A whole afternoon is pleasant, but no single second contains "the pleasure."
  *   **The Demand:** The theory must explain if pleasure is an atomic moment (a snapshot) or a narrative structure (a whole activity).
  *   **Why:** If pleasure is only atomic moments, then "a good life" is just stacking seconds. If it's narrative, then memory and anticipation matter.
  *   **Status:** **Contested.** Classical Hedonism usually prefers atomic moments (easier to calculate). Process theories prefer the whole afternoon.

  #### 5. The False Pleasure Requirement (Contested)
  *   **The Case:** The cheap vinegar wine, the setup party.
  *   **The Demand:** The theory must decide if the *truth* of the situation matters. Did you have pleasure when you thought it was wine?
  *   **Why:** If pleasure is purely internal (a feeling), then the vinegar wine *was* pleasurable. If pleasure requires truth, then you didn't actually have pleasure.
  *   **Status:** **Contested.** "Feeling Theories" say false pleasure is still pleasure. "Attitudinal Theories" often say it's not genuine pleasure because the attitude was based on a lie.

  #### 6. The Non-Conceptual Requirement (Contested)
  *   **The Case:** Animals and babies.
  *   **The Demand:** The theory must allow for pleasure without complex beliefs or language.
  *   **Why:** If pleasure requires believing "this is good wine," dogs can't have pleasure. That seems wrong.
  *   **Status:** **Contested.** This fights directly with the **False Pleasure** requirement. To handle false pleasures, you usually need beliefs (to be deceived). To handle dogs, you usually can't require beliefs.

  #### 7. The Commensurability Requirement (Non-Negotiable for Calculation)
  *   **The Case:** 10 mins of ice cream vs. 3 hours of reading.
  *   **The Demand:** There must be a single currency (intensity? duration? quality?) to compare them.
  *   **Why:** Hedonism is usually about *maximizing* good. You can't maximize if you can't compare.
  *   **Status:** **Non-Negotiable for Ethical Hedonism.** If pleasures are incommensurable, you can't make moral choices based on them.

  #### 8. The Quality vs. Quantity Requirement (Contested)
  *   **The Case:** Mill's Higher vs. Lower pleasures.
  *   **The Demand:** The theory must explain how one pleasure is "better" than another without admitting that something *other than pleasure* (like dignity or knowledge) is making it better.
  *   **Why:** If you say reading is better than push-pin because it's "nobler," you've stopped being a hedonist and become a virtue ethicist.
  *   **Status:** **Contested.** Bentham said "quantity only." Mill said "quality matters." This is the hardest spot for Hedonism to defend without cheating.

  #### 9. The Activity vs. Feeling Requirement (Contested)
  *   **The Case:** Skiing (activity) vs. Massage (feeling).
  *   **The Demand:** Is pleasure a sensation that happens *to* you, or is it the unimpeded exercise of a capacity (doing something well)?
  *   **Why:** If pleasure is just a feeling, skiing is just a vehicle to get the feeling. If it's an activity, the skiing *itself* is the pleasure.
  *   **Status:** **Contested.** Aristotle argued for Activity. Classical Hedonists argue for Feeling.

  ---

  ### The Conflicts: Which Requirements Fight Each Other?

  You asked which requirements are incompatible. This is where theories die. You generally cannot satisfy all of these at once.

  **1. The "False Pleasure" vs. "Animals" Conflict**
  *   **The Fight:** To explain why the vinegar wine wasn't *really* pleasurable (False Pleasure), you usually need to say pleasure involves a judgment or belief about the world ("I believe this is wine"). But babies and dogs (Animals) don't have complex beliefs.
  *   **The Consequence:** If you solve False Pleasures, you exclude dogs from having pleasure. If you include dogs, you have to admit the vinegar wine *was* pleasurable (because it felt the same), which hurts our intuition about truth.

  **2. The "Heterogeneity" vs. "Commensurability" Conflict**
  *   **The Fight:** If you take the Heterogeneity Problem seriously (math proof and ice cream are totally different), it becomes very hard to put them on a single scale (Commensurability). How many units of "math joy" equal one unit of "chocolate joy"?
  *   **The Consequence:** To make them comparable, you have to ignore what makes them different. But if you ignore the differences, you haven't really solved the Heterogeneity Problem; you've just bulldozed it.

  **3. The "Mill's Higher Pleasures" vs. "Pure Hedonism" Conflict**
  *   **The Fight:** Mill wants to say intellectual pleasures are *better* than physical ones. But if the only good is pleasure, "better" must mean "more pleasurable." If the intellectual pleasure is *less* intense but still "better," Mill is secretly valuing something else (like intellect) and calling it pleasure.
  *   **The Consequence:** This is the "Smuggling" charge. You either collapse Higher Pleasures into Quantity (Bentham) or you admit Hedonism is false because you value things other than pleasure.

  ---

  ### The "Killer" Requirement

  You asked which single requirement kills off the most theories.

  **The Winner: The Heterogeneity Requirement.**

  **Why:** It attacks the foundation. Most theories start by assuming pleasure is a specific *kind* of feeling (like a warm glow).
  *   If you define pleasure as a specific sensation (e.g., a "tingle"), you fail the **Heterogeneity** test (solving math doesn't tingle).
  *   If you define pleasure as "getting what you want" (Desire Theory), you fail the **Wanting vs. Liking** test (addicts want what they don't like).
  *   If you define pleasure as "an attitude of approval," you struggle with the **Animals** test (do dogs have attitudes?).

  Because the experiences are so different, any definition specific enough to be meaningful usually excludes some pleasures, and any definition broad enough to include all pleasures becomes so vague it's useless for calculation.

  ### Is Pleasure a Natural Kind or a Grab Bag?

  This is the conclusion you are hinting at.

  *   **Natural Kind View:** Pleasure is like "Water" (H2O). It has a specific essence (a specific neural firing pattern or a specific phenomenal feel).
      *   *Pros:* Makes Hedonism scientific and calculable.
      *   *Cons:* Fails the Heterogeneity test. There is no single "feel" shared by sex, solving equations, and drinking water.
  *   **Grab Bag View (Family Resemblance):** Pleasure is like "Games." Chess and Tag are both games, but they share no single rule. They just overlap in various ways.
      *   *Pros:* Handles Heterogeneity perfectly.
      *   *Cons:* **Destroys Ethical Hedonism.** If pleasure is a grab bag, you can't maximize "it." You can't say "Maximize Games." You have to say "Maximize Chess OR Tag OR Cards..." but those have different values.

  **My Thinking:**
  The evidence suggests pleasure is **not a natural kind**. It is likely a "functional" state or a "family resemblance" concept.
  *   **The Implication for your paper:** If pleasure isn't a unified thing, then Hedonism cannot be a unified theory. It fractures. You might be a hedonist about food, but an achievement-ist about math.
  *   **The Escape Route:** The only way to save Hedonism from the Heterogeneity Problem is **Attitudinal Hedonism**. This theory says pleasure isn't a *feeling* at all; it is the *attitude of being pleased by* something.
      *   *How it works:* You can be "pleased by" a itch scratch, and "pleased by" a math proof. The *object* is different, but the *attitude* (the "being pleased") is the same.
      *   *The Cost:* This makes pleasure very thin. It basically means "Pleasure is valuing your experience." But then, why not just say "Value is the good"? It risks becoming circular.

  **Summary for your writing:**
  Start with the **Heterogeneity Problem**. Use your four examples to show that "feeling theories" fail. Show how this forces the hedonist into "Attitudinal Hedonism." Then show how Attitudinal Hedonism struggles with **Animals** (do they have attitudes?) and **False Pleasures** (can you be pleased by a lie?). Conclude that the definition of pleasure dictates the viability of the ethics. If the definition is too narrow, the ethics is too restrictive. If the definition is too broad, the ethics is meaningless.
