prompt: |-
  ok so my ethics class is doing hedonism and I have to write something on it, and I keep getting stuck on the part where pleasure is supposed to be the one and only good thing. I was trying to figure out what pleasure even is and now I think the view might be in trouble before it even starts. The pleasure of scratching a mosquito bite, the pleasure of finally getting a math proof, a hot shower, winning a race, my dog when I get home from school — what do all of those actually have in common? It feels like only the word. I think there's a name for this problem but I forgot it.

  But before I pick a side I want the checklist first. What does a theory of pleasure actually have to get right to be any good — good enough that I can even say what hedonism is claiming? Give me the requirements list: the cases it has to handle, the distinctions it cant collapse, the results it can't contradict, with the example or reason behind each one, and tell me which are non negotiable and which are just things one camp cares about.

  Stuff I want on the list, some is mine and some is from class:

  - the four pleasures above, which seem to share nothing
  - people who like pain: the burn of hot sauce, a sad song that makes you cry, the itch you scratch till it bleeds
  - my sister says the brain people separate wanting something from liking it, and that you can want something without liking it or the reverse. A theory of pleasure should probably say which of the two it's about
  - a whole afternoon can be pleasant with no single moment that is the pleasure
  - false pleasures: the wine you loved until you found out it was cheap vinegar, the party you enjoyed that turned out to be a setup
  - Mill's higher vs lower pleasures and the judges thing, without secretly smuggling in some other kind of value and calling it pleasure
  - animals and babies, who don't have beliefs about much
  - adding and comparing: is my ten minutes of ice cream worth your three hours of reading, or do pleasures not go on one scale at all
  - the difference between pleasure as a feeling and a pleasure like skiing, and between pleasure and just wanting something

  And the part I definately care about most: which of these requirements fight each other, so that no theory can have all of them at once, and which single requirement kills off the most theories? Also, is pleasure even the kind of thing that has a nature, or is the word just a grab bag? I can't look anything up, so no reading list — just the list and your own thinking.
