answer: |-
  Here is a disambiguation of the claims hiding inside 'when in Rome, do as the Romans do', arranged from the mundane to the philosophically heavy.

  ### 1. The Prudential Reading (Don't Make Life Hard for Yourself)
  **The Claim:** This is purely instrumental advice. Local conventions are obstacles or hazards; following them minimises friction, confusion, or risk for *you*.
  **Plausibility:** High. It is the most literal, self-interested interpretation.
  **Practical Demands:**
  *   **Local Knowledge:** Only requires knowing the specific rule in the moment.
  *   **Duration:** Applies even to a day-tripper.
  *   **Guest Status:** Irrelevant; applies to everyone equally.
  *   **Inability to Comply:** If you can't comply, you simply suffer the consequences (confusion, higher prices, strange looks).
  **Verdict:** **'You were a bit awkward.'** It suggests you made things unnecessarily difficult for yourself, not that you committed a moral breach.

  ### 2. The Etiquette Reading (Manners Maketh Man)
  **The Claim:** Politeness is local. There is no universal standard of manners, only local codes. To ignore the local code is to be rude, regardless of your intent.
  **Plausibility:** High. This is the standard usage in social settings.
  **Practical Demands:**
  *   **Local Knowledge:** Requires prior research or quick adaptation. Ignorance is an excuse only once.
  *   **Duration:** Applies immediately upon entry to the social sphere.
  *   **Guest Status:** Guests are often held to a *higher* standard of politeness than locals, not lower.
  *   **Inability to Comply:** If you physically cannot comply, you must apologise profusely.
  **Verdict:** **'You did something wrong.'** Specifically, you were rude. It is a normative breach of social conduct, though not necessarily a moral sin.

  ### 3. The Social Harmony Reading (Don't Embarrass Your Hosts)
  **The Claim:** Your behaviour reflects on the people you are with. By flouting local norms, you signal that your companions lack influence or taste, or that they tolerate bad behaviour.
  **Plausibility:** Very High. Given this was your girlfriend's father, this is likely the engine driving the comment.
  **Practical Demands:**
  *   **Local Knowledge:** You are expected to know whatever your hosts expect you to know.
  *   **Duration:** Applies whenever you are in the company of locals.
  *   **Guest Status:** Crucial. As a guest, you are an ambassador for your host's judgment.
  *   **Inability to Comply:** You must signal deference to the host's norms even if you can't follow them.
  **Verdict:** **'You did something wrong.'** You breached a duty of loyalty to your hosts. This carries more weight than simple rudeness; it is a relational betrayal.

  ### 4. The Coordination Reading (Keep the Machine Running)
  **The Claim:** Conventions exist to solve coordination problems (e.g., which side of the escalator to stand on). The specific rule matters less than everyone following the *same* rule. Deviating causes system friction.
  **Plausibility:** Medium. Strong for queue-jumping or escalators; weaker for tipping (which is distributive, not coordinative).
  **Practical Demands:**
  *   **Local Knowledge:** Must know the convention that facilitates the coordination.
  *   **Duration:** Applies as long as you are using the shared resource.
  *   **Guest Status:** Irrelevant. The system breaks regardless of who pushes the button.
  *   **Inability to Comply:** If you can't comply, you become a bottleneck.
  **Verdict:** **'You were disruptive.'** It's less about 'wrong' and more about 'inefficient' or 'obstructive'. However, persistent disruption is treated as a wrong.

  ### 5. The Fair Play Reading (No Free-Riding)
  **The Claim:** Locals uphold conventions that may be costly to them (e.g., tipping, queuing) because they believe everyone contributes. If you benefit from the local order but refuse to pay the 'entry fee' of compliance, you are free-riding.
  **Plausibility:** Medium. Works well for taxes or queuing; debatable for tipping (is the service worker part of the 'local order' or a private transaction?).
  **Practical Demands:**
  *   **Local Knowledge:** Must understand the *cost* locals bear to maintain the norm.
  *   **Duration:** Applies once you start benefiting from the system.
  *   **Guest Status:** Guests benefit from the order, so they owe the contribution.
  *   **Inability to Comply:** If you genuinely cannot pay the cost, you should abstain from the benefit.
  **Verdict:** **'You did something wrong.'** This is a moral claim about fairness and exploitation.

  ### 6. The Implicit Contract Reading (Terms of Entry)
  **The Claim:** By entering a jurisdiction (a country, a restaurant, a home), you tacitly agree to abide by its rules. It is a conditional permission.
  **Plausibility:** Medium. Legally true for laws; socially contentious for norms.
  **Practical Demands:**
  *   **Local Knowledge:** Presumed knowledge. 'Ignorance of the law' applies by analogy.
  *   **Duration:** From the moment of entry to the moment of exit.
  *   **Guest Status:** Guests are bound by the house rules.
  *   **Inability to Comply:** If you cannot accept the terms, you should not have entered.
  **Verdict:** **'You did something wrong.'** You breached an agreement.

  ### 7. The Moral Relativist Reading (There Is No 'Right')
  **The Claim:** Moral truth is geographic. Tipping isn't objectively right or wrong; it is only 'right' here and 'wrong' there. Your home standard has no validity in this context.
  **Plausibility:** Low. People rarely mean this philosophically. They usually mean 'follow the rule', not 'the rule creates the morality'.
  **Practical Demands:**
  *   **Local Knowledge:** Total submission to local definition of good/bad.
  *   **Duration:** Permanent while present.
  *   **Guest Status:** Irrelevant.
  *   **Inability to Comply:** Implies you are morally incapacitated in this region.
  **Verdict:** **'Your standard is invalid.'** This doesn't just say you were wrong; it says your moral compass is broken here.

  ***

  ### Analysis of the Father-in-Law's Usage

  **Which reading shuts down the argument?**
  When your girlfriend's father used the phrase, he was almost certainly deploying a hybrid of **Reading 2 (Etiquette)** and **Reading 3 (Social Harmony)**.
  The phrase is a conversation-stopper because it frames your refusal to tip not as a principled stand based on your home culture, but as a failure of adaptation. It shifts the burden of proof entirely onto you. By invoking 'Rome', he implies that the local custom possesses an authority that overrides your personal history. It is rarely used to invoke Moral Relativism (Reading 7) in a serious philosophical sense; rather, it is used to assert that *local authority trumps personal conviction*.

  **Is the 'Interesting Version' carrying the weight?**
  You asked whether the 'conventions bind because of what they do for the people who depend on them' (a mix of Reading 4 Coordination and Reading 5 Fair Play) is doing the work, or if he just meant 'don't embarrass us'.

  In the case of **queue-jumping or escalators**, the Coordination/Fairness reading is genuine. If you stand on the right in London, you physically block the flow. The convention exists for mutual benefit.
  However, in the case of **tipping**, the Coordination argument collapses. The waiter gets paid (or not) regardless of whether you follow the 'Roman' custom, and the local diners are not materially harmed by your frugality. The Fair Play argument is weak unless one argues that tipping subsidises the wage structure for everyone else, which is a stretch for a single meal.

  Therefore, in the tipping scenario, the 'Interesting Version' is likely window dressing. The heavy lifting is being done by **Reading 3 (Social Harmony)**. He is not worried about the waiter, nor the economic ecosystem of the restaurant. He is worried that you made *him* look like a man who cannot control his future son-in-law, or that you marked his family as cheap or ignorant.

  **Are any readings the same in different clothes?**
  *   **Prudential (1) and Social Harmony (3)** often overlap in practice. 'Don't make a scene' is both good advice for your peace of mind and good manners for your host's sake. However, the *justification* differs: one is self-interest, the other is loyalty.
  *   **Coordination (4) and Fair Play (5)** are siblings. Coordination focuses on the *function* (the system works), while Fair Play focuses on the *distribution of burden* (you aren't pulling your weight). In many contexts (like queuing), they amount to the same complaint: you are disrupting the equilibrium everyone else is maintaining.

  **Summary Verdict**
  If you want to know where you stand:
  *   If he cares about **escalators**, he is a **Coordination** theorist.
  *   If he cares about **tipping**, he is a **Social Harmony** theorist.
  *   If he cares about **jaywalking**, he is likely a **Prudential** theorist (don't get hit) masquerading as a **Contract** theorist (it's the law).

  He told you that you did something wrong, but the 'wrong' was likely that you prioritised your own cultural consistency over his social comfort. The 'Rome' line was a polite way of saying: 'In this family, and in this country, we smooth the wheels, even if it costs a bit extra.'
