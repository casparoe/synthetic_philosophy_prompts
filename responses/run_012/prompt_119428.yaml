answer: |-
  # Q&A PREP SHEET: "The Separateness of Persons & The Ordinalist Ghost"

  **Strategic Concession (First 30 Seconds)**
  *Do not start by doubling down on the thesis.* Start by validating their intuition.
  **Say:** "I want to be clear: I am not denying that persons are separate, nor that this matters. My claim is narrower: that the *argumentative work* 'separateness' is doing in critiques of utilitarianism is actually being done by a skepticism about interpersonal comparisons, not by the metaphysical fact of distinctness itself. I want to save the separateness of persons from doing work it cannot sustain, so we can locate the real disagreement about aggregation."

  ---

  ### 1. The Scanlonian: "Justification, Not Measurement"
  **Vocabulary:** Reasonable rejection, generic reasons, justificatory equilibrium.
  **The Objection:** "You treat the Separateness of Persons (SoP) as an epistemic or measurement problem (can we compare?). But for contractualists, it's a justificatory one. Even if we *could* perfectly compare your pain against my gain, the individual who suffers the loss can still *reasonably reject* the principle that allows their sacrifice for the aggregate. The force of SoP isn't about ordinalism; it's about the standing of the individual to demand a justification that doesn't treat them as a container."
  **Your Reply (2 min):** "I agree that justification is key, but ask *why* the rejection is reasonable. If we grant interpersonal comparisons, the 'loser' can see their loss is outweighed by a catastrophic loss avoided for others. The 'standing to complain' relies on the idea that their loss is *incomparable* or *lexically prior* to the gain. If we allow comparison, the complaint shifts from 'you can't count my loss against theirs' to 'my loss is weightier than you claim.' SoP becomes a claim about weights, not a structural barrier to counting. The 'independent' objection vanishes; it becomes a standard dispute about marginal utility."
  **Soft Spot:** You are assuming the contractualist cares about weights. They may insist the *procedure* of aggregation itself is the violation, regardless of weights.

  ### 2. The Rawlsian: "The Basic Structure & Reciprocity"
  **Vocabulary:** Social union, reciprocity, basic structure, strains of commitment.
  **The Objection:** "Rawls uses SoP to mark the boundary of the 'social union.' It's not about netting utility; it's about the terms of cooperation. If you allow aggregation across persons simply because comparisons are possible, you turn society into a single agent maximizing a value. This violates reciprocity. Citizens aren't resources for the total good; they are co-authors of the rules. Your 'ordinalist' diagnosis misses the political point: SoP protects the distinctness of claims in the basic structure."
  **Your Reply (2 min):** "Rawls fears society becoming a 'super-person.' But cost-benefit analysis (CBA) doesn't require a super-person; it requires a metric for adjudicating conflicting claims among distinct persons. If we deny IWC (Interpersonal Welfare Comparisons) to protect distinctness, we cannot justify redistribution either, as that requires comparing the poor's gain to the rich's loss. SoP cannot be the shield for redistribution *and* the sword against utilitarianism. We need a principle *other* than separateness to block aggregation if we want to keep the welfare state."
  **Soft Spot:** Rawlsians will argue redistribution is based on *primary goods*, not welfare, dodging your IWC trap.

  ### 3. The Kantian: "Dignity vs. Value"
  **Vocabulary:** Ends in themselves, dignity, price, respect.
  **The Objection:** "You reduce persons to 'loci of value.' But Kantians hold that persons have dignity, not value. Dignity is beyond comparison. The SoP objection isn't that we can't measure the loss; it's that aggregating losses treats the person as a means to the total. Even if your ordinalist premise is true, the utilitarian calculus remains a violation of respect. You've solved the measurement problem but ignored the moral status problem."
  **Your Reply (2 min):** "If dignity precludes all trade-offs, then no risk imposition is permissible (e.g., speed limits kill some to save others). We implicitly accept aggregation in rights-based frameworks all the time. The Kantian objection usually hides a premise about *thresholds*: some losses are too great. But that is a claim about the *magnitude* of the loss (which requires comparison), not the *fact* of separateness. If you admit thresholds, you admit aggregation up to that point. SoP is doing no work there."
  **Soft Spot:** The "Threshold" move is controversial. A hard Kantian will deny thresholds exist.

  ### 4. Welfare Economist 1 (Social Choice): "The Informational Basis"
  **Vocabulary:** Informational basis, Arrow's Theorem, welfarism, non-utilitarian social welfare functions.
  **The Objection:** "You claim SoP collapses if we allow IWC. But social choice theory shows we can have IWC without utilitarianism. We can use a prioritarian SWF (Social Welfare Function) or egalitarian SWF. We can compare persons but still weight the worse-off more heavily. SoP isn't about the *possibility* of comparison; it's about the *refusal of utilitarianism* as the specific rule of aggregation. You're attacking a straw man."
  **Your Reply (2 min):** "Exactly. My point is that SoP is not the *reason* we choose prioritarianism over utilitarianism. If you choose prioritarianism, you are already aggregating; you're just weighting differently. The SoP objection is typically wielded to say 'you can't aggregate at all.' If the critic retreats to 'you must aggregate with weights,' they have conceded my thesis: SoP is not an independent objection to aggregation *simpliciter*, but a plea for a different weighting scheme."
  **Soft Spot:** Distinguishing "aggregation" from "utilitarian aggregation" is tricky. They may argue SoP specifically bans *sum-ranking*.

  ### 5. Welfare Economist 2 (CBA): "Kaldor-Hicks & Potential Compensation"
  **Vocabulary:** Kaldor-Hicks, Pareto, revealed preference, potential compensation.
  **The Objection:** "You argue that denying IWC indicts CBA. But modern CBA doesn't require cardinal IWC. It uses Kaldor-Hicks: winners *could* compensate losers. We don't need to compare utility across persons, only check if the surplus exists. SoP is compatible with CBA because CBA respects property entitlements first. Your 'proves too much' argument fails because CBA survives without the premise you think is necessary."
  **Your Reply (2 min):** "Kaldor-Hicks is unstable without IWC. If compensation is not *actual*, it's a hypothetical fiction. If the loser is not compensated, their loss is real. To say the policy is 'efficient' despite their uncompensated loss implies their loss is outweighed by the gain. That *is* an interpersonal comparison, disguised as efficiency. If you take SoP seriously (no netting across persons), uncompensated losses are veto-points, which paralyzes CBA. You can't have it both ways."
  **Soft Spot:** Economists are very attached to Kaldor-Hicks. They may insist efficiency is distinct from equity.

  ### 6. The "Intuition Pump": "The Utility Monster"
  **Vocabulary:** Marginal utility, diminishing returns, extreme sacrifice.
  **The Objection:** "If SoP is not a barrier, and IWC is allowed, what stops us from feeding the 'Utility Monster'? If one person gains immense utility from the suffering of others, and we can compare them, your view seems to mandate the sacrifice. SoP was the bulwark against this. If you remove it, you endorse extreme exploitation provided the math works."
  **Your Reply (2 min):** "The bulwark against the Monster isn't SoP; it's diminishing marginal utility and empirical facts about human psychology. The Monster is a metaphysical possibility, not a policy risk. But more importantly: If the Monster's gain is *actually* greater than the victims' loss (granted IWC), and you still object, your objection is based on a *constraint* (rights/dignity), not on *separateness*. Again, SoP is dropping out of the explanation. Don't blame separateness for the Monster; blame the lack of side-constraints."
  **Soft Spot:** If they press that "side-constraints" *are* the operationalization of SoP, you risk circularity.

  ---

  ### The Question You Hope Nobody Asks

  **"If the Separateness of Persons is not the objection to Utilitarianism, and you grant Interpersonal Comparisons, what *specific* principle do you propose to replace it that protects the minority from the majority without collapsing into the very ordinalism you claim is the hidden premise?"**

  **Why this hurts:** It forces you to positive engineering. If you propose a constraint (e.g., rights), they will ask why that constraint isn't *just* the Separateness of Persons re-described. If you propose a different weighting (e.g., prioritarianism), they will ask why *that* isn't just a form of aggregation that still violates the individual's distinctness. It exposes that you may have cleared the ground but built nothing on it.
