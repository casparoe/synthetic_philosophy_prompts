      2.  *Scanlonian:* The "Individual Complaint." Even if we *can* compare, why *should* we aggregate? It's about reasonable rejection, not cardinal utility.
      3.  *Economist 1 (Social Choice):* Arrow's Theorem. IWC solves Arrow, but at what cost to informational basis?
      4.  *Economist 2 (CBA):* The "Proves Too Much" reversal. You say denying IWC kills CBA. But CBA works *without* full IWC via Kaldor-Hicks.
      5.  *Kantian:* The "Container" Objection. Utilitarianism treats persons as vessels, regardless of IWC.
      6.  *General Political Theory:* The "Distinctness" vs. "Separateness" distinction. You concede distinctness, but miss the normative weight of separateness.
      7.  *The "Slippery Slope" (Damage Control):* If SoP isn't the barrier, why not extreme sacrifice?
      8.  *The "Motivation" Check:* Why does this matter? (Maybe too meta).

      *Selecting the Top 6-8 by Damage:*
      1.  Scanlonian: Justification vs. Measurement (High Damage - strikes at the core premise).
      2.  Rawlsian: Society as a System of Cooperation (High Damage - recontextualizes SoP).
      3.  Kantian: Dignity/Means-Ends (Medium-High - bypasses welfare entirely).
      4.  Economist 1: IWC Coherence (Medium - technical but undermines the "collapse" claim).
      5.  Economist 2: Kaldor-Hicks/Pareto (Medium - challenges the "proves too much" claim).
      6.  General: The "Demandingness"/Sacrifice intuition (Medium - practical implication).
      7.  Rawls/Scanlon Hybrid: The "Priority of the Right" (SoP is deontological, not axiological).

      *Let's narrow to the strongest 6.*

  4.  **Drafting the Content (Iterative refinement):**

      *   *Concession:* Need to acknowledge the intuitive pull of SoP immediately to disarm hostility.
      *   *Objection 1 (Scanlonian):* Focus on "Reasonable Rejection." Even if I can measure your pain vs. my gain, you can still reasonably reject the policy.
      *   *Objection 2 (Rawlsian):* Focus on "Social Union." It's not about netting, it's about reciprocity.
      *   *Objection 3 (Kantian):* Focus on "Respect." Aggregation disrespects the boundary, regardless of measurement.
      *   *Objection 4 (Economist):* Focus on "Informational Basis." IWC is normatively contentious, not just technically hard.
      *   *Objection 5 (Economist 2):* Focus on "Potential Compensation." CBA doesn't need actual IWC, just potential.
      *   *Objection 6 (General):* Focus on "The Intuition." If SoP doesn't stop aggregation, what protects the minority?

