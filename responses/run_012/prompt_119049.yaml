answer: |-
  To specify the desiderata for a theory of compatriot partiality is to map the boundaries of the debate rather than occupy a position within it. The following specification distinguishes between conceptual necessities (non-negotiable) and substantive commitments (contestable), integrates the hard cases your students raise, and isolates the structural tensions that prevent a unified theory from emerging.

  ### I. Conceptual Distinctions
  Before listing the desiderata, three distinctions must be held separate to prevent category errors.

  1.  **Normative Strength:**
      *   **Special Claim:** The co-national has a *right* to be favored (correlates to a duty on the agent).
      *   **Permission:** The agent is *allowed* to favor the co-national (no duty to favor, but no wrong in doing so).
      *   **Requirement:** The agent is *obligated* to favor the co-national (wrong not to favor).
      *   *Specification:* An adequate theory must specify which of these three applies in which context. A theory that collapses Permission into Requirement becomes overly demanding; one that collapses Claim into Permission renders the partiality morally inert.

  2.  **The Ground of the Tie:**
      *   **Relationship-based:** Obligations arise from the intrinsic value of the association (identity, culture, history).
      *   **Scheme-based:** Obligations arise from instrumental cooperation (reciprocity, fair play, joint production of goods).
      *   *Specification:* The theory must declare whether the *source* of the partiality is who we *are* together or what we *do* together.

  3.  **The Agent:**
      *   **State Partiality:** Institutional allocation of resources, border control, welfare provision.
      *   **Individual Partiality:** Personal sacrifice, rescue, prioritization in private transactions.
      *   *Specification:* **These require two separate specifications.** While they may share a common ground (e.g., both rely on national identity), the normative logic differs. State partiality is bound by public justice and coercion; individual partiality is bound by personal integrity and supererogation. A theory that explains why a state may restrict welfare to citizens does not automatically explain why an individual must rescue a co-national over a foreigner in a lifeboat scenario.

  ### II. The Desiderata
  The following requirements are divided into **Non-Negotiable** (conditions of adequacy for *any* theory claiming to address compatriot partiality) and **Camp Commitments** (substantive choices that define specific schools of thought).

  #### A. Non-Negotiable Requirements
  *These must be met to avoid conceptual incoherence or empirical falsification.*

  1.  **The Strangers Constraint (Non-Voluntary Scope)**
      *   *The Case:* Two co-nationals who have never met and whose state provides no benefit to either.
      *   *Requirement:* The theory must explain the persistence of the tie absent interaction or benefit.
      *   *Consideration:* If the theory relies solely on reciprocity or actual consent, it fails to capture the "national" aspect, reducing it to friendship or contract. It must account for ascriptive bonds.

  2.  **The Resident Constraint (Status vs. Function)**
      *   *The Case:* A long-term resident bearing all burdens (taxes, laws) but holding foreign citizenship.
      *   *Requirement:* The theory must specify whether legal status or social membership generates the claim.
      *   *Consideration:* A theory that privileges legal citizenship exclusively risks legitimizing caste systems; one that privileges residence exclusively dissolves the distinction between compatriot and neighbor. It must draw a principled line.

  3.  **The Exit Constraint (Dissolution Conditions)**
      *   *The Case:* A co-national who has renounced citizenship and left vs. a diaspora claiming nationality without territory.
      *   *Requirement:* The theory must define the conditions under which the tie is severed.
      *   *Consideration:* If the tie is inescapable, it resembles bondage; if it is too easily severed by exit, it resembles a subscription service. The theory must explain why the renouncer is free but the diaspora member might remain bound (or vice versa).

  4.  **The Compatibility Constraint (Moral Equality)**
      *   *Requirement:* The partiality must be justifiable to the outsider who is not favored.
      *   *Consideration:* Any theory that validates partiality must show how it remains consistent with the fundamental moral equality of all persons. It cannot simply assert "compatriots matter more" as a brute fact.

  #### B. Camp Commitments
  *These are not errors if violated, but choices that align the theory with specific philosophical traditions.*

  5.  **The Voluntarist Commitment (Liberal/Contractualist)**
      *   *Requirement:* The ground of the tie must be something the agent can be said to have taken on (tacit consent, democratic authorization).
      *   *Consideration:* Prioritizes autonomy. *Risk:* Fails the Strangers Constraint.

  6.  **The Ascriptive Commitment (Nationalist/Communitarian)**
      *   *Requirement:* The ground of the tie must explain why *nationality* specifically, rather than any other group (e.g., hobbyists, neighbors), commands priority.
      *   *Consideration:* Prioritizes identity and stability. *Risk:* Fails the Compatibility Constraint if it relies on intrinsic superiority.

  7.  **The Territorial Commitment (Statist)**
      *   *Requirement:* Partiality is tied to the jurisdiction of the state, not the ethnicity of the people.
      *   *Consideration:* Prioritizes order and law. *Risk:* Fails the Diaspora Case (why do we owe expats anything?) and the Resident Case (why don't we owe residents everything?).

  8.  **The Maximizing Commitment (Cosmopolitan)**
      *   *Requirement:* Partiality is only permitted if it ultimately maximizes global welfare (instrumental partiality).
      *   *Consideration:* Prioritizes outcomes. *Risk:* Collapses the Special Claim into a Permission; makes the tie contingent on efficiency.

  ### III. The Impossible Pair
  You suspect the tension lies between agency and specificity. You are correct. The two requirements that cannot be jointly satisfied are:

  1.  **The Voluntarist Ground:** The obligation must stem from an act of will (consent, undertaking, reciprocal acceptance) attributable to the agent.
  2.  **The Ascriptive Scope:** The obligation must track the specific contours of nationality (birth, citizenship, cultural membership) rather than the contours of voluntary association.

  **Why they are incompatible:**
  If you satisfy the **Voluntarist Ground**, you cannot explain why the obligation stops at the border of the nation-state. I may voluntarily cooperate with a foreign colleague more than a co-national stranger. If I am bound only by what I take on, "nationality" becomes morally arbitrary.
  If you satisfy the **Ascriptive Scope**, you cannot explain how the obligation respects the agent's autonomy. I did not choose my birth, my culture, or often my citizenship. If I am bound by these facts, the obligation is not something I "took on."
  *Result:* A theory must sacrifice either the purity of liberal autonomy (Voluntarism) or the specificity of national boundaries (Ascription). Most "Liberal Nationalist" theories attempt to bridge this via "tacit consent" or "fair play," but these are notoriously vulnerable to the Strangers Constraint.

  ### IV. The View-Excluding Requirement
  The single requirement that does the most work to exclude the main existing families of view is **The Strangers Constraint (Non-Voluntary Scope)**.

  *   **Excludes:** Strict Contractualism, Fair Play Theory, and Reciprocity Theory.
  *   **Reasoning:** These theories ground obligation in interaction, benefit received, or cooperative schemes. They cannot generate a duty toward a co-national with whom one has never interacted and from whom one receives no benefit (the "stranger" case).
  *   **Survivors:** Only **Associativism** (obligations arise from the value of the relationship itself) and **Natural Duty Views** (we have a duty to support just institutions which happen to be national) can clear this hurdle.
  *   **Pedagogical Value:** forcing students to see that if they want to maintain that we owe something to a co-national stranger, they must abandon the idea that political obligation is a quid-pro-quo. This clears the field of the most intuitive but philosophically fragile accounts.

  ### Summary for Class
  When evaluating readings, ask:
  1.  Does it distinguish between what the **State** may do and what the **Individual** must do?
  2.  Does it solve the **Strangers Case** without abandoning **Moral Equality**?
  3.  Does it admit it cannot satisfy both **Voluntarism** and **Ascriptive Scope** simultaneously?

  If a text claims to do all three without remainder, it is likely obscuring the trade-offs. Your final unit should focus on which trade-off is the least costly.
