answer: |-
  This is a classic trap in medieval political thought: the "Aquinas on Tyrannicide" industry is vast, but much of it is circular because scholars project early modern resistance theory back onto the *Angelico*. You are right to be suspicious of the "three sentences" (mostly *De Regno* I.6 and *Sent.* II, d. 44).

  If you want a **defended agenda** rather than a survey, you must avoid the question "Did Aquinas support tyrannicide?" (The answer is always "It's complicated") and instead ask "Under what ontological conditions does authority dissolve?"

  Here is a prioritized agenda for two chapters, ordered by logical dependency (upstream to downstream), filtered for tractability (textual/philosophical, not dogmatic), with a list of overrated debates to avoid.

  ---

  ### The Agenda: Logical Priority & Tractability

  #### 1. The Textual Foundation: *De Regno* Authenticity and the "Two Tyrants" Distinction
  **Status:** **Upstream (Foundational).** If you cannot delimit the corpus, you cannot build a theory.
  **The Question:** Is the tension between *De Regno* (which seems to forbid private action) and the *Sentences* Commentary (which seems to allow it) a contradiction, a development, or a distinction between *tyrannus ex defectu tituli* (usurper) and *tyrannus ex parte exercitii* (abuser)?
  **Why it matters:** Most scholarship assumes *De Regno* is Aquinas's "mature political view." If Ptolemy of Lucca wrote Book II and heavily edited Book I (as the Leonine editors suggest), basing your theory on *De Regno* without qualification is risky.
  **Tractability (High):** This is pure textual criticism and Latin philology. You don't need theology; you need to compare the *Sentences* commentary (early) with *De Regno* (late/edited) and the *Summa* (middle). Look for vocabulary shifts (*sedition*, *tyrannis*, *occisio*).
  **Move Up/Down:**
  *   **Move Up:** If your dissertation argues for a developmental arc in Aquinas's thought.
  *   **Move Down:** If you treat the corpus as a "system" and bracket authorship issues (risky but common).
  *   **Recommendation:** Make this the methodological preamble to Chapter 1. Do not let it consume a whole chapter unless you are doing philology. Assume the distinction between *usurper* and *abuser* is the key to resolving the textual tension.

  #### 2. The Ontology of Authority: When does a Ruler become a Private Person?
  **Status:** **Upstream (Conceptual).** You cannot determine *who* can kill the tyrant until you determine *what* the tyrant is.
  **The Question:** Does tyranny constitute a forfeiture of office (*ipso facto* loss of jurisdiction), or does it require a declaratory sentence by a superior?
  **Why it matters:** This solves the "Private vs. Public" debate (see below). If the tyrant is a *tyrannus ex defectu tituli* (usurper), he never had public authority; he is a private aggressor (*latro*). Killing him is not tyrannicide; it is self-defense against a criminal. If he is a *tyrannus ex parte exercitii* (legit title, bad rule), he retains the *character* of the office until deposed.
  **Tractability (High):** This relies on Aquinas's metaphysics of law and office (*Summa* I-II, q. 90-97; *De Regno*). You are analyzing the concept of *iurisdictio* and the *bonum commune*. It avoids dogmatic theology by focusing on natural law and political metaphysics.
  **Move Up/Down:**
  *   **Move Up:** This should be **Chapter 1**. It grounds the entire argument.
  *   **Move Down:** Only if you are strictly doing intellectual history (reception) rather than reconstructing Aquinas's argument.
  *   **Recommendation:** This is your strongest philosophical contribution. It moves the debate from "Is violence allowed?" to "What is the status of the actor?"

  #### 3. The Mechanism of Deposition: Public Authority vs. Private Zeal
  **Status:** **Downstream (Applied).** This depends entirely on Question 2.
  **The Question:** If the tyrant retains office (abuser), who has the authority to depose him? Is "public authority" a procedural requirement (a vote) or a metaphysical status (the *res publica* as a mystical body)?
  **Why it matters:** This addresses your worry about the Pope. Aquinas rarely specifies the *Pope* as the depositor in political texts; he speaks of a "superior" (*superior*). In the *Sentences*, he allows for action if there is no superior. In *De Regno*, he warns against private presumption.
  **Tractability (Medium):** You must navigate the ecclesiological minefield without doing theology. Focus on the term *multitudo* and *res publica*. Can the *res publica* act if the head is corrupt?
  **Move Up/Down:**
  *   **Move Up:** If your dissertation is about the origins of popular sovereignty.
  *   **Move Down:** If you find that for Aquinas, this is always a "last resort" miracle case and not a political theory proper.
  *   **Recommendation:** This is **Chapter 2**. It applies the ontology from Chapter 1 to the specific act of removal.

  ---

  ### The "Overrated" List (What to Avoid)

  You asked which debates are just circling the same three sentences. Here is where you should save your word count:

  **1. "Did Aquinas Change His Mind?" (The Developmental Hypothesis)**
  *   **Verdict:** **Overrated.**
  *   **Why:** Scholars love to plot a trajectory from "radical young Aquinas" (*Sentences*) to "conservative old Aquinas" (*De Regno*). This is biographical speculation. It is more fruitful to treat the texts as addressing different *cases* (usurper vs. abuser) rather than different *times*. Proving a change of mind adds little to the political theory itself.

  **2. "Does the Pope have the Right to Depose?" (The Hierocratic Debate)**
  *   **Verdict:** **Overrated (for your constraints).**
  *   **Why:** You said you don't want to do theology. This question immediately drags you into the *potestas directa/indirecta* debates of the 14th and 15th centuries (John of Paris, Ockham, Conciliarists). Aquinas is notoriously vague here. Unless you are tracing the *reception* of Aquinas by James of Viterbo or Giles of Rome, skip it. Aquinas's "superior" is often ambiguous intentionally.

  **3. "Private Citizen Tyrannicide" (The John of Salisbury Echo)**
  *   **Verdict:** **Overrated as a binary.**
  *   **Why:** The debate "Yes he allows it" vs. "No he forbids it" is stale. It ignores the *Sentences* distinction: a private person cannot kill a *public* tyrant, but can kill a *private* aggressor. The nuance is in the definition of the tyrant, not the license of the killer. Don't write a chapter just to say "It depends."

  **4. "Is *De Regno* Actually Aquinas?" (Pure Philology)**
  *   **Verdict:** **Overrated as a standalone chapter.**
  *   **Why:** Unless you are in a philology department, a whole chapter on Ptolemy of Lucca's handwriting is a trap. Acknowledge the uncertainty, delimit the text you are using (e.g., "Taking *De Regno* I as authentic..."), and move on. The political thought exists in the reception regardless of the authorship.

  ---

  ### Strategic Advice for the "No Theology" Constraint

  You mentioned you work on texts and Latin and don't want to do theology. This is tricky with Aquinas, but manageable if you frame it correctly:

  1.  **Treat Theological Premises as Political Data:** When Aquinas cites Romans 13 ("Let every soul be subject to higher powers"), do not analyze the exegesis. Analyze how he uses the citation to construct a limit on political obligation. Treat the *Sacra Pagina* as a source of legal maxims, not dogma.
  2.  **Focus on *Lex* and *Iurisdictio*:** Anchor your argument in Aquinas's legal theory (*Summa* I-II). Tyranny is a violation of *lex* (law). Authority is a function of *iurisdictio* (jurisdiction). These are juridical concepts that can be analyzed philosophically without entering into soteriology or grace.
  3.  **The "Glossing Lombard" Worry:** You suspected he's just glossing Peter Lombard in the *Sentences*.
      *   *Test:* Compare the *sed contra* and *respondeo* with Lombard's text. If Aquinas expands the *respondeo* with Aristotelian terminology (*politia*, *bonum commune*) not found in Lombard, it's his view.
      *   *Strategy:* If it turns out he is just glossing, **use that.** It shows that in his early career, tyrannicide was a standard *sententia* he hadn't yet problematized. This supports the "Two Tyrants" distinction (Question 1 above).

  ### Proposed Chapter Outline

  *   **Chapter 1: The Ontology of the Tyrant.**
      *   Analyze the distinction between *defectus tituli* and *ex parte exercitii* across the corpus.
      *   Argue that for Aquinas, the usurper is a private criminal (licit to kill via self-defense), while the abuser remains a public person (illicit to kill privately).
      *   *Texts:* *De Regno* I.6, *Sent.* II, d. 44, *Summa* II-II q. 42.
  *   **Chapter 2: The Constitution of the *Res Publica* in Vacuo.**
      *   If the tyrant is a public person, who can remove him?
      *   Analyze Aquinas's concept of "public authority." Is it the Pope? The Nobles? The *Multitudo*?
      *   Argue that Aquinas leaves this deliberately under-specified because he views deposition as an extraordinary, quasi-miraculous event, not a constitutional procedure.
      *   *Texts:* *De Regno* I.7, *Summa* II-II q. 64.

  This agenda moves you away from the "Did he or didn't he?" trap and toward a reconstruction of the **conditions of political legitimacy**, which is where the live debates actually are (e.g., connecting Aquinas to later Conciliarism or early modern resistance theory).
