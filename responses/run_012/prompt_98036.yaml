  **CLINICAL ETHICS COMMITTEE: CASE OPINION DRAFT**
  **Case ID:** 24-10-B (Locked-In Syndrome / BCI Communication)
  **Date:** October 24, 2024
  **To:** Attending Physician, Patient Family (Wife/Proxy), Trust Legal Counsel
  **From:** Clinical Ethics Committee
  **Subject:** Recommendation Regarding Request for Ventilator Withdrawal

  ### I. Summary of Clinical and Ethical Conflict
  The patient is a 44-year-old male, three years post-brainstem stroke, diagnosed with locked-in syndrome (LIS). He retains vertical eye movement and blinking. For eight months, he has utilized a hybrid eye-tracking/EEG brain-computer interface (BCI) to communicate. Validation testing indicates a signal accuracy of approximately 70–75%.

  Two weeks ago, across three sessions, the device recorded the patient's request to withdraw ventilatory support. This request contradicts prior expressed values (per spouse) but aligns with the health-care proxy's understanding of his current suffering (per adult daughter). The clinical team is divided; nursing staff have raised conscientious objections to participating in weaning conversations.

  The core ethical conflict is not whether a life with LIS is worth living, but whether the request to end that life is genuinely the patient's. We face two reciprocal risks: honoring a machine error (causing death by false positive) or ignoring a genuine plea (causing suffering by false negative).

  ### II. Committee Reasoning

  **1. On the Validity of the Device (The "Witness" Problem)**
  The Committee rejects the proposal to treat the BCI output as testimony requiring external corroboration (e.g., prior written notes, verbal confirmation). In a patient with total motor paralysis save for eye movement, such corroboration is physically impossible to obtain. To require it is to impose a standard of evidence that guarantees his voice will never be heard.

  However, the Committee also rejects the "Asymmetric Deference" model proposed by Neurology (deferring to the device only when it aligns with pre-stroke values). This standard assumes a person cannot fundamentally change their moral or existential outlook after a catastrophic injury. It effectively grants the patient's past self a veto over his present self. In matters of bodily integrity and life-sustaining treatment, the present competent voice must carry authority, even if it contradicts the past.

  **2. On the Threshold of Certainty**
  While we must listen to the device, we cannot treat a 75% accuracy rate as sufficient for an irrevocable action. In a binary choice (Yes/No), a 25% error rate is statistically unacceptable for life-or-death decisions. If the machine misreads "No" as "Yes" one time in four, we cannot act on a single cluster of requests.

  Therefore, the device is neither a liar nor a gospel. It is a compromised channel. We must treat the request as *provisionally valid* but requiring a higher threshold of signal stability before action can be taken.

  **3. On Surrogate Decision-Making**
  The adult daughter holds valid Health Care Proxy designation. The spouse's objection is noted, specifically her concern that the device "isn't him." However, unless the patient is deemed incapable of communicating *at all*, the Proxy's role is to interpret the patient's current wishes, not to override them based on her memory of his past self. The conflict here is epistemic (is the signal real?), not legal (who has authority?).

  ### III. Recommendation

  The Committee recommends **Deferral of Action with Mandated Re-Validation.** We do not recommend immediate withdrawal, nor do we recommend dismissing the request. We recommend a 30-day "Communication Optimization Period" prior to any decision on withdrawal.

  **Specific Directives:**
  1.  **Status Quo Maintenance:** Life-sustaining treatment continues during this period. Palliative sedation or anxiety management should be optimized to ensure physical distress is not influencing the BCI signals.
  2.  **Independent Technical Audit:** The hospital will fund an external BCI specialist (unaffiliated with the current vendor or treating team) to recalibrate the device and run a blinded validation battery. The goal is to determine if the 75% accuracy is a ceiling or a baseline that can be improved.
  3.  **Longitudinal Consistency Check:** The request to withdraw must be reaffirmed once weekly for four weeks, using varied phrasing to avoid pattern-recognition artifacts in the software (e.g., instead of "Do you want to die?", use "Is your current condition unbearable?" and "Would you choose to stop breathing?").
  4.  **Threshold for Action:** If, after 30 days, the patient repeats the request with ≥90% consistency across independent sessions, the Committee will reconvene to authorize withdrawal. If accuracy remains at 70–75%, the request cannot be ethically honored, as the risk of fatal error remains too high.

  ### IV. The Strongest Case Against This Recommendation (Dissenting View)

  *The following argument represents the strongest ethical objection to the Committee's recommendation, articulated for the record.*

  "This recommendation prioritizes the hospital's liability over the patient's liberty. We are asking a man who cannot move, cannot speak, and cannot swallow to prove he wants to die with a level of certainty we would never demand from a walking patient. A walking patient can sign a DNR after a bad day. This patient must pass a month-long technical audit.

  By insisting on 90% accuracy, we are acknowledging that the device is the only voice he has, and then declaring that voice too quiet to be trusted. We are trapping him in a body he has explicitly rejected, using the very tool he uses to complain about it as the justification for keeping him there. Every day of this 30-day delay is a day he remains on a ventilator he has asked to be removed. If the device is wrong, we keep him alive. If the device is right, we are torturing him for a month to satisfy our own need for certainty. There is no safety here, only a slower harm. We should honor the request now, accepting that in a world of imperfect communication, the risk of freeing him is morally preferable to the certainty of caging him."

  ### V. Next Steps
  *   **Attending:** To arrange independent BCI audit by [Date].
  *   **Social Work:** To facilitate family mediation regarding the Proxy's authority vs. Spouse's concerns.
  *   **Committee:** To reconvene on [Date + 30 Days] for final determination.

  ***

  **Signed,**
  **[Your Name], Lay Member**
  **On behalf of the Clinical Ethics Committee**
