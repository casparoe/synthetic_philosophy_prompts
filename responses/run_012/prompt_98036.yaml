prompt: |-
  I'm a novelist — my last book was about a woman who gradually stops speaking, so this is kind of my territory — and I've somehow ended up as the lay/community member on my local hospital's clinical ethics committee, which mostly means I read the packet and ask the naive questions. Next Thursday we have a genuinely hard one, and the chair has asked me to draft the opinion that goes in the minutes and gets circulated to the attending, the family, and the trust's legal people. Here's the case. A 44-year-old man, three years out from a brainstem stroke, is in what the neurologists call a locked-in state: he can blink and move his eyes, that's about it. For the last eight months he's been using one of those eye-tracking/EEG hybrid spelling rigs, and after a long calibration the team says he can reliably answer yes/no questions and pick from a short menu of phrases. His accuracy on the validation battery sits around 70-75%, better on some question types than others, and nobody can tell whether the errors are random noise or the interface misreading him. Two weeks ago, across three seperate sessions, he used it to say he wants the ventilator withdrawn. He'd never said anything like that before, and his wife says it isn't him talking, it's the machine. His adult daughter, who's the health-care proxy, says the exact opposite — that he's been trying to say this for a year. The treating team is split down the middle and one of the nurses has started refusing to sit in on the weaning conversations.

  The thing I keep circling is that we built a device that reports what he wants and then we don't believe it, which is either exactly right or a kind of horror and I honestly don't know which. What I need from you is the draft opinion itself, not a general essay: a clear recommendation (do we honor the request, decline it, honor it with conditions, or go get more evidence first — and on what timeline), the reasoning laid out in a form the attending and the lawyers can actually argue with, and an honest statement of the strongest case against whatever we recommend, written so the losing side would recognize themselves in it. Two things my colleagues have floated that I'd like you to take seriously and either adopt, adapt, or kill outright: one of the neurologists wants a rule she calls asymmetric deference — we defer to whatever the device says only when it lines up with things he said before the stroke, and otherwise we discount it; and our chair thinks any output from the device should be treated like testimony from a witness with a known unreliability problem, so it needs corroboration before it can carry weight, except she can't tell me what corroboration would even look like in a man who can only move his eyes. Please be concrete about the metaphysics without giving me a philosophy lecture — the family will read this, and so will the papers, and I'd rather not be the novelist who turned a man's death into a seminar.
reasoning: |-
  Here's a thinking process that leads to the suggested draft opinion:

  1.  **Analyze the Request:**
      *   **User:** Novelist (interested in silence/communication), lay member on a hospital clinical ethics committee.
      *   **Task:** Draft the formal opinion for the committee minutes/circulation regarding a specific case.
      *   **Case Details:** 44M, 3 years post-brainstem stroke, locked-in syndrome (LIS). Uses eye-tracking/EEG hybrid BCI (Brain-Computer Interface). Accuracy 70-75%. Requests ventilator withdrawal (3 sessions, 2 weeks ago). Wife (spouse) doubts device validity ("isn't him"). Daughter (HC proxy) supports request ("been trying to say this"). Team split. Nurse refusing care.
      *   **Specific Constraints:**
          *   Must be a *draft opinion*, not an essay.
          *   Must include a clear recommendation (Honor, Decline, Conditional, or Delay/Evidence).
          *   Must include reasoning actionable for attorneys/clinicians.
          *   Must include an "honest statement of the strongest case against" the recommendation (dissenting view validation).
          *   Must address two specific proposals: "Asymmetric Deference" (Neurologist) and "Witness Corroboration" (Chair).
          *   Tone: Concrete metaphysics, no philosophy lecture, empathetic but rigorous, suitable for family/legal/clinical audience.
          *   Avoid sensationalism ("novelist who turned a man's death into a seminar").

  2.  **Determine the Ethical Core:**
      *   **Autonomy vs. Beneficence/Non-maleficence:** The patient's expressed wish (autonomy) vs. the risk of killing him based on a false positive (non-maleficence).
      *   **Epistemic Uncertainty:** The core problem is not *values* (is life worth living?) but *facts* (did he actually say this?). The error rate (25-30%) is statistically significant for a life-or-death decision.
      *   **Surrogate Conflict:** Wife vs. Daughter. Usually, spouses are default, but she is contesting the communication method. The Daughter is the designated HC proxy.
      *   **The Device:** It's a tool for communication, not a mind reader. But if the tool is the *only* voice, dismissing it risks silencing him permanently.

  3.  **Evaluate the Proposals:**
      *   **Asymmetric Deference (Neurologist):** Only trust the device if it matches pre-stroke values.
          *   *Critique:* People change their minds. Locked-in syndrome is a transformative experience. Requiring pre-stroke alignment effectively vetoes any new preference formed *in* the locked-in state. This is paternalistic.
          *   *Verdict:* Reject, but acknowledge the intuition (consistency matters).
      *   **Witness Corroboration (Chair):** Treat device output as unreliable testimony needing corroboration.
          *   *Critique:* Logistically impossible. He can't write a note. He can't speak. What corroborates a wish to die other than consistent expression of that wish?
          *   *Verdict:* Adapt. "Corroboration" shouldn't mean external evidence, but *internal consistency* over time and across modalities.

  4.  **Formulate the Recommendation:**
      *   *Immediate Withdrawal?* Too risky given the 70-75% accuracy. A 1-in-4 error rate is unacceptable for irrevocable action.
      *   *Indefinite Delay?* Violates autonomy. He is suffering (presumably, if he wants out).
      *   *Middle Path:* **Honor with Conditions / Verification Protocol.** We treat the request as *provisionally valid* but require a higher threshold of certainty before acting. We need to improve the signal-to-noise ratio.
      *   *Timeline:* 30-60 days for intensified validation.
      *   *Action:* Do not withdraw yet. Do not ignore the request. Engage in a "Communication Optimization Period."

  5.  **Drafting - Section by Section:**

      *   **Header:** Standard Committee formatting (Case ID, Date, Participants).
      *   **Summary of Facts:** Concise, neutral.
      *   **Ethical Analysis/Reasoning:**
          *   Acknowledge the "Horror": If we ignore the device, we might be silencing him. If we trust it blindly, we might be killing him based on noise.
          *   Address the Accuracy: 75% is good for ordering coffee, bad for euthanasia/withdrawal.
          *   Address the Proposals: Explain why "Asymmetric Deference" is rejected (people evolve) and why "Corroboration" is redefined (consistency, not external proof).
          *   The Standard: "Clear and Convincing Evidence."
      *   **Recommendation:** Specific steps.
          1.  Pause withdrawal.
          2.  Optimize interface (tech support, different questions).
          3.  Independent validation (third-party expert).
          4.  Re-assess in 30 days.
      *   **Minority/Dissenting View (The "Strongest Case Against"):** This needs to be powerful. It should argue that *delay is itself a harm*. Every day on the vent against his will is a violation. The 75% might be the best we ever get. Waiting is a decision to keep him trapped.

  6.  **Refining the Tone:**
      *   Avoid academic jargon ("ontological status," "epistemic violence"). Use plain English ("what we know," "harming him").
      *   Acknowledge the novelist's insight (silence/voice) without making it about the writer.
      *   Ensure the legal/clinical utility: The recommendation must be actionable. "Get more evidence" is vague. "30-day validation protocol with independent BCI specialist" is actionable.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the wife vs. daughter conflict?
      *   *Fix:* Need to explicitly state that the HC Proxy's authority stands *if* the patient's capacity is established. The conflict is about capacity/communication, not proxy authority.
      *   *Check:* Is the "Asymmetric Deference" killed clearly?
      *   *Fix:* Yes, label it as imposing a "pre-stroke veto."
      *   *Check:* Is the "Witness Corroboration" adapted?
      *   *Fix:* Yes, redefine corroboration as "longitudinal consistency."
      *   *Check:* Is the recommendation concrete?
      *   *Fix:* Specify the timeline and the technical steps.

  8.  **Final Polish:** Ensure the "Strongest Case Against" feels like a genuine ethical dilemma, not a straw man. It should argue that safety protocols are becoming cages.

  **(Self-Correction Note on "Euthanasia" vs "Withdrawal"):** The prompt specifies "ventilator withdrawn." This is legally distinct from active euthanasia in most jurisdictions (right to refuse treatment). I must ensure the language reflects *withdrawal of life-sustaining treatment* based on patient refusal, not assisted suicide.

  **(Self-Correction on Accuracy):** 70-75% accuracy on Yes/No is actually quite low for critical binary choices. If he says "Yes" to "Do you want to die?" there is a 1 in 4 chance the machine is wrong. That is the crux.

  9.  **Final Output Generation** (incorporating the above thoughts into the structured draft).
