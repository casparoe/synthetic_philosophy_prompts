answer: |-
  # DECISION TREE: INDIVIDUAL OBLIGATION IN COLLECTIVE HARM

  **Starting Position:** You accept that the harms in question (climate change, light pollution, etc.) are serious. You accept that no identifiable victim would have been better off had you acted differently (the problem of inefficacy).

  **Instructions:** At each numbered node, choose the claim or case comparison that best matches your intuition. Follow the arrow to the next node or to a final position (Leaf).

  ***

  **Node 1**
  Compare **The Observatory Light** (your outdoor light adds imperceptible glare to a telescope) with **The Declined Seat** (you don't buy a flight ticket, but the plane flies anyway with someone else in your seat).
  *   **(A)** The Light case involves a physical trace of your action (photons hit the lens); the Seat case does not (the emissions occur regardless).
  *   **(B)** Both cases are identical in outcome: the harm happens at the same scale with or without you.
  *   *Choose (A) → Go to Node 2.*
  *   *Choose (B) → Go to Node 7.*

  **Node 2**
  Compare **The Observatory Light** (continuous imperceptible glare) with **The Grid Switch** (new case: you flip a switch adding load to a grid; harm occurs only if 10,000 people flip it; you are number 5,000).
  *   **(A)** The Light is wrong because it adds harm continuously; the Switch is not wrong because it fails to trigger the disaster.
  *   **(B)** Both are wrong (or not wrong) for the same reason: neither triggers a discrete disaster on its own.
  *   *Choose (A) → Go to Node 4.*
  *   *Choose (B) → Go to Node 3.*

  **Node 3**
  Consider **The Grid Switch**.
  *   **(A)** The act is wrong because if everyone followed the rule "flip the switch," the grid would fail.
  *   **(B)** The act is wrong only if your specific flip is the one that crosses the threshold and breaks the grid.
  *   *Choose (A) → **Leaf 1 (Rule/Practice View)**.*
  *   *Choose (B) → **Leaf 2 (Threshold View)**.*

  **Node 4**
  Consider **The Observatory Light**.
  *   **(A)** The wrongness lies in the tiny increase in the *probability* that the data will be ruined (risk).
  *   **(B)** The wrongness lies in the *actual* degradation caused by your specific photons (certainty of contribution).
  *   *Choose (A) → **Leaf 3 (Expected Harm View)**.*
  *   *Choose (B) → Go to Node 5.*

  **Node 5**
  Consider **The Observatory Light**.
  *   **(A)** The degradation is physically real but too small to count as a moral harm.
  *   **(B)** Any physical degradation counts as a moral harm, no matter how small.
  *   *Choose (A) → **Leaf 4 (No Difference View)**.*
  *   *Choose (B) → Go to Node 6.*

  **Node 6**
  Consider **The Reluctant Driver** (new case: she buys a heavy car for safety, hates the emissions, knows her individual impact is negligible but real).
  *   **(A)** Her act is wrong, but she is not blameworthy because social pressure left her no reasonable alternative.
  *   **(B)** If the act is wrong, she is blameworthy for doing it, regardless of pressure.
  *   *Choose (A) → **Leaf 5 (Act/Agent Split View)**.*
  *   *Choose (B) → **Leaf 6 (Act/Agent Unity View)**.*
      *   *Note: Leaves 5 and 6 share a substantive view on harm but separate on moral psychology.*

  **Node 7**
  Compare **The Declined Seat** with **The Flight Offset** (you buy the ticket but pay to remove equivalent carbon elsewhere).
  *   **(A)** The Offset changes the moral status of the act; the Declined Seat does not.
  *   **(B)** Both are equally implicated in the market demand that drives the flight.
  *   *Choose (A) → Go to Node 8.*
  *   *Choose (B) → Go to Node 9.*

  **Node 8**
  Consider **The Flight Offset**.
  *   **(A)** "Netting out" harm is a coherent moral calculation; you can cancel a debit with a credit.
  *   **(B)** "Netting out" treats moral duties like a bank account, which is a category error.
  *   *Choose (A) → Go to Node 9.*
  *   *Choose (B) → **Leaf 7 (Conceptual Confusion View)**.*

  **Node 9**
  Compare **The Flight Offset** with **The Heavy Car**.
  *   **(A)** The Offset buyer is wrong for participating in the market; the Car driver is wrong for increasing risk.
  *   **(B)** Both are wrong for the same reason: they endorsed or joined a harmful practice, regardless of causal impact.
  *   *Choose (A) → Go to Node 10.*
  *   *Choose (B) → **Leaf 8 (Complicity/Endorsement View)**.*

  **Node 10**
  Compare **The Over-compliant Household** (cuts emissions well below share) with **The Observatory Light**.
  *   **(A)** The Household's primary duty was to organize the neighborhood, not just cut their own emissions.
  *   **(B)** The Household's primary duty was to cut their own emissions, regardless of what neighbors do.
  *   *Choose (A) → Go to Node 11.*
  *   *Choose (B) → Go to Node 12.*

  **Node 11**
  Consider **The Neighborhood Pact** (new case: a group agrees to cut emissions; one person refuses).
  *   **(A)** The individual's obligation is to work on the collective enforcement mechanism, not to abstain unilaterally.
  *   **(B)** The individual must abstain even if the collective mechanism fails.
  *   *Choose (A) → **Leaf 9 (Collective Duty View)**.*
  *   *Choose (B) → Go to Node 12.*

  **Node 12**
  Consider **The Over-compliant Household**.
  *   **(A)** The neighbors owe them compensation for subsidizing the collective good with their extra restraint.
  *   **(B)** They are merely virtuous; no compensation is owed for doing more than required.
  *   *Choose (A) → **Leaf 10 (Compensation View)**.*
  *   *Choose (B) → **Leaf 11 (Standard Individual Duty View)**.*
      *   *Note: Leaf 11 is logically possible but often collapses into Leaf 1 or Leaf 5 depending on how "required" is defined.*

  ***

  # DIAGNOSTIC LEAVES

  **Leaf 1: Rule/Practice View**
  *   **Central Claim:** Wrongness depends on what would happen if everyone acted that way.
  *   **Awkward Commitment:** You must condemn an act that makes the world better in isolation because it violates a rule needed for the general case.

  **Leaf 2: Threshold View**
  *   **Central Claim:** Wrongness requires crossing a discrete line of harm; below the line, there is no wrong.
  *   **Awkward Commitment:** You must accept that adding the 9,999th bucket of water to a dam is permissible, but the 10,000th is catastrophic, despite no perceptible difference between them.

  **Leaf 3: Expected Harm View**
  *   **Central Claim:** Wrongness is the tiny increase in expected disvalue, computed straight.
  *   **Awkward Commitment:** You must condemn acts that almost certainly make no difference, based on mathematical probabilities that never actualize.

  **Leaf 4: No Difference View**
  *   **Central Claim:** The action is not wrong because it makes no difference to the outcome.
  *   **Awkward Commitment:** You must accept that if everyone acted this way, the result would be disastrous, yet no individual act is blameworthy.

  **Leaf 5: Act/Agent Split View**
  *   **Central Claim:** The act is wrong, but the person is not blameworthy.
  *   **Awkward Commitment:** You must maintain a category of "objectively wrong" actions that carry no sanction or criticism for the agent.

  **Leaf 6: Act/Agent Unity View**
  *   **Central Claim:** If the act is wrong, the agent is blameworthy.
  *   **Awkward Commitment:** You must blame people for acting in ways that social or economic structures made practically unavoidable.

  **Leaf 7: Conceptual Confusion View**
  *   **Central Claim:** The question of individual contribution is the wrong kind of concept for these cases.
  *   **Awkward Commitment:** You cannot offer guidance on how to act, only on how to rethink the vocabulary of action.

  **Leaf 8: Complicity/Endorsement View**
  *   **Central Claim:** Wrongness is complicity in a harmful practice, independently of causal contribution.
  *   **Awkward Commitment:** You must condemn acts that are causally inert (like voting in a landslide) simply for associating with the losing side.

  **Leaf 9: Collective Duty View**
  *   **Central Claim:** The duty is primarily collective, so the individual's obligation is to work on the collective rather than to abstain.
  *   **Awkward Commitment:** You may be obligated to continue emitting while organizing others to stop, if that strategy maximizes collective compliance.

  **Leaf 10: Compensation View**
  *   **Central Claim:** Over-compliance by some generates an obligation of compensation toward those who do less.
  *   **Awkward Commitment:** You must treat moral restraint as a commodity that can be bought and sold between neighbors.

  **Leaf 11: Standard Individual Duty View**
  *   **Central Claim:** Individual abstention is required regardless of collective coordination.
  *   **Awkward Commitment:** You must accept that the over-compliant household is doing their duty, while their neighbors are free-riding without consequence.

  ***

  # GAP ANALYSIS

  **Unoccupied Combination:**
  There is no leaf for a view that combines **The Threshold View (Leaf 2)** with **The Complicity View (Leaf 8)**.
  *   **Diagnosis:** This combination is **incoherent**. Threshold views rely on causal mechanics (did you break the dam?), while Complicity views rely on symbolic participation (did you join the mob?). One cannot consistently hold that harm requires a causal threshold *and* that participation without causation is sufficient for wrongness.

  **Indistinguishable Leaves:**
  **Leaf 5 (Act/Agent Split)** and **Leaf 6 (Act/Agent Unity)** cannot be separated by questions about *harm*; they are separated only by questions about *blame*.
  *   **Diagnosis:** These are **one position wearing two coats**. They agree on the physics of the harm (Individual Impact) but disagree on the psychology of the agent. To separate them further, you would need a node asking about the definition of "blame" in cases of structural coercion, which is outside the scope of this harm-focused tree.

  **Unexplored Territory:**
  **Leaf 11 (Standard Individual Duty)** is often **unoccupied** in the literature because it tends to collapse into **Leaf 3 (Expected Harm)** or **Leaf 1 (Rule/Practice)** upon scrutiny.
  *   **Diagnosis:** It is **coherent but repellent** to many theorists because it demands sacrifice without a clear causal or collective mechanism to justify the efficacy of that sacrifice. It remains in the tree as a logical possibility rather than a popular stance.
