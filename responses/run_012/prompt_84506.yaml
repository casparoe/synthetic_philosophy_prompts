  # Decision Tree: Anthropic Reasoning Positions

  **Starting Commitment:** *I accept that the bare fact of my existing, or of having the evidence I do, can bear on which world I am in.*

  **Instructions:** Begin at Node 1. Answer each question based on your intuition regarding the concrete case described. Follow the branch corresponding to your answer until you reach a leaf.

  ---

  ### Node 1: The Sleeping Beauty Problem
  A fair coin is tossed. If Heads, you are awakened once. If Tails, you are awakened twice, with memory erased between awakenings. You find yourself awake. Is your credence that the coin landed Heads **1/2**?
  *   **Yes:** Go to Node 2.
  *   **No (1/3):** Go to Node 6.

  ### Node 2: The Weight of Existence
  Consider two hypotheses that both predict your existence with certainty, but one makes the existence of *other* observers like you much more probable. Does the mere fact that *you* exist (rather than no one) shift the prior probabilities between these hypotheses?
  *   **No:** Go to Leaf A.
  *   **Yes:** Go to Node 3.

  ### Node 3: The Doomsday Argument
  Humanity's total size is either 100 billion (Early Doom) or 100 trillion (Late Doom). Priors are equal. You discover you are among the first 60 billion humans. Does this favour Early Doom?
  *   **No:** Go to Leaf B.
  *   **Yes:** Go to Node 4.

  ### Node 4: Reference Class (Potential Observers)
  When sampling observers, does your reference class include observers who *would* have existed had chance gone differently, or only those who actually exist in the world you are in?
  *   **Only Actual:** Go to Leaf C.
  *   **Potential Included:** Go to Node 5.

  ### Node 5: Reference Class (Similarity)
  Must observers in your reference class share your exact sensory experiences, or is it sufficient that they share your general epistemic situation (e.g., rational agents)?
  *   **Exact Sensory:** Go to Leaf C.
  *   **General Epistemic:** Go to Leaf D.

  ### Node 6: The Presumptuous Philosopher
  Theory A posits one universe with observers like you. Theory B posits one trillion such universes. Priors are equal. Are you virtually certain that Theory B is true simply because it contains more observers?
  *   **Yes:** Go to Leaf E.
  *   **No:** Go to Node 7.

  ### Node 7: The Biased Coin Case
  World X contains exactly one observer with your evidence (Prior: 99%). World Y contains one billion such observers (Prior: 1%). You find you are an observer. Is World Y more likely than World X?
  *   **No:** Go to Node 9.
  *   **Yes:** Go to Node 8.

  ### Node 8: Strength of Observer Count
  In the Biased Coin Case, does the observer count *always* dominate the prior, even if the prior against the populous world is exponentially smaller?
  *   **No:** Go to Leaf F.
  *   **Yes:** Go to Leaf E.

  ### Node 9: The Mechanism of Update
  Do you update on the proposition "At least one observer has my evidence" or on "I am a random sample from the set of observers"?
  *   **At least one:** Go to Leaf G.
  *   **Random sample:** Go to Node 10.

  ### Node 10: Reference Class Timing (Restricted SIA)
  Is the reference class fixed *before* you learn your specific evidence, or *after*?
  *   **Before:** Go to Leaf H.
  *   **After:** Go to Leaf I.

  ---

  ## Leaves

  **Leaf A: The Deflationary View**
  *   **Path:** 1 (Yes) → 2 (No).
  *   **Most Awkward Commitment:** You must explain away the intuitive force of the Sleeping Beauty update as a mere artefact of indexing rather than a genuine shift in probability.

  **Leaf B: Full Non-indexical Conditioning (Halfer Variant)**
  *   **Path:** 1 (Yes) → 2 (Yes) → 3 (No).
  *   **Most Awkward Commitment:** You accept that existence bears on probabilities, yet you deny that your birth rank provides evidence about the total number of humans.

  **Leaf C: The Self-Sampling Assumption (Restricted)**
  *   **Path:** 1 (Yes) → 2 (Yes) → 3 (Yes) → 4 (Only Actual) **OR** 5 (Exact Sensory).
  *   **Most Awkward Commitment:** You must accept the Doomsday Argument's conclusion that humanity is likely to go extinct soon based solely on your birth rank.

  **Leaf D: The Self-Sampling Assumption (Broad/Standard)**
  *   **Path:** 1 (Yes) → 2 (Yes) → 3 (Yes) → 4 (Potential) → 5 (General Epistemic).
  *   **Most Awkward Commitment:** You are committed to treating hypothetical observers from counterfactual worlds as part of the reference class for actual sampling.

  **Leaf E: The Self-Indication Assumption (Unrestricted)**
  *   **Path:** 1 (No) → 6 (Yes) **OR** 8 (Yes).
  *   **Most Awkward Commitment:** You must accept the Presumptuous Philosopher's conclusion that you can be virtually certain of a hypothesis solely because it posits vastly more observers, regardless of physical evidence.

  **Leaf F: The Self-Indication Assumption (Moderate)**
  *   **Path:** 1 (No) → 6 (No) → 7 (Yes) → 8 (No).
  *   **Most Awkward Commitment:** You allow observer counts to influence probabilities but must draw an arbitrary line where the count ceases to swamp the prior.

  **Leaf G: Full Non-indexical Conditioning (Thirder Variant)**
  *   **Path:** 1 (No) → 6 (No) → 7 (No) → 9 (At least one).
  *   **Most Awkward Commitment:** You treat the indexical fact "I am here" as equivalent to the non-indexical fact "Someone is here," which struggles to distinguish between centred worlds with identical uncentred content.
  *   **Note:** This position is extensionally very difficult to separate from Leaf H.

  **Leaf H: The Self-Indication Assumption (Restricted)**
  *   **Path:** 1 (No) → 6 (No) → 7 (No) → 9 (Random sample) → 10 (Before).
  *   **Most Awkward Commitment:** You must define a reference class for sampling that is stable enough to be fixed prior to receiving your specific evidence, without being so broad as to trigger the Presumptuous Philosopher.
  *   **Note:** This position is extensionally very difficult to separate from Leaf G.

  **Leaf I: [Empty Combination]**
  *   **Path:** 1 (No) → 6 (No) → 7 (No) → 9 (Random sample) → 10 (After).
  *   **Status:** **Incoherent.** Fixing the reference class after learning your evidence renders the sampling trivial and circular, as you would simply sample from the set containing only yourself.
