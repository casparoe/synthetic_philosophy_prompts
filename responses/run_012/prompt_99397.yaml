prompt: |-
  I'm on the interpretive content team at a mid-sized natural history museum — we write the labels, the audio-guide scripts, and the little "did you know" cards, and we turn over maybe forty or fifty of these a month, so it's the kind of thing where I can't stop and have a full philosophical crisis every single time. The recurring headache is functional language. A draft will say the crest is for attracting mates, or this gut enzyme evolved to break down a particular plant compound, or the wing markings function as a warning signal, and then our curatorial consultant (who did a philosphy of biology minor and never lets us forget it) sends back comments saying we're smuggling purpose into nature and that half our "for"s are unfalsifiable. I've read enough to know there are basically two big camps here — the one that says a trait's function is whatever it was selected for over its evolutionary history, and the one that says a function is just the causal role a part plays in keeping the system doing what it does, history be damned — and I genuinely can't tell which one our house style should commit to, or whether we can get away with quietly not committing.

  What I want from you is a decision procedure my writers can actually run on a draft label: the questions to ask in order, what counts as a good enough answer at each step, where it tells us flat out to cut the functional language, and where it has to hand the call to a human because it's a values question rather than a science one. It has to survive contact with the annoying cases we actually get: traits that were selected for one job but now do another (feathers keep being cited at me as the classic), traits that do something useful today with no reason to think they were selected for it, traits that were selected for something they no longer do at all, and — the one that scares me — claims about human traits where saying what something is "for" is politically loaded and somebody is going to be angry whichever way we go. Then actually run it on three drafts: a bird crest we want to describe as being for mate attraction, a human appendix label, and one where we'd be calling a behavioral difference between the sexes an adaptation. Be honest about where the procedure is just doing word-police work versus where it's genuinely settling something, and tell me which of my three it's going to give an answer I won't like. Don't worry about references or citing anyone, I'll add the scholarly backup myself once I know what position we're taking.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Context:**
      *   **User:** Interpretive content team member at a mid-sized natural history museum.
      *   **Task:** Write labels, audio scripts, "did you know" cards (40-50/month).
      *   **Problem:** Recurring conflict over "functional language" (teleology in biology).
      *   **Antagonist:** Curatorial consultant with a philosophy of biology minor (pedantic about "purpose" in nature).
      *   **Knowledge Level:** Knows the two main camps (Etioological/Selected-Effect vs. Causal Role/Systemic).
      *   **Needs:** A practical *decision procedure* (flowchart/algorithm style) for writers to use on drafts.
      *   **Constraints:** Must handle edge cases (exaptation, spandrels, vestigial traits, human behavioral traits). Must be honest about where it's just "word-police" vs. substantive. Must run on three specific drafts (bird crest, human appendix, sex-based behavioral difference).
      *   **Tone:** Professional, pragmatic, slightly weary of philosophical nitpicking but respectful of accuracy, direct.

  2.  **Deconstruct the Philosophical Conflict:**
      *   *Camp 1: Etiological/Selected-Effect (SE).* Function = what it was selected for historically. (Millikan, Neander). Good for adaptationist stories, bad for vestigial traits or exaptations.
      *   *Camp 2: Causal Role/Systemic (CR).* Function = what it currently does to contribute to the system's capacity. (Cummins). Good for physiology, bad for distinguishing adaptation from side-effect.
      *   *The Museum Context:* Visitors want simple stories ("This is for X"). Philosophers want precision ("This exists because of Y"). The museum needs to be accurate *enough* without lying or causing political backlash.
      *   *The Solution:* A hybrid approach that prioritizes clarity but flags high-risk claims. Most museum labels implicitly use SE for adaptations and CR for physiology, but the friction comes when they blur. The procedure needs to force a distinction.

  3.  **Drafting the Decision Procedure (The "Functional Language Filter"):**
      *   *Goal:* A step-by-step checklist.
      *   *Step 1: The "For" Test.* Is the word "for" or "function" actually necessary? Can we describe the mechanism instead? (Avoids the problem entirely).
      *   *Step 2: The Evidence Check.* Do we have evidence of *selection* (SE) or just *utility* (CR)?
      *   *Step 3: The Vestige/Exaptation Check.* Is the trait currently useful? Was it selected for *this* specific use?
      *   *Step 4: The Human/Political Risk Check.* Is this about human behavior/cognition? (High risk of essentialism).
      *   *Step 5: The Verdict.* Approve, Revise (change wording), or Escalate (Curator/Consultant decision).

  4.  **Refining the Procedure (Iterative Polish):**
      *   Make it actionable. "If X, do Y."
      *   Address the "annoying cases" explicitly in the steps.
      *   Define "Good Enough Answer."
      *   *Self-Correction on Tone:* The user is tired of philosophical crises. The procedure shouldn't *be* a crisis. It should be a triage tool.
      *   *Key Distinction:* Differentiate between "Why it exists" (History/SE) and "What it does" (Current/CR).

  5.  **Running the Procedure on the Three Drafts:**

      *   **Draft 1: Bird Crest (Mate Attraction).**
          *   *Analysis:* Classic sexual selection. Likely SE.
          *   *Procedure:* Passes Step 1 (need "for"). Passes Step 2 (evidence of selection). Passes Step 3 (not vestigial). Passes Step 4 (not human).
          *   *Verdict:* Safe to use "for," but suggest "evolved to" phrasing to satisfy the consultant.
          *   *User Preference:* User probably wants to say "for." Consultant might hate "for." I need to predict the "answer I won't like." The consultant will likely still complain about "for." The procedure might force a compromise that feels clunky.

      *   **Draft 2: Human Appendix.**
          *   *Analysis:* Vestigial? Or immune function? Historically thought vestigial (SE = digestion), now thought to have CR (gut biome safe house).
          *   *Procedure:* Step 3 triggers. Selected for digestion? Maybe. Does digestion now? No. Does immune stuff now? Yes.
          *   *Verdict:* High risk of SE/CR confusion. Cannot say "for digestion." Can say "helps maintain."
          *   *User Preference:* User might want a simple story. The truth is messy. This is where the procedure says "Don't commit."

      *   **Draft 3: Sex-based Behavioral Difference (Adaptation).**
          *   *Analysis:* Human behavior. Evolutionary psychology. Highly politicized.
          *   *Procedure:* Step 4 triggers immediately.
          *   *Verdict:* ESCALATE. Do not write "for."
          *   *User Preference:* This is the one they won't like. They want to write the label. The procedure will forbid it or demand heavy hedging. This is the "values question."

  6.  **Addressing the "Honesty" Requirement:**
      *   Where is this just word-police? (Changing "for" to "evolved to").
      *   Where is it substantive? (Blocking the human behavior claim).
      *   Which answer will they dislike? (The human behavior one, because it stops the content).

  7.  **Final Review against Constraints:**
      *   Decision procedure? Yes.
      *   Questions in order? Yes.
      *   Counts as good enough? Yes.
      *   Cut functional language? Yes.
      *   Hand to human? Yes.
      *   Handle annoying cases (feathers/exaptation/vestigial/human)? Yes.
      *   Run on 3 drafts? Yes.
      *   Honest about limitations? Yes.
      *   No references? Yes.

  8.  **Constructing the Output:** (Drafting the response in the voice of a pragmatic colleague/consultant).
      *   *Intro:* Acknowledge the pain. Validate the consultant (they aren't wrong) but validate the writer (you have a job to do).
      *   *The Protocol:* "The Functional Language Triage."
      *   *The Test Cases:* Apply the protocol rigorously.
      *   *The Honest Assessment:* Where does this hurt?

      *(Self-Correction during drafting)*: Make sure I don't sound *too* academic. Keep it operational. Use "If/Then" logic. Ensure the distinction between Selected Effect (History) and Causal Role (Current Utility) is clear in the steps without using jargon where possible.

      *Refining the "Human Trait" step:* This needs to be the hard stop. Evolutionary psychology claims in museums are minefields. The procedure must flag this as a "Values/Politics" escalation, not just a science accuracy check.

      *Refining the "Bird Crest":* This is the easy one. The procedure should clear it, but maybe suggest a wording tweak to keep the consultant happy without changing the meaning.

      *Refining the "Appendix":* This is the "Exaptation/Vestige" trap. The procedure needs to force the distinction between "original function" and "current utility."

      *Final check on the "Answer you won't like":* It has to be the human behavior one. That's the only one where the procedure effectively vetoes the content rather than just editing it.

  9.  **Final Polish:** Check tone. Empathetic but firm. "Here is the tool. Here is how it breaks."

  **(End of Thought Process)**
answer: |-
  Here is a decision procedure designed for high-volume museum copy that respects the science, satisfies the consultant, and keeps your writers from burning out. It treats the "two camps" (Selected-Effect vs. Causal-Role) not as a philosophical choice you have to make globally, but as a switch you flip based on the specific trait.

  ### The Functional Language Triage (FLT)

  **Goal:** Determine if a functional claim ("X is for Y") is scientifically defensible, politically safe, and clear to a general audience.

  **Step 1: The "Mechanism" Check (Avoidance)**
  *   **Question:** Can we describe *how* it works without saying *why* it exists?
  *   **Test:** Replace "The crest is for attracting mates" with "The crest signals reproductive status to potential mates."
  *   **Pass:** If the mechanism description is clear and engaging, **APPROVE** and skip the rest. (This satisfies the consultant by removing teleology).
  *   **Fail:** If the sentence becomes clunky, passive, or obscures the biological point, proceed to Step 2.

  **Step 2: The History vs. Utility Check (The Camp Switch)**
  *   **Question:** Are we claiming this trait exists *because* it does this job (History/Selected-Effect), or just that it *does* this job now (Utility/Causal-Role)?
  *   **Test:** Look at the evidence. Do we have comparative phylogenetic data or fossil records suggesting selection? Or do we just have physiological observation?
  *   **Decision:**
      *   If **History**: You must use "evolved to" or "selected for." You cannot use "is for."
      *   If **Utility**: You can use "helps," "contributes to," or "allows." You cannot use "evolved to."
  *   **Pass:** If the draft matches the evidence type, proceed to Step 3.
  *   **Fail:** If the draft claims "evolved to" based only on current utility, **REVISE** to match evidence.

  **Step 3: The Exaptation/Vestige Check (The "Feathers" Problem)**
  *   **Question:** Is the current use the same as the original selection pressure?
  *   **Test:**
      *   *Scenario A (Vestige):* Trait was selected for X, now does nothing (or negligible). -> **CUT** functional language. Describe as "remnant" or "historical."
      *   *Scenario B (Exaptation):* Trait was selected for X, now does Y. -> **CUT** "evolved for Y." Use "currently used for Y" or "co-opted for Y."
      *   *Scenario C (Adaptation):* Trait was selected for X, still does X. -> **PROCEED** to Step 4.
  *   **Fail:** If you claim "evolved for Y" in Scenario B, **REVISE**.

  **Step 4: The Human Behavior & Politics Check (The Hard Stop)**
  *   **Question:** Is this trait a human behavioral, cognitive, or social characteristic?
  *   **Test:** Does the claim imply that a current social norm, gender role, or cognitive bias is "natural" or "hardwired" by evolution?
  *   **Decision:**
      *   **YES:** **ESCALATE.** Do not write the label. This is no longer a science accuracy question; it is a values/policy question. Send to Senior Curator + Ethics Review.
      *   **NO:** **APPROVE** (provided Steps 1-3 passed).

  ***

  ### Running the FLT on Your Three Drafts

  Here is how the procedure handles your specific headaches.

  #### Draft 1: The Bird Crest
  *   **Draft Claim:** "The male's bright crest is for attracting mates."
  *   **Step 1 (Mechanism):** "Signals reproductive status" is drier. Writer wants "for." Proceed.
  *   **Step 2 (History/Utility):** We have data on sexual selection in this clade. This is a History claim.
      *   *Correction:* Change "is for" to "evolved to attract" or "functions in mate attraction."
  *   **Step 3 (Exaptation):** Is the crest a former temperature regulator now used for sex? No evidence suggests that. It's a standard adaptation. Pass.
  *   **Step 4 (Human):** Not human. Pass.
  *   **Verdict:** **REVISE.** Change "is for" to "evolved to attract" or "functions in."
  *   **Why:** This is word-police work. The consultant will accept "evolved to" because it explicitly references the Selected-Effect history. The visitor understands it the same way. It costs you nothing but a few keystrokes.

  #### Draft 2: The Human Appendix
  *   **Draft Claim:** "The appendix is a vestigial organ that helped our ancestors digest cellulose."
  *   **Step 1 (Mechanism):** "Digest cellulose" is a mechanism, but "vestigial" is a functional claim about history. Proceed.
  *   **Step 2 (History/Utility):** This is a History claim ("helped ancestors").
  *   **Step 3 (Exaptation/Vestige):** Here is the trap. Recent research suggests the appendix *does* have a current function (lymphoid tissue/gut biome safe house), even if it doesn't digest cellulose.
      *   *Correction:* If you call it "vestigial," you imply it does nothing. If you say it "helped digest," you imply it doesn't do that anymore.
      *   *FLT Ruling:* You cannot claim it is *for* digestion (false now) and you shouldn't claim it is *for* immunity (selected effect is debated).
  *   **Step 4 (Human):** It is human tissue, but not behavioral. Pass.
  *   **Verdict:** **REVISE HEAVILY.**
      *   *Bad:* "The appendix is for digestion." (False)
      *   *Bad:* "The appendix is useless." (False, Causal Role exists)
      *   *Good:* "Once thought to be a useless remnant of digestion, the appendix may now help maintain healthy gut bacteria."
  *   **Why:** This is substantive. The procedure forces you to acknowledge the Exaptation/Vestige ambiguity. You cannot tell a clean "purpose" story here.

  #### Draft 3: Sex-Based Behavioral Difference
  *   **Draft Claim:** "Men are more aggressive because this adaptation helped them compete for resources in early human societies."
  *   **Step 1 (Mechanism):** "Compete for resources" is the mechanism. Proceed.
  *   **Step 2 (History/Utility):** This is a History claim ("adaptation helped them").
  *   **Step 3 (Exaptation):** Hard to prove. Proceed.
  *   **Step 4 (Human/Politics):** **STOP.**
      *   *Trigger:* This claims a behavioral difference between sexes is a fixed evolutionary adaptation.
      *   *Risk:* High. This validates essentialist views of gender. Even if scientifically defensible in a specific paper, as a museum label, it presents a contested evolutionary psychology hypothesis as fact.
  *   **Verdict:** **ESCALATE / KILL.**
  *   **Why:** The procedure identifies this as a values question. You cannot write this label without senior sign-off.

  ***

  ### The Honest Assessment

  You asked me to be honest about where this procedure is just policing words and where it's actually settling something, and which answer you won't like.

  **1. Where it's just word-police work:**
  **Draft 1 (Bird Crest).** The procedure forces you to change "is for" to "evolved to." Philosophically, this shifts the claim from Causal-Role (what it does) to Selected-Effect (why it's here). Practically? It means the exact same thing to the visitor. Your consultant will shut up because you acknowledged history. Your writers won't care because the sentence reads the same. This is low-cost compliance.

  **2. Where it's genuinely settling science:**
  **Draft 2 (Appendix).** The procedure stops you from telling a lie. The "vestigial" story is outdated, but the "immune function" story is still debated as a *selected effect*. The FLT forces you into a hedge ("may help," "once thought"). This makes the label less satisfying, but it prevents you from being embarrassed in five years when the science shifts again.

  **3. The answer you won't like:**
  **Draft 3 (Sex/Behavior).**
  You wanted a procedure to help you write labels. On this draft, the procedure tells you **you are not allowed to write the label** without a high-level ethics review.
  *   **Why you won't like it:** It creates a bottleneck. It acknowledges that "science accuracy" isn't the only constraint; "social impact" is also a constraint. Your consultant will love this step; your education team might hate it because it kills a compelling story.
  *   **The Hard Truth:** If you use the "Selected-Effect" definition of function here, you are making a political claim about the inevitability of human behavior. If you use the "Causal-Role" definition, you are implying the behavior is currently useful, which is also loaded. The procedure correctly identifies that this isn't a biology question anymore; it's a mission-question.

  **Summary for your team:**
  Use the FLT. It lets you breeze through the bird labels (just change the verb), forces nuance on the physiology labels (admit uncertainty), and protects the museum from the human behavior landmines. It won't stop your consultant from nitpicking, but it will give you a standardized reason to say "We already checked that."
