answer: |-
  Starting from the realist premise that virtual objects are genuine computational artifacts with causal powers, we must analyze the LambdaMOO incident not as a description of fiction but as an occurrence involving real entities. The text generated was not a report of an event elsewhere; it was the event itself, instantiated in code and displayed on screens. Given this ontology, we separate the question of harm into three distinct accounts.

  The fictionalist or authorial account treats the episode as a piece of jointly enacted fiction. On this view, the virtual room and the virtual acts are representational; the only reality lies in the keystrokes entered by the player behind Mr. Bungle. What was harmed was the real-world dignity or privacy of the victims, violated by the authorial act of describing them without consent. The community had standing to respond only insofar as it functions as a group of real-world individuals protecting one another from harassment originating outside the simulation. Destroying the character is intelligible only as a symbolic gesture or a practical way to stop the keystrokes, but turning it into an amphibian is merely theatrical punishment of a fiction. This account handles the publicness of the act by viewing it as public humiliation in the real world. However, it struggles with the away-from-keyboard victim: if the player was not present, no authorial description was read by them, so the harm to that specific victim is attenuated. It handles the virtual instrument by treating it as merely a tool for transmission, possessing no intrinsic moral weight.

  The experiential account accepts the realist premise about objects but locates the harm in the psychological state of the players. What was harmed was the mental well-being of the users, caused by the experience of reading the text or knowing it was visible to others. The community had standing because it is a collection of sentient beings whose distress matters. Destroying the character is intelligible as removing the source of the stimulus causing pain. This account explains the intensity of the reaction via the intensity of the distress. However, it is severely strained by the away-from-keyboard victim: if the player was not present to experience the text, no psychological harm occurred at the time of the act, yet the community treated the violation as complete regardless of awareness. It handles publicness as an amplifier of distress and the virtual instrument as the causal trigger for the psychological state.

  The constitutive or performative account argues that the act was a real act of a distinctive kind, analogous to a speech act within an institution. What was harmed was the social standing and normative status of the victims within the virtual community. The wrong consists in the uptake: the community witnessed a change in the victims' status from autonomous agents to controlled objects. The community had standing because it is the polity that constitutes these statuses; the wrong was done to the community's normative order as much as to the individuals. Destroying the character is intelligible as execution or exile within that polity, and the amphibian transformation is a legitimate ritual of status degradation. This account handles the publicness of the act as essential: without witnesses, the status change lacks uptake. It handles the away-from-keyboard victim easily: status is changed regardless of the victim's awareness, just as a person is libeled even if they do not read the libel. It handles the virtual instrument as the institutional mechanism that makes the performative act possible; the code is the law.

  Reversing the direction to test the theory against the episode, the constitutive account is confirmed by the community's behavior. The move toward formal self-government indicates they viewed themselves as a polity repairing a breach of law, not merely a group comforting trauma victims. The experiential account is embarrassed by the away-from-keyboard victim; the community's outrage did not diminish upon learning some victims were unaware, suggesting the wrong was not purely psychological. The fictionalist account is strained by the severity of the punishment; one does not destroy a fictional character to punish a real-world author unless the character is deemed the responsible agent.

  The realist premise about virtual objects does necessary work in grounding the constitutive account: if the virtual sword were merely fictional, it could not be the instrument of a real institutional act. However, the premise does too much work if it suggests the causal powers of the code alone explain the wrong; the code enables the act, but the norms constitute the wrong. The theory is silent on why this specific virtual act carries the weight of sexual assault rather than, say, virtual theft, unless we import real-world normative concepts. For the constitutive account to be correct, it must be true that the virtual community functions as a genuine normative institution with the power to confer status. Evidence against this would be if players consistently treated such violations as trivial outside of specific intense moments, or if the community dissolved without moral residue after the incident.

  | Account | What was harmed, and in what sense | Why the community had standing | What it explains in this episode | What it cannot explain | Verdict (supported, strained, or silent) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | Fictionalist/Authorial | Real-world dignity of the player; harm lies in the unauthorized description. | Standing derives from real-world interpersonal obligations between users. | Explains the offender's real-world culpability. | Cannot explain why punishing the character (not the human) was satisfying or why AFK victims were counted. | Strained |
  | Experiential | Psychological well-being of the player; harm lies in the distress of the experience. | Standing derives from a duty to prevent suffering among members. | Explains the emotional intensity of the reaction. | Cannot explain why harm was deemed done to victims who were away from the keyboard. | Strained |
  | Constitutive/Performative | Social standing within the virtual polity; harm lies in the forced change of status. | Standing derives from the community's role as the constitutor of normative status. | Explains the AFK victim issue, the public nature, and the move to self-government. | Cannot explain why this specific virtual act maps to real-world sexual assault without importing external norms. | Supported |
  | Realist Premise | What constitutes the event; virtual objects are real computational artifacts. | Interaction is possible because the artifacts have causal powers on screens. | Explains how the act occurred and was visible to witnesses. | Cannot explain the normative weight of the act without a theory of harm. | Supported |

  On balance, the case is an argument for that premise because the community's treatment of the virtual objects as loci of responsibility requires them to be real constituents of the social world rather than mere fictions.
