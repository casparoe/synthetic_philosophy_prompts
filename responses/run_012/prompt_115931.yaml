answer: |-
  The institutional landscape you describe does not rest on a single, coherent theory of work and leisure. Instead, it operates on a **fragmented compromise between two incompatible normative frameworks**, applied selectively based on class, employment status, and life stage. The system manages the tension between viewing work as a *disutility* (a burden requiring compensation) and work as a *civic duty* (a contribution required for membership), but it refuses to resolve the contradiction.

  Here is the reverse-engineering of that implicit logic, distinguishing between what the institutions strictly presuppose, where they are philosophically underdetermined, and what would be required to make them consistent.

  ### 1. The Dual Theory: Disutility vs. Duty
  The pattern requires at least two incompatible theories that are toggled depending on the population in question.

  **Theory A: Work as Disutility (The Market View)**
  This theory dominates the treatment of hourly labor, overtime, and occupational safety.
  *   **Presupposition:** Labor is a commodity sold by the worker; exertion is a physical or psychological cost.
  *   **Evidence:** Overtime premiums (time-and-a-half) acknowledge that the 41st hour is more burdensome than the 1st. *Karoshi* recognition treats excessive hours as a physical injury, akin to a machine part wearing out. On-call rules imply that unless effort is expended, no value is transferred; the surrender of freedom (waiting) is not compensable, only the activation of labor is.
  *   **Class Application:** This applies primarily to the working class (hourly/non-exempt). Their time is measured precisely because their labor is viewed as a finite resource to be extracted.

  **Theory B: Work as Civic Duty (The Membership View)**
  This theory dominates unemployment insurance, retirement, and the treatment of salaried professionals.
  *   **Presupposition:** Access to income is contingent on participation in the social scheme of production. Leisure is not a right but a deferred reward for contribution.
  *   **Evidence:** Unemployment insurance (UI) conditions benefits on active search, treating joblessness as a problem of individual effort rather than structural scarcity. Pensions are actuarial rewards for past loyalty, not universal rights. The exemption of salaried professionals from overtime presumes their work is a "vocation" or career where loyalty and output matter more than hours; they are partners in the enterprise, not sellers of time.
  *   **Class Application:** This applies to the professional class (exempt) and the unemployed. Professionals are expected to surrender control without premium pay because they are "invested." The unemployed must prove they are willing to re-enter the duty-bound state to receive support.

  **The Reconciliation:**
  The system reconciles these by stratifying them. For the hourly worker, the system admits work is painful (hence overtime) but insists you must do it (hence UI). For the salaried worker, the system pretends work is not painful (no overtime) but expects total availability (exempt status). The implicit theory is **Reciprocal Contribution mediated by Status.** You are owed a living only if you contribute, but *how* you contribute (selling hours vs. surrendering autonomy) depends on your bargaining power.

  ### 2. Rival Views Ruled Out
  The current institutional pattern quietly rules out several coherent philosophical positions:

  *   **Leisure as an Unconditional Right:** The structure of UI and pensions makes clear that leisure is conditional. A Universal Basic Income (UBI) is incompatible with the requirement to prove active job searching or contribution history.
  *   **Work as Purely Indifferent to Justice:** The system does not treat idleness as neutral. It actively penalizes voluntary idleness (UI denial) while rewarding compulsory leisure (retirement). Justice requires a specific ratio of work to non-work over a lifetime.
  *   **Desert Tracks Effort Alone:** If desert tracked effort strictly, salaried employees working 60 hours would be compensated more than those working 40, and on-call waiting time (which restricts freedom) would be paid. The system prioritizes *output* and *status* over raw effort for the professional class.
  *   **Structural Unemployment as a Systemic Failure:** By conditioning UI on accepting less attractive offers, the system presumes the problem lies with the worker's reservation wage, not the absence of jobs. It rules out the view that the economy may simply not have enough slots to fill.

  ### 3. Protestant Work Ethic vs. Reciprocity
  Is this just the Protestant Work Ethic (PWE) with a pension attached? **No.** The distinction is crucial.

  *   **The PWE** is theological and moral: Idleness is sin; work is a calling; success is a sign of grace. It is internal and spiritual.
  *   **The Institutional View** is contractual and actuarial: Idleness is a breach of contract; work is a tax paid to the social safety net; success is a ledger balance.

  The reciprocity element is doing genuinely different work. Under PWE, you work because God commands it. Under the current institutional regime, you work because you are buying your future security. This is why disability benefits exist alongside pensions: the system acknowledges you might be *excused* from the duty (disability), but you must prove incapacity. In a pure PWE framework, incapacity might be viewed as a spiritual trial; in the institutional framework, it is a verified exemption from the labor tax. The system is not trying to save your soul; it is trying to balance the social ledger.

  ### 4. Philosophical Underdetermination
  There are areas where the practices do not strictly dictate one theory but fit comfortably with multiple explanations. This is where the ideology is most fragile.

  *   **The 40-Hour Threshold:** This is historically arbitrary. It could be justified as the point where disutility spikes (Theory A), or as a standard for work-sharing (Theory B). The law treats it as a bright line for overtime, but economically, productivity does not cliff at hour 40. This is underdetermined; it is a norm masquerading as a physiological fact.
  *   **On-Call Compensation:** The rule that on-call time is unpaid if you can use the time for yourself presupposes that *freedom* is the opposite of *work*. However, one could argue that the *anxiety* of being on-call is itself a burden (Theory A), or that being available is a contribution to the firm's flexibility (Theory B). The current rule chooses the path of least resistance for employers, not a philosophically consistent one.
  *   **Disability vs. Unemployment:** The distinction presumes a clear line between "cannot find work" and "cannot do work." In reality, ageism, mental health issues, and skill obsolescence blur this line. The institutions treat them as distinct categories (medical vs. economic), but the human experience is often a mix. The system is underdetermined here because it relies on a medical model to solve what is often a social/economic exclusion.

  ### 5. Institutional Changes for Consistency
  To replace this fragmented view with a single consistent alternative, significant institutional overhaul would be required.

  **Alternative 1: Consistent "Work as Disutility" (Libertarian/Market Consistency)**
  *   **Theory:** Labor is a private transaction; the state should not enforce duty.
  *   **Changes:**
      *   **Abolish UI mandates:** No requirement to search for work. Benefits (if they exist) are unconditional.
      *   **Abolish Overtime Exemptions:** Every hour of work must be compensated. Salaried employees get time-and-a-half.
      *   **Pay for On-Call:** Any restriction on freedom is a purchase of time and must be paid.
      *   **Privatize Pensions:** Retirement is personal savings, not a social reward for contribution.
      *   **Result:** Work becomes purely a cost. No one is bribed or forced to work; those who do are paid strictly for every unit of burden endured.

  **Alternative 2: Consistent "Work as Civic Duty/Claim" (Social Democratic Consistency)**
  *   **Theory:** Work is a social good that must be distributed; leisure is a right earned by citizenship, not just contribution.
  *   **Changes:**
      *   **Job Guarantee:** If work is a claim (as in the French 35-hour logic), the state must provide it. UI is replaced by public employment.
      *   **Abolish the Disability/Unemployment Split:** If you aren't working, you receive support regardless of *why* (structural vs. physical), perhaps with a lower tier for those medically exempt from the Job Guarantee.
      *   **Universal Pensions:** Retirement is based on age/citizenship, not contribution history. Leisure is a right of the aged, not a wage for the loyal.
      *   **Cap All Hours:** To enforce work-sharing, overtime is banned or heavily taxed to discourage hoarding hours, applying to salaried and hourly alike.
      *   **Result:** Work is democratized. The distinction between "exempt" and "non-exempt" vanishes because everyone is a citizen-worker with a right to rest.

  ### Conclusion
  The current pattern presupposes a **stratified reciprocity**. It treats work as a burden for those with less power (requiring overtime pay) and a duty for those with more (requiring exempt availability). It treats leisure as a reward for the compliant (pensions) and a suspicion for the non-compliant (UI).

  This is not a single theory. It is a bureaucratic management of class conflict. It rules out the idea that leisure is a right or that work is merely a cost. It is not the Protestant Work Ethic, but rather a **Secular Contribution Ethic**: you pay your labor tax to the state and the market, and if your ledger is balanced at age 65, you are allowed to stop. To make it consistent, we would have to choose between freeing labor from the duty to participate (UBI/Market) or binding everyone equally to the duty of contribution (Job Guarantee/Universalism). The current system avoids this choice by applying different rules to different people.
