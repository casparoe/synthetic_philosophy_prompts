prompt: 'I am a third-year undergraduate on a joint honours programme in philosophy
  and computer science, and this term I am taking a module on Dewey''s political philosophy
  while simultaneously working through a module on reinforcement learning and sequential
  decision-making. The two have collided in a way I find genuinely productive but
  also suspicious, and I would rather you did the work of translation properly than
  let me flatter myself that they are saying the same thing. What I want is this:
  take Dewey''s experimentalism about inquiry and about democracy — the account on
  which inquiry begins in a situation that is felt to be indeterminate and must be
  constituted as a problem before it can be solved; on which the framing, development
  and testing of hypotheses issues not in private mental states but in warranted assertibility,
  a status that is defeasible, situational and conferred by the conduct of inquiry
  itself; on which means and ends form a continuum rather than two separate orders;
  and on which democracy is not a decision procedure for aggregating preferences that
  are simply given, but a way of associated living in which the consequences of joint
  activity are shared, communicated and made the object of further inquiry — and restate
  it as faithfully as you can in the vocabulary I actually use: agents, environments,
  states, observations, reward signals, policies, exploration and exploitation, credit
  assignment, model-based versus model-free methods, non-stationarity and distributional
  shift, online versus offline learning, and evaluation protocols. I would ask you
  not to smuggle the assumptions of that vocabulary into the translation and then
  present the result as fidelity; where the fit is bad, I want the badness on the
  surface.


  Then give me the residue report, which is the part I care about most. Which elements
  of Dewey''s position map cleanly onto something in that vocabulary; which can be
  carried across only by distortion, and precisely what gets bent in the process;
  and which have no counterpart at all? I am particularly exercised by four questions.
  First, does the notion of a situation that is indeterminate before it has become
  a problem have any honest expression when the task is always antecedently specified
  by a reward function — or is the specification of the task itself the very thing
  Dewey thinks inquiry has to achieve? Second, is warranted assertibility anything
  more than a posterior, a confidence estimate or a calibrated value, and if not,
  what has been lost? Third, can his insistence that inquiry transforms the inquirer
  and the situation together be captured by the standard agent–environment split,
  or is that split doing illicit work by treating the two as independently specifiable
  relata? Fourth, does anything in his democratic experimentalism survive translation
  into multi-agent learning, federated learning or preference aggregation, or does
  the translation merely reproduce the aggregative picture he was arguing against?
  I would also like to know what becomes of the consummatory or aesthetic dimension
  of experience — his thought that an inquiry can be carried through to a settled,
  fulfilling conclusion rather than merely terminated — since I can think of nothing
  in my vocabulary that answers to it. Finally, tell me how to read the residue: does
  it show that my framework is missing something that matters, or that Dewey''s formulations
  were doing less work than his admirers suppose? And in either case, is there a claim
  in his position that cannot even be stated, let alone assessed, in the terms I am
  asking you to use?'
