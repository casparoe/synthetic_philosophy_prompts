      *   *Wait, let's look closer at Nuremberg:* Nuremberg Charter *was* enacted law. So Nuremberg could be Positivist (new law applied). The German Courts *rejected* the idea that the GDR law was valid. So the "line of practice" combines a Positivist move (Nuremberg Charter) with a Non-Positivist move (Radbruch).
