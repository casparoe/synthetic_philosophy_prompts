      *   *Decision:* The *reasoning* cited (Radbruch) strictly requires the moral test. The *practice of victors' justice* (Nuremberg selectivity) accommodates the Positivist view that law is the command of the sovereign (the victor).

  7.  **Final Polish of the Argument:**

