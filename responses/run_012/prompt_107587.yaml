answer: |-
  The line of practice described—spanning from the Nuremberg and Tokyo tribunals to the post-reunification German border guard trials—presents a profound tension between legal positivism and non-positivist (natural law) theories. To answer your questions directly: the reasoning explicitly employed by the German courts **strictly requires** a non-positivist conception of legal validity; it **merely accommodates** a positivist conception through the raw exercise of sovereign power; the two halves of the practice are **inconsistent** regarding the universality of the moral test; and a court exempting its own side while applying a moralized test acts in **bad faith** regarding the moral claim, though it may claim political necessity.

  Here is the detailed breakdown of the legal philosophy and consistency issues involved.

  ### 1. The Conception of Legal Validity
  The practice, specifically the reasoning used by the German courts ("a statute whose injustice is intolerable is not law at all"), **strictly requires a non-positivist conception of legal validity.**

  *   **Non-Positivism (The Moral Test):** This view holds that there is a necessary connection between law and morality. For a norm to count as "law," it must meet a minimum threshold of justice (the Radbruch Formula). If the East German statutes were "intolerably unjust," they lacked legal validity *ab initio*. Therefore, the guards were not obeying "law," and convicting them is not retroactive punishment.
  *   **Positivism (Enactment Alone):** This view holds that law is valid based on its source (pedigree), regardless of content. Under strict positivism, the East German statutes *were* law because they were enacted by the recognized sovereign. To convict the guards under positivism, the court would have to admit it is applying *new* law to *old* acts (retroactivity), violating the principle of *nullum crimen sine lege* (no crime without law).

  Since the German courts explicitly denied the validity of the old statutes to avoid the charge of retroactivity, their logic collapses without the non-positivist premise that immorality negates legality.

  ### 2. Consistency and Bad Faith
  The two halves of this practice (Nuremberg/Tokyo vs. German Courts) are **inconsistent**, and applying a moralized test while exempting one's own side implies **bad faith**.

  *   **Inconsistency of Application:** The non-positivist conception relies on *universal* moral truths. If "intolerable injustice" renders a statute void, that principle must apply to all states, not just the defeated or the predecessor regime. At Nuremberg, the charge of aggression was brought only against the defeated; Allied leaders (who engaged in area bombing of civilians, e.g., Dresden, Hiroshima) were not scrutinized under the same moralized legal standard. The German courts, while claiming to uphold universal human rights, acted as organs of the successor state (Unified Germany) judging the predecessor (GDR), without subjecting the West German or Allied past to the same "intolerable injustice" test.
  *   **Bad Faith:** A court claims moral authority when it invokes a moralized test of validity. If that test is applied selectively to validate the power of the victor or the successor regime while shielding the victor's own conduct, the moral principle is revealed as instrumental rather than categorical. This constitutes bad faith regarding the *legal reasoning*, even if the outcome is politically expedient. It suggests the "moral test" is a pretext for punishing enemies, not a genuine standard of validity.

  ### 3. Requires vs. Accommodates
  *   **Strictly Requires:** The practice **strictly requires Non-Positivism**. Without the assertion that unjust statutes are *not law*, the convictions constitute *ex post facto* punishment. The specific justification given ("not law at all") is logically dependent on the incorporation of moral criteria into the definition of law.
  *   **Merely Accommodates:** The practice **merely accommodates Positivism**. It accommodates positivism only in the sense that the tribunals functioned as sovereign commands. At Nuremberg, the Charter was a new enactment (positivist source) that defined crimes retroactively. The practice accommodates positivism if one ignores the *reasoning* ("not law") and looks only at the *force* (the victors had the power to punish). However, the *justification* provided rejects positivism.

  ### 4. What Would Have to Change for Consistency?
  To make this line of practice consistent with the moralized conception of validity it presupposes, one of two changes would be necessary:

  1.  **Universal Application (Moral Consistency):** The moral test must be applied universally. At Nuremberg, this would have required investigating and potentially charging Allied leaders for acts that might meet the threshold of "aggressive war" or "atrocities" (e.g., the firebombing of civilian centers). In the German context, it would require a willingness to scrutinize West German or Allied complicity in the division of Germany or Cold War policies under the same "intolerable injustice" standard.
  2.  **Honest Retroactivity (Positivist Consistency):** Alternatively, to be consistent with Positivism, the courts would have to abandon the fiction that the old statutes were "not law." They would need to admit that the statutes *were* valid law at the time, but that a new sovereign power is imposing new legal standards retroactively as an act of transitional justice. This sacrifices the principle of *nullum crimen sine lege* for the sake of substantive justice, but it removes the hypocrisy of denying the legal reality of the predecessor state.

  **Conclusion:**
  The practice presupposes that **validity depends on a moral test** (Non-Positivism). It is **inconsistent** because it applies this universal test selectively. It cannot apply this test without **bad faith** if it exempts the victors, as it treats moral principles as tools of power rather than constraints on it. To achieve consistency, the practice must either **subject the victors to the same moral scrutiny** or **admit the retroactive nature of the punishment**, abandoning the claim that the prior statutes were never law.
