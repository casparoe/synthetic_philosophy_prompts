      *   **Q6: What would have to change for consistency?**
          *   To be consistent with a universal moral test: The victors at Nuremberg would have had to subject their own leaders to the same scrutiny (e.g., bombing of civilians).
          *   To be consistent with Positivism: Admit the laws were valid and acknowledge the punishment is retroactive (an act of sovereign power/mercy/justice outside strict legality).

