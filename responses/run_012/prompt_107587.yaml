      *   **Natural Law (or Non-Positivism):** Law requires a moral threshold. An unjust law is not law (*lex iniusta non est lex*). The Radbruch formula fits here. If the statute was intolerably unjust, it was never valid law, so the defendants had no legal duty to obey it.

