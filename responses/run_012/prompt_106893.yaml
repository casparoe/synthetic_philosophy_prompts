answer: |-
  The practice, as I understand it
  In criminal trials, the state must prove every element of the charged offense beyond a reasonable doubt using admissible evidence, forbidding gaps in the logical chain linking the defendant to the crime. Simultaneously, judges employ "judicial notice" and statutory presumptions to declare certain facts true without evidence (e.g., calendar dates, mail delivery, official regularity, sometimes neighborhood characteristics), instructing juries to accept them as given. This creates a dual standard: rigorous evidentiary scrutiny for the elements of guilt, but assumed truths for the background conditions surrounding the trial and the context of the behavior.

  What it presupposes
  The legal system operates on a theory of **Pragmatic Foundationalism** bounded by **Epistemic Contextualism**. It presupposes that justification is not a metaphysical absolute but a resource that must be allocated according to the stakes involved. Strict foundationalism would demand indubitable basic beliefs; the law instead accepts "basic" facts (via judicial notice) that are merely *reliable enough* for the context. The system presupposes a hard distinction between *adjudicative facts* (who did what to whom, where error risks liberty) and *background/general facts* (how the world works, where error risks only efficiency). By demanding proof only for the former, the law asserts that the regress of justification must be stopped not because we have reached metaphysical bedrock, but because we have reached the point of diminishing returns relative to human liberty.

  This practice is not inconsistent because the "foundation" shifts based on the *purpose* of the inquiry. The "beyond a reasonable doubt" standard protects against the specific risk of wrongful imprisonment, requiring a chain of inference strong enough to bear that weight. Judicial notice and presumptions protect against the risk of procedural paralysis, relying on high-probability generalizations (e.g., mailed letters usually arrive) that do not bear the same moral weight as a conviction. The system presupposes that a fact can be "proved" for the purpose of moving a trial forward without being "proved" for the purpose of depriving someone of freedom. It implicitly rejects infinitism (infinite chains of proof) as impossible and rejects pure coherentism (truth is just what fits the story) because it demands external evidence for the critical elements. It is a tiered epistemology: high justification for high stakes, low justification for low stakes.

  What it merely fits
  This practice is compatible with **Pure Coherentism**, where judicial notice is accepted simply because these facts cohere with the jury's existing web of beliefs, though the law doesn't strictly require global coherence, only legal sufficiency. It also fits the **Cynical Power Theory** (your friend's view), where rules are merely tools to reach desired verdicts, but the practice does not *presuppose* this; the rules constrain the judge just as they constrain the prosecutor, and appellate review exists specifically to punish arbitrary notices (like the "high-crime area" example, which is often contested on appeal). The practice is underdetermined regarding where the line between "common knowledge" and "adjudicative fact" is drawn; both a strict foundationalist and a pragmatist could argue over whether a specific neighborhood's crime rate is "known" or needs proof, using the exact same procedural rules. Finally, it fits **Fallibilism**, acknowledging that presumptions (like mail delivery) can be wrong, but treating them as justified anyway unless rebutted.

  If we swapped it out
  If you abolished presumptions and judicial notice, demanding proof of absolutely everything (the date, the judge's authority, the mailing process), the system would not become more honest; it would become **paralyzed**. Trials would expand indefinitely as prosecutors called witnesses to testify that the calendar is real or that the post office exists. If you swapped the practice for a cleanly **Infinitist** one, requiring an infinite chain of justification for every fact, no verdict could ever be rendered, effectively abolishing the criminal trial system. On the ground, prosecutors would need to subpoena records clerks for every document, defense attorneys would object to the existence of evidence, and judges would need to testify to their own appointment. The cost of justice would exceed the capacity of the state, resulting in either mass dismissal of cases or indefinite detention without trial.

  Bottom line
  You are right, and your friend is wrong, though her frustration is understandable given the stakes she handles daily. The system is not hypocritical theater but a necessary triage of epistemic labor, reserving rigorous proof for the facts that threaten liberty while accepting reliable shortcuts for the facts that merely enable the process.
