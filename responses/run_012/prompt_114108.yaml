  ### Private Referee Notes: Diagnostic Brainstorming

  Before drafting the joint statement, I need to map where Camp A (Celebrate) and Camp B (Cut) are colliding. They feel like they are arguing about *morality* (is envy bad?), but the friction is actually structural and semantic.

  1.  **Scope Mismatch:** Camp A is arguing about *societal innovation* (macro). They need heroes to drive progress. Camp B is arguing about *group cohesion* (micro). They need equality to maintain trust. A society can tolerate high inequality if the pie grows; a small town cannot if trust evaporates. They are optimizing for different units of survival.
  2.  **The "Luck" Attribution:** Camp A treats luck as noise that averages out over time; Camp B treats luck as the dominant signal that is being systematically mislabeled as "skill." If Camp B is right, celebrating success is celebrating a lottery win, which is irrational. If Camp A is right, ignoring success is ignoring signal, which is inefficient.
  3.  **The Function of Pain:** Camp A views social sanction (cutting the poppy) as purely punitive (pain to reduce behavior). Camp B views it as educational/remedial (pain to restore connection). Camp A sees the poppy being killed; Camp B sees the poppy being pruned to save the garden.
  4.  **Verbal Trap:** The word "Merit." Camp A defines it as *output*. Camp B defines it as *moral desert*. You can have high output with low moral desert (e.g., inheriting a factory). This causes them to talk past each other when discussing "rewarding merit."

  ***

  # The Minneapolis-Jutland Protocol on Status and Success

  **Signatories:** Camp A (The Celebrate-the-Climb Position) & Camp B (The Cut-the-Poppy Position)
  **Date:** October 2023
  **Subject:** A Framework for Adversarial Collaboration on Social Reward Norms

  ## I. Shared Premises
  *We agree on the following empirical and normative claims. These are not vague compromises; they are the boundaries within which our disagreement operates.*

  1.  **Incentives are Necessary:** Human effort is partially responsive to social reward. A system with zero status differentiation will suffer from free-riding and reduced innovation.
  2.  **Status is Locally Zero-Sum:** Within a specific, closed community, attention and prestige are finite resources. One person's gain in visibility often correlates with another's relative invisibility, even if absolute wealth increases.
  3.  **Luck is Significant:** Variance in outcomes is driven by factors outside individual control (birth, timing, genetics) to a degree that winners systematically underreport and losers systematically over-report.
  4.  **Unbounded Status Seeking is Destructive:** A community that permits unlimited status competition will eventually see trust erode, as members begin to view each other as instruments for climbing rather than ends in themselves.
  5.  **Sanctions are Inevitable:** All communities enforce norms. The choice is not between "sanctions" and "no sanctions," but between *formal/positive* sanctions (awards, promotions) and *informal/negative* sanctions (gossip, leveling).
  6.  **The "Audience" Effect is Real:** Publicizing success changes the behavior of observers. The dispute is strictly about the *direction* and *magnitude* of that change (see Section III).

  ## II. Precise Remaining Disagreements
  *We disagree on the following specific mechanisms. We have phrased these such that each side recognizes their core concern.*

  1.  **The Net Motivational Impact:** Camp A posits that visible success functions primarily as a **beacon**, increasing the aggregate effort of observers by proving the climb is possible. Camp B posits that visible success functions primarily as a **barrier**, decreasing the aggregate effort of observers by highlighting the gap between them and the winner, triggering disengagement.
  2.  **The Nature of Leveling Norms:** Camp A characterizes "cutting the poppy" (e.g., Jantelagen) as **malicious envy**, a desire to reduce the winner's utility without increasing community welfare. Camp B characterizes it as **immune response**, a decentralized penalty for arrogance or free-riding that preserves long-term group cohesion.
  3.  **The Legitimacy of High Status:** Camp A holds that high output generates a **moral claim** to high status, regardless of luck's role, because the winner bore the risk. Camp B holds that high output generates a **practical claim** to reward, but not a moral claim to superiority, because luck undermines desert.

  ## III. Summary of Dispute Stakes

  | Feature | Camp A (Celebrate) | Camp B (Cut) |
  | :--- | :--- | :--- |
  | **Primary Risk** | Stagnation; punishing virtue. | Fragmentation; arrogance. |
  | **View of Winner** | A scout who found a path. | A member who forgot the group. |
  | **View of Envy** | A vice to be suppressed. | A signal of norm violation. |
  | **Optimal Norm** | "You can be too." | "You are not better than us." |
  | **Failure Mode** | The talented leave or hide. | The talented become arrogant or alienated. |

  ## IV. The Cruxes
  *These are the empirical questions that, if settled, would force at least one side to update their position. We pre-register our predictions below.*

  ### Crux 1: The Relative Deprivation Threshold
  **Question:** Does exposure to a peer's significant success increase or decrease the observer's subsequent productivity in a zero-sum environment?
  **Natural Experiment:** Sales teams or academic departments where one member receives a disproportionate public award.
  **Camp A Prediction:** Observer productivity **increases**. The award clarifies the path to success; the "beacon" effect outweighs the "gap" effect.
  **Camp B Prediction:** Observer productivity **decreases** (or quality of collaboration drops). The award signals a hierarchy shift; observers perceive the game as rigged or the gap as unbridgeable, leading to disengagement or sabotage.

  ### Crux 2: The Function of Leveling Sanctions
  **Question:** When a high-status individual is socially sanctioned for "acting big," is the trigger primarily their *success* or their *behavior*?
  **Case Study:** High earners returning to their hometowns. Compare treatment of those who donate/build locally vs. those who merely display wealth.
  **Camp A Prediction:** Sanctions are applied regardless of behavior. The **success itself** is the provocation. Even humble winners are cut down (pure envy).
  **Camp B Prediction:** Sanctions are conditional on behavior. Humble winners are tolerated; arrogant winners are cut. The **breach of reciprocity** is the provocation (legitimate sanction).

  ### Crux 3: The Luck Legitimacy Buffer
  **Question:** Does public attribution of success to luck reduce resentment and social friction?
  **Argument:** If Camp B is right that the issue is "unearned desert," acknowledging luck should solve it. If Camp A is right that the issue is "hierarchy," acknowledging luck won't matter.
  **Camp A Prediction:** No significant change. Resentment is driven by the **resource gap**, not the narrative. Acknowledging luck looks like false modesty.
  **Camp B Prediction:** Significant reduction in friction. Resentment is driven by **illegitimate hierarchy**. Acknowledging luck restores moral equality even amidst material inequality.

  ## V. Identified Verbal Disputes
  *We acknowledge that the following terms are doing double duty in our debate. We will not use them without qualification going forward.*

  1.  **"Merit"**
      *   **Camp A Usage:** *Output-based.* Did you produce the value? If yes, you have merit.
      *   **Camp B Usage:** *Character-based.* Did you earn this relative to your starting advantage? If no, you lack merit.
      *   **Resolution:** We will distinguish between **Performance** (A's definition) and **Desert** (B's definition).

  2.  **"Community"**
      *   **Camp A Usage:** *Network.* A group of individuals exchanging value. Success benefits the network by raising the ceiling.
      *   **Camp B Usage:** *Organism.* A bounded entity requiring homeostasis. Success threatens the organism if it creates internal hierarchy.
      *   **Resolution:** We will specify whether we are discussing **Open Networks** (favoring A) or **Closed Groups** (favoring B).

  3.  **"Arrogance"**
      *   **Camp A Usage:** *Internal State.* Believing you are better than others.
      *   **Camp B Usage:** *External Claim.* Acting as if you do not need others.
      *   **Resolution:** We agree to judge arrogance by **dependency acknowledgment** (B's definition) rather than internal confidence (A's definition).

