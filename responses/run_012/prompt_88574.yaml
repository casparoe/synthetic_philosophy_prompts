prompt: |-
  I'm an actuary by training, and I spend my working life in state-contingent claims: I model outcomes as states of the world, assign payoffs to agents in those states, and price or evaluate policies using expected utility over a complete market. I'm fluent in that vocabulary — state-contingent commodities, risk-neutral measures, the distinction between a state and a payoff vector, and the machinery for representing one agent across many states by indexing them. I am, however, a novice in moral philosophy. I've been arguing with two friends after a reading group on population ethics: one is a total utilitarian who thinks the procreation asymmetry is an incoherent halfway house, the other is a person-affecting restrictionist who thinks it is one of the few deliverances of common moral sense we should not give up. The asymmetry, as I understand it, is the cluster of claims that bringing into existence a person who will be miserable is wrong or bad even if that life contains more happiness than suffering overall, that bringing into existence a person who will be happy is not required for the sake of that person, that the absence of a miserable person is good, and that the absence of a happy person is not bad. I want you to restate this position as faithfully as you can in my actuarial vocabulary — treating existence as a state, welfare as a payoff, and personal identity as an index that links the same agent across states — and then give me the residue report. Be honest about when the translation is doing my framework's work rather than carrying the original claim.

  Specifically, I want to know what survives intact, what survives only with distortion, and what cannot be expressed at all. Does the framework force me to treat non-existence as a state with a zero payoff, and if so, does that beg the question against the asymmetry rather than translating it? What happens to the person-affecting restriction — the thought that the relevant reasons must be reasons for someone — when the someone in question is an index that does not exist in some states? Can the framework represent the difference between making an existing person happy and bringing a happy person into existence, or does it collapse both into the same payoff vector? And what becomes of the idea that a miserable life is bad not merely because of its total welfare but because it is imposed on a new person who had no prior stake in the matter? In the verdict, tell me whether the residue indicts my actuarial vocabulary — because it cannot represent person-affecting value without importing an unmodeled deontic constraint — or whether it indicts the asymmetry, because the asymmetry leans on a metaphysical difference between existence and non-existence that decision theory rightly refuses to reify. Do not simply tell me which side to take; tell me what the translation itself shows.

  Please structure the response as follows: (1) Target vocabulary — one paragraph laying out the terms you will use and what each is meant to correspond to; (2) The restatement — two to three paragraphs restating the asymmetry in those terms as faithfully as possible; (3) Clean translations — a list of four or five claims that carry over without loss; (4) Distorted translations — a list of four or five claims that carry over only with strain, naming the strain in each case; (5) The residue — two paragraphs on what has no counterpart in the actuarial framework at all; (6) Verdict — one paragraph on whether the residue is a defect of the target vocabulary or a sign that the original asymmetry was less clear than it looked.
