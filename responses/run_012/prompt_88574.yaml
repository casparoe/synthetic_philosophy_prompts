answer: |-
  (1) Target Vocabulary
  We will model the moral landscape as a measurable space of states of the world $\Omega$, representing distinct policy choices (e.g., procreate vs. abstain). Let $I$ be a master index set of *potential* agents. For any state $\omega \in \Omega$, let $I_\omega \subseteq I$ be the subset of indices that exist in that state. For each $i \in I_\omega$, we assign a welfare payoff $U_i(\omega) \in \mathbb{R}$. Crucially, if $i \notin I_\omega$, $U_i(\omega)$ is undefined, not zero; the index is outside the domain of the payoff function for that state. A moral policy is a selection of $\omega$ based on an evaluation functional $V(\omega)$. The "person-affecting restriction" will be modeled as a constraint on the summation domain of $V$, limiting moral weight to agents who exist in a baseline reference state $\omega_0$. Risk-neutral pricing corresponds to summing expected welfare, while the "asymmetry" will be tested as a modification to the weighting measure or the domain of integration.

  (2) The Restatement
  In your actuarial terms, the procreation asymmetry asserts a discontinuity in the valuation of the index set $I_\omega$ depending on whether an index $i$ is in the baseline existence set $I_{\omega_0}$. For any $i \in I_{\omega_0}$ (an already existing person), standard expected utility applies: we maximize $E[U_i(\omega)]$, treating gains and losses symmetrically. However, for any $j \in I_\omega \setminus I_{\omega_0}$ (a new person), the valuation functional $V$ applies a kinked loss function. If $U_j(\omega)$ falls below a misery threshold $\tau$, the policy $\omega$ incurs a heavy penalty (a negative valuation), effectively treating the creation of $j$ as a liability. But if $U_j(\omega) > \tau$ (a happy life), the marginal contribution of $j$ to $V(\omega)$ is zero. The absence of $j$ in $\omega$ (where $j$ would have been miserable) yields a positive valuation relative to the state where $j$ exists, but the absence of $j$ (where $j$ would have been happy) yields no negative valuation relative to the state where $j$ exists.

  This creates a state-contingent claim structure where the "price" of bringing a new index into the domain depends entirely on the sign of the payoff, violating the linearity of standard pricing measures. The claim that creating a miserable person is wrong "even if net positive" implies that the suffering component of $U_j$ carries a higher weight than the happiness component, or that existence itself carries a cost that must be offset. The person-affecting restriction is modeled by asserting that moral reasons must be gradients $\nabla U_i$ for some $i$ that is defined in both the chosen state and a counterfactual state. If $i$ is only defined in the chosen state, $\nabla U_i$ is mathematically undefined, yet the asymmetry insists we can evaluate the "badness" of the miserable case while declaring the "goodness" of the happy case null.

  (3) Clean Translations
  *   **Welfare as Payoff:** The intuition that welfare is a quantifiable good that can be summed or averaged across a population translates perfectly to the payoff vector $U(\omega)$.
  *   **States as Policies:** The distinction between "what happens if we procreate" and "what happens if we don't" maps cleanly to distinct states $\omega_1, \omega_2 \in \Omega$.
  *   **Identity Indexing:** The philosophical problem of "which person is which" across scenarios is handled rigorously by the index set $I$, allowing you to track specific agents across states where they exist.
  *   **Expected Value for Existing Agents:** For any $i \in I_{\omega_0}$, the requirement to improve their welfare translates directly to maximizing $E[U_i(\omega)]$, matching standard risk-neutral valuation.
  *   **Thresholds for Harm:** The intuition that there is a level of suffering that renders a life "not worth starting" translates to a boundary condition $\tau$ where $U_j(\omega) < \tau$ triggers a constraint violation.

  (4) Distorted Translations
  *   **Non-Existence as a Payoff:** If you model non-existence as $U_i(\omega) = 0$, you beg the question. The asymmetry requires non-existence to be *incomparable*, not zero. Setting it to zero implies creating a happy person (+5) is better than non-existence (0), which the asymmetry denies.
  *   **The Person-Affecting Restriction:** In your framework, a reason is a gradient in the objective function. The restriction says new indices cannot generate positive gradients but *can* generate negative ones. This requires the objective function to be non-differentiable and asymmetric with respect to the entry of new indices, which strains the definition of a coherent functional $V$.
  *   **Symmetry of Gains and Losses:** Actuarial models typically treat a unit of loss and a unit of gain as symmetric magnitudes (perhaps with risk aversion). The asymmetry demands that for new indices, gains have weight 0 and losses have weight $k > 0$. This looks less like utility maximization and more like a Value-at-Risk (VaR) constraint applied only to new entrants.
  *   **The "Imposition" of Existence:** The idea that a miserable life is bad because it is *imposed* translates poorly. In your framework, a negative payoff is a negative payoff. The "imposition" implies a deontic violation (lack of consent) that is not captured by the magnitude of $U_j(\omega)$ alone.
  *   **Comparability of Absence:** The claim that "absence of a happy person is not bad" implies that the state space $\Omega$ does not include the welfare of non-existent persons in the comparison metric. However, the claim "absence of a miserable person is good" implies that the non-existence of that person *does* enter the metric as a positive value. This is a logical inconsistency in the domain definition.

  (5) The Residue
  The primary residue is the **metaphysics of the null index**. In actuarial science, a contract that does not exist has a value of zero; it drops out of the sum. The asymmetry, however, treats the non-existence of a miserable person as a *positive* moral feature (a "good" outcome), while treating the non-existence of a happy person as a *neutral* feature. Your framework cannot represent "neutral" and "good" as distinct properties of the same null value without importing an external labeling system. Furthermore, the framework cannot model the "stake" an agent has in their own existence. In your models, an agent is a vessel for payoff. In the asymmetry, an agent is a stakeholder who must be consulted (conceptually) before the "contract" of life is issued. Since non-existent agents cannot hold stakes, the framework has no variable to represent the violation of a stake that was never held.

  Consequently, the person-affecting restriction collapses under the weight of variable population. If moral reasons must be reasons *for* someone, and the "someone" does not exist in the counterfactual state, there is no $i$ for whom the reason holds. The asymmetry tries to bypass this by saying the reason exists for the miserable person (who does exist in the procreation state) but not the happy person. But this makes the moral value of a state dependent on the *identity* of the occupants in a way that violates the independence of irrelevant alternatives. Your framework forces you to ask: "Is the value of state $\omega$ intrinsic to $\omega$, or relative to the path taken to get there?" The asymmetry requires the latter, while expected utility assumes the former.

  (6) Verdict
  The residue indicts the **asymmetry** more than the vocabulary. Your actuarial framework is designed to ensure coherence across states of the world; it exposes that the asymmetry relies on a category error between "zero value" and "no value." The asymmetry attempts to treat existence as a qualitative threshold that changes the rules of arithmetic (gains count for nothing, losses count for everything) without providing a consistent metric for why the threshold shifts depending on the sign of the payoff. While your vocabulary cannot capture the deontic intuition of "consent to exist" without importing external constraints, this is because that intuition is non-consequentialist by design. The translation shows that the asymmetry is not a coherent valuation function over states, but rather a heuristic rule that violates the transitivity and completeness required for a consistent pricing measure. The framework does not fail to represent the asymmetry; it successfully reveals that the asymmetry cannot be represented as a consistent decision theory.
