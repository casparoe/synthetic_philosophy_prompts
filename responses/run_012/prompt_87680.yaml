prompt: |-
  I'm writing the final for a senior seminar on institutions and long-run development — it's cross-listed, so I've got econ students and a few philosophy grad students who wandered in for the causal inference. 90-minute in-class exam, closed book, no phones, no internet. The essay section is going to be one question, 20 marks, and I need it to be markable by a TA who isn't me. My problem with every previous version of this question is that it collapses into students reciting the settler-mortality / reversal-of-fortune story and the geography-vs-institutions shouting match, and I genuinely can't tell from the scripts whether they understand what a design is doing or just have the literature memorised.

  So I want the question built around a vignette I'll paste into the exam paper. Roughly:

  In the 1890s two European powers drew a colonial boundary through the middle of the territory of a single ethnolinguistic group. Most of the boundary follows a river for about 150 km. But a stretch of roughly 40 km cuts across open savannah with no river, no ridge, no mineral deposit, and no obvious economic feature, where the line was fixed by a surveyor's straight-edge and a slightly disputed treaty map. On the western side, land was administered under communal tenure, with chiefs recognised as intermediaries and no formal registration. On the eastern side the administration introduced individual title registration in the 1910s to encourage a particular export crop, and that system survived decolonisation more or less intact; the western side's tenure was nationalised and then partially re-customised in the 1970s. A 2019 household survey finds that households on the eastern side report about 40% higher cash income, about two more years of schooling, and much higher rates of adherence to the missionary-introduced religion. The two sides are, by every ethnographic account, the same people, speaking the same language, with the same pre-colonial political organisation. There's also a paved road on the eastern side built in the 1960s, and a smuggling route that crosses the river at two well-known points.

  What I want from you: (1) the exam question itself, phrased so that a student who's memorised the literature and a student who can actually reason about identification get clearly different marks; (2) a model answer of about 700 words; (3) a marking scheme built on five must-hit points, 4 marks each, total 20, with a one-line note per point on how candidates typically miss it, plus a short list of the wrong moves that should cap someone at a pass no matter how well written.

  The question needs to force them to actually locate the identifying variation (and notice that the river stretch and the straight-edge stretch are not the same comparison), to say what the estimand is and whether "institutions" is even one thing here, to deal honestly with the schooling and religion variables (I keep getting answers that just say "control for them"), to say what the result does and doesn't license about the aggregate question of why some nations are rich, and to say what would have falsified it. Don't let the model answer turn into a lecture on why institutions matter — it should be about what this design can and can't carry. And nothing in the question can require them to know a specific paper or author, since they can't look anything up.
reasoning: |-
  Here's a thinking process that leads to the suggested exam materials:

  1.  **Analyze the Request:**
      *   **Context:** Senior seminar on Institutions and Long-Run Development (Econ + Philosophy grads).
      *   **Format:** 90-min closed-book exam, one essay question (20 marks).
      *   **Goal:** Distinguish between students who memorized the "Acemoglu/Johnson/Robinson (AJR) / Settler Mortality" narrative and students who understand causal identification/design.
      *   **Input Material:** A specific vignette about a colonial border splitting an ethnolinguistic group (River vs. Straight-edge, Communal vs. Individual tenure, observed differences in income/schooling/religion, road on one side).
      *   **Deliverables:**
          1.  The Exam Question.
          2.  Model Answer (~700 words).
          3.  Marking Scheme (5 points x 4 marks, with common misses and "cap at pass" errors).
      *   **Key Constraints:** Must force identification reasoning (River vs. Straight-edge), define the estimand, address "institutions" heterogeneity, handle post-treatment variables (schooling/religion), limit external validity claims, and discuss falsification. No specific paper citations required.

  2.  **Drafting the Exam Question:**
      *   *Challenge:* Make it open enough for discussion but specific enough to demand technical precision.
      *   *Strategy:* Present the vignette clearly. Ask specific sub-questions that guide the grader but require synthesis.
      *   *Focus:* Don't just ask "Do institutions matter?" Ask "Can *this* design tell us if institutions matter?"
      *   *Drafting:* Start with the vignette. Then ask the student to evaluate the causal claim that property rights caused the income difference. Require them to address the border geometry, the mechanisms (schooling/religion), and the generalizability.

  3.  **Drafting the Model Answer:**
      *   *Constraint:* ~700 words. Needs to be dense and precise.
      *   *Structure:*
          1.  Identification Strategy (RDD/Border discontinuity).
          2.  The "Straight-edge" vs. "River" distinction (Crucial for identification).
          3.  Mechanisms vs. Controls (Schooling/Religion as post-treatment).
          4.  External Validity (What this proves vs. AJR).
          5.  Falsification/Threats.
      *   *Tone:* Analytical, not narrative. Focus on *design*.
      *   *Key Insight:* The river segment is bad identification (selection); the straight-edge segment is good (as-if random). The "institution" is specific (tenure), not generic. Schooling is a mechanism, not a confounder.

  4.  **Developing the Marking Scheme:**
      *   *Requirement:* 5 must-hit points, 4 marks each.
      *   *Point 1: Identification Geometry.* Distinguish straight-edge (random) vs. river (endogenous).
      *   *Point 2: The Estimand/Treatment.* Define LATE at the border, specific tenure rules, not "institutions" broadly.
      *   *Point 3: Post-Treatment Bias.* Schooling/Religion are mechanisms, not controls. Controlling for them biases the total effect.
      *   *Point 4: External Validity.* Local effect vs. aggregate development. Cannot explain cross-country variation generally.
      *   *Point 5: Falsification/Threats.* Smuggling, road placement, pre-existing differences.
      *   *Cap at Pass:* Memorized AJR without applying to vignette, controlling for mechanisms, claiming proof of general theory.

  5.  **Refining and Polishing:**
      *   *Check against constraints:* Does this prevent rote memorization? Yes, because the vignette has specific details (river vs. straight line, road, smuggling) that require application, not recall.
      *   *TA Friendliness:* The marking scheme is explicit. If they don't mention the straight-edge vs. river distinction, they lose 4 marks immediately.
      *   *Word Count:* Keep the model answer tight.
      *   *Philosophy Grads:* Ensure the language allows for epistemic caution (what can we *know*?) without requiring heavy econometrics notation.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the question too leading?
      *   *Fix:* Phrase it as "Evaluate the claim..." rather than "Explain why..." to allow for skepticism.
      *   *Critique:* Is the model answer too long?
      *   *Fix:* Trim the intro and conclusion. Focus on the 5 points.
      *   *Critique:* Is the marking scheme clear for a TA?
      *   *Fix:* Add specific "Look for" phrases and "Red flags."

  7.  **Final Output Generation:** (Proceeding to generate the response based on these steps.)
      *   *Question:* Ensure the vignette is included verbatim or slightly polished for exam format.
      *   *Model Answer:* Ensure it hits the 5 points distinctly.
      *   *Marking Scheme:* Ensure the "Cap at Pass" section is stern enough to filter out the "AJR reciters."

  *(Self-Correction on the Vignette)*: The prompt provides the vignette text. I should use that text in the exam question section to ensure consistency.
  *(Self-Correction on Marking)*: Make sure the distinction between the river boundary and the straight-edge boundary is the centerpiece. That's the key identification nuance.

  8.  **Final Polish:** Check tone. It needs to be academic, rigorous, but clear. (Ready to write).
answer: |-
  ### 1. The Exam Question

  **Question 1 (20 Marks)**

  **Read the following vignette carefully:**

  > In the 1890s two European powers drew a colonial boundary through the middle of the territory of a single ethnolinguistic group. Most of the boundary follows a river for about 150 km. But a stretch of roughly 40 km cuts across open savannah with no river, no ridge, no mineral deposit, and no obvious economic feature, where the line was fixed by a surveyor's straight-edge and a slightly disputed treaty map. On the western side, land was administered under communal tenure, with chiefs recognised as intermediaries and no formal registration. On the eastern side the administration introduced individual title registration in the 1910s to encourage a particular export crop, and that system survived decolonisation more or less intact; the western side's tenure was nationalised and then partially re-customised in the 1970s. A 2019 household survey finds that households on the eastern side report about 40% higher cash income, about two more years of schooling, and much higher rates of adherence to the missionary-introduced religion. The two sides are, by every ethnographic account, the same people, speaking the same language, with the same pre-colonial political organisation. There's also a paved road on the eastern side built in the 1960s, and a smuggling route that crosses the river at two well-known points.

  **Task:**
  A policy analyst argues that this vignette provides causal evidence that secure individual property rights cause long-run economic development. Using the details provided above, evaluate this claim. Your answer must address the validity of the research design, the nature of the "treatment," the role of the observed differences in schooling and religion, and the limits of generalising this result to the broader literature on institutions and development.

  ***

  ### 2. Model Answer (Approx. 700 words)

  The claim that this vignette provides causal evidence for the effect of property rights on development is partially supported, but only if the analysis restricts itself to specific segments of the border and avoids post-treatment bias. The design resembles a spatial regression discontinuity (RDD), but its validity hinges entirely on the geometry of the boundary and the timing of infrastructure.

  **Identification and Boundary Geometry**
  The core identifying assumption is that households immediately on either side of the border are comparable counterfactuals. However, the vignette describes two distinct border types. The 150 km river segment is endogenous; rivers often form boundaries *because* they mark pre-existing divisions or defensible terrain, violating the as-if random assignment of institutions. The 40 km straight-edge segment across open savannah is the only valid source of variation. Here, the border was drawn arbitrarily by a surveyor, making location relative to the line arguably exogenous. A valid design must discard the river segment and compare households only along the straight-edge. If the analysis pools the river and savannah segments, the estimate is biased by selection. Furthermore, the existence of a smuggling route across the river suggests treatment contamination (spillovers) on that segment, further necessitating its exclusion.

  **The Estimand and Treatment Definition**
  Even with the correct segment, the estimand is a Local Average Treatment Effect (LATE) for households near the 1910s border in this specific region. The "treatment" is not a generic variable called "institutions." It is a specific bundle: individual title registration linked to an export crop mandate, persisting through decolonisation. The control condition is communal tenure with chief intermediacy. The result identifies the effect of *this specific tenure shift*, not the effect of "property rights" generally. For instance, individual titling might fail in contexts without the associated export market or where chiefs retain de facto power. Conflating this specific legal change with a broad theoretical construct of "inclusive institutions" is a category error.

  **Mechanisms vs. Confounders**
  The analyst must not control for schooling or religion in the main regression. These variables are observed in 2019, long after the 1910s treatment. They are likely mechanisms (channels) through which property rights affected income, not pre-existing confounders. Individual title may have increased income, which increased schooling demand, or the stability of tenure may have encouraged missionary investment. Controlling for these "bad controls" blocks the causal pathway and biases the total effect of the institution toward zero. The correct approach is to estimate the reduced form effect of the border on income first. Schooling and religion should be analyzed as secondary outcomes to explain *how* the effect operates, not as covariates to isolate the effect.

  **Infrastructure and Threats**
  A major threat to identification is the paved road built on the eastern side in the 1960s. If the road placement was determined by the higher income generated by the property rights system, it is a mechanism. However, if the road was placed for strategic colonial reasons correlated with the border drawing itself, it is a confounder. Without evidence that road placement was orthogonal to the border design, one cannot disentangle the effect of tenure from the effect of market access. The income difference might be driven by the road, not the titles.

  **External Validity**
  Finally, this design does not license broad claims about why some nations are rich and others are poor. It identifies the effect of a marginal change in tenure security at a specific border. It does not address the deep historical causes of why the colonial powers chose different administrative systems in the first place (the "reversal of fortune" question). It also cannot speak to national-level institutional quality, as local border effects may not aggregate. The result is internally valid for the savannah segment (pending the road threat) but externally weak. It demonstrates that institutions can matter locally, not that they are the primary driver of aggregate cross-country development.

  ***

  ### 3. Marking Scheme

  **Total: 20 Marks (5 Points x 4 Marks)**
  *TA Note: Do not award full marks for a point unless the specific conceptual distinction is made. General waffle about "institutions matter" scores zero.*

  **1. Identification Geometry (River vs. Straight-Edge)**
  *   **Full Marks (4):** Explicitly distinguishes the 150km river segment (endogenous/selected) from the 40km straight-edge segment (exogenous/as-if random). Argues analysis must restrict to the straight-edge.
  *   **Common Miss:** Treats the entire border as a single natural experiment; fails to note that rivers are often chosen *because* of pre-existing differences.
  *   **Look for:** "Endogenous border," "arbitrary straight line," "exclude river segment."

  **2. The Estimand and Treatment Specificity**
  *   **Full Marks (4):** Defines the effect as Local (LATE/border-specific) and the treatment as a specific bundle (title + export crop), not generic "institutions."
  *   **Common Miss:** Refers to the treatment as "good institutions" or "property rights" generally; claims this explains national development levels.
  *   **Look for:** "Specific tenure rules," "local effect," "not generalizable to all institutions."

  **3. Post-Treatment Bias (Schooling/Religion)**
  *   **Full Marks (4):** Identifies schooling and religion as mechanisms (post-treatment outcomes). Argues against controlling for them in the main income specification.
  *   **Common Miss:** Suggests "controlling for schooling and religion to isolate the effect of institutions."
  *   **Look for:** "Bad controls," "mechanisms/channels," "do not condition on post-treatment variables."

  **4. Infrastructure and Confounding (The Road)**
  *   **Full Marks (4):** Identifies the 1960s road as a competing explanation or a mechanism. Notes that if road placement is endogenous to the border/institution, identification is threatened.
  *   **Common Miss:** Ignores the road entirely; or assumes the road is definitely a confounder without nuance.
  *   **Look for:** "Market access," "confounding infrastructure," "endogenous road placement."

  **5. External Validity and Falsification**
  *   **Full Marks (4):** Limits claims to the local context. Acknowledges this does not solve the aggregate "wealth of nations" problem. Mentions smuggling or pre-colonial differences as falsification tests.
  *   **Common Miss:** Claims this proves the AJR/Setter Mortality thesis generally; ignores the smuggling route contamination.
  *   **Look for:** "External validity," "aggregate development," "smuggling/spillovers."

  **Cap at Pass (10/20) Triggers:**
  *   **The "AJR Recital":** If the student spends >50% of the essay discussing Settler Mortality, Reverse of Fortune, or Acemoglu/Johnson/Robinson without tying it tightly to the vignette's specific geometry.
  *   **The "Control Everything" Error:** If the student explicitly argues they must control for schooling and religion to find the causal effect (demonstrates fundamental misunderstanding of causal ordering).
  *   **The "River Blindness":** If the student treats the river boundary as equally valid for identification as the straight-edge.
