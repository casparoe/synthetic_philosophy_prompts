      *   **Task 3:** Evaluate the impact of measurement artifacts (record-keeping, medicine, weapon lethality) on the "nicer humanity" narrative.
      *   **Task 4:** Address the philosophical/semantic question: Is "violence is declining" a determinate claim or does it dissolve under semantic shift?
      *   **Tone:** Critical, analytical, stress-testing (not just nodding along), nuanced.

