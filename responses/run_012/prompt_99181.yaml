answer: |-
  Here is a stress-test of the "Long Peace" thesis, breaking down the causal mechanisms by their estimated explanatory power for the **per-capita** decline in violence, followed by the shift to **absolute numbers**, and finally an interrogation of the data quality and semantic stability of the claim itself.

  ### Part 1: Explanatory Power for Per-Capita Decline
  *Note: Percentages are heuristic estimates based on historical criminology (e.g., Eisner, Goldstein) and political science. They sum to 100% to force a trade-off analysis.*

  **Tier 1: The Structural Heavyweights (60%)**
  1.  **The Leviathan (State Monopoly on Force): 25%**
      *   *Why:* It lands first because the centralization of justice removes the need for private vengeance and feud, which historically drove the bulk of interpersonal homicide rates.
  2.  **Gentle Commerce (Trade Interdependence): 20%**
      *   *Why:* It ranks high because making other people alive and productive becomes more economically valuable than plundering them, fundamentally altering the incentive structure of conflict.
  3.  **Decline of Honor Culture: 15%**
      *   *Why:* This psychological shift from reactive aggression to impulse control explains the specific drop in everyday brawls and dueling that statistics show from the Middle Ages to modernity.

  **Tier 2: The Systemic Moderators (30%)**
  4.  **Demographics (Youth Bulge Dynamics): 10%**
      *   *Why:* Since young males commit the vast majority of violence, societies with aging populations naturally see lower rates regardless of moral progress.
  5.  **International Institutions & Democratic Peace: 10%**
      *   *Why:* This explains the post-1945 drop in interstate war specifically, though it has less explanatory power for pre-modern interpersonal violence.
  6.  **Expanding Moral Circle: 10%**
      *   *Why:* While hard to measure, the gradual inclusion of outsiders, minorities, and animals into the sphere of moral concern reduces the psychological permission to harm.

  **Tier 3: The Correlates & Epiphenomena (10%)**
  7.  **Spread of Literacy/Novels: 5%**
      *   *Why:* This ranks low because literacy correlates with peace but is likely a proxy for state capacity and commerce rather than a direct cause of empathy.
  8.  **Feminization of Culture: 5%**
      *   *Why:* It lands last because while women generally prefer less violence, attributing the decline to their influence risks oversimplifying complex geopolitical and economic shifts.

  ***

  ### Part 2: Ranking for Absolute Numbers of Violent Deaths
  *When measuring total bodies rather than individual risk, population growth and weapon lethality change the weights.*

  1.  **International Institutions & Democratic Peace (25%)** – Preventing a single World War III matters more for absolute body counts than curbing bar fights.
  2.  **Gentle Commerce (20%)** – Global supply chains make total war economically suicidal, preventing the mass mobilizations of the early 20th century.
  3.  **The Leviathan (15%)** – States curb civil war, but modern states also industrialize killing, making this a double-edged sword for absolute totals.
  4.  **Demographics (15%)** – A larger global population means even a tiny violence rate yields high absolute numbers; this is a driver of totals, not a reducer.
  5.  **Decline of Honor Culture (10%)** – Irrelevant to mass warfare, which drives absolute numbers more than interpersonal disputes.
  6.  **Expanding Moral Circle (5%)** – Moral restraint rarely stops industrial slaughter once the machines are built.
  7.  **Spread of Literacy/Novels (5%)** – Educated populations can still be mobilized for genocide (e.g., Nazi Germany).
  8.  **Feminization of Culture (5%)** – Minimal impact on the strategic decisions that lead to high-casualty conflicts.

  **Where and Why the Orderings Come Apart**
  The rankings diverge because **per-capita rates measure individual safety, while absolute numbers measure systemic risk.** The "Leviathan" drops in the absolute ranking because the modern state is the only entity capable of generating violence on a scale that dwarfs all pre-modern conflict (nukes, bombers, mechanized infantry); conversely, "International Institutions" rise because their primary function is preventing those specific high-casualty escalation ladders, which matters little for a medieval homicide rate but everything for global survival. Demographics also shifts from a neutral background factor to a primary driver, as population explosion can mask rate declines with rising total death tolls.

  ***

  ### Part 3: The Measurement and Semantic Gut-Check

  **1. The "Better Record-Keeping and Medicine" Critique**
  If the drop in violence is largely attributable to improved trauma medicine (turning assaults into non-fatal injuries), superior record-keeping (counting deaths more accurately now than in the chaotic past), and less lethal weaponry in civilian contexts, **it guts the "moral progress" narrative by roughly 50%.**
  *   **Why:** It shifts the explanation from *human nature changing* (we are nicer) to *human competence changing* (we are better at saving lives and counting bodies). A stab wound in 1300 was a homicide; in 2024, it is an aggravated assault. If we track *violent acts* rather than *violent deaths*, the decline curve flattens significantly. This suggests we haven't necessarily become more pacifistic, but rather more technologically resilient to our own aggression.

  **2. Is "Violence is Declining" a Determinate Claim?**
  **No, the claim dissolves under semantic scrutiny.**
  *   **Why:** The definition of "violence" is historically fluid; behaviors once considered legitimate discipline (corporal punishment, domestic chastisement, colonial pacification) are now categorized as violence, while new forms of structural violence (algorithmic bias, economic strangulation, drone warfare) are often excluded from traditional counts. If the category expands to include psychological harm and structural coercion, the decline might vanish; if it restricts itself to "battle deaths," the decline is an artifact of how we define war. Without a fixed ontology of what constitutes harm, the "decline" is a moving target that tells us more about our current moral blind spots than historical reality.
