prompt: |-
  ok so a friend of mine keeps going on about how humanity is getting less violent and citing the usual suspects, and I want to actually stress-test the why of it instead of just nodding along. Here's the pile of candidate explinations I've accumulated for the long-run decline: the state grabbing a monopoly on force; commerce making war and conquest unprofitable; the moral circle slowly widening so people care about ever-more-distant strangers; the feminization of culture; the spread of literacy and especially novels; the decline of honor culture and dueling; a shift away from a surplus of young unmarried men; and international institutions plus the whole democratic-peace thing. Rank these by how much of the real decline each one actually explains — give each a rough percentage share, sort them into tiers, and say in a sentence why each lands where it does. Then redo the ranking for absolute numbers of violent deaths rather than per-capita rates, and tell me where the two orderings come apart and why. Finally: if it turned out the drop is mostly better record-keeping, better emergency medicine turning assaults non-fatal, and weapons being less lethal when they're actually used, how much would that gut the whole we-gradually-became-nicer story? And is violence is declining even a determinate claim, or does it dissolve once you notice the word keeps changing what it covers?
reasoning: |-
