answer: |-
  **The Currency of Accusation: On the Forfeiture and Transferability of Moral Standing**

  The concept of 'standing to blame' is, as you suspect, a borrowing from the law. In a court, *locus standi* determines whether a plaintiff has a sufficient connection to the harm to sue. In morality, the metaphor suggests that blame is not merely a reaction to a wrong, but a normative practice requiring authority. To blame someone is to demand something of them: an acknowledgement, an apology, a reform. The question is whether a hypocrite retains the authority to make that demand.

  For the purposes of your novel, and indeed for the coherence of moral practice, I argue the following: **Hypocrisy forfeits standing entirely, rather than merely diminishing the weight of the blame.** Furthermore, this forfeiture is **piecemeal**, restricted to the specific fault committed. Finally, and most critically for your plot, standing is **inherently non-transferable**. To treat it as a tradeable commodity is a category error that converts moral accountability into a market transaction.

  Here is the defence of that position, followed by a map of what is settled and what remains contested in the philosophical landscape.

  ### I. Forfeiture vs. Weight

  There are two ways to view the hypocrite. The first is the 'Weight View': the hypocrite can blame, but their voice carries less gravity. We might listen to them with a grain of salt. The second is the 'Forfeiture View': the hypocrite lacks the right to blame at all. Their speech act is infelicitous; it is not just weak, it is void.

  I defend the Forfeiture View. Blame is not merely a description of wrongdoing ('You did X'); it is a moral address ('You ought not to have done X, and I hold you to that'). This address presupposes a relationship of mutual accountability. When a blamer commits the very wrong they denounce, they violate the norms of that relationship. They implicitly claim a moral superiority or a commitment to a value they have themselves flouted.

  If standing were merely a matter of weight, the hypocrite would still be 'in the game', merely playing poorly. But hypocrisy undermines the *basis* of the game. Consider a referee who secretly bets on the match. We do not say their calls are merely 'less persuasive'; we say they have no authority to officiate. Similarly, when you blame for a wrong you are busily committing, you are not just an unreliable narrator; you are acting without jurisdiction. Your blame becomes a form of manipulation rather than accountability. Therefore, the tribunal in your novel is correct to rule on standing as a binary threshold: one either has the right to speak, or one does not.

  ### II. Wholesale or Piecemeal?

  Does a thief lose the standing to blame a murderer? Or only the standing to blame another thief?

  Here, the Forfeiture View must be nuanced. Standing is lost **piecemeal**, relative to the specific norm violated. This is the principle of 'relevant similarity'. If I cheat on my taxes, I forfeit the standing to blame you for cheating on yours. I do not, however, forfeit the standing to blame you for assault.

  Why? Because standing is grounded in the specific values underpinning the norm. To blame someone for theft is to invoke the value of property rights. If I respect property rights but violate honesty, my commitment to property remains intact. But if I violate the very norm I am invoking, I renounce the authority of that norm.

  Therefore, your protagonist's tribunal must be granular. A ruling should not strip a person of the right to blame *generally*, but only regarding specific categories of fault. If the tribunal issues a blanket ban, it is overreaching. If it allows a known adulterer to condemn a thief, it is philosophically sound.

  ### III. The Impossibility of Trade

  This is the crux of your novel's mechanism. You propose that standing rulings are tradeable. Philosophically, this is a **category error**.

  Standing is not a property; it is a relation. It arises from the specific moral relationship between the blamer and the blamed. It is rooted in the blamer's own commitment to the values at stake. I cannot give you my standing any more than I can give you my conscience. If I transfer my 'right to blame' to you, you are not blaming on my behalf; you are blaming on your own. If you are innocent of the fault, you have your own standing; you do not need mine. If you are guilty, my standing cannot cleanse you.

  To make standing tradeable is to commodify moral authority. It suggests that accountability is a resource to be hoarded or spent, rather than a duty arising from community. In your novel, this should be the central irony: the tribunal treats standing as a currency, which proves that the tribunal itself is corrupt. The 'tradeable ruling' is a fiction. A person holding a 'transferable standing token' is merely engaging in a charade. They are not truly blaming; they are performing a transaction. This fits your hypocritical protagonist perfectly: she runs a system that claims to purify moral speech while turning it into a marketplace.

  ### IV. Settled vs. Contested

  To ensure your character does not sound naive to those familiar with the ethics literature, you must distinguish between the consensus and the live debates.

  **What is broadly settled:**
  1.  **Hypocrisy matters:** Almost no contemporary ethicist argues that hypocrisy is irrelevant. There is a consensus that a blamer's own conduct affects the propriety of their blame.
  2.  **Standing is distinct from truth:** It is settled that a hypocrite can be *correct* about the wrong (the accused did do it) while still lacking the *standing* to say it. Truth and authority are separate tracks.
  3.  **The 'Tu Quoque' limit:** It is settled that pointing out hypocrisy does not automatically exonerate the accused. (i.e., 'You stole too' does not prove 'I didn't steal'). Your tribunal already respects this by not ruling on the accused's guilt.

  **What is contested (and where your character risks controversy):**
  1.  **Forfeiture vs. Mitigation:** As argued above, I take the Forfeiture side. However, a significant camp (including philosophers like R. Jay Wallace) suggests hypocrisy merely *mitigates* the force of blame. A character asserting Forfeiture as absolute fact may be challenged by a philosopher character who argues that the hypocrite's blame is still 'apt', just 'unfair'.
  2.  **The Scope of Relevance:** There is debate over how similar the faults must be. Some argue that general moral integrity is required for *any* standing (the 'Wholesale' view). Others argue for strict specificity. Your character should acknowledge that drawing the line on 'similarity' is difficult.
  3.  **The Value of Standing:** Some theorists argue 'standing' is just a shorthand for 'the negative consequences of blaming'. They argue we shouldn't talk about rights to blame, but rather when blaming is *productive*. If your character treats standing as a metaphysical right, a skeptic might argue she is reifying a social tool.

  ### V. Conclusion for the Draft

  Your protagonist is a hypocrite running a tribunal on standing. The philosophical truth that serves your theme best is this: **Standing is a personal moral authority that is forfeited by relevant hypocrisy and cannot be transferred.**

  By making the rulings tradeable, you are not depicting a functional moral system; you are depicting a bureaucracy that has lost the plot. The 'tradeable standing' is the ultimate hypocrisy. It allows the innocent to sell their authority to the guilty, allowing the guilty to blame without consequence.

  If your protagonist confidently asserts that standing *can* be traded, she reveals her own corruption. If she asserts it *cannot*, yet trades it anyway, she reveals her cynicism. But if you wish her to be philosophically robust in her *theory* while corrupt in her *practice*, she should maintain that standing is personal and forfeitable, while the *administration* of the tribunal treats it as a commodity.

  The tragedy of your novel, then, is not that people lose the right to speak, but that they believe that right can be bought and sold. Standing is the one thing that must be earned by conduct; to make it tradeable is to destroy it. Your tribunal is not a court of justice; it is a market for indulgences. And that is a far richer joke than a simple hypocrite.
