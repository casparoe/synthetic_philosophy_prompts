      *   **Section 1: Forfeiture vs. Weight.** Address the "hypocrite" aspect. Argue that hypocrisy undermines the *authority* to blame, not just the *persuasiveness*. Use the concept of "moral authority."
      *   **Section 2: Scope (Wholesale vs. Piecemeal).** Is it all blame or just specific blame? Argue for the "Same Fault" principle. You can blame a thief for stealing even if you cheat on taxes, but not if you also steal.
      *   **Section 3: Transferability.** This is crucial for the novel. Argue that standing is inherently personal. It arises from a relationship. Trading it turns blame into a commodity. This makes the tribunal's tradeable rulings a philosophical absurdity (which is great for the story).
      *   **Section 4: Settled vs. Contested.** Be honest about the philosophy.
          *   *Settled:* Hypocrisy matters.
          *   *Contested:* Whether it nullifies standing entirely or just mitigates weight. Whether "standing" is just a proxy for "consequences of blaming."
      *   **Conclusion:** Summarize. Tie back to the novel's themes.

