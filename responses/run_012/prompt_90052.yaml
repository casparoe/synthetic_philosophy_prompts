  *   **Candidate Rules:** Current Linear ($100 \times p$), Ravi's Hybrid ($100 \times p - 20$ penalty), Brier Score ($100 \times (1 - (p - o)^2)$).
  *   **Key Properties:** Properness (is honesty optimal?), Continuity (are there cliffs?), Boundedness (is there negative infinity?), Sharpness (does it reward precision?).
  *   **Linear:** Improper. Incentivizes reporting 1.0 for any credence $> 0.5$.
  *   **Ravi's:** Discontinuous. Incentivizes reporting exactly 0.89 to avoid penalty. Punishes genuine high confidence (0.95).
  *   **Brier:** Proper. Continuous. Penalizes error magnitude. Intuitive scaling.
  *   **Team Crank:** Outcome vs. Process. Tournament measures accuracy, not methodology validity.
  *   **Intervals:** Point estimates required for scoring. Midpoints are gameable (wide intervals = 0.5).

  ***

  **MEMORANDUM**

  **TO:** Forecasting Tournament Standards Committee
  **FROM:** Chair, Standards Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Scoring Rule Adoption and Case Rulings for Spring Season

  **Recommendation**
  Effective immediately for the upcoming season, the committee should adopt the **Scaled Brier Score** as the official tournament metric. The formula is: $Score = 100 \times (1 - (p - o)^2)$, where $p$ is the reported probability and $o$ is the outcome (1 if true, 0 if false). Abstentions receive 0 points. Ties in final standings are broken by the number of questions answered. Regarding pending cases: Team Crank retains their win based on score alone; interval forecasts are rejected and must be resubmitted as point estimates.

  **The Scoring Rule Debate**
  We must acknowledge why the current Linear Rule ($100 \times p$) is failing. It is not *proper*. Under a linear rule, if your true credence is 60%, your expected points are maximized by reporting 100%, not 60%. This forces careful forecasters to mimic overconfident ones to compete, distorting the data we collect on student judgment.

  Ravi's "Accuracy with Humility" proposal attempts to fix this by penalizing reports over 0.9. While well-intentioned, it introduces a discontinuity—a cliff edge at 0.90. Consider a student with a genuine 0.95 credence. Under Ravi's rule, reporting 0.95 yields an expected score lower than reporting 0.89, because the penalty outweighs the accuracy gain. This rule does not encourage honesty; it encourages strategic underconfidence, capping reports at 0.89 regardless of evidence. It swaps one distortion for another.

  The Scaled Brier Score is the standard repair. It is *proper*, meaning your expected score is maximized only when you report your true credence. It is continuous, so there are no cliffs where a 0.89 report is vastly superior to a 0.90. It rewards sharpness (moving $p$ closer to 1 when correct) but penalizes error magnitude quadratically. It aligns incentives with epistemic honesty without requiring students to perform algebra during the tournament.

  **Case Rulings**
  **Team Crank:** The committee is divided on whether methodology should matter. The strongest case for disqualifying Team Crank is that forecasting should reward *understanding*, not luck. If their model is unfalsifiable astrology, letting them win legitimizes pseudoscience in a policy school. However, the strongest case against this view is operational: judging "reasoning quality" introduces subjective bias. Who defines valid reasoning? Base-rate updating often loses to lucky outliers in short tournaments. If we prize methodology over accuracy, we are no longer running a forecasting tournament; we are running a essay contest. To maintain objectivity, the prize must follow the score. We can add a separate award for "Best Methodology" next season, but the cash prize belongs to the highest score.

  **Interval Forecasts:** The student arguing for intervals raises a valid epistemic concern: point estimates can feel artificially precise. However, scoring rules require a single number to calculate utility. Allowing intervals creates ambiguity. Scoring at the midpoint is easily gamed; a student could report "0.01 to 0.99" to lock in a 0.5 score without taking a stance. This defeats the purpose of measuring calibration. We must require point estimates. To address the student's concern, we will issue guidance stating that the required number should represent the median of their credence distribution, acknowledging that uncertainty is inherent but must be quantified for comparison.

  **Implementation**
  The TAs will update the scoring script to implement the Brier formula. We will communicate these changes to participants before registration opens. This decision settles the rule question for the Dean's review next week.

