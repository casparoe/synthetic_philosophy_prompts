answer: |-
  0.76

  Here is the decomposition. The number represents the credence that *strict* qualia (intrinsic, ineffable, private, incorrigible) are an incoherent posit, not that experience itself is an illusion.

  ### Decomposition

  1.  **Non-Dispositional Facts (0.15)**
      *   *Proposition:* There exist facts about "what it's like" that are not reducible to dispositional/functional/physical profiles.
      *   *Weight:* High. If this is true, strict qualia survive. If false (as I weight it), they collapse into functional states.
      *   *My assignment:* Low credence. The parosmia case suggests the "fact" is entirely carried by the dispositional state of the epithelium and subsequent processing.

  2.  **Genuine Underdetermination (0.30)**
      *   *Proposition:* The Maxwell House case is *in principle* unsolvable (no further info settles it).
      *   *Weight:* Medium-High. If it is genuinely underdetermined, there is room for a non-physical fact.
      *   *My assignment:* Low credence. It is likely merely under-described. fMRI or peripheral assays could likely distinguish the neural correlates of "I changed" vs. "Coffee changed."
      *   *Crucial Note:* Resolving this *against* underdetermination (i.e., finding a physical fact) increases the credence in incoherence, because it reduces the "fact of the matter" to mechanism, stripping the "intrinsic/private" features.

  3.  **Parosmia Interpretation (0.90)**
      *   *Proposition:* The parosmia case counts *against* strict qualia.
      *   *Weight:* High.
      *   *My assignment:* High credence. You identified the tension correctly: the fact of the matter is carried by the nose. This makes the experience *relational* and *extrinsic*, violating the "intrinsic" criterion of strict qualia. It saves the *report*, but kills the *ontological category*.

  4.  **Survival of Phenomenal Consciousness (0.85)**
      *   *Proposition:* If strict qualia go, something worth calling "phenomenal consciousness" (functional/representational) survives.
      *   *Weight:* Low (on the main question). This term prevents the main credence from going to 1.0. It distinguishes *eliminativism* from *revisionism*.
      *   *My assignment:* High credence. Incoherence of the *Cartesian* definition does not entail illusionism about *experience*.

  5.  **Artefact of Stipulation (0.80)**
      *   *Proposition:* The incoherence lies in the four-feature definition, not in the phenomenon of experience.
      *   *Weight:* Medium.
      *   *My assignment:* High credence. Dennett is quining a philosopher's construct, not the raw feel of coffee.

  ### Sensitivity Analysis

  **Most Sensitive Term:** **Term 1 (Non-Dispositional Facts).**
  This is the bottleneck. If you can demonstrate a fact about experience that is *not* a fact about discrimination, reporting, or neural processing, the credence in incoherence drops precipitously (toward 0.10). If all facts about experience are exhaustively described by functional/physical facts, the credence in incoherence rises (toward 0.95).

  **What Would Move It Most:**
  A successful demonstration of **multiple realizability of phenomenology without functional difference.** If you could show two systems that are functionally identical (same inputs, same outputs, same internal processing logic) but differ in "what it's like" (e.g., one sees red, one sees green, behaviorally indistinguishable), Term 1's value spikes, and my 0.76 crashes. Conversely, a complete computational closure of phenomenology (predicting reportable experience perfectly from neural data) pushes it toward 0.90.

  **What Counts as Settlement:**
  Settlement requires a theory that either:
  1.  **Derives** phenomenology from physical/functional facts without remainder (validating incoherence of strict qualia).
  2.  **Identifies** a residual property that resists functional reduction (validating strict qualia).
  Currently, we have neither, but the trajectory of neuroscience (like your parosmia example) strongly favors (1).

  ### Where Your Number is Leaking

  You are sitting at 0.4. Your hunch is correct: **you are leaking on Term 2.**

  You are treating the *existence* of a fact of the matter (in the parosmia case) as a point *for* qualia. It is not. It is a point for *physicalism*.
  *   **Your intuition:** "There is a fact about what the coffee smells like to them, therefore qualia are real."
  *   **Dennett's counter:** "The fact is about the epithelium. Therefore the 'quale' is just the state of the epithelium. Therefore it is not intrinsic/private/ineffable. Therefore strict qualia are dead."

  By thinking the parosmia case saves the "fact of the matter," you are assuming the fact must be *phenomenal*. But the case shows the fact is *peripheral*. If the fact is peripheral, it is public and examinable, violating the "private" criterion. If it tracks damage, it is relational, violating the "intrinsic" criterion.

  Raise your credence that the taster pair is **not** underdetermined (Term 2: lower the probability of genuine underdetermination). Paradoxically, admitting that science *can* settle the coffee case (it's just neural tuning) is what kills the strict qualia posit, not saves it. If you adjust Term 2 to reflect that the case is solvable by neuroscience, your main credence should jump from 0.4 to roughly 0.75.
