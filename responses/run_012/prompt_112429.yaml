prompt: |-
  Ok so I've been going round in circles on the procreation asymmetry and I want an actual credence from you, not a survey of positions. Here's the claim I want a number on: bringing into existence someone whose life will go badly is in itself a bad thing and counts against doing it, whereas bringing into existence someone whose life will go well is not in itself a good thing and does not count in favor of doing it -- and I don't just mean "not required", I mean it isn't a good-making feature at all. What's your credence that that's true?

  Don't just hand me the number, decompose it. Roughly how much rides on each of: (a) whether harm and benefit are essentially comparative -- can you be harmed by being brought into existence at all, given that the alternative isn't a worse state you're in but no state at all, so there's nobody there to be worse off? (b) whether some person-affecting restriction on value is right (i.e. whether only actually-existing people's interests count)? (c) whether the intuitions that drive the asymmetry (nobody mourns the child you didnt have, everybody regrets the miserable one) are tracking something real or are just asymmetries in our psychology? (d) whatever else you think belongs. Give each a rough number with one line of justification, then how they combine into your overall figure, then which one you'd most want resolved and what evidence or argument would move it.

  The thing that actually worrys me, and I suspect is where my credence is soft: the asymmetry seems to say that a future crammed with flourishing happy people is no better, in the relevant respect, then a universe with nobody in it -- and that strikes me as absurd -- but if I abandon that implication I can't see what's left of the asymmetry. So: does accepting the asymmetry really commit me to that, and what's your credence that the asymmetry survives being cashed out in a way that doesn't carry that implication? If you think it doesn't survive, tell me which of the terms above eats the loss.
