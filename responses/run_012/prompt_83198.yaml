answer: |-
  **GLOBAL CANDOR STANDARD (GCS) v9.4**
  **Effective: Immediately**
  **Applies: All Regions**

  **1.0 Elimination of Hedging**
  To maximize operational velocity, all modal verbs suggesting possibility ("could," "might," "perhaps") are banned in internal communications. Statements must be binary. A project is not "challenging"; it is "behind schedule." A colleague's idea is not "interesting"; it is "viable" or "unviable." Softening language is classified as data corruption. If you fear hurting feelings, remember that clarity is the highest form of respect.

  **2.0 The Implicature Loophole**
  Staff are prohibited from lying. However, staff are not responsible for the inferences listeners draw from true statements. This is the principle of *implicature*. If a manager states, "Your report contains many words," this is factually true. If the employee infers "The report is too long," this is an internal inference, not a corporate assertion. Staff do not lie; they merely under-implicate. Do not apologize for the listener's interpretation.

  **3.0 White Lie Exception (Form WL-4)**
  Politeness requiring factual deviation must be pre-approved via Form WL-4. The form requires a Cost-Benefit Analysis of Kindness.
  *   **Field A:** Estimated emotional damage of truth (1-10).
  *   **Field B:** Admin time required to justify lie (minutes).
  *   **Field C:** Did saying "You look rested" save more than 4 minutes of conflict resolution?
  Most requests are denied. The company posits that the administrative burden of maintaining a polite fiction exceeds the cost of interpersonal friction. Efficiency requires friction.

  **4.0 Regional Compliance: Tokyo Office**
  The local practice of "reading the air" (*kuuki wo yomu*) is classified as Non-Compliant Data Verification. Consideration shown through silence is indistinguishable from dissent. To ensure transparency, all agreement must be vocalized. If the air is not read, it is assumed stagnant. Employees attempting to withhold negative feedback to preserve group harmony will be cited for Obstruction of Candor. The policy has no vocabulary for indirect care; therefore, indirect care does not exist.

  **ADDENDUM A: INTERNAL NOTE (J. Van Der Berg, Rotterdam)**
  "I am following the GCS. I told the London team their presentation was 'structurally unsound.' They escalated to HR for 'hostility.' I stated the structural status. I did not attack the architects. Why am I being coached on 'tone'? Tone is not data. If the truth hurts, the wound is pre-existing. I am not the knife."

  **ADDENDUM B: LEAKED MEMO (K. Sato, Tokyo)**
  "We are currently spending 12 hours weekly documenting why we did not speak. When a junior staff member struggles, GCS requires we state 'You are struggling.' Our norm requires we offer help silently to save face. The policy forces us to choose between being compliant and being humane. We are choosing compliance. Please note that morale metrics will reflect this choice as 'neutral,' though the actual sentiment is 'grief.' We are telling the truth, but we are losing the team."

  **5.0 Philosophical Compliance**
  The Global Candor Standard operates on the axiom that falsehood is the only ethical violation. It does not account for condescension. A white lie is often a signal that the listener's emotional state is valued above the speaker's factual precision. By banning the white lie, we do not eliminate deception; we eliminate the signal of care. Staff are reminded: Truth without kindness is not integrity. It is merely weaponized accuracy. Proceed accordingly.
