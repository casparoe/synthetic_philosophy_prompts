          *   *Analysis:* This assumes symmetry. It assumes the uncertainty regarding the *remedy* is sufficient to trigger the PP in the same way as the uncertainty regarding the *original threat*. But the PP usually requires "serious or irreversible harm." Does the remedy *necessarily* threaten serious/irreversible harm just because there is uncertainty? No.
      *   **Reject (5)?** "Applying (4) again licenses a measure against that measure..."
