      *   Measure 2 is a "measure against the harm of Measure 1." It is not a "measure against Measure 1" (i.e., lifting the ban).
      *   Step (4) says it licenses a measure *against* the precautionary measure (i.e., blocking it). But the PP licenses measures to prevent *harm*, not to block *measures*.
      *   If Measure 1 causes Harm B, the PP licenses measures to prevent Harm B. It does *not* necessarily license abolishing Measure 1. It might license mitigating Harm B *while keeping* Measure 1.
