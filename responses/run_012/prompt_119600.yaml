answer: |-
  Colleagues,

  You have asked for a decision procedure that navigates the treacherous waters between historical accuracy and social utility. As a philosopher, I must warn you: 'Tradition' is not a natural kind; it is a social status we confer. Eric Hobsbawm taught us that many traditions we assume are ancient are actually recent inventions designed to legitimise institutions or inculcate values. Benedict Anderson reminded us that communities are 'imagined'—held together by shared narratives, not just blood or soil.

  If your committee's goal is to preserve *history*, you must be ruthless about chronology. If your goal is to foster *cohesion*, you must be generous about function. The following procedure, the **Continuity and Meaning Protocol (CMP)**, attempts to balance these by distinguishing between *Heritage* (preservation of the past) and *Living Tradition* (support for current social cohesion). It is designed to prevent the committee from funding historical falsification while acknowledging the value of invented social glue.

  ### The Continuity and Meaning Protocol (CMP)

  **Step 1: The Documentary Threshold (Evidence of Origin)**
  *   **Question:** Is there verifiable documentary or oral evidence dating the practice?
  *   **Evidence Required:** Written records, photographs, or consistent oral testimony spanning at least two generations (approx. 50 years).
  *   **Stop Point:** If the applicants claim antiquity (pre-1900) but evidence only supports a post-1950 origin, flag for **Step 5**. Do not proceed to Step 2.
  *   **Pass:** Evidence aligns with claims. Proceed to Step 2.

  **Step 2: The Continuity of Practice (The Break Test)**
  *   **Question:** Has the practice been performed continuously, or was there a cessation?
  *   **Criteria:** A gap of more than one generation (25 years) constitutes a 'Break'.
  *   **Action:** If a Break exists, do not reject. Instead, mark as 'Revival'. Proceed to Step 3.
  *   **Pass:** Continuous practice. Proceed to Step 3.

  **Step 3: The Continuity of Meaning (The Hobsbawm Test)**
  *   **Question:** Does the *social function* and *meaning* of the practice today match its historical function, or has it been repurposed?
  *   **Analysis:** A maypole dance originally for fertility that is now a tourist spectacle has changed meaning. A miners' gala originally for labour solidarity that is now a general carnival has changed meaning.
  *   **Hand-off:** If the meaning has shifted fundamentally (e.g., from sacred to secular, or from protest to pageantry), the application moves to the **'Living Tradition'** funding stream (Community Arts), not **'Heritage'** (Historical Preservation).
  *   **Pass:** Meaning remains consistent. Proceed to Step 4.

  **Step 4: Community Ownership (The Anderson Test)**
  *   **Question:** Who 'imagines' the community that sustains this tradition? Is it the local populace or a specific subgroup?
  *   **Criteria:** For City Heritage funding, the 'imagined community' must have a significant nexus to the *current* city geography.
  *   **Action:** If the practice is sustained primarily by a diaspora with weak ties to the current local population, it may qualify for 'Cultural Diversity' funding but fails the 'Local Heritage' test.
  *   **Pass:** Strong local nexus. Proceed to Step 5.

  **Step 5: The Truth Claim Audit (Integrity Check)**
  *   **Question:** Does the application marketing claim historical continuity that Steps 1 or 2 disproved?
  *   **Criteria:** If the practice is a Revival or Invented (post-1950) but is marketed as 'Ancient' or 'Unbroken', this is falsification.
  *   **Decision:**
      *   **If Honest:** Fund under 'Living Tradition'.
      *   **If Dishonest:** **Reject** for Heritage funding. (Applicants must amend marketing to reflect the true origin to qualify).

  ---

  ### Application to Cases

  #### Case 1: The Miners' Gala (Started 1980s)
  *   **Step 1 (Evidence):** Applicants claim 'Traditional Miners' Heritage'. Evidence shows first event 1984. **Flag for Step 5.**
  *   **Step 3 (Meaning):** Original miner galas were union-led political demonstrations. This 1980s version is a commemorative cultural festival. Meaning has shifted from *political agency* to *memorialisation*.
  *   **Step 5 (Truth Claim):** The application brochure describes it as 'Celebrating our Ancient Mining Customs'.
  *   **CMP Verdict:** **Reject for Heritage Funding.**
  *   **Reasoning:** This is a classic Hobsbawmian 'invented tradition'. It serves a vital social function (mourning industrial loss, cohesion), but it claims a historical continuity that does not exist. To fund this as 'Heritage' is to subsidise historical falsification.
  *   **Recommendation:** Route to 'Community Arts' budget, conditional on rebranding as a 'Modern Commemoration' rather than 'Ancient Custom'.
  *   **Committee Friction:** I anticipate you will dislike this. The Gala is politically popular, and you wish to honour the working-class past. However, the procedure forces you to admit that honouring the past does not require lying about it.

  #### Case 2: The Religious Procession (300 years, 50-year suppression, Diaspora revival)
  *   **Step 1 (Evidence):** Parish records confirm 1720s origin. **Pass.**
  *   **Step 2 (Continuity):** Suppressed 1970–2020 (50-year gap). **Mark as 'Revival'.**
  *   **Step 3 (Meaning):** The ritual form is identical. The meaning has shifted from 'local parish piety' to 'diasporic identity reclamation'. However, the core sacred function remains. **Pass (with note).**
  *   **Step 4 (Community):** Revived by diaspora, but 40% of participants now reside within city limits. **Pass.**
  *   **Step 5 (Truth Claim):** Application states 'Revived Ancient Procession'. **Honest.**
  *   **CMP Verdict:** **Approve for Heritage Funding.**
  *   **Reasoning:** Anderson teaches us that the 'community' is imagined. The diaspora's re-imagining of the city as their spiritual home validates the nexus. The break in practice is acknowledged, not hidden.
  *   **Committee Friction:** You may worry about the 'break' in continuity. However, the procedure validates that *meaning* can survive suppression even if *practice* does not.

  ---

  ### Limitations and Confidence

  I am **75% confident** in this procedure as a tool for ethical governance. It successfully separates historical preservation from social engineering, which is the primary source of conflict in your committee.

  However, the procedure will misfire at **Step 3 (Continuity of Meaning)**. Determining whether a meaning has 'shifted fundamentally' is subjective. A philosopher might argue *all* meanings shift over 300 years. Your non-specialist committee members will struggle to adjudicate whether a maypole dance is 'fertility rite' or 'children's play' without anthropological expertise. This step risks becoming a proxy for cultural bias, where the committee unconsciously privileges meanings they understand (Christian processions) over those they do not (pagan revivals).

  Furthermore, the procedure relies on documentary evidence (Step 1), which inherently disadvantages oral cultures and marginalised groups who did not keep archives. Hobsbawm himself noted that the 'invention' of tradition is often a response to exclusion from official history. By demanding papers, you may systematically exclude the very traditions heritage funding ought to protect.

  Summary: The procedure prioritises honesty about historical breaks over the age of the practice, routing invented traditions to community funds while reserving heritage status for claims that withstand documentary and semantic scrutiny.
