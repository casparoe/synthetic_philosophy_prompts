  **Joint Statement on Determination of Death**

  **1. Agreed Claims**
  1.  **Biology:** Cellular metabolism persists after both neurological and circulatory criteria are met; death signifies organismal integration failure, not cellular cessation.
  2.  **Tests:** Clinical exams confirm absent brainstem function, not necessarily the absence of all somatic integration.
  3.  **Limits:** We cannot prove absolute irreversibility at the bedside; we infer it from failed response to intervention.
  4.  **Gestation:** Somatic support can maintain homeostasis in brain-dead bodies for months, permitting gestation and delivery.
  5.  **DCD:** Circulation can be restored via ECMO after circulatory death declaration to facilitate organ recovery.

  **2. Disagreements**
  | Issue | Neurologist Position | Critical-Care Position |
  | :--- | :--- | :--- |
  | **Locus of Integration** | The brain is the sole integrator of the organism as a whole; its loss equals organismal death. | The body integrates via multiple systems; circulatory loss is the only reliable marker of organismal failure. |
  | **Status of Body** | A brain-dead body is a corpse being ventilated; homeostasis is externally imposed. | A brain-dead body is a living patient; homeostasis demonstrates ongoing organismal function. |
  | **Irreversibility** | Irreversibility is a biological fact; if function returns, death was not present. | Irreversibility is a normative decision; if we choose not to restart circulation, death is present. |

  **3. The Cruxes**
  1.  **Does the brain integrate the organism?**
      *   *Agreed Evidence:* Long-term hormonal homeostasis (vasopressin/thermoregulation) in brain-dead gestating patients without exogenous replacement.
      *   *Predictions:* Neurologist predicts eventual total system collapse; Critical-Care predicts indefinite stability possible.
  2.  **Is irreversibility a fact or a decision?**
      *   *Agreed Evidence:* Rates of auto-resuscitation vs. successful ECMO revival after 5-minute no-touch periods in DCD protocols.
      *   *Predictions:* Neurologist predicts revival proves prior declaration was false; Critical-Care predicts revival proves death is contingent on intervention limits.

  **4. Closing**
  We agree that part of this dispute is verbal: whether "death" names a biological kind or a status we confer to permit organ retrieval and cease treatment. However, substantive disagreement remains regarding whether current protocols identify a biological reality or construct a legal fiction. Until the cruxes are settled, we acknowledge that our consensus is procedural, not ontological.
