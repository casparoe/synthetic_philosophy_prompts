          *   *The "Wonderful Life" Title:* It's not about what George *did* for others; it's about how others *love* him. That's relational, not consequentialist.
          *   *Clarence's Nature:* Clarence isn't a supercomputer; he's a guardian angel. His job isn't truth; it's salvation.
