          *   *Travel/College:* He gives these up. Consequentialist view: Sacrifice now for greater utility later. Cluelessness view: How does he know he wouldn't have done more good as an engineer building bridges elsewhere? The movie sidesteps this by making Potter the clear "evil" consequence.
          *   *The Bank Run:* He uses honeymoon money. Consequentialist view: Prevents immediate collapse (high utility). Cluelessness view: Maybe the bank should have failed? Maybe a crash was necessary? The movie says "No, saving the depositors is the clear good."
          *   *Uncle Billy's Mistake:* The climax. George is suicidal because he thinks the *consequence* (loss of $8,000) outweighs his *life's utility*. Clarence fixes the calculation.
      *   **Where the Film Pushes Back (Where the user might be forcing it):**
