      *   *George's Dilemma:* George constantly sacrifices his personal desires (travel, college, career) for the "greater good" of Bedford Falls. He does this because he *believes* it helps people. But does he *know* it helps? Or is he just hoping?
      *   *Clarence's Intervention:* Clarence solves the cluelessness problem by *giving* George knowledge. He shows the counterfactual. This is the "cheat" the user suspects.

  3.  **Drafting the Analysis - Section by Section:**

