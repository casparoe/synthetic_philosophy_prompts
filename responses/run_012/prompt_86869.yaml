      *   **User's Hypothesis:** The movie is secretly about this problem. Clarence's vision is a "cheat" (holding everything fixed except George) to make George feel better, rather than a realistic assessment of counterfactuals. Alternatively, the film dramatizes the *fantasy* of knowing consequences that a clueless consequentialist craves.
      *   **Tasks:**
