answer: |-
  Your hunch is remarkably astute. You have identified the central tension in contemporary Jesus studies: the field is not merely stalled by a lack of data, but by a fracture in epistemology (how we know what we know) and ontology (what kind of object "the historical Jesus" is).

  You are correct that the two sides are often answering different questions under the same label. However, it is not *only* that; there are also genuine disagreements about the nature of memory and the utility of probabilistic reasoning.

  Here is a breakdown of what is settled, what is contested, and what would actually constitute progress in this field.

  ### 1. What is Settled (The Methodological Baseline)
  There is very little in this field that is "settled" in the sense of universal agreement, but there is a stable baseline shared by almost all critical scholars (both traditional and memory-theory proponents).

  *   **The Gospels are not modern biographies.** There is consensus that the texts are theological narratives shaped by the needs of the early communities. No serious scholar argues that the Gospels record events with the neutrality of a court stenographer.
  *   **The "Exact Words" are largely inaccessible.** There is consensus that recovering the *ipsissima verba* (the very words) of Jesus is, in most cases, impossible. The texts are in Greek; Jesus spoke Aramaic. The traditions circulated orally for decades before being written.
  *   **The Criteria are not algorithms.** Even among defenders of the Criteria of Authenticity (like John Meier or Chris Tilling), there is admission that the criteria are not a mechanical sieve that guarantees results. They are tools for assessing probability, not proofs.
  *   **Jesus was a 1st-century Jew.** While the *implications* of this are debated, there is consensus that Jesus must be understood within the context of Second Temple Judaism, not later Christian dogma or modern secularism.

  ### 2. What is Genuinely Contested
  The disagreement you are sensing stems from three distinct layers of conflict.

  #### A. The Epistemological Disagreement (Can we distinguish history from memory?)
  *   **The Traditional View:** Assumes that while the texts are theological, it is possible to peel back the theological layers to find a "hard core" of historical fact. They assume a distinction between "what happened" and "how it was remembered."
  *   **The Memory Theory View (Chris Keith, Anthony Le Donne, et al.):** Argues that this distinction is false. They draw on social memory theory to argue that memory is *interpretive from the start*. There is no "bare event" that exists prior to its interpretation by the rememberer. Therefore, trying to strip away the interpretation to find the "real" event is like trying to peel an onion to find the core; you end up with nothing.
  *   **The Conflict:** One side believes history lies *behind* the text (to be excavated); the other believes history lies *in* the text (as a function of how Jesus was remembered).

  #### B. The Methodological Disagreement (Criteria vs. Memory)
  *   **The Criteria Defenders:** Argue that Memory Theory is descriptive, not prescriptive. It explains *why* traditions changed, but it doesn't help us decide *which* tradition is older or more likely. They argue we still need criteria (like Multiple Attestation or Embarrassment) to make probability judgments. Without them, any claim is as valid as any other.
  *   **The Criteria Skeptics:** Argue the criteria are circular. For example, the Criterion of Dissimilarity (if it's not Jewish and not Christian, it's Jesus) assumes we know the boundaries of Judaism and Christianity perfectly, and it biases the result toward a Jesus who was unique rather than typical. They argue the criteria often produce a "stranger" Jesus than the one the texts present.

  #### C. The Definitional Disagreement (What is the "Historical Jesus"?)
  *   **The Real Jesus:** Some scholars aim to reconstruct the actual person as he existed in history (ontological reality).
  *   **The Remembered Jesus:** Others argue the only "Jesus" accessible to us is the one remembered by the early church. For them, the "Historical Jesus" *is* the impact he made on his followers, not a reconstruction of his private psyche or exact utterances.
  *   **The Pessimistic Realists (e.g., Dale Allison):** Allison argues that we cannot verify specific incidents (like a specific healing), but we can verify general impressions (e.g., "Jesus was known as a healer"). This sits uncomfortably between the two camps.

  ### 3. Are They Answering Different Questions?
  Your hunch is largely right.
  *   **Question A (Traditional):** "Did Jesus say/do X?" (Focus: Verification of specific units of tradition).
  *   **Question B (Memory):** "Why did the early church remember Jesus as saying/doing X?" (Focus: The function of the tradition in the early community).

  However, it is not *just* talking past each other. The Traditionalists would argue that Question B is insufficient for history. If the church remembered Jesus as an apocalyptic prophet because *they* were apocalyptic, but Jesus wasn't, Question B won't tell us that. Question A is required to correct the memory. The Memory scholars reply that Question A assumes a level of access we simply don't have.

  ### 4. What Would Count as Progress?
  Since new textual evidence (like a lost Gospel) is unlikely to resolve this (it would just introduce new questions about dating and provenance), progress must be conceptual.

  **A. A Shift from "Authenticity" to "Plausibility"**
  Progress would look like abandoning the binary of "Authentic vs. Inauthentic." A saying is not either "from Jesus" or "from the Church." It exists on a spectrum of plausibility within a historical narrative.
  *   *Progress:* Scholars stop claiming "Jesus definitely said this" and start arguing "This saying fits the most plausible reconstruction of Jesus' mission."

  **B. Refined Definitions of Memory**
  The "Memory Turn" is still young. Progress would come from applying cognitive science more rigorously to ancient oral traditions.
  *   *Progress:* Moving beyond vague appeals to "memory" toward specific models of how oral cultures transmit core information while varying peripheral details. If we can model *how* distortion happens, we can better model *where* stability is likely.

  **C. Distinguishing the "Historical Jesus" from the "Real Jesus"**
  Scholars need to be clearer that the "Historical Jesus" is a modern heuristic construct, not the actual man.
  *   *Progress:* Explicitly stating: "This is the Jesus who makes sense of the data," rather than "This is who Jesus really was." This lowers the stakes and reduces theological defensiveness.

  **D. The "General Impression" Consensus**
  Dale Allison has proposed that we stop trying to validate individual bricks (sayings) and look at the wall (the general impression).
  *   *Progress:* If scholars can agree on the "general contours" (e.g., Jesus was a healer, he ate with outcasts, he anticipated a kingdom of God) without fighting over the specific verses that prove it, the field moves forward. (Note: There is actually significant overlap here, even if the methods differ).

  ### 5. Will the Impasse Last?
  Yes, likely indefinitely. Here is why:

  1.  **Philosophical, not Evidential:** The disagreement is ultimately about the philosophy of history. Can we access the past "as it was"? Postmodern and memory theorists say no; positivist historians say yes, approximately. No amount of textual analysis will solve a philosophical disagreement.
  2.  **The Nature of the Sources:** The sources are inherently theological. Asking them to yield non-theological history is like asking a stained-glass window to yield a photograph. You can analyze the glass, but the image is designed to transmit light, not data.
  3.  **The "Jesus" Function:** The figure of Jesus serves too many functions (religious, cultural, political) for the academic consensus to ever fully settle. Every generation reconstructs Jesus in its own image (Liberal Protestant, Jewish Reclaimer, Apocalyptic Prophet, Cynic Sage).

  ### Conclusion
  You are right to suspect that the argument never closes because the participants are often operating with different definitions of "history" and "authenticity."

  **The Verdict:**
  *   **Settled:** We cannot have the "exact words." The Gospels are theological.
  *   **Contested:** Whether we can isolate specific historical events behind the theology.
  *   **Your Hunch:** Correct. The "Criteria" camp is asking about *verification of events*. The "Memory" camp is asking about *generation of tradition*.
  *   **Progress:** Will not come from a new criterion or a new manuscript. It will come from scholars admitting the limits of their method and shifting from "proving authenticity" to "arguing for historical plausibility."

  The impasse is not a failure of scholarship; it is a recognition of the limits of the material. The most honest work now acknowledges that the "Historical Jesus" is a reconstruction that tells us as much about the historian as it does about the carpenter from Nazareth.
