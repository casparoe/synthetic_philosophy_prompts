  (ii) 0.82: The probability that, conditional on real periodicity, the primary driver is endogenous feedback (elite overproduction, fiscal stress, popular immiseration) rather than exogenous shocks like solar minima, volcanic winters, or steppe confederation cycles.
  (iii) 0.85: The probability that the pattern replicates in out-of-sample agrarian regions (e.g., Pre-Columbian Americas, Southeast Asia) not used to calibrate the original Roman-Chinese models.
  (iv) 0.68: The probability that the same structural-demographic mechanism governs post-industrial societies, despite the decoupling of land capacity from economic production and the changed nature of elite wealth.

  These terms combine via the product rule of conditional probability: P(Theory) = P(i) × P(ii|i) × P(iii|i,ii) × P(iv|i,ii,iii), yielding 0.88 × 0.82 × 0.85 × 0.68 ≈ 0.42.

  The headline number is most sensitive to term (ii), the attribution of endogenous causality. A single piece of evidence that would move this most is a high-resolution, globally synchronized paleoclimate record that demonstrates crisis onsets across disconnected agrarian states aligning precisely with external climatic forcing (e.g., solar irradiance dips or volcanic aerosol loading) rather than lagging internal demographic pressures.

  I part company with your 0.35 primarily on term (i). Your lower credence suggests a stronger prior that the periodicity is a statistical artifact of detrending noisy historical series. I weigh recent advances in unevenly spaced spectral analysis and the Seshat Databank's standardized coding higher, which reduces the likelihood that the signal is merely a byproduct of smoothing procedures. While we agree the mechanism is fragile, I assess the raw dynamical signal as slightly more robust than you do.
