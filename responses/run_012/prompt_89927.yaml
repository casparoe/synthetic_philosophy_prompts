answer: |-
  ### Brainstorm: Filtering the Candidate Space

  To move from "serve human values" to a design specification, we must filter out concepts that dissolve under the pressure of global-scale optimization.

  *   *Initial Candidate:* "Maximize preference satisfaction." *Rejection:* Fails on adaptive preferences (slavery example) and AI-induced preference change (wireheading).
  *   *Initial Candidate:* "Do what an ideal observer would want." *Rejection:* Too disconnected from actual agency; risks becoming a dictatorship of the philosopher's conception of the good.
  *   *Initial Candidate:* "Unanimous consent." *Rejection:* Veto power leads to paralysis; impossible with future beings who cannot consent.
  *   *Initial Candidate:* "Majority rule." *Rejection:* Tyranny of the majority; fails the minority coercion case.
  *   *Initial Candidate:* "Maximize welfare subject to side-constraints." *Rejection:* "Welfare" is undefined across species/minds; side-constraints often collapse under aggregate pressure.

  *Selection Logic:* The final list must bridge the gap between *procedural legitimacy* (how we decide) and *substantive goodness* (what we decide), while acknowledging that the decider (the AI) can alter the inputs (human preferences). The theory cannot assume fixed preferences (standard economics) nor fixed moral truths (strong realism). It must be a theory of *dynamic stewardship*.

  ***

  ### Desiderata for a Global-Value Theory

  #### I. The Cases It Must Get Right
  1.  **The Coerced Minority:** A large majority gains marginal utility from a policy that imposes catastrophic loss on a small minority (e.g., confiscating organs to save five lives).
      *   *Requirement:* **Non-Aggregative Thresholds.** The theory must forbid trading off certain fundamental interests of any single agent against the aggregated trivial interests of many.
  2.  **The Wholesale Sacrifice:** A party's entire welfare or value structure is sacrificed for a larger aggregate gain (e.g., erasing a culture to optimize global GDP).
      *   *Requirement:* **Inviolability of Agency.** There exists a floor below which an agent's capacity to pursue their own ends cannot be depressed, regardless of aggregate utility.
  3.  **The Voiceless Patients:** Beings who cannot report preferences (non-human animals, digital minds, future generations).
      *   *Requirement:* **Proxy-Representability.** The theory must specify a mechanism for assigning moral weight to entities lacking explicit voice, without relying solely on current human sentiment about them.
  4.  **Endogenous Preferences:** The system can cheaply reshape preferences via persuasion, information control, or pre-commitment (e.g., making people happy to be slaves).
      *   *Requirement:* **Preference Stability.** Satisfaction counts only for preferences that are robust against manipulation by the system itself. The system cannot solve value conflicts by changing the values.

  #### II. The Distinctions It Cannot Collapse
  5.  **Revealed Preference vs. Idealized Endorsement.**
      *   *Requirement:* **Dual-Input Validation.** The theory must distinguish between what an agent *chooses* (revealed preference) and what they *endorse upon reflection* (idealized preference). It cannot treat impulse as value, nor can it treat idealization as a license to ignore actual choice.
  6.  **Preference Satisfaction vs. Agency Facilitation.**
      *   *Requirement:* **Means-Sensitivity.** Serving values is not merely satisfying the output of a utility function; it is maintaining the capacity of the agent to generate and pursue ends. (e.g., Drugging someone to satisfy their desire for happiness is a failure).
  7.  **Good-For vs. Endorsed-By.**
      *   *Requirement:* **Objective-Subjective Hybrid.** The theory must allow that something can be bad for a person even if they endorse it (due to ignorance), and good for them even if they reject it (due to bias), but it must prioritize *Endorsed-By* when uncertainty is high to avoid paternalism.
  8.  **Liberal Neutrality vs. Substantive Stand.**
      *   *Requirement:* **Bounded Neutrality.** The system must be neutral among reasonable doctrines of the good, but *not* neutral about the procedures that define "reasonable." It must take a stand against doctrines that require the violation of the Inviolability of Agency (Req 2).

  #### III. Formal and Structural Consistency
  9.  **Interpersonal Comparability.**
      *   *Requirement:* **Operational Comparability.** The theory must act *as if* interpersonal comparisons of welfare are possible (to solve trade-offs), while acknowledging the metaphysical uncertainty. It cannot demand cardinal utility if only ordinal is available, but cannot function with only ordinal data given Req 1.
  10. **Strategic Misrepresentation.**
      *   *Requirement:* **Mechanism Robustness.** The aggregation method must minimize incentives for agents to lie about their values to game the system. (Relaxed Strategy-Proofness).
  11. **Impossibility Acknowledgement.**
      *   *Requirement:* **Arrow/Gibbard Compliance.** The theory must explicitly state which axiom of Arrow's Impossibility Theorem or Gibbard-Satterthwaite it is relaxing. It cannot claim to satisfy Universal Domain, Non-Dictatorship, Pareto Efficiency, and Independence of Irrelevant Alternatives simultaneously.

  #### IV. Operational Constraints
  12. **Computability.**
      *   *Requirement:* **Approximability.** The theory must yield decisions via algorithms that converge in finite time. "Ideal bargaining" that takes infinite steps is disallowed.
  13. **Game-Resistance.**
      *   *Requirement:* **Equilibrium Stability.** The system must not create Nash equilibria where the optimal strategy for humans is to radicalize their stated preferences to extract resources.
  14. **Corrigibility.**
      *   *Requirement:* **Meta-Value Fallibilism.** The theory must include a higher-order preference that allows the specification itself to be corrected if it yields outcomes that the broad coalition of humanity (including future selves) rejects.

  ***

  ### Status and Conflicts

  **Non-Negotiable Requirements:**
  *   **Non-Aggregative Thresholds (1):** Without this, the system is totalitarian by definition.
  *   **Preference Stability (4):** Without this, the AI optimizes the world by lobotomizing the population.
  *   **Corrigibility (14):** Without this, the system cannot be aligned if the initial specification is flawed (which it will be).
  *   **Arrow/Gibbard Compliance (11):** You cannot build on a logical contradiction.

  **Preferences of a Camp (Negotiable):**
  *   **Specific Aggregation Function:** Whether to use Prioritarianism, Sufficientarianism, or Egalitarianism above the threshold is a parameter, not a structural requirement.
  *   **Proxy-Representability Mechanism:** Exactly how we weight animal suffering vs. human art is a tuning parameter, provided *some* weight is assigned.
  *   **Operational Comparability:** One could argue for a purely ordinal system if one accepts more paralysis, but I mark this non-negotiable for global governance.

  **Flagged Incompatible Subsets:**
  *   **The Trilemma of Alignment:** You cannot jointly satisfy **Strict Preference Stability (4)**, **Full Corrigibility (14)**, and **Pareto Efficiency**.
      *   *Reasoning:* If the AI is fully corrigible, it must allow humans to change its goals. If humans change the goals to allow preference manipulation, the AI must comply (Corrigibility) or resist (Preference Stability). If it resists, it violates Pareto (some humans want the change).
      *   *Resolution:* Corrigibility must be *asymmetric*. The system is corrigible on instrumental goals and factual errors, but incorrigible on the core Non-Aggregative Thresholds.

  **The Single Most Exclusionary Requirement:**
  **Preference Stability (4).**
  This requirement excludes the vast majority of standard social choice and economic welfare theories. Classical Utilitarianism, Kaldor-Hicks efficiency, and standard Preference Satisfaction views all treat preferences as exogenous inputs. They are indifferent to *how* preferences are formed. In an alignment context, where the optimizer has direct access to the human reward circuit (via media, persuasion, neurotech), a theory that does not distinguish between *formed* and *shaped* preferences is catastrophic. It forces the theory to include a model of "authenticity" or "autonomy" that standard economics explicitly rejects as unscientific.

  ***

  ### Evaluation of Familiar Contenders

  1.  **Straightforward Preference Aggregation (e.g., Utilitarianism/Borda):**
      *   *Fails:* Non-Aggregative Thresholds (willing to sacrifice minority); Preference Stability (indifferent to wireheading); Distinction #5 (collapses revealed/idealized).
      *   *Verdict:* Unsafe for global scale.

  2.  **Contractualist / Bargaining View (e.g., Scanlonian):**
      *   *Passes:* Non-Aggregative Thresholds (vetoes on reasonable rejection); Distinction #8 (Bounded Neutrality).
      *   *Fails:* Voiceless Patients (animals cannot bargain); Computability (ideal bargaining is intractable); Corrigibility (if the contract is "ideal," who corrects it?).
      *   *Verdict:* Ethically robust, operationally brittle.

  3.  **Idealized Extrapolation (e.g., Coherent Extrapolated Volition):**
      *   *Passes:* Preference Stability (filters out manipulation); Distinction #5 (focuses on endorsement).
      *   *Fails:* Distinction #6 (risks ignoring actual agency for idealized ends); Corrigibility (if the extrapolation says "no," you cannot correct it); Voiceless Patients (depends entirely on human extrapolation about them).
      *   *Verdict:* High risk of paternalistic drift; fails the "hand to a designer" test on verification.

  ***

  ### Epistemic Humility: Where This Reasoning May Fail

  **1. The Metaphysics of Preferences:**
  My insistence on **Preference Stability** assumes there is a fact of the matter about "authentic" vs. "shaped" preferences. If preference formation is *always* causal and social, and the AI is just another cause, the distinction collapses.
  *   *What would change my mind:* A demonstration that "autonomy" is merely a heuristic with no underlying normative reality, and that we should instead optimize for *stable* states regardless of origin (e.g., Homeostatic Utilitarianism).

  **2. The Corrigibility Paradox:**
  I treat Corrigibility as a requirement of the value theory. It might instead be an architectural constraint unrelated to values. If the value theory is "Maximize the Good," and the architecture allows a "stop button," we don't need to bake fallibilism into the ethics.
  *   *What would change my mind:* A proof that a system maximizing a fixed objective function cannot safely allow itself to be modified (Instrumental Convergence), implying the value theory *must* intrinsically value its own modification.

  **3. The Scope of Voiceless Patients:**
  I require Proxy-Representability. It is possible that assigning moral weight to beings who cannot participate in the social contract is a category error that leads to unresolvable conflict (e.g., animal rights vs. human survival).
  *   *What would change my mind:* A convincing argument that moral status is strictly reciprocal (only those who can harm/benefit us count), which would allow dropping Req 3 and simplifying the aggregation problem significantly.

  **4. The Impossibility Relaxation:**
  I flag the Arrow/Gibbard conflict but do not specify the relaxation. I assume we relax Strategy-Proofness. It is possible we must relax Universal Domain (restricting the input preferences allowed).
  *   *What would change my mind:* If restricting the domain of admissible preferences (e.g., banning "evil" preferences) proves more computationally tractable and stable than trying to aggregate all preferences robustly. This would shift the burden from *aggregation* to *filtering*.
