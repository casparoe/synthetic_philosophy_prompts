      *   *Key Tension:* Idealization vs. Actual Consent.
      *   *Impossibility:* Arrow's Theorem, Gibbard-Satterthwaite. Must address these.
      *   *Non-negotiable:* Must not wipe out minorities for aggregate gain (Anti-Totalitarianism). Must handle preference manipulation. Must be computable/approximable.
      *   *Conflict:* You can't have full strategy-proofness, non-dictatorship, and Pareto efficiency simultaneously (Gibbard-Satterthwaite/Arrow). So something gives. Probably strategy-proofness in the strict sense, but need robustness.
      *   *Exclusionary:* The requirement to handle *non-human* moral patients while remaining *human-aligned* creates a tension. But the prompt asks about "serving humanity's values" regarding these beings. The real exclusionary constraint is likely *Corrigibility + Determinacy*. If it's fully determined, it can't be corrigible. If it's corrigible, it's not fully determined.
