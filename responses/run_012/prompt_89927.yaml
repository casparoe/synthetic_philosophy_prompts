  6.  **Evaluating Contenders:**
      *   *Preference Aggregation (Borda/Util):* Fails Anti-Sacrifice. Fails Endogenous Preference (easy to game).
      *   *Contractualist (Scanlon-esque):* Good on Anti-Sacrifice. Struggles with Voiceless Patients (who can reject?). Struggles with Computability (ideal bargaining is hard).
