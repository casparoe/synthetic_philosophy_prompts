  *(Self-Correction during drafting)*: I initially thought about making "Interpersonal Comparability" a non-negotiable. But hard comparability is metaphysically dubious. Better to frame it as "Must operate *as if* partial comparability holds without claiming metaphysical truth."
  Also, need to be careful with "Corrigibility." Is it a requirement of the *value theory* or the *architecture*? The prompt asks for a theory to govern the system. If the theory says "Maximize X," and X is fixed, it's not corrigible. So the theory must include a meta-preference for correction. I will frame this as "Meta-Ethical Openness."

