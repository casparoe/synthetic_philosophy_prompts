  2.  **Brainstorming Candidate Requirements (Mental Draft):**
      *   *Problem:* "Human values" is vague. Need to make it precise.
      *   *Input:* Preferences? Welfare? Endorsements?
      *   *Scope:* Who counts? Future gens? Animals? AI?
      *   *Aggregation:* How to combine conflicting interests? Majority rule fails (tyranny). Utilitarianism fails (sacrifice minorities).
