answer: |-
  "Right but early" is a valid scientific category only if you can specify the causal mechanism independently of the timing, otherwise it is an unfalsifiable excuse that protects the theory from reality.

  ### Design Logic & Arc
  Here is the reasoning behind the session structure. You cannot resolve the "astrology vs. genius" fight without first agreeing on what counts as "right." Most forecasting teams conflate *directional accuracy* (things went up) with *mechanistic accuracy* (things went up because of X) and *temporal accuracy* (things went up when I said). Your team's split exists because half are judging the mechanism and half are judging the date.

  The arc must move from **definitions** to **distinctions** to **application**.
  1.  **Diagnose the Conflict (0–15 min):** Force them to admit they are using different scorecards. If you don't do this first, the example will just reinforce their existing biases.
  2.  **The Theoretical Hinge (15–45 min):** Introduce the distinction between *theory* (the engine) and *boundary conditions* (the road). This is where you validate their hunch. A prediction is a conditional claim: "If C holds, then T happens at time t." If C changes, T can be "right" mechanistically but "wrong" temporally.
  3.  **The Stress Test (45–75 min):** Apply this to a single case. Malthus is the best choice because everyone knows the headline ("he was wrong") but few analyze the structure ("why was he wrong?"). It allows you to separate the geometric growth mechanism (valid) from the technological boundary condition (violated).
  4.  **The Philosophical Stakes (75–90 min):** Reveal where the experts disagree. There is no algorithm for how many "early" calls a theory gets before it is dead. This prevents them from leaving with a false sense of security.

  **The Example:** Use Malthus, but strip the politics.
  *   **What it needs:** A clear causal claim (population grows geometrically, food arithmetically) and a clear historical falsification (the Green Revolution/industrial agriculture).
  *   **What it lacks:** Do not let the discussion drift into modern climate change or specific population policies; keep it on the *structure* of the 1798 prediction versus the 1960s reality.
  *   **Why:** It perfectly illustrates a correct mechanism overwhelmed by a shifted boundary condition. It forces the team to decide: was Malthus "right but early" or "wrong about the constraints"?

  **Misconceptions to Head Off:**
  *   *"The mechanism doesn't matter if the date is wrong."* (Head this off in Phase 2: In 20-year forecasting, mechanism is the only thing that survives contact with reality.)
  *   *"Boundary conditions are external shocks."* (Head this off in Phase 3: Often, the 'shock' is endogenous to the system you're modeling.)
  *   *"Philosophers agree on when to kill a theory."* (Head this off in Phase 4: This is the live disagreement.)

  **What to Leave Out (and say so):**
  *   **Bayesian Updating:** Do not try to formalize how much confidence they should lose after a miss. It turns a conceptual problem into a math problem they will argue about. Tell them: "We are not doing the math of belief revision today; we are doing the logic of justification."
  *   **Specific Forecasting Methodologies:** Ignore Monte Carlo vs. Delphi. This is about epistemology, not methodology.
  *   **The Demarcation Problem Deep Dive:** Don't name-drop Popper, Kuhn, or Lakatos unless asked. Use their ideas, not their names.

  ---

  ### 90-Minute Session Plan: "The Logic of Latency"

  #### Phase 1: The Three "Rights" (15 Minutes)
  **Goal:** Expose the definitional conflict driving the team's disagreement.

  1.  **The Prompt (5 min):** Write on the whiteboard: *"A team predicts a resource shortage by 2030. It arrives in 2050. Were they right?"*
  2.  **Silent Vote (2 min):** Have team members write "Yes," "No," or "It depends" on a card. Collect them.
  3.  **The Triad (8 min):** Draw three concentric circles on the board.
      *   **Inner Circle:** Mechanism (Did the causal forces operate as described?)
      *   **Middle Ring:** Direction/Trend (Did the variable move the way you said?)
      *   **Outer Ring:** Timing (Did it happen within the confidence interval?)
      *   **Action:** Ask a "Yes" voter what they meant. Usually, they mean Direction. Ask a "No" voter. They usually mean Timing.
      *   **Takeaway:** "Right but early" is usually shorthand for "Right Mechanism, Right Direction, Wrong Timing." The fight isn't about the future; it's about which circle counts for success.

  #### Phase 2: Theory vs. Boundary Conditions (30 Minutes)
  **Goal:** Establish the philosophical hinge for validating "right but early."

  1.  **The Conditional Claim (10 min):** Explain that every long-run forecast is a conditional statement: *"If boundary conditions C remain stable, mechanism M will produce outcome O at time T."*
      *   **Key Distinction:** If O happens but T is late, you must prove M is still operating and C is what changed.
      *   **The Trap:** If you adjust C *after* the miss to explain why T slipped, you are engaging in an "immunizing stratagem" (making the theory unfalsifiable).
  2.  **The Pre-Registration Test (10 min):** Ask: "Could you have written down the condition that would delay this prediction *before* the deadline passed?"
      *   If yes: It's valid science (Right but Early).
      *   If no: It's an excuse (Astrology).
  3.  **Group Drill (10 min):** Give them a generic forecast from your work (e.g., "AI displaces labor"). Ask them to identify the *Mechanism* vs. the *Boundary Conditions* (e.g., regulation, energy costs). Have them identify which conditions were explicitly stated in the original model.

  #### Phase 3: The Malthus Case Study (30 Minutes)
  **Goal:** Apply the framework to a high-stakes historical example.

  1.  **The Setup (5 min):** Briefly state Malthus's 1798 claim: Population grows geometrically; food production grows arithmetically. Crisis is inevitable.
  2.  **The Miss (5 min):** By 1900, and certainly by 1960, food production outpaced population in the West. Crisis did not happen on schedule.
  3.  **The Breakout (15 min):** Split the room into two groups.
      *   **Group A (The Prosecution):** Argue Malthus was wrong. The mechanism was flawed.
      *   **Group B (The Defense):** Argue Malthus was "right but early." The mechanism holds; boundary conditions (technology) intervened temporarily.
      *   **Constraint:** They must use the "Pre-Registration Test" from Phase 2. Could Malthus have specified "unless technology increases yield per acre" as a boundary condition in 1798?
  4.  **Debrief (5 min):** Reveal the consensus view in philosophy of science. Malthus identified a real pressure (mechanism), but treated a variable (technology) as a constant (boundary condition).
      *   **Lesson:** "Right but early" is valid only if the mechanism persists *despite* the delay. If the mechanism itself is disproven by the delay (e.g., food grew geometrically too), the theory is dead.

  #### Phase 4: The Live Disagreement & Closing (15 Minutes)
  **Goal:** Prevent false consensus and test understanding.

  1.  **The Contested Zone (10 min):** Be explicit: "Philosophers do not agree on how many misses a theory gets."
      *   **View 1 (Popperian):** One clear miss falsifies the theory. "Right but early" is often a shield against falsification.
      *   **View 2 (Lakatosian):** Theories have a "protective belt." You can adjust boundary conditions as long as the core mechanism predicts *novel* facts later.
      *   **Application:** Ask your team: "Are we running a Popperian shop or a Lakatosian shop?" If you claim "right but early" repeatedly without new mechanistic insights, you are degenerating.
  2.  **The Closing Question (5 min):** Do not ask "Did you understand?" Ask this:
      *   *"Look at our current 2040 projection. What is the one boundary condition that, if it changes, makes us 'right but early' rather than 'wrong'? Did we write that down before today?"*
      *   **Success Metric:** If they can name a specific, pre-existing condition rather than a vague "something changes," they got it.

  ---

  ### Contested Ground & Exclusions

  **Where Experts Disagree:**
  Be careful not to present the "Pre-Registration Test" as a magic bullet. In the philosophy of science, there is active debate over **ad hoc hypotheses**.
  *   **The Conflict:** Some argue that adjusting boundary conditions is how science progresses (refining the model). Others argue it is how science dies (refusing to let go of a dogma).
  *   **Your Stance:** Tell your team the line is drawn at **novel prediction**. If your "right but early" claim leads to a *new* testable prediction about *how* the delay happens, it's science. If it only explains the past miss, it's an excuse.

  **What to Leave Out (Say This Aloud):**
  *   "I am leaving out Bayesian probability. We are not calculating how much to downgrade our confidence numbers today. We are deciding whether the logic of the forecast holds water."
  *   "I am leaving out the history of Malthus's politics. We are treating his model as a mechanical system, not a political manifesto."
  *   "I am not giving you a formula for when to kill a project. That is a judgment call based on whether the mechanism is still doing work."
