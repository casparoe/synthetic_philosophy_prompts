prompt: |-
  Take the role of a philosopher of science who's taught this material to non-specialists and knows where the live disagreements actually are. I have to run a 90-minute session for my forecasting team next month (we do 20-40 year projections, so this isnt abstract for us): can a long-run prediction be 'right but early,' or is that just an excuse? I want a teaching plan, not the explanation itself, so think it through and brainstorm the arc before you write anything.

  What has to come first? My hunch is that the hinge is separating the theory from its boundry conditions -- if the claim is really conditional (population tends to outrun food whenever nothing else changes), then a failed forecast might only show that the something-else changed -- but I can't tell whether that's a genuine distinction or a dressed-up excuse, and my team is split between 'right but early is astrology with a longer time horizon' and 'that's just how every good theory eventually looks.' I also need them to see that 'right' is doing at least three jobs in that sentence -- right about the mechanism, right about the trend, right about the date -- and that most of our fights are people using different ones.

  So: the order the pieces have to go in and why, the one example that should carry the whole thing (Malthus himself, since everyone half-knows him? or something cleaner -- and why), what that example needs to have and what it needs to lack, the misconceptions to expect and exactly where in the sequence to head each one off, and one closing question that tells me whether they actually got it. Tell me what to leave out at this level and to say so out loud in the room.

  Where the people who study this for a living still disagree, flag it as contested instead of handing me a consensus. Lead with your bottom line in the first sentence, then the reasoning -- no preamble. American English.
