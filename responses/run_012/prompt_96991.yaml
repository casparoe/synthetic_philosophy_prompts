answer: |-
  # The Nyāya Triage Rubric (One-Page Procedure)

  **Purpose:** To grade empirical claims for publication readiness by enforcing epistemic strictness over statistical convention.
  **Time Budget:** 20 Minutes per claim.

  ### STEP 1: IDENTIFY THE MEANS (*PRAMĀṆA*)
  *Ask: "How is this claim known?" Select exactly one primary means.*
  *   **Perception (*Pratyakṣa*):** Direct observation/data measurement (e.g., "Count = 50").
  *   **Inference (*Anumāna*):** Reasoning from a mark to a conclusion (e.g., "Smoke → Fire", "Reform → Drop").
  *   **Testimony (*Śabda*):** Report from a trusted source (e.g., "Census Bureau says...").
  *   **Comparison (*Upamāna*):** Knowledge via similarity (e.g., "Region A behaves like Region B").
  *   **⚠️ MISMATCH CHECK:**
      *   *Negative Existence ("There is no X"):* Requires **Perception of Absence**. If based only on "no records," this is **Not Established** (records ≠ perception).
      *   *Best Explanation ("X explains Y best"):* Treat as **Inference**, but flag that "best" ≠ "certain." Requires proof that no other explanation works.

  ### STEP 2: EVALUATE THE MEANS
  *Apply the relevant checklist. If any box fails, move to STEP 4.*

  **A. If Inference (Causal/Generalization):**
  1.  **Subject Presence:** Is the reason actually present in the case? (e.g., Did the reform actually happen?)
  2.  **Pervasion (*Vyāpti*):** Is the connection universal? (e.g., Does this reform *always* cause this drop, or just sometimes?)
      *   *Fail Condition:* If exceptions exist without explanation, the inference is **Deviant (*Anaikāntika*)**.
  3.  **Defect Check:**
      *   **Counterbalanced (*Satpratipakṣa*):** Is there an equally strong reason for the opposite? (e.g., "Training helps retention" vs. "Training increases burnout"). If yes → **Needs Work**.
      *   **Contradicted (*Viruddha*):** Does the reason prove the opposite? (e.g., "High spending proves efficiency" when data shows waste).
      *   **Unestablished (*Asiddha*):** Is the reason itself unproven? (e.g., Assuming "staff morale" dropped without measuring it).

  **B. If Testimony (Reports/Studies):**
  1.  **Competence:** Does the source have direct access to the data? (Check methodology section).
  2.  **Sincerity:** Is there a conflict of interest? (Check funding source).
  3.  **Consistency:** Does this contradict established testimony? (Check meta-analyses).
      *   *Probe without Interview:* If methodology is vague or funding is partisan, mark **Competence/Sincerity Unverified**.

  **C. If Perception (Direct Data):**
  1.  **Instrument Integrity:** Was the tool calibrated/validated?
  2.  **Observer Error:** Was the sample size large enough to rule out luck? (Small N = High Error Risk).

  ### STEP 3: RECORDED DEFEAT CONDITIONS (*BĀDHA*)
  *Write one sentence: "This claim is overturned if..."*
  *   Examples: "...a larger control group shows no effect," "...new census data reveals unrecorded clinics," "...a competing policy change is identified in the same period."
  *   **Re-open Rule:** If the defeat condition occurs, the claim moves from **Established** to **Needs Work** immediately.

  ### STEP 4: DECISION & HANDOFF
  *Select one bin based on Step 2 failures.*

  *   **🟢 Established:** All checks passed. Pervasion is strong. No counterbalances.
  *   **🟡 Needs Work:** One or more checks failed (e.g., weak pervasion, unverified testimony). Specific fix required (e.g., "Find control group").
  *   **🔴 Rejected:** Epistemic impossibility (e.g., Negative claim based on incomplete records) or Contradicted by stronger evidence.
  *   **🔵 Escalated:** Claim contains value judgments ("should," "unfair") or requires statistical expertise beyond this rubric. **Handoff to Research Director.**

  ---

  ### CASE RUNS

  **(a) Claim:** "This training improves staff retention."
  **Support:** Single well-conducted study (N=40).
  1.  **Means:** Inference (from study sample to general rule) + Testimony (the study).
  2.  **Evaluate:**
      *   *Testimony:* Competence OK (well-conducted), but Sincerity/Scope limited (single site).
      *   *Inference:* **Pervasion Weak.** N=40 is too small to establish universal connection (*vyāpti*). High risk of **Deviation (*Anaikāntika*)**—what works there may not work here.
      *   *Counterbalance:* Plausible (training takes time away from work, potentially lowering retention).
  3.  **Defeat:** A multi-site replication shows no effect.
  4.  **Bin:** **Needs Work.** (Cannot generalize from small N).
  **Justification:** Sample size fails to establish universal pervasion required for causal claim.

  **(b) Claim:** "There is no affordable child care in this region."
  **Support:** Absence of records in government database.
  1.  **Means:** Negative Existence (*Abhāva*).
  2.  **Evaluate:**
      *   **Mismatch:** Nyāya requires perception of absence where presence *would* be perceivable. Government records are incomplete proxies, not direct perception.
      *   **Defect:** **Unestablished (*Asiddha*).** You have not perceived the absence; you have only perceived the absence of *records*.
  3.  **Defeat:** A single unregistered provider is found.
  4.  **Bin:** **Rejected.**
  **Justification:** Absence of records is not evidence of absence of fact; claim exceeds epistemic warrant.

  **(c) Claim:** "The 2019 reform caused the drop in filings."
  **Support:** Plausible mechanism + Before/After comparison (no control group).
  1.  **Means:** Inference (*Anumāna*).
  2.  **Evaluate:**
      *   **Subject Presence:** Reform happened (OK).
      *   **Pervasion:** **Failed.** Before/After correlation does not prove universal connection. Other factors (economic shift, pandemic) could cause the drop.
      *   **Defect:** **Deviant (*Anaikāntika*).** The reason "Reform happened" is present, but the conclusion "Drop caused by Reform" is uncertain because the drop could exist without the reform.
      *   **Counterbalance:** Economic downturn also occurred in 2019 (equally good explanation).
  3.  **Defeat:** A difference-in-differences analysis shows neighboring regions had same drop without reform.
  4.  **Bin:** **Needs Work.**
  **Justification:** Correlation + mechanism ≠ pervasion; confounding variables render the inference inconclusive.

  ---

  ### PROCEDURE CRITIQUE (Candid Assessment)

  **Where Nyāya is Real Work:**
  *   **Pervasion (*Vyāpti*):** This rubric forces you to admit that most policy "causal claims" are actually just correlations. Modern stats hides this behind p-values; Nyāya exposes the lack of universal connection. This will systematically downgrade causal claims that lack control groups.
  *   **Negative Existence:** The distinction between "not seeing X" and "seeing the absence of X" prevents the common error of treating missing data as negative proof.

  **Where Nyāya is Decoration:**
  *   **Comparison (*Upamāna*):** In modern policy, analogy is usually just weak inference. Treating it as a separate category is philosophically honest but practically redundant; I subsumed it under Inference/Testimony for speed.
  *   **Testimony (*Śabda*):** Nyāya assumes trustworthy experts exist. In modern policy, *every* source has bias. The "Sincerity" check is a judgment call dressed as a procedure; you are guessing at conflicts of interest based on public data.

  **Where Ordinary Evidence-Grading is Better:**
  *   **Statistical Power:** Nyāya speaks of "small sample" as weak pervasion. A standard rubric gives you a power calculation. My rubric tells you *why* it fails (epistemically), but not *how much* data you need to fix it.
  *   **Probability:** Nyāya is binary (Valid/Invalid). Modern policy lives in confidence intervals. This rubric forces binary bins on probabilistic realities, which creates friction at the "Established/Needs Work" boundary.

  **Judgment Calls Dressed as Procedure:**
  *   **Counterbalance:** Deciding if an opposing reason is "equally good" is subjective. I rely on your intuition to spot the confounder.
  *   **Handoff:** Deciding if a claim is "Value" vs "Fact" is often political. The rubric says "Escalate," but you must decide when to pull that trigger.

  \answer{needs-work}
