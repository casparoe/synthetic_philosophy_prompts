answer: |-
  The phenomenon you are describing is the central problem in the philosophy of **supertasks**. While "supertask" names the procedure itself (an infinite sequence of operations completed in finite time), there is no single, universally settled noun for the specific logical gap you have identified where the steps are determinate but the final state is not.

  In the literature, this is most commonly referred to as the **logical underdetermination of the limit state**. The definitive analysis comes from the philosopher Paul Benacerraf in his 1962 paper *"Tasks, Super-Tasks, and the Modern Eleatics."* Benacerraf argued against James Thomson (who proposed the Lamp paradox), showing that there is no logical contradiction in the lamp being either on or off; rather, the description of the steps simply **fails to entail** the state at the completion time.

  Since you asked for a specific term if none is settled, I propose calling this phenomenon **Terminal Underdetermination**.

  Here is the breakdown of the phenomenon, what closes the gap, and where the line falls.

  ### 1. The Name: Terminal Underdetermination
  While "supertask paradox" is the common umbrella, **Terminal Underdetermination** precisely captures the structural feature you noticed: the trajectory is fully determined for all $t < t_{final}$, but the value at $t_{final}$ is not fixed by the trajectory.

  Benacerraf's insight was that the state of the system at the completion of the task is a **boundary condition** that is logically independent of the states preceding it. The description of the process defines a function $f(t)$ on the half-open interval $[0, 1)$, but logic alone does not define $f(1)$.

  ### 2. What Must Be Added to Close the Gap?
  To move from an underdetermined outcome to a determined one, you must add a **Continuity Principle** or a **Boundary Stipulation**.

  *   **The Stipulation:** You explicitly define the state at $t=1$ as part of the problem description (e.g., "and at the end, the lamp is off"). This is a logical fiat.
  *   **The Continuity Principle:** You assume that the state variable describing the system is a continuous function of time. If $S(t)$ is continuous, then $S(1) = \lim_{t \to 1} S(t)$.

  ### 3. Physical Assumption or Stipulation?
  This depends on whether you are treating the supertask as a logical abstraction or a physical reality.

  *   **In Logic/Mathematics:** It is a **stipulation**. In set theory or abstract logic, functions do not need to be continuous. Unless you define the function at the limit, it simply does not exist there. The "gap" is a feature of the definition, not the world.
  *   **In Physics:** It is a **physical assumption** (specifically, a law of continuity). In classical mechanics, position and velocity are assumed to be continuous functions of time. However, most physicists argue that **Terminal Underdetermination** in physical systems is moot because **supertasks are physically impossible**.
      *   To flip a switch infinitely often requires infinite acceleration or energy, violating physical laws.
      *   Therefore, in the physical world, the "gap" is never reached because the process cannot be completed. If you assume a "Newtonian Universe" where supertasks *are* possible, you must then stipulate whether physical quantities (like the switch's position) remain continuous. If they do, the lamp cannot exist (as it requires discontinuous jumping). If they don't, you are back to Terminal Underdetermination.

  ### 4. Where the Line Falls: Topological Continuity
  You asked exactly where the line falls between outcomes that are determined and outcomes that are merely chosen. The line falls at **Topological Continuity**.

  The outcome is **Determined** if and only if:
  1.  The state of the system can be mapped to a **topological space** (like the real numbers).
  2.  The evolution of the state is **continuous** with respect to that topology up to the limit.
  3.  The limit exists within the space of possible states.

  **Examples of the Line:**

  *   **Thomson's Lamp (Underdetermined):** The state space is discrete $\{ \text{On}, \text{Off} \}$. In the discrete topology, a sequence that oscillates $0, 1, 0, 1 \dots$ has **no limit**. Therefore, continuity cannot force a value. The final state is chosen/stipulated.
  *   **Zeno's Bouncing Ball (Determined):** The state is position $x(t)$. The height of the bounce decreases geometrically. The limit of the height as $t \to 1$ is $0$. Since position is a continuous variable in physics, the ball *must* be at rest on the ground at $t=1$. The outcome is forced by continuity.
  *   **Ross-Littlewood Paradox (Underdetermined):** The state is the *set* of balls in the vase. The "size" (cardinality) of the set is not continuous with respect to the operation of adding/removing elements in the limit.
      *   If you remove ball $n$ at step $n$, the limit set is empty (cardinality 0).
      *   If you remove balls in a different order, the limit set can be infinite.
      *   Because set membership is not a continuous quantity in this context, the final cardinality is **Terminally Underdetermined** by the mere instruction "add 10, remove 1."

  ### Summary
  *   **Phenomenon:** **Terminal Underdetermination** (or Benacerrafian Underdetermination).
  *   **Cause:** The description defines the process on $[0, 1)$ but leaves $t=1$ undefined, and the state variable lacks the continuity required to infer the limit.
  *   **Resolution:** Requires a **Continuity Postulate** (physical/mathematical) or an explicit **Boundary Condition** (stipulation).
  *   **The Line:** Outcomes are **determined** only when the state variable varies **continuously** up to the limit. They are **chosen** (underdetermined) when the state variable is **discrete** or discontinuous at the limit.
