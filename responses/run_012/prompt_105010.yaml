      *   **Topic:** The Language of Thought (LoT) hypothesis vs. Vector Space Models (VSM)/Connectionism.
      *   **Position A (Fodorian):** Thought has combinatorial syntax and compositional semantics. Systematicity implies a structured medium (LoT).
