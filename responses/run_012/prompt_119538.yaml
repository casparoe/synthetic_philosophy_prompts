  3. The brain delays conscious experience of the first flash until after the second arrives, constructing the unified percept before it ever enters awareness. This is empirically possible and preserves a single timeline, undermining the claim that experience is edited *after* it occurs.

  4. The brain generates an initial experience accurately, then retrospectively alters the memory trace to match the second flash while preserving the feeling of immediacy. This is harder to defend empirically and still implies there *was* an original fact of the matter before the edit.

