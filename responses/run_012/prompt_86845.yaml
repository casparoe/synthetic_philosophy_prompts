      *Content Check:* The core philosophical objection is the *intertheoretic comparison problem*. Consequentialism measures in "goodness." Deontology measures in "permissions." You can't average "maximize goodness" with "respect permission." The bridge analogy assumes both theories measure in "goodness" but disagree on the amount. That begs the question against the Deontologist.

      *Let's write.*

      *(Self-Correction during drafting S3)*: I need to make sure I don't just say "they are different." I need to explain *why* that breaks the EV calculation. The EV calculation requires a common unit of account (utils). Deontology refuses to provide one. The bridge analogy smuggles in a common unit (safety/arrival).

