answer: |-
  1. **Bottom line**
  No, the analogy does not hold well enough to carry her conclusion. It smuggles in the assumption that all moral theories speak a common language of "value" that can be averaged, which is precisely what the deontological view denies. By treating structural constraints as mere costs, the analogy begs the question against the 10% view it claims to weigh.

  2. **The Mapping**

  | Element | Empirical Uncertainty (Bridge) | Moral Uncertainty (Ethics) |
  | :--- | :--- | :--- |
  | **States/Theories** | Bridge is out vs. Bridge is intact | Consequentialism vs. Deontology |
  | **Credences** | Probability based on evidence (e.g., 60%) | Credence in normative truth (e.g., 60%) |
  | **Value Metric** | Common currency (utility/survival) | Disputed currency (goodness vs. permission) |
  | **Outcomes** | Arrive safe vs. Fall/Crash | Help many vs. Violate duty |
  | **Maximization** | Expected Utility Maximization | Expected Moral Value (alleged) |
  | **Info Gathering** | Check bridge status | Reflect on moral arguments |
  | **Missing Element** | None | **Eligibility Constraints** (actions deemed impermissible regardless of outcome) |

  3. **Where it Breaks**
  The primary fracture is the assumption of a common currency. In the bridge case, both states (intact vs. out) output outcomes measured in the same unit: your survival or utility. You can reasonably calculate the expected utility of driving because "death" and "arrival" are commensurable risks within a single framework. In the moral case, Consequentialism and Deontology do not merely disagree on the *amount* of value; they disagree on the *structure* of valuation. Consequentialism outputs a scalar value (more good vs. less good). Deontology outputs a binary status (permissible vs. forbidden). You cannot multiply a credence by a veto. To plug the deontological view into an expected-value equation, she must first translate "forbidden" into "negative utility." This translation is not neutral; it is a substantive consequentialist claim that defeats the deontological view by definition.

  Secondly, the analogy conflates empirical contingency with constitutive rules. The bridge's status is a mind-independent fact about the world. Moral theories are often constitutive of what counts as a rational action. Uncertainty about morality is closer to uncertainty about logic than uncertainty about the weather. If you are 60% sure modus ponens is valid and 40% sure it isn't, you do not apply it with 60% force; you either accept the rule or you don't. Treating moral truths as contingent risks mischaracterizes the domain.

  Thirdly, the risk profile is fundamentally different. Empirical risk is continuous; you can accept a 1% chance of death for a high reward. Deontological constraints are lexical; they are not trade-offs. A side-constraint is not a cost to be outweighed; it is a boundary that makes the calculation ineligible. Her analogy treats the constraint as a steep cost rather than a wall. This turns a qualitative difference (type of reason) into a quantitative difference (weight of reason), which is the exact point of contention in the deadlock.

  Finally, the option of gathering information differs. Checking a bridge is external to the decision. Reflecting on ethics is internal to the agency. Delaying action to resolve moral uncertainty is itself a moral act subject to the theories in question. The bridge analogy assumes a neutral standpoint from which to calculate, but in moral uncertainty, the calculator is part of the system being calculated.

  4. **Which Breaks Matter for What She's Using It For**
  The disanalogy regarding information gathering is harmless. Whether she can research ethics faster doesn't change the structural logic of the decision. However, the common currency and constitutive rule breaks are fatal. Her conclusion relies on the claim that refusing to break the promise is "paralysis." This only holds if the deontological veto is just another input in a maximization function. If the veto is a structural constraint on eligibility, then refusing to break the promise isn't paralysis; it's adhering to the rules of the only game that permits the action.

  The fatal break is the translation of "forbidden" to "negative value." To make the math work, she must assume intertheoretic comparability—that a unit of "duty" equals a unit of "goodness." Since the deontological view explicitly rejects this commodification, using the analogy to override the view is circular. It doesn't weigh the theories; it assumes Consequentialism is the meta-theory governing the uncertainty, thereby assigning the Deontological view a weight of zero in practice. The analogy works only if you already agree with her conclusion.

  5. **Does Her Conclusion Survive**
  Verdict: No. The conclusion collapses because the math requires a premise she hasn't defended. To survive, her argument must explicitly argue for *intertheoretic comparability*—the claim that deontological constraints can be converted into consequentialist costs. An honest version of her argument would admit: "I am treating deontological constraints as illusory costs because I believe all value is commensurable." She cannot hide this substantive moral claim behind a procedural analogy about uncertainty. She isn't solving moral uncertainty; she is resolving it by fiat in favor of consequentialism.

  6. **A Better Analogy, if There Is One**
  Your hunch is correct: the real analogue is not knowing the state of the board, but not knowing the *rules of the game*. Suppose you are 60% sure chess allows castling here, but 10% sure it counts as cheating. You do not calculate the expected value of castling versus not castling. You check the rules. If one rule set says "illegal," the move is ineligible, regardless of the probability weight of the other rule set.

  This is better because it captures the *constitutive* nature of moral theories. Rules define validity, not just payoff. However, even this isn't perfect, as moral theories also care about outcomes. A hybrid analogy is legal liability: if you are 60% sure an action is legal but 10% sure it's a felony, you don't average the jail time against the profit. The felony branch acts as a veto because the cost (criminality) is categorically different from the benefit (profit). This preserves the structural constraint her analogy erases.
