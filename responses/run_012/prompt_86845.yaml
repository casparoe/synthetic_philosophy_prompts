      *   **The User's Position:** Suspects the analogy carries weight it hasn't earned but can't pinpoint where.
      *   **Constraints:**
          *   No reading list.
          *   No "analogies are imperfect but useful" cop-out.
          *   Specific format (6 sections).
          *   Specific word counts/lengths for sections 3, 4, 5, 6.
          *   Tone: Tight, no need to be polite.
          *   Content: Identify load-bearing imperfections vs. trivia.

  2.  **Deconstruct the Analogy:**
      *   **Source Domain:** Empirical Uncertainty (Bridge is out vs. Bridge is intact).
      *   **Target Domain:** Moral Uncertainty (Consequentialism vs. Contractualism vs. Deontology).
      *   **Argument:** Since we maximize expected value (EV) in empirical uncertainty, we should maximize expected moral value (EMV) in moral uncertainty. Therefore, if Consequentialism (60%) says "break promise" and Deontology (10%) says "forbidden," the EV calculation overrides the Deontological veto.
      *   **Core Issue:** This is the debate between *intertheoretic comparability* and *structural constraints* in moral uncertainty. The bridge analogy assumes moral theories are just different probability distributions over the *same* value space. Deontology often claims structural constraints (side constraints) that aren't just "negative value" but "ineligible actions."

  3.  **Drafting Section 1: Bottom Line**
      *   Needs to be 2-3 sentences.
      *   Verdict: No, it doesn't hold.
      *   Reason: It assumes moral theories differ only in outcome valuation, ignoring structural constraints that define eligibility rather than value.

  4.  **Drafting Section 2: The Mapping**
      *   Table format.
      *   Rows: Moral theories, Credences, Value of outcome, Outcomes, Maximization rule, Info gathering, Missing element.
      *   Keep it compact.

  5.  **Drafting Section 3: Where it Breaks (400 words)**
      *   Need ~400 words.
      *   Focus on load-bearing disanalogies.
      *   *Point 1: Cardinality/Comparability.* Empirical outcomes (arrive safe vs. die) share a common metric (utility/survival). Moral theories (Consequentialism vs. Deontology) often deny a common metric. Deontology doesn't say "breaking promise = -100 utils," it says "breaking promise = not an option."
      *   *Point 2: Objectivity vs. Subjectivity.* The bridge state is mind-independent. Moral truths (if they exist) might be conceptual. Uncertainty about logic isn't handled by EV maximization (you don't say "60% sure 2+2=4, 40% sure 2+2=5, so expected value is 4.4").
      *   *Point 3: The "Veto" Structure.* In the bridge case, risk is continuous. In the Deontological case, the constraint is lexical/absolute. Treating it as a cost commodifies the constraint, which contradicts the theory itself.
      *   *Point 4: Action-Guidance.* Empirical uncertainty guides *how* to achieve a goal. Moral uncertainty is uncertainty about *what the goal is*. Maximizing across goals is category error.

      *Refining for word count:* I need to expand on these points to hit ~400 words. I should focus heavily on the "common currency" problem and the "structural constraint" problem.

  6.  **Drafting Section 4: Which Breaks Matter (200 words)**
      *   Sort into harmless vs. fatal.
      *   Harmless: Info gathering (sometimes you can't research ethics faster).
      *   Fatal: The common currency assumption. If Deontology says "X is forbidden" not "X is bad," you can't plug it into an EV equation. The analogy assumes all theories are consequentialist structures with different parameters. They aren't.
      *   Fatal: The logic uncertainty point. If morality is akin to logic/math, probabilistic weighting is incoherent.

  7.  **Drafting Section 5: Does Her Conclusion Survive (150 words)**
      *   Verdict: No.
      *   Why: To survive, she needs to argue for *moral hedonism* or *intertheoretic comparability* explicitly, not hide it behind an empirical analogy. She needs to prove Deontology is wrong about its own structure (i.e., that constraints are just weights), not just outvote it.
      *   Honest argument: "Deontological constraints are illusory; all values are commensurable."

  8.  **Drafting Section 6: A Better Analogy (150 words)**
      *   User suggests: Not knowing the state of the board vs. not knowing the rules.
      *   My take: User is right. "Not knowing the rules" is better.
      *   Alternative: Legal uncertainty. If you are 60% sure an action is legal and 10% sure it's a felony, you don't calculate EV of jail time vs. profit. You follow the precautionary principle or the strictest interpretation because the "felony" branch invalidates the action's permissibility, not just its cost.
      *   Or: Cooking. 60% sure recipe needs salt, 10% sure it needs poison. You don't average them.
      *   Let's go with the "Rules of the Game" analogy as it aligns with the user's hunch and highlights the constitutive nature of moral theories.

  9.  **Review and Refine (Self-Correction/Word Count Check):**
