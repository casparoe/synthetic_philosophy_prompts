                                      *   (Defect, Defect): 2 (Default)
                                      *   Mismatch: 0.
                                  *   **Proposal:** "If you Defect, you get taxed 5."
                                  *   **New Payoffs:**
                                      *   (C,C): 10
                                      *   (D,D): 2 - 5 = -3.
                                      *   (C,D): 0, 0 - 5 = -5.
                                      *   (D,C): -5, 0.
                                  *   **NE:** (C,C) is NE. (D,D) is no longer NE (-3 < 0? No, if other plays D, I play D to get -3 vs -5). So (D,D) is still NE.
                                  *   So this modification failed to eliminate the bad NE.
                                  *   **Safe Proposal:** "Remove Defect."
                                  *   **New Game:** Only Coop.
                                  *   **NE:** (C,C) = 10.
                                  *   **Cost:** You can't defect even if you wanted to (loss of flexibility).
                                  *   **This works.**
                                  *   **The "Unsafe" Temptation:** "Let's just tax Defect." (Leaves the bad NE).
                                  *   **The "Safe" Reality:** "Burn the bridge." (Remove the strategy).
                                  *   **Why does "Remove Defect" feel sober?** Because you lose the *option* to exploit if the other person makes a mistake? No, in Coop/Coop there is no exploitation.
                                  *   **Let's refine the Payoffs to make "Remove Defect" feel like a sacrifice.**
                                  *   **Base:**
                                      *   (High, High): 10
                                      *   (Low, Low): 4 (Default)
                                      *   Mismatch: 0
                                  *   **Proposal 1 (Unsafe):** "Tax High by 2."
                                      *   (H,H) becomes 8. (L,L) stays 4.
                                      *   NE: (H,H) and (L,L).
                                      *   Both > Default? Yes.
                                      *   This doesn't fail.
                                  *   **Proposal 2 (Unsafe):** "Subsidy Low by 1."
                                      *   (L,L) becomes 5.
                                      *   NE: (H,H)=10, (L,L)=5.
                                      *   Both > Default (4).
                                      *   This is also safe.
                                  *   **I need a modification that *looks* like it eliminates the bad outcome but doesn't.**
                                  *   **Base:**
                                      *   (A,A): 10
                                      *   (B,B): 2 (Default)
                                      *   (C,C): 1 (Disaster)
                                      *   Mismatches: 0.
                                  *   **Goal:** Improve over (B,B)=2.
                                  *   **Proposal:** "Remove C."
                                  *   **New Game:** {A, B}.
                                  *   **NE:** (A,A)=10, (B,B)=2.
                                  *   **Is this an improvement?** No. (B,B) is still an equilibrium. You are not *better off with certainty*. You might still end up at 2.
                                  *   **Safe Proposal:** "Remove B and C."
                                  *   **New Game:** {A}.
                                  *   **NE:** (A,A)=10.
                                  *   **Certainty:** Yes.
                                  *   **Cost:** You lose the safety net of B (2) if A fails? But A doesn't fail if it's the only option.
                                  *   **The Cost:** The "Sober" feeling comes from the fact that you had to eliminate the *middle* option to guarantee the top option. You can't just eliminate the bottom.
                                  *   **Wait, if I remove B, I force A.**
                                  *   **Why would students want to keep B?** Because B is "Safe."
                                  *   **The Lesson:** To guarantee an improvement over the Default (B), you must make B impossible. You must burn the safe bridge to force the good bridge.
                                  *   **This is counter-intuitive and perfect.**
                                  *   **Students' Intuition:** "Let's get rid of the Disaster (C)."
                                  *   **Reality:** That leaves the Default (B) as a possibility. Not an improvement.
                                  *   **SPI:** "Get rid of the Default (B) and Disaster (C)."
                                  *   **Result:** Forced to A (10).
                                  *   **Feeling:** "Wait, I gave up my safety net (B) to get the reward? What if A doesn't work?" (But in the game, if it's the only strategy, it works).
                                  *   **This captures the "Sober" nature.** It feels risky to remove the safety net, but it's the only way to be *certain* of improvement.

  6.  **Developing the Session Plan:**
      *   **Time:** 90 Mins.
      *   **0-10:** Setup & Base Game.
      *   **10-30:** Round 1 Play (Experience the Default).
      *   **30-60:** Constitutional Phase (Propose Modifications).
      *   **60-80:** Round 2 Play (Test Modifications).
      *   **80-90:** Debrief (Map to SPI).
      *   **Materials:** Payoff matrices, Proposal Forms, Play Money/Points.
      *   **Roles:** Pairs. Instructor as "Equilibrium Selector" (The Adversary of Certainty).

  7.  **Predicting Failure Modes:**
      *   *Failure 1:* Students collude to play (A,A) without rule changes.
          *   *Fix:* Instructor insists on written rules only. No talk during play.
      *   *Failure 2:* Students don't understand "Equilibrium."
          *   *Fix:* Brief reminder in setup (they are fluent, just a nudge).
      *   *Failure 3:* The "Safe" modification (Remove B & C) feels like cheating.
          *   *Fix:* Frame it as "Commitment Device."
      *   *Failure 4:* Students propose "Randomize."
          *   *Fix:* Instructor treats mixed strategies as valid equilibria. If Mixed NE yields < 2, it's not safe.

  8.  **The "Lie" / Limitation:**
      *   The game assumes the Instructor can *enforce* the rule change perfectly. In reality, enforcing the removal of a strategy (burning the bridge) has costs/risks not captured in the points.
      *   Also, the game assumes the "Default" is a specific NE. In reality, the default might be a mix.
      *   **The Big Lie:** The activity simulates *selecting* a modification, but SPI is often about *delegates* selecting strategies within a modified game without further communication. The activity collapses the "delegation" step into the "rule-making" step for simplicity. I must admit this in the debrief.

  9.  **Refining the Payoff Matrix for Maximum Clarity:**
      *   **Strategies:** **X** (Bold), **Y** (Cautious), **Z** (Retreat).
      *   **Payoffs:**
          *   (X,X): 10
          *   (Y,Y): 4  <-- **Default Equilibrium** (Risk Dominant)
          *   (Z,Z): 0  <-- **Disaster**
          *   Mismatches: 0 (Simplification).
      *   **NE:** (X,X), (Y,Y), (Z,Z).
      *   **Task:** Modify the game to guarantee > 4.
      *   **Common Proposal:** "Remove Z."
          *   New NE: (X,X)=10, (Y,Y)=4.
          *   **Verdict:** Not Safe. You might still get 4.
      *   **Safe Proposal:** "Remove Y and Z."
          *   New NE: (X,X)=10.
          *   **Verdict:** Safe. Guaranteed 10.
          *   **Cost:** You lose the option to settle for 4 if X becomes risky (but in this game, X isn't risky if it's the only option).
          *   **Wait, to make it feel "sober":**
          *   Add a cost to the modification. "Removing a strategy costs 1 point."
          *   "Remove Z": Cost 1. Payoffs: X=10, Y=3. NE: 10, 3. Not safe (3 < 4).
          *   "Remove Y & Z": Cost 2. Payoff: X=8. NE: 8. Safe (8 > 4).
          *   **This is it.** The Safe improvement yields 8. The *hope* was 10. The Default was 4.
          *   The "Unsafe" proposal (Remove Z) *looks* like it gets 10, but leaves open the risk of 3 (which is worse than default 4!).
          *   **Wait, if I remove Z, Y is still 4.**
          *   Okay, let's keep it simple. No modification costs.
          *   **The "Sober" feeling:** You have to eliminate the "Safe" option (Y) to guarantee the "Good" option (X). You have to make yourself vulnerable to force the good outcome. That feels dangerous/sober.

  10. **Final Polish:** Check constraints. 16 students. 90 mins. No jargon upfront.
      *   Make sure the "Equilibrium Selector" role is clear. The Instructor is the "Ghost in the Machine" who picks the worst valid outcome if the rules allow it.

  11. **Drafting the Response:** Structure as requested: Rules, Materials, Payoff, Timeline, Roles, Failure Modes, Limitations.

      *   *Self-Correction on "Safe":* The prompt says "Safe... should feel like a smaller and more sober thing than the one they wanted."
      *   If the Safe option yields 10 (by forcing X), that feels *better* than the Default (4).
      *   How to make it feel "smaller"?
      *   Maybe the Base Game has a *very* high potential (20) but risky.
      *   Base: (X,X)=20, (Y,Y)=10 (Default), (Z,Z)=0.
      *   Safe Mod: Remove Y & Z. Force X. Payoff 20.
      *   This feels *big*.
      *   **Alternative:** The Safe Mod restricts *payoffs* to ensure safety.
      *   **Let's go with the "Tax" idea.**
      *   Base: (Coop, Coop) = 10. (Defect, Defect) = 2.
      *   Unsafe Mod: "Tax Defect." (Defect, Defect) becomes 1.
          *   NE: (C,C)=10, (D,D)=1.
          *   Is 1 > 2? No. So this isn't an improvement.
      *   **Okay, stick to the "Eliminate the Default" strategy.**
      *   Why is it sober? Because you are removing your safety net.
      *   "You wanted to just ban the Disaster. But to guarantee you beat the Default, you have to ban the Default too. You have to force your hand."
      *   That is the sober realization. Freedom of choice (keeping Y) allows the possibility of settling for less. Safety requires constraint.

      *   *Wait, one more check:* "Whichever of its equilibria ends up being played."
      *   If I remove Y and Z, there is only *one* equilibrium. So the quantifier is trivially satisfied.
      *   If I remove only Z, there are *two* equilibria (X and Y). One is better than default, one is equal.
      *   Definition: "Everyone is better off... whichever... is played."
      *   If Y yields 4 and Default is 4, you are not *better* off. You are equal.
      *   So "Remove Z" fails because Y is still possible.
      *   "Remove Y and Z" succeeds because only X remains.
      *   **The Sober Cost:** You lose the *option* to play Y. In a real-world context, losing flexibility is a cost. I will emphasize this in the debrief.

      *   *Final check on "Lie":* The activity assumes the modification is costless and perfectly binding. In reality, "burning bridges" has transaction costs and might signal aggression. I will note this.

      *   *Timeline:*
          *   0-15: Setup & Base Game (Round 1).
          *   15-45: Proposal Phase (Groups draft mods).
          *   45-75: Round 2 (Test Mods).
          *   75-90: Debrief.

      *   *Materials:* Printed matrices, Proposal Sheets, Tokens.

      *   *Roles:* Pairs. Instructor as "Nature/Adversary."

      *   *Failure:* Students talk during play. *Fix:* Strict silence.
      *   *Failure:* Students don't grasp NE. *Fix:* Provide a "Stability Check" worksheet.

      *   *Ready to write.*
answer: |-
  # Activity Design: The Constitutional Bridge

  ## 1. Overview
  **Title:** The Constitutional Bridge
  **Time:** 90 Minutes
  **Participants:** 16 Students (8 Pairs)
  **Core Concept:** Safe Pareto Improvement (SPI)
  **Goal:** Students experience the difference between a modification that *hopes* for a good equilibrium and one that *guarantees* it by eliminating the possibility of settling for less.

  ## 2. Materials
  *   **Payoff Cards:** 8 sets of laminated matrices (one per pair).
  *   **Proposal Sheets:** 16 sheets (one per student) for drafting rule modifications.
  *   **Currency:** "Utility Tokens" (poker chips or printed slips). 20 per student to start.
  *   **Status Board:** Whiteboard to track pair scores.
  *   **The "Black Box" Envelope:** One envelope per pair, sealed by you, containing the "Equilibrium Selection" rule for Round 2.

  ## 3. The Base Game: "Crossing the Bridge"
  **Structure:** 8 Pairs (Row Player / Column Player).
  **Strategies:** Three options: **Bold**, **Cautious**, **Retreat**.
  **Payoff Matrix (Symmetric):**

  | | **Bold** | **Cautious** | **Retreat** |
  | :--- | :---: | :---: | :---: |
  | **Bold** | 10, 10 | 0, 0 | 0, 0 |
  | **Cautious** | 0, 0 | 4, 4 | 0, 0 |
  | **Retreat** | 0, 0 | 0, 0 | 2, 2 |

  **Equilibria Analysis (For Instructor Eyes Only):**
  *   **Pure Nash Equilibria:** (Bold, Bold), (Cautious, Cautious), (Retreat, Retreat).
  *   **The Default:** (Retreat, Retreat) is risk-dominant. (Cautious, Cautious) is payoff-dominant over Retreat but riskier than Retreat. (Bold, Bold) is optimal but riskiest.
  *   **Expected Outcome:** Without communication, pairs often settle on **Retreat (2, 2)** or **Cautious (4, 4)** due to fear of mismatch (0, 0).
  *   **The Reference Point:** For the purpose of the activity, define the "Status Quo" as the **Retreat (2, 2)** outcome. This is the baseline they must *certainly* beat.

  ## 4. Timeline & Procedure

  ### Phase 1: The Trap (0:00 – 0:20)
  1.  **Setup (5 mins):** Seat students in 8 pairs. Hand out Payoff Cards and Tokens. Explain that they will play 3 rounds of the Base Game. No talking allowed during play. They write their move on a slip of paper.
  2.  **Round 1 (5 mins):** Pairs play once. Collect moves. Reveal outcomes. Most will likely play *Retreat* or *Cautious*. Calculate scores.
  3.  **Round 2 & 3 (10 mins):** Play two more times. Allow them to see the pattern.
  4.  **The Hook:** Announce the "Session Score" for each pair is the *lowest* score they achieved in these three rounds. (This simulates the "whichever equilibrium is played" uncertainty—they are judged by their worst-case stability).
      *   *Result:* Most pairs will have a Session Score of 2 or 4.
      *   *Instructor Note:* "Your goal for the next phase is to guarantee a Session Score strictly higher than 2, no matter how the game settles."

  ### Phase 2: The Constitutional Convention (0:20 – 0:50)
  1.  **The Task (5 mins):** Tell pairs they are now "Principals." They can submit a **Rule Modification** to the game for the final round.
  2.  **Constraints (5 mins):**
      *   Modifications must be written on the Proposal Sheet.
      *   They must be **structural**: You can remove strategies, add taxes/subsidies to specific cells, or cap payoffs.
      *   You cannot write "We promise to play Bold." (Cheap talk is invalid).
      *   **Crucial Rule:** "The Instructor (Nature) will enforce your rules perfectly. However, if your modified game has more than one equilibrium, Nature will select the one that yields the *lowest* payoff for you." (This operationalizes the "whichever equilibrium" quantifier).
  3.  **Drafting (20 mins):** Pairs debate and write their proposal.
      *   *Monitor:* Walk around. Listen for "Let's just ban Retreat." (Unsafe). Listen for "Let's ban Retreat and Cautious." (Safe).
      *   *Intervention:* If a pair asks "Is this allowed?", answer only: "Does it change the payoff matrix or strategy set? Yes? Then it's allowed."
  4.  **Submission (5 mins):** Collect proposals. Do not reveal them to the class.

  ### Phase 3: The Stress Test (0:50 – 1:10)
  1.  **Evaluation (10 mins):** You take 5 minutes to "process" the proposals. (In reality, you are checking the equilibria).
      *   **Scenario A (The Trap):** Pair proposes "Remove Retreat."
          *   *New Game:* {Bold, Cautious}.
          *   *NE:* (Bold, Bold)=10, (Cautious, Cautious)=4.
          *   *Instructor Action:* Since there are two NE, you select the worst one: **4**.
          *   *Verdict:* Better than 2, but not *guaranteed* optimal. Wait—if the reference is 2, 4 is an improvement.
          *   *Correction for Activity:* To make the lesson sting, you must define the "Reference Outcome" as the **Cautious (4, 4)** equilibrium.
          *   *Revised Goal:* "You must guarantee a score strictly higher than 4."
          *   *Revised Instructor Action for Scenario A:* If they remove Retreat, the NE are 10 and 4. The worst is 4. **This is NOT an improvement over 4.** They fail.
      *   **Scenario B (The Safe Path):** Pair proposes "Remove Retreat and Cautious."
          *   *New Game:* {Bold}.
          *   *NE:* (Bold, Bold)=10.
          *   *Instructor Action:* Only one NE. Payoff **10**.
          *   *Verdict:* Success.
      *   **Scenario C (The Disaster):** Pair proposes "Tax Bold by 5."
          *   *New Payoffs:* (Bold, Bold) = 5. (Cautious, Cautious) = 4. (Retreat, Retreat) = 2.
          *   *NE:* All three remain.
          *   *Instructor Action:* Select worst NE: **2**.
          *   *Verdict:* Failure.
  2.  **Play Out (10 mins):** Hand back the matrices with the approved modifications stamped on them. Pairs play one final round.
      *   *Twist:* For pairs who submitted "Unsafe" mods (like removing only Retreat), you (the Instructor) act as their opponent's delegate and play **Cautious**. They play **Bold** (expecting 10), but since you play Cautious, they get 0?
      *   *No, stick to the Equilibrium Rule:* Tell them: "Because your modification left multiple equilibria, the system settled on the risk-dominant one: Cautious." Award them 4 points.
      *   For pairs who submitted "Safe" mods (Removing R & C), award them 10 points.

  ### Phase 4: The Debrief (1:10 – 1:30)
  1.  **Reveal the Scores:** Compare the "Safe" pairs (10 pts) vs. "Unsafe" pairs (4 pts).
  2.  **Introduce the Term:** Write **Safe Pareto Improvement** on the board.
  3.  **Map the Definition:**
      *   *Modification:* The rule change (removing strategies).
      *   *Reference Outcome:* The Cautious (4, 4) equilibrium of the base game.
      *   *The Quantifier:* "Whichever equilibrium ends up being played."
      *   *The Lesson:* The "Unsafe" groups removed the *bottom* (Retreat), but left the *middle* (Cautious). They improved the *floor*, but not the *guarantee*. The "Safe" groups removed the *middle* too.
  4.  **The Sober Cost:** Ask the Safe groups: "How did it feel to remove Cautious?"
      *   *Expected Answer:* "Risky. We lost our safety net."
      *   *Point:* Safety requires sacrificing flexibility. You cannot keep the option to settle for less if you want to guarantee settling for more.

  ## 5. Predicted Failure Modes & Fixes

  **Failure 1: Collusion during Play.**
  *   *Risk:* Students whisper "Let's both play Bold" during Phase 1 or 3.
  *   *Fix:* Enforce strict silence during play rounds. Emphasize that the activity tests *rules*, not *promises*. If they talk, disqualify the round.

  **Failure 2: Confusion over Equilibrium.**
  *   *Risk:* Students think "If I remove Retreat, we *will* play Bold."
  *   *Fix:* In Phase 2 instructions, explicitly state: "The Instructor acts as an Adversarial Equilibrium Selector. If your rules allow for a mediocre outcome, the Instructor *will* choose it."

  **Failure 3: The "Safe" Option feels like Cheating.**
  *   *Risk:* Students argue that removing 'Cautious' is unrealistic.
  *   *Fix:* Frame it as "Delegation." You are programming a bot. If you don't give the bot the 'Cautious' code, it *cannot* play it. It's a commitment device.

  **Failure 4: No one finds the Safe Option.**
  *   *Risk:* All pairs try to just "Tax Retreat" and fail.
  *   *Fix:* If 0/8 pairs find the Safe Option, reveal *one* Safe Proposal anonymously during the debrief as a "What could have been." This preserves the lesson without ruining the grade.

  ## 6. The "Lie" (Limitations to Disclose)
  In the debrief, you must be candid about what the simulation hides. This is where you supply the missing theoretical nuance in your own voice.

  **The Feature the Activity Cannot Reproduce:**
  *   **The Cost of Commitment:** In the game, removing a strategy is free and perfectly binding. In reality, "burning the bridge" (removing the Cautious option) carries transaction costs, reputational risks, and the danger that the *other* side doesn't trust your commitment.
  *   **The "Delegate" Uncertainty:** The activity simulates the *equilibrium selection* uncertainty, but it collapses the *delegation* step. In the literature, the SPI is often about two *delegates* playing a modified game where the *principals* agreed on the modification but don't control the play. Here, the students are both Principals and (effectively) Delegates.
  *   **Common Knowledge:** The activity assumes everyone knows the modification is binding. In real diplomatic or AI settings, verifying that the other side's "bridge is truly burned" is the hard part.

  **Closing Script for the Lie:**
  > "Today, when you crossed out 'Cautious' on your sheet, I took that paper away and made it impossible for you to play it. In the real world, crossing out the option doesn't remove it; you have to build a machine that physically prevents you from choosing it. That machine costs money, it might break, and the other side might not believe you built it. The literature calls this 'Safe' because it solves the coordination uncertainty. But it does not solve the *trust* uncertainty. That is the cost you pay for safety: you must make your constraint visible, credible, and irreversible."

  ## 7. Payoff Scheme Summary
  *   **Base Game:**
      *   Bold/Bold: 10
      *   Cautious/Cautious: 4 (Reference Point)
      *   Retreat/Retreat: 2
      *   Mismatch: 0
  *   **Round 1-3 Scoring:** Minimum score achieved.
  *   **Round 4 Scoring:** Determined by Modification + Adversarial Selection.
  *   **Winning Condition:** Pairs with > 4 points in Round 4 "Pass" the seminar task. Pairs with ≤ 4 "Fail" the task (symbolically).

  ## 8. Instructor Cheat Sheet (Equilibrium Logic)
  *   **Proposal:** "Remove Retreat."
      *   **Remaining Strategies:** Bold, Cautious.
      *   **Equilibria:** (Bold, Bold) [10], (Cautious, Cautious) [4].
      *   **Selection:** 4.
      *   **Verdict:** **UNSAFE.** (Not strictly better than Reference 4).
  *   **Proposal:** "Remove Retreat and Cautious."
      *   **Remaining Strategies:** Bold.
      *   **Equilibria:** (Bold, Bold) [10].
      *   **Selection:** 10.
      *   **Verdict:** **SAFE.**
  *   **Proposal:** "Add +1 to Bold."
      *   **Equilibria:** Unchanged (11, 5, 2).
      *   **Selection:** 2 (Retreat is still an NE).
      *   **Verdict:** **UNSAFE.**
  *   **Proposal:** "If one plays Retreat, both get 0."
      *   **Equilibria:** Retreat is no longer NE. Bold and Cautious remain.
      *   **Selection:** 4.
      *   **Verdict:** **UNSAFE.**

  This design forces them to realize that eliminating the *disaster* isn't enough; to guarantee improvement, you must eliminate the *status quo* itself. That is the sober heart of Safe Pareto Improvements.
