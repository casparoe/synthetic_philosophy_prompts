answer: |-
  This is a precise request for a formal mapping between two fields that share a semantic core (Kripke structures) but diverge on ontology (truth vs. utility). Below is the systematic translation, the residue analysis, and the verdict on the "unreached node" paradox.

  ### Part 1: Systematic Translation (Game Theory $\to$ Runs-and-Systems)

  We map the Extensive Form Game with Imperfect Information to a Multi-Agent System $\mathcal{R}$ (a set of runs) over a set of processes $\{1, \dots, n\}$.

  | Game Theory Concept | Distributed Computing (FHMV Style) Concept | Notes on Translation |
  | :--- | :--- | :--- |
  | **Game Tree** | **Unfolded System Tree** | The tree of all possible sequences of global states. In DC, we usually prune this to a system $\mathcal{R}$ of valid runs. |
  | **Player $i$** | **Process $p_i$** | Direct mapping. |
  | **Node $h$** | **Point $(r, m)$** | A node in the game tree is a point $(r, m)$ in a run $r$ at time $m$. |
  | **Information Set $I_i$** | **Indistinguishability Class** | The set of points $\{(r', m') \mid r_i(m) = r'_i(m')\}$. Process $p_i$ cannot distinguish points within the same local state. |
  | **Strategy $\sigma_i$** | **Protocol $P_i$** | A function from local states to actions. $\sigma_i(I_i) = a \iff P_i(r_i(m)) = a$. |
  | **Strategy Profile $\vec{\sigma}$** | **Joint Protocol $P$** | The tuple of protocols run by all processes. |
  | **Payoff $u_i(\vec{\sigma})$** | **Utility on Terminal Runs** | DC usually specifies safety/liveness. To match GT, define $u_i: \text{Terminal}(\mathcal{R}) \to \mathbb{R}$. |
  | **Rationality** | **Utility Maximization** | Process $p_i$ chooses action $a$ at $(r,m)$ to maximize $E[u_i \mid \mathcal{K}_i(r,m)]$. |
  | **Common Knowledge of Rationality (CKR)** | **$C(\bigwedge_i \text{Rational}_i)$** | The fixed point of the $E$ (everyone knows) operator applied to the proposition that all processes are maximizing utility. |
  | **Equilibrium Path** | **Compliant Runs** | The subset of runs $\mathcal{R}_{P} \subseteq \mathcal{R}$ generated when all processes follow the equilibrium protocol $P$. |
  | **Off-Equilibrium Path** | **Non-Compliant / Faulty Runs** | Runs where at least one process deviates from $P$. In DC, these are "faulty" executions. |
  | **Belief Revision** | **System Update / Conditioning** | Updating the set of possible runs consistent with the current local state. |

  ### Part 2: The Residue Report

  Here we analyze where the translation holds, where it distorts, and where it breaks.

  #### 1. Knowledge and Indistinguishability (Clean Translation)
  Your suspicion is correct: the epistemic logic is isomorphic.
  *   **DC:** $K_i \phi$ holds at $(r, m)$ iff $\phi$ holds at all $(r', m')$ such that $r_i(m) = r'_i(m')$.
  *   **GT:** Player $i$ knows $\phi$ at node $h$ iff $\phi$ holds at all nodes $h'$ in $i$'s information set.
  *   **Verdict:** This is pure Kripke semantics (S5). The definition of Common Knowledge ($C\phi = \nu Z. E(\phi \land Z)$) is identical. If a GT paper uses S5 knowledge, you can read it as a DC paper without loss.

  #### 2. Rationality vs. Correctness (Major Distortion)
  This is the critical friction point.
  *   **DC View:** A process is **Correct** if it follows protocol $P$. It is **Faulty** if it deviates. Faults are exogenous (crash, Byzantine). We do not ask *why* it deviated, only *that* it deviated.
  *   **GT View:** A process is **Rational** if it maximizes utility given beliefs. A process can deviate from a proposed strategy $\sigma$ and still be Rational (if $\sigma$ wasn't a best response).
  *   **The Distortion:** In DC, "Rationality" has no native operator. If you try to define $\text{Rational}_i$ as "maximizing utility," you introduce a predicate that is not hard-coded into the transition function.
  *   **Byzantine Analogy:** You asked if Byzantine faults are the analogue to irrationality. **No.**
      *   A Byzantine process is arbitrary (may minimize utility, may maximize it, may flip coins).
      *   An Irrational process (in GT) specifically *fails* to maximize its own utility.
      *   In GT, if a player reaches an unreached node, we assume they are still Rational (maximizing), which implies their *beliefs* or *payoffs* must be different than we thought. In DC, if a process reaches a forbidden state, it is simply Faulty. We don't update our model of its goals; we update our model of its health.

  #### 3. Belief vs. Knowledge (The Factivity Problem)
  *   **DC:** Standard runs-and-systems uses **S5**. Knowledge is factive ($K_i \phi \implies \phi$). If $\phi$ is false, $K_i \phi$ cannot hold.
  *   **GT:** Epistemic game theory often uses **KD45** (Belief). Belief is not factive ($B_i \phi \not\implies \phi$).
  *   **The Residue:** The "unreached node" paradox relies on non-factive belief.
      *   *Scenario:* Backward induction says "Node $X$ is never reached."
      *   *Event:* Player 2 finds themselves at Node $X$.
      *   *GT Logic:* "My knowledge that $X$ is unreachable is falsified. I must now hold a *belief* about why I am here (e.g., Player 1 is 'crazy') to determine my move."
      *   *DC Logic (S5):* If $X$ is reached, then the proposition "Node $X$ is unreachable" was **false** in the actual run. If I "knew" it was unreachable, I was wrong, which violates S5.
      *   *Translation:* To model this in DC, you must expand the system $\mathcal{R}$ to include the "deviant" runs *ex-ante*. You cannot start with a system where $X$ is impossible and then arrive at $X$. You must start with a system where $X$ is possible (with low probability or under specific fault assumptions), but the protocol assumes it won't happen.

  #### 4. Counterfactuals (The Operational Gap)
  *   **GT:** Equilibrium concepts (like Sequential Equilibrium) require reasoning about what *would* happen at nodes that *are not* reached. "If I were at node $X$, I would play $Y$."
  *   **DC:** Protocols are defined over local states. $P_i(l)$ is defined even if $l$ is never reached in a compliant run.
  *   **Verdict:** DC handles this cleanly via the protocol function. The protocol specifies actions for *all* local states, reachable or not. The GT paradox arises because they try to *derive* the action at the unreached node from the assumption of rationality, rather than *specifying* it as part of the strategy.

  ### Part 3: The Verdict

  You asked: *Is the residue a defect of my vocabulary, or a sign that the game theorists' formulation is vaguer than it looks?*

  **Verdict: It is largely GT vagueness regarding belief revision, masked by epistemic terminology.**

  Here is the breakdown of why your suspicion is justified:

  **1. The "Unreached Node" is a Model Mismatch, not a Logical Paradox.**
  In DC, we distinguish between the **System** ($\mathcal{R}$, all physically possible runs) and the **Protocol** ($P$, the prescribed behavior).
  *   When a GT player reaches an unreached node, they are effectively discovering that the actual run $r_{actual} \notin \mathcal{R}_{compliant}$.
  *   In GT, "Common Knowledge of Rationality" acts as a constraint that prunes the game tree. If you reach a pruned node, the constraint is violated.
  *   The paradox ("If he is rational, he wouldn't be here; since he is here, is he rational?") dissolves in DC vocabulary:
      *   **Hypothesis:** $C(\text{Everyone follows } P)$.
      *   **Observation:** Local state $l$ implies $\neg (\text{Everyone follows } P)$.
      *   **Update:** $K_i(\neg C(\text{Everyone follows } P))$.
      *   **Action:** The protocol $P_i$ must specify an action for state $l$ *regardless* of how we got there.
  *   GT struggles because they try to keep "Rationality" as a fixed truth while updating beliefs about *which* rational game is being played. In DC, we simply admit the "Fault Assumption" was too optimistic (e.g., we assumed $f=0$ faults, but observed behavior consistent with $f=1$).

  **2. What DC Misses (The Genuine Blind Spot).**
  DC vocabulary hides **Incentive Compatibility**.
  *   In DC, if $P$ says "send 0", and you send "1", you are faulty. We stop analyzing.
  *   In GT, if $P$ says "send 0", and you send "1", we ask: *Did you gain utility?*
  *   **The Defect:** Your vocabulary cannot distinguish between a process that deviates due to a random bit-flip (Crash/Byzantine) and a process that deviates because it was incentivized to do so (Rational Deviation).
  *   **Why it matters:** If the deviation is incentivized, simply "fixing the bug" won't work; the process will deviate again in a new protocol unless the incentives change. DC assumes the protocol is law; GT assumes the protocol is a suggestion subject to optimization.
  *   **However:** This does not validate the epistemic paradox. It just validates the need for Mechanism Design. The paradox of *knowledge* at the unreached node remains a GT artifact of trying to derive beliefs from rationality rather than specifying them.

  **3. The Belief Hierarchy Issue.**
  You mentioned you have no hierarchy-of-probabilities.
  *   GT resolves the unreached node by positing a "trembling hand" or a "type space" (Harsanyi) where there is a non-zero probability the opponent is "irrational" (or a different type).
  *   In DC, this corresponds to a **Probabilistic Failure Model**.
  *   If you add probabilities to your runs (e.g., "Process $j$ crashes with prob $\epsilon$"), the paradox vanishes. Reaching the node is just a low-probability event. You update your posterior on $j$'s health.
  *   GT papers often omit the explicit probability space to make "Rationality" look like a logical necessity rather than a probabilistic assumption. When they do that, they create the paradox. When they add "trembles," they are effectively adding the DC failure model back in.

  ### Summary for your Research

  1.  **Knowledge:** Your S5 Kripke semantics are robust. GT's epistemic machinery is the same, provided they stick to knowledge.
  2.  **Rationality:** This is not an epistemic notion; it is a teleological one (goal-directed). Your "Faulty" category swallows both "irrational" and "malicious." You lose the ability to predict *strategic* deviations, but you gain the ability to model *arbitrary* deviations.
  3.  **The Paradox:** It is an artifact of underspecified belief revision. In DC terms: They are trying to run a protocol on a system $\mathcal{R}$ that they claimed was empty.
      *   **Dissolution:** If you force the GT formulation into Runs-and-Systems, you must include the "deviant" runs in $\mathcal{R}$ from the start. Once they are in $\mathcal{R}$, reaching them is not a logical contradiction, just a protocol violation. The "Common Knowledge of Rationality" was simply false in that run.
  4.  **Recommendation:** When reading EGT, translate "Rationality" to "Protocol Compliance" and "Belief" to "Set of Possible Runs." If they claim a node is unreachable *by logic alone*, flag it as "Assuming $\mathcal{R}$ excludes these runs." If the run occurs, the assumption on $\mathcal{R}$ was wrong. The "paradox" is just the sound of a model breaking under unexpected input.

  The game theorists are often doing something deeper regarding *incentives*, but their *epistemic* formulation of the paradox is indeed vaguer than your operational runs-and-systems formalism. You are not missing a logical depth; you are missing a motivational model, but that motivational model does not rescue the epistemic contradiction they claim exists.
