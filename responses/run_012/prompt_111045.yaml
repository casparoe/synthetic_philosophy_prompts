      *   **Expected Results/Failure Conditions:**
          *   *Success 1:* Reduction works (causation is statistical/linguistic).
          *   *Success 2:* Reduction fails (causation is inherently normative).
          *   *Failure:* The distinction collapses entirely (no "thick" sense exists).
      *   **Timeline/Scope:** 12 months. 3 months reading, 6 months reporting/cases, 3 months writing.
      *   **Exclusions:** Don't solve moral responsibility generally. Don't build a new legal standard.

  4.  **Refining Tone and Length:**
      *   *Tone:* Professional, intellectual, persuasive, clear. Avoid jargon where possible, or explain it immediately.
      *   *Length:* The prompt asks for a "two-page proposal." In standard formatting (12pt, double spaced), that's roughly 500-600 words. If single spaced, maybe 1000. I should aim for around 800-1000 words to ensure density without fluff, fitting a standard grant narrative style.
      *   *Check:* Did I answer the specific constraint about the "determinate answer"? Yes, the question is whether the reduction is possible.
      *   *Check:* Did I explain *why* existing positions leave this open? Yes, they handle one half and smuggle in the other.

