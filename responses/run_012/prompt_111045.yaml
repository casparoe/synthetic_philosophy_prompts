answer: |-
  **Project Title:** The Normative Hidden Variable: Causation by Omission in the Age of Automation

  **Project Summary**
  In my recent reporting on automated decision systems, I have documented a recurring pattern of harm: a vehicle that did not brake, a triage model that did not flag a deteriorating patient, a screening tool that did not surface an applicant. In every instance, stakeholders agreed the system "caused" the harm by failing to act. Yet, in every instance, the argument turned immediately on how finely we described the failure. Frame the event as the system failing to apply the *one* rule that would have caught the case, and its causal role looks plain. Frame it as the system not doing *any* of the infinitely many things it might have done, and the causal claim dissolves.

  This project investigates the structure of this disagreement. I propose that we are running two distinct concepts together under the single heading of "causation by omission": a **thin, counterfactual sense** (where any absent condition that would have changed the outcome counts as a cause) and a **thick, responsibility-tracking sense** (which depends on whether the omission breached a norm the agent was bound by).

  **The Central Question**
  The project seeks a determinate answer to the following: **Can the thick, responsibility-tracking sense of omission-causation be given an account that does not covertly appeal to the very judgments of blame and obligation it is meant to underwrite?**

  Specifically, I will test whether this "thick" sense can be reduced to a non-normative selection among contrast classes (based on statistical normality, salience, or the linguistic framing of a question) or whether it bottoms out in norms and cannot be laundered into anything more neutral. If the former is true, we can build objective audits for algorithmic failure. If the latter is true, claims of "algorithmic causation" are inherently moral arguments disguised as technical findings.

  **Why Existing Approaches Leave This Open**
  Current debates in philosophy and law often talk past one another because they handle only half of the phenomenon. Counterfactual-dependence accounts successfully capture the "thin" sense but generate absurd results (e.g., the passing bystander is a cause of the drowning because they didn't jump in). Contrastive accounts improve on this by asking "Why *this* omission rather than *that* action?" but they frequently smuggle normative assumptions into the selection of the contrast class itself. They quietly help themselves to the very responsibility judgments they are supposed to explain. This project makes that split visible rather than attempting to referee the usual dispute. It treats the "smuggling" of norms not as a error to be corrected, but as a hypothesis to be tested.

  **Methodology**
  As a journalist on a reporting fellowship, I am uniquely positioned to execute this inquiry through a hybrid of conceptual analysis and empirical reporting. Over twelve months, I will undertake:

  1.  **Conceptual Mapping:** A rigorous梳理 (sorting) of the individuation of omissions. This involves defining the boundaries of the "thin" vs. "thick" senses across legal theory, medical ethics, and computer science literature.
  2.  **A Systematic Battery of Matched Cases:** I will construct and report on a series of cases where the physical world is held fixed, but the description, contrast, or norm in play is varied.
      *   *Tort:* Comparing liability in identical accidents where the duty of care is defined differently (e.g., statutory vs. common law).
      *   *Medicine:* Analyzing morbidity reviews where a patient outcome is identical, but the "standard of care" guideline differs by jurisdiction or year.
      *   *Machine Behavior:* Reporting on algorithmic audits where the model's weights are unchanged, but the loss function or "objective" is described differently to stakeholders.

  **Why This Method?**
  A straight survey of intuitions would only reveal that people disagree, not *why*. A purely doctrinal legal analysis would remain bound by precedent rather than underlying logic. By holding the facts fixed and varying the frame, I can isolate whether the causal judgment tracks the physical reality or the normative description. This approach leverages my access to litigants, clinicians, and engineers to find real-world instances of these "matched" scenarios, grounding abstract metaphysics in the mechanics of actual harm.

  **Expected Results and Failure Conditions**
  The project will conclude with a definitive account of the relationship between causation and normativity.
  *   **Conclusion A (Reductionism):** The "thick" sense is reducible to non-normative factors (e.g., statistical rarity). *Implication:* We can automate causal detection without encoding moral judgment.
  *   **Conclusion B (Normative Realism):** The "thick" sense irreducibly depends on obligations. *Implication:* Algorithmic accountability is inherently a political/moral negotiation, not a technical debug.

  **Failure Condition:** The project would fail if the investigation reveals that the two senses collapse into one another entirely—that is, if it proves impossible to distinguish the "thin" counterfactual from the "thick" normative even analytically. While this would be a philosophical finding, for the purposes of this grant, it represents a failure of the proposed framework to generate traction. I would rather identify this collapse in the proposal stage or early research than discover it in month nine.

  **Scope and Exclusions**
  **Timeline:**
  *   *Months 1–3:* Conceptual groundwork and literature synthesis.
  *   *Months 4–9:* Reporting and construction of the matched case battery (interviews, document retrieval, case reconstruction).
  *   *Months 10–12:* Writing and synthesis of the final manuscript.

  **Exclusions:**
  I will deliberately leave out the broader question of *moral responsibility*. This project is not about whether the agent is blameworthy, but whether the *causal claim* itself does the work of assigning blame. I will also not propose new legal standards or regulatory frameworks; the goal is diagnostic clarity, not policy prescription. By restricting the scope to the logic of causation, I ensure the project remains tractable for a single researcher over one year while delivering a result that fundamentally shifts how we talk about automated harm.
