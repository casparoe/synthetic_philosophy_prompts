  2.  **Deconstruct the Argument:**
      *   *Problem:* When an algorithm fails to act (e.g., doesn't brake), we say it "caused" the crash. But technically, it failed to do infinite other things too (didn't fly, didn't sing). Why is *this* omission causal?
      *   *Hypothesis:* We conflate "thin" causation (counterfactual dependence) with "thick" causation (normative breach).
      *   *Question:* Can the "thick" sense be reduced to non-normative factors (salience, statistics, contrast classes), or does it irreducibly depend on norms (duty, obligation)?
      *   *Method:* Comparative case studies where the physical world is fixed, but the description/norm/contrast varies.
      *   *Outcome:* Either we find a neutral mechanism for selecting causal omissions, or we admit causation here is inherently normative.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be catchy but descriptive. "The Cause That Wasn't There" or "Omission and Algorithm." Let's go with something about the "Hidden Norm."
