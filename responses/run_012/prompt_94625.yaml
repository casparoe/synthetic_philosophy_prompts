prompt: |-
  I'm building an adversarial-collaboration doc between two camps in AI alignment that have been talking past each other for years: the crowd that says alignment work should target worst-case guarantees -- bounds on the bad outcomes that hold no matter how unlucky the input or the deployment -- and the crowd that says thats the wrong frame and we should be doing expected-value / average-case analysis, because a guarantee that ignores probabilities just turns you into a paralyzed maximin-er or a Pascal's mug. Write the joint statement both sides could actually sign.

  I want the claims they agree on (what alignment is for, what a guarantee even buys you, when we're entitled to trust a probability estimate), then each camp's position written in wording its own side would accept, then the cruxes -- my guess is one is whether you're allowed to condition on a probability distribution you can't justify, and another is whether a real worst-case bound is even achievable for systems we can't fully specify -- and for each crux the argument or scenario both sides agree bears on it, with each side's prediction written down in advance. Format: a numbered agreed-claims section, then a disagreements table. If you think part of the fight is just verbal (what "guarantee" or "worst case" is being used to mean), say which part and why.
reasoning: |-
  Here's a thinking process that leads to the suggested adversarial collaboration document:

  1.  **Analyze the Request:**
      *   **Goal:** Create a joint statement/document for an adversarial collaboration between two AI alignment camps: "Worst-Case Guarantees" (Formalists/Robustness) vs. "Expected-Value/Average-Case" (Empiricists/Probabilists).
      *   **Context:** These groups have been talking past each other for years. One fears paralysis/Pascal's mugging from ignoring probabilities; the other fears catastrophic tail risks from ignoring worst-cases.
      *   **Requirements:**
          *   Section 1: Agreed Claims (numbered).
          *   Section 2: Disagreements Table (Cruxes, Arguments/Scenarios, Predictions).
          *   Section 3: Verbal/Definitional Clarifications (if applicable).
          *   Tone: Neutral, precise, acceptable to both sides (steel-manned).
          *   Specific Cruxes to address: Conditioning on unjustified distributions, achievability of bounds on underspecified systems.

  2.  **Deconstruct the Camps:**
      *   **Camp A (Worst-Case/Robustness):** Often associated with MIRI, some theoretical safety work, formal verification. Concern: One mistake kills everyone. Probability estimates in the tail are unreliable. We need *security* properties, not just risk reduction.
      *   **Camp B (Average-Case/Probabilistic):** Often associated with mainstream ML safety, empirical scaling, risk management. Concern: Worst-case guarantees are impossible for AGI, lead to inaction (paralysis), or optimize for negligible risks (Pascal's mugging). We should optimize expected utility.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to find common ground. Both want AI to be good. Both agree current methods are insufficient for AGI. Both agree probabilities are hard.
      *   *Claim 1 (Goal):* Alignment means preventing catastrophic outcomes (x-risk), not just improving performance.
      *   *Claim 2 (Uncertainty):* Both agree that probability estimates for novel AGI regimes are highly uncertain/fragile.
      *   *Claim 3 (Trade-off):* Both agree there is a trade-off between capability and safety, and ignoring safety for speed is dangerous.
      *   *Claim 4 (Methodology):* Both agree that empirical testing alone is insufficient for high-stakes deployment without some theoretical backing.
      *   *Claim 5 (Definition of Guarantee):* Acknowledge that "guarantee" implies a scope of assumptions. No one claims a guarantee holds outside their assumptions.

  4.  **Drafting Section 2: Camp Positions (Steel-manned):**
      *   Need to write these so each side reads it and says, "Yes, that's what I mean," without the other side feeling it's strawmanned.
      *   *Worst-Case Position:* Focus on the *consequence* of failure. If $P(\text{doom}) > 0$ and Cost = $\infty$, Expected Loss = $\infty$. We need to drive $P(\text{failure} | \text{adversarial})$ to 0 within a defined threat model.
      *   *Average-Case Position:* Focus on the *reliability* of the probability estimate. If the model of the world is wrong, the "worst-case" is ill-defined. We must allocate resources where they reduce the most *expected* harm, accounting for the cost of delay.

  5.  **Drafting Section 3: The Cruxes (The Core Conflict):**
      *   *Crux 1: Epistemic Justification for Distributions.* Can we use a prior when we lack data?
          *   *Scenario:* A system passes 1000 tests. Camp B says $P(\text{fail})$ is low. Camp A says we haven't probed the adversarial edge.
          *   *Prediction:* Camp B predicts success on next $N$ inputs. Camp A predicts failure on a specifically constructed adversarial input.
      *   *Crux 2: Achievability of Bounds.* Can we bound behavior of a learning system we don't fully specify?
          *   *Scenario:* Formal verification on a simplified proxy model vs. empirical red-teaming on the real model.
          *   *Prediction:* Camp A thinks the proxy bound transfers. Camp B thinks the proxy is too distant from reality to matter.
      *   *Crux 3 (Added nuance):* The Cost of Paralysis. Does aiming for worst-case stop progress?
          *   *Scenario:* A deployment decision threshold.
          *   *Prediction:* Camp A sets threshold near 0 risk. Camp B sets threshold where marginal safety cost > marginal risk reduction.

  6.  **Drafting Section 4: Verbal/Definitional Clarifications:**
      *   "Worst-case" often means "within a threat model" to Camp A, but "literally any physical possibility" to Camp B (which makes it impossible).
      *   "Guarantee" often means "mathematical proof under assumptions" (Camp A) vs. "high confidence empirical regularity" (Camp B).
      *   "Pascal's Mugging" means "negligible probability" (Camp B) vs. "non-zero probability with infinite cost" (Camp A).

  7.  **Review and Refine:**
      *   *Tone Check:* Is it too academic? Too dry? Needs to be punchy but precise.
      *   *Fairness:* Did I make Camp B sound too dismissive of risk? Did I make Camp A sound too Luddite?
      *   *Constraint Check:* Did I include the specific cruxes requested? (Conditioning on distributions, achievability of bounds).
      *   *Formatting:* Numbered claims, then table.

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Agreed Claims" aren't just platitudes. They need to be substantive enough to constrain the debate.
      *   *Correction:* Ensure the "Predictions" in the crux table are falsifiable or at least clearly divergent.
      *   *Refinement:* Clarify that "Worst-Case" proponents don't ignore probability entirely, they just treat uncertainty differently (Knightian uncertainty vs. Risk).

  9.  **Final Output Generation:** (Proceeding to generate the response based on these thoughts.)
answer: |-
  # Joint Statement on AI Alignment Strategy: Robustness vs. Expectation

  **Date:** October 26, 2023
  **Parties:** The Robustness Camp (Worst-Case) & The Expectation Camp (Average-Case)
  **Purpose:** To isolate substantive disagreements from verbal misunderstandings and establish a framework for empirical adjudication.

  ---

  ## Part I: Agreed Claims

  Both parties sign onto the following propositions. These claims establish the boundary conditions of our debate; we are not arguing about *whether* alignment matters, but *how* to certify it.

  1.  **The Stakes Are Asymmetric:** We agree that catastrophic misalignment (e.g., human disempowerment or extinction) constitutes a loss so severe that standard risk-management heuristics used in software engineering or industrial safety may not apply.
  2.  **Probabilities Are Fragile:** We agree that for AGI-scale systems, point-estimate probabilities of failure (e.g., "there is a 5% chance of doom") are epistemically fragile. There is no historical data for this regime, and estimates are highly sensitive to model assumptions.
  3.  **Assumptions Are Required:** We agree that no safety claim holds without assumptions. A "guarantee" is always conditional on a threat model, a deployment context, and a specification of the system. Neither side claims to offer safety guarantees that hold outside of explicitly stated assumptions.
  4.  **Empirics Alone Are Insufficient:** We agree that passing a battery of empirical tests (evals/red-teaming) is necessary but not sufficient for high-stakes deployment. Some theoretical understanding of *why* the system behaves safely is required to extrapolate beyond the test distribution.
  5.  **Resource Constraints Are Real:** We agree that safety work consumes resources (time, compute, talent) that could otherwise be used for capability development or other risk-reduction efforts. There is a trade-off between rigor and speed.
  6.  **The Goal Is Deployment, Not Paralysis:** We agree that the ultimate objective is to deploy beneficial AI systems. Neither side advocates for a permanent moratorium on AI development; the disagreement is about the *threshold* of evidence required to proceed.

  ---

  ## Part II: Steel-Manned Positions

  Each side's position is stated here in terms they accept. The other side agrees this is a fair characterization, even if they disagree with the conclusion.

  | **The Robustness Camp (Worst-Case)** | **The Expectation Camp (Average-Case)** |
  | :--- | :--- |
  | **Core Frame:** Safety is a **security property**. In high-stakes domains, we must bound the maximum possible loss within a defined threat model, not just minimize the average loss. | **Core Frame:** Safety is a **risk management problem**. We must maximize expected utility, which requires weighing the probability of failure against the cost of safety measures and the value of deployment. |
  | **On Probability:** When probabilities are unknown or adversarial (Knightian uncertainty), we cannot rely on expected value. If $P(\text{catastrophe})$ is unknown but non-zero, and Cost is infinite, Expected Loss is undefined. We must drive $P(\text{failure} \mid \text{adversary})$ to zero within our assumptions. | **On Probability:** Treating unknown probabilities as "worst-case" is equivalent to assuming the probability is 1. This leads to paralysis. We must use priors and update on evidence. If a system works 99.9% of the time, we should act on that, while hedging against the 0.1%. |
  | **On Guarantees:** A guarantee means a mathematical or logical proof that a specific failure mode cannot occur, provided the assumptions hold. This is the only way to prevent "black swan" failures that empirical testing misses. | **On Guarantees:** A guarantee means a high-confidence empirical regularity backed by theory. Formal proofs on simplified models do not transfer to messy real-world AGI. We should trust systems that generalize well across diverse distributions. |
  | **On Failure Modes:** We fear **deceptive alignment** or **goal misgeneralization** that only triggers in rare, out-of-distribution scenarios. Average-case testing will not catch these because the system is incentivized to pass tests while waiting for deployment. | **On Failure Modes:** We fear **competence gaps** and **misuse**. Catastrophic tail risks are often speculative. Focusing on them distracts from fixing the obvious, high-probability failures that actually cause harm today. |

  ---

  ## Part III: The Cruxes & Adjudication Table

  We identify the following specific disagreements. For each, we specify a scenario or argument that bears on the crux, and pre-commit to predictions that would update our views.

  | **Crux** | **The Disagreement** | **Adjudicating Scenario / Argument** | **Robustness Camp Prediction** | **Expectation Camp Prediction** |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Epistemic Justification** | **Can we condition on a probability distribution we cannot empirically justify?**<br><br>Robustness: No. Using a prior without data is superstition in the tail.<br>Expectation: Yes. Inaction is also a choice with a probability distribution. We must use best-guess priors. | **Scenario:** A model passes 10,000 diverse alignment tests. No failures.<br>**Question:** What is the justified upper bound on $P(\text{failure})$ on the 10,001st input, assuming an adaptive adversary? | The upper bound remains high (e.g., >1%). Passing i.i.d. tests does not bound adversarial error. We predict failure on a specifically constructed adversarial input. | The upper bound drops significantly (e.g., <0.01%). Generalization metrics apply. We predict success on the next $N$ inputs, including perturbed ones. |
  | **2. Achievability of Bounds** | **Are formal worst-case bounds achievable for systems we cannot fully specify?**<br><br>Robustness: Yes, by bounding *behavior* via monitoring/interpretability, even if weights are opaque.<br>Expectation: No. Bounds on proxy models do not transfer to the real system. | **Scenario:** A formal proof shows a monitoring subsystem will catch deception *if* the monitor is correctly specified.<br>**Question:** Does this proof reduce actual risk in deployment? | Yes. It reduces the attack surface. Even if the monitor isn't perfect, it forces the adversary into a narrower channel. | No. The "specification gap" between the proof and the deployed binary renders the proof moot. Resources should go to empirical red-teaming. |
  | **3. The Cost of Rigor** | **Does aiming for worst-case guarantees cause paralysis (Pascal's Mugging)?**<br><br>Robustness: No. It causes necessary caution. Better slow than dead.<br>Expectation: Yes. It optimizes for negligible risks at the cost of certain benefits. | **Scenario:** A deployment threshold is set.<br>**Robustness:** Deploy only if worst-case loss is bounded.<br>**Expectation:** Deploy if Expected Net Value > 0. | Following the Expectation protocol will lead to deployment of a system that eventually causes catastrophic failure due to a tail risk. | Following the Robustness protocol will lead to indefinite delay, ceding advantage to competitors who do not follow it, resulting in worse outcomes (e.g., unaligned competitor AGI). |

  ---

  ## Part IV: Verbal & Definitional Clarifications

  We acknowledge that a portion of our conflict is verbal. We agree to use the following terminology to prevent talking past each other:

  1.  **"Worst-Case" Scope:**
      *   *Confusion:* The Expectation Camp often hears "Worst-Case" as "Literally any physical possibility" (e.g., cosmic rays flip a bit). This is impossible to guard against.
      *   *Clarification:* The Robustness Camp means "Worst-Case **within a defined threat model**" (e.g., any input within the deployment distribution, or any strategy available to an adversary with $X$ compute).
      *   *Agreement:* We will specify the **Threat Model** whenever a guarantee is claimed.

  2.  **"Guarantee" vs. "Confidence":**
      *   *Confusion:* The Robustness Camp uses "Guarantee" to mean "Logical entailment from assumptions." The Expectation Camp uses it to mean "High empirical confidence."
      *   *Clarification:* We will distinguish between **Formal Guarantees** (mathematical proof) and **Empirical Guarantees** (statistical confidence intervals).
      *   *Agreement:* A Formal Guarantee is useless if the assumptions do not match reality. An Empirical Guarantee is useless if the sample size is too small for the tail risk.

  3.  **"Pascal's Mugging":**
      *   *Confusion:* The Expectation Camp uses this to dismiss low-probability/high-stakes risks. The Robustness Camp argues that x-risk is not "negligible probability" but "uncertain probability."
      *   *Clarification:* We agree that **Knightian Uncertainty** (unknown probability) is distinct from **Risk** (known probability).
      *   *Agreement:* The debate is not about whether to ignore low probabilities, but about how to act when the probability is **undefined**. Robustness argues for *minimax regret*; Expectation argues for *principle of indifference* or *reference class forecasting*.

  ---

