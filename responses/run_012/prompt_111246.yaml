prompt: |-
  ok this is gonna be long, sorry in advance, but I actually need advice and not the "both sides have a point" thing I keep getting from everyone.

  so for philosophy club at my school we each have to bring a "hard question" and then run the discussion for like 20 minutes, and mine is this thursday. it started as a dinner argument. my cousin is in second year neuroscience and never lets anyone forget it, and he said that being in love is just chemicals and that me still being sad about my dog is just neurons doing their thing. my mum got upset and said he was explaining away the only things that actually matter, my dad said a hurricane is just air and water and nobody complains about that, and then we argued for an hour and my little sister cried. now I have two friends who've each picked a side and I have to referee them in front of the club, and honestly I can't tell who's winning because they both sound right when they're talking. Friend A says: there's one world and it runs on physics, so any description that isn't the physics description is either identical to it or else it's a convenient fiction — and if it's a fiction then fine, it might be useful, but you can't call it true, and you definately can't say the chemistry is "missing something", because there's nothing left over to miss. Friend B says the opposite: when you swap "he misses his dog" for a list of ions you haven't explained the thing, you've deleted it and explained a different thing, so the "it's really just neurons" line is just false. Also Friend A has this other move that bugs me: whenever anyone asks why we have music or guilt or whatever, he says "it evolved", and it feels like he's using it to end the conversation, but I can't say why that's different from an actual evolutionary explanation. my bio teacher said something about how you have to show the scaffolding instead of just saying "it evolved" and then the bell went.

  so what I want is: (1) lay out what the actual positions are here and which ones hold up, (2) tell me whether there's a version of "the chemistry is real but not the whole story" that isn't just having it both ways, and (3) give me something I can actually do on thursday — like a test I can run on a "just" claim to see if it's cheating, plus two or three questions I can ask Friend A that he can't just wave away. and if it helps, the case I'm most confused about is that I feel like you can't explain why a chess move is brilliant by describing the electricity in the laptop, but you can explain a thunderstorm with molecules, and I can't put my finger on the difference.
