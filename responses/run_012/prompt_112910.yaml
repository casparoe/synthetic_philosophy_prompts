answer: |-
  Good morning. Welcome to all of you.

  Look around the room. It is an unusual collection. We have philosophers who spend their lives arguing about personal identity. We have psychiatrists and geriatricians who see the biology of it every day. We have lawyers who navigate the Court of Protection when things go wrong. And we have carers and former carers. You are here because of a funding condition, yes. But let us be clear about something before we start. You are also here because you are the only people in this room who have actually lived this. The rest of us are theorising. You have held the hand. You have made the call.

  Usually, we sit in separate rooms. The clinicians talk to the lawyers. The philosophers talk to each other. The carers go home and manage the fallout. Today, we need the friction. We need the discomfort of having all these perspectives in one space. Because the problem we are here to discuss does not respect our disciplinary boundaries. It cuts through all of them.

  I want to start with a story. It is a composite, but you will recognise it.

  A woman in her sixties. She is sharp. She is clear. She watches her own mother decline, and she sees something she wishes to avoid. She writes a directive. She signs it. She says that if she develops dementia, she does not want to be kept alive by food and fluids. She is emphatic. She knows what she values. She knows what she fears.

  Ten years pass. The dementia arrives. It is moderate. She cannot follow the reasoning in the document she signed. She does not recognise the signature as hers. To her, that piece of paper is a relic from a stranger.

  But here is the bit that matters. She is content. By every measure anyone around her can apply, she is doing well. She likes the garden. She likes the staff. She asks for pudding twice. She is not suffering. She is not a torment to herself.

  So. Who is in the room?

  There are two selves here. There is the woman who wrote the directive, and the woman who is asking for pudding. The ordinary assumption—that they are one person making one long decision across time—is exactly what has come unstuck. The law tries to hold them together. The philosophy often tries to pull them apart. But in the clinic, and in the home, you have to deal with both of them at once.

  We often talk about advance directives as if they are orders. We speak of the authority of the earlier self as if it were a sovereign command. We imagine the woman in her sixties as a ruler issuing a decree that must survive her own decline. But a sovereign command relies on the sovereign remaining present to enforce it. When the mind changes, the sovereign is gone.

  So I want to suggest a different framing for these two days. Perhaps a directive is less like an order, and more like a promise. Or perhaps it is like a letter left for someone you know you will not get to meet.

  On this view, the authority of the earlier self isn't a command that survives her. It is a claim the later self is asked to honour. It is a request from the past to the future. And that raises a difficult question. Can a promise bind when the promiser, in the sense that matters, isn't there anymore?

  And then we have the awkward fact of her contentment. The earlier woman's dread was partly a dread of precisely the state the later woman is now in. She feared she would be miserable. She isn't. The dread looks miscalibrated.

  It is tempting to use this as a gotcha. To say, "Well, she was wrong about her future feelings, so the directive is void." But if we let it be an easy gotcha, we have told the carers in this room that their relative's wishes never counted. We have told them that fear is irrelevant if the outcome is pleasant. That is cruel. And it is philosophically lazy. It dismisses the integrity of the life lived before the illness.

  But if we ignore the contentment, if we stick rigidly to the document, we risk harming the person sitting in front of us. We risk treating a living woman as a vessel for a dead woman's wishes.

  My colleague and I were chewing this over with coffee recently. We couldn't agree whether the later woman's contentment is a reason to override the directive, or just a fact about her state. I don't want to resolve that for you today. In fact, I want us to resist the urge to resolve it too quickly.

  If we decide too easily that the directive rules, we lose the person in the garden. If we decide too easily that the contentment rules, we lose the person who signed the paper. We lose the continuity of a life project. We lose the right to decide how our story ends.

  So here is what I am asking of this workshop. Do not try to solve this by lunchtime. Do not look for a policy fix that tidies up the contradiction. The contradiction is real. The tension is the point.

  I want us to hold both of them in view at once. I want the lawyers to feel the weight of the pudding. I want the clinicians to feel the weight of the signature. I want the philosophers to stop arguing about identity long enough to listen to the carers. And I want the carers to know that their experience is not just data for us to analyse. It is the ground we are standing on.

  We are here to ask whether a promise can bind when the promiser is gone. We are here to ask if a fear that did not come true still deserves respect. We are here to sit with the discomfort of two selves occupying one body.

  Let us begin there. Let us keep both women in the room.

  ***

  **Post-Speech Analysis**

  The framing most likely to come apart is the analogy of the directive as a "promise" or "letter." This move carries the most weight because it attempts to shift the normative force from *authority* (which requires identity continuity) to *obligation* (which might survive discontinuity). However, a promise typically requires a promisee to whom the obligation is owed. If the later self is psychologically discontinuous with the earlier self, it is unclear why the later self (or the doctors acting on her behalf) owes anything to the earlier self, who effectively no longer exists. If the later self is truly a different person, the "promise" becomes a request from a stranger, which carries significantly less moral weight. My mind would be changed about this framing if compelling evidence suggested that the psychological rupture in moderate dementia is total rather than gradual; if the later self possesses zero narrative connection to the earlier self, the "promise" analogy collapses into mere charity, and the authority of the directive would require a different justification entirely, perhaps based on societal interest rather than interpersonal obligation.
