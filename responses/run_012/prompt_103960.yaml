answer: |-
  Four minds attend the apple on the desk,
  Red skin and weight and shadow on the wood.
  They keep the object from the void's grotesque
  Dissolving mist, where nothing distinct stood.

  One walks away to pace the hallway floor,
  Three minds remain to fix the fruit in place.
  The red persists, unaffected by the door
  That closes off one member of the race.

  A second turns to watch the garden wall,
  Two minds remain to anchor form and shape.
  Does substance thin beneath the shrinking pall,
  Or find a way to silently escape?

  A third departs. The solitary gaze
  Sustains the curve and color by its will.
  Yet to conceive the empty room implies
  A thinker there; can silence stand still?

  I step outside. No mortal looks again.
  The logic says the fruit is purely mind.
  But is the limit of the thinker's pen
  The limit of the truth we hope to find?

  Unless a Vision, boundless and awake,
  Holds fast the red where human vision ends.
  Not by this verse, nor for the reader's sake,
  But where the finite, sightless curve depends.
