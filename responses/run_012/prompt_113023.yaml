prompt: |-
  Someone in my study group wrote up this summary of iterated elimination and I want a second opinion on whether its fair, since I have to present on it next week. Here's what they wrote: "To solve a finite game, you repeatedly delete dominated strategies. A strategy is dominated if there's some other pure strategy that does at least as well as it against every possible combination of the other players' choices. Delete those, repeat in the smaller game, and since being dominated is a fact about the strategy itself, the order of deletion can't matter -- you always get the same surviving set, and those survivors are exactly the Nash equilibria. Mixed strategies don't really change anything here; mixing is just what you fall back on when no pure strategy is dominated." I sort of believe the first part but the last bit about Nash and order feels too strong. Can you go through it clause by clause and tell me what a game theorist would sign off on, what's a harmless simplification, and what's actually false -- and then say whether any corrected version of the conclusion (survivors are the Nash equilibria) holds, and under what assumptions?
