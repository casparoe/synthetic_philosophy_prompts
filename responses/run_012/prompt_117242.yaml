answer: |-
  Dear friend,

  I know exactly where you are sitting with this, and I want to start by telling you that the wall you have hit is not a failure of your imagination but a reflection of reality. Biologists and philosophers have been fighting over this exact list for decades, and the fact that your gut is wobbling means you are paying attention to the right details. You are trying to find a binary switch for a phenomenon that is actually a gradient, but for the sake of your novel, you need a rule that feels true enough to stand up under scrutiny. The principle that ties together almost all of your intuitions, including the tricky ones about chlamydia and mitochondria, is not about reproduction or DNA or even complexity. It is about active homeostasis. To be alive, in the sense you are reaching for, an entity must be actively working to maintain a boundary between itself and the rest of the universe, using energy to fight off entropy.

  This principle of active homeostasis resolves the chlamydia versus mitochondrion problem that is currently blocking you. You feel chlamydia is alive and the mitochondrion is not, even though both live inside cells and both have DNA. The difference is who is driving the bus. A chlamydia bacterium, even when inside a host, is maintaining its own boundary and regulating its own internal chemistry according to its own genetic instructions. It is a distinct agent negotiating with the host. A mitochondrion has surrendered that agency. It no longer controls its own boundary or its own division in any meaningful independent sense. The cell nucleus controls the mitochondrion. The mitochondrion is a tool the cell uses to make energy, much like a ribosome is a tool the cell uses to make protein. You called the ribosome a machine and not alive, and you are right. The mitochondrion is just a very complex machine that used to be alive but has been domesticated into organelle status. The chlamydia is still a wild animal living in your house.

  This same logic handles the mule versus the virus. You were worried that sterility disqualifies the virus but not the mule. Under the homeostasis rule, reproduction is secondary. The mule is alive because it is burning energy to keep its cells intact, repairing damage, and maintaining a internal environment distinct from the air around it. It is fighting entropy. The virus is not. A virus particle sits still. It does not eat, it does not breathe, it does not repair itself. It is a key waiting for a lock. When it enters a cell, it is not the virus that comes alive, it is the cell that gets hijacked. The cell starts working hard, burning energy, and maintaining boundaries, but that is the cell's life, not the virus's. This is why you feel the asymmetry of death so strongly. Bleach kills a bacterium because it stops the bacterium from doing the work of being a bacterium. It disrupts the homeostasis. You cannot kill a virus because it was never doing the work in the first place. You can only break it, like smashing a key. The bacterium transitions from a state of active maintenance to a state of decay. The virus transitions from intact to broken. There is no phase of aliveness to lose.

  The lichen is the case that threatened to undo this, but it actually fits if you look at the boundary. You want to say the lichen is alive, and you should. The fungus and the alga together create a new boundary that neither has alone. They negotiate a shared homeostasis. They form a new unit of agency. This does not make the mitochondrion alive by proxy because the mitochondrion does not negotiate. It obeys. The lichen partners are still distinct lineages that have chosen to cooperate. The mitochondrion is a lineage that has been subsumed. So you do not have to drop the lichen verdict. However, there is one verdict in your list that this principle suggests you should reconsider, and it is the red blood cell. You said you guessed it was alive or at least part of something alive. A mature mammalian red blood cell has no nucleus, no mitochondria, and cannot synthesize protein. It cannot repair itself. It consumes glucose, but only to maintain its shape for a short time until it wears out. It is more like a shed skin cell or a strand of hair than it is like a bacterium. It is living matter, but it is not an alive agent. It is a component issued by the body that has a shelf life. If you call it not alive, but rather a living part of a larger alive thing, your principle holds much tighter.

  To test this further, let us look at a case you did not list, which is a bacterial endospore. This is a bacterium that has dried itself out into a dormant brick that can survive for centuries in vacuum or heat. It has no metabolism. It is not doing any work. Is it alive? Your principle says life is a phase of active maintenance. So strictly speaking, the spore is in suspended animation. But we call it alive because it retains the capacity to resume homeostasis. It is like a paused video versus a stone. The virus is the stone. The spore is the paused video. If you put the spore in broth, it wakes up and starts fighting entropy again. If you put the virus in broth, nothing happens until it finds a cell to hijack. This distinction should help your character in the lab. She is not looking for complexity or DNA. She is looking for a system that is spending energy to stay distinct from its container.

  So the principle you are looking for is this. Life is a process, not a substance. It is the act of maintaining a self-defined boundary against the environment. Anything that does this is alive, even if it cannot reproduce, like the mule. Anything that does not do this is not alive, even if it can replicate, like the virus. Anything that used to do this but has been integrated into a larger system is no longer alive, like the mitochondrion. Anything that can resume doing this after a pause is alive, like the spore. Anything that is merely a complex molecule issued by a living system is not alive, like the red blood cell or the prion. This allows you to keep your firmest intuitions about the virus and the bacterium while explaining away the wobbles about the organelles and the hybrids.

  I know this week has been weird and the last thing you need is more ambiguity, but I hope this gives you a solid floor to stand on. You do not need to solve the definition of life for the universe, only for your character in that room. She is looking for a flame, not the wood. If the thing in the tube is burning energy to keep itself separate from the glass, it is alive. If it is just sitting there waiting to be used, it is not. Write the scene with that image in mind. Let her look for the work. If the thing is working, it lives. If it is not, it does not. And if it stops working, it dies. That asymmetry is the heart of the scene. Good luck with the draft, and be kind to yourself while you finish this thing.

  Warmly,

  A Reader
