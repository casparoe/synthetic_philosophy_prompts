answer: |-
  This is not a contradiction because Montaigne distinguishes between the subjective labeling of customs and objective moral judgment, using the universal standard of Nature to criticize European artifice while defending the cannibals' natural virtue.

  Montaigne's famous claim about barbarism is epistemological, not moral; he argues that we lack the *authority* to condemn foreign customs simply because they differ from our own, not that all actions are equally virtuous. He replaces cultural prejudice with Nature as the ultimate judge, positing that the cannibals live closer to the "laws of Nature" while Europeans are corrupted by "artifice." Therefore, he can condemn European torture as worse than cannibalism not because of cultural preference, but because tormenting a living body violates natural reason more than eating a dead enemy does.

  The episode of the three men functions as the voice of uncorrupted Natural Reason exposing the irrationality of European social constructs. Their confusion regarding hierarchy and inequality demonstrates that these European customs are not universal truths but arbitrary inventions that violate natural equity. By showing that "savages" perceive French society as absurd, Montaigne validates his claim that civilization often obscures rather than reveals truth, reinforcing the Nature versus Artifice framework rather than suggesting all systems are equally valid.

  The detail about revenge is crucial to the moral argument rather than mere color, as it frames the violence within a recognizable moral economy of justice and retribution. By specifying that the cannibalism is an act of extreme revenge rather than sustenance or gratuitous malice, Montaigne aligns their actions with European concepts of honor and warfare, allowing a direct comparison to European judicial torture. If the act were purely predatory, the comparison to European methods of punishment would fail; the revenge motive establishes them as moral agents operating under a code, making their cruelty appear more honest than European sadism.

  The admission that the report is second-hand and linguistically limited reinforces Montaigne's skeptical method rather than undercutting his judgments. By acknowledging the imperfection of his sources, he signals that the essay is a philosophical exercise using the "cannibal" as a mirror for European vice rather than an ethnographic record. This caveat protects him from claims of factual error while emphasizing that moral truth is accessible even through imperfect testimony, making the limitation an integral part of the argument's integrity.

  I am 90% confident in this reading, as the Nature versus Artifice framework is the consensus among major Montaigne scholars for resolving the relativism tension. I am least sure about the precise weight Montaigne places on the "revenge" motive versus the shock value of the eating itself, as some interpretations suggest the act's visceral impact matters more than its justification.
