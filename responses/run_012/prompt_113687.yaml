          4.  Identification of verbal disputes (half-empty vs. half-full).
          5.  Distinction between settled science and genuine contestation.
      *   **Tone/Style:** American English, explicit, balanced (no dressing up one view as consensus), suitable for print.

  2.  **Deconstruct the Debate:**
      *   **Heuristics and Biases (H&B):** Focus on cognitive limitations, systematic deviations from logic/probability theory (normative standards), internal cognitive machinery. Key figures: Kahneman, Tversky, Thaler, Sunstein.
      *   **Ecological Rationality (ER) / Fast-and-Frugal:** Focus on adaptive fit between mind and environment, heuristics as tools that work well in specific contexts, external validity. Key figures: Gigerenzer, Todd, Goldstein.
