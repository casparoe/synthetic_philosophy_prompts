  4.  **Drafting Section 2: Disagreements Table (The Steelman):**
      *   Need to state the H&B view in a way Gigerenzer wouldn't call a strawman, and vice versa.
      *   *H&B View:* Cognitive mechanisms are prone to systematic errors relative to normative models; debiasing is possible/needed.
      *   *ER View:* Heuristics are adaptive tools; performance depends on environmental structure; "errors" are often artifacts of mismatched tasks.
      *   *Key distinction:* Internal consistency vs. External success.

  5.  **Drafting Section 3: The Cruxes (The Moveable Points):**
      *   This is the hardest part. Needs specific experiments/cases.
      *   *Crux 1: Definition of Bias.* Is it internal deviation or external failure?
          *   *Test:* A task where logic says X, environment says Y, and they conflict.
          *   *Prediction:* H&B says stick to logic. ER says stick to environment.
      *   *Crux 2: Lab vs. Field.* Do lab tasks measure capacity or ecological fit?
          *   *Test:* Replicating a bias in a naturalistic setting vs. abstract setting.
          *   *Prediction:* H&B says bias persists. ER says bias vanishes or reverses.
      *   *Crux 3: Optimization vs. Satisficing.* Is "good enough" just optimization with costs?
          *   *Test:* Resource-constrained decision making.
          *   *Prediction:* H&B says suboptimal. ER says optimal given constraints.
      *   *Refinement:* Make sure the predictions are distinct.

  6.  **Drafting Section 4: Verbal Disputes (The "Glass" Issue):**
      *   Where are they saying the same thing?
      *   "Bounded Rationality" (Simon) is claimed by both.
      *   "Heuristic" means different things (shortcut vs. adaptive tool).
      *   "Rationality" (coherence vs. correspondence).
      *   This section needs to highlight where the fight is semantic.

  7.  **Drafting Section 5: Settled vs. Contested:**
      *   *Settled:* Humans use shortcuts. Lab results are replicable (mostly). Logic isn't always the right tool for real life.
      *   *Contested:* Whether the shortcuts are "flaws." The prescriptive implication (debias vs. train intuition).

  8.  **Review and Refine (Self-Correction):**
      *   *Check Tone:* Is it too academic? Keep it journalistic but precise.
      *   *Check Balance:* Did I lean too Kahneman? (e.g., calling things "errors"). Did I lean too Gigerenzer? (e.g., calling things "adaptive").
      *   *Constraint Check:* Did I include the specific examples requested (conjunction fallacy, base-rate, etc.)? Yes, need to ensure they appear in the Agreed Claims.
