      *   *Context:* This is a *mutual-aid group*. Its explicit purpose is to distribute funds based on need. The "status quo" isn't holding money in a vault; the status quo is *evaluating and distributing*.
      *   *Institutional Agency:* The treasurer/chair aren't private citizens walking past a drowning child. They are *stewards* of a resource created specifically for this purpose. Inaction here is a policy decision, not a passive state.

