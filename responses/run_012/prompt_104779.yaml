prompt: |-
  Interpretability folks seem to do two things that don't obviously fit together. When a linear probe reads a concept off a layer's activations, they'll say the model "represents" that concept. But when you point out that you could probably probe a randomly initialized network for the same thing, or that the info might just be sitting there unused, they back off and say decodability isn't representation -- you need a causal test, ablate or patch the direction and check the behavior moves. So in one breath representation is linearly decodable information, and in the next it's causally used information. Then there's the newer move where you train a sparse autoencoder on activations, get a pile of "features," and start talking about them as the model's concepts, even when a single feature fires on a grab-bag of unrelated stuff.

  What does this practice actually presuppose about what a representation is -- that it's decodable structure, that it's a causally active direction, or that it's something more like a human concept with a content? Which of those does the practice strictly need, and which is just along for the ride? And if you swapped the implicit theory out for a deflationary one where "representation" is only a useful bookkeeping device and there's no fact about what the network really represents, what would have to change about how interpretability work is done and reported?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Observation:** Interpretability researchers seem inconsistent.
          *   Case A: Linear probes find information $\rightarrow$ Claim: Model "represents" concept.
          *   Case B: Counter-argument (random nets also decodable/unused info) $\rightarrow$ Claim: Decodability $\neq$ representation; need causality (ablation/patching).
          *   Case C: Sparse Autoencoders (SAEs) find features $\rightarrow$ Claim: These are "concepts," even if polysemantic or messy.
      *   **Core Question:** What does this practice *presuppose* about representation?
          *   Option 1: Decodable structure?
          *   Option 2: Causally active direction?
          *   Option 3: Human-like concept with content?
      *   **Follow-up:** Which is strictly *needed* vs. "along for the ride"?
      *   **Hypothetical:** If we adopt a *deflationary* view (representation = useful bookkeeping, no fact of the matter), what changes in practice/reporting?

  2.  **Analyze the Tension (The "Two Things"):**

      *   The user identifies a real tension in the field between *correlational* (probing) and *causal* (interventionist) definitions of representation.
      *   There's also a tension between *local* (linear direction) and *distributed* (SAE feature) views.
      *   Underlying this is the philosophical question: What makes a state a *representation* of $X$? Is it information bearing? Is it used for control? Is it semantic?

  3.  **Address the "Presupposition" Question:**

      *   *What do they actually need?* To do the math, they only need linear algebra and statistics. To claim "interpretability," they need a bridge to semantics.
      *   *The Implicit Theory:* It's usually a hybrid. They want the *reliability* of causality but the *ease* of probing.
      *   *Strict Necessity:* Strictly speaking, to claim "the model uses this," you need causality. To claim "this info is present," you need decodability. To claim "this is a concept," you need human alignment.
      *   *The "Along for the Ride" part:* The semantic content (human concept) is often projected by the researcher. The model doesn't care about "gender" or "sentiment" as humans define them; it cares about predictive features.

  4.  **Evaluate the Three Candidates:**

      *   *Decodable Structure:* Necessary but not sufficient. (As the user noted, random nets can be probed).
      *   *Causally Active:* Stronger, but still tricky. (Causal leverage doesn't guarantee semantic content, just functional role).
      *   *Human Concept:* This is the goal, but rarely the reality. Features are often alien.
      *   *Synthesis:* The practice presupposes a **functionalist** view of representation. A state represents $X$ if it plays the role of $X$ in the system's computation *and* maps roughly enough to human $X$ to be intelligible.

  5.  **Address the Deflationary Turn:**

      *   *Deflationary View:* "Representation" is just a label for "directions in activation space that correlate with input/output patterns." No ontological commitment.
      *   *Impact on Practice:*
          *   Less hype about "finding concepts."
          *   More focus on "control vectors" or "levers."
          *   Honesty about polysemanticity and context-dependence.
          *   Shift from "What does the model believe?" to "How can we steer the model?"
      *   *Impact on Reporting:*
          *   Change language: "Probe accuracy" instead of "Representation strength."
          *   "Intervention effect" instead of "Causal role of concept."
          *   Acknowledge researcher projection.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the sharpness of the critique. It's a known philosophical rift (correlation vs. causation, semantics vs. syntax).
      *   *Section 1: The Implicit Ontology.* What are they actually assuming? It's a "Pragmatic Functionalism." They want the *utility* of causality with the *accessibility* of decoding. They assume the model is trying to compress the world in a way that overlaps with human ontology.
      *   *Section 2: Necessary vs. Ornamental.*
          *   *Necessary:* Decodability (you can't find it without it) + Causal Leverage (it has to *do* something).
          *   *Ornamental:* The specific human semantic label. The feature might be "positive sentiment + formal grammar," but we call it "positivity."
      *   *Section 3: The SAE Complication.* SAEs add sparsity. They assume the "basis of thought" is sparse. But features are still often polysemantic. This reinforces the "bookkeeping" view.
      *   *Section 4: The Deflationary Shift.* If we treat representations as instrumental:
          *   Terminology shift (Features $\rightarrow$ Control Directions).
          *   Goal shift (Truth $\rightarrow$ Steering/Safety).
          *   Epistemic humility (Admitting the map is not the territory).
      *   *Conclusion:* The field is currently in a "pre-paradigmatic" phase where they borrow semantic language for instrumental tools. A deflationary turn would mature the field.

  7.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* I need to be careful not to say causality is *everything*. Causal interventions can be brittle. A direction might be causal in one context but not another.
      *   *Nuance:* The "random network" objection is strong. It suggests decodability is cheap. So causality is the real filter. But even causality doesn't guarantee *semantic* content.
      *   *Key Insight:* The user is asking about the *philosophy of mind* implicit in ML interpretability. I should explicitly reference the "Map vs. Territory" distinction.
      *   *SAE Point:* SAEs assume a "monosemanticity prior." If features fire on grab-bags, that prior is violated. The practice *hopes* for monosemanticity but *tolerates* polysemanticity if it's sparse.

  8.  **Final Polish:** Ensure the tone is analytical, respectful of the field but critical, matching the user's sophisticated framing. (The user sounds like they know the literature well, so avoid basic definitions).

      *   *Structure:*
          1.  Diagnose the tension (The "Ontological Wobble").
