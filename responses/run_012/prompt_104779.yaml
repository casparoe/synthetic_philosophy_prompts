answer: |-
  You have put your finger on the central ontological wobble in modern mechanistic interpretability. The field oscillates between three incompatible definitions of "representation" depending on which result they are trying to defend or which critique they are trying to deflect.

  Here is an analysis of what the practice presupposes, what is strictly necessary versus ornamental, and how a deflationary turn would reshape the field.

  ### 1. The Implicit Ontology: Pragmatic Functionalism

  When interpretability researchers claim a direction is a "representation," they are implicitly relying on a hybrid view I would call **Pragmatic Functionalism**.

  This view presupposes three things simultaneously, even though they are logically distinct:
  1.  **Information Bearing:** The state contains distinguishable information about $X$ (decodability).
  2.  **Functional Role:** The state is used by downstream mechanisms to produce behavior related to $X$ (causality).
  3.  **Semantic Alignment:** The cluster of inputs/outputs associated with that state maps cleanly enough to a human concept $X$ that we can use the English label (semantics).

  The "wobble" you observe happens because these three come apart in edge cases.
  *   **When defending a probe:** They lean on (1). "The information is there."
  *   **When attacked on spurious correlations:** They lean on (2). "It's causally active."
  *   **When selling the insight:** They lean on (3). "We found the concept of 'gender'."

  The practice strictly *needs* (1) and (2) to claim the model is doing computation rather than storing noise. However, it *wants* (3) to claim the model is intelligible to humans. The tension arises because (3) is rarely true in the clean way researchers imply. SAE features firing on "grab-bags" of unrelated stuff is evidence that the model's ontology does not match ours. The model represents *predictive features*, not *human concepts*.

  ### 2. Necessary vs. "Along for the Ride"

  If we dissect the methodology, we can separate the mechanical requirements from the semantic projection.

  **Strictly Necessary:**
  *   **Decodability (with a baseline):** You must be able to distinguish the state from noise. However, as you noted, this requires a control (like a random network or a permuted label baseline) to establish that the decodability isn't trivial.
  *   **Causal Leverage:** To claim the representation is *used*, you must show that perturbing the representation perturbs the output in a predictable way. Without this, you have archaeology, not engineering. You are finding fossils, not organs.

  **Along for the Ride (The Ornamental Layer):**
  *   **Monosemanticity:** The assumption that one feature = one human concept. This is a hope, not a finding. SAEs often find features that are polysemantic (e.g., a feature that fires for "DNA sequences" AND "legal text" because both are repetitive/structured). Researchers often smooth over this to tell a cleaner story.
  *   **Human Semantic Content:** The label "sentiment" or "truthfulness" is a projection. The model represents "patterns of tokens that correlate with positive reward in RLHF," which *looks* like sentiment to us. The practice treats the human label as intrinsic to the feature, when it is actually extrinsic (assigned by the observer).
  *   **Linearity:** The assumption that concepts live in linear subspaces. This is a methodological convenience, not a proven fact about neural computation.

  ### 3. The Deflationary Turn

  If we swapped the implicit theory for a **Deflationary Instrumentalism**—where "representation" is just a label for "a direction in activation space that allows for effective steering or prediction"—the practice would change significantly.

  **What would change in the work:**
  1.  **From "Discovery" to "Construction":** Researchers would stop talking about *finding* concepts that exist latently in the model. Instead, they would talk about *constructing* control vectors that reliably steer behavior. The focus shifts from "What is the model thinking?" to "What levers can we pull?"
  2.  **Acceptance of Alien Ontologies:** Instead of forcing SAE features into English labels, reports would describe features functionally. Instead of "This is the 'fraud' feature," it would be "This feature activates on transactional language involving high-value transfers and negation, and suppressing it reduces fraud-classification outputs."
  3.  **Context-Dependent Representations:** A deflationary view acknowledges that a direction might be causal in context $A$ but inert in context $B$. Current reporting often generalizes a feature's role globally. A deflationary approach would map the *domain of validity* for every probe/intervention.
  4.  **No "Fact of the Matter":** Researchers would stop debating whether a probe *really* found the representation. They would report probe accuracy and causal effect sizes as metrics of *utility*, not *truth*.

  **What would change in reporting:**
  *   **Terminology:** "Concept" and "Representation" would be replaced by "Feature," "Direction," or "Intervention Vector."
  *   **Claims:** Claims would be conditional. "Intervening on direction $v$ shifts probability of $Y$ by $Z\%$," rather than "The model represents $Y$ in layer $L$."
  *   **Honesty about Projection:** Papers would explicitly acknowledge that the semantic label is a human approximation of a high-dimensional cluster, rather than an identity.

  ### 4. Why the Field Resists the Deflationary View

  If the deflationary view is more honest, why doesn't the field adopt it?

  1.  **Safety Narratives:** It is easier to secure funding and attention if you claim to be "finding lies" or "locating deception." "Locating vectors that correlate with deceptive-sounding outputs" is less sexy.
  2.  **Cognitive Ease:** Humans think in concepts. It is cognitively exhausting to reason about high-dimensional polysemantic features. Using human labels is a necessary compression for researchers to communicate with each other, even if it distorts the underlying reality.
  3.  **The "Realism" Hope:** There is a genuine hypothesis that as models scale, their internal ontology might *converge* to human ontology (the "convergent instrumental goals" of representation). If this is true, the current practice is prophetic. If it is false, the current practice is anthropomorphism.

  ### Summary

  The practice presupposes that **causal utility + decodability + human intelligibility** converge on the same vectors. They usually don't.

  Strictly, the work only needs **causal utility** to be useful for engineering (steering/safety) and **decodability** to be useful for diagnostics. The "human concept" layer is the ornamental part that creates the philosophical friction you identified.

  Adopting a deflationary view would mature the field from a kind of **phrenology** (mapping bumps on the skull to personality traits) to **neurology** (mapping circuits to functions, regardless of whether those functions have English names). It would reduce the hype, but it would likely increase the reliability of the resulting safety mechanisms.
