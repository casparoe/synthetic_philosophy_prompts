  - A bacterium swimming toward sugar: no.
  - A frog snapping at a little dark moving dot: YES, this one's about a bug. It gets fooled by fake dots sometimes but the snap is still about the bug.
  - A bee doing the waggle dance to tell the hive where the nectar is: yes, that's about something, it's telling the others.
