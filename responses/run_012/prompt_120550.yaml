answer: |-
  Your suspicion is correct. You and your friend are not disagreeing about the world (the linguistic data); you are disagreeing about the map (the theoretical framework). In contemporary philosophy of language, this is best diagnosed as a **metalinguistic negotiation** over the boundaries of the concept **"semantic content."**

  You have reached a reflective equilibrium on the *phenomena* (you agree on which utterances are offensive, which are permissible, and what is conveyed), but you disagree on the *ontology* of that offensiveness. Here is a precise diagnosis of the stalemate, followed by what would actually count as progress.

  ### 1. The Diagnosis: A Boundary Dispute

  Your disagreement is not about whether slurs are harmful or how they function in practice; it is about **where to draw the line between semantics and pragmatics.**

  *   **Your Friend (Semanticism/Expressivism):** She argues that the derogatory force is **lexically encoded**. For her, a theory of meaning must account for *conventional* force, not just truth conditions. If the word *itself* carries a normative constraint (a "do not use" sign attached to the lexeme), that is a semantic fact. The "residue" you mention (in quotes or reclamation) is evidence for her that the offensiveness is a stable property of the type, not the token.
  *   **You (Pragmaticism/Contextualism):** You argue that semantics is strictly about **truth-conditional contribution** (or perhaps propositional content). Since a slur and its neutral counterpart pick out the same group and contribute the same truth conditions, the difference must be pragmatic (how the content is presented) or performative (what the speaker is *doing*). For you, the "residue" is explained by deep-seated social conventions and historical baggage, not by the semantic machinery itself.

  **The Stall:** The literature stalls because both sides can accommodate the data by adjusting their definitions.
  *   When you point to **reclamation** (insiders using slurs affectionately), you say, "See? The meaning changed based on context!" She says, "No, the semantic content is still derogatory, but the speakers have overridden the norm via a special license."
  *   When she points to **embedding** (e.g., "If he is a [slur], he won't get in"), you say, "The offensiveness projects out of the conditional, proving it's semantic!" You say, "No, presuppositions and implicatures also project; that doesn't make them truth-conditional."

  You are arguing over whether "meaning" includes **use-conditions** (her view) or is restricted to **truth-conditions** (your view).

  ### 2. Is there a hidden empirical question?

  You asked if this is an empirical question about processing. **Yes, but it likely won't solve the philosophical dispute.**

  *   **Psycholinguistics:** If experiments show that slur processing incurs a different cognitive load or neural signature than neutral counterparts *even in non-derogatory contexts*, that supports your friend (the word itself triggers a response). If the load only appears when contempt is detected, that supports you (the context drives the response).
  *   **The Limit:** Even if she wins the empirical battle (e.g., "The brain reacts to the word automatically"), you can reply, "That is a fact about *association*, not *meaning*." Even if you win (e.g., "Processing depends on context"), she can reply, "That is a fact about *semantic activation*, not *pragmatic inference*."

  Empirical data constrains the theory, but it cannot dictate where you draw the semantics/pragmatics boundary. That is a theoretical choice.

  ### 3. What Would Count as Progress?

  Since you agree on the data, progress will not come from finding new examples of offensive speech. It will come from one of three avenues:

  **A. Theoretical Utility (The "Best Explanation" Test)**
  Stop asking "Which is true?" and ask "Which is more useful?"
  *   Does classifying slur content as *semantic* help us explain **logical embedding** better? (e.g., Why is "He is not a [slur]" still problematic?)
  *   Does classifying it as *pragmatic* help us explain **reclamation and variation** better?
  *   **Progress:** One of you concedes that the other's framework handles a specific class of linguistic phenomena (like negation or conditionals) with greater parsimony. Currently, **Hybrid Views** (like Luvell Anderson or Christopher Hom's work) are making progress here by suggesting slurs have *both* truth-conditional and use-conditional content.

  **B. Metalinguistic Clarity**
  You need to stop using the word "meaning" without a modifier.
  *   **Progress:** You agree to say: "The slur has the same *truth-conditional content* as the neutral term (User's win), but it has distinct *conventional expressive content* (Friend's win)."
  *   This dissolves the argument. You are arguing over whether "conventional expressive content" counts as "semantics." If you define semantics as "everything encoded in the lexicon," she wins. If you define it as "contribution to truth conditions," you win. Acknowledging this is a terminological choice ends the stalemate.

  **C. Normative Stakes**
  Sometimes these disputes persist because there are hidden ethical or legal stakes.
  *   **Progress:** Ask: "Does it matter for ethics or law whether this is semantic or pragmatic?"
  *   If the offensiveness is *semantic*, it might be harder to regulate (it's part of the proposition). If it is *pragmatic*, it might be easier to contextualize (it depends on intent). If you can identify a real-world consequence that hinges on the classification, the debate becomes substantive rather than theoretical.

  ### 4. The Possibility of No Progress

  You must accept the possibility that **no further progress is expected or required.**

  This is a classic case of **underdetermination of theory by data**. Both a Semantic Account and a Pragmatic Account can be constructed to predict exactly the same intuitions about offensiveness, truth, and permissibility.
  *   If two theories are empirically equivalent and differ only in how they carve up the label "meaning," the disagreement is **verbal**.
  *   In this scenario, the "stall" in the literature is not a failure of philosophy; it is a sign that the field has matured enough to realize there are multiple valid ways to model the same phenomenon.

  ### Recommendation for Resolution

  To end the argument productively, propose the following truce:

  1.  **Acknowledge the Data Agreement:** Explicitly state, "We agree on all the cases. We agree slurs are harmful, we agree context matters, we agree reclamation is possible."
  2.  **Locate the Disagreement:** Admit, "We are disagreeing about whether 'conventional expressive force' belongs in the box labeled *Semantics* or the box labeled *Pragmatics*."
  3.  **Adopt a Hybrid Terminology:** Agree that slurs have **dual content**. They have a truth-conditional component (matching the neutral term) and an use-conditional/expressive component (the derogation).
  4.  **Drop the "Is" Question:** Stop asking "Is the offensiveness in the word or the use?" and start asking "How does the interaction between lexical encoding and contextual use produce the harm?"

  If you do this, you will find you were never actually fighting about the slurs. You were fighting about the taxonomy of linguistics. Once you realize the taxonomy is a tool and not a truth, the fight evaporates.
