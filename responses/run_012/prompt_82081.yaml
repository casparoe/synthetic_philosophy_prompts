answer: |-
  1. Otanes conceives political equality as isonomia, where no citizen stands above the law, requiring institutions that systematically prevent the accumulation of personal power.
  2. Selection by lot operationalizes this by randomizing authority, ensuring that office is a shared burden rather than a prize that elevates one citizen above others.
  3. Mandatory accountability reinforces this leveling by treating magistrates as temporary servants who must justify their actions to those they ostensibly rule.
  4. Referring deliberation to the assembly shifts authority from private wisdom to public law, ensuring decisions reflect a collective will rather than a single ruler's arbitrary whim.
  5. Consequently, the contrast with monarchy hinges on the source of authority rather than optional practices: the monarch subjects others to his will, while democracy subjects all citizens equally to impersonal procedures.
