      But when nine justices agree? When there is no dissent? That is a different signal. It says, "This is not a difference of opinion. This is a violation so clear that none of us can abide it." In that case, the barrier rises. You need a supermajority to override us. Why? Because when the Court is unanimous, we are claiming a stronger authority. We are moving closer to the last word, because the clarity of our conviction demands a broader consensus to overturn.

      This is not the death of judicial review. We still strike down laws. We still guard the Constitution. But we no longer pretend that our word is final simply because we wear black robes. We acknowledge that our authority scales with our unity.

      I know the first test of this clause is pending. A law I voted to strike down is now before the legislature for potential re-enactment. I watch this with mixed emotions. Part of me wants to see if they engage seriously with our reasons, as the Act requires. Part of me worries they will simply count votes.

      But that is the risk. Democracy is risky. Trusting judges is risky. Trusting the people is risky.

      To my successor: You take the gavel at a moment of transition. You will be tempted to cling to the old authority. You will be tempted to treat every decision as the final verdict. Do not.

      Your job is not to have the last word. Your job is to ensure the Court has a meaningful say. Sometimes that means striking down a law with such clarity that the legislature cannot easily return to it. Sometimes it means striking it down narrowly, knowing the people may come back and say, "We hear you, but we disagree."

      If we do our job well, we force the legislature to think. If they do their job well, they force us to listen.

      To the family: I did spend thirty years telling people what to do. But I hope, in the end, I also taught them how to argue about why.

      To the students: The theory is important. But the practice is messy. Don't look for clean lines where there are none.

      To the legislators: You have the power to re-enact. But remember, the Act asks you to engage with our reasons, not just override our results. If you treat this as a mere vote count, you degrade the office just as much as if we claimed absolute tyranny.

      We are not rivals. We are partners in a difficult project. The project is self-government. And self-government requires that no single branch owns the truth.

      I am leaving this Court not because I know the answers, but because I know the questions belong to all of us.

      Thank you.

