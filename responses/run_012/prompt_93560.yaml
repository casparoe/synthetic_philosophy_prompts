      So, where does that leave us? It leaves us with the Reform Act. It leaves us with this new clause.

      People call this a "dialogue." I prefer to think of it as a distinction between having a say and having the last word.

      Under the old system, every decision was a stop sign. Under the new system, the weight of our stop sign depends on how united we are.

