answer: |-
  Here are three possible readings of the passage to help structure your response:

  1.  **Organic Utilitarianism:** The part/whole analogy is purely aggregative. The community's survival literally outweighs individual life. Killing is justified solely by the net benefit to the "body," making the individual instrumental.
  2.  **Juridical Authority:** The analogy establishes *who* may kill, not just why. Only the ruler (representing the "whole") can excise a "part." Private killing is murder; public killing is medicine.
  3.  **Proto-Double Effect:** The intended end is "health," not "death." Death is the mechanism of removal. The Cockle reply limits this when the side effects (killing the good) overwhelm the intended good.

  **Best Fit:**
  Reading 3, qualified by Reading 2, fits best. Aquinas is not a utilitarian; the "part/whole" metaphor isn't just about weight, but about *order*. The text says the individual is dangerous "on account of some sin." This suggests the person has voluntarily severed themselves from the rational order of the community, becoming "decayed." They aren't being *used* arbitrarily; they are being removed because their own actions made them infectious. The moral work is done by the *sin* plus the *common good*, not just the aggregate welfare.

  The Cockle reply supports this. It isn't merely a prudential hedge ("we might miss"); it's a boundary condition on the "health of the whole." If uprooting the wicked kills the good, the "body" is no longer healthy. Thus, the common good isn't served by destroying the innocent parts. This functions as a side-constraint: you cannot intend the destruction of the good to save the whole.

  **Trolley Application:**
  Aquinas would likely distinguish the trolley cases based on intention, not just outcomes.
  *   **Diverting:** If the intention is to save the five, and the one's death is a foreseen side-effect (like the Cockle problem where the good *might* be killed), it might be permissible under specific authority.
  *   **Pushing:** This looks like making the fat man the "means" of safety (the diseased limb). If you intend his death to stop the trolley, you violate the order of justice. You are treating him as a tool, not a part of the whole to be preserved.

  **What to Check:**
  To settle the "authority" question, check **Article 3** of the same Question (q. 64). The snippet you have justifies the *logic* of killing, but Aquinas usually restricts the *agency* to public authority. Also, look at **q. 64, a. 7** (self-defense). That is where Aquinas explicitly form Double Effect (intending self-preservation, foreseeing death). Your passage is about execution; a. 7 is about private defense. Confusing them is a common student error.

  **Verdict:** The part/whole analogy justifies the *end* (common good), but the Cockle reply and the condition of "sin" prevent it from collapsing into pure consequentialism. The individual isn't merely used; they are removed due to their own corruption, provided the innocent aren't destroyed in the process.
