answer: |-
  Good morning.

  Stand still for a moment and feel the ground beneath you. It is solid. It is quiet. And for the names on this stone, that was the thing they were denied.

  I am a history teacher. That is why I am standing here. When the committee asked me to speak, I said yes, because I thought I owed it to the subject. But the more I prepared, the more I realised I don't owe history anything. History is what happened. We are what happens next.

  I know what people expect me to say. It is the centenary. There are questions hanging in the air like the breath we can see this morning. Who started this? Who was to blame? The British Legion secretary asked me to tell it straight about Germany. Our friends from Bavaria, who have travelled far to stand with us, know that their own grandparents were told they were solely guilty, and that this truth poisoned a generation. I have a colleague standing at the back who thinks this ceremony is just nostalgia, a way of polishing up empire while the world burns elsewhere. And I have forty students standing in the front who are cold, and who want to know why we are doing this at all.

  Here is the straight truth, as best as I can tell it.

  If you ask a historian who caused the war, you will get an argument. Some say one nation pushed the dominoes. Others say everyone sleepwalked, eyes open, into the dark. There are treaties signed afterwards that declared one side guilty. There are historians who say that was a lie. I have read them all. But standing here, in front of this stone, I have come to think that asking "who caused it" is the wrong question for a memorial.

  There is a difference between who caused a fire, who is guilty of arson, and who holds the hose afterwards.

  Cause is about decisions made in rooms far away, by men in uniforms we do not wear, signing papers we cannot see. Guilt is a legal thing. It belongs in courts. It belongs to the specific men who gave the orders. But Responsibility? Responsibility is ours. It belongs to the living.

  My grandfather fought at Passchendaele. He came home. He lived to be old. He never spoke about who started the war. For a long time, I thought this was because he didn't know. Now I think it was because he knew it didn't matter. He knew what mud felt like. He knew what it was to lose a friend beside you. He knew that once the machine starts, it does not care about treaties or blame. It only cares about flesh.

  He didn't speak about blame because he was too busy carrying the weight of survival. That is the weight we are here to share today.

  I have a friend in Bavaria, a history teacher like me. We have argued about this war for twenty years. He has a rule for how we talk about it, and I think it is the only rule that works for us today. He says: "You may not blame a whole people, and you may not let a whole people off."

  It is a hard rule. It means we cannot point at Germany and say "you did this." Nations are not people. They are ideas. A nation cannot pull a trigger. But it also means we cannot say "everyone did it" and walk away clean. Decisions were made. Choices were taken. Leaders led. People followed. Some cheered. Some objected. Most just waited.

  To blame a whole people is a lie. To let a whole people off is a danger.

  So why are we here? If we are not here to judge the past, what are we doing?

  We are here to accept the responsibility of the present.

  To the students: I know you are cold. I know this looks like a ritual. But look at the dates on the stone. Look at the ages. Many of the boys listed here were not much older than you. They did not choose the world they were born into. They were handed a conflict they did not make. Your responsibility is not to feel guilty for what they did. It is to understand what happens when leaders stop listening, when pride becomes more important than peace, and when young people are told that dying for a flag is the only way to prove you live.

  To my colleague at the back: You are right to be wary. Memory can be used to hide things. It can be used to make us feel good about ourselves while we ignore trouble elsewhere. If this ceremony is just about feeling proud to be British, then it is worthless. But if it is about recognising that the capacity for this destruction lives in all of us, in all nations, then it is necessary.

  To our friends from Bavaria: Thank you for coming. The fact that you are here, standing beside us, is the only answer that matters. The war ended a century ago. The peace is made by us, today, by shaking hands across the ground where shells once fell.

  We cannot change the cause. We cannot assign the guilt. Those men are dead. The courts are closed.

  But we can take the responsibility.

  Responsibility means remembering that words have consequences. It means knowing that "us and them" is the most dangerous sentence in any language. It means looking at our own governments, our own neighbours, and ourselves, and asking if we are making the world safer, or just louder.

  My grandfather didn't talk about blame. He talked about the men who didn't come back. He talked about keeping the promise to them. The promise was not that we would win the next war. The promise was that we would try, harder than anything else, to stop the next war from starting.

  So, in a moment, we will lay wreaths. When you walk up to this stone, do not think about who pushed the button in 1914. Think about who holds the button now.

  We are not here to settle a score. We are here to take up a burden. The burden of watching. The burden of speaking up. The burden of remembering that the names on this stone were not statistics. They were people who stopped breathing so that we could start.

  We cannot bring them back. We cannot fix their world. But we are responsible for ours.

  Let us lay these flowers not as payment for guilt, but as a promise of responsibility.

  Thank you.
