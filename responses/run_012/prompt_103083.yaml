answer: |-
  # Lesson Plan: The Hilbert Hotel Audit
  **Topic:** Potential vs. Actual Infinity  
  **Time:** 75 Minutes  
  **Class Size:** 16 Students  
  **Goal:** Embodied understanding of the conflict between completing an infinite task (Finitism) and defining an infinite state (Cantor).

  ---

  ## 1. Materials & Setup
  *   **Room:** Clear space for a line of chairs (at least 10) + open floor.
  *   **Props:**
      *   16 "Room Number" badges (1–16).
      *   16 "Guest Name" tags.
      *   2 Clipboards with "Audit Logs" (blank paper).
      *   1 "Manager's Decree" whiteboard or large notepad.
      *   1 Long roll of butcher paper (The "Infinite Scroll").
      *   A whistle or bell (for the Auditor to freeze action).
  *   **Arrangement:** Chairs numbered 1–10 in a row. The "Infinite Scroll" extends from Chair 10 into the hallway or off the table, labeled "11, 12, 13... ∞".

  ## 2. Roles (16 Students)
  *   **The Cantorian Manager (1):** Confident, speaks in rules. Their word defines reality.
  *   **The Finitist Auditors (2):** Skeptical, procedural. They hold the power of "Sign-off." They represent the constraint of time and sequence.
  *   **The Guests (10):** Stand/sit in the numbered chairs. They hold the Room Number badges. They must follow instructions but can speak up if they are "homeless."
  *   **The Staff (3):** Runners who physically move name tags or guests. They represent the *process* of moving.

  *(Note: If you prefer to teach, you take the Manager role to ensure the math is correct, but assigning it to a student increases engagement.)*

  ## 3. Timeline & Flow

  ### 0:00–0:05: Introduction & Role Assignment
  *   No lecture. Hand out roles.
  *   **Instruction to All:** "You are in the Hilbert Hotel. It is full. Every room $n$ has a guest. The Infinite Scroll shows the rooms continue forever."
  *   **Instruction to Auditors:** "Your job is to ensure no rule is executed unless it can be *completed*. If a task has no last step, you cannot sign off. You have the whistle."
  *   **Instruction to Manager:** "Your job is to accommodate new guests or reorganize using mathematical rules. You believe the hotel is a completed object."

  ### 0:05–0:20: Round 1 – The Finite Warm-Up
  *   **Scenario:** A bus with 5 new guests arrives.
  *   **Manager's Decree:** "Move every current guest from room $n$ to room $n+5$."
  *   **Action:** Staff physically move Guests 1–10 down the line.
  *   **Auditor Task:** Count the moves. Verify everyone has a room. Sign off.
  *   **Purpose:** Establishes the baseline. Finite moves are easy. There is a first mover and a last mover.

  ### 0:20–0:40: Round 2 – The Infinite Bus (The Core Conflict)
  *   **Scenario:** An *infinite* bus arrives (countably infinite new guests).
  *   **Manager's Decree:** "To make space, move every current guest from room $n$ to room $2n$." (This frees up all odd rooms).
  *   **Action:**
      *   Manager announces the rule.
      *   Staff attempt to execute. Guest 1 goes to 2, Guest 2 goes to 4...
      *   **The Friction:** Guest 10 needs to go to 20. Room 20 is on the "Infinite Scroll" (off-screen).
      *   **Auditor Intervention:** The Auditor blows the whistle.
      *   **Auditor Question:** "Who moves last?"
      *   **Manager Answer:** "No one. It's a rule. They are all in their new rooms."
      *   **Auditor Rebuttal:** "If no one moves last, the moving process never ends. If the process never ends, I cannot verify the odd rooms are empty. I cannot sign off."
      *   **Guest Complaint:** "I'm standing in the aisle waiting for Room 20 to be cleared, but the person in Room 20 is waiting for Room 40..."
  *   **Outcome:** The Manager declares the odd rooms open. The Auditor refuses to let new guests in because the "clearing" was never *finished*.

  ### 0:40–0:55: Round 3 – The Checkout (Subtraction)
  *   **Scenario:** The hotel is "full" (per Manager). Guest in Room 1 checks out.
  *   **Manager's Decree:** "The hotel is still full. Move guest $n$ to $n-1$ to fill the gap."
  *   **Auditor Challenge:** "You started with a completed set. You removed one. Now you have less. How can it be the same amount?"
  *   **Manager:** "Because I can map the remainder to the original set one-to-one."
  *   **Auditor:** "Show me the mapping finish. When do you stop shifting people down?"
  *   **Physical constraint:** The Staff run back and forth. The Auditor times them. "It's been 5 minutes. Are we done?" Manager: "Yes." Auditor: "But Guest 1,000,000 hasn't moved yet."

  ### 0:55–1:15: Debrief & Mapping
  *   Sit in a circle. Drop roles. Discuss what happened.

  ---

  ## 4. The Debrief: Mapping Experience to Concepts
  *Do not lecture. Ask questions based on their frustration.*

  1.  **The "Last Step" Problem (Potential Infinity):**
      *   *Ask Auditors:* "Why couldn't you sign off?"
      *   *Concept:* **Potential Infinity.** For the finitist, infinity is a process that approaches a limit but never reaches it. If there is no last step, the task is incomplete. An incomplete task cannot yield a result.
  2.  **The "Rule as Reality" (Actual Infinity):**
      *   *Ask Manager:* "Why were you frustrated?"
      *   *Concept:* **Actual Infinity.** For Cantor, the set of rooms exists *all at once*. The move isn't a process in time; it's a logical re-mapping. The destination is defined by the function $f(n) = 2n$, not by walking there.
  3.  **Bijections & Proper Subsets:**
      *   *Ask Guests:* "In Round 2, were there fewer of you after you moved to even rooms?"
      *   *Concept:* **Dedekind Infinite.** A set is infinite if it can be put in one-to-one correspondence with a *proper subset* of itself (Evens $\subset$ Naturals, but $|\text{Evens}| = |\text{Naturals}|$). This feels wrong physically (some rooms looked empty), but logically holds.
  4.  **The Finitist Refusal:**
      *   *Ask Class:* "Was the Auditor just being difficult?"
      *   *Concept:* The finitist refuses to treat an infinite collection as a **completed object**. To them, "The set of all natural numbers" is a contradiction because you can't collect them all.

  ---

  ## 5. Predictable Failures & Fixes

  | Predictable Failure | Why it happens | How to Handle It |
  | :--- | :--- | :--- |
  | **The "Just Pretend" Trap** | Students get bored of the "infinite scroll" prop and ignore rooms 11+. | **Fix:** The Auditor must enforce the prop. "I need to see Room 20 cleared before I let a new guest in." Force the Staff to run toward the scroll. |
  | **Manager Wins by Fiat** | Manager says "It's math, trust me," and Auditors feel silenced. | **Fix:** Empower the Auditor. Remind the class: "In this game, the Auditor holds the keys. If they don't sign, the new guests sleep in the lobby." |
  | **Confusion on Time** | Students think the move happens instantly. | **Fix:** Force the Staff to physically move the name tags one by one. Make the *process* visible and slow. This validates the Auditor's concern about time. |
  | **Auditor Looks Pedantic** | Class thinks the Auditor just doesn't understand functions. | **Fix:** In debrief, validate the Auditor. "In computer science and physics, infinite loops are bugs. The Auditor is debugging the system." |

  ---

  ## 6. Limitations: What the Game Cannot Reproduce
  Be honest with the students about where the simulation breaks down.

  1.  **Time vs. Logic:** The game forces the "move" to happen in physical time (seconds/minutes). Cantorian infinity is atemporal. The game makes the Cantorian look like they are ignoring physics, when they are actually operating in a purely logical space.
  2.  **The "Strawman" Finitist:** Real mathematical finitists (like Intuitionists) aren't just worried about *time*; they are worried about *constructibility*. They don't believe an object exists unless you can construct it. The game reduces this to "I can't finish the task in time," which is a practical limitation, not necessarily a philosophical one.
  3.  **Cardinality:** With only 16 students, they can't *feel* the size of $\aleph_0$. They have to imagine it. The "shock" of infinity is dampened by the small group size.

  ---

  ## 7. Revision Criteria: When to Redesign
  You should revise this design if:

  1.  **The Finitist becomes a Caricature:** If the Auditors are laughed at as "people who can't count," you have failed. The Finitist position must feel *robust*.
      *   *Sign:* Students say "Just accept the rule."
      *   *Fix:* Give the Auditors a "Safety Protocol" card that says "Infinite processes risk system collapse." Give their skepticism institutional weight.
  2.  **The Cantorian Cheats:** If the Manager wins simply because "The Teacher said so," it's authoritarian, not mathematical.
      *   *Sign:* The Manager cannot explain *why* the odd rooms are free without saying "Because infinity."
      *   *Fix:* Require the Manager to draw the mapping on the board ($1\to2, 2\to4$) to prove no two guests share a room. The victory must be logical, not declarative.
  3.  **No Cognitive Dissonance:** If the students leave feeling "Oh, infinity is just big numbers," the tension was too low.
      *   *Sign:* Everyone agrees easily in Round 2.
      *   *Fix:* Increase the pressure. Have the "New Guests" (played by empty chairs) start complaining loudly. Force the Manager and Auditor to negotiate the reality of the hotel.

  ## 8. Closing Statement for the Teacher
  "Today you felt the friction. The Manager felt the power of the *definition*. The Auditor felt the impossibility of the *execution*. Modern mathematics mostly lives in the Manager's world (Actual Infinity). But computer science, physics, and constructivist logic often live in the Auditor's world (Potential Infinity). Both are right, depending on what game you are playing."
