      *Refining the "Exclusionary" choice:* Actually, **Totals vs. Averages (3)** is the specific *axis* of failure, but **Endogenous Populations (2)** is the *condition* that makes (3) relevant. I will argue that **Endogenous Populations (2)** is the primary filter because it renders standard contractualist or rights-based approaches (which rely on identifiable victims) incoherent.

