      *   *No scorecard of named positions?* Yes (avoid saying "Utilitarianism fails," say "Total-maximizing views fail").
      *   *Treat input as raw material?* Yes, I will refine them.

  7.  **Final Polish:**
      *   Make sure the distinction between "prejudice" and "requirement" is clear. (e.g., Non-naturalism is a normative commitment, but necessary for the specific question of *habitat destruction* evaluation in a secular/welfarist framework).
      *   Ensure the "Impossible Trinity" is clearly explained.
