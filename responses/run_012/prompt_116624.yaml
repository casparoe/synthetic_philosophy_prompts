      *   **Diagnosis Point 1: The Ontological vs. Normative Split.** (Dana: What makes a group an agent? User: What makes a decision fair?)
      *   **Diagnosis Point 2: The "Package" Illusion.** Show concretely why Dana's move doesn't fully dissolve the problem (Condorcet cycles over packages). This is crucial to show the User their friend might be oversimplifying.
