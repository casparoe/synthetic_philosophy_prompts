      *   *Dana's Point:* Why vote on elements separately? Vote on the *state of the world* or the *case theory*. Voter 1 supports Theory A, Voter 2 supports Theory B, Voter 3 supports Theory C. Pick the theory with the most support (or use a ranking). If you treat the *package* as the unit, consistency is preserved by definition.

