      *   *Heritability ($h^2$):* $Var(G_{additive}) / Var(Y)$. In ML terms: Feature importance of $G$ (additive component only) relative to total variance of $Y$ on the specific test set distribution.
      *   *Narrow Sense:* Additive only. Like a linear model's $R^2$ contribution vs. a deep net's total $R^2$.
