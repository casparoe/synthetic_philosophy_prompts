      *   *Suspicion 3 (Reference Point):* Shapley needs a baseline (e.g., mean prediction). Genetics uses population mean. This seems aligned. However, counterfactuals in genetics (changing genotype) are impossible for an individual. ML often assumes feature independence for interventions. Genetics knows $G$ is fixed at conception. The attribution is observational, not interventional on the individual.
