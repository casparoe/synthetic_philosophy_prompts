answer: |-
  # The Dinner Party Decision Tree

  Tape this inside your laptop. When a character speaks, trace their line down the branches. If they skip a fork, note it—that's where the subtext is hiding.

  **Node 1:** "When you look at the ultrasound, what do you see there?"
  *   **A Child Like Us** (Go to Node 2)
  *   **Something Else** (Go to Node 5)

  ---

  ### Branch A: A Child Like Us (Full Personhood)

  **Node 2:** "If you woke up wired to a sick stranger to keep them alive, could you unplug yourself?"
  *   **Yes, I'd Unplug** (Body Autonomy Trumps Life → Go to Node 3)
  *   **No, I'd Stay Plugged** (Life Trumps Body Autonomy → Go to Node 4)

  **Node 3:** "If you took two kinds of birth control and still got pregnant, is that just bad luck or did you assume the risk?"
  *   **Just Bad Luck** → **Leaf 1**
  *   **Assumed the Risk** → **Leaf 2**

  **Node 4:** "If you promised your sister you'd carry this baby, could you change your mind at twenty weeks?"
  *   **Yes, She Can Change Her Mind** → **Leaf 3**
  *   **No, A Promise Is A Promise** → **Leaf 4**

  ---

  ### Branch B: Something Else (Partial/No Personhood)

  **Node 5:** "Is the wrongness about depriving it of a future, or about what doing this makes you?"
  *   **Depriving A Future** (Go to Node 6)
  *   **What It Makes You** (Go to Node 7)

  **Node 6:** "Is robbing that future always a crime, or just a tragedy?"
  *   **Always A Crime** → **Leaf 5**
  *   **Just A Tragedy** → **Leaf 6**

  **Node 7:** "Is the act itself tainted, or just the heart of the person doing it?"
  *   **The Act Is Tainted** → **Leaf 7**
  *   **Just The Heart** (Go to Node 8)

  **Node 8:** "Does it matter if anyone ever finds out?"
  *   **Yes, Morality Is Social** → **Leaf 8**
  *   **No, Morality Is Internal** → **Leaf 9**

  ---

  ### The Leaves (Positions & Awkwardness)

  **Leaf 1: The One Where Body Is Absolute**
  *   **Position:** It's a person, but you never owe it your body, even if you took risks.
  *   **The Awkward Thing To Swallow:** You have to tell the nineteen-year-old that her responsibility for having sex doesn't create any responsibility for the life that resulted from it.

  **Leaf 2: The One Where Responsibility Limits Rights**
  *   **Position:** It's a person, you can usually unplug, but not if you gambled and lost.
  *   **The Awkward Thing To Swallow:** You have to explain why the right to your own body disappears specifically when you were careful enough to try to prevent pregnancy.

  **Leaf 3: The One Where Contracts Break Bodies**
  *   **Position:** It's a person with a right to your body, unless you signed a paper first.
  *   **The Awkward Thing To Swallow:** **INCOHERENT.** If the fetus has a right to life in Node 2, a contract shouldn't override it. This view usually collapses into Leaf 1 or Leaf 4 under pressure. It's a position people hold emotionally but can't defend logically.

  **Leaf 4: The One Where Life Is Absolute**
  *   **Position:** It's a person, it has a right to your body, and no exception changes that.
  *   **The Awkward Thing To Swallow:** You have to tell the woman carrying for her sister that she is morally forbidden from stopping, even if keeping the promise destroys her relationship with her sister or her own health.

  **Leaf 5: The One Where Potential Is Personhood**
  *   **Position:** It's not a person yet, but killing it is murder because of what it would become.
  *   **The Awkward Thing To Swallow:** You have to treat a cluster of cells exactly like a grown man, which makes every miscarriage a funeral and every contraception method a potential crime scene.

  **Leaf 6: The One Where It's A Shame, Not A Sin**
  *   **Position:** Ending the potential future is sad, but not something the law should touch.
  *   **The Awkward Thing To Swallow:** You have to convince the nurse that something can be deeply morally wrong without being anyone else's business to stop.

  **Leaf 7: The One Where The Act Is Dirty**
  *   **Position:** It's not about personhood; the act of abortion itself corrupts the world.
  *   **The Awkward Thing To Swallow:** You have to explain what metaphysical stain is left on the world if no person was actually harmed in the process. It sounds like magic.

  **Leaf 8: The One Where Virtue Is Public**
  *   **Position:** It's about your character, and character is shown in how people see you.
  *   **The Awkward Thing To Swallow:** You have to admit that a secret abortion is morally fine, which turns morality into a reputation management game.

  **Leaf 9: The One Where Virtue Is Private**
  *   **Position:** It's about your character, and only you and God know if you failed.
  *   **The Awkward Thing To Swallow:** You can never judge anyone else, which makes running a crisis pregnancy center (like the woman in her sixties) logically impossible unless you frame it as "helping them be virtuous" rather than "stopping a wrong."

  ---

  ### How To Use This For Dialogue

  1.  **Track the Skips:** If the Attorney argues Node 3 (Responsibility) but refuses to answer Node 1 (Personhood), he's trying to win on technicalities because he knows the personhood ground is shaky.
  2.  **Find the Conflict:** The Nurse (Leaf 9) and the Crisis Center Woman (likely Leaf 4 or 5) will talk past each other. One is talking about *souls*, the other about *laws*. They need to realize they are on different branches.
  3.  **Spot the Incoherence:** If the Uncle (Attorney) tries to argue Leaf 3, let the nineteen-year-old catch him. "So if I signed a paper, my body belongs to the state? But if I didn't, it doesn't?" That's where the scene breathes.
  4.  **The Empty Spot:** Notice there is no leaf for "It's a person, has no right to my body, but I must carry it if I promised." That's Leaf 3's instability. Use that tension.
