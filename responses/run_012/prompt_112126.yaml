  My roommate trades crypto and every time I offer him something that looks like a free lunch he says "a bird in the hand is worth two in the bush". Latest one: I offered him a 50/50 coin flip where he wins $150 on heads and loses $100 on tails — clearly a good deal for him — and he said no thanks, he'd rather keep the hundred, bird in hand. I told him thats just being scared of variance, he said thats how you stay in the game.

