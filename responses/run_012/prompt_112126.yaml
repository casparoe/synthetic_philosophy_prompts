answer: |-
  This is a classic collision between three different frameworks for decision-making: **Expected Value (EV)**, **Expected Utility**, and **Geometric Growth (Kelly)**. Your roommate isn't just quoting a proverb; he's implicitly citing capital preservation theory, even if he's using folk wisdom to do it.

  Here is the breakdown of what the proverb claims, the math behind your confusion, and the verdict on the bet.

  ### 1. Deconstructing the Proverb
  "A bird in the hand is worth two in the bush" is not a single mathematical claim. It is a heuristic that bundles together four distinct arguments. Here is what they are, whether they are true, and how they apply to your $150/$100 coin flip.

  | Interpretation | The Claim | Is it True? | Implication for Your Flip |
  | :--- | :--- | :--- | :--- |
  | **1. The Trivial (Transaction Costs)** | Catching bush birds costs effort/time. The hand bird is free. | **True.** | **Irrelevant.** A coin flip has zero effort cost. This doesn't justify refusing the bet. |
  | **2. The Risk-Averse (Utility)** | Money has diminishing marginal utility. Losing \$100 hurts more than winning \$150 helps. | **True** for most humans. | **Valid.** If \$100 is meaningful to him (rent, food, capital base), the *utility* loss outweighs the *dollar* gain. |
  | **3. The Survival (Ruin)** | If you risk the "hand bird" repeatedly, you eventually lose it all and can't hunt anymore. | **True.** | **Valid.** This is his "stay in the game" comment. He is optimizing for longevity, not single-bet profit. |
  | **4. The Literal (EV)** | 1 Certain Unit > 2 Uncertain Units (regardless of probability). | **False.** | **Invalid.** If the bush birds have a 99% catch rate, 2 in the bush > 1 in the hand. Blind certainty worship is irrational. |

  **The "Worth Two" Question:**
  Does it mean $1 \text{ Certain} = 2 \text{ Uncertain}$? **No.** It is an inequality, not an equation. It means $1 \text{ Certain} > P \times 2 \text{ Uncertain}$. The "two" is metaphorical for "more." It claims that the *certainty premium* is high enough to discount the uncertain upside significantly.

  ### 2. The Kelly/Log Utility Mystery
  You asked: *"Why maximize the log of money?... how can money shrink over time even though every single bet has positive expected value?"*

  This is the most critical part of your confusion. It comes down to the difference between **Arithmetic Mean** (what you are calculating) and **Geometric Mean** (what compound growth follows).

  **The Arithmetic Lie:**
  Your bet has positive Arithmetic Expected Value:
  $$0.5 \times (+150) + 0.5 \times (-100) = +\$25$$
  If you could play this bet once, walk away, and never play again, the Arithmetic Mean is the truth. You should take it.

  **The Geometric Truth:**
  If you play this bet *repeatedly* and reinvest your winnings (compounding), the order of operations matters. Gains and losses multiply, they don't add.
  *   Start with \$100.
  *   **Heads:** You gain 150% on your wager? No, let's look at it as a fraction of bankroll to see the Kelly effect.
  *   Imagine you bet 100% of your bankroll on a simpler flip: Win 60%, Lose 40% (Positive EV).
  *   Sequence: Win, then Lose.
  *   $\$100 \times 1.6 = \$160$.
  *   $\$160 \times 0.6 = \$96$.
  *   **Result:** You lost money, even though the EV of each bet was positive.

  **Why Log?**
  Wealth compounds multiplicatively. To turn multiplication into addition (which allows for averaging), you must use logarithms.
  *   $\text{Log}(\text{Wealth}_{\text{final}}) = \text{Log}(\text{Wealth}_{\text{start}}) + \sum \text{Log}(\text{Returns})$
  *   Maximizing the **Expected Log of Wealth** is mathematically identical to maximizing the **Long-Term Geometric Growth Rate**.

  **Why does money shrink past "Double Kelly"?**
  If you bet too large a fraction of your bankroll (even on +EV bets), the volatility drag (variance) overwhelms the edge. The losses take a bigger percentage chunk out of your capital than the wins can recover.
  *   A 50% loss requires a 100% gain to break even.
  *   If you bet too big, the "depth" of the losing troughs prevents you from climbing out, even if the average slope is upward.
  *   **Your Calculation:** You are correct. For a 50/50 bet winning 1.5x and losing 1.0x, the Kelly fraction is $\approx 16.6\%$. If you bet more than $\approx 33\%$ (2x Kelly), your expected *growth rate* becomes negative. You will go broke over time despite having a positive edge on every individual flip.

  ### 3. What Your Roommate Actually Means
  Your roommate is a crypto trader. He is not looking at this as a **One-Off Decision**; he is looking at it as a **Sequence Decision**.

  When he says, "That's how you stay in the game," he is invoking **Interpretation #3 (Survival)**.
  1.  **Capital is Ammo:** In trading, your bankroll is your inventory. Losing \$100 isn't just losing \$100; it's reducing your ability to take the *next* opportunity.
  2.  **Risk of Ruin:** If he makes a habit of taking "good deals" that require risking 5-10% of his liquid capital on a coin flip, variance will eventually wipe him out.
  3.  **Asymmetric Utility:** For a trader, staying solvent is binary. If you hit zero, you can't trade. The utility of zero is negative infinity. Therefore, avoiding any risk that meaningfully increases the probability of zero is rational, even if EV is positive.

  **He is not saying the bet is bad.** He is saying **the bet size is too big relative to his risk framework.** He is treating the \$100 not as "found money" but as "working capital."

  ### 4. Which Reading is "Right"?
  Neither of you is wrong; you are optimizing for different time horizons.

  *   **You are right if:** This is a one-time bet, the \$100 is disposable income (money you would otherwise spend on dinner), and you never plan to bet with this person again. In a vacuum, refusing +\$25 EV is irrational for a risk-neutral agent.
  *   **He is right if:** This is part of a broader strategy, the \$100 represents a non-trivial fraction of his liquid net worth, or he believes accepting "free lunch" bets from roommates sets a precedent that encourages sloppy risk management.

  **The "Right" Financial Theory:**
  In professional finance and gambling, **he is more right.**
  Expected Value is for the one-off. Geometric Growth (Kelly) is for the lifetime. Since we all live lifetimes, not one-offs, optimizing for Geometric Growth (survival + compounding) is the superior strategy. Refusing a +EV bet because it violates your risk sizing rules is a hallmark of professional discipline.

  ### 5. Would I Take The Flip?
  If I were a human with a bankroll:

  **If it's a One-Off:** **Yes, I would take it.**
  The edge is massive (+25% ROI on risk). The risk of ruin on a single flip is zero (I can't go negative). For a single event, Expected Value dominates.

  **If it's Repeated (100 times):** **Yes, but I would negotiate the stake.**
  I would not bet a fixed \$100 every time. I would demand to bet a **fraction of my bankroll** (e.g., 10%).
  *   If I bet 100% of my bankroll each time: I will eventually hit tails and go to zero. **Do not take the flip.**
  *   If I bet 10% of my bankroll each time: I capture the +EV edge while keeping volatility drag low. **Take the flip.**

  **The Verdict on Your Roommate:**
  He is using a proverb to enforce a **Kelly-adjacent risk limit**. He is telling you that the "cost" of the variance (the stress, the potential drawdown, the precedent) exceeds the \$25 expected profit.

  **Advice:** Don't try to convince him he's wrong about the math. He knows the EV is positive. He's telling you that **preservation of capital is more valuable than accumulation of marginal profit.** In crypto, that mindset is the only reason anyone survives longer than a year. Respect the "bird in the hand."
