  So: what is that proverb actually claiming? Break it into the seperate precise things it could mean — the ones that are basically trivial, the ones that are real claims about risk, the ones about repeated bets over a lifetime, the ones that are just false — and say for each whether it's true and what it would imply for my coin flip, as a one-off and if we ran it a hundred times. Also, does "worth two" mean the sure bird is worth exactly as much as the two uncertain ones, or is that a different claim? Please don't just hand me the menu and leave it — tell me which reading my roommate actually means, which one is the right one, and whether you'd take the flip.
