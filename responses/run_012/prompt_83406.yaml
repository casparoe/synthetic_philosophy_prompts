answer: |-
  # Fracturing the Epistemic Objection: A Taxonomy of Consequentialist Cluelessness

  ## I. Introduction: The Problem of the Infinite Horizon

  The central demand of consequentialist ethics is deceptively simple: an agent ought to choose the act that produces the best overall state of affairs. This imperative relies on a comparison of outcomes. To know which act is best, one must know, or at least have a justified belief about, the consequences of the available options. However, the causal fabric of the world is dense and far-reaching. A single action sends ripples through time and space that extend indefinitely. We save a life today, and that person goes on to have children, who have children, who perhaps invent a technology that saves millions or starts a war that kills billions. We donate to a charity, and the funds are invested, spent, or misappropriated in ways that cascade through the economy for decades.

  This feature of the world gives rise to what is commonly known as the cluelessness objection. The objection posits that because the remote consequences of our actions are unknowable, and because those remote consequences could theoretically outweigh the immediate ones, the consequentialist calculation is impossible. If we cannot sum the value of the future because we cannot see the future, then the directive to "maximize the good" is action-guiding in name only. It collapses into paralysis or arbitrary guesswork.

  For the consequentialist, this is an existential threat. If the theory cannot tell an agent what to do in the present because of uncertainty about the future, it fails a basic functional test of a normative ethical system. The standard responses to this objection generally fall into two camps. The first camp bites the bullet, accepting that we must do our best to estimate the infinite future, often relying on probabilistic models to tame the uncertainty. The second camp retreats, narrowing the scope of what counts as a relevant consequence, perhaps restricting moral evaluation to the foreseeable future or to the intended results of an action.

  However, a persistent difficulty in this debate is that the term "cluelessness" is used to describe a wide variety of epistemic situations that may not share the same structural properties. When a critic says we are "clueless" about the future, they might mean that the noise of the future is too complex to model. Alternatively, they might mean that the distribution of possible outcomes is so skewed that a tiny probability of an extreme event dominates the calculation. Or, they might mean that the value of the future is mathematically undefined, rendering the sum impossible regardless of knowledge.

  This proposal argues that the debate has stalled because these distinct forms of uncertainty are being treated as a single monolithic problem. A defense that works against one type of uncertainty may fail catastrophically against another. For instance, a strategy of averaging out errors might work when uncertainty is symmetric and bounded, but it offers no protection when the uncertainty is driven by heavy-tailed distributions where the mean does not converge. Similarly, a restriction to "foreseeable consequences" might solve the problem of complexity, but it does not solve the problem of structural indeterminacy where the value itself is undefined.

  The purpose of this research project is to disentangle these distinct forms of epistemic and structural difficulty. The project will proceed by constructing a taxonomy of three specific types of uncertainty that plague consequentialist calculation. It will then test the standard consequentialist defensive strategies against each type to see which strategies survive which challenges. The goal is not merely to categorize the problems, but to determine for which specific types of uncertainty the consequentialist imperative remains determinate and action-guiding, and for which types it genuinely breaks down.

  The research question is therefore precise: *Which of the three identified phenomena of uncertainty actually warrants the label of "cluelessness" in a way that defeats consequentialist decision-making, and for which of them does the standard move of maximizing expected value still yield a determinate verdict?*

  By answering this question, the project aims to move the debate past the binary of "consequentialism is impossible" versus "consequentialism is approximately true." Instead, it seeks to map the boundaries of consequentialist viability. It is possible that consequentialism is robust against ordinary ignorance but fragile against extreme tail risks. Or it may be that the problem is not ignorance at all, but a mathematical flaw in how we aggregate value over time. Distinguishing these cases allows for a more nuanced defense or critique of the view.

  This proposal outlines the plan for a semester-length term paper that will execute this analysis. It details the three categories of uncertainty, describes the standard defensive moves available to the consequentialist, sets out the methodological approach using toy models to stress-test these defenses, and defines the criteria for success and failure. Finally, it provides an honest assessment of the scope, distinguishing between what can be achieved in a six-thousand-word term paper and what must remain a project for further dissertation-level work.

  ## II. The Taxonomy of Uncertainty

  To make progress on the cluelessness objection, we must first stop treating "not knowing the future" as a uniform state. In decision theory and epistemology, the structure of uncertainty matters as much as the magnitude. A small amount of uncertainty in a stable system is fundamentally different from a large amount of uncertainty in a volatile system. This project proposes a tripartite distinction to categorize the ways in which remote consequences evade our grasp. These three cases are: Bounded Symmetric Uncertainty, Heavy-Tailed Instability, and Structural Indeterminacy.

  ### Case 1: Bounded Symmetric Uncertainty (The Noise Model)

  The first case represents the most ordinary form of ignorance. In this scenario, the agent does not know the specific outcome of an action, but the range of possible outcomes is bounded, and the errors in prediction are symmetric. Imagine an agent deciding whether to buy a coffee. They know the immediate cost and the immediate pleasure. They do not know the remote consequences: perhaps the money spent would have been donated to save a life, or perhaps the caffeine will make them more productive in a way that leads to a major discovery.

  However, in this model, we assume that for every possible negative remote consequence, there is a roughly symmetrical positive remote consequence of similar magnitude and probability. The causal ripples fan out, but they fan out in all directions. Some chains of causation lead to good outcomes, others to bad. Crucially, these outcomes are *bounded*; there is a limit to how much good or bad can result from a single cup of coffee within a reasonable timeframe, or at least the probability of extreme outcomes drops off fast enough that the expected value remains finite.

  In this situation, the uncertainty functions like statistical noise. While the agent is "clueless" about the specific trajectory of any single causal chain, the Law of Large Numbers suggests that over many decisions, or even within the expectation of a single decision, the positive and negative remote effects will cancel each other out. The expected value of the remote consequences approaches zero, or at least approaches a stable baseline that is common to all available actions.

  If this model holds, the cluelessness objection loses its force. The agent does not need to know the remote consequences because they do not affect the comparative ranking of the options. If Act A and Act B both have an expected remote value of zero (due to cancellation), the agent need only compare the immediate, known consequences. The epistemic problem is real—we do not know the future—but it is not decision-relevant. The uncertainty is ordinary and manageable within standard frameworks of decision-making under risk. The "cluelessness" here is merely a lack of specific data that does not change the optimal choice.

  ### Case 2: Heavy-Tailed Instability (The Dominance Model)

  The second case is significantly more dangerous for the consequentialist. Here, the uncertainty is not symmetric, and the distribution of outcomes is heavy-tailed. In a heavy-tailed distribution, the probability of extreme events decreases slowly enough that these events contribute significantly to the expected value. In the context of consequentialism, this corresponds to scenarios where there is a minute probability of an enormous payoff (or catastrophe) that swamps all other considerations.

  Consider an action that has a modest, known cost in the present but carries a one-in-a-billion chance of preventing an existential catastrophe or enabling a technological breakthrough that benefits trillions of future lives. Even though the probability is vanishingly small, the magnitude of the value at stake is so vast that when multiplied, it dominates the expected value calculation. The modest immediate costs become negligible in comparison to the tiny sliver of cosmic significance.

  The problem here is not just that we don't know the future; it is that our calculation of the future is *unstable*. Because the expected value is dominated by outcomes in the far tail of the distribution, the verdict of the calculation depends entirely on our estimates of probabilities and values in a region where we have no data. We have no empirical track record for existential catastrophes or utopian breakthroughs. Therefore, our prior assumptions dictate the result. If we adjust our prior probability of the breakthrough from one-in-a-billion to one-in-ten-billion, the recommended action flips.

  This creates a situation where the expected value is not merely uncertain, but sensitive to arbitrary modeling choices. The "cluelessness" here is structural: we are forced to make decisions based on numbers that we cannot constrain with evidence. The calculation does not converge on a stable truth; it floats on the sea of our priors. This is distinct from the first case because the errors do not cancel out. The tail dominates the head. If the tail is unknowable, the expected value is unknowable in a way that matters for the decision.

  Furthermore, this case introduces the problem of "cluelessness" regarding the *sign* of the impact. In the heavy-tailed scenario, it is often unclear whether the remote consequence is positive or negative. An intervention that stabilizes a region might prevent a war, or it might entrench a tyrant. If the magnitude is high enough to dominate the calculation, the uncertainty about the *direction* of the effect becomes fatal. We are not just unsure of the amount of good; we are unsure if we are doing good or evil, and the stakes are high enough that this uncertainty paralyzes the maximization imperative.

  ### Case 3: Structural Indeterminacy (The Divergence Model)

  The third case moves beyond epistemology into metaphysics and mathematics. In the first two cases, we assumed there is a fact of the matter about the value of the future, even if we cannot know it. In the third case, we question whether there is a fact of the matter at all. This occurs when the sum of consequences is unbounded or when the values involved are not cardinally comparable.

  Consider the scenario where the timeline of the future is infinite. If the universe continues forever, and our actions have any non-zero effect that persists, we may be summing an infinite series of values. If the series does not converge, the total value is undefined. We cannot say Act A is better than Act B if both produce infinite value, unless we have a sophisticated mathematics of infinity that allows for comparison (such as comparing rates of growth). But often, the mathematics yields no clear ordering. One infinite sequence is not necessarily "larger" than another in a way that guides action.

  Alternatively, the indeterminacy may arise from value incomparability. It may be that the goods produced in the remote future are of a different kind than the goods in the present, and there is no common currency of value to trade them off. If the remote consequences involve the existence of new types of sentient beings with experiences we cannot comprehend, the value of those experiences may be incomparable to human suffering or pleasure today.

  In this scenario, the problem is not that we lack evidence (Case 1) or that our priors are unstable (Case 2). The problem is that the function we are trying to maximize is ill-defined. There is no number to calculate. The "cluelessness" here is total, but it is not an epistemic failure; it is an ontological or mathematical one. The consequentialist directive presupposes that "better" is a transitive, complete relation over acts. If the consequences render the relation incomplete or undefined, the directive has no grip.

  ### Distinguishing the Three

  The distinction between these three cases is the core theoretical contribution of this project. Much of the existing literature treats the inability to predict the future as a single hurdle. By separating them, we can see that they require different solutions.

  Case 1 is an engineering problem. It can be solved by better data, averaging, or ignoring noise.
  Case 2 is a statistical problem. It requires robust priors, perhaps truncating the tails, or accepting that some decisions are fundamentally arbitrary.
  Case 3 is a foundational problem. It requires a revision of the value theory or the mathematics of aggregation.

  If we conflate them, we risk applying an engineering solution to a foundational problem. For example, arguing that "we should just focus on the foreseeable future" might work for Case 1 (since the remote noise cancels out anyway), but it is an ad hoc dodge for Case 2 (where the foreseeable future is negligible compared to the tail) and irrelevant for Case 3 (where the sum is undefined regardless of how far we look).

  The research will proceed by rigorously defining these three cases using formal toy models. The goal is to show that they are logically distinct and that they exert different pressures on the consequentialist framework. Once the taxonomy is established, the project will evaluate whether the standard consequentialist replies can address them individually.

  ## III. The Consequentialist Defensive Perimeter

  Having established the three types of uncertainty, the next phase of the research is to catalog the standard moves available to the consequentialist. When faced with the claim that "we cannot know the consequences," proponents of the view do not simply surrender. They have developed a repertoire of defensive strategies designed to restore action-guidance. However, these strategies are often presented as universal fixes. This project hypothesizes that they are not universal; they are specific tools that work on specific types of uncertainty.

  The research will analyze three primary defensive strategies: The Foreseeability Restriction, The Procedural Shift, and The Evidential Threshold.

  ### Strategy A: The Foreseeability Restriction

  The most common reply to the cluelessness objection is to limit the scope of moral evaluation to consequences that are reasonably foreseeable. On this view, an agent is not responsible for the ripple effects that vanish into the horizon of unpredictability. They are only responsible for the outcomes they could have anticipated at the time of decision.

  This strategy effectively cuts the causal chain. It says that consequences beyond a certain epistemic horizon do not count towards the moral value of the act. This has the immediate benefit of making the calculation tractable. The agent only needs to sum the values of the near-term, known effects.

  However, this strategy faces a significant theoretical cost. It seems to abandon the core insight of consequentialism, which is that the rightness of an act depends on the *actual* state of the world it produces, not the agent's mental state about that world. If I accidentally save the world through a action I thought was trivial, the Foreseeability Restriction suggests I did not do the "right" act in the maximizing sense, because the saving of the world was not foreseeable. This divorces the theory from the actual good it purports to maximize.

  In the context of the taxonomy, this proposal will investigate which cases this strategy resolves.
  *   **Against Case 1 (Noise):** This strategy is highly effective. Since the remote consequences cancel out in expectation, ignoring them changes the calculation little. The restriction is cost-free here.
  *   **Against Case 2 (Heavy Tails):** This strategy is problematic. The heavy-tailed outcomes are, by definition, rare and often unforeseeable in their specifics. If we restrict attention to the foreseeable, we systematically ignore the very outcomes that dominate the expected value. This might stabilize the decision, but it does so by blinding the agent to the most morally significant factors. It solves the paralysis by lobotomizing the calculation.
  *   **Against Case 3 (Indeterminacy):** This strategy offers a pragmatic escape. If the infinite sum is undefined, cutting it off at a finite horizon makes it defined. However, the cutoff point is arbitrary. Why stop at ten years? Why not eleven? The arbitrariness reintroduces a different kind of instability.

  ### Strategy B: The Procedural Shift

  A second major line of defense is to shift the object of evaluation from individual acts to decision procedures or rules. Instead of asking "Which act maximizes value?", the agent asks "Which decision procedure, if generally followed, would maximize value?"

  This move leverages the idea that while we may be clueless about the specific consequences of a single act, we are not clueless about the general tendencies of types of actions. We know that honesty generally promotes trust, which generally promotes welfare. We do not need to calculate the remote consequences of every lie; we can follow the rule "do not lie" because that rule has good consequences in the aggregate.

  This strategy relies on the stability of the world. It assumes that the causal connections between rules and outcomes are robust enough to be known, even if the specific act-outcome connections are not.

  In the context of the taxonomy:
  *   **Against Case 1 (Noise):** This is the ideal solution. Procedures average out the noise. Over many instances, the symmetric errors cancel, and the rule captures the signal.
  *   **Against Case 2 (Heavy Tails):** This strategy struggles. Heavy-tailed events are often unique or rare. There is no "general rule" for preventing a specific existential risk that occurs once in history. A procedural ethics might favor "do not take extreme risks," but if the expected value of the risk is positive (due to the massive tail payoff), the procedure might forbid the very act that maximizes value. The procedural shift tends to be conservative, which protects against negative tails but may miss positive ones.
  *   **Against Case 3 (Indeterminacy):** This strategy does not help. If the value of the outcomes generated by the procedure is undefined (e.g., infinite), then evaluating the procedure itself becomes impossible. You cannot say a procedure is best if its output cannot be ranked.

  ### Strategy C: The Evidential Threshold

  A third, more technical defense involves setting a threshold of evidential relevance. This view holds that a consequence only counts if the agent has a certain level of evidence for it. It is not enough that the consequence *might* happen; there must be a robust causal link supported by data. Consequences that rely on long, fragile chains of causation are discounted or set to zero.

  This is similar to the Foreseeability Restriction but is grounded in epistemology rather than a hard cutoff. It says: "Weight the consequences by the reliability of the prediction."

  In the context of the taxonomy:
  *   **Against Case 1 (Noise):** Effective. It filters out the noise by down-weighting low-confidence predictions.
  *   **Against Case 2 (Heavy Tails):** This is the critical test. Heavy-tailed events usually have low evidential support (because they are rare). Applying an evidential threshold would down-weight them significantly. This prevents the "Pascal's Mugging" style problem where a tiny probability swamps the decision. However, it risks ignoring genuine high-stakes opportunities. It solves the instability by suppressing the tail, but again, at the cost of accuracy.
  *   **Against Case 3 (Indeterminacy):** Ineffective. If the value is mathematically undefined, weighting it by evidence does not make it defined. Zero times undefined is still undefined.

  ### The Gap in the Literature

  The existing debate tends to treat these strategies as competing answers to a single question: "How do we solve cluelessness?" Proponents of the Foreseeability Restriction argue against proponents of the Procedural Shift, and so on. But they rarely ask: "Which kind of cluelessness are we solving?"

  If the literature is correct that there is only one kind of cluelessness, then these strategies are rivals. But if the taxonomy proposed in Section II is correct, then these strategies are complementary tools for different jobs. The Foreseeability Restriction might be the right tool for Case 1, while the Evidential Threshold is the necessary tool for Case 2.

  The failure to distinguish these cases leads to talking past one another. A critic attacks the Foreseeability Restriction by pointing out that it ignores long-term existential risks (Case 2). The defender replies that it handles ordinary uncertainty well (Case 1). Both are right, but they are discussing different phenomena. This project aims to resolve this confusion by mapping the strategies to the cases.

  ## IV. Methodology: Toy Models and Stress Testing

  To move beyond abstract argumentation, this project will employ a method of analytic modeling. The goal is to construct simplified "toy models" of decision scenarios that isolate each of the three types of uncertainty. These models will be mathematical in structure but philosophical in interpretation. They will not require complex calculus, but they will use the logic of expected value to demonstrate the behavior of each case.

  ### Constructing the Toy Models

  For each of the three cases, I will construct a decision matrix.

  **Model 1 (The Noise World):**
  This model will feature two acts, A and B. Act A has a known immediate value. Act B has a known immediate value slightly lower than A. However, Act B has remote consequences modeled as a random variable with a mean of zero and a finite variance. The simulation will show that as the time horizon extends, the expected value of the remote consequences remains zero. The verdict should remain stable: Act A is preferred. This model demonstrates that Case 1 uncertainty does not disrupt the ranking.

  **Model 2 (The Tail World):**
  This model will feature two acts. Act A is safe with modest value. Act B has a modest cost but a probability $p$ of a value $V$. I will vary $p$ and $V$ such that $p \times V$ is large, but $p$ is small. I will then introduce uncertainty into the estimate of $p$. I will show that small changes in the prior for $p$ flip the preference from A to B. This demonstrates the instability of Case 2. I will then apply the "Evidential Threshold" strategy to see if discounting low-$p$ events restores stability.

  **Model 3 (The Infinite World):**
  This model will feature acts that generate a stream of value over time $t$. For Act A, the stream converges to a finite sum. For Act B, the stream diverges (e.g., constant positive value forever). I will show that standard summation fails to compare A and B. I will then test the "Foreseeability Restriction" by cutting off the stream at time $T$. I will show that the ranking depends entirely on the arbitrary choice of $T$.

  ### The Stress Test Protocol

  Once the models are established, the project will run the "Standard Toolkit" (from Section III) against each model. This is the core analytic work of the paper.

  For each combination of Case (1, 2, 3) and Strategy (Foreseeability, Procedure, Evidence), I will ask:
  1.  Does the strategy yield a determinate verdict? (Yes/No)
  2.  Is the verdict stable under small changes in parameters? (Yes/No)
  3.  Does the verdict align with the intuitive moral importance of the scenario? (Yes/No)

  This will produce a matrix of results. For example, we might find that the Procedural Shift yields a determinate verdict for Case 1 and Case 2, but fails Case 3. Or we might find that no strategy yields a stable verdict for Case 2 without sacrificing the core consequentialist commitment to maximizing actual value.

  ### Analytic vs. Empirical

  It is important to clarify that this is a conceptual analysis, not an empirical study. The "toy models" are not simulations of the real world; they are logical possibilities designed to test the coherence of the ethical theory. The question is not "How often do heavy tails occur in reality?" but "If they do occur, does consequentialism break?"

  However, the plausibility of the models matters. I will need to argue that Case 2 and Case 3 are not merely logical curiosities but represent genuine possibilities in our world. For Case 2, I will point to the structure of existential risk and technological breakthrough. For Case 3, I will point to the possibility of an infinite future or incomparable values. The models must be grounded enough to be relevant to the ethical debate, not just mathematical games.

  ### Handling the Interactions

  A potential complication is that these cases may not be mutually exclusive in the real world. A single decision might involve noise, heavy tails, and infinite horizons simultaneously. The methodology will address this by treating the cases as ideal types. The goal is to understand the distinct pressure each one exerts. Once the distinct pressures are understood, they can be recombined in future work. For the scope of this term paper, isolating the variables is necessary to achieve clarity.

  I will also need to address the interaction between the strategies. Can an agent use the Foreseeability Restriction *and* the Procedural Shift? The analysis will consider whether combining strategies creates a robust defense or merely compounds the theoretical costs. For instance, restricting to foreseeable consequences *and* following rules might make the theory very stable, but it might drift so far from "maximizing actual good" that it ceases to be consequentialist in any meaningful sense. This "drift" will be a key metric of evaluation.

  ## V. Expected Outcomes and Evaluation Criteria

  The success of this project depends on producing a clear mapping of the problem space. It is not necessary to "solve" cluelessness in the sense of proving consequentialism is true. It is necessary to show exactly where and why it struggles.

  ### The Deliverable: A Mapping Matrix

  The primary result of the paper will be a conceptual map (presented as a table or matrix) that correlates the Type of Uncertainty with the Viability of Decision-Theoretic Resources.

  *   **Row 1 (Ordinary Noise):** Expected to show that standard Expected Value maximization works. Standard replies are unnecessary or redundant.
  *   **Row 2 (Heavy Tails):** Expected to show that standard Expected Value maximization is unstable. Standard replies (Evidence/Foreseeability) restore stability but at the cost of ignoring high-stakes tails.
  *   **Row 3 (Indeterminacy):** Expected to show that standard Expected Value maximization is undefined. Standard replies fail to resolve the mathematical issue without arbitrary cutoffs.

  This matrix provides the "determinate answer" to the research question. It tells us that "cluelessness" is not a single verdict. It is a diagnosis that requires specifying the type.

  ### Criteria for Success

  The project will be considered successful if:
  1.  **Distinctness:** It successfully demonstrates that the three cases are logically distinct and not reducible to one another. (e.g., showing that Case 2 cannot be solved by the methods that solve Case 1).
  2.  **Diagnostic Power:** It shows that existing debates are confused because they conflate these cases. (e.g., showing how a specific argument in the literature fails because it assumes Case 1 properties in a Case 2 scenario).
  3.  **Action-Guidance:** It identifies at least one combination of Case and Strategy that yields a stable, action-guiding verdict without abandoning the core consequentialist insight.

  If the paper can show that consequentialism is viable for Case 1 and Case 2 (with modifications) but must suspend judgment for Case 3, that is a significant philosophical result. It limits the scope of the objection without denying its force entirely.

  ### Criteria for Failure

  The project risks failure in several specific ways, which must be acknowledged:
  1.  **Collapse of Taxonomy:** If upon closer inspection, Case 2 turns out to be just a more extreme version of Case 1, the taxonomy adds no value. The paper must prove the structural difference (convergence vs. non-convergence of expectation).
  2.  **Universal Failure:** If all three strategies fail against all three cases, the result is simply "Consequentialism is impossible." While this is a determinate answer, it renders the taxonomy less useful. The paper needs to find *some* traction, some area where the theory works.
  3.  **Triviality:** If the distinctions are obvious and the results are mundane (e.g., "we can't calculate infinity"), the project lacks depth. The analysis must show *why* the standard replies fail in non-obvious ways.

  ### The "So What?" Factor

  Beyond the internal logic, the project must explain why this matters. The significance lies in the practical application of ethical theory. If we are living in a "Heavy-Tailed World" (Case 2), then standard moral intuition and standard consequentialist calculations are both dangerous. We might be ignoring the most important things we could do. If we are living in a "Noise World" (Case 1), then the cluelessness objection is a distraction, and we should focus on immediate welfare.

  Determining which world we are in is an empirical question, but determining how the theory *behaves* in each world is a philosophical one. This paper provides the philosophical framework needed to ask the empirical question correctly. It prevents us from using a map designed for flat terrain (Case 1) when we are actually in the mountains (Case 2).

  ## VI. Scope and Feasibility Assessment

  A critical component of this proposal is an honest assessment of what can be achieved within the constraints of a one-semester term paper (approximately six thousand words) versus what must be reserved for dissertation-level research. The distinction between "cluelessness" types is rich enough to support years of inquiry; therefore, boundaries must be drawn.

  ### Realistically Doable in a Semester

  1.  **Conceptual Taxonomy:** Defining the three cases and arguing for their distinctness is fully achievable. This relies on logical analysis and does not require extensive external research or complex formalism.
  2.  **Toy Model Construction:** Creating the simplified decision matrices described in Section IV is manageable. These do not need to be rigorous mathematical proofs but rather clear logical illustrations.
  3.  **Mapping the Replies:** Analyzing the three standard strategies against the three cases is a finite task. There are nine intersections to analyze. This fits well within the word count.
  4.  **Conclusion on Viability:** Drawing the conclusion about which forms of consequentialism survive which uncertainties is a synthesis of the above and is appropriate for a term paper.

  ### Dissertation-Level Horizons

  1.  **Formalizing the Heavy Tail:** A full treatment of Case 2 would require a deep dive into decision theory under Knightian uncertainty and imprecise probabilities. Developing a robust formal model for "stable expected value under heavy tails" is a technical project that exceeds the scope of this paper. This paper will describe the problem, not solve the mathematics.
  2.  **Empirical Calibration:** Determining whether the real world actually exhibits Case 2 or Case 3 properties is an empirical project involving history, economics, and physics. This paper will assume these cases are possible, not prove they are actual.
  3.  **Developing New Strategies:** If the standard strategies fail, proposing a *new* strategy (e.g., a new way to aggregate infinite value) is a major theoretical contribution. This paper will limit itself to testing *existing* strategies. Proposing a novel solution to the Infinite Case is a dissertation topic.
  4.  **Interaction Effects:** As noted in the methodology, the interaction between the three cases in a single decision is complex. Analyzing how Noise and Heavy Tails interact in a single model is a complication that will be mentioned but not fully modeled in this paper.

  ### Word Count Allocation

  To ensure the project stays within the six-thousand-word limit while maintaining depth, the allocation will be roughly as follows:
  *   **Introduction:** 750 words. (Setting the stage, stating the thesis).
  *   **Taxonomy:** 2,000 words. (The core definitions and distinctions).
  *   **Defensive Strategies:** 1,500 words. (Describing the tools).
  *   **Methodology and Analysis:** 1,000 words. (The stress test and matrix).
  *   **Scope and Conclusion:** 750 words. (Limitations and significance).

  This allocation prioritizes the Taxonomy, as the success of the entire project rests on the clarity of the three distinctions. If the reader is not convinced that Case 2 is different from Case 1, the rest of the argument fails. Therefore, the bulk of the writing will focus on fleshing out the nuances of the Heavy-Tailed and Indeterminacy cases.

  ### Potential Pitfalls in Execution

  One risk is becoming too technical. The discussion of heavy tails and infinite sums can quickly become a mathematics paper. I must keep the focus on the *ethical implications* of the math. The question is not "Does the series converge?" but "Does the agent have a moral obligation?"

  Another risk is becoming too abstract. To avoid this, I will use concrete examples for each case (e.g., the coffee purchase for Case 1, the existential risk intervention for Case 2, the infinite future for Case 3). These examples will anchor the abstract distinctions in moral intuition.

  Finally, there is the risk of "straw-manning" the consequentialist replies. I must ensure I present the strongest version of the Foreseeability and Procedural strategies before testing them. If I attack weak versions, the conclusion that they fail will be unconvincing. I will frame the strategies in their most robust form, as they appear in the strongest defenses of the view.

  ## VII. Conclusion

  The cluelessness objection is often treated as a trump card against consequentialism, a single argument that renders the theory impotent. This proposal argues that this treatment is a mistake born of conflation. By fracturing the objection into three distinct phenomena—Bounded Symmetric Uncertainty, Heavy-Tailed Instability, and Structural Indeterminacy—we can see that the objection is not a monolith.

  Some forms of ignorance are manageable. Some are destabilizing. Some are foundational. The consequentialist does not need to solve all of them to remain viable; they only need to show that the actual world falls into the manageable categories, or that they have tools to handle the destabilizing ones.

  This research project will provide the map necessary to navigate this terrain. It will not claim to solve the problem of the infinite future or the uncertainty of existential risk. Instead, it will clarify exactly what those problems *are*. It will show that when we say we are "clueless," we must specify what kind of cluelessness we mean.

  By the end of the paper, the reader should understand that the debate has been circling because it is trying to use one key for three different locks. The proposal outlines a method to cut the keys to fit the locks. Whether the locks can be opened is a matter for the analysis, but knowing which key belongs to which lock is a necessary precondition for progress.

  This distinction is not merely academic. It has implications for how we live. If we are in a Heavy-Tailed World, our moral lives demand a radical reorientation toward low-probability, high-impact actions. If we are in a Noise World, they demand attention to the immediate and the local. If we are in an Indeterminate World, they demand humility about the very possibility of optimization.

  Determining which of these descriptions fits our reality is a task for science and experience. But determining how our ethical theories respond to each description is a task for philosophy. This term paper proposes to execute that task with precision, isolating the variables, testing the defenses, and delivering a determinate verdict on the viability of consequentialism under specific conditions of ignorance. The result will be a more resilient, nuanced understanding of what it means to do the best we can in a world we cannot fully know.

  The project is feasible within the semester constraints because it limits its scope to analysis and taxonomy rather than empirical proof or novel mathematical derivation. It stands on the distinctions themselves, requiring no external authority other than logical consistency. By adhering to this plan, the paper will contribute a structured framework to a debate that has long suffered from unstructured skepticism. It transforms the "cluelessness objection" from a conversation-stopper into a research program.

  In sum, the proposal seeks to replace the question "Is consequentialism possible given our ignorance?" with the more precise question "Which forms of ignorance defeat consequentialism, and which forms can it survive?" This shift in questioning is the primary innovation of the project. It promises to move the dialectic forward by forcing both critics and defenders to specify the structure of the uncertainty they are discussing. If successful, the paper will demonstrate that the consequentialist is not necessarily clueless, but must be selective about where they claim to see. They may be blind to the infinite, and unstable in the face of the extreme, but they can still see the immediate and the probable. And for a moral theory, that may be enough.

  The path forward is clear. The taxonomy will be built, the tools will be tested, and the map will be drawn. The terrain of ignorance is vast, but it is not featureless. This project will chart its contours.

