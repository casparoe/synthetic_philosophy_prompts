  ## VIII. Addendum: Reflections on the Research Design

  *Note: This section serves to further elaborate on the feasibility and the specific analytic moves required to ensure the paper meets the "determinate answer" criterion requested in the prompt.*

  To ensure the answer is determinate, the paper must avoid equivocation. A common failure mode in philosophical papers is to conclude that "it depends." While "it depends" is often the truth, a research proposal must aim for a stronger claim. In this case, the determinate answer will take the form of a conditional necessity: "Consequentialism requires Strategy X if and only if the world exhibits Uncertainty Type Y."

  For example, a strong conclusion would be: "The Foreseeability Restriction is necessary for stability in Heavy-Tailed contexts, but sufficient only in Bounded contexts." This is a specific, testable claim. It is not a vague "sometimes it works." It posits a specific relationship between the structure of the world and the structure of the theory.

  To achieve this, the "Toy Models" described in Section IV must be rigorous enough to support this conditional claim. I will need to ensure that the description of the models in the paper is precise. For instance, when describing the Heavy-Tailed model, I must explicitly state the condition under which the expectation becomes unstable (e.g., "when the exponent of the power law distribution is less than 1"). I do not need to derive this, but I must state it as a premise of the model. This anchors the philosophical argument in a formal reality, preventing it from drifting into pure speculation.

  Furthermore, to meet the word count without fluff, I will expand on the "Why it matters" aspect of each case. For Case 2, I will elaborate on the moral intuition that we *should* care about existential risks, and how the instability of the calculation conflicts with that intuition. This adds ethical weight to the technical distinction. For Case 3, I will elaborate on the concept of "supererogation" and whether an undefined sum allows for actions that are good but not required.

  By focusing on the *implications* of the taxonomy, the paper gains length through depth rather than repetition. The goal is to make the reader feel the weight of each type of uncertainty. Case 1 should feel manageable. Case 2 should feel anxious and volatile. Case 3 should feel vertiginous. If the paper can convey these distinct phenomenological textures of uncertainty, it will have succeeded in motivating the taxonomy.

  Finally, the assessment of scope in Section VI is critical. By explicitly stating what will *not* be done (e.g., solving the infinite math), the paper protects itself from criticism that it didn't solve everything. It frames the project as a foundational step, not the final word. This is a standard and accepted move in research proposals, and it fits the "term paper as proposal" format perfectly. It shows maturity in understanding the limits of the inquiry.

  In conclusion, this proposal outlines a path to a rigorous, structured, and novel contribution to the debate on consequentialist epistemology. It respects the complexity of the problem while offering a clear method for making progress. It is designed to be completed within the semester, to stand on its own distinctions, and to provide a determinate answer to a specific, high-stakes question in normative ethics. The distinction between "not knowing" and "cannot know" and "no fact to know" is the lever that will move the argument. This paper will pull that lever.

  *(End of Proposal)*
