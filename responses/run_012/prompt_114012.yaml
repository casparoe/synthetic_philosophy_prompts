answer: |-
  ### The Satisficing Protocol for Grant Slates

  This procedure is designed to replace ranking with thresholding, and optimization with structured search. It treats your time and the board's cognitive load as scarce resources. It does not find the *best* set of grants; it finds a *sufficient* set that meets institutional constraints, allowing you to defend the slate based on process integrity rather than comparative merit.

  **Constraints:**
  *   **Time:** 2 days per quarter.
  *   **Tool:** Pen, paper, folder of proposals.
  *   **Goal:** Fill a fixed pot with "good enough" proposals without ranking them against each other.

  ---

  ### Part I: The Procedure

  #### Phase 1: Set the Aspiration Level (Pre-Search)
  *Before opening any proposals in the current batch.*
  Satisficing requires a defined "good enough." If you define this while reading, you are optimizing. Define it now.

  1.  **Define the Hard Floor:** Write down the three non-negotiable conditions for any grant. (e.g., "501(c)(3) status verified," "Budget balances," "Activity falls within Mission Statement X").
  2.  **Define the Portfolio Constraints:** Write down the structural goals for the *slate*, not the individual grant. (e.g., "No more than 25% of funds to one county," "At least two first-time grantees," "No more than three grants in [Fashionable Sector]").
  3.  **Set the Cut-Off Date:** Write down the date and time when search stops. (e.g., "Friday at 4:00 PM, two days before board packet distribution").

  **Hand-off to Values:** If you cannot define the Portfolio Constraints without arguing with yourself, stop. This is a values question for the Board, not a fact question for you. Ask the Board Chair to ratify these constraints once a year.

  #### Phase 2: The Search Rule (Individual Review)
  *Process proposals in the order they were received.*
  Do not compare Proposal A to Proposal B. Compare Proposal A to the Aspiration Level.

  4.  **The Binary Filter:** Read the proposal. Ask only: *Does this meet the Hard Floor (Step 1)?*
      *   **No:** Mark "Reject." Stop reading. File in "Declines."
      *   **Yes:** Mark "Eligible." Place in "Eligible Pool."
  5.  **The Effort Cap:** Spend no more than 45 minutes per proposal. If you cannot determine if it meets the Hard Floor in 45 minutes, mark "Insufficient Information." Request clarification once. If not received by Cut-Off, move to "Reject."

  #### Phase 3: The Stopping Rule (Slate Assembly)
  *Once the Cut-Off Date arrives.*
  You now have an "Eligible Pool." You do not rank them. You fill the pot using the Portfolio Constraints.

  6.  **Check the Pot:** Sum the request amounts of the "Eligible Pool."
      *   **If Pool Total < Fixed Pot:** You have under-subscribed. **Adapt Aspiration.** Loosen one Hard Floor constraint (e.g., allow a fiscal sponsor instead of direct 501(c)(3)) or extend the Cut-Off Date by 24 hours. Return to Phase 2.
      *   **If Pool Total > Fixed Pot:** You have over-subscribed. **Execute Stopping Rule.** Do not look for "better" proposals. Select from the Eligible Pool strictly by **Order of Receipt** until the pot is full.
      *   *Exception:* If selecting by Order of Receipt violates a Portfolio Constraint (e.g., you now have 4 grants in one county), skip the offending proposal and move to the next eligible one in the receipt order.
  7.  **Lock the Slate:** Once the pot is full (within 10% variance), stop. Mark remaining Eligible proposals as "Hold for Next Quarter."

  #### Phase 4: The Late Arrival Protocol
  *For proposals arriving after the Cut-Off Date but before the Board Meeting.*

  8.  **The Integrity Check:** Ask: *Did this proposal exist before the Cut-Off Date?*
      *   **Yes (Late Submission):** Apply the "No" Rule. Do not review. File for next quarter.
      *   **No (New Information on Existing Proposal):** Review only if it changes a Hard Floor "No" to a "Yes."
  9.  **The "Stronger Proposal" Defense:** If a late proposal appears objectively stronger than a funded one, you do not swap them. Swapping re-introduces optimization. You maintain the slate. The justification to the Board is: *"The search procedure closed. Integrity of the process outweighs marginal gains in merit."*

  ---

  ### Part II: Application to Cases

  Here is how the procedure handles the specific friction points you described.

  #### Case 1: The Fashionable Sector (Meets Threshold, Redundant)
  *   **Scenario:** A proposal meets all Hard Floors. However, you already have three grants in this sector in the "Eligible Pool," hitting your Portfolio Constraint (max three).
  *   **Procedure Action:** The proposal is marked "Eligible" in Phase 2. In Phase 3 (Slate Assembly), when you sort by Order of Receipt, you encounter this proposal. You check the Portfolio Constraints. The sector cap is full.
  *   **Decision:** **Skip.** It moves to "Hold for Next Quarter."
  *   **Board Defense:** You do not argue that this proposal is worse. You argue that the *portfolio* would be unbalanced. The decision is based on institutional constraints, not comparative merit. This prevents the board from asking why you didn't fund it; the rule prohibited it.

  #### Case 2: The High-Need Outlier (Below Threshold, New Region)
  *   **Scenario:** A proposal from an unfunded region with severe need. It fails the Hard Floor (e.g., their financial audit is one month old, not current).
  *   **Procedure Action:** In Phase 2, the Binary Filter returns "No." It goes to "Reject."
  *   **Adaptation Check:** In Phase 3, if your Pot is *not* full because you lacked enough Eligible proposals, you trigger the Adaptation clause. You may choose to lower the Hard Floor for financial recency *specifically to fill the pot*.
  *   **Decision:** **If the Pot is Full:** **No.** You do not lower the bar just for this one. You maintain the standard. **If the Pot is Empty:** **Yes,** but only as part of a general lowering of standards, not a specific exception.
  *   **Board Defense:** If you funded them because the pot was empty, you tell the Board: *"We had surplus capital and adapted our aspiration level to deploy it."* If you rejected them because the pot was full, you say: *"Lowering standards for one grant undermines the Hard Floor for all."*

  #### Case 3: The Stronger Late Proposal (The Unpleasant Stop)
  *   **Scenario:** The slate is locked. A proposal arrives two days later. It is clearly "stronger" (better staff, clearer metrics) than the weakest grant on your slate.
  *   **Procedure Action:** Phase 4 (Late Arrival Protocol). The Cut-Off Date has passed. The proposal is marked "Hold for Next Quarter." You do not read it deeply. You do not compare it to the slate.
  *   **Decision:** **No.**
  *   **Board Defense:** This is the hardest conversation. You say: *"If we swap this in, we validate late submissions and penalize those who met the deadline. We are optimizing for process integrity, not grant quality. If we change the rules mid-cycle, we cannot run the procedure next quarter."*
  *   **Why you won't like it:** You know you are passing up a "better" outcome. This is the cost of bounded rationality. You are trading marginal merit for procedural stability and cognitive sanity.

  ---

  ### Part III: Limitations and Judgment Calls

  This procedure is not a magic wand. It is a tool to manage constraints. You must know where it breaks.

  **1. What the Procedure Cannot Do**
  *   **It cannot guarantee maximum impact.** By refusing to rank, you may fund a "good" proposal that is less impactful than a "great" one that arrived late or was skipped due to sector caps. You are buying defensibility, not perfection.
  *   **It cannot resolve value conflicts.** If the Board disagrees with your Portfolio Constraints (e.g., they think the sector cap is wrong), the procedure collapses. The constraints must be pre-agreed.
  *   **It cannot handle "Black Swans."** If a truly transformative opportunity arises outside the cycle, this procedure says "wait." You need a separate, emergency mechanism for that, distinct from the quarterly slate.

  **2. Where It Will Misfire**
  *   **The "Good Enough" Drift:** Over time, you will unconsciously lower your Hard Floors because rejecting people is emotionally taxing. You must audit your own "Reject" pile once a year to ensure the Floor hasn't rotted.
  *   **The Order of Receipt Bias:** Relying on receipt order to break ties favors applicants with more administrative capacity (who submit early) over those doing the work (who submit late). This is an institutional bias you are accepting to avoid ranking bias.
  *   **The Empty Pot:** If you consistently have more money than Eligible proposals, the procedure forces you to lower standards. This might lead to funding weak projects just to spend the budget. In this case, the constraint is not your time, but the market. You should recommend to the Board to reduce the pot size rather than lower the Floor indefinitely.

  **3. Judgment Calls Dressed as Procedure**
  *   **Setting the Hard Floor:** Deciding that an audit must be "current" vs. "one year old" is a value judgment. The procedure treats it as a fact, but you chose the line.
  *   **Defining "Eligible":** In Phase 2, deciding if a proposal meets the Hard Floor often requires interpretation. Is a budget "balanced" if it relies on a pledge? You are making micro-judgments here that determine the Eligible Pool.
  *   **The Adaptation Trigger:** Deciding *which* constraint to loosen when the pot is under-subscribed is a judgment call. Do you accept weaker financials or weaker mission fit? The procedure tells you *to* adapt, not *how*.

  **Final Note:**
  This procedure shifts your role from "Judge of Merit" to "Guardian of Process." When the Board asks why you didn't fund the stronger, later proposal, you do not defend the grant. You defend the clock. This is the essence of satisficing under institutional constraints: acknowledging that a decision made on time with a consistent rule is more valuable to the organization than a decision made late with a marginally better outcome.
