prompt: |-
  I am a program officer at a small regional foundation. We make about forty grants a year, each between $15,000 and $60,000, and I am responsible for recommending a slate to a board that has to sign off. The decisions repeat every quarter, the stakes are moderate but real, and I have roughly two days per slate, no capacity to commission external reviews, and a fixed pot of money. I keep being told that I should be satisficing rather than optimizing, but every version I encounter collapses into the advice to pick something good enough, which is useless when the board asks why we did not fund the stronger proposal that arrived a week later. Please turn the theory of bounded rationality and satisficing into a decision procedure I can actually run on individual proposals and on a slate.

  I want the procedure to respect several distinctions that I have found useful but that popular accounts tend to blur. First, satisficing is not merely optimizing with a lower bar; it has a different structure. An optimizer needs a well-defined option set and a complete ranking, whereas a satisficer needs a search rule and a stopping rule, plus an aspiration level that can adapt as search proceeds. Second, the search rule and the stopping rule are separate decisions: where to look next is not the same question as when to stop. Third, there is a difference between satisficing as a descriptive claim about how people actually decide under limits and satisficing as a normative recommendation for what to do when search is costly. Fourth, bounded rationality includes temporal, cognitive, and institutional constraints, not only missing information. Please build the procedure around those distinctions, and do not let it quietly turn into a scoring rubric that ranks every proposal, because that is the optimizing behavior I am trying to avoid.

  The procedure should be something I can run in a few hours with a pen and a folder of proposals. Give me the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the question is one of values rather than facts. Then apply it to three cases: a proposal that meets the threshold but is in a fashionable area where we already have three grants; a proposal that falls just below the threshold but comes from a region we have never funded and where the need is severe; and a proposal that arrives after the slate is set but looks stronger than anything on it. Include one case where the procedure tells me to stop and not fund the stronger late proposal, which I will not like. End by saying what the procedure cannot do, where it will misfire, and which steps are judgment calls dressed up as procedure. Write as if you have no web access; do not provide citations, reading lists, or references.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Program Officer at a small regional foundation.
      *   **Context:** ~40 grants/year, $15k-$60k each, quarterly board approval, 2 days per slate, fixed pot, no external reviews.
      *   **Problem:** Told to "satisfice" but current advice is useless ("pick something good enough"). Needs to defend decisions against "stronger" late proposals.
      *   **Theoretical Constraints:** Must respect specific distinctions about bounded rationality/satisficing (Simon-esque):
          *   Satisficing $\neq$ optimizing with a lower bar (needs search rule, stopping rule, adaptive aspiration).
          *   Search rule $\neq$ stopping rule.
          *   Descriptive vs. Normative (focus on normative/procedural).
          *   Constraints are temporal, cognitive, *and* institutional.
          *   *Crucial:* Do not turn this into a scoring rubric/ranking system.
      *   **Output Requirements:**
          *   A concrete procedure runnable in a few hours with pen/paper.
          *   Ordered questions, sufficient answers, stop conditions, hand-off points (values vs. facts).
          *   Application to three specific cases (including one where the procedure says "no" to a stronger late proposal).
          *   Limitations section (what it can't do, where it misfires, judgment calls).
          *   Tone: Professional, direct, no web access/citations.

  2.  **Deconstruct "Satisficing" for this Context:**
      *   *Aspiration Level:* What constitutes "good enough"? This isn't a score; it's a set of necessary conditions (thresholds).
      *   *Search Rule:* In what order do I look at proposals? (Usually arrival order or batched, but needs structure).
      *   *Stopping Rule:* When do I stop looking and lock the slate? (When the pot is full *and* the diversity/mission goals are met, or when time runs out).
      *   *Adaptation:* If I can't find enough "good enough" proposals, do I lower the bar? If I find too many, do I raise it? (The prompt asks for adaptive aspiration).
      *   *Institutional Constraint:* The Board needs a defensible narrative, not just a score.

  3.  **Drafting the Procedure (The "Protocol"):**
      *   *Phase 1: Pre-Search (Setting the Aspiration).* Before looking at specific proposals, define the "Good Enough" criteria based on mission and constraints. This avoids moving the goalposts mid-review.
      *   *Phase 2: The Search & Filter (Individual Proposal).* A binary pass/fail based on thresholds, not ranking.
      *   *Phase 3: The Stopping Rule (Slate Construction).* When is the slate full? This is where the "fixed pot" meets the "good enough" criteria.
      *   *Phase 4: The Late Arrival Protocol.* How to handle the "stronger later" problem. This is crucial for the user's specific pain point.

      *Refining the "No Ranking" Constraint:* I must avoid saying "Score this 1-5." Instead, use "Does it meet Criterion X? Yes/No." If Yes, it enters the "Acceptable Pool." If the pool is larger than the budget, how do we choose without ranking? We use *categorical* priorities (e.g., geographic diversity, mission fit) or *order of arrival* (first-come, first-served among the acceptable). Let's use a "Bucket" approach.

  4.  **Developing the Steps:**

      *   *Step 0: Define the Aspiration Level (The "Pass" Mark).* What *must* be true? (Legal, Financial, Mission Alignment).
      *   *Step 1: The Search Order.* Process in batches (e.g., by receipt date).
      *   *Step 2: The Individual Filter.* Binary questions. If No -> Reject. If Yes -> "Eligible Pool."
      *   *Step 3: The Slate Assembly (Stopping Rule).* Fill the pot from the Eligible Pool. If the pot fills before all eligible are funded, stop. *Crucial:* How to break ties in the Eligible Pool without ranking? Use pre-set institutional priorities (e.g., "First we fund Region A, then Region B" or "First come, first served"). Let's go with "First Come, First Served among Eligible" to minimize cognitive load and bias, unless mission diversity requires otherwise.
      *   *Step 4: The Late Proposal Rule.* If the slate is locked, a new proposal is only considered if it triggers a "Re-open" condition. Otherwise, it waits for next quarter. This answers the "why not the stronger later one" question.

  5.  **Addressing the Specific Cases:**
      *   *Case 1 (Fashionable Area/Already Funded):* Meets threshold. But do we have a diversity constraint? If the aspiration level includes "geographic/sector balance," this might fail the *Slate* test, not the *Individual* test.
      *   *Case 2 (Below Threshold/High Need/New Region):* Fails Individual Filter. Can we adapt aspiration? Only if the *Pool* is empty. If the Pool has enough, we don't lower the bar. This teaches discipline.
      *   *Case 3 (Late/Stronger):* The procedure must say "No" to protect the process integrity. This is the hard pill to swallow.

  6.  **Refining the Theory/Practice Link:**
      *   Make sure to explicitly mention Search vs. Stopping.
      *   Make sure to highlight where values enter (Board/Officer) vs. facts (Budget/Dates).
      *   Ensure the "Adaptive Aspiration" is clear (if not enough eligible, lower bar; if too many, hold bar steady and stop search).

  7.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on "Ranking":* I need to be careful not to sneak ranking in via "priorities." Instead of "Priority 1, 2, 3," use "Categories." If Category A is full, move to Category B.
      *   *Self-Correction on "Late Proposal":* The user wants a defense against the board. The defense is "The procedure closed the search." This is a procedural defense, not a merit defense.
      *   *Tone Check:* Needs to be pragmatic, slightly rigorous, acknowledging the friction.

  8.  **Final Review against Constraints:**
      *   No citations? Yes.
      *   No web access disclaimer? Yes.
      *   Three cases included? Yes.
      *   Limitations section? Yes.
      *   Distinctions respected (Search vs Stop, Opt vs Sat, etc.)? Yes.

  9.  **Final Polish:** Ensure the "Stop" conditions are sharp. Ensure the "Hand-off" to the board is clear (values vs facts). (Proceeding to generate output based on this structure).

  *(Self-Correction during drafting)*: I initially thought about letting the officer lower the bar if the pot isn't full. But the prompt says "fixed pot." If the pot isn't full, that's actually okay (carryover), or it triggers a specific "Aspiration Adaptation." I will build in a rule: If Eligible Pool < Budget, *then* adapt aspiration. If Eligible Pool > Budget, *then* apply Stopping Rule (cut off). This respects the adaptive nature of satisficing.

  *(Refining the "Late Proposal" case)*: The user specifically asked for a case where the procedure says "stop and not fund the stronger late proposal, which I will not like." I need to make sure this is explicit and the rationale is procedural integrity, not merit.

  *(Refining the "Judgment Calls")*: I need to identify where the procedure relies on human intuition (e.g., defining the initial aspiration level).

