  - Bottom line
  You are arguing about welfare, while Nadia is arguing about decision optimization. Her theorem is mathematically correct for ideal agents. However, your examples correctly identify where human well-being diverges from that model.

  - What the theorem actually covers
  Good's Theorem states that for a rational Bayesian agent, the expected utility of making a decision after observing free information is never lower than making it before. It assumes you update beliefs correctly and choose the action maximizing expected payoff based on external outcomes. Crucially, it defines "better off" strictly as achieving preferable world-states through optimal action. It does not account for the psychological cost of holding the belief itself, nor does it apply if acquiring the information changes your utility function or cognitive capabilities. It proves free information has non-negative *instrumental* value for decision-making, not that knowledge never causes suffering. Therefore, it guarantees you never lose *options*, but it does not guarantee you never lose *peace of mind* unless that peace is explicitly valued in the calculation.

  - Where my four cases land
  1. **Fatal Diagnosis:** This is a case the theorem doesn't reach as typically applied. The theorem calculates instrumental value for action. If "dread" is a cost, the theorem says *don't test*. If you test anyway, you are worse off, but only because the standard model often ignores the disutility of the belief state itself. You are right that you are worse off; she is right that the *option* to know wasn't instrumentally negative, but the *state* of knowing is.
  2. **Hurtful Secret:** Similar to the diagnosis. The information changes nothing practically, so its instrumental value is zero. But its intrinsic value is negative. The theorem holds only if utility is defined strictly over external world-states, not internal epistemic states. Nadia's model excludes the pain of knowledge unless modeled as a cost.
  3. **Poker Tell:** You've smuggled in a physical constraint. The theorem assumes information is free and doesn't alter your capabilities or constraints. Here, knowing changes your physiology (tells), effectively making the information costly to hold. It's not the info that's bad, it's your inability to conceal the reaction to it. The information alters the *cost* of playing, violating the "free information" premise.
  4. **Panic/Numbers:** This violates the rationality assumption. Good's Theorem assumes optimal processing of probabilities. If information triggers panic leading to suboptimal choices, you aren't acting as the theorem's agent. The theorem describes ideal reasoning, not human psychology under stress. Your friend is describing a robot; you are describing a person.
  5. **Summary:** In cases 1 and 2, you need a broader utility function that prices mental states. In 3 and 4, you need a broader model of agency that accounts for physical leaks and cognitive biases. Nadia's theorem assumes these don't exist; your actual life proves they do.

  - The diagnosis
  This is a category error disguised as a substantive dispute, though it contains a substantive core. Nadia is arguing from normative decision theory: how an ideal agent *should* value information for action. You are arguing from descriptive welfare economics: how actual humans *experience* knowledge. When Nadia says information can't be bad, she means it cannot reduce the maximum expected payoff available to a rational actor. When you say information can be bad, you mean it can introduce psychological harms independent of action outcomes.

  However, it's not purely verbal. Nadia's claim relies on the assumption that agents are rational maximizers. Your cases (especially panic) highlight that humans are boundedly rational. If information triggers cognitive biases that lead to suboptimal choices, the theorem's precondition fails. Thus, her theorem is mathematically sound for ideal agents, but empirically false for humans in specific contexts.

  The friction comes because she treats "value" as decision-theoretic utility, while you treat it as holistic well-being. She is right that information doesn't restrict options (you can always ignore it), but wrong that ignoring it is psychologically costless. You are right that knowledge hurts, but wrong to frame it as violating the theorem rather than expanding the utility function to include epistemic states. The disagreement is substantive about human psychology, but verbal about the definition of "value."

  Ultimately, Nadia is protecting a mathematical truth about information theory, while you are protecting a psychological truth about human suffering. She wins on the math; you win on the reality. The argument persists because neither acknowledges the other's domain. She thinks you are denying math; you think she is denying pain. Both are true in their respective lanes. The conflict arises because 'utility' is a formal placeholder in economics, but means 'well-being' in common speech. Nadia uses the formal definition; you use the common one. When she says 'cannot be worse off,' she means 'cannot have lower expected utility.' When you hear it, you hear 'cannot feel worse.' This equivocation fuels the deadlock.

  - What would settle it
  To settle this, you need to agree on the utility function. If "utility" includes peace of mind, Good's Theorem predicts you should avoid the test, confirming your intuition. If "utility" is only money/survival, the theorem holds, but ignores your concern. The move that settles it is admitting the theorem applies to *instrumental rationality*, not *hedonic welfare*. Nothing will settle it if she insists the theorem describes human happiness rather than decision optimization. You need her to concede that being "better off" in the theorem doesn't mean being "happier."
