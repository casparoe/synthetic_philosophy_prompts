answer: |-
  Here is an argument for your paper that commits to a specific reading of the film in relation to strong computationalism.

  **Thesis:** *Memento* does not merely illustrate strong computationalism; it functions as a *reductio ad absurdum* of it. By externalizing the machinery of memory and decision-making onto skin and paper, the film reveals that computation is not an intrinsic property of a physical system but an interpretive layer imposed by an agent. The film ultimately refutes the strong claim that thinking *just is* computation, because it demonstrates that a system can execute a complex algorithm flawlessly while lacking the semantic grounding and diachronic unity required for a mind.

  ### The Visible Machine: Levels of Implementation

  To treat Leonard's system as a candidate cognitive implementation, we must look at the three levels you identified: the task, the algorithm, and the substrate.

  At the level of the **task**, Leonard is solving a constraint satisfaction problem: "Identify the murderer and eliminate him given zero short-term memory." At the level of the **algorithm**, he runs a strict loop: perceive stimulus, consult external storage (Polaroids/tattoos), execute conditional rule (e.g., "If license plate matches, attack"), update storage. At the level of the **substrate**, he uses ink, paper, and skin.

  Strong computationalism relies on substrate independence: if the input-output relations and state transitions are preserved, the mind is preserved. Leonard seems to validate this. He functions. He hunts. He reasons. The machinery is visible, stripping away the "black box" of the biological brain to show the logic gates underneath. If computationalism is true, Leonard *is* a computer, and his consciousness is the execution of that program.

  However, this visibility exposes the fragility of the **Implementation Problem**. The standard objection (associated with Putnam and Searle) is that any physical object can be described as implementing any computation if you are allowed to choose the mapping between physical states and logical states arbitrarily. In a normal brain, we assume the mapping is fixed by evolution and biology. In Leonard, the mapping is fixed by *choice*.

  The tattoos do not intrinsically mean "John G." They are just scars. They mean "John G." only because Leonard decided to map that ink pattern to that concept. This makes the arbitrariness of the computational mapping undeniable. Leonard's body is a rock that we have decided to treat as a hard drive. If computation requires an interpretation of physical states to logical states, Leonard shows us that the interpretation is not part of the computation itself—it is external to the system. The system (Leonard-now) processes the symbols, but it does not establish their meaning.

  ### The Twist: Syntax, Semantics, and the Collapsed Homunculus

  The film's twist is the philosophical pivot point. We discover that Leonard is not merely running a program; he is actively corrupting the input to manipulate the output. Past Leonard writes the instructions that Present Leonard executes.

  This creates a fatal problem for the syntax-versus-semantics distinction. In the Chinese Room argument, the man inside manipulates syntax without understanding semantics. Critics often reply that the *whole system* (man + rulebook) understands, even if the man doesn't. *Memento* dismantles this "System Reply" by fragmenting the system over time.

  Leonard handles the syntax flawlessly. He reads the note, checks the tattoo, follows the rule. But the semantics are gaslit. When he burns a Polaroid, he is deleting a "fact." When he writes a new note, he is creating a "truth." The symbols function perfectly within the logic of the program, but they refer to nothing real.

  In standard computationalism, the programmer, the computer, and the user are distinct conceptual roles. In *Memento*, they are the same biological entity stretched across time.
  1.  **The Programmer:** Past Leonard (who knows the truth/lie).
  2.  **The Computer:** Present Leonard (who processes the instructions).
  3.  **The User:** Future Leonard (who experiences the outcome).

  Because the Programmer can lie to the Computer, we see that syntactic manipulation is compatible with total semantic falsehood. Strong computationalism claims thinking is the execution of computations over representations. But if the "representations" can be systematically decoupled from reality by the very agent running the computation, then the computation is not thinking—it is merely causal processing. Leonard is not a mind running a program; he is a peripheral device being driven by a ghost in the machine who happens to be his own past self.

  ### What *Memento* Adds to the Debate

  You asked what this adds to the debate that a straight paper on the Chinese Room or the Implementation Problem does not. The answer is **diachronic identity**.

  The Chinese Room is a spatial thought experiment. It asks whether understanding can emerge from a static arrangement of rules and symbols at a single moment in time. *Memento* is a temporal thought experiment. It asks whether a mind can exist when the "system" is not a unified whole at any single moment, but a chain of distinct temporal slices passing information like a baton.

  Standard objections to computationalism often assume a stable system. *Memento* shows that if you take substrate independence seriously, you must accept that the "mind" can be distributed across time in a way that severs the link between the processor and the truth of the data. The film transforms the Implementation Problem from a logical puzzle into an existential crisis. It shows that the "mapping" required to make a physical system a computer is not just a logical assignment; it is an act of *narrative authority*.

  In the Chinese Room, the objection is that the man doesn't understand Chinese. In *Memento*, the objection is stronger: The man *thinks* he understands, but he is a puppet of his own previous states. This demonstrates that computation is insufficient for mind because computation lacks **normativity**. A computer follows rules; a mind follows truths. Leonard follows rules that lead to lies.

  ### Conclusion: The Verdict

  Does the film dramatize computationalism or refute it? It refutes it.

  It dramatizes the *mechanics* of computationalism to show that mechanics are not enough. Leonard proves that you can build a Turing Machine out of a human being, complete with input, output, and state storage, and yet fail to have a "mind" in the robust sense. The system works, but the *agent* is an illusion.

  *Memento* adds the crucial insight that strong computationalism ignores the **unity of the subject**. Computation can be fragmented, offloaded, and manipulated across time without breaking the algorithm. But a mind cannot be fragmented in that way without ceasing to be a single locus of responsibility and understanding. The film demonstrates that thinking is not just the execution of computations over representations; it is the *ownership* of those representations by a unified subject. Leonard has the computation, but because the Programmer and the Computer are disconnected by amnesia, he has lost the ownership.

  Therefore, the film argues that strong computationalism is false because it conflates *processing* with *thinking*. Leonard processes. He does not think. He is the ultimate counterexample: a perfect computer who has lost his mind.
