answer: |-
  The boundary problem is often dismissed as a logical paradox that dissolves upon inspection, but I believe it is a genuine structural feature of democratic theory that cannot be wished away. It is not, however, a fatal incoherence. It is better understood as a problem of *grounding*. Democracy is a procedure for legitimizing power, but the procedure itself requires a prior definition of the unit within which it operates. To ask the *demos* to define itself is to ask a set to contain itself as a member, which leads to the Russellian paradoxes you allude to.

  The analogy to the reference-class problem in anthropics is useful here, provided we don't stretch it too far. In anthropics, you cannot calculate the probability of your own existence or observations without first defining the class of observers you consider yourself a random sample from. But that class is not given by nature; it is chosen by the theorist. Similarly, in democracy, you cannot calculate the legitimacy of a vote without defining the class of voters. But that class is not discovered; it is constituted. The paradox arises only if we insist that the *demos* must be self-authorizing. If we accept that the *demos* rests on a pre-democratic normative foundation—a moral claim about who *ought* to count—the paradox dissolves into a difficult political judgment. The boundary problem is not a proof that democracy is impossible; it is a proof that democracy is not self-sufficient. It requires an external normative standard to set its borders.

  That brings us to the criterion for inclusion. The standard menu is unsatisfactory. The "all-subjected" principle (coercion) is too narrow; it misses those harmed by a state's inaction or externalities. The "all-affected" principle (causality) is too broad; in a chaotic world, every decision affects everyone, rendering the *demos* boundless and decision-making impossible. The "all-residents" principle is pragmatic but morally arbitrary; why does a line on a map determine who has a say in the pollution of a river that flows across it?

  I am prepared to defend a repaired version of your **Residual-Cost Rule (RCR)**. The core intuition is powerful: democracy is not merely about aggregating preferences; it is about protecting autonomy from domination. We need a vote when we are vulnerable to power we cannot escape, price, or mitigate. The RCR refines the "all-affected" principle by filtering out trivial or manageable impacts. It asks: who is *stuck* with this decision?

  However, the RCR as stated faces the two hard cases you identified. To defend it, we must repair it, not abandon it.

  **The Climate Case: The Threat of Boundlessness**
  Under the RCR, climate policy creates a nearly boundless *demos*. Nearly everyone alive bears a residual loss from carbon emissions that they cannot exit (the atmosphere is global), cannot contract around (no private deal with Exxon), and cannot insure against (systemic collapse). If the RCR implies that the *demos* for climate policy must include every human being and future generation, is this a *reductio ad absurdum*?

  I argue it is not a contradiction, but a diagnosis. The RCR correctly identifies that the nation-state is an illegitimate boundary for climate decision-making. If the residual costs are global, the legitimate *demos* is global. The fact that we lack a global state does not make the moral claim false; it makes our current political architecture morally deficient.

  However, a *demos* must be capable of action. A boundless *demos* is a paralyzed one. Here is the necessary repair: **The Institutional Capacity Constraint.** A person belongs in the *demos* if they bear residual costs *and* there exists a political institution capable of aggregating their interests into a decision. Where no such institution exists (e.g., a global parliament), the RCR generates a duty to *create* one, or, in the interim, to constrain the decisions of existing bounded demoi through rights or trusteeship.

  So, for climate, the RCR tells us that national democracies acting alone are acting illegitimately when they ignore cross-border residual costs. It does not demand we wait for a world state to vote; it demands that national voters treat the interests of those bearing residual costs as if they were present. This is a heavy burden, but it is the correct one. The "boundlessness" is a feature of the problem, not a bug of the rule.

  **The Non-Citizen Case: The Paradox of Exclusion**
  Consider long-term resident non-citizens. They pay taxes, are subject to coercion, and bear residual costs (policy shifts, deportation risks) they cannot insure against or easily exit (uprooting established lives). The RCR says they must be in the *demos*. Yet, in any actual vote on enfranchisement, the existing *demos* may vote to exclude them to preserve cultural cohesion or welfare benefits.

  This highlights the constitutive trilemma. The RCR is a normative standard for judging boundaries, not a mechanical algorithm that existing electorates must voluntarily apply. If the existing electorate votes to exclude those who bear residual costs, the RCR verdict is that the resulting boundary is illegitimate.

  Does this make the RCR impractical? No. It makes it revolutionary. It aligns with the historical trajectory of democratic expansion. Propertyless men, women, and racial minorities were all once excluded by the "actual electorate." Their inclusion was not granted because the existing *demos* felt like it; it was forced by the normative pressure that their exclusion violated the underlying logic of the system. The RCR captures this logic better than "residency" (which excludes some residents) or "coercion" (which can be dodged by legal status). If you live your life in a territory, you are exposed to residual political risks. To deny you a voice is to subject you to domination. The fact that the current *demos* resists this is evidence of the boundary problem's friction, not evidence against the RCR.

  **Why the RCR Beats the Alternatives**
  The RCR succeeds where the others fail because it focuses on *vulnerability* rather than *contact* or *location*.
  1.  **Vs. All-Affected:** The RCR avoids the "butterfly effect." If I am affected by a foreign zoning law only because it slightly changes the price of a global commodity, I can hedge that risk on the market. It is not residual. I am not *stuck*. The RCR filters out noise.
  2.  **Vs. All-Subjected:** The RCR captures structural domination. A non-citizen might not be legally "subject" to the same coercive laws as a citizen (they can leave, theoretically), but if leaving means abandoning a lifetime of capital and community, they are effectively stuck. The RCR captures the *economic and social reality* of coercion, not just the legal form.
  3.  **Vs. Residency:** The RCR explains *why* residency matters. Residency is a proxy for bearing residual costs. But if a resident is a diplomat with immunity and a guaranteed exit package, the RCR might exclude them, whereas residency includes them. This is a feature; the diplomat isn't vulnerable to the local *demos*.

  **The Cost of the View**
  Defending the RCR costs us comfort. It implies that many of our current democratic boundaries are morally arbitrary. It implies that for issues like climate or finance, national sovereignty is a shield for illegitimacy. It requires us to accept that in the absence of a global *demos*, we must accept constraints on national voting (e.g., human rights courts, international treaties) that function as proxies for the missing voters. This is unpopular. It trades democratic self-determination for democratic legitimacy. But the boundary problem teaches us we cannot have both perfectly. We must choose legitimacy.

  **Verdict and Confidence**
  I am roughly **75% confident** in this verdict. The Residual-Cost Rule, modified by an institutional capacity constraint, offers the most morally robust way to cut the Gordian knot of the boundary problem. It treats democracy as a remedy for vulnerability rather than a ritual of membership.

  The single step in this argument I am least sure of is the **definition of "insurable."** In the RCR, exclusion hinges on whether a loss could "reasonably have been expected to insure against." This is economically and morally slippery. As financial markets innovate, more risks become tradable. Does the democratization of derivatives shrink the *demos*? If I can buy a climate futures contract, do I lose my vote on climate policy? I have assumed that systemic, catastrophic risks are inherently uninsurable, but the line between "private risk" and "political risk" is shifting. If that line moves, the boundary of the *demos* moves with it, potentially destabilizing the very stability the rule seeks to protect. This economic vagueness is the weak link in an otherwise solid normative chain.
