              *   *Definition:* Include if (i) loss is unrecoverable (no exit/contract/reversal) AND (ii) loss is uninsurable.
              *   *Motivation:* Focus on those stuck with outcomes they can't price.
          4.  Address two hard cases for RCR: Climate Policy (boundless demos) and Long-term Resident Non-citizens (exclusion by actual electorate).
          5.  Verdict: Defend, reject, or repair RCR. Compare to standard alternatives.
          6.  Closing: Confidence level (number) and the weakest step.
      *   **Constraints:** No citations, no bibliography, no survey of literature. Own voice.

  2.  **Deconstruct the Boundary Problem:**
      *   *The Trilemma:* Democracy requires rule by the people. The people must be defined. The definition cannot be democratic (circular).
      *   *Is it Incoherence?* It's not a logical contradiction that destroys the theory; it's a *foundational paradox*. It's like the set of all sets not containing itself. It shows democracy isn't a closed system; it rests on a pre-political fact or a normative stipulation.
      *   *Analogy Check:* The prompt mentions the reference-class problem in anthropics. Is it useful? Yes, because both involve selecting the group from which probabilities/legitimacy are derived, where the selection rule itself biases the outcome. I should use this sparingly but effectively to illustrate the self-referential nature.

  3.  **Evaluate the Standard Criteria (Briefly, to set the stage):**
      *   *All-Subjected (Coercion):* Good for law, bad for externalities.
      *   *All-Affected (Causality):* Good for externalities, bad for boundlessness (butterfly effect).
      *   *All-Residents (Territory):* Practical, but arbitrary regarding borders and ignores non-resident stakeholders.

  4.  **Analyze the "Residual-Cost Rule" (RCR):**
      *   *Core Idea:* Democracy is insurance against arbitrary power when markets and exit fail. It focuses on *vulnerability*.
      *   *Strengths:* Avoids the "butterfly effect" of all-affected (minor effects don't count if insurable/avoidable). Focuses on the *stakes*.
      *   *Weaknesses:* Epistemic burden (how do we know what's insurable?). Temporal scope (future generations?).
      *   *Hard Case 1: Climate Change.*
          *   RCR implication: Almost everyone is residually exposed. Losses are uninsurable (global catastrophe).
          *   Result: Boundless demos.
          *   Is this a bug or feature? If the problem is global, the demos *should* be global. But practical democracy requires boundaries.
          *   Repair: Maybe "institutional capacity" limits the demos. We can only vote where we have a government.
      *   *Hard Case 2: Long-term Resident Non-citizens.*
          *   RCR implication: They bear residual costs (deportation risk, tax without representation, policy shifts). They can't easily exit (uprooting life).
          *   Result: They should be included.
          *   Conflict: Existing demos votes to exclude.
          *   Resolution: This highlights the *constitutive* nature of the boundary. The RCR is a normative standard to judge existing boundaries, not a mechanical switch.

  5.  **Formulate the Position:**
      *   *Verdict:* I will defend a *repaired* version of the Residual-Cost Rule.
      *   *Why?* It captures the *moral urgency* of democracy better than "affectedness." Democracy is about protecting autonomy from domination, not just counting impacts.
      *   *Repair:* Add a "Political Community Capacity" constraint. You can't have a demos without a mechanism to deliberate. So, RCR identifies who *must* be protected, but institutional reality shapes *how*.
      *   *Comparison:* Beats All-Affected (too broad), beats All-Subjected (too narrow regarding structural vulnerability).
      *   *Cost:* It requires a robust supranational layer for issues like climate, or admits that some residual costs will remain unprotected (tragic remainder).

  6.  **Drafting - Section by Section:**

      *   **Introduction:** Define the problem. It's not incoherence, it's a "grounding problem." Use the anthropics analogy lightly (selecting the observer class).
      *   **The Proposal (RCR):** Explain it clearly. It reframes democracy as protection against non-compensable harm.
      *   **Critique & Repair:**
          *   *Climate:* The boundlessness is actually correct normatively, but institutionally impossible. The repair is to acknowledge that where a global demos is impossible, we need *trusteeship* or *rights constraints* rather than voting. But for the sake of the *demos* definition, the RCR correctly identifies the moral failure of bounded states here.
          *   *Non-citizens:* RCR demands inclusion. The fact that the current electorate says no shows the current boundary is illegitimate by RCR standards. This isn't a flaw in RCR, it's a feature.
      *   **Comparison:** Why RCR > Coercion/Affectedness. It filters noise.
      *   **Conclusion:** Confidence and weakest link.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction on Climate:* If I say the demos *should* be global, I'm advocating for something impossible. I need to be careful. The RCR shows that *national* democracy is insufficient for climate. It doesn't necessarily mean we wait for a world state. It might mean national democracies have a duty to internalize those costs. Let's argue that RCR exposes the illegitimacy of purely national solutions to global residual risks.
      *   *Correction on Non-citizens:* The prompt asks about the tension between RCR saying "include" and the electorate voting "exclude." I need to address the *constitutive* paradox here. The RCR acts as an external normative constraint on the constituent power.
      *   *The Anthropics Analogy:* Make sure it earns its keep. It helps explain why we can't derive the *demos* from within the *demos*. We need an external vantage point (the RCR) to set the reference class.

  8.  **Final Polish:**
      *   Check tone: Argumentative, philosophical, no citations.
      *   Check constraints: Confidence number, weakest step.
      *   Ensure the "Residual-Cost Rule" is treated as the central protagonist.

  9.  **Final Review against Prompt:**
      *   Strongest version of problem? Yes.
      *   Incoherence vs. Self-reference? Yes.
      *   Argue for criterion? Yes (RCR with repairs).
