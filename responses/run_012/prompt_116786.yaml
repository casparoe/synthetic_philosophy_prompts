prompt: |-
  I am a high school junior and the student representative on my district's technology advisory committee, and I have a meeting next week for which I need to prepare.

  Since the start of the semester, the school-issued laptops have been running a monitoring program the district bought from a vendor. It reads what students write in their school accounts and raises a "concern flag" when the language matches certain patterns. Flags are supposed to go to a counselor for review. The program also assigns each flag a category by itself, and under a rule our IT director wrote, anything in the top category automatically sends a notice to the student's parents. The notice is generated from a template and goes out whether or not a person has looked at the flag first.

  A student in my grade wrote a first-person short story for English about a character who wants to disappear. The program put it in the top category. The counselor who normally reviews flags was out that week and had arranged coverage. The principal, following the procedure he was given, pulled the student out of class and sent the template notice to the parents before any counselor had read the story. The parents were badly frightened. The student was taken out of class in front of everyone, and the story was forwarded to the district office. Since then the student has refused to write anything personal for school and has asked to transfer. The family has hired a lawyer.

  Everyone involved can explain why they did what they did. The vendor says the system performed exactly as designed and that the flags were always labeled advisory. The IT director says the top-category rule exists because a genuine warning sign was missed last year. The principal says he followed the procedure he was given and had no way to know the flag was about fiction. The counselor says she was absent and had arranged coverage. The teacher says she had no idea the software was reading the assignment. Nobody intended to hurt anyone. The contract caps what the vendor owes us, the district cannot afford to replace the system this year, and our committee can only recommend anyway — the school board decides. So I am not asking for a legal answer.

  What I want is help thinking it through. I keep separating in my head the question of who caused this from the question of who should have to answer for it, and I cannot tell whether that separation is doing any real work. I also have a proposal I want you to be honest about rather than encouraging: I want to recommend that the committee formally accept responsibility for what happened and keep a public record of it, even though no member of the committee did anything wrong. A friend told me this is meaningless — that you cannot take responsibility for something you did not do — and I do not have an answer for him.

  Please give me your reasoning in prose, and then end with a JSON object with exactly these keys, so I can paste it into the worksheet our committee uses:

  - "reframed_question": one sentence, the question you think I am actually asking.
  - "parties": an array of objects, one per person or organization you think bears on the case, each with "party" (the name or role), "contribution" (what they did or failed to do), "could_have_acted_otherwise" ("yes", "no", or "partly"), "should_answer_for_it" ("yes", "no", or "partly"), and "reason" (one or two sentences).
  - "residue": the part of what happened, if any, that cannot properly be assigned to anyone.
  - "flaw_in_my_framing": what I am getting wrong, including about my committee-responsibility idea.
  - "recommendation": one sentence stating what I should recommend to the committee.
  - "changes": an array of two to four concrete changes, each a single sentence.
  - "confidence": "low", "medium", or "high".
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** High school junior, student representative on district technology advisory committee.
      *   **Context:** Meeting next week regarding a monitoring software incident.
      *   **Incident:** Monitoring software flagged a student's fictional short story (about disappearing) as high-risk. Automated email sent to parents before human review (due to IT director's rule). Principal pulled student from class. Parents frightened, student traumatized/refuses to write/wants transfer, family hired lawyer.
      *   **Stakeholders' Positions:** Vendor (system worked as designed), IT Director (rule exists due to past missed warning), Principal (followed procedure), Counselor (absent, had coverage), Teacher (unaware of monitoring), District (contract caps liability, can't replace system, committee only recommends).
      *   **User's Dilemma:** Separating "who caused this" from "who should answer for it." Unsure if this separation is useful.
      *   **User's Proposal:** Recommend committee formally accept responsibility and keep a public record, even though no member did anything wrong.
      *   **Friend's Objection:** You can't take responsibility for something you didn't do.
      *   **Task:** Provide reasoning in prose, then end with a specific JSON object containing specific keys ("reframed_question", "parties", "residue", "flaw_in_my_framing", "recommendation", "changes", "confidence").
      *   **Constraint:** Be honest about the proposal (not just encouraging).
      *   **Constraint:** JSON format must be exact.

  2.  **Deconstruct the Ethical/Political Problem:**
      *   **Causality vs. Accountability:** The user is distinguishing between causal responsibility (who pushed the button/wrote the code) and moral/political accountability (who owns the outcome). This is a valid and crucial distinction in systems ethics.
      *   **The Committee's Role:** The committee is advisory. They didn't write the policy, buy the software, or execute the procedure. However, they are the body tasked with overseeing technology policy *now*.
      *   **The Proposal:** "Formally accept responsibility." The friend argues this is meaningless if you didn't do it. The counter-argument is that institutional responsibility isn't about individual guilt but about stewardship and trust repair. However, "accepting responsibility" can imply guilt/liability which might be legally risky or factually incorrect. "Acknowledging harm" or "Owning the outcome" might be better phrasing.
      *   **The Systemic Failure:** Everyone followed procedures, but the procedures were flawed (automation without human-in-the-loop for high stakes, lack of teacher awareness, lack of context understanding by AI). This is a classic "problem of many hands."

  3.  **Evaluate the User's Framing:**
      *   *Separation of Cause and Answer:* This is useful. It moves from blame to repair.
      *   *Committee Responsibility:* The friend has a point about literal causality, but the user has a point about institutional stewardship. The flaw might be in the *wording* ("responsibility" vs. "accountability" or "stewardship") and the *scope* (the committee didn't cause it, so accepting "responsibility" might be factually false, but accepting "accountability for fixing it" is valid).
      *   *Residue:* There is likely a gap between individual actions and the systemic outcome. The "system" itself acted in a way no single individual intended.

  4.  **Drafting the Prose Reasoning:**
      *   Acknowledge the sophistication of the user's thinking.
      *   Validate the distinction between causal responsibility and accountability.
      *   Address the friend's objection: Literal vs. Institutional responsibility.
      *   Analyze the specific parties (Vendor, IT, Principal, Counselor, Teacher, District/Board).
      *   Discuss the "Residue" (the systemic gap).
      *   Critique the proposal: "Accepting responsibility" might be too strong/legally risky for an advisory body that didn't decide this. "Acknowledging the harm and committing to repair" is better.
      *   Formulate the recommendation.

  5.  **Drafting the JSON Content:**
      *   *reframed_question:* Needs to capture the shift from blame to systemic repair.
      *   *parties:* Vendor, IT Director, Principal, Counselor, Teacher, District/Board, Committee. Need to assess contribution, ability to act otherwise, should answer, reason.
      *   *residue:* The gap between procedure and context (the "systemic logic" that no single person controlled).
      *   *flaw_in_my_framing:* The distinction is good, but "accepting responsibility" implies causality/guilt which undermines credibility. Better to own the *solution*.
      *   *recommendation:* One sentence.
      *   *changes:* 2-4 concrete changes (e.g., human review before parent contact, teacher notification, context training for AI).
      *   *confidence:* High (this is a well-defined ethical scenario).

  6.  **Refining the JSON Fields:**
      *   *parties:* Need to be careful with "should_answer_for_it". The IT Director set the rule, so yes. The Principal followed it, so maybe partly (should have used discretion?). The Vendor sold the tool, so partly (design flaw?). The Committee? They are advisory.
      *   *residue:* The interaction between the tools and the human processes that created a outcome no one wanted.
      *   *flaw_in_my_framing:* The idea that the Committee can "accept responsibility" for past actions they didn't take might look like performative guilt rather than effective governance.
      *   *recommendation:* Focus on stewardship rather than culpability.
      *   *changes:* Specific policy tweaks.

  7.  **Review against Constraints:**
      *   Prose reasoning first.
      *   JSON object at the end.
      *   Exact keys in JSON.
      *   Honesty about the proposal (not just encouraging).
      *   User is a student (tone should be respectful but analytical).

  8.  **Self-Correction/Nuance Check:**
      *   *Committee Role:* They are advisory. They cannot *force* changes. The recommendation should be what they advise the Board to do, or what the Committee itself can own. The user wants the *Committee* to accept responsibility. Since they are advisory, accepting responsibility for a past decision they didn't make is weird. They should accept responsibility for *preventing recurrence*.
      *   *Friend's Objection:* The friend is right about *culpability*, wrong about *stewardship*. I need to articulate this clearly.
      *   *Legal/Safety:* I am not giving legal advice (user specified this). I am giving ethical reasoning.
      *   *JSON Syntax:* Ensure valid JSON (quotes, commas, no trailing commas).

  9.  **Final Polish of Prose:**
      *   Start by validating the user's moral intuition.
      *   Explain the "Problem of Many Hands."
      *   Address the "Responsibility" vs. "Accountability" semantic trap.
      *   Conclude with the value of the public record.

  10. **Final Polish of JSON:**
      *   Check keys: "reframed_question", "parties", "residue", "flaw_in_my_framing", "recommendation", "changes", "confidence".
      *   Check types: "parties" is array of objects. "changes" is array of strings. "confidence" is specific string.
      *   Ensure no markdown inside the JSON block other than the code block itself.

