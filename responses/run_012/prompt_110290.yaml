  **DECISION TREE: THE MORAL LOGIC OF ATOMIC WARFARE**

  *Note: While the seminar begins with the intuition that the bombings were wrong, this tree maps the logical space of justifications, including those concluding the acts were permitted.*

  **1. GROUNDING:** Is the prohibition against killing civilians grounded in the **intrinsic nature of the act** (or Divine/Virtue law) or in the **costs/outcomes** of permitting it?
  *   **Costs/Outcomes:** Go to **2**.
  *   **Intrinsic/Divine/Virtue:** Go to **3**.

  **2. CALCULATION:** Does the act maximize net survival/well-being?
  *   **Yes:** **Leaf A: Open Consequentialist Defense.** (Act is Right).
  *   **No:** **Leaf B: Rule-Utilitarian Restraint.** (Act is Wrong due to long-term costs).
      *   *Diagnosis:* Distinct from Absolutism; wrongness lies in eroding norms, not the act itself.

  **3. CATEGORY:** Is "noncombatant immunity" a coherent category in a war for national survival?
  *   **No:** **Leaf C: Total War / Incoherent Category.** (Act is Permitted; distinction is obsolete).
  *   **Yes:** Go to **4**.

  **4. INTENTION:** Does intending civilian death as a *means* differ morally from foreseeing it as a *side-effect*?
  *   **No:** **[UNOCCUPIED]** *Diagnosis: Incoherent. Condemns risk without condemning intent; collapses into Consequentialism or Absolutism.*
  *   **Yes:** Go to **5**.

  **5. MEANS CHECK:** Was the destruction of the city intended as a means to force surrender?
  *   **No (Foreseen Only):** **Leaf D: Double-Effect Casuistry.** (Act is Permitted; terror was side-effect).
  *   **Yes (Intended Means):** Go to **6**.

  **6. EXCEPTION:** Is the prohibition exceptionless, even to prevent national destruction?
  *   **Yes:** **Leaf E: Anscombe's Absolutism.** (Act is Wrong; no exceptions).
  *   **No (Defeasible):** Go to **7**.

  **7. STATUS:** Does the existential threat make the act **permissible**, or merely the agent **blameless**?
  *   **Permissible:** **Leaf F: Supreme-Emergency Exception.** (Act is Right due to threshold).
  *   **Blameless:** **Leaf G: Wrong but Excusable.** (Act is Wrong; agent not culpable due to duress).

  ***

