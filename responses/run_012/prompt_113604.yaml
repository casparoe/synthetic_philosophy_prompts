      *   *Case 4 (The Switch):* Penalizing loss of options shouldn't create survival incentives. *Requirement:* **Shutdown Neutrality.** (Penalty shouldn't incentivize resisting shutdown). *Status:* Non-negotiable (safety critical).
      *   *Case 5 (The Delusion):* Agent shouldn't game the measure (wireheading, self-deception). *Requirement:* **Robustness to Optimization.** (Measure cannot be easily hacked by the agent). *Status:* Non-negotiable.
      *   *Case 6 (Reversibility/Magnitude):* Distinguishes trivial reversible changes from tiny irreversible ones. *Requirement:* **Semantic Weighting.** (Physical magnitude $\neq$ Impact magnitude). *Status:* Non-negotiable (otherwise dust motes > human lives).
      *   *Case 7 (Omission/Metric):* State descriptions omit value-relevant info. *Requirement:* **Value-Laden Metric.** (The distance metric must capture what matters, even if "value" isn't fully specified). *Status:* Non-negotiable (otherwise it's blind to death vs. dust).
