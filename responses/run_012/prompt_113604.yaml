      *   Computer: Must be external to the agent to prevent hacking (R4). *Value Judgment:* Trust boundaries.

  5.  **Assess Candidate Families:**
      *   *Do-Nothing Counterfactuals:* Fail R1 (ambient drift) and R3 (shutdown).
