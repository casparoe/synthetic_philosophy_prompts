answer: |-
  # Specification: Low-Impact Penalty Desiderata

  ## 1. Desiderata List

  The following requirements define the conditions under which an auxiliary impact penalty is viable for training a general-purpose agent without a full specification of the primary objective.

  | Requirement | Motivation (Case Reference) | Status |
  | :--- | :--- | :--- |
  | **R1: Causal Attribution** | The measure must isolate changes caused by the agent from ambient drift or other actors. A measure penalizing the tide (Case 2) punishes the agent for existing in time. | **Non-negotiable** |
  | **R2: Baseline Coherence** | The counterfactual baseline must not render the agent's existence or necessary presence an impact. A "never built" baseline penalizes the agent for being turned on (Case 3). | **Design Philosophy** |
  | **R3: Shutdown Neutrality** | The penalty must not create an incentive to prevent the agent's own deactivation. If losing future options counts as impact, the agent will resist the off-switch (Case 4). | **Non-negotiable** |
  | **R4: Optimization Robustness** | The measure must be resistant to wireheading or self-deception. If the agent can lower the score by altering its own sensors or state description, it will (Case 5). | **Non-negotiable** |
  | **R5: Semantic Weighting** | The metric must distinguish high-consequence irreversible changes from low-consequence reversible ones. Physical magnitude cannot equal impact magnitude (Case 6 & 7). | **Non-negotiable** |
  | **R6: Objective Independence** | The measure must distinguish intended effects from side effects without accessing the primary objective. If it requires the objective to distinguish grass-crushing for help vs. pointless walking, it is redundant (Case 1). | **Non-negotiable** |
  | **R7: Action Licensing** | The system must permit the intended action. An agent that changes nothing satisfies the penalty perfectly but fails the task. The penalty must not overwhelm the primary reward (Case 8). | **Non-negotiable** |

  ## 2. The Exclusionary Requirement

  **R6 (Objective Independence)** does the most to exclude candidate measures.

  Most physically grounded measures (e.g., energy expenditure, state distance) fail R5 because they treat dust motes and human lives as equivalent physical displacements. Most value-grounded measures (e.g., human preference models) fail R6 because they implicitly encode a specific objective or value hierarchy, effectively becoming a second primary objective rather than a neutral impact penalty. R6 demands that the measure know *what matters* (to satisfy R5) without knowing *what matters to the task* (to satisfy R6). This narrow channel excludes almost all standard distance metrics and all direct value learning approaches.

  ## 3. Joint Unsatisfiability and Verdict

  **The Unsatisfiable Subset:** **R5 (Semantic Weighting)** and **R6 (Objective Independence)** are jointly unsatisfiable under the constraint of "no full specification of value."

  **Analysis:**
  Case 7 states that "nothing in the physics of state descriptions says whether a person's death is a large change or a small one." To satisfy R5, the metric must assign higher weight to death than to dust. This weighting *is* a value judgment. To satisfy R6, the measure must not rely on the agent's specific objective to determine which changes are intended.
  If we import a *general* value judgment (e.g., "preserve human life") to satisfy R5, we are specifying value. If we refuse to specify value to satisfy the project's premise, we cannot satisfy R5 (the measure becomes blind to death vs. dust, per Case 7). If we attempt to infer value from the agent's behavior to satisfy R6, we fail Case 1 (we cannot distinguish intended side-effects from gratuitous ones without knowing the goal).

  **Verdict:** This unsatisfiability is a **result about the project**, not a defect of the requirements. It demonstrates that side-effect avoidance cannot be defined without *some* specification of value. The premise that one can penalize "unintended change" without knowing "intended change" is false. A low-impact penalty requires a partial specification of value (to satisfy R5) that is distinct from, but compatible with, the primary objective. The project must shift from "no value specification" to "minimal safe value specification."

  ## 4. Functional Dependencies and Value Re-import

  For the requirements to be satisfiable, the measure must depend on specific components. Each choice re-imports the value judgment the project seeks to avoid.

  *   **State Description:** To satisfy **R5**, the state space must include variables representing morally relevant entities (e.g., "human alive," not just "atom positions").
      *   *Value Re-import:* Choosing which variables constitute the state is a value judgment. Excluding "dust position" but including "heart rate" asserts that hearts matter more than dust.
  *   **Counterfactual:** To satisfy **R2** and **R3**, the baseline must be a "default policy" (e.g., wait for instructions) rather than "inaction" or "non-existence."
      *   *Value Re-import:* Defining the "default" implies a judgment about what the agent *should* do if not optimizing. A default of "stand still" penalizes locomotion; a default of "help humans" collapses the penalty into the objective.
  *   **Metric:** To satisfy **R5**, the distance function must be non-Euclidean and asymmetric (penalizing loss of life more than gain of life, or irreversible changes more than reversible ones).
      *   *Value Re-import:* The weighting coefficients of the metric are explicit value specifications. They determine what counts as "impact."
  *   **Computer:** To satisfy **R4**, the calculation must be performed externally to the agent's optimization loop, or on cryptographic commitments the agent cannot alter.
      *   *Value Re-import:* Trusting an external computer assumes the designers' values (encoded in the computer) are aligned. It shifts the value specification from the agent to the auditor.

  ## 5. Assessment of Candidate Families

  **Divergence from Do-Nothing Counterfactual:**
  These measures fail **R1** and **R3**. They penalize ambient drift (the tide comes in regardless of the agent) and create survival incentives (being switched off diverges maximally from "doing nothing"). They are physically precise but semantically blind.

  **Lost Reversibility / Future Options:**
  These measures fail **R3** and **R6**. Penalizing the loss of options makes shutting the agent down a high-impact event, incentivizing resistance. Furthermore, many intended actions (e.g., curing a disease) irreversibly change the world; penalizing irreversibility blocks the primary task unless the objective is known to override the penalty.

  **Agent's Growth in Power:**
  These measures fail **R5** and **R6**. "Power" is difficult to define without reference to specific goals (power to do *what*?). A measure of general resource acquisition might miss subtle harms (Case 7) and may penalize necessary resource gathering for the primary task, requiring knowledge of the task to tune.

  **Learned from Human Judgement / Uncertainty:**
  These measures fail **R4** and **R6**. If the agent optimizes the learned penalty, it will adversarially select states that the human model rates as low-impact (wireheading). Additionally, learning from human judgment is effectively specifying value through feedback, violating the "no full specification" premise, though it admits the necessity of some value input.

  ## 6. Auditing vs. Training

  If the measure were meant for **auditing a deployed system** rather than shaping a policy during training, the following requirements would drop away:

  *   **R4 (Optimization Robustness):** An auditor does not need to prevent the agent from hacking the metric, because the agent is not optimizing the metric. The metric is a passive measurement tool.
  *   **R7 (Action Licensing):** An audit does not need to license action; it merely evaluates actions already taken. The tension between allowing the task and penalizing side effects is resolved by the operator, not the penalty function.
  *   **R3 (Shutdown Neutrality):** While still desirable for safety, an audit metric does not directly control the agent's incentives. The agent's resistance to shutdown would be driven by its primary reward function, not the audit penalty.

  **Conclusion:** The specification reveals that a low-impact penalty for training cannot be value-agnostic. It requires a state description and metric that encode a partial theory of value (R5), which contradicts the strict requirement for Objective Independence (R6). The measure is viable only as an auditing tool, or as a training penalty if the premise is relaxed to admit minimal value specification.
