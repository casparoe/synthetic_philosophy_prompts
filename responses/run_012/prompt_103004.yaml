  *Question:* Make sure it doesn't mention the dog specifically, but uses the *concept* of the dog so they have to generate the example or use the one in the prompt. Actually, the prompt says "I'd like the exam question to make them take a side." I should embed the confusion in the question stem so they don't have to guess the scenario. I will use the "borrowed cognition" framing.

