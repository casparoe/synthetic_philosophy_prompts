      *   **The Problem/Confusion:** The boundary between Popperian (internal trial-and-error) and Gregorian (cultural/tools) is blurry when the internal model is externally sourced (e.g., a trained dog, domesticated animals, AI). Is a dog running a human-installed model truly Popperian, or is it a Gregorian artifact? Does this collapse the ladder metaphor?
      *   **Constraints:**
          *   Question must force a stance (no fence-sitting).
          *   Question must not give the answer away.
          *   Model answer length: 700-800 words.
          *   Marking scheme: Specific moves required, specific muddles penalized (not a vague rubric).
          *   Time limit for student: ~45 minutes.
          *   Target audience: Senior undergraduates.

  2.  **Drafting the Question:**
      *   *Goal:* Avoid "Define the four creatures." Avoid "Which is better?"
      *   *Focus:* The hybrid nature of cognition. The source of the "inner environment."
      *   *Draft 1:* Is a trained dog Popperian or Gregorian? Discuss. (Too simple, invites definition listing).
      *   *Draft 2:* Dennett says Popperian creatures let hypotheses die in their stead. But what if the hypotheses come from outside? Does this break the ladder? (Better, but needs more punch).
      *   *Draft 3 (Final Polish):* Focus on the *locus* of the selection pressure. If the "inner environment" is populated by tools or memes from another species, does the individual organism count as Popperian, or is the *system* Popperian?
      *   *Refinement:* Let's use the "borrowed cognition" angle. The prompt asks them to evaluate the *unit* of selection for intelligence.
      *   *Final Question Wording:* Needs to be precise. "Dennett's hierarchy implies an individual organism ascends the rungs..." Challenge that individualism.

  3.  **Drafting the Model Answer:**
      *   *Thesis:* The hierarchy isn't about individual organisms but about *systems* of cognition. A trained dog is a hybrid node in a Gregorian network, not a pure Popperian agent.
      *   *Key Arguments:*
          1.  Define Popperian/Gregorian briefly (don't dwell, use them).
          2.  Identify the problem: The source of the "inner model."
          3.  Analyze the dog example: The model is human-culture (Gregorian), but the execution is internal (Popperian-like).
          4.  Resolution: The "ladder" is misleading. It's a network. The unit of intelligence is the dyad (human-dog), not the dog.
          5.  Implication: This applies to humans too (we use tools/language).
      *   *Tone:* Academic, decisive, nuanced.
      *   *Word Count Check:* Need to keep it tight to hit 700-800.
      *   *Drafting content:* Start with the tension. Move to the dog. Conclude with the systemic view.
      *   *Self-Correction during drafting:* Make sure I don't just say "it's both." I need to take a side as per the prompt's request to the students. The model answer should demonstrate *how* to take a side. I will argue that the classification applies to the *cognitive system*, not the biological substrate.

  4.  **Developing the Marking Scheme:**
      *   *Requirement:* No vague rubrics (e.g., "Good grammar," "Clear argument"). Needs specific conceptual moves.
      *   *Categories:*
          *   A-Range (Distinction): Specific moves (Systemic view, source of variation, critique of individualism).
          *   B-Range (Merit): Understands the tension but hedges or misses the systemic implication.
          *   C-Range (Pass): Defines terms correctly but treats them as fixed taxonomy/individual traits.
          *   F-Range: Misunderstands definitions (Popperian = smart).
      *   *Specific "Muddles" to penalize:*
          *   Treating the rungs as evolutionary stages of species rather than cognitive strategies.
          *   Equating Popperian with "consciousness."
          *   Refusing to choose a side.
          *   Ignoring the "source of the model" (the core confusion).

  5.  **Review and Refine:**
      *   *Check against User Persona:* The user is a biologist. They care about selection pressures and units of analysis. The marking scheme should reflect that rigor.
      *   *Check Word Count:* The model answer needs careful counting.
      *   *Check Question Difficulty:* Will a rote learner fail? Yes, because rote learning defines the four creatures. This question asks about the *boundary conditions* between two of them.
      *   *Check Tone:* The intro/outro should acknowledge the user's background (field bio -> philosophy of mind).

  6.  **Final Polish:** (Self-Correction on Model Answer Length)
