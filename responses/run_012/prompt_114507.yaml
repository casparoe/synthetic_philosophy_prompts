answer: |-
  # JOINT STATEMENT ON THE ONTOLOGY OF ARTIFACTS AND MATTER

  **Signatories:**  
  Dr. Elena Vance (Proponent of Identity Theory)  
  Dr. Marcus Thorne (Proponent of Constitution Theory)  
  **Date:** October 26, 2023

  ### I. AGREED-UPON CLAIMS (COMMON GROUND)

  We, the undersigned, affirm the following claims as the baseline for our ongoing dialectic. We agree that the following are *not* the source of our disagreement:

  1.  **The Physical Case:** There exists a spatial region $R$ occupied by a quantity of clay arranged statue-wise. We both accept the existence of the clay and the existence of the statue in the ordinary sense.
  2.  **The Squashing Intuition:** If the clay is crushed into a sphere at time $t_2$, the *statue* ceases to exist, but the *clay* continues to exist. Neither of us denies this datum; both of our theories must accommodate it.
  3.  **Spatial Coincidence:** At time $t_1$ (prior to squashing), the statue and the clay occupy the exact same spatial coordinates and share all their material parts.
  4.  **Causal Powers:** We agree that the statue and the clay do not exert duplicate causal forces. If the statue knocks over a vase, it is not the case that the vase is knocked over twice (once by the statue, once by the clay).
  5.  **Logic:** We both accept classical logic and Leibniz's Law (the Indiscernibility of Identicals) as a default principle, though we differ on whether exceptions or pragmatic modifications apply in this specific domain.

  ***

  ### II. STATEMENT OF THE DISAGREEMENT

  *We recognize that we describe the same metaphysical situation using incompatible ontological commitments. Below are our respective characterizations of the relationship between the statue ($S$) and the lump of clay ($L$) at time $t_1$.*

  | **The Identity Theorist (Vance)** | **The Constitution Theorist (Thorne)** |
  | :--- | :--- |
  | "There is exactly **one object** present. 'The Statue' and 'The Lump' are two distinct concepts or sortals that pick out this single entity under different descriptions. Identity is absolute; therefore, $S = L$. Apparent differences in persistence conditions are differences in *description*, not in the object itself." | "There are exactly **two objects** present. 'The Statue' and 'The Lump' refer to distinct entities that share the same matter at the same time. They are related by *constitution*, not identity. Therefore, $S \neq L$. Differences in persistence conditions reflect genuine metaphysical distinctions between the entities." |

  ***

  ### III. THE CRUXES: TEST CASES AND PREDICTIONS

  *We have identified three specific loci of contention. For each, we specify a concrete case and our respective truth-value predictions. We agree to avoid weasel words; our predictions are categorical.*

  | **Crux** | **Concrete Case / Argument** | **Vance (Identity) Prediction** | **Thorne (Constitution) Prediction** |
  | :--- | :--- | :--- | :--- |
  | **1. Sortal-Relativity of Counting** | **Case:** An observer points to the pedestal at $t_1$ and asks, "How many *objects* are there?" without specifying a sortal (e.g., "how many statues?" or "how many lumps?").<br><br>**Argument:** Is the question well-formed? Does "object" function as a sortal-independent count noun? | **False.** The question is ill-formed. Counting is always relative to a sortal concept. There is no absolute "number of objects." Relative to the sortal *statue*, the answer is 1. Relative to *lump*, the answer is 1. | **True.** The question is well-formed. "Object" is a sortal-independent count noun. There is an absolute fact of the matter. The answer is 2. |
  | **2. Modal Profiles (Leibniz's Law)** | **Case:** Consider the proposition $P$: "This entity could have been squashed into a ball at $t_1$ and survived."<br><br>**Argument:** Does $S$ satisfy $P$? Does $L$ satisfy $P$? If they differ, does this violate Identity? | **Same Profile.** Both $S$ and $L$ satisfy $P$ (or both fail). If intuition says the statue wouldn't survive, that intuition tracks the *concept* of a statue, not the *object*. The object itself has one modal profile. | **Different Profiles.** $L$ satisfies $P$ (True). $S$ does not satisfy $P$ (False). Because they differ in modal properties, they cannot be identical. This is a metaphysical difference, not merely conceptual. |
  | **3. Re-formation and Persistence** | **Case:** At $t_2$, $L$ is squashed into a ball (destroying $S$). At $t_3$, $L$ is reshaped into a perfect qualitative duplicate of the original $S$. Call the new statue $S^*$.<br><br>**Argument:** Is the object existing at $t_3$ numerically identical to the object existing at $t_1$? | **Yes (The Object).** The underlying object ($L/S$) persisted through $t_2$. It merely lost the property of *being a statue* temporarily. There is one continuous object throughout $t_1 \to t_3$. | **No (The Statue).** The statue $S$ went out of existence at $t_2$. $S^*$ is a numerically distinct object created at $t_3$. Only the lump $L$ is numerically identical across $t_1 \to t_3$. |

  ***

  ### IV. NOTE ON THE VERBAL DISPUTE CHARGE

  *We acknowledge the accusation (most notably associated by Eli Hirsch and others) that our debate is merely verbal.*

  **Our Joint Assessment:**
  We agree that **Crux #1 (Counting)** is likely verbal. We concede that if "object" is defined as "whatever falls under a count-noun," then Vance is right that we need a sortal to count. If "object" is defined as "maximally connected material entity," Thorne is right that there are two. We agree to stop arguing about the English word "object."

  However, we maintain that **Crux #2 (Modal Properties)** is **substantive**. Even if we fix the language, the disagreement remains regarding the *de re* modal properties of the entity in the world.
  *   **Vance** claims the world contains one thing with a specific modal essence, and our intuitions about "statues not surviving squashing" are pragmatic errors.
  *   **Thorne** claims the world contains two things with distinct modal essences, and our intuitions track reality.

  **Conclusion:** We will cease filing papers on "How many things are there?" and focus exclusively on "What are the persistence conditions of the entity/entities in region $R$?"

  __________________________  
  *Dr. Elena Vance*

  __________________________  
  *Dr. Marcus Thorne*
