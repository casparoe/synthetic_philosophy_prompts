          1.  Numbered list of agreed-upon claims (the case, uncontroversial facts, what the fight is *not* about).
          2.  The disagreement stated twice (once in Identity theorist's voice, once in Constitution theorist's voice).
          3.  The Cruxes (specific points of contention).
              *   Must include: Sortal-relativity of counting.
              *   Must include: Re-formation cases (squashing and reshaping).
              *   Can include: Other central cruxes (e.g., modal properties, persistence conditions).
              *   Format: Concrete case/argument, non-weaselly predictions for each side.
          4.  Verbal Dispute Check: Identify if any part is purely verbal and explain why.
          5.  Format: Table is fine for disagreements/cruxes.

  2.  **Deconstruct the Philosophical Positions:**
      *   **Identity Theory (Monism):** The statue *is* the lump. $S = L$. They share all properties. Apparent differences in modal properties or persistence conditions are explained away (e.g., via temporal parts, counterpart theory, or relativized identity).
      *   **Constitution Theory (Non-Identity/Pluralism):** The statue is *constituted by* the lump, but is not *identical* to it. $S \neq L$. They are distinct objects sharing matter/location. They have different persistence conditions (modal properties).

  3.  **Drafting Section 1: Agreed-Upon Claims (Common Ground):**
      *   Need to establish the scenario clearly.
      *   Need to acknowledge the "puzzle" data (squashing destroys statue but not clay).
      *   Need to clarify what they *aren't* arguing about (existence of the objects, physical location).
      *   *Drafting points:*
          1.  There is a physical object made of clay shaped like a statue.
          2.  If squashed, the artistic value/function is lost (statue ends), but the matter remains (clay survives).
          3.  Both exist in the same spatial region at time $t$.
          4.  Neither denies the physical facts.
          5.  Both agree standard logic (Leibniz's Law) applies *unless* there's a specific reason to modify it.

  4.  **Drafting Section 2: The Disagreement (Two Voices):**
      *   *Identity Theorist:* Needs to emphasize ontological parsimony. "One thing, described differently."
      *   *Constitution Theorist:* Needs to emphasize distinct persistence conditions. "Two things, sharing matter."
      *   *Constraint:* Must be signable by the respective party without feeling misrepresented.

  5.  **Drafting Section 3: The Cruxes (The Core Disputes):**
      *   *Crux 1: Sortal-Relativity of Counting.*
          *   Case: "How many things on the pedestal?"
          *   Identity: Ill-formed without a sortal. Relative identity.
          *   Constitution: Well-formed. Two things. Absolute identity.
      *   *Crux 2: Re-formation (The "Lump" survives reshaping).*
          *   Case: Squash the statue into a ball, then reshape it into the *exact* same statue shape later.
          *   Identity: Is it the *same* statue? (Usually says no, or relies on continuity). If $S=L$, and $L$ survives, does $S$?
          *   Constitution: $L$ survives. $S_1$ dies. $S_2$ is born. $S_1 \neq S_2$.
      *   *Crux 3: Modal Properties (Leibniz's Law).*
          *   Case: Could the lump have been a ball? Could the statue have been a ball?
          *   Identity: Must explain away the difference (counterparts?).
          *   Constitution: Different modal profiles prove non-identity.
      *   *Refining Predictions:* Make them sharp. No "it depends."
      *   *Verbal Dispute Check:* Is it just about the word "object"? Or is it metaphysical? Usually, proponents claim it's metaphysical (modal properties), but critics say it's linguistic (sortals). I should note the tension here.

  6.  **Review and Refine (Self-Correction):**
      *   *Tone:* Needs to be academic, precise, yet conciliatory enough to be a "joint statement."
      *   *Constraint Check:* Did I include the specific cruxes requested? Yes (Sortal counting, Re-formation).
      *   *Constraint Check:* Are predictions weaselly? Avoid "might" or "could." Use "True/False" or "Yes/No."
      *   *Constraint Check:* Verbal dispute section. Need to be careful. Most metaphysicians think it's substantive, but some (like Hirsch) think it's verbal. I should frame it as "We acknowledge the accusation..."
      *   *Formatting:* Use the requested structure (List, Statements, Table).

  7.  **Final Polish:**
      *   Ensure the Identity Theorist's statement doesn't sound like they are conceding to Constitution.
      *   Ensure the Constitution Theorist's statement doesn't sound like they are conceding to Identity.
      *   Make sure the "Common Ground" explicitly mentions the squashing case as requested ("neither denies that squashing the lump ends the statue...").

  8.  **Final Output Generation:** (Proceeding to generate response based on these steps.)
      *   *Title:* Joint Statement on the Ontology of Artifacts and Matter.
      *   *Signatories:* Dr. A. (Identity) & Dr. B. (Constitution).
      *   *Structure:* I. Common Ground, II. Statement of Disagreement, III. Cruxes & Predictions, IV. Note on Verbal Dispute.

      *(Self-Correction during drafting Crux 2)*: The prompt asks about "judgments about 'the same statue' track when a lump is squashed and later re-formed."
