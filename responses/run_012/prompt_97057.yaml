answer: |-
  # The Kalai–Smorodinsky Budget Protocol (KS-BP)
  **To:** Joint Budget Priorities Committee
  **From:** Graduate Fellow
  **Subject:** Procedure for Incremental Pool Allocation
  **Constraint:** 60-minute meeting; 2-page Provost Memo limit.

  ## Part 1: The Procedure

  This protocol replaces "splitting the difference" with a principled method that equalizes **proportional satisfaction** relative to each constituency's maximum feasible outcome. It requires no game theory expertise, only arithmetic.

  ### Step 1: Establish the Disagreement Point (Status Quo)
  **Question:** "If this committee fails to recommend an allocation, how much *new* money does each constituency receive from this specific pool?"
  **Data Required:** A single number for each side (usually $0).
  **Committee Judgment:** **STOP.** If the status quo involves mandatory cost-of-living adjustments or baseline obligations that *must* be met before this pool is touched, those must be subtracted from the pool now. This is a value judgment about baseline rights, not calculation.
  **Definition:** $D = (0, 0)$ in incremental dollars.

  ### Step 2: Validate the Ideal Points (Requests)
  **Question:** "What is the specific dollar amount required to fully satisfy your incremental needs this cycle?"
  **Data Required:** Requested Amount ($R_L$ for Library, $R_T$ for Teaching Labs).
  **Committee Judgment:** **STOP.** The committee must vote on the *legitimacy* of the requests. If a request includes padding or non-essential items, the committee must trim it *before* calculation. KS treats the "Ideal Point" as a hard ceiling of utility; inflating it manipulates the outcome.
  **Definition:** The Ideal Point ($I$) is the vector $(R_L, R_T)$.

  ### Step 3: Determine the Feasible Utopia
  **Question:** "If one constituency received the entire pool, what percentage of their request would be fulfilled?"
  **Data Required:** The Total Pool ($B$).
  **Calculation:**
  1.  **Library Max Utility ($U_L^{max}$):** $\min(R_L, B) / R_L$. (Capped at 1.0).
  2.  **Labs Max Utility ($U_T^{max}$):** $\min(R_T, B) / R_T$. (Capped at 1.0).
  *Note: This normalizes the claims. A \$1M request for a \$100k pool is worth less (in utility) than a \$100k request for a \$100k pool.*

  ### Step 4: Calculate the KS Allocation
  **Goal:** Find allocations $x_L$ and $x_T$ such that $x_L + x_T = B$ and the ratio of achieved utility to max utility is equal for both.
  **Formula:**
  $$ \frac{x_L / R_L}{U_L^{max}} = \frac{x_T / R_T}{U_T^{max}} $$
  **Simplified Calculation for Committee:**
  1.  Calculate the **Weight** for each side: $W_L = R_L \times U_L^{max}$ and $W_T = R_T \times U_T^{max}$.
      *(Note: Since $U^{max} = \min(R, B)/R$, this simplifies to $W = \min(R, B)$.)*
  2.  **Allocation:**
      $$ x_L = B \times \frac{W_L}{W_L + W_T} $$
      $$ x_T = B \times \frac{W_T}{W_L + W_T} $$
  *Interpretation:* You are splitting the pool in proportion to the **maximum amount each side could physically absorb** (capped at the pool size).

  ### Step 5: Check for Procedural Limits
  **Stop Point (Non-Convexity/Unknown Frontier):** If spending on one side creates synergies for the other (e.g., Library data supports Lab research), the frontier is not a straight line ($x+y=B$).
  **Action:** If synergies are claimed, the committee must estimate the dollar value of the synergy and add it to the pool, or hand the decision to the Provost. KS assumes a linear trade-off.
  **Stop Point (>2 Constituencies):** KS is mathematically defined for two players.
  **Action:** If a third constituency emerges, use **Sequential Pairwise KS**. Combine two constituencies into a bloc, solve for the bloc vs. the third, then solve within the bloc. Hand to Provost if bloc formation is politically contentious.

  ### Step 6: The Provost Handoff
  **Condition:** If the calculated allocation violates a university-wide policy (e.g., "Safety Labs must receive minimum \$X") or if the committee rejects the legitimacy of the requests in Step 2.
  **Action:** Submit the KS calculation *and* the specific value judgment that overrides it. The Provost decides the value; the Committee provides the baseline calculation.

  ---

  ## Part 2: Theoretical Justification (For the Provost Memo)

  **Why Kalai–Smorodinsky and not Nash Bargaining?**
  Nash Bargaining maximizes the *product* of gains. It requires us to measure "risk aversion" or the "curvature of utility" (how much pain is felt for each lost dollar). This requires data we do not have.
  KS Bargaining maximizes *proportional satisfaction*. It asks: "If your best-case scenario is getting 100% of your request, and mine is getting 50% of mine (because my request is huge), we should split the pool so that we both achieve the same *percentage* of our best-case scenario." It is robust, requires only request data, and satisfies **Individual Monotonicity** (if the pool grows, no one loses).

  **Why this procedure may ignore Need or Historical Injustice:**
  The KS solution is **ahistorical**. It looks only at the current Pool ($B$) and current Requests ($R$). It does not integrate a variable for "Underfunding in Years $t-1$ through $t-5$."
  *   **Implication:** If the Library has been starved for a decade but submits a small request, and the Labs were overfunded but submit a large request, KS may favor the Labs simply because their "maximum absorbable amount" is higher.
  *   **Correction:** To account for injustice, the Committee must adjust the **Request** in Step 2 to reflect "Reparative Need" rather than "Current Project Cost." This is a value judgment, not a calculation.

  **Where Judgment Cannot Be Eliminated:**
  1.  **Legitimacy of Requests:** KS treats requests as utility caps. Inflated requests manipulate the weights.
  2.  **Definition of Status Quo:** Deciding if the baseline is \$0 or a mandatory COLA.
  3.  **Policy Constraints:** KS cannot respect minimum thresholds without manual intervention.

  ---

  ## Part 3: Case Simulations

  ### Case 1: Routine Split (Symmetric Requests)
  *   **Pool:** \$100,000.
  *   **Library Request:** \$60,000.
  *   **Labs Request:** \$60,000.
  *   **Calculation:**
      *   $U_L^{max} = 60k/60k = 1.0$. (Can be fully satisfied if Labs get 0).
      *   $U_T^{max} = 60k/60k = 1.0$.
      *   Weights: $W_L = 60k, W_T = 60k$.
      *   Split: 50/50.
  *   **Outcome:** Library \$50,000; Labs \$50,000.
  *   **Why:** When requests are symmetric and below the pool cap, KS collapses to an equal split. It validates the intuition of "splitting the difference" but grounds it in proportional satisfaction rather than arbitrary compromise.

  ### Case 2: Asymmetric Aspirations (The "Expensive" Side)
  *   **Pool:** \$100,000.
  *   **Library Request:** \$40,000 (Small digitization project).
  *   **Labs Request:** \$200,000 (Major equipment renovation).
  *   **Calculation:**
      *   $U_L^{max} = 1.0$ (Pool > Request).
      *   $U_T^{max} = 100k/200k = 0.5$ (Pool < Request).
      *   Weights: $W_L = \min(40k, 100k) = 40k$. $W_T = \min(200k, 100k) = 100k$.
      *   Total Weight: 140k.
      *   Library Share: $100k \times (40/140) = \$28,571$.
      *   Labs Share: $100k \times (100/140) = \$71,429$.
  *   **Outcome:** Library gets 71% of request; Labs get 35% of request.
  *   **Why:** KS awards the larger *absolute* share of the pool to the side with the larger feasible aspiration (Labs). However, it equalizes the *relative* satisfaction ratio relative to their maximum possible utility. The Labs get more money because their "dream" is more expensive, but the Library is "happier" (higher % fulfillment). This prevents the smaller request from being drowned out, while acknowledging the scale of the larger need.

  ### Case 3: Politically Unacceptable (Historical Injustice)
  *   **Context:** Library has been underfunded for 5 years. Labs received a major endowment last year.
  *   **Pool:** \$100,000.
  *   **Requests:** Both request \$100,000.
  *   **Calculation:**
      *   Weights are equal ($100k$ each).
      *   Split: 50/50.
  *   **Outcome:** Library \$50,000; Labs \$50,000.
  *   **Committee Reaction:** Unacceptable. The Library needs 80% to recover baseline capacity.
  *   **Why:** KS is blind to $t-1$. It treats the current request as the sole measure of need.
  *   **Procedure Action:** **Stop and Handoff.** The Committee must explicitly vote to override the KS calculation based on "Historical Equity." The recommendation to the Provost must state: "KS recommends 50/50. Committee recommends 80/20 due to baseline capacity risks not captured in incremental requests."

  ---

  ## Part 4: Limitations and Translation Loss

  **Features Surviving Translation:**
  1.  **Scale Invariance:** If all requests and the pool double, the allocation percentages remain identical.
  2.  **Individual Monotonicity:** If the pool increases, no constituency receives less than before.
  3.  **Ideal Point Benchmark:** The procedure retains the core KS insight that allocations should be proportional to the *best possible outcome*, not just marginal trade-offs.

  **Features Lost or Manufactured:**
  1.  **Cardinal Utility:** KS requires comparable utility scales. We manufacture this by assuming \$1 of request = 1 unit of utility. This assumes linear utility of money up to the request cap. If the Library derives diminishing returns from the 10th dollar while the Labs derive increasing returns, KS misfires.
  2.  **Risk Sensitivity:** Unlike Nash, KS does not account for the "pain" of losing funding. A unit facing closure (high pain) is treated the same as a unit facing stagnation (low pain) if their requests are identical.
  3.  **Frontier Shape:** We assume a linear frontier ($x+y=B$). If funds are non-fungible (e.g., Library money cannot buy Lab equipment), the frontier is non-convex. The procedure handles this by capping utility at the request, but it cannot optimize synergies.

  **Final Warning:**
  This procedure manufactures a "scientific" number from political requests. It is a tool for **consistency**, not **truth**. It ensures that if we treat the Library one way today, we treat them the same way tomorrow given similar requests. It does not ensure justice. Justice remains the Committee's responsibility in Step 2 (Validating Requests) and Step 6 (Provost Handoff).
