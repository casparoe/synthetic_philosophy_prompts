answer: |-
  **Title:** The Celestial Skeptic: Rule-Following and the Demotion of Pluto

  **I. Introduction: The Paradox in the Kuiper Belt**

  In August 2006, the International Astronomical Union (IAU) convened in Prague to resolve a taxonomic crisis. The discovery of Eris, a trans-Neptunian object more massive than Pluto, forced a dilemma: accept a solar system with ten, eleven, or eventually fifty planets, or restrict the extension of the term "planet." The Assembly voted to adopt a definition requiring a body to (1) orbit the Sun, (2) possess sufficient mass for hydrostatic equilibrium (roundness), and (3) clear its orbital neighborhood. Pluto failed the third condition and was reclassified as a "dwarf planet."

  This episode is frequently treated as a skirmish in the sociology of science or a public relations failure. However, viewed through the lens of Saul Kripke's *Wittgenstein on Rules and Private Language*, the Pluto controversy is a large-scale instantiation of the rule-following paradox. Kripke argues that no fact about an individual's past usage of a term determines its correct application in the future. The "skeptical solution" posits that meaning is secured not by private facts but by community agreement in judgments.

  The 2006 IAU decision offers a unique stress test for this framework. Unlike the organic evolution of language Kripke describes, the new definition of "planet" was legislated by a specific body via a vote. Furthermore, the dissenting astronomers claimed the IAU had not clarified the rule but *changed the subject*. This paper argues that the Pluto episode confirms Kripke's negative thesis—that there was no pre-existing fact of the matter regarding Eris—but exposes a tension in the skeptical solution. When rule-following is institutionalized rather than organic, the "community" whose dispositions fix meaning becomes ambiguous, and the distinction between discovering a rule and legislating one collapses. Ultimately, the case suggests that while Kripke correctly diagnoses the indeterminacy of the past, his arithmetic model of rule-following obscures the role of authority in taxonomic language games.

  **II. The Skeptical Challenge: Was There a Fact Before 2006?**

  To apply Kripke's paradox, we must identify the rule-follower, the rule, and the finite past. The rule-followers are the community of astronomers (and the laypublic who defer to them). The rule is the implicit definition of "planet" in force from 1930 (Pluto's discovery) to 2005. The finite past consists of the classification of the eight classical planets and Pluto, alongside the reclassification of Ceres in the 19th century.

  The skeptical challenge asks: What fact about the usage of "planet" prior to 2006 fixes whether Eris falls under its extension? The pro-Pluto faction argued that the historical usage tracked intrinsic properties (roundness, orbiting the Sun). Under this reading, "planet" functions like *green*; if Eris is round and orbits the Sun, it is a planet. The pro-IAU faction argued that historical usage implicitly tracked dynamical dominance. Under this reading, "planet" functions like *apex predator*; if Eris shares its zone with comparable bodies, it is not a planet.

  Kripke's insight is that both sides can marshal evidence from the past. The past uses of "planet" were compatible with multiple future projections. There was no mental state, no Platonic form, and no physical fact in 1930 that settled the status of a Kuiper Belt Object discovered in 2005. The arrival of Eris created a "quus" moment: up until 2005, the function *planet(x)* yielded "True" for the known nine bodies. But did the function mean "intrinsic round body" or "dynamically dominant body"? The finite data set could not distinguish between these functions.

  In this regard, the Pluto case bears out the paradox. The intensity of the dispute stemmed from the intuition that there *must* be a fact of the matter. When Alan Stern, Principal Investigator of the *New Horizons* mission, argued that the IAU definition was "sloppy" and that Pluto remained a planet, he was speaking as if the meaning of "planet" was fixed independently of the vote. The skeptical hypothesis suggests Stern was under an illusion: he believed he was following a rule that, in the novel case of Eris, had no established path. The fight was not about who was right about the facts of the solar system, but about which projection of the past usage would be accepted going forward.

  **III. The Community and the Vote**

  If there is no fact of the matter, Kripke's skeptical solution turns to the community. Meaning is constituted by agreement in judgments; we check each other to ensure we are "going on in the same way." Here, the Pluto case complicates the theory.

  Kripke's model assumes an organic community where dispositions align through shared training and practice. The IAU vote, however, was a performative speech act by a self-selected subset of the community. Only about 424 astronomers voted in the final session, out of a membership of nearly 10,000, and a significant portion of working planetary scientists subsequently signed petitions rejecting the definition.

  This raises a problem for the dispositional account. Whose dispositions fix the meaning?
  1.  **The Voters:** If meaning is fixed by the 424 hands raised, then meaning is subject to procedural quorum rules. This makes the "necessity" of rule-following contingent on parliamentary procedure.
  2.  **The Dissenters:** If the dissenting planetary scientists (who work directly with these bodies) are the relevant community, the IAU vote failed to secure agreement.
  3.  **The Uptake:** If the community includes textbooks, teachers, and the public, the meaning was fixed only retrospectively, once the new definition was adopted by institutions.

  The IAU committee reportedly considered a proposal that a planet is "whatever enough people are willing to call a planet." They rejected this in favor of the dynamical definition. This is ironic because the vote itself *was* a mechanism to determine what enough people were willing to accept. Kripke's community view relies on implicit agreement. A vote makes the agreement explicit and coercive. If I vote against a definition, but the majority passes it, am I "misusing" the word if I continue to use the old definition?

  In Kripke's arithmetic example, if I calculate $68 + 57 = 5$, the community corrects me. I am wrong because I deviate from the shared practice. In the Pluto case, the IAU voted to *change* the practice. This suggests that for taxonomic terms, the "community" is not just a group checking dispositions, but a hierarchy with the authority to stipulate new dispositions. Kripke's theory struggles to distinguish between a community correcting a mistake (rule-following) and a community changing the rules (legislation). In Prague, the IAU did both: they claimed to be clarifying the existing rule (correcting a mistake in understanding) while simultaneously stipulating new criteria (legislation).

  **IV. The Recurrence of Indeterminacy**

  A crucial test of the IAU's move is whether the new definition solves the skeptical problem or merely relocates it. Kripke argues that stipulating a new rule does not escape the paradox, because the new rule must also be interpreted. The IAU definition inherits the very indeterminacy it was meant to resolve.

  Consider the third criterion: "clearing the neighborhood." This is not a binary property but a graded one. As the user prompt notes, Neptune shares its orbit with Pluto (in a resonance), and Earth shares its zone with near-Earth asteroids. The IAU relies on a dynamical parameter ($\Lambda$) to measure clearing, but this metric was not explicit in the resolution text. Furthermore, a Mars-sized body in the Oort cloud would physically fail to clear its orbit due to the vast distances involved, despite being geologically complex.

  If an astronomer in 2030 discovers a Mars-sized Oort object, will the 2006 rule determine its status? Kripke would say no. The term "clear the neighborhood" is subject to the same plus/quus ambiguity as "planet" was. Does "clear" mean "gravitationally dominate 99% of the mass" or "have no comparable bodies in resonance"? The past applications of the 2006 definition (Pluto, Eris, Ceres) are too few to fix the extension for all possible future cases.

  This confirms the paradox: the attempt to freeze meaning via stipulation fails because language use is inherently open-ended. The IAU believed they were fixing the extension, but they merely shifted the locus of indeterminacy from "what is a planet" to "what is clearing the neighborhood." The dispute did not end in 2006; it went underground, waiting for the next anomalous discovery.

  **V. What the Case Shows About the Theory**

  Does the Pluto episode confirm Kripke's theory, present an anomaly, or reveal an unanticipated case?

  **1. Confirmation of the Negative Thesis:**
  The case strongly supports Kripke's claim that there is no fact of the matter in the past that determines future use. The fact that reasonable experts could disagree on the status of Eris based on the same historical data demonstrates that the meaning of "planet" was not fixed by prior usage. The anxiety of the astronomers—the feeling that they *ought* to classify Eris a certain way but couldn't find the ground for it—is the phenomenological signature of the skeptical paradox.

  **2. Anomaly in the Skeptical Solution:**
  However, the case challenges the communitarian solution. Kripke's model works best for practices that are *conservative*, like arithmetic, where the goal is to maintain consistency with past performance. Scientific taxonomy is *progressive*; its goal is to adjust categories to fit new data and theoretical frameworks.
  In arithmetic, a vote cannot change the sum of $68 + 57$. In taxonomy, a vote *can* change the extension of "planet." This suggests that the "normativity" of scientific terms is different from the normativity of logical or arithmetic terms. The IAU vote worked not because it discovered the shared disposition of the community (many disagreed), but because it wielded institutional authority. Kripke's theory has no place for authority distinct from agreement. It assumes that if the community agrees, that constitutes meaning. It does not account for a scenario where a subset of the community *imposes* meaning on the rest, and the rest comply for pragmatic reasons (grant funding, publication standards) rather than shared judgment.

  **3. Vagueness vs. Indeterminacy:**
  Is this just a case of vagueness (Sorites paradox)? A flat appeal to vagueness would say "planet" is a fuzzy concept, and the IAU drew a sharp line for convenience. Kripke's account adds something crucial: it explains the *normative force* of the dispute. If it were mere vagueness, astronomers would say, "It's a borderline case, call it what you like." Instead, they argued, "You are *wrong*." They treated the classification as truth-apt. Kripke explains why they felt compelled to find a fact even when none existed. However, Kripke's comparison to arithmetic dresses up what is ultimately a fight about authority. In arithmetic, the "community" checks me because we share a form of life. In astronomy, the IAU checked the dissenters because they hold the charter for naming. The "correctness" of the IAU definition is not grounded in shared dispositions, but in institutional power.

  **VI. Conclusion: Authority and the Limits of the Form of Life**

  The demotion of Pluto validates Kripke's skepticism about the past: there was no fact in 1930 that settled the status of Eris in 2006. The extension of "planet" was indeterminate until the IAU acted. However, the mechanism of that resolution exposes a limit in Kripke's skeptical solution.

  Kripke treats rule-following as a horizontal practice among equals checking each other's dispositions. The Pluto case reveals a vertical structure in scientific language, where a governing body can legislate usage. When the IAU voted, they did not merely locate a pre-existing agreement; they created a new normative reality. Those who continue to call Pluto a planet are not necessarily "misusing" the word in a Kripkean sense; they are refusing to recognize the authority of the legislating body.

  This suggests that for institutional language games, meaning is not fixed solely by community dispositions, but by the intersection of disposition and authority. Kripke's arithmetic analogy fails here because arithmetic has no legislature. The Pluto episode shows that when the "form of life" includes a hierarchy, the "community view" must be amended to account for who has the power to speak for the community. The paradox remains—there is no fact of the matter—but the solution is not just agreement. It is agreement enforced by stipulation. In the end, Pluto is not a planet not because the universe dictates it, nor because our shared dispositions inevitably lead there, but because the IAU had the gavel. Kripke explains why the gavel was necessary; he does not fully explain why the gavel suffices.
