  Second, computational irreducibility. Stephen Wolfram argues that for many deterministic systems, there is no mathematical shortcut to the future. To know the state at step *N*, you must compute every step from 1 to *N*. There is no formula to jump ahead. Running the simulation takes as much time and energy as the system itself evolving. Prediction becomes indistinguishable from observation; you must wait for the event to happen to know it happens. The clock implies a shortcut exists—that the laws are simple equations solvable in closed form. Many are not. This directly contradicts the idea that a calculator can "read off" the future faster than time passes. A clock lets you push the hands; irreducibility says you must wait for the tick.

  Third, undecidability. Certain questions about deterministic systems are formally undecidable, analogous to the halting problem. No algorithm can determine if a specific state will ever be reached. This isn't a lack of data; it's a logical limit on knowledge within formal systems. Determinism does not guarantee knowability. Recent proofs in physics, such as the undecidability of the spectral gap, show this applies to material reality, not just abstract math.

  Fourth, the nature of the "gears." Quantum mechanics suggests reality isn't gear-like. Even if deterministic (e.g., Bohmian mechanics), the state space is high-dimensional and non-local, lacking the modular transparency of clockwork. You cannot isolate a "gear" without affecting the whole.

  Finally, the observer problem. A clock is read from outside. An observer within the universe is part of the causal chain. Their prediction influences the outcome (self-reference), creating feedback loops no simple clock accommodates. The clockwork image assumes a view from nowhere, which is physically impossible. The calculator is part of the calculation, consuming resources required for the calculation itself. To simulate the universe, the computer must be larger than the universe. Furthermore, computation generates heat (Landauer's principle). A perfect predictor would thermally overwhelm the system it predicts. The clock is passive; the predictor is active and disruptive.

  **Which breaks matter for his conclusion**

  The absence of a Clockmaker is cosmetic; naturalism doesn't need design. The modularity of gears versus fields is significant but secondary; field equations can still be deterministic. The fatal breaks are those attacking the link between determination and knowability.

  Computational irreducibility is the strongest blow. If the only way to know the future is to simulate every step, and the simulation requires equal time/energy to the event, then "prediction" loses its meaning. You cannot know the future *in advance*; you can only witness it. This destroys the "calculator" image entirely.

  Chaotic sensitivity matters if infinite precision is physically impossible. If the universe forbids specifying initial conditions beyond a certain bit-depth, the "engineering limitation" becomes a law of nature. The future is fixed, but the map cannot match the territory closely enough to navigate it.

  Undecidability is fatal for specific questions. If no algorithm can determine if a state occurs, the future is not "readable" even by a Demon.

  The observer/embeddedness issue is crucial. If the predictor is part of the system, self-reference creates paradoxes that simple clockwork ignores.

  Source A's claim rests on predictability being *possible* even if not practical. Irreducibility and undecidability show it is impossible *in principle*. Chaos shows the initial data required may not exist physically. These breaks sever the link between "fixed" and "foreseeable," leaving determinism intact but stripping it of its prophetic power. The distinction between ontological determinism (the future is one way) and epistemic predictability (we can know it) is where the clockwork fails. It conflates the territory with the map.

  **Verdict**

  The conclusion does not survive. Source A conflates ontological determinism with epistemic predictability. The clockwork analogy sustains the former but fails to license the latter. The universe may be a determined mechanism, but that does not entail it is a legible one.

  The phrase "in principle" is doing illegitimate work here. It functions as a promissory note backed by classical intuition rather than physical or logical reality. If computational irreducibility holds, there is no principle by which the future can be compressed into a present calculation. If infinite precision is physically undefined, there is no principle state to calculate from. "In principle" usually implies "absent contingent obstacles," but here the obstacles are constitutive of the system's logic.

  Therefore, the claim that talk of "open alternatives" is a confusion remains debatable. While alternatives may not be ontologically real, they are epistemically necessary. We must act as if the future is open because we cannot compute it. The clockwork image grants a God's-eye view that is unavailable to any agent within the system. Determinism might be true, but the "readability" thesis is false. The future is fixed, but it is not written in a language we can translate before speaking it.

  **A better picture**

  Replace the clock with a self-writing tapestry or an unfolding computation. Imagine a loom where the pattern is determined by the weaving rules, but the design cannot be seen until the thread is pulled. Or better: a universal computer running a program. The output is determined by the code and input, but due to irreducibility, the only way to know the output is to run the program.

  This preserves determinism (the code doesn't change) without implying foresight (you can't skip steps). It captures the "unfolding" nature of time without suggesting the endpoint is accessible from the start. The universe isn't a static mechanism waiting to be read; it is a process that generates its own state sequentially. This image respects the limit that the simulation cannot be smaller or faster than the system itself. It keeps the necessity of the clockwork but accepts the opacity of the complex system.
