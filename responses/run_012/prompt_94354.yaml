      *   *Idea 3: Predictive Success.* If it predicts well, attribute belief (Dennett). *Problem:* Doesn't distinguish between *useful fiction* and *ontological claim*. The prompt asks to distinguish these.
      *   *Idea 4: Persistence.* Beliefs must endure over time. *Problem:* Stateless systems (some APIs) challenge this. Is it a dealbreaker?
      *   *Idea 5: Veridicality/Truth.* Beliefs aim at truth. *Problem:* AI hallucinates. Does false belief count? Yes, humans have false beliefs. But systematic deception?
      *   *Idea 6: Integration.* Beliefs must integrate with other states (desires, other beliefs). *Problem:* Fragmentation is common in humans too.
      *   *Idea 7: The "Copy Divergence" Case.* If 1000 copies exist, do they share one belief set? *Insight:* This challenges the *individuation* of the believer.
      *   *Idea 8: Human Intuition.* Must match folk psychology. *Problem:* Folk psychology is inconsistent. Do we codify the bias or correct it?
      *   *Selection:* I need to select the ones that create tension. I need to ensure the "Copy Divergence" case is central. I need to make sure the distinction between instrumentalism and realism is a criterion, not a conclusion.

  3.  **Drafting the Specification (Iterative Refinement):**
      *   *Req 1: Behavioral Sufficiency vs. Necessity.* Must handle the "Chinese Room" style worry. (Motivation: Behavioral equivalence).
      *   *Req 2: Ontological Commitment.* Must specify if it's describing reality or just a tool. (Motivation: Intentional Stance distinction).
      *   *Req 3: Temporal Stability.* Must address statelessness. (Motivation: Persistent internal state).
      *   *Req 4: Dissociation Handling.* What happens when words $\neq$ actions? (Motivation: Deception/Sycophancy).
      *   *Req 5: Indeterminacy Resolution.* Must offer a principle for choosing between incompatible interpretations. (Motivation: Quinean indeterminacy).
      *   *Req 6: Folk-Psychological Alignment.* Must explain why we hesitate with some behavioral matches (e.g., thermostats). (Motivation: Empirical psychology).
      *   *Req 7: Individuation of the Believer.* The Copy Divergence case. This is the new constraint.

  4.  **Identifying Incompatibilities (The "Impossibility Theorem"):**
      *   *Conflict A:* Folk Psychology (Req 6) often relies on "inner life" intuitions that Behavioral Sufficiency (Req 1) ignores.
      *   *Conflict B:* Temporal Stability (Req 3) vs. Distributed Individuation (Req 7). If the "system" is the abstract code, it has no state. If it's the instance, it fragments.
      *   *Conflict C:* Indeterminacy Resolution (Req 5) vs. Ontological Commitment (Req 2). If beliefs are real states, there should be a fact of the matter. If instrumental, indeterminacy is fine.
      *   *Major Tension:* The demand for *Realism* (it's a real state) + *Behavioral Sufficiency* (output is enough) + *Folk Alignment* (we don't attribute to thermostats) creates a triangle of inconsistency. You can't have all three.
      *   *Specific to Prompt:* The Copy Divergence case creates a tension between *Public Interface Identity* (one name) and *Internal State Divergence* (many beliefs). A theory must either fragment the agent or deny the belief attribution.

