prompt: |-
  You are a philosopher of mind and cognitive scientist specializing in the foundations of mental-state attribution, and I would like you to work through this carefully and systematically rather than reaching for a familiar survey answer. Begin with a short scratchpad in which you brainstorm the candidate requirements before settling on a final list, so that I can see which you considered and set aside; then give the polished specification.

  I am writing on when, if ever, it is legitimate to attribute beliefs — and other propositional attitudes — to artificial systems. Before I commit to any particular account, I want the specification: a statement of what any adequate theory of belief attribution to AI systems must deliver. I am not asking for a defense of one theory here; I want the criteria against which all of them should be measured, and I want them to be demanding enough that they could actually exclude candidates.

  Each item in your final list should state the requirement itself, the case, result, or consideration that motivates it, and whether the requirement is non-negotiable or merely a preference of one camp. Your list should address at least the following, with the motivating case behind each:

  - Behavioral-equivalence cases — systems whose outputs match those of a believer without anything resembling the internal machinery;
  - The difference between the intentional stance as a predictive strategy and belief ascription as a claim about a system's internal states;
  - Systems with no persistent internal state across interactions, where attitude-talk seems to pick out nothing that endures;
  - Cases in which a system's verbal self-report and its behavioral dispositions come apart — deception, sycophancy, strategic underperformance, and the like;
  - The indeterminacy of attitude attribution, where many incompatible ascriptions fit the same body of behavior equally well;
  - Consistency with the empirical psychology of how humans actually attribute beliefs, including our willingness to attribute them on thin evidence and our reluctance to attribute them to some entities that pass every behavioral test.

  In addition, I want the list to accommodate a case I have not seen discussed and that I believe any theory worth having must handle. Consider a system instantiated in many copies whose internal states diverge over time, so that "the system believes that P" may be true of some copies and false of others at the same moment, while all copies answer to a single public name and interface. Say precisely what a theory of attribution must do about this kind of distribution, and whether it counts as a genuine requirement or as a puzzle the theory should be permitted to dissolve.

  Then — and this is the part I most want — identify any subset of the requirements that cannot be jointly satisfied, and explain why. If the list as a whole turns out to be unsatisfiable, that is itself the result I need, so do not smooth it over.

  Finally, assess only briefly how Dennett's intentional stance, an eliminativist or as-if instrumentalism, and the view that current large language models genuinely hold beliefs fare against the list. Keep this part short and sketchy; the criteria are the deliverable, and I will do the full comparison myself.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

