answer: |-
  Dear Colleague,

  It was a pleasure discussing the upcoming mock final with you last week. As promised, here is the draft material for the low-impact AI question I mentioned. I have structured this as a single document containing the exam question, a model answer, and the marking scheme, all written in continuous prose to match the format you requested for our internal review. Please let me know if the tone or depth aligns with what we discussed.

  The exam question is as follows. You are designing an intelligent agent tasked with achieving a specific objective while minimizing its impact on the rest of the world. The standard proposal is to penalize the agent based on the difference between the world state after it acts and the world state had it not acted. However, measuring this difference is problematic. Write an essay addressing the following. First, state the core dilemma regarding how to measure this difference without relying on human values. Second, analyze two candidate definitions of impact: one based on physical changes or state-space distance, and one based on preserved options or reachability. For each definition, explain what it presupposes about value or importance. Third, consider the problem of the baseline, noting that doing nothing is not well-defined and that a pure impact penalty encourages inaction. Finally, reach a defended verdict on whether a truly value-free definition of side-effect avoidance is possible. Do not end on a hedge; you must argue either that it is possible and how, or that it is impossible and why.

  Below is the model answer I envision, which should take a student about fifty minutes to produce.

  The core dilemma of low-impact AI is that measuring change requires a metric, and any metric implicitly encodes a theory of value. To say an agent should leave the world alone is to say it should minimize change, but change cannot be measured neutrally. If we attempt to define impact without referencing human preferences, we either count trivialities as catastrophic or fail to recognize genuine harms. The first candidate definition measures impact physically, perhaps by counting displaced atoms or changed pixels. This approach presupposes that all physical changes are equally significant. However, a breeze stirring a million leaves displaces more atoms than a single irreversible harm to a person. By treating all physical perturbations as equal, this measure fails to distinguish between noise and damage, effectively presupposing that the texture of reality matters more than the outcomes within it. It collapses because it cannot differentiate between a significant event and a chaotic background fluctuation without importing a value judgment about which changes matter.

  The second candidate defines impact as the reduction of future options or reachability. Here, an agent is low-impact if it leaves the future as open as possible for all agents. This presupposes that flexibility is inherently valuable and that the status quo is the neutral baseline. However, this smuggles in a substantive preference for preserving existing possibilities. If the world contains a pending disaster, preventing it requires closing off the option where the disaster occurs. An agent optimizing for option preservation might decline to intervene in something bad precisely because intervening would be high-impact relative to the baseline of inaction. Furthermore, this measure assumes that the current distribution of power and capability is the one worth preserving. It presupposes that maintaining the reachability of all agents is good, even if some agents intend harm. Thus, the option-based measure is not value-free; it values flexibility and the status quo over specific outcomes.

  The problem of the baseline further complicates any value-free definition. A world with no agent is not the same as a world containing an idle agent, and other agents are acting in the baseline too. Consequently, doing nothing is not a well-defined counterfactual. If impact is only a penalty term beside the goal, the agent faces a trade-off between achieving its objective and minimizing change. A pure impact minimizer would simply do nothing, scoring perfectly on impact but failing its goal. Therefore, the system must weigh impact against performance, and that weighting is itself a value judgment. There is no neutral setting for this trade-off. Deciding how much impact is acceptable to achieve a goal requires knowing how much the goal matters relative to the disturbance caused.

  Ultimately, a value-free definition of side-effect avoidance is impossible. Every measure of impact either counts the wrong things, like leaves moving, or presupposes the right things, like option preservation. The physical measure fails because it lacks a theory of importance, while the option measure fails because it assumes flexibility is always paramount. Both require a prior understanding of what matters to distinguish signal from noise. Even the decision to penalize impact at all implies that the current state of the world is preferable to a changed state, which is a conservative value judgment. We cannot formalize leaving the world alone without first defining what parts of the world are worth leaving alone. Therefore, impact measurement is not a substitute for value specification but a dependent variable of it. We must accept that avoiding side effects requires knowing what effects are bad, and that knowledge is inherently axiological.

  Regarding the assessment of this question, I propose a marking scheme out of twenty-five marks divided across five must-hit points. The first point awards five marks for clearly stating the core dilemma, specifically that measuring change requires a metric which implies value. Students typically miss this by vaguely stating that impact is hard to measure without explaining why the measurement itself is value-laden. The second point awards five marks for analyzing the physical measure, noting that it treats all changes equally and fails on trivialities like wind versus harm. A common error here is describing the measure without explaining why it fails to capture importance. The third point awards five marks for analyzing the option-based measure, identifying that it presupposes flexibility is good and creates a status quo bias. Students often miss the implication that this prevents beneficial intervention. The fourth point awards five marks for addressing the baseline and trade-off problem, noting that doing nothing is ill-defined and pure impact minimization leads to inaction. Many students fail to mention that the trade-off weight is itself a value judgment. The fifth point awards five marks for reaching a defended verdict on the possibility of value-free definition. To earn these marks, the student must take a stance rather than hedging, and weaker answers typically conclude that it is difficult rather than impossible or possible with clear reasoning. This structure ensures that a strong answer is clearly distinguishable from one that merely says impact measures are hard because values are hard, as it demands specific engagement with the mechanisms of failure.

  I hope this draft serves our needs well. I look forward to your feedback.

  Best wishes
