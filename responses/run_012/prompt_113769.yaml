answer: |-
  This is a fantastic argument, and your friend has essentially reconstructed a skeptical puzzle that haunts meta-ethics and philosophy of action. It's a variation on the "Problem of Creeping Mentalism" or a skepticism argument derived from the internalism/externalism debate.

  You are right to be suspicious. The argument is valid (the steps follow), but it is **unsound**. It proves too much. If this argument works for moral worth, it works for *everything*—perception, knowledge, and ordinary action.

  Here is the breakdown of where the argument breaks, why it looked plausible, and what you pay to fix it.

  ### The Diagnosis: Step (5) is the Trick, Step (3) is the Engine

  The argument relies on two heavy load-bearing walls.
  1.  **Step (3)** is the **Humean Theory of Motivation**: Facts (world) cannot cause motion; only States (mind) can.
  2.  **Step (5)** is the **Exclusion Principle**: Because the internal state is sufficient to produce the action even if the fact is absent (the "swap test"), the fact is explanatorily irrelevant to the action.

  **The break happens at Step (5).**

  Step (5) claims that because the internal state is the *proximate cause*, the external fact cannot be part of the *reason*. This is a fallacy of explanatory exclusion. Just because a mental state mediates your contact with the world doesn't mean the world drops out of the explanation.

  **Why it looked fine:**
  It appeals to a very intuitive picture of causation: *Billiard balls.* If Ball A hits Ball B, Ball B moves. If I put a ghost wall between them that looks exactly like empty space, and Ball B still moves (magic), then Ball A didn't do it. Your friend is treating the mind like a ghost wall that screens off the world. It feels like if the internal machinery is identical, the external cause doesn't matter.

  **Why it's wrong:**
  Consider a non-moral example:
  *   **Fact:** The stove is hot.
  *   **State:** I believe the stove is hot.
  *   **Action:** I pull my hand back.

  Apply your friend's "Swap Test": In a world where the stove is *cold* but I hallucinate it is hot, I still pull my hand back. Therefore, my action was caused by my belief, not the heat. Therefore, **I never pull my hand back because the stove is hot.**

  This is absurd. In the good case (where the stove is actually hot), the explanation of my action *essentially involves* the heat of the stove. In the bad case (hallucination), it involves a belief. The fact that the two cases are internally indistinguishable does not mean the explanation of the action is the same in both cases. This is a standard point in **epistemological disjunctivism**.

  ### The Collateral Damage (Your Last Question)

  You asked: *"If this line of reasoning takes down more than moral worth... I'd want to know that."*

  **Yes, it does.** This argument is a skepticism bomb.

  If Step (5) is true, then:
  *   You never believe anything *because it is true*. (You only believe it because of your brain state, which could exist even if the proposition were false).
  *   You never see anything *because it is there*. (You only see it because of your visual state).
  *   You never infer anything *because of the logic*. (You only infer because of your psychological compulsion).

  If you accept (5), you have severed the link between mind and world entirely. You are trapped in a "veil of ideas." Most philosophers reject (5) precisely because it leads to global skepticism about reasoning and perception, not just moral worth.

  ### The Cost of Fixing It (Steps 3 and 4)

  You mentioned you want to keep (3) ("Facts by themselves can't move anybody"). This is the **Humean Commitment**. Here is the hard truth: **Step (3) is the root of the poison.**

  If you strictly maintain (3), you make it very hard to reject (5). If facts *literally* have no causal power, then how can they be part of the explanation in the "good case" but not the "bad case"?

  You have two main options to save moral worth:

  #### Option A: Reject/Modify Step (3) (The Kantian/Rationalist Route)
  This is actually the most faithful route to Kant, despite your hesitation.
  *   **The Move:** Deny that facts *themselves* are causally inert. For a rational agent, **recognizing a fact is itself a psychological state.**
  *   **The Cost:** You abandon strict Humeanism. You accept that Reason is a faculty that can be moved by the "form of a law" or a fact about the world. You accept that for rational beings, the distinction between "the fact that P" and "the belief that P" collapses when the agent is acting rationally.
  *   **Why Kant likes this:** Kant explicitly argues against the Humean idea that reason is the slave of the passions. For Kant, the moral law (a fact/principle) *does* move the will directly through the faculty of Reason. If you keep (3) in its strong Humean form, you are arguably already interpreting Kant through a Humean lens, which causes the problem.

  #### Option B: Keep (3) but Reject Step (5) (The Externalist Route)
  You can keep the idea that only states move muscles, but deny that this excludes facts from being "the reason."
  *   **The Move:** Distinguish between the **causal mechanism** (neurons/states) and the **rational explanation** (facts).
  *   **The Argument:** "What moved me?" has two answers.
      1.  *Physiologically:* My belief-state fired.
      2.  *Rationally:* The fact that pain would be relieved.
  *   **The Cost:** You have to accept **Externalism about Reasons**. You have to admit that what reason you are acting on depends partly on the world, not just your head. If you act on a false belief, you are acting on a *different reason* (a misleading one) than if you act on a true belief, even if your head feels the same.
  *   **Why this saves Moral Worth:** It allows you to say: "In the good case, the agent is moved by the fact (via the state). In the bad case, they are moved by the state alone." This preserves the distinction required for moral worth.

  ### Recommendation for Your Seminar

  If I were in your shoes, I would attack **Step (5)** while signaling that **Step (3)** is doing too much heavy lifting.

  **The Argument to Bring to Class:**
  1.  **Point out the Skepticism:** Ask your friend if they ever believe anything *because it is true*. If their argument holds, the answer is "no." If they say "yes" to ordinary beliefs but "no" to moral beliefs, they need to explain the difference.
  2.  **The Disjunctive Defense:** Argue that the "Swap Test" fails because the explanation of an action changes depending on whether the belief is true or false.
      *   *Case A (True):* I help because he is in pain. (Fact + State)
      *   *Case B (False):* I help because I *think* he is in pain. (State only)
      *   These are different explanations. The fact that the internal feeling is the same doesn't mean the *reason* is the same.
  3.  **The Kantian Correction:** Remind the group that Kant is not a Humean. Premise (3) is a Humean premise. Kant thinks the consciousness of the moral law *is* a motive (the "Fact of Reason"). If you import Humean psychology (3) into Kantian ethics, you create a problem Kant didn't have.

  **Summary:**
  *   **Break the argument at (5).** It conflates causal mediation with explanatory irrelevance.
  *   **Be wary of (3).** It feels obvious, but it's a substantive philosophical commitment (Humeanism) that conflicts with Kant's Rationalism.
  *   **Collateral Damage:** Yes, this argument destroys all knowledge and reasoning if accepted. That is your strongest reductio ad absurdum against it.

  You can keep (1) and deny (8). You just have to deny that "acting for the right reason" requires the fact to bypass the mind to push the muscles. It only requires that the mind's state be a *response* to the fact, which is compatible with the state being the proximate cause.
