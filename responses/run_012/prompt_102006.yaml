answer: |-
  ### Specification of Desiderata for a Theory of Idealization

  Below is the specification for an adequate theory of idealization. Requirements are tagged as **[Non-Negotiable]** (conditions for logical coherence or empirical adequacy of the theory) or **[Camp Prejudice]** (metaphysical or methodological commitments specific to Realism, Instrumentalism, etc.).

  #### 1. The Distinction Constraint
  **Requirement:** The theory must formally distinguish **Idealization** (intentional distortion) from **Abstraction** (omission of detail), **Approximation** (numerical closeness), and **Error** (unintentional mistake).
  *   **Consideration:** A frictionless plane is not an error (we know friction exists); it is not mere abstraction (we actively assert *zero* friction, not *unspecified* friction); it is not always an approximation (sometimes the limit is singular).
  *   **Status:** **[Non-Negotiable]**. Without this, the theory cannot explain why scientists defend idealizations but correct errors.

  #### 2. The Load-Bearing Constraint
  **Requirement:** The theory must account for cases where the false assumption is **essential** to the derivation of the result, not merely a heuristic scaffold that can be removed without collapsing the model.
  *   **Consideration:** In *Homo economicus*, perfect rationality is often load-bearing; removing it breaks the equilibrium proof. In frictionless mechanics, friction can often be added back perturbatively. The theory must handle both.
  *   **Status:** **[Non-Negotiable]**. A theory that only explains correctable (Galilean) idealizations fails to cover standard economic or population genetics models.

  #### 3. The De-idealization Constraint
  **Requirement:** The theory must specify conditions under which a **limiting procedure** exists to return from the idealized model to the target system (de-idealization), and acknowledge cases where no such continuous path exists.
  *   **Consideration:** Infinite populations (population genetics) often involve singular limits where the behavior of the infinite system differs qualitatively from the finite one (e.g., phase transitions). You cannot simply "add back" finiteness.
  *   **Status:** **[Non-Negotiable]**. Collapsing de-idealizable and non-de-idealizable cases obscures why some models are robust and others are fragile.

  #### 4. The Semantic Constraint
  **Requirement:** The theory must assign a truth-value or semantic status to the model's claims. It must clarify whether the model is a **Representational Claim** (asserting how the world is) or a **Computational Tool** (asserting only that the calculation yields correct predictions).
  *   **Consideration:** If a model is a representation, its core propositions should be truth-apt. If they are known false, this creates a paradox. If it is a tool, truth is irrelevant.
  *   **Status:** **[Camp Prejudice]**. Realists demand Representation; Instrumentalists demand Tool. An adequate theory must pick one or explain the hybrid, but the *demand* itself is camp-specific.

  #### 5. The Explanatory Constraint
  **Requirement:** The theory must explain how false premises yield **genuine explanation**, not merely accurate prediction.
  *   **Consideration:** Scientists claim idealized models *explain* phenomena (e.g., why gases behave ideally), not just predict them. If the assumptions are false, the explanation seems unsound.
  *   **Status:** **[Non-Negotiable]**. Scientific practice treats these models as explanatory. A theory that reduces them to "black box predictors" fails to describe actual scientific reasoning.

  ---

  ### The Incompatibility Theorem

  **Result:** The following subset of requirements **cannot be jointly satisfied**:

  1.  **The Semantic Constraint (Realist Variant):** Models function as truth-apt Representational Claims about the target system.
  2.  **The Load-Bearing Constraint:** Some models rely on assumptions that are essentially false and cannot be replaced by true assumptions without losing the result.
  3.  **The De-idealization Constraint:** Adequate idealizations must admit a limiting procedure that recovers the target system's behavior (controllability).

  **The Conflict:**
  If you insist on **(1) Representation**, you require the model's core claims to map to reality. If you admit **(2) Load-Bearing Falsehoods**, the core claims do not map to reality. To resolve this, you typically invoke **(3) De-idealization** to argue the falsehood is "close enough" in the limit. However, in cases like **infinite populations** or **singular limits**, **(3) fails**; there is no continuous path back to the real system.

  Therefore, you must drop one:
  *   Drop **(1)**: Become an Instrumentalist or Fictionalist (models don't represent, they calculate or narrate).
  *   Drop **(2)**: Claim load-bearing falsehoods are actually "approximate truths" (often empirically untenable).
  *   Drop **(3)**: Accept that some explanations are fundamentally non-factive (highly controversial for Realists).

  **Verdict:** A theory that maintains **Realist Representation** while acknowledging **Non-De-idealizable Load-Bearing Falsehoods** is logically incoherent. Most "adequate" theories survive by relaxing the Semantic Constraint (shifting to Fictionalism/Instrumentalism) or by redefining Representation (shifting to Inferentialism).

  ---

  ### Evaluation of Existing Accounts

  #### 1. Friedman's "F-Twist" (Instrumentalism)
  *   **Thesis:** "The more significant the theory, the more unrealistic the assumptions." Assumptions are not descriptive; they are tools for organizing empirical data.
  *   **Performance against Desiderata:**
      *   *Distinction Constraint:* **Passes.** Easily distinguishes error (bad prediction) from idealization (good prediction despite false assumptions).
      *   *Load-Bearing Constraint:* **Passes.** Embraces load-bearing falsehoods as necessary for tractability.
      *   *De-idealization Constraint:* **Fails.** De-idealization is irrelevant; the goal is prediction, not recovering the "true" causal path.
      *   *Semantic Constraint:* **Passes (Instrumentalist Variant).** Explicitly rejects Representation in favor of Tool.
      *   *Explanatory Constraint:* **Fails.** Reduces explanation to prediction. Cannot account for why scientists feel they understand *why* a phenomenon occurs.
  *   **Verdict:** Coherent, but sacrifices the Explanatory Constraint. It solves the paradox by denying the model explains anything.

  #### 2. The Fictionalist Line (e.g., Frigg, Godfrey-Smith)
  *   **Thesis:** Models are akin to literary fictions. They create "prop-oriented" make-believe. Truth is "truth-in-the-model," not truth-about-the-world.
  *   **Performance against Desiderata:**
      *   *Distinction Constraint:* **Passes.** Fiction is intentional (idealization), not mistake (error).
      *   *Load-Bearing Constraint:* **Passes.** Fictions often rely on essential impossibilities (e.g., talking rabbits) to make a point.
      *   *De-idealization Constraint:* **Passes (Reinterpreted).** De-idealization is treated as "exporting" lessons from the fiction to reality, not a mathematical limit.
      *   *Semantic Constraint:* **Passes (Fictionalist Variant).** Avoids the truth-value paradox by shifting the locus of truth to the fictional world.
      *   *Explanatory Constraint:* **Struggles.** Must explain how a fiction explains reality. Usually relies on an isomorphism or inferential bridge that re-introduces the Realist tension (how do we know the bridge is valid if the model is false?).
  *   **Verdict:** Handles the logic of falsehood better than Friedman, but struggles to ground the *normative* force of science (why *this* fiction and not another?) without smuggling Realist criteria back in.

  ### Summary
  If you require a theory that preserves **Realist Representation** and **Genuine Explanation** while admitting **Non-De-idealizable Load-Bearing Falsehoods**, no such theory exists. You must choose: either models do not represent (Friedman), models do not explain (strict Instrumentalism), or the assumptions are not truly load-bearing/false (naive Realism). The "Fictionalist" turn attempts to bypass this by changing the semantics, but remains vulnerable to the charge that it cannot explain the *success* of the export from fiction to fact.
