answer: |-
  Your intuition is correct: the argument your friend is making is a classic formulation of **instrumentalism** derived from the **underdetermination of theory by data**, but it contains a critical sleight of hand. The inference from "we cannot distinguish these ontologies via input-output behavior" to "there is no fact of the matter about the ontology" does not go through without importing a hidden, highly controversial philosophical premise.

  Here is a diagnosis of where the reasoning fails, what constraints keep the ontological question non-empty, and what a defensible version of your friend's conclusion would actually look like.

  ### 1. The Diagnosis: The Epistemic-Metaphysical Slide

  The precise point where the reasoning breaks is the transition from **epistemic limitation** to **metaphysical indeterminacy**.

  Your friend's argument relies on a tacit commitment to **Verificationism** (or a strong form of Anti-Realism). The structure is:
  1.  **Premise:** All evidence available to us is limited to the observable input-output profile (empirical adequacy).
  2.  **Premise:** Multiple incompatible ontologies can account for this profile (underdetermination).
  3.  **Hidden Premise:** If a fact cannot be distinguished by observable evidence, it is not a fact at all (Verificationist Theory of Meaning/Truth).
  4.  **Conclusion:** Therefore, there is no fact of the matter about the ontology.

  If you reject the Hidden Premise, the conclusion collapses. Most scientific realists argue that truth exceeds verification. The fact that we are currently (or even permanently) unable to peek inside the black box does not entail that the box is empty or that its internal structure is indeterminate. It entails only that *we are ignorant*.

  Your friend is treating **underdetermination by data** as equivalent to **indeterminacy of nature**. But underdetermination is a relation between *theories* and *evidence*; it is not necessarily a feature of the *world*. To claim it is a feature of the world requires arguing that the world *just is* the evidence, which is the very point in contention.

  ### 2. The "Bare Profile" Fallacy

  Your friend claims that the only thing bearing on the ontology is the "accessible profile" (input-output behavior). This is a restricted view of what counts as evidence in science. It assumes we are evaluating the system in **total isolation**, which is rarely how ontological claims are adjudicated.

  Even if two systems produce identical outputs for all *current* inputs, their ontologies are constrained by factors beyond the immediate I/O record:

  **A. Physical and Computational Complexity Constraints**
  Consider the "lookup table" hypothesis vs. the "computational state" hypothesis for a human mind.
  *   **The Constraint:** A lookup table mapping all possible sensory inputs to behavioral outputs for a human would require more memory storage than there is mass in the observable universe.
  *   **The Evidence:** We know the mass and volume of the human brain.
  *   **The Inference:** The lookup table ontology is physically impossible, not just inconvenient. We don't need to see the "internal states" directly to know the lookup table hypothesis is false; we know it via background physical theory. The ontology is constrained by the **substrate**.

  **B. Counterfactual Robustness and Interventions**
  Your friend mentions "responses to every intervention we can perform." But interventions are not limited to "ask a question, get an answer." They include **destructive testing** and **structural manipulation**.
  *   If the system is a lookup table, damaging 50% of its substrate should result in specific, catastrophic data loss (like burning half a book).
  *   If the system is a distributed neural network, damaging 50% of the substrate might result in graceful degradation (loss of resolution, not specific memories).
  *   **The Point:** Different ontologies imply different **causal mechanisms**. Causal mechanisms dictate how the system behaves *when broken* or *when scaled*. If the "lookup table" and "neural net" make different predictions about what happens when you remove a component, they are not empirically equivalent under *all* interventions, only under *functional* interventions.

  **C. Theoretical Coherence (The Web of Belief)**
  We do not assess the ontology of a system in a vacuum. We assess it against our best theories of similar systems.
  *   If we are discussing a physical system (e.g., a gas), the "swarm of particles" ontology coheres with thermodynamics and quantum mechanics. The "bare disposition" ontology requires us to carve out a special exception for this system where the laws of physics don't apply to its interior.
  *   The "convenience" your friend dismisses is actually **theoretical unity**. Choosing the ontology that fits the rest of our successful science is not merely pragmatic; it is an abductive inference to the best explanation (the No Miracles Argument).

  ### 3. What Keeps the Question Non-Empty?

  The question "What is this system actually made of?" remains non-empty because **ontologies carry causal commitments that extend beyond the current I/O profile.**

  To legitimately bear on identifying a system's ontology, evidence need not be "direct inspection." It can be:
  1.  **Energy Budgets:** Does the proposed ontology require more energy to operate than the system consumes? (Rules out inefficient ontologies).
  2.  **Latency/Speed Constraints:** Does the proposed computational path fit within the time response of the system? (A lookup table might be fast, but a specific algorithmic route might be too slow).
  3.  **Generalization to Novel Domains:** Does the ontology allow the system to handle inputs it was not designed for? (A lookup table cannot generalize; a rule-based system can).
  4.  **Integration with Background Science:** Does the ontology require new physics, or does it utilize established physics?

  Your friend's premise about "permanently inaccessible information" fails because it assumes the only way to access internal structure is to **read it directly**. But in science, we access internal structure **indirectly** by testing the causal implications of that structure. If the "lookup table" and the "algorithm" imply different physical stresses, energy usages, or failure modes, the information *is* accessible, just not via the narrow channel of "functional output."

  ### 4. A Defensible Version of Your Friend's Conclusion

  Your friend is not entirely wrong; he is just overgeneralizing a specific insight. A defensible version of his conclusion would retreat from **Metaphysical Anti-Realism** ("there is no fact of the matter") to **Ontological Relativity** or **Pragmatic Realism**.

  **The Defensible Claim:**
  *"While there may be a fact of the matter about the ontology, our choice of description is often underdetermined by the specific level of analysis we are interested in. For the purposes of predicting behavior, the internal ontology is irrelevant. Therefore, we are justified in selecting the ontology that maximizes explanatory power and integration with background theory, acknowledging that 'what it is made of' is relative to the granularity of our investigative tools."*

  **Where this differs from your friend:**
  1.  **It admits a fact of the matter:** It acknowledges that the system *is* something specific, even if our models are approximate.
  2.  **It restricts the scope:** It admits underdetermination holds for *functional* prediction, but not necessarily for *causal* explanation or *physical* plausibility.
  3.  **It shifts the burden:** Instead of saying "we can't know, so it doesn't matter," it says "we can't know *via this specific method*, so we must use *other methods* (physics, coherence, causal testing)."

  ### Summary for Your Discussion

  To articulate your resistance without defending a strawman, you can say:

  > "You are conflating **empirical equivalence** with **ontological identity**. Just because two models yield the same outputs doesn't mean they describe the same reality, nor does it mean reality is indeterminate. It means our *current data* is insufficient.
  >
  > But 'data' isn't just input-output records. It includes physical constraints, energy costs, and coherence with the rest of science. A lookup table mind is ruled out not by behavior, but by **physics**.
  >
  > Your argument only works if you assume **Verificationism**—that truth is limited to what we can measure. If you allow that the world exists independently of our measurements, then underdetermination is a challenge for *us*, not a feature of *the world*. The question isn't empty; it's just hard."
