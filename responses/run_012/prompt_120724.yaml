answer: |-
  You have spotted the exact hinge on which the entire debate turns. Your hunch is correct: McTaggart is not arguing against the B-theorist's ontology here; he is arguing against their *definition of change*. He grants them their ontology (eternal events) to show that it fails to deliver what they claim it delivers (temporal change).

  Here is the breakdown of the joints, the load-bearing premises, and the distinction between textbook mythology and specialist contention.

  ### 1. What "an event can never cease to be an event" means
  McTaggart is making an ontological claim about the relata of the B-series. For McTaggart, an event (e.g., the death of Queen Anne) is a fixed coordinate in the manifold.

  *   **The Commitment:** This sentence commits him to **eternalism about events**. If an event stands in a B-relation (earlier/later) to another event, that relation is permanent. The death of Queen Anne is always earlier than your reading of this sentence. It does not slide into the past and vanish; it is eternally located at its coordinate.
  *   **The Strategy:** This is not question-begging in the vicious sense; it is a *concessive* move. He is saying to the B-theorist: "I will accept your picture of reality where events are fixed points. I am showing you that *even on your own terms*, you do not get change."
  *   **The Meaning of "Cease":** To "cease to be an event" would mean to pop out of existence *simpliciter*. In a B-world, existence is not temporal; it is absolute. So, nothing pops in or out.

  ### 2. Does the argument engage the property-variation account?
  **No. It slides past it entirely.**

  You are right to identify this as the gap. The standard B-theoretic account of change is: *Object $x$ has property $P$ at $t_1$ and property $\neg P$ at $t_2$.* McTaggart does not address this in this specific passage. He focuses exclusively on events coming into and going out of existence.

  *   **Why he slides past it:** McTaggart operates with a stricter definition of change. For him, property variation across B-times is not "change"; it is merely **variation**. It is a static spread of qualities across a dimension, like a poker being red at one end and cold at the other. That is spatial variation, not temporal change.
  *   **The Missing Step:** To make this argument work against the property-variation account, McTaggart would need to add: "In a B-series, the fact '$x$ is $P$ at $t_1$' is an eternal fact. The fact '$x$ is $\neg P$ at $t_2$' is an eternal fact. Since both facts exist timelessly, nothing *happens*." He hints at this, but in this passage, he focuses on the events themselves rather than the properties of objects at those events.
  *   **Textbook vs. Reality:** Introductory textbooks often present McTaggart as having *refuted* the B-theory here. That is false. He has only refuted the B-theory *if* you accept his premise that variation across times is not genuine change. This is not a settled logical point; it is a definitional stipulation.

  ### 3. Repair, Load-Bearing, and the Regress
  Is there a repair available to make this passage catch the property-variation account? **Yes.**

  *   **The Repair:** McTaggart can argue that if all facts are B-facts (e.g., "$x$ is $P$ at $t_1$"), then all facts are eternally true. If all facts are eternally true, the total state of the universe is static. Therefore, no change. This moves the argument from "events don't vanish" to "facts don't alter."
  *   **Load-Bearing Status:** This passage is **not** the load-bearing beam of the paper. It is a setup.
      *   **The Real Beam:** The load-bearing argument is the **regress argument** that comes later (that the A-series is contradictory because every event is past, present, and future).
      *   **The Function of This Passage:** Its job is to establish that the B-series is *dependent* on the A-series. He wants to show: No A-series $\rightarrow$ No Change $\rightarrow$ No Time.
      *   **The Vulnerability:** If a B-theorist simply bites the bullet and says, "Change *just is* property variation across times, and I don't care that the facts are eternal," McTaggart's argument in *this specific passage* fails to move them. He needs the later regress to show that the A-series (which they need to make change "real" in his sense) is contradictory.

  ### 4. Settled vs. Contested (The "Serious" Constraint)
  You asked to separate what is settled from what is contested. In the specialist literature, the "textbook story" is often a distortion. Here is the map:

  **1. "Time involves change."**
  *   **Textbook Story:** McTaggart treats this as "universally admitted." Textbooks often repeat this as the starting axiom of philosophy of time.
  *   **Specialist Reality:** **Highly Contested.** This is *not* settled. Shoemaker's "Time without Change" (1969) is the standard counter-argument. Many physicists and philosophers accept that time could exist in a static universe (e.g., as a dimension of the manifold). McTaggart's premise here is a substantive metaphysical claim, not a conceptual truth. **Flag this for your students: It is a premise, not a given.**

  **2. "B-theoretic variation is not real change."**
  *   **Textbook Story:** Often presented as if McTaggart *proved* this.
  *   **Specialist Reality:** **The Core Disagreement.** This is the definition of the A-theory/B-theory split. B-theorists (Mellor, Le Poidevin, Sider) explicitly define change as property variation across times. A-theorists (Prior, Fine) agree with McTaggart that this is insufficient. There is no consensus here. It is a fundamental clash of intuitions. **Do not teach this as settled.**

  **3. "McTaggart's 'Event' is a technical notion."**
  *   **Textbook Story:** Events are just "things that happen."
  *   **Specialist Reality:** **Contested.** As you noted, McTaggart treats events as eternal particulars. Presentists deny events exist unless they are present. Eternalists deny events cease to exist. McTaggart is assuming eternalism to argue against eternalism (to show it lacks change). This is a complex dialectical move often smoothed over in teaching.

  **4. "McTaggart proved time is unreal."**
  *   **Textbook Story:** The title of the paper is often taken as the conclusion of the field.
  *   **Specialist Reality:** **False Consensus.** The vast majority of contemporary metaphysicians are B-theorists. They reject McTaggart's conclusion. The "consensus" is that McTaggart identified a *tension* between tense and consistency, not that he solved it by eliminating time.

  ### Summary for your Seminar
  If you want to use this as a wedge into Presentism/Eternalism:

  1.  **Premise 1 (Time requires Change):** Challenge this. It's the weakest link. If time doesn't require change, the B-series is time regardless of whether it supports "McTaggartian change."
  2.  **Premise 2 (B-series lacks Change):** Show that this relies on defining change as *tensed* property variation. If change is *temporal* property variation (B-theory), the argument fails.
  3.  **The Wedge:** McTaggart assumes that for change to be real, the *facts* must change (A-theory). The B-theorist says the *objects* change properties, even if the *facts* are static.
  4.  **Verdict:** This passage is not a knock-down argument against the B-theory. It is a statement of what the A-theory demands. The real argument is the regress. However, this passage is crucial because it forces the B-theorist to admit they are offering a "static" picture of reality.

  **Minority View Check:** Your reading that McTaggart slides past the property-variation account is **not** a minority view among experts (see Mellor, *Real Time*; Le Poidevin, *Change, Cause and Contradiction*). It is, however, frequently glossed over in undergraduate teaching, where the focus is often solely on the regress. You are on solid ground.
