          2.  **Definition of Change:** B-theorists define change as property variation across times. A-theorists/McTaggart define it as variation in tensed properties. This is the crux. It is *not* settled that B-change is "fake."
          3.  **McTaggart's Intent:** Some read him as arguing B-series is insufficient for change (as the user does). Others read him as arguing B-series is insufficient for *temporal* change (tautological).
          4.  **User's Reading:** The user's reading (that McTaggart ignores property variation) is standard in advanced literature (e.g., Mellor, Le Poidevin), but often glossed in intro texts. It is *not* a minority view among experts, though it is often under-emphasized in teaching.
