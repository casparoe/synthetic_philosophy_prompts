      *   *Repair:* Can McTaggart fix this specific argument to catch property variation?
      *   *Attempt:* If change is $O$ is $F$ at $t_1$ and $O$ is $G$ at $t_2$. In the B-series, these facts are eternal. "$O$-being-$F$-at-$t_1$" is an eternal fact. "$O$-being-$G$-at-$t_2$" is an eternal fact. Nothing *changes* in the ontology; the facts just sit there.
      *   *Load-bearing:* This specific argument (events don't pop out) is *not* the load-bearing beam. The load-bearing beam is the later regress argument (that the A-series is contradictory). This passage is a setup. It establishes that B-series needs A-series to get change. The *real* kill shot is that A-series is contradictory.
