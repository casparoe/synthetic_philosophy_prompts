      *   *Premise 2:* If B-series without A-series is time, change must be possible without A-series.
      *   *Hypothesis:* Change in a B-series only world = events ceasing to be events / beginning to be events.
      *   *Refutation:* Events are permanent. Once an event is in the series, it stays there. (e.g., The death of Queen Anne is always an event).
      *   *Conclusion:* Therefore, no change in B-series without A-series.
      *   *User's Critique:* McTaggart ignores "object x has property P at t1 and not-P at t2." He focuses on *events* coming into/out of existence rather than *objects* changing properties.

  3.  **Address Task 1: "An event can never cease to be an event"**
      *   *Meaning:* McTaggart treats events as fixed points in a logical ordering. The death of Queen Anne is a coordinate. It doesn't vanish. It is eternally located at its B-coordinate.
      *   *Commitment:* This commits him to a block universe/eternalist view of events *for the sake of the argument*. He is granting the B-theorist their ontology to show it fails to deliver change.
      *   *Nuance:* Is this question-begging? If he assumes events are eternal to prove time isn't real, is he unfair? Actually, he's trying to show that *even if* you grant the B-series ontology, you don't get change. So it's a charitable move towards the opponent, ostensibly.

  4.  **Address Task 2: Engagement with Property-Variation**
      *   *The Slide:* Yes, he slides past it. He defines change in this section specifically as "an event ceased to be an event." He does not explicitly discuss "a thing having different properties at different times."
      *   *Why?* McTaggart has a specific definition of change in mind. For him, genuine change requires *tensed* property variation (being present, then being past). Merely having different properties at different B-times is, for him, just variation, not *temporal* change.
      *   *The "Textbook" vs. Reality:* Standard intro texts often say "McTaggart argues B-change isn't real change." They often gloss over *why*. The user is right to spot that he ignores the relational/property account here.
      *   *Contested Point:* Whether "variation across B-times" counts as change. B-theorists say yes. McTaggart (and A-theorists) say no, that's just a "spread out" object. This is *not* settled. It is the core of the debate.

