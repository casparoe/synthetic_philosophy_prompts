answer: |-
  Here is a 45-minute lesson plan designed specifically for your group's level and the specific conceptual knot you're stuck on.

  ### 1. The Prerequisite: "Ways Things Could Have Been"
  Before you mention identity, you must secure the concept of **Possible Worlds**.
  *   **The Trap:** High schoolers hear "possible world" and think *Multiverse/Sci-Fi* (physical places far away).
  *   **The Fix:** Define a Possible World as a **Complete Story**.
  *   **Script:** "Don't think of other worlds as planets. Think of them as novels. The 'Actual World' is the biography of everything that actually happened. A 'Possible World' is a different biography that is consistent and complete. The question isn't 'Can I travel there?' It's 'Is this story a valid way reality could have been?'"
  *   **Check:** Ask them: "In a possible world where dinosaurs didn't go extinct, are the dinosaurs physically located next to our universe?" (Answer must be No).

  ### 2. The Carrying Example: The "Mirror Biography"
  You are right to worry about the "Potato Farmer/Parents Never Met" example. Your Friend 1 is technically correct: if you introduce it as "In another world, *you* are a farmer," you have already assumed Transworld Identity (TWI). If you introduce it as "In another world, *someone like you* is a farmer," you have assumed Counterpart Theory (CT).

  **Do not change the example.** Instead, change **how you introduce it.** You will use the "Parents Never Met" scenario, but you will describe the *other world* without using the word "you" initially.

  **The Setup (5 Minutes):**
  Draw two circles on the board. Label one **@** (Actual) and one **W** (Possible).
  *   **In @:** There is a person, let's call him Alex. Alex has specific parents, went to this school, and is sitting here now.
  *   **In W:** The history of the universe is almost identical, except Alex's parents never met. However, there is a person in **W** who looks like Alex, has similar memories, and is a potato farmer.

  **The Pivot Question:**
  "Look at the person in **W**. When I say 'Alex could have been a potato farmer,' am I talking about **Alex himself** living in **W**? Or am I talking about **that other guy** in **W** who is just *like* Alex?"

  **Why this works:**
  *   It avoids begging the question because you haven't labeled the person in **W** as "Alex" yet. You are asking them to *assign* the label.
  *   It directly addresses your Friend 2's worry. Friend 2 thinks CT makes "I could have been..." false. This setup shows that CT just changes *who* the sentence is about to make it true.

  ### 3. The Sequence & Misconception Mapping (30 Minutes)

  **Phase 1: The Intuition Pump (10 mins)**
  Split the room. Half the room must argue for **Team Identity** (It is Alex in both worlds). Half must argue for **Team Counterpart** (It is a different person who resembles Alex).
  *   **Team Identity Argument:** "It feels like *me*. If it's not me, then I can't do anything else. I'm stuck."
  *   **Team Counterpart Argument:** "If his parents are different, he's made of different stuff. How can it be the same person? It's a twin, not me."

  **Phase 2: Head Off the Misconceptions (15 mins)**
  As they debate, three specific misconceptions will arise. You need to intercept them exactly here:

  *   **Misconception A: The Multiverse Error.**
      *   *Sign:* Someone asks, "How did Alex get to World W?"
      *   *Intervention:* "Stop. We aren't talking about travel. We are talking about description. We are asking how to describe the relationship between the Alex-Story and the W-Story."
  *   **Misconception B: The Fatalism Error (Friend 2's worry).**
      *   *Sign:* Someone says, "If Counterpart Theory is true, then 'I could have been a farmer' is a lie."
      *   *Intervention:* "Not a lie. A translation. CT says the sentence 'I could have been a farmer' is *true*, but what makes it true is that a *counterpart* is a farmer. It saves the truth of the sentence by changing the metaphysics."
  *   **Misconception C: The Time Travel Error.**
      *   *Sign:* Confusing "Alex at age 10" vs "Alex at age 18" with "Alex in World @" vs "Alex in World W".
      *   *Intervention:* "Time is one dimension. Possibility is a different dimension. You persist through time. Do you persist through possibility?"

  **Phase 3: Naming the Views (5 mins)**
  Now give them the vocabulary.
  *   **Transworld Identity (Kripke):** You are a "transworld traveler." You exist in multiple stories. Your identity is a "thisness" (haecceity) that sticks to you regardless of properties.
  *   **Counterpart Theory (David Lewis):** You are "world-bound." You only exist in @. When we talk about possibility, we are talking about your *counterparts* (your cousins in other stories) who resemble you closely enough.

  ### 4. The Assessment Question (5 Minutes)
  Do not ask "What is Counterpart Theory?" They will recite definitions without understanding. Ask a question that forces them to apply the truth conditions.

  **The Question:**
  > "Imagine I say: **'I might have had different parents.'**
  > If **Transworld Identity** is true, is this sentence possible?
  > If **Counterpart Theory** is true, is this sentence possible?
  > Explain why the answers might differ."

  **The Key to Grading Their Answers:**
  *   **TWI Answer:** Usually "No" (if they accept Origin Essentialism like Kripke) or "Yes" (if they think parents are accidental). But crucially, they must say it would be *me* in that world.
  *   **CT Answer:** "Yes, but..." It is possible because a *counterpart* has different parents. But *I* (the actual person) do not exist in that world.
  *   **The Distinction:** If they say "CT makes it impossible," they failed (Friend 2's error). If they say "TWI means I travel there," they passed. If they say "CT means a similar guy is there, so the statement is true about *me* only loosely," they really passed.

  ### 5. The "Off-Limits" List (Say This Out Loud)
  At the start of the session, write this on the board. It protects you from getting bogged down.
  1.  **No Modal Logic Syntax:** We are not writing $\Diamond \exists x$. We are speaking English.
  2.  **No Lewis's Concrete Realism:** We are not debating if possible worlds are physically real planets. We are treating them as abstract stories for this session. (Lewis thought they were real, but that's too weird for 45 mins).
  3.  **No Haecceitism Technicalities:** We won't define "primitive thisness." We will just talk about "what makes you, you."

  ### 6. The "Failure Point" & Contingency
  **What is most likely to fail:**
  The concept of being **"World-Bound."**
  High schoolers have a very strong intuition that *they* are the thing that could have done otherwise. The idea that "You" are stuck in the actual world and only a "cousin" exists in the other world feels like death/nihilism to them. They will reject Counterpart Theory not because it's logically wrong, but because it feels emotionally wrong.

  **What would change my mind about the plan:**
  If, during Phase 1 (The Intuition Pump), the entire group immediately agrees that "It's obviously just a twin, not me."
  *   **Why:** This means they intuitively grasp Counterpart Theory better than Transworld Identity.
  *   **The Pivot:** If this happens, stop defending TWI. Instead, ask: "If it's just a twin, why do we feel *responsibility* for what that twin did? If the twin in World W murders someone, is *Alex* guilty?" This flips the script and makes TWI the attractive view (because it preserves moral responsibility across worlds).

  **Regarding your specific worry about the Potato Farmer example:**
  Your Friend 1 is right that the *phrasing* begs the question, but wrong that the *example* is unusable. Your Friend 2 is wrong that CT makes modal claims false.
  *   **Use the worry.** Start the session by saying: "I have two friends who argue about this. One says talking about 'me in another world' is nonsense. The other says if it's not 'me', then I didn't do anything. We are going to solve their fight today."
  *   This validates your own uncertainty and turns it into a pedagogical tool. It shows you aren't just lecturing, but investigating.

  ### Summary Checklist for You
  1.  **Minute 0-5:** Define Worlds as Stories, not places.
  2.  **Minute 5-20:** The "Mirror Biography" (Alex in @ vs. Alex-like in W). Don't call him "Alex" in W yet.
  3.  **Minute 20-35:** Debate Team Identity vs. Team Counterpart. Intercept the "Fatalism" and "Multiverse" errors.
  4.  **Minute 35-40:** Label the theories (Lewis vs. Kripke).
  5.  **Minute 40-45:** The "Different Parents" Assessment Question.
  6.  **Throughout:** Refuse to discuss physics or logic symbols.

  You know enough to lead this. The fact that you are worried about begging the question proves you understand the philosophy better than most undergraduates. Trust the tension in the example; that tension *is* the philosophy.
