      *   **The Subject Requirement (The Hard Limit):** Address the core Hegelian constraint. Recognition = Subject-Subject. IR = Subject-Object. This is where IR collapses into "treatment." *Extrapolation alert:* Using Hegel to critique IR.
      *   **Carry-Over Elements:**
