answer: |-
  ### Part 1: The Exam Question

  **Puzzle Club Handout: Supertasks and Limits**
  **Time Allowed:** 60 Minutes
  **Total Marks:** 20

  **Context:**
  Consider a timer that runs from $t=0$ to $t=1$ second. We define a sequence of times $t_n = 1 - \frac{1}{2^n}$ for $n=1, 2, 3, \dots$. Note that $t_1 = 1/2$, $t_2 = 3/4$, $t_3 = 7/8$, and $\lim_{n \to \infty} t_n = 1$.

  **Lamp A:** Starts **Off** (State 0). At each $t_n$, the state flips: $0 \to 1 \to 0 \to 1 \dots$.
  **Lamp B:** Starts **Off** (Brightness 0). At each $t_n$, the brightness is set to $1/2^{n-1}$. So at $t_1$ brightness is 1, at $t_2$ it is $1/2$, at $t_3$ it is $1/4$, etc.

  **Question 1 (5 marks)**
  Determine the mathematical limit of the state/brightness sequence for Lamp A and Lamp B as $n \to \infty$ (i.e., as $t \to 1^-$). Show your working.

  **Question 2 (10 marks)**
  Based on your limits, determine the state of Lamp A and Lamp B at exactly $t=1$.
  *   For each lamp, commit to a specific state (On, Off, or Undefined).
  *   Justify your commitment. Specifically, explain whether the existence of a mathematical limit in Lamp B forces a physical state at $t=1$ in a way that Lamp A does not.

  **Question 3 (5 marks)**
  A colleague argues: *"This is irrelevant. No physical machine can switch infinitely fast, so the setup describes an impossible object. Therefore, there is no answer."*
  Evaluate this objection. Does the physical impossibility of the mechanism invalidate the logical question about the state at $t=1$? Explain why we analyze these puzzles despite the engineering constraints.

  ***

  ### Part 2: Model Answer

  **Q1: Limits**
  For Lamp A, the state sequence is $0, 1, 0, 1, \dots$. This is an oscillating sequence $a_n = \frac{1 - (-1)^n}{2}$. It does not converge; the limit $\lim_{n \to \infty} a_n$ does not exist.
  For Lamp B, the brightness sequence is $1, 1/2, 1/4, \dots$, given by $b_n = (1/2)^{n-1}$. This is a geometric series with ratio $1/2$. The limit is $\lim_{n \to \infty} (1/2)^{n-1} = 0$.
  *(5 marks: 2 for A's divergence, 3 for B's convergence and correct value)*

  **Q2: State at $t=1$**
  **Lamp A:** The state is **Undefined**. The instructions specify the state for all $t < 1$, but the sequence has no limit. There is no mathematical basis to extend the function to $t=1$. To say it is On or Off requires information not contained in the description.
  **Lamp B:** The state is **Off**. While the instructions technically stop at $t < 1$, the brightness function converges to 0. Unlike Lamp A, Lamp B describes a continuous physical quantity (brightness). In mathematical physics, if a quantity converges to a limit $L$ as $t \to 1$, we typically define the state at $t=1$ by continuity ($f(1) = \lim_{t \to 1} f(t)$). Since the limit is 0, the lamp is Off.
  **Distinction:** Lamp A is logically underdetermined because the sequence diverges. Lamp B is resolvable because the sequence converges, allowing a natural continuous extension. The limit *matters* for B because brightness is a magnitude, not a binary toggle.
  *(10 marks: 3 for A's status, 3 for B's status, 4 for the distinction regarding continuity/convergence)*

  **Q3: Physical Objection**
  The objection confuses *physical realizability* with *logical consistency*. This puzzle is not an engineering specification; it is a test of how we apply concepts of infinity and limits to descriptions of states.
  If we reject all supertasks because they are physically impossible, we cannot analyze the logic of infinity at all. The question asks: "Given this description, what follows?" not "Can you build this?" The value lies in exposing the gap between a process defined on $[0, 1)$ and the point $t=1$. Dismissing it as "fake physics" avoids the logical work of determining whether the description entails a outcome.
  *(5 marks: 2 for identifying the category error, 3 for explaining the logical value of the thought experiment)*

  ***

  ### Part 3: Marking Scheme & Common Errors

  **Total Marks:** 20
  **Grade Boundaries (Guideline):**
  *   **A (17-20):** Correct limits, distinguishes A vs B based on convergence/continuity, dismantles Dave's objection without dismissing the math.
  *   **B (13-16):** Correct limits, treats A and B similarly (both undefined or both defined), or accepts Dave's objection but argues it well.
  *   **C (9-12):** Correct limits, but weak justification for states, or relies heavily on the "shrug."
  *   **D (0-8):** Incorrect limits, or refuses to answer Q2/Q3.

  **Detailed Marking Breakdown:**

  **Q1 (5 Marks)**
  *   **2 Marks:** Lamp A limit identified as non-existent/oscillating.
  *   **3 Marks:** Lamp B limit calculated correctly as 0. (1 mark for working, 2 for correct limit).

  **Q2 (10 Marks)**
  *   **Lamp A (3 Marks):**
      *   3: States "Undefined" (or equivalent) *and* cites divergence/lack of limit.
      *   1: States "Undefined" but gives no mathematical reason.
      *   0: Claims On or Off.
  *   **Lamp B (3 Marks):**
      *   3: States "Off" *and* cites the limit of 0.
      *   1: States "Off" but treats it same as A (no distinction).
      *   0: Claims "On" or "Undefined" without arguing against continuity.
  *   **The Distinction (4 Marks):**
      *   4: Explicitly argues that convergence allows a continuous extension for B, which is impossible for A.
      *   2: Notes B converges and A doesn't, but doesn't explain why that changes the state.
      *   0: Treats both lamps identically (e.g., "Both are undefined because infinity is weird").

  **Q3 (5 Marks)**
  *   **5:** Identifies this as a logical/conceptual puzzle, not engineering. Explains that "impossible" doesn't mean "logically inconsistent."
  *   **3:** Agrees it's physically impossible but argues the math still holds abstractly.
  *   **0:** "Dave is right, no answer." (This is the "Dodge" penalty).

  **Common Wrong Answers & How to Mark Them:**

  1.  **The "Dave" Dodge:**
      *   *Answer:* "Neither lamp exists because infinite switching is impossible. 0 marks for Q2."
      *   *Correction:* This fails Q3. Give 0 for Q2 (must commit to the logic of the description) and max 2 for Q3 (they identified the physical constraint but failed the logical evaluation).
      *   *Why:* It avoids the prompt's requirement to analyze the *description*, not the *device*.

  2.  **The "Binary Trap" (Lamp B):**
      *   *Answer:* "Lamp B is Off because the limit is 0, same reason as A is undefined."
      *   *Correction:* Deduct 4 marks in Q2 (The Distinction).
      *   *Why:* They calculated the limit but failed to see that convergence permits a definition via continuity, whereas divergence does not. They treated a magnitude like a toggle.

  3.  **The "Last Switch" Error:**
      *   *Answer:* "Lamp B is On because the last switch turned it on."
      *   *Correction:* 0 marks for Q2.
      *   *Why:* There is no "last switch." This shows a fundamental misunderstanding of the infinite sequence (no largest $n$).

  4.  **The "Semantic Shrug":**
      *   *Answer:* "It's underdetermined for both. The setup doesn't define $t=1$."
      *   *Correction:* Max 6/10 for Q2.
      *   *Why:* Technically defensible philosophically, but fails the specific instruction to explain if B is *different*. An A answer must argue that B *allows* a determination via continuity even if not strictly defined by the switch instructions. If they argue B is undefined, they must explain why continuity is an invalid assumption for brightness.

  5.  **The "Limit = Value" Confusion:**
      *   *Answer:* "The limit is 0, so the brightness is 0." (Without mentioning $t=1$).
      *   *Correction:* Deduct 2 marks in Q2.
      *   *Why:* $\lim_{t \to 1} f(t)$ is not necessarily $f(1)$. They need to explicitly argue for the extension of the domain to $t=1$.
