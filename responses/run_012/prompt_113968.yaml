  ### The Mathematical Case

  We use a state space of three worlds: **A, B, C**.
  We use a chip-count system to represent probability mass (Total = 36 chips). This avoids fractions.

  **1. The Prior**
  *   $P_0(A) = 12$ chips
  *   $P_0(B) = 12$ chips
  *   $P_0(C) = 12$ chips
  *   *Total:* 36 chips.

  **2. The Partitions (The "Flashes")**
  *   **Flash $\mathcal{E}$:** Concerns the partition $\{A, B\}$ vs. $\{C\}$.
      *   **Instruction:** Adjust the total chips in $\{A, B\}$ to **18**. (Consequently, $\{C\}$ becomes 18).
  *   **Flash $\mathcal{F}$:** Concerns the partition $\{B, C\}$ vs. $\{A\}$.
      *   **Instruction:** Adjust the total chips in $\{B, C\}$ to **18**. (Consequently, $\{A\}$ becomes 18).

  **3. The Arithmetic (For Your Eyes Only)**

  *   **Order 1: $\mathcal{E}$ then $\mathcal{F}$**
      1.  **Start:** $A=12, B=12, C=12$.
      2.  **Apply $\mathcal{E}$** ($\{A,B\} \to 18$):
          *   Current $\{A,B\}$ mass is 24. Target is 18. Scaling factor $18/24 = 0.75$.
          *   $A = 12 \times 0.75 = 9$.
          *   $B = 12 \times 0.75 = 9$.
          *   $C$ takes the remainder ($36 - 18$) = 18.
          *   *Intermediate State:* $A=9, B=9, C=18$.
      3.  **Apply $\mathcal{F}$** ($\{B,C\} \to 18$):
          *   Current $\{B,C\}$ mass is $9+18=27$. Target is 18. Scaling factor $18/27 = 2/3$.
          *   $B = 9 \times (2/3) = 6$.
          *   $C = 18 \times (2/3) = 12$.
          *   $A$ takes the remainder ($36 - 18$) = 18.
          *   **Final State 1:** $A=18, B=6, C=12$.

  *   **Order 2: $\mathcal{F}$ then $\mathcal{E}$**
      1.  **Start:** $A=12, B=12, C=12$.
      2.  **Apply $\mathcal{F}$** ($\{B,C\} \to 18$):
          *   Current $\{B,C\}$ mass is 24. Target is 18. Scaling factor $0.75$.
          *   $B = 12 \times 0.75 = 9$.
          *   $C = 12 \times 0.75 = 9$.
          *   $A$ takes the remainder = 18.
          *   *Intermediate State:* $A=18, B=9, C=9$.
      3.  **Apply $\mathcal{E}$** ($\{A,B\} \to 18$):
          *   Current $\{A,B\}$ mass is $18+9=27$. Target is 18. Scaling factor $2/3$.
          *   $A = 18 \times (2/3) = 12$.
          *   $B = 9 \times (2/3) = 6$.
          *   $C$ takes the remainder = 18.
          *   **Final State 2:** $A=12, B=6, C=18$.

  *   **The Divergence:**
      *   Order 1 favors **A** (18 vs 12).
      *   Order 2 favors **C** (18 vs 12).
      *   **B** remains stable (6 in both).
      *   **Certain Evidence Control:** If a Flash says "C is 0" (Certain), renormalization forces order independence. (e.g., C=0 $\to$ A,B split 18,18. Next A=0 $\to$ B=36. Reverse order yields B=36).

  ---

  ### Activity Design: "The Oracle's Market"

  **Materials:**
  *   540 Poker Chips (36 per student $\times$ 15 students). Colors: Red (A), Blue (B), Green (C).
  *   30 Envelopes (15 marked "Sequence 1", 15 marked "Sequence 2").
  *   Whiteboard.
  *   Candy or "Exemption Tokens" (payoff).

  **Roles:**
  *   **Instructor:** The Oracle (announces rules, reveals truth).
  *   **Students:** Traders (manage their own chip portfolios).
  *   **Divisions:** Split the class into two halves (Left Room/Right Room). If the room is small, separate by rows.

  **Timeline (90 Minutes)**

  **0:00 – 0:10: Setup & Endowment**
  *   Distribute 36 chips to each student (12 Red, 12 Blue, 12 Green).
  *   **Rule:** "You are traders. The True State (A, B, or C) will be revealed at the end. If you hold the majority of your chips on the True State, you win a prize. You must always hold exactly 36 chips."
  *   **The Mechanic (Crucial):** "You will receive Market Flashes. A Flash will name a *Group* of states (e.g., 'A and B') and a *Target Number*. You must adjust your chips so the total in that Group equals the Target. **Constraint:** Inside that Group, you must keep the *ratio* of chips between the states exactly as they were before the Flash. The remaining chips go to the states outside the Group."
      *   *Note:* This instruction *is* Jeffrey Conditionalization, but phrased as a trading rule. Do not mention probability, conditioning, or order.

  **0:10 – 0:25: Round 1 (Certain Evidence Control)**
  *   Tell students: "Round 1 is a practice run with Definitive News."
  *   **Flash 1:** "State C is Impossible. Target for {C} is 0."
      *   Students move all Green chips to Red/Blue, preserving R:B ratio (12:12). Result: 18 Red, 18 Blue, 0 Green.
  *   **Flash 2:** "State A is Impossible. Target for {A} is 0."
      *   Students move all Red chips to Blue. Result: 0 Red, 36 Blue, 0 Green.
  *   **Switch:** Have the Left Room do Flash 2 then Flash 1.
      *   Flash 2 (A=0): 0 Red, 18 Blue, 18 Green.
      *   Flash 1 (C=0): Move Green to Blue. Result: 0 Red, 36 Blue, 0 Green.
  *   **Compare:** Ask both rooms to hold up their final Blue stacks. They match.
  *   **Point:** "With certain evidence, the path didn't matter."

  **0:25 – 0:50: Round 2 (Uncertain Evidence)**
  *   Collect all chips. Re-endow everyone with 12/12/12.
  *   **Separation:** "Left Room, open Envelope 1. Right Room, open Envelope 2. **Absolute Silence.** Do not look at the other room's papers."
  *   **Envelope 1 ($\mathcal{E}$ then $\mathcal{F}$):**
      1.  Flash: "Group {A, B} Target 18."
      2.  Flash: "Group {B, C} Target 18."
  *   **Envelope 2 ($\mathcal{F}$ then $\mathcal{E}$):**
      1.  Flash: "Group {B, C} Target 18."
      2.  Flash: "Group {A, B} Target 18."
  *   **Monitoring:** Walk around. Ensure they are preserving ratios *within* the named group and adjusting the *outside* state to make the total 36. Correct errors quietly ("Check your total," "Check your ratio inside the group").
  *   **Stakes:** "At the end, I will draw the True State. If your largest stack matches the True State, you get a prize." (This makes the divergence matter; if True State is A, Left wins. If C, Right wins).

  **0:50 – 1:05: The Reveal**
  *   Ask Left Room: "How many Red (A) chips do you have?" (Answer: 18).
  *   Ask Right Room: "How many Red (A) chips do you have?" (Answer: 12).
  *   Write the two final distributions on the board side-by-side.
  *   **The Shock:** "You started the same. You followed the same rules. You received the same two Flashes. Why are your portfolios different?"
  *   Allow 5 minutes of pair-discussion across the room divide.

  **1:05 – 1:30: Debrief & Mapping**
  *   **Elicit the Rule:** Ask a student to state the "Trading Rule" they followed. Write it formally: $P_{new}(H) = P_{old}(H | \text{Group}) \times P_{new}(\text{Group})$.
      *   "Keep the ratio" = Hold fixed the conditional probability $P(H | E_i)$.
      *   "Target Number" = The new probability of the partition cell $P_{new}(E_i)$.
  *   **Map the Divergence:**
      *   In Order 1, when you updated {B,C}, the ratio of B:C was determined by the *first* update.
      *   In Order 2, the ratio of B:C was the *prior* ratio.
      *   Because the conditional probabilities $P(B| \{B,C\})$ were different at the moment of the second update, the final result diverged.
  *   **Map the Control:**
      *   In Round 1 (Certain), one cell went to 36 (probability 1).
      *   When a cell has probability 1, the conditional probabilities of hypotheses inside it become irrelevant (they are all 0 except the truth). The "ratio" constraint drops out. This is why standard conditioning is order-insensitive.
  *   **Philosophical Close:** "Jeffrey Conditionalization tells us how to update when experience shifts our confidence in a partition without making it certain. The activity shows this rule is order-sensitive. The philosophical problem is: If two agents receive the *same* uncertain experiences, should the order matter? The math says yes. Our intuition often says no. That is the tension of uncertain evidence."

  ---

  ### Predictable Failures & Mitigations

  **1. The "Total Sum" Error**
  *   *What happens:* Students adjust the named group to the target (e.g., 18) but forget to adjust the *outside* state to ensure the total remains 36. They might leave the outside state at 12, resulting in a total of 30.
  *   *Mitigation:* The rule explicitly states "You must always hold exactly 36 chips." During monitoring, check totals. If a group has 30, ask: "The market requires 36 chips in circulation. Where are the missing 6?"

  **2. The "Ratio" Error**
  *   *What happens:* Inside the named group (e.g., {A,B}), students split the target 18 evenly (9,9) regardless of their prior ratio.
  *   *Mitigation:* This is the core of JC. If they do this, the activity fails. Emphasize in the instructions: "The *relative value* of A and B inside that group does not change, only their *total weight*." Give a concrete example on the board before Round 1: "If you have 2 Red and 4 Blue, and the Target is 18, you cannot have 9 and 9. You must have 6 and 12."

  **3. Cross-Talk**
  *   *What happens:* A student from LeftRoom whispers to RightRoom, "We just did {A,B} first."
  *   *Mitigation:* Frame it as "Insider Trading is banned and results in disqualification." Collect the envelopes immediately after opening. If contamination occurs, acknowledge it in the debrief as "noise" but focus on the groups that remained sealed.

  ---

  ### Limitations & The "Same Experience" Problem

  You are correct to suspect the limitation. The activity simulates **temporal order** (Flash 1 happens, *then* Flash 2 happens). The philosophical puzzle of Jeffrey Conditionalization often concerns **simultaneous** uncertain evidence or the question of whether two temporal sequences constitute the *same evidence*.

  **The Limitation:**
  In the activity, the students in Left Room literally had a different experience than Right Room. They saw Flash 1 while their credences were in State 0. Right Room saw Flash 1 while their credences were in State 1 (having already processed Flash 2). Because the "Trading Rule" (JC) relies on current credences to fix the conditionals, the *inputs* to the rule were technically different contexts. A critic could say: "Of course the output is different; the updates happened in different doxastic contexts. This doesn't prove JC is flawed, only that context matters."

  **How to Handle in Debrief:**
  Be frank about this.
  1.  **Acknowledge:** "In this game, the order was temporal. Left Room heard News 1 while ignorant. Right Room heard News 1 after hearing News 2."
  2.  **The Philosophical Bite:** "The philosophical problem arises if we claim that the *content* of the experience is just 'I should now be 50% confident in {A,B}'. If that is the *entirety* of the evidence, does it matter when I received it? JC says yes, because the rule anchors on my *current* conditional beliefs. If my conditional beliefs shifted due to the other news, the anchor moves."
  3.  **The Takeaway:** "The activity proves that JC is order-sensitive. It does not prove that rational agents *must* be order-sensitive. It forces you to choose: either accept that rational belief depends on the temporal sequence of uncertain inputs, or reject JC (or the idea that uncertain evidence can be fully captured by partition shifts)."

  This distinction elevates the discussion from "the math works" to "what does the math imply about rationality?" which is the goal of an upper-level seminar.
