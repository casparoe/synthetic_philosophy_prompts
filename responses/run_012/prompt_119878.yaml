  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the richness of the premise. Validate the user's confusion (Nietzsche is deliberately non-systematic). State the thesis: The spine is *Energy Economy* governed by *Instinct*.

