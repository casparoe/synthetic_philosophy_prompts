      *   *The Three Elements:* Food, Place/Climate, Recreation. Nietzsche links them because they are all inputs that affect the organism's energy economy.
      *   *Physiological vs. Aesthetic vs. Polemical:* It's all three, but rooted in a specific metaphysics of the body.
      *   *The Contempt:* Why hate the successful dieters? Because they follow *rules* (external) rather than *instinct* (internal). They are "herd" animals optimizing for survival, not greatness.
      *   *The Allegory:* Is diet reading? Yes, Nietzsche explicitly makes this connection. "Incorporation" (*Einverleibung*) is a key concept.
