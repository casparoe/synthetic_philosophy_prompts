answer: |-
  Let's start by unpacking why that naive symmetry argument feels so unsatisfying to you, because your intuition is actually spotting a real category error that the standard explanation often glosses over. When you say "if I cooperate then by symmetry you cooperate," you are invoking a counterfactual dependency that standard causal decision theory explicitly forbids. In a normal one-shot prisoner's dilemma, the causal graph says my action node and your action node are distinct leaves; pruning mine doesn't change yours. So when someone says "if I do X, you do X," they are smuggling in a causal link that isn't there, or they are relying on a common cause explanation that doesn't exist in the setup. The reason the source-code trick works isn't because it magically creates a causal link, but because it changes the ontology of what an action is. In the program equilibrium setup, we aren't choosing actions directly; we are choosing functions that output actions. When you submit a program, you aren't submitting a move like "cooperate," you are submitting a rule that says "compute the move based on the input."

  So the circularity you are worried about, the "I cooperate because you cooperate" loop, is actually dodged by the specific mechanical implementation of the cliquebot strategy. The program says "if the opponent's source code is textually identical to mine, cooperate." Notice that this condition is checked before any simulation of the game occurs. It is a syntactic check, not a semantic simulation. It doesn't ask "what will you do?" it asks "are you me?" If the answer is yes, then both programs execute the same branch of the conditional statement. There is no infinite regress here because neither program tries to simulate the other running against itself; they just compare strings. The correlation isn't evidential or causal in the physical sense; it is logical identity. They are the same function, so given the same input, they must produce the same output. The naive reasoning fails because it treats the actions as independent variables that happen to correlate, whereas the program equilibrium treats the actions as logical consequences of a single shared algorithm.

  Now, regarding your suspicion about evidential decision theory wearing a trench coat, you are right to be skeptical, but the distinction is subtle. Evidential decision theory tells you to choose the action that gives you the best news about the world, conditioning on your action as evidence. In the program equilibrium case, your source code is indeed evidence of the opponent's move, but it is stronger than evidence; it is a logical constraint. In standard EDT, the correlation between your action and the opponent's is contingent on the structure of the world, often relying on a common cause like psychology or culture. Here, the correlation is necessary truth. If my program is identical to yours, it is logically impossible for us to defect against each other while using this specific strategy. So while it violates the causal independence axiom of causal decision theory just like EDT does, it grounds the violation in mathematical necessity rather than empirical correlation. It is less like EDT and more like what some call functional decision theory, where you treat your decision as the output of a logical function that might be instantiated in multiple places. The trench coat is there, but underneath it isn't just a statistics engine; it's a logic engine.

  This brings us to the harder case you mentioned, where the agents cannot see each other's source code but can search for proofs about each other's behavior. This variant buys you robustness against obfuscation and computational limits. In the source-code swap version, if I slightly comment out a line or change a variable name, the textual identity check fails, and we defect. That is brittle. The proof-based version allows us to cooperate even if our code looks different, provided we can prove we behave equivalently. But this introduces a massive conceptual hurdle. If I simply program myself to cooperate if you cooperate, and you do the same, we deadlock. I can't verify you cooperate without running you, and you can't verify me without running me. If we try to simulate each other, we hit the halting problem. We need a way to reason about the outcome without executing the code.

  This is why we need the provability operator and why ordinary conditional reasoning fails. Ordinary conditionals are about truth values in a model, but here we are dealing with computable agents who must decide in finite time. We need a criterion that allows me to commit to cooperation based on the existence of a proof, rather than the fact of cooperation itself. So I adopt the policy "I cooperate if and only if it is provable in my formal system that you cooperate against me." You do the same. Now we have a system of logical equations: I cooperate iff it is provable that you cooperate, and you cooperate iff it is provable that I cooperate. This looks circular, and in a weaker logic, it would be. We would be stuck in an infinite regress of "I prove that you prove that I prove..."

  The reason this works where ordinary conditionals fail is Löb's theorem, which is the heavy lifter here. Löb's theorem essentially says that if a formal system can prove that "if a statement is provable, then it is true," then the statement is actually provable. In our context, if I can prove that "if it is provable that you cooperate, then you cooperate," then I can prove that you cooperate. Since our strategies are symmetric and known, I can indeed prove that conditional statement about you, because your strategy is defined to cooperate exactly when cooperation is provable. This allows the logical loop to close. The self-referential lemma is not just a technical trick to avoid infinite regress; it is the mechanism that allows logical trust to emerge from transparency. Without it, two agents looking at each other's logic would see only an infinite mirror hall. With it, they can find a fixed point where mutual cooperation is the only stable logical outcome.

  So is there a real philosophical question about transparency here, or is it just technical? It is deeply philosophical because it challenges the notion of separate agency. In standard game theory, agents are black boxes with independent wills. In this proof-based setup, agents are transparent logical structures inhabiting the same mathematical universe. When I prove something about you, I am not gathering empirical data; I is deriving a truth about a logical object that exists in the same space as me. The transparency isn't about seeing the code; it is about sharing a logic. If we share a formal system strong enough to support Löb's theorem, we can coordinate on outcomes that are impossible for opaque agents. The technicality of the self-referential lemma is the price of admission for this kind of agency. It implies that for agents to cooperate perfectly without binding contracts, they must be legible to each other not just in behavior but in reasoning structure. They must be able to trust each other's proofs, which means trusting each other's rationality in a way that transcends physical separation. This suggests that the fundamental barrier to cooperation in the prisoner's dilemma isn't conflicting interests, but conflicting epistemologies. If we can align our logic, the game theory changes. So when you put this on the board, the point isn't just that programs can cooperate; it is that decision theory breaks down when agents are logically transparent to one another, and we need a new framework to handle decisions that are logically entangled rather than causally independent. The source-code trick is the simple version of this, but the proof-based version shows that the cooperation comes from the shared logical landscape, not just the ability to read text.
