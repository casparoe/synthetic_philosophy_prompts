  2. The theory must acknowledge that clearing prices reflect power rather than desert when a single employer dominates a labor market, making this requirement non-negotiable despite the prejudice of the property-rights camp that any interference is unjust.
  3. A justified control must distinguish between a six-month emergency freeze where survival is at stake and a thirty-year ceiling, since treating the latter as the former violates the requirement of sustainability and is non-negotiable.
  4. The criterion must offer a reason acceptable to those who lose by the control, because a standard that cannot be defended to the losers is of no use for stable governance, making this requirement non-negotiable since it does the most to rule out the theories people actually hold.
  5. Where efficiency demands price movement to clear queues but equity demands stability for tenants, the theory must specify a threshold for overriding the market, making this requirement non-negotiable to avoid becoming merely the prejudice of one camp.
