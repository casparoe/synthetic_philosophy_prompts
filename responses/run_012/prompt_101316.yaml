  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Context:** 300-level Philosophy of Action seminar, 18 students, 75 minutes.
      *   **Topic:** Weakness of Will (Akrasia).
      *   **Goal:** Make students *feel* the problem, not just hear about it. Specifically, target the tension between preference reversal (hyperbolic discounting) and the phenomenology of betrayal/self-binding.
      *   **Key Philosophical Tension:** If preference flips, it's just a change of mind. Why does it feel like a violation? Why pay to bind a future self if that self is just "you" with different preferences?
      *   **Constraints:** No lecture up front. No standard names (Davidson, Ainslie, etc.) until debrief.
      *   **Required Mechanics:**
          *   Short, real delays (minutes, not days).
          *   Larger-later option must arrive *before* class ends.
          *   Betting on future choices (meta-prediction).
          *   Tradeable commitments (TA as broker, prices to lock/forbid).
      *   **Required Output:** Rules, materials, payoff scheme, timeline, debrief map.
      *   **Required Critique:** Honest failures, gaming strategies, market collapse scenarios, limitations of the simulation.

  2.  **Deconstruct the Philosophical Problem:**
      *   *The Reversal:* I want $20 tomorrow more than $15 today. But when "today" becomes "now," I want $15 now more than $20 tomorrow.
      *   *The Betrayal:* If I'm just a sequence of time-slices, the "now" slice isn't violating the "past" slice's wish; it's just optimizing for current preferences. So why do we feel guilty?
      *   *The Binding:* Why pay $5 to prevent myself from taking $15 now, to ensure I get $20 tomorrow? If the future me wants $20, I don't need to bind. If the future me wants $15, binding helps. But paying to bind implies I distrust my future rationality.
      *   *The Simulation Challenge:* Real akrasia involves acting against a *standing judgment*. Simulations usually just create preference reversals. I need to make the standing judgment salient (via the betting/commitment phase).

  3.  **Drafting the Activity: "The Akrasia Market"**

      *   *Currency:* Candy (immediate) vs. Extra Credit Lottery Tickets (delayed but within class). Let's use "Tokens" redeemable for specific prizes at specific times.
      *   *Prizes:*
          *   Option S (Small/Soon): 2 Hershey Kisses (delivered Round 3).
          *   Option L (Large/Late): 5 Hershey Kisses (delivered End of Class).
          *   *Wait, the prompt says Larger-Later must arrive before we finish.* Okay, let's make "Later" = 45 minutes from now (end of class) and "Soon" = 15 minutes from now (mid-class).
      *   *Rounds:*
          *   Round 1 (T=0): Planning phase. Choose S or L. Bet on your future choice.
          *   Round 2 (T=20): Commitment Market. Buy/sell restrictions.
          *   Round 3 (T=40): Decision point. Execute choice.
          *   Round 4 (T=70): Payout & Debrief.

      *   *Refining the Mechanics:*
          *   *Betting:* Students get 3 "Confidence Chips." They can bet on themselves taking L. If they take L, they keep chips + get prize. If they take S, they lose chips. This creates a *standing judgment* (I claim I will take L).
          *   *Commitments:* They can spend chips to buy a "Lock." A Lock forbids choosing S in Round 3. Cost? Maybe 1 Chip.
          *   *Trading:* Can they sell a Lock? If I buy a Lock but then change my mind, can I sell it to someone else? This captures the "selling out" aspect.
          *   *The Twist:* The value of the chips must matter. Let's make Chips redeemable for extra credit entries.

      *   *Addressing the "Real Delay":*
          *   Start: 0:00.
          *   Choice: 0:10.
          *   Payout S: 0:40.
          *   Payout L: 1:15 (End of class).
          *   This works.

      *   *Addressing the "Betrayal":*
          *   The betting slip is the key. They sign a contract at T=0 saying "I will wait."
          *   At T=40, if they take S, they physically tear up the contract or hand it in marked "FAILED."

  4.  **Developing the Timeline (75 mins):**
      *   0-5: Setup & Rules (No theory).
      *   5-15: Round 1 (Preference & Prediction).
      *   15-35: Round 2 (Commitment Market).
      *   35-45: Break/Waiting (The "Heat" of temptation).
      *   45-55: Round 3 (The Choice).
      *   55-60: Payout S (Immediate gratification visible).
      *   60-75: Payout L & Debrief.

  5.  **Refining the Payoff/Market:**
      *   *Base:* 2 candies now vs 5 candies end-of-class.
      *   *Meta-Bet:* 3 Raffle Tickets (for a $20 Amazon card or similar).
      *   *Commitment:* Cost 1 Raffle Ticket to buy a "Seal." If you have a Seal, you *cannot* take the 2 candies. If you break the Seal, you lose all Raffle Tickets.
      *   *Market:* TA acts as broker. Can you sell a Seal? If I bought a Seal but now want candies, can I sell the Seal to a classmate? (Maybe too complex). Let's simplify: You can buy a "Burn" option. You pay 1 Ticket to make the Small option unavailable to *you*.
      *   *Better Market Idea:* "Insurance." You can pay 1 Ticket to insure your Future Self. If you cave, you get the Ticket back. If you hold, you lose it (cost of insurance). No, that's confusing.
      *   *Best Market Idea:* "The Bond." You post 2 Tickets. If you choose L, you get 3 back (Profit). If you choose S, you lose the 2. You can trade these Bonds? No, keep it individual to avoid collusion.
      *   *Let's stick to the Prompt's request:* "Commitments become tradeable."
      *   *Mechanism:* "Vouchers."
          *   At T=0, everyone gets a "Future Self Contract."
          *   At T=15, they can buy a "Lock" for 1 Chip.
          *   *Trading:* If I have a Lock but want S, I can sell the Lock to someone who wants L but is afraid they will cave.
          *   *Price:* Negotiated between students, TA records.
          *   *Why sell?* I need the Chips more than the Lock.
          *   *Why buy?* I need the Lock more than the Chips.
          *   *Philosophical point:* Selling the Lock = Selling out your integrity for immediate currency.

  6.  **Addressing the "Honest Failures":**
      *   *The Gamer:* Treats it as expected value. If 5 candies > 2 candies, they just do the math. No internal conflict.
      *   *The Cynic:* Knows the trick. "This is the hyperbolic discounting demo." They perform the 'right' behavior.
      *   *Market Collapse:* Everyone colludes to split the pot. Or no one trades because transaction costs are too high.
      *   *The Missing Datum:* The simulation creates *regret* and *preference reversal*, but not necessarily *acting against a concurrent judgment*. In the sim, when they grab the candy, they probably *want* the candy more in that moment. The "judgment" was the betting slip, not the current desire. I need to highlight this gap in the debrief.

  7.  **Finalizing the Design:**
      *   *Name:* "The Bond Protocol."
      *   *Materials:* Envelopes, Candy, Raffle Tickets, "Lock Cards."
      *   *Payoff:* Candy (immediate/delayed) + Raffle Tickets (grade/privilege).
      *   *Timeline:* Tighten the waiting period to make it palpable.
      *   *Debrief:* Map the specific feelings to Davidson vs. Ainslie.

  8.  **Self-Correction/Review against Prompt:**
      *   *Delays short enough?* Yes (20 mins vs 50 mins).
      *   *Larger-later arrives before finish?* Yes (End of class).
      *   *Betting on future choices?* Yes (Raffle Tickets staked on prediction).
      *   *Tradeable commitments?* Yes (Lock Cards traded via TA).
      *   *Honest failures included?* Yes.
      *   *No lecture up front?* Yes.

  9.  **Drafting the Content:** (Mental check of the flow)
      *   Intro needs to be dry. "We are doing a decision task."
      *   The "Heat" needs to be real. Put the candy on the table.
      *   The Market needs to be chaotic. TA needs to be an active broker.
      *   Debrief needs to be surgical.

  10. **Refining the "Tradeable Commitment":**
      *   If I sell my commitment, I am literally selling my integrity to someone else who trusts themselves less than I do? Or am I selling the *right* to be bound?
      *   Let's make it: A "Veto Token." If you hold it, you cannot choose S.
      *   If you buy it, you pay Chips.
      *   If you sell it, you gain Chips but expose yourself to S.
      *   This captures "selling out."

  11. **Final Polish:** Ensure the tone is appropriate for a professor (collegial, precise, critical). Make sure the limitations are stark. (Self-correction: Ensure the "betrayal" feeling is maximized by making the initial commitment public or semi-public).

      *   *Idea:* Have them write their intended choice on the board? Too much pressure.
      *   *Idea:* Hand the betting slip to the person next to them. "Hold me accountable."
      *   *Decision:* Keep it semi-private but formalized with the TA.

      *   *Wait, one constraint:* "Larger-later option actually arrives before we finish."
      *   If Class is 75 mins.
      *   T=0: Start.
      *   T=45: Small Option Payout.
      *   T=75: Large Option Payout.
      *   This works.

      *   *Wait, another constraint:* "Delays have to be short enough to reverse inside the session."
      *   This means the *gap* between decision and payout must be experienced.
      *   Decision at T=20. Small Payout T=40. Large Payout T=70.
      *   This gives 20 mins of temptation.

      *   *Let's write it.*
answer: |-
  # Activity Design: "The Bond Protocol"

  **Course:** 300-Level Philosophy of Action
  **Topic:** Weakness of Will (Akrasia)
  **Time:** 75 Minutes
  **Students:** 18
  **Goal:** Induce preference reversal and the cost of self-binding without naming the theoretical framework until the debrief.

  ## I. Materials & Payoff Scheme

  **Currency:**
  1.  **Treats:** High-quality chocolate (immediate gratification).
  2.  **Tickets:** Raffle tickets for a $50 Amazon gift card (or 1% extra credit guarantee). These represent "long-term value."

  **Physical Props:**
  *   18 Envelopes (sealed, labeled with Student Names).
  *   36 "Lock Cards" (thick cardstock, distinct color).
  *   18 "Prediction Slips."
  *   A visible bowl of chocolate.
  *   A visible jar for Raffle Tickets.
  *   Whiteboard for Market Prices.

  **The Payoff Structure:**
  *   **Option S (Small/Soon):** 3 pieces of chocolate. Delivered at **T+40 mins**.
  *   **Option L (Large/Late):** 1 Raffle Ticket. Delivered at **T+70 mins** (End of Class).
      *   *Note:* You must establish the exchange rate early. Tell them: "Historically, students value 1 Ticket as roughly equivalent to 5 pieces of chocolate, but this varies." (This creates ambiguity to allow preference divergence).
  *   **The Stake:** Each student starts with **3 Personal Tickets**.
  *   **The Bet:** On the Prediction Slip, they wager 1 Personal Ticket that they will choose Option L.
      *   If they choose L: They keep the wagered Ticket + get the Option L Reward (Total 4 Tickets).
      *   If they choose S: They lose the wagered Ticket + get Option S Reward (3 Chocolates, 0 Tickets).
  *   **The Lock:** A Lock Card physically prevents a student from selecting Option S. To acquire a Lock, they must pay 1 Personal Ticket to the "House" (TA).
      *   *Trading:* Locks can be sold between students at negotiated prices, recorded by the TA.

  ## II. Timeline (75 Minutes)

  **0:00 – 0:05: Setup (The Dry Frame)**
  *   **Instructor:** "We are running a decision task. There is no right answer. There is only payout. Do not discuss your strategy with neighbors."
  *   Distribute Envelopes (empty for now), 3 Personal Tickets, and Prediction Slips.
  *   **Crucial Instruction:** "On the Prediction Slip, write what you *intend* to choose at T+40. If you write 'L', you must hand over 1 Personal Ticket now as a stake. If you write 'S', no stake."
  *   *Philosophical Hook:* This creates a **Standing Judgment** at T=0. They are committing to a future identity.

  **0:05 – 0:15: Round 1 (Planning)**
  *   Students fill slips. Most will wager on L (social desirability + rational calculation).
  *   Collect Slips. TA records the "Class Intention" on the board (e.g., "16/18 intend to wait").
  *   *Silence.* Put the bowl of chocolate on the front table. Unwrap one piece. Eat it slowly.

  **0:15 – 0:35: Round 2 (The Commitment Market)**
  *   **Instructor:** "You may now purchase a Lock. A Lock makes Option S impossible for you. Cost: 1 Personal Ticket."
  *   **The Twist:** "If you buy a Lock but change your mind, you may sell it to another student. The TA is the broker. Prices are public."
  *   **Action:**
      *   Some students (anticipating weakness) buy Locks.
      *   Some students (confident or wanting liquidity) sell Locks.
      *   *Watch for:* A student selling a Lock they bought 2 minutes ago. This is the "selling out" moment.
      *   TA announces prices: "Student A sold a Lock to Student B for 0.5 Tickets."

  **0:35 – 0:45: The Wait (The Heat)**
  *   **Instructor:** "No further transactions. Sit with your choice."
  *   This 10-minute silence is critical. The chocolate is visible. The "Soon" payout is 5 minutes away. The "Later" payout is abstract.
  *   *Observation:* Watch who looks at the chocolate vs. who looks at their Lock Card.

  **0:45 – 0:55: Round 3 (The Choice)**
  *   **Instructor:** "Submit your final choice. If you hold a Lock, Option S is void."
  *   Students hand in choice cards.
  *   **Immediate Payout:** Distribute Chocolate to Option S choosers *immediately*. Unwrap it. Let them eat it in front of the Option L choosers.
  *   *Phenomenology:* This creates the visceral disparity. The S-choosers have sugar; the L-choosers have paper promises.

  **0:55 – 1:05: Settlement**
  *   Collect Prediction Slips.
  *   Compare Intention (T=0) vs. Action (T=45).
  *   Calculate Ticket losses for those who intended L but chose S.
  *   Distribute Raffle Tickets to L-choosers.

  **1:05 – 1:15: Debrief (The Map)**
  *   (See Section IV below).

  ## III. Rules for the TA (House Broker)

  1.  **Liquidity:** If no one wants to buy a Lock, the TA can buy it back at 0.5 Tickets to keep the market moving.
  2.  **Transparency:** Announce every trade aloud. "Student X is liquidating their commitment."
  3.  **Enforcement:** If a student with a Lock tries to choose S, reject it silently. Hand them a note: "You bound yourself."
  4.  **No Theory:** Do not use words like "akrasia," "discounting," "preference," or "rationality" until the debrief. Use "Choice," "Value," "Lock," "Ticket."

  ## IV. The Debrief: Mapping Moments to Theory

  Do not lecture. Ask questions that force them to locate the tension.

  **1. The Reversal (Hyperbolic Discounting)**
  *   *Ask:* "Look at the board. 16 of you intended L at T=0. Only 10 chose L at T=45. What changed?"
  *   *Expected Answer:* "The chocolate was right there." "Waiting felt harder than I thought."
  *   *Map:* "You describe a change in *temperature*, not a change in *math*. The value of the ticket didn't drop. The pain of waiting rose. This is the **Preference Reversal** model. At T=45, you didn't violate a preference; your preference flipped."

  **2. The Betrayal (The Davidsonian Problem)**
  *   *Ask:* "For those who switched from L to S: Did you feel like you made a new rational calculation, or did you feel like you *failed*?"
  *   *Ask:* "Why did you lose a Ticket for switching? Because you broke a contract with *yourself*."
  *   *Map:* "If preference reversal is just a change of mind, why the guilt? Why the penalty? This suggests you hold a **Standing Judgment** that persists even when your desire flips. You acted against a judgment you still endorsed. That is the philosophical itch."

  **3. The Market (Self-Binding & Identity)**
  *   *Ask:* "Who bought a Lock? Why pay 1 Ticket to remove freedom?"
  *   *Ask:* "Who sold a Lock? You traded a constraint for liquidity. What did that feel like?"
  *   *Map:* "Buying a Lock admits your future self is untrustworthy. Selling a Lock admits you value immediate currency over integrity. The market price of a Lock is the **Market Price of Self-Distrust**."

  ## V. Honest Failures & Limitations

  **1. The Expected-Value Gamer**
  *   *Failure:* A student calculates: 1 Ticket = $50 chance. 3 Chocolates = $3 value. They choose L coldly. Or vice versa. They feel no conflict.
  *   *Live Fix:* In the debrief, isolate them. "You didn't experience weakness of will; you experienced price fluctuation. You are the 'Rational Agent' this theory struggles to describe. You are the control group."

  **2. The Behavioral Econ Spoiler**
  *   *Failure:* A student says at T=10, "This is clearly a hyperbolic discounting task. I know I need a Lock."
  *   *Live Fix:* "Knowing the trap doesn't spring it. Do you *feel* the pull, or are you just roleplaying rationality? Check your pulse during the Wait."
  *   *Risk:* They might preach to the class. Shut it down: "Save the theory for the last 10 minutes. Right now, just trade."

  **3. Market Collapse (Collusion)**
  *   *Failure:* Students realize if they all buy Locks and hold, the House loses. Or they trade Locks back and forth to game the ticket count.
  *   *Risk:* The "price of self-distrust" becomes arbitrary.
  *   *Mitigation:* The TA must enforce a "No Wash Trading" rule (cannot sell back to the same person within 2 mins). If collusion happens, call it out in debrief: "You formed a union to defeat the mechanism. That's collective agency, not individual weakness."

  **4. The Missing Datum (The Hard Limit)**
  *   *Limitation:* The simulation cannot reproduce **acting against a concurrent judgment.**
  *   *Why:* In the sim, when they grab the chocolate at T=45, they *want* the chocolate more than the ticket in that moment. Their judgment *has* flipped.
  *   *The Gap:* True akrasia (on some accounts) is choosing S while *still believing* L is better *at the moment of choice*.
  *   *Debrief Honesty:* "This activity produced **Regret** and **Preference Reversal**. It produced **Naivety** (not buying the lock) and **Binding**. But did anyone grab the chocolate while genuinely thinking 'I should not do this'? Or did you just think 'I want this more'? If the latter, the simulation failed to capture the core paradox. It captured the *cost* of weakness, not the *structure* of it. I have to tell you about that structure; I couldn't make you feel it."

  ## VI. Contingency Plans

  *   **If no one buys Locks:** "The market values freedom over security. Interesting. Why did you trust your future selves?" (Leads to discussion of Naivety).
  *   **If everyone buys Locks:** "The market values security over freedom. You all distrust yourselves equally. Why?" (Leads to discussion of Pre-commitment).
  *   **If the Chocolate is ignored:** The stakes were wrong. Acknowledge it: "The currency didn't bite. Philosophy of action requires stakes that matter. Next time we use real money."

  ## VII. Instructor's Cheat Sheet (For Debrief Only)

  *   **Donald Davidson:** "Incontinent action is intentional, yet against one's better judgment." (The feeling of betrayal).
  *   **George Ainslie:** "Hyperbolic Discounting." (The preference flip over time).
  *   **Thomas Schelling:** "Self-Binding." (The market for Locks).
  *   **The Gap:** Ainslie explains *why* you flip. Davidson describes *what it feels like*. The simulation bridges them with **Cost**. You pay (Tickets) to avoid the flip, because the flip feels like a loss.
