answer: |-
  Your distinction between (a) prophecy, (b) scaffolding/constraints, and (c) quantitative macro-history is not just relabeling; it is a necessary carving of the conceptual space that Popper unfortunately flattened. However, your confidence that Popper's critique leaves (b) untouched is too generous. That is the first place I will push.

  Popper's argument is not merely that we cannot predict the *content* of future knowledge, but that the *causal efficacy* of knowledge disrupts any closed-system generalization. Your Type (b) claims ("You can't sustain X without Y") look like structural constraints, but in social history, structures are constituted by agents who learn. If the "scaffolding" relies on coordination costs, information asymmetry, or resource extraction, and knowledge growth alters those parameters (e.g., cryptographic trust reducing coordination costs), the constraint dissolves. Popper isn't irrelevant to (b); he just shifts the burden of proof. You have to show why certain constraints are *invariant* to knowledge growth. That is a much harder philosophical lift than you're allowing.

  Regarding the $n=1$ problem: If history is a singular process, "law" is a category mistake unless you shift from "laws of History" to "laws in historical processes." The former implies a totality; the latter implies reusable mechanisms within the totality. Your postdoc needs to decide which ontology you are buying, because it dictates whether you are doing metaphysics or methodology.

  Here is the prioritized agenda. I have ordered these by logical dependency (upstream/downstream) and tractability for a philosopher with a formal background who is not a modeler.

  ### Priority 1: The Reference Class Problem for Singular Processes ($n=1$)
  **The Question:** Can we justify inductive inference or modal claims about a process that occurs only once, without resorting to a "multiverse" of possible histories or reducing history to psychology/physics?
  **Why Upstream:** This is the metaphysical bottleneck. If you cannot solve (or dissolve) the $n=1$ problem, neither Type (b) constraints nor Type (c) models have a truth-apt status. They become mere narratives or heuristics. You cannot determine what a "law of history" looks like until you determine if the domain *History* supports law-like predicates.
  **Tractability:** High for your background. This is a problem in inductive logic, Bayesian confirmation theory, and the metaphysics of natural kinds. It does not require running simulations. It requires analyzing the conditions under which a singular trajectory can support counterfactuals.
  **Neglectedness:** High. Most philosophers of social science assume away the singular nature of the macro-process and focus on micro-foundations. Most historians assume the singular nature makes laws impossible. The middle ground (logic of singular inference) is empty.
  **Dependencies:** Priority 2 depends on this. If the answer is "No, $n=1$ precludes laws," you pivot to a project on historical explanation without laws. If "Yes," you proceed to classify the laws.
  **Risk Factor:** This could turn into a pure metaphysics project with no contact with actual science. To prevent this, constrain the inquiry to **sub-system independence**. Don't ask if *History* has laws; ask if *historical subsystems* (e.g., state formation, demographic transitions) can be treated as independent trials within the singular process.
  **What Moves It Up:** If the postdoc finds a robust logical framework for singular confirmation (e.g., via algorithmic complexity or specific Bayesian priors on structural constraints).
  **What Moves It Down:** If it becomes clear that the only solution is to reduce history to psychology (which you likely reject) or physics (which loses the historical specificity).

  ### Priority 2: The Modal Logic of Structural Constraints (Your Type b)
  **The Question:** What is the modal force of claims like "No large-scale X without Y"? Are they conceptual truths, nomological necessities, or robust empirical generalizations? And crucially, are they *knowledge-proof*?
  **Why Upstream:** This defines the target. Before evaluating Type (c) models, you must know what success looks like. If Type (b) claims are the only defensible "laws," then Type (c) models should be judged on their ability to identify these constraints, not on their predictive accuracy (Type a).
  **Tractability:** High. This is conceptual analysis augmented by formal modal logic. You can model the logical relationship between constraints and initial conditions without modeling the dynamics themselves. You can analyze the *ceteris paribus* clauses required to make these constraints hold.
  **Neglectedness:** Medium-High. There is work on mechanisms and capacities, but little specifically on *historical* constraints that are meant to be trans-epochal but not predictive of timing.
  **Dependencies:** This resolves the "Popper is irrelevant to (b)" hunch. You will likely find Popper is relevant unless you can specify a class of constraints that are insensitive to knowledge growth (e.g., thermodynamic limits vs. organizational limits).
  **Risk Factor:** The "Not Philosophy" Flag. If this turns into cataloging sociological generalizations, you are doing comparative history, not philosophy. To keep it philosophical, focus on the **logic of the constraint**: Is it a functional prerequisite? A game-theoretic equilibrium? A physical limit? The taxonomy is the philosophy.
  **What Moves It Up:** If you can formally distinguish between *contingent regularities* and *structural constraints* using invariance criteria (e.g., Woodward-style interventionism adapted for history).
  **What Moves It Down:** If every proposed constraint turns out to have historical counter-examples (e.g., "No empire without bureaucracy" vs. nomadic empires). This would suggest Type (b) is just Type (a) in disguise.

  ### Priority 3: (The Trap) Epistemic Evaluation of Macro-History Models (Your Type c)
  **The Question:** How do we evaluate dynamical models of history given the $n=1$ problem and the lack of out-of-sample testing?
  **Why Downstream:** You cannot answer this until you know if the domain supports laws (Priority 1) and what kind of laws they are (Priority 2).
  **Tractability:** **Low.** You stated you are not a modeler. To evaluate these models philosophically without understanding their mathematical structure is to risk "peer review from orbit." You will be critiquing the philosophy of the model without being able to critique the model itself.
  **Neglectedness:** Low. This is currently a hot topic in philosophy of social science (cliodynamics, complexity economics). You would be entering a crowded room.
  **Dependencies:** Depends entirely on the output of 1 and 2.
  **The "Not Philosophy" Flag:** **High Risk.** If the postdoc spends two years learning agent-based modeling to critique it, you have hired a computational social scientist, not a philosopher. If they spend two years critiquing the *concept* of modeling without engaging the math, they will be ignored by the modelers and found shallow by the philosophers.
  **Recommendation:** Do not make this a primary research question. Make it a **case study** for Priority 2. Use existing models (e.g., Turchin, Zeitz) as test cases for your taxonomy of constraints. Do not try to improve the models; try to interpret their claims.
  **What Moves It Up:** Only if the postdoc happens to have a strong math background (unlikely given your description) or if you collaborate with a modeler who needs a philosopher to interpret their output (risky for tenure/promotion credit).
  **What Moves It Down:** Immediately, if the project starts looking like "philosophical commentary on specific papers" rather than "general account of historical inference."

  ### Summary of Ordering and Strategy

  1.  **Start with Priority 1 ($n=1$ / Reference Class).** It is the hardest metaphysical hurdle. If you clear it, the rest of the project is viable. If you don't, you need to know that in year one, not year three. Frame it as "Invariance in Singular Systems."
  2.  **Move to Priority 2 (Constraints).** This is your core contribution. It refines Popper. It utilizes your logic background. It produces a taxonomy that historians and social scientists can actually use.
  3.  **Use Priority 3 (Models) only as Data.** Do not make it a research goal. Use it to test the taxonomy from Priority 2.

  ### Where Your Framing is Wrong
  You suspect Popper is "close to irrelevant" to Type (b). I argue this is the weakest link in your provocation. Popper's argument is about the *openness* of the system. Type (b) claims often assume a *closed* system (e.g., "given human psychology as it is"). But if human psychology is part of the historical process and evolves via knowledge growth, the constraint is not stable.
  **Your postdoc's first real task:** Find a Type (b) claim that survives the "Knowledge Growth" test. If they can't, Popper wins, and there are no laws of history, only laws of human nature (which is psychology, not history) or physics. If they can, they have saved Historicism from Popper, which is a significant philosophical result.

  ### Dynamic Factors (Next 2-3 Years)
  *   **Move Priority 1 Down if:** The postdoc gets bogged down in pure metaphysics with no connection to scientific practice. Pivot to Priority 2 and treat $n=1$ as a methodological assumption rather than a metaphysical truth.
  *   **Move Priority 2 Up if:** There is a surge in "structuralist" social science that explicitly claims to find invariant constraints. (Currently, the trend is more toward complexity/contingency, which makes your project more countercultural and valuable).
  *   **Kill Priority 3 if:** The postdoc starts writing code. That is a failure of the grant's purpose.

  **Final Verdict:** Your distinction is real and worth pursuing. But do not let the postdoc off the hook regarding Popper's critique of (b). The value of this seminar and research agenda lies in testing whether *any* historical statement can be immune to the unpredictability of knowledge. If the answer is no, you have a negative result that is still publishable. If the answer is yes, you have a new theory of historical law. Both are better than a vague defense of macro-history.
