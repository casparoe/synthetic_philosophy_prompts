      *   No literature/names? Yes.

  *(Self-Correction during final polish)*: Make sure the non-transitive identity case is described vividly enough to be "conceivable" to the reader, even if Marcus denies it. I'll use a "fusion" scenario where boundaries dissolve.

  Let's write.

