      *   *Loss:* The aspiration to perfect contextual justice.

      *   *Wait, one last check on the Revision.*
      *   If I change (6) to "Refusals should track *reasonable assessments* of harm," does it fix (3)?
      *   Yes, because a rulebook can define "reasonable assessment."
      *   Does it fix (1)? No, but (1) wasn't broken.
      *   Does it fix (5)? Yes, aligns with doubt.
      *   Okay, that works.

      *   *Wait, what if I revise (3)?*
      *   "Legible... stable... except where contextual nuance requires."
      *   That destroys (3).
      *   So revising (6) is better.

