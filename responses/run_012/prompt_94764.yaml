answer: |-
  **The Friction of Omniscience: Epistemic Modelling and the Practice of AI**

  The irritation you describe is not merely a pedantic quibble about formalism; it is a symptom of a deeper conceptual fracture in how we construct and evaluate intelligent systems. When computer scientists and AI researchers model an agent's epistemic state using standard possible-worlds semantics or classical knowledge bases, they are not simply choosing a convenient mathematical tool. They are inheriting a specific, contentious philosophical anthropology. The standard move—defining knowledge as truth across all accessible worlds, or as the deductive closure of a sentence set—imports a theory of the epistemic subject that is radically at odds with the engineered reality of the systems we build. The question is whether this import is a harmless idealisation, akin to assuming frictionless planes in mechanics, or a substantive commitment that distorts our understanding of what these agents are and how they should be held to account.

  To understand what the practice presupposes, we must distinguish between the mathematical machinery and the epistemic interpretation laid over it. Mathematically, a set of possible worlds is just a structure; a knowledge base is just a database. However, the practice of calling this structure 'knowledge' and treating the agent as 'knowing' everything true within that structure commits us to a specific normative theory. It presupposes that knowledge is a state of being rather than a process of becoming. In this view, the epistemic subject is transparent to itself. If the information is present in the system, the subject is credited with possessing it, regardless of the computational labour required to retrieve or transform it.

  This practice relies on a conception of the agent as a logical god, or at least a logical saint. It assumes that the barrier to knowledge is solely informational, never computational. Philosophically, this aligns with a strong internalist tradition where justification is automatic if the premises are held. It requires us to accept the closure principle: if an agent knows $\phi$ and knows that $\phi$ entails $\psi$, then the agent knows $\psi$. In the standard modelling practice, this is not a heuristic; it is a definition. To model the agent otherwise would be, within this framework, to say the agent is irrational. Thus, the practice does not merely sit comfortably with a closure-based epistemology; it strictly requires it to maintain the label of 'knowledge'. If one wishes to deny closure, one cannot use the standard semantic consequence relation without changing the name of the relation.

  Is this merely an idealisation? The defence often offered is that this is a 'spherical cow' scenario: a simplification necessary to make the mathematics tractable, with no intent to describe reality. But there is a crucial disanalogy between frictionless planes in physics and logical omniscience in AI. When a physicist assumes no friction, they do not subsequently blame the block for failing to slide when friction is reintroduced. They adjust the model. In AI practice, however, the omniscience assumption is retained in the theoretical specification while being quietly abandoned in the engineering evaluation. We verify safety properties assuming the agent knows all logical consequences of its constraints, yet we grade the agent's performance based on token budgets and latency limits that prevent it from deriving those consequences.

  This generates a pragmatic inconsistency. One part of the practice treats knowledge as unbounded and closure-closed (typically during verification or formal specification), while another treats it as bounded and retrieval-dependent (during deployment and evaluation). This is not merely engineering reality papering over theoretical idealism; it is a category error. When we claim the agent 'knows' a safety constraint because it is entailed by its reward function, we are making a claim about its reliability. When that agent fails to adhere to the constraint because the derivation was too computationally expensive, the failure is not just a performance dip; it is a falsification of the initial knowledge attribution. The inconsistency lies in using a normative ideal to make descriptive predictions. We are attributing a capacity (knowledge) that implies availability, while building a system where availability is contingent on resource expenditure.

  So, where is the practice underdetermined, and where is it committed? The formalism itself is surprisingly flexible. One can use possible-worlds structures to model belief, database states, or counterfactuals without committing to omniscience, provided one refrains from interpreting the accessibility relation as an epistemic alternative relation in the strict Hintikkan sense. The underdetermination lies in the topology of the worlds; we can choose structures that do not enforce closure. However, the substantive commitment is forced the moment we use the vocabulary of 'knowledge' alongside classical entailment. To say 'the agent knows' is to make a commitment to the usability of that content. If the practice allows for content that is 'known' but inaccessible due to compute limits, then the word 'knowledge' is doing no work distinct from 'stored data'. The commitment forced by the standard practice is that storage equals access. This is a philosophical claim about the nature of mind and memory that no current silicon architecture supports.

  If we were to drop the omniscience assumption, what would have to change in the practice itself? It is insufficient to simply tweak the formalism with impossible worlds or awareness operators while keeping the discourse the same. The change must be linguistic and evaluative. We would have to stop speaking of the agent's 'knowledge state' and start speaking of its 'inferential trajectory'.

  Currently, we ask: 'What does the agent know?' A non-omniscient practice would require us to ask: 'What can the agent retrieve within budget $B$ given heuristic $H$?' This shifts the focus from the static content of the system to the dynamics of its processing. It means that knowledge attributions become relative to computational context. An agent might 'know' $\phi$ at time $t_1$ with a large budget, but not at time $t_2$ with a constrained budget. This looks messy, but it is honest.

  Furthermore, dropping omniscience would likely require abandoning the binary framing of knowledge altogether in favour of graded accessibility or confidence. In the standard model, a proposition is either true in all accessible worlds or it is not. In a resource-bounded practice, a proposition is 'accessible' to a degree proportional to the cost of deriving it. This suggests that the knowledge-based framing might indeed have to go, or at least be radically redefined. We would move from a 'Knowledge Base' to a 'Probabilistic Inference Engine'. We would stop verifying whether an agent 'knows' a rule and start measuring the probability that it will successfully apply the rule under specific resource constraints.

  This shift would also alter how we assign responsibility. Under the omniscience model, if an agent fails to act on a logical consequence of its knowledge, it is malfunctioning; it is irrational. Under a bounded model, such a failure might be an expected trade-off. If we acknowledge that the agent does not know everything entailed by its data, we cannot blame it for failing to act on remote entailments. This forces a change in safety engineering: we cannot rely on the agent to 'know' its constraints implicitly; we must engineer explicit, low-cost retrieval paths for critical constraints.

  Ultimately, the irritation you feel stems from the fact that the field is trying to have it both ways. We want the normative force of 'knowledge'—which implies reliability, justification, and availability—without the ontological cost of building a mind that actually possesses those traits. We use the language of epistemology to describe systems that are merely causal engines. To resolve this, we do not necessarily need new logic, though that would help. We need a new vocabulary. We must cease treating our models as descriptions of what an agent *has* and start treating them as descriptions of what an agent *does*. Until we do, we will remain stuck in a cycle where we build bounded reasoners, describe them as omniscient, and then punish them for being human.
