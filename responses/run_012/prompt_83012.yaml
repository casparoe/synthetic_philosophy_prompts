      *   *The State Space Trick:* Address the "redraw the state space" point. This is the "Harsanyi Doctrine" vs. "Agreeing to Disagree." If you expand the state space to include priors, you need a *hyper-prior*. If that's common, Aumann applies. If not, you haven't solved it. The issue is whether the *structure of uncertainty* is common knowledge.
