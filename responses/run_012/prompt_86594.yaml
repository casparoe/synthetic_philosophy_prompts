answer: |-
  You have independently reconstructed a significant portion of **Decision Theory** and **Information Economics**. Your intuition is precise: the cluster of ideas you are circling is formally known as the **Value of Information (VoI)** framework, and the specific guarantee you mention is **Good's Theorem**.

  Here is the mapping of your three insights to the technical concepts, followed by a resolution of the argument with your friend.

  ### 1. The Name of the Cluster
  The general field is **Decision Analysis**. The specific metric you are describing is the **Expected Value of Information (EVI)**.

  When decision theorists calculate "what a test is worth before you run it," they are calculating the **Expected Value of Sample Information (EVSI)**. This is the difference between the expected utility of the optimal decision *with* the information and the expected utility of the optimal decision *without* it.

  ### 2. Analysis of Your Three Pieces

  #### Piece One: Worth is a property of the decision, not the information.
  *   **Technical Term:** **Instrumental Value of Information.**
  *   **Definition:** In standard decision theory, information has no intrinsic value. It is purely instrumental. Its value is derived entirely from its capacity to alter a decision in a way that improves the outcome.
  *   **Boundary:** This holds true as long as utility is defined over *world states* and *actions*, not over *knowledge states*. If knowing a fact makes you happy or sad regardless of what you do (e.g., pride or grief), the information has **Intrinsic Value** (positive or negative), and this piece no longer applies in its pure form.
  *   **Verdict:** You are correct. A fact that does not change your policy has an instrumental value of zero.

  #### Piece Two: The failure of additivity.
  *   **Technical Term:** **Non-additivity of Information** (often discussed under **Submodularity** or **Complementarity**).
  *   **Definition:** The value of two pieces of information combined is not necessarily the sum of their individual values.
      *   *Complementarity:* Piece A is useless alone, Piece B is useless alone, but A+B allows a profitable decision change. (Value > Sum).
      *   *Substitutability:* Piece A tells you almost everything; Piece B adds very little. (Value < Sum).
  *   **Boundary:** This is a mathematical property of the expectation operator over decision policies. It holds universally in standard Bayesian decision theory. You cannot price knowledge items in isolation; they must be priced as bundles relative to a specific decision threshold.
  *   **Verdict:** You are correct. VoI is not linear.

  #### Piece Three: The temporal asymmetry (Forward guarantee vs. Backward risk).
  *   **Technical Term:** **Good's Theorem (1967)** vs. **Ex-post Regret**.
  *   **The Forward Guarantee:** I.J. Good proved that for a rational Bayesian agent, the **Expected** Value of free information is always non-negative. Before you look, you cannot expect to be worse off, because you can always choose to ignore the information and act as if you didn't have it.
  *   **The Backward Reality:** Once the information is received, the *Realized* Value can be negative. This happens if the information forces a psychological cost or if the "ignore it" option is psychologically unavailable.
  *   **Boundary:** Good's Theorem relies on the assumption that the agent maximizes expected utility and that utility is not negatively impacted by the mere possession of the information.
  *   **Verdict:** You are correct. Ex-ante, information is an option (you can discard it). Ex-post, it is a state (you must inhabit it).

  ### 3. Resolving the Argument: Is your friend an exception?

  You asked whether your friend's case is a genuine exception to the guarantee or just an ordinary cost.

  **It is not an exception to the math, but it is an exception to the standard model of utility.**

  Your argument relied on the standard Decision Theory assumption: **Information Neutrality.** This assumes that knowledge is only a tool for action. Under this assumption, if the action doesn't change, the value is zero, and since the test is free, the net value is zero. You win.

  Your friend's argument relies on **Information Aversion** (or Utility over Beliefs). She is asserting that the *state of knowing* is itself a consumption good that yields negative utility (pain, loss of innocence, cognitive dissonance), independent of any action she takes.

  In economic terms, she is arguing that the information is **not free**.
  *   **Transaction Cost:** Money or time paid to get the info.
  *   **Processing Cost:** Cognitive effort to understand it.
  *   **Consumption Cost:** The pain of holding the belief.

  Your friend is claiming a **Consumption Cost**.

  #### The Technical Resolution
  If we modify the utility function $U$ to include the state of knowledge $K$ alongside the world state $W$ and action $A$:
  $$U = f(W, A, K)$$

  Then Good's Theorem still holds *mathematically*, but the calculation changes.
  *   **Your Calculation:** $E[U(W, A_{opt}|Info)] - E[U(W, A_{opt}|NoInfo)] \ge 0$. (Assuming $K$ doesn't enter $U$).
  *   **Friend's Calculation:** $E[U(W, A_{opt}|Info) - Cost(K)] - E[U(W, A_{opt}|NoInfo)]$.

  If $Cost(K)$ (the pain of knowing about the infidelity) is greater than the instrumental benefit of the information (which you both agreed was zero), then the **Net Expected Value** is negative.

  ### Summary of Terms for Your Vocabulary

  1.  **Instrumental Value of Information:** Covers your first point. Information is valuable only insofar as it changes decisions.
  2.  **Non-additivity / Complementarity of Signals:** Covers your second point. Information values do not sum linearly.
  3.  **Good's Theorem:** Covers your third point's forward-looking guarantee. It states $E[VoI] \ge 0$ for free information.
  4.  **Information Aversion:** Covers your friend's position. This is the preference for smaller information sets due to the direct disutility of certain knowledge.

  ### Conclusion

  You were arguing past each other because you were using different utility functions.
  *   **You** were arguing from **Causal Decision Theory** with standard utility (outcomes only). In this frame, you are right: if the action doesn't change, the information is worthless, and free worthless things are harmless.
  *   **She** was arguing from **Psychological Decision Theory** (or Behavioral Economics) with belief-based utility. In this frame, she is right: the information is a "bad" (a negative good) that she must consume once learned.

  **The Verdict:** The term you want is **Expected Value of Information (EVI)**. It covers the decision-dependence and the non-additivity perfectly. It covers the forward-looking guarantee *only if* you assume information has no intrinsic disutility. Your friend's case is not a failure of the theorem, but a demonstration that for human beings, information is often not a free good; it is a costly consumption item. She is paying for the information with her peace of mind.
