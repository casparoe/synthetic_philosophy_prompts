prompt: |-
  ok so I got into an argument with my bio teacher about whether it's even bad when a rainforest gets cut down, and now I have a whole pile of gut reactions I can't square with each other. Here they are:

  When a rainforest is cleared for a palm oil plantation, that's awful. When a marsh gets drained and paved for a parking lot, I feel like it's... fine? Bad for the birds I guess, but not the tragedy the rainforest is. When a wildfire burns a forest down and basically everything dies, that's awful. When a deer starves to death over a winter, awful. When a wolf kills a deer, that's fine, that's just nature. When I hit a bug with my car I don't care at all, but when I see a spider drowning in my sink I feel bad and fish it out. When a species goes extinct I feel like something irreplaceable is gone, even if all the individuals died fast and painlessly. And when a species gets reintroduced and now there's thousands of them living short hungry lives where most of the babies starve or get eaten, I feel like that's a happy ending.

  My friend says alot of wild animals (the ones that have a thousand babies and almost all of them die young) probably have lives that are more bad than good, so fewer of them might actually be better, which would mean destroying habitat is good for them. When he says it out loud I kind of see it, and then I look at the rainforest thing and think no way.

  Is there a principle behind all my reactions, or do some of them have to go? Which ones? And what does your principle say about the case I keep flip flopping on: a wetland full of bugs and frogs gets paved over, versus the same wetland left alone so all those animals keep living their lives and most of them starve as babies. Also does it matter that I'm the one doing it, versus it being a wildfire or a wolf?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Dilemma:**
      *   **Core Conflict:** The user is experiencing cognitive dissonance regarding their moral intuitions about nature, suffering, and human intervention.
      *   **Specific Contradictions:**
