      *   *Agency:* Crucial point. We are responsible for our *actions*, not necessarily nature's *processes*. A wolf isn't immoral; a human paving a wetland is making a moral choice.
      *   *Resolution:* Suggest that "Naturalness" + "Agency" + "Welfare" creates a hybrid view. We shouldn't destroy habitat to reduce suffering because the *act* of destruction violates trust/agency and destroys complex value, even if nature itself contains suffering.

