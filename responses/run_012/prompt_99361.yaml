answer: |-
  ### Brainstorm: The Logical Space of Moral Compromise

  The core tension in moral compromise is not just between *self* and *other*, but between *integrity* and *efficacy*. When we map this space, we are really asking three metaphysical and ethical questions. First, the **Metaphysics of Value**: Are moral values like currencies that can be exchanged at a rate (commensurable), or are they distinct categories where trading one for another is a category error (incommensurable)? Second, the **Ethics of Action**: Is the moral status of an act determined by its outcome (consequentialist trade) or by the act itself (deontological constraints)? If I vote for a "bad" law to secure a "good" one, have I dirtied my hands or simply optimized? Third, the **Politics of Agreement**: Is the goal of compromise to find the *truth* (epistemic), to secure *peace* (prudential), or to establish *legitimacy* (procedural)?

  Many theories collapse these distinctions. A "Modus Vivendi" looks like "Moral Trade" if you only look at the behavior, but they differ fundamentally on *why* the agents comply. Similarly, "Moral Discovery" looks like "Capitulation" if you only look at the change in belief, but differs on whether the change was forced or illuminated. This tree is designed to force those distinctions into the open. I have structured it to treat **Rights** as the primary filter, because if rights are side-constraints, trade is impossible on those issues. I treat **Commensurability** as the second filter, because if values cannot be weighed, trade must be about priorities, not quantities. Finally, I separate **Truth** from **Peace**, because this distinguishes the philosopher from the politician.

  ***

  ### The Decision Tree: Moral Trade and Compromise

  **Q1. The Rights Constraint**
  Imagine you could secure funding for your top moral priority (e.g., global poverty relief) only by voting for a policy you believe violates a fundamental right (e.g., restricting religious speech). Do you make the deal?
  *   **No:** Go to **Q2**.
  *   **Yes:** Go to **Q5**.

  **Q2. The Source of Refusal**
  You refused the deal. Is it because violating the right is *always* wrong regardless of consequences, or because in this specific case the costs outweigh the benefits?
  *   **Always Wrong (Side Constraint):** Go to **Q3**.
  *   **Costs Outweigh Benefits:** Go to **Q5**.

  **Q3. The Scope of Constraint**
  Does this constraint apply only to your own actions, or does it forbid you from participating in any system where others might violate that right?
  *   **Only My Actions:** Go to **Q4**.
  *   **Any System Involvement:** **Leaf A**.
  *   *(Note: If you choose "Any System Involvement," you likely cannot participate in democratic compromise at all. This position is coherent but politically sterile.)*

  **Q4. The Possibility of Clean Hands**
  Is it possible to participate in a unjust system without sharing responsibility for its injustices?
  *   **Yes:** **Leaf B**.
  *   **No:** **Leaf C**.

  **Q5. The Metric of Trade**
  You are willing to trade. When you exchange support (e.g., liberty for security), do you need to believe both values can be measured in a single unit (like "welfare"), or can you trade them as distinct goods?
  *   **Single Unit Required:** Go to **Q6**.
  *   **Distinct Goods:** Go to **Q7**.

  **Q6. The Calculation of Gain**
  If you use a single unit, is the "gain" from the trade measured by your own subjective values, or by an objective standard of the good?
  *   **Subjective Values:** Go to **Q8**.
  *   **Objective Standard:** Go to **Q9**.

  **Q7. The Priority Swap**
  If you trade distinct goods, are you agreeing to *downgrade* the importance of your value, or merely accepting a lower *probability* of achieving it?
  *   **Downgrade Importance:** Go to **Q10**.
  *   **Lower Probability:** Go to **Q8**.

  **Q8. The Package Deal**
  Do you vote on each issue based on its individual merit, or do you bundle votes (e.g., "I support X if you support Y")?
  *   **Individual Merit:** **Leaf D**.
  *   **Bundle Votes:** **Leaf E**.

  **Q9. The Epistemic Goal**
  If you became convinced your trading partner was morally mistaken about their priority, would you still honor the agreement?
  *   **Yes (Honor Deal):** Go to **Q10**.
  *   **No (Void Deal):** **Leaf F**.

  **Q10. The Transformation**
  Does the process of negotiating this agreement change what you fundamentally value, or only what you do?
  *   **Changes Values:** **Leaf G**.
  *   **Only Actions:** **Leaf H**.

  ***

  ### The Leaves: Positions and Awkward Commitments

  **Leaf A: Rights Absolutism (Isolationism)**
  *   **Position:** Rights as absolute side-constraints that preclude systemic participation.
  *   **Awkward Commitment:** You must withdraw from most political cooperation to avoid complicity in inevitable rights violations.

  **Leaf B: Liberal Complicity (The Clean Hands View)**
  *   **Position:** Rights as side-constraints on action, but not on systemic participation.
  *   **Awkward Commitment:** You must claim that benefiting from an unjust system does not make you responsible for its injustices.

  **Leaf C: Integrity Violation (The Quietist)**
  *   **Position:** Deontological constraints that render political trade impossible.
  *   **Awkward Commitment:** You must accept that moral integrity requires political irrelevance in a non-ideal world.

  **Leaf D: Democratic Compromise (Legitimacy View)**
  *   **Position:** Compromise as a duty of citizenship, voting on merit but accepting losses.
  *   **Awkward Commitment:** You must sometimes vote for outcomes you believe are sub-optimal without receiving a specific quid pro quo.

  **Leaf E: Moral Logrolling (Pareto Trade)**
  *   **Position:** Moral trade as a package deal to achieve mutual subjective gains.
  *   **Awkward Commitment:** You must defend voting for a policy you think is bad solely because it secures a different policy you like.

  **Leaf F: Truth-Tracking Compromise (Epistemic View)**
  *   **Position:** Compromise is only valid if it tracks the objective moral truth.
  *   **Awkward Commitment:** Your agreements are unstable; they dissolve the moment you think you've found the truth.

  **Leaf G: Moral Discovery (Convergence View)**
  *   **Position:** Compromise as a process that reveals shared deeper values.
  *   **Awkward Commitment:** You must claim that genuine disagreement was an illusion all along, masking underlying agreement.

  **Leaf H: Modus Vivendi (Peace View)**
  *   **Position:** Compromise as a stable truce between conflicting values without convergence.
  *   **Awkward Commitment:** You must admit you would abandon the agreement immediately if you gained the power to enforce your own view.

  ***

  ### Philosopher's Commentary: Why This Tree?

  I have constructed this tree to resist the temptation to conflate *peace* with *justice*. Many models of compromise treat "Modus Vivendi" (Leaf H) and "Moral Trade" (Leaf E) as identical because the behavior looks the same: I give you X, you give me Y. But the *counterfactuals* differ. A moral trader keeps the deal even if they gain power (because it's a binding exchange of value); a modus vivendi realist breaks the deal if they gain power (because it was only a truce). I separated these at **Q9** and **Q10**.

  I also took a definite stand on **Incommensurability** (Q5). Many philosophers claim that if values are incommensurable, trade is impossible. I reject this. As shown in **Q7**, you can trade distinct values by trading *priority* or *probability* rather than reducing them to a common currency. If the tree forces a student to say they need a "Single Unit" (Q6) to trade, they are committed to a utilitarian-style monism. If they say "Distinct Goods," they are committed to a pluralism that must explain the exchange rate without a common metric.

  Finally, note the "Empty" or "Unattractive" spaces. **Leaf C** (Integrity Violation/Quietist) is a coherent position but I diagnose it as politically unattractive for a seminar on *trade*. It is the refusal to trade. Similarly, **Leaf A** is logically possible but practically empty for a seminar on political compromise. I placed **Rights** at the root (Q1) because I believe this is the hardest constraint; if rights are tradeable, the rest of the tree is consequentialist calculation. If they are not, the tree is deontological navigation. There is no neutral ground here.

  One limitation: **Leaf E (Logrolling)** and **Leaf D (Democratic Compromise)** are often conflated in practice. My tree separates them via the "Package Deal" node (Q8). However, in real legislatures, "Individual Merit" voting often hides implicit logrolling. If a student finds they cannot distinguish D and E in practice, that is a feature of the political world, not a bug in the tree—it indicates that legitimacy is being purchased via hidden trade.
