answer: |-
  ### 1. The Sequence of Ideas

  **Phase 1: The Pragmatic Experience (0–20 minutes)**
  Begin with the bland control sentence: *"Each student should hand in his assignment by Friday."* Ask the tutors to close their eyes and visualize the student. Ask: "What gender is the student in your mind?"
  *   **Why this comes first:** You must establish the *effect* before explaining the *cause*. If you start with theory, they will argue definitions. If you start with their own mental imagery, the data is undeniable.
  *   **Semantic vs. Pragmatic:** You must pull these apart here, and the **pragmatic** question ("Whom do you picture?") must come before the semantic one ("What does 'he' denote?"). If you argue semantics first, you enter a dictionary war about whether "he" *can* mean everyone. Tutors deal with reader experience, not lexical definitions. Establishing that the *image* is male proves the default exists, regardless of dictionary definitions.

  **Phase 2: The Linguistic Mechanism (20–40 minutes)**
  Introduce the terms **marked** and **unmarked**. Use non-gendered examples first (e.g., *lion* vs. *lioness*, *actor* vs. *actress*). Explain that the unmarked term is not "neutral"; it is the "default," while the marked term signals a deviation from that default.
  *   **Why this waits:** You cannot name the phenomenon until they have felt it in Phase 1. This vocabulary gives them the tools to analyze Phase 3 without getting stuck in moral judgment. It shifts the conversation from "this is rude" to "this is structural."

  **Phase 3: The Satire as Demonstration (40–70 minutes)**
  Distribute excerpts from Hofstadter's "A Person Paper." Do not read the whole thing; select passages where the terminology swap is most structural (e.g., "whiteman," "sheman").
  *   **Why this waits:** If you present Hofstadter before Phase 2, it functions as a shock or a scolding. Tutors may reject it as "too extreme." After Phase 2, it functions as data: it applies the marked/unmarked mechanism they just learned to a different hierarchy, revealing how invisible defaults operate. It makes the invisible visible by changing the stakes.

  **Phase 4: Defense and Application (70–90 minutes)**
  Address the misconceptions (see below) and pivot to tutoring scenarios. Ask how they would discuss this with a writer who insists "everyone knows 'he' means everyone."
  *   **Why this waits:** You cannot defend the concept until the tutors understand the mechanism and have seen the demonstration. Defense requires the armor of the previous three phases.

  ### 2. The Carrying Case

  **Use the Satire (Hofstadter), not the bland sentence.**
  The bland sentence is too easily dismissed as "just grammar." The satire carries the session because it forces a cognitive shift that the bland sentence cannot. However, for the satire to bear this weight, it must meet specific criteria:
  *   **It must have:** Strict structural isomorphism. Every gendered term must be swapped for a racialized term with no other changes to syntax. This ensures the discomfort comes from the *language*, not the argument.
  *   **It must lack:** Extraneous political commentary or argumentation outside the linguistic swap. If Hofstadter argues politics explicitly, tutors will debate the politics. If he only swaps the terms, they must debate the language.

  ### 3. Misconceptions and Timing

  1.  **"The generic he really does cover everyone."**
      *   **Head off in Phase 1.** When you ask them to visualize the student, most will picture a man. Point this out immediately. "If 'he' covered everyone equally, our mental images would be random. They aren't." This kills the semantic defense before it starts.
  2.  **"This is just a matter of politeness."**
      *   **Head off in Phase 2.** When defining marked/unmarked, state clearly: "This is not about being nice; it is about cognitive load and exclusion. Marked terms require extra processing." This frames it as a technical writing issue, not a manners issue.
  3.  **"The satire cheats, because race and sex are not analogous."**
      *   **Head off in Phase 4.** Acknowledge the histories are different, but insist the *linguistic mechanism* is identical. "We are not comparing the history of oppression; we are comparing how language builds defaults. The mechanism holds even if the histories differ."

  ### 4. The Final Assessment Question

  Do not ask them to summarize Hofstadter. Ask:
  *"Here is a job posting that says 'The ideal candidate must manage his team effectively.' Who hears 'you' in that sentence, and who hears 'about him'?"*
  This tests whether they understand the pragmatic exclusion, not just the theory.

  ### 5. Deliberate Omissions

  You must leave out the **historical etymology of the generic "he"** and the **prescriptive grammar rules regarding singular "they."** Including these invites debate about correctness rather than effect.

  **Say this in the room:**
  *"I am deliberately leaving out the history of why 'he' became generic and the grammar rules about singular 'they.' We are skipping the rulebook to focus entirely on the reader's brain. Today is about effect, not correctness."*

  \answer{That unmarked language functions neutrally for every reader.}
