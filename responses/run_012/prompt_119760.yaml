  *   *Resolution:* If the scholar classifies this as **Security**, it confirms that for her, the *teleology* (managing circulation/risk) trumps the *technique* (surveillance). If she classifies it as **Disciplinary**, it confirms she views continuous individual tracking as inherently disciplinary regardless of the stated goal. Given her prior classification of Insurance (which tracks individuals for population ends) as Security, the Smart Traffic case should solidify the verdict that **Security is defined by the management of phenomena, not the absence of surveillance.**
