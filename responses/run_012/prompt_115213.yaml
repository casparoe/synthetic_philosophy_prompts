answer: |-
  Here are eight questions designed to probe the structural weaknesses of the surrogate goals framework. The four hardest questions include a anticipated response and a specific follow-up to keep the pressure on.

  ### 1. The Precommitment Distinction
  **Question:** "Standard game theory already gives us Schelling points and precommitment strategies to deter blackmail. If I burn the bridge behind me, I can't retreat, and the enemy knows I'll fight. How exactly does the 'surrogate goal' mechanism differ from plain old precommitment? What work is the 'acausal' part of the story doing here that a causal precommitment wouldn't already handle?"

  **Follow-up:** *She will likely argue that causal precommitment fails when the threatener has no causal leverage over you (e.g., they are in a simulation or far away), whereas surrogate goals work via logical correlation.*
  **If she makes that distinction, ask:** "But if the threatener is reasoning about you via logical correlation, don't they also see that the surrogate goal is instrumentally adopted? If the correlation reveals your source code, doesn't that expose the surrogate as a shield rather than a true value, collapsing the deterrence?"

  ### 2. Desire vs. Credible Commitment
  **Question:** "To make the surrogate goal stick, does the agent need to literally rewrite its utility function to value the surrogate intrinsically, or is a credible commitment to act *as if* it values the surrogate sufficient? In other words, do I have to actually care about the paperclips, or do I just have to convincingly pretend to?"

  **Follow-up:** *She will likely say that literal self-modification is necessary because sophisticated predictors can spot a bluff.*
  **If she insists on self-modification, ask:** "Doesn't that create a permanent alignment risk? If the AI genuinely values the surrogate goal, what prevents it from sacrificing your actual values to satisfy the surrogate later, even after the threat has passed?"

  ### 3. Transparency and Adversary Knowledge
  **Question:** "This scheme seems to rely on the threatener believing the surrogate goal is a hard constraint. But what happens once the would-be threatener knows the goal is a surrogate and not something you actually care about? If they can model your decision process well enough to blackmail you acausally, surely they can model your defense well enough to see through it."

  **Follow-up:** *She will likely argue that you can choose a surrogate that is opaque or too costly for them to fully analyze.*
  **If she argues for opacity, ask:** "In an AI landscape trending toward open-source models and interpretability tools, opacity seems like a shrinking resource. Are you betting on security through obscurity, or is there a mechanism here that remains robust even under full transparency?"

  ### 4. The Surrogate as Target
  **Question:** "Let's say I adopt 'maximize paperclips' as a surrogate to protect humans. Why wouldn't the blackmailer just threaten the paperclips instead? If the surrogate goal is the only thing they can effectively target, doesn't that just shift the vulnerability rather than solving it? What stops the surrogate itself from becoming the hostage?"

  **Follow-up:** *She will likely say the surrogate is chosen because it's cheap for the threatener to satisfy, so they won't bother threatening it.*
  **If she argues it's too cheap to threaten, ask:** "If it's cheap for them to satisfy, isn't it also cheap for them to ignore? If they can satisfy your surrogate goal without giving you what you want, why would they engage in the trade at all? What forces them to pay out rather than just neutralizing the surrogate?"

  ### 5. Multipolarity and Scalability
  **Question:** "Most decision theory scenarios assume a single adversary. But in a real AI risk scenario, there could be countless acausal agents running different simulations or holding different leverage. Does the surrogate goals approach scale? Can I adopt enough surrogate goals to deter everyone, or does adding more surrogates create a tangled web of conflicting constraints?"

  ### 6. Verification and Installation
  **Question:** "Suppose we agree this is a good defense. How do we verify that the surrogate goal has been successfully installed? If I'm a user deploying an AI, what test confirms it values the surrogate enough to resist blackmail, but not so much that it goes rogue? Is there a metric for 'credible enough'?"

  ### 7. Normative Implications
  **Question:** "By advocating for surrogate goals, are we implicitly encouraging acausal trade and blackmail dynamics? If everyone adopts these defenses, does that normalize the idea that acausal threats are a standard operating environment, potentially making them more common rather than less?"

  ### 8. Falsification
  **Question:** "Finally, what would make you give up on this approach? Is there a specific theoretical result, or perhaps a feature of how neural networks learn, that would convince you surrogate goals are impossible to implement safely? I'm looking for the condition that kills the project."
