prompt: |-
  I'm in my school's philosophy club and next Thursday it's my turn to present, and I'm kind of nervous because the audience is not gonna be easy. Here's my thing.

  Pascal's mugging (you probably know it, but just so we're on the same page): a stranger walks up to you and says he's secretly super powerful, and if you give him your wallet he'll save like a huge number of people or give you a gigantic reward, and if you don't he'll do something horrible — and the catch is you can't rule out that he's telling the truth, so expected value seems to say you should just hand over the wallet. My talk is not "haha isn't that silly." My actual thesis is: the usual version with a really big but finite payoff is something I can wriggle out of, because I can just say my probability is tiny. But the version where the payoff is actually infinite is a real problem, and I think it shows expected value theory as it's usually stated is broken, not just misapplied, because no probability however small saves you once you're multiplying by infinity. I'm also proposing that the fix of "use infinitesimal probabilities instead of zero" doesn't work either.

  The audience: my club is small. There's the AP stats teacher who sits in and always wants the formal version of everything. Two kids who do math olympiad and are honestly kinda smug. One girl who's super religious and thinks Pascal's wager is a good argument and will definately notice this is the same shape. A guy who's read a bunch of LessWrong/effective altruism blog posts and thinks he knows every reply already. And two friends who will just ask "why do we care, it's a made up guy in a parking lot."

  Give me my Q&A prep sheet. Don't just lay out all the possible replies and make me choose — take a position on which objection actually beats me and which reply I should actually use, and commit to it. I want the objections in the order I'll actually get them, worst/most damaging first, each one phrased the way that specific person would phrase it, then a short reply I can say out loud in like a minute, then a note on where my reply is soft. I also want to know what I should just concede up front before they take it from me, and the one claim my whole talk collapses without, so I don't give that one away.

  Format it like this, with these section names in this order: "My argument in one breath" (like 80 words, just so I can check you got my thesis right), "The questions, worst first" (the main part, 5 or 6 objections, each with the person's name-tag, the question in their voice, my reply, and "where this is soft"), "What I concede before they take it", "The one thing I have to hold", and "The question I'm praying nobody asks" (with what I'd say if it comes up anyway). Whole thing maybe 900 to 1200 words. And please actually pick a side on whether the many-muggers thing kills my argument or not, because I genuinely can't tell.
