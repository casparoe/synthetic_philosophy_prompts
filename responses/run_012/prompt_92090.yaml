answer: |-
  To allocate eight million dollars toward archival justice, we must first admit that not all silences are equal. Some are graves; some are locked doors. Your taxonomy distinguishes four modes of absence, but for a foundation seeking leverage, two of these categories collapse. Category 1 (no record made) and Category 2 (record made but lost) are functionally identical for the historian: they are irrecoverable absences. While Category 2 implies a political act of destruction worth documenting, remediation funds cannot resurrect ash or conjure testimony ex nihilo. Pursuing them invites speculative archaeology with diminishing returns. Therefore, for the purpose of budgetary triage, 1 and 2 form a single block of "Absolute Loss" at the bottom of the priority list.

  This leaves Category 3 (kept but unreachable) and Category 4 (survives but wrong voice). The ranking must be **3 > 4 > 2 > 1**.

  The defense rests on four criteria: upstreamness, tractability, neglectedness, and bottlenecking.

  **Upstreamness:** Category 3 is the physical prerequisite for Category 4. You cannot reparatively describe a box you cannot find, nor can you contextualize a document trapped on a rotting floppy disk. Access is the gatekeeper of interpretation. Funding Category 3 unlocks the raw material required to fix Category 4.

  **Tractability:** Category 3 is logistical; Category 4 is relational. Clearing a backlog or migrating a format requires money and technicians—inputs a foundation can directly purchase. Correcting the "wrong voice" requires consensus, community trust, and epistemological shifts that often exceed a four-year grant cycle. With a fixed budget and timeline, Category 3 offers measurable completion; Category 4 offers open-ended negotiation.

  **Neglectedness:** Major institutions currently favor Category 4. "Decolonizing the archive" is a dominant discourse, attracting prestige and academic attention. Conversely, the unglamorous work of processing backlogs and stabilizing media—particularly in under-resourced community archives—is starved of capital. Marginal effort yields higher returns where the field is not already looking.

  **Bottlenecking:** The historical profession is currently bottlenecked on access. Historians cannot interpret what they cannot see. While distorted records (Category 4) produce injustice, inaccessible records (Category 3) produce oblivion. Oblivion is the greater enemy of justice.

  **Concrete Lines of Work**
  Within Category 3, the funds should not go to national libraries with endowments, but to the community-based archives holding the records of the marginalized. Specifically:
  1.  **Processing Squads:** Direct funding to hire archival teams dedicated solely to clearing backlogs in community organizations, producing basic finding aids that make collections searchable.
  2.  **Media Rescue:** Subsidies for the immediate migration of unstable born-digital media and obsolete formats (VHS, Betamax, floppy) within those collections to prevent Category 2 losses.

  **Taxonomy Critique and Risks**
  This taxonomy risks illicitly separating physical access from intellectual control. There is a fifth silence not listed: *The record is reachable, but the cost of engagement is prohibitive.* This includes legal barriers, paywalls, or hostile archival environments. This fits within Category 3 but requires a caveat: access without trust is dangerous. If we unlock boxes (3) without community consent (4), we may exacerbate harm. Therefore, funding for Category 3 must mandate community oversight.

  **Evidence to Adjust Ranking**
  Over the next four years, two data points could shift this ranking. First, if usage metrics show that processed collections (3) remain uncited due to harmful description (4), then Category 4 moves upstream. Second, if forensic technology emerges that can recover destroyed data (2) at scale, Category 2 becomes tractable. Until then, the locked door is the priority over the broken mirror.

  Verdict: 3 > 4 > 2 > 1 — Fund processing and digital stabilization teams in under-resourced community-based archives.
