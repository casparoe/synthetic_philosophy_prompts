answer: |-
  The live interpretive options generally fall into two camps: formalists who treat the tetralemma as a logical matrix requiring non-classical truth-values, and pragmatists who treat it as a dialectical tool for dismantling views. The pressure points are acute. If we treat the corners as truth-values, the fourth corner ("neither") violates the law of excluded middle, forcing us to import many-valued logic that Nāgārjuna never articulates. If we treat them as ontological claims, the third corner ("both") violates non-contradiction, forcing paraconsistency. Both approaches risk turning Madhyamaka into a metaphysical system about how reality *is*, rather than a therapy for how we *think*. The speech-act hypothesis offers a third path: the tetralemma enumerates possible stances toward a proposition, not the proposition's truth conditions.

  I argue that the speech-act reading is the superior account, specifically because it aligns the logical structure with the soteriological goal without requiring anachronistic logical machinery. By distinguishing locutionary negation from illocutionary retraction, we can see the tetralemma not as a description of reality's structure, but as a gradient of cognitive grasping that culminates in silence.

  On this reading, the first corner (P) is the assertion of an intrinsic nature. The second corner (not-P) is locutionary negation; it denies the intrinsic nature but remains within the same conceptual framework, merely flipping the value. This is still a form of grasping, now at non-existence. The third corner (both) represents the confusion of holding conflicting grasps simultaneously, often arising when trying to reconcile change and permanence. The fourth corner (neither) is the critical pivot. It is not the assertion that "reality is neither P nor not-P," which would itself be a metaphysical thesis. Instead, it is the illocutionary retraction: the refusal to deploy the concept P or its negation in any assertoric way.

  This reading buys us a solution to the "thesis" worry. Critics often ask: If Nāgārjuna says all views are empty, is that statement itself a view? If the fourth corner is a truth-claim about indeterminacy, Nāgārjuna contradicts himself. But if the fourth corner is a performative retraction, he is not asserting a competing doctrine. He is demonstrating the exhaustion of the doctrinal space. He is not saying "Reality is indeterminate"; he is showing that the attempt to determine reality via these concepts fails. This dissolves the need for paraconsistent logic. We do not need to say "P and not-P" is true; we only need to show that asserting either leads to absurdity, warranting a retraction of the assertoric move itself. The logic remains classical regarding the contents, but the pragmatics regulate the assertion conditions.

  The strongest objection to this view is the charge of performative self-undermining. If the fourth corner is a retraction of assertion, how can it be taught? To state "I retract assertion" is itself an assertion. If Nāgārjuna writes verses prescribing the fourth corner, is he not asserting that one should adopt the fourth corner, thereby turning the retraction into a dogma? This threatens to collapse the illocutionary retraction back into a locutionary claim about the necessity of silence.

  However, this objection misunderstands the therapeutic mechanic. The speech-act reading does not claim the retraction is a permanent metaphysical stance, but a curative intervention. Consider a doctor prescribing medicine to cure a disease caused by medicine. The prescription is provisional. Nāgārjuna uses language to cure the addiction to language. The assertion that "one should retract" is a conventional tool used to reach the ultimate cessation of conceptual proliferation. Once the retraction is performed, the tool is discarded. The speech-act reading accommodates this by treating the tetralemma as a dynamic process rather than a static proposition. The fourth corner is not a place to rest; it is the act of leaving the field. Therefore, the performative contradiction is only apparent if one freezes the therapy into a doctrine. Under the speech-act reading, the contradiction is the very engine of the cure: it forces the mind to recognize the limits of assertion by pushing assertion to its breaking point.

  Verdict: SPEECH-ACT-READING-WORKS - It dissolves contradiction by shifting focus from truth-claims to cognitive cessation.
