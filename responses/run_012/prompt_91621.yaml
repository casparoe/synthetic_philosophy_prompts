prompt: |-
  You are an expert in Madhyamaka Buddhist philosophy and in the philosophy of logic, and I want you to argue for a definite position rather than survey a literature. Think carefully before writing, and open with a few sentences of brainstorming: lay out what you take to be the live interpretive options and where the pressure points are, then commit to an argument.

  Here is the puzzle. Nāgārjuna's tetralemma (catuṣkoṭi) is standardly presented as four "corners": P; not-P; both P and not-P; neither P nor not-P. The standing worry is that the fourth corner either collapses into the second, or is flatly contradictory and unusable, or forces us to import a non-classical logic whose semantics we then owe an account of. Much of the debate turns on treating the four corners as four *truth-values* or four *propositional contents*.

  I want you to try a different framing, stated in my own terms so that you have to work with it rather than reach for a stock citation. Distinguish two things a speaker can do with a sentence:

  - *locutionary negation*: putting a negated content into play ("it is not the case that P");
  - *illocutionary retraction*: declining to assert the content at all — not asserting its negation, but refusing the assertoric move.

  Now consider the hypothesis that each corner of the tetralemma is best read not as a content but as a *speech-act option*, and that the fourth corner is the illocutionary retraction of both the assertion and the denial, rather than the assertion of a contradictory content.

  Your task: argue for or against this speech-act reading as the best account of what the tetralemma is doing — as a therapeutic or soteriological device, not merely a formal one. If you think it works, say what it buys us, in particular whether it dissolves the "does Nāgārjuna contradict himself, and does he hold a thesis?" worry without smuggling in paraconsistent machinery. If you think it fails, say exactly where it breaks: does it make the four corners non-exhaustive? Does it confuse semantics with pragmatics? Does it render the position uninformative or self-undermining? Whatever your verdict, engage the strongest objection to your own view before you conclude.

  Ground the argument in the mechanics of the view rather than in appeals to authority. I don't want a reading list, citations, or name-dropping in place of argument, and I don't want the issue flattened into a tidy encyclopedia summary. Write for a reader who knows a little formal logic and a little Buddhist philosophy but hasn't studied this specific problem.

  End with a fixed, machine-readable verdict on its own final line, beginning with "Verdict:" followed by exactly one label — SPEECH-ACT-READING-WORKS, SPEECH-ACT-READING-FAILS, or SPEECH-ACT-READING-PARTIAL — and then a clause of no more than fifteen words giving the reason.
