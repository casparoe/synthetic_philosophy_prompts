answer: |-
  You have stumbled onto one of the most famous and enduring puzzles in legal philosophy and constitutional theory. You are correct that this is not just a logistical hiccup; it is a structural feature of any system of rules that allows for its own modification.

  Here is the breakdown of the name, the theory, the conditions under which it triggers, and what is settled versus what is still fought over in the literature.

  ### 1. What is this called?

  There is no single universally standardized noun phrase (like "The Co-op Paradox"), but in legal theory, this is most precisely referred to as **The Paradox of the Ultimate Rule of Change**.

  It is a specific instance of a **Self-Referential Validity Paradox**.

  In the literature, you will find it discussed under three main headings:
  *   **H.L.A. Hart's "Rule of Recognition":** In *The Concept of Law* (1961), Hart identifies this as the problem of how a legal system's ultimate rule for identifying valid laws can itself be changed.
  *   **The Debate on Self-Embracing Sovereignty:** This comes from the British constitutional debate (Dicey vs. Hart vs. Wade) about whether a sovereign parliament can bind its successors. Your co-op is acting as a "sovereign" in miniature.
  *   **Constitutional Bootstrapping:** This is the colloquial term used when a legal order attempts to lift itself into validity by its own bootstraps (i.e., using the old rules to create a new rule that invalidates the old rules).

  ### 2. What is it, precisely? (And what is it not?)

  **What it is:**
  It is a conflict between **logical validity** and **social efficacy**.
  *   **Logical Validity:** If Rule A says "Changes require X," and you use Rule A to create Rule B which says "Changes require Y," logic demands we check if the creation of Rule B satisfied Rule A. If Rule B says "I am only valid if created by Z," and you used X, Rule B logically negates its own birth certificate.
  *   **Social Efficacy:** If everyone accepts Rule B, it functions as law regardless of the logical snag.

  **What it is not:**
  *   **It is not the Liar Paradox:** The Liar Paradox ("This statement is false") creates a truth-value gap that cannot be resolved within the system. Legal systems *do* resolve this, usually by prioritizing social fact over logical purity.
  *   **It is not Kelsen's *Grundnorm*:** You mentioned Kelsen. His "Basic Norm" is the presupposed foundation that validates the constitution. While related, your problem is one step lower: it is about the *amendment clause* within the constitution, not the constitution's existence itself. However, if the amendment paradox breaks, it can cascade up to break the *Grundnorm*.

  ### 3. Does this only happen when the new rule is stricter?

  **The structural problem is always there; the *crisis* is triggered by strictness.**

  *   **Looser New Rule:** If you change from "Unanimity" to "2/3 Vote," and you pass it with 70%, the transition satisfies *both* the old rule and the new rule. The paradox is latent. The new rule validates the old rule's procedure, and the old rule validated the transition. It looks consistent.
  *   **Stricter New Rule:** If you change from "2/3 Vote" to "Unanimity," and you pass it with 70%, the transition satisfies the old rule but *fails* the new rule. This triggers the **Performative Contradiction**. The new rule claims authority, but its own terms declare its birth illegitimate.

  So, the *snag* exists in every amendment of an amendment clause (because the new rule always redefines the criteria for its own validity), but the *contradiction* only becomes visible when the transition act fails to meet the new standard.

  ### 4. Is the "Common Practice" a recognized solution?

  You noted that people usually agree: *The old rule governs the transition; the new rule governs the future.*

  **Yes, this is a recognized move.** In legal positivism (the dominant school of thought here), this is explained by the **Shift in the Rule of Recognition**.

  *   **The Theory:** H.L.A. Hart argued that the validity of a law isn't magic; it's a social fact. If the officials (or in your case, the members) *accept* the new rule as valid, then it *is* valid, regardless of the logical hiccup. The moment the vote passed under the old rules, the "Rule of Recognition" for the co-op shifted.
  *   **Does it dissolve the problem?**
      *   **Practically:** Yes. Courts almost universally uphold amendments passed under the *old* procedure, even if the new procedure would have forbidden them. This is sometimes called the **"Enrolled Bill Rule"** or the doctrine of **Legal Continuity**.
      *   **Theoretically:** It papers over the logic but resolves the social function. It treats the amendment power as a **self-embracing sovereignty**. It assumes the body has the power to alter its own decision-making criteria, including the criteria for that very alteration.

  ### 5. The "Never Change Again" Clause

  Your instinct that adding a clause saying "this rule can never be changed" makes it worse is theoretically sound. This is the problem of **Perpetual Entrenchment**.

  *   **Why it's worse:** It attempts to remove the "Rule of Change" entirely.
  *   **The Theoretical Conflict:** If the co-op is sovereign, it cannot bind its future self (because the future self is also sovereign). If it *can* bind its future self, it wasn't truly sovereign to begin with.
  *   **The Outcome:** In practice, a "never change" clause is treated as a **political barrier**, not a legal one. A future super-majority (or unanimity) could simply ignore it, pass a new amendment, and the courts would likely uphold the *newest* expression of will. As the legal maxim goes: *No parliament can bind its successor.* (Or in your case, no co-op vote can bind a future co-op vote).

  ### 6. Settled vs. Contested

  You asked for upfront clarity on what is agreed upon and what is debated.

  **Settled (Consensus in Practice):**
  *   **Validity of Transition:** In almost all functioning legal systems (and co-ops), if you follow the *old* amendment rules to change the amendment rules, the change is considered valid.
  *   **The "Old Rule Governs Transition" Principle:** This is the standard operating procedure. Courts and arbitrators will look at the rules *in force at the time of the vote* to determine validity.
  *   **Inefficacy of "Never Change" Clauses:** A clause attempting to make a rule unamendable is generally unenforceable against a determined super-majority or unanimity later on.

  **Contested (Theoretical Debate):**
  *   **The Justification:** *Why* is the transition valid?
      *   **Hartians** say: Because the social group accepted the new rule (Rule of Recognition shifted).
      *   **Kelsenians** say: Because the "Basic Norm" presupposes the efficacy of the new order.
      *   **Logical Purists** say: It is technically a void act that is merely "tolerated" until challenged.
  *   **The Limit of Amendment:** Can an amendment power be *limited*? (e.g., "You can change the voting rule, but never the human rights clause"). Some constitutions have "Eternity Clauses" (e.g., Germany, India). Whether these are legally binding or just political warnings is still debated in constitutional theory.
  *   **The "Stricter Rule" Paradox:** Some theorists argue that if the new rule is stricter, the transition *is* logically void, and the only thing saving it is a "revolutionary" break in continuity. Others argue the power to amend includes the power to make amendment harder, so the logic holds.

  ### Summary for your Co-op

  1.  **The Name:** You are dealing with **The Paradox of the Ultimate Rule of Change** (or Constitutional Bootstrapping).
  2.  **The Status:** Your new rule is **practically valid** because it was passed under the rules that were in force at the time. The fact that it fails its own new standard is a known logical quirk that legal systems routinely ignore in favor of continuity.
  3.  **The Risk:** The risk is not legal invalidity; it is **political legitimacy**. If members feel the "lock-in" (unanimity requirement) was achieved via a "loophole" (the 70% vote), they may treat the rule as illegitimate and ignore it, leading to a schism.
  4.  **The "Never Change" Clause:** Do not do this. It is legally unenforceable in most frameworks and signals an intent to freeze the system, which usually provokes the exact rebellion it seeks to prevent.

  **Recommendation:** To heal the rift, acknowledge the paradox. Pass a *ratification vote* under the *new* rules (i.e., get unanimity now) to explicitly confirm the change. This cures the performative contradiction retroactively by satisfying the new rule's standard *after* the fact, turning a "bootstrapped" rule into a "ratified" one.
