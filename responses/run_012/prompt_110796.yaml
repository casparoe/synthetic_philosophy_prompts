  # Decision Theory Diagnostic Tree

  **Instructions:** Answer the following questions based on your intuitions about the specific cases described. Follow the branches corresponding to your answers. You will arrive at a named position (Leaf) or a diagnostic note.

  ### Branch Node 1: Prediction Coherence
  **Question:** Is the scenario where a predictor (Omega/Blackmailer) perfectly forecasts your *current, specific* decision logically coherent?
  *   **No:** Go to **Leaf 1**.
  *   **Yes:** Go to **Node 2**.

  ### Branch Node 2: Counterfactual Mugging (One-Shot)
  **Question:** In Counterfactual Mugging, the coin is Tails (you lose $100 if you pay, nothing if you don't). Omega predicted you would pay. You have *not* precommitted. Do you pay the $100?
  *   **No:** Go to **Node 3**.
  *   **Yes:** Go to **Node 6**.

  ### Branch Node 3: Counterfactual Mugging (Precommitment)
  **Question:** In Counterfactual Mugging, *before* the coin flip, would you commit to paying $100 if the coin comes up Tails?
  *   **No:** Go to **Node 4**.
  *   **Yes:** Go to **Node 5**.

  ### Branch Node 4: Counterfactual Mugging (Repeated)
  **Question:** If Counterfactual Mugging were repeated 1,000 times, would you pay the $100 in the Tails cases?
  *   **No:** Go to **Leaf 2**.
  *   **Yes:** Go to **Leaf 3**.

  ### Branch Node 5: XOR Blackmail (Predictor)
  **Question:** In XOR Blackmail with a *Perfect Predictor*, you receive the letter. Do you pay the $100?
  *   **No:** Go to **Leaf 4**.
  *   **Yes:** Go to **Node 9**.

  ### Branch Node 6: XOR Blackmail (Statistical)
  **Question:** In XOR Blackmail with *No Predictor* (only statistical correlation between paying and coin state), you receive the letter. Do you pay the $100?
  *   **Yes:** Go to **Leaf 5**.
  *   **No:** Go to **Node 7**.

  ### Branch Node 7: XOR Blackmail (Shared Policy)
  **Question:** In XOR Blackmail, if you could precommit a single policy for both Alice and Bob (shared source code), would you pay?
