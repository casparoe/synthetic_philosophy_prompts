  # The Aggregation Sorting Tree

  **Instructions:** Start at Node 1. Answer based on your intuitive verdict on the case described. Follow the branch to the next node or to a Leaf (final position).

  ### Node 1: The Original Case
  **Case:** You can prevent one person from being tortured for fifty years. The only way to do so is to allow $N$ other people to each receive a single, imperceptible speck of dust in their eye. $N$ can be as large as needed.
  **Question:** Is there an $N$ where the pile of specks is morally worse than the torture?
  *   **Yes (Specks can be worse):** Go to Node 2.
  *   **No (Torture is always worse):** Go to Node 6.
  *   **The comparison is nonsense:** Go to **Leaf 1**.

  ### Node 2: The Perceptibility Check
  **Case:** The specks are physically real but psychologically imperceptible (the recipient never notices them, no pain, no lasting damage).
  **Question:** Do these imperceptible events count as "harms" that can sum up?
  *   **Yes:** Go to Node 3.
  *   **No:** Go to **Leaf 2**.

  ### Node 3: The Probability Test
  **Case:** Instead of $N$ people definitely getting a speck, $N$ people each face a $1/N$ chance of getting a speck. One person faces certainty of torture.
  **Question:** Is the distributed risk (ex-ante) worse than the certain torture?
  *   **Yes (Risk sum > Certainty):** Go to Node 4.
  *   **No (Certainty > Risk sum):** Go to **Leaf 3**.

  ### Node 4: The Policy Frame
  **Case:** You are choosing a standing rule for a society, not a one-off lever pull. Rule A allows specks to prevent torture; Rule B forbids it.
  **Question:** Do you choose based on the outcome of this specific case or the long-term effects of the rule?
  *   **Specific Outcome (Act):** Go to Node 5.
  *   **Long-term Rule:** Go to **Leaf 4**.

  ### Node 5: The Magnitude Swap
  **Case:** Replace the fifty years of torture with a severe, month-long headache. $N$ is very large.
  **Question:** Do the specks still outweigh the headache?
  *   **Yes:** Go to **Leaf 5**.
  *   **No (Headache outweighs specks):** Go to **Leaf 6**.

  ### Node 6: The Separateness Test
  **Case:** (From Node 1 "No") All $N$ specks land on *one* person over a lifetime, rather than spread across $N$ people.
  **Question:** Do the specks now outweigh the torture?
  *   **Yes (Specks worse):** Go to **Leaf 7**.
  *   **No (Torture still worse):** Go to Node 7.

  ### Node 7: The Scope Test
  **Case:** The $N$ specks land on animals or people who do not yet exist.
  **Question:** Do these recipients count toward the total $N$ against the human torture victim?
  *   **Yes:** Go to **Leaf 8**.
  *   **No:** Go to Node 8.

  ### Node 8: The Threshold Probe
  **Case:** Replace the torture with a mild headache.
  **Question:** Is there *any* number of specks that can outweigh the headache?
  *   **No (Headache is also protected):** Go to **Leaf 9**.
  *   **Yes (Headache can be outweighed):** Go to **Leaf 10**.

  ---

  ## The Leaves (Positions)

  **Leaf 1: Expressivist / Ill-Posed**
  *   **View:** The question attempts to compare incommensurable values; moral language breaks down here.
  *   **Awkward Commitment:** Must explain why we feel compelled to answer despite the incoherence.

  **Leaf 2: Phenomenal Threshold**
  *   **View:** Harms must be felt to count; sub-threshold physical events are zero.
  *   **Awkward Commitment:** Ignores cumulative physical damage if no single instance is felt.

  **Leaf 3: Ex-Ante Prioritarianism / Contractualism**
  *   **View:** Distributing risk is morally preferable to imposing certainty, regardless of total expected harm.
  *   **Awkward Commitment:** Accepts higher total expected suffering to avoid concentrating risk.

  **Leaf 4: Rule-Consequentialism**
  *   **View:** We judge the rule, not the act; a rule allowing aggregation erodes vital protections.
  *   **Awkward Commitment:** Must follow the rule even in specific cases where breaking it clearly reduces harm.

  **Leaf 5: Straight Additive Total Consequentialism**
  *   **View:** Harm is linear and fungible; $N \times \text{tiny} > \text{huge}$, regardless of severity or distribution.
  *   **Awkward Commitment:** Collapses into the Repugnant Conclusion (trivial harms can justify atrocities).

  **Leaf 6: Prioritarianism / Diminishing Marginal Value**
  *   **View:** Harms aggregate, but severe harms get disproportionate weight over trivial ones.
  *   **Awkward Commitment:** Must explain the discontinuity: why specks beat torture (Node 1) but not headache (Node 5).

  **Leaf 7: Deontological Separateness-of-Persons**
  *   **View:** Interpersonal aggregation is forbidden; intrapersonal aggregation is permitted.
  *   **Awkward Commitment:** Same physical pain has different moral status based solely on recipient identity.

  **Leaf 8: Universal Lexical View**
  *   **View:** Certain harms are lexically superior, but the moral community includes all sentient beings.
  *   **Awkward Commitment:** A swarm of ants with specks could veto preventing human torture.

  **Leaf 9: Hard Lexical View**
  *   **View:** Certain categories of harm (torture, headache) cannot be outweighed by any number of lesser harms.
  *   **Awkward Commitment:** Must endure infinite specks to prevent one headache.

  **Leaf 10: Sorites / Vague Threshold**
  *   **View:** There is a number where specks outweigh the headache, but it is inherently vague.
  *   **Awkward Commitment:** Cannot specify the number without arbitrariness, yet claims a fact exists.

  ---

  ## Structural Notes & Empty Combinations

  **1. The Lexical/Deontological Collapse**
  The tree separates **Leaf 7 (Deontological)** and **Leaf 9 (Hard Lexical)** at Node 6.
  *   *Deontological:* Torture > Specks (Interpersonal), but Specks > Torture (Intrapersonal).
  *   *Hard Lexical:* Torture > Specks (Both).
  *   *Note:* In practice, many who intuit Node 6 "No" (Torture still worse) are doing so because they hold a Hard Lexical view, not a Deontological one. However, the tree forces a distinction: if you *only* object to interpersonal trade-offs, you must switch your verdict at Node 6. If you don't switch, you are not a Separateness-of-Persons theorist; you are a Lexical theorist.

  **2. The Intransitive Gap (Node 5)**
  **Leaf 6 (Prioritarian)** occupies a logically precarious space.
  *   Path: Specks > Torture (Node 1) BUT Headache > Specks (Node 5).
  *   Since Torture > Headache, this implies: Specks > Torture > Headache > Specks.
  *   *Status:* **Incoherent.** This combination is marked as "Unattractive/Incoherent." A consistent Prioritarian usually says Torture > Specks at Node 1 (going to the Non-Aggregator branch) but aggregates at Node 8 (Leaf 10). To fix this, Leaf 6 should ideally be reached from the Non-Aggregator branch (Node 1 "No" -> Node 8 "Yes").
  *   *Correction for Instrument:* If a user lands here, they are likely confused about their own aggregation threshold. The tree flags this as a "Soft Threshold" view that behaves like Prioritarianism but lacks transitivity.

  **3. The Repugnant Conclusion**
  This appears explicitly at **Leaf 5 (Straight Additive)**. If tiny harms sum linearly, then enough tiny harms outweigh any big harm. This implies that a world with massive population and trivial harms could be "worse" than a world with torture, or conversely, that we must accept torture to prevent enough specks.

  **4. Missing Case Dependency**
  The tree relies on the **Policy** case (Node 4) to separate Act- from Rule-Consequentialists. Without this specific node, **Leaf 4** collapses into **Leaf 5**. The tree only works because you provided the Policy case.

  **5. Empty Combination: The "Animal Aggregator"**
  There is no path for someone who says "Torture > Specks" (Node 1), "Torture > Single Recipient Specks" (Node 6), but "Animal Specks Don't Count" (Node 7) AND "Headache > Specks" (Node 8).
  *   This is **Leaf 9 (Hard Lexical)** with a restricted scope.
  *   *Status:* **Unexplored.** Most Hard Lexical views are either universal (Leaf 8) or human-centric (Leaf 9). A view that is Lexical for humans but Aggregative for animals is theoretically possible but rarely defended.

  **6. The "Flip" Point**
  The tree uses the **Mild Harm** case twice (Node 5 and Node 8) to catch the "flip."
  *   Aggregators flip between Torture and Headache (Leaf 5 vs Leaf 6).
  *   Non-Aggregators flip between Torture and Headache (Leaf 9 vs Leaf 10).
  *   This ensures the "Mild Harm" case does the work of distinguishing severity-weighting from absolute prohibitions.
