  5.  **Making the Commitment:**
      *   *Which is strongest?* The Ethical/Existential reading. Kierkegaard isn't saying crowds are stupid; he's saying truth is a mode of *being* that requires individual appropriation. A crowd is "untruth" because it is a evasion of the self.
