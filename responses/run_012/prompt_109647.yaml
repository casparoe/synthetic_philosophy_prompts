prompt: |-
  Hey, so I'm assembling a set of satire prompts and I need one on logical omniscience — the habit in epistemic logic and formal epistemology of modelling agents as knowing every logical consequence of what they know, and everyone just shrugging and calling it a technical convenience. Can you write me a leaked internal memo, the kind that goes round as a PDF with a footer and a version number, from some invented accreditation or standards body (make up the name, don't use a real one) announcing a new compliance standard for "ideal epistemic agents" that all client organisations must now meet. 650-750 words, deadpan the whole way: no winking, no "of course this is absurd", the author should be entirely sincere and mildly proud of the rollout, and there should be a couple of numbered clauses.

  The humour has to come from the logic being right, so that someone who has taught this material laughs instead of wincing. So: closure under conjunction (know the conjunction, know each conjunct); closure under modus ponens; necessitation making every tautology free knowledge, so nobody can avoid knowing infinitely many things before their first coffee; the fact that anyone who knows the rules of inference already knows every theorem, which means the Deduction Division's entire budget is on paper wasted — the memo should notice this in a footnote and change nothing; the gap between implicit and explicit knowledge, which the memo handles by inventing a "recieve" date; and the problem of deduction, i.e. that if knowledge is already closed under consequence there's nothing left for reasoning to do, which should make the memo faintly embarrassed about its own mandatory reasoning workshops while keeping them mandatory. Treat unawareness as a disciplinary matter ("ignorance of a consequence is not a defence") and don't let anyone off the hook for having forgotten something, since forgetting isn't in the model.

  Then land the reductio in the flattest possible tone: because anything follows from a contradiction, an employee who believes a contradiction is simultaneously in full compliance with every clause of the handbook, and the memo should recommend this as the fastest route through onboarding. Keep it legible to someone who's never opened a modal logic textbook — they should get the joke from context even if they miss the machinery.

  After the memo, give me a short JSON summary in this shape:

  {
    "piece_type": "what genre you actually wrote, one line",
    "target": "the practice or habit of thought being satirised, one sentence",
    "machinery_used": ["each formal fact the jokes depend on, named plainly, one item per string"],
    "compliance_loophole": "the in-world shortcut that satisfies the whole policy at once",
    "specialist_takeaway": "what someone who knows the literature should walk away thinking about, two or three sentences"
  }
