  2.  **Deconstruct the Core Argument:**
      *   *Standard View:* Preferences exist internally (mental states, utility functions) and behavior is a noisy projection of them. IRL tries to invert this projection.
      *   *Proposed View:* Preferences are not internal objects waiting to be found. They are theoretical constructs imposed by the observer to make sense of behavior. The "preference" is the output of the model, not the input to the agent.
