      *Drafting the response:*
      Inverse reinforcement learning constitutes human preferences through the act of inference rather than recovering pre-existing mental states, because preferences are not causal entities hidden behind behavior but interpretive constructs imposed upon it. The fundamental error in standard IRL is ontological reification: it treats "preference" as a natural kind analogous to mass or charge that causally generates actions, whereas preferences are actually hermeneutic tools used to make behavior intelligible. Humans do not maximize a stationary scalar function; they navigate contexts using heuristics, habits, and social norms that resist compression into a single utility surface. When an IRL algorithm outputs a reward function, it is not uncovering a hidden variable but rather projecting a specific theory of rationality onto a stream of actions, thereby creating the preference as a residue of that projection.

      Standard remedies such as Boltzmann rationality or noisy optimality do not solve this because they presuppose the existence of a ground-truth reward function $R^*$ that the agent attempts to maximize, treating deviations merely as statistical noise. This relocates the problem from the underdetermination of the reward function to the underdetermination of the rationality model itself. By specifying a noise distribution or a bounded rationality prior, the researcher implicitly defines what counts as a "mistake" versus a "preference," embedding normative judgments about human rationality into the likelihood function. The algorithm does not discover what the human wants; it discovers what the human wants *relative to the specific assumptions about how humans fail to get what they want*. The ambiguity is not resolved but pushed upstream into the choice of the behavioral model, which dictates the shape of the recovered preferences without empirical justification.

      Consequently, reward learning from human feedback does not become arbitrary, but it ceases to be an empirical discovery process and becomes a normative design choice. It remains answerable not to a hidden psychological truth, but to the ethical and pragmatic commitments encoded in the inference architecture by the system designer. Since the preference is constituted by the model, the validity of the learned reward is determined by whether the resulting agent behavior aligns with the values the designer intended to promote, rather than whether it matches a non-existent internal state. Alignment is therefore not a technical problem of accurate measurement, but a political problem of deciding which constitutive model of human agency ought to be enforced.
