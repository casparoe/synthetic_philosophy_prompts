answer: |-
  You have articulated a position that is philosophically seductive and mathematically elegant: that in symmetric games, rationality demands we act as though our decision logically determines the decision of any agent reasoning identically to ourselves. This is the core of Douglas Hofstadter's superrationality. It promises to dissolve the Prisoner's Dilemma without recourse to morality, repetition, or enforcement, relying solely on a heightened conception of rationality.

  However, to treat this as the *correct* account of rational choice requires navigating a minefield of objections. Below is the honest case against superrationality, ordered from considerations that threaten to sink the theory entirely, to those that are merely awkward or cosmetic.

  ### I. The Fatal Objections

  These are arguments that, if accepted, render superrationality incoherent or practically vacuous.

  **1. Evolutionary Self-Undermining**
  This is the hardest blow. A theory of rational choice ought to be robust in a population of learners or evolvers. Suppose a population consists of superrationalists who cooperate in one-shot Prisoner's Dilemmas. Along comes a mutant agent playing standard Causal Decision Theory (CDT). The mutant recognises that the superrationalist's cooperation is fixed (or conditional only on the mutant's own reasoning, which differs). The mutant defects and reaps the temptation payoff while the superrationalist receives the sucker's payoff.
  Over repeated encounters or generations, the superrational strategy is driven to extinction. If rationality is a trait that should survive contact with reality, a strategy that invites exploitation by any agent who does not share its specific metaphysical commitments is suspect. Superrationality is not an Evolutionarily Stable Strategy (ESS). It creates a niche for predators. A rationality that ensures its own demise in a mixed environment is, by pragmatic definitions, flawed.

  **2. Instability Under Arbitrary Asymmetry**
  You asked whether the central recommendation is unstable under small asymmetries. The answer is yes, catastrophically so. Superrationality relies on the premise of *common knowledge* of symmetry and rationality.
  Imagine you are 99% certain your opponent is a superrationalist like yourself, but there is a 1% chance they are a standard defector. In a standard Prisoner's Dilemma, the expected utility of cooperation drops precipitously. Because the payoff for being suckered is so low compared to mutual defection, even a tiny probability that the "logical link" is broken forces the superrational calculation back towards defection.
  This makes the theory incredibly brittle. It requires not just that we *do* reason alike, but that we *know* we do, and know that we know, ad infinitum. In the real world, where agents are never perfectly identical and certainty is never absolute, the superrational prescription collapses into standard defection almost immediately. A theory of rationality that functions only in a vacuum of perfect symmetry is a theory of idealised angels, not agents.

  **3. The Causal Dominance Argument**
  This is the standard objection from Causal Decision Theory, but it remains potent. CDT argues that your choice cannot *cause* the other player's choice in a one-shot game separated by space or time. If my act of cooperating does not physically bring about your cooperation, then I am facing a fixed probability. Whatever you are going to do, you are already going to do. Defection strictly dominates cooperation.
  To accept superrationality, you must reject the premise that rational choice is about maximising expected utility based on *causal* consequences. You must accept that my choice provides *evidence* of your choice strong enough to outweigh the causal dominance. If you hold that rationality is about navigating the causal structure of the world, superrationality is simply an error in probabilistic reasoning—a confusion of correlation with causation.

  ### II. The Conceptual Quagmire

  These objections do not necessarily destroy the theory, but they force it to retreat into narrow definitions or admit it is not distinct from existing frameworks.

  **4. The Undefined Notion of "Reasoning Alike"**
  How much weight is carried by this notion? Too much. For the logic to hold, "reasoning alike" cannot merely mean "using similar heuristics." It must mean implementing the same decision function.
  If we formalise this, superrationality collapses into **Precommitment** or **Source Code Identity**. If I know you run the same algorithm as me, I am not really playing a game against another agent; I am playing against a mirror.
  *   **If "reasoning alike" is strict (identical code):** The theory applies to almost no games humans ever face. We are not identical. We have different priors, different risk tolerances, and different computational limits.
  *   **If "reasoning alike" is loose (similar culture/education):** The logical link is too weak to sustain the cooperation payoff.
  The theory thus faces a dilemma: be precise and irrelevant, or be relevant and imprecise.

  **5. Distinctness from Rivals (EDT, Team Reasoning, Correlated Equilibrium)**
  Is superrationality genuinely distinct?
  *   **Evidential Decision Theory (EDT):** Superrationality looks remarkably like EDT with a specific prior regarding the correlation of actions. In EDT, I choose the act that gives the best news about the world. If my cooperation is strong evidence of your cooperation, EDT cooperates. Superrationality adds the metaphysical gloss of "logical correlation," but the maths is often identical. If it is just EDT, it inherits EDT's problems (e.g., the Smoking Lesion problem).
  *   **Team Reasoning:** Michael Bacharach's team reasoning suggests agents sometimes frame the problem as "What should *we* do?" rather than "What should *I* do?" Superrationality attempts to derive the "we" from the "I" via symmetry. If superrationality is just team reasoning in disguise, it loses its claim to be a fundamental account of *individual* rationality. It surreptitiously imports group agency.
  *   **Correlated Equilibrium:** In game theory, a correlated equilibrium involves an external signal telling players what to do. Superrationality attempts to generate this correlation internally. However, without a mechanism to select *which* correlated equilibrium to play (in games with multiple equilibria), the theory is incomplete.
  *   **Verdict:** It is not fatal that the theory overlaps with these, but it is tidy to admit it. If superrationality is merely a specific application of EDT to symmetric games, it is not a new foundation for rationality, but a subset of an existing, contested one.

  ### III. The Luring Lottery and Empirical Failure

  You ask about the 1983 *Scientific American* Luring Lottery. Readers were asked to submit a number; the prize was $1,000,000 divided by the sum of all numbers submitted. Superrationality suggests one should submit a number proportional to one's estimate of the total entries, ideally randomising to avoid clustering. Instead, entrants submitted googolplexes, rendering the prize worthless.

  **Does this refute the theory?**
  Strictly speaking, no. A normative theory of rationality tells you what you *ought* to do, not what people *do*. Newtonian mechanics is not refuted because a child throws a ball poorly.

  **Is the defence "people are not superrational" too cheap?**
  Yes. If a theory of rational choice cannot guide actual human beings in a contest explicitly designed to test their rationality, its utility is severely limited. The defence becomes cheap if it renders the theory unfalsifiable. If every failure of prediction is met with "the agents were not sufficiently superrational," the theory retreats into a tautology: "Superrational agents act superrationally."
  The Luring Lottery demonstrates that the *common knowledge* condition is almost impossible to satisfy in the wild. Even if you were superrational, you had to anticipate that others would not be. Once you anticipate that others will be greedy (submitting huge numbers), the superrational move shifts. You must submit a huge number to get any share of the vanishing prize. Thus, the failure of others forces you to abandon the cooperative/superrational norm. This circles back to the **Instability Under Asymmetry** point: the presence of non-superrational agents infects the rationality of the superrational ones.

  ### IV. Predictions and Distinctiveness

  Despite these criticisms, we must acknowledge what superrationality predicts that its rivals do not. This is its selling point.

  1.  **One-Shot Prisoner's Dilemma:** CDT and Nash Equilibrium predict Defection. Superrationality predicts Cooperation (provided symmetry is known). This is the theory's flagship prediction.
  2.  **Platonia Dilemma:** Standard rationality offers no clear solution for the $N$-person coordination game without communication (any symmetric mixed strategy is an equilibrium, but selecting $1/N$ is not guaranteed). Superrationality uniquely prescribes the $1/N$ randomisation as the only logical choice for identical reasoners.
  3.  **Newcomb-like Problems:** Superrationality aligns with "Two-Boxers" who recognise the predictor's accuracy as a logical correlation rather than a causal one, often siding with One-Boxing (depending on formulation) where CDT insists on Two-Boxing.

  ### V. Insulation by Qualification

  You asked me to be willing to conclude that the position is well insulated by qualification, and to assess whether that is a problem.

  The position is indeed heavily insulated. It requires:
  1.  Perfect symmetry of agents.
  2.  Common knowledge of that symmetry.
  3.  Common knowledge of superrationality itself.
  4.  Absence of causal channels.

  **Is this a problem?**
  Yes. A theory of rational choice is meant to guide action in the world we inhabit, not in a Platonic realm of identical minds. If the theory requires such stringent qualifications to avoid contradiction or exploitation, it ceases to be a practical guide. It becomes a curiosity of logic rather than a tool for decision-making.
  However, one might argue that this insulation is a feature, not a bug. It highlights that *true* cooperation requires a level of mutual understanding and transparency that humans rarely achieve. In this view, superrationality is not a description of how we *should* act given our current limitations, but a beacon of how we *would* act if we were truly transparent to one another.

  ### Conclusion

  The honest case against superrationality is that it is **evolutionarily unstable**, **brittle under uncertainty**, and **conceptually indistinct from Evidential Decision Theory**.

  The demonstration you sought regarding self-undermining exists: in any population where superrationalists cannot perfectly distinguish one another from defectors, they will be exploited and eliminated. The demonstration regarding asymmetry also stands: a 1% doubt in the other's rationality often flips the prescription from cooperation to defection.

  Superrationality is a beautiful idealisation. It correctly identifies that in a world of perfect mirrors, cooperation is the only logical move. But we do not live in a hall of mirrors; we live in a fog. In the fog, acting as though you are in a hall of mirrors is not rational; it is reckless. The theory is not false, but its domain of applicability is so narrowly constrained by the requirement for perfect symmetry and common knowledge that it cannot bear the weight of being the *correct account of rational choice* for beings such as us. It remains a profound insight into the nature of logical correlation, but a poor manual for life.
