answer: |-
  (a) The Question

  **1. Heterophenomenology and the Limits of Neutrality (20 marks)**

  Heterophenomenology proposes to study consciousness by treating a subject's utterances as a text to be interpreted, constructing a 'heterophenomenological world' of what the subject *says* they experience. The method relies on a discipline of bracketing: the subject is authoritative on how things seem, but not on how things are.

  (a) Explain the discipline of bracketing. Specifically, distinguish between authority over seemings and authority over reality, and state what theoretical work this distinction is intended to perform. In one or two sentences, state whether this method can be applied to a subject who cannot report at all (e.g., a pre-linguistic infant), and what this implies for the claim that the method's data set leaves out no subjective phenomena. **(4 marks)**

  (b) Consider a case where two competing hypotheses about the timing or existence of an experience (such as the Orwellian and Stalinesque interpretations of temporal-order illusions) generate identical heterophenomenological data. Explain why the method cannot distinguish between them on its own terms. Construct the following dilemma: if the method declares there is 'no fact of the matter' between the hypotheses, it has made a substantive ontological verdict rather than remaining neutral; if it allows there is a fact of the matter it cannot reach, it is merely a method for studying beliefs about consciousness, not consciousness itself. **(7 marks)**

  (c) Select which horn of this dilemma a defender of the method should take. Justify this choice and answer the obvious rejoinder from the opposing side. **(4 marks)**

  (d) The Interpretation Objection: The method treats utterances as data only after interpreting them as being *about* experience, deploying a vocabulary of meaning and aboutness which the method claims to suspend. Is it sufficient to reply that every science must interpret its data, or does this show that heterophenomenology is a branch of interpretive social science mis-sold as a natural science of consciousness? **(5 marks)**

  ***

  (b) Model Answer

  Heterophenomenology attempts to naturalise consciousness by sidestepping the hard problem of accessing private experience. The discipline of bracketing is the engine of this attempt. It dictates that the subject is treated as authoritative solely regarding how things seem to them, while withholding all assent regarding whether those seemings correspond to reality. For instance, if a subject reports a vivid red afterimage, the heterophenomenologist records the report as a fact about the subject's behaviour and text, and records the 'seeming of red' as a feature of the subject's heterophenomenological world. However, the method refuses to confirm whether a red phenomenological object actually exists in the mind. The work this performs is to convert first-person phenomena into third-person data, rendering experience safe for scientific scrutiny by treating it as an object of belief rather than a direct given. Regarding non-reporting subjects, the method cannot be applied to infants or non-responsive patients, as there is no text to interpret. This implies the claim that the data set leaves out no subjective phenomena is false; it leaves out all phenomena where reportability is absent.

  The limitation of bracketing becomes acute in cases of indistinguishable hypotheses, such as the temporal-order illusions. In the Stalinesque reading, the brain fabricates experience early to match later data; in the Orwellian reading, it fabricates the memory of experience later to match the data. Both hypotheses predict identical reports and neural timings. Heterophenomenology cannot distinguish them because its data exhausts at the point of the subject's sincere report. Here lies the dilemma. If the method concludes there is 'no fact of the matter' regarding which process occurred, it has ceased to be neutral. Declaring metaphysical indeterminacy is a substantive ontological claim about the nature of consciousness, not a mere methodological suspension of judgement. Conversely, if the method concedes there is a fact of the matter but admits it is inaccessible to the data, then heterophenomenology is not a complete science of consciousness. It becomes a science of conscious beliefs, leaving the actual phenomenon of consciousness as a potential hidden variable.

  A defender must take the first horn: there is no fact of the matter. To do otherwise is to admit the existence of a Cartesian Theatre where events happen that outstrip the subject's capacity to report or discriminate. The justification is that experience is not a private show preceding report, but is constituted by the functional dispositions to report and react. The obvious rejoinder is that this verifies a specific theory of consciousness (illusionism or functionalism) under the guise of method. The defender must answer that this is not a hidden theory but a clarification of concepts: to ask what experience is independent of its cognitive effects is to ask a meaningless question. The method is not neutral on ontology because the ontology of consciousness is exhausted by the heterophenomenological world.

  Finally, the interpretation objection strikes at the entry point of the method. To treat an utterance as a report *of experience*, the scientist must already employ the intentional stance, attributing meaning and aboutness to the noise produced by the subject. This vocabulary presupposes the very mental states the method claims to bracket. It is not enough to say all science interprets data; physics interprets tracks as particles, but does not need to attribute 'aboutness' to the tracks. Heterophenomenology relies on interpreting the subject as a rational agent with mental content. This suggests the method is indeed a branch of interpretive social science. However, this need not be fatal if one accepts that cognitive science is inherently hermeneutic. The mis-selling occurs only if one claims the method bypasses the intentional stance to reach raw data. It does not; it systematises the interpretation. Thus, it remains a valid science of the mind, provided it admits that its data is already theory-laden by the attribution of intentionality.

  ***

  (c) Marking Scheme

  **First-Class Answer (70%+)**
  *   **Part 1:** Clearly distinguishes authority over seemings (phenomenal report) from authority over reality (ontological commitment). Identifies bracketing as the mechanism for converting qualia into data. **Crucially:** Explicitly states the method fails for non-reporting subjects and correctly identifies this as a falsification of the 'no phenomena left out' claim.
  *   **Part 2:** Accurately describes the indistinguishability of the hypotheses (e.g., Orwellian/Stalinesque) based on identical report/brain data. **Key Move:** Explicitly identifies that declaring 'no fact of the matter' is a positive metaphysical claim, violating methodological neutrality. Clearly articulates the alternative: that consciousness might exist beyond the data (hidden variable).
  *   **Part 3:** Consistently defends the 'no fact of the matter' horn (typically by arguing experience is constituted by functional/reporting dispositions). Rebuttal addresses the charge of verificationism or conceptual confusion rather than empirical oversight.
  *   **Part 4:** Recognises that interpreting utterances requires the intentional stance (attributing meaning). Distinguishes this from physical data interpretation. Concludes that the method is hermeneutic/interpretive, rejecting the 'mis-sold' claim only if the proponent admits the theory-laden nature of the data.

  **Lower-Second Answer (50-59%)**
  *   **Part 1:** Defines bracketing generally but blurs the line between seemings and reality. May miss the implication of the non-reporting subject or claim the method can infer experience from brain scans alone.
  *   **Part 2:** Describes the temporal-order case well but fails to press the dilemma. Treats 'no fact of the matter' as a neutral outcome rather than an ontological verdict. Misses the implication that the method might only study beliefs.
  *   **Part 3:** Picks a horn but justifies it by appealing to authority or simplicity rather than ontological commitment. Rebuttal is weak or ignores the charge of non-neutrality.
  *   **Part 4:** Dismisses the objection by saying 'all science interprets' without distinguishing between interpreting physical traces and attributing intentionality. Fails to address the 'mis-sold' aspect.

  **Common Errors (One-line notes)**
  *   **Part 1:** Candidates often claim bracketing proves experience is an illusion, rather than suspending judgement on its reality.
  *   **Part 2:** Candidates frequently assume the method *resolves* the temporal-order case empirically, rather than dissolving it.
  *   **Part 3:** Candidates often defend the method by appealing to its success in psychology, ignoring the philosophical charge of non-neutrality.
  *   **Part 4:** Candidates typically conflate 'interpretation of signals' (physics) with 'interpretation of meaning' (hermeneutics), missing the specific force of the objection.
