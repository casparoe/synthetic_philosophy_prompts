answer: |-
  The jury duty analogy is philosophically bankrupt because it conflates a procedural right designed to protect individuals from the state with a civic obligation designed to bolster the state's legitimacy, confirming your hunch that the accused's rights are the decisive flaw.

  **The Correspondence Map**
  *   **The Juror** maps to **The Voter** (the compelled citizen).
  *   **The Court/State** maps to **The Election Commission/State** (the compelling authority).
  *   **The Defendant** maps to **???** (There is no equivalent; this is the first crack).
  *   **The Verdict** maps to **The Election Result** (the output).
  *   **Deliberation** maps to **The Secret Ballot** (but deliberation implies consensus-seeking, while voting implies aggregation of conflict).
  *   **Exemptions** map to **Valid Excuses** (hardship, distance, disability).
  *   **Contempt/Fine** maps to **Non-voting Penalty** (the enforcement mechanism).

  **Where the Mapping Breaks Down**
  The structural failure begins with the **Defendant**. In a trial, the defendant is a specific rights-bearer whose liberty is at stake; in an election, there is no accused party being protected from the state. Secondly, **Impartiality vs. Partiality**: Jurors are legally required to suppress bias and judge based on evidence; voters are expected to act on bias, interest, and ideology. Thirdly, **Past vs. Future**: Jury duty adjudicates a past event (did this crime happen?); voting selects a future trajectory (what should happen next?). Finally, **Unanimity vs. Majority**: Jury verdicts (usually) require consensus to protect the minority (the accused); elections operate on majority rule, where the minority is explicitly overruled.

  **The Quiet Imports (Your Hunch)**
  You are correct: the jury system is compelled primarily to protect the **accused's Sixth Amendment right to a fair trial**, not to ensure the court looks busy or legitimate. It is a negative liberty shield *against* state power. Compulsory voting is argued to ensure **state legitimacy** and representativeness; it is a positive liberty claim *for* state power. The jury analogy quietly imports the moral weight of "protecting the innocent" to justify "empowering the majority." It also imports the assumption of **neutrality**: by forcing people to vote, proponents assume they will vote like jurors (carefully, neutrally), when in reality they may vote randomly or angrily just to avoid the fine, corrupting the signal.

  **Material Differences vs. Noise**
  *   **Material:** The purpose of the compulsion (rights protection vs. legitimacy creation) and the required mindset (impartial judgment vs. partial preference). These determine whether the coercion is ethically permissible.
  *   **Noise:** Logistics (once vs. every few years), location (courthouse vs. polling station), and specific penalty amounts. These are administrative details that do not affect the moral justification.

  **The Census Analogy**
  The census analogy is equally leaky. The census collects **descriptive data** (who lives where); voting collects **normative preferences** (who should rule). The state compels the census to allocate resources and representation accurately, which is administrative. Compulsory voting forces a political choice, which is an exercise of sovereignty, not data entry. You can be compelled to report facts about yourself; compelling you to choose a ruler violates the negative right to abstain from political authority.

  **The Better Analogy**
  If you need an analogy that holds water, **Taxation** is the strongest rival. Like voting, it is universal, compulsory, and funds the state's operation. The argument is: "You must contribute resources (taxes) even if you dislike how they are spent, so you should contribute agency (votes) even if you dislike the candidates." However, this also fails because taxes fund the state's existence, whereas votes direct the state's power. The most honest conclusion is that there is **no perfect analogy** because voting is uniquely an exercise of sovereignty rather than service; the closest functional match is **Military Conscription**, as both demand personal sacrifice for collective defense, but conscription protects the state from external threats while voting decides the state's internal direction.
