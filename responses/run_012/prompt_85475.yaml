answer: |-
  Good morning.

  I am not an academic. I worked at the paper mill here for nineteen years until it shut down, and for the eleven years since, I have driven a school bus on the same streets I walked to school on. I am a familiar face to many of you, and that is why I am standing here. I said yes to this invitation before I knew what I would say. But I have been thinking about what to tell you, and I have been thinking about history.

  For the last several years, I have been reading the popular books that promise to explain the whole of human history in a single arc. You know the ones. They trace the fates of continents to geography. They locate the decisive turn in one change in the human mind. They argue that the sequence of farming, then cities, then kings and states, is something we inherited rather than discovered.

  I have read enough of the criticism of those books to believe that the trouble is not mainly this or that claim, but the shape they all share. The story always runs from small to large and from simple to complex. It always arrives, at the end, at us. That is convenient for us. It makes our current way of living look like the destination of the human race.

  I do not want to hand a graduating class that shape. I also do not want to stand at a podium and tell you history has no shape at all. That is not true as far as I can tell, and it is not a thing you say to people on the morning they are handed their diplomas.

  So I have been applying a test to these stories. It is a simple test. When I read about how people lived, I ask three questions: Could a person leave? Could a person refuse? Could a person change the rules they lived under?

  If the story says people were stuck, I doubt the story.

  If you look at the archaeological record of early cities, you find things that do not fit the straight line. There are settlements of tens of thousands of people that show no palaces, no royal tombs, no central storehouses, no written administration. Nothing that looks like a ruler. People lived close together, in great numbers, without anyone standing on top of them.

  There is at least one very large early city that appears to have begun as a stratified settlement and then moved in the other direction. They had hierarchy, and then they dismantled it. They did not collapse. They chose.

  There is also evidence that many communities deliberately lived one way in one season and another way in the next. The same people organized themselves communally at one time of year and under something closer to command at another, on purpose. They were not slaves to the land. They were not trapped by farming. They changed the rules with the weather.

  This suggests that the way we live now—with our fixed borders, our permanent hierarchies, our sense that there is no alternative—is not the end of the story. It is just one arrangement. It is a choice, or it is an inheritance we have not yet examined.

  I know what it is to live under an arrangement that feels permanent until it is not. When the mill closed, people talked about it as progress or as a tragedy. Some said it was the natural order of the economy, that we were moving on to something newer and cleaner. Others said the soul of the town had been ripped out, that we were victims of a cosmic injustice.

  I think it was neither. It was a change in the rules. For a hundred years, the town was organized around the shift whistle. You knew where you stood. You knew what your labor was for. When the mill stopped, that structure vanished. It was not progress, because a lot of people were hurt. It was not a cosmic tragedy, because the world did not end. We are still here. But the rules changed, and most of us did not get to vote on the new ones. We had to learn if we could leave, if we could refuse, if we could build something else.

  Some of you are the first in your family to earn a degree. That is a change in the rules. It is a good one. But it does not mean the road is now straight. You will enter a world that looks finished. It looks like the arc of history has hardened into concrete. You will be told that certain things are inevitable. That the market must behave this way. That power must flow that way. That there is no alternative to the way things are.

  I am not going to tell you that the future belongs to you. I do not know that. I am not going to tell you that history is on your side. History is not a side; it is a record of what people did, sometimes well and sometimes badly.

  I am going to give you the test I used.

  When you take a job, ask if you can leave. If the answer is no, the arrangement is wrong.
  When you are given an order, ask if you can refuse. If the answer is no, the arrangement is wrong.
  When you see a rule that hurts people, ask if it can be changed. If you are told it cannot, do not believe it.

  The early cities without kings did not last forever. The seasonal communities eventually settled. The mill did not stay open. Nothing is permanent. But that does not mean we are powerless. It means the shape of things is in our hands, even when it feels heavy.

  You are leaving this campus to enter a world that is large and complex. You will be tempted to think that because it is large, you are small. You will be tempted to think that because it is complex, you cannot understand it. Do not take that bargain.

  You do not need to know the whole arc of history to know when a rule is unjust. You do not need to be a king to know when you are being ruled. You just need to remember that things have been different before, and they can be different again.

  I drive a bus. I see you on the routes. I see the town from the window. I see the houses that were built when the mill was running, and I see the new businesses that opened after it closed. I see the students who walk to school like I did, and I see the ones who are dropped off in cars. I see the shape of the place changing, slowly.

  It is not a straight line. It is not a circle. It is a path that we walk.

  So here is my charge to you. Do not try to be the end of history. Do not try to complete the arc. Just watch the rules. Watch who makes them. Watch who benefits from them. And when you find a rule that says you cannot leave, or you cannot refuse, or you cannot change it, remember the cities without palaces. Remember the seasons that changed the law. Remember that the mill closed, and we are still here.

  You are not the next chapter. You are the people turning the page. Make sure the print is legible. Make sure it is something you can live with.

  Go safely. Thank you.
