answer: |-
  "You put her in a room," the filmmaker said. She was holding the manuscript like it was evidence. "No document puts her in that room. You know that. I know that. So why is she there?"

  "Because that's where the fear lived," the novelist said. "The ledger shows the expenses. The letters show the begging. But the transcript shows a woman guarding herself. I needed to know what she was guarding. I couldn't get there without putting her somewhere."

  "You invented a sister to give her someone to talk to. You invented a room to give her somewhere to stand. You're building a stage and calling it a home."

  "I'm building a life. The records are a skeleton. I'm adding the meat."

  "The dead don't need meat. They need rest." The filmmaker set the pages down. "You keep saying the novel tells the truth in a way the archive can't. But the archive is all we have of her. If you overwrite it, you're not filling gaps. You're erasing what's left."

  "Erasing? I'm making her visible. Nobody knows her name. If I stick strictly to the ledger, she's a line item. A cost for coal, a cost for milk. Is that respecting her? To let her be a sum?"

  "It's respecting the limit of what we can know. You ask if the dead can be wronged. I say yes. Not because they feel pain, but because they can't correct you. If I make a documentary about a living subject and I get it wrong, they can sue me, or they can shout me down. She can't. That silence creates a debt. We owe the silent ones more care, not less."

  "That's sentimentality," the novelist said. "You're dressing up ethics in grief. The dead hold no property in the meanings of their lives. Once you're gone, you don't own your story. The living do. The readers who need to understand what it felt like to be a woman in that river town in the 1890s—they have a claim on her too."

  "So the harm falls on the living?"

  "Exactly. If I mislead them, that's on me. But I'm not misleading them. I'm telling them what it might have been like."

  "But the book trades on the fact that she was real. You're using her name. If you weren't, none of this would matter. You want the authority of history without the constraints. You want the reader to think, 'This happened,' while you're whispering, 'Well, sort of.'"

  "Is the archive innocent?" The novelist leaned forward. "You talk about respecting the record. What record? The county board hated her. The inspector who interviewed her plainly disliked her. He wrote that transcript to justify his own job. If I am faithful to that transcript, I am being faithful to a man's bias against a woman. Fidelity to that document is its own distortion."

  The filmmaker paused. She looked at the transcript copy on the table. "You're right about the inspector. He wanted a scandal or he wanted a cleanup. She had every reason to lie to him. So the document is a performance."

  "And yet you want me to treat it as holy."

  "I didn't say holy. I said it's the only tether we have. If you cut it, she floats away. You say fidelity to the bias is distortion. I say invention is displacement. You're pushing her out of the only space she occupies."

  "Okay," the novelist said. "Let's draw a line. You've said before: invent her inner life if you must, but never give her a deed she did not do. Is that line stable? The interior is precisely what no document reaches. The ledger doesn't say why she bought the coal. Was she cold? Was she trying to keep the infants warm? Was she stealing the money? That's all interior. If I protect the record of deeds, I leave the person completely exposed. I give you the shell and call it the woman."

  "It's not stable," the filmmaker admitted. "I'll concede that. An action without a motive is a lie too. If you show her handing a baby to a mother but imply she did it for money when she did it for pity, you've changed the deed by changing the context. So yes, the line blurs. But there's a difference between interpreting a motive and inventing a scene where she burns a ledger. One explains the record; the other replaces it."

  "What about kindness?" The novelist tapped the chapter in question. "I made her braver than the record shows in one scene. I made her more cowardly in another. I don't feel the same about the two. Is that asymmetry defensible? Or am I just squeamish about making her a villain?"

  "A false kindness differs from a false accusation," the filmmaker said. "If you make her crueler than she was, you damage her memory. If you make her kinder, you're indulging yourself, but you're not harming her reputation. Though..."

  "Though?"

  "Though you're still making her a puppet. If you make her braver, you're using her to inspire your readers. If you make her cowardly, you're using her to show the grit of reality. Either way, she's a tool. But yes, I'd rather be accused of hagiography than slander. The harm isn't to her. It's to the reader who trusts you. They carry a false image of a woman they never met. They think they know her now."

  "So I put a note in the front matter. A sentence. 'Some scenes are invented.' Does that discharge anything?"

  "It makes it worse," the filmmaker said. "It certifies everything you haven't flagged. It tells the reader, 'The rest is true.' But you've compressed years. You invented a sister. Where do you flag that? If you flag the room, do you flag the dialogue in the kitchen? The note creates a binary where there isn't one. It implies there's a baseline of truth you haven't tampered with. But you have."

  The novelist sighed. "So I'm damned if I do, damned if I don't. If I don't tell them, I'm hiding. If I do tell them, I'm lying about the extent of the lie."

  "You're asking for absolution. There isn't any."

  "What about her own words?" The novelist picked up the transcript. "That interview. She spoke. Does that carry special authority? Or is it just one more document among the others?"

  "It's her voice," the filmmaker said. "Even if she was lying, it's the only place where she aimed her own intent at the world. The ledger is numbers. The letters are from other people. The transcript is her trying to survive. You should treat that differently than the inspector's notes about her."

  "But she's still dead. Her intent is gone. If I interpret her words differently than the inspector did, am I wronging her? Or am I just reading?"

  "You're reading," the filmmaker said. "But you're also writing. When you put her in that room, you're not reading. You're directing."

  "And the novel is the only instrument that reaches a life at the depth where it was actually lived," the novelist said. "Facts don't have depth. People do. If I stick to the facts, I give you a flat surface. If I want to show the depth, I have to dig. And digging moves dirt."

  "Digging moves dirt," the filmmaker repeated. "But you're not digging in a grave. You're building a house on top of it and telling people it's the original structure."

  "I'm trying to let them live in it."

  "And when they leave, they think they know who she was. They don't. They know who you needed her to be."

  The novelist looked out the window. "I lean toward my own side. I have to. If I didn't, I couldn't write the book. But I want to know if I'm stealing from her."

  "You are," the filmmaker said. "You're stealing her ambiguity. The record leaves her uncertain. Was she a saint? Was a fraud? The ledger doesn't say. The inspector doesn't know. You're resolving that uncertainty. You're giving the reader a verdict the county board never reached. That's a kind of power the dead can't fight."

  "But the uncertainty is unbearable," the novelist said. "For the reader. For me. I spend four years with her. I can't leave her as a question mark."

  "Then admit you're doing it for you. Don't call it truth. Call it need."

  "If I call it need, does it make it ethical?"

  "No," the filmmaker said. "It just makes it honest."

  The novelist turned back to the manuscript. "I can't change the room. I can't take out the sister. The book won't stand without them."

  "Then don't," the filmmaker said. "Write it. But don't ask me to tell you it's clean. It's not. And don't tell yourself the archive is the enemy. The archive is just the wreckage. You're the one deciding what to salvage and what to leave underwater."

  "And you think I'm leaving too much underwater."

  "I think you're dredging up gold and calling it mud," the filmmaker said. "Or vice versa. I don't know. I just know that when I look at her name, I want to see what was there, not what fits your theme."

  "And I want to see what was there," the novelist said. "I just think what was there includes things that weren't written down."

  "They weren't written down," the filmmaker said. "That's the point. They're gone. You can't mourn them into existence."

  "I'm not mourning. I'm resurrecting."

  "Then be careful," the filmmaker said. "Because you don't know what kind of monster you're bringing back. And neither does she."

  They sat in the silence of that. The manuscript lay between them, heavy with the weight of a woman who could not speak to either of them, waiting to see which voice would carry hers.
