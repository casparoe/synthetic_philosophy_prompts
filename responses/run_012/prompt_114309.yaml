  | Reform | Gap_closure | Confidence | Main_channel | Strongest_point | Failure_mode | Tier |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | Hard single-term limit | 0.30 | 0.80 | incentives | It eliminates the incentive to make decisions based on re-election campaigns. | It attracts short-term opportunists who maximize personal gain quickly before exiting. | B |
