  | Advisory-only citizens' assembly | 0.10 | 0.90 | incentives | It introduces diverse citizen voices into the discourse without disrupting constitutional stability. | Elected officials can simply ignore the recommendations when they become politically inconvenient. | D |
  | Term limits plus cooling-off | 0.35 | 0.80 | incentives | The cooling-off period reduces the incentive to trade favors for future employment while in office. | It still relies on an election system that favors the wealthy and politically connected. | B |
  | Lottery-restricted candidacy | 0.40 | 0.50 | selection | It breaks the gatekeeping power of parties and donors by randomizing who is allowed to run. | The final election still favors those with resources, negating much of the randomization benefit. | B |
  | Compulsory-service model | 0.75 | 0.40 | selection | It forces a true cross-section to serve, including those who would never voluntarily run for office. | Mass refusal or legal challenges could render the system non-functional or biased toward the compliant. | A |
  | Total rotation | 0.60 | 0.30 | selection | It maximizes descriptive representation by ensuring no professional class ever forms. | Complete loss of institutional memory leads to legislative chaos and bureaucratic capture. | C |
  | Competence-gated sortition | 0.20 | 0.70 | selection | It attempts to balance representative demographics with baseline legislative capability. | Testing inherently biases the pool toward the educated and wealthy, defeating the randomization goal. | D |
  | Recall-by-petition sortition | 0.30 | 0.40 | both | It adds a direct accountability mechanism to a sortition system to prevent rogue behavior. | It reintroduces polarization and campaign-style pressure, undermining the deliberative benefit of sortition. | C |

  ### (a) Tiers Ranked Best to Worst

  *   **Tier S:** Fully sortition-based lower house.
  *   **Tier A:** Compulsory-service model.
  *   **Tier B:** Hard single-term limit; Term limits plus cooling-off; Lottery-restricted candidacy.
  *   **Tier C:** Total rotation; Recall-by-petition sortition.
  *   **Tier D:** Advisory-only citizens' assembly; Competence-gated sortition.

  ### (b) Effectively Similar Mechanisms

  Several items on your list are variations of the same core mechanism. **Reforms 1 and 4** are both term-limit structures; while the cooling-off period adds nuance, both operate primarily by truncating the career horizon to alter incentives. **Reforms 2, 6, and 7** are all sortition models; Reform 6 is simply Reform 2 with a penalty for refusal, and Reform 7 is Reform 2 with accelerated turnover. While the implementation details differ, their primary channel for closing the gap is identical: changing *selection* to force descriptive representation rather than changing *incentives* for elected officials.

  ### (c) Low-Confidence Warning

  You should be extremely cautious about acting on **Reform 6 (Compulsory-service model)** regardless of its high gap-closure score. The confidence score is 0.40 because there is no modern precedent for compelling legislative service at a national scale. The risk is not just that it fails to close the gap, but that it triggers a constitutional crisis, mass civil disobedience, or a system where only the marginalized (who cannot afford to fight the penalty) serve, which would ironically widen the gap between power and influence. High theoretical alignment does not guarantee functional implementation.
