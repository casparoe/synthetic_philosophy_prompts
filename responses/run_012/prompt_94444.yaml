      *Refinement on End-of-Life:* Is it Rule of Rescue or Prioritarianism? Rule of Rescue is often seen as irrational bias. Prioritarianism is a rational weighting of the worse-off. HTA bodies (like NICE) often frame it as "severity" or "end of life," which leans Prioritarian. I should mention both.
      *Refinement on Weights:* The "whose judgments" part is crucial. Public vs. Patient. If public, it's "social value." If patient, it's "experienced welfare." The prompt says "public or clinicians." This implies a social valuation of health states, not necessarily the experienced utility of the disabled person. This is a specific form of welfarism (preference-based).

  8.  **Final Review against constraints:**
      *   Did I answer all 4 sub-questions? Yes.
