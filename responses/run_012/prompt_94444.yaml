answer: |-
  This analysis dissects the axiological commitments of Cost-Effectiveness Analysis (CEA) using Quality-Adjusted Life-Years (QALYs), as typically employed by bodies like NICE (UK) or PBAC (Australia).

  ### 1. The Repugnant Conclusion and the Quality-Quantity Trade-off

  **Does the practice commit to the Repugnant Conclusion?**
  Strictly speaking, the Repugnant Conclusion (Parfit) is a claim about variable population ethics: that for any population of very happy people, there is a better population of lives barely worth living, provided it is large enough. Since public health systems generally treat the population size as fixed (allocating resources among existing citizens rather than deciding how many people to create), the practice does not *directly* enact the Repugnant Conclusion.

  However, the practice **presupposes an axiology that is vulnerable to it.** The core calculation is **Total Utilitarianism**: $Value = \sum (Quality \times Duration)$. This axiology holds that value is additive and that there is no lexical priority for quality over quantity. If the arithmetic favours 1,000 years at quality 0.1 over 10 years at quality 1.0, the system chooses the former.

  **The Trade-off:**
  Because the system operates on a fixed population, the trade-off it makes is not between "many people vs. few people," but between "many low-quality years vs. few high-quality years" (either within a single life or aggregated across lives).
  *   **Is it a weaker cousin?** Yes. It is the **Intra-personal or Fixed-Population analogue** of the Repugnant Conclusion. It commits to the view that welfare is a homogeneous substance that can be aggregated without limit. It denies that there is a "threshold of decency" below which adding life-years contributes negligible or no value.
  *   **Axiological Commitment:** It commits to **Unrestricted Aggregation**. It treats a QALY as a unit of value that is identical regardless of the baseline quality of life. This implies that the marginal value of a QALY does not diminish as total QALYs increase, which is the structural engine that drives the Repugnant Conclusion in variable population contexts.

  ### 2. The End-of-Life Exception

  **Rule of Rescue vs. Prioritarianism:**
  The end-of-life exception (allowing a higher cost-per-QALY threshold for treatments extending life at the very end) is a departure from strict aggregation.
  *   **Rule of Rescue:** This aligns with the psychological and deontological impulse to save identifiable lives facing imminent death. It treats the "identifiable" patient differently from the "statistical" patient who might benefit from preventative care elsewhere.
  *   **Prioritarianism:** Alternatively, it can be interpreted as a **Prioritarian** weighting, where benefits to the worse-off (those facing death/lowest remaining QALYs) count for more than benefits to the better-off.

  **Consistency and Dual Principles:**
  This exception is **inconsistent** with the straight aggregative utilitarianism used in standard QALY calculations. In strict Total Utilitarianism, a QALY is a QALY, regardless of whether it extends a life from 1 year to 2 years or from 40 years to 41 years.
  *   **Dual Principles:** The body effectively operates on two principles:
      1.  **Efficiency (Utilitarian):** Maximize total health gain per budget unit.
      2.  **Equity/Rescue (Deontological/Prioritarian):** Give priority to those facing catastrophic loss (death).
  *   **Single Axiology?** These cannot be derived from a single, monotonic value function without modification. To unify them, one would need to adopt a **Severity-Weighted Prioritarianism** where the value of a QALY is a function of the patient's baseline health. As it stands, the practice is a hybrid: Utilitarian by default, with a deontological constraint applied at the margins.

  ### 3. Rival Views: Licensing and Ruling Out

  *   **Totalism (Total Utilitarianism):** **Licenses** the core practice. It is the native axiology of the QALY. It demands maximizing the sum of welfare.
  *   **Averagism:** **Rules out** the practice. Averagism would prefer a smaller population with higher average health over a larger population with lower average health. It would reject trading high-quality years for a larger volume of low-quality years if doing so lowered the average.
  *   **Critical-Level Views:** **Rules out** the standard practice unless modified. Critical-level utilitarianism holds that lives (or life-years) only count if they exceed a certain threshold of quality. Standard QALYs treat any score $>0$ as positive. A Critical-Level view would require ignoring or discounting QALYs gained below a "decent life" threshold.
  *   **Prioritarianism:** **Rules out** the standard (unweighted) practice. Prioritarianism requires giving extra weight to benefits conferred on the worse off. Standard CEA treats a QALY for a healthy person the same as a QALY for a severely disabled person. (Note: The end-of-life exception is a *concession* to prioritarianism, but the baseline system is not prioritarian).
  *   **Person-Affecting Views:** **Rules out** the practice if applied to future generations. Person-affecting views hold that an outcome can only be better if it is better for some particular person. If QALY maximization is used to justify policies that change *who* comes into existence (e.g., reproductive health funding), Person-Affecting views would object to comparing non-identical people. Within a fixed population, they are compatible.

  ### 4. Weights, Authority, and Objectivity

  **Whose Judgments are Authoritative?**
  By eliciting weights from the **general public** or **clinicians** rather than solely from those living with the disability, the practice treats **social preference** as authoritative over **experienced welfare**.
  *   **The Presupposition:** This presupposes that the value of a health state is a matter of **social valuation** (how much society *wants* to avoid that state) rather than **hedonic experience** (how bad the state actually *feels* to the patient).
  *   **Objectivity:** This implies an **Anti-Realist** or **Constructivist** view of welfare. It suggests there is no objective "truth" about the value of life with a disability waiting to be discovered; rather, the value is constituted by the elicited preferences. If the public weights a condition at 0.5, it *is* 0.5 for the purpose of allocation. It treats welfare as inter-subjectively comparable via a common currency of preference, not via objective metaphysical facts.

  ---

  ### Separation: Presuppositions vs. Fits, and Modifications

  #### What the Practice Strictly Presupposes
  1.  **Welfarism:** The good is defined entirely by health/welfare outcomes.
  2.  **Consequentialism:** Decisions are judged solely by the outcomes produced.
  3.  **Interpersonal Comparability:** It is possible to compare and sum welfare units across different people.
  4.  **Neutrality (Baseline):** A unit of health gain is of equal value regardless of who receives it (prior to the end-of-life exception).
  5.  **Aggregation:** Small gains to many can outweigh large gains to few.

  #### What Merely Fits Well (Contingent Features)
  1.  **The End-of-Life Exception:** This is a political/ethical patch, not a requirement of the QALY math.
  2.  **The Specific Threshold:** (e.g., £30,000 per QALY). This is a budget constraint, not an axiological truth.
  3.  **Public vs. Patient Weights:** The system could switch to patient-reported outcomes without changing the underlying Total Utilitarian axiology.
  4.  **Discounting Future Health:** The practice usually discounts future QALYs (time preference). This fits capitalism/economics but is not required by Utilitarianism (which often treats future welfare equally).

  #### Replacing the Axiology: Refusing the Repugnant Conclusion
  If we replaced the implicit Total Utilitarianism with an axiology that refuses the Repugnant Conclusion (e.g., **Critical-Level Utilitarianism** or **Lexical Prioritarianism**), the following changes would be required:

  1.  **The Weights (Critical Level):** We would need to establish a "critical level" of quality of life (e.g., 0.4 on the 0–1 scale). QALYs accumulated below this level would count for zero (or negative) value. This would stop the system from funding treatments that merely extend miserable existences just to add to the sum total.
  2.  **The Thresholds (Diminishing Value):** The cost-per-QALY threshold could not be constant. It would need to be **progressive**. Buying a QALY for someone at 0.2 quality would be worth more than buying a QALY for someone at 0.9 quality. The system would need to maximize *weighted* QALYs, not raw QALYs.
  3.  **Readiness to Trade (Aggregation Constraints):** The system would need **lexical thresholds**. It would no longer be permissible to trade a small number of high-quality years for *any* number of low-quality years. There would be a constraint preventing the "swamping" of significant health benefits by a mass of trivial ones.
  4.  **Identity of Recipients:** The system would have to track the baseline status of recipients more rigorously. Current practice often anonymizes QALYs (a QALY is a QALY). A Repugnant-Conclusion-proof axiology requires knowing *who* gets the QALY to determine its moral weight (e.g., is it raising someone above the critical level, or just adding to an already good life?).

  In summary, the current practice is **Total Utilitarianism with a deontological side-constraint**. To avoid the Repugnant Conclusion, it would need to become **Prioritarian or Critical-Level**, fundamentally altering the mathematics from simple summation to weighted valuation based on baseline welfare.
