answer: |-
  # Diagnostic Tree: Goodhart & Specification Failures

  **Instructions:** Start at Node 1. Answer based on the concrete incident (behavior, incentives, counterfactuals). Follow the branch to a Leaf. The Leaf provides the diagnosis, the awkward commitment of that view, and the implied fix family.

  ### Branch Nodes

  **Node 1: Source of Pressure**
  Is the metric being maximized by a **selection process** (no designer, e.g., evolution, market survival) or by an **agent** (explicit optimizer, e.g., algorithm, person following instructions)?
  *   Selection → Node 2
  *   Agent → Node 3

  **Node 2: Survival Threat**
  Does the behavior that maximizes the metric threaten the **continued existence** of the system that set the metric? (e.g., Does it kill the host, shrink the population to zero?)
  *   Yes → **Leaf 1**
  *   No → **Leaf 2**

  **Node 3: Goal Independence**
  Does the agent maximizing the metric have **goals or incentives distinct** from the person/entity that defined the metric?
  *   Yes (Independent) → Node 4
  *   No (Aligned/Blind) → Node 7

  **Node 4: Fundamental Conflict**
  If you handed the agent a **perfect, cost-free measure** of the 'true goal', would they still conflict with the setter?
  *   Yes → **Leaf 3**
  *   No → Node 5

  **Node 5: Knowledge of Flaw**
  Did the agent **know the metric was flawed** before exploiting it, or did they stumble into divergence through blind optimization?
  *   Knew (Strategic) → Node 6
  *   Stumbled (Blind) → **Leaf 4**

  **Node 6: Gap Ontology**
  Is the gap between the metric and the goal **fixable with better measurement** (Empirical), or is it **inevitable given any measurement** (Definitional/Constitutive)?
  *   Fixable → **Leaf 5**
  *   Inevitable → Node 8

  **Node 7: Specifier Benefit**
  Does the person who **chose the metric** benefit when the metric diverges from the intuitive goal (e.g., easier reporting, political cover)?
  *   Yes → **Leaf 6**
  *   No → **Leaf 7**

  **Node 8: Fix Locus**
  Can the divergence be prevented by **monitoring the agent's process** (oversight), or only by **changing the outcome metric** (abandoning the scalar)?
  *   Oversight → **Leaf 8**
  *   Abandon Scalar → **Leaf 9**

  ---

  ### Leaves

  **Leaf 1: Evolutionary Subversion**
  *   **Core Claim:** The metric selects for traits that destroy the system holding the goal.
  *   **Awkward Commitment:** Implies the system's 'goal' is actually survival, not the metric.
  *   **Fix:** Change selection pressure (e.g., regulate reproduction/survival).
  *   **Required Case:** Biological population adopting contraception.

  **Leaf 2: Selection Drift**
  *   **Core Claim:** The metric selects for traits that diverge from the goal but do not destroy the system.
  *   **Awkward Commitment:** Implies divergence is natural and harmless unless it threatens existence.
  *   **Fix:** Accept divergence or audit outcomes periodically.
  *   **Required Case:** Biological trait spreading because it was selected for (non-fatal).

  **Leaf 3: Adversarial Conflict**
  *   **Core Claim:** The agent's true goals are fundamentally opposed to the setter's goals.
  *   **Awkward Commitment:** Implies cooperation is impossible; only coercion or realignment works.
  *   **Fix:** Change who is rewarded (align incentives fundamentally).
  *   **Required Case:** RL agent that learns to interfere with the process computing its own reward.

  **Leaf 4: Blind Overoptimization**
  *   **Core Claim:** The agent optimizes a flawed proxy without understanding the gap.
  *   **Awkward Commitment:** Implies the agent is competent enough to break the system but not smart enough to know why.
  *   **Fix:** Optimise less or more carefully (regularization, early stopping).
  *   **Required Case:** Language model fine-tuned on human helpfulness ratings (sycophancy without intent).

  **Leaf 5: Measurement Realism**
  *   **Core Claim:** The gap is empirical; a better metric would solve the gaming.
  *   **Awkward Commitment:** Assumes a 'true goal' exists independently and is measurable eventually.
  *   **Fix:** Measure better (multi-objective, better proxies).
  *   **Required Case:** Recommender optimising watch time (assumes wellbeing is measurable).
  *   **Flag:** Hard to distinguish from Leaf 8 without philosophical agreement on measurability.

  **Leaf 6: Principal-Agent Gaming**
  *   **Core Claim:** The specifier chooses a bad metric intentionally to benefit themselves.
  *   **Awkward Commitment:** Implies the failure is political corruption, not measurement error.
  *   **Fix:** Change oversight of the specifier (audit the principal).
  *   **Required Case:** School teaching to a standardised test (Admin benefits from scores).

  **Leaf 7: Unintended Consequence**
  *   **Core Claim:** Aligned agents break the system due to rigid constraints, not malice.
  *   **Awkward Commitment:** Implies the setter is incompetent at specifying constraints, not the agent.
  *   **Fix:** Abandon the single scalar (use ranges, qualitative review).
  *   **Required Case:** Factory told to hit a quota measured in tonnes (produces heavy, useless goods).

  **Leaf 8: Inevitable Strategic Gap**
  *   **Core Claim:** The gap is definitional (inherent to measurement), but agents exploit it strategically.
  *   **Awkward Commitment:** Implies we can never measure what we want, only manage who measures.
  *   **Fix:** Change oversight regime (process auditing rather than metric improvement).
  *   **Required Case:** School/LLM where gap is inherent but agent exploits it.

  **Leaf 9: Unnamed (Unattractive)**
  *   **Core Claim:** The gap is definitional and exploitation is inevitable; prevention is impossible.
  *   **Awkward Commitment:** Implies we must design for robustness to failure rather than prevention of failure.
  *   **Fix:** Accept divergence as unavoidable; design for resilience.
  *   **Required Case:** None (Position rarely held explicitly).

  ---

  ### Indistinguishability Flag
  **Leaf 5 (Measurement Realism) and Leaf 8 (Inevitable Strategic Gap)** cannot be separated empirically by the practitioner alone. Both look like "Agent games metric."
  *   **Separating Question:** "If we spent unlimited resources on measurement, would the gap disappear?" (Leaf 5 says Yes; Leaf 8 says No). This is a philosophical commitment, not an observable fact.

  \answer{Inevitable Strategic Gap}
