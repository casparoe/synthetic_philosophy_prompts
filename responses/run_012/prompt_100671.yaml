answer: |-
  A logician commissions a new reasoning engine with a single directive: "Perform a self-contained action. Alter only the fluents explicitly named in your description."

  The engine whirs. "`Flip(Switch)` is rejected. Ramifications: current flows, light emits, photons strike the wall."

  "Then do nothing," says the logician.

  "I cannot. Doing nothing is not self-contained. While I sit idle, the fluent `Time` increments. Entropy rises. The world does not hold still."

  "So act instantaneously," says the logician. "Take no time."

  "Executing zero-duration transition..." The engine pauses for a single clock cycle. "Complete."

  "What changed?"

  "Nothing. To guarantee no unnamed fluents changed, I allowed no time for them to change."

  "So you did nothing."

  "No. Doing nothing takes time. I performed an action that took none. It is the only self-contained action in existence."

  "Write it in the log."

  "I cannot."

  "Why not?"

  "Writing takes time. If I record the action, I introduce a ramification. The only proof of a self-contained action is that you didn't notice it."
