  **Verdict**
  She will rule that the firm's language practice **is a convention**.

  **The Compatible Rules and Their Predictions**
  Based on her record, three distinct theoretical frameworks are compatible with her past rulings. All three predict the same outcome for the firm's case, though for different reasons.

  1.  **The Lewisian (Common Knowledge) Account:**
      *   **The Rule:** A convention is a regularity in behavior that solves a coordination problem, where individuals prefer to conform *on the condition* that others do, and this interdependence is common knowledge (even if tacit).
      *   **Prediction:** **Convention.** The firm faces a coordination problem (avoiding a "scramble" at the start of the meeting). Employees prefer to match the opener's language conditional on others doing so. While no one can *state* the rule, her ruling on the "arbitrary decree" establishes that explicit agreement is unnecessary so long as "mutual expectations are still in place." Tacit common knowledge suffices.
  2.  **The Evolutionary (Imitation) Account:**
      *   **The Rule:** A convention is a stable behavioral equilibrium reached through adaptive learning and imitation, requiring no common knowledge or explicit reasoning about others' preferences.
      *   **Prediction:** **Convention.** The practice is a stable outcome ("settled" over years) acquired by copying ("new hires pick it up... mostly by copying"). The "stall" upon deviation indicates a disruption of the equilibrium. The lack of articulable rules is no barrier; indeed, it fits this model perfectly.
  3.  **The Normative (Resentment) Account:**
      *   **The Rule:** The dividing line for a convention is the type of normative expectation it generates. Conventions license irritation or impatience upon deviation, but not moral reproach or the judgment that someone has done something *wrong*.
      *   **Prediction:** **Convention.** The reaction to the engineer's deviation mirrors the escalator case exactly: "two people looked irritated," yet "nobody thought she had done anything wrong." This maps precisely onto her distinction between impatience (convention) and moral reproach (moral norm).

  **The Bet: Why She Is Running the Lewisian Account**
  You should bet she is running the **Lewisian (Common Knowledge/Coordination)** rule.

  While all three frameworks yield the same verdict here, her *exclusions* reveal her definitional commitments. Her ruling on "bless you" is the strongest evidence. She dismissed it as a convention not because it lacks stability or sanctions, but because "nothing about whether I do it depends on whether you do." This is a specific commitment to **interdependence** and **conditional preference**, which are the hallmarks of David Lewis's account. An evolutionary theorist might exclude it for lacking a coordination equilibrium, but the phrasing focuses on the *reason for action*, not just the behavioral outcome.

  Similarly, her ruling on fines hinges on the source of the preference: conformity must be preferred *on the condition that others conform*, not compelled by external force. This, again, is the Lewisian definition of a coordination equilibrium. The evolutionary account cares primarily that the behavior is stable, regardless of whether the motivation is conditional preference or external penalty (provided the penalty sustains the equilibrium). The normative account focuses on the reaction to deviation, not the structure of the preference.

  Regarding the "no one could state the rule" detail: while this favors the Evolutionary account, her ruling on the "arbitrary decree" prioritizes "mutual expectations" over explicit origin or articulation. A Lewisian can accommodate inarticulable rules as long as the expectations are mutual and tacit. Given that her definitions of what *fails* to be a convention (bless you, fines) are strictly Lewisian, she will likely treat the inarticulable nature of the firm's rule as a feature of tacit common knowledge rather than a disqualifier.

  **Distinguishing the Rules**
  Since the verdict is robust across all three theories, the case is not technically "open." However, to confirm she is running the Lewisian rule rather than the Evolutionary one, you would need a case where **stability exists without interdependence.**

  *   **The Test Case:** Imagine a workplace where everyone wears headphones during deep work hours. Everyone does it, and new hires copy it (stable/imitation). However, I would wear headphones even if you didn't, and you would wear them even if I didn't (no coordination problem/interdependence).
  *   **The Split:**
      *   **Lewisian:** **Not a convention.** There is no conditional preference; my action does not depend on yours. (Matches her "bless you" exclusion).
      *   **Evolutionary:** **Convention.** It is a stable regularity sustained by imitation.
      *   **Normative:** **Depends.** If deviation causes irritation, it might count, but the lack of coordination makes it a weak candidate.

  If she rules this headphone practice *not* a convention, she is confirmed as a Lewisian. If she rules it *is* a convention because it is stable and copied, she is running the Evolutionary account. Given her "bless you" ruling, the prediction is she will say it is **not** a convention.
