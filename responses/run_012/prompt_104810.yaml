answer: |-
  You have described one of the central problems in the philosophy of mind and science with remarkable precision. You are standing exactly at the intersection of **Multiple Realizability**, **Causal Closure**, and **Explanatory Autonomy**.

  There is an established conceptual framework that fits your predicament, though it is scattered across a few specific terms. The most precise name for the *type of description* you are valuing is a **Program Explanation** (as opposed to a *Process Explanation*). The metaphysical stance that validates this without violating physics is **Non-Reductive Physicalism**. The tension you feel—the worry that the high-level description points to nothing "doing the pushing"—is known as the **Causal Exclusion Problem**.

  Here is the precise carving you asked for, distinguishing what fits, what doesn't, and where the boundaries lie.

  ### 1. The Established Concepts

  **The Predicament: The Causal Exclusion Problem**
  The tension you describe—where the physical level is causally complete (no "leftover shove") yet the mental/functional level seems to be the only useful explanation—is formally known as the **Causal Exclusion Problem** (associated with philosopher Jaegwon Kim).
  *   **Why it fits:** It captures your worry that if the gears/voltage account for every push, there seems to be no "work" left for the *sum* to do.
  *   **Why it might not satisfy:** In philosophy, this is often treated as a threat (implying the high-level description is an illusion). You, however, rightly sense the high-level description is *real* and *indispensable*.

  **The Solution: Program Explanation vs. Process Explanation**
  To resolve this without magic, philosophers Frank Jackson and Philip Pettit distinguished between two types of explanation. This is the specific terminology that matches your machinist intuition:
  *   **Process Explanation:** This traces the specific physical chain of events (the gear teeth meshing, the domino falling, the transistor switching). This is causally complete but substrate-specific.
  *   **Program Explanation:** This cites a higher-level property (the "sum," the "digit") that *ensures* that some physical process or other will occur to produce the result. It "programs" the outcome without specifying the physical details.
  *   **Why this is the name you want:** A Program Explanation is valid *precisely because* the system is multiply realizable. It explains *why* the output happened in a way that survives the change of substrate, without claiming to add extra physical force. It respects causal closure while asserting explanatory indispensability.

  **The Metaphysics: Non-Reductive Physicalism**
  This is the worldview that holds your three machines are entirely physical (no ghosts), but that the "adding" property is real and not reducible to just "gears" or just "voltage."
  *   **Multiple Realizability:** This is the *condition* that makes Program Explanations possible. Because "adding" can be realized by gears, dominoes, or silicon, "adding" is a valid category distinct from "gear-turning."
  *   **Supervenience:** This describes the dependency. The "sum" cannot change unless the physical state changes. There is no "leftover shove" because the high level rides on the low level.

  ### 2. What It Is Not (The Distinctions)

  You mentioned three nearby ideas. Here is how they differ from your specific configuration:

  *   **Multiple Realizability:** This names the *structural fact* (same function, different parts), but it does not address the *causal tension*. You can have multiple realizability without worrying about where the "push" comes from. Your predicament includes the worry about causal closure.
  *   **Downward Causation:** This is the idea that the high level *pushes* the low level (e.g., "The desire to add made the gear turn"). You explicitly rejected this ("no leftover shove"). Your view is more subtle: the high level *explains* the push without *being* a separate push. Program Explanations do not require downward causation.
  *   **Levels of Explanation:** This is too vague. It implies a hierarchy but doesn't specify the relationship between causal completeness and explanatory utility. Your predicament is specifically about the *indispensability* of the higher level despite the *completeness* of the lower level.

  ### 3. Boundary Cases (The Carving)

  You asked where the edges lie. Using the criterion of **Program Explanation** (does a high-level description capture a robust, counterfactual-supporting pattern that is substrate-neutral?), here is the classification:

  **In: The Thermostat**
  *   **Verdict:** **In.**
  *   **Reasoning:** A thermostat maintains a temperature. You can explain its behavior by tracing the bimetallic strip bending (Process) or by citing the "set point" and "feedback loop" (Program). The "set point" explanation works whether the thermostat is mechanical, electronic, or software. It encodes a goal state and is multiply realizable.

  **Out: The River Carving a Channel**
  *   **Verdict:** **Out.**
  *   **Reasoning:** A river carving a channel is purely a Process Explanation. There is no "encoding" of a channel shape that exists independently of the water flow. The water does not represent the channel; it physically creates it. There is no higher-level "goal" or "computation" that is robust across different physical substrates (e.g., you cannot make a "river" out of dominoes that carves a channel in the same functional sense). It is physics all the way down, with no functional abstraction layer.

  **In: The Chess Engine (Single Machine)**
  *   **Verdict:** **In.**
  *   **Reasoning:** Even if the engine *only ever runs on one specific machine*, it is **in principle** multiply realizable. The explanation "It moved the knight to fork the king" is a Program Explanation. It remains valid even if you port the code to a different architecture. The physical voltage is the process; the chess move is the program. The fact that it hasn't been moved doesn't negate the functional abstraction.

  **The Edge Case: Changing the Domino Machine**
  *   **Verdict:** **Out (if the mapping is gerrymandered).**
  *   **Reasoning:** To qualify for a Program Explanation, the high-level pattern must be a **"Real Pattern"** (a term coined by Daniel Dennett).
      *   *Scenario A:* The dominoes are set up so that falling lines reliably encode digits 0–9 and carry over. **In.**
      *   *Scenario B:* You arrange the dominoes so that *after the fact*, you can draw a line around the fallen ones and say "Look, that shape looks like a 5." **Out.**
      *   **The Change:** If the mapping between the physical state and the number is arbitrary, ad-hoc, or not robust to small physical variations (noise), it is not a Real Pattern. The Program Explanation fails because it doesn't support counterfactuals (e.g., "If I had nudged this domino, the sum would have been different"). If the physical setup doesn't reliably *preserve* the function against noise, the high-level description is just a story you tell, not an explanatory tool.

  ### 4. Summary Definition

  If you require a single label for this configuration that isn't already burdened by the "mind-body" baggage, the most accurate established term is:

  **Explanatory Autonomy (under Causal Closure)**

  *   **Definition:** A state where a higher-level description provides the only robust, predictive, and generalizable account of a system's behavior (Autonomy), despite every physical event being fully determined by lower-level physical laws (Causal Closure), made possible because the higher-level property is multiply realizable.
  *   **Mechanism:** Program Explanation.
  *   **Requirement:** The high-level pattern must be a "Real Pattern" (robust to noise and substrate changes).

  You are not missing a shove. You are observing that **causation** lives at the physical level, but **explanation** lives at the functional level. Your adding machine is a physical object, but "addition" is a pattern that the object instantiate. The pattern is real, even if it doesn't push.

  ### 5. If I Must Coin a Term

  If you find "Program Explanation" too software-centric for your mechanical gears, and "Explanatory Autonomy" too abstract, I would coin the term:

  **Functional Indispensability**

  *   **Definition:** The condition where a functional description (e.g., "adding") is required to predict system behavior across substrate changes, despite the physical implementation being causally complete.
  *   **Edge:** It excludes systems where the function is post-hoc (the river) or where the function is tied inextricably to one specific physical medium (a unique sculpture that cannot be replicated functionally). It includes any system where the *logic* of the operation can be decoupled from the *physics* of the operation without loss of predictive power.

  However, I recommend sticking with **Program Explanation**. It was designed exactly for this: to validate the story about the "sum" without denying the story about the "gears."
