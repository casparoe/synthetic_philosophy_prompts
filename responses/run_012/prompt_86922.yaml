  My credence is **0.55**.

  The question is well-formed, though 'rationally required' carries a heavy normative load that shifts depending on whether one prioritises consistency or avoidability of absurdity. I lean slightly towards the view that standard decision theory holds, but the self-referential worry prevents a stronger commitment.

  ### Decomposition

  | Sub-question | Credence | Justification |
  | :--- | :--- | :--- |
  | **1. Is unbounded value coherent?** | 0.45 | It is mathematically possible, but arguably psychologically or metaphysically impossible for finite agents to hold. |
  | **2. Is rationality procedural (VNM)?** | 0.70 | Representation theorems are robust, but completeness is often dropped to avoid fanaticism. |
  | **3. Should tiny probabilities be zero?** | 0.30 | Epistemic humility suggests a floor, but principled discounting remains theoretically underdeveloped. |
  | **4. Is anti-fanaticism intuition biased?** | 0.75 | Evolutionary heuristics are ill-suited for astronomical stakes and microscopic probabilities. |
  | **5. Is the self-referential case distinct?** | 0.50 | It may be a recursive mugging, but it risks circular justification of the decision rule itself. |
  | **6. Does objective vs. subjective prob. matter?** | 0.60 | Normative force seems to depend on epistemic state, not the metaphysical status of the chance. |

  ### Synthesis

  To combine these: if value must be bounded (1), the claim collapses; if rationality is strictly procedural (2) and intuitions are biased (4), the claim holds. I weight (2) and (4) heavily as they concern the core definition of rationality, whilst (1) is a metaphysical caveat. The self-referential case (5) is the primary drag on my credence; if it proves the rule is reflectively unstable, the 'requirement' vanishes. The probability floor (3) is a potential escape hatch, but current defences of it are weaker than the standard EV framework.

  ### Least Confident Term

  I am least confident in **whether the self-referential case is distinct (0.50)**.

  **What would move it:** A formal demonstration that adopting a decision rule based on its own EV calculation leads to logical inconsistency (vicious circularity) rather than mere reflective stability. If the 'button' scenario can be dissolved as a standard Newcomb-like problem, my credence would rise to 0.65; if it proves the rule self-undermines, it would drop to 0.35.
