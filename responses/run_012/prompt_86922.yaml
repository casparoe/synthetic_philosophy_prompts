  The thing making me wobble is a variant I don't think gets enough attention, which I'll call the self-referential button. Someone offers you a button. Press it, and with probability 10^-9 every future agent who ever faces a decision gets converted to using unbounded EV maximization; otherwise you get nothing. Don't press, and you get a sure £10,000 for a cause you already endorse. If unbounded EV max is the right rule, pressing has a colossal expected value, so you're required to press. But what you're buying by pressing is the adoption of the very rule that tells you to press. If the rule is wrong, the payoff is worth far less, and plausibly negative. The calculation's inputs are hostage to its own conclusion, which is either a lovely illustration of why fanaticism is right or a sign that the whole framework is circular — I honestly can't tell which.

  So give me a number, and break it into the sub-questions you think it rests on, with a rough probability and one line each. I'd expect at least: whether value is bounded in the relevant sense (and if it is, whether fanaticism even survives); whether the right theory of rationality is procedural — representation theorems and all that — so that "rationally required" gets settled structurally, or substantive, so fanaticism can be condemned on other grounds; whether very small probabilities should be treated as literally zero, or there's some principled floor; whether our aversion to these bets is a trustworthy intuition or just a bias from a world where we never actually meet them; whether the self-referential case is structurally different from an ordinary mugging or the same problem in a hat; and whether the tiny probability being a genuine chance rather than a subjective estimate about the deep structure of the world makes any difference. Then combine them, give me the final number, and tell me which term you're least confident in and what would move it most.

  Two things. Write it in British English. And if I've framed this so badly that there isn't a well-formed question here — say, if "rationally required" is doing no work and you'd rather dissolve the puzzle than answer it — say so plainly instead of humoring me with a number. I'd rather be told the question is confused than get a polite 0.5.
