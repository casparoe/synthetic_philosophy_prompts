answer: |-
  You have identified a precise and persistent rhetorical structure that sits at the fault line between **animal welfare ethics** (focused on individual sentient experience) and **holistic environmental ethics** (focused on systems, species, and ecosystems).

  The established concept closest to the *belief* underlying this move is the **Laissez-Faire Intuition (LFI)**. Coined and analyzed by philosophers like Oscar Horta, the LFI is the pre-theoretical conviction that humans ought not to interfere in nature, even to prevent severe suffering. However, the LFI names the *conclusion* ("do not intervene"), not the *argumentative maneuver* you are describing. The maneuver is the defensive rationalization used to protect the LFI when it is challenged by the consistency demands of moral reasoning.

  None of the standard labels you listed capture the *shape* of the move in its entirety.
  *   **Doing/Allowing:** Fails because it doesn't explain why the "allowing" of starvation is permissible while the "allowing" of extinction (via inaction) is not.
  *   **Status Quo Bias:** Fails because, as you note, the "status quo" is fluid. It is sometimes the current state (don't save the fawn) and sometimes a historical state (erase the invasive rat).
  *   **Appeal to Nature:** Fails because the objection is often not that nature is *good*, but that humans are *epistemically limited* or *morally unqualified*.
  *   **Precautionary Principle:** Fails because it is applied selectively. We are "precautionary" about helping prey, but not about eradicating predators or modifying genomes for conservation.

  Because no single existing term captures the *combination* of the agent-shift, the selective humility, and the moving baseline, I propose we name this phenomenon **Agential Asymmetry**.

  ### Proposed Term: Agential Asymmetry

  **Definition:**
  **Agential Asymmetry** is a rhetorical and normative pattern in environmental ethics wherein constraints on human agency (epistemic, moral, or practical) are invoked selectively to prohibit interventions that benefit wild individuals, while being suspended for interventions that benefit ecological states, species, or human interests.

  It is characterized by a shift in the locus of moral concern from the **patient** (the suffering animal) to the **agent** (the human intervener), coupled with a fluid definition of the **baseline** (the "natural" state) that adjusts to license the preferred verdict.

  ### The Shape of the Thing

  The structure of Agential Asymmetry rests on three pillars, corresponding to the features you identified:

  1.  **The Agent-Shift (Deflection):**
      *   *Standard Moral Reasoning:* Is the outcome good? (Focus on Patient)
      *   *Agential Asymmetry:* Are we the right ones to do it? (Focus on Agent)
      *   *Function:* This moves the goalposts from *axiology* (value of the outcome) to *deontology* (duty/standing of the actor). It renders the animal's suffering morally secondary to the human's "purity" or "humility."

  2.  **Selective Epistemic Humility (The Variable Constraint):**
      *   *Mechanism:* Uncertainty is treated as a hard constraint when the goal is welfare (e.g., "We can't know the ecosystem consequences of stopping predation"), but as a manageable risk when the goal is conservation (e.g., "We should release gene drives despite unknown long-term effects").
      *   *Function:* This insulates the position from empirical counter-arguments. If you prove we *can* intervene safely, the goalpost moves to "we *shouldn't*." If you prove we *should*, the goalpost moves to "we *can't*."

  3.  **Baseline Opportunism (The Moving Target):**
      *   *Mechanism:* The "natural" baseline is defined as **Current State** when arguing against welfare interventions (preservation), but as **Historical State** when arguing for conservation interventions (restoration).
      *   *Function:* This allows the interlocutor to claim they are "protecting nature" in both cases, even though "nature" refers to two mutually exclusive temporal snapshots.

  ### Boundaries and Exclusions

  To ensure this term is useful, we must mark its boundaries against similar phenomena:

  *   **What it Covers:**
      *   Arguments against vaccinating wild animals vs. arguments for vaccinating endangered species.
      *   Arguments against feeding starving wildlife vs. arguments for supplemental feeding in conservation management.
      *   Arguments against intervening in predation vs. arguments for culling predators to protect livestock or biodiversity.
  *   **What it Excludes:**
      *   **Resource Scarcity:** If the interlocutor argues, "We should help, but we lack the money/tech," this is not Agential Asymmetry. This is a practical constraint applied evenly. Agential Asymmetry requires the constraint to be *normative* or *epistemic* and *selective*.
      *   **Consistent Non-Interventionism:** If someone argues, "We should not save the fawn, and we should also not eradicate the rats; let nature take its course completely," they are being consistent (likely a deep ecologist). Agential Asymmetry requires the *inconsistency* between welfare and conservation contexts.
      *   **Consistent Interventionism:** If someone argues, "We should manage all nature for maximum welfare," they are not exhibiting this asymmetry.

  ### Answers to Your Specific Questions

  **1. Does it require that action be genuinely available?**
  Yes. Agential Asymmetry is a *justification for inaction* in the face of *possible action*. If action is genuinely impossible (e.g., we physically cannot reach the fawn), the move is unnecessary. The phenomenon relies on the tension between *capacity* and *permission*. It describes the process of constructing a "permission denied" sign where a "capacity confirmed" sign already exists. However, it can also describe the case of someone who declines to think about availability (willful ignorance) because acknowledging availability would trigger the need for a justification they cannot consistently provide.

  **2. Is the assumption that the natural state carries moral weight part of the phenomenon?**
  Yes, it is the engine of the phenomenon, but specifically as a **variable** rather than a constant.
  If the "natural state" carried a fixed moral weight, the baseline would not move. The phenomenon *depends* on the moral weight of "nature" being high, but the *definition* of "nature" being flexible.
  *   When welfare is at stake: Nature = **Process** (Don't stop the storm).
  *   When conservation is at stake: Nature = **Product** (Restore the forest to 1492).
  The moral weight of "the natural" is what licenses the verdict, but the malleability of "the natural" is what allows the verdict to remain constant despite changing contexts. Therefore, the assumption of moral weight is intrinsic to the phenomenon, but the *instability* of that weight's definition is the critical feature.

  ### Summary
  You are observing **Agential Asymmetry**. It is the strategic deployment of constraints on human agency to preserve a preferred moral boundary around "the wild." It allows the interlocutor to maintain the self-image of a humble steward (when conservation is involved) and a humble observer (when welfare is involved), without ever having to reconcile the suffering that occurs between those two roles. It is not merely a bias; it is a structural defense mechanism for the **Laissez-Faire Intuition**.
