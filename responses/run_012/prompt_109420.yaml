answer: |-
  There is no single canonical term in policy ethics or criminology that isolates this specific evaluative error. The phenomenon sits at the intersection of three established concepts, none of which capture the whole shape you describe:

  1.  **Reclassification Artifact (or Classification Shift):** In epidemiology and statistics, this describes data changes caused by altering definitions rather than underlying reality. It captures the *mechanical* error but lacks the *normative* and *rhetorical* dimension (the fact that both sides weaponize the same obsolete number).
  2.  **Net-Widening:** This describes the *sociological outcome* where diversion programs capture individuals who would otherwise have been ignored. It identifies the expansion of control but does not name the *evaluative blind spot* that allows the expansion to be misread as reduction.
  3.  **Incommensurability:** In philosophy of science (Kuhn), this describes paradigms that lack a common measure. This captures your philosophical core ("normative vocabulary... stays put") but is too abstract for the policy mechanism.

  The closest existing phrase is **"Measurement Artifact,"** but that is a technical diagnosis, not a name for the policy pattern. Because the pattern requires the *persistence* of the old scoreboard despite the *replacement* of the machinery, I propose the term **Metric Inertia**.

  ### Definition and Boundary
  **Metric Inertia** is the persistence of pre-reform evaluation metrics after a policy intervention has fundamentally altered the operational ontology of the system, rendering longitudinal comparisons invalid while allowing the obsolete metric to anchor competing narratives.

  It adds to **Net-Widening** by shifting focus from the *scope of control* (how many people are caught) to the *epistemology of assessment* (how we know if it worked). Net-widening says "more people are in the system." Metric Inertia says "we are still counting using the old system's rules, so we cannot see the new total."

  It adds to **Goodhart's Law** by removing the element of gaming. Goodhart's Law requires agents to distort behavior to optimize the metric. Metric Inertia occurs even when no one is cheating; the metric simply ceases to map to the reality it purported to measure because the reality has been redefined.

  ### Edge Cases
  (i) **Genuine Shrinkage:** Yes, it still counts as Metric Inertia. Even if the drug use actually declined, the *attribution* remains flawed because the metric no longer isolates the variable it claims to measure. The evaluation is epistemically broken even if the outcome is normatively good.
  (ii) **Deletion Without Migration:** No. If the reform simply deletes the old machinery without creating a new ledger (e.g., total repeal with no administrative follow-up), there is no "shadow system" to ignore. Metric Inertia requires a *displacement* of the activity into a new, unmeasured (or differently measured) container while the old meter keeps spinning.
  (iii) **Relocation vs. Inertia:** The essential ingredient is the **Inertia**. Relocation is the mechanism that makes the inertia visible, but the error lies in the scoreboard's refusal to update. If the scoreboard updated but the activity relocated, you would have accurate data on a failure. If the scoreboard stays static but activity doesn't relocate, you have accurate data on success. The phenomenon only exists when the scoreboard stays static *while* the activity relocates.

  ### Philosophical Shape
  You asked about the normative vocabulary. This is a form of **Normative Lag**. When a practice changes (decriminalization) but the vocabulary of judgment remains (arrest rates as proxy for social harm), the vocabulary becomes a **Zombie Concept**: it retains the grammatical form of a measure but lacks the ontological substance to refer to anything real. The "old ledger" persists not because it is useful, but because it is the only shared language available to both camps, allowing them to talk past one another while appearing to debate the same data.

  \answer{none — Metric Inertia}
