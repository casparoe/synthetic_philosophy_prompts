  3. Ask yourself if disagreeing with the majority opinion costs a member their standing in the conversation, whereas in an Information Deficit you can be wrong and lose nothing. If dissenters are being socially punished rather than corrected, this is no longer about facts and requires mod intervention beyond sourcing.

  4. Determine if the group has a ready-made story about why the opposing side would lie, such as installers wanting commissions or utilities wanting to drain funds, which makes dumping more facts useless or harmful. This step misfires if the corruption is real, so treat confirmed fraud as an exception where Trust Deficit is actually rational.

  5. If steps 1-3 point to Information Deficit, leave it alone or post sources; if they point to Trust Deficit, lock the thread and ping the other two mods and the owner instead of to me because this is a values question about who we want in the server. Acknowledge this step is a judgment call wearing a lab coat because the line between skepticism and dogma is often blurry.
