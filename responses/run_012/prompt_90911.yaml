answer: |-
  You are wrestling with the difference between a **gap** and a **lie**.

  Here is the principle that ties your cases together:

  ### The Principle of Marked Absence

  A silence in a record is a moral wrong when the record implies completeness but fails to **mark the boundary of its own blindness.**

  If a record claims to be a list, a log, or a history, it enters a contract with the future. It says, "This is what was here." If something is missing, the record-keeper has a duty to annotate that absence. If they do not, they are not just leaving a gap; they are actively misleading anyone who comes after.

  **Who is the wrong against?**
  It is not against the people who were excluded (they are often gone or powerless). It is a wrong against **the Future**. It is a betrayal of trust between the keeper of the record and the person who will one day need to rely on it. You are punishing the researcher who will assume your website is the whole churchyard, or the great-grandchild who will assume the factory log proves their grandmother was never injured.

  ### How this applies to your cases

  *   **Nan's Diary:** **Not a wrong.** A diary makes no claim to completeness. It is a subjective slice of a life. There is no contract with the future, only a conversation with the self.
  *   **Poorhouse Register:** **Wrong.** The columns promised data (birthplace, family). The silence was unmarked. It turned a person into a label.
  *   **Factory Accident Book:** **Wrong.** The book claimed to record accidents. It excluded a whole department without a note. It lied about safety.
  *   **Burial Book:** **Wrong.** The book claimed to record burials. The dash implied "nothing to record" rather than "excluded by doctrine."
  *   **Hospice Volunteer:** **Wrong (and severe).** The notebook claimed to be a history. By omitting the prison years without a note (e.g., "Subject requested omission"), she turned a historical document into a eulogy.
  *   **Uncle's Tapes:** **Wrong.** The collection claimed to be "the elders." It was "the men." The absence of women was unmarked.
  *   **Cemetery Website:** **Wrong.** You presented a selection as a survey. You failed to mark the boundary of your own legibility.

  ### Why the Hospice case bothers you most
  You noted a contradiction: you called the Factory book "the worst of the lot," but then said the Hospice omission feels "worse than the factory book."

  The Principle of Marked Absence resolves this. The Factory book was a sin of **negligence** (nobody decided, the system just failed). The Hospice notebook was a sin of **commission** (a conscious choice to hide truth).

  In archiving, a conscious lie is a deeper corruption than a structural blind spot. The Factory book is a broken tool; the Hospice notebook is a forged one. That is why your gut screams louder at the Hospice case, even if the Factory case caused more material harm.

  ### The Counter-Intuitive Case
  Here is a case where your gut might say "Wrong," but the Principle says "Right."

  **The Burned Ledger:** Imagine a village in 1940. The local historian knows an occupying army is coming to conscript young men. He holds the only census ledger that lists every male of age. He burns it. The history of those families' demographics is lost forever.

  *   **Your Gut:** This is a tragedy. A silence has been created. History is destroyed.
  *   **The Principle:** This is **not a wrong.** The record was not claiming completeness to the future; it was claiming utility to the present. When the survival of the community conflicts with the integrity of the archive, the archive must yield. The silence here is *marked* by the context of war. It is a protective silence, not a deceptive one. It does not betray the future; it ensures there *is* a future to read the records.

  ### The Verdict You Must Throw Out

  To keep your ethics consistent, you must throw out your verdict on the **Factory Accident Book**.

  You called it "the worst of the lot." It cannot be.
  If the Principle is **Marked Absence**, the **Hospice Volunteer** is the greater offender. She knew the truth and hid it. The Factory clerks didn't even know the women existed in their blind spot.

  If the Principle is **Harm to the Excluded**, the **Poorhouse** is the greater offender. They stripped a human of their name and kin while they were still alive.

  You cannot have the Factory be the "worst" on both counts. It was systemic negligence, which is terrible, but it lacks the *malice* of the Poorhouse and the *deceit* of the Hospice.

  You are a historian. Your primary duty is to the Truth, not to the Comfort of the Subject (Hospice) or the Indifference of the System (Factory). Therefore, you must admit that the **Hospice Volunteer** committed the worst archival sin, because she knew exactly what she was doing, and she did it anyway. The Factory was asleep; she was awake.

  **The Rule:** You may leave a silence, but you must never let the future believe the silence isn't there. Mark the gap, or you become the eraser.
