      *   *Mutation as Crane:* A mutation is a mechanism. But if it creates a complex function *ex nihilo* without selection pressure or intermediate utility, it functions like a skyhook in the *explanatory* sense.
      *   *Greedy Reductionism:* Is it an insult? It's a warning against explaining a high-level phenomenon solely by low-level parts *without acknowledging the emergent properties*. Tom claims the gradualist ignores the unique nature of syntax.
