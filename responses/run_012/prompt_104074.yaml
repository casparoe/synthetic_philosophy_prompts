          *   The nature of the "mutation" (is it a crane or a skyhook?).
          *   Top-down vs. Bottom-up explanations.
          *   Plausible stages of language evolution (if gradualist).
      *   **Tone:** Sharp, intellectual, respectful but contentious, no strawmen. Both sides need to land good hits.
