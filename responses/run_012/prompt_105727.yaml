  ### Taxonomy of Historical Explanation

  **1. Root: Must an explanation invoke a general regularity at all?**
  *   **Yes (Law-Governed):** Go to Node 2.
  *   **No (Particularist):** Go to Node 3.

  **2. Node (Law-Governed): Is the explanation fundamentally contrastive ("Why X rather than Y")?**
  *   **No (Absolute):** **Leaf A: Strict Covering Law.**
      *   *Awkward Commitment:* History is just unfinished physics, and every unique event is merely a data point waiting for a law we haven't found yet.
  *   **Yes (Pragmatic):** **Leaf B: Probabilistic Covering Law.**
      *   *Awkward Commitment:* We explain events by showing they were likely, which paradoxically fails to explain the surprising turning points that actually matter.

  **3. Node (Particularist): Is the logic of explanation context-dependent (Pluralism)?**
  *   **Yes (Variable):** **Leaf C: Explanatory Pluralism.**
      *   *Awkward Commitment:* We never know if we've found the *right* kind of explanation, only a useful one for the current question.
  *   **No (Fixed):** Go to Node 4.

  **4. Node (Fixed Particular): Is the *explanandum* a bare occurrence or a significance?**
  *   **Bare Occurrence:** **Leaf D: Causal Mechanism.**
      *   *Awkward Commitment:* We can identify the causes that produced an event without being able to say why those causes mattered more than others.
  *   **Significance:** Go to Node 5.

  **5. Node (Significance): Does explanation depend on information available only later (Retrospection)?**
  *   **No (Contemporary):** **Leaf E: Deflationary Chronicle.**
      *   *Awkward Commitment:* Historians just arrange facts; the "explanation" is entirely in the reader's head, not the text.
  *   **Yes (Retrospective):** **Leaf F: Narrative Explanation.**
      *   *Awkward Commitment:* The ending of the story determines the cause of the beginning, making the explanation logically dependent on the future.

  ***

  **Indistinguishable Pair Flag:** **Leaf E (Deflationary)** and **Leaf F (Narrative)** are often indistinguishable in practice, as both rely on the selection and arrangement of events rather than independent causal verification; the tree separates them only by whether the historian *claims* the arrangement constitutes an explanation or merely a description.
