      *   *Actually, let's go with the User's "Rewrite Rule" idea but make it strict.*
      *   **Round 1:** Fixed Policy. Environment tries to loop you.
      *   **Round 2:** You get a "Meta-Rule" (If Loop Detected, Change Policy). Environment gets a "Meta-Move" (Corrupt the Detection).
      *   *Materials:* Grid sheets, pens, timer.

  6.  **Addressing Failure Modes:**
