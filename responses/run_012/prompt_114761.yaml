      *   *Selection:* **Candidate 1 (The Grid Robot)** is the best fit, but it needs refinement to ensure the "Environment" player has clear constraints too, otherwise it feels like cheating. The "rewrite" mechanic needs to be very tight to avoid "I change my rule to 'win'" loopholes.

  4.  **Refining the Chosen Structure (The "Bug in the Box" Game):**
      *   *Simplification:* Instead of a large grid, use a linear track or a very small 3x3 grid. Let's go with a **5x5 Grid**. It's small enough to draw quickly, big enough to have space.
