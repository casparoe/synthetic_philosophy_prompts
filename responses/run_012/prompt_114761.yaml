          *   **Role 2 (World):** Places one "Prize." Can move the Prize *only* when Agent is in the "Doorway" square.
          *   **Round 1:** Agent tries to get Prize. World moves Prize to force loop.
          *   **Round 2:** Agent can add 1 "Memory" rule. World can now move Prize when Agent is *anywhere* but must pay a cost.
          *   **Round 3:** Agent can change the World's cost rule. World can... (This gets too complex).
