      *   *Grid Exploits:* "I'll just say the grid is infinite." -> Define boundaries clearly.
      *   *Cynicism:* "This is rigged." -> Acknowledge it in debrief (that's the point).
      *   *Odd Numbers:* Trios (Agent, World, Observer).

  7.  **Debrief Strategy:**
      *   Connect the frustration to the Wasp story.
      *   Connect the "Meta-Rule" failure to the regress problem (Gödel/Goodhart).
      *   Free Will: The game *can't* solve free will, but it shows why "just be flexible" isn't a solution unless you define where the flexibility comes from.

  8.  **Timeline:**
      *   0-10: Intro & Setup (No Sphex mention).
