answer: |-
  # Session Plan: The Problem of the Wrong Kind of Reasons

  **Duration:** 75 Minutes
  **Participants:** 8–9 (Philosophy Graduates + Visitors)
  **Prerequisites:** None

  ## I. The Carrying Example: Specifications
  **The Case:** The Junior Editor (as provided in the prompt).
  **What It Must Have:**
  1.  **High Stakes:** The promotion is vital and unavailable elsewhere (ensures the reason is weighty).
  2.  **Sincerity Condition:** The promotion depends on *regarding* the novel as meritorious, not merely asserting it (ensures the target is an attitude, not an action).
  3.  **Epistemic Ambiguity:** The novel is competent but unremarkable; she cannot confidently judge it true or false (ensures the reason is not evidence-based).
  4.  **Psychological Possibility:** It must be plausible she could come to hold the view via selective exposure (prevents dismissal based on "you can't believe at will").

  **What It Must Lack:**
  1.  **Obvious Falsity:** She cannot *know* the novel is bad (prevents the reason from being obviously overridden by evidence).
  2.  **Coercion of Action Only:** The threat cannot be merely to fire her if she *says* it is good (prevents conflating practical reasons for action with reasons for attitude).

  ## II. Session Sequence and Dependencies

  ### 1. Introduction and Case Presentation (0:00–0:15)
  **Activity:** Present the Junior Editor case verbally. Ask two questions: (1) Does she have a reason to value the novel? (2) Does this reason make the novel valuable?
  **Dependency:** This establishes the raw intuition that there is *a* reason, but it feels distinct from evidence-based reasons. Everything else depends on securing the intuition that the reason exists but feels "off."
  **Misconception Check (0:10):** Participants may claim, "She can't sincerely believe it; belief isn't voluntary."
  **Intervention:** Head this off immediately by stipulating the psychological mechanism: she can read sympathetically and avoid critics until the belief forms naturally. Emphasize the case is about the *normative status* of the reason, not the psychological mechanics of belief formation.

  ### 2. The Subtraction Sequence: Contrast Cases (0:15–0:30)
  **Activity:** Run three variations of the Editor case, stripping away one feature at a time to isolate the source of the normative pressure.
  **Dependency:** This depends on the Main Case being accepted. You cannot isolate what makes a reason the "wrong kind" until the group agrees there is a reason present in the main case that differs from standard evidence.

  *   **Variation A (Remove Stakes):** She gets no promotion. She just reads the book.
      *   *Goal:* Shows the pragmatic reason disappears when the benefit is removed.
  *   **Variation B (Remove Attitude Requirement):** She gets the promotion if she *writes a report* saying it is good, regardless of belief.
      *   *Goal:* Shows the reason becomes a standard practical reason for action. This isolates that the problem is specific to *attitudes* (belief/valuation).
  *   **Variation C (Remove Ambiguity):** The novel is objectively terrible (everyone agrees).
      *   *Goal:* Shows that even with overwhelming evidence against the attitude, the pragmatic reason persists. This highlights the conflict between evidence (right kind) and incentive (wrong kind).

  **Misconception Check (0:25):** Participants may say, "In Variation C, the reason disappears because it's irrational."
  **Intervention:** Clarify that the *incentive* remains (she still gets the promotion), but it clashes with evidence. The question is whether the incentive counts as a reason *for the attitude* or merely a reason to *want* the attitude.

  ### 3. The "Reason to Want" Reply (0:30–0:45)
  **Activity:** Introduce the standard philosophical reply: "The promotion is not a reason to value the novel; it is a reason to *want* to value it (or to bring it about that you value it)."
  **Dependency:** This depends on the Subtraction Sequence. Having seen that the reason persists even when evidence is absent (Variation C), the group is ready to categorize the reason. This step attempts to save the link between value and reasons by reclassifying the incentive.
  **Misconception Check (0:35):** Participants may argue, "If it's a reason to want it, it's not a reason at all."
  **Intervention:** Accept that it is a genuine normative reason (practical), but insist on the distinction: reasons *for* an attitude vs. reasons *to have* an attitude. Use the analogy of a gun to your head: you have a reason to want to believe the demon exists, but not a reason that makes the belief true/fitting.

  ### 4. The Altruistic Variant (0:45–0:55)
  **Activity:** Modify the Main Case. The promotion depends on valuing the novel not for her sake, but because the author is her struggling mentor who will be devastated if she doesn't value it.
  **Dependency:** This depends on the "Reason to Want" discussion. Once the group accepts that pragmatic reasons are the issue, they often assume "pragmatic" equals "selfish." This variant tests that assumption.
  **Misconception Check (0:50):** Participants may say, "Now it's okay because it's altruistic."
  **Intervention:** Head this off explicitly. Ask: "Does the mentor's need make the novel *literarily better*?" If no, then the reason is still the wrong kind, proving WKRP is not about selfishness vs. altruism, but about the *object* of the reason (the attitude's correctness vs. the consequences of having it).

  ### 5. Connection to Fittingness and Value (0:55–1:05)
  **Activity:** Connect the distinction to the thesis: "Something is good just in case it is fitting to value it."
  **Dependency:** This depends on all previous steps. The group must now see that if we define "good" as "what there is reason to value," the Editor case breaks the definition. The editor has reason to value the novel, but the novel isn't thereby good.
  **Goal:** Show that WKRP threatens the Fitting Attitude Analysis of value. If "reasons to value" include promotions, then "good" becomes contaminated by pragmatic incentives. The distinction between Right and Wrong Kind reasons is necessary to save the definition of value.

  ### 6. Closing Check and Unsettled Questions (1:05–1:15)
  **Activity:** Administer the diagnostic check and list the off-limit questions.

  **The Closing Check:**
  Do not ask: "What is the Wrong Kind of Reasons problem?"
  **Ask:** "Return to the Editor Case. If we define 'literary merit' as 'that which there is most reason to value,' does the novel have literary merit in this scenario? Explain why your answer preserves the difference between a bribe and a good book."
  *   *Success Indicator:* They answer "No" (or "Not necessarily") and justify it by distinguishing between reasons tracking merit (evidence/quality) and reasons tracking consequences (promotion), noting that the definition of merit must exclude the latter.
  *   *Failure Indicator:* They answer "Yes, because she has a reason," or they cannot articulate why the promotion doesn't count toward "merit."

  **Questions to Explicitly Decline:**
  Write these on the board to prevent the session from stalling on advanced meta-ethics:
  1.  **The Formal Definition:** "We will not settle whether the distinction is based on the *object* of the reason or the *scope* of the reason today." (Too technical for intro).
  2.  **The Metaphysics of Value:** "We will not decide whether value is real or constructed." (Beyond scope).
  3.  **The Solution:** "We will not determine whether the Fitting Attitude Analysis can be saved or must be abandoned." (This session diagnoses the problem; solving it requires further work).

  ## III. Rationale for Sequence Dependencies

  1.  **Case Before Contrasts:** You cannot strip features away (Subtraction Sequence) until the participants agree on what the original feature set is (Main Case).
  2.  **Contrasts Before Classification:** You cannot classify the reason as "Wrong Kind" until you have isolated it from evidence-based reasons (Variation C) and action-based reasons (Variation B).
  3.  **Classification Before Altruism:** You cannot show that WKRP is not about selfishness until the group accepts that pragmatic incentives are the problematic category (Classification).
  4.  **All Before Fittingness:** You cannot demonstrate the threat to the Fitting Attitude Analysis until the group understands that WKRP creates a gap between "reason to value" and "value itself."

  ## IV. Instructor Notes on Flow

  *   **Pacing:** Keep the Main Case discussion tight. If participants get bogged down in publishing industry details, remind them the stakes are philosophical, not professional.
  *   **Tone:** Maintain neutrality. Do not confirm whether the novel is good or bad; keep the focus on the *reasons* available to the editor.
  *   **Visitors:** Law and Cognitive Science participants may focus on the psychological feasibility of the belief change. Gently redirect them to the normative question: "Even if she *can* believe it, *ought* she to believe it based on this reason?"
