  The birds function as genuine free-floating rationales rather than hiding a secret reasoner, though the film's terror depends on our refusal to believe such complex coordination could exist without a mind behind it.

  Dennett's concept fits because the birds exhibit optimized behavior—waiting, massing, targeting—that serves a function without requiring conscious intent. The schoolhouse scene lights this up: the birds fill the jungle gym silently, creating a tactical ambush point without a general issuing orders. This is evolution-style logic in real-time; the "reason" (ambush) exists in the formation, not in a bird's head.

  However, the analogy strains when different species cooperate simultaneously, exceeding biological plausibility for instinctual shifts. Here the film pushes back: the coordination feels too immediate for natural selection, tempting us to posit a hidden reasoner (nature's revenge, Melanie's psyche). Hitchcock refuses this comfort. The film doesn't secretly need a reasoner; it needs the void. The horror isn't that something wants us dead, but that death is coming with no one to blame.
