answer: |-
  This is a fantastic project choice. Bongard Problems (BPs) sit right at the edge of what's possible for a high school semester: they look simple, but they touch on the hardest unsolved problems in AI (concept learning, few-shot reasoning, and symbol grounding).

  Given your constraints (offline, limited compute, one semester), you cannot brute-force this with deep learning. You don't have the GPU power, and you can't download pre-trained weights. You also can't rely on massive datasets.

  You need a **Symbolic Approach**. You aren't building an eye; you're building a logic engine that talks about shapes.

  Here is the order in which you should tackle your questions, based on **dependency** (what must work before the next thing can exist) and **risk** (what is most likely to kill your project if you start there).

  ### 1. The First Hurdle: "Can you ever know you got the right rule?"
  **Priority:** Immediate / Foundational
  **Why:** This is the "Ground Truth" problem. If your program finds a rule that fits all 12 images, how do you know it's the *intended* rule and not a coincidence? (e.g., The rule is "triangles," but your program guesses "images containing an even number of pixels.")

  **Reasoning:**
  You cannot build a solver until you have a way to grade it. In a normal science fair project, you have a dataset with labels. In BPs, the "label" is a natural language sentence. Since you can't download a dataset, **you must build a Bongard Generator first.**

  You need to write a script that *creates* BPs where you know the rule because you wrote it.
  *   *Step:* Code a system that draws shapes.
  *   *Step:* Code a rule (e.g., `count(shapes) > 3`).
  *   *Step:* Generate 6 images that satisfy the rule and 6 that violate it.
  *   *Step:* Feed these to your solver.

  **Why this is upstream:** If you can't verify your solver against rules you created yourself, you have no metrics for success. You will spend months tweaking an algorithm with no way to measure if it's getting better.

  **Trigger to Reorder:** If you find generating the images is too hard (graphics libraries are tricky on locked-down laptops), pivot to **Text-Based Bongards**. Instead of pictures, use lists of properties (e.g., Left: `[red, circle, small]`, Right: `[blue, square, large]`). This removes the computer vision bottleneck and lets you focus on the logic, which is the heart of your question.

  ### 2. The Second Hurdle: "Are the bad examples doing all the work?"
  **Priority:** High / Algorithmic Core
  **Why:** This is about **Information Gain**. A rule that fits the Left side (e.g., "contains a circle") might also accidentally fit the Right side. The Right side's job is to *kill* false hypotheses.

  **Reasoning:**
  Once you have your Generator (from Step 1), you can test this empirically.
  *   Run your solver using *only* the Left images. What rules does it propose?
  *   Run your solver using Left + Right images.
  *   Compare the search space.

  You will likely find that the Left side suggests 1,000 possibilities, and the Right side eliminates 999 of them. This is a concrete, data-driven finding for your science fair. It moves the project from "I made a guesser" to "I analyzed how contrast drives learning."

  **Why this is upstream:** Your search algorithm depends on this. If negatives are crucial, your code shouldn't just look for patterns in the Left; it should actively look for *differences* between Left and Right. This changes your code from "Pattern Match" to "Difference Detection."

  ### 3. The Third Hurdle: "What to do when the rule is about what's missing?"
  **Priority:** Medium / Representation
  **Why:** This is the **Negation** problem. "Contains a triangle" is easy to code. "Does *not* contain a triangle" is harder because the absence of something isn't an object you can point to.

  **Reasoning:**
  This depends entirely on how you represent the images (your "vocabulary").
  *   If your vocabulary is just a list of objects present (`[circle, square]`), you can't express absence easily.
  *   If your vocabulary includes properties (`[has_circle: True, has_triangle: False]`), negation is built-in.

  Tackle this only after you have a working solver for positive rules. If you try to handle negation too early, your search space doubles (every feature can be true or false), and your program will slow to a crawl on a school laptop.

  **Trigger to Reorder:** If your solver keeps failing on simple BPs like "Left has circles, Right has no circles," you must stop and fix your representation before moving on. You cannot solve compositionality if you can't solve negation.

  ### 4. The Fourth Hurdle: "What if the real rule is two rules glued together?"
  **Priority:** Low / Complexity
  **Why:** This is **Compositionality**. "Triangles AND red" is exponentially harder than "Triangles."

  **Reasoning:**
  In a one-semester project, this is the trap that eats time. If your system allows rules to be combined (Rule A + Rule B), the number of possible hypotheses explodes.
  *   Start with **Atomic Rules** only (single concepts).
  *   See how many BPs you can solve with just atomic rules.
  *   If you have time left, add *one* layer of composition (e.g., allow `AND` but not `OR`).

  **Why this is last:** It is an optimization problem. It's better to have a program that perfectly solves 10 simple BPs than a program that crashes trying to solve 100 complex ones. Science fair judges prefer a working, limited model over a broken, ambitious one.

  ### 5. The Philosophical Hurdle: "Whose concept is it anyway?"
  **Priority:** Discussion / Conclusion
  **Why:** This is the **Occam's Razor** problem. If the Left side has large red triangles and the Right side has small blue circles, is the rule "Color"? "Shape"? "Size"? All fit.

  **Reasoning:**
  You cannot code a solution to this directly because it requires human context. However, you can code a **Complexity Penalty**.
  *   Assign a "cost" to every rule.
  *   "Has Triangle" = Cost 1.
  *   "Has Triangle AND Is Red" = Cost 2.
  *   When multiple rules fit, pick the cheapest one.

  **Why this is last:** This is how you interpret your results, not how you build the engine. You use this to explain *why* your program picked one rule over another in your final report. It turns a bug (ambiguity) into a feature (preference for simplicity).

  ### Summary of the Workflow

  1.  **Build the Generator (Weeks 1-4):** Don't solve BPs yet. Make a program that *creates* solvable BPs with known rules. This is your test harness.
  2.  **Build the Solver for Atomic Positive Rules (Weeks 5-8):** Can it find "Has Triangles"? Use your Generator to grade it.
  3.  **Analyze the Negatives (Weeks 9-12):** Turn off the Right-side images in your tests. Measure how performance drops. This answers your "bad examples" question with data.
  4.  **Expand Vocabulary (Weeks 13-16):** Add negation ("No Triangles") and simple composition ("Triangles AND Red").
  5.  **Write Up:** Use the "Complexity Penalty" to explain ambiguous cases.

  ### A Warning on "No Internet"
  Since you cannot look up libraries during the day, you need to know your tools now.
  *   **Language:** Python is your best friend. It comes with `turtle` or `tkinter` for drawing shapes without installing anything.
  *   **Data:** Do not try to process actual image files (`.png`, `.jpg`). That requires OpenCV or PIL, which might not be installed, and image processing is a rabbit hole.
  *   **Recommendation:** Represent images as **lists of dictionaries**.
      *   *Example:* `[{'shape': 'circle', 'color': 'red', 'size': 10}, {'shape': 'square', 'color': 'blue', 'size': 5}]`
      *   This lets you focus entirely on the *logic* questions you asked, rather than fighting with pixel arrays. You can argue that "Visual Perception" is a separate module that you are simulating.

  ### Final Thought
  The most impressive thing you can show a judge isn't a program that solves 100 BPs. It's a program that **fails in an interesting way.**

  If your program consistently fails on "Absence" rules, or consistently picks the complex rule over the simple one, that is a *result*. That is science. Don't hide the failures; structure your project to expose them. That answers your question about "what's worth my time." The value isn't in solving the puzzle; it's in mapping the boundary where your solver breaks.
