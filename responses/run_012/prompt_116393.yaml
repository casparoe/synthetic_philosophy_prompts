prompt: |-
  I'm a junior and my science fair project is a little program that has to guess the rule behind one of those Bongard cards (I think thats what there called) — six pictures on the left, six on the right, and you have to work out what makes the left ones left. Nobody tells you the rule, you just get the examples.

  I've got one semester, a school laptop, no internet in the building and no budget. So out of all the open questions about pulling a concept out of just a handful of examples — whose concept is it anyway, whether the bad examples are doing all the work and the good ones are just decoration, whether you can ever know you got the right rule instead of one that happens to fit, what to do when the real rule is two rules glued together, or when the rule is about whats missing from a picture — which ones are most worth my time, and in what order? I want the reasoning more than the list: whats upstream of whats, which ones I could actually make progress on in a semester with a laptop, which ones would just eat my time, and what I might see that would make me reorder them. Dont send me to papers, I can't get them anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Constraints:**
      *   **User:** Junior in high school (approx. 16-17 years old).
      *   **Project:** A program to solve Bongard problems (BP).
      *   **Constraints:** One semester (approx. 4-5 months), school laptop (likely limited compute, maybe no admin rights for installing heavy libraries), no internet in the building (offline development/research), no budget.
      *   **Goal:** Wants to know *which* conceptual questions about BP solving are worth pursuing, in what order, and *why*.
      *   **Preference:** Reasoning over lists. No citations/papers (can't access them anyway).
      *   **Tone:** Intellectual, practical, encouraging but realistic.

  2.  **Deconstruct the Problem (Bongard Problems):**
      *   What is a BP? 12 images (6 positive, 6 negative). Find the rule distinguishing them.
      *   Why is it hard? It's about *concept learning*, *analogy*, *visual reasoning*, and *hypothesis testing* from very few examples (few-shot learning).
      *   What are the user's specific questions?
          *   Whose concept is it? (Subjectivity)
          *   Do negative examples do all the work? (Information theory)
          *   Can you ever know you got the *right* rule? (Overfitting/Underdetermination)
          *   What if the rule is composite? (Complexity)
          *   What if the rule is about absence? (Negation)

  3.  **Evaluate Feasibility (The "School Laptop" & "One Semester" Filter):**
      *   *Deep Learning/CNNs:* Probably too heavy, requires internet for pre-trained weights usually, hard to interpret.
      *   *Symbolic AI/Logic:* Much better fit. Bongard problems are inherently symbolic/logical once features are extracted.
      *   *Feature Extraction:* This is the bottleneck. How does the code "see" the image? (Edges, shapes, counts, colors).
      *   *Hypothesis Generation:* How does the code guess rules?
      *   *Verification:* How does the code check if the rule fits?

  4.  **Prioritize the Conceptual Questions:**

      *   *Question 1: Can you ever know you got the right rule? (The Overfitting Problem)*
          *   *Why first?* This is the core scientific method issue. If the program finds a rule that fits the 12 images but is nonsense, the project fails. This defines success criteria.
          *   *Feasibility:* High. Can be tested with simple logic.
          *   *Upstream:* Everything else depends on how you validate.

      *   *Question 2: Do negative examples do all the work? (The Role of Contrast)*
          *   *Why second?* BPs are defined by the *difference* between Left and Right. Understanding the information gain from negatives is crucial for the algorithm's search strategy.
          *   *Feasibility:* High. Can compare rules generated from positives only vs. positives + negatives.
          *   *Upstream:* Depends on validation (Q1).

      *   *Question 3: What if the rule is about absence? (Negation)*
          *   *Why third?* "No triangles" vs. "Triangles." This is a specific logical operator. It's a concrete implementation detail that follows from understanding contrast.
          *   *Feasibility:* Medium. Requires a representation that handles null sets.
          *   *Upstream:* Depends on how features are encoded.

      *   *Question 4: What if the rule is two rules glued together? (Compositionality)*
          *   *Why fourth?* This explodes complexity. "Triangles AND red" is harder than "Triangles." For a semester project, keeping it simple is key. Tackle this only if simple rules work.
          *   *Feasibility:* Low/Medium. Combinatorial explosion.
          *   *Upstream:* Needs a robust single-rule solver first.

      *   *Question 5: Whose concept is it anyway? (Subjectivity)*
          *   *Why last?* This is philosophical. While deep, it's hard to code. "Is it 'pointy' or 'triangles'?" For a high school project, ground truth is usually assumed to exist.
          *   *Feasibility:* Low. Hard to measure programmatically without human feedback loops.
          *   *Upstream:* Meta-analysis of results.

  5.  **Drafting the Advice (Iterative Refinement):**

      *   *Introduction:* Acknowledge the ambition. BPs are famously hard (Hofstadter, etc.). Validate that a symbolic approach is best for their constraints.
      *   *The "Upstream" Logic:* I need to explain *dependency*. You can't test compositionality if you can't validate a single rule. You can't validate a rule if you don't understand the role of negative examples.
      *   *Practical Implementation:* Since they have no internet, they need to generate their *own* BPs or use a small hardcoded set. They can't download a dataset. This is a crucial constraint I almost missed. *Correction:* They need to build a "BP Generator" to test their "BP Solver." This is a classic "test harness" approach.
      *   *The "School Laptop" aspect:* Keep it Python-based (standard libs), maybe `tkinter` for UI, no PyTorch/TensorFlow. Focus on geometry/logic.
      *   *Reordering Triggers:* What would make them switch tracks? If feature extraction is too hard, pivot to text-based BPs. If validation is impossible, pivot to human-in-the-loop.

  6.  **Refining the Reasoning (Self-Correction during drafting):**
      *   *Wait, "No Internet in the building":* Does this mean no internet at home? Usually, "school laptop" + "no internet in building" implies they can download at home but code at school. I should assume they can install libraries at home but need the code to run offline. However, to be safe, I should suggest standard libraries.
      *   *Actually, the prompt says "No internet in the building" and "School Laptop".* Often school laptops are locked down. I should assume minimal dependencies. Standard Python is safest.
      *   *Focus on the "Reasoning":* The user asked for "reasoning more than the list." I need to structure the response as a narrative of discovery, not just a checklist.
      *   *The "Whose concept" question:* This is actually about *Occam's Razor*. I should frame it that way. Simplest rule wins.

  7.  **Final Plan:**
      1.  **Validate the approach:** Symbolic AI > Neural Nets for this constraint set.
      2.  **Order of Operations:**
          *   Phase 1: Validation (The "Truth" Problem).
          *   Phase 2: Contrast (The "Negative" Problem).
          *   Phase 3: Representation (The "Absence" Problem).
          *   Phase 4: Complexity (The "Composite" Problem).
          *   (Skip/Minimize) Subjectivity.
      3.  **The "Secret Weapon":** Build a Generator first. You can't solve BPs if you can't make them to test against.
      4.  **Warning Signs:** When to pivot.

  8.  **Tone Check:** Keep it mentor-like. Respectful of their intelligence (they asked good questions) but grounding them in engineering reality.

  *(Self-Correction during final review)*: Make sure I explicitly address "whose concept is it." That's a deep question. I'll frame it as "Complexity Penalty" (Occam's Razor) which is codable.

