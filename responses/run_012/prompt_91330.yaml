answer: |-
  It is entirely understandable that you find this proverb frustrating in the mouth of a interlocutor who treats it as an axiom. In philosophical terms, your friend is committing a modal fallacy: treating a contingent claim about international relations as a necessary truth. The phrase *Si vis pacem, para bellum* is not a single proposition but a container for at least four distinct claims, ranging from the trivial to the empirically dubious. When your friend deploys it to end the discussion, they are relying on the ambiguity to borrow the certainty of the trivial reading to support the contentious one.

  Here is the menu of readings you requested, categorised by their logical status and argumentative weight.

  ### 1. The Prudential Truism
  **The Claim:** If you desire a specific outcome (peace), you must prepare for the specific threats that endanger that outcome (war).
  **Classification:** **Platitude.**
  **Analysis:** Read this way, the proverb is vacuous. It is logically equivalent to saying, "If you want health, prepare for illness" or "If you want fire safety, prepare for fire." It does not specify *how* one prepares. A pacifist could accept this by arguing that the best preparation for preventing war is robust diplomacy, economic interdependence, or non-violent resistance training.
  **Argumentative Work:** It does no work. It merely states that goals require planning. If your friend means this, they cannot object to unilateral disarmament if the disarmament is part of a *different* preparation strategy (e.g., preparing for trust-building).

  ### 2. The Causal Deterrence Thesis
  **The Claim:** Increasing military capability causally reduces the probability of aggression by others.
  **Classification:** **Contentious Thesis.**
  **Analysis:** This is an empirical claim about human psychology and state behaviour. It relies on the logic of deterrence: that potential aggressors are rational actors who will be dissuaded by the cost of conflict. However, it ignores the "security dilemma," wherein one state's preparation is perceived as a threat by another, prompting an arms race that *increases* the likelihood of war.
  **Argumentative Work:** This is the reading your friend likely wants to rely on, but it requires evidence. It is falsifiable. If historical data shows that heavily armed states are attacked as often as unarmed ones, this reading collapses. It cannot be asserted as an axiom.

  ### 3. The Constitutive Claim
  **The Claim:** A state of affairs maintained without the capacity for violence is not "peace" but merely "submission" or a "lull."
  **Classification:** **Contentious Thesis (Conceptual).**
  **Analysis:** This is the reading your friend invokes when they distinguish between "real peace" and the "absence of war." Here, 'peace' is defined not negatively (no shooting) but positively (a just order secured by the monopoly on force). On this view, force is constitutive of peace, much as a foundation is constitutive of a house.
  **Argumentative Work:** This is a definitional move. It attempts to make the pacifist position incoherent by definition: if peace *requires* the capacity for war, a pacifist cannot want peace. However, this begs the question. It assumes that order without threat is impossible or undesirable, which is precisely what the pacifist disputes.

  ### 4. The Moral Imperative
  **The Claim:** It is morally irresponsible for a state to render itself vulnerable, regardless of the consequences.
  **Classification:** **Contentious Thesis.**
  **Analysis:** This shifts from prediction to duty. It suggests that a government's primary obligation is to its own citizens' security, and that security *is* military capability. It ignores the moral cost of preparation (diverting resources from welfare, maintaining the means of mass killing) and the risk posed to *other* citizens (by escalating tensions).
  **Argumentative Work:** This forces a debate on political obligation. Is the state a protector of borders or a promoter of human flourishing? If the latter, preparation for war might violate the very duty it claims to uphold.

  ### 5. The Determinist Howler
  **The Claim:** Peace is *impossible* without war preparation; arming guarantees safety.
  **Classification:** **Howler.**
  **Analysis:** This is the strongest, most dogmatic version. It implies a necessary condition (no peace without arms) and often implies sufficiency (arms bring peace). History provides ample counter-examples of armed states going to war and demilitarised zones remaining stable (e.g., Costa Rica, or post-war Austria).
  **Argumentative Work:** Illegitimate. It shuts down inquiry by denying the possibility of alternative histories.

  ---

  ### The "Real Peace" Move: Definitional or Empirical?

  You suspect your friend is making a definitional move when they claim you are confusing peace with a "lull." Your suspicion is well-founded, but it is more subtle than a simple dictionary definition.

  Your friend is invoking a **Hobbesian conception of peace**. For Hobbes, peace is not merely the cessation of fighting (which can happen through exhaustion or temporary truce); it is a condition of security where one does not live in constant fear of violent death. If you are unarmed and safe only because a neighbour *chooses* not to hit you, you are not at peace; you are at their mercy.

  *   **Is it definitional?** Yes, insofar as it sets the criteria for what counts as a stable political order.
  *   **Is it empirical?** Yes, because it assumes that without the *capacity* for violence, the neighbour's choice is unreliable.

  **The Verdict:** This move is legitimate only if the empirical premise holds: that goodwill without capacity is unstable. However, your friend uses the definitional claim ("that's not *real* peace") to shield the empirical claim ("unarmed states get invaded") from scrutiny. If you point out that unarmed states often survive through alliances or norms, they retreat to the definition ("yes, but they aren't *secure*"). This is a rhetorical shield. To counter it, you must insist that 'peace' in the proverb must mean the same thing in both clauses. If 'peace' in *vis pacem* means "just order" but 'peace' in the pacifist's goal means "absence of violence," they are talking past you.

  ### Connection to Just War Theory (Seminar Context)

  This analysis bears directly on the *jus ad bellum* criteria your tutor is using, specifically **Last Resort** and **Proportionality**.

  1.  **Last Resort:** If *para bellum* is treated as a permanent standing order (always prepare), then war is never truly a "last resort" because the preparation for the "first resort" is always active. The proverb encourages a mindset where military options are kept warm. If your friend argues that preparation *prevents* the need for last resort, they are making the Causal Deterrence claim (Reading 2). If that claim is false, then preparation merely ensures that when diplomacy fails, the slide to war is faster.
  2.  **Proportionality:** This criterion asks whether the good achieved outweighs the harm. The "Prudential Truism" reading ignores the cost of preparation. A state that prepares for war diverts resources from health, education, and climate mitigation. If the "peace" gained is merely the absence of invasion, but the population suffers from structural violence due to military spending, the proportionality criterion may not be met. The proverb ignores the *cost* of the preparation itself.

  Your tutor's failure to define when these criteria are met is a common pedagogical tool, but in this context, it obscures the fact that *para bellum* often violates proportionality. If preparing for war creates the security dilemma that makes war more likely (Reading 3), then the preparation itself is disproportionate harm.

  ### Compatibility with Pacifism

  Is any reading compatible with pacifism?

  *   **Reading 1 (Truism):** Yes. A pacifist can argue: "If you want peace (non-violent order), prepare for war (prepare non-violent resistance, civilian defence, and diplomatic resilience)." This reinterprets *bellum* not as 'war' but as 'conflict'.
  *   **Reading 3 (Security Dilemma):** Yes. If a pacifist argues that *para bellum* actually produces war, they are using the proverb to argue *against* preparation. "If you want peace, do *not* prepare for war."
  *   **Reading 4 (Constitutive):** Generally No, unless the pacifist accepts a 'police' model. Some contingent pacifists argue that force is sometimes needed to stop a genocidaire. If 'preparing for war' means 'maintaining a police capability to uphold human rights', a contingent pacifist might accept it. A committed absolute pacifist cannot.

  ### Where My Reasoning Might Fail

  I must explicitly flag two areas where the analysis above could be mistaken or incomplete.

  **1. The Empirical Weight of Deterrence (Reading 2)**
  I have classified the Deterrence Thesis as merely "contentious." It is possible that the empirical evidence for deterrence is far stronger than I have allowed in this analysis. If rigorous quantitative political science demonstrates that nuclear or conventional superiority *statistically* reduces the incidence of interstate war to near zero, then Reading 2 moves closer to a "Platitude" in terms of practical policy, even if it remains theoretically contingent.
  *   **What would change my mind:** If you were presented with robust, peer-reviewed data showing that unilateral disarmament in the modern era leads to invasion in >90% of cases, whereas armed neutrality leads to peace in >90% of cases. If the correlation is that strong, my dismissal of your friend's empirical claim would be too hasty. The proverb would then function as a reliable heuristic rather than a dogma.

  **2. The Moral Necessity of the Constitutive Claim (Reading 4)**
  I have treated the "Real Peace" argument as a definitional dodge. However, there is a strong tradition in political philosophy (from Augustine to modern Realists) that argues justice *requires* the capacity for enforcement. If 'peace' is defined as 'tranquillitas ordinis' (the tranquillity of order), then an order that cannot defend itself against injustice is not a moral peace, but a triumph of might.
  *   **What would change my mind:** If it can be demonstrated that 'peace' in the moral sense *logically entails* the capacity for defence. If you accept that a state has a duty of care to its citizens akin to a parent's duty to a child, and that a parent who cannot physically intervene to stop an attacker is failing in that duty, then the Constitutive Claim becomes a Moral Imperative (Reading 4) that is difficult for a pacifist to refute without abandoning the duty of care. If the duty to protect overrides the duty to remain non-violent, the proverb becomes a moral verdict rather than an empirical prediction.

  ### Summary for Your Argument

  When your friend uses the phrase to shut you down, they are illegitimately sliding from the **Prudential Truism** (which you cannot deny) to the **Causal Deterrence Thesis** (which is debatable) or the **Constitutive Claim** (which is definitional).

  To reply, you might say:
  > "If you mean we must plan for obstacles, I agree (Truism). But if you mean military spending causally guarantees safety, that is an empirical claim I dispute given the security dilemma. And if you mean an unarmed state cannot be at peace by definition, you are simply defining my position out of existence rather than arguing against it. Which claim are you actually making?"

  This forces them to pick a box from the menu, preventing them from using the ambiguity as a shield.
