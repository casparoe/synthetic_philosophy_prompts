answer: |-
  **Q&A PREP SHEET: NON-TRANSITIVITY IN ETHICAL SPECTRA**

  **Audience Profile:** Moral philosophers (value theory), 2 Decision Theorists, 1 Economist (partial orders), 1 Vagueness specialist.
  **Tone:** Collegial but rigorous. Avoid jargon where possible, but don't talk down.
  **Time:** Replies capped at approx. 250 words (2 minutes spoken).

  ***

  ### 1. The Incomparability Objection (The Economist & Vagueness Expert)
  **The Objection:** 'You haven't demonstrated intransitivity; you've demonstrated incomparability. If the change between World *i* and World *i*+1 is truly negligible, the relation isn't "better than", it's "on a par" or simply undefined. If A and B are incomparable, and B and C are incomparable, you can't chain them. You've assumed a complete ordering where there is only a partial one. Transitivity holds for comparable pairs; you've just found pairs that don't compare.'

  **The Reply:**
  'I grant that 'better than' is often a partial order. In many cases, things are simply incomparable. But in a spectrum case like this, we are forced into comparability by the design. We aren't comparing apples and oranges; we are comparing a state to itself with a microscopic adjustment.

  If I have a headache, and I take a pill that reduces it by an amount too small to notice, it would be bizarre to say my new state is *incomparable* to my old one. It is either better, worse, or equal. If it's equal, then by transitivity, the start and end worlds are equal, which contradicts our intuition that chronic pain is worse than no pain. If it's incomparable at every step, the spectrum dissolves into noise.

  I'm arguing that the relation *is* complete here—each step is marginally better—but that the accumulation of these marginal gains does not aggregate linearly. The threat of incomparability is a way to save transitivity by sacrificing the connectivity of the chain. I think that's a high price to pay to save a logical rule. It's more honest to say the rule fails in aggregation cases than to say these tiny differences are metaphysically incomparable.'

  **Honest Note on Soft Spot:** This is the hardest fight. If they insist that 'no perceptible difference' entails 'no comparative value', you have no lever to pry them open. You are relying on the intuition that *some* change occurred, even if undetectable. If they deny that, you're stuck.

  ***

  ### 2. The Money Pump (The Decision Theorists)
  **The Objection:** 'Let's treat these worlds as options you can purchase. If you prefer World *i*+1 to World *i*, you should pay a penny to switch. I will let you switch from Start to End, charging you a penny at each of the five thousand steps. You end up in the "worse" world, five thousand pennies poorer, having voluntarily traded away your better option. You are vulnerable to a money pump. Your ethics makes you irrational.'

  **The Reply:**
  'This is the showy objection. It sounds devastating, but it relies on conflating "better than" with "rationally required to choose". I am defending a claim about value, not necessarily a decision procedure for sequential trading.

  However, let's accept the challenge. Yes, on this view, you can be money-pumped. I am willing to bite that bullet. Why? Because the alternative is accepting that the final world—where one person is tortured and a billion feel nothing—is *better* than the start world. If transitivity forces me to accept the Repugnant Conclusion or its pain-based equivalent, then transitivity is the thing that has to go, not my judgement on the outcomes.

  Rational choice theory assumes transitive preferences. If the structure of value itself is non-transitive, then rational choice theory needs to accommodate that, perhaps by forbidding certain sequences of choice or acknowledging that 'maximisation' isn't always possible. Being money-pumped is a cost, but it's a lower cost than sanctioning a world of hidden, aggregated misery.'

  **Honest Note on Soft Spot:** You are admitting your theory makes agents exploitable. In an economics room, this is a sin. They will press you on *action-guidance*. If the theory tells you how to rank the world but not how to act in it, is it useful?

  ***

  ### 3. The "Zero Disvalue" Problem (The Moral Philosophers)
  **The Objection:** 'You claim the billion people bear a burden they cannot detect. If a burden makes no difference to a life—no phenomenological impact, no behavioural change—its moral weight is zero. Zero added to itself a billion times is still zero. You cannot get a negative sum from a billion zeros. So, the end world isn't worse; it's identical to a world where they carry nothing.'

  **The Reply:**
  'This is the bit I struggle with, so I'll be direct. I am distinguishing between *perceptual* significance and *moral* significance. We accept this distinction elsewhere. A single molecule of a toxin might not make you sick, but a billion of them will. The harm isn't in the feeling; it's in the physiological or metaphysical state.

  In this case, the "sliver of pain" is a real quantity of disvalue, even if it falls below the threshold of consciousness. To say it counts for nothing is to adopt a threshold view of value: below X amount, value is zero. But thresholds are arbitrary. Why does *this* specific sliver count and the one before it not?

  I'm arguing that value is continuous, but our perception is discrete. The billion people are worse off, objectively, even if they don't know it. The sum of these objective worsenings outweighs the relief of the single sufferer. It's unintuitive, yes, but less unintuitive than saying a billion people can be used as a sink for negative value without any moral cost.'

  **Honest Note on Soft Spot:** You admitted this is your weak point. If they press on *why* it's a burden if it changes nothing in the person's life (no experience, no behaviour), you risk sounding like you're reifying "pain" as a substance rather than an experience. Stand firm on the toxin analogy; it's your best shield.

  ***

  ### 4. The Sharp Cutoff (The Vagueness Expert)
  **The Objection:** 'This is just a Sorites paradox in fancy dress. You assume there's no point where the step matters. But there must be a cutoff. At step 3,492, the sliver of pain redistributed *does* become morally significant, even if the sufferer doesn't notice. Transitivity holds; you've just misidentified the boundary where "better than" flips to "worse than".'

  **The Reply:**
  'This is epistemicism: the idea that there is a sharp boundary we just can't know. I find that implausible here. Are you really suggesting there is a precise quantum of pain such that adding one unit more to the billion makes the world worse, but one unit less makes it better?

  That level of precision doesn't match the fuzzy nature of value. If you save transitivity by positing a magic boundary, you've saved the logic at the expense of the phenomenon. My claim is that the relation itself degrades over distance. It's not that we don't *know* where the cutoff is; it's that the cutoff doesn't exist. The "better than" relation bleeds out over the spectrum. It's not a cliff edge; it's a slope that eventually loops back on itself.'

  **Honest Note on Soft Spot:** Vagueness theorists have very sophisticated defences of epistemicism. They will argue that "value" is a precise property even if our access to it isn't. Don't get bogged down in semantics; keep it focused on the moral implausibility of the "magic step".

  ***

  ### STRATEGIC NOTES

  **What to Concede Up Front:**
  Concede that 'better than' is usually transitive. You are not arguing for anarchy in logic, but for a specific exception in aggregation cases involving vast numbers and small differences. Concede that your view complicates decision theory. If you try to defend the idea that transitivity is *generally* false, you'll lose the room. Frame it as a "boundary case" for value theory.

  **The Real Threat vs. The Showy One:**
  *   **Showy:** The Money Pump. It sounds dramatic, but you can dismiss it as a problem for *choice theory*, not *value theory*.
  *   **Real Threat:** Incomparability (Objection 1). If they successfully argue that adjacent worlds are incomparable, your chain is broken, transitivity is preserved, and your paradox vanishes. This is the argument you must spend the most energy pre-empting.

  **The Question You Hope Nobody Asks:**
  'If 'better than' isn't transitive, how do we make collective decisions? If we vote on policies, or allocate budget, we rely on ranking options. If A is better than B, and B better than C, but C is better than A, your system creates a cycle. Do you propose we abandon voting? Abandon cost-benefit analysis? If you break transitivity, you break the machinery of public policy. What do you put in its place?'

  *(Preparation for this: Have a vague answer ready about "satisficing" or "lexical priorities", but acknowledge this is the open frontier of the research.)*
