      *   *Section 2: The Core Conceptual Issue.* Explain *why* Uniform($\theta$) $\neq$ Uniform($\log \theta$). It's the Jacobian. "Ignorance" isn't invariant under transformation.
      *   *Section 3: Application to Epidemiology.*
