          *   Bertrand's Math: Correct.
          *   Refutation of PoI: Nuanced. It refutes *unqualified* PoI.
          *   Kolmogorov: Conflation. Axioms $\neq$ Prior selection.
          *   "No serious person": False. Logical probability still exists.
          *   Jaynes: Mostly right on invariance, wrong on "MaxEnt" label for this specific problem (it's Transformation Groups).
          *   Jeffreys: Unfair dismissal. Jeffreys priors are standard for this exact parameterization issue.
