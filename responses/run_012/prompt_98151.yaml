answer: |-
  You're conflating liability with culpability. In Lewis's ordinary cases, what transfers is a mere cost or debt, not moral guilt. When I pay your parking fine, I am not being punished for your violation; I am discharging a liability. Punishment is not just suffering a cost; it is the imposition of suffering because the recipient deserves it for their own wrongdoing. Retribution targets the moral agent, not just the wallet. The divine case fails because it requires transferring moral guilt, not just a debt. God cannot punish Christ for my sins because Christ did not commit my sins. Ordinary cases work only because they aren't truly punitive in the retributive sense; they are compensatory. If we called them punishment, we would see them as unjust. Lewis wins only by watering down punishment to mean any unpleasant cost, begging the question against the retributivist.
