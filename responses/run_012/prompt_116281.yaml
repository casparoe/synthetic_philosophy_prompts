  A fundamentality auditor stops at the bedrock of a metaphysician's ontology.
  **Auditor:** "These facts are ungrounded? Fundamental?"
  **Metaphysician:** "Yes."
  **Auditor:** "And the fact *that* they ground the level above? Is that grounded?"
  **Metaphysician:** "No, grounding facts are autonomous."
  **Auditor:** "So that fact is fundamental too?"
  **Metaphysician:** "Reluctantly, yes."
  **Auditor:** "So the only things that are truly fundamental in your universe... are facts about things that aren't?"
  **Metaphysician:** "It's either that or an infinite regress."
  **Auditor:** "Fine. But I'm marking this down as 'Foundationalism about Glue'."

  ***

  **Explanation**
  Almost all grounding theorists agree on the formal features of the relation (irreflexive, asymmetric, transitive) and the desire for well-foundedness, which the auditor presupposes. The joke hinges on the contested status of grounding facts themselves: whether they are autonomous (ungrounded) or themselves grounded, a dispute famously highlighted by scholars like Kit Fine and Kelly Trogdon. If autonomous, they become fundamental facts about non-fundamental relata, which seems ontologically awkward; if grounded, they risk an infinite regress. The punchline forces a choice between these two live, unresolved options in the literature.
