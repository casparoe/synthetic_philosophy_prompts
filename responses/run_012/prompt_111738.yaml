      *   Actually, the strongest evidence is *phenomenological*: The experience of "arbitrary choice" (e.g., picking a pen color when both work). If the user argues this is an illusion, they need to explain *what* the illusion hides.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Rigorous, philosophical, direct. No reassurance.
      *   *Structure:*
          1.  Assess the Core Vulnerability (Tautology).
          2.  Evaluate the 5 Specific Objections (Sorted).
