  # DECISION TREE: THE LOGICAL SPACE OF EMOTION

  **Instructions:** Answer each question based on your intuitions about the cases provided in the seminar handout. Follow the branches to locate your theoretical position.

  **Q1. (Cases vi, vii):** Do 'emotion' terms pick out a single, unified biological mechanism shared across human cultures and other species (e.g., is the bird's mobbing the same *kind* of state as human anger)?
  *   **No** → Go to **Leaf A**.
  *   **Yes** → Go to **Q2**.

  **Q2. (Case ii):** In the spider case (fearing what one judges safe), is the subject irrational in the same way they would be if they believed *P* and *not-P* simultaneously?
  *   **Yes** (It is a contradiction) → Go to **Q3**.
  *   **No** (It is like a visual illusion) → Go to **Q5**.

  **Q3. (Case vii):** Must the subject possess and apply the concept 'danger' (or 'offense', 'loss') to undergo the emotion?
  *   **No** → Go to **Leaf B**.
  *   **Yes** → Go to **Q4**.

  **Q4. (Case iii):** If a subject displays all protective behaviors of guilt but reports zero conscious feeling or assent, is the emotion present?
  *   **Yes** (Commitment/Behavior is sufficient) → Go to **Leaf B**.
  *   **No** (Conscious assent is required) → Go to **Leaf C**.
      *(Note: Q3/Q4 together isolate the Attitude view from the Judgment view.)*

  **Q5. (Case i):** Is the physiological arousal (e.g., heart pounding in the startle reflex) a *constituent* of the emotion, or merely its causal effect?
  *   **Constituent** → Go to **Leaf D**.
  *   **Effect** → Go to **Q6**.

  **Q6. (Secondary Interest):** Could two states represent the exact same value (e.g., 'danger') but differ *only* in the actions they prepare (e.g., freeze vs. flee)?
  *   **Yes** (Action individuates the emotion) → Go to **Leaf E**.
  *   **No** (Value individuates the emotion) → Go to **Q7**.

  **Q7. (Case iv):** If physiology is identical (dread vs. excitement), is there a fact of the matter about which emotion is present prior to the subject's interpretation?
  *   **No** (Interpretation constitutes the emotion) → Go to **Leaf A** (Constructivist variant).
  *   **Yes** (Value is detected independently) → Go to **Leaf F**.

  ---

  ### THE LEAVES: POSITIONS & IMPLICATIONS

  **Leaf A: Deflationary Constructivism**
  *   **Position:** Emotions are not natural kinds but social scripts or loose family resemblances.
  *   **Awkward Implication:** The bird's mobbing and the human's anger are as scientifically distinct as 'clouds' and 'furniture', sharing no deep psychological unity.

  **Leaf B: Attitude-First View**
  *   **Position:** Emotions are non-conceptual commitments or concerns that do not require judgmental assent.
  *   **Awkward Implication:** A subject can be genuinely committed to something being dangerous while fully believing it is safe, without any failure of rationality.

  **Leaf C: Evaluative-Judgment View**
  *   **Position:** Emotions are (or entail) evaluative judgments requiring conceptual endorsement.
  *   **Awkward Implication:** The spider-fearer is strictly irrational, holding contradictory beliefs, and cannot genuinely fear what they know does not exist (Case v).

  **Leaf D: Pure Bodily-Feeling View**
  *   **Position:** Emotions are the perception of physiological changes; the feeling *is* the emotion.
  *   **Awkward Implication:** The immediate startle reflex (Case i) and long-term fear are the same kind of state, differing only in duration and cause.

  **Leaf E: Action-Tendency-First View**
  *   **Position:** Emotions are defined by their functional role in preparing specific behavioral outputs.
  *   **Awkward Implication:** If dread and excitement prepare the identical bodily action (Case iv), they are the same emotion, regardless of how different they feel.

  **Leaf F: Evaluative-Perception View**
  *   **Position:** Emotions are non-conceptual perceptions of value that present the world as being a certain way.
  *   **Awkward Implication:** Fearing a fictional monster (Case v) is not irrational, but one must explain how one perceives value in something known not to exist.

  ---

  ### EMPTY SPACE & COHERENCE NOTE

  **Unoccupied Combinations:**
  1.  **Cognitive + Non-Conceptual + Judgment:** (Q2=Yes, Q3=No, Q4=No). *Coherent but unoccupied.* One could argue emotions are cognitive assessments that don't require concepts, but few defend this as it blurs into Attitude-First.
  2.  **Non-Cognitive + Constitutive Body + Action Individuation:** (Q5=Constituent, Q6=Yes). *Incoherent.* If the body *is* the emotion, action tendencies are downstream effects, not definers.
  3.  **Perception + No Fact of the Matter:** (Q7=No). *Deflationary.* This collapses back into Leaf A; a perception view requires a value-fact to perceive.

  **INDEPENDENCE OF AXES (Closing Note)**
  This tree treats **Rationality** (Q2), **Constitution** (Q5), and **Individuation** (Q6) as independent axes.
  *   *Are they really independent?* Probably not entirely. If you answer "Yes" to Q2 (Judgment-like), you are logically pushed toward Q3/Q4 (Concepts/Assent). If you answer "No" to Q5 (Body is not constitutive), you are pushed toward Q6/Q7 (Representational views). The tree assumes one can mix a "Perception-like" rationality (Q2-No) with a "Bodily" constitution (Q5-Yes), which is the classic Jamesian spot. However, the "Action-Tendency" view (Leaf E) often smuggles in a "Perception-like" rationality, suggesting Q2 and Q6 may be correlated in practice, even if logically distinct. The most fragile independence is between Q6 and Q7: if action defines the emotion, the "fact of the matter" in Q7 is usually fixed by the action, not the value.

  *(End of Handout)*
