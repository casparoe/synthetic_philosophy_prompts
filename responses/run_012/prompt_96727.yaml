answer: |-
  # The Ambiguity Diagnostic Instrument

  **Instructions:** Read the eight cases below. For each, select the option that matches your intuitive choice or judgment. Do not calculate expected values unless explicitly told the odds. Record your answers (A or B, or Yes/No) to determine your position at the end.

  ### The Eight Nodes

  **Node 1: The Two-Urn Choice**
  Urn K contains 50 red balls and 50 black balls. Urn U contains 100 balls, red and black, in unknown proportions. You win $100 if you draw a red ball.
  *   **A:** I am indifferent; I assign 50% probability to red in both.
  *   **B:** I prefer Urn K; the unknown proportion makes me uneasy.

  **Node 2: The Three-Colour Consistency**
  An urn has 30 red balls and 60 balls that are either black or yellow (unknown split).
  *   **Choice 1:** Bet on Red vs. Bet on Black.
  *   **Choice 2:** Bet on Red or Yellow vs. Bet on Black or Yellow.
  *   **A:** I bet on Red in Choice 1, and on Black or Yellow in Choice 2. (The Ellsberg Pattern)
  *   **B:** I am consistent; if I prefer Red in Choice 1, I prefer Red or Yellow in Choice 2.

  **Node 3: The Exchangeability Argument**
  Same urn as Node 2 (30 Red, 60 Black/Yellow). Someone argues: "You have no reason to think Black is more likely than Yellow. By symmetry, treat them as 30 each. The ambiguity is an artifact of description."
  *   **A:** I accept this; I now treat the urn as 30 Red, 30 Black, 30 Yellow.
  *   **B:** I reject this; the lack of knowledge about the mechanism still distinguishes it from known odds.

  **Node 4: The Adversarial Bookmaker**
  You face the Two-Urn choice (Node 1), but the Urn U was composed by a counterparty who knows the mix and wins money if you lose.
  *   **A:** My preference for Urn K becomes much stronger than in Node 1.
  *   **B:** My preference remains the same; the adversary doesn't change the odds, only my suspicion.

  **Node 5: The Competence Bet**
  *   **Bet 1:** A coin flip (50/50).
  *   **Bet 2:** The outcome of a sports match in a league you know nothing about, assessed by a neutral bookie as 50/50.
  *   **A:** I am indifferent; 50% is 50%.
  *   **B:** I prefer the coin; I distrust my lack of knowledge about the match.

  **Node 6: Second-Order Risk**
  *   **Bet 1:** A fair coin (50% Heads).
  *   **Bet 2:** A coin is selected at random from a bag where the bias of each coin was drawn from a known uniform distribution (average 50% Heads), then flipped.
  *   **A:** I am indifferent; the objective probability of Heads is 50% in both.
  *   **B:** I prefer Bet 1; I dislike the variance in the underlying bias even if the mean is known.

  **Node 7: The Loss Frame**
  Urn K (50/50) and Urn U (Unknown) from Node 1. You lose $100 if you draw a black ball.
  *   **A:** I still prefer Urn K (Ambiguity Aversion holds).
  *   **B:** I switch to Urn U (Ambiguity Seeking/Reflection).

  **Node 8: The Endowment Exchange**
  You own a ticket that pays $100 if a red ball is drawn from Urn U (Unknown). You are offered a ticket for Urn K (50/50) that pays $95 if red is drawn. You must pay a small fee to swap.
  *   **A:** I pay to swap; certainty is worth the cost.
  *   **B:** I keep my ticket; the status quo stands unless the known odds are significantly better.

  ---

  ### The Sorting Key

  Map your answers to the paths below to find your theoretical position.

  **Path 1: The Savage Baseline**
  *   **Requirements:** Node 1(A), Node 2(B), Node 6(A).
  *   **Position:** **Savage-Style Expected Utility.**
  *   **Diagnosis:** You treat ambiguous events as having precise subjective probabilities. You view the Ellsberg pattern (Node 1B/2A) as a reasoning error to be corrected. You do not distinguish between risk (known odds) and uncertainty (unknown odds) once probabilities are assigned.

  **Path 2: The Symmetry Defense**
  *   **Requirements:** Node 1(A), Node 3(A).
  *   **Position:** **Ambiguity is Illusory (Principle of Insufficient Reason).**
  *   **Diagnosis:** You are behaviorally identical to the Savage type but for a different reason. You do not ignore ambiguity; you dissolve it via symmetry arguments. You believe that without evidence to the contrary, exchangeable outcomes must be weighted equally.

  **Path 3: The Contextual Rationalist**
  *   **Requirements:** Node 1(B), Node 4(A), Node 5(B).
  *   **Position:** **Adversarial/Competence Rationality.**
  *   **Diagnosis:** You avoid ambiguity, but only when justified by information asymmetry or lack of competence. You view ambiguity aversion not as a structural feature of utility, but as a heuristic for dealing with better-informed opponents or unfamiliar domains. In pure, neutral settings (like Node 6), you might revert to neutrality.

  **Path 4: The Smooth Ambiguity Averter**
  *   **Requirements:** Node 1(B), Node 6(B), Node 2(A).
  *   **Position:** **Smooth Ambiguity (Second-Order Risk Aversion).**
  *   **Diagnosis:** You distinguish between risk (Node 6, Bet 1) and ambiguity (Node 6, Bet 2). You are willing to assign second-order probabilities (distributions over priors) but are averse to the variance in those probabilities. Your aversion is continuous, not abrupt.

  **Path 5: The Pessimistic Weighter**
  *   **Requirements:** Node 1(B), Node 2(A), Node 6(A).
  *   **Position:** **Choquet Expected Utility (Nonadditive Probability).**
  *   **Diagnosis:** You do not necessarily posit second-order distributions (Node 6A). Instead, you weight probabilities non-linearly. You overweight the worst-case scenario implicitly. You violate the additivity axiom in Node 2 (preferring Red over Black, but Black+Yellow over Red+Yellow).

  **Path 6: The Worst-Case Planner**
  *   **Requirements:** Node 1(B), Node 2(A), Node 8(A) (Strong willingness to swap).
  *   **Position:** **Maxmin Expected Utility.**
  *   **Diagnosis:** You evaluate acts by their minimum expected utility over a set of priors. You are willing to sacrifice significant expected value (Node 8) to eliminate the set of priors entirely. You are more rigid than the Smooth type; the "worst case" dominates your decision regardless of the distribution of other cases.

  **Path 7: The Status-Quo Holder**
  *   **Requirements:** Node 1 (Indecisive), Node 8(B).
  *   **Position:** **Incomplete Preferences with Status-Quo Rule.**
  *   **Diagnosis:** You do not have a single preference ordering. In Node 1, you genuinely cannot choose. You only move when forced or when the alternative is strictly dominant. You reject the premise that a single number (utility) must represent your state.

  ---

  ### Analysis of Leaves and Gaps

  **Behaviorally Indistinguishable Leaves**
  1.  **Maxmin vs. Choquet:** In simple binary bets (Nodes 1 and 2), Maxmin and Choquet often predict identical choices (ambiguity aversion and additivity violations). This instrument separates them only via Node 8 (willingness to pay to reduce the *set* of priors vs. weighting the *single* worst outcome). In practice, without complex trading tasks, these two leaves are often observationally equivalent.
  2.  **Savage vs. Symmetry:** Both yield indifference in Node 1. They are distinguished only by the justification in Node 3. If a subject answers Node 1(A) but refuses Node 3(A), they are Savage. If they answer Node 1(A) because of Node 3(A), they are Symmetry. Behaviorally, in betting markets, they collapse into the same neutral actor.

  **Unoccupied Combinations (Gaps)**
  1.  **The Ambiguity Seeker (Node 1B in Loss, Node 1A in Gain):**
      *   *Gap:* Preferring the known urn in gains but the unknown urn in losses (Node 7B while Node 1B).
      *   *Status:* **Incoherence/Instability.** While prospect theory suggests reflection, empirical evidence for ambiguity *seeking* in losses is weak compared to risk seeking. Most who avoid ambiguity in gains also avoid it in losses (Node 7A).
  2.  **The Adversarial Gambler (Node 4B while Node 1B):**
      *   *Gap:* Avoiding ambiguity in a neutral setting but ignoring it when an adversary profits from your loss.
      *   *Status:* **Unattractive.** This implies ignoring strategic risk. It is theoretically possible (believing the adversary is honest), but practically irrational in a decision-theoretic context.
  3.  **The Second-Order Neutral (Node 1B, Node 6A):**
      *   *Gap:* Avoiding the unknown urn but accepting the known distribution of bias.
      *   *Status:* **Neglect/Theoretical Niche.** This is the specific signature of Choquet utility (Node 5 above). It is not a "gap" in existence, but a gap in * Smooth Ambiguity* theory. Many users find this distinction unintuitive, leading to noisy data here.
  4.  **The Endowment Reversal (Node 8A while Node 1A):**
      *   *Gap:* Indifferent between urns initially, but paying to swap once endowed.
      *   *Status:* **Incoherence.** This violates procedure invariance. If you truly believed the odds were identical (Node 1A), the endowment should not create a preference for the known urn unless you are admitting you were wrong in Node 1.

  **Limitations of the Instrument**
  *   **The Smooth/Maxmin Boundary:** Node 6 attempts to separate Smooth Ambiguity from Maxmin/Choquet. However, a Maxmin user may also dislike Node 6 (Bet 2) because the "set of priors" is wider, mimicking Smooth behavior. The tree flags this overlap but cannot fully resolve it without eliciting the *degree* of willingness to pay in Node 8.
  *   **The Symmetry Mask:** A sophisticated Savage user may answer Node 3(A) strategically to appear consistent, masking their true reliance on subjective priors. The instrument relies on introspection honesty.
  *   **The Incomplete Preference Trap:** Users with Incomplete Preferences may force themselves to answer A or B in Nodes 1–7 due to social pressure, only revealing their true nature in Node 8. If Node 8 is skipped, they will be misclassified as Savage or Contextual.

  **Final Note on Prudence vs. Bias**
  If you land on **Contextual Rationality**, your job choice was prudence: you identified unquantifiable risk in a high-stakes environment. If you land on **Smooth Ambiguity** or **Maxmin**, it was a consistent preference structure, not necessarily a bias, though it carries an opportunity cost. If you land on **Savage** but answered Node 1(B), you are experiencing cognitive dissonance between your intuition and your normative commitments. If you land on **Incomplete Preferences**, the question of "correcting" the bias is ill-posed; you are optimizing for decisiveness costs, not just value.
