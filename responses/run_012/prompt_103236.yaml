      *   **Why it looked true:** Causal intuition (no backward causation).
      *   **Why it's false:** Neural latency + Temporal Representation (Postdiction). The brain represents time, it doesn't just mirror it.
      *   **The Cost:** We lose "Naive Realism about Temporal Location." Conscious experience is not a live feed; it's a delayed, edited broadcast that claims to be live.
      *   **Orwellian/Stalinesque:** The distinction dissolves. It becomes a category error.
      *   **Saving Science:** Reports are still evidence, but they are evidence of the *model* the brain built, not evidence of a pixel-perfect timeline of neural events.

  8.  **Self-Correction/Nuance Check:**
