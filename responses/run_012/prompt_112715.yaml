prompt: |-
  I'm a senior software engineer on a small platform team, and I have no formal background in philosophy — the problem below is a practical one I have to solve, not a research interest.

  Our decision-support service sits between upstream components that each report a probability for some event and downstream systems that take an automated action on the basis of a single number. The upstream components are heterogeneous: some are mechanistic simulations of processes that, as far as I can tell, are genuinely chancy; some are statistical models reporting the frequency with which an event occurred in a historical population; some are human analysts typing a gut number into a form. The downstream actions are customer-visible and run a few hundred times a day — denying a transaction, repricing a quote, flagging an account — so a wrong number has real cost, but we never have time to convene anyone for a case-by-case ruling.

  The rule of thumb I picked up somewhere, and which I suspect is the thing I actually want, is this: if I know that the objective probability of an event is p, then my own degree of belief should be p, and I should not second-guess the chance with my own hunch. What I need is that idea turned into something my team can run.

  Please write a decision procedure, in the form of a spec we could implement: the questions to ask in a fixed order, the inputs each question needs, what counts as a sufficient answer, where the procedure halts and emits a number, and where it must stop and hand the decision to a person because the remaining question is not a matter of fact. It has to run in a few minutes per case, and it has to be honest about which steps are judgment calls dressed up as procedure. The platform lead signs off on the thresholds; the on-call engineer runs the procedure.

  The procedure has to survive at least these cases: (a) the upstream number is itself uncertain — a model that reports a range, or a distribution over probabilities; (b) the number is a frequency from a reference class, but the decision concerns a single token case that need not belong to that class; (c) the component's report is correlated with the outcome for reasons other than the chance it reports — we peeked at the outcome, or the component was fitted on data that contains it; (d) the component reports a probability about its own future output, or about a chance that will later differ from the one it reports now; (e) the source is a human expert with a track record, where deference to a calibrated record and deference to a chance come apart.

  Then apply the procedure to three concrete tickets: a simulation component reporting a 30% chance of a weather event that our pricing depends on; a churn model reporting 0.8 for a specific user; and an analyst reporting 0.6 that a vendor will breach an SLA, whose last twenty calls were right fourteen times. Include at least one case where the procedure tells me to discard a number we built the pipeline around, and close with what the procedure cannot do.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Persona:** Senior Software Engineer on a small platform team. No formal philosophy background. Practical problem, not academic.
      *   **Context:** Decision-support service aggregating heterogeneous probability inputs (simulations, statistical models, human gut) for automated downstream actions (deny transaction, reprice, flag). High frequency (hundreds/day), real cost for errors, no time for case-by-case human review *unless* the procedure flags it.
      *   **Core Philosophical Principle:** The Principal Principle (Lewis): If objective chance is $p$, rational credence should be $p$. The user wants this operationalized.
      *   **Deliverable:** A decision procedure (spec) implementable by the team. Fixed order questions, inputs, stopping conditions, human handoff points. Must run in minutes. Must be honest about judgment calls.
      *   **Constraints/Edge Cases to Handle:**
          *   (a) Uncertain probabilities (ranges/distributions).
          *   (b) Reference class problems (frequency vs. single token).
          *   (c) Data leakage/peeking (correlation $\neq$ causation/chance).
          *   (d) Self-reference/temporal drift (probability about future output or changing chance).
          *   (e) Expert testimony vs. objective chance (calibration vs. chance).
      *   **Required Examples:** Apply to three tickets (Weather simulation, Churn model, Analyst SLA prediction). One must result in discarding the number.
      *   **Closing:** Limitations of the procedure.

  2.  **Deconstruct the Philosophical Core (The Principal Principle):**
      *   David Lewis's Principal Principle states: $C(A | X) = x$, where $C$ is credence, $A$ is the event, and $X$ is the proposition that the objective chance of $A$ is $x$.
      *   *The Catch:* We rarely know the *objective chance*. We usually have *estimates* of chance, frequencies, or subjective credences from others.
      *   *The Engineering Translation:* We need a "Trust Score" or "Admissibility Check" for every incoming probability $p_{in}$. If $p_{in}$ qualifies as a valid proxy for objective chance $x$, output $p_{out} = p_{in}$. If not, adjust or escalate.

  3.  **Drafting the Procedure (The "Spec"):**
      *   *Goal:* Convert "Is this a valid chance?" into a checklist.
      *   *Structure:* Input Validation $\rightarrow$ Source Characterization $\rightarrow$ Admissibility Checks $\rightarrow$ Aggregation/Adjustment $\rightarrow$ Output/Escalation.
      *   *Tone:* Technical, precise, actionable. Avoid jargon where possible, but define terms when necessary.
      *   *Handling Judgment:* Explicitly mark steps requiring human threshold setting (Platform Lead) vs. runtime execution (On-Call).

      *   *Step 1: Input Normalization.* Handle Case (a). If it's a range, pick a conservative point estimate or flag for escalation. Let's make it a gate: if variance > threshold, escalate.
      *   *Step 2: Source Typing.* Is it Mechanistic (Chance), Frequentist (Reference Class), or Subjective (Expert/Model)? This addresses the heterogeneity.
      *   *Step 3: Admissibility (The "Lewis Check").*
          *   Check for "Inadmissible Information" (Case c & d). Did we peek? Is the chance changing?
          *   Check Reference Class Match (Case b). Does the history match *this* specific case?
          *   Check Expert Calibration (Case e). If human/model, is their track record valid *for this context*?
      *   *Step 4: Decision.* Pass, Adjust, or Escalate.

  4.  **Refining the Steps (Iterative Polish):**
      *   *Critique:* "Admissibility" is too philosophical. Call it "Integrity & Relevance Checks."
      *   *Critique:* Need to distinguish between *aleatory* uncertainty (inherent randomness) and *epistemic* uncertainty (lack of knowledge). The Principal Principle applies best to aleatory. If the uncertainty is epistemic, we need to discount.
      *   *Refinement:* Add a "Uncertainty Tax" step. If the source is epistemic (like the human analyst), we shouldn't treat their 0.6 as a physical chance. We treat it as a calibrated forecast.
      *   *Constraint Check:* Must run in minutes. So, lookups must be automated (DB queries on model performance, etc.). Human handoff only when automated checks fail.

  5.  **Developing the Three Cases:**
      *   *Case 1: Weather Simulation (30%).* Mechanistic. Physics-based. Usually good for "objective chance." *Verdict:* Pass, but check for temporal drift.
      *   *Case 2: Churn Model (0.8).* Statistical. Reference class issue. Is *this* user like the training set? *Verdict:* Check feature drift. If high drift, escalate.
      *   *Case 3: Analyst (0.6, 14/20 accuracy).* Human expert. 70% accuracy. They say 60% chance. *Verdict:* This is the tricky one. If they are 70% accurate generally, is their specific 60% call valid? Actually, the prompt asks for one case where we *discard* the number. Let's make the Analyst case the discard or the Churn case.
      *   *Decision:* Let's make the Churn model the "discard" case due to data leakage (Case c) or reference class mismatch. Let's go with Data Leakage (peeking) as it's a hard "stop." Or better, the Analyst case where the track record implies they are *overconfident* or the sample size is too small to trust as "chance."
      *   *Re-reading Prompt:* "Include at least one case where the procedure tells me to discard a number we built the pipeline around."
      *   *Selection:*
          1.  Weather: Pass (with minor adjustment).
          2.  Churn: Escalate/Discard (Reference class mismatch/Feature drift).
          3.  Analyst: Adjust (Calibration mapping).
      *   *Wait, let's make the Churn one the hard discard.* Why? Because if the model was trained on data containing the outcome (Case c), the probability is mathematically invalid as a predictor of *future* chance. It's a tautology.

  6.  **Writing the Spec:**
      *   Use standard spec formatting (ID, Input, Logic, Output).
      *   Define "Admissible Information."
      *   Define "Calibration Mapping."
      *   Ensure the "Human Handoff" is clear.

  7.  **Addressing the Specific Edge Cases in the Spec:**
      *   (a) Uncertain probability: Step 1 (Confidence Interval Check).
      *   (b) Reference Class: Step 3 (Population Stability Index).
      *   (c) Peeking/Leakage: Step 2 (Lineage Audit).
      *   (d) Temporal/Self-ref: Step 4 (Validity Window).
      *   (e) Expert Track Record: Step 5 (Calibration Curve).

  8.  **Final Review against Constraints:**
      *   *Time:* Can this run in minutes? Yes, if metrics are pre-computed.
      *   *Honesty:* Acknowledge that thresholds are arbitrary business decisions.
      *   *Philosophy:* Keep the Lewis Principal Principle as the underlying logic (Chance $\rightarrow$ Credence) without bogging down in metaphysics.

  9.  **Drafting the Content (Mental or Scratchpad):**
      *   *Intro:* Acknowledge the Principal Principle.
      *   *The Spec:* "Probability Admissibility Protocol (PAP)."
      *   *Steps:*
          1.  Format & Variance.
          2.  Causal/Lineage Integrity (No peeking).
          3.  Reference Class Stability (Is this case like the past?).
          4.  Temporal Validity (Is the chance stable?).
          5.  Source Calibration (Expert/Model track record).
      *   *Application:* Walk through the 3 tickets.
      *   *Limitations:* Garbage in, garbage out. Black swans. Moral responsibility.

  10. **Refining the "Discard" Case:**
      *   For the Churn Model (0.8), let's say the PSI (Population Stability Index) is high. The users today are not the users from training. Therefore, the frequency is not a valid proxy for the chance of *this* user. The procedure must flag this as "Inadmissible."
      *   Actually, the prompt mentions Case (c) "component was fitted on data that contains it." This is data leakage. That is a hard fail. Let's use that for the Churn model. It's a stronger engineering failure mode.

  11. **Final Polish:** Ensure the tone is empathetic to the engineer's plight (practical, not academic) but rigorous enough to be safe. (Self-Correction: Make sure to explicitly state *where* the Platform Lead sets thresholds vs. On-Call execution).

  12. **Closing Section:** "What this procedure cannot do." (Ethics, unknown unknowns, shifting goalposts).

  13. **Final check of the Prompt Requirements:**
      *   Decision procedure spec? Yes.
      *   Fixed order questions? Yes.
      *   Inputs/Outputs? Yes.
      *   Halt/Handoff points? Yes.
      *   Honest about judgment calls? Yes.
      *   Survive cases (a)-(e)? Yes, mapped to steps.
      *   Apply to 3 tickets? Yes.
      *   One discard case? Yes.
      *   Close with limitations? Yes.

  (Proceed to generate output based on this structure.)
answer: |-
  ## Probability Admissibility Protocol (PAP) v1.0

  **Owner:** Platform Lead  
  **Executor:** On-Call Engineer (or automated agent)  
  **Time Budget:** < 5 minutes per ticket  
  **Philosophical Basis:** Operationalized Principal Principle. We treat an input probability $p_{in}$ as a rational degree of belief $p_{out}$ *only if* $p_{in}$ is an admissible proxy for objective chance. If admissibility fails, we must discount or escalate.

  ---

  ### 1. Inputs Required
  For every incoming probability ticket, the following metadata must be present in the payload:
  1.  **$p_{in}$**: The reported scalar probability (0.0–1.0).
  2.  **$Source\_Type$**: One of `[MECHANISTIC, FREQUENTIST, SUBJECTIVE]`.
  3.  **$Uncertainty\_Metric$**: Variance, confidence interval width, or ensemble spread.
  4.  **$Reference\_Class\_ID$**: Identifier for the population data or simulation parameters used.
  5.  **$Lineage\_Hash$**: Checksum of the training data or simulation code version.
  6.  **$Timestamp\_Validity$**: Start and end time for which this probability is claimed to hold.
  7.  **$Track\_Record\_Window$**: (If Subjective/Frequentist) Performance data for the last $N$ predictions.

  ### 2. Thresholds (Set by Platform Lead)
  *These are business risk tolerances, not mathematical truths. They must be reviewed quarterly.*
  *   **$T_{var}$**: Max acceptable uncertainty width (e.g., 0.15).
  *   **$T_{drift}$**: Max acceptable Population Stability Index (PSI) or parameter drift (e.g., 0.2).
  *   **$T_{acc}$**: Minimum historical accuracy for subjective sources (e.g., 0.65).
  *   **$T_{sample}$**: Minimum sample size for frequentist claims (e.g., $N=100$).

  ---

  ### 3. Decision Procedure

  #### Step 1: Format & Variance Check (Handles Case A)
  **Question:** Is the probability a stable point estimate, or is the uncertainty too high to act on?
  **Input:** $Uncertainty\_Metric$, $T_{var}$.
  **Logic:**
  *   IF $Source\_Type == MECHANISTIC$ AND $Uncertainty\_Metric > T_{var}$:
      *   **Action:** **HALT.** Escalate to Human. (Simulation chaos implies unknown physics).
  *   IF $Uncertainty\_Metric$ is missing:
      *   **Action:** Default to $0.2$ (conservative tax). Log warning.
  *   ELSE:
      *   **Action:** Proceed to Step 2.

  #### Step 2: Lineage & Leakage Audit (Handles Case C)
  **Question:** Does the source know the answer already? (Data leakage/peeking).
  **Input:** $Lineage\_Hash$, $Source\_Type$.
  **Logic:**
  *   Query the Model Registry for $Lineage\_Hash$.
  *   IF Registry flags `DATA_LEAKAGE_RISK == TRUE` (e.g., target variable present in features):
      *   **Action:** **DISCARD NUMBER.** Set $p_{out} = NULL$. Trigger Incident Ticket.
      *   **Reason:** The number reflects history, not chance. It is inadmissible.
  *   ELSE:
      *   **Action:** Proceed to Step 3.

  #### Step 3: Reference Class Stability (Handles Case B)
  **Question:** Is *this* specific case actually a member of the group the number describes?
  **Input:** $Reference\_Class\_ID$, $T_{drift}$.
  **Logic:**
  *   Calculate Population Stability Index (PSI) between current input features and the $Reference\_Class\_ID$ distribution.
  *   IF $PSI > T_{drift}$:
      *   **Action:** **DISCOUNT.** Apply epistemic tax: $p_{out} = p_{in} \times (1 - PSI)$.
      *   **Reason:** The frequency applies to the past population, not this token case.
  *   ELSE:
      *   **Action:** $p_{out} = p_{in}$. Proceed to Step 4.

  #### Step 4: Temporal Validity (Handles Case D)
  **Question:** Will this chance hold until the action is taken?
  **Input:** $Timestamp\_Validity$, Current Time.
  **Logic:**
  *   IF Current Time > $Timestamp\_Validity.end$:
      *   **Action:** **HALT.** Escalate to Human. (Chance has likely drifted).
  *   IF $Source\_Type == MECHANISTIC$ AND simulation predicts internal state change during the window:
      *   **Action:** **HALT.** Escalate to Human. (Self-referential instability).
  *   ELSE:
      *   **Action:** Proceed to Step 5.

  #### Step 5: Source Calibration (Handles Case E)
  **Question:** If this is a human or model, does their confidence match their reality?
  **Input:** $Track\_Record\_Window$, $T_{acc}$, $T_{sample}$.
  **Logic:**
  *   IF $Source\_Type == SUBJECTIVE$ OR $FREQUENTIST$:
      *   Check count of predictions in $Track\_Record\_Window$.
      *   IF Count < $T_{sample}$:
          *   **Action:** **HALT.** Escalate to Human. (Insufficient data to trust calibration).
      *   Calculate Brier Score or Calibration Slope for the source.
      *   IF Accuracy < $T_{acc}$ OR Calibration Slope < 0.8:
          *   **Action:** **RECALIBRATE.** Map $p_{in}$ through the source's reliability curve (e.g., if they say 0.6 but usually happen 0.4, output 0.4).
  *   ELSE:
      *   **Action:** $p_{out} = p_{in}$.

  #### Step 6: Final Emission
  **Output:** $p_{out}$ (Adjusted Probability) OR `ESCALATE`.
  **Log:** Record which step modified the value for audit.

  ---

  ### 4. Application to Concrete Tickets

  #### Ticket A: Weather Simulation (Pricing Dependency)
  *   **Input:** $p_{in} = 0.30$, Type = `MECHANISTIC`, Uncertainty = 0.05 (ensemble spread), Validity = 24hrs.
  *   **Step 1 (Variance):** 0.05 < $T_{var}$ (0.15). **Pass.**
  *   **Step 2 (Lineage):** Physics engine v4.2. No target leakage possible (physics doesn't peek). **Pass.**
  *   **Step 3 (Reference Class):** Not applicable (Mechanistic). **Pass.**
  *   **Step 4 (Temporal):** Valid for 24hrs. Action happens in 1hr. **Pass.**
  *   **Step 5 (Calibration):** Not applicable (Mechanistic).
  *   **Result:** **Emit 0.30.**
  *   **Comment:** This is the ideal case. The simulation models the physical chance. The Principal Principle applies directly.

  #### Ticket B: Churn Model (Specific User)
  *   **Input:** $p_{in} = 0.80$, Type = `FREQUENTIST`, Lineage = `hash_998`, Reference Class = `Q3_Users`.
  *   **Step 1 (Variance):** Model reports confidence interval [0.78, 0.82]. **Pass.**
  *   **Step 2 (Lineage):** Registry check on `hash_998` returns `DATA_LEAKAGE_RISK == TRUE`.
      *   *Investigation:* The feature set included "cancelled_subscription_flag" which is populated at the moment of churn.
  *   **Result:** **DISCARD NUMBER.** Trigger Incident Ticket.
  *   **Comment:** This satisfies Case (c). The model reports a frequency of 80%, but it is a frequency of *past data containing the answer*, not the chance of *future behavior*. Using this would be automating a tautology. The pipeline must break here.

  #### Ticket C: Analyst SLA Prediction (Vendor Breach)
  *   **Input:** $p_{in} = 0.60$, Type = `SUBJECTIVE`, Track Record = 14/20 correct (70% accuracy).
  *   **Step 1 (Variance):** No variance reported. Apply default tax. $p_{temp} = 0.60$.
  *   **Step 2 (Lineage):** Human input. **Pass.**
  *   **Step 3 (Reference Class):** Human judgment. **Pass.**
  *   **Step 4 (Temporal):** Valid for contract quarter. **Pass.**
  *   **Step 5 (Calibration):**
      *   Sample size (20) > $T_{sample}$ (assume 10).
      *   Accuracy (0.70) > $T_{acc}$ (0.65).
      *   *However*, check calibration slope. Analyst predicts "60%" often, but events happen 70% of the time when they say 60%. They are under-confident.
      *   *Adjustment:* Map 0.60 through reliability curve $\rightarrow$ 0.70.
  *   **Result:** **Emit 0.70.**
  *   **Comment:** This satisfies Case (e). We do not defer to the analyst's *number* (0.6); we defer to the analyst's *track record* as a proxy for chance. The procedure corrects their subjective credence to match their objective frequency.

  ---

  ### 5. Limitations & Honest Constraints

  This procedure is a tool for risk management, not a truth machine. As the Senior Engineer, you must acknowledge the following to leadership:

  1.  **The "Unknown Unknown" Gap:** The procedure assumes we know *what* we don't know (e.g., we can measure variance or drift). It cannot detect novel failure modes (Black Swans) where the reference class itself becomes invalid overnight (e.g., a pandemic rendering all churn models void).
  2.  **Threshold Arbitrariness:** The values for $T_{var}$, $T_{drift}$, etc., are not derived from nature. They are cost-benefit analyses. If the cost of a false positive drops, the Platform Lead must tighten thresholds. This is a business decision disguised as an engineering spec.
  3.  **Moral Buffer:** This procedure does not absolve the team of responsibility. If Step 2 discards a number and we default to a safe action that loses money, that is a business cost. If we bypass the procedure to "save the launch," the technical debt incurred is philosophical as well as practical: we are acting on inadmissible information.
  4.  **No Ethical Weighting:** The procedure treats a 0.8 probability of "user churn" identically to a 0.8 probability of "fraud." It optimizes for calibration, not fairness. A well-calibrated model can still be systematically biased against a protected class. That check is outside the scope of PAP.

  **Sign-off:**
  *Platform Lead:* ___________________ (Sets Thresholds)
  *On-Call Engineer:* ________________ (Executes Procedure)
