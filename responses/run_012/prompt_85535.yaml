  **The question**

  The central question is whether the failure of closure and the indeterminacy of method individuation in tracking theories are distinct defects or manifestations of a single structural feature. Specifically: does reconstructing knowledge as primarily a property of the epistemic route rather than the believed proposition resolve both issues simultaneously, or does this reconstruction collapse into an existing fix? A determinate answer requires showing whether the route-first model yields stable verdicts in cases where standard tracking fluctuates based on description. The goal is to settle whether the variance in knowledge attributions stems from the theory's mechanics or from improper description of the belief-forming process. If the variance disappears under the reconstruction, the problems are unified. If it persists, they are distinct. This question admits a yes-or-no answer based on the stability of the verdicts across varied descriptions of the same case. The proposal seeks to determine if the route is the fundamental unit of knowledge.

  **What is already settled, and what is not**

  Standard interpretations treat closure failure as a theoretical cost and the method problem as a technical ambiguity requiring patching. Existing repairs either impose closure axiomatically, which contradicts the counterfactual mechanics, or rigidify the method clause, which lacks principled justification. Safety-based alternatives avoid the closure issue but lose the ability to diagnose skeptical error. This leaves open whether the instability is a bug or a feature. If the route-first reconstruction is merely a relabeling of rigidified method tracking, it offers no advance. For this project to succeed, it must demonstrate that closure failure is not a loss of knowledge but a shift in the relevant route. The unsettled matter is whether routes can be individuated normatively rather than pragmatically. If routes are fixed by the subject's actual cognitive process alone, the view collapses into standard externalism. If they are fixed by normative constraints on information flow, it constitutes a distinct position. The literature currently lacks a unified account linking the granularity of methods to the transitivity of knowledge. My work must show that the method clause is not an add-on but the core mechanism. Without this, the proposal is just another variation on sensitivity. The key is to show that the counterfactuals track the route, not the proposition, which changes the logical space. This distinction is currently blurred. Consequently, existing debates talk past one another, with some defending closure and others defending sensitivity. My project intervenes by showing these are not competing values but dependent variables.

  **The angle**

  The angle proposes that knowledge is fundamentally a relation between a subject and a fact via a specific route, with belief being derivative. This thesis predicts that verdicts on knowledge claims will stabilize when descriptions focus on the information path rather than the proposition content. Unlike patching closure, this preserves the sensitivity intuition without denying the logical gap. Unlike switching to safety, it retains the ability to explain why we lack knowledge in skeptical scenarios without conceding skepticism. Unlike biting the bullet, it explains *why* closure fails without embarrassment. The advantage lies in treating the counterfactual dependence as a property of the connection, not the proposition. This avoids the ad hoc nature of current repairs. If the route is the primary relatum, the question shifts from "Does the subject know p?" to "Is this route sufficient for knowledge of p?" This reframing dissolves the tension between sensitivity and closure by locating the variance in the route description, not the knowledge relation itself. It turns a bug into a feature. The reconstruction claims that what looks like a closure violation is actually a change in the epistemic route required for the second proposition. This predicts that when routes are held constant, closure holds. This is a testable prediction that rivals do not make. Rivals treat the proposition as the constant; I treat the route as the constant. This shift allows us to see the structural unity of the two problems. It suggests that the cost of sensitivity is not closure but descriptive precision. This is a significant theoretical gain. It means we do not have to abandon the intuitive appeal of tracking to save closure. We simply have to be more precise about what is being tracked.

  **Plan of work**

  Months one and two involve mapping the logical dependency between closure conditions and method individuation across standard counterexamples. I will formalize the route-first condition to ensure it is distinct from simple method-relativization. Months three and four focus on constructing test cases: the barn facade scenario, skeptical brain-in-a-vat hypotheses, and lottery propositions. These cases stress the theory where method description usually dictates the outcome. I will run the reconstruction against these to see if verdicts remain stable across coarse and fine descriptions. Months five and six involve drafting the argument, focusing on whether the route individuation can be principled. I will test whether the theory handles conjunction introduction without collapsing into invariantism. This specific test is crucial because conjunctions often force a shift in method description. Months seven and eight are for revision and integrating feedback from the committee, specifically checking if the distinction between route and method holds. Month nine is for final polishing. Success is measured by whether the reconstruction handles the skeptical pressure without losing everyday knowledge attributions. If the verdicts flip based on description, the reconstruction fails. If they hold, the theory survives. I will also prepare a defense against the charge that this is merely verbal. The work must show substantive difference in outcomes. I will document every case where standard tracking fails and check if the reconstruction succeeds. This empirical approach to thought experiments ensures the project remains grounded. I will write drafts of each section for advisor review midway. I will also present preliminary findings at a graduate workshop to test the intelligibility of the route-first terminology. If peers cannot distinguish the route from the method, I will need to refine the definitions in month seven. This external validation is part of the success criteria. The plan includes buffer time for unexpected technical difficulties in formalizing the counterfactuals. I will prioritize the barn case as the primary benchmark.

  **What a result would look like**

  The deliverable is a complete paper chapter ready for submission. A modest result establishes the structural link between closure and method without solving the individuation problem, showing why previous repairs failed. A good result demonstrates that the route-first reconstruction stabilizes verdicts in standard cases where tracking usually fluctuates. The best result offers a general framework for externalism that explains closure failure as a feature of route-specificity, providing a viable alternative to safety theories. Success means the committee can see a clear path from the problem diagnosis to the proposed solution without gaps. Even a negative result is valuable if it proves the problems are inseparable. The chapter will stand as a definitive treatment of the tracking theory's structural limits. It will clarify whether the cost of sensitivity is closure or methodological precision. This clarity is sufficient for a dissertation chapter regardless of the final verdict on the theory itself. The committee will be able to evaluate the argument on its own merits.

  **How it fails, and how big it is**

  The project fails if route individuation proves purely pragmatic with no normative constraints, making knowledge ascriptions arbitrary. If there is no principled way to carve routes, the reconstruction collapses into contextism. This fits within nine months if I limit the scope to the link between closure and method. If the method problem is unsolvable generally, the project shifts to defending the claim that this unsolvability is inherent to route-based theories. This is a manageable pivot. The risk is low because diagnosing the structural unity is itself a contribution. I will proceed assuming a solution is possible but prepare the deflationary account as a backup. If the method problem is unsolvable, the result is that knowledge cannot be route-first without pragmatic intrusion. This is a substantive philosophical conclusion. The timeline accommodates this pivot because the analysis of the link is the primary work.
