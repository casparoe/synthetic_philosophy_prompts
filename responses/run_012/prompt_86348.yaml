  # SEMINAR HANDOUT: The Timing of Experience
  **Topic:** The Color Phi Phenomenon

  **The Phenomenon**
  Two dots of different colors (e.g., Red, then Green) are flashed in rapid succession at two separate locations. At suitable intervals, subjects report seeing a single dot travel from the first location to the second and change color about halfway along its path. Crucially, the color change is experienced *before* the second dot has appeared. While apparent motion is familiar, this report is puzzling: the content of the second flash (Green) appears present in an experience the subject places *before* the second flash occurs. Note that the filling-in of the *trajectory* is standard apparent motion, but the filling-in of the *color* implies access to future stimulus information.

  **Decision Tree**
  *Start with the commitment: "I accept that subjects in this experiment really do see the color change before the second dot appears."*

  1.  **Is the subject's report describing a genuine sensory experience, or a belief/judgment formed after the fact?**
      *   **Judgment:** The subject infers the color change based on the final outcome; no experience of mid-path color change occurs.
          *   ➔ **LEAF: Doxastic Construction**
          *   *Awkward Commitment:* Subjects are systematically mistaken about the content of their own current experience.
      *   **Experience:** The report describes what is genuinely seen.
          *   ↓ *Proceed to 2.*

  2.  **Is the "filling in" of the color produced by the same mechanism as the motion trajectory, or by a distinct process (e.g., expectation)?**
      *   **Distinct (Expectation):** The color is supplied by prior knowledge or expectation of the sequence, not the second stimulus itself.
          *   ➔ **LEAF: Predictive Expectation**
          *   *Awkward Commitment:* Perception is largely a hallucination driven by prior knowledge rather than current sensory input.
      *   **Same Mechanism:** The color is determined by the processing of the stimuli themselves.
          *   ↓ *Proceed to 3.*

  3.  **Is there a determinate fact about when this content becomes conscious that any possible experiment could distinguish?**
      *   **No:** The question presupposes a precise moment of "becoming conscious" that does not exist.
          *   ➔ **LEAF: Temporal Indeterminacy**
          *   *Awkward Commitment:* There is no truth of the matter about when our own experiences occur.
      *   **Yes:** There is a fact of the matter about the timing of content entry.
          *   ↓ *Proceed to 4.*

  4.  **Must we posit a specific experience of the color change, or is it enough that the brain produces equivalent internal states?**
      *   **Equivalent States:** No experience of change is needed; only functionally equivalent neural states are required.
          *   ➔ **LEAF: Eliminativism**
          *   *Awkward Commitment:* The "experience" we discuss is a fiction; only neural processing exists.
      *   **Specific Experience:** A genuine experience of the color change must be accounted for.
          *   ↓ *Proceed to 5.*

  5.  **Is the reconciliation of the two stimuli completed before the content enters consciousness, or after?**
      *   **After:** The experience is veridical in real time, but the memory is revised afterward to include the color change.
          *   ➔ **LEAF: Orwellian Revision**
          *   *Awkward Commitment:* We cannot trust our memories of very recent experiences, as they are systematically edited.
      *   **Before:** The content is reconciled before it enters consciousness.
          *   ↓ *Proceed to 6.*

  6.  **Does the brain wait for the second stimulus before processing the first (buffer), or does the second stimulus retroactively modify the processing of the first?**
      *   **Buffer:** The first stimulus is held in a pre-experiential waiting room until the second arrives.
          *   ➔ **LEAF: Stalinesque Delay**
          *   *Awkward Commitment:* Conscious experience is always slightly delayed relative to the world; we live in the past.
      *   **Retroactive Modification:** The second stimulus alters the processing of the first in real-time without a waiting period.
          *   ➔ **LEAF: Retroactive Modulation**
          *   *Awkward Commitment:* Later events can causally alter the processing of earlier events without invoking memory revision.

  ***

  **Meta-Commentary on the Tree**

  *   **Unoccupied Combinations:** The tree leaves unoccupied the combination of *Eliminativism* with *Orwellian Revision*. This is incoherent: if there is no specific experience (Eliminativism), there is nothing veridical to be revised in memory (Orwellian).
  *   **Indistinguishable Leaves:** The tree cannot in principle separate **Stalinesque Delay** and **Orwellian Revision** via third-person experiment. Both predict identical behavior and neural timing relative to the report.
      *   *Consequence:* If these two families cannot be distinguished by any experiment, the branch at Node 5 is purely metaphysical. This lends support to the **Temporal Indeterminacy** leaf (Node 3), suggesting the distinction itself may be ill-posed.
  *   **Trajectory vs. Color:** Node 2 registers the distinction between the motion path (standard filling-in) and the color (the anomalous content). Positions that treat them identically proceed to Node 3; positions that treat color as expectation branch off.
