  2.  **Deconstruct the Philosophical Positions:**
      *   *Dialetheism (Priest-style):* True contradictions exist ($A \land \neg A$). Logic is paraconsistent (LP, etc.). Negation is normal, but truth values overlap.
      *   *Paraconsistentism without Dialetheism (e.g., Agnostic, Epistemic, or Instrumentalist):* Logic is paraconsistent to handle *inconsistent information*, but the world/theory itself shouldn't be described as having true contradictions. Might use many-valued logic where "both" is just a third value, not truth+falsehood. Or they might treat negation differently (e.g., minimal logic).
      *   *The Conflict:* The Dialetheist says "It *is* true and false." The Paraconsistentist says "It is *neither* determinately true nor false" or "The system is inconsistent, but reality isn't."
      *   *The "Explosion" Agreement:* Both agree $A, \neg A \vdash B$ is invalid.
      *   *The "Negation" Problem:* Can the Paraconsistentist express "Not both"? Can the Dialetheist express "Exclusive disjunction"? This is the "expressive completeness" problem.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound formal but personal. "Joint Statement on Paraconsistency and Truth."
      *   **Preamble:** Acknowledge the history, the fatigue, and the goal.

