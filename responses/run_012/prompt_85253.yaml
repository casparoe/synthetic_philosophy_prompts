          1.  Numbered Agreed Claims (including what paradoxes force, what each refuses to say).
          2.  Real Disagreements (phrased in each person's preferred voice).
          3.  The Cruxes (sub-questions that could move them, including formal tests like Strengthened Liar/Curry, conditions for abandonment).
