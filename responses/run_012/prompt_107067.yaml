answer: |-
  # Joint Statement on the Metaphysics and Semantics of Omissive Causation
  **Signed by the Omission-Inclusionist Working Group and the Omission-Exclusionist Working Group**

  ## Preamble
  Following a period of adversarial collaboration, the undersigned parties acknowledge that while deep metaphysical divides remain regarding the nature of causation by omission, significant convergence has been achieved regarding the functional role of omission-talk, the constraints of counterfactual dependence, and the distinction between causal status and causal selection. This document outlines our shared commitments, identifies the precise locus of our remaining disagreements, and utilizes specific test cases to delineate where our predictions diverge.

  ## Part I: Agreed Test Cases and Phenomena
  Before articulating our theoretical commitments, we agree that any adequate theory of causation must account for the intuitions and judgments arising in the following four categories of cases. We agree these cases require explanation, even if we explain them differently.

  1.  **Ordinary Omissions:** Cases where an agent fails to act, and a negative outcome ensues (e.g., a gardener fails to water a plant, and the plant dies). Both sides agree the gardener is the primary target of explanation and responsibility.
  2.  **Prevention:** Cases where an action stops a potential cause from producing its effect (e.g., a fielder catches a ball, preventing a window from breaking). Both sides agree the catch is causally relevant to the window's integrity.
  3.  **Double Prevention:** Cases where an action removes a preventer, thereby allowing an effect to occur (e.g., shooting a guard who was preventing a prisoner's escape). Both sides agree the shooter is intimately linked to the escape.
  4.  **Preemptive Substitutes (Overdetermination by Omission):** Cases where an agent omits an action, but a substitute agent would have performed the action anyway (e.g., Gardener A fails to water, but Gardener B was standing by ready to water if A failed). Both sides agree this scenario tests the limits of causal dependence versus causal sufficiency.

  ## Part II: Agreed Claims
  Despite our metaphysical differences, we endorse the following claims as a baseline for future discourse:

  1.  **Metaphysics of Absences:** We agree that absences do not involve the transfer of energy, matter, or physical force. We agree that if omissions are causes, they are causes of a distinct ontological category than positive events (processes, objects, or tropes).
  2.  **The Role of Counterfactuals:** We agree that counterfactual dependence is a necessary condition for identifying a candidate omission as causally relevant. If the outcome would have occurred regardless of the omission (as in the Preemptive Substitutes case), the omission loses its causal or quasi-causal status.
  3.  **Causing vs. Merely Allowing:** We agree there is a robust intuitive distinction between *causing* harm (positive action) and *allowing* harm (omission). We agree this distinction matters for moral and legal reasoning, even if we disagree on whether it marks a metaphysical boundary in causation itself.
  4.  **Responsibility Independence:** We agree that causal claims (whether regarding omissions or actions) are not sufficient for moral or legal responsibility. Responsibility requires additional conditions, such as duty of care, capacity to act, and foreseeability. Conversely, we agree that one can be morally responsible for an outcome one did not causally produce (e.g., vicarious liability), though this is less common.
  5.  **Causal Selection:** We agree that in any given scenario, there are vastly more "causes" (or causally relevant factors) than are typically cited in ordinary language. We agree that pragmatic factors (salience, norms, interests) determine which factors are *selected* for mention in causal claims.

  ## Part III: Disagreements Table
  The following table isolates the residual disagreements. We have endeavored to state these in neutral terminology acceptable to both camps. We have also flagged areas where the dispute appears to be merely verbal.

  | # | Disagreement Topic | Neutral Formulation of the Dispute | The Crux | Concrete Test Case & Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Ontological Status** | **Do absences function as causal relata?** <br>*(Inclusionists: Yes. Exclusionists: No, they are background conditions.)* | Whether the causal relation requires the existence of positive entities only, or if negative facts can stand in relations. | **The Vacuum Case:** A seal fails, air rushes out, a bell stops ringing.<br>**Inclusionist Prediction:** The absence of the seal caused the air movement.<br>**Exclusionist Prediction:** The rupture of the seal (positive event) caused the air movement; the absence is merely the context. |
  | **2** | **Causal Explosion** | **Does counting omissions as causes lead to unacceptable proliferation?** <br>*(Inclusionists: No, selection rules handle this. Exclusionists: Yes, it distorts the concept of cause.)* | Whether pragmatic selection is sufficient to filter the infinite number of possible omissions, or if the ontology itself must restrict them. | **The Distant Star:** A star fails to explode, allowing me to type this sentence.<br>**Inclusionist Prediction:** This is a true but trivial causal claim, filtered by pragmatics.<br>**Exclusionist Prediction:** This is false. It is not a cause at all, trivial or otherwise. |
  | **3** | **The Two Lifeguards** | **Do distinct omissions with identical counterfactual dependence share identical causal status?** <br>*(See detailed analysis below.)* | Whether blameworthiness tracks causal status or diverges from it. | **Case:** Lifeguard A is asleep (negligent). Lifeguard B is awake but refuses to act (malicious). Swimmer drowns. Both had duty and capacity.<br>**Inclusionist Prediction:** Both omissions are genuine causes of death. B's omission may be more *salient* for blame, but both are causes.<br>**Exclusionist Prediction:** Neither omission is a cause of death. The water/gravity/physiology caused the death. Both are *responsible* for the death, but B is more blameworthy due to intent. |
  | **4** | **Verbal Dispute Flag** | **Is the disagreement merely about the label "cause"?** | Whether "cause" is a natural kind term or a pragmatic tool. | **Analysis:** We flag this as a **Partial Verbal Dispute**. <br>If Inclusionists define "cause" as "counterfactually necessary condition + norm," and Exclusionists define "cause" as "energy transfer," they talk past each other. <br>**Resolution:** We agree to distinguish **Causal Status** (metaphysical) from **Causal Attribution** (pragmatic/normative). The dispute remains substantive regarding *Status*. |

  ## Part IV: Special Analysis of "The Two Lifeguards"
  *Per the collaboration mandate, we provide a specific joint analysis of this case to determine if the disagreement survives the separation of causal status from causal selection.*

  **The Scenario:**
  *   **Lifeguard A:** Asleep on the job (unconscious omission).
  *   **Lifeguard B:** Awake, sees swimmer, chooses not to intervene (conscious omission).
  *   **Outcome:** Swimmer drowns.
  *   **Conditions:** Both had a duty, both had the physical capacity to save the swimmer, and either one acting alone would have prevented the death.

  **1. Agreement on Causal Selection and Responsibility**
  Both camps agree on the following practical judgments:
  *   Both Lifeguard A and Lifeguard B are morally and legally responsible for the death.
  *   Lifeguard B is likely *more* blameworthy than Lifeguard A due to the intentional nature of the refusal versus negligence.
  *   In a court of law or ordinary conversation, both will be cited as the "reason" the swimmer died.

  **2. Disagreement on Causal Status**
  Here, the disagreement does not dissolve.
  *   **The Inclusionist Position:** The death was caused by the lack of rescue. Since both A and B failed to rescue, both omissions are genuine causes. The difference in blameworthiness is a matter of *mens rea* (mental state), not causal metaphysics. To say B did not "cause" the death is to distort the explanatory picture.
  *   **The Exclusionist Position:** The death was caused by the physiological process of drowning (water in lungs, hypoxia). Neither A nor B caused the death; they failed to *prevent* the cause. To say they "caused" the death conflates *preventing a prevention* with *causing*. The difference in blameworthiness tracks with their deviation from normative duty, not causal contribution.

  **3. Does the Disagreement Survive Separation of Status and Selection?**
  **Yes.**
  Even if we grant that "causal selection" (what we talk about) is driven by norms, the camps disagree on the underlying **Causal Status** (what is true).
  *   For the **Inclusionist**, the statement "A's omission caused the death" is *true* in virtue of the metaphysical structure of the world (counterfactual dependence + absence).
  *   For the **Exclusionist**, the statement "A's omission caused the death" is *false* in virtue of the metaphysical structure of the world (no process connection), even if it is *useful* or *acceptable* to assert it in a legal context.

  ## Part V: Conclusion
  We conclude that while our practical recommendations for law and ethics often converge (both hold the lifeguards responsible), our metaphysical commitments diverge sharply. The Inclusionists maintain that omitting to act is a way of making the world happen. The Exclusionists maintain that omitting to act is a way of failing to change the world. We agree that this distinction is not merely verbal, as it impacts how we model causal networks in science, law, and AI: one model treats absences as nodes; the other treats them as missing edges.

  **Signed,**

  *The Omission-Inclusionist Working Group*
  *The Omission-Exclusionist Working Group*
  *Date: October 26, 2023*
