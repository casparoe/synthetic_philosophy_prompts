  6.  **Synthesize the "Wheels Coming Off":**
      *   **Point 1: Circularity.** The "unless interfered with" clause needs to be cashed out. If you say "unless something prevents the manifestation," you need to know what the manifestation of *that disposition* is. You can't define the disposition using the clause without presupposing the disposition.
