      *(Self-Correction during drafting)*: Wait, I need to be precise about the Allais diagnosis. CPT explains Allais via overweighting small probabilities of the best outcome or certainty effect. REU explains it via the global risk attitude applied to the cumulative distribution. A risk-averse agent values the "sureness" more than the EV suggests. I should clarify that REU doesn't necessarily rely on "overweighting small probabilities" in the CPT sense (which is local), but rather on the global shape of $r$.

      *(Refining `framing_correction`)*: The user asks "if r is simply a cumulative distribution function over outcomes". This is technically wrong. $r$ maps $[0,1]$ to $[0,1]$. It is not a CDF over outcomes (which would map outcomes to $[0,1]$). It transforms the cumulative probability *of* outcomes.

      Let's assemble the JSON.

      *   `direct_answer`: REU maintains the separation because $p$ represents credence (belief about states), while $r$ represents a global attitude toward the distribution of utility. $r$ does not describe the world; it describes how the agent values security vs. potential.
