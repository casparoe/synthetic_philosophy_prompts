answer: |-
  ### The Meta-Answer: Is a Single Theory a Mistake?

  Yes. You should drop the assumption that a single, unified theory exists.

  In contemporary philosophy and economics, the project of finding one "master principle" (like *only consent matters* or *only welfare matters*) that solves every case you listed is widely considered a failure. The moral landscape of markets is pluralistic. The reasons we forbid selling votes are categorically different from the reasons we restrict kidney sales, which are different again from the reasons we scorn price gouging.

  If someone hands you a tidy, single-principle theory, they are likely ignoring half your cases or redefining terms until they break. The honest answer is an **inventory**, not a formula. However, even an inventory must meet standards of adequacy. Below are the requirements any plausible account (whether a single theory or a pluralistic inventory) must satisfy to be taken seriously.

  ---

  ### The Requirements for Adequacy

  Here are the four non-negotiable constraints. If an account fails any of these, it is incomplete.

  #### 1. The Consent-Override Requirement
  *   **The Forcing Case:** **Selling a Vote** and **Selling a Kidney.**
  *   **The Constraint:** The account must explain why a fully informed, uncoerced "yes" is sometimes insufficient to make a transaction moral.
  *   **Why Non-Negotiable:** If a theory says "consent is sufficient," it must permit vote-selling (which almost no legal or moral system does) and unrestricted organ sales (which most systems restrict). Since there is a strong, cross-cultural intuition that some things are *inalienable* regardless of consent, a theory that cannot override consent is descriptively inadequate to our moral reality.
  *   **Status:** **Non-Negotiable.** (Unless you are willing to argue that vote-selling *should* be legal, in which case you are advocating for revolution, not explaining current norms.)

  #### 2. The Efficiency-Override Requirement
  *   **The Forcing Case:** **Price Gouging** (Water/Generators after a hurricane).
  *   **The Constraint:** The account must explain why maximizing supply and allocating goods to those willing to pay most (economic efficiency) is sometimes morally forbidden, even if it saves lives by bringing more goods to market.
  *   **Why Non-Negotiable:** Standard economics suggests price caps cause shortages. Yet, morally, we condemn profiteering from desperation. A theory that cannot explain why "making the pie bigger" is sometimes wrong fails to capture the moral objection to exploitation.
  *   **Status:** **Non-Negotiable.**

  #### 3. The Positional-Distinction Requirement
  *   **The Forcing Case:** **Selling a Vote** (Forbidden) vs. **Selling a Place in a Queue** (Permitted).
  *   **The Constraint:** The account must distinguish between two forms of inequality. Both votes and queue positions are "positional goods" (if I have more, you have less). Both allow the rich to bypass the poor. The theory must explain why one creates an illegitimate hierarchy and the other is a benign service.
  *   **Why Non-Negotiable:** If a theory objects to markets because they "create inequality," it must forbid queue-scalping. If it permits queue-scalping, it cannot simply cite inequality as the reason for forbidding vote-selling. It must identify a specific *kind* of equality that matters.
  *   **Status:** **Non-Negotiable.** (This is where most theories fail silently.)

  #### 4. The Agency-Integrity Requirement
  *   **The Forcing Case:** **Substitute Participation** (Hired mourners, proxy punishment, paying someone to sit with your dying mother).
  *   **The Constraint:** The account must define the boundary between a *task* (which can be outsourced) and an *act* (which constitutes who you are). It must explain why the identity of the agent matters for some transactions but not others.
  *   **Why Non-Negotiable:** You can pay a plumber to fix a leak (task). You cannot (morally) pay a proxy to serve your jail time or mourn your friend (act). If a theory treats all labor as commodifiable services, it cannot explain why the *source* of the action matters in the latter cases.
  *   **Status:** **Non-Negotiable.**

  ---

  ### The Collisions: Where the Requirements Break

  You asked for the part where the list itself is the answer. Here is where the requirements fight each other. You cannot satisfy all four simultaneously without arbitrariness.

  #### Collision A: Consent-Override vs. Agency-Integrity
  *   **The Conflict:** To satisfy **Agency-Integrity**, you must say, "You cannot sell this act because it is constitutive of your self." To satisfy **Consent-Override**, you must say, "Your consent is not enough to authorize this sale."
  *   **The Problem:** Who decides what is "constitutive of your self"?
      *   If *you* decide, then Consent rules, and you can sell your vote or kidney if you choose to define them as property.
      *   If *society/theory* decides, then Consent is violated. You are being told what your own actions mean.
  *   **The Collision:** You cannot respect the sovereign agent (Consent) while simultaneously protecting the agent from their own definition of their agency (Integrity). Any theory here must either patronize the agent ("You don't understand what selling a kidney means") or abandon the protection ("If you want to sell it, it's fine").

  #### Collision B: Positional-Distinction vs. Efficiency-Override
  *   **The Conflict:** **Efficiency-Override** says we forbid price gouging to protect the vulnerable from exploitation. **Positional-Distinction** says we forbid vote-selling to protect democratic equality.
  *   **The Problem:** Queue-scalping is *also* price gouging (charging more for water/time during scarcity) and *also* creates inequality (rich skip the line).
      *   If you ban price gouging on water because "necessities shouldn't be rationed by price," you should ban queue-scalping.
      *   If you allow queue-scalping because "time is a commodity," you should allow hurricane price hikes.
  *   **The Collision:** Most theories draw a line between "Political/Civic" goods (Votes) and "Commercial" goods (Queues/Water). But in a crisis, water becomes political. In a bureaucracy, queue positions become civic. The requirements demand a bright line where there is only a gradient.

  ---

  ### The Killer Requirement

  If you want to rule out the main families of answers quickly, test them against **Requirement #4: The Agency-Integrity Requirement (Substitute Participation).**

  This requirement does the most damage because it forces a theory to explain the *metaphysics of the self*, which most economic and political theories try to avoid.

  Here is how the families fare against it:

  1.  **The Consent-and-Coercion Family:** **Fails.**
      *   *Why:* If the mourner consents and the bereaved consents, the transaction is valid. This family cannot explain why hiring a mourner feels like a fraud even when voluntary. It treats the self as a black box of preferences.
  2.  **The Welfare-and-Consequences Family:** **Fails.**
      *   *Why:* A hired professional might mourn *better* (more convincing weeping) or serve a prison sentence *more efficiently* (less suffering for the convict). If the outcome is better, the transaction should be permitted. This family cannot explain why the *process* matters more than the *result*.
  3.  **The Equality-and-Subordination Family:** **Struggles.**
      *   *Why:* While it explains why we shouldn't pay the poor to suffer for the rich (proxy punishment), it struggles with private acts. If I pay a friend to sit with my mother, no structural subordination occurs, yet it still feels like a violation of duty. It reduces all wrongs to power dynamics, missing the personal/relational dimension.
  4.  **The Meaning-and-Corruption Family:** **Survives (Best Fit).**
      *   *Why:* This family argues that markets change the *meaning* of the good. Paying someone to mourn turns grief into a service, corrupting the relationship.
      *   *The Catch:* It is vague. It often relies on intuition ("It just degrades the act") rather than a rigorous mechanism. It passes the test but lacks predictive power.

  ### Summary

  The question you are asking assumes there is a "correct" boundary between the market and the non-market. The requirements above show that the boundary is actually a set of **tensions** between Consent, Efficiency, Equality, and Integrity.

  *   If you prioritize **Consent**, you must accept organ markets and vote selling.
  *   If you prioritize **Equality**, you must ban queue-scalping.
  *   If you prioritize **Integrity**, you must restrict what people can do with their own bodies and time.

  The "answer" is not a theory that resolves these tensions, but a framework that admits them. If a theorist tells you they have solved the tension between **Agency-Integrity** and **Consent** without remainder, they are selling you something. Do not buy it.
