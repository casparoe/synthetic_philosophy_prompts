      *   *Refining the "Knock Down":* The user claims the reasoning is sound. The counter-claim is that the reasoning relies on an equivocation of "know". If "know" means "deduce from the announcement", the announcement is false. If "know" means "have justified true belief", the announcement can be true. The students cannot deduce the day, so they are surprised. The induction fails because you cannot use the announcement to prove the announcement false. (Quine's line).
