      *   *Epistemic Logic/Knowledge vs. Provability:* The core issue is usually conflating "knowing" with "proving". If "surprise" means "cannot deduce with certainty", the induction holds. If "surprise" means "cannot know with justification", the induction might fail because knowledge requires truth, and you can't know a falsehood (the reduced statement).
      *   *The "Open Future" / Indexicality:* The statement "You will not know today is the day" is indexical. On Wednesday morning, the statement changes truth value.
      *   *Common Knowledge:* The assumption that everyone knows everyone knows the announcement is crucial. If this breaks, induction fails.
