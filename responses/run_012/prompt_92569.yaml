      *   *Is this just relabelling?* The user might say "Yes, that's what I meant by inconsistent." I need to push further. The distinction is: Does the inconsistency prevent the exam? No. It prevents the *knowledge* of the exam. The teacher can still give the exam. The user says "an exam... can't be a genuine surprise". The counter is: It *is* a surprise precisely *because* the announcement is inconsistent with known knowledge. The inconsistency *creates* the surprise. The user thinks inconsistency prevents the scenario. The counter is that inconsistency enables the surprise.
