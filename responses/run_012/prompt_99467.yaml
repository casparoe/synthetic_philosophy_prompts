answer: |-
  You have accurately described a specific cluster of concepts that sits at the intersection of game theory, decision theory, and computer science. The pattern you are identifying does have established names, though the terminology splits depending on whether you approach it from formal game theory, the "rationalist" decision theory community (MIRI/LessWrong), or popular science.

  Here is the breakdown of the names, the specific variants, and the structural relationship between them.

  ### 1. The Core Names

  **The Formal Game-Theoretic Name: Program Equilibrium**
  Coined by Moshe Tennenholtz (2004), this is the precise formalization of your symmetric setup. In a "program game," players submit source code rather than simple actions. The code can read the opponent's code. If both submit code that says `if opponent.cooperates_with_me: cooperate else: defect`, and the code allows for sufficient logical inference (often using Gödelian self-reference or Löb's Theorem), mutual cooperation becomes a Nash Equilibrium.

  **The Decision-Theoretic Name: Logical Decision Theory (LDT)**
  Within the community that developed these ideas further (primarily Eliezer Yudkowsky, Nate Soares, and others at MIRI), this falls under **Logical Decision Theory**. Specific iterations include **Timeless Decision Theory (TDT)** and **Updateless Decision Theory (UDT)**.
  *   **The Mechanism:** These theories argue that your decision is not a causal event that happens *after* the setup, but a logical output that is correlated with other logical processes sharing your source code or reasoning structure.
  *   **The Phenomenon:** **Acausal Trade** (or Acausal Cooperation). This is the label for the *outcome* you described: cooperation without causal contact, based solely on logical correlation.

  **The Specific Algorithm: FairBot**
  The rule you described ("Cooperate exactly if I can see that the other will") is a simplified description of an algorithm known as **FairBot** (formalized by Critch, Herreshoff, et al.).
  *   *FairBot:* Cooperates if it can *prove* the opponent cooperates with it.
  *   *PrudentBot:* A more robust variant that cooperates with FairBot but defects against unconditional cooperators (to avoid exploitation).
  *   *The Logic:* In the symmetric case, FairBot cooperates with FairBot via **Löb's Theorem**. Each proves that "If I cooperate, you cooperate," which triggers the cooperation.

  ### 2. Analyzing the Variants

  You asked whether the one-way and probabilistic cases are distinct structures or the same phenomenon. The consensus in this literature is that they are the **same phenomenon** (logical correlation) operating under different **epistemic conditions**.

  #### The Symmetric Case (Program Equilibrium)
  *   **Status:** The canonical case.
  *   **Structure:** Mutual transparency.
  *   **Why it works:** Logical identity. Both agents are running logically equivalent procedures that reference each other. The "fixed" nature of the answer comes from the fact that the logical truth value of "We Cooperate" is provable within the system.

  #### The One-Way Case (Acausal Control)
  *   **Status:** An asymmetric instance of the same phenomenon.
  *   **Structure:** A reads B; B does not read A.
  *   **Why it works:** This is often discussed under the header of **Acausal Control**.
      *   For this to work, B must *know* (or strongly believe) that A is running a matching algorithm (like FairBot), even if B cannot see A's code.
      *   B reasons: "My output is a logical fact. A's algorithm takes my output as an input (via simulation or proof). Therefore, my decision logically determines A's decision."
      *   B cooperates to *cause* A to cooperate, not because B sees A's code, but because B knows A is the *type* of agent that matches B.
      *   **Verdict:** This is not a distinct structure; it is the symmetric case with lopsided information but shared knowledge of decision-types. It relies on the same logical dependency: $Output_B \rightarrow Output_A$.

  #### The Probabilistic Case (Superrationality)
  *   **Status:** The "noisy" cousin; same phenomenon, degraded by uncertainty.
  *   **Structure:** Uncertain visibility or uncertain types.
  *   **Why it works:** This aligns closely with Douglas Hofstadter's concept of **Superrationality** (1983). Hofstadter argued that in a one-shot Prisoner's Dilemma, if you assume the other player is "superrational" (i.e., reasons exactly as you do), you should cooperate.
      *   If there is a probability $P$ that the other agent is a "matcher" (LDT type) and $(1-P)$ that they are a standard defector (Causal Decision Theory type), you calculate Expected Utility.
      *   If $P$ is high enough, the logical correlation outweighs the risk of exploitation.
      *   **Verdict:** This is the same phenomenon viewed through the lens of **Logical Uncertainty**. In formal LDT, this is handled by assigning probabilities to logical statements (e.g., "What is the probability that this code outputs Cooperate?").

  ### 3. The Unifying Principle: Logical Correlation vs. Causal Influence

  The reason the standard names (like "Iterated Prisoner's Dilemma" or "Reciprocal Altruism") did not fit your intuition is that those rely on **causal** links (I help you now so you help me later).

  Your setup relies on **logical correlation**.
  *   **Causal Decision Theory (CDT):** "My choice cannot change the past or the other's independent choice. I should defect."
  *   **Logical Decision Theory (LDT):** "My choice is a logical output. The other agent's choice is a function of that same logical output (either by reading my code or by reasoning identically). Therefore, choosing 'Cooperate' selects the world where we both cooperate."

  ### Summary of Terminology

  | Feature | Formal Game Theory | Decision Theory (MIRI/LessWrong) | Pop-Sci / Philosophy |
  | :--- | :--- | :--- | :--- |
  | **The Setup** | Program Equilibrium | Logical Decision Theory (LDT) | Superrationality |
  | **The Interaction** | Source Code Visibility | Acausal Trade | Newcomblike Problems |
  | **The Algorithm** | Modal Agents | FairBot / PrudentBot | "The Kantian Agent" |
  | **The One-Way Variant** | Asymmetric Program Game | Acausal Control | Logical Leverage |
  | **The Probabilistic Variant**| Bayesian Program Game | Logical Induction | Hofstadter's Superrationality |

  ### Answering Your Edge Questions

  1.  **Does this have an established name?**
      Yes. **Program Equilibrium** is the rigorous game-theoretic term. **Acausal Trade** is the broader decision-theoretic term. **FairBot** is the specific algorithm you described.

  2.  **Which of the three fall under it?**
      All three fall under **Logical Decision Theory**.
      *   **Symmetric:** The idealized limit (Probability = 1, Visibility = 1).
      *   **One-Way:** A subset where visibility is 0 for one party, but *knowledge of type* is 1. It is the symmetric structure with lopsided parts.
      *   **Probabilistic:** The real-world application where visibility and type-knowledge are $< 1$. It is the same phenomenon, but the "cooperation equilibrium" becomes a mixed strategy dependent on the probability threshold.

  3.  **Is the one-way case distinct?**
      No. It relies on the same logical dependency ($A \approx f(B)$). The only difference is that B must infer $f$ rather than reading it directly. If B knows A is a FairBot, B knows A is simulating B. B's code doesn't need to read A; B's *reasoning* about A does the work.

  4.  **Is the probabilistic case a cousin?**
      It is the same phenomenon under **logical uncertainty**. In the symmetric case, the correlation is a logical proof (100%). In the probabilistic case, the correlation is a statistical belief (e.g., 90%). The decision calculus remains the same: maximize expected utility over the logical consequences of your output.

  ### Recommended Reading
  If you want to explore the edges you identified, look for:
  *   **"Program Equilibrium"** by Moshe Tennenholtz (2004).
  *   **"Robust Cooperation in the Prisoner's Dilemma"** by Critch et al. (2014) — *This defines FairBot and PrudentBot.*
  *   **"Timeless Decision Theory"** by Eliezer Yudkowsky (2010).
  *   **"Superrationality"** by Douglas Hofstadter (1983) — *For the probabilistic/philosophical ancestor.*
  *   **"Acausal Trade"** (LessWrong Wiki) — *For the synthesis of these concepts.*

  You have essentially rediscovered the motivation for Logical Decision Theory: the realization that in a universe of deterministic (or logically constrained) agents, "causal isolation" does not imply "logical isolation."
