answer: |-
  Right, let's treat this like a system design doc. You're asking for the interface specification for "Representation" in a neural net. If we treat "Representation" as a component claim, we need to define its contract. If a theory of representation violates these constraints, it's either mathematically incoherent or it's defining a different object entirely.

  Here is the spec. I have tagged each requirement as **Non-Negotiable** (logical/mathematical necessity) or **House Style** (a preference of a specific interpretability camp that might be prejudicial).

  ### The Spec: Desiderata for Neural Representation

  #### 1. Basis Invariance (Non-Negotiable)
  **The Constraint:** The theory cannot assign different representational status to activation vectors that are related by a symmetry of the network architecture (e.g., permuting hidden units, rotating a subspace where the activation function permits, or scaling weights inversely).
  **The Motivation:** You flagged this: permute the hidden units, and the behaviour is identical. If Theory A says "Unit 5 represents *edge*" and Theory B (on the permuted net) says "Unit 12 represents *edge*", the theory must acknowledge these are the *same* representation. If the theory relies on a specific coordinate system (e.g., "a feature is a single neuron direction"), it fails immediately on standard MLPs.
  **The Trap:** Many "feature visualization" techniques fail this because they visualise weights in a specific basis. A robust theory must define representations as subspaces or equivalence classes, not specific vectors.

  #### 2. Causal Efficacy (Non-Negotiable)
  **The Constraint:** For a latent variable to count as a representation *used by the network*, manipulating it must change the output distribution, holding other relevant factors constant. Recoverability is not usage.
  **The Motivation:** You can train a decoder to recover the training set index from random noise if you overfit, or recover a latent from a layer that the network subsequently ignores. If I can linearly decode "sentiment" from a layer, but ablating that direction changes nothing, the network isn't representing sentiment; *you* are representing sentiment using the network as a storage medium.
  **The Trap:** Correlational accounts (probing) fail this. They conflate "information present in the activations" with "information used by the mechanism".

  #### 3. Readout Complexity Bound (Non-Negotiable)
  **The Constraint:** The theory must penalise the complexity of the decoder/probe. If extracting the "representation" requires a readout function as complex as the network itself, the claim is vacuous.
  **The Motivation:** A universal approximator can decode anything from anything given enough capacity. If your theory says "X is represented" but requires a 10-layer MLP to decode X from the activations of layer 5, you haven't found a representation; you've just distributed the computation between the main net and the probe.
  **The Trap:** Linear probing is a heuristic for this, not a law. The constraint is actually: *Complexity(Readout) << Complexity(Network)*. If the readout is too complex, the "representation" is just encryption.

  #### 4. Superposition Compatibility (Non-Negotiable)
  **The Constraint:** The theory must allow for multiple features to share the same physical dimensions (neurons/directions) without collapsing them into a single "average" feature.
  **The Motivation:** We know networks use superposition (more features than dimensions) to compress information. A theory that demands "one feature, one direction" (localist) is empirically false for larger models. It must account for features that are only separable in a non-linear manifold or via sparse combinations.
  **The Trap:** Simple vector arithmetic (King - Man + Woman) assumes orthogonality. A robust theory needs to handle polysemanticity (one neuron, many features) and superposition (one direction, many features).

  #### 5. Task Relevance / Grounding (Non-Negotiable)
  **The Constraint:** The theory must distinguish between features causally linked to the loss function and spurious correlates that are merely present in the data.
  **The Motivation:** Your spurious shortcut case. If a network classifies cows by "green pasture" instead of "cow shape", does it represent "cow"? It represents "green pasture" causally. A theory that says it represents "cow" because the label says "cow" is conflating the engineer's intent with the mechanism's operation.
  **The Trap:** Anthropocentric labelling. The network doesn't know your class names. It only knows the loss landscape.

  #### 6. Anthropocentrism Independence (House Style)
  **The Constraint:** The theory should not require a human-interpretable concept to exist for a representation to exist.
  **The Motivation:** You asked: "Does it represent a feature if no human concept lines up?" There is no reason the internal code of a high-dimensional optimiser must map to English nouns. There may be "alien concepts" that are computationally vital but semantically null to us.
  **The Trap:** Dismissing internal structure as "noise" just because we can't name it. This is a prejudice of the interpretability community, not a mathematical requirement.

  #### 7. Uniqueness of Solution (House Style - *Likely False*)
  **The Constraint:** (Often demanded) The theory should identify a *unique* set of features for a given task.
  **The Motivation:** Engineers like canonical forms. We want *the* representation.
  **The Trap:** This is where your rotation case bites. If two networks solve the task identically but their internal latents differ by a fixed rotation (and no behavioural test distinguishes them), demanding a unique representation forces the theory to pick one arbitrarily. A better theory admits an *equivalence class* of representations.

  ---

  ### The Incompatibilities (The "No-Go" Theorems)

  You suspected some subset of these is jointly unsatisfiable. You are correct. You cannot maximise all of these simultaneously. Here are the hard trade-offs.

  **1. Causal Isolation vs. Superposition Efficiency**
  If you demand **Causal Efficacy** (Requirement 2) in its strongest form (intervene on feature A without touching feature B), you effectively demand orthogonality. But **Superposition Compatibility** (Requirement 4) tells us features are entangled to save space.
  *   *The Conflict:* You can have a theory where features are causally isolated (nice for intervention), or you can have a theory that accounts for how the network actually stores information densely (superposition). You generally cannot have clean causal interventions on individual features *and* admit that the network is using superposition heavily, because intervening on one feature in superposition inevitably noise-injects the others.
  *   *Verdict:* A theory that insists on clean causal levers is likely describing a simplified abstraction of the net, not the net itself.

  **2. Basis Invariance vs. Uniqueness**
  If you demand **Basis Invariance** (Requirement 1), you must accept that representations are defined modulo symmetries (rotations, permutations). If you demand **Uniqueness** (Requirement 7), you must break that invariance.
  *   *The Conflict:* Your toy setup with the fixed rotation. If the behaviour is identical, the "real" representation is the *equivalence class* of all rotations. Any theory that points to one specific basis and says "This is the representation" violates Basis Invariance.
  *   *Verdict:* You must drop Uniqueness. The "real representation" is the orbit of solutions, not a single point. This feels unsatisfying to an engineer wanting a spec, but it's the mathematical reality.

  **3. Readout Simplicity vs. Richness**
  If you enforce a strict **Readout Complexity Bound** (Requirement 3), you will miss features that are encoded in complex, non-linear ways. If you allow complex readouts to capture **Richness**, you risk vacuity (decoding anything).
  *   *The Conflict:* There is no sharp phase transition between "representation" and "encryption". It's a continuum. A hard threshold is arbitrary.
  *   *Verdict:* The theory must be probabilistic or graded, not binary. "Degree of representationalisation" rather than "Is it a representation?".

  ---

  ### Scorecard: How the Camps Fare

  Here is how the main families of account stack up against the spec.

  **1. The Probe/Decode Crowd (Linear Probing, Representational Similarity)**
  *   **Passes:** Basis Invariance (mostly, if using similarity metrics), Human Independence.
  *   **Fails:** **Causal Efficacy** (Critical failure). They measure information presence, not usage. They conflate the map with the territory.
  *   **Fails:** **Readout Complexity**. Often assume linearity is sufficient, which we know is false for deep features.
  *   **Verdict:** Good for diagnostics, bad for ontology. They tell you what *could* be read, not what *is* there.

  **2. The Sparse Autoencoder (SAE) / Superposition Crowd**
  *   **Passes:** **Superposition Compatibility** (This is their main sell). They explicitly model features > dimensions.
  *   **Passes:** **Readout Complexity** (Enforce sparsity as a complexity penalty).
  *   **Fails:** **Causal Efficacy**. SAEs minimise reconstruction loss, not downstream task loss. A feature can be perfectly reconstructed by an SAE but be causally inert in the original model.
  *   **Fails:** **Basis Invariance**. SAEs introduce a new basis (the dictionary). Is the dictionary unique? Often no. Different seeds give different dictionaries for the same model.
  *   **Verdict:** Best current handle on structure, but still correlational. They find the "compression format", not necessarily the "logic".

  **3. The Causal/Intervention Crowd (Patching, Ablation, Interchange)**
  *   **Passes:** **Causal Efficacy** (By definition). This is the gold standard for "usage".
  *   **Passes:** **Task Relevance**. Directly ties representation to output changes.
  *   **Fails:** **Superposition Compatibility**. Causal interventions usually assume you can wiggle one thing without breaking others. In dense superposition, this is hard to do without creating out-of-distribution activations that break the net.
  *   **Fails:** **Basis Invariance**. Interventions are usually coordinate-dependent (zero out this neuron).
  *   **Verdict:** Strongest claim to "truth", but operationally brittle. Works best on small nets or very clean features.

  **4. The Instrumentalists ("It's Just Behaviour, Stop Reifying")**
  *   **Passes:** **Basis Invariance**, **Uniqueness** (by denying the question).
  *   **Fails:** Everything else, by design.
  *   **Verdict:** Philosophically safe, engineeringly useless. If you're building tools to debug or steer nets, you *need* a theory of internals. This camp opts out of the work.

  ### The Verdict on Your Rotation Case

  You asked if the theory should refuse to answer the "which one is real" question in your rotation toy setup.

  **Yes.** That is the correct engineering conclusion.

  If two internal states are related by a symmetry that preserves all input-output behaviour and all causal pathways (modulo the symmetry), they are **representationally equivalent**. A theory that forces a distinction is overfitting to the coordinate system.

  The "spec" for representation should output an **Equivalence Class**, not a Vector.

  ### Summary of Non-Negotiables vs. House Style

  *   **Non-Negotiable:** Basis Invariance, Causal Efficacy, Readout Complexity Bound, Superposition Compatibility. If a theory ignores these, it is technically wrong about how the machine works.
  *   **House Style:** Human Interpretability, Uniqueness, Locality (one feature = one direction). These are comforts for the analyst, not requirements of the system.

  If you take nothing else away: **Recoverability is not Representation.** That is the single biggest source of bugs in this argument. Your mate is likely arguing from Recoverability (I can decode it); you are arguing from Causal Efficacy (The net uses it). You are both using the same word for different specs. Agree on the spec, and the argument usually dissolves.
