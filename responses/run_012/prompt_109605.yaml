answer: |-
  ### Executive Assessment: The Framing Problem

  I need to start by challenging the premise of your request. You are asking for a **research agenda** to resolve what is, in significant part, a **political and normative deadlock**.

  *   **Candidate 1 (Legitimacy vs. Epistemic):** This is a philosophical question, not an empirical one. Research cannot tell you whether fairness or competence is the superior justification for sortition. This is a value judgment for the committee, not a finding for the researcher. **Drop this from the research agenda.** It belongs in a facilitator's briefing pack, not a research plan.
  *   **Candidate 2 (Self-Application):** This is a political strategy question. Research cannot solve the collective action problem of incumbents voting to reduce their own power. This requires coalition-building and external pressure, not data. **Drop this from the research agenda.**
  *   **The Skeptics' Challenge:** You are correct to worry that "second-order careerism" might be a rhetorical trick. However, it is also the only claim that, if proven true, renders *both* the Sortition and Term Limit factions' proposals cosmetic.

  **Recommendation:** Do not attempt to use research to choose between Sortition and Term Limits directly (that is a normative choice). Instead, use research to **stress-test the failure modes** of each. Your researcher should not ask "Which is better?" but "Under what conditions does each fail?"

  Here is the ranked agenda. It contains exactly three lines of inquiry, fitting your resource constraints.

  ---

  ### 1. The Administrative Capture Hypothesis (The Skeptic's Veto)
  **Core Question:** To what extent does policy influence in our specific municipal structure depend on tenure within the permanent administration versus tenure within the elected council?

  *   **Why it is Upstream:** This is the kill-switch. If power resides primarily in the drafting of agendas, the writing of briefing notes, and the staffing of committees (as the Skeptics claim), then changing the *membership* of the council (via Sortition or Term Limits) is decorative. If this hypothesis holds strong, the charter must focus on reforming the *administration's* interface with the council (e.g., rotating clerks, independent counsel, public briefing drafts) before it touches council selection. If it does not hold, you can safely ignore the Skeptics and proceed to Questions 2 and 3.
  *   **Researchability:** **Medium Confidence.** This is not easily quantifiable. You cannot run a randomized trial on city governance. The researcher must conduct qualitative comparative analysis (interviews with former councilors, staff, and lobbyists in comparable mid-sized cities) and audit trail analysis (tracking the origin of agenda items). It is hostage to the candor of interviewees.
  *   **Charter Impact:** **High.** If capture is high, the charter needs clauses on:
      *   Mandatory rotation of committee clerks.
      *   Independent legislative counsel for the council (separate from city administration).
      *   Public disclosure of all briefing document drafts and authors.
  *   **Triggers for Re-ranking:**
      *   **Move Up:** If a scandal breaks locally or in a peer city revealing staff manipulation of council decisions.
      *   **Move Down:** If preliminary interviews suggest administration staff view themselves as strictly neutral implementers with low policy discretion.

  ### 2. The Sortition Participation Bias (The Sortition Viability Test)
  **Core Question:** In our specific demographic and economic context, who opts out of civic duty when it is mandatory, and can stipends/penalties correct this without creating a "professional citizen" class?

  *   **Why it is Upstream:** This is the specific failure mode for the Sortition faction. If the only people willing to serve are those with flexible jobs (the wealthy/retired) or those seeking to parlay service into a career (the ambitious), sortition fails its representational mandate. This must be settled before drafting exemption clauses or stipend levels. It is upstream of the "Legitimacy" debate because a biased lottery has neither epistemic nor democratic legitimacy.
  *   **Researchability:** **High Confidence.** This is locally specific and empirically tractable. The researcher can run survey experiments, analyze jury duty participation rates as a proxy, and model the economic impact of proposed stipends on different income brackets in your city.
  *   **Charter Impact:** **High.** Directly dictates text on:
      *   Exemption criteria (hardship, employment).
      *   Compensation levels (loss of earnings vs. flat fee).
      *   Penalties for refusal.
  *   **Triggers for Re-ranking:**
      *   **Move Up:** If the committee leans toward Sortition as the primary recommendation.
      *   **Move Down:** If the committee signals Term Limits are the preferred path (making this moot).

  ### 3. The Power Displacement Effect (The Term Limit Trade-off)
  **Core Question:** In mid-sized cities with term limits, does influence migrate to lobbyists and party organizations, or to the permanent administration?

  *   **Why it is Upstream:** This is the specific failure mode for the Term Limit faction. If term limits reduce career politicians but increase the power of lobbyists (who have long memories) or staff (who have institutional knowledge), you have not reduced concentrated power; you have privatized it. This is downstream of Question 1 (which asks if staff *can* capture power) but upstream of the final text because it determines *what safeguards* accompany the limits.
  *   **Researchability:** **Medium-High Confidence.** There is a robust existing literature on state legislatures, but less on mid-sized municipalities. The researcher can synthesize existing political science data and adapt it to your city's scale. The uncertainty lies in the "mid-sized" variable; dynamics may differ from state capitals.
  *   **Charter Impact:** **Medium.** Dictates text on:
      *   "Cooling-off" periods for councilors becoming lobbyists.
      *   Restrictions on campaign financing (if elections remain).
      *   Requirements for institutional memory transfer (e.g., mandatory handover protocols).
  *   **Triggers for Re-ranking:**
      *   **Move Up:** If the committee leans toward Term Limits as the primary recommendation.
      *   **Move Down:** If Question 1 confirms that administration capture is the dominant problem regardless of council turnover (making the *source* of councilors less relevant).

  ---

  ### What Is Missing (And Why It Was Cut)

  **The "Agenda Control" Mechanism.**
  I considered adding a fourth question on who sets the agenda. However, this is functionally a subset of Question 1 (Administrative Capture). If the administration writes the agenda, that is capture. If the council sets the agenda, career politicians control it. The research on *capture* (Q1) will reveal who currently holds the keys. Do not separate this; it dilutes the focus on the power structure itself.

  **The "Transition" Mechanism.**
  How to enact the reform (Self-Application) was cut because it is not researchable. A researcher cannot calculate the political capital required to pass a charter amendment. That is a campaign manager's job.

  ### Uncertainty Note

  I must be explicit about the limits of this agenda.
  1.  **Causality:** We cannot prove causality in Q1 and Q3. We can only show correlation and plausible mechanism. The report must use language like "evidence suggests" rather than "proves."
  2.  **Normative Choice:** This agenda will not tell you whether Sortition is *better* than Term Limits. It will only tell you how each might break. The committee must still vote based on values.
  3.  **Scale:** Most data on term limits comes from state/national levels. Applying this to a mid-sized city carries a **Low-to-Medium Confidence** transferability rating. The researcher must explicitly flag this generalization risk.

  ### Summary of Advice

  If you fund Question 1 first, you respect the Skeptics without conceding to them. If their claim is weak, you clear the field for the reformers. If their claim is strong, you save the city from a cosmetic reform that changes the faces but not the power.

  Questions 2 and 3 are parallel paths. Do not fund both fully until the committee indicates a preference for Sortition or Elections. Instead, have the researcher maintain a "watching brief" on both, but deepen the dive only once the political direction crystallizes. This preserves your limited resources for the design phase rather than the debate phase.
