answer: |-
  **EXAM QUESTION**

  **Course:** SCI&SOC 401: Evolutionary Minds & Society
  **Time:** 45 Minutes
  **Word Limit:** Approx. 800 words
  **Instructions:** Answer the following question. Define your terms through application rather than abstract definition.

  **Question:**
  Daniel Dennett distinguishes between **cranes** (mechanisms that lift complexity from the ground up) and **skyhooks** (miraculous supports that hang from nothing). He also warns against **greedy reductionism** (ignoring intermediate levels of organization).

  Analyze the following four claims using these concepts. For each, identify whether the explanation offered is a crane or a skyhook. Then, evaluate whether any objection raised against the claim represents a legitimate demand for a crane or an instance of greedy reductionism.

  1.  **Neuroscience:** A researcher claims depression is "just" a wiring problem and the psychological level should be retired once circuits are mapped.
  2.  **Panpsychism:** A philosopher claims consciousness is a fundamental feature of the world, like charge or spin.
  3.  **Ethics:** A critic argues evolution cannot generate real moral *oughts*, so the evolutionary story has a hole no biology will fill.
  4.  **Constraints:** A theorist claims a high-level pattern (e.g., developmental constraint) actually constrains what the molecules underneath are allowed to do.

  ***

  **MODEL ANSWER**

  Dennett's framework is a tool for auditing explanations. A **crane** is a naturalistic mechanism that builds complexity from simpler predecessors; a **skyhook** is a posit that explains complexity by invoking something equally complex without explaining its origin. **Greedy reductionism** occurs when one insists on looking only at the bottom level, ignoring the functional reality of intermediate levels.

  **Case 1 (Depression)** is an instance of **greedy reductionism**. While neural circuits are the substrate, the psychological level is a real "virtual machine" running on that hardware. Retiring the psychological level loses explanatory power regarding behavior and experience. The circuits are the crane, but the psychology is the structure the crane builds. Ignoring the structure because you see the bricks is greedy.

  **Case 2 (Consciousness)** posits a **skyhook**. Treating consciousness as fundamental, like charge, halts inquiry. It assumes the very thing that needs explaining (subjective experience) is just "there." A Dennettian approach requires consciousness to be constructed from competences without comprehension. Unless the philosopher explains how this "fundamental" property interacts with physics to produce specific minds, it is a miraculous levitation device, not a mechanism.

  **Case 3 (Ethics)** requires distinguishing the gap from the demand. The critic claims evolution cannot bridge *is* and *ought*. However, demanding a non-naturalistic "ought" is asking for a **skyhook**. Evolutionary ethics constructs moral norms via social cranes: reciprocity, punishment, and cooperative stability. These are real mechanisms that generate normative force within a community. The critic's "hole" is only a hole if one insists morality must float free of natural history. Therefore, the objection is not a legitimate demand for a crane; it is a refusal to accept the cranes on offer because they lack magical authority. The stand taken here is that the "ought" is a functional category evolved for social coordination, not a metaphysical entity.

  **Case 4 (Constraints)** is the most nuanced. Top-down constraint sounds like a skyhook (the whole magically controlling the parts). However, if the constraint is an emergent property of the system's design space—where certain molecular arrangements are unstable or impossible due to higher-order structural integrity—it is a **crane**. The constraint is implemented by the bottom-up physics, even if described top-down. If the theorist claims the pattern exists independently of the molecules, it is a skyhook. Charitably read, this describes the reality of design space: the "allowances" are physical realities, making this a legitimate crane describing system dynamics.

  **Conclusion**
  The core lesson is that reductionism is valid only when it respects the layers of competence. Greedy reductionism (Case 1) denies the layers; Skyhooks (Case 2 & 3) deny the need for layers. Good science builds cranes that connect the layers without skipping them or invoking magic. Case 3 demonstrates that even normative claims must be grounded in functional mechanisms to avoid being skyhooks.

  ***

  **MARKING SCHEME (Out of 20)**

  **1. Conceptual Application (4 marks)**
  *   **4:** Defines Crane/Skyhook/Greedy Reductionism *only* through their application to the cases. No isolated dictionary definitions.
  *   **2:** Defines terms abstractly but struggles to apply them consistently.
  *   **0:** Incorrect definitions or rote memorization without context.
  *   *Common Error:* Writing a paragraph defining "Universal Acid" that isn't used to analyze the cases.

  **2. Analysis of Cases 1 & 2 (4 marks)**
  *   **4:** Correctly identifies Case 1 as Greedy Reductionism (psychology is a real level) and Case 2 as a Skyhook (halts mechanistic inquiry).
  *   **2:** Identifies labels correctly but fails to explain *why* (e.g., doesn't mention loss of explanatory power in Case 1).
  *   **0:** Swaps labels or claims Case 1 is valid reductionism.
  *   *Common Error:* Calling Case 1 "good reductionism" because neurons are real.

  **3. Analysis of Case 4 (4 marks)**
  *   **4:** Recognizes the nuance: Top-down constraint is a Crane *if* emergent/implemented by lower levels; Skyhook if magical.
  *   **2:** Dismisses it outright as a Skyhook because "physics is bottom-up."
  *   **0:** Claims top-down causation is impossible or irrelevant.
  *   *Common Error:* Assuming Dennett rejects all top-down descriptions rather than rejecting unimplemented magic.

  **4. Analysis of Case 3 (The Pivot) (4 marks)**
  *   **4:** Takes a stand: Identifies the demand for a non-natural "ought" as the Skyhook move. Argues morality is built via social cranes.
  *   **2:** Sits on the fence ("Some say yes, some say no") without evaluating the demand itself.
  *   **0:** Agrees with the critic that evolution cannot explain oughts (validating the skyhook).
  *   *Common Error:* Treating the "Is-Ought" gap as a legitimate scientific problem rather than a philosophical demand for a skyhook.

  **5. Argumentative Cohesion & A/B Differentiator (4 marks)**
  *   **4 (A Grade):** Synthesizes the cases. Explains that the *same move* (looking lower) is virtuous in Case 2 (demanding mechanism) but vicious in Case 1 (ignoring function). Explicitly states that Greedy Reductionism is a vice *within* reductionism, not its opposite.
  *   **3 (B Grade):** Correctly labels all four cases but treats them as isolated tasks. Definitions are recited rather than wielded.
  *   **0-2:** Disorganized or fails to connect the concepts.
  *   *Common Error:* Writing four mini-essays without a unifying thread about mechanistic explanation.

  **Note on Grading:** To achieve an **A**, the student must demonstrate that "reductionism" is not the enemy; "greed" is. A **B** paper correctly sorts the bins. An **A** paper explains why the bins exist and how Case 3 proves that demanding a skyhook is often disguised as demanding rigor.
