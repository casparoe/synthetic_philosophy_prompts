  Here are ten questions drafted in your voice. Each includes a note on what the guest is likely to say, my bet on where the argument stands, and a follow-up designed to lock him into a corner based on that prediction.

  ### 1. The "Actively Harmful" Constraint
  **Question:** Your pitch works best when I care about cause A and you care about cause B, and we just don't care about each other's stuff. But what if I don't just indifference to your cause—what if I think your cause is actively harmful? If I believe your work actually hurts people, can we still trade?

  **Expected Answer & Bet:** He will almost certainly say no. He'll argue that moral trade requires values to be orthogonal (different) rather than opposed (conflicting). He needs this exclusion to make the math work.
  **Follow-up:** If you exclude causes you think are harmful, who decides what counts as harmful? Doesn't that mean you, the matchmaker, are imposing a moral standard on the trade rather than just facilitating one?

  ### 2. The "Better Off" Measurement
  **Question:** Let's say we do trade. I say I'm better off, and you say you're better off. But my scale of "good" might be totally different from yours. I measure lives saved; you measure pain reduced. How do we know the trade is actually an improvement if we can't compare our scales?

  **Expected Answer & Bet:** He will say we don't need to compare scales across people. We only need to know that I prefer the trade outcome to my no-trade outcome, and vice versa. I bet he's right that this avoids direct comparison, but it hides a problem in the exchange rate.
  **Follow-up:** To make the trade happen, we have to agree on amounts—I give $100, you give $50. That ratio implies an exchange rate. If we aren't comparing our values, who sets that rate, and isn't that setting a hidden price on my moral units versus yours?

  ### 3. The Integrity Worry
  **Question:** Suppose I believe cause A is the only thing that matters. If I donate to cause B just to get you to donate to A, doesn't that feel like betraying my own conviction? It looks like I'm treating my principles as a bargaining chip.

  **Expected Answer & Bet:** He will argue that convictions should be about outcomes, not purity. He'll say "betrayal" is the wrong word if the net result is more good done.
  **Follow-up:** But signaling matters. If I publicly advocate for A but fund B, doesn't that signal to other donors that A isn't urgent? Doesn't your trade weaken the public case for my own cause?

  ### 4. The Mechanism Design Claim
  **Question:** You say your matching service is designed so nobody has an incentive to lie about their preferences. In my field, we know that building a system where lying never helps is incredibly hard, and sometimes mathematically impossible. How do you get around that?

  **Expected Answer & Bet:** He will admit that it's impossible in the general case but claim he restricts the types of trades allowed to make it possible. I bet this restriction is where the real moral work is happening, not the trade itself.
  **Follow-up:** If you have to restrict the types of trades to make the math work, aren't you just solving the easy cases? Doesn't that mean the system fails exactly where disagreement is deepest and lying would be most tempting?

  ### 5. Uncertainty and Probability
  **Question:** Imagine I'm not sure which cause is best. I think cause A is better with seventy percent probability, and cause B with thirty percent. If I trade with you based on those odds, is that still moral trade, or is it just ordinary expected-value reasoning?

  **Expected Answer & Bet:** He will say it's still trade because I'm cooperating with you to maximize expected value. I bet this blurs the line too much.
  **Follow-up:** If it's just calculating expected value, isn't this standard decision theory dressed up as cooperation? Where is the "trade" happening if I'm just hedging my bets to maximize my own expected outcome?

  ### 6. The Broker's Neutrality
  **Question:** You run the matching service. Can you really be morally neutral? Or does running the service amount to taking a stand about which trades are acceptable and which aren't?

  **Expected Answer & Bet:** He will claim neutrality, saying he just provides the platform. I bet this is false; curating a platform is a moral act.
  **Follow-up:** By accepting some trades and rejecting others—for example, refusing to match someone who wants to fund harmful research—aren't you endorsing a specific framework about what counts as a valid moral goal? Isn't that taking a side?

  ### 7. Permission vs. Requirement
  **Question:** Is moral trade merely permitted, or is it sometimes required? If I know I could do more good by trading than by donating alone, am I doing something wrong if I refuse to trade?

  **Expected Answer & Bet:** He will say it's permitted but not required, to avoid demanding too much of people. I bet this is inconsistent with his own logic about maximizing good.
  **Follow-up:** If you agree that trading produces more good, and you know it, isn't refusing to trade wasting resources? Why is it okay to waste lives for the sake of convenience or comfort?

  ### 8. The Repellent Feeling
  **Question:** Many people find the whole idea of moral trade repellent, even if they can't explain why. What would you say to someone who has that gut feeling?

  **Expected Answer & Bet:** He will attribute it to irrational purity norms or discomfort with markets in sacred spaces. I bet he's dismissing a useful heuristic.
  **Follow-up:** What if that feeling isn't a bug, but a feature? What if it's a warning signal that commodifying values undermines the trust required for morality to work in the first place? Why should I trust your model over that deep intuition?

  ### 9. Trading vs. Arguing
  **Question:** Does trading replace arguing? If we can just swap donations to get what we want, do we lose the pressure to work out who is actually right?

  **Expected Answer & Bet:** He will say no, we can still argue about truth while trading on action. I bet this separates things that shouldn't be separated.
  **Follow-up:** If I can get you to fund my cause by paying you to fund yours, why bother convincing you that I'm right? Doesn't this incentivize keeping disagreements alive rather than resolving them, because disagreement is profitable?

  ### 10. Evidence and Bribery
  **Question:** What evidence would make you abandon the practice? And where do you draw the line between a moral trade and a bribe?

  **Expected Answer & Bet:** He will say evidence of net harm would stop him, and that bribes are selfish while trades are altruistic. I bet the intent distinction is hard to enforce.
  **Follow-up:** If the outcome is identical, does intent matter? If I trade with you solely to look generous, not to do good, is it still moral trade? How do you police intent without reading minds?
