answer: |-
  This is a classic pub debate, but it touches on genuine legal and constitutional questions about the European Union. Your intuition is correct: Tom is conflating a political aspiration with a legal blank cheque, while your other mate is underestimating the legal weight of the text.

  The phrase comes from **Article 1(2) of the Treaty on European Union (TEU)**: *"This Treaty marks a new stage in the process of creating an ever closer union among the peoples of Europe, in which decisions are taken as openly as possible and as closely as possible to the citizen."*

  Here is the menu of readings you can take back to your mates, ranked from weakest to strongest legal interpretation, along with an analysis of whether they support Tom's "irreversible ratchet" conclusion.

  ### 1. The "Ceremonial Preamble" Reading
  *   **The Claim:** The phrase is historical boilerplate carried over from the 1957 Treaty of Rome. It expresses a mood or a vibe but creates no legal obligations. It is political poetry, not law.
  *   **Truth Value:** **Mostly False.** In the original Treaty of Rome, it was in the preamble. However, in the current TEU (post-Maastricht and Amsterdam), it is in the **operative text** (Article 1). This gives it more weight than pure preamble fluff.
  *   **Does it support Tom?** No. If this were true, Tom's argument collapses immediately.
  *   **Does it support your Mate?** Partially. It captures the spirit that the phrase isn't a "command," but it's legally inaccurate to call it meaningless.

  ### 2. The "Interpretive Lens" Reading
  *   **The Claim:** The phrase is legally binding but only as a tool for judges. When the European Court of Justice (ECJ) is faced with ambiguous EU law, they should interpret it in a way that favours integration over fragmentation. It doesn't create new powers, but it tilts the scale when powers are unclear.
  *   **Truth Value:** **True.** This is the prevailing legal view. The ECJ uses the "ever closer union" objective to interpret the scope of existing competences broadly (teleological interpretation).
  *   **Does it support Tom?** Weakly. It explains how "competence creep" happens (judges stretching existing rules), but it doesn't allow the EU to seize *new* powers that aren't in the treaties.
  *   **Does it support your conclusion?** Yes. It suggests the "deficit" can be checked by stricter judicial review or treaty clarification, not that the system is a runaway machine.

  ### 3. The "Political Compass" Reading
  *   **The Claim:** The phrase binds the political institutions (Commission, Parliament) to propose legislation that deepens integration *where they already have the power to do so*. It sets the direction of travel for policy proposals but requires the Council (member states) to agree on each step.
  *   **Truth Value:** **True.** The Commission uses this as a mandate to propose deeper integration (e.g., banking union, Schengen). However, they cannot pass these laws without the Council and Parliament.
  *   **Does it support Tom?** Partially. This is likely what Tom *feels* is happening. He sees a political culture where integration is the default setting.
  *   **Does it support his conclusion (Irreversibility)?** No. Because every step requires a vote by member states in the Council. If they stop voting for integration, the "union" stops getting "closer."

  ### 4. The "Teleological Ratchet" Reading (Tom's View)
  *   **The Claim:** This phrase imposes a standing legal obligation on the EU to continuously acquire new powers and centralize authority. It overrides national sovereignty and makes integration mandatory regardless of specific treaty provisions.
  *   **Truth Value:** **False.** This is legally indefensible. It contradicts the **Principle of Conferral** (Article 5 TEU), which states the EU *only* has powers explicitly given to it by the treaties. "Ever closer union" cannot be used to bypass Conferral. The ECJ has ruled that this phrase does not allow the EU to act beyond its conferred competences.
  *   **Does it support Tom?** This is the reading Tom *needs* for his argument to work.
  *   **Does it support his conclusion?** If this were true, yes, the democratic deficit would be baked in. But since this reading is legally false, his conclusion fails.

  ---

  ### The "Off Switch" and the Democratic Deficit
  Tom's specific claim is: *"There's no vote that can ever undo it."*

  This is factually incorrect for two reasons:
  1.  **Treaty Change:** To transfer *new* powers to Brussels, you need a new Treaty. This requires **unanimity** from all member states and usually national ratification (often via referendum). Any single country can veto "ever closer union" at the treaty level. That is a massive "off switch."
  2.  **Article 50:** The ultimate off switch is leaving. The UK exercised this. The union is not a "one-way trap" in a legal sense.

  **On the Democratic Deficit:**
  Tom argues the deficit is the "mission statement." In reality, the democratic deficit is usually attributed to the **Commission's monopoly on legislative initiative** (unelected bureaucrats propose laws) and the complexity of the Council's voting. "Ever closer union" describes the *goal*, not the *process*. You can have an "ever closer union" with a more powerful Parliament (fixing the deficit), or a distant union with a weak Parliament. The two concepts are distinct.

  ---

  ### The "As Closely as Possible to the Citizen" Clause
  You spotted the smoking gun. The full sentence in Article 1(2) reads:
  > *"...in which decisions are taken as openly as possible and **as closely as possible to the citizen**."*

  This is not just decorative; it is the textual anchor for the **Principle of Subsidiarity** (Article 5(3) TEU).

  *   **What it means:** The EU should *not* act unless the objectives can be better achieved at the Union level than at the national/regional level.
  *   **How it counters Tom:** It legally codifies a brake on centralization. It explicitly states that the default position is decisions *near* the citizen, not in Brussels.
  *   **The Tension:** You are right to point this out. The Treaty contains both the accelerator ("ever closer union") and the brake ("closely as possible to the citizen").
  *   **Tom's Counter-argument:** He would argue the brake is weak (politically ignored) while the accelerator is strong (culturally enforced).
  *   **Your Rebuttal:** Legally, the brake is just as strong as the accelerator. If the EU legislates where national parliaments could do it better, national parliaments can issue a "Yellow Card" to block it. The mechanism to stop the ratchet exists in the very same sentence Tom is quoting.

  ### Summary for the Pub
  *   **Tom is right that:** There is a political culture in Brussels that favours integration, and the ECJ interprets laws broadly.
  *   **Tom is wrong that:** The phrase creates a legal obligation to centralize power regardless of member state consent.
  *   **Your Mate is right that:** It doesn't automatically create new laws.
  *   **Your Mate is wrong that:** It's just preamble fluff; it is operative text that guides interpretation.
  *   **You are right that:** The "closely as possible to the citizen" clause acts as a legal counterweight (Subsidiarity), and the requirement for unanimity on treaty changes provides the "off switch" Tom denies exists.

  **The Verdict:** "Ever closer union" is a **directional compass**, not a **legal engine**. It tells the EU where to look, but the Principle of Conferral and Unanimity control whether the car actually moves. Tom is mistaking the destination for the fuel.
