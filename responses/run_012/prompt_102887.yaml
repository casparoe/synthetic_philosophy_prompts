      *   **Task 3:** Include distinctions the theory must not blur (coordination vs. obligation, norm-following vs. being a jerk, expectations vs. entitlements).
      *   **Task 4:** Include facts about conventions (compliance thresholds, survival of defectors).
      *   **Task 5:** Identify the *single requirement* that does the most work to rule out easy answers (reductionism).
      *   **Task 6:** Flag *two requirements* that pull against each other (tension).
      *   **Task 7:** Evaluate two extreme views ("When in Rome" vs. "Conventions don't bind outsiders") in one line each.

  2.  **Drafting the Desiderata (Task 1-4):**
      *   *Need to cover:* The tourist jaywalking (everyone does it), the non-tipper (expected but maybe not owed), the harmless custom (low cost, low meaning).
