answer: |-
  ### Desiderata for a Theory of Conventional Obligation

  A successful theory must satisfy the following conditions:

  1.  **The Compliance Threshold:** It must distinguish between conventions that require near-universal compliance to function (e.g., driving on a specific side of the road) and those that tolerate defectors (e.g., tipping). A theory cannot claim an obligation exists where a single violation collapses the system, nor can it claim no obligation exists where free-riding undermines a cooperative scheme.
  2.  **The Harm/Offense Distinction:** It must separate norms that prevent tangible harm (queueing prevents chaos; tipping prevents wage theft) from norms that merely signal in-group status (using the correct cutlery). Violating the former may be morally weighty; violating the latter is merely rude.
  3.  **The Expectation/Entitlement Gap:** It must explain why being *expected* to do something (tipping in the US) is not identical to the recipient being *entitled* to it (a worker owed a living wage). The theory must locate where the entitlement emerges: from the custom itself, or from the background justice the custom supports.
  4.  **The Epistemic Burden:** It must define how much effort a visitor owes to learn local norms. It cannot demand omniscience (knowing obscure taboos), but it cannot allow willful ignorance of salient norms (ignoring a "No Jaywalking" sign).
  5.  **The Coordination vs. Cooperation Divide:** It must not blur solving a coordination problem (we all need to agree on *which* side to walk on) with solving a cooperation problem (we all need to contribute to *maintain* the service). The moral force differs: one is about efficiency, the other about fairness.
  6.  **The Common Knowledge Condition:** It must acknowledge that a convention only binds if it is common knowledge that everyone expects everyone to follow it. If the "rule" is hidden or contested, the obligation weakens.
  7.  **The Sovereignty Limit:** It must respect local normative authority without endorsing moral relativism. It should explain why a visitor must follow a harmless local custom (take off shoes) but not a harmful one (segregate seating), even if both are "local habits."

  ***

  ### The Single Requirement That Rules Out Easy Answers

  **The Principle of Fair Play.**

  This requirement does the most work because it bridges the gap between the two reductionist failures.
  *   Against **"Conventions are just expectations"**: Fair Play argues that expectations create duties *when* they are part of a mutually beneficial cooperative scheme. It's not just that people *want* you to tip; it's that you are accepting the benefit of a service priced under the assumption of tips.
  *   Against **"You only owe independent entitlements"**: Fair Play argues that the entitlement *arises* from the convention. The waiter isn't owed a tip in a vacuum, but they are owed one *given* the institutional structure you are voluntarily utilizing.
  By requiring an analysis of **benefit acceptance** within a **cooperative scheme**, this requirement forces the theory to look beyond mere psychology (expectations) and beyond abstract rights (independent entitlements).

  ***

  ### Two Requirements That Pull Against Each Other

  **The Epistemic Burden** vs. **The Voluntarism Constraint.**

  *   **The Tension:** The **Epistemic Burden** suggests you are obligated to learn and follow local norms to avoid harming the system (e.g., "You should have known tipping is mandatory here"). However, the **Voluntarism Constraint** suggests you cannot be bound by rules you did not consent to (e.g., "I am a tourist, I didn't sign up for this social contract").
  *   **The Conflict:** Pushing too hard on Epistemic Burden turns every local habit into a binding law for visitors, punishing ignorance. Pushing too hard on Voluntarism allows visitors to opt out of essential cooperative schemes (like safety queues or wage supplements) simply by claiming "I'm not a local," effectively licensing free-riding.

  ***

  ### Evaluation of Extreme Views

  **"When in Rome":** Fails the Sovereignty Limit by conflating moral obligation with local popularity, potentially binding visitors to unjust or harmful practices.

  **"Conventions Don't Bind Outsiders":** Fails the Compliance Threshold by licensing free-riding that destabilizes cooperative schemes locals depend on.
