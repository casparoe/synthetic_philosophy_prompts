      *   *Even Better:* **The Epistemic Burden** (You must learn the rules) vs. **The Transparency Condition** (Rules must be clear to be binding). If a rule is opaque, you can't follow it, but if you don't try to learn it, you're negligent.
      *   *Best Tension:* **The Fairness Obligation** (Don't free-ride on local cooperation) vs. **The Voluntarism Constraint** (You didn't sign up for this social contract). The visitor didn't agree to the tipping norm, but benefits from the service. This is the core friction.

  6.  **Evaluating the Extreme Views (Task 7):**
