      *   *Need to acknowledge:* Conventions rely on common knowledge, some need 100% compliance (safety), others tolerate free-riding.
      *   *Drafting points:*
          1.  **The Compliance Threshold:** Must distinguish between conventions that collapse without near-universal compliance (driving side) and those that survive defectors (tipping).
          2.  **The Harm Principle:** Must account for whether breaking the norm causes tangible harm or just offense.
          3.  **The Fairness/Reciprocity Condition:** Must address whether the visitor benefits from the system they are opting out of (free-riding).
