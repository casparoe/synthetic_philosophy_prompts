prompt: |-
  im putting together notes on when everyday conventions — tipping, queueing, not jaywalking — are actually moral obligations and not just local habits, and whether a visitor who wasn't raised with them has to play along. id like the desiderata for a theory that answers this: what it has to get right (the tourist who jaywalks in a city where literally everyone does it, the visitor who doesn't tip where tipping's expected, the harmless local custom that costs you nothing to follow but means nothing to you), which distinctions it can't blur (coordination vs. genuine obligation, following a norm vs. being a jerk for not following it, local expectations vs. what people are actually owed), and any facts about how conventions work that it can't contradict — say, that some only function if nearly everyone complies while others survive defectors.

  then tell me which single requirement does the most to rule out the easy answers (like "conventions are just whatever people expect" or "you only owe others what they're entitled to independent of any custom"), and flag any two requirements you think pull against each other. finish with a line each on how a straight "when in Rome" view and a "conventions don't bind outsiders" view fare against the list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** When are everyday conventions (tipping, queueing, jaywalking) moral obligations vs. local habits? Do visitors have to follow them?
