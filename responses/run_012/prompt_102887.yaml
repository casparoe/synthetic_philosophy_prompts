      *(Refining the Tension)*: **Epistemic Accessibility** (you can only be bound by what you can know) vs. **Normative Force** (some norms bind you even if you didn't know them, e.g., safety). Or **Local Sovereignty** vs. **Moral Universalism**.
      *   Let's go with **The Voluntarism Constraint** (obligations require consent) vs. **The Fairness Constraint** (benefits create obligations). This is the classic philosophical tug-of-war regarding political obligation and social norms.

      *(Refining the One-Liners)*:
      *   When in Rome: Collapses morality into popularity, endorsing harmful local practices.
      *   Outsiders Exempt: Licenses parasitic behavior that undermines cooperative systems.

