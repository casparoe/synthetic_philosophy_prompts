          5.  **The Expectation vs. Entitlement Gap:** Must separate "I expected you to do X" from "You owed me X."
          6.  **The Coordination/Morality Divide:** Must distinguish solving a coordination problem (queueing) from fulfilling a moral duty (living wage via tips).
          7.  **The Cultural Sovereignty Limit:** Must respect local autonomy without endorsing harmful local practices.

  3.  **Refining the Desiderata (Selecting the best ones for the prompt):**
      *   Let's make them punchy and philosophical.
      *   *D1: The Harm/Offense Distinction.* (Rules out "everything is moral").
