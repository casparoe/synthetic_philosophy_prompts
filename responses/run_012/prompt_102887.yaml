      *   *D3: The Coordination Necessity.* (Rules out "my individual action doesn't matter").
      *   *D4: The Epistemic Reasonableness.* (Rules out "ignorance is no excuse" for obscure norms).
      *   *D5: The Expectation/Entitlement Gap.* (Crucial for the tipping example).

  4.  **Identifying the "Single Requirement" (Task 5):**
      *   Easy answers: "Conventions = Expectations" (too broad) or "Only Independent Entitlements Matter" (too narrow).
      *   What kills both? The **Free-Rider Constraint** (or Fairness Principle).
      *   *Why?* If conventions were just expectations, free-riding wouldn't be wrong. If only independent entitlements mattered, participating in a cooperative scheme (like tipping culture that sustains wages) wouldn't create an obligation. The requirement that *benefiting from a cooperative scheme generates an obligation to uphold it* bridges the gap between "mere habit" and "moral duty."
      *   *Alternative:* The **Harm/Structure Distinction**. But Free-Rider feels more active regarding the *visitor* aspect. Let's go with the **Fairness/Reciprocity Requirement**. It forces the theory to ask: "Are you taking advantage of a system maintained by others?"

