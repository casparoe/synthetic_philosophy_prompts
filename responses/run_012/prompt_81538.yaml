answer: |-
  This is a brilliant observation, and you are right to feel that existing terminology doesn't quite capture the specific geometry of what you're describing. You have identified a mechanism that is distinct from simple entrenchment or regulatory capture.

  There is no single, universally recognized noun for this specific phenomenon, though it is a well-documented dynamic in critical legal studies, sociology of punishment, and political theory. Scholars like James Whitman, Carol and Jordan Steiker, and David Garland have danced around it, often describing it as **"legitimation through reform"** or **"the survival of the punitive core."**

  However, those phrases describe the *outcome*, not the *mechanism*. You need the mechanism.

  Here is the breakdown of why the standard terms fail, followed by a proposed coinage that fits the "carving" you need for your novel.

  ### The Near Misses (And Why They Don't Fit)

  *   **Entrenchment:** This implies digging in and refusing to move. Your scenario is the opposite: the institution *is* moving, retreating, and conceding ground. Entrenchment suggests rigidity; your shape is fluid.
  *   **Regulatory Capture:** This implies the regulated entity takes over the regulator. Here, the reformers (opponents) are often the ones driving the contraction, yet the institution benefits. It's not a hostile takeover; it's a symbiotic pruning.
  *   **Net Widening/Narrowing:** Criminologists use "Net Narrowing" to describe fewer people being caught. But that is a demographic statistic. It doesn't capture the *moral exchange rate* (less scope = more legitimacy).
  *   **Gradualism:** This describes the *tempo* of change, not the *structural effect*.
  *   **The "Furman Effect":** In death penalty law, this refers to states rewriting statutes after *Furman v. Georgia* to comply with the Court. It's too specific to procedure and legislation, not the broader cultural legitimization you're tracking.

  ### The Coinage: "Purificatory Contraction"

  If you need a term to live in the book (or in your head), I propose **Purificatory Contraction**.

  **Definition:** A process where an institution or practice sheds its peripheral applications to protect its core. By removing the "impure" cases (juveniles, the disabled, the ambiguous), the practice is not weakened but *distilled*. The reduction in scope is traded for an increase in moral clarity.

  **Why it fits:**
  1.  **Purificatory:** It captures the moral cleaning. The DA isn't saying "we are keeping this for power"; he is saying "we are keeping this for *justice*." He is removing the stain of executing the innocent or the vulnerable.
  2.  **Contraction:** It captures the physical shrinking. The circle gets smaller.
  3.  **The Mechanism:** It explains the "gravedigger/life support" paradox. The reformers think they are dismantling the machine by removing its fuel (cases). The institution sees that by removing the "bad fuel," the engine runs cleaner and louder.

  ### The Edges of the Concept

  To help you write the character, here are the boundaries of **Purificatory Contraction**:

  **1. Intent is Irrelevant (The "Gravedigger" Clause)**
  The mechanism works regardless of who pulls the lever.
  *   **If a Retentionist does it:** It is a "Fortress Strategy." They sacrifice the outer walls to save the keep.
  *   **If an Abolitionist does it:** It is "Harm Reduction." They believe every case removed is a victory.
  *   **The Trap:** Both are feeding the same engine. The abolitionist gets the statistical win (fewer deaths); the retentionist gets the rhetorical win (only the "worst" die). Your character can vote for the contraction with a clear conscience, believing he is starving the beast, while actually he is feeding it high-octane moral fuel.

  **2. The Circular Definition (The "Scream" Test)**
  As the circle shrinks, the definition of the center becomes tautological.
  *   *Early stage:* "Who deserves death?" (Open question).
  *   *Late stage:* "Who is in the center?" (The answer is: the ones we didn't remove).
  *   The practice no longer needs to justify *why* it exists; it justifies itself by *who* it touches. The target becomes the evidence. "He is in here, therefore he is the worst."

  **3. Outcome Independence**
  The practice does not have to survive forever for this to be Purificatory Contraction.
  *   If the practice eventually dies, this mechanism ensures it dies "with honor." It doesn't collapse under the weight of its own cruelty; it fades away as a rare, solemn ritual.
  *   If it survives, it becomes immune to broad moral attacks because the broad moral attacks no longer apply to the specific people left inside.

  **4. The "Civilized" Vector**
  You noted this appears in war and solitary confinement. This is key. The contraction is always framed as becoming more *civilized*, more *precise*, more *humane*.
  *   **War:** We don't bomb cities anymore; we do "surgical strikes." (Legitimizes the strike).
  *   **Solitary:** We don't lock everyone up; only the "most dangerous." (Legitimizes the torture of the few).
  *   **Drugs:** We don't prosecute users; only "kingpins." (Legitimizes the harsh sentencing of the few).

  ### How to Use This for Your Character

  Your character is participating in **Purificatory Contraction**. He believes he is engaging in **Harm Reduction**, but he is actually enabling **Moral Distillation**.

  In the scene, he shouldn't feel conflicted. He should feel *relieved*. That is the horror of it. He isn't compromising; he is clarifying.

  *   **The Dialogue:** He shouldn't argue that the death penalty is "necessary." He should argue that the *current version* is "sloppy." He votes for the contraction to fix the sloppiness.
  *   **The Internal Logic:** "If we stop killing the retarded, and stop killing the kids, and stop killing the accomplices... then what's left? Only the monsters. And if we only kill the monsters, isn't that justice?"
  *   **The Blind Spot:** He cannot see that "monster" is not an objective category. It is a label applied by the machinery he just helped tune. By voting to narrow the statute, he has voted to make the remaining executions *harder to stop*.

  ### Summary for Your Notes

  *   **Term:** Purificatory Contraction (or **Concentric Legitimation**).
  *   **Core Dynamic:** Scope is traded for Legitimacy.
  *   **Visual:** A fortress burning its outer buildings to keep the inner keep warm.
  *   **Key Phrase:** "Sanctification by Scarcity."
  *   **Character Motivation:** He thinks he is removing the stain from the institution. He doesn't realize he is polishing the weapon.

  This gives you the "carving" you asked for. It allows your character to be intelligent, well-meaning, and logically consistent, while still being functionally complicit in the exact thing he thinks he is undermining. That is the specific tragedy of the public defender office: you fix the machine so it runs smoothly, and then you have to watch it run.
