      *   *Claim 3:* "This is why frequentists are confined to long-run frequencies..."
          *   *Assessment:* Slightly wince-worthy. Frequentists *define* probability as long-run frequencies. The reference class problem is a consequence of that definition applied to singular cases, not the *cause* of the confinement. It's a bit backwards causally, but understandable.

