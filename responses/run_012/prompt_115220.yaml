  **The Case**

  Consider Alex, a human tetragametic chimera. Alex originated when two distinct, viable zygotes, Z1 and Z2, fused at the blastocyst stage. Alex's tissues comprise two cell lines; Z1 and Z2 both contributed to the brain and germline. Biologically, Z1 was capable of independent development into a singleton human.

  Focus on Alex. Pose this question: Could Alex have existed had the early embryo taken the single-zygote path—specifically, if Z2 had degenerated and only Z1 developed to term?

  This case relies on documented embryology. Chimerism is a natural occurrence, not a stipulation. The counterfactual scenario removes one constitutive element of the actual origin while retaining a biologically sufficient remainder. The question forces a verdict on whether the composite nature of Alex's beginning is essential to Alex's identity, or merely contingent material scaffolding for a trajectory that Z1 alone could have sustained.

  **Show Your Work**

  **Origin Essentialism (OE):** OE holds that an individual's specific biological origin is necessary to their identity. Alex's origin is the fusion event of Z1 and Z2. This composite origin is a singular, essential property. In the counterfactual where Z2 degenerates, the origin is merely Z1. Since the origin differs, the individual differs.
  *Verdict:* No, Alex could not have existed.

  **Origin Contingency (OC):** OC holds that origin is contingent; identity is grounded in later properties (e.g., psychological continuity or specific biological trajectories). Since Z1 was viable and capable of sustaining the developmental trajectory that produced Alex's later properties, the absence of Z2 does not preclude Alex's existence.
  *Verdict:* Yes, Alex could have existed.

  **Conflict:** OE declares the scenario impossible for Alex; OC declares it possible. They disagree on the modal status of the same individual relative to the same biological variation.

  **The Work-Doing Feature**

  The feature doing the work is the **composite origin** (the fusion of two viable zygotes).

  **Remove It:** If Alex originated from a single zygote (normal conception), both views agree: without that specific zygote, Alex could not exist. OE forbids it by definition; OC accepts it because no alternative origin is presented. The disagreement collapses into consensus.

  **Defusing the Case**

  A defender of OE would argue that the fusion event created a *new* biological individual distinct from Z1 or Z2 alone. They would claim the counterfactual is misleading: if Z2 degenerates, Z1 does not develop into *Alex*, nor does it develop into a "singleton version" of Alex. It develops into a *different* individual entirely. Thus, the question "Could Alex have existed?" is answered by denying that the Z1-singleton is a candidate for being Alex, preserving the necessity of the actual fused origin without denying the viability of Z1.
