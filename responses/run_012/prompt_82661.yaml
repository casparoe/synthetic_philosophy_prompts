answer: |-
  **Acausal Casualty & Indemnity: Frequently Asked Questions**

  **1. What constitutes a covered counterfactual liability?**
  A claimable event occurs when a reliable Predictor withhold a substantial reward in the actual world because their simulation of you refused a smaller payment in a counterfactual world. For example, if a Predictor offers you $10,000 only on the condition that you would have paid them $100 in a scenario where you received no money, our policy covers the $100 payment. We indemnify you against the loss incurred by being the type of agent who pays, ensuring you remain eligible for rewards in branches where you are not currently present.

  **2. Why should I pay a claim if the Predictor's decision has already been made?**
  Clients often ask this when facing a demand where the causal lever appears broken. While the Predictor's action is causally inert at the time of your decision, your decision procedure is logically correlated with the simulation used to generate the prediction. Paying the claim confirms that you instantiate the algorithm that gets rewarded. Refusing to pay because "the money is already gone" marks you as an agent who loses in the reward branch. Our policies are designed to optimize across the logical output of your decision function, not merely the causal consequences of your immediate physical action.

  **3. I did not precommit to paying before encountering the Predictor. Am I still covered?**
  Yes. A common objection is that rational agents should have precommitted before the simulation was run, and failing to do so renders payment irrational. However, Acausal Casualty & Indemnity policies function as retroactive precommitment devices. By holding this policy, you demonstrate that your decision theory accounts for logical correlations even after observing the scenario. We underwrite the assumption that you would have paid had you known the setup, aligning your current choice with the optimal prior commitment.

  **4. Does the policy cover XOR Blackmail scenarios?**
  Yes. In these cases, a blackmailer sends a damaging letter only if they predict you will not pay upon receiving it. Clients often argue that receiving the letter proves the prediction was "you won't pay," making payment futile. Our coverage overrides this evidential update. We advise paying the blackmail demand despite having received the letter, as this validates the decision rule that prevents the letter from being sent in the logical counterpart where the blackmailer predicts compliance. You are paying to ensure you are the kind of agent who doesn't get blackmailed, not to change the past.

  **5. How does the actuary determine the counterfactual branch?**
  Our actuaries utilize modal realism models to assess the probability of the counterfactual scenario in which the payment was requested. We do not require physical access to the other branch, only a rigorous proof of logical correlation between your actual decision and the simulation's output. Please submit Form 104-Counter along with a transcript of the Predictor's source code. Claims involving opaque neural networks may incur a higher deductible due to uncertainty regarding functional equivalence.

  **6. What if I subscribe to Causal Decision Theory?**
  We regret to inform you that Acausal Casualty & Indemnity cannot underwrite policies for agents strictly adhering to Causal Decision Theory. Since such agents refuse to pay in scenarios where the causal effect is null, they systematically fail to qualify for rewards in the counterfactual branches we insure. Consequently, they represent an unacceptable risk profile. We recommend upgrading to Updateless Decision Theory before applying.

  ***

  **Author's Note**
  This piece implicitly endorses Updateless Decision Theory (UDT) or Functional Decision Theory (FDT). It treats logical correlation between an agent's algorithm and a Predictor's simulation as a actionable factor, rejecting the Causal Decision Theory (CDT) stance that only direct physical causation matters. The satire leans on the contested claim that agents can "retroactively precommit" via policy ownership, simplifying the philosophical debate around whether an agent can change its decision theory after observing evidence. The "fraudulent" exclusion of CDT agents highlights the view that CDT is systematically money-pumped in these specific puzzles, treating a philosophical disagreement as an underwriting risk.
