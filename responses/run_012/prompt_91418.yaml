answer: |-
  Here is a design for the session. It is built to be run without you needing to "teach" the theory at the start. The theory emerges from the friction of the rules.

  ### Session Title: The Two Gates
  **Duration:** 90 minutes
  **Participants:** 14 (Split into 2 tables of 7)
  **Materials:**
  *   Grid paper (A4 or A3, folded into thirds).
  *   Black markers (thick nib, e.g., Sharpies or Pentel Touch).
  *   **Red and Blue dot stickers** (or red and blue markers if stickers aren't available). *This is the only extra material you strictly need.*
  *   Masking tape (to stick sheets to the wall).

  ---

  ### The Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–05** | **Setup** | Seating, materials distribution. No intro speech. |
  | **05–20** | **Draw** | Three distinct drawing tasks (silent). |
  | **20–50** | **Judge** | The "Two Gate" voting protocol (swapping sheets). |
  | **50–80** | **Debrief** | Wall display and group discussion (mapping the tension). |
  | **80–90** | **Close** | Final thoughts and cleanup. |

  ---

  ### The Rules (Print this out or write it on a flipchart)

  **1. The Setup**
  Fold your paper into three vertical columns. Label them 1, 2, and 3 at the bottom.

  **2. Column 1: The Context (10 mins)**
  Draw three lowercase letters: **n, o, h**.
  *   *Rule:* Do not write them in your normal handwriting. Invent a style. Make them thick, thin, slanted, or weird. But they must look like they belong to the same family.
  *   *Goal:* Create a "world" for the letter 'a' to live in.

  **3. Column 2: The Style Gate (10 mins)**
  Draw a lowercase **a**.
  *   *Rule:* This 'a' must fit perfectly with the **n, o, h** in Column 1. It must look like it was drawn by the same hand, with the same tool.
  *   *Constraint:* You are allowed to distort the 'a' so much that it risks not looking like an 'a' anymore. Prioritise the *family resemblance* over legibility.

  **4. Column 3: The Identity Gate (10 mins)**
  Draw a second lowercase **a**.
  *   *Rule:* This 'a' must be undeniably, safely an 'a'. Anyone passing by must recognise it instantly.
  *   *Constraint:* You are allowed to break the style of Column 1 completely. Prioritise *recognition* over family resemblance.

  **5. The Judging Protocol (30 mins)**
  *   **Swap:** Pass your sheet to the person on your right.
  *   **Vote:** Take your **Red** and **Blue** dots.
      *   Place a **BLUE** dot on Column 2 or 3 if the letter successfully matches the style of Column 1.
      *   Place a **RED** dot on Column 2 or 3 if the letter is successfully recognisable as an 'a'.
  *   **The Conflict:** You *must* place at least one dot on each column. You are allowed to place both, or neither.
  *   **Rotate:** Pass the sheet to the right again. Repeat the voting. Do this until every sheet has been judged by 3 different people.
  *   **Mark:** If a sheet has a Column 2 with *no Red dots* (Style success, Identity failure), circle it in red marker. If a sheet has a Column 3 with *no Blue dots* (Identity success, Style failure), circle it in blue marker.

  ---

  ### The Debrief (50–80 mins)

  Do not stand at the front. Sit with them. Tape the sheets to the wall, grouped by the "circled" failures.

  **Opening Question:**
  "Look at the sheets circled in Red (Column 2: Style success, Identity failure). What did the drawer sacrifice to make it fit the style?"
  *   *Expected answer:* They removed the tail, closed the bowl, made it look like an 'o' or a 'u'.
  *   *Your point:* This is the **Style Gate**. It demands consistency. If you open it too wide, the meaning falls out.

  **Second Question:**
  "Look at the sheets circled in Blue (Column 3: Identity success, Style failure). Why did these 'a's refuse to fit in?"
  *   *Expected answer:* They used a double-storey 'a' when the context was single-storey. They used a serif when the context was sans.
  *   *Your point:* This is the **Identity Gate**. It demands recognition. It is conservative. It resists change.

  **The Core Tension:**
  "Most of you found that Column 2 was harder than Column 3. Why?"
  *   *Discussion:* It is easier to draw a generic 'a' than to draw a *specific* 'a' that still reads.
  *   *The Computer Story:* "There was a project, years ago, trying to teach a machine to design fonts. It failed because it treated 'Is this an a?' and 'Does this fit the set?' as the same question. They aren't. One is about memory (Identity), one is about rules (Style). When you conflated them in your head while drawing, did you feel stuck?"

  **The 'a' vs 'a' Problem:**
  "Did anyone use a single-storey 'a' in Column 1 and a double-storey in Column 3?"
  *   *Discussion:* Point out that these two shapes share almost no geometry, yet we call them the same letter.
  *   *Your point:* Identity is not about features. It's about function. Style is about features. That is why they pull against each other.

  ---

  ### What Will Go Wrong (And How to Fix It)

  **1. The Signwriter Takes Charge**
  *   **Risk:** The retired signwriter may start correcting people's strokes during the drawing phase ("You're holding the pen wrong").
  *   **Fix:** Intervene gently. "For this exercise, bad technique is actually useful. We want to see where the *shape* breaks, not where the skill breaks. Let them struggle."

  **2. The Drawing Runs Over**
  *   **Risk:** 14 people drawing quietly often loses track of time. 10 minutes per column is optimistic.
  *   **Fix:** Be the timekeeper. Call out "Five minutes," "Two minutes," "Stop." If they haven't finished Column 3, tell them to leave it blank. The empty space is data (fear of breaking the rules).

  **3. The Voting Becomes Polite**
  *   **Risk:** British politeness. People will put Blue dots on everything to avoid hurting feelings.
  *   **Fix:** In the instructions, say: "You are not judging the person. You are judging the letter. If it doesn't fit, it doesn't fit. We need failures to learn."

  **4. The "It's Just Handwriting" Objection**
  *   **Risk:** A design student might say, "This isn't type design, it's just doodling."
  *   **Fix:** Agree with them. "Exactly. Type design is just doodling with stricter consequences. The tension is the same."

  ---

  ### Limitations: What This Activity Cannot Do

  Be honest about this in your closing.

  1.  **It cannot teach history.** This session treats letters as abstract shapes. It ignores *why* the 'a' looks the way it does (historical evolution, tools, media). A proper reading would cover the Carolingian minuscule or the humanist sans; this game treats the letter as a frozen object.
  2.  **It assumes a 'correct' Identity.** The activity assumes there is a moment where an 'a' stops being an 'a'. In reality, that boundary is cultural and contextual. In a word, a shape might read as 'a'; in isolation, it might not. The game isolates the letter, which is artificial.
  3.  **It simplifies 'Style'.** Style isn't just visual matching (stroke weight, angle). It's also about spacing, rhythm, and texture. This game focuses on form, which is only one part of stylistic consistency.

  ---

  ### Shaky Framing: Where the Theory Wobbles

  You asked me to flag where my own framing (and the activity's) is contestable. If you repeat this, you should know where the ground is soft.

  **1. The Essence of the Letter**
  The activity assumes an 'a' has an "essence" that can be stripped away. This is philosophically shaky. Wittgenstein would argue there is no single feature common to all 'a's, only "family resemblances."
  *   *Watch for:* If a participant draws a circle with a dot in it and everyone votes "Red Dot" (Is an 'a'), your theory that "features define identity" breaks.
  *   *Adjustment:* If this happens, admit it. "Perhaps identity isn't about features, but about agreement. The letter exists because we agree it exists."

  **2. Style as a Set Property**
  The game assumes style belongs to the *set* (the n, o, h). But style can also belong to the *individual letter*. A typeface can have a 'g' that is wildly different from its 'a' (think of *Futura* or *Gill Sans*).
  *   *Watch for:* If someone draws a Column 3 'a' that clashes with Column 1 but looks *better* than the Column 2 'a'.
  *   *Adjustment:* Acknowledge that good design sometimes breaks consistency for the sake of optical balance. The "Style Gate" is a rule, but rules are made to be broken by experts.

  **3. The Computer Story**
  You mentioned a half-remembered story about a computer project. Be careful citing this. It sounds like **Douglas Hofstadter's *Copycat* project** (analogy making) or early **OCR (Optical Character Recognition)** research where feature extraction failed against stylistic variance.
  *   *Advice:* Do not name a specific researcher unless you verify it. Say: "In early computational design experiments..." If you guess the name and get it wrong, the design students will spot it. The *logic* of the separation is what matters, not the history.

  ### Final Note for You

  You said you have no formal background. That is your advantage here. If you were a typography professor, they would wait for you to give the "right answer." Because you are not, they have to find the answer in the paper in front of them.

  When you feel the tension in the room during the judging phase—that moment where someone holds a blue dot over a shape and hesitates—that is the session working. Do not rush to resolve it. Let them sit in the uncertainty. That uncertainty is the design problem.
