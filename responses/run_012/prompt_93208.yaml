prompt: |-
  I run a small manufacturing firm, and a former supplier is suing me over a contract I terminated. The claim is for $200,000. I can absorb a loss of that size — it would set the business back a couple of years, but it would not sink it — and I am not especially anxious about money on this scale, so I would rather the decision not turn on my appetite for risk.

  My lawyer will not give me a single probability of losing. She gives me two. The first comes from a database of comparable contract disputes: cases with features like mine went against the defendant in somewhere between twenty and thirty-five per cent of instances. The second is her own reading of the merits — the clause, the correspondence, the witnesses — which she puts at forty to sixty per cent. She refuses to merge them into one range, on the grounds that there is no number between thirty-five and forty per cent that she would defend, and she says the two are answers to different questions rather than two readings of a single quantity, so that averaging them would be a mistake. The litigation manager at my insurer, who handles hundreds of such matters, told me she would have said "about one in three," though she added that she would not want to be held to it — a figure that sits almost exactly at the point, thirty per cent by my arithmetic, where settling and going to trial cost me the same.

  If the case goes to trial, I will spend a further $60,000 on fees and expenses whatever the outcome, and $200,000 more if I lose. The plaintiff has offered to settle for $120,000, all in, and the offer stands until Friday.

  I have done the arithmetic for single numbers. If my chance of losing is twenty per cent, trial is plainly the better course; if it is sixty per cent, settlement plainly is. My lawyer says that the fact I can run the same calculation twice and reach opposite answers is itself the thing to be thought about, and not a nuisance to be averaged away. I do not see what else there is to do with a range except pick a number inside it, and I suspect that picking the middle would only launder a guess into a calculation.

  There is one further complication. For a month's work and $15,000 I could commission a mock trial — a focus group run as a rehearsal of the case — which would tell me considerably more about how a jury is likely to see it. Taking that route means letting Friday's offer lapse, since I cannot do both. A friend of mine says the decision is easy, because more information can only ever help. My lawyer is not so sure, at least if I decide in the way she is urging me to decide. I do not understand how learning more could possibly leave me worse off.

  What should I do about the settlement, and how should I be reasoning about her two ranges in the meantime? I would rather have a recommendation than a survey of positions, though I would like to understand the reasoning well enough to stand behind it.
reasoning: |-
  Here's a thinking process that leads to the recommended advice:

  1.  **Analyze the User and Situation:**
      *   **User:** Owner of a small manufacturing firm.
      *   **Financial Position:** Can absorb a $200k loss (plus $60k legal fees), though it would set the business back a couple of years. Not risk-averse regarding this specific sum (risk-neutral for this decision).
      *   **The Dispute:** Former supplier suing over terminated contract. Claim: $200k.
      *   **The Offer:** Settle for $120k (all-in). Deadline: Friday.
      *   **Trial Costs:** $60k (fixed) + $200k (if lose). Total exposure at trial: $260k (if lose), $60k (if win).
      *   **Probabilities:**
          *   Base Rate (Database): 20% - 35% chance of losing.
          *   Case Merits (Lawyer's Assessment): 40% - 60% chance of losing.
          *   Insurer's View: ~33% (breakeven point).
      *   **Lawyer's Stance:** Refuses to merge ranges. Says they answer different questions. Says the divergence *is* the signal. Skeptical of the mock trial's value *given the decision framework she wants the client to use*.
      *   **Mock Trial Option:** Cost $15k. Delays decision (offer lapses). Friend says "more info is always good." Lawyer disagrees.
      *   **Goal:** A specific recommendation (settle, trial, or mock trial) and a clear explanation of the reasoning, specifically addressing how to handle the two probability ranges.

  2.  **Deconstruct the Decision Problem:**

      *   **Expected Value (EV) Calculation:**
          *   *Settle:* Cost = $120,000.
          *   *Trial:* Cost = $60,000 + ($200,000 * $P(Lose)$).
          *   *Breakeven Point:* When does Trial = Settle?
              *   $120,000 = 60,000 + 200,000 * P$
              *   $60,000 = 200,000 * P$
              *   $P = 60,000 / 200,000 = 0.30$ (30%).
          *   *Interpretation:* If $P(Lose) < 30%$, go to trial. If $P(Lose) > 30%$, settle.

      *   **Analyzing the Probability Ranges:**
          *   Range A (Base Rate): 20% - 35%. (Overlaps the breakeven point).
          *   Range B (Merits): 40% - 60%. (Entirely above the breakeven point).
          *   *The Conflict:* The base rate suggests trial *might* be okay (20-29%), but the merits suggest settlement is definitely better (40-60%). The overlap is 30-35%, which favors settlement.
          *   *Lawyer's Insight:* Why won't she merge them? Because they represent *different types of uncertainty*.
              *   Base Rate: "What happens to people like me generally?" (Systemic noise, judicial variance).
              *   Merits: "What happens in *this specific* case given the evidence?" (Specific risk).
              *   If the merits are weak (40-60%), the base rate doesn't save you. You are not a random defendant; you are *this* defendant with *these* witnesses. The specific evidence usually trumps the general statistic in litigation.
              *   *Key Insight:* The base rate is the background; the merits are the foreground. If the foreground looks bad, the background doesn't make it good.

      *   **Analyzing the Mock Trial:**
          *   Cost: $15,000.
          *   Benefit: Reduces uncertainty on $P(Lose)$.
          *   *Friend's Logic:* Value of Information (VOI). More info is never bad.
          *   *Lawyer's Logic:* Why is she skeptical?
              1.  **Timing:** The offer lapses. If the mock trial says "Settle," you might have lost the $120k deal. You'd be settling later for potentially more.
              2.  **Cost vs. Gain:** Is $15k worth it?
              3.  **The "Decision Framework" Clue:** The lawyer says "at least if I decide in the way she is urging me to decide." This is the critical hint. She wants the client to reason about the *ranges*, not pick a point.
              4.  **Ambiguity Aversion vs. Risk:** If the decision rule is "If the *entire* reasonable range of probability suggests settlement, settle," then the mock trial might not change the decision.
              5.  **Mock Trial Limitations:** They are expensive, imperfect predictors. A focus group isn't a jury. It costs $15k *plus* you lose the settlement offer. If the mock trial confirms the lawyer's 40-60% view, you spent $15k to hear what you already know. If it contradicts it, you still face a new range.
              6.  **The "Worse Off" Paradox:** How can info make you worse off?
                  *   *Scenario:* You pay $15k. Mock trial suggests you might win (P < 30%). You reject settlement. Offer is gone. You go to trial. You lose. Total cost: $15k (mock) + $60k (fees) + $200k (judgment) = $275k.
                  *   *Scenario:* You settle now. Total cost: $120k.
                  *   *Real Risk:* The mock trial gives false confidence. It costs money and burns the bridge to the $120k resolution. Given the lawyer's merits assessment (40-60%), the mock trial is unlikely to drop the probability below 30% consistently enough to justify burning the offer.

  3.  **Synthesizing the Recommendation:**

      *   **Decision:** Settle.
      *   **Reasoning on Probabilities:** Do not average. Treat the "Merits" range as the dominant factor. The Base Rate is for *unknown* cases; you have *known* facts. Your facts (Merits) point to 40-60%. That is entirely above the 30% breakeven. The Base Rate only matters if the Merits are ambiguous (e.g., 25-35%). Here, the Merits are clear enough to override the Base Rate.
      *   **Reasoning on Mock Trial:** Do not do it.
          *   It costs $15k.
          *   It kills the $120k offer.
          *   The Lawyer's Merits assessment (40-60%) is already strong enough to dictate settlement.
          *   The "Value of Information" is low because the current information already points clearly to settlement *unless* the mock trial drastically changes the view of the merits. But mock trials are noisy. Paying $15k to potentially confirm what the lawyer already says (and lose the settlement leverage) is bad EV.
          *   Addressing the Friend's claim: Information has a *cost*. If Cost > Expected Benefit, it makes you worse off. Also, information can lead to *overconfidence* (gambling on trial after paying for the mock), leading to the worst-case outcome ($275k vs $120k).

  4.  **Drafting the Response:**

      *   *Tone:* Professional, decisive, analytical, respectful of the lawyer's nuance.
      *   *Structure:*
          1.  Direct Recommendation (Settle, No Mock Trial).
          2.  The Breakeven Math (Establish the 30% threshold).
          3.  Interpreting the Two Ranges (Why the Lawyer is right, why Merits trump Base Rate).
          4.  The Mock Trial Trap (Why the Friend is wrong, why the Lawyer is right about "deciding the way she urges").
          5.  Conclusion/Next Steps.

      *   *Refining the "Two Ranges" argument:* I need to explain *why* averaging is wrong without getting too academic.
          *   Analogy: Weather forecast vs. Looking out the window.
          *   Base Rate = Historical weather for this month.
          *   Merits = Looking at the dark clouds right now.
          *   If clouds say rain (40-60%), history saying it's usually dry (20-35%) doesn't keep you dry.
          *   The "Gap" (35-40%): The lawyer won't bridge it because it represents the transition from "General Risk" to "Specific Liability."
          *   Decision Rule: If the *lower bound* of the Merits range (40%) is higher than the Breakeven (30%), you settle. You don't need to know the exact number.

      *   *Refining the Mock Trial argument:*
          *   It's not just $15k. It's $15k + Loss of Settlement Option.
          *   If the mock trial says "Win," you go to trial. If you lose trial, you paid $15k extra to lose $260k instead of $120k.
          *   Given the lawyer's 40-60% assessment, the likelihood of the mock trial shifting the view to <30% is low.
          *   The Lawyer's comment "if I decide in the way she is urging" implies she wants the client to accept the *range* as the decision input, not seek a point estimate. If you accept the range 40-60%, the decision is made. Buying a mock trial implies you don't trust the range, but you have no better source of truth.

  5.  **Final Review against Constraints:**
      *   User wants a recommendation, not a survey.
      *   User wants to understand the reasoning well enough to stand behind it.
      *   User is risk-neutral (money wise), so focus on EV and logic, not fear.
      *   Address the "how learning more could leave me worse off" paradox.

  6.  **Self-Correction/Nuance Check:**
      *   *Wait, is the Base Rate 20-35% losing or winning?* Text says "went against the defendant in somewhere between twenty and thirty-five per cent." So P(Lose) = 20-35%.
      *   *Merits:* "forty to sixty per cent." P(Lose) = 40-60%.
      *   *Breakeven:* 30%.
      *   *Base Rate:* Overlaps breakeven (20% is good, 35% is bad).
      *   *Merits:* Entirely above breakeven (40% is bad).
      *   *Conclusion:* The Merits assessment is the binding constraint.
      *   *Mock Trial:* If I spend $15k, I need the EV of the trial path to improve by more than $15k + loss of settlement leverage.
      *   *Wait, one nuance:* If I do the mock trial, the offer lapses. Can I settle *after* the mock trial? Probably, but likely for more, or the plaintiff might feel emboldened. The prompt says "letting Friday's offer lapse." I should assume the $120k is gone if I choose the mock trial.
      *   *Lawyer's Hint:* "if I decide in the way she is urging me to decide." She is urging him to treat the ranges as distinct inputs where the specific trumps the general. If he accepts that, the mock trial is redundant.

  7.  **Final Polish:** Ensure the explanation of the "Two Ranges" is intuitive. Use the "Reference Class vs. Specific Evidence" framing. Ensure the Mock Trial section explains the "Value of Information" fallacy clearly.

      *(Self-Correction on Mock Trial Cost)*: The $15k is sunk. If he does the mock trial, he pays $15k. Then he faces the trial/settle decision *without* the $120k offer. He might settle later for $140k. Or go to trial.
      *   Current Best Option: Settle @ $120k.
      *   Mock Trial Path: Pay $15k. Offer Gone. New Decision.
      *   For Mock Trial to be worth it, the *new* decision must save >$15k compared to the $120k baseline.
      *   If Mock Trial says "Settle" (likely, given lawyer's view), you settle later (say $130k) + $15k cost = $145k. Worse than $120k.
      *   If Mock Trial says "Trial" (optimistic), you go to trial. EV of trial is >$120k (based on lawyer's 40-60%). Plus $15k cost. Worse than $120k.
      *   So Mock Trial is almost certainly a loss.

      *Ready to write.*
answer: |-
  **Recommendation**

  You should **accept the settlement offer of $120,000** and **decline the mock trial.**

  This is not a compromise; it is the mathematically superior decision based on the information you already possess. Your lawyer is correct: averaging the probabilities is a mistake, and your friend is incorrect that more information is always valuable.

  Here is the reasoning you need to stand behind this decision.

  ### 1. The Breakeven Threshold
  First, establish the number that matters. You are risk-neutral, so we look strictly at Expected Value (EV).

  *   **Settlement Cost:** $120,000.
  *   **Trial Cost:** $60,000 (fees) + [$200,000 × Probability of Losing].

  You should go to trial only if the Trial Cost is *lower* than the Settlement Cost.
  $$60,000 + (200,000 \times P) < 120,000$$
  $$200,000 \times P < 60,000$$
  $$P < 0.30$$

  **Your breakeven point is 30%.** If your chance of losing is below 30%, fight. If it is above 30%, settle.

  ### 2. How to Reason About the Two Ranges
  Your lawyer refuses to merge the ranges because they measure different things. Merging them (e.g., averaging 20–35% and 40–60% to get ~35%) falsely implies they are equally weighted measurements of the same uncertainty. They are not.

  *   **Range A (Base Rate: 20–35%):** This is the "Reference Class." It tells you what happens to *other people* in *similar situations* when the specific details are unknown. It is background noise.
  *   **Range B (Merits: 40–60%):** This is the "Specific Evidence." It tells you what happens given *your* witnesses, *your* contract clause, and *your* correspondence.

  **The Rule of Specificity:** In litigation, specific evidence trumps general statistics.
  Imagine a weather forecast. The "Base Rate" says it only rains on 20% of days in October. But the "Merits" say there are dark clouds and a low-pressure system over your head right now (40–60% chance of rain). You do not average these to decide whether to carry an umbrella. You look at the clouds.

  Your lawyer's assessment of the merits (40–60%) is entirely above your 30% breakeven threshold. Even the *most optimistic* reading of your specific case (40%) is worse than the *most pessimistic* reading of the general statistics (35%). The specific evidence indicates you are a riskier defendant than the average defendant in the database.

  Therefore, the Base Rate range is irrelevant to the decision. It is drowned out by the Merits range. You do not need to pick a number inside the 40–60% range. You only need to know that the *entire* range sits above 30%. That is sufficient to settle.

  ### 3. Why the Mock Trial Makes You Worse Off
  Your friend relies on a principle called the "Value of Information." In theory, knowing more is better. In practice, information has a price, and it can alter your leverage. Your lawyer's skepticism is grounded in three specific costs:

  **A. The Cost of the Option**
  The $120,000 offer expires Friday. If you commission the mock trial, that offer vanishes.
  *   **Scenario 1:** The mock trial confirms your lawyer's view (likely). You still settle, but now you have paid $15,000 for the mock trial, and the plaintiff, knowing you delayed, may demand $130,000 or more to settle later. Total cost: $145,000+.
  *   **Scenario 2:** The mock trial gives a false positive (possible). Focus groups are not juries; they are noisy. If the group tells you "you look like a winner," you might reject a future settlement and go to trial. If you then lose at trial, your total cost is $15,000 (mock) + $60,000 (fees) + $200,000 (judgment) = $275,000.
  *   **Current Path:** Settle now. Total cost: $120,000.

  For the mock trial to be worth $15,000 plus the loss of the settlement offer, it would need to reliably shift your probability assessment from >40% to <30%. Given your lawyer's firm 40–60% assessment of the merits, the likelihood of a focus group overturning the weight of the evidence is low. You are paying a premium to gamble on a low-probability outcome.

  **B. The Decision Framework**
  Your lawyer said the mock trial is only useless "if I decide in the way she is urging me to decide." She is urging you to accept that **uncertainty is a range, not a point.**
  *   If you believe the probability is a *range* of 40–60%, the decision is already made (Settle).
  *   If you buy the mock trial, you are implicitly rejecting the range and demanding a *point* estimate. You are paying $15,000 to try to convert a range into a number.
  *   But litigation *is* a range. No amount of spending will turn a trial into a certainty. By paying for the mock trial, you are paying to indulge the illusion that certainty is possible.

  **C. How Information Hurts**
  Information leaves you worse off when it costs more than the change in behavior it triggers.
  Currently, your behavior is "Settle."
  For the mock trial to change your behavior to "Trial," it must convince you your risk is <30%.
  If it does that, and it is wrong, you lose $275,000 instead of $120,000.
  If it does *not* change your behavior (you still settle), you have paid $15,000 + lost leverage for no gain.
  In both branches, you are financially worse off than accepting the offer today.

  ### Summary for Your Records
  You are not settling because you are afraid of losing. You are settling because the **Specific Evidence (40–60% risk)** exceeds your **Financial Breakeven (30% risk)**. The General Statistics (20–35%) are overridden by the Specific Evidence.

  You are declining the mock trial because the **Cost of Information ($15k + Lost Offer)** exceeds the **Expected Value of Information**, given that the current data already dictates a settlement.

  Sign the settlement agreement before Friday.
