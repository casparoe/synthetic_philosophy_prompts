answer: |-
  Sorry to hear you woke up still annoyed about that argument. Debates about divine sovereignty and free will have a way of sticking in your head like a bad song, especially when they happen late at night. The good news is that you and Tom are grappling with one of the most famous and difficult problems in philosophical theology, so you are in good company. The specific objection Tom raised is actually a well-known critique called the Grounding Objection, and it is the main hill that Molinists have to defend. However, while Tom is right to point out the tension, he might be moving a bit too fast in saying it collapses entirely into Calvinism. There are distinctions there, even if they are subtle, and there is a major misunderstanding in how he is visualizing God's knowledge that is worth clearing up first.

  The first thing to tackle is his idea that God works through this knowledge in stages, like a checklist where He finishes natural knowledge, moves to middle knowledge, and then wraps up with free knowledge. That is a common way to explain it, but it is technically misleading if taken literally. Molinists insist that these moments are logically prior, not temporally prior. Since classical theism holds that God is outside of time and does not change, there is no sequence of events in God's mind. He does not learn things or process information in steps. When they say middle knowledge is logically prior to the decree, they mean that the truth of what a creature would freely do does not depend on God's decision to create, not that God thought about it yesterday and decided to create today. It is about dependence relations rather than a timeline. So, if Tom is picturing God sitting there waiting to see the results of middle knowledge before He acts, he is imagining a process that Molinism explicitly denies. God knows everything in one simple, eternal act, but we distinguish the objects of that knowledge to understand how freedom and sovereignty fit together.

  Now, onto the heavier stuff regarding whether your choice is a foregone conclusion. Tom's argument is that if it is true before you exist that you would rob the bank, then you have no choice but to rob the bank. This is where the distinction between certainty and necessity becomes crucial. In Calvinism, your action is necessary because God decrees it to happen; He causes the will to move in a specific direction. In Molinism, the truth of the counterfactual does not cause your action. Think of it like a perfect predictor. If I know you so well that I can say with one hundred percent certainty that you will order pizza when you get home, my knowing that doesn't force you to order pizza. You order it because you want it. My knowledge just reflects what you will freely do. Molinists argue that God's middle knowledge is like that but infinitely perfect. The statement you would rob the bank is true because of something about you, specifically how your free will would respond in that situation, not because God forced you to do it. The certainty comes from God's knowledge, but the necessity comes from the nature of the agent.

  However, this is exactly where Tom hits the nerve that philosophers call the Grounding Objection, and this is where you might feel he has a point. The question is, what makes that counterfactual statement true before you exist? If you do not exist yet, and God has not decreed anything yet, what is the reality that makes the statement true? If there is nothing grounding that truth, then it seems like a brute fact, which is philosophically uncomfortable. If God grounds it, then it looks like He is determining your actions, which slides back into Calvinism. Molinists try to walk this tightrope by saying that the truth is grounded in the creature's own nature or potentiality, even before they exist. They argue that you have a certain essence that includes how you would freely act in certain circumstances. So, it is not that God is making you do it, but that God knows who you are and knows how that specific version of you would react. Tom is right to be skeptical here because it is a very mysterious claim, but it is not identical to Calvinism because the source of the action remains the creature, not the Creator.

  The real difference between the two views comes down to what kind of freedom is being preserved. Calvinism generally holds to compatibilist freedom, where you are free if you are doing what you want to do, even if your wants were determined by God. Molinism holds to libertarian freedom, where you must be able to do otherwise in the exact same situation. For the Molinist, if God placed you in that situation with the crowbar, you genuinely could have chosen not to rob the bank, even though God knew you would. The truth of the counterfactual does not remove the power to choose differently; it just means God knew which way you would lean. Tom is arguing that if God knew it beforehand, you could not have done otherwise, but that assumes that foreknowledge implies causation. Molinists deny that link. They say God knows it precisely because you will do it freely, not that you will do it because He knows it.

  So, is Tom right that it is just determinism with an extra step? The verdict is nuanced. He is right that Molinism faces a serious philosophical challenge in explaining what makes those counterfactuals true without limiting God or eliminating freedom. Many philosophers think the Grounding Objection is fatal to Molinism, so your instinct to nod along was understandable. However, he is wrong that it is simply Calvinism with extra machinery. The machinery is not just decorative; it is attempting to preserve a specific kind of freedom that Calvinism explicitly rejects. In Calvinism, God writes the script and the actors read it. In Molinism, God sets the stage and knows exactly how the actors will improvise, but the actors are still improvising. Whether you find that distinction satisfying depends on whether you think knowing an action beforehand makes it determined. If you think knowledge implies causation, Tom wins. If you think knowledge can reflect reality without causing it, Molinism holds up.

  Ultimately, you do not have to decide the verdict tonight, and you certainly do not need to lose sleep over it. Tom has identified the weakest link in the Molinist chain, but he has perhaps overstated the case by equating it directly with Calvinism. The system is designed to avoid determinism, and while it might not succeed to everyone's satisfaction, it is not merely a rebranding of predestination. It is a genuine attempt to hold two things together that seem to pull apart. If you value libertarian freedom, Molinism offers a path that Calvinism does not, even if that path requires accepting some mysterious truths about counterfactuals. If you value a more robust view of divine control, Calvinism is cleaner. You and Tom are essentially standing on different sides of a line that has been drawn for centuries, and neither side has a knockdown argument that forces the other to surrender. You can probably go back to him and admit that his point about the grounding of truth is strong, but stand your ground on the difference between certainty and causation. That should at least give you both enough common ground to end the argument and get some sleep.
