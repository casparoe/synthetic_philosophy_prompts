answer: |-
  **Mark:** 55/100
  **Classification:** Lower Second Class (2:2)

  **Point-by-Point Assessment**

  **Paragraph 1: Setting out the objection**
  *   **Claim:** "The demandingness objection is the charge that consequentialism asks more of us than morality can legitimately ask."
      *   **Accuracy:** Accurate. This is the standard definition.
      *   **Support:** Supported immediately by reference to Singer.
      *   **Weight:** Appropriate.
  *   **Claim:** "Singer holds that if it is in our power to prevent something bad without sacrificing anything of comparable moral importance, then we ought to do it..."
      *   **Accuracy:** Accurate formulation of Singer's 'strong principle' from *Famine, Affluence, and Morality*.
      *   **Support:** Good use of textual reference.
      *   **Weight:** Bears the weight well; establishes the foundation of the objection.
  *   **Claim:** "...we ought to give until we reach the level of marginal utility..."
      *   **Accuracy:** Accurate.
      *   **Support:** Implicitly supported by the previous sentence.
      *   **Weight:** Correctly identifies the extreme implication which generates the objection.
  *   **Claim:** "...ordinary concerns... turn out to be so much wrongful self-indulgence."
      *   **Accuracy:** Accurate characterisation of the counter-intuitive result.
      *   **Support:** Adequate for this stage of the answer.
      *   **Weight:** Appropriate.

  **Paragraph 2: Relation to other objections**
  *   **Claim:** "The objection is not that consequentialism gets its facts wrong. It is that a theory which condemns almost everything we do cannot be a correct account of morality..."
      *   **Accuracy:** Accurate distinction between internal and external criticism (intuition-based).
      *   **Support:** Reasonable inference from Para 1.
      *   **Weight:** Acceptable.
  *   **Claim:** "Understood in this way, the objection is really a version of the one Rawls presses against utilitarianism, that it does not take seriously the distinction between persons..."
      *   **Accuracy:** Problematic. Rawls' 'separateness of persons' objection is primarily concerned with *justice* and *rights* (sacrificing one for the many), whereas demandingness concerns the *agent's own sacrifice* for the many. While both stem from aggregation, conflating them overlooks the distinct normative focus of Rawls' critique.
      *   **Support:** Unsupported assertion. The candidate does not explain *how* the distinction between persons maps onto the demandingness objection beyond the general idea of aggregation.
      *   **Weight:** The candidate puts significant weight on this ("really a version of"), but the link is too tenuous for a second-year level without further argument. This is a mistake of substance regarding the interpretation of Rawls.
  *   **Claim:** "Williams makes a related point when he argues that utilitarianism alienates the agent from his own projects and so destroys his integrity."
      *   **Accuracy:** Accurate summary of Williams' integrity objection.
      *   **Support:** Standard interpretation.
      *   **Weight:** Better than the Rawls point. Williams is indeed more relevant to demandingness than Rawls, but integrity and demandingness are not identical (one concerns identity/alienation, the other quantity of sacrifice). The candidate treats them as synonymous rather than overlapping.

  **Paragraph 3: Reply and Assessment**
  *   **Claim:** "Consequentialists usually reply that the objection only touches the act-based version of the theory."
      *   **Accuracy:** Debatable. Many act-consequentialists (e.g., Singer, Peter Unger) bite the bullet rather than retreat to rule-consequentialism. It is *a* reply, but characterising it as the usual or primary reply ignores the 'bite the bullet' strategy or 'satisficing' consequentialism.
      *   **Support:** Lacks nuance.
      *   **Weight:** Overstated.
  *   **Claim:** "Rule-consequentialism... any set that survived that test would contain permissions to favour one's own projects..."
      *   **Accuracy:** Accurate description of the Rule-Consequentialist move (e.g., Hooker).
      *   **Support:** Adequate explanation of the mechanism (general acceptance).
      *   **Weight:** Reasonable.
  *   **Claim:** "The demandingness objection therefore tells against act-utilitarianism, but not against consequentialism as such, and it does not show that consequentialism is false."
      *   **Accuracy:** Too swift. Rule-consequentialism can also be demanding (if the optimal rules require significant sacrifice). Furthermore, shifting to RC changes the theory significantly; critics argue this concedes the core consequentialist insight.
      *   **Support:** The conclusion does not fully follow from the premise without evaluating whether RC *successfully* avoids the objection.
      *   **Weight:** The assessment of "how far the objection succeeds" is the weakest part of the script. It declares victory for consequentialism too easily.

  **Categorisation of Issues**

  *   **Mistakes of Substance:** The conflation of Rawls' 'separateness of persons' with the demandingness objection is a conceptual error. Rawls is concerned with the sacrifice of the few by the many; demandingness is concerned with the sacrifice of the agent by the total sum. They are distinct applications of the aggregation problem. Additionally, the claim that RC is immune to demandingness is not fully defended; RC codes can still be highly demanding.
  *   **Omissions:** The answer omits the 'bite the bullet' response (accepting the demands and rejecting common-sense morality), which is a major strand of consequentialist defence. It also omits 'satisficing consequentialism' as an alternative reply to RC. There is no discussion of whether shifting to RC undermines the consequentialist commitment to maximisation. The answer is also quite short for a 50-minute essay; further elaboration on the evaluation of the reply was expected.
  *   **Style and Presentation:** The writing is clear, concise, and grammatically correct. The structure follows the question logically. However, the brevity limits the depth of analysis.

  **Feedback Sheet Comments**

  You have provided a clear and structured account of the demandingness objection, particularly in your exposition of Singer's argument, which is accurate and well-expressed. However, your comparison with Rawls is conceptually imprecise, as his objection concerns rights and justice rather than the extent of personal sacrifice, and your assessment of the rule-consequentialist reply is too optimistic without considering whether rules themselves can be demanding. To improve, you should distinguish more carefully between distinct objections to utilitarianism and evaluate the proposed replies with greater critical rigour.

  **First-Class Requirement**

  A first-class answer would have critically evaluated whether rule-consequentialism truly escapes the demandingness objection or merely mitigates it, and would have considered alternative consequentialist responses such as satisficing consequentialism or the 'bite the bullet' strategy.
