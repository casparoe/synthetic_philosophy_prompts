      *   *Threshold Hunch:* The user is right that linear/threshold is a false dichotomy (there are probabilistic thresholds, tipping points, etc.). But the Participation View doesn't *solve* the metaphysics; it just declares them irrelevant. That's a strength *if* the metaphysics are murky, but a weakness if the harm *requires* a threshold to exist.
