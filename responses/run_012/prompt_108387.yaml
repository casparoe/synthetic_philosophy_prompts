      *   *Philosophical Lineage:* This sounds like a mix of Complicity Theory (Kutz), Constitutive Harm, and perhaps a non-consequentialist take on collective action. It resonates with Travis Timmerman's or Christopher Kutz's work on complicity.

  3.  **Brainstorming Objections (The "Map"):**
