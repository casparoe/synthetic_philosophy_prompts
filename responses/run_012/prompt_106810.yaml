  6.  **Drafting the Debrief (Socratic, not Lecturing):**
      *   Need to guide them to: Reference (same person) vs. Sense (different info).
      *   Need to introduce: Descriptivism (Frege) vs. Direct Reference/Millianism (the "names" view).
