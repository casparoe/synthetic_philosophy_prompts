  *Wait, no:* If the Dean doesn't know the identity, "Dean believes Vance is tall" is True. "Dean believes NightOwl is tall" is False. This is *not* the Frege Puzzle for the *students*. This is just opaque contexts.
  *The Real Frege Puzzle:* "Hesperus is Hesperus" vs "Hesperus is Phosphorus."
