      *   *Section 2: The "Cheapness" of the Stance.* This is the crux. Dennett's stance works on humans because we *can't* predict them physically. On LLMs, we *could* (in theory) predict them mathematically, but we choose not to. But the LLM is "gaming" the stance. It was trained to look like a believer. This makes the stance less informative. It's a "hallucination of agency."
