          *   *Actually, the Bostrom/Ord "Moral Trade" paper:* It assumes agents maximize their own *subjective* expected value. Trade is possible if Agent A thinks Cause X is 2x better than Y, and Agent B thinks Cause Y is 5x better than X. If A donates to Y and B donates to X... A loses value.
          *   *Wait, the trick:* Moral trade usually involves *compromise* on a shared budget or *swapping* donations.
