          *   *Correction:* The gains come from *marginal* differences or *leverage*. Usually, moral trade works because of *diminishing marginal returns* or *different cost-effectiveness estimates*, OR it works because I value *your* satisfaction of your moral goal (if I am a preference utilitarian).
          *   *Wait, standard Moral Trade (Bostrom/Ord):* It relies on *subjective* valuations. If I value AW at 10 and GP at 1. You value GP at 10 and AW at 1. If I donate to GP and you donate to AW, we both lose utility *unless* we are trading *influence* or *effort*, OR if we are trading based on the idea that "I get utility from the world being better according to *my* lights."
          *   *Actually, the standard model:* I care about AW. You care about GP. I donate to GP *on the condition* you donate to AW. Why would I do that? Because I value the *trade* itself? No.
          *   *The Real Mechanism:* It's about *marginal impact*. If I am an AW advocate, the marginal dollar to AW might have low impact (saturated). The marginal dollar to GP might have high impact *and* you value it highly.
          *   *Wait, let's look at the specific claim:* "whenever each party cares more about the other's cause than about her own." This implies I value GP > AW. If I value GP > AW, why am I an AW advocate? This is contradictory.
          *   *Correct Condition:* Gains appear when parties have *different ratios* of valuation (comparative advantage in valuation), NOT when each cares more about the other's cause. If I care more about your cause than my own, I should just switch causes. Trade is beneficial when I care more about my cause, but you care *even more* about your cause relative to mine, and vice versa.
