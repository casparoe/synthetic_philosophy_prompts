          *   *Correct Condition:* Gains appear when there is a divergence in *relative* valuations (ratios), not absolute preference reversal. I value AW > GP. You value GP > AW. But I value GP *relatively higher* than you value AW? No.
          *   *Let's recall the standard economic model:* I value X at 10, Y at 5. You value X at 5, Y at 10. If I give you X and you give me Y... wait, we are donating money.
