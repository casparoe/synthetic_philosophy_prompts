      *(Self-Correction during drafting)*: Make sure to distinguish between "Moral Trade" as defined by Bostrom/Ord (which heavily relies on moral uncertainty) and the colleague's definition (which sounds like simple barter of terminal values). The colleague's definition is the one that is logically broken without the uncertainty caveat. I must highlight this.

