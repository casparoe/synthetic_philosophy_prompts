      *   *If I donate to Poverty:* I get 0 utility (from my perspective).
      *   *So why trade?*
      *   *Answer:* Because I acknowledge that *my* moral view might be wrong. (Moral Uncertainty). OR, because I value *your* satisfaction (Preference Utilitarianism about agents).
      *   *The Text's Claim:* "gains appear... whenever each party cares more about the other's cause than about her own."
      *   *Verdict:* This is definitely wrong. If I care more about Poverty than Animals, I should just donate to Poverty. Trade implies I *prefer* Animals but accept Poverty *in exchange* for you accepting Animals.
      *   *Correction:* Gains appear when parties have **different ratios of valuation** combined with **moral uncertainty** or **diminishing marginal returns**. The text misses the uncertainty/returns aspect entirely.

  6.  **Refining the "Collective Action" Claim:**
      *   Collective action problems usually involve public goods and free-riders.
      *   Moral trade is a private contract.
      *   Does it solve the *collective* problem of disagreement? No, it just creates a local island of cooperation.
