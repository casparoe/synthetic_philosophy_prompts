      *   **Output Requirement:** Point out errors and provide corrected versions where necessary.

  2.  **Analyze the Source Text (The Colleague's Summary):**
      *   *Claim 1:* "Moral trade is the practice of two parties who disagree about values agreeing to advance each other's preferred causes instead of their own..." (Definition)
