          *   *My Utility:* $u_A(Cause_A) = 10$, $u_A(Cause_B) = 1$.
          *   *Your Utility:* $u_B(Cause_B) = 10$, $u_B(Cause_A) = 1$.
          *   *Status Quo:* I donate \$1 to A (Utility 10). You donate \$1 to B (Utility 10). Total World Utility (Subjective): 20.
          *   *Trade:* I donate \$1 to B (Utility 1). You donate \$1 to A (Utility 1). Total: 2.
          *   *This makes no sense.* Why does anyone propose moral trade?
          *   *Ah, the "Moral Trade" paper (Bostrom, Ord, Tobin 2015):* It's about *compromise*. It's not "I donate to yours, you donate to mine." It's "We agree to support a compromise cause" OR "I support yours, you support mine" *only if* we have different estimates of *effectiveness*.
          *   *Wait, there are two types:* 1. Value Trade (different terminal values). 2. Empirical Trade (same values, different beliefs).
          *   *The text describes Value Trade:* "you care about animal welfare and I care about global poverty."
          *   *How does Value Trade work?* It works if we are *preference utilitarians* regarding each other's satisfaction? No.
          *   *It works if we acknowledge uncertainty.* "I think AW is best, but there's a 40% chance you're right."
          *   *Actually, the specific claim in the text is the "Comparative Advantage" argument.* This relies on the idea that I can produce "AW good" cheaper than you, and you can produce "GP good" cheaper than me. But the text talks about *donating*.
          *   *The Error:* The text claims gains appear "whenever each party cares more about the other's cause than about her own." This is logically incoherent for a trader. If I care more about GP than AW, I am a GP advocate, not an AW advocate trading with you.
          *   *Correct Condition:* Gains appear when the *ratio* of valuations differs. (I value AW/GP at 10/1, you value GP/AW at 10/1). But even then, swapping donations loses value.
          *   *Resolution:* Moral trade in the EA context usually relies on **moral uncertainty**. I am 60% sure AW is best, 40% GP. You are 60% GP, 40% AW. We trade to hedge. OR, it relies on **diminishing returns**. The 100th dollar to AW is worth less than the 1st dollar to GP.
          *   *The text's claim is too strong/wrong.* It suggests a simple swap of preferences is enough. It ignores the necessity of moral uncertainty or diminishing marginal utility.
      *   *Meta-ethics (Claim 7):* "Nothing... requires... revise her moral views." True, but ignores the objection that if moral realism is true, trading away the 'true' good is bad. Defensible simplification for a pragmatic syllabus, but philosophically thin.
      *   *Obstacles (Claim 8):* "not ethical but psychological." **Mistaken.** There are serious ethical objections (complicity, integrity, moral realism).
      *   *Collective Action (Claim 9):* "Natural solution to collective-action problems." **Inflated.** It solves a coordination problem between *willing* traders. It doesn't solve the broader collective action problem of moral disagreement in society (free riders, enforcement).
      *   *Carbon Offsets (Claim 10):* "Logic is the same as... carbon offsets." **Misleading.** Carbon offsets are about neutralizing harm (compensation), not necessarily trading moral goals for mutual gain. It's a specific type of trade, but the analogy might confuse students about the *purpose* (indulgence vs. cooperation).

  4.  **Drafting the Critique:**

      *   *Introduction:* Acknowledge the draft is engaging but contains significant philosophical errors that could mislead graduate students.
      *   *Section 1: The Source of Gains (The "Comparative Advantage" Claim).*
