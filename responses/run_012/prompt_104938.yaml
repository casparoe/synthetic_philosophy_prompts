      *   *Why?* Because I value your adherence to deontology (maybe I respect autonomy) or you value the utility.
      *   *Wait, the standard EA Moral Trade model:* It assumes **Moral Uncertainty**. "I think Utilitarianism is 60% likely, Deontology 40%." "You think Deontology 60%, Utilitarianism 40%."
