  **Examination Question**

  Consider a fictional character introduced solely via a bare list of properties: 'She is impatient; she is meticulous; she is estranged from her brother; she is a lapsed botanist.' There is no narrative action, no bodily description, and no underlying substance posited beyond these predications. In metaphysics, Bradley's Regress challenges how properties unite to form a fact or object, arguing that a relation connecting property to substance requires further relations ad infinitum.

  Write an essay addressing the following:
  1. Does Bradley's Regress arise for this fictional character as it does for a real object, or is it blocked by the nature of fiction?
  2. Evaluate whether standard philosophical solutions to the regress (e.g., primitive unity, unsaturated concepts, or trope theory) apply to this fictional case, or if the textual nature of fiction requires a distinct account of character unity.

  Reason from first principles; no external citations are required or permitted.

  ***

  **Model Answer**

  Bradley's Regress arises from the problem of predication: if a particular 'a' and a property 'F' are distinct entities, what connects them? If a relation 'R' connects them, 'R' must be connected to 'a' and 'F' by further relations, generating an infinite regress. The regress threatens the unity of the proposition, suggesting that facts cannot be composed of distinct constituents without a unifying principle.

  In the case of the fictional character defined by a bare list, the regress appears initially potent. We have properties (impatience, meticulousness) but no apparent substance ('she') to bear them. If 'she' is merely a placeholder for the list, there is no ontological glue. However, the regress is arguably blocked by the textual nature of fiction. Unlike real objects, which exist independently of their descriptions, a fictional character is constituted by the text itself. The unity is not metaphysical but stipulative. The authorial act of listing these properties under one name creates the unity ex nihilo. There is no gap between the character and the properties because the character *is* the collection of properties presented as unified by the grammar of the text.

  Regarding standard solutions, Frege's distinction between saturated objects and unsaturated concepts offers a linguistic parallel. In fiction, the name 'She' functions as a saturated placeholder, while the properties are unsaturated functions waiting to be filled by the text. This avoids the regress because the unity is grammatical, not ontological. However, this risks reducing the character to a mere sentence, ignoring the reader's intuition of a coherent persona.

  Primitive unity suggests the fact 'She is impatient' is brute. Applied to fiction, this implies the character is a primitive abstract object. Yet, this reintroduces the substance problem: what is this abstract object? Trope theory, treating properties as particularised instances, might suggest the character is a bundle of compresent tropes. But without a principle of compresence, we return to the heap problem.

  Ultimately, fiction demands a distinct account. In reality, we seek the ground of unity in substance or causality. In fiction, the ground is narrative coherence. The properties unite because they serve a singular thematic or dramatic function within the work. The regress is blocked not by metaphysics, but by convention. The text does not describe a pre-existing unity; it performs the unifying. Therefore, while the logical form mirrors the metaphysical problem, the solution lies in the philosophy of language and art, not ontology. The character is unified because the text says so, and within the fictional context, that stipulation is sovereign.

  ***

  **Marking Scheme**

  | Criteria | Specific Moves Required | Marks |
  | :--- | :--- | :--- |
  | **Understanding of the Regress** | Correctly identifies the regress as a problem of predication and unity (relation requires further relation). | 4 |
  | **Application to Fiction** | Distinguishes between metaphysical substance (real persons) and textual stipulation (fictional persons). | 4 |
  | **Evaluation of Standard Solutions** | Analyses at least two standard escapes (e.g., Frege, Tropes, Primitive Unity) and tests their fit for fiction. | 6 |
  | **Original Argument** | Argues whether fiction blocks the regress or requires a new account (e.g., narrative coherence vs. ontology). | 4 |
  | **Clarity and Structure** | Essay is logically organised, concise, and adheres to the no-citation constraint. | 2 |
  | **Total** | | **20** |

  **Deductions for Common Mistakes**

  | Mistake | Deduction |
  | :--- | :--- |
  | Reciting Bradley's Regress without applying it to the fictional case. | -3 |
  | Confusing the fictional character with the author or the reader. | -3 |
  | Claiming the regress is identical for fiction and reality without qualification. | -2 |
  | Relying on named philosophers (e.g., 'Bradley says...') rather than reasoning. | -2 |
  | Failing to address both parts of the question (Blocked? Solutions apply?). | -4 |

  *Note: An A-grade answer must secure full marks in 'Understanding' and 'Application', plus at least 5 marks in 'Evaluation'.*
