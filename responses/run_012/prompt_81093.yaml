prompt: |-
  I've just been handed the "pledges and promises" portfolio at the behavioural insights unit I work for — we're a small team bolted onto a city council, four economists, a psychologist and me, and because I did a philosophy minor about a decade ago I've somehow become the person who signs off on whether the rest of it is ethically ok. Every month departments send us proposals that involve paying residents for some kind of promise: $25 to sign a card saying you'll cut your household energy use this winter, a lottery entry for ticking a box that you intend to get your flu shot, grocery vouchers for pledging to volunteer at a community garden. The money usually gets paid at the moment of promising, sometimes as cash, sometimes as a draw entry, sometimes as a discount you only get by having pledged at all. The last person in this job left in March and there are eleven proposals in the backlog, I get about forty minutes per proposal, I've got a spreadsheet and no budget to pilot anything first, the council can't make a pledge legally binding and we can't claw money back afterwards, and the deputy mayor wants answers before the fiscal year closes. What I need from you is a procedure my team can actually run: the questions to ask in order, what counts as a good enough answer to each, the point at which it stops with a no and we write down why, and the point at which it stops and goes to a person because its a values question rather than a factual one. I don't need a reading list, I need the thing itself.

  The worry thats been nagging at me is a puzzle I half-remember from an undergrad course — I think its Kavka's toxin puzzle. Someone offers you a fortune to *intend*, tonight, to drink a vial of something tomorrow that will make you violently ill for a day but do no lasting harm. If you genuinely form the intention tonight, the money is yours, paid immediately. Tomorrow you're still free to change your mind and skip the vial, and nobody takes the money back. The unsettling part is that a sensible person can want the fortune, can see perfectly clearly that intending is what gets it, and can still fail to intend — because they know that tomorrow, standing there with the money already banked, they will have no reason at all to drink. The payment is for the intention; the act the intention points at is, on its own, just bad. I suspect half the proposals on my desk have that shape, and I suspect the other half only look like they do — because everyone keeps telling me pledge programs "work," and I can't tell whether that means follow-through is real or whether we're just counting signatures. I brought it up at dinner with a friend who does contracts law and she was no help at all, so its you. Turn it into a test I can run.

  So: give me the procedure, then run it on three things from the backlog, and be honest about where it misfires. First, the deputy mayor's pet project — pay $30 to residents who sign a community pride pledge promising to keep their front garden tidy and say hello to two neighbours a week; paid on the spot, no verification, no follow-up visit, and the department's own success metric is the number of pledges. Second, a public health proposal where residents who pledge in writing at the pharmacy counter to get a flu shot are entered into a $500 draw, with the draw entry handed over at the moment of pledging and the shot verified later only for the department's reporting. Third, a variant a colleague floated that I genuinely can't get my head around: pay people nothing at all for the pledge, but print the names of everyone who pledged in the local paper, with the pledge being to turn up to a free health screening. I want at least one of these to come out with an answer I won't enjoy delivering, and I want you to mark clearly the places where the procedure can't decide — where the real question is whether a certain kind of pressure on residents is acceptable rather than whether the scheme will change behaviour — and say plainly what the procedure can't do at all, including anything it would need data we don't have to settle.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Ethical reviewer for a Behavioural Insights Unit (BIU) attached to a city council.
      *   **Team:** Small (4 economists, 1 psychologist, 1 reviewer with philosophy minor).
      *   **Task:** Create a practical ethical review procedure for "pledges and promises" programs (paying residents to promise future action).
      *   **Constraints:** 40 mins/proposal, no pilot budget, no legal enforceability, no clawback, fiscal year deadline looming.
      *   **Core Concern:** Kavka's Toxin Puzzle (paying for intention vs. action, where the action has no intrinsic value to the agent once paid).
      *   **Deliverables:**
          1.  A step-by-step procedure (questions, pass/fail criteria, escalation points).
          2.  Apply the procedure to three specific backlog cases.
          3.  Be honest about where the procedure misfires or can't decide (values vs. facts).
          4.  Identify data gaps.
      *   **Tone:** Practical, direct, no reading lists, "the thing itself."

  2.  **Deconstruct the Ethical Problem (Kavka's Toxin & Pledges):**
      *   *Kavka's Puzzle:* Payment is for *intention*. Once paid, the incentive to *act* disappears (unless there's intrinsic motivation). If the act is costly/harmful, rational agents won't act.
      *   *Application to BIU:* If we pay for the pledge, do we care if they follow through?
          *   If *no* (success = signatures): We are potentially deceiving residents or wasting public money on empty gestures. We are buying "compliance signaling" rather than outcomes.
          *   If *yes* (success = behavior change): We need a mechanism that bridges the gap between "paid intention" and "unpaid action."
      *   *Ethical Risks:* Waste of public funds, manipulation/coercion, privacy (naming lists), creating false hope, undermining intrinsic motivation (crowding out).

  3.  **Drafting the Procedure (The "Test"):**
      *   Needs to be fast (40 mins).
      *   Needs to distinguish between "Good Pledge" (bridges intention-action) and "Bad Pledge" (Toxin structure).
      *   Needs to flag values questions for leadership.
      *   *Structure:*
          *   Gate 1: Legality & Feasibility (Hard No).
          *   Gate 2: The Kavka Test (Intention vs. Action alignment).
          *   Gate 3: Welfare & Equity (Harm to participants).
          *   Gate 4: Public Trust (Transparency & Perception).
          *   Escalation: Values Conflicts.

      *   *Refining the Questions:*
          *   Q1: Is the payout contingent on the *pledge* or the *act*? (If pledge, does the act matter?)
          *   Q2: If the act doesn't happen, is public value still generated?
          *   Q3: Is the cost of the act to the resident higher than the benefit of the pledge?
          *   Q4: Is there a mechanism to support follow-through?

  4.  **Applying the Procedure to the Three Cases:**

      *   **Case 1: Community Pride ($30 for tidy garden/hello neighbors).**
          *   *Structure:* Pay on pledge. No verification. Metric = signatures.
          *   *Analysis:* Classic Toxin structure. Money for intention. No incentive to actually do it. Public money wasted if no action.
          *   *Verdict:* Fail on Value for Money/Deception.
          *   *Values Question:* Is "feeling good about signing" enough public value? (Probably not for council).

      *   **Case 2: Flu Shot ($500 draw entry for pledge, shot verified for reporting).**
          *   *Structure:* Pay (lottery ticket) on pledge. Shot verified later but not for payment.
          *   *Analysis:* Incentive is front-loaded. Once they have the ticket, why get the shot? Unless the ticket is voided if they don't show? Prompt says "entry handed over at moment of pledging." This is Toxin-adjacent. However, health outcomes matter.
          *   *Verdict:* Risky. Needs modification (entry contingent on proof).
          *   *Values Question:* Is a lottery ethical for health?

      *   **Case 3: Public Shaming/Listing (Names in paper for health screening, no money).**
          *   *Structure:* No money. Social pressure.
          *   *Analysis:* Not Toxin (no payment for intention). But raises coercion/privacy issues.
          *   *Verdict:* Fail on Privacy/Autonomy.
          *   *Values Question:* Is social pressure an acceptable tool for the council?

  5.  **Refining the "Misfires" and Limitations:**
      *   The procedure can't measure *crowding out* (does paying kill intrinsic motivation?) without data.
      *   The procedure can't decide *political values* (is social pressure okay?).
      *   The procedure assumes rational actors (behavioral econ knows they aren't always).
      *   The "40-minute" constraint means we can't verify empirical claims deeply.

  6.  **Drafting the Content (Iterative refinement for tone and clarity):**
      *   *Tone:* Professional, slightly weary but sharp, acknowledging the constraints.
      *   *Formatting:* Clear headers, checklists, bold text for decisions.
      *   *Kavka Integration:* Explicitly name the "Toxin Test" within the procedure.

      *(Self-Correction during drafting)*: Make sure I don't just say "No" to everything. The user needs a *procedure*, not just my opinion. The procedure must allow a "Yes" if criteria are met.
      *   *Correction:* For Case 2, if the draw entry is *valid* only upon vaccination, it passes. If it's valid on pledge, it fails. The prompt says "entry handed over at moment of pledging." I need to treat that as the fatal flaw unless corrected.
      *   *Correction on Case 3:* This isn't a Toxin puzzle. It's a coercion puzzle. I need to make sure the procedure catches *both*.

  7.  **Final Review against Constraints:**
      *   Did I give the procedure? Yes.
      *   Did I run it on the three cases? Yes.
      *   Did I mark where it misfires/can't decide? Yes.
      *   Did I address the Kavka worry? Yes.
      *   Is it practical for a 40-min review? Yes, kept it to a checklist format.

  8.  **Final Polish:** Ensure the distinction between "Factual/Empirical" (will it work?) and "Normative/Values" (should we do it?) is clear, as that's the escalation point.

  *(Self-Correction on Case 1)*: The prompt says "success metric is the number of pledges." This is the smoking gun. It confirms the Toxin structure. The procedure must flag this as "Buying Signals, Not Outcomes."

  *(Self-Correction on Case 3)*: The prompt says "pay people nothing." So Kavka doesn't apply directly. But the *structure* of commitment is similar. The procedure needs a "Coercion/Pressure" gate.

  Let's build the "Pledge Integrity Protocol (PIP)."

  *Step 1: The Legal/Hard Gate.*
  *Step 2: The Kavka/Incentive Gate.*
  *Step 3: The Public Value Gate.*
  *Step 4: The Equity/Pressure Gate.*
  *Escalation:* Values conflicts.

  Okay, ready to write.
answer: |-
  Here is the procedure, followed by the application to your three backlog cases, and finally an honest assessment of where the procedure breaks down.

  ### The Pledge Integrity Protocol (PIP)

  **Time limit:** 40 minutes.
  **Purpose:** To filter out ethically hazardous or fiscally wasteful pledge schemes before they reach the Deputy Mayor.
  **Authority:** If a proposal fails a "Hard Stop," it is rejected. If it triggers a "Values Flag," it is escalated to you (the reviewer) for a recommendation to the Deputy Mayor.

  #### Phase 1: The Hard Stops (10 Minutes)
  *If any answer is NO, the proposal is rejected immediately. Write the rejection code.*

  1.  **Legality & Privacy:** Does the proposal violate current municipal privacy bylaws or human rights codes (e.g., publishing names, discriminating in eligibility)?
      *   *No:* **Reject (Code L1)**.
  2.  **Fiscal Clarity:** Is the total maximum liability capped and within the department's existing budget?
      *   *No:* **Reject (Code F1)**.
  3.  **Deception:** Does the proposal explicitly tell residents they will *not* be required to fulfill the pledge to receive the benefit?
      *   *Yes:* **Reject (Code D1 - Explicit Fraud)**.
      *   *No/Unsure:* Proceed to Phase 2.

  #### Phase 2: The Kavka Test (Incentive Alignment) (15 Minutes)
  *This addresses your Toxin worry. We are checking if we are paying for "intention" while severing the link to "action."*

  4.  **The Payout Trigger:** Is the benefit (cash, voucher, lottery entry) awarded *upon signing* or *upon verification of action*?
      *   *Upon Verification:* **Pass.** (Standard incentive).
      *   *Upon Signing:* Proceed to Q5.
  5.  **The Follow-Through Mechanism:** If paid on signing, is there a secondary mechanism that makes fulfilling the pledge rational *after* payment is received? (e.g., social monitoring, loss aversion deposit, scheduled appointment).
      *   *Yes:* Proceed to Q6.
      *   *No:* **Reject (Code K1 - Toxin Structure)**. *Rationale: Public funds are purchasing signals, not outcomes. Once paid, the resident has no economic reason to act.*
  6.  **The Metric:** What is the department's defined success metric?
      *   *Behavior Change (e.g., energy reduced, shots given):* **Pass.**
      *   *Participation (e.g., pledges signed):* **Reject (Code K2 - Signal Buying)**. *Rationale: If success is signatures, the actual behavior is irrelevant to the department, rendering the pledge ethically hollow.*

  #### Phase 3: Welfare & Equity (10 Minutes)
  *Even if the incentives align, is the pressure acceptable?*

  7.  **Cost to Resident:** Does fulfilling the pledge require significant time, money, or physical discomfort from the resident?
      *   *Yes:* Proceed to Q8.
      *   *No:* **Pass.**
  8.  **Support Provision:** Does the program provide the means to fulfill the pledge (e.g., free shots, tools, childcare)?
      *   *No:* **Flag for Values Escalation (Code V1 - Burden Shifting)**. *Rationale: Asking vulnerable residents to bear the cost of public goals.*
  9.  **Social Pressure:** Does the program rely on publicizing participation or non-participation to drive compliance?
      *   *Yes:* **Flag for Values Escalation (Code V2 - Coercion)**.
      *   *No:* **Pass.**

  #### Phase 4: Escalation Decision (5 Minutes)
  *   **If Rejected (Codes L, F, D, K):** Draft rejection memo citing code. Send to Department Head. Copy Deputy Mayor.
  *   **If Passed:** Approve for implementation.
  *   **If Values Flag (Codes V):** Draft briefing note. State: *"The mechanism is functionally sound, but relies on [pressure/burden] that requires a political decision on acceptability."* Send to You for final sign-off.

  ***

  ### Application to Backlog Cases

  Here is the PIP run on the three specific proposals you mentioned.

  #### Case 1: Community Pride ($30 for garden/neighbor pledge)
  *   **Phase 1:** Legal? Yes. Fiscal? Yes. Deception? No (doesn't explicitly say they don't have to do it).
  *   **Phase 2 (Kavka Test):**
      *   Q4 (Payout): Upon signing.
      *   Q5 (Follow-Through): No verification, no visit. Once they have the $30, tidying the garden costs them time/money with no further reward. **Fail.**
      *   Q6 (Metric): Success = number of pledges. **Fail.**
  *   **Decision:** **REJECT (Code K1 & K2).**
  *   **Reasoning:** This is the Toxin Puzzle operationalized. You are paying $30 for a signature. The department admits the outcome (tidy gardens) is not the metric. This is fiscally wasteful and treats the resident's intention as a commodity to be bought and discarded.
  *   **Enjoyment Level:** High. This is an easy kill. The metric alone disqualifies it.

  #### Case 2: Flu Shot Lottery ($500 draw entry on pledge)
  *   **Phase 1:** Legal? Yes. Fiscal? Yes. Deception? No.
  *   **Phase 2 (Kavka Test):**
      *   Q4 (Payout): Entry handed over at moment of pledging.
      *   Q5 (Follow-Through): Prompt states shot is verified *only for reporting*. This implies the draw entry is not voided if they fail to vaccinate. Once they have the ticket, the cost of the shot (time, needle anxiety) outweighs the marginal increase in win probability. **Fail.**
      *   *Correction Path:* If the proposal is amended so the ticket is *only valid* upon proof of vaccination, it passes Q5.
      *   Q6 (Metric): Reporting implies they care about shots, but the incentive structure undermines it.
  *   **Phase 3 (Welfare):**
      *   Q7 (Cost): Minor physical discomfort/time.
      *   Q9 (Pressure): Low.
  *   **Decision:** **REJECT (Code K1) - *unless amended*.**
  *   **Reasoning:** As written, this is a softer Toxin. You are buying "intenders," not "vaccinated residents." A rational actor takes the ticket and skips the needle.
  *   **Amendment:** Change to "Entry drawn from *verified* recipients." If amended, it **PASSES**.
  *   **Enjoyment Level:** Medium. It's fixable, but the current draft is ethically lazy.

  #### Case 3: Public Name List (Free health screening, names in paper)
  *   **Phase 1:**
      *   Q1 (Privacy): Publishing names of residents in a local paper for health activities likely violates municipal privacy bylaws regarding personal information.
      *   *Assumption:* If they have signed a waiver, it passes Legal. Let's assume they have a waiver to test the ethics.
  *   **Phase 2 (Kavka Test):**
      *   Q4 (Payout): No money.
      *   Q5 (Follow-Through): Social reputation is the currency.
      *   Q6 (Metric): Turnout.
      *   *Result:* Passes Kavka (Incentive aligns with action via social pressure).
  *   **Phase 3 (Welfare):**
      *   Q9 (Social Pressure): **Yes.** Relies on publicizing participation.
      *   *Result:* **Flag for Values Escalation (Code V2).**
  *   **Decision:** **ESCALATE TO YOU (Code V2).**
  *   **Reasoning:** The procedure cannot decide this. It is not a Toxin problem; it is a coercion problem. The mechanism *works* (people will show up to avoid shame or gain praise), but is it the council's place to use social pressure as a tool?
  *   **Enjoyment Level:** Low. This is the one you won't enjoy delivering. Rejecting it looks like you're "soft"; approving it looks like you endorse surveillance/shaming.

  ***

  ### Where the Procedure Misfires (The Limitations)

  You asked for honesty about where this test fails. Here are the three blind spots you will face when you use this tomorrow.

  **1. The "Crowding Out" Blind Spot (Data Gap)**
  The PIP assumes that if incentives align (Case 2 amended), the program works. It does not account for *motivational crowding out*. Behavioral literature suggests paying people for pro-social acts (or creating transactional pledges for civic duties) can reduce intrinsic motivation.
  *   **The Misfire:** A proposal might pass the PIP but actually result in *fewer* flu shots long-term because residents now expect payment for civic health.
  *   **What we lack:** We have no budget to pilot. We cannot know if the pledge kills the intrinsic desire to be a good neighbor. The PIP treats this as a "Pass" because we can't measure it. You have to note this uncertainty in the briefing.

  **2. The Values Vacuum (Code V)**
  In Case 3, the PIP flags the issue but cannot solve it. The procedure identifies *that* there is social pressure, but it cannot tell you *if* that pressure is legitimate for a city council to wield.
  *   **The Misfire:** You will have to write the recommendation. The PIP says "This is a values question." You are the values question.
  *   **The Hard Truth:** The Deputy Mayor wants "answers." The PIP gives you "questions." You will need to translate "Code V2" into "We recommend against this because it shifts the burden of public health onto social coercion, which risks alienating vulnerable residents." That is a political call, not an ethical calculation.

  **3. The Rationality Assumption (Kavka's Limit)**
  The PIP assumes residents are rational enough to realize they don't need to act once paid (The Toxin logic). But your unit is based on Behavioral Insights. People are *not* fully rational. They suffer from present bias, consistency pressure, and memory failures.
  *   **The Misfire:** Case 1 might actually work *despite* failing the Kavka Test. People might tidy their gardens because they signed the card and want to be consistent, even if the $30 is already spent.
  *   **The Risk:** If you reject Case 1 based on rational actor theory, but the Psychologist on your team argues "Consistency heuristics will drive 40% compliance anyway," the PIP looks out of touch.
  *   **The Fix:** Add a note to the rejection: *"Rejected on principle, not efficacy."* Acknowledge it might work, but state that paying for signals without verifying outcomes is not a sustainable use of public funds.

  ### Summary for the Deputy Mayor
  When you present this, your narrative is:
  1.  **Case 1 is dead.** We don't buy signatures; we buy outcomes.
  2.  **Case 2 is fixable.** Tie the lottery ticket to the arm, not the pen.
  3.  **Case 3 is yours to decide.** We *can* do this, but do we *want* to be the council that prints names in the paper?

  The procedure protects you from the Toxin Puzzle by forcing the "Metric" question (Q6). If they admit they only care about pledges, you have the fiscal warrant to say no. If they care about outcomes, they must fix the incentive structure. The rest is politics.
