answer: |-
  You are standing in the exact spot where legal philosophy meets practical politics. This is not just club drama; you have stumbled into the **Problem of Constitutional Self-Entrenchment**, specifically the **Amendment Paradox**.

  In jurisprudence, this is the question of whether a sovereign body can limit its own future power using its own current rules. In your club, the "sovereign" is the membership.

  Here is the established treatment of your situation, the distinction between your four moves, and the answer to whether the constitution is a bluff.

  ### 1. The Name and The Theory
  The specific logical knot you are in regarding the April vote is called the **Self-Referential Validity Problem**.

  The established treatment comes from two main sources:
  *   **H.L.A. Hart's *Rule of Recognition*:** In *The Concept of Law* (1961), Hart argues that a legal system rests on a ultimate rule that everyone accepts as valid. In your club, the "Rule of Recognition" isn't the written constitution; it is the *shared acceptance by the members* that the constitution matters. If that acceptance fractures, the text is just paper.
  *   **The Doctrine of Parliamentary Sovereignty (Dicey):** In British common law theory, a sovereign body (like your club, if it has no external landlord or regulator overriding you) **cannot bind its successors**. Any rule that says "you cannot change this" is legally void because the current majority can simply vote to ignore it.

  ### 2. Distinguishing the Four Moves
  Your gut says they are all the same trick. Your friend says only 2 and 3 are dodgy. **Your friend is closer to the legal distinction, but for the wrong reason.**

  The distinction isn't about "dodginess"; it is about **Temporal Direction** and **Ontological Status**. Here is how legal theory categorizes them:

  **Move 1: The April Vote (The Bootstrapping)**
  *   **Type:** *Meta-Rule Change.*
  *   **Mechanism:** Using Rule A to create Rule B, which makes Rule A harder to use.
  *   **Status:** This is the **Amendment Paradox**. Most courts (e.g., in *Jackson v Attorney General* in the UK) rule that if the procedure was followed *according to the rules at the time*, the change is valid. The logic is: The 2/3 rule authorized the creation of a 90% rule. Once created, the 90% rule governs the future.
  *   **Verdict:** This is standard constitutional mechanics. It is not inherently a trick, though it creates the logical loop you are stuck in.

  **Move 2: Retroactive Ratification (Proposal 1)**
  *   **Type:** *Curative Validation.*
  *   **Mechanism:** Admitting an act was void *at the time*, but declaring it valid *now*.
  *   **Status:** This is distinct from Move 1. Move 1 claims "We followed the rules then." Proposal 1 claims "We broke the rules then, but we fix it now."
  *   **Verdict:** This is legally common (curative legislation) but logically fragile. It requires the current body to have the power to rewrite history. It is **Procedural Retroactivity**.

  **Move 3: Redefining "Member" (Proposal 2)**
  *   **Type:** *Ontological Retroactivity.*
  *   **Mechanism:** Changing the definition of a noun to alter the count of a past event.
  *   **Status:** This is far more dangerous than Proposal 1. Proposal 1 changes the *rule*; Proposal 2 changes the *facts*. It asserts that reality in 2019 was different than we thought.
  *   **Verdict:** This is the "dodgy" one your friend identified. It undermines the reliability of all past minutes. If you can change who was a member in 2019, you can change anything.

  **Move 4: The Dead Hand (Proposal 3)**
  *   **Type:** *Perpetual Entrenchment.*
  *   **Mechanism:** Attempting to remove the power to amend entirely.
  *   **Status:** In almost all sovereign legal theories, this is **void ab initio** (invalid from the start). A sovereign body cannot commit suicide. If the current members want to change it, they can. Requiring a dead man's vote is a fiction that effectively says "This rule cannot be changed."
  *   **Verdict:** This is a bluff. It is unenforceable unless you have an external court willing to uphold it (which you don't).

  ### 3. The Line: Procedure vs. Ontology
  You asked where the line sits between changing a rule and changing what counts as having followed it.

  *   **Changing the Rule (Moves 1 & 2):** This alters the *threshold* for validity. It accepts the past happened but changes the *standard* by which we judge it. This is generally acceptable in private associations *if* the current membership agrees.
  *   **Changing the Ontology (Move 3):** This alters the *reality* of the past. It says the vote count *was* different, not that the *requirement* was different. This is the bright red line. Once you allow the definition of "member" to fluctuate retroactively, the constitution ceases to be a constraint and becomes a weapon.

  ### 4. Can a rule reach backwards?
  **Legally:** Yes, via **Ratification**. If a committee makes a decision without a quorum, the full board can later vote to "ratify" that decision, making it valid as of the original date.
  **Logically:** No. It is a legal fiction. You are not making the past compliant; you are waiving the right to challenge the non-compliance.

  **However,** ratification only works if the body doing the ratifying *currently has the power* to do the act. If the 90% rule is in force, you cannot ratify a 2/3 vote unless you first repeal the 90% rule (which requires 90%). You are stuck in the loop.

  ### 5. Is "You Can't Change This" a Bluff?
  **Yes.**
  In a voluntary association with no external enforcement (like a state court), the constitution is a contract. But the **ultimate sovereign is the current membership.**

  If 84% of the members present vote to revert to the 2/3 rule, and they all sign the minutes, and nobody resigns or sues (you can't sue yourselves effectively in this context), **the 90% rule is dead.**

  The "90% rule" only exists because you agree to pretend it exists. If the collective will of the club shifts, the document does not constrain you; you constrain the document. This is the **Political Question Doctrine** in microcosm. The text cannot stop a determined majority from seizing the means of rule-making.

  ### 6. A Framework for Resolution
  You are stuck in a **Performative Contradiction**. You are using the rules to debate which rules apply. You cannot vote your way out of this using the current constitution because the validity of the vote is the thing in dispute.

  Here is the established treatment for resolving this, often used in parliamentary procedure (e.g., *Robert's Rules of Order* in extremis) and constitutional crises:

  **The "Reset" Convention**
  You must acknowledge that the *Rule of Recognition* has broken. The text is no longer guiding the club; the club is fighting over the text.
  1.  **Suspend the Constitution:** A motion is made to temporarily suspend the constitution to resolve the constitutional crisis. (Ironically, this usually requires a 2/3 vote, which you have).
  2.  **Adopt Interim Rules:** The meeting agrees that for the purpose of *this specific vote only*, the threshold is 2/3 (the original rule), acknowledging the ambiguity of the April vote.
  3.  **Pass the Reversion:** Vote to revert to the 2/3 amendment rule.
  4.  **Re-ratify the Constitution:** Once the amendment clause is back to 2/3, the constitution is coherent again.

  **Why this works:** It relies on the **Hartian truth**: The law is what the officials (members) accept as law. If 84% accept the "Reset," the crisis is over. The only risk is the minority (the 16%) claiming the club has dissolved or stolen their property interest in the building.

  ### Summary of Distinctions
  *   **Move 1 (April):** *Self-Entrenchment.* Valid if accepted, logically paradoxical.
  *   **Proposal 1 (Ratification):** *Curative.* Valid if the current body has the power to cure (which is the debate).
  *   **Proposal 2 (Redefinition):** *Fictionalizing.* Dangerous. Changes facts, not rules.
  *   **Proposal 3 (Dead Hand):** *Void.* A sovereign cannot bind itself permanently.

  **The Name for your specific feeling:** You are experiencing **Normative Uncertainty**. You don't know which norm governs the norm.

  **The Advice:** Stop trying to find the "correct" legal answer in the text. There isn't one. The text is the source of the virus. The only cure is a **Political Reset**. Call a meeting, declare the amendment clause currently "inoperative due to ambiguity," and vote by a show of hands (simple majority or 2/3) to restore the original clause. If the minority walks out, let them. If they stay, they have accepted the new reality. The constitution is a tool for the members, not the master of them.
