answer: |-
  Summary
  The idealization posits that deliberation is nothing more than bounded agents passing decomposed tasks up a recursive tree. There is no magic at the top; system competence is strictly the sum of bottom-level competence plus the structure of decomposition and recombination. The crucial implication is that institutional understanding is an illusion; only the process exists. This matters most because it strips institutions of claims to holistic wisdom they cannot justify step-by-step. If deliberation is merely factored cognition, then no single mind ever grasps the verdict, and "wisdom" becomes a property of the archive rather than the agent. This dismantles the traditional defense of expert authority.

  The implications, most important first
  First, there is no emergent wisdom. This descends directly from the claim that competence at the top is nothing over and above the competence of bounded agents at the bottom. If an institution takes this seriously, it must abandon the language of intuition or gestalt judgment. A committee cannot claim to "see" the truth of a complex matter in a way that exceeds the sum of its verified sub-claims. This implies that institutional authority cannot rest on the prestige of its leaders, but only on the transparency of its tree. An institution claiming insight it cannot decompose is, by this definition, deluding itself.

  Second, understanding is distributed, not held. This presupposes the first implication: if there is no holistic wisdom at the top, no single agent holds the justification for the final verdict. Each agent understands only their node. For an institution, this means "knowing" something is not a mental state of its members but a structural property of its records. The implication is radical: the institution understands, but the people working within it do not. This shifts the value of employment from expertise to reliability. You do not hire the smartest person; you hire the person who best fulfills their bounded role without hallucinating context they cannot see.

  Third, power shifts to the decomposers. This presupposes the second implication: if understanding is fragmented, the person who cuts the questions determines what can be known. The structure of the tree dictates the verdict as much as the answers at the leaves. In practice, this means the most powerful actor in a deliberative body is not the one who answers the hardest questions, but the one who decides how to break them down. An institution adopting this must treat decomposition as a political act requiring oversight, not merely a technical step. Whoever defines the sub-questions defines the boundaries of the truth.

  Fourth, accountability becomes granular. This also presupposes the second implication regarding distributed understanding. Because every node is a bounded agent with a fixed budget, failure can be traced to a specific leaf or a specific recombination step. There is no diffuse responsibility where "the committee" decides. If a verdict is wrong, the institution can identify exactly which agent failed to answer their narrow question correctly, or which decomposer framed it poorly. This eliminates the shelter of collective responsibility. It implies a culture of precise blame, where errors are localized defects rather than systemic failures, potentially encouraging risk-aversion among agents fearing isolation.

  Fifth, disagreement becomes structural rather than social. This presupposes the third implication about the power of decomposition. In traditional deliberation, conflict arises from clashing values or interpretations. In factored cognition, conflict arises when outputs fail to fit inputs during recombination. Disagreement is a type error, not a value conflict. For an institution, this means consensus is not achieved through persuasion or compromise, but through debugging the tree. If two branches yield contradictory facts, the solution is not debate but restructuring the decomposition. This risks sanitizing conflict, treating deep value disagreements as mere procedural glitches that can be solved by cutting the questions differently.

  These five implications form a cascade. Without accepting the death of emergent wisdom, you cannot accept distributed understanding. Without distributed understanding, you cannot locate power in decomposition or accountability in nodes. Finally, without accepting the primacy of structure, disagreement loses its social texture. Taken together, they describe an institution that is perfectly transparent but potentially inhuman, where truth is manufactured by procedure rather than discovered by minds.

  Where the idealization gives out
  The picture treats decomposition, recombination, and checking as though they were free and faithful, but these are the very sites where deliberation often succeeds or fails. The idealization cannot describe paradigm shifts. Factored cognition assumes the initial frame is correct; it optimizes within a tree but cannot explain how to grow a new one. Real deliberation often requires stepping outside the decomposition to question whether the questions themselves are wrong. This is not marginal; it is how science and law progress.

  Furthermore, the model struggles with value conflicts. It works for hard factual judgments where answers can be recombined logically. It fails when the sub-questions involve competing goods that cannot be standardized into a common currency for recombination. You cannot decompose "justice" into bounded factual claims without losing the tension that makes justice difficult. Finally, it assumes faithful transmission. Real deliberation relies on trust, rhetoric, and social glue to ensure answers are not gamed. The idealization leaves out the human cost of being a bounded agent—the alienation of working without context. These are not engineering obstacles; they are features of deliberation the model excludes by construction. It describes a machine that thinks, not a community that decides.

  The line to lead with
  "If this picture is true, wisdom is not a property of the mind that judges, but of the structure that sorts. There is no one home at the top." This is the honest line because it accepts the researchers' premise without flinching. It is not the most exciting claim—they promise better truth—but it is the necessary cost. If deliberation is just factored cognition, then the feeling of understanding is a user interface trick, and the institution is a blind mechanism that works only so long as no one asks it to explain itself as a whole.
