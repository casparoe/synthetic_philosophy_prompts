prompt: |-
  ok so I'm a junior and my psych teacher is letting me pick my own topic for the final paper, and I picked Inside Out, because she said the movie is definately a theory of emotions and I want to know if thats actually true or if it's just a cartoon about five little guys in a control room.

  What I want from you is a real reading of the movie as a claim about what emotions are. The three options we did in class: emotions as feelings (the James thing, where an emotion just is the feeling of what your body is doing), emotions as judgments (Nussbaum and Solomon, so being sad is judging that you lost something that mattered to you, meaning theres a thought inside the emotion), and emotions as perceptions (de Sousa and Prinz, where an emotion is a way of seeing something as mattering, more like a sense than a belief, which is why you can be scared of flying while knowing its safe). My teacher also mentioned in passing that some psychologists now say emotions arent natural kinds at all and get built out of more basic ingredients, which I'm pretty sure is Barrett, and I dont know what to do with that one, so use it if it helps.

  Stuff I keep getting stuck on and want you to actually deal with:

  - The movie gives Riley almost no thoughts. She has emotions at a console and basically nothing else. If being sad is judging that you lost something, whose judgment is it, Riley's or Sadness's? And if Sadness is a little person with her own feelings and her own goals, does the movie just push the question back a step forever?
  - Sadness is the one who fixes everything. She sits with Bing Bong while he cries, she touches a happy memory and it turns blue, and at the end Riley cries to her parents and the memory that forms is both colours at once. Does that mean the movie secretly thinks emotions are appraisals of what matters, since sadness is the one whos right about the move being a loss, even though it looks like the movie thinks emotions are just little guys?
  - The cast of five looks exactly like the old basic emotions list, minus surprise. Then the movie ends by saying one memory can be two emotions at once. Is the ending quietly wrecking the movie's own theory, or is that just a nice image?
  - The abstract thought room, where the characters get flattened into 2D and then into a line. What is the movie saying there? I think it's saying something weird about abstraction and I cant tell what.
  - Do the parents' consoles, and the personality islands falling down and coming back, commit the movie to anything about where emotions come from or how much of you they are?

  And then the part I actually need: where does the movie resist the reading? If I try to make it a judgment theory movie, which scenes dont fit, and am I just flattening a kids film into a lecture. Finish by telling me what the movie shows that the philosophy papers cant, because I think the two colour memory does something the papers would like but would never come up with on their own. Aim for maybe 900 words, I'll expand it into the paper myself. And dont tell me to go read anything, I have no library access tonight and neither do you, so no citations or page numbers, just the argument. Also dont quote dialogue at me, I'll get the lines wrong if I try to use them anyway.
