      *   *Judgment (Nussbaum/Solomon):* Emotion involves cognitive appraisal (judging something as lost, dangerous, etc.). *Inside Out* personifies these appraisals. Sadness judges loss. Joy judges gain. But who is judging? The little person? This risks infinite regress (homunculus).
      *   *Perception (de Sousa/Prinz):* Emotion as a way of seeing value/mattering. Calibrates attention. *Inside Out* fits well here. Emotions filter what Riley pays to (Joy filters for fun, Sadness for loss).
      *   *Constructed Emotion (Barrett):* Emotions aren't natural kinds (hardwired distinct entities) but constructed concepts based on interoception and context. *Inside Out* starts with Natural Kinds (distinct colored blobs) but ends with Construction (mixed memories, complex personality).

