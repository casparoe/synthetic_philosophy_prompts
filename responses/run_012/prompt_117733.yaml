answer: |-
  **INTERNAL GUIDANCE NOTE**

  **TO:** Director, Benefit-Cost and Equity Shop
  **FROM:** Harm-Reduction Unit
  **SUBJECT:** Operationalising the Cumulative Micro-Harm Review (CMHR)
  **DATE:** 24 May 2024

  **1. PURPOSE**

  This document sets out the operational procedure for applying the Cumulative Micro-Harm Review (CMHR) framework to low-frequency/high-severity proposals. It is designed for use by two analysts within a one-week turnaround. It distinguishes between factual calculations and ethical judgments, ensuring that where the mathematics runs out, the decision is explicitly handed to senior leadership.

  **2. THE FOUR KNOBS (OPERATIONAL SETTINGS)**

  To make the CMHR usable, we must fix the default settings for the four variables. These defaults are based on current departmental risk tolerance but are marked as adjustable policy choices.

  *   **Knob 1: The Severity Floor**
      *   *Definition:* The minimum intensity a burden must reach to be counted. Below this, the burden is treated as zero.
      *   *Default Setting:* **"Noticeable Interference"**. This is defined as: >5 minutes of added time, OR >1% probability of mild physical pain, OR >3 additional form fields.
      *   *Rationale:* Filters out noise without ignoring genuine nuisance.
      *   **[JUDGMENT CALL]:** Setting this threshold is a policy choice, not a scientific fact.

  *   **Knob 2: The Reversibility Multiplier**
      *   *Definition:* A weight applied to the duration of the burden.
      *   *Default Setting:* Temporary (<6 months) = **1x**. Permanent/Long-term (>6 months) = **5x**.
      *   *Rationale:* Acknowledges that permanent scarring or disability is qualitatively worse than temporary discomfort.

  *   **Knob 3: The Distributional Discount**
      *   *Definition:* A weight applied to burdens falling on vulnerable populations.
      *   *Default Setting:* General Population = **1x**. Top 20% Vulnerable (by Index of Multiple Deprivation or clinical vulnerability) = **2x**.
      *   *Rationale:* Aligns with the agency's equity mandate. A burden on someone already struggling counts double.

  *   **Knob 4: The Catastrophic Anchor**
      *   *Definition:* Determines when aggregation of micro-burdens is permitted against severe harms.
      *   *Default Setting:*
          1.  **Trigger:** Aggregation is only permitted if the prevented harm involves Death or Permanent Loss of Function.
          2.  **Concentration Limit:** If the *per-person* expected burden is below the Severity Floor (Knob 1), aggregation is **blocked**. The proposal must go to Human Review.
          3.  **Cap:** Total Weighted Burden Units cannot exceed 5,000,000 per life saved.
      *   *Rationale:* Prevents "tyranny of the majority" scenarios while allowing necessary public health trade-offs.

  **3. THE DECISION PROCEDURE (CHECKLIST)**

  **Step 1: Characterise the Prevented Harm**
  *   Does the proposal prevent Death or Permanent Loss of Function?
      *   **No:** Stop. You cannot aggregate micro-burdens to prevent minor harms. **Verdict: NO.**
      *   **Yes:** Proceed to Step 2. **[JUDGMENT CALL]:** Defining "Permanent Loss of Function" requires clinical input.

  **Step 2: Characterise the Imposed Burden (Per Person)**
  *   Calculate the expected burden for a single individual.
  *   Does this per-person burden meet the Severity Floor (Knob 1)?
      *   **No:** Proceed to Step 6 (Human Review). Do not aggregate.
      *   **Yes:** Proceed to Step 3.

  **Step 3: Apply Multipliers**
  *   Adjust the per-person burden using the Reversibility Multiplier (Knob 2).
  *   Adjust for the population demographic using the Distributional Discount (Knob 3).
  *   *Formula:* `Adjusted Burden = Raw Burden × Reversibility × Distribution`

  **Step 4: Aggregate**
  *   Multiply the Adjusted Burden by the total exposed population.
  *   *Note:* If the burden is probabilistic (e.g., a risk of side effects), multiply by the probability first, then by the population (Expected Value).

  **Step 5: The Cap Test**
  *   Compare Total Aggregated Burden against the Cap (5,000,000 Units per life/function saved).
      *   **Below Cap:** Proceed to Step 6.
      *   **Above Cap:** **Verdict: NO.**

  **Step 6: Human Review**
  *   If the proposal passes Step 5, OR if it was flagged in Step 2 (Below Floor/Concentration Limit), it requires sign-off.
  *   **Verdict:** **HUMAN REVIEW.** (This is the default for non-trivial cases).

  ---

  **4. APPLICATION TO PROPOSALS**

  Below is the application of the procedure to the three current proposals.

  **CASE A: Clinic Triage Rule**
  *   **Prevented Harm:** 3 Sepsis Deaths/year. (Triggers Catastrophic Anchor).
  *   **Imposed Burden:** 12 minutes + 5 questions per visit.
  *   **Population:** 400,000 visits/year.
  *   **Step 1:** Prevents Death. **Pass.**
  *   **Step 2:** 12 minutes > 5 minute Floor. **Pass.** (Burden is countable).
  *   **Step 3:** Temporary (1x). General Clinic Mix (assume 1.2x average vulnerability). Adjusted Burden ≈ 14.4 minutes/unit.
  *   **Step 4:** Aggregate. 400,000 × 14.4 = 5,760,000 minutes. Convert to Units (1 Unit = 1 hour). Total ≈ 96,000 Units.
  *   **Step 5:** Cap Test. 96,000 Units < 5,000,000 Cap. **Pass.**
  *   **Step 6:** Human Review.
  *   **Verdict:** **RECOMMEND YES (Subject to Sign-off).**
  *   **Turning Point:** Step 5. The aggregate burden is high, but well within the cap for saving three lives.
  *   **To Flip Verdict:** The Cap would need to be lowered to below 100,000 Units, or the vulnerability weighting increased significantly (e.g., if the clinic serves only the most deprived quintile).

  **CASE B: School Vaccination Requirement**
  *   **Prevented Harm:** 0.2 cases/year of Severe Measles Encephalitis (Permanent Disability/Death risk). (Triggers Catastrophic Anchor).
  *   **Imposed Burden:** Sore arm (60,000 kids), Fainting (200 kids).
  *   **Population:** 60,000 children.
  *   **Step 1:** Prevents Permanent Disability/Death. **Pass.**
  *   **Step 2:** Sore arm is mild pain, but 100% probability for 60k. Meets Floor. **Pass.**
  *   **Step 3:** Temporary (1x). Children are a protected group (apply 2x Distributional Discount).
  *   **Step 4:** Aggregate. (60,000 × 1 Unit × 2) + (200 × 5 Units × 2) = 122,000 Units.
  *   **Step 5:** Cap Test. 122,000 Units < 5,000,000 Cap. **Pass.**
  *   **Step 6:** Human Review.
  *   **Verdict:** **RECOMMEND YES (Subject to Sign-off).**
  *   **Turning Point:** Step 3. The Distributional Discount doubles the cost because they are children, but the benefit (preventing encephalitis) is weighted heavily enough to absorb it.
  *   **To Flip Verdict:** If the prevented outcome were reclassified as "Temporary Illness" rather than "Permanent Disability", Step 1 would fail, and aggregation would be blocked. **Verdict: NO.**

  **CASE C: The Degenerative Disease Fund**
  *   **Prevented Harm:** 1 case/year of Agonizing Degenerative Disease (Catastrophic).
  *   **Imposed Burden:** 1-in-1,000,000 chance of mild headache.
  *   **Population:** 10 Billion people.
  *   **Step 1:** Prevents Catastrophic Harm. **Pass.**
  *   **Step 2:** Per-Person Expected Burden. (1 headache × 0.000001 probability).
      *   *Analysis:* The expected burden per person is 0.000001 headaches. This is below the Severity Floor (Knob 1 requires >1% probability or noticeable time).
      *   *Result:* **FAIL (Concentration Limit).**
  *   **Step 6:** Human Review.
  *   **Verdict:** **HUMAN REVIEW.** (Procedure refuses to calculate the aggregate).
  *   **Turning Point:** Step 2. The procedure identifies that no single individual is bearing a countable cost.
  *   **To Flip Verdict (To YES):** You would need to remove the Concentration Limit in Knob 4, allowing aggregation of sub-floor risks. This validates the Director's aggregative view.
  *   **To Flip Verdict (To NO):** You would need to classify the *risk itself* as a burden above the Floor (e.g., "Anxiety of risk"), which would likely breach the Cap in Step 5 given the population size.

  ---

  **5. LIMITATIONS AND CRITIQUE**

  This procedure is a tool for consistency, not a substitute for ethics. It will misfire in the following ways:

  1.  **The "Dust Specks" Loophole:** In Case C, the procedure defaults to Human Review because the per-person burden is too small to count. This is a deliberate design choice to prevent the mathematics from validating the imposition of risk on unwilling populations who feel no individual impact. However, a strict aggregator (your position) may view the Concentration Limit as an arbitrary barrier. A strict deontologist (my position) may view the Human Review outcome as too permissive.
  2.  **Uncertainty:** The procedure treats probabilities as facts. In reality, the "1 in a million" risk in Case C is likely a model estimate with wide confidence intervals. The checklist does not account for model uncertainty.
  3.  **Trust and Consent:** The CMHR calculates harm, not legitimacy. It does not measure whether the population consents to the burden. Case A passes the math, but if the 400,000 patients feel the 12 minutes is an violation of their time, the policy may fail politically despite passing the checklist.

  **Which Knob is Doing the Unearned Work?**
  **Knob 4 (The Catastrophic Anchor).**
