      *   *What makes it matter?* It matters for *identity* and *ceremony*, not necessarily policy or budget. It anchors the state's historical continuity.
      *   *Legal vs. Power:* Establishment is primarily a *legal status*. Power is secondary. If the state dictates doctrine, that's Caesaropapism. If the church influences the state, that's theocracy. England is mostly symbolic establishment.

