  5.  **Drafting the Content - Focusing on the AI Case:**
      *   *The Problem:* Anti-reductionism usually grounds entitlement in the *nature of communication* or *rational agency*. Burge says: "Accept what is presented as true."
      *   *AI:* AI presents things as true. It simulates agency.
