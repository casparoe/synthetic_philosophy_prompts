      *   *If Anti-Reductionism says "Don't Trust AI":* Why? Is it because it's not human? That sounds speciesist/arbitrary. Is it because it lacks *intent* to tell the truth?
      *   *The Line:* The anti-reductionist must argue that testimony requires a *speaker* who undertakes a *normative commitment*. AI simulates assertion but doesn't *assert* in the normative sense (no blame if it lies/hallucinates).
      *   *Risk:* If the line is "normative commitment," does that exclude humans who are habitual liars? No, because they *can* be blamed.
      *   *Verdict:* This is a *Serious* stress test. If the anti-reductionist can't distinguish AI from a reliable human without smuggling in reductionist evidence (e.g., "AI is known to be unreliable"), the view collapses into reductionism or absurdity.

