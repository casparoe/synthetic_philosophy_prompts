answer: |-
  Good evening everyone, and thank you for saving room for dessert and for me. It is wonderful to look around this table and see so many familiar faces, along with our distinguished guests from the university who have travelled to be with us. We are here to celebrate a book, but I think we are also here to celebrate a particular kind of stubbornness. You know the kind I mean. It is the stubbornness that says a story matters even when the paperwork is thin, even when the voices from the past are whispering rather than shouting.

  I know there has been some discussion in the papers lately about whether we can truly claim to know what happened here in 1766. Our friend the Professor is here tonight, and I am glad he is, because he keeps us honest. He is right to say that we do not have a video recording of the riot. We do not have a signed confession. What we have is a patchwork, and some people look at a patchwork and see holes. But I want to suggest that in history, a well-made patchwork is not a hedge, it is a conclusion.

  Consider the memoir at the heart of our book. It was written fifty years after the event by a man looking back on his boyhood. Memory fades, yes, and details slip. But when we ask why a seventy-year-old man would lie about a grain riot he saw as a child, the answer is that he had nothing to gain. He was not claiming a pension, he was not settling a score, and he was not writing for a newspaper that needed a scandal. He was just writing for his family. When a person tells a story that puts their own town in a chaotic light, with no reason to fabricate it, we have to listen.

  Then there is the newspaper report from the next town over. They hated us. They wanted to show that our town was lawless and theirs was orderly. When a hostile witness concedes something that makes them look bad, or admits that their neighbours caused them trouble, that is worth more than a dozen friendly letters saying nothing happened. Enemies do not usually do each other favours in print, so when they admit a riot occurred, we can believe them.

  We also had to be careful about counting voices. We found other mentions of the trouble in later diaries, but we had to ask ourselves if these were truly independent witnesses. Sometimes two people agreeing does not mean two people saw it; it often means two people heard the same story in the same pub. We traced those threads, and where they led back to the same gossip, we treated them as one voice, not two. We only count the evidence that stands on its own feet.

  And what of the silence in the parish register? The Professor asks why the vicar did not write it down. But we must ask if we would expect him to. In a time of hunger and anger, recording a crime might have been dangerous. Silence only counts against us if we would expect a noise there in the first place. Sometimes silence is just fear.

  Finally, there is the ground beneath us. The burnt layer found under the car park matches the date of the fire described in the memoir. Dirt does not lie, and it does not gossip. When the story in the head matches the scar on the land, that is when probability becomes something we can hold.

  So, do we know everything? No. But can we say this probably happened? Yes. And saying that is not a weakness, it is the best kind of historical honesty. It is saying that while we cannot be certain, we have weighed the chances and this is the truth that fits the facts.

  None of this weighing would have been possible without the people in this room. The volunteers who spent years squinting at parish records, the diggers who worked in the rain, the editors who checked every date. This book belongs to you. I hope you will buy copies, not just to read the history, but to hold the proof of what this community can do when it decides to remember together. Please raise your glasses to the volunteers, to our guests, and to the memory of 1766. Cheers.
