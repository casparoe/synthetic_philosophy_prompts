  *   **Credence:** 0.80.
  *   **Role:** If you *were* pivotal, is there a meaningful difference between the candidates? Given current polarization, it is highly likely (80%) that the policy divergence is large enough to generate significant utility differences ($B$).
  *   **Impact:** This raises the stakes ($B$), but because $P_{piv}$ is so low, $P_{piv} \times B$ usually remains lower than the cost ($C$) for a self-interested agent.

  **3. The Probability the "Odds and Stakes" Frame is Correct ($P_{frame}$)**
  *   **Credence:** 0.55.
  *   **Role:** This is the probability that **Causal Decision Theory (CDT)** is the correct normative framework. CDT says you should only vote if your vote *causes* the win. If this frame is wrong, and **Evidential Decision Theory (EDT)** or Logical Decision Theory is correct, your vote is evidence that others like you will vote, potentially tipping the election.
  *   **Impact:** If CDT is false (0.45 probability), the arithmetic changes drastically, favoring voting.

  **4. The Probability Margin Effects Outweigh Cost ($P_{margin}$)**
  *   **Credence:** 0.05.
  *   **Role:** This addresses whether a non-pivotal vote changes legitimacy, signals strength, or discourages fraud enough to justify the cost. Most legitimacy functions are threshold-based (winning by 1% vs 5% rarely changes governance), making the marginal utility of one vote near zero.
  *   **Impact:** Low probability that this alone justifies voting.

  **5. The Probability Observability Matters ($P_{obs}$)**
  *   **Credence:** 0.00.
  *   **Role:** You asked whether it matters that the world where you vote and the world where you stay home are indistinguishable. In expected utility theory, feedback is irrelevant to the rationality of the bet, only to the learning.
  *   **Impact:** This term drops out of the calculation entirely.

  **6. The Probability Rationality is Indeterminate ($P_{null}$)**
  *   **Credence:** 0.10.
  *   **Role:** The possibility that "rationality" has no fact of the matter here, perhaps because the cost/benefit variables are incommensurable or the decision theory is under-specified.
  *   **Impact:** In this scenario, we assign a neutral 0.50 probability to staying home.

  ### The Combination

  To get the final figure of **0.61**, I treat these terms as a weighted sum of four possible "worlds" in which the cold calculator finds themselves. The number represents the probability that *Staying Home* is the superior choice in that world.

  1.  **World A: Causal Frame + Personal Utility (Weight: 0.55)**
      *   *Logic:* You care about your own outcomes; your vote rarely causes a win.
      *   *Result:* Staying home is rational.
      *   *Contribution:* $0.55 \times 0.95 = 0.5225$
      *   *(Note: I assign 0.95 here rather than 1.0 to allow for extreme outliers where cost is zero or stakes are existential.)*

  2.  **World B: Causal Frame + Aggregate Utility (Weight: 0.15)**
      *   *Logic:* You care about national outcomes (Utilitarian). Even a tiny $P_{piv}$ multiplied by a trillion-dollar $B$ exceeds the cost of voting.
      *   *Result:* Voting is rational (Staying home is not).
      *   *Contribution:* $0.15 \times 0.10 = 0.015$

  3.  **World C: Evidential/Logical Frame (Weight: 0.20)**
      *   *Logic:* Your decision is correlated with similar voters. If you stay home, they might too. Your vote "moves" the block.
      *   *Result:* Voting is rational.
      *   *Contribution:* $0.20 \times 0.10 = 0.020$

  4.  **World D: Indeterminate / Margin Override (Weight: 0.10)**
      *   *Logic:* Either the question is null, or margin effects surprisingly outweigh cost.
      *   *Result:* Toss-up.
      *   *Contribution:* $0.10 \times 0.50 = 0.050$

  **Total:** $0.5225 + 0.015 + 0.020 + 0.050 = \mathbf{0.6075}$ (Rounded to **0.61**)

  ### Sensitivity Analysis

  The single term this number is most sensitive to is **Term 3: The Probability the "Odds and Stakes" Frame is Correct ($P_{frame}$)**.

  If my credence that Causal Decision Theory is the *only* valid frame rises from 0.55 to 0.75, the final figure jumps to roughly **0.73**, aligning with your view. If my credence in CDT falls to 0.35 (favoring Evidential/Logical theories), the figure drops to roughly **0.48**, moving toward your friend's view. The arithmetic of pivotality (Term 1) is fixed; the *interpretation* of that arithmetic is the variable.

  ### Where You and Your Friend Part Company

  I suspect your divergence (0.7 vs 0.15) is not about the math, but about **Term 2 (Utility Scope)** and **Term 3 (Decision Frame)** combined.

  *   **You (0.7):** You likely implicitly weight **World A** heavily. You assume the "cold calculator" is instrumentally rational regarding *personal* or *local* outcomes (Egoism) and that causality is strict (CDT). In this view, the cost is certain, and the benefit is probabilistically negligible.
  *   **Your Friend (0.15):** They likely weight **World B** or **World C** heavily. They either assume the calculator cares about *aggregate* welfare (where $B$ is huge enough to overcome tiny $P$), or they believe in a form of decision theory where your vote is logically linked to others (EDT/LDT). For them, the "cold calculator" realizes that being the *kind of person* who votes is itself an outcome-maximizing strategy.

  ### The One Argument That Would Move Me

  The piece of evidence that would move my figure the most is **empirical validation of Logical Decision Theory in macroscopic social systems.**

  Currently, EDT/LDT is compelling in thought experiments (like Newcomb's Problem) but abstract in reality. If there were robust sociological evidence showing that individuals who reason "If I do X, others like me will do X" consistently achieve better real-world outcomes in large-scale coordination problems than strict causal reasoners, I would have to lower my credence in Term 3 (CDT). That would collapse the expected value of staying home, potentially dropping my figure below 0.50. Until then, the cold calculator is safest at home.
