answer: |-
  You have articulated a version of textualism that relies on original public meaning, strictly separated from legislative intent, with a strong presumption against judicial correction. This is a coherent, high-constraint theory. However, its coherence depends on empirical and structural premises that are vulnerable.

  I have sorted the objections below by their threat level to your position: those that should move you off the theory entirely, those that force you to qualify it, and those that are merely costs you must bear.

  ### I. Decisive Objections (Move Off the Position)

  These objections strike at the internal logic of your three claims. If they hold, the position is either empirically false or functionally indistinguishable from the rival theories you reject.

  **1. The Insulation Problem (The "Escape Hatch" Dilemma)**
  *The Objection:* You ask if the position has been insulated. The risk is not merely that you have escape hatches, but that the criteria for opening them are indistinguishable from purposivism. You allow "context" to determine "conventional meaning." But in law, context *is* purpose. If a word has two dictionary definitions, the only way to select the "conventional" one is to ask which one makes the statute work as a coherent whole. That is a purposive inquiry. If your "contextual analysis" yields the same results as a "purposive analysis," your theory predicts nothing distinct from purposivism. It becomes a stylistic preference rather than a methodological constraint. If a theory cannot generate a result that a rival theory would reject, it is unfalsifiable.
  *   **Obvious Reply:** We limit "context" to linguistic context (surrounding words, grammar) and exclude "policy context" (goals, consequences).
  *   **Verdict:** **Does Not Work.** In statutory law, the "surrounding words" often include functional terms (e.g., "reasonable," "necessary," "appropriate"). Determining the linguistic convention for *those* terms inevitably requires understanding the function they serve. You cannot cleanly separate linguistic context from functional context without rendering the text incoherent. If you cannot distinguish your method from purposivism in hard cases, the position is empty.

  **2. The Empirical Falsehood of "Determinate Convention"**
  *The Objection:* Claim 1 rests on an empirical assertion: that there is a fact of the matter about what a "competent speaker" would take the words to convey. Modern linguistics and pragmatics suggest that for complex legal provisions, there is often *no* such fact. Meaning is frequently underdetermined by convention alone. If the "conventional meaning" is itself a matter of debate among competent speakers (which it often is for technical statutory language), then Claim 3 ("where the conventional meaning is determinate...") is rarely triggered. You are not applying a fact; you are selecting one plausible convention over another. That selection is an exercise of discretion, not discovery.
  *   **Obvious Reply:** We look to the legal community's conventions, not the lay public's. The legal community has stable canons that resolve ambiguity.
  *   **Verdict:** **Does Not Work.** Many canons of construction (e.g., *ejusdem generis*, rule against superfluity) are themselves proxy devices for imputing purpose. Relying on them to find "determinate meaning" smuggles the very purposive reasoning you claim to exclude. If the "fact" of meaning is constructed via canons that are policy-laden, you are not applying a linguistic fact; you are applying a policy choice about how to read.

  ### II. Objections Forcing Qualification (Modify the Position)

  These objections identify areas where a strict application of your three claims leads to results that undermine the rule of law or the theory's own consistency. You can maintain the core, but you must carve out specific exceptions.

  **3. The Scrivener's Error and the "Correction" Canon**
  *The Objection (Case Family 2a):* If you refuse to correct a clear typo (e.g., "Section 10" when the text clearly references "Section 11"), you make the law turn on a clerical error. This violates the "competent speaker" test: no competent speaker interprets a obvious typo literally. However, if you *do* correct it, you are admitting that the "meaning" is not the text itself, but the text *as intended to be written*. This looks like intent.
  *   **Obvious Reply:** Correcting a typo is not appealing to legislative *purpose*, but to linguistic *convention*. The convention of written language includes a convention against nonsense. We are enforcing the convention, not the intent.
  *   **Verdict:** **Works, but requires qualification.** You must qualify Claim 1 to acknowledge that "linguistic conventions" include the convention that authors do not intend self-contradiction or obvious clerical errors. This is not "purpose" in the political sense, but it is a normative assumption about communication. You must admit that "text" means "text as rationally written," which creates a small opening for judging coherence.

  **4. Standards, Delegation, and Dynamic Meaning**
  *The Objection (Question 3):* You ask if some text is not a communicative act but a delegation. Many statutes use terms like "reasonable," "fair," or "in the public interest." The linguistic convention for these terms *is* to delegate moral or policy judgment to the interpreter. If you fix the meaning of "reasonable" to what a 1980 speaker thought was reasonable, you violate the convention of the word, which invites contemporary judgment. A theory of fixed linguistic meaning cannot handle terms whose meaning is *by convention* fluid.
  *   **Obvious Reply:** The "original meaning" of "reasonable" is "whatever a court determines is reasonable at the time of application." We freeze the *standard*, not the *outcome*.
  *   **Verdict:** **Works, but forces a major qualification.** You must admit that for a large class of provisions (standards vs. rules), your theory yields dynamic law. This undermines Claim 3's promise of stability. You cannot treat a delegation as a fixed command without violating the linguistic convention of the enactment. You must qualify your theory to distinguish between "rule-like" text (fixed meaning) and "standard-like" text (delegated meaning).

  ### III. Merely Awkward (Costs to Bear)

  These are consequences that may be unpalatable but are logically consistent with your position. A committed defender should concede these as the price of constraint.

  **5. The General Term and the New Case**
  *The Objection (Case Family 2c):* A statute bans "vehicles" in a park. An electric scooter did not exist at enactment. It falls within the semantic meaning of "vehicle" but perhaps outside the enactors' specific expectations. A purposivist might exclude it if the goal was noise reduction (and scooters are quiet). A textualist must include it. If your theory forces you to include it, is that a bug?
  *   **Obvious Reply:** The semantic meaning covers it. The legislature wrote "vehicles," not "noisy combustion engines." If they want to exclude scooters, they should amend the law. Convergence with purposivism happens only when the purpose aligns with the text; divergence is where the theory does its work.
  *   **Verdict:** **Works.** This is not a problem; it is the point. You should concede this cost. If the text covers the new case, the court applies it. If the result is suboptimal, the legislature corrects it. This is the "burden of inertia" you accept in Claim 3. It is distinguishable from purposivism because a purposivist might exclude the scooter based on the *spirit* of the noise reduction goal, whereas you include it based on the *letter* of the vehicle ban.

  **6. Predictive Failures Regarding Legislative Correction**
  *The Objection (Question 1):* Your position predicts (Claim 3) that if the text produces frustration of purpose, the legislature will correct it. In a polarized system with low legislative throughput, this prediction fails. The "absurd" result becomes permanent not because it is law, but because the correction mechanism is broken. Does this falsify the theory?
  *   **Obvious Reply:** The theory is normative, not predictive. It says what the law *is*, not whether the legislature *will* fix it. The dysfunction of the legislature does not change the judicial duty to apply the text.
  *   **Verdict:** **Works.** This is an external political fact, not an internal theoretical flaw. However, you must acknowledge that in a gridlocked system, your theory creates a "ratchet of absurdity" that a purposivist theory (which allows judicial updating to match purpose) avoids. This is a systemic cost, not a logical error. You must accept that your theory works best in a well-functioning legislature and poorly in a dysfunctional one.

  ### Summary Verdict

  *   **Move Off:** If you cannot distinguish "linguistic context" from "purposive inference" (Objection 1), or if "conventional meaning" proves to be as indeterminate as "purpose" (Objection 2), your position collapses into purposivism with extra steps. You must ensure your method yields distinct results in a significant class of cases.
  *   **Qualify:** You must admit that "text" implies "non-absurd text" (Objection 3) and that "standards" imply "dynamic application" (Objection 4). These are not betrayals of textualism, but necessary recognitions of how language works.
  *   **Accept:** You must accept that your theory will sometimes cover new technologies (Objection 5) and sometimes produce permanent errors due to legislative gridlock (Objection 6). These are the costs of constraint.

  **Final Advice:** The greatest risk to your position is not that it produces bad results, but that it is **unfalsifiable**. If every time the text leads to an absurdity you find a "contextual" reason to avoid it, you have not adopted a theory of constraint; you have adopted a theory of justification. To defend this position, you must be willing to identify a case where the text is determinate, the purpose is clear, the result is undesirable, and you rule for the text anyway. If you cannot point to such a case in your own docket, the position is merely rhetorical.
