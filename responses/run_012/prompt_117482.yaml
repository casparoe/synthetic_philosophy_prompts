          *   Treatment -> Capitalist/Democratic institutions (ROK).
          *   Control -> Communist/Totalitarian institutions (DPRK).
          *   Blinding -> None (impossible).
          *   Outcome -> GDP per capita / Human Development.
      *   *Disanalogies:*
          *   Critical: Non-random assignment (US/USSR interests correlated with institution type); Asymmetric shocks (Korean War devastation higher in South); Differential Aid (US vs Soviet bloc); Pre-division industrial imbalance (North had more heavy industry).
          *   Colourful: Lack of blinding; Minor pre-1945 regional cultural variations.
      *   *Conclusion Survival:* The conclusion survives and is arguably strengthened because the South overcame initial industrial disadvantages and greater war devastation. However, the "clean estimate" claim is false; it's a lower-bound estimate confounded by geopolitics.
      *   *Other Cases:* Germany supports it. Haiti/Dominican Republic supports it (though geography differs slightly). East/West China is less clear.
      *   *Better Method:* Global regression discontinuity at borders or Instrumental Variables (settler mortality) for causal identification.

  9.  **Final Polish:** Check constraints. No preamble. First sentence bottom line. No restating question.

      *Self-Correction on "Other Cases":* The prompt says "cases do not obviously point the same way." I should acknowledge this. For example, some border pairs show less divergence, or divergence explained by resources. But the major ones (Germany, Korea) are the strongest evidence. I need to be careful not to overclaim the universality if the prompt hints at counterexamples. Actually, the prompt says "Note that the same move is made with other divided or paired neighbours, and that the cases do not obviously point the same way." This implies I should address that variability. Some pairs might show geography matters more (e.g. if one side has oil). But Korea/Germany are the outliers that prove the institutional rule. I will focus on why Korea is distinct.

      *Refining the Bottom Line:* Make it punchy. "Your colleague's analogy is rhetorically powerful but methodologically false, yet the core conclusion that institutions drive prosperity remains robust despite the lack of experimental control."

      *Wait, one more check:* "If the analogy is past saving, say what would serve better." Is it past saving? As a *controlled experiment*, yes. As a *natural experiment*, no. I should clarify that distinction. I will suggest that while the Korea case is illustrative, rigorous causal inference requires instrumental variables or border discontinuity designs across many cases.

      *Final Plan:*
      1. Bottom line sentence.
      2. Correspondence Table.
      3. Disanalogies (Critical vs. Colourful).
      4. Evaluation of Conclusion (Survives? Yes, but with caveats).
      5. Better alternatives for causal estimation.

