answer: |-
  While the Korean peninsula offers the strongest existing evidence that institutions dominate geography and culture in determining wealth, calling it a controlled experiment is methodologically incorrect because the assignment of regimes was not random and post-division shocks were asymmetric.

  ### Correspondence Table

  | Experimental Component | Korean Peninsula Analogue |
  | :--- | :--- |
  | **Randomisation** | The drawing of the 38th Parallel by US planners (Dean Rusk/Charles Bonesteel) in 1945. |
  | **Treatment** | Market-oriented, private property, eventually democratic institutions (South Korea). |
  | **Control** | Command economy, state ownership, totalitarian institutions (North Korea). |
  | **Blinding** | None (states and populations are fully aware of their institutional regime). |
  | **Outcome Measure** | GDP per capita, life expectancy, caloric intake, electrification rates. |

  ### Disanalogies

  **Critical Disanalogies (Bear on Causal Inference)**
  1.  **Non-Random Assignment:** The division was not a coin flip; it reflected the convergence of Soviet and American military zones. The institutional "treatment" was correlated with the occupying power, meaning initial institutional seeding was endogenous to geopolitical interests, not exogenous.
  2.  **Asymmetric Initial Conditions:** In 1945, the North held the majority of the peninsula's heavy industry and hydroelectric power, while the South was predominantly agricultural. This biases the test *against* the institutional hypothesis (the South succeeded despite an initial economic disadvantage).
  3.  **Asymmetric Shocks (The Korean War):** The South suffered significantly more physical destruction from bombing campaigns than the North. This also biases the test *against* the South's success, strengthening the institutional argument if anything, but violating the "ceteris paribus" assumption of a controlled experiment.
  4.  **Differential External Inputs:** The South was integrated into the US-led global trade and aid system; the North was integrated into the Soviet bloc then isolated. This conflates "institutions" with "geopolitical access," making it difficult to isolate domestic institutions from external market access.
  5.  **Selection Effects:** There was significant population movement across the border immediately after division (elites fleeing North, leftists fleeing South), meaning the human capital stock was not perfectly fixed.

  **Colourful Disanalogies (Do Not Bear on Conclusion)**
  1.  **Lack of Blinding:** In macroeconomic history, subjects knowing their treatment is irrelevant to the structural outcomes of GDP.
  2.  **Minor Cultural Heterogeneity:** Pre-1945 regional differences (e.g., religious concentration in Pyongyang vs. Seoul) exist but are negligible compared to the divergence in outcomes.
  3.  **Administrative Convenience:** While the line was drawn arbitrarily regarding culture, it was not arbitrary regarding military strategy, which overlaps with the critical disanalogy of non-random assignment.

  ### Evaluation of the Conclusion

  The conclusion that institutions rather than geography or culture explain wealth disparities **survives**, but the claim of a "clean estimate" does not. Because the North started with an industrial advantage and suffered less physical destruction, the fact that the South vastly outperformed it suggests the institutional effect is even larger than the raw GDP gap implies. However, the confounding variable of geopolitical integration (access to global markets vs. autarky) is entangled with domestic institutions; one cannot fully disentangle whether South Korea succeeded because of internal property rights or because the US allowed it to export. Furthermore, relying on this single case is risky because other divided neighbours do not always point the same way. For instance, the divergence between East and West Germany mirrors Korea, but comparisons like Haiti and the Dominican Republic involve confounding geographic differences (soil quality, topography), and the division of China does not offer a clean institutional counterfactual. The Korea case is an outlier in terms of divergence magnitude, making it excellent for illustration but statistically dangerous for generalization.

  ### Better Alternatives

  To move beyond illustrative natural experiments, social science should employ **Regression Discontinuity Designs (RDD)** across multiple international borders. By comparing economic activity on both sides of many arbitrary borders (not just Korea or Germany) while controlling for geography, researchers can isolate institutional effects with greater statistical power. Alternatively, **Instrumental Variable (IV)** approaches, such as using settler mortality rates to predict initial institutional quality (as per Acemoglu, Johnson, and Robinson), provide a broader causal framework that accounts for the endogeneity of institutions across many nations rather than relying on a single, unique historical accident.
