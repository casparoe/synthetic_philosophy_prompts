answer: |-
  Good evening. Ten years is enough time for a story to harden into a legend, and legends are comfortable. They have clear heroes, clear villains, and a ending that tells you everything turned out fine. I am not here to tell you that legend. I am here to talk about what actually happened after the cameras left and the picket signs were stored in the basement.

  Looking around this room, I see three different histories sitting at the same tables. There are those who spent thirty years giving this plant fifty-five hours of every week. There are those who grew up knowing the fifth day off as a fact of life, like gravity or electricity. And there are those at the head table who manage the ledger that pays for all of it. My job is not to smooth over the differences between you. It is to acknowledge the weight of what was traded here.

  To the old-timers: I know what fifty-five hours a week looks like in a body. I know it in the shoulders that ache when it rains, and in the arguments at home that never quite got finished because you were too tired to speak. I will not stand here and tell you that those years were wasted. You built what stands here. But I will not tell you that those hours were necessary, either. The strike that happened ten years ago was not a rejection of your work ethic. It was a recognition that a human being has a limit, and you had reached it. The fatigue you carried was not a badge of honor; it was a cost that was finally deemed too high.

  Ten years ago, this local made a radical bet. You traded a scheduled raise for time. You said thirty-two hours was enough for the company, and enough for you. It was a gamble that less work could mean better living.

  Here is what my reporting found about that gamble. Within three years, overtime on the remaining four days had eaten back most of the gain. The average hours per member fell by less than two a week. The fifth day did not stay empty. It filled up. It filled with elder care, with grandchildren, with second jobs, and with what people called projects. I heard members say they felt guilty on a Tuesday if they hadn't done anything with the day. We won the time, but we didn't know how to hold it without filling it with something productive.

  Meanwhile, the plant's injury rate fell. The defect rate fell with it. These numbers are now the public case for the four-day week. You see them in the company's recruiting material and in the union newsletter alike. The argument is clear: when you rest, you work better. When you are less tired, you make fewer mistakes. You bleed less.

  This brings me to the distinction I want to leave with you. There are two ways to defend time off. The first is restorative. This says time is owed back to you because you will work better for having had it. It is justified by what it returns to the job. The second makes no such promise. It says time is yours because a life is not a shift, and it does not have to pay anyone back.

  Delmar looks like a clean experiment in which of those defenses survives contact with a payroll department. The data suggests the restorative argument wins. The company accepts the fifth day because the other four days go better. The injury rates prove that rested workers are cheaper workers. This is a victory, but it is a specific kind of victory. It means the time is still justified by the work.

  There are places in the world where this calculation fails. There are categories of death invented because people kept dying at their desks, where the logic of production ran past the limit of biology. We are not there. But the shadow of that extreme reminds us that without a defense for time that belongs to the person and not the job, the hours will always creep back. They will creep back in overtime, in second jobs, in the guilt of an empty Tuesday.

  To the younger members: You treat the fifth day as an inheritance. You are right to claim it. But be wary of the idea that it is only safe as long as it pays dividends to the shift. A shorter week can be absorbed by the very work ethic it was meant to escape. If we only defend rest because it makes us stronger for the next shift, we are still measuring our lives in output.

  To the executives: You have traveled a long way to hear a story about doing more with less. It is true that this plant learned to run leaner. But do not mistake efficiency for peace. The lower defect rates are real, but they are not the whole story. The whole story is that people wanted a day that wasn't yours.

  I cannot end this by telling you we solved it. We haven't. We won a day, but we still justify it with the logic of the other four. We proved that rested workers are better workers, but we haven't fully proved that workers are allowed to just be people. The fifth day is yours. Keep it. But know that as long as the only argument for it is that it helps the work, it will always be on loan.

  Thank you.
