      *   *Refining the (6) point:* (6) says badness is *just* intensity/duration. If badness is a function $B(i, d)$, and (3) says at $T$, $B$ becomes infinite/lexical, then $B$ is *not* just $i$ and $d$. It's $i, d,$ and $ThresholdStatus$. So (6) is false given (3).

  8.  **Final Polish:** Ensure the distinction between *commensurability* and *comparability* is clear. Ensure the distinction between *phenomenology* and *moral weight* is clear.

