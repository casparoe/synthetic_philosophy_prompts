answer: |-
  **Referee Report**

  **To:** Author
  **From:** Referee
  **Re:** Draft Notes on Safe Pareto Improvements (SPI) and Rationality Filters

  Here is my assessment of your notes. I have broken this down into an interpretation of your core argument, a critique of your formal reconstruction, an analysis of your proposed fix, and a verdict on viability.

  ### 1. Interpretation: What are you actually getting at?

  You are grappling with the tension between **robustness** and **optimality** in cooperative mechanism design. Your setup closely mirrors the "Safe Pareto Improvements" (SPI) literature, specifically the work of Oesterheld and Conitzer (2019, 2021).

  In the standard Oesterheld/Conitzer (O&C) framework, SPIs are usually constructed by delegating play to representatives who commit to a modified game $G'$. The safety guarantee typically relies on an **isomorphism assumption**: we assume the representatives play $G'$ in the same way the principals would have played $G$. If the principals would have coordinated on a bad equilibrium in $G$, the representatives coordinate on the isomorphic bad equilibrium in $G'$—which you have designed to be better than the original bad equilibrium.

  Your notes suggest you want to drop the isomorphism assumption. You want a guarantee that holds *regardless* of equilibrium selection in either game. You are asking: "Can we modify the game such that even if equilibrium selection goes against us in the new game, we still do better than if equilibrium selection went against us in the old game?"

  This is a stronger, more robust notion than standard SPIs. However, your formalization contains a critical ambiguity that threatens to make the concept either impossible or vacuous.

  ### 2. Critique of the Reconstruction

  You define $G'$ as an SPI of $G$ iff:
  $$ \forall e' \in EQ(G'), \forall e \in EQ(G) : u_i(e') \ge u_i(e) $$
  (with strict inequality for some player).

  **The Problem:** This definition is likely far stronger than you intend, and it contradicts your motivation.
  *   **Mathematical Implication:** This condition requires that the *worst* equilibrium payoff in $G'$ must exceed the *best* equilibrium payoff in $G$. ($\min_{e'} u(e') \ge \max_{e} u(e)$).
  *   **Your Motivation:** You write that this condition "forces you to raise the bad equilibrium." This implies you are worried about the *lower bound* of $G$ (the worst equilibrium).
  *   **The Contradiction:** If you must beat *every* equilibrium of $G$, you must beat the (5,5) equilibrium in your "Project" game. Beating (5,5) automatically implies beating (2,2). The (2,2) equilibrium is not the binding constraint; the (5,5) equilibrium is.
  *   **Consequence:** Under your written definition, SPIs are almost impossible in games with multiple equilibria unless $G'$ eliminates all risk and guarantees a payoff higher than the *Pareto-optimal* equilibrium of $G$. This makes the concept trivial (usually non-existent).

  **Correction:** I suspect you intend a **minimax-regret** style definition:
  $$ \forall e' \in EQ(G') : u_i(e') \ge \min_{e \in EQ(G)} u_i(e) $$
  (i.e., "In the new game, even the worst outcome is better than the worst outcome of the old game").
  *If* this is your definition, then your complaint makes sense: the (2,2) equilibrium sets the bar, and you are forced to ensure $G'$ doesn't introduce any new risks below 2.

  **Referee Note:** You must pin this down. If you stick with the $\forall \forall$ definition, the paper is dead on arrival because the condition is too strong for any non-trivial game. If you switch to the $\min \ge \min$ definition, you have a coherent robustness concept, but you face the problems discussed below.

  ### 3. Analysis of "SPI Modulo Rationality"

  You propose weakening the baseline by only comparing against equilibria that survive Iterated Elimination of Strictly Dominated Strategies (IESDS). You hypothesize this excludes "bad" equilibria while keeping the safety guarantee.

  **Formal Reality Check:**
  In your "Project" game (a Stag Hunt / Coordination Game):
  *   Payoffs: (E,E)=(5,5), (S,S)=(2,2), Miscoord=(0,4)/(4,0).
  *   **IESDS Analysis:**
      *   Is *Effort* strictly dominated by *Slack*? No. If the opponent plays Effort, 5 > 4.
      *   Is *Slack* strictly dominated by *Effort*? No. If the opponent plays Slack, 2 > 0.
      *   **Result:** IESDS eliminates **nothing**. Both (E,E) and (S,S) survive.
  *   **Conclusion:** Your proposed fix is **vacuous** for the very class of games (Coordination Games) where equilibrium selection is the primary problem. The "bad" equilibrium is fully rational in the sense of surviving dominance checks.

  To exclude the (2,2) equilibrium, you would need a stronger refinement, such as:
  1.  **Payoff Dominance:** Select (E,E) because 5 > 2. (But this assumes coordination, violating the "trustless" spirit).
  2.  **Risk Dominance:** (Harsanyi & Selten). In your specific payoffs, (S,S) is actually risk-dominant (3 > 2.5). So a risk-dominance filter would *keep* the bad equilibrium and *exclude* the good one.
  3.  **Global Games / Learning:** Assume agents have slight noise or learn over time. This often selects a unique equilibrium, but it relies on specific informational assumptions (priors, dynamics) that may not hold in a "one-shot" abstract setup.

  **The Safety Trade-off:**
  If you filter out the (2,2) equilibrium by declaring it "irrational," you are no longer providing a *Safe* Pareto Improvement in the robust sense. You are providing a *Conditional* Pareto Improvement. You are effectively saying: "I guarantee you won't do worse, *provided* you don't play a risk-dominant equilibrium."
  If the other agent is a "straight maximizer" who fears miscoordination, they *will* play Slack. If you design $G'$ assuming they won't, you might expose them to a payoff of 0 (if $G'$ removes the Slack option but they try to play it, or if $G'$ introduces new risks).

  ### 4. Is there a paper here?

  **Verdict:** Yes, but not with the current formalism.

  **The Dead End:**
  If you proceed with IESDS as your "rationality" filter, you will hit a wall immediately. As shown above, it does not prune coordination game equilibria. A referee (like me) would reject the claim that this solves the "bad equilibrium" problem.

  **The Viable Path:**
  There is a paper here if you pivot to **"High-Confidence Pareto Improvements."**
  1.  **Acknowledge the Trade-off:** Admit that "Safety" (robustness to all NE) and "Optimality" (ignoring bad NE) are in tension. You cannot have both without assumptions.
  2.  **Formalize the Assumption:** Instead of vague "rationality," specify the class of agents for whom the improvement is safe. E.g., "This SPI is safe for any agent who avoids risk-dominated strategies."
  3.  **Compare to O&C:** Explicitly position this against Oesterheld & Conitzer. Their SPIs work by *mapping* equilibria (isomorphism). Your approach tries to *prune* the equilibrium set of the baseline. This is a distinct contribution.
  4.  **The Load-Bearing Step:** The weak step is the claim that "rationality" (IESDS) solves the selection problem. You need to replace IESDS with a refinement that actually eliminates the bad equilibrium in Stag Hunts (e.g., Trembling Hand Perfection, though even that might not suffice without dynamics).
