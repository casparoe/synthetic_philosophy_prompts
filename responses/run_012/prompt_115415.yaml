  ### 5. Specific Action Items

  1.  **Fix the Definition:** Decide if you mean $\min_{e'} \ge \max_{e}$ (Universal Dominance) or $\min_{e'} \ge \min_{e}$ (Worst-Case Safety). Your text suggests the latter; your formula suggests the former. This must be resolved before anything else.
  2.  **Drop IESDS:** It does not work for Coordination Games. Replace it with a discussion of **Equilibrium Refinements** and explicitly state which refinements you are assuming.
  3.  **Clarify "Safe":** If you exclude the (2,2) equilibrium, you must admit the improvement is not "safe" against a highly risk-averse opponent. Rename the concept to reflect this (e.g., "Rationality-Conditional SPI").
  4.  **Check the Literature:** Ensure you are citing Oesterheld & Conitzer (2021, *JAIR*) and potentially the literature on **robust mechanism design** (e.g., Bergemann & Morris). You are reinventing a wheel, but it might be a square wheel that needs rounding.

  **Summary:** The intuition is sound (we want to ignore "unreasonable" bad outcomes), but the formal tool (IESDS) is too blunt for the job, and the baseline definition is currently self-contradictory. Fix the math, qualify the safety claim, and you have a solid contribution to the SPI literature.
