  what i want is a menu. take that line -- a function is what a thing was selected to do, plus the tag-along claim that doing something isn't enough to have a function -- and tell me all the precise things it could be claiming, from the boring to the radical. for each one: is it trivially true, is it a real substantive thesis, is it false, and does it actually get the prof his verdict on the appendix?

