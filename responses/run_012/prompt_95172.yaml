answer: |-
  This is not a dumb question. You have stumbled directly into the central debate in the philosophy of biology: **Selected Effect (SE) theories vs. Causal Role (CR) theories of function.**

  Your professor is advocating a version of the Selected Effect theory (often associated with Ruth Millikan or Karen Neander). The student pushing back was advocating a Causal Role theory (often associated with Robert Cummins). The frustration you feel comes from the fact that both sides are using the word "function" to point at different things, and the professor used the definition to win the argument rather than resolving the biological reality.

  Here is the menu of precise readings of your professor's claim ("Function is what a thing was selected to do; doing something isn't having a function"), ranked from trivial to radical, with verdicts on each.

  ### The Menu of Readings

  **1. The Semantic Stipulation**
  *   **The Claim:** "In this seminar, I am defining the word 'function' to mean 'effect for which a trait was naturally selected.' I am excluding other definitions by fiat."
  *   **Status:** **Trivially True.** It is a definition. You cannot falsify a stipulation.
  *   **Does it get the verdict?** **Yes, but cheaply.** If "function" *means* "selected effect," and the appendix is a vestige (not selected), then it has no function by definition. However, this ignores the fact that biologists often use "function" to mean "what it does."
  *   **Verdict:** This is a conversational stopper, not a philosophical argument.

  **2. The Strong Historical Etiological Claim**
  *   **The Claim:** A trait's function is *only* the effect that caused it to originate in the deep past. If the trait was selected for digestion 10 million years ago, its function is digestion, even if it now does immunity and digestion is impossible.
  *   **Status:** **Substantive Thesis (but widely considered False/Problematic).** This view struggles with "exaptations" (old traits co-opted for new jobs). If a bird's feathers evolved for heat but are now selected for flight, this view says their function is heat regulation. Most philosophers reject this because it makes function irrelevant to current biology.
  *   **Does it get the verdict?** **Yes.** If the appendix originated for digestion and that selection pressure is gone, it has no function (or a broken one), regardless of current immune activity.
  *   **Verdict:** Unlikely to be the professor's actual view; it's too rigid for modern evolutionary theory.

  **3. The Current-Maintenance Claim (Standard SE Theory)**
  *   **The Claim:** A trait has a function if it is *currently* being maintained in the population by natural selection for that specific effect. It doesn't matter why it originated; what matters is why it hasn't been weeded out *now*.
  *   **Status:** **Substantive Thesis (The dominant philosophical view).** This distinguishes between a "proper function" (selected) and a "side effect" (useful but not selected).
  *   **Does it get the verdict?** **Only if the biology supports it.** If the appendix's lymphoid tissue is currently under positive selection, it *has* a function on this view. If it is truly neutral drift, it does not. The professor's verdict relies on the empirical claim that the appendix is *not* currently selected.
  *   **Verdict:** This is the most philosophically robust reading. It makes the verdict contingent on evidence, not just definition.

  **4. The Causal-Role Exclusion**
  *   **The Claim:** "Doing something" (contributing to a system's capacity) is merely a *causal role*, not a *function*. Functions imply a norm (you can malfunction); causal roles do not. A bomb has the causal role of destroying a building, but not the function (unless designed/selected for it).
  *   **Status:** **Substantive Thesis.** This explains the "doing something isn't enough" comment. It argues that without selection, there is no distinction between a trait working correctly and a trait merely existing.
  *   **Does it get the verdict?** **No, not on its own.** This explains why "having lymphoid tissue" isn't automatically a function, but it doesn't prove the appendix lacks selection. It just raises the bar for what counts as a function.
  *   **Verdict:** This is the theoretical engine behind the professor's pushback against the student.

  **5. The Empirical Vestige Assertion**
  *   **The Claim:** "The appendix is not currently under natural selection for any effect."
  *   **Status:** **Empirical Claim (Contingently True or False).** This is not philosophy; this is biology. Some papers argue the appendix is a "safe house" for gut microbiota and is selected for (Bollinger et al., 2007). Others say it is vestigial.
  *   **Does it get the verdict?** **Yes, directly.** If this is true, then on *any* Selected Effect theory, the appendix has no function.
  *   **Verdict:** This is the weak link. The professor may be philosophically consistent but biologically outdated.

  ---

  ### Sorting Out the Conceptual Worries

  You asked several specific questions about how "selection" works in this context. Here is how the Selected Effect (SE) theory (your professor's view) handles them, contrasted with the Causal Role (CR) view (the student's view).

  **1. Does "selected" mean selected *for* that effect, or just selected while doing it?**
  *   **SE View:** It must be selected *for* that effect. If a trait arises by drift and happens to be useful, it is an **exaptation**, not an adaptation. On strict SE theory, exaptations do not have "proper functions" until selection acts on them for the new use.
  *   **CR View:** It doesn't matter. If it does the job now, it has a function.

  **2. How long does it have to be doing it?**
  *   **SE View:** Time is irrelevant; *history* is relevant. A trait could do something useful for a million years, but if it wasn't the *reason* the organism survived/reproduced better than others, it's not a function. Conversely, a new mutation can have a function immediately if it confers a selective advantage that spreads.
  *   **CR View:** Immediate. As soon as the part contributes to the system's capacity, it has a function.

  **3. Old part, new job (Exaptation)?**
  *   **SE View:** This is the hardest case. Strictly, the function is the *old* job (if it was an adaptation) or *nothing* (if it was drift). However, modern SE theorists (like Neander) allow that if the trait is *currently* maintained by selection for the new job, the new job is the function.
  *   **CR View:** The function is the new job.

  **4. Brand new, useful trait (Spandrels/Drift)?**
  *   **SE View:** If it is truly new and not yet selected, it has **no function** yet. It is a "prot-function." It is useful, but it is not *for* anything in the teleological sense.
  *   **CR View:** It has a function immediately because it plays a role in the organism's survival.

  **5. Is the other view (Causal Role) a real disagreement?**
  *   **Yes.** They are asking different questions.
      *   **CR asks:** "How does this trait contribute to the capacity of the containing system?" (Useful for physiology).
      *   **SE asks:** "Why is this trait here rather than absent?" (Useful for evolutionary history).
      *   The professor is claiming that only the second question deserves the word "function." The student is claiming the first question is what biologists usually mean.

  **6. Does any reading make "The appendix has no function" true?**
  *   **Yes, but it requires two steps:**
      1.  Accept the SE definition (Function = Selected Effect).
      2.  Accept the empirical claim (Appendix = Not currently selected).
  *   If you accept SE but reject the empirical claim (i.e., you think the appendix *is* selected for immunity), then the appendix **does** have a function on the professor's own terms.
  *   If you accept the empirical claim but reject SE (i.e., you use CR theory), the appendix **does** have a function.
  *   The professor's verdict only holds if **both** premises are true.

  ---

  ### What Was Actually Happening & How to Settle It

  **Which reading was doing the work?**
  The professor was likely using a combination of **Reading 3 (Current-Maintenance SE)** and **Reading 5 (Empirical Vestige)**.
  He used Reading 3 to dismiss the student's "it does something" argument (because causal roles aren't functions). He used Reading 5 to deliver the verdict (because he assumes no current selection). He likely skipped the nuance of Reading 3 (that current selection *could* grant a new function) and treated the appendix as a "dead" trait (Reading 2).

  **Why he ended the conversation:**
  He treated the definition (SE theory) as settled dogma rather than one side of an active debate. In philosophy of biology, SE vs. CR is not settled; it is context-dependent. Physiologists use CR; Evolutionary Biologists use SE. By saying "Function *is* selected effect," he was enforcing the Evolutionary context over the Physiological one.

  **How to settle it (if you speak up next time):**
  You don't need to fight the definition. You need to separate the philosophy from the biology. You could ask:

  > "I accept the Selected Effect definition for this seminar. But does that verdict rely on the claim that the appendix is *currently* neutral drift? Because if recent papers suggest it's maintained by selection for microbiome storage, does that grant it a 'proper function' on your view, or is it still just an exaptation?"

  This forces him to admit that his verdict depends on empirical evidence, not just philosophical definition. It clarifies that "no function" means "no *selected* function," not "does nothing."

  **Summary Verdict:**
  The professor was philosophically consistent with a specific school of thought (Etiological/Selected Effect), but he conflated a philosophical definition with an empirical biological claim. You are right to be annoyed: "Doing something" is a function in physiology, even if it isn't in evolutionary history. He wasn't wrong, but he wasn't telling the whole story.
