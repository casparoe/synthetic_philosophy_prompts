prompt: |-
  Im giving a talk in a couple weeks to a small workshop on levels of explanation and I want a Q&A prep sheet. The room is a specific mix: two people who work on Kim-style exclusion arguments, one interventionist about causation (invariance under intervention, that whole apparatus), one dynamical-systems/embodiment person who thinks "levels" are a story we tell ourselves, one eliminativist about representation who wants the word "symbol" retired, one complexity person who is very pro-downward-causation and gets annoyed at anything that smells deflationary, plus a neuroscientist who just wants to know what the toy predicts.

  The talk is about the careenium (I think it's Hofstadter's, whatever, the setup is what matters): a big arena full of simms, little balls bouncing around under simple rules, nothing in there alive or aware. But at a higher level of description you get stable patterns, "simmball symbols," that look like they're talking to each other and reasoning. The question on my title slide is: do the symbols push the simms around? My answer is no — not in any sense where the symbol and the simm are competing for the same causal slot — but the symbols are still causes in the sense that matters, namely they're the level at which the system's behaviour stays invariant under intervention. Simm level is where the physics is, symbol level is where the difference-makers are. And I've added a wrinkle: in my version there's a sub-arena of simms whose higher-level pattern tracks the whole careenium, a kind of self-model, and I claim the symbol level only starts doing causal work once that loop closes.

  So draft the prep: the eight or so objections I'll actually get from these people, ordered by how likely they are times how much damage they'd do, each phrased the way that person would really say it, each with a two-minute reply and a note on where the reply is thin. Tell me what to concede in the first five minutes to take the wind out of the room, what I can't concede under any circumstances, and include the one question I'm hoping nobody asks.
