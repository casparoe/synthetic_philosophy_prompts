answer: |-
  The distinction you are circling is the gap between **falsity** (the relationship between an utterance and the world) and **deceptiveness** (the relationship between a speaker's intention and a hearer's belief). In contemporary philosophy of language and ethics, this is often framed as the debate between the **Falsity Account** of lying and the **Deception Account** (or Intentionalist Account) of lying.

  However, to give you the precise account and terminology you requested, we must move beyond the single word "lie." The phenomenon you describe is best captured by distinguishing between **Insincere Assertion** and **Deceptive Communication**.

  Here is the account of the phenomenon, the terminology, the boundaries, and my verdict.

  ### 1. The Terminology and Account

  The established pair of terms that maps onto your cases is **Non-Deceptive Falsehood** (Case 1) and **Deceptive Truth-Telling** (Case 2), often specifically categorized under **Paltering** or **Misleading**.

  The overarching phenomenon is **Deceptive Intent**, defined not by the truth-value of the proposition ($p$), but by the speaker's intention regarding the hearer's doxastic state (belief).

  *   **Case 1 (False, No Intent to Deceive):** This is technically an **Insincere Assertion without Deceptive Intent**.
      *   In the literature, this is sometimes called a **"Bare Lie"** or an **"Objective Lie."**
      *   It is distinct from **Bullshitting** (Harry Frankfurt's term). A bullshitter is *indifferent* to the truth; your speaker *knows* the truth and asserts the opposite, but lacks the *telos* of inducing belief.
      *   It is distinct from **Joking** or **Acting**, because there is no mutual understanding that the norm of truth-telling is suspended. The speaker is asserting, but opting out of the cooperative principle's goal of belief-transfer.

  *   **Case 2 (True, Intent to Deceive):** This is **Deceptive Misleading**, specifically **Paltering**.
      *   **Paltering** is the active use of truthful statements to create a false impression.
      *   Mechanically, this relies on **Gricean Conversational Implicature**. The speaker says $p$ (true), knowing the hearer will infer $q$ (false) based on conversational norms (e.g., Relevance: "If he was at his mother's, he wasn't at the casino").
      *   The speaker *warrants* the truth of $p$ but intentionally manipulates the inference to $q$.

  **The Account:** The phenomenon is **Deception**, defined functionally as *the intentional induction of a false belief*. Under this account, truth-value is incidental. A statement is deceptive if and only if the speaker intends the hearer to believe something the speaker knows to be false, regardless of whether the literal utterance is true or false.

  ### 2. Relations to Neighbouring Ideas

  *   **Misleading:** This is the superset for Case 2. All paltering is misleading, but not all misleading is paltering (e.g., remaining silent when asked a question can be misleading). Your Case 2 is misleading *via assertion*.
  *   **Equivocation:** This is a specific linguistic mechanism (using ambiguous terms) to achieve deception. Case 2 *could* involve equivocation, but your example relies on implicature ("at my mother's" implies "only at my mother's"). Equivocation is a tool; deception is the end.
  *   **Indifference to Truth (Bullshit):** As noted, Case 1 is not bullshit. Bullshit ignores the truth-value axis entirely. Case 1 acknowledges the axis (knows he is smoking) but severs the link to the belief axis (doesn't care if the doctor believes him). This is **Instrumental Falsehood**: the falsehood is used for a purpose other than belief-manipulation (e.g., social closure).

  ### 3. Edges: Inclusion and Exclusion

  To define the edges of **Deceptive Intent** (the phenomenon you are tracking):

  *   **Included:**
      *   **Case 2 (Paltering):** True words, false intent.
      *   **Traditional Lying:** False words, false intent.
      *   **Omission:** Withholding truth to induce false belief.
      *   **Fabrication:** Creating false evidence without a direct verbal assertion.
  *   **Excluded:**
      *   **Case 1 (Non-Deceptive Falsehood):** False words, no false intent. The edge lies at the *intent to induce belief*. If the speaker does not care if the hearer believes them, it is not deception, even if it is a lie in the traditional sense.
      *   **Accidental Falsehood:** The speaker believes $p$, $p$ is false, hearer believes $p$. No deception (no intent to induce *false* belief, since speaker thinks it's true).
      *   **Jokes/Fiction:** Contextual markers suspend the "belief norm." The speaker does not intend the hearer to believe the proposition is factually true about the world.

  **The Boundary Line:** The edge is drawn at **Doxastic Intent**. Does the speaker intend to alter the hearer's map of reality to match a falsehood the speaker holds in their own mind? If yes, it is deception. If no, it is merely insincerity or error.

  ### 4. My Verdict

  I come down on the side of the **Deceptionist (Intentionalist) Account**.

  **Verdict:** The moral and functional core of the phenomenon is the **manipulation of the hearer's epistemic autonomy**, not the correspondence of the utterance to reality. Therefore, Case 2 is morally and functionally more significant than Case 1, despite Case 1 being a "lie" in the traditional Augustinian sense.

  **Reasoning:**
  1.  **Harm:** The harm in lying is typically the corruption of the hearer's decision-making capacity via false belief. Case 2 achieves this; Case 1 explicitly forfeits it.
  2.  **Trust:** Trust is violated when a speaker exploits the hearer's reliance on conversational norms to manipulate belief. In Case 2, the speaker exploits the norm of Relevance. In Case 1, the speaker violates the norm of Quality (truth) but does not exploit the hearer's reliance on it for belief formation (since they don't care if the hearer believes).
  3.  **Taxonomy:** "Lying" should be reserved for **Insincere Assertion** (warranting the truth of something you believe false). "Deception" should be the broader category of **Intent to Induce False Belief**. Case 1 is a Lie without Deception. Case 2 is Deception without a Lie (if lying requires falsity).

  ### 5. What Would Move Me to a Different Verdict?

  I would shift toward the **Falsity Account** (prioritizing Case 1 as the graver violation) if convinced by the **Warrant Argument** (championed by philosophers like Thomas Carson).

  **The Argument:**
  The primary wrong of lying is not the false belief produced, but the **violation of the normative commitment of assertion**. When you assert, you invite the hearer to trust your word as a guarantee.
  *   **Scenario to change my mind:** Imagine a court witness who says, "I did not see the defendant," knowing they did, but they *know* the jury has already seen video evidence proving they did. They say it only to maintain a formal record of objection (Case 1 structure).
  *   **Why this moves me:** Even though no one is deceived (no one believes the witness), the act corrupts the **institution of testimony**. It severs the link between speech and commitment. If the goal of language is not just belief-transfer but the maintenance of a reliable public record, then Case 1 (Falsity) is a structural attack on the system, whereas Case 2 (Deception) is a tactical attack on an individual.

  If you argue that the integrity of the *linguistic practice* outweighs the epistemic autonomy of the *individual hearer*, then the traditional definition (requiring falsity) regains its primacy, and Case 1 becomes the more fundamental violation. However, for interpersonal ethics, the Intentionalist/Deceptionist account remains superior.
