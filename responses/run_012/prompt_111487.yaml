  5.  **Drafting the Content (Iterative refinement):**

      *   *Naming:* Call it "Naturalistic Moral Realism" or "Neo-Aristotelian Ethical Naturalism." Mention Foot/Hursthouse.
      *   *Biology:* Be precise. "Selected Effect" (Millikan) vs. "Causal Role" (Cummins). If function is just "what happens," then a virus flourishing is "good" for the virus. Is that moral? The user needs to distinguish *biological good* from *moral good*.
      *   *EDA:* Distinguish between "evolution shaped our morals" (true) and "evolution shaped our morals *away* from truth" (contested). Address the "reasoning undercutting itself" point (Plantinga's evolutionary argument against naturalism).
