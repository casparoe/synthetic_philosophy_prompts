      *   **Philosophy of Biology (Functions):** This is the core machinery.
          *   *Selected Effect (Etiological):* Function = what it was selected for. Problem: Evolution has no foresight, "selection" is messy.
          *   *Causal Role:* Function = what it does. Problem: Cancer cells "function" within a tumor system. Relativism risk.
          *   *Impact:* If biological function is normative-free, does morality inherit that? Yes. If "health" is just a human preference, moral naturalism collapses.
      *   **Evolutionary Debunking (EDA):**
          *   Argument: If morals are selected for survival, not truth, why trust them?
          *   Counter (Street vs. Joyce): If reasoning itself is selected, does that debunk reasoning? (The "Self-Defeat" objection).
