  2.  **Identify the Philosophical Position:**
      *   The user describes a view very close to **Neo-Aristotelian Naturalism** (e.g., Philippa Foot, Rosalind Hursthouse, Michael Thompson) or **Ethical Naturalism** (e.g., Richard Boyd's Moral Realism).
      *   Key feature: Moral properties are natural properties (facts about flourishing/function).
