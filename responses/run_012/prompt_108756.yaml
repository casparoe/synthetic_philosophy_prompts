  Here are five exchanges (ten questions total) designed to cover your four mandatory topics and the new case studies. Each exchange includes a main question and a scripted follow-up keyed to the answer she is most likely to give.

  **1. The "No Fixed Judge" Claim**
  **Q1:** You argue that transformative choices aren't hampered by epistemic uncertainty, but by the lack of a "fixed judge"—that the standard of judgment changes so there is no stable "you" to validate the choice. Is this a metaphysical claim about personal identity, or just a normative claim that decision theory's requirement for a stable utility function is misplaced?

  *   **Predicted Answer:** She will likely retreat to a decision-theoretic framing: "It's just that utility functions are dynamic, $U(t_1) \neq U(t_2)$."
  *   **Q2 (Follow-up):** If standard dynamic decision theory can model changing utilities, why does that fail here? If I can plan for my future preferences even if they differ from my current ones, doesn't that restore a "fixed judge" in the form of a rational planning agent? Or are you saying the planning agency itself dissolves?

  **2. Reversible Transformations**
  **Q3:** You suggest irreversible cases like parenthood are red herrings, and we should look at reversible transformations, like acquiring a disability and recovering, or deeply learning a language and then losing it. But if I recover from the disability, I'm not the person who left, nor am I the person who was disabled. Doesn't the "returnee" occupy a third, unstable identity that makes comparison impossible?

  *   **Predicted Answer:** She will likely agree: "Exactly. The returnee is a new self, which proves there was never a fixed self to begin with."
  *   **Q4 (Follow-up):** If the returnee is a third self, distinct from both the chooser and the transformed, doesn't that lead to paralysis? If every significant experience creates a new "judge" who invalidates the previous one, how do I ever authorize *any* long-term project without waiting to see which self ends up holding the gavel?

  **3. Ownership and Narrative**
  **Q5:** Your constructive proposal is to replace preference-satisfaction with an "ownership" criterion: can I narrate this choice as part of a life I own? What would count *against* this? Is there a life trajectory that is so fragmented you would say the person *cannot* own it, or is the bar low enough that any coherent story counts?

  *   **Predicted Answer:** She will likely say: "Regret doesn't count against it. Regret is just the later self talking; it doesn't mean the choice wasn't owned at the time."
  *   **Q6 (Follow-up):** If regret is just "later self talk" and not evidence of a mistake, does your view lose its normative bite? If I can narrate *any* outcome as "ownable" after the fact, isn't "ownership" just a synonym for "survival," and therefore unable to guide choice beforehand?

  **4. The Uselessness of Testimony**
  **Q7:** You claim testimony is useless not just because the transformed can't describe the experience, but because their values have moved, making them bad witnesses about what the un-transformed chooser's values even *were*. Does this mean the transformed person's report is evidence of *nothing* for the chooser?

  *   **Predicted Answer:** She will likely concede: "It's evidence of their current state, but not of the choice's value for the un-transformed."
  *   **Q8 (Follow-up):** If their report tells me nothing about the value of the choice for *me* (the un-transformed), and I can't simulate the experience, aren't you describing a form of radical skepticism? How do we distinguish between a transformative choice and a blind leap if all external data is disqualified by the value shift?

  **5. Agency and Mistakes (New Cases)**
  **Q9:** Consider two cases you haven't written about: First, someone who deliberately cultivates a taste, training themselves to love opera until they genuinely prefer it. Second, someone taking a job *knowing* it will remake their values so they'll love the work. On your view, is deliberately engineering your own transformation different from having it happen to you, or is the "no fixed judge" problem identical?

  *   **Predicted Answer:** She will likely argue: "It's the same problem. You still can't know if the remade you will be happy, only if you can own the narrative."
  *   **Q10 (Follow-up):** If the mechanism is the same, does your view allow that a transformative choice can be an outright *mistake*? If I engineer a transformation I can't own, or one that destroys my capacity to narrate my life, is that an error on your account, or just a different kind of life? I need to know if your theory can condemn a choice, or only describe it.
