          *   Perceptual: Visual mask presented in the apparent path during the ISI (Inter-Stimulus Interval).
          *   Mnemonic: Secondary task (e.g., digit span) during the retention interval before report.

  6.  **Final Polish:**
      *   Check against the "four outcomes" requirement.
      *   Ensure the "scope" section distinguishes pilot vs. full program.
      *   Make sure the "Question" is determinate.
      *   Verify the "Indistinguishability" argument is addressed clearly.

  7.  **Final Review against constraints:**
      *   Did I avoid naming Dennett/Kolers/etc.? Yes.
      *   Is it 2 pages? (Will aim for concise formatting).
      *   Is the tone right for a 2nd year PhD? (Ambitious but grounded).

  *(Self-Correction on Length)*: A standard single-spaced page is about 500-600 words. Two pages is roughly 1000-1200 words. I need to be dense but clear.

  *(Self-Correction on Method)*: I need to be careful not to overpromise. A pilot study won't settle the metaphysics, but it will test the *empirical tractability*. I will frame the goal as testing the *dissociability* of the signatures.

