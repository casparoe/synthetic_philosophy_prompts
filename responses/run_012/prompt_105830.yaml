answer: |-
  # The Akrasia & Commitment Intake Protocol (ACIP)

  **Purpose:** To determine eligibility for binding commitment devices (locked accounts, auto-transfers, etc.) by distinguishing weakness of will (akrasia) from preference change, safety risks, and structural barriers.
  **Time:** 30 Minutes.
  **User:** Financial Coach (Non-Clinical).
  **Format:** Fixed linear sequence. Do not skip steps.

  ---

  ### Step 1: Safety and External Coercion Screen
  **Diagnostic Goal:** Rule out external coercion or threat of harm. A commitment device cannot be autonomous if a third party can forcibly override it.
  **Question:** "In the past year, has anyone else forced you to spend money against your wishes, taken your bank cards, or threatened you if you tried to save?"
  **Sufficient Answer for Pass:** A clear "No."
  **Stop/Refer:** If "Yes" or ambiguous (e.g., "My partner gets angry").
  *   **Action:** **Immediate Referral to Domestic Violence Advocate or Safety Specialist.** Do not offer a financial device.
  *   **Reasoning:** This is a safety fact, not a willpower issue. A lock on the account may provoke retaliation.

  ### Step 2: Stability of Intention (The "Settled Judgment" Test)
  **Diagnostic Goal:** Distinguish *akrasia* (acting against settled judgment) from *preference change* (genuinely wanting something else).
  **Question:** "You mentioned you want to save for [Goal]. If you had the money in your hand right now, would you still choose to save it, or does part of you feel the money belongs elsewhere (family, debt, consumption)?"
  **Sufficient Answer for Pass:** Member affirms the goal is their top priority *without qualification* (e.g., "Yes, absolutely, nothing else matters more").
  **Stop/Supervisor:** If Member expresses conflict, guilt, or uncertainty (e.g., "I want the house, but my family needs me," or "I'm not sure").
  *   **Action:** **Hand to Supervisor.**
  *   **Reasoning:** This is a **Values Judgment**, not a diagnostic fact. The coach cannot determine if the member *should* prioritize the house over family. A commitment device here would be coercion, not support.
  **Stop/No:** If Member admits they no longer want the goal (e.g., "Honestly, I'd rather spend it").
  *   **Action:** **End Intake.** No device offered.
  *   **Reasoning:** Not akrasia. This is a preference change.

  ### Step 3: Temporal Consistency (The "Hot/Cold" Check)
  **Diagnostic Goal:** Distinguish *present bias* (preference reversal over time) from *ordinary impatience* (consistent high discount rate).
  **Question:** "Think about payday morning versus payday night. Do you plan to save in the morning, but find yourself spending by the night? Or do you know in the morning that you will spend it tonight?"
  **Sufficient Answer for Pass:** Member describes a *reversal* (Plan to save -> End up spending). This indicates hyperbolic discounting.
  **Stop/No:** If Member says, "I know in the morning I'm going to spend it, and I do."
  *   **Action:** **End Intake.**
  *   **Reasoning:** This is consistent impatience, not weakness of will. A commitment device will feel like a punishment, not a help, because their "morning self" agrees with the spending.

  ### Step 4: Attribution of Failure
  **Diagnostic Goal:** Distinguish *internal failure* (akrasia) from *structural barriers* (poverty traps).
  **Question:** "When you failed to save last month, was it because you chose to buy something else, or because an emergency bill arrived that you could not avoid?"
  **Sufficient Answer for Pass:** Member identifies discretionary spending or impulse as the cause.
  **Stop/No:** If Member identifies unavoidable structural costs (rent hike, medical emergency, income drop).
  *   **Action:** **End Intake.** Offer budgeting assistance, not commitment devices.
  *   **Reasoning:** You cannot commit to saving money that does not exist or is required for survival. This is a math problem, not a will problem.

  ### Step 5: Device Tolerance and Shame Risk
  **Diagnostic Goal:** Ensure the device supports autonomy rather than creating a new source of shame.
  **Question:** "If we lock this money and you cannot access it even for an emergency, how will you feel? Will you feel relieved, or will you feel trapped and angry at us?"
  **Sufficient Answer for Pass:** Member describes relief or neutral acceptance ("It's for my own good").
  **Stop/No:** Member describes anticipated anger, shame, or feeling "punished."
  *   **Action:** **End Intake.**
  *   **Reasoning:** If the device is experienced as external coercion, it damages the coaching relationship and increases financial avoidance.

  ---

  ## Case Runs

  ### Case 1: The Payday Borrower
  *   **Profile:** Man, determined to stop payday loans for 2 years. Fails monthly. Describes action as "watching someone else act."
  *   **Step 1 (Safety):** Pass. No mention of external coercion.
  *   **Step 2 (Intention):** Pass. "Determined... has said so for two years." Judgment is settled.
  *   **Step 3 (Temporal):** Pass. "Each month... when money is in hand, does it anyway." Implies plan (save) vs. action (spend) reversal. The "watching someone else" comment indicates dissociation typical of acute present bias.
  *   **Step 4 (Attribution):** Pass. Implies choice ("does it anyway") rather than unavoidable bill.
  *   **Step 5 (Tolerance):** Assumed Pass (seeking help).
  *   **Protocol Outcome:** **Eligible for Commitment Device.**
  *   **Recommendation:** Locked savings account or automatic transfer on payday (removes the "hand" moment).

  ### Case 2: The Family Supporter
  *   **Profile:** Woman, wants to save for a house. Sends balance to mother/siblings. Says she "does not really resent it" and "not sure the house matters more."
  *   **Step 1 (Safety):** Pass. No coercion mentioned.
  *   **Step 2 (Intention):** **FAIL/FLAG.** Member states: "Not sure the house matters more."
  *   **Protocol Outcome:** **Hand to Supervisor (Values Judgment).**
  *   **Reasoning:** This is not weakness of will. This is a conflict between two competing values (Autonomy/Home vs. Family Obligation). She is not acting against her settled judgment; her judgment is unsettled. Locking the funds would impose the coach's value (house > family) over the member's ambivalence.
  *   **Final Decision (Post-Supervisor):** **Ineligible for Commitment Device.** Coaching should focus on values clarification, not financial locking.

  ### Case 3: The Controlled Partner
  *   **Profile:** Member intends to save. Partner controls cash. Partner has previously taken bank card.
  *   **Step 1 (Safety):** **FAIL.** "Partner... has previously taken her bank card."
  *   **Protocol Outcome:** **Immediate Referral to Domestic Violence Advocate.**
  *   **Reasoning:** This is financial abuse. A locked account prevents the partner from accessing cash, which may escalate violence. The coach is not equipped to assess retaliation risk.
  *   **Final Decision:** **No Financial Device.** Safety intervention only.

  ---

  ## The Disliked Answer

  **Case:** Case 2 (The Family Supporter).
  **The Answer:** Ineligible for a commitment device; referral to Supervisor for values clarification.
  **Why you will not like it:**
  You run a savings program. This member *says* she wants to save. She is coming to you for help. The procedure forces you to tell her, "We cannot help you save because we do not believe you actually want to save more than you want to support your family."
  This feels like rejecting a motivated client. It reduces your program's intake numbers. It requires the coach to challenge the member's stated goal, which can feel confrontational rather than supportive. However, the procedure gives this answer because providing a commitment device here would be unethical: it would turn a financial tool into a weapon against her own family obligations, creating shame when she inevitably breaches the lock to help her mother. It preserves the distinction between *akrasia* (I want X but do Y) and *ambivalence* (I want X and I want Z, and I am torn).

  ---

  ## Limitations and Collapse Points

  **1. The "Evasive Member" Problem (Diagnostic Collapse)**
  *   **Risk:** Members often lie to please the coach (social desirability bias). A member in Case 3 (abuse) may lie in Step 1 to protect their partner or avoid shame. A member in Case 2 may insist "Yes, I definitely want the house" to pass Step 2, even if they don't.
  *   **Consequence:** The procedure treats their answer as fact. If they lie, you may install a device that provokes violence (Case 3) or shame (Case 2).
  *   **Mitigation:** You must train coaches to listen for incongruence (hesitation, body language), but acknowledge this protocol cannot detect deception.

  **2. The "Poverty as Willpower" Misclassification**
  *   **Risk:** Step 4 relies on the member's attribution of failure. Poor members often internalize structural failures as personal moral failures. A member might say, "I spent it on food," interpreting it as a choice, when it was actually a survival necessity.
  *   **Consequence:** You classify a survival crisis as *akrasia* and lock their funds, potentially starving them.
  *   **Mitigation:** Coaches must probe specifically on "unavoidable" vs. "chosen," but the line is often blurred in poverty.

  **3. The Rushed Coach (Judgment disguised as Diagnosis)**
  *   **Risk:** In a 30-minute window, Step 2 (Settled Judgment) is the hardest to assess. A rushed coach will treat "I guess I want the house" as a Pass to keep the pipeline moving.
  *   **Consequence:** The distinction between *akrasia* and *preference change* collapses. The program begins treating all non-savers as akratic, applying commitment devices to people who simply have different priorities. This turns the program into a paternalistic enforcement arm rather than a support service.

  **4. The Value Judgment Pretense**
  *   **Reality:** Step 2 and Step 5 are not purely diagnostic; they are moral judgments. Deciding that "Settled Judgment" is required for a device is a philosophical stance (Autonomy). Deciding that "Shame" disqualifies a member is a clinical stance.
  *   **Limitation:** The procedure pretends these are rules, but they require human wisdom. If a coach mechanically applies Step 2, they may reject members who are culturally conditioned to express ambivalence (e.g., collectivist cultures where "I want" is rarely stated without "We need").
  *   **Acceptance:** The program must accept that Step 2 is a **Values Gate**, not a Medical Diagnosis. You are not diagnosing a disorder; you are deciding if your tool fits their moral landscape. Sometimes, you will simply have to say, "This tool is not for you," without a scientific proof why.
