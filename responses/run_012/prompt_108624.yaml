      *   **4. The Storyteller:**
          *   *Arendt's View:* Storyteller discloses meaning *after* the fact (historian/poet). Not a fabricator of facts.
          *   *Impact of AI:* If text is cheap, *meaning* becomes the scarce resource. The storyteller becomes *more* vital because we need sense-making, not more data.
