  ### 1. Testing the Horizon Principle

  Your proposed **Horizon Principle** states: *An act's moral status is fixed by the expected value (EV) of its consequences within the horizon over which I can assign non-trivial credences, and beyond that horizon acts inherit the moral status of their reference class.*

  **Where it fails:**
  The principle collapses on the assignment of **Reference Classes**. The principle itself provides no rule for determining which reference class an act belongs to once it passes the horizon of credence.
  *   **AI Donation vs. Sweater:** Both pass the horizon of credence immediately (you admit the long-run effects are unknowable/lottery).
      *   You assign the AI donation to the class *"Existential Risk Reduction"* (High Value).
      *   You assign the Sweater to the class *"Personal Consumption"* (Neutral Value).
      *   *Failure:* The Horizon Principle does not explain *why* these classes are assigned. Without an external rule, the principle is circular: "AI is good because it belongs to the Good Class; it belongs to the Good Class because it is good."
  *   **Voting vs. Recycling:** Both have negligible marginal causal impact (beyond the horizon of decisive influence).
      *   Voting inherits the class *"Civic Duty"* (Obligatory).
      *   Recycling inherits the class *"Environmental Maintenance"* (Negligible).
      *   *Failure:* Again, the principle relies on an unexplained intuition to assign the class status.

  ### 2. The Repaired Principle: The Principle of Claimed Causality

  To fix the Reference Class problem, we must anchor the class assignment to your **epistemic agency**.

  **The Principle:** *An act's moral status is determined by the expected value of the consequences you **explicitly model and intend**. Consequences you do not model (background noise) are morally neutral, unless you explicitly adopt a normative rule (duty/virtue) to govern them.*

  **How it unifies your verdicts:**
  *   **Bednets & AI Donation:** You explicitly model these as interventions to save lives/reduce risk. You claim causality. **Verdict: Good.**
  *   **Sweater:** You model this as purchasing warmth/comfort. You explicitly *reject* modeling the climate/labor impact (treating it as background noise). **Verdict: Neutral.**
  *   **Child:** You model the near-term raising of a human. You explicitly *reject* modeling the long-run historical impact. **Verdict: Good (Non-consequential).**
  *   **Voting:** You cannot model causal impact, so you adopt a normative rule ("Civic Duty"). **Verdict: Obligatory.**
  *   **Recycling:** You cannot model causal impact (one bottle), and you have not adopted a strong normative rule for token acts. **Verdict: Negligible.**

  ### 3. The Cost: Which Verdict Must Go?

  The Repaired Principle saves your *valuations*, but it breaks **Opportunity Cost Consistency**.

  If the AI donation is "Good" because of its modeled long-run effects, and the Sweater is "Neutral" because you refuse to model its long-run effects, you have created an epistemic blind spot that allows resources to flow away from the higher value. In a unified moral system, **resources are fungible**.

  To maintain a single, action-guiding principle (Consistent Consequentialism), you must abandon one of these two verdicts:
  1.  **The AI Donation is consequentialist.** (It is good *because* of the effects).
  2.  **The Sweater is morally neutral.** (It is permissible *despite* the effects).

  **You must abandon the Sweater's Neutrality.**

  If you accept that the AI donation is a consequentialist bet with positive EV, then spending that same money on a Sweater incurs an **opportunity cost** equal to the EV of the AI donation. The Sweater is not neutral; it is morally suboptimal (a net loss relative to the alternative). You cannot claim to be maximizing good in one bucket while claiming ignorance in the other when the resource (money/time) is the same.

  ### 4. Prediction: The Career Case

  **Case:** Choosing between Career A (Clear, Modest Local Benefit) and Career B (Speculative, Far-off Payoff).

  **Under the Repaired Principle (with Sweater Neutrality abandoned):**
  You must choose **Career B**.
  *   Since you have already established that speculative long-run effects (AI Donation) outweigh evidenced near-term effects (Bednets) in your moral calculus, consistency demands you apply the same weighting here.
  *   If the speculative payoff is "entirely far off" but the expected value is higher (as per your AI verdict), the modest local benefit is morally irrelevant by comparison.
  *   *Prediction:* You are obligated to take the speculative career, provided your credence in the model is non-zero and the stakes are sufficiently high.

  ### 5. The Alternative: If You Refuse to Abandon the Sweater

  If you find the conclusion that "buying a sweater is morally suboptimal" unacceptable (perhaps because it leads to paralysis or violates your integrity), then **no single principle can hold your verdicts.** You are oscillating between two moral modes.

  **The Smallest Set of Candidates (Two-Level Utilitarianism):**

  1.  **Clause 1: The Maximization Rule (High-Stakes/Tractable).**
      *   *Motivating Case:* **AI Donation vs. Bednets.**
      *   *Rule:* When consequences are explicitly modeled and stakes are high, maximize Expected Value.
  2.  **Clause 2: The Heuristic Rule (Low-Stakes/Intractable).**
      *   *Motivating Case:* **Sweater, Child, Voting.**
      *   *Rule:* When consequences are opaque or stakes are personal, follow robust social norms and personal integrity constraints.

  **The Cost:**
  You must abandon **Philosophical Unity**. You must admit that your morality is not a single engine, but a switch. You maximize in the "Effective Altruism" mode and satisfy in the "Human Being" mode. This leaves you vulnerable to the charge of arbitrariness: *Why is AI "High-Stakes" but Climate Change (Sweater) "Low-Stakes"?*

  ### 6. Recommendation

  **Prefer the Two-Level View.**

  **Why:**
  The **Single Principle (Consistent Consequentialism)** forces you to abandon the Sweater verdict. While philosophically cleaner, it is cognitively unsustainable. It requires you to model the long-run consequences of every purchase and career move, leading to decision paralysis or burnout. It treats you as a utility calculator rather than an agent with personal projects.

  The **Two-Level View** acknowledges human cognitive limits. It allows you to be a maximizer where your models are strong (AI, Bednets) and a satisficer where they are weak (Sweater, Child).

  **The Price You Pay:**
  You must accept that your verdict on the **Career Case** is context-dependent.
  *   If you treat the career choice as a "High-Stakes/Tractable" decision (like the AI donation), you must take the **Speculative Career**.
  *   If you treat it as a "Low-Stakes/Intractable" decision (acknowledging you cannot actually predict the far-off payoff), you are permitted to take the **Modest Career** to preserve your mental health and integrity.

  **Final Advice:**
  Adopt the Two-Level view, but set a **threshold**. Define clearly what counts as "High-Stakes/Tractable" (e.g., donations >$100, career decisions). Below the threshold, buy the sweater without guilt. Above it, maximize. This prevents the "Sweater" logic from infecting the "AI" logic, and vice versa.
