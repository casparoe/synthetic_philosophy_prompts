answer: |-
  Your colleague's invocation of the proverb 'All's fair in love and war' is rhetorically potent but philosophically promiscuous. In the context of the debate between Traditionalists (who defend the Moral Equality of Combatants, or MEC) and Revisionists (who argue that *jus ad bellum* status affects *jus in bello* rights), the slogan is doing too much work. It conflates legal convention, moral permission, and descriptive reality.

  Below is a conceptual menu of the precise claims the slogan might be advancing, ranging from the banal to the radical. For each, I have assessed its plausibility, its compatibility with MEC, and its utility in dismissing the Revisionist objection.

  ### 1. The Descriptive Claim
  **The Claim:** In practice, combatants on all sides utilise deception, violence, and stratagems without regard for the justice of their cause.
  *   **Strict Entailment:** This is an empirical observation about human behaviour in conflict.
  *   **Plausibility:** High. History bears out that soldiers fight to win, regardless of the macro-justice of the war.
  *   **Compatibility with MEC:** Neutral. MEC is a normative doctrine, not a descriptive one. The fact that soldiers *act* as equals does not prove they *are* moral equals.
  *   **Utility:** None. Committing the naturalistic fallacy (deriving an 'ought' from an 'is') does not dismiss the objection that unjust combatants are *morally* distinct.

  ### 2. The Legal-Conventional Claim
  **The Claim:** International Humanitarian Law (IHL) grants equal combatant privileges and liabilities to all parties, provided they adhere to the laws of war.
  *   **Strict Entailment:** The rules of engagement do not distinguish between aggressor and defender regarding permissible targets.
  *   **Plausibility:** High. This is the bedrock of the Geneva Conventions.
  *   **Compatibility with MEC:** High. MEC is often grounded in this legal symmetry.
  *   **Utility:** Weak. The Revisionist objection is moral, not legal. Pointing to positive law does not refute the claim that the law is morally mistaken in treating unjust combatants as equals.

  ### 3. The Symmetry Thesis (Normative)
  **The Claim:** Combatants on both sides possess identical *jus in bello* permissions and prohibitions, irrespective of *jus ad bellum* status.
  *   **Strict Entailment:** An unjust combatant has the same right to kill a just combatant as the just combatant has to kill them.
  *   **Plausibility:** Contested. Traditionalists accept it; Revisionists deny it.
  *   **Compatibility with MEC:** Identical. This *is* the core of MEC.
  *   **Utility:** Circular. Using this claim to dismiss the objection merely asserts the doctrine under attack. It begs the question against the Revisionist who argues that liability to attack depends on the justice of the cause.

  ### 4. The Independence Thesis
  **The Claim:** The justice of the war (*ad bellum*) is logically independent of the justice of conduct within the war (*in bello*).
  *   **Strict Entailment:** One can fight unjustly in a just war, and justly in an unjust war.
  *   **Plausibility:** Contested. Revisionists argue they are linked (if you shouldn't be fighting, you shouldn't be shooting).
  *   **Compatibility with MEC:** High. MEC relies on this separation.
  *   **Utility:** Moderate. It provides the structural framework for MEC, but like the Symmetry Thesis, it requires argumentation to defend against the Revisionist claim that *ad bellum* injustice transmits to *in bello* actions.

  ### 5. The Equal Liability Claim
  **The Claim:** Unjust combatants are not morally liable to defensive harm simply by virtue of fighting for an unjust cause.
  *   **Strict Entailment:** Fighting for an unjust cause does not strip a soldier of their right not to be killed.
  *   **Plausibility:** Contested. Revisionists argue that by posing an unjust threat, soldiers make themselves liable.
  *   **Compatibility with MEC:** Essential. If unjust combatants are liable simply because they are unjust, MEC collapses.
  *   **Utility:** High, but requires defence. This is the crux of the matter. However, the slogan offers no argument for *why* they are not liable; it merely asserts they are.

  ### 6. The Moral Suspension Claim (Nihilism)
  **The Claim:** War is a realm where ordinary morality is suspended; 'fairness' does not apply.
  *   **Strict Entailment:** No moral constraints exist in war. Anything goes.
  *   **Plausibility:** Low. Even in war, we condemn atrocities (torture, targeting civilians).
  *   **Compatibility with MEC:** Incompatible. MEC is a *moral* doctrine that imposes constraints (e.g., discrimination, proportionality). If 'all' is fair, there are no war crimes.
  *   **Utility:** Counter-productive. This dismisses the objection by destroying the subject matter. If morality is suspended, there is no 'moral equality' to discuss, only power dynamics.

  ### 7. The Epistemic Claim
  **The Claim:** Soldiers cannot reliably know whether their cause is just; therefore, they must be treated as equals.
  *   **Strict Entailment:** Moral equality is a heuristic necessitated by the 'fog of war'.
  *   **Plausibility:** Moderate. It addresses the practical application of MEC.
  *   **Compatibility with MEC:** Compatible as a pragmatic defence, though not a foundational one.
  *   **Utility:** Moderate. It sidesteps the metaphysical question of liability by focusing on epistemic limitations. However, it concedes that, metaphysically, the combatants might *not* be equals.

  ---

  ### Entailment vs. Evocation

  It is vital to distinguish what the slogan strictly entails from what it merely evokes.

  *   **Strict Entailment:** The phrase 'All's fair' literally entails the **Moral Suspension Claim**. It suggests a vacuum of normative constraint. If taken literally, it entails that war crimes are permissible, which contradicts the very framework of Just War Theory (which assumes war is morally governable).
  *   **Mere Evocation:** In philosophical discourse, the slogan is rarely used literally. It evokes the **Symmetry Thesis** and the **Independence Thesis**. It functions as a shorthand for the Traditionalist intuition that the battlefield is a distinct moral sphere where the macro-political justice of the war should not dictate the micro-ethical rights of the soldier. It evokes the idea of the 'soldier's honour' being separate from the 'statesman's guilt'.

  ### Conclusion: What Your Colleague Needed

  Your colleague likely **needed** the **Independence Thesis** supported by the **Equal Liability Claim**.

  To successfully dismiss the Revisionist objection, one must argue that a soldier's liability to attack is generated by their immediate threat profile and adherence to *jus in bello*, not by the geopolitical justice of their state's cause. This preserves MEC without abandoning morality.

  However, by using the slogan 'All's fair in love and war', they inadvertently invoked the **Moral Suspension Claim**. This is a category error. Just War Theory is predicated on the idea that *not* all is fair in war. By using a proverb that implies moral nihilism to defend a moral doctrine (MEC), they undermined their own position. They required a normative argument for why *ad bellum* status does not transmit to individual liability; instead, they offered a proverb that suggests morality itself is irrelevant. The slogan is thus rhetorically effective only if one ignores its literal meaning, but philosophically disastrous if analysed rigorously.
