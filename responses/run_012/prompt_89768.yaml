answer: |-
  ### The Demarcation Decision Tree

  This tree is built from the logical structure of the problem, not from the history of who said what. Answer the questions in order. Do not worry about which philosopher you are channeling; just answer what seems most reasonable to you.

  **Node 1: Coherence**
  Is the question "What is science?" a coherent philosophical problem with a true answer?
  *   **No** → Go to Leaf A.
  *   **Yes** → Go to Node 2.

  **Node 2: Purpose**
  What is the primary work the demarcation criterion must do?
  *   **Decide what gets taught, funded, or admitted as evidence in court** → Go to Leaf B.
  *   **Describe how scientists actually behave and organize themselves** → Go to Leaf C.
  *   **Define what it is rational to believe or count as knowledge** → Go to Node 3.

  **Node 3: Precision**
  Is 'scientific status' a binary switch (you are either in or out) or a continuous dial (claims can be more or less scientific)?
  *   **A continuous dial (matter of degree)** → Go to Leaf D.
  *   **A binary switch (sharp line)** → Go to Node 4.

  **Node 4: Unit of Analysis**
  When we judge scientific status, what is the fundamental thing being judged?
  *   **A single hypothesis or statement** → Go to Node 5.
  *   **A long-term research tradition or community** → Go to Leaf E.

  **Node 5: Anomaly Response**
  When a prediction derived from a hypothesis fails, is the hypothesis logically refuted immediately?
  *   **Yes** → Go to Leaf F.
  *   **No** → *(Note: This path logically collapses into Leaf E; see analysis below)*.

  ---

  ### The Leaves (Positions)

  **Leaf A: The Pseudo-Problem View**
  *   **Most Awkward Commitment:** You must explain why we should fund physics departments but not theology departments if the line between them is fake.

  **Leaf B: The Institutional/Legal Checklist**
  *   **Most Awkward Commitment:** You must enforce a definition of science that might contradict the actual practice of working scientists to satisfy legal or bureaucratic clarity.

  **Leaf C: The Kuhnian Paradigm Account**
  *   **Most Awkward Commitment:** You must admit there is no objective sense in which modern science is 'truer' than Aristotelian physics, only different.

  **Leaf D: The Bayesian Degrees-of-Credence Account**
  *   **Most Awkward Commitment:** You must assign specific probabilities to unique historical events or unfalsifiable metaphysical claims to make the math work.

  **Leaf E: Sophisticated Falsificationism (Lakatosian)**
  *   **Most Awkward Commitment:** You must wait decades to know if a currently successful theory is actually degenerating and should be abandoned.

  **Leaf F: Naive Falsificationism (Popperian)**
  *   **Most Awkward Commitment:** You must admit scientists are irrational whenever they save a theory from refutation by adjusting auxiliary assumptions.

  ---

  ### Logical Space Analysis

  #### 1. Combinations Nobody Occupies
  There are paths through the logical space that yield no viable philosophical position. These are likely unoccupied because they are incoherent or pragmatically useless.

  *   **Purpose: Describe Practice + Precision: Binary Switch.**
      *   *Why Unoccupied:* Sociological descriptions (like Kuhn's) reveal messy transitions and overlapping communities, not clean on/off switches. A historian who insists on a sharp line is usually doing philosophy, not history.
  *   **Purpose: Set Policy + Precision: Continuous Dial.**
      *   *Why Unoccupied:* Courts and school boards require verdicts (admissible/inadmissible, taught/not taught). A "70% scientific" verdict is legally unenforceable, making this combination pragmatically dead.
  *   **Purpose: Define Rationality + Unit: Single Hypothesis + Anomaly: No.**
      *   *Why Unoccupied:* If you judge single hypotheses but deny that failed predictions refute them, you lack a mechanism for rejection. This leaves you with a binary status that never changes, which is functionally identical to judging a whole tradition (Leaf E).

  #### 2. Leaves The Tree Cannot Separate
  You suspected the two falsificationisms would collapse. The tree attempts to separate them via **Node 4 (Unit)** and **Node 5 (Anomaly)**, but logical pressure forces them together.

  *   **Naive Falsificationism (Leaf F) and Sophisticated Falsificationism (Leaf E).**
      *   *Reason:* The Duhem-Quine thesis demonstrates that a single hypothesis cannot be tested in isolation from auxiliary assumptions. Therefore, the path "Unit: Single Hypothesis" + "Anomaly: Yes" (Leaf F) is logically incoherent. Any consistent falsificationist must acknowledge that anomalies blame the "theory-plus-auxiliaries," which forces them up the tree to "Unit: Research Tradition" (Leaf E). Naive falsificationism is effectively a rhetorical stance that collapses into the sophisticated version upon scrutiny.

