  ### Case Study Stress Test

  Here is how the tree handles three difficult cases, and where the wood creaks.

  **Case 1: Natal-Chart Astrology**
  *   **Path:** Coherent (Yes) → Purpose (Rationality/Policy) → Precision (Switch) → Unit (Statement) → Anomaly (Yes).
  *   **Result:** Lands on **Naive Falsificationism** (It is falsified by failed predictions) or **Institutional** (It is excluded from curricula).
  *   **Where it Strains:** Astrologers rarely accept refutation; they add auxiliary excuses (e.g., "the reading was inaccurate"). To classify astrology as non-science, you must treat it as a *Research Programme* (Leaf E) that is *degenerating* (explaining away failures rather than predicting new ones). The tree's "Naive" path (Leaf F) is too fast; it assumes astrologers accept the refutation, which they don't. You need the Sophisticated leaf to properly debunk it.

  **Case 2: String Theory (Mathematically elegant, currently untestable)**
  *   **Path:** Coherent (Yes) → Purpose (Rationality) → Precision (Switch vs. Dial).
  *   **Result:** **Bayesian** (Leaf D) says it has low but non-zero credence. **Falsificationist** (Leaf E) says it is currently non-science (metaphysics) until testable.
  *   **Where it Strains:** The tree forces a binary choice at Node 3. If you choose "Switch," String Theory is excluded *now*. If you choose "Dial," it is included *but weak*. The strain is that String Theorists argue it *is* science despite lacking current tests (appealing to mathematical consistency), while Falsificationists argue it is not. The tree separates these views cleanly, but offers no resolution on who is right about the *potential* for future testing.

  **Case 3: Freudian Psychoanalysis (Untestable but explanatory)**
  *   **Path:** Coherent (Yes) → Purpose (Rationality) → Anomaly (No).
  *   **Result:** If you answer "No" to Node 5 (failures don't refute), you are pushed toward **Sophisticated Falsificationism** (Leaf E).
  *   **Where it Strains:** Freudian defenders claim the theory explains everything (a strength), but Falsificationists call this a weakness (it predicts nothing). If you land on Leaf E, you must determine if the programme is "progressive" or "degenerating." The tree classifies it, but doesn't solve the hard work of determining *which* it is. If you answer "No" to Node 1 (Pseudo-problem), you might say the distinction between Freud and Neuroscience is just power, not truth.

  \answer{Naive Falsificationism, Sophisticated Falsificationism}
