      *   *The Voynich Point:* This proves statistics $\neq$ meaning. MT uses statistics. So how does MT work? Because it's not just stats of the text; it's stats of text *grounded in human activity* (the training data is the crib).
      *   *The Poetry Point:* This proves there isn't always a "plaintext."
      *   *Verdict:* The analogy breaks at the "Plaintext" stage. In crypto, Plaintext exists independently. In translation (especially poetry/ritual), the "Plaintext" is constructed in the target language.
