  2.  **Deconstruct the Desiderata (The "Requirements"):**
      *   *What makes a historical method valid?* It needs to handle the source material correctly, avoid bias, and define its goal clearly.
      *   *Requirement 1: Epistemic Independence.* The method shouldn't assume the conclusion. (Addresses the "circularity" charge).
