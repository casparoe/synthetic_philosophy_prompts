      *   *Requirement 4: Explanatory Scope.* The method must account for *why* the tradition exists as it does, not just prune it.
      *   *Requirement 5: Falsifiability.* There must be a way for a criterion to fail.
      *   *Requirement 6: Contextual Plausibility.* Jesus must fit in 1st-century Judaism (addresses the "Dissimilarity" problem).

  3.  **Drafting the Desiderata (Iterative refinement):**
      *   *Independence:* Crucial. If the criterion assumes a theological portrait to find the historical figure, it's circular.
      *   *Source Nature:* The Gospels aren't biographies in the modern sense. They are faith documents. A criterion that treats them as neutral transcripts fails.
      *   *Authenticity Definition:* Are we looking for exact quotes? Unlikely. We are looking for historical impact/origin.
      *   *Positive vs. Negative:* Can we say what *is* Jesus, or only what *isn't* the Church? (Critique of Dissimilarity).
      *   *Consistency:* The criteria shouldn't contradict each other (e.g., Dissimilarity vs. Coherence).

  4.  **Categorizing Requirements (Non-negotiable vs. Preferences):**
      *   *Non-negotiable:* Logical consistency, source compatibility, definition of terms, non-circularity.
