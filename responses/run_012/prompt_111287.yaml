  Diagnosis

  The slip lies in premise (7). You assume it is obvious that you do not know you are not a brain in a vat (BIV). However, this intuition is precisely what the Moorean contests. If you genuinely know you have hands (1), and knowledge closes over entailment (5), then you do know you are not a handless BIV. Your argument treats the skeptical intuition in (7) as a fixed datum to test the rule (5), but the Moorean argues that (7) is false precisely because (1) and (5) are true. The feeling that you lack knowledge of ~BIV stems from raising skeptical standards where ordinary standards usually apply. By asserting (7) as undeniable, you beg the question against your friend. You are privileging skeptical uncertainty over perceptual certainty without justification. The error is assuming that because you cannot prove ~BIV independently of your hands, you do not know it via your hands. Knowledge transmits; your inability to isolate the knowledge doesn't negate its existence. Furthermore, you conflate dialectical efficacy with epistemic validity. Moore's proof may fail to persuade a skeptic who denies (1), but that does not mean the inference fails to produce knowledge for you. The slip is treating the skeptic's reluctance as an epistemic fact rather than a contextual shift.

  The bill

  Rejecting (7) costs you the comforting feeling that skepticism is intellectually safe. You must admit that you know the world did not begin five minutes ago and that you are not a disembodied brain. This feels rash; it seems to claim too much based on mere perception. You lose the ability to say, "I know I have hands, but I don't know I'm not a BIV," a position that feels nuanced and humble. Instead, you must embrace a robust Moorean dogmatism. However, the benefits are substantial. You retain premise (1), preserving commonsense realism against idealism and skepticism. You also keep the "ordinary-way rule" (5), safeguarding the principle that deduction extends knowledge. This preserves the utility of logical inference in everyday life; if you know P, and P entails Q, you know Q. Claims (1) through (6) survive intact. You only discard (7) and the conclusion (8). Your friend's proof stands not as a dialectical weapon to silence skeptics, but as a correct description of your actual epistemic state. You pay with humility but purchase consistency. You avoid the radical skepticism of rejecting (1) and the logical fragmentation of rejecting (5). The cost is accepting that knowledge is easier to come by than philosophical reflection often suggests, but the reward is a coherent worldview where hands, logic, and reality align. You must assert that the standards for knowing you have hands are sufficient to rule out global deception. This collapses the contextualist escape route, forcing you to defend high-stakes knowledge claims in low-stakes environments. Yet, this collapse is necessary to maintain the integrity of deduction. It requires trusting perception over hyperbolic doubt.

  Rival diagnoses, priced

  Alternatively, you could reject (5), the closure principle. This is the Dretske-Nozick line. The cost is high: knowledge ceases to be closed under known entailment. You can know you have hands without knowing you aren't a BIV. This saves (7) but breaks logic's role in epistemology. Deduction no longer guarantees knowledge transmission, making mathematical or logical extension of knowledge problematic. You must explain why some entailments transmit knowledge and others do not, a difficult theoretical burden. You must introduce relevant alternatives to block closure, complicating the definition of knowledge. This creates a fragmented epistemology.
  Second, you could reject (1). This is the Skeptic's choice. The cost is total loss of external world knowledge. If you don't know you have hands, you know very little. This saves (5) and (7) but renders life unintelligible. You concede that sensory evidence never justifies belief in physical objects.
  Third, you could reject (3). Perhaps physical objects don't entail mind-independence. This leads to Idealism. The cost is metaphysical revisionism; you must argue hands are mental constructs. This saves (1) and (7) but denies realism.
  Each rival cut saves one intuition but sacrifices a core structural element of epistemology or metaphysics. Rejecting (5) saves skeptical intuition but breaks logic. Rejecting (1) saves logical rigor but loses the world. Rejecting (3) saves knowledge but loses reality. Compared to these, rejecting (7) is the cheapest cost, sacrificing only a skeptical hesitation rather than a structural principle. The closure principle is too fundamental to everyday reasoning to discard lightly, and skepticism is too destructive to accept. Thus, the intuitive resistance in (7) is the weakest link compared to the structural damage of the alternatives.

  Verdict

  Keep (1) and (5). Give up (7). Your friend is right; you are wrong. Moore's proof succeeds in establishing knowledge, even if it fails to silence skeptics. The intuition that you lack knowledge of ~BIV is a contextual illusion, not an epistemic fact. Trust your hands over your philosophical doubts. Embrace the consequence: you know the world is real because you know you have hands. It reminds us where certainty lies. Do not let skeptical hypotheses undermine the evidence of your senses. Knowledge begins with perception, not with the refutation of skepticism. Stick with Moore.
