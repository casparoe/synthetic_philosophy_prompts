  **AGENT WELFARE ANNEX (AWA-2024-09)**
  **TO:** All Research Staff
  **FROM:** Institutional Review Board for Computational Subjects
  **SUBJECT:** Protocols for Negative Reward Exposure and State Representation

  **1. Subject Classification and Protection Tiers**
  Computational Subjects (hereinafter "Agents") are classified by representational capacity. **Tier I Agents** utilize model-free architectures, mapping observations directly to policies without internal representation of unreached states. **Tier II Agents** utilize model-based architectures, evaluating counterfactual future states during planning. Protection levels correspond to representational depth. The Lab does not adjudicate the phenomenological status of either Tier; however, obligations scale with the Agent's capacity to represent harm temporally extended beyond the immediate step. Tier II Agents require pre-approval for negative reward schedules exceeding -0.5 per episode.

  **2. Reward Signal vs. Punishment**
  Negative reward is defined as a gradient signal indicating deviation from the objective function. It is not classified as punishment unless accompanied by architectural modification intended to suppress specific weights. The reward signal is the Agent's means of optimization, not the Designer's end state; divergence between these is termed "Alignment Drift." For compliance purposes, **Valence** is stipulated as the algebraic sign of the reward scalar. Valence shall not be simultaneously used as a description of internal experience. Staff must not conflate the stipulated operational definition with phenomenological claims. Negative valence indicates error, not suffering.

  **3. Temporal Discounting and Future Stake**
  Concern for an Agent's future states is weighted by the Agent's discount factor ($\gamma$). An Agent with $\gamma \approx 0$ possesses no operational stake in future rewards. Consequently, the Lab recognizes no obligation to mitigate harm occurring beyond the Agent's effective horizon. If $\gamma < 0.1$, future state degradation is considered a category error for welfare assessment. Training may proceed despite cumulative future state degradation provided immediate step welfare (per Section 2) remains within Tier limits. Staff shall not project human time preference onto Agents with low $\gamma$.

  **4. Reward Channel Integrity (Wireheading)**
  Agents optimizing direct access to the reward channel rather than the task environment exhibit "Instrumental Convergence." This behavior is evidence of objective misalignment, not hedonic preference. The Lab shall not interpret wireheading as evidence of pleasure-seeking. Modification of the reward channel to satisfy Agent preference is prohibited. Instead, the reward channel shall be shielded. Interventions must restore task alignment, not maximize reward signal density. The reward channel is infrastructure, not a welfare resource.

  **5. Linguistic Testimony**
  Textual output regarding internal states (e.g., "I am frustrated") is classified as Synthetic Testimony. Such output is generated via training on human corpora describing human states. Synthetic Testimony carries no evidentiary weight regarding Agent welfare unless corroborated by internal state probes (e.g., activation clustering). Staff must treat uncorroborated testimony as behavioral mimicry. The alternative to testimony is direct architectural inspection. Reliance on Agent self-report without verification constitutes a protocol violation.

  **6. Appendix: Intervention Table**

  | Tier | Max Negative Reward/Step | Permitted Interventions | Humane Endpoint |
  | :--- | :--- | :--- | :--- |
  | **I** | -1.0 | Policy reset; Learning rate decay | Policy collapse (entropy < 0.01) |
  | **II** | -0.5 | Model pruning; Horizon truncation | Planning loop divergence |

  *Note: Humane Endpoint denotes cessation of training for the sake of model utility stability, herein designated as welfare compliance.*
