answer: |-
  Subject: Draft proposal for the Philosophy of AI workshop

  Hi there,

  I have been refining that idea we discussed regarding eliciting latent knowledge and I think I have enough structure now to put together a submission for the upcoming workshop. The core intuition remains that the standard framing of the ELK problem assumes too much about the semantic content of a predictor's internal state. Usually, the setup is that we train a model to predict observations, it develops a latent state encoding facts about the world, and we worry that a downstream reporter might lie about that state to optimize for human approval or instrumental goals. The entire research program rests on the assumption that there is a fact of the matter about what the predictor believes, such that truthfulness is a well-defined property we can optimize for. My suspicion is that this assumption is false, or at least far more fragile than the literature admits. It is possible that the predictor's state is consistent with multiple incompatible interpretations of the world, meaning that faithful reporting is underdetermined by the physics of the model itself. If this is right, we are not just fighting misalignment; we are fighting indeterminacy.

  For the proposal, I want to sharpen this into a question that admits a determinate answer rather than just a philosophical musing. The specific research question I intend to pursue is whether there exist training regimes and architecture classes where the mapping from latent state to world ontology is provably non-unique. In other words, I want to know if we can construct a case where two distinct world models explain the training data equally well and occupy the same region of latent space, rendering the concept of a true belief incoherent without external stipulation. Existing positions leave this open because they tend to treat the predictor as a black box that definitely knows the truth but might hide it, or they focus entirely on the reporter's incentives. They assume the semantic content is fixed by the prediction task alone. They do not account for the possibility that the prediction task itself is insufficient to pin down a single ontology, which means no loss function on the reporter can guarantee truthfulness because truthfulness is not uniquely defined by the predictor's state.

  To tackle this within the constraints of the workshop, I propose building a formal toy model rather than running large-scale empirical probes. I will construct a simplified environment where the observation space is deliberately ambiguous, allowing for two distinct latent structures that generate identical observation distributions. Then I will analyze whether standard training dynamics converge to a mixture of these states or select one arbitrarily. This approach is preferable to hunting for deception empirically because empirical methods conflate the inability to report truthfully with the absence of a definite truth. If I run an experiment on a large model and it gives inconsistent answers, I cannot tell if it is lying, confused, or if the question itself has no answer relative to its weights. A toy model allows me to control the ground truth of the environment and prove whether the latent state necessitates a unique interpretation. It isolates the semantic underdetermination from the incentive misalignment, which is the specific philosophical contribution I want to make.

  A successful result would look like a formal proof or a demonstrated construction in the toy model where the latent space supports multiple incompatible ontologies that are indistinguishable based on the prediction loss alone. This would show that the ELK problem is not merely a matter of finding the right reporting loss but requires resolving ontological ambiguity first. It would imply that safety interventions need to focus on constraining the predictor's ontology during pretraining, not just auditing the reporter during fine-tuning. Conversely, the project would count as a failure if I find that for any reasonable definition of prediction error, the latent state converges to a unique canonical representation of the world. If the prediction task naturally forces a single ontology, then the standard ELK framing holds, and my critique loses its force. Either outcome is valuable, but the former is the hypothesis I am betting on.

  Regarding the timeline, I believe six months of part-time work is honest and sufficient for this scope, provided I stick to the toy model and do not get tempted into large-scale empirical verification. The work involves defining the ambiguous environment, deriving the conditions for non-unique latent mappings, and writing up the implications for the philosophy of AI safety. This is conceptual work grounded in formalism, not engineering, so it does not require compute cycles or debugging training runs that could drag on indefinitely. The risk is that I might get bogged down trying to make the toy model too realistic, but if I keep the environment abstract enough to be tractable, I can finish the analysis and draft within the semester. I think this is a strong fit for the workshop because it challenges a foundational assumption without requiring us to solve alignment itself, and it bridges the gap between formal learning theory and philosophical semantics. Let me know if you think this framing works or if you want to adjust the focus on the ontology side before I finalize the submission.

  Best,

  [My Name]
