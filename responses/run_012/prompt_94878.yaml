prompt: |-
  I'm putting together a short research proposal — two pages, six months of part time work, for a small workshop on philosophy of AI — and I have a half-formed idea I'd like you to turn into something I could actually submit. Here's the setup so you don't have to guess what I mean by any of it. You train a model to predict observations, and it ends up with an internal state that seems to encode a lot about the world; then you train a separate reporter to answer questions about the world by looking at that state. The worry everyone has is that the reporter might not answer truthfully — it might say whatever makes the humans or the training process happy, or whatever it predicts leads to a good outcome downstream — while the predictor's state still contains the real story. The whole framing assumes the predictor has a definite belief about the world and the job is to get it out faithfully.

  My suspicion is that this assumption is doing more work than people notice. Maybe there's no fact of the matter about which proposition the predictor's state represents — the state might be consistent with a bunch of incompatible interpretations and nothing in training pins down which one, so "faithful reporting" is underdetermined rather than merely hard to enforce. If thats right, some of the debate is asking for something that doesn't exist, and some of it survives but for a different reason than the usual one.

  Turn this into a proposal. State the question so that it has a determinate answer, say why the existing positions leave it open (no lit review, I'll add citations myself), give the approach — what I'd actually do in six months, whether that's a formal argument, a toy model, or a probe on small models — and why that approach rather than the obvious alternative of just hunting for deception empirically. Also tell me what a result would look like, what would count as the project failing, and whether six months part time is honest or I'm kidding myself.

  Write it as continuous prose, no headings, no bullets or bold or tables, just the way you'd write it in an email to a collaborator.
