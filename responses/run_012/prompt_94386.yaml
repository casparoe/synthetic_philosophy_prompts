      *   **SIA (Self-Indication Assumption):** "The bare fact of your existence is evidence that there are more observers rather than fewer." (Associated with Dennis Dieks, Ken Olum, Nick Bostrom later). Counters the Doomsday Argument. Favors hypotheses with more observers.
      *   **The Presumptuous Philosopher:** A thought experiment (by Bostrom) where a philosopher claims the universe is huge just because he exists. SIA says yes (mostly), SSA says no (unless reference class is constrained).
      *   **Carbon Copies (Sleeping Beauty variant/Clone variant):** Heads (1 observer), Tails (100 observers). You are one.
          *   SSA: $P(Heads) = P(Tails) = 0.5$ (usually, depending on reference class). If the reference class includes all potential observers, SSA might shift, but standard SSA often treats the *selection* from the class as the key. Actually, standard SSA + Doomsday logic suggests you should be surprised to be early in a large sequence. In the Carbon Copies case:
              *   SSA: You are a random sample from the reference class. If Heads, class size = 1. If Tails, class size = 100. Probability of being *you* (this specific experience) given Heads is 1/1. Given Tails is 1/100. So $P(Heads|Exist) \propto P(Exist|Heads) * P(Heads) = 1 * 0.5$. $P(Tails|Exist) \propto (1/100) * 0.5$. So SSA favors Heads 100:1.
              *   SIA: Existence is evidence for more observers. $P(Heads|Exist) \propto P(Exist|Heads) * N(Heads) * P(Heads) = 1 * 1 * 0.5$. $P(Tails|Exist) \propto 1 * 100 * 0.5$. So SIA favors Tails 100:1.
          *   Wait, let's double check standard formulations.
          *   **SSA:** $P(h|i) \propto P(i|h) * P(h)$. Where $i$ is indexical evidence "I am this observer". If observers are indistinguishable, $P(i|h)$ is $1/N_h$. So Heads (N=1) -> prob 1. Tails (N=100) -> prob 1/100. Posterior favors Heads.
          *   **SIA:** $P(h|i) \propto P(i|h) * N_h * P(h)$. (Roughly). Or simply, prior is weighted by number of observers. Heads (N=1) -> weight 1. Tails (N=100) -> weight 100. Posterior favors Tails.
          *   **Divergence:** Yes, they diverge radically (100:1 Heads vs 100:1 Tails).
          *   **Reason:** Is it counting or deeper? It's about whether existence itself shifts the prior (SIA) or whether you condition on being a random sample from the actual set (SSA).

