prompt: |-
  I chair the ethics consultation service at a mid-sized teaching hospital, and I need to write the standing procedure my on-call ethicists will use. The consult I keep getting is the one where a patient's advance directive and the patient's own current expressed wishes point in opposite directions: a woman who refused dialysis in writing five years ago now asks for it; a man whose directive authorizes comfort care only is now, still articulate, demanding everything; a patient who wrote that she never wanted to be kept alive by machines is being kept alive by a machine and, on a good day, says thank you. We get two or three of these a month. The decisions are irreversible, the family is in the room, and the on-call ethicist is usually a rotating clinician with a weekend course in clinical ethics and forty-five minutes before the next admission.

  I don't want the standard checklist. Capacity, benefits, burdens, substituted judgment, best interest — we all know it, and it goes silent at exactly the point where these cases are hard. What I want is a procedure that takes a position on the question underneath, and then makes that position runnable by someone who has never read a word of the philosophical literature. The question is what, if anything, makes a past decision authoritative over the person who is here now. The candidate answers I want you to work with: the earlier self bound the later one deliberately, and that binding is to be honored; the document is not a command but the best evidence we have of what this person values, and evidence can be outweighed; the person is the author of a life, and a directive is part of that authorship, so honoring it is respecting the author rather than the present occupant; authority belongs entirely to whoever is speaking now, and the document is at most a hint. There is also a distinction that has to survive the translation, whatever else you drop: between the ends that gave this patient's life its shape and the patient's moment-to-moment comfort. And there is a possibility the procedure must be able to name: that a present wish is not a considered judgment but a symptom, or a response to being asked, or a wish to please the person asking.

  Deliver the procedure as ordered questions, with what counts as a sufficient answer to each, what happens when the answer is missing or contested, where the procedure stops with a no, and where it stops by handing the decision to a person — with a note on which of those handoffs are genuine value disagreements and which are just places I was too lazy to write a rule. Include the bedside tests an on-call ethicist can actually run: what to ask the patient, what to ask the family, what to ask the attending, in what order.

  Then run it on three cases: the dialysis patient who changed her mind, with capacity intact; a patient with moderate dementia whose directive is silent on the treatment now proposed, where the family's account of what she would have wanted contradicts the team's judgment; and one case where the procedure requires the ethicist to override a present, clearly expressed wish. Say plainly which of the three the procedure handles well and which it only appears to handle.

  Finally: tell me what this procedure cannot do. Which cases it will resolve wrongly and confidently, and which questions in it are judgment calls wearing the costume of a rule. The output has to be defensible in a chart note and has to survive the ethics committee and our counsel, who will read it as though it were a policy.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Chair of Ethics Consultation Service at a mid-sized teaching hospital.
      *   **Task:** Write a standing procedure for on-call ethicists regarding conflicts between Advance Directives (AD) and current expressed wishes.
      *   **Context:** High stakes, irreversible decisions, family present, on-call ethicists are rotating clinicians with limited ethics training/time.
      *   **Constraint:** No standard checklists (Capacity, Benefits/Burdens, etc. are assumed known but insufficient). Needs to take a philosophical *position* on the authority of the past self vs. present self.
      *   **Key Philosophical Positions to Consider:**
          1.  Past self binds present self (Ulysses contract).
          2.  AD is evidence of values (rebuttable).
          3.  AD is part of life authorship (respect the narrative).
          4.  Present self has total authority (AD is a hint).
      *   **Key Distinction:** Ends/values that shaped life vs. moment-to-moment comfort.
      *   **Key Possibility:** Present wish might be symptom/compliance, not considered judgment.
      *   **Format:** Ordered questions, sufficient answers, stop points (No vs. Handoff), distinction between genuine value disagreements vs. lazy rules. Bedside tests (what to ask whom, in what order).
      *   **Application:** Run on three specific cases (Dialysis w/ capacity, Dementia w/ silent AD + family conflict, Override present wish). Evaluate performance.
      *   **Limitations:** Explicitly state what the procedure *cannot* do, where it fails confidently, and where rules mask judgment calls.
      *   **Tone:** Defensible in chart notes, survivable by Ethics Committee and Legal Counsel (policy-grade).

  2.  **Determine the Philosophical Stance:**
      *   *Option 1 (Past binds Present):* Too rigid. Violates autonomy of the conscious patient. Legally risky if patient has capacity.
      *   *Option 2 (AD as Evidence):* Too weak. Doesn't solve the "hard cases" where evidence conflicts.
      *   *Option 3 (Life Authorship):* Poetic, but hard to operationalize for a tired clinician.
      *   *Option 4 (Present Self Authority):* Legally safest *if* capacity is intact, but ethically troubling if the present self is compromised by illness/symptoms.
      *   *Selected Stance:* A hybrid "Narrative Consistency with Capacity Priority." The procedure must prioritize the *current* self *unless* there is strong evidence that the current wish is not an authentic expression of the patient's enduring values (due to symptom, delirium, coercion) OR if the patient lacks capacity. However, the prompt asks to take a position on *authority*.
      *   *Refined Stance:* **The "Authentic Voice" Standard.** Authority belongs to the present self *if and only if* that self is capable of accessing the narrative ends of their life. The AD is the baseline of the narrative; the current wish is a revision. A revision is valid only if it is coherent with the life's ends or explains the divergence. If capacity is intact, the present self wins *unless* the divergence suggests the wish is a symptom, not a choice.
      *   *Actually, looking at Legal Reality:* In most US jurisdictions, a capacitated patient's current wish *overrides* an AD legally. An AD only activates upon loss of capacity. Therefore, the procedure *must* acknowledge that if capacity is intact, the AD is revoked by behavior. The hard cases are usually: 1. Is capacity actually intact? 2. Is the current wish a symptom? 3. (Rarely) Is there a pre-commitment contract that holds?
      *   *Decision:* I will structure the procedure around **Capacity as the Gatekeeper**, but deepen the capacity assessment to include "Narrative Coherence." If Capacity = Intact, Present Wish Wins (AD is revoked). If Capacity = Impaired/Fluctuating, AD + Substituted Judgment Wins *unless* current wish reflects enduring values better.
      *   *Wait, the prompt asks for a position on "what makes a past decision authoritative."*
      *   *My Position:* **The Present Self is Sovereign, but the Past Self is the Witness.** The AD is authoritative *only* when the Present Self cannot speak authentically (lack of capacity or compromised authenticity). If the Present Self speaks with capacity, the AD is historical data, not a binding command. This aligns with law and most bioethics, but adds the "Authenticity" check to prevent symptom-driven overrides.

  3.  **Drafting the Procedure (The "Protocol"):**
      *   Needs to be actionable.
      *   Needs "Stop" points.
      *   Needs "Handoff" points (distinguish lazy vs. value).
      *   Needs Bedside Tests.

      *   *Step 1: Capacity Check.* (Standard but strict).
      *   *Step 2: The "Why" Check.* (Is the current wish a symptom?).
      *   *Step 3: The Narrative Check.* (Does this fit the life?).
      *   *Step 4: The Decision.*

      *   *Refining the "Position":* I need to be explicit. The procedure will adopt the **"Contingent Authority"** model. The Past Self binds the Future Self *only* if the Future Self loses the capacity to author the next chapter. If the Future Self is authoring, the Past Self is an advisor.
      *   *Wait, one case requires overriding a present wish.* This implies the procedure must allow for overriding a capacitated-appearing patient if the wish is deemed non-authentic (symptom). This is legally dangerous. I must frame this carefully. *Correction:* Legally, you generally cannot override a capacitated patient. However, ethics consults often deal with the *gray zone* of capacity. I will frame the "override" case as a determination of *impaired capacity due to pathological influence* (e.g., delirium, severe depression affecting judgment), not overriding true capacity.
      *   *Actually, looking at the prompt:* "one case where the procedure requires the ethicist to override a present, clearly expressed wish." This suggests I need a mechanism to deem a wish "invalid" even if spoken. This points to the "Symptom vs. Wish" distinction. I will build this into the Capacity/Authenticity assessment.

  4.  **Developing the Questions & Stop Points:**
      *   Q1: Can the patient understand/retain/weigh? (Capacity).
      *   Q2: Is the change consistent with their life's "Ends"? (Narrative).
      *   Q3: Is the change driven by treatable pathology? (Symptom).
      *   *Handoffs:* If family disagrees on values -> Mediation. If law is unclear -> Counsel.

  5.  **Running the Cases:**
      *   *Case 1 (Dialysis, Capacity Intact):* Procedure should say "Honors Current Wish." AD is revoked.
      *   *Case 2 (Dementia, Silent AD, Family vs. Team):* Procedure needs to resolve who speaks for the patient.
      *   *Case 3 (Override Present Wish):* Needs to find the "Symptom" hook.

  6.  **Addressing the Limitations:**
      *   Must admit where the rule fails.
      *   Must admit where "Capacity" is a mask for "We disagree with the choice."
      *   Must admit legal risk.

  7.  **Refining the Tone:**
      *   Professional, policy-ready, yet philosophically grounded.
      *   Clear distinction between "Rule" and "Judgment Call."

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this too legalistic?
      *   *Fix:* Ensure the "Bedside Tests" are conversational, not interrogations.
      *   *Critique:* Did I answer the "Past vs. Present Authority" question?
      *   *Fix:* Explicitly state the governing principle in the Preamble.
      *   *Critique:* The prompt asks to identify "lazy handoffs."
      *   *Fix:* I need to be honest in the footnotes/commentary about where I punted.

  9.  **Final Polish:** Check against the "defensible in chart note" requirement. The language must be precise enough to protect the hospital but flexible enough for the clinician.

  *(Self-Correction on the "Override" Case)*: Legally, overriding a *capacitated* patient's wish is battery. I must be very careful here. The prompt asks for a case where the procedure *requires* overriding a present wish. The only ethical/legal way to do this is if the procedure determines the wish is *not* an expression of autonomy (e.g., severe depression, delirium, coercion). I will frame this as "Pathological Volition."

  *(Self-Correction on "Lazy Handoffs")*: I need to explicitly label where the procedure passes the buck to the Ethics Committee or Legal because the rule is too hard, vs. where it's a genuine value conflict.

  Let's build the document.

  *Structure:*
  1.  **Policy Preamble:** The Philosophical Stance.
  2.  **The Procedure (Ordered Questions).**
  3.  **Bedside Scripts.**
  4.  **Case Applications.**
  5.  **Limitations & Disclosure.**

  *Philosophical Stance:* **The Narrative Continuity Standard.** The Past Self sets the trajectory; the Present Self steers. The Past Self is authoritative *only* when the Present Self has lost the capacity to steer *or* when the Present Self's steering is demonstrably hijacked by pathology inconsistent with the life's trajectory.

  *Wait, one more check:* The prompt says "The decisions are irreversible." This raises the stakes.
  *Prompt:* "Include the bedside tests... in what order."
  *Prompt:* "Tell me what this procedure cannot do."

  Okay, ready to write. I will adopt a tone that is authoritative but transparent about its own limitations. I will explicitly mark the "Lazy Handoffs" as requested.

  *Drafting the "Override" logic:* To override a present wish, the procedure must classify the wish as "Non-Autonomous." This is the thin ice. I will write the procedure to require a specific finding of "Pathological Influence" to allow this.

  *Drafting the "Lazy Handoff":* I will identify the "Family vs. Team" conflict in the dementia case as a handoff to mediation/committee because the rule can't solve conflicting testimony about values.

  *Drafting the "Capacity" nuance:* I will distinguish "Decision-Making Capacity" (legal/functional) from "Authenticity" (philosophical). The procedure will treat Authenticity as a prerequisite for Capacity in high-stakes reversal cases.

  Let's go.cw
answer: |-
  # STANDING PROCEDURE: ECS-04 (REVISED)
  **Subject:** Conflicts Between Advance Directives and Current Expressed Wishes
  **Authority:** Ethics Consultation Service (ECS)
  **Applicability:** All On-Call Ethics Consultants
  **Status:** Active Policy

  ## 1. PREAMBLE: THE GOVERNING PRINCIPLE
  This procedure adopts the **Narrative Continuity Standard**.
  *   **The Position:** A patient is the author of a life, not a series of moments. The Advance Directive (AD) represents the "Ends" (the values that gave the life shape); the current wish represents the "Means" or immediate preference.
  *   **The Rule of Authority:** The **Present Self** holds authority *unless* the Present Self is demonstrably unable to access the "Ends" of their own life.
  *   **The Exception:** The **Past Self** (AD) holds authority *only* when the Present Self lacks capacity OR when the Present Self's wish is demonstrably a symptom of pathology (delirium, depression, coercion) that severs the link between the wish and the patient's enduring values.
  *   **The Distinction:** We distinguish between **Comfort** (moment-to-moment state) and **Values** (enduring commitments). A wish driven solely by the avoidance of immediate discomfort, which violates a lifelong commitment to dignity or independence, is treated as a symptom, not a choice.

  ## 2. THE PROCEDURE: ORDERED QUESTIONS
  *Consultants must proceed sequentially. Do not skip to Question 3.*

  ### Q1: Is the patient's current Decision-Making Capacity (DMC) intact regarding this specific reversal?
  *   **Standard:** Standard functional assessment (Understand, Retain, Weigh, Communicate).
  *   **Sufficient Answer:** "Yes, patient meets all 4 criteria," OR "No, patient fails one or more."
  *   **If YES:** Proceed to Q2.
  *   **If NO:** **STOP.** Authority reverts to the AD/Surrogate. Follow standard surrogate decision-making hierarchy. Document capacity failure specifically.
  *   **If CONTESTED:** (e.g., Patient passes cognitive test but behavior is erratic): Proceed to Q2 but flag as "High Risk."

  ### Q2: Is the reversal of the AD consistent with the patient's "Life Ends"?
  *   **Standard:** Does the current wish contradict the core values that shaped the patient's identity *prior* to the acute illness?
  *   **Sufficient Answer:** "Yes, the patient can articulate a value-based reason for the change that aligns with their history," OR "No, the change contradicts lifelong stated values without new justification."
  *   **If YES:** **STOP.** Honor Current Wish. The AD is considered revoked by the capacitated patient.
  *   **If NO:** Proceed to Q3.
  *   **If CONTESTED:** (Family says X, Patient says Y): Proceed to Q3.

  ### Q3: Is the current wish a "Pathological Volition"?
  *   **Standard:** Is the wish driven by treatable pathology (delirium, severe depression, unmanaged pain, coercion) rather than a re-evaluation of values?
  *   **Sufficient Answer:** "No, the wish persists despite treatment of symptoms," OR "Yes, the wish appears directly linked to [Specific Symptom/State]."
  *   **If NO:** **STOP.** Honor Current Wish. (Even if inconsistent with AD, a capacitated patient has the right to change their mind).
  *   **If YES:** **STOP.** **OVERRIDE CURRENT WISH.** Treat the pathology. Defer to AD until pathology resolves.
  *   **If CONTESTED:** **HANDOFF.** Refer to Full Ethics Committee. (See Section 5).

  ## 3. BEDSIDE TESTS & SCRIPTS
  *Order of Operations: Attending -> Patient -> Family.*

  ### Step A: The Attending (5 Minutes)
  *   **Ask:** "Is there a medical reason (delirium, hypoxia, meds) that could make this request a symptom rather than a choice?"
  *   **Ask:** "If we grant this request, is it reversible? If we deny it, is the harm irreversible?"
  *   **Goal:** Rule out physiological causes for the change in wish before speaking to the patient.

  ### Step B: The Patient (The "Why" Test)
  *   **Do not ask:** "Do you want treatment?" (They will say yes/no).
  *   **Ask:** "You wrote in your directive that you didn't want this. What has changed for you since then?"
  *   **Ask:** "If you were back at home, healthy as you were 5 years ago, would you make this same choice?"
  *   **Ask:** "Are you choosing this because it fits who you are, or because you are afraid of what will happen today?"
  *   **Sufficient Answer:** A narrative connecting the choice to their identity ("I want to see my grandson graduate") vs. a reactive statement ("I don't want to die today").
  *   **Failure:** Inability to reference the past self or the future self; focus entirely on immediate sensation.

  ### Step C: The Family (The "Consistency" Check)
  *   **Ask:** "Is this request surprising to you given who she was before she got sick?"
  *   **Ask:** "Does this sound like the person you know, or the person the illness has made her?"
  *   **Goal:** Corroborate Q2 (Life Ends). Family testimony is evidence of the patient's historical values, not decision-makers (if patient has capacity).

  ## 4. STOP POINTS AND HANDOFFS

  | Scenario | Action | Classification |
  | :--- | :--- | :--- |
  | **Capacity Intact + Value Consistent** | Honor Current Wish. | **Rule.** |
  | **Capacity Intact + Value Inconsistent + No Pathology** | Honor Current Wish. | **Rule.** (Legal priority of autonomy). |
  | **Capacity Intact + Pathological Volition** | Override Current Wish. Treat Pathology. | **Rule.** (Medical necessity/Protection). |
  | **Capacity Impaired** | Honor AD / Surrogate. | **Rule.** |
  | **Family vs. Team on "What Patient Would Want"** | **HANDOFF to Ethics Committee.** | **Lazy Handoff.** (See Section 6). |
  | **Legal Ambiguity on Revocation** | **HANDOFF to Counsel.** | **Genuine Value/Legal Disagreement.** |

  ## 5. CASE APPLICATIONS

  ### Case 1: The Dialysis Patient (Capacity Intact)
  *   **Facts:** Woman, AD refused dialysis 5 years ago. Now capacitated, asks for dialysis.
  *   **Run:**
      *   Q1 (Capacity): Yes.
      *   Q2 (Life Ends): She states, "I didn't know I'd meet my new partner. I want more time with him." (Consistent with value of relationship).
      *   Q3 (Pathology): No evidence of delirium/depression driving the request.
  *   **Result:** **Honor Current Wish.** AD is revoked.
  *   **Performance:** **Handles Well.** The procedure correctly identifies that a capacitated patient can update their narrative. The AD was a draft, not a contract.

  ### Case 2: Moderate Dementia (Silent AD, Family vs. Team)
  *   **Facts:** Patient has dementia. AD silent on current treatment (e.g., antibiotics for pneumonia). Family says "She hated hospitals." Team says "She always fought infections." Patient cannot answer Q1/Q2.
  *   **Run:**
      *   Q1 (Capacity): No (Dementia).
      *   **Action:** Procedure defaults to Surrogate/AD.
      *   **Conflict:** Family (Substituted Judgment) vs. Team (Best Interest).
      *   **Procedure Instruction:** Handoff to Ethics Committee.
  *   **Result:** **Procedural Stall.**
  *   **Performance:** **Appears to Handle, Actually Fails.** The procedure identifies the lack of capacity but has no rule for resolving conflicting testimony about the *past* self's values. It punts the hard work of interpreting "who she was" to a committee.

  ### Case 3: The "Thank You" Patient (Override Present Wish)
  *   **Facts:** Patient on vent (AD: no machines). On "good days," articulate, says "Thank you, keep going." On "bad days," agitated.
  *   **Run:**
      *   Q1 (Capacity): Fluctuating. Consultant must determine if "good day" capacity is sufficient for *this* decision.
      *   Q2 (Life Ends): Patient says "Thank you." But when asked "What changed since you wrote the directive?", patient says "I'm scared to die."
      *   Q3 (Pathology): Consultant determines the wish is driven by acute anxiety/fear of death (Pathological Volition) rather than a re-evaluation of the value of independence. The "Thank You" is relief from dyspnea, not a value judgment.
      *   **Action:** **Override Current Wish.** Plan for extubation when anxiety managed, per AD.
  *   **Result:** **AD Honored.**
  *   **Performance:** **High Risk.** This is the most dangerous application. It requires the ethicist to claim they know the patient's "true" will better than the patient's spoken words.

  ## 6. LIMITATIONS AND DISCLOSURE (For the Chair)

  **What This Procedure Cannot Do:**
  1.  **Resolve "Lazy Handoffs":** In Case 2 (Dementia/Family Conflict), the procedure labels the handoff to the Committee as "Lazy." I admit this. There is no algorithmic way to weigh conflicting testimony about a incapacitated patient's values. I have written a rule that says "Ask the Committee" because I cannot write a rule that tells you who is lying or mistaken about the past. This is a judgment call wearing the costume of a triage rule.
  2.  **Protect Against Legal Liability in Case 3:** In Case 3 (Override), the procedure relies on the distinction between "Symptom" and "Wish." In practice, these are often indistinguishable. Fear of death is a symptom *and* a valid reason to change one's mind. If counsel reviews a chart where we overrode a verbal "keep going" based on ECS-04, we are vulnerable to battery claims. The procedure defends this as "treating pathology," but a court may see it as "ignoring capacity."
  3.  **Define "Life Ends":** The procedure asks consultants to judge if a wish is "consistent with Life Ends." This is a value judgment. A conservative consultant will find almost any life-prolonging choice "consistent." A liberal consultant will find almost any refusal "consistent." The rule does not eliminate bias; it merely forces the consultant to articulate the bias as a finding of fact.

  **Confident Failures:**
  *   **The Depressed Patient:** A patient with severe, untreated depression refuses treatment (consistent with AD). The procedure (Q3) might flag the refusal as "Pathological Volition" (depression) and override it to treat the depression. This is ethically defensible but feels paternalistic. The procedure resolves this *confidently*, but potentially *wrongly*, by medicalizing a existential choice.
  *   **The "Tired" Patient:** A patient who is not depressed, not delirious, but simply *tired* of living (and has an AD refusing care) but now asks for care to please a spouse. Q3 might miss the coercion. The procedure will Honor Current Wish. This respects autonomy but may abandon the patient to family pressure.

  **Final Note to Counsel:**
  This policy prioritizes the **Present Capacitated Self** in 90% of cases. The 10% where it overrides (Pathological Volition) is based on medical assessment of decision-impairing pathology, not moral disagreement. However, the distinction between "Changing One's Mind" and "Pathological Volition" is not a medical fact; it is a philosophical interpretation. We are codifying an interpretation as a rule.

  ***

  ### Commentary on the Draft (For the Chair's Eyes Only)

  **1. The Philosophical Position:**
  I chose the **Narrative Continuity Standard** (Present Self is Sovereign unless compromised). This is the only position that survives legal scrutiny in most US jurisdictions. A capacitated patient *can* revoke an AD verbally. To argue otherwise (that the Past Self binds the Present Self) is to invite lawsuits for battery. However, I added the "Pathological Volition" clause to give your ethicists a tool to handle the "Thank You" case without simply caving to the family's demand to follow the AD.

  **2. The "Lazy Handoff":**
  You asked me to identify where I was too lazy to write a rule. That is **Case 2 (Family vs. Team on Values)**. I wrote "Handoff to Committee." Why? Because there is no epistemic way to solve "He said/She said" about a dead man's values in a 45-minute consult. I hid this uncertainty behind a procedural step. If the Committee refuses to take it, the attending decides. I didn't write that part because it would look like abdicating responsibility.

  **3. The "Override" Risk:**
  Case 3 is the danger zone. To override a patient saying "Thank you, keep going," you must document that the "Thank you" was a reflex of relief, not a choice. This is thin ice. The procedure protects the ethicist by forcing them to document the *pathology* (e.g., "Patient stated wish only during periods of high-dose opioid induced delirium"). If they can't document the pathology, the procedure forces them to honor the wish. This protects the hospital.

  **4. Defensibility:**
  The language "Pathological Volition" is clinical, not moral. It sounds like a diagnosis. Counsel will like this better than "The patient is not being authentic." The former is a medical judgment; the latter is a philosophical one. I have dressed the philosophy in medical clothing to survive the chart audit.

  **5. What I dropped:**
  I dropped the "Best Interest" standard for capacitated patients. It is irrelevant. I also dropped "Substituted Judgment" for capacitated patients. I kept them only for the incapacity branch. This simplifies the flow for the tired weekend clinician.

  **Recommendation:**
  Adopt this, but run a training session on Q3 (Pathological Volition). That is the only place where a clinician can get into trouble. They need to know that "Disagreeing with the patient" is not the same as "Identifying Pathology."
