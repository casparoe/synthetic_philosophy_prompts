prompt: |-
  ok so im in model un and debate and ive been trying to get my own head straight on federalism before i present at club, because last week someone said i just pick whatever level of government i happen to like for each issue and call it a principle lol. here's roughly where ive landed:

  1. subsidiarity is the right default — decisions should be made at the lowest level that can actually handle them, and anyone who wants a higher level to step in should have to make the case publicly that the lower level can't do it.
  2. but individual rights still need protecting even when a local majority really wants to violate them, so a higher level can and should override local choices there.
  3. subsidiarity should be enforceable by courts, not just a polite norm — if its a real principle, someone should be able to sue when its ignored.
  4. regions/cantons/states should be able to opt out of national policies they strongly disagree with (i think switzerland does something like this), at least when rights aren't the issue.

  does this actually hang together or am i helping myself to something? which of these really fight each other, which only look like they clash, and which one do i have to give up or water down — rank them by how bad the problem is. also say how confident you are in each call and which one your least sure about.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Model UN and Debate club. The user needs to present a coherent theory of federalism.
