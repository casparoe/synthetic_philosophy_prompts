  8.  **Final Polish:** Check the rhythm. Ensure interruptions feel natural. Make sure the philosophical jargon is accurate (normativity, counterfactuals, idealization, quus/schmadd).

  *(Self-Correction during drafting)*: Make sure Elena doesn't just say "Kripke says." She needs to use the Priya case specifically. Make sure Marcus doesn't just say " dispositionalism works." He needs to struggle with the counterfactual grounding.

