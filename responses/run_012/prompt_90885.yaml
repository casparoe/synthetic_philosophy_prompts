      *   **Scenario:** Priya encounters a sum > 999,999 (e.g., 1,000,004). She will write 1,000,004. Both interlocutors know this.
      *   **Key Tension:**
          *   Sceptic: Her writing 1,000,004 is just a disposition, not what the rule *requires*. She might be slipping from schmadd.
          *   Dispositionalist: What *are* her dispositions? Manifest only? Or counterfactuals? If counterfactuals, aren't they rule-governed (circular)?
          *   Sceptic: What work does "schmadd" do if she never encounters the case?
          *   Escalation: Move the limit to $10^{30}$ (never encounterable). Is the sceptical worry genuine or vacuous?
      *   **Characters:** Two clever people, know the literature, like each other, been at this for hours.
