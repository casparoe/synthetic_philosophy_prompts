answer: |-
  **Elena:** Look, I'm not denying she'll write 1,000,004. We both know Priya. She's competent. But you're conflating *prediction* with *justification*. When she writes 1,000,004, she thinks she's following the rule she always had. I'm saying there is no fact about her past that makes 'plus' the rule rather than 'schmadd'.

  **Marcus:** But the disposition *is* the fact. It's not a ghostly fact; it's neural wiring. She's been trained to carry the one. Her brain is set up to output sums. If you put 500,000 and 500,004 in front of her, her cognitive machinery fires in a way that produces 1,000,004. Schmadd requires her to output 12. She won't. Her disposition rules out schmadd.

  **Elena:** How do you know she won't? You're talking about counterfactuals. "She *would* say 1,000,004." But she's never faced this case. Her past behaviour is compatible with both functions. You're saying her disposition extends to cases she hasn't encountered. Where is that extension stored?

  **Marcus:** It's not stored as a list. It's stored as an algorithm. She learned a procedure.

  **Elena:** [Leans forward] There it is. "Procedure." You've smuggled the rule back in. If the disposition is just "she does what she was trained to do," I ask: what was the training? It was finite. It covered numbers under the limit. To say the disposition covers the new case is to say the disposition *interprets* the training as 'plus' rather than 'schmadd'. You're using the meaning to explain the disposition, not the disposition to explain the meaning. It's circular.

  **Marcus:** [Rubbing his eyes] Okay, fine. Not the actual training. The *idealized* disposition. What she would say if her memory didn't fail, if she wasn't tired...

  **Elena:** Idealization conditions! Marcus, please. Who sets the ideals? You say "if she wasn't tired." But what if 'schmadd' is the rule for when she's tired, and 'plus' is for when she's fresh? No, worse: what if the ideal condition *is* defined as "the condition where she says 1,000,004"? Then you've defined meaning as "what she means," which is useless. You need the disposition to fix the meaning, not the meaning to fix the disposition.

  **Marcus:** [Sighs] Alright. That hit. The simple dispositional account struggles with the normativity. It tells us what she *will* do, not what she *should*. If she writes 12, she's making a mistake. If dispositions are just facts, mistakes are just deviations. But a mistake is a violation. So, I concede: bare dispositions don't capture the 'ought'.

  **Elena:** Thank you. So Priya writing 1,000,004 is just a event in nature. Like a leaf falling. There's no right or wrong about it until we impose a rule from the outside.

  **Marcus:** But wait. Don't rush the burial. Even if bare dispositions fail, look at the Priya case specifically. You've set the limit at 999,999. She crosses it tomorrow. She writes 1,000,004. We laugh at schmadd. Why? Because schmadd is gerrymandered. It's ad hoc. 'Plus' is simple.

  **Elena:** Simplicity is pragmatic, not metaphysical. Nature doesn't care about simplicity.

  **Marcus:** But *we* do. Meaning is human. Look, let's push your example. Make it nastier. Don't put the limit at 999,999. Put it at $10^{30}$.

  **Elena:** Go on.

  **Marcus:** Priya will never encounter a sum that big. Not in this universe. There aren't enough particles to write the numbers down. So 'plus' and 'schmadd' are empirically indistinguishable forever. No test can ever separate them. Now, is there a fact of the matter about which she means?

  **Elena:** Exactly. That's the sceptical punchline. If there's no difference in use, now or ever, the distinction is empty.

  **Marcus:** No, I think you're missing the shift. If the limit is $10^{30}$, your sceptical worry stops being about *error* and starts being about *ontology*. You're asking for a fact that transcends all possible use. But why do we need that? If Priya functions perfectly within her form of life, if the accounting balances, what work is "schmadd" doing?

  **Elena:** It's doing the work of showing that meaning isn't inside her head. It shows that no internal state fixes application beyond the cases actually used.

  **Marcus:** But that's only a problem if you think meaning has to be a *truth condition* that exists independently of our practices. If I shift ground—look, I'm shifting ground here—if meaning is just the role a word plays in the community, then schmadd is irrelevant. Priya means plus because we hold her accountable to plus. If she wrote 12, we'd correct her.

  **Elena:** [Pauses] So you're abandoning the dispositionalist realism? You're going quietist?

  **Marcus:** I'm saying the dispositionalist was trying to ground meaning in the individual's psychology, and you've correctly shown that psychology is finite and open to multiple interpretations. But the sceptic assumes that because the individual can't ground it, nothing can. I'm saying the *community* grounds it. The "ought" comes from the correction, not the neuron.

  **Elena:** That's a retreat. Kripke's Wittgenstein says the community solution fails too. Who grounds the community? If the community says "12", is that right?

  **Marcus:** No, not who grounds them. It's that there is no deeper ground. You want a fact that makes 'plus' correct. I'm saying the practice *is* the fact. In the $10^{30}$ case, the distinction between plus and schmadd isn't genuine because it has no cash value in the practice. It's a wheel that turns nothing.

  **Elena:** But that leaves the normativity hanging. If practice is all there is, then if the community goes mad and starts writing 12, plus *becomes* schmadd. Truth becomes consensus.

  **Marcus:** [Leans back] Maybe. Or maybe truth isn't what you think it is. Look, in the 999,999 case, you were right: my dispositionalism couldn't explain why she *should* write 1,000,004. It only explained why she *would*. But in the $10^{30}$ case, your scepticism loses its bite. You're worrying about a distinction that makes no difference.

  **Elena:** It makes a difference to the philosopher! It shows that meaning is ungrounded. That's terrifying.

  **Marcus:** Is it? Or is it just liberating? Priya doesn't care. She writes 1,000,004. We accept it. The rule isn't a rail extending to infinity; it's the track we lay as we walk. You're demanding to see the rail before we walk.

  **Elena:** I'm demanding to know why we think we're walking on rails at all. If it's just track-laying, anything goes.

  **Marcus:** Not anything. We trip. We correct. That's the normativity. It's not metaphysical; it's social. So, I concede: Priya's brain doesn't contain 'plus'. But Priya-and-her-colleagues do.

  **Elena:** [Smiles faintly] You've moved from dispositionalism to communitarianism. You've sacrificed the individual to save the meaning.

  **Marcus:** I've sacrificed the picture of meaning as a ghostly entity to save the practice of accounting. You win on the metaphysics; I win on the practice.

  **Elena:** But the sceptical paradox remains for the individual. Priya, in isolation, is a blank slate.

  **Marcus:** But Priya is never in isolation. And if she were, she wouldn't be doing accounting. She'd be pushing pebbles. And then plus and schmadd would both be meaningless. So the worry dissolves when the context returns.

  **Elena:** [Taps her pen] You've sidestepped the hard case. The solitary thinker. Does she mean anything?

  **Marcus:** I think... I think if she's truly solitary, the question "what does she mean?" loses its grip. But that's not a failure of meaning. It's a failure of the question.

  **Elena:** So you're saying Kripke's Wittgenstein is right about the scepticism but wrong about the scepticism being a problem?

  **Marcus:** I'm saying it's a problem only if you want meaning to be something it isn't. Like asking what the color of jealousy weighs.

  **Elena:** [Laughs] Alright. You've talked yourself into a corner where meaning exists but isn't about anything.

  **Marcus:** It's about use.

  **Elena:** It's about nothing *fixed*.

  **Marcus:** Same thing, eventually.

  **Elena:** [Stands up] I'm not conceding that. The vertigo is real. But I'll grant you: Priya gets paid either way.

  **Marcus:** And the tax man doesn't care about schmadd.

  **Elena:** No. But I still think you're wrong about the $10^{30}$ case. The distinction exists even if unused. It's the shadow of the rule.

  **Marcus:** Then it's a shadow that casts no darkness. Come on, I'm buying coffee. You need to sleep.

  **Elena:** I need to think. But yes. Coffee.
