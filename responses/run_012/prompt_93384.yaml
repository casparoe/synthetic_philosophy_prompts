      *   *Key Insight:* The strongest defeater is *Causal Scrubbing*. If you can't find a circuit that uses the info, it's not knowledge, it's noise.

  10. (Final Review against prompt): Did I answer "What should I do differently?" sharply? Yes, need to emphasize the shift from output eval to latent eval. Did I address the "In principle" falsifiability? Yes, that's a key philosophical weakness.

  *(Self-Correction during drafting)*: I need to be careful not to say "The view is wrong." The prompt asks to stress-test it. I must present the conditions under which it *would* be wrong.
  Also, the "Identical Behavior" case is tricky. If the weights are different but functionally identical, does the info exist? If the gradient descent path was different, the *trajectory* of the truth might be different. I need to clarify that "separable" means "internally distinguishable," not just "different weights."

  Let's structure the response clearly with headings matching the user's queries.

  *   **Defeaters:** Causal, Information-Theoretic, Structural.
  *   **Tests:** Robustness (CCS), Usage (Counterfactuals).
  *   **Thought Experiment:** Isomorphism vs. Separability.
  *   **Falsifiability:** The "God's Eye View" problem.
  *   **Action:** ELK-focused workflow.

