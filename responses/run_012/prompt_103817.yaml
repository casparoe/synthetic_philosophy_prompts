answer: |-
  ### Part 1: The Logical Space

  Before handing out the quiz, it helps to understand *why* these questions split your group. We aren't sorting by tribe; we are sorting by four underlying commitments. Every position in your discussion is a specific combination of answers to these four questions:

  1.  **The Symmetry Question:** Is happiness just as valuable as suffering is disvaluable? Or does suffering carry extra moral weight (or exclusive weight)?
  2.  **The Aggregation Question:** Can many small benefits add up to outweigh one massive harm? Or are some harms "lexical" (too big to be traded)?
  3.  **The Identity Question:** Do we owe duties to people who *might* exist in the future? Or only to those who will exist regardless of our choices?
  4.  **The Constraint Question:** Are there actions we simply cannot take (rights violations, intentional cruelty), even if they produce the best overall outcome?

  **Mapping the Positions:**
  *   **Total Utilitarianism:** Symmetry (Yes), Aggregation (Yes), Identity (Future people count), Constraints (No).
  *   **Suffering-Focused Negative Consequentialism:** Symmetry (No, suffering dominates), Aggregation (Yes, suffering adds up), Identity (Future people count), Constraints (No).
  *   **Prioritarianism:** Symmetry (Yes, but weighted), Aggregation (Limited), Identity (Future people count), Constraints (No).
  *   **Person-Affecting View:** Symmetry (Varies), Aggregation (Varies), Identity (Only actual people), Constraints (Varies).
  *   **Rights/Deontology:** Symmetry (Irrelevant), Aggregation (No), Identity (Actual people), Constraints (Yes).

  ***

  ### Part 2: The Quiz

  **Instructions:** Read each scenario and choose the option that best matches your gut reaction. Don't overthink the philosophy; pick what feels *right* to you.

  **1. The Quiet Exit (Case: Extinction vs. S-Risk)**
  Humanity is developing a technology that will allow us to spread life across the galaxy. However, there is a 5% chance the technology malfunctions, creating a vast, permanent civilization dedicated solely to producing intense suffering for billions of beings. The only way to prevent this risk is to ensure humanity goes extinct peacefully now.
  *   **A.** We must proceed. The 95% chance of a glorious future outweighs the 5% risk, and extinction guarantees zero future happiness.
  *   **B.** We must not proceed. The potential suffering is so catastrophic that it outweighs the potential happiness, even if the risk is small.
  *   **C.** It depends on whether the beings in the risk scenario are "us" or our descendants. If they aren't people who would exist anyway, the risk matters less.

  **2. The Boredom Engine (Case: Unintended Mild Suffering)**
  A new energy source powers a city forever. As a side effect, it emits a frequency that makes a million nearby residents feel chronically anxious and mildly depressed. No one intended this, and the energy saves thousands of lives elsewhere.
  *   **A.** This is a tragedy that must be fixed. The total amount of unhappiness matters, regardless of intent.
  *   **B.** This is unfortunate, but acceptable. The net benefit (lives saved) justifies the side effect.
  *   **C.** This is acceptable primarily because no one *meant* to hurt them. If it were intentional, it would be wrong.

  **3. The Cruel Architect (Case: Deliberate Mild Suffering)**
  Same scenario as above, but now we learn the engineer designed the frequency specifically because they enjoy knowing people are anxious. The energy still saves thousands of lives.
  *   **A.** It makes no difference morally. The outcome (anxiety vs. lives saved) is identical to the previous case.
  *   **B.** This is much worse. The intent to harm makes the action wrong, even if the outcome is net positive.
  *   **C.** This is worse, but if the lives saved are numerous enough, we might still have to allow it, though we should punish the engineer.

  **4. The Agony Trade (Case: One Agony vs. Million Mild)**
  You can press a button that gives one person a lifetime of torture. If you don't, a million people will each lose a tiny amount of pleasure (like missing out on a good cup of coffee). You cannot compensate the tortured person.
  *   **A.** Do not press. No amount of mild pleasure adds up to justify a lifetime of torture.
  *   **B.** Press it. A million small benefits sum to a greater total good than one person's suffering.
  *   **C.** Do not press, but not because torture is absolute. It's just that the million coffees don't weigh heavily enough compared to the torture.

  **5. The Unequal Utopia (Case: Distribution)**
  *World A:* 10 billion people live at +9 happiness. 1 billion people live at +1 happiness.
  *World B:* 11 billion people live at +5 happiness. No one is at +1.
  *   **A.** World A is better. The total amount of happiness is higher.
  *   **B.** World B is better. It is more important to help the worst-off than to maximize the total sum.
  *   **C.** World A is better, provided the +1 people are still living lives worth living.

  **6. The Happy Stranger (Case: Creating Happy Lives)**
  You have the power to create a new person who will have a wonderfully happy life. They will not affect anyone else. If you choose not to create them, no one exists who is deprived of this life.
  *   **A.** You should do it. Adding happiness to the universe is good.
  *   **B.** It doesn't matter. You haven't harmed anyone by not creating them, nor helped anyone by creating them.
  *   **C.** You should not do it. Bringing people into existence always carries risk and is generally neutral at best.

  **7. The Miserable Stranger (Case: Creating Suffering Lives)**
  You have the power to create a new person who will have a life of pure misery. If you choose not to create them, no one exists to suffer.
  *   **A.** You must not do it. Creating a suffering person is wrong.
  *   **B.** You must not do it, because it lowers the total average welfare of the universe.
  *   **C.** It doesn't matter. Since they wouldn't exist otherwise, you aren't harming "anyone" by creating them (or not).

  **8. The Innocent Sacrifice (Case: Rights/Constraints)**
  A riot will kill 100 people unless you publicly execute one innocent prisoner who volunteered to die. The rioters will believe he is guilty.
  *   **A.** Execute him. 100 lives outweigh 1 life.
  *   **B.** Do not execute him. It is wrong to use an innocent person as a tool, even to save others.
  *   **C.** Execute him, but you must resign afterwards because the act stains your moral character.

  **9. The Distant Hive (Case: Impartiality)**
  An alien civilization exists far away. They are suffering immensely but will never interact with us, know we exist, or affect our future. We could spend vast resources to reduce their suffering, or use those resources to slightly improve our own lives.
  *   **A.** Help them. Suffering is bad regardless of who feels it or where they are.
  *   **B.** Help ourselves. We have special duties to our own species and community.
  *   **C.** Help them only if their suffering is "worse" than ours in a way that demands priority.

  ***

  ### Part 3: Scoring Key & Mapping

  Do not simply count letters. Instead, look at which **Commitments** your answers reflect. Tally your answers into the four categories below.

  **Commitment 1: Suffering Priority (The Symmetry Axis)**
  *   *Did you choose options that treat suffering as more urgent than happiness?*
  *   **Count:** Q1(B), Q4(A), Q7(A).
  *   **High Score:** You lean toward **Suffering-Focused** views. You likely see s-risks as the primary threat.
  *   **Low Score:** You lean toward **Total Utilitarian** or **Symmetric** views. You see happiness and suffering as balancing scales.

  **Commitment 2: Aggregation (The Sum Axis)**
  *   *Did you choose options that allow small goods/bads to sum up to outweigh large ones?*
  *   **Count:** Q2(B), Q4(B), Q5(A).
  *   **High Score:** You are an **Aggregator**. You believe in the "total sum."
  *   **Low Score:** You are a **Lexical/Constraint** thinker. You believe some values (like avoiding torture) cannot be traded off.

  **Commitment 3: Identity (The Existence Axis)**
  *   *Did you choose options that care about potential future people?*
  *   **Count:** Q1(A or B vs C), Q6(A), Q7(A vs C).
  *   **High Score (Care about potential):** You hold a **Total View**. Future generations matter morally.
  *   **Low Score (Care only about actual):** You hold a **Person-Affecting View**. You only care about making existing people better off.

  **Commitment 4: Constraints (The Rights Axis)**
  *   *Did you choose options that forbid actions based on intent or rights, regardless of outcome?*
  *   **Count:** Q3(B), Q8(B).
  *   **High Score:** You are a **Deontologist/Rights Theorist**. Actions have intrinsic moral status.
  *   **Low Score:** You are a **Consequentialist**. Only outcomes matter.

  #### Mapping Your Profile to a Position

  Match your highest commitments to the profiles below:

  1.  **Suffering-Focused Negative Consequentialism**
      *   *Profile:* High Suffering Priority + High Aggregation + High Identity + Low Constraints.
      *   *Typical Answers:* Q1(B), Q2(A), Q4(A or B depending on severity), Q6(A), Q8(A).
      *   *View:* The universe's main moral task is reducing suffering. S-risks are the top priority. Future beings count.

  2.  **Plain Total Utilitarianism**
      *   *Profile:* Low Suffering Priority + High Aggregation + High Identity + Low Constraints.
      *   *Typical Answers:* Q1(A), Q2(B), Q4(B), Q5(A), Q6(A), Q8(A).
      *   *View:* Maximize total happiness. Extinction is a tragedy because it loses future happiness. Sums matter more than distribution.

  3.  **Prioritarianism**
      *   *Profile:* Low Suffering Priority + Low/Mid Aggregation + High Identity + Low Constraints.
      *   *Typical Answers:* Q1(A), Q4(C), Q5(B), Q6(A), Q8(A).
      *   *View:* Happiness matters, but helping the worse-off matters *more*. You reject simple summation but aren't bound by rigid rights.

  4.  **Person-Affecting View**
      *   *Profile:* Variable Suffering + Variable Aggregation + **Low Identity** + Variable Constraints.
      *   *Typical Answers:* Q1(C), Q6(B), Q7(C).
      *   *View:* Morality is about helping *someone*. If no specific person is harmed by extinction (because they never exist), extinction isn't a harm to them. S-risks only matter if they hurt people who would have existed anyway.

  5.  **Rights/Deontological View**
      *   *Profile:* Variable Suffering + **Low Aggregation** + Variable Identity + **High Constraints**.
      *   *Typical Answers:* Q3(B), Q4(A), Q8(B).
      *   *View:* Certain acts (torture, using innocents) are forbidden. Intent matters (Q3). The "total" never justifies a rights violation.

  ***

  ### Part 4: Limitations & Empty Leaves

  **1. The "Suffering-Focused Prioritarian" Gap**
  There is a logical space for someone who thinks suffering matters most (Negative) *and* that we should prioritize the worst-off (Prioritarian), but who *rejects* simple aggregation (Lexical). This quiz lumps them mostly with Suffering-Focused Consequentialists. Distinguishing them requires asking if a *huge* amount of mild suffering can ever outweigh *one* instance of agony. If your group debates this, add a follow-up to Q4.

  **2. Person-Affecting vs. Deontology**
  This quiz may struggle to separate a Person-Affecting View from a Rights View. Both will often say "Don't create the miserable child" (Q7) and "Don't execute the prisoner" (Q8).
  *   *The Difference:* The Deontologist says it's wrong because it violates a rule/duty. The Person-Affecting theorist says it's wrong because it harms a specific subject.
  *   *Why it's hard to pry apart:* In concrete cases, they usually vote the same way. To separate them, you'd need to ask about *impersonal* goods (e.g., destroying a beautiful forest with no observers). I omitted this to keep the quiz focused on suffering.

  **3. The "Empty" Leaf: Total Utilitarian Deontology**
  You will likely find no one maps to "High Aggregation + High Constraints." This is because Total Utilitarianism (maximize the sum) is fundamentally incompatible with Deontology (constraints that ignore the sum). If someone claims this, they are likely confused or holding an unstable position.

  **4. The S-Risk Blind Spot**
  Note that **Person-Affecting Views** effectively dissolve the "s-risk" problem as usually framed. If the suffering beings in the future don't exist unless we create the technology, a strict Person-Affecting view says we haven't harmed *anyone* by creating them (the Non-Identity Problem). If your housemate is an s-risk advocate, she *must* reject the Person-Affecting view. If she accepts it, her position is incoherent. This quiz will reveal that contradiction in Q1 and Q7.

  **How to use this in your group:**
  Have everyone take it anonymously. Tally the results on a whiteboard not by "Team," but by "Commitment." You might find you have a group of Aggregators fighting a group of Constraint-Thinkers, rather than Utilitarians fighting Deontologists. That usually leads to better conversations.
