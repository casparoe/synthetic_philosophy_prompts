          4.  Spare one person agony vs. million people mild improvement (incommensurable trade-off).
          5.  More total happiness/worse worst-off vs. Less total happiness/better worst-off.
      *   **Required Positions (Leaves):**
          1.  Suffering-focused Negative Consequentialism (SNC).
