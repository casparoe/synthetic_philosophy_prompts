answer: |-
  Here is the blueprint for your "Adequacy Conditions" section. It strips out the First-Order smuggled goods and isolates the actual burden of proof for the Higher-Order (HO) theorist.

  ### The Desiderata for a Higher-Order Theory

  An adequate Higher-Order Theory (HOT) must satisfy the following five requirements. These are not requests for the theory to match First-Order intuitions; they are internal consistency checks and empirical boundaries required for the HO mechanism to function as advertised.

  **1. The State/Creature Dissociation**
  *   **The Requirement:** The theory must distinguish between a *creature* being conscious (awake, alert, agentive) and a *mental state* being conscious (having a phenomenal feel).
  *   **The Motivation:** Blindsight and partial awareness. A patient may be fully awake (creature-conscious) but lack visual phenomenology in a specific sector. Conversely, a dreamer may have vivid visual states while the creature is asleep.
  *   **The HOT Constraint:** The theory cannot define consciousness as a global property of the organism. It must locate consciousness in the relational property between a First-Order State (FOS) and a Higher-Order State (HOS). If the HOS is missing, the state is unconscious, even if the creature is behaving intelligently.

  **2. The Content Distinction (The Misrepresentation Constraint)**
  *   **The Requirement:** The content of the HOS must be distinguishable from the content of the FOS it targets.
  *   **The Motivation:** Error and illusion. If I see a white wall as pink, my FOS encodes white (reflectance properties), but my HOS represents me as seeing pink.
  *   **The HOT Constraint:** If the contents are identical by definition, the theory collapses into a First-Order view or a Self-Representational view that loses the explanatory gap. The HOS must be capable of misrepresenting the FOS. This allows HOT to explain why phenomenology can diverge from sensory input.

  **3. The Consciousness/Reportability Distinction**
  *   **The Requirement:** The theory must allow for conscious states that are not reportable, and reportable states that are not conscious.
  *   **The Motivation:** Covert awareness and confabulation. Subjects can sometimes discriminate stimuli they deny seeing (covert), or report seeing stimuli they didn't discriminate (confabulation).
  *   **The HOT Constraint:** Since HOT ties consciousness to an internal representation (HOS), and reportability to a decision/output mechanism, these are causally linked but distinct. An adequate HOT must specify why an HOS usually leads to reportability without making reportability the *definition* of consciousness. If HOS = Reportability, the theory is just a theory of access, not phenomenology.

  **4. The Targetless State Condition (The "Empty HOT" Case)**
  *   **The Requirement:** The theory must deliver a verdict on cases where the HOS is present, but the FOS is absent or inactive (e.g., low-level sensory areas are quiet, higher-order areas light up, subject reports vivid experience).
  *   **The Motivation:** Dreaming, hallucination, and direct neural stimulation. In these cases, the subject claims vivid phenomenology without corresponding sensory input.
  *   **The HOT Constraint:** This is the critical fork. The theory must decide if the HOS *alone* is sufficient for consciousness, or if it requires an existing FOS to target.
      *   *Option A (Strong HOT):* The HOS alone suffices. The subject is conscious of a red dot even if no red-dot state exists in V1.
      *   *Option B (Weak HOT):* The HOS requires an existing FOS. If V1 is quiet, there is no consciousness, only a false belief about consciousness.

  **5. Empirical Locality**
  *   **The Requirement:** The neural correlates of the HOS must be distinct from the neural correlates of the FOS.
  *   **The Motivation:** Neural dissociation. If the same brain region does both the sensing and the higher-order representing, the theory loses its explanatory leverage regarding *why* some sensing is conscious and some is not.
  *   **The HOT Constraint:** Typically, HOT places FOS in posterior sensory cortices and HOS in prefrontal cortex (PFC). An adequate theory must align with lesion data: damaging the HOS site should eliminate phenomenology while sparing sensory processing (blindness without blindsight), and damaging the FOS site should eliminate the content while sparing the capacity for higher-order monitoring (if possible).

  ***

  ### The Audit: Prejudices vs. Non-Negotiables

  Here is the evaluation of which demands are legitimate and which are First-Order (FOT) biases in disguise.

  **1. The Accuracy Constraint is a First-Order Prejudice.**
  You asked specifically about the case where sensory areas are quiet but HO areas light up and the subject reports vivid experience.
  *   **Verdict:** An adequate HOT **must** say this subject is conscious.
  *   **Reasoning:** If you require the HOS to accurately track an existing FOS (an accuracy constraint), you have abandoned the Higher-Order program. You are now saying consciousness is a property of the *sensory state* (FOT), and the HOS is just a monitor. The core insight of HOT is that consciousness is a *relational* property conferred by the HOS. If the HOS says "I am seeing red," the subject is having a red experience, regardless of whether V1 is firing. To deny this is to privilege "contact with the world" over "appearance to the subject." Consciousness is about appearance. Therefore, the "Empty HOT" yields genuine phenomenology, albeit non-veridical.
  *   **Status:** **Non-Negotiable for HOT.** If the theory denies consciousness in the Empty HOT case, it is not a HOT.

  **2. The Content Distinction is Non-Negotiable.**
  *   **Verdict:** The HOS content must be separable from FOS content.
  *   **Reasoning:** Without this, you cannot explain illusion. If the HOS just copies the FOS, you cannot account for cases where phenomenology diverges from sensory input (e.g., phantom limbs).
  *   **Status:** **Non-Negotiable.**

  **3. The Consciousness/Reportability Distinction is Optional (but dangerous to ignore).**
  *   **Verdict:** HOT theorists often collapse these (e.g., Rosenthal's "conscious states are states we are aware of being in," which implies reportability).
  *   **Reasoning:** This is a vulnerability. Empirical data suggests phenomenology can exist without the capacity for report (e.g., in infants or certain lesion cases). A HOT that ties HOS too tightly to linguistic reportability will be falsified by non-linguistic consciousness.
  *   **Status:** **Real Requirement.** The theory must decouple the HOS from the motor output of reporting.

  **4. Empirical Locality is the Killer.**
  *   **Verdict:** This is where HOT faces existential risk, not from philosophy, but from data.
  *   **Reasoning:** Recent "Posterior Hot Zone" data suggests that stimulating posterior cortex generates consciousness even when PFC (the presumed home of the HOS) is offline or lesioned. If consciousness persists without the putative HOS neural substrate, the theory is empirically falsified.
  *   **Status:** **Non-Negotiable.**

  ***

  ### The Viability Verdict

  Can the Higher-Order program meet these non-negotiables?

  **Yes, but only by accepting the "Empty HOT" consequence.**
  The program survives the philosophical scrutiny only if it commits fully to the claim that **consciousness is determined by the Higher-Order State, not the First-Order State.** You must write into your paper that a HOT *cannot* demand accuracy. If a theorist tries to add an accuracy constraint to handle the "vivid hallucination with quiet V1" case, they are smuggling in a First-Order view. They are effectively saying, "Consciousness requires a real sensory state, plus a monitor." That is not HOT; that is FOT with a monitor attached.

  **The Single Requirement That Eliminates Candidates:**
  The **Empirical Locality** requirement is the filter that kills the most candidates.
  Most HOTs identify the HOS with Prefrontal Cortex activity. However, if empirical evidence confirms that robust phenomenology exists when PFC is suppressed (as some anesthesia and lesion studies suggest), then the *mechanism* of HOT is broken, even if the *logic* holds.

  **Final Position for Your Paper:**
  Do not let the "Empty HOT" case weaken the theory. It is the theory's strongest feature. It explains why dreams feel real despite sensory silence. The demand for accuracy is a First-Order prejudice that confuses *consciousness* with *knowledge*. A good HOT treats consciousness as a mode of self-appearance. If the self-appearing mechanism fires without a target, the appearance still occurs.

  However, you must flag the **Empirical Locality** tension as the actual threat. The philosophical coherence of HOT depends on embracing targetless states; its scientific viability depends on finding the HOS in a place that can be dissociated from sensory processing without eliminating phenomenology. Current data suggests this dissociation might not exist where HOT needs it to. That is the real bottleneck, not the accuracy constraint.
