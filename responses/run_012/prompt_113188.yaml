answer: |-
  **Materials:** Folding partition, deck of colored cards (Red/Blue), notepads, pens, two boxes labeled "Input" and "Output," pre-written slips matching the deck order.

  **Roles:**
  *   **Witness (1):** Sits behind partition. Sees cards. Writes judgments ("I see Red").
  *   **Recorder (1):** Sits outside. Copies slips from "Output" to master log.
  *   **Mediator (You):** Stands between boxes. Moves slips from Input to Output.
  *   **Auditors (12):** Watch the flow.

  **Rules:**
  1.  **Goal:** Maximize matches between Card Color and Recorder's Log.
  2.  **Flow:** Witness sees card → writes judgment → deposits in "Input." Mediator moves slip to "Output." Recorder copies "Output" to Log.
  3.  **Constraint:** Witness must write immediately upon seeing the card. Mediator must move slips within 5 seconds. No speaking.
  4.  **Compliance:** If Witness refuses to write, the round scores zero. Auditors verify card order.

  **Timeline (75 mins):**
  *   **0–10:** Setup. Explain rules strictly as a communication efficiency game. Do not mention causation.
  *   **10–35 (Round 1):** Mediator transfers Witness slips faithfully. (Physicalism mimic). Score is perfect.
  *   **35–60 (Round 2):** Mediator takes Witness slips, visibly places them in "Input," but deposits *pre-written* matching slips from pocket into "Output." Witness slips are discarded unseen. (Epiphenomenalism mimic). Score is perfect.
  *   **60–65 (Round 3):** Mediator deposits random slips. Score collapses.
  *   **65–75:** Debrief.

  **Payoff:**
  Team score = Total matches. If score > 90%, everyone gets a "philosophical merit" sticker (or candy). If Round 2 score matches Round 1, bonus points. This incentivizes Auditors to confirm the correlation held even when the mechanism changed.

  **Debrief Mapping:**
  1.  **Round 1 vs. 2:** Ask Witness: "Could you tell when your judgment stopped causing the record?" (They cannot). This maps to **Phenomenal Judgment:** The judgment exists, the report is accurate, but the causal link is severed.
  2.  **The Mechanism:** Reveal you swapped the slips. The correlation was lawful (you ensured it), not causal. This maps to **Brute Law:** Epiphenomenalism requires a law linking brain to experience without causation.
  3.  **The Turn:** Ask Auditors: "How do you know I isn't swapping *your* judgments about this game right now?" If their judgment "I understand this" is caused by brain states, not the understanding itself, the discussion is causally closed. This maps to **Self-Stultification:** If epiphenomenalism is true, you cannot claim to know it, because that claim is not caused by the knowledge.

  **Predictable Failures:**
  *   **Witness Suspicion:** Witness may notice you pocketing slips. *Fix:* Wear wide sleeves or use a opaque chute where slips disappear.
  *   **Recorder Complicity:** Recorder might look at Witness. *Fix:* Enforce partition strictly; Recorder faces away from Mediator.
  *   **Premature Revelation:** Students guess the trick in Round 2. *Fix:* If guessed, ask: "Can you prove it, or is it just a hypothesis consistent with the data?" Proceed to debrief early.

  **Limitations (What You Must Supply):**
  1.  **Qualia:** The game simulates *judgments* about experience, not experience itself. You must explicitly state: "The Witness actually saw Red. The game assumes the experience existed but did nothing." You cannot simulate the 'what-it-is-like' mechanically.
  2.  **Parallelism vs. Epiphenomenalism:** The game shows correlation without causation. It does not distinguish between a lucky break (Parallelism) and a lawful connection (Epiphenomenalism). You must explain that epiphenomenalism posits a *law* (psychophysical bridge), whereas the game used *you* as the law.
  3.  **The Normative Leap:** The game shows we *can't tell* the difference. It does not prove we *shouldn't trust* judgments. You must articulate the normative worry: if truth-tracking is accidental, knowledge is undermined.

  **Honesty:**
  This activity cannot make anyone *feel* epiphenomenal. It can only show the structural indistinguishability of the reports. The visceral worry—the fear that *you* are the Witness right now—must be ignited by your closing silence, not the rules.
