prompt: |-
  I am a junior in high school and the student keeper of my current-affairs club's prediction ledger: a public record of the forecasts members make during our debates, when each was made, the date it was supposed to come true, and how it turned out. The ledger goes up in the hallway every month, and at the end of the year it settles our club's forecaster award, so whatever I write down has to be defensible to the person whose prediction I am judging. My difficulty is the misses. Our club has exactly one rule for them: a prediction that misses its date may be carried forward once, and only once, provided the person who made it names something specific that has to happen before their forecast could come true. In practice that rule has been pulled in every direction. A member who said our city would have driverless buses running by the start of this school year now says the technology is real and only the permits were late. A member who said school would go remote again before last winter says the forecast was always conditional on a new variant. A member who said our town's population would fall by ten percent by last year, and watched it fall by two, says he was right about the direction. A member who said our district would push its start time later this year points to a board vote scheduled for May on exactly that proposal. And I predicted the club would reach fifty members by spring; we are at thirty-eight, and I have been telling everyone that I always meant by the end of the year. We studied Malthus in my geography class, and the verdict our class reached, that he was less wrong than early, is precisely the move I have to police every month, and I cannot tell when it is legitimate. I can feel that some of these are honest corrections and some are just moving the goalposts, and that the difference has something to do with whether the correction predicts anything we could have checked before the original date, but I cannot turn that feeling into a rule I can apply in ten minutes with the person watching me.

  Please write that rule for me as a decision procedure: the questions to ask in order, what counts as a good enough answer to each, and the point at which the procedure stops and scores the prediction as a miss. I have no statistics background and no spare time, so it has to fit on a single page, and I need to be told plainly which steps are my judgment dressed up as procedure. It should mark the places where I have to hand the question to the club as a whole, because what remains is policy rather than fact — for instance what happens to credit if a carried-forward prediction eventually comes true, and whether we are scoring a person's single prediction or the larger view behind it. Ground it in whatever the philosophy of science actually knows about when a theory that has missed its prediction may be kept alive and when it must be given up, but explain it in plain words: no reading list, no citations, and do not assume I know the technical names for things. Then run the procedure on all five cases above, tell me honestly where it misfires or lands on an answer the club will hate, and for each case it scores as a miss, say what the person would have had to say at the time the prediction was made to make the carry-forward legitimate.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Junior in high school, keeper of a prediction ledger for a current-affairs club.
      *   **Task:** Create a one-page decision procedure (rule set) for judging "missed" predictions that members want to carry forward.
      *   **Constraint 1 (The Rule):** A missed prediction can be carried forward *once* if the predictor names something *specific* that must happen before the forecast comes true.
      *   **Constraint 2 (The Problem):** Members are exploiting this (moving goalposts, vague conditions, claiming partial credit, shifting dates). The user needs to distinguish "honest corrections" from "goalpost moving."
      *   **Constraint 3 (Format):** Single page, plain words, no statistics/technical jargon, explicit about where judgment/policy calls are needed.
      *   **Constraint 4 (Philosophy):** Grounded in philosophy of science (falsifiability, ad hoc hypotheses) but explained simply.
      *   **Constraint 5 (Application):** Run the procedure on the five specific cases provided.
      *   **Constraint 6 (Feedback):** Identify where the procedure might misfire or be unpopular, and explain what *should* have been said originally to make the carry-forward legitimate.

  2.  **Deconstruct the Philosophy of Science (Simplified):**
      *   *Core Concept:* Falsifiability (Popper). A theory is scientific if it can be proven wrong. If you keep adding excuses to avoid being proven wrong, it's not science anymore (it's dogma).
      *   *Ad Hoc Hypotheses:* Adding a new condition *after* the failure to save the theory. This is generally bad unless the new condition was independently testable or highly plausible *before* the failure.
      *   *Lakatos (Research Programmes):* Sometimes a theory needs protection while new evidence comes in, but it must eventually predict something *new* and *risky*, not just explain away old failures.
      *   *Application to the Club:* The "carry forward" rule is essentially allowing one "ad hoc" adjustment. To prevent abuse, the adjustment must be *specific*, *observable*, and *independent* of the failure itself.

  3.  **Drafting the Decision Procedure (The "Rule"):**
      *   Need a step-by-step flow.
      *   Need to identify "Judgment Calls" vs. "Hard Rules."
      *   Need to identify "Policy Questions" (for the club vote).
      *   *Step 1: The Specificity Test.* Is the new condition vague?
      *   *Step 2: The Independence Test.* Did this condition exist/get mentioned *before* the deadline?
      *   *Step 3: The Risk Test.* Does the new condition risk being wrong again soon?
      *   *Step 4: The Magnitude Test.* (For partial hits like the population one).
      *   *Step 5: The Stop Rule.* When do we kill it?

      *Refining for the User:* Keep it punchy. Use "Yes/No" gates. Highlight where *they* have to decide.

  4.  **Addressing the "Policy" vs. "Fact" Distinction:**
      *   Fact: Did they name a specific blocker?
      *   Policy: Do we give partial credit? Do we give full credit if it hits later?
      *   I need to explicitly tell the user: "Stop here and ask the club."

  5.  **Running the Procedure on the 5 Cases:**
      *   *Case 1 (Driverless Buses):* Tech real, permits late.
      *   *Case 2 (Remote School):* Conditional on new variant.
      *   *Case 3 (Population):* Wrong magnitude (2% vs 10%), right direction.
      *   *Case 4 (Start Time):* Board vote in May (after deadline).
      *   *Case 5 (Club Membership):* User's own prediction. Spring vs. End of Year.

  6.  **Developing the Critique/Feedback:**
      *   Where does the rule feel harsh?
      *   What should they have said *originally*?
      *   Acknowledge the user's bias in Case 5.

  7.  **Drafting the Content (Iterative refinement):**

      *   *Title:* Needs to sound official but accessible. "The Ledger Carry-Forward Protocol."
      *   *Intro:* Acknowledge the Malthus problem (right direction, wrong time).
      *   *The Steps:*
          1.  **The Blocker Test:** Is there a specific external thing stopping it? (Not just "I was optimistic").
          2.  **The Timeline Test:** Was this blocker knowable before the deadline?
          3.  **The Binary Test:** Is the new outcome pass/fail? (No "kind of" happening).
          4.  **The One-Shot Rule:** No second carries.
      *   *The Policy Flags:* Mark where the club needs to vote.
      *   *The Analysis:* Go through the 5 cases.
          *   Bus: Fail (Permits are always late, vague).
          *   Remote: Pass/Fail depending on if variant was defined.
          *   Population: Fail (Magnitude matters).
          *   Start Time: Pass (Vote is specific).
          *   Membership: Fail (Self-serving date shift).

      *Wait, I need to be careful.* The prompt asks me to write the rule *first*, then run it.
      *   *Philosophy Check:* The core philosophical principle is "Novel Prediction." If the excuse explains the past but doesn't predict a *new* checkable event, it's pseudoscience.
      *   *Refining the Rule:* The condition must be an *event*, not an *explanation*. "Permits were late" is an explanation. "Permits approved by Date X" is an event.

      *Let's structure the response:*
      1.  The One-Page Procedure.
      2.  The Application to the 5 Cases.
      3.  The "What They Should Have Said" correction.

      *Self-Correction on Tone:* The user is a high school junior. Don't talk down, but don't use academic jargon. Be direct. "You are the judge, but here is your gavel."

      *Specific focus on the "Judgment dressed up as procedure" request:* I need to explicitly box or highlight where *they* are making a subjective call.

      *Specific focus on "Policy rather than fact":* I need to list the questions the club must vote on separately from the ledger keeper's decision.

      *Reviewing the Cases against the Draft Rule:*
      *   *Bus:* "Permits were late." -> Is "permits" a specific event? Yes. Was it named *before* the miss? No. -> Miss.
      *   *Remote:* "Conditional on variant." -> Was this condition written down *before*? If not, it's a retrofit. -> Miss.
      *   *Population:* "Right direction." -> Prediction was 10%. Got 2%. -> Miss. (Magnitude is part of the prediction).
      *   *Start Time:* "Vote in May." -> Specific event. New date set? -> Carry Forward (if new date is set).
      *   *Membership:* "Spring vs End of Year." -> Vague date shift. -> Miss.

      *Wait, Case 4 (Start Time):* The prediction was "push start time later *this year*." The vote is in May. If "this year" means the school year, May is late. If it means calendar year, it's okay. But the prediction was for the *change* to happen, not just the vote. A vote isn't the change. This is tricky. I should flag this.

      *Wait, Case 2 (Remote):* "Conditional on a new variant." If they didn't write "IF variant" originally, they can't add it now. That's the core of falsifiability.

      *Okay, let's finalize the Procedure Steps.*
      1.  **The Specific Blocker:** Must be an event, not a reason.
      2.  **The Pre-Existence:** Could we have checked this before the deadline?
      3.  **The New Deadline:** Must be fixed.
      4.  **The Binary Outcome:** Must be Yes/No.

      *Let's write it.*

      *(Self-Correction during drafting)*: Make sure to explicitly mention the "Malthus Move" (right direction, wrong time) and how to handle it. That's usually a "Miss" in strict forecasting unless the *trend* was the prediction.

      *(Final Polish)*: Ensure the distinction between "Keeper's Duty" (Fact) and "Club's Duty" (Policy) is clear.

      *(Case Analysis)*: Be honest about where the club will hate the answer (e.g., the Population guy might feel hard done by, but he was wrong on the number).

      *(What they should have said)*: This is crucial for the educational aspect.

      *Okay, ready to generate.*
answer: |-
  ### The Ledger Carry-Forward Protocol
  **For the Use of the Club Keeper**

  **Purpose:** To distinguish between a theory that is *early* (legitimate carry-forward) and a theory that is *wrong* (miss).
  **Philosophy:** A prediction survives a miss only if the reason for the miss allows us to check it again soon. If the excuse explains the past but predicts nothing new, it is not science; it is an excuse.

  ---

  #### PART 1: THE KEEPER'S CHECKLIST (Fact & Logic)
  *Ask these four questions in order. If the answer is NO at any step, the prediction is a **MISS**. Stop there.*

  **1. The Blocker Test: Is the reason an *event* or an *explanation*?**
  *   **Yes:** "The city council must vote yes," or "Permits must be issued by March." (These are observable events).
  *   **No:** "The technology wasn't ready," or "Permits were delayed." (These are explanations of why it didn't happen).
  *   *Keeper's Judgment:* You must decide if the "blocker" is something we can go look at and verify, or just a story about why things failed.

  **2. The Independence Test: Was this blocker knowable before the deadline?**
  *   **Yes:** The blocker existed or was scheduled before the original date passed.
  *   **No:** The blocker was invented *after* the prediction failed to save it.
  *   *Keeper's Judgment:* If they say "It depended on a new variant," did they write that down *before* the winter started? If not, they are moving the goalpost.

  **3. The Precision Test: Is the new deadline fixed?**
  *   **Yes:** "By May 1st," or "By the end of the school year."
  *   **No:** "Soon," "Later this year," or "By spring."
  *   *Keeper's Judgment:* Vague timeframes allow infinite delays. Demand a date.

  **4. The Binary Test: Will the next outcome be clearly Pass or Fail?**
  *   **Yes:** "Buses run" or "Buses do not run."
  *   **No:** "Population falls" (without a number) or "School goes remote" (without defining what counts as remote).
  *   *Keeper's Judgment:* If they can claim they were "mostly right" next time, reject the carry-forward now.

  ---

  #### PART 2: THE CLUB POLICY FLAGS (Vote Required)
  *These are not facts; they are rules about fairness. You cannot decide these alone. Put these to a club vote at the start of the year.*

  **[POLICY A] The "Malthus" Rule (Direction vs. Magnitude)**
  *   *The Issue:* A member predicts a 10% drop, gets a 2% drop. They claim they were right about the *direction*.
  *   *The Vote:* Do we award partial credit for direction, or is the number the prediction?
  *   *Recommendation:* Treat the number as the prediction. Direction without magnitude is usually luck.

  **[POLICY B] The "Late Hit" Credit**
  *   *The Issue:* If a carried-forward prediction comes true on the second try, do they get full points, half points, or just a "verified" mark?
  *   *The Vote:* How much do we value timeliness?
  *   *Recommendation:* Half credit. Being right late is better than being wrong, but worse than being right on time.

  **[POLICY C] The Keeper's Conflict**
  *   *The Issue:* You (the Keeper) have made a prediction (Case 5).
  *   *The Vote:* Does the Keeper recuse themselves, or does the Vice-Keeper judge the Keeper's entries?
  *   *Recommendation:* Recusal is mandatory. You cannot judge your own homework.

  ---

  ### APPLICATION TO CURRENT CASES
  *Here is how the procedure scores your five pending cases, assuming standard strictness.*

  **1. The Driverless Buses (Tech real, permits late)**
  *   **Verdict:** **MISS**
  *   **Why:** Fails **The Blocker Test**. "Permits were late" is an explanation, not an event. To carry forward, they needed to predict: "Permits will be approved by [Date]."
  *   **Club Reaction:** They will hate this. It feels pedantic.
  *   **What they should have said:** "Driverless buses will run by September, *provided* the city approves the safety permits by August."

  **2. The Remote School (Conditional on new variant)**
  *   **Verdict:** **MISS**
  *   **Why:** Fails **The Independence Test**. Unless "IF a new variant emerges" was written in the ledger *before* winter, this is a retrofit. You cannot add conditions after the failure.
  *   **Club Reaction:** They will argue this is common sense.
  *   **What they should have said:** "School goes remote if Case X exceeds Y by December." (A specific trigger).

  **3. The Population Drop (10% predicted, 2% happened)**
  *   **Verdict:** **MISS**
  *   **Why:** Fails **The Binary Test**. A prediction of 10% is a specific claim. 2% is not 10%. This falls under **[POLICY A]**. Unless the club votes to award "directional credit," this is wrong.
  *   **Club Reaction:** High friction. The member feels vindicated by the trend.
  *   **What they should have said:** "Population will begin a decline trend by [Date]," rather than specifying a percentage.

  **4. The Start Time (Board vote in May)**
  *   **Verdict:** **CARRY FORWARD (Conditional)**
  *   **Why:** Passes **The Blocker Test** (A vote is an event). However, it fails **The Precision Test** unless "This Year" is defined. If the school year ends in June, May is valid. If the change doesn't happen until *next* year, it's a miss.
  *   **Club Reaction:** Acceptable, provided the new date is written down.
  *   **What they should have said:** "The Board will vote to change the time by May, and the change takes effect by September."

  **5. The Club Membership (You: 50 by Spring -> 50 by Year End)**
  *   **Verdict:** **MISS**
  *   **Why:** Fails **The Precision Test** and **[POLICY C]**. "Spring" is vague, but shifting to "Year End" is a clear date extension after failure. You are exploiting the Malthus Move on yourself.
  *   **Club Reaction:** If you let this slide, you lose all authority. They will see it as hypocrisy.
  *   **What you should have said:** "50 members by the last day of school." (And then owned the miss).

  ---

  ### WHERE THIS PROCEDURE MISFIRES
  *Be honest with yourself about these weaknesses.*

  1.  **The "Unfair Luck" Problem:** Case 2 (Remote School) is the hardest. In reality, predictions *are* often conditional on things we can't control. The rule punishes members for not being lawyers when they made the forecast.
      *   *Fix:* Allow a "Force Majeure" vote. If 75% of the club agrees the condition was obvious but unwritten, allow the carry.
  2.  **The "Keeper's Bias" Problem:** In Case 5, even if you recuse yourself, your friends know you wrote the rule.
      *   *Fix:* You must mark your own prediction as a **MISS** publicly. It buys you the credibility to enforce the rule on others.
  3.  **The "Stifling Boldness" Problem:** If the rules are too strict, members will only make safe, boring predictions (e.g., "The sun will rise").
      *   *Fix:* Remind the club that a "Miss" is not a shame. The Ledger honors accuracy, not optimism. A bold miss is better than a safe hit.

  ### FINAL INSTRUCTION
  Print Part 1 and tape it to the ledger. Call a meeting to vote on Part 2. For Case 5, mark it **MISS** before you judge anyone else. If you do not do this, the procedure is just paper, and the ledger is just a game.
