answer: |-
  1. **The Right-Making vs. Reasoning Distinction**
     You argue that even a self-effacing theory commits the Reason-Substitution Claim because the theory's *justification* must cite consequences rather than the agent's love. Sophisticated consequentialists, however, insist on a sharp distinction between the features that make an act right and the reasons for which an agent may act. Why does their distinction fail to block your claim that the theory's justificatory story substitutes the reason?

     *Follow-up:* You will likely reply that the objection targets the theory's account of rightness, not the agent's psychology. But if the theory permits the agent to act on love, why does the external justificatory backstory constitute a violation of *integrity*, rather than a mere metaphysical fact about the act?

  2. **The Status of the Reason-Substitution Claim**
     Is the Reason-Substitution Claim a conceptual truth about the structure of criterion-based theories, or is it an empirical generalization about how theorists like Sidgwick or Mill actually construct their accounts?

     *Follow-up:* If you say it is conceptual, doesn't that risk stipulating that any theory which distinguishes right-making features from motivating reasons is false by definition? If you say it is empirical, couldn't a consequentialist simply revise their theory to cite love as a right-making feature?

  3. **The Particularist Exemption**
     You argue that particularism escapes the Reasons-Availability Constraint because it operates without a criterion of rightness. Yet a particularist must still cite reasons to justify a specific action. How do they satisfy the constraint without a general criterion to generate those reasons, and does this not merely push the problem back to the reasons themselves?

     *Follow-up:* You will likely suggest they cite the features directly without subsumption. But if the constraint requires that a theory state the reasons for which actions may be done, doesn't the particularist's list of reasons function as a criterion in all but name?

  4. **The Reasons-Availability Constraint and the Morality System**
     Is the Reasons-Availability Constraint a conceptual truth about rightness as such, or is it an artifact of the "morality system" that Williams spent his later work attacking?

     *Follow-up:* If you argue it is a conceptual truth, doesn't that commit you to a framework of rightness that Williams himself sought to dissolve? If it is an artifact of the morality system, why should we accept a constraint derived from a system Williams deemed pathological?

  5. **Integrity and the Nearest-and-Dearest Problem**
     Can the nearest-and-dearest problem be run without the integrity apparatus at all? If the core issue is simply that the theory substitutes reasons, isn't your unification of the integrity objection and the nearest-and-dearest objection idle, since the reason-substitution does all the work?

     *Follow-up:* If you reply that integrity is the locus of the harm, does that imply that an agent without a strong sense of integrity would have no grounds for the objection?

  6. **Kantian Parity and Alienation**
     You concede that your reconstruction indicts Kantianism as well as Utilitarianism. But the alienation in Kantianism is typically from inclination, whereas in Utilitarianism it is from personal projects and relationships. Are these structurally identical enough to warrant the same verdict under your constraint?

     *Follow-up:* You will likely say the structural substitution of reasons is identical. But given that Williams targeted Utilitarianism specifically, does broadening the indictment to Kantianism dilute the specific political and psychological force of his original critique?

  7. **Williams's Anti-Criterion Project**
     Williams rejected the search for a criterion of rightness entirely. By deriving your objection from the existence of a criterion, aren't you assuming the very framework Williams wanted to dissolve, effectively granting his opponents the terms of the debate?

     *Follow-up:* If you reply that you are diagnosing the system he critiqued, doesn't that mean your argument only works against those who accept the search for a criterion, leaving the Williamsian project itself untouched by your own analysis?

  8. **Requirement and Reason**
     You relocate the objection from deliberation to justification. But if a theory cannot cite the agent's actual reason in its justification, can it coherently *require* the action without requiring the alienation?

     *Follow-up:* You will likely argue that requirement and reason come apart. But if the theory requires an act *because* it maximizes utility, while the agent acts *because* of love, isn't the theory effectively requiring the agent to be lucky rather than rational?

  9. **The Virtue-Ethics Boundary**
     You spare virtue ethics, but some eudaimonistic accounts operate with a criterion of the good life. Where exactly does the Reasons-Availability Constraint draw the line between a virtue-theoretic sensibility and a criterion that triggers the substitution claim?

     *Follow-up:* If you reply that virtue ethics lacks a decision procedure, doesn't that conflate the epistemology of rightness with the metaphysics of rightness, which your constraint is supposed to target?

  10. **Falsifying the Constraint**
      Finally, what would count against the Reasons-Availability Constraint? What theoretical virtue would you have to sacrifice, or what counter-example would you need to see, to abandon it?

      *Follow-up:* If you reply that nothing could count against it without undermining normativity itself, does that not suggest the constraint is a dogma rather than a philosophical thesis open to revision?
