          *   *Refined Intuition:* Most people feel the coerced blamer retains *some* standing, but perhaps it's complicated. However, compared to a standard hypocrite (who violates willingly), the coerced one is much closer to retaining standing.

  4.  **Evaluate Theories against the Case:**

      *   **SPA (Commitment):** Handles this *very well*. Since standing depends on the *attitude* toward the norm (acceptance as binding), and the coerced agent retains that attitude, she keeps standing. The violation was not an expression of rejecting the norm.
