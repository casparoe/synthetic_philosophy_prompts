          *   *Condition for Standing:* The blamer must *comply* with the norm (or at least not violate it without excuse).
          *   *Application to Case:* The coerced agent *violated* the norm. Even if coerced, the act occurred. She is asking the other to bear a burden (restraint) that she failed to bear (even if under duress).
          *   *Prediction:* She likely *loses* standing (or has diminished standing), because the fairness relation is disrupted by the act itself, regardless of internal attitude. *Correction/Refinement:* Most reciprocity accounts allow for *excuses*. Blackmail is a strong excuse. If the violation is excused, is it still a "freeload"?
