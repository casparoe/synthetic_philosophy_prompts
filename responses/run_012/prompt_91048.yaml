answer: |-
  **The Game: Singleton Bonus**
  $N \ge 3$ players. Action set $A = \{0, 1\}$. Let $k = \sum_{i=1}^N a_i$ be the count of players choosing 1. Payoff $u(k)$ is identical for all players:
  $$ u(k) = \begin{cases} S & \text{if } k = 0 \\ V & \text{if } k = 1 \\ 0 & \text{if } k \ge 2 \end{cases} $$
  Parameters: $V > S > 0$. No communication, correlation, or asymmetry.

  **Pure Verdict (Act-Constraining)**
  Superrationality constrains acts: identical reasoning yields identical actions. The only feasible profiles are pure symmetric ones: All-0 ($k=0$) or All-1 ($k=N$).
  Payoffs: $u(0) = S$; $u(N) = 0$ (since $N \ge 3$).
  Since $S > 0$, All-0 strictly dominates All-1.
  **Verdict:** All players choose 0. Payoff: $S$.

  **Mixed Verdict (Strategy-Constraining)**
  Superrationality constrains strategies: identical reasoning yields identical probability distributions. Each plays 1 with probability $p$. Expected payoff $E(p)$:
  $$ E(p) = S(1-p)^N + V \cdot N p (1-p)^{N-1} $$
  Differentiating at $p=0$:
  $$ E'(0) = -NS + VN = N(V - S) $$
  Since $V > S$, $E'(0) > 0$. There exists $p^* \in (0,1)$ maximizing $E(p)$ such that $E(p^*) > E(0) = S$.
  **Verdict:** All players randomize with $p^*$. Payoff: $E(p^*) > S$.
  The gap $E(p^*) - S$ widens as $V$ increases.

  **The Working Assumption**
  The divergence rests on **Algorithmic Identity vs. Output Identity**. The Pure reading assumes superrationality entails identity of *outputs* (acts). The Mixed reading assumes identity of *algorithms* (strategies), permitting stochastic outputs from deterministic reasoning.
  If we drop Algorithmic Identity—assigning probability $\epsilon$ that a counterpart reasons differently—the Pure verdict becomes risky. A single deviation from All-0 yields $k=1$ (payoff $V$), which is beneficial, but a deviation from All-1 is irrelevant. However, if the concern is coordination failure leading to $k \ge 2$, the Pure verdict (All-0) is robust to small $\epsilon$ (payoff remains near $S$), whereas the Mixed verdict relies on the independence of realizations. If reasoning errors correlate, the Mixed advantage collapses.

  **Scaling with N**
  As $N \to \infty$:
  The Pure verdict remains constant at $S$.
  The Mixed optimal probability scales as $p^* \approx 1/N$. The expected payoff converges to $(S+V)e^{-1}$. Provided $V > S(e-1)$, the Mixed verdict strictly outperforms the Pure verdict indefinitely. The gap does not vanish; it stabilizes.

  **Strongest Objection**
  A defender of the Pure reading argues that **private randomization is not reasoning**. If reasoning determines the choice, a coin flip represents an abdication of rational control. The Mixed verdict relies on realizations differing across players despite identical reasoning; if the "reasoning" includes the random seed, the seeds must differ, violating the "shared reasoning only" constraint. If the seeds are shared, realizations match, collapsing Mixed back to Pure. Thus, the Mixed verdict illicitly imports private information (the random outcome) disguised as a public strategy.

  **EDT Recovery and Chapter Implications**
  Can Evidential Decision Theory (EDT) recover the Mixed verdict? Standard EDT conditions on the *act*. If I condition on "Play 1", and assume logical correlation, I infer others play 1, yielding $k=N$ and payoff 0. EDT thus selects "Play 0" (Pure verdict). To recover Mixed, EDT must condition on the *selection of the probability parameter* $p$, treating the strategy itself as the act.
  If your chapter argues superrationality is merely EDT applied to logical correlations, this case is fatal: standard EDT fails to generate the Mixed verdict without redefining the locus of agency. If superrationality requires Strategy-Identity, it is not reducible to standard EDT over acts. You must argue that rational deliberation selects algorithms, not merely outputs, implying decision theory must operate at the level of source code, not just execution.
