answer: |-
  **Essay Question**

  Is the moral authority of Mrs Fairhurst's advance directive the same when it demands sacrifices from her family as when it refuses treatment for herself, and does her lucid request for antibiotics override her earlier refusal?

  ***

  **Model Answer**

  The moral authority of Mrs Fairhurst's earlier self is not absolute; it dissolves when it shifts from protecting her own bodily integrity to commanding the lives of others, and when her current self explicitly contradicts it. In this specific case, the directive should be set aside, and the pneumonia treated. To argue otherwise is to privilege a past abstraction over present human beings.

  First, there is a fundamental moral distinction between refusing treatment and demanding care arrangements. An advance directive refusing antibiotics is a negative right: it protects the self from unwanted intrusion. This holds significant weight because bodily autonomy is paramount; no one should be forced to endure medical procedures they find undignified. However, Mrs Fairhurst's directive also demands her sisters remortgage houses, cut working hours, and her grandson endure distress. This is a positive claim on others' resources and emotional welfare. Autonomy does not grant the power to bind others indefinitely to costly sacrifices. The earlier self cannot morally mortgage the future well-being of the living to preserve a past ideal of dignity. When the directive moves from 'do not touch me' to 'ruin your finances and emotional stability for me,' it exceeds the scope of personal authority. The sisters' sacrifice is voluntary only insofar as they can withdraw it; the directive attempts to make it compulsory.

  Second, the lucid interval fundamentally challenges the identity assumption underpinning advance directives. The directive assumes the future self will be incapable of reasoning or holding values. Yet, Mrs Fairhurst experienced a period of clarity where she expressed happiness and requested treatment. To ignore this is to treat her current consciousness as irrelevant, valuing the memory of a person over the person herself. If she is capable of saying 'I want to live' even for an hour, that current wish carries immediate moral weight. Ignoring it causes present suffering to satisfy a past instruction that may no longer reflect her interests. The past self is, in a meaningful sense, a stranger to the current self; privileging the stranger over the present sufferer is unjustifiable when the present sufferer can speak. The cheerful demeanour suggests her current welfare is not being compromised by existence, contradicting the earlier fear of indignity.

  However, holding this position costs us something significant. If we allow lucid intervals or family burdens to override written directives, we weaken the security of advance planning. People may fear their future selves will be betrayed by relatives claiming 'they seemed happy' to avoid the burden of care. It creates a slippery slope where convenience overrides principle. We risk making the protection of the vulnerable dependent on the moral courage of caregivers rather than firm rules. This undermines the very purpose of an advance directive, which is to protect the patient when they cannot speak.

  Nevertheless, in this specific case, the burden on the sisters and the grandson, combined with the explicit current request, tips the balance. The earlier self's authority is conditional on not harming others and on the absence of contrary current capacity. Here, both conditions are breached. The moral obligation is to respect the current request for treatment and relieve the family of the impossible burden of enforcing a past wish against present reality. The directive should be set aside.

  ***

  **Marking Scheme**

  **Total Marks: 20**

  1.  **Distinction between negative and positive claims (4 marks)**
      *   *Must hit:* Identifies that refusing treatment (negative) is morally different from demanding family sacrifice (positive).
      *   *Common error:* Treating the refusal of antibiotics and the demand for home care as having identical moral weight.
  2.  **Limits of autonomy regarding others (4 marks)**
      *   *Must hit:* Argues that one's autonomy cannot indefinitely bind others to significant financial or emotional cost.
      *   *Common error:* Arguing that autonomy is absolute regardless of the impact on third parties.
  3.  **Significance of the lucid interval (4 marks)**
      *   *Must hit:* Uses the lucid request as evidence of current capacity/welfare that challenges the past instruction.
      *   *Common error:* Dismissing the lucid interval as irrelevant because it was temporary or inconsistent.
  4.  **Current welfare vs. Past wishes (4 marks)**
      *   *Must hit:* Prioritises the current self's expressed happiness/welfare over the past self's abstract preferences.
      *   *Common error:* Assuming the past self's wishes automatically trump the current self's feelings because they were made when 'sane'.
  5.  **Acknowledgement of the cost/implication (4 marks)**
      *   *Must hit:* Recognises that overriding the directive undermines the reliability of advance planning generally (the slippery slope).
      *   *Common error:* Presenting the argument as having no negative consequences for future cases or trust in directives.

  **Differentiator:** The point that separates an A from a B is **Point 5**. A B-grade student will argue the case correctly but treat it in isolation; an A-grade student will explicitly acknowledge that their solution weakens the institution of advance directives generally, yet argue it is necessary nonetheless.
