prompt: |-
  I'm trying to figure out what I actually believe about promises by going on gut reactions to cases, and I'd like you to act as a philosopher who works on promissory obligation. Please start by brainstorming the main families of view out there — the one where promising transfers a right to the promisee, the one where it's about giving assurance or inviting reliance, the one where it's a social practice with constitutive rules like a game, the trust-based ones, whatever else you think deserves a slot — and only then try to fit something to my cases. Think carefully, and dont smooth the tensions over: if a clean principle forces me to drop a verdict, I'd rather know which one.

  - I promise to pick you up at the airport at 8, and then I just don't, because I got absorbed in a show. Clearly wrong.
  - Same, but I got t-boned on the way. Not wrong at all.
  - I promise to pick you up; you forgot I ever offered and took a cab; I stay home. I think I still did something wrong, but it's oddly hard to say what, since you lost nothing.
  - I promise to come to your terrible poetry reading, but you'd actually rather I didn't — you'll be embarrassed. I show up anyway. I think I did wrong *by showing up*, which is wierd, since I did exactly the thing I promised.
  - I promise to keep your secret, but you've since blabbed it to everyone yourself. I mention it to a friend. Doesn't feel wrong.
  - I promise the mugger I'll hand over my wallet, then I run. Not wrong.
  - I promise my friend I'll back up his lie to his wife. I end up telling her the truth. Doesn't feel wrong, and I'm not sure there was ever a promise there to break.
  - I promise a dying friend I'll look after her dog; she dies a week later. Still binds, and pretty strongly — stronger than some promises to people who are still around, which I can't make sense of.
  - I promise myself I'll go to the gym tomorrow. I don't. Feels like nothing; I'm not sure you can even break a promise to yourself.

  My rough hunch is that breaking a promise wrongs the promisee in a way that's independent of whatever they lose — but then the secret case should bother me and it doesn't, so that's probably too simple.

  Two of these really fight each other: the airport/cab one (you lost nothing, but I still wronged you) and the secret one (you lost nothing, and I didn't). What breaks the tie?

  Please give me the principle, or a short list of candidate principles, stated precisely enough that I could disagree with it; say which of my cases forces each clause; tell me what it predicts for cases I haven't listed — a promise made to someone in a coma, a promise I end up keeping by accident, a promise kept in a way that humiliates the promisee, and whether an AI assistant that says "I promise" can bind itself; and be honest about which of my verdicts your account has to overturn. No citations needed, just the argument.
