answer: |-
  ### Part 1: The Landscape of Promissory Obligation

  Before we lock onto a principle, here are the main families of views you are navigating between. Each handles your cases differently.

  1.  **The Will Theory (Rights Transfer):** Promising is an act of moral alchemy where you transfer a right of control over your action to the promisee. They now "own" that piece of your future.
      *   *Strengths:* Explains why you wrong someone even if they lose nothing (Airport/Cab). Explains why the dying friend's promise binds (the right was transferred before death).
      *   *Weaknesses:* Struggles with the Secret case (why does the right vanish just because they spoke?) and the Poetry case (why can't they enforce the right if they want you there?).
  2.  **The Reliance Theory (Assurance):** Promising is about creating a secure expectation so others can plan. The wrong is harming their reliance.
      *   *Strengths:* Explains the Secret case (no harm done, secret out) and the Airport/T-bone (no fault, reliance unreasonable).
      *   *Weaknesses:* Collapses on the Airport/Cab case. If they took a cab and lost nothing, reliance theory says you did nothing wrong. You disagree.
  3.  **The Social Practice Theory (Constitutive Rules):** Promising is like playing chess. By saying "I promise," you opt into a rule-governed institution where breaking a move is a foul, regardless of consequences.
      *   *Strengths:* Explains the Airport/Cab case (you broke the rule).
      *   *Weaknesses:* Struggles with the Mugger and Lie cases. Why don't the rules apply there? (Usually answered by "validity conditions," but that starts to look like the Will Theory).
  4.  **The Trust Theory (Interpersonal):** Promising is an invitation to trust. The wrong is betrayal of the relationship, not violation of a rule or right.
      *   *Strengths:* Explains the Poetry case (betrayal of care) and Self-Promise (hard to betray yourself in the same way).
      *   *Weaknesses:* Struggles with the Dying Friend. If they are dead, the relationship is over; why does the trust obligation remain so strong?

  ### Part 2: Diagnosing Your Tension

  Your core conflict is between **Airport/Cab** and **The Secret**.

  *   **Airport/Cab:** Promisee loses nothing (took a cab), yet you wronged them. This kills pure Reliance Theory. It suggests the obligation is about **Authority**, not **Harm**.
  *   **The Secret:** Promisee loses nothing (secret out), and you did *not* wrong them. This suggests the obligation is not absolute Authority, but Authority over a **Specific Object** that can cease to exist.

  **The Tie-Breaker:** In the Cab case, the promisee *passively* failed to exercise their right (they forgot). In the Secret case, the promisee *actively* destroyed the object of the right (confidentiality became impossible). The principle must distinguish between *ignoring* a right and *voiding* the condition of the right.

  ### Part 3: The Principle

  Here is the principle that fits your verdicts best. It is a hybrid of Will Theory and Teleological (Purpose) constraints.

  **The Conditional Authority Principle**
  > A promise creates a moral obligation by transferring a **limited right of authority** over the promisor's action to the promisee. This obligation binds independent of reliance or harm, **unless**:
  > 1.  **Impossibility:** External forces make performance impossible (T-bone).
  > 2.  **Invalidity:** The promise concerns an immoral act or is extracted under coercion (Mugger, Lie to Wife).
  > 3.  **Voidance:** The promisee actively destroys the *object* of the promise or explicitly releases the promisor (Secret, Poetry).
  > 4.  **Agency:** There must be a distinct rights-holder capable of holding the authority (No Self-Promises).

  **Why this fits your cases:**
  *   **Airport/Show:** Violates the transferred right. (Clause: Default binding).
  *   **Airport/T-bone:** Impossibility. (Clause 1).
  *   **Airport/Cab:** Right violated even if not exercised. Forgetting is not Voidance. (Clause: Default binding).
  *   **Poetry Reading:** The object of the promise is "your benefit/attendance." If attendance harms you, the object is voided by your preference. Showing up violates the *spirit* of the authority transfer (which is for their sake). (Clause 3).
  *   **Secret:** The object (confidentiality) was destroyed by the promisee. You cannot keep what no longer exists. (Clause 3).
  *   **Mugger/Lie to Wife:** Invalid objects (coercion/immorality). (Clause 2).
  *   **Dying Friend:** The right was transferred while alive; death does not erase the debt, and no one is left to release it. (Clause: Default binding + Agency survives death of holder).
  *   **Self-Promise:** No distinct rights-holder. You cannot transfer authority to yourself; you already have it. (Clause 4).

  ### Part 4: Predictions for New Cases

  Here is how this principle handles cases you haven't listed. This is where you can test if you actually believe it.

  **1. The Coma Case:**
  *   *Scenario:* I promise to visit you daily. You fall into a permanent coma.
  *   *Prediction:* **It binds.**
  *   *Reasoning:* Under the Conditional Authority Principle, the right was transferred to you. Your incapacity does not void the right (unlike the Secret case where you *acted* to destroy the object). Unless a proxy releases me, I am obligated to visit a comatose friend.
  *   *Tension:* This feels burdensome. If you reject this, you must amend Clause 3 to include "Promisee incapacity to *value* the performance voids the right," which weakens the Airport/Cab verdict.

  **2. Accidental Keeping:**
  *   *Scenario:* I promise to water your plants. I forget the promise entirely, but I water them anyway because I like plants.
  *   *Prediction:* **Obligation fulfilled, but virtue lacking.**
  *   *Reasoning:* The right-holder got what was theirs (watered plants). The authority was respected in outcome, if not in intent. You did not *wrong* me, but you didn't *honor* me.
  *   *Tension:* If you feel this *is* a breach of promise (because you didn't do it *because* of the promise), my principle is too focused on outcomes. You would need a "Motivation Clause."

  **3. Humiliating Keeping:**
  *   *Scenario:* I promise to pay your debt. I show up at your work to hand you the cash in front of your boss, knowing it will embarrass you.
  *   *Prediction:* **Wrong.**
  *   *Reasoning:* Similar to the Poetry case. The transfer of authority implies the performance is for the promisee's good or will. Using the performance to harm them violates the conditions of the authority transfer.
  *   *Tension:* This requires interpreting the "object" of the promise broadly (not just "pay debt" but "pay debt respectfully").

  **4. The AI Assistant:**
  *   *Scenario:* An AI says, "I promise to save your file." It deletes the file.
  *   *Prediction:* **No promissory obligation broken.**
  *   *Reasoning:* Clause 4 (Agency). An AI cannot hold a "right of authority" in the moral sense. It can simulate a social practice, but it cannot be *wronged* by a breach. It is a tool, not a rights-holder.
  *   *Tension:* If you feel betrayed by an AI, you are projecting human agency onto it. My principle says that feeling is a category error.

  ### Part 5: The Cost (Where I Overturn Your Verdicts)

  To maintain this principle cleanly, I have to correct two of your intuitions.

  **1. The Lie to Wife ("Not sure there was ever a promise there")**
  *   *Your Verdict:* Maybe no promise existed.
  *   *My Correction:* **A promise was made, but it was null.**
  *   *Why:* You used the words and invoked the practice. The obligation was generated, but immediately voided by Clause 2 (Immorality). This distinction matters. If you treat it as "no promise," you imply the words meant nothing. If you treat it as "null promise," you acknowledge you entered the bond but were released by the content. It explains why you might still feel a lingering "ick" even if you weren't wrong to break it.

  **2. The Self-Promise ("Feels like nothing")**
  *   *Your Verdict:* Can't break a promise to yourself.
  *   *My Correction:* **It's not a promise, it's a resolution.**
  *   *Why:* My principle demands a second party to hold the right. If you believe breaking a self-promise is a genuine *moral failure* (not just a lack of discipline), my principle is too narrow. However, given your verdict ("Feels like nothing"), my principle validates you. I am only flagging this because many philosophers insist self-promises *do* bind integrity. If you ever change your mind on this, the principle breaks.

  ### Summary of the Trade-Off

  You wanted to know what breaks the tie between **Airport/Cab** (wrong without loss) and **Secret** (not wrong without loss).

  The answer is **Active Voidance vs. Passive Neglect.**
  *   In **Cab**, the promisee neglected their right. The right remains. You violated their authority.
  *   In **Secret**, the promisee destroyed the substrate of the right. The right evaporates. You violated nothing.

  If you accept this, you must accept the **Coma Case**: you owe duties to those who cannot remember them, because the right they hold does not depend on their current consciousness, only on their past authority. If that feels wrong to you, you must retreat from the "Rights Transfer" view back toward "Reliance," which will force you to admit you did nothing wrong in the **Airport/Cab** case.

  Which cost do you prefer to pay? The Coma, or the Cab?
