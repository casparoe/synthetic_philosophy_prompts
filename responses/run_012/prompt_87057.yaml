answer: |-
  This is a classic reconstruction of the self-refutation objection raised against Nāgārjuna by his Nyāya opponents (recorded in Nāgārjuna's *Vigrahavyāvartanī* or *VV*). Your reconstruction is logically valid; the tension is genuine. Since you wish to preserve (1), (2), and (4)—which correspond to the core Madhyamaka doctrines of the *catuṣkoṭi*, the emptiness of emptiness, and the non-assertion of intrinsic nature—the pressure falls on how you interpret the status of the Madhyamaka claim itself.

  Here is the step-by-step diagnosis, the identification of the break point, and the price of the repair.

  ### 1. The Diagnosis: Where the Argument Breaks

  You asked whether the defender is forced to deny (6) or (7). Technically, **(6) is a conclusion**, not a premise. It follows from the contradiction between (4) and (5). Therefore, you cannot simply "deny" (6) without altering the premises that generate it. The substantive premises carrying the weight of the dilemma are **(5)** and **(7)**.

  *   **Premise (5)** claims Madhyamaka asserts emptiness is the *ultimate truth*.
  *   **Premise (7)** claims that if it is not *ultimately true* (in the sense implied by the dilemma), it is *toothless*.

  To save Madhyamaka while keeping (1), (2), and (4), the defender **must qualify (5) and consequently deny (7).**

  The error lies in an equivocation on the phrase **"ultimate truth" (*paramārtha-satya*)** in premise (5). The argument assumes "ultimate truth" means "a proposition that corresponds to the ultimate nature of reality and possesses ontological stability." Madhyamaka, however, defines "ultimate truth" as "the cessation of conceptual proliferation (*prapañca*)," which is itself empty.

  ### 2. The Step to Reject: Premise (5)

  You must reject the unqualified formulation of **(5)**.

  **The Revision:** Madhyamaka does not assert that "all phenomena are empty" is an *ultimately true proposition* (which would imply the proposition itself has *svabhāva*). Instead, it asserts that "all phenomena are empty" is a **conventional teaching** that designates the ultimate (the absence of intrinsic nature).

  Nāgārjuna writes in *MMK* 24.10: *"Without relying on convention, the ultimate is not taught. Without understanding the ultimate, nirvāṇa is not attained."* Emptiness is a conventional tool used to reach the ultimate perspective, which is the silence of views.

  **Why this fits your constraints:**
  *   It keeps (1): The tetralemma rejects intrinsic existence.
  *   It keeps (2): Emptiness is a phenomenon/view.
  *   It keeps (4): You cannot assert the view is *ultimately existent* or *intrinsically true*.
  *   It modifies (5): You *can* assert it is "the ultimate truth" only in the sense that it is the *medicine* that cures the disease of reification, not that it is a *really existing medicine*.

  ### 3. The Cost: What the Defender Pays

  By rejecting the realist reading of (5), the Madhyamaka defender pays a significant philosophical price. They must abandon **Philosophical Realism** for **Therapeutic Anti-Foundationalism**.

  **Cost A: Ontological Humility**
  The defender cannot claim that Madhyamaka describes "how things really are" in a way that other philosophies fail to do. They cannot say, "Realism is false and Emptiness is True." They must say, "Realism is a conceptual fixation, and Emptiness is the remedy for that fixation."
  *   *Price:* You lose the comfort of knowing your philosophy matches Reality. You only know it matches the *soteriological need* of the practitioner.

  **Cost B: The Status of Logic**
  If (5) is qualified, logic itself becomes merely conventional. The law of non-contradiction (which drives your step 6) applies conventionally, not ultimately.
  *   *Price:* You cannot use logic to prove Madhyamaka is "correct" in an ultimate sense. You can only use logic to show rivals are *incoherent by their own standards* (the *prasaṅga* method). You are immune to refutation only because you hold no thesis (*pratijñā*), as Nāgārjuna claims in *VV* 29.

  ### 4. Addressing Premise (7): The "Toothless" Charge

  Once (5) is qualified, you are forced to **deny (7)**. Your classmate is correct that (7) presents a false dilemma, but your skepticism is also philosophically astute. Here is how to resolve the tension between you and your classmate.

  **Premise (7):** *If the claim is not ultimately true, it is just one conventional view among others... and the critique loses its point.*

  **The Madhyamaka Denial:** A view can be "merely conventional" and still have **causal efficacy**.
  *   *Analogy:* A dream-tiger is not "really" a tiger (it has no *svabhāva*), but it can still terrify a dreamer. A conventional medicine is not "ultimately" a medicine (it is empty of intrinsic healing power), but it can still cure a conventional illness.
  *   *The Defense:* Madhyamaka is a conventional view that has the specific causal power to dismantle other conventional views. It is "better" not because it is *truer* (correspondence), but because it is *more effective* (pragmatics) at ending suffering.

  **Addressing Your Worry:** You wrote: *"I do not see how being better at curing is anything but one more ultimate claim in disguise."*

  This is the crux of the seminar debate. Here is the distinction you are looking for:
  *   **Ultimate Claim:** "This view corresponds to the intrinsic nature of reality." (Madhyamaka denies this).
  *   **Causal Claim:** "This view, when adopted, causes the cessation of grasping." (Madhyamaka affirms this).

  Causal claims are part of **Dependent Origination (*pratītyasamutpāda*)**, which is the domain of **Conventional Truth**. To say "fire burns" is a conventional truth; it does not require fire to have *svabhāva*. Similarly, to say "emptiness cures reification" is a conventional truth. It does not require emptiness to have *svabhāva*.

  **The Cost of Denying (7):**
  By denying (7), the defender admits that Madhyamaka is **contingent**. If beings did not suffer from reification, Madhyamaka would be unnecessary. It has no standing independent of the disease it cures. It is "toothless" against someone who does not wish to be cured of suffering, and it makes no claim that such a person is "wrong" in an ultimate sense, only that they are trapped in *saṃsāra*.

  ### 5. Summary of Alternatives

  | Step to Reject | What it Means | The Cost | Viability |
  | :--- | :--- | :--- | :--- |
  | **Reject (1) or (2)** | Admit some phenomena (like Emptiness) have *svabhāva*. | **High.** Collapses Madhyamaka into the essentialism (Svātantrika or Yogācāra) it seeks to critique. Violates your constraints. | Low |
  | **Reject (4)** | Assert Emptiness is ultimately true (has intrinsic status). | **High.** Leads to direct contradiction with (1). Makes "Emptiness" just another reified entity ("Empty-ism"). | Low |
  | **Reject (5)** (Qualified) | Deny Emptiness is "ultimately true" in a realist sense. | **Medium.** Loses ontological superiority. Madhyamaka becomes a therapy, not a metaphysics. | **High** (Standard Prāsaṅgika move) |
  | **Reject (7)** | Deny that "conventional" means "toothless." | **Medium.** Requires defending pragmatic efficacy without ontological grounding. (Your main worry). | **High** (If paired with rejecting 5) |

  ### Recommendation for Your Seminar

  You should advise your classmate that **rejecting (7) is insufficient on its own.** If they simply say "It's therapeutic," without qualifying (5), the opponent will reply: "Is the claim 'it is therapeutic' ultimately true or not?" If ultimately true, you are back to (6). If not, why should we trust it?

  The robust solution is to **reject the realist interpretation of (5)**, which then allows you to **deny (7)** without contradiction.

  **The Verdict:**
  1.  **Keep (1), (2), (4).** (As you wished).
  2.  **Reject (5)** as formulated. Replace with: "Madhyamaka asserts emptiness as a conventional remedy that designates the ultimate."
  3.  **Deny (7).** A conventional remedy need not be ultimately real to be effective.
  4.  **The Price:** You must accept that Madhyamaka is **not a theory of everything**, but a **strategy for deconstruction**. It claims no territory. It wins by having no position to attack.

  This preserves the integrity of the tetralemma and the emptiness of views, but it costs you the ability to say Madhyamaka is "True" in the way a physicist might say gravity is true. It is "true" only in the way a ladder is "true": useful for climbing, to be discarded upon arrival.
