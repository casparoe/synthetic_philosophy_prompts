answer: |-
  This is a sophisticated impasse because it cuts to the heart of the philosophy of economic science. Your improvised distinction—between **load-bearing** assumptions (those essential to the derivation, where realism matters for validity) and **scaffolding** assumptions (idealizations that simplify without driving the result)—maps closely onto contemporary debates about *robustness* and *structural identification*.

  Your friend argues that Friedman's "F-twist" (instrumentalism) blinds us to this distinction, allowing models to stand even when their core mechanisms are false. You suspect the distinction exists but doesn't do the work your friend thinks it does.

  Here is the breakdown of the implications of the F-twist for your distinction, the legitimacy of objections, and the question of truth, followed by a verdict on whether Friedman can draw the line your friend wants.

  ### 1. When is "But the Assumptions Are False" a Legitimate Objection?

  For Friedman, the realism of assumptions is never an independent criterion for judging a theory. Therefore, the legitimacy of the objection "the assumptions are false" depends entirely on whether you are attacking the theory's **purpose** or its **performance**.

  *   **Scaffolding Assumptions:** Friedman would agree with you here. If an assumption is merely scaffolding (e.g., assuming a continuum of agents when there are finitely many), its falsity is irrelevant provided the prediction holds. Criticizing a model on these grounds is, for Friedman, a category error. It confuses the map with the territory.
  *   **Load-Bearing Assumptions:** This is where the deadlock lies. Your friend argues that if a load-bearing assumption is false (e.g., assuming agents maximize expected utility when they use heuristics), the model is invalid *even if it predicts well*, because it relies on a falsehood to generate the result.
      *   **The F-Twist Response:** Friedman rejects this. For him, an assumption is only "too false" if relaxing it causes the predictions to fail. If a load-bearing assumption is false but the model predicts accurately, Friedman argues the assumption is capturing some *essential* force, even if descriptively inaccurate.
      *   **Implication:** Under the F-twist, the objection "the assumptions are false" is **never legitimate as a standalone critique**. It is only legitimate as a shorthand for "the predictions will fail in contexts where this assumption does not hold."

  **Verdict:** The F-twist renders the distinction between load-bearing and scaffolding **operationally invisible** until *after* a prediction fails. You cannot identify a load-bearing assumption as problematic *ex ante*; you can only discover it *ex post* when the model breaks.

  ### 2. Does Predictive Success Imply Truth?

  This is the core of the instrumentalist vs. realist debate.

  *   **Friedman's View:** No. Predictive success implies **utility**, not truth. A theory is a "file of rules," a machine for generating predictions. If the machine works, it is "true enough" for the purpose at hand, but we cannot infer that the internal gears (assumptions) resemble the causal structure of the world.
  *   **The Implication for Your Distinction:** If success does not imply truth, then the distinction between load-bearing and scaffolding assumptions loses its ontological weight.
      *   If a model predicts well using a false load-bearing assumption, Friedman argues we should treat that assumption *as if* it were true for the sake of the model, because it is functionally necessary.
      *   Your friend wants the distinction to protect **explanatory power**. They want to know *why* the prediction works. Friedman is indifferent to the *why*, provided the *what* is accurate.

  **Verdict:** The F-twist severs the link between prediction and truth. Consequently, it prevents us from using predictive success to validate the "load-bearing" nature of an assumption. A model can predict well for the "wrong" reasons (spurious correlation, coincidental offsetting errors), and the F-twist licenses it.

  ### 3. Can the F-Twist Draw the Distinction?

  **The short answer is no.**

  Friedman's methodology cannot draw the distinction your friend wants in a way that constrains model-building *before* empirical testing.

  Friedman acknowledges that assumptions matter *for* prediction. He writes that a hypothesis is important if it "explains much by little." But he defines "explains" purely instrumentally. He does not care if the "little" (the assumptions) corresponds to reality.

  Your friend wants a normative rule: *Do not build models where the result depends on a known falsehood.*
  Friedman's rule is: *Build models that predict. If they depend on a falsehood, so be it, provided they continue to predict.*

  ### 4. What Does This Blindness Cost?

  If the F-twist cannot distinguish between load-bearing falsehoods and scaffolding falsehoods *normatively*, it incurs three specific costs. Your friend is right to be worried about these, even if their phrasing of the distinction was improvised.

  #### A. The Fragility Cost (The Lucas Critique)
  This is the most severe cost. If you do not care whether your load-bearing assumptions are realistic, you risk building models that rely on stable correlations that are not structural.
  *   **Example:** A model might predict inflation well by assuming a fixed relationship between unemployment and inflation (the Phillips Curve), based on the "load-bearing" assumption that expectations are static.
  *   **The Failure:** As long as policy doesn't change, the model predicts well (scaffolding holds). But because the load-bearing assumption (static expectations) is false, a change in policy regime causes the model to collapse catastrophically.
  *   **The Cost:** By ignoring the realism of load-bearing assumptions, the F-twist licenses models that are **non-robust to regime changes**. It trades structural understanding for short-term predictive fit.

  #### B. The Black Box Cost (Loss of Explanation)
  Science aims not just to predict, but to understand mechanisms.
  *   If a model relies on a load-bearing false assumption (e.g., perfect information), it may predict outcomes correctly in a specific environment. However, it tells us nothing about *how* the economy actually processes information.
  *   **The Cost:** We accumulate a toolkit of "black boxes" that work until they don't, without accumulating genuine knowledge about the underlying causal machinery. We become engineers who can fix the radio but don't understand electricity.

  #### C. The Theory Selection Cost
  If two models predict equally well, but Model A uses realistic load-bearing assumptions and Model B uses false ones, Realism prefers A. The F-twist is indifferent.
  *   **The Cost:** This creates a **degenerative research program**. It encourages theorists to add *ad hoc* assumptions to save a prediction rather than revising the core mechanism. If the assumption is load-bearing and false, the theory is essentially a curve-fitting exercise. The F-twist makes it difficult to distinguish between a deep theory and a sophisticated fit.

  ### Summary for Your Argument

  You can resolve your deadlock with the following synthesis:

  1.  **You are right** that the distinction between load-bearing and scaffolding assumptions does no work *for the immediate purpose of prediction in a stable environment*. If the model predicts, the falsity of the assumption is functionally irrelevant. Friedman wins on **instrumental utility**.
  2.  **Your friend is right** that the F-twist is blind to this distinction *for the purpose of scientific progress and policy stability*. By refusing to penalize load-bearing falsehoods, the F-twist encourages models that are fragile under structural change and offer no explanatory insight. Friedman loses on **structural validity**.

  **The precise cost of the F-twist's blindness:** It prevents economics from distinguishing between a theory that captures a **causal mechanism** and one that captures a **contingent regularity**. It allows economists to claim their models are "valid" based on past data, even when the load-bearing assumptions guarantee the model will fail the moment the environment shifts. Your friend's intuition is a pre-emptive strike against the Lucas Critique; Friedman's methodology leaves the door open for it.
