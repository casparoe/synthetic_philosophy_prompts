prompt: |-
  I have no philosophical training, but I've spent a while trying to get clear on a disagreement about laws of nature that I keep running into. As I understand it, one side holds that a law of nature is nothing over and above the most economical way of summarizing everything that ever happens, while the other side holds that the regularities are regularities because something makes them so, and that the law is that something. I've been picturing the first view as a checksum: computed from the data, certifying them but never producing them. The second I picture as a key that generates the data without being part of them. I gather these are called the Humean and anti-Humean views, though I may have the labels the wrong way round.

  Please compare my two pictures with the two positions. Tell me which picture belongs with which, and where the checksum picture distorts the position it's meant to capture — in particular, whether the "summary" side really thinks laws are merely descriptions. Then tell me whether the disagreement is a disagreement about the world or only about how to describe it, and what each picture would say about a world in which nothing ever changes, since it isn't obvious to me that such a world contains any pattern for a law to be.

  Be explicit about which parts of your answer are standard and which are your own reconstruction, and say which consideration would most likely change your mind about the mapping you give me. Keep the whole response under 500 words.
