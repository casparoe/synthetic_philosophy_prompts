  *(Self-Correction on "Consistency"):* Be careful. Some argue Consistency is an assumption about interference (SUTVA). But the core $Y = Y_a$ is definitional *if* $a$ is well-defined. I will align with the user's intuition but nuance it: it's a condition on the *intervention* being well-defined.

  *(Self-Correction on "Strong Transcendental"):* Kant doesn't say "Objects exist." He says "We must synthesize experience *as if* objects exist." The "Strong" reading is often a misreading (Dogmatic Realism). I need to address the user's definition of "Strong" (anti-sceptical/ontological) even if Kant scholars might quibble, because that's the user's premise. I will treat "Strong" as "Metaphysical Realism derived from transcendental premises."

