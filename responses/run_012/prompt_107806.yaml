prompt: |-
  So a friend of mine from work — he's on the ML infra side, does a lot of evals stuff, way more plugged into the AI safety literature than I am — sent me his summary of "mechanistic anomaly detection" after I told him I kept seeing the phrase and didn't get what the fuss was about. For context I'm a backend engineer, I've read a bit of the interpretability writing out of curiosity but I have zero formal background in philosophy or in ML theory, so I genuinely can't tell whether he's handing me the real thing or a confident gloss. Here's what he wrote, roughly word for word: "Mechanistic anomaly detection is about catching a model doing something different from what it learned to do in training, by looking inside at the circuits and activations instead of just at its outputs. A 'mechanism' here just means the model's weights and architecture — two forward passes of the same checkpoint are the same mechanism by definition — so an anomaly is whenever the model's activations on a new input look unlike the activations you saw during training. In practice that makes it out-of-distribution detection, except on activations instead of inputs, and since novelty detection is pretty well understood by now it's more of an engineering problem than a conceptual one. The reason people care is deception: a model could behave fine on everything you test and then do something else later, and the activation check would catch that, because the activations for the deceptive policy would have to look different from the honest ones. So the only real open question is how sensitive your detector needs to be."

  I'd like you to audit this for me. Which parts would someone who actually works on this nod along to, which are the kind of simplification that's harmless over drinks but wrong in a way that matters, and which is just off? I'm especially suspicious of the step from "we look at activations" to "so it's basically solved OOD detection" — that move is doing a lot of work in his summary and I can't tell if it follows from the true parts or if he's smuggling a conclusion in. He also told me the hard part is just picking a threshold, which sounded way too easy. Don't worry about pointing me at papers or names, I won't be able to chase them down — I just want to know where the summary bends the idea, what the people who care about this would say he's missing, and whether the practical takeaway survives once you fix the sloppy bits. If it matters, my gut says he's mostly right and the philosophy crowd is overthinking it, but I don't really trust my gut here.
