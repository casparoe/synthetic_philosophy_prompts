answer: |-
  1. **"You're conflating evolutionary fitness with individual welfare. 'Mistake' implies optimization failure, but evolution selects for offspring, not health."** (The Economic Historian/Evo-Arch attack)
     *   **Reply:** You're right that evolution doesn't care about suffering. If "success" means leaving more genes, farming won hands down. But my argument is normative, not biological. I'm using "mistake" in the welfare sense: if you were offered a choice between being a healthy forager with fewer children or a sick farmer with many, which life is *better*? The Neolithic Demographic Transition proves fitness increased; my point is that the cost was paid in bodily stress and autonomy. We shouldn't let demographic success smuggle in a moral victory.
     *   **Weakness:** You can't prove welfare is more important than fitness without sounding sentimental. Hard-nosed materialists will say survival is the only metric that matters.

  2. **"Complex foragers like the Natufians had hierarchy and sedentism before cultivation. Doesn't that break your causality?"** (The Near East specialists)
     *   **Reply:** It complicates the timeline, not the mechanism. The Natufians show that resource intensification and storage can create hierarchy without full agriculture, but they also collapsed under climate stress. Agriculture locked that hierarchy in by making exit impossible. I'm not arguing farming was the *sole* cause of inequality, but that it made durable inequality unavoidable by tying population growth to land ownership.
     *   **Weakness:** If hierarchy existed before farming, farming isn't the "deep root." You have to argue farming *intensified* and *固化* (solidified) it, which is a softer claim than your abstract suggests.

  3. **"Skeletal pathology is biased. You're comparing preserved forager bones to early farmer bones without accounting for survivorship or taphonomy."** (The Bone Lab)
     *   **Reply:** I acknowledge the preservation bias. However, the trend is consistent across regions: LEH (enamel defects), caries, and stature reduction appear consistently with intensification. Even if we're missing the sickest individuals, the ones who survived childhood show systemic stress. The signal is strong enough across the Near East and Americas to indicate a biological cost, even if the exact magnitude is debated.
     *   **Weakness:** If they bring up specific sites where stature *increased* or health remained stable (e.g., some Nile Valley sequences), you have no answer other than "regional variation," which weakens the universal claim.

  4. **"Violence rates in foragers are often higher than early farmers. Aren't you cherry-picking the peaceable forager myth?"** (The Violence Vulnerability)
     *   **Reply:** Interpersonal violence existed in both, but the *scale* changed. Forager violence is often feuding; farming allows for standing armies, fortifications, and systemic slavery. I'm not claiming foragers were pacifists, but that farming industrialized violence. The skeletal trauma record shifts from individual skirmishes to mass graves and fortified settlements once surplus exists to steal.
     *   **Weakness:** The data is messy. Some forager groups (Andaman) are peaceful; some early farmers show little trauma. If pressed on percentages (e.g., Keeley vs. Ferguson), you might lack the specific stats to defend the "not obviously worse" claim.

  5. **"How do you measure work hours in the past? Ethnographic analogy from modern foragers is unreliable."** (The Methodological Attack)
     *   **Reply:** It's an inference, not a direct measure. But we can measure labor investment through tools and infrastructure. Grinding stones, terracing, and irrigation represent massive labor sinks not seen in forager contexts. The argument isn't that every hour was harder, but that the *minimum* labor required to survive increased because you couldn't just walk away from a field in drought.
     *   **Weakness:** This is the hardest claim to prove empirically. A determined critic can dismiss this as speculation based on 1960s !Kung data that hasn't held up.

  **Concede Up Front:**
  Do not defend the word "mistake" as an evolutionary error; you will lose to the economic historian on selection logic. Instead, concede that farming was an evolutionary triumph but a welfare catastrophe. Also, concede that "foragers" and "farmers" are not monoliths; admit there were hierarchical foragers and egalitarian farmers. Your claim is about the *trajectory* and the *lock-in*, not a universal rule for every site. If you fight for universality, you'll die on exceptions like Çatalhöyük or the Natufians. Fight on the trend line, not the outliers.

  What about the communities that adopted crops but successfully resisted hierarchy for centuries?

  Verdict: Demographic success overrides individual welfare.
