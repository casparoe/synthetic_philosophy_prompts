answer: |-
  **JOINT STATEMENT ON THE BOUNDARIES OF THE COGNITIVE**
  **Adversarial Collaboration Outcome**
  **Signatories:** The Extended Cognition Working Group & The Internalist Constraints Group

  **1. AGREED CLAIMS**

  We have identified five substantive claims upon which we agree. These are not merely trivial acknowledgments but concessions required to move the debate forward.

  1.  **The Parity Principle is Methodological, Not Metaphysical.** We agree that the Parity Principle ("if a process in the world functions like a process in the head, treat it as cognitive") is a heuristic for generating hypotheses, not a proof that external processes *are* cognitive. The Internalists concede it successfully exposes intracranial chauvinism; the Extensionalists concede it does not settle the constitution question.
  2.  **Causal Coupling is Necessary but Disputedly Sufficient.** We agree that for any external resource to be cognitively relevant, it must be causally coupled to the agent. We disagree only on whether that coupling can ever constitute the cognitive process itself.
  3.  **The "Bloat" Worry Applies to Both Sides.** We agree that if functional role defines cognition, Internalists face a "neural bloat" problem (why are some neural firings non-cognitive?) just as Extensionalists face a "world bloat" problem (why isn't the whole library part of Otto?). Both sides must provide a principled mark of the cognitive.
  4.  **Reliability and Accessibility are Constraints.** We agree that for an external resource to function *like* memory, it must be reliably available and easily accessible. A notebook left at home does not support the same claim as one carried in the pocket.
  5.  **Explanatory Power is the Adjudicator.** We agree that the final arbiter is not intuition but explanatory utility. If treating a system as extended yields better predictions in psychology or neuroscience than treating it as internal, that view gains precedence.

  **2. DISAGREEMENTS TABLE**

  | Sub-Question | Extended Cognition Formulation | Internalist Formulation |
  | :--- | :--- | :--- |
  | **Location of Process** | Cognitive processes are not spatially bounded by the skull; they span brain, body, and environment. | Cognitive processes are intracranial; environmental interactions are causal inputs and outputs, not parts of the process. |
  | **Constitution vs. Causation** | Tight causal coupling can constitute cognitive processing (the Coupling-Constitution link is valid). | Causal coupling never amounts to constitution; confusing the two commits the Coupling-Constitution Fallacy. |
  | **The Mark of the Cognitive** | A process is cognitive if it plays the functional role of cognition, regardless of the substrate (vehicle externalism). | A process is cognitive only if it possesses intrinsic non-derived content or specific biological mechanisms (vehicle internalism). |
  | **Agency Boundaries** | The cognitive agent is the whole system (organism + resource); agency can be distributed. | The agent is the biological organism; resources are tools used by the agent, not parts of the agent. |

  **3. THE CRUXES: PREDICTIONS AND TEST CASES**

  We identified four specific points of contention where empirical findings or refined thought experiments could shift our positions. We have refined the initial list of disputes to focus on *Agency* and *Endorsement* rather than merely head-counting.

  **Crux 1: The Mark of the Cognitive (Intrinsic vs. Functional)**
  *   **The Issue:** Is there a property intrinsic to neural processing that makes it cognitive, which external tools lack?
  *   **Test Case:** Neuroplasticity studies where sensory cortex is repurposed for mathematical calculation via technological interfaces.
  *   **Extensionalist Prediction:** If the brain treats the tool as a sensory organ, the tool is part of the cognitive vehicle.
  *   **Internalist Prediction:** The cognition remains in the neural repurposing; the tool is merely the stimulus structure.

  **Crux 2: Coupling vs. Constitution**
  *   **The Issue:** Does high-bandwidth causal interaction create a new ontological whole?
  *   **Test Case:** Real-time brain-computer interfaces (BCI) controlling a cursor.
  *   **Extensionalist Prediction:** The cursor's trajectory is part of the motor planning process.
  *   **Internalist Prediction:** The cursor is the effect of motor planning, not the planning itself.

  **Crux 3: Endorsement and Trust (The Marisol Case)**
  *   **The Issue:** Otto wrote his notes; he endorsed them. Marisol inherits her twin's notebook. She carries it everywhere, consults it automatically, and relies on it as much as her biological memory. However, she did not write the entries, and some contain errors she cannot identify.
  *   **Extensionalist Prediction:** The notebook is part of Marisol's memory system, but it is a *corrupted* or *pathological* memory system. Extension allows for error (just as biological memory fails). The lack of original authorship does not negate functional integration.
  *   **Internalist Prediction:** This is not memory; it is testimony. Because Marisol cannot distinguish truth from error within the book, she lacks the necessary "glue and trust." She is trusting a document, not remembering. This case breaks the parity with Otto because the endorsement condition is missing.
  *   **Agreed Bearing:** If Marisol is held morally responsible for errors in the book as if they were her own memories, Extensionalism is supported. If she is treated as a victim of misinformation, Internalism is supported.

  **Crux 4: Agency and Manipulation (The Assistant Case)**
  *   **The Issue:** An agent outsources deliberation to an assistant known to have conflicting ends (e.g., a lawyer or algorithm optimizing for profit, not truth). Is this an extended mind or social manipulation?
  *   **Extensionalist Prediction:** This is a distributed cognitive system with *conflicting goal states*. It is still one cognitive system, but a dysfunctional one. Extensionalism must accommodate systems where the components have divergent interests.
  *   **Internalist Prediction:** This is two agents interacting. The presence of conflicting ends proves there are two distinct cognitive systems, not one extended one. Cognition requires a unified teleology.
  *   **Agreed Bearing:** If the agent feels the assistant's reasoning as their own (phenomenological transparency), Extensionalism gains ground. If the agent feels coerced or negotiated with, Internalism holds.

  **4. METAPHYSICAL OR LINGUISTIC?**

  We conclude by addressing whether our dispute is about the world or our words.

  We agree that a significant portion of the debate is linguistic: specifically, what work the word "cognitive" is meant to do. If "cognitive" is a natural kind term (like "water" or "gold"), Internalism is likely correct, as there is probably a specific biological substrate for thinking. If "cognitive" is a functional label (like "calculator" or "engine"), Extensionalism is likely correct, as anything performing the function counts.

  However, this is not *merely* verbal. The stakes involve responsibility, privacy, and psychological explanation.
  1.  **Responsibility:** If Marisol's notebook is her memory, she is responsible for its contents. If it is merely a document, she is only responsible for her reliance on it.
  2.  **Privacy:** If the Assistant is part of my cognitive system, do they have rights to my thoughts, or do I have rights to their labor?
  3.  **Explanation:** If we treat the Assistant as part of the system, we look for faults in the *link*. If we treat them as external, we look for faults in the *agent's trust*.

  **Conclusion:**
  We disagree on the metaphysics of constitution, but we agree that the linguistic label tracks these metaphysical commitments. Even if we agreed to stop using the word "cognitive" for external processes, we would still disagree on whether the *explanatory strategies* of cognitive science should apply to the coupled system. The Extensionalist wants to model the Marisol-Notebook system using memory models. The Internalist wants to model it using testimony and trust models. This methodological divergence remains even if the terminology is settled.

  ***

  **Tutor's Note on Your Crux Guesses:**

  You asked me to tell you which of your guessed cruxes were wrong or missing. Here is the breakdown based on how I constructed the document:

  1.  **Principled Criterion (The Mark of the Cognitive):** You were **right**. This is the biggest missing piece in the original Clark/Chalmers paper (Adams & Aizawa's main critique). I made this Crux 1.
  2.  **Coupling vs. Constitution:** You were **right**. This is the "Coupling-Constitution Fallacy." I made this Crux 2.
  3.  **Trust/Endorsement:** You were **right**, but it's more specific than just "trust." It's about *endorsement* and *history*. Otto endorsed his notes; Marisol didn't. This is crucial for the "glue and trust" condition. I made this Crux 3.
  4.  **Two Agents:** You were **slightly off**. The issue isn't just "can there be two agents?" (Internalists always say yes, there are two agents). The issue is **Agency and Teleology**. If I outsource to someone with *different goals*, does the system break? This is about whether a cognitive system requires a unified purpose. I refined this into Crux 4.

  **What you missed:**
  *   **The Linguistic/Metaphysical Distinction:** You hinted at it in the last prompt requirement, but it's often a crux itself. Is "cognitive" a natural kind (biology) or a functional kind (job description)? I included this in Section 4.
  *   **Explanatory Utility:** Philosophers often forget that the goal is *prediction*. I included this in Agreed Claim #5. If extending the mind doesn't help us predict behavior better, Internalists win by default.
