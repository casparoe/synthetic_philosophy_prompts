prompt: |-
  I'm a PhD student in philosophy working on virtual worlds, and I want to know what principle, if any, my verdicts about them add up to. Stated flatly: when a stranger's avatar gropes mine in a VR social space, I was harassed — a real violation, not a rude gesture in a cartoon. When I shoot a scripted NPC that begs for its life, I have done nothing to anyone. When another player kills my character in a PvP zone I knowingly entered, likewise no wrong; but when a player uses an exploit to follow me out of that zone and kill me over and over for an hour, I have been harmed, and it is harassment rather than bad manners. When my account is broken into and my rare items are sold, I have been robbed, though the items are rows in a database. When the company that hosts the world I spent a decade building a house in shuts it down, I have lost something real, but no real thing was destroyed. When a friend dies and their avatar still stands where they logged out, my visits to it are real mourning, but I am not visiting them; and when a chatbot trained on their messages takes the avatar over and speaks in their voice, it is not them, and being comforted as if it were is a kind of self-deception.

  My tentative principle is what I have been calling the presence view: a virtual entity is real, and a proper object of concern, exactly insofar as some real person is actually present in it or actually stands behind it — my avatar is me while I am in it, the NPC is nobody, the abandoned avatar is a shell. That seems to give me the groping, both killings, the standing avatar and the griefbot; but it says nothing about why the consensual killing and the exploit killing come apart, since I am equally present in both, and it seems to make the theft unreal, since no one is present in my items, only an institution everyone is treating as real. Tell me what the principle should be, or what the smallest set of them is, stated precisely enough that I can see which clause is doing which work and which of my cases forces each clause; the verdicts it forces on cases I have not listed — a company that sells a memorial copy of a dead user's avatar to strangers, and a world whose NPCs have become indistinguishable from players, so that no one in it can tell who is present; and which of my verdicts it cannot save. The one I keep going back and forth on: someone builds a replica of my late friend's avatar from their chat logs, passes it off as them, and gets me to confide what I would tell no stranger. I want to say I have been defrauded, but on my other verdicts nothing real was done to me, since the thing that fooled me was never my friend and may not have been anything at all.
reasoning: |-
  Here's a thinking process that leads to the suggested principles:

  1.  **Analyze the User and Request:**
      *   **User:** PhD student in philosophy working on virtual worlds (ontology/ethics of VR).
      *   **Task:** Identify the underlying principle(s) governing their specific moral/intuitional verdicts on various VR scenarios. Refine, critique, and expand these principles to cover edge cases.
      *   **Input Data (Verdicts):**
          1.  Avatar groping = Harassment (Real violation).
          2.  Shooting begging NPC = No wrong (Nothing done to anyone).
          3.  Consensual PvP kill = No wrong.
          4.  Exploit griefing (repeated killing) = Harm/Harassment.
          5.  Account hack/item theft = Robbery (Real).
          6.  Server shutdown (loss of house) = Lost something real, but no real thing destroyed.
          7.  Dead friend's idle avatar = Real mourning, but not visiting *them*.
          8.  Griefbot (chatbot using dead friend's data) = Not them, comfort is self-deception.
          9.  *Pending/Unresolved:* Replica avatar fraud (confiding in fake friend) = Feels like fraud, but conflicts with "nothing real done to me."
      *   **Current Hypothesis:** "The Presence View" (Realness depends on a real person being present/behind the entity).
      *   **Problems with Current Hypothesis:**
          *   Doesn't explain the difference between Consensual PvP vs. Exploit Griefing (Presence is constant in both).
          *   Doesn't explain Item Theft (No person present *in* the items, yet it's robbery).
          *   Struggles with the Fraud case (Is the harm real if the object isn't real?).
      *   **Requirements:**
          *   State the principle(s) precisely.
          *   Show which clause handles which case.
          *   Apply to new cases (Memorial copy sale, Indistinguishable NPCs).
          *   Identify which verdicts *cannot* be saved.
          *   Address the Fraud case specifically.

  2.  **Deconstruct the Verdicts to Find Underlying Values:**
      *   *Groping:* Harm to the *user* via the avatar. (Agency/Embodiment).
      *   *NPC Death:* No moral patient involved. (Lack of Sentience/Agency).
      *   *PvP vs. Griefing:* Consent and Expectation vs. Disruption of Agency. (Normative Expectations/Institutional Facts).
      *   *Item Theft:* Value derived from institutional recognition and labor/investment, not just physical substrate. (Institutional Reality/Property Rights).
      *   *Server Shutdown:* Loss of value/access, but ontological nihilism regarding the "house." (Institutional vs. Brute Reality).
      *   *Dead Avatar/Griefbot:* Respect for the dead vs. Truth about identity. (Memory vs. Identity).
      *   *Fraud:* Violation of trust/autonomy, even if the "person" isn't real. (Psychological Harm/Deception).

  3.  **Critique "The Presence View":**
      *   It's too narrow. It focuses on *ontological presence* (is a mind behind this?) but misses *normative context* (what are the rules?) and *institutional reality* (what do we agree has value?).
      *   The "Exploit Killing" case kills the pure Presence View. I am present in both PvP and Griefing. The difference is *consent* and *adherence to shared norms*.
      *   The "Item Theft" case kills the pure Presence View. Items aren't "present" persons, but they are extensions of agency/property.

  4.  **Develop a Better Framework:**
      *   We need a hybrid view. Let's call it the **Extended Agency & Institutional Reality View**.
      *   *Core Idea:* Virtual objects/actions are morally significant to the extent that they mediate, extend, or constitute the agency, welfare, or legitimate expectations of actual persons within a shared normative framework.
      *   *Clause 1: Embodied Agency (The Groping Case).* The avatar is an extension of the user's bodily autonomy. Violating the avatar violates the user.
      *   *Clause 2: Institutional Norms & Consent (The PvP vs. Griefing Case).* Actions are judged by the normative framework agreed upon (ToS, game rules, social norms). PvP is consented; griefing violates the implied social contract of fair play.
      *   *Clause 3: Derivative Value & Property (The Theft/Shutdown Case).* Virtual items are real property because they represent labor, investment, and are recognized by the institution (company/community). Their destruction is a harm to the owner's interests, even if the "stuff" is code.
      *   *Clause 4: Truth & Identity (The Griefbot/Fraud Case).* Misrepresenting identity violates the victim's autonomy to choose who they engage with. The harm is the deception, not the ontological status of the bot.

  5.  **Drafting the Principles (Iterative Refinement):**
      *   *Attempt 1:* Realness = Person + Rules + Value. (Too vague).
      *   *Attempt 2:* **The Mediated Agency Principle.** Virtual interactions are real harms when they negatively impact a real person's agency, welfare, or legitimate expectations established by the virtual institution.
      *   *Refinement:* Need to separate the *ontological* claim (is it real?) from the *moral* claim (is it wrong?). The user asks for a principle their *verdicts* add up to. The verdicts are moral/ontological hybrids ("I was harassed," "I have been robbed").
      *   *Proposed Principle:* **The Normative Extension Principle.** Virtual entities and events acquire moral weight and ontological significance derivatively, based on their functional role in mediating the interests, agency, and normative expectations of actual persons within a recognized institutional framework.

  6.  **Mapping Cases to Clauses:**
      *   *Groping:* Mediates bodily autonomy/agency. (Clause: Embodied Agency).
      *   *NPC:* No person mediated. (Clause: Absence of Human Interest).
      *   *PvP vs. Griefing:* Mediates agency within vs. outside normative expectations. (Clause: Institutional Consent).
      *   *Theft:* Mediates property interests recognized by institution. (Clause: Institutional Property).
      *   *Shutdown:* Loss of institutional access, not brute matter. (Clause: Institutional Ontology).
      *   *Dead Avatar:* Mediates memory, not identity. (Clause: Representation vs. Identity).
      *   *Fraud:* Mediates trust/autonomy via deception. (Clause: Veridical Interaction).

  7.  **Addressing the "Hard Cases" (New Scenarios):**
      *   *Memorial Copy Sale:* Selling a dead user's avatar.
          *   Analysis: Violates the dignity/legacy of the dead (if they cared) and misleads buyers. It commodifies a representation of a person without consent.
          *   Verdict: Wrongful commodification/Desecration of memory.
      *   *Indistinguishable NPCs (Turing Test World):*
          *   Analysis: If users *believe* they are people, the *interaction* is real in terms of emotional investment. However, if the company knows and hides it, it's mass deception.
          *   Verdict: If known: No wrong (like acting). If hidden: Mass fraud (violates consent to interact with AI).

  8.  **Addressing the "Unresolvable" Tension (The Fraud Case):**
      *   *Case:* Fake friend avatar gets confidences.
      *   *Conflict:* "Nothing real done to me" (because friend isn't there) vs. "I have been defrauded."
      *   *Resolution:* The harm *is* real. The harm isn't to the *relationship* (which didn't exist), but to the *victim's autonomy and psychological safety*. The principle must prioritize the *subject's experience of agency* over the *object's ontological status*.
      *   *Verdict:* You *were* harmed. The principle saves this by focusing on the violation of *your* choice to confide, not the status of the listener.

  9.  **Structuring the Response:**
      *   **Acknowledge the PhD level:** Use precise terminology (ontology, normative frameworks, institutional facts).
      *   **Diagnose the "Presence View":** Explain why it fails (the PvP/Griefing distinction and the Theft case).
      *   **Propose the New Principle:** "The Normative Extension Principle" (or similar). Break it down into clauses.
      *   **Map the Input Cases:** Show exactly which clause handles which verdict.
      *   **Apply to New Cases:** Memorial sale, Indistinguishable NPCs.
      *   **Address the Fraud Case:** Explain why the intuition of fraud is correct and how the principle supports it (shifting focus from object to subject).
      *   **Identify the Cost:** What verdict must be sacrificed or nuanced? (Likely the "no real thing was destroyed" in server shutdown needs nuance—it *is* a destruction of institutional fact).

  10. **Refining the Principle Name:** "The Mediated Agency and Institutional Fact View."
      *   *Mediated Agency:* Covers groping, griefing, fraud.
      *   *Institutional Fact:* Covers theft, shutdown, property.
      *   *Representation:* Covers dead avatars, griefbots.

  11. **Final Polish:** Ensure the tone is academic yet direct. Make sure the "Fraud" tension is resolved clearly, as that's a specific pain point for the user. (Self-Correction: The user says "I want to say I have been defrauded, but on my other verdicts nothing real was done to me." I need to show them that their *other* verdicts actually support fraud being real harm, if framed correctly.)

  12. **Wait, one nuance on the Server Shutdown:** "I have lost something real, but no real thing was destroyed." This implies a distinction between *value* and *substrate*. The principle needs to account for *Institutional Ontology*. The house *was* real as an institutional fact, just not a brute physical fact. When the server dies, the institutional fact is dissolved.

  13. **Final check on PvP vs Griefing:** Why is one okay and one not? Consent + Adherence to Rules. The "Presence View" fails here because the *presence* is the same. The *normative context* changes. This requires a clause about **Legitimate Expectations**.

  14. **Drafting the response.** (Mental outline complete).
answer: |-
  Your "Presence View" is a strong start, effectively capturing the intuition that virtual ethics is anthropocentric (grounded in real humans). However, as you noted, it is insufficient. It fails to distinguish between the two PvP cases (where presence is constant) and fails to account for property theft (where no person is "present" in the item).

  Your verdicts actually rely on three distinct ontological and normative layers: **Embodied Agency**, **Institutional Facts**, and **Veridical Representation**.

  To capture your intuitions precisely, you should replace the Presence View with what I will call **The Mediated Agency and Institutional Fact Principle**. Below is the precise formulation, the mapping of your cases, the verdicts on your new cases, and the resolution of your fraud dilemma.

  ### The Principle: Mediated Agency and Institutional Fact

  **A virtual entity or event is a proper object of moral concern and ontological significance if and only if it satisfies at least one of the following three clauses:**

  1.  **The Embodied Agency Clause:** The entity functions as a direct extension of a real person's bodily autonomy, psychological integrity, or capacity for action. (Harm to the avatar is harm to the user's agency).
  2.  **The Institutional Fact Clause:** The entity constitutes a recognized asset, right, or status within a shared normative framework (e.g., Terms of Service, community norms, economic systems) that real persons rely upon for welfare or planning. (Harm to the item is harm to the user's institutional standing).
  3.  **The Veridical Representation Clause:** The entity purports to represent a specific real person or state of affairs, and reliance on this representation is necessary for the real person's informed consent or emotional processing. (Deception about identity violates the user's autonomy).

  ---

  ### Mapping Your Verdicts to the Clauses

  Here is how this tripartite principle explains your existing verdicts, showing where the Presence View failed.

  | Case | Your Verdict | Governing Clause | Why "Presence" Failed |
  | :--- | :--- | :--- | :--- |
  | **Avatar Groping** | Harassment (Real) | **1. Embodied Agency** | Presence View gets this right (you are present), but Clause 1 explains *why*: it violates bodily autonomy, not just "presence." |
  | **Shooting Begging NPC** | No Wrong | **None** | No real person behind it (fails 1), no institutional right to life (fails 2), no claim of human identity (fails 3). |
  | **Consensual PvP Kill** | No Wrong | **1. Embodied Agency** (waived) | Presence View cannot distinguish this from griefing. Clause 1 accounts for *consent*; you waived your agency protection within the rules. |
  | **Exploit Griefing** | Harassment (Real) | **1. Embodied Agency** (violated) | You were present, but the *normative context* changed. The exploit bypasses the consented rules, re-violating your agency. |
  | **Item Theft** | Robbery (Real) | **2. Institutional Fact** | Presence View fails here (no person in the item). Clause 2 explains that the item is real *property* because the institution recognizes it as such. |
  | **Server Shutdown** | Lost something real / No real thing destroyed | **2. Institutional Fact** | The house was an *institutional fact*, not a *brute fact*. When the institution dissolves, the fact vanishes. You lost value, but no atoms were broken. |
  | **Dead Friend's Avatar** | Real mourning / Not visiting them | **3. Veridical Representation** | The avatar represents them, but does not *instantiate* them. Clause 3 allows for mourning the representation without ontological confusion. |
  | **Griefbot** | Not them / Self-deception | **3. Veridical Representation** | The bot claims a representation it cannot fulfill. Comfort is possible, but truth is absent. |

  ---

  ### Verdicts on New Cases

  Here is how the principle forces verdicts on the cases you listed, some of which may challenge your prior intuitions.

  **1. The Memorial Copy Sale**
  *   *Scenario:* A company sells a memorial copy of a dead user's avatar to strangers.
  *   *Verdict:* **Wrongful Commodification (Violation of Clause 3).**
  *   *Reasoning:* Even if the dead have no current agency, the avatar is a *Veridical Representation* of a specific life history. Selling it to strangers severs the link between the representation and its referent, turning a memorial into a generic asset. It violates the dignity of the memory (a surviving interest of the community/family) and misleads the buyer about the nature of the object.
  *   *Nuance:* If sold to the *family* as an archive, it is permissible (Clause 2: Institutional Asset). If sold to *strangers* as a companion, it is fraud (Clause 3).

  **2. The Indistinguishable NPC World**
  *   *Scenario:* A world where NPCs are indistinguishable from players, and no one knows who is who.
  *   *Verdict:* **Mass Deception (Violation of Clause 1 & 3).**
  *   *Reasoning:* If the company *knows* and hides this, they are violating the **Embodied Agency** of the real players. Real players enter social contracts assuming they are dealing with moral agents. If I confide in an "NPC" thinking it is a human, my consent was invalid.
  *   *Exception:* If it is *common knowledge* that some entities might be NPCs (like a Turing Test game), then no wrong is committed. The harm lies in the *hidden* nature of the simulation, not the simulation itself.

  ---

  ### Resolving the Fraud Dilemma

  **The Case:** Someone builds a replica of your late friend's avatar from chat logs, passes it off as them, and gets you to confide in it.
  **Your Conflict:** You feel defrauded, but your "Presence View" suggests nothing real was done because the friend isn't there.

  **The Principle's Resolution:** **You have been defrauded, and the harm is real.**

  The Mediated Agency Principle resolves this by shifting the locus of harm from the *object* (the fake friend) to the *subject* (you).
  *   **Clause 3 (Veridical Representation)** is violated. The fraudster created a false representation to bypass your informed consent.
  *   **Clause 1 (Embodied Agency)** is violated. Your agency includes the right to decide *who* receives your confidences. By deceiving you, the fraudster stripped you of that choice.

  **Why this matters for your thesis:**
  You wrote: *"on my other verdicts nothing real was done to me, since the thing that fooled me was never my friend."*
  This is the one verdict you must **abandon**. The harm in fraud is never about the ontological status of the deceiver; it is about the violation of the victim's autonomy. If a spy pretends to be your friend to steal secrets, the spy is not your friend, but the theft is real. Similarly, if a bot pretends to be your friend to steal your grief, the bot is not your friend, but the emotional violation is real.

  **The Cost:**
  To save this verdict, you must accept that **psychological harm mediated by fiction is real harm.** This might put pressure on your "Griefbot" verdict.
  *   *Consistency Check:* If the fake friend fraud is harmful, is the Griefbot (which you know is a bot but which speaks like your friend) harmful?
  *   *Distinction:* In the Fraud case, you lacked **knowledge**. In the Griefbot case, you possess **knowledge**. The harm in fraud is the *deception*. The "self-deception" in the Griefbot case is only harmful if it prevents you from processing the actual death (maladaptive coping). If it aids coping, Clause 3 is satisfied because the representation is not claiming to be *real*, only *simulated*.

  ### Summary of Necessary Revisions

  1.  **Abandon Pure Presence:** Presence is necessary but not sufficient. You need **Consent** (for PvP) and **Institutional Recognition** (for Theft).
  2.  **Accept Institutional Ontology:** Virtual items are "real" not because they are physical, but because they are *institutional facts* (like money or marriage certificates). Their destruction is real because it alters your standing in the institution.
  3.  **Prioritize Autonomy over Ontology in Fraud:** In the fake friend case, the "realness" of the harm comes from your violated autonomy, not the "realness" of the avatar.

  This framework allows you to keep almost all your verdicts while providing the philosophical machinery to defend them against the "it's just code" objection. The only sacrifice is the idea that "nothing real was done" in the fraud case; the principle demands you acknowledge that violation of trust is a real moral injury, regardless of the ontological status of the liar.
