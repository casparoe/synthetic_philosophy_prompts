      *   **Constraints:**
          *   No overfishing/arms race clichés.
          *   No "Moloch" word until the very end.
          *   **Core Mechanic:** A *ratchet* (irreversible moves) + fragile *pact* (unanimous commitment, costly/delayed verification).
          *   **Outcome:** Group dragged somewhere unwanted despite sensible individual moves.
          *   **Deliverables:** Rules, materials, payoff scheme, rounds/reveal info, script/instructions, 90-min timeline, debrief (mapping moments to theory, acknowledging contested areas), limitations of the simulation, handling "griefers/winners."

  2.  **Deconstruct the Core Mechanics:**

      *   *The Ratchet:* Moves must be irreversible. Once you escalate, you can't de-escalate. This creates a "sunk cost" or "burning bridges" dynamic.
      *   *The Pact:* Unanimous agreement to hold a line.
      *   *The Verification Problem:* Checking if someone broke the pact is costly or delayed. If I suspect you broke it, I *must* escalate to protect myself, but by the time I know, it might be too late.
      *   *The Trap:* Individual rationality (protecting self-interest given uncertainty) leads to collective ruin.

  3.  **Brainstorming Scenarios (avoiding clichés):**

      *   *Idea 1: Server Uptime vs. Feature Velocity.* (Too close to work? Might get bogged down in specifics.)
