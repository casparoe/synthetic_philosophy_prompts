      *   *No Overfishing?* Yes, abstract "Safety Level".
      *   *Debrief:* Honest about limitations and contested theory.
      *   *Griefers:* Addressed in "Facilitator Notes".

  6.  **Final Polish:**
      *   Make sure the math works for 20 people.
      *   Ensure the 90-minute timeline is tight but feasible.
      *   Make the debrief questions specific.
      *   *Self-Correction on Verification:* The prompt asks for verification to be "costly or delayed." Revealing the Average costs a round. That works.
