      If someone griefs, the game ends fast. Debrief focuses on that.
      To prevent instant grief: Make the Crash threshold low enough (Average < 4) that one person going to 1 doesn't trigger it immediately, but forces the average down.
      Start at 10. 20 players. Sum = 200.
      Crash if Sum < 80 (Avg 4).
      One person at 1 reduces Sum by 9. New Sum 191. Avg 9.5. Safe.
      It takes mass defection to crash.
      This ensures the "Slide" happens rather than instant explosion.

      *Debrief Plan:*
      1.  Map the Ratchet (couldn't go back up).
      2.  Map the Verification (didn't know the Average, only the Min).
      3.  Map the Pact (why it failed - lack of enforcement).
      4.  Limitations: Real life has reputation, regulation, slower feedback.
      5.  Contested: Is this inevitable? (Some say yes, some say institutions solve it).
      6.  Reveal "Moloch".

  4.  **Drafting the Content:**

      *   *Tone:* Professional, experimental, facilitator-guide style.
      *   *Structure:* Follow the prompt's checklist exactly.
      *   *Safety:* Ensure no real money, psychological safety (it's a game).
      *   *Script:* Clear, read-aloud instructions.

