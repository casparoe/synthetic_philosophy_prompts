      *Critique:* This feels a bit like the arms race. Need to make the "unwanted destination" clearer.
      Let's make the "Ecosystem Viability" threshold shrink over time, or the reward for escalating increase over time.
      Actually, the prompt wants the *fix* (agreeing to stop) to collapse due to verification.
      So: We agree to stop at 1.
      But I don't know if *you* stopped.
      If I suspect you moved to 2, I *must* move to 2 to avoid being incompatible (or to capture the value).
      If I move to 2, I can't go back.
      Now the baseline is 2.
      Next round, someone moves to 3.
      Verification is the key. If I could see instantly, we could punish. But verification is delayed/costly.

      *Refined Mechanic:*
      **Game:** "The Descent"
      **Resource:** "Safety Margin" (Start at 10).
      **Action:** Reduce Margin by 1, 2, or 3 each round. (Ratchet: Margin only goes down).
      **Payoff:** Points = (10 - Current Margin). Lower margin = more points.
      **Catastrophe:** If *any* player hits 0, everyone loses all accumulated points. (This creates the multipolar trap).
      **Wait, if anyone hits 0, everyone loses.** That makes it a pure cooperation game.
      I need the *individual* incentive to push down, even if it risks the group.
      Let's say: Points are banked individually.
      If *anyone* hits 0, the "Bank" crashes. Everyone loses *future* earnings, but keep past? No, that's not scary enough.
      If anyone hits 0, 50% of everyone's total score is wiped.
      **The Pact:** "We all stop at Margin 5."
      **Verification:** At the end of every 3 rounds, we reveal margins.
      **The Twist:** Between reveals, if you *suspect* someone is cutting margin, you feel pressure to cut yours too to maximize yield before the crash.
      **Actually, the Ratchet needs to be the trap.**
      Once you cut margin, you can't restore it.
      So if Alice cuts to 4 (greed), she gains points.
      Bob sees (or suspects) Alice cut. Bob must cut to 4 to remain competitive/safe? No, if Alice cuts, the risk of crash goes up for Bob. Bob should want Alice to stop.
      But Bob can't force Alice.
      If Bob thinks Alice *will* cut to 3 next round, Bob might as well cut to 4 now to get the points before the crash.
      This is the "Preemptive Defection" driven by verification delay.

      *Let's finalize the mechanics for the prompt's specific constraints:*
      1.  **Ratchet:** Irreversible state change.
      2.  **Pact:** Unanimous, fragile.
      3.  **Verification:** Costly/Delayed.
      4.  **No Moloch word until end.**
      5.  **Debrief:** Map moments to theory, admit limitations.

      *Game Concept:* **"The Red Line"**
      *   **Context:** You are managing a "Risk Profile" (1-10). 10 is Safe, 1 is Critical.
      *   **Start:** Everyone at 10.
      *   **Goal:** Maximize personal score.
      *   **Income:** Each round, you earn points equal to (11 - Current Risk Profile). So Profile 10 = 1 pt. Profile 1 = 10 pts.
      *   **Ratchet:** You can lower your Profile (take more risk) at any time. You can *never* raise it.
      *   **Catastrophe:** If the *Group Average* Risk Profile drops below 4, a "System Event" occurs. Everyone loses 50% of their *current* score.
      *   **The Pact:** "We agree to never go below Profile 6."
      *   **Verification:** You cannot see others' profiles. You can file an "Audit Request" on one player per phase. It costs 5 points. Results are revealed at the *end* of the phase (3 rounds).
      *   **The Trap:** If you suspect someone broke the pact (went to 5), you can't stop them. You only find out later. By then, the average might be drifting down. To maximize your yield before the crash, you might lower your own profile. Since you can't raise it, the group baseline ratchets down.

      *Wait, I need the "obvious fix collapses" part.*
      The fix is "Everyone stay at 6."
      Why does it collapse?
      1.  **Verification:** I don't know if you stayed at 6.
      2.  **Incentive:** If I stay at 6 and you go to 5, you earn more. I don't lose immediately (unless average drops).
      3.  **Ratchet:** If I go to 5 to match you, I can't go back to 6. Now the new "norm" is 5.
      4.  **Uncertainty:** If I think the average is close to 4, I should grab points now (go to 1) before the crash wipes me.

      *Let's tighten the Verification/Cost.*
      Auditing is too complex for 20 people in 90 mins.
      Let's make verification **Public but Delayed**.
      Every 3 rounds, everyone writes their current level on a card. Facilitator collects.
      If *anyone* is found below the Pact Line (6), the Pact is broken.
      *Crucial:* If the Pact is broken, anyone is free to escalate (which they want to do anyway).
      *The Kicker:* If the Pact holds, everyone gets a "Stability Bonus."
      *The Ratchet:* Once you write a number lower than before, it's locked.
      *The Verification Problem:* You submit cards secretly. You don't know if *others* are cheating until the reveal.
      *Round 1:* Everyone agrees to 6.
      *Round 2:* Reveal. Someone cheated (5).
      *Reaction:* The honest players feel like suckers. They say "Okay, new pact at 5."
      *Round 3:* Someone cheats (4).
      *Result:* Ratchet down.

      *Is this strong enough?*
      It relies on people cheating. I need the *structure* to force the slide, not just greed.
      The structure must make "Holding the Line" risky if others might not.
      *Revised Payoff:*
      Score = (11 - Level) * Rounds Survived.
      If Average Level < 4, Game Ends (Everyone gets 0).
      This creates the "Tragedy."
      But the Ratchet is the key.
      Let's combine:
      1.  **Irreversibility:** Level only goes down.
      2.  **Uncertainty:** You don't know the Average until a "System Check" (every 3 rounds).
      3.  **Pact:** "We stop at 6."
      4.  **Verification:** Between Checks, you can "Signal" (publicly state your level). But signaling is non-binding.
      5.  **The Pressure:** If you think the Average is near 4, you *must* lower your level to earn points before the game ends.
      6.  **The Collapse:** Someone lowers to 5. Others don't know. They suspect. They lower to 5 to "get theirs." Average drops. Check happens. It's 4.5. Panic. Everyone goes to 1. Game ends.

      *Okay, let's simplify for 90 mins.*
      **Game:** "The Floor"
      **Materials:** Index cards, pens, projector (for timer/rules), whiteboard (for tracking global state).
      **Players:** 20.
      **Rounds:** 5 Rounds of play + Debrief.
      **State:** Each player has a "Safety Level" (1-10). Start at 10.
      **Action:** Each round, choose a new Safety Level. Constraint: New Level <= Old Level. (Ratchet).
      **Payoff:** Points = Current Safety Level. (Wait, usually risk = reward. Let's invert).
      **Payoff:** Points = (11 - Safety Level). So Level 10 = 1 pt. Level 1 = 10 pts.
      **Global Risk:** The "System Stability" = Average Safety Level of all players.
      **Catastrophe:** If System Stability < 5, the "Market Crashes." Game ends immediately. No points for that round.
      **The Pact:** Before Round 1, players can discuss and agree on a "Minimum Safety Level" (e.g., 7).
