      *   **Crucial:** Facilitator does *not* reveal the Average unless it triggers a Crash.
      *   Facilitator *does* reveal the **Minimum** Level played in the room each round.
      *   *Why?* This creates the verification gap. You know *someone* went low, but not how many.
