      *Let's go with the "Compatibility" idea but sharpen the ratchet.*
      **Game Title:** "The Standard"
      **Setup:** 20 players.
      **State:** Each player has a "Version Number" (starts at 1).
      **Move:** Each round, you may increment your Version (1 -> 2 -> 3...). You cannot decrement.
      **Reward:** Higher Version = More Points per round (efficiency gains).
      **Risk:** The "Ecosystem Viability" depends on the *Maximum* Version difference between any two players. If Max - Min > 3, the ecosystem fractures. Everyone gets 0 for that round.
      **The Pact:** "Let's all stay at Version 1."
      **The Tension:** If *one* person moves to 2, they get more points. If they get away with it, they win. If everyone moves to 2, the gap is still 0, so it's safe, but now the baseline is higher. Eventually, someone moves to 3.
      **Verification:** You don't know others' versions unless you "Audit". Audit costs points. You can only audit 1 person per round.
