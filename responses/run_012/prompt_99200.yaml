      *   *Idea 3: Security Patches.* (Similar to above.)
      *   *Idea 4: "The Standard."* A group defining a protocol. If you deviate to gain speed/compatibility, you break the standard.
      *   *Idea 5: "The Commitment Budget."* A resource allocation game where spending creates permanent obligation.

      *Selection:* Let's go with a abstracted resource/position game called **"The Threshold."** It needs to feel like a slide down a slope. Let's frame it as "System Stability vs. Individual Throughput."
      *Actually, let's make it more concrete but not "work".* How about **"The Descent"**?
      *Let's try a specific mechanic:* Players hold a "Altitude." Lower altitude = higher immediate reward, but if *anyone* goes too low, the "Atmosphere" collapses and everyone loses.
      *Wait, the prompt asks for a Ratchet.* Once you go lower, you can't go higher.
      *And a Pact:* We agree to stay above Altitude X.
      *Verification:* You don't know exactly where others are until the end of the round, or checking costs points.

      *Refining the Mechanic:*
      Let's use a **"Commitment Level"** (1 to 10).
      *   Higher Level = Safer for the group, lower individual payout.
      *   Lower Level = Riskier for the group, higher individual payout.
      *   *Ratchet:* You can only decrease your Level (escalate risk), never increase it.
      *   *Pact:* We agree to stop at Level 5.
      *   *Verification:* To see if someone dropped below 5, you have to spend points *or* you find out at the end of the phase.
      *   *Collapse:* If the *average* drops below a threshold, or if *anyone* hits 0, everyone loses.
      *   *Better:* If the *minimum* level drops, the "floor" drops for everyone.

      *Let's try a different angle: "The Protocol."*
      Everyone is running a node.
      You can choose "Strict Compliance" (Costly, Safe) or "Optimization" (Cheap, Risky).
      Once you Optimize, you can't go back to Strict (Ratchet: code is deployed).
      If too many Optimize, the network fails.
      Pact: We all stay Strict.
      Verification: You can audit a neighbor, but it takes time/resources, and you can't audit everyone.

      *Let's settle on: "The Baseline."*
      *   **Resource:** "Integrity Points" (IP). Start with 100.
      *   **Action:** Each round, you choose to "Maintain" or "Cut".
      *   **Ratchet:** If you "Cut", your personal baseline lowers permanently. You cannot raise it.
      *   **Payoff:** Cutting gives immediate points. Maintaining costs points.
      *   **The Trap:** The "System Health" is determined by the *lowest* baseline in the room. If the lowest baseline drops below a certain threshold, everyone's points are halved (or wiped).
      *   **The Pact:** Agree to never Cut below Level 5.
      *   **Verification:** You can pay to inspect one person's current level. But you can't inspect everyone. If you suspect a cut, you feel pressured to Cut preemptively to not be the "sucker" holding the line while others profit.

      *Wait, I need to ensure the "Ratchet" is the key driver.*
      Let's make it about **"Technical Standards"** but abstracted.
      Game Name: **"Compatibility"**
      Players are vendors.
      Standard is Version 1.0.
      You can release Version 1.1, 1.2, etc.
