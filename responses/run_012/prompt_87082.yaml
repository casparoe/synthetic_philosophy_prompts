  # Decision Tree: Individual Obligation in Collective Harm

  **Starting Premise:** You grant that your token act (this burger, vote, or flight) makes no *perceptible* difference to whether the harm occurs.

  ### **Node 1: The Efficacy Interpretation**
  **Do you deny the inefficacy premise by arguing the act has *expected* utility or *threshold* potential?**
  *   **YES** (Act has probabilistic or hidden causal power) → Go to **Node 2**.
  *   **NO** (Act is strictly causally inert regarding the outcome) → Go to **Node 3**.

  ### **Node 2: Type of Efficacy**
  **Is the moral weight derived from *linear expected value* or *non-linear threshold risk*?**
  *   **Linear Expected Value** → **Leaf 1: Expected Utility Consequentialism**
      *   *Commitment:* You must calculate minute probabilities for every act, implying you are obligated to avoid harms you cannot possibly verify.
  *   **Non-Linear Threshold Risk** → **Leaf 2: Threshold Consequentialism**
      *   *Commitment:* You must treat your act as potentially decisive even when evidence suggests it is not, risking excessive restriction on harmless acts.
      *   *(Note: Students often confuse Leaf 1 & 2; both deny strict inefficacy.)*

  ### **Node 3: Relevant Relation**
  **Does the act stand in *any* morally relevant relation to the harm (causal or participatory)?**
  *   **NO** (Totally disconnected) → **Leaf 3: Hard Inefficacy / Nihilism**
      *   *Commitment:* You are permitted to contribute to catastrophic harms provided your individual contribution is undetectable.
  *   **YES** (Structurally connected) → Go to **Node 4**.

  ### **Node 4: Causal Status**
  **Is the act a *causal component* of the harm (e.g., part of a sufficient set) or merely *non-causal participation*?**
  *   **Causal Component (Unique)** → **Leaf 4: Causal Complicity**
      *   *Commitment:* You are responsible for the harm even if your removal would not have prevented it (overdetermination problems).
  *   **Causal Component (Substitutable)** → **Leaf 5: Substitutability View**
      *   *Commitment:* You are off the hook if someone else would have done the same, making obligation dependent on empirical facts about others' psychology.
      *   *(Note: Leaf 5 handles the "Replacement" case.)*
  *   **Non-Causal Participation** → Go to **Node 5**.

  ### **Node 5: Normative Ground**
  **Is the obligation grounded in *fairness/cooperation*, *character/expression*, or *symbolic consequences*?**
  *   **Character/Expression** → **Leaf 6: Expressive / Virtue Ethics**
      *   *Commitment:* You must avoid the act to maintain integrity, even if doing so makes no difference to the harm or fairness.
  *   **Symbolic Consequences** → **Leaf 7: [EMPTY / UNOCCUPIED]**
      *   *Status:* **Unattractive.** Claims non-causal acts produce "symbolic" outcomes; incoherent without mystical causation.
  *   **Fairness / Cooperation** → Go to **Node 6**.
      *   *(Note: Leaf 6 is often confused with Leaf 9; both prescribe action without causal efficacy.)*

  ### **Node 6: Fairness Conditionality**
  **Is the duty to cooperate *conditional* on others' compliance, *unconditional*, or *randomized*?**
  *   **Unconditional** → **Leaf 8: Unconditional Fairness (Non-Free-Riding)**
      *   *Commitment:* You must do your part even if others defect, ensuring you never benefit from a scheme you wouldn't support universally.
      *   *(Note: Handles the "Vote" case for duty-based voters.)*
  *   **Conditional** → **Leaf 9: Conditional Fairness (Assurance)**
      *   *Commitment:* You are permitted to free-ride if others do, which may guarantee the cooperative scheme collapses.
      *   *(Note: Handles the "Burger" case for market-smoothing views.)*
  *   **Randomized** → **Leaf 10: [EMPTY / UNOCCUPIED]**
      *   *Status:* **Incoherent.** Suggests fairness requires rolling dice to decide whether to cooperate; violates the categorical nature of duty.

  ---

  ### **Case Mapping & Indistinguishability Notes**

  | Case | Typical Path | Distinguished From |
  | :--- | :--- | :--- |
  | **Single Vote (Large Election)** | Node 1 (No) → Node 3 (Yes) → Node 4 (Non-Causal) → Node 5 (Fairness) → Node 6 (Unconditional/Conditional). | **Leaf 6 (Expressive):** A vote can be expressive (Leaf 6) or fairness-based (Leaf 8/9). The tree forces a choice on *why* you vote. |
  | **Single Burger (Supply Contract)** | Node 1 (No) → Node 3 (Yes) → Node 4 (Non-Causal) → Node 5 (Fairness) → Node 6 (Conditional). | **Leaf 3 (Nihilism):** If the market truly smooths demand, some argue for Leaf 3. The tree separates "No relation" from "Relation but Conditional." |
  | **Threshold Case** | Node 1 (Yes) → Node 2 (Threshold). | **Leaf 1 (Expected Utility):** Both deny inefficacy. Leaf 2 focuses on the *risk* of crossing a line; Leaf 1 focuses on *average* contribution. |
  | **Replacement Case** | Node 1 (No) → Node 3 (Yes) → Node 4 (Causal-Substitutable) → Leaf 5. | **Leaf 4 (Complicity):** Leaf 5 excuses you if replaced; Leaf 4 holds you responsible regardless. |

  **Most Confusing Leaves:**
  1.  **Leaf 1 vs. Leaf 2:** Both rely on denying the inefficacy premise. Distinguish by asking if the value is *aggregated* (Leaf 1) or *risk-based* (Leaf 2).
  2.  **Leaf 6 vs. Leaf 8:** Both require acting despite inefficacy. Distinguish by asking if the reason is *who you are* (Leaf 6) or *what you owe others* (Leaf 8).
  3.  **Leaf 4 vs. Leaf 8:** Both forbid free-riding. Distinguish by asking if the wrong is *causing harm* (Leaf 4) or *taking advantage* (Leaf 8).
