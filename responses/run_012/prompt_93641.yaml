prompt: |-
  After a career in experimental physics I retired and began sitting in on graduate seminars in philosophy; I have now been asked to propose a paper for a small interdisciplinary workshop on levels of explanation, half philosophers and half scientists. The subject I want to work on is a thought experiment I have met under the name of the careenium: a table covered with ordinary magnetic balls that careen about, collide, and clump, where the clumps — symmballs, in the usual telling — happen to be describable at a higher level as a system of symbols tracking the world outside the table. What I want to ask is what it would take for those symbols to push the balls around, that is, whether there is any defensible sense in which the higher-level states cause the motions of the substrate rather than merely summarizing them; and my half-formed idea is that this cannot be settled by argument alone, because the answer turns on whether the symbol-level description survives perturbation of the micro-details, which is a question one can put to a model rather than to an intuition. Turn this into a proposal of about three pages: state the question so that it has a determinate answer; explain why the existing positions on higher-level causation — exclusion worries, supervenience, the appeal to explanatory levels — leave the careenium case open; describe the minimal system I would build and code myself, and the tests I would run on it, and why that approach rather than a purely conceptual one; say what would count as a positive answer, a negative answer, and a failure of the project; and give a realistic scope for a term's work, remembering that I am not a professional philosopher and that some of the audience will be. I will add the citations myself, so leave them out.
