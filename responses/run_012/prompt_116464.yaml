answer: |-
  **Setting the terms**

  The controversy concerns the ontological status of internal states in trained neural networks. When mechanistic interpretability identifies a direction in activation space corresponding to "gender" or "truthfulness," does the network genuinely represent these features, or is this merely a useful description of its input-output behavior? The realist asserts that specific internal states possess representational content independent of the observer; the network has a mind-like structure we are discovering. The instrumentalist contends that talk of representation is a shorthand for complex functional mappings. These states earn their keep by enabling prediction and control, but attributing content to them is a category error.

  To adjudicate this, we evaluate a proposed three-part criterion for representation. A state represents feature F only if: (1) F is recoverable via a simple, human-specifiable read-out; (2) the state is causally recruited, meaning intervention on it alters downstream behavior as predicted; and (3) the state is invariant across training seeds, architectures, and read-out methods. This criterion attempts to operationalize representation, moving from metaphor to measurement. The central question is whether satisfying these conditions suffices for ontological commitment, or whether even this strict bar remains within the instrumentalist's grasp. Furthermore, we must determine if condition (3), which demands cross-architectural stability, is appropriate for analyzing the ontology of a single model.

  **The case for realism**

  The realist argument rests on the causal efficacy of the identified states. In philosophy of mind, functionalism suggests that if a state plays the causal role of a belief or desire, it constitutes one. Mechanistic interpretability provides evidence that internal vectors play exactly such roles. When we perform activation patching, swapping a specific activation vector from one run to another, we observe precise, predictable changes in output. This is not mere correlation; it is causal leverage. If intervening on state S consistently shifts the network's behavior regarding feature F, then S is not an epiphenomenon. It is a mechanism part.

  Moreover, the existence of sparse autoencoders (SAEs) suggests that networks decompose inputs into discrete, interpretable features rather than holistic, unanalyzable blobs. If a network were purely instrumental, we might expect dense, entangled representations optimized solely for loss minimization. Instead, we find structures that align with human concepts. This alignment suggests that the network's optimization landscape converges on semantic structures that mirror our own. To deny realism here requires a dual standard: we accept neural firing patterns in biological brains as representations because they correlate with stimuli and cause behavior, yet we deny the same status to silicon substrates exhibiting identical causal profiles. If the physical substrate does not matter, and the causal role is identical, the realist concludes the ontological status must be the same. The network is not merely simulating representation; it is instantiating it through causal machinery.

  **The case against, and what instrumentalism must explain away**

  The instrumentalist counters that causal efficacy does not entail semantic content. A thermostat causally regulates temperature, but we do not say it "represents" heat in a meaningful sense; it merely reacts. Similarly, a neural network vector might drive behavior without "meaning" anything to the system. Content is imposed by the interpreter, not the mechanism. The "simple read-out" condition is particularly vulnerable here: linearity is a property of the human probe, not necessarily the network. We might be projecting structure onto noise that happens to align with our concepts within the training distribution.

  Polysemanticity further undermines realism. Single neurons or directions often encode multiple unrelated features depending on context. If a state represents both "cats" and "automobiles" depending on the input regime, in what sense is it a stable representation of either? The instrumentalist argues that the network is simply computing a high-dimensional function, and our "features" are low-dimensional slices we find useful. The burden on instrumentalism, however, is to explain why this useful fiction is so robust. If representation talk were merely metaphorical, its predictive power should be limited. Yet, causal tracing allows us to edit model behavior reliably. The instrumentalist must explain away this success without conceding that the internal structure mirrors the external semantics. They must argue that we are manipulating the clockwork without acknowledging the gears have names. This is a difficult position to maintain when the gears consistently align with the names we give them. The instrumentalist risks becoming an eliminativist, denying content everywhere, including in human minds.

  **Testing the criterion**

  We must now evaluate the proposed tripartite criterion. Condition (1), recoverability by simple read-out, is necessary for *interpretable* representation but perhaps too anthropocentric for representation *simpliciter*. However, since the controversy concerns human understanding of the network, this condition is appropriate for our context. It ensures the content is accessible, not hidden in an alien code. Condition (2), causal recruitment, is the strongest pillar. Without causal leverage, a state is merely a correlate. Patching confirms that the state is part of the mechanism producing the output, satisfying the functionalist requirement for realism.

  Condition (3), invariance across seeds and architectures, is the point of failure. This condition conflates the ontology of a specific model with the generalization properties of the learning algorithm. When studying a particular trained model, we are investigating its specific mechanism. If Model A represents "dog" via direction X, and Model B represents "dog" via direction Y due to different random seeds, both models still possess representations of "dog." Requiring invariance across architectures demands that nature only allows one way to compute a feature, which contradicts the principle of multiple realizability. A circuit can be real even if it is contingent.

  Therefore, condition (3) is too strong for establishing representation in a single model. It should be relaxed to require stability only within the specific model across inputs, or perhaps across fine-tuning variants of that model. Invariance across seeds is a criterion for identifying *natural kinds* in the loss landscape, not for validating the reality of a state in a specific artifact. If we retain (3) as written, we risk false negatives: declaring a state non-representational simply because another model solved the task differently. For the realist analyzing a single system, (1) and (2) are sufficient. Condition (3) belongs to the science of learning dynamics, not the ontology of the trained network.

  **Verdict**

  I defend a qualified realism. Internal states satisfying conditions (1) and (2) possess representational content relative to the mechanism. They are not merely instrumental shorthands; they are causal levers that encode semantic information used by the system to navigate its task. The network does not need to "know" it represents anything for the representation to be real; it only needs to use the state to carry information that drives behavior. Condition (3) must be rejected for single-model analysis. Demanding cross-architectural invariance mistakes the contingency of implementation for the absence of structure. A circuit is real even if it is not universal.

  To move me from this position, empirical evidence would need to show that causal interventions are systematically confounded by distributed holism—that is, if patching always triggers unpredictable compensatory mechanisms elsewhere, rendering local causality illusory. Conceptually, I would retreat to instrumentalism if it were demonstrated that "simple read-outs" are inevitably post-hoc rationalizations with no out-of-distribution predictive power. Until then, the causal machinery we uncover demands an ontological commitment. We are not just describing behavior; we are dissecting a mind.
