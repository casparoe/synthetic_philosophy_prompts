answer: |-
  # Long-Term Intergenerational Valuation Protocol (LTIVP)
  **Version:** 1.0 (Draft for Internal Review)  
  **Audience:** Appraisal Staff, Deputy Minister  
  **Constraint:** Compliant with DM Public Commitment (No zero-scoring based solely on time horizon).

  ## PART 1: THE PROCEDURE

  Run every proposal with a benefit horizon >30 years through the following six steps. Do not proceed to the next step if a **HARD STOP** is triggered.

  ### Step 1: Horizon & Continuity Check
  *   **Input:** Project lifespan ($T$).
  *   **Question:** Does $T$ exceed the reliable forecasting horizon for economic growth ($g$) and social stability? (Default threshold: 50 years).
  *   **Action:**
      *   If $T \leq 50$: Proceed to Step 2 using Standard Treasury Discount Rate.
      *   If $T > 50$: **Flag as Intergenerational.** Proceed to Step 2.

  ### Step 2: Decomposition of the Rate
  Do not use a single blended rate. Separate the discount rate ($r$) into three components:
  1.  **Impatience ($\rho$):** Pure time preference. (Ethical: Do we value future lives less simply because they are later?)
  2.  **Wealth Effect ($\eta \times g$):** Expected growth ($g$) $\times$ Diminishing marginal utility of consumption ($\eta$). (Technical/Ethical mix: Will they be richer? Does money matter less to them?)
  3.  **Existential/Catastrophic Risk ($\delta$):** Probability that the benefit cannot be enjoyed due to systemic collapse. (Technical/Strategic).

  ### Step 3: Parameter Sourcing
  Assign values to the components based on the source authority.
  *   **$g$ (Growth):** Use official fiscal forecasts up to 50 years. Beyond 50 years, $g$ must be set to 0% unless a Ministerial Directive specifies otherwise. (Rationale: Cannot assume perpetual growth).
  *   **$\eta$ (Elasticity):** Use Treasury standard parameter for inequality aversion.
  *   **$\rho$ (Impatience):**
      *   For $T \leq 50$: Use Treasury standard rate.
      *   For $T > 50$: **STAFF MAY NOT SET THIS VALUE.**
  *   **$\delta$ (Catastrophe):** Use intelligence/defense agency survival estimates if available. If unavailable, assume 0% for standard infrastructure, but flag for Step 5.

  ### Step 4: The Ethical Firewall (HARD STOP CONDITION A)
  *   **Check:** Does the appraisal require setting $\rho$ for a horizon $>50$ years?
  *   **Rule:** Setting $\rho$ for future generations is a moral judgment on the worth of future citizens relative to current ones.
  *   **Action:**
      *   If **YES**: Stop calculation. Output **"Conditional Valuation."** Report NPV as a function of $\rho$ (e.g., "At $\rho=0.1\%$, Value=$X; at $\rho=1.0\%$, Value=$Y").
      *   **Requirement:** Submit to Deputy Minister with note: *"Parameter $\rho$ exceeds staff ethical authority. Ministerial directive required to select scenario."*

  ### Step 5: The Existential Risk Check (HARD STOP CONDITION B)
  *   **Check:** Does the project primarily modify the probability of civilizational collapse or extinction (e.g., pandemic prevention, asteroid deflection, nuclear containment)?
  *   **Rule:** Standard discounting arithmetic fails here. If the project prevents extinction, the "future consumption" denominator disappears if the project fails. Discounting the value of continued existence creates a paradox where preventing extinction appears cheap because the "benefits" are pushed to infinity and discounted heavily.
  *   **Action:**
      *   If **YES**: Stop calculation. **NPV is Invalid.**
      *   **Output:** Classify as **"Strategic Continuity Asset."**
      *   **Requirement:** Submit to Deputy Minister with note: *"Financial appraisal machinery misfires on existential risk. Valuation requires policy judgment on the price of survival, not cost-benefit analysis."*

  ### Step 6: Incommensurability Check
  *   **Check:** Are the benefits primarily non-market goods (e.g., species survival, cultural heritage, avoiding suffering) that lack a shadow price?
  *   **Action:**
      *   If **YES**: Do not monetize benefits. Report **Cost-Effectiveness Analysis** only (Cost per unit of outcome).
      *   **Requirement:** Flag that the "Zero Value" constraint is met by acknowledging value exists but is non-fiscal.

  ---

  ## PART 2: APPLICATION TO TEST CASES

  ### Case 1: Coastal Defense Project (Horizon: 100 Years)
  *   **Step 1:** $T=100$. **Flag as Intergenerational.**
  *   **Step 2:** Decompose $r$.
  *   **Step 3:** $g$ set to 0% after year 50. $\eta$ standard. $\rho$ unknown.
  *   **Step 4 (Hard Stop):** Triggered. Staff cannot set $\rho$ for years 51–100.
  *   **Output:** **Conditional Valuation.**
      *   *Report:* "NPV is $\$2B$ if $\rho=0.5\%$; NPV is $\$200M$ if $\rho=2.0\%$."
      *   *Decision:* Deputy Minister must select the $\rho$ scenario. This satisfies the "no zero score" rule (value is non-zero in all ethical scenarios) but pushes the ethical weight upward.
  *   **Verdict:** Procedure works. Exposes the hidden ethical lever.

  ### Case 2: Nuclear Decommissioning Fund (Horizon: 5,000 Years)
  *   **Step 1:** $T=5,000$. **Flag as Intergenerational.**
  *   **Step 3:** $g$ must be 0% after year 50. Assumption of perpetual economic growth is technically indefensible.
  *   **Step 4 (Hard Stop):** Triggered on $\rho$.
  *   **Step 5 (Hard Stop):** Triggered on $\delta$. Over 5,000 years, the probability of state continuity ($\delta$) is non-negligible. The fund assumes the state exists to spend it.
  *   **Output:** **Valuation Impossible.**
      *   *Report:* "Standard discounting assumes a continuous economic agent. Over 5,000 years, political and economic continuity cannot be modeled. The fund is a moral pledge, not a financial asset."
      *   *Decision:* Deputy Minister must authorize funding as a **Sovereign Moral Obligation**, not an investment with a return.
  *   **Verdict:** Procedure bites hard. Admits the math is fiction. Prevents staff from pretending a 5,000-year cash flow model is real.

  ### Case 3: Global Catastrophe Research (Horizon: Indefinite)
  *   **Step 1:** Horizon is indefinite (prevents termination of time series).
  *   **Step 5 (Hard Stop):** **Triggered Immediately.**
      *   *Reasoning:* The benefit is a reduction in the probability of $\delta$ (extinction). Standard NPV calculates the present value of future consumption streams. If extinction occurs, the stream is zero. If we discount the stream heavily (high $r$), the value of preventing extinction drops. If we discount lightly (low $r$), the value is infinite. Both are unstable.
      *   *Constraint Check:* DM committed "no zero score merely because benefits are far off."
      *   *Resolution:* This procedure does **not** score it zero. It scores it **"Unpriced."**
  *   **Output:** **Strategic Continuity Asset.**
      *   *Report:* "NPV arithmetic yields absurdities (either near-zero or infinite). The project buys option value on the future of the species. This is outside the mandate of financial appraisal."
      *   *Decision:* Deputy Minister must fund based on **Precautionary Principle**, not ROI.
  *   **Verdict:** This is the intended failure. It admits the machinery misfires. It protects staff from defending a number they know is wrong (e.g., "$5M NPV" for saving the world).

  ---

  ## PART 3: OPERATIONAL NOTES FOR STAFF

  1.  **On the "Zero Value" Commitment:**
      *   This protocol never outputs "Zero" due to time.
      *   For Case 1, it outputs a range of positive numbers.
      *   For Cases 2 & 3, it outputs "Unpriced/Strategic."
      *   *Explanation to DM:* "Scoring a project 'Zero' implies it has no value. Scoring it 'Unpriced' implies the value is beyond our metric. The latter is honest; the former is false."

  2.  **On Staff Capability:**
      *   Staff do not need to read philosophy. They need only identify which bucket a number falls into ($\rho$, $g$, or $\delta$).
      *   If a bucket requires a moral judgment ($\rho$) or a strategic judgment ($\delta$ on extinction), the protocol instructs them to stop and ask for direction.

  3.  **On the Hard Stop:**
      *   The Hard Stop is not a failure of the analyst; it is a successful identification of a political decision.
      *   Do not fudge the number to get past the stop. If you pass the stop without a Directive, you are signing your name to an ethical claim you were not authorized to make.

  **End of Protocol.**
