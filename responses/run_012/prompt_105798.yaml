      *(Refining the Existential Risk Case):* The user suspects an honest procedure will admit it falls outside discounting. I need to make sure the protocol explicitly says "If project modifies existential risk, NPV is invalid."

      *(Refining the "Staff Capability"):* Ensure steps rely on "Treasury Standard Parameters" vs "Ministerial Directive."

