prompt: |-
  I'm a senior analyst in the long-term policy unit of a mid-sized national finance ministry, and for the past year I've been the person who has to defend in writing the discount rate we apply whenever we appraise anything with a horizon past about thirty years: levees, grid hardening, a decommissioning fund, a vaccine stockpile against a novel pathogen, a small research line on deflecting asteroids. These appraisals recur quarterly, they're run by economists and engineers with no philosophy training, and the final number gets signed off by a deputy minister who will not read anything longer than two pages. I've read enough of the rationalist and effective-altruist blogosphere to be fairly sure that the way we currently do this — pick a rate, compound it, done — hides a pile of distinct ethical commitments inside a single parameter, and I want us to stop doing that. What I want from you is a decision procedure rather than an essay: a checklist we can run on a proposal, in order, that first forces us to state which part of the discount rate we are actually invoking — impatience (a benefit being worth less merely because it occurs later), the likelihood that future people will be richer than us, uncertainty about whether there will be a future at all, uncertainty about what future people will want — and then tells us, for each part, what would count as a defensible value, and when the question is technical versus when it is a values question that has to go to elected officials rather than be settled by staff. It needs a hard stop: I want to know the exact step at which the procedure should refuse to produce a number and push the decision upward, and I want it honest about where the whole machinery misfires, especially for non-marginal changes, incommensurable goods, and anything whose benefit consists in reducing the probability that we are not around to enjoy anything.

  Then run it on three proposals so I can see where it bites. First, a coastal defense project with benefits spread over roughly a century. Second, a fund that only pays for itself after several thousand years, of the sort that keeps resurfacing in the nuclear waste file. Third, a modest research program to lower the risk of a global catastrophe, where the payoff is a small change in a probability and the standard arithmetic seems to make it nearly worthless no matter which rate we choose. That third case is the one I actually care about, and I suspect an honest procedure will either assign it a present value I find absurd or admit that it falls outside what discounting can evaluate; I would much rather hear that than a fudge. Two constraints. The deputy minister has already committed publicly that no project will be scored at zero merely because its benefits are far off, so the procedure has to be consistent with that commitment or explain why it cannot be. And none of it may depend on the staff having read the literature: they should be able to run it with the numbers they already have, and where they cannot get a number, the procedure should say what to do instead. Where the procedure cannot be made mechanical, say so plainly rather than dressing a judgment call up as a formula.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Senior analyst in a national finance ministry's long-term policy unit.
      *   **Context:** Defends discount rates for long-term appraisals (levees, grid, decommissioning, vaccine stockpiles, asteroid deflection).
      *   **Problem:** Current method (pick a rate, compound) hides ethical commitments. Economists/engineers lack philosophy training. Deputy Minister (DM) reads max 2 pages.
      *   **Goal:** A *decision procedure* (checklist), not an essay. Must separate ethical vs. technical components of the discount rate. Must identify a "hard stop" where staff must push the decision up to elected officials. Must handle non-marginal changes, incommensurable goods, and existential risk.
      *   **Constraints:**
          1.  DM's public commitment: No project scored at zero *merely* due to time horizon.
          2.  Staff capability: No philosophy reading required. Use existing numbers. If a number can't be generated, say what to do instead.
          3.  Honesty: Admit where the machinery misfires. Don't dress judgment as formula.
      *   **Test Cases:**
          1.  Coastal defense (century horizon).
          2.  Nuclear waste fund (millennia horizon).
          3.  Global catastrophe risk reduction (small probability change, standard arithmetic makes it worthless).

  2.  **Deconstruct the Discount Rate (Ramsey-Cass-Koopmans Framework):**
      *   Standard formula: $r = \rho + \eta g$
      *   $\rho$ (Pure Rate of Time Preference): Impatience. Ethical.
      *   $\eta$ (Elasticity of Marginal Utility): Inequality aversion/risk aversion. Ethical/Technical mix.
      *   $g$ (Growth Rate): Expectation that future generations are richer. Technical (forecast) but relies on ethical assumptions about continuity.
      *   *Additional factors for very long term:* Existential risk ($\delta$), changing values/preferences.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Attempt 1 (Mental Outline):* Ask them to split the rate. Ask if it's ethical. If yes, send to Minister. If no, calculate. Check for zero value.
      *   *Critique 1:* Too vague. Needs specific steps. Needs to address the "zero value" constraint. Needs to handle the "existential risk" case where discounting breaks.

      *   *Attempt 2 (Adding Structure):*
          1.  Separate $\rho$, $\eta$, $g$.
          2.  Assign values.
          3.  Check horizon.
          4.  If horizon > X, stop.
          5.  Run cases.
      *   *Critique 2:* Better. But needs to explicitly handle the "ethical vs. technical" split. The "Hard Stop" needs to be clear. The "Existential Risk" case needs a specific branch because standard discounting penalizes preventing extinction (if no one exists, no utility to discount, but if we discount the future heavily, preventing extinction looks cheap). Actually, standard discounting makes existential risk look *cheap* to fix (benefits are far away) but the *value* of the future is huge. Wait, if $r > 0$, PV of infinite stream is finite. If $r$ is high, PV is low. The user says standard arithmetic makes it "nearly worthless." This implies the probability adjustment swamps the value. I need to ensure the procedure flags this as a "Category Error."

      *   *Attempt 3 (Refining for the User's Constraints):*
          *   **Format:** Checklist/Flowchart style.
          *   **Tone:** Bureaucratic but precise. No fluff.
          *   **The "Hard Stop":** Must be where ethical parameters are chosen *or* where the model breaks (existential risk).
          *   **The "Zero Value" Constraint:** The procedure must ensure a non-zero floor or explicitly justify why zero is the only honest answer (and push that up).
          *   **Staff Usability:** Use existing forecasts ($g$), standard treasury parameters ($\eta$), but flag $\rho$ as political.

  4.  **Developing the "Long-Term Valuation Protocol" (LTVP):**

      *   *Step 1: Horizon Classification.* Is it intergenerational (>50 yrs)?
      *   *Step 2: Component Separation.* Break $r$ into $\rho$ (impatience), $\eta \times g$ (wealth effect), $\delta$ (catastrophe risk).
      *   *Step 3: Parameter Sourcing.* Where do numbers come from? Market data? Treasury guidelines? Ministerial directive?
      *   *Step 4: The Ethical Firewall.* $\rho$ is purely ethical. Staff cannot set it for >50 years.
      *   *Step 5: The Existential Check.* Does the project affect survival probability? Standard discounting fails here.
      *   *Step 6: The Hard Stop.* If Step 4 or 5 triggers, output is "Ministerial Directive Required," not a number.

  5.  **Refining the "Hard Stop" and "Zero Value" Constraint:**
      *   The DM said "no zero scores merely because benefits are far off."
      *   If the procedure says "We can't calculate this," does that violate the commitment?
      *   *Solution:* The procedure produces a *Qualified Valuation*. It can produce a number *conditional* on ethical parameters. If those parameters aren't provided, it stops. For existential risk, it produces a "Strategic Classification" rather than a NPV. This respects the "no zero" rule by not scoring it zero, but refusing to score it financially at all.

  6.  **Drafting the Test Cases:**
      *   *Case 1 (Coastal):* Standard long-term. $\rho$ is the sticking point. Procedure should flag $\rho$ for Minister, allow $g$ and $\eta$ from staff.
      *   *Case 2 (Nuclear/1000 yrs):* $g$ becomes nonsense. $\delta$ (survival risk) dominates. Procedure must Hard Stop on growth assumptions and survival probability.
      *   *Case 3 (Existential Risk):* Standard NPV fails. The benefit is the continuation of the denominator. Procedure must flag "Model Breakdown."

  7.  **Final Polish:**
      *   Ensure the tone matches a senior analyst speaking to colleagues/Minister.
      *   Keep it under the "2-page" spirit (concise).
      *   Make sure the "Hard Stop" is visually distinct.
      *   Ensure the "Zero Value" constraint is addressed explicitly in the protocol rules.

  8.  **Self-Correction during drafting:**
