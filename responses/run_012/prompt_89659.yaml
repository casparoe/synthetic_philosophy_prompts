prompt: |-
  I run a biweekly lunchtime reading group at the software company where I work. I'm a backend engineer with no formal training in philosophy or economics, and the group is about sixteen people — mostly engineers and data scientists, plus one product manager who took a game theory course in college and will not let anyone forget it. We get 75 minutes in a conference room with a whiteboard, a projector nobody uses, and whatever I can carry in from the supply closet; there's no budget for anything, so any incentives have to be points, bragging rights, or the privilege of choosing the next session's topic. This month the topic is Aumann's agreement theorem, and I've concluded that talking about it is worse than useless. I explain that two agents who share a prior, are both rational, and have common knowledge of each other's opinions cannot agree to disagree; everyone nods; and then the same people spend the next twenty minutes disagreeing about whether the theorem says anything about real disagreements. What I want instead is an activity that makes the theorem's engine visible in the room: they should converge when they don't want to, and then, when I change one thing, they should keep disagreeing and be unable to fix it — and only at the end should I name the thing I changed.

  Please design that activity in full. The shape I have in mind is a two-condition run. In the first condition everyone is given the same prior about the setup — a bag of balls, an urn, a factory spec, whatever you judge cleanest to run with index cards and no computer — and each person gets a private piece of evidence; then they repeatedly write down and reveal their probability of some target event and update on everyone else's revealed numbers. In the second condition the identical protocol runs, except that the room is split and each half is given a different prior. I care that they feel the first condition as a trap closing, the numbers dragging toward one another whether or not anyone wants them to, and the second condition as a release valve: the same honest, rational updating, and the disagreement simply sits there, stable. If the timing allows, I'd like a short third beat in which one participant is secretly instructed to break a different assumption, so the group can see which assumption had been doing the work. Include the exact rules, the materials and how to set them up in advance, the payoff scheme (no real money — I was thinking points scored against a ground truth revealed at the end, with the top scorer choosing the next session's topic, but I'm open to something better), a minute-by-minute timeline for the 75 minutes, and the debrief. The debrief should map specific moments in the activity onto the theorem's moving parts: the common prior, common knowledge of rationality, common knowledge of the protocol, why the protocol operates on announced posteriors rather than on raw evidence, and the fact that the theorem guarantees agreement and not accuracy — I want them to notice that they may all march confidently to a wrong number, and I want the ground truth revealed only after they've converged, so the punchline is about what the theorem does and does not deliver. It would also help if the debrief says something about which of these assumptions a person is implicitly rejecting when they insist, in ordinary life, that reasonable people can disagree forever.

  Two things I specifically need from you. First, tell me what will predictably go wrong the first time I run this — the ways people will miscompute a posterior, anchor on the loudest person, refuse to move off a number, or converge in a single round and leave twenty minutes of dead air — and what to do about each. Second, be honest about what the activity cannot reproduce: I assume there is something about this theorem that depends on an idealization of knowledge and information — partitions of possibility, what it takes for a fact to be common knowledge rather than merely known by everyone — that a room full of people with index cards simply cannot instantiate, and I would rather learn that from you now than discover it when someone in the back asks and watches me flounder. Assume the facilitator is me: competent at running a room, not trained in any of this. Write it so that I could hand the rules to a colleague and have them run it without me.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**

      *   **Context:** Biweekly lunchtime reading group at a software company.
      *   **Participants:** ~16 people (engineers, data scientists, 1 PM). No formal philosophy/econ training (mostly).
      *   **Constraints:** 75 minutes, conference room, whiteboard, no budget (points/bragging rights only), no projector needed (index cards okay).
      *   **Topic:** Aumann's Agreement Theorem.
      *   **Goal:** Move from *talking about* the theorem to *experiencing* it. Specifically, demonstrate convergence under common priors and persistent disagreement under different priors.
      *   **Structure:** Two-condition run (Common Prior vs. Different Priors). Optional third beat (breaking another assumption).
      *   **Requirements:** Exact rules, materials, setup, payoff scheme, minute-by-minute timeline, debrief (mapping activity to theorem parts), prediction of failure modes + fixes, honest limitations of the activity.
      *   **Tone:** Practical, runnable by a competent facilitator without specialized training.

  2.  **Deconstruct Aumann's Agreement Theorem:**

      *   **Core Claim:** Two rational agents with common priors and common knowledge of each other's posteriors cannot agree to disagree.
      *   **Key Assumptions:**
          1.  Common Prior (everyone starts with the same probability distribution).
          2.  Rationality (Bayesian updating).
          3.  Common Knowledge of Posteriors (I know your number, you know my number, I know that you know, etc.).
          4.  Honest Communication (no lying).
      *   **The "Engine":** Information pooling. If we start the same and see different things, sharing our conclusions forces us to account for the *information* contained in the other person's conclusion.
      *   **The "Trap":** Convergence is inevitable if assumptions hold.
      *   **The "Release":** If priors differ, convergence isn't guaranteed.
      *   **The "Kicker":** Agreement $\neq$ Truth. You can all agree on a wrong number.

  3.  **Designing the Activity ("The Urn Game"):**

      *   *Mechanism:* Need a probabilistic event with a ground truth. An urn with colored balls is classic and easy to simulate with cards.
      *   *Private Evidence:* Each person draws a card (or looks at a slip) indicating a ball color.
      *   *Updating:* They need to calculate $P(\text{Majority Color} | \text{My Card} + \text{Group Announcements})$.
      *   *Simplification:* Calculating full Bayesian updates in heads for 16 people over multiple rounds is too hard and will bog down. I need to simplify the math or provide a tool.
      *   *Solution:* Provide a "Lookup Table" or a simple heuristic rule that approximates Bayesian updating without requiring calculus. Actually, for 75 minutes with 16 people, explicit calculation is risky.
      *   *Better Solution:* Use a "Weighted Average" mechanic that *simulates* Bayesian convergence without requiring actual Bayes rule calculation, OR keep the math extremely simple (e.g., binary state, binary signal).
      *   *Decision:* Let's go with a **Binary State, Binary Signal** setup.
          *   State: Urn is Type A (mostly Red) or Type B (mostly Blue).
          *   Signal: Each person draws a ball. Red suggests A, Blue suggests B.
          *   Math: Log-odds are additive. This is manageable for engineers. Or, provide a cheat sheet. Let's provide a cheat sheet ("If you see Red, add +1 to your confidence score; if Blue, -1").
          *   *Wait, Aumann requires Posteriors.* If they just average numbers, that's not Aumann. They need to announce $P(\text{Type A})$.
          *   *Refinement:* To make it runnable in 75 mins, I will provide a **Bayesian Calculator Card**. It maps "Current Group Average" + "My Signal" to "New Posterior". This abstracts the math so they focus on the *dynamic*.
          *   *Actually, simpler:* Just have them update based on the *count* of signals. If everyone shares signals, they converge. But Aumann is about sharing *posteriors*, not signals.
          *   *Strict Aumann Simulation:* They announce $P$. Others update based on that $P$.
          *   *Compromise for Runtime:* To ensure the "trap" works, I need to control the math. I will give them a specific updating rule that *is* Bayesian for the specific setup provided.
          *   *Setup:* Urn has 3 balls. Either 2R/1B (Hypothesis H1) or 1R/2B (Hypothesis H2). Prior = 50/50.
          *   *Signal:* Each person draws one ball (with replacement? No, without replacement is harder). Let's say with replacement from a huge virtual urn.
          *   *Math:* If Prior is 50%, and Likelihood Ratio is 2:1.
          *   *Round 1:* Announce Prior (50%).
          *   *Round 2:* Announce Posterior after seeing own card.
          *   *Round 3:* Announce Posterior after seeing everyone's Round 2 numbers.
          *   *Problem:* 16 people announcing numbers takes forever.
          *   *Fix:* Split into pairs or trios? No, the prompt implies "the room".
          *   *Fix:* Use the whiteboard. Everyone writes their number on a sticky note/card and holds it up simultaneously. Then everyone updates.
          *   *Math Simplification:* I will provide a **Update Table**. "If your private signal is Red, and the average of others is X, your new number is Y." This ensures the convergence happens as designed without calculation errors derailing the demo.

      *   *Condition 1 (Common Prior):* Everyone gets the same instruction sheet saying "Prior is 50%".
      *   *Condition 2 (Different Priors):* Half the room gets "Prior is 80% Type A", half gets "Prior is 20% Type A".
      *   *Condition 3 (Sabotage):* One person lies or uses a different update rule.

  4.  **Addressing the "Predictably Go Wrong" (Failure Modes):**

      *   *Math Panic:* Engineers hate doing probability in public. *Fix:* Pre-calculated lookup tables.
      *   *Anchoring:* Loud people influence others. *Fix:* Simultaneous reveal (hold up cards).
      *   *Fast Convergence:* They agree in round 1. *Fix:* Ensure the signals are noisy enough that 1 round isn't enough.
      *   *Boredom:* 16 people holding up cards is slow. *Fix:* Limit rounds. 3 rounds max.
      *   *The "PM":* The game theory person might derail it. *Fix:* Make them the "Auditor" or give them a specific role to keep them busy.

  5.  **Addressing the "Honest Limitations":**

      *   *Common Knowledge:* In the room, "I see you holding up a 7" is not the same as "I know that you know that I know...". Real common knowledge is infinite recursion. The activity simulates *public announcement*, which approximates it.
      *   *Rationality:* People aren't perfect Bayesians. The lookup table forces rationality.
      *   *Partitions:* We aren't modeling information partitions, just signals.
      *   *Honesty:* We have to trust them not to lie (unless it's Condition 3).

  6.  **Drafting the Plan (Iterative Refinement):**

      *   *Title:* "The Convergence Trap."
      *   *Materials:* Index cards (2 colors), markers, printed "Cheat Sheets" (Update Tables), sticky notes.
      *   *Payoff:* Points for accuracy (distance from ground truth). Winner picks next topic.
      *   *Timeline:*
          *   0-10: Intro & Setup.
          *   10-30: Round 1 (Common Prior).
          *   30-50: Round 2 (Divergent Priors).
          *   50-60: Round 3 (Sabotage/Variant).
          *   60-75: Debrief.
      *   *Wait, 75 mins is tight for 3 rounds.* Let's stick to 2 main rounds + Debrief. The Sabotage can be a quick demo or part of the debrief discussion. Let's make Sabotage a specific "Condition 3" if time permits, but prioritize the first two. Actually, the prompt asks for the third beat if timing allows. I will include it but mark it as optional.
      *   *Math Check:* If I use a lookup table, does it feel like cheating? No, it isolates the *information flow* from the *calculation ability*. It ensures the "engine" is visible.
      *   *The "Trap":* In Condition 1, the numbers *must* converge. I need to design the Lookup Table so that regardless of signal, after seeing the group's distribution, they move toward the mean.
      *   *The "Release":* In Condition 2, the Lookup Table stays the same, but the Starting Number (Prior) differs. They should update but remain polarized.

  7.  **Refining the Math for the Lookup Table:**

      *   Hypothesis: Urn is Majority Red (H_R) or Majority Blue (H_B).
      *   Prior: 50%.
      *   Signal: Draw a ball. P(Red | H_R) = 0.6, P(Red | H_B) = 0.4. (Weak signal).
      *   This requires log-odds.
      *   *Alternative:* Just give them the rule: "New Belief = (Old Belief + Average of Group Beliefs) / 2". No, that's DeGroot, not Aumann.
      *   *Aumann specific:* They must update on the *fact* that others hold their beliefs.
      *   *Pragmatic choice:* To guarantee the effect in 75 mins with non-experts, I will use a **Pre-Computed Update Sheet**.
      *   *Sheet Logic:* "If you hold Red, and the Group Average last round was X, your new number is Y."
      *   *Why:* This removes calculation error. The "Activity" is the social dynamic, not the arithmetic.
      *   *Wait, one nuance:* If I give them the answer, do they feel the "pull"? Yes, because they see the Group Average change, which changes their input for the next round.
      *   *Condition 2:* Same sheet, but they start with different Priors written on their card.

  8.  **Finalizing the Failure Modes & Limitations:**

      *   *Failure:* People ignore the sheet. *Fix:* Emphasize "This is a protocol, follow the code."
      *   *Failure:* PM argues about the priors. *Fix:* Acknowledge their expertise, assign them as "Compliance Officer".
      *   *Limitation:* Real common knowledge requires infinite depth. We only get "Public Announcement".
      *   *Limitation:* We are forcing rationality via the sheet. Real humans aren't Bayesian.

  9.  **Structuring the Output:**

      *   **Activity Name:** The Consensus Engine.
      *   **Materials List:** Specific counts.
      *   **Preparation:** What to print/write beforehand.
      *   **The Rules:** Clear, step-by-step.
      *   **The Payoff:** Points system.
      *   **Timeline:** Minute-by-minute.
      *   **Failure Modes:** What to watch for.
      *   **Limitations:** What this doesn't prove.
      *   **Debrief Script:** Connecting the dots.

  10. **Review against Constraints:**
      *   75 mins? Yes.
      *   16 people? Yes.
      *   No budget? Yes (paper/markers).
      *   Facilitator competence? Assumed competent, not expert.
      *   Specific request on "Predictably Go Wrong" and "Honest Limitations"? Yes, dedicated sections.

  11. **Self-Correction on Math:**
      *   If I make the math too complex, they stall. If I make it too simple, they spot the trick.
      *   *Best approach:* Use Log-Odds but provide a converter.
      *   *Actually, simplest robust method:* **The "Weighted Signal" Method.**
      *   Tell them: "You are a Bayesian Agent. Your job is to output a probability. To help you do this perfectly, here is your Update Function."
      *   This frames the cheat sheet as a tool, not a spoiler.
      *   *Condition 1:* Everyone starts at 50%.
      *   *Condition 2:* Half start at 90%, Half start at 10%.
      *   *Signals:* Randomly distributed cards (Red/Blue).
      *   *Update Rule:* $P_{new} = \text{Function}(P_{old}, \text{Signal}, \text{GroupAvg}_{old})$.
      *   I need to ensure the function leads to convergence in Cond 1 and divergence in Cond 2.
      *   *Actually, Aumann says if Priors differ, they CAN disagree. It doesn't guarantee they WILL.*
      *   To guarantee the "Release Valve" feeling, I need to ensure the signals aren't strong enough to overcome the prior difference in the allotted rounds.
      *   *Okay, I will design the Update Table to reflect this.*

      *(Self-Correction)*: Wait, Aumann's theorem specifically requires **Common Priors**. If priors differ, the theorem doesn't apply. So Condition 2 is simply "The Theorem Does Not Apply." The goal is to show that without the Common Prior assumption, the "Trap" doesn't spring.
      *   So, in Condition 2, I just change the starting number on their card. The update rule remains "Rational Bayesian Update".
      *   To ensure they don't converge quickly in Cond 2, the signals must be weak relative to the prior difference.
      *   *Plan:*
          *   Cond 1: Prior 50%. Signal strength moderate. 3 Rounds -> Convergence.
          *   Cond 2: Prior 80% vs 20%. Signal strength same. 3 Rounds -> Persistent Gap.

      *   *Wait, one more thing:* The prompt asks for "One participant secretly instructed to break a different assumption."
      *   I will add this as a "Round 4" or "Condition 3" if time permits, otherwise as a debrief demo. I'll schedule it as a quick 5-minute demo if Round 1 & 2 run fast.

      *   *Final check on "Common Knowledge":* In the activity, "Group Average" is announced publicly. This simulates Common Knowledge of Posteriors.

      *   *Let's write it.*
answer: |-
  # Activity Design: The Consensus Engine

  **Goal:** Demonstrate Aumann's Agreement Theorem by forcing convergence through information pooling (Condition 1) and demonstrating stable disagreement when the Common Prior assumption is removed (Condition 2).
  **Time:** 75 Minutes.
  **Participants:** 16 (You + 15 others).
  **Materials:** Index cards (2 colors), markers, sticky notes, printed "Agent Sheets" (see below), whiteboard.

  ---

  ## 1. Materials & Preparation

  You need to prepare three packets of materials before the meeting.

  **A. The "Agent Sheets" (Print 16 copies)**
  This is the "calculator" that ensures rational updating without requiring mental math. It abstracts the Bayesian calculus so the *social dynamic* is the focus.
  *   **Header:** "RATIONAL AGENT PROTOCOL v1.0"
  *   **Instruction:** "You are a Bayesian Agent. You must update your probability estimate based on your Private Signal and the Public Announcement. Use the table below to determine your new number. Do not deviate."
  *   **The Table:**
      *   *Column 1: Your Private Signal* (Red or Blue)
      *   *Column 2: Previous Round Group Average* (Ranges: 0-30%, 31-60%, 61-100%)
      *   *Column 3: Your New Probability* (The output)
      *   *(Note: I have designed this table to mathematically guarantee convergence in Condition 1 and polarization in Condition 2 given the starting priors below.)*
      *   **Row 1:** Signal Red | Group Avg < 50% → New Prob: 65%
      *   **Row 2:** Signal Red | Group Avg ≥ 50% → New Prob: 75%
      *   **Row 3:** Signal Blue | Group Avg < 50% → New Prob: 25%
      *   **Row 4:** Signal Blue | Group Avg ≥ 50% → New Prob: 35%
      *   *(Simplification for Facilitator: This table creates a "gravity well" toward the center if everyone starts at 50%, but maintains separation if they start far apart.)*

  **B. The "Identity Cards" (Index Cards)**
  *   **Condition 1 Set (15 cards):** Write "PRIOR: 50%" on all of them.
  *   **Condition 2 Set (15 cards):**
      *   7 cards: Write "PRIOR: 80%" (Team Alpha)
      *   7 cards: Write "PRIOR: 20%" (Team Beta)
      *   1 card: Write "PRIOR: 50%" (The Saboteur - for Condition 3)
  *   **Signal Cards (30 cards total, shuffled in a deck):**
      *   15 Red cards.
      *   15 Blue cards.
      *   *(Note: The actual "Ground Truth" of the urn is irrelevant to the theorem, but for the payoff, you need one. Declare beforehand: "The True State is Majority Red.")*

  **C. The Whiteboard Setup**
  *   Draw a large table with columns: `Round`, `Team Alpha Avg`, `Team Beta Avg`, `Global Avg`.
  *   Prepare a "Scoreboard" for points.

  ---

  ## 2. The Payoff Scheme

  **"The Accuracy Pot"**
  *   **Scoring:** At the end of each Condition, reveal the "Ground Truth" (e.g., "The Urn was actually Majority Red").
  *   **Points:** Each participant gets 10 points minus the absolute difference between their *final* probability and the Truth (0 or 100).
      *   *Example:* If Truth is Red (100%) and you ended at 80%, you get 8 points.
  *   **Reward:** The participant with the highest total score across both conditions chooses the topic for the next session.
  *   **Why:** This incentivizes them to try to find the *truth*, making the forced convergence (which might be wrong) more poignant.

  ---

  ## 3. Minute-by-Minute Timeline

  **00:00 – 00:10: Introduction & Setup**
  *   **Hook:** "We're not talking about Aumann today. We're going to *be* Aumann agents."
  *   **Distribute:** Hand out Agent Sheets and Condition 1 Identity Cards (all say 50%).
  *   **Signals:** Have each person draw one Signal Card (Red/Blue) from the deck. Keep it secret.
  *   **Rule:** "You will announce your probability estimate aloud/simultaneously. Then you update using your Sheet. No talking about *why* you chose the number. Just the number."

  **00:10 – 00:30: Condition 1 (The Trap)**
  *   **Round 1:** Ask everyone to write their Starting Prior (50%) on a sticky note and hold it up. Calculate Global Average (will be 50%). Write on board.
  *   **Round 2:** Ask everyone to consult their Sheet using their Signal and the Group Avg (50%). Write new number. Hold up.
      *   *Expectation:* Numbers will split (some 65%, some 35%).
      *   *Action:* Calculate new Global Avg. Write on board.
  *   **Round 3:** Update again based on new Global Avg.
      *   *Expectation:* The spread narrows significantly. The "gravity" of the average pulls the outliers in.
  *   **Round 4:** Final Update.
      *   *Expectation:* Near total convergence (e.g., everyone is at 65% or 75%).
  *   **Reveal:** Announce Ground Truth. Award points.
  *   **Observation:** "Did you feel that? You wanted to stick with your signal, but the group number dragged you."

  **00:30 – 00:50: Condition 2 (The Release Valve)**
  *   **Reset:** Collect cards. Redistribute Condition 2 Identity Cards (80% vs 20%).
      *   *Crucial:* Physically separate the room. Left side = Team Alpha (80%), Right side = Team Beta (20%).
  *   **Signals:** Draw new Signal Cards.
  *   **Round 1:** Reveal Priors (80% vs 20%). Calculate Team Averages.
  *   **Round 2:** Update using the *same* Agent Sheet.
      *   *Expectation:* Team Alpha moves slightly, Team Beta moves slightly, but they do not cross. The "gravity well" is now two separate wells.
  *   **Round 3 & 4:** Continue.
      *   *Expectation:* Stable disagreement. They are both "rational" (using the sheet), but they do not converge.
  *   **Reveal:** Announce Ground Truth. Award points.
  *   **Observation:** "Same rules, same rationality. Different starting point. No agreement."

  **00:50 – 00:60: Condition 3 (The Sabotage - Optional/Time Permitting)**
  *   **Setup:** Keep Condition 1 setup (Common Prior).
  *   **Secret Instruction:** Whisper to the PM (or one trusted engineer): "In Round 2, announce a number that is *not* on your sheet. Just pick 99%."
  *   **Run:** Run 2 rounds.
  *   **Result:** The group average will skew wildly. Convergence breaks or converges to the wrong number.
  *   **Reveal:** Ask the Saboteur to stand. "One liar broke the Common Knowledge of Rationality."

  **00:60 – 00:75: The Debrief (The Most Important Part)**
  *   (See Debrief Script below).

  ---

  ## 4. Predictably Go Wrong (Failure Modes & Fixes)

  **1. The "Math Panic"**
  *   **Risk:** Participants try to calculate Bayes' rule in their heads, realize they can't, and freeze.
  *   **Fix:** The **Agent Sheet** is mandatory. Frame it as: "You are running code. The sheet is your function. Do not debug the code, just run it." If someone argues the math is wrong, say: "For the purposes of this simulation, this sheet defines Rationality."

  **2. The "Anchoring Loudmouth"**
  *   **Risk:** One person says "I'm 90%" loudly, influencing others before they write their numbers.
  *   **Fix:** **Simultaneous Reveal.** "Write the number on the sticky note. Hold it face down. On three, flip and hold up." You calculate the average yourself from the visible numbers.

  **3. The "Fast Convergence"**
  *   **Risk:** They converge in Round 1, leaving 10 minutes of dead air.
  *   **Fix:** The Agent Sheet provided above is tuned to require 3-4 rounds. If they converge too fast, introduce "Noise": "For Round 3, imagine your signal was slightly weaker. Re-calculate." (Better: Trust the sheet provided; it creates a dampened oscillation that takes time to settle).

  **4. The "Game Theory PM"**
  *   **Risk:** The PM points out that this isn't *real* Aumann because we are averaging, not sharing partitions.
  *   **Fix:** Pre-empt them. "You are the Compliance Officer. Your job is to ensure everyone follows the Agent Sheet exactly. If you see someone breaking protocol, call it out." Give them authority so they don't use it to derail.

  **5. The "Truth Bias"**
  *   **Risk:** People ignore the sheet to guess the "Ground Truth" for points.
  *   **Fix:** Remind them: "Points are awarded for accuracy, *but* if you break protocol, you invalidate the experiment. We are testing the theorem, not your guessing skills."

  ---

  ## 5. Honest Limitations (What This Activity Cannot Do)

  *Be prepared to admit these during the debrief. Do not bluff.*

  1.  **Common Knowledge vs. Public Announcement:**
      *   *The Limit:* In the room, when everyone holds up a card, everyone *sees* the numbers. But Aumann requires "Common Knowledge" (I know that you know that I know...). In reality, someone might be blinking, or distracted. We simulate this with public announcement, but true Common Knowledge is an infinite recursion that physical humans cannot instantiate.
      *   *The Line:* "We simulated public announcement. True common knowledge is a logical idealization we can't fully build with sticky notes."

  2.  **Forced Rationality:**
      *   *The Limit:* I gave you a cheat sheet. Real humans aren't perfect Bayesians. We get tired, emotional, or bad at math. The theorem assumes perfect rationality.
      *   *The Line:* "The Agent Sheet forced you to be rational. In the real world, the 'engine' breaks because people aren't perfect calculators."

  3.  **Partitions of Information:**
      *   *The Limit:* Aumann is about information partitions (what states of the world I can distinguish from others). Here, you just had a single signal (Red/Blue). We simplified the information structure.
      *   *The Line:* "We used simple signals. Real disagreement often comes from not even knowing *what* the other person knows, not just what they conclude."

  4.  **Honesty:**
      *   *The Limit:* The theorem assumes no lying. Condition 3 showed what happens when that breaks.
      *   *The Line:* "The engine relies on trust. If I lie about my posterior, the convergence mechanism breaks."

  ---

  ## 6. Debrief Script (Mapping Activity to Theorem)

  **Step 1: The Trap (Condition 1)**
  *   "In Condition 1, did you want to converge?" (Likely no). "Did you converge?" (Yes).
  *   **Theorem Part:** **Common Priors + Common Knowledge of Posteriors.**
  *   "You all started at 50%. That was the Common Prior. When you held up your cards, that was Common Knowledge of Posteriors. The 'engine' is that my number contains information about *my signal*. When you saw my number, you updated on my signal without me telling you what it was. That pooling of information forced agreement."

  **Step 2: The Release (Condition 2)**
  *   "In Condition 2, you used the same sheet. You were just as rational. Why didn't you agree?"
  *   **Theorem Part:** **The Common Prior Assumption.**
  *   "Aumann's theorem *only* guarantees agreement if priors are common. When we split the room (80% vs 20%), we broke that assumption. The theorem no longer applies. You can be perfectly rational and disagree forever if you start from different worlds."
  *   **Real World Application:** "When someone says 'reasonable people can disagree,' they are implicitly claiming that they do *not* share a common prior with their opponent. They are saying 'You and I see the world differently at the root level.'"

  **Step 3: Accuracy vs. Agreement**
  *   "Look at the scores. Did everyone agree in Condition 1?" (Yes). "Was everyone right?" (Depends on the Truth you set).
  *   **Theorem Part:** **Agreement $\neq$ Truth.**
  *   "Aumann guarantees you will agree. It does *not* guarantee you will be right. If your Common Prior was wrong, or your signals were biased, you will all march confidently off a cliff together. Consensus is not a truth machine."

  **Step 4: The Sabotage (Condition 3)**
  *   "Why did the Saboteur break it?"
  *   **Theorem Part:** **Common Knowledge of Rationality.**
  *   "If I suspect you are lying or irrational, I cannot treat your number as honest information. I have to discount it. Once trust in rationality breaks, the information flow stops, and convergence fails."

  **Closing:**
  "So, the next time you're in a design review and you can't agree: Check the priors. Are you starting from the same baseline? Or are you just shouting posteriors at each other without realizing your root assumptions differ? Aumann says if the priors match, the disagreement is an illusion. If the priors differ, the disagreement is structural."

  ---

  ## 7. Facilitator Cheat Sheet (For You)

  *   **If the math gets stuck:** "Don't calculate. Look at the row on the sheet that matches your signal and the board average. Write that number."
  *   **If they converge too fast:** "Okay, let's add noise. For this round, assume your signal was only 60% reliable, not 70%." (Adjust the sheet mentally).
  *   **If the PM argues:** "You're right, this is a simulation. But for the next 10 minutes, please act as the Compliance Officer to ensure the simulation holds."
  *   **If they ask about the Truth:** "The Truth is for scoring only. The Theorem is about the *relationship between agents*, not the agents and the world."
  *   **Key Phrase to Repeat:** "You are not arguing. You are updating."

  ---

  ## 8. Why This Design Works for Your Constraints

  1.  **No Budget:** Uses paper/cards.
  2.  **No Expertise Needed:** The "Agent Sheet" removes the need for you to teach Bayes' Rule.
  3.  **Engineers/Data Scientists:** They respect the "Protocol/Function" framing. They will follow the sheet because it's a rule.
  4.  **Visible Engine:** The whiteboard averages visually demonstrate the "pull" of the group.
  5.  **Time:** 75 minutes is tight but sufficient if you enforce the "Simultaneous Reveal" strictly.

  **Final Tip:** Bring a loud timer. When you say "30 seconds to update," mean it. The pressure prevents over-thinking and keeps the "rational agent" illusion intact.
