answer: |-
  This is a classic philosophical stalemate, but it is not, as you suspect, merely verbal. Nor is it an empirical disagreement. You and your flatmate are experiencing a **substantive meta-normative disagreement about the source of moral reasons.**

  Specifically, you are disagreeing about whether **social coordination itself** can generate a moral obligation, or whether moral obligations must exist *independently* of the convention (grounded in harm, rights, or consent).

  Here is the diagnosis grounded in your text, an analysis of why the Visitor Case is the key, and a path to resolving it.

  ### 1. The Diagnosis: Source of Normativity, Not Semantics

  Your working theory suggests you might be asking different questions (justification vs. blame). I believe this is incorrect. Your flatmate admits breaking norms is "rude" and "annoying." He acknowledges blame in a social sense. The disagreement is not about *whether* you can be criticized, but **what kind of criticism is warranted.**

  *   **Your Flatmate (The Liberal Individualist):** He operates on a **Harm/Consent Model**.
      *   *Evidence:* "Unless you actually harm a specific person, there's nothing moral on the table." / "How can a stranger be bound by a rule they never agreed to?"
      *   *Theory:* Moral obligations are "pre-existing." They attach to persons regardless of context (don't steal, don't lie). Conventions are merely prudential tools. Without concrete harm or explicit consent, a convention cannot *create* a moral duty. To him, calling etiquette "moral" is category inflation.

  *   **You (The Contractualist/Communitarian):** You operate on a **Fair Play/Reciprocity Model**.
      *   *Evidence:* "Cutting the queue is free-riding on a line everybody else is honoring." / "Treating the people who expect it with contempt."
      *   *Theory:* Moral obligations can be **generated** by participation in a cooperative scheme. Even if the rule is arbitrary (drive on the left vs. right), once the scheme is active, opting out while benefiting from the order is a violation of fairness. To you, etiquette *is* moral because it governs how we treat one another as participants in a shared space.

  **Why it's not verbal:** If it were verbal, you could say, "Okay, let's call it 'social obligation' not 'moral obligation'," and he would say, "Fine, you're obligated." But he wouldn't. He says the visitor is *not bound at all* ("incoherent... to be bound"). He denies the *bindingness*, not just the label.

  ### 2. The Visitor Case: The Smoking Gun

  The Visitor Case is where you stall hardest because it isolates the variable of **Consent vs. Presence.** This case strongly supports the **Substantive Meta-Normative Diagnosis.**

  *   **For your Flatmate:** The Visitor Case proves his point. If morality requires consent or independent justification, a visitor has neither. Therefore, the visitor is free. If you tell him the visitor is *obligated*, he hears you saying "Might makes right" or "Local tyranny is valid."
  *   **For You:** The Visitor Case proves your point. If morality is about fair play and respect, entering a space and accepting its order creates a duty. To do otherwise is to assert dominance over the locals.

  **What the Visitor Case reveals:**
  It reveals that your flatmate views moral obligations as **portable** (you carry them with you), while you view some moral obligations as **situational** (they arise from the context you enter).

  When you cannot answer *why* the visitor is bound other than "because it's the local custom," you are failing to articulate the **Principle of Fair Play**. You are stating the *source* (custom) without the *mechanism* (reciprocity). He rejects the source; you need to explain the mechanism.

  ### 3. How to Move It (The Resolution)

  This is not an intuition standoff where you must agree to disagree. There is a philosophical argument that bridges this gap: **The Principle of Fair Play (H.L.A. Hart / John Rawls).**

  This argument accepts your flatmate's premise (the rule is arbitrary) but defeats his conclusion (therefore no obligation).

  **The Argument to Propose:**
  "Imagine we are playing a board game. The rules are arbitrary (why does the Queen move diagonally?). But once we agree to play, cheating is *wrong*, not just 'against the rules.' It's wrong because I am taking the benefit of your restraint (you following the rules) while refusing to restrain myself. That is free-riding."

  **Apply this to the Queue:**
  1.  **Arbitrariness:** Yes, a queue is arbitrary. We could have a scramble.
  2.  **Cooperation:** Everyone else is restraining their desire to be first to create order.
  3.  **Benefit:** The queue-jumper benefits from that order (the line exists, it's moving) without paying the cost (waiting).
  4.  **Obligation:** The obligation doesn't come from the *rule*; it comes from the **unfairness of taking the benefit without the burden.**

  **Why this moves the Flatmate:**
  It shifts the ground from "Is this rule sacred?" (No) to "Is free-riding wrong?" (Yes, presumably). It allows him to keep his view that conventions are arbitrary while accepting your view that breaking them is morally wrong.

  **Why this moves You:**
  It gives you the answer for the Visitor Case you were missing. The visitor is bound not because "it's the custom," but because **by entering the queue, they are accepting the benefit of the order.** If a visitor refuses to tip in a tipping culture, they are accepting the service (subsidized by tips) without paying the agreed price.

  ### 4. The Terminology Truce

  There is one remaining hurdle: The word "Moral."

  Your flatmate reserves "Moral" for High Stakes (Harm/Rights). You use "Moral" for Relational Duties (Respect/Fairness).

  **The Compromise:**
  Propose a **Two-Tier Vocabulary**:
  1.  **Core Morality:** Harm, rights, justice (Flatmate's domain).
  2.  **Social Morality:** Fair play, reciprocity, respect (Your domain).

  Agree that violating Social Morality is a *moral failing*, just a lesser one than violating Core Morality. It is wrong to cut a queue, just as it is wrong to lie, but it is *differently* wrong. One undermines trust in persons; the other undermines trust in systems.

  ### Summary

  *   **Diagnosis:** Substantive disagreement about the **Source of Normativity** (Harm/Consent vs. Fair Play/Reciprocity).
  *   **Visitor Case:** Confirms this. It shows he requires **Consent** for bindingness; you require **Participation/Benefit**.
  *   **Solution:** Stop arguing about whether the *rule* is moral. Argue about whether **free-riding** is moral. Use the **Principle of Fair Play**.
  *   **Outcome:** You get your obligation (free-riding is wrong); he gets his justification (it's not about the arbitrary rule, it's about the unfairness).

  You aren't talking past each other; you are building the house on different foundations. Switch the foundation to "Fair Play," and the walls align.
