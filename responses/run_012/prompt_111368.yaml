answer: |-
  **Joint Statement on Grounding and Embodiment**

  **We, the undersigned, agree on the following foundational claims:**

  1.  **The Deficit:** Current text-only large language models (LLMs) lack a crucial component of human-like understanding. They can manipulate tokens statistically but fail to demonstrate full semantic competence.
  2.  **The Chinese Room:** The Chinese Room argument successfully demonstrates that syntactic manipulation alone is intuitively distinct from understanding, though we disagree on the underlying mechanism causing this distinction.
  3.  **Behaviorism is Insufficient:** Passing a Turing Test or achieving high benchmark scores is not sufficient evidence for genuine grounding or meaning.
  4.  **The World Matters:** Any complete theory of cognition must account for the relationship between the system and the physical environment it discusses or operates within.
  5.  **Success Condition:** A successful explanation of grounding must distinguish between a system that *simulates* reference to an object and a system that *engages* with the object.

  **Surviving Disagreements**

  | Feature | **Side A (Representationalist)** | **Side B (Enactivist/Practice)** |
  | :--- | :--- | :--- |
  | **Location of Meaning** | Inside the system, as a relation between internal states and external referents. | Outside the system, in the normative social practices where the system participates. |
  | **Role of the Body** | Instrumental. Provides the causal channel to hook symbols to reality. | Constitutive. Cognition is *made of* sensorimotor engagement, not just aided by it. |
  | **Text-Only Deficit** | Lack of sensorimotor referents (symbols float free of causes). | Lack of social accountability (symbols are not used in a form of life). |
  | **The "Grounding" Problem** | A real engineering problem: how to link syntax to semantics. | A pseudo-problem: meaning is use, not a link between two distinct realms. |

  **Cruxes and Predictive Cases**

  **Crux 1: Is Sensorimotor Contact Sufficient?**
  *Case:* A text-only model is equipped with a camera and gripper, then fine-tuned on manipulation tasks (e.g., "pick up the red block").
  *   **Side A Prediction:** The system becomes grounded. The causal loop between internal weights and physical outcomes provides the necessary non-symbolic anchor.
  *   **Side B Prediction:** The system remains ungrounded. Without entry into a social practice where actions are subject to normative correction (right/wrong in a social sense), it is merely a complex thermostat, not a meaning-maker.
  *   **Bet:** Side A bets the system will generalize concepts (e.g., "fragile") based on physical feedback. Side B bets it will fail to understand *why* fragility matters outside its specific reward function.

  **Crux 2: Is Grounding Internal or Relational?**
  *Case (Invented):* **The Hermit vs. The Apprentice.** Two robots with identical sensorimotor hardware. *Hermit* learns manipulation alone via trial and error. *Apprentice* learns the same tasks alongside humans who treat it as a partner, correcting its mistakes linguistically and socially.
  *   **Side A Prediction:** Both are equally grounded. Grounding is a property of the individual system's internal mapping of sensorimotor data.
  *   **Side B Prediction:** Only *Apprentice* is grounded. Meaning is scaffolded by social uptake; without being treated as an agent by others, *Hermit* has no semantics, only dynamics.
  *   **Bet:** Side A bets performance metrics will be identical. Side B bets *Apprentice* will handle novel, ambiguous social-physical requests (e.g., "hand me that thing") significantly better.

  **Verbal Disputes**

  We acknowledge a terminological deadlock regarding **"Representation."**
  *   **Side A** uses this to denote internal structures carrying content.
  *   **Side B** views this as a misleading reification of dynamic processes.
  *   **Resolution:** In future experiments, we will distinguish between *internal state vectors* (A's focus) and *interaction patterns* (B's focus) without forcing one to adopt the other's ontology.

  **Falsification Conditions**

  *   **Side A would be wrong if:** A system demonstrated robust, flexible semantic understanding without any causal sensorimotor link to the objects it discusses (e.g., a text-only model that genuinely innovates physical theories without ever seeing data derived from sensors).
  *   **Side B would be wrong if:** A system embedded deeply in human social practice, subject to normative correction, still failed to demonstrate understanding despite having full sensorimotor engagement, suggesting the social scaffold is irrelevant.

  **Signed,**
  *The Representationalist & The Enactivist*
