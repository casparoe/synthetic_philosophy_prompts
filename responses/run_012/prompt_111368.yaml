prompt: |-
  Ok so my housemate is midway through a PhD on embodied cognition and I've just started as a research engineer at an ML lab, and we've been having the same arguement every other week: whether the models I work on mean anything at all, or whether the symbol grounding problem is even the right frame for them. We always talk past each other. She thinks I'm begging the question by assuming there are representations in there to ground in the first place; I think she changes the subject when she starts going on about bodies and practices. I want us to write down the thing we should have written months ago so we can stop relitigating it in the kitchen.

  So: draft the joint statement of an adversarial collaboration between (A) someone who thinks cognition runs on internal representations, and that symbols only mean anything when they're ultimately hooked up to non-symbolic, sensorimotor representations, so a system that only ever manipulates symbols derived from other symbols is ungrounded; and (B) someone who thinks that whole picture is the mistake — meaning isn't in the head at all but in situated, embodied, socially scaffolded interaction, so the grounding problem as usually posed is a pseudo-problem, and a text-only model is ungrounded for a completely different reason. If you think the camps should be drawn a bit differently, say so, but then commit to the version you use.

  I want: a numbered list of claims both could sign — what the thing to be explained actually is, what the Chinese-room-style intuition pumps do and don't show, what would even count as a successful grounding explanation; then the surviving disagreements, each phrased the way that side would want its own view put; then the cruxes. I'd guess one is whether sensorimotor contact is sufficient or whether it's just more representation all the way down, and another is whether grounding is a property of a system or of its embedding in a practice. For each crux give a case or experiment both sides agree would bear on it, with each side's prediction written down in advance. Use this case plus one you invent where the two sides' predictions actually come apart: a text-only model gets a camera and a gripper bolted on and is fine-tuned on manipulation tasks — does it end up grounded, and what would each side bet it still can't do? Also have them seperate out any part of the fight that's purely verbal, and say what each side would count as evidence against itself. Table for the disagreements is fine. Maybe 900 words.
