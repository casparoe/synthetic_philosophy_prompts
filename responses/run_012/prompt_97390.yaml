          *   *Rabbit Hole Risk:* Low. If correlation kills the curse, the norm is unjustified.

      *   *Candidate B: The Action/Omission Asymmetry (The User's MC).*
          *   *Upstream:* High. Determines whether we optimize for preventing action or preventing inaction.
