  6.  **Select the Top 1-2:**
      *   *Top Pick:* **Correlated Errors & Epistemic Independence.** Why? Because the UC argument *depends* on the independence assumption. If the community shares a bias (e.g., optimism bias in AI, or pessimism in bio), the statistical logic collapses. This is the most "theoretical leverage" point.
