answer: |-
  You are mistaking a logical contradiction inherent in the concept of knowledge for a mere practical limitation of human cognition.

  The unknowability of the proposition $p \land \neg Kp$ ("$p$ is true and nobody knows $p$") is not due to a lack of computing power or time, but because knowing it logically entails a contradiction. For any agent to know a conjunction, they must know each conjunct; so to know $p \land \neg Kp$, you must know $p$ and know that $p$ is not known. However, knowledge is factive (if you know $p$, then $p$ is known), so the act of knowing the first conjunct immediately falsifies the second. This means the proposition is not just hard to verify; it is logically impossible to verify while it remains true.

  Your suggestion that infinite patience or better computers would dissolve the paradox assumes the barrier is empirical—like counting grains of sand—but the barrier is actually semantic. Even an omniscient being cannot know $p \land \neg Kp$, because for that being to know it, $p$ would have to be known, making the claim "$p$ is unknown" false. Consequently, the paradox is structural because it relies only on the logical rules governing the knowledge operator (factivity and distribution over conjunction), not on the physical or psychological limits of the knower. If the Knowability Principle holds, these logically unknowable truths cannot exist, which forces the conclusion that all truths are already known, regardless of how much processing power you add to the system.
