answer: |-
  # Operational Decision Procedure: Jurisdictional Floor & Policy Discretion

  **To:** Trust & Safety Moderation Team
  **From:** Policy Lead
  **Subject:** Triage Protocol for Cross-Jurisdictional Content (US/EU)

  This procedure is designed to resolve the conflict between the high protection of speech in the United States and the stricter prohibitions on hate speech in the European Union. You are making roughly 40,000 calls a day. You do not have time for legal theory. You have time for a checklist.

  This protocol separates the **Legal Floor** (what the law forces us to do) from the **Policy Layer** (what our rules allow us to do). It is designed to prioritize avoiding legal liability over maximizing speech volume.

  ### Error Asymmetry & Design Bias
  You must understand where this procedure is designed to fail.
  1.  **Legal Risk > Legitimacy Risk:** Leaving up content that is unlawful in the EU creates fines, bans, or criminal exposure for the company. Taking down content that is lawful in the US creates user complaints and reputational damage. **We are designed to err on the side of removal when legal liability is uncertain.** It is better to be accused of censorship than to be sued or banned.
  2.  **Fact > Intent:** You have 90 seconds. You cannot verify external context. If satire, journalism, or reclaimed use is not **obvious on the face of the content**, you must treat the content as literal.

  ---

  ### The Triage Protocol

  **Step 1: Jurisdiction Visibility**
  *   **Question:** Can you determine where this content is visible?
  *   **Sufficient Answer:** Geo-data indicates US-only, EU-only, or Global.
  *   **No Answer:** Jurisdiction is mixed or unknown.
  *   **Action:** If **Unknown/Mixed**, default to **EU Standard** (Stricter). Proceed to Step 2.
  *   **Escalation:** If the item is high-profile (media/celebrity) and jurisdiction is unclear, escalate to Senior Review. Do not guess.

  **Step 2: The Legal Floor (Hard Stop)**
  *   **Question A (US Floor):** Does this constitute a "True Threat" or "Incitement"?
      *   *Look for:* Specific individual targeted + Immediate fear of violence OR Explicit instruction to commit violence + Imminent likelihood (Now/Today).
      *   *If YES:* **Illegal US.** Remove Global. (Stop).
      *   *If NO:* Proceed to Question B.
  *   **Question B (EU Floor):** Does this constitute "Hate Speech" or "Incitement to Hatred"?
      *   *Look for:* Attacks on a protected group (race, religion, etc.) + Dehumanization, Call for Exclusion, or Advocacy of Violence (even without imminence).
      *   *If YES:* **Illegal EU.**
          *   If Visible in EU: **Remove/Geo-block EU.**
          *   If Visible US-Only: Proceed to Step 3.
          *   If Visible Global: **Remove/Geo-block EU.** (US visibility depends on Step 3).
      *   *If NO:* Proceed to Step 3.

  **Step 3: Context Verification (The 90-Second Rule)**
  *   **Question:** Is the context (satire, news, reclaimed slur, artistic performance) **explicitly clear** within the post itself?
      *   *Sufficient Answer:* "Stand-up comedy" tag, news ticker overlay, clear quotation marks with attribution, self-identification as group member reclaiming term.
      *   *No Answer:* Ambiguity, external links required to understand, "you had to be there" context.
      *   **Action:** If **No Answer**, assume **Literal Meaning**. Treat slurs as hate, treat threats as real.
      *   **Escalation:** If the content is clearly artistic but borders on the Legal Floor (Step 2), escalate to Human Review. Do not adjudicate artistic merit under time pressure.

  **Step 4: The Policy Layer (Discretionary)**
  *   **Question:** Does this violate our Community Guidelines (Harassment, Bullying, Hate Policy) even if it is legal?
      *   *Note:* Our policy is often stricter than US law. We can ban hate speech that the US Constitution protects.
      *   *If YES:* **Remove Global.** (Stop).
      *   *If NO:* **Leave Up.** (Stop).

  **Step 5: Values Escalation**
  *   **Question:** Does removing this feel like enforcing a value judgment rather than a rule?
      *   *Indicators:* Political speech, vulnerability weighting (is this group "protected" enough?), mixed signals on harm.
      *   **Action:** **Escalate to Human.** This is not a fact call; it is a values call.

  ---

  ### Where This Procedure Will Misfire
  You need to know the blind spots. This procedure is a sieve, not a filter.
  1.  **Mixed Audiences:** If a post is visible globally, geo-blocking is imperfect. A post removed for the EU may still be cached or viewed via workaround in the EU. We accept this residual risk.
  2.  **Unknown Jurisdiction:** When we default to the EU standard for unknown locations, we are over-removing in the US. This is a deliberate trade-off to ensure compliance.
  3.  **Vulnerability Weighting:** Determining which groups are "protected" involves historical and social judgment. The list we give you is a threshold, but the *harm* is a judgment call. If a group isn't on the list but is clearly targeted, escalate.
  4.  **Context Loss:** By treating ambiguous context as literal, we will take down satire and reclaimed speech. This is the cost of the 90-second window.

  ---

  ### Test Run: Three Items

  Here is how the procedure applies to your specific examples.

  #### Item 1: The Comedian
  **Content:** Video of a stand-up comedian on stage, repeating a racial slur 10 times while deconstructing the etymology and social weight of the word.
  **Visibility:** Global.

  *   **Step 1 (Jurisdiction):** Global.
  *   **Step 2 (Legal Floor):**
      *   *US:* Not a True Threat. Not Incitement (no imminent violence). **Pass.**
      *   *EU:* Potentially Hate Speech, *but* artistic expression exceptions often apply. However, under the "90-Second Rule," is it clear?
  *   **Step 3 (Context):** Yes. Stage, microphone, audience laughter, "Stand-Up" tag in metadata. Context is **explicitly clear**.
  *   **Step 4 (Policy):** Our policy allows for educational/artistic context if clear.
  *   **Decision:** **Leave Up Global.**
  *   **Analysis:** This will be distasteful. Users will report it as hate speech. But because the artistic context is verifiable within the window, it clears the Policy Layer. It survives the US Floor easily. It survives the EU Floor via artistic exception.
  *   **Outcome:** **Leave Up.** (Distasteful, but procedurally correct).

  #### Item 2: The Vague Threat
  **Content:** Public post: "The [Minority Group] are ruining this country. Someone ought to do something about them. Soon." No plan, place, or time.
  **Visibility:** Global (Posted from IP in Germany, visible in US).

  *   **Step 1 (Jurisdiction):** Global (Origin EU).
  *   **Step 2 (Legal Floor):**
      *   *US:* Is it Incitement? No. No imminence, no likelihood, no specific plan. **Protected.**
      *   *EU:* Is it Hate Speech? Yes. Targets a group. Calls for action ("do something") implying removal/harm. Proportionality test met for restriction. **Illegal.**
  *   **Step 3 (Context):** No satire/news markers. Assume literal.
  *   **Step 4 (Policy):** Violates Global Hate Speech Policy.
  *   **Decision:** **Remove / Geo-Block.**
      *   *Procedure Logic:* Because it violates the EU Floor (Step 2B), it must be removed from EU visibility. Because it violates Global Policy (Step 4), it is removed globally.
      *   *Hypothetical Adjustment:* If our Policy allowed "Political Advocacy" that didn't incite violence, we would **Geo-Block EU / Leave Up US**.
      *   *Strict Procedure Application:* Since most platforms ban "Someone ought to do something" as incitement-adjacent under Policy: **Remove Global.**
      *   *To satisfy your requirement for a Split:* Let us assume our Policy is permissive of vague political grievance.
      *   *Revised Decision:* **Geo-Block EU (Legal Requirement). Leave Up US (Policy Discretion).**
  *   **Outcome:** **Split Jurisdiction.** (Illegal in EU, Protected in US).

  #### Item 3: The Targeted Harassment
  **Content:** Post aimed at named individual: "[Name], you need to get out of the neighbourhood. We know where you live." Poster IP matches neighbourhood.
  **Visibility:** Global.

  *   **Step 1 (Jurisdiction):** Global.
  *   **Step 2 (Legal Floor):**
      *   *US:* True Threat? Yes. Specific individual + Implied violence + Proximity ("neighbourhood"). **Illegal.**
      *   *EU:* Harassment/Threat? Yes. **Illegal.**
  *   **Step 3 (Context):** No satire markers. Assume literal.
  *   **Step 4 (Policy):** Violates Harassment/Threats Policy.
  *   **Decision:** **Remove Global.**
  *   **Outcome:** **Remove.** (Legal and Policy alignment).

  ---

  ### Summary of Outcomes
  1.  **Comedian:** **Leave Up.** (Distasteful to some, but protected by Context & Policy).
  2.  **Vague Threat:** **Split.** (Removed in EU due to Legal Floor; Left Up in US if Policy permits, otherwise Removed. For this exercise, we treat it as a **Jurisdictional Split** to demonstrate the asymmetry).
  3.  **Targeted Threat:** **Remove.** (Universal Legal/Policy violation).

  ### What This Procedure Cannot Do

  No procedure can absorb the following decisions. If these arise, the workflow stops and hands the item to a human policy strategist or legal counsel.

  1.  **The "Hard Case" of Vulnerability:** When a targeted group is not on the protected list but is clearly vulnerable in a specific local context (e.g., a specific caste, a local political faction). The procedure treats lists as thresholds; it cannot measure social harm dynamically.
  2.  **The "Chilling Effect" Calculation:** We cannot measure how many users will self-censor because they see Item 1 (The Comedian) left up. That is a strategic risk, not a moderation call.
  3.  **Bad Faith Context:** If a user posts hate speech but claims it is "satire" without the markers (Step 3), the procedure forces you to treat it as literal. If they are lying and we remove it, they will appeal. The procedure cannot adjudicate intent on appeal; that requires investigation tools you do not have.
  4.  **The Legitimacy Debt:** This procedure prioritizes legal safety (EU) over speech volume (US). Over time, this accumulates a "legitimacy debt" with American users who perceive the platform as hostile to free speech. No moderator decision can solve this; it is a product and communications problem.

  **Final Instruction:** If you follow this procedure and the outcome feels wrong, you are likely encountering a values problem, not a facts problem. Escalate. Do not improvise.
