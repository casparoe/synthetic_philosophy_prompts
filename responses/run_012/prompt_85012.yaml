  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish between "unrendered but stored" (frustum culling) and "undetermined" (procedural gen). The friend mixes these.
      *   *Nuance:* Berkeley's God perceives everything always. The Server doesn't "perceive" the unrendered zone; it stores data. This is a crucial distinction.
      *   *Tone:* Keep it analytical, respectful of the friend's ingenuity, but firm on the metaphysics.

  8.  **Final Polish:** Check against all constraints in the prompt.
      *   Audit correspondence? Yes.
      *   Locate breaks (picturesque vs substantive)? Yes.
      *   Address 3 weak spots (Master Argument, Causal Power, Undetermined)? Yes.
