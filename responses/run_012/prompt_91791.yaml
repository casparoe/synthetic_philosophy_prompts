      However, the standard Perdurantist position is the Worm View. On this view, the word "I" refers to the entire four-dimensional spacetime worm. When you say "I am in pain now," you are saying that the worm has a painful temporal part at this location. When you say "I will retire in ten years," you are saying the worm has a retired temporal part at a later location. The future part is not a descendant; it is literally a part of you, just as your hand is a part of you. It is not wholly present now, but neither are you. You are extended. The pain in the future is yours because it is a state of your extended body, not a state of a different person.

