      However, a subtler question remains regarding the *weight* of concern. Even if the future self is you, why should the present part care about the future part? Spatial parts do not sacrifice for each other; my hand does not suffer for my foot. This highlights that personal prudence relies on psychological unity, not just metaphysical identity. The metaphysics secures the *object* of concern (it is you), but not necessarily the *motivation*.

      The surviving question is not "Is it me?" but "What grounds the special concern?" If you accept the Worm View, the ground is identity. If you accept the Stage View or Parfitism, the ground is psychological continuity. In both cases, the rationality of prudence holds. The metaphysical tangle dissolves the idea that the future is a *different person*, but it leaves you to justify why temporal distance matters less than spatial distance. The block universe does not erase the difference between *me* and *you*, but it does confirm that *future-me* is *me*. Your practical obligation remains intact, grounded either in identity or in the continuity that makes identity possible. You need not fear that your sacrifices are gifts to strangers; they are investments in your own extension.
