answer: |-
  The conceptual issue is that Nyāya defines verbal testimony (*śabda*) as requiring a trustworthy agent with communicative intent, yet we gain undeniable knowledge from automated linguistic outputs where no such agent exists, forcing us to either falsely attribute personhood to machines or admit a gap in the fourfold scheme.

  Imagine you are driving through an unfamiliar city and your GPS navigation system announces, "Turn left ahead to avoid traffic." You turn left, and sure enough, the road is clear; you now know the alternative route was congested. For the Nyāya school, this knowledge should fit into *śabda* (testimony) or *anumāna* (inference), but it fits neither cleanly. To count as *śabda*, the source must be an *āpta*—a trustworthy person who knows the truth and intends to convey it—but the GPS has no mind, no knowledge, and no desire to help you; it is merely code executing math. To count as *anumāna*, you would need to consciously reason, "The machine says left, machines are reliable, therefore left is best," yet most of us obey these commands habitually without forming that syllogism. If you didn't reason, and there is no person to trust, the Nyāya system lacks a category for this valid knowledge, suggesting their definition of testimony relies too heavily on the speaker's virtue rather than the listener's uptake of linguistic structure.

  **Where this reasoning is most likely to fail:**
  A Nyāya specialist would likely argue that the *programmers* or the *data scientists* behind the system are the true *āptas*, and the machine is merely their instrument, much like a letter or a telephone. Additionally, they might contend that *anumāna* does not require conscious deliberation; your habitual trust could be viewed as a subconscious inference based on past successful interactions with technology. If either of these defenses holds, the example collapses back into the traditional four *pramāṇas*, and the tension disappears. To strengthen the case, you would need a scenario involving generative AI where the output was not explicitly intended by any human designer, making the "instrument" defense harder to sustain.
