      *   **Key Constraint 1 (Structure):** Order of components, explaining dependencies (why B follows A).
      *   **Key Constraint 2 (Distinction):** Build on the distinction between the *Arithmetic Objection* (negligible share) and the *Modal Objection* (outcome identical regardless). Introduce this distinction at the precise right moment so it's not heard as technical jargon.
      *   **Key Constraint 3 (Case Study):** Choose *one* central case (Threshold vs. Accumulation). Explain why, what it needs/lacks, and how to handle discarded cases (voting, torturers).
      *   **Key Constraint 4 (Misconceptions):** Anticipate misconceptions, order of surface, and when to head them off. Specifically mentions: "collective responsibility = nobody's responsibility" and "complicity = consequentialism in disguise".
