          *   *Counter:* Expected utility. Small probability $\times$ Huge harm = Significant expected harm. Or complicity/integrity arguments.
      *   *The Modal Objection:* The world is deterministic or threshold-based in a way that *my* specific action doesn't trigger the change. If I don't fly, the plane flies anyway. If I don't eat meat, the cow is already dead/slaughtered.
