answer: |-
  Dear colleague,

  You have asked for the specification before the solution, and that is the right instinct, because the aggregation problem in contractualism is less a puzzle to be solved than a set of constraints to be navigated, and many proposed solutions fail simply because they do not recognize the full shape of the cage they are building. Here is the list of desiderata any theory of interpersonal aggregation must meet to be adequate for the purpose of justifying a principle to each person it burdens, written out as you requested so we can see where the tensions lie.

  The foundational requirement, which I treat as non-negotiable for our purposes though it is the defining preference of the contractualist camp against utilitarianism, is the Individual Justification Constraint. This demands that the reason given to any person for bearing a burden must be intelligible to them as an individual, without appealing to the sum of benefits to others as a standalone justification for their loss. This is not merely an aversion to utilitarianism but a structural requirement of the idea that morality is about mutual recognition; if we allow the sum of small benefits to outweigh a serious harm to one person simply because the sum is larger, we treat the loser as a vessel for value rather than a sovereign source of claims. This constraint rules out any theory that relies on cardinal utility summation across persons, and it is the single requirement that does the most work in ruling out otherwise attractive positions, specifically any form of consequentialism that aggregates value impersonally. It forces the theory to locate the force of numbers not in a greater total good but in the relational structure of the claims themselves.

  Building on that constraint, the theory must accommodate the Rescue Verdict, which is the case where one person will lose a hand unless we act, and two people will each lose a hand unless we act differently. The verdict that we must save the two is non-negotiable; a theory that tells us to flip a coin here fails to capture a basic moral intuition about the importance of preventing harm. However, the theory must explain this without violating the Individual Justification Constraint. It cannot say to the single person, You lose because two hands are worth more than one. It must say something like, Your claim is outweighed because the claims of the two are mutually strengthening or because the principle allowing you to be saved is one they could reasonably reject in a way that the principle saving them is not. This requirement pushes the theory toward a structural account of numbers rather than a quantitative one.

  Conversely, the theory must accommodate the Trivial Benefits Verdict, where a very large number of people would each get a minor pleasure from being allowed to do something, and one person would suffer a serious injury as a result. The verdict that the many do not get their way is non-negotiable for contractualism. This is the mirror image of the Rescue Case and creates the central friction of the specification. If numbers matter in the Rescue Case, why do they not matter here? The theory must explain why the sum of small benefits cannot outweigh a serious harm to one. This requires a distinction between claims that are relevantly comparable and those that are not. The desideratum here is that the theory must possess a threshold or a qualitative distinction that blocks the aggregation of trivial claims against a serious one, even if the number of trivial claims is vast. This is not merely a preference but a requirement to preserve the separateness of persons; without it, the Individual Justification Constraint collapses into a form of utilitarianism where rights are traded off for aggregate welfare.

  This leads directly to the Intrapersonal Case, which you noted is often overlooked. Take the second scenario and redistribute it so that all the small pleasures and the one serious injury fall within a single life at different times. The desideratum here is that the theory must permit aggregation in the intrapersonal case while restricting it in the interpersonal case. A rational agent may reasonably sacrifice a series of minor pleasures to avoid a serious injury to their future self, and a theory of justification must not condemn this as irrational. The reason for this distinction is the separateness of persons objection; the moral friction that exists between distinct individuals does not exist within a single life. Therefore, the theory must have structural resources that distinguish between interpersonal and intrapersonal aggregation, likely by grounding the restriction in the demand for justification to others rather than in rational prudence. If the theory cannot explain why aggregation is permissible within a life but not across lives, it fails to capture the specific moral concern of contractualism.

  Regarding the Extreme Numbers Case, where a loss so slight that no one would notice it is suffered by an astronomically large number of people against a moderate loss to one, the theory must not fall silent. It must deliver a verdict, and preferably one that does not succumb to a slippery slope where trivialities accumulate to outweigh serious harms. This is the transitivity problem. If a moderate loss outweighs a slight loss, and a slight loss outweighs a trivial loss, does a vast number of trivial losses outweigh the moderate loss? The desideratum is that the theory must block this transitivity across qualitative thresholds. It does not need a cardinal measure of complaint, and indeed, a cardinal measure would likely undermine the Trivial Benefits Verdict. Instead, it needs an ordinal ranking of claims based on the strength of the reason each person has to reject a principle, where reasons below a certain threshold of urgency do not aggregate against reasons above that threshold. The theory must specify whether this threshold is sharp or vague, but it cannot be absent.

  On the matter of structural resources, the theory must rely on an ordinal ranking of claims rather than a cardinal measure. A cardinal measure invites the very summation the Individual Justification Constraint forbids. The theory needs to be able to say that one claim is stronger than another, or that two claims of equal strength together outweigh one, without assigning numerical values to the welfare at stake. Furthermore, the theory must handle numbers mattering outside rescue cases, in the distribution of scarce resources and in ordinary political justification. It is not enough to solve the lifeboat scenario; the theory must explain how we justify tax policies or zoning laws where burdens are distributed across populations. If the theory only works in emergency rescue cases, it is too narrow to serve as a general moral framework. The desideratum is that the mechanism used to solve the Rescue Case must be generalizable to non-emergency contexts without yielding absurd results.

  There are also prohibitions on what the theory must not do. It may not help itself to a separate tie-breaking rule for numbers that operates independently of the strength of claims. You cannot simply say claims are equal and then add a rule that says save the greater number; the numbers must matter because of how they affect the reasonable rejectability of the principle, not as an external add-on. Additionally, the theory is not allowed to fall silent on some cases rather than deliver a verdict. Moral indeterminacy is a cost, but systematic silence on aggregation cases is a failure of the theory to guide action. It must be action-guiding even in hard cases.

  Now I must flag the friction within this list, because your suspicion is correct. The requirement to explain why numbers matter in the Rescue Case and the requirement to explain why they do not matter in the Trivial Benefits Case pull in opposite directions. If the mechanism for making numbers matter is simply that more people have claims, then it is difficult to stop those claims from aggregating in the Trivial Benefits Case. If the mechanism is that claims must be of similar strength to aggregate, then you must explain why two hands are similar enough to aggregate but many pleasures are not similar enough to aggregate against a leg. The tension is between the continuity of numbers and the discontinuity of claim strength. To resolve this, the list should surrender the intuition that numbers matter in the Rescue Case for the same reason they seem to matter in utilitarianism. We must accept that numbers matter in rescue not because the total harm is greater, but because the presence of additional people changes the comparative strength of the reasons for rejecting a principle. If we try to preserve a unified explanation of aggregation that works for both rescue and trivial benefits without invoking a threshold of relevance, the theory will collapse into utilitarianism. The cost of surrendering this unified explanation is that the theory becomes more complex and perhaps less elegant, relying on a distinction between relevant and irrelevant claims that some will find ad hoc. However, holding the Trivial Benefits Verdict as non-negotiable is more important than holding the intuitive explanation of the Rescue Case as non-negotiable, because surrendering the former abandons the core contractualist commitment to the inviolability of persons.

  The single requirement that does the most work in ruling out otherwise attractive positions is the Individual Justification Constraint. It rules out utilitarianism, obviously, but it also rules out prioritarianism and any view that allows the aggregation of benefits across persons to justify imposing a serious burden on one. It forces the theory to be agent-relative in its justification even if the outcomes are agent-neutral. Positions that are ruled out include any view that says it is permissible to break one person's leg to prevent a million people from having a headache, regardless of how much total welfare is gained. It also rules out views that treat the rescue case as a simple matter of maximizing lives saved without explaining why the single person cannot reasonably reject the principle that saves the two. The cost of this requirement is that it makes the theory vulnerable to the charge of arbitrariness in drawing the line between aggregable and non-aggregable claims, but that is a price worth paying to maintain the distinction between persons.

  In sum, the specification demands a theory that can count persons without counting benefits, that distinguishes between lives without distinguishing between the value of lives, and that allows aggregation within a life while restricting it across lives. It must be ordinal, action-guiding, and generalizable beyond rescue cases. The friction between the rescue and trivial benefit cases is real, but it is resolved by prioritizing the protection of serious claims over the aggregation of trivial ones, even if that makes the role of numbers in rescue cases seem structurally distinct from simple summation. This is the spec we need to work with before we evaluate any proposed solutions.
