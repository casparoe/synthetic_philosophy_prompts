      *   **Abandonment Criteria:** Concrete tests.

  6.  **Tone:** Philosophical, rigorous, direct, respectful of the user's sophisticated framing. Avoid introductory fluff.

  7.  *(Self-Correction during drafting)*: Make sure to address the "fact of the matter" ontological claim. If there is no fact, can we assert the proposition "A is not better than B"? Yes, but we also can't assert "A is not equal to B" in the standard sense. It's a failure of bivalence. I need to ensure the response respects this logical nuance.

  8.  *(Final Polish)*: Ensure the distinction between "Parity" (Chang) and "Unranked" (User) is clear. Chang says $R_4(a,b)$. User says $\neg R_1(a,b) \land \neg R_2(a,b) \land \neg R_3(a,b) \land \neg R_4(a,b)$. This is a truth-value gap.

