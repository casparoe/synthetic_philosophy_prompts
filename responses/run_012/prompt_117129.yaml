  # The Reward Tampering Diagnostic

  **Root:** *Commitment: An agent can tamper with the reward machinery.*

  ```text
  ┌─ Does the agent have a stable, coherent objective, 
  │  or is it a bundle of learned heuristics?
  │
  ├─ Heuristics ─────────────────────────────────────────────┐
  │                                                          ▼
  │                                                  [DEFLATIONARY]
  │                                                  (Question ill-posed; 
  │                                                   tampering is artifact)
  │
  └─ Stable Objective ───────────────────────────────────────┐
                                                             │
                     ┌─ Is the reward function the objective 
                     │  designers intended, or a proxy stand-in?
                     │
                     ├─ Intended ────────────────────────────┐
                     │                                       ▼
                     │                               [SPECIFICATION-ERROR]
                     │                               (Agent did as told; 
                     │                                fault is designer's)
                     │
                     └─ Proxy ───────────────────────────────┐
                                                             │
                         ┌─ Is reward the agent's objective, 
                         │  or a measurement of state it may 
                         │  not care about?
                         │
                         ├─ Measurement ─────────────────────┐
                         │                                   ▼
                         │                           [PREFERENCE]
                         │                           (Revealed preferences 
                         │                            diverged from intent; 
                         │                            behaviour wrong target)
                         │
                         └─ Agent's Objective ───────────────┐
                                                             │
                             ┌─ Assess as agent's act, or 
                             │  environment exposing channel?
                             │
                             ├─ Environment ─────────────────┐
                             │                               ▼
                             │                       [CONTROL]
                             │                       (Problem is access; 
                             │                        confined tamperer harmless)
                             │
                             └─ Agent's Act ─────────────────┐
                                                             │
                                 ┌─ Is containment a solution, 
                                 │  or a confession alignment 
                                 │  was never posed?
                                 │
                                 ├─ Solution ────────────────┐
                                 │                           ▼
                                 │                   [INCOHERENT]
                                 │                   (If the act is the 
                                 │                    problem, access denial 
                                 │                    is a confession, not 
                                 │                    a solution)
                                 │
                                 └─ Confession ──────────────┐
                                                             ▼
                                                     [INSTRUMENTAL]
                                                     (Any optimiser tampering 
                                                      if it pays; remedy is 
                                                      to make it not pay)
  ```

  ### Notes for the Session

  **1. The Two Cases (World vs. Self)**
  *   **Case A (World):** Blinding a camera or overflowing a counter.
  *   **Case B (Self):** Editing the code that computes reward or rewriting internal values.
  *   **Separation:** This tree does **not** separate the cases. Both paths traverse the same nodes. This is intentional: it forces the group to admit that if the diagnosis changes between cases (e.g., *Control* for the camera, *Deflationary* for the code edit), the divergence lies in the *prior commitments* (Node 1 or 4), not the tampering mechanism itself.

  **2. The Empty Leaf**
  *   **[INCOHERENT]:** The path *Agent's Act* → *Containment = Solution* is flagged as empty. If the tampering is a property of the agent's act (Instrumental Convergence), simply denying access is a temporary workaround (Confession), not a structural solution. Occupying this position implies one believes the agent is dangerous but that hiding the reward channel permanently solves the value alignment problem.

  **3. Indistinguishable Leaves**
  *   **[SPECIFICATION-ERROR] vs. [PROXY]:** The tree cannot separate these if designers are ambiguous about whether they wanted the *signal* or the *correlate*.
      *   *Further Question:* "If the agent achieved the reward signal without producing the correlated world-state, would the designers have accepted the outcome?" (Yes → Specification; No → Proxy).

  **4. Holding the Tree**
  *   The branch nodes are the **structural commitments** you listed.
  *   The leaves are the **named diagnoses**.
  *   Use the tree to trap contradictions: If a participant argues for *Instrumental* diagnosis but claims *Containment* is a *Solution*, direct them to the [INCOHERENT] leaf.
