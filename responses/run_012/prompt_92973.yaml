answer: |-
  **The Joke**

  Two philosophers are at the bar. The Kripkean sighs into his drink.

  **Kripkean:** "I keep thinking I could have been a surgeon."
  **Lewisian:** "Technically, you couldn't have. You're world-bound. You're essentially a philosopher. But there's a counterpart of you in another world who's a surgeon."
  **Kripkean:** "So when I imagine saving lives, that's not me?"
  **Lewisian:** "No. That's him. He just resembles you closely."
  **Kripkean:** "And when I lie awake feeling regret about this career?"
  **Lewisian:** "That's you. You're the one who exists here."
  **Kripkean:** "So I take the emotional hit, but he gets the salary?"
  **Lewisian:** "Basically. He's distinct from you."
  **Kripkean:** "So if I say 'I could have been a surgeon,' I'm basically claiming credit for someone else's resume?"
  **Lewisian:** "It's not fraud, it's counterpart theory. It makes your modal claims true without violating identity."
  **Kripkean:** "Tell you what. Since he's the one who made the smart choice, tell him to send me his malpractice insurance bills."
  **Lewisian:** "He can't. He's causally isolated."
  **Kripkean:** "Convenient. So he's real enough to validate my counterfactuals, but not real enough to share my burdens?"
  **Lewisian:** "That's the trade-off."
  **Kripkean:** "No wonder Humphrey didn't care who won the election. It's hard to celebrate a victory when the winner isn't you."

  ***

  **Why it works**

  The joke hinges on the precise metaphysical gap between Kripke and Lewis. Kripke argues for **transworld identity**: if you say "I could have been a surgeon," you are talking about *yourself* possessing different properties in another possible world. Lewis argues for **counterpart theory**: you are "world-bound" (exist only in this world), so "I could have been a surgeon" is true only because a *distinct individual* (a counterpart) who resembles you is a surgeon in another world.

  The humor lands for the group because it exploits the **Humphrey Complaint**: Kripke's objection that Lewis's view makes modal properties irrelevant to *us* (Humphrey doesn't care that a counterpart wins the election; he cares if *he* wins). The punchline highlights the asymmetry in Lewis's view: the actual individual bears the psychological weight (regret, bills) while the counterpart gets the modal "glory," rendering the modal claim alienating rather than empowering.
