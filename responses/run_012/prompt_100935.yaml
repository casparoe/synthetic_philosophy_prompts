  **Diagnostics of Logical Space**

  **Unoccupied Cells:**
  *   **Q1 Yes (Truth) + Q2 No (Not Binding):** This cell is incoherent. If evidence bears directly on the truth of a proposition, it is by definition binding on a rational agent's confidence; treating it as non-binding contradicts the definition of evidence.
  *   **Q1 No (Reliability) + Q2 Yes (Binding) + Q3 No (No Reduction) + Q5 Yes (Splitting):** This combination is theoretically possible but unoccupied by a named position. It describes a view where reliability evidence binds you to admit irrationality but doesn't force a change in belief, without explicitly endorsing splitting as a *permission*. It is likely unattractive because it offers no clear action guide.
  *   **Q6 Coherence + Q7 Standard:** This combination is unoccupied because the "Standard of Assessment" (Immediate vs. Track Record) is primarily relevant to evidential weight views (like Conciliationism) rather than structural coherence views. Applying a track-record standard to a coherence requirement creates a category error between structural and substantive rationality.

  **Inseparable Leaves:**
  *   **The Total-Evidence View vs. The Level-Splitting Permission View:** Although the tree separates these at Question 1, this distinction is porous. Proponents of the Total-Evidence View often argue that reliability evidence *just is* truth evidence, while Permission proponents argue truth evidence can be outweighed. The tree forces a separation here, but in practice, these views may converge on the same doxastic outcomes depending on how "direct bearing" is interpreted.
  *   **The Equal-Weight (Synchronic) vs. Equal-Weight (Diachronic):** The tree cannot fully separate these in practice because any immediate response is part of a long-run track record. The distinction is merely one of evaluative focus, not necessarily of prescribed action.

  **Higher-Order Cases:**
  *   The "still-higher-order testimony" case (evidence about the peer's reliability) does not force any leaf to split further. It simply iterates the input at Question 1 or Question 6. A Total-Evidence theorist treats it as more truth-evidence; a Conciliationist treats it as adjusting the peer's weight; a No-Level-Splitter treats it as a coherence constraint. The tree accommodates this without branching.

