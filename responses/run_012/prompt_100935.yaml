prompt: |-
  I'm a graduate student TA-ing a seminar on epistemic rationality, and for the session on higher-order evidence I want to hand the students a decision tree instead of a reading. The starting point I want every branch to presuppose is a single case-shape, since I don't want us to get stuck arguing about whether such cases are even possible: an agent reasons competently about some first-order question, and then acquires evidence that bears on whether that first-order reasoning was any good without bearing on the subject matter directly. That evidence could be a peer's disagreement, a track-record fact about her own past judgment in this domain, a drug she has taken that she's told impairs numerical reasoning, or a piece of still-higher-order testimony to the effect that the second peer is himself unreliable about her reliability. From there I want the tree to sort students into the live positions on what rationality requires of her, and every branch node has to be phrased as a question a student can answer without already knowing which position it drops them into — so no node may simply read "are you a conciliationist?" or "do you accept the enkratic requirement?" I'd like the branch questions to come from the logical space rather than from a list of names: whether higher-order evidence is genuine evidence about the first-order proposition or only about the agent's own reliability; whether the rational response is uniquely determined or merely bounded; whether it can ever be rational to hold a belief while regarding the holding of that very belief as irrational; whether the requirement is a requirement of rationality at all or only of some epistemic virtue like conscientiousness; and whether the standard of assessment is the agent's response in the moment or her dispositional, long-run track record. Build the tree first, note which answer-combinations are unoccupied, and briefly diagnose each empty cell — nobody is there because the view is incoherent, or merely unattractive, or simply unexplored — then place the named positions in the space you've built.

  Please make sure the following positions appear as leaves, and give each a one-sentence gloss of its most awkward commitment: the equal-weight or conciliatory view; the steadfast or right-reasons view; the total-evidence view on which the higher-order evidence is not independent of the first-order question; a level-splitting permission view that lets the agent believe the first-order proposition while conceding that the belief is not rational; the no-level-splitting view that treats such a combination as impossible or as a failure of rationality by definition; and the deflationary view that there is no such thing as distinctively higher-order evidence in the first place. Aim for six to nine leaves total and flag any pair of leaves your tree cannot actually separate, rather than papering over the gap — I'd especially like to know whether the tree can distinguish the permission view from the total-evidence view, since I suspect it cannot, and whether the still-higher-order case above forces any leaf to split. I don't need any citations or reading suggestions; I need the structure and the diagnostics. Please write it out in prose with the branch questions numbered and the leaves indented under them, and finish with a single last line beginning "Key:" followed by nothing but the leaf positions as a comma-separated list in the order they appear, so I can paste it into the handout's answer grid.
