answer: |-
  1. **Does the new evidence bear directly on the truth of the first-order proposition, or only on the likelihood that your reasoning was correct?**
      *   *Directly on the truth:* **The Total-Evidence View**. (Gloss: You must treat testimony about your own mental state as direct evidence about the world, potentially inflating the weight of psychological facts.)
      *   *Only on reasoning:* Go to Question 2.

  2. **Is this evidence regarding your reasoning rationally binding, or can it be ignored without irrationality?**
      *   *Can be ignored:* **The Deflationary View**. (Gloss: You must deny that learning about your own impairment or peer disagreement changes your rational status.)
      *   *Rationally binding:* Go to Question 3.

  3. **Does accommodating this binding evidence require you to reduce your confidence in the proposition?**
      *   *No (confidence may remain):* Go to Question 4.
      *   *Yes (confidence must drop):* Go to Question 5.

  4. **Is the rational response to this evidence uniquely determined for all agents?**
      *   *Yes (unique response):* **The Steadfast/Right-Reasons View**. (Gloss: You must claim you can be rational while ignoring evidence of your own unreliability if you actually reasoned correctly.)
      *   *No (response permissive):* **The Permissive Steadfastness View**. (Gloss: You must accept that two agents with identical evidence can rationally diverge completely on the first-order question.)

  5. **Are you permitted to believe the proposition while believing that holding this belief is irrational?**
      *   *Yes (splitting allowed):* **The Level-Splitting Permission View**. (Gloss: You must endorse believing p while simultaneously believing you shouldn't believe p.)
      *   *No (splitting forbidden):* Go to Question 6.

  6. **Is the primary constraint on your response the weight of peer judgment or the requirement for structural coherence?**
      *   *Weight of peer judgment:* Go to Question 7.
      *   *Structural coherence:* Go to Question 8.

  7. **Is the rationality of your response assessed by your immediate state or your long-run track record?**
      *   *Immediate state:* **The Equal-Weight/Conciliatory View (Synchronic)**. (Gloss: You must sacrifice your own reasoning entirely to match a peer you know nothing about.)
      *   *Long-run track record:* **The Equal-Weight/Conciliatory View (Diachronic)**. (Gloss: You must judge rationality by long-run success rather than current coherence.)

  8. **Is the prohibition on level-splitting a requirement of rationality or only of epistemic virtue?**
      *   *Requirement of rationality:* **The No-Level-Splitting View (Strict)**. (Gloss: You must suspend judgment on everything whenever you doubt your own sanity.)
      *   *Requirement of virtue:* **The No-Level-Splitting View (Moderate)**. (Gloss: You must treat structural coherence as optional for rationality.)

