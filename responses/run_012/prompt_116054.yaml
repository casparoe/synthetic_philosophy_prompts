answer: |-
  This is one of the classic puzzles of legal philosophy, often framed as the debate between **Contract** vs. **Status**. Your observation cuts right to the heart of why modern family law exists as a separate category from contract law.

  If we analyze the institution of marriage through the lenses you provided (Reliance, Will/Right Transfer, Relationship Value, and Convention), a specific picture emerges. The current system is not consistent with *one* theory of promissory obligation. Rather, it is a patchwork that explicitly rejects the "Contract/Will" theory in favor of a "Status/Reliance" hybrid, wrapped in a "Performative" ritual.

  Here is the breakdown of what the practice forces, where it is silent, and where it contradicts itself.

  ### 1. The Rejection of the "Will Theory" (Contract)
  **Theory:** A promise binds because I have voluntarily transferred a right to your control (Kant/Will Theory). In a contract, I bind my future will to your benefit.
  **The Practice:** You noted that you can sue a plumber but not a spouse. In contract law, specific performance (forcing someone to do what they promised) is rare but possible; in marriage, it is impossible. You cannot force a spouse to love, stay, or even cohabit.
  **Verdict:** The practice **forces the rejection** of the Will Theory. If marriage were a contract of exchanged wills, the state would enforce the terms. By allowing "no-fault" divorce, the state asserts that your will cannot be bound indefinitely, even by your own prior consent. The "promise to stay" is legally recognized as a promise the law *will not enforce*.

  ### 2. The Reliance Theory (The "Exit" Logic)
  **Theory:** Promises bind because the promisee relied on them to their detriment (Fuller/Atiyah). The obligation arises from the harm caused by the broken expectation, not the promise itself.
  **The Practice:** While you can't sue for the *breakup*, the law *does* intervene upon exit. Alimony, equitable distribution of assets, and child support are essentially reliance damages. The law acknowledges that one party likely sacrificed career prospects or financial independence based on the promise of the marriage.
  **Verdict:** The practice **fits well** with Reliance Theory *upon dissolution*, but not during the marriage. The law doesn't care if you break the promise; it cares if you leave the other person destitute after they relied on you. This explains why the "plumber" gets sued for the cost of the repair (reliance), while the spouse gets sued for half the assets (reliance on the economic union), but neither can be forced to finish the job.

  ### 3. The Status Theory (The "Entry" Logic)
  **Theory:** Marriage is not a private agreement but a public status conferred by the state (Henry Maine). The terms are set by the legislature, not the couple.
  **The Practice:** This explains the license, the officiant, and the building. If marriage were just a promise between two people, saying it in a car should work. But because it is a **change of legal status**, the state requires a "bright line" moment of public record.
  **Verdict:** The practice **forces** the Status Theory regarding formalities. The ceremony isn't about making the promise "real" between the couple (they already promised each other); it's about notifying the state that you have entered a regulated category. The state grants tax benefits, hospital visitation, and immigration rights based on this status. The vows are the ritual incantation required to trigger the status change.

  ### 4. The Problem of "Promising to Love" (Volition)
  **Theory:** You can only promise what you can control. You can promise to *act* loving, but not to *feel* love.
  **The Practice:** Vows almost always include emotional commitments ("love and cherish").
  **Verdict:** This is the point of greatest **inconsistency**, or perhaps, poetic license. The law knows you cannot promise an emotion. By including "love" in the vow, the practice signals that this is *more* than a contract. It admits that the binding force is moral and social, not legal. The law remains silent here because it knows it has no jurisdiction over the interior self. This suggests the "promise" is actually a **declaration of intent** to enter the status, rather than a guarantee of future emotional states.

  ### 5. Social Convention and Performativity
  **Theory:** Words only bind because we agree they do (Austin/Searle). The ceremony is a "performative utterance."
  **The Practice:** Why does the building matter? Because the state acts as the witness to the performative act.
  **Verdict:** This explains the **Ceremony**. A promise in a car is a private moral commitment. A promise in a courthouse is a public legal act. The "magic" isn't in the words; it's in the state's recognition of the words. This fits the observation that we abolished "Breach of Promise" (Heart Balm) suits. We decided that private romantic expectations shouldn't be monetized by courts, but public status changes should be regulated.

  ### Is It Consistent?
  You asked if the system is consistent with itself (solemn vows vs. free exit).

  **It is inconsistent if viewed as a Contract.**
  If the vow is a binding agreement, the free exit is a bug. It makes the vow a lie.

  **It is consistent if viewed as a Liberal Status.**
  The modern theory of marriage is that it is a **voluntary association that requires ongoing consent.**
  *   **The Vow:** Signals the *intent* to enter the permanent status. It creates a presumption of stability.
  *   **The Exit:** Acknowledges that forced intimacy is a violation of liberty (13th Amendment concerns regarding involuntary servitude, philosophically speaking).

  The system presupposes that **autonomy trumps obligation.** We value the *freedom to leave* more than the *sanctity of the promise*. This is why we abolished "Heart Balm" suits in the 20th century: we decided that a woman's (or man's) liberty to choose their partner is more important than their economic security in a promised relationship.

  ### Summary: What Theory Does This Mess Presuppose?

  The practice presupposes a **Status-Based Reliance Theory with Performative Formalities.**

  1.  **Status:** The state defines the relationship, not the parties. (Explains the license/building).
  2.  **Reliance:** The law protects you from the *economic fallout* of the broken promise, not the emotional breach. (Explains alimony/property division vs. no damages for heartbreak).
  3.  **Performative:** The vows are the ritual key to unlock the status, not the terms of a deal. (Explains why the words matter, but not the specific content).
  4.  **Liberty:** The right to exit is absolute. (Explains why you can't sue for breach of the vow to stay).

  **Where it is silent:**
  The law is silent on the *moral* obligation. It assumes that social pressure, religion, and personal integrity will enforce the "stay" part, while the law only handles the "cleanup" part.

  **The Verdict on your Friend's Vows:**
  Legally, your friend didn't sign a contract to stay. She filed a joint tax application with a ritual attached. The vow was a **moral commitment** witnessed by the state, not a **legal guarantee** enforced by it. The "mess" you perceive is the friction between our *moral language* (forever, love, honor) and our *legal reality* (liberty, property, exit rights). We keep the moral language because it serves the social function of encouraging stability, but we keep the legal exit because we value individual freedom more than enforced stability.

  It is hypocritical only if you think the law's job is to enforce morality. If the law's job is to manage liberty and economic harm, it is perfectly consistent.
