      *   *The "Missing Thing":* The instructor suspects students miss something obvious. It's usually the definition of "Measure." They think "measure" = "compare." I need to make sure they know "measure" = "common unit."
      *   *Board Work:* Needs to be rigid. Don't erase the definition of Incommensurability.
      *   *Pre-med angle:* They like metrics. Show them where metrics fail.

  5.  **Finalizing the Steps:**
      *   **Sequence:** 1. Common Measure (Def), 2. Translation Failure (Mechanism), 3. The Case (Evidence), 4. Rationality (Survival).
      *   **Case:** Figure Skating (6.0 vs. CoP). Keep it, but sharpen the "loss of concept" angle.
      *   **Misconceptions:** 1. Incomparability (Stop at Def), 2. Subjectivity (Stop at Case), 3. Irrationality (Stop at Rationality).
      *   **Question:** The Translation Test.
      *   **Refusals:** Metaphysical World-Change, Popper Feud.

