answer: |-
  **1. The Sequence (Board Work & Load-Bearing)**

  Do not erase the left third of the board until the last ten minutes. The structure must remain visible to prevent conceptual drift.

  *   **Step 1 (Minutes 0–10): Define "Measure," not "Science."**
      *   *Write:* **Commensurable = Common Measure (Unit).**
      *   *Write:* **Incommensurable = No Common Unit (Translation Failure).**
      *   *Why:* Students hear "incommensurable" and think "cannot compare." You must lock in the mathematical/logical definition first. If they think it means "cannot compare," the rest of the lecture is noise.
      *   *The Missing Prerequisite:* You assume they know **meaning is holistic**. They don't. They assume words map to objects directly. Before Step 2, write: **Terms derive meaning from system rules.** Without this, they will think "Score" means the same thing in 1998 and 2004.

  *   **Step 2 (Minutes 10–25): The Mechanism of Translation.**
      *   *Write:* **Translation requires shared vocabulary.**
      *   *Write:* **If Vocabulary A lacks Concept B, Translation fails.**
      *   *Why:* This load-bears the case. You need them to see that loss of meaning is not loss of truth.
      *   *Intervention:* Explicitly state: "Incommensurability is about *talking*, not *seeing*."

  *   **Step 3 (Minutes 25–50): The Case Application.**
      *   *Write:* **System 1 (6.0): Holistic Units (Technical + Artistic).**
      *   *Write:* **System 2 (CoP): Atomic Units (Base + GOE + 5 Components).**
      *   *Why:* This maps the definition to the example. The "Artistic" unit in System 1 has no single equivalent in System 2. It was dissolved, not measured.
      *   *Load-bearing:* This proves Step 2. If they accept the units are different, they must accept translation fails.

  *   **Step 4 (Minutes 50–65): Rationality Survival.**
      *   *Write:* **Shift triggered by Anomaly (2002 Scandal).**
      *   *Write:* **Choice = Problem Solving, not Faith.**
      *   *Why:* This prevents the "irrational conversion" misconception. The reason for the shift is external (corruption/failure), even if the languages don't match.

  **2. The Single Case: Figure Skating (6.0 vs. Code of Points)**

  **Keep it.** It is the right shape, but you must frame it carefully to avoid the "new is better" trap.

  *   **Why it works:** It mirrors Kuhn's claim that paradigm shifts involve a change in *what counts as a valid question*. In 6.0, "How artistic was it?" was a valid single question. In CoP, that question is illegal; you must ask five separate questions. The concept "Artistic Impression" literally ceased to exist as a measurable unit. This is exactly Kuhn's point about "mass" or "species."
  *   **The Trap:** Pre-meds love metrics. They will argue CoP is "more objective."
  *   **The Fix:** Do not debate objectivity. Debate **ontology**. Ask: "Where did the 'Artistic' score go?" It wasn't refined; it was deleted. If you delete a variable, you cannot translate the old equation into the new one. That is incommensurability.
  *   **Constraint Check:** It avoids Ptolemy/Copernicus (too familiar) and Duck-Rabbit (too perceptual). It focuses on *vocabularies of appraisal*, which fits the "no common measure" definition perfectly.

  **3. Misconceptions (Order & Intervention)**

  *   **Misconception 1: Incomparability ("Anything Goes").**
      *   *When it forms:* Minute 15, when you write "Incommensurable."
      *   *Where to head it off:* **Step 1.** Explicitly say: "We can compare the systems. We cannot translate the scores." Write **Comparison ≠ Translation** on the board.
  *   **Misconception 2: Value Disagreement ("They just value art less").**
      *   *When it forms:* Minute 35, during the Case.
      *   *Where to head it off:* **Step 3.** When a student says "They just care more about tech now," correct them: "It's not that they value it less; it's that 'Art' is no longer a single thing they *can* value. The category dissolved."
  *   **Misconception 3: Irrational Conversion ("It's just faith/politics").**
      *   *When it forms:* Minute 60, during Conclusion.
      *   *Where to head it off:* **Step 4.** Anchor the shift to the 2002 Judging Scandal. That is an external anomaly (corruption), not an internal faith shift. The reason for the change is public and rational, even if the languages don't match.

  **4. Assessment Question (Last 10 Minutes)**

  **Question:** "A judge from 1998 wants to explain why Skater X was 'better' than Skater Y using only the 2004 Rulebook. Can they do it?"

  *   **Wrong Answer (They missed the point):** "Yes, because the 2004 system is more precise so they can just show the new scores." (This assumes commensurability/progress).
  *   **Right Answer (They got it):** "No, because 'Better' in 1998 relied on 'Artistic Impression,' which has no equivalent variable in 2004. The claim cannot be stated, not just not believed."

  **5. What to Refuse (Say This Out Loud)**

  *   **Refuse "World-Change" Metaphysics:** Tell them: "We are not debating whether the ice actually changed. We are debating whether the *language used to describe the performance* allows for direct translation. I am not teaching metaphysics today; I am teaching semantics."
  *   **Refuse the Kuhn/Popper Soap Opera:** Tell them: "We are not discussing falsification or whether Kuhn was a relativist. We are looking at one specific claim about vocabulary loss. I will not summarize the secondary literature; we are analyzing the text."

  Verdict: Keep the Figure Skating Case.
