      *   *Wait, check the "Refusals" section.* The user wants to know what to openly refuse. I need to specify *why* briefly so they can say it out loud.

      *   *Check the "Missing Thing" again.* The instructor says "15 minutes in and realize they can't even hear the claim." Usually, this is because they think "Incommensurable" means "Cannot talk to each other." I need to make sure the definition of "Commensurable" is mathematical/logical, not conversational.

