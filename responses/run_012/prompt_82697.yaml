              1.  Define "Commensurable" (Common Measure).
              2.  Define "Incommensurable" (No Common Measure, NOT No Comparison).
              3.  The Condition for Translation (Shared Vocabulary/Rules).
              4.  The Case Application (Old System vs. New System).
              5.  The Consequence (Loss of Meaning, not Loss of Truth).
          *   *The Missing Thing:* Students assume words map directly to world-objects regardless of theory. They need to know that *meaning is use within a system*. Before opening mouth: Establish that "Score" means something different in System A vs. System B.

      *   **2. The Single Case (Figure Skating):**
          *   *Evaluation:* The 6.0 vs. Code of Points (CoP) is actually strong. It avoids the "truth" trap of astronomy/chemistry. It's about *evaluation criteria*.
          *   *Pros:* Concrete, rules-based, involves "measurement" (scoring), involves "artistic" vs. "technical" shift.
          *   *Cons:* Students might say "CoP is just more objective/better."
          *   *Fix:* Focus on the *loss* of the concept "Artistic Impression" as a holistic unit. In 6.0, "Artistic" was a primitive. In CoP, it's decomposed into Components (Skating Skills, Transitions, Performance, Composition, Interpretation). You cannot translate a 5.8 Artistic into CoP. It's not that CoP is *true* and 6.0 *false*, it's that the *unit of appraisal* changed.
          *   *Verdict on Case:* It works if framed as "Loss of Vocabulary" not "Improvement of Accuracy." It fits the "no common measure" (you can't convert a 6.0 score to a CoP score).
          *   *Constraint Check:* Must avoid "new is better." Focus on *translation failure*.

      *   **3. Misconceptions (Order & Intervention):**
          *   *Misconception 1: Incomparability.* (They think Kuhn says we can't choose).
              *   *Intervention:* When defining "Incommensurable" on board. Explicitly write: "Comparison ≠ Measurement."
          *   *Misconception 2: Value Disagreement.* (They think it's just arguing about what matters).
              *   *Intervention:* During Case Application. Show that it's not that they value art less, it's that "Art" no longer exists as a single variable.
          *   *Misconception 3: Irrational Conversion.* (They think shifts are faith-based).
              *   *Intervention:* Before concluding. Show that reasons exist (solving anomalies like the 2002 scandal), but the *language* of the reason changes.

      *   **4. Assessment Question:**
          *   Needs to distinguish "understanding translation failure" vs. "thinking it's just progress."
          *   *Question:* "Can a judge from 1998 explain to a judge from 2004 why a specific skater was 'better' using only the 2004 rulebook?"
