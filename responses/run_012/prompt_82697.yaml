      *   *Wait, one check on the Skating Case:* The user asked "Is that the right shape... or does it fall apart...?" I need to be decisive. It is the right shape *if* framed as lexical loss. I need to confirm the details: 6.0 was ordinal/ranking mostly, CoP is cumulative/absolute. The key is "Artistic Impression" disappearing as a single metric. This matches Kuhn's "no neutral language" claim.
      *   *Missing Prerequisite:* The distinction between *observation* and *interpretation* is too basic. The real missing piece is that *meaning is holistic*. They assume words have definitions independent of the system. I need to put "Meaning = Position in Network" on the board first.

      *   *Revised Sequence:*
          1.  Board: "Common Measure" (Unit).
          2.  Board: "Translation" (Mapping).
          3.  Board: "Local Meaning" (Holism).
