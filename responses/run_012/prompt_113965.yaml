prompt: |-
  I host a small interview podcast about minds, and next month's guest is a cognitive scientist who's been defending Hofstadter's knob-twiddling picture of creativity for years -- the one from his essay on variations on a theme, where being creative is just moving around inside a space of variations and there's no miracle moment where an idea drops out of the sky. She's pushed it further than he did: she says there's no separate act of having an idea, that jazz improvisers and composers are doing the same thing, and that scientific discovery is knob-twiddling too.

  Draft me eight to ten questions that go at the view instead of letting her restate it. At least one on where the knobs come from -- if spotting the dimensions of variation is itself the creative act, hasn't she assumed the thing she's supposed to explain -- with the follow-up for when she says the space of variations is itself fluid. One on what separates twiddling from brute combinatorial search or blind mutation-and-selection, i.e. what stops the trivial twiddles (transpose it, swap the font, add a trill) from counting as creative. One on whether the account can be wrong about anything, or whether it just re-describes every case after the fact, plus a follow-up for when she reaches for the computer models as evidence. And one on her flattening of improvisers and composers. Keep them answerable out loud in a couple of minutes each, no inside baseball for listeners, and no warm-ups like what drew her to this.
