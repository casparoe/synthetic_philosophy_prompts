answer: |-
  You have hit on exactly the right intuition, but you are misunderstanding what the literature claims is "impossible." You aren't missing a logical trick; you are missing the *normative* trade-off that makes this a dilemma rather than a simple error.

  Here is the breakdown of why your fixes are valid, why people still use the "broken" method, and what the actual impossibility theorem says.

  ### 1. Correction on Fix #1: Individuals *are* consistent
  You suggested: *"Before you aggregate, just check that each person's own answers are consistent."*

  In the standard setup of the Discursive Dilemma (also known as the Doctrinal Paradox), **the individuals are already consistent.** That is the whole point of the paradox.

  Look at your tenure committee again:
  *   **Member A:** Research (Yes), Teaching (No) → Tenure (No). *Consistent.*
  *   **Member B:** Research (Yes), Teaching (Yes) → Tenure (Yes). *Consistent.*
  *   **Member C:** Research (No), Teaching (Yes) → Tenure (No). *Consistent.*

  Every single member is logically perfect. They all follow the rule: *Tenure iff Research AND Teaching.*

  The "dilemma" is not that the individuals are irrational. The dilemma is that **logical consistency is not preserved under majority voting.** You can have three perfectly rational agents produce a collectively irrational outcome. So, Fix #1 doesn't apply because there is no individual inconsistency to fix.

  ### 2. Fix #2 is real, but it has a name
  You suggested: *"Don't vote on the sub-questions at all, just ask everyone 'tenure, yes or no'."*

  You have independently rediscovered what social choice theorists call the **Conclusion-Based Procedure (CBP)**. The method you are criticizing (voting on research and teaching separately) is called the **Premise-Based Procedure (PBP)**.

  Scholars absolutely "take" your fix. It is the standard alternative. The literature is not saying "there is no way out." The literature is saying: **"You have to choose between CBP and PBP, and both have costs."**

  ### 3. Why would anyone ever use the Premise-Based Procedure?
  This is the core of your question: *"If the conclusion-vote is clean, why would anyone ever do it the other way?"*

  If the only goal were to produce a consistent binary decision, CBP (your Fix #2) is indeed superior. However, institutions often care about things other than just the final binary output. They vote on premises for three main reasons:

  **A. Accountability and Explanation**
  If a committee denies tenure, and they used CBP (voting only on the final outcome), the output is just "No." The candidate asks, "Why?" The committee must say, "Because a majority of us felt like saying no."
  If they use PBP (voting on premises), the output is "No, because a majority agreed the Research was weak."
  PBP forces the group to go on the record about the *reasons*. This protects against arbitrary decision-making. It allows for appeals. In a legal context (where this paradox was discovered), a judge cannot simply rule "Guilty"; they must establish that the elements of the crime were met. If you vote only on the conclusion, you cannot establish legal precedent.

  **B. Mandate and Guidance**
  Suppose the committee grants tenure via CBP. We know the person gets tenure. But do we know if the department should invest in research support or teaching support?
  If we used PBP and found that Research was "Weak" but Teaching was "Strong," the department knows the new professor needs research support. If we just voted "Tenure: Yes," that diagnostic information is lost. PBP provides a mandate for future action; CBP provides only a decision.

  **C. Deliberative Discipline**
  Voting on premises forces members to engage with the specific criteria. If you allow a vote on the conclusion only, a member might vote "No" because they personally dislike the candidate's haircut. If you force them to vote "Research: Strong/Weak," you constrain them to evaluate the actual criteria. PBP acts as a constraint on bias.

  ### 4. What is the actual "Impossibility"?
  You mentioned everyone treats this like a "deep impossibility." You are right to be skeptical of the hype, but the impossibility theorem (specifically the **List-Pettit Theorem**) is more subtle than "you can't get a consistent answer."

  The theorem proves you cannot satisfy all of the following conditions simultaneously:
  1.  **Consistency:** The group's judgments are logically consistent.
  2.  **Anonymity:** Every member's vote counts equally.
  3.  **Systematicity:** The group decides each proposition based on the individual votes on *that* proposition (i.e., you vote on Research to decide Research, you vote on Tenure to decide Tenure).

  Your Fix #2 (CBP) solves the problem by **dropping Systematicity.** You are ignoring the votes on the premises when determining the premises. You are saying, "We won't aggregate the Research votes; we will infer the Research status from the Tenure vote."

  So, the "impossibility" is not that you can't get a consistent result. **The impossibility is that you can't have a consistent result *while also* respecting the majority view on every individual reason.**

  ### Summary
  You aren't missing anything logical. You are correctly identifying that **Conclusion-Based Voting** solves the consistency problem.

  The reason the Discursive Dilemma is still a "dilemma" is that **consistency is not the only value.**
  *   If you value **logical consistency and decisiveness**, you use your Fix #2 (Conclusion-Based).
  *   If you value **transparency, precedent, and accountability for reasons**, you use the Premise-Based method, and you accept the risk that the collective outcome might look logically inconsistent (or you accept that you must override the majority on the conclusion to match the premises).

  The "dilemma" is the realization that **democratic responsiveness to reasons** and **collective rationality** are sometimes incompatible. You have to choose which one you are willing to sacrifice. Most tenure committees actually do what you suggest (secret ballot on the final decision), but courts and legislatures often cannot, because they are required to justify their reasoning.
