      *   *Make sure to address the "Sender" issue:* The user says "no sender." I need to argue that the *causal history* acts as a functional sender. The crystal *generated* the pattern.
      *   *Tone:* Respectful, peer-to-peer (intellectual), avoiding overly dense jargon but precise on philosophy of science.

  7.  **Final Polish:**
      *   Structure the answer clearly: Identify the break, explain the illusion, offer the repair, discuss the cost.
      *   Ensure the distinction between *semantics* (GEB) and *semiotics/physics* (Crystallography) is clear.
      *   Conclude with reassurance: Structural science is safe.

  8.  *(Final check against prompt requirements)*:
      *   Tell which step fails? (Step 4, aided by 3).
