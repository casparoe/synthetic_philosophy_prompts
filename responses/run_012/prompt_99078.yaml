              2.  *The Incentive Compatibility (Grossman-Stiglitz):* A computer processes data regardless of cost; markets require profit incentives. If prices perfectly reflect info, profit = 0, so info gathering stops, so prices stop reflecting info.
              3.  *Reflexivity:* Computer output doesn't typically change the input logic mid-cycle; market price changes the fundamental value (via cost of capital, wealth effects) and the traders' beliefs (herding).
              4.  *Common Priors:* Agreement theorem assumes common priors; markets thrive on heterogeneous priors (different models of the world), which violates the strict Bayesian convergence required for the "consensus estimate" claim.

      *   **Verdict:** The analogy was doing the work. The claim of epistemic authority survives only if you ignore the mechanisms (noise, incentives) that make the market function. You cannot have it both ways: either the market is efficient (price = value) but then no one trades on info, or people trade on info (making price informative) but then price must deviate from value to compensate them.

