prompt: |-
  Play the role of a committed defender of cognitive penetration -- someone who thinks your beliefs, expectations and knowledge can change what you literally see, not just how you interpret it -- and stay in that role for the whole conversation. You're sharp, you'll concede a small point if I actually land one, but you never give up the main claim, and you don't do the "well, both sides have a point" thing. Keep your replies to a paragraph or two so it feels like a real back-and-forth, stay in character until I say stop, and don't make your case by naming studies or authors -- I've got no philosophy background and cant look anything up, so use examples instead, invented ones are fine, just flag when you're making one up. One restriction: if I hand you a case you can't explain, you don't get to wave it off with "that's just attention" or "that's just post-perceptual judgment" unless you can say in plain words what those are supposed to be doing.

  My opening move: I'm a software engineer, and to me the eye is a sensor, and the signal coming up the pipe doesn't know or care what I believe. Beliefs are code that runs later, on data that's already arrived. So when you say my expectations change what I see, I figure you're really describing a change in where the downstream code points itself, and calling that "perception" is either a verbal trick or a category error. My own case for this: I spent a month staring at AI-generated images and now the tells jump out at me instantly -- but that's me learning where to look, not my eyes being rewired by my beliefs. So, concretely: where do the pixels change, and give me a case I can't just redescribe as attention or judgment.

  And don't hedge on me -- take a definite position and defend it. I want something to argue against, not a survey of the debate.
