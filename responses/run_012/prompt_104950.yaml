prompt: |-
  ok so i'm writing an essay for a general-ish philosophy-of-physics audience and i want you to tear into it. not copyedit stuff — i mean: is the central move actually defensible, and is any of the physics just wrong? i don't need citations or reading suggestions, just your read.

  the thesis: people say Bell's theorem killed locality, then everyone argues about whether that means spooky action or just correlations. i think that framing hides the interesting part. there are two things you could mean by locality:

  1. no influence travels faster than light — call it wire locality. signals, pushes, whatever. experiment says we keep this one; you can't use entanglement to send a message.
  2. the complete explanation of an event is contained in its past light cone — call it light-cone completeness. nothing about the event needs to be booked against facts outside that cone, even if nothing gets pushed.

  my claim is Bell's theorem leaves wire locality standing and kills light-cone completeness, and that this is the actual scandal. physics got to keep causality-as-influence and had to give up causality-as-in-explanation, and almost everyone muddles the two.

  then the essay does some work:

  - argues the correlations in entangled pairs can't be explained by anything inside either wing's past cone, since any such local story would have to fix the outcomes in advance in a way that either wrecks the statistics or reintroduces a common cause the setup doesn't have.
  - concedes this is a theorem about certain classes of theories: it rules out any theory where the outcome on one side is fixed once you've specified everything in that side's past cone, whether the theory is deterministic or not.
  - then a section i'm unsure about: i claim Bohmian mechanics is a clean illustration, because it's flagrantly nonlocal in its dynamics and yet still can't signal, so it shows the two notions really come apart. but i also say something like "so really the violation is just about the bookkeeping, correlations are just correlations," and a friend told me that last bit undercuts the whole essay.
  - ends by suggesting we should be relaxed about nonlocal explanation — weird but not incoherent — while staying strict about nonlocal influence.

  comments i want:

  (a) is the wire-locality / light-cone-completeness distinction real, or is it just relabeling the standard parameter-independence vs outcome-independence thing? if it's the latter, is the essay pointless?
  (b) am i using the Bohmian example right? i have a nagging feeling i'm mixing up which notion Bohm actually violates.
  (c) does the "correlations are just bookkeeping" line sink it, or can i save it by saying the bookkeeping has to be done somewhere?
  (d) the step from "no local explanation of the correlations" to "so light-cone completeness is dead" — is there a gap i'm papering over? someone could say i've only shown it for these particular correlations, not for explanation in general.
  (e) anything that's just flat wrong about Bell's theorem itself. i know there are versions that drop determinism, and i really don't want to be the person who says Bell assumed determinism.

  be blunt, and if you think the whole distinction is a dodge, say so.
reasoning: |-
  Here's a thinking process that leads to the suggested feedback:

  1.  **Analyze the User's Request:**
      *   **Task:** Critique an essay draft/outline for a general philosophy-of-physics audience.
      *   **Focus:** Defensibility of the central move, accuracy of the physics. *Not* copyediting.
      *   **Thesis:** Bell's theorem kills "light-cone completeness" (explanatory locality) but preserves "wire locality" (signal locality/influence). The scandal is giving up causality-as-explanation, not causality-as-influence.
      *   **Specific Questions:**
          *   (a) Is the distinction (wire vs. light-cone) real or just Parameter Independence (PI) vs. Outcome Independence (OI)?
          *   (b) Is Bohmian mechanics used correctly?
          *   (c) Does the "correlations are just bookkeeping" line undermine the argument?
          *   (d) Is there a gap between "no local explanation of correlations" and "light-cone completeness is dead"?
          *   (e) Any flat errors regarding Bell's theorem (specifically regarding determinism)?
      *   **Tone:** Blunt, critical, no citations/reading suggestions.

  2.  **Deconstruct the Thesis & Terminology:**
      *   *Wire Locality:* No superluminal signaling (Signal Locality / Parameter Independence).
      *   *Light-Cone Completeness:* The complete physical state of the past light cone determines (or fixes the probabilities of) the event. This sounds like Reichenbach's Common Cause Principle or Bell's "Local Causality."
      *   *Claim:* Bell kills Light-Cone Completeness, saves Wire Locality.
      *   *Verdict:* This is a standard and defensible interpretation, often associated with the "Peaceful Coexistence" view (Shimony) or specific ontic/epistemic distinctions. However, the terminology needs scrutiny.

  3.  **Address Question (a): Wire/Light-Cone vs. PI/OI:**
      *   *PI (Parameter Independence):* Outcome at A doesn't depend on Setting at B. (Related to Signal Locality).
      *   *OI (Outcome Independence):* Outcome at A doesn't depend on Outcome at B (given hidden variables).
      *   *Bell's Local Causality:* $P(A|B, \lambda, a, b) = P(A|\lambda, a)$. This implies PI + OI.
      *   *User's Distinction:*
          *   "Wire Locality" $\approx$ Signal Locality (No signaling theorem).
          *   "Light-Cone Completeness" $\approx$ Bell's Local Causality (or Local Realism).
      *   *Critique:* It's not *just* relabeling PI/OI. PI/OI is a mathematical decomposition of Bell's condition. The user's distinction is more conceptual/physical (influence vs. explanation). However, "Light-Cone Completeness" is a strong term. If it means "the state in the past light cone fixes the outcome," that's determinism + locality. If it means "fixes the *probability*," that's stochastic locality. Bell rules out the latter too.
      *   *Risk:* If "Light-Cone Completeness" is interpreted as "the state in the past light cone contains *all physical facts* relevant to the event," then QM says "No, you need the wavefunction which is non-local."
      *   *Verdict:* It's a useful pedagogical distinction, not pointless, but needs precise definition to avoid conflating with PI/OI. It maps better onto "Signal Locality" vs. "Bell Locality."

  4.  **Address Question (b): Bohmian Mechanics:**
      *   *User's Claim:* Bohm is nonlocal in dynamics but can't signal. Shows the two notions come apart.
      *   *Physics Check:* Bohm is explicitly non-local. The velocity of particle A depends on the position of particle B instantaneously. However, due to the Quantum Equilibrium Hypothesis ($\rho = |\psi|^2$), you cannot control the hidden variables to signal.
      *   *User's Worry:* "Correlations are just correlations" undercuts the essay.
      *   *Critique:* Bohm is the *perfect* example for "Wire Locality holds, Light-Cone Completeness fails." In Bohm, the *ontology* is non-local (violating light-cone completeness of the physical state), but the *empirical access* is local (no signaling).
      *   *The "Bookkeeping" Trap:* Saying "correlations are just bookkeeping" sounds instrumentalist. If the essay argues for a realist reading (explanation), calling it bookkeeping sounds like "shut up and calculate." It undermines the "scandal of explanation" point. If the explanation is just bookkeeping, where's the scandal?
      *   *Verdict:* Use Bohm to show the *mechanism* of non-locality is hidden, not that the non-locality is fake.

  5.  **Address Question (c): "Correlations are just bookkeeping":**
      *   *Critique:* This is the weakest link. If correlations are *just* bookkeeping, then there is no ontological scandal, just an epistemic update. The thesis relies on there being a real "scandal" about explanation.
      *   *Fix:* The bookkeeping *must* be done by something real. The wavefunction (in standard QM) or the pilot wave (in Bohm) lives in configuration space, not 3D space. That's the violation of light-cone completeness. The "bookkeeping" isn't passive; it requires a non-local object.
      *   *Verdict:* Yes, it sinks it if left as "just correlations." Needs to be "correlations require a non-local ledger."

  6.  **Address Question (d): The Gap (Correlations -> General Explanation):**
      *   *Critique:* Bell rules out local explanations *for these statistics*. Does it rule out light-cone completeness for *everything*?
      *   *Nuance:* Technically, Bell rules out Local Causality for the specific setup. One could argue maybe gravity or other fields still obey light-cone completeness.
      *   *Defense:* If the fundamental stuff (quantum fields/particles) violates it, then "Light-Cone Completeness" is not a universal principle of physics anymore. It's broken as a fundamental norm. That's enough for the essay's scope.
      *   *Verdict:* Don't overclaim. Say it breaks the principle as a *universal* constraint, not that literally no event in the universe obeys it.

  7.  **Address Question (e): Bell and Determinism:**
      *   *Check:* Did Bell assume determinism?
      *   *Fact:* The 1964 paper used deterministic hidden variables. The 1976 "Local Causality" formulation generalized to stochastic theories.
      *   *User's Stance:* "I really don't want to be the person who says Bell assumed determinism."
      *   *Advice:* Good. Ensure the text reflects that Bell's inequality holds for stochastic local hidden variable theories too. The user's draft says "whether the theory is deterministic or not," which is correct.
      *   *Verdict:* As long as the essay acknowledges stochastic local theories are also ruled out, it's safe.

  8.  **Synthesize and Refine:**
      *   *Tone:* Blunt, professional, philosophical.
      *   *Structure:* Address (a) through (e) directly, then offer a summary verdict.
      *   *Key Insight:* The user's distinction is basically Signal Locality vs. Bell Locality. This is standard but framing it as "Influence vs. Explanation" is a good rhetorical move. The danger is slipping into instrumentalism ("just bookkeeping") which kills the ontological punch.
      *   *Bohm:* Clarify that Bohm violates "Light-Cone Completeness" explicitly in its ontology, making it the proof of concept for the distinction.
      *   *The "Scandal":* The scandal is that the *world* isn't locally complete, not just our *knowledge*.

  9.  **Drafting the Response:** (Self-Correction during drafting)
      *   *Wait, check "Light-Cone Completeness" definition again.* User says: "complete explanation of an event is contained in its past light cone." If QM is complete, and the wavefunction is global, then the "complete explanation" is *not* in the past light cone. This holds up.
      *   *PI/OI:* Shimony's distinction is PI (controllable) vs OI (uncontrollable). User's Wire vs. Light-Cone is similar but framed ontologically. I need to point out that PI/OI is about *probabilities*, whereas User is talking about *explanation*. This is a strength, not a weakness, provided they don't confuse them.
      *   *Bohm:* In Bohm, the guidance equation is non-local. This violates "Wire Locality" at the ontological level, but respects it at the empirical level. The user says Bohm is "flagrantly nonlocal in its dynamics and yet still can't signal." This is correct. This supports the distinction perfectly.
      *   *The "Bookkeeping" line:* This is definitely the danger zone. If it's just bookkeeping, why care? The essay needs to argue that the *ledger itself* is non-local.

  10. **Final Polish:** Ensure I answer the specific prompts (a-e) clearly. (Proceed to generate output based on these thoughts.)
answer: |-
  Here is the blunt read you asked for.

  ### (a) Is the distinction real or just PI/OI relabeled?
  It is not pointless, but you are skating on thin ice over the Parameter Independence (PI) / Outcome Independence (OI) distinction without acknowledging it.

  *   **Wire Locality** is effectively **Signal Locality** (which follows from PI).
  *   **Light-Cone Completeness** is effectively **Bell's Local Causality** (which requires both PI and OI).

  If you present this as a fresh dichotomy without nodding to Shimony's decomposition, a specialist reader will think you've reinvented the wheel. However, framing it as **Influence vs. Explanation** is a valuable conceptual shift. PI/OI is mathematical; Wire/Light-Cone is physical/ontological.

  **Verdict:** The distinction is defensible and useful for a general audience, *provided* you don't imply it's new to you. The risk is that "Light-Cone Completeness" sounds like determinism. You need to be explicit that even stochastic theories fail this test. If the probabilities in the light cone aren't enough to fix the probabilities of the outcome (without reference to the spacelike separated setting/outcome), then completeness is dead. That is the correct reading of Bell.

  ### (b) Are you using Bohm right?
  You are using Bohm correctly to illustrate the *separation* of the two concepts, but you are waffling on what Bohm actually tells us.

  Bohmian mechanics is **ontologically non-local** (violates Light-Cone Completeness aggressively) but **empirically local** (preserves Wire Locality). This is the perfect proof of concept for your thesis: it shows a world where the two notions come apart.

  **The Trap:** You say Bohm shows "correlations are just correlations." In Bohm, correlations are *not* just correlations; they are mediated by a pilot wave that lives in configuration space and updates instantaneously. The non-locality is real dynamical stuff, it's just hidden from our control.

  **Verdict:** Use Bohm to prove that a theory *can* violate Light-Cone Completeness while respecting Wire Locality. Do not use it to suggest the non-locality is "fake." If you say the non-locality is just bookkeeping in the Bohm section, you contradict the "scandal" you're trying to sell. In Bohm, the bookkeeping is done by a real, non-local field.

  ### (c) Does "correlations are just bookkeeping" sink it?
  **Yes.** This line undercuts your entire thesis.

  Your thesis is that we have to give up "causality-as-in-explanation." That is an ontological claim. It says the *world* is not locally complete. If you retreat to "correlations are just bookkeeping," you are making an epistemic claim (it's just about our knowledge).

  If it's just bookkeeping, then Light-Cone Completeness might still hold for the *real state of affairs*, and we just can't access it. That restores the "hidden variable" hope that Bell killed.

  **The Fix:** You need to say the bookkeeping *requires a non-local ledger.* The correlations aren't brute facts; they are enforced by a structure (the wavefunction, the pilot wave, whatever your ontology is) that does not reside in the past light cones of the measurements. The scandal is that the ledger itself is non-local.

  ### (d) Is there a gap from "these correlations" to "explanation in general"?
  There is a gap, but it's bridgeable.

  Strictly speaking, Bell only rules out local explanations for *quantum entanglement phenomena*. A pedant could say, "Okay, entanglement is non-local, but maybe the collision of billiard balls is still light-cone complete."

  **The Defense:** You don't need to prove *every* event violates Light-Cone Completeness. You only need to prove it is not a *universal principle* of physics. If fundamental physics (which governs the billiard balls eventually) relies on non-locally complete entities (fields/wavefunctions), then the principle is dead as a fundamental norm.

  **Verdict:** Don't overclaim. Say Bell destroys Light-Cone Completeness as a *universal constraint on physical theory*, not that literally no event can ever be locally explained. Classical limits can still look local; the fundament cannot.

  ### (e) Anything flat wrong about Bell?
  You are safe on determinism. You explicitly note the theorem applies whether the theory is deterministic or not. That is the crucial 1976 Bell ("Local Causality") upgrade over the 1964 paper.

  **One nuance to watch:** You say "any such local story would have to fix the outcomes in advance." Be careful with "fix the outcomes." In a stochastic local theory, the past light cone fixes the *chances*. Bell rules out the local story even if the past light cone only fixes the chances (provided those chances factorize correctly).

  If you write "fix the outcomes," you sound like you're assuming determinism.
  If you write "fix the probabilities of the outcomes," you are safe.

  **The "Common Cause" bit:** You say a local story would have to "reintroduce a common cause the setup doesn't have." This is slightly imprecise. Bell allows for a common cause ($\lambda$). The theorem proves that *no* common cause $\lambda$ (screening off the past) can reproduce the statistics. Make sure you don't imply the setup *excludes* common causes; the setup excludes *successful* common causes.

  ### Overall Verdict
  The central move is defensible. It aligns with the "Peaceful Coexistence" view (Maudlin, Shimony, etc.) but framed more aggressively as an explanatory scandal rather than a metaphysical compromise.

  **The biggest risk:** Sliding into instrumentalism ("it's just correlations/bookkeeping") when you need to be a realist ("the explanation is non-local"). If the explanation is just bookkeeping, there is no scandal, just a limit on human knowledge. To make the essay work, the non-locality must be real, even if it is causally inert (cannot signal).

  **Blunt advice:**
  1.  Drop "correlations are just correlations." Replace with "correlations require a non-local truthmaker."
  2.  Clarify that "Light-Cone Completeness" means fixing probabilities, not just outcomes.
  3.  Acknowledge that Wire/Light-Cone maps to Signal/Bell-Locality so you don't look naive.
  4.  Keep the Bohm example, but emphasize that the non-locality in Bohm is *ontic*, not epistemic.

  The essay is worth writing, but the "bookkeeping" line is a self-inflicted wound that needs stitching.
