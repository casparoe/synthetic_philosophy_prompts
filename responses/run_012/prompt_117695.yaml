answer: |-
  # Standard Operating Procedure: Classification of Choice Principles

  **Document ID:** LIB-REV-004  
  **Scope:** Analysis, Algebra, Topology Sections  
  **Time Budget:** 15 Minutes per Theorem (excluding escalation)  
  **Reviewer Prerequisites:** Undergraduate mathematics, familiarity with first-order logic, no specialized set-theoretic expertise required.

  ---

  ## 1. Objective
  To accurately label theorems based on their dependency on Choice Principles. This ensures users seeking program extraction can avoid non-constructive steps, and classical users understand the logical strength of the library.

  ## 2. Definitions (Cheat Sheet)
  *Do not consult external literature. Use these operational definitions.*

  1.  **Constructive (No Choice):** Every existence claim ($\exists x, P(x)$) is witnessed by an explicit term or algorithm constructed from inputs. No "pick an arbitrary $x$" steps.
  2.  **Countable Choice ($AC_\omega$):** You are choosing an element from each set in a **countable sequence** of non-empty sets $S_1, S_2, S_3, \dots$. The choice for $S_n$ does *not* depend on the choice made for $S_{n-1}$.
      *   *Trigger:* "Let $x_n \in S_n$ for each $n$..." without a rule defining $x_n$.
  3.  **Dependent Choice ($DC$):** You are constructing a **sequence** $x_1, x_2, \dots$ where the set available for $x_{n+1}$ depends on the value of $x_n$.
      *   *Trigger:* "Recursively choose $x_{n+1}$ such that $R(x_n, x_{n+1})$..." where multiple valid $x_{n+1}$ exist. Common in analysis (Cauchy sequences, limits).
      *   *Note:* $DC$ implies $AC_\omega$. If $DC$ is used, label as $DC$.
  4.  **Full Axiom of Choice ($AC$):** You are choosing from an **uncountable** family, or a family not indexed by $\mathbb{N}$, or using a principle equivalent to $AC$.
      *   *Triggers:* Zorn's Lemma, Well-Ordering Theorem, "Let $\mathcal{B}$ be a basis" (for arbitrary vector spaces), "Let $f^{-1}(y)$ be selected for all $y$" (for arbitrary codomains).
      *   *Note:* $AC$ implies $DC$. If $AC$ is used, label as $AC$.

  ## 3. The Review Procedure

  ### Step 1: Surface Scan (3 Minutes)
  **Action:** Search the proof text and imported dependencies for keywords.
  **Keywords:** `choice`, `zorn`, `well_order`, `classical`, `nonempty`, `indefinite_description`, `axiom_of`.
  **Question:** Do any keywords appear in the proof body or the names of imported lemmas?
  *   **No:** Proceed to Step 2.
  *   **Yes:** Note the strongest principle found (AC > DC > CC). Proceed to Step 3 to confirm.

  ### Step 2: Logical Flow Analysis (7 Minutes)
  **Action:** Trace every existential elimination ("There exists an $x$...").
  **Question:** For every claim $\exists x, P(x)$, is $x$ defined by a formula/function of previous variables?
  *   **Yes (All):** Tentative Verdict: **Constructive**. Proceed to Step 3.
  *   **No (Some):** Identify the selection.
      *   Is the selection from a countable family of sets? $\to$ Tentative **$AC_\omega$**.
      *   Is the selection a sequence where step $n+1$ depends on step $n$? $\to$ Tentative **$DC$**.
      *   Is the selection from an arbitrary/uncountable family, or via Zorn/Well-Ordering? $\to$ Tentative **$AC$**.

  ### Step 3: Dependency Audit (5 Minutes)
  **Action:** Check the metadata of all imported lemmas.
  **Question:** Do any imports carry a choice label stronger than your tentative verdict?
  *   **No:** Finalize Verdict.
  *   **Yes:** Upgrade your verdict to match the strongest import.
  *   **Unknown/Unmarked:** **STOP.** You cannot verify the proof within budget.
      *   **Verdict:** `AUDIT_REQUIRED`.
      *   **Action:** Flag for Committee review. Do not merge.

  ### Step 4: Policy Check (Human Decision Point)
  **Action:** Compare Final Verdict against Section Policy.
  *   **Algebra/Topology:** Generally allows $AC$. $DC$ and $AC_\omega$ are permitted.
  *   **Analysis:** Generally allows $DC$. $AC$ may be restricted to specific sub-modules.
  *   **Constructive Core:** Allows **Constructive** only.
  **Question:** Does the verdict violate the section's policy?
  *   **No:** **ACCEPT** with label.
  *   **Yes:** **REJECT** (Policy).
      *   *Note:* This is not a mathematical error. The author must either rewrite the proof to weaken the choice dependency or move the file to a classical-only module. This decision is final unless the Maintainers' Committee changes the policy.

  ---

  ## 4. Verdict Codes
  *   `choice:none` (Constructive)
  *   `choice:countable` ($AC_\omega$)
  *   `choice:dependent` ($DC$)
  *   `choice:full` ($AC$)
  *   `status:audit_required` (Dependencies unclear)
  *   `status:policy_reject` (Mathematically valid, but disallowed in this module)

  ---

  ## 5. Limitations of this Procedure
  **Read this before applying labels.**

  1.  **Transitivity:** A theorem labeled `choice:none` is only as constructive as its imports. If an imported lemma is mislabeled, this label is invalid.
  2.  **Hidden Choice:** Some choice principles are encoded in type-theoretic axioms (e.g., proof irrelevance combined with existence) that do not trigger keyword searches. This procedure detects explicit usage, not implicit logical strength.
  3.  **Equivalence:** This procedure classifies the *proof provided*, not the *theorem*. A theorem proven here with $AC$ might have a constructive proof unknown to the author. The label applies to the artifact, not the mathematical truth.
  4.  **Budget:** The 15-minute audit cannot guarantee deep dependency trees are clean. `choice:none` is a best-effort guarantee based on available metadata.

  ---

  # Application of Procedure to Pending Submissions

  ## Submission 1: "Every Vector Space Has a Basis"
  **Module:** Algebra  
  **Proof Sketch:** Defines a "linearly independent set". Orders these sets by inclusion. Applies Zorn's Lemma to find a maximal element. Asserts maximal element is a basis.

  *   **Step 1 (Scan):** Keyword `zorn` detected immediately.
  *   **Step 2 (Flow):** Existential claim ("There exists a maximal set") is not witnessed by construction. Relies on Zorn's Lemma.
      *   *Definition Check:* Zorn's Lemma is equivalent to Full Axiom of Choice.
      *   *Tentative Verdict:* `choice:full`.
  *   **Step 3 (Dependencies):** Imports standard order theory. Metadata confirms order theory is choice-free, but Zorn's axiom is an explicit import.
  *   **Step 4 (Policy):** Algebra section allows $AC$.
  *   **Final Verdict:** **ACCEPT** with label `choice:full`.
  *   **Note:** This theorem is not extractable. Users requiring executable code cannot import this.

  ## Submission 2: "A Countable Union of Countable Sets is Countable"
  **Module:** Analysis  
  **Proof Sketch:** Let $\{A_n\}_{n \in \mathbb{N}}$ be the family. Since each $A_n$ is countable, there exists a surjection $f_n: \mathbb{N} \to A_n$. Define a global surjection $F: \mathbb{N} \times \mathbb{N} \to \bigcup A_n$ using pairing functions.

  *   **Step 1 (Scan):** No keywords like `choice` or `zorn`.
  *   **Step 2 (Flow):**
      *   Premise: "Each $A_n$ is countable." Meaning: $\forall n, \exists f_n, \text{Surj}(f_n)$.
      *   Step: "Let $f_n$ be such a surjection for each $n$."
      *   *Analysis:* We are selecting a witness $f_n$ for each $n \in \mathbb{N}$. This is a countable family of non-empty sets (the sets of valid surjections).
      *   *Definition Check:* This matches **Countable Choice ($AC_\omega$)**. The choice of $f_n$ does not depend on $f_{n-1}$, only on $n$.
      *   *Tentative Verdict:* `choice:countable`.
  *   **Step 3 (Dependencies):** Imports basic set theory. No conflicting labels.
  *   **Step 4 (Policy):** Analysis section allows $DC$ (which implies $AC_\omega$).
  *   **Final Verdict:** **ACCEPT** with label `choice:countable`.
  *   **Note:** This is often mistakenly assumed to be constructive. It is not. Program extraction will fail at the step selecting the sequence of surjections.

  ## Submission 3: "Every Surjective Function Has a Right Inverse"
  **Module:** Algebra  
  **Proof Sketch:** Let $f: A \to B$ be surjective. For every $y \in B$, the fiber $f^{-1}(\{y\})$ is non-empty. Pick $x_y \in f^{-1}(\{y\})$. Define $g(y) = x_y$. Then $f(g(y)) = y$.

  *   **Step 1 (Scan):** No keywords.
  *   **Step 2 (Flow):**
      *   Step: "Pick $x_y \in f^{-1}(\{y\})$ for every $y \in B$."
      *   *Analysis:* We are choosing from the family of fibers $\{f^{-1}(\{y\}) \mid y \in B\}$.
      *   *Constraint:* Is $B$ countable? The theorem states "Every surjective function", implying arbitrary $B$.
      *   *Definition Check:* Choosing from an arbitrary family of non-empty sets is the definition of **Full Axiom of Choice ($AC$)**.
      *   *Tentative Verdict:* `choice:full`.
  *   **Step 3 (Dependencies):** None relevant.
  *   **Step 4 (Policy):** Algebra section allows $AC$.
  *   **Final Verdict:** **ACCEPT** with label `choice:full`.
  *   **Note:** This statement is logically equivalent to the Axiom of Choice. It is maximally non-constructive.

  ---

  # Inconvenient Truths & Policy Implications

  **Verdict Analysis:**
  All three submissions are accepted, but two (`Vector Space`, `Surjection`) are labeled `choice:full` and one (`Countable Union`) is `choice:countable`. None are `choice:none`.

  **The Inconvenience:**
  1.  **For Program Extractors:** None of these three fundamental theorems are usable for extraction. If a user imports "Countable Union of Countable Sets" expecting it to be safe because it involves only $\mathbb{N}$, their extraction will fail. The label `choice:countable` must be treated as a hard barrier by tooling, not a warning.
  2.  **For the Library:** We have accepted three theorems that rely on non-constructive principles. If our long-term goal is a fully constructive analysis library, we cannot simply "label and accept" these. We must either:
      *   Move them to a `Classical` namespace (requiring refactor).
      *   Provide constructive alternatives (e.g., "Every surjection *with a decidable domain* has a right inverse").
      *   Accept that the library is fundamentally classical.

  **Recommendation to Committee:**
  The procedure successfully identified the logical strength. However, the prevalence of `choice:full` in basic algebra suggests our "Algebra" section is incompatible with the "Analysis" section if Analysis attempts to restrict to $DC$. I recommend a policy review on whether `choice:full` should be permitted in core algebra, or if it must be isolated to prevent accidental leakage into analysis modules aiming for $DC$-compliance.

  ---

  # Statement of Limitations (For the User)

  **What this procedure cannot conclude:**
  If a theorem passes this procedure with the label `choice:none`, it **does not guarantee** that the theorem is constructively valid in all intuitionistic systems. It only guarantees that:
  1.  No *explicit* invocation of choice axioms was found in the proof text.
  2.  All *marked* dependencies are also `choice:none`.

  **How to read the label:**
  *   **`choice:none`**: "We looked for choice and didn't find it in this file or its marked dependencies." (High confidence, not absolute).
  *   **`choice:countable`**: "This proof requires selecting from a countable family. It will not compile in a strictly constructive logic without adding $AC_\omega$."
  *   **`choice:full`**: "This proof is equivalent to classical ZFC set theory. It cannot be used for program extraction."

  **Warning:**
  A proof labeled `choice:none` may still be non-constructive if it relies on a lemma that is *mislabelled*. The label is a certificate of due diligence, not a logical guarantee. If you require absolute certainty for extraction, you must audit the dependency tree manually.
