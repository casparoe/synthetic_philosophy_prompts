answer: |-
  There is no single, canonical academic term for this specific maneuver. You will not find it listed alongside *ad hominem* or *straw man* in a logic textbook.

  However, your diagnosis is precise, and historians and philosophers recognize this pattern as a composite of several existing biases. It is most often discussed as a particularly insidious form of **Special Pleading** nested within **Hagiography**.

  Since you asked for a sharp definition if no name exists, I propose we call this **The Agency-Context Ratchet**.

  Here is the breakdown of why existing terms fall short, how this mechanism works, and how to distinguish your new term from its nearest neighbors.

  ### 1. Why existing terms don't quite fit
  *   **Presentism:** This is the act of judging the past by modern standards. Your example is actually the *opposite* of consistent presentism. The speaker avoids presentism when it assigns blame ("he was a man of his time") but implicitly relies on presentism when assigning praise ("he was ahead of his time"). "Presentism" doesn't capture the *switching* mechanism.
  *   **Special Pleading:** This is the broad logical fallacy of applying a double standard. While accurate, it is too blunt. Special pleading could be anything ("I shouldn't get a ticket because I'm a doctor"). You need a term that specifies the *temporal* and *causal* nature of the excuse.
  *   **The Fundamental Attribution Error:** In psychology, this is the tendency to attribute *our own* mistakes to circumstances ("I was late because of traffic") but *others'* mistakes to character ("He was late because he's lazy"). Your historical example is a specific subset of this: attributing the hero's sins to circumstances (the Era) and the hero's virtues to character (the Man).
  *   **Hagiography:** This describes the *result* (a saintly biography) rather than the *logical move* itself.

  ### 2. The Coinage: The Agency-Context Ratchet
  **Definition:** A rhetorical fallacy in which historical context is selectively invoked to dissolve individual agency regarding moral failures, while individual agency is asserted to claim credit for moral successes, applied inconsistently based on the speaker's admiration for the subject.

  **Why "Ratchet"?**
  A ratchet is a mechanical device that allows motion in one direction but locks it in the other.
  *   **Credit turns forward:** When the figure does something good (by modern standards), the mechanism locks onto the **Individual**. (Agency is maximized).
  *   **Blame is locked back:** When the figure does something bad (by modern standards), the mechanism slides back to the **Context**. (Agency is minimized).

  ### 3. How to distinguish it
  To use this term sharply, you must distinguish it from three nearby concepts:

  | Concept | The Core Question | How it differs from the Ratchet |
  | :--- | :--- | :--- |
  | **Presentism** | *Which moral standard applies?* | Presentism argues we *should* or *should not* use modern morals. The Ratchet accepts modern morals as the benchmark but manipulates **who is responsible** for meeting them. |
  | **Historical Relativism** | *Is morality fixed or fluid?* | A true relativist would say slavery was "okay then," so Jefferson is neither good nor bad. The Ratchet says slavery was bad (implicitly), but Jefferson isn't to blame, *yet* his other virtues are still credit-worthy. |
  | **Special Pleading** | *Do the rules apply to you?* | Special pleading is the genus; the Ratchet is the species. Special pleading is "I get an exception." The Ratchet is "I get an exception on blame *and* an exception on credit, using opposite justifications." |

  ### 4. The "Pol Pot" Test
  The defining feature of the **Agency-Context Ratchet** is the **Partisan Trigger**.

  If the speaker applies the logic consistently, it is **Historical Contextualism**.
  *   *Consistent:* "Churchill was a man of his time regarding India, and Pol Pot was a man of his time regarding Cambodia." (No Ratchet).
  *   *Consistent:* "Churchill was an individual agent responsible for the famine, and Pol Pot was an individual agent responsible for the genocide." (No Ratchet).

  The Ratchet only engages when the logic flips based on **admiration**.
  *   *Ratchet:* "Churchill was a man of his time (blame off), but Pol Pot was a monster (blame on)."

  ### Summary for Argumentation
  If you encounter this, you can say:

  > "You are employing an **Agency-Context Ratchet**. You are dissolving Jefferson's agency into his era when it comes to slavery, but reconstituting his individual agency when it comes to his philosophy. You cannot have the context excuse the sins and the individual claim the virtues. Either he was bound by his time, or he was free to transcend it; you must choose one causal model and apply it consistently to both his crimes and his achievements."

  This isolates the specific inconsistency you identified: the manipulation of **causal attribution** to protect a preferred narrative.
