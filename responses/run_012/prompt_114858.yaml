answer: |-
  The unilateralist's curse presents a striking paradox in the ethics and economics of collective agency. It arises when a group of agents faces a decision where an action is beneficial if undertaken by a few but harmful if undertaken by many. Despite a shared preference for the outcome where restraint is shown, rational agents often proceed with the action, reasoning that their individual contribution is unlikely to be the pivotal one that tips the balance into harm. The central philosophical question is how to characterise this failure. Is it a genuine collective action problem, structurally akin to the Prisoner's Dilemma or the Tragedy of the Commons, where individual incentives inevitably diverge from the group optimum? Or is it an artefact of a decision-theoretic mistake, specifically the erroneous treatment of one's own action as probabilistically independent of the actions of others when, in reality, shared dispositions create a logical correlation? To resolve this, one must examine the underlying assumptions of agency and consider how the introduction of correlated information affects the strategic landscape. This essay argues that the unilateralist's curse is best understood as a decision-theoretic artefact. The persistence of the curse relies on an assumption of independence that dissolves under scrutiny of logical correlation, a conclusion strengthened by analysing a variant involving costly, correlated signals.

  To understand the curse as a collective action problem, one must view it through the lens of classical game theory and Causal Decision Theory (CDT). In this framework, agents treat their own choices as causally isolated events. An agent considers the state of the world as fixed by the actions of others and asks only whether their own marginal contribution yields a net benefit. In the unilateralist scenario, the probability that a single agent is pivotal is often vanishingly small. Consequently, the expected utility of acting, calculated causally, appears positive, even if the collective outcome of universal action is disastrous. The Nash equilibrium involves a high rate of participation, whereas the Pareto optimum requires widespread restraint. This divergence between individual rationality and collective welfare is the hallmark of a collective action problem. Proponents of this view argue that the solution requires external intervention: norms, regulations, or binding agreements that alter the payoff structure to align individual incentives with group welfare. On this account, the curse is a structural feature of the environment, not a bug in the agents' reasoning.

  However, the collective action interpretation rests on a fragile premise: that an agent's decision is probabilistically independent of the decisions of their peers. This assumption is often unrealistic. Agents facing the unilateralist's curse are frequently epistemically similar; they have access to similar information, share similar values, and employ similar reasoning processes. If I am disposed to act based on a certain set of reasons, it is highly probable that another agent, facing the same reasons, will also be disposed to act. My decision is not merely a causal intervention; it is evidence of the disposition of the group. Under Evidential Decision Theory (EDT) or Functional Decision Theory (FDT), an agent recognises this correlation. When I deliberate, I should treat my choice as a test case for the output of the decision algorithm run by others. If I choose to act, I increase the probability that others will act. Once this evidential link is accounted for, the expected utility of acting may plummet, as the agent realises that their action is a proxy for a mass defection. If the curse disappears when agents reason evidentially, it suggests the problem was never structural, but rather a failure of decision-theoretic sophistication.

  The strength of this decision-theoretic critique can be tested by considering a variant of the scenario. Suppose each agent can acquire, at some cost, a private and noisy signal regarding how many others are disposed to act. Crucially, this signal is positively correlated with the agent's own disposition. This variant introduces a layer of epistemic complexity that illuminates the nature of the correlation. In this setting, an agent does not merely guess the state of the world; they invest in information that reflects the common source of their dispositions. If my disposition to act is high, the signal is more likely to indicate that others are also disposed to act.

  Does this variant make the curse more or less tractable? In a CDT framework, the variant arguably makes the curse less tractable. Agents now face a secondary collective action problem regarding information acquisition. If acquiring the signal allows for conditional restraint (e.g., 'I will only act if the signal indicates few others will'), it offers a path to coordination. However, if the signal is costly, agents may prefer to free-ride on the information gathering of others, or worse, the act of acquiring the signal might be correlated across the group, leading to redundant costs without resolving the underlying coordination failure. Furthermore, if agents treat their signal acquisition as independent of others, they may all acquire signals, find them correlated, and still act, believing their specific signal gives them a unique licence. The complexity increases, but the fundamental incentive to defect remains if independence is assumed.

  Conversely, in an evidential framework, the correlated-signal variant significantly strengthens the case that the curse is a decision-theoretic artefact. The signal makes the hidden correlation explicit. If my disposition predicts the signal, and the signal predicts the actions of others, then my disposition is logically linked to the actions of others. The signal acts as a common cause or a common effect of the shared decision algorithm. By introducing this variable, the model highlights that the uncertainty agents face is not independent noise but structurally intertwined with their own psychology. An evidential reasoner observing a signal that suggests 'many will act' should update their belief that they themselves are part of the 'many' disposed to act. Consequently, the rational move is restraint, not because of an external constraint, but because the evidence suggests that acting leads to the harmful outcome. The variant demonstrates that even with private information, the logical link persists. It renders the independence assumption even more untenable than in the base case, as the correlation is now modelled explicitly within the epistemic state of the agents.

  Therefore, the correlated-signal variant weakens the case for the curse being a genuine collective action problem. A genuine collective action problem persists regardless of the decision theory employed, provided the payoffs remain constant; the incentives to defect are structural. However, if the introduction of correlated signals allows a sufficiently sophisticated decision theory to dissolve the incentive to defect, the problem was never purely structural. The variant shows that the 'independence' required for the collective action problem to hold is an artificial abstraction. In reality, agents are embedded in a common causal and logical network. The signal variant makes this network visible. If the curse were a genuine collective action problem, better information (the signal) might help coordinate, but it would not fundamentally alter the incentive to free-ride unless the payoffs changed. Yet, because the signal is correlated with disposition, it alters the *evidential* weight of the decision. It reveals that the agent is not an isolated island of causality but a mirror of the group.

  Critics might argue that relying on EDT or FDT is impractical. In large-scale scenarios, the evidential impact of one agent might be diluted, or the correlation might be too weak to deter action. They might contend that we cannot rely on agents to adopt complex decision theories, and thus, for all practical purposes, we must treat it as a collective action problem requiring institutional solutions. While there is pragmatic merit to this view, it conflates the *nature* of the problem with the *difficulty of the solution*. That agents currently reason causally does not make the curse a structural inevitability; it makes it a correctable error in reasoning. To classify it as a collective action problem is to concede that the divergence of interests is real. But if the divergence vanishes under correct reasoning, the interests were never truly divergent; only the calculation was. The signal variant reinforces this by showing that the information required to align interests is available, provided the agent interprets the correlation between their disposition and the signal correctly.

  Furthermore, treating the curse as a collective action problem invites solutions that may be overly coercive. If we believe the incentives are structurally misaligned, we seek to bind agents through regulation. If we recognise it as a decision-theoretic artefact, we seek to align agents through shared reasoning, transparency, and the cultivation of norms that highlight logical correlation. The latter approach preserves more autonomy and targets the root cause. The correlated-signal variant suggests that transparency (making signals public or shared) could be more effective than coercion, as it strengthens the evidential link between agents, further discouraging unilateral action.

  In conclusion, the unilateralist's curse is not a genuine collective action problem but a decision-theoretic artefact arising from the mistaken assumption of probabilistic independence. While it mimics the payoff structure of a Prisoner's Dilemma, this resemblance dissolves when agents recognise that their dispositions are logically correlated with those of their peers. The variant involving costly, correlated signals cements this verdict. By making the link between an agent's internal state and the external environment explicit, the variant demonstrates that the uncertainty driving the curse is not independent noise but a reflection of shared agency. This makes the curse less tractable for causal reasoners, who become bogged down in secondary coordination games, but more tractable for evidential reasoners, who see the logical imperative for restraint. To diagnose the curse as a collective action problem is to mistake a failure of logic for a failure of structure. The verdict must therefore be that the curse is an illusion of isolation, dispelled when agents recognise that in choosing for themselves, they choose for all like them.
