prompt: |-
  I run a reading group for philosophers who work outside the philosophy of language — mostly ethicists, plus a couple of historians — and I've been handed the job of getting them to the point where two-dimensional semantics is something they can actually use rather than nod along to. I don't want the explanation itself; I want the plan for giving it. Assume the group already accepts Kripke's necessity of identity and has heard the phrase a priori contingent and nothing further, and assume I have a whiteboard and nothing else, so every piece has to be reconstructible from what we build in the room rather than from a bit of chemistry or history they'd have to take on my word.

  Tell me the order the components have to come in and why each depends on the last: where the two dimensions get introduced relative to the possible-worlds apparatus, where the diagonal and the actually operator belong, whether centered worlds have to come in before or after the matrix, and whether the epistemic and the contextual versions of the framework should be kept apart for this audience at all or whether trying to keep them apart will cost me more than it buys. Pick the one example that carries the whole thing and say what it has to have — I take it a term whose two readings a competent speaker can pull apart on demand — and what it must not have. If you can, build it around something we invent on the spot, a fabricated natural kind or an artefact term, rather than a stock case; if a stock case is genuinely required, tell me which one and why the invented one fails.

  Then give me the misconceptions in the order they'll form and the exact point in the sequence where I should head each off. I expect the group to read the primary intension as a description the speaker associates with the term, and to hear the two dimensions as two stages in time, an earlier guess and a later discovery, rather than two readings available at once; tell me whether that's the real danger and what else I'm missing. The reason I've been asked to do this at all is that they keep meeting the framework in the consciousness literature and can't see what work it does, so the plan should end by making that payoff visible. Finish with one question I can put to the room that would show whether they can now do something with the framework, and tell me what to leave out at this level and to announce that I'm leaving it out.

  Answer as continuous prose, please — no headings, no bullet points, no bold, no tables, just a letter I can read straight through.
