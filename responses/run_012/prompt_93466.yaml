answer: |-
  Dear Colleague, since your group already accepts Kripke's necessity of identity and knows the phrase a priori contingent only as a slogan, your first task is to stabilize the Kripkean picture before you complicate it, so begin by drawing a single possible world on the whiteboard and labeling it Actual, then draw several others around it labeled Counterfactual. Ask them to place a term like Water in the Actual world and fix its reference to H2O, then ask them to trace that reference into the Counterfactual worlds where the substance looks like water but is XYZ, ensuring they see that on the Kripkean model the term still picks out H2O even in those worlds because the reference is fixed by the actual essence. This establishes the secondary intension, which is the vertical axis of the framework you are about to build, and you must not introduce the two dimensions until this rigid designation intuition is secure because if they think reference shifts with superficial properties in counterfactual worlds you will not be able to explain why the second dimension is necessary. Once the vertical axis is drawn as a column under the Actual world header, introduce the invented term Vitrion, defined explicitly as a shiny malleable metal found in the rivers of this region, and stipulate that in our world Vitrion is actually the element Vanadium, but ensure the definition relies on superficial properties like shine and malleability rather than chemical structure so that a competent speaker can pull apart the reading that means whatever looks like this from the reading that means whatever shares the essence of this. Now draw a matrix on the whiteboard with worlds listed across the top and worlds listed down the side, and explain that the columns represent the Kripkean move where the actual world is fixed and we ask what the term refers to in other worlds, which is the secondary intension, but the rows represent the new move where we ask if this world were actual what would the term refer to here, which is the primary intension. You must introduce centered worlds at this exact moment when explaining the rows because to evaluate a world as actual the speakers need to know where they are located within it to fix the reference of indexicals or natural kinds tied to their environment, so draw a little star on the world-row to indicate the center and explain that without the center the primary intension cannot determine reference. This is where you must head off the first major misconception that the primary intension is simply a description the speaker associates with the term, because if they reduce it to a Fregean sense they will miss the modal force, so tell them explicitly that it is a function from centered worlds to extensions that captures conceptual role rather than a list of properties, emphasizing that the function yields different extensions in different worlds even if the speaker's internal description stays the same. Now that the matrix is populated with values for Vitrion across both axes, introduce the diagonal which runs from the top left to the bottom right, and explain that this represents the a priori truth of the statement because it tracks where the world considered as actual matches the world considered as counterfactual. This is the point where you must head off the second major misconception that the two dimensions are two stages in time, an earlier guess and a later discovery, because ethicists and historians will naturally want to temporalize the epistemic access, so tell them firmly that both dimensions are available to the competent speaker simultaneously and represent two ways of evaluating the same term rather than two moments in the history of inquiry. Introduce the actually operator now to lock the secondary intension, showing how it forces the term to refer to what exists in the world marked Actual regardless of which world we are evaluating in, which clarifies why the secondary intension is necessary while the primary can be contingent. Regarding the epistemic and contextual versions of the framework, you should not keep them apart for this audience because trying to distinguish Kaplanian context from Chalmersian epistemicity will cost you more than it buys in utility, so treat them as a single tool with two evaluation modes and note only that the consciousness literature they will encounter uses the epistemic reading where the primary intension tracks conceivability. This leads directly to the payoff they need, so once the matrix is complete and the diagonal is understood, draw a parallel matrix for the term Pain where the secondary intension is tied to neural state N and the primary intension is tied to the phenomenal feel, and show how the zombie argument relies on the possibility of the primary intension obtaining without the secondary intension, which makes the contingency visible on the diagonal without denying the metaphysical necessity of identity. To test whether they can use the framework, put this question to the room: If a physicalist claims that pain is identical to C-fiber firing, must they argue that the primary intension of pain picks out C-fiber firing in every centered world, or only that the secondary intension does, and what does their answer imply about the conceivability of zombies? Finally, leave out the formal semantics of the actually operator and the detailed objections from critics like Soames or Yablo, and announce that you are leaving them out because they concern the defense of the framework rather than the application of it, which is the skill your group needs to engage with the consciousness literature without getting bogged down in meta-debate.
