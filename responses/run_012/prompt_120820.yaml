      *   **Tutor's Analogy:** Reactive attitudes (resentment, guilt, etc.) are like the grammar of one's native language. You can't ask if grammar is "true," only describe it. Hard determinism saying resentment is unjustified is like saying English is "false." Conclusion: Hard determinist skepticism is idle/opted out, not false.
