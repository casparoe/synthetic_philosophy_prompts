  2.  **Deconstruct the Tutor's Analogy (Strawson + Wittgensteinian flavor):**
      *   *Core Idea:* Reactive attitudes are constitutive of human relationships, just as grammar is constitutive of language. They are framework conditions, not empirical hypotheses.
      *   *Goal:* To show that questioning the *validity* of reactive attitudes from a metaphysical standpoint (determinism) is a category mistake.
      *   *User's Suspicion:* The analogy smuggles in conventionalism (responsibility is just a social rule) and relies heavily on the "no external standpoint" claim.

  3.  **Drafting the Correspondence Table:**
      *   *Grammar:* Reactive Attitudes (RA).
      *   *Native Speaker:* Participant in ordinary interpersonal relationships (the "ordinary man").
      *   *Linguist (Outside):* The Hard Determinist / Metaphysician.
      *   *Describing from Inside:* Living the moral life, holding people responsible.
      *   *Learning a Second Language:* Adopting the Objective Attitude (therapist/psychiatrist mode).
      *   *Falsehood/Truth Claim:* "Resentment is unjustified" $\leftrightarrow$ "English is false."

  4.  **Identifying Disanalogies (Where it breaks):**
      *   *Normativity:* Grammar is descriptive of usage; RA are inherently normative (they claim *desert*, not just usage).
      *   *Variability:* Grammars vary wildly between cultures; RA seem more universal/human-nature based (Strawson's point).
      *   *Truth-Aptness:* "English is false" is nonsense. "Resentment is unjustified" *feels* meaningful because it appeals to fairness/justice, not just rules.
      *   *Choice:* We don't choose our native grammar. We *can* choose to suppress RA (objective attitude), even if it's costly.
      *   *Consequences:* Speaking ungrammatically leads to misunderstanding. Feeling resentment leads to moral sanctions/punishment. The stakes are different.

  5.  **Sorting Disanalogies (Matter vs. Incidental):**
      *   *Incidental:* Variability (Strawson argues RA are universal anyway), specific linguistic rules.
      *   *Matters for Conclusion:* Normativity (the "ought"), Truth-Aptness (is it a fact or a rule?), The possibility of stepping outside (we *can* take the objective attitude, unlike a monolingual speaker).
      *   *Crucial Point:* The user's suspicion is right. Grammar is conventional/arbitrary in a way moral responsibility might not be. If RA are just "rules of the game," determinism doesn't touch them. But if RA track *moral truth*, determinism might undermine them.

  6.  **Evaluating the Conclusion:**
      *   Does the conclusion survive? It survives *if* you accept Strawson's naturalism (RA are inescapable parts of human nature). The analogy supports the "inescapable" part but weakens the "normative" part.
      *   The "idle" conclusion works if the question is a category mistake. But if the hard determinist is asking "Is there a *fact* of desert?", the grammar analogy dismisses it too easily by calling it a convention.
      *   *Verdict:* The analogy is rhetorically strong but philosophically risky. It supports the "no external standpoint" claim but risks reducing morality to mere social etiquette.

  7.  **Addressing the User's Suspicion:**
      *   "You can't step outside it" is indeed doing the heavy lifting (transcendental argument).
