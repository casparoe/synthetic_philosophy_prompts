answer: |-
  This is a sharp interrogation of a classic pedagogical move. Your tutor is deploying a Wittgensteinian reading of Strawson: treating the reactive attitudes not as metaphysical commitments that need justification, but as constitutive rules of a "form of life."

  Your suspicion is well-founded. The analogy is rhetorically potent but philosophically leaky. It secures the "inescapability" of the attitudes at the cost of making them look like arbitrary conventions.

  Here is the audit you requested.

  ### 1. The Correspondence Table

  | Linguistic Analogy | Strawsonian Moral Psychology |
  | :--- | :--- |
  | **Grammar / Syntax** | **The Reactive Attitudes** (Resentment, gratitude, guilt, indignation). |
  | **Native Speaker** | **The Participant** (Ordinary human engaged in interpersonal relationships). |
  | **Linguist (External)** | **The Hard Determinist / Metaphysician** (Attempting to judge the system from a "view from nowhere"). |
  | **"English is False"** | **"Resentment is Unjustified"** (The claim that determinism invalidates responsibility). |
  | **Describing from Inside** | **Living the Moral Life** (Holding others responsible without metaphysical hesitation). |
  | **Learning a Second Language** | **Adopting the Objective Attitude** (Viewing others as objects to be managed/cured, e.g., the therapist). |
  | **Ungrammatical Sentence** | **Morally Inappropriate Response** (e.g., resenting a toddler or the severely mentally ill). |

  ### 2. Where the Mapping Breaks (Disanalogies)

  1.  **Normativity vs. Descriptivism:** Grammar describes *how* we speak; Reactive Attitudes prescribe *how we ought to be treated*. "That sentence is ungrammatical" is a functional claim. "That action was wrong" is a normative claim involving desert.
  2.  **Arbitrariness:** English grammar is contingent (we could have evolved German). Strawson argues reactive attitudes are rooted in **human nature**, not social convention. They are universal facts about us, not local rules.
  3.  **Truth-Aptness:** "English is false" is category nonsense. "Resentment is unjustified" appeals to a standard of *fairness*. If determinism is true, it seems to remove the *ground* of fairness, not just break a rule.
  4.  **The Possibility of Exit:** A monolingual speaker literally cannot think outside their grammar. A human *can* suspend reactive attitudes (the Objective Attitude), even if only locally. We can choose to view a loved one as a patient. We cannot choose to view English as non-English.
  5.  **Stakes:** Speaking ungrammatically leads to confusion. Feeling unjustified resentment leads to punishment, blame, and suffering. The moral stakes imply a reality beyond the "game."

  ### 3. Sorting the Disanalogies

  **Incidental (Do not threaten the conclusion):**
  *   **Arbitrariness:** Even if grammar is arbitrary and morality isn't, the *structural* point holds: you need a framework to make judgments. Whether the framework is contingent or necessary matters less than the fact that you can't judge it from outside.
  *   **Specific Rules:** The specific rules of English vs. the specific triggers for resentment don't matter. The analogy is about the *system*, not the content.

  **Matter for Conclusion (Potentially fatal):**
  *   **Normativity (The "Ought"):** This is the big one. Grammar doesn't claim to be *true*, it claims to be *usable*. Morality claims to be *just*. If the hard determinist says "No one deserves blame," they aren't saying "Blame is ungrammatical"; they are saying "Blame is *unfair*." The grammar analogy dismisses the fairness claim as a category mistake, but the determinist insists fairness is a fact of the matter.
  *   **The Possibility of Exit:** If we *can* step outside the reactive attitudes (even partially), then the "no external standpoint" defense weakens. Strawson admits we can take the Objective Attitude. If we can step out, we can look back and ask, "Is the Participant stance *true* to reality?" The grammar analogy suggests we can't step out at all.

  ### 4. Does the Conclusion Survive?

  **Verdict: The conclusion survives, but it is weakened.**

  The tutor's conclusion is that hard determinism is **idle** (it doesn't engage with the practice) rather than **false** (it doesn't contradict a fact).

  *   **Why it survives:** The analogy successfully shows that the *practice* of responsibility doesn't rest on a metaphysical thesis. Just as you don't need a theory of linguistics to speak English, you don't need a theory of contra-causal freedom to resent a betrayal. The skeptic is trying to validate the practice from a standpoint the practice does not recognize.
  *   **Why it is weakened:** The analogy makes the reactive attitudes look like a **social convention** (like grammar) rather than a **response to reality** (like perception). If responsibility is just "the grammar of social life," the hard determinist can reply: "Fine, it's a useful fiction. But is it *true*?" The grammar analogy invites the reply: "Truth doesn't apply." But our moral experience *feels* truth-apt. By using the grammar analogy, your tutor risks conceding that morality is merely instrumental, which undermines the robust realism Strawson wants to protect.

  ### 5. Addressing Your Suspicion

  > *My suspicion is that the "you can't step outside it" bit is doing all the work, and that the analogy quietly imports the idea that responsibility-claims are conventional in the way grammar is.*

  **You are exactly right.**

  1.  **"Can't Step Outside":** This is the transcendental engine of the argument. It relies on the idea that there is no "Archimedean point" outside human interpersonal life from which to judge it. The grammar analogy is the vehicle for this.
  2.  **Importing Conventionalism:** This is the cost. Grammar is a human invention/custom. Strawson explicitly wants to avoid saying reactive attitudes are mere customs; he argues they are **natural facts** about human beings (part of our "natural history").
      *   If they are customs (like grammar), the determinist can say: "I opt out of this custom."
      *   If they are natural facts (like hunger), the determinist cannot opt out.
      *   The grammar analogy blurs this. It makes the attitudes look like customs we *happen* to have, rather than necessities we *must* have.

  ### 6. A Better Analogy

  If the goal is to show that the skeptic's question is idle *without* reducing morality to convention, you need an analogy that is **inescapable** but **truth-tracking**.

  **The Perceptual Framework Analogy (Kantian/Strawsonian)**

  *   **The Mapping:**
      *   **Grammar** $\rightarrow$ **Sensory/Cognitive Apparatus** (Space, Time, Causality).
      *   **Native Speaker** $\rightarrow$ **Perceiving Agent**.
      *   **"English is False"** $\rightarrow$ **"The External World is an Illusion."**
      *   **Objective Attitude** $\rightarrow$ **Hallucination/Disorientation** (A breakdown of the system, not a switch to a new one).

  *   **Why it's better:**
      1.  **Inescapable:** You cannot choose to stop seeing in 3D, just as you cannot choose to stop feeling resentment when betrayed (without pathology).
      2.  **Not Conventional:** Vision isn't a convention; it's how we access reality. Similarly, Strawson argues reactive attitudes are how we access *persons*.
      3.  **Handles the Skeptic:** Asking if vision is "true" is idle; vision is the *condition* for truth. Asking if responsibility is "justified" is idle; responsibility is the *condition* for moral truth.
      4.  **Preserves Normativity:** Visual experiences can be veridical or illusory. Moral responses can be appropriate or inappropriate (e.g., resenting a child). This preserves the normative "fit" that the grammar analogy loses.

  **The "Rules of Evidence" Analogy (Alternative)**

  *   **Mapping:** Reactive attitudes are like the **rules of logical inference**.
  *   **Point:** You cannot use logic to prove logic is valid without circularity. You cannot use moral reasoning to prove moral responsibility is real without already assuming it.
  *   **Advantage:** It captures the **self-defeating** nature of the skeptic. To argue against responsibility, you must hold your audience responsible for understanding your argument. This makes the skepticism practically idle, not just linguistically confused.

  ### Summary for your Seminar

  Tell your tutor the grammar analogy is a **Category Defense** (responsibility is a rule-game, not a fact-claim), but Strawson needs a **Naturalist Defense** (responsibility is a human fact, not a rule-game).

  The grammar analogy saves the practice from the skeptic, but only by making the practice look arbitrary. The **Perceptual** or **Evidential** analogy saves the practice *and* keeps its claim to reality. The conclusion (skepticism is idle) holds, but the *reason* shifts from "it's nonsense" (grammar) to "it's self-undermining" (evidence/perception).
