answer: |-
  You have the shape of it right. Your three camps are accurate caricatures of the actual philosophical positions (Hedonic Tone Theory, Attitudinal Theory, and Wittgensteinian/Deflationary views), and your intuition that the debate is stalled is correct. It has been stalled for a century because it is not a standard philosophical disagreement.

  Here is the diagnosis: **The debate is a category error masquerading as an ontological dispute.**

  It is not merely verbal, nor is it a waiting game for neuroscience. It is a conflict between **explanatory goals** that the participants mistake for a conflict about **objects**.

  Here are the three reasons for this diagnosis, followed by what this means for your character.

  ### 1. The Is-Ought Confusion (The Functional Mismatch)
  The primary reason the debate is intractable is that the word "pleasure" is being asked to perform two incompatible functions simultaneously.
  *   **Function A (Descriptive):** To name a specific type of conscious experience (the "felt quality" camp).
  *   **Function B (Evaluative):** To mark something as good, wanted, or to-be-pursued (the "attitude" camp).

  The "Sensation" camp is trying to locate the *value* inside the *feeling*. They want pleasure to be a natural kind (like "red" or "sweet") that inherently carries positive weight. The "Attitude" camp realizes that feelings don't carry inherent weight (hence your mosquito bite example: the sensation is identical, the value flips). They locate the value in the *subject's stance* toward the feeling.

  They are not contradicting each other about the world; they are contradicting each other about which function of the word "pleasure" is the primary one. The Sensation theorists prioritize phenomenology (what it is like). The Attitude theorists prioritize rationality and action (why we do things). Because they are measuring success by different metrics, no argument can defeat the other.

  ### 2. The Neuroscience Dissociation (It's not just philosophy)
  You asked if this is an unresolved question about natural kinds where introspection is weak. The answer is that introspection is misleading because the brain itself splits the functions.

  Neuroscience (specifically the work of Kent Berridge on reward systems) has empirically validated the philosophical stalemate. There are distinct neural substrates for **'liking'** (sensory pleasure, opioid systems) and **'wanting'** (motivational desire, dopamine systems).
  *   You can have 'wanting' without 'liking' (addiction).
  *   You can have 'liking' without 'wanting' (satiety).

  The "Sensation" camp is talking about *liking*. The "Attitude" camp is talking about *wanting* (or endorsement). The "Family Resemblance" camp is looking at the linguistic label we slap over both.

  The debate feels stalled because philosophers are arguing over a single concept ("Pleasure") that biology has already revealed to be two (or more) distinct mechanisms. Progress isn't blocked by a lack of data; it's blocked by the refusal to retire the singular term.

  ### 3. The Hedonist's Escape Hatch (Prudential vs. Phenomenal)
  This is the most critical point for your novel. You asked if this is "two questions wearing one coat." **Yes.**
  *   **Question 1:** What is the metaphysical nature of pleasure? (The stalled debate).
  *   **Question 2:** What constitutes well-being? (The ethical question).

  A sophisticated hedonist does not need to solve Question 1 to answer Question 2. This is the distinction between **Phenomenal Hedonism** (pleasure is a specific feeling) and **Prudential Hedonism** (pleasure is whatever makes life go better).

  If your character is "cold-blooded," they are likely a **Prudential Hedonist** who adopts an **Attitudinal Theory**.
  *   **Why?** A Sensation Hedonist is vulnerable. If pleasure is just a "tingle," then a life of constant low-level tingles could theoretically outweigh a life of deep, complex satisfaction. It makes the hedonist look like a glutton or a drug seeker.
  *   **The Cold-Blooded Move:** By defining pleasure as an *attitude of endorsement*, the character can claim that crushing an enemy, solving a complex proof, or eating a meal are all "pleasures" not because they feel the same, but because the character *wills* them to be good. It makes pleasure a matter of **judgment**, not sensation. This fits a cold-blooded archetype much better than a sensation-seeker. It allows them to be cruel without denying their philosophy; the cruelty *is* the pleasure because they endorse it.

  ### Verdict on Progress
  You asked if anything would count as progress or if we should stop expecting an answer.
  **Stop expecting one answer.** The concept of "pleasure" is a folk-psychological tool that is too blunt for the job philosophers are asking it to do.

  Progress would only come from **conceptual revision**: admitting that "sensory enjoyment" and "rational satisfaction" are different categories and stopping the attempt to find a common denominator. Since philosophers love unity, they resist this.

  ### Advice for the Character
  To avoid the strawman:
  1.  **Don't let him obsess over the "feeling."** If he talks about a "golden glow" or a specific sensation, he sounds naive.
  2.  **Let him focus on "satisfaction" or "getting what one wants."** This aligns with the Attitudinal view. It makes his hedonism robust enough to include intellectual or cruel acts without needing to pretend they feel like a massage.
  3.  **Acknowledge the heterogeneity.** A smart hedonist admits that the pleasure of a nap and the pleasure of revenge feel different. His claim is not that they feel the same, but that they serve the same *function* (they are the only things intrinsically valuable).

  The debate is stalled because everyone is trying to find a single *thing* called pleasure. Your character should be the one who realizes pleasure isn't a thing; it's a **relation** between a subject and the world. That is the cold-blooded truth.
