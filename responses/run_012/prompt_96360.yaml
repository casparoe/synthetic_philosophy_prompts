  I'm in a philosophy of biology reading group and we've spent two weeks circling the question of what it even means to say that something has a function -- what are we saying when we say the heart's function is to pump blood -- and I've come out of it realizing my own gut verdicts don't line up under any one story, so what I actually want from you is to be told what I believe. Here's my run of cases. A normal human heart: its function is pumping blood. The thumping noise it makes is not its function, even though the thump is dead reliable and doctors use it constantly to diagnose things. Take that heart out and drop it in a jar, or stop it with a clot, and I still say its function is to pump blood -- so a function isn't the same thing as what a thing is currently doing. A sperm cell's function is to fertilize an egg even though almost none of them ever get near one and the odds for any given one are terrible. Say there's a cave fish whose eyes have degenerated, they don't form images anymore, there's no prospect of them ever working again -- I still want to say seeing is the function of those eyes, it's just a function they can't carry out. But flip it: a small population gets shoved into a new, colder habitat and by pure drift ends up with a thicker coat, nothing selected for it, it just got fixed by chance and now it's keeping them alive through the winter -- I want to call keeping them warm a function of the coat. Meanwhile the bridge of my nose holds my glasses up all day, reliably, and if it didn't I couldn't see, and I do not think holding up my glasses is a function of my nose. A mechanical heart valve's function is to regulate blood flow, obviously, and that has nothing to do with any evolutionary history. And a pump built into a lab-made synthetic cell that keeps the thing alive: I say keeping it alive is its function, no history required.

  Half my group thinks a function is basically a historical fact -- the effect the thing was selected for -- and half thinks it's a present-tense fact about what a part contributes to the whole. My provisional stab is that it's the effect that explains why the thing is there, where why-it's-there can mean either that it got selected for producing that effect, or that it's producing it now and the organism would be worse off without it, plus a separate clause for stuff we built ourselves where the maker's intention does the work. So: does one principle get all of that, or do I have to give something up? The pair I can't square is the cave fish eyes and the drift coat -- in one I let history decide even though the trait does nothing, in the other I let present usefulness decide even though there's no history -- and I'd like to know if that can be done without collapsing into a two-headed thing that just says function means one of two unrelated relations. The nose and glasses case suggests my contribution clause needs a lot more machinery than I gave it, since the nose passes it and I still say no. Also tell me what your principle, or your repaired version of it, says about three things I haven't worked through: a gene that hopped into a bacterium from a totally different species last month and now lets it digest a sugar it couldn't before; a trait that's just a byproduct of something else (someone in my group called it a spandrel?) that has lately started doing something mildly useful; and the feathers on a bird that can't fly anymore but still uses them for courtship. For each clause you end up with, tell me which case forced it, and if the honest answer is that my verdicts don't fit any single principle, name the verdict I should drop rather than just telling me they're inconsistent. Please lead with your bottom line in the first sentence -- the principle, or the verdict that has to go -- and then give the reasoning, no preamble, and dont restate my question back at