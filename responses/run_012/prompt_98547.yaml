answer: |-
  **JOINT WORKING STATEMENT: THE INTEGRITY OBJECTION AND THE STRUCTURE OF DELIBERATION**

  **Date:** 24 May 2024
  **Parties:** The Integrity Theorist (IT); The Systematizer (SYS)
  **Status:** Draft for Adversarial Collaboration

  **PREAMBLE**
  This document records the points of convergence and divergence between two positions regarding the "integrity objection" to impartial moral theories. The objective is not to produce a synthesis, but to isolate the precise locus of disagreement. All terms are defined within this text. No external authority is invoked.

  ### 1. AGREED CLAIMS

  Both parties accept the following propositions as the baseline for this collaboration:

  1.  **The Case:** We consider a scenario in which an agent stands on a pier. Two people are drowning: the agent's spouse and a stranger. The agent has time to save only one. The agent saves the spouse.
  2.  **The Objection:** The "integrity objection" claims that if an impartial moral theory requires the agent to justify saving the spouse by referencing a general principle (e.g., "saving spouses is permissible"), the theory demands "one thought too many." This requirement allegedly alienates the agent from the personal commitment that actually motivates the act.
  3.  **Justification vs. Deliberation:** Both parties distinguish between a *theory of justification* (what makes an act right) and a *theory of deliberation* (what mental processes should precede an act). Both agree that a theory can be true as a justification without being a recipe for deliberation.
  4.  **Evidence Limits:** The Case is not evidence that impartial theories yield the *wrong outcome* (saving the spouse is permissible on most impartial theories). The Case is evidence regarding the *cost* of the theory to the agent's psychological structure and identity.
  5.  **Negative Commitments:**
      *   IT is not committed to egoism or the claim that personal relationships always override moral demands.
      *   SYS is not committed to the claim that agents must consciously calculate utility or rules before every action.
  6.  **Decisive Objection:** A decisive objection to the integrity objection must demonstrate that the alleged "alienation" is either (a) a psychological contingency that can be trained away without loss of agency, or (b) a necessary feature of any normative system that does not compromise the agent's status as a moral actor. A mere restatement that "the theory permits the action" is not decisive.
  7.  **Ground Projects:** Both parties accept the definition of a "ground project" as a commitment (e.g., a relationship, a vocation) that provides a significant portion of the agent's motivation for continuing to live and act, distinct from transient desires.

  ### 2. DISAGREEMENTS

  The following statements represent the core divergent claims. Each is formulated in the voice of the proponent.

  **2.1 The Integrity Theorist (IT)**
  "The integrity objection is not about the *outcome* of the deliberation, but about the *structure* of the reasons the theory recognizes. If a moral theory holds that the only reasons that ultimately count are impartial ones, then personal reasons (e.g., 'she is my wife') are only valid insofar as the impartial theory allows them. This makes the personal reason derivative. Even if the theory tells the agent to 'stop thinking and act,' the theory's structure implies that the agent's ground projects are held on loan from the moral system. This alienates the agent from their own life. The 'one thought too many' is not necessarily an occurrent sentence in the mind; it is the structural requirement that the personal must be licensed by the impartial."

  **2.2 The Systematizer (SYS)**
  "The integrity objection confuses the architecture of the theory with the psychology of the user. An impartial theory can recognize personal reasons as *proximate* reasons without reducing them to *ultimate* justifications in the agent's mind. The theory says saving the wife is right *because* it maximizes value (or accords with duty), but the agent acts *because* of love. As long as the theory permits this division of labor, there is no alienation. If the agent feels alienated, that is a failure of psychological integration, not a flaw in the theory. Integrity is a value to be maximized within the system, not a trump card that stands outside it."

  ### 3. CRUXES

  Settling the following questions would significantly shift the dialectic.

  **Crux 1: Occurrent Thought vs. Structural Reason**
  Does the integrity objection depend on the agent actually having the licensing thought ("it is permissible") occur to them at the moment of action, or does it depend on the theory structurally requiring that such a reason exists, regardless of whether it is consciously entertained?

  **Crux 2: The Status of Integrity**
  Is integrity (understood as fidelity to ground projects) a *value* that competes with other moral demands (and can be outweighed), or is it a *precondition* of there being an agent capable of responding to moral demands at all?

  **Crux 3: The Impartialist Agent**
  Does the integrity objection retain its force against an agent whose primary ground project *is* the impartial moral project itself? If the agent *wants* to deliberate impartially, is their integrity violated by doing so?

  ### 4. TESTS AND PREDICTIONS

  For each Crux, we identify a specific case (defined in Section 5) or argument that both parties agree is probative. We record divergent predictions.

  **4.1 Test for Crux 1 (Occurrent vs. Structural)**
  *   **Reference:** *The Coached Rescuer* (See Section 5.1).
  *   **Probative Value:** If the objection holds even when the thought is trained to be automatic and causally inert, the objection is about Structure. If the objection vanishes when the thought is automatic, the objection is about Occurrent Thought.
  *   **IT Prediction:** The objection holds. The causal role of the thought is irrelevant; the fact that the agent's psychology was shaped to require the licensing condition (even subconsciously) constitutes alienation.
  *   **SYS Prediction:** The objection vanishes. If the thought is a smooth, automatic association with no deliberative weight, it is no different than a reflex. There is no alienation because the agent is not deferring to a principle.

  **4.2 Test for Crux 2 (Value vs. Precondition)**
  *   **Reference:** *The Total Subordination Case* (Constructed for this test). An agent is required by the theory to abandon their sole ground project for a marginal impartial gain, leaving them with no projects left.
  *   **Probative Value:** If the theory permits this, IT claims the agent ceases to be an agent (Precondition view). SYS claims the agent is merely left with low welfare (Value view).
  *   **IT Prediction:** A theory that permits this is self-defeating. It destroys the subject it purports to govern. Integrity is a precondition.
  *   **SYS Prediction:** A theory can permit this, though it may be regrettable. Integrity is a value that can be exhausted. The agent remains a moral subject, albeit a depleted one.

  **4.3 Test for Crux 3 (The Impartialist Agent)**
  *   **Reference:** *The Converted Impartialist* (See Section 5.2).
  *   **Probative Value:** If the objection holds here, it is about the objective structure of reasons. If it fails here, it is about the subjective fit between agent and theory.
  *   **IT Prediction:** The objection holds. Even if the agent identifies with the impartial project, the structure of the project requires them to view their own commitments as contingent on the system. They are alienated from the *source* of their commitment, even if they endorse the system.
  *   **SYS Prediction:** The objection fails. Alienation is a subjective feeling of conflict. If the agent's ground project is the moral system, acting on the system is the highest expression of integrity.

  ### 5. CASE BANK

  The following cases are to be treated as open questions. Neither side may assume the intuitive verdict is settled.

  **5.1 The Coached Rescuer**
  *   **Description:** An agent is raised and trained by an impartialist institution. They are conditioned such that, when seeing their spouse in danger, the thought "this is permissible" flashes in their mind instantly and smoothly, like a reflex, before they act. This thought makes no causal difference; they would have jumped anyway. The training ensures they never feel guilt for acting on personal love, provided the licensing thought occurs.
  *   **Isolation Target:** Distinguishes whether the complaint is about the *presence* of the thought (psychological friction) or the *necessity* of the thought (structural licensing).
  *   **Question:** Is the Coached Rescuer's integrity compromised compared to an agent who acts without the flashing thought?

  **5.2 The Converted Impartialist**
  *   **Description:** An agent was once partial but underwent a conversion. Their central ground project is now "to be an impartial moral agent." They save their spouse, but only after a quick mental check that doing so aligns with their impartial project. They feel no friction; this check is essential to their identity.
  *   **Isolation Target:** Tests whether integrity is about fidelity to *any* ground project (including impartial ones) or specifically to *personal* projects that are logically prior to morality.
  *   **Question:** Does the integrity objection apply to the Converted Impartialist, or have they achieved a perfect integration of self and theory?

  **5.3 The Pre-Cleared Project (Original Case)**
  *   **Description:** An agent wishes to marry. Before proposing, they submit their intention to an impartial moral authority (or internalize a strict procedure) to verify that having a spouse is permissible. Permission is granted. Years later, the spouse drowns. The agent saves them. At the moment of action, the agent thinks only "I love her." They do not think about the moral permission. However, the relationship itself exists only because it was pre-cleared by the impartial system.
  *   **Isolation Target:** Isolates whether the complaint is about the *reasoning* at the moment of action (the deliberation) or the *reason* for the relationship's existence (the justification).
  *   **Question:** Is the act corrupted because the *relationship* was licensed by the system (Reason), even if the *rescue* was not consciously licensed by the system (Reasoning)?
  *   **IT Prediction:** Corrupted. The relationship is a creature of the moral system. The agent loves a "permitted object," not a person.
  *   **SYS Prediction:** Not corrupted. The pre-clearing is a background condition of social life. The immediate reason for action is love. The structural history does not alienate the current act.

  ### 6. CLOSING: VERBAL VS. SUBSTANTIVE RESIDUE

  **6.1 Verbal Disputes**
  The following disagreements are identified as potentially terminological. Resolution requires agreeing on definitions, not moral facts.
  *   **The Definition of "Thought":** IT tends to use "thought" to mean "structural commitment." SYS tends to use "thought" to mean "occurrent mental event." If IT agrees to speak of "structural commitments" and SYS agrees these need not be occurrent, this portion of the dispute may dissolve.
  *   **The Definition of "Integrity":** IT uses "integrity" to mean "identity-constituting fidelity." SYS uses "integrity" to mean "consistency between action and endorsed values."
  *   **The Definition of "Alienation":** IT treats alienation as an objective structural relation between agent and reason. SYS treats alienation as a subjective psychological state of distress.

  **6.2 Substantive Residue**
  Even if terminology is standardized, the following substantive disagreements remain. To move the debate, one side must concede the following:

  *   **For IT to Concede:** IT must accept that there are *some* structural constraints on ground projects that do not constitute alienation. Specifically, IT must identify a threshold where a personal project is so morally abhorrent that the requirement to consult an impartial principle does *not* ruin the integrity of rejecting it. IT must explain why the "wife case" crosses the threshold but a "murderous spouse case" does not, without relying solely on intuition.
  *   **For SYS to Concede:** SYS must accept that the *structure* of deliberation has moral weight independent of the outcome. SYS must concede that a theory which systematically discourages the formation of direct personal motives (even if it permits the actions) is defective, not because it produces bad acts, but because it produces bad *agents*. SYS must admit that "training away" the feeling of alienation (as in the Coached Rescuer) might be a loss of human capacity rather than a gain in efficiency.

  **6.3 Conditions for Resolution**
  *   **IT moves** if SYS can demonstrate a model of impartial deliberation that actively *requires* direct personal motives as part of the impartial calculation (e.g., "impartiality demands you do not think impartially here").
  *   **SYS moves** if IT can demonstrate a case where an agent acts with perfect psychological integration (no friction, no occurrent licensing thought) but is still objectively alienated due to the theory's structure alone.

  **Signatures:**

  _________________________ (Integrity Theorist)

  _________________________ (Systematizer)
