  Quick recap in case it helps: in Knobe's original 2003 chairman case, a company can start a program that raises profits and, as a side effect, damages the environment. The chairman says he doesn't care at all about the environment, he just wants the profit. Asked whether he harmed the environment intentionally, most people say yes. Flip the side effect so the program helps the environment and the chairman says he doesn't care about helping it, and most people say he didn't help it intentionally. Asymmetry, everyone has a story about why.

  Here's what I actually want a probability on. I've been sketching a follow-up that I dont think anyone's run in this exact form, and I want your credence that the asymetry survives it. Manipulation one, the bad-victim version: keep everything else fixed but make the affected party someone the respondent has zero sympathy for — the program bankrupts the owner of a rival firm who's been caught defrauding his own customers (in the help version, the same sleazebag gets a windfall). Manipulation two, blame-free wording: instead of asking whether he did it intentionally, ask which of the program's effects were part of what he was trying to bring about versus side effects he merely foresaw and didn't care about. For each manipulation, what's your credence the harm/help asymmetry shows up at roughly its original magnitude? Then the decomposition. I want a number on the headline claim, which I'll state as: a normative component in the folk concept of intentional action is the single largest contributor to the effect — bigger than question pragmatics or blame attribution (I know "largest contributor" is a bit loose given nothing factors cleanly, but I want a number anyway). Break it into the sub-questions the number actually rests on, with a rough probability and one line of justification each — genuine conceptual normativity, the question's implicature, affect/blame driving the judgment after the fact, the idea that "intentional action" in ordinary talk is doing a different job than "intentional action" in the philosophy of action, plus anything else you think belongs — then show how they combine. My own number is 0.4 that it's mostly the concept rather than the pragmatics; my friend who's a grad student in x-phi says 0.85 pragmatics and thinks I'm being naive. Given your decomposition, where does our disagreement most likely live, which single sub-question would move your number the most, and what evidence would move it? Think carefully, and don't just split the difference between me and my friend — if you think we're both wrong about where the action is, say so.
