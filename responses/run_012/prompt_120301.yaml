answer: |-
  Here are the live theoretical options, stripped to the bone.

  **Normative Concept:** The folk concept of "intentional" is semantically thick; you cannot apply the label without implicitly passing a moral judgment. It's not that morality biases the judgment; morality is a necessary condition for the concept's application in side-effect cases.

  **Conversational Pragmatics:** The concept is neutral, but the question "Did he do it intentionally?" is heard as "Is he blameworthy?" Respondents answer the implicated question to be cooperative conversationalists, masking their actual neutral concept of intention.

  **Blame-Driven Rationalizing:** Moral judgment happens fast and emotionally; the intentionality attribution is a slow, post-hoc confabulation to justify the blame. The mind decides he's bad first, then hunts for reasons to call it intentional.

  **Measurement Artifacts:** The effect is a survey bug. Order effects, demand characteristics, or ambiguous wording create the asymmetry, and it vanishes under rigorous controls or cognitive load.

  ***

  ### Credences on Your Manipulations

  **Manipulation 1 (Bad-Victim): 0.4**
  I give this a 40% credence that the asymmetry survives at original magnitude. The Knobe effect tracks the *badness* of the side effect, not just the harm. If the victim is a fraudster, the normative violation is dampened; harming a bad guy is less "bad" than harming an innocent. If the moral valence drops, the intentionality attribution drops. The asymmetry shrinks because the input normativity shrinks.

  **Manipulation 2 (Blame-Free Wording): 0.2**
  I give this a 20% credence that the asymmetry survives at original magnitude. Switching to "trying to bring about" versus "foresaw" forces a psychological distinction that bypasses the folk concept of "intentional action." The folk concept is coarse and normative; the philosophical decomposition is fine-grained and neutral. When you force the decomposition, you stop measuring the folk concept, so the effect disappears.

  ***

  ### Headline Claim Credence

  **Claim:** A normative component in the folk concept of intentional action is the single largest contributor to the effect.
  **Credence:** 0.7

  I am siding closer to you than your friend, but I think your 0.4 is too timid. Your friend's 0.85 for pragmatics assumes the concept is neutral and the context is lying. I think the context reveals the concept. The asymmetry *is* the shape of the folk concept.

  ### Decomposition

  To get to 0.7, I'm treating this as a conjunctive claim that requires three underlying premises to hold. I'll assign credences to the premises and show how they yield the headline.

  **1. Robustness to Cognitive Load (0.8)**
  *Justification:* If the effect were mere post-hoc rationalizing (Bias theory), adding cognitive load should kill it by preventing the rationalization; studies show the effect persists under load, suggesting it's automatic and conceptual.

  **2. Non-Moral Normativity Transfer (0.6)**
  *Justification:* If the effect appears with etiquette or conventional norms (e.g., violating a dress code) and not just morality, it confirms the mechanism is "normativity" generally, not just specific blame pragmatics. Evidence here is mixed but leaning positive.

  **3. Pragmatics Insufficiency (0.75)**
  *Justification:* Pure pragmatic models fail to predict asymmetry in cases where blame is held constant but normative valence shifts (e.g., justified harm). If pragmatics were the sole driver, controlling for blame implicatures should zero out the effect; it rarely does completely.

  **Combination Logic:**
  I'm not multiplying these (which would yield ~0.36), because they are corroborative lines of evidence rather than independent necessary conditions. I'm using a weighted average where the strongest evidence (Robustness) anchors the view.
  *(0.8 + 0.6 + 0.75) / 3 = 0.716.*
  Rounded to **0.7**. This reflects high confidence that the concept is normative, moderated by the fact that pragmatics definitely plays a supporting role (hence not 0.9).

  ***

  ### The Disagreement

  **Where we disagree:**
  You and your friend are fighting over a false dichotomy. Your friend (0.85 Pragmatics) treats "concept" as a sterile, dictionary definition and anything context-sensitive as "pragmatics." I treat the folk concept as a tool designed for social navigation; its sensitivity to context *is* its conceptual structure, not a pragmatic overlay. You (0.4 Concept) underestimate how deeply the normativity is baked in, assuming there's a neutral core waiting to be found if we just ask the right way.

  **The single sub-question that moves my number:**
  **Non-Moral Normativity Transfer.** If it turns out the asymmetry *only* appears with moral harm and never with conventional or aesthetic norms, my credence drops to 0.4. That would suggest the effect is specific to moral blame (supporting your friend) rather than a general feature of how folk psychology handles norms (supporting me).

  **Evidence that would move it:**
  A clean replication showing the side-effect effect vanishes when the "norm" violated is purely conventional (e.g., wearing socks with sandals) while holding the agent's attitude constant. If the asymmetry survives non-moral norms, the "Normative Concept" view wins decisively. If it disappears, the "Moral Blame/Pragmatics" view wins. Current data suggests it survives, which is why I'm at 0.7.
