      *   **Conclusion:** The implication for AI development. We need systems that can reason about *change*, not just pattern match *states*.

  4.  **Drafting - Section by Section (incorporating constraints):**

      *   *Intro:* Start with the hospital triage example. It's the perfect fault line. State the verdict: Relocated, not solved.
