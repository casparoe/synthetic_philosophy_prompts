  3.  **Outline the Essay:**
      *   **Title:** Needs to be punchy. "The Ghost in the Weights," "The Frame Problem Never Left," etc. Let's go with "The Frame Problem Never Left; It Just Went to Ground."
      *   **Introduction:** Acknowledge the two camps. State the thesis immediately: The optimists are wrong; the pessimists are right but for slightly the wrong reasons. It's not buried; it's transformed.
      *   **The Old Frame Problem:** Briefly touch on the symbolic era (logic, explicit rules) to set the contrast.
      *   **The New "Solution":** How Deep Learning claims to handle it (Attention, weights, statistical relevance).
      *   **The Counter-Argument (The Verdict):** Why this fails in the hospital triage scenario. The difference between *correlational relevance* and *causal relevance*.
      *   **Addressing the Opposing View:** Steelman the "Big Data solves everything" argument. Then dismantle it using the concept of "long tail" or "black swan" events.
