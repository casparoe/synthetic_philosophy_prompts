      *   **Format:** A draft essay to argue with (needs a strong, defensible position).
      *   **Specific Dispute:** Camp A (Frame Problem is solved/moot by Deep Learning/Big Data) vs. Camp B (Frame Problem is buried/relocated; statistical correlation $\neq$ causal relevance in novel situations).
      *   **Key Example:** Hospital triage tool (sifting hundreds of facts for the relevant handful).
      *   **Core Question:** Is the frame problem solved, dissolved, or relocated? Is it one problem (representation/update) or two (representation + relevance)?
