answer: |-
  **Title:** The Frame Problem Never Left; It Just Went to Ground

  **The Verdict:** The Frame Problem has not been solved. It has not even been merely buried. It has been **relocated from the logic engine to the training distribution**, transforming from a computational bottleneck into a statistical fragility. Furthermore, the difficulty is not two distinct problems of representation and relevance; it is a single, indivisible problem of **contextual integrity**. You cannot represent a changing world without implicitly deciding what changes matter.

  ***

  Consider the hospital triage tool. It ingests a patient's history: decades of prescriptions, last week's lab work, the nurse's notes from the last hour, the ambient temperature of the ER, the shift change of the staff. To save the patient, the system must ignore almost all of this. It must isolate the three variables that actually predict the heart attack happening *now*.

  The optimists tell you this is no longer a philosophical puzzle. They point to transformer architectures and attention mechanisms. They argue that by training on the sum of human text and telemetry, a system learns a probabilistic map of relevance. It learns that "chest pain" attends to "EKG results" and ignores "cafeteria menu." In this view, the Frame Problem was a symptom of a poverty of data. We tried to hand-code relevance with symbolic logic; now we let the data speak. The frame is not drawn by the programmer; it is emergent from the weights.

  This is a seductive argument, but it confuses *frequency* with *necessity*.

  The optimists are correct that deep learning has dissolved the *computational* aspect of the original Frame Problem. In the 1980s, the worry was that a robot would have to logically prove that painting a door didn't change its handle's position. Modern neural networks do not labor under that burden. They do not prove anything. They guess. And because they guess based on billions of prior examples, they guess right often enough to seem magical.

  But this magic breaks exactly where the Frame Problem was always most acute: at the boundary of the known.

  When the triage tool encounters a patient whose symptoms correlate with a rare drug interaction never seen in the training set, the "attention" mechanism does not suddenly realize it needs to look deeper. It attends to what *usually* mattered. It applies the old frame to a new picture. The system has not solved the problem of deciding what is relevant; it has outsourced that decision to the past. It assumes the future will be a statistical echo of the training data.

  This is why the Frame Problem is not solved, but relocated. In the symbolic era, the bottleneck was **inference**: the system couldn't compute relevance fast enough. In the neural era, the bottleneck is **extrapolation**: the system cannot recognize when its definition of relevance has become obsolete.

  The optimist will counter: "But the model adapts. Fine-tuning and reinforcement learning allow it to update."

  This is the strongest version of the opposing view, and it must be taken seriously. It suggests that "common sense" is just a rapid cycle of prediction and error correction. If the triage tool flags the wrong variable and the doctor corrects it, the weights shift. The frame updates.

  The flaw in this defense is that it treats the Frame Problem as a calibration error rather than a structural blind spot. Error correction works only if the system knows *which* error to correct. In a high-dimensional space (hundreds of patient facts), there are thousands of ways to be wrong. If the system ignores the one variable that matters (a specific enzyme deficiency) because it was statistically irrelevant in 99.9% of training cases, it may never receive the specific feedback signal needed to re-weight that variable. It is not just wrong; it is confidently wrong about what to pay attention to.

  This brings us to the second question: Is this one problem or two? Are representation (how the world is modeled) and relevance (what matters in the model) distinct?

  They are not. They are the same thing viewed from different angles.

  A representation that includes everything is not a representation; it is a mirror. It is useless for action. To represent the world is to compress it, and compression requires a theory of what can be safely discarded. That theory *is* relevance.

  The symbolic AI researchers understood this. They tried to write explicit rules for what could be discarded (the "frame axioms"). They failed because the rules were too brittle. The neural network researchers claim to have bypassed this by learning the compression automatically. But they have merely hidden the rules in the black box of the latent space.

  When a large language model writes a coherent paragraph, it is successfully maintaining a frame. It knows that if a character walks through a door, they are now in the next room, and it doesn't need to restate their shoe size. It has solved the Frame Problem for the domain of text.

  But text is a curated reality. It is a record of what humans already decided was relevant. When the AI steps out of text and into the triage unit, it faces the raw world, where the relevant variables are not determined by grammar or narrative coherence, but by causal physics and biology.

  Here, the distinction collapses. If the system's representation of the patient does not include the causal link between a specific supplement and a blood thinner, it cannot represent the patient *as a patient at risk*. Its representation is incomplete *because* its relevance filter is flawed.

  So, where does this leave us?

  The Frame Problem has moved. It is no longer a bug in the code; it is a bug in the dataset. We have solved the problem of how to process relevance, but we have not solved the problem of how to *acquire* it in novel situations. We have built systems that are brilliant at interpolation (filling in the gaps within the frame) but brittle at extrapolation (redrawing the frame).

  This is why common sense remains elusive. Common sense is not just knowing what usually matters. It is the ability to sense when the usual no longer applies. It is the meta-cognitive spark that says, "The rules I have been using to ignore information are no longer working."

  Current systems do not have this. They are trapped in the frame of their training. They are like the triage nurse who has memorized the textbook perfectly but freezes when a patient presents with a symptom the textbook author never imagined.

  To claim the Frame Problem is solved because machines handle ordinary situations well is to claim that navigation is solved because a train stays on the tracks. It stays on the tracks precisely because it cannot go off them.

  True common sense requires the ability to go off the tracks when the tracks end. Until a system can distinguish between "this didn't matter before" and "this doesn't matter *now*," the Frame Problem remains. It is no longer a logical paradox haunting the code. It is a statistical cliff edge waiting at the limit of the data. And in a world that keeps producing situations nobody has seen, that is a far more dangerous place to be.
