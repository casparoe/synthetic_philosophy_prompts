answer: |-
  This is a classic case of a philosophical slogan doing too much work. Your colleague threw a grenade labeled "Rawls" to kill a mission statement, but the phrase "the right is prior to the good" is notoriously slippery. It shifts meaning depending on whether you're doing moral philosophy, political philosophy, or metaphysics.

  Here is the menu of claims hidden inside that slogan, graded by how costly they are to accept and whether they actually support his objection to the departmental statement.

  ### The Menu of Claims

  **1. The Constraint Claim (Deontological Side-Constraint)**
  *   **The Claim:** Principles of justice set boundaries that cannot be crossed, even to maximize overall good outcomes. You cannot sacrifice one person's rights to make the department happier or more "flourishing" on aggregate.
  *   **Verdict:** **Real Thesis (but widely accepted).** This is standard liberal deontology. It's not a platitude (Utilitarians deny it), but it's the baseline for most academic governance.
  *   **Does it block the mission statement?** **No.** A mission statement isn't usually a violation of rights. It doesn't force anyone to *be* anything, it just says what the department values. This claim stops you from firing a colleague for having the wrong hobbies; it doesn't necessarily stop you from saying "we value critical thinking."
  *   **Who denies it?** Act Utilitarians, consequentialists.

  **2. The Justificatory Claim (Rawlsian Core)**
  *   **The Claim:** We can derive principles of justice (or departmental norms) without first agreeing on a *comprehensive* doctrine of what makes life valuable. We justify the rules first; people pursue their own versions of "the good" within those rules.
  *   **Verdict:** **Real Thesis.** This is the engine of *Political Liberalism*. It argues that in a pluralistic environment, we can't agree on the "Good Life," so we agree on the "Right Rules" instead.
  *   **Does it block the mission statement?** **Yes, if...** the mission statement is interpreted as a *comprehensive* doctrine. If the statement says "We are here to produce virtuous citizens," this claim blocks it. If it says "We are here to teach writing," it might not.
  *   **Who denies it?** Perfectionists (e.g., Joseph Raz), Comprehensive Liberals, some Communitarians.

  **3. The Neutrality Claim (Institutional Application)**
  *   **The Claim:** The institution (state or department) must remain neutral among competing conceptions of the good life. It cannot officially endorse one vision of flourishing over another.
  *   **Verdict:** **Real Thesis (Costly).** This is the political upshot of Claim #2. It's costly because it limits the institution's ability to educate for character or virtue, only for skills or procedures.
  *   **Does it block the mission statement?** **Yes, Directly.** This is almost certainly what your colleague meant. He's arguing that endorsing a specific vision of "humanistic flourishing" violates institutional neutrality.
  *   **Who denies it?** Perfectionist Liberals (the state *should* promote autonomy/arts), Communitarians (institutions *should* sustain shared values).

  **4. The Metaphysical Claim (The "Unencumbered Self")**
  *   **The Claim:** The self is prior to its ends. Who I *am* is distinct from what I *value*. I can step back from my commitments and choose them; they do not constitute my identity.
  *   **Verdict:** **Contested / Metaphysically Costy.** This is the most philosophical reading. It suggests human beings are essentially choosers, not essentially members of a tribe or tradition.
  *   **Does it block the mission statement?** **Weakly.** This explains *why* someone might feel coerced by a mission statement (it imposes an end on a self that chooses its own ends), but it's a claim about human psychology/ontology, not policy.
  *   **Who denies it?** Communitarians (Michael Sandel, Alasdair MacIntyre), Hegelians, Aristotelians. They argue we are "encumbered" by our histories and communities.

  **5. The Lexical Priority Claim (The Hardline)**
  *   **The Claim:** The Right *always* trumps the Good. There is no trade-off. Even a tiny right violation is worse than a massive increase in collective flourishing.
  *   **Verdict:** **Strong Thesis (Often False in practice).** While theoretically neat, almost no one holds this strictly. (Rawls allows for some adjustments in non-ideal theory).
  *   **Does it block the mission statement?** **Yes, absolutely.** It turns the priority into a veto.
  *   **Who denies it?** Almost everyone, upon reflection. Even hard deontologists allow for catastrophic overrides.

  ---

  ### Addressing Your Specific Questions

  **1. Which ones are consistent?**
  Claims 2 (Justification) and 3 (Neutrality) go together naturally in Rawls. Claim 4 (Metaphysics) is supposed to underwrite them, but Rawls later claimed he didn't *need* Claim 4 to make Claim 3 work (which is where Sandel pounced). Claim 5 (Lexical) is a hardened version of Claim 1.

  **2. Does he need the slogan?**
  **No.** This is the most important point for your meeting.
  A **Perfectionist Liberal** (someone who thinks the state *should* promote good ways of life) could still argue against the mission statement on pragmatic grounds. They might say: *"A mission statement won't actually promote flourishing; it will just create bureaucratic box-checking and alienate faculty who interpret 'flourishing' differently."*
  They deny "The Right is Prior to the Good," but they reach the same conclusion (No Statement) via a different route (Prudence/Effectiveness). Your colleague used a deontological veto when a pragmatic argument would have sufficed.

  **3. Where does the Communitarian critique land?**
  Michael Sandel's critique in *Liberalism and the Limits of Justice* targets **Claim 4 (Metaphysics)**. He argues you can't have Claim 3 (Neutrality) without secretly presupposing Claim 4 (that we are unencumbered selves).
  *   **Does it hit the priority claim itself?** Sandel argues that if the Metaphysical claim is false (and he thinks it is, because we are constituted by our communities), then the Political Priority claim loses its foundation. However, Rawlsians retorted that the priority is *political, not metaphysical*. So, the critique lands on the *foundation* of the priority claim, not necessarily its practical application in a pluralistic society.

  **4. Platitude, Real Thesis, or False?**
  *   **Platitude:** "Rules constrain goals." (Everyone accepts this to some degree).
  *   **Real Thesis:** "Institutions should not justify rules using a specific religious or philosophical doctrine of the good." (Rawls' Political Liberalism).
  *   **False/Contested:** "The self exists prior to its ends." (Many psychologists and sociologists deny this).

  ### Cheat Sheet for Monday

  If you want to press him without looking like you're reading from a script, here are three moves:

  1.  **The Neutrality Check:** "Are you arguing that a mission statement violates **institutional neutrality** (we can't endorse values), or that it violates **individual rights** (it coerces us)?"
      *   *Why:* Forces him to choose between Claim 2 and Claim 3.
  2.  **The Perfectionist Trap:** "Could we agree on a mission statement that promotes 'intellectual autonomy' without violating the priority of the right? Or is *any* vision of flourishing off-limits?"
      *   *Why:* Tests if he's a strict neutralist or just worried about coercion. Most liberals think promoting autonomy is fine.
  3.  **The Slogan Challenge:** "Do we need the 'priority of the right' to block this? Couldn't we just say a statement is **ineffective** without making a metaphysical claim about the good?"
      *   *Why:* Points out he's using a sledgehammer to crack a nut.

  **Summary:** Your colleague likely meant **Claim 3 (Institutional Neutrality)**. He thinks the department, like the state, shouldn't be in the business of defining "the good life." That is a defensible position, but it's a political choice, not a logical necessity, and it doesn't require the heavy metaphysical baggage of the "unencumbered self."
