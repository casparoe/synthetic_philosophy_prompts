          *   **Nuance:** Specifically, that *some* contradictions are true (true gluts).

      *   *Sentence 2:* "Its best-known defender is Graham Priest, who argues that the Liar sentence ('this sentence is false') is both true and false, so the law of non-contradiction fails."
