  Ok so a bit about me: I spent 35 years at the bench — physiology, electrophysiology mostly — and since I retired I've been reading philosophy of mind pretty much nonstop, and I keep running into this thing people call epiphenominalism, the idea that conscious experience is real but does no causal work. Here's what bugs me: I have pretty firm gut reactions to a bunch of cases about whether a "judgment" or report about an experience is caused by the experience or just rides along with it, and I can't get them to line up under one principle. I want you to treat yourself as a professional philosopher of mind — someone who knows the metaphysics of consciousness and the causal-role debates cold, not someone who's going to hand me the standard menu of positions. Don't give me citations or a reading list, I can't chase them down anyway and I don't care who said what. What I want is the principle.

  Before you answer, do some actual brainstorming on the page: lay out two or three candidate principles first, show me where each one breaks, and then commit. Think carefully — I'd rather have one principle you defend than five you list.

  Here are my gut verdicts. Judge them honestly, some of them might just be confused.

  Blindsight: someone with a damaged visual cortex swears they see nothing, yet guesses the orientation of a bar well above chance. My gut: his guess is not a report about an experience — there's no experience for it to be about. Nothing mysterious, the stimulus is steering him directly.

  I stub my toe and yelp. My gut: the pain made me yelp. If you told me the yelp was caused entirely by the tissue damage and the pain was just tagging along for the ride, I'd say you'd changed the subject.

  The readiness-potential stuff — the brain signal shows up before I'm aware of "deciding" to move my finger. My gut here: fine, the conscious decision is a readout, not the cause. Epiphenomenalism about the will doesn't bother me at all.

  I look at a painting and think "that's a gorgeous deep red." My gut: the red experience caused the thought. Even if some neuroscientist could read the thought straight off my cortex without ever mentioning my experience, I'd still insist the experience was doing the work.

  Change blindness: I watch a clip, miss that the jacket changes color, and later report no change. My gut: obviously my report isn't about any experience of the change — but I also feel like my not-seeing is what explains the report.

  A color-sorting machine that says "red." No experience, so the report isn't about an experience. Same verdict as the blindsight case, basically.

  See my problem? Cases 2 and 4 I'll fight you over — the experience has to be the cause. Case 3 I cave instantly. Mechanically all three look like "neural event, then report," with the experience possibly just standing next to the machinery. Is there a principle that gets all six, or do I have to give one up — and if so, which one, and why that one rather than another? Tell me what the surviving principle predicts for a case I haven't listed: say a split-brain patient whose left hemisphere spins a confident reason for something the right hemisphere just did on its own.

  And here's the part that keeps me up. If the principle that saves 1, 3, 5 and 6 comes out roughly as "experiences never cause the judgments we make about them," then why are my judgments about my own experiences so damn reliable? That can't be an accident, and if it isn't an accident it looks like the experience must be causing the judgment after all — which kills the principle. Is that a real trap or am I just not seeing the escape hatch? I want your verdict on whether my principle boxes me into that corner, and what the least ugly way out is.
