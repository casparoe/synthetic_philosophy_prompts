      *   *Other Arts:* Copy Ideas (shadows of shadows). They show specific forms (a specific human, a specific landscape).
      *   *Music:* Copies the Will directly. It doesn't show *this* lover or *that* battle, but the essence of loving or striving itself.
      *   *The Mapping (Bass to Melody):* Schopenhauer uses an analogy. The bass = inorganic nature/vegetative life (lowest grades). The melody = human intellectual striving (highest grade).
      *   *The Resolution:* The key distinction is *universality* vs. *particularity*. Music expresses the *form* of feeling without the *matter* of specific events. It conveys the "in-itself" of the emotion, stripped of the real-world context that causes pain/pleasure.
      *   *Analogy:* Think of it as a geometric formula vs. a specific drawing. Music gives the formula of striving; other arts give a drawing of a specific striver.
      *   *Why it's not "determinate representation":* It doesn't say "John is sad because Mary died." It says "This is the structure of Sadness itself." Therefore, it remains a copy of the Will's *movement*, not a picture of the Will's *objects*.

