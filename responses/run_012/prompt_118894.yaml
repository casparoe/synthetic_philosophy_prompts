  # Seminar Handout: What Do Choices Reveal About the Good?

  **Starting Commitment:** *When a person consistently chooses X over Y, her choice is the best evidence available that X is better for her than Y.*

  **Note on Structure:** Most positions in the philosophy of economics accept the Starting Commitment as a substantive claim about the relationship between choice and welfare. However, some positions treat the commitment as merely methodological or reject its ontological presuppositions. To respect these fundamental disagreements, the seminar material is divided into two trees. **Tree 1** sorts positions that accept the Starting Commitment as substantively true. **Tree 2** sorts positions that modify or reject the commitment's ontological weight.

  ---

  ## Tree 1: The Substantive Interpretation
  *For positions accepting that choice tracks a mind-dependent welfare fact.*

  **Node 1: The Constitution of Preference**
  Consider a person who chooses A over B in one elicitation and B over A in another with no change in her circumstances. Is there a fact of the matter about which she *really* prefers, antecedent to the choice?
  *   **No:** The act of choosing constitutes the preference; there is nothing antecedent to be revealed.
      *   **Yes:** Preferences exist independently of the specific choice event.
      *   **LEAF: (g) Constitutivism.**
          *   *Hardest Commitment:* Adherents must defend why we criticize choices as "mistakes" if the choice itself creates the truth.
  *   **Yes:** (Proceed to Node 2)

  **Node 2: The Coherence Constraint**
  Consider a person whose choices cycle, so that a sequence of trades can strip her of everything she has, though she still has views about the options. Is there a determinate fact about her welfare in this state?
  *   **No:** Welfare claims are indeterminate whenever an agent's choices fail to cohere.
      *   **Yes:** Welfare exists even if current choices fail to track it coherently.
      *   **LEAF: (i) Indeterminacy.**
          *   *Hardest Commitment:* Adherents must explain how policy can intervene for a person's good if no fact of the matter exists.
  *   **Yes:** (Proceed to Node 3)

  **Node 3: The Scope of Interest**
  Consider a person who bears a cost to keep a promise that benefits no one she cares about. Does this choice reveal what is *good for her* (her welfare), or merely what she is committed to?
  *   **No:** Choice reveals preference, but welfare comes apart when the agent acts on principle rather than interest.
      *   **Yes:** Satisfying this commitment is part of her welfare.
      *   **LEAF: (e) Commitment/Separation.**
          *   *Hardest Commitment:* Adherents must defend a principled distinction between "interest" and "principle" that the agent herself may not recognize.
  *   **Yes:** (Proceed to Node 4)

  **Node 4: The Metric of Welfare**
  Is welfare constituted by the satisfaction of the agent's attitudes, or by a felt experience measurable independently of those attitudes?
  *   **Experience:** Welfare is an index of felt experience; choice is at best a fallible indicator of it.
      *   **Attitudes:** Welfare is defined by the satisfaction of preferences (however corrected).
      *   **LEAF: (a) Hedonism/Experience.**
          *   *Hardest Commitment:* Adherents must explain why we respect choices that demonstrably reduce felt happiness (e.g., painful truths).
  *   **Attitudes:** (Proceed to Node 5)

  **Node 5: The Distortion of Deprivation**
  Consider a person who reports contentment with a life she was pushed into by deprivation. Is her reported satisfaction the final word on her welfare?
  *   **No:** Satisfaction-based measures are systematically distorted by the way deprivation shapes what people come to want.
      *   **Yes:** Or, the distortion is a matter of information/procedure, not the measure itself.
      *   **LEAF: (h) Adapted Preferences.**
          *   *Hardest Commitment:* Adherents must specify an authority for judging welfare that overrides the agent's own reported contentment.
  *   **Yes:** (Proceed to Node 6)

  **Node 6: The Nature of Self-Binding**
  Consider a person who buys a device to keep a temptation out of reach. Is this choice evidence of a preference that pairwise choice cannot represent, or evidence of a conflict between her current and 'better' selves?
  *   **Menu-Dependence:** The choice reveals a preference structure where the menu itself matters; she is not erring.
      *   **Conflict:** She is correcting a distortion to align with a truer ranking.
      *   **LEAF: (d) Menu-Dependence.**
          *   *Hardest Commitment:* Adherents must formalize a preference theory that violates the standard axiom of independence of irrelevant alternatives without losing predictive power.
  *   **Conflict:** (Proceed to Node 7)

  **Node 7: The Idealization Standard**
  To identify the welfare-relevant ranking, must we supply full information and correct computational error, or simply remove procedural distortions like panic or addiction?
  *   **Full Information:** The ranking is the one the agent would have if fully informed and free of computational error.
      *   **Procedural:** The ranking is the one that survives removing internal conditions the agent would repudiate.
      *   **LEAF: (b) Idealized Preference.**
          *   *Hardest Commitment:* Adherents must defend the coherence of a "self" that exists under conditions of omniscience the actual agent cannot occupy.
  *   **Procedural:**
      *   **LEAF: (c) Internalist/Procedural.**
          *   *Hardest Commitment:* Adherents must distinguish "repudiated conditions" (addiction) from "constitutive traits" (temperament) without circularity.

  ---

  ## Tree 2: The Meta-Theoretical Interpretation
  *For positions that reject the Starting Commitment as a substantive truth about welfare.*

  **Node 1: The Ontological Status of "Good"**
  Does the economic model require a real fact of the matter about what is "good for" the agent to exist?
  *   **No:** The apparatus is an as-if predictive device with no commitments about what is good for anyone.
      *   **Yes:** There is a fact of the matter, but it does not depend on attitudes.
      *   **LEAF: (f) Instrumentalism.**
          *   *Hardest Commitment:* Adherents must explain the normative force of welfare economics if "welfare" has no ontological referent.
  *   **Yes:**
      *   **LEAF: (j) Objective List.**
          *   *Hardest Commitment:* Adherents must explain why choice is the *best evidence* if the good is entirely independent of the agent's attitudes.

  ---

  ### Analysis of the Decision Space

  **Inseparable Leaves:**
  *   **(b) Idealized Preference** and **(c) Internalist/Procedural**: These positions are flagged as difficult to separate because both rely on counterfactual correction of the agent's state. In many concrete cases (e.g., addiction), full information and procedural cleanliness yield the same ranking. The tree separates them by *justification* (information vs. repudiation) rather than *outcome*.

  **Unoccupied Combinations (Diagnosis):**
  1.  **Tree 1, Node 1 (No) + Node 2 (Yes):** *Constitutive Preference with Determinate Welfare despite Incoherence.*
      *   *Diagnosis:* **Incoherent.** If preference is constituted by choice, incoherent choices constitute contradictory preferences, leaving no determinate welfare fact.
  2.  **Tree 1, Node 4 (Experience) + Node 5 (No):** *Hedonism with Adapted Preference Critique.*
      *   *Diagnosis:* **Unexplored.** One could argue deprivation distorts *reported* satisfaction, but welfare remains *felt experience*. This position exists but is rarely named distinctly from (a) or (h).
  3.  **Tree 2, Node 1 (No) + Tree 1 Positions:** *Instrumentalism with Substantive Welfare Claims.*
      *   *Diagnosis:* **Incoherent.** One cannot claim the model is "as-if" with no ontological commitment while simultaneously asserting substantive claims about what is good for the agent.
  4.  **Tree 1, Node 6 (Menu-Dependence) + Node 7 (Full Information):** *Menu-Dependence requiring Ideal Information.*
      *   *Diagnosis:* **Unattractive.** Menu-dependence usually argues that the context *itself* changes the value, not that a fully informed agent would choose the menu. Combining them dilutes the constructive claim of (d).

  **Note on the Split:**
  Tree 2 is necessary because positions (f) and (j) disagree with the Starting Commitment about *what the theory is for*. (f) denies the theory is about welfare at all; (j) denies welfare runs through attitudes. Forcing them into Tree 1 would require branch questions that presuppose the very ontology they reject (e.g., asking (f) "Is welfare experience or preference?" is a category error).
