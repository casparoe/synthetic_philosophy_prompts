      **Impact:** -10 marks. This misstates the puzzle's precision, making the paradox seem stronger than the math supports.

  2.  **Claim:** "So my vote does make a difference... and the instrumental account was never in as much trouble."
      **Error:** Conceptual non-sequitur regarding utility functions.
      **Correction:** The instrumental account assumes utility is discontinuous at the win threshold. As discussed in week 7, marginal influence only matters if voters care about the margin size. Since the standard model assumes winner-take-all, marginal influence yields zero instrumental utility. You must argue that voters care about margins to save the account, not simply assert marginal influence exists.
      **Impact:** -15 marks. This fails the "use distinctions correctly" criterion; you defined them well but applied them to save a model they don't support.

  3.  **Claim:** "That is a concession that voting is irrational, and it abandons the rational-choice framework."
      **Error:** Category error regarding rationality.
      **Correction:** Expressive voting is still rational choice; the utility function simply includes consumption benefits from the act. It does not abandon the framework.
      **Impact:** -5 marks. This mischaracterizes the theoretical landscape.

