  4. **A model answer to (a)–(c), compressed**
  (a) The instrumental account views voting as an investment where expected utility ($EU$) equals probability of pivoting ($p$) times benefit ($B$) minus cost ($C$). With $N$ voters and random voting, the probability of a tie is $\binom{N-1}{(N-1)/2} 2^{-(N-1)}$. For large $N$, this approximates $\sqrt{2/\pi N}$, which is tiny. Since $C > p \times B$, rational agents should abstain, yet turnout is high.

  (b) Pivotal influence changes the winner; marginal influence changes the vote margin. The paradox remains because standard instrumental utility is discontinuous: only winning matters. Marginal influence provides no utility unless one values the margin itself, which requires altering the standard instrumental model rather than saving it.

  (c) The expressive account relocates the paradox. It explains turnout by adding utility from the act itself ($D$), making $EU = pB + D - C$. However, it struggles to explain why $D$ varies with election closeness. If expression is independent of outcomes, turnout shouldn't correlate with pivotal probability, yet it does. Thus, it solves the abstention puzzle but creates a new puzzle about expression's sensitivity to stakes.
