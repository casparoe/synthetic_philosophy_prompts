      **Error:** Theoretical inconsistency.
      **Correction:** Rational agents (even expressive ones) respond to costs. If $Cost > Expressive Benefit$, they abstain. Lowering costs increases turnout. Your prediction contradicts basic demand theory.
      **Impact:** -5 marks. This weakens your defense of the expressive account in part (c).

