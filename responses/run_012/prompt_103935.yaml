answer: |-
  Here is an analysis of the argument you have provided, broken down into its logical steps, followed by answers to your six specific questions.

  ### Part I: Step-by-Step Analysis of the Argument

  The argument you have paraphrased is a classic formulation of the Frege–Geach problem. It relies on the tension between the logical behavior of moral sentences and the expressivist account of their meaning. Here is the reconstruction, flagging the assumptions at each stage.

  **Step 1: The Phenomenon of Embedding**
  *   **Claim:** Moral sentences (e.g., "Lying is wrong") frequently appear as proper parts of larger, complex sentences (e.g., conditionals, negations, belief reports).
  *   **Assumption:** Any adequate semantic theory must account for the meaning of sentences in *all* grammatical contexts, not just when they are uttered in isolation.

  **Step 2: The Assertion Condition**
  *   **Claim:** When a speaker utters a complex sentence containing a moral clause (e.g., "If lying is wrong..."), they do not thereby assert the moral clause itself, nor do they necessarily express the attitude (e.g., disapproval) typically associated with that clause.
  *   **Assumption:** There is a distinction between *asserting* a sentence and *entertaining* its content. In unasserted contexts, the illocutionary force (the expression of attitude) is suspended.

  **Step 3: The Principle of Univocality (Compositionality)**
  *   **Claim:** The meaning of the embedded clause ("Lying is wrong") must be the same in the complex sentence as it is when the sentence stands alone and is asserted.
  *   **Assumption:** Logic requires univocity. If the meaning of "Lying is wrong" shifts between the premise "Lying is wrong" and the antecedent "If lying is wrong," then an inference like *Modus Ponens* commits the fallacy of equivocation. For the inference to be valid, the content must be identical.

  **Step 4: The Simple Expressivist Thesis**
  *   **Claim:** The meaning of a moral term (like "wrong") consists in its use to express a non-cognitive attitude (like disapproval).
  *   **Assumption:** Semantic value is exhausted by illocutionary force. To understand the meaning is to understand what attitude is being expressed.

  **Step 5: The Conflict**
  *   **Claim:** In embedded contexts, no attitude is expressed (from Step 2). If meaning consists in expressing an attitude (from Step 4), then in embedded contexts, the clause has no meaning.
  *   **Inference:** This contradicts Step 3, which requires the clause to have the *same* meaning in embedded contexts as in asserted contexts.

  **Step 6: The Conclusion**
  *   **Claim:** Therefore, the meaning of moral terms cannot consist simply in the expression of attitudes. The meaning must be a kind of content (a proposition) that persists across asserted and unasserted contexts, capable of being true or false, regardless of whether an attitude is currently being expressed.
  *   **Implication:** Simple expressivism is false.

  ***

  ### Part II: Answers to Your Questions

  #### 1. What exactly does the sameness-of-meaning requirement demand?

  The requirement demands **semantic identity of content**.

  *   **Not just the term:** It is not enough that the word "wrong" has a dictionary definition that stays the same. The requirement applies to the *propositional content* of the clause in which the term appears.
  *   **Not just the thought (in a psychological sense):** It is not merely that the speaker is thinking about the same topic. It is that the *semantic value* contributed to the complex sentence is identical to the semantic value of the standalone sentence.
  *   **The Smallest Version:** The minimal requirement is that the **truth-conditions** (or correctness-conditions) of the antecedent must be identical to the **truth-conditions** of the asserted premise. If the antecedent means something different than the premise, *Modus Ponens* fails.
  *   **Why this yields the objection:** Expressivism traditionally denies that moral sentences have truth-conditions in the standard sense; it says they have *expression-conditions*. The argument shows that if the expression-conditions vanish in the antecedent (because no attitude is expressed there), but the truth-conditions are required for logic, the theory collapses. The content must be "assertion-independent."

  #### 2. At which step does an expressivist about moral terms come under pressure?

  The pressure lands squarely on **Step 4 (The Simple Expressivist Thesis)**.

  *   **The Target:** The argument refutes the claim that the meaning of "wrong" is *exhausted* by the act of expressing an attitude. It shows that semantic content cannot be identified with illocutionary force.
  *   **Primary vs. Secondary Use:** The argument puts pressure on the claim that the attitude is expressed *only* in the primary use. If the expressivist argues that the embedded use is secondary and derivative, they must explain how the derivative use inherits meaning without the attitude.
      *   If they say the embedded clause *also* expresses an attitude (perhaps a weaker one), they conflict with linguistic intuition (Step 2).
      *   If they say the embedded clause does *not* express an attitude, they must explain what meaning it has instead.
  *   **Refutation Scope:** The argument refutes the idea that we can define the meaning of moral terms *solely* by looking at the speech act performed in assertoric contexts. It forces the expressivist to admit a level of semantic content that is distinct from the act of expressing an attitude.

  #### 3. The "Attribution/Mode" Response (Quasi-Realism/Minimalism)

  This response attempts to save expressivism by refining the semantic machinery.

  *   **The Machinery:** The theorist posits that moral sentences *do* have propositional content (they express "thoughts" that can be true or false), but the *nature* of that content is still grounded in attitudes. When embedded, the clause contributes this propositional content to the larger sentence without the speaker expressing the attitude. The attitude is "encoded" in the content rather than "expressed" by the utterance.
  *   **Does it preserve sameness of meaning?** Yes. By granting moral sentences propositional content that persists across contexts, it satisfies the logical requirement. The antecedent and the premise share the same content.
  *   **What it buys:** It buys the right to use standard logic. It allows the expressivist to say moral sentences are truth-apt without conceding that moral properties exist in the world (they are "minimal" truths).
  *   **What it costs:** It costs the simplicity and distinctiveness of original expressivism. If moral sentences have truth-conditions and propositional content that behave exactly like descriptive sentences, the view risks becoming indistinguishable from moral realism (this is the "creeping minimalism" worry).
  *   **Verdict:** This is a **solution** to the logical problem, but it is a **relocation** of the metaphysical problem. It solves Frege-Geach by making expressivism look more like realism semantically, forcing the debate to shift to metaphysics (what *makes* the proposition true) rather than semantics (does it have content?).

  #### 4. The Two-Component (Hybrid) Analysis

  This view analyzes "Lying is wrong" as combining a descriptive belief (e.g., "Lying has property N") and an evaluative attitude (e.g., "Boo to property N").

  *   **Does it solve the problem?** Yes, formally. The descriptive component provides the propositional content needed for embedding and logic. The logic operates entirely on the descriptive element.
  *   **Does it relocate the difficulty?** Yes.
      *   **The Cost:** It ceases to be pure expressivism. The "expressive" part of the meaning becomes semantically inert regarding logic. The logic is carried by the descriptive "camouflage."
      *   **The Sense of Expressivism:** The view remains expressivist only in the sense that the *motivation* for using the term is to express an attitude, and the *full meaning* includes that attitude. However, semantically, the heavy lifting is done by the descriptive component.
      *   **New Difficulty:** It faces the "problem of moral disagreement." If I say "Lying is wrong" (Descriptive: N, Attitude: Boo) and you say "Lying is not wrong" (Descriptive: N, Attitude: Yay), we agree on the facts (Descriptive) but differ in attitude. It becomes hard to explain why this counts as a genuine *contradiction* rather than just a clash of preferences.
  *   **Verdict:** This is a **relocation**. It solves the embedding problem by smuggling in descriptivism, but it creates a new problem explaining the normative force and contradictory nature of moral disagreement.

  #### 5. Negation vs. Conditional: Same Difficulty or Different?

  They are structurally similar but pose **different shapes of difficulty**. Your sense that negation is harder is correct.

  *   **The Conditional (Embedding):** The problem here is **content persistence**. How can the clause have meaning in the antecedent if no attitude is expressed? The solution requires showing that the content exists independently of the assertion.
  *   **The Negation (Contradiction):** The problem here is **attitude inconsistency**.
      *   In descriptive logic, "P" and "Not-P" are contradictory because they cannot both be true.
      *   In expressivism, "Lying is wrong" expresses Disapproval. What does "Lying is not wrong" express?
          *   It cannot be mere absence of disapproval (that would be indifference).
          *   It cannot be Approval (that would be "Lying is good").
          *   It must be something that is *inconsistent* with Disapproval.
  *   **Why Negation is Harder:** The expressivist must define a relation between *attitudes* that mirrors the logical relation of *contradiction* between *propositions*. They must explain what it is to have a "conative commitment" that rules out another conative commitment. If they fail, they cannot explain why it is irrational to hold both "Lying is wrong" and "Lying is not wrong."
  *   **The Asymmetry:** The conditional problem asks, "What is the content?" The negation problem asks, "What is the conflict?" You can solve the content problem (by positing propositions) but still fail the negation problem (if you can't explain why holding two specific attitudes is logically forbidden rather than just psychologically difficult).

  #### 6. Expressivist Validity and Regress

  If the expressivist claims that calling an inference "valid" is itself an expression of an attitude (e.g., approval of the inference pattern), the problem does recur, but there is a proposed block.

  *   **The Regress Worry:** If "Modus Ponens is valid" just means "I approve of Modus Ponens," then why is it wrong to disapprove of it? Do we need a higher-order attitude to validate the first attitude?
  *   **The Expressivist Block:** Sophisticated expressivists (like Blackburn or Gibbard) argue that the logic of attitudes is not arbitrary. They propose a **logic of consistency for plans or commitments**.
      *   They argue that certain combinations of attitudes are *incoherent* in the same way certain combinations of beliefs are contradictory.
      *   For example, if you disapprove of lying, and you disapprove of getting your brother to lie *if* lying is wrong, you are practically committed to disapproving of getting your brother to lie. To fail to do so is a failure of rationality internal to the nature of having attitudes/plans.
  *   **Does it solve it?** It attempts to stop the regress by grounding validity in the **structural requirements of rational agency** rather than in a further attitude.
  *   **Verdict:** This is a **solution attempt** that relies on a substantive theory of rationality. It blocks the regress by claiming that the normativity of logic comes from the nature of the mental states themselves (beliefs aim at truth; intentions/plans aim at consistency), not from a further judgment about those states. However, critics argue this merely pushes the problem back to explaining why *that* specific structure of rationality is binding.
