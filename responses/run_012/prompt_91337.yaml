prompt: |-
  hey, so I'm doing this philosophy club project and I need help from someone who actually knows Hume. Please act like a Hume scholar who's also read a ton of the recent cognitive science of religion stuff. Think it through carefully, brainstorm first, and please don't give me a reading list or citations, I can find those myself.

  The question: what would Hume have made of the modern science of religion, which obviously didn't exist in his day? Here's the stuff I mean. Right now there's a big fight between two stories about why humans are religious. Story A: it's a byproduct. Our minds evolved to spot agents (rustle in the grass, better assume it's a lion), to guess what other minds are thinking, and to remember weird counterintuitive stuff, and religion just sort of falls out of those systems going about their normal business, with nobody getting any advantage from being religious. Story B: it's an adaptation. Groups with shared rituals and beliefs trusted each other and out-cooperated and out-survived groups without them, so religion got selected for. I want your prediction on which way Hume leans, if either.

  Then the bigger thing. Does explaining where a belief comes from undercut the belief? There's a whole industry now of what people call debunking arguments: if belief in God comes out of a system that's great at detecting agents but not at tracking truth, then it's more like a hiccup than a perception, and you shouldn't trust it. Would Hume run that argument? He's the guy who said religion starts in fear and ignorance of causes, but he's also the guy who in the Dialogues ends up letting a really thin kind of theism survive. Also would he be into religious naturalism, the people who want to keep the rituals and the community and the awe and drop the God part? And what would it take to prove you wrong about all this, like what would he have had to have said for you to say oops, bad prediction?

  I'm less interested in a summary of his books than in a prediction about the new stuff, with reasons, so make it clear which of his own commitments you're leaning on and which ones you have to bend a little to get to your answer.
