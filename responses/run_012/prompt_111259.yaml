                      *   Liberty (A): A decides between $O_A$ and $O_0$ (assuming B is passive/off). A prefers $O_0$. So $O_0 \succ O_A$.
                      *   Liberty (B): B decides between $O_B$ and $O_0$ (assuming A is passive/off). B prefers $O_B$. So $O_B \succ O_0$.
