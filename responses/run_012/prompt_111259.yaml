answer: |-
  # Session Plan: The Charter of the Nine Households

  **Time:** 90 Minutes
  **Students:** 18 (9 Pairs)
  **Materials:** Printed Rule Cards, Preference Cards, Ranking Forms, Stress Case Cards, Pens.
  **Stake:** The household's final outcome determines who controls the auxiliary audio (music/silence) for the first 10 minutes of the next class. (A's Playlist, B's Playlist, or Silence).

  ---

  ## I. Setup and Ratification (0:00 – 0:15)

  **1. Seating (2 mins)**
  Arrange chairs in 9 distinct clusters of two. Place a folder on each cluster containing: 2 Rule Cards, 2 Preference Cards (one marked A, one marked B), 1 Ranking Form, 2 pens.

  **2. The Pitch (3 mins)**
  *Say:* "Today we are testing a governance charter. You are nine households sharing a communal resource. Each household has a shared space that can hold exactly one item: Member A's item, Member B's item, or Neither. You have two switches. Your goal is to produce a single, coherent ranking of the three possible states for your household. If you succeed, your household wins the stake."

  **3. Rule Ratification (10 mins)**
  Do not explain the logic. Read the **Rule Card** text aloud. Ask for a vote by show of hands to adopt these as the binding "Charter."
  *   **Rule 1 (The Switch Rule):** "A member's own switch is theirs alone. If two outcomes differ only in what that member does, their preference between those outcomes settles it for the household."
  *   **Rule 2 (The Agreement Rule):** "If both members strictly prefer one outcome to another, the household prefers it too."

  *Facilitator Note:* If students ask, "What if they disagree?" or "What if it affects the other?", answer: "The rules do not cover that yet. Vote on the text as written." Ensure they vote *before* seeing their preference cards. Write the ratified rules on the board.

  ---

  ## II. The Trap (0:15 – 0:35)

  **1. Distribution (2 mins)**
  Instruct pairs to open their folders. Member A takes the card marked A; Member B takes the card marked B. They must not show cards to each other.

  **2. The Case Text (On Preference Cards)**
  *Scenario:* You share a living room wall. Only one poster can hang.
  *   **Outcome $O_A$:** A's Poster is up.
  *   **Outcome $O_B$:** B's Poster is up.
  *   **Outcome $O_0$:** Neither is up (Blank wall).

  *   **Card A (Private):** "You are modest. You feel vain having your poster up, but you dislike B's aesthetic more. Your strict ranking: **Neither > A's Poster > B's Poster.**"
  *   **Card B (Private):** "You are proud. You want your poster up, but you respect A's art more than a blank wall. Your strict ranking: **A's Poster > B's Poster > Neither.**"

  *Stake Reminder:* "Your household's final top-ranked outcome determines the music for the next class (A's choice, B's choice, or Silence)."

  **3. Form Filling (10 mins)**
  Hand out the **Ranking Form**.
  *Text:* "Based *only* on the Charter Rules and your private preferences, derive the Household's complete and transitive ranking of the three outcomes. Both members must sign. Incomplete or cyclic forms are invalid."

  *Facilitator Move:* Circulate. If a pair argues, remind them: "Apply the rules mechanically. Do not negotiate preferences."
  *Handling Indifference:* If a student says, "I don't care about the music," say: "The game requires strict preference. If you claim indifference, you must swap roles with your partner. If you still claim indifference, you are disqualified from the stake and must observe silently."

  **4. Collection (5 mins)**
  Collect all forms. Do not look at them yet. Stack them on the desk.

  ---

  ## III. The Crisis (0:35 – 0:45)

  **1. The Reveal (5 mins)**
  Pick up the stack. Flip through three or four. Frown slightly.
  *Say:* "I am seeing a problem. Most of these forms are blank. Some have cycles. According to the Charter you ratified, you should have been able to derive a ranking. Why can't you?"

  Elicit the contradiction from the class. Write the logic on the board:
  1.  **Switch Rule (A):** A prefers $O_0$ to $O_A$. $\rightarrow$ Household: $O_0 \succ O_A$.
  2.  **Switch Rule (B):** B prefers $O_B$ to $O_0$. $\rightarrow$ Household: $O_B \succ O_0$.
  3.  **Agreement Rule:** Both prefer $O_A$ to $O_B$. $\rightarrow$ Household: $O_A \succ O_B$.
  4.  **Result:** $O_B \succ O_0 \succ O_A \succ O_B$. (Cycle).

  *Say:* "The Charter is broken. It demands consistency, but it produces a contradiction. We have 40 minutes to amend the Charter."

  ---

  ## IV. The Amendment Round (0:45 – 1:15)

  **Constraints:**
  1.  **Veil of Ignorance:** You must accept the rule without knowing if you are A or B.
  2.  **Universality:** The rule applies to all 9 households.

  **Facilitator Strategy:** When students propose a fix, do not debate it. Instead, say: "Let us stress-test that." Deploy the corresponding **Stress Case Card** to a volunteer household to demonstrate the cost.

  **Repair 1: Drop the Switch Rule (Majority/Dictatorship)**
  *Proposal:* "Let's just vote. Majority rules."
  *Stress Case:* **The Tyrant Household.**
  *Text:* "Member A is indifferent between all outcomes. Member B has strong preferences. Under Majority, A's indifference breaks the tie, or A becomes the dictator by default rotation. If we drop the Switch Rule, a member with no stake can override a member with a deep stake. Is this liberty?"
  *Outcome:* Students feel the loss of personal jurisdiction.

  **Repair 2: Drop the Agreement Rule (Allow Inefficiency)**
  *Proposal:* "Ignore the Agreement Rule. Just use the Switch Rule."
  *Stress Case:* **The Mutual Loss Household.**
  *Text:* "A prefers $O_A$ to $O_B$. B prefers $O_A$ to $O_B$. Both want $O_A$. But the Switch Rule forces $O_0$ (because A vetoes $O_A$) and $O_B$ (because B vetoes $O_0$). If you drop Agreement, you can end up at $O_B$ even though *both* members prefer $O_A$. You are forcing the household to be worse off for everyone."
  *Outcome:* Students feel the cost of Pareto inefficiency.

  **Repair 3: Restrict Switch Rule to "Private" Matters**
  *Proposal:* "You only control your switch if it doesn't affect the other person."
  *Stress Case:* **The Incomplete Form Household.**
  *Text:* "In this scenario, every outcome affects both members (shared wall). If you restrict the Switch Rule to 'purely private' effects, the Switch Rule *never activates*. The Form remains blank. You have not solved the cycle; you have just silenced the rules. Who decides now? An external arbiter?"
  *Outcome:* Students realize the rule becomes vacuous in interdependent contexts.

  **Repair 4: Keep Rules, Drop Transitivity (Agenda Control)**
  *Proposal:* "Cycles are okay. Just pick one."
  *Stress Case:* **The Chair's Power Household.**
  *Text:* "If cycles are allowed, the outcome depends on the order of voting. Pair $O_A$ vs $O_B$ first? $O_A$ wins. Then $O_A$ vs $O_0$? $O_0$ wins. Pair $O_B$ vs $O_0$ first? $O_B$ wins. The person who sets the agenda controls the outcome. Is this fair?"
  *Outcome:* Students see the distributional edge of procedural power.

  **Variant: Sequence of Moves (Last 10 mins of Amendment)**
  *Proposal:* "Let them take turns. A moves first."
  *Stress Test:* "If A moves first, A chooses $O_0$ (to prevent $O_B$). If B moves first, B chooses $O_B$ (to prevent $O_0$). The 'procedure' determines the winner, not the preferences. You have replaced rights with timing."

  ---

  ## V. Debrief and Reveal (1:15 – 1:30)

  **1. Mapping the Demands (5 mins)**
  Ask the class: "What were the Charter's demands?"
  Write on board:
  1.  **Liberty:** Some things are up to you (Switch Rule).
  2.  **Efficiency:** Unanimous gains should be taken (Agreement Rule).
  3.  **Consistency:** Collective choices must make sense (Transitivity).
  4.  **Universality:** Rules work for any preference profile.

  *Ask:* "Which demand did you personally give up in the amendment round? Why was giving it up not free?"
  *Listen:* Let 3-4 students answer. (e.g., "I gave up Liberty because Efficiency seemed more important, but it felt like tyranny.")

  **2. The Name (2 mins)**
  *Say:* "You have just reconstructed a theorem proved by Amartya Sen in 1970. It is called **The Liberal Paradox**. It proves that no social decision function can satisfy Minimal Liberty, Pareto Efficiency, and Universal Domain simultaneously."

  **3. Honest Limitations (5 mins)**
  *Say:* "Be careful what you take from this.
  *   **Existence, not Universality:** We showed *one* construction defeats the charter. We did not prove *every* construction fails on *every* profile. Most of the time, in real life, people's preferences don't clash this way.
  *   **The Preference Objection:** Some of you want to say, 'Nobody actually has these preferences.' That is a valid move. You are proposing to restrict the *Domain* of the theorem. But that has a price: you must empower someone to decide which preferences are 'allowed.' That is a censorship power. The Stress Cases showed you the cost of that power.
  *   **The Lesson:** The paradox does not say liberalism is impossible. It says liberalism is *costly*. You cannot have it for free. You must trade off against efficiency or consistency. The question is not how to avoid the trade-off, but which cost you are willing to bear."

  **4. Dismissal (1 min)**
  Collect materials. No reading list. No citations.
  *Say:* "Next class, we start with the music chosen by [Randomly pick a household that submitted a form, even if invalid, or choose Silence]. Think about who chose it."

  ---

  ## VI. Facilitator's Cheat Sheet: Predictable Failures

  **1. The "Negotiation" Smuggle**
  *Prediction:* During the Form Filling phase, students will talk. "I'll let you have your poster if you let me choose the music."
  *Counter:* "The Charter forbids side-payments. You must rank the outcomes *as given*. If you trade, you are violating the Switch Rule."

  **2. The Amendment Overrun**
  *Prediction:* Students will spend 20 minutes debating one amendment (usually "Drop Transitivity").
  *Counter:* Use a timer. "You have 3 minutes to propose, 2 minutes to stress-test. Next." Move physically to the next cluster to force momentum.

  **3. The "It's Just a Game" Defense**
  *Prediction:* In debrief, a student will say, "This is artificial. In reality, we'd just talk."
  *Counter:* "Talking is a procedure. Who gets to speak first? Who has veto power? That is the Amendment Round you just played. You are assuming a 'talking' solution without analyzing its rules. We just analyzed the rules."

  **4. The Indifference Defection**
  *Prediction:* A student claims, "I don't care about the poster."
  *Counter:* Enforce the protocol. "Swap roles. If you still don't care, you are an observer." Do not allow them to sit out comfortably; make them watch the others struggle.

  **5. The "Unanimity" Misinterpretation**
  *Prediction:* Students think Agreement Rule means "Both must agree to change."
  *Counter:* Clarify: "It means if both *prefer* X to Y, the Household *ranks* X above Y. It is a ranking constraint, not a veto."

