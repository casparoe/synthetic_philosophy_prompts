                  *   Sen's Logic: A is decisive over {A-up, Neither}. B is decisive over {B-up, Neither}.
                  *   Prompt's Liberty Rule: "if two outcomes differ only in what that member does..."
                  *   If A puts their item up, that's A's action. If B puts their item up, that's B's action.
                  *   If the space holds only one, they are mutually exclusive.
                  *   To make the paradox work:
                      *   A is decisive over $\{O_A, O_0\}$. (A prefers $O_0$ to $O_A$). So Household must rank $O_0 \succ O_A$.
                      *   B is decisive over $\{O_B, O_0\}$. (B prefers $O_B$ to $O_0$). So Household must rank $O_B \succ O_0$.
                      *   Pareto: Both prefer $O_A$ to $O_B$. (A: $O_A \succ O_B$, B: $O_A \succ O_B$). So Household must rank $O_A \succ O_B$.
                      *   Cycle: $O_B \succ O_0 \succ O_A \succ O_B$.
