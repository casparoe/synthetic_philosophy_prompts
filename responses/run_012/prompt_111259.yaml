              *   A's prefs: $O_0 \succ_A O_A \succ_A O_B$.
              *   B's prefs: $O_A \succ_B O_B \succ_B O_0$.
              *   *Liberty Application:*
                  *   A controls whether $O_A$ happens vs $O_0$ (assuming "switch" means deciding their own item). Actually, the prompt says "private switch per member" and "space holds only one". This needs careful modeling.
                  *   Standard Sen setup: Person 1 decides between reading/not reading a book. Person 2 decides between reading/not reading.
                  *   Prompt setup: "Shared space holds only one." "A's item up... B's up... Neither."
                  *   Liberty Rule definition in prompt: "if two outcomes differ only in what that member does, their preference between those outcomes settles it for the household."
                  *   This implies A decides between (A-up) and (Neither) *if* B's status is constant? Or does A decide between (A-up) and (B-up)?
