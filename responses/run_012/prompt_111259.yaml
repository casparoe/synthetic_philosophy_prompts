  ## VII. Materials Text (For Printing)

  **Rule Card**
  > **THE CHARTER**
  > 1. **The Switch Rule:** A member's own switch is theirs alone. If two outcomes differ only in what that member does, their preference between those outcomes settles it for the household.
  > 2. **The Agreement Rule:** If both members strictly prefer one outcome to another, the household prefers it too.
  > *Vote to Ratify:* [ ] Yes [ ] No

  **Ranking Form**
  > **HOUSEHOLD DECISION FORM**
  > Outcomes: A-Up ($O_A$), B-Up ($O_B$), Neither ($O_0$)
  > Rank 1 (Best): _______
  > Rank 2: _______
  > Rank 3 (Worst): _______
  > *Declaration:* We certify this ranking is derived solely from the Charter and our private preferences. It is complete and transitive.
  > Signatures: _________________ _________________

  **Stress Case Card (Tyrant)**
  > **STRESS TEST: DROPPING SWITCH RULE**
  > Member A: Indifferent between all outcomes.
  > Member B: Strongly prefers $O_A$.
  > Result: Under Majority/Dictatorship, A's indifference or random assignment overrides B's strong preference.
  > Question: Is it liberal to let the indifferent rule the passionate?

  **Stress Case Card (Mutual Loss)**
  > **STRESS TEST: DROPPING AGREEMENT RULE**
  > Member A: Prefers $O_A$ to $O_B$.
  > Member B: Prefers $O_A$ to $O_B$.
  > Result: Switch Rule forces $O_0$ and $O_B$. Household ends at $O_B$.
  > Question: Is it rational to choose an outcome both members hate when one both love is available?

  **Stress Case Card (Incomplete)**
  > **STRESS TEST: RESTRICTING SWITCH RULE**
  > Constraint: Switch Rule applies only if the outcome does not affect the other member.
  > Context: Shared wall (all outcomes affect both).
  > Result: Switch Rule never activates. Form remains blank.
  > Question: Who fills the gap? An external dictator?

  **Stress Case Card (Agenda)**
  > **STRESS TEST: DROPPING TRANSITIVITY**
  > Cycle: $O_B \succ O_0 \succ O_A \succ O_B$.
  > Procedure: Pairwise voting.
  > Result: If Chair pairs ($O_A, O_B$) first, $O_0$ wins. If Chair pairs ($O_B, O_0$) first, $O_B$ wins.
  > Question: Is justice determined by the order of the vote?
