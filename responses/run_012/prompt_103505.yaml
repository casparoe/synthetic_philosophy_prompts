answer: |-
  1. The lineage view treats species as historical individuals with unique origins and endpoints, whereas the HPC view treats them as natural kinds defined by recurring property clusters. This means the first sees species as concrete particulars, while the second sees them as abstract classes grounded by causal mechanisms.
  2. For asexual organisms, the lineage segment view easily identifies clones as distinct lineages, but the HPC view struggles to find the homeostatic mechanism like recombination that binds traits together. Consequently, the individual view accommodates asexuality better than the kind view, which relies on trait cohesion mechanisms often absent in clones.
  3. Microbes trading genes sideways blur lineage boundaries, challenging the segment view's clean branching structure, while the HPC view can accommodate shared traits regardless of vertical descent. However, excessive HGT dissolves the property clusters too, leaving both views struggling to define discrete units in prokaryotes.
  4. Ring species break the lineage view because the segment connects back on itself without clear breakpoints, yet they also frustrate the HPC view because trait clusters grade continuously without sharp boundaries. Both frameworks fail to carve nature at its joints here, though the lineage view at least acknowledges the continuous spatiotemporal connection.
  5. Ultimately, the lineage view owes us a metaphysics of particulars where concepts are mere detection tools, while the HPC view owes us an explanation of the causal mechanisms that stabilize trait bundles. When pressed, the first prioritizes historical continuity, whereas the second prioritizes observable similarity and underlying cohesion.
