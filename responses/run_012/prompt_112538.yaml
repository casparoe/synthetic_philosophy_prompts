answer: |-
  ### Brainstorming: Loci of Badness and the Pressure of Asymbolia

  Before constructing the instrument, we must map the logical space. Pain asymbolia (sensation without suffering) exerts pressure on the **Sensory-Discriminative** locus: if the sensory quality remains but the badness vanishes, the sensory quality alone cannot constitute the badness. This pushes us toward the **Affective-Motivational** locus (the "unpleasantness"). However, asymbolia also challenges the **Conative** locus (desire/aversion): if the patient feels no urge to stop it, is the desire essential to pain? Furthermore, it raises the **Welfare** question: if the patient doesn't mind, is their well-being actually lowered? Finally, it invites **Deflationary** responses: if the connection between pain and badness is breakable, is "pain is bad" a necessary truth at all?

  **Candidate Loci:**
  1.  **Sensory Quality:** The raw feel (sharp, burning). *Pressure:* Asymbolia retains this without badness.
  2.  **Hedonic Tone:** The intrinsic unpleasantness. *Pressure:* Is this separable from sensation?
  3.  **Conative Attitude:** The desire for it to stop. *Pressure:* Is this part of the experience or a reaction?
  4.  **Imperative Content:** The command to protect. *Pressure:* Asymbolics ignore the command; does the command persist?
  5.  **Evaluative Representation:** The representation of damage as bad. *Pressure:* Do asymbolics represent damage as bad?
  6.  **Welfare Impact:** The reduction of well-being. *Pressure:* Can pain exist without welfare loss?

  ***

  ### Decision Instrument: The Axiology of Pain Tree

  **Starting Commitment:** You accept Pain Asymbolia as a real clinical phenomenon (patients report sensation without suffering or aversion).

  **Node 1: The Classification Question**
  Consider the asymbolic patient's state. Does the term "pain" refer essentially to the *sensory detection* of noxious stimuli, or essentially to the *negative impact* (suffering/aversion) of that detection?
  *   **(A) Essentially Negative Impact:** Go to **Leaf 1**.
  *   **(B) Essentially Sensory Detection:** Go to **Node 2**.

  **Node 2: The Welfare Distinction**
  When we assert "pain is bad," are we asserting that pain necessarily reduces the *subject's* well-being (welfare), or that it instantiates a normative property that might exist even if the subject is indifferent?
  *   **(A) Necessarily Reduces Welfare:** Go to **Node 3**.
  *   **(B) Instantiates Normative Property (Independent of Welfare):** Go to **Node 9**.

  **Node 3: The Phenomenal Unity Question**
  In a standard, non-asymbolic painful experience, does the sensory detection and the negative valence present as a single, unified quality, or as two distinct components that merely coincide?
  *   **(A) Single Unified Quality:** Go to **Node 4**.
  *   **(B) Two Distinct Components:** Go to **Node 5**.

  **Node 4: The Sensory Normativity Question**
  If unified, is the sensory quality itself intrinsically aversive (the "sharpness" *is* the "badness"), or does it derive its aversiveness from a separate conative state (desire) that is nonetheless experienced as unified?
  *   **(A) Intrinsically Aversive:** Go to **Leaf 2**.
  *   **(B) Derives from Conative State:** Go to **Leaf 3**.

  **Node 5: The Locus of Valence Question**
  If distinct, does the negative component feel like a *hedonic quality* (a raw feel of unpleasantness) or like an *imperative content* (a command or demand to act)?
  *   **(A) Hedonic Quality:** Go to **Node 6**.
  *   **(B) Imperative Content:** Go to **Leaf 4**.

  **Node 6: The Hedonic Nature Question**
  Is this hedonic quality a primitive, non-representational property of experience (a "raw feel"), or does it consist in the experience *representing* something as being a certain way?
  *   **(A) Primitive Property:** Go to **Leaf 5**.
  *   **(B) Representational:** Go to **Node 7**.

  **Node 7: The Representational Content Question**
  If representational, does the experience represent *bodily damage as objectively bad*, or does it represent *the subject's own desire* for the experience to cease?
  *   **(A) Damage as Objectively Bad:** Go to **Leaf 6**.
  *   **(B) Subject's Desire:** Go to **Node 8**.

  **Node 8: The Desire Relation Question**
  If the content is the subject's desire, is that desire *constitutive* of the pain experience (part of what it is), or is it a separate mental state *caused* by the pain?
  *   **(A) Constitutive:** Go to **Leaf 7**.
  *   **(B) Caused (Separate State):** Go to **Leaf 8**.

  **Node 9: The Impersonal Badness Question**
  (From Node 2B). If pain's badness is not tied to welfare, is this "badness" a real, mind-independent normative property, or is the question "is pain bad?" conceptually confused or empty in this context?
  *   **(A) Real Normative Property:** Go to **Leaf 9**.
  *   **(B) Conceptually Confused/Empty:** Go to **Leaf 10**.

  ***

  ### Positions (Leaves)

  **Leaf 1: Pain Revisionism**
  *   **Position:** Asymbolic patients do not feel pain; "pain" essentially includes suffering.
  *   **Awkward Commitment:** Must explain why patients sincerely use the word "pain" and exhibit sensory discrimination identical to painful states.

  **Leaf 2: Sensory Intrinsicism**
  *   **Position:** The sensory quality itself is intrinsically normative; to feel the quality is to feel the badness.
  *   **Awkward Commitment:** Must explain how asymbolics feel the quality without the badness, implying the quality changed or the report is false.

  **Leaf 3: Conative Phenomenal Unity**
  *   **Position:** Pain is unified, but the unity is constituted by an intrinsic desire; asymbolia is the loss of this desire.
  *   **Awkward Commitment:** Struggles to explain how a desire can be phenomenally indistinguishable from a sensation yet separable via lesion.

  **Leaf 4: Imperativism**
  *   **Position:** Pain's badness consists in its issuing a commanding content (e.g., "Protect this body part").
  *   **Awkward Commitment:** Must account for pain's motivational power without reducing it to a mere belief-like command that can be ignored without loss of pain.

  **Leaf 5: Hedonic Qualia Realism**
  *   **Position:** Pain contains a primitive, non-representational "hurt" quality that is intrinsically bad.
  *   **Awkward Commitment:** Commits to the existence of irreducible normative qualia that resist functional or representational analysis.

  **Leaf 6: Strong Evaluativism**
  *   **Position:** Pain represents bodily damage as objectively bad; badness is in the accuracy conditions of the experience.
  *   **Awkward Commitment:** Risks conflating the *representation* of badness with the *fact* of badness (the "problem of perceptual error").

  **Leaf 7: Conative Phenomenalism**
  *   **Position:** Pain is an experience that includes an intrinsic desire for its own cessation.
  *   **Awkward Commitment:** Faces the "direction of fit" problem: experiences usually match the world, but desires try to change it.

  **Leaf 8: Desire-Based Extrinsicism**
  *   **Position:** Pain is a neutral sensation that becomes bad only because it causes a separate, contingent desire to stop.
  *   **Awkward Commitment:** Makes pain's badness contingent; a masochist or asymbolic would feel pain that is not bad at all.

  **Leaf 9: Impersonal Normative Realism**
  *   **Position:** Asymbolic pain is genuinely bad (a normative fact) even if it harms no one's welfare.
  *   **Awkward Commitment:** Posits "free-floating" badness that makes no difference to any subject's interests or reasons for action.

  **Leaf 10: Deflationary Error Theory**
  *   **Position:** The claim "pain is bad" presupposes a necessary link that asymbolia breaks; the question is empty or systematically false.
  *   **Awkward Commitment:** Must explain the pervasive intuition that pain *must* be bad without appealing to a truth-maker.

  ***

  ### Logical Gaps and Unoccupied Combinations

  *   **Sensory Intrinsicism + Impersonal Badness (Node 4A + Node 2B):** *Unoccupied.* This combination suggests the sensory quality is intrinsically bad but not bad for the subject. *Diagnosis:* **Incoherent.** If the badness is intrinsic to the *sensation felt by the subject*, it is difficult to conceptualize how it fails to impact the subject's welfare.
  *   **Imperativism + Deflationism (Node 5B + Node 9B):** *Unoccupied.* *Diagnosis:* **Merely Unattractive.** One could argue commands are linguistic confusions, but Imperativists typically argue commands are real mental contents.
  *   **Desire-Based Extrinsicism + Impersonal Badness (Node 8B + Node 2B):** *Unoccupied.* *Diagnosis:* **Unexplored.** This would claim pain causes a desire, and the badness is an impersonal fact about that desire. It is logically possible but lacks a proponent.

  ### Indistinguishable Leaves

  *   **Leaf 5 (Hedonic Qualia Realism) and Leaf 6 (Strong Evaluativism):** The tree cannot empirically separate these. A "primitive hurt feel" and a "representation of damage as bad" may be phenomenologically identical from the first-person perspective. The distinction is metaphysical, not diagnostic via introspection alone.
  *   **Leaf 7 (Conative Phenomenalism) and Leaf 8 (Desire-Based Extrinsicism):** The line between a desire *constitutive* of experience and a desire *caused* by experience is notoriously thin. If the desire is immediate and automatic, the distinction may be merely theoretical.

  ***

  ### Epistemic Note

  I am least confident in **Node 3 (Phenomenal Unity)** and **Node 8 (Desire Relation)**. The phenomenological distinction between a "unified" experience and "distinct components" is notoriously unstable under introspection; many subjects report unity where philosophers posit distinction (and vice versa). Similarly, the boundary between a constitutive desire and a causal desire (Node 8) may be a distinction without a difference in terms of observable psychology or welfare impact.

  I suspect **Leaf 9 (Impersonal Normative Realism)** does the most violence to the position it names. Few philosophers explicitly argue for "badness without a subject," yet the logical space requires it to capture non-welfarist realism. It is likely a "straw" position created by the tree's binary logic rather than a held view.

  Finally, the discovery of **asymbolic patients who exhibit physiological stress responses (e.g., cortisol spikes, autonomic arousal) without reporting suffering** would force me to redraw **Node 2**. If the body "minds" even when the subject does not, the "Bad For Subject" vs. "Bad For Organism" distinction would collapse the Welfare node, requiring a new branch for Biological Normativity.
