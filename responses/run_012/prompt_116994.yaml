  Your current principle, **P**, captures the contractualist spirit of your reasoning but fails to distinguish between **ex-ante policy decisions** (involving risk and statistical lives) and **ex-post allocation decisions** (involving identified victims and certain harms). It also lacks a distinction between **quantitative differences within a single good** (e.g., years of life) and **qualitative differences between goods** (e.g., life vs. sight).

  To accommodate your verdicts, **P** must be repaired into a more specific principle, **P\***. However, even **P\*** cannot coherently accommodate all seven verdicts. The tension lies between your absolute lexical priority in Case 3 and your admitted threshold in Case 6.

  ### The Repaired Principle (P*)

  **P\*** consists of the following clauses, each forced by a specific case:

  1.  **The Ex-Post/Ex-Ante Distinction:**
      *   *Clause:* In **ex-ante policy decisions** (where risks are imposed reciprocally on a population), aggregation of benefits and risks is permissible even across different categories of harm, provided the risk to any individual is small and the benefit is widespread. In **ex-post allocation decisions** (where harms and benefits are certain and assigned to identified individuals), aggregation is restricted.
      *   *Forced by:* **Case 7** (Vaccine). This case forces the permission to trade a certain ex-post death for widespread ex-ante benefit, which contradicts the ex-post rule in Case 3. Without this clause, Case 7 is indefensible under contractualism.

  2.  **The Currency Rule (Ex-Post):**
      *   *Clause:* In ex-post allocation, aggregation is permitted only when the competing claims involve the **same currency of good** (e.g., life-years vs. life-years). When claims involve **different currencies** (e.g., life vs. sight), lexical priority applies: the higher-order good (life) cannot be traded for any quantity of the lower-order good.
      *   *Forced by:* **Case 2** (Life-years) and **Case 3** (Life vs. Blindness). Case 2 forces the permission to aggregate time (40 years > 25 years). Case 3 forces the prohibition on aggregating severity (1 life > 300 sight). Without this distinction, Cases 2 and 3 are contradictory.

  3.  **The Constraint on Imposition:**
      *   *Clause:* No individual may be actively used as a means or subjected to severe harm as a side effect to benefit others, unless the harm is trivial or the number of lives saved is catastrophic.
      *   *Forced by:* **Case 4** (Marrow) and **Case 5** (Blood). These establish that there is a constraint against imposing harm on bystanders, but that this constraint has a threshold (bruising is permissible; permanent disability is not).

  4.  **The Threshold Admission:**
      *   *Clause:* The constraint against imposing severe harm (Clause 3) can be overridden by a sufficiently large number of lives saved, though this threshold is high.
      *   *Forced by:* **Case 6** (Shaft). You admit that "at some larger number... I would stop refusing." This forces the principle to allow aggregation in extreme collateral damage cases, distinguishing it from the lexical rule in Case 3.

  ### Implications for Unlisted Cases

  **The Temporary Paralysis Case:**
  *Scenario:* A policy leaves one person permanently paralyzed but restores her completely within the year (net loss: one year of paralysis).
  *   **Verdict:** **Permitted.**
  *   **Reasoning:** This falls under the **Ex-Ante Policy Distinction (Clause 1)**. Like the vaccine in Case 7, this is a policy decision where the harm is temporary and fully restorative. The justification is not that the harm "was never what mattered," but that **ex-ante reasonable rejectability** is satisfied: from the perspective of the person before the policy is adopted, the certainty of restoration within a year makes the risk acceptable given the savings. It is the **ex-ante structure**, not the undoing of the harm, that does the moral work. If this were an ex-post choice to paralyze one identified person for a year to save resources, Clause 3 might forbid it depending on the "triviality" threshold.

  ### The Verdict That Must Go

  Despite these repairs, **P\*** cannot accommodate all seven verdicts. You must give up the **instinctive refusal in Case 6**.

  **Incompatible Verdict:** **Case 6 (The Shaft).**
  *   **Reason:** Your verdict in Case 3 ("Death outranks blindness, *however many*") establishes a **lexical priority** for life over lesser harms in ex-post rescue scenarios. Your verdict in Case 6 admits a **threshold** ("at some larger number I would stop refusing").
  *   **The Contradiction:** If Life is lexically superior to Blindness (Case 3), and Life is superior to Paralysis, then 5,000 Lives should lexically outweigh 1 Paralysis. Your instinct to *refuse* at 5,000 contradicts the lexical priority you uphold in Case 3. Conversely, if you maintain the threshold in Case 6 (admitting aggregation is possible), you undermine the "however many" claim in Case 3.
  *   **Resolution:** Given that you explicitly state you "cannot defend the number" in Case 6, whereas you are definitive in Case 3 ("however many"), coherence requires you to align Case 6 with the lexical priority of Case 3. You should either **authorize the blast** (acknowledging 5,000 lives crosses the catastrophic threshold) or **refuse always** (maintaining lexical constraint). Your current position (Refuse at 5,000, but Authorize at *some* number) is the unstable element. To fit the principle derived from your firmer convictions (1, 2, 3, 4, 5, 7), you must accept that **5,000 lives is sufficient to override the constraint against collateral paralysis**, or admit that Case 3's "however many" was too strong. The former is more consistent with Case 7's scale.

  **Plain Statement:** The principle cannot accommodate your **instinct to refuse the blast in Case 6** while maintaining the lexical priority of life in Case 3 and the aggregation in Case 7. You must authorize the blast.
