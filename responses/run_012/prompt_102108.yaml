answer: |-
  **Scenario**

  Elena is a mid-level program manager at a large non-profit housing agency facing a \$2 million deficit. Agency policy states that if department heads collectively propose at least \$1 million in voluntary budget cuts, an automated system will eliminate the "Community Outreach" program; if they propose less, the Executive Director will manually eliminate the program anyway to meet the deficit. The Outreach program's elimination will seriously harm vulnerable tenants who rely on its services. Elena's department controls \$50,000 of the budget. In **Sub-case A**, other managers have already proposed \$1.05 million in cuts; Elena submits a form proposing her \$50,000, which is logged anonymously in the aggregate total. In **Sub-case B**, other managers have proposed \$950,000; Elena submits her \$50,000, bringing the total to exactly \$1 million, triggering the automated elimination. In both sub-cases, the Outreach program is eliminated, the harm occurs, and Elena's individual submission is never detected or singled out.

  ***

  **Analysis**

  **(a) Theoretical Verdicts**
  **Actual-Consequences Act Utilitarianism (AU)** verdicts Elena's action as **morally neutral (permissible)** in both sub-cases. Since the harm (the program's elimination) occurs whether or not Elena submits her form, her action produces no net negative utility. The causal chain leading to the harm is overdetermined by the Executive Director's backup mandate; thus, her token act changes nothing in the world's state of affairs.
  **Complicity-Based Deontology (or Collective Responsibility)** verdicts Elena's action as **wrong in Sub-case B but permissible in Sub-case A**. In Sub-case B, Elena is a necessary member of the *minimally sufficient set* of human agents that triggers the harm via the primary institutional mechanism. By contributing to this specific set, she becomes complicit in the collective agency that destroys the program, even if a backup cause existed. In Sub-case A, she is merely a "hanger-on" to a sufficient set already formed by others; she does not join the specific collective will that executes the harm, but merely adds noise to an already decisive coalition.

  **(b) The Differentiating Feature**
  The single feature distinguishing the sub-cases is **membership in the Minimally Sufficient Set (MSS) of human causes**. In Sub-case B, Elena's contribution is essential to the sufficiency of the *managerial group's* action, whereas in Sub-case A, it is not. If this feature is removed (i.e., if we ignore whether she is part of the MSS and look only at the final outcome), the disagreement vanishes: both theories would agree the action is permissible because the outcome is identical. The disagreement exists solely because the Complicity account assigns moral weight to the *structure of agency* rather than just the *state of the world*.

  **(c) The Permissive Attack**
  A defender of the permissive verdict (AU) would attack the case by arguing that **moral significance cannot attach to metaphysical distinctions without causal power**. They would claim that calling Elena "complicit" in Sub-case B is an empty label if her absence would not have saved the program. The attack succeeds if one accepts the premise that morality is exclusively about making the world better; if the world is identical in both counterfactual scenarios (Elena acts vs. Elena abstains), then praising or blaming her is fetishizing causal history over human welfare. However, the attack fails if one accepts that morality also governs the integrity of the agent's will and their relationship to collective intentions, regardless of external overdetermination.

  **(d) The Inefficacy Objection**
  This case shows that the inefficacy objection **needs a more precise formulation**. The crude formulation ("If an action makes no difference to the harm, it is not wrong") is false, as it cannot account for the intuitive moral difference between Sub-case A and Sub-case B. A more precise formulation would be: **"If an action makes no difference to the harm *and* the agent is not a necessary member of the minimally sufficient set of human causes actualizing that harm, that action is not wrong."** This refined objection concedes ground in Sub-case B (acknowledging complicity matters) while retaining its force in Sub-case A (the true target of the inefficacy worry), thereby saving the intuition that pure redundancy exculpates, without denying responsibility in threshold cases where backup causes exist.
