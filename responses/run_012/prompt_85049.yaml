prompt: |-
  I'm defending a thesis chapter at a political theory workshop in three weeks and I need a Q&A prep sheet. The room is not my crowd: two civic republicans who work on non-domination and think of membership in a self-governing body as the thing that protects you from arbitrary power, a couple of people who've spent years defending the all-subjected principle against the all-affected interests principle, one EU constitutional law person who cares about citizenship doctrine and whether any of this is implementable, and one comparative politics person who thinks the whole boundary problem is philosophy fiat and that real demos boundaries get settled by history and violence. Nobody there needs me to explain what the boundary problem is; I'm the only one who works on it.

  My claim is that the demos for any given decision should be set by a rebuttable presumption of inclusion. Start with everyone causally affected by the decision. The currently enfranchised may narrow that set only if they can pass what I'm calling a decision-integrity test -- roughly, that including the excluded group would make the procedure unable to reach a stable outcome, or would let one group hold the rest hostage. Burden of proof sits on exclusion, and every exclusion carries a sunset clause: it has to be re-justified each cycle by whoever wants to keep it. I argue this beats all-affected (indeterminate scope, recursive, ends up giving you the whole world for any decision) and beats all-subjected (under-inclusive once you're dealing with externalities, climate, commuters, downstream users). And I've got a bootstrap answer to the self-application problem: the rule can't be adopted by the demos it defines, so legitimacy has to come from revisability rather than from origin, and the starting point is just whatever demos you inherited historically.

  So: what will I actually get from this room? Put the objections in their vocabularies, not mine -- the republicans will say it differently than the all-subjected people will. Order them by how likely they are times how much damage they do, give me a two-minute reply to each, and flag where the reply is soft so I don't walk into it unprepared. Tell me what to concede up front and what to hold. Include the question I'm hoping nobody asks.

  And please dont do the thing where you present three possible readings and let me choose. Take a position: tell me straight which objection actually sinks the paper, and give me your verdict on whether the bootstrap move works or whether my rebuttable presumption is just inherited power wearing a procedural hat. If you think the sunset clause is a fig leaf, say so and say why.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Request:**
      *   **User:** A political theorist defending a thesis chapter on the "boundary problem" (who constitutes the *demos*).
      *   **Context:** Workshop in 3 weeks. Audience is hostile/skeptical/specialized.
      *   **Audience Composition:**
          *   2 Civic Republicans (non-domination, self-governing membership).
          *   2 All-Subjected Principle (ASP) defenders (vs. All-Affected Interests Principle, AAIP).
          *   1 EU Constitutional Lawyer (citizenship doctrine, implementability).
          *   1 Comparative Politician (boundaries are history/violence, not philosophy).
      *   **User's Claim:** Rebuttable presumption of inclusion (start with all causally affected). Exclusion requires passing a "decision-integrity test" (stability/hostage-taking). Burden of proof on exclusion. Sunset clauses on exclusions.
      *   **User's Arguments:** Beats AAIP (indeterminate/recursive), beats ASP (under-inclusive on externalities). Bootstrap answer: legitimacy from revisability, not origin. Start with inherited demos.
      *   **Constraints:**
          *   No "choose your own adventure" (take a position).
          *   Order objections by likelihood $\times$ damage.
          *   Two-minute replies.
          *   Flag soft spots.
          *   What to concede vs. hold.
          *   Include the "hope nobody asks" question.
          *   **Crucial:** Tell me straight which objection sinks the paper and verdict on the bootstrap move/sunset clause.

  2.  **Deconstruct the Theory & Audience Match-ups:**

      *   *The Theory:* It's a hybrid. It starts with AAIP (causally affected) but adds procedural constraints (integrity test) and temporal constraints (sunset). It tries to solve the "who decides who decides" problem via revisability.
      *   *Civic Republicans:* Will hate the "causally affected" starting point. For them, membership is about *status* and *protection from domination*, not causal impact. They worry about *agency*, not just impact.
      *   *ASP Defenders:* Will attack the "causally affected" starting point as too broad (AAIP creep). They argue subjection to law/coercion is the only clean cut. They will worry about the "integrity test" being a loophole for the incumbent demos to exclude.
      *   *EU Lawyer:* Will ask about legal certainty, citizenship status, and the administrative burden of constant re-justification (sunset clauses).
      *   *Comp Pol Person:* Will dismiss the normative framework entirely. "You're rationalizing violence."

  3.  **Identify the Fatal Flaw (Taking a Position):**
      *   *The Bootstrap/Revisability Move:* The user admits the rule can't be self-applied. They rely on "revisability" for legitimacy.
      *   *The Problem:* If the starting point is an "inherited demos" (historical accident/violence), and the burden of proof is on *exclusion*, the incumbent group holds all the cards. They define the "decision-integrity test." They judge whether including outsiders causes "hostage-taking."
      *   *Verdict:* The **Civic Republican/ASP coalition** on the *power to define the integrity test* is the sinker. The "rebuttable presumption" is structurally biased toward the status quo because the status quo administers the test. The sunset clause helps, but if the criteria for exclusion remain vague ("stability"), the incumbents can always claim instability.
      *   *Bootstrap Verdict:* It doesn't fully work. It masks inherited power as procedural neutrality.

  4.  **Drafting the Objections (in their vocabularies):**

      *   *Objection 1 (The Sinker):* The Incumbent Veto (ASP/Republican overlap). Who judges the "integrity test"?
      *   *Objection 2:* Non-Domination vs. Causal Impact (Republicans). Being affected isn't being dominated.
      *   *Objection 3:* Legal Certainty/Administrative Nightmare (EU Lawyer). Sunset clauses on citizenship/voting rights?
      *   *Objection 4:* The Realist Smackdown (Comp Pol). This is just post-hoc rationalization of borders drawn by war.

  5.  **Developing Replies & Flagging Soft Spots:**

      *   *Reply 1:* Need to externalize the test or make it judicial? (Soft spot: who watches the watchmen?)
      *   *Reply 2:* Distinguish impact from domination, but argue impact creates vulnerability. (Soft spot: commuters aren't dominated in the republican sense).
      *   *Reply 3:* Frame sunsets as legislative review, not individual status review. (Soft spot: still unstable).
      *   *Reply 4:* Concede history but argue philosophy guides *reform*.

  6.  **Strategy for Concessions:**
      *   *Concede:* The bootstrap isn't a magic origin story. The "integrity test" needs external metrics.
      *   *Hold:* The burden of proof *must* stay on exclusion. AAIP is the right *starting* point, even if not the ending point.

  7.  **The "Hope Nobody Asks" Question:**
      *   It needs to cut to the core of the "integrity test." Something like: "If the incumbent demos decides whether an outsider threatens stability, isn't that the definition of arbitrary power?"

  8.  **Refining the Tone:**
      *   Direct, strategic, slightly harsh (as requested: "tell me straight").
      *   No waffling.
      *   Focus on the 3-week timeline (actionable prep).

  9.  **Review against Constraints:**
      *   Did I choose a position? Yes (Bootstrap is weak, Integrity Test is the sinker).
      *   Did I use their vocabularies? Yes (Domination, Coercion, Legal Certainty, Path Dependence).
      *   Did I flag soft spots? Yes.
      *   Is the sunset clause critiqued? Yes.

  10. **Final Polish:** Organize into the requested format (Verdict first, then Q&A sheet). Ensure the distinction between ASP and Republicans is clear (ASP = coercion/law, Republicans = status/domination).

  *(Self-Correction during drafting)*: I initially thought the Comp Pol person was the biggest threat. But in a theory workshop, realists are usually dismissed as "missing the point." The *normative* theorists (Republicans/ASP) are the ones who can actually dismantle the argument on its own terms. The "Incumbent Veto" is the theoretical killer. I will prioritize that. The EU lawyer is the practical killer. I need to balance them.

  *(Refining the Bootstrap Verdict)*: The user asks if the rebuttable presumption is "inherited power wearing a procedural hat." I need to answer that directly. Yes, it is, unless the integrity test is objective. Since "stability" is subjective, it *is* inherited power. I must tell them this.

  *(Final check on "Sunset Clause")*: Is it a fig leaf? Yes, if the criteria for renewal aren't strict. I need to explain *why* it's a fig leaf (incumbents control the renewal criteria).

  Okay, ready to write.cw
answer: |-
  ### The Verdict

  **Does the bootstrap move work?**
  No. Not as currently constructed. You are correct to worry that your rebuttable presumption is "inherited power wearing a procedural hat." By starting with the historically inherited demos and placing the burden of proof on exclusion, you hand the keys to the people currently inside the walls. They define what counts as "decision-integrity." They decide what constitutes "hostage-taking." Unless you have an external arbiter for the integrity test (which you haven't specified), your mechanism legitimizes the status quo under the guise of procedural fairness.

  **Which objection sinks the paper?**
  The **Incumbent Veto**. This is the overlap between the All-Subjected defenders and the Civic Republicans. They will argue that giving the *existing* demos the power to judge whether *new* members threaten "stability" is the definition of arbitrary power. It violates non-domination (Republicans) and creates a circular justification for coercion (ASP). If you cannot solve who adjudicates the integrity test, the theory collapses into a justification for current borders.

  **Is the sunset clause a fig leaf?**
  Yes. If the criteria for re-justification are the same as the initial exclusion (stability/integrity), the incumbents will simply re-assert the same claim every cycle. A sunset clause without a shifting burden of proof or an external review mechanism is just administrative friction, not a safeguard.

  ---

  ### Q&A Prep Sheet

  **Ordering:** Likelihood $\times$ Damage.
  **Time:** 2-minute replies max.
  **Key:** 🚩 = Soft Spot (Do not bluff here).

  #### 1. The Incumbent Veto (ASP & Republican Coalition)
  **The Objection:** "You place the burden of proof on exclusion, but you give the *existing* demos the power to judge whether that exclusion is justified via the 'integrity test.' If the incumbent group decides that including outsiders creates 'instability' or 'hostage-taking,' they are effectively vetoing their own dilution. Isn't this just giving the dominant group a normative veto over their own boundaries? How is this different from the all-subjected principle, where the coercer defines the coerced?"

  **The Reply:**
  "You're right that if the incumbents are the sole judges, the test is circular. That's why the integrity test must be tied to *procedural metrics*, not political preferences. We aren't asking 'Will these people vote for us?' but 'Will the decision rule mathematically fail?'—e.g., cyclical majorities or single-issue vetoes that paralyze the system.
  However, I concede I need an external adjudicator for this test. In a domestic context, that's a constitutional court. In a transnational context, it requires a higher-order treaty body. The burden of proof is on exclusion, but the *evidence* must be objective, not subjective. The sunset clause forces them to produce new evidence of instability, not just re-assert old fears."

  **🚩 Soft Spot:** You haven't specified who adjudicates the test. If you say "courts," the EU lawyer will ask which ones. If you say "international body," the Comp Pol person will laugh.
  **Strategy:** Concede the need for an external arbiter. Pivot to the fact that *current* systems have no test at all.

  #### 2. The Non-Domination Challenge (Civic Republicans)
  **The Objection:** "You start with 'causally affected.' But being affected isn't being dominated. A commuter is affected by traffic laws; a citizen is subject to arbitrary power if they lack a voice. By focusing on causal impact, you confuse *interest* with *status*. If I can be excluded because my inclusion threatens 'integrity,' I remain vulnerable to your will. That is the definition of domination, regardless of your sunset clause."

  **The Reply:**
  "I agree that impact alone doesn't grant full membership status. My claim is narrower: impact grants a *presumption* of voice, which can only be overridden by systemic necessity, not arbitrary will.
  The 'integrity test' is the safeguard against domination. If we exclude you because your inclusion breaks the voting mechanism, that is a structural constraint, not arbitrary power. If we exclude you because we don't like your preferences, that *is* domination, and my model forbids it. The sunset clause ensures we don't cement that exclusion into permanent second-class status. I am trading the *ideal* of full inclusion for the *feasibility* of non-paralysis, but I make that trade-off transparent and revisable."

  **🚩 Soft Spot:** Republicans care about *agency*, not just outcomes. If the integrity test blocks them from the table, they are dominated.
  **Strategy:** Hold the line on "structural constraint vs. arbitrary will." This is your strongest normative distinction.

  #### 3. The Legal Certainty Trap (EU Constitutional Lawyer)
  **The Objection:** "You propose sunset clauses on exclusions. In citizenship law, certainty is a fundamental right. If my right to vote in a jurisdiction expires every electoral cycle unless the incumbents re-justify my inclusion, I have no secure status. This creates a class of 'probationary citizens.' How is this implementable without creating massive litigation and instability? You're solving a philosophical problem by creating a constitutional crisis."

  **The Reply:**
  "I distinguish between *membership status* and *decision-specific enfranchisement*. I am not arguing for rotating citizenship. I am arguing for rotating *franchise boundaries* for specific decisions.
  Think of it like a zoning variance. Your citizenship is secure, but your vote on this specific cross-border environmental regulation is subject to review. The sunset clause applies to the *boundary rule*, not the individual's status. We do this already with residency requirements. I'm just making the justification explicit and time-bound."

  **🚩 Soft Spot:** Distinguishing membership from franchise is legally messy (see: EU local voting rights).
  **Strategy:** Concede implementability is hard, but argue current opacity is worse. "Better explicit probation than implicit exclusion."

  #### 4. The Realist Smackdown (Comparative Politician)
  **The Objection:** "This is philosophy fiat. Boundaries are settled by war, colonization, and path dependence. You're writing a manual for how a benevolent dictator should draw lines, but democracies don't work that way. The 'inherited demos' you start with is the product of violence. Your 'revisability' assumes the victors will willingly subject their power to a test. Why would they?"

  **The Reply:**
  "You're right that origins are violent. My bootstrap admits this. I don't claim to erase history. I claim to tame it.
  Why would incumbents agree? Because externalities are boomeranging. Climate, capital flight, migration—the 'inherited demos' is already losing control. My model offers them a way to manage that loss of control legitimately rather than having it forced on them by crisis. It's not benevolence; it's enlightened self-interest. The 'integrity test' protects *them* from being held hostage by unmanaged externalities."

  **🚩 Soft Spot:** They are right. Incumbents rarely voluntarily dilute power.
  **Strategy:** Do not argue morality. Argue functional necessity. "You think this is idealism; I'm arguing it's survival."

  ---

  ### What to Concede Up Front
  1.  **The Bootstrap isn't a Magic Wand:** Admit the starting point is historically contaminated. Don't try to clean it; argue your mechanism manages the contamination better than the status quo.
  2.  **The Adjudication Gap:** Concede you need a mechanism to judge the "integrity test" that isn't the incumbents themselves. If you don't, Objection #1 kills you.
  3.  **Implementation Friction:** Admit the sunset clause creates administrative burden. Argue it's the cost of legitimacy.

  ### What to Hold
  1.  **Burden of Proof on Exclusion:** Do not let them shift this back to inclusion. If you lose this, you revert to the status quo.
  2.  **Causal Impact as the Default:** Defend this against the Republicans. Status is the *goal*, impact is the *trigger*.
  3.  **Revisability over Origin:** This is your core contribution. Legitimacy is a verb, not a noun.

  ### The Question You Hope Nobody Asks
  **"If the 'decision-integrity test' determines that including a group makes a stable outcome impossible, are you saying that some groups are structurally incompatible with democracy? And if so, isn't that a permanent exclusion disguised as a procedural timeout?"**

  **Why it's deadly:** It forces you to admit that your "rebuttable presumption" might never be rebutted for certain groups (e.g., deeply polarized minorities, or massive external populations). It exposes the "sunset clause" as a lie if the structural condition (polarization/size) never changes.

  **Prepared Answer:**
  "If the condition is permanent, the exclusion becomes permanent, yes. But under my model, that must be *publicly stated* as a structural failure, not a natural boundary. It shifts the blame from the *people* to the *institutional design*. It forces the demos to ask: 'Do we change our voting rules to include them, or do we admit we cannot include them?' Currently, we just exclude them and pretend they don't exist. I'd rather we admit the system is broken than pretend the boundary is natural."

  **(Note:** This is a risky answer. It saves the theory but admits it can't solve deep polarization. **Better move:** Pivot to institutional design. "If inclusion causes instability, the solution is to change the decision rule [e.g., supermajorities, federalism], not to exclude the people. The integrity test should trigger institutional reform, not just exclusion.")**
