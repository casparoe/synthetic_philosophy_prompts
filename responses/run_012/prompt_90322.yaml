      *   *The Conflict:* Elias needs the money for his care. The promise exists in the Cloud/Link. Mara says he promised. Elias feels nothing.
      *   *The Twist/Pressure:* The Link is dyadic. It requires synchronization. If Mara is calm, the data flows. If she's stressed, does it lag? Can she filter?

  5.  **Refining the Plot for the Prompt:**
      *   Start *in media res* at the hearing.
      *   Focus on the sensation of the memory arriving.
      *   Highlight the wife's role. Is she a hard drive or a librarian?
      *   End without resolution. The Arbiter doesn't decide. The couple leaves uncertain.

  6.  **Writing - Step-by-Step:**
