      *   **Constraints:** No bibliography, no name-dropping (Otto, Clark, Chalmers), no lecturing. Clean prose. Dialogue-heavy is fine. End on an unresolved note (no moral).
      *   **Process:** Brainstorm 2-3 structures, pick the strongest, then write.

  2.  **Brainstorming Structures:**

      *   *Option 1: The Hearing Room (Third Person Limited - The Wife).*
          *   Focus on the tension in the legal proceeding. The wife is testifying about what her husband remembers. The lawyer attacks the integrity of the shared store.
          *   *Pros:* High stakes, direct confrontation of the philosophical issue.
          *   *Cons:* Might feel too procedural/legalistic. Less intimate access to the husband's experience of the "memory."

      *   *Option 2: The Home Front (First Person - The Husband).*
          *   Focus on the husband's internal experience. He wakes up, doesn't know who he is, but the "voice" in his head tells him. He tries to distinguish between *his* thought and the *shared* thought.
          *   *Pros:* Deeply phenomenological. Directly addresses the "feeling" of extended cognition.
          *   *Cons:* Hard to capture the legal/social stakes without clunky exposition. Might lose the "other mind" aspect (the wife's agency).

      *   *Option 3: The Interrogation (Alternating/Close Third - Both).*
          *   Scene: A private mediation or hearing room. Both are present. The arbitrator is trying to determine validity of the promise.
          *   Focus: The glitch or the lag. The wife accessing the memory vs. the husband accessing it. The question of editability.
          *   *Pros:* Allows for dialogue (requested), shows the dynamic between the two minds, highlights the trust issue (could she have edited it?).
          *   *Cons:* Needs careful pacing to stay within word count.

      *   *Selection:* Option 3 is strongest. It allows for dialogue, puts the pressure on the *relationship* as much as the tech, and lets the reader feel the ambiguity of whose memory it is. It stresses the "trust" and "availability" criteria of EMT. If the wife can influence the retrieval, is it still *his* mind?

  3.  **Drafting - Key Philosophical Tension Points to Embed:**
