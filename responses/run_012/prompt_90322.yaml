      *   *Constitution vs. Causation:* Is the store *part* of his mind, or just a cause of his current belief?
      *   *The "Coupling" Problem:* If the wife is the gateway to the store (or a co-admin), is she part of his mind too?

  4.  **Developing the Narrative:**
