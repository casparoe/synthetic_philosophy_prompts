  *Compromise:* Everyone writes/swaps/interprets (Phase 1). Then select 3 specific notes for Phase 2 & 3 deep dives. This ensures everyone feels Phase 1, but Phase 2/3 doesn't drag.
  *Actually, better:* Divide into 3 groups. Each group handles one "Case Note" through all phases. This allows parallel processing.
