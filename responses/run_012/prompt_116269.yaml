  *Let's go with the User's intuition:* Everyone writes. Everyone reads. But for the "Twists," we focus on 3-4 specific notes that generated the most disagreement. This is the most time-efficient way to get the "bone" feeling without burning 90 mins on 14 individual interrogations. I will structure the timeline to reflect this selection process.

