answer: |-
  This is a genuine technical and pedagogical headache, and your frustration is warranted. The standard "they answer different questions" deflection is unsatisfying because it hides the fact that Logical Induction (LI) was explicitly designed to repair the specific failures of the Bayesian idealization in the context of bounded, computational agents.

  Here is the concrete breakdown you need for your class, stripping away the "vibes" and focusing on the mechanics of the two frameworks.

  ### 1. The Bounded Deduction Case ($10^6$ vs. $10^9$ steps)

  **The Setup:** Sentence $S$ is a theorem of PA. Shortest proof is $10^9$ steps. Agent computes $10^6$ steps/day.
  **The Question:** What is the rational credence in $S$ today (Day 1)?

  #### (a) The Bayesian Idealization
  *   **Credence:** Exactly 1.
  *   **Mechanism:** Probability functions are defined over a Boolean algebra of sentences. If $S$ is a logical truth ($\vdash S$), then $P(S) = 1$ by definition of the probability axioms (specifically, $P(A) = 1$ if $A$ is a tautology/truth).
  *   **Status of the Agent:** The agent is **irrational** (incoherent) if they assign $P(S) < 1$.
  *   **The Wall:** This framework has no concept of "computation time." It treats logical implication as instantaneous. Consequently, it cannot model the *process* of learning logic. If you learn $S$ tomorrow, you weren't rational today; you were merely ignorant. Bayesianism offers no norm for how to distribute credence *before* the proof is found, other than "you should have already known it."

  #### (b) Logical Induction
  *   **Credence:** Some $p_1 \in (0, 1)$, likely near 0.5 (or a prior based on sentence length/complexity).
  *   **Mechanism:** Credences are prices set by a market algorithm. On Day 1, the deduction process has only seen $10^6$ steps. It has not seen the proof of $S$. Therefore, no efficient trader can *yet* construct a strategy that guarantees profit by betting on $S$.
  *   **Status of the Agent:** The agent is **rational** (logically inductive) if their prices cannot be exploited by any trader running in polynomial time (relative to the deduction process).
  *   **The "Theory of Rationality" Point:** You asked if this is just a redescription of boundedness. **No.** It is a normative constraint on *how* boundedness is managed.
      *   It forbids you from being *arbitrarily* wrong. If there were a $10^3$-step proof of $S$, and you still priced $S$ at 0.5, an efficient trader *would* find that proof and bankrupt you. LI says you are irrational *if* you miss proofs your computational class should have found.
      *   It permits you to be uncertain about $S$ precisely because the proof is computationally inaccessible *now*.
      *   **Verdict:** LI buys a **computable norm**. It tells you what you *ought* to believe given your specific computational limits, whereas Bayesianism tells you what you ought to believe given *no* limits.

  ### 2. The Self-Reference Case ("My price < 0.5")

  **The Setup:** Sentence $L$ is equivalent to "The current market price of $L$ is less than 0.5."
  **The Question:** Can the framework assign a coherent credence without exploding?

  #### (a) The Bayesian Idealization
  *   **Credence:** Undefined / Contradiction.
  *   **Mechanism:** Standard Bayesianism relies on a Tarskian hierarchy. The probability function $P$ lives in the meta-language; the sentences live in the object language.
  *   **The Wall:** A sentence in the object language cannot refer to the $P$ function of the meta-language without violating the hierarchy. If you force the language to be rich enough to contain its own truth/predication predicates (à la Gödel), and you maintain the Bayesian axiom that $P(L)=1$ iff $L$ is true, you derive a contradiction (0 = 1).
  *   **Verdict:** The Bayesian idealization **refuses to answer**. It declares the sentence ill-formed. It cannot model a reasoner that thinks about its own beliefs in the same language it uses to think about the world.

  #### (b) Logical Induction
  *   **Credence:** Converges to (or oscillates tightly around) 0.5.
  *   **Mechanism:** LI uses a market-clearing algorithm. On each day $t$, the algorithm finds a set of prices such that supply equals demand for all sentences.
      *   If the price of $L$ is 0.4, $L$ is true (since $0.4 < 0.5$). Traders buy $L$. Price rises.
      *   If the price of $L$ is 0.6, $L$ is false. Traders sell $L$. Price falls.
      *   The market settles at the equilibrium where traders cannot make unbounded profit.
  *   **The Nuance:** For the strict inequality ($< 0.5$), the price may oscillate slightly around 0.5 in the limit, but the *average* converges to 0.5. For a $\leq 0.5$ formulation, it converges statically to 0.5.
  *   **Verdict:** LI **handles it cleanly**. It does not assign 1 or 0. It assigns a probability that reflects the paradoxical nature of the sentence without allowing the system to explode. It treats the truth value of $L$ as logically uncertain indefinitely, which is the correct epistemic stance for a probabilistic liar.

  ### 3. Naming the Questions Precisely

  You rejected the "different questions" line unless the questions are named. Here they are. These are the distinct normative ideals each framework serves.

  **Question A (Bayesianism):**
  > "What constraints must a belief state satisfy to be **consistent with omniscience**?"
  > *   **Domain:** Static states.
  > *   **Constraint:** Coherence (no Dutch Books possible by *any* bettor, regardless of computational power).
  > *   **Use Case:** Analyzing ideal decision theory, physics (where laws are fixed), or situations where computation is cheap relative to the uncertainty.
  > *   **Failure Mode:** It provides no guidance for action *before* the computation is finished. It labels all bounded reasoners as irrational.

  **Question B (Logical Induction):**
  > "What constraints must a sequence of belief states satisfy to be **efficient relative to computation**?"
  > *   **Domain:** Trajectories of states over time.
  > *   **Constraint:** Logical Induction Criterion (no Dutch Books possible by *computationally efficient* bettors).
  > *   **Use Case:** AI safety, algorithmic trading, scientific theory selection where derivation is costly, self-referential systems.
  > *   **Failure Mode:** It does not guarantee convergence to 1 for all truths *quickly* (only in the limit), and it allows for temporary inconsistencies that an omniscient observer would spot (but a bounded one cannot).

  ### Summary for the Classroom

  | Feature | Bayesian Idealization | Logical Induction |
  | :--- | :--- | :--- |
  | **Credence in hard theorem $S$** | 1 (Immediate) | $\in (0,1)$ (Drifts to 1 as proof is found) |
  | **Rationality of Uncertainty** | Irrational (You should know better) | Rational (You can't compute it yet) |
  | **Self-Reference** | Ill-formed / Paradox | Handled via Market Fixed Points |
  | **Normative Force** | Consistency with **Truth** | Consistency with **Computation** |
  | **Primary Constraint** | No Dutch Books (Any trader) | No Dutch Books (Efficient trader) |

  **The Pedagogical Punchline:**
  Bayesianism is the theory of **God**. Logical Induction is the theory of **Engineers**.
  If you are teaching agents who must act in the world before they have proven all the consequences of their beliefs (i.e., all agents), Logical Induction is the superior idealization because it is the only one that treats *computation* as a scarce resource that rationality must account for. Bayesianism treats computation as free; LI treats it as costly.
