answer: |-
  You describe a marvel of art, a calculating engine of logic that rivals the abacus in arithmetic; yet you mistake the nature of my computation if you suppose it reduces to the empty shuffling of marks. When I declared that reasoning is nothing but reckoning, I meant the addition and subtraction of the consequences of names agreed upon for our thoughts, but in geometry, those names signify bodies generated by motion. Your machine may verify that a conclusion follows from premises, ensuring the consistency of the deduction, but it cannot certify the truth of the first principles themselves. If the axioms fed into this engine are not grounded in the clear and distinct conception of space and motion—if they are mere arbitrary symbols without physical signification—then the machine produces only hypothetical certainty, telling us what follows from suppositions, not what is true of the world. Wallis would no doubt cherish such an instrument, for it favours his algebraic obscurities wherein numbers are manipulated without regard for the magnitudes they ought to represent; but it does not thereby supplant the geometer's knowledge of causes.

  You ask where my kinematics stands if geometers need not move anything. I answer that the machine itself does not move anything, nor does it conceive of motion; it is you, the operator, who must understand what the symbols signify. If the machine certifies a theorem regarding a circle, it does so because the rules imposed upon it reflect the nature of circular generation; if those rules are divorced from kinematics, you have built a castle in the air, however logically sound its bricks may be. I concede that my own attempt at the quadrature was contested, and Wallis has shown errors in my calculations, but error in calculation is not error in principle. Tell me plainly: when you feed this machine its axioms, do you define a line as the trace of a moving point, or do you treat it as an abstract symbol devoid of generation? For if the latter, you have gained rigor at the cost of intelligibility, and your certainty is merely that of a game well-played, not of nature understood.
