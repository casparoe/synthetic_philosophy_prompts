  2.  **Analyze the Debate Content (Move by Move):**

      *   **Move 1 (Historian):**
          *   *Claim:* "Pseudohistory" is circular/sociological (club membership). The lost-civilization thesis is testable (radiocarbon/stratigraphy) and failed. Therefore, it's just wrong, not pseudohistory. Unfalsifiability isn't the issue.
          *   *Strengths:* Correct that the specific claim *is* empirically falsifiable and *has* been falsified by mainstream archaeology. Correct that "pseudohistory" can be used as a slur.
          *   *Weaknesses:* Equating "wrong" with "not pseudohistory" ignores methodological degeneration. Just because a claim *could* be falsified doesn't mean its proponents *accept* falsification.

      *   **Move 2 (Philosopher):**
          *   *Claim:* Uses Lakatos (Research Programmes). It's not about failure/anomalies, but how they are handled (ad hoc adjustments). The thesis never generates novel predictions. It's a degenerating programme. This is methodological, not sociological.
          *   *Strengths:* Lakatos is the standard philosophical tool for this. Accurately describes the behavior of alternative archaeology proponents (ad hoc rescues). Distinguishes between making a mistake and a systematic methodological failure.
          *   *Weaknesses:* Lakatos's criteria can be hard to apply in real-time. "Novel prediction" is a high bar for history (which is often retrospective).

      *   **Move 3 (Historian):**
          *   *Claim:* "Handles evidence badly" applies to respectable history too. The specific charge of unfalsifiability is false (defenders state what would refute them). Explaining evidence away is a vice, but not a different *kind* of inquiry.
          *   *Strengths:* Good point that mainstream historians also dig in or make ad hoc arguments sometimes. Boundary is blurry. Defenders do often state falsification conditions (theoretically).
          *   *Weaknesses:* Underestimates the *systematic* nature of the "explaining away." In mainstream history, persistent contradiction leads to theory abandonment eventually; in pseudohistory, it leads to conspiracy theories.

      *   **Move 4 (Philosopher):**
          *   *Claim:* "Explaining evidence away" *is* the different kind of inquiry. Absence of evidence = evidence of destruction (self-sealing). Converting any result into confirmation is an epistemic property.
          *   *Strengths:* Hits the core epistemic problem (immunization strategies). The "self-sealing" nature is the hallmark of pseudoscience/history.
          *   *Weaknesses:* Can be overstated. Mainstream theories also have protective belts. Needs to distinguish degree, not just kind.

      *   **Move 5 (Historian):**
          *   *Claim:* Every programme is self-sealing at margins. Respectability is about power (chairs, journals, training). Demarcation is a pseudo-problem/political term.
          *   *Strengths:* Sociological reality. Kuhn/Feyerabend influence. Power dynamics do define boundaries.
          *   *Weaknesses:* Radical relativism. If *everything* is politics, we lose the ability to distinguish geology from geology-ism. Dismisses the epistemic differences too easily.

  3.  **Drafting the Adjudication (Iterative Process):**

      *   *Move 1:* Historian is right on empirics (it was tested), wrong on demarcation (falsifiability isn't the only marker).
      *   *Move 2:* Philosopher is right on Lakatos (degenerating shift), but maybe too abstract for a student essay context.
      *   *Move 3:* Historian is right that bad argument exists in mainstream, wrong that the *degree* doesn't matter.
      *   *Move 4:* Philosopher identifies the "self-sealing" mechanism correctly, but needs to acknowledge mainstream does this too (just less).
      *   *Move 5:* Historian goes full sociological reductionist. True that power matters, false that *only* power matters.

      *   *Overall Winner:* The Philosopher has the stronger *epistemic* argument, but the Historian has the stronger *pragmatic/sociological* point. However, regarding the specific question (is it pseudohistory?), the Philosopher's criteria are more useful for distinguishing systematic deception/error from honest mistake. Let's lean slightly toward the Philosopher on the definition, but acknowledge the Historian's warning about gatekeeping. Actually, looking closer: The Historian's final move is a bit of a surrender to relativism. The Philosopher maintains the epistemic distinction. I'll give the edge to the Philosopher on the *concept*, but note the Historian's practical warning.

      *   *What's Missing:*
