answer: |-
  Here is an adjudication of the exchange between your colleagues, evaluated move by move, followed by an overall verdict and an assessment of what the debate omits.

  ### Move-by-Move Adjudication

  **Move 1: The Historian**
  *   **What is right:** The Historian is empirically correct that the "lost civilisation" thesis regarding the pyramids is not unfalsifiable in the Popperian sense. Radiocarbon dating and stratigraphy *do* constitute potential falsifiers, and the thesis has, by mainstream standards, failed those tests. They are also right to be wary of labels that function as tribal markers ("outside the club").
  *   **What goes wrong:** They conflate "being wrong" with "not being pseudohistory." A claim can be empirically false without being pseudoscientific/pseudohistorical (e.g., a honest hypothesis that turns out incorrect). Conversely, a claim can be pseudohistorical even if it posits testable conditions, provided the proponents refuse to accept the test results. The Historian treats falsification as a one-off event rather than a sustained engagement with evidence.

  **Move 2: The Philosopher**
  *   **What is right:** This is the strongest theoretical move. Invoking Lakatos is appropriate here. The distinction between a "degenerating" and "progressive" research programme captures the dynamic nature of the dispute better than simple falsification. The Philosopher correctly identifies that the hallmark of pseudohistory is not the initial claim, but the *immunization strategy* (the *ad hoc* hypotheses) used to protect the core assumption from refutation.
  *   **What goes wrong:** Applying Lakatos to history is trickier than to science. Historical research programmes do not always generate "novel predictions" in the same way physics does; they often generate novel *interpretations* of existing data. The Philosopher risks setting a bar for "respectable history" that is too rigidly scientific, potentially excluding legitimate interpretive historiography.

  **Move 3: The Historian**
  *   **What is right:** The Historian correctly identifies the "continuity problem." Mainstream historians do sometimes handle evidence badly, make *ad hoc* adjustments, or cling to paradigms too long. The boundary is indeed porous. They are also right that defenders of alternative theories often *state* falsification conditions (e.g., "show me the strata"), even if they reject the results later.
  *   **What goes wrong:** They commit a "tu quoque" fallacy. Just because mainstream historians sometimes exhibit vices (explaining evidence away) does not mean those vices are not *defining characteristics* of pseudohistory when they become the *primary* method. The Historian mistakes a difference of degree for a lack of difference in kind. Systematic immunization is qualitatively different from occasional stubbornness.

  **Move 4: The Philosopher**
  *   **What is right:** This sharpens the definition of "self-sealing." The Philosopher correctly identifies the epistemic vice of converting absence of evidence into evidence of a cover-up or destruction without independent warrant. This is the "conspiracy" turn that typically marks the transition from bad history to pseudohistory. They successfully defend the claim that this is an epistemic property, not merely a sociological one.
  *   **What goes wrong:** The assertion that "explaining evidence away is precisely the different kind of inquiry" is slightly too absolute. All inquiries have a "protective belt" of auxiliary assumptions. The Philosopher needs to acknowledge that the distinction lies in the *exhaustion* of the protective belt, not its mere existence.

  **Move 5: The Historian**
  *   **What is right:** This is a strong sociological point (reminiscent of Bourdieu or Kuhn). Institutional power (chairs, journals, training) does enforce boundaries, and the term "pseudohistory" is often weaponized to silence minority viewpoints. The demarcation problem is notoriously difficult, and political factors are undeniably in play.
  *   **What goes wrong:** It slides into relativism. If "respectability" is *only* about power and training, then there is no epistemic difference between geology and creation science, only a difference in institutional dominance. This undermines the Historian's own profession, which relies on the premise that some methods yield more reliable knowledge than others. It answers the political question but evades the epistemic one.

  ### Overall Verdict

  **The Philosopher has the better of the dispute.**

  While the Historian raises valid cautionary notes about gatekeeping and the sociology of the profession, the Philosopher provides a workable, epistemic criterion for the label. The Historian's position ultimately collapses into a relativism that makes it impossible to distinguish between a honest error and a systemic methodology of deception.

  The Philosopher successfully demonstrates that "pseudohistory" is not merely a synonym for "wrong history." It describes a specific *process* of reasoning (the degenerating research programme) where the core thesis is protected from refutation by an expanding web of *ad hoc* assumptions. Since the "lost civilisation" thesis regarding the pyramids relies heavily on such immunization strategies (e.g., claiming dating methods are corrupt rather than accepting dates), the Philosopher's classification is more precise. The Historian is right that the label can be abusive, but wrong to suggest it lacks descriptive utility.

  ### What Both Are Missing

  Despite the high quality of the exchange, both colleagues overlook three critical factors relevant to the specific context (a student essay):

  1.  **Pedagogical Utility:** The debate focuses on the *ontology* of the essay (what it *is*), not the *pedagogy* (what the label *does*). Calling a student's work "pseudohistory" may be epistemically accurate but pedagogically counterproductive. It can shut down inquiry by stigmatizing the student, whereas "badly argued" invites correction. The question should not only be "Is this pseudohistory?" but "Does using this label help the student learn historical method?"
  2.  **Intent and Charity:** Neither addresses the student's intent. Is the student *advocating* for the lost civilisation theory, or *analyzing* it? A student can write about pseudohistory without writing pseudohistory. If the essay defends the claim uncritically, the Philosopher is right. If the essay explores why the claim is popular despite the evidence, the Historian is right to resist the label.
  3.  **The Spectrum of Deviance:** Both argue as if the boundary is binary (History vs. Pseudohistory). In practice, there is a spectrum. An essay might contain pseudohistorical *elements* (reliance on a specific debunked source) without the whole work constituting a degenerating research programme. A more nuanced feedback mechanism would identify the specific *ad hoc* moves in the essay rather than applying a global label.

  **Recommendation:** The Philosopher is theoretically correct that the thesis fits the definition of pseudohistory due to its methodological degeneration. However, the Historian is practically correct that the label is politically charged. In a teaching context, it is better to identify the specific *ad hoc* reasoning errors (as the Philosopher described) without necessarily applying the stigmatizing label, unless the student is persistently refusing to engage with the falsifying evidence.
