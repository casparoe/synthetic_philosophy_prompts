      *Decision on Winner:* The Philosopher wins on the *definition* of pseudohistory. The Historian wins on the *sociology* of the label. But since the question is about whether the label applies (an epistemic question), the Philosopher has the better argument. However, the Historian's point about "just call it wrong" has pedagogical merit. I will declare the Philosopher the winner on the *theoretical* dispute, but note the Historian's practical utility.

