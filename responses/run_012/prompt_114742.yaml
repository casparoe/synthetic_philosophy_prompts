answer: |-
  ### The Procedure

  1.  **Isolate the Proposition.** Editors must rewrite the submitted claim as a bare fact, stripping all epistemic modifiers. Remove phrases like "we suspect," "likely," "evidence suggests," or "probably." The goal is to test the truth condition itself, not the confidence level of the author. The claim must be a statement about the world, not about the author's mind.
      *   *Sufficient Answer:* A single declarative sentence (e.g., "Caesar had 10,000 hairs," not "We believe Caesar had...").
      *   *Stop Condition:* If the claim cannot be stated as a fact (e.g., it is a value judgment like "Policy Y is unjust" or a definition), halt immediately. Mark as "Non-Empirical" and route to the opinion desk. This procedure only tests factual knowability.

  2.  **The Knowledge-Constraint Check.** Scan the isolated proposition for self-reference regarding knowledge. Specifically, ask: Does this claim assert that it is true *and* that it is not known? Does it rely on the concept of "unknown truth" to be meaningful? Look for structures like "P is true but no one knows P."
      *   *Sufficient Answer:* A binary Yes/No based strictly on the text of the proposition.
      *   *Stop Condition:* If Yes, reject immediately. Under our house rule, a truth that is essentially unknown is logically incoherent. This prevents Fitch-style paradoxes from entering publication. No further testing is required.

  3.  **The Causal Access Test.** Identify the physical medium that carries information about this fact to an investigator. You must be able to name a signal (light, sound, physical artifact, digital record) that exists now or existed in a way that leaves a recoverable trace. The method must be consistent with known physics.
      *   *Sufficient Answer:* A specific description of the evidence path (e.g., "Spectral analysis of atmospheric light," "Archival birth records," "DNA remains in bone").
      *   *Stop Condition:* If the information carrier was destroyed without copy (e.g., light absorbed forever, documents burned uniquely), reject. If no causal chain connects the fact to the present community, it is not knowable *by us*.

  4.  **The Finite Community Test.** Evaluate the resources required to access the signal identified in Step 3. Could a finite team (e.g., 100 researchers) complete the verification within a human lifespan (e.g., 100 years) using methods consistent with physical law? This excludes omniscience.
      *   *Sufficient Answer:* A rough resource estimate (e.g., "Requires building one satellite," "Requires sequencing one genome," "Requires excavating one site").
      *   *Stop Condition:* If the task requires infinite time, infinite precision, or observing every particle in the universe, reject. We publish only what is finitely knowable, not ideally knowable by a god-like being.

  5.  **Escalation Protocol.** If the claim passes Steps 1-4 but involves high-stakes policy implications, counterfactual history (what if X happened?), or disputed scientific realism, do not approve automatically. This step captures edge cases where "in principle" is ambiguous.
      *   *Sufficient Answer:* Flag for Senior Editor review.
      *   *Stop Condition:* Procedure ends. This step acknowledges that "in principle" involves value judgments about what counts as a valid method or community. Human judgment is required to finalize.

  ### What Each Step Is Doing

  Step 1 forces clarity. Fitch's paradox thrives on ambiguous modal operators. By reducing the claim to a bare fact, we ensure we are testing the proposition's ontology, not the author's confidence. Step 2 is the direct firewall against Fitch's Paradox. It identifies propositions that are logically self-defeating under the knowability rule (unknown truths) before wasting resources on empirical checks. Step 3 operationalizes the "relative to a community" fix. It grounds knowability in physical causality. If no signal reaches us, no finite community can know it, regardless of theoretical possibility. Step 4 enforces the "finite investigator" constraint. It distinguishes between what is physically possible and what is practically possible for beings like us, ruling out tasks requiring infinite resources. Step 5 is the safety valve. It admits that the procedure cannot resolve all philosophical disputes, specifically regarding counterfactuals or values, ensuring the algorithm doesn't overreach its competence.

  ### Worked Cases

  **Case 1: The Exact Number of Hairs on Caesar's Head at Death.**
  Step 1 isolates: "Caesar had X hairs at death." Step 2 passes (no knowledge claim). Step 3 fails. The physical signal (light reflecting off Caesar's head) was absorbed centuries ago. No physical trace (DNA, precise scalp record) exists today that encodes hair count. The causal chain is broken. **Verdict: Reject.** Editors will dislike this; it feels like a fact that *was* knowable, but the procedure correctly identifies it is not knowable *now* by *us*.

  **Case 2: Unobserved Exoplanet Atmospheric Composition.**
  Step 1 isolates: "Exoplanet X has atmosphere Y." Step 2 passes. Step 3 passes. Photons from the star system pass through the atmosphere and reach Earth. The causal chain exists. Step 4 passes. Building a sufficiently powerful telescope is a finite task for a finite community within 100 years. **Verdict: Approve.** This fits the "in principle" rule perfectly.

  **Case 3: "This Claim Is True But Will Never Be Known."**
  Step 1 isolates: "This claim is true and unknown." Step 2 triggers immediately. The proposition asserts its own unknowability. **Verdict: Reject.** This is the Fitch paradox instance. The procedure stops here, saving time. It highlights the logical incoherence of publishing essentially unknown truths.

  ### Where It Breaks

  This procedure cannot handle counterfactuals (e.g., "If policy X passed, growth would rise"). Step 3 fails because no causal signal exists for events that didn't happen, yet policy institutes must evaluate these. It also struggles with moral claims masquerading as facts. Furthermore, Step 4's "finite resource" definition is vague; is a 1,000-year project finite? The procedure dodges Fitch's Paradox by restricting knowability to the present community, but it cannot solve the underlying metaphysical tension between truth and knowledge. It is a triage tool, not a truth machine.
