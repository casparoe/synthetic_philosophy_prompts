  # Pass 1: The Diagnostic Flow

  This tree uses five concrete scenarios as decision nodes. At each node, you are asked to judge the case on its own merits, without reference to a theory. Your path through the tree is determined by your intuitions about what is happening in the scenario. Note that some paths terminate early, while others require you to navigate all five cases.

  **Node 1: The Finkish Wire**
  *A wire is disposed to conduct electricity. It is fitted with a device that detects any conductor approaching and instantly kills the current before contact is made. You touch it with a conductor; no current flows.*
  *   **Question:** Did the wire fail to conduct because it *lost* its conductivity the moment you approached, or because it *kept* its conductivity but was stopped from exercising it?
      *   **A (Lost It):** The disposition vanished before the test. (Go to Node 2)
      *   **B (Stopped It):** The disposition remained, but was interfered with. (Go to Node 3)
      *   **C (Indeterminate):** The question assumes a distinction that isn't there; the setup defines the property. (Go to Node 4)

  **Node 2: The Masked Glass**
  *An ordinary fragile glass is swaddled in thick foam. It is struck hard but does not break.*
  *   **Question:** Is the glass still fragile while inside the foam?
      *   **A (No):** If it doesn't break when struck, it isn't fragile. (→ **Leaf 1**)
      *   **B (Yes):** It is fragile, but the foam prevents the manifestation. (→ **Leaf 2**)
      *   **C (Contextual):** Fragility is a property of the glass-foam system, not the glass alone. (→ **Leaf 3**)

  **Node 3: The Mimicker Bar**
  *A bar is made of non-fragile metal but contains a charge that detonates on impact, shattering the bar. It is struck and shatters.*
  *   **Question:** Did the bar manifest fragility?
      *   **A (No):** It shattered, but not *because* it was fragile (it wasn't). (Go to Node 5)
      *   **B (Yes):** Shattering is shattering; if it breaks when struck, it counts as fragile. (→ **Leaf 4**)
      *   **C (Projective):** "Fragility" is just our label for the expectation of breaking, regardless of cause. (→ **Leaf 5**)

  **Node 4: The Reinforced Glass**
  *A fragile glass is fitted with a gadget that senses impact and instantly reinforces the molecular structure so it never breaks.*
  *   **Question:** At the exact moment of impact, before the gadget reacts, does the glass possess the intrinsic basis for fragility?
      *   **A (No):** The gadget's presence removes the basis even before activation. (→ **Leaf 6**)
      *   **B (Yes):** The basis is there, but the gadget intervenes too quickly for it to matter. (Go to Node 5)

  **Node 5: The Preempted Glass**
  *An ordinary fragile glass contains a charge that detonates on impact. It is struck and shatters due to the charge, not the brittleness.*
  *   **Question:** Did the glass's fragility play any causal role in the shattering?
      *   **A (No):** The cause was the charge; the fragility was causally idle. (→ **Leaf 7**)
      *   **B (Yes):** The fragility was a backup cause or co-cause. (→ **Leaf 8**)
      *   **C (Identity):** The question is malformed; the fragility *is* the causal basis, so if the basis is present, the disposition acted. (→ **Leaf 9**)
      *   **D (Plural):** There is no single "cause" here; fragility is a cluster of conditional facts. (→ **Leaf 10**)

  ***

  # Pass 2: The Philosophical Terrain

  The following leaves represent the positions your answers have located. Each includes the standard name for the view and a single sentence describing its most awkward commitment.

  **Leaf 1: The Simple Counterfactual Analysis**
  *   **Position:** Dispositions are nothing over and above simple conditionals (if struck, then break).
  *   **Awkward Commitment:** It must deny that the foam-swaddled glass is fragile, contradicting the strong intuition that padding hides fragility rather than removing it.

  **Leaf 2: The Amended Analysis (Promissory Note)**
  *   **Position:** Dispositions are conditionals that hold provided no interfering conditions obtain.
  *   **Awkward Commitment:** The "no interference" clause is a placeholder that cannot be defined without circularly referencing the very disposition it is meant to analyze.

  **Leaf 3: The Situational (or World-Based) View**
  *   **Position:** Dispositions belong to the total situation or world state rather than to the individual object.
  *   **Awkward Commitment:** It implies that an object transported to a different environment literally loses its intrinsic properties and gains new ones without physical change.

  **Leaf 4: The Response-Dependent (Projectivist) View**
  *   **Position:** Dispositional terms project our expectations onto objects rather than describing mind-independent features.
  *   **Awkward Commitment:** It struggles to explain why the projection is so reliably constrained by physical structure that we can engineer dispositions successfully.

  **Leaf 5: The Eliminativist (Hard Categoricalist) View**
  *   **Position:** Only categorical properties exist; dispositional talk is a *façon de parler* for causal laws.
  *   **Awkward Commitment:** It must explain away the apparent reality of causal powers without leaving the physical world causally inert or mysterious.

  **Leaf 6: The Fink-Sensitive Intrinsicist**
  *   **Position:** Dispositions are intrinsic but can be removed extrinsically (finkishly) without physical change to the basis.
  *   **Awkward Commitment:** It allows that an object can lose a disposition without any change to its internal physical structure, violating the principle of locality.

  **Leaf 7: The Preemption Realist**
  *   **Position:** Dispositions are real causal powers that can be preempted by other powers.
  *   **Awkward Commitment:** It commits you to the existence of causally efficacious properties that sometimes do absolutely no work in the actual world.

  **Leaf 8: The Overdeterminationist**
  *   **Position:** Dispositions and their categorical bases (or other causes) systematically overdetermine manifestations.
  *   **Awkward Commitment:** It implies a universe rife with redundant causation, where every effect has more causes than are strictly necessary.

  **Leaf 9: The Identity View (Dispositional Monism)**
  *   **Position:** The disposition just is its intrinsic causal basis; there is no distinction between the power and the structure.
  *   **Awkward Commitment:** It cannot easily account for cases where the same causal basis seems to support different dispositions depending on the laws of nature.

  **Leaf 10: The Multi-Track (Cluster) View**
  *   **Position:** Disposition names a family of notions with no single analysis or unified metaphysical nature.
  *   **Awkward Commitment:** It surrenders the hope of a unified theory of causation, accepting that "cause" and "power" mean different things in different contexts.

  ***

  # Meta-Analysis: Limits and Sensitivities

  **Unoccupied Combinations**
  Several theoretical combinations of answers are unoccupied in the tree above.
  *   **Node 1A (Lost It) + Node 2B (Yes, Fragile):** This combination is **incoherent**. If you believe the wire lost its conductivity due to the approach (Fink), consistency demands you believe the glass loses its fragility due to the foam (Mask), as both are extrinsic preventers of manifestation. Holding both suggests an arbitrary distinction between electrical and mechanical dispositions.
  *   **Node 3B (Yes, Manifestation) + Node 5A (No Causal Role):** This combination is **unattractive**. If you count the Mimicker Bar's shattering as a genuine manifestation of fragility (Node 3B), you have severed the link between disposition and cause. To then insist that the Preempted Glass's fragility played *no* role (Node 5A) is to apply a causal standard to one case that you explicitly rejected in the other.
  *   **Node 4A (No Basis) + Node 5B (Yes Causal Role):** This combination is **merely unexplored**. It suggests a view where the basis can vanish extrinsically (Fink) yet the disposition retains causal efficacy in preemption cases. No major proponent currently argues for extrinsic basis removal alongside robust causal realism.

  **Inseparable Leaves**
  The tree cannot separate **Leaf 2 (Amended: Promissory)** and **Leaf 7 (Preemption Realist)**. Both paths require the user to affirm that the disposition exists despite failure to manifest (Node 1B or 2B) and that the manifestation can occur without the disposition's specific causal input (Node 5A). The diagnostic cases fail to separate them because both views rely on a "ceteris paribus" escape clause: one uses it to save the conditional, the other to save the causal power. A reader who accepts one will almost invariably accept the other based on these five cases alone.

  **Finkish vs. Masked Sensitivity**
  The following leaves turn on the difference between the Finkish (Node 1) and Masked (Node 2) cases:
  *   **Leaf 6 (Fink-Sensitive Intrinsicist):** This leaf is reached only if the reader treats the Fink case as removing the disposition (Node 1A) but treats the Mask case as retaining it (Node 2B). This position holds that a disposition can be lost extrinsically (Fink) but also hidden extrinsically (Mask), a subtle distinction that collapses for most other views.
  *   **Leaf 1 (Simple Counterfactual):** This leaf treats both cases identically (the disposition is absent in both). A reader who thinks these are "one problem rather than two" will be funneled here.
  *   **Leaf 9 (Identity View):** This view separates the cases sharply. In the Mask case, the basis remains, so the disposition remains. In the Fink case (specifically the Reinforced variation at Node 4), if the basis is removed, the disposition is removed. A reader who sees the Fink and Mask cases as metaphysically identical will not end up at Leaf 9.

  If you swap the Finkish case for the Masked case at Node 1, **Leaf 6** would vanish, as the "Lost It" answer would no longer be available for an extrinsic interferer that doesn't remove the basis. **Leaf 1** would expand to capture more Realists who treat masking as disposition-removal. The tree relies on the reader seeing the Fink as a *change in property* and the Mask as a *block on manifestation* to generate the full spread of Realist positions.
