answer: |-
  ### The Case: Municipal Licensing Bureau

  **Case Description**
  The City Licensing Bureau must choose between two administrative protocols for the upcoming fiscal year. **Option A** retains the current manual verification system, which functions reliably but occasionally produces a catastrophic clerical error; statistically, this will result in one specific applicant, Ms. K, being erroneously rejected and forced to endure a **four-hour delay** to resolve the mistake in person, ruining her afternoon and causing significant frustration. **Option B** implements a new automated software patch that eliminates the risk of catastrophic error but introduces a systemic latency; this will impose a **two-second processing delay** on each of the **7,200 applicants** who visit the bureau over the year, a lag so brief that no individual will consciously perceive it, report it, or alter their behavior because of it.

  **Common Scale**
  Before rendering verdicts, we must establish a metric. We will measure harm in **aggregate person-seconds of involuntary waiting**. This measure is defensible because time is a finite, fungible resource universally valued by agents; losing time is a setback to interests regardless of how that time is experienced. On this scale, Option A imposes 14,400 seconds of harm (1 person × 14,400 seconds). Option B imposes 14,400 seconds of harm (7,200 people × 2 seconds). The totals are mathematically identical.

  ***

  **(a) Verdicts and Reasoning**

  **(i) The Totalist:** *Verdict: Indifferent.*
  The totalist sums welfare losses across all persons. Since the aggregate loss of time is identical (14,400 seconds), the total welfare reduction is equivalent. Unless one argues for diminishing marginal disutility of waiting (i.e., the second hour hurts less than the first), the totalist sees no moral difference between concentrating the loss or dispersing it.

  **(ii) The Threshold Theorist:** *Verdict: Choose Option B.*
  This theorist holds that harms above a threshold of significance (noticeability/disruption) lexically outrank harms below it. Option A's harm crosses the threshold of "significant disruption" (ruining an afternoon). Option B's harms fall below the threshold of noticeability. Therefore, the single significant harm in A outweighs the astronomical sum of insignificant harms in B.

  **(iii) The No-Harm (Sub-Threshold) Theorist:** *Verdict: Choose Option B.*
  This theorist holds that if a setback does not register phenomenologically—if the agent is not worse off in terms of experienced welfare—it is not a harm. Since the 2-second delay is unnoticeable, the 7,200 applicants suffer *zero* harm. Option B is costless; Option A is costly. B is strictly superior.

  ***

  **(b) Structural Feature and Load-Bearing Test**

  **Structural Feature:** The **phenomenological registration** (noticeability) of the dispersed harm.
  The disagreement between the Totalist (who counts objective time) and the other two (who count subjective experience) rests entirely on whether a harm must be felt to count.

  **Load-Bearing Test:**
  Alter the case so that the dispersed harm in Option B becomes **just noticeable** (e.g., a 10-second delay per person, reducing the group size to 1,440 to maintain the 14,400-second total).
  *   **Totalist:** Verdict remains *Indifferent* (totals are still equal), though if the 10-second delay is more annoying per second than the 4-hour wait, they might shift to A. Assuming linear time value, they remain indifferent.
  *   **Threshold Theorist:** Verdict *shifts*. If 10 seconds crosses the significance threshold, B now contains 1,440 significant harms. Depending on whether the threshold is lexical or additive, B may now be impermissible or equal to A.
  *   **No-Harm Theorist:** Verdict *shifts*. The delays are now experienced; B is no longer costless.
  *   **Result:** If the alteration makes the dispersed harm *noticeable*, the disagreement between the Threshold/No-Harm theorists and the Totalist **vanishes** regarding the *nature* of the harm (all agree it is now a harm), though they may still disagree on aggregation. More critically, if we alter the case so the Totalist accepts subjective experience as the currency (not objective time), the Totalist joins the others in preferring B. The disagreement is load-bearing on the definition of "harm" as either resource-loss or experience-loss.

  ***

  **(c) The Stipulation Objection**

  **Objection:** You have stipulated your conclusion. By defining Option B's harm as "unnoticeable," you have defined it out of the moral ledger rather than arguing that it should be excluded. If time is lost, harm is done, regardless of awareness.

  **Response:** This objection conflates *objective setback* with *welfare loss*. If morality is about resources, the objection holds. But if morality is about *well-being* (how lives go for the subjects), phenomenology is not a stipulation; it is the ontology of welfare. A person who does not notice a loss has not had their life go worse in a felt sense.
  **Concession:** However, if one defines harm strictly as "setback to interest" independent of experience (an objective list theory), then the case cannot prove sub-threshold harms don't count.
  **Residual Establishment:** Even if conceded, the case establishes that **aggregation principles are sensitive to the currency of value**. If value is experiential, aggregation of trivialities fails. If value is resource-based, aggregation holds. The case forces the seminar to choose the currency before doing the math.

  ***

  **(d) Pedagogical Point**

  **Claim:** This case demonstrates that the **Problem of Aggregation** is not merely a mathematical problem of summing quantities, but a metaphysical problem of defining the *moral unit*.
  **Takeaway:** Readers should accept that no aggregation principle (Totalism, Prioritarianism, Sufficientarianism) can function without first settling whether sub-threshold experiences constitute moral data.
  **Defeat Condition:** To defeat this claim, one must demonstrate a coherent theory of welfare where agents can be made worse off by changes they cannot in principle detect, without relying on counterfactuals about what they *would* have noticed under different conditions.
