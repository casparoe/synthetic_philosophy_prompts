prompt: |-
  hey — i'm a philosophy grad student and i've somehow been talked into giving a lunchtime talk at my roommate's company. the audience is all engineers and data scientists. smart, zero philosophy, and mildly allergic to anything that sounds like a word game. the topic i picked is vagueness and the sorites paradox.

  i don't need you to explain sorites to me, i already know it. i need you to plan the talk for me. so take the role of a philosophy teacher who's taught this exact thing to skeptical non-philosophers a dozen times and knows where it goes wrong. think carefully before you answer, and maybe start by brainstorming what the genuinely hard parts are for this crowd, then build the plan.

  what i want from you:

  - the order the ideas have to come in, and why each one depends on the one before it. what actually has to be in place before the paradox can even bite? i don't want a list of topics, i want the dependency structure.
  - the single carrying example. i was going to do the heap of sand, but i suspect this crowd will shrug it off as a trick, so tell me whether that's right. a colleague suggested using something from their world instead, like "how many bad rows make a dataset too dirty to trust" — tell me if that's a good carrier or if it smuggles in assumptions that ruin the lesson. whatever you pick, say what the example has to have and what it has to lack to do the job.
  - the misconceptions they'll arrive with or form on the way, in the order they'll actually surface, and exactly where in the sequence i should head each one off. my guesses: (a) "this is just measurement error, we haven't found the threshold yet," (b) "so words are meaningless and anything goes," (c) "there is a real line, we just can't know it." tell me which of those are real, which are decoys, and what i'm missing.
  - one thing i can do or ask at the end that shows the idea landed, not just that they remember the paradox.
  - what i should deliberately refuse to go into at this level, and how i say that out loud without looking like i'm dodging.

  couple of content constraints, because i want it a bit in the weeds rather than the googlable textbook version: i want them to feel the difference between vagueness and mere uncertainty/ignorance, and i'd like to at least gesture at higher-order vagueness (borderline cases of borderline cases) if you can fit it without losing them. also, when you get to the tolerance principle, give me a way to state it that sounds so obviously true they nod along, so the punch actually lands when you pull the rug.

  no reading list, no citations, just the plan.
