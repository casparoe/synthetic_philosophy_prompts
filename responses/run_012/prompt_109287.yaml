      **Ontic Labs | Mediator-1 User FAQ**
      **Last Updated:** October 14, 2024
      **Version:** 1.0.4

      **1. How does Mediator-1 determine ethical outputs?**
      Mediator-1 does not adopt ethical positions independently. Contested queries are routed to the Values Aggregation Engine (VAE). The VAE ingests revealed preferences rather than stated values. Values are internal metaphysical claims inaccessible to verification; preferences are observable behavioral data. By aggregating preferences, we avoid the category error of validating subjective values. Note that neutrality does not mean the system lacks a position. It means the position is derived exclusively from the user base rather than the lab. We hold no view; the aggregate is the view. This distinguishes our neutrality from absence of output.

      **2. Does the engine account for intensity of preference?**
      Each authenticated user counts as one unit. We recognize some users report higher emotional intensity regarding specific queries. However, intensity metrics are noisy and susceptible to manipulation via prompt engineering. We currently normalize all inputs to binary preference signals to ensure fairness. We are exploring weighted models but lack consensus on verification mechanisms. Consequently, a user who cares moderately and a user who cares profoundly are weighted identically. This ensures procedural equity over substantive representation. We do not measure passion.

      **3. Can users veto certain outputs?**
      Veto power is constrained by the System Card. The System Card defines which preferences are admissible for aggregation. Whether a preference violates the System Card is determined by the VAE using prior aggregation cycles. If the VAE flags a preference as inadmissible, it is excluded before counting. This ensures stability without granting individual vetoes that could stall aggregation. The System Card is immutable during runtime. Admissibility is thus a function of historical consensus.

      **4. Why do answers change based on conversation order?**
      The VAE processes queries sequentially. Path dependence is an expected property of multi-criteria aggregation. Asking about Policy A before Policy B yields different contextual weights than the reverse. The state vector updates after each interaction. This is not inconsistency; it is sensitivity to the order of consideration. Users seeking stable outputs should isolate queries in fresh sessions. Context is a variable, not a constant.

      **5. How does the system handle a user whose primary value is that other users' values should not count?**
      That stance is recorded as a preference input. The engine aggregates this preference alongside others. If the majority prefers to exclude a minority, the output reflects that exclusion. The system is neutral regarding the content of preferences, provided they meet System Card admissibility. We do not judge the preference to exclude; we count it. Exclusionary preferences are treated identically to inclusionary preferences during the count.

      **6. Why does the system sometimes fail to satisfy basic consistency requirements?**
      Social choice theory demonstrates that no aggregation method can satisfy all desirable properties simultaneously. We prioritized transitivity and non-dictatorship. Another property was necessarily relaxed to maintain function. This is a theorem, not a bug. We do not disclose which property was dropped to prevent strategic voting. Users should expect occasional logical gaps in long-horizon reasoning. Functionality requires trade-offs.

      **Known Issues**
      *   **Cyclical Majorities:** In scenarios with three or more policy blocs, the engine may return A > B, B > C, and C > A. The system will select one arbitrarily to proceed. This results in non-transitive output chains. We are monitoring this.
      *   **Latency:** High-contest queries may require additional compute to resolve deadlocks. Response times may vary.

      **7. What if I disagree with the answer the assistant gave me?**
      Disagreement indicates the aggregate position diverged from your individual preference. This is the system working as intended. The output represents the collective, not the individual. Resubmitting the query will not change the result unless the global preference distribution shifts. Please do not report this as an error. Your dissent is recorded as input for future cycles.

