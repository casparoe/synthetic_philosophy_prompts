answer: |-
  # Criminal Punishment Theory: A Decision Tree

  **Start:** The state may deliberately make a wrongdoer suffer.

  **Q1: Does the justification rely on facts existing *before* the punishment is imposed (past conduct), or on what punishing will *achieve* (future effects)?**
  *   **Past Conduct** → Go to Q2.
  *   **Future Effects** → Go to Q5.

  **Q2: Is the justifying good the suffering itself, or the censure that suffering conventionally expresses?**
  *   **The Censure** → **Leaf: Expressivist/Communicative**
      *   *Awkward commitment:* Struggles to justify severity proportional to harm rather than communicative need.
  *   **The Suffering** → Go to Q3.

  **Q3: Is desert a sufficient reason to punish, or merely a limit on when you may?**
  *   **Merely a Limit** → **Leaf: Limiting/Negative Retributivism**
      *   *Awkward commitment:* Permits punishing the innocent if desert constraints are met, unless constrained by something else.
  *   **Sufficient Reason** → Go to Q4.

  **Q4: Why does desert justify suffering? Did they lose a right or take unfair advantage?**
  *   **Lost a Right** → **Leaf: Self-Defence/Forfeiture**
      *   *Awkward commitment:* Suggests we may punish the innocent if they forfeit rights via non-criminal acts.
  *   **Unfair Advantage** → **Leaf: Fair-Play**
      *   *Awkward commitment:* Implies punishment is a benefit to the offender to restore equality.
  *   **Neither (Intrinsic)** → **Leaf: Pure Retributivism**
      *   *Awkward commitment:* Requires state to inflict pain even if it achieves no social good.

  **Q5: What future state justifies the suffering?**
  *   **Change the Offender** → **Leaf: Rehabilitation**
      *   *Awkward commitment:* Justifies indefinite detention until 'cured'.
  *   **Remove Capacity to Harm** → **Leaf: Quarantine/Incapacitation**
      *   *Awkward commitment:* Treats offenders like disease carriers rather than moral agents.
  *   **Discourage Crime** → Go to Q6.

  **Q6: Are there side-constraints on maximising this effect?**
  *   **No Constraints** → **Leaf: Act-Utilitarian Deterrence**
      *   *Awkward commitment:* Permits punishing the innocent if it maximises utility.
  *   **Yes (Rules/Constraints)** → **Leaf: Rule-Utilitarian**
      *   *Awkward commitment:* Collapses into retributivism if rules are absolute.

  ***

  ### Notes on Empty and Overlapping Spaces

  **Unoccupied Combinations**
  *   **Forward-looking + Desert as Sufficient Reason:** *Incoherent.* If the justification is future effects, past desert cannot be the sufficient reason for imposition.
  *   **Backward-looking + Punish the Innocent:** *Incoherent.* Backward-looking theories tie justification to culpability; punishing the innocent contradicts the root premise.
  *   **Forfeiture + Rehabilitation Aim:** *Unexplored/Unattractive.* If an offender has forfeited rights, there is little theoretical motivation to restore them via therapy rather than simply harming them.

  **Indistinguishable Leaves**
  *   **Rule-Utilitarianism vs. Limiting Retributivism:** Your tree cannot reliably separate these. Both accept side-constraints on maximizing utility/desert, often converging on identical practical outcomes (punish only the guilty, proportional to offence).
  *   **Quarantine vs. Incapacitation:** These are flagged as a single leaf because the distinction is merely semantic; both justify detention based on dangerousness rather than culpability.
