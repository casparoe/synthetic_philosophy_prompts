answer: |-
  **Pre-Work (0–10 mins):** Before the paradox lands, you must decouple **Expected Value (EV)** from **Prediction**. If students think EV is "what you probably get," infinity looks like a promise of infinite wealth. Define EV strictly as a weighted sum: $\sum (probability \times payoff)$. Use a die roll: EV is 3.5, but you never roll 3.5. This kills the "EV = probable outcome" misconception before it starts.

  **The Example (10–25 mins):** **Carry the session with the capped version first.** Do not open with the infinite sum. Run the game where payouts stop at $2^N$. Calculate the EV together; it grows linearly with $N$ (roughly $N$ depending on payoff structure). Show that as the cap rises, the rational entry price rises. **Then** remove the cap. This scaffolding prevents the "index glaze-over." The example must have **probabilities and payoffs that clearly cancel to 1** per term. It must lack **bankroll limits** initially; if you introduce casino bankruptcy too early, you solve the paradox empirically rather than philosophically. The capped version validates the arithmetic before breaking it. If you start with infinity, they suspect a trick. If you show EV = $N$ for finite $N$, then let $N \to \infty$, the divergence feels earned.

  **Misconceptions & Sequence (25–40 mins):** Intercept errors as they surface:
  1.  *"EV is the average I'll really get."* **Head off in Pre-Work.** (See die roll).
  2.  *"Infinite EV means paying a million is rational."* **Address immediately after revealing infinity.** Ask: "Would you mortgage your house for one ticket?" This creates the normative tension.
  3.  *"Diminishing utility solves this, case closed."* **Address after tension peaks.** Accept Bernoulli's solution, then introduce the **Super-St. Petersburg** (payoff $2^{2^k}$). Show concave utility still fails unless utility is **bounded**. This forces them to see diminishing returns isn't enough.
  4.  *"The real problem is the casino can't pay."* **Address last.** Dismiss as an empirical constraint. The paradox is about rationality principles, not solvency.

  **The Landing (40–50 mins):** Your target is correct: **The Trilemma.** Something has to give: either money's value is linear, utility is unbounded, or maximizing EV is the right rule. They cannot keep all three. State this explicitly at minute 45. This is the philosophical payload.

  **Assessment Question:** Ask: **"If we bound utility to solve St. Petersburg, does that imply there is some amount of money that is no better than death?"** If they grasp it, they'll see bounded utility solves the math but creates absurd moral implications.

  **What to Skip:** Skip **measure theory** and **rigorous convergence proofs**. Say out loud: *"We are skipping the rigorous analysis of infinite sums. We treat the expectation as divergent by definition to focus on the normative implications."* Skip the **history of the Bernoulli family**; it's irrelevant to the logic.
