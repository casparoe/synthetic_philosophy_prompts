answer: |-
  ### Restatement of Your Cases

  You are asking for a boundary condition on semantic indeterminacy. You accept Quine's conclusion in the radical translation scenario but reject its generalization to all meaning. Specifically:

  1.  **Gavagai:** In radical translation, where only stimulus-response data is available, competing ontologies (rabbit vs. rabbit-part) fit the data equally well. You judge this **indeterminate**.
  2.  **Arithmetic:** A speaker follows a rule (addition) on finite data. A skeptic suggests a deviant rule (quus) fits the past data. You judge this **determinate** (they mean addition).
  3.  **Plain Observation:** Direct ostension of a present object (rabbit, color). You judge this **determinate**.
  4.  **Coarser Categories:** A language lacks a distinction we make (blue/green). You judge the word **determinate** as the coarse category, not arbitrarily one of the fine ones.
  5.  **Bilingual Informants:** Natives report their meaning in English. You judge this **determinate**.
  6.  **Own Language:** A neighbor uses a word bafflingly. You judge this **determinate**, even if inaccessible to you.
  7.  **Dead Languages:** Only texts remain. You judge this **determinate**, though evidentially scarce.

  Your conflict lies here: You want to say indeterminacy arises when rival interpretations fit all behavioral evidence (Gavagai), but you refuse to say this when rival functions fit all past behavioral evidence (Arithmetic). You suspect dispositions might solve Arithmetic but fear they dissolve Gavagai.

  ### Candidate Principles

  **Candidate 1: The Truth-Value Invariance Principle.**
  *Claim:* There is no fact of the matter if two manuals agree on the truth-value of every sentence the speakers assent to.
  *Verdict:* This delivers your *Gavagai* verdict but fails your *Arithmetic* verdict. In the arithmetic case, "plus" and "quus" agree on every sentence the speaker has *actually* assented to so far. If you stick to this, you must surrender the Arithmetic verdict. I assume you will not.

  **Candidate 2: The Causal-Disposition Principle.**
  *Claim:* Meaning is fixed by what the speaker *would* do in counterfactual situations (e.g., if asked about large numbers, or if shown a rabbit part).
  *Verdict:* This saves *Arithmetic* (they would have said 1002, not 1004). However, it threatens *Gavagai*. If the natives *would* dissent from "gavagai" when shown a detached ear (if trained to attend to identity), then 'rabbit' is determinate. Quine argues we cannot assume they *would* dissent without begging the question of translation. Furthermore, this principle struggles with *Dead Languages* (no dispositions left to test) and *Coarser Categories* (they would *not* distinguish blue from green, so the disposition fixes the coarse term, which works, but it makes the bilingual case redundant).

  **Candidate 3: The Normative-Correction Principle.**
  *Claim:* A fact of the matter exists only where there is a standing social practice of correcting errors regarding the specific distinction in question, independent of immediate stimulus.
  *Verdict:* This distinguishes *Arithmetic* (rule-following involves correction) from *Gavagai* (ontological categorization involves no correction mechanism in the native language). It handles *Coarser Categories* (no correction for blue/green distinction exists). It handles *Bilinguals* (they invoke English correction norms). It handles *Neighbor* (shared correction norms). It puts pressure on *Dead Languages* (norms are inert).

  ### The Committed Principle

  I recommend the **Principle of Normative Correction**. It repairs your confused reliance on "behavioral fit" by shifting the ground to "normative constraint." Meaning is not just what fits the past; it is what is *governed* by a rule. A rule exists only where there is a practice of distinguishing correct from incorrect application that transcends the immediate stimulus.

  **The Principle of Normative Correction**

  For any term $T$ and any proposed distinction $D$ (e.g., rabbit vs. part, plus vs. quus):

  1.  **Identify the Community:** Locate the linguistic community to which the speaker belongs.
  2.  **Test for Normative Mechanism:** Determine if the community possesses a mechanism for correcting the application of $T$ regarding $D$ that operates independently of immediate sensory stimulation.
      *   *Mechanism types:* Explicit definition, logical inference, appeal to authority, or established corrective training.
      *   *Exclusion:* Mere conditioned assent to a present stimulus does not count.
  3.  **Verdict:**
      *   If such a mechanism exists and is actively maintained, there is a **fact of the matter** (Determinate).
      *   If no such mechanism exists (the distinction is not drawn or enforced), there is **no fact of the matter** regarding $D$ (Indeterminate), or the fact is fixed at the level where correction *does* occur (Coarser Category).

  ### Application to Your Cases

  Here is how the principle mechanically processes your tally, and which case forces each clause.

  1.  **Gavagai (Forces Clause 3, Indeterminate branch):**
      *   *Analysis:* The native community has no mechanism for correcting "rabbit" vs. "rabbit part." Their apparatus of individuation does not carve that joint. There is no normative pressure to choose one ontology over the other.
      *   *Result:* No fact of the matter.

  2.  **Arithmetic (Forces Clause 2, Mechanism types):**
      *   *Analysis:* The speaker belongs to a mathematical community. The application of "plus" is governed by rules of inference and training that correct deviations (e.g., "2+2=5" is corrected not because of stimulus, but because of rule-violation). The deviant function violates the normative mechanism.
      *   *Result:* Fact of the matter (Addition).

  3.  **Plain Observation (Forces Clause 2, Exclusion):**
      *   *Analysis:* While this looks like mere stimulus, it is anchored by the shared human perceptual apparatus which acts as a universal "corrective mechanism" for mid-sized dry goods. We correct each other on "rabbit" vs "dog" based on shared biology.
      *   *Result:* Fact of the matter. (Note: This is the limit case where stimulus *becomes* norm due to shared biology).

  4.  **Coarser Categories (Forces Clause 3, Determinate branch):**
      *   *Analysis:* The community lacks a mechanism for correcting "blue" vs. "green." Therefore, the distinction $D$ (blue/green) has no fact of the matter. However, the distinction "grue-like vs. red" *does* have a corrective mechanism.
      *   *Result:* Fact of the matter for the coarse term; no fact for the fine split.

  5.  **Bilingual Informants (Forces Clause 1, Community):**
      *   *Analysis:* The speaker belongs to *two* communities. The English-speaking community has a normative mechanism for "rabbit." The speaker defers to it.
      *   *Result:* Fact of the matter (inherited from English norms).

  6.  **Own Language/Neighbor (Forces Clause 1 & 2):**
      *   *Analysis:* You share a community. Even if baffled, you assume a normative mechanism exists (she is not speaking nonsense, she is following a rule you haven't grasped). The fact exists because the practice exists, even if your access is limited.
      *   *Result:* Fact of the matter.

  7.  **Dead Languages (Forces Clause 2, Actively Maintained):**
      *   *Analysis:* This is the stress point. The mechanism is no longer *actively* maintained. However, the texts record the *past* operation of the mechanism. We treat the historical practice as frozen.
      *   *Result:* Fact of the matter (historical).

  ### Application to the Undecided Case

  **Case:** Natives have a word that coincides, across every situation they ever discuss, with a biological kind (e.g., *tiger*), but which they treat and teach as a ritual category (e.g., *spirit-vessel*). They correct usage based on ritual purity, not biological taxonomy.

  **Application of Principle:**
  1.  **Community:** The tribe.
  2.  **Normative Mechanism:** They correct usage based on ritual status. If a biological tiger is ritually disqualified, they dissent from the word. If a non-tiger is ritually qualified, they assent. There is no mechanism for correcting based on biological taxonomy independent of ritual.
  3.  **Verdict:** There is a **fact of the matter** that the word means *spirit-vessel*, not *tiger*.
      *   *Reasoning:* The biological coincidence is accidental relative to the normative practice. The corrective mechanism targets the ritual property. To translate it as 'tiger' would be to impose an external normative mechanism (biology) that the speakers do not recognize.

  ### The Embarrassing Case

  **Case:** The "Drifting Norm" Community.
  A community uses a term $T$ with a clear corrective practice. Over 500 years, the corrective practice shifts imperceptibly. Generation 1 corrects usage based on Condition A. Generation 500 corrects usage based on Condition B. At Generation 250, the practice is ambiguous; some elders correct for A, some for B, and both are considered fluent speakers. There is no schism, just a smooth drift.

  **Does it defeat the principle?**
  It bounds it. The Principle of Normative Correction requires a "standing practice." In the Drifting Norm case, at Generation 250, there is no *single* standing practice.
  *   *Analysis:* The principle yields **no fact of the matter** for Generation 250 regarding the distinction between A and B.
  *   *Implication:* Meaning is not always determinate even within a living language. Indeterminacy is not just for radical translation; it arises whenever normative consensus fractures or drifts without resolution. This embarrasses the intuition that "Own Language" is always determinate. Sometimes, even neighbors do not share a single fact of the matter.

  ### The Least Confident Verdict

  The verdict I am least confident you should keep is **Dead Languages**.

  **Why:**
  My principle relies on *active* normative mechanisms (Clause 2). A dead language has no speakers to correct errors, no authority to defer to, and no practice to maintain. It has only *traces* of past practice.
  To maintain that there is a "fact of the matter" for a dead language, you must believe that meaning survives the extinction of the practice that constituted it. This requires a metaphysical commitment: that the "fact" is an abstract object frozen in time, rather than a property of living use.

  **What would have to be true for you to be right to keep it:**
  For the Dead Languages verdict to hold, **Semantic Realism** must be true. Specifically, it must be the case that meaning is constituted by the *historical origin* of the practice, not its *current maintenance*. You must accept that a rule, once launched, continues to have a determinate trajectory even if no one is left to follow it or correct deviations from it. If meaning is use, and use has ceased, the fact of the matter dissolves into the best interpretation of the evidence. If you keep the verdict, you are claiming that the *past existence* of the normative mechanism is sufficient to fix reference forever, regardless of present accessibility.
