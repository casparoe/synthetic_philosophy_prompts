answer: |-
  ### The Case: The Auditor's Lottery

  **The Scenario**
  A humanitarian agency has a single, non-renewable budget allocation to deploy immediately (a one-shot decision). The agency faces a choice between two verified programs. The odds and outcomes are transparent, audited, and known with certainty; there is no ambiguity or ignorance of the probabilities.

  *   **Option A (The Certain Good):** Distribute proven medical kits to a refugee camp. This will **certainly save 1,000 lives**.
  *   **Option B (The Lottery):** Fund a high-risk containment protocol for a potential pathogen. The protocol relies on a mechanical trigger mechanism verified by independent auditors. The mechanism has exactly a **1 in 10,000 chance** of successfully containing the pathogen, which would **save 5,000,000 lives**. There is a **9,999 in 10,000 chance** the mechanism fails, the pathogen escapes, and **0 lives are saved** by this intervention (the 1,000 from Option A are lost because the budget was not spent on them).

  **The Arithmetic**
  Expected Value (EV) is calculated as the sum of outcomes weighted by their probabilities. Let the value of a saved life be $1$ unit.

  *   **EV(Option A):** $1.0 \times 1,000 = \mathbf{1,000}$ **units**.
  *   **EV(Option B):** $(0.0001 \times 5,000,000) + (0.9999 \times 0) = \mathbf{500}$ **units**.

  *Correction:* To satisfy the constraint that EV maximization selects the risky option, I must adjust the payoff so the EV of B exceeds A.
  *   **Revised Option B Payoff:** Save **20,000,000 lives**.
  *   **Revised EV(Option B):** $(0.0001 \times 20,000,000) + (0.9999 \times 0) = \mathbf{2,000}$ **units**.

  **The Decision**
  Expected-value maximization dictates choosing **Option B**.
  The agent prefers a 99.99% chance of saving *no one* (and letting the initial 1,000 die) over the certainty of saving 1,000 people, solely because the mathematical expectation is higher (2,000 vs. 1,000).

  **Why this resists standard objections:**
  1.  **Finite Payoffs:** 20 million lives is finite (roughly the population of a large nation); no infinities are invoked.
  2.  **Defensible Probabilities:** 1 in 10,000 is not an inscrutable metaphysical guess; it is a mechanical frequency verifiable by physical audit (e.g., a drum with 10,000 balls, one marked).
  3.  **One-Shot:** The budget is spent once; there is no long run in which the law of large numbers guarantees the 2,000 EV will materialize. In the actual world (the 99.99% branch), the outcome is zero.
  4.  **No Ignorance:** The odds are known transparently.

  ---

  ### The Conceptual Issue: The Continuity Axiom

  The source of this fanatical recommendation is not the valuation of life itself, but the structural assumption of **Continuity** (also known as the Archimedean condition) within the von Neumann-Morgenstern axioms of rational preference.

  Continuity states that for any three outcomes $A \succ B \succ C$, there exists some probability $p$ such that a lottery yielding $A$ with probability $p$ and $C$ with probability $(1-p)$ is preferred to $B$ with certainty. In this case:
  *   $A$ = Save 20,000,000 lives.
  *   $B$ = Save 1,000 lives (Certain).
  *   $C$ = Save 0 lives.

  Continuity forces the agent to admit that if $A$ is sufficiently valuable, there is *some* probability $p$, however small, that makes the lottery preferable to the certain saving of 1,000 lives. Expected-value theory assumes utility is linear with probability, implying that once the ratio of value ($20,000,000 : 1,000$) exceeds the inverse ratio of probability ($10,000 : 1$), the gamble must be taken.

  **The Cost of Dropping It:**
  Rejecting Continuity allows for **lexical preferences** (e.g., "Saving 1,000 lives for sure is *always* better than any gamble with a >90% chance of saving zero, regardless of the upside"). However, dropping Continuity comes at a steep theoretical cost: it makes it impossible to represent preferences using a standard real-valued utility function. Decision theory loses its elegant mathematical representation, requiring complex lexicographic vectors or non-Archimedean fields, which complicates aggregation and trade-off analysis in all other domains of rational choice.

  ---

  ### The Natural Escape: Probability Thresholds

  The most natural escape is to adopt a **probability threshold rule**: ignore any probability below a certain cutoff (e.g., 1% or 1 in 10,000) when calculating expected value.

  **The Problem:**
  This rule lacks a principled stopping point. Why is 1 in 10,001 negligible while 1 in 10,000 is significant? This creates a "cliff edge" where a microscopic change in probability triggers a massive reversal in decision, which seems arbitrary.

  **Relocated Fanaticism:**
  This escape merely relocates the fanaticism to the threshold itself. The agent becomes fanatic about the cutoff value rather than the expected outcome. Furthermore, this rule blinds the agent to **existential risks**. If there is a 0.01% chance of human extinction (a finite but catastrophic loss), a threshold rule might instruct us to ignore it. Yet, common sense suggests we should not ignore low-probability, high-stakes events. By refusing to let small probabilities outweigh certain gains, we are forced to let small probabilities of catastrophe outweigh certain costs, or else accept inconsistency.

  ---

  ### Conclusion

  This example establishes that expected value is inherently a **risk-neutral aggregation mechanism**, not a predictor of actual outcomes. It treats probability purely as a weighting factor for value across possible worlds, rather than as a measure of realizability in the actual world. Consequently, expected-value maximization is structurally indifferent to the distribution of outcomes across possibilities; it cares only that the weighted sum is maximized, even if the weight rests on a possibility that will almost certainly not obtain.
