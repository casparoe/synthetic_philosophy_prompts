answer: |-
  **Project Title:** Fragmented Contributions: Disaggregating the Inefficacy Objection in Collective Harm

  **Statement of the Research Question**
  In moral and political philosophy, the "Inefficacy Objection" is a standard challenge to individual responsibility: if a single action makes no detectable difference to a harmful outcome, the agent bears no responsibility for that outcome. This objection is routinely deployed against three distinct types of individual choice: (1) **Additive Acts**, where many small inputs sum to a threshold of harm (e.g., carbon emissions); (2) **Market Participation**, where an individual purchase sustains a harmful industry regardless of marginal impact (e.g., factory-farmed meat); and (3) **Procedural Participation**, where an individual vote cannot sway an election but contributes to the legitimacy of the system (e.g., voting).

  Current discourse tends to treat these as variations of a single problem: the problem of overdetermination or negligible causal impact. Consequently, proposed solutions attempt to apply a single theoretical framework—such as expected utility, complicity, or group agency—across all three.

  This project asks: **Is the Inefficacy Objection a unified logical problem, or does it fracture into three distinct objections that succeed or fail independently depending on the structure of contribution?** Specifically, does the claim that "my act changes nothing" rely on the same definition of "change" in additive, market, and procedural contexts? If the structures are distinct, a unified moral theory of individual contribution may be impossible, requiring instead a typology of responsibility.

  **Why Existing Positions Leave This Open**
  The prevailing debate assumes that if one can solve the puzzle for one case (e.g., by arguing that expected utility is non-zero in additive cases), the solution transfers to the others. This assumption leaves a critical gap. It overlooks that the "harm" in each case is ontologically different. In additive cases, the harm is physical and cumulative. In market cases, the harm is often structural or symbolic, relying on the agent's relationship to a practice rather than physical causation. In procedural cases, the value at stake is not the outcome but the standing of the procedure itself.

  By conflating these structures, existing arguments risk category errors. A defense of voting based on "causal impact" fails because voting is not primarily causal; a defense of dietary choice based on "procedural integrity" fails because eating is not a civic procedure. Because the literature seeks a universal account of individual difference-making, it has not rigorously tested whether the Inefficacy Objection loses its force when the definition of "contribution" shifts from causal to constitutive to procedural. This project isolates these structures to determine if the objection stands or falls on its own merits in each domain.

  **Methodology and Work Plan**
  This project proceeds via conceptual analysis rather than empirical study or historical exegesis. The goal is not to re-argue the moral status of flying, eating meat, or voting, but to map the logical architecture of the arguments surrounding them. This approach is necessary because re-arguing the standard cases presupposes the very unity this project questions. Instead, I will treat the standard cases as data points to test the coherence of the Inefficacy Objection.

  The work will be conducted over six months on a part-time basis (approximately 10 hours per week).

  *   **Months 1–2: Structural Mapping.** I will rigorously define the three structures of contribution. This involves stripping away the specific moral content (e.g., climate change, animal suffering) to isolate the logical form of the agency involved. I will produce three formalized descriptions: one for threshold-based causation, one for market signaling/complicity, and one for procedural legitimacy.
  *   **Months 3–4: Stress-Testing the Objection.** I will apply the Inefficacy Objection to each structure independently. For the additive model, I will examine threshold probabilities. For the market model, I will examine the logic of demand and participation. For the procedural model, I will examine the conditions under which a procedure requires participation to remain valid. The aim is to see if the objection requires different premises to hold in each case.
  *   **Months 5–6: Synthesis and Drafting.** I will evaluate whether a single account of "contribution" can cover the findings from Months 3–4. If not, I will draft a typology showing where the objection holds and where it dissolves. The final output will be a polished research paper suitable for submission to an academic journal or presentation at a conference.

  **Expected Results and Criteria for Failure**
  A successful result will be a demonstrable map showing that the Inefficacy Objection is not monolithic. Success looks like proving that an agent can be causally inefficacious (Case 1) yet constitutionally efficacious (Case 2), or vice versa. This would establish that moral responsibility in collective contexts requires a pluralistic account of agency.

  The project would count as a failure if, upon rigorous formalization, the three structures collapse back into a single underlying logical form (e.g., if market participation and voting can both be fully reduced to expected utility calculations). Additionally, failure would result if the distinctions prove to be merely semantic rather than substantive, offering no new leverage on the moral questions. Given the six-month part-time scope, a secondary risk is overreach; success requires resisting the urge to solve the moral "ought" and sticking strictly to the metaphysical "can."

  **Scope and Feasibility**
  This proposal is scoped strictly for independent, part-time research. It does not require fieldwork, human subjects, or access to paid journals (relying on open-access materials and logical analysis). The limitation to three specific structures ensures the project remains bounded. I am not attempting to resolve the debate on climate ethics or voting theory broadly, but only to clarify the logical structure of the "no difference" claim within them. This narrow focus makes the six-month timeline realistic while offering a high-impact contribution: if the standard objection fragments, the burden of proof shifts back to those who claim individual acts do not matter, requiring them to specify *which* structure of harm they are addressing.
