  I am applying for a one-semester departmental writing fellowship and need a two-page research proposal. My half-formed idea concerns Fitch's paradox of knowability. The standard proof that not every truth can be knowable seems to rely on treating the knowledge operator as unindexed: if p is true but not known, then the proposition that p is true and not known is itself supposed to be knowable, and knowing it would require knowing both p and that p is not known, which is contradictory. I want to explore whether the paradox depends on a temporal equivocation. Replace the single operator K with a doubly indexed operator K(t,s), read as knowing at time t that p holds at time s, and define knowability as: for any p true at s, there is some t such that it is possible that K(t,s)(p). On this reading, the offending conjunct p and not K(s,s)(p) can be known at a later time without contradiction, because knowing at t that p was true at s and was not known at s does not require knowing p at s. The question is whether any such temporal indexing gives an anti-realist principle that is both Fitch-safe and strong enough to do the work the anti-realist wants, namely to tie truth to the possibility of knowledge in a non-trivial way. Turn this into a proposal with a precise statement of the question, why the existing responses to the paradox leave this temporal option underdeveloped, why a temporal approach is preferable to the usual restrictions on the knowability principle, the formal method I would use, what a successful result would look like and what would count as the project failing, and a realistic month-by-month plan for one semester. Do not include a bibliography or literature review by citation; I will add those. Please make the scope honest about what can be done in a semester.
