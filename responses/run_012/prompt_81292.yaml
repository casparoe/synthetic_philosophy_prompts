prompt: |-
  I'm running a 90-minute session in our second-year 'Rationality and Choice' seminar on money pumps, and specifically on whether being pumpable is the same thing as being irrational. Half the room has had a bit of decision theory; the other half signed up because the title sounded like a self-help book. So I can't assume anyone knows what an indifference curve is, and I also can't spend the hour on stuff the decision-theory half already has.

  Dont explain money pumps to me. Plan the class.

  What has to be in place before the pump reads as an argument rather than a magic trick? My hunch is that it's the idea of a preference ordering as something an agent can be held to across time, and that until they've got that, the pump looks like a card trick — but tell me if that's the wrong first move and what actually has to come before it.

  Which single example carries the whole thing, and what does it have to have and lack? I was going to use the usual one — person with intransitive preferences over three dinners slowly drained of cash — but I suspect it smuggles in the conclusion, and I'd rather have something where every individual trade looks reasonable from the inside and the trap only appears from outside. It has to be small enough to draw on a whiteboard, and it has to survive the obvious objection that the agent would just notice the pattern and stop.

  Then the misconception map, in the order they'll actually surface, with the exact point in the sequence where I should head each off. My guesses: that the pump proves intransitivity is irrational all by itself; that the seller has to be a mind-reader or the agent has to be an idiot; that 'resolute choice' is just cheating; and — the one I care most about — that they'll collapse the pump for intransitive preferences into the pump for preferences that shift over time, when I think those are doing seperate jobs and I want that difference to be the payoff of the session rather than a footnote at the end.

  What should I openly refuse to go into at this level (I'm thinking the Dutch book and the empirical preference-reversal literature), and what's the one question I can put to them at the end that tells me whether they've got the structure of a coherence argument rather than just memorized a puzzle? Also give me the ordering with the dependencies marked, since I keep catching myself wanting to say 'and of course, by transitivity...' three minutes in. No reading list — they wont do it and it's not what I need from you.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** 90-minute seminar, 2nd-year undergrads ("Rationality and Choice").
      *   **Audience:** Mixed background (50% decision theory, 50% "self-help" curiosity). No assumed knowledge of indifference curves, but can't bore the DT half.
      *   **Topic:** Money pumps (specifically: does being pumpable = irrational?).
      *   **Constraints:** Do *not* explain money pumps to me (the user). Plan the class.
      *   **Key Questions to Answer:**
          1.  What conceptual prerequisite makes the pump an *argument* rather than a *trick*? (User hunches it's preference ordering across time).
          2.  Which *single example* carries the load? (Needs to avoid smuggling conclusions, individual trades must look reasonable, trap visible from outside, whiteboard-friendly, survive "just stop" objection).
          3.  Misconception map (order of surfacing, when to head off).
          4.  What to exclude (Dutch book, empirical lit).
          5.  Final assessment question (tests structure of coherence argument vs. memorized puzzle).
          6.  Ordering/Dependencies (prevent premature use of "transitivity").

  2.  **Deconstruct the Core Philosophical Problem:**
      *   The money pump argument is a *coherence argument*. It argues that if your preferences violate certain axioms (like transitivity), you can be forced into a situation where you end up worse off by your own lights.
      *   The user's hunch is correct but needs refinement. It's not just "preference ordering across time." It's the idea that *preferences govern choice* and *choice reveals preference* in a way that commits the agent to a consistent policy. If preferences are just momentary impulses, the pump is just a series of different people making different choices. To be a pump *of an agent*, the agent must persist.
      *   *Refinement:* The prerequisite is **Agency Continuity**. The agent at $t_1$ and the agent at $t_3$ are the same entity responsible for the cumulative outcome. Without this, it's just a series of unrelated trades.

  3.  **Select the Example:**
      *   *Standard:* A > B > C > A (Dinner example).
      *   *Problem:* Often feels abstract or assumes the agent *must* trade.
      *   *Requirement:* Individual trades must look reasonable from the inside. Trap visible from outside. Survive "just stop."
      *   *Idea:* The "Job Market" or "Apartment Hunt" scenario.
      *   *Better Idea:* **The Museum Pass / Ticket Swap.**
      *   *Best Idea:* **The "Three Drinks" or "Three Gadgets" with a Transaction Cost.**
      *   *Wait, let's look for something where the "stop" objection is hardest to make.*
      *   *Candidate:* **The Indecisive Commuter.**
      *   *Actually, the classic A>B>C>A is best if framed correctly.* Let's stick to the user's intuition about the dinner example but refine the *framing* to avoid smuggling.
      *   *Refined Example:* **The Office Swap.**
          *   Agent has an Office, a Desk, and a Chair.
          *   Prefers Office > Desk (for status).
          *   Prefers Desk > Chair (for utility).
          *   Prefers Chair > Office (for comfort).
          *   *Critique:* Still feels like standard intransitivity.
      *   *Let's try the "Small Improvements" argument (Parfit/Andreou).*
          *   A vs A+ (A+ is slightly better).
          *   A+ vs B (B is slightly better).
          *   ...
          *   Z vs A.
          *   *Too complex for 90 mins.*
      *   *Let's go with the User's Dinner idea but fix the "smuggling".*
      *   *Fix:* Make the trades *sequential* and *costly*, but emphasize that at each step, the agent *freely chooses* to pay.
      *   *Example:* **The Collectible Card Swap.**
          *   You have Card A. Someone offers Card B + $1 for Card A. You take it (B > A).
          *   Someone offers Card C + $1 for Card B. You take it (C > B).
          *   Someone offers Card A + $1 for Card C. You take it (A > C).
          *   Now you have Card A and -$3.
          *   *Why this works:* It's concrete. The "just stop" objection is the key hurdle.
          *   *How to survive "just stop":* The agent doesn't know it's a cycle. The trader is different each time, or the context changes slightly. Or, crucially, the agent *doesn't view it as a cycle* because preferences are context-dependent (framing).
          *   *Decision:* Let's use **The Apartment Hunt**. It involves time, commitment, and small differences.
          *   *Actually, keep it simpler for the whiteboard.* **The Three Phones.**
          *   Phone A (Great camera, bad battery).
          *   Phone B (Great battery, okay camera).
          *   Phone C (Okay battery, great screen).
          *   Preferences: B > A, C > B, A > C.
          *   *Why:* It explains *why* the preferences exist (multi-attribute) without assuming irrationality upfront. It makes the intransitivity look like a reasonable mistake rather than stupidity.
          *   *Addressing "Just Stop":* The pump requires the agent to *not anticipate* the cycle. This leads to the core distinction: **Naive vs. Sophisticated**. This is crucial for the "rationality" debate.

  4.  **Address the "Argument vs. Trick" Prerequisite:**
      *   User hunch: Preference ordering across time.
      *   My adjustment: It's **Dynamic Consistency**. The agent must care about the *sequence* of outcomes, not just the immediate swap. If the agent only cares about the immediate swap, they aren't being pumped; they are just satisfying local desires. To be irrational, they must have a global preference (e.g., "I prefer having $100 to $90") that is violated by the sequence of local choices.
      *   *Key Concept:* **The Principle of Event-Wise Dominance** (or simply: caring about the final state).

  5.  **Misconception Map:**
      1.  "It's just a trick/stupidity." (Head off early: Assume the agent is smart but has this specific preference structure).
      2.  "They would just stop." (Head off mid: Introduce Naive vs. Sophisticated).
      3.  "Intransitivity is the only cause." (Head off late: Distinguish from Time-Inconsistency).
      4.  "Resolute Choice is cheating." (End: Is it rational to bind yourself?).

  6.  **Exclusions:**
      *   Dutch Book (too probabilistic/betting focused).
      *   Empirical Preference Reversal (Lichtenstein/Slovic) - too much noise, distracts from normative argument.
      *   Representation Theorems (too technical for the self-help half).

  7.  **Final Assessment Question:**
      *   Needs to test if they understand *why* the pump is bad, not just *that* it is bad.
      *   Question: "If an agent knows they are in a pump, but cannot change their preferences, only their choice mechanism, what should they do?" (Tests Resolute Choice vs. Sophistication).
      *   *Better:* "Does the money pump prove you shouldn't have intransitive preferences, or that you shouldn't act on them sequentially?"

  8.  **Drafting the Plan (Iterative refinement):**
      *   *Timing:* 90 mins.
      *   *Structure:*
          1.  Setup (15 mins): The Prerequisite (Agency).
          2.  The Example (30 mins): The Three Phones (or similar). Walkthrough.
          3.  The Objections (30 mins): "Just stop", "Mind reader", "Resolute".
          4.  The Payoff (15 mins): Intransitivity vs. Time-Inconsistency.
      *   *Dependencies:* Must establish "Agent persists" before "Agent loses money." Must establish "Naive" before "Sophisticated."

      *   *Refining the "Argument vs Trick" point:* The user asked what has to be in place. It's **The Normative Force of Consistency**. The pump only works if we assume the agent *ought* to maximize their own welfare across the sequence. If we are mere behaviorists, the pump is just observation. So, we need **Welfarism** + **Agency Continuity**.

      *   *Refining the Example:* The "Three Dinners" is actually fine *if* the attributes are explicit. Let's use **The Car Buy**.
          *   Car A: Fast, Ugly, Cheap.
          *   Car B: Slow, Beautiful, Cheap.
          *   Car C: Fast, Beautiful, Expensive.
          *   Wait, intransitivity usually comes from weighting attributes differently.
          *   Let's stick to the **Three Jobs** example.
          *   Job A: High Pay, Long Commute.
          *   Job B: Low Pay, Short Commute.
          *   Job C: Medium Pay, Medium Commute.
          *   Actually, the simplest is the **Gardener's Dilemma** (Schelling-esque).
          *   No, let's go with the user's **Dinner** idea but make the *trades* the focus.
          *   *Revised Example:* **The Ticket Scalper.**
          *   You have a Ticket to Play A.
          *   Trader 1: I'll give you Ticket B + $1 for Ticket A. (You prefer B to A).
          *   Trader 2: I'll give you Ticket C + $1 for Ticket B. (You prefer C to B).
          *   Trader 3: I'll give you Ticket A + $1 for Ticket C. (You prefer A to C).
          *   *Why:* It isolates the preference from the object. It makes the "stop" objection the central tension.

      *   *Refining the "Intransitivity vs Time-Inconsistency" distinction:* This is the payoff.
          *   Intransitivity: A>B, B>C, C>A (at same time).
          *   Time-Inconsistency: A(t1) > B(t1), but B(t2) > A(t2).
          *   Money pumps work on both, but the *solution* differs. Resolute choice fixes time-inconsistency. Changing preferences fixes intransitivity.
          *   *Wait, standard money pump targets Intransitivity.* Time-inconsistency is usually targeted by *Dynamic Choice* problems (e.g., Ulysses).
          *   *Correction:* There is a "Dynamic Money Pump" for time inconsistency. But the classic one is for intransitivity.
          *   *User's Goal:* They want to distinguish the pump for intransitive preferences from the pump for preferences that shift over time.
          *   *Key Distinction:* In the intransitive pump, the agent is *wrong* about their ranking. In the time-shift pump, the agent is *different* (or the context changed). The irrationality in the first is logical; in the second, it's about self-control.
          *   *Actually, the "Dynamic Money Pump" (Ahmed 2010)* targets backward induction.
          *   *Let's keep it simple:* The standard pump assumes static preferences. If preferences shift, it's not a pump of *logic*, it's a pump of *weakness*. The user wants to make sure students don't conflate "I changed my mind" with "My mind is broken."

  9.  **Finalizing the Plan Structure:**
      *   **Phase 1: The Condition of Possibility (20 mins).** Agency & Dominance.
      *   **Phase 2: The Mechanism (30 mins).** The Ticket Example. Naive vs. Sophisticated.
      *   **Phase 3: The Objection Handler (25 mins).** Misconception Map.
      *   **Phase 4: The Payoff (15 mins).** Static vs. Dynamic preferences. Final Question.

  10. **Review against constraints:**
      *   No indifference curves.
      *   Don't explain money pumps to me.
      *   Ordering with dependencies.
      *   No reading list.
      *   Address the "Argument vs Trick" hunch.

      *Self-Correction on "Argument vs Trick":* The user's hunch is "preference ordering as something an agent can be held to across time." I need to validate this but sharpen it. It's not just "held to," it's that the agent *cares* about the final outcome more than the transaction. If they only care about the transaction (the "thrill of the trade"), no pump occurs. So the prerequisite is **Outcome-Oriented Agency**.

      *Self-Correction on Example:* The "Ticket Scalper" is good. It survives the "notice the pattern" objection if we specify the traders are distinct and the agent is **Naive** (doesn't look ahead). This introduces the Naive/Sophisticated distinction which is vital for the "rationality" debate.

      *Self-Correction on Misconceptions:*
      1.  "It's a trick." -> Address in Phase 1 (Idealization).
      2.  "Just stop." -> Address in Phase 2 (Naivety).
      3.  "Resolute choice is cheating." -> Address in Phase 3.
      4.  "Intransitivity = Time Shift." -> Address in Phase 4 (Payoff).

      *Final Question:* Needs to test coherence. "If you could pay $5 to lock yourself out of the market before the first trade, should you?" (Yes = Sophisticated/Resolute. No = Naive/Committed to local rationality).

      *Let's write it.*
answer: |-
  Here is the 90-minute plan. It is structured to prevent the "decision theory" half from checking out while ensuring the "self-help" half doesn't get lost in notation.

  ### 1. The Prerequisite: Argument vs. Magic Trick (20 Minutes)

  **Your Hunch:** You are half-right. "Preference ordering across time" is necessary, but it's not the *first* thing. If you start with time, you invite the "preferences change" objection too early.

  **The Actual Prerequisite:** **Outcome Dominance.**
  Before the pump reads as an argument, the students must accept that the agent cares about the *final state*, not just the *transaction*.
  *   **The Magic Trick View:** The agent enjoys the act of swapping. They trade A for B because they like B, then B for C because they like C. They end up with A minus cash, but they enjoyed the swaps. No irrationality, just a hobby.
  *   **The Argument View:** The agent prefers *having* A to *having* A-minus-cash. The trades are merely instruments. If the instrument destroys the goal, the instrument is faulty.

  **The Move:**
  Do not draw a cycle yet. Draw two states on the board.
  *   **State 1:** Agent has Item X.
  *   **State 2:** Agent has Item X minus $10.
  *   **Ask:** "By your own lights, which state is better?"
  *   **Constraint:** Everyone must agree State 1 is better. If someone says "I don't care about money," the pump fails. Establish **Welfarism**: The agent wants to maximize their own welfare, and money is a proxy for welfare.

  **Dependency:** You cannot introduce the cycle until you have established that ending up with less money (for the same good) is *bad* by the agent's own definition.

  ### 2. The Single Example: The Ticket Scalper (30 Minutes)

  **Why this example:**
  *   **Whiteboard friendly:** Three boxes (Ticket A, Ticket B, Ticket C) and arrows.
  *   **Reasonable from inside:** Preferences are based on attributes, not madness.
  *   **Survives "Just Stop":** It forces the Naive vs. Sophisticated distinction.

  **The Setup:**
  The agent is at a music festival. They hold a ticket for **Stage A** (Indie Rock).
  There are three traders roaming the crowd. They do not know each other.
  *   **Trader 1:** "I'll swap you Stage A for Stage B (Jazz) + $1."
      *   *Agent's Preference:* B > A (Agent prefers Jazz). Trade happens.
  *   **Trader 2:** "I'll swap you Stage B for Stage C (Electronic) + $1."
      *   *Agent's Preference:* C > B (Agent prefers Electronic). Trade happens.
  *   **Trader 3:** "I'll swap you Stage C for Stage A (Indie) + $1."
      *   *Agent's Preference:* A > C (Agent prefers Indie). Trade happens.

  **Result:** Agent has Ticket A and -$3. They are back where they started, but poorer.

  **The "Just Stop" Objection (Crucial Pivot):**
  The decision-theory half will raise their hands immediately: "The agent would anticipate the cycle and refuse Trade 1."
  *   **Do not dismiss this.** This is the core of the session.
  *   **Split the Room:**
      *   **Group 1 (Naive):** The agent only looks at the trade in front of them. They treat every trader as a unique event. They do not model the future.
      *   **Group 2 (Sophisticated):** The agent looks ahead, sees the loop, and refuses Trade 1.
  *   **The Trap:** If they are Sophisticated, the pump doesn't happen. So, does the money pump argument only work on idiots?
  *   **The Resolution:** The argument isn't that real people *will* be pumped. It's that if you are Naive, you *must* be pumped. Therefore, Rationality requires either **Transitivity** (fix the preferences) or **Sophistication/Resoluteness** (fix the choice mechanism).

  **Dependency:** You must define "Naive" *before* you discuss whether the agent is irrational. If you assume Sophistication too early, the pump vanishes. If you assume Naivety without stating it, the "just stop" objection kills the room.

  ### 3. The Misconception Map (25 Minutes)

  Address these in this specific order. If you change the order, the logic collapses.

  **1. "The Seller is a Mind-Reader / The Agent is an Idiot"**
  *   *When it surfaces:* Immediately after the Ticket Example.
  *   *The Fix:* Idealization. We are testing the *structure* of the preferences, not the agent's street smarts. Assume the traders are opportunistic, not omniscient. The agent isn't stupid; they are *locally rational* (making the best choice at every node) but *globally irrational*.
  *   *Board Note:* Write **Local Rationality ≠ Global Rationality**.

  **2. "Resolute Choice is Just Cheating"**
  *   *When it surfaces:* When you suggest the Sophisticated agent just refuses Trade 1 despite preferring B to A.
  *   *The Fix:* Is it cheating to bind yourself? If I know I'll regret eating the cake, locking the fridge isn't cheating; it's rational planning. Resolute choice is the agent at $t_1$ imposing a constraint on the agent at $t_2$.
  *   *Board Note:* **Precommitment**.

  **3. "The Pump Proves Intransitivity is Irrational All By Itself"**
  *   *When it surfaces:* Near the end of the objection phase.
  *   *The Fix:* Nuance. The pump proves that *acting* on intransitive preferences sequentially is costly. If I have intransitive preferences but never face sequential choices (I choose once from a menu of {A,B,C}), I never get pumped. The irrationality is in the **dynamic choice**, not just the static ranking.

  **4. "Intransitivity is the Same as Preferences Shifting Over Time" (The Payoff)**
  *   *When it surfaces:* The final confusion. "Isn't this just me changing my mind?"
  *   *The Fix:* This is where you separate the two jobs.
      *   **Case A (Intransitivity):** At $t_1$, I prefer A>B, B>C, C>A. My preferences are contradictory *now*. The pump exploits a logical error.
      *   **Case B (Time-Inconsistency):** At $t_1$, I prefer A>B. At $t_2$, I prefer B>A. My preferences changed. The pump exploits a *temporal* error.
      *   **Why it matters:** In Case A, the solution is to fix my logic (make preferences transitive). In Case B, the solution is to fix my self-control (precommitment). The Money Pump targets Case A. The "Dynamic Choice" problem targets Case B. Conflating them means you don't know whether to fix your logic or your willpower.

  **Dependency:** You cannot distinguish Case A and Case B until you have established that the standard pump assumes static preferences (Case A).

  ### 4. Exclusions & Boundaries (5 Minutes)

  **Openly Refuse To Go Into:**
  1.  **Dutch Books:** Tell them, "That's the betting cousin of this argument. It deals with probabilities. We are dealing with pure preference. Same skeleton, different skin. We skip it to avoid confusion."
  2.  **Empirical Preference Reversal (Lichtenstein/Slovic):** Tell them, "Psychologists love to show people *do* act this way. We are asking if they *should*. Descriptive vs. Normative. We are doing Normative."

  **Why:** The DT half will want to show off knowledge of Dutch Books. The Self-Help half will get bogged down in "but people really do this." Shut both down to keep the focus on *coherence*.

  ### 5. The Final Assessment Question (10 Minutes)

  Do not ask them to define a money pump. That tests memory. Ask them to apply the structure of the coherence argument.

  **The Question:**
  > "Imagine you know you have intransitive preferences (A>B>C>A). You are about to enter a market where you will face these trades sequentially. You have two options:
  > 1.  Pay $5 to have your preferences forcibly altered to be transitive (you lose the ability to prefer C>A).
  > 2.  Pay $5 to bind yourself so you cannot make any trades after the first one.
  >
  > Which option protects you from the money pump, and which option protects you from *yourself*? Are they the same?"

  **What this tests:**
  *   If they say "Option 1 fixes the pump," they understand the pump targets the *preference structure*.
  *   If they say "Option 2 fixes the pump," they understand the pump targets the *sequential choice*.
  *   **The Correct Insight:** Option 2 (binding choice) stops the pump *without* fixing the preferences. This proves the pump is an argument about **choice architecture**, not just preference ordering. It reveals that rationality might be about managing your limitations, not just eliminating them.

  ### 6. Ordering & Dependencies Summary

  1.  **Outcome Dominance** (Must establish that losing money for the same good is bad).
      *   *Depends on:* Nothing.
      *   *Enables:* The claim that the pump is harmful.
  2.  **The Ticket Example** (Must illustrate the cycle).
      *   *Depends on:* Outcome Dominance.
      *   *Enables:* The Naive vs. Sophisticated distinction.
  3.  **Naive vs. Sophisticated** (Must explain why the agent doesn't stop).
      *   *Depends on:* The Ticket Example.
      *   *Enables:* The defense against "Just Stop."
  4.  **Local vs. Global Rationality** (Must define the type of irrationality).
      *   *Depends on:* Naive vs. Sophisticated.
      *   *Enables:* The distinction between fixing preferences vs. fixing choice.
  5.  **Intransitivity vs. Time-Inconsistency** (The Payoff).
      *   *Depends on:* Local vs. Global Rationality.
      *   *Enables:* The Final Assessment Question.

  **Instructor Warning:**
  Do not say "By transitivity..." until Minute 45. If you use the word "transitivity" in the first 20 minutes, the DT half will nod off (they know the axiom) and the Self-Help half will freeze (they don't know the axiom). Use "Circular Preferences" or "Rock-Paper-Scissors Preferences" until you have formally defined the problem. Only introduce the technical term once the problem is felt.
