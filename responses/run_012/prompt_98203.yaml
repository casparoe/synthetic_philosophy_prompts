answer: |-
  You are reaching for a distinction that political philosophers have wrestled with for decades, often termed the difference between **Retrospective Guilt** and **Prospective Responsibility**. Your intuition that you can have one without the other is correct, but your friction comes from trying to ground that distinction in *blood* or *birth* rather than *structure* and *membership*.

  Here is the principled line that resolves most of your cases without forcing you to abandon your core moral instincts.

  ### The Principle: Successor Liability without Moral Culpability

  Treat a nation (or corporation) not as a family, but as a **legal corporation that outlives its members.**

  1.  **Guilt (Moral/Legal):** Attaches only to the *agents* who committed or endorsed the act. It is backward-looking. It **cannot** be inherited.
  2.  **Liability (Political/Structural):** Attaches to the *entity* that holds the assets and continues the project. It is forward-looking. It **is** inherited by new members who accept the benefits of membership.

  This allows you to say: *"You are not to blame for the crime, but you are responsible for the bill because you inherited the estate."*

  ### Applying the Principle to Your Cases

  **1. The Camp Commander vs. The 1985 German**
  *   **Verdict:** Consistent.
  *   **Why:** The commander is an *agent*; he bears Guilt. The 1985 German is a *shareholder* in the Federal Republic of Germany. She bears no Guilt, but she inherits the **Liability** of the state.
  *   **Correction:** You wrote that you "can't say why the German doesn't owe anything *qua German*." Under this principle, she *does* owe *qua German*. Her taxes fund the memorials; her state pays the reparations. Her obligation is "keep memory honest" because that is the specific line item on Germany's balance sheet of historical debt. You don't need to drop this verdict, but you must acknowledge her obligation is civic, not moral.

  **2. The Slave-Owner Descendant (Same Land)**
  *   **Verdict:** Consistent.
  *   **Why:** This is **Unjust Enrichment**. Even if the *State* liability is shared by all citizens, this individual holds specific *assets* (the land) that are the direct proceeds of the crime. This creates a specific *property-based liability* on top of the general civic one.

  **3. The 1920 Immigrant American**
  *   **Verdict:** Consistent (and explains your bug).
  *   **Why:** You are confused because you think citizenship is about *ancestry*. Under the Corporate Principle, citizenship is about **contract**. By becoming a citizen, he bought stock in the United States. He receives the dividends (security, infrastructure, accumulated wealth). Therefore, he inherits the outstanding debts of the corporation, even if he wasn't there when the debt was incurred.
  *   **The Bug:** You feel the American owes *qua American* but hesitated on the German *qua German*. The principle says **both owe *qua* citizen.** The difference in *degree* comes from the **Continuity of Harm**.
      *   In Germany, the regime was broken, occupied, and re-founded (1945). The debt is largely historical/memory-based.
      *   In the US, the legal structure continued through slavery, Jim Crow, and redlining without a total break. The debt is *structural* and *compounding*.
      *   **Principle:** Liability tracks the **continuity of the injustice**, not just the continuity of the state.

  **4. The Activist Descendant**
  *   **Verdict:** Refine this one.
  *   **Why:** Fighting the legacy does not discharge the *debt* (the structural harm remains), but it discharges his *personal moral stain*. He moves from "passive beneficiary" to "active repairer." He still owes the civic obligation (taxes/votes), but he is no longer complicit in the *silence* that compounds the debt.

  **5. Victim/Perpetrator Group**
  *   **Verdict:** Consistent.
  *   **Why:** Guilt is agent-specific. A victim group can be collectively victimized by an outside power while containing individuals who are guilty of crimes against insiders. Collective victimhood does not grant individual immunity.

  ### Choice (Corp/Church) vs. Birth (Nation)

  Does the principle change? **No, but the enforceability does.**

  *   **Choice-Based (Corp/Church):** Membership is contractual. Liability is clearer. If you stay in the church and enjoy its social capital, you inherit its reputational and financial debts.
  *   **Birth-Based (Nation):** Membership is involuntary. This makes the "contract" theoretical. However, the **Benefit Principle** overrides the **Consent Principle**. If you enjoy the benefits of the nation's stability and wealth (which you cannot opt out of without leaving), you inherit the liabilities.

  ### What You Must Surrender

  You have to surrender the idea that the **1920 Immigrant** is a unique case compared to the **1985 German**.
  *   **Current Intuition:** The American immigrant owes something special *qua American* that feels distinct from the German's obligation.
  *   **Required Shift:** Acknowledge that both owe *qua Citizen*. The difference is not the *source* of the obligation (citizenship), but the *nature* of the debt (structural/wealth-based in the US vs. memory/vigilance-based in Germany). If you accept that the German *does* owe *qua German* (which you hinted at with "standing obligation"), the tension dissolves.

  ### Predictions for Your Two New Cases

  **Case 1: A Corporation still around and profitable from 1890 wrongs.**
  *   **Prediction:** **Liable.**
  *   **Reasoning:** The legal entity is continuous. The assets (profits) are the direct fruit of the wrong. The current shareholders are innocent of the *act* (no Guilt), but they hold the *proceeds* (Liability). They must pay restitution from current profits, even if it reduces dividends.
  *   **Example:** This is why banks like JPMorgan Chase or insurers like AIG have faced claims regarding slavery-era financing.

  **Case 2: A Corporation dissolved decades ago, assets scattered.**
  *   **Prediction:** **Not Liable (with a caveat).**
  *   **Reasoning:** The "Corporate Body" that committed the act no longer exists. There is no estate to tax. The liability dissipates because there is no continuous entity to hold the debt.
  *   **Caveat:** If the assets were scattered via *fraudulent conveyance* (dissolved specifically to avoid the debt), the liability pierces the veil and attaches to the individuals who stripped the assets. If it was a natural death, the debt dies with the entity.

  ### Summary
  You are not improvising. You are intuitively separating **Guilt** (which dies with the perpetrator) from **Debt** (which attaches to the estate). Stick to that. The American owes because he holds US "stock." The German owes because she holds German "stock." The amount owed depends on how much the original crime still inflates the current value of that stock.
