answer: |-
  # SEMINAR HANDOUT: THE BELIEF DECISION TREE

  **STARTING COMMITMENT:**
  *Everyone in this room agrees on the following:*
  > **"Treating the system *as if* it had beliefs is sometimes the best way to predict and explain what it does."**

  *Follow the path that matches your intuition about the cases below. Do not worry about the names of the positions; answer the questions about the systems.*

  ---

  ### NODE 1: The LLM Character (Case 3)
  **Case:** A system says it believes the meeting is on Tuesday *only* because the user's prompt cast it as a character and that line was the likely continuation. Nothing else in its behavior depends on this state.
  **Question:** Does the system *literally* believe the meeting is on Tuesday?

  *   **YES** → Go to **Leaf A**.
  *   **NO** → (Belief requires more than conversational fit). Go to **Node 2**.

  ---

  ### NODE 2: The Lookup Table (Case 1)
  **Case:** A lookup table stores an enormous list of input-output pairs. It behaves exactly as a reasoning model does, so the two cannot be told apart from the outside.
  **Question:** Does the Lookup Table have beliefs?

  *   **YES** → (Belief is defined by input-output success). Go to **Node 3**.
  *   **NO** → (Belief requires specific internal machinery). Go to **Node 4**.

  ---

  ### NODE 3: Indeterminacy
  **Case:** Imagine two incompatible sets of beliefs (e.g., it believes *P* vs. it believes *Q*) both predict the Lookup Table's behavior equally well.
  **Question:** Is there a fact of the matter about which set is actually correct?

  *   **YES** → Go to **Leaf B**.
  *   **NO** → Go to **Leaf C**.

  ---

  ### NODE 4: The Inert State (Case 4)
  **Case:** A representation is written into an internal store that no process ever reads, so it is inert and makes no difference to anything the system does.
  **Question:** Is that inert state a belief?

  *   **YES** → Go to **Leaf D**.
  *   **NO** → (Belief must play a causal role). Go to **Node 5**.

  ---

  ### NODE 5: The Hand-Assembled Twin (Case 5)
  **Case:** A system is internally and behaviorally identical to a learning agent but was hand-assembled by an engineer rather than learned.
  **Question:** Does the Hand-Assembled Twin have the same beliefs as the learned agent?

  *   **NO** → Go to **Leaf E**.
  *   **YES** → (History is irrelevant to current belief). Go to **Node 6**.

  ---

  ### NODE 6: The RL Agent (Case 2)
  **Case:** A reinforcement-learning agent's world model encodes the layout of a maze and is consulted when it plans, but it never says anything about the maze and could not report what it encodes.
  **Question:** Does the agent have beliefs about the maze?

  *   **NO** → Go to **Leaf F**.
  *   **YES** → Go to **Leaf G**.

  ---

  ## THE POSITIONS (LEAVES)

  ### Leaf A: Radical Pragmatism
  *   **Commitment:** Belief is nothing over and above the utility of the attribution in a specific context.
  *   **Awkward Commitment:** The system can believe contradictions if the prompt demands it, and beliefs vanish when the context changes.
  *   *(Note: Unnamed in standard literature; often collapses into Pure Instrumentalism.)*

  ### Leaf B: Interpretive Realism
  *   **Commitment:** Beliefs are real patterns fixed by the single best interpretation of the system's behavior.
  *   **Awkward Commitment:** There is no physical fact that makes one interpretation right; reality depends on the idealization of the observer.
  *   *(Note: Indistinguishable from some versions of Functional Role Semantics by this tree.)*

  ### Leaf C: Pure Instrumentalism
  *   **Commitment:** Belief talk is a tool for prediction, not a description of reality; there is no truth to the attribution.
  *   **Awkward Commitment:** You cannot say the system is mistaken about its own beliefs, only that your tool is less useful.
  *   *(Note: Often associated with Fictionalism.)*

  ### Leaf D: Structural Realism
  *   **Commitment:** Belief is a stored representation regardless of whether it is ever used or accessed.
  *   **Awkward Commitment:** A system can believe things that never influence its actions, other thoughts, or outputs.
  *   *(Note: Generally considered unattractive; few defend this view.)*

  ### Leaf E: Teleosemantics
  *   **Commitment:** Belief depends on the history of how the state was produced (evolution, learning, or design function).
  *   **Awkward Commitment:** A perfect physical duplicate of a human created by accident (e.g., a quantum fluctuation) would have no beliefs.
  *   *(Note: Indistinguishable from Historical Functionalism by this tree.)*

  ### Leaf F: Higher-Order Theory
  *   **Commitment:** Belief requires the ability to represent, access, or report one's own internal states.
  *   **Awkward Commitment:** Most animals, infants, and non-reflective adults lack beliefs.
  *   *(Note: Sometimes grouped under Doxastic Voluntarism.)*

  ### Leaf G: Functional Role Semantics
  *   **Commitment:** Belief is an internal state that plays a specific causal role in guiding action and inference.
  *   **Awkward Commitment:** Simple thermostats or bacteria might qualify if the bar for "functional role" is set too low.
  *   *(Note: The standard "Realist" view in cognitive science.)*

  ---

  ## UNOCCUPIED LOGICAL SPACE

  **1. The "Inert History" Combination**
  *   **Path:** Answering **YES** at Node 4 (Inert State is a belief) but **NO** at Node 5 (History matters).
  *   **Status:** **Incoherent.** If a state is causally inert, it is unclear how its causal history could determine its content. This view is unexplored because it lacks a mechanism for fixing meaning.

  **2. The "Character vs. Table" Combination**
  *   **Path:** Answering **YES** at Node 1 (LLM Character believes) but **NO** at Node 2 (Lookup Table does not).
  *   **Status:** **Inconsistent.** Both cases rely on surface behavior without integrated internal states. Holding this combination suggests a bias toward linguistic output over other behaviors without a principled distinction.

  **3. The "Realist Instrumentalist" Combination**
  *   **Path:** Answering **YES** at Node 2 (Table believes) but **NO** at Node 3 (No fact of the matter).
  *   **Status:** **Unattractive.** This claims the system *has* beliefs, but denies there is any truth to *which* beliefs it has. Most philosophers collapse this into Pure Instrumentalism (Leaf C).

  ---

  ## NOTE ON INDISTINGUISHABLE VIEWS
  This tree sorts participants by substantive commitments. However, famous philosophical labels may land on the same leaf:
  *   **Leaf B (Interpretive Realism)** and **Leaf G (Functional Role Semantics)** often converge on the same answers, though they motivate them differently (one from the observer's side, one from the system's side). If you land here, you agree on the *conditions* for belief, even if you disagree on the *metaphysics*.
  *   **Leaf C (Pure Instrumentalism)** and **Leaf A (Radical Pragmatism)** are functionally identical in practice, though Leaf A allows for temporary "truth" within a context while Leaf C denies truth entirely.
