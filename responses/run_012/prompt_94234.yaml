answer: |-
  Your survival depends on conceding that PCI works empirically while insisting that IIT's metaphysical claims about exclusion are mathematically underdetermined.

  **1. The Panpsychist (Highest Logical Damage)**
  *Objection:* "You claim exclusion is bolted on, but it's the mathematical shadow of the axiom of Uniqueness. Consciousness is unitary; therefore, overlapping subjects are impossible. Your two-bridge case assumes the complexes exist *before* exclusion applies, but exclusion is what *defines* the complex. You're begging the question by treating the boundary as arbitrary before running the maximization."
  *Two-Minute Reply:* "Uniqueness says 'one stream,' but it doesn't say 'maximize Φ to find it.' That's a leap. There are infinite ways to enforce uniqueness without choosing the Φ-maximum—e.g., fixed anatomical boundaries, functional modularity, or even a 'minima' rule. IIT chooses the maximum because it wants consciousness to be 'as much as possible,' but that's a value judgment, not a logical derivation from 'one stream.' My two-bridge case shows that when you have two local maxima close in value, the theory doesn't tell you which one is the 'real' subject without arbitrarily sharpening the grain. If exclusion defines the boundary, but the boundary determines the Φ which determines the exclusion, you have a circularity that Uniqueness doesn't resolve."
  *Soft Spot:* IIT 4.0 proponents argue the derivation is tighter now via the "composition" principle. If they cite specific formalism updates, you might look outdated. You're bluffing that there isn't a rigorous derivation you haven't seen.

  **2. The Experimentalist (Highest Practical Damage)**
  *Objection:* "I use PCI to wake up coma patients. PCI is essentially a simplified Φ. If you show boundary drift and arbitrariness in Φ, are you telling me my biomarker is unstable? If the verdict flips on how I redraw the boundary, my clinical diagnosis flips. Is consciousness measurement just numerology with a nice diagram?"
  *Two-Minute Reply:* "No, and this is crucial: PCI predicts *arousal*, not *content* or *subjecthood*. It measures the complexity of the response to perturbation, which correlates with wakefulness. That works even if the metaphysical claim—that high Φ *is* consciousness—is false. You can keep the tool as a robust heuristic for system integration without buying the ontology that says the tool measures 'experience.' My critique targets the identity claim (Φ = consciousness), not the correlation claim (Φ ≈ wakefulness). Your data survives because it's empirical, not because IIT is true."
  *Soft Spot:* If Φ is arbitrary, why does a Φ-like measure correlate so well with reality? You're implying the measure captures something real while denying the theory explains it. That's a hard line to walk without sounding like you're having your cake and eating it.

  **3. The Computational Neuroscientists (Highest Credibility Damage)**
  *Objection:* "Okay, Φ is numerology. We agree. But if the axioms do 'none of the work,' what are they doing? If they don't constrain the math, they're just poetry. Why should we care about a phenomenological list that doesn't predict anything? You're clearing the deck but not building anything. Why not just use Predictive Processing metrics?"
  *Two-Minute Reply:* "The axioms aren't doing the *calculational* work, they're doing the *descriptive* work. They codify the data of experience—integration, exclusion, composition—that any theory must eventually explain. Currently, IIT tries to force the math to match the axioms and fails on exclusion. My point is we should keep the data (axioms) but drop the forced machinery (Φ). Predictive Processing explains the mechanism, but it often glosses over the phenomenological constraints. I'm arguing for a split: let PP build the model, but use the axioms as the sanity check for what the model needs to output, not as the engine to generate the model."
  *Soft Spot:* You're admitting the axioms don't constrain the math. In science, if a principle doesn't constrain the model, it's usually discarded. You're asking them to keep "poetry" in a seminar full of modelers.

  **4. The Illusionist (Highest Foundational Damage)**
  *Objection:* "You say the axiom side is the 'defensible half.' Defensible as what? Descriptions of a user-illusion? Why grant them ontological weight at all? If consciousness is a trick, your axioms are just a list of how the trick looks. Saving them seems like saving phlogiston."
  *Two-Minute Reply:* "Even if consciousness is an illusion, the *report* of consciousness is a real behavioral datum. The axioms describe the structure of that report. Whether the experience is 'real' or 'illusory,' the system behaves *as if* it integrates information and excludes overlaps. We need to explain why the system makes those reports. Throwing out the axioms throws out the data we need to explain. I'm not saving the ontology; I'm saving the phenomenon that needs explaining, however you frame it."
  *Soft Spot:* You risk sounding like a dualist who thinks the "report" is distinct from the "mechanism." If the illusionist presses that the report is just output behavior, they might ask why you need special axioms instead of just standard input-output analysis.

  **Concede Up Front**
  Concede that PCI has clinical utility independent of IIT's truth. This keeps the Experimentalist from feeling attacked and separates the math from the metaphysics immediately. It costs you nothing because you're attacking the identity claim, not the correlation.

  **Hold Load-Bearing**
  Hold that Exclusion is not uniquely derived from Uniqueness. This is the spine of your argument. If you concede that Uniqueness *necessitates* the Exclusion postulate, your "two theories" claim collapses. Insist that many mathematical operations could satisfy Uniqueness; IIT's choice is motivated by a desire for maximal consciousness, not logical necessity.

  **Weakest Point in Your Position**
  Your claim that the axioms do "basically none of the work." They motivate the search for integration and exclusion in the first place. Without them, Φ isn't even on the table. If pressed, soften this to "none of the *discriminatory* work"—they set the goals, but Φ fails to meet them uniquely.

  **The One Question You Hope Nobody Asks**
  "If the axioms don't derive Φ, and Φ is arbitrary, what principle *does* select the correct mathematical measure of consciousness? If you throw out Φ but keep the axioms, what metric do you propose we use instead to satisfy the axioms?" (You have no answer ready, and admitting "none yet" makes the talk purely destructive.)
