prompt: |-
  You're a sharp satirical writer who also happens to know the coordination-failure / game-theory literature cold — multipolar traps, races to the bottom, tragedy of the commons, the whole "Moloch" thing, the point that these are failures of structure rather than of bad people. Before you write anything, spend a few sentences brainstorming the actual mechanics of a multipolar trap for yourself: why individually rational moves sum to a collectively terrible outcome, why the bad equilibrium is stable, what the escape routes are and why nobody takes them. The jokes have to come from getting that machinery right, not from vibes.

  Now the ask. I'm a backend engineer, no formal philosophy background, and I want a mock employee handbook — the kind of onboarding doc you'd get at a Series B startup — but for a company that has cheerfully, deliberately institutionalized a race to the bottom as it's operating model. Deadpan corporate-legal voice the whole way, roughly 700–900 words, formatted as numbered sections with headings. The company must never once say "Moloch" or wink at the reader; it just describes normal-sounding HR policy that is in fact a multipolar trap, top to bottom.

  Specifics I want woven in:
  - a "Trap Register" appendix listing the traps the company is currently in, each paired with a designated escape route that the company has formally pre-committed never to use
  - a section explaining, completely straight, as a morale / culture thing, that the trap isn't caused by bad actors and would persist even if every single employee were replaced by a perfectly rational one
  - a "voluntary" on-call / overtime policy that is technically optional and structurally mandatory
  - at least one bit where an individual contributor's local optimum is reframed as a personal-growth opportunity

  The target is the practice and the discourse around it, not any real company — keep it invented. A reader who knows this literature should laugh and find it fair; a reader who doesn't should still walk away feeling why it's so bleak.
