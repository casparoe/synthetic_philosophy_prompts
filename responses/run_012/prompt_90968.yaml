prompt: |-
  I lead a small team that translates our written compliance policies into executable checks. The checks run nightly against transaction and case data, and anything they flag lands in a human review queue; a false positive costs queue capacity and a false negative costs us regulatory exposure. I convert roughly forty rules a quarter, I get about two hours per rule, and my only colleagues are three engineers and one lawyer. I have spent enough evenings in the blogosphere's heaps-and-bald-men threads to be convinced that the interesting fact about vague predicates is not that we cannot see where the line falls, but that some of them may have no line to fall — and I now need that distinction to pay rent rather than just be interesting.

  Write me a procedure for handling a vague predicate in a rule we are about to compile: 'promptly', 'reasonable', 'material', 'substantially similar', 'without undue delay'. I want it in order — the tests to run, what counts as passing or failing each, where the procedure returns a no, and where it stops and hands the decision to a person. It should keep apart things we currently conflate: genuine vagueness, ambiguity, context-dependence, and a term that is perfectly precise but simply does not reach a case the drafters never imagined. It should say when a bright-line threshold is a faithful sharpening of the predicate and when it is a silent amendment of the rule, and give me a way to measure that — some test over the range of thresholds a fair-minded reader could accept, and what flip rate across our own past adjudications means we may compile, versus what means we may not. Where a step presupposes one of the two main theories rather than the other — epistemicism, on which there is a line we merely cannot locate, versus the supervaluationist picture, on which a statement is true on every admissible sharpening, or on none, and the remainder is left to be settled — say so and fork there, because the sign-off requirements differ: one exit is filling in an unknown and needs evidence and a revisit date, the other is a policy choice and needs the policy owner and legal. Flag which steps are judgments wearing procedural clothing, and note that the text itself is not cheap for us to reopen.

  Then apply it to three rules: a duty to notify compliance 'promptly' upon discovery of a reportable incident; a prohibition on 'material' misstatements in a client disclosure; and a data-classification rule whose term must be applied to a technology the drafters did not anticipate. For each, give me the exit the procedure selects, the artifacts it leaves behind, and who signs. Include at least one where the honest answer is that we cannot automate the rule and must keep a human queue — the outcome my program exists to reduce — and do not soften it. Close with where the procedure will misfire: multidimensional predicates, cases where the admissible sharpenings cannot be enumerated without begging the question, and anything else it cannot deliver, followed by a one-page version my engineers can keep at their desks.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User Persona:** Lead of a small team translating compliance policies into executable checks.
      *   **Context:** 40 rules/quarter, 2 hours/rule. Team: 3 engineers, 1 lawyer. High stakes (false positives = cost, false negatives = risk).
      *   **Philosophical Stance:** Familiar with vagueness (Sorites paradox, heaps/bald men). Believes some predicates have *no line* (supervaluationism/open texture) rather than just an *unknown line* (epistemicism). Wants this distinction to be operational ("pay rent").
      *   **Task:** Write a procedure for handling vague predicates ('promptly', 'reasonable', etc.) in rule compilation.
      *   **Requirements:**
          *   Ordered steps (tests, pass/fail criteria, exit points).
          *   Distinguish: genuine vagueness, ambiguity, context-dependence, unforeseen cases (open texture).
          *   Distinguish: faithful sharpening vs. silent amendment (measure via threshold range/flip rate).
          *   Philosophical Fork: Epistemicism (unknown line, needs evidence/revisit) vs. Supervaluationism/Policy Choice (needs policy owner/legal).
          *   Flag "judgments wearing procedural clothing."
          *   Acknowledge text reopening costs.
          *   Apply to 3 specific rules (Prompt notification, Material misstatement, Unforeseen tech).
          *   One outcome *must* be "cannot automate" (keep human queue).
          *   Close with limitations (multidimensional predicates, etc.).
          *   Include a one-page engineer cheat sheet.
      *   **Tone:** Precise, operational, philosophical but pragmatic, no fluff.

  2.  **Deconstruct the Philosophical Underpinnings:**

      *   *Epistemicism:* There is a fact of the matter (e.g., "promptly" *means* 24 hours), we just don't know it. Solution: Estimate, document uncertainty, schedule review.
      *   *Supervaluationism/Open Texture:* There is no fact of the matter until a decision is made. "Promptly" is a range. Any specific point is a *choice*, not a *discovery*. Solution: Policy decision, legal sign-off.
      *   *Ambiguity:* Word has multiple distinct meanings (e.g., "bank" = river or finance). Solvable by context.
      *   *Context-Dependence:* Meaning shifts based on situation (e.g., "tall" for a jockey vs. basketball player). Solvable by parameterization.
      *   *Open Texture (Waismann):* Unforeseen cases (e.g., "vehicle" in a park applied to a drone). Requires policy expansion.

  3.  **Drafting the Procedure (The "Vagueness Protocol"):**

      *   *Constraint:* 2 hours per rule. The procedure must be fast.
      *   *Structure:* Intake -> Diagnosis -> Classification -> Resolution -> Sign-off.
      *   *Step 1: Ambiguity Check.* Is it just multiple definitions? (Fast fix).
      *   *Step 2: Context Check.* Does it depend on variables we have? (Parameterize).
      *   *Step 3: The Sorites Test (Vagueness Diagnosis).* Can we find a boundary case? If yes, is it a *gap* or a *blur*?
      *   *Step 4: The Sharpening Test.* If we pick a threshold (e.g., 24 hours), does it feel like a discovery or a law?
      *   *Step 5: The Flip Rate Metric.* Look at past human reviews. If humans disagree > X%, automation is dangerous.
      *   *Step 6: Philosophical Fork.* Epistemic (Unknown) vs. Supervaluation (Choice).
      *   *Step 7: Exit Conditions.* Automate, Parameterize, or Human Queue.

  4.  **Developing the Metrics:**

      *   *Flip Rate:* % of past cases where human reviewers overturned a tentative classification.
      *   *Admissible Range:* The span of values a "fair-minded reader" would accept. If the range is wide, a single threshold is a policy change.

  5.  **Applying to the Three Rules:**

      *   *Rule 1: 'Promptly' notify.*
          *   Analysis: Time-based. Context matters (severity).
          *   Outcome: Parameterized threshold (e.g., 24h for High, 72h for Low).
          *   Philosophy: Epistemic lean (industry standard exists), but requires policy sign-off.
      *   *Rule 2: 'Material' misstatement.*
          *   Analysis: Highly context-dependent. Financial impact + reputational impact.
          *   Outcome: **Human Queue.** (This satisfies the "do not soften" requirement).
          *   Reasoning: Flip rate too high. Multidimensional.
      *   *Rule 3: Unforeseen Tech (Data Classification).*
          *   Analysis: Open Texture. Drafters didn't know this tech existed.
          *   Outcome: Policy Amendment required.
          *   Philosophy: Supervaluation/Open Texture. No amount of sharpening covers this.

  6.  **Refining the Output:**

      *   *Tone Check:* Needs to sound like a senior engineer/compliance lead talking to peers. Direct, slightly weary but rigorous.
      *   *Formatting:* Use bolding, lists, and clear headers.
      *   *Cheat Sheet:* Needs to be distinct and actionable.
      *   *Limitations:* Acknowledge where the procedure fails (multidimensional vagueness).

  7.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is 2 hours enough for this deep analysis?
      *   *Fix:* Emphasize that the *procedure* is the time-box. If you hit the "Human Queue" exit, you stop coding. That saves time.
      *   *Critique:* Did I distinguish Epistemicism vs. Supervaluationism clearly?
      *   *Fix:* Make Step 5 the explicit fork. Epistemic = "Find the line, mark uncertainty." Supervaluation = "Draw the line, mark policy."
      *   *Critique:* Is the "Material" example too easy?
      *   *Fix:* Ensure the justification relies on the *flip rate* and *multidimensionality* to prove why automation fails.
      *   *Critique:* Did I mention "judgments wearing procedural clothing"?
      *   *Fix:* Add explicit callouts in the procedure steps.

  8.  **Final Polish:** Check against all constraints in the prompt.
      *   Order tests? Yes.
      *   Pass/Fail criteria? Yes.
      *   Exit points? Yes.
      *   Distinguish vagueness types? Yes.
      *   Bright-line vs. Silent amendment test? Yes.
      *   Philosophical fork? Yes.
      *   Flag procedural judgments? Yes.
      *   3 Rule Applications? Yes.
      *   One "Cannot Automate"? Yes.
      *   Limitations section? Yes.
      *   One-page engineer version? Yes.

  9.  *(Final thought on tone)*: The user knows their philosophy. Don't explain Sorites to them. Use the terminology correctly (penumbra, admissible sharpenings, epistemic gap).

  10. **Drafting the response.** (Proceeds to generate output based on these thoughts).
answer: |-
  # Procedure: Vagueness Resolution Protocol (VRP-v1)

  **Owner:** Compliance Engineering Lead
  **Timebox:** 30 minutes of the 2-hour rule budget (remainder for implementation/testing)
  **Goal:** Determine if a predicate can be compiled, parameterized, or must remain human-judged.

  ---

  ## Phase 1: Diagnostic Triage
  *Goal: Distinguish vagueness from ambiguity, context-dependence, and open texture.*

  **Step 1.1: The Ambiguity Test**
  *   **Action:** Search the policy glossary and prior adjudications for multiple distinct definitions of the term.
  *   **Pass:** Term has one core meaning but unclear boundaries (e.g., "promptly" always means "fast," but how fast?). → **Go to 1.2.**
  *   **Fail:** Term has multiple distinct meanings (e.g., "account" means "bank account" in Section 4, "user account" in Section 9). → **Resolve via scoping logic.** Stop VRP.
  *   **Judgment Flag:** Determining "distinct" vs. "unclear" is a judgment call. Default to "unclear" if engineers disagree.

  **Step 1.2: The Context-Dependence Test**
  *   **Action:** Identify if the predicate's truth value changes based on available data fields (e.g., transaction size, client tier).
  *   **Pass:** Meaning shifts predictably with variables we possess. → **Parameterize.** (e.g., "Large" = >$10k for Retail, >$1M for Inst). Document mapping. Stop VRP.
  *   **Fail:** Meaning shifts based on factors we do not capture or cannot quantify. → **Go to 1.3.**

  **Step 1.3: The Open Texture Test (Unforeseen Cases)**
  *   **Action:** Compare the current case/data against the drafting date and stated intent. Is this a *new kind* of object, or just a *new degree* of an old object?
  *   **Pass:** New degree (e.g., a faster transaction speed). → **Go to Phase 2.**
  *   **Fail:** New kind (e.g., "vehicle" applied to a drone; "document" applied to a smart contract). → **Exit: Policy Amendment Required.** (See Application 3).

  ---

  ## Phase 2: The Sharpening Metric
  *Goal: Distinguish faithful sharpening (epistemic) from silent amendment (supervaluation/policy).*

  **Step 2.1: The Admissible Range Estimation**
  *   **Action:** Ask three fair-minded reviewers (Engineer, Lawyer, Ops) to independently propose a threshold (e.g., hours for "promptly", $ for "material").
  *   **Metric:** Calculate the spread (Min to Max).
  *   **Threshold:**
      *   **Narrow Spread (<20% variance):** Likely Epistemic. We are finding a hidden line. → **Go to 2.2.**
      *   **Wide Spread (>50% variance):** Likely Supervaluation. There is no line; we are drawing one. → **Go to Phase 3.**

  **Step 2.2: The Historical Flip Rate**
  *   **Action:** Sample 20 past cases from the human review queue involving this predicate. Apply your proposed threshold retroactively.
  *   **Metric:** % of cases where your threshold disagrees with the human adjudicator's final decision.
  *   **Pass:** Flip Rate < 5%. → **Compile.** (Treat as Epistemic discovery).
  *   **Fail:** Flip Rate > 15%. → **Go to Phase 3.** (Treat as Policy Choice).
  *   **Gray Zone:** 5-15%. → **Compile with "Review Flag."** (Automate but tag for audit).

  ---

  ## Phase 3: The Philosophical Fork
  *Goal: Assign sign-off authority based on the nature of the uncertainty.*

  **Step 3.1: Select Theory of Vagueness**
  *   **Branch A (Epistemic):** We believe a specific threshold exists (e.g., 24 hours) but was unstated. We are *revealing* it.
      *   **Requirement:** Evidence log (why 24h and not 25h?).
      *   **Sign-off:** Compliance Lead + Engineering.
      *   **Mandatory:** Set "Revisit Date" (e.g., 6 months). If flagged cases spike, the line was wrong.
  *   **Branch B (Supervaluation/Policy):** We acknowledge no threshold exists. Any threshold is a *creation* of rule, not fact.
      *   **Requirement:** Policy Impact Statement (who does this harm?).
      *   **Sign-off:** Policy Owner + Legal Counsel. (Engineering cannot sign).
      *   **Mandatory:** Version Control the Policy Text. This is a silent amendment; the text must be updated to match the code.

  **Step 3.2: The Automation Veto**
  *   **Condition:** If the predicate is multidimensional (e.g., "material" depends on $, reputation, intent, and probability simultaneously) AND Flip Rate > 15%.
  *   **Action:** **Do Not Compile.**
  *   **Output:** Human Review Queue remains the system of record.
  *   **Sign-off:** Compliance Lead (acknowledging cost of queue).

  ---

  ## Application to Rules

  ### Rule 1: Duty to notify compliance 'promptly' upon discovery.
  *   **Diagnosis:** Context-dependent (severity matters) but not ambiguous.
  *   **Sharpening:**
      *   *Range:* Ops says 4h, Legal says 72h, Engineer says 24h. Spread is wide.
      *   *Flip Rate:* 10% on past incidents.
  *   **Fork:** **Branch A (Epistemic Lean).** Industry standards (e.g., GDPR 72h) suggest a latent line exists.
  *   **Resolution:** **Compile with Parameters.**
      *   *Logic:* `IF severity == 'High' THEN threshold = 24h ELSE threshold = 72h`.
      *   *Artifact:* `rule_notify_promptly.json` + `evidence_log_industry_standard.md`.
      *   *Sign-off:* Compliance Lead.
      *   *Revisit:* 6 months.
  *   **Note:** This is a judgment wearing procedural clothing. We are pretending 24h is "true" rather than "chosen" to avoid Policy Owner bottleneck.

  ### Rule 2: Prohibition on 'material' misstatements in client disclosure.
  *   **Diagnosis:** Multidimensional vagueness. Depends on quantitative impact, qualitative intent, and market context.
  *   **Sharpening:**
      *   *Range:* $5k to $5M. Spread is massive.
      *   *Flip Rate:* 35% on past adjudications. Reviewers consistently disagree on edge cases.
  *   **Fork:** **Branch B (Supervaluation).** There is no line to find. Any dollar threshold is a policy change.
  *   **Resolution:** **Automation Veto.**
      *   *Logic:* Rule compiles to `TRUE` (always send to queue).
      *   *Artifact:* `rule_material_misstatement_QUEUE_ONLY.md`.
      *   *Sign-off:* Compliance Lead (accepting queue cost).
      *   **Honest Answer:** We cannot automate this. To compile a threshold (e.g., "$50k") is to silently amend the rule to "Prohibition on >$50k misstatements." Legal will not sign that amendment without a 3-month review cycle. The queue is the control.

  ### Rule 3: Data-classification rule applied to unforeseen technology (e.g., "database" applied to a distributed ledger).
  *   **Diagnosis:** Open Texture. The drafters did not imagine this object.
  *   **Sharpening:** N/A. No amount of threshold tuning makes a blockchain a "database" in the 2018 sense.
  *   **Fork:** **Open Texture.**
  *   **Resolution:** **Policy Amendment Required.**
      *   *Logic:* Code returns `ERROR: UNMAPPED_OBJECT`.
      *   *Artifact:* `ticket_policy_update_#4092`.
      *   *Sign-off:** Policy Owner.
      *   **Note:** Compiling this is dangerous. If we force the ledger into the "database" bucket, we assume risks the policy didn't price. If we exclude it, we have a gap. The code must fail safe.

  ---

  ## Limitations: Where VRP-v1 Misfires

  1.  **Multidimensional Predicates:** VRP assumes we can isolate a threshold (time, $). Predicates like "reasonable effort" or "adequate control" blend cost, risk, and feasibility. The Flip Rate test will catch this, but it consumes the 2-hour budget.
  2.  **Question-Begging Sharpenings:** To test "materiality," we need past cases. But past cases were decided by humans using *their* vague intuition. Using them to validate a threshold circularly reinforces human bias rather than finding truth.
  3.  **Dynamic Context:** A threshold that is "faithful" today (e.g., 24h response) may become "negligent" tomorrow if industry standards shift. The Revisit Date mitigates this, but relies on human discipline to check.
  4.  **The "Silent Amendment" Blindspot:** If the Admissible Range is narrow (Step 2.1 Pass), we assume Epistemicism. We may be wrong. We may be codifying a consensus that is actually a policy choice, bypassing Legal sign-off.

  ---

  # Engineer Cheat Sheet (One Page)

  **VAGUENESS PROTOCOL: QUICK REFERENCE**
  *Stick this to your monitor. If you hit a RED stop, do not write code.*

  **1. IS IT AMBIGUOUS?**
  *   Does the word mean two different things (Bank vs. River)?
  *   **YES:** Fix with `IF/ELSE` logic. **GO.**
  *   **NO:** It's vague. **NEXT.**

  **2. IS IT CONTEXT-DEPENDENT?**
  *   Does "Large" depend on a column we have (e.g., Client_Type)?
  *   **YES:** Map values (Retail=$100, Inst=$1M). **GO.**
  *   **NO:** **NEXT.**

  **3. THE 20-CASE TEST (Crucial)**
  *   Pull 20 past human decisions on this rule.
  *   Apply your proposed number (e.g., 48 hours).
  *   Did the humans disagree with your number more than 3 times (15%)?
  *   **YES (>15%):** **STOP.** Do not automate. Send to Queue. Tell Lead "Flip Rate High."
  *   **NO (<15%):** **NEXT.**

  **4. WHO SIGNS?**
  *   **Did you pick a number because "that's how it's always been"?**
      *   Sign-off: **Compliance Lead.** Set Calendar Reminder for 6 months.
  *   **Did you pick a number because "we need to pick something"?**
      *   Sign-off: **Legal/Policy.** Do not merge without ticket.
  *   **Is this a new technology the policy doesn't mention?**
      *   Sign-off: **Policy Owner.** Code must return `ERROR`.

  **5. RED FLAGS (Judgments in Clothing)**
  *   [ ] I am calling a policy choice a "technical constraint."
  *   [ ] I am assuming the past human reviews were correct.
  *   [ ] I am optimizing for false positives to protect myself, not the firm.

  **EXIT CODES:**
  *   `0`: Compiled (Threshold set, Lead signed).
  *   `1`: Queued (Human review required, Lead accepted cost).
  *   `2`: Blocked (Policy update needed, Legal ticket opened).
