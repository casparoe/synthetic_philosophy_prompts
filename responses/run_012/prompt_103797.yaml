          *   *Key Point:* The threshold doesn't solve the *identification* problem. You need a prior authority to determine who meets the threshold.

      *   **(c) The Smelter Case:**
          *   *Critique:* Is it decoration?
          *   *Thought:* It illustrates the mismatch between functional boundaries (pollution/labor) and political boundaries (municipalities).
          *   *Verdict:* It's a standard functionalist example. To earn its place, it needs to show a *conflict* that standard theories can't resolve. E.g., if the smelter is in Country A, pollutes Country B, but owned by Country C. Does the domain-indexed demos allow Country B residents to vote on Country A's zoning law? That's legally radical. The case needs to show the *institutional mechanism*, not just the moral claim. Who counts the votes?
