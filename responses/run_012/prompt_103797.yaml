      *   **Constructive Proposal:** "Domain-indexed membership" (demos constituted per decision based on subjection + material share threshold).
      *   **Specific Questions:** (a) Exhaustiveness/overlap of the threefold distinction? (b) Does domain-indexed membership collapse into all-affected-interests? (c) Is the smelter case doing work? (d) Which objection is strongest/reply adequate? (e) Strongest unconsidered objection? (f) Which section is least interesting/cuttable?
