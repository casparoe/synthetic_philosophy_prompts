          *   *Strongest:* Accountability (2) or Solidarity (4). Solidarity is the killer for democratic theory. Democracy isn't just about making decisions; it's about sustaining a collective will over time. If the "we" changes every Tuesday, who owes whom what?
          *   *Reply Check:* If the user replies "solidarity isn't needed for specific decisions," that's a restatement. They need to explain how *bindingness* works without solidarity.

      *   **(e) Strongest Unconsidered Objection:**
          *   *Idea:* The "Who Decides the Threshold?" problem (The Meta-Boundary Problem).
