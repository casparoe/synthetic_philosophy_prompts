answer: |-
  Here is a specification of adequacy conditions for a theory of "what matters in survival," tailored to your normative ends (advance directives, contractual bindingness) rather than the metaphysical stalemate of the teletransporter.

  I have distinguished between **Genuine Desiderata** (conditions any theory must meet to be normatively useful) and **Identity Prejudices** (conditions that smuggle in the assumption that "what matters" must mimic the logical structure of strict identity, which may be the very error you are trying to bypass).

  ### Requirements for an Adequate Theory of Survival

  1.  **The Branching Constraint (Genuine Desideratum)**
      *   **Case:** The teletransporter malfunctions, destroying the input but creating two qualitatively identical outputs (fission).
      *   **Requirement:** The theory must assign normative status (rights, debts, directive validity) to the successors without declaring the scenario metaphysically incoherent or forcing a choice of only one "true" survivor. Since strict identity is a one-one relation, it cannot hold here. A theory of *what matters* must explain whether both successors inherit the obligations, neither do, or they share them, without relying on a further fact of identity to break the tie.
      *   **Rationale:** If the theory collapses in fission cases, it cannot handle the radical discontinuities relevant to severe dementia or psychological alteration, rendering it useless for your chapter on advance directives.

  2.  **The Gradability Constraint (Genuine Desideratum)**
      *   **Case:** The 99% vs. 60% psychological overlap; the "value alteration" variant (successor lacks a core moral commitment); the reversible round-trip.
      *   **Requirement:** The theory must accommodate the intuition that survival is not always all-or-nothing. It must distinguish between a successor who is robustly continuous with the predecessor and one who is marginally so. Specifically, regarding the round-trip: if the process is reversible, the theory should explain why the returnee is *more* continuous than a mere copy, or admit that they are not.
      *   **Rationale:** Advance directives often hinge on the degree of psychological change (e.g., "If I no longer recognize my family..."). A binary theory cannot adjudicate the threshold where the directive activates.

  3.  **The Normative Determinacy Constraint (Genuine Desideratum)**
      *   **Case:** The debt, the crime, the medical directive.
      *   **Requirement:** While survival may come in degrees (see #2), the *normative verdicts* (bound/not bound, owe/do not owe) must be action-guiding. The theory must provide a principle for mapping degrees of survival onto binary normative statuses without resorting to arbitrariness.
      *   **Rationale:** Courts and hospitals cannot enforce "60% of a debt." For your purposes, the theory must bridge the gap between metaphysical gradability and practical binary decisions.

  4.  **The Transitivity Constraint (Identity Prejudice)**
      *   **Case:** A Sorites chain of psychological replacement over decades (A → B → C ... → Z).
      *   **Requirement:** *Caution.* Traditional identity is transitive (if A=B and B=C, then A=C). However, psychological *connectedness* (direct links of memory/character) is not transitive; it fades. Demanding that "what matters" be fully transitive in the same way identity is may be a prejudice of the identity camp.
      *   **Rationale:** If you demand strict transitivity for "what matters," you force the theory to posit a "further fact" (like a soul or brute physical continuity) to hold the chain together when psychological links fade. A Parfitian theory should be allowed to say that what matters holds in overlapping chains, not direct transitive links. Mark this as a prejudice if it demands logical transitivity where only normative continuity is needed.

  5.  **The Ordinary Case Constraint (Genuine Desideratum)**
      *   **Case:** Normal aging over 40 years.
      *   **Requirement:** The theory must render ordinary survival the central, paradigmatic case, not a lucky exception or a metaphysical mystery. It should not make the relation between you-now and you-in-10-years more mysterious than the relation between you-now and a teletransporter output.
      *   **Rationale:** A theory that solves the teletransporter by making ordinary survival unintelligible (or vice versa) fails. It must unify the explanation of survival across normal and radical cases.

  6.  **The Asymmetry of Concern Constraint (Genuine Desideratum)**
      *   **Case:** Fear of future pain vs. indifference to past pain.
      *   **Requirement:** The theory must ground the special concern we have for our future selves. It must specify whether this concern is a rational requirement (grounded in the nature of survival) or a biological disposition (which might be irrational in fission cases).
      *   **Rationale:** If the concern is merely biological, an advance directive based on rational autonomy might be undermined by biological instincts. The theory must locate the source of the authority of the past self over the future self.

  7.  **The Responsibility Grounding Constraint (Genuine Desideratum)**
      *   **Case:** Who answers for the crime? Who is bound by the promise?
      *   **Requirement:** The theory must explicitly link the survival relation to moral responsibility. It must distinguish between *prudential* concern (self-interest) and *moral* bindingness (obligation).
      *   **Rationale:** It is possible that "what matters" for self-interest differs from "what matters" for responsibility. Your chapter needs to know if the psychological change that voids self-concern also voids contractual obligation.

  ---

  ### The Incompatible Triple

  I suspect the following three requirements cannot be jointly satisfied without significant theoretical cost (e.g., arbitrariness or revisionism):

  1.  **Gradability** (Survival/Connection comes in degrees).
  2.  **Transitivity** (Normative chains must hold across long spectra of change).
  3.  **Normative Determinacy** (Verdicts on debt/directives must be binary and non-arbitrary).

  **The Tension:** If survival is a matter of degree (Gradability), and psychological connectedness fades over long chains (denying strict Transitivity of connection), then the link between the original promisor and the distant future self is weak. However, to enforce the debt or directive (Normative Determinacy), you need a binary "bound/not bound" verdict. If you set a threshold (e.g., "50% connection binds"), it appears arbitrary. If you say "bindingness comes in degrees," you violate Determinacy (you can't pay 60% of a prison sentence). If you insist on full Transitivity to preserve the chain, you likely violate Gradability by forcing a "further fact" view to bridge the gaps where connection fades.

  **My Judgment:** You will likely have to sacrifice **Transitivity** (in the strict logical sense) or **Normative Determinacy** (by accepting vague boundaries of obligation). Parfit sacrifices the importance of Transitivity for Relation R, but that creates the "threshold problem" for your advance directives.

  ### The Single Exclusionary Requirement

  The requirement that does the most work in excluding the most popular theories (specifically the "Simple View," Animalism, and strict Lockean Memory theories) is **The Branching Constraint (#1)**.

  **Why:** Strict identity is necessarily one-one. Any theory that equates "what matters" with strict identity (whether based on souls, brains, or bodies) is logically forced to say that in a fission case, either: (a) the scenario is impossible, (b) only one successor is the person (which is indistinguishable from death for the other), or (c) identity somehow splits (logical contradiction). The Branching Constraint forces the move to a *Relation R* (psychological continuity/connectedness) view, which can be one-many. It immediately disqualifies any theory that cannot handle fission without logical incoherence, which is the majority of traditional metaphysical accounts. This is the lever you need to pry your reading group away from "Is it him?" to "Does the relation hold?"
