answer: |-
  Begin with physical commission to anchor intuition, disrupt it with omission, break the counterfactual fix with the neighbor case, and resolve the tension by exposing normative salience without settling whether norms constitute causation.

  **The Sequence**

  1.  **Baseline Commission (0–15 mins):** Present a standard physical causation case (striking a match causes fire) to establish the group's pre-theoretic intuition that causation involves energy transfer or event succession.
      *   *Depends on:* Nothing; this is the control condition.
      *   *Why not later:* You cannot demonstrate the peculiarity of omission without a prior consensus on what "normal" causation looks like.
      *   *Settled/Contested:* Settled that this fits standard counterfactual and process theories of causation.
      *   *Misconception Head-off:* None yet; this builds the intuition you will later break.

  2.  **The Omission Introduction (15–30 mins):** Introduce the Gardener who fails to water the plant, causing its death. Ask if this is causation in the same sense as the match.
      *   *Depends on:* Step 1 (needs the contrast to feel the weirdness).
      *   *Why not earlier:* If introduced first, participants will treat it as a moral or legal rule rather than a metaphysical puzzle.
      *   *Settled/Contested:* Settled that we *speak* of omissions as causes; contested whether they *are* causes.
      *   *Misconception Head-off (Ghostly Event):* When participants ask "what exactly happened?", absorb the intuition by defining the omission not as a "negative event" but as the absence of an expected event in a specific history. Do not contradict them; validate that it feels ontologically different, then move to testing it.

  3.  **The Counterfactual Test & The Neighbor (30–50 mins):** Apply the "but-for" test (if X hadn't happened, Y wouldn't have) to both the Gardener and a Neighbor who also did not water the plant. Show that the test identifies both as causes, though intuition rejects the Neighbor.
      *   *Depends on:* Step 2 (needs the omission case to test).
      *   *Why not earlier:* You cannot demonstrate the insufficiency of the counterfactual account until the account is applied to the omission case.
      *   *Settled/Contested:* Settled among specialists that simple counterfactual dependence overgenerates causes in omission cases.
      *   *Misconception Head-off (But-For Settles It):* When participants insist the test works, absorb this by agreeing it is *necessary* but using the Neighbor to show it is not *sufficient*. Do not say the test is wrong; say it is incomplete.
      *   *Misconception Head-off (Explosion of Causes):* This is the moment the "everything is a cause" problem surfaces (e.g., the President didn't water it either). Use this explosion to motivate the need for a selection principle.

  4.  **The Normative Solution (50–70 mins):** Propose that the difference between Gardener and Neighbor is not physical but normative (duty/expectation). Ask whether this norm makes the causation real or merely selects it for discussion.
      *   *Depends on:* Step 3 (needs the failure of the physical/counterfactual account to motivate the normative turn).
      *   *Why not earlier:* If introduced first, the session becomes a discussion of tort law rather than metaphysics.
      *   *Settled/Contested:* Contested. Some argue norms are pragmatic filters on real causes; others argue norms are constitutive of omission causation itself.
      *   *Misconception Head-off (Responsibility vs. Causation):* When participants say "the Gardener is just to blame," absorb this by asking if the plant's physiological history changes based on the contract. Force them to see that blaming is easy, but locating the cause is hard.

  5.  **The Unresolved Close (70–90 mins):** Conclude that while we need norms to identify omission causes, it remains unclear whether the cause exists independently of those norms.
      *   *Depends on:* Step 4 (needs the normative proposal to evaluate its metaphysical cost).
      *   *Why not earlier:* You cannot evaluate the cost of the solution until the solution is on the table.
      *   *Settled/Contested:* Contested. This is the live wire in current metaphysics.
      *   *Misconception Head-off:* None; this is where you leave them with the productive uncertainty.

  **The Single Case**

  Keep the Gardener/Neighbor pair. It carries the idea better than a mechanical case (e.g., a failed alarm) because the "agency" element triggers the normative intuition required for step 4. The fact that it "smuggles" moral judgment is a feature, not a bug, for this audience; it forces the conflict between physical identity (both did nothing) and causal asymmetry (only one caused the death).
  *   **Must Have:** Perfect physical symmetry between the Gardener and the Neighbor (both absent, both capable of watering, both did nothing); a clear binary outcome (plant dead/alive); a clear contractual duty for the Gardener and none for the Neighbor.
  *   **Must Lack:** Any physical interference by either party (neither touched the plant); any difference in opportunity (both could have watered); any third-party intervention (no rain, no vandals).

  **The Closing Question**

  "If we discover the Gardener's contract was legally void five minutes before the plant died, but nobody knew this—not the Gardener, not the Neighbor, not the Owner—did the Gardener still *cause* the death, or did he only remain *responsible* for it?"
  *   **Why this works:** It separates the metaphysical fact (causation) from the social status (responsibility/knowledge). If they say he caused it, they treat causation as objective; if they say he didn't, they treat causation as dependent on normative validity. Either answer shows they grasp the problem.

  **What to Leave Out**

  *   **[EXCLUDE] The Ontology of Negative Facts:** Do not discuss whether "absences" exist as entities in the world. This leads to semantic quibbles that distract from the causal intuition.
  *   **[EXCLUDE] Legal Statutes:** Do not cite specific tort laws or statutory duties. This reinforces the misconception that this is purely a legal problem rather than a conceptual one.
  *   **[EXCLUDE] The Doing/Allowing Distinction:** Do not introduce trolley problems or active killing vs. letting die. This introduces moral weight that conflates the causal question with the permissibility question.
  *   **[EXCLUDE] Process Theories of Causation:** Do not explain conserved quantities or physical processes in detail. This is too technical and suggests there is a settled physicalist solution there is not.
