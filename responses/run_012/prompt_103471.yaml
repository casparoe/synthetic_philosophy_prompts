      *   **Target Audience:** Mid-level philosophy of biology seminar (14 students).
      *   **Duration:** 75 minutes.
      *   **Core Misconception:** Heritability ($h^2$) is a fixed property of a trait/individual, indicates "how genetic" something is, and implies immutability.
      *   **Goal:** An in-class simulation where students generate data, compute estimates, and witness the number change based on population/environment conditions *before* the instructor explains the theory.
      *   **Specific Scaffolding Provided:**
          *   Organisms with fixed genotype ($G$) + Environment ($E$) = Phenotype ($P$).
          *   Round 1: Uniform $E$ $\rightarrow$ High $h^2$.
          *   Round 2: Variable $E$ $\rightarrow$ Low $h^2$.
          *   Round 3: Uniform $E$ (shifted mean) $\rightarrow$ High $h^2$ (despite environmental effect on mean).
          *   Round 4: Gene-Environment Interaction ($G \times E$) $\rightarrow$ Additive model breaks.
      *   **Debrief Requirements:** Map reversals to claims about $h^2$ (ratio of variances, not individuals, no malleability inference, no group differences). Acknowledge simulation limits (real-world confounds).
      *   **Anticipated Problems:** What goes wrong in Round 1? How to handle the "rigged" skeptic?

  2.  **Evaluate and Refine the Scaffolding:**
      *   *Constraint:* 14 students is a small sample size for variance calculations. Hand-calculating variance/covariance in 75 minutes is risky.
      *   *Solution:* Simplify the math. Use a visual proxy for variance (range or mean absolute deviation) or provide a spreadsheet template. Better yet, make the "computation" part of the collective activity but keep the arithmetic trivial. Let's use a "Height" analogy (e.g., "Plant Height in cm") but represented by numbers on cards to save time.
      *   *Constraint:* 75 minutes is tight for 4 rounds + debrief.
      *   *Solution:* Combine Rounds 1 & 3 conceptually or streamline the data collection. Actually, the prompt asks for specific reversals. I need to ensure the timing works. 15 mins per round is too much. Let's aim for 10 mins per round (40 mins total) + 15 mins intro/setup + 20 mins debrief.
      *   *Refinement on Round 3:* The prompt suggests shifting the environment for everyone to show $h^2$ stays high while the *mean* changes. This is crucial for the "malleability" misconception.
      *   *Refinement on Round 4:* $G \times E$ interaction makes ANOVA hard for philosophy students in real-time. I need to make the *breakdown* visible without complex stats. Visualizing the *rank order* changing is the best way to show $G \times E$.

  3.  **Drafting the Simulation Design:**
      *   **Materials:** Index cards (Genotypes), Envelope slips (Environments), Whiteboard/Spreadsheet.
      *   **The "Trait":** "Growth Score."
      *   **The Formula:** $P = G + E$ (for Rounds 1-3).
      *   **The Heritability Estimate:** Instead of full ANOVA, use a simplified ratio: $V_G / V_P$. Since $V_P = V_G + V_E$ (in the additive model), $h^2 = V_G / (V_G + V_E)$.
      *   **Calculation Shortcut:** To save time, calculate Variance roughly. Or, even better, use the *correlation* between Mid-Parent and Offspring logic? No, that's too complex for one session. Let's stick to Variance Partitioning.
      *   *Correction:* Calculating variance for 14 data points 4 times is tedious.
      *   *Idea:* Pre-calculate the Genotype Variance ($V_G$) and tell them it's constant. Have them calculate Total Variance ($V_P$) each round. Then $V_E = V_P - V_G$. Then $h^2 = V_G / V_P$.
      *   *Wait, simpler:* Just have them calculate the Range or Standard Deviation using a provided calculator/phone.
      *   *Best approach for Philosophy Class:* Focus on the *concept* of variance. Use a visual plot on the board.
      *   *Decision:* I will provide a Google Sheet template link (hypothetical) or instruct them to use phone calculators. I will simplify the variance calculation to "Sum of Squared Deviations from Mean" (SS) because the $N$ cancels out in the ratio. $h^2 = SS_G / SS_P$.
      *   *Actually, let's keep it even simpler.* The instructor can project a spreadsheet. Students shout numbers, instructor types, spreadsheet updates $h^2$. This saves 20 minutes of arithmetic.

  4.  **Developing the Rounds (The "Narrative Arc"):**
      *   **Setup:** Assign each student a secret "Genotype Card" (1-10). This stays with them forever.
      *   **Round 1 (The Trap):** Everyone gets Environment = 0. $P = G$. Variance is all Genetic. $h^2 \approx 1.0$. *Student conclusion: "It's all in the genes."*
      *   **Round 2 (The Noise):** Environments vary wildly (-5 to +5). $V_E$ increases. $V_P$ increases. $V_G$ stays same. $h^2$ drops. *Student conclusion: "Environment matters more now."*
      *   **Round 3 (The Shift):** Everyone gets Environment = +10. $P = G + 10$. $V_E = 0$ (because it's constant for all). $h^2 \approx 1.0$ again. *BUT* Mean phenotype jumped. *Student conclusion: "Wait, it's 100% genetic again, but we all grew taller?"* (This hits the malleability fallacy).
      *   **Round 4 (The Interaction):** Some genotypes react differently to Environment. (e.g., High G gets +5, Low G gets -5). Rank order changes. Additive model fails.

  5.  **Addressing the "Predictable Failures":**
      *   *Round 1 Misconception:* Students will equate $h^2=1$ with "unchangeable."
      *   *The "Rigged" Student:* They might say "Real life isn't cards." Need to validate the model's limits during debrief.
      *   *Time Management:* Arithmetic is the killer. I must insist on the "Instructor as Calculator" method or a pre-made sheet.

  6.  **Structuring the Debrief:**
      *   Connect Round 1 & 2: $h^2$ is population-specific.
      *   Connect Round 3: $h^2$ says nothing about the mean (malleability).
      *   Connect Round 4: $G \times E$ and the limits of the additive model.
      *   Real World: Twin studies, EEA (Equal Environments Assumption), G-E correlation.

  7.  **Refining the Plan (Self-Correction during drafting):**
      *   *Critique:* Calculating variance live is still too slow for 14 students x 4 rounds.
      *   *Fix:* Reduce to 3 Rounds. Combine the "Variable E" and "Interaction" if needed, but the prompt asks for specific reversals. Let's keep 4 rounds but make the data entry instant.
      *   *Better Fix:* Use "Variance Tokens." No, that's abstract.
