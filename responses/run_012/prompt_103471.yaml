answer: |-
  Here is a complete lesson plan designed for a 75-minute seminar with 14 students. It prioritizes student-generated data and visible arithmetic reversals over lecture.

  # Lesson Plan: The Heritability Simulation
  **Topic:** The Population Dependence of Heritability Coefficients ($h^2$)
  **Time:** 75 Minutes
  **Class Size:** 14 Students

  ## I. Learning Objectives
  By the end of this session, students will be able to:
  1.  Define heritability as a ratio of variances within a specific population, not a fixed property of a trait.
  2.  Demonstrate that high heritability is compatible with strong environmental effects on the population mean (malleability).
  3.  Identify how Gene-Environment Interaction ($G \times E$) disrupts additive models.
  4.  Critically evaluate the assumptions required to estimate $h^2$ in human populations (e.g., twin studies).

  ## II. Materials & Setup
  *   **Genotype Cards (14):** Pre-printed index cards. To simplify arithmetic, assign values symmetric around zero.
      *   *Values:* -7, -6, -5, -4, -3, -2, -1, 0, 0, 1, 2, 3, 4, 5, 6, 7 (Wait, that's 16. Use: **-6, -5, -4, -3, -2, -1, 0, 0, 1, 2, 3, 4, 5, 6**).
      *   *Note:* The mean is 0. This eliminates decimal subtraction during variance calculations.
      *   *Distribution:* Hand one to each student at the start. Tell them: *"This is your biological constitution for this trait. It does not change."*
  *   **Environment Slips (Two Hats/Bowls):**
      *   *Hat A (Uniform):* Contains 14 slips, all reading **"0"**.
      *   *Hat B (Variable):* Contains 14 slips reading: **-5, -4, -3, -2, -1, -1, 0, 0, 1, 1, 2, 3, 4, 5**.
      *   *Hat C (Shifted):* Contains 14 slips, all reading **"+10"**.
  *   **Worksheets:** One per student (or per pair). Columns for: *Genotype (G)*, *Environment (E)*, *Phenotype (P = G+E)*, *Squared Phenotype ($P^2$)*.
  *   **Board/Projector:** To aggregate the class Sum of Squares ($SS$).
  *   **Calculators:** Students use phones.

  ## III. The Procedure (60 Minutes)

  ### Introduction (5 Minutes)
  Tell the class: *"We are going to measure the heritability of 'Growth Score.' You are the population. Your Card is your Genotype ($G$). You will draw an Environment ($E$). Your Phenotype ($P$) is simply $G + E$. We will calculate how much of the variation in $P$ is due to variation in $G$."*

  Write the formula on the board:
  $$h^2 = \frac{V_G}{V_P} \approx \frac{SS_G}{SS_P}$$
  *(Explain that since $N$ is constant, we can use Sum of Squares ($SS$) instead of Variance to save time. $SS = \sum(x - \text{mean})^2$. Since our Genotype mean is 0, $SS_G$ is just the sum of squared genotype cards.)*

  **Pre-Calculation:** Have the class calculate $SS_G$ together once.
  *   Squares: 36, 25, 16, 9, 4, 1, 0, 0, 1, 4, 9, 16, 25, 36.
  *   **$SS_G = 182$.** Write this on the board. **It never changes.**

  ### Round 1: The Uniform Environment (The Trap) (10 Minutes)
  1.  **Action:** Every student draws from **Hat A (0)**.
  2.  **Calc:** $P = G + 0$. So $P = G$.
  3.  **Compute:** Students calculate $P^2$. Sum them on the board.
  4.  **Result:** $SS_P$ will equal 182.
  5.  **Estimate:** $h^2 = 182 / 182 = \mathbf{1.0}$.
  6.  **Ask:** *"What does this number tell you about the trait?"*
      *   *Expected Answer:* "It's completely genetic." "Environment doesn't matter." "It's fixed."
      *   *Instructor Action:* Write these claims on the board. Do not correct them yet.

  ### Round 2: The Variable Environment (The Noise) (10 Minutes)
  1.  **Action:** Students return Round 1 slips. Every student draws from **Hat B (Variable)**.
  2.  **Calc:** $P = G + E$. (e.g., Student with $G=-6$ might draw $E=+5 \rightarrow P=-1$).
  3.  **Compute:** Students calculate new $P$, then $P^2$. Sum on board.
  4.  **Result:** $SS_P$ will be significantly larger than 182 (roughly $182 + SS_E$). $SS_E$ for Hat B is approx 140. Total $SS_P \approx 322$.
  5.  **Estimate:** $h^2 = 182 / 322 \approx \mathbf{0.56}$.
  6.  **Ask:** *"The number dropped. Did your genes change?"* (No). *"Did the trait become less genetic?"*
      *   *Goal:* They should see $h^2$ dropped because environmental *variance* increased, not because genes mattered less biologically.

  ### Round 3: The Shifted Environment (The Malleability Reversal) (10 Minutes)
  1.  **Action:** Students draw from **Hat C (+10)**.
  2.  **Calc:** $P = G + 10$.
  3.  **Compute:** Students calculate $P^2$.
      *   *Trick:* The Mean is now 10. To get $SS_P$, they must calculate $(P - 10)^2$. Since $P = G + 10$, then $(P-10) = G$.
      *   *Shortcut:* Remind them $SS$ measures *spread*, not height. The spread is identical to Round 1.
  4.  **Result:** $SS_P = 182$.
  5.  **Estimate:** $h^2 = 182 / 182 = \mathbf{1.0}$.
  6.  **Ask:** *"The heritability is back to 1.0. But look at the scores. Everyone grew by 10 points. If $h^2=1$, how did the environment change the mean so drastically?"*
      *   *Goal:* Dislodge the idea that high $h^2$ implies immutability.

  ### Round 4: The Interaction (The Model Break) (15 Minutes)
  1.  **Action:** Introduce a rule change. *"Some genotypes react differently to stress."*
      *   If $G$ is negative (-6 to -1): $E$ is multiplied by 2.
      *   If $G$ is positive (1 to 6): $E$ is divided by 2.
      *   If $G$ is 0: $E$ stays same.
      *   Everyone draws from **Hat B (Variable)** again.
  2.  **Calc:** $P = G + (E \times \text{Modifier})$.
  3.  **Compute:** Calculate $SS_P$.
  4.  **The Reveal:** Ask students to line up by Genotype (Low to High), then line up by Phenotype.
      *   *Outcome:* The order will likely scramble. A low $G$ with a huge $E$ boost might overtake a high $G$ with a suppressed $E$.
  5.  **Estimate:** Calculate $h^2$ anyway. It will yield a number (e.g., 0.4).
  6.  **Ask:** *"Does this number mean anything if the rank order changed? Can we partition variance additively if $G$ and $E$ multiply?"*
      *   *Goal:* Show that $h^2$ assumes additivity. $G \times E$ makes the coefficient uninterpretable.

  ### Debrief & Mapping (20 Minutes)
  *Do not start this until the simulation is complete. Use the board claims from Round 1.*

  **1. The Population Claim (Round 1 vs 2)**
  *   *Observation:* $h^2$ changed from 1.0 to 0.56 without any biological change.
  *   *Lesson:* Heritability is a property of a **population in an environment**, not a trait. It is a ratio of variances ($V_G / V_P$). If $V_E$ changes, $h^2$ changes.
  *   *Real World:* A trait can be highly heritable in a lab (controlled $E$) but low heritability in the wild (variable $E$).

  **2. The Malleability Claim (Round 3)**
  *   *Observation:* $h^2$ was 1.0, yet the mean shifted by 10 units due to Environment.
  *   *Lesson:* Heritability explains **variation around the mean**, not the **mean itself**.
  *   *Real World:* Height is highly heritable ($h^2 \approx 0.8$), but average height has increased massively due to nutrition (environment). High $h^2$ does **not** imply the trait is unmodifiable.

  **3. The Individual Claim (Round 4)**
  *   *Observation:* Rank order scrambled; additive math failed.
  *   *Lesson:* $h^2$ says nothing about an **individual's** development. You cannot say "60% of John's height is genetic."
  *   *Real World:* $G \times E$ interactions (reaction norms) are common. The additive model is a statistical convenience, not a biological law.

  **4. The Group Difference Claim (Extension)**
  *   *Lesson:* Even if $h^2$ is high within Group A and within Group B, it tells us **nothing** about the cause of the difference *between* Group A and Group B. (Reference Lewontin's corn analogy).

  ## IV. Troubleshooting & Predictable Failures

  ### 1. The "Round One" Trap
  *   **Predictable Misconception:** In Round 1, students will confidently assert, "This trait is determined by genes." They will treat $h^2=1$ as an ontological claim about causality.
  *   **Handling:** Do not correct them. Let them write it on the board. The power of the lesson relies on them feeling the embarrassment of that claim in Round 3. When Round 3 happens, point to the board: *"You wrote 'Environment doesn't matter' here. But we just added 10 to everyone. Which statement is wrong: the math, or the interpretation?"*

  ### 2. The "Rigged" Skeptic
  *   **Predictable Objection:** A student may argue, *"This is just arithmetic. Real biology isn't cards. You forced the variance to change."*
  *   **Handling:** Validate them immediately. *"You are absolutely right. The simulation is rigged. That is what a model is."*
  *   **Pivot:** Ask: *"Twin studies are also 'rigged' in a way. They assume Monozygotic and Dizygotic twins share environments equally (EEA). If that assumption is wrong, their $h^2$ is wrong, just like our card game. The question isn't 'is the model perfect?' but 'does the logic of variance hold when we un-rig it?'"*
  *   **Philosophical Hook:** Use this to discuss the **Equal Environments Assumption**. If MZ twins are treated more similarly than DZ twins, $V_E$ is artificially suppressed for MZ, inflating $h^2$. This mirrors our Round 1.

  ### 3. Arithmetic Bottlenecks
  *   **Risk:** Calculating Sum of Squares for 14 numbers takes too long.
  *   **Fix:** If they stall, intervene at Minute 8 of each round. Say, *"Stop calculating. Look at the spread. In Round 3, is the spread different from Round 1?"* (No). *"Then $SS_P$ is the same. Trust the symmetry."*
  *   **Backup:** Have a spreadsheet open on the projector. Input their numbers live. Use the manual calculation for *feel*, use the spreadsheet for *verification*.

  ### 4. Confusing Mean with Variance
  *   **Risk:** In Round 3, students will try to square the raw Phenotype ($P^2$) rather than the deviation from the new mean ($(P-\bar{P})^2$). This will inflate $SS_P$ artificially.
  *   **Fix:** Pre-empt this. In Round 3 instructions, explicitly say: *"Remember, variance is about spread. Your mean is now 10. Calculate distance from 10."* If they mess up, use it as a teaching moment: *"If you included the mean shift in the variance, you just proved why we separate Mean and Variance in statistics."*

  ## V. Limitations to Acknowledge (Closing the Session)
  End by listing what the simulation *failed* to capture, to ensure philosophical rigor:
  1.  **Gene-Environment Correlation:** In the sim, $G$ and $E$ were independent (drawn from hats). In reality, genotypes seek environments (niche picking). This inflates $h^2$ estimates in real studies.
  2.  **Epistasis:** We treated genes as additive values. Real genes interact with other genes.
  3.  **Measurement Error:** We assumed perfect measurement of $P$. Real phenotypes have noise, which lowers $h^2$.
  4.  **Causality:** Remind them that $h^2$ is a descriptive statistic, not a causal explanation. It describes the *status quo* of variation, not the *potential* for change.

  ## VI. Instructor's Cheat Sheet (The Numbers)
  *   **Genotypes:** -6, -5, -4, -3, -2, -1, 0, 0, 1, 2, 3, 4, 5, 6.
  *   **$SS_G$:** 182.
  *   **Round 1 ($E=0$):** $SS_P = 182$. $h^2 = 1.0$.
  *   **Round 2 ($E=$ Variable):** $SS_E \approx 140$. $SS_P \approx 322$. $h^2 \approx 0.56$.
  *   **Round 3 ($E=10$):** $SS_P = 182$ (Spread is unchanged). $h^2 = 1.0$. Mean shifts +10.
  *   **Round 4 ($G \times E$):** Rank order changes. $h^2$ calculation becomes conceptually void.
