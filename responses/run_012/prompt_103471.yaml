  (One last thought on Round 4): Interaction makes $V_P \neq V_G + V_E$. The calculation $h^2 = V_G/V_P$ still yields a number, but it becomes meaningless. I need to make sure they see the *rank order* change, which violates the assumption that $G$ is a fixed *rank*. I will add a "Rank Check" step.

