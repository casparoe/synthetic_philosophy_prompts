      *   *Wait, one more thing:* The prompt asks for *them* to compute the estimate. "The group itself generates the data and computes the estimate."
      *   *Compromise:* Divide class into 2 groups of 7. They compute for their half. Then average? No, variance doesn't average well.
      *   *Compromise 2:* They compute the *Sum of Squares* (SS). It's integers. $SS = \sum(x - \bar{x})^2$. $h^2 = SS_G / SS_P$. Since $G$ is fixed, $SS_G$ is calculated once. Then they just calculate $SS_P$ each round. This is doable in 5 mins with calculators.
      *   *Let's check the math:* 14 students. Mean might be a decimal. Squaring decimals is annoying.
      *   *Alternative:* Use "Deviation from Mean" cards?
      *   *Decision:* I will design the Genotypes to be symmetric around 0 (e.g., -7, -5, ... +5, +7) so the Mean is 0. This makes $SS = \sum(x^2)$. Much faster.
      *   *Environment:* Also symmetric around 0 for Round 2.
      *   *Round 3:* Constant offset.
      *   *Round 4:* Interaction.

  8.  **Finalizing the Logistics:**
      *   **Time:** 75 mins.
      *   **Intro:** 5 mins.
      *   **Round 1:** 10 mins (Data + Calc + Reaction).
      *   **Round 2:** 10 mins.
      *   **Round 3:** 10 mins.
      *   **Round 4:** 10 mins.
      *   **Debrief:** 30 mins.
      *   **Materials:** Genotype Cards (pre-made), Environment Slips (drawn from hats), Whiteboard, Calculators (phones).

  9.  **Addressing the "Rigged" Student:**
      *   This is a philosophy class. Epistemology of models is fair game.
      *   Strategy: Agree. "Yes, it is rigged. That's the point. Models isolate variables. The question is whether the *logic* holds when we un-rig it."

  10. **Writing the Response:**
      *   Tone: Professional, pedagogical, precise.
