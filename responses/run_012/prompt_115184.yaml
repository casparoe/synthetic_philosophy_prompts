  ### Analysis of Largest Gaps

  **Case D (The Light):** This represents a genuine disagreement about what matters morally. Form-morality views the rule as constitutive of a shared reality; breaking it undermines the predictability required for a common world, regardless of immediate consequences. Voice-morality views the rule as instrumental; once the purpose (safety/traffic flow) is absent, the obligation dissolves. This is not a difference of emphasis but a foundational clash between deontological and consequentialist intuitions regarding social norms.

  **Case B (The Form):** This case highlights a disagreement about which matters count as moral at all (the moral/conventional line). Form-morality treats the signature as a conventional duty essential to institutional function; refusing it is a failure of role. Voice-morality treats the signature as a moral assertion of belief; signing without belief is a lie. The gap arises because Form sees the act as procedural compliance, while Voice sees it as personal integrity.

  **Case G (The Fence):** This is a genuine disagreement about the value of uniformity versus substance. Form-morality argues that selective enforcement destroys the rule's power to coordinate behavior ("what keeps the neighborhood from becoming a place where each person does as he pleases"). Voice-morality sees the enforcement as petty tyranny because the substantive harm of the fence is negligible. Each morality identifies a real danger: Form fears chaos, Voice fears idolatry of the rule.

  ### Analysis of Smallest Gaps

  **Case E (The Twelve-Page Paper):** This case fails to fully separate the moralities because it is really about institutional role expectations; even Voice-morality acknowledges some duty to meet stated requirements in an educational contract, reducing the gap.

  **Case F (The Refusal):** This case fails to separate the moralities because it is about the limits of what an institution may demand; both moralities converge on respecting deep conscience when the institution accommodates the refusal without collapsing the workflow.

  ### Closing Position

  In the cases with the largest gaps, Voice-morality comes off better. While Form-morality correctly identifies the risk of anomie (as in Case D), it lacks the resources to distinguish between a rule that sustains a common world and a rule that has become empty ritual (Case B) or petty tyranny (Case G). Voice-morality is more defensible because it retains the capacity to critique rules based on their purpose and human impact, whereas Form-morality risks validating oppression simply because it is orderly. A society needs forms, but it needs voice to keep those forms honest.

