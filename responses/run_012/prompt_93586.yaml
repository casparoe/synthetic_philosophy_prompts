      *   *Cross-Cultural Challenge to M/C Distinction:* Some studies (e.g., in Samoa, rural Brazil) suggest this distinction isn't as sharp or is categorized differently. This is *disputed*.
      *   *The Is-Ought Gap:* This is the philosophical crux. Descriptive data (what people *do* think) does not logically dictate normative conclusions (what people *should* think).
      *   *Debunking Arguments:* Some philosophers (e.g., Joyce, Street) use evolutionary/cultural psychology to argue against moral realism. Others (e.g., Railton, Boyd) argue realism is compatible with variation.

  3.  **Address the Specific Questions:**

      *   *Q1: Does cross-cultural data kill moral objectivity?*
