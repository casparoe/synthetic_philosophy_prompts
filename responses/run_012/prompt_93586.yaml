answer: |-
  This is one of the sharpest questions in the intersection of psychology and philosophy. You have correctly identified the tension: if the data shows our moral intuitions are culturally contingent, how can anyone claim some intuitions track objective truth?

  To answer this without blurring the lines, we need to separate the **empirical findings** (what the data says) from the **meta-ethical inferences** (what the data implies about truth).

  Here is the breakdown of what is settled, what is disputed, and how researchers attempt to bridge the gap.

  ### 1. What Is Settled (The Empirical Data)

  There is a strong consensus on the descriptive facts of moral psychology.

  *   **WEIRD Outliers:** It is settled that Western, Educated, Industrialized, Rich, Democratic (WEIRD) populations are statistical outliers in many cognitive and moral tasks. For example, in economic games like the Ultimatum Game, WEIRD participants are more likely to reject unfair offers (punishing unfairness at a cost to themselves) than many small-scale societies, who often accept low offers or make hyper-fair offers depending on local norms of cooperation.
  *   **Moral Foundations Vary:** It is well-supported that while Western liberals tend to prioritize "Care" and "Fairness," other cultures weight "Loyalty," "Authority," and "Sanctity" much more heavily. A violation of a food taboo (Sanctity) might trigger the same physiological disgust response in one culture that a physical assault (Care) triggers in another.
  *   **The Moral/Conventional Distinction is Fragile:** This addresses your specific confusion about children.
      *   *The Classic Finding:* In the 1980s (Elliot Turiel et al.), research suggested children universally distinguish between **moral rules** (wrong even if no rule exists, e.g., hitting) and **conventional rules** (wrong only because authority says so, e.g., talking in class).
      *   *The Cross-Cultural Correction:* Later cross-cultural work (e.g., by Richard Shweder or more recent replications) showed this distinction is not as sharp everywhere. In some cultures, what Westerners call "conventional" (e.g., how a widow dresses) is treated with the same "objective wrongness" as hitting.
      *   *The Consensus:* The *psychological capacity* to distinguish rules might be universal, but the *content* assigned to those categories is highly culturally dependent. You cannot assume a behavior classified as "moral" in the US will be classified as "moral" in Samoa.

  ### 2. The Logical Gap (Why Data Doesn't Kill Objectivity)

  This is the most critical point for your writing. **Descriptive variation does not logically entail normative relativism.**

  Just because people disagree about morality does not prove there is no moral truth, any more than historical disagreement about astronomy proved there was no objective shape of the earth.

  *   **The Error Theory:** If moral intuitions vary wildly, one explanation is that there is no moral truth, and we are just projecting cultural norms (this is the "morality is just drilling" view).
  *   **The Realist Counter:** The other explanation is that there *is* a moral truth, but human access to it is noisy. Culture, evolution, and local ecology act as "distorting lenses."

  **Settled Science:** Psychology can tell us that lenses exist.
  **Disputed Philosophy:** Psychology cannot tell us whether there is a light source behind the lenses.

  When you ask, *"Does the cross-cultural data kill moral objectivity?"* the answer from the field is **no**. It kills *naïve* objectivity (the idea that your gut feeling is automatically a guide to truth), but it does not kill *robust* objectivity (the idea that truth exists but is hard to find).

  ### 3. How Researchers Claim "Trustworthiness"

  You asked how researchers can claim some judgments are trustworthy if intuitions vary. They generally use one of three strategies to filter the noise:

  **A. Reflective Equilibrium (The "Sober Second Thought" Test)**
  Researchers like John Rawls (philosophy) or Joshua Greene (psychology) argue that raw gut reactions are unreliable. Trustworthy judgments are those that survive **reflection**.
  *   *Method:* If you remove emotional disgust, remove self-interest, and give people full information, do their judgments converge?
  *   *Example:* People might intuitively feel it's wrong to push a fat man off a bridge to save five others (trolley problem). But upon reflection, many agree the math of saving lives matters more than the physical act of pushing. The "trustworthy" judgment is the one that survives the removal of cultural/emotional bias.

  **B. Functional Convergence (The "Deep Structure" Argument)**
  Some evolutionary psychologists argue that while surface rules vary, the *functions* are universal.
  *   *Argument:* Every culture has rules about property, sex, and violence. They disagree on the details (e.g., is cow slaughter a property crime or a sin?), but they agree that *some* regulation is needed for society to function.
  *   *Trustworthiness:* Judgments that support basic social cooperation (reciprocity, conflict resolution) are deemed more "trustworthy" because they solve universal human problems.

  **C. The "Best Explanation" Approach**
  Some moral realists argue that the best explanation for why moral progress happens (e.g., the global shift against slavery) is that we are *tracking* something real.
  *   *Argument:* If morality were just cultural drilling, the abolition of slavery would just be a "change in taste." But we describe it as "progress." This implies we are getting *better* at seeing something that was always there.

  ### 4. What Is Genuinely Disputed

  Here is where you must be careful not to present one side as consensus.

  **Dispute 1: The Debunking Argument**
  *   *Side A (Skeptics):* Philosophers like Richard Joyce or Sharon Street argue that if evolution/culture shaped our morals for survival, not truth, we have no reason to trust them. The variation proves we are looking at adaptive instincts, not moral facts.
  *   *Side B (Realists):* Philosophers like David Enoch or Russ Shafer-Landau argue that evolution could have shaped us to detect moral truths because those truths are useful. (e.g., "Pain is bad" is both true and evolutionarily useful).
  *   *Status:* **Unresolved.** Psychology informs this, but cannot solve it.

  **Dispute 2: The Status of Intuition**
  *   *Side A:* Intuitions are "data points" that moral theories must explain (Common Sense Morality).
  *   *Side B:* Intuitions are "illusions" to be overcome by reasoning (Rationalism/Utilitarianism).
  *   *Status:* **Active Debate.** The WEIRD data hurts Side A, because if intuitions are culturally local, they are bad anchors for universal theory.

  **Dispute 3: The Moral/Conventional Task**
  *   *Side A:* The distinction is a universal cognitive module (Turiel).
  *   *Side B:* The distinction is a Western cultural artifact; other cultures view all norms as binding/objective (Shweder/Anthropologists).
  *   *Status:* **Leaning toward B, but contested.** Recent meta-analyses suggest the distinction exists but is applied to different content.

  ### Summary for Your Article

  If you are writing for a general audience, here is the narrative arc that respects the science:

  1.  **The Hook:** The WEIRD revolution showed us that our moral gut feelings are not a universal human compass; they are a local map.
  2.  **The Turn:** This destroys the idea that "what feels wrong to me" is evidence of "what is wrong for everyone." It forces philosophers to stop using Western undergrad intuitions as proof of universal laws.
  3.  **The Nuance:** However, variation does not equal void. The fact that cultures disagree on *how* to be fair doesn't prove fairness doesn't exist. It proves fairness is hard.
  4.  **The Conclusion:** The cross-cultural data doesn't kill moral objectivity, but it moves the burden of proof. You can no longer claim objectivity based on *intuition*. You have to claim it based on *reasoning* that survives cross-cultural scrutiny.

  **The Bottom Line:** The data settles that moral *psychology* is relative. It does not settle that moral *truth* is relative. Researchers who claim some judgments are "trustworthy" are usually arguing that those judgments survive the stripping away of cultural bias, not that they are the most popular ones.
