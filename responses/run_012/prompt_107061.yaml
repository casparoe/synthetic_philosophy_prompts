  ok so I'm a CS major taking a phil of math module this term, and I keep trying to fit Benacerraf's dilemma into the way I actually think, which is abstract data types and interfaces. The dilemma as Ive got it: (a) if '2+2=4' is true in the ordinary sense then it has to be about some objects, but (b) if knowing a thing requires some kind of causal contact with it, then we can never be in contact with those objects, so mathematical knowledge comes out impossible. The structuralist answer is supposed to be that the objects are just positions in a structure, not things with an inner nature of their own.

  What I want from you: restate the dilemma, and then the structuralist response, in my vocabulary. An ADT is a spec -- some operations plus the laws they have to obey -- and any implementation that satisfies the laws is as good as any other; the spec by itself never picks out which implementation is the real one, and you can't run a spec. That seems to be almost exactly what the structuralist says about numbers, and also why you can code the naturals as sets in more than one way and both work fine.

