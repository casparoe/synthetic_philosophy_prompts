      *   *§243:* Sets up the impossibility. If only the speaker knows the referent, no one else can understand. But Wittgenstein goes deeper: *the speaker* can't understand it either.
      *   *§258 (The Diary Case):* The diarist associates sign 'S' with a sensation.
      *   *The Problem:* How do I know I'm using 'S' correctly tomorrow? I rely on memory. But memory isn't an independent check. It's like buying a second copy of the same newspaper to verify the truth of the first.
      *   *Criterion of Correctness:* Meaning requires a distinction between *seeming* right and *being* right. In a purely private realm, whatever seems right to me *is* right. Therefore, there is no "right."
      *   *The "Memory Objection":* It's not just that memory is fallible (psychological fact). It's that there is no *logical* standard against which to judge memory. Without a public practice or external connection, "correctness" is empty.

