  I've somehow ended up as the resident philosopher at my old institute's retired-staff lunch club — thirty-five years in molecular biology, picked up Wittgenstein about four years ago, so I'm maybe two chapters ahead of the room. Next month I've got forty-five minutes and a whiteboard to do family resemblance and language games for a dozen retired chemists and biologists who've spent their whole lives hunting necessary and sufficient conditions (no readings, I've tried, they dont do them). Don't explain it to me — plan how I should teach it: what has to be in place before the idea can land at all for that crowd, what single example should carry the whole session and what it needs to have and lack, and where in the sequence each misconception gets headed off. My instinct is to build it on gene concepts — I lived through the classical-gene-to-molecular-gene mess and I think that's the best case going — but tell me if something else should carry it instead, and if gene does stay, what it can't show that I'll be tempted to make it show. Misconceptions I'm expecting: they'll hear "no definition" as "no facts of the matter"; they'll reach for clustering and similarity space before anything else and think that's what Wittgenstein meant; at least one will ask whether he thinks words just mean whatever we say they mean. Tell me where each gets handled, and whether I've missed one. Also give me a single closing question that tells me whether it landed, and what I should openly refuse to go into at this level.

  Put it in JSON so I can paste it into my notes, with these fields:

  {
    "order": [{"step": 1, "idea": "...", "why_it_has_to_come_here": "...", "misconception_handled_here": "..."}],
