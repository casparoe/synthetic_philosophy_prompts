  # Decision Tree: Formal Constraint in Translation

  **Instructions:** Begin at Node 1. Answer the question based on your intuition about a specific case (e.g., a rhyming poem, a mnemonic, a gloss). Follow the arrow to the next node or leaf. Record your path.

  ### Node 1: Fidelity Object
  **Question:** Is the primary obligation of the translation to the **properties of the source text/author's act** or to the **experience of the target reader**?
  *   **Target Reader:** Go to Node 2.
  *   **Source Text/Author:** Go to Node 3.

  ### Node 2: Success Term (Reader Path)
  **Question:** Is translation a **binary success term** (it is either a translation or it isn't) or a **continuum of approximation** (it can be more or less of a translation)?
  *   **Binary:** **Leaf 1 (Target-Culture Purist).**
  *   **Continuum:** **Leaf 2 (Effect Approximator).**

  ### Node 3: Constraint Status (Source Path)
  **Question:** Is the formal constraint (rhyme, meter, scheme) **part of what the poem says** (content) or merely a **vehicle for saying it** (form)?
  *   **Vehicle:** Go to Node 4.
  *   **Content:** Go to Node 5.

  ### Node 4: Audience (Vehicle Path)
  **Question:** Is the intended audience **specialized** (willing to consult apparatus) or **general** (expects a standalone text)?
  *   **Specialized:** **Leaf 3 (Scholarly Glossator).**
  *   **General:** **Leaf 4 (Message Simplifier).**

  ### Node 5: Constraint Nature (Content Path)
  **Question:** Must what is carried across be the constraint's **specific shape** (count, pattern) or its **function** (mnemonic, musical, ludic)?
  *   **Function:** Go to Node 6.
  *   **Shape:** Go to Node 7.

  ### Node 6: Purpose (Function Path)
  **Question:** Is the translation intended for **performance** (oral/active use) or **study** (analysis/appreciation)?
  *   **Performance:** **Leaf 5 (Mnemonic Performer).**
  *   **Study:** **Leaf 6 (Functional Analyst).**

  ### Node 7: Untranslatability (Shape Path)
  **Question:** If the shape cannot be replicated, is this due to the **text/language pair** (impossible) or the **translator's resources** (difficult)?
  *   **Text/Pair:** **Leaf 7 (Tragic Formalist).**
  *   **Translator:** Go to Node 8.

  ### Node 8: Effort (Translator Path)
  **Question:** Are the translator's resources **limitless** (must try everything) or **bounded** (must accept trade-offs)?
  *   **Limitless:** **Leaf 8 (Virtuoso Formalist).**
  *   **Bounded:** **Leaf 9 (Pragmatic Compromiser).**

  ---

  ## The Leaves: Positions and Commitments

  1.  **Target-Culture Purist:** *Awkward Commitment:* Declares most historical translations non-translations if they feel foreign.
  2.  **Effect Approximator:** *Awkward Commitment:* Cannot condemn a version that changes everything but feels similar.
  3.  **Scholarly Glossator:** *Awkward Commitment:* Requires the reader to do the work of synthesis between text and notes. **(Case: Version with footnotes/gloss)**
  4.  **Message Simplifier:** *Awkward Commitment:* Treats poetry as disposable wrapping for prose sense.
  5.  **Mnemonic Performer:** *Awkward Commitment:* Fails if read silently on the page. **(Case: Poem whose form is a mnemonic device)**
  6.  **Functional Analyst:** *Awkward Commitment:* Reduces the poem to a set of instructions for effect.
  7.  **Tragic Formalist:** *Awkward Commitment:* Admits defeat before trying. **(Cases: Target language lacks rhyme; Poem claims it cannot be translated)**
  8.  **Virtuoso Formalist:** *Awkward Commitment:* Sacrifices sense for sound without guarantee of gain. **(Case: Rendering that keeps scheme exactly but loses pun)**
  9.  **Pragmatic Compromiser:** *Awkward Commitment:* Accepts loss as inevitable without exploring limits. **(Case: Rendering that drops scheme but saves pun)**

  ---

  ## Empty Logical Space

  Not every combination of the five distinctions yields a coherent position. The following clusters are unoccupied:

  *   **Binary Success + Vehicle + Content:** Incoherent. One cannot hold that translation is binary while treating form as both vehicle and content simultaneously.
  *   **Source Fidelity + Vehicle + Shape:** Unattractive. If form is merely a vehicle, preserving its shape over function serves no fidelity goal.
  *   **Reader Fidelity + Source Properties:** Incoherent. One cannot owe fidelity primarily to the reader while measuring success by source properties.
  *   **Continuum + Text/Pair Untranslatability:** Unexplored. If translation is a continuum, "untranslatability" should merely mean "low approximation," not a hard limit imposed by the text.

  ---

  ## Indistinguishable Leaves

  Some leaves are logically distinct but cannot be separated by the concrete cases provided:

  *   **Leaf 3 (Scholarly Glossator) vs. Leaf 4 (Message Simplifier):** Both treat constraint as vehicle. The cases provided do not specify audience reception, only the presence of notes.
  *   **Leaf 5 (Mnemonic Performer) vs. Leaf 6 (Functional Analyst):** Both prioritize function. The cases do not specify whether the translation is spoken or read.
  *   **Leaf 1 (Target-Culture Purist) vs. Leaf 2 (Effect Approximator):** Both prioritize reader experience. The cases (e.g., dropping scheme to save pun) could be accepted by both, differing only in whether the result is labeled a "translation" or an "approximation."

  ---

  ## Instructor's Defense

  I defend **Leaf 8 (Virtuoso Formalist)**.

  **Reasoning:** If the constraint is content (Node 3), then altering the shape alters the poem's identity. If untranslatability is a matter of translator resources (Node 7), then failure is a moral deficit, not a linguistic fact. The Virtuoso position respects the author's act as a feat of constraint that demands a reciprocal feat from the translator.

  **Strongest Objection:** It risks producing a hollow shell—a perfect rhyme scheme that says something the original never said (the "lose pun" case). It privileges the *look* of the poem over the *work* the poem does, potentially betraying the source text's meaning to save its skin.
