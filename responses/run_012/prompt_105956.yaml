      *   **Stream of Consciousness:** (From *Principles of Psychology*). Consciousness is continuous, not made of discrete beads. It has "fringes" and "halos." It's always changing.
      *   **Radical Empiricism:** Relations are experienced directly. There is no sharp subject-object dualism in the immediate flow. Truth is made in the process of verification.
      *   **Vagueness/Continuity:** James rejects sharp boundaries where experience doesn't show them. He is wary of intellectualism (imposing discrete concepts on continuous experience).
      *   **Knowledge as a Process:** Knowing isn't a static state; it's a lead, a tendency, a verification process.

  3.  **Analyze the Contemporary Debate (Williamson's Anti-Luminosity):**
