      *   **KK Principle:** $Kp \rightarrow KKp$.
      *   **Williamson's Argument:** Sorites-style. If a state fades gradually (e.g., feeling cold), there's a point where you feel it but can't reliably judge it. Safety conditions on knowledge require a margin for error. Therefore, no non-trivial mental state is luminous.
