answer: |-
  It is great that you are pressing on this before the next round because your friend is making a very specific metaphysical bet while pretending it is a settled scientific fact, and your intuition that the analogy splits into a boring truth and a exciting falsehood is basically correct. Your three-way split between the thin description, the thick architecture, and the question of universality is actually a very sharp way to carve up the problem, though I think there is a slight smuggling of assumptions in the thin version that we should clear up first. When you say the thin version is just that the brain can be described by an algorithm with inputs and outputs, you are touching on the concept of computability, but the risk there is pancomputationalism, which is the idea that literally any physical system can be described as computing something if you map the states correctly. A storm has inputs and outputs and internal states, and you can write an algorithm to predict its behavior, but we do not say the storm is a computer. So the thin version is only useful if you mean that the brain processes information in a way that is causally dependent on that information processing, not just that its behavior is predictable. If you stick to that stricter definition, the thin version tells us that neuroscience can use computational models to understand function, which is true and useful, but it does not tell us that the brain is made of the same stuff as a laptop.

  If we look at what follows from the thin version being the only truth, then psychology and neuroscience lose nothing practical but gain a lot of humility. Neuroscience continues to map circuits and chemistry, and psychology continues to model behavior, but the idea that you can abstract the mind away from the body becomes much shakier. In this scenario, the computer analogy is just a metaphor, like saying the heart is a pump. It helps you understand the function, but you cannot build a mechanical heart out of rubber bands and expect it to regulate blood chemistry the way a muscle does. If the brain is only a computer in the thin sense, then the specific physical substrate matters deeply. It means that the wetness, the chemical diffusion, the quantum effects, or the analog continuous nature of neural firing might be constitutive of the mind itself, not just implementation details. This would mean that psychology does not lose its ability to predict behavior, but it loses the claim that a silicon chip could ever feel pain or understand a joke in the way a human does, because those things might depend on the specific biological dynamics that the thin algorithm describes but does not replicate.

  Now consider the thick version, which is what your friend is banking on. This is the claim that there is a genuine hardware-software distinction in the brain, that memories are stored data separate from the processing unit, and that the mind is substrate-independent. If this is true, then your friend is correct that mind uploading is theoretically possible, but it still hangs on things nobody has settled, specifically the granularity of the scan. Even if the brain is a computer in the thick sense, we do not know if the relevant software is written at the level of the neuron, the synapse, the protein, or the quantum state. Your friend assumes there is a level of abstraction where the copy is perfect, but if the thick version is true only up to a point, the emulation might run but be a philosophical zombie, functioning without consciousness. However, the bigger problem for your friend is that modern neuroscience increasingly suggests the thick version is empirically false. In a laptop, the hardware stays static while the software changes. In the brain, learning is the hardware changing. There is no hard drive separate from the processor. The structure is the function. This means that to copy the program, you have to copy the physics exactly, which undermines the whole point of uploading to a different substrate like a server. If the thick version turns out to be false, the analogy stops earning its keep for anything regarding consciousness or identity, and it becomes a hindrance because it leads engineers to build AI that looks like logic gates when it should look like dynamic systems.

  Your suspicion about universality is also worth dissecting because it is necessary but not sufficient for your friend's goal. Universality means the brain can simulate any other computing system, which is likely true given human flexibility, but that does not mean the brain is architected like a universal Turing machine. A brain might be universal in capacity but specialized in structure, much like how you can simulate a weather system on a laptop, but the laptop is not made of wind and pressure. If the brain is universal, it just means it is powerful, not that it is portable. The analogy only buys you uploading if you have universality plus substrate independence. You can have a system that is universal but deeply tied to its physics, like a specific type of analog circuit that can compute anything but only while remaining that specific circuit. So universality alone does not save your friend's bet. He needs the thick version to be true, specifically the part about multiple realizability, which is the philosophical claim that the same mental state can be realized in different physical stuff. That is an unproven assumption, not a scientific result.

  When you ask if the thick reading actually delivers the uploading promise, the answer is that it delivers the possibility but not the guarantee, because it relies on the assumption that consciousness supervenes on computation rather than physics. If the thick version is true, then copying the state copies the mind, but we do not know what the state is. Is it the firing rate? The timing? The neurotransmitter concentration? The glial cell activity? Your friend is assuming we will know where to draw the line between the software to be copied and the hardware to be discarded. If it turns out brains are only computers in the thin sense, then psychology does not lose its explanatory power for behavior, but it loses the promise of immortality via server. Neuroscience gains a renewed focus on the body and the environment, recognizing that cognition is embodied and not just a brain-in-a-vat calculation. The analogy stops earning its keep when it suggests that we can ignore the biology, which is currently where the most interesting discoveries are happening, such as how gut bacteria or immune responses affect mood and thought.

  I think your three-way split is the right cut, but I would refine the thin version to be about causal description rather than just algorithmic description. The real distinction you are smuggling in, which is valid, is between simulation and emulation. Your friend wants emulation, where the server becomes the brain. The thin version only gives you simulation, where the server models the brain. A simulation of a storm does not get you wet, and a simulation of a brain might not get you conscious. The thick version claims the simulation is sufficient for emulation because the mind is abstract. So the argument you should have with your friend is not about whether the brain computes, because in the thin sense it obviously does, but about whether the computation is abstractable from the biology. He is assuming functionalism is true, which is a philosophical stance, not a scientific fact. You should press him on where the software is stored in the brain if the hardware is constantly rewiring itself. If he cannot point to the hard drive, he cannot claim the brain is a computer in the thick sense, and if he cannot claim that, his upload plan is science fiction rather than engineering.

  Ultimately, the stakes are about what kind of thing a human being is. If the thick version is true, we are patterns that can be copied. If the thin version is true, we are processes that must be continued. The computer analogy is useful for neuroscience in the thin sense because it allows for modeling information flow, but it becomes dangerous when it convinces people that the medium does not matter. Your friend is saving up for a solution to a problem that might not exist in the way he thinks. If the brain is not a computer in the thick sense, then scanning it is like scanning a painting to preserve the beauty of the brushstrokes while throwing away the canvas and paint. You might get the image, but you lose the art. You should tell him that he is welcome to bet on the thick version, but he should acknowledge he is betting on a specific philosophy of mind that is currently under heavy fire from the very neuroscience he hopes will save him. The analogy is a tool, not a truth, and like any tool, it breaks if you use it for a job it was not designed for.
