prompt: |-
  Right, so I keep having this argument with a friend and I want to get it straight before the next round. He says the brain is a computer. I say thats either boring or false, and I want to know what actually follows from each version.

  Here's the split I've landed on. Thin version: you can describe what a brain does with some algorithm — there's a level of description where it's all inputs, internal states and outputs. Thick version: the brain is a computer the way my laptop is, i.e. it runs stored programs, there's a real hardware/software distinction, and the same program could in principle run on wetware, silicon, or a room full of people waving flags. And a third thing I suspect is doing a lot of quiet work: universality — a laptop can simulate any other computer, and I'm not sure the analogy buys you anything about brains unless they can do that too.

  What I want from you is the most important implications of each of these readings. Concretely, my friend is saving up on the assumption that one day he'll get his brain scanned and copied onto a server, and that if the brain is a computer this is just a matter of the right scan plus the right emulator. Does the thick reading actually deliver that for him, or does it hang on things nobody has settled? And what changes if it turns out brains are only computers in the thin sense — does psychology lose anything, does neuroscience gain anything, does the analogy stop earning its keep? I'd also like you to tell me if my three-way split is even the right cut, or if I'm smuggling in a distinction that doesn't belong there.

  Please dont give me headings or bullet points or bold text or a table, just write it out as continuous prose like you'd write an email. Long is fine.
