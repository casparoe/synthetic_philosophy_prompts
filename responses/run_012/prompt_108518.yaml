answer: |-
  Subject: Re: Laws of Nature, Holism, and the Best System Account

  Cheers for the message. It is a proper rabbit hole, isn't it? The "source code" analogy is a brilliant hook, but as you have spotted, it tends to smuggle in a governing conception right from the start. If laws are the code *running* the universe, they must exist prior to or independently of the output. The Humean, however, insists the laws are merely the best compression algorithm for the output file.

  You are quite right to identify holism as the primary friction point. For a reading group, it is worth disentangling three specific threads: the cost of holism, the explanatory circularity worry, and the vocabulary objection. Here is how the landscape looks from where you are standing.

  ### 1. The Holism Objection: A Feature or a Bug?

  Your intuition regarding the "one electron" problem is spot on. On the Best System Account (BSA), lawhood supervenes on the *entire* mosaic of particular facts. If one changes a single particle's trajectory in the Andromeda galaxy, the total pattern of the universe shifts. Consequently, the system that best balances simplicity and strength might change. A regularity that was previously a law could become a mere accident, or vice versa, without any local physical difference here on Earth.

  To the Anti-Humean (the governing theorist), this is absurd. Laws should be local drivers. If gravity holds here, it holds in virtue of a relation between mass and spacetime, not in virtue of what a quark is doing in Andromeda. They argue the Humean has got the direction of determination backwards: the laws make the facts what they are, not the other way round.

  **Why the Humean accepts the bullet:**
  The Humean (following Lewis) bites this bullet because they prioritise ontological parsimony over local intuition. For the Humean, there is no "governing" relation in the ontology. There are only events in spacetime. Therefore, lawhood *must* be a global matter because it is a matter of description.

  The Humean reply is that holism is not a causal claim. Changing that distant electron does not *cause* the law to change here. Rather, the truth conditions for the statement "L is a law" are global. It is akin to saying, "This sentence is the longest in the book." If you add a word to a different sentence elsewhere, the status of the first sentence changes, even though the first sentence itself remains untouched. The Humean argues we should not expect metaphysical supervenience bases to respect our intuitions about causal locality.

  **What is at stake:**
  The Anti-Humean thinks this renders laws too fragile to do the work we need them to do (e.g., supporting counterfactuals). If the laws depend on the whole mosaic, how can we say what *would* have happened if the mosaic were different? The Humean replies that counterfactuals are also analysed via the best system, so the machinery holds together, albeit in a way that feels somewhat circular to the outsider.

  ### 2. The Explanatory Objection

  This is perhaps the most serious charge. The standard view is that laws explain their instances. Why did the apple fall? Because of the law of gravitation. But on the BSA, the law of gravitation is merely a summary of all the instances of falling apples (and planets, etc.).

  **The Objection:**
  You cannot explain a fact by citing a generalisation that is true only because that fact (and others like it) obtains. It looks like a vicious circle: the instances make the law, but the law explains the instances. As Armstrong famously put it, the Humean laws are "cosmic coincidences."

  **The Humean Reply (The Two-Stage View):**
  The sophisticated Humean (like Lewis or Loewer) distinguishes between *metaphysical determination* and *scientific explanation*.
  1.  **Metaphysically:** The mosaic of particular facts determines which system is best, and thus determines the laws. (Facts $\rightarrow$ Laws).
  2.  **Scientifically/Epistemically:** We use the laws to explain the facts. (Laws $\rightarrow$ Facts).

  They argue there is no contradiction here, just as there is no contradiction in saying that the mean height of a population is determined by the individuals, whilst we use the mean to explain trends about the individuals. The relation of "explanation" is not the same as the relation of "truth-making."

  **Does this work?**
  For the reading group, the question is whether this distinction is robust. The Anti-Humean will argue this is merely "systematising ignorance." It tells us *how we organise* our knowledge, but not *why the universe behaves* regularly. The Humean accepts this: they claim the universe doesn't "behave" regularly for a reason; it just *is* regular. The "explanation" is purely pragmatic, serving our cognitive need for unification. If your group values scientific realism, this pragmatic turn might feel like a retreat.

  ### 3. The Vocabulary Relativity Worry

  You mentioned the worry that simplicity is language-relative. If I describe the mosaic using "grue" and "bleen" predicates rather than "green" and "blue", a different system might emerge as the simplest. If laws depend on simplicity, and simplicity depends on our choice of vocabulary, then laws depend on our language. That sounds like a *reductio*.

  **The Humean Defence: Natural Properties**
  Lewis's standard move here is to anchor the Best System in **perfectly natural properties**. We are not allowed to formulate the competing systems using just any old predicates; we must use predicates that carve nature at its joints. The system that best balances simplicity and strength *in terms of natural properties* wins.

  **Is this fatal?**
  It is not fatal, but it is uncomfortable. The Anti-Humean will pounce on the definition of "natural properties."
  *   If "natural" just means "the properties that appear in the final laws," the account is circular.
  *   If "natural" means something independent of the laws (e.g., primitive universals or sparse properties), the Humean is smuggling in Anti-Humean ontology. They are positing a modal structure to the properties themselves to ground the laws.

  Many critics argue that once a Humean commits to robustly natural properties to solve the vocabulary problem, they have conceded the main battle. They have admitted there is more to the world than just the particular matters of fact; there is also a modal structure to the properties themselves.

  ### Summary for the Group

  To synthesise this for your discussion:

  1.  **The Governing View (Anti-Humean):** Laws are the source code. They possess modal force (necessitation, powers, or dispositions). They explain *why* the mosaic is as it is.
      *   *Cost:* Metaphysically mysterious. What is this "necessitation"? How do we detect it?
      *   *Benefit:* Matches scientific practice and intuition regarding explanation and counterfactuals.

  2.  **The Best System View (Humean):** Laws are the best compression algorithm. They supervene on the mosaic.
      *   *Cost:* Accepts holism (distant facts determine local laws), accepts a pragmatic notion of explanation, and relies on a contentious notion of "natural properties" to avoid language relativity.
      *   *Benefit:* Ontologically cheap. No mysterious modal glue. Fits well with a rigorous empiricism.

  **The Verdict:**
  The Humean is not changing the subject; they are offering a deflationary account of what lawhood *is*. They argue the Anti-Humean is reifying a figure of speech. When scientists say laws "govern," they mean the regularities are robust and systematic, not that there is a metaphysical enforcer.

  However, if your group feels that regularity without a *ground* for that regularity is intellectually unsatisfying, the Humean reply will feel like a dodge. The Humean asks us to accept that the universe is simply a brute fact that happens to be compressible. The Anti-Humean insists there must be a reason *why* it is compressible.

  I hope that helps untangle the knot. It is a fascinating debate, and one where both sides have rather bloody noses by the end. Do let me know how the reading group gets on.

