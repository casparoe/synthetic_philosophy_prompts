answer: |-
  Here is the design for the ninety-minute session.

  ### 1. Order of Ideas and Dependencies

  The session is divided into three thirty-minute blocks. The dependencies are strict; reversing them creates the misconceptions you wish to avoid.

  **Block 1: The Metric and The Example (0–30 mins)**
  *   **Step 1.1: Veritism and Graded Accuracy.** Define the epistemic goal: minimizing inaccuracy.
      *   *Dependency:* Must precede the scoring rule. If you introduce the math first, accuracy looks like an arbitrary penalty system.
      *   *Cost of Reversal:* Students will treat the scoring rule as a pragmatic convention rather than a measure of an epistemic good.
  *   **Step 1.2: The Scoring Rule (Brier Score).** Define $S(c, w) = \sum (c_i - v_i)^2$.
      *   *Dependency:* Must precede the Example.
      *   *Constraint:* Do not call this "utility" or "loss" yet. Call it "Inaccuracy."
  *   **Step 1.3: The Example (0.5 vs 0.33).** Calculate the scores for the 0.5/0.5/0.5 function and the 1/3/1/3/1/3 function across the three worlds.
      *   *Dependency:* Must precede the Generalization.
      *   *Goal:* Establish that the probabilistic function beats the non-probabilistic one in *every* world.
  *   **Step 1.4: Generalization (The Dominance Theorem).** State that this is not a fluke of the numbers: *any* non-probabilistic function is dominated by *some* probabilistic function.
      *   *Dependency:* Must precede the Normative Bridge.

  **Block 2: The Hinge — Dominance vs. Maximization (30–60 mins)**
  *   **Step 2.1: The Decision-Theoretic Fork.** Explicitly contrast two ways to use the scores:
      1.  **Maximization:** Weight scores by probabilities of worlds, minimize *Expected* Inaccuracy.
      2.  **Dominance:** Compare scores world-by-world, minimize Inaccuracy *simpliciter*.
      *   *Dependency:* Must occur immediately after the Example, before students naturalize the reasoning as EU.
      *   *Cost of Reversal:* If students settle on the EU interpretation first, you cannot dislodge the requirement for priors later.
  *   **Step 2.2: Closing the EU Reading.** Show that Dominance requires *no* probabilities over worlds.
      *   *Goal:* Secure the "Accuracy-First" selling point (no circularity, no priors).
      *   *Misconception Check:* "That the argument is circular because it needs probabilities." (Head this off here).
  *   **Step 2.3: The Structural Result.** Conclude that the argument establishes Probabilism (structure), not specific credences (content).

  **Block 3: The Gap — Mathematics to Normativity (60–90 mins)**
  *   **Step 3.1: The Normative Bridge.** Introduce the principle: "If Act A dominates Act B, it is irrational to choose B."
      *   *Dependency:* Must precede the discussion of Irrationality.
      *   *Goal:* Separate the mathematical fact (dominance) from the normative conclusion (irrationality).
  *   **Step 3.2: The Load-Bearing Assumptions.** Interrogate the Bridge and the Metric.
      1.  **Additivity:** Why sum the scores? (Without this, the geometry of dominance changes).
      2.  **Strict Propriety:** Why this scoring rule? (Without this, probabilistic functions might dominate *each other*, leading to dogmatism).
      *   *Dependency:* Must be the final conceptual move.
      *   *Goal:* Show what the argument *presupposes* vs. what it *establishes*.
  *   **Step 3.3: Check for Understanding.** (Last 5 mins).

  ---

  ### 2. The One Example

  **Candidate:** $W = \{w_1, w_2, w_3\}$.
  *   **Agent A (Incoherent):** $c(w_1)=0.5, c(w_2)=0.5, c(w_3)=0.5$.
  *   **Agent B (Coherent):** $c^*(w_1)=1/3, c^*(w_2)=1/3, c^*(w_3)=1/3$.
  *   **Metric:** Brier Inaccuracy Score (Sum of squared errors).

  **Can it carry the session?**
  Yes, but it cannot do all three jobs equally well. It excels at **Graded Accuracy** and **World-by-World Structure**. It fails at **The Pull of the Incorrect Function**.

  **Why it fails the "Pull" job:**
  To a doctoral student, $0.5+0.5+0.5 = 1.5$ looks like a blatant arithmetic error, not a tempting epistemic stance. It lacks normative "pull." They will dismiss Agent A as incompetent rather than seeing the argument as rescuing them from a subtle trap.

  **How to fix it (without changing the numbers):**
  You must verbally rehabilitate Agent A in the first 10 minutes. Frame the 0.5 assignment not as "bad math," but as **"Hyper-Cautious Agnosticism."**
  *   *Script:* "Imagine an agent who thinks: 'I have absolutely no evidence. To be safe, I want to ensure I never assign low credence to the truth. So I will assign a robust 0.5 to everything.' This feels epistemically virtuous (cautious), but mathematically it violates the calculus."
  *   *Why:* This gives the students a reason to *want* Agent A to be permissible. When the math shows Agent A is dominated, it feels like a substantive result, not a tautology.

  **Where it breaks down:**
  The example proves *this* incoherent function is dominated. It does not prove *all* are.
  *   *Replacement:* You do not need a new example. You need a **geometric gesture**. At minute 30, draw a triangle (the probability simplex) on the board. Place the 1/3 point in the center. Place the 0.5 point outside. Draw a perpendicular line from the 0.5 point to the triangle.
  *   *Instruction:* "The theorem states that for any point outside this triangle, there is a point inside that is closer to every vertex." This bridges the specific calculation to the general theorem without new arithmetic.

  ---

  ### 3. Misconceptions: Order and Correction

  Your list is strong, but the order must match the cognitive flow of the argument. Here is the corrected sequence, the point of intervention, and one missing misconception.

  1.  **"Accuracy is simply truth." (Binary vs. Graded)**
      *   *When:* Minute 5 (Step 1.1).
      *   *Correction:* "If accuracy were binary, all false credences would be equally bad. We need a metric that penalizes 0.9 credence in a falsehood more than 0.1 credence."
  2.  **"The choice of scoring rule is conventional."**
      *   *When:* Minute 15 (Step 1.2).
      *   *Correction:* "We use Brier (squared error) because it has specific mathematical properties. If we used Absolute Distance, the dominance theorem fails. The choice is substantive, not conventional."
  3.  **"The argument is circular (needs priors)." / "This is just Expected Utility."**
      *   *When:* Minute 40 (Step 2.2). **This is your Hinge.**
      *   *Correction:* "EU requires weighting worlds by probability. Dominance compares worlds one-by-one. We proved B beats A in $w_1$, in $w_2$, and in $w_3$. We did not sum them. Therefore, we needed no prior."
  4.  **"The argument tells you which credences to have."**
      *   *When:* Minute 55 (Step 2.3).
      *   *Correction:* "The argument shows non-probabilities are dominated. It does not show that 1/3 dominates 1/2 (if both are probabilistic). It constrains structure, not content."
  5.  **"Being dominated and being irrational come to the same thing."**
      *   *When:* Minute 70 (Step 3.1).
      *   *Correction:* "Dominance is a mathematical relation. Irrationality is a normative status. We need a Bridge Principle to connect them."

  **Missing Misconception:**
  *   **"Accuracy is the *only* epistemic good." (Veritism)**
      *   *When:* Minute 5 (Step 1.1).
      *   *Correction:* State clearly: "We are assuming Veritism. If there are other goods (e.g., explanatory power, understanding) that trade off against accuracy, this argument does not compel you."
      *   *Why:* If you don't flag this, students will think the argument proves accuracy is the *only* good, rather than assuming it.

  ---

  ### 4. Check for Understanding (Last 5 Minutes)

  One question is insufficient to separate the Dominance-graspers from the EU-graspers, because a student can guess the right answer for the wrong reason. You need a **pair of questions**. Put these on the board. Ask for a show of hands for each.

  **Question A (The Prior Test):**
  "Suppose we discover a prior probability distribution over the three worlds such that the 0.5/0.5/0.5 function has higher *expected* accuracy than the 1/3/1/3/1/3 function. Does the Accuracy-First argument for Probabilism fail?"
  *   *Correct Answer:* **No.** (Because the argument relies on dominance, not expectation. If it is dominated, no prior can make it have higher expected accuracy, but the logic of the argument doesn't *use* the prior).
  *   *Diagnostic:* If they say "Yes," they think the argument relies on Expected Accuracy (EU).

  **Question B (The Bridge Test):**
  "Suppose we accept the mathematics: the 0.5/0.5/0.5 function is accuracy-dominated. Does it *necessarily* follow that holding these credences is irrational?"
  *   *Correct Answer:* **No.** (It follows only if we accept the Normative Bridge Principle. One could reject the bridge while accepting the math).
  *   *Diagnostic:* If they say "Yes" without hesitation, they have conflated the mathematical result with the normative conclusion (the "Gap" you want them to see).

  *Target:* You want students to answer **No** to A (showing they see it's a dominance argument) and **No** to B (showing they see the gap between math and norm).

  ---

  ### 5. What to Leave Out (and How to Say So)

  You have limited time. You must explicitly bracket three topics to prevent students from thinking you are ignoring objections they know are relevant.

  **1. Diachronic Norms (Conditionalization)**
  *   *Status:* Safe to omit.
