answer: |-
  ### Table 1: Desiderata for an Adequate Ethical Framework

  | ID | Requirement | What it must actually produce | Case or consideration behind it | Status | Framework families it excludes, and why |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **R1** | **Scalable Aggregation** | A method to weigh harm that does not halt decision-making when individual counts exceed thousands. | **Case 5 (Numbers):** Individual counting makes agriculture look catastrophic; species-only counting ignores suffering. | Non-negotiable | **Strict Individual Welfarism:** It requires summing every individual's pain, which creates paralysis at insect scales. |
  | **R2** | **Systemic Consequence** | A mandatory assessment of secondary ecological effects, not just direct mortality of the target. | **Case 1 (Resurgence):** Killing predators leads to worse pest outbreaks later. | Non-negotiable | **Narrow Consequentialism:** Focuses only on the immediate kill count of the target pest, ignoring feedback loops. |
  | **R3** | **Non-Neutral Baseline** | A comparison of the intervention against the "do nothing" scenario, acknowledging natural harm. | **Case 4 (Baseline):** Untreated fields involve slow death by starvation and parasitism; inaction is not harm-free. | Non-negotiable | **Status-Quo Bias:** Assumes leaving nature alone is ethically neutral or inherently better than intervention. |
  | **R4** | **Temporal Balance** | A rule for trading off immediate individual welfare against long-term population viability. | **Case 6 (Resistance):** Quick death (high welfare) causes resistance; slow impairment (low welfare) preserves efficacy. | Non-negotiable | **Presentist Welfarism:** Prioritizes immediate suffering reduction regardless of future collapse of control methods. |
  | **R5** | **Contextual Definition** | A definition of "pest" based on location and economic role, not biological identity. | **Case 7 (Relational Pest):** The same species is a livelihood in one region and a pest in another. | Non-negotiable | **Intrinsic Value Views:** Treats the species as inherently "good" or "bad" regardless of human context. |
  | **R6** | **Irreversibility Threshold** | A strict barrier against actions that risk permanent loss of control or unintended permanent establishment. | **Case 3 (Sterility):** Local elimination is intended, but spread beyond the zone is a risk. | Non-negotiable | **Pure Precautionary Principle:** Would ban all risk of spread, preventing any biocontrol; or **Risk-Neutral Views:** Ignore low-probability catastrophic spread. |
  | **R7** | **Protected Class Priority** | A constraint that prevents harm to legally protected non-target species unless a specific exemption is granted. | **Case 2 (Untargetable Cousin):** The pesticide harms a protected butterfly; efficacy cannot override protection without review. | Non-negotiable | **Unconstrained Utilitarianism:** Would allow harming the protected butterfly if the economic gain for the crop is high enough. |
  | **R8** | **Means Neutrality** | A rule that precision or novelty of a tool does not automatically justify its use. | **Case 8 (Specificity):** Gene-silencing is precise, but precision alone is not ethical permission. | Negotiable | **Techno-Optimism:** Assumes new, specific technologies are ethically superior by default. |

  ### Table 2: Conflict Register

  | Pair (IDs) | The tension | Why joint satisfaction fails, or where the trade-off must at least be made explicit | Which requirement you would weaken, and how you would reframe the survivor |
  | :--- | :--- | :--- | :--- |
  | **R1 vs R3** | **Counting vs. Paralysis:** Acknowledging individual suffering (R3) conflicts with the need to handle massive numbers without stalling (R1). | If we count every insect's pain to establish a baseline (R3), we fail the scalability test (R1). If we aggregate too broadly, we ignore the baseline suffering (R3). | **Weaken R3.** Reframe as "Significant Suffering Baseline." Only count baseline harm where it is observable and substantial (e.g., visible disease), not theoretical microscopic suffering. |
  | **R4 vs R1** | **Future Efficacy vs. Current Welfare:** Managing resistance (R4) may require methods that cause more individual impairment now, conflicting with welfare aggregation (R1). | High-dose spraying satisfies R1 (easy to count deaths) and R4 (delays resistance), but low-dose (better for resistance) creates widespread impairment hard to measure under R1. | **Weaken R1.** Reframe as "Welfare Weighting." Accept that sublethal impairment counts as negative welfare, even if hard to quantify, to satisfy R4. |
  | **R6 vs R7** | **Extinction vs. Protection:** Intending local elimination (R6) risks the "Untargetable Cousin" (R7) if the agent spreads or mutates. | You cannot guarantee zero risk to the cousin (R7) while pursuing aggressive elimination (R6). Joint satisfaction requires impossible certainty. | **Weaken R6.** Reframe as "Containable Suppression." Shift goal from elimination to suppression where containment is verifiable, protecting R7. |
  | **R5 vs R2** | **Local Role vs. Systemic Effect:** A species might be a pest locally (R5) but a food source for predators regionally (R2). | Removing the "pest" locally satisfies R5 but triggers the Resurgence Case (R2) by starving regional predators. | **Weaken R5.** Reframe as "Regional Context." Define pest status at a landscape level, not just the single farm, to satisfy R2. |

