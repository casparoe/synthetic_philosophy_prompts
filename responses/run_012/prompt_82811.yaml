prompt: |-
  I sit on an advisory panel revising the ethics guidance for a national plant-protection service — the body that licenses insecticides, approves biological control releases, and funds integrated pest management programs. Before we assess the frameworks that have been put to us (welfarist consequentialism, rights-based views, ecocentric and ecosystem-integrity views, relational and virtue-oriented views, and the case-by-case precautionary default our agency currently follows without having chosen it), I want the specification first. Treat adequacy as relative to our purpose, which is to issue decisions we can defend in public, apply consistently across dissimilar cases, revise when the science moves, and reach within a single season rather than after a decade of further study. I am an entomologist by training with no formal philosophy background, so keep the vocabulary plain; the depth should sit in the requirements, not the jargon.

  Give me the desiderata any adequate framework for this area must satisfy, as a table with these columns:

  - ID (R1, R2, ...)
  - Requirement — one line stating what the framework must deliver
  - What it must actually produce — the test it must pass, or the output a regulator could extract from it
  - Case or consideration behind it — name the test case below (or the general consideration) and identify the feature that generates the demand
  - Status — non-negotiable, negotiable, or camp-specific (naming the camp whose preference it is)
  - Framework families it excludes, and why

  Anchor the requirements in the panel's test cases, which come from dossiers already before us:

  1. The Resurgence Case. A spray is highly effective against the target moth and also kills the generalist predators that ordinarily suppress it; the following season the moth is worse than before. Assume this is established for the case.
  2. The Untargetable Cousin Case. The only effective agent at the required dose also harms a protected butterfly in the same family, and no application window discriminates between them.
  3. The Sterility Case. A proposal to release engineered males that sterilize a pest population, with a real prospect of local elimination of the species and a small but nonzero chance of spread beyond the release area.
  4. The Baseline Case. In the untreated field the pest is held down by parasitoids that kill hosts slowly from within, and most larvae die of starvation or disease. Leaving the field alone is therefore not leaving the insects unharmed.
  5. The Numbers Case. Any per-individual welfare accounting will be swamped by insect counts; a framework that counts individuals one by one makes nearly every agricultural practice look catastrophic, and one that counts only species or ecosystems makes individual suffering invisible.
  6. The Resistance Case. High-dose spraying kills nearly all exposed individuals quickly but selects hard for resistance and requires refuges; low-dose spraying produces widespread sublethal impairment — disorientation, failed foraging, reduced reproduction — and selects slowly. Assume welfare and resistance management pull in opposite directions here.
  7. The Relational Pest Case. The same species is a managed pollinator in one region and a damaging invader in another, and one grower's pest is another's livelihood. Our remit covers pests, so the framework must say whether pest is a biological category or a role fixed by human interests.
  8. The Specificity Case. A sequence-specific spray is proposed that is designed to silence a gene in one species only. The dossier presents this precision as a new kind of ethical permission.

  Then, in a second table, the conflict register — columns: Pair (IDs) | The tension | Why joint satisfaction fails, or where the trade-off must at least be made explicit | Which requirement you would weaken, and how you would reframe the survivor.

  Close with a JSON object with these fields: most_exclusionary_requirement (string), why_it_excludes (string), camp_prejudices (array of strings, each naming a demand and the camp that treats it as obvious rather than argued for), excluded_families (array of strings), and one_line_summary (string). Argue from the cases; we are drafting our own document, so do not supply citations, reading lists, or attributions, and do not lean on any particular author's formulation.
reasoning: |-
  Here's a thinking process that leads to the suggested output:

  1.  **Analyze the Request:**
      *   **Role:** Advisor to a national plant-protection service (licensing insecticides, biocontrol, IPM funding).
      *   **Task:** Define *desiderata* (requirements) for an ethical framework suitable for this agency's purpose.
      *   **Purpose of Agency:** Publicly defensible decisions, consistent application, adaptable to science, timely (within a season).
      *   **Audience:** Entomologist (no formal philosophy background), plain vocabulary, depth in requirements not jargon.
      *   **Output Format:**
          1.  Table 1: Desiderata (ID, Requirement, Output/Test, Case/Consideration, Status, Excluded Families).
          2.  Table 2: Conflict Register (Pair, Tension, Why Joint Satisfaction Fails, Weakening/Reframing).
          3.  JSON Object (most_exclusionary_requirement, why_it_excludes, camp_prejudices, excluded_families, one_line_summary).
      *   **Constraints:** Anchor in 8 specific test cases provided. No citations/attributions. Argue from the cases.
      *   **Frameworks to Consider (implicitly):** Welfarist consequentialism, rights-based, ecocentric/ecosystem-integrity, relational/virtue, current precautionary default.

  2.  **Deconstruct the Test Cases to Derive Requirements:**
      *   *Case 1 (Resurgence):* Need to account for indirect ecological effects, not just direct kill counts. (Systemic thinking).
      *   *Case 2 (Untargetable Cousin):* Need to handle non-target impacts on protected species vs. pest control necessity. (Thresholds/Trade-offs).
      *   *Case 3 (Sterility):* Need to handle intentional local extinction and spread risk. (Irreversibility/Precaution).
      *   *Case 4 (Baseline):* "Doing nothing" isn't neutral. Nature involves suffering. (Baseline comparison).
      *   *Case 5 (Numbers):* Individual counting breaks at insect scales; species-only counting ignores suffering. (Scalability/Aggregation).
      *   *Case 6 (Resistance):* Trade-off between immediate welfare (quick death vs. impairment) and long-term efficacy (resistance). (Time Horizon).
      *   *Case 7 (Relational Pest):* "Pest" is contextual, not intrinsic. (Context-dependence).
      *   *Case 8 (Specificity):* Precision doesn't automatically equal ethical permission. (Means vs. Ends).

  3.  **Drafting Table 1 (Desiderata):**
      *   *Goal:* Create requirements that filter frameworks based on the agency's practical needs (speed, consistency, defensibility) and the specific biological realities.
      *   *R1 (Scalability):* Derived from Case 5. Must handle large numbers without paralysis.
      *   *R2 (Systemic Consequence):* Derived from Case 1. Must look beyond the target.
      *   *R3 (Baseline Neutrality):* Derived from Case 4. Must compare action vs. inaction realistically.
      *   *R4 (Time Horizon):* Derived from Case 6. Must balance immediate welfare with long-term viability.
      *   *R5 (Contextual Definition):* Derived from Case 7. Must define "pest" relationally.
      *   *R6 (Reversibility Threshold):* Derived from Case 3. Must flag irreversible changes (extinction/spread).
      *   *R7 (Non-Target Protection):* Derived from Case 2. Must protect protected species even if it limits pest control.
      *   *R8 (Precision Neutrality):* Derived from Case 8. Precision is a tool, not a moral pass.
      *   *Status:* Most need to be "Non-negotiable" for the agency to function, but some might be "Negotiable" depending on political mandate. Let's make the core operational ones non-negotiable.
      *   *Exclusions:* Which frameworks fail these?
          *   Strict Rights-based (every insect has a right to life) fails R1 (Numbers) and R2 (Resurgence/Ag).
          *   Strict Ecocentric (only ecosystem matters) fails R5 (Individual suffering invisible).
          *   Pure Welfarist (sum of pain) fails R1 (Numbers paralysis) and R4 (Resistance trade-offs).
          *   Current Precautionary (case-by-case) fails Consistency (implied in prompt purpose).

  4.  **Drafting Table 2 (Conflict Register):**
      *   Need to identify where requirements clash.
      *   *Conflict 1:* R1 (Scalability/Numbers) vs. R3 (Baseline/Welfare). If we count individuals, we get paralysis. If we ignore them, we ignore suffering.
      *   *Conflict 2:* R4 (Time Horizon/Resistance) vs. R1/R3 (Immediate Welfare). High dose (quick death) vs. Low dose (suffering but less resistance).
      *   *Conflict 3:* R6 (Reversibility/Extinction) vs. R7 (Non-Target/Protection). Eliminating a pest might risk a cousin (Case 2/3 overlap).
      *   *Resolution:* Need to show how to prioritize. Usually, Agency viability (R1) trumps pure philosophy, but Public defensibility (R3) trumps convenience.

  5.  **Drafting the JSON:**
      *   *Most Exclusionary:* Likely R1 (Scalability) or R3 (Baseline). R1 kills strict individual welfarism.
      *   *Camp Prejudices:* Welfarists think suffering is the only metric. Ecocentrists think species stability is the only metric. Rights thinkers think individual inviolability is the only metric.
      *   *Excluded Families:* Strict Individual Rights, Pure Aggregative Welfarism (without thresholds), Radical Ecocentrism (ignoring individuals).
      *   *Summary:* Needs to be punchy.

  6.  **Refining and Polishing:**
      *   *Tone Check:* Is it plain English? Yes. Avoid "deontological," "teleological," "utilitarian calculus." Use "rule-based," "outcome-based," "counting individuals."
      *   *Constraint Check:* Did I use the 8 cases? Yes. Is the JSON valid? Yes. Are there citations? No.
      *   *Self-Correction on R1:* Make sure "Scalability" doesn't sound like "ignore small things." It means "method must not break when numbers get high."
      *   *Self-Correction on Exclusions:* Be careful not to exclude *all* welfarism, just the kind that can't handle insect counts.
      *   *Status:* "Camp-specific" is useful for distinguishing between what the agency *needs* vs. what a specific ethical theory *wants*. I will mark the core operational ones as Non-negotiable for the *Agency*, even if a specific ethical camp disagrees.

  7.  **Final Review against Prompt:**
      *   Table 1 columns correct? Yes.
      *   Table 2 columns correct? Yes.
      *   JSON fields correct? Yes.
      *   Vocabulary plain? Yes.
      *   No citations? Yes.
      *   Anchored in cases? Yes.

      *(Self-Correction during drafting Table 1)*: Ensure the "Excluded Families" column explains *why* based on the requirement.
      *(Self-Correction during drafting Table 2)*: Ensure the "Weakening" suggestion is practical for a regulator.

      *(Refining the "Status" column)*: The prompt asks for Status as Non-negotiable, Negotiable, or Camp-specific. Since I am advising the panel on what *an adequate framework for this area* must satisfy, most should be Non-negotiable for the *agency's purpose*, but I can label some as Camp-specific to show where certain theories fail the agency's needs. Actually, the prompt asks for "Status — non-negotiable, negotiable, or camp-specific (naming the camp whose preference it is)". I will interpret this as: Is this requirement essential for the Agency (Non-negotiable), something we can compromise on (Negotiable), or something that only matters if we adopt a specific ethical view (Camp-specific). Given the prompt's instruction to "Treat adequacy as relative to our purpose," the Agency's operational needs should be Non-negotiable.

      *(Refining JSON)*: "camp_prejudices" needs to name a demand and the camp. E.g., "Individual suffering is the only metric (Welfarist)".

      Let's assemble.

      *Requirement R1 (Scalability)*: Case 5. Excludes strict individual welfarism.
      *Requirement R2 (Systemic)*: Case 1. Excludes narrow target-only views.
      *Requirement R3 (Baseline)*: Case 4. Excludes "nature is neutral" views.
      *Requirement R4 (Time)*: Case 6. Excludes short-term only views.
      *Requirement R5 (Context)*: Case 7. Excludes intrinsic "pest" definitions.
      *Requirement R6 (Irreversibility)*: Case 3. Excludes frameworks without precaution on extinction.
      *Requirement R7 (Non-Target)*: Case 2. Excludes "ends justify means" without limits.
      *Requirement R8 (Precision)*: Case 8. Excludes "technology is good" bias.

      *Conflicts:*
      R1 vs R3 (Counting vs. Paralysis).
      R4 vs R3 (Long term efficacy vs. Short term suffering).
      R6 vs R7 (Extinction goal vs. Cousin safety).

      *JSON:*
