      *   *Finks:* The disposition disappears *before* the manifestation happens (e.g., a wire that loses conductivity the moment it's touched). SCA says "if touched, conducts." But if touched, it loses conductivity, so it doesn't conduct. SCA says "not disposed." Intuition says "it was disposed until touched."
      *   *Masks:* The disposition stays, but something stops the manifestation (e.g., packing foam). SCA says "if struck, breaks." But if struck (with foam), it doesn't break. SCA says "not disposed." Intuition says "still fragile."
      *   *Antidotes/Mimics:* Related complications.
