answer: |-
  Here is the specification you're asking for. I'll treat dispositions as a system property and the theories as attempts to write the schema.

  ### The Desiderata (System Requirements)

  These are the functional requirements a theory of dispositions must meet. I have classified them by stability.

  **1. Extensional Adequacy (Non-negotiable)**
  *   **Requirement:** The theory must yield the correct truth value for standard cases. If we say "this glass is fragile," the theory must validate that claim. If we say "this rubber ball is not fragile," it must validate that.
  *   **Motivation:** If the theory classifies a steel beam as fragile or a soap bubble as rigid, it is broken. It must match pre-theoretic intuition on the "happy path."

  **2. Mask Resistance (Non-negotiable)**
  *   **Requirement:** The theory must distinguish between *lacking a disposition* and *having the disposition prevented from manifesting*.
  *   **Motivation:** A glass wrapped in bubble wrap is still fragile. A simple "if struck then breaks" test returns `false` (it doesn't break), implying the disposition is absent. The theory must return `true` (disposition present) despite the negative test result.
  *   **Case Reference:** Your Case 2 (Indestructible Shell). The glass inside is masked by the shell. The theory must assert fragility remains even if manifestation probability is zero.

  **3. Fink Resistance (Non-negotiable)**
  *   **Requirement:** The theory must distinguish between *having a disposition that is removed by the stimulus* and *never having had the disposition*.
  *   **Motivation:** A wire is live. A device detects touch and instantly drains the charge before shock occurs. The conditional "if touched, shocks" is `false`. But the wire *was* live before touch. The theory must capture the state at $t_0$, not just the outcome at $t_1$.
  *   **Case Reference:** Your Case 3 (Self-modifying Model). The query (stimulus) updates the weights (removes disposition). The theory must attribute the disposition based on the pre-query state, even if the post-query behavior contradicts it.

  **4. Intrinsicness (Controversial / High Priority)**
  *   **Requirement:** Whether an object has a disposition should depend on its internal structure, not its environment.
  *   **Motivation:** Fragility seems to be about the molecular bonds of the glass, not whether there is a hammer nearby or a protective shell. If you teleport the glass to a void, it should still be fragile.
  *   **Tension Source:** This conflicts with Mask Resistance if you define dispositions via outcomes (which depend on environment).

  **5. Gradability (Non-negotiable)**
  *   **Requirement:** The theory must support scalar values, not just booleans.
  *   **Motivation:** We constantly say "this glass is *more* fragile than that one." A binary conditional (breaks/doesn't break) cannot capture this.
  *   **Implementation:** Usually requires referencing a range of stimulus intensities or a probability distribution over outcomes, rather than a single threshold.

  **6. Non-Circularity (Non-negotiable)**
  *   **Requirement:** The definition of the disposition cannot presuppose the disposition itself.
  *   **Motivation:** You cannot fix the Mask problem by saying "It breaks if struck, *provided nothing prevents it*." "Prevents" means "prevents the manifestation of the disposition." You have defined the disposition in terms of itself. This is a stack overflow.

  ---

  ### Analysis of Your Three Cases

  Here is how a compliant system must process your specific edge cases.

  **Case 1: The Self-Healing/Stiffening Glass (Intrinsic Mask)**
  *   **The Problem:** The interfering mechanism is *inside* the object. Standard Mask Resistance assumes the mask is external (like bubble wrap). Here, the stimulus triggers an internal routine that suppresses the output.
  *   **The Spec:** The theory must distinguish between the *base material* disposition and the *composite system* disposition.
      *   If the stiffening is perfect, the *pane* is not fragile, even if the *silica* is.
      *   If the stiffening has a threshold (breaks under heavy hammer), the disposition is conditional on stimulus intensity (see Gradability).
      *   **Crucial distinction:** This is not a Fink. A Fink removes the disposition. This mechanism *retains* the fragility but actively counteracts the manifestation. It is an **Intrinsic Mask**. A theory that conflates Intrinsic Masks with Finks will fail here.

  **Case 2: The Indestructible Shell (Extrinsic Mask)**
  *   **The Problem:** The manifestation probability is permanently zero.
  *   **The Spec:** The theory must decouple *possession* of the property from *opportunity* to manifest.
      *   **Verdict:** The glass remains fragile.
      *   **Grounding:** The difference between "Fragile + Shell" and "Unbreakable + No Shell" must be found in the categorical base (the molecular structure). If two objects have identical molecular structures, they must have identical dispositions, regardless of their shells. If the theory says the shelled glass is *not* fragile, it violates **Intrinsicness**.

  **Case 3: The Self-Modifying Model (Finkish Disposition)**
  *   **The Problem:** The test destroys the state being tested.
  *   **The Spec:** The theory must evaluate the counterfactual at the instant *before* the state change occurs.
      *   **Verdict:** The model had the disposition.
      *   **Grounding:** You need a temporal index. $Disposition(x, t_0)$. Stimulus occurs at $t_1$. State change occurs at $t_1$. The conditional must ask: "Given state at $t_0$, would manifestation occur?" not "Given state at $t_1$..."
      *   **Failure Mode:** Any theory that looks only at the input/output mapping of the *current* state will fail, because the current state is already updated.

  ---

  ### The Gradability Problem

  You asked what grounds the claim "X is more fragile than Y."

  *   **The Issue:** Standard conditionals are binary. `If Struck -> Break` is either True or False. It doesn't handle "Breaks easily" vs "Breaks only under heavy force."
  *   **The Requirement:** The stimulus variable $S$ must be a range, not a point.
  *   **The Ground:** Fragility is grounded in the **threshold function**.
      *   Object A breaks if Force $> 5N$.
      *   Object B breaks if Force $> 50N$.
      *   Object A is more fragile.
  *   **Complication:** If you use probability (Object A breaks 90% of time, Object B 10%), you need a theory that allows probabilistic dispositions, not just deterministic ones. Most classical theories assume determinism; this is a known limitation.

  ---

  ### The Tension (The Deadlock)

  Your suspicion is correct, but the conflict is more specific than "Intrinsic vs. Mask/Lost."

  **The Conflict:** **Intrinsicness** vs. **Conditional Analysis**.

  1.  **Conditional Analysis:** To define "fragile," we look at what happens in a test scenario ("If struck...").
  2.  **Intrinsicness:** To be a property of the object, "fragile" must not change when the environment changes.
  3.  **The Clash:** What happens in a test scenario *depends* on the environment (masks, finks, laws of physics).
      *   If you define fragility purely by the conditional ("It breaks if struck"), you violate Intrinsicness (because a mask makes the conditional false).
      *   If you fix the conditional to save Intrinsicness ("It breaks if struck, *unless masked*"), you violate Non-Circularity (because defining "mask" requires referencing the disposition).
      *   If you fix the circularity by specifying "normal conditions," you violate Extensional Adequacy (because "normal" is vague and often gets the verdict wrong on edge cases like your self-healing glass).

  **Why they can't all be satisfied:**
  To maintain **Intrinsicness**, you must ignore the shell in Case 2. To maintain **Extensional Adequacy** via a Conditional Analysis, you must acknowledge the shell prevents the break. To reconcile them, you must add a clause to the conditional ("...if struck, *and no shell exists*..."). But specifying *which* clauses to add without already knowing the disposition (Circularity) is the unsolved problem. You either accept that dispositions are extrinsic relations (kill Intrinsicness) or accept that they cannot be fully reduced to conditionals (kill Conditional Analysis).

  ---

  ### The Killer Requirement

  If you want to filter out the theories that look good but are fundamentally broken, apply this single requirement:

  **Non-Circular Specification of Test Conditions.**

  *   **The Rule:** The theory must be able to specify the "ideal test conditions" (no masks, no finks, normal environment) without using the word "disposition," "fragile," "break," or any synonym that presupposes the outcome.
  *   **Why it kills theories:**
      *   **Simple Conditional Analysis:** Fails immediately (can't handle masks).
      *   **"Ceteris Paribus" Theories:** Fail because "all else being equal" implicitly means "all else being equal *to the manifestation of the disposition*." It smuggles the answer into the premise.
      *   **Rigid Designator Theories:** Fail because they can't explain *why* the conditions are the right ones without referencing the outcome.
      *   **Causal Basis Theories:** These are the survivors. They say "Fragility *is* the molecular structure," not "Fragility *is* breaking." They pass this test because you can specify the molecular structure without referencing the break. However, they then struggle to explain why that structure *counts* as fragility without looping back to the break.

  **Summary:** If a theory cannot define the test conditions without implicitly referencing the very disposition it's trying to define, it is circular. Most do. That is the bug.
