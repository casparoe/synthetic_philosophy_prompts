answer: |-
  **EXAMINATION PAPER**

  **Module:** Social Epistemology (Final Year)
  **Section:** Essay Questions
  **Time Allowed:** 2 Hours

  **Question 1**

  Read the following two cases carefully.

  **Case A.** A woman, Rosa, is among a small number of people to have undergone a novel surgical procedure and, afterwards, to experience a state she can only call a *second attention*: a persistent, low-grade awareness of her own body from a viewpoint she cannot locate. No term in her language and no shared framework captures it. When she tries to describe it to doctors, friends and colleagues she meets blank puzzlement, and some conclude that she is anxious or attention-seeking. Her inability to make herself understood leaves her unable to seek help, to compare notes, or to have the experience recognised as something that is genuinely happening to her. Nothing about Rosa's social position, however, explains the gap: the experience is simply new, and no one, powerful or powerless, has a concept for it.

  **Case B.** Suppose the same experience is common among a group that is socially despised, and that the dominant group has over time declined to develop or borrow any vocabulary for it, treating the subject as distasteful and those who raise it as complainers. Here the gap persists because those with the power to shape the shared language have turned away from it.

  Write an essay addressing the following:

  1.  Is Rosa wronged in Case A, in Case B, or in both? In what sense does the nature of the wrong differ between the two cases?
  2.  State the condition Miranda Fricker places on hermeneutical injustice regarding the subject's exclusion from the practices that shape shared meaning. Assess whether this condition is defensible in light of Case A.
  3.  Distinguish the wrong of being unable to render one's experience intelligible from the wrong of being disbelieved once one speaks.
  4.  Does the difference between a hermeneutical gap that is merely present and a gap that is actively maintained by those who could close it matter morally?

  In your answer, you may find it useful to consider whether hearers can be culpably unwilling to take up interpretive resources, or whether speakers might pre-emptively truncate their testimony. You are not required to reference theorists other than Fricker.

  ***

  **MODEL ANSWER**

  Rosa suffers a significant harm in both cases, but she is subjected to an *injustice* only in Case B. To defend this verdict, one must distinguish between the misfortune of a conceptual gap and the moral fault of its maintenance. In Case A, the gap is a matter of epistemic bad luck; in Case B, it is a product of structural prejudice. This distinction vindicates Fricker's requirement that hermeneutical injustice involves the exclusion of the subject from the practices of meaning-making.

  In Case A, Rosa is undoubtedly harmed. She lacks the resources to make her experience intelligible to herself and others, leading to isolation and potential medical neglect. However, calling this an 'injustice' stretches the concept too thin. Injustice implies a violation of rights or fairness, typically grounded in someone's culpability or a structural fault. In Case A, the gap exists because the experience is novel. No group has excluded Rosa from the linguistic community; the community simply lacks the concept. To label this an injustice is to conflate metaphysical limitation with moral wrong. Therefore, while Rosa is wronged in the sense of suffering a harm, she is not epistemically unjustly treated.

  Case B, conversely, presents a clear injustice. Here, the conceptual gap is not accidental but maintained. The dominant group possesses the power to develop vocabulary but declines to do so because they find the subject distasteful. This satisfies Fricker's condition: the gap is a product of the subject's exclusion from the practices that shape shared meaning. The dominant group actively polices the boundaries of what is sayable. This makes the harm culpable. The wrong is not merely that Rosa cannot speak, but that she is prevented from speaking by a power structure that benefits from her silence. Thus, the condition of exclusion is defensible because it isolates the specific moral fault of *injustice* from the general human condition of *ignorance*.

  It is vital to distinguish this hermeneutical wrong from testimonial injustice. The hermeneutical wrong is the inability to render experience intelligible; the speaker lacks the words to formulate the thought. The testimonial wrong occurs when the speaker has the words but is disbelieved due to prejudice. In Case B, these often overlap: Rosa may be disbelieved because she lacks the vocabulary to sound credible. However, they are distinct. One can be intelligible but disbelieved (pure testimonial injustice), or unintelligible but trusted (pure hermeneutical gap). The primary wrong in these cases is hermeneutical: Rosa is blocked at the stage of sense-making, before credibility is even assessed.

  Does the difference between a mere gap and a maintained gap matter? It matters profoundly for moral responsibility. If the gap is merely present, as in Case A, the remedy is epistemic labour: someone must coin a term and spread it. If the gap is maintained, as in Case B, the remedy is political: the power dynamic must be challenged. This connects to the culpability of the hearer. In Case B, hearers are not merely ignorant; they are culpably unwilling to take up interpretive resources. They refuse to learn the language of the marginalised. Furthermore, this maintenance forces speakers to pre-emptively truncate their testimony. Rosa knows her words will fall on deaf ears, so she silences herself. This self-censorship is a direct result of the maintained gap, compounding the injustice.

  A strong objection to this view is that the *impact* on Rosa is identical in both cases. She suffers isolation and confusion regardless of whether the gap is accidental or maintained. If the victim's experience is the same, why does the cause matter? One might argue that focusing on the cause privileges the perpetrator's intent over the victim's suffering.

  However, this objection fails because 'injustice' is a normative category, not merely a descriptive one of harm. We do not call a natural disaster an injustice, even if the suffering is immense, because there is no agent to hold responsible. Similarly, if we label Case A an injustice, we lose the ability to criticise the specific structural failures of Case B. Retaining Fricker's exclusion condition allows us to target the specific political remedy required: inclusion in meaning-making practices. Without this distinction, every conceptual limitation becomes a political grievance, diluting the force of the critique against actual oppression. Therefore, the verdict stands: Case A is a tragedy; Case B is a crime.

  ***

  **MARKING SCHEME (20 MARKS)**

  **1. Verdict on Cases A and B (4 marks)**
  *   **First (4):** Clearly distinguishes harm (Case A) from injustice (Case B), grounding the distinction in culpability or structural fault.
  *   **2:1 (3):** Identifies Case B as injustice but treats Case A ambiguously or fails to explain the 'harm vs. injustice' distinction clearly.
  *   **Typical Error:** Treating both cases as identical injustices simply because the outcome is the same.

  **2. Fricker's Exclusion Condition (4 marks)**
  *   **First (4):** States the condition (exclusion from meaning-shaping) and defends it as necessary to isolate moral fault from epistemic luck.
  *   **2:1 (3):** States the condition correctly but offers a descriptive rather than normative defence of why it matters.
  *   **Typical Error:** Reciting the definition without assessing its defensibility in light of Case A.

  **3. Hermeneutical vs. Testimonial Wrong (4 marks)**
  *   **First (4):** Distinguishes unintelligibility (sense-making) from disbelief (credibility), noting they can occur independently.
  *   **2:1 (3):** Distinguishes them but conflates the two in the application to the cases (e.g., assuming unintelligibility implies disbelief).
  *   **Typical Error:** Defining testimonial injustice merely as 'not being listened to' rather than 'not being believed'.

  **4. The Moral Significance of the Maintained Gap (4 marks)**
  *   **First (4):** Argues that maintenance implies culpable unwillingness or political obstruction, necessitating a different remedy than mere innovation.
  *   **2:1 (3):** Acknowledges the difference but treats it as a matter of degree rather than a difference in kind regarding responsibility.
  *   **Typical Error:** Claiming the cause of the gap is irrelevant because the victim's suffering is identical.

  **5. Argumentative Grip and Objection Handling (4 marks)**
  *   **First (4):** Commits to a definite position, raises a substantive objection (e.g., impact is identical) and rebuts it by appealing to the normative nature of 'injustice'.
  *   **2:1 (3):** Surveys arguments without committing to a verdict, or raises a weak objection that is easily dismissed.
  *   **Typical Error:** Concluding that 'both sides have merit' without resolving the tension.

  **Total: 20 Marks**

  **Grade Boundaries:**
  *   **First (17–20):** Demonstrates critical independence; the argument drives the analysis.
  *   **Upper Second (14–16):** Competent understanding of concepts; analysis is correct but less critical or decisive.
  *   **Lower Second (10–13):** Descriptive; relies on reciting distinctions without applying them rigorously to the cases.
  *   **Fail (0–9):** Fundamental misunderstandings of the cases or key concepts.
