  ### Moderator Notes for the Session
  *   **Sequencing:** The order is designed so she cannot use the "Functionalist Bridge" defense in Question 1 or 2 without seeming premature. By the time you hit Question 4, the audience will see the pattern, and Question 4's follow-up explicitly calls out the move you want to unpack.
  *   **The "Bridge" Move:** In Question 4, if she tries to say "IIT is structural, not functional," press the Follow-up hard. The goal is to force her to admit that if structure doesn't map to function *at all*, the theory is metaphysically robust but scientifically idle.
  *   **Time Management:** If you are running short on time, prioritize Clusters 4 and 5. These contain the "Concrete Case" and "Scientific Status" requirements which are the most critical for the "Author Meets Critics" format.
