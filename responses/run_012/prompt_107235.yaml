answer: |-
  Here is a sequence of five thematic clusters, each containing a primary question and a targeted follow-up. This gives you **ten distinct speaking turns**, satisfying your count constraint while ensuring every required topic (the five bullets, the concrete feedforward case, and the scientific status charge) is covered.

  They are ordered to build pressure: starting with the foundations (axioms), moving to structural mechanics (exclusion/cerebellum), then to the empirical consequences (feedforward/intractability), and ending on the meta-scientific status.

  ### 1. The Axiomatic Method
  **Question:** Let's start with the foundation. IIT derives its identity claim from the five axioms of experience. Critics argue these axioms aren't neutral phenomenological descriptions but are already loaded with the conclusion that "phenomenal structure equals causal structure." If the axioms quietly smuggle in the identity that the theory is supposed to prove, isn't the derivation circular? How do you justify the axioms without presupposing the very physicalist identity you're trying to establish?

  **Follow-up (If she claims they are self-evident phenomenology):** If they are truly self-evident phenomenology, they should be acceptable to a functionalist or an illusionist. But they aren't. So, isn't it more accurate to say the axioms are actually *postulates* about the nature of consciousness that you are asking us to accept on faith, rather than undeniable truths that force IIT upon us?

  ### 2. The Exclusion Postulate
  **Question:** Moving to the Exclusion Postulate: this is what allows IIT to pick out a specific complex and rule out overlapping systems. Is Exclusion actually derivable from the phenomenological axioms, or is it an extra empirical bet bolted on to save the theory from panpsychist explosion? If it's the latter, what happens to the theory's coherence if we drop it—do we just accept that consciousness is everywhere and overlapping?

  **Follow-up (If she says it's derivable from "unity" or "definiteness"):** Even if it's derivable, it leads to the verdict that a feedforward network has zero $\Phi$ while a recurrent one has high $\Phi$, even if they are functionally identical. This leads directly to my next point: if Exclusion forces us to say two behaviorally indistinguishable systems have radically different conscious statuses, isn't Exclusion doing too much heavy lifting for a postulate meant to be about experience?

  ### 3. The Cerebellum Case
  **Question:** IIT predicts the cerebellum contributes almost nothing to consciousness, despite containing nearly 70% of the brain's neurons, while the cortex contributes almost everything. Many neuroscientists find this verdict hard to swallow given the cerebellum's role in cognitive fluency. Why should we trust IIT's verdict here over our pre-theoretic intuition? Is this a successful prediction, or is the theory simply biting a bullet that should count as a reductio?

  **Follow-up (If she appeals to lesion studies or "quality" of experience):** Lesion studies show cognitive deficits, but IIT says no *experience*. If the theory tells us that a system with massive computational integration and behavioral relevance is phenomenally dark, aren't we severing the link between consciousness and cognitive function so thoroughly that "consciousness" becomes a property with no explanatory role in psychology?

  ### 4. The Concrete Case (Feedforward vs. Recurrent)
  **Question:** Let's put a concrete case to you. Imagine a purely feedforward network and a recurrent network that are behaviorally indistinguishable for all time—every input-output pair matches perfectly. IIT says one has experience and the other has none. Is that difference a *prediction* of the theory that could turn out false, or is it a consequence of how the theory defines its terms? If it's the latter, how is this different from stipulating a definition and calling it a discovery?

  **Follow-up (The "Functionalist Bridge" Trap):** You've previously responded to this by saying the objection "assumes a functionalist bridge principle that IIT rejects." I want to press you on that. If you reject the bridge principle that links causal structure to behavioral disposition, what principle *do* you offer to connect $\Phi$ to anything observable? If the distinction between the feedforward and recurrent net can never show up in behavior, what work is the word "empirical" doing in your methodology?

  ### 5. Intractability, Falsifiability, and Scientific Status
  **Question:** Computing $\Phi$ is NP-hard and effectively intractable for any realistic system like a human brain. This makes it difficult to generate specific point predictions. Combined with the charge from recent open letters that IIT isn't a scientific theory but a definition dressed up as one: what, in your view, would actually *falsify* IIT? Can you describe a possible world or a specific neural finding that would force you to abandon the identity claim?

  **Follow-up (If she cites perturbation protocols like TMS-EEG):** Perturbation protocols test for *signatures* correlated with $\Phi$, not $\Phi$ itself. If the calculation is intractable, we are always testing a proxy. If the proxy fails, you can say the approximation was wrong; if it succeeds, you say the theory is vindicated. Doesn't this insulation from negative results confirm the charge that IIT is structured to be unfalsifiable, and therefore falls outside the bounds of empirical science?

