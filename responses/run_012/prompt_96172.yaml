answer: |-
  # Diagnostic Decision Tree: The Logical Space of Self-Deception

  **Instructions:** Begin at the **Root** based on the observation that a person is systematically mistaken about their own motives or circumstances. Answer each question based on how you think the phenomenon *must* work, not on which philosopher you recall. Follow the arrows to the **Leaves** to identify your theoretical commitment.

  ---

  ### **ROOT:** We observe a person systematically mistaken about a truth they should know.

  ### **NODE 1: Coherence**
  **Question:** Is the term "self-deception" describing a real psychological phenomenon, or is it a folk-psychological contradiction that we should eliminate from serious theory?
  *   **(A) It is a contradiction/incoherent:** $\rightarrow$ Go to **Leaf 1**.
  *   **(B) It describes something real:** $\rightarrow$ Go to **Node 2**.

  ### **NODE 2: Level of Explanation**
  **Question:** Is the phenomenon best explained by the actions of the whole person (personal level), or by mental subsystems and mechanisms outside of conscious agency (subpersonal level)?
  *   **(A) Subpersonal mechanisms:** $\rightarrow$ Go to **Leaf 2**.
  *   **(B) Personal agency:** $\rightarrow$ Go to **Node 3**.

  ### **NODE 3: Intention**
  **Question:** Does the agent *intend* to bring about a belief in themselves that they currently take to be false? (i.e., Is there a goal to trick oneself?)
  *   **(A) No, there is no intention to deceive:** $\rightarrow$ Go to **Leaf 3**.
  *   **(B) Yes, there is an intention to deceive:** $\rightarrow$ Go to **Node 4**.

  ### **NODE 4: Architecture**
  **Question:** To make this intention possible, must we divide the mind into distinct sub-agents or subsystems that keep information from one another?
  *   **(A) Yes, the mind is partitioned:** $\rightarrow$ Go to **Leaf 4**.
  *   **(B) No, the mind is a unified agent:** $\rightarrow$ Go to **Node 5**.

  ### **NODE 5: Doxastic State**
  **Question:** Does the agent simultaneously hold two contradictory *beliefs* (believing $p$ and believing $\neg p$), or is one of the states something else (e.g., pre-reflective knowledge, avoidance)?
  *   **(A) Yes, contradictory beliefs:** $\rightarrow$ Go to **Leaf 5**.
  *   **(B) No, one state is not a full belief:** $\rightarrow$ Go to **Leaf 6**.

  ---

  ### **THE LEAVES**

  **Leaf 1: The Eliminativist Account**
  *   **Descriptive Name:** Conceptual Eliminativism
  *   **Most Awkward Commitment:** We speak nonsense whenever we use the word "self-deception" and should speak only of motivated irrationality or error.

  **Leaf 2: The Deflationary Account**
  *   **Descriptive Name:** Subpersonal Motivated Belief
  *   **Most Awkward Commitment:** There is no "deceiver" in the scenario; it is merely a causal mechanism producing bias, so it is not deception in the interpersonal sense.

  **Leaf 3: The Pretense Account**
  *   **Descriptive Name:** Non-Doxastic Imagination
  *   **Most Awkward Commitment:** The person is not actually deceived; they are merely pretending or imagining so vividly that they behave as if they believe the falsehood.

  **Leaf 4: The Partitioned-Mind Account**
  *   **Descriptive Name:** Homuncular or Modular Division
  *   **Most Awkward Commitment:** The mind contains semi-autonomous sub-agents with their own goals and information access that fight one another.

  **Leaf 5: The Dual-Belief Intentionalist Account**
  *   **Descriptive Name:** Static Paradox Acceptance
  *   **Most Awkward Commitment:** A rational agent can consciously and simultaneously hold two contradictory propositions as true beliefs.

  **Leaf 6: The Sartrean Account**
  *   **Descriptive Name:** Bad Faith (Mauvaise Foi)
  *   **Most Awkward Commitment:** Consciousness must know the truth in order to hide it from itself, without any unconscious mechanism to do the hiding.

  ---

  ### **CASE TESTING AND ANALYSIS**

  Below is a test of the tree against five concrete cases. This section identifies where the tree successfully sorts intuitions and where it reveals ambiguity in the logical space.

  | Case Description | Separates Which Leaves? | Fails to Separate Which Leaves? | Notes on Ambiguity |
  | :--- | :--- | :--- | :--- |
  | **1. The Forgotten Appointment:** A person "forgets" a meeting that would deliver bad news. | **Eliminativist** vs. **All Others** | **Partitioned** vs. **Deflationary** | Both Partitioned (unconscious hid memory) and Deflationary (anxiety disrupted retrieval) explain this via subpersonal/hidden mechanisms. Without introspective data, the tree cannot distinguish a "hiding sub-agent" from a "glitchy mechanism." |
  | **2. The Jealous Spouse:** Reads every ambiguous sign as confirming an affair despite evidence to the contrary. | **Deflationary** vs. **Pretense** | **Deflationary** vs. **Dual-Belief** | The spouse *says* they believe the affair is real. Deflationary says they do (via bias). Dual-Belief says they also believe it isn't (via evidence). The outward behavior is identical; only the reported internal state differs, which is unreliable in self-deception. |
  | **3. The Test Result:** Patient reports a test result correctly but plans their life as if it came out negative. | **Pretense** vs. **Dual-Belief** | **Pretense** vs. **Partitioned** | Pretense says they know the truth but act otherwise. Partitioned says one part knows, the other plans. Both predict the same behavioral contradiction. The tree relies on the agent's access to their own belief, which is the very thing in question. |
  | **4. The "Knew It All Along":** After a failure, the person says, "I knew this would happen." | **Eliminativist** vs. **Deflationary** | **Deflationary** vs. **Sartrean** | Deflationary calls this hindsight bias (subpersonal). Sartre calls it a retroactive project of bad faith (personal). Both deny the person *actually* knew it at the time, making them hard to distinguish via external observation. |
  | **5. The Willful Ignorance:** Manages a difficult truth by refusing to look at evidence rather than believing the opposite. | **Sartrean** vs. **Dual-Belief** | **Sartrean** vs. **Pretense** | Sartre says this *is* the deception (choosing not to know). Pretense says this is just avoidance without false belief. Both deny the formation of a false belief, differing only on whether the avoidance itself constitutes "deception." |

  ### **FLAGGED UNSEPARABLE PAIRS**

  1.  **Partitioned-Mind vs. Pretense (Case 3):** Both accounts predict a divergence between verbal report (truth) and behavioral planning (falsehood). The tree cannot separate them without a criterion for what counts as a "sub-agent" versus a "mode of imagination," which is often a matter of theoretical preference rather than empirical data.
  2.  **Deflationary vs. Eliminativist (Case 4):** Both deny the robust "deceiver/deceived" structure. The Eliminativist says "drop the term," while the Deflationary says "keep the term but weaken the definition." This is a verbal dispute rather than a factual one, which the decision tree (based on phenomena) cannot resolve.

  ### **EMPTY LOGICAL SPACES**

  There are branches in the logical space that no major position occupies.

  1.  **Subpersonal + Intentional:** (Node 2A + Node 3B).
      *   **Status:** **Incoherent.** Intention is typically defined as a personal-level state of agency. A subpersonal mechanism (like a reflex or modular process) cannot "intend" in the sense required for deception without becoming a homunculus (which pushes it back to the Personal/Partitioned branch).
  2.  **Personal + No Partition + No Intention + Contradictory Beliefs:** (Node 2B + Node 3A + Node 5A).
      *   **Status:** **Unattractive.** This position claims a unified agent accidentally believes $p$ and $\neg p$ without trying and without mental partitions. This violates basic norms of rationality without offering a mechanism (partition) or a motive (intention) to explain the violation. It posits a "glitch" in rationality that is too massive to be plausible.
  3.  **Personal + Intentional + No Partition + Contradictory Beliefs:** (Node 2B + Node 3B + Node 4B + Node 5A).
      *   **Status:** **Explored but Marginal.** This is the **Dual-Belief Intentionalist** leaf. It is occupied, but it is often considered a "position of last resort" because the commitment to explicit contradiction is so high. Most philosophers move to Partition or Sartre to avoid this commitment.

  ### **TEACHING NOTE**
  Use this instrument to show students that "Freud vs. Everyone" is a false dichotomy. Freud occupies **Leaf 4** (Partitioned). But a student who rejects Freud might not land on **Leaf 2** (Deflationary); they might land on **Leaf 6** (Sartre) if they insist on personal agency, or **Leaf 3** (Pretense) if they doubt the existence of the false belief. The tree reveals that the debate is not about *whether* self-deception exists, but about the *architecture of the mind* required to make it possible.
