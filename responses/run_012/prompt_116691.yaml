      *   **Target:** Upper-level undergraduate seminar on decision theory (approx. 20 students).
      *   **Duration:** 90 minutes.
      *   **Topic:** St. Petersburg Paradox (but moving beyond the standard "divergent sum -> log utility" intro).
      *   **Goal:** Students must *feel* the paradox through gameplay before calculation.
      *   **Sequence of Feelings:**
          1.  Price vs. EV diverge (not cowardice).
          2.  Repeated play doesn't vindicate EV (LLN fails due to infinite variance).
          3.  Capped game shifts EV dependency to prior over caps (auction with undisclosed cap).
          4.  Utility fix has a price (auction under stated utility schedule reveals commitments).
      *   **Constraints:**
          *   No real money (tokens/candy/points), but stakes must matter.
          *   No naming the paradox/tradition/EU until debrief.
          *   Exact form of game, phases, timing, materials, payoff scheme, auction mechanism, writing tasks, running-average demo.
          *   Debrief mapping experiences to theory.
          *   Honest account of failure modes and limitations.
          *   **Format:** British English, continuous prose, no headings, no bullet points, no bold, no tables. Letter format.
          *   **Decision:** Pick specific variants (no menus). Defend choices.

  2.  **Deconstruct the Phases & Design Choices:**

      *   **Phase 1: Price vs. EV (The Intuition Gap).**
          *   *Game:* Standard St. Petersburg (coin flip until heads, payoff $2^n$).
          *   *Problem:* Infinite EV is abstract. Students need to bid against a finite bank or each other.
          *   *Mechanism:* Becker-DeGroot-Marschak (BDM) is too complex for a fast intro. A simple sealed-bid auction for a single ticket works, but a "buy price" declaration is better. Let's use a sealed-bid second-price auction for a single ticket to reveal true willingness to pay (WTP) without strategic bidding distortion, or simply ask them to write down the maximum they would pay. Let's go with a written "Maximum Buy Price" to keep it simple and personal.
          *   *Stakes:* Points convertible to candy or extra credit. Let's use "Course Credits" (points towards a participation grade) to ensure they care. 100 points = 1% of final grade.
          *   *Timing:* 15 mins.

      *   **Phase 2: Repeated Play (The LLN Failure).**
          *   *Game:* Play the game multiple times.
          *   *Problem:* Doing this physically with 20 students takes too long if each flips coins sequentially.
          *   *Solution:* Parallel play. Everyone plays 5 rounds simultaneously. Then aggregate data.
          *   *Demo:* Projector/Whiteboard. Track the cumulative average payoff per round across the class.
          *   *Timing:* 20 mins.

      *   **Phase 3: The Cap & The Prior (The Hidden Limit).**
          *   *Game:* Capped St. Petersburg.
          *   *Twist:* The cap is unknown. It is drawn from a distribution known only to the instructor.
          *   *Mechanism:* Auction for tickets.
          *   *Goal:* Show EV depends on the cap distribution, not just the game rules.
          *   *Timing:* 25 mins.

      *   **Phase 4: Utility Schedule (The Cost of Resolution).**
          *   *Game:* Same as Phase 1 or 3, but payoffs are transformed by a utility function (e.g., sqrt or log) *before* the auction, or students are told their "utility" is constrained.
          *   *Better approach:* Tell them they are risk-averse according to a specific function (e.g., $U(x) = \sqrt{x}$) and ask them to bid based on *expected utility* maximization. Then show what this implies for other gambles.
          *   *Refinement:* To make it felt, give them a utility schedule card. They must calculate expected utility for the capped game using the card. Then auction. Then show a different gamble where this utility function leads to counter-intuitive results (e.g., rejecting a sure gain).
          *   *Timing:* 20 mins.

      *   **Debrief:** 10 mins.

      *   **Total:** 15 + 20 + 25 + 20 + 10 = 90 mins. Tight. Need to trim.
      *   *Revision:* Phase 1 (10), Phase 2 (20), Phase 3 (25), Phase 4 (20), Debrief (15). Total 90.

      *   **Specific Choices:**
          *   *Currency:* "Seminar Points" (SP). 10 SP = piece of high-quality chocolate. Top scorer gets a book.
          *   *Auction:* Sealed bid. Highest bidder wins, pays second highest (Vickrey) to encourage true value bidding. If tie, random draw. If no bids, instructor keeps ticket.
          *   *Cap:* Randomly selected from {10, 100, 1000, 10000} rounds max.
          *   *Utility:* $U(x) = \sqrt{x/10}$.
          *   *Running Average:* Excel sheet projected. One student inputs data live.

  3.  **Drafting the Content - Section by Section (incorporating constraints):**

      *   *Tone:* Professional, directive, British English (colour, programme, realise, etc.), continuous prose (no lists).
      *   *Opening:* Acknowledge the ambition and the constraints.
      *   *Setup:* Room layout, materials (coins, sheets, projector, chocolate).
      *   *Phase 1:* The initial bid. Write down max price. Reveal median vs theoretical EV.
      *   *Phase 2:* The simulation. 5 rounds per student. Live aggregation. Show the average jumping wildly.
      *   *Phase 3:* The Hidden Cap. Auction for a ticket where the bank has a limit. The limit is drawn from a hat. Bids reveal their assumption about the limit.
      *   *Phase 4:* The Utility Constraint. Give them a utility table. Force them to bid based on expected utility. Show the implication (risk aversion elsewhere).
      *   *Debrief:* Connect feelings to theory.
      *   *Failure Modes:* Auction stalls, students game the system, LLN demo looks convergent by luck, utility feels arbitrary.
      *   *Limitations:* Cannot feel infinite horizon, utility is still normative not descriptive.

  4.  **Refining the Prose (Constraint Check):**
