answer: |-
  Dear Colleague,

  You are attempting a ambitious piece of pedagogical theatre, and to pull it off within ninety minutes requires a script that leaves no room for improvisation. You must treat the seminar room as a laboratory where the variables are controlled not by equations but by the physical constraints of the game itself. To ensure the stakes feel real without exchanging cash, you will use Seminar Points. Print two hundred slips of paper marked with the value 1. At the start of the session, announce that ten points can be exchanged for a piece of high-quality chocolate at the end of the hour, and that the student who accumulates the most points across all phases will receive a hardcover book on decision theory from your personal collection. This combination of immediate gratification and competitive status is sufficient to make twenty undergraduates care about the outcomes. You will need a projector connected to a laptop running a simple spreadsheet, twenty coins, and four sets of printed materials: a bid sheet for phase one, a record sheet for phase two, a auction slip for phase three, and a utility table for phase four. Do not mention the St Petersburg paradox, expected utility, or Nicolas Bernoulli until the final ten minutes. The lesson must be learned through the wallet, not the whiteboard.

  Begin the session by distributing the bid sheet for the first phase. Instruct the students that they are being offered a ticket to a game involving a single coin flip. The rule is simple: you flip a fair coin until it lands heads. If it lands heads on the first flip, they receive 2 points. If it lands tails then heads, they receive 4 points. If tails, tails, then heads, 8 points, doubling for every tails that precedes the first heads. Ask them to write down the maximum number of Seminar Points they would be willing to pay to buy one ticket to this game. Collect these sheets immediately without comment. Do not calculate the expected value on the board. Do not ask them to justify their numbers. Simply collect the data and set it aside. This should take no more than ten minutes. The goal here is to establish a baseline of intuition. When you eventually reveal the theoretical expected value in the debrief, the gap between their median bid, which will likely cluster around 4 or 5 points, and the infinite expected value will be the first wound in their confidence.

  Move directly into the second phase, which must occupy the next twenty minutes. Distribute the record sheets and a coin to each student. Tell them they will now play the game five times each. They are to flip their coins, record the payoff for each round, and calculate their running total. As they do this, you must project the spreadsheet on the screen. Designate one student as the data clerk whose only job is to call out their cumulative payoff after each round so you can enter it into the master sheet. The spreadsheet should be formula-driven to display the class average payoff per round in real time. With twenty students playing five rounds, you will generate one hundred data points. The visual demonstration is critical. You will see the average rise sharply when a student hits a long run of tails, then stagnate for many rounds. Because the variance is infinite, the law of large numbers does not converge in any meaningful timeframe. Instruct the class to watch the average. When a student hits a payoff of 32 or 64, point out how the class average jumps and then refuses to settle back down. This visual instability is the physical manifestation of the divergent sum. If the data looks too stable by chance, you must intervene by simulating a rare event yourself to show how a single outlier drags the mean, ensuring they feel the instability rather than observing a false convergence.

  The third phase requires twenty-five minutes and shifts the focus from the game mechanics to the boundaries of the bank. Tell the students you are now auctioning tickets to the same game, but with a modification. The bank has a limit on how many times it will flip the coin, but you will not tell them what that limit is. Explain that the limit was drawn this morning from a hat containing four cards marked 10, 100, 1000, and 10000, each with equal probability. If the coin flip sequence exceeds the limit, the game stops and they are paid the value corresponding to the limit. Distribute auction slips and run a sealed-bid second-price auction. In this mechanism, the highest bidder wins the ticket but pays the price bid by the second-highest bidder. This incentivizes them to bid their true valuation. Explicitly state the rule that if fewer than three bids are submitted, the auction is void, and you will act as a buyer with a fixed valuation of 5 points to ensure a market price is established, preventing the session from stalling due to excessive caution. Collect the bids. The key here is that the expected value is now finite but entirely dependent on the distribution of the cap, which is unknown. Their bids will reveal their subjective prior over the cap. Some will bid low assuming a small cap, others high. When you collect the slips, do not reveal the winning price yet. This suspense carries into the next phase.

  For the fourth phase, allocate twenty minutes to introduce the cost of resolution. Distribute the utility table. This should be a simple card stating that their satisfaction from points is not linear. Provide the function explicitly as the square root of the points divided by ten. Instruct them that for this round, they must calculate their bid based on the expected utility using this schedule, not the expected point value. Give them a worksheet with the capped game values pre-calculated for the four possible caps to save time, and ask them to compute the expected utility given the equal probability of each cap. They should then submit a new bid based on this calculation. Once collected, offer them a side bet. Ask them if they would accept a guaranteed payment of points equal to the certainty equivalent of their calculated utility, or if they would prefer a different gamble you present on the board, such as a 50 per cent chance of a large sum and 50 per cent of nothing, which their utility function might reject despite a positive expected value. The goal is to show that adopting a utility function to solve the paradox commits them to rejecting other favourable gambles. They must feel the restriction of the utility curve as a loss of opportunity elsewhere.

  The final ten minutes are for the debrief, and you must map their experiences directly to the theory without condescension. Start by revealing the median bid from phase one and contrasting it with the infinite expected value, explaining that their hesitation was not a failure of nerve but a recognition that the expectation is not an observable property of a single trial. Move to the spreadsheet from phase two and point to the jagged line of the running average, explaining that the law of large numbers requires finite variance, which this game lacks, so repetition does not vindicate the expected value. Then reveal the cap distribution from phase three and show how the expected value changes drastically depending on the cap, demonstrating that without a known bound, the expected value is a property of their prior beliefs, not the game rules. Finally, discuss the utility schedule from phase four. Acknowledge that while it renders the expected value finite, it forces them to undervalue high-variance gains in other contexts, which is the price of the solution. Conclude by naming the St Petersburg paradox and explaining that the session was a walk through the history of its proposed solutions, each of which they have now tested against their own intuition.

  You must prepare yourself for specific failure modes that will arise when you run this for the first time. The most likely point of collapse is the auction in phase three. Students may collude tacitly to bid zero or near-zero, fearing the winner's curse. If you see bids clustering at 1 or 2 points, you must interrupt and remind them that the second-price rule protects them from overpaying, but do not explain why. If the auction still stalls, invoke the rule where you act as a buyer with a fixed valuation to set a floor price, ensuring the market clears. Another misconception will survive the running-average demonstration in phase two. Students often believe that if they just played enough times, the average would settle. You will not have time to prove them wrong empirically, so you must be ready to explain that the variance is infinite, meaning the sample size required for convergence is effectively larger than the universe, but you must wait until the debrief to use those words. During the utility phase, a sharp student will object that the square root function is arbitrary. This is a decisive objection only if you present utility as a physical law. You must handle this by agreeing that the function is a constraint you are imposing for the exercise, not a discovery of human nature, and that the lesson is about the commitments any such function entails, not the specific shape of this one. The phase most likely to overrun is phase two, as coin flipping is noisy and students are slow at arithmetic. Keep the rounds strict. Use a timer on the screen. If they are not finished with five rounds in fifteen minutes, cut them off at three. The data quality is less important than the visual impression of instability.

  Finally, you must accept what this activity cannot do. It cannot make them feel the infinite horizon. No matter how long they flip, the maximum payoff will be bounded by human patience and the length of the seminar. You will have to supply the concept of the infinite tail in speech during the debrief because the activity cannot simulate it. It cannot prove that expected utility theory is wrong, only that it requires assumptions they find uncomfortable. The students may leave believing that the problem is merely practical, that with enough money the bank would never break, missing the theoretical point that the expectation diverges regardless of the bank's solvency. You will need to clarify in the debrief that the paradox is about the coherence of the decision rule, not the liquidity of the casino. Furthermore, the activity cannot resolve the normativity of rationality. They will feel that bidding low is sensible, but you must explain that within the framework of expected value maximisation, it is technically irrational, forcing them to choose between their intuition and the axioms. The game creates the tension, but only your explanation can resolve it. You are building a trap for their intuition, and you must ensure they walk into it willingly before you show them the bars.

  Yours sincerely,

  A Colleague
