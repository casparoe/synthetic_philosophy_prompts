answer: |-
  The ink in the Chancery of Maxims never truly dried. It sat upon the page, glistening like a fresh wound, waiting for the adjudicator's stamp to seal it into law. Elara liked the smell of it—gall and iron—but today, the scent felt cloying. She sat in Cubicle 412, the walls of which were lined with precedent binders so heavy they bowed the shelving. Outside the high, narrow windows of the walled city of Ostraca, the evening bell tolled, signaling the end of the filing day. Inside, the silence was absolute, broken only by the scratch of quills and the rhythmic thud of rubber on paper.

  Elara was a Junior Adjudicator, three years into her tenure. She knew the two failures by heart. The First Failure: a maxim that, if universalized, destroyed the very concept of the action (the liar's promise, the thief's taking). The Second Failure: a maxim that could exist as a law, but which no rational being could will, for it would undermine the ends they necessarily held (the hoarder's stinginess, the slothful neglect of talent). These were the canonical boundaries. She could spot a contradiction in conception from a paragraph away.

  But the Chancery did not run on canonical boundaries. It ran on descriptions.

  The file on her desk was Case 909. The citizen was Kaelen Vross, a grain merchant. The act: refusing to release a portion of his private silo to the municipal relief fund during the current frost shortage.

  There were two forms in the folder.

  Form A, filed on the first day of the shortage, read: *"I will withhold grain from the public fund when releasing it would threaten the solvency of my specific business enterprise."*
  Beside it was a green stamp: *CERTIFIED.* Signed by Clerk Jory, a novice who had since been reassigned to the latrines.

  Form B, filed three days later as an "Amendment of Clarification," read: *"I will withhold grain from any public fund when I am not personally compelled by law to release it."*
  Beside it was a red stamp: *REJECTED.* Signed by Magister Vane, Elara's direct superior.

  The act was identical. The silo remained locked. The relief fund remained empty. But the moral status of the merchant hung in the balance, suspended on the pivot of a phrase. If Form A stood, Kaelen was a prudent businessman protecting a necessary end (his livelihood). If Form B stood, he was a free-rider, willing a world where no one contributes to common security, a world that would inevitably collapse when his own turn came to starve.

  Elara rubbed her temples. The Chancery's doctrine was clear: the moral worth of an action resides in the maxim upon which it is done. But the doctrine was silent on who held the pen that wrote the maxim. Citizens were not philosophers. They were litigants. They knew that a narrow description was a shield, and a broad description was a noose. To describe one's action as "lying to save a friend" was to invite the First Failure. To describe it as "speaking falsely when truth would cause grievous harm to an innocent" was to invite a debate on the definition of harm.

  She picked up Form A. *Threaten the solvency of my specific business enterprise.* It was granular. It anchored the maxim to a specific empirical condition. If universalized, would the concept of a grain market vanish? No. A world where merchants protect their solvency is a world of markets. It passed the Conception Test. Did it pass the Volition Test? Could Kaelen will this as a universal law? If all merchants protected their solvency above public aid, would the system of mutual support required for *any* merchant to survive in a shortage crumble? Perhaps. But "solvency" was a high bar. It wasn't mere profit; it was survival.

  She picked up Form B. *Not personally compelled by law.* This was a policy of pure non-interference. Universalized: No one aids the public unless forced. In a crisis, where law lags behind need, the city starves. Kaelen necessarily wills his own survival. He cannot will a system where aid is absent when he might need it. This was a clear Second Failure.

  So, which was the true maxim?

  Elara stood and walked the corridor to Magister Vane's office. The door was ajar. Vane was a man of sharp angles and worn cuffs, a veteran of the Chancery who treated the Universal Law less like a moral compass and more like a structural load-bearing wall.

  "Case 909," Elara said, placing the folder on his desk. "Vross. Jory certified the narrow description. You rejected the broad one. I need to know which description binds him."

  Vane didn't look up from his ledger. "The broad one, obviously. The narrow one is a loophole."

  "But he filed the narrow one first. It describes his actual motivation. He's afraid of bankruptcy."

  "Motivation is smoke, Elara. Description is architecture," Vane said, finally meeting her eyes. "If we allow citizens to define the level of generality, the Chancery becomes a game of semantics. A man steals bread. He files: 'I will take carbohydrates when hungry.' Passes. We starve. He files: 'I will take property without consent.' Fails. We hang him. The act is the same. The description determines the soul."

  "So how do we choose?" Elara asked. "There is no precedent for selecting between competing descriptions of the same act. The Precedent Book records deeds, not syntax."

  Vane leaned back, steepling his fingers. "We choose the description that preserves the system. That is the only meta-maxim we have. If we accept Vross's narrow description, every merchant in the Grain Quarter will amend their filings tomorrow to include 'specific business solvency' clauses. The relief fund dries up. The city riots. The Chancery falls. Therefore, the description must be broad enough to capture the policy, not just the instance."

  "That assumes the test is about social utility," Elara said quietly. "I thought it was about rational consistency."

  "Rational consistency in a vacuum is suicide," Vane snapped. "You are looking for a rule of description that does not exist. You want a formula to tell us how specific a maxim must be. There isn't one. It is a matter of judgment. Of application."

  "But if it's just judgment," Elara pressed, feeling the familiar tightness in her chest, "then the test doesn't constrain us. We decide the morality by choosing the description, not by running the description through the test. The test is just a stamp we put on our own prejudices."

  Vane sighed, the sound of a bellows losing air. "That is the danger of your year in the Academy, Elara. You think the machinery should be perfect. It is not. It is a tool. It keeps the peace. Send Vross back. Tell him Form B stands. Fine him for the confusion."

  Elara returned to her cubicle, but she did not write the summons. She looked at the file again. Vane's argument was pragmatic: the level of generality is an application problem, to be solved by looking at the consequences of the ruling. If the description breaks the city, it is the wrong description.

  But her colleague in the Academy—the one with whom she argued late into the night over cheap wine—would say this proved the test was hollow. If the Universal Law cannot tell us *which* maxim to test, then it is not the source of moral law. It is merely a validator for laws we have already guessed at.

  She needed to see Vross.

  The merchant arrived the next morning, smelling of dust and dry husks. He sat in the interrogation chair, his hands clasped tightly. He was not a villain; he looked terrified.

  "I don't understand," Vross said. "I told the truth. Both times."

  "You filed two truths," Elara said. "One lets you keep your grain. The other sends you to the labor camps. Which one is the real reason you won't open the silo?"

  Vross shifted. "I... I spoke to a scribe before I filed Form A. He told me if I mentioned the law, it would sound like defiance. So I spoke about my business. It is true, Adjudicator. If I give that grain, I cannot pay my workers. If I cannot pay my workers, they starve. Is their starvation less real than the starvation of the people in the square?"

  Elara paused. This was the friction she had felt in the text. The narrow maxim protected one set of ends (his workers) by sacrificing another (the public).

  "And Form B?"

  Vross looked down. "Form B was... what I felt. I felt I shouldn't have to give what is mine. I was angry. I wanted to say, 'It's mine, I do what I want.' But I know that fails. Everyone knows that fails. So I wrote the other one."

  Elara felt a chill that had nothing to do with the drafty office. Vross had admitted that Form A was a strategic construction. It was not the principle upon which he acted; it was the principle upon which he wished to be judged.

  The Chancery's rule was strict: *The maxim filed is the maxim tested.* They could not probe the heart. They could only probe the text. If they ignored the filed text to search for the "real" intention, they became inquisitors, judging thoughts rather than policies. But if they accepted the filed text, they allowed citizens to game the universal.

  "Mr. Vross," Elara said. "If I certify Form A, I am saying that your specific business solvency is a valid exception to the general need for aid. If I certify Form B, I am saying your refusal is a contradiction of your own will to live in a city."

  "Does it matter?" Vross asked. "The grain stays in the silo either way."

  "It matters to the law," Elara said.

  "Does it?" Vross looked at her, his eyes weary. "You people talk about universal laws. But when I look at the man shivering in the square, I don't see a universal. I see a man. And when I look at my workers, I see them. If your law requires me to choose which man starves, your law is already broken."

  Elara dismissed him. She sat alone as the sun moved across the floorboards.

  Vross's comment lingered, scratching at a deeper inconsistency. She pulled the file for a different case, one from the previous month. A woman had refused to shelter a refugee. Her maxim: *"I will not house strangers when my household is at capacity."* It had passed. The Chancery ruled that a household's integrity was a necessary end.

  But Elara remembered the details. The woman had a guest room filled with luxury fabrics. She was not at capacity for *human life*; she was at capacity for *comfort*. The description "household capacity" had been accepted without scrutiny.

  In Vross's case, the "solvency" was real. In the woman's case, the "capacity" was a euphemism. Yet both had passed the Universal Law test because their descriptions were narrow enough to avoid contradiction.

  This was the gap. The Universal Law test could tell you if a maxim was consistent. It could not tell you if the maxim was *complete*. A maxim could be universalizable and still be vile.

  She thought of the second formula, the one the Chancery treated as secondary, almost decorative: *Treat humanity always as an end, never merely as a means.*

  If Vross universalized his narrow maxim, the market survived. The logic held. But in doing so, he was using the citizens in the square as a mere backdrop to his own financial security. Their need was merely an obstacle to his end. The Universal Law test didn't catch this, because a world of selfish merchants is conceivable. It is a cold world, but a logically consistent one.

  The Chancery had no procedure for this. The forms had boxes for Conception and boxes for Volition. There was no box for "Humanity."

  Elara looked at the two forms again. Form A was a lie of omission. Form B was a truth of anger. Vane wanted her to punish the anger and accept the lie, because the lie was easier to regulate. If they forced everyone to file specific solvency clauses, the Chancery would need an army of auditors to verify the solvency. If they enforced the broad duty of aid, they only needed to count the grain.

  Her colleague would say this proved the test was fatal. It relied on a description it could not generate. It was a engine without a steering wheel.
  Vane would say the steering wheel was human judgment, honed by experience. The test was not the driver; it was the road.

  Elara picked up her quill. She had to issue a ruling. She could not send it back. She could not ask for a third description. The system demanded a binary output: Certified or Rejected.

  If she chose Form A, she validated the strategy of narrow description. She told every citizen: *Carve your maxim small enough, and you may do as you please.* She made the Chancery a partner in evasion.
  If she chose Form B, she overruled the citizen's stated principle. She told them: *We know your maxim better than you do.* She made the Chancery an inquisitor of the soul.

  There was no third option. There was no rule in the Precedent Book that said, "Select the description that best captures the agent's relationship to humanity." That concept did not exist in the code. The code only knew contradiction.

  Elara dipped the quill. The ink pooled, black and absolute.

  She thought of Vross's workers. She thought of the shivering man in the square. She thought of the silence of the Chancery, a silence that pretended to be reason but was often just order.

  She pulled Form A toward her. It was the filed document. To reject it was to say the text was not the maxim. But if the text was not the maxim, what was? A feeling? A whisper? The Chancery could not stamp a whisper.

  She pulled Form B toward her. It was the honest impulse. To accept it was to punish the honesty and reward the deception of Form A. But Form A was the one that allowed the system to function without total surveillance.

  Her hand hovered. She realized then that the difficulty was not in the testing. It was in the seeing. The test assumed the maxim was an object to be found, like a stone in a field. But maxims were not stones. They were horizons. They moved as you moved toward them.

  If she ruled for Vane, she preserved the city's grain supply but eroded the integrity of the filing system.
  If she ruled for Jory, she preserved the integrity of the text but opened the floodgates to semantic evasion.

  There was no description available to her that solved this. To solve it, she would need a language the Chancery did not speak. She would need to write a maxim that included the other person's end as part of her own. *"I will withhold grain only if doing so does not treat the needy as mere means."* But how to test that? How to universalize a constraint on *treatment* rather than *action*? The forms did not have space for it.

  Elara lowered the quill onto Form B. The red ink bloomed. *REJECTED.*

  She wrote the addendum in the margin, her handwriting tight and small: *"The description of the maxim must reflect the policy instantiated, not the exception sought. To will a universal law is to will the world it creates, not the loophole it exploits."*

  It was not a rule. It was a plea. It would not bind the next adjudicator. Vane would nod and say she did well. Her colleague would say she patched a hole in a sinking ship.

  Elara stamped the paper. The thud echoed in the small room, final and hollow. She placed the file in the out-tray. Outside, the bell tolled again. Somewhere in the city, a silo remained locked. Somewhere, a man went hungry. The law was consistent. The description was binding. And Elara sat in the silence, wondering if she had judged the act, or merely the words used to hide it. She reached for the next file, the ink on her fingers already smudging, waiting for the next impossible choice to arrive.
