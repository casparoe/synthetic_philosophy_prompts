prompt: |-
  My reading group is doing famine economics and one guy keeps saying 'famines are political, not natural.' Last week he used it to argue that donating to famine relief is a waste of money -- what actually matters is elections, an opposition, a press that can't be muzzled -- and when I said 'functioning democracy' sounded like it was doing all the work in his story he told me I was being pedantic. He also says there's never been a famine in a functioning democracy, and that Bengal in 1943 settles it because people starved when there wasn't any real shortage of food, which I'm pretty sure is contested; the Irish famine also looks awkward for him (Ireland had MPs and newspapers the whole time, and London was running things).

  Can you take that one-liner apart for me? I want the different precise claims it could be making -- about causes, about blame, about what even counts as a famine, about what actually stops one -- laid out as a menu, with a verdict on each: platitude, substantive and defensible, false, or unfalsifiable, plus which reading he most likely meant and which of them would actually get him to 'so dont donate.' If I've got the setup backwards somewhere, just say so instead of playing along.
