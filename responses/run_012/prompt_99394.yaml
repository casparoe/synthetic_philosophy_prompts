      *   The Interruption: The Fracture of Authority.
      *   The Ending: The Authority of the Present Moment (The Letter).
      *   What Cinema Adds: Embodiment and the "Thick" Present.
      *   Conclusion: Siding with the Later Self, but with grief.

  9.  *(Self-Correction during drafting)*: I need to be careful not to say the film *rejects* advance directives entirely. It complicates them. The prompt asks if it sides with precedent autonomy or the later self. I will argue it sides with the later self's *experience* without necessarily invalidating the earlier self's *fear*, but ultimately prioritizing the care of the living person over the wishes of the ghost.

  10. **Final Polish of the Argument:** The "Command" assumes the future self is a subordinate. The "Letter" assumes the future self is a stranger who might benefit from advice. The film shows the future self *is* a stranger, but one capable of love. Therefore, the Command fails, but the relationship remains.

