  Based on the pattern of your friend's intuitions, here is the breakdown of her likely verdict, the rules in play, and how to test them.

  ### 1. Her Verdict on the New Case
  **Verdict:** **Not Fragile.**

  **Why:** Your friend distinguishes sharply between **static background conditions** (the steel box, the shellac, the insulation) and **stimulus-triggered mechanisms** (the draining switch, the live-source gadget).
  *   In the **Steel Box** case, the protection is already there *before* the strike. The glass's intrinsic nature is untouched, and the prevention is passive. She calls this **Fragile**.
  *   In the **Draining Switch** case, the protection (or rather, the removal of the basis) is activated *by* the stimulus. She calls this **Not Disposed**.
  *   The **Foam Gadget** is structurally identical to the Draining Switch: it is an extrinsic mechanism that activates *the instant* the stimulus occurs. Even though it masks the manifestation (breaking) rather than removing the basis (molecular structure), her rejection of the Draining Switch suggests she treats stimulus-triggered interference as "rigging" that negates the disposition attribution.

  ### 2. The Rules

  **Rule A: The "No Stimulus-Triggered Interference" Rule (Her Likely Rule)**
  *   **Definition:** A thing has a disposition iff it has the relevant intrinsic base *and* there is no mechanism (intrinsic or extrinsic) that actively intervenes to prevent or mimic the manifestation *in response to the stimulus*. Static masks don't count; dynamic, stimulus-linked masks do.
  *   **Fit to Past Data:**
      *   Steel Box/Shellac/Insulation: Static masks. $\rightarrow$ Disposition holds.
      *   Draining Switch/Dead Wire Gadget: Stimulus-triggered mechanisms. $\rightarrow$ Disposition fails.
      *   Annealed/Inert Sugar: Intrinsic base gone. $\rightarrow$ Disposition fails.
  *   **Prediction for New Case:** **Not Fragile.** (The foam is triggered by the strike).

  **Rule B: The "Intrinsic Categorical Base" Rule (Alternative)**
  *   **Definition:** A thing has a disposition iff it possesses the intrinsic physical structure (categorical base) that grounds the disposition at the time of the stimulus. Extrinsic factors (whether static or dynamic) cannot add or remove a disposition; they can only mask or mimic it.
  *   **Fit to Past Data:**
      *   Steel Box/Shellac/Insulation: Base intact. $\rightarrow$ Disposition holds.
      *   Annealed/Inert Sugar: Base changed. $\rightarrow$ Disposition fails.
      *   Dead Wire Gadget: Base absent. $\rightarrow$ Disposition fails.
      *   Draining Switch: Base removed *by* stimulus. $\rightarrow$ Disposition fails (because the base does not persist *through* the interaction).
  *   **Prediction for New Case:** **Fragile.** (The glass's molecular structure remains intact; the foam is merely an extrinsic mask, analogous to the steel box).

  ### 3. Which One I'd Bet On
  **I would bet on Rule B (Intrinsic Categorical Base) $\rightarrow$ Fragile.**

  **Reasoning:**
  While Rule A fits your friend's specific "rigged" intuition, Rule B is the more philosophically robust standard (aligned with David Lewis's defense of dispositions). The distinction between **removing the basis** (Case 7, Draining Switch) and **blocking the manifestation** (New Case, Foam) is metaphysically significant.
  *   In the Draining Switch, the *power itself* (the charge) is annihilated.
  *   In the Foam Case, the *power* (the brittle structure) remains fully present; only the *outcome* is intercepted.
  *   Since your friend accepted the Steel Box (which also intercepts the outcome), consistency demands she accept the Foam Gadget. The only difference is the *speed* of the interception (static vs. dynamic). Unless she believes speed changes ontology, the glass remains fragile. The gadget is a separate object saving the glass, not a change in the glass itself.

  ### 4. The Case That Would Settle It
  To determine whether she is following Rule A (No Triggered Interference) or Rule B (Intrinsic Base), you need a case where the **interference is extrinsic and triggered**, but the **intuition about "intrinsicness" is heightened**.

