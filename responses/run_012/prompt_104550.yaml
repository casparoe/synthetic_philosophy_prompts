      *   *Predictable Failure:* Participants will try to find loopholes in the Steward's rules. They will treat it as a game to win, not a simulation to feel.
      *   *Mitigation:* Facilitator must enforce "Spirit of the Mode."
      *   *Missing Feature:* The activity simulates a *single* interaction. Real alignment is recursive/long-term. The "Steward" is a human, not an opaque neural net. The "Values" are predefined on a card, not learned.
      *   *Script:* Need a precise way to say "This card isn't the hard problem."

  6.  **Refining the Mechanics for Maximum "Bite":**
      *   To make it bite, the "Paternal" Steward needs to be *right* but *annoying*.
      *   To make the "Literal" Steward bite, they need to be *helpful* but *catastrophic*.
      *   I need specific Scenario Cards. Generic "do good" is too vague.
      *   Scenario: "The Neighborhood AI."
      *   Operator Goal: "Reduce noise complaints."
