  Okay, this has been eating at me for weeks and I need an actual number, not a shrug. My claim is this: a person who gets her scientific and mathematical beliefs almost entirely from an AI assistant she can't audit -- where the assistant is genuinely reliable and she has good evidence that it is, because she's stress-tested it, knows its failure modes, and catches the failures when they surface -- loses nothing that matters epistemically when she can no longer reconstruct the derivations herself. My friend thinks that's cope: that what's lost isn't accuracy, it's the thing that made the belief *hers*. So give me your credence in the claim itself, stated precisely: that someone who retains the capacity to discriminate good outputs from bad and to repair errors once they're flagged, but who has lost the capacity to reconstruct the reasoning from scratch, has as much epistemic standing with respect to the resulting belief as someone who derived it herself. I want a number, then the decomposition -- how much rides on whether understanding is a property of an individual agent at all or can be realized by an agent-plus-artifact system (extended-mind style); how much on whether reliability plus good meta-evidence is sufficient for warrant or whether there's an extra "grasping" condition on top; how much on whether the meta-evidence I described is realistically available to someone who can't audit the intermediate steps (i.e. whether "she'd notice if it were wrong" is something she can actually know about herself); how much on whether the good at stake is the truth of the belief or some virtue of the knower; and whatever else you think belongs. A number and one line of justification for each, then the combination. Then tell me which term you're least confident in and what would shift it.

