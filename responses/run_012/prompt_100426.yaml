prompt: |-
  I'm a science and ideas reporter at a mid-size regional outlet, and about two years ago I also got handed our weekly ideas desk, which means I'm the one who decides what happens to the pitches that come in about possible harms: a small local study finding a pesticide residue in the water supply, a preprint suggesting a popular reading app is slowing kids down, a chemist who says a chemical in food packaging is something he "wouldn't want in his kitchen," that kind of thing. We get four or five a week and I get maybe twenty minutes each, and right now my method is vibes plus two questions I inherited from the last person in this chair: does anyone propose a mechanism, and who paid for the study. I want to replace that with an actual procedure grounded in the precautionary principle -- not the bumper-sticker version, but the thing as it's been spelled out by people who take it seriously, where precaution is supposed to kick in when the science is uncertain but the potential harm is serious, and where it comes with built-in discipline: the response has to be proportional to the harm you're worried about, you can't treat like cases differently, you have to weigh the costs of acting against the costs of not acting, and you have to revisit the call as evidence comes in. I also half-remember a risk-studies distinction between risk, uncertainty, ambiguity and ignorance -- probabilities known, probabilities unknown, contested framings, and not even knowing what you're missing -- and I think our desk badly needs something like it, because "we don't know" covers four very different situations in our pitch inbox. So: write me the procedure. The ordered questions, what counts as a sufficient answer to each, where it stops with a no, where it stops with a yes, and where it has to hand the call to a human. It has to run in twenty minutes, it'll be used by two junior editors and a freelancer who don't have science backgrounds, we publish daily so "wait for more evidence" costs us the story, and anything that names a local company or that would read as a health alarm goes to the standards editor and in the second case the editor-in-chief, who is the one who actually eats the legal risk.

  Two things I want it to handle honestly. First, someone on the desk keeps saying the precautionary principle is empty because any story we run also carries risks -- it scares people off a treatment that works, it gets picked up and mangled by worse outlets, it damages a small business on thin evidence -- so precaution cuts both ways and can't tell us anything. If that objection sinks the whole idea, say so; if there's a version of the procedure that survives it, show me which step is doing the surviving. Second, consistency, because I know we'd run the pesticide story in a heartbeat and bury the identical one about a product our readers happen to like, and I don't have a principled answer for why. Then run the thing on three pitches: (a) the water-supply pesticide residue, one small study, no mechanism, one epidemiologist quoted as "concerned"; (b) the reading-app preprint, decent sample but it contradicts two earlier studies and the authors are selling a competitor product; and (c) a tip from a researcher that a widely used over-the-counter remedy he thinks is useless is being overprescribed at a clinic in our coverage area -- no study, a handful of patient anecdotes, and a plausible-sounding biological story. I'll be straight with you, (c) is the one I want to run, it's the kind of story that makes a career, so if the procedure tells me to sit on it or to kick it upstairs, fine, but I want to see exactly which step does that and whether I'm just being flattered into the answer I like. Mark the points where a judgment call is dressed up as procedure, tell me what the procedure can't do, and at the end tell me which step you'd personally bet on least and what would change your mind -- which consideration would flip your verdict on any of the three, or what would have to be true about our desk or our readers for a different procedure to be the right one.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **User:** Science and ideas reporter at a mid-size regional outlet, managing a weekly ideas desk.
      *   **Task:** Create a decision-making procedure for evaluating pitches about potential harms (pesticides, apps, chemicals, etc.).
      *   **Constraints:**
          *   Must be grounded in the *Precautionary Principle* (serious harm + uncertainty = action, but proportional, consistent, cost-weighted, revisable).
          *   Must incorporate the *Risk/Uncertainty/Ambiguity/Ignorance* distinction (Rumsfeldian/Knightian concepts).
          *   Time limit: ~20 minutes per pitch.
          *   Users: Two junior editors + one freelancer (non-science backgrounds).
          *   Output: Daily publication (can't just say "wait").
          *   Escalation: Local company names or health alarms $\rightarrow$ Standards Editor + Editor-in-Chief (EiC).
          *   Must address two specific challenges:
              1.  The "Precaution Cuts Both Ways" objection (running a story has risks too).
              2.  Consistency (avoiding bias against/for specific local interests).
          *   Must test the procedure on three specific pitches (A: Water pesticide, B: Reading app, C: Useless remedy).
          *   Must identify where judgment calls are disguised as procedure, limitations of the procedure, and the weakest step.
      *   **Tone:** Professional, rigorous, honest, practical, slightly cynical but constructive.

  2.  **Deconstruct the Core Concepts:**

      *   **Precautionary Principle (PP):** It's not "better safe than sorry" (which is infinite caution). It's "proportional response to plausible threat under uncertainty." Key elements: Proportionality, Consistency, Cost-Benefit (of action vs. inaction), Revisability.
      *   **Risk/Uncertainty/Ambiguity/Ignorance (R/U/A/I):**
          *   *Risk:* Probabilities known (e.g., smoking causes cancer).
          *   *Uncertainty:* Outcomes known, probabilities unknown (e.g., new chemical, animal studies only).
          *   *Ambiguity:* Outcomes contested/interpreted differently (e.g., economic impact vs. health impact).
          *   *Ignorance:* Don't know what we don't know (black swans).
      *   **The "Precaution Cuts Both Ways" Objection:** This is the Type I vs. Type II error problem. False Positive (alarmism) vs. False Negative (missing a threat). The procedure *must* weigh the harm of the story against the harm of silence.

  3.  **Drafting the Procedure (The "Algorithm"):**

      *   *Goal:* 20 minutes. Needs to be a checklist/flowchart style.
      *   *Step 1: Triage (The "Stop" Gates).* Legal/Escalation triggers.
      *   *Step 2: Classify the Knowledge State (R/U/A/I).* This addresses the "we don't know" variance.
      *   *Step 3: Assess Potential Harm (Severity & Reversibility).* Is this death or a rash? Can it be undone?
      *   *Step 4: Assess the Evidence (Plausibility).* Mechanism? Peer review? Conflict of interest?
      *   *Step 5: The "Precaution Cuts Both Ways" Test.* What is the cost of publishing? What is the cost of silence?
      *   *Step 6: Consistency Check.* Have we treated similar threats similarly?
      *   *Step 7: Decision & Framing.* Go/No-Go/Escalate.

  4.  **Refining the Steps for Non-Experts:**

      *   Avoid jargon where possible, or define it simply.
      *   Make the "Sufficient Answer" criteria concrete.
      *   Ensure the "Escalation" triggers are clear (Local Co / Health Alarm).

  5.  **Addressing the Specific Challenges:**

      *   *Challenge 1 (PP Objection):* This needs to be Step 5. The procedure survives by explicitly weighing the *harm of the story* (panic, economic damage) against the *harm of the threat*. If the story causes more harm than the threat, PP says *don't* run it (or frame it differently).
      *   *Challenge 2 (Consistency):* This needs to be Step 6. A "Lookback" requirement. "Did we run the pesticide story? Why is this different?"

  6.  **Testing on the Three Pitches:**

      *   *(A) Water Pesticide:* Small study, no mechanism, one quote.
          *   Harm: High (water supply).
          *   Evidence: Low (no mechanism).
          *   Cost of Story: High (panic, utility costs).
          *   Cost of Silence: High (health).
          *   Escalation: Yes (Local utility/company?).
          *   Verdict: Likely Escalate/Kill unless framed carefully.
      *   *(B) Reading App:* Preprint, contradicts prior, COI.
          *   Harm: Medium (kids' development).
          *   Evidence: Low/Mixed (preprint, COI).
          *   Cost of Story: Medium (app developer reputation).
          *   Cost of Silence: Low (parents might figure it out).
          *   Verdict: No-Go or "Study Watch" (low prominence).
      *   *(C) Useless Remedy:* Tip, anecdotes, plausible biology.
          *   Harm: Medium/High (wasted money, delayed effective treatment).
          *   Evidence: Very Low (anecdotes).
          *   Cost of Story: High (Clinic reputation, legal risk).
          *   Cost of Silence: Medium (patients continue useless treatment).
          *   *User Bias:* User wants to run this.
          *   *Procedure Reality:* This is "Ignorance/Ambiguity." High legal risk. Procedure should flag this for Escalation.

  7.  **Identifying Weaknesses & Judgment Calls:**

      *   Where is the human hiding in the machine? (Assessing "Plausibility" and "Proportionality").
      *   What can't it do? (It can't verify truth, only process).
      *   Weakest Step: Step 5 (Cost-Benefit of the Story). It's subjective.
      *   What changes my mind? If the outlet's mission is purely "watchdog" vs. "community service."

  8.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Acknowledge the difficulty. Validate the "Precaution Cuts Both Ways" point.
      *   *The Matrix:* Define R/U/A/I simply.
      *   *The Procedure:* 7 Steps. Time-boxed.
      *   *The Test:* Run A, B, C through the steps.
      *   *The Meta-Analysis:* Answer the specific questions about judgment calls, limitations, and the "bet."

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Escalate" for everything. The user has 20 minutes. If everything goes to the EiC, the procedure is broken. I need to define thresholds where the junior editor can say "No" definitively.
      *   *Refinement on Escalation:* Only escalate if it passes the "Harm" threshold *and* names a local entity/triggers health alarm. If it fails the "Evidence" threshold, junior editor can kill it.
      *   *Refinement on Pitch C:* The user *wants* to run it. The procedure *should* make that hard because it's anecdotes + attacking a local clinic. I need to be honest that the procedure will likely flag this as high risk. I shouldn't rig it to let them run it easily.

      *(Refining the "Precaution Cuts Both Ways" answer)*: The objection doesn't sink the idea; it *refines* it. The procedure survives by treating the *publication itself* as an intervention that requires precaution. Step 5 is the survivor.

      *(Refining Consistency)*: Step 6 needs to be a literal checklist. "Have we covered X before?"

  9.  **Final Review against Constraints:**

      *   20 minutes? Yes, if steps are tight.
      *   Non-science background? Yes, keep definitions clear.
      *   Address R/U/A/I? Yes, Step 2.
      *   Address PP nuances? Yes, Step 3 & 5.
      *   Address the 3 pitches? Yes.
      *   Address the "Weak Step"? Yes.

  10. **Final Polish:** Ensure tone is respectful of the journalist's integrity but firm on the risks. (Proceed to generate output).

  *(Self-Correction on Pitch C)*: The prompt says "no study, a handful of patient anecdotes." This is extremely thin. A responsible editor *should* be wary. I must ensure the procedure reflects this, even if the user wants to run it. I will highlight that Step 4 (Evidence) and Step 7 (Escalation) are the barriers here.

  *(Self-Correction on "Precaution Cuts Both Ways")*: I need to explicitly state that the Precautionary Principle applies to the *journalism* too. Publishing is an action. Action requires precaution.

  *(Final check on R/U/A/I definitions)*:
  Risk: Known odds.
  Uncertainty: Unknown odds.
  Ambiguity: Disagreement on meaning.
  Ignorance: Unknown unknowns.
  Make sure the procedure uses these to dictate *how much* evidence is needed. (e.g., Ignorance requires more corroboration than Risk).

  Let's write it.cw
answer: |-
  Here is the procedure, designed for a 20-minute window, non-specialist editors, and the specific ethical constraints of your outlet.

  ### Part 1: The Framework (Read Once, Keep on Desk)

  **The Precautionary Principle (Operational Definition)**
  Precaution is not "better safe than sorry." It is: *When an activity raises threats of harm to human health or the environment, precautionary measures should be taken even if some cause-and-effect relationships are not fully established scientifically.*
  **Crucial Addendum:** Publishing a story is an *activity*. It raises threats (panic, economic harm, loss of trust). Therefore, **precaution applies to the story itself.** This answers the objection that "precaution cuts both ways." It does not sink the idea; it mandates that Step 5 (Cost of Action) weighs the harm of the story against the harm of the threat.

  **The Knowledge State Matrix (R/U/A/I)**
  Use this to categorize the pitch in Step 2.
  1.  **Risk:** Probabilities known (e.g., smoking causes cancer). *Action: Report facts.*
  2.  **Uncertainty:** Outcomes known, probabilities unknown (e.g., new chemical, animal data only). *Action: Precaution applies.*
  3.  **Ambiguity:** Outcomes contested/interpreted differently (e.g., economic benefit vs. health risk). *Action: Disclose conflict.*
  4.  **Ignorance:** We don't know what we don't know (e.g., anecdotal tip, no mechanism). *Action: High burden of proof.*

  ---

  ### Part 2: The Procedure (The 20-Minute Clock)

  **Time Limit:** 20 Minutes.
  **Users:** Junior Editors, Freelancers.
  **Trigger:** If **ANY** step results in "ESCALATE," stop the clock and forward to Standards Editor + EiC.

  #### Step 1: The Legal & Local Trigger (2 Minutes)
  *   **Question:** Does this pitch name a specific local company, clinic, or individual? OR Does it imply a direct, immediate health threat to the general public (e.g., "don't drink the water")?
  *   **Sufficient Answer:** Yes/No.
  *   **Decision:**
      *   **YES:** **ESCALATE.** (Do not proceed. This is for Standards/EiC).
      *   **NO:** Proceed to Step 2.

  #### Step 2: Classify the Knowledge State (3 Minutes)
  *   **Question:** Which box does the evidence fall into?
      *   *Risk:* Established consensus, meta-analyses.
      *   *Uncertainty:* Single study, preprint, animal data, expert disagreement.
      *   *Ambiguity:* Data exists but meaning is fought over (e.g., industry vs. activist interpretation).
      *   *Ignorance:* Anecdotes, tips, no data, "something feels wrong."
  *   **Sufficient Answer:** Select one category.
  *   **Decision:**
      *   **Risk:** Proceed to Step 3 (Low barrier).
      *   **Uncertainty:** Proceed to Step 3 (Medium barrier).
      *   **Ambiguity/Ignorance:** Proceed to Step 3 (High barrier).

  #### Step 3: Assess Severity & Reversibility (3 Minutes)
  *   **Question:** If the threat is real, how bad is it? And if we are wrong, can the damage be undone?
  *   **Sufficient Answer:**
      *   *Severity:* Death/Permanent Injury (High) vs. Temporary Illness/Financial Loss (Medium) vs. Nuisance (Low).
      *   *Reversibility:* Can people stop the exposure easily? (Yes = Low Risk) vs. Is it in the water supply/bloodstream? (No = High Risk).
  *   **Decision:**
      *   **Low Severity + High Reversibility:** **NO-GO.** (Not worth the ink).
      *   **High Severity + Low Reversibility:** Proceed to Step 4.
      *   **Mixed:** Proceed to Step 4.

  #### Step 4: The Mechanism & Corroboration Check (5 Minutes)
  *   **Question:** Is there a plausible biological/physical mechanism? Is there *any* independent corroboration?
  *   **Sufficient Answer:**
      *   *Mechanism:* "Yes, peer-reviewed paper explains pathway" OR "No, just correlation/anecdote."
      *   *Corroboration:* "Two+ independent sources" OR "Single source with Conflict of Interest (COI)" OR "Single source, no COI."
  *   **Decision:**
      *   **No Mechanism + Ignorance State (from Step 2):** **NO-GO.** (This is speculation).
      *   **Mechanism + Uncertainty State:** Proceed to Step 5.
      *   **COI Present:** Proceed to Step 5 (but note: burden of proof increases).

  #### Step 5: The "Precaution Cuts Both Ways" Test (5 Minutes)
  *   **Question:** What is the cost of publishing vs. the cost of silence?
  *   **Sufficient Answer:**
      *   *Cost of Story:* Will this cause undue panic? Will it destroy a small business on thin evidence? Will it stop people from using a necessary treatment?
      *   *Cost of Silence:* Will people get sick? Will money be wasted? Will a bad actor continue unchecked?
  *   **Decision:**
      *   **Cost of Story > Cost of Silence:** **NO-GO.** (Or reframe as "Science Watch" without alarm).
      *   **Cost of Silence > Cost of Story:** Proceed to Step 6.
      *   **Unclear:** **ESCALATE.**

  #### Step 6: The Consistency Check (2 Minutes)
  *   **Question:** Have we covered a similar threat in the last 12 months? How did we treat it?
  *   **Sufficient Answer:** Search archive. "We ran a story on X with similar evidence" OR "We killed a story on Y with better evidence."
  *   **Decision:**
      *   **Inconsistent Treatment:** **ESCALATE.** (Explain why this case is different, or align with previous decision).
      *   **Consistent:** Proceed to Step 7.

  #### Step 7: Final Framing & Decision (Remaining Time)
  *   **Question:** How do we write this to minimize harm while informing?
  *   **Sufficient Answer:** Headline draft. Does it match the evidence level? (e.g., "Study Suggests" vs. "Toxic Danger").
  *   **Decision:**
      *   **GO:** (With framing constraints).
      *   **NO-GO:** (Kill).
      *   **ESCALATE:** (If any doubt remains).

  ---

  ### Part 3: Running the Pitches

  Here is how the procedure handles your three scenarios.

  #### Pitch (A): Water-Supply Pesticide Residue
  *   **Step 1 (Local/Health):** Names water supply (Public Health Alarm). **$\rightarrow$ ESCALATE.**
  *   **Analysis:** Even if the science were perfect, naming a public utility or water supply triggers the legal/safety escalation immediately. A junior editor cannot clear this.
  *   **Outcome:** Story does not die, but it leaves your desk immediately. The EiC decides if the legal risk is worth the public interest.
  *   **Consistency Note:** If you buried a similar story last year, Step 6 will catch that during the escalation memo.

  #### Pitch (B): Reading App Preprint
  *   **Step 1:** No local company named (assuming app is national/tech). No immediate health alarm. **$\rightarrow$ Proceed.**
  *   **Step 2 (Knowledge):** Preprint, contradicts prior studies. **$\rightarrow$ Uncertainty.**
  *   **Step 3 (Severity):** Kids' development. **$\rightarrow$ High Severity.** Reversibility? **$\rightarrow$ Medium (stop using app).**
  *   **Step 4 (Mechanism/Corroboration):** Mechanism plausible? Maybe. Corroboration? **$\rightarrow$ Contradicts 2 earlier studies. Author has COI (selling competitor).**
  *   **Step 5 (Cost/Benefit):**
      *   *Cost of Story:* High. Damages app developer, confuses parents, author benefits financially.
      *   *Cost of Silence:* Low. Parents can limit screen time generally without this specific study.
      *   *Verdict:* **Cost of Story > Cost of Silence.**
  *   **Step 6 (Consistency):** Have we run preprints with COI before? If yes, why?
  *   **Decision:** **NO-GO** as a warning story. **GO** only as a "Science Watch" piece about conflicting studies on screen time, explicitly mentioning the COI and the contradiction.
  *   **Why:** Step 5 is doing the heavy lifting here. The harm of the story (misleading parents, commercial damage) outweighs the uncertain benefit.

  #### Pitch (C): Useless Over-the-Counter Remedy (The Career Story)
  *   **Step 1 (Local/Health):** Names a local clinic. Implies treatment is useless (Health/Malpractice implication). **$\rightarrow$ ESCALATE.**
  *   **Analysis:** I know you want to run this. But look at Step 1. It names a local entity and questions medical efficacy. That is libel adjacent. It *must* go to Standards/EiC.
  *   **Hypothetical (If Step 1 didn't trigger):**
      *   **Step 2:** Anecdotes, no study. **$\rightarrow$ Ignorance.**
      *   **Step 3:** Wasted money/delayed care. **$\rightarrow$ Medium Severity.**
      *   **Step 4:** No mechanism, just "plausible-sounding." **$\rightarrow$ No Mechanism + Ignorance.**
      *   **Decision at Step 4:** **NO-GO.**
  *   **Outcome:** The procedure kills this at Step 1 (Escalation) or Step 4 (Evidence).
  *   **The Hard Truth:** You are being flattered. This pitch is "Ignorance" state with high legal risk. To run this, you need more than anecdotes. You need to investigate *why* it's being prescribed (financial kickbacks? outdated guidelines?). If you find *that* evidence, it moves from Pitch C to a new Pitch D (Corruption/Policy), which changes the Step 2 classification from Ignorance to Risk/Uncertainty.
  *   **Where the procedure stops you:** Step 4. "No Mechanism + Ignorance State = No-Go." This prevents you from publishing a hunch as a finding.

  ---

  ### Part 4: Meta-Analysis & Limitations

  **1. Where is the judgment call dressed up as procedure?**
  *   **Step 5 (Cost/Benefit):** This is the most subjective step. One editor's "undue panic" is another's "necessary warning." The procedure forces you to write the answer down, which exposes the bias, but it doesn't eliminate it.
  *   **Step 2 (Classification):** Deciding between "Uncertainty" and "Ignorance" requires intuition. A junior editor might classify a wild tip as "Uncertainty" to get it to Step 5.
  *   **Step 6 (Consistency):** "Similar threat" is subjective. Is a pesticide in water "similar" to a chemical in packaging? A human has to decide.

  **2. What the procedure cannot do:**
  *   **It cannot verify truth.** It only processes the *claim* of truth. If a source lies convincingly in Step 4, the procedure might pass them to Step 5.
  *   **It cannot absorb legal risk.** Step 1 kicks the can to the EiC, but it doesn't solve the problem. It just ensures the person paid to eat the risk knows they are eating it.
  *   **It cannot fix resource constraints.** If you don't have time to check archives in Step 6, consistency fails.

  **3. The "Precaution Cuts Both Ways" Objection:**
  *   **Does it sink the idea?** No.
  *   **Which step survives it?** **Step 5.** By explicitly weighing the *harm of publication* against the *harm of the threat*, the procedure incorporates the objection into the logic. It acknowledges that journalism is an intervention. If the intervention causes more harm than the status quo, Precaution dictates *inaction* (killing the story). This prevents the principle from being a one-way ratchet toward alarmism.

  **4. Consistency (The Pesticide vs. Product Bias):**
  *   **Which step fixes this?** **Step 6.**
  *   **How:** If you run the pesticide story (Pitch A) because "public health," you must document that rationale. When Pitch B (App) or Pitch C (Clinic) comes in, you must compare. If you kill Pitch B, you must write down *why* it is different from Pitch A. If the only difference is "we like apps more than pesticides," Step 6 forces you to admit that, which usually shames the editor into consistency.

  **5. The Weakest Step (My Bet):**
  *   **I would bet least on Step 4 (Mechanism & Corroboration).**
  *   **Why:** Non-science editors struggle to distinguish "plausible-sounding" from "mechanistically sound." A charismatic researcher can talk their way through Step 4 on Pitch C.
  *   **What would change my mind:** If you added a "External Sanity Check" requirement for Ignorance/Uncertainty states. (e.g., "Must email one independent expert not named in pitch"). But that breaks the 20-minute limit.
  *   **Alternative:** If your readers are highly scientifically literate, Step 5 shifts. The "Cost of Story" (panic) decreases because readers understand uncertainty. If your readers are vulnerable to misinformation, Step 5 becomes much stricter. The procedure assumes a "vulnerable audience" by default. If that's not true, Step 5 needs adjustment.

  **6. Final Advice on Pitch C:**
  You want to run Pitch C because it feels like watchdog journalism. The procedure says "No" because it is currently an anecdote. **Do not fight the procedure here.** Use the procedure to justify the reporting time. Tell your editor: *"Step 4 killed this as a story, but Step 3 flagged the harm. I need 3 days to convert this from Ignorance to Uncertainty. I need to find the data on prescription rates."*
  If you find the data, the procedure lets you run it. If you don't, the procedure saved you from a lawsuit. That is the value of the desk.
