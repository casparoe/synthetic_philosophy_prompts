  ### Logical Space Analysis

  Before constructing the instrument, we must map the terrain. The symbol grounding problem asks how internal states acquire "aboutness" (reference to the world). The logical space is defined by four orthogonal axes:

  1.  **Internalism vs. Externalism:** Does meaning depend solely on relations inside the system (syntax, inference) or on relations to the outside world (causes, users, environment)?
  2.  **Atomism vs. Holism:** Is meaning a property of individual symbols/states, or does it emerge only from the whole system's structure or behavior?
  3.  **Current State vs. History:** Does meaning depend on how the system is connected right now, or on how it was made (evolution, training, selection)?
  4.  **Binary vs. Gradual:** Is grounding an all-or-nothing threshold, or a matter of degree?

  The following decision tree navigates this space using concrete intuitions rather than theoretical labels. Terms of art are defined in clauses where they first appear.

  ### The Grounding Decision Tree

  **Node 1: The Dictionary Case**
  Consider a dictionary that defines its words only in terms of other words in the same dictionary: does this circle of definitions suffice for meaning?
  *   **Yes** → Go to Node 2.
  *   **No** → Go to Node 3.

  **Node 2: The Holism Case**
  Consider a single hidden unit in a neural network: does it possess meaning independently of the rest of the network?
  *   **Yes** → Go to Node 4.
  *   **No** → **Leaf A**

  **Node 3: The Atomism Case**
  Consider a single hidden unit in a neural network: does it possess meaning independently of the rest of the network?
  *   **Yes** → Go to Node 5.
  *   **No** → **Leaf A** *(Note: Holism cuts across Internal/External)*

  **Node 4: The Chess Case**
  Consider a chess engine's representation of a queen: is its meaning fixed entirely by the rules of movement?
  *   **Yes** → **Leaf B**
  *   **No** → **Leaf C**

  **Node 5: The Weather Case**
  Consider the internal variable in a numerical weather model that reliably tracks sea-surface temperature: does this correlation constitute meaning?
  *   **Yes** → **Leaf D**
  *   **No** → Go to Node 6.

  **Node 6: The Robot Case**
  Consider a robot whose symbols are wired to transducers and effectors but which has never been rewarded, punished, or selected for anything: is it grounded?
  *   **Yes** → **Leaf E**
  *   **No** → Go to Node 7.

  **Node 7: The Text-Training Case**
  Consider a system trained only on text written by people who could see, which then uses colour words correctly: does it mean 'red'?
  *   **Yes** → Go to Node 8.
  *   **No** → Go to Node 9.

  **Node 8: The Solitary History Case**
  Consider a system with identical training history but existing in a universe with no other speakers: is it grounded?
  *   **Yes** → **Leaf F**
  *   **No** → **Leaf G**

  **Node 9: The Blind Person Case**
  Consider a blind person's competent use of colour words: is their understanding grounded?
  *   **Yes** → **Leaf G**
  *   **No** → **Leaf H**

  ---

  ### Leaf Definitions

  **Leaf A: Holistic Gradualism**
  *   **Position:** Grounding is a matter of degree and a property of whole systems rather than of individual symbols.
  *   **Commitment:** Meaning emerges from the aggregate competence of the system, not from discrete symbol-world pairings.
  *   **Awkward Commitment:** You cannot pinpoint exactly when a system becomes grounded, only that it works better or worse.

  **Leaf B: Inferential Role Semantics**
  *   **Position:** Grounding is unnecessary because meaning is inferential role.
  *   **Commitment:** A symbol's meaning is exhausted by its relationships to other symbols within the system.
  *   **Awkward Commitment:** You must accept that a system completely cut off from the world could still have meaningful thoughts.

  **Leaf C: Dissolutionism**
  *   **Position:** The symbol/non-symbol distinction is the real error, so the problem dissolves once we stop drawing it.
  *   **Commitment:** The demand for "grounding" arises from a false picture of how language and mind actually function.
  *   **Awkward Commitment:** You cannot solve the problem, only convince people to stop asking it.

  **Leaf D: Causal Informationalism**
  *   **Position:** Grounding requires some causal or informational connection to the world, but not specifically a sensorimotor one.
  *   **Commitment:** Reliable correlation between an internal state and an external property is sufficient for representation.
  *   **Awkward Commitment:** You must accept that a thermometer or a tree ring has "meaning" in the same sense as a thought.

  **Leaf E: Sensorimotor Contingency**
  *   **Position:** Grounding requires sensorimotor coupling to the world.
  *   **Commitment:** Meaning arises from the system's capacity to act upon and be affected by the environment in real time.
  *   **Awkward Commitment:** You must deny that a permanently paralyzed human with intact cognition has grounded thoughts.

  **Leaf F: Teleological History**
  *   **Position:** Grounding depends on a symbol's history — its selection, training, or function — rather than on its present connections.
  *   **Commitment:** A state means what it was selected or trained to detect, regardless of current accuracy or community.
  *   **Awkward Commitment:** You must accept that a system could be grounded even if it is the last object in the universe.

  **Leaf G: Social Externalism**
  *   **Position:** A system can be grounded derivatively, by its place in a community of already-grounded speakers.
  *   **Commitment:** Meaning is borrowed from the linguistic community that sustains the usage of the symbols.
  *   **Awkward Commitment:** You must accept that the first human to ever speak could not have had meaningful thoughts.

  **Leaf H: Biological Naturalism**
  *   **Position:** No arrangement of form alone can ever yield meaning.
  *   **Commitment:** Semantic content requires specific biological substrate or conscious experience not replicable by computation.
  *   **Awkward Commitment:** You must accept that we cannot build a genuinely thinking machine, only a simulation of one.

  ---

  ### Analysis of the Instrument

  **Unseparable Leaves**
  This tree cannot separate **Leaf G (Social Externalism)** and **Leaf F (Teleological History)** if the reader answers "Yes" to Node 7 (Text-Training) but refuses to engage with the hypothetical in Node 8 (Solitary History). Both positions agree that the text-trained system is grounded; they disagree on *why* (community vs. history). If a reader asserts the system is grounded but finds the "last thing in the universe" question unintelligible rather than answerable, the tree forces a choice where the reader sees none. Additionally, **Leaf C (Dissolutionism)** and **Leaf B (Inferential Role)** are tightly coupled; a reader who rejects internal rules (Node 4 No) often rejects the framework entirely, but some may hold a pragmatic role theory that isn't fully dissolutionist. The tree treats them as distinct, but in practice, they often overlap.

  **Unoccupied Combinations**
  The combination of **Internalism** (Node 1 Yes) and **Holism** (Node 2 No) leads to Leaf A. However, the combination of **Externalism** (Node 1 No) and **Holism** (Node 3 No) *also* leads to Leaf A. This is not an error but a feature: Holism is treated as a dominant classifier that overrides the Internal/External split. There is, however, an unoccupied space for **Externalist Dissolutionists**. If a reader answers No to Node 1 (Need External) but No to Node 4 (Rules not enough) and No to Node 5 (Correlation not enough), they might conclude the question is wrong (Dissolution) for externalist reasons. The tree forces them down the Externalist path to Sensorimotor or History. This view is unoccupied not because it is incoherent, but because it is unattractive: most who dissolve the problem do so from an Internalist/Pragmatist stance.

  **Most Sorting Question**
  **Node 1 (The Dictionary Case)** does the most sorting work. It establishes the fundamental Internal/External axis. Every subsequent question presupposes an answer to whether internal relations alone can sustain meaning. If a reader answers "Yes," they are confined to the left branch (Internalism), making all questions about causal connection, sensorimotor coupling, or history irrelevant to their position. If they answer "No," they are committed to some form of world-involvement, opening up the entire right branch of the tree. This single intuition determines whether the reader seeks a solution in syntax (Internal) or semantics (External).
