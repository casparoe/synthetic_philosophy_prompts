      *   *Occam's Razor:* This isn't just aesthetic. It's a heuristic for truth. If T and T* predict the same thing, but T* adds baggage, T* is less likely to be true *unless* the baggage does work. Since the baggage does no work, it's noise.
      *   *Bayesian Perspective:* In Bayesian terms, T* might fit the data (Likelihood is equal), but its Prior is tiny. Posterior $\propto$ Likelihood $\times$ Prior. So T wins.
      *   *Practical Advice:*
          *   *Belief:* Believe T is *empirically adequate*. Regarding the ontology (the medium), believe T is the *best explanation*, acknowledging the logical possibility of T* but assigning it negligible probability.
          *   *Reporting:* Report T. Mention T* only in philosophical contexts, not scientific ones.
          *   *Colleagues:* They are rational because they implicitly weight simplicity.
      *   *Nuance:* Distinguish between "trivial" underdetermination (this case) and "serious" underdetermination (e.g., wave vs. particle mechanics in early QM). The latter requires more suspension of judgment.

