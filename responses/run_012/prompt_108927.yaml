      *(Word Count Check)*: Aiming for roughly 130-150 words per minute. 6 minutes = 780-900 words. I will aim for around 850-900 to be safe.

  12. **Final Polish:** Check the emotional arc. Starts solemn, moves to honest analysis, ends on solidarity.

