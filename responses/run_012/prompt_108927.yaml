answer: |-
  Good evening, everyone. Thanks for the meal.

  I know the Plant Manager spoke just before me. He talked about turning the page, about an exciting new chapter for the facility. He's not wrong, exactly. Pages do turn. But for the twenty-two of you sitting at these tables, this isn't a new chapter. It's the end of the book. And I'm not going to stand up here and pretend that doesn't hurt, or that it's supposed to feel like a celebration.

  There's an elephant in the room, and I might as well name it. I'm standing here, and you're leaving. I'm staying on to run the new line. I know some of you might be thinking that makes me part of the machinery now. Maybe it does. But I need you to know I don't stand here because I'm better than you, or because I worked harder. I'm standing here because of luck, and because of a role I took on years ago. I'm not your replacement. I'm just the one who has to stay behind to mind the thing that replaced you.

  And I know what that thing is. The Manager called it a tool. He said it's just equipment to help us work smarter. I can't say that. We know the truth. The old line, the one we're shutting down tonight, that was ours. We set the pace. If you needed a minute to breathe, you took it, and you made it up later. The new line… the new line sets the pace. It runs to a cycle time. You can pause it, sure, but if you do, forty people turn around and stare. The silence gets heavy. The machine doesn't get tired, it doesn't need a break, and it doesn't care if your back hurts. It's not a tool anymore. It's a supervisor made of steel.

  But I also can't stand here and call it the enemy. Terry's in the room—Terry on days. He helped build the new line. He's a decent man, a good union brother. If that machine was run by us, for us, if we owned the time it saved, Terry's machine could give us a three-day week with full pay. It could make life easier. The metal itself isn't wicked. The code isn't evil.

  So where's the fault lie? If the machine isn't the enemy, and you aren't the problem, why are you leaving?

  It comes down to a decision. Not the decision to build, but the decision to buy. There's a difference between a machine that helps a worker, and a machine that replaces one. The first Luddites, the ones people joke about smashing things—they didn't hate technology. They knew how to weave. They hated that the technology was being used to cut wages and starve families. They knew that a machine isn't just what it does; it's who it does it for.

  Tonight, the machine isn't taking your jobs. The decision to buy it did. The decision was made in a quiet office, looking at a spreadsheet, where the cost of the machine was less than the cost of twenty-two night-shift wages. That's the truth of it. The machine is just the method. The choice is the cause.

  I know I can't change that decision. I'm the steward, not the owner. But I can tell you what that decision doesn't change. It doesn't change your worth. It doesn't change the fact that this plant ran because you showed up, night after night, in the dark, while the rest of the city slept. You kept the flow. You fixed the jams. You made the numbers the Manager talked about earlier. The line might be new, but the skill you have—the grit, the knowledge, the ability to keep going when things grind—that doesn't expire at midnight on the 30th.

  I'm going to be running that new line. I want you to know I won't forget who built the foundation I'm standing on. And I won't pretend it's something it's not. I'll be there to make sure the people who stay are treated right, and I'll be here to make sure the people who leave get what they're owed.

  So, I'm not going to wish you luck in the future, because luck implies this was random. It wasn't. And I'm not going to say it'll be all right, because I don't know that yet. But I will say this: You are not obsolete. A job can be erased. A shift can be cancelled. But you cannot be replaced.

  Raise a glass with me. To the night shift. To the work we did, and the people who did it.

  Cheers.
