      *   The Terry reference is crucial to nuance the "machine as enemy" point.
      *   The "decision" point needs to be clear but not sound like a lecture.
      *   Word count check: 900 words is about 6 minutes at a moderate pace. Need to ensure it's not too short.

  6.  **Refining the "Marx" element:**
      *   *Constraint:* No quotes, no name drops.
      *   *Concept:* Machinery vs. Machinery as Capital.
      *   *Translation:* The machine itself is just metal and code. It becomes a weapon when it's used to cut costs instead of help work. The Luddites didn't hate tech; they hated the use of tech to starve them.
      *   *Phrasing:* "It's not the steel that's the problem. It's the ledger." "The difference between a thing that helps you lift, and a thing that lifts you out."

  7.  **Addressing the "Staying On" Guilt:**
      *   Must be honest. "I'm standing here, you're sitting there."
      *   "I'm not better than you."
      *   "I'm just the one who stays to mind the new beast."

  8.  **Addressing the Manager:**
