      *   **Constraints:** ~6 minutes (approx. 900 words). Tone must be "true."
      *   **Key Tensions:**
          *   Can't say machines are just tools (manager's lie).
          *   Can't say machines are the enemy (Terry built them, they could be good under different ownership/conditions).
          *   Can't explicitly blame ownership/capital in a way that sounds like a slogan/badge (too academic/aggressive for the room).
          *   Must acknowledge the speaker is staying while others leave (awkward).
          *   Must comfort the laid-off workers without dismissing their loss.
          *   Must keep peace with the manager present.
          *   **Intellectual Core:** Use the Marxian distinction (machinery vs. machinery as capital) without naming Marx or quoting him. Focus on the *decision* to buy, not the machine itself.
      *   **Goal:** Land somewhere usable, not just sad.

  2.  **Determine the Tone:**
      *   Grounded, working-class, honest, respectful.
      *   Not overly polished or corporate.
      *   Empathetic but firm on the reality.
      *   Avoids academic jargon but conveys the structural truth.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the room, the occasion, and the manager's previous speech. Validate the feeling in the room without being confrontational.
      *   **The Awkward Truth (Staying vs. Leaving):** Address the elephant in the room. The speaker is staying. Why? Not because they are better, but because of luck/role. Acknowledge the guilt/discomfort.
      *   **The Machine (The Core Argument):** Address the technology. Avoid "tools" vs. "enemy." Focus on *control*. The old line had pace; the new line sets the pace.
      *   **The Decision (The "Why"):** Shift blame from the metal to the choice. Without naming names/theory, explain that the machine isn't the problem, it's how it's used/owned. Connect to Terry (the builder).
      *   **The People (The Value):** Reaffirm the worth of the workers. The line stops without them (even the new one needs them), but their specific roles are being erased.
      *   **Closing:** Look forward. Not "everything will be fine," but "you are still you." Solidarity. A toast.

  4.  **Drafting - Iteration 1 (Mental Outline & Key Phrases):**
      *   Start: Thanks for the meal. Manager talked about the future. I know what you're thinking.
      *   Middle: I'm staying. You're going. That hurts. I know the new line. It's fast. It's not a tool, it's a boss. But Terry built it. He's good. So the metal isn't bad. It's who decides when it runs.
      *   Marx bit (implicit): It's not the hammer, it's who holds it. But deeper: it's the decision to use the hammer to break the wall instead of build a house.
      *   End: You aren't obsolete. The job is. Take care of each other.

  5.  **Drafting - Iteration 2 (Fleshing out the voice):**
      *   Need to sound like a shop steward. Direct. No fluff.
