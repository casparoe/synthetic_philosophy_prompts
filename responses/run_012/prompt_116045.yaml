answer: |-
  1. **Phenomenon Status:** Consider the **candidate who has not revised and cannot name a reason for confidence**. Is this state a distinct irrational phenomenon, or merely ordinary error?
     - Distinct → 2
     - Ordinary Error → 9

  2. **Intention:** Consider the **spouse who does not register what everyone else has noticed**. Did the subject *intend* to bring about this ignorance?
     - Yes → 3
     - No → 6

  3. **Division of Mind:** To execute this intention, is the division required between **two quasi-agents** or between **sub-personal systems that differ only in what they can access**?
     - Quasi-agents → Leaf (a)
     - Sub-personal → 4

  4. **Pretense:** Consider the **parent who will not accept a diagnosis**. Does the subject actually *believe* the child is healthy, or only *avow and act as if* they do?
     - Avow/Act → Leaf (c)
     - Believe → 5

  5. **Contradiction:** Consider the **jealous partner who finds confirmation everywhere**. Does the subject simultaneously hold the belief that the partner is faithful and unfaithful?
     - Yes → Leaf (d)
     - No → Leaf (a)

  6. **Motivation:** Consider the **hypochondriac**. Is the bias caused by *motivation* (fear/desire) or *cold cognitive habit*?
     - Motivation → 7
     - Cold Habit → 9

  7. **Belief Status:** Consider the **parent who will not accept a diagnosis**. Does motivation cause the subject to *believe a falsehood*, or only to *avoid acquiring the truth*?
     - Believe Falsehood → 8
     - Avoid Truth → Leaf (b)

  8. **Negative Case:** Consider the **candidate who believes they will fail despite no evidence**. Can this account explain believing *worse* than evidence supports, or only *better*?
     - Worse or Better → Leaf (d)
     - Only Better → Leaf (e)

  9. **Redescription:** Can this case be fully redescribed as **wishful thinking or weakness** without loss?
     - Yes → 10
     - No → Leaf (e)

  10. **Eliminativism:** Is the term "self-deception" itself the source of the puzzle?
      - Yes → Leaf (f)
      - No → Leaf (e)

  ***

  **Leaves**

  **(a) Intentionalist Partitioning:** Self-deception is intentional deception of one part of the mind by another.
  *Awkward Commitment:* It requires positing homunculi with full rational capacities within a single subject.

  **(b) Motivational Dynamic:** Desire biases evidence gathering so the subject never forms the unwelcome belief.
  *Awkward Commitment:* It struggles to explain cases where the subject explicitly asserts the false proposition as known fact.

  **(c) Pretense:** The subject never believes the comforting proposition but asserts it to manage social or emotional costs.
  *Awkward Commitment:* It denies the phenomenological reality that the self-deceived often feel genuine conviction.

  **(d) Contradictory Beliefs:** The subject simultaneously holds logically inconsistent beliefs partitioned by access or context.
  *Awkward Commitment:* It requires abandoning the norm that belief aims at consistency and truth.

  **(e) Deflationary:** The phenomenon is real but is merely wishful thinking, fear, or ordinary weakness of will.
  *Awkward Commitment:* It cannot explain negative self-deception (believing worse than evidence supports) without ad hoc adjustments.

  **(f) Eliminativism:** There is no such phenomenon; the term names a confusion about ordinary irrationality.
  *Awkward Commitment:* It must dismiss the persistent intuition that self-deception is distinct from simple mistake.

  ***

  **Analysis of the Instrument**

  **Foundering Leaves:** Leaf (e) founders on the **candidate who believes they will fail despite no evidence**. Deflationary accounts typically rely on "wishful thinking" (desire for $p$ causes belief in $p$), which cannot explain "fearful thinking" (desire for $\neg p$ causes belief in $p$) without losing its explanatory simplicity. Leaf (b) also risks foundering here if the mechanism relies solely on desire for comfort.

  **Unoccupied Combinations:** The path **Intentional + Sub-personal + Believe + No Contradiction** (Node 5 "No") leads to Leaf (a), but this combination is rarely occupied as a distinct position. It implies successful intentional self-deception where the intention vanishes without a trace of conflict; most philosophers find this psychologically unstable and either posit remaining conflict (Leaf d) or full division (Leaf a).

  **Inseparable Leaves:** The tree cannot strictly separate Leaf (a) and Leaf (d) in all interpretations. Some "Partitioning" accounts (a) inherently rely on "Contradictory Beliefs" (d) existing in separate subsystems. The distinction rests on whether the *intention* is preserved (a) or dropped in favor of a mechanical conflict (d), but in practice, the structural description of the mind is often identical.

  **Node Diagnostics:** Node 3 is the required division node. Node 8 tests the limits of motivational accounts. Node 10 isolates the eliminativist who sees the label itself as the error.
