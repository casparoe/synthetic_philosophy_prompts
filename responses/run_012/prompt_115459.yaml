          *   *Claim:* It improves on Boorse because statistical normality is a "convention" while fitness is "objective." (Problematic. Boorse *also* claims objectivity. The distinction between "statistical typicality" and "fitness" isn't necessarily an improvement in terms of objectivity; both are naturalistic. In fact, fitness is often harder to measure than physiological function. Also, Boorse's "reference class" is meant to handle age/sex/environment, similar to the fitness criterion.)
