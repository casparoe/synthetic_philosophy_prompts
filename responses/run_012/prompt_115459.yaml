      *Final check on Wakefield:* Wakefield's "Harmful Dysfunction." Dysfunction = Naturalist (failure of mechanism to perform designed function). Harm = Normativist (value judgment that the dysfunction is bad). The student says "Harm component means the whole thing collapses into a social judgment." This ignores the 'Dysfunction' constraint. It's a significant error.

