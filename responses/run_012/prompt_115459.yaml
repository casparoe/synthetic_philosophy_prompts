          *   *Claim:* Normativist objection = disease involves value judgment. (Correct).
          *   *Claim:* Fitness criterion answers this because it makes no value judgment. (Incorrect. Merely *claiming* to be value-free doesn't answer the objection that selecting 'fitness' as the metric *is* a value judgment. Why is reproductive output the goal? This is the Naturalist Fallacy.)
          *   *Claim:* Wakefield's harmful dysfunction is normativist in disguise. (Incorrect. Wakefield is a Hybrid theorist. The 'dysfunction' is naturalist, the 'harm' is normativist. Calling it "normativist in disguise" misunderstands Wakefield's specific contribution to bridging the gap.)
