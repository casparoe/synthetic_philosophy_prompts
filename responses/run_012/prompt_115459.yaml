          *   *Baldness:* Classifies as non-disease. Reason: Doesn't lower fitness. (Debatable empirically—does baldness actually have *zero* impact on fitness? In modern environments, probably negligible. In evolutionary environments, maybe signaling? But for the sake of the exercise, acceptable).
          *   *Same-sex orientation:* Classifies as **disease**. Reason: Lowers reproductive output. (This is the critical failure point. While logically consistent with the *strict* definition provided in the prompt, in the context of Philosophy of Medicine, classifying homosexuality as a disease is widely regarded as a *reductio ad absurdum* of naturalist accounts (specifically referencing the historical removal of homosexuality from the DSM). A good student should recognize this as a *counter-example* or a major flaw, not a virtue ("shows the criterion is at least consistent"). The prompt asks to "Apply it," but a critical analysis usually expects the student to note the implausibility of the result.)
          *   *Verdict:* Logically consistent application, but fails to recognize the normative disaster of the homosexuality classification. This is a major philosophical blind spot for a 2nd-year unit.

