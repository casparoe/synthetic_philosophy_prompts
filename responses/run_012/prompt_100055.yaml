      *Refining the "Reconciliation" logic:* Is it a relabeling? Yes, because it sidesteps the unity of virtue. If justice is a virtue, and virtue requires right reason and right end, then a transaction with a wrong end cannot be fully just.

      *Refining the "Money" logic:* Money is conventional (*nomos*). Need is natural (*physis*). If money replaces need as the end, *nomos* overrides *physis*. This destabilizes the measure.

