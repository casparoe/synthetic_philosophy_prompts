      **Scenario:**
      In the Athenian agora, Lysander purchases ten measures of grain from Nikostratos for fifty drachmas, a price determined by the customary ratio of labor to need that ensures neither party is deprived nor enriched at the other's expense, with full transparency regarding weight and quality. Nikostratos receives the coin to buy tools for his farm, and Lysander takes the grain to resell it in a neighboring deme. The exchange is perfectly reciprocal: the money bridges the disparity between grain and labor, satisfying the requirement that equals be exchanged for equals relative to demand. However, Lysander does not intend to use the profit to procure specific goods required for his household's sustenance or civic participation; instead, he intends to reinvest the proceeds into more grain solely to increase his stock of currency, pursuing the accumulation of wealth without limit regardless of whether his household's natural needs are already met.

      **Analysis:**
      1.  **Verdicts:**
          *   V1 (Justice in Exchange): **Just.** The criterion is proportional reciprocity based on need (*chreia*). Since the price reflects the customary ratio of labor and demand, and no deception occurred, the transaction equalizes the parties. The money serves its conventional function as a measure of value, ensuring the grain and coin are commensurable.
          *   V2 (Household vs. Wealth): **Condemned.** The criterion is the telos of acquisition. Since Lysander's end is the unlimited accumulation of money (*chrematistics*) rather than the provisioning of the household (*oikonomia*), the activity is contrary to nature. Even if the transaction is fair, the activity serves an unnatural end.
      2.  **Feature/Unit:**
          *   Feature: The **telos (end goal)** of the acquirer.
          *   Unit of Assessment: V1 operates on the **atomic transaction** (the moment of exchange). V2 operates on the **teleological chain** (the purpose of the activity within a life).
