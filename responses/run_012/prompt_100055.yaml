answer: |-
  In the Athenian agora, Lysander purchases ten measures of grain from Nikostratos for fifty drachmas, a price determined by the customary ratio of labor to need that ensures neither party is deprived nor enriched at the other's expense, with full transparency regarding weight and quality. Nikostratos receives the coin to buy tools for his farm, and Lysander takes the grain to resell it in a neighboring deme. The exchange is perfectly reciprocal: the money bridges the disparity between grain and labor, satisfying the requirement that equals be exchanged for equals relative to demand. However, Lysander does not intend to use the profit to procure specific goods required for his household's sustenance or civic participation; instead, he intends to reinvest the proceeds into more grain solely to increase his stock of currency, pursuing the accumulation of wealth without limit regardless of whether his household's natural needs are already met.

  (1) **Verdicts:** V1 verdicts the transaction **just** because it satisfies the criterion of proportional reciprocity: the quantity of money equals the value of the grain relative to the parties' demand (*chreia*), ensuring no loss or gain at the other's expense. The measure is met, so the exchange is fair. V2 verdicts the activity **condemned** because it violates the criterion of natural teleology: acquisition is aimed at unlimited money (*chrematistics*) rather than limited household provisioning (*oikonomia*). Since the end is unnatural, the activity is contrary to nature, regardless of the fairness of the individual trade.

  (2) **Feature and Unit:** The feature doing the work is the **telos (end goal)** of the acquirer. V1 operates on the unit of the **atomic transaction**, assessing the proportionality of the exchange at the moment it occurs. V2 operates on the unit of the **life-activity**, assessing the purpose of the acquisition within the broader context of human flourishing and household limits.

  (3) **Removal:** If we remove the *telos* variable by stipulating Lysander buys the grain to feed his family, the two accounts collapse into agreement: the exchange is both just (proportional) and natural (provisioning). This reveals that V1 was silently borrowing from V2. V1's concept of "proportionality" relies on "need" as the real measure; however, "need" is defined by the natural limits of the household established in V2. Without V2's ontology of natural limits, V1's proportionality lacks a stable anchor.

  (4) **Reconciliation:** A sympathetic Aristotelian would argue there is no contradiction because the accounts answer different questions: V1 addresses corrective justice between citizens, while V2 addresses virtue ethics and the good life. Thus, a transaction can be locally fair even if the life pursuing it is vicious. This reconciliation **merely relabels the problem**. For Aristotle, virtue is unified; an act cannot be fully "just" if it stems from a vicious end. By separating transactional fairness from moral purpose, the reconciliation exposes a fracture in his ethics where a vice (greed) can produce a virtue (justice) in isolation, undermining the coherence of his moral psychology.

  (5) **Money and Measure:** The case exposes that money as a **conventional measure** is unstable when detached from need. Proportional reciprocity requires a stable standard to determine "equals," which Aristotle identifies as need. Money is only a stand-in for need. When money is pursued for its own sake, it becomes an unbounded standard, as currency has no natural limit. This undermines the stability that proportional reciprocity requires, transforming justice from a moral equilibrium based on human necessity into a mathematical formality that can serve unlimited, unnatural ends.
