  *(Self-Correction on Malcolm)*: Be careful not to misrepresent Malcolm. He doesn't say dreams don't exist; he says the *grammar* of "having an experience while asleep" is flawed. The film fixes this grammar by making sleep a state of consciousness. I need to highlight that the film *changes the definition* to make the philosophy work.

