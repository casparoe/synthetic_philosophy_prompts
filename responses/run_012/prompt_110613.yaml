answer: |-
  This is a classic problem in the philosophy of science: you are oscillating between the **No-Miracles Argument** (success implies truth, which supports believing in the ether/caloric) and the **Pessimistic Meta-Induction** (past success implies future falsity, which supports skepticism about quarks/neutrinos). Your gut, however, is more nuanced than either. You are effectively a **Selective Realist**, but you need a selection criterion that isn't just "wait and see what the next century says."

  Based on your verdicts, here is the principle that best captures your intuition, followed by the necessary sacrifice and the application to your new cases.

  ### The Principle: Consilient Causal Role Realism

  You are entitled to believe a theoretical entity $E$ is real if and only if:

  1.  **Causal Indispensability:** $E$ is posited as the unique bearer of a causal role $R$ required to save the phenomena (e.g., conserving energy, explaining discrete ratios, curving trajectories).
  2.  **Cross-Domain Consilience:** The necessity of $R$ is demonstrated across **independent** domains of inquiry, not merely within the internal coherence of a single theory.
  3.  **Role Retention:** Subsequent theoretical changes may alter the *ontology* of $E$ (what it *is*), but must retain the *causal role* $R$ (what it *does*).

  **Why this fits your data:**
  *   **Clause 1 (Causal Indispensability)** does the work for **Neutrinos** and **Quarks**. Neutrinos weren't just "useful"; without them, energy conservation (a pillar of all physics) failed. Quarks weren't just "neat"; without them, scattering data and hadron classification collapsed. This distinguishes them from **Phlogiston**, where the causal role (flammability) could be re-described (oxidation) without breaking chemistry.
  *   **Clause 2 (Cross-Domain Consilience)** does the work for **Atoms** and **Electrons**. Atoms were needed for *both* chemistry (stoichiometry) *and* physics (Brownian motion/thermodynamics). **Ether** fails here: it was indispensable for Optics, but its removal (via Relativity/EM fields) did not break Mechanics or Thermodynamics. It was a single-domain posit.
  *   **Clause 3 (Role Retention)** does the work for **Electrons** vs. **Caloric**. The electron changed from a sphere to a field excitation, but its role (bearer of unit charge/mass) remained. Caloric's role (fluid of heat) was not retained; it was eliminated in favor of kinetic energy. This also justifies **Newtonian Mass**: its role as a source of gravity/inertia is retained in GR as a limit, so it counts as "approximately real."

  ### The Hindsight Objection and the Necessary Sacrifice

  You worried that this looks like hindsight ("nobody at the time... could have known"). The defense is that **Cross-Domain Consilience** is detectable *in the moment*. When Pauli proposed the neutrino, he wasn't just fixing beta decay; he was appealing to conservation laws that governed *all* of physics. When Wegener proposed **Continental Drift**, he had consilience (biology, geography, geology), but he lacked *Causal Indispensability* (no mechanism for movement).

  However, to make this principle coherent, you must surrender one verdict. The outlier is **Genes**.

  **The Verdict to Surrender: Genes**
  You wrote: *"Genes, in the sense of the early factors of heredity: real, even though the modern notion has since fragmented into half a dozen different things."*

  **Why you must give this up:**
  Under **Consilient Causal Role Realism**, the "gene" is in trouble. The early "factor of heredity" posited a discrete, stable unit that maps 1:1 to a trait or function. Modern biology has shown that this specific *causal role* is not retained. We now have regulatory networks, epigenetic markers, and overlapping transcription units. The "discrete unit" role is being re-described away, much like Caloric was.
  *   **Electron:** Nature changed (sphere $\to$ excitation), but the *unit of charge* role stayed fixed.
  *   **Gene:** Nature changed (bead $\to$ DNA), and the *discrete unit* role is dissolving into systems biology.

  If you keep the Electron verdict (real despite ontological shift) but reject Caloric (unreal despite predictive success), you must admit that the Gene is more like Caloric than the Electron. The "gene" is a useful instrumental posit for tracking heredity, but likely not a fundamental "real" entity in the way an electron is. **To keep your principle, you must become an instrumentalist about the gene.**

  ### Application to New Cases

  Here is how **Consilient Causal Role Realism** handles your flip-flopping cases.

  #### 1. Dark Matter
  **Verdict:** **Real.**
  *   **Analysis:** Dark Matter posits a causal role: *source of gravitational mass without electromagnetic interaction*.
  *   **Indispensability:** Without it, galactic rotation curves, gravitational lensing, and the Cosmic Microwave Background (CMB) power spectrum cannot be simultaneously fit.
  *   **Consilience:** This is the key. Dark Matter is not just fixing one theory (like Ether fixing Optics). It is required to make **Cosmology**, **Galactic Dynamics**, and **Structure Formation** consistent with one another. Removing it requires breaking the link between gravity and mass across multiple independent domains.
  *   **Comparison to Ether:** The Ether was a medium *within* space to explain light propagation. Dark Matter is a mass source *in* space to explain gravity. We have found other mass sources (baryons); we have never found a non-mass source of gravity. The causal role is robust.
  *   **Conclusion:** Your "obviously believe in it" gut is correct. It is not "our century's ether" because the ether was a single-domain mechanism, whereas Dark Matter is a cross-domain constraint.

  #### 2. The Wavefunction ($\Psi$)
  **Verdict:** **Agnostic / Instrumentalist.**
  *   **Analysis:** The wavefunction posits a causal role: *determines the probability amplitude of measurement outcomes*.
  *   **Indispensability:** It is indispensable for calculation.
  *   **Consilience:** Here is the failure point. We do not have agreement on what causal role $\Psi$ plays in *reality*. Does it collapse (GRW)? Does it branch (Many Worlds)? Is it epistemic (QBism)?
  *   **Role Retention:** We cannot yet determine if the *mathematical structure* of $\Psi$ corresponds to a physical entity or a tool for managing information. Unlike the Electron (where we agree it carries charge), we do not agree on what the Wavefunction *does* other than predict observations.
  *   **Conclusion:** Your suspicion that this is a "different kind of case" is correct. Under this principle, you are not yet entitled to believe the Wavefunction is "real" in the same sense as the Quark. It currently functions more like **Caloric**: a mathematical fluid that predicts flow (probability) perfectly, but whose ontological status (is it a field? is it knowledge?) remains unresolved and contested across interpretations.

  ### Summary
  Your gut is tracking **Consilient Causal Role Realism**. You believe in entities that do specific causal work across multiple domains, and you forgive them for changing their "shape" as long as they keep doing that work.

  *   **Keep:** Neutrinos, Quarks, Electrons, Atoms, Dark Matter.
  *   **Keep (Approximate):** Newtonian Mass.
  *   **Reject:** Ether, Caloric, Phlogiston, Miasma.
  *   **Surrender:** The realism of **Genes** (treat as instrumental).
  *   **Withhold:** The **Wavefunction** (until the measurement problem resolves its causal role).

  This resolves your anxiety about hindsight: you aren't waiting to see if they survive; you are checking if they are currently holding up the roof in more than one room of the house of physics.
