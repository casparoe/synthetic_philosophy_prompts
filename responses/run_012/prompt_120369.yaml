answer: |-
  Friends, family, colleagues.

  For forty years, she taught us that moral language isn't a mirror. When we say something is "good" or "wrong," she taught us, we aren't describing the furniture of the universe. We are taking a stand. We are doing something more like cheering, or booing. She taught me that in my second year, and I have never forgotten it.

  But knowing that words are actions doesn't make them light. It makes them heavy. Because if moral talk isn't about reporting facts, it is about committing yourself. It is about planting your feet and saying, *this is where I stand.*

  We are here to honor where she stood.

  In her last years, she spent her Tuesday nights at the county jail. She taught there. She listened there. And yes, she spent money on that work that her family hoped would stay at home. Her brother will speak soon about the cost of that choice. I know the pain that caused. I know the nieces who loved her felt the loss of that security. Grief makes us count what is missing.

  But I am standing here as her student to say this: I cannot accept the claim that she was wrong to spend it.

  If we say that choice was wrong, we are saying that her commitment to those prisoners mattered less than the security of her savings. And I am not willing to say that. To call her choice wrong is to misunderstand the whole point of her life. She believed that value isn't found; it is made. It is made by showing up. It is made by spending yourself, even when it costs you.

  So, I know this sounds like I am stating a fact. I know some of her colleagues might tell you that saying "she was right" implies there is a moral truth out there for her to have found. She spent her life arguing there isn't. But she also taught us that we must speak our commitments loudly. Quasi-realism allows us to say "this is right" not because it matches the world, but because we are willing to fight for it.

  So I will fight for this. She was right. Not because the universe told her so, but because she decided it was so, and she lived it until the end.

  We honor her not by agreeing with her theories, but by matching her stance. When you leave here today, you will have to decide what you boo, and what you cheer. She made her choice. I intend to stand with her.

  Thank you.

  ***

  **Note on the Philosophy**

  I chose to write this from a **Quasi-Realist** position (specifically a Blackburn-style expressivism). This allows you to use realist-sounding language ("She was right," "I cannot accept the claim") without metaphysically committing to moral facts. This honors her life's work while giving the family the definitive defense they need.

  **Regarding the buried sentences:**
  1.  **The Conditional (If/Then):** You worried about saying, "If it was wrong for her to do that then the rest of us were wrong." I sidestepped the conditional guilt. Instead, I framed the negation as a refusal of attitude: "I am not willing to say that." This avoids embedding the moral claim in a logical operator that triggers the Frege-Geach problem, while still rejecting the brother's premise.
  2.  **The Negation (Not True):** You worried about saying, "It isn't true that she was wrong." In the speech, I used "I cannot accept the claim that she was wrong." This shifts the locus from the *truth of the proposition* to *your attitude toward the claim*. However, I then immediately pivoted to "She was right."

  **Where colleagues might fight:**
  Hardline expressivists might argue that saying "She was right" without qualification smuggles in realism. They might prefer "I strongly approve of what she did." However, Quasi-Realists argue that to be taken seriously in public discourse (especially a eulogy), you must earn the right to use truth-apt language. I leaned into that earned right. I explicitly flagged the tension in the speech ("I know this sounds like I am stating a fact... She spent her life arguing there isn't") to own the upgrade. This satisfies the students (who know the move) and the family (who hear the defense).
