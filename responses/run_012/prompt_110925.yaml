  For the **leeway incompatibilist**, rejecting (5) costs the Principle of Alternative Possibilities (PAP). They typically block the argument at (3) or (4). By accepting (4) but rejecting (5), they concede Frankfurt cases refute PAP. Their burden shifts from defending alternative possibilities to explaining why deterministic sequences lack ownership—a harder battle against compatibilists who claim such sequences can be owned.

  For the **source incompatibilist**, rejecting (5) costs the assumption that all deterministic sequences are metaphysically equivalent regarding responsibility. They must explain why the Frankfurt actual sequence (where the agent decides unaided) grounds responsibility while the ordinary deterministic sequence does not, even if both are determined. This requires a robust, non-question-begging account of ultimate sourcehood that survives the Frankfurt intuition without conceding that determinism is compatible with responsibility.

  For the **compatibilist**, rejecting (5) costs theoretical simplicity. They cannot rely solely on the absence of interveners. They must provide a positive account of how deterministic sequences can be "owned" (e.g., via reasons-responsiveness) to distinguish normal agency from brainwashing. They must show determinism doesn't make sequences "indifferent to the agent," preserving the intuition behind (1) without requiring indeterminism.
