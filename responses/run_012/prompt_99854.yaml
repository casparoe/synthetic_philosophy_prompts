  **The Case of Mr. Henderson's Bonus**

  Mr. Henderson is a senior partner at a mid-sized consultancy firm, working in an open-plan office alongside five junior analysts. The firm has a discretionary budget of £10,000 to allocate as a one-off welfare bonus. Psychometric testing reveals an anomalous but natural fact about Mr. Henderson: due to a rare neural sensitivity, every pound he receives generates ten units of welfare, whereas each pound given to the juniors generates only one unit. However, the juniors are currently struggling financially, operating at a welfare baseline of 20 units, while Mr. Henderson, being wealthy, sits at a baseline of 200 units. The manager must choose between three mutually exclusive options: (A) give the entire £10,000 to Mr. Henderson; (B) split the £10,000 equally among the five juniors; or (C) retain the budget (status quo). All other variables, including staff numbers and baseline costs, remain fixed.

  **Analysis**

  Classical total-utility act utilitarianism mandates Option A. It sums welfare gains irrespective of distribution; Henderson's gain (£10,000 × 10 = 100,000 units) vastly outweighs the juniors' collective gain (£10,000 × 1 = 10,000 units). Average utilitarianism, however, lands on Option B. Because Henderson's baseline is already high, his massive gain skews the total but raises the *mean* welfare per employee less effectively than lifting the five juniors from their low baseline, thereby maximising the average utility across the six-person team. Prioritarianism also rejects Option A, but lands on a distinct verdict: it favours Option B even more strongly than average utilitarianism, or potentially a weighted split, because it applies a moral weight to benefits conferred on the worse-off; the juniors' low baseline gives their gains greater moral value than Henderson's, regardless of the raw utility sum.

  The structural feature carrying the case is the **weighting function applied to utility**. Total utilitarianism weights all units equally (linear aggregation). Average utilitarianism weights units by their contribution to the mean (divisive aggregation). Prioritarianism weights units by the recipient's baseline level (concave transformation). When you strip out the weighting function—treating all utility as identical regardless of source or recipient—only the total sum matters, and the 'monster' always wins. The strongest reply open to a utilitarian is to deny the empirical plausibility of the case: they may argue that such extreme marginal utility differences are impossible in ordinary psychology without implying hidden costs (e.g., resentment from juniors) that would negate Henderson's gain in a real-world calculus, thus dissolving the counterexample without abandoning the theory.
