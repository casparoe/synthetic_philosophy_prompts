      *   The paradox states that if markets are perfectly informationally efficient, no one has an incentive to gather information (since prices already reflect it), but if no one gathers information, prices cannot be efficient.
      *   The resolution involves noise traders and limited arbitrage capacity. Prices aren't *perfectly* efficient; they are efficient enough to deter most arbitrage but inefficient enough to reward informed traders.
      *   Price movement happens because market makers adjust to the *probability* that the trader is informed, not because the trade itself changes the fundamental reality.

