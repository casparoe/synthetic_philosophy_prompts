  Ok so I've been messing around in prediction markets and sports betting for a while and somthing's been bugging me. The story everyone tells is that the price already has everybody's information baked in, so if I think a thing is underpriced I'm probably just wrong — the other guy knows something I don't, and that's exactly why nobody who actually has real info should be willing to take the other side of my bet (I gather that's some sort of formal result somewhere). Fine. But then here's the thing: when I actually place the bet, the price moves. If the price already contained everything, my little bet shouldn't move it. And if nobody should ever want to trade on private info because the price already reflects it, then where does the information in the price come from in the first place? It feels like the market can only be smart if it's dumb enough to reward the people doing the digging, but as soon as it rewards them it stops being dumb enough to be worth digging, so... is there a name for this specific bind, or is it just a sloppy version of the no-trade thing? I don't want a label though, I want the actual shape of it: what's the closest established idea, where exactly does my version come apart from it, and is there even a clean way to state the tension, or does it quietly dissolve once you're being careful?

  Keep the whole answer to one paragraph, 200 words max.
