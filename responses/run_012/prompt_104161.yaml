      *   "Weight" ($w$) is the amount of evidence. Low weight = high uncertainty.
      *   Does low weight make probability non-existent? No, but it makes the relation less secure.
      *   Does Keynes's practice look incoherent? He invested personally (often successfully, sometimes not). He used probabilities in some contexts but warned against spurious precision in others.

  6.  **Addressing the Friend's Usage (Investment Context):**
      *   Most people invoking "Keynesian Uncertainty" in finance mean Claim 3 or 4.
