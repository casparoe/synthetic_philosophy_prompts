answer: |-
  This is a classic dispute in the philosophy of economics, and you are correct that the rhetorical force of the line depends entirely on which metaphysical or epistemological claim is being smuggled in. The quote usually referenced is from Keynes's 1937 *Quarterly Journal of Economics* article ("The General Theory of Employment"), where he writes: *"About these matters there is no scientific basis on which to form any calculable probability whatever. We simply do not know."*

  To resolve the dispute in your reading group, we need to disentangle the logical possibilities. Below is a menu of five distinct claims that this line could be making, ordered from the trivial to the radical.

  ### The Menu of Claims

  #### 1. The Evidential Scarcity Claim
  *   **The Claim:** For long-term infrastructure projects, the relevant evidence base is so thin that any specific numerical probability assigned would have a massive margin of error.
  *   **Classification:** **Platitude.**
  *   **Dimensions:**
      *   *Source:* Epistemic (lack of data).
      *   *Status of Probability:* Exists and is measurable, but precision is low.
      *   *Decision Rule:* Expected Value (EV) still applies, but inputs are "fuzzy."
      *   *Upshot:* Very wide error bars; sensitivity analysis required.
  *   **Licenses Refusal to Quantify?** **No.** It licenses refusing to *rely* on the number, but not refusing to *produce* one. You can still say "5% ± 4%."
  *   **Keynes Consistency:** Consistent with Keynes's concept of low **Weight of Argument** (see below).

  #### 2. The Non-Numerical Probability Claim
  *   **The Claim:** Probability is a logical relation between evidence and hypothesis. While some relations are numerical (like dice), others are inherently non-numerical and cannot be reduced to a scalar without distortion.
  *   **Classification:** **Substantive and Defensible** (This is the technical thesis of Keynes's *A Treatise on Probability*).
  *   **Dimensions:**
      *   *Source:* Epistemic/Logical (structure of the relation).
      *   *Status of Probability:* Exists but is not numerically measurable.
      *   *Decision Rule:* EV maximization is mathematically impossible if probabilities are non-numeric.
      *   *Upshot:* Reliance on ordinal rankings or "gut feel" constrained by logic.
  *   **Licenses Refusal to Quantify?** **Yes.** If the probability relation is inherently non-numeric, assigning a number is a category error, not just an approximation.
  *   **Keynes Consistency:** Highly consistent. Keynes explicitly argued that many probabilities are non-comparable and non-numerical.

  #### 3. The Decision-Rule Breakdown Claim
  *   **The Claim:** Even if an agent *could* form a subjective degree of belief (a credence), it is irrational to maximize Expected Value when the "weight" of evidence is low. The rational response to radical uncertainty is not calculation, but convention, liquidity preference, or rules of thumb.
  *   **Classification:** **Substantive and Defensible** (This is the core of *The General Theory*).
  *   **Dimensions:**
      *   *Source:* Epistemic (confidence in the belief).
      *   *Status of Probability:* Credences may exist, but they are not "reliable."
      *   *Decision Rule:* EV maximization is rejected in favor of heuristics.
      *   *Upshot:* Reliance on convention (assuming the future will be like the past) or liquidity (holding cash to keep options open).
  *   **Licenses Refusal to Quantify?** **Yes, pragmatically.** You refuse to quantify because the quantification would drive a decision rule (EV) that is known to be unsafe in this domain.
  *   **Keynes Consistency:** Consistent. Keynes argued that in the face of uncertainty, we fall back on the assumption that the present is a better guide to the future than it actually is.

  #### 4. The Ontological Indeterminism Claim
  *   **The Claim:** The future returns of a 30-year project do not constitute a "fact of the matter" waiting to be discovered. The economic future is created by human decisions that have not yet been made; therefore, no probability distribution exists, even in principle.
  *   **Classification:** **Radical / Controversial** (Associated with G.L.S. Shackle and Post-Keynesians, less so with Keynes himself).
  *   **Dimensions:**
      *   *Source:* Ontological (the nature of reality).
      *   *Status of Probability:* Does not exist.
      *   *Decision Rule:* EV is meaningless (you cannot average over non-existent states).
      *   *Upshot:* Paralysis or creative action (making the future happen).
  *   **Licenses Refusal to Quantify?** **Yes, absolutely.** Quantifying implies a distribution exists. If the territory doesn't exist, the map is a fiction.
  *   **Keynes Consistency:** **Tenuous.** Keynes was generally an epistemic theorist (about knowledge), not an ontological one (about reality). He spoke of what we can *know*, not necessarily what *exists*.

  #### 5. The Incoherence Claim
  *   **The Claim:** It is psychologically impossible for humans to hold coherent degrees of belief about unique, complex macroeconomic events. Any number produced is pure noise.
  *   **Classification:** **Empirically False (mostly).**
  *   **Dimensions:**
      *   *Source:* Psychological.
      *   *Status of Probability:* Agents cannot form credences.
      *   *Decision Rule:* N/A.
      *   *Upshot:* Random guessing.
  *   **Licenses Refusal to Quantify?** **Yes.**
  *   **Keynes Consistency:** **Incoherent.** Keynes believed rational degrees of belief were possible (logical relations); he just thought they were often non-numeric. He did not think humans were incapable of judgment, only that judgment shouldn't be confused with mathematical calculation.

  ---

  ### Connection to *A Treatise on Probability*

  Your friend's view sits most comfortably with **Claim 2 (Non-Numerical Probability)** and **Claim 3 (Decision-Rule Breakdown)**, provided we import the technical machinery from Keynes's *Treatise*.

  1.  **Logical Relations:** For Keynes, probability is not subjective frequency; it is the degree of rational belief warranted by the evidence ($a/h$).
  2.  **Weight of Argument:** This is the crucial technical distinction.
      *   **Probability:** The balance of evidence *for* vs. *against*.
      *   **Weight:** The *amount* of relevant evidence vs. relevant ignorance.
      *   You can have a high probability (90% chance of rain) with low weight (based on one cloud), or a middling probability (50%) with high weight (massive data sets showing a coin is fair).
  3.  **The Conflict:** Your second group member argues that low confidence just means "variance is enormous." In Keynes's technical terms, this confuses **Probability** with **Weight**.
      *   If the variance is enormous but known, that is **Risk** (high weight, wide distribution).
      *   If the evidence is thin, that is **Uncertainty** (low weight).
      *   Keynes argues that as Weight decreases, the logical force of the probability relation weakens, eventually to the point where numerical measurement is no longer valid (Claim 2).

  **Does this make Keynes's practice incoherent?**
  Not necessarily. Keynes managed investments for King's College Cambridge (the Chest Fund). He did not refuse to quantify everything. However, he shifted strategy over time. Early on, he tried "credit cycling" (macro bets). Later, he moved to "stock picking" based on deep, specific knowledge of enterprises where he felt the "weight" of his evidence was higher, even if the macro environment was uncertain. He did not calculate EVs in the modern CAPM sense; he evaluated the "intrinsic value" based on the quality of evidence. So, his practice aligns with **Claim 3**: he used judgment where weight was sufficient and avoided macro-betting where weight was low.

  ### Usage in Investment and Policy

  When your friend (the pension manager) invokes this line, which reading is she using?

  *   **Rhetorically:** She is invoking **Claim 4 (Ontological)** or **Claim 5 (Incoherence)**. She wants to shut down the modelers. She wants to say, "Your spreadsheet is a lie."
  *   **Technically:** She likely believes **Claim 2 (Non-Numerical)**. She knows she can produce a number for the Investment Committee, but she believes that number does not represent a logical probability relation.
  *   **Practically:** She is relying on **Claim 3 (Decision-Rule Breakdown)**. She is signaling that she will not bind the fund to an EV maximization strategy based on those numbers. She will use conventions (e.g., "we match liabilities," or "we follow the market weight") rather than optimization.

  ### The Verdict on the Rhetoric

  You asked for an honest answer on whether any reading supports the rhetorical use (the "conversation stopper").

  **The honest answer is: No precise reading fully supports the rhetorical use as a conversation stopper, but Claim 2 and Claim 3 support it as a methodological warning.**

  Here is why the "conversation stopper" is technically vulnerable:
  1.  **Decision Necessity:** A pension fund *must* allocate capital. Refusing to quantify is not a decision; it is an abdication. Even "holding cash" is a quantifiable position with a known return. To say "we cannot quantify" is usually code for "we will use a heuristic," but heuristics are implicit quantifications.
  2.  **The "Fiction" Charge:** Claim 2 (Non-Numerical Probability) is defensible, but it doesn't mean numbers are *fictions*; it means they are *incomplete representations*. Using a number as a placeholder for a non-numeric logical relation is common in engineering and physics (e.g., safety factors). It becomes a fiction only if you treat the placeholder as the reality.
  3.  **Keynes's Own View:** Keynes did not advocate paralysis. He advocated understanding the limits of calculation so that we do not pretend to be more precise than we are. He wrote: *"The fact that we do not know the future does not mean we should not act."*

  **Conclusion for your Group:**
  Your friend is right that **Expected Value reasoning is threatened** (Claim 3) and that **numerical precision is often unjustified** (Claim 2). However, she is wrong if she implies that **no rational action is possible** or that **all quantification is nonsense** (Claim 5).

  The other member is right that **variance and thin evidence are compatible with probabilistic reasoning** (Claim 1), but he is wrong to dismiss the distinction between **Risk (known distribution)** and **Uncertainty (unknown distribution/low weight)** as merely semantic.

  **The Synthesis:** The line should not be used to stop the conversation, but to shift it. The question should not be "What is the return?" (which invites a fake number), but "What is the **weight** of the evidence supporting this return estimate, and what decision rule is appropriate given that weight?" If the weight is low, the decision rule should shift from optimization to robustness or convention. That is the genuine Keynesian insight.
