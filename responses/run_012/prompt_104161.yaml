  2.  **Deconstruct the Keynesian "Uncertainty" Concept:**
      *   Source material: Primarily *The General Theory* (Chapter 12) and *A Treatise on Probability*.
      *   Key distinction: Risk (known probabilities) vs. Uncertainty (unknown/unmeasurable probabilities).
      *   Key quote (often paraphrased): "About these matters there is no scientific basis on which to form any calculable probability whatever. We simply do not know." (*The General Theory*, 1937).
      *   Technical background: Logical theory of probability (relations between propositions), non-numerical probabilities, weight of evidence.

  3.  **Drafting the Menu of Claims (Trivial to Radical):**

      *   *Claim 1 (Trivial/Epistemic):* We have very little evidence.
          *   Status: Platitude.
