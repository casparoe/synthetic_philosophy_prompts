      *   *Claim 2 (Epistemic/Measurement):* Probabilities exist but aren't numerically measurable (non-numeric probabilities).
          *   Status: Substantive (Keynes's *Treatise* view).
          *   Quantification: Blocks precise numbers, allows ordinal ranking.
      *   *Claim 3 (Decision Rule):* Expected Value maximization is inappropriate when weight is low.
          *   Status: Substantive (Knight/Keynes view).
          *   Quantification: Blocks EV calculation, suggests rules of thumb.
      *   *Claim 4 (Ontological/Indeterminism):* The future is fundamentally created, not discovered. No fact of the matter exists yet.
          *   Status: Radical/Controversial (Post-Keynesian/Shackle).
