answer: |-
  George Berkeley would unequivocally endorse a state-issued Central Bank Digital Currency (CBDC) and condemn a privately issued, supply-capped cryptocurrency like Bitcoin. To Berkeley, money is not a commodity to be hoarded but a social technology designed to mobilize resources. Bitcoin, despite its digital nature, replicates the logic of the metallic specie Berkeley sought to escape, treating scarcity as a virtue rather than an impediment to industry. A CBDC, conversely, offers the perfect modern vessel for his vision of a public ticket managed to ensure full employment.

  Berkeley's rejection of Bitcoin would be total. While Bitcoin proponents argue that its algorithmic scarcity makes it "honest money," Berkeley would view this as a category error that violates his first two commitments. By capping supply, Bitcoin treats the monetary unit as a store of value (wealth itself) rather than a flexible counter for trade. This encourages hoarding, which Berkeley saw as the death of commerce. In *The Querist*, he asks, "Whether the getting of money be not the wrong end of industry?" Bitcoin incentivizes the accumulation of the counter rather than the production of the goods the counter represents. Furthermore, because Bitcoin is privately issued and decentralized, it removes the mechanism from the hands of the authority responsible for the public welfare. It creates a currency that cannot expand to meet the needs of "idle hands," thereby failing to convert potential labor into actual wealth.

  In contrast, a CBDC aligns perfectly with Berkeley's third commitment: that public authority may issue paper credit to set idle hands to work. A digital currency issued by the state retains the nature of a "ticket" or "counter" (Commitment 1) but ensures that the issuer is the entity responsible for the nation's industry (Commitment 2). Berkeley argued that a national bank could issue notes based on the land and labor potential of the people, not a stock of gold. A CBDC allows the state to precisely calibrate the money supply to the available labor force, injecting credit where there is idle capacity and withdrawing it to prevent inflation once full employment is reached. It is the ultimate realization of Berkeley's view that the limit of currency should be the industry of the people, not the scarcity of the medium.

  The commitment that does the **real work** in this distinction is the third: **that public authority may issue paper credit to set idle hands to work, so a metallic base is not the necessary limit of a sound currency.** While Berkeley's conventionalism (Commitment 1) allows him to accept non-metallic money, it is theoretically compatible with Bitcoin (which is also a conventional token). It is Commitment 3 that acts as the tie-breaker. Berkeley's conventionalism is not merely nominalist; it is *functionalist*. A ticket is only valid if it serves the public function of mobilizing labor. Because Bitcoin explicitly rejects public authority and elastic supply, it fails the functional test. Commitment 3 dictates that the *issuer* must be public because only the public authority has the mandate to prioritize industry over private accumulation.

  The **strongest objection** Berkeley could raise against his own conclusion concerns the integrity of the ticket. Berkeley was aware that credit relies on opinion and confidence. He might worry that a state-issued CBDC, lacking the "natural" constraint of scarcity, could be abused by a corrupt or incompetent government to issue excessive credit, leading to hyperinflation that destroys the ticket's power to command labor. If the public loses faith in the digital counter, it ceases to function as money, and industry stalls. Berkeley might concede that while the state *should* manage money, human frailty often makes a rigid, private constraint (like Bitcoin's cap) a safer guard against debasement than the benevolent discretion of a public authority.

  If Berkeley were to **land on the other side** and endorse Bitcoin, he would have to **concede** that the discipline of scarcity is more vital to economic health than the mobilization of idle labor. He would have to admit that public authority is inherently prone to tyranny or mismanagement of the currency, and that a "sound currency" is defined by its resistance to political manipulation rather than its ability to facilitate full employment. This would require him to abandon his core mercantilist critique: that the obsession with hard money (gold, or in this case, capped crypto) is precisely what keeps nations poor by preventing the circulation necessary to activate their productive potential. To choose Bitcoin would be to choose the treasure over the ticket, violating the very heart of his economic philosophy.
