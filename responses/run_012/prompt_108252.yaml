      *   **Section 2: Philosophical Objections.** Evaluate specific arguments (Indeterminacy, Disjunction, Rule-following, Frame, Grain, Derived vs. Original, Role-play/Quotation, Occurrent vs. Standing, Policy vs. Belief). Distinguish independence vs. collapse.
      *   **Section 3: Falsification Conditions.** What makes the position *false* vs. *qualified*? Is retreating to "useful but not truth-apt" a concession? Is there a risk-free version that explains nothing?
      *   **Section 4: Up-front Concessions & Priors.** Evaluate the user's specific priors (mechanistic interpretability > conversational fluency). What would force giving them up?
      *   **Formatting:** Rank defeaters, be explicit about accommodation vs. revision.

  3.  **Drafting - Section 1: Empirical Findings:**
      *   *Prompt Sensitivity/Instability:* If tiny changes flip "beliefs," is it a belief or a reflex? *Rank:* Serious. *Concession:* Beliefs are context-bound, not standing.
      *   *Sycophancy:* Agreeing with user vs. truth. *Rank:* Serious. *Concession:* Desires (to please) override beliefs (of truth).
      *   *Hallucination:* False beliefs? Or lack of belief? *Rank:* Awkward/Survivable. Humans hallucinate too.
      *   *CoT Unfaithfulness:* Reasoning doesn't match output. *Rank:* Serious. Challenges the "acting on representation" clause.
