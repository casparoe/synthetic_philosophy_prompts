prompt: |-
  I teach an upper-level phil of language seminar — 16 students, one 75-minute block — and I want them to feel why semantic externalism is tempting, and then why it's strange, instead of me just narrating Twin Earth at them. No lecture up front, and they shouldn't hear the word "externalism" until the debrief. Seed idea, please fix it and flesh it into something I can actually run: split the class into two teams in separate rooms, each cataloging a green stone they've both been calling by the same word. Use jade, where one team's sample is nephrite and the other's is jadeite, or a comparable one-word-two-natures case if you have a better one. Each team gets a private profile of its own sample and fills out a meaning card for the word: a definition, how you'd recognize the stuff, and what would show you were wrong. Then reunite and compare the cards — they'll match, since both teams only had surface properties to go on — reveal the two profiles, and make them trade: each team needs a shipment of the other's stone to do a specified job, and the two minerals perform differently, so the trade quietly fails even though both teams' cards said same stuff. Give me rules, materials, a minute-by-minute timeline, and a debrief that maps each beat onto narrow vs. wide content, the meanings-aren't-in-the-head intuition, and the question of whether the teams meant the same thing all along or were just ignorant. Tell me what will predictably go wrong the first time (someone will insist both teams are simply wrong about the extension, someone else will want to make it all about definitions) and how to turn those into the discussion. And be honest about which feature of the idea the activity can't reproduce and I'll have to supply myself.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level philosophy of language seminar, 16 students, 75 minutes.
      *   **Goal:** Make students *feel* the temptation and strangeness of semantic externalism without lecturing first or using the term "externalism" until the end.
      *   **Core Idea:** Split class into two groups/rooms. Both catalog a "green stone" (Jade: Nephrite vs. Jadeite). They create "meaning cards" (definition, recognition, falsification). Reunite, compare cards (match), reveal profiles (different), attempt a trade (fails due to material differences).
      *   **Requirements:** Fix/flesh out the seed idea, provide rules, materials, minute-by-minute timeline, debrief mapping to narrow/wide content, predict pitfalls (extension errors, definition focus), and acknowledge limitations of the activity.

  2.  **Evaluate and Refine the Seed Idea:**
      *   *Strengths:* Active learning, embodied cognition (handling "samples"), creates genuine confusion/disagreement, mirrors Putnam's Twin Earth without the sci-fi baggage initially.
      *   *Weaknesses/Risks:*
          *   **Logistics:** Moving 16 students to two separate rooms might be clunky and eat time. *Fix:* Keep them in one room but strictly partitioned (e.g., left/right sides, backs turned, no talking). Or, if separate rooms are available, use them, but timing is tight. Let's assume one room with a "barrier" or strict separation rule to save transition time. Actually, separate rooms creates better epistemic isolation. Let's assume the instructor has a TA or can trust students not to peek. Better yet: Use *folders* or *digital isolation* if rooms aren't available. But the prompt says "separate rooms." I will stick to the prompt's constraint but add a contingency for one-room separation.
          *   **The "Jade" Case:** Jade is the classic Putnam example. It works. Nephrite vs. Jadeite is chemically distinct but macroscopically similar.
          *   **The "Trade":** How to simulate a trade failing in a classroom? *Fix:* Give them a specific task (e.g., "carving a precise lens" vs. "making a tough amulet"). One breaks, one holds. Or simpler: One dissolves in acid, one doesn't. Let's go with a physical property test they *would* have done if they knew the hidden nature.
          *   **Meaning Cards:** Need to be structured to elicit "narrow" content (internal state) vs. "wide" content (external reference).
          *   **Timing:** 75 minutes is tight for movement, activity, and deep debrief. Needs strict timekeeping.

  3.  **Drafting the Plan - Section by Section:**

      *   **Title:** Needs to be neutral. "The Green Stone Project."
      *   **Materials:** Fake stones (or pictures/descriptions if real stones aren't available), profile sheets, meaning cards, task sheets.
      *   **Setup:** Two groups (Alpha/Beta). Epistemic isolation is key.
      *   **Timeline:**
          *   0-5: Intro & Split.
          *   5-20: Investigation & Card Creation.
          *   20-35: Reunion & Card Comparison.
          *   35-50: The Reveal & The Trade (The Crisis).
          *   50-75: Debrief & Philosophical Mapping.
      *   **The Twist:** The "Trade" needs to show that *reference* mattered, not just *concept*. If they agreed on the word "Jade," but one meant Nephrite and one meant Jadeite, did they mean the same thing?
      *   **Debrief:** Connect to Putnam, Burge, Narrow vs. Wide Content, Deference to Experts/Environment.
      *   **Pitfalls:** Essentialism vs. Descriptivism. The "They were just wrong" objection.
      *   **Limitations:** The activity can't reproduce the *social* division of linguistic labor perfectly without an expert figure, and it can't fully capture the *counterfactual* nature of Twin Earth (since this is actual Earth).

  4.  **Refining the "Trade" Mechanism:**
      *   If I just say "it fails," students might roll their eyes.
      *   *Better:* Give them a "Client Request." Client needs stone for high-pressure industrial cutting. Team Alpha has Nephrite (tougher). Team Beta has Jadeite (harder but more brittle). If they swap, the tool breaks.
      *   *Simpler for Class:* Use a chemical test simulation. "The Client needs stone that reacts to Solution X." One does, one doesn't.
      *   *Decision:* Let's use a "Durability Test." Team Alpha's stone survives a hammer tap (simulated); Team Beta's cracks. If they trade, the project fails. This makes the *physical difference* matter for the *success of communication*.

  5.  **Refining the Debrief:**
      *   Need to guide them from "We were confused" to "Our words meant different things despite identical mental states."
      *   Key question: "When Alpha said 'Jade' in the first 20 mins, were they talking about the same stuff as Beta?"
      *   Map to: Internalism (Meaning is in the head) vs. Externalism (Meaning depends on world).

  6.  **Addressing the "Limitations" Requirement:**
      *   The prompt asks for honesty about what the activity *can't* do.
      *   *Crucial Point:* In Twin Earth, the subjects are *molecular duplicates*. In this class, the students are not. They have different physical samples. The intuition pump relies on them imagining they *are* duplicates. I need to make sure they bracket their own knowledge.
      *   *Another Point:* Real Jade (Nephrite/Jadeite) is a historical accident. Putnam's "Water = H2O vs XYZ" is about *natural kinds* more strictly. Jade is a "functional kind" that turned out to be two natural kinds. This is actually *better* for a seminar because it's messier. I should note this.

  7.  **Final Polish:**
      *   Tone: Professional, instructional, ready-to-use.
      *   Check constraints: No "externalism" until debrief. 16 students. 75 mins.
      *   Ensure the "Meaning Card" prompts specific philosophical tensions (intension vs. extension).

  8.  **Self-Correction during drafting:**
      *   *Wait, moving to separate rooms takes too long.* 16 students moving, settling, getting materials... that's 10 minutes gone.
      *   *Correction:* Use one room. Divide into Left/Right. They cannot turn around. Instructor acts as courier. This ensures timing works. I will advise the user to use one room with strict separation if two aren't immediately adjacent.
      *   *Wait, the "Trade" failure.* If I don't have actual stones, how do they test?
      *   *Correction:* Use "Lab Reports." The profiles include hidden data (Hardness, Chemical Composition). The "Trade" is a paper transaction where they realize the specs don't match the Client's needs. This is more manageable in 75 mins.
      *   *Wait, the "Meaning Card".* Make sure they write down *what determines reference*. Is it "looks green" or "is this mineral"?

  9.  **Finalizing the Plan Structure:**
      *   **Activity Title:** The Jade Protocol.
      *   **Learning Objective:** Pre-theoretic intuition pump for Externalism.
      *   **Materials List.**
      *   **Room Setup.**
      *   **Minute-by-Minute.**
      *   **Handout Content (Profiles & Cards).**
      *   **Debrief Script.**
      *   **Troubleshooting/Pitfalls.**
      *   **Limitations.**

  10. (Reviewing against prompt): "Tell me what will predictably go wrong... and how to turn those into the discussion." "Be honest about which feature of the idea the activity can't reproduce."
      *   Okay, I need to be specific about the "They were just wrong" objection and the "Definition" objection.
      *   Limitation: The activity creates *ignorance*, not *difference in reference* in the strict Twin Earth sense (since both are on Earth). I need to highlight this distinction in the debrief.

  11. *Final thought on the "Jade" case:* Putnam actually used Jade as an example of where the "stereotype" fails to pick out a natural kind. It's a perfect case. I will stick with Jade (Nephrite vs. Jadeite).

  12. *Let's write it.* (Proceeds to generate output based on these thoughts).
answer: |-
  # Activity Plan: The Jade Protocol

  **Course:** Upper-Level Philosophy of Language
  **Time:** 75 Minutes
  **Students:** 16
  **Goal:** Generate pre-theoretic intuitions about semantic externalism (meaning isn't just in the head) without using the terminology until the end.

  ## 1. Logistics & Materials

  **Room Setup:**
  *   **Ideal:** Two adjacent seminar rooms.
  *   **Realistic:** One large room divided by a "No-Turn Zone." Group A faces left, Group B faces right. No eye contact. You (the instructor) are the only courier.
  *   **Groups:** 8 students per team (Team Alpha / Team Beta).

  **Materials:**
  *   **2 Sets of "Specimen Folders":** Manilla folders labeled "Specimen 88-B."
      *   *Inside Alpha:* Photo of green stone + **Profile A (Nephrite)**. Key stat: *Toughness: High | Hardness: 6.5 | Structure: Interlocking Fibers.*
      *   *Inside Beta:* Photo of green stone + **Profile B (Jadeite)**. Key stat: *Toughness: Medium | Hardness: 7.0 | Structure: Granular Crystals.*
      *   *Note:* The photos should look identical to the naked eye.
  *   **16 "Meaning Cards" (Index Cards):** Pre-printed with three prompts.
  *   **1 "Client Request" Sheet:** (Distributed at minute 40).
  *   **Whiteboard/Projector:** For the final debrief mapping.

  ## 2. Minute-by-Minute Timeline

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00-05** | **Briefing** | Hand out folders (closed). Tell students: "You are a procurement team. You have received a sample of a material called **'Jade'**. Do not open yet. Do not communicate with the other team." |
  | **05-20** | **Investigation** | Teams open folders. They review the photo and the *visible* data. They must complete the **Meaning Card** collectively. <br>*Prompts:* 1. Define 'Jade'. 2. How do you recognize it? 3. What would prove you wrong? |
  | **20-30** | **Comparison** | Teams remain seated. You collect the Meaning Cards. Project/Read them anonymously. <br>*Observation:* The definitions will be nearly identical (green, hard, stone). Highlight this consensus. |
  | **30-40** | **The Reveal** | Hand Team Alpha Team Beta's *Profile*, and vice versa. <br>*Instruction:* "You now have the other team's lab data. Compare it to yours." <br>*Result:* They see the chemical/structural difference (Nephrite vs. Jadeite). |
  | **40-50** | **The Crisis** | Distribute **Client Request**: "Client needs 'Jade' for a high-impact drill bit. Requires Toughness > 6.8." <br>Team Alpha realizes they have the right stuff. Team Beta realizes they have the wrong stuff. <br>*Task:* "Can Team Beta fulfill the order using the word 'Jade' as defined on your Meaning Card?" |
  | **50-75** | **Debrief** | Full class circle. Discuss the failure. Introduce "Externalism." Map the activity to Putnam/Burge. |

  ## 3. The Handouts (Content)

  **The Meaning Card (Both Teams)**
  1.  **Definition:** What does the word 'Jade' refer to? (Write a necessary and sufficient condition).
  2.  **Recognition:** If you saw a new stone, how would you know if it counts as 'Jade'?
  3.  **Falsification:** What would convince you that something you called 'Jade' is *not* Jade?

  **The Profiles (Hidden until Minute 30)**
  *   **Profile A (Alpha):** Mineral Name: Nephrite. Composition: Calcium/Magnesium Silicate. Structure: Matted Fibers. *Property: Extremely Tough (resists breaking).*
  *   **Profile B (Beta):** Mineral Name: Jadeite. Composition: Sodium/Aluminum Silicate. Structure: Granular Crystals. *Property: Hard but Brittle (shatters on impact).*

  **The Client Request (Minute 40)**
  *   "Urgent Order: We require 5kg of **Jade** for industrial drill bits. The material must withstand 5000 PSI impact without fracturing. If the material fractures, the drill fails."

  ## 4. The Debrief Script (The Philosophical Pivot)

  *Do not use the word "Externalism" until minute 60.*

  **Phase 1: The Intuition of Sameness (50-55 min)**
  *   **Ask:** "At minute 20, before you saw the other profile, did Team Alpha and Team Beta mean the same thing by 'Jade'?"
  *   **Expected Answer:** "Yes. We wrote the same definitions. We had the same mental concept."
  *   **Push:** "So if Alpha said 'Jade is tough' and Beta said 'Jade is tough', were they saying the same proposition?"

  **Phase 2: The Intuition of Difference (55-60 min)**
  *   **Ask:** "When the Client asked for 'Jade for drill bits', could Beta fulfill it?"
  *   **Consensus:** No. Beta's stone breaks.
  *   **The Pivot:** "If Beta says 'This is Jade' and points to Jadeite, and Alpha says 'This is Jade' and points to Nephrite... one of them is pointing to stuff that breaks, and one to stuff that holds. Did the word 'Jade' pick out the same stuff in the world for both of them?"
  *   **Key Question:** "Did the meaning change when you opened the second profile? Or was the meaning *always* fixed by the stone in the folder, not the definition in your head?"

  **Phase 3: Naming the Theory (60-70 min)**
  *   **Introduce:** "Semantic Externalism." (Putnam, 1975).
  *   **Map:**
      *   *Meaning Card* = **Narrow Content** (Psychological state, internal description).
      *   *The Profile/Stone* = **Wide Content** (Extension, causal history, physical constitution).
      *   *The Failure* = Proof that Narrow Content isn't enough to fix reference.
  *   **The "Twin Earth" Connection:** "Imagine Team Beta was on a planet where the green stone *looked* like Jadeite but had the *chemistry* of Nephrite. You'd write the same Meaning Cards. But if you ordered drill bits, you'd get different results. The planet determines the meaning, not just the head."

  **Phase 4: Open Discussion (70-75 min)**
  *   "Is this fair? Shouldn't meaning be what I *intend*?"
  *   "Who is the expert on what 'Jade' means? You, or the geologist?" (Introduce Division of Linguistic Labor).

  ## 5. Predictable Pitfalls & How to Handle Them

  **Pitfall 1: The "They Were Just Wrong" Objection**
  *   *Student:* "Beta wasn't using the word differently. They were just ignorant. 'Jade' means Nephrite. Beta was wrong. End of story."
  *   *Instructor Move:* "Okay, suppose we don't know which one is the 'real' Jade. Suppose in 1863 (when they were distinguished), both were called Jade. Was the word ambiguous? Or did the *world* split the word for them? If meaning is in the head, they meant the same thing. If meaning is in the world, they meant different things *even though they didn't know it*. Which explains the drill bit failure better?"

  **Pitfall 2: The "Definition is King" Objection**
  *   *Student:* "We defined Jade as 'Green hard stone'. Both stones fit that. So we meant the same thing. The Client was just asking for a specific *type* of Jade."
  *   *Instructor Move:* "So 'Jade' is like 'Dog'? If I point to a Poodle and say 'Dog', and you point to a Wolf and say 'Dog', did we mean the same thing? Or is 'Jade' more like 'Water'? If I point to H2O and you point to XYZ, can we both call it 'Water' if only one quenches thirst? The Client didn't ask for 'Green Stone', they asked for 'Jade'. Why does the hidden structure matter for the word?"

  **Pitfall 3: Logistics Drag**
  *   *Risk:* Passing papers takes too long.
  *   *Fix:* Have the Meaning Cards pre-printed. Have a TA or trusted student help distribute the Profiles at Minute 30. If you are alone, walk the perimeter quickly.

  ## 6. Limitations: What This Activity Cannot Do

  You must supply these nuances in the debrief, as the activity structurally cannot reproduce them:

  1.  **The Counterfactual:** In Twin Earth, Oscar and Twin-Oscar are *molecular duplicates*. In this class, Team Alpha and Team Beta are not. They have different physical evidence in their folders. The activity proves that *evidence* changes meaning, but it doesn't fully prove that *identical mental states* can have different meanings. You have to ask them to *imagine* they didn't have the profiles at the start.
  2.  **Social Deference:** In the activity, the students *are* the experts. In Putnam's theory, most of us defer to experts ("I don't know the difference between Nephrite and Jadeite, but I know there is one"). This activity makes them the discoverers. You need to explicitly ask: "If you hadn't seen the profiles, and a geologist told you 'Actually, your team has the fake stuff', would you change your meaning? If yes, meaning is outside your head."
  3.  **Natural Kind vs. Functional Kind:** Jade is historically a functional kind (beautiful green stone) that turned out to be two natural kinds. Water (H2O) is a pure natural kind. Jade is messier. Acknowledge this: "Jade is the 'gotcha' case. Water is the 'strong' case. Externalism works on both, but for slightly different reasons."

  ## 7. Instructor Cheat Sheet: The "Aha" Moment

  The goal is to get them to admit this contradiction:
  1.  **Premise 1:** Team Alpha and Team Beta had the exact same ideas in their heads at Minute 20.
  2.  **Premise 2:** Team Alpha's word 'Jade' referred to Stuff A (Tough). Team Beta's word 'Jade' referred to Stuff B (Brittle).
  3.  **Conclusion:** Therefore, what is in your head does not fix what your word refers to.

  If they resist Premise 2 (insisting they both referred to "Green Stone"), press the **Client Request**. The Client's world didn't care about their definitions; it cared about the extension. If language is for coordinating action in the world, the external stuff won out. That is the temptation of Externalism.
