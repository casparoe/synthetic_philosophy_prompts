answer: |-
  You have not misunderstood the Principal Principle (PP); you have correctly identified the exact fault lines that have kept philosophers of probability awake for forty years. Your flatmate was right to insist on admissibility, but you are right to suspect it looks like a patch.

  Here is the diagnosis you asked for. The core of your confusion lies in treating the Principal Principle as a *definition* of chance, when it is actually a *bridge principle* between metaphysics and epistemology. Once you see it as a bridge, the charge of circularity dissolves, the frequency objection loses its bite, and the work of admissibility becomes clear.

  ### 1. Is it trivial? (The "Backwards" Question)
  You asked: *If objective chance simply is the credence that a rational agent ought to have, then the principle instructs me to hold the credence I ought to hold.*

  This is the "Euthyphro" dilemma of probability. But the PP does not claim that chance *is* credence. It claims that chance *constrains* credence.

  Think of a thermometer.
  *   **Fact:** The temperature is 20°C.
  *   **Norm:** A functioning thermometer ought to read 20°C.
  *   **Principle:** "If the temperature is 20°C, a rational thermometer ought to read 20°C."

  Is this principle trivial? No. It connects two distinct categories: thermal energy (world) and mercury height (device). It is possible for the temperature to be 20°C and the thermometer to read 30°C (the thermometer is broken/irrational).

  Similarly, the PP says: "If the chance is $x$, a rational mind ought to believe $x$."
  *   **Chance** is a feature of the setup (the coin, the decay rate, the physics).
  *   **Credence** is a feature of your mind.

  The principle is substantive because it rules out a specific kind of irrationality: knowing the objective setup but refusing to align your expectations with it. If you know a coin is objectively fair (Chance = 0.5) but you believe it will land heads with 90% confidence, you are not just "different"; you are violating a norm of rationality. The PP explains *why* you are irrational. If PP were a definition, you couldn't be irrational; you'd just be using a different definition.

  ### 2. Is it false? (The Frequency Objection)
  You asked: *If objective chance is the relative frequency... the principle looks plainly false.*

  You are absolutely right that if Chance = *Actual Finite Frequency*, the PP is false. If I toss a coin 10 times and get 8 heads, the frequency is 0.8. But my credence should not be 0.8; it should remain 0.5 (assuming I know it's a fair coin).

  However, almost no philosopher of probability (including Lewis) identifies chance with *actual* finite frequency. That is a straw man of frequentism.
  *   **Sophisticated Frequentism:** Chance is the *limiting* frequency in an infinite sequence.
  *   **Propensity:** Chance is a physical disposition.
  *   **Best System (Lewis):** Chance is the probability value assigned by the best summary of the world's patterns.

  On any of these views, the *actual* short-run frequency can diverge from the chance. The PP is not saying "Match the frequency you see." It is saying "Match the chance parameter that *generates* the frequencies."

  So, the PP is not false on a frequency view, provided you understand frequency as a *long-run tendency* rather than a *short-run count*. In fact, the PP is what justifies our inference from chances to frequencies. We expect frequencies to approximate chances *because* we defer to chances.

  ### 3. What work is "Admissibility" doing?
  You asked: *Is it... just a way of never letting the principle be refuted?*

  This is the sharpest part of your critique. Admissibility feels like a "Get Out of Jail Free" card. However, it has a precise structural function: **It blocks information about the future.**

  The PP formula is roughly: $C(A | \text{Chance}(A)=x \ \& \ E) = x$.
  Here, $E$ is your total evidence. The admissibility clause says this equation only holds if $E$ is "admissible."

  **The Crystal Ball Test:**
  Imagine you have a crystal ball. You look into it and see the coin landing Heads.
  *   Your evidence $E$ includes "The coin will land Heads."
  *   The Chance is 0.5 (it's a fair coin).
  *   If PP applied without admissibility, your credence should be 0.5.
  *   But rationality demands your credence be 1.0 (you saw it happen!).

  If we didn't have the admissibility clause, the PP would command you to ignore the crystal ball and believe 0.5. That is absurd. Therefore, information about the *outcome* must be inadmissible.

  **What makes evidence admissible?**
  Roughly: Information is admissible if it affects your credence in the outcome *only* by affecting your credence in the chance.
  *   **Admissible:** "This coin was minted by the Royal Mint." (Affects belief about fairness/chance, which affects belief about heads).
  *   **Inadmissible:** "This coin landed heads five minutes ago." (Directly affects belief about the specific outcome type, or implies time-travel/causation violations if used to predict the future).

  It is not a stipulation to save the theory; it is a recognition that the PP is a principle about *prediction under uncertainty*. If you have certainty (inadmissible future info), the principle doesn't apply.

  ### 4. Does this commit me to "Mysterious Ingredients"?
  You asked: *Is there a respectable understanding of objective chance on which the principle is neither trivial nor false?*

  Yes. The most respectable modern view is **Lewis's Best System Analysis (Humean Objective Chance).**

  *   **The View:** There is no "magic propensity" in the coin. There is just the vast mosaic of everything that happens (the Humean mosaic).
  *   **The Chance:** We look at all the patterns in that mosaic. The "chance" is the probability value that appears in the *best* system of laws that summarizes those patterns (balancing simplicity and strength).
  *   **The PP's Role:** The PP is the rule that tells us how to use those summaries. Even if chances are just summaries of patterns, a rational agent living *inside* the world should use the best summary to guide their expectations about the parts of the pattern they haven't seen yet.

  On this view, chance is not "over and above what actually happens." It is a feature of how we describe what happens. The PP is not circular because we identify the "Best System" via scientific investigation (physics), not by polling rational agents' beliefs. Physics tells us the chance is 0.5; PP tells us to believe 0.5.

  ### 5. Summary Diagnosis

  1.  **Is it substantive?** Yes. It rules out the rationality of acknowledging a physical chance but betting against it without new evidence. It connects the physics of the world to the psychology of the agent.
  2.  **Is it circular?** No. It links two independent variables: Physical Chance (determined by laws/setup) and Rational Credence (determined by norms of mind). One can exist without the other (a world with no agents has chances; an irrational agent has credences that violate PP).
  3.  **Does it require robust metaphysics?** No. It works on Humean/Best System views where chances are just efficient summaries of actual events.
  4.  **Is Admissibility a cheat?** No. It distinguishes between knowing the *setup* (admissible) and knowing the *result* (inadmissible). Without it, the principle would forbid using crystal balls, which is the real error.

  **The Verdict:** Your flatmate was right that admissibility is necessary, but you were right to demand an explanation of *why*. The explanation is temporal and epistemic: The PP governs how we project from the present setup to the future outcome. Any evidence that shortcuts that projection (by revealing the future) is inadmissible. The principle is not a definition of chance, but a constraint on how rational agents must interface with a chancy world.
