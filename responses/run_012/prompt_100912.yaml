      *   **Audience:** Alumni donors (including the great-great-granddaughter who is unhappy), History faculty (will spot theoretical errors), Current students (want it short/engaging).
      *   **Time Limit:** 4-5 minutes (approx. 500-750 words spoken at a normal pace).
      *   **Core Intellectual Problem:** The tension between historical relativism (don't judge past by present standards) and moral realism (some things are always wrong). The user wants to use a specific three-part framework for judging the past: (1) Did he meet his own time's standards? (2) Were those standards bad? (3) Was criticism available *at the time*?
      *   **Deliverables:**
          1.  The Speech (honest, not a lecture, balances audiences, lands definitely).
          2.  A Separate Note (assessing the theoretical validity of the framework, what's disputed vs. settled, where the speech takes liberties).

  2.  **Deconstruct the Intellectual Framework (The "Three Questions"):**
      *   *Question 1: Did he meet the standards of his time?* This is contextualization. It's standard historical practice but "standards of the time" is often a myth (there were always competing standards).
      *   *Question 2: Were those standards themselves bad?* This is moral judgment. Historians often shy away from this in *analysis*, but public history requires it.
      *   *Question 3: Was criticism available at the time?* This is the "contemporary dissent" argument. It's a strong move because it avoids anachronism while maintaining moral condemnation. It suggests the subject had a choice.
      *   *Validity:* This isn't a brand new invention, but it's a specific synthesis. It aligns with "internal critique" and arguments made by scholars like Quentin Skinner (contextualism) but pushed further by moral philosophers of history. It's defensible but not "consensus" in a way that prevents debate.

  3.  **Drafting the Speech:**
      *   *Tone:* Respectful but firm. Not apologetic, not accusatory. Acknowledges the tension.
      *   *Opening:* Acknowledge the building, the name, and the awkwardness. Validate the family's presence.
      *   *Middle (The Meat):* Introduce the three questions gently (don't use academic jargon like "historiography").
          *   Acknowledge his philanthropy (Q1).
          *   Acknowledge the harm (Q2).
          *   Crucially: Acknowledge that people *then* knew it was wrong (Q3). This is the pivot.
      *   *Closing:* What does the plaque mean? It's not a statue. It's a tool for learning. A commitment to honesty.
      *   *Timing:* 4-5 minutes is roughly 600-750 words. Need to keep it tight.
      *   *Audience Management:*
          *   *Family:* "We honor your ancestor's gift, but not his blind spots."
          *   *Faculty:* "We understand history is complex."
          *   *Students:* "This building is for *us* to think critically."

  4.  **Drafting the Theoretical Note:**
      *   *Goal:* Inform the user about the academic standing of their framework without discouraging them.
      *   *Q1 (Context):* Standard contextualism (Skinner/Pocock). But "standards of the time" is contested because societies aren't monoliths.
      *   *Q2 (Moral Judgment):* The "Whig History" debate. Most historians agree we *can* judge, but debate *how* it affects historical understanding.
      *   *Q3 (Contemporary Dissent):* This is the strongest historical move. It relies on the idea that moral progress isn't magic; it comes from arguments people actually had.
