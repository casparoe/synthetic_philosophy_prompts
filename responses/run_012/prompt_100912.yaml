answer: |-
  ### The Speech

  Good afternoon.

  Standing here, looking at this building, it is easy to feel a kind of vertigo. We are gathered to re-dedicate a space that bears the name of a man who gave us this institution, and whose wealth built these walls. We are joined by his descendants, to whom we owe a debt of gratitude for their stewardship of his legacy. And we are joined by faculty and students who know that a legacy is not just what is given, but what is left out.

  For the past year, this committee has asked ourselves a difficult question: How do we inhabit a space named after someone whose life does not fit our values?

  It is tempting to treat history as a courtroom. To decide if a figure is a hero or a villain, and then file them accordingly. But history is not a courtroom, and this building is not a monument. It is a place of study. And if we are to study history honestly, we have to stop asking one question—"Was he good?"—and start asking three.

  First: Did he meet the standards of his time?
  By the metrics of the Victorian era, [Name] was a man of exceptional civic virtue. He believed in public education. He believed in philanthropy. He gave when others hoarded. To ignore this is to lie about the past. It is to pretend that generosity did not exist alongside exploitation. We acknowledge this gift. We are sitting in it.

  Second: Were those standards themselves just?
  Here, we must be clear. The economic engine that funded this generosity relied on labor practices that caused real, lasting harm. Child labor, unsafe conditions, the grinding down of human bodies for profit—these were not abstract economic variables. They were suffering. To say "that was how things were done" is not an explanation; it is an excuse. We cannot accept the gift while pretending the cost was negligible. The standards of the time were often cruel, and benefiting from that cruelty does not vanish because time has passed.

  But this leads to the third question, the one that matters most for us today: Was there criticism available *at the time*?
  This is where we must be most precise. We often assume that moral progress is a gift the future gives the past. We assume that because we see the injustice now, they couldn't see it then. That is false.

  In [Name]'s own lifetime, there were voices—workers, reformers, journalists, even rivals—who looked at the mills and said: *This is wrong.* They did not need twenty-first-century ethics to understand that a child belongs in a school, not a factory. The moral language to condemn these practices existed. It was spoken. It was published. It was available.

  So, when we look at this plaque, we are not judging him by our standards alone. We are judging him by the best standards of *his* own time, which he chose not to fully embrace.

  Why does this distinction matter? Because it changes what this building is for.

  If we simply cancel the name, we imply that the problem is solved. If we simply keep the name without context, we imply that the harm doesn't matter. But by re-dedicating this space with the full account, we are making a different claim. We are saying that this building is not a shrine to a perfect man. It is a tool for imperfect people.

  To the family: We know this is painful. We do not take this lightly. But the greatest respect we can show your ancestor is to treat his history with the same rigor he applied to his business. We are not erasing him. We are refusing to simplify him.

  To the students: This building is yours. The plaque on the wall is not the end of the conversation; it is the invitation to begin it. It asks you to look at the world you inherit—the donors, the institutions, the compromises—and ask not just what was given, but what was paid, and who was listening when someone said "no."

  We cannot change the past. But we can change how we stand in it. Let this building remind us that morality is not a matter of when you were born, but of what you choose to hear.

  Thank you.

  ***

  ### Theoretical Note: Framing & Validity

  **On the Three-Part Framework**
  Your intuition to split "judging the past" into three distinct moves is sharp, and it saves you from the binary trap of "Whig history vs. relativism." However, you should know where this sits on the historiographical map so you don't present it as settled dogma if a professor pushes back.

  1.  **Did he meet the standards of his time?**
      *   *Status:* This is standard **Contextualism** (associated with the Cambridge School, e.g., Quentin Skinner). The consensus is that you *must* understand the linguistic and normative context to understand an action.
      *   *The Catch:* Historians increasingly argue that "the standards of his time" is a fiction. There is never *one* standard. There are dominant hegemonic standards and marginalized counter-standards. Your speech acknowledges this in section three, but be aware that a strict contextualist might argue you can't judge him by "his time's standards" if those standards weren't monolithic.
  2.  **Were those standards themselves bad?**
      *   *Status:* This is the **Moral Judgment** debate. For a long time, professional historians were trained to avoid this (the "is-ought" problem). The consensus has shifted significantly in the last 20 years. Most historians now agree that we *can* and *should* make moral judgments, provided we don't let those judgments stop historical inquiry. You are on solid ground here, especially in public history contexts.
  3.  **Was criticism available at the time?**
      *   *Status:* This is your strongest move, theoretically. It aligns with **Internal Critique** and arguments made by scholars like Amartya Sen (who argues that dissent exists in all cultures, even oppressive ones) and moral philosophers like Bernard Williams. It avoids the charge of anachronism (imposing *our* values) by showing that *their* values contained the seeds of the critique.
      *   *The Catch:* This relies on the historical fact that dissent *actually existed*. In your specific case (Victorian child labor), this is empirically true (Shaftesbury, the Sadler Committee, etc.). If you were doing this for a figure where dissent was genuinely suppressed or non-existent, this argument would be harder to sustain.

  **Where the Speech Takes Liberties**
  *   **Simplification of "Choice":** The speech implies [Name] had a clear choice to listen to the critics. In reality, economic structures often constrain even wealthy industrialists. A Marxist historian might argue his class position made it structurally impossible for him to act otherwise, regardless of available criticism. The speech sidelines this structural determinism to focus on moral agency, which is a deliberate rhetorical choice.
  *   **The "Best Standards" Claim:** In the third section, the speech says we judge him by "the best standards of his own time." This is a normative claim, not a historical one. Who decides which standards were the "best"? The speech glosses over this selection process to make a clean moral point.
  *   **Consensus vs. Conflict:** The speech presents the three questions as a logical progression that resolves the tension. In reality, these three questions often contradict each other in historiography. You are presenting a *synthesis* as a *method*.

  **Bottom Line:**
  You are not inventing this out of thin air. You are synthesizing Contextualism (Q1), Moral Realism (Q2), and Internal Critique (Q3). It is a defensible, sophisticated position. Just be prepared if a faculty member asks, "But how do you define which contemporary voices count as the 'available' standards?" Your answer is: "The ones that argued for the humanity of the workers, which we now recognize as the moral baseline." That holds up.
