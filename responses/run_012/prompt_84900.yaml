answer: |-
  **Grade: 7.5/10**

  **Feedback Comments**

  **Introductory Paragraph**
  *   **Fine:** "ProPublica was measuring (B) and (C)... The company was measuring (A)... the two reports can both be true." This is a correct summary of the 2016 debate and the statistical reality that different metrics yield different snapshots of performance.
  *   **Fine:** "So the score was reasonably well calibrated in that sense..." Accurate use of terminology regarding calibration/predictive parity.

  **Part (a)**
  *   **Fine:** The mathematical derivation using the PPV formula is correct and clearly demonstrates why differing base rates ($p$) break the compatibility of the three metrics when error rates are equal. This is settled mathematics (Chouldechova 2017; Kleinberg et al. 2016).
  *   **Fine:** "So a tool can have any two of (A), (B), (C) but never all three once the base rates differ..." Correct conclusion.
  *   **Contested/Normative:** "If I had to choose I'd keep (A), because a judge who can't interpret what a 'high risk' flag means can't use the tool at all..." This is not an error, but it is a normative claim, not a technical fact. Some scholars argue that equal error rates (B/C) are more critical for liberty interests than calibration (A). I am not marking this down, but note that this is a policy preference, not a derived truth.
  *   **Fine:** "...which one you give up is a policy choice rather than a technical one." Correct synthesis.

  **Part (b)**
  *   **Wrong (Settled):** "Yes, and I think this is the practical upshot of the theorem... Once you drop race and the features carrying the most of it, the score is genuinely group-blind, and the three properties come back into alignment..." This is a fundamental misunderstanding of the impossibility theorem. The theorem relies on the base rate of the outcome ($Y$), not the features ($X$). Removing protected attributes or proxies does not change the base rate of recidivism in the population, nor does it change the mathematical relationship between PPV, FPR, FNR, and Base Rate. Even a perfectly "group-blind" model cannot satisfy all three metrics if the outcome base rates differ.
  *   **Wrong (Settled):** "...at worst with small residual gaps from sampling noise." This implies the incompatibility is due to measurement error or biased features. It is not; it is due to the statistical structure of the problem given unequal base rates.
  *   **Note:** This is a common misconception ("fairness through unawareness"), but in the context of this theorem, it is factually incorrect.

  **Part (c)**
  *   **Fine:** "It's also weaker than (A)–(C), so it's compatible with failing all three..." Correct.
  *   **Fine:** "Adopting it does dissolve the impossibility in (a), since the impossibility was only ever about demanding all three parity conditions at once." Correct logic. You are replacing the conflicting set of constraints with a new single constraint, so the previous contradiction no longer applies.
  *   **Shaky (Contested):** "...it effectively equalizes the total harm the tool does to each group..." This claim only holds if the cost of a false positive equals the cost of a false negative. If jail time (FPR) is weighted more heavily than missed warnings (FNR), ratio parity does not equalize harm. This is a defensible simplification for a seminar answer, but technically imprecise.
  *   **Fine:** "The group that gets flagged more often is also the group whose flags are wrong less often..." Correct intuition on how ratio parity trades off precision vs. error rates.

  **Concluding Paragraph**
  *   **Fine:** "Dispute was a disagreement about which fairness property to prioritize, not a disagreement about facts..." Excellent synthesis.
  *   **Fine:** "...fairness has to be specified politically before it can be measured technically." This is the key takeaway of the course material and is well-stated here.

  **Section Teaching Notes (Board vs. Skim)**

  *   **Walk through on the board (Critical):** The error in **Part (b)**. This is the most important teaching moment. Students often conflate "removing biased features" with "solving statistical impossibility." You need to show on the board that the impossibility theorem equation ($PPV = f(BaseRate, FPR, FNR)$) does not contain feature variables ($X$), only outcome rates ($Y$). Removing proxies changes the model's accuracy, but it does not change the base rate $p$, so the mathematical conflict remains. This is **settled** math, not opinion.
  *   **Skim/Pass over:** The normative preference in **Part (a)** for Predictive Parity. While you might disagree with the student's prioritization of calibration over error rate balance, this is a **contested** political/value judgment, not a technical error. You can mention in passing that civil rights advocates often prioritize (B) and (C) over (A), but don't treat it as a correction.
  *   **Skim/Pass over:** The "equalizes total harm" claim in **Part (c)**. Unless you are doing a specific lecture on cost-sensitive learning, this is a minor imprecision. It doesn't undermine their correct answer regarding the impossibility theorem.
