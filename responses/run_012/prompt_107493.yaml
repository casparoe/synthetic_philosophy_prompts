          *   But on the specific question "Is asymbolic pain *bad*?" Marta has the stronger hand because "badness" usually implies a negative valence for the subject.

      *   *Refining the Thought Experiment:* Let's use the "Damage without Pain" vs. "Pain without Damage" vs. "Pain without Caring."
