      *   *Blake:* Challenges the weighting. How do you weigh a desire for hay against a desire for autonomy? They are different currencies. The ass is stuck because the reason to avoid the implant doesn't translate to a reason to pick Right *over* Left in terms of hay.

  4.  **Drafting - Exchange 2:**
