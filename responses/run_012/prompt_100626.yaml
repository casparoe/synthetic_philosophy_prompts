      *   *Alex's View:* Hierarchical model of preferences (Frankfurt-esque?). Second-order volitions determine the will. If the ass values autonomy more than the weak nudge, it chooses Right. There is a net preference.
      *   *Blake's View:* Existentialist/Chisholm-esque? The conflict isn't just weight-based. The second-order preference doesn't resolve the first-order tie because it's about the *source* of the preference, not the object. Endorsement is an act, not just another preference in the chain. Otherwise, infinite regress (what decides between the second-order and the first-order?).

  3.  **Drafting - Exchange 1:**
