answer: |-
  The slogan is almost universally wielded as a metaphysical veto against reductionism, but it is only strictly defensible as a trivial mathematical observation or an epistemic heuristic, rendering most uses either confused or rhetorically inflated.

  **(a) The Additive Reading**
  *Claim:* The magnitude of a social property $P$ in the whole is not equal to the arithmetic sum of $P$ in the isolated individuals.
  *Truth:* True for most social properties (e.g., price level, panic), false for others (e.g., total income, population count).
  *Status:* Platitude.
  *Work:* It blocks naive aggregation but does not block reduction; non-linearity is compatible with micro-foundations.
  *Measure:* Undefined for properties like "legitimacy," trivial for "income."

  **(b) The Relational Reading**
  *Claim:* The "parts" are not bare individuals but individuals-plus-structures, so the whole contains information absent from isolated atoms.
  *Truth:* True by construction.
  *Status:* Platitude.
  *Work:* Dissolves the conflict if methodological individualists accept relations between individuals as part of the base (which they usually do).

  **(c) The Explanatory Reading**
  *Claim:* Macro-level descriptions are indispensable in practice because deriving them from individual-level data is computationally intractable or cognitively inaccessible.
  *Truth:* True.
  *Status:* Substantive Thesis (Epistemic).
  *Work:* Justifies the autonomy of social science methodology without denying ontological reductionism.

  **(d) The Semantic Reading**
  *Claim:* Social predicates are multiply realizable in individual-level facts, so no strict bridge laws connect the two vocabularies.
  *Truth:* Contested (depends on the strictness of "law").
  *Status:* Substantive Thesis (Philosophy of Science).
  *Work:* Blocks inter-theoretic reduction (deriving social laws from psychological laws) but leaves ontological reduction intact.

  **(e) The Ontological Reading**
  *Claim:* There can be a difference in social facts without any difference in individual facts (failure of supervenience).
  *Truth:* Generally considered False by physicalists and most reductionists.
  *Status:* Radical Thesis (Metaphysical).
  *Work:* Only this reading truly refutes the claim that social facts are "nothing over and above" individual facts.

  **(f) The Causal Reading**
  *Claim:* Social properties have causal powers of their own that are not exhaustively constituted by the causal powers of the individuals.
  *Truth:* Contested (depends on whether realized causation counts as "own").
  *Status:* Substantive Thesis (Metaphysical).
  *Work:* Supports downward causation; often used to imply ontological independence even if supervenience holds.

  **(g) The Compression Reading (Yours)**
  *Claim:* The macro-description is a lossy or lossless compression of micro-facts, admitting a shorter accurate description than the micro-list.
  *Truth:* True (Information Theory).
  *Status:* Substantive Thesis (Epistemic/Informational).
  *Work:* Explains the utility and "emergence" of macro-terms without denying reducibility; frames "greater than" as "more efficient than."

  **Analysis of Usage and Conflict**

  **Likely Intent:** Users of the slogan almost certainly intend to assert (e) or (f) (ontological or causal autonomy) but rely on the intuitive plausibility of (a) or (b) (non-additivity or relations) to carry the argument. They conflate the failure of simple summation with the failure of supervenience.

  **Refutational Power:** Only (e) refutes the ontological reductionist claim that social facts are nothing over and above individual facts. (d) refuces theory reduction. (a), (b), (c), and (g) are fully compatible with reductionism and therefore fail to refute the methodological individualist's core ontological position, though they may refute the *practicality* of their program.

  **Tensions:** (b) is in direct tension with (e); if the whole is just parts plus relations, and relations are facts about individuals, supervenience holds. (g) and (c) are in tension with (e) and (f) only if the latter are interpreted as denying that macro-causes are realized by micro-causes; otherwise, they are compatible complements (one explains utility, the other metaphysics).

  **Fallacy of Composition:** The Additive Reading (a) is merely the familiar warning about the fallacy of composition. It is a claim about invalid inference (you cannot infer whole-properties from part-properties directly) rather than a claim about what exists. Most forum users treat this inferential warning as proof of ontological independence, which is the category error driving the confusion.
