answer: |-
  Here is the 90-minute battle plan.

  ### 1. The First Thing to Land: The "Because" Trap
  **What it is:** Do not start with ontology ("You don't exist"). Start with syntax. Point out that literary fiction is addicted to the word *because* when describing motivation. *"She left the room because she was proud."* *"He stayed because he was loyal."*
  **Why this first:** The "obvious" entry point is usually *Anicca* (impermanence/change). Do not use that. If you start with "everything changes," writers hear "characters evolve." That reinforces the idea of a continuous entity undergoing modification (the River trap). You need them to feel that the *link* between the trait and the action is a fabrication.
  **The Landing:** You must establish that the "Self" is not the *cause* of the action, but the *story told about* the action after it happens. The self is a retrospective narrative, not a prospective engine. If this lands, "no-self" stops sounding like nihilism and starts sounding like a craft note on subtext.

  ### 2. The Single Example: The Press Release
  **The Case:** Discard the Chariot (too mechanical, implies a builder) and the River (too continuous, implies a substance that flows).
  **The Replacement:** **The Corporate Press Release.**
  **How it works:**
  *   **The Event:** A company (the aggregate of conditions: market forces, employee moods, cash flow, supply chains) makes a decision to merge.
  *   **The Press Release:** The PR department issues a statement: *"CEO John Smith decided to merge because he is visionary."*
  *   **The Anatta Move:** The writers must see that "John Smith" didn't decide. The conditions collided, a decision emerged, and *then* the PR department (the mind's narrative function) invented "John Smith" as the agent to make the story digestible.
  **Why it fits this room:**
  *   **It has:** Narrative agency, psychological depth (the PR spin), and discontinuity (the conditions are separate from the story).
  *   **It lacks:** A central homunculus. There is no "little man" in the CEO's office pulling levers. There is only the office, the levers, and the memo.
  *   **Why Chariot/River fail here:** The Chariot suggests parts making a whole (mereology), which writers will debate. The River suggests flow, which writers equate with "character arc." The Press Release captures the *fictionality* of the agent without denying the *reality* of the action. It validates their job (writing the press release) while destabilizing the subject (the CEO).

  ### 3. The Fork: Metaphysics vs. Instruction
  **Where it belongs:** **Minute 45 (Immediately after the Press Release example).**
  **Why there:** If you do it before, it's theory. If you do it after, they have just *used* the tool, so they care about the manual.
  **The Move:** Explicitly state: *"We are not here to agree on whether souls exist. We are here to agree on which lens makes the characters bleed."*
  *   **Option A (Metaphysical):** "There is literally no person." (Dead end for fiction).
  *   **Option B (Practical/Two Truths):** "Persons are real conventionally (like money or laws), but they do not survive ultimate analysis."
  **The Instruction:** Tell them to write characters as **Conventional Truths.** Treat the "Self" as a necessary fiction that the character believes in, but which the narrator knows is a Press Release. This creates immediate tension and depth. The character thinks they are the CEO; the reader sees the market forces. That gap is where literary fiction lives.

  ### 4. Misconception Management (The Timing Map)
  You cannot address these all at once. You must intercept them as they arise.

  *   **"No-Self equals Nihilism / Nothing Matters"**
      *   **When:** **Minute 10 (The Intro).**
      *   **The Intercept:** "If there is no self, nothing matters" is the ego's panic response. Correct it immediately: "If there is no fixed self, there is no fixed fate. It means *more* matters, because every condition is causal. You aren't writing puppets; you're writing weather systems."
  *   **"No-Self just means the Self Changes"**
      *   **When:** **During the Press Release Example (Minute 30).**
      *   **The Intercept:** This is the biggest risk. When they say "So the character grows?", stop them. "Growth implies a seed becoming a tree. Anatta implies the seed was a label, the tree was a label, and only the soil and rain were real. Don't write change; write *succession*."
  *   **"It's the same as Parfit's Fission Cases"**
      *   **When:** **If raised during Q&A.**
      *   **The Intercept:** Do not engage the philosophy. "Parfit is interested in survival conditions for ethics. We are interested in the phenomenological texture of the moment. Different tools."
  *   **"If there's no self, why bother writing?"**
      *   **When:** **Minute 80 (The Closing).**
      *   **The Intercept:** Reframe compassion. "We write to show how suffering happens when the Press Release conflicts with the Conditions. We write to help readers loosen their grip on their own Press Releases."

  ### 5. What to Openly Refuse
  At Minute 5, state these boundaries clearly to prevent scope creep:
  1.  **"I am not teaching you to meditate."** This is a craft session, not a retreat within a retreat.
  2.  **"I am not solving the problem of Rebirth or Karma."** Those are soteriological mechanics; we are doing phenomenology.
  3.  **"I am not asking you to believe this about yourself."** I am asking you to try it on your protagonist. Keep it on the page, not in the therapy chair.

  ### 6. The Final Question
  Do not ask "Do you understand?" or "How does this make you feel?"
  Ask this:

  > **"Look at the last scene you wrote where your protagonist made a hard choice. Did you write the *decision*, or did you write the *Press Release* about the decision?"**

  **Why this works:** If they say "The decision," they missed the point (there is no decider). If they say "The Press Release," they understand that the *story* is the rationalization of conditions. If they are silent, they're thinking about their draft. That's a win.
