answer: |-
  The Swedish switch of 1967, *Dagen H*, serves as a rigorous stress test for David Lewis's *Convention* (1969). Lewis defines a convention as a regularity in behavior that solves a recurrent coordination problem, is sustained by mutual expectations and common knowledge rather than authority, and is arbitrary in that an alternative regularity would have sufficed. *Dagen H* was not an organic drift but a state-engineered inversion of a national equilibrium. By mapping Lewis's criteria onto the event, and the event's realities onto Lewis's criteria, we can determine whether the Swedish case fits the theory or breaks it.

  ### From Theory to Case: Applying Lewis

  **The Coordination Problem**
  Lewis's foundational requirement is a coordination problem: a situation where agents prefer to conform if others conform, but there are multiple equilibria. Driving is the paradigmatic example. The problem is avoiding collisions and ensuring flow. In Sweden pre-1967, the equilibrium was Left-Hand Traffic (LHT). Every driver preferred driving on the left conditional on others doing so. The switch to Right-Hand Traffic (RHT) was a move to a new equilibrium. The problem remained identical (coordination); the solution flipped.

  **Status of the Old and New Arrangements**
  Under Lewis's definition, pre-1967 LHT was a perfect convention. It was a regularity, universally expected, and self-policing via the threat of accidents. Post-1967 RHT also qualifies as a convention, but its genealogy is suspect. Lewis argues conventions are sustained by expectation, not authority. Once the switch occurred, RHT was indeed sustained by expectation (drivers today drive right because they expect others to). However, the *establishment* of this expectation relied on the state. Lewis allows that authority can signal a convention, but *Dagen H* suggests authority did more than signal; it enforced a temporary suspension of the coordination game to reset the board.

  **The Arbitrariness Condition**
  Lewis insists a convention must be arbitrary: an alternative regularity $R'$ must exist that would have solved the problem just as well. This is the most contentious point in the Swedish case. By 1967, RHT was arguably *superior* to LHT for Sweden. Most Swedish cars were Left-Hand Drive (steering wheel on the left), optimized for RHT. Furthermore, Sweden was an island of LHT surrounded by RHT neighbors (Norway, Finland), creating border friction.
  Does this external pressure negate arbitrariness? No, provided we define the coordination problem strictly within the population. Within Sweden, LHT *would have worked* indefinitely if maintained. The payoff matrix was skewed by external factors (neighbors, car imports), but the internal coordination logic remained: the specific side matters less than the agreement on *a* side. Thus, the arbitrariness condition holds, though the "cost" of the old convention had risen. The switch was not arbitrary in terms of *policy preference*, but the resulting regularity remains a convention because its stability relies on mutual expectation, not just the intrinsic superiority of RHT.

  ### From Case to Theory: Challenging Lewis

  **Orchestrated Replacement vs. Spontaneous Order**
  Lewis's account implies conventions emerge or shift through a gradual adjustment of expectations, often grounded in precedent. *Dagen H* refutes the idea that conventional change must be spontaneous. The Swedish government did not wait for a critical mass of drivers to drift to the right; they mandated a simultaneous swap. Lewis is silent on the mechanics of moving from one equilibrium to another when the transition period involves high risk (the "valley" between equilibria where expectations are mixed). In Sweden, the state absorbed the transition cost. This suggests that while conventions are *sustained* without authority (as Lewis claims), they may require authority to *migrate*.

  **Manufactured Salience and Common Knowledge**
  For Lewis, common knowledge is the bedrock of convention: I know you know I know we drive on the left. Usually, this accumulates through precedent. In 1967, this common knowledge was manufactured overnight. The "overnight halt," where all traffic stopped for ten minutes, was a piece of theatrical statecraft designed to reset common knowledge. It created a Schelling focal point: "At 05:00, we all switch." Lewis treats common knowledge as a precondition for convention; the Swedish case shows common knowledge can be an *output* of state coordination. The publicity campaign did not just inform; it created the mutual expectations required for the convention to exist.

  **The Role of Law and Enforcement**
  Lewis distinguishes convention from law, arguing law often codifies pre-existing conventions or solves coordination problems by creating common knowledge. However, he downplays the coercive element. In Sweden, the law was not merely a signal; it was a constraint. During the transition, deviation was not just dangerous; it was illegal and policed. The "regularity" was not initially sustained by the preference to coordinate, but by the threat of fines and the physical halt of traffic. Lewis's account struggles to categorize a regularity that begins as a legal mandate and *becomes* a convention only after the mandate recedes into the background. The Swedish case blurs the line Lewis draws between "convention" and "law-imposed regularity."

  **The Impossibility of a Partial Switch**
  Lewis's theory allows for local conventions (e.g., different dialects in different regions). Traffic, however, is a binary, network-wide constraint. A partial switch is a coordination failure (accidents). This highlights a limitation in Lewis's treatment of "population." For a convention to hold in this context, the "population" must be the entire jurisdiction simultaneously. Lewis's framework, which often relies on iterative interactions among smaller groups, does not fully account for "big bang" changes where the cost of being in the minority during the transition is catastrophic.

  ### Verdict: Refinement, Not Refutation

  The episode **refines** Lewis's account, but it does so by exposing a critical blind spot regarding the *dynamics of transition*.

  It does not **refute** Lewis because the end state (RHT in Sweden) satisfies all his criteria: it is a regularity, sustained by mutual expectation, solving a coordination problem, and arbitrary in the sense that LHT would have worked internally. The *nature* of the convention remains Lewisian.

  However, it does not merely **confirm** him, as the *process* violates the spirit of his genealogy. Lewis presents conventions as solutions that agents stumble into to save on negotiation costs. *Dagen H* shows that in complex modern societies, conventions can be designed artifacts. The state did not just solve a coordination problem; it solved a *transition* problem that the market of expectations could not solve on its own.

  Therefore, the verdict is that Lewis's account is **statically correct but dynamically incomplete**. It accurately describes the *ontology* of a convention (what it is) but fails to account for the *logistics* of conventional migration (how it changes) when authority intervenes.

  ### What a Theory of Convention Change Must Add

  To accommodate *Dagen H*, a theory of convention must add three elements to Lewis's framework:

  1.  **Transition Costs:** Lewis assumes agents can drift to a new equilibrium. A theory of change must account for the "valley" where expectations are misaligned. It must explain how agents overcome the temporary spike in coordination costs (the risk of accidents during the switch) that prevents organic migration.
  2.  **Focal Point Engineering:** Lewis treats salience as given (e.g., "meet at noon"). A theory of change must explain how salience is *manufactured*. The state acted as a "common knowledge engine," using propaganda and synchronized timing to create a focal point that did not exist naturally.
  3.  **The Law-Convention Continuum:** Lewis draws a sharp line between law and convention. *Dagen H* shows they are phases of the same regulatory substance. A robust theory must treat legal mandates as *provisional conventions* that harden into Lewisian conventions once the enforcement mechanism becomes redundant to the mutual expectation.

  In conclusion, *Dagen H* confirms that traffic rules are Lewisian conventions in equilibrium, but refutes the notion that such conventions must arise or shift without central orchestration. It forces us to accept that while conventions are sustained by expectation, they may be born by decree.
