answer: |-
  Good morning.

  It feels strange to stand up here in June, with the windows open, knowing that the sound we're missing is the mill. For a hundred and twenty years, that hum was the background noise of this town's history. It was the reason the roads were paved, why the school was built, why most of our families came here in the first place. When a thing like that goes silent, it feels like an ending. It feels like a collapse.

  I teach history. So naturally, when I heard the news, I did what I do: I went to the books. I spent the last few months reading about the Bronze Age, about the Classic Maya, about the stories we tell regarding Easter Island. I was looking for an honest way to talk to you about what happens when the world you know stops working.

  I want to be careful with words today. I know there are people in this audience who know the literature, who know that "collapse" is a messy, contested term. Archaeologists and historians argue fiercely about what it means when a society "ends." Did the Maya vanish? No. They are still here. Did the people of Easter Island destroy themselves? The story is far more complicated than the moral lesson we were taught in school. So I am not standing here to tell you that history repeats itself, or that we are following a blueprint drawn three thousand years ago.

  But I did find a distinction in all that reading that I think matters for us, right now, in this gymnasium.

  There are two ways a society can end. The first is the one we see in movies. It's depopulation. It's famine, plague, war. It's when the people are physically gone, and all that's left are ruins for someone else to find. That is a catastrophe. It is absolute.

  But there is a second kind. This is when the people are still here. They are still farming, still building, still showing up to work. But the thing that made them a *society*—the shared agreement about who owes what to whom, who is in charge, what next year is supposed to look like—that thing evaporates. The structure remains, but the load-bearing walls of meaning are gone.

  My gut tells me this is the harder kind to live through. When a city is burned to the ground, you know you have suffered a loss. You can point at the ashes. But when the people are still here, and the buildings are still standing, but the promise that held them together is broken… there are no ruins to point at. The ruins are invisible. They are in the expectations we no longer share. They are in the quiet realization that the script we were handed no longer matches the stage we're standing on.

  That is what losing the mill feels like. We are not depopulated. We are not gone. But the agreement we had—that hard work here leads to security there, that this town exists for this purpose—that agreement has dissolved. And because there are no physical ruins, it is harder to mourn. We don't know how to grieve a change in the weather.

  I tell you this not to depress you, but to validate what you are feeling. If you feel unmoored, it is because you are. If you feel like the ground has shifted even though the floor looks the same, you are right.

  But here is the thing about that second kind of change. When the structure dissolves, it means the people remaining are the only things left holding the weight.

  Most of you are leaving this town. Some of you are going to college, some to trade schools, some to jobs in places that don't know your name. You are moving into a world that feels increasingly like this second kind of collapse. Old institutions are shaky. Old promises are broken. You cannot rely on the idea that someone else has already built the floor beneath you.

  So, my charge to you is not to go out there and "change the world." That is too big, and too vague. My charge to you is to notice when the invisible ruins are forming around you. Notice when the shared expectations break down. And instead of waiting for a new mill, or a new savior, or a new script to be handed to you, you become the architects of the new agreement.

  Society isn't a building you inherit. It's a verb. It's the act of deciding, every day, who you owe something to, and who you can trust to owe something back. If the old definitions of community are gone, you have to write the new ones. You have to decide what resilience looks like when there's no guarantee of return.

  The historians I read argue about whether the past societies survived. But I think the answer lies in whether the people decided to keep making meaning together after the structure failed.

  You are the Class of 2024. You are graduating into a time when the old maps don't match the terrain. That is frightening. But it also means you are not bound by the old borders. You don't have to wait for the town to decide what it is. You don't have to wait for the economy to decide your worth.

  The mill is quiet. The building is still there. But the town isn't the building. The town is the agreement we make to stand here together. That agreement is now yours to write. Don't look for the ruins. Look at each other. Build the floor.

  Thank you.
