answer: |-
  **Project Title:** The Option-Set Interpretation of Good's Theorem: Limits and Boundary Conditions

  **Principal Investigator:** [Name]
  **Duration:** 6 Months (0.5 FTE)

  **1. Problem Statement and Research Question**
  Good's Theorem (1967) is a cornerstone of decision theory, demonstrating that for a Bayesian agent, the expected value of free, relevant information is non-negative. In normative discourse, this mathematical result is frequently conflated with a broader heuristic: that gathering more evidence is never instrumentally harmful. While the theorem is mathematically sound under its specific axioms, its application often extends into domains where those axioms do not hold. Specifically, the theorem assumes a fixed state space, stable preferences, and costless integration of data. In high-stakes decision-making—ranging from medical diagnostics to AI alignment—information often alters the agent's awareness, capabilities, or psychological state, rendering the standard model inapplicable.

  Current literature treats violations of the theorem's assumptions as isolated counterexamples or practical caveats. There is no unified account of *why* the theorem fails outside its domain, nor a precise demarcation of where the "non-negativity" slogan ceases to be a valid guide. This project asks: **Is the non-negativity of information value fundamentally a theorem about epistemic accuracy, or is it a theorem about the enlargement of contingent option sets?**

  **2. Hypothesis and Theoretical Framework**
  The central hypothesis is that Good's result is not primarily about information *per se*, but about the expansion of the set of available contingent plans. Under standard assumptions, receiving information allows an agent to condition actions on states, effectively weakly enlarging the option set. Since a superset of options is at least as valuable as a subset under fixed preferences, the expected value is non-negative.

  If this reading is correct, the "value of information" degrades precisely when the identification between *learning* and *option enlargement* breaks. This project distinguishes three categories of informational change:
  1.  **Epistemic:** Information updating probabilities over a fixed state space (Theorem holds).
  2.  **Structural:** Information altering the available acts or causal structure (Theorem domain violated).
  3.  **Constitutive:** Information altering the agent's preferences, self-trust, or awareness (Theorem undefined).

  The project argues that categories 2 and 3 are not counterexamples to be patched, but distinct phenomena currently smuggled under the label of "information value."

  **3. Methodology**
  The project employs formal reconstruction rather than empirical cataloguing. While a sociological study of how the slogan is misused would document the error, it would not correct the underlying theory. To provide a normative guide for decision-makers, we must identify the precise structural conditions under which the theorem's guarantee collapses.

  **Probe Case 1: The Self-Prediction Oracle.**
  An agent is offered free information from an oracle that predicts which act the agent will subsequently choose. Formally, this information is ignorable; the agent can choose to disregard it. Standard decision theory suggests the value is non-negative. However, if the prediction undermines the agent's sense of agency or creates a self-fulfilling loop, the utility may be negative. This case tests whether the theorem can accommodate information about the *deliberative process* itself, or if it requires the object of learning to be external to the choice function.

  **Probe Case 2: Awareness Growth.**
  An agent learns of a possibility they previously could not conceive (e.g., a new disease vector or a novel financial instrument). In standard Bayesianism, the state space is fixed; one cannot condition on a null event. If the "new" information creates a new partition element where no act was previously defined, the expected value calculation is not merely negative—it is ill-formed. This case tests the boundary where "updating" becomes "ontology revision."

  **4. Work Plan (6 Months, 0.5 FTE)**
  *   **Month 1: Formal Reconstruction.** Axiomatize the "option-set" interpretation of Good's Theorem. Define the necessary and sufficient conditions for information to map strictly to option-set enlargement.
  *   **Month 2: Probe Case 1 (Agency).** Model the Self-Prediction Oracle within the reconstructed framework. Determine if standard causal decision theory can resolve the negative value or if a modification to the information node is required.
  *   **Month 3: Probe Case 2 (Awareness).** Formalize the "Unawareness" case using reverse Bayesianism or growing state-space models. Demonstrate where the expected value calculation becomes undefined.
  *   **Month 4: Synthesis.** Integrate findings to draft a demarcation criterion. Define the "Domain of Validity" for the non-negativity slogan.
  *   **Month 5: Drafting.** Write the manuscript for submission to a journal such as *Philosophy of Science* or *Synthese*.
  *   **Month 6: Revision.** Peer review simulation, refinement of proofs, and final formatting.

  **5. Success and Failure Criteria**
  *   **Success:** A formal proof showing that non-negativity holds if and only if information maps to a superset of contingent plans under fixed preferences. A published paper delineating the "Domain of Validity."
  *   **Failure:** If the option-set reading proves to be a trivial restatement of existing results, or if the probe cases can be fully absorbed into standard Bayesian models without structural modification. In this event, the output will be a negative result clarifying the robustness of the standard model.

  **6. Scope and Feasibility**
  At 0.5 FTE over six months (approx. 120 hours of research time), this scope is limited to a single, rigorous theoretical paper. It is not sufficient for a multi-case empirical study or a comprehensive historical review. This constraint is intentional: the field requires a precise theoretical correction rather than a broad survey. The deliverable is one high-quality manuscript. If the formal reconstruction reveals deeper complexities than anticipated, the scope will be narrowed to fully resolving Probe Case 1, leaving Case 2 for future work.

  **7. Significance and Impact**
  The slogan "evidence cannot hurt" is frequently deployed to terminate deliberation in policy and personal contexts, justifying endless data gathering or dismissing the costs of psychological burden. By clarifying that Good's Theorem is a claim about *option sets* rather than *evidence*, this project provides decision-makers with a criterion to identify when information gathering is instrumentally risky. This has immediate relevance for AI safety (where agents must decide whether to modify their own code), medical ethics (right not to know), and public policy (costs of awareness). Correcting this foundational heuristic prevents the misapplication of a mathematical truth to problems it was never designed to solve.
