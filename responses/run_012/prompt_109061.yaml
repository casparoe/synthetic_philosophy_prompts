answer: |-
  Your view is a classic formulation of **Non-Cognitivism**, and the trouble you have identified is the **Frege-Geach Problem**. Your attempt to solve it by making logic operate directly on attitudes is the standard expressivist move, but it fails to fully satisfy verdicts (3), (4), and (5) without further modification. To save the core insight (Verdict 7) while respecting the linguistic data (Verdicts 1–4, 6), you must adopt **Quasi-Realism**. This view earns the right to talk of truth and belief within an expressivist framework by adopting a deflationary theory of truth.

  Here is the single principle that repairs your view, followed by the necessary sacrifice and the prediction for your new case.

  ### The Principle: Disciplined Normative Expressivism

  1.  **Clause 1 (The Core):** The semantic function of an atomic moral sentence is to express a conative attitude (a stance of acceptance or rejection) rather than to describe a mind-independent fact.
      *   *Forced by Verdict (7):* This preserves your commitment that moral assertion is fundamentally about being moved or taking a stand, not merely mapping the world.
  2.  **Clause 2 (Univocality):** The content expressed by a moral sentence remains constant whether it is asserted outright or embedded in complex constructions (conditionals, negations, etc.).
      *   *Forced by Verdict (2):* This prevents equivocation and ensures the argument is not a pun.
  3.  **Clause 3 (Logical Structure):** Logical operators (if, not, or) operate on the contents of these attitudes in a way that preserves validity relations identical to truth-functional logic.
      *   *Forced by Verdict (1):* This secures the validity of modus ponens as ordinary logic, not a special practical inference.
  4.  **Clause 4 (Minimal Truth):** Moral sentences are truth-apt in a deflationary sense; to say "‘Lying is wrong’ is true" is to do no more than re-assert the attitude expressed by "Lying is wrong."
      *   *Forced by Verdicts (3) and (4):* This allows negation and disjunction to have truth values and behave truth-functionally without requiring moral facts to exist in a robust, descriptive sense.
  5.  **Clause 5 (Content Identity):** The content of a moral question is identical to the content of its corresponding assertion; asking is querying the appropriateness of the attitude.
      *   *Forced by Verdict (6):* This ensures the interrogative and declarative share semantic content.

  ### The Casualty: Verdict (5)

  This principle cannot accommodate **Verdict (5)** as you have stated it. You must abandon the claim that Marta "takes the world to be a certain way."

  **Why:** Your core commitment (Clause 1/Verdict 7) is that moral judgments are attitudes, not descriptive beliefs. Verdict (5) defines belief robustly as "taking the world to be a certain way" (a cognitive state representing reality). Quasi-Realism allows us to say "Marta believes lying is wrong" is true, but only because "belief" in this context is deflationary—it means "Marta holds the attitude." It does *not* mean she represents a moral fact. If you keep the clause "takes the world to be a certain way," you collapse into Moral Realism and lose Verdict (7). To keep the view that moral talk is essentially attitudinal, you must deny that moral belief is a descriptive map of the world.

  **Recommendation:** Abandon the explanation in (5), not the ascription. Keep "Marta is in a genuine belief state" (understood deflationarily), but reject "she takes the world to be a certain way."

  ### The Supposition Case

  **Case:** "Suppose lying is wrong; then what you did last night was wrong."

  **Prediction:** The principle predicts that the speaker is **not** asking the listener to imagine a descriptive fact about the universe. Instead, the speaker is inviting the listener to **hypothetically adopt the attitude** of being against lying.

  **Defense:** On Disciplined Normative Expressivism, supposition is the hypothetical adoption of a commitment. When you say "Suppose P," you are saying "Temporarily hold the attitude expressed by P." The inference ("then what you did...") is valid because, given the logical structure of attitudes (Clause 3), holding the attitude *against lying* rationally requires holding the attitude *against what you did* (assuming what you done involved lying). The "truth" of the conclusion in this context is just the correctness of adopting the resulting attitude given the hypothetical commitment. This preserves the logic without positing hypothetical moral facts.

  ### Summary of the Repair

  You cannot have your initial view (no truth values) and Verdicts (3) & (4). The **best repair** is to accept **deflationary truth**. This saves the logic and the embeddings without forcing you to admit moral facts. However, this repair forces you to reinterpret "belief." You must choose between a robust description of belief (Verdict 5) and the attitudinal nature of moral judgment (Verdict 7). Since Verdict 7 is the motivation for your view, **Verdict 5 is the one to abandon.** This yields a consistent Quasi-Realist position: moral sentences express attitudes, but they behave *as if* they were truth-apt, allowing logic to function normally, provided we do not mistake that "truth" for descriptive representation.
