answer: |-
  ### Exam Question: Causal Inference (Final Module)

  **Question 4 (20 Marks)**

  A clinical trial compares two treatments (A and B) for a chronic condition. The outcome is Recovery (Yes/No). Patients are categorized by "Stage" (1 or 2). The data are presented below:

  | | **Stage 1** | **Stage 2** | **Pooled** |
  | :--- | :---: | :---: | :---: |
  | **Treatment A** | 60/100 (60%) | 1/10 (10%) | 61/110 (55.5%) |
  | **Treatment B** | 7/10 (70%) | 20/100 (20%) | 27/110 (24.5%) |

  Within both Stage 1 and Stage 2, Treatment B has a higher recovery rate. However, in the pooled data, Treatment A has a significantly higher recovery rate.

  A junior analyst claims: *"Simpson's Paradox is present. We must always stratify by Stage to find the true causal effect. Therefore, B is causally superior."*

  Using causal diagrams (DAGs) and the potential outcomes framework, evaluate this claim. Specifically:
  1.  Demonstrate why the numbers alone cannot determine the causal effect.
  2.  Describe the causal structure under which the stratified estimate is correct.
  3.  Describe the causal structure under which the pooled estimate is correct.
  4.  Conclude whether the analyst's statement is valid.

  ***

  ### Model Answer

  The data exhibit Simpson's Paradox: the association reverses direction when aggregating across levels of "Stage." Treatment B is superior within strata (70% vs 60% in Stage 1; 20% vs 10% in Stage 2), but Treatment A is superior in the aggregate (55.5% vs 24.5%). The junior analyst's claim that we *must* stratify is incorrect because statistical association does not equal causation. The correct estimate depends entirely on the causal role of "Stage," which the table alone does not specify.

  **Case 1: Stage is a Pre-Treatment Confounder**
  Suppose "Stage" represents baseline disease severity determined *before* treatment assignment. If doctors assign sicker patients (Stage 2) preferentially to Treatment B, Stage is a common cause of Treatment and Recovery ($Stage \rightarrow Treatment$, $Stage \rightarrow Recovery$).
  *   **DAG:** $Stage \rightarrow Treatment \rightarrow Recovery$ and $Stage \rightarrow Recovery$.
  *   **Analysis:** There is a backdoor path ($Treatment \leftarrow Stage \rightarrow Recovery$) creating non-causal association. To identify the Average Causal Effect (ACE), we must block this path.
  *   **Verdict:** We **must stratify** (adjust) for Stage. The stratified weighted average indicates B is better. The pooled estimate is biased because Treatment A benefited from having more patients in the easier Stage 1. Under this assumption, the analyst is **correct**.

  **Case 2: Stage is a Post-Treatment Mediator**
  Suppose "Stage" represents a physiological response measured *after* treatment administration (e.g., tumor shrinkage). Treatment A might successfully move patients from Stage 2 to Stage 1, thereby improving recovery. Here, Treatment causes Stage ($Treatment \rightarrow Stage$), and Stage causes Recovery ($Stage \rightarrow Recovery$).
  *   **DAG:** $Treatment \rightarrow Stage \rightarrow Recovery$.
  *   **Analysis:** Stage lies on the causal pathway. Adjusting for a mediator blocks the indirect effect of the treatment, isolating only the direct effect. If we care about the *Total* Effect of assigning Treatment A vs B, we must not condition on the mediator.
  *   **Verdict:** We **must use the pooled** (marginal) estimate. Stratifying would induce collider bias or block the mechanism by which A works. The pooled data shows A yields more recoveries overall because it improves Stage. Under this assumption, the analyst is **incorrect**; A is causally superior.

  **Conclusion**
  The table provides $P(Recovery | Treatment, Stage)$, but causal inference requires $P(Recovery | do(Treatment))$. Without temporal information establishing whether Stage precedes or follows Treatment, the causal effect is unidentified. The analyst's rule ("always stratify") treats a causal assumption as a statistical theorem. Therefore, the claim is invalid; we cannot determine the superior treatment without knowing the data-generating process.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Identification of the Paradox (4 Marks)**
  *   **2 Marks:** Correctly notes B > A in strata, A > B in pooled.
  *   **2 Marks:** Explicitly states that the reversal is due to the imbalance in sample sizes across stages (A has more Stage 1, B has more Stage 2).
  *   *Mistake:* Simply saying "It's Simpson's Paradox" without noting the sample size imbalance driving the weighting. (-2)

  **2. Confounder Scenario (Confounder DAG + Estimate) (6 Marks)**
  *   **3 Marks:** Draws/describes correct DAG (Stage $\rightarrow$ Treatment and Stage $\rightarrow$ Outcome) OR explicitly states Stage is pre-treatment.
  *   **3 Marks:** Correctly selects the **Stratified** estimate as the causal effect and explains it blocks the backdoor path.
  *   *Mistake:* Treating "stratify" as a default without drawing the confounder structure. (-3)

  **3. Mediator Scenario (Mediator DAG + Estimate) (6 Marks)**
  *   **3 Marks:** Draws/describes correct DAG (Treatment $\rightarrow$ Stage $\rightarrow$ Outcome) OR explicitly states Stage is post-treatment.
  *   **3 Marks:** Correctly selects the **Pooled** estimate as the Total Effect and explains that adjusting blocks the causal pathway.
  *   *Mistake:* Claiming we should still adjust for Stage to "control for noise" even if it is a mediator. (-3)

  **4. Final Verdict & Critique of Analyst (4 Marks)**
  *   **2 Marks:** Concludes that the data table alone is insufficient (unidentified without temporal info).
  *   **2 Marks:** Explicitly rejects the analyst's "always stratify" rule as a category error (confusing statistical adjustment with causal assumption).
  *   *Mistake:* Sitting on the fence (e.g., "Both might be right") without explaining *why* the question is unanswerable given the current info. (-2)
  *   *Mistake:* Agreeing with the analyst simply because stratification is "more rigorous." (-4)

  **General Penalty:**
  *   **-5 Marks:** Reciting the Berkeley admissions story instead of analyzing the provided data structure.
