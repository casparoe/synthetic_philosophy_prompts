answer: |-
  You are quite right to feel that the phrase is doing too much work. In philosophy, we call this a "motte-and-bailey" manoeuvre, though in this case, it is more of a revolving door. Your brother-in-law is using a single sentence to slide between empirical descriptions of the past and normative judgements about the present. It is a rhetorical Swiss Army knife: when one blade breaks, he flips out another.

  Here is the menu you asked for. I have separated the empirical claims (what was the case then) from the normative and metaphysical claims (what we should do or think now), followed by an analysis of how they are smuggled together, the ways the slogan can be turned against itself, and the state of philosophical play.

  ### I. The Empirical Claims (What was the case then?)

  These are claims about history, sociology, and epistemology. They are, in principle, testable against the record.

  **1. The Universal Consensus Claim**
  *   **The Claim:** "Everyone believed X back then; there was no available alternative viewpoint."
  *   **Type:** Empirical/Sociological.
  *   **Plausibility:** Rarely true. Even in highly oppressive societies, there are dissenters, victims, and critics. It is almost always an exaggeration to say *no one* objected.
  *   **Does it support the conclusion?** No. Even if everyone was doing it, it does not logically follow that we should honour it now. Universal participation in a crime does not make it virtuous.

  **2. The Epistemic Limitation Claim**
  *   **The Claim:** "He could not have known better given the information available to him."
  *   **Type:** Empirical/Epistemic.
  *   **Plausibility:** Plausible for some scientific or technical matters; highly dubious for moral atrocities. Moral truths (e.g., "slavery is cruel") are often accessible via empathy, even if not codified in law.
  *   **Does it support the conclusion?** It might mitigate *personal blame*, but it does not justify *commemoration*. We do not keep statues of people simply because they were ignorant.

  **3. The Typicality Claim**
  *   **The Claim:** "He was not an outlier; he was average for his class and station."
  *   **Type:** Empirical/Statistical.
  *   **Plausibility:** Often true. Most people conform to norms.
  *   **Does it support the conclusion?** Weakly. It explains *why* he acted, but does not excuse the action. Being a typical racist does not make racism less harmful to the victims.

  ### II. The Normative & Metaphysical Claims (How do we judge?)

  These are claims about morality, responsibility, and the nature of time. This is where the smuggling usually happens.

  **4. The Anti-Presentist Claim**
  *   **The Claim:** "It is unfair to judge historical figures by moral standards that did not exist or were not dominant in their lifetime."
  *   **Type:** Normative (about fairness).
  *   **Plausibility:** Contested. It is fair to judge actions by their impact, but perhaps unfair to judge *character* by future standards. However, many moral standards (do not murder, do not enslave) claim timeless validity.
  *   **Does it support the conclusion?** Only if you believe statues are about judging character. If statues are about whose values we endorse *now*, present standards are the only ones that matter.

  **5. The Moral Relativism Claim**
  *   **The Claim:** "Morality is time-bound; what was wrong then is not wrong now, or vice versa."
  *   **Type:** Metaphysical/Normative.
  *   **Plausibility:** Highly contested. Most moral realists reject this. Slavery was wrong *then*, even if legal.
  *   **Does it support the conclusion?** If true, it absolves the man. If false (as many argue), it offers no defence.

  **6. The Determinist Claim**
  *   **The Claim:** "He was a product of his circumstances; he could not have helped being who he was."
  *   **Type:** Metaphysical (about free will).
  *   **Plausibility:** Philosophically controversial. If taken seriously, this abolishes moral responsibility for *everyone*, not just historical figures.
  *   **Does it support the conclusion?** It excuses the agent, but it creates a paradox: if he had no choice, he deserves no praise either. You cannot have a hero without free will.

  **7. The Continuity Claim**
  *   **The Claim:** "We benefit from his actions today, so we must accept the moral cost."
  *   **Type:** Normative (about political obligation).
  *   **Plausibility:** Strong. We do live in a world built by these figures.
  *   **Does it support the conclusion?** It supports keeping the statue as a record of complexity, but not necessarily as a tribute. It argues for context, not veneration.

  ### III. The Smuggle: How the Defence Works

  Your brother-in-law's trick is to use the **Empirical Claims** (1, 2, or 3) to prove the **Normative Claims** (4, 5, or 6).

  He argues: *"Everyone did it then"* (Empirical) $\rightarrow$ *"Therefore he couldn't help it"* (Metaphysical) $\rightarrow$ *"Therefore we shouldn't judge him"* (Normative) $\rightarrow$ *"Therefore the statue stays"* (Pragmatic).

  The break in the chain is usually between the first and second link. Just because a view was common (Empirical) does not mean it was epistemically unavoidable (Epistemic) or morally excusable (Normative). Furthermore, even if he is personally excused (Normative), it does not follow that the statue must remain (Pragmatic). We might say, "He was a decent bloke who did terrible things because of his era; we forgive him, but we do not want his likeness on a plinth in 2024."

  ### IV. Turning the Slogan Against Itself

  You asked about readings that invert the defence. These are often more logically robust than the defence itself.

  **1. The Indictment of the Time**
  *   **The Logic:** If "he was a man of his time" is an excuse, it admits the time was morally deficient. To say "he was a man of his time" regarding a slave owner is to say "his time was a time of slave ownership."
  *   **The Turn:** Why are we celebrating the time? If the era was wicked, being a representative man of that era makes him a representative of wickedness. The phrase becomes an indictment of the context, not an absolution of the agent.

  **2. The "Ahead of His Time" Paradox**
  *   **The Logic:** We frequently praise historical figures for being "ahead of their time" (e.g., abolitionists in a slave-owning society).
  *   **The Turn:** If it was *possible* to be ahead of the time, then it was *possible* to not be a "man of the time." The existence of dissenters proves that the dominant morality was not epistemically unavoidable. Therefore, the "Epistemic Limitation Claim" (2 above) collapses. You cannot claim he couldn't have known better if his contemporary, Mr Smith, did know better and said so publicly.
  *   **Can both be true?** Yes, a person can be typical in some views and ahead in others. But accepting that some people *were* ahead undermines the claim that conformity was inevitable.
  *   **Why the asymmetry?** "Ahead of his time" implies agency and moral courage (praise). "Man of his time" implies passivity and determinism (excuse). Using both selectively is inconsistent.

  **3. The Platitude (True but Irrelevant)**
  *   **The Logic:** "Everyone is a person of their time."
  *   **The Turn:** This is trivially true. We are all shaped by our context. But it carries no argumentative weight. It is like saying "he was a human being." Yes, but was he a *good* one? The phrase becomes a conversation-stopper precisely because it is unfalsifiable and vacuous. It acknowledges the obvious to avoid the specific.

  ### V. What is Settled vs. Contested?

  You asked for honesty on the philosophical consensus. Here is the state of play:

  **Settled (or Near-Consensus):**
  *   **The Function of Monuments:** There is a strong consensus in political philosophy that public monuments are not neutral history lessons; they are acts of veneration. They signal who a community values. Therefore, keeping a statue is a normative act, not just an archival one.
  *   **The Existence of Dissent:** Historians generally agree that for almost any major historical injustice, contemporary dissent existed. The "Universal Consensus Claim" is historically fragile.

  **Genuinely Contested:**
  *   **Moral Realism vs. Relativism:** Philosophers still debate whether moral truths are timeless or culturally constructed. If morality is relative, the "Man of his time" defence holds more water. If morality is real and timeless, it holds less. You cannot assume one side has won this argument.
  *   **The Scope of Blame:** There is active debate on "diachronic responsibility." Can we blame the dead? Some argue blame requires the possibility of response, which the dead lack. Others argue blame is about the standing of the victim, not the capacity of the perpetrator.
  *   **Presentism:** Historians argue fiercely about "presentism." Some say judging the past by today's standards destroys historical understanding. Others say refusing to judge is moral cowardice. There is no single "expert view" here.

  ### VI. Closing Note on the Test Cases

  You mentioned Columbus, Jefferson, and Churchill. Without ruling on them, I will note where the logic fits best:

  *   **Columbus:** The "Man of his time" defence fits **worst** here. Even by the standards of 1492, there were contemporaries (including within his own crew and the Church) who objected to the treatment of indigenous peoples. The Epistemic Limitation Claim fails.
  *   **Jefferson:** The defence is **mixed**. He explicitly acknowledged the contradiction of slavery and liberty but failed to act. Here, the "Man of his time" slogan clashes with his own writings, making it a claim about weakness of will rather than ignorance.
  *   **Churchill:** The defence fits **best** in terms of typicality, but fails on the "Indictment of the Time" turn. His views on empire were standard for a British aristocrat of that era. The debate here is less about whether he was a man of his time (he was), and more about whether *that time* is one we wish to signal continuity with today.

  **Summary for Sunday Lunch:**
  If you want to pin him down, do not argue about the statue first. Ask him to define the phrase. Ask: *"Are you saying he couldn't have known better, or that it doesn't matter because everyone did it?"* If he says the former, ask about the dissenters who did know better. If he says the latter, ask why common practice makes a moral truth. Force him to pick a blade from the knife; usually, once they have to choose, the defence falls apart.
