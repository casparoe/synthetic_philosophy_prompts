answer: |-
  This is a productive impasse. The *Historikerstreit* is indeed the stress test these three positions require, precisely because it strips away the alibi of new evidence. As you note, no one alleged document falsification; the archive was stable, but the history was not. This forces the theoretical hand. Below is a mapping of the dispute through your triad, followed by a reverse interrogation of the theories, and finally an assessment of your three criteria of objectivity.

  ### I. Theory Through the Case

  **1. Ranke: The Archive as Tribunal**
  *   **Prediction:** Ranke's model predicts that if the sources are consulted without prejudice, a consensus on "how it essentially was" should emerge. The archive is the neutral ground that adjudicates competing claims.
  *   **Verdict on the Dispute:** By Rankean lights, the *Historikerstreit* represents a failure of scientific history. Both sides claim the authority of the source, yet they produce incompatible truths. Ranke would likely view the conservative position (Nolte/Hillgruber) as the greater deviation, not necessarily because of their politics, but because their method appears teleological (aiming at a "usable past" or "normalization") rather than receptive. However, he would be equally suspicious of Habermas's intervention, which is explicitly present-minded.
  *   **Blind Spot:** Ranke has no vocabulary for this dispute. His model assumes the archive settles disputes. Here, the archive was silent on the *meaning* of the evidence. Ranke cannot explain why two historians reading the same Wehrmacht documents arrive at different moral conclusions. He assumes that if the self is suppressed, the fact speaks. The *Streit* proves the fact does not speak; it is spoken for. Ranke is silent on the hermeneutic gap between document and narrative.

  **2. E.H. Carr: The Dialogue of Present and Past**
  *   **Prediction:** Carr would argue the dispute confirms his thesis: historical facts are not found but made by the questions of the present. Nolte asks, "Can we move on?" Habermas asks, "How do we ensure it never happens again?" The divergence in history is caused by the divergence in the present.
  *   **Verdict on the Dispute:** Carr would likely side with Habermas, not on evidentiary grounds, but on the grounds of historical progress. For Carr, objectivity is not neutrality but the ability to understand the future in light of the present. Habermas's warning aligns with a progressive trajectory; Nolte's normalization aligns with a restorative one.
  *   **Blind Spot:** You identified the crucial friction: Carr assumes a relatively coherent "present" from which the historian speaks. In the *Historikerstreit*, the "present" itself was the battlefield. Both sides were West Germans in the 1980s, sharing a polity but not a political reality. Carr's model struggles to explain a quarrel where the *present* is fractured. If the historian's questions arise from his society, what happens when the society is at war with itself? Carr offers no metric for choosing between competing "presents" other than a vague faith in progress, which the conservatives explicitly rejected.

  **3. Hayden White: Emplotment and Pre-figuration**
  *   **Prediction:** White would argue the dispute is not about facts but about poetic pre-figuration. Nolte and Hillgruber are emplotting the war as a **Comedy** or **Romance** (a story of survival, redemption, and eventual reintegration of Germany into the community of nations). Habermas is emplotting it as a **Tragedy** (a story of irreparable loss and permanent caution) or **Satire** (mocking the attempt to normalize the un-normalizable).
  *   **Verdict on the Dispute:** White vindicates the idea that evidence does not dictate the plot. The same chronicle of 1933–1945 supports both the "singular catastrophe" narrative and the "comparative totalitarianism" narrative.
  *   **Blind Spot:** White's formalism falters when confronted with the *ethics* of emplotment. You ask what White says about historians implicated in the events. White treats emplotment as an aesthetic/moral choice made by the historian *now*. He has little to say about the historian's relationship to the *actors* in the drama. Hillgruber's identification with the German soldiers defending the East is not just a choice of plot; it is a collapse of the distance between the historian and the subject. White's theory is structural; it cannot easily condemn Hillgruber for *which* romance he chose, only note that he chose one. White's framework lacks a normative brake on dangerous emplotments. It explains the mechanism of the dispute but cannot adjudicate the danger.

  ### II. Case Back Through the Theory

  Running the *Historikerstreit* back through these frameworks exposes their structural weaknesses.

  **On White and Relativism:**
  The dispute embarrasses White's claim that he is not a relativist. White insists that while the *story* is chosen, the *chronicle* (the list of events) is real and constraining. In the *Historikerstreit*, however, the choice of story began to alter the chronicle. Nolte's claim that the Gulag caused the Holocaust was not just a plot choice; it was a causal claim about the record. When the emplotment (normalization) requires rearranging the causal weight of the evidence, the distinction between "story" and "chronicle" blurs. The episode suggests that narrative form is not merely aesthetic; it is epistemic. If you plot the Holocaust as a defensive reaction (Nolte), you have changed the ontological status of the event, not just its literary presentation. White's firewall between fact and narrative is too porous to hold against political pressure.

  **On Objectivity and Procedure:**
  The *Historikerstreit* suggests that if objectivity exists, it is not in the finished narrative (White) nor in the archive itself (Ranke), but in the **procedure of argumentation**. Habermas's intervention was effective not because he had better documents, but because he enforced a rule of discourse: that the singularity of the Nazi crimes was a precondition for legitimate public debate in Germany. This points toward a procedural objectivity (intersubjective validation) rather than a substantive one. Ranke and White both miss this. Ranke thinks the source validates; White thinks the poet decides. The *Streit* shows that the *community* decides, through conflict.

  **On Carr's Present:**
  The case demonstrates that the "present" is not a vantage point but a weapon. Carr treats the present as the lens; the *Historikerstreit* shows the present is the stake. This suggests Carr's theory is too pacific. It describes a seminar, not a street fight. A theory of history that cannot account for the weaponization of the present is insufficient for the 20th century.

  ### III. Testing Your Three Criteria of Objectivity

  You propose three possible definitions of objectivity. Let us map the *Historikerstreit* onto them.

  **1. Fidelity to the Surviving Record**
  *   **Who defended it:** Both sides claimed this. Nolte claimed the record showed a causal link between Bolshevik and Nazi crimes. Habermas claimed the record showed the singularity of the industrial extermination of Jews.
  *   **Adjudication by Evidence:** Impossible. As you noted, no documents were falsified. The dispute was over *weight* and *causality*, not existence. The record underdetermines the argument.
  *   **Assessment:** This is the Rankean criterion. The *Streit* proves it is necessary but insufficient. One can be faithful to the record and still produce a lie by omission or emphasis.

  **2. Fidelity to the Questions of One's Own Present**
  *   **Who defended it:** This is the Carr criterion. Stürmer explicitly defended this: "A nation lacking a usable past would be politically weakened." He argued for fidelity to the *needs* of the present (identity formation). Habermas argued for fidelity to a *different* need of the present (democratic vigilance).
  *   **Adjudication by Evidence:** Impossible. This is a political argument, not a historical one. Evidence cannot tell you whether a nation *should* seek normalization or vigilance.
  *   **Assessment:** This criterion admits that history is instrumental. The danger here is that "fidelity to the present" becomes "fidelity to the government of the day" (Stürmer/Kohl). It dissolves history into policy.

  **3. Fidelity to the Shape of the Events Themselves**
  *   **Who defended it:** Habermas implicitly defends this. He argues that the Holocaust *is* singular, that the events *themselves* dictate a specific moral response. He claims the narrative form (Tragedy/Warning) is inherent to the events. Nolte implicitly argues the events fit a different shape (Cycle of Violence/Comparison).
  *   **Coherence:** **This criterion is incoherent.** This is the Whitean critique, and it holds. Events do not have shapes; they have sequences. "Tragedy," "Comedy," and "Singularity" are categories imposed by the observer, not properties of the event like mass or velocity. To claim fidelity to the "shape of the events" is to mask a moral choice as an ontological fact. Habermas is right morally, but he is wrong methodologically if he claims the "shape" is in the past rather than in his judgment of the past.
  *   **Assessment:** While incoherent philosophically, this criterion is operationally necessary. Historians must act *as if* the events have a determinate shape, or else all judgment collapses. The *Historikerstreit* shows that while Criterion 3 is philosophically untenable (White is right), abandoning it entirely leads to a moral vacuum where Nolte's defense of the Wehrmacht is just another "plot."

  ### Conclusion: The Mapping

  The *Historikerstreit* leaves us with a triangulated failure:

  1.  **Ranke** fails because the archive did not settle the dispute. The sources were stable, but the history was not.
  2.  **Carr** fails because the "present" was not a shared vantage point but a contested territory.
  3.  **White** succeeds in explaining the mechanism (emplotment) but fails to provide a normative brake on dangerous plots.

  Regarding your criteria: The dispute shows that **Criterion 1 (Record)** is the baseline floor (both sides claimed it, neither broke it technically), **Criterion 2 (Present)** is the actual engine of the conflict (competing political needs), and **Criterion 3 (Shape of Events)** is the rhetorical mask used to legitimize Criterion 2.

  If there is a lesson for your seminar, it is that objectivity in high-stakes history is not a state of being (Ranke), nor a relationship to time (Carr), nor a poetic choice (White). It appears to be a **regulative ideal maintained by conflict**. Objectivity emerged not from one historian being "right," but from the friction between Habermas and Nolte preventing either narrative from becoming total. The "truth" of the *Historikerstreit* is not in the winner (Habermas is generally viewed as having won), but in the fact that the dispute happened at all. The archive did not speak, but the community of inquiry refused to let the past be closed. That suggests objectivity is not in the history, but in the historiography.
