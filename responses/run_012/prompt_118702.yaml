answer: |-
  Here are the materials for your final-year seminar exam. I have kept the language precise but accessible, ensuring the focus remains on the reasoning rather than bibliographic recall, as requested.

  ### 1. Exam Question

  **Question 4**
  A mining company constructs a tailings pond above a farming valley. Seepage from the pond contains a chemical with two specific effects on the local population:
  1.  **Neurotoxicity:** It causes mild developmental impairment (reduced IQ, intermittent tremor) in children exposed in the womb. These lives are still worth living, but they are worse than they would have been without the exposure.
  2.  **Conception Delay:** It reduces sperm motility in men living downwind, delaying conception in local couples by approximately six months. Because conception timing determines which sperm fertilizes which egg, this delay ensures that children conceived *after* the seepage begins are numerically different individuals from those who would have been conceived had the seepage not occurred.

  Consider two groups of children born in the valley:
  *   **Cohort A:** Conceived *before* the seepage began. They are exposed in the womb.
  *   **Cohort B:** Conceived *after* the seepage began. They are exposed in the womb, but would never have existed at all had the company not polluted the pond.

  (a) Explain why a strict "person-affecting" view of morality (an act is wrong only if it makes some particular person worse off) yields different verdicts for Cohort A and Cohort B. (10 marks)
  (b) The company could have dumped the same waste six months earlier (making Cohort B into Cohort A) or in a different location (preventing all affected children from existing). Given that the physical suffering is identical in all cases, explain why the person-affecting verdict for Cohort B is counter-intuitive. Propose a moral principle that resolves this inconsistency. (10 marks)

  ***

  ### 2. Model Answer

  A strict person-affecting view holds that an action is morally wrong only if it makes some specific, identifiable person worse off than they would otherwise have been. This view relies on a counterfactual comparison: we compare the person's actual state against the state they would occupy had the action not occurred.

  Applied to **Cohort A**, the person-affecting view functions intuitively. These children existed prior to the pollution. In the clean-world scenario, they would have been born healthy. In the actual world, they are born with impairments. Because the same individuals exist in both scenarios, and they are worse off in the actual scenario, the company has clearly harmed them. The verdict is that the company acted wrongly toward Cohort A.

  Applied to **Cohort B**, the view encounters the non-identity problem. These children owe their existence to the pollution-induced delay; had the company acted cleanly, *these specific individuals* would never have been conceived. To determine if they are harmed, we must compare their actual life (impaired but worth living) against their alternative (non-existence). Since a life with mild impairment is generally preferable to never existing, Cohort B is not worse off than they would otherwise have been. In fact, the pollution was a necessary condition of their existence. Therefore, under a strict person-affecting view, the company has not harmed Cohort B, and arguably done them no wrong.

  This creates a morally arbitrary distinction. The biological suffering of a child in Cohort B is identical to that of a child in Cohort A. Furthermore, consider the **timing variation**: if the company had dumped the waste six months earlier, the children currently in Cohort B would have been conceived earlier, becoming Cohort A. They would be the same biological children, suffering the same impairment, but suddenly they would have a valid complaint. It is implausible that the moral status of an act depends entirely on the calendar date of conception. Similarly, in the **location variation**, if the waste were dumped elsewhere, no impaired children would exist. A strict person-affecting view suggests this is morally neutral regarding the non-existent children, yet intuitively, a policy that creates impaired people is worse than one that creates healthy people, even if the identities differ.

  The counter-intuitive result arises because the person-affecting view ignores the quality of the future population when identities change. To resolve this, we must adopt an **impersonal principle**, often called the "Same Number Quality Claim." This principle states that if two outcomes result in the same number of people existing, but one outcome involves people with lower well-being than the people in the other outcome, the first outcome is worse, regardless of whether the individuals are identical.

  Under this principle, the identity of the children is irrelevant. What matters is that the company's action resulted in a state of affairs containing more suffering and less capability than the available alternative. The wrong is not that specific individuals were harmed (which is true only for Cohort A), but that the company brought into existence a cohort with diminished quality of life when they could have brought into existence a different cohort with normal health. This captures the intuition that the location and timing of the dump should not absolve the company of responsibility for the predictable suffering their policy causes.

  ***

  ### 3. Marking Scheme

  **Total: 20 Marks**

  | Point | Criteria (4 marks each) | Common Miss / Alternative View |
  | :--- | :--- | :--- |
  | **1. Person-Affecting Definition** | Clearly defines the view: wrongness depends on making a *specific* person *worse off* than in the alternative scenario. | **Miss:** Defines it simply as "harming people" without the counterfactual comparison element. |
  | **2. Cohort A Analysis** | Correctly identifies that Cohort A exists in both scenarios and is worse off in the pollution scenario; harm is established. | **Miss:** Claims Cohort A is also a non-identity case, or fails to note they existed prior to seepage. |
  | **3. Cohort B Analysis** | Correctly identifies that Cohort B would not exist in the clean scenario; compares impaired life to non-existence; concludes no "harm" under strict PAV. | **Miss:** Asserts Cohort B is harmed because they are sick, ignoring the identity shift (begging the question). |
  | **4. Arbitrariness Objection** | Explains why the Timing/Location variations show the PAV verdict is unacceptable (same suffering, different moral verdict based on identity/calendar). | **Miss:** Treats the timing/location as factual details only, without drawing out the moral inconsistency. |
  | **5. Resolution/Principle** | Proposes an impersonal principle (quality of life across outcomes) OR defends PAV by arguing rights are violated regardless of existence. | **Alt:** Smart students may defend PAV by arguing for "rights to a healthy start" that attach to potential persons; award full marks if coherent. |

  **Examiner's Note:** Do not penalize students for failing to name specific philosophers (e.g., Parfit). Reward clear reasoning over terminology. For Point 5, a student who rigorously defends the Person-Affecting View (e.g., by arguing that impersonal principles lead to repugnant conclusions elsewhere) should receive full credit provided they address the arbitrariness objection in Point 4.
