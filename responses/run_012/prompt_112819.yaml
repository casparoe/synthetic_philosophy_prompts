      *   *Key Distinction:* Other arts represent *what* strives (a lion, a hero). Music represents the *striving itself* (the tension, the delay, the resolution, the dissonance, the consonance).
      *   *Structure as Will:* The bass line = lowest grades of will (gravity, mass). The melody = highest grade (intellectual striving). Harmony = the hierarchy of needs.
