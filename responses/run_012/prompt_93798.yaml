answer: |-
  **Variables to Control**
  1.  **Sensory History:** Congenital blindness, no light perception, no sensory substitution.
  2.  **Restoration Timing:** Adulthood (post-conceptual development).
  3.  **Object Geometry:** Distinct 3D shapes (non-cube/sphere).
  4.  **Tactile Duration:** Total time spent exploring.
  5.  **Tactile Kinematics:** Path of contact across the surface.
  6.  **Tactile Dynamics:** Pressure and force profiles.
  7.  **Attentional Load:** Focus on shape identification.
  8.  **Motivational State:** Incentive to perform correctly.
  9.  **Visual Test Protocol:** Matching task procedure.
  10. **Independent Variable:** Motor Agency (Self-generated vs. Externally-generated movement).

  **Decision:** I will vary **Motor Agency**. All other variables, including the precise spatiotemporal patterning of tactile stimulation, will be held fixed between conditions.

  ***

  **(a) The Case**
  Two matched subjects, blind from birth with no light perception and scheduled for adult corneal restoration, are trained pre-surgery to distinguish a 3D-printed helical spring from a coiled ring. In Condition Active, Subject A manipulates the objects freely with both hands for 10 minutes per object. In Condition Passive, Subject B rests their hands stationary while a haptic robot moves the objects against their skin, replicating the exact kinematic trajectories and pressure profiles recorded from Subject A, for the identical duration. Attentional engagement is equated via intermittent verbal probes requiring shape identification during training. Post-surgery, once visual acuity stabilizes, both subjects perform a visual matching task: viewing the objects on a table, they must indicate which visual shape corresponds to the tactile memory formed in their assigned condition.

  **(b) Verdicts and Reasoning**
  *   **Format-neutral:** **Both subjects succeed.** This view holds that shape is represented in an abstract, modality-independent code. Since both subjects received identical tactile stimulation sufficient to encode the shape concept, that concept is immediately available to the visual system upon restoration, regardless of how the tactile data was acquired.
  *   **Modality-specific:** **Both subjects fail.** This view holds that visual concepts must be built from visual experience. Since neither subject has prior visual experience, the tactile concepts acquired (whether actively or passively) share no common code with the new visual input, making cross-modal recognition impossible for both.
  *   **Contingency-learning:** **Subject A (Active) succeeds; Subject B (Passive) fails.** This view holds that knowing a shape is mastering how sensations change under *action*. Subject A learned the sensorimotor contingencies (efferent command → sensory change). Subject B received identical sensory changes but without motor commands, failing to master the object's contingencies as an agent. Thus, only Subject A possesses the knowledge structure transferable to vision.

  **(c) Discriminating Feature**
  The discriminating feature is **Motor Agency** (the presence of efferent motor commands coupled with sensory feedback). This feature does the work because the Contingency-learning view uniquely identifies agency as the necessary condition for acquiring transferable shape knowledge. If this feature is removed (i.e., if both conditions are made Passive), the Contingency view predicts both will fail, causing its verdict to collapse into agreement with the Modality-specific view. If this feature is added to both (i.e., both Active), the Contingency view predicts both will succeed, causing its verdict to collapse into agreement with the Format-neutral view.

  **(d) Limitations**
  This case cannot adjudicate between the **Format-neutral** and **Modality-specific** views. Because both views predict identical outcomes for the Active/Passive contrast (either both succeed or both fail, respectively), the experimental result of the contrast alone cannot distinguish between them. The case is designed solely to isolate the variable of agency to test the Contingency-learning hypothesis against the other two.

  **(e) Strongest Reply to Contingency-learning**
  The strongest reply is to redescribe the Passive condition as **implicitly active**: even stationary hands involve proprioceptive monitoring and micro-adjustments in grip pressure to maintain contact, meaning the subject is still learning a sensorimotor contingency (hand stability → sensory change). However, this reply likely fails under the constraint that **attention is held fixed**. If attention is fixed on shape identification via verbal probing, the subject is tasked with interpreting the sensation, not maintaining grip stability. Furthermore, the robot controls the pressure profiles, removing the subject's agency over even micro-adjustments. Without the ability to generate the change, the subject cannot learn the counterfactual "if I moved X, Y would happen," which is the core of the contingency claim.
