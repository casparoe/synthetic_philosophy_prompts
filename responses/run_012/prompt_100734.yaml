  *(Refining the "Empirical" point)*: The book says Szasz claimed no lesion *has ever been found*. Szasz actually argued that even if one *were* found, it would be a brain disease, not a *mental* illness. The distinction is between the *mind* (abstract) and the *brain* (physical). I need to make sure this nuance lands.

