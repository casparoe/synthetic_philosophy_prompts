      *   *Key Correction:* Make sure to emphasize that Szasz was a *libertarian*, not a "anti-science" crusader. He valued the doctor-patient contract.
      *   *Key Correction on Laing:* Emphasize the split. Szasz wrote "The Myth of Mental Illness"; Laing wrote "The Divided Self." Different projects.
      *   *Key Correction on Empiricism:* Clarify that Szasz argued "mental illness" is a *metaphor*, not a literal disease, regardless of biology.

  6.  **Refining the Argument on "Responsibility":**
