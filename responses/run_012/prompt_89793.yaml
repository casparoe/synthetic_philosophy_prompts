answer: |-
  This is an exceptionally sharp observation for a first-year PhD student. You have correctly identified that the "move" you are describing is not a single statistical theorem, but a hinge point where epistemology, causal theory, and experimental design meet. Your supervisor is gesturing at a standard practice, but you are right to feel that "just Bayesianism" is an insufficient label. Bayesianism provides a *language* for the assumption, but not necessarily the *warrant* for it.

  You are looking for the justification for **default independence**. You want to know when this default is a rigorous inference and when it is a pragmatic gamble.

  There is no single term that captures the entire family of moves you described, but there are three distinct formal frameworks that carve up this territory. Depending on the context (experimental design, physical measurement, or data mining), a different framework provides the "licence."

  Here is the brainstorming and evaluation of the candidate concepts, followed by the synthesis of what is actually happening.

  ### Candidate 1: The Principle of Maximum Entropy (MaxEnt)
  **The Pitch:** This is the strongest formal match for the *epistemic* version of your question.
  **The Theory:** Formulated by E.T. Jaynes. It states that given a set of constraints (e.g., we know the mean and variance of variable $X$ and variable $Y$), you should choose the probability distribution that maximizes Shannon Entropy.
  **Why it fits:** If your only constraints are the marginal distributions of $X$ and $Y$ (i.e., you know nothing about their relationship), the MaxEnt distribution for the joint space $P(X, Y)$ is mathematically guaranteed to be the product of the marginals: $P(X, Y) = P(X)P(Y)$.
  **The "Theorem":** It is a derivable result of the optimization problem. Independence is the unique solution that assumes the least amount of extra information.
  **Where it breaks down:** MaxEnt is purely epistemic. It tells you what you should *believe* given your ignorance. It does not tell you whether the world *is* that way. In your animal lab, MaxEnt justifies your *state of mind* before the experiment, but it doesn't justify the *causal claim* that the treatment caused the outcome. It also requires you to correctly state your constraints; if you miss a constraint (e.g., a hidden batch effect), the MaxEnt derivation is garbage-in, garbage-out.

  ### Candidate 2: The Causal Markov Condition (CMC)
  **The Pitch:** This is the strongest match for the *structural* version of your question.
  **The Theory:** Central to Causal Discovery (Spirtes, Glymour, Scheines; Pearl). In a Directed Acyclic Graph (DAG), a variable is independent of its non-descendants conditional on its parents.
  **Why it fits:** This formalizes your intuition about randomization. Randomization acts as a "surgical intervention" (do-operator) that severs incoming arrows to the treatment node. If there is no path between "Animal ID" and "Outcome" except through "Treatment," the CMC licenses the independence assumption.
  **The "Theorem":** The **d-separation** criterion. If two nodes are d-separated in the graph, they are independent in the probability distribution.
  **Where it breaks down:** The CMC itself is an assumption (the **Faithfulness Condition**). It assumes that all probabilistic independencies are explained by the graph structure. It is possible for variables to be causally connected but probabilistically independent due to canceling paths (e.g., a drug that increases health via mechanism A and decreases it via mechanism B by the exact same amount). The CMC licenses the move *if* the graph is correct, but it doesn't prove the graph is correct.

  ### Candidate 3: Fisherian Randomization Inference
  **The Pitch:** This is the specific justification for your animal lab scenario.
  **The Theory:** R.A. Fisher's original logic for experiments. It does not assume a population model (e.g., "animals are drawn from a normal distribution"). Instead, the probability distribution comes entirely from the randomization procedure itself.
  **Why it fits:** This explains why your animal case feels "earned" while the physics error case feels "assumed." In Fisher's framework, the null hypothesis is that the treatment has *no effect*. The distribution of the test statistic is generated by re-randomizing the specific animals you have.
  **The "Theorem":** The **Randomization Test**. The p-value is exact (non-asymptotic) because it is derived from the combinatorics of the assignment mechanism, not from assumptions about the error terms.
  **Where it breaks down:** It applies strictly to the units in the experiment. Generalizing to a broader population requires an additional assumption (often exchangeability). It also doesn't help you with the "physics error" case where you can't randomize the universe.

  ### Candidate 4: Exchangeability (De Finetti's Theorem)
  **The Pitch:** This is what your supervisor likely meant by "Bayesianism."
  **The Theory:** A sequence of observations is exchangeable if their joint probability is invariant to permutation. De Finetti proved that any exchangeable sequence is mathematically equivalent to drawing from a common distribution with a prior.
  **Why it fits:** This justifies the "i.i.d." (independent and identically distributed) assumption in measurement. You assume the errors are exchangeable; therefore, you can treat them as independent conditional on the underlying parameter.
  **Where it breaks down:** Exchangeability is a subjective judgment. You have to *assert* that the order doesn't matter. In your physics lab, you assert the errors are exchangeable. In your animal lab, randomization *forces* a form of exchangeability on the assignment, which is why it feels more robust.

  ---

  ### The Carving: When is the Licence "Earned"?

  You asked specifically about the difference between "earned" (randomization) and "wishful thinking" (assuming errors are independent). Here is the distinction you are looking for.

  **1. Epistemic Independence (MaxEnt/Indifference)**
  *   **Context:** Data analysis, prior specification.
  *   **Justification:** "I have no information linking these."
  *   **Status:** A heuristic for managing ignorance. It is vulnerable to hidden constraints.
  *   **Example:** Assuming two survey questions are independent because you haven't measured the latent trait linking them.

  **2. Causal Independence (CMC/Randomization)**
  *   **Context:** Experimental design.
  *   **Justification:** "I have physically severed the connection."
  *   **Status:** An ontological claim backed by intervention.
  *   **Example:** Your animal lab. Randomization breaks the backdoor paths. The independence is "earned" because you *made* it true (in expectation) via the design, not because you assumed it.

  **3. Physical Independence (Method of Arbitrary Functions)**
  *   **Context:** Physics, shuffling cards, measurement error.
  *   **Justification:** "The system is chaotic enough that initial conditions wash out."
  *   **Status:** A physical model of the noise generation.
  *   **Example:** Poincaré and Hopf showed that for many physical systems (roulette wheels, gas molecules), if the initial conditions are distributed smoothly enough, the outcome becomes independent of the specific starting state. This justifies the physics lab assumption better than MaxEnt does.

  ### Addressing Your Edge Cases

  **The "Fraud/Coincidence" Case (Look-Elsewhere Effect)**
  This is **not** the same move. This is a **Selection Effect**.
  *   **The Move:** "This coincidence is suspicious."
  *   **The Counter:** "You would have been suspicious of any of 1,000 other coincidences."
  *   **The Logic:** This is about the **Reference Class Problem**. The probability of *this specific* pattern is low; the probability of *some* pattern is high. This isn't about assuming independence; it's about correcting the hypothesis space *after* seeing the data. It is a correction to the p-value, not a prior assumption of independence.

  **The "Digits of Pi" Case**
  This is **Algorithmic Randomness**.
  *   **The Move:** "The digits pass randomness tests."
  *   **The Logic:** The digits are deterministic, but they are **incompressible**. There is no shorter program to generate them than listing them.
  *   **Difference:** This is not about probabilistic independence between variables; it is about the complexity of a single sequence. Treating them as independent samples is a computational shortcut that works because the sequence lacks exploitable structure, but it is philosophically distinct from causal independence.

  ### So, what is the name?

  If you need a label for your reading group, do not use "Principle of Indifference." That is too associated with the paradoxes of assigning priors to outcomes.

  The most precise philosophical term for the move "absence of evidence of connection $\rightarrow$ assume independence" is **The Presumption of Independence** (sometimes discussed under **Defeasible Reasoning** in AI).

  However, the formal justification splits:
  1.  **In Design:** It is **Fisherian Randomization** (creates independence).
  2.  **In Modeling:** It is **Maximum Entropy** (respects ignorance).
  3.  **In Causality:** It is the **Causal Markov Condition** (structures ignorance).

  ### Critique of the Supervisor's "It's just Bayesianism"

  Your supervisor is partially right but imprecise.
  *   **Right:** In a Bayesian framework, you encode this move as a **Prior** that factorizes: $P(\theta_1, \theta_2) = P(\theta_1)P(\theta_2)$. This is the mathematical implementation of the assumption.
  *   **Wrong:** Calling it "just Bayesianism" implies it's a subjective choice. In your animal experiment, the independence is not subjective; it is a property of the **Design**. A Frequentist using Fisher's exact test relies on the randomization, not a prior. A Bayesian analyzing the same data *should* use a likelihood that reflects the randomization. The "licence" comes from the physical act of randomization, which both paradigms must respect.

  ### Summary for your Reading Group

  If you want to raise this without embarrassing yourself, here is the framing:

  > "I've been thinking about the epistemic status of our independence assumptions. It seems like we are conflating three different justifications for treating variables as independent:
  >
  > 1.  **MaxEnt:** We assume independence because we lack information to the contrary (epistemic).
  > 2.  **Causal Markov:** We assume independence because our causal graph says there is no path (structural).
  > 3.  **Randomization:** We *ensure* independence (in expectation) by breaking causal paths physically (design).
  >
  > In the animal experiment, randomization moves us from category 1 to category 3. In the measurement error case, we are stuck with category 1 or a physical argument about chaos (Method of Arbitrary Functions). I'm worried that when we treat category 1 assumptions as if they were category 3 guarantees, we are over-confident in our inferences. Is there a standard way to distinguish these 'earned' vs. 'assumed' independencies in our field?"

  This shows you understand the stats, the philosophy, and the practical implication, without getting bogged down in semantic warfare.

  ### Final Recommendation

  The concept you are hunting is the **Causal Markov Condition** combined with **Fisher's Randomization Logic**.
  *   **MaxEnt** explains why you *start* with independence.
  *   **Randomization** explains why you are *allowed to keep* it as a causal claim.

  The "default" is MaxEnt. The "licence" is Randomization. Confusing the two is where most statistical sins occur. Your intuition that the animal case is "earned" in a way the physics case is not is correct: one is a feature of the world you manipulated, the other is a feature of your model of the world.
