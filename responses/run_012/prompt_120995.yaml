answer: |-
  This is a precise request for a structural mapping between two heavyweight ontologies. Since you are working in foundations, I will skip the introductory padding and treat the universal wavefunction $|\Psi\rangle$ as the fundamental concrete particular, and "branches" (decoherent histories) as the derivative entities corresponding to Lewisian "worlds."

  Here is the translation, the residue report, and the argument regarding their equivalence.

  ### Part 1: The Translation (Claim-by-Claim)

  **1. Worlds are concrete.**
  *   **Lewis:** Worlds are concrete particulars, not abstract sets of propositions.
  *   **Everett:** The universal state $|\Psi\rangle$ is a concrete physical object (ontic wavefunction). Branches are components of this object.
  *   **Fit:** **Clean.** Both reject abstractism. However, Lewisian concreteness implies spatiotemporal extension. Everettian concreteness is Hilbert-space extension. Spacetime is emergent in EQM, fundamental in LMR.

  **2. Worlds are spatiotemporally isolated.**
  *   **Lewis:** No part of $w_1$ is spatiotemporally related to any part of $w_2$.
  *   **Everett:** Branches correspond to orthogonal subspaces in $\mathcal{H}$. Due to decoherence, interference terms in the reduced density matrix vanish effectively ($\rho_{ij} \approx 0$).
  *   **Fit:** **Fudged.** In LMR, isolation is metaphysical necessity. In EQM, isolation is dynamical and contingent. Branches occupy the *same* configuration space; they are superposed, not disjoint. They are "isolated" only relative to the decoherence basis and only for all practical purposes (FAPP). In principle, the Hamiltonian allows re-interference (though practically impossible for macroscopic systems).

  **3. Worlds are causally isolated.**
  *   **Lewis:** No causal influence travels between worlds.
  *   **Everett:** No signaling between branches is possible due to unitarity and the linearity of the Schrödinger equation.
  *   **Fit:** **Clean.** Unitarity enforces causal isolation between orthogonal components just strictly as Lewis enforces it between disjoint sums.

  **4. Worlds are maximal.**
  *   **Lewis:** A world is a maximal mereological sum of spatiotemporally interrelated particulars.
  *   **Everett:** A "branch" is a decoherent history. The "Universe" is $|\Psi\rangle$.
  *   **Fit:** **Fudged.** If "World" = "Branch," it is not maximal; it is a proper part of the concrete whole ($|\Psi\rangle$). If "World" = "$|\Psi\rangle$," then there is only one world (modal actualism), which contradicts the pluralism required for the translation. EQM forces a mereological structure (part/whole) that Lewis explicitly rejects for worlds (they are disjoint sums, not parts of a bigger concrete thing).

  **5. Actuality is indexical.**
  *   **Lewis:** "Actual" refers to the world containing the speaker. All worlds are ontologically equal.
  *   **Everett:** "Actual" refers to the branch containing the speaker's current memory state. All branches are ontologically real.
  *   **Fit:** **Clean.** This is the Saunders-Wallace strength. The "view from nowhere" sees $|\Psi\rangle$; the "view from here" sees a single outcome.

  **6. Every world is of a kind with ours.**
  *   **Lewis:** All worlds are concrete spatiotemporal systems.
  *   **Everett:** All branches evolve via the same Hamiltonian and obey the same dynamical laws.
  *   **Fit:** **Clean.**

  **7. Possibilia aren't abstracta.**
  *   **Lewis:** Possible worlds are real, concrete entities.
  *   **Everett:** Branches are physical states, not mere logical possibilities.
  *   **Fit:** **Clean.**

  **8. Transworld identity gives way to counterparts.**
  *   **Lewis:** I exist in only one world. My counterparts in other worlds resemble me.
  *   **Everett:** Pre-measurement "I" evolves into a superposition of post-measurement "I"s.
  *   **Fit:** **Fudged.** Lewis denies transworld identity to avoid contradictions. EQM *requires* a form of diachronic identity that splits. The pre-branch observer is identical (in a Parfitian sense) to *both* successors. Lewis's counterpart theory is designed to handle similarity across disjoint sets; EQM handles identity across branching vectors. The logic of "I" differs.

  **9. The Recombination Principle.**
  *   **Lewis:** Anything can coexist with anything else (patchwork principle). This generates the plenitude of worlds.
  *   **Everett:** The set of branches is determined by the initial state $|\Psi_0\rangle$ and the Hamiltonian $\hat{H}$.
  *   **Fit:** **Major Fudge.** Lewis's modal space is logical; EQM's state space is dynamical. There are no Everettian branches where the electron has spin-up and spin-down simultaneously in the same basis, nor branches where gravity is repulsive (unless $\hat{H}$ allows it). EQM is vastly poorer in "possibilities" than LMR.

  ---

  ### Part 2: The Residue Report

  This is where the translation breaks down. The residues are not minor; they are structural.

  **A. What Lewis has that EQM lacks (The Modal Residue)**

  1.  **Absolute Mereological Disjointness:** For Lewis, worlds share *nothing*. No parts, no space, no time, no underlying substance. In EQM, branches share the universal wavefunction, the Hilbert space, the Hamiltonian, and a common past light cone up to the decoherence event.
      *   *Consequence:* In Lewis, the non-actual worlds are *other*. In EQM, the non-actual branches are *elsewhere in the superposition*. This changes the metaphysics of modality. Lewis solves modality by externalizing possibilities. EQM solves it by internalizing them as components of the actual.
  2.  **Logical Plenitude:** Lewis's recombination principle guarantees a world for every consistent proposition. EQM only guarantees branches for every term in the decoherent expansion of $|\Psi\rangle$.
      *   *Consequence:* EQM cannot ground counterfactuals that violate dynamical laws (e.g., "If $G$ were negative..."). Lewis can. EQM is a theory of *physical* necessity, not *logical* possibility.

  **B. What EQM has that Lewis lacks (The Physical Residue)**

  1.  **The Measure Problem (Amplitudes):** This is the critical residue. Lewisian worlds are ontologically egalitarian. There is no "weight" attached to a world in *On the Plurality of Worlds*. Probability is handled via counterpart frequencies or is rejected as primitive.
      *   In EQM, branches come with complex amplitudes $c_i$. The Born Rule ($|c_i|^2$) is not just a frequency; it is a measure over the branch structure.
      *   *Consequence:* If you map Lewis worlds to EQM branches 1-to-1, you lose the Born Rule. You get a "counting measure" (all outcomes equally probable), which contradicts experiment. EQM requires a *weighted* modal realism. Lewis has no machinery for weighted worlds without ad-hoc modification.
  2.  **Emergent Vagueness:** Modern Everettians (Wallace, Saunders) admit branches are not fundamental. They are defined by decoherence functionals which rely on coarse-graining and timescales. There is no fact of the matter about *exactly* when a split occurs.
      *   Lewis demands precise identity conditions for worlds. Vagueness is in language, not ontology.
      *   *Consequence:* EQM tolerates ontological vagueness in the definition of "world." Lewis does not. To fit EQM, Lewis must abandon his precision constraint on concreteness.
  3.  **Shared History:** As noted in the translation, EQM branches share a past. Lewis worlds do not.
      *   *Consequence:* This allows EQM to explain *correlations* (like EPR) without non-locality or conspiracy, because the branches share a common causal past in the wavefunction. Lewisian worlds cannot share a past; correlations across worlds must be brute or handled via counterpart relations.

  **C. The Indexicality Suspicion**

  You suspected indexicality does work for Lewis that the wavefunction doesn't match. You are **correct**, but for a subtle reason.
  In Lewis, "Actual" picks out one concrete whole from a set of disjoint concrete wholes. The ontology is a set $\{W_1, W_2, ...\}$. Indexicality selects $W_i$.
  In EQM, "Actual" picks out one *component* from a single concrete whole. The ontology is a vector $|\Psi\rangle = \sum c_i |B_i\rangle$. Indexicality selects $|B_i\rangle$.
  The residue is mereological. Lewisian indexicality is **selectional** (picking one item from a set). Everettian indexicality is **perspectival** (picking one aspect of a single item). This matters for probability: it is harder to justify why I should care about the measure of a component I am *not* in (EQM) than the existence of a world I am *not* in (Lewis), because in EQM the "other" components are physically present in the same ontological substrate, interfering (in principle) with my branch's normalization.

  ---

  ### Part 3: The Verdict

  **Are they the same theory in different clothes?**

  **No.** They are distinct projects that overlap in ontology but diverge in structure and purpose.

  **The Argument:**

  1.  **Different Explananda:** Lewis is solving the problem of **Modality** (What makes counterfactuals true?). Everett is solving the problem of **Measurement** (How do definite outcomes arise from unitary dynamics?).
      *   Lewis needs plenitude to ground all possibilities. EQM needs dynamical evolution to ground physical outcomes.
      *   If you adopt Lewis for EQM, you over-generate worlds (logical possibilities that physics forbids).
      *   If you adopt EQM for Lewis, you under-generate worlds (physical possibilities that logic allows).

  2.  **The Measure Gap:** The presence of the Hilbert space norm in EQM is a structural feature Lewis's framework cannot absorb without ceasing to be Lewisian. Lewisian modal realism is "flat" (all worlds exist equally). Everettian reality is "weighted" (branches exist with measure $|c_i|^2$).
      *   To make them identical, you would have to add a "measure" primitive to Lewis's ontology. But Lewis explicitly argues against this (he thinks probability across worlds is problematic).
      *   Conversely, if you strip the amplitudes from EQM to fit Lewis, you lose the empirical content of quantum mechanics (the Born Rule).
      *   Therefore, the "clothes" (the mathematical structure of the ontology) are different.

  3.  **The Mereological Gap:** Lewis's worlds are disjoint sums. EQM's branches are non-disjoint components of a superposition. This is not a verbal dispute; it has physical consequences.
      *   Because EQM branches are parts of a whole, they obey conservation laws globally (unitarity). Lewisian worlds do not obey conservation laws globally across the pluriverse (energy need not be conserved across the set of all worlds).
      *   Because EQM branches share a past, they carry entanglement correlations. Lewisian worlds do not.

  **Conclusion:**

  Everettian Quantum Mechanics **invites** a Lewisian metaphysics but **modifies** it. It requires a **Weighted, Non-Disjoint, Dynamically-Constrained Modal Realism.**

  *   **Weighted:** To recover the Born Rule (Lewis lacks this).
  *   **Non-Disjoint:** To maintain unitarity and shared history (Lewis forbids this).
  *   **Dynamically-Constrained:** To respect the Hamiltonian (Lewis rejects this via Recombination).

  The residue shows they are answering different questions. Lewis asks, "What is the nature of possibility?" and answers, "Concrete plurality." Everett asks, "What is the nature of the quantum state?" and answers, "Concrete plurality of branches."

  The fact that both answers look like "Concrete Plurality" is not an identity; it is a convergence on **ontological pluralism** as the only viable way to handle their respective problems (counterfactual truth conditions vs. quantum interference). But the *structure* of that pluralism is fundamentally different. You cannot simply import Lewis to solve the probability problem in EQM (the "incoherence problem"), because Lewis's worlds don't have the weights required to make sense of the probability. And you cannot import EQM to solve Lewis's problem of modality, because EQM doesn't have the plenitude required to make sense of logical possibility.

  They are allies in the war against actualism, but they are fighting on different fronts with different weapons.
