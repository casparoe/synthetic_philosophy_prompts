answer: |-
  1. Spinoza holds that a commonwealth's right is coextensive with its power, growing as subjects' wills align with its commands.
  2. He claims democracy is superior because it maximizes this convergence by making the sovereign will identical to the common will.
  3. Yet a well-ordered aristocracy could similarly cultivate widespread voluntary obedience through education or shared interest without granting the multitude direct political power.
  4. On this purely quantitative basis, such an aristocracy would be indistinguishable from democracy regarding the extent of the state's right.
  5. Thus, Spinoza's preference for democracy depends on a normative premise regarding liberty that his metaphysics of power does not supply.
