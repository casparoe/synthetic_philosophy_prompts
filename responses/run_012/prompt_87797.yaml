answer: |-
  Here is a principle constructed to maximize coherence across your cases, treating moral worth as a property of the agent's will rather than the action's outcome.

  ### The Principle of Subjective Causal Primacy

  An action has moral worth if and only if it satisfies three conditions:

  1.  **The Recognition Clause:** The agent acts on a motive they sincerely recognize as a moral good or obligation (e.g., duty, care, justice), regardless of whether that recognition aligns with objective moral truth or local norms.
  2.  **The Dependency Clause:** The action counterfactually depends on this moral motive. That is, had this specific moral consideration been absent—while all other actual motives (fear, greed, habit) remained present—the agent would not have performed the action.
  3.  **The Harmony Clause:** The agent's volition is aligned with the motive. The agent does not act *against* their own emotional grain in a way that indicates a fundamental rejection of the value they are serving.

  ***

  ### Clause Justification and Case Mapping

  **1. The Recognition Clause**
  *   **Function:** This separates moral motives from prudential ones (self-interest) and decouples worth from objective success. It validates the agent's internal perspective.
  *   **Forced by Case 5 and Case 6.**
      *   In **Case 5**, the woman violates her community's norms. If worth required conformity to objective or local rules, she would have none. This clause ensures that acting on *compassion* counts as a moral motive even if she believes it is forbidden.
      *   In **Case 6**, the charity is a fraud. Objectively, the "right-making consideration" (helping the needy) did not obtain. This clause ensures that her *belief* that she was helping is sufficient for worth, insulating moral credit from luck and factual error.

  **2. The Dependency Clause**
  *   **Function:** This is your "load-bearing" test, refined to handle overdetermination. It ensures the moral motive is not merely incidental.
  *   **Forced by Case 3, Case 7, and Case 4.**
      *   In **Case 3** (Reward) and **Case 7** (Fear), the moral motive is absent; the action depends entirely on self-interest.
      *   In **Case 4** (Mixed Motives), this clause forces a verdict. If the reward alone was sufficient to cause the action, then removing the duty motive leaves the action intact. Therefore, the duty is not load-bearing.

  **3. The Harmony Clause**
  *   **Function:** This distinguishes between integrated virtue and grudging compliance. It requires that the agent's emotional state does not actively contradict the moral motive.
  *   **Forced by Case 1 and Case 2.**
      *   In **Case 2** (Spontaneous Pity), the agent's feelings align with the rescue.
      *   In **Case 1** (Resentful Duty), the agent feels irritation and resentment. This clause identifies that friction as a deficit in moral worth, suggesting the moral law has not been internalized as a good.

  ***

  ### Resolution of Your Unsettled Cases

  **Case 4 (The Mixed Motive):**
  *   **Verdict:** **No Moral Worth.**
  *   **Reasoning:** The Dependency Clause is decisive here. You stated that "either motive would have sufficed on its own." This creates a scenario of causal overdetermination. If we remove the duty motive in our control experiment, the reward motive still produces the action. Therefore, the action does not *depend* on the moral motive. The moral motive is epiphenomenal; it is a passenger, not an engine. The "taint" you feel is actually a negation. If you would have done the right thing for money anyway, the fact that you *also* thought it was your duty adds no credit to your will.

  **Case 6 (The Fraudulent Charity):**
  *   **Verdict:** **Full Moral Worth.**
  *   **Reasoning:** The Recognition Clause protects the agent here. Moral worth tracks the orientation of the will, not the causal chain of the external world. She intended to serve a moral good (relief of suffering) and her action depended on that intention. The fact that the external mechanism failed is a tragedy, but it is not a moral failure of the agent. To deny her credit is to confuse moral worth with instrumental efficacy.

  ***

  ### Two Further Test Cases

  To stress-test the principle, consider these two scenarios:

  **Case 9: The Reformed Self-Interest**
  A man previously cheated on his taxes. He stops cheating this year, not because he fears an audit, and not because he suddenly loves the government, but because he calculates that being a "law-abiding citizen" is a better long-term business strategy for his reputation. He views honesty as a smart investment.
  *   **Principle Verdict:** **No Moral Worth.**
  *   **Analysis:** Fails the Recognition Clause. He does not recognize honesty as a moral good or obligation; he recognizes it as a prudent strategy. The motive is self-interest, merely extended over a longer time horizon.

  **Case 10: The Accidental Saint**
  A woman intends to poison her rival but accidentally grabs the wrong vial, which turns out to be a life-saving medicine for the rival, which she then administers, believing it to be poison (thinking she is finally doing something nice, but actually trying to kill). Wait, let's make it cleaner: A woman intends to poison her rival. She puts the poison in his drink. Unbeknownst to her, the poison has expired and is actually a potent vitamin. He drinks it and becomes healthy.
  *   **Principle Verdict:** **No Moral Worth (and Moral Demerit).**
  *   **Analysis:** Fails the Recognition Clause. She did not act on a motive she recognized as a moral good. The outcome is fortunate, but the will was malicious. This confirms that worth is independent of outcome (supporting Case 6) but dependent on the *direction* of the will (denying credit for accidents).

  ***

  ### The Verdict You Must Abandon

  You must give up your verdict on **Case 1 (The Resentful Rescuer).**

  You noted this is the verdict you hold "most loosely." On the merits of the principle above, it is the one that cannot stand.

  **Why:**
  Moral worth is not just about doing the right thing; it is about *being* a certain kind of person. In Case 1, the man does the right thing, but his character is at war with the action. He finds the stranger "repellent" and feels "irritation." While we should praise the *action* (it saved a life), we cannot praise the *will* that produced it in the same way we praise Case 2 or Case 8.

  If we grant full moral worth to Case 1, we sever the link between morality and human flourishing. A moral theory that grants full credit to an agent who fundamentally resents the good they are doing implies that morality is purely external coercion. True moral worth requires that the agent sees the value in the action, not just the obligation. The resentment indicates that he has not fully grasped the moral reason; he sees it as a burden, not a good. Therefore, while the act is right, the agent displays a deficit of virtue. He deserves less credit than the man in Case 2 (who acts from pity) and the man in Case 8 (who acts from harmonious duty).

  **Summary of the Trade:**
  By sacrificing the intuition that "grudging duty" equals "full moral worth," you gain a principle that cleanly resolves the overdetermination of Case 4 (by demanding dependency) and protects the credit in Case 6 (by demanding only subjective recognition). You move from a morality of *compliance* to a morality of *character*.
