answer: |-
  The hum of the suction traps was the only sound in the lab, a low-frequency drone that vibrated in the marrow of Mara's teeth. Outside the reinforced glass, the floodlights drew moths like ash against the night sky, a swirling galaxy of instinct they were paid to quantify.

  On her screen, the spreadsheet glowed. Cell F42 contained the number that had stopped her heart an hour ago.

  "It's wrong," Mara said. She didn't look up when Chen entered. He smelled of coffee and field dust.

  "The model converges," Chen said, leaning over her shoulder. He was tired too; the pesticide trial started at dawn. "Check the inputs."

  "The inputs are fine. The output is absurd. According to this, spraying tomorrow costs more moral value than euthanizing the entire vertebrate control group. Twice over."

  Chen sighed, pulling up a chair. "Because of the scale argument."

  "Because of Pascal's Mugging," Mara corrected. She highlighted the column for *Probabilistic Sentience Weight*. "Look. We assigned hemiptera a 0.04 percent chance of having morally relevant welfare. Four hundredths of a percent. That's generous, given the ganglia size. But then you multiply by population density. There are four million individuals in the test plot."

  "Four million times point-zero-zero-zero-four is sixteen hundred," Chen said softly. "Sixteen hundred human-equivalent welfare units lost per hectare."

  "It's noise, Chen. It's mathematical artifact. You're telling me I should halt a trial designed to save crops—and indirectly human welfare—because of a rounding error multiplied by bugs? That's the definition of the mugging. If I accept this logic, I can't walk down the street without fearing I'm stepping on a universe of hidden value. It paralyzes action."

  Mara rubbed her eyes. The model was supposed to be a safeguard, a way to ensure they weren't blindly causing suffering. Instead, it had become a veto switch held by the smallest possible probabilities.

  "You're treating the probabilities as independent events," Chen said. He tapped the screen, right on the taxonomic bracketing clause. "That's the error. You're thinking each individual bug is a separate coin flip. Heads, it feels pain. Tails, it's a robot."

  "Isn't it?"

  "No. Sentience isn't generated per individual. It's a trait of lineage. If nociception evolved in the ancestor of this clade, it's likely present in all descendants. If it didn't, it's likely present in none." Chen swiveled the monitor toward her. "The uncertainty isn't about the bug. It's about the clade. There isn't a 0.04 percent chance *this* aphid suffers. There is a 40 percent chance that *all* aphids suffer."

  Mara frowned. "The expected value is the same either way. Mathematically."

  "Decision-theoretically, it's not. In your version, the independent model, it is overwhelmingly likely that *nothing* matters, and wildly unlikely that anything does. That invites the Pascal's Mugging objection: why act on the wildly unlikely? But in the correlated model, there is a substantial chance—40 percent—that a catastrophe is occurring. You aren't betting on a lottery ticket; you're betting on whether a light switch is on or off. If it's on, four million lights are burning."

  "So you're saying the risk is concentrated."

  "I'm saying the uncertainty is structural, not individual," Chen said. "If we spray, and the clade is sentient, we aren't causing a million tiny pinpricks. We are causing a genocide. The expected value might calculate out similarly, but the moral texture is different. You can't dismiss a 40 percent chance of mass suffering as 'noise' just because the individuals are small."

  Mara looked out the window. The moths were battering themselves against the glass now, drawn by the UV. She thought about the pesticide. It was a neurotoxin. It shut down nervous systems. If there was a 'there' there, it would be a bad way to go.

  "But if we adopt the correlated model," Mara said, her voice quiet, "we can't run the trial. The cost outweighs the benefit. The funder wants a number, Chen. They want to know the moral cost is acceptable."

  "Then the number is 'unacceptable'."

  "That's career suicide. For both of us."

  "Is it?" Chen leaned back. "Or is it the only honest number? We built this model to stop us from hiding behind ignorance. Now that the math is done, you want to throw it out because the answer is inconvenient."

  "I want to throw it out because the premise is shaky. We're basing this on avoidance behavior and neural complexity proxies. We don't know if they *feel* anything. We're worshipping a phantom."

  "We're respecting a possibility," Chen said. "That's all ethics ever is. Managing uncertainty. If there's a 40 percent chance your dog feels pain, do you kick it? No. You act as if it does. Why is the threshold different when the victims are smaller?"

  "Because there are so many of them," Mara said. "If I apply that same caution to bacteria, I starve. Where is the cutoff?"

  "There is no cutoff. There is only a fading probability as complexity decreases. But here, in this clade, the probability is high enough, and the numbers are large enough, that the sum dominates the equation. Vertebrates are few. Insects are many. Even a sliver of chance swamps the certain suffering of the few."

  Mara looked at the cursor blinking in the approval box. *Sign Off.*

  If she signed, she was saying the math was wrong, or that the math didn't matter. If she didn't, she was saying that the possibility of insect suffering was enough to halt progress designed to help humans.

  "The correlation argument," Mara said slowly. "It assumes sentience is binary. On or off for the whole group."

  "It's a model, Mara. It's a map."

  "But if it's a gradient... if some have more capacity than others..."

  "Then the weight changes, but the structure holds. The uncertainty is still shared." Chen stood up. "I'm going to get more coffee. When I come back, I need to know if we are launching at dawn."

  He left her alone with the hum of the traps. Outside, a moth landed on the glass, legs scrabbling against the smooth surface. It cleaned its antennae. It was precise, efficient, and utterly alien.

  Mara thought about the 40 percent. In any other context, a 40 percent risk of causing massive suffering would be deemed unacceptable. But the victims were invisible. Their screams were chemical, silent, and ancient.

  She moved the cursor. She didn't click *Sign Off*. She opened a new document and began typing a recommendation for a non-lethal alternative trial, knowing it would double the budget and halve the data quality. She knew Chen would fight her. She knew the funder would balk.

  But the math was the math. If the light switch was on, she wouldn't be the one to leave it that way.

  She saved the file. The hum of the traps seemed to change pitch, or maybe that was just the blood rushing in her ears. Outside, the moth flew away from the glass, back into the dark where the numbers were too big to count.

  ***

  **Author's Note**

  This story leans heavily on the "correlated uncertainty" argument often discussed in longtermist and effective altruism circles regarding invertebrate welfare. The primary liberty taken is the simplification of the welfare model into a single binary switch per clade. In reality, sentience is likely a spectrum, and welfare range estimates are vastly more uncertain than the story implies. The story also treats Expected Value Theory as the decisive framework, whereas many philosophers argue for risk-averse principles or non-aggregation when dealing with tiny probabilities of huge impacts.

  The contested assumption the narrative rests on is phylogenetic bracketing: the idea that if sentience exists in a taxon, it is likely shared across related species due to common ancestry. This allows the probability to shift from "tiny per individual" to "moderate per group," countering the Pascal's Mugging objection.

  What would change my mind? Empirically, definitive evidence that insect avoidance behavior is entirely modular and dissociable from any unified subjective experience (a confirmed "philosophical zombie" mechanism) would lower the probability weight significantly. Philosophically, a robust argument for "non-aggregation"—the idea that enough small harms cannot sum to outweigh a large human benefit—would invalidate the conclusion. If the moral value of insects cannot sum across populations, the scale argument collapses, and the story's moral imperative would reverse.
