      *   *Elena's Defense:* The moment of compliance is accessible. Responsibility attaches there.
      *   *Julian's Deepening:* It's not about access; it's about the state adjudicating worthiness. The Ledger makes citizenship conditional on proving bad luck.
      *   *Elena's Concession:* She admits the administrative burden is heavy and risks error. Cost: It requires a robust appeals process, slowing settlement.
      *   *Julian's Concession:* He admits that without *some* distinction, we cannot justify redistribution at all. Cost: He must accept some baseline differentiation, even if institutional.
