          *   No strawmen; both equally competent.
          *   Real back-and-forth (responding to arguments, not just restating).
          *   Each must concede something specific under pressure and state the cost.
          *   End with disagreement narrowed to a single specific question (the crux), answered differently.
          *   Speaker A: Defends the Ledger (luck egalitarianism-ish, responsibility at moment of choice, classification is engineering).
