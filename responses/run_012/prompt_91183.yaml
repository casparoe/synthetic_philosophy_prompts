  2.  **Deconstruct the Scheme & Cases:**
      *   **The Ledger:** Equalize brute luck, leave option luck.
      *   **Marisol:** Inherited condition (Brute) -> Episodes of spending (Brute cause?). Mitigation available (cheap meds) & Insurance available (opt-in). She stops meds (Choice?) & Declines insurance (Choice?).
          *   *Tension:* Is the failure to mitigate brute (part of condition) or option (choice)?
      *   **Tomás:** No condition. Chose risk (brother's business). Lost.
          *   *Tension:* Clear option luck? Or does the outcome matter?
      *   **Speaker A (Defender):** Focus on the moment of choice. Marisol chose not to take meds/insurance. Tomás chose the risk. Both option luck. Ledger works; classification is just hard work.
      *   **Speaker B (Critic):** Classification is a verdict on status. Marisol's "choice" is embedded in the condition. Requiring proof of innocence is harmful. Better to make meds automatic/insurance default.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene, introduce the Ledger briefly, introduce the cases.
      *   **Round 1: The Cases.** A classifies them. B challenges the classification of Marisol.
      *   **Round 2: The Nature of Classification.** A says it's engineering. B says it's constitutive of status.
      *   **Round 3: Concessions.** A admits something about the burden of proof. B admits something about the necessity of some distinction.
      *   **Round 4: The Crux.** Narrow down to the specific question (e.g., is the default setting neutral or coercive? Or is the moment of choice accessible?).
      *   **Conclusion:** End on the narrowed disagreement.

  4.  **Managing Constraints & Word Count:**
      *   Need to ensure I hit the 1,400-1,800 range. This requires substantial elaboration on arguments, not just quick exchanges.
