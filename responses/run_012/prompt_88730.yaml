prompt: |-
  I sit on the value-assessment subcommittee of a regional public health insurer — I'm an analyst in the health economics unit by day, but since my father's application for a treatment was turned down last spring on cost-effectiveness grounds I've become the member who reads the modeling reports line by line and asks the awkward questions — and the chair has told us to stop issuing recommendations as a black box. She wants a written procedure, grounded in the actual theory of how individual preferences are supposed to aggregate into a social ordering, that any one of us can run in an afternoon on a new technology, that leaves a paper trail defensible to a patient group, and that stops pretending the number is neutral. We know the relevant theory is Harsanyi's aggregation theorem — the result that if individual and social preferences each satisfy the expected-utility axioms and the social ordering respects unanimous individual preference, then the social ordering is a weighted sum of individual utilities — and I want the procedure to be an honest operationalization of exactly that, not a generic cost-per-QALY checklist with the theory's name pasted on top of it.

  Please write it as an ordered procedure: the steps to run, what evidence or elicitation each step requires, what counts as passing, and — this is the part the chair will care about — the points where the theorem simply does not determine an answer and a value judgment has to be recorded as such rather than buried inside a spreadsheet cell. In particular I need the procedure to force an explicit decision on at least three things the theorem leaves open: where the weights come from and who is entitled to set them; whether we aggregate each person's expected utility before the uncertainty resolves or aggregate outcomes and then assign utilities to them (our current model quietly does one of these, and the distributive consequences of the two differ, which nobody on the committee realizes); and whether we take patients' reported preferences as they are — adaptation, relative-position concerns and all — or substitute some corrected version that we think they ought to have. It should also state plainly which distributive principles our procedure cannot accommodate without breaking its own axioms; I have a suspicion that giving priority to the worse off is one of them, and if that is right the committee needs to read it in the document rather than discover it when a patient group challenges a decision.

  Then run the procedure end to end on two proposals: a new therapy that adds a handful of months of life for a small group of very ill patients, at high cost and with burdensome side effects; and a low-cost intervention producing a modest improvement for a very large number of people with a chronic but non-life-threatening condition. I also want a third application, deliberately chosen, in which the procedure returns a recommendation I personally find repugnant — I would rather watch it misfire on the page now than have a patient's family watch it misfire later — and for that one, tell me what the procedure cannot do and what the committee's only remaining moves are. Throughout, keep the vocabulary usable by the clinician and the lay member who will not read any of the theory, and mark every step that is a judgment call wearing the costume of a calculation.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User Persona:** Health economics analyst on a value-assessment subcommittee of a regional public health insurer.
      *   **Motivation:** Father's treatment was rejected on cost-effectiveness grounds. Wants transparency, honesty about value judgments, and adherence to Harsanyi's Aggregation Theorem (not just name-dropping).
      *   **Task:** Write a written procedure (SOP) grounded in Harsanyi's Aggregation Theorem.
      *   **Key Requirements:**
          *   Ordered procedure (steps, evidence, pass/fail).
          *   Explicitly mark where the theorem *doesn't* determine the answer (value judgments).
          *   Address three specific open questions:
              1.  Source of weights (who sets them?).
              2.  Timing of aggregation (ex-ante expected utility vs. ex-post outcome utility).
              3.  Preference treatment (revealed vs. corrected/paternalistic).
          *   State limitations (e.g., priority to the worse off).
          *   Apply the procedure to three cases:
              1.  High cost, small group, life-extending (end-of-life).
              2.  Low cost, large group, chronic/non-life-threatening.
              3.  A "repugnant" outcome case (where the math works but the result is morally objectionable).
          *   Tone: Usable by clinicians/lay members, honest about "judgment calls wearing the costume of a calculation."

  2.  **Theoretical Grounding (Harsanyi's Aggregation Theorem):**

      *   *Core Idea:* If individuals and society satisfy von Neumann-Morgenstern (vNM) expected utility axioms, and society respects Pareto efficiency (if everyone prefers A to B, society prefers A to B), then Social Welfare ($W$) is a weighted sum of Individual Utilities ($U_i$). $W = \sum a_i U_i$.
      *   *Implications:* It forces utilitarianism (weighted). It does *not* specify the weights ($a_i$). It assumes utilities are comparable (cardinal and unit-comparable).
      *   *Tensions:*
          *   *Ex-ante vs. Ex-post:* Harsanyi generally implies ex-ante (expected utility), but this clashes with ex-post equity concerns.
          *   *Preferences:* Harsanyi uses subjective utilities. If we correct them, we violate the "respect individual preferences" axiom.
          *   *Priority to the Worse Off:* Standard weighted utilitarianism (Harsanyi) struggles with strict prioritarianism unless weights are inversely related to welfare, which creates dynamic inconsistency or violates independence axioms depending on formulation.

  3.  **Drafting the Procedure (The "SOP"):**

      *   *Goal:* Make it actionable but theoretically honest.
      *   *Structure:* Step-by-step.
      *   *Highlighting Judgments:* Need a specific visual marker (e.g., **[VALUE JUDGMENT]**).
      *   *Addressing the Three Open Questions:*
          1.  *Weights:* Must be set by a democratic/political process, not the model.
          2.  *Timing:* Must choose Ex-Ante (Harsanyi standard) or Ex-Post (deviation). I should probably force the committee to choose, noting the theorem implies Ex-Ante.
          3.  *Preferences:* Must choose Raw vs. Corrected. Theorem implies Raw.
      *   *Limitations:* Explicitly state that "Priority to the Worse Off" (Prioritarianism) is not natively supported without breaking the independence axiom or linearity.

  4.  **Developing the Three Cases:**

      *   *Case 1 (End-of-Life):* High cost, small $N$, high individual gain.
          *   *Harsanyi Outcome:* Depends on weights. If weights are equal, might fail due to high cost/low total QALYs. If weights favor the severely ill, might pass.
          *   *Judgment:* Weight assignment.
      *   *Case 2 (Public Health/Chronic):* Low cost, large $N$, small individual gain.
          *   *Harsanyi Outcome:* Likely passes due to aggregation of small gains ($\sum U_i$ is large).
          *   *Judgment:* Ignoring the "triviality" of individual gain.
      *   *Case 3 (The Repugnant Conclusion):* Needs to be a scenario where Utilitarianism fails moral intuition.
          *   *Idea:* A treatment that gives massive benefit to many but imposes catastrophic harm on a few (non-consensual or unavoidable side effects). Or, the "Repugnant Conclusion" in population ethics (more people with barely worth-it lives).
          *   *Better fit for Insurance:* A treatment that is highly cost-effective overall but excludes a specific minority group due to lower efficacy or higher cost, effectively writing them off. Or, a preventive measure that saves many lives but guarantees the death of a few (e.g., triage protocol).
          *   *Selection:* Let's go with a "Targeted Exclusion" case. A gene therapy that works for 95% of the population but is toxic to a specific genetic minority (5%). It's cost-effective overall. Harsanyi says fund it (maximize sum). Morally, abandoning the 5% feels wrong.
          *   *Alternative:* The "Slave/Severe Burden" case. A policy that slightly lowers premiums for everyone by denying *all* care to a small, expensive group.
          *   *Decision:* Let's use the "Catastrophic Burden on a Few for Gain of Many" scenario. It highlights the Ex-Ante vs. Ex-Post tension and the limitation regarding the "Worse Off."

  5.  **Refining the Tone:**

      *   Needs to be professional but raw. The user is an analyst who sees the machinery behind the curtain.
      *   Avoid jargon where possible, or explain it immediately.
      *   Ensure the "Value Judgment" markers are prominent.

  6.  **Writing - Section by Section:**

      *   *Introduction:* Acknowledge the Chair's directive and the theoretical basis.
      *   *The Procedure:* 5-6 Steps.
          *   Step 1: Define the Population (Weights).
          *   Step 2: Elicit Utilities (Raw vs. Corrected).
          *   Step 3: Handle Uncertainty (Ex-Ante vs. Ex-Post).
          *   Step 4: Calculate Social Welfare (The Sum).
          *   Step 5: Budget Constraint & Decision.
          *   *Constraint Note:* Explicitly list what this *cannot* do (Prioritarianism).
      *   *Application 1 (The Dying Few):* Show how weights determine the outcome.
      *   *Application 2 (The Chronic Many):* Show how aggregation swamps individual triviality.
      *   *Application 3 (The Repugnant Outcome):* The "Sacrifice" case. Show the math works, the morality fails.
      *   *Conclusion:* What to do when the procedure breaks (Political override).

  7.  **Self-Correction/Review during drafting:**

      *   *Check:* Did I address the "Ex-Ante vs. Ex-Post" distinction clearly?
      *   *Correction:* In Step 3, I need to make sure the committee explicitly ticks a box. Harsanyi implies Ex-Ante (Expected Utility), but health tech assessment often looks at Ex-Post (actual QALYs gained). I need to highlight that Harsanyi demands Ex-Ante evaluation of prospects.
      *   *Check:* Did I address the "Weights"?
      *   *Correction:* Step 1 must explicitly state that the model *cannot* generate weights. They must come from outside (legislature, board).
      *   *Check:* Is the "Priority to the Worse Off" limitation clear?
      *   *Correction:* Add a specific "Theoretical Limitations" section before the cases. Harsanyi's linearity prohibits concave transformations of utility for the sake of equity *unless* that's built into the weights, but even then, it's utilitarian, not prioritarian.
      *   *Check:* Is the tone right?
      *   *Correction:* Ensure I don't sound too academic. Use phrases like "This is where the math stops and the voting begins."

  8.  **Final Polish:** Check against the prompt's specific constraints (ordered procedure, evidence required, pass/fail, judgment markers, three specific open questions, three cases).

      *(Self-Correction on Case 3)*: The prompt asks for a case where the procedure returns a recommendation the *analyst* finds repugnant. I need to make sure the procedure *recommends* it (because the math says yes) but the human says no. The "Sacrifice the Minority for the Majority" fits best.

      *(Refining the Harsanyi nuance)*: Harsanyi's theorem relies on *cardinal* utility. QALYs are often treated as cardinal but are technically interval scales. I should note that we assume QALYs map to vNM utilities.
      Also, the "Ex-Ante vs Ex-Post" distinction in health economics is often framed as "Expected QALYs" vs "QALYs of Expected Outcomes." I need to be precise. Harsanyi aggregates *Expected Utilities*.

      *(Final check on "Priority to the Worse Off")*: Harsanyi's Utilitarianism is distinct from Prioritarianism. Prioritarianism weights gains to the worse off more heavily *non-linearly*. Harsanyi allows weights, but they must be fixed *ex-ante*. If weights change based on the outcome state, it violates the independence axiom. I need to make sure this distinction is clear in the limitations section.

      Let's assemble the document.

      *Structure:*
      1.  Header/Memo style.
      2.  Preamble (The Theory & The Honesty).
      3.  The Procedure (Steps 1-5).
      4.  Theoretical Limitations (What we can't do).
      5.  Case Studies (1, 2, 3).
      6.  Closing (The Escape Clause).

      *Voice:* Professional, weary but rigorous, transparent.

      *(Wait, one more thing)*: The prompt asks to "mark every step that is a judgment call wearing the costume of a calculation." I will use bold brackets like **[JUDGMENT CALL]**.

      *(Re-reading the "Ex-Ante vs Ex-Post" requirement)*: "whether we aggregate each person's expected utility before the uncertainty resolves or aggregate outcomes and then assign utilities to them".
      *   Option A (Harsanyi/Ex-Ante): Calculate $E[U_i]$ for each person, then sum $\sum a_i E[U_i]$.
      *   Option B (Ex-Post): Calculate outcomes states, sum utilities in each state, then take expectation of the sum.
      *   *Difference:* Risk attitude. If society is risk-averse but individuals are risk-neutral, Ex-Post allows social risk aversion. Harsanyi implies if individuals are vNM rational, Social Welfare should be linear in their utilities (Ex-Ante). I need to make the committee choose, noting Harsanyi pushes for Ex-Ante.

      Okay, ready to write.
answer: |-
  **MEMORANDUM**

  **TO:** Value-Assessment Subcommittee Chair & Members
  **FROM:** Health Economics Unit
  **SUBJECT:** Standard Operating Procedure 04-H: Social Welfare Aggregation (Harsanyi Compliance)
  **DATE:** October 26, 2023

  ### 1. Preamble: The Theory and The Honesty

  Per the Chair's directive, this procedure operationalizes **Harsanyi's Aggregation Theorem**. The theorem states that if we respect individual rational preferences and require social decisions to be consistent (Pareto efficient), Social Welfare ($W$) must be calculated as a weighted sum of individual utilities ($U_i$).

  $$W = \sum_{i=1}^{N} a_i U_i$$

  Where $a_i$ is the weight assigned to individual $i$.

  **Crucial Disclosure:** This theorem does not tell us what the weights ($a_i$) are. It does not tell us whether to use a patient's stated preferences or "corrected" medical preferences. It does not tell us how to handle risk. It only tells us that *once we decide those things*, we must sum them linearly.

  This procedure forces the Committee to record those decisions explicitly. Any step marked **[VALUE JUDGMENT]** indicates a point where the mathematics cannot proceed without a moral choice. These are not calculations; they are votes wearing the costume of calculations.

  ---

  ### 2. The Procedure (SOP 04-H)

  **Step 1: Define the Moral Community and Weights ($a_i$)**
  *   **Action:** Define the set of individuals ($N$) whose utilities count toward the social welfare function. Assign a weight ($a_i$) to each individual or group.
  *   **Evidence Required:** Legislative mandate, insurer charter, or explicit Committee vote.
  *   **Pass Condition:** Weights sum to a normalized standard (e.g., 1.0 for equal weighting) or are explicitly justified as unequal.
  *   **[VALUE JUDGMENT]:** **The Source of Weights.** The model cannot generate weights. You must decide: Does every life count equally ($a_i = 1$)? Do the currently ill count more than the healthy? Do the young count more than the old?
      *   *Default:* Equal weight ($a_i = 1$) for all eligible members.
      *   *Deviation:* Requires a recorded vote specifying the ethical principle (e.g., "Priority to the Severely Ill").
  *   **[VALUE JUDGMENT]:** **Who Sets the Weights.** This Committee does not have the democratic mandate to set social weights. If deviating from equal weight, you must cite an external authority (e.g., State Legislature, Board of Directors). If no authority exists, you are legislating from the committee table. Record this.

  **Step 2: Elicit Individual Utilities ($U_i$)**
  *   **Action:** Determine the utility value of the health states associated with the technology.
  *   **Evidence Required:** Patient-reported outcome measures (PROMs), time-trade-off studies, or clinical expert estimation.
  *   **Pass Condition:** Utilities are mapped on a cardinal scale (e.g., 0 = Death, 1 = Full Health).
  *   **[VALUE JUDGMENT]:** **Raw vs. Corrected Preferences.** Harsanyi requires using the individual's *actual* subjective utility. However, patients often adapt to disability (reporting high utility despite clinical severity) or focus on relative status.
      *   *Option A (Harsanyi Compliant):* Use patient-reported utilities exactly as stated.
      *   *Option B (Paternalistic):* Adjust utilities to what the Committee believes the patient *should* feel (e.g., discounting adaptation).
      *   *Requirement:* You must select one. If Option B, record the ethical justification for overriding patient autonomy.

  **Step 3: Handle Uncertainty (Ex-Ante vs. Ex-Post)**
  *   **Action:** Determine when aggregation occurs relative to the resolution of medical uncertainty.
  *   **Evidence Required:** Probabilistic sensitivity analysis of the technology's outcomes.
  *   **Pass Condition:** Consistent application across all technologies.
  *   **[VALUE JUDGMENT]:** **Timing of Aggregation.**
      *   *Option A (Ex-Ante / Harsanyi Standard):* Calculate the *Expected Utility* for each person first, then sum them. ($\sum a_i E[U_i]$). This respects individual risk attitudes.
      *   *Option B (Ex-Post):* Calculate the utility of the *outcome* for the population in every possible scenario, sum those, then average. ($E[\sum a_i U_i]$).
      *   *Consequence:* Option B allows the Committee to be "societally risk-averse" even if patients are not. Option A is theoretically required by Harsanyi if individuals are rational.
      *   *Requirement:* Select one. If Option B, acknowledge you are violating the strict independence axiom of the theorem to achieve distributive goals.

  **Step 4: Calculate Social Welfare Change ($\Delta W$)**
  *   **Action:** Compute the difference in weighted social welfare between "Funding the Technology" and "Status Quo."
  *   **Evidence Required:** Cost data, population size, utility values from Step 2, probabilities from Step 3.
  *   **Pass Condition:** $\Delta W$ is calculated.
  *   **Note:** This is the only pure calculation step. $\Delta W = \sum a_i (U_{i, new} - U_{i, old}) - \lambda \times \text{Cost}$. (Where $\lambda$ is the shadow price of money).

  **Step 5: The Decision Rule**
  *   **Action:** Compare $\Delta W$ to zero (or a threshold).
  *   **Pass Condition:** Recommendation issued.
  *   **[VALUE JUDGMENT]:** **The Threshold.** If $\Delta W > 0$, the technology increases social welfare. However, we operate under a budget constraint. You must decide if a positive $\Delta W$ is *sufficient* for funding, or if it must exceed the opportunity cost of displaced services.

  ---

  ### 3. Theoretical Limitations (Read Before Voting)

  This procedure is grounded in Weighted Utilitarianism. Committee members must acknowledge the following axioms cannot be violated without breaking the model:

  1.  **No Native Priority to the Worse Off:** Harsanyi's theorem sums utilities linearly. It cannot natively accommodate **Prioritarianism** (giving extra weight to a gain simply because it goes to a worse-off person) unless that weight is fixed in Step 1. If you try to dynamically adjust weights based on who benefits *after* seeing the data, you violate the Pareto principle.
      *   *Implication:* If a treatment helps the moderately ill more than the severely ill, this model may recommend it, even if your moral intuition says "save the sickest first."
  2.  **No Rights Constraints:** The model maximizes the sum. It does not recognize individual rights that cannot be traded away. If violating one person's rights creates enough utility for others, the math says "do it."
  3.  **Cardinality Assumption:** We assume a QALY is a QALY across persons. If you believe my pain is "worse" than your pain even at the same utility score, this model cannot capture that without Step 1 weights.

  ---

  ### 4. Application of Procedure

  #### Case 1: The "End-of-Life" Proposal
  *   **Technology:** *OncoLast*. Extends life by 4 months for patients with Stage IV pancreatic cancer.
  *   **Population:** 50 patients/year.
  *   **Cost:** $500,000 per patient.
  *   **Side Effects:** Severe (Utility drops from 0.4 to 0.2 during treatment).
  *   **Data:** Net QALY gain per patient = 0.1. Total QALYs = 5. Cost = $25M.

  **Running SOP 04-H:**
  *   **Step 1 (Weights):** Committee votes to apply a "Severity Weight" of 5x for end-of-life patients (citing public sentiment). $a_i = 5$.
  *   **Step 2 (Preferences):** Patients report low utility during treatment, but high value on *any* extension. Committee accepts Raw Preferences.
  *   **Step 3 (Uncertainty):** Ex-Ante aggregation chosen.
  *   **Step 4 (Calculation):** Weighted QALYs = $5 \text{ patients} \times 0.1 \times 5 (\text{weight}) = 25$. Cost per Weighted-QALY = $1M.
  *   **Step 5 (Decision):** If the threshold is $2M/Weighted-QALY, **RECOMMEND FUNDING.**

  **Analyst Note:** The math passed only because Step 1 allowed a weight adjustment. Without the 5x weight, the cost per QALY is $5M, and it fails.
  **[VALUE JUDGMENT RECORDED]:** The recommendation rests entirely on the claim that these 50 lives count five times more than others. If a diabetes drug for children is rejected to pay for this, the Committee has explicitly valued the dying over the young.

  #### Case 2: The "Public Health" Proposal
  *   **Technology:** *SaltLess*. A dietary intervention reducing sodium in processed bread.
  *   **Population:** 1,000,000 members.
  *   **Cost:** $2 per member/year.
  *   **Benefit:** Reduces blood pressure slightly. 0.001 QALY gain per person.
  *   **Data:** Total QALYs = 1,000. Total Cost = $2M. Cost/QALY = $2,000.

  **Running SOP 04-H:**
  *   **Step 1 (Weights):** Equal weight ($a_i = 1$).
  *   **Step 2 (Preferences):** Patients do not *feel* healthier. Utility is modeled from epidemiological risk reduction, not sensation. Committee accepts **Corrected Preferences** (Option B, Step 2), arguing patients cannot perceive the benefit.
  *   **Step 3 (Uncertainty):** Ex-Post aggregation.
  *   **Step 4 (Calculation):** $\Delta W = 1,000 \text{ QALYs}$.
  *   **Step 5 (Decision):** **RECOMMEND FUNDING.**

  **Analyst Note:** This passes easily due to aggregation.
  **[VALUE JUDGMENT RECORDED]:** In Step 2, we overrode patient experience. We are funding a treatment nobody feels, based on a statistical model of longevity. We are prioritizing "life years" over "lived experience." If patients complain they don't value this, the procedure notes we substituted their preferences for our own.

  #### Case 3: The "Repugnant" Proposal (The Sacrifice)
  *   **Technology:** *GeneShield*. A prophylactic gene therapy that prevents a deadly viral outbreak.
  *   **Population:** 100,000 members.
  *   **Benefit:** Saves 500 lives (0.5 QALYs each due to age/comorbidity). Total Gain = 250 QALYs.
  *   **Harm:** The therapy is toxic to a specific genetic subgroup (0.5% of population, approx. 500 people). For them, it causes immediate, severe neurological degradation (Utility drop to 0.1 for life, approx. loss of 10 QALYs each). Total Loss = 5,000 QALYs.
  *   **Wait, Correction:** To make it pass the utilitarian test, the math must work.
      *   *Revised Scenario:* *GeneShield* saves 10,000 people from a debilitating chronic condition (Gain 0.5 QALYs each = 5,000 QALYs). It causes catastrophic, fatal toxicity in 10 specific individuals (Loss 40 QALYs each = 400 QALYs).
      *   *Net QALYs:* +4,600.
      *   *Cost:* Low.
  *   **Distribution:** The 10 victims are identifiable *ex-ante* (they carry Marker Z). They are not volunteers.

  **Running SOP 04-H:**
  *   **Step 1 (Weights):** Equal weight ($a_i = 1$). No "Severity Weight" applied because the victims are currently healthy carriers of Marker Z.
  *   **Step 2 (Preferences):** Victims report they would rather die than suffer the neurological degradation. Committee applies **Corrected Preferences** (Option B), stating "Death is objectively worse than disability."
  *   **Step 3 (Uncertainty):** Ex-Ante. For the 10, the expected utility is negative. For the 10,000, it is positive.
  *   **Step 4 (Calculation):** Sum of utilities is strongly positive (+4,600 QALYs).
  *   **Step 5 (Decision):** **RECOMMEND FUNDING.**

  **Analyst Note:** The procedure mandates funding. We sacrifice 10 identifiable people to benefit 10,000.
  **[VALUE JUDGMENT RECORDED]:** This is the failure point. Harsanyi's theorem maximizes the sum; it does not protect minorities from being sacrificed for the greater good.
  **What the Procedure Cannot Do:** It cannot invoke a "Right to Safety" or a "Constraint against Harm." It treats the 10 victims as negative containers of utility to be offset by the gains of the majority.
  **Committee's Only Remaining Moves:**
  1.  **Reject the Procedure:** Vote to override the recommendation based on "Non-Utilitarian Ethical Constraints" (e.g., Do No Harm). This admits the model is insufficient for moral decision-making.
  2.  **Manipulate Step 1:** Assign an infinite weight to the 10 victims. This breaks the normalization of the model but saves the conscience.
  3.  **Hide the Data:** Classify the side-effect profile as "Uncertain" to delay the decision. (Unethical, but common).

  **Recommendation for Case 3:** The Committee must formally record that **SOP 04-H is suspended for this technology.** We cannot sign a death warrant for 10 people using a spreadsheet, even if the theorem says it is "Socially Optimal." We must refer this to the Board of Directors with a disclaimer: *"Mathematically efficient, morally impermissible."*

  ---

  ### 5. Closing Statement for the Committee

  This procedure removes the black box. It shows that when we reject a treatment, it is often because we chose equal weights (Step 1) or raw preferences (Step 2). When we approve one, it is because we aggregated small gains over many people (Case 2) or weighted the sick more heavily (Case 1).

  If we follow this, we can no longer say "The model told us no." We must say "We chose weights that resulted in a no."

  That is the transparency the Chair requested. It will make our meetings longer. It will make our minutes heavier. It will make it harder to sleep. But it is the only way to be honest about the fact that we are playing God with a calculator.

  **Signed,**
  *Health Economics Unit*
