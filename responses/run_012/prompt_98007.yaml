answer: |-
  This is a sharp angle. Most undergraduate readings treat *Dorian Gray* as a cautionary tale about "sin" or a biography of Wilde's own aestheticism. Using the **heterogeneity problem** (the idea that "pleasure" is not a single, commensurable metric) cuts through the moralizing to the structural logic of the novel.

  Here is a position on how the novel interacts with that philosophical problem, where the reading holds, where it frays, and what the literature contributes to the philosophy.

  ### The Thesis: The Novel as a Demonstration of Hedonistic Collapse

  My position is that Wilde is not merely committing the error of treating pleasure as undifferentiated; he is **dramatizing the psychological inevitability of that error leading to ruin.**

  The novel argues that a life lived on the premise that "pleasure is the good" fails not because pleasure is morally bad, but because the *heterogeneity* of pleasure makes a unified "good life" impossible to calculate. Dorian tries to treat all sensations as commensurable currency (the "hedonistic calculus"), but the human psyche cannot sustain that equivalence. The "staleness" you mention isn't just boredom; it is the result of trying to force incommensurable experiences into a single bucket.

  Therefore, the ending **buries hedonism**. It does not vindicate it by showing Dorian simply "ran out" of pleasure; it shows that the project of summing heterogeneous pleasures into a single life-narrative is ontologically impossible. The painting is the physical manifestation of the heterogeneity problem refusing to be smoothed over.

  ### 1. Lord Henry and the Smuggled Qualitative Distinction
  Lord Henry is the mouthpiece for the quantitative hedonist view. In Chapter 2, he tells Dorian: *"The only way to get rid of a temptation is to yield to it. Resist it, and your soul grows sick with longing for the things it has forbidden to itself."*

  This implies a flat ontology of desire: a temptation is a temptation; yielding is the metric. However, Wilde immediately undermines this. Henry does not actually advocate for *all* pleasures. He advocates for *interesting* ones. He privileges the intellectualized sensation over the brute one.
  *   **The Breakdown:** Here is where the novel resists the lens. Henry claims to be a hedonist, but he is actually an **elitist aestheticist**. He smuggles in a qualitative hierarchy (wit over gluttony, style over sloth) while preaching a quantitative philosophy (yield to all).
  *   **Philosophical Insight:** Wilde anticipates the Millian critique of Bentham before Mill fully popularized it. Henry knows that the "pleasure" of pushing a pin is not the "pleasure" of reading Plato, but his rhetoric pretends they are equal acts of "experience." The novel shows this rhetoric is a lie. Henry never descends into the opium dens; he stays in the drawing room. He preaches homogeneous pleasure but practices heterogeneous selection.

  ### 2. Chapter 11: The Catalogue as the Heterogeneity Problem
  Chapter 11 is the core of your unit. It is a literal list of heterogeneous goods: jewels, vestments, music, perfumes, theology, violence.
  *   **The Text:** Dorian seeks to cure his ennui by collecting "new sensations." He treats a Catholic mass, a symphony, and a brutal breakup as equivalent stimuli to ward off the "staleness" of life.
  *   **The Reading:** This chapter dramatizes the **emptiness objection**. If "pleasure" is the only good, then the *source* of the pleasure should not matter, only the intensity. Dorian lives this out. He finds that the pleasure of prayer and the pleasure of cruelty both fade at the same rate.
  *   **Where Wilde is Ahead:** Philosophers argue about whether pleasure is a sensation or a propositional attitude. Wilde shows that **temporality** is the killer. The heterogeneity problem isn't just that the pleasures feel different *now*; it's that they age differently. The memory of the music sustains; the memory of the cruelty rots. Dorian tries to treat them as equal deposits in a bank account, but the "currency" devalues at different rates. The novel shows that a hedonistic calculus is impossible because you cannot predict the half-life of a pleasure.

  ### 3. The Painting: The Refusal of Commensurability
  The supernatural device is usually a critique of the novel's realism, but for your lens, it is the **objective ledger** that Dorian wishes didn't exist.
  *   **The Function:** If hedonism were true and pleasure was the only good, the painting should simply show Dorian aging (the cost of time). Instead, it shows *specific* moral corruptions. It distinguishes between the pleasure of collecting tapestries and the pleasure of ruining Hetty Merton.
  *   **The Argument:** The painting proves that pleasures are **not** homogeneous. If they were, the canvas would be a blur of indulgence. Instead, it is a specific record of *harm*. The painting forces a qualitative distinction that Dorian's philosophy tries to deny.
  *   **Where the Reading Breaks Down:** You must be honest here. The supernatural element cheats the philosophical problem. In the real world, there is no magical canvas that separates "good pleasures" from "bad pleasures." Wilde relies on a deus ex machina to prove that not all pleasures are equal. Without the painting, does Dorian's life fail? The novel suggests yes (through his ennui), but the painting makes it a moral certainty rather than a psychological probability. This is Wilde "trading on vibes"—using Gothic horror to solve a utilitarian puzzle.

  ### 4. The Ending: Burying the Calculus
  Dorian's death is the final verdict. He attempts to destroy the painting (the record of the heterogeneity of his acts) to reclaim a unified, "good" self.
  *   **The Verdict:** This buries hedonism. Dorian dies because he cannot reconcile the disparate parts of his life into a single whole. He wants the *sum* of his pleasures to be positive, but the *nature* of the pleasures makes them incompatible.
  *   **The Withered Face:** When the servants find him, the painting is young and beautiful; he is old and withered. This reverses the hedonistic equation. The "pleasure" he chased (youth/sensation) remained on the canvas, but the *cost* (the heterogeneous weight of his actions) crushed his body.
  *   **Why it's not a Vindication:** A vindication would suggest Dorian failed because he didn't chase *enough* pleasure, or the *right kind*. Instead, the novel suggests the project itself was flawed. You cannot build a self out of fragmented sensations. The heterogeneity of the pleasures fractured the unity of the soul.

  ### 5. What the Novel Adds to the Debate
  Philosophical arguments about the heterogeneity problem often remain abstract (e.g., "Is the feeling of a bath the same *kind* of thing as the feeling of solving a math problem?"). *Dorian Gray* adds three things the argument cannot:

  1.  **Ennui as a Symptom:** The novel identifies boredom not as a lack of pleasure, but as the inevitable result of treating heterogeneous goods as homogeneous. When everything is just "a sensation," nothing is significant enough to hold interest. The "staleness" Dorian feels is the phenomenological proof of the heterogeneity problem.
  2.  **The Unity of the Self:** Philosophers debate the metric of the good; Wilde asks who is *experiencing* the good. The novel argues that a self must be a narrative unity. If your pleasures are truly heterogeneous (cruelty vs. charity), they pull the self in contradictory directions. Dorian's fragmentation is the psychological cost of the heterogeneity problem.
  3.  **The Irreversibility of Time:** In a philosophical thought experiment, you can reset the scenario. In the novel, Dorian cannot undo the ruin of Basil or Hetty. The novel shows that the "value" of a pleasure changes retroactively based on its consequences. A pleasure that leads to ruin cannot be weighed equally against a pleasure that leads to rest, even if the immediate sensation is identical.

  ### Summary for Your Unit
  *   **The Hook:** Don't ask if Wilde was a hedonist. Ask if the novel proves hedonism is *impossible*.
  *   **The Conflict:** Lord Henry proposes a quantitative model (all experience is good); the Plot enforces a qualitative reality (some experiences destroy the self).
  *   **The Verdict:** The novel buries hedonism by showing that the "heterogeneity of pleasure" makes a coherent life impossible. You cannot sum up a life of contradictory sensations into a single "good."
  *   **The Caveat:** Acknowledge that Wilde uses a magical painting to do the heavy lifting that reality usually doesn't. He forces a moral distinction that a real-world hedonist could deny.

  This approach allows you to treat Wilde not as a philosopher manqué who got it wrong, but as a diagnostician who saw the psychological cracks in the hedonistic pavement before the philosophers fully mapped them.
