  Right, so I'm a backend engineer, no philosophy training beyond a compulsory ethics module years ago, and I've got myself into a daft argument with a colleague that I'd like to settle properly.

  The argument: our monitoring stack tells us everything's healthy. My colleague says that's circular — the thing that's meant to be checked is doing the checking, so obviously it reports that it's fine. I say it's not that simple, and that we do this kind of thing all the time in ordinary life, and that there's a whole bit of philosophy about the shape of it (bootstrapping, easy knowledge, the business where you appear to learn that your eyes are reliable by just looking at things).

  What I want from you is a thought experiment built to order that I can put on a slide. One paragraph of scenario. Some constraints, because the stock examples are worn out: no gas gauges, no thermometers, no colour tables, no fake barns, no brains in vats, no lottery tickets. Ordinary workplace or household, an ordinary competent adult, nothing sci-fi.

  The key spec: give me two versions of the same scenario that differ in exactly one respect, and set it up so that in one version the self-endorsing route seems to hand the person genuine knowledge and in the other it doesn't. That difference has to fall out of the structure of the case, not be something you just assert — I don't want the verdicts stipulated and then dressed up afterwards.

  Then do the working-out. For each version: say what belief is at issue, what the person's route to it is, and what each of these positions says about it —

  - the one where an experience (or an instrument's reading) can justify a belief without you first having to know the thing is reliable;
  - the externalist line where all that matters is that the route actually tracks the truth;
  - the internalist line where you need antecedent justification and the whole route is viciously circular;
  - the line that says it's all fine unless the person has some specific reason to doubt.

  I want the disagreement to be about the case, not about who said what, so skip the names and the papers — I won't check them and can't anyway.

  Then tell me: which single feature is doing the work; what happens if I delete it, does the case just collapse into the boring standard one; and if you were defending whichever position comes out worst, how would you go about attacking the case?

  One more thing I'm curious about. I've read that there's a distinction between using a claim as a premise in an argument for that same claim, versus using a rule to certify that very rule. Tell me which one is going on in the cases you build, and whether it actually makes a difference to the verdicts or is a bit of a red herring. Also, I gather the easy knowledge thing is supposed to come in a one-step form and a bootstrapping form — say which mine is and whether the objection is the same in both.

  British English please, I'm in London and the work spellcheck is set to it.
