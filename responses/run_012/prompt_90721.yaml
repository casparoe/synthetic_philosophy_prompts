      *   **B. Never reduce the set of things I could still go on to do later (Attainable Utility Preservation).**
          *   *Issue:* This is close to the concept of "Impact Minimization" or "Attainable Utility Preservation" (AUP) proposed by researchers like Turner et al. It tries to preserve *optionality*.
          *   *Circularity:* Medium/Low. It doesn't need to know *which* future you want, just that you want *some* future. However, defining "things you could do" requires a model of your capabilities and the world. It risks paralysis (doing nothing preserves all options best).
