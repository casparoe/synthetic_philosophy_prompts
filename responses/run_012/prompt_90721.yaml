      *   **C. Behave as if you had done nothing at all... measure against do-nothing baseline.**
          *   *Issue:* This is "Relative Reachability" or baseline comparison. If the baseline is "do nothing," then helping you is a side effect compared to doing nothing. It needs a *counterfactual* baseline.
