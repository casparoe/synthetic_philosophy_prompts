  3. Specifically regarding the asserted addiction, the Court finds that dependence is not a pathology that overrides choice but a fundamental project chosen to give meaning to the world. The feeling of compulsion reported by the Defendant is not evidence of constraint but evidence of anguish. Anguish is not a symptom of illness; it is a mode of freedom. It is the recognition that nothing stands between the subject and the act. By claiming he "could not help himself," the Defendant demonstrates that he could. The excuse is the proof of the freedom it disowns. To accept the defense of addiction would be to validate a lie about the structure of consciousness.

  4. Similarly, the Defendant's upbringing offers no exculpation. The past is inert. It exists only insofar as the present consciousness chooses to interpret it as a determinant. Mr. Pen's father's violence is a facticity, but it is the Defendant who chooses to let that facticity define his current actions. He is not the victim of his history; he is the author of its meaning. To treat the past as a cause is to deny the Defendant's power to transcend it at every moment. The Court cannot sanction the view that a child's suffering becomes an adult's excuse.

  5. Defense counsel urges mercy, arguing that a reduced sentence acknowledges the unfairness of the Defendant's situation. This Court holds that mercy, in this context, is the deeper cruelty. To reduce culpability based on circumstance is to treat the Defendant as a thing governed by causal laws rather than a person governed by responsibility. It strips him of his humanity by denying his capacity to choose otherwise. We honor the Defendant's freedom by holding him wholly accountable for the world he has chosen to create. To excuse him would be to insult him by treating him as an object. A reduced sentence implies the Defendant is less than a full agent, a broken mechanism rather than a conscious source of value. This Court refuses to participate in that dehumanization.

