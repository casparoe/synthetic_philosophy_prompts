  1. Before this Court is the Defendant's Motion for Downward Departure. Arthur Pen, convicted of armed robbery following the theft of opioids from a local pharmacy, seeks leniency. Counsel argues that Mr. Pen's culpability is diminished by a history of domestic abuse, untreated psychological illness, and a substance dependence he did not initially choose. The State contends that such mitigating factors are legally cognizable only as evidence of bad faith.

