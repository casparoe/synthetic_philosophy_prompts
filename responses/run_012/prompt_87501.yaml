answer: |-
  # Workshop Plan: The Induction Trap

  **Session Title:** The Induction Trap: Data, Rules, and Commitment
  **Duration:** 75 Minutes
  **Participants:** 14 Graduate Students (Philosophy, Psychology, ML)
  **Facilitator:** You (PhD Candidate)

  ## 1. Materials List

  Keep this low-tech to avoid setup friction. The ambiguity must come from the logic, not the fidelity of the graphics.

  *   **Projector/Whiteboard:** For the main "Trap" problem (Phase 2).
  *   **Paper Packets (14 copies):** Each packet contains:
      *   3 blank "Problem Cards" (landscape orientation, divided into Left Panel, Right Panel, and a bottom strip for "Test Item").
      *   1 "Rule Sheet" (to write the secret rule).
      *   1 "Prediction Sheet" (to commit to Left/Right).
  *   **Markers/Pens:** At least one per participant.
  *   **Colored Pencils/Crayons (Optional but recommended):** Just Red and Blue. If unavailable, use shading (Striped vs. Solid) but color is faster.
  *   **Timer:** Visible to you.

  ## 2. The Core Problems (Visuals)

  You need two specific problem sets prepared on slides or drawn on the board beforehand.

  **Problem A (Warm-up):**
  *   **Left Panel:** Circle, Triangle, Square (all outlined, no fill).
  *   **Right Panel:** Circle, Triangle, Square (all filled black).
  *   **Rule:** Filled vs. Unfilled.
  *   **Test Item:** A filled Star. (Answer: Right).
  *   *Purpose:* Establishes the mechanic quickly. Unambiguous.

  **Problem B (The Trap):**
  *   **Left Panel:** Red Circle, Red Square, Red Triangle.
  *   **Right Panel:** Blue Circle, Blue Square, Blue Triangle.
  *   **Test Item:** **Red Square.**
  *   **Rule 1 (Color):** Red belongs Left.
  *   **Rule 2 (Shape):** Square belongs Right.
  *   *Purpose:* Both rules fit the training data (Left/Right panels) perfectly. They predict opposite outcomes for the Test Item.

  ## 3. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Intro** | Welcome, no theory. Explain the "Game." |
  | **05-15** | **Warm-up** | Solve Problem A together. Establish norms. |
  | **15-35** | **The Trap** | **Critical Moment.** Solve Problem B. Commit, Vote, Reveal. |
  | **35-60** | **Design Lab** | Groups create their own "Trap" problems. |
  | **60-70** | **The Swap** | Groups exchange problems and attempt to solve. |
  | **70-75** | **Debrief** | Connect experience to induction/underdetermination. |

  ## 4. Facilitator Instructions & Script

  ### Phase 1: Intro (0-5 mins)
  **Do:** Keep it brisk. Do not mention "induction," "philosophy," or "machine learning."
  **Say:** "Welcome. For the next hour, we are playing a pattern recognition game. I will show you two panels of figures. The Left panel follows a rule. The Right panel does not. Your job is to figure out the rule. We will do a few rounds. There are no trick questions, but there are constraints."
  **Don't:** Explain *why* this matters yet. Do not define what a "rule" is (let them assume it's geometric/visual).

  ### Phase 2: Warm-up (5-15 mins)
  **Action:** Show Problem A (Filled vs. Unfilled).
  **Say:** "Look at the Left. Look at the Right. What is the rule? Shout it out."
  **Action:** Once they guess "Filled vs. Empty," show the Test Item (Filled Star). Ask: "Left or Right?"
  **Say:** "Correct. This is the mechanic. Training data on top, test case at the bottom. You must commit to a side based on the rule."

  ### Phase 3: The Trap (15-35 mins)
  **Action:** Show Problem B (Red Shapes vs. Blue Shapes).
  **Say:** "Same game. Left vs. Right. Find the rule. Take 2 minutes to look silently."
  **Action:** After 2 minutes, ask: "What is the rule?"
  **Likely Outcome:** Someone will say "Color." Someone else might say "Shape."
  **Facilitator Move:** Write both on the board. "Rule A: Color. Rule B: Shape." Ask the room: "Does Rule A fit all the training examples?" (Yes). "Does Rule B fit all the training examples?" (Yes).
  **Say:** "Okay. We have two valid rules. Now, look at the Test Item: The Red Square."
  **Action:** Hand out the **Prediction Sheet**.
  **Say:** "You must commit. If you follow Rule A, where does it go? If you follow Rule B, where does it go? Mark your sheet: Left or Right. No abstaining."
  **Action:** Collect the votes. Tally them visibly on the board (e.g., Left: 9, Right: 5).
  **Say:** "The majority says Left. The minority says Right. Both are consistent with the data we saw."
  **Action:** Reveal the "Intended Rule" (e.g., "I was thinking Color, so the answer is Left.").
  **Say:** "The majority is 'correct' by my intention. But look at the minority. Was their logic wrong?"
  **Pause.** Let the silence sit.
  **Say:** "Their logic was valid. Their prediction was consistent with all evidence provided. They were only 'wrong' because they didn't read my mind. Keep that feeling."

  ### Phase 4: Design Lab (35-60 mins)
  **Action:** Split into 4 groups (3-4 people each).
  **Say:** "Now you are the designers. Your task is to build a Trap for another group. You need to create a Problem Card where **two different rules** fit the training panels perfectly, but **disagree** on the Test Item."
  **Materials:** Give them the Paper Packets and Markers.
  **Constraint:** "You must use simple shapes (Circle, Square, Triangle) and two colors (Red, Blue) or shading. Do not make it obscure. The ambiguity must be in the logic, not the drawing."
  **Facilitator Move:** Circulate. If a group stalls, give them the **Recipe**: "Confound two properties. Make all Left items Red and Circular. Make all Right items Blue and Square. Make the Test Item Red and Square."
  **Goal:** Each group produces one card where Rule 1 says Left, Rule 2 says Right.

  ### Phase 5: The Swap (60-70 mins)
  **Action:** Pair Group 1 with Group 2, and Group 3 with Group 4.
  **Say:** "Swap your Problem Card with your partner group. Do not tell them the rules. They have 5 minutes to find the rule and commit to a prediction on the Test Item."
  **Action:** After 5 minutes, the Designers reveal their two conflicting rules.
  **Say:** "Did the solvers split? Did they feel the ambiguity?"

  ### Phase 6: Debrief (70-75 mins)
  **Do:** Map their experience to the theory. Do not lecture; ask them to name what happened.
  **Say:** "In the first Trap, the data was finite. Six shapes. How many rules fit those six shapes?"
  **Participants:** "Infinite." "Two." "Many."
  **Say:** "Mathematically, many. Psychologically, we only saw one or two. Why?"
  **Connect to Fields:**
  *   **To ML:** "You just experienced the difference between training accuracy (100% on both rules) and generalization (divergence on the test set). Your 'loss function' didn't penalize the wrong rule."
  *   **To Philosophy:** "This is Goodman's 'Grue'. The data supports 'All emeralds are green' and 'All emeralds are grue' equally until a future time. You felt the discomfort of having no logical basis to prefer one."
  *   **To Psychology:** "Your preference for Color over Shape (or vice versa) is a **prior**. It's not in the data. It's in you."
  **Closing:** "Induction isn't just reading data. It's imposing a structure on data. Today you felt the cost of that imposition."

  ## 5. Honest Assessment of Seams

  **1. The "Obviousness" Risk:**
  *   *Problem:* In Problem B (Color vs. Shape), participants might immediately see both rules, killing the tension.
  *   *Fix:* If they shout both rules immediately, lean into it. "Great, you spotted the ambiguity instantly. Now, can you agree on the Test Item?" The conflict shifts from *discovery* to *consensus*. The tension remains: "We can't agree because the data doesn't decide."
  *   *Backup:* If they are too sharp, use a subtler confound for Problem B. E.g., Left = Shapes with >3 sides (all Red). Right = Shapes with <4 sides (all Blue). Test = Red Triangle. (Rule 1: Color -> Left. Rule 2: Sides -> Right).

  **2. The Design Stall:**
  *   *Problem:* 25 minutes is tight for designing a logical trap. Groups might make a problem that is just "hard" rather than "underdetermined."
  *   *Fix:* Use the **Recipe** intervention early (at minute 40). If a group is drawing complex figures, stop them. "Simplify. Use Red/Blue and Circle/Square. The logic must carry the weight, not the art."
  *   *Facilitator Safety Net:* Prepare one pre-made "Trap Card" yourself. If no group produces a working ambiguity by minute 60, use yours for the Swap phase. Do not let the Swap fail.

  **3. The "Mind-Reading" Objection:**
  *   *Problem:* Participants might dismiss the Trap reveal as "You just picked arbitrarily. This isn't science."
  *   *Fix:* Validate this. "Exactly. In the real world, there is no Designer to ask. We are always in the position of the minority group: committed to a rule that fits the past but might fail the future. The 'Designer' is Nature, and Nature doesn't tell us the rule."

  **4. Dominant Voices:**
  *   *Problem:* ML students might dominate with terms like "regularization" or "bias-variance tradeoff."
  *   *Fix:* Gently park the jargon. "That's a perfect description of what we felt. Let's hold that term for the debrief. Right now, stay in the experience of the uncertainty."

  ## 6. Limitations (What this activity cannot do)

  You must supply these points in the debrief verbally; the game cannot demonstrate them:

  1.  **Infinity of Rules:** The game shows *two* competing rules. It cannot show the *infinite* number of rules (e.g., "Red OR (Blue and it's Tuesday)"). You must state this: "We only found two, but logically there are endless gerrymandered rules that also fit."
  2.  **Source of Priors:** The game shows we *have* priors (we preferred Color over Shape), but it cannot tell us *where* they come from (innate, cultural, or learned). You must clarify: "The game reveals the prior exists, not its origin."
  3.  **Truth vs. Utility:** The game frames one rule as "Intended" (Truth). In real science, there is no "Intended" rule, only useful predictions. You must make this distinction in the closing: "In the game, I was the Truth. In science, there is only prediction."

  ## 7. Contingency: Alternative Staging

  If you are worried about the visual design stalling, use **Number Sequences** instead of Bongard figures.
  *   *Left:* 2, 4, 6
  *   *Right:* 1, 3, 5
  *   *Test:* 8
  *   *Rule 1:* Even vs. Odd (8 -> Left).
  *   *Rule 2:* Greater than 0 vs. Less than 0 (Both -> Left/Right? No).
  *   *Rule 2:* "Numbers that appear in the multiplication table of 2" vs "Primes" (Wait, 1 isn't prime).
  *   *Better Sequence Trap:*
      *   Sequence: 1, 2, 4, 8... Next?
      *   Rule 1: Powers of 2 (Next = 16).
      *   Rule 2: Max regions in a circle with n points (1, 2, 4, 8, 16, **31**).
      *   *Critique:* This is too niche for Psych/Phil students.
  *   *Decision:* Stick to the **Bongard Color/Shape** plan. It is visually immediate and requires zero math background. The risk of drawing is lower than the risk of explaining number theory.

  ## 8. Final Checklist for You

  *   [ ] **Slides:** Prepare Problem A and Problem B clearly.
  *   [ ] **Packets:** Print 14 sets of Problem Cards (blank templates).
  *   [ ] **Pens:** Ensure you have Red and Blue markers for the groups.
  *   [ ] **Timer:** Set alarms for 15, 35, 60, 70 mins.
  *   [ ] **Backup:** Have one pre-drawn "Trap Card" in your pocket in case the Design Lab fails.

  This plan forces the "wall" you described. They will commit, they will be right by logic but wrong by design (or vice versa), and they will have to build that ambiguity themselves. The debrief simply puts a name to the bruise they just got.
