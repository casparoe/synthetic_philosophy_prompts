  1. Elena raised her paddle at five thousand, locking eyes with Mark across the ballroom to prove she had skin in the venture. She knew the initial bid was merely the price of admission to his attention, a calculated entry fee rather than a genuine desire for the plaque.

  2. When the bidding climbed past twenty thousand, the absolute limit she had whispered to herself in the Uber, she didn't lower her hand. Dropping out now would look like caprice rather than calculation, transforming a deliberate strategy into a public mistake.

  3. The auctioneer offered a graceful out via a private pledge that would save her liquidity, noting that she had already made her point. She shook her head because accepting mercy would invalidate the costliness of the signal she was buying.

  4. Mark stopped checking his phone and leaned forward, his skepticism dissolving not at her wealth, but at the visible strain. He saw the loss was real, and finally believed she would sacrifice for the partnership.

  5. She matched the next increment automatically, her smile fixed and tight as the gavel hovered. The ambiguity hung heavy, leaving everyone wondering if she was still manipulating the room or if the room had finally finished manipulating her.
