      *   **Hayek (Austrian):** The problem isn't computational power. The problem is *knowledge*. Prices aren't just numbers to be solved; they are signals encoding dispersed, local, often tacit knowledge (e.g., a machine breaking down, a local preference shift, a manager's hunch). You can't upload what you don't know exists. The CPB asks for data, but the data doesn't exist until the market process reveals it.

