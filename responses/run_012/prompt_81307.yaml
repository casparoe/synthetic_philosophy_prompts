prompt: |-
  ok so write me a joke about the socialist calculation debate. And I mean actually funny to someone who knows the debate — the punchline has to turn on the real content, e.g. Lange's Central Planning Board setting prices by trial and error until they clear, versus Hayek's point that the knowledge you'd need to do that is dispersed, local, and half of it tacit, so there's nothing for the board to gather up in the first place. If someone who's read the debate hears the joke, they shouldnt come away thinking I've got the two sides mixed up.

  Also make it feel like now rather than 1930s Moscow — the board can have a giant computer, or an AI, or a really good spreadsheet, whatever. But the joke still has to be about the actual disagreement, not just "the computer crashed." Setting it somewhere specific (a bakery, a warehouse, the board's Monday morning meeting) will probably help it land.
