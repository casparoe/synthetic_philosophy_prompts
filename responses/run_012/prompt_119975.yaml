answer: |-
  Here is an audit of the chapter's argument, structured to help you navigate the philosophical terrain without getting bogged down in technical jargon. You can adapt this prose directly or use it to structure your own critique.

  ***

  Your colleague's chapter is provocative, but it rests on a series of philosophical sleights of hand that conflate scientific uncertainty with metaphysical impossibility. To treat this argument fairly, we must separate what is a genuine puzzle in moral philosophy from what is a misrepresentation of the current consensus. When we do this, the chapter's bold conclusion—that individual morality is silent on climate change—does not survive.

  **The Expected Value Move**
  The first claim to scrutinize is the assertion that expected value cannot rescue individual duty because climate damage accumulates smoothly, rendering the marginal effect of a single tonne of carbon "exactly zero." A competent consequentialist would regard this as waved away rather than defeated.

  This premise relies on a model of the climate system that is scientifically outdated. We do not live in a world of perfectly smooth accumulation; we live in a world of thresholds and tipping points. Ice sheets collapse, permafrost melts, and currents shift at specific temperatures. While we cannot know precisely which tonne of carbon triggers a cascade, we know that the probability is non-zero. In expected utility theory, a tiny probability multiplied by a catastrophic harm yields a significant negative value. To claim the marginal effect is *nil* is to confuse "unknowable to us" with "non-existent in the world." A philosopher working on collective harm would grant that the *causal pathway* is opaque, but would reject the claim that the *causal power* is zero. The expected-value response is not defeated; it is merely ignored in favor of a convenient determinism.

  **The Ambiguity of "Imperceptible"**
  The deeper philosophical error lies in the second move: the "no-drop rule." Your colleague argues that because an individual emission makes no perceptible difference to any identifiable person, it cannot be wrong. Here, the word "imperceptible" is doing double duty, shifting between epistemic and metaphysical work, and the argument collapses under the weight of that ambiguity.

  Epistemically, it is true that a single act of emitting is imperceptible. No specific victim can point to a specific storm and say, "This was caused by that drive." But your colleague slides from this epistemic limitation to a metaphysical conclusion: that because the harm is imperceptible, it is not real. This is the fallacy of the "Harmless Torturers." If a thousand torturers each turn a dial up one notch, causing no perceptible increase in pain individually, but collectively causing agonizing death, we do not say each act was permissible because the contribution was imperceptible. We say the imperceptibility is a limit of our senses, not a limit of moral reality.

  By elevating the "no-drop rule" to a settled principle, your colleague misrepresents the long-standing discussion of imperceptible contributions. Most philosophers reject the idea that moral wrongness requires a perceptible victim. Wrongness can attach to the participation in a harmful practice, even if the individual slice of participation is too small to measure. The "no-drop rule" is not a premise most ethicists accept; it is the very thing they are arguing against.

  **The Conclusion: Silence or Shift?**
  Even if we grant your colleague his most charitable premises—that individual causal impact is negligible and that thresholds are unknowable—his practical conclusion still does not follow. He argues that because individual emissions are morally idle, individual morality has nothing to say, and only collective action counts. This is a non-sequitur.

  Individual morality is not exhausted by direct causal impact. There are at least two other channels through which individual action remains morally salient. First, there is the argument from complicity. Even if my emission does not tip a threshold, it makes me a participant in an unjust structure that does. Morality often concerns who we are and what we align ourselves with, not just the measurable output of our actions. Second, there is the expressive function of individual action. Personal footprint reduction is not merely symbolic in the dismissive sense; it is a precondition for political credibility and norm-setting. To argue that individual morality is silent is to sever the link between the citizen and the polity.

  **What Survives the Correction**
  So, what remains if we repair the argument? A stronger, more nuanced version of your colleague's point would acknowledge that individual action is *insufficient*, not that it is *idle*. It is defensible to argue that focusing exclusively on personal carbon footprints is a distraction if it displaces political organizing. It is defensible to say that the primary moral obligation is to change the systems that make high-emission lives the default.

  But the leap from "systems matter most" to "individual acts are morally neutral" is unjustified. The repaired argument points not to the silence of individual morality, but to its integration with collective duty. We are not absolved of the duty to reduce emissions because the problem is collective; we are obligated to reduce emissions *because* the problem is collective, and collective change is constituted by individual shifts in behavior and demand.

  **For the Review**
  In print, you might frame this as a case of a philosophical shortcut leading to a moral dead end. Your colleague has taken a genuine puzzle—the difficulty of tracing individual causation in complex systems—and resolved it by defining the problem out of existence. He treats "imperceptible" as "non-existent" and "probabilistic" as "zero." The result is a chapter that feels liberating but offers a false absolution. You can praise the book's broader ambition while noting that on this crucial point, the philosophy is too clean for the messy world it describes. Individual action may not save the climate on its own, but to call it morally idle is to misunderstand both the math of risk and the nature of moral responsibility.
