prompt: |-
  I'm teaching a unit on utilitarianism and a colleague keeps ending arguments with the separateness of persons, as if just saying it does the work. I want a handout for students that treats it as a slogan and asks what precise claims it could be making. Lay out the distinct readings as a menu, from the almost trivial to the very strong: persons are distinct organisms, no one can occupy another's standpoint, utilities can't be summed across persons, persons have claims that block aggregation, the unit of moral accounting is the person not the total, etc. For each reading say whether it's a platitude, a substantive and defensible thesis, or false, and say which reading actually supports my colleague's use, which is to reject any policy that makes some people worse off for a bigger aggregate gain. Also include at least one reading where the slogan is really about the non-substitutability of standpoints rather than the inviolability of persons, and one where it only tells against total utilitarianism but not against prioritarian or lexically rank-ordered views. Dont bother with citations, I'll add them. Keep it as a list I can photocopy.
