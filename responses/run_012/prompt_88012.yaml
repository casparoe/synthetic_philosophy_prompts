answer: |-
  # HANDOUT: Unpacking the Slogan
  ## "The Separateness of Persons"

  **Context:** In debates about Utilitarianism, opponents often argue that classical utilitarianism fails to respect "the separateness of persons." They claim utilitarianism treats society like a single super-person, sacrificing individuals for the greater good in the same way you might sacrifice a present pain for a future gain.

  **The Problem:** "Separateness of persons" is often used as a conversation-stopper. But what does it actually *mean*? Below is a menu of distinct claims hidden inside this slogan, ranging from trivial truths to controversial moral theories.

  ***

  ### 1. The Biological Reading
  **The Claim:** Persons are distinct physical organisms. One human body cannot literally merge with another.
  *   **Status:** **Platitude.** (True, but morally inert).
  *   **Implication:** Utilitarians agree. They do not claim bodies merge; they claim *interests* can be weighed against one another. This reading does not challenge utilitarianism.

  ### 2. The Phenomenological Reading
  **The Claim:** I cannot occupy your standpoint. I cannot feel your pain or experience your happiness directly; I am locked inside my own consciousness.
  *   **Status:** **Substantive & Defensible.** (True description of human experience).
  *   **Implication:** This highlights the **non-substitutability of standpoints**. However, it does not necessarily forbid moral aggregation. Just because I can't *feel* your pain doesn't mean I shouldn't *count* it in moral calculations. This challenges the idea that society is a single mind, but not necessarily the idea that we should maximize total welfare.

  ### 3. The Aggregation Reading
  **The Claim:** Utilities are not transferable goods. You cannot sum happiness across different people in the same way you sum dollars in a bank account, because there is no "social mind" to enjoy the total.
  *   **Status:** **Contested.** (Metaphysically plausible, but morally debated).
  *   **Implication:** This suggests the math of classical utilitarianism is category error. However, one could argue that while the *experience* isn't summed, the *moral reasons* provided by those experiences can still be added up.

  ### 4. The Distributional Reading
  **The Claim:** It matters *who* gets the utility, not just *how much* exists. A gain for one person cannot automatically cancel out a loss for another simply because the math works out.
  *   **Status:** **Substantive.** (Rejects pure Total Utilitarianism).
  *   **Implication:** **This reading tells against Total Utilitarianism but spares Prioritarian or Lexical views.** If "separateness" just means "distribution matters," then views that give extra weight to the worse-off (Prioritarianism) or prioritize basic needs (Lexical views) satisfy this condition without abandoning aggregation entirely.

  ### 5. The Unit of Accounting Reading
  **The Claim:** The individual person is the proper boundary for moral accounting, not the group. We should maximize goodness *within* lives, not necessarily *across* them.
  *   **Status:** **Substantive.** (A structural claim about moral theory).
  *   **Implication:** This shifts the focus from "Maximize Total Good" to "Maximize Each Person's Good." It creates tension with policies that require significant sacrifice from a few, even if the total gain is large.

  ### 6. The Inviolability Reading (The "Side-Constraint" Reading)
  **The Claim:** Persons have claims or rights that block aggregation. An individual cannot be sacrificed or made significantly worse off merely to produce a net gain for others.
  *   **Status:** **Strong/Deontological.** (Rejects the core structure of consequentialism).
  *   **Implication:** **This is the reading your colleague is likely using.** It moves from "persons are distinct" to "persons are sacred." It asserts that the distance between persons creates a moral barrier that aggregate utility cannot cross. This supports rejecting any policy that makes some people worse off for a bigger aggregate gain.

  ***

  ### Discussion Questions

  1.  Which of the readings above is a **fact** about the world, and which is a **moral value**?
  2.  If you accept the **Phenomenological Reading** (#2), are you logically forced to accept the **Inviolability Reading** (#6)? Why or why not?
  3.  If a policy helps 1,000 people slightly but harms 1 person severely, which reading of "separateness" forbids it? Which reading allows it?
  4.  **For the Classroom:** When someone invokes "the separateness of persons," ask them: *"Are you saying we can't add utilities, or are you saying individuals have rights that trump utility?"*

  ***
  *Instructor Note: Add relevant citations here (e.g., Rawls, Nozick, Williams, Parfit).*
