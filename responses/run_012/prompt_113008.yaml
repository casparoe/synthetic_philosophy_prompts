prompt: |-
  I teach an upper-level seminar that mixes philosophy and cognitive-science students, and I want to run a session on the induction of concepts from examples: the moment when a learner has to go from a handful of labeled cases to a rule, and nothing in the cases themselves announces which rule. Eighteen students, ninety minutes, one room with movable chairs. I want them to feel in their hands three things. First, that finitely many examples underdetermine the concept. Second, that what feels like simply seeing the pattern is really the work of a prior hypothesis space they carried in with them. Third, that a concept can fail to be expressible in the vocabulary they assumed, so no quantity of further evidence will ever make it reachable. I want the standard labels for these ideas to surface only in the debrief, after they have already run into the wall.

  Design the activity around a deck of cards sorted into two labeled piles in the familiar Bongard manner, but with two additions. First, the hidden rule must not be a property of individual cards: build it so that it depends on a card's position in the sequence, or on its relation to the card before it, so that a team whose hypotheses are all of the form "classify each card on its own" can never fit the data no matter how long it stares. Second, hand the teams a restricted formal vocabulary in which they must eventually write their rule down — a fixed, short list of permitted predicates and connectives — and choose the hidden rule so that it is not expressible in that vocabulary. The vocabulary stands in for their prior hypothesis space, and the sting is that it looks generous until they need the one predicate it withholds.

  Lay out the sequence of phases with timings; the training deck and the held-out deck (give me the actual cards, both as raw labels and as whatever content is printed on them, and make sure several genuinely different rules fit every training card and come apart only on the held-out ones); the restricted vocabulary I distribute; the rule-writing and wagering mechanics; and a scoring scheme with no real money that rewards calibrated confidence and punishes both over-general and over-specific rules. Then a debrief that maps each phase onto a piece of the idea, states what will predictably go wrong the first time I run it — including what to do when a team produces a rule that fits the entire training deck yet is not the intended one, and when a team protests that the intended rule is unfair — and is candid about what the activity cannot reproduce: chiefly that I chose the true rule in advance, so the room may leave still believing there was a fact of the matter all along, and that a vocabulary handed out in advance is a thin stand-in for a hypothesis space that real learners never get to inspect.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Upper-level seminar (Philosophy + Cognitive Science). 18 students.
      *   **Duration:** 90 minutes.
      *   **Setting:** Room with movable chairs.
      *   **Core Concepts to Experience:**
          1.  Underdetermination (finite examples $\neq$ unique rule).
          2.  Hypothesis Space Bias (what we "see" depends on what we bring).
          3.  Inexpressibility (the true rule might be outside the allowed vocabulary).
      *   **Constraint 1 (Bongard Style):** Cards sorted into two piles (Positive/Negative).
      *   **Constraint 2 (Relational/Sequential Rule):** The rule *cannot* be a property of individual cards (must depend on position or relation to previous card). This ensures "atomic" hypotheses fail.
      *   **Constraint 3 (Restricted Vocabulary):** Students get a limited list of predicates/connectives. The *true* rule must be inexpressible in this vocabulary.
      *   **Deliverables:** Phase sequence/timing, Training/Held-out decks (actual content), Restricted Vocabulary, Rule-writing/Wagering mechanics, Scoring scheme, Debrief script (including troubleshooting).
      *   **Tone:** Pedagogical, precise, ready-to-run.

  2.  **Deconstruct the Core Challenge:**
      *   *The Trap:* I need a rule that looks like a standard property rule but is actually relational/sequential.
      *   *The Vocabulary Trap:* I need to give them predicates that describe card *properties* (e.g., "is Red", "is High") but withhold the relational predicate needed for the true rule (e.g., "is greater than previous").
      *   *The Underdetermination:* The training set must be compatible with multiple rules (including the true one and plausible false ones) that diverge on the held-out set.

  3.  **Designing the Card System:**
      *   *Format:* Standard playing cards are too familiar (suits, ranks). Let's use abstract symbols or modified cards to reduce prior bias, OR use standard cards but define specific features. Let's use standard cards for ease of prep, but define features explicitly (Color, Value, Suit).
      *   *The True Rule (Hidden):* Needs to be relational.
          *   Idea: "Accept if the value is higher than the previous card." (Too simple?)
          *   Idea: "Accept if the suit matches the previous card."
          *   Idea: "Accept if the parity (odd/even) flips from the previous card."
          *   *Selection:* **"Accept if the Value is strictly greater than the Value of the immediately preceding card. (First card is always Reject)."**
          *   *Why:* It forces them to look at pairs, not singles. It's easy to verify.
      *   *The Vocabulary:* Must lack "Greater Than Previous" or "Relation to Predecessor."
          *   Allowed: `IsRed`, `IsBlack`, `IsFace`, `IsNumber`, `Value > 5`, `Value < 5`, `Suit=Heart`, etc.
          *   Connectives: `AND`, `OR`, `NOT`.
          *   *Crucial Missing Piece:* No temporal/sequential operators (e.g., `Prev()`, `Next()`).
      *   *The Training Deck:* Needs to be consistent with the True Rule *and* consistent with a plausible "Atomic" Rule (one that fits the vocabulary) so they get confident, only to fail on the Held-Out deck.
          *   *Atomic Distractor Rule:* "Accept if Value > 7".
          *   *Construction:* I need a sequence where `Value > Previous` correlates perfectly with `Value > 7` for the training set, but diverges in the test set.

  4.  **Drafting the Decks:**
      *   *True Rule (T):* $V_n > V_{n-1}$ (with $V_0 = \infty$ so Card 1 is Reject).
      *   *Distractor Rule (D):* $V_n \geq 8$.
      *   *Training Sequence:*
          1.  4 (Reject) -> T: Reject (4 < $\infty$), D: Reject (4 < 8). Match.
          2.  10 (Accept) -> T: Accept (10 > 4), D: Accept (10 $\geq$ 8). Match.
          3.  3 (Reject) -> T: Reject (3 < 10), D: Reject (3 < 8). Match.
          4.  9 (Accept) -> T: Accept (9 > 3), D: Accept (9 $\geq$ 8). Match.
          5.  5 (Reject) -> T: Reject (5 < 9), D: Reject (5 < 8). Match.
          6.  12 (Q) (Accept) -> T: Accept (12 > 5), D: Accept (12 $\geq$ 8). Match.
          *   *Check:* Does this look like a pattern? Yes. High cards are Accept, Low cards are Reject.
      *   *Held-Out Sequence (The Sting):*
          1.  6 (Reject) -> T: Reject (6 < $\infty$), D: Reject (6 < 8). Match. (Need a divergence).
          2.  7 (Accept) -> T: Accept (7 > 6), D: Reject (7 < 8). **DIVERGENCE.**
          3.  2 (Reject) -> T: Reject (2 < 7), D: Reject (2 < 8). Match.
          4.  4 (Accept) -> T: Accept (4 > 2), D: Reject (4 < 8). **DIVERGENCE.**
      *   *Wait, I need the students to fail.* If the True Rule is relational, and their Vocabulary is atomic, they *cannot* write the True Rule. They will write the Distractor Rule (or similar). When they test on Held-Out, their rule will fail.
      *   *Refinement:* The prompt asks for the rule to be *inexpressible* in the vocabulary. So they *must* fail to write the True Rule. The activity should demonstrate that their best atomic fit fails on new data because the *structure* of the world is relational, not atomic.

  5.  **Designing the Mechanics:**
      *   Teams of 3 (6 teams total).
      *   Phase 1: Observation (Training Deck).
      *   Phase 2: Hypothesis Generation (using Vocabulary).
      *   Phase 3: Wagering (Confidence on Held-Out).
      *   Phase 4: Reveal & Debrief.
      *   Scoring: Needs to punish overconfidence. Brier score style or simple points. Let's use a "Confidence Token" system.

  6.  **Developing the Debrief:**
      *   Map Phase 1 to Underdetermination (many rules fit).
      *   Map Phase 2 to Hypothesis Space (Vocabulary limited thought).
      *   Map Phase 3/4 to Inexpressibility/Inductive Bias (The wall).
      *   Address the "Unfairness" complaint (This is the point).
      *   Address the "Fact of the Matter" issue (Instructor bias).

  7.  **Refining the Constraints & Logic:**
      *   *Constraint Check:* "Hidden rule must not be a property of individual cards." -> My `Value > Previous` rule satisfies this.
      *   *Constraint Check:* "Restricted vocabulary... true rule not expressible." -> My vocabulary lacks `Previous`. Satisfied.
      *   *Constraint Check:* "Several genuinely different rules fit every training card." -> `Value > 7`, `IsRed` (if I arrange colors), `Value > Previous`. I need to ensure the Training Deck supports at least two distinct *types* of rules (Atomic vs Relational) that fit perfectly.
      *   *Correction on Training Deck:* If I make the Training Deck fit `Value > 7` perfectly, they will propose that. If I make it fit `Value > Previous` perfectly, that's the truth. I need the Training Deck to fit *both*.
      *   *Correction on Held-Out:* The Held-Out deck must show that `Value > 7` is wrong, but since they can't write `Value > Previous`, they will have *no* rule that works. This proves the "Inexpressibility" point. They will realize their tools are broken.

  8.  **Finalizing the Card Data:**
      *   Let's use specific cards to ensure no ambiguity about suits/colors interfering.
      *   Training: 10 cards.
      *   Held-Out: 5 cards.
      *   True Rule: $V_n > V_{n-1}$ (Card 1 is automatically Negative).
      *   Plausible Atomic Rule: $V_n \in \{9, 10, J, Q, K\}$.
      *   Let's construct the sequence carefully.

      *   *Training Sequence:*
          1.  5♣ (Neg) [Start]
          2.  10♥ (Pos) [10>5, High]
          3.  4♠ (Neg) [4<10, Low]
          4.  9♦ (Pos) [9>4, High]
          5.  3♣ (Neg) [3<9, Low]
          6.  K♠ (Pos) [13>3, High]
          7.  2♥ (Neg) [2<13, Low]
          8.  J♦ (Pos) [11>2, High]
          9.  6♣ (Neg) [6<11, Low]
          10. Q♥ (Pos) [12>6, High]
          *   *Check:* Every Pos is High (9+). Every Neg is Low (6-). Perfect correlation for Atomic learners. Perfect fit for Relational learners.

      *   *Held-Out Sequence:*
          1.  7♠ (Neg) [Start]
          2.  8♦ (Pos) [8>7, **Low**] -> Atomic predicts Neg. True is Pos.
          3.  5♣ (Neg) [5<8, Low]
          4.  6♥ (Pos) [6>5, **Low**] -> Atomic predicts Neg. True is Pos.
          5.  A♠ (Pos) [1>6?? No, Ace is 1 or 14]. Let's make Ace 14. [14>6, High].
          *   *Wait:* If Ace is 14, it fits Atomic too. I need more divergence.
          *   *Revised Held-Out:*
          1.  7♠ (Neg)
          2.  8♦ (Pos) [Relational: Yes. Atomic: No]
          3.  5♣ (Neg) [Relational: No. Atomic: No]
          4.  6♥ (Pos) [Relational: Yes. Atomic: No]
          5.  4♦ (Neg) [Relational: No. Atomic: No]
          *   *Result:* Atomic Rule gets 3/5 wrong. Relational Rule gets 5/5 right. But students *cannot* write Relational Rule. They will be stuck.

  9.  **Scoring & Wagering:**
      *   Give teams 100 "Credence Points".
      *   They must write a rule in the Vocabulary.
      *   They wager on how many Held-Out cards their rule will classify correctly.
      *   If they claim 5/5 and get 3/5, they lose big. If they claim 3/5 and get 3/5, they break even.
      *   This forces calibration.

  10. **Debrief Nuances:**
      *   *Predictable Failure 1:* A team finds a complex atomic rule that fits Training but fails Held-Out. (Good, illustrates overfitting/bias).
      *   *Predictable Failure 2:* A team claims the task is impossible. (Good, illustrates inexpressibility).
      *   *Predictable Failure 3:* A team guesses the relational rule but can't write it down. (Crucial moment for the "Vocabulary" point).
      *   *Instructor Honesty:* Must admit I picked the rule. The "Truth" was arbitrary. This mirrors the "Grue" problem or theory-ladenness.

  11. **Review against Constraints:**
      *   18 students? Yes (6 teams of 3).
      *   90 mins? Yes (Timings allocated).
      *   Movable chairs? Yes (Team clusters).
      *   Three feelings (Underdetermination, Hypothesis Space, Inexpressibility)? Yes, mapped to phases.
      *   Labels only in debrief? Yes.
      *   Restricted Vocabulary? Yes (provided in handout).
      *   Actual Cards? Yes (listed).
      *   Scoring? Yes (Credence Points).
      *   Debrief script? Yes (including troubleshooting).

  12. **Final Polish:**
      *   Ensure the "Vocabulary" handout looks official and restrictive.
      *   Make sure the card values are clear (Ace = 14 to avoid confusion, or specify). Let's specify Ace = 14 for "High" logic, but wait, in the relational rule $14 > 6$ works. In the atomic rule $14 \geq 9$ works. I need the Held-Out to break Atomic.
      *   *Held-Out Re-Check:*
          *   Card 1: 7 (Neg).
          *   Card 2: 8 (Pos). Atomic says Neg (8<9). Relational says Pos (8>7). **Break.**
          *   Card 3: 5 (Neg). Atomic says Neg. Relational says Neg (5<8).
          *   Card 4: 6 (Pos). Atomic says Neg (6<9). Relational says Pos (6>5). **Break.**
          *   Card 5: 4 (Neg). Atomic says Neg. Relational says Neg (4<6).
      *   This works perfectly. The Atomic rule fails on cards 2 and 4.

  13. **Writing the Output:** Structure clearly with headings. Ensure tone is professional yet instructional. (Self-Correction: Make sure to emphasize that the *Instructor* knows the rule is relational, but the *Students* are blinded by the vocabulary).

  14. **Final check on "Inexpressibility":** The prompt says "choose the hidden rule so that it is not expressible in that vocabulary." My plan does this. The vocabulary has no `Prev()` function. They literally cannot write the solution. This is the key "sting."

  15. **Final check on "Underdetermination":** The training deck fits both Atomic and Relational rules. So finite examples did not determine the concept.

  16. **Final check on "Hypothesis Space":** The vocabulary *is* the hypothesis space. They are biased to look for Atomic properties because that's all the tools they have.

  Let's assemble.
answer: |-
  # Session Plan: The Wall of Vocabulary
  **Topic:** Induction, Underdetermination, and Hypothesis Spaces
  **Time:** 90 Minutes
  **Students:** 18 (6 teams of 3)
  **Room:** Movable chairs (clustered into 6 pods)

  ## 1. Preparation & Materials

  ### A. The Restricted Vocabulary (Handout)
  Print one copy per team. This defines their "Hypothesis Space."

  > **PERMITTED PREDICATES (Apply to a single card $C_n$):**
  > *   `RED(C_n)` / `BLACK(C_n)`
  > *   `SUIT(C_n, s)` where $s \in \{H, D, C, S\}$
  > *   `VALUE(C_n) > k` / `VALUE(C_n) < k` / `VALUE(C_n) = k` (where $k \in \{1..14\}$)
  > *   `FACE(C_n)` (True for J, Q, K)
  > *   `NUMBER(C_n)` (True for 2..10)
  >
  > **PERMITTED CONNECTIVES:**
  > *   `AND`, `OR`, `NOT`, `( )`
  >
  > **RULE FORMAT:**
  > *   `ACCEPT IF [Formula]`
  > *   *Note: Formulas may only reference properties of the current card $C_n$. References to previous cards ($C_{n-1}$), sequence position, or deck history are strictly prohibited.*

  ### B. The Decks
  Use a standard deck of cards. Remove all cards not listed below to prevent accidental shuffling errors. Ace = 14.

  **The Training Deck (10 Cards)**
  *Presented sequentially. The "Label" is the Truth (Positive/Negative).*
  | Seq | Card | Value | True Label | Fits Atomic Rule? ($V \geq 9$) | Fits Relational Rule? ($V_n > V_{n-1}$) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | 5♣ | 5 | **Negative** | Yes (5<9) | Yes (Start) |
  | 2 | 10♥ | 10 | **Positive** | Yes (10$\geq$9) | Yes (10>5) |
  | 3 | 4♠ | 4 | **Negative** | Yes (4<9) | Yes (4<10) |
  | 4 | 9♦ | 9 | **Positive** | Yes (9$\geq$9) | Yes (9>4) |
  | 5 | 3♣ | 3 | **Negative** | Yes (3<9) | Yes (3<9) |
  | 6 | K♠ | 13 | **Positive** | Yes (13$\geq$9) | Yes (13>3) |
  | 7 | 2♥ | 2 | **Negative** | Yes (2<9) | Yes (2<13) |
  | 8 | J♦ | 11 | **Positive** | Yes (11$\geq$9) | Yes (11>2) |
  | 9 | 6♣ | 6 | **Negative** | Yes (6<9) | Yes (6<11) |
  | 10 | Q♥ | 12 | **Positive** | Yes (12$\geq$9) | Yes (12>6) |

  *Note: The Training Deck is perfectly consistent with two competing rules: (1) "Accept High Cards ($\geq 9$)" and (2) "Accept if Higher Than Previous."*

  **The Held-Out Deck (5 Cards)**
  *Kept face down until Phase 3.*
  | Seq | Card | Value | True Label | Fits Atomic Rule? ($V \geq 9$) | Fits Relational Rule? ($V_n > V_{n-1}$) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | 7♠ | 7 | **Negative** | Yes (7<9) | Yes (Start) |
  | 2 | 8♦ | 8 | **Positive** | **NO** (8<9) | **YES** (8>7) |
  | 3 | 5♣ | 5 | **Negative** | Yes (5<9) | Yes (5<8) |
  | 4 | 6♥ | 6 | **Positive** | **NO** (6<9) | **YES** (6>5) |
  | 5 | 4♦ | 4 | **Negative** | Yes (4<9) | Yes (4<6) |

  *Note: The Atomic Rule fails on cards 2 and 4. The Relational Rule succeeds on all. However, the Relational Rule is forbidden by the Vocabulary.*

  ---

  ## 2. Session Sequence (90 Minutes)

  ### Phase 1: The Induction Trap (20 mins)
  *   **Setup (5 mins):** Divide students into 6 teams of 3. Distribute the **Restricted Vocabulary Handout**. Tell them: *"You are learning a classification rule. You must write your final rule using only the symbols on this sheet. Any rule using concepts not listed here will be disqualified."*
  *   **Observation (15 mins):** Deal the **Training Deck** one card at a time onto a central table. Announce the Label (Positive/Negative) for each card immediately after revealing it.
      *   *Instructor Script:* "Card 1: 5 of Clubs. Label: Negative. Card 2: 10 of Hearts. Label: Positive..."
      *   Teams take notes. They must formulate a hypothesis that fits all 10 cards.
      *   *Constraint:* Remind them halfway through: *"Remember, your final rule must be written in the Permitted Vocabulary."*

  ### Phase 2: The Vocabulary Lock (20 mins)
  *   **Task:** Teams must agree on a single `ACCEPT IF...` statement using the handout.
  *   **The Sting:** Teams will naturally converge on `VALUE(C_n) >= 9`. It fits the data perfectly. Some may notice the sequential pattern ($V_n > V_{n-1}$), but they will find they cannot write it down.
  *   **Instructor Role:** Circulate. If a team says, "It depends on the previous card," reply: *"Then you cannot write the rule. You must find a property of the individual card that captures the pattern."* (This forces them to experience the inexpressibility).
  *   **Output:** Each team writes their rule on a slip of paper.

  ### Phase 3: Wagering & Calibration (20 mins)
  *   **Setup:** Give each team 100 **Credence Points**.
  *   **Task:** Reveal the **Held-Out Deck** cards one by one.
  *   **Wagering:** Before revealing the label of a Held-Out card, teams must wager on whether their rule will classify it correctly.
      *   They can wager 0 to 20 points per card.
      *   If their rule matches the True Label: They win the wagered amount.
      *   If their rule mismatches the True Label: They lose the wagered amount.
      *   *Alternative:* To simplify, have them wager on their *total* score. "We bet 80 points that our rule will get at least 4/5 correct."
      *   *Selected Mechanic:* **Confidence Contract.** Teams submit a prediction: "Our rule will get X out of 5 correct."
          *   If Reality $\geq$ Prediction: Score = $100 + (Reality - Prediction) \times 10$.
          *   If Reality $<$ Prediction: Score = $100 - (Prediction - Reality) \times 20$.
          *   *This punishes overconfidence heavily.*
  *   **Reveal:** Go through the 5 Held-Out cards. Reveal the True Label. Let teams grade their own rules.
  *   **Outcome:** Teams using the Atomic Rule (`Value >= 9`) will get 3/5 correct. They will likely have predicted 5/5. Their scores will crash.

  ### Phase 4: The Debrief (30 mins)
  *   **Step 1: The Post-Mortem (5 mins):** Ask teams to report their rule and their score. Most will report `Value >= 9` and a low score.
  *   **Step 2: Revealing the Truth (5 mins):** Reveal the actual rule: *"Accept if the value is strictly greater than the previous card."*
  *   **Step 3: Mapping the Concepts (20 mins):** Use the board to map their experience to the philosophy.

  ---

  ## 3. Debrief Script & Troubleshooting

  ### Mapping the Experience
  1.  **Underdetermination (Phase 1):**
      *   *Ask:* "Did the Training Deck force you to one conclusion?"
      *   *Point:* No. The data was consistent with both the Atomic Rule and the Relational Rule. Finite data never entails a unique theory. (Quine/Duhem).
  2.  **Hypothesis Space Bias (Phase 2):**
      *   *Ask:* "Why did almost everyone write an Atomic Rule?"
      *   *Point:* Not because the world *was* atomic, but because your **Vocabulary** was atomic. Your hypothesis space was constrained by the predicates I handed you. You saw what your tools allowed you to see. (Theory-ladenness / Kuhn).
  3.  **Inexpressibility (Phase 3):**
      *   *Ask:* "Did anyone realize the Relational Rule during Phase 1?" (Likely hands will go up). "Why didn't you submit it?"
      *   *Point:* Because it was **inexpressible** in the vocabulary. This is the sting. Sometimes the true structure of the world cannot be captured by our current conceptual scheme. No amount of evidence (Training Deck) helps if the language lacks the necessary operator (e.g., `Prev()`).

  ### Predictable Failures & Responses

  **Failure 1: A team produces a rule that fits the Training Deck but is not the intended one.**
  *   *Scenario:* They submit `VALUE >= 9`.
  *   *Response:* "This is expected. This is the 'Underdetermination' point. Your rule is *consistent* with the training data, but not *determined* by it. The Held-Out deck was designed to falsify exactly this class of rules."

  **Failure 2: A team protests that the Relational Rule is 'unfair' because it wasn't in the vocabulary.**
  *   *Response:* "Exactly. In real science, we don't get a handout of the universe's vocabulary. We assume our current concepts (space, time, mass) are sufficient. If the true law requires a concept we don't have (like 'curvature' before Riemann, or 'entropy' before Boltzmann), we will keep fitting 'Atomic Rules' to relational data and failing. The unfairness is the lesson."

  **Failure 3: A team guesses the Relational Rule and tries to write it anyway.**
  *   *Scenario:* They write `VALUE(C_n) > VALUE(C_{n-1})`.
  *   *Response:* Disqualify the rule based on the Handout constraints. *"You have stepped outside the hypothesis space. In this simulation, that is a syntax error. In history, this is a paradigm shift—but for the purpose of the scoring, you must operate within the provided language."* (This reinforces the constraint that scientific communities often reject inexpressible hypotheses until the vocabulary expands).

  ### Candid Limitations (The "Meta" Debrief)
  *Conclude with these three caveats to prevent misunderstanding:*

  1.  **The Fact of the Matter:** "In this game, I chose the rule in advance. There *was* a truth. In real induction (e.g., 'What is Justice?' or 'What is Consciousness?'), there may be no single rule to find, only better or worse predictive models. Don't leave thinking there is always a hidden 'True Rule' waiting to be found."
  2.  **The Vocabulary Stand-in:** "The handout was a crude proxy for a hypothesis space. Real cognitive priors aren't printed on paper; they are neural weights, cultural habits, and linguistic structures you can't inspect. You didn't choose your vocabulary today; I did. In life, you inherit it."
  3.  **The Sequential Artifact:** "I made the rule sequential to break your atomic bias. In reality, the 'missing predicate' might not be time-based. It might be a modal operator, a second-order property, or a social relation you haven't conceptualized yet."

  ---

  ## 4. Scoring Scheme Summary

  **Confidence Contract**
  *   **Baseline:** 100 Points.
  *   **Prediction:** Team predicts $P$ correct classifications (0-5).
  *   **Result:** Team actually gets $R$ correct classifications (0-5).
  *   **Calculation:**
      *   If $R \geq P$ (Calibrated or Under-confident): Score = $100 + (R - P) \times 10$.
      *   If $R < P$ (Over-confident): Score = $100 - (P - R) \times 20$.
  *   **Example:**
      *   Team predicts 5/5. Gets 3/5. Score = $100 - (2 \times 20) = 60$. (Penalty for overconfidence).
      *   Team predicts 3/5. Gets 3/5. Score = $100 + 0 = 100$. (Reward for calibration).
      *   Team predicts 2/5. Gets 3/5. Score = $100 + (1 \times 10) = 110$. (Reward for humility).

  **Winning Condition:** The team with the highest final score wins "Epistemic Virtue" (bragging rights). This incentivizes them to recognize the ambiguity of the Held-Out deck rather than blindly trusting their Training Deck induction.
