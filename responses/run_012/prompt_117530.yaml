answer: |-
  **MEMORANDUM**

  **TO:** Character and Fitness Committee
  **FROM:** Chair, Character and Fitness
  **SUBJECT:** Revised Decision Procedure for Applicant Evaluation (Protocol 2024-CF)

  **PREAMBLE: THE THEORETICAL SYNTHESIS**

  We are operating under a false premise. My colleague the psychologist is empirically correct on one point: global character traits (e.g., "honesty," "integrity") do not predict specific behaviors across diverse situations. The virtue ethicist is normatively correct on the other: professional ethics is a skill set (*phronesis*) cultivated through habituation, not a fixed state of being.

  Therefore, this office will cease attempting to *predict* whether an applicant is a "good person." We cannot know that. Instead, we will assess **Ethical Competency and Risk Mitigation.** We are not screening for saints; we are screening for practitioners who recognize ethical traps and possess the practiced habits to navigate them.

  The following procedure replaces the "Character Inquiry" with the "Professional Conduct Competency Review."

  ---

  ### PART I: THE DECISION PROCEDURE

  #### A. The Threshold Filters (Automatic "No" or "Deferral")
  *These are not character judgments; they are empirical risk flags based on recency and direct relevance to legal fiduciary duties.*

  1.  **Fraud on the Application:** Any material falsehood on the Bar application itself results in an immediate **Denial**.
      *   *Rationale:* This is a "strong situation" with high stakes and clear rules. Failure here indicates a lack of basic compliance habituation, regardless of "character."
  2.  **Recent Financial Fiduciary Breach:** A finding of fraud, embezzlement, or breach of fiduciary duty within the last **5 years** results in an automatic **Committee Review** (presumptive denial unless restitution and rehabilitation are unequivocal).
  3.  **Violent Felonies:** Any conviction involving violence within the last **7 years** results in **Committee Review**.
      *   *Rationale:* Legal practice involves high-stress confrontation. Recent inability to control physical aggression is a situational risk we cannot underwrite.

  #### B. The Competency Interview (Replacing the "Character" Interview)
  *Situationist evidence shows self-reports ("I am honest") are worthless. We must ask for specific behavioral evidence in specific contexts.*

  **The Question Protocol:**
  Do not ask: *"Are you ethical?"* or *"What would you do if..."*
  Ask: *"Describe a specific time in the last three years when you were under pressure to violate a rule or norm."*

  **Follow-up Matrix (The "Sufficient Answer" Criteria):**
  A sufficient answer must contain three elements. If any are missing, flag for Committee Review.
  1.  **Situational Awareness:** Did the applicant identify the specific pressure? (e.g., "My boss needed the billable hours," not "It was a hard time.")
  2.  **Action Specificity:** Did they describe concrete steps taken? (e.g., "I documented the discrepancy," not "I did the right thing.")
  3.  **Post-Hoc Reflection:** Do they acknowledge the cost? (e.g., "I lost the client," or "It was awkward.") *If they claim there was no cost to doing the right thing, they are likely rationalizing or lucky, not skilled.*

  #### C. The Committee Handoff (Where We Stop)
  *The staff reviewer applies the protocol. The Committee decides the values.*

  **Send to Committee if:**
  1.  **The "Luck" Factor:** The applicant avoided misconduct, but the record suggests they lacked the agency to stop it (e.g., the fraud was discovered by an auditor before they had to sign). We cannot license luck.
  2.  **Value Conflicts:** The applicant's justification for past conduct relies on a moral framework incompatible with the law (e.g., "I stole because the system is unjust"). This is not a factual determination; it is a normative judgment on their fitness to serve as an officer of the court.
  3.  **Institutional Risk:** The applicant is joining a firm with a known history of misconduct. The risk is not the individual, but the *interaction* between the individual and the environment.

  #### D. Known Failure Modes (Where This Procedure Misfires)
  *We must be plain about our limitations.*

  1.  **The "Halo" Effect:** We will still be biased by articulate applicants. The protocol reduces this, but does not eliminate it.
  2.  **The "Weak Situation" Problem:** An interview is an artificial environment. An applicant can perform "ethics" in a quiet room better than in a chaotic discovery deadline. **We acknowledge we cannot test for high-pressure ethical performance.**
  3.  **The "Reformed" Error:** We assume time + no new convictions = rehabilitation. Situationism suggests that if we place a reformed applicant back into the *original* situational context (e.g., financial desperation), the behavior may recur. We cannot control their life context post-admission.

  ---

  ### PART II: APPLICATION TO PENDING CASES

  #### Case 1: The Twelve-Year-Old Petty Theft Conviction
  *Applicant: 35 years old. Conviction at 23. No subsequent record. Law school record clean.*

  *   **Protocol Application:**
      *   **Threshold:** Does not trigger automatic denial (outside 7-year window for non-fiduciary crime).
      *   **Competency Inquiry:** Did the applicant acknowledge the situational drivers of the theft? (e.g., "I was addicted," "I was desperate.")
      *   **Virtue/Situation Synthesis:** Virtue ethics requires habituation. 12 years is sufficient time for new habits to form. Situationism suggests the context of law school/practice is different from the context of the theft.
  *   **Decision:** **PASS.**
  *   **Reasoning:** The temporal gap suggests a change in habituation. Unless the theft involved deception relevant to fiduciary duty (e.g., forgery), the situational predictors for legal misconduct are not present. To deny based on "character" would be to ignore the empirical evidence that behavior is context-bound.

  #### Case 2: The Innocent Employee at a Fraudulent Firm
  *Applicant: Worked at Firm X during the period of billing fraud. Not charged. Whistleblower report indicates applicant knew of irregularities but did not sign the false bills.*

  *   **Protocol Application:**
      *   **Threshold:** Triggers Committee Review (Institutional Risk/Value Conflict).
      *   **Competency Inquiry:** We cannot ask "Are you honest?" We must ask: "What specific steps did you take when you noticed the irregularities?"
      *   **The Trap:** If they say "I didn't want to get involved," that is a risk. If they say "I reported it to compliance," that is a skill.
      *   **Situationist Warning:** They may have been "innocent" simply because they were low-level and never *asked* to sign. This is luck, not virtue.
  *   **Decision:** **COMMITTEE REVIEW.**
  *   **Reasoning:** We cannot distinguish between *resistance* and *irrelevance* without deeper evidence. The Committee must determine if the applicant possesses the *courage* competency required for practice, or if they merely occupied a blind spot in the fraud. This is a values judgment, not a factual one.

  #### Case 3: The Interview Process Itself
  *Observation: The Protocol admits the interview is a "weak situation" that cannot predict high-pressure misconduct.*

  *   **Protocol Application:**
      *   **Failure Mode:** The interview assesses the ability to *talk* about ethics, not to *practice* them under duress.
      *   **Empirical Reality:** The situationist evidence (Milgram, Zimbardo, Darley & Batson) confirms that environmental incentives overwhelm individual disposition. A 45-minute interview cannot override the incentive structure of 2,400 billable hours.
  *   **Decision:** **ABOLISH THE INDIVIDUAL ETHICS INTERVIEW.**
  *   **Reasoning:** It provides a false sense of security. It screens for articulateness, not conduct. It is an inefficient use of volunteer lawyer time and creates a "licensing halo" that makes the public believe we have vetted "goodness" when we have only vetted "narrative consistency."

  ---

  ### PART III: THE REGULATORY SHIFT (SITUATIONAL LIABILITY)

  If we abandon the individual character screen, we must regulate the *situation*. The Bar's authority is currently wasted on screening the sheep while ignoring the wolves' den.

  **Proposal: The Situational-Liability Rule**

  Instead of asking applicants if they will resist pressure, we sanction firms that create predictable pressure.

  1.  **Incentive Audits:** Firms must disclose billing structures that create conflicts of interest (e.g., quotas that exceed realistic non-fraudulent capacity).
  2.  **Vicarious Sanctions:** If a firm produces multiple ethical violations within a 5-year period, the firm itself faces probation or disbarment of its managing partners, regardless of individual intent.
      *   *Rationale:* Situationism proves that if you put normal people in a broken system, they break. Therefore, the system is the tortfeasor.
  3.  **Whistleblower Protection:** The Bar must guarantee anonymity and career protection for associates who report structural incentives to cut corners. Currently, the "Character and Fitness" requirement is used to threaten associates into silence ("If you report this, we will flag your fitness for other jurisdictions"). This must end.

  **Conclusion**

  My friend the psychologist is right: We cannot screen for character traits that do not exist as stable predictors. I was right: We can screen for the *skill* of ethical navigation. But the ultimate conclusion of combining these views is that **individual screening is a blunt instrument for a structural problem.**

  We should approve the 12-year-old theft applicant. We should scrutinize the fraud-firm applicant not for guilt, but for agency. And we should dismantle our interview process, replacing it with a regulatory regime that holds law firms liable for the situational pressures they engineer. We cannot make lawyers virtuous by asking them if they are good. We can only make misconduct less profitable by changing the situation.

  **Recommendation:** Adopt Protocol 2024-CF immediately. Draft proposal for Situational-Liability Rule for the next Supreme Court session.

  **Chair, Character and Fitness**
