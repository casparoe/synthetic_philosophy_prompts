prompt: |-
  I spent most of last night arguing with my oldest friend, a social psychologist, who holds that the vocabulary of character is empirically bankrupt — that the obedience experiments, the seminary-student good-Samaritan study, and the small field experiments on mood and helping show conduct is driven by situation, and that a person's self-described integrity predicts almost nothing — while I kept answering that virtue ethics was never a predictive thesis about cross-situational consistency and that virtue is a skill built by practice rather than a trait you can score. Neither of us moved, and I need something better than a truce, because I run the character-and-fitness reviews at our state bar: a few hundred applicants a year, each decided by a committee of practicing lawyers in under an hour, mostly on the basis of an interview and a self-report form. Write the decision procedure my office can actually run — the questions to ask in order for each file, what counts as a sufficient answer, where it stops with a clear no, and where it must hand the question to the committee because the issue is values, institutional risk, or our own exposure rather than the applicant. Ground it in what the situationist evidence actually establishes and in the best virtue-ethical reply to it, keep the distinctions that survive operationalization and say plainly which ones get lost, and mark the points where the procedure will misfire. Then run it on three cases: an applicant with a twelve-year-old conviction for petty theft; an applicant who personally did nothing wrong at a firm now under investigation for billing fraud; and the interview process itself, which I suspect the procedure will tell me to abandon — and if so, what the bar should regulate instead, including whether the situational-liability rule now being floated, under which firms would be sanctioned for incentive structures that predictably produce misconduct, is a better use of our authority than screening individuals.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Prompt:**

      *   **The Conflict:** The user (Bar Character & Fitness Chair) vs. their friend (Social Psychologist).
          *   *Psychologist's View:* Situationism (Mischel, Milgram, Darley & Batson). Character traits aren't consistent predictors of behavior across situations. Self-reports are useless.
          *   *User's View:* Virtue Ethics (Aristotle, MacIntyre, etc.). Virtue is a skill/practice, not a fixed trait. It's not about cross-situational prediction but cultivation.
      *   **The Task:** Create a practical decision procedure for Bar Character & Fitness reviews (hundreds of applicants, <1 hour per file, committee of lawyers).
      *   **Requirements:**
          *   Grounded in situationist evidence *and* virtue ethics replies.
          *   Operationalizable distinctions (what survives, what gets lost).
          *   Mark points of failure (where the procedure misfires).
          *   Define clear "No," "Committee Review," and "Pass" criteria.
          *   Apply to three cases: (1) 12-year-old petty theft conviction, (2) Innocent employee at a fraudulent firm, (3) The interview process itself (and potential replacement with firm-level regulation).
      *   **Tone:** Professional, pragmatic, philosophically rigorous but operationally grounded.

  2.  **Analyze the Theoretical Tension:**

      *   *Situationism:* Behavior is heavily influenced by context (mood, authority, peer pressure). Global traits (honesty, integrity) don't predict specific actions well. Past behavior predicts future behavior *only* in similar contexts.
      *   *Virtue Ethics:* Virtue is a *hexis* (stable disposition) developed through habituation. It's not about being perfect everywhere, but about practical wisdom (*phronesis*) in navigating contexts.
      *   *Synthesis for Bar Review:* We cannot predict *if* they will lie in a high-pressure negotiation. We *can* assess if they recognize the ethical stakes, have a history of acknowledging errors, and understand the specific situational pressures of legal practice. We must shift from "Are they a good person?" to "Do they have the *skills* to navigate ethical traps?"

  3.  **Drafting the Decision Procedure (The "Protocol"):**

      *   *Goal:* Move from "Trait Assessment" (failed) to "Competency & Context Assessment" (viable).
      *   *Structure:*
          1.  **Threshold Questions (Hard Stops):** Criminal history, dishonesty on the application.
          2.  **Contextual Inquiry (The Interview):** Focus on specific past situations, not general self-assessment.
          3.  **Committee Triggers:** Ambiguity, value conflicts, institutional risk.
          4.  **Failure Modes:** Where the model breaks.

      *   *Integrating Situationism:* Acknowledge that a "good" person can break under pressure. Look for *awareness* of pressure.
      *   *Integrating Virtue Ethics:* Look for evidence of *habituation* (repeated practice of right action) and *reflection* (learning from mistakes).

  4.  **Developing the Specific Questions/Criteria:**

      *   *Bad Question:* "Are you honest?" (Self-report, useless per situationism).
      *   *Good Question:* "Describe a time you were pressured to cut a corner. What was the specific pressure? What did you do? What would you do now?" (Situation-specific, tests reflection).
      *   *Scoring:* Not "Good/Bad," but "Risk/Awareness/Mitigation."

  5.  **Addressing the "Lost Distinctions":**

      *   *Lost:* The idea of "innate goodness." The idea that one bad act defines the whole soul.
      *   *Kept:* The distinction between *mistake* and *pattern*. The distinction between *acknowledgment* and *rationalization*.

  6.  **Running the Three Cases:**

      *   *Case 1 (Petty Theft, 12 years ago):*
          *   Situationist view: Past act in different context $\neq$ future legal misconduct.
          *   Virtue view: Has habituation changed since then?
          *   Decision: Likely Pass *if* restitution made, no recurrence, and applicant shows insight. The "12 years" matters (habituation time).
      *   *Case 2 (Innocent at Fraudulent Firm):*
          *   Situationist view: They were in the "compliance" situation. Did they succumb?
          *   Virtue view: Did they exercise *phronesis*? Did they speak up? Or were they willfully blind?
          *   Decision: Committee Review. Need to know if they were *capable* of resisting the situation or just lucky.
      *   *Case 3 (The Interview Process):*
          *   The prompt suspects the procedure will say "abandon."
          *   Analysis: If situationism is right, a 1-hour interview is a "weak situation" (artificial) that doesn't predict behavior in "strong situations" (client pressure).
          *   Alternative: Regulate the *environment* (firms). The "Situational-Liability Rule."

  7.  **Refining the "Situational-Liability Rule":**

      *   This is the punchline. If individual screening is empirically weak, shift regulation to the structures that create misconduct (billable hours, incentive structures).
      *   This aligns with the psychologist's view (context drives behavior) and the virtue ethicist's view (communities cultivate virtue).

  8.  **Review and Polish:**

      *   *Check Constraints:* Did I answer the specific questions? (Decision procedure, questions, sufficient answers, clear no, committee handoff, misfire points, 3 cases).
      *   *Tone Check:* Is it respectful to both the psychologist and the virtue ethicist? Yes, by synthesizing them into a "Professional Competency" model.
      *   *Clarity:* Ensure the distinction between "Character as Trait" (rejected) and "Character as Skill" (accepted) is clear.

  9.  **Final Output Structure:**
      *   Introduction: Acknowledging the stalemate and proposing the synthesis.
      *   Part I: The Operational Protocol (The Decision Procedure).
      *   Part II: What Survives and What Dies (Theoretical grounding).
      *   Part III: Failure Modes (Where it misfires).
      *   Part IV: Application to the Three Cases.
      *   Part V: The Structural Shift (Regulating Firms).

  *(Self-Correction during drafting)*: I need to make sure I don't just say "Virtue Ethics wins." The prompt asks to ground it in what situationist evidence *actually establishes*. Situationism establishes that global traits are poor predictors. So the procedure *must* stop trying to predict global traits. It must focus on *specific* ethical competencies. I need to be hard-nosed about the interview's limitations.

  *(Refining the "Clear No")*: What is an automatic disqualifier? Fraud on the application. That's a direct test of current integrity in a high-stakes context. It's a "strong situation" right now.

  *(Refining the "Committee Handoff")*: When do humans need to decide? When it's about values, not facts. E.g., Is this mitigation enough? That's a normative judgment, not empirical.

  *(Refining Case 3)*: The prompt hints the procedure will tell me to abandon the interview. I should lean into that. If the interview is theater, stop doing theater. Focus on the structural incentives.

  10. **Final Polish:** Check word count and flow. Ensure the "Situational-Liability Rule" is explained clearly as an alternative regulatory mechanism. (Proceed to generate response).

  *(Post-Drafting Check)*: Did I address the "twelve-year-old conviction"? Yes. "Innocent at fraudulent firm"? Yes. "Interview process"? Yes. Did I mark the misfires? Yes. Is the tone appropriate for a Bar Chair? Yes, authoritative but humble about limitations.

