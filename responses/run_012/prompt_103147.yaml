answer: |-
  # Decision Tree: Axiological Foundations of Pronatalism

  **1. Is population size itself a value-relevant feature of the world?**
  *   **No.** → **Number Irrelevance**
      *   *Commitment:* You cannot argue for more people *as such*; you must argue only for the welfare of those who happen to exist.
  *   **Yes.** → Go to 2.

  **2. Is the value of a larger population *intrinsic* (or constitutive of value), or *instrumental* to some other good?**
  *   **Instrumental** (e.g., national power, economic output, religious command). → **Non-Axiological Pronatalism**
      *   *Commitment:* You must support population growth even if it lowers individual well-being, provided the external goal (state, economy, faith) is served.
  *   **Intrinsic/Constitutive.** → Go to 3.

  **3. Is the obligation to procreate derived from the value of the outcome, or does it stand independently (e.g., a deontological duty)?**
  *   **Independent.** → **Deontological Pronatalism**
      *   *Commitment:* You must defend procreation as a duty even if it leads to outcomes with less overall value or welfare.
  *   **Derived from Outcome Value.** → Go to 4.

  **4. Does the value depend *only* on the welfare of those who exist, or does the *number* of lives independently add value?**
  *   **Number Independently Adds Value.** → **Number Essentialism** [Unoccupied]
      *   *Diagnosis:* Generally rejected as incoherent; valuing numbers apart from welfare fetishizes quantity over quality.
  *   **Only Welfare.** → Go to 5.

  **5. In comparing outcomes, do the welfare levels of *potential* people count?**
  *   **No** (Only actual/identifiable people count). → **Narrow Person-Affecting View**
      *   *Commitment:* You cannot claim a larger population is better unless it is better for *someone specific* who would otherwise exist.
  *   **Yes** (Impersonal). → Go to 6.
  *   **Only Negative Welfare Counts.** → **The Asymmetry View**
      *   *Commitment:* You cannot argue we *ought* to have more people based on their happiness, only that we *ought not* based on their misery.

  **6. How is the welfare of all people (actual and potential) aggregated?**
  *   **Average Welfare.** → **Averagism**
      *   *Commitment:* You must prefer a tiny population with ecstatic lives over a vast one with very good lives.
  *   **Total Sum.** → Go to 7.
  *   **Sum Above a Critical Level.** → **Critical-Level Utilitarianism (Threshold Pronatalism)**
      *   *Commitment:* You must deem a life worth living as *bad to create* if it falls below the critical level.
      *   *(Note: If the threshold varies based on existing welfare, this captures "Threshold Pronatalism".)*

  **7. (For Totalists) Does value increase monotonically with population size, such that a vast population with minimal welfare can outrank a smaller, happier one?**
  *   **Yes.** → **Classical Totalism (Arithmetic Pronatalism)**
      *   *Commitment:* You must accept the Repugnant Conclusion.
  *   **No** (Value peaks or is lexically ordered to block this). → **Lexical/Modified Totalism**
      *   *Commitment:* You must accept that adding happy lives can sometimes fail to increase value, violating strict additivity.

  ***

  ### Key to Positions and Logical Space

  **Indistinguishable Positions:**
  *   **Arithmetic Pronatalism** is identical to **Classical Totalism**. Both hold that each additional worthwhile life is a fixed positive increment ($V = \sum w$).
  *   **Threshold Pronatalism** (optimal size derived from existing welfare) maps onto **Variable Critical-Level Utilitarianism**. If the threshold is fixed, it is standard Critical-Level; if it shifts to protect existing average welfare, it converges with Averagism.

  **Unoccupied Logical Space:**
  *   **Number Essentialism:** No serious theorist holds that numbers matter *independently* of welfare. It is diagnosed as axiologically incoherent.
  *   **Negative Totalism (Pronatalist):** A view counting only suffering but arguing for more people is logically unstable (more people = more suffering = worse).

  **Deontic Distinctions:**
  *   The tree separates **Deontological Pronatalism** (duty independent of value) from **Axiological Pronatalism** (duty derived from value). Most secular arguments fall into the latter; religious or Kantian arguments often fall into the former.

  **Repugnant Conclusion (RC):**
  *   **Classical Totalism** accepts the RC.
  *   **Lexical/Modified Totalism** and **Critical-Level** views attempt to block it. The tree distinguishes them by whether they preserve strict additivity (Totalism) or introduce a threshold/lexicality (Modified/Critical).

  **Non-Axiological Arguments:**
  *   Arguments based on **National Power**, **Economic Output**, or **Religious Command** are classified under **Non-Axiological Pronatalism**. They bypass population ethics by treating population size as a means to an end rather than an object of value.
