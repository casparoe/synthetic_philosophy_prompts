answer: |-
  (1) **Restatement**
  You are describing a stable social equilibrium governing a shared resource that relies not on formal rules or inherent altruism, but on the technical and social capacity of users to attribute specific consumption to specific individuals. In this state, compliance is purchased through the threat of reputational sanction, which is only possible when individual actions are visible to the group. The phenomenon is the specific fragility of this arrangement: when the system is modified in ways that obscure individual attribution (aggregation, intermediaries, privacy protections), the normative constraint dissolves and the resource collapses, even though the users' material incentives and numbers remain unchanged.

  (2) **The nearest existing concepts**
  **Ostrom's "Monitoring" Principle:** Elinor Ostrom's work on Common-Pool Resources identifies "monitoring by appropriators" as one of eight design principles for successful governance. However, this undershoots your description because Ostrom treats monitoring as a deliberate institutional *choice* embedded within a broader suite of rules (boundaries, sanctions, conflict resolution). Your case describes a pre-institutional, emergent stability where legibility is not a design feature but the *environmental condition* for the norm's existence. In Ostrom's framework, if monitoring fails, you adjust the rules; in your description, if legibility fails, the game itself ends.

  **James Scott's "Legibility":** In *Seeing Like a State*, Scott defines legibility as the state's effort to make society readable for administrative control (e.g., surnames, cadastral maps). This overshoots your description because Scott's legibility is top-down (state-to-subject) and often coercive. Your phenomenon is peer-to-peer (subject-to-subject) and functions as a subtle, decentralized enforcement mechanism. While the vocabulary matches, the power dynamics are inverted: here, legibility protects the commons from the users, whereas for Scott, legibility protects the state from the users.

  **Behavioral "Observability Effects":** Experimental economics (e.g., Haley & Fessler, 2005) demonstrates that cues of being watched (even images of eyes) increase prosocial behavior. This captures the psychological mechanism but fails to capture the systemic collapse. The literature focuses on individual decision-making shifts in controlled settings, not the macro-level failure of a resource system when the *channel* of observation is structurally blocked by modernization, privacy reforms, or scale.

  (3) **Verdict**
  There is no single established term that captures this specific dependency. The closest standard phrasing is "observability-dependent cooperation," but this describes the behavior, not the systemic vulnerability. I propose the term **"Legibility-Dependent Equilibrium."**

  **Definition:** A Legibility-Dependent Equilibrium exists when a shared resource remains sustainable solely because the cost of reputational sanction exceeds the benefit of over-extraction, a calculation that is only possible when individual consumption is technically and socially attributable. The equilibrium is "legibility-dependent" because the norm cannot survive the decoupling of action from identity, even if formal rules remain unchanged.

  **Edges and Distinctions:**
  *   **Peer vs. External Monitor:** A norm sustained by mutual visibility is *not* the same phenomenon as one sustained by an external monitor (e.g., a camera or auditor). In the former, the sanction is social (shaming, exclusion); in the latter, it is formal (fines, penalties). A Legibility-Dependent Equilibrium collapses if replaced by external monitoring unless a new formal rule set is successfully imposed, because the *social* cost that underpinned the original stability is gone.
  *   **Loss vs. Adaptation:** The collapse only counts as a failure of this specific equilibrium if the resource degrades. If legibility is lost but a new norm (e.g., strict rationing based on trust) grows in its place, the *Legibility-Dependent Equilibrium* has ended, but the resource may survive under a different governance regime (e.g., a "Trust-Dependent Equilibrium"). Your term specifically names the fragility of the visibility-based regime, not the inevitability of resource death.

  (4) **Boundary cases**
  *   **The "Black Box" Upgrade:** An irrigation cooperative installs automated pumps that bill the group collectively rather than individuals to save administrative costs. Water use spikes. (This **fits** the definition: legibility lost, equilibrium collapses).
  *   **The Panopticon Pivot:** The cooperative loses peer visibility but installs cameras and fines overdrafters. Water use stabilizes. (This **tests the edge**: The resource survives, but the *Legibility-Dependent Equilibrium* is gone, replaced by a Compliance-Dependent one. The social fabric may change even if water levels do not).
  *   **The Digital Commons:** A Wikipedia editor base grows so large that individual edits are no longer recognized by the community, but algorithmic bots revert vandalism. (This **challenges the definition**: Legibility is lost to humans but retained by code. Does "legibility" require social recognition, or just technical attribution? Your definition implies social recognition is required for reputational sanction).
  *   **The Privacy Trade-off:** A health database aggregates patient data to protect privacy, but researchers can no longer audit individual data entry errors, leading to data corruption. (This **fits**: The benefit [privacy] was chosen, the cost was the collapse of the data-quality norm sustained by peer auditing).
