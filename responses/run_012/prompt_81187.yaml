     * **Follow-up (if she argues they are "useful tools"):** Then tell me specifically: what historical distortion does the old tool cause that your new tool fixes? I want to know what breaks when we use the old labels.

  2. You insist that "science" is a nineteenth-century coinage and that applying it to the fourteenth century is like calling a Roman a capitalist. But if a scholar in 1340 is using mathematics to describe motion without referencing divine will in that specific calculation, what exactly is missing that makes "science" the wrong word?
     * **Follow-up (if she says God or purpose is still in the background):** If the difference is the presence of God or purpose in the broader worldview, where is the line drawn? At what point does a natural philosopher's work become science, or is the barrier permanent?

  3. Your positive case rests heavily on the Merton College calculators and their Paris contemporaries proving the Mean Speed Theorem and theories of impetus centuries before Galileo. But if this was a conceptual breakthrough, why does history remember Galileo instead of William Heytesbury?
     * **Follow-up (if she says Galileo connected math to the physical world while they did not):** Does that not concede that the "rupture" you describe was incomplete until the sixteenth century anyway?

  4. I'm writing a protagonist in 1340s Oxford who believes he is doing something nobody has done before. If "science" is an anachronism, am I writing a liar? How do I depict a man who feels modern without smuggling modernity into his head?
     * **Follow-up (if she says he's fine, just call him a natural philosopher):** If he is distinct from a theologian but not a scientist, what does his internal monologue sound like? What vocabulary does he use that isn't ours and isn't purely liturgical?

  5. Your critics argue that shifting the date of the revolution from the 1500s to the 1300s changes nothing about the actual history, only the label on the box. If periodisation is just a tool, as you say, what work does your tool do that the old one didn't?
     * **Follow-up (if she retreats to "it's a more accurate tool"):** Then tell me what would show that a period is a bad tool. Is there any evidence that would force you to abandon the "1300s Rupture" framework, or is it unfalsifiable?

  6. Your argument relies heavily on a specific set of manuscripts from Merton and Paris. How much of your thesis rides on those specific documents, and what discovery in the archives would force you to abandon the idea of a fourteenth-century rupture?

  7. Herbert Butterfield argued for a rupture in the 1500s to serve a specific narrative about modernity. You argue for a rupture in the 1300s. Is your claim not just the same founding-myth move with the date changed to suit a different narrative about continuity?

  8. Critics accuse you of playing the precursor game backwards, reading the 1300s as if it were straining towards us. How do you distinguish your reading of these texts from simply spotting things that look like us and ignoring the things that don't?

  9. The standard view holds that the Scientific Revolution required instruments, experiments, and societies. You argue the ideas were the real thing. Does ideas-only history risk turning natural philosophy into a disembodied logic puzzle detached from the physical world it claimed to describe?

  10. You define natural philosophy as having God and soul and purposes in it, unlike science. But if a fourteenth-century scholar is calculating the speed of a falling stone, is he thinking about the stone's purpose or its velocity? Can those two thoughts actually coexist in the same moment?
