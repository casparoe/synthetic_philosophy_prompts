      *   *The "View from Everywhere" Critique:* This is the attack on the *Omniscient Narrator*. In fiction, we know omniscience is a constructed effect. Historians claiming "objective total history" are claiming an Omniscient Narrator that doesn't exist. It's "Limited POV wearing a god costume."

