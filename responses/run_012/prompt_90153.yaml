  My friend teaches philosophy of medicine and she has strong, settled views on what counts as a disease. Her verdicts so far: short-sightedness, a disease; clinical depression, a disease; a broken leg, a disease; being gay, not a disease (and never was); male-pattern baldness, not a disease; a harmless extra finger that works fine, not a disease; an ordinary benign freckle, not a disease. Now she's been asked about a new one and I want to guess her answer before she gives it. The case: a man in his fifties, no symptoms at all, feels perfectly well, has never been ill a day in his life -- but a routine scan reveals that all his internal organs are mirrored left-to-right (heart on the right, liver on the left, and so on). It's a genuine deviation from how the body is normally built, it runs in families, but it has caused him zero problems and doctors say it never will. Is that a disease, on her view?

  I want you to act like a careful philosopher of medicine working through this. Start by brainstorming the small handful of general rules about disease that could all fit the verdicts she's already given -- I'd guess at least a strict biological-dysfunction rule, a rule that also demands the condition be harmful or unwanted, and maybe something else -- and be honest about which of her past verdicts each rule actually explains rather than hand-waving. Then say what each of those rules predicts about the mirrored-organs case, give me your single best guess at her verdict with your reasons for preferring it, and tell me which further case would best tell the surviving rules apart. Where people who know this literature actually agree versus where it's genuinely contested, separate those out -- don't dress up a contested view as if it were the consensus. Please write it in British English.
