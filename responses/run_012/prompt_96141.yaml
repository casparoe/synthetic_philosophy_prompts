prompt: |-
  I'm a novelist — twenty years of craft, fluent in the shop-talk of the trade (the contract with the reader, genre expectations, plants and payoffs, the unreliable narrator, tropes and their ironic deployment) and with no formal training in philosophy or game theory. I've been reading Lewis on convention: a regularity in behaviour that everyone in a population follows, expects everyone else to follow, and prefers to keep following given that the others do — held in place by mutual expectation rather than by agreement, enforcement, or anyone's decree — and I want to test how much of it survives a change of vocabulary.

  Restate that account as faithfully as you can in the terms I actually work in. Keep the translation honest: don't quietly swap Lewis's coordination problem for "what audiences happen to like," and don't let my vocabulary's assumptions pass as his.

  Then the residue report. Which parts come through intact, which only with distortion, and what has no counterpart at all? Two things interest me particularly. First, common knowledge: I know the difference between a reader recognising that a trope is in play and every reader knowing that every other reader knows — pastiche, camp, and the twist everyone has heard about before opening the book live somewhere in that gap. Does that distinction do any of the work Lewis needs it to do, or is it doing something else? Second, how a convention gets established rather than merely sustained: does my vocabulary say anything about that, or does it only relocate the puzzle? Close by telling me whether the residue points to something Lewis's account leaves out, or to something about literary convention that was never a norm in his sense to begin with.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Experienced novelist (20 years), fluent in literary craft terminology (contract with the reader, genre expectations, plants/payoffs, unreliable narrator, tropes, irony). No formal training in philosophy or game theory.
      *   **Subject:** David Lewis's *Convention: A Philosophical Study* (specifically his definition of convention as a regularity in behavior based on mutual expectations and preferences in coordination problems).
      *   **Task:**
          1.  Restate Lewis's account of convention using the novelist's vocabulary (faithfully, without distorting Lewis into "what audiences like").
          2.  Provide a "Residue Report": What translates intact? What distorts? What has no counterpart?
          3.  Address two specific points of interest:
              *   *Common Knowledge:* Does the distinction between recognizing a trope and knowing *everyone else* knows it (pastiche/camp/twists) do the work Lewis needs?
              *   *Establishment vs. Sustenance:* Does the novelist's vocabulary explain how conventions start, or just move the puzzle?
          4.  Conclusion: Does the residue show Lewis left something out, or is literary convention fundamentally different from Lewisian norms?

  2.  **Deconstruct Lewis's Definition (Mental Sandbox):**
      *   Lewis defines convention as a solution to a *coordination problem*.
      *   Key elements:
          *   Regularity $R$ in population $P$.
          *   Everyone conforms to $R$.
          *   Everyone expects everyone else to conform to $R$.
          *   Everyone prefers to conform to $R$ *on the condition* that others do (conditional preference).
          *   There is an alternative regularity $R'$ that could have worked just as well (arbitrariness).
          *   *Common Knowledge:* Everyone knows, everyone knows that everyone knows, ad infinitum.
      *   Crucial distinction: It's not just habit or enforcement; it's mutual expectation driving the preference.

  3.  **Drafting the Translation (Novelist's Vocabulary):**
      *   *Population:* The readership (or the community of writers and readers).
      *   *Regularity:* A trope, a structural beat, a stylistic choice (e.g., the hard-boiled detective drinks whiskey, the rom-com ends in a kiss).
      *   *Conformity:* The writer uses it; the reader encounters it.
      *   *Expectation:* Genre expectations. The reader *anticipates* the beat.
      *   *Conditional Preference:* This is the tricky part. It's not "I like this." It's "I prefer this beat *because* I know you're going to give it to me, and you prefer to give it to me *because* you know I'm waiting for it." It's the "Contract with the Reader."
      *   *Arbitrariness:* The "Trope." It could have been different (the detective could drink tea), but *this* is the signal we agreed on without speaking.
      *   *Common Knowledge:* Meta-awareness. Knowing the game is being played.

      *Drafting the Restatement:*
      "In our trade, a convention is a recurring move—a trope, a structural beat, a stylistic tick—that persists not because it's the only way to tell the story, or because a publisher mandates it, but because the writer and the reader are locked in a silent coordination. The writer deploys the move expecting the reader to recognize it. The reader encounters the move expecting the writer to have deployed it. Crucially, the writer prefers to deploy it *only because* they expect the reader to expect it, and the reader prefers the coherence it brings *only because* they know the writer intended it. It's the 'Contract with the Reader' operationalized: we both stick to the genre's grammar not because it's law, but because deviating breaks the signal. If I write a noir and the detective smiles warmly at a corpse, I violate the coordination. We could have agreed on 'smiling detectives,' but we didn't. We agreed on 'cynical detectives' without ever signing a treaty."

      *Refining for Faithfulness:* Need to ensure I don't just say "readers like it." It must be about *coordination*. The preference is conditional on the *other's* action.

  4.  **Developing the Residue Report:**
      *   *Intact:* The mutual expectation (Genre Expectations), the arbitrariness (Tropes could be different), the conditional preference (The Contract).
      *   *Distorted:* "Preference." In Lewis, it's often about avoiding collision (driving on the left vs. right). In fiction, it's about meaning-making. If I break convention, the car doesn't crash; the *meaning* shifts (irony, pastiche).
      *   *No Counterpart:* The strict "Common Knowledge" hierarchy. Writers talk about "awareness," but do we model the infinite recursion?

  5.  **Addressing Specific Interest 1: Common Knowledge:**
      *   Lewis needs common knowledge to solve the equilibrium selection.
      *   Novelist view: "Recognizing a trope" vs. "Knowing everyone knows."
      *   *Analysis:* In fiction, the "twist everyone knows" (e.g., "The butler did it" or "They were dead the whole time") relies on that higher-order knowledge. If I write a twist, I am betting on the reader's *second-order* knowledge (I know that you know that I know you expect a twist).
      *   *Does it do Lewis's work?* Lewis uses it to stabilize the convention. In fiction, high-order knowledge often *destabilizes* the convention (leading to irony/pastiche). So, it does work, but often to invert the convention rather than sustain it. Camp *is* common knowledge weaponized.

  6.  **Addressing Specific Interest 2: Establishment vs. Sustenance:**
      *   Lewis explains sustenance well (once established, why it stays). He is vaguer on origin (salience, precedent).
      *   Novelist vocabulary: "Breaking out," "Setting the trend," "The breakout hit."
      *   *Analysis:* We talk about "innovators" or "game changers." But do we explain *how* it sticks? Usually, we attribute it to "voice" or "market timing." This relocates the puzzle to "Why did this specific innovation become salient?"
      *   *Result:* The vocabulary describes the *event* of establishment (the hit book) but not the *mechanism* of coordination shift. It mystifies it as "genius" or "zeitgeist."

  7.  **Conclusion: The Residue's Verdict:**
      *   Does Lewis leave something out? Or is literary convention different?
      *   Lewisian conventions are about *coordination* (matching actions). Literary conventions are often about *signification* (matching meanings).
      *   Breaking a Lewisian convention causes failure (crash). Breaking a literary convention can create *new* meaning (irony, tragedy, innovation).
      *   *Verdict:* Literary conventions are not purely Lewisian norms. They are semiotic tools. Lewis explains the *genre machinery*, but not the *art*. The residue points to the fact that literary conventions are often meant to be broken or bent for effect, whereas Lewisian conventions are meant to be followed for utility.

  8.  **Review and Refine:**
      *   *Tone Check:* Respectful of the user's expertise. No condescension. Use their jargon correctly.
      *   *Faithfulness Check:* Did I turn Lewis into "marketing"? Must avoid that. Keep the "conditional preference" central.
      *   *Clarity:* Ensure the distinction between first-order expectation (I expect this trope) and common knowledge (I know you know I expect this trope) is clear.

      *(Self-Correction during drafting)*: I need to be careful not to equate "Writer" and "Reader" as the two parties in the coordination problem exclusively. Sometimes it's Writer-Writer (industry standards) or Reader-Reader (fandom). Lewis focuses on the population. I should frame it as the "Community of Practice" (Writers + Readers).
      *Actually, Lewis's model works best if the "Population" is the writers, coordinating on how to write, with readers as the environment.* OR *Writers and Readers coordinating on meaning.*
      *Better approach:* The convention exists between Writer and Reader. The Writer signals, the Reader interprets. If the signal is arbitrary but mutually expected, it's a convention.
      *Wait, Lewis's coordination problem is usually symmetric (driving on the left).* Writing/Reading is asymmetric.
      *Adjustment:* I must acknowledge this asymmetry in the residue. The translation will strain here.

      *Revised Plan for Translation:* Frame the "Population" as the *trade* (writers) coordinating to communicate with the *audience* (readers), where the audience is also part of the population expecting the coordination. Actually, the cleanest Lewisian fit is: Writers coordinate with Writers on how to signal, because Readers expect it.
      *Let's stick to the prompt's implied framework:* "Contract with the Reader." This implies a dyad. I will frame the convention as a regularity in the *textual behavior* that sustains the *reading experience*.

      *Let's refine the "Common Knowledge" section.* The prompt asks about the gap between recognizing a trope and knowing everyone knows. This is the space of *irony*. Lewis uses common knowledge to *fix* the convention. In literature, common knowledge *liquefies* it. This is a key insight.

      *Let's refine the "Establishment" section.* Lewis talks about "salience." Novelists talk about "breakout." Is salience the same as a breakout hit? Salience is psychological prominence. A breakout hit creates prominence. It's a decent map, but "genius" obscures the coordination mechanism.

      *Final Polish:* Ensure the voice is peer-to-peer. "You know the shop-talk..."

  9.  **Final Output Structure:**
      *   **The Translation:** Lewis in Novelist Speak.
      *   **The Residue Report:** Intact, Distorted, Missing.
      *   **Deep Dive 1:** Common Knowledge & The Irony Gap.
      *   **Deep Dive 2:** Establishment & The Salience of the Breakout.
      *   **Closing Verdict:** Coordination vs. Signification.

      *(Self-Correction on "Preference"):* In Lewis, I prefer to drive on the left *if* you do. In fiction, do I prefer to use the "Chosen One" trope *if* you do? Not necessarily. I prefer to use it if the *reader expects* it. The coordination is on *meaning*, not just action. I need to make sure this distinction lands.

      *Okay, ready to write.*
answer: |-
  ### The Translation: Lewis in the Workshop

  Here is your account of convention, restated in the shop-talk of the trade, keeping Lewis's structural load-bearing walls intact.

  **The Regularity:** A convention is a recurring move in the manuscript—a trope, a structural beat, a stylistic signal (e.g., the hard-boiled detective drinks whiskey; the rom-com ends in a kiss; the unreliable narrator lies in Chapter One).

  **The Population:** The community of practice (writers) and the community of consumption (readers), treated as a single ecosystem where signals are sent and received.

  **The Coordination Problem:** The problem of meaning. If I write a scene and you read it, we need to agree on what the signals *do*. If I signal "danger" with a blue flag and you read blue as "safety," the story crashes. We need to coordinate on a code.

  **The Conditional Preference (The Contract):** This is the crux. I (the writer) do not necessarily prefer to use the "Whiskey-Drinking Detective" because it is the best artistic choice in a vacuum. I prefer to use it *on the condition* that you (the reader) expect it and know how to read it. You do not necessarily prefer the whiskey because it is realistic; you prefer it *on the condition* that I use it to signal "noir" rather than "culinary review." We both prefer to adhere to the trope *because* we expect the other to adhere to it.

  **The Arbitrariness:** The move is not mandated by nature. The detective could drink tea. The rom-com could end in a breakup. But *this* regularity is the one we have settled on. There is an alternative equilibrium (Teir-Drinking Detective) that would work just as well for coordination, but we aren't using it.

  **The Expectation:** I write the whiskey scene expecting you to recognize the genre. You open the book expecting to find the whiskey scene. If I omit it, you feel a gap; if I include it, the signal lands.

  **The Enforcement:** There is no editor forcing this (unless we count market rejection as enforcement, but Lewis distinguishes convention from decree). The enforcement is internal to the system: if I deviate without signaling the deviation, the contract breaks, the coordination fails, and the reading experience fractures.

  ***

  ### The Residue Report

  Here is what survives the translation, what warps, and what vanishes.

  **1. Intact: The Conditional Preference**
  This translates perfectly to the "Contract with the Reader." It captures why writers feel bound by genre even when they hate the tropes. You don't follow the trope because you love it; you follow it because you know the reader is standing on that specific square of the board, and if you move your piece elsewhere, the game stops. The preference is interdependent.

  **2. Distorted: The Nature of the "Crash"**
  In Lewis's driving example, if we fail to coordinate (I drive left, you drive right), we crash. Physical failure. In fiction, if we fail to coordinate (I write a tragedy, you read it as a comedy), the book doesn't explode. It becomes *irony*, or *kitsch*, or *experimental*.
  Lewis's model assumes the goal is *successful coordination*. The novelist's reality is that sometimes the goal is *managed miscoordination*. We break the convention intentionally to create effect. Lewis's model struggles to account for a convention that is followed *in order to be broken*.

  **3. No Counterpart: The Symmetry of the Population**
  Lewis assumes a population of agents doing roughly the same thing (drivers driving). In fiction, the population is split into two distinct roles with different actions: Writers write, Readers read. The coordination is asymmetric. I coordinate my *writing* with your *reading*. This doesn't break Lewis's math, but it strains the vocabulary. We don't talk about readers "conforming" to a regularity, though they do (they conform by bringing specific interpretive frameworks).

  ***

  ### Deep Dive 1: Common Knowledge and the Irony Gap

  You asked if the distinction between *recognizing a trope* and *knowing that everyone knows* does the work Lewis needs it to do.

  **Lewis's Need:** For Lewis, common knowledge (I know that you know that I know...) is the glue that locks the convention in place. It prevents me from worrying that you might think I'm deviating. It stabilizes the equilibrium.

  **The Novelist's Reality:** In our trade, common knowledge often acts as a solvent, not a glue.
  *   **First-Order Knowledge:** "I see the Detective drinks whiskey." (Genre recognition). This sustains the convention.
  *   **Second-Order/Common Knowledge:** "I know that you know that the Detective drinks whiskey, and I know that you know that I know." This is where **Pastiche** and **Camp** live.

  When common knowledge becomes too thick, the convention stops functioning as a signal and starts functioning as a reference. If I write a whiskey-drinking detective *today*, I am not just coordinating on "Noir." I am acknowledging the history of Noir. I am signaling that *we both know this is a trope*.

  **Does it do Lewis's work?**
  No. Lewis uses common knowledge to explain *stability*. In fiction, high-order common knowledge explains *instability* (or meta-stability). It allows the writer to deploy the trope ironically. The "twist everyone has heard about" relies on common knowledge to subvert the very expectation it sets up.
  Lewis needs common knowledge to ensure we both drive on the left. We use common knowledge to ensure we both know that driving on the left is a cliché, so maybe this time we drive on the sidewalk. The distinction you identified marks the boundary between **Genre** (Lewisian convention) and **Commentary** (Literary play). Lewis's account cannot easily accommodate a convention that thrives on its own obviousness.

  ***

  ### Deep Dive 2: Establishment vs. Sustenance

  You asked if our vocabulary explains how a convention gets established, or just relocates the puzzle.

  **Lewis on Establishment:** Lewis relies on "Salience." Some solution stands out (a focal point) due to precedent, analogy, or prominence. Once one pair coordinates on it, it spreads by precedent.

  **The Novelist's Vocabulary:** We talk about "Breakout Hits," "Game Changers," or "Setting the Trend." We say, " *The Da Vinci Code* made the cryptic prologue standard," or "Hemingway established the terse style."

  **The Relocation:**
  Our vocabulary describes the *event* of establishment (the successful book) but mystifies the *mechanism* of coordination. We attribute it to "Voice," "Genius," or "Zeitgeist."
  *   **Lewis:** "Salience made this solution prominent."
  *   **Novelist:** "This book was so good everyone copied it."

  This relocates the puzzle from "How did we coordinate?" to "Why was this specific precedent salient?" We don't have a shop-term for the *tipping point* where a stylistic choice becomes a requirement. We just say "It caught on."
  However, we do have a concept close to Lewis's "Precedent": **The Comparative Title.** When an agent says, "It's *Gone Girl* meets *The Notebook*," they are actively trying to establish a Lewisian convention for the marketing team and the reader. They are forcing salience. But for organic establishment? Our vocabulary treats it as alchemy. We know *that* it happens, but our craft terms don't explain *how* the coordination spreads from one writer to the whole population without a central decree.

  ***

  ### The Closing Verdict

  Does the residue point to something Lewis left out, or to something about literary convention that was never a norm in his sense?

  It points to the latter. **Literary conventions are not purely Lewisian norms.**

  Lewisian conventions are **instrumental**. We drive on the left to avoid crashing. The value is in the *coordination itself*.
  Literary conventions are **semiotic**. We use the "Whiskey Detective" to convey *meaning*. The value is in the *signification*.

  Because literary conventions are tools for meaning, they must remain flexible. If a convention becomes too rigid (too Lewisian), the art dies; it becomes formulaic pulp. The "Contract with the Reader" is not a traffic law; it is a promise that can be renegotiated mid-sentence.

  Lewis's account explains the **Genre Machinery**—why the detective *must* drink whiskey for the book to sell as Noir.
  It does not explain the **Art**—why the writer might choose to give the detective a latte to tell you something about the character's gentrification of the genre.

  The residue shows that Lewis explains the *floor* of the craft (the minimum coordination required for communication), but your vocabulary is built to describe the *ceiling* (how that communication is manipulated for effect). Lewis explains why we understand each other; your vocabulary explains why we care.
