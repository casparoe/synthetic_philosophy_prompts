      *   *Payoff:* If you stake fraction $f$:
          *   Win (50%): Bankroll becomes $1 + f$. (Double or nothing is too harsh). Let's say Win pays 1:1.
          *   Lose (50%): Bankroll becomes $1 - f$.
          *   Wait, if $p=0.5$ and $b=1$, Kelly is 0. EV is 0. That's boring.
      *   *Need Positive EV:* $p=0.6$, Win pays 1:1.
          *   EV per unit stake: $0.6(1) - 0.4(1) = 0.2$.
