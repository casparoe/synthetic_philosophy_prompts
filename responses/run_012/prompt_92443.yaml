      *   *The "One-Off":* A specific round where they can go "All In" on a sure(ish) thing.

      *Refining the Bet for the Main Game:*
      To get the Ensemble vs. Time divergence, we need a multiplicative process where the geometric mean is less than the arithmetic mean.
      *   *Scenario:* Coin flip. Heads: Wealth $\times 1.6$. Tails: Wealth $\times 0.6$.
      *   *EV:* $0.5(1.6) + 0.5(0.6) = 1.1$. (10% growth per round on average).
