answer: |-
  Here is a complete lesson plan for a 90-minute session designed to viscerally demonstrate the divergence between arithmetic and geometric growth, ergodicity breaking, and the pitfalls of Pascal's Mugging.

  ## **Session Title:** The Ergodicity Trap
  **Duration:** 90 minutes
  **Class Size:** 18 students
  **Materials:**
  *   18 envelopes, each containing 100 coloured poker chips or laminated "Lab Credits".
  *   A projected spreadsheet (prepared in advance) visible to the whole room.
  *   A physical coin (for transparency) or a verified random number generator on screen.
  *   Handouts: "Trader's Log" (a simple sheet to record wealth per round).

  ---

  ## **1. The Setup (10 Minutes)**

  **The Narrative:**
  Tell the students they are traders in a volatile market. Their goal is to maximise their final wealth. There is no "winning" prize other than bragging rights, but emphasise that in real-world finance, survival is the prerequisite for return.

  **The Bankroll:**
  Distribute the envelopes. Each student starts with **100 Credits**.
  *Rule 1:* You cannot go into negative Credits. If you hit 0, you are "bankrupt" and sit out (wealth = 0).
  *Rule 2:* You may not pool funds (no collusion).

  **The Mechanism:**
  Explain the core asset they will trade for the first 15 rounds. It is a "Binary Volatility Asset".
  Each round, they decide what **fraction ($f$)** of their current bankroll to invest. The rest remains safe (cash).
  A coin is flipped.
  *   **Heads (50%):** The invested portion gains **50%**. (Multiplier: $1.5$)
  *   **Tails (50%):** The invested portion loses **40%**. (Multiplier: $0.6$)

  **The Math (Hidden for now):**
  Write the payoff on the board but do not analyse it yet.
  $$W_{t+1} = W_t \times [(1-f) + f \times X]$$
  Where $X$ is $1.5$ (Heads) or $0.6$ (Tails).

  ---

  ## **2. The Game: Rounds 1–15 (35 Minutes)**

  **Procedure:**
  1.  **Decision:** Students write down their stake fraction $f$ (e.g., 0%, 20%, 100%) privately.
  2.  **Roll:** You flip the coin publicly.
  3.  **Calculation:** Students calculate new wealth. (Allow calculators/phones).
  4.  **Record:** You call out the result. Students update their logs. You enter a sample of anonymised results into the projected spreadsheet to track the **Class Mean** and **Class Median** live.

  **The Trap:**
  *   **Arithmetic Expectation:** $0.5(1.5) + 0.5(0.6) = 1.05$.
      *   If you bet 100% ($f=1$), your *expected* wealth grows by 5% per round.
  *   **Geometric Reality:** $\sqrt{1.5 \times 0.6} = \sqrt{0.9} \approx 0.948$.
      *   If you bet 100% ($f=1$), your *typical* wealth shrinks by ~5% per round.
  *   **Kelly Criterion:** The optimal fraction for log-wealth growth is **25%**.
      *   Win: $1 + 0.25(0.5) = 1.125$
      *   Lose: $1 - 0.25(0.4) = 0.90$
      *   Geo Mean: $\sqrt{1.125 \times 0.9} \approx 1.006$ (Slow, steady growth).

  **What to watch for:**
  Most students will intuitively bet "big" (50–100%) because the EV is positive. A few cautious ones will bet small. By Round 15, the students who bet 100% should be significantly below their starting 100 Credits, while the Class Mean (averaged across all students) should still be above 100, dragged up by the few lucky streaks and the mathematical expectation.

  ---

  ## **3. The Pascalian Tail: Round 16 (10 Minutes)**

  **The Event:**
  Announce a "Venture Capital Opportunity". This is a side-bet optional for this round only.
  *   **Cost:** 10 Credits (fixed stake, cannot vary).
  *   **Payoff:**
      *   **95% Chance:** You lose the 10 Credits.
      *   **5% Chance:** You win 500 Credits.
  *   **EV:** $0.95(-10) + 0.05(500) = -9.5 + 25 = +15.5$ Credits.

  **The Trap:**
  This is massively positive EV. An EV-maximiser *must* take this bet if they can afford the 10 Credits.
  However, for a student struggling near zero, losing 10 Credits might be catastrophic (risk of ruin). For a student with 100 Credits, it's fine.
  *Crucially:* If you frame this as "Stake 10% of your bankroll on a 95% chance of ruin", the log-utility agent rejects it. But as a fixed cost, it's a test of their risk tolerance vs. EV.

  **Debrief Point:** This highlights that positive EV does not equal "good bet" if the stake threatens solvency (the tail risk).

  ---

  ## **4. The One-Off Dilemma: Round 17–20 (15 Minutes)**

  **The Event:**
  For the final 4 rounds, change the asset.
  *   **Heads (50%):** +100% on stake.
  *   **Tails (50%):** -60% on stake.
  *   **EV:** $0.5(2) + 0.5(0.4) = 1.2$ (20% growth).
  *   **Geo:** $\sqrt{2 \times 0.4} \approx 0.89$ (11% decay).

  **The Twist:**
  Before Round 20, offer a **"Buyout"**.
  Any student with >50 Credits can cash out their entire bankroll now and leave the game, keeping the credits as "grade points" (or just final score).
  Those who stay must go All-In ($f=1$) for the final round.

  **The Trap:**
  *   **EV View:** Stay. The expected value of playing is $1.2 \times \text{Current Wealth}$. Cashing out is dominated.
  *   **Geometric View:** If this were repeated, you'd leave. But it's a *one-off*.
  *   **Rank View:** If the goal is to beat the *class* (tournament play), you must stay. Volatility is your friend when you need to outrank others. If the goal is *wealth preservation*, you cash out.

  ---

  ## **5. The Debrief (20 Minutes)**

  This is where you convert the gut feeling into theory. Draw three curves on the board based on the projected spreadsheet data.

  **1. The Ensemble vs. Time Average (Ergodicity)**
  *   **Show:** The **Class Mean** wealth curve (Arithmetic). It likely went up (slope > 0).
  *   **Show:** The **Class Median** wealth curve (Time/Typical). It likely went down (slope < 0).
  *   **Point:** "Why did the average rise while most of you got poorer?"
  *   **Theory:** The process is non-ergodic. The ensemble average (what happens if 1,000 parallel universes play once) is not the time average (what happens if you play 1,000 times). In multiplicative dynamics, volatility drags down the geometric mean.
  *   **Formula:** $\text{Geometric Mean} \approx \text{Arithmetic Mean} - \frac{\sigma^2}{2}$.

  **2. The Kelly Criterion**
  *   **Ask:** "Who bet around 25%?" (Likely few).
  *   **Point:** These students likely have the highest *median* outcome. They sacrificed the *chance* of being the richest (the lucky All-In players) for the *certainty* of growth.
  *   **Theory:** Maximising $E[\ln(W)]$ maximises the long-term growth rate. Maximising $E[W]$ maximises the average of a parallel ensemble, which is irrelevant if you only live one life.

  **3. The Pascalian Tail & One-Off**
  *   **Discuss Round 16:** "Who took the 5% gamble?"
  *   **Point:** Positive EV is necessary but not sufficient. If the loss implies $W \to 0$, $\ln(W) \to -\infty$. Log-utility agents ignore Pascal's Muggings that risk ruin.
  *   **Discuss Round 20:** "Who cashed out?"
  *   **Point:** Kelly is for *repeated* betting. In a one-shot scenario with a specific utility function (e.g., "I need 200 credits to pass"), the optimal strategy changes. If you are playing a tournament (beating the median), you should bet *more* than Kelly. If you are playing for survival, you bet *less*.

  ---

  ## **Predictable Pitfalls & Mitigation**

  | Problem | Why it happens | Mitigation |
  | :--- | :--- | :--- |
  | **Calculation Fatigue** | Compounding 1.5/0.6 mentally is hard. Students make errors, get frustrated. | Provide a simple calculator link or allow phones. Have a TA or two trusted students verify "bankrupt" claims. |
  | **The "Lucky Idiot"** | One student goes All-In, gets 5 Heads in a row, and wins big. The class concludes EV maximisation works. | Highlight this explicitly in debrief. "Student X won, but if we played again 100 times, Student X would go bust 99 times. We are studying strategy, not luck." |
  | **Collusion** | Students pool money to reduce variance. | Explicitly forbid it in Rule 2. Walk around the room during decision phases. |
  | **Boredom** | 20 rounds of calculation drags. | Keep the pace brisk. Use a countdown timer for decisions (30 seconds). |
  | **Token Value** | "It's not real money, I'll bet 100%." | Frame it as "Lab Credits" tied to a small participation grade bonus, or simply appeal to professional pride. |

  ---

  ## **Limitations: What You Must Supply**

  This activity is a model, not the territory. You must explicitly address these gaps in the debrief, as the game cannot reproduce them on its own:

  1.  **Why Log Utility?**
      *   *The Game:* Assumes log utility is "correct" because it survives.
      *   *The Truth:* Log utility is only optimal if your goal is to maximise long-term growth rate without bounds. If a student has a specific target (e.g., "I need 150 credits to buy a ticket home"), a different utility function (S-shaped) is rational. You must explain that Kelly is a *strategy*, not a moral imperative.

  2.  **Finite Horizon Effects:**
      *   *The Game:* Only 20 rounds.
      *   *The Truth:* Kelly is asymptotic. In a short game (20 rounds), "Half-Kelly" or even aggressive betting often has a higher probability of beating a specific target than full Kelly. The game is too short to prove Kelly's long-run dominance definitively. Acknowledge this: "We saw the trend, but the law of large numbers needs more rounds to crush the All-In players completely."

  3.  **Fungibility of Wealth:**
      *   *The Game:* 1 Credit is always 1 Credit.
      *   *The Truth:* In reality, the utility of the 100th pound is less than the 1st pound (diminishing marginal utility). The game uses tokens to simulate wealth, but students don't feel the hunger of bankruptcy. You must bridge the gap: "Imagine this was your pension fund. Would you bet 100% on a 50/50 coin flip?"

  4.  **Market Impact:**
      *   *The Game:* Payoffs are fixed by the "House".
      *   *The Truth:* In real markets, if everyone bets the same way, odds shift. This is a single-agent decision theory game, not general equilibrium.

  ## **Instructor's Cheat Sheet (The Numbers)**

  *   **Start:** 100
  *   **Rounds 1–15 Payoff:** +50% / -40%
      *   **EV Max ($f=1$):** Expected Wealth after 15 rounds $\approx 208$. Median Wealth $\approx 46$.
