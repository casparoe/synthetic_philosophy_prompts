prompt: |-
  Right — I teach a final-year option on decision theory, eighteen students, one ninety-minute session, and I want them to feel the force of geometric rationality in their gut rather than just nod along to the Kelly formula. Can you design me a runnable in-class betting game?

  Here's the flavour I'm after. Everyone starts with the same bankroll of tokens (no real money), and we play a decent number of rounds; each round they choose how much of their current bankroll to stake, and then a coin or a dice roll settles the outcome. The payoffs need to be aranged so that the arithmetic-mean-maximising play and the log-wealth-maximising play pull apart, and — this is the bit I care about most — so that the room's *average* bankroll climbs while the *typical* student's bankroll slides towards nothing. I'd also like at least one available bet where a small chance of a catastrophic loss keeps the expected value looking juicy but is fatal for anyone who stakes enough on it; that's the Pascalian tail I want them to trip over. If you can build in a moment where someone is offered a big one-off bet that's clearly positive-EV and has to decide, even better.

  Give me the full kit: rules, materials, the payoff table, the round structure, any roles, and a debrief that maps specific moments onto the arithmetic-versus-geometric distinction and onto the gap between the ensemble average and the time average. Tell me what will predictably go wrong the first time I run it and how to handle it, and be honest about which part of the idea the activity can't reproduce — the bit I'll have to supply myself (why log rather than some other utility, what changes when the stakes aren't multiplicative, one-shot versus repeated betting, that sort of thing).

  Answer in British English, please.
reasoning: |-
  Here's a thinking process that leads to the suggested in-class betting game:

  1.  **Analyze the Request:**
      *   **Target Audience:** Final-year undergraduates (Decision Theory option).
      *   **Class Size:** 18 students.
      *   **Duration:** 90 minutes (one session).
      *   **Goal:** Make students *feel* geometric rationality (Kelly criterion, log-wealth) vs. arithmetic rationality (Expected Value maximisation).
      *   **Key Dynamics:**
          *   Ensemble average (mean wealth) rises.
          *   Time average (typical/median wealth) falls towards zero.
          *   Include a "Pascalian tail" bet (low prob, huge payoff, catastrophic loss risk).
          *   Include a "big one-off positive EV" dilemma.
      *   **Deliverables:** Rules, materials, payoff table, round structure, roles, debrief, pitfalls/limitations.
      *   **Tone/Style:** British English, practical, pedagogical, honest about limitations.

  2.  **Deconstruct the Core Concept:**
      *   *Arithmetic Mean (EV):* Maximising $E[W_{t+1}]$. Usually leads to overbetting (often "all in" if EV > 0).
      *   *Geometric Mean (Growth Rate):* Maximising $E[\log(W_{t+1})]$. Leads to fractional betting (Kelly).
      *   *Ergodicity Breaking:* The ensemble average (what happens if 1000 people play once) $\neq$ Time average (what happens if 1 person plays 1000 times). In multiplicative processes, the time average is usually lower due to volatility drag.
      *   *The "Trap":* If students bet too much (EV maximising), they go bust. If they bet optimally (Kelly), they grow steadily. If they bet too little, they grow slowly.

  3.  **Designing the Game Mechanics:**
      *   *Currency:* "Tokens" or "Points". Let's use "Lab Credits".
      *   *Starting Bankroll:* Needs to be divisible. 100 credits is standard.
      *   *Rounds:* Needs to be enough for the divergence to show. 15-20 rounds is good for a 90-min session including setup and debrief.
      *   *The Bet:* Needs a positive EV but a risk of loss.
          *   Standard coin toss: Heads win $x$, Tails lose stake.
          *   To make EV maximisation distinct from Kelly, the payoff needs to be asymmetric.
          *   *Idea:* A biased coin or a specific payoff structure. Let's go with a simple "Win 60% of stake, Lose 100% of stake" or "Win 100% of stake, Lose 60% of stake".
