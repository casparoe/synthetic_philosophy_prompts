  4.  **Drafting the Plan:**
      *   **Time:** 90 mins.
      *   **Intro:** 10 mins.
      *   **Game:** 45 mins (20 rounds + decision time).
      *   **Debrief:** 35 mins.
      *   **Materials:** Counters/Tokens, Record Sheets, Projector for results.
      *   **Roles:** Instructor (Banker/Croupier), Students (Traders). Maybe 2 TAs or trusted students to verify totals if needed, but 18 is small enough for one teacher to manage if organised.

  5.  **Refining the "Pascalian" and "One-Off" requirements:**
      *   The prompt asks for a moment where someone is offered a big one-off bet that's clearly positive-EV.
      *   I'll integrate this as Round 10 (Mid-game shock) and Round 20 (End-game gamble).
      *   Actually, better to have the main game demonstrate the Ergodicity break, and a specific "Side Bet" option available during one round to demonstrate the Tail Risk.
      *   Let's create a "Black Swan" card drawn at Round 12.
      *   Also, need to ensure the "Average rises, Typical falls" dynamic is visible. I need to track the *Mean* and the *Median* on the board live.

  6.  **Addressing Limitations (Honesty Check):**
      *   *Utility:* The game assumes Log Utility is "correct". It isn't universally correct; it depends on the agent's goals (survival vs. one-off gain). I need to make sure the debrief clarifies this.
      *   *Fungibility:* Tokens aren't real money. Risk aversion might be lower.
      *   *Finite Horizon:* Kelly is asymptotic. With only 20 rounds, "Half-Kelly" or aggressive betting might actually win the tournament (rank maximisation vs. wealth maximisation). This is a crucial distinction. If the goal is to beat the *class*, you bet big. If the goal is to grow wealth, you bet Kelly. I must highlight this.

  7.  **Writing the Content (incorporating British English):**
      *   "Token" not "Chip".
      *   "Programme" not "Program".
      *   "Maths" not "Math".
      *   "Centre" not "Center".
      *   Tone: Academic but lively.

  8.  **Step-by-Step Walkthrough of the Plan:**
      *   *Setup:* 100 tokens each.
      *   *Rounds 1-19:* The "Divergence" Game (50/50, +50%/-40% on stake).
      *   *Round 10:* The "Pascalian" Side-Bet opportunity.
      *   *Round 20:* The "One-Off" EV trap.
      *   *Tracking:* Project a spreadsheet live. Column A: Student, Column B: Wealth. Calculate Mean and Median live.
      *   *Debrief:* Plot the trajectories. Show Mean $\uparrow$, Median $\downarrow$. Discuss Ergodicity. Discuss Utility.

  9.  **Self-Correction/Review during drafting:**
