answer: |-
  This is a sophisticated pivot for a research agenda. Moving from "Is it possible?" to "Is it load-bearing?" shifts the focus from existence proofs to engineering constraints and normative necessity.

  Below is the ranked agenda based on your three scoring criteria: **Dependency** (foundationality), **Action-Guidingness** (policy impact), and **Tractability** (desk-reasoning feasibility).

  ### The Ranked Agenda

  #### 1. The Reduction Crux (Your Third Candidate)
  **Question:** *Does the framework collapse into ordinary expected-value reasoning once one fixes a prior over other agents' policies?*

  *   **Dependency:** **High.** This is the most upstream question. If acausal trade is merely standard Expected Utility Theory (EUT) with a sufficiently rich prior (one that includes logical correlations), then the entire research program subsumes into standard epistemology and Bayesian updating. If it *does not* collapse (i.e., it requires a distinct decision theory like FDT or TDT that diverges from EUT even with perfect priors), then we are building new normative machinery.
  *   **Action-Guidingness:** **High.** If it collapses, institutions need only improve their modeling and priors. If it does not, institutions must fundamentally alter their objective functions or source code to implement non-standard decision algorithms.
  *   **Tractability:** **High.** This is a formal question about the equivalence of decision theories. It can be addressed via comparative statics and representation theorems without empirical data.
  *   **Verdict:** **Rank 1.** It defines the mathematical language of the entire agenda.

  #### 2. The Epistemic Crux (Your First Candidate)
  **Question:** *Does acausal trade presuppose mutually knowable decision procedures, and does logical uncertainty make that presupposition vacuous?*

  *   **Dependency:** **Medium.** This depends on the Reduction Crux. If the framework collapses to ordinary EV, this becomes a question of "How do we estimate priors under logical uncertainty?" If it requires new decision theory, this becomes "How do we establish structural correlation under opacity?"
  *   **Action-Guidingness:** **Very High.** This is the binding implementation constraint. Even if the theory is sound (Crux 1) and the gains are real (Crux 2), trade is impossible if agents cannot sufficiently model one another to condition their actions. For an institution, this determines whether acausal cooperation is a viable strategy or a theoretical curiosity.
  *   **Tractability:** **Low.** Logical uncertainty is one of the hardest open problems in formal epistemology. Reasoning at a desk is difficult here because the relevant mathematics (logical induction, bounded rationality) is incomplete.
  *   **Verdict:** **Rank 2.** It is the practical bottleneck, but it rests on the theoretical foundation of Rank 1.

  #### 3. The Ontological Crux (Your Second Candidate)
  **Question:** *Are the alleged gains from trade genuine, or an artifact of double-counting the same possible worlds under different descriptions?*

  *   **Dependency:** **Low.** This question only matters if trade is theoretically coherent (Crux 1) and epistemically accessible (Crux 2). It concerns the interpretation of the utility function and the counting of measure across possible worlds.
  *   **Action-Guidingness:** **Medium.** If gains are "double-counting," it implies the Pareto improvement is illusory. However, if the agent *believes* the gains are real (due to the decision theory it runs), it will act the same way regardless of the metaphysical status of the "worlds." It matters more for evaluation than for execution.
  *   **Tractability:** **Medium.** This is largely conceptual and semantic. It can be addressed through careful definition of counterfactuals and measure, but risks becoming a philosophical stalemate.
  *   **Verdict:** **Rank 3.** It is downstream of the other two and risks being a "pseudo-problem" if the decision procedure is fixed.

  ---

  ### Structural Analysis of the Cruxes

  **Which is Upstream?**
  **The Reduction Crux (Rank 1)** is strictly upstream of the others.
  *   If acausal trade **collapses** to ordinary EV, then the **Epistemic Crux** becomes a standard problem of Bayesian estimation under logical uncertainty, and the **Ontological Crux** becomes a question of how to properly individuate worlds in a standard probability space.
  *   If acausal trade **does not collapse**, then the **Epistemic Crux** requires a new theory of correlation (beyond probability), and the **Ontological Crux** requires a new metaphysics of decision (e.g., subjunctive dependence).
  You cannot resolve the epistemic requirements until you know what kind of mathematical object you are trying to estimate (a probability distribution vs. a logical correlation function).

  **Which is Overrated?**
  **The Ontological Crux (Rank 3)** is likely overrated.
  In decision theory, "reality" is often defined operationally by the payout. If an agent using acausal reasoning achieves higher utility than a causal agent in equivalent scenarios (e.g., Newcomb-like problems), the "gains" are operationally genuine regardless of whether we describe them as "trade" or "coordination" or "double-counting." Focusing too much on the metaphysics of the worlds can distract from the engineering of the decision procedure. The "double-counting" worry often dissolves once one fixes a specific formalism (e.g., logical induction) where the "counting" is mathematically precise.

  **Which is the Binding Constraint?**
  **The Epistemic Crux (Rank 2)** is the binding constraint on *load-bearing* status.
  Even if the theory is distinct (Crux 1) and the gains are real (Crux 2), an institution cannot rationally build this into policy if the computational cost of resolving logical uncertainty exceeds the gains from trade. This is where the "desk reasoning" hits the wall of computational complexity.

  ---

  ### Moving the Needle: Evidence for the Next 1–2 Years

  To reprioritize this agenda, look for the following developments:

  **1. To Move the Reduction Crux (Rank 1) Up or Down:**
  *   **Up:** A formal proof demonstrating that Functional Decision Theory (FDT) and Evidential Decision Theory (EDT) diverge in outcomes *even when* EDT is granted a prior over logical correlations. This would confirm acausal trade requires new theory.
  *   **Down:** A demonstration that "acausal" outcomes can be fully replicated by Causal Decision Theory (CDT) agents who simply value the output of their source code as a terminal good (the "Why ain'cha rich?" argument resolved via utility function engineering).
  *   **What to watch:** Papers comparing FDT and "Bayesian CDT" in program equilibrium tournaments.

  **2. To Move the Epistemic Crux (Rank 2) Up or Down:**
  *   **Up:** Progress in **Logical Induction** showing that agents can converge on accurate predictions of each other's code in polynomial time. This makes the trade tractable.
  *   **Down:** Proofs showing that predicting the output of a similarly complex agent is computationally irreducible (requiring more compute than the agent itself). This would render acausal trade load-bearing only for very simple agents or very asymmetric power dynamics.
  *   **What to watch:** Bounds on logical uncertainty in bounded rationality models; research into "open-source game theory" with resource limits.

  **3. To Move the Ontological Crux (Rank 3) Up or Down:**
  *   **Up:** A paradox where "double-counting" leads to dynamic inconsistency or Dutch-booking (e.g., an agent pays to enter a trade and pays to exit it based on world-counting shifts). This would make it a safety-critical issue.
  *   **Down:** A consensus formalism (like a specific version of infra-Bayesianism) that renders the "counting" unambiguous, turning the philosophical worry into a solved bookkeeping issue.
  *   **What to watch:** Critiques of "measure" in multiverse trade scenarios; analysis of dynamic consistency in acausal agents.

  ### Summary Recommendation for Your Team
  Direct 50% of effort to **The Reduction Crux**. If you solve this, you know whether you are building a new engine or just better fuel. Direct 40% to **The Epistemic Crux**, specifically on *bounded* logical uncertainty, as this determines if the engine can actually run. Direct 10% to **The Ontological Crux**, mostly to ensure your formalism doesn't allow for Dutch-booking, but do not let metaphysical debates stall engineering progress.
