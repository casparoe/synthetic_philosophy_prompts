  2. During the debrief, map the voluntary wage agreement to formal freedom, the generous round to the compatibility of exploitation with mutual gain, the withdrawal results to asset distribution, and the rigid effort rules to alienation as a gap between pay and control.
  3. When students moralize early, refuse roles, or claim endowments are constructed, treat these reactions as empirical data about ideological barriers rather than failures of the simulation, intervening only to clarify arithmetic without fixing the outcome.
  4. Meet the objection that numbers were rigged by conceding the design but arguing the structural logic remains valid, clearly marking the difference between the activity's demonstrated mechanics and the historical assumptions it rests upon.
  5. Supply the missing normative and historical context the game cannot reproduce, specifically the original separation of workers from means of production, the magnitude of surplus value, the lived texture of alienated labor, and the argument that the arrangement is unjust rather than merely unequal.
