      *Decision:* The strongest attack is on **Step 6** (the slide from "agreeable" to "correct") and **Step 8** (the exclusion of non-bargainers). Step 7 is also logically shaky if values conflict absolutely. I will focus on 6 and 8 as the primary drivers of Conclusion 10.

