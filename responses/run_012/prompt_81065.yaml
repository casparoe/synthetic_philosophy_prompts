      *   **Step 6 (The Equivocation):** "The correct answer." This shifts from "prudentially rational for the parties" to "morally correct." Just because a deal is mutually beneficial doesn't make it *just*. (e.g., Two slaveholders agreeing to split the profits of slavery is a "gain from trade" for them, but morally abhorrent).
      *   **Step 8 (The Exclusion):** "Whoever isn't at the table isn't a party." This is the biggest moral hole. It excludes voiceless victims. If I agree with my neighbor to burn down your house because we both value the insurance money more than your house, that's a "trade," but it's not moral.
      *   **Step 10 (The Conclusion):** "No moral truth, only bargaining positions." This follows *if* morality is defined solely as the outcome of this bargaining process. But if morality is independent (Realism), the bargaining outcome might be immoral.

