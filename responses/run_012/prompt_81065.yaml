      *   **The Main Flaw:** Step 6 (Equivocation) and Step 8 (Exclusion).
      *   **Focus on Step 6:** It slides from "prudentially optimal" to "morally correct."
      *   **Focus on Step 8:** It defines morality by who has power to bargain, excluding the powerless.
      *   **Addressing Step 5:** You can keep the intuition (Pareto improvements are good) without accepting it as the *definition* of morality.
      *   **Addressing Step 7:** It's a confession. Lexicographic values often break trade (e.g., rights).
