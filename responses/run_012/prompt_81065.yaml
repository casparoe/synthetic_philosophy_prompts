      *   *Best target:* **Step 8** is the most ethically costly to keep. **Step 6** is the logical leap.
      *   *Wait, looking closer at Step 5:* "A policy that every affected party ranks above the alternative... is one you can't object to adopting." The phrase "affected party" is doing heavy lifting. Step 8 defines "party" as "whoever is at the table." This is circular. If "affected party" means "moral patient," Step 8 is false. If "party" means "bargainer," Step 5 is weak (bargainers can agree on evil things).

