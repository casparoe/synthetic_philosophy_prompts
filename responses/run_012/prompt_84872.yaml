  **Note on Liberties Taken**

  This poem cheats in three specific places, each corresponding to a contested move in the literature. First, the shift from "patient" to "body" (line 13) smuggles in an ontological conclusion under the guise of a lexical substitution; it forces the reclassification required to make the final line false, rather than letting vagueness do the work alone. Second, the final step from "says" to "knows" (line 16) begs the question against the epistemicist it portrays: it assumes that if there were a sharp boundary, one could occupy it with certainty, whereas an epistemicist might argue we simply cannot *know* where the line is, even if it exists. Finally, the poem leans heavily on a degree-theoretic intuition (that truth fades like a pulse) rather than a supervaluationist one (that truth value gaps might appear abruptly); it treats the borderline as a smooth slope, which is precisely what the paradox challenges us to justify. The heckler ("He") traverses the chain without stopping, which enacts his failure to find the boundary, but the poem itself refuses to settle whether that failure is due to the boundary's absence or his own blindness.
