  2.  **Deconstruct the Conflict (Brainstorming Phase):**
      *   *Genuine Conflict:* What does $h^2$ *do*? Does it bound the potential for selection/response? Does it imply immutability? How does it scale across environments?
      *   *Definitional:* Is $h^2$ a "property of the trait" or a "property of the variance in a specific population at a specific time"? (Technically it's the latter, but A often speaks as if it's the former).
      *   *Rhetorical:* A says "genetic influence"; B hears "genetic determinism." A says "statistic"; B hears "ideology."
      *   *Technical Core:* $V_P = V_G + V_E + V_{GxE} + ...$ Heritability ($h^2$) is $V_G / V_P$. If $V_E$ shrinks (uniform environment), $h^2$ rises even if $V_G$ stays constant. If $V_G$ is non-additive, narrow-sense $h^2$ changes.
      *   *The "Realness" Issue:* A sees $h^2$ as a parameter estimating a biological reality (additive genetic variance). B sees it as a ratio of variances dependent on sampling.
      *   *Policy:* A says "High $h^2$ means individual differences are hard to change via environment." B says "High $h^2$ says nothing about mean shifts via environment."

  3.  **Drafting the Agreed Claims (The "Peace Treaty"):**
      *   Need to lock down the definition: It's a ratio of variances, not a measure of individual determination.
      *   Need to clarify the "local" nature: It applies to the population and environment measured.
      *   Need to clarify intervention: High $h^2$ does *not* preclude mean shifts (the "flynn effect" logic).
      *   Need to clarify prediction: High $h^2$ *does* predict response to selection (breeding) within that range.
      *   Need to acknowledge GxE: It's part of the variance budget.

  4.  **Drafting the Disagreements Table:**
      *   *Disagreement 1: Stability across contexts.* A thinks $h^2$ is relatively stable across similar modern populations. B thinks it fluctuates wildly with minor environmental shifts.
      *   *Disagreement 2: Causal Interpretation.* A thinks high $h^2$ implies genetic differences are the *primary driver* of current rank-order differences. B thinks this reifies "genetic cause" when genes and environment are developmentally entangled.
      *   *Disagreement 3: Utility for Policy.* A thinks it helps allocate resources (don't waste money on environmental fixes for high $h^2$ traits). B thinks it leads to fatalism and ignores structural leverage points.

  5.  **Drafting the Concrete Probe (The Intervention Scenario):**
      *   Scenario: Supplementation/Schooling.
      *   Effect: Mean goes up, $h^2$ goes up (0.35 -> 0.65).
      *   Why does $h^2$ go up? Usually because environmental variance ($V_E$) is reduced (everyone gets the same good schooling), making genetic differences proportionally larger.
      *   *Camp A Prediction:* Confirms that as environmental noise is removed, genetic signal emerges. Validates $h^2$ as a measure of remaining variance.
      *   *Camp B Prediction:* Confirms that $h^2$ is sensitive to environmental uniformity. Embarrassing if A claimed high $h^2$ meant "environment doesn't matter" (since environment *did* matter for the mean).
      *   *Resolution:* Both agree $V_E$ dropped. A emphasizes predictive accuracy for ranks; B emphasizes the malleability of the mean.

  6.  **Refining the Tone:**
      *   Must sound like a philosopher of science (epistemologically careful).
      *   Must sound like a quantitative geneticist (uses $V_G, V_E, V_P$, additive vs. non-additive, rank-order vs. mean).
      *   Neutral rapporteur (no taking sides, just clarifying).

  7.  **Review against Constraints:**
      *   No citations? Check.
      *   Brainstorming section first? Check.
      *   Numbered agreed claims? Check.
      *   Disagreements table? Check.
      *   Concrete probe included? Check.
      *   Technical fluency? (Ensure distinction between broad/narrow sense, variance components, and rank-order vs. mean).

  8.  **Self-Correction/Polishing during drafting:**
      *   *Correction:* Make sure not to conflate broad-sense ($H^2$) and narrow-sense ($h^2$). The prompt implies narrow-sense (predictive/breeding), but the critique often targets broad interpretations. I will specify "narrow-sense heritability ($h^2$)" as the primary focus since it's the standard for prediction, but acknowledge the variance decomposition generally.
      *   *Nuance:* Ensure the distinction between "changing the mean" and "changing the variance" is clear in the intervention scenario. This is the classic "reaction norm" vs. "variance ratio" confusion.
      *   *Rhetoric Check:* Ensure Camp B isn't painted as anti-science, but anti-reification. Ensure Camp A isn't painted as determinist, but pragmatist.

