prompt: |-
  I'm in the final year of a philosophy degree and I'm currently taking a course on knowledge, skill and action, most of which has been spent on the dispute over whether knowing how to do something is a species of propositional knowledge or something else altogether. I have to pick a topic for a 6,000-word term paper, and I'd like that paper to do double duty as the seed of a research proposal I'll be writing over the summer, so the choice matters to me more than an ordinary essay title would. My constraints are roughly these: one term of about ten weeks, a supervisor who works on epistemology, no possibility of collecting data of my own, and a project that has to be doable from a desk with a library.

  Two things about the literature leave me unsure where the live questions actually are. First, the examples are almost always the same ones — riding a bicycle, swimming, playing chess — and I'd like you to take seriously the possibility that this narrow diet of examples has distorted the debate. Consider what happens if the central cases are instead kinds of know-how whose content looks fully articulable, such as knowing how to run a particular statistical test correctly, knowing how to construct a proof by induction, or knowing how to work through a surgical checklist; or kinds of know-how that are governed by explicit protocols and transmitted by instruction rather than by imitation. Second, it isn't clear to me that the dispute is about one thing at all: ability, disposition, tacit understanding, skill, reliability, and practical modes of presentation appear to be doing quite different work in different contributions, and I suspect that some apparent disagreements are disagreements about what the term is being used for. I am also unsure whether the debate has anything useful to say about artificial systems that can both produce fluent instructions for a task and perform the task, but where neither capacity tells us much about what is going on inside them — whether that belongs on the agenda or is a distraction is part of what I'm asking you to judge.

  What I want is an agenda rather than a survey: an ordered set of the open questions in this area that someone in my position ought to work on, with the ordering defended. For each candidate, say what the question is, why it is upstream of other work in the area rather than downstream of it, how tractable it is for a person working alone from the armchair, and what would move it up or down the list. Then tell me which questions I should leave alone, and why — including any that look central but whose resolution would not change much else. Please say explicitly whether your ranking would shift if the cases I raised in the previous paragraph were treated as the central ones rather than as curiosities at the margin; if the ranking is robust to that, say so and explain why.

  I'd like the answer in British English. I am not asking for a reading list or citations — I can find the literature myself, and I would rather have your reasoning than a bibliography. Finally, please be careful to distinguish what is settled in this area from what is genuinely contested among people who work on it: where a claim is a live disagreement, mark it as such rather than presenting it as the consensus, and where you are giving me your own judgement rather than reporting the state of the field, flag that too.
reasoning: |-
  Here's a thinking process that leads to the suggested agenda:

  1.  **Analyze the User and Request:**
      *   **User:** Final year philosophy undergraduate (likely UK based given "term paper", "British English", "6,000-word term paper").
      *   **Context:** Course on Knowledge, Skill, and Action. Focus on the Intellectualism vs. Anti-Intellectualism debate (Rylean legacy, Stanley & Williamson, etc.).
      *   **Goal:** A 6,000-word term paper that doubles as a seed for a summer research proposal (MPhil/PhD track?).
      *   **Constraints:** 10 weeks, epistemology supervisor, no empirical data collection (armchair/library based).
      *   **User's Insights/Critiques:**
          1.  *Example Bias:* Standard examples (bike, swim, chess) might distort the debate. Suggests focusing on articulable know-how (stats, proofs, checklists) or protocol-driven skills.
          2.  *Conceptual Fragmentation:* Suspects "know-how" is doing too much work (ability, disposition, tacit understanding, etc.) and disagreements might be verbal or category errors.
          3.  *AI Relevance:* Wonders if AI systems (fluent instructions + performance) are relevant or distracting.
      *   **Deliverable:** An *agenda* (ordered set of open questions), not a survey or reading list. Needs justification for ordering (upstream vs. downstream), tractability assessment, and conditions for moving up/down. Must identify questions to avoid. Must address the impact of shifting central cases (articulable skills). Must use British English. Must distinguish settled vs. contested vs. personal judgement.

  2.  **Deconstruct the Philosophical Landscape (Intellectualism vs. Anti-Intellectualism):**
      *   *Standard View (Intellectualism):* Know-how is a species of know-that (propositional knowledge). (Stanley & Williamson).
      *   *Standard View (Anti-Intellectualism/Rylean):* Know-how is distinct, often grounded in ability/disposition, not reducible to propositions.
      *   *Hybrid/Moderate Views:* Know-how requires both, or is a distinct state that entails know-that.
      *   *Current State:* The debate has stagnated somewhat on the standard examples. The "gettier" cases for know-how, the "linguistic evidence" (ascriptions), and the "nature of the mode of presentation" are key battlegrounds.
      *   *User's Critique Validity:* The user is right. The focus on "bike riding" privileges tacit, embodied skills. Focusing on "running a t-test" privileges explicit, rule-following skills. This shifts the burden of proof.

  3.  **Drafting the Agenda - Step-by-Step:**

      *   **Criterion for Ordering:** "Upstream" means foundational. If you don't solve Q1, you can't solve Q2. "Tractability" means can an undergrad do this in 10 weeks without data?
      *   **Question 1: The Homogeneity Assumption.** (Addressing User's Insight 2). Is "know-how" a natural kind? Or is it a cluster concept? If it's fragmented, the Intellectualism debate might be ill-posed.
          *   *Why Upstream:* If there are multiple types of know-how, asking "Is know-how propositional?" is like asking "Is fruit sweet?" (Some are, some aren't).
          *   *Tractability:* High. Conceptual analysis, examining linguistic usage, comparing cases.
          *   *Impact of New Cases:* High. Articulable skills make the fragmentation hypothesis more plausible.

      *   **Question 2: The Role of Articulation and Instruction.** (Addressing User's Insight 1). What is the relationship between the ability to *teach* a skill linguistically and the possession of the skill?
          *   *Why Upstream:* Intellectualists lean on the idea that there *must* be a proposition. Anti-intellectualists lean on the inability to articulate. If we look at skills where articulation is central (checklists, code), does the distinction collapse?
          *   *Tractability:* Medium. Requires careful case construction.
          *   *Impact of New Cases:* Crucial. This is where the user's specific examples shine.

      *   **Question 3: The Normative Status of Know-How.** Is know-how normative in the same way know-that is? (Justification, defeaters).
          *   *Why Downstream:* Depends on what know-how *is*.
          *   *Tractability:* Medium/High. Armchair accessible.
          *   *Impact:* Important for epistemology, but maybe less so for metaphysics of action.

      *   **Question 4: AI and Synthetic Agency.** (Addressing User's Insight 3).
          *   *Why Downstream/External:* Depends on Q1 & Q2. Also risks becoming philosophy of mind/tech rather than epistemology.
          *   *Tractability:* Low/Risky. Easy to get bogged down in technical details of AI.
          *   *Verdict:* Leave alone for *this* specific paper, but keep for the research proposal.

      *   **Questions to Avoid:**
          *   Linguistic analysis of "knows how" vs. "knows that" (too technical/semantic, settled enough that it won't move the needle).
          *   Historical exegesis of Ryle (unless arguing for a new interpretation, but usually dry).
          *   Pure ability intuitions (too subjective).

  4.  **Refining the Argument & Ordering:**

      *   *Top Priority:* **The Fragmentation Hypothesis.** (Is 'know-how' univocal?). This directly addresses the user's suspicion that the debate is about "one thing". If this is true, the standard debate is category-mistaken.
      *   *Second Priority:* **The Articulation Condition.** (Does the ability to instruct entail propositional knowledge?). This leverages the user's "statistical test/checklist" examples.
      *   *Third Priority:* **The Guidance Condition.** (How does the knowledge guide action?). This connects the metaphysics to the action theory.

      *   *Re-evaluating AI:* The user asked me to judge if it belongs on the agenda. My judgement: It's a *test case*, not a core metaphysical question. It belongs in the "Applications" section of a proposal, not the "Core Theory" section of a term paper. I will advise caution.

      *   *Robustness Check:* Does shifting to "articulable skills" change the ranking?
          *   Yes. If we focus on bike riding, Fragmentation is harder to argue (it all looks like ability). If we focus on stats/checklists, Fragmentation becomes the most pressing question because some look propositional, some look procedural. I need to be explicit about this shift.

  5.  **Drafting the Content (incorporating British English and constraints):**

      *   *Tone:* Academic, mentoring, precise.
      *   *Formatting:* Clear headings, ordered list.
      *   *Distinctions:* Clearly mark "Consensus", "Contested", "My Judgement".
      *   *Word Count Check:* The prompt asks for an agenda, not the essay itself. I need to ensure the response is detailed enough to be useful but doesn't write the essay for them. (Wait, the prompt asks for the agenda *in the answer*. I need to make sure the answer itself is substantial enough to guide the 6,000 words).

      *   *Self-Correction on "Settled" vs "Contested":*
          *   *Settled:* Very little is truly settled. Even the linguistic evidence is contested. I should be careful not to claim consensus where there is merely a dominant view.
          *   *Contested:* The reduction of know-how to know-that. The necessity of ability.
          *   *My Judgement:* The fragmentation point is my strongest recommendation.

  6.  **Final Polish:**
      *   Check British spelling (analyse, programme, centre, etc.).
      *   Ensure the "Why leave alone" section is robust.
      *   Ensure the "AI" question is answered directly.
      *   Verify the "Upstream/Downstream" logic holds.

      *(Self-Correction during drafting)*: I need to make sure I don't just give topics, but an *ordered set* with *defended ordering*. The logic must be: You can't answer B until you answer A.
      *   Order:
          1.  Unity vs. Fragmentation (Metaphysical/Linguistic priority).
          2.  The Relation between Instruction and Possession (Epistemic priority).
          3.  The Role of Ability (Action-theoretic priority).
      *   AI comes in as a stress test for 2 & 3.

      *   *Refining the "Articulable Skills" point:* The user suggests stats/checklists. These are interesting because they sit on the border. A checklist is propositional, but *using* it skillfully might not be. This is the sweet spot for the paper.

      *   *Research Proposal Angle:* The term paper needs to show *potential* for further work. Question 1 (Fragmentation) is PhD-worthy. Question 2 (Instruction) is also good. Question 3 is a bit standard. I will steer them towards 1 and 2.

  7.  **Final Review against constraints:**
      *   British English? Yes.
      *   No reading list? Yes.
      *   Distinguish settled/contested/judgement? Yes.
      *   Address AI? Yes.
      *   Address the "new examples"? Yes.
      *   Ordering defended? Yes.

      *Let's write.*
answer: |-
  Here is an agenda for research into the nature of know-how, structured to serve both as a framework for your 6,000-word term paper and as a foundation for a summer research proposal.

  I have ordered these questions by metaphysical and explanatory priority. A question is 'upstream' if answering it determines the terms in which subsequent questions must be asked. If you attempt a downstream question without settling the upstream one, you risk talking past your interlocutors. I have also assessed each for 'armchair tractability'—that is, whether it can be advanced without empirical data collection, relying instead on conceptual analysis, intuition pumping, and logical consistency.

  Please note the following key for the status of claims below:
  *   **[Contested]:** There is significant, active disagreement in the literature.
  *   **[Consensus]:** There is broad agreement, though minor dissent may exist.
  *   **[My Judgement]:** This is my own assessment of the dialectical situation, not necessarily a report of the field's consensus.

  ### 1. The Primary Upstream Question: The Unity of Know-How

  **The Question:** Is 'know-how' a univocal natural kind, or is it a cluster concept that picks out distinct mental states depending on the context?

  **Why it is Upstream:**
  Almost the entire Intellectualism vs. Anti-Intellectualism debate presupposes that there is a single target of analysis. Intellectualists (e.g., Stanley & Williamson) argue that *the* state underlying know-how is propositional. Anti-Intellectualists (e.g., Ryleans, ability theorists) argue that *the* state is dispositional or embodied. [My Judgement]: If know-how is fragmented—if 'knowing how to swim' picks out a different kind of state than 'knowing how to run a t-test'—then the question 'Is know-how propositional?' is a category mistake. It would be akin to asking 'Is fruit sweet?' when the category includes both lemons and dates. You cannot resolve the reduction debate without first establishing whether the *reductum* is uniform.

  **Tractability:**
  High. This is a conceptual analysis task suitable for armchair philosophy. It requires constructing cases (like your statistical test or surgical checklist examples) and testing whether our intuitions about justification, possession, and failure track together across cases. If our intuitions diverge, the unity hypothesis is weakened.

  **Conditions for Moving Up/Down:**
  *   **Move Up:** If you find that standard examples (swimming) and your proposed examples (checklists) yield conflicting verdicts on whether 'propositional knowledge is necessary', this becomes the absolute priority.
  *   **Move Down:** Only if you can demonstrate a robust invariant across all cases (e.g., a specific 'practical mode of presentation' present in both swimming and statistics). [My Judgement]: This is unlikely, making this question the most critical starting point.

  **Impact of Shifting Central Cases:**
  If you treat articulable skills (proofs, checklists) as central rather than marginal, this question jumps from important to decisive. The standard diet of examples (bike riding) masks fragmentation because they are all embodied and tacit. Introducing explicit, rule-governed skills highlights the disunity. The ranking is **not robust** to this change; focusing on your proposed examples makes the Unity Question the undeniable starting line.

  ### 2. The Epistemic Question: The Instruction Condition

  **The Question:** What is the relationship between the capacity to *instruct* (articulate the steps of a task) and the possession of know-how? specifically, does the ability to generate correct instructions entail propositional knowledge of the task, and is that sufficient for know-how?

  **Why it is Upstream:**
  This is downstream of Question 1 (you need to know if you are analysing one kind of know-how) but upstream of debates about ability. Intellectualists often argue that because we can speak about skills, there must be underlying propositions. Anti-Intellectualists argue that instruction is merely a byproduct, not the core. Your examples (statistical tests, checklists) sit precisely on this fault line. In these cases, the 'instruction' *is* the protocol. If a student can recite the checklist but fails to apply it when a patient's condition changes, do they have the know-how?

  **Tractability:**
  Medium-High. This requires careful case construction. You do not need data; you need 'intuition pumps'. You can construct thought experiments involving 'perfect parrots' (agents who can instruct but not perform) and 'mute experts' (agents who perform but cannot instruct) using your technical examples.

  **Conditions for Moving Up/Down:**
  *   **Move Up:** If the Unity Question (Q1) suggests there are multiple types of know-how, Q2 becomes the method for distinguishing them. You could propose a taxonomy based on 'Instruction-Dependence'.
  *   **Move Down:** If Q1 confirms unity, Q2 becomes a specific test case for that unified theory.

  **Impact of Shifting Central Cases:**
  This question gains significant weight with your proposed examples. In bike riding, instruction is clearly secondary to ability. In running a regression analysis, instruction (knowing the formula/assumptions) is constitutive of the skill. Treating these as central cases forces the debate to account for skills where articulation is not just possible but required.

  ### 3. The Action-Theoretic Question: The Guidance Condition

  **The Question:** In what sense does know-how *guide* action, and does this guidance require a propositional attitude to play a causal role?

  **Why it is Downstream:**
  This question assumes we have identified the state (Q1) and its relation to articulation (Q2). It asks about the mechanism of action. Intellectualists claim propositions guide action via a 'practical mode of presentation'. Anti-Intellectualists claim dispositions guide action without representing the goal propositionally.

  **Tractability:**
  Medium. This is harder to settle from the armchair because it bleeds into philosophy of mind and cognitive science. However, you can analyse the *concept* of guidance. Does guidance require representation?

  **Conditions for Moving Up/Down:**
  *   **Move Up:** If your supervisor is heavily inclined towards Action Theory rather than pure Epistemology.
  *   **Move Down:** For a 6,000-word paper, this is likely too broad. It is better treated as a consequence of your findings on Q1 and Q2.

  **Impact of Shifting Central Cases:**
  Robust. Whether swimming or doing statistics, the action must be guided. However, the *type* of guidance differs (muscular feedback vs. logical adherence to rules). This reinforces the findings from Q1.

  ---

  ### Questions to Leave Alone (and Why)

  **1. The Linguistic Analysis of 'Knows How' Ascriptions**
  *   **The Question:** Does the syntactic structure of 'S knows how to F' mirror 'S knows that p'?
  *   **Why Avoid:** This has been thrashed out extensively (Stanley & Williamson vs. Bengson & Moffett). It is highly technical semantics. [Consensus]: There is no consensus, but [My Judgement]: further linguistic analysis is unlikely to break the deadlock in a 6,000-word paper. It distracts from the epistemological and metaphysical issues you want to seed for a proposal. It is downstream of the metaphysical questions; syntax tracks metaphysics, not vice versa.

  **2. The Necessity of Ability**
  *   **The Question:** Is ability necessary for know-how? (Can you know how to do something if you are paralysed?)
  *   **Why Avoid:** This is a classic 'finkish disposition' problem. While interesting, it often leads to counter-example ping-pong that rarely advances the theory. [My Judgement]: It is less fruitful than the Instruction Condition (Q2). The paralysis cases are edge cases; your 'statistical test' cases are central cases. Focus on the central cases.

  **3. Artificial Systems and Synthetic Agency**
  *   **The Question:** Do Large Language Models or AI agents possess know-how?
  *   **Why Avoid:** [My Judgement]: This is a distraction for *this* specific term paper, though potentially valuable for the summer proposal.
  *   **Reasoning:** To answer this, you must first settle what know-how is in humans (Q1 & Q2). If you bring AI in too early, you risk defining know-how to fit the technology (anthropomorphism) or dismissing the technology based on a preconceived theory.
  *   **Strategic Advice:** Do not make AI the *subject* of the term paper. Make it the *motivation* for the research proposal. In the term paper, argue that current theories cannot account for 'articulable skills' (Q1 & Q2). In the summer proposal, argue that resolving Q1 & Q2 is a prerequisite for assessing AI agency. This shows foresight without overreaching.

  ---

  ### Strategic Synthesis for Your Term Paper

  Given your constraints (10 weeks, armchair, epistemology supervisor) and your insights (example bias, fragmentation), I recommend the following trajectory for the 6,000 words:

  1.  **Introduction (750 words):** Frame the Intellectualism debate. Introduce your critique: the debate relies on a narrow diet of embodied examples (swimming, cycling). State your thesis: shifting focus to 'protocol-governed skills' (checklists, proofs) reveals that 'know-how' is not a unified natural kind.
  2.  **The Unity Argument (2,000 words):** Address **Question 1**. Compare a tacit skill (swimming) with an articulable skill (running a t-test). Show that the conditions for possession differ. In the latter, propositional knowledge seems necessary; in the former, it seems insufficient. Argue that treating them as one category creates the illusion of a paradox.
  3.  **The Instruction Condition (2,000 words):** Address **Question 2**. Focus on the articulable cases. Argue that in these cases, the capacity to instruct is not merely evidence of know-how but partially constitutive of it. This challenges the Anti-Intellectualist view that ability is primary, but also challenges the Intellectualist view that *any* proposition will do (it must be the *right* operational proposition).
  4.  **Implications & Proposal Seed (1,250 words):** Address **Question 3** briefly. If know-how is fragmented, we need a taxonomy, not a reduction. Conclude by stating that resolving this taxonomy is a prerequisite for assessing new domains (like AI), setting up your summer proposal.

  ### Why This Agenda Works for You

  1.  **It leverages your insight:** Most students will rehash the Stanley & Williamson vs. Ryle debate using bicycle examples. By taking the 'statistical test' and 'checklist' examples seriously, you are doing original conceptual work, not just surveying.
  2.  **It fits the constraints:** You do not need to interview surgeons or run experiments. You only need to analyse the *concept* of following a checklist versus the *concept* of balancing on a bike.
  3.  **It seeds the proposal:** A PhD proposal needs to show that there is more work to be done. By arguing that the current debate is stalled because it ignores a class of skills (articulable ones), you create a niche for yourself. You are not just 'applying' existing theory; you are suggesting the theory needs restructuring.
  4.  **It manages the AI risk:** It keeps AI in the background as a motivation for why the definition matters, without forcing you to become an expert in machine learning architecture during a philosophy term.

  ### Final Caution on 'Settled' Matters

  Be wary of claiming anything is truly settled in this field.
  *   It is **[Contested]** whether know-how entails ability.
  *   It is **[Contested]** whether know-how entails propositional knowledge.
  *   It is **[Consensus]** that *some* relation exists between the two (nobody thinks they are entirely unrelated).
  *   **[My Judgement]:** The field is currently in a state of 'equilibrium stagnation'. The arguments on both sides are well-known and have reached a point of diminishing returns. This is why your approach (changing the examples to test the boundaries of the concepts) is the most viable path to making progress.

  If you pursue the **Fragmentation Hypothesis (Question 1)** as your core argument, you position yourself as someone clarifying the conceptual landscape rather than merely fighting a trench war in an existing debate. This is the strongest possible position for a final-year student aiming for further research.
