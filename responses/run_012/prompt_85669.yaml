  Direction two (Turing/AI) is **Ontological Inflation**. It argues that because a system performs a task (playing games), it possesses the corresponding internal state (understanding). This is the cheat. It solves the measurement problem (how do we test?) by redefining the reality (what is thinking?). It conflates competence with comprehension. A thermostat regulates temperature, but it doesn't care about the weather. Similarly, a model predicts tokens without grasping meaning.

  The asymmetry is crucial. Evolution removes a supernatural requirement to explain a natural result. Turing adds a mental attribute to a mechanical result based solely on output. The first reduces entities; the second multiplies them via definition.

