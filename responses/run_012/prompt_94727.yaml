answer: |-
  # Decision Tree: The Moral Equality of Combatants

  **Instructions:** Proceed through the nodes by selecting the option that best matches your intuition. Do not worry about the names of the theories; answer based on the cases described. At the end, you will be assigned a position and told what awkward commitment comes with it.

  ---

  ### **ROOT NODE: The Modest Claim**
  **Statement:** "A soldier fighting for an unjust cause is not, *merely in virtue of that*, a murderer. There is at least something to be said for treating combatants on both sides alike."

  *   **I Reject This:** A soldier fighting for an unjust cause *is* morally equivalent to a murderer (or at least lacks the right to fight).
      *   → **Go to Terminal Node 0.**
  *   **I Endorse This:** There is some sense in which unjust combatants are not murderers, or at least should not be treated as such.
      *   → **Go to Stage 1.**

  ---

  ### **TERMINAL NODE 0: Radical Asymmetrism**
  *   **Position:** **Criminalization View.**
  *   **Awkward Commitment:** You must accept that most soldiers in history have been common criminals, and that punishing them retroactively is morally required rather than vindictive.

  ---

  ### **STAGE 1: Disambiguation**
  **Question:** When you say combatants should be treated "alike," what specifically is equal?

  *   **(a) Equal Permissions:** Each is permitted to kill the other.
  *   **(b) Equal Liability:** Each is a legitimate target of the other (whether or not either is permitted to kill).
  *   **(c) Equal Accountability:** Neither is blameworthy for killing the other (even if one was wrong to do it).
  *   **(d) Equal Standing:** Both are answerable to the same rules, and neither is punished for what those rules permit.

  > **Note on the Fork:** A reader who chooses **(a)** claims the act of killing is morally *right* for both. A reader who chooses **(d)** claims the act might be morally *wrong* but should not be *prosecuted*. They are disagreeing about whether the law should mirror morality or manage conflict.

  *   **If (a):** → **Go to Stage 2A.**
  *   **If (b):** → **Go to Stage 2B.**
  *   **If (c):** → **Go to Stage 2C.**
  *   **If (d):** → **Go to Stage 2D.**

  ---

  ### **STAGE 2A: Under Equal Permissions**
  **Question:** Consider a **Volunteer** who *knows* his side's war is unjust, yet fights. When he kills an enemy combatant, is his action **Permitted** (it was the right thing to do) or **Excused** (it was the wrong thing to do, but he is not to blame)?

  *   **Permitted:** → **Node 3A-1.**
  *   **Excused:** → **Node 3A-2.**

  #### **Node 3A-1 (Permitted)**
  **Question:** What makes it permitted? Is it because the enemy is **Liable** to be killed (they deserve it), or for some **Independent Reason** (e.g., preventing a greater disaster)?

  *   **Independent Reason:** → **Terminal Node 1.**
  *   **Liable:** → **Node 4A.**

  #### **Node 4A (Liability)**
  **Question:** Consider a **Conscript** who believes his war is just, but it is actually unjust. Is he liable to be killed because he poses an **Objective Threat**, or only if he is **Culpable** (at fault) for that threat?

  *   **Objective Threat:** → **Terminal Node 2.**
  *   **Culpable:** → **Terminal Node 3.**

  #### **Node 3A-2 (Excused)**
  **Question:** Consider a **War of Mutual Sincerity** (each side is convinced of its justice, neither is right). What excuses the killing? Is it **Invincible Ignorance** (they couldn't know better) or **Duress/State Agency** (the state forced them/acted in their name)?

  *   **Invincible Ignorance:** → **Terminal Node 4.**
  *   **Duress/State Agency:** → **Terminal Node 5.**

  ---

  ### **STAGE 2B: Under Equal Liability**
  **Question:** Consider a soldier on the **Just Side** who commits an atrocity in the course of fighting. Is the symmetry of vulnerability (the fact that he can be killed) a consequence of **Ordinary Self-Defence Morality** (he became a threat like a street criminal) or an **Artifact of Convention** (he is targetable only because we agree soldiers are targetable)?

  *   **Ordinary Self-Defence:** → **Terminal Node 6.**
  *   **Artifact of Convention:** → **Terminal Node 7.**

  ---

  ### **STAGE 2C: Under Equal Accountability**
  **Question:** Return to the **War of Mutual Sincerity**. Is the unjust combatant blameless because **He Did Nothing Wrong** (his sincerity made it right) or because **He Did Something Wrong Under Conditions That Defeat Blame** (it was wrong, but he couldn't help it)?

  *   **Did Nothing Wrong:** → **Terminal Node 8.**
  *   **Wrong + Defeat Blame:** → **Terminal Node 9.**

  ---

  ### **STAGE 2D: Under Equal Standing**
  **Question:** Why do we not punish the **Volunteer** who knows his cause is unjust? Is the combatant's privilege a **Legal Fiction**, a **Convention Justified by Effects**, or a **Fair Scheme of Mutual Restraint**?

  *   **Legal Fiction:** → **Terminal Node 10.**
  *   **Convention Justified by Effects:** → **Terminal Node 11.**
  *   **Fair Scheme of Mutual Restraint:** → **Terminal Node 12.**

  ---

  ### **TERMINAL NODES (The Leaves)**

  **Terminal Node 1: Lesser-Evil Permissibility**
  *   **Awkward Commitment:** Permits killing the innocent to avert a catastrophe, effectively treating persons as means to an end.

  **Terminal Node 2: Traditional Just War Theory (Walzerian)**
  *   **Awkward Commitment:** Requires accepting that the non-culpable Conscript is liable to be killed even though he has done no moral wrong.

  **Terminal Node 3: Culpability-Based Symmetry**
  *   **Awkward Commitment:** Implies the non-culpable Conscript cannot be permissibly killed, which undermines the symmetry of the battlefield in practice.

  **Terminal Node 4: Epistemic Symmetry**
  *   **Awkward Commitment:** Symmetry is a consequence of what each side can know about its own cause; if knowledge were perfect, asymmetry would return.

  **Terminal Node 5: Collective Excuse**
  *   **Awkward Commitment:** Diminishes individual moral agency to the point of automatism, suggesting soldiers are merely tools of the state.

  **Terminal Node 6: Naturalist Liability**
  *   **Awkward Commitment:** Makes war morality identical to street crime morality, ignoring the unique political context of organized violence.

  **Terminal Node 7: Conventionalist Liability**
  *   **Awkward Commitment:** Morality depends on arbitrary agreement; if the convention lapses, immunity returns, even for aggressors.

  **Terminal Node 8: Subjective Justification**
  *   **Awkward Commitment:** Implies objective injustice does not constitute a moral wrong if the agent believes otherwise.

  **Terminal Node 9: Universal Excuse**
  *   **Awkward Commitment:** The appearance of symmetry is really equal wrongdoing; both sides are in the wrong, but both are pardoned.

  **Terminal Node 10: Legal Positivism**
  *   **Awkward Commitment:** Symmetry is a legal fiction maintained because both sides need it, regardless of moral truth.

  **Terminal Node 11: Consequentialist Standing**
  *   **Awkward Commitment:** Requires sacrificing justice for the sake of order; we protect unjust soldiers to keep wars from becoming total.

  **Terminal Node 12: Reciprocal Restraint**
  *   **Awkward Commitment:** Binds the just side to rules the unjust side violates, effectively penalizing compliance with morality.

  ---

  ### **ANALYSIS OF THE TREE**

  **1. Indistinguishable Leaves**
  *   **Terminal Node 7 (Conventionalist Liability) and Terminal Node 10 (Legal Positivism).**
      *   **Diagnosis:** These are likely **one position under two names**. Both ground the status of the combatant in human agreement rather than natural morality. The distinction between "liability to be killed" and "legal fiction of immunity" collapses when the convention is the sole source of the norm.
  *   **Terminal Node 4 (Epistemic Symmetry) and Terminal Node 9 (Universal Excuse).**
      *   **Diagnosis:** These are **two positions needing one more question**. Node 4 claims the act is permissible *because* we can't know the truth. Node 9 claims the act is wrong *but* we can't blame the agent. They converge on practice (don't punish) but diverge on metaphysics (is the killing right or wrong?).

  **2. Unoccupied Combinations**
  *   **Combination:** Permissions (Permitted / Liability / Culpable) + Accountability (Did Nothing Wrong).
      *   **Diagnosis:** **Incoherent.** If liability is grounded in culpability, the agent must have done something wrong; one cannot be culpable for doing "nothing wrong."
  *   **Combination:** Standing (Fair Scheme) + Permissions (Excused / Duress).
      *   **Diagnosis:** **Unattractive.** A "Fair Scheme" implies voluntary reciprocity among agents. "Duress" implies the agents are coerced. A scheme of fairness cannot be built on the premise that participants are acting under coercion.
  *   **Combination:** Liability (Ordinary Self-Defence) + Standing (Legal Fiction).
      *   **Diagnosis:** **Tension.** If liability is grounded in natural self-defence morality, standing should reflect that moral reality. Calling it a "Legal Fiction" suggests the law is divorced from the morality that grounds the liability.
