  So give me a case in that neighborhood: a specific thought experiment of the knob-to-the-limit kind where the epistemic payoff is genuinely up for grabs — either because the limit verdict is trustworthy for a reason I'm missing, or, better, because people have been quietly leaning on the infinite case while the finite cases all go the other way. Then tell me which way the case actually cuts and why, and say whether the idealization is doing the work or just clearing the underbrush. No museum pieces please — no Galileo's falling bodies, no twin paradox, no Maxwell's demon, no ladder-in-the-barn; I've heard all of those and I need something I can defend in front of people who've also heard them. I don't need reading suggestions or a lit review, just the case and the reasoning.
