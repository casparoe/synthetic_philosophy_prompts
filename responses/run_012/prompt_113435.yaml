answer: |-
  **The Case: Spontaneous Symmetry Breaking and the Thermodynamic Limit**

  This is a case from statistical mechanics that hits your "knob-to-the-limit" suspicion directly. It concerns phase transitions—like water freezing or a magnet becoming magnetic.

  **The Setup and The Knob**
  Consider a ferromagnet (like iron). Above a certain temperature (the Curie point), the atomic spins are random; the net magnetization is zero. Below that temperature, the spins align, and the material acquires a net magnetization in a specific direction. This is **Spontaneous Symmetry Breaking (SSB)**: the underlying laws are rotationally symmetric, but the ground state picks a direction.

  The "knob" here is **$N$**, the number of particles in the system.
  *   **Finite Setting:** Any real magnet has a finite number of atoms (even if it's $10^{23}$).
  *   **The Limit:** The "Thermodynamic Limit," where $N \to \infty$ and Volume $V \to \infty$, holding density constant.

  **The Conflict: Finite vs. Limit Verdicts**
  Here is where your suspicion and your friend's slogan collide head-on.

  1.  **The Finite Verdict:** In standard statistical mechanics, the properties of a system are derived from its partition function. For any *finite* $N$, the partition function is a sum of finite terms. Mathematically, this function is **analytic** (smooth). An analytic function cannot have a sharp singularity. Without a singularity, you cannot have a sharp phase transition. Furthermore, for finite $N$, there is always a non-zero probability that thermal fluctuations will flip the entire magnetization from "up" to "down." The system will eventually explore all states. Strictly speaking, **symmetry is never broken in a finite system.** The average magnetization over infinite time is zero.
  2.  **The Limit Verdict:** When you take $N \to \infty$, the partition function can develop non-analytic points (singularities). At this limit, the free energy becomes sharp. The barrier between "up" and "down" magnetization becomes infinite. The system gets stuck in one state forever. **Symmetry breaking only strictly exists in the infinite limit.**

  **The Epistemic Problem**
  Your skepticism is mathematically vindicated here: The phenomenon we are trying to explain (a sharp phase transition with stable magnetization) *does not exist* in the finite theory. It only exists in the idealization.
  So, when physicists use the infinite limit to explain why your fridge magnet sticks, are they telling the truth about nature? Or are they telling a story about a mathematical fantasy that happens to look like nature?

  If you stick to the finite case (the "real" world), you lose the explanation for why the phase is stable. If you use the limit (the "fake" world), you get the explanation but describe an impossible object (an infinite magnet).

  **Which Way It Cuts**
  This case cuts in favor of your **friend**, but with a crucial philosophical distinction that saves you from having to accept "infinite magnets" as real.

  The limit is **constitutive of the explanation**, not just a simplification.
  If you try to explain phase transitions using only finite $N$, you run into a problem of timescales. For a macroscopic magnet, the time required for thermal fluctuations to flip the magnetization from up to down is exponentially long in $N$. For $N \approx 10^{23}$, the tunneling time exceeds the age of the universe.
  *   **Finite view:** "The symmetry isn't broken, it's just metastable for a really long time."
  *   **Limit view:** "The symmetry is broken, period."

  The epistemic payoff comes from realizing that the infinite limit captures a **structural stability** that is invisible at any finite setting. In the finite case, the "phase" is just a long-lived transient. In the limit, it becomes a distinct state of matter. The limit tells us that the behavior is *robust* against perturbations. It classifies the system into universality classes (e.g., all fluids behave like the Ising model near the critical point). This classification fails if you insist on finite $N$, because every finite system is technically unique and analytic.

  **The Verdict on the Idealization**
  The idealization is **doing the work**, not just clearing the underbrush.

  If it were just clearing underbrush, we could remove the idealization and get approximately the same result with more math (like adding air resistance to Galileo's balls). Here, if you remove the idealization (set $N$ back to finite), the *phenomenon disappears* mathematically. The singularity vanishes.

  However, this doesn't mean nature is infinite. It means that **emergent properties** (like "phase" or "state of matter") are properties of the *limit*, not the constituents. The thought experiment teaches us that certain macroscopic truths are not reducible to finite microscopic descriptions. You cannot find the sharp freezing point of water by looking at 1,000,000 water molecules, no matter how hard you calculate. You only find it by seeing where the sequence of finite systems is *heading*.

  **How to Defend This in Seminar**
  1.  **Acknowledge the mathematical truth:** Concede that strictly speaking, finite systems don't have phase transitions. This validates your initial skepticism.
  2.  **Pivot to explanation:** Argue that science isn't just about ontological accuracy (what exists); it's about explanatory power (why it stays that way). The finite description cannot explain the *stability* of the ice cube without referencing the infinite limit.
  3.  **The "Taking Limits" Strategy:** The lesson isn't that infinite magnets exist. The lesson is that **taking the limit is a physical operation**, not just a mathematical one. It corresponds to asking: "Is this property stable as the system gets larger?" If the answer is yes, the limit verdict is trustworthy for the finite case, even if the finite case never strictly reaches it.

  This case forces the room to choose: Do we demand that our physics be strictly true of finite systems (losing the ability to define phases), or do we accept that some physical truths are inherently asymptotic? That is the exact tension you are looking for.
