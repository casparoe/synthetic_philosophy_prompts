      Decorative disanalogies abound (terrain vs. building), but substantive ones undermine the conclusion. First, *neutrality*. Parks are doctrinally neutral; established churches are not. A park does not preach salvation; a church does. Second, *excludability*. While the building is open, the sacraments often require conformity. Third, *funding legitimacy*. Park funding is for conservation; church funding implies state endorsement of specific truth claims.

      **Public vs. Merit Good**
      The member argues the church is a public good (non-excludable, non-rivalrous benefits). However, the "presence" described is better classified as a *merit good*—something provided because the state deems it valuable regardless of individual demand. The critical question is: whose conception of merit? In an established system, it is the state's conception, aligned with specific doctrine. Unlike a park, which preserves nature for all biologies, the church preserves dogma for specific souls. Claiming this as a neutral "backdrop" ignores that the backdrop depicts a specific theological landscape, potentially alienating non-adherents who cannot access the "wilderness" on equal terms.

      **Jurisdictional Variations**
      The analogy relies heavily on the English baseline (historic endowment + general support). It fractures elsewhere. In Germany, church tax is levied only on registered members, making the church a club good, not a public utility. In France or the USA, separation removes public upkeep entirely; the church is private voluntary association. The member's argument—that disestablishment hurts those without private alternatives—only holds where the state currently subsidizes access. However, in Germany, the "alternative" is simply opting out of membership. In the US, the "alternative" is a free market of congregations. The analogy assumes state subsidy is necessary for access, ignoring models where voluntary funding sustains high usage without establishment.

