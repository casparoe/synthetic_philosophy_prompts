              *   *Merit vs. Public Good:* Parks are public goods (non-excludable, non-rivalrous). Church services are rivalrous/excludable. The "presence" is the claimed public good.

      *   **Specific Interest 1: Public vs. Merit Good:**
          *   Public good: Everyone benefits regardless of use (e.g., defense).
          *   Merit good: Good for you whether you want it or not (e.g., education, vaccination).
          *   The analogy claims "common good" (public). But is spiritual presence a public good? It's more a *merit good* imposed by the state. Whose merit? The established doctrine's.

      *   **Specific Interest 2: Cross-Jurisdictional:**
