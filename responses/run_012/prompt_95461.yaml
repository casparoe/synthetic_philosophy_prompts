answer: |-
  You begin at the root: two agents, A and B, have publicly stated different credences in a proposition $P$. Each knows the other has heard and understood the statement. The disagreement persists. Follow the branches by answering the questions as they apply to your specific situation.

  **1. State Space Alignment**
  Are you and your colleague assigning credences to the exact same event defined over the exact same set of possible worlds? For example, if the proposition is "the policy worked," does "worked" imply the same outcomes for the same subgroups in both of your models, or are you using different vocabularies to describe what looks like the same subject matter?
  *   **No:** You terminate at **Semantic Mismatch**.
      *   *Awkward Commitment:* You must admit that you have been arguing past one another rather than about the world.
  *   **Yes:** Proceed to Question 2.

  **2. Derivational Transparency**
  Is the path from the evidence to the stated credence formal or simple enough that, in principle, the other party could verify the calculation? Consider the case of two mathematicians disagreeing about an unproved conjecture: is the disagreement about a proof step that could be checked, or is the reasoning too complex or intuitive to be fully reconstructed?
  *   **No:** You terminate at **Computational Intractability**.
      *   *Awkward Commitment:* You must accept that rational agents can disagree simply because checking the truth is too expensive.
  *   **Yes:** Proceed to Question 3.

  **3. Common Knowledge of Posteriors**
  Is it truly common knowledge that you hold these specific credences? This requires not just that you heard the number, but that you know they know you heard it, and they know you know they know you heard it, without any doubt. Consider a situation where a disagreement is privately resolvable but one party has reasons not to disclose the resolving fact: does the public standoff persist because the *knowledge* of the credence hasn't fully saturated the common epistemic space?
  *   **No:** Proceed to Question 4.
  *   **Yes:** Proceed to Question 5.

  **4. The Barrier to Common Knowledge**
  Why is the knowledge not common? Is it because the information is physically inaccessible or the communication channel is noisy (e.g., one of you does not know that a subgroup exists which the other is talking about), or is it because one of you is choosing not to disclose evidence that would resolve the disagreement?
  *   **Inaccessible/Unknown Existence:** You terminate at **Epistemic Distance**.
      *   *Awkward Commitment:* You must concede that the disagreement is merely a temporary lack of information pooling, not a deep conflict.
  *   **Strategic Non-Disclosure:** You terminate at **Strategic Opacity**.
      *   *Awkward Commitment:* You must admit that at least one party values winning or privacy over accuracy.
  *   *(Note: The combination where information is inaccessible yet the disagreement is "privately resolvable" is unoccupied; it is incoherent to say a fact is privately known but physically inaccessible to the other.)*

  **5. Updating Consistency**
  If you were given your colleague's exact private evidence, would you update your beliefs to match their current credence? This asks whether you agree on the likelihood functions: do you agree on how strongly specific pieces of evidence support the hypothesis?
  *   **No:** You terminate at **Likelihood Variance**.
      *   *Awkward Commitment:* You must claim that rationality permits different people to weigh the same data differently.
  *   **Yes:** Proceed to Question 6.

  **6. Counterfactual Prior Identity**
  If you were to swap all private evidence with your colleague, would you arrive at exactly the credence they currently hold? This tests the Common Prior Assumption without naming it: it asks if your starting points before any private evidence were identical.
  *   **No:** You terminate at **Prior Asymmetry**.
      *   *Awkward Commitment:* You must maintain that rational agents can start with different brute probabilities for no reason other than identity.
  *   **Yes:** Proceed to Question 7.

  **7. Information Structure**
  Is one party's information set a strict superset of the other's? Consider the case where two people share a prior, but one has strictly more information than the other, and they still disagree.
  *   **No:** You terminate at **Symmetric Ignorance**.
      *   *Awkward Commitment:* You must accept that you are both equally blind, yet somehow seeing different things.
  *   **Yes:** Proceed to Question 3 (Re-evaluated).
      *   *Note:* If you reach this node, you have established Shared Priors, Consistent Updating, and an Information Subset relation. You must return to Question 3. If Common Knowledge of Posteriors is **No**, you terminate at **The Premature Invocation**. If Common Knowledge of Posteriors is **Yes**, you terminate at **The Genuine Paradox**.
      *   *Premature Invocation Awkward Commitment:* You must admit you are using a theorem that does not apply to the current communication state.
      *   *Genuine Paradox Awkward Commitment:* You must conclude that at least one of you is failing at basic Bayesian rationality.

  **8. Indexical and Self-Locating Checks**
  (If the above do not resolve the tension) Does the proposition involve self-locating beliefs, such as "I am in room A" versus "You are in room B," where the truth value depends on who is speaking?
  *   **Yes:** You terminate at **Indexical Divergence**.
      *   *Awkward Commitment:* You must accept that some truths are essentially private and cannot be pooled.
  *   **No:** You terminate at **Unpartitioned State Space**.
      *   *Awkward Commitment:* You must concede that you are reasoning over a possibility space that is not well-defined enough for probability theory.

  ***

  **Unoccupied and Indistinguishable Positions**
  The combination of **Strategic Opacity** and **Common Knowledge of Posteriors** is unoccupied; if a party strategically withholds evidence, the posteriors cannot be common knowledge by definition. This view is incoherent. Similarly, **Computational Intractability** combined with **Logical Omniscience** is unoccupied, as omniscience precludes computational limits.

  There is a pair of leaves the tree cannot easily separate: **Prior Asymmetry** and **Likelihood Variance**. Empirically, observing that agents do not swap beliefs when swapping evidence (Prior Asymmetry) looks identical to observing that they update differently on the same evidence (Likelihood Variance). To pull them apart, you would need access to the agents' credences *before* any private evidence was received, which is rarely available in adult graduate students. This distinction remains largely unexplored in applied diagnostics.

  ***

  **Implications for the Conversation-Stopper**
  This tree implies that the move you started with—invoking Aumann to obligate agreement—is legitimate only if you land on the leaf labeled **The Genuine Paradox**. This requires you to have verified that you share a prior, agree on updating rules, have achieved common knowledge of your posteriors, and that one information set is a subset of the other. In every other leaf, the theorem's assumptions are violated, and the "obligation to agree" dissolves into a diagnostic finding about semantics, computation, information flow, or incentives. Telling a colleague they are irrational is therefore only warranted after you have ruled out semantic mismatch, computational limits, hidden information, strategic behavior, and prior divergence. Until then, the theorem is not a gavel, but a map showing you where the disagreement actually lives.
