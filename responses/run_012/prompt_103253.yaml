  3.  **Candidate Readings (Philosophical Frameworks):**
      *   *Reading A: The Regularity/Humean View.* Causation is just constant conjunction. No metaphysical counterfactuals needed. Historians observe patterns. (Weak fit: History is often unique events, not laws).
      *   *Reading B: The Mechanistic/Process View.* Causation is the transmission of energy/information or a chain of processes. Counterfactuals are secondary heuristic devices. (Strong fit: Historians love tracing processes).
      *   *Reading C: The Counterfactual/Dependency View (Lewis-style).* Causation *is* counterfactual dependence. Historians are implicitly committed to them even if they deny it verbally. (Strong fit: Explains "decisive battle" talk).
      *   *Reading D: The Narrative/Explanation View.* Causation is a feature of the story structure, not the world. (Strong fit: Explains why some counterfactuals feel "historical" and others "fantastical").

  4.  **Selecting the Best Reconstruction (The "Implicit Theory"):**
      *   Historians aren't Humeans (they don't look for universal laws).
      *   They aren't strict Lewisians (they reject explicit counterfactual reasoning).
      *   They seem to be *Implicit Counterfactual Realists* constrained by *Evidential Mechanisms*.
      *   *Core Thesis:* Historians presuppose a **Difference-Making Account of Causation** grounded in **Tractable Mechanisms**. They reject *speculative* counterfactuals (long chains, high contingency) but accept *robust* counterfactuals (short chains, supported by evidence of mechanism).

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the tension. It's a classic problem (Weber, Carr, Ferguson).
      *   **Candidate Readings:**
          1.  *Regularity:* Ruled out (history isn't law-bound).
          2.  *Mechanism:* Strong contender.
          3.  *Counterfactual Dependence:* Strong contender.
          4.  *Narrative:* Strong contender.
      *   **The Reconstruction (Commitment):** The "Robust Difference-Maker" view. Causation = making a difference to the outcome *within a constrained scenario*.
      *   **Presuppositions vs. Fit:**
          *   *Strictly Presupposed:* That causes make a difference (dependency).
          *   *Fits Well:* Mechanistic tracing (how the difference was made).
          *   *Ruled Out:* Fatalism/Determinism (if everything is inevitable, no specific cause matters) and Pure Chance (if everything is random, no cause matters).
      *   **Can we cash it out without Counterfactuals?**
