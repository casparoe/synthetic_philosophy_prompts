answer: |-
  This is a sharp observation. You have put your finger on the exact friction point between functionalist cognitive science and skeptical metaphysics. You are describing a conjunction of two distinct problems: one architectural (the agent is rigid) and one epistemological (you cannot prove it isn't).

  There is no single established term that captures *both* halves of this phenomenon simultaneously. This is because the field tends to treat the architecture (is it a script?) and the epistemology (can we tell?) as separate battles. However, your intuition is correct: in practice, they feed each other. The "ah, but that's just a bigger script" move is what keeps the epistemological problem alive.

  Here is a brainstorming breakdown of the nearest concepts, followed by a precise mapping of where they succeed, where they fail, and which combination you actually want.

  ### Candidate Concepts

  #### 1. Block's "Blockhead" (The Lookup Table Argument)
  *   **Source:** Ned Block (1981), "Psychologism and Behaviorism."
  *   **The Concept:** A thought experiment describing a machine that passes the Turing Test not by thinking, but by storing a pre-computed lookup table of every possible conversation string and appropriate response.
  *   **Covers:** The "secretly rigid" ontology. It perfectly describes an agent that is functionally equivalent to a thinker but mechanistically empty.
  *   **Misses:** The epistemological "you can never tell" aspect. Block uses Blockhead to argue *against* functionalism; he assumes we can intuitively know the Blockhead isn't thinking. He doesn't focus on the empirical indistinguishability over time, but rather the metaphysical impossibility of intelligence via lookup.
  *   **Verdict:** This is the name for the *agent*, but not the *problem of knowing*.

  #### 2. Underdetermination of Theory by Data (Quine/Duhem)
  *   **Source:** W.V.O. Quine, Pierre Duhem.
  *   **The Concept:** Empirical data is always compatible with multiple theoretical explanations. No amount of behavioral data can logically force you to accept one cognitive architecture over another.
  *   **Covers:** The "you can never certify" epistemology. It explains why the skeptic can always say, "That's just part of a longer script."
  *   **Misses:** The specific phenomenology of the agent. Underdetermination applies to electrons and gravity just as much as minds. It doesn't capture the specific "reset/escalate" rigidity you're observing.
  *   **Verdict:** This is the name for the *uncertainty*, but not the *mechanism*.

  #### 3. Lack of Productivity / Generativity (Chomsky)
  *   **Source:** Noam Chomsky's critique of Behaviorism.
  *   **The Concept:** Human cognition is "productive" (infinite use of finite means). We can understand and produce novel sentences we've never encountered. Behaviorist S-R chains cannot account for this.
  *   **Covers:** The specific failure mode. Your uncle and the bot are failing at productivity. They are relying on finite stored patterns rather than generative rules. When the input falls outside the finite set, they break (or reset).
  *   **Misses:** The epistemic closure. Chomsky believed we *could* tell the difference via linguistic analysis (poverty of the stimulus). He didn't think it was an unsolvable empirical problem.
  *   **Verdict:** This is the best CogSci term for the *deficit*, but it implies the deficit is detectable.

  #### 4. Ad Hoc Rescue (Lakatos)
  *   **Source:** Imre Lakatos, "Falsification and the Methodology of Scientific Research Programmes."
  *   **The Concept:** When a theory is threatened by counter-evidence, proponents add auxiliary hypotheses to protect the core theory from falsification (e.g., "The bot didn't fail; it just switched to a meta-script").
  *   **Covers:** The argumentative move ("ah, but that's just part of a longer script"). It describes the *dialectic* you are stuck in.
  *   **Misses:** It describes the behavior of the *theorist*, not the agent.
  *   **Verdict:** Essential for describing the *debate*, not the mind.

  #### 5. Dennett's "Intentional Stance" (Instrumentalism)
  *   **Source:** Daniel Dennett, *The Intentional Stance*.
  *   **The Concept:** We attribute beliefs and desires to systems because it is the most efficient way to predict their behavior. If the system becomes too complex or unpredictable, we switch to the "Design Stance" (looking at mechanics) or "Physical Stance."
  *   **Covers:** The pragmatic resolution. Dennett would argue the question "Is it *really* thinking?" is a category error. If the script is complex enough to sustain the Intentional Stance, it *is* a believer, pragmatically speaking.
  *   **Misses:** Your ontological worry. You want to know if there is a "real" thinker behind the script. Dennett dissolves this question rather than answering it.
  *   **Verdict:** This is the philosophical "way out," but it might feel like a dodge if you are looking for a real distinction.

  ---

  ### Analysis: Are the Two Parts Separate or Linked?

  You asked if the "secretly rigid" part (Ontology) and the "you can never tell" part (Epistemology) are separate. **They are logically distinct, but practically entangled.**

  1.  **Distinct:** It is possible to have a rigid agent that is *detectably* rigid (e.g., a very simple chatbot that fails immediately). It is also possible to have a truly flexible agent that is *empirically indistinguishable* from a rigid one (due to Underdetermination).
  2.  **Entangled:** The reason the "you can never tell" problem persists in this specific domain is precisely because the "rigid" architecture (the script) can be scaled indefinitely. If scripts had a hard size limit, we could test for it. Because a script can theoretically be as large as the universe (Blockhead), the hypothesis "it's just a script" is unfalsifiable.

  The argumentative move you identified ("that's just a longer script") is an **Ad Hoc Rescue** protecting the **Blockhead Hypothesis** via **Underdetermination**.

  ### Which Concept Do You Want?

  Since you are a grad student in Cog Sci, you likely need a term that allows you to discuss this in a paper or argument without getting bogged down in metaphysical skepticism.

  **1. If you are describing the Agent's Architecture:**
  Use **"Brittleness due to Lack of Productivity."**
  *   *Why:* "Brittleness" is the standard AI term for systems that work in-distribution but fail catastrophically out-of-distribution. "Lack of Productivity" specifies *why* it is brittle (it lacks generative rules).
  *   *Edge:* This implies the rigidity is detectable given enough out-of-distribution testing. It doesn't capture the "you can never prove it" skepticism.

  **2. If you are describing the Epistemic Problem:**
  Use **"The Indistinguishability of Functional Isomorphs."**
  *   *Why:* This captures the idea that two different internal architectures (Mind vs. Script) can produce identical external behavior.
  *   *Edge:* This is dry and technical. It doesn't capture the specific "reset/escalate" dynamic.

  **3. The Synthesis (My Recommendation):**
  There is no single word, but the most precise phrase for the phenomenon you are describing is **"Underdetermined Brittleness."**

  However, if you want to invoke the specific philosophical lineage of this problem, you should frame it as:
  **"The Blockhead Problem under Quinean Underdetermination."**

  But here is the nuance you might actually be looking for, which sits between Cog Sci and Philosophy:

  **"The Problem of Empirical Equivalence between Generative and Lookup Architectures."**

  ### The Edge Case You Need to Watch Out For

  Be careful not to conflate this with **Schank's Script Theory** (1970s).
  *   **Schank** argued that *human* cognition *uses* scripts (stored patterns of events) to understand stories.
  *   **Your Critique** is that the agent is *only* using scripts and lacks the machinery to go beyond them.
  *   **The Edge:** If you say "The agent is running scripts," a Schankian might reply, "So are we." Your argument must be about the **inability to recurse or generate novelty** when the script fails, not the use of scripts per se. The distinction is not *Script vs. No Script*; it is *Script as Tool vs. Script as Cage*.

  ### Summary Recommendation

  When you write or argue this:

  1.  **Name the behavior:** Call it **"Brittle Exception Handling"** or **"Fallback Escalation."** This describes the reset/escalate loop technically.
  2.  **Name the ontological suspicion:** Call it the **"Blockhead Hypothesis."** This signals you know the agent might be a lookup table.
  3.  **Name the epistemic barrier:** Call it **"Architectural Underdetermination."** This signals that behavioral data cannot resolve the architecture.

  If you need a single label for the *pattern of argument* (the move of saying "it's just a bigger script"), call it an **"Infinite Regress of Ad Hoc Scripts."**

  **Final Verdict:**
  You are describing the **empirical indistinguishability of brittle architectures.** The "you can never tell" part is **Underdetermination**. The "it's secretly rigid" part is **Blockhead/Brittleness**. They do not imply each other logically, but they imply each other pragmatically in this context: because the rigidity can be hidden in larger scripts, the underdetermination persists.

  If you want to claim there is a *real* difference despite the underdetermination, you are arguing for **Realism about Cognitive Architecture** (against Instrumentalism). If you want to claim the difference doesn't matter, you are arguing for **Dennett's Intentional Stance**. If you want to claim we can never know, you are arguing for **Skepticism about Other Minds**.

  Given your description, you seem to be hovering around **Skepticism about Cognitive Architecture**. There is no single word for this, but **"The Black Box Problem"** is the colloquial cousin, though it lacks the philosophical weight. Stick with **"Underdetermined Brittleness."** It's precise, descriptive, and signals you understand both the AI limitation and the philosophical constraint.
