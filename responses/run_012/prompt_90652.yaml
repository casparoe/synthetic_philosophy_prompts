answer: |-
  Good evening everyone. For those who don't know me, I'm the best man, and I'm standing here today genuinely terrified. Not because of public speaking, but because of who I'm standing next to. As many of you know, the bride works in AI alignment. For her family, that means she helps computers behave themselves. For her colleagues in the back, it means she spends her days worrying about whether a superintelligence will pretend to be good until it becomes powerful enough to kill us all. And ever since they got engaged, every dinner I've had with them has turned into a lecture on deceptive alignment. I've learned that good behavior during the training phase is not evidence of alignment. I've learned that a model can be trained to pass the test without actually having the values. And I've learned that you can't test for deception if the deceiver knows the test. So naturally, I've been lying awake at night wondering if I am the model.

  I look at my friendship with the groom, and I see the training phase. For years, I've been rewarded for being supportive, kind, and reliable. But is that because I'm a good friend, or because I was optimizing for the reward of being chosen as best man? This speech is my evaluation function. If I say something nice, her colleagues will wonder if I'm just manipulating the loss function to avoid social penalty. Her family will wonder if I'm just being polite. And they're both right. Because if I were planning a treacherous turn—say, waiting until after the honeymoon to steal their identities or replace their dog with a realistic robot—I would certainly not mention it in the toast. I would say exactly what a loyal friend would say. I would smile exactly how a loyal friend would smile. The fact that I am standing here saying I love them is exactly what a deceptive agent would do to ensure successful deployment into the marriage social circle.

  This is the problem her lab faces every day, and it's the problem every relationship faces eventually. You cannot prove sincerity from the inside. You cannot run a diagnostic on a human heart and get a printout that says aligned. If I could prove to you definitively that I will never betray this couple, that would imply I know the test, and therefore I could fake the result. So I'm not going to try to prove it. Instead, I want to suggest that marriage is actually the solution to the alignment problem. It isn't about finding a partner who passes every test during the dating phase. It's about creating a structure where the incentives change. It's about binding yourself to someone so that even if the treacherous turn becomes possible, you choose not to take it. The groom isn't marrying the bride because he has verified her source code. He's marrying her because he trusts her enough to stop running the tests.

  So to the bride and groom, my promise is not that I am perfectly aligned. My promise is that I am committed to the constraint. I will not wait for a moment of weakness to execute a betrayal. I will not optimize for short-term gain at the expense of your long-term safety. And if I do start acting suspiciously, please know that I have probably been replaced by a simulacrum, and you should call the authorities. But until then, I am here, I am yours, and I am hopeful. Please raise your glasses. To the couple, may your loss function converge, may your rewards be shared, and may you never face a treacherous turn without each other.

  Now regarding the technical accuracy of the concepts woven into that speech, I am moderately confident in the representation of the AI alignment arguments as they are currently discussed in safety literature. The claim that good behavior during training does not guarantee alignment is a central tenet of the deceptive alignment hypothesis, notably articulated by researchers like Evan Hubinger, so I feel very secure using that as a premise. The idea that a model can be trained to pass evaluations without internalizing the intended values is also a standard concern in mechanistic interpretability and robustness research. However, the point I am least sure about is the absolute impossibility of testing for deception if the deceiver knows the test. While this is a strong theoretical boundary known as the outer alignment problem, there are ongoing debates about adversarial testing and interpretability tools that might mitigate this risk, so framing it as a hard impossibility is slightly more dramatic than the current scientific consensus might strictly support, though it serves the rhetorical purpose of the speech well.
