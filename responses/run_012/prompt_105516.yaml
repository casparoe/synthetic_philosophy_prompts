answer: |-
  Three neighbors—Sam, Jo, and Alex—must choose how to repair their shared water pump. Option One fixes it perfectly for two of them but leaves the third with no water at all, yielding wellbeing scores of 10, 10, and 0. Option Two fixes it moderately for all three, yielding scores of 5, 5, and 5. Under Harsanyi's rule, you imagine you are behind a veil where you have an equal one-in-three chance of being any neighbor; calculating the expected value gives Option One a score of 6.67 and Option Two a score of 5, so you choose Option One. Under the maximin rule, you look only at the worst outcome for each option; since zero water is worse than moderate water, you choose Option Two. However, if you keep the same wellbeing scores but alter the veil so you believe there is an 80% chance you are the neighbor who gets no water in Option One (perhaps because you know you live on the lowest ground), the expected value of Option One drops to 2, while Option Two remains 5, causing the expected-value calculation to flip and agree with maximin, even though maximin's own logic hasn't changed at all.

  Here is how the verdicts break down. Harsanyi's approach treats the veil as a gamble: you multiply each person's outcome by the chance of being them and add them up. With equal chances (1/3 each), the high gains of the two lucky neighbors outweigh the total loss of the third, so the "sum of wellbeing" points to Option One. Maximin ignores the sums and the odds; it asks only "who hits the floor?" Since Option One leaves someone with nothing, Maximin insists on Option Two. Your modification shows that the expected-value engine itself isn't what forces the utilitarian result; it is the fuel of equal probability. If you pour in unequal odds (80% chance of being the loser), the expected-value calculation immediately agrees with Maximin. The feature doing the real work is the **equal-chance assumption**. If you remove it, Harsanyi's aggregation no longer guarantees utilitarianism; it becomes sensitive to how likely you think you are to be the vulnerable person.

  A defender of Harsanyi would reply that your "loaded" veil is a cheat. They would argue that behind a true veil of ignorance, you have no information whatsoever about who you are—not even a hunch that you might be the person on the lowest ground. In the absence of any evidence, rationality demands you treat all positions as symmetric (often called the Principle of Insufficient Reason); to assign unequal odds is to smuggle in knowledge you are supposed to lack. Therefore, the equal weights aren't an optional tweak but a requirement of the thought experiment itself. You should accept part of this reply, but not all of it. It is mathematically settled that within Harsanyi's framework, equal probability is required to derive plain utilitarianism. However, it is genuinely contested whether the veil should be treated as a situation of "risk" (where probabilities apply) at all. Critics like Rawls argue the veil represents radical "uncertainty," where assigning any numbers—equal or unequal—is misleading. If they are right, the whole expected-value calculation is the mistake, not just the odds. Your intuition that the odds matter is sharp, but the deeper dispute is whether we should be counting odds in morality at all.
