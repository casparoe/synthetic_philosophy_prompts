answer: |-
  Risk-weighted expected utility should be understood not as a psychological bias toward variance, but as a rational sensitivity to the rank-relative stakes of potential outcomes.

  In standard expected utility theory, the value of a gamble is the sum of utilities weighted by their probabilities. Risk-weighted expected utility (REU) modifies this by ordering outcomes from worst to best and evaluating them cumulatively. We begin with the utility of the worst outcome. For each subsequent, better outcome, we calculate the utility increment—the gain over the previous level—and weight it not by the raw probability of that specific outcome, but by a risk function applied to the cumulative probability of achieving at least that level. If the risk function is convex, it assigns less decision weight to probabilities associated with higher, less secure outcomes. This formalism captures the intuition that securing a baseline is morally and rationally more significant than chasing an upside.

  This structure justifies risk aversion as a rational preference rather than a cognitive error. The independence axiom, central to expected utility, assumes that the value of an outcome improvement is independent of the context in which it occurs. REU rejects this because the value of an improvement depends on its rank within the distribution. Improving a worst-case scenario carries different stakes than improving an already likely best-case scenario. By weighting increments based on cumulative probability, REU acknowledges that the moral weight of a gain diminishes as the security of the baseline increases. Thus, preferring a sure thing over a higher-variance gamble with equal expected value is not a failure of rationality, but a coherent expression of rank-relative stakes sensitivity.

  Critics argue that REU leads to dynamic inconsistency or violates stochastic dominance. The dynamic inconsistency objection suggests an agent might plan to take a risk initially but refuse it later when probabilities shift. This objection fails when the risk function is applied consistently to the cumulative probabilities relevant at each specific choice node. If an agent recalculates the weighted utility based on the current distribution of outcomes at the moment of choice, their preferences remain stable over time. Regarding stochastic dominance, because the risk function is strictly increasing, REU preserves first-order stochastic dominance; any apparent violation arises from incorrectly reducing compound lotteries rather than a flaw in the theory itself. Accepting REU requires abandoning the independence axiom, but this is an acceptable price for capturing the rational significance of security.

  Consider a choice over three possible outcomes: $0, $40, and $100, with utilities 0, 0.4, and 1 respectively. Compare Gamble A, which offers a 50% chance of $0 and 50% chance of $100, against Gamble B, which offers a 100% chance of $40. Expected utility values Gamble A at 0.5 and Gamble B at 0.4, preferring the risk. However, using a convex risk function $R(p) = p^2$, REU evaluates them differently. For Gamble A, the base utility is 0. The increment to $100 is 1, weighted by the cumulative probability of getting at least $100 (0.5). The value is $1 \times 0.5^2 = 0.25$. For Gamble B, the base is 0. The increment to $40 is 0.4, weighted by the cumulative probability of getting at least $40 (1.0). The value is $0.4 \times 1^2 = 0.4$. REU prefers the safe Gamble B, reversing the expected utility recommendation. This reversal demonstrates how rank-relative stakes sensitivity rationally prioritizes securing the $40 over chasing the $100, validating risk aversion as a normative principle.
