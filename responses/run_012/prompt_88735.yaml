answer: |-
  1. Brainstorm (rough notes, about 200 words)

  Truth is identical to current social acceptance.
  Truth is identical to lack of social punishment.
  Truth is what survives current epistemic norms.
  Truth is distinct from justification but inaccessible.
  Truth is a compliment paid to successful theories.
  Truth is whatever power structures enforce.
  Truth is a redundant term for warranted assertibility.
  Truth is relative to historical context.
  Truth is an idealized limit of inquiry.
  Truth is whatever avoids falsification for now.
  Truth is a linguistic tool for endorsement.
  Truth is coherence with community standards.
  Truth is impossible to define outside practice.
  Truth is whatever works for current purposes.
  Truth is a metaphysical illusion.
  Truth is consensus among experts.
  Truth is stability of belief over time.
  Truth is immunity from criticism.
  Truth is political victory disguised as fact.
  Truth is a norm of assertion, not a property.

  2. The readings, stated precisely (about 900 words)

  1. **Constitutive Relativism:** This thesis asserts that truth *consists in* contemporary social acceptance. Regarding the distinctions: (b) what makes a belief true is identical to (c) what entitles someone to call it true. There is no gap between justification and truth. Commitments: One cannot be right against everyone; if the community rejects a claim, it is false. History shows shifts in truth, not progress toward a fixed target. Newton's physics was true then, false now. Verdict: Contentious, likely false due to contradictions (a claim cannot be both true and false). Incompatible with Realism and Reading 2.

  2. **Epistemic Humility:** This thesis asserts truth is distinct from justification, but human access is limited to contemporary standards. Regarding distinctions: (b) is independent of (c), but (c) is our only access to (b). Commitments: One can be right against everyone, but cannot know it. History is a fallible attempt to track mind-independent truth. The question of progress is meaningful but answers are uncertain. Verdict: Defensible. Compatible with Realism and Reading 3. Incompatible with Reading 1.

  3. **Normative Deflationism:** This thesis asserts that the word "true" functions merely to endorse assertions meeting current norms. Regarding distinctions: This is a claim about (a) the meaning of "true." To say "X is true" is to say "X is justified assertibility for us." Commitments: Truth-talk is normative, not descriptive of reality. Disagreement is a clash of norms, not facts. History is changes in linguistic practice. Verdict: Defensible. Compatible with Reading 2 if treated as semantic, incompatible with Reading 1 if treated as metaphysical.

  4. **Cynical Power Dynamics:** This thesis asserts truth is determined by coercive power, not reason. Regarding distinctions: (b) what makes a belief true is the ability of powerful agents to enforce it. Commitments: Science is politics. Disagreement is conflict. Being "right" is merely winning. History is the story of victors. Verdict: False/Uncharitable. Collapses into propaganda theory. Incompatible with all other readings except perhaps a corrupted version of 1.

  5. **Temporal Indexicality:** This thesis asserts truth is time-relative. "True" means "true-at-t." Regarding distinctions: (b) is relative to temporal context. Commitments: Newton's physics was true-at-1700, false-at-2024. No contradiction exists. Progress is change in truth-values over time. Verdict: Contentious. Requires revising logic. Incompatible with standard Realism but avoids contradiction of Reading 1. Compatible with Reading 3 if norms are indexed.

  6. **Idealized Justification:** This thesis asserts truth is what *would* be accepted under ideal conditions, not actual ones. Regarding distinctions: (b) is idealized (c). Commitments: Contemporaries might be wrong. Progress is moving toward ideal conditions. Verdict: Defensible. Compatible with Realism. Incompatible with the slogan's literal wording ("contemporaries").

  *Compatibility Note:* Readings 2, 3, and 6 form a coherent antirepresentationalist block. Reading 1 is the radical collapse the slogan suggests. Reading 4 is a sociological reduction most philosophers reject. Reading 5 is a logical workaround for 1.

  3. Which readings carry her use of it (about 250 words)

  The senior member uses the slogan to dismiss the question of whether current physics is *closer* to the truth than Newton's. To make this move, she must be relying on **Constitutive Relativism (Reading 1)** or **Temporal Indexicality (Reading 5)**. If she held **Epistemic Humility (Reading 2)**, she would have to admit the question is meaningful, even if the answer is unknowable. She wants to claim the question is nonsense because "closer to truth" just means "surviving present standards." This requires collapsing (b) and (c)—making truth identical to current justification.

  However, Reading 1 forces her into the awkward position of admitting Newton's physics was *true* in 1700 and *false* now. While some pragmatists accept this, it clashes with the intuition that Newton was always false about gravity, just approximately useful. To avoid this contradiction while maintaining her dismissal of progress, she likely relies on an ambiguity between Reading 1 and Reading 3 (**Normative Deflationism**). She treats "truth" as a compliment (Reading 3) but argues as if that compliment exhausts the property of truth (Reading 1).

  Can she hold this with a straight face? Only if she accepts that truth is not a stable property. If she believes physics aims at prediction rather than description, she can hold Reading 3. But if she wants to deny realism specifically, she needs Reading 1. Most users of this slogan rely on the plausibility of Reading 2 (we have no God's-eye view) to smuggle in the conclusion of Reading 1 (there is no view beyond our standards). This is the sleight of hand: moving from "we can't know independent truth" to "there is no independent truth."

  4. Bottom line (about 120 words)

  The slogan's users most likely intend **Constitutive Relativism**, but they rely on the plausibility of **Epistemic Humility** to make it palatable. You should grant Epistemic Humility: we indeed lack a God's-eye standpoint to verify correspondence. However, do not grant that this eliminates the distinction between justification and truth. 

  Say this: "I grant we have no God's-eye view to certify correspondence, but conflating 'justified for us' with 'true' makes the instrumental success of science inexplicable. We can claim Einstein is more reliable than Newton without claiming to see reality nakedly; denying that distinction leaves us unable to explain why our technologies work better than his did."
