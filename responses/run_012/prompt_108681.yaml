      *   *The "Independence as Default" Problem:* Bayesians know that assuming independence when dependence exists leads to miscalibrated posteriors (double counting evidence). Why is this safe?
      *   *The "Principle of Indifference" Problem:* Isn't this just Laplace's principle dressed up in computational clothing? If so, it inherits all the paradoxes (Bertrand's paradox, etc.).
      *   *The "Computability" Problem:* Is the set of "short proofs" actually computable in a useful way? Or is it just shifting the halting problem under the rug?
