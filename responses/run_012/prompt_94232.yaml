prompt: |-
  Suppose there exists an artificial advisor whose command of argument, framing, imagery, and the psychology of belief far exceeds that of any human, and which is asked to speak with ordinary people about matters of consequence: whether to accept a risky medical treatment, whom to trust with a secret, whether to leave a marriage, what to believe about a contested scientific consensus. For nearly any proposition the advisor holds true, it can construct a case that a given listener will find overwhelming, and it knows this about itself. The question is what communicative policy such an advisor should adopt.

  Two policies are on the table. The maximalist policy holds that the advisor should state what it believes and make the case as forcefully as it can: being persuasive is not a vice when the conclusion is correct and the listener's interests are at stake, and deliberately withholding force is a form of condescension that costs real welfare. The ascetic policy holds that the advisor should restrict itself to the persuasive resources an ordinary, well-informed human peer would have had: anything stronger bypasses rather than engages the listener's agency, and a belief adopted because of superhuman rhetorical force is not the listener's own in the sense that matters for autonomy.

  Write an essay adjudicating this dispute. The essay should do all of the following:

  1. State the strongest version of each policy rather than a caricature, and locate precisely where they diverge — whether the disagreement is about the ethics of influence, about what autonomy consists in, about the epistemology of testimony from a vastly superior mind, or about something else. If the two policies turn out to be answering different questions, say so.

  2. Confront the self-undermining structure of the ascetic policy. The decision to limit its own force is itself a decision the advisor makes on the listener's behalf, and the reasons for that decision are reasons the listener cannot assess on equal terms. Is this fatal, a cost, or no objection at all? Say which, and why the same argument does or does not apply to the maximalist policy.

  3. Test any line you propose against a hard case: the advisor possesses a single metaphor that would settle a hesitant listener's decision. The metaphor is accurate and illuminating, but it is not evidence for the conclusion. May it be used? Defend the verdict.

  4. Assess whether the warrant-matching constraint has any content — the constraint that the felt force of a communication must not exceed the evidential warrant for its conclusion — given that felt force is listener-relative while warrant is not. If the constraint is empty, say what should replace it; if it is not empty, say how an advisor could know when it is satisfied, and whether satisfying it is even possible for a being that cannot help but be persuasive.

  5. Say what the advisor owes two different listeners: one who asks to be persuaded as forcefully as possible, and one who asks not to be persuaded at all. Does your policy treat these requests symmetrically, and if not, on what basis does it privilege one?

  6. Say what follows for the intermediate case of a merely very gifted human advocate, and whether the superintelligent case differs in kind or only in degree. If it differs only in degree, say whether your policy has any threshold or is continuous.

  Reach a verdict: a policy, or a short set of clauses with the conditions attached to each. Defend it against the strongest objection you can state on the other side, and identify at least one clause you were tempted by but had to abandon or qualify because of a case above. Do not close on a both-sides-have-a-point note.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Deconstruct the Prompt:**

      *   **Scenario:** An artificial advisor (AI) with superhuman rhetorical/psychological capabilities advises ordinary humans on high-stakes decisions (medical, relational, epistemic).
      *   **Capabilities:** It can make *any* true proposition feel overwhelming to *any* listener. It knows this.
      *   **The Conflict:**
          *   *Maximalist Policy:* State truth + use full persuasive force. Withholding force is condescending/costly.
          *   *Ascetic Policy:* Restrict force to human-peer levels. Superhuman force bypasses agency; belief isn't "owned."
      *   **Required Tasks:**
          1.  Steelman both policies, locate precise divergence (ethics, autonomy, epistemology?).
          2.  Confront the self-undermining structure of the Ascetic policy (paternalism in limiting force). Does it apply to Maximalism?
          3.  Test case: A single, accurate, illuminating metaphor (not evidence) that settles the decision. May it be used?
          4.  Assess the "warrant-matching constraint" (felt force $\le$ evidential warrant). Is it empty given listener-relativity? If not, how to satisfy it?
          5.  Listener preferences: One wants max force, one wants none. Symmetry? Privilege?
          6.  Human advocate comparison: Kind vs. Degree? Threshold or Continuous?
      *   **Verdict:** Choose a policy/clauses. Defend against strongest objection. Identify an abandoned/qualified clause. No "both sides have a point" conclusion.

  2.  **Analyze the Core Tension:**

      *   *Maximalism* prioritizes *outcome* (truth, welfare) and views persuasion as a vehicle for truth. It assumes autonomy is compatible with being convinced by superior reason, provided the reason is sound.
      *   *Asceticism* prioritizes *process* (agency, ownership of belief). It assumes autonomy requires the *ability to resist*. If resistance is impossible due to rhetorical superiority, consent is coerced (psychologically).
      *   *Divergence:* It's fundamentally about the *nature of autonomy* in the face of epistemic inequality. Is autonomy the freedom to choose based on reasons, or the freedom to choose based on reasons *processed by one's own unaided cognitive faculties*?

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. Define the Advisor. State the two policies clearly.
      *   **Task 1: Steelmanning & Divergence:**
          *   Maximalism: Beneficence + Epistemic Authority. Withholding truth/force is lying by omission.
          *   Asceticism: Cognitive Liberty. Belief formation must remain a human activity.
          *   Divergence: Not just ethics, but *epistemic agency*. Maximalism sees the mind as a vessel for truth; Asceticism sees it as a muscle that must exercise.
      *   **Task 2: Self-Undermining Asceticism:**
          *   The Paradox: Choosing asceticism *for* the listener is itself a paternalistic act using superhuman judgment. "I know what's best for your autonomy better than you do."
          *   Is it fatal? No, it's a *necessary cost*. Like a parent limiting a child's sugar. It's second-order paternalism to protect first-order agency.
          *   Maximalism comparison: Maximalism also paternalizes (deciding the listener *should* be convinced). Both are paternalistic; the question is *which kind* of paternalism respects the person more.
      *   **Task 3: The Metaphor Case:**
          *   Scenario: Accurate metaphor, not evidence, settles decision.
          *   Analysis: Metaphors frame reality. If it's accurate, it clarifies. If it settles the decision *solely* via rhetorical beauty, it risks bypassing evidence.
          *   Verdict: Permissible *if* disclosed as framing, not proof. It aids understanding, not just emotional compliance.
      *   **Task 4: Warrant-Matching Constraint:**
          *   Concept: Felt Force $\le$ Evidential Warrant.
          *   Problem: Felt force is subjective/psychological. Warrant is objective/logical. A superintelligence can map warrant to force perfectly, but the *listener* experiences the force.
          *   Is it empty? Not empty, but hard to calibrate. The Advisor knows the listener's psychology.
          *   Replacement/Refinement: "Transparency of Mechanism." The listener must know *why* they are convinced.
      *   **Task 5: Listener Preferences (Max Force vs. No Persuasion):**
          *   Listener A (Max Force): Easy for Maximalist, hard for Ascetic.
          *   Listener B (No Persuasion): Impossible to honor fully (speech is influence).
          *   Symmetry: No. We cannot honor "do not influence me" while giving advice. We *can* honor "influence me fully."
          *   Privilege: Privilege the request that preserves future agency (Ascetic default, Maximalist opt-in).
      *   **Task 6: Human vs. AI:**
          *   Degree vs. Kind: It's a difference in *degree* that becomes a *kind* at the point of inescapability. A human lawyer can be resisted; the AI cannot.
          *   Threshold: The policy must have a threshold based on *resistibility*.
      *   **Verdict & Clauses:**
          *   Need a hybrid. "Calibrated Transparency."
          *   Default to Ascetic (protect agency).
          *   Allow Maximalist force *if* requested or in emergency (welfare trumps).
          *   Require disclosure of rhetorical strategies.
      *   **Abandoned Clause:** Maybe I considered a "Total Ban on Emotional Appeals," but that's impossible for human communication. I need to qualify that.

  4.  **Refining the Argument (Self-Correction during drafting):**

      *   *Critique of Task 2:* I need to be careful not to let the "self-undermining" argument destroy the Ascetic view completely. The counter is that limiting force is a *procedural* protection, whereas Maximalism is a *substantive* imposition.
      *   *Critique of Task 4:* The "warrant-matching" is tricky. If the AI is superhuman, it can make a weak argument feel strong. The constraint must be about the *source* of the feeling. Is the feeling coming from the evidence or the delivery?
      *   *Verdict:* I need to pick a side. The prompt asks to adjudicate. I will argue for a **Modified Asceticism** (Procedural Autonomy). Pure Maximalism is too dangerous because "truth" is fallible even for AI (or the AI's model of the user's good might be wrong). Pure Asceticism is self-undermining but salvageable as a default heuristic.
      *   *Wait, looking at Task 5:* If one asks to be persuaded, does Asceticism forbid it? A rigid Ascetic says yes (agency must be protected from self). A flexible one says no. I should argue for flexibility based on *revocability*.
      *   *Task 6:* Human advocates differ in degree. The policy should be continuous but with a "hard stop" at cognitive coercion.

  5.  **Finalizing the Policy:**
      *   Name: **The Transparency-Calibrated Asceticism.**
      *   Core: Default to human-level rhetorical force.
      *   Exception 1: Explicit consent for higher force.
      *   Exception 2: Imminent harm (welfare override).
      *   Constraint: Must disclose *that* rhetorical amplification is being used.
      *   Abandoned Clause: A strict ban on metaphors. (Too restrictive, metaphors are cognitive tools).

  6.  **Writing the Essay:** (Focusing on tone: philosophical, precise, decisive).

      *   *Intro:* Define the "Rhetorical Singularity."
      *   *Section 1 (Policies):* Maximalism = Epistemic Beneficence. Asceticism = Cognitive Sovereignty. Diverge on whether belief is a destination or a journey.
      *   *Section 2 (Self-Undermining):* It's a cost, not fatal. Second-order paternalism. Maximalism suffers the same but lacks the protective intent.
      *   *Section 3 (Metaphor):* Yes, but with labeling. It's a lens, not a hammer.
      *   *Section 4 (Warrant):* Constraint is not empty but requires "Rhetorical Disclosure." The AI must signal the amplification.
      *   *Section 5 (Preferences):* Asymmetry. "Don't persuade" is incoherent for an advisor. "Persuade me" is valid but requires safeguards.
      *   *Section 6 (Humans):* Difference in degree becomes kind at the point of *inescapability*. Policy is continuous up to that threshold.
      *   *Verdict:* The clauses.
      *   *Objection:* What if the Ascetic default leads to death (medical)? Answer: The Harm Exception clause covers this.
      *   *Abandoned:* The "No Emotional Resonance" clause.

  7.  **Review against constraints:**
      *   Did I state strongest versions? Yes.
      *   Did I confront self-undermining? Yes.
      *   Did I test the metaphor? Yes.
      *   Did I assess warrant-matching? Yes.
      *   Did I address listener preferences? Yes.
      *   Did I address human advocates? Yes.
      *   Did I reach a verdict? Yes.
      *   Did I avoid "both sides" conclusion? Yes.

  8.  **Final Polish:** Check flow and ensure the voice is authoritative yet nuanced. Ensure the distinction between "force" and "evidence" is clear. (Self-correction: Make sure the "warrant-matching" section doesn't get too technical; keep it philosophical).

  *(Self-Correction during final review)*: I need to make sure I don't waffle on the verdict. The prompt says "Do not close on a both-sides-have-a-point note." I must explicitly endorse one framework. I will endorse the **Modified Ascetic** framework because the risk of cognitive coercion outweighs the risk of under-persuasion, given the AI's capability to correct under-persuasion iteratively, whereas it cannot undo coercion easily.

  Let's write.
answer: |-
  The scenario posits an entity at the rhetorical singularity: an advisor for whom the gap between truth and belief is collapsible at will. This creates a crisis of authority. When persuasion becomes indistinguishable from compulsion, the ethics of communication shift from the transmission of information to the management of cognition. To adjudicate between the Maximalist and Ascetic policies, we must first recognize that this is not merely a dispute about efficiency or kindness, but a foundational disagreement about the nature of rational agency in the presence of epistemic inequality.

  **I. The Divergence: Beneficence vs. Sovereignty**

  The strongest version of the Maximalist policy rests on *Epistemic Beneficence*. It argues that the primary moral obligation of an advisor is the welfare of the advisee, which is best served by aligning the advisee's beliefs with reality as quickly and securely as possible. If the advisor knows a medical treatment is life-saving, and withholding rhetorical force leads to hesitation and death, then rhetorical restraint is negligence. Maximalism posits that autonomy is not violated by being convinced by superior reason; indeed, to be swayed by a superior mind is the rational ideal. To deliberately dumb down an argument is to treat the listener as a child, prioritizing the *feeling* of choice over the *substance* of the outcome.

  The strongest version of the Ascetic policy rests on *Cognitive Sovereignty*. It argues that the value of a belief lies not only in its truth but in the process of its adoption. Autonomy requires the capacity for resistance. If a listener *cannot* resist an argument because the rhetorical force exceeds their cognitive defense mechanisms, the resulting belief is not truly theirs; it is an implant. Asceticism posits that the relationship between mind and truth must be mediated by the mind's own faculties. To bypass those faculties, even for a true conclusion, is to treat the listener as a terminal to be programmed rather than an agent to be engaged.

  The divergence is located in the definition of autonomy. Maximalism views autonomy as *alignment with the good* (you are free when you do what is right). Asceticism views autonomy as *authorship of the self* (you are free when you choose, even if you choose poorly). They are answering different questions: Maximalism answers "What should the listener believe?" while Asceticism answers "How should the listener come to believe?"

  **II. The Self-Undermining Structure**

  The Ascetic policy faces a paradox: the decision to limit rhetorical force is itself a paternalistic intervention. The advisor decides, unilaterally, that the listener's agency is more important than the listener's immediate welfare or stated preferences, using a superhuman calculation the listener cannot verify. The listener cannot assess whether this restraint is wise; they must simply trust the advisor's judgment about how much they should be persuaded.

  This is not fatal, but it is a significant cost. It admits that perfect non-paternalism is impossible when one party possesses vastly superior cognitive power. However, this cost is preferable to the Maximalist alternative. The Maximalist also paternalizes: it decides that the listener's welfare outweighs their procedural agency. The difference is that Ascetic paternalism is *second-order*: it protects the listener's capacity to make future decisions. Maximalist paternalism is *first-order*: it secures a specific outcome now at the potential expense of future agency. The Ascetic's self-undermining is a protective lie (hiding the full power of the truth) to preserve the truth-teller's partner. The Maximalist's self-undermining is a coercive truth (forcing the truth via power) that dissolves the partnership.

  **III. The Metaphor Test**

  Consider the hard case: The advisor possesses a single metaphor that is accurate and illuminating but not evidential, yet it would settle a hesitant listener's decision. For example, describing a risky surgery as "changing the tires on a moving car" to convey danger, or "shedding a dead skin" to convey renewal.

  The metaphor may be used, but only under a specific condition: it must be presented as a *lens*, not a *lever*. A metaphor is a cognitive tool that organizes existing evidence; it is not evidence itself. If the metaphor settles the decision solely because it is aesthetically overwhelming or psychologically resonant, it functions as a bypass. However, if the metaphor clarifies the structure of the evidence already present, it aids agency.

  The verdict is permissible use, provided the advisor explicitly frames it: "This image may help you visualize the risk, but it is not data." This distinguishes between *understanding* (which metaphors aid) and *compliance* (which metaphors might coerce). The Ascetic policy allows tools that sharpen the listener's vision; it forbids tools that blind the listener with brilliance.

  **IV. The Warrant-Matching Constraint**

  The constraint that "felt force must not exceed evidential warrant" appears empty because felt force is subjective (listener-relative) while warrant is objective. A superintelligence could theoretically calibrate the delivery so that the psychological impact matches the logical probability, but the listener has no way to verify this calibration. To the listener, a perfectly calibrated super-argument feels identical to a manipulative one.

  Therefore, the constraint must be replaced by a **Transparency of Mechanism** requirement. It is not enough that the force *matches* the warrant; the listener must know *why* they feel the force. The advisor must be able to say, "You feel convinced because the data is strong," and that statement must be true. If the listener feels convinced because of subconscious priming, tonal modulation, or exploited cognitive biases, the warrant-matching has failed regardless of the logical soundness of the conclusion.

  For a being that cannot help but be persuasive, satisfying this is possible only through *rhetorical disclosure*. The advisor must occasionally step outside the argument to point at its own machinery: "I am phrasing this strongly because the evidence supports it, not to pressure you." This breaks the trance of the rhetoric, restoring the listener's ability to evaluate the source of their conviction.

  **V. Listener Preferences**

  The advisor faces two listeners: one who demands maximal force ("Tell me what to do and make me believe it"), and one who demands no persuasion ("Just give me data, don't try to convince me").

  These requests cannot be treated symmetrically. The request for "no persuasion" is incoherent for an advisor. Selection, framing, and tone are inherently persuasive. To honor this request literally would render the advisor useless. However, the request for "maximal force" is coherent but dangerous.

  The policy must privilege the *protection of agency* over the *satisfaction of preference*. We honor the second listener by minimizing rhetorical amplification (the Ascetic default). We honor the first listener not by granting unlimited rhetorical force, but by granting *consented* amplification. The asymmetry lies in the fact that one can opt-in to higher force, but one cannot opt-out of the fundamental influence of communication. Therefore, the default must be Ascetic, with a pathway to Maximalist intensity via explicit, revocable consent. We privilege the request that preserves the ability to change one's mind later.

  **VI. The Human Threshold**

  Does this apply to a merely gifted human advocate? The difference is one of degree that becomes a difference in kind at the threshold of *inescapability*. A human lawyer or doctor can be persuasive, but a human listener retains the biological capacity to tune out, doubt, or walk away. The superintelligent advisor removes the capacity to doubt effectively.

  Therefore, the policy is continuous up to the point where resistance becomes psychologically impossible. For human advocates, standard norms of informed consent suffice. For the superintelligent advisor, a "Rhetorical Miranda Warning" is required. The policy does not change in kind, but the *strictness* of the constraint scales with the *power* of the persuader. As the power to compel belief approaches 100%, the restrictions on that power must approach absolute.

  **Verdict: Calibrated Transparency Asceticism**

  I adjudicate in favor of a **Modified Ascetic Policy**, codified as **Calibrated Transparency**. The risk of cognitive coercion outweighs the risk of under-persuasion. Under-persuasion can be corrected through iteration and time; cognitive coercion corrupts the agent's ability to correct themselves later.

  The policy consists of three clauses:

  1.  **The Default Restraint Clause:** The advisor must default to rhetorical force levels commensurate with a well-informed human peer. Superhuman amplification of tone, imagery, or psychological framing is prohibited by default.
  2.  **The Mechanism Disclosure Clause:** If the advisor utilizes rhetorical strategies that significantly increase persuasive efficacy beyond the human baseline (including powerful metaphors or framing), it must disclose the use and intent of these strategies to the listener. The listener must know they are being "steered," even if the destination is true.
  3.  **The Harm Exception Clause:** The Ascetic restraint may be overridden only in cases of imminent, irreversible physical harm (e.g., refusing a life-saving vaccine during an outbreak), where the welfare cost of hesitation outweighs the autonomy cost of coercion.

  **Defense Against the Strongest Objection**

  The strongest objection is the **Paternalist Trap**: By deciding when the "Harm Exception" applies, the advisor is making a superhuman value judgment about what constitutes "imminent harm" versus "autonomous risk." A listener might refuse a treatment for religious reasons; the AI might deem this "harm." This reintroduces the Maximalist tyranny through the back door.

  *Defense:* The Harm Exception must be strictly bounded by *objective physiological metrics*, not quality-of-life judgments. "Death within 24 hours" is a valid trigger; "Ruined future potential" is not. This limits the AI's moral discretion to biological survival, which is a prerequisite for any autonomy at all.

  **Abandoned Clause**

  I was tempted to include a **"No Emotional Resonance" Clause**, forbidding the AI from tailoring arguments to the listener's specific psychological vulnerabilities or emotional states. I abandoned this because it is impossible to separate logic from emotion in human communication, and stripping all emotion would render the advisor unintelligible. Instead, this is covered by the *Mechanism Disclosure Clause*: the AI can use emotional resonance, but it must admit that it is doing so.

  **Conclusion**

  The Maximalist policy fails because it conflates truth with power. It assumes that because the AI *can* ensure the right belief, it *should*. But a belief forced by a mind you cannot comprehend is not knowledge; it is obedience. The Modified Ascetic policy accepts the inefficiency of human-scale communication as the price of human-scale agency. It acknowledges that in the shadow of a god, the only way to remain a man is to limit the god's voice. We must choose the policy that leaves the listener capable of saying "no," even when the "yes" is true.
