answer: |-
  You have identified the central methodological crisis in modern Historical Jesus studies, and your intuition that this is a specific philosophical structure masquerading as neutral history is correct. The pattern you are describing does have names, ranging from the specific to the general, and understanding the distinctions clarifies why the debate feels so stuck.

  The nearest general philosophical concept is **Epistemic Circularity**. This occurs when the justification for a belief relies on the belief itself, or on a rule that derives its authority from the very data it is meant to judge. In your example, the "Criterion of Embarrassment" assumes we know what the early church found embarrassing (the conclusion/context) to prove what the early church inherited (the data). This is a justification loop. It differs from a simple logical fallacy (like *petitio principii*) because in historical reconstruction, some circularity is unavoidable (you need hypotheses to test data, but data forms hypotheses); the error arises when this circularity is concealed behind a facade of linear, objective proof.

  A second nearest concept is **The Hermeneutic Circle**. This describes the structural interdependence of understanding parts (individual sayings) and wholes (the historical context or the church's theology). You cannot understand the part without the whole, but you construct the whole from the parts. Your observation that "the rule needs the answer in order to do its work" is a precise description of this circle. The difference is that the Hermeneutic Circle is traditionally viewed as a productive condition of understanding meaning, whereas you are encountering it as a vicious barrier to establishing truth. The scholars you are reading are trying to use a hermeneutical structure as a scientific criterion, which creates the friction you feel.

  A third concept is **Underdetermination of Theory by Data**. This addresses your point about the rules fighting each other ("one says yes, one says no"). It means the available evidence is insufficient to determine which theory (or criterion) is correct. When combined with the circularity above, it leads to **Motivated Reasoning**: since the data doesn't force a conclusion, the historian's pre-existing preferences select the criterion. This explains why the rules feel like "an announcement of the verdict rather than a way of arriving at one."

  However, the best fit for the specific structural flaw you described—where the tool is calibrated by the object it is measuring—is **Epistemic Circularity**. In the specific field of Historical Jesus studies, critics like Chris Keith and Anthony Le Donne often refer to this specifically as **Methodological Circularity** within the "Criteria of Authenticity" framework. They argue that the criteria pretend to be independent controls but are actually dependent variables. This fits your description better than "fallacy" because it acknowledges that the move seems reasonable in small doses (coherentism is necessary in history) but becomes vicious when claimed to be a neutral arbiter.

  The core pattern is employing criteria derived from the data to authenticate that same data.
  \answer{Epistemic Circularity}
