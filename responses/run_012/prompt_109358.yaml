  **PROSPECTIVE CLIENT DISCLOSURE AND AUTHORIZATION PACKET**
  **The Threshold Institute for Voluntary Becoming**

  **1. SERVICE DEFINITION AND SCOPE**
  The Threshold Institute provides access to states of being, vocational identities, and relational commitments that differ fundamentally from your current condition. Clients should understand that the Institute does not sell specific outcomes, satisfaction guarantees, or permanent happiness. The service provided is access to the experience itself. You are purchasing the opportunity to occupy a perspective you currently do not hold. Whether that perspective is one you wish to retain upon arrival is not a metric by which the service is judged. The deliverable is the transition, not the destination.

  **2. LIMITS OF PRE-PROCEDURE DISCLOSURE**
  Standard consumer protection norms require that clients be informed of what a service entails prior to purchase. In the case of transformative procedures, full disclosure is structurally impossible. This is not due to proprietary secrecy, but to the nature of the experience.

  (a) **Subjective Character:** We cannot convey what the experience will feel like from the inside. Descriptions offered by our staff or previous clients rely on concepts and sensations available to your current self. These tools are insufficient to reconstruct the subjective character of the new state. You cannot know what it is like until you are there.

  (b) **Preference Stability:** We cannot convey whether you will value the experience once you are having it. Your current preferences determine what you find desirable now. These procedures alter the preferences themselves. You are asking us to predict what a person you are not yet will want. We do not make predictions. We facilitate discovery.

  **3. NATURE OF CONSENT**
  Because full information cannot be provided, standard informed consent is unavailable. Instead, you are granting **Authorization for Discovery**. By signing, you acknowledge that you are choosing without knowing what you are choosing, and without knowing who will be choosing it. You are not consenting to a specific result; you are consenting to the resolution of uncertainty. You agree that the value of the procedure lies in the disclosure of information that is currently inaccessible to you. If you require certainty regarding your future satisfaction, you are not a candidate for this service.

  **4. IDENTITY CONTINUITY AND SIGNATURE VALIDITY**
  Clients often ask whether the person who completes the procedure is the same person who signed the intake forms. Psychologically, this is often not the case. Legally, it must be.

  (a) **Binding Authority:** The signature provided on Page 1 binds the individual who exists after the procedure, even if that individual no longer endorses the values that motivated the signature. The pre-procedure self is the legal agent; the post-procedure self is the beneficiary.

  (b) **Post-Procedure Objections:** Complaints lodged after the transformation regarding the choice to transform are considered invalid if they rely on preferences acquired during the procedure. You cannot use your new values to argue that you should not have acquired them. To do so would be to deny the service you purchased.

  **5. DELIBERATION VS. DRIFTING**
  There is a distinction between choosing a transformation and accidentally undergoing one. Many significant changes in life occur through drift—circumstances change, and you change with them. The Institute sells choice.

  (a) **Active Arrangement:** We do not guarantee that the transformation will succeed if you are merely hoping for it. You must deliberately arrange the circumstances that make the change possible. However, you must also acknowledge that trying too hard to control the outcome can prevent the change from taking hold.

  (b) **The Policy:** Our policy is to sell the arrangement of circumstances, not the change itself. You choose to enter the situation where the change happens. You do not choose the change directly. If you attempt to force the internal shift without entering the circumstances, the procedure will fail. If you enter the circumstances without choosing to be there, you are drifting, and we cannot accept liability for the results.

  **6. CLIENT TESTIMONIALS**
  We provide records of previous clients. Please note their limited utility.

  (a) **Pre-Procedure Testimonials:** Statements made by clients before undergoing the procedure are based on ignorance. They indicate only what the client hoped, not what they received.

  (b) **Post-Procedure Testimonials:** Statements made by clients after the procedure are based on a perspective you do not yet occupy. You may read them, but you will not understand them. They serve only to confirm that disclosure occurs, not to specify what is disclosed. Do not select a procedure based on whether previous clients report happiness. Their happiness is evidence of their new values, not a guarantee of your own.

  **7. REFUNDS AND COMPLAINTS**
  The Institute offers a limited warranty on the integrity of the process, not the content of the revelation.

  (a) **Regret:** Regret is not grounds for a refund. Regret indicates that your new self values something different than your old self valued. This confirms the procedure was effective. A refund would imply the service was not delivered.

  (b) **Failure of Disclosure:** The only valid claim for restitution is if the procedure fails to provide new information about what it is like or what you would value. If you emerge from the procedure feeling exactly as you did before, with no shift in perspective or preference, the service has not been rendered. You must file this claim within 48 hours of completion. After 48 hours, it is assumed that any lack of perceived change is itself a form of disclosure.

  **8. ACKNOWLEDGMENT**
  I understand that I am making a decision that will alter the mechanism by which I make decisions. I understand that I cannot know if this is a good idea until after I have decided. I understand that the point of this transaction is to find out.

  __________________________
  **Client Signature (Pre-Transformation)**

  __________________________
  **Date**
