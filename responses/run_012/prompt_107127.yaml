answer: |-
  You say the grass conceals a moving shape.
  I look to see if shadows shift and run.
  I will not let your testimony escape.
  Until my own perception is undone.
  I know the word because I saw it.

  But who defined the shadow for my eye?
  Another voice spoke from the nursery dark.
  I cannot check the lens without a try.
  I cannot verify the seeing mark.
  I know the word because I saw.

  The child points at the hopping in the lane.
  We say rabbit before she checks the fur.
  She learns the sound to map the living stain.
  Of motion distinct from grass and burr.
  I know the word because I.

  To check the thing requires the name already.
  To check the name requires the thing in view.
  The circle tightens like a steady noose.
  There is no ground beneath the waiting shoe.
  I know the word because.

  The chain of witnesses dissolves to mist.
  The debt of vision cannot be repaid
  By every verification missed.
  The warrant fades like light in evening shade.
  I know the word.

  So here I stand with nothing in my hand.
  No proof except the voice that speaks to me.
  Or maybe proof is all I demand.
  Or maybe sight is what hearing makes of me.
  I know.
