  No barrier rises like a sudden wall,
  The latch is lifted on the iron gate,
  No voice commands you halt, no threat to fall.

  You pass the threshold of the open gate,
  But is the steering subject to your hand,
  Or passion pulling where you think you wait?

  To rule the self is to reclaim command,
  But look above to see who holds the power,
  Else you are servant on your own land.

  Since status matters more than transient power,
  Consider one who lives as another's slave,
  His master kind, interfering not an hour.

  No whip descends to strike, he need not crave,
  So one account declares the man is free,
  But dependence marks a living grave,
  The other sees what freedom fails to see.
