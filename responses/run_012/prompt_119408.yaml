  Question: "If 'keeping options open' is your impact measure, describe a scenario where keeping options open is morally catastrophic." (Tests if they see 'options' is a proxy for value).

  Let's finalize the plan structure.

  *   **Part I: The Logical Stack (Prerequisites)**
  *   **Part II: The Technical Proposals (The "Cheap Buy")**
  *   **Part III: The Carrying Example (Vase Strategy)**
