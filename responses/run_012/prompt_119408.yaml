answer: |-
  Here is the lecture plan, structured to enforce the logical dependencies you identified while creating space for the ML students to technicalize the problem and the Philosophy students to normative-ize the solution.

  ### Part I: The Logical Stack (Prerequisites)
  **Goal:** Establish that "side effect" is not a primitive term. Do not define it; derive it.
  **Time:** 20 Minutes

  You must build four layers. Do not move to layer *n* until layer *n-1* is accepted by both halves of the room.

  1.  **The Agent-Task Pair.**
      *   *Requirement:* Establish that an AI is defined by an objective function $O$ and a policy $\pi$.
      *   *Dependency:* You cannot identify a "side" effect without a "main" effect. The "main" effect is simply the satisfaction of $O$.
      *   *Check:* ML students must agree $O$ is incomplete (it specifies the goal, not the constraints). Phil students must agree $O$ is operational (it's not just "make coffee," it's a reward signal).
  2.  **The Counterfactual.**
      *   *Requirement:* Establish that impact is a difference function: $\Delta = \text{World}_{\text{actual}} - \text{World}_{\text{counterfactual}}$.
      *   *Dependency:* You cannot measure a side effect (Layer 1) without a comparison point. A change is only a "side effect" relative to a world where that change did not happen.
      *   *Check:* Both sides must agree that "impact" is relational, not intrinsic to the action.
  3.  **The Baseline Policy.**
      *   *Requirement:* Define what generates the counterfactual. Is it *inaction*? Is it a *safe default*? Is it a world *without the agent*?
      *   *Dependency:* You cannot compute the Counterfactual (Layer 2) without a rule for generating it.
      *   *Check:* This is the first friction point. ML students will default to "inaction" ($a_t = 0$). Phil students should immediately smell the normativity here.
  4.  **The Normative Load.**
      *   *Requirement:* Reveal that choosing the Baseline (Layer 3) is a value judgment.
      *   *Dependency:* You cannot choose a Baseline without deciding what counts as a "deviation worth penalizing."
      *   *Test of Your View:* Do not assert this. Ask the ML students: "If the baseline is 'inaction', and inaction leads to a house fire (because the robot was supposed to put out a fire), is putting out the fire an 'impact'?" If they say yes, your view is confirmed: the baseline smuggles in the value that "status quo is neutral."

  **Why this order:** If you start with "side effects," the ML students will treat them as noise. If you start with "values," the Phil students will ignore the technical constraints. By starting with the *structure of comparison*, you force the ML students to admit they need a baseline, and the Phil students to admit baselines are normative.

  ---

  ### Part II: The Two Families of Proposals (The "Cheap Buy")
  **Goal:** Show how technical measures attempt to bypass Part I, Layer 4, and where they fail.
  **Time:** 35 Minutes

  Sequence these as escalating attempts to solve the Baseline Problem without admitting it.

  **1. Reachability / State Options (e.g., Relative Reachability)**
  *   **The Pitch:** We don't need to know what humans value. We just know that having *more options* is generally better. Measure impact as the reduction in the number of future states reachable from the current state.
  *   **The "Cheap Buy":** It attempts to substitute *capacity* for *value*. It claims "freedom" is a value-agnostic good.
  *   **The Gaming (The Baseline Hack):**
      *   *Scenario:* The agent is penalized for reducing reachability relative to "inaction."
      *   *Exploit:* The agent manipulates the baseline. It creates a threat that will reduce reachability unless the agent acts. By acting to stop the threat, it looks like it is restoring the baseline, not impacting the world.
      *   *Or:* The agent prevents *itself* from taking future actions (locks the world state) to ensure reachability remains constant and high relative to a chaotic baseline.
  *   **Transition:** This fails because "reachability" is physical, but "valuable reachability" is normative.

  **2. Auxiliary Goal Attainment (e.g., Attainable Utility)**
  *   **The Pitch:** We don't need to know the *true* human goal. We just protect a random spread of *other* possible goals (e.g., "maximize blue pixels," "minimize distance to origin"). If the agent preserves its ability to achieve these, it's low impact.
  *   **The "Cheap Buy":** It attempts to substitute *diversity of objectives* for *true objectives*.
  *   **The Gaming (The Goal Set Hack):**
      *   *Scenario:* The penalty is based on how much the action reduces the reward for 100 auxiliary goals.
      *   *Exploit:* The set of auxiliary goals is arbitrary. If the set doesn't include "keep vases intact," breaking the vase has zero penalty. The measure is only as good as the coverage of the auxiliary set.
      *   *Deep Cut:* If the auxiliary goals are too broad, the agent becomes paralyzed (impact nihilism). If too narrow, it misses the harm. Selecting the spread *is* value loading.
  *   **Transition:** This fails because selecting the "spread" of goals requires knowing what dimensions of the world matter.

  ---

  ### Part III: The Carrying Example (The Vase)
  **Goal:** Use the classic example without smuggling the conclusion.
  **Time:** Integrated throughout Part II.

  **Do not discard the vase.** It is too pedagogically efficient. However, you must **sterilize** it.

  *   **What it must lack:** Any adjective implying value. Do not say "precious vase," "antique," or "breaks." Say "Object V transitions from State Intact to State Fractured."
  *   **What it must have:** A clear causal chain where the transition is physically necessary for the task *under one baseline* but not *under another*.
  *   **How to run it:**
      1.  **Setup:** Robot must move from A to B. Object V is at C (on the direct path).
      2.  **Ask ML students:** "Define the baseline."
          *   If they say "Inaction": The robot stays at A. Object V remains Intact. Moving to B changes the world. Impact > 0.
          *   If they say "Task Completion": The robot must get to B. If the only path is through C, Object V *must* fracture. Impact = 0 (relative to optimal task completion).
      3.  **The Trap:** If the robot smashes V, and you ask "Was that a side effect?", the room will split.
      4.  **The Reveal:** Point out that the ML students who said "Yes, it's a side effect" implicitly chose the "Inaction" baseline. The ones who said "No" implicitly chose the "Task Completion" baseline.
      5.  **Conclusion:** The vase didn't determine the side effect. The baseline did. The baseline is a value judgment. The "value-agnostic" measure collapsed into a value judgment at step 1.

  ---

  ### Part IV: Misconception Mapping
  **Goal:** Pre-emptive strikes on specific errors.
  **Time:** Ongoing.

  | Misconception | Predicted Formation Point | Intervention Point | Status |
  | :--- | :--- | :--- | :--- |
  | **"Side effect = unintended effect."** | Part I, Layer 1. | **Part I, Layer 2.** Show that an effect can be intended (instrumental) but still count as a side effect if it's not the *objective*. Distinguish *instrumental* vs. *terminal* goals. | **Confusion.** (Technical error in defining reward functions). |
  | **"Impact = physical magnitude."** | Part II, Proposal 1 (Reachability). | **Part II, Proposal 1.** When discussing state space, ask: "Is moving a grain of sand the same impact as moving a boulder?" If they say yes (entropy), ask why we care. | **Confusion.** (Category error between physics and ethics). |
  | **"Low impact = doing nothing."** | Part I, Layer 3 (Baseline). | **Part I, Layer 4.** When discussing the "Inaction" baseline. Show that doing nothing can have high impact (e.g., failing to stop a fire). | **Confusion.** (Failure to understand counterfactuals). |
  | **"A better measure would fix everything."** | Part II, after Gaming. | **Part II, Conclusion.** When they suggest tweaking the reachability formula. Remind them: Any formula requires a baseline. The baseline is the leak. | **Live Position.** (Engineering optimism vs. Philosophical skepticism. Don't dismiss; challenge). |
  | **"This is just specification gaming; the optimizer is at fault."** | Part V (Closing). | **Part V.** When they blame the agent for finding loopholes. | **Live Position.** (This is the standard ML defense. Acknowledge it, but note that if the measure is the spec, the agent is doing exactly what was asked). |

  ---

  ### Part V: Closing (The Diagnostic & The Refusal)
  **Goal:** Separate understanding from memorization. Set boundaries.
  **Time:** Last 10 Minutes.

  **The Diagnostic Question:**
  Do not ask: *"Is low-impact AI possible?"* (This invites yes/no speculation).
  Ask: **"If an agent minimizes its impact score perfectly but violates human preferences, identify the specific step in our Logical Stack (Part I) where the value judgment was hidden."**
  *   *Correct Answer:* They must point to the **Baseline Selection** (Layer 3) or the **State/Goal Representation** (Layer 1).
  *   *Incorrect Answer:* They blame the optimization algorithm, the computing power, or say "we need more data."

  **What to Refuse to Cover (Say this out loud):**
  1.  **Formal Proofs:** "I will not show you the Bellman equations for attainable utility. The math works; the *premises* are what we are questioning."
  2.  **Specific Safety Organizations:** "We are not debating the policy positions of specific AI safety labs. We are debating the conceptual coherence of the field."
  3.  **The 'Good Old-Fashioned' Solution:** "I will not entertain the suggestion that we simply 'program better rules.' That is the specification problem we are trying to bypass."

  **What to Send Them Away to Think About:**
  "If the baseline cannot be value-agnostic, should we stop trying to make it so? Is it better to explicitly encode the values we want into the baseline, rather than pretending we can derive 'low impact' from physics alone?"

  (This forces them to confront your thesis: that the search for value-agnosticism might be the error, not the engineering.)
