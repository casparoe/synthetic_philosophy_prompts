answer: |-
  **Essay Question**

  Critics argue that computationalism is trivial because any physical system can be mapped to any computation via arbitrary state assignment (the "bucket of water" problem). Imagine two neuroscientists who agree on every physical measurement of a brain but disagree on which computation it is running. What constraints must be added to make one mapping correct and the other wrong (e.g., causal individuation, non-gerrymandered states)? Evaluate whether these constraints are principled explanations or ad hoc fixes designed to save the theory from vacuity. Finally, specify what empirical result would count against computationalism once it has been tightened by these constraints.

  ***

  **Model Answer**

  The charge of triviality threatens to render computationalism vacuous. If any physical system can be mapped to any computational description via arbitrary state assignment, then a bucket of water implements the same algorithm as a laptop. This undermines the empirical weight of the claim that the brain is a computer. To salvage the thesis, we must explain what makes one mapping correct and another wrong, specifically in cases where two neuroscientists agree on every physical measurement but disagree on the computational description. This scenario highlights that physical data alone underdetermines computational identity; the raw voltage spikes do not speak their own computational language.

  The primary constraint required to resolve this disagreement is causal individuation combined with structural isomorphism. It is insufficient for physical states to merely correspond to computational states; the causal transitions between physical states must mirror the logical transitions of the computation. If the computational model says state A causes state B, the neural substrate must show a mechanism where physical state A* reliably produces B* through a specific physical mechanism. This rules out gerrymandered mappings where states are grouped disjunctively without causal unity. For example, mapping all states of voltage above 5V to "1" regardless of context is invalid if the causal pathway differs. For the computational description to be real, the physical states must be robust under perturbation; small physical changes should not alter the computational identity unless they cross a functional threshold. This ensures the computation is grounded in the system's actual mechanics, not an observer's imagination.

  However, are these constraints principled or merely glued on to protect the theory? This is the crux of the philosophical debate. If we individuate physical states solely by their causal role within the proposed computation, we risk circularity: we are defining the physical states by the very computation we aim to discover. This makes the claim true by definition rather than empirical fact. Conversely, if we individuate them independently (e.g., by raw voltage levels), we may fail to capture the functional abstraction necessary for computation, as noise might obscure the logical states. Often, proponents shift between these definitions depending on the counterexample, suggesting the constraints are ad hoc safeguards rather than independent criteria. A principled account requires an independent theory of physical individuation that aligns with computational boundaries without presupposing them. Without this, computationalism risks becoming a metaphor rather than a mechanism.

  Once tightened with these constraints, computationalism becomes genuinely falsifiable. An empirical result counting against it would involve systematic cognitive processes that rely on continuous physical properties irreducible to discrete states. For instance, if neural processing depends on precise analog timing or membrane potential magnitudes that lose explanatory power when discretized into bits, the computational model fails. If the brain solves problems using dynamical systems properties that vanish when modeled as symbol manipulation, then the brain is not a computer in the relevant sense. Specific evidence might include finding that cognitive performance scales continuously with physical parameters in ways no discrete algorithm can mimic without infinite complexity.

  Ultimately, computationalism survives the triviality charge only if causal structure constrains mapping. Yet, it remains vulnerable. If the "fixes" required to define the states are too complex or ad hoc, the theory loses its explanatory simplicity. The empirical stake is clear: demonstrate that discretization destroys the phenomenon, and the computational description collapses. The neuroscientists' disagreement is only resolvable if nature privileges one causal structure over another; if not, the computation is in the eye of the beholder.

  ***

  **Marking Scheme (20 Points Total)**

  **1. Articulation of the Triviality Problem (5 points)**
  *   **A (5 pts):** Clearly explains why arbitrary mapping makes the thesis vacuous and explicitly uses the "two neuroscientists" scenario to show physical data underdetermines computation.
  *   **B (3-4 pts):** Explains the mapping problem generally but fails to connect it to the specific disagreement between the neuroscientists.
  *   *Common Mistake:* Reciting Church-Turing thesis details without addressing the individuation problem.

  **2. Proposed Constraints on Mapping (5 points)**
  *   **A (5 pts):** Identifies specific constraints (causal individuation, structural isomorphism, robustness) and explains how they rule out gerrymandered mappings.
  *   **B (3-4 pts):** Mentions constraints vaguely (e.g., "it must be real") without explaining the mechanism of exclusion.
  *   *Common Mistake:* Suggesting that physical measurement alone resolves the disagreement.

  **3. Evaluation of Constraints (Principled vs. Ad Hoc) (5 points)**
  *   **A (5 pts):** Critically analyzes the risk of circularity vs. loss of abstraction; judges whether the fixes are independent or "glued on."
  *   **B (3-4 pts):** Describes the constraints but accepts them as valid without questioning their principled status.
  *   *Common Mistake:* Asserting the constraints are definitely principled without addressing the circularity objection.

  **4. Falsification Condition (5 points)**
  *   **A (5 pts):** Specifies a concrete empirical result (e.g., irreducible analog dynamics) that would falsify the tightened view.
  *   **B (3-4 pts):** Gives a vague condition (e.g., "if the brain doesn't act like a computer") without specifying the physical/computational mismatch.
  *   *Common Mistake:* Claiming computationalism is unfalsifiable even after tightening the constraints.
