answer: |-
  You have independently rediscovered the central problem in the philosophy of mind and cognitive science: **the naturalization of intentionality.**

  The distinction you are looking for is standardly called **Derived Intentionality vs. Original (or Intrinsic) Intentionality.**

  However, that label alone is too static for the dynamic mess you are describing. You are observing the friction between three competing theories of content that engineers have to resolve pragmatically, while philosophers often treat as mutually exclusive metaphysical claims.

  Here is the carving of the phenomenon you asked for, mapping your observations to the established philosophical terrain.

  ### 1. The Core Distinction: Derived vs. Original

  *   **Derived Intentionality:** Content a system has only because an interpreter assigns it. (Your "assigned" kind).
      *   *Examples:* Words, maps, thermostats, chess engines. The word "cat" is not about a cat in virtue of its ink shape; it is about a cat because we use it that way.
      *   *Philosophical Consensus:* Almost everyone agrees artifacts have only derived intentionality.
  *   **Original (Intrinsic) Intentionality:** Content a system has in virtue of its own causal and functional organization, independent of an interpreter. (Your "grounded" kind).
      *   *Examples:* Human beliefs, animal perceptions (arguably).
      *   *Philosophical Consensus:* Highly contested. **John Searle** argues this is a biological feature of brains. **Daniel Dennett** argues this is an illusion; even human "original" intentionality is just very complex derived intentionality.

  **Can the assigned kind exist without the grounded kind?**
  Yes. A map of a fictional city has derived intentionality (we assign it) but no grounded causal link to a real territory.

  **Can the grounded kind exist without an interpreter?**
  This is the battlefield.
  *   **Realists (e.g., Fred Dretske, Ruth Millikan):** Yes. A frog's fly-detector neuron is *about* a fly even if no human is there to interpret it, because of its evolutionary history and causal coupling.
  *   **Skeptics (e.g., Searle, early Putnam):** No. Without a mind to interpret the state, it is just physics. "Syntax is not sufficient for semantics."

  ### 2. Mapping Your Three Sources of Content

  You identified three ways the "about what" question gets settled. Philosophy has names for each, and they are famously in tension.

  #### A. Designer Intent $\rightarrow$ **Teleosemantics**
  *   **The Theory:** Content is fixed by what the system was *selected to do* (its proper function).
  *   **Your Example:** A detector supposed to key on property $X$.
  *   **The Conflict:** If the detector breaks and keys on $Y$, Teleosemantics says it is *misrepresenting* $Y$ as $X$. It still means $X$ because that is its function, even if it fails.
  *   **Weakness:** Struggles with novel systems (like a new AI architecture) that have no evolutionary or design history yet.

  #### B. Actual Tracking $\rightarrow$ **Informational (Covariational) Semantics**
  *   **The Theory:** Content is fixed by reliable causal correlation. State $S$ means $X$ if $S$ is caused by $X$.
  *   **Your Example:** A detector that actually keys on a correlate $Z$ present in the training data.
  *   **The Conflict:** If the system reliably fires for $Z$ (a proxy for $X$), Informational Semantics says the content is *actually* $Z$, not $X$. The designer was wrong about what the system is.
  *   **Weakness:** The **Disjunction Problem** (Jerry Fodor). If a state is caused by $X$ usually, but sometimes by $Y$ (error), is the content "$X$" or "$X \text{ or } Y$"? If it's "$X \text{ or } Y$", the system never makes mistakes; it's always accurate to the disjunction. This eliminates the possibility of error.

  #### C. User Convenience $\rightarrow$ **Interpretivism (The Intentional Stance)**
  *   **The Theory:** Content is fixed by what attribution makes the system's behavior most predictable and sensible.
  *   **Your Example:** Repurposing a subsystem and retaining old meaning by convention, or ignoring a weird correlate because it doesn't help prediction.
  *   **The Conflict:** This is pragmatic, not metaphysical. If treating a thermostat as "wanting" heat makes its behavior predictable, it has beliefs/desires in that context.
  *   **Weakness:** It makes content mind-dependent. If no one is around to interpret the system, does it have content? (Dennett says "who cares?"; Searle says "that's absurd.")

  ### 3. The Specific Pattern You Are Hitting

  You described a pattern: *The content we assign and the content the system's own workings would support come apart, and the assignment quietly follows the interpreter's convenience rather than the machine's.*

  There are two names for this phenomenon, depending on which side of the gap you focus on.

  #### A. The Principle of Charity (Donald Davidson)
  When you interpret a system (or a person), you assign meanings that maximize the *rationality* or *sensibleness* of their behavior.
  *   **Why it matches:** You noted that content gets reassigned to "whichever reading makes the system's behavior come out as sensible rather than arbitrary."
  *   **The Implication:** There is no "fact of the matter" about what the system means independent of this charitable interpretation. If the system behaves *as if* it believes $X$, we assign $X$, even if its internal wiring suggests $Y$.

  #### B. Black Boxing / Functional Abstraction
  In engineering, you ignore the implementation details (the "grounded" causal state) in favor of the interface contract (the "assigned" intent).
  *   **Why it matches:** When you repurpose a subsystem but retain its old meaning by convention, you are treating the internal state as a **Black Box**. You care about the input/output relation, not the internal mechanism.
  *   **The Philosophical Cost:** This creates **Semantic Indeterminacy**. If two interpreters use the same black box for different purposes, the system has two conflicting contents simultaneously. Quine called this the **Indeterminacy of Translation**. There is no physical fact that resolves which interpreter is "right."

  ### 4. Answering Your Ontological Questions

  **Is the difference one of kind or of degree?**
  *   **Searle:** Kind. Brains have biological causality that generates original intentionality; thermostats do not.
  *   **Dennett:** Degree. A thermostat has a tiny bit of intentionality (derived). A human has a vast amount (derived from layers of sub-systems). The "Original" kind is a user-illusion created by complexity.
  *   **Your Experience:** As an engineer, you likely experience it as **degree**. You see the same "assignment" mechanics applied to a simple `if` statement and a Transformer model.

  **What happens when two interpreters assign conflicting content?**
  *   **Philosophical Answer:** Often, **nothing resolves it.** This is the lesson of Quine's *Gavagai* argument. If one team treats a model's activation as "encoding syntax" and another treats it as "encoding semantics," and both predictions work equally well, there may be no fact of the matter about which is true.
  *   **Engineering Answer:** The **Interface Contract** wins. The content is defined by the API documentation, not the weights. If the weights drift (the grounded content changes) but the API holds (the assigned content stays), the system is considered "buggy" but semantically stable until the drift breaks the contract.

  **Can a system have the assigned kind and none of the grounded kind?**
  Yes. This is a **Broken Instrument**.
  *   *Example:* A compass that is magnetically stuck pointing North even when turned.
  *   *Assigned Content:* "Direction of Magnetic North."
  *   *Grounded Content:* "Orientation of the needle relative to the casing."
  *   *Resolution:* We treat it as having the assigned content (it is a *broken* compass) rather than the grounded content (it is a *working* needle-orientation-device). We prioritize the **Teleological** (what it's for) over the **Informational** (what it's doing) because the Teleological view preserves the utility of the object for the user.

  ### 5. Summary of Terms for Your Toolkit

  If you want to search for more on this, these are the handles:

  1.  **Derived vs. Original Intentionality:** The main distinction you sensed.
  2.  **The Disjunction Problem:** The specific issue of a system tracking a correlate ($X$ or $Y$) instead of the target ($X$).
  3.  **The Intentional Stance (Dennett):** The strategy of predicting behavior by treating the system as a rational agent with beliefs/desires, regardless of internal mechanics.
  4.  **Teleosemantics (Millikan):** The theory that content is fixed by evolutionary or design function.
  5.  **Indeterminacy of Translation (Quine):** The idea that physical facts do not fix semantic facts; multiple interpretations can be equally valid.
  6.  **Instrumentalism:** The view that theories (or content attributions) are tools for prediction, not descriptions of reality. This matches your observation that we assign content based on "convenience."

  ### The Verdict on Your Observation

  You are describing **Instrumentalism about Content** clashing with **Realism about Mechanism.**

  Philosophy has not "solved" this; it has codified the tension. The standard view in cognitive science (largely thanks to Dennett) is increasingly aligning with your engineering intuition: **Content is a compression algorithm.**

  We assign "aboutness" to internal states because it is computationally cheaper for *us* (the interpreters) to model the system as having beliefs about $X$ than to simulate its causal physics. When the causal physics diverge from the belief (the correlate problem), we usually stick with the belief assignment as long as the compression holds. When the prediction error gets too high, we update the assignment (re-training, refactoring, or declaring the unit "broken").

  The "aboutness" is not in the machine. It is in the interface between the machine and the model you build of it.
