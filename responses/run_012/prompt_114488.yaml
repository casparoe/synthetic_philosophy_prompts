answer: |-
  # Q&A Preparation Sheet: Hobbes's Later Mathematics

  **Thesis:** Hobbes's mathematical controversy with Wallis is not senile stubbornness but a continuation of the *Leviathan* project: geometry as the only model of science that compels assent without recourse to authority.
  **Audience:** 12 participants (6 Hobbes/Intellectual Historians, 2 Math Historians, 1 Royal Society Historian, 3 Generalists).

  ---

  ### 1. The "Political Vendetta" Objection
  **Who:** A Hobbes Specialist / Intellectual Historian.
  **Likelihood:** Very High. **Damage:** High (reduces your philosophical thesis to biography).
  **The Question:** "You're framing this as a philosophical commitment to demonstration, but you're downplaying the blood in the water. Wallis wasn't just a mathematician; he was a Presbyterian divine, a Parliamentarian code-breaker, and a founding member of the institution that marginalized Hobbes. By the 1660s, this quarrel is explicitly about Royalist vs. Presbyterian authority. Isn't it simpler to say Hobbes hated Wallis for what he *was*, not for how he did geometry? Doesn't the political venom swallow the philosophical principle?"

  **Your Reply (2 mins):**
  "It is absolutely true that the venom is political. Hobbes does not separate the man from the method. But that is precisely my point. For Hobbes, Wallis's mathematics *is* his politics. Wallis represents the 'University' authority Hobbes attacked in *Leviathan*—a credentialed elite claiming truth based on institutional position and obscure symbols (algebra) rather than plain, visible construction (geometry).
  If Hobbes were merely settling a score, he could have attacked Wallis's theology or his politics directly, which he did. Instead, he spent twenty years on *quadrature*. Why? Because if Wallis is wrong about the circle, the Royal Society's claim to control natural philosophy collapses. Hobbes isn't just attacking a Presbyterian; he is attacking the *epistemic authority* of the Presbyterian university system. The personal hatred fuels the engine, but the philosophical commitment provides the direction. To separate them is to grant Hobbes's opponents the very privilege he denied them: that their social status protects their science from scrutiny."

  **Honest Note on Weakness:**
  *Concede:* That the vitriol often obscures the argument. Hobbes *does* resort to ad hominem attacks that undermine his own claim to rational demonstration.
  *Don't Fight:* Do not claim Hobbes was dispassionate. Claim that his passion was *caused* by the stakes of the epistemic principle.
  *Uncertainty Flag:* I am uncertain if this reply satisfies the historian who sees the Civil War context as primary. If they produce a letter where Hobbes admits he only pursued the math to hurt Wallis personally, this thesis collapses. **Evidence needed:** A private correspondence where Hobbes distinguishes his mathematical belief from his political animus.

  ### 2. The "False Demonstration" Objection
  **Who:** A Historian of Early Modern Mathematics.
  **Likelihood:** High. **Damage:** Critical (undermines the core mechanism of your thesis).
  **The Question:** "You argue Hobbes used geometry as a model of 'demonstrative science whose conclusions compel assent.' But his proofs are wrong. They don't compel assent; they compel rejection. If the goal was a science that forces agreement, and he produced calculations that no competent contemporary accepted, didn't the project fail on its own terms? How can you claim this is a coherent programme of demonstration when the output is demonstrably false?"

  **Your Reply (2 mins):**
  "You are judging the success of the project by the correctness of the conclusion, but Hobbes judges it by the *method of reasoning*. For Hobbes, 'compelling assent' doesn't mean 'getting the right answer by modern standards'; it means 'constructing a chain of reasoning where every link is intuitively visible.' He believes he *has* compelled assent for anyone willing to look without prejudice.
  The failure isn't in his commitment to demonstration; it's in his rejection of the new symbolic tools (algebra) that actually allowed for correct calculation of the infinite. His hostility to algebra isn't mathematical conservatism; it's philosophical. Algebra, for Hobbes, is 'reckoning without understanding'—manipulating symbols you can't visualize. So, yes, the proofs fail. But the *refusal to concede* is the point. To concede to Wallis is to concede that authority (the Royal Society's consensus) trumps individual rational inspection. He would rather be wrong on his own terms than right on theirs."

  **Honest Note on Weakness:**
  *Concede:* That this makes Hobbes look tragic or deluded. You must own that his definition of 'demonstration' is anachronistic and ultimately self-defeating.
  *Don't Fight:* Do not try to defend the math. Do not suggest Hobbes was 'almost right.'
  *Uncertainty Flag:* I am unsure how much damage this does. If the math historian insists that 'demonstration' *requires* truth, your definition of the term might be untenable. **Evidence needed:** A passage where Hobbes defines 'demonstration' explicitly as 'valid reasoning from false premises' (unlikely) or where he admits the possibility of error in first principles.

  ### 3. The "Guild Protection" Objection
  **Who:** The Institutional Historian (Royal Society).
  **Likelihood:** Medium. **Damage:** Medium (sociological reductionism).
  **The Question:** "You're giving Hobbes a lot of philosophical credit for what looks like reputation management. The Royal Society was a self-selecting guild establishing a monopoly on 'legitimate' science. Hobbes was an outsider trying to crash the gate. Isn't this pamphleteering just a boundary dispute? He refuses to concede because conceding means accepting their jurisdiction. Why elevate this to a principle of *Leviathan* rather than just a turf war?"

  **Your Reply (2 mins):**
  "It is a turf war, but for Hobbes, jurisdiction *is* philosophy. The Royal Society's claim to judge what counts as science is exactly the kind of 'authority above reason' that *Leviathan* warns against in the religious sphere.
  If this were merely about reputation, Hobbes could have sought patronage elsewhere or published anonymously. Instead, he publishes under his own name, attacking the specific methods of the guild. He is testing their claim: they say they represent the new science; he says their science is nonsense. If he concedes, he validates their right to judge him. The 'turf' isn't land; it's the right to define truth. My argument is that Hobbes treats the Royal Society's mathematical authority the same way he treats the Church's spiritual authority: as an illegitimate intermediary between the individual mind and reality."

  **Honest Note on Weakness:**
  *Concede:* That Hobbes was desperate for recognition and patronage in his old age.
  *Don't Fight:* Do not deny the sociological element. Integrate it.
  *Uncertainty Flag:* This ranking is uncertain. If the institutional historian has evidence of Hobbes seeking membership or favor *during* the quarrel, it weakens the 'principled outsider' narrative. **Evidence needed:** Records of Hobbes applying for Fellowship or seeking patronage from Society members concurrently with the anti-Wallis pamphlets.

  ### 4. The "Algebra and Infinity" Objection
  **Who:** A Historian of Early Modern Mathematics.
  **Likelihood:** Medium. **Damage:** Low/Medium (technical specificity).
  **The Question:** "You link his hostility to algebra and infinity to his political program. But many contemporaries disliked algebra for purely mathematical reasons—it was obscure, un-geometric, and new. Why does Hobbes's rejection of the infinite have to be about 'authority'? Couldn't it just be that he was an old man who couldn't grasp the new notation?"

  **Your Reply (2 mins):**
  "Generational inertia explains why he struggled, but not why he fought. Hobbes was capable of learning new systems when they suited him. He rejects infinity specifically because it cannot be 'constructed' in the mind. You cannot picture an infinite series. For Hobbes, if you can't construct it, you can't know it.
  This connects directly to his political fear of 'invisible powers'—whether spiritual or mathematical. An infinite quantity is, to Hobbes, a linguistic trick, a 'absurdity' akin to 'incorporeal substance.' It allows the mathematician to claim knowledge of things that don't exist, just as the priest claims knowledge of God's nature. His rejection of algebra is a rejection of a language that allows experts to manipulate symbols the layman (or the Sovereign) cannot verify."

  **Honest Note on Weakness:**
  *Concede:* That Hobbes's understanding of algebra was genuinely limited compared to Viète or Descartes.
  *Don't Fight:* Do not claim he understood algebra better than he did.
  *Uncertainty Flag:* I am uncertain if the political link holds for *infinity* specifically. **Evidence needed:** A text where Hobbes explicitly links mathematical infinity to theological heresy in the later period (1660s-70s), rather than just in *De Corpore*.

  ---

  ### The One Question You Hope Nobody Asks

  **The Question:** "If geometry was the model of science that 'compels assent,' why did Hobbes's political conclusions in *Leviathan* fail to compel assent in exactly the same way? If he had a method for forcing agreement in mathematics, why didn't he apply it to politics to prevent the Civil War? Or did he secretly admit that political 'demonstration' was impossible, making the mathematical crusade a desperate attempt to find a certainty he knew politics lacked?"

  **Why this is dangerous:**
  It exposes the potential fracture in your thesis. If Hobbes's political philosophy is rhetorical/probabilistic (as many historians argue) but his mathematics is supposed to be demonstrative/certain, the parallel breaks. If he *thought* politics was demonstrative but failed, it makes him a failed philosopher. If he *knew* it wasn't, the math fight looks like a displacement activity—a search for certainty he couldn't find in the human world.

  **Preparation:**
  Do not claim *Leviathan* is geometric. Argue that *Leviathan* attempts to be a "civil science" based on first principles of human nature, but acknowledges the variable of human passion. The math fight was his attempt to secure a *foundation* for that science which could not be corrupted by passion. He failed in math, just as he failed in politics, but the *attempt* reveals the unity of his project.

  **Where to Concede:**
  Concede that the mathematical certainty he sought proved elusive even in geometry. The tragedy of his later life is that the one place he thought he could find "compelled assent" turned out to be just as contentious as the political world he fled.
