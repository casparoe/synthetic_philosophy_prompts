          *   ~1 Institutional historian of the Royal Society (skeptical of "more than reputation-management").
      *   **Format:** Q&A preparation sheet.
      *   **Constraints:** Order by likelihood/damage. Phrase objections as the specific questioners would. 2-minute replies. Honest note on weaknesses/concessions. End with the "one question I should be hoping nobody asks." No reading list.
      *   **Specific Instruction:** Where judgment is uncertain, say so and specify what evidence would change the mind.

  2.  **Deconstruct the Thesis & Audience Dynamics:**
      *   *Thesis Strength:* Connects political philosophy to mathematical practice (very trendy/acceptable in intellectual history).
      *   *Thesis Weakness:* Risks being teleological (reading politics into math where there is just stubbornness) or anachronistic (projecting *Leviathan*'s coherence onto later, messier pamphlets).
      *   *The Hobbes Specialists:* Will focus on the *political* implications. Did Hobbes actually say this? Is the timing right? How does this fit with the *Leviathan* vs. *Behemoth* trajectory? They know Wallis was a Presbyterian/Royal Society founder. They will ask about the *political* utility of the math fight.
      *   *The Math Historians:* Will focus on the *technical* failure. If the math is nonsense, does the political motive matter? They might argue Hobbes simply didn't understand the new algebraic methods.
      *   *The Royal Society Historian:* Will focus on *sociology*. Was this just turf war? Status? Patronage? They will resist the "high philosophical principle" interpretation in favor of "institutional power struggle."

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Hobbes Specialists - Most Likely):* The timing and the political context. Wallis wasn't just a mathematician; he was a political enemy (Presbyterian, Parliamentarian). Hobbes's attack on him is political vengeance, not philosophical consistency.
