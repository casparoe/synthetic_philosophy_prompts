      *   *Refining Objection 3 (Institutional):* Make it sound like a sociologist of science. "It's about the Royal Society's monopoly on truth."

      *   *Drafting Replies:* Need to be punchy, 2 minutes max (approx. 250-300 words spoken). Must defend the thesis without denying the facts (e.g., admit the math is wrong, but argue *why* he thought it was right).
      *   *Adding "Honest Notes":* Crucial step. Where is the thesis weak? (e.g., Hobbes's own inconsistency, the sheer vitriol which looks personal).

  5.  **Addressing the "Uncertain Judgment" Instruction:**
