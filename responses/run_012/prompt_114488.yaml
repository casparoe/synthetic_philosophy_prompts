  8.  **Final Polish:** Ensure tone is professional, academic, but direct. (Self-Correction: Make sure the Math Historian's objection doesn't sound *too* technical, as the room is mostly historians, but the Math Historian *is* in the room).

      *(Self-Correction on Objection 1)*: The prompt says half are Hobbes specialists who know Wallis was a Presbyterian. This is the biggest trap. They will say "It's just politics." I need to make sure the reply doesn't deny the politics but subsumes it under the thesis.
