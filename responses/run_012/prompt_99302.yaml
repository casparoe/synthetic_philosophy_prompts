  9.  **(Self-Correction on "Tenure vs Real Issues"):** Be careful not to sound cynical, but acknowledge that some projects generate citations without resolving problems. The "Replication" industry is the prime example of "Tenure but low philosophical payoff." I should advise against pure replication.

