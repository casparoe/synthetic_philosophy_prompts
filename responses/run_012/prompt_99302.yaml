          *   Needs to address "live open questions."
          *   Needs to evaluate upstream impact, tractability (for a hiring committee that doesn't run studies), neglectedness/crowdedness, and success conditions.
          *   Needs to address specific user uncertainties (semantics vs. intuitions, abandonment vs. relativization, universals, epistemology vs. sociology).
          *   Needs honesty about "tenure-getting" vs. "real issue" questions.

  2.  **Deconstruct the Field (Cross-Cultural X-Phi):**
      *   *State of the Art:* The early wave (Knobe, Weinberg, Nichols, Stich) showed variation. The replication crisis hit hard. Many effects are smaller than thought or context-dependent. The field is moving from "Look, variation exists!" to "What does variation *mean* and how do we model it?"
      *   *The "Armchair" Problem:* The committee can't evaluate statistical power or survey design deeply. They need a project that bridges the empirical and the conceptual.
      *   *The "Dean's Mandate":* "Cross-cultural variation in philosophical intuitions." This is broad. It allows for semantic investigation, cognitive science, or normative epistemology.
      *   *The "Postdoc" Constraint:* Needs to publish in *Journal of Philosophy*, *Nous*, *Mind*, etc., not just *Review of Philosophy and Psychology*. This means the output must be *philosophical*, not just data.
      *   *The "Workshop" Constraint:* Needs to interest ethicists/metaphysicians. Pure methodology might bore them. Applied implications are better.

  3.  **Evaluate the User's Uncertainties:**
      *   *Intuitions vs. Semantics:* This is the "Semantic Plasticity" objection (Williamson, Cappelen). It's a major live debate.
      *   *Abandon vs. Relativize:* The "Restrictionist" vs. "Universalist" debate.
      *   *Universals:* Are there deep structures beneath surface variation?
      *   *Epistemology vs. Sociology:* Does this undermine philosophy's truth-tracking ability, or just explain its history?
      *   *Red Herrings:* Some of these are genuine, some are stalled. The "Intuition vs. Semantics" debate is often a verbal dispute unless operationalized.

  4.  **Develop Candidate Projects (Brainstorming):**
      *   *Idea 1: Massive Replication.* (Too boring, already done, low philosophical payoff).
      *   *Idea 2: The Semantics/Pragmatics of Cases.* Investigating whether cross-cultural differences are actually linguistic misunderstandings. (High philosophical payoff, tractable for armchair + linguist).
      *   *Idea 3: Normative Implications.* If intuitions vary, should we weight them differently in moral theory? (Good for ethicists, high stakes).
      *   *Idea 4: Expertise Defense.* Do trained philosophers in different cultures converge even if laypeople don't? (Tractable, addresses the "armchair" anxiety).
      *   *Idea 5: Cognitive Mechanisms.* Why does the variation exist? (Too psychological, might not publish in *Mind*).
      *   *Idea 6: The "Universal" Core.* Searching for invariant structures beneath variation. (High risk, high reward).

  5.  **Select and Refine the Top 3:**

      *   *Candidate 1: The Semantic Plasticity & Case Method Project.*
          *   *Focus:* Distinguishing genuine intuitive disagreement from linguistic/conceptual divergence.
          *   *Why:* Addresses the "Intuition vs. Meaning" worry directly. Involves linguists (workshop). Publishable in general journals (philosophy of language/metaphysics).
          *   *Upstream:* Very high. If cases mean different things, the method of cases is broken.
          *   *Tractability:* High. Postdoc can design surveys testing comprehension + intuition.

      *   *Candidate 2: The Expertise & Convergence Project.*
          *   *Focus:* Do professional philosophers across cultures converge where laypeople diverge?
          *   *Why:* Directly addresses the "Epistemology vs. Sociology" worry. If experts converge, armchair philosophy is safe. If not, we have a problem.
          *   *Upstream:* High. Validates or invalidates current practice.
          *   *Tractability:* Medium-Hard. Hard to sample philosophers globally. But doable.
          *   *Crowdedness:* Somewhat crowded, but new data is always needed.

      *   *Candidate 3: Normative Weighting in Moral Metaphysics.*
          *   *Focus:* How should moral theorists *use* varied intuitions? (Relativism vs. Error Theory vs. Reflective Equilibrium adjustment).
          *   *Why:* Gets ethicists in the room. Moves from "is" to "ought."
          *   *Upstream:* Medium. Changes how theory is built, not necessarily the data itself.
          *   *Tractability:* High (Conceptual work + some data).

      *   *Wait, let's look for something more novel.* The "Expertise Defense" is a bit played out. Let's swap Candidate 2 for something about *Cognitive Mechanisms underlying Variation* but framed philosophically. Or better: *The Stability of Intuitions over Time/Training.*
      *   *Actually, let's go with "The Structure of Variation."* Is it random noise or systematic clusters? This addresses the "Universal" question.
      *   *Better Idea:* **The "Folk Theory" vs. "Philosophical Theory" Gap.** Investigating whether cross-cultural variation in *folk* intuitions actually impacts the *philosophical* theories derived from them. Often, philosophers claim lay intuitions support Theory X, but maybe they don't.
      *   *Let's stick to the strongest philosophical leverage.*
      *   *Selection:*
          1.  **Semantics/Pragmatics of Cases (The "Meaning" Objection).**
          2.  **The Normative Epistemology of Disagreement (What do we *do* with the data?).**
          3.  **The Expertise/Training Defense (Revisited with a twist).**

      *   *Refining the Ranking:*
          *   #1 needs to be the most "upstream." That's Semantics. If the words mean different things, nothing else matters.
          *   #2 needs to be the most "actionable" for the department/field. That's Normative Epistemology.
          *   #3 needs to be the "safety valve" for armchair philosophers. That's Expertise.

      *   *Wait, I need to be honest about "Tenure vs. Real Issues".*
          *   Tenure games: Massive data dumps, minor variations on Knobe cases.
