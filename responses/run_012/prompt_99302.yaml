      *   *Critique:* Make sure to mention the "Armchair" committee's limitation. They need a postdoc who can translate data into arguments.
      *   *Key Insight:* The most valuable thing this money can buy is *integration*. Not more data, but better interpretation of existing + new data for a general audience. The Postdoc should be a "Philosopher of X-Phi," not just an "Experimentalist."

  8.  **Final Polish:** Check constraints. 2-year postdoc. Workshop series. General journals.
      *   *Ordering:* Semantics (Foundational) -> Epistemology (Normative) -> Expertise (Methodological).
