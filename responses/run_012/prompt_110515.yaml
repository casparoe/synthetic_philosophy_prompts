answer: |-
  This is a sophisticated set of intuitions. You are effectively doing what moral philosophers call seeking a state of **reflective equilibrium**: adjusting principles to match considered judgments, and adjusting judgments when they conflict with principles.

  Your intuition about "load-bearing" conventions is close to the truth, but as you suspected, it is too blunt. A shoe rule isn't "load-bearing" for society, yet you feel it is wrong to violate it. A bribe *is* load-bearing for the local bureaucracy (it makes things move), yet you feel it is wrong to follow it.

  Here is a proposed principle that captures your verdicts, refines your distinction, and tests the limits of your intuitions.

  ### The Principle of Reciprocal Practice Integrity

  **Statement:**
  A visitor is morally obligated to adhere to a local convention if and only if:
  1.  **Fairness:** The convention sustains a cooperative scheme from which the visitor benefits, and violating it would constitute "free-riding" (taking the benefit without sharing the burden); OR
  2.  **Coordination:** The convention is necessary for safety or efficiency, and violating it creates friction, risk, or obstruction for others; OR
  3.  **Sovereignty:** The convention governs a private or cultural space where the host has the right to set terms of entry.

  **Unless:**
  4.  **Justice:** The convention violates a universal moral prohibition (e.g., human rights, systemic corruption), in which case there is an obligation *not* to participate.

  **Mitigation Clause:**
  5.  **Epistemic Reasonableness:** "Visitor" status mitigates blame only for *unavoidable ignorance* of the rule. Once the rule is known (or signaled), visitor status ceases to mitigate blame for intentional violation.

  ---

  ### Part 1: Testing Against Your Cases

  Here is how the principle processes your specific verdicts.

  | Case | Your Verdict | Principle's Analysis | Match? |
  | :--- | :--- | :--- | :--- |
  | **Tipping (Normative)** | Wrong (less for visitor) | **Fairness/Respect.** You benefit from service; wages are structured around tips. Violation is free-riding. Visitor status mitigates via Clause 5 (ignorance), but not after learning. | **Yes** |
  | **Tipping (Non-Norm)** | Not wrong (gauche) | **No Obligation.** No local scheme to free-ride on. Violates etiquette, not integrity. | **Yes** |
  | **Queue (Accidental)** | Not wrong | **Clause 5.** Unavoidable ignorance. | **Yes** |
  | **Queue (Refusal)** | Wrong | **Fairness.** Once signaled, you are free-riding on others' patience. Clause 5 removes mitigation. | **Yes** |
  | **Queue (Cutting)** | Wrong | **Fairness.** Intentional free-riding. | **Yes** |
  | **Jaywalking (Common)** | Fine | **No Norm.** If everyone does it, it is the local coordination norm. | **Yes** |
  | **Jaywalking (Frowned)** | Wrong (even if unseen) | **Coordination.** Violates the safety scheme. Even if unseen, it erodes the norm (collective harm). | **Yes** |
  | **Escalator** | Wrong (blocking) | **Coordination.** You are obstructing flow (Clause 2). | **Yes** |
  | **Shoes** | Wrong (more than escalator) | **Sovereignty.** Private home, host sets terms (Clause 3). | **Yes** |
  | **Haggling** | Not wrong (foolish) | **No Obligation.** Paying *more* than required is not free-riding. The seller accepts the price. | **Yes** |
  | **Communal Dishes** | Wrong | **Fairness.** Classic free-rider problem (Clause 1). | **Yes** |
  | **Bribes** | Wrong | **Justice.** Violates Clause 4 (Universal Morality). Local norm is overridden by harm to others. | **Yes** |

  **Does this force you to give up any verdicts?**
  Strictly speaking, no. The principle is calibrated to your inputs. However, it clarifies *why* the Shoe case feels "more wrong" than the Escalator case. The Escalator is about *efficiency* (Clause 2); the Shoes are about *sovereignty* (Clause 3). Violating sovereignty is often felt as a deeper personal insult than causing minor inefficiency.

  ### Part 2: Refining "Load-Bearing"

  You asked if the "load-bearing vs. ornamental" distinction survives. The answer is: **No, but "Constitutive vs. Optional" does.**

  "Load-bearing" implies the structure collapses without the convention. But a society doesn't collapse if you keep your shoes on. However, the *practice* of "visiting a home" is constituted by the host's rules.
  *   **Constitutive Rules:** These define the activity. (e.g., You cannot play chess without moving bishops diagonally; you cannot "visit a home" without respecting the owner's boundaries). Violating these makes you an outsider or a cheater.
  *   **Optional/Expressive Norms:** These enhance the activity but aren't required for it. (e.g., Haggling). You can buy the item without haggling; the transaction still completes.

  Your intuition was correct that some conventions matter more, but the distinction isn't about how much "weight" they hold for society, but whether they are **conditions of participation** in a specific cooperative practice.

  ### Part 3: Predictions for New Cases

  Here is how the principle handles the cases you did not list.

  **1. The Language Barrier (Visitor cannot read a posted rule)**
  *   **Prediction:** Not wrong.
  *   **Reasoning:** Clause 5 (Epistemic Reasonableness). If the rule is posted only in a script you cannot read, and there are no social cues (like others queuing), you cannot be expected to know the constitutive rule. You are excused by ignorance.
  *   **Caveat:** If you see everyone else doing X and you do Y, you lose this excuse.

  **2. The Hypocritical Local (Local violates the convention in front of visitor)**
  *   **Prediction:** Complicated.
  *   **Reasoning:** If a local cuts the queue, does that make it permissible for you?
      *   If the convention is **Fairness** (Queue): No. Their violation is also wrong. You are not obligated to match their wrongdoing.
      *   If the convention is **Coordination** (Jaywalking): Yes. If locals jaywalk, the "local norm" *is* jaywalking. The rule on the sign is dead letter; the living convention is to cross.
      *   *Principle Verdict:* Follow the *living practice*, not the written rule, unless the practice is unjust (Bribes).

  **3. The Moral Conflict (Convention offends visitor's religion/conscience)**
  *   **Prediction:** Not obligated to follow.
  *   **Reasoning:** Clause 4 (Justice) extends beyond "harm to others" to "violation of core moral agency." If a convention requires you to eat forbidden food or bow to an idol, the obligation of Reciprocal Participation is overridden by your duty to moral integrity. However, you may be obligated to *decline participation* rather than *disrupt* (e.g., politely abstain rather than preach).

  **4. The Unexplained Convention (Everyone does it, no one knows why)**
  *   **Prediction:** Obligated to follow provisionally.
  *   **Reasoning:** Precautionary Principle. If a convention is universal but unexplained, it likely serves a Coordination or Sovereignty function you don't understand (e.g., a taboo that prevents disease, or a gesture that prevents offense). Until you know it is harmless, assume it is Constitutive.

  **5. The Scalability Problem (Harmless alone, harmful if all visitors did it)**
  *   **Prediction:** Wrong to violate.
  *   **Reasoning:** This is the **Jaywalking (Frowned On)** case. This tests whether you are a Rule-Utilitarian. The principle says you are obligated because the *practice* relies on general compliance. If you make yourself an exception, you are claiming a privilege not granted to others (Fairness) or risking the collapse of the norm (Coordination).

  ### Part 4: Honest Critique

  You asked for honesty about whether this principle is doing real work or just restating your verdicts, and whether "visitor status" matters.

  **1. Is this just a restatement?**
  There is a risk of "curve-fitting"—creating a principle that perfectly matches your existing data points but predicts nothing new.
  *   **Where it does work:** It successfully unifies the *Bribe* case and the *Shoe* case, which look opposite (one is "don't follow local norm," one is "do follow local norm"). It explains the difference via the **Justice Override** vs. **Sovereignty** clauses.
  *   **Where it might fail:** It relies on your intuition to classify what counts as "Sovereignty" vs. "Coordination." Is a tip "Sovereignty" (host's wage system) or "Fairness" (worker's due)? The principle doesn't decide that; it relies on your prior judgment.
  *   **Verdict:** It is a systematization, not a derivation. It organizes your morals; it does not generate them from scratch. This is normal in ethics (Reflective Equilibrium).

  **2. Does "Visitor Status" matter?**
  This is the most critical philosophical question in your prompt.
  *   **My Argument:** Visitor status is **epistemic, not moral.**
  *   **Explanation:** Being a visitor does not give you a "get out of jail free" card on fairness. If you cut a line, it is equally unfair whether you are a local or a tourist. The harm to the person behind you is identical.
  *   **Why it feels different:** We treat visitors more leniently because we assume they *didn't know*.
  *   **The Principle's Stance:** Clause 5 captures this. Visitor status buys you time to learn, but once you know, you are bound.
  *   **The Exception:** In the **Tipping** case, you said it is "somewhat less wrong" for a visitor. Why? Because tipping is often a *social contract* residents sign into by living there (paying taxes, earning wages). A visitor is a transient participant. They benefit less from the long-term stability of the wage system. So, visitor status *does* slightly reduce the **Fairness** obligation in transient interactions, but not in **Coordination** (Queue) interactions.

  ### Summary Conclusion

  Your gut verdicts are surprisingly robust and align with a **Contractualist** view of ethics: we are bound by rules that no one could reasonably reject as participants in a shared practice.

  *   **Load-bearing** should be replaced by **Constitutive**. (Does this rule make the practice possible?)
  *   **Visitor Status** is primarily an excuse for ignorance, not a license to opt-out of fairness.
  *   **The Bribe Case** proves that local convention is not the source of moral authority; the *function* of the convention is.

  If you adopt the **Principle of Reciprocal Practice Integrity**, you will have to accept one hard truth: In the **Jaywalking (Frowned On)** case, you are wrong even if you are alone and safe. Your obligation is to the *norm*, not the immediate outcome. If you are uncomfortable with that, you may need to shift from a Rule-Based ethic to a Consequence-Based one, but doing so would likely unravel your verdicts on Queues and Dishes as well.
