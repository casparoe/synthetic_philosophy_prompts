      *   *Textual Accuracy:* Machiavelli says Julius II succeeded because his impetuous nature matched the times. He *would* have failed if times required caution. This supports the "no one adapts" point.

  7.  **Final Polish:**
      *   Make sure the "Straight Talk" section is prominent.
      *   Ensure the marking scheme is practical for a tired marker.
      *   Check that the model answer doesn't sound like a journal article but like a very good student script.

  *(Self-Correction during drafting)*: I initially thought about using the France/Spain example, but Julius II is explicitly in Ch. 25, making it a safer "closed book" reference for a student who memorized the chapter. I will stick with Julius II.
