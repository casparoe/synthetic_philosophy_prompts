      *   *Is "fortune responds to character" a stretch?* Not really. "She is a woman... it is necessary, if you want to hold her down, to beat her and strike her down." This implies interaction, not just random occurrence. However, saying fortune *responds* (like a conscious agent) is metaphorical. The stronger reading is that different *types* of crisis require different *modes* of virtù (cautious vs. impetuous).
      *   *Potential Unfairness:* Asking students to resolve a 500-year-old scholarly debate in 45 minutes is risky. The question needs to be framed so that *arguing* for a resolution is more important than *finding* the correct one. The prompt must emphasize *analysis of the tension* over *solving* it definitively.
      *   *Better Fault Line?* Perhaps the tension between *The Prince* and *The Discourses*. In *The Discourses*, institutions (dikes) matter more. In *The Prince*, individual action (boldness) matters more. But sticking to the user's Ch. 25 focus is safer for a single exam question. I will validate the user's intuition but warn about the "closed book" constraint regarding textual evidence.

  3.  **Drafting the Essay Question:**
