      *   **Specific Tension:** The user identifies two conflicting images of fortune in *The Prince* (Ch. 25): the violent river (requires preparation/dikes) vs. the woman (requires boldness/impetuosity).
      *   **Colleague's Counter:** The tension is fake; river = impersonal shocks, woman = human wills.
      *   **User's Skepticism:** This distinction might just relabel the problem, not solve it.
      *   **Task:**
          1.  Write an essay question that forces adjudication of this tension (no reciting summaries).
          2.  Write a model answer (650-750 words, text-based, no secondary lit, includes concrete case).
          3.  Write a marking scheme (out of 20, 5-6 discrete moves with specific "how they muff it" notes).
          4.  **Crucial:** Critique the premise. Is the tension real? Is the "fortune responds to character" reading valid? Is the question unfair?

  2.  **Critique the Premise (The "Straight Talk" Requirement):**
      *   *Is the tension real?* Yes, Chapter 25 of *The Prince* is notoriously contradictory. The river metaphor suggests determinism/mitigation through long-term planning. The woman metaphor suggests agency through immediate, aggressive action.
