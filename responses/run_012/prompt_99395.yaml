          *   *Draft:* David Li's 2000 Gaussian copula model simplified the pricing of Collateralised Debt Obligations (CDOs). It mapped default times of underlying assets to a normal distribution, linked by a single correlation coefficient calibrated to historical data. This allowed banks to slice risk into tranches, pricing senior slices as ultra-safe. The market adopted it widely, relying on the stability of that correlation parameter. When the housing market turned, defaults correlated far more heavily than the model predicted. Senior tranches suffered catastrophic losses, contributing significantly to the 2008 financial crisis. The model assumed stability where there was none.

      *   **The F-twist, stated as fairly as you can (~150 words):**
          *   Need to explain Friedman's instrumentalism. Assumptions don't need to be realistic; predictions do. Define "realistic".
          *   *Draft:* Friedman's instrumentalism argues that the validity of a theory lies solely in its predictive accuracy, not the realism of its assumptions. Indeed, he suggests significant theories often have *wildly* unrealistic assumptions. Here, 'realistic' means descriptively true of the underlying mechanisms. For Friedman, asking if agents *actually* maximise utility is irrelevant; asking if they behave *as if* they do is everything. The theory is a tool, an engine for prediction. If it yields correct predictions within its intended domain, the assumptions are justified. Criticising a model for unrealistic assumptions is, on this view, a category error. The only valid critique is empirical failure. Thus, a model stands until it stops predicting well, regardless of how abstract its machinery might be.

