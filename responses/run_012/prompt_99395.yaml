answer: |-
  **The episode in brief**
  David Li's 2000 Gaussian copula model simplified the pricing of Collateralised Debt Obligations (CDOs). It mapped default times of underlying assets to a normal distribution, linked by a single correlation coefficient calibrated to historical data. This allowed banks to slice risk into tranches, pricing senior slices as ultra-safe. The market adopted it widely, relying on the stability of that correlation parameter. When the housing market turned, defaults correlated far more heavily than the model predicted. Senior tranches suffered catastrophic losses, contributing significantly to the 2008 financial crisis. The model assumed stability where there was none.

  **The F-twist, stated as fairly as you can**
  Friedman's instrumentalism argues that the validity of a theory lies solely in its predictive accuracy, not the realism of its assumptions. Indeed, he suggests significant theories often have *wildly* unrealistic assumptions. Here, 'realistic' means descriptively true of the underlying mechanisms. For Friedman, asking if agents *actually* maximise utility is irrelevant; asking if they behave *as if* they do is everything. The theory is a tool, an engine for prediction. If it yields correct predictions within its intended domain, the assumptions are justified. Criticising a model for unrealistic assumptions is, on this view, a category error. The only valid critique is empirical failure. Thus, a model stands until it stops predicting well, regardless of how abstract its machinery might be.

  **The mapping**
  In this context, the 'assumption' is the Gaussian dependence structure and, crucially, the stability of the correlation parameter. The 'prediction' is the price of the CDO tranches, specifically the implied probability of default for each slice. However, a complication arises: finance models often price arbitrage-free rather than predict physical outcomes. The copula wasn't predicting *when* defaults would happen in a vacuum; it was pricing risk relative to the market. This blurs Friedman's line. For Friedman, a prediction is usually an observable outcome independent of the model. Here, the price *is* the model's output, used to justify capital reserves.

  Yet, embedded in the price is an implicit prediction about tail events. If the model says a senior tranche has a 0.1% chance of default, it predicts stability. The constant-correlation bit is the core assumption Friedman would scrutinise. Is it realistic that human default behaviour follows a normal distribution? No. But Friedman wouldn't care. He would ask: did the prices derived from this assumption match observed default frequencies *at the time*?

  The tricky bit is the domain. Friedman requires predictions to be good within the model's intended scope. If the model was sold as valid only for normal market conditions, it might pass. But it was sold as robust enough to justify AAA ratings. The mapping holds: assumptions (normality, constant correlation) versus predictions (tranche survival rates). The question is whether the failure was a failure of assumption realism or predictive power. Crucially, the model was used to regulate capital. If the prediction fails, the regulation fails. So the 'prediction' is actually about solvency. This makes the stakes higher than standard economic prediction. The assumption of constant correlation is the 'fuel'. The prediction is the 'mileage'. Friedman says don't worry about the fuel type, just check the mileage.

  **Where the F-twist handles it well**
  A strict Friedmanite could argue the copula saga actually vindicates instrumentalism. The critique isn't that the assumptions were unrealistic—everyone knew defaults aren't perfectly normal—but that the model stopped predicting accurately. For years, the model 'worked'; prices were consistent, trades cleared, and defaults remained low. The assumptions were sufficiently 'realistic' for that period. The crash wasn't caused by the unreality of the assumptions per se, but by the extension of the model beyond its empirical validity.

  Friedman would say the sin was not using a simplified correlation parameter, but failing to notice when the predictive power degraded. The market treated the model's output as truth rather than as a contingent prediction. If the model had been treated as a tool valid only while historical correlations held, the disaster might have been contained. The failure was a failure of monitoring predictive accuracy, not a philosophical error in using unrealistic simplifications. The assumptions were always false; the predictions were only temporarily correct. Friedman cares only about the latter. He would argue that discarding the model because assumptions were 'unrealistic' would have halted liquidity unnecessarily during the boom. The tool was useful until it broke. Blaming the tool's design rather than its usage misses the instrumentalist point. The model did exactly what Friedman asked: it predicted well until it didn't.

  **Where it breaks**
  However, the F-twist strains under reflexivity. In finance, models don't just predict the world; they shape it. The copula's adoption *created* the demand for correlated assets, altering the very correlation it measured. Friedman's external validator—empirical testing—becomes impossible when the theory changes the data. Furthermore, 'prediction' in finance often means pricing rare events. The copula failed precisely where it mattered most: the tails. Friedman's methodology struggles with low-frequency, high-impact events where empirical validation is statistically impossible before the crash.

  Additionally, the model wasn't just predicting; it was constructing a reality of risk. A rival account, such as models as 'credible worlds' or isolations, fits better. The copula created an isolated world where correlation was constant. Traders behaved *as if* inside that world. The failure wasn't predictive inaccuracies alone, but the ontological shift where the model replaced reality. When the isolation broke, the bridge collapsed. Friedman assumes a stable world outside the model to test against. In 2008, the model *was* the world. This reflexivity undermines the clean separation between assumption and prediction that instrumentalism requires. You cannot test the prediction against reality when the prediction helps construct that reality. The unrealistic assumption of constant correlation became a self-fulfilling prophecy until it became a self-destructing one. Friedman's framework lacks the vocabulary for this performative feedback loop.

  **What the episode shows about the F-twist**
  This episode reveals the F-twist's vulnerability in social systems where theories are performative. Friedman assumes a distinction between the map and the territory. The copula crisis shows the map can redraw the territory. When assumptions become self-fulfilling prophecies until they suddenly aren't, predictive accuracy is a lagging indicator. The episode suggests that 'realism of assumptions' matters more than Friedman admits, not because truth is virtuous, but because unrealistic assumptions can hide structural fragilities that only reveal themselves when the model's own success undermines them.

  It shows that in complex adaptive systems, you cannot ignore the mechanism. If the mechanism (correlation) is misunderstood, the prediction will fail catastrophically rather than gradually. Friedman's tolerance for unrealistic assumptions works best in stable systems. In fragile, reflexive ones, the realism of the assumption is a proxy for robustness. Ignoring it is dangerous. The episode implies that instrumentalism requires a stable environment to function. When the environment is shaped by the instrument itself, the realism of the assumptions becomes a safety check that Friedman wrongly dismisses. We need to know *why* the model works, not just *that* it works.

  **Verdict**
  The Gaussian copula case counts against the F-twist, but not simply because the assumptions were false. It counts against it because the model's success masked its predictive failure until collapse. In reflexive systems, unrealistic assumptions aren't just harmless simplifications; they are active risks. The F-twist never anticipated a world where the model itself becomes the primary driver of the correlation it seeks to measure.
