prompt: |-
  Right, so I've been chewing on this one for a while and I want someone to actually work it through rather than give me the usual "models are idealisations, deal with it" shrug.

  The episode: the Gaussian copula, David Li's 2000 formula for default correlation, and its role in the CDO market in the run-up to 2008. Quick reminder of the facts, in case you need them: Li was an actuary who'd moved to a bank; he proposed modelling the joint default behaviour of a pool of debt by mapping each default time onto a standard normal and assuming a single correlation parameter drove the dependence between them, so you could price tranches of a CDO (the slices of the pool, ranked by who gets paid first) off one number calibrated from historical data. The market adopted it enthusiastically, and its now the standard villain of the crash, because in a downturn the correlations turned out not to be stable at all — everything defaulted together, and the senior tranches that were "supposed" to be safe wern't.

  What I want is to look at that through Friedman's F-twist — the claim, roughly, that a theory's assumptions don't need to be realistic, only its predictions need to be good (the bit of "The Methodology of Positive Economics" everyone cites and nobody reads). I know the standard take: unrealistic assumptions, disaster, QED. That's boring and I think it's probably wrong, and I want the harder version.

  Please write it up in British English, in these sections and roughly these lengths:

  - The episode in brief — ~100 words, just enough that we agree on what actually happened.
  - The F-twist, stated as fairly as you can — ~150 words, and say what "realistic" is even meant to mean here, because I suspect half the argument is a pun on that word.
  - The mapping — ~300 words. What plays the role of "assumption" and what plays the role of "prediction" here? Is the constant-correlation bit the assumption, or is the whole copula? And does the F-twist even get a grip on a model that's used to price rather than to predict?
  - Where the F-twist handles it well — ~250 words. Give it its best case. Does the episode actually vindicate Friedman if you're careful — i.e. was the failure a bad prediction rather than a bad assumption, which is exactly what he'd want to say?
  - Where it breaks — ~300 words. The honest limits: the reflexivity problem (the model helping to create the world it was modelling), the tail-risk point, whether "prediction" in finance is even the same animal, and whether the case is better handled by a rival account — models as credible worlds, isolation, or whatever you think is strongest.
  - What the episode shows about the F-twist — ~200 words.
  - Verdict — ~80 words, just the bottom line: does the Gaussian copula story count for the F-twist, against it, or is it a case the F-twist never anticipated?

  Don't give me citations or a reading list — I won't have web access where I'm reading this. And please don't tell me the crash proves models are bad; I've had that conversation.

  Ta.
