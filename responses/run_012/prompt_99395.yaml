      *   **What the episode shows about the F-twist (~200 words):**
          *   Synthesis. Limits of instrumentalism in social systems.
          *   *Draft:* This episode reveals the F-twist's vulnerability in social systems where theories are performative. Friedman assumes a distinction between the map and the territory. The copula crisis shows the map can redraw the territory. When assumptions become self-fulfilling prophecies until they suddenly aren't, predictive accuracy is a lagging indicator. The episode suggests that 'realism of assumptions' matters more than Friedman admits, not because truth is virtuous, but because unrealistic assumptions can hide structural fragilities that only reveal themselves when the model's own success undermines them.
          *   It shows that in complex adaptive systems, you cannot ignore the mechanism. If the mechanism (correlation) is misunderstood, the prediction will fail catastrophically rather than gradually. Friedman's tolerance for unrealistic assumptions works best in stable systems. In fragile, reflexive ones, the realism of the assumption is a proxy for robustness. Ignoring it is dangerous.

      *   **Verdict (~80 words):**
          *   Bottom line.
