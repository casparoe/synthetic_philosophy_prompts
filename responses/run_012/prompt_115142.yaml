prompt: |-
  I need a short research proposal — like a page, for a grad workshop I'm hoping to pitch this term — on Augustine on lying, and I want an angle that isn't just "Augustine the rigorist vs. the kindly helpful-lie crowd." My half-formed idea: everyone knows he bans all lying, but his actual definition is strange. A lie for him isn't a false statement; it's a mismatch between what's in your mind and what you signify, and the specific fault is the will to deceive — he speaks of the liar's "double heart," and he even says you can utter something true and still be lying if you believe it false. So I want to know whether his prohibition is really tracking two things that can come apart: (a) the double heart, my words and my beliefs diverging, and (b) the intent to produce a false belief in someone. The case that bugs me is saying something I believe true but in order to get you to infer something false — is that a lie for him, and does his own definition even settle it? And the mirror case: telling a falsehood I expect you to see through, which he seems to wave off because there's no will to deceive.

  Turn that into the proposal. I want the question stated so it has a determinate answer, why the standard readings leave it open, what I'd actually do (the reconstruction, the test cases I'd run both criteria on, how I'd decide between them), what a good outcome looks like versus the whole thing collapsing into "Augustine is inconsistent," and an honest scope check — is this a paper or a dissertaion. You can use the Priscillianist episode as a stress test if it helps (the later anti-lying treatise was prompted by Catholics wanting to pose as Priscillianists to expose them). Skip citations, I'll add those myself. And say how confident you are in what you're claiming and which bit you're least sure about.
