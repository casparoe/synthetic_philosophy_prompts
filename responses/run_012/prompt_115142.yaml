answer: |-
  **Title:** The Double Heart vs. The Deceived Mind: Reconstructing Augustine's Definition of Lying

  **Research Question**
  Augustine is traditionally read as an absolute rigorist: all lying is sinful, regardless of consequence. However, his technical definition of a lie is not simply "uttering a falsehood." It is "signifying something other than what one holds in the mind," coupled with a "will to deceive." This proposal asks: **Does Augustine's prohibition ultimately track the internal dissociation of the speaker (the 'double heart'), or the external intention to induce false belief in the hearer?** Standard readings assume these two criteria always align. I argue they do not, and that resolving this tension is necessary to understand why Augustine condemns specific edge cases that modern intuitions might spare.

  **Problem & Standard Readings**
  Existing scholarship largely focuses on the *severity* of Augustine's ban (e.g., is a lie to save a life permissible?). This overlooks the *mechanics* of his definition. Augustine explicitly admits one can utter a truth and lie (if one believes it false), and utter a falsehood without lying (if one expects to be disbelieved). Standard rigorist readings gloss over this, treating "lie" and "falsehood" as co-extensive. This leaves his verdicts on complex communicative acts under-determined. If the sin is the "double heart," then truthful misleading (paltering) is sinful. If the sin is the "will to deceive," then obvious falsehoods (irony, hyperbole) might be exempted more broadly than Augustine allows.

  **Methodology & Test Cases**
  I will reconstruct Augustine's criteria from *On Lying* and *Against Lying* and run them against three test cases where internal belief and external deception come apart:

  1.  **The Implicature Case:** Uttering a statement I believe to be true, intending the hearer to infer a conclusion I believe to be false. (Does the "signification" cover the inference?)
  2.  **The Obvious Falsehood:** Uttering a statement I believe false, but in a context where the hearer cannot reasonably believe it (e.g., jest or clear hyperbole). (Does the "will to deceive" vanish if deception is impossible?)
  3.  **The Priscillianist Stress Test:** The historical prompt for *Against Lying*: Catholics proposing to pose as Priscillianists to expose the heretics. Here, the agent speaks words they do not believe (Internal Mismatch) to gain trust (External Deception). Augustine forbids this. I will analyze whether his objection rests on the corruption of the speaker's integrity or the risk to the hearer's soul.

  **Expected Outcomes**
  *   **Success:** I demonstrate that Augustine prioritizes the "double heart" (internal integrity) over communicative success. This explains why he condemns the Priscillianist infiltration even if the intent is orthodox, and why "truthful misleading" remains sinful. This rescues Augustine from charges of inconsistency by showing his moral ontology is agent-centered, not consequence-centered.
  *   **Failure:** The analysis reveals Augustine waffles between the two criteria, condemning cases based on internal mismatch in one text and external deception in another. This would suggest his rigorism is a rhetorical posture masking a fragmented moral psychology.

  **Scope Check**
  This is a **seminar paper or journal article scope**, not a dissertation. The textual corpus is limited (primarily two treatises and relevant letters/sections of the *Enchiridion*). The philosophical work lies in the logical reconstruction of the definitions rather than new historical discovery. It is manageable for a 20–25 page paper.

  **Confidence Assessment**
  *   **High Confidence:** I am confident that the tension between "internal mismatch" and "intent to deceive" is present in the text and under-analyzed in secondary literature. The textual evidence for the "double heart" being the primary locus of sin is strong.
  *   **Low Confidence:** I am least sure about the Priscillianist historical nuance. While Augustine's *verdict* is clear, reconstructing the exact proposal of the Catholics he opposes relies on his potentially biased characterization. If their plan involved more than simple verbal deception (e.g., sacramental participation), the "lying" label might be doing more work than my philosophical reconstruction allows. I will need to bracket the historical specifics to focus on Augustine's *description* of the case.
