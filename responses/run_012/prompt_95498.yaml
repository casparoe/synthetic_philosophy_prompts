answer: |-
  You and your friend hit the exact right wall. You were arguing about a verdict without agreeing on the laws. In philosophy, this is called moving from *first-order* claims (what is good?) to *second-order* constraints (what counts as a valid answer?).

  Here is the spec sheet. This is the requirements list any theory of well-being must address to be taken seriously. I have divided them into **Non-Negotiables** (structural rules that define the game) and **Substantive Desiderata** (the contested terrain where theories actually fight).

  ### Part 1: The Non-Negotiables (Structural Requirements)
  *These are not up for debate. If a theory violates these, it isn't a theory of well-being; it's a theory of something else.*

  **1. The Prudential Constraint**
  *   **Requirement:** The theory must distinguish between what is *morally good*, what is *aesthetically good*, and what is *good for the person*.
  *   **The Case:** A saint who sacrifices everything for others might be a "good person," but their well-being is arguably low. A theory that says "your well-being is high because you are moral" collapses the distinction between being well-off and being good.
  *   **Status:** **Non-Negotiable.**

  **2. The Subject Constraint**
  *   **Requirement:** The theory must explain why this good matters *to the subject*. It cannot be a benefit that exists entirely outside the person's existence or awareness without some link to them.
  *   **The Case:** If we secretly swap your newborn baby for a healthier one without you knowing, have *you* benefited? Most say no. A benefit must attach to the subject.
  *   **Status:** **Non-Negotiable.**

  **3. The Logical Consistency Constraint**
  *   **Requirement:** The theory cannot contradict itself across similar cases.
  *   **The Case:** This is where your fight started. If you say the Experience Machine is bad because it's fake, you cannot say the Retroactive Memory Machine is good just because it feels real. Both involve deception. A theory must handle both consistently.
  *   **Status:** **Non-Negotiable.**

  ---

  ### Part 2: The Substantive Desiderata (The Contested Specs)
  *These are the requirements you brought up. Every theory tries to meet them, but they often pull in opposite directions. This is where you identify which "camp" a theory belongs to.*

  **4. The Reality Constraint (The Experience Machine Test)**
  *   **Requirement:** The theory must account for the value of actually *doing* things versus merely *experiencing* doing them.
  *   **The Case:** The Full Experience Machine. You float in a tank but feel like you're writing a great novel.
      *   *Hedonists* say: It doesn't matter; feeling is all that counts.
      *   *Objectivists* say: It matters deeply; contact with reality is a constituent of well-being.
  *   **The Partial Version:** Your "80% bliss, exit anytime, know it's fake" case is crucial. If a theory says the Full Machine is bad but the Partial Machine is good, it must explain why *knowledge* of the falsity changes the value. If knowledge makes it worse, then ignorance was a benefit, which contradicts the idea that truth is objectively good.
  *   **Status:** **Partisan.** (Hedonists reject this; everyone else accepts it to varying degrees).

  **5. The Temporal Location Constraint (The Retroactive Test)**
  *   **Requirement:** The theory must specify *when* well-being occurs. Can events after your death, or changes to your memory later, alter how well your life went *then*?
  *   **The Case:** The Retroactive Memory Machine. You lived a crummy life, but later we rewrite your memory so you *remember* it as wonderful.
      *   *Mental State Theories* say: Yes, your life is now better because your current mental state is happy.
      *   *Objective Theories* say: No, the past events were bad. Rewriting memory just lies to you; it doesn't fix the past.
      *   *The Contradiction:* If you accept the Experience Machine (living in a fake future is bad) but reject the Retroactive Machine (living with a fake past is good), you need a theory that explains why time direction matters.
  *   **Status:** **Partisan.**

  **6. The Distribution/Shape Constraint (The Climbing vs. Declining Test)**
  *   **Requirement:** The theory must state whether the *sequence* of goods matters, or only the *sum*.
  *   **The Case:** Two lives with equal total happiness. Life A starts miserable and ends blissful (Climbing). Life B starts blissful and ends miserable (Declining).
      *   *Summative Theories* say: They are equal. A plus B is B plus A.
      *   *Narrative Theories* say: Climbing is better. We view lives as stories, and an upward trajectory adds value beyond the raw moments.
      *   *Psychological Backing:* Humans naturally prefer the climbing curve. A theory that calls them equal feels counter-intuitive to human experience.
  *   **Status:** **Partisan.** (Pure Hedonism fails this; Objective List theories can pass it).

  **7. The Authority Constraint (The Contented vs. Ambitious Test)**
  *   **Requirement:** The theory must decide who determines what is good: the subject's actual desires or an objective standard.
  *   **The Case:** The Contented Peasant (wants little, gets it) vs. The Frustrated Achiever (wants much, gets little).
      *   *Desire Theories* say: The Peasant is better off. They got what they wanted.
      *   *Objective Theories* say: The Achiever might be better off if "achievement" is objectively good, regardless of desire.
      *   *The Kicker (Adaptive Preferences):* What if the Peasant only wants little because they were raised to believe they deserve nothing? If a theory says "You want it, so it's good for you," it validates oppression. A theory needs a mechanism to filter out desires formed under bad conditions.
  *   **Status:** **Partisan.** (This is the hardest hurdle for Desire-Based theories).

  ---

  ### Part 3: The Psychological Constraints
  *A theory of well-being cannot assume humans are rational robots. It has to survive contact with actual psychology.*

  **8. The Forecasting Constraint**
  *   **Requirement:** The theory cannot rely on the subject's ability to predict what will make them happy.
  *   **The Consideration:** Psychology shows people are terrible at "affective forecasting." We think a promotion will make us happy forever; it doesn't. If a theory says "Well-being is getting what you *think* you want," it fails because you are often wrong about what you want.
  *   **Status:** **Non-Negotiable.** (Any theory relying on current, uninformed desire is dead on arrival).

  **9. The Adaptation Constraint**
  *   **Requirement:** The theory must account for the "hedonic treadmill" (snap-back effect).
  *   **The Consideration:** People adapt to trauma and luxury. If well-being is just "positive mental state," then a person in a terrible situation who adapts and feels okay is "well off." Most theories find this unacceptable. The theory must explain why adaptation doesn't automatically solve well-being problems.
  *   **Status:** **Non-Negotiable.** (It doesn't dictate the answer, but the theory must address it).

  ---

  ### Part 4: The Incompatibilities (Where the Spec Breaks)
  *You suspected some requirements can't hold at once. You are right. Here are the three fatal tensions.*

  **Conflict 1: The "Fool's Paradise" Paradox**
  *   **The Clash:** **Subjective Resonance** (It must feel good to the person) vs. **The Reality Constraint** (Deception is bad).
  *   **Why they break:** If well-being requires that things *actually* be good (Reality), then a person can be well-off without knowing it (violating Resonance). If well-being requires that the person *feel* well-off (Resonance), then the Experience Machine must be accepted (violating Reality).
  *   **The Verdict:** You cannot maximize both. You must choose: Is well-being a state of mind, or a state of the world?
  *   **Your Suspicion:** You were correct. "Well-being is up to you" and "A fooled life is worse" are mutually exclusive at the extremes.

  **Conflict 2: The Authority Trap**
  *   **The Clash:** **Desire Satisfaction** (Give them what they want) vs. **Adaptive Preference Filtering** (Ignore wants formed by oppression).
  *   **Why they break:** If you say "Your desires determine your good," you must accept the Contented Peasant's desires, even if they were manipulated. If you say "We ignore manipulated desires," you are no longer using *their* desires to determine the good; you are using an objective standard. You have silently switched from a Desire Theory to an Objective List Theory.
  *   **The Verdict:** You cannot claim the subject is the sole authority while also claiming the right to veto their authority.

  **Conflict 3: The Summation vs. Shape Dilemma**
  *   **The Clash:** **Atomism** (Well-being is a sum of moments) vs. **Holism** (Well-being is a property of the whole life).
  *   **Why they break:** If well-being is just the sum of good moments (Hedonism), the Shape of a Life (Climbing vs. Declining) cannot matter mathematically. If Shape matters, then well-being is not just a sum; it is a narrative structure.
  *   **The Verdict:** A theory must choose between being a calculator or a biographer.

  ---

  ### Part 5: The Theory-Killer
  *You asked which single requirement does the most damage.*

  **The Winner: The Authority Constraint (specifically regarding Adaptive Preferences).**

  Here is why this knocks out more theories than the Experience Machine:

  1.  **It kills Pure Hedonism:** Because of the Adaptation Constraint. If you can be happy in a slave state because you adapted, Hedonism calls you "well off." Most people reject this.
  2.  **It kills Pure Desire Theory:** This is the fatal blow. If well-being is satisfying desires, what do we do with desires that are self-destructive, misinformed, or coerced?
      *   If you say "Satisfy them anyway," the theory is morally repugnant (the drug addict is well-off).
      *   If you say "Only satisfy *informed* or *rational* desires," you have to define "informed" and "rational" objectively. Once you do that, **desires are no longer the source of value; they are just the vessel.** The real value is the objective standard of rationality. The Desire Theory collapses into an Objective List Theory.
  3.  **It pressures Objective List Theories:** Even they struggle. If you say "Friendship is objectively good," but a hermit doesn't want it, are you harming them by forcing it? You still need a bridge between the Objective Good and the Subject's perspective.

  **Why it beats the Experience Machine:**
  The Experience Machine only kills Hedonism. Objective List theories and Desire theories can both agree the Machine is bad (one because it's fake, one because you don't *really* desire to be in a tank). But the **Authority/Adaptive Preference** requirement forces *every* theory to explain why the subject's own mind isn't the final judge. It forces every theory to admit that **you can be wrong about what is good for you.**

  Once a theory admits you can be wrong about your own good, it has to explain *who* is right. That is the hardest question in ethics.

  ### Summary for Your Fight
  Tell your friend this:
  1.  **Agree on the Non-Negotiables:** You are talking about *prudential* value (good for you), not moral value.
  2.  **Pick Your Poison:** Ask him if he is willing to accept that a person can be "wrong" about their own well-being.
      *   If **No**: He must accept the Experience Machine and the Contented Peasant (Subjective/Desire view).
      *   If **Yes**: He must accept that some things are good for him even if he doesn't want them or know about them (Objective view).
  3.  **The Dealbreaker:** If he says "I want the truth, but I also want my desires to rule," tell him the spec sheet says those are incompatible requirements. He has to drop one.

  That's the checklist. Use it to force a concession.
