prompt: |-
  I retired from the bench a few years back — physical chemistry, thirty-odd years of it — and since then I've been working my way through philosophy on my own, mostly the philosophy of mind and the AI stuff. Which has somehow landed me in the position of giving a one-hour session at our local adult-ed place next month, on the frame problem. Twenty or so people, mostly retired professionals, a couple of ex-engineers, nobody who has done any formal logic, and they'll all be walking in assuming it's going to be about robots taking over.

  I don't want you to explain it to me, I want a plan for how I explain it to them. So: what has to be in place before the problem can even be stated as a problem? I've got a hunch you can't say what the problem is until they've already accepted that the machine's knowledge of the world has to be written down somewhere in the first place, and that in a setup like that nothing is presumed to stay put unless you say so. Tell me whether that's the right first move or whether something else has to come before it, and why the pieces have to go in that order rather than the one that seems natural to me.

  The carrying example is the part I'm least sure about. The usual one seems to be blocks on a table, and I suspect that one is so well-worn that it does half its work through familiarity and none of it by making anybody think. My own instinct is to use something from my old line of work — you write down rate equations for the species you care about, and every species you don't mention is silently assumed inert. Nobody ever pays for that assumption; it's free. Will that carry it, or does it smuggle in exactly the thing that needs to be made strange? And if it won't carry it, what would — what does the example have to have, and what does it have to lack? (I'd also like a verdict on whether the one with the turkey and the gun is worth ten minutes or is just too cute.)

  Then the misconceptions, which I'd like mapped rather than listed. My guesses: that its just a speed problem, solved by faster chips; that it's the same thing as the qualification problem (I only half understand the difference myself, so correct me); that frame here means the Minsky sort of frame, because of the word; that the logicians had it tidied up by the end of the eighties, so there's nothing left worth caring about; and in the other direction, that it proves machines can never have common sense. Where in the sequence should each of those be headed off — and which of them am I simply wrong to expect at all?

  Last thing. I want the back half to be about the difference between having to write down everything that doesn't change and having to know what's worth thinking about, because my sense is that that's where the real weight is, and I'd like the first half built so the distinction arrives as a relief rather than a jolt. So tell me the order, tell me what I should openly refuse to cover at this level, and give me one question to put to them at the end that would show me whether they've actually got it or are just nodding along.
reasoning: |-
  Here's a thinking process that leads to the suggested plan:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired physical chemist (30+ years), self-taught in philosophy of mind/AI. Intelligent, analytical, used to formal systems (rate equations), but aware of his audience's limitations.
      *   **Audience:** Adult-ed, ~20 people, retired professionals/ex-engineers, *no formal logic*. Expecting "robots taking over" (Terminator style).
      *   **Task:** Create a *teaching plan* for a 1-hour session on the Frame Problem. Do *not* explain the problem to the user; explain *how* to explain it to them.
      *   **Specific Questions:**
          1.  Prerequisites: What must be accepted before the problem can be stated? (User suspects: explicit representation + inertia assumption). Is this the right first move?
          2.  Examples: Blocks world (too cliché?) vs. Chemical rate equations (user's instinct). Does chemistry smuggle in assumptions? What about the Turkey & Gun? What makes a good example?
          3.  Misconceptions: Map them (don't just list). Speed vs. logic, Qualification Problem, Minsky Frames, "Solved in the 80s", "Proves no common sense". When to address them? Which are unlikely?
          4.  Structure/Flow: First half = setup/problem; Second half = representation vs. relevance. Build to the distinction as a "relief." What to exclude?
          5.  Closing: One diagnostic question to check understanding.

  2.  **Deconstruct the Frame Problem (for the purpose of teaching):**
      *   *Core:* How does an agent know what *didn't* change after an action without checking everything?
      *   *Technical:* The ramification problem in logical AI. Explicitly representing non-change (frame axioms) is combinatorially explosive.
      *   *Philosophical:* Relevance. How do we ignore the irrelevant?
      *   *Audience Constraint:* No formal logic. Cannot use $\forall t, Holds(On(A,B), t) \rightarrow Holds(On(A,B), t+1)$. Must use intuition.

  3.  **Address Question 1: Prerequisites (The "First Move"):**
      *   User's hunch: Machine knowledge must be written down + nothing stays put unless said so.
      *   *Verdict:* Correct, but needs nuance. The critical prerequisite is *Explicit Symbolic Representation*. If the audience thinks AI works like brains (connectionism/implicit), the frame problem vanishes. They need to buy into the "Good Old-Fashioned AI" (GOFAI) model first.
      *   *Order:*
          1.  AI as a ledger (explicit facts).
          2.  Action as an update to the ledger.
          3.  The assumption of inertia (things stay same unless changed).
          4.  *Then* the problem: The ledger is too big to update manually.

  4.  **Address Question 2: Examples:**
      *   *Blocks World:* Too abstract. Engineers might get it, but it feels like a toy.
      *   *Chemical Rate Equations:* User's instinct.
          *   *Pros:* User is expert, audience are professionals (might respect rigor).
          *   *Cons:* Dangerous. In chemistry, conservation laws *do* the work for you. Mass balance implies inertness implicitly. It might hide the problem rather than reveal it. The "frame" is enforced by physics, not logic.
          *   *Verdict:* Risky. It smuggles in physical necessity which logical AI lacks.
      *   *Turkey & Gun (Hanks & McDermott):* Good for causality/temporal projection, but maybe too specific to the "Yale Shooting Problem" variant. Might get bogged down in "why did the turkey die?" rather than "what about the turkey's feathers?"
      *   *Better Example:* Needs to be mundane, physical, but highlight the *combinatorial explosion* of non-change.
      *   *Suggestion:* The "Morning Routine" or "Making Coffee." Moving the kettle doesn't change the color of the walls, the price of tea in China, the position of the moon.
      *   *Refinement:* Use the "Robot Butler" scenario. It bridges their "robots taking over" fear with the actual logical issue.

  5.  **Address Question 3: Misconceptions (Mapping):**
      *   *Speed:* It's not computational power; it's logical complexity. Address early when defining the problem.
      *   *Qualification Problem:* Distinct. Frame = what stays same. Qualification = what preconditions are needed. Address after the main problem is clear, as a "sibling" issue.
      *   *Minsky Frames:* Linguistic confusion. Address immediately upon hearing the term "Frame."
      *   *Solved in 80s:* Technically (situation calculus fixes), philosophically (no). Address in the wrap-up.
      *   *No Common Sense:* The philosophical takeaway. Save for the end.
      *   *Mapping:* Group them into "Technical Confusions" (Speed, Minsky, Solved) vs. "Philosophical Confusions" (Qualification, Common Sense).

  6.  **Address Question 4: Structure & Flow:**
      *   *Goal:* Shift from "Writing down non-change" to "Knowing what matters."
      *   *Part 1 (The Trap):* GOFAI assumptions. The ledger. The explosion of frame axioms.
      *   *Part 2 (The Escape):* Relevance. Human intuition vs. Logical exhaustive search.
      *   *Refusal:* Do not cover Situation Calculus, Circumscription, or non-monotonic logic details. Keep it conceptual.
      *   *Relief:* The relief comes when they realize humans don't solve it logically, we solve it by *not* representing the world that way.

  7.  **Address Question 5: The Diagnostic Question:**
      *   Needs to distinguish between "The robot is slow" and "The robot doesn't know what to ignore."
      *   *Draft:* "If I give the robot a faster processor, does the problem go away?" (Too simple).
      *   *Better:* "If the robot picks up a cup, list three things it needs to check didn't change, and three things it can safely ignore. How does it decide the difference?"

  8.  **Drafting the Plan (Iterative refinement):**
      *   *Tone:* Respectful of the user's expertise, peer-to-peer.
      *   *Chemistry Example:* I need to be firm here. It's tempting but flawed. I'll explain *why* it's flawed (conservation laws do the framing) and suggest a hybrid or alternative. Actually, the "Ledger" metaphor is better than chemistry.
      *   *Turkey:* Keep it brief if used, but the "Robot Butler" is more relatable for the "Common Sense" angle.
      *   *Misconceptions:* Integrate them into the narrative flow rather than a "Mythbusters" slide.

  9.  **Final Review against Constraints:**
      *   Did I explain the problem to the user? No.
      *   Did I plan how *they* explain it? Yes.
      *   Did I answer the specific questions about prerequisites, examples, misconceptions, and flow? Yes.
      *   Is the tone appropriate? Yes, intellectual but practical.

  10. **Final Polish:** Ensure the distinction between the "Logical Frame Problem" (axioms) and the "Philosophical Frame Problem" (relevance) is clear, as that's the pivot point for the second half. (Self-correction: Make sure not to get bogged down in the distinction itself, but use it for the narrative arc).

  *(Self-Correction during drafting)*: Wait, the user asked about the Chemistry example specifically. I need to give a definitive verdict.
  *Verdict:* It's dangerous. In kinetics, $d[A]/dt = 0$ is derived from mechanism, not assumed. In AI, it must be asserted. If he uses chemistry, he must explicitly strip away the conservation laws to make it analogous to logic. I will advise against it or suggest heavy modification. The "Ledger" is safer.

  *(Refining the Misconception Map)*: Instead of a list, organize by *when* they arise.
  - Start: Minsky Frames, Robots Taking Over.
  - Middle: Speed, Qualification.
  - End: Solved, Common Sense.

  *(Refining the Closing Question)*: Needs to be punchy. "If you write a rule for everything that stays the same, how many rules do you need for a single action?" vs "How does a baby know not to worry about the moon?"

