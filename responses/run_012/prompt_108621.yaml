answer: |-
  This is a sophisticated brief. You know the material, you know your audience, and you know the pedagogical trap: if you start with the logic, you lose them; if you start with the sci-fi, you mislead them.

  Here is a plan for the hour, structured to answer your specific constraints on prerequisites, examples, misconceptions, and flow.

  ### 1. The Prerequisites: The "Ledger" Before the "Problem"

  Your hunch is correct, but it needs one layer of foundation beneath it. You cannot state the frame problem until the audience accepts three specific premises about how the machine "thinks." If any one of these is missing, the problem dissolves.

  **The Order of Operations:**
  1.  **Explicit Representation (The Ledger):** You must establish that for this specific type of AI (GOFAI), knowledge isn't a "feeling" or a "pattern"; it is a list of true sentences stored in memory. *Analogy:* A bank ledger. If a transaction isn't written down, it didn't happen.
  2.  **Atomic Action (The Update):** An action is not a continuous flow; it is a discrete transaction that changes specific entries in the ledger.
  3.  **Logical Inertia (The Default):** This is your specific hunch. In the real world, things stay put unless moved. In the ledger, **nothing stays put unless you write a rule saying it does.**

  **Why this order?**
  If you skip #1 and they imagine a neural net or a brain, the frame problem doesn't exist (brains don't check every synapse when you move your finger). If you skip #3, they assume the computer is like the physical world (where inertia is free). You have to convince them that in this logical universe, **change is the default, and stability is the expensive option.**

  **Verdict on your first move:** It is the right move, but only if you explicitly strip the machine of physical intuition first.

  ### 2. The Example: Chemistry vs. Blocks vs. Turkey

  **The Chemistry Instinct:**
  *Verdict:* **Do not use the rate equations.**
  *Why:* You identified the risk yourself: it smuggles in the solution. In physical chemistry, conservation laws (mass/energy) implicitly handle the "frame." If you don't mention a species, it *isn't* inert by assumption; it's inert because the stoichiometry says so. The math does the work for you. In the Frame Problem, there are no conservation laws, only logical assertions. Using chemistry will make the problem seem easier than it is because your audience (and you) will lean on physical necessity to solve a logical gap.

  **The Blocks World:**
  *Verdict:* **Too abstract.**
  *Why:* You're right. It feels like a toy. Retired engineers will treat it as a puzzle to be solved rather than a paradox to be understood.

  **The Turkey and the Gun:**
  *Verdict:* **Skip it.**
  *Why:* It's the "Yale Shooting Problem." It's a specific variant involving temporal projection and causality. It adds a layer of "did the gun unload?" that distracts from the core "what about the turkey's feathers?" issue. It's too cute, as you suspected.

  **The Recommended Example: The Robot Butler.**
  *Why:* It bridges their "Terminator" fear with the logical reality.
  *The Setup:* A robot is told to "Make Coffee."
  *The Action:* It picks up the coffee pot.
  *The Ledger Update:* `Location(CoffeePot) = Cup` becomes `Location(CoffeePot) = Hand`.
  *The Problem:* To be logically certain, does the robot need to re-verify that `Location(Wall) = Kitchen`, `Color(Sky) = Blue`, `Balance(BankAccount) = X`?
  *The Punchline:* If the robot has to write a rule for every fact that *didn't* change for every action it takes, it will spend 10,000 years updating the ledger before it pours a single drop.

  **What the example must have:**
  1.  **Mundanity:** It must be boring. The stakes are not life or death; the stakes are *efficiency*.
  2.  **Combinatorial Explosion:** It must show that the number of "non-changes" dwarfs the number of "changes."
  3.  **No Physical Laws:** The example must exist in a world where gravity and inertia are not guaranteed, only written rules.

  ### 3. Mapping the Misconceptions

  Do not list these as "Myths vs. Facts." Integrate them into the narrative flow where they naturally arise as objections.

  **Phase 1: The Setup (Minutes 0–15)**
  *   **"Frame means Minsky Frames":** Head this off immediately. When you introduce the term, say: *"Ignore Marvin Minsky. Ignore video frames. Think of a picture frame: what's inside matters, what's outside is ignored. The problem is deciding what to put in the frame."*
  *   **"Robots Taking Over":** Acknowledge this. *"You're waiting for Skynet. This isn't about malice; it's about incompetence. The robot isn't killing us; it's starving to death because it's busy checking if the moon moved."*

  **Phase 2: The Logical Trap (Minutes 15–30)**
  *   **"It's a Speed Problem":** This will arise when you describe the explosion of axioms. *"It's not that the computer is too slow. It's that the list is infinite. A faster car doesn't help if the road never ends."*
  *   **"The Qualification Problem":** Distinguish this carefully. *"Qualification is: 'I can't pick up the cup if it's glued down.' Frame is: 'Picking up the cup doesn't move the table.' One is about preconditions, the other is about side effects."* (Keep this brief; don't let it hijack the hour).

  **Phase 3: The Philosophical Turn (Minutes 30–45)**
  *   **"Logicians Tidied It Up":** Address this when discussing solutions. *"Technically, yes, we have non-monotonic logics now. Philosophically, no. We patched the ledger, but we didn't explain how humans do it without one."*
  *   **"Proves No Common Sense":** This is your closing argument. Save this for the end.

  **Which to expect?**
  Expect "Speed" and "Robots Taking Over." Do not expect them to care about "Qualification" unless you make it very concrete. Expect "Minsky Confusion" from anyone who read pop-sci in the 80s.

  ### 4. The Structure: From Ledger to Relevance

  You want the second half to feel like a relief. The structure should move from **Syntax** (how we write it) to **Semantics** (what it means).

  **Part 1: The Trap (30 mins)**
  1.  **The GOFAI Assumption:** Intelligence = Manipulating Explicit Symbols. (The Ledger).
  2.  **The Action:** Changing symbols.
  3.  **The Frame Axiom:** The need to explicitly state what *doesn't* change.
  4.  **The Explosion:** Show the math of the explosion without using formulas. (1 action, 10,000 non-changes).
  5.  **The Misconception Check:** It's not speed; it's logic.

  **Part 2: The Escape (30 mins)**
  1.  **The Pivot:** *"Humans don't do this. When I pick up my coffee, I don't check if the Eiffel Tower fell."*
  2.  **The Shift:** The problem isn't representing the world; it's **Relevance**.
  3.  **The Relief:** The Frame Problem isn't a bug in AI; it's a clue about human cognition. We don't store the world as a ledger of facts. We store it as a set of affordances and relationships.
  4.  **What to Refuse to Cover:**
      *   Do not cover Situation Calculus syntax.
      *   Do not cover Circumscription or Default Logic technicalities.
      *   Do not cover Connectionism/Neural Nets as a "solution" (it sidesteps the problem rather than solving it).

  **Why this order?**
  If you start with Relevance, they think it's just a engineering optimization problem. If you force them through the Logical Trap first, they feel the weight of the impossibility. Then, when you introduce Relevance, it feels like a philosophical liberation rather than a technical patch.

  ### 5. The Diagnostic Question

  You need a question that separates "The computer is slow" from "The computer doesn't know what matters."

  **The Question:**
  > "If I give the robot a processor a million times faster, does it successfully make the coffee? Why or why not?"

  **What to listen for:**
  *   **Wrong Answer (Nodding along):** "Yes, it'll get there eventually." or "No, because it needs more memory."
  *   **Right Answer (Got it):** "No. Because the list of things that *didn't* change is effectively infinite. Speed doesn't fix an infinite list. It needs to know *which* non-changes to ignore."

  ### Summary Checklist for Your Prep

  1.  **Open:** Kill the "Minsky" and "Terminator" ideas in the first 5 minutes.
  2.  **Middle:** Use the **Robot Butler/Ledger** analogy. Avoid Chemistry (conservation laws hide the problem).
  3.  **Turn:** Shift from "How do we write the axioms?" to "How do we know what's relevant?"
  4.  **Close:** The "Faster Processor" question.

  This approach respects their intelligence (no dumbing down of the logic) but respects their time (no getting bogged down in formalism). It uses your background to establish authority but pivots away from it where the analogy fails.
