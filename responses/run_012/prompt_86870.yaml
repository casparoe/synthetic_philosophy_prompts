answer: |-
  ### The Prediction

  She rejects the Wall.

  She will acknowledge the drop in recidivism and the victims' sense of safety, likely conceding that the *consequences* are superior to the current legal order. However, she will rule the practice ethically intolerable. Her objection will focus on two specific features: the **permanence** of the shame and the **hereditary** nature of the stigma (families catching it).

  She will argue that by making the punishment permanent and unappealable, the collective has converted the men from *members* (who can sin, pay, and return) into *objects* (permanent threats to be managed). By extending the stigma to their families, the collective has reverted to the aristocratic logic she dismissed in case one: status by birth/association rather than conduct. The fact that "nobody can leave" makes this worse, not better; it means the town has become a prison without walls where a caste of the untouchable is forced to live among those who have revoked their standing forever.

  ### The Rule She Is Running

  The rule is **The Membership Integrity Rule** (or, in her own parlance, **"The Door Stays Open"**).

  It is not a simple consequentialist rule (safety/outcomes), nor is it a pure procedural rule (contestability/hearings). It is a **status-based rule regarding moral membership.**

  **The Axioms of her Rule:**
  1.  **Recognition:** A legitimate order must treat subjects as agents capable of accountability, not as "weather" (objects to be endured).
  2.  **Boundedness:** Punishment or shame must have a defined end point.
  3.  **Reintegration:** There must be a mechanism for restoration to full standing.
  4.  **Individuality:** Accountability cannot attach to those who did not commit the act (no hereditary stigma).

  **Why this fits the data:**
  *   **Dueling vs. Rights:** Rights win because they offer universal membership (floor) rather than exclusive status (ledger).
  *   **Rights vs. Street Code:** Street Code wins *only* because the Rights order had abdicated its duty of recognition (treating people as weather). The Code restored agency/accountability (Axiom 1).
  *   **Call-out Culture:** Fails because it is a "ledger pretending to be a floor." It claims universal inclusion but enforces permanent exclusion without process or end (Violates Axioms 2 & 3).
  *   **Restorative/Religious:** Pass because the humiliation is "consented to, bounded, and it ends." The door stays open (Satisfies Axioms 2 & 3).

  ### Competing Rules and Where They Split

  You asked me to be plain if two rules fit. There is a competitor that fits most of her history but splits on the Wall.

  **The Competitor: The "Functional Sovereignty" Rule.**
  *   **Definition:** An order is good if it effectively protects the vulnerable where the state fails. If the state works, use the state. If the state abdicates, use the local code.
  *   **Track Record:**
      *   *Dueling vs. Rights:* Rights work better generally. (Pass)
      *   *Rights vs. Street Code:* State abdicated, Code worked. (Pass)
      *   *Call-out:* No sovereign power, just chaos. (Fail)
      *   *Restorative/Religious:* Functional local order. (Pass)
  *   **The Split:** On the **Wall**, the Functional Sovereignty rule predicts **Approval**. The police say it works. Recidivism collapses. Victims feel safe. The "sovereign" (the collective) is functioning effectively to protect the vulnerable where perhaps the distant legal order was too slow or weak.
  *   **Why it's not her rule:** If she were a Functional Sovereigntist, she would have to approve the Wall. But she praised Restorative Justice *over* Prison. Prison is often more "functional" for immediate incapacitation than a restorative circle. She chose the *moral structure* (reintegration) over the *security structure* (containment). Therefore, outcomes (safety) are secondary to the structure of membership.

  **The "Contestability" Rule (Proceduralism)** also splits here.
  *   **Definition:** As long as there is a hearing and a process, the outcome is valid.
  *   **The Split:** The Wall case specifies "after something like a hearing." A pure proceduralist would approve. But she condemned Call-out Culture (which often lacks process) *and* she condemned the *permanence* of Call-out Culture. If process were the only key, a permanent ban after a fair hearing would be acceptable. Her focus on the "ledger pretending to be a floor" suggests the *outcome* of the process (permanent exile) matters more than the process itself.

  ### Why "Membership Integrity" is the Real One

  The "Floor-and-Ledger" comment she made about Call-out Culture is the Rosetta Stone.

  *   **Floor:** A baseline of dignity belonging to all members.
  *   **Ledger:** A transactional record of debts and credits that determines standing.

  She believes a community must be a Floor. You can violate the floor, but the system must be designed to bring you back to the floor. If the system turns into a Ledger (your worst moment defines you forever), it ceases to be a moral community and becomes a registry of enemies.

  The Wall is the ultimate Ledger. It etches the debt in stone. It violates the "boundedness" she praised in the Restorative Justice case ("it ends"). It violates the "individuality" she implicitly upheld in the Street Code case (you are held to account, not your bloodline).

  ### The Next Case to Test Her

  To confirm this, you need a case that separates **Safety** from **Reintegration**. You need to force her to choose between the "Door Stays Open" and the "Protection of the Vulnerable."

  **Put this to her:**

  > "A restorative justice circle is held for a violent offender. The process is perfect: bounded shame, consented to, reintegration plan agreed upon. However, the *victim* explicitly states: 'If this person is readmitted to the community, I will leave. I cannot feel safe with them here.' The community is small; if the victim leaves, the support network collapses for everyone.
  >
  > Does the community enforce the reintegration (keeping the door open for the offender) or do they honor the victim's veto (keeping the victim safe, but permanently exiling the offender)?"

  **Why this tests the rule:**
  *   **If she is a Functional Sovereigntist:** She sides with the victim (safety/stability).
  *   **If she is a Proceduralist:** She sides with the process (the circle agreed to reintegration).
  *   **If she is running Membership Integrity:** This is her hard case.
      *   If she says **Reintegrate**, she proves the "Open Door" is an inalienable right of the offender, trumping even the victim's security.
      *   If she says **Exile**, she admits the "Door" is conditional on the safety of other members, which modifies the rule to "The Door Stays Open *unless it breaks the Floor for someone else*."

  My bet is she hesitates longer on this one than any other. That hesitation will tell you if the "Door" is a principle or a preference.
