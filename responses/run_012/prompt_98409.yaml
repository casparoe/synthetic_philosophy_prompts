prompt: |-
  I sit on my college's communications ethics commitee. We're drafting a ruling on a case that's got everyone stuck. Our dean of admissions told a room of mostly international prospective students, 'We don't consider financial need in admissions.' That's true for domestic applicants — we're need-blind for them — but we're need-aware for internationals, and he knew who was in the room. The student paper wants a correction; the dean says he never lied because every word was true, and he calls it 'paltering,' which he says is just effective communication. Our code bans 'knowingly false statements or material omissions,' and the provost wants us to say no rule was broken. Half the committee thinks this is the classic saying-versus-implicating distinction; half thinks that's a dodge. Draft the short written opinion I'll circulate before Thursday's meeting: recommend censure, a required correction, or a policy change, give criteria we can apply to future cases, and take the dean's 'it was literally true' point seriously rather than just asserting that misleading is lying. Keep it under 500 words and lead with the bottom line.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Member of a college's communications ethics committee.
      *   **Task:** Draft a short written opinion to circulate before Thursday's meeting.
      *   **Case:** Dean of Admissions told international prospective students, "We don't consider financial need in admissions." This is true for domestic students (need-blind) but false for international students (need-aware). The Dean knew the audience was mostly international.
      *   **Conflict:** Student paper wants correction; Dean claims no lie (literally true, calls it "paltering"); Provost wants no rule broken; Committee is split (saying vs. implicating).
      *   **Code:** Bans "knowingly false statements or material omissions."
      *   **Requirements:**
          *   Recommend censure, correction, or policy change.
          *   Provide criteria for future cases.
          *   Take the Dean's "literally true" point seriously (don't just equate misleading with lying).
          *   Keep under 500 words.
          *   Lead with the bottom line.

  2.  **Determine the Stance:**
      *   The Dean's argument relies on semantic literalism vs. pragmatic implication.
      *   The Code bans "material omissions."
      *   Ethical communication requires context, not just semantic accuracy.
      *   Recommendation: Require a correction and establish clearer guidelines. Censure might be too harsh for a first offense if framed as educational, but a formal finding of violation is necessary. Let's aim for a finding of violation (material omission) + correction + policy clarification.
      *   Addressing the "literally true" point: Acknowledge that literal truth matters, but emphasize that context determines materiality.

  3.  **Drafting - Section by Section:**

      *   **Bottom Line (Lead):** Start with the recommendation.
      *   **Analysis of the Dean's Argument:** Address "paltering" and literal truth. Acknowledge the semantic accuracy but refute the ethical sufficiency.
      *   **Application of Code:** Focus on "material omissions." The omission of the international/domestic distinction was material because it changed the decision-making calculus for the audience.
      *   **Recommendation:** Correction required.
      *   **Future Criteria:** Establish a test for context-dependent truth.
      *   **Word Count Check:** Keep it tight.

  4.  **Drafting - Attempt 1 (Mental Outline):**
      *   Recommendation: Violation found. Issue correction.
      *   Dean says it's literally true. He's right semantically. But ethics isn't just semantics.
      *   Code bans material omissions. Leaving out the international exception is material because the audience was international.
      *   Paltering isn't effective communication if it breaches trust.
      *   Future rule: Statements must be truthful in context, not just in isolation.
      *   Conclusion: Fix this, then move on.

  5.  **Drafting - Attempt 2 (Writing & Refining):**
      *   *Lead:* I recommend we find a violation of the ethics code requiring a public correction and mandate training on contextual truthfulness.
      *   *Addressing the Dean:* The Dean argues the statement was literally true, invoking "paltering." We must take this seriously. Literal truth is a necessary baseline for ethical communication. However, it is not sufficient. Our code prohibits "material omissions." A statement that is technically true but creates a false belief through context constitutes a material omission.
      *   *Application:* By telling a room of international students a policy applicable only to domestic students, the Dean omitted the conditionality essential to the statement's accuracy *for that audience*. This isn't merely implicating; it is withholding the variable that makes the truth valid.
      *   *Criteria:* For future cases, we should apply the "Reasonable Audience Context" test: Would a reasonable member of the specific audience interpret the statement as universally applicable based on the context provided? If yes, qualifiers are mandatory.
      *   *Conclusion:* We cannot equate misleading with lying, but we must equate misleading with unethical omission when material. Approve the correction.

  6.  **Review against Constraints:**
      *   Under 500 words? Yes, looks short enough.
      *   Lead with bottom line? Yes.
      *   Take Dean's point seriously? Yes, acknowledges literal truth.
      *   Recommend action? Yes (correction + training).
      *   Criteria? Yes (Reasonable Audience Context).

  7.  **Polishing:**
      *   Make it sound professional and decisive.
      *   Ensure the distinction between "lying" and "material omission" is clear.
      *   Strengthen the "paltering" rebuttal.

  8.  **Final Word Count Check:** (Self-Correction during drafting)
      *   Ensure I don't ramble on the philosophy. Keep it actionable.
      *   Make sure the recommendation is specific (Correction + Policy/Guidance).

      *(Self-Correction)*: The prompt asks to recommend censure, correction, OR policy change. I can recommend a combination. I'll focus on Correction + Policy Guidance to be constructive but firm.

      *(Refining the "Literally True" argument)*: I need to explicitly state *why* literal truth isn't enough under the code. The code bans "material omissions." That's the key.

      *(Drafting)*:
      **To:** Communications Ethics Committee
      **From:** [My Name]
      **Re:** Admissions Statement Case

      **Recommendation:** I recommend we find a violation of the ethics code based on "material omission," require a public correction, and adopt a "Contextual Accuracy" guideline for future communications.

      **Analysis:** The Dean's defense rests on semantic literalism: the statement was true for *some* applicants. He labels this "paltering," arguing that effective communication allows leveraging true statements to imply broader truths. We must take this point seriously. Ethical codes should not punish imprecise speech unless it breaches trust. Literal truth is a vital shield against censorship and ambiguity.

      However, our code bans not only false statements but "material omissions." A statement becomes a material omission when context renders the unqualified truth misleading. By addressing a room of predominantly international students without qualifying the policy's domestic limitation, the Dean omitted the condition necessary for the statement to be accurate *for that audience*. This moves beyond mere implication; it withholds the variable that validates the truth.

      **Criteria for Future Cases:** To resolve the split between "saying" and "implicating," we should adopt the **Reasonable Audience Context** test:
      1.  **Audience Specificity:** Was the statement made to a specific subset of stakeholders (e.g., internationals)?
      2.  **Material Variance:** Does the policy differ significantly for that subset?
      3.  **Likely Interpretation:** Would a reasonable audience member interpret the unqualified statement as applying to them?

      If all three are met, qualifiers are ethically mandatory.

      **Conclusion:** We need not assert that misleading is lying to find against the Dean. We must assert that misleading via material omission violates our code. Paltering may be legally defensible, but it fails the ethical standard of transparency required of admissions officers. Approving the correction restores trust without demanding the Dean admit to a lie, preserving his dignity while upholding our integrity.

      **Action:** Vote to require a correction clarifying the international policy and circulate the Contextual Accuracy guideline to all senior staff.

