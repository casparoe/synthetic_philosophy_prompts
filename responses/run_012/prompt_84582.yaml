prompt: |-
  ok so I want you to explain a conceptual issue in accuracy-first epistemology, and I want the actual knot, not a tour of the standard moves. Setup I'm confident about: credences get graded by a scoring rule, accuracy is supposed to be the only epistemic good, and the rule has to be strictly proper -- meaning your own credences are the unique thing that maximizes your expected score -- because otherwise "maximize expected accuracy" doesn't pin down any particular credence at all. Fine, got it. Here's the part I can't get straight.

  Concretely, take three rules for a credence c in a proposition that's either true or false. Quadratic (Brier): score 1-(1-c)^2 if true, 1-c^2 if false. Log: score log(c) if true, log(1-c) if false. Spherical: score c/sqrt(c^2+(1-c)^2) if true, (1-c)/sqrt(c^2+(1-c)^2) if false. All three are strictly proper. But they disagree about basically everything else that matters. Brier and spherical are bounded and treat the two directions of error symmetrically -- being dead certain of a truth and dead certain of a falsehood cost you the same. Log isn't: certainty in a falsehood is infinitely bad while certainty in a truth is merely optimal, and nothing is ever bounded. So "properness" alone doesn't fix how bad error is, or whether the two ways of being wrong are symmetric, or whether you're ever allowed to be certain at all.

  The person I was arguing with says: accuracy is the good, full stop, and which strictly proper rule you grade with is a matter of taste, not epistemology. I think that can't be right but I can't say exactly why. So -- what does strict propriety actually commit you to, and what does it leave open? Is there a principled accuracy-first reason to prefer one strictly proper grading over another, or does the view have to concede that it underdetermines what's rational? And pull apart two things I suspect are being run together: a rule that grades a single credence versus a rule that grades a whole credence function across a partition, and whether the additivity requirement is doing real work there or is just bookkeeping. I don't want a survey of who said what, I want the conceptual structure of the problem and where the real bite is.

  Lead with your bottom line in the first sentence, then give the reasoning. No preamble, no restating the question.
