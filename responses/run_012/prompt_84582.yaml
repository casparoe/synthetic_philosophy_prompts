answer: |-
  Strict propriety ensures your credences are self-recommending but fails to fix the metric of epistemic value, so accuracy-first epistemology either concedes that rational norms are relative to an arbitrary rule or must justify substantive constraints like additivity that propriety alone does not support.

  Strict propriety commits you only to an internal coherence condition: if you hold credence $c$, you must expect $c$ to yield a better score than any alternative $c'$. It guarantees that your credences are stable under reflection, preventing you from believing you should believe something else. However, it leaves entirely open the *scale* and *structure* of the value being maximized. As you noted, Brier and Log agree that $c$ maximizes expected score given $c$, but they disagree radically on the cost of error elsewhere in the space. Propriety fixes the peak of the expected accuracy function at your current credence, but it does not fix the shape of the mountain surrounding it. Consequently, propriety alone cannot tell you how much evidence is required to move from 0.6 to 0.9, because different proper rules assign different accuracy-values to those states relative to the truth.

  Your interlocutor is half-right: within the standard formalism, there is no accuracy-first derivation that uniquely selects Brier over Log. If accuracy is the sole epistemic good, this is a fatal gap, not a matter of taste. An objective good requires a unique metric; if the "distance to truth" can be measured equally well by incompatible scales that prescribe different actions, then "maximize accuracy" is not a action-guiding norm but a schema requiring further parameters. To claim it is "taste" is to concede that accuracy is not a natural kind governing belief, but a constructed utility function, which undermines the claim that epistemology is founded on the constitutive aim of belief rather than pragmatic decision theory.

  The distinction between grading a single credence and a whole credence function is where the view attempts to recover determinacy, but this is where additivity does substantive work rather than mere bookkeeping. Grading a single proposition requires only propriety. Grading a whole belief state requires an aggregation rule to sum scores across a partition. Additivity asserts that the epistemic value of a belief state is the linear sum of the values of individual beliefs. This is a strong substantive claim about the separability of epistemic value—that being wrong about $P$ does not mitigate or compound being wrong about $Q$. Without additivity, dominance arguments for Probabilism often fail, because a non-probabilistic set of credences might not be dominated in total score even if each individual credence is suboptimal. However, even granting additivity, the underdetermination persists: both Brier and Log are additive and proper, yet they still disagree on the severity of errors. Thus, additivity narrows the class of acceptable rules but does not select a unique one, leaving the accuracy-first program unable to derive specific evidential norms without stipulating the metric by fiat.
