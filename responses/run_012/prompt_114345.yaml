answer: |-
  **Scene:** *A Dublin coffee house, 1735. GEORGE BERKELEY sits with SILAS, a merchant who is obsessively counting gold guineas into a leather bag.*

  **SILAS:** (Clinking a coin) Hear that, Bishop? That's the sound of wealth. Solid. Ringing. Real.

  **BERKELEY:** That's the sound of metal, Silas. Wealth is the ale you haven't bought yet.

  **SILAS:** I'm saving.

  **BERKELEY:** You're hoarding. There's a difference. Money isn't wealth, man. It's a ticket. A counter.

  **SILAS:** A ticket?

  **BERKELEY:** A ticket to command labor. That guinea represents a week of a mason's work, or a baker's loaves, or a brewer's barrels. It's an order slip. By locking it in that bag, you've paid the mason to stand idle. You're the worst employer in Ireland. You pay wages for nothing.

  **SILAS:** (Scoffs) I trust gold. I don't trust your paper notes. "Backed by land," you say. It's ink on rag.

  **BERKELEY:** It's ink secured by an acre of Meath. The land grows barley every year. The barley feeds men. The men work. My notes keep the wheel turning. Your gold? It's a ticket to a show you refuse to enter. You're guarding the turnstile instead of watching the play.

  **SILAS:** I like the security. Gold is universal.

  **BERKELEY:** Gold is a stone everyone agrees to pretend is a king. If the agreement breaks, it's just a heavy button. My notes are backed by the earth itself. You can't melt the earth, Silas. You can only work it.

  **SILAS:** (Tightening the bag) I'll keep my gold. It holds its value.

  **BERKELEY:** It holds its weight. Value circulates. Like blood. If it stops, the body dies. You're not a merchant, Silas. You're a curator.

  **SILAS:** A curator of what?

  **BERKELEY:** Of unemployment. You've bought a ticket to the feast, and you're eating the stub.

  **SILAS:** (Pauses) ...Can I buy you a drink?

  **BERKELEY:** (Smiling) Finally. Put the ticket to work. I'll take the paper. It spends easier.
