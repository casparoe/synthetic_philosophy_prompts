      Berkeley: "Because they forget it's a ticket. They think it's the prize. You're hoarding the tickets to a play you never watch."
      Silas: "I like watching my money."
      Berkeley: "Then you're not a merchant. You're a curator. And a poor one. You've got a museum of counters, but no game."

