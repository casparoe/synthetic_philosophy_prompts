answer: |-
  You have stumbled upon a problem that has troubled economists and moral philosophers for a century, though you have done so without their jargon. You are asking for the principle itself, argued against your own observations. I shall give it to you directly.

  The principle governing rational action is **The Sovereignty of the Future**.

  It states: **A decision is rational only if it is justified by the consequences that lie ahead of it. The past is relevant only insofar as it has created a present obligation or altered your present identity.**

  This sounds simple, but your notebook shows exactly where it breaks down. You have correctly identified that money spent, time passed, and pain endured are 'sunk'. They are gone. To act to 'save' them is to try to change the past, which is impossible. However, you have also correctly sensed that not all appeals to the past are equal. A promise is not the same as a receipt.

  Here is how this principle dissects your cases, which judgements you must abandon, and how to handle the new ones.

  ### 1. The Verdict on Your Notebook

  You suspect you are sometimes 'dressing up the past'. In several cases, you are correct.

  **The Meal, The Film, The Magazine, The Bridge, The Company:**
  Your judgement here is sound. These are pure applications of The Sovereignty of the Future. The money is gone. The time is gone. Finishing the meal damages your health (overeating); finishing the film wastes more time; keeping the subscription wastes more money. The past cost is zero relevance.

  **The Medical Treatment:**
  Your judgement is sound. Future pain and expense outweigh the desire to validate past pain.

  **The Marathon:**
  Your judgement is correct, but your reasoning is slightly off. You say the 'money already promised' is part of the reason. Strictly speaking, that money is not yet paid; it is a *future* consequence of running. However, the deeper reason is the **Promise**. A promise creates a present obligation. You are not running to justify the past training; you are running to honour a current commitment to the sponsors. This fits the exception in my principle: the past act (promising) has created a present duty.

  **The War:**
  Here, you must abandon your judgement. You resist calling it irrational, but if the *sole* reason for continuing is the soldiers already lost, it is the most dangerous form of irrationality there is.
  To continue a war because men have died is to gamble living men to justify dead men. The dead are not helped by further dying. The only rational justification for continuing a war is the future value of victory (security, justice, peace). If victory is unlikely, the past losses make withdrawal *more* urgent, not less, because they increase the debt of care owed to the survivors. You feel a difference here because of 'honour', but honour is a future-facing virtue (how we shall be remembered), not a backward-facing one. If continuing the war ensures more deaths without securing victory, it is not honourable; it is wasteful.

  **The Boat:**
  This is the most subtle case. You say the twelve years are 'part of what the boat is'. This is poetically true but logically suspect. The boat is wood and resin. The twelve years are in the *woman*.
  If she finishes the boat, does it bring her joy? Will she sail it? If yes, finish it. If no, then finishing it is an act of penance, not rationality. However, there is an exception: **Integrity of Self**. If abandoning the project would shatter her sense of herself as a person who finishes what they start, then finishing is rational *for her*. It preserves her future capacity for commitment. But if she hates the boat and hates herself for building it, stopping is the rational act. You should not call this 'irrational', but neither is it automatically rational. It depends on whether the completion serves her future self or merely services her past ego.

  **The Festival:**
  You are uneasy for a reason. A town is not a person, but it has an identity. If the festival binds the community, creates social cohesion, or defines the town's character to the outside world, it has future value. If it is held merely because 'we have always held it', it is irrational inertia. You ought to abandon the inclination to support it *unless* you can point to a present social benefit that would vanish if it stopped. Tradition is not a value in itself; it is a vessel for values. If the vessel is empty, break it.

  ### 2. The New Cases

  Here is how The Sovereignty of the Future applies to the scenarios you propose.

  **The Job and the Pension:**
  *Case:* A man stays in a job he dislikes because of the years put into the pension.
  *Verdict:* **Irrational.**
  *Reasoning:* The years are gone. They cannot be retrieved. The pension is a future asset, yes, but if the daily misery of the job outweighs the value of that future asset, he is paying too high a price. He should calculate the value of the pension against the cost of his future unhappiness. If the misery is great, he should leave. The years spent are a sunk cost. To stay is to throw good life after bad.

  **The Family Firm:**
  *Case:* A firm kept going out of duty to a dead founder.
  *Verdict:* **Conditional.**
  *Reasoning:* If the firm is losing money and has no future prospects, keeping it open to 'honour' the founder is irrational. The founder is dead; they do not benefit from the struggle. However, if the firm provides livelihoods for employees who are like family, or maintains a reputation that holds value for the heirs, then it is rational. Duty to the dead is a present psychological state; if it brings the living peace, it has value. If it brings them ruin, it is a ghost story. You should judge this by the future health of the living family, not the memory of the dead one.

  **The Hobby and the Equipment:**
  *Case:* Someone will not abandon a hobby because of the money tied up in equipment.
  *Verdict:* **Irrational.**
  *Reasoning:* This is identical to the magazine subscription. The equipment cost is sunk. If the hobby brings no joy, the equipment is merely clutter. Selling it recoups some value; keeping it 'just in case' occupies space and mental energy. The money is gone. The only question is: does using the equipment bring future pleasure? If not, sell it.

  ### 3. The Test

  You asked for a test you can apply on the spot to tell the two sorts of case apart (Sunk Cost vs. Constitutive Commitment). I propose **The Amnesia Test**.

  When you are tempted to continue something because of what you have put into it, ask yourself this:

  > **"If I had no memory of the cost I have already paid, but found myself exactly where I am now, would I choose to begin this today?"**

  *   **The Meal:** If you walked into the restaurant now, saw the half-eaten food, and knew nothing of the price, would you order it and eat it? No. **Stop.**
  *   **The War:** If you woke up today with no memory of the dead, but saw the current strategic situation, would you start this war now? If the answer is no, then the dead are not a reason to continue. **Stop.**
  *   **The Marathon:** If you woke up at mile 20, with no memory of training, but knew you had promised sponsors money upon completion, would you run? Yes, because the promise is a present contract. **Continue.**
  *   **The Boat:** If you walked into the garden today, saw a half-built boat, and had no memory of the twelve years, would you finish it? Only if you wanted a boat. If you don't want a boat, the years are irrelevant. **Decide based on desire for the object, not the labour.**
  *   **The Festival:** If you moved to the town today, with no history, would you start this festival? If not, why are you continuing it? **Stop, unless it serves a current social need.**

  ### Summary of Principles

  You do not need two principles, but you do need one principle with a specific clause.

  1.  **The Rule:** Never act to justify the past. Act only to secure the future.
  2.  **The Clause:** The past matters only if it has created a **Present Obligation** (a promise, a contract) or a **Present Identity** (a commitment to one's own integrity that affects future action).

  **Which judgements you ought to abandon:**
  1.  **The War:** You must accept that continuing a war solely because of past losses is irrational. It is emotionally understandable, but logically indefensible.
  2.  **The Boat:** You must stop viewing the years as 'in the boat'. They are in the woman. If the boat serves her future, finish it. If not, the years are wasted regardless of completion.
  3.  **The Festival:** You must abandon the idea that longevity itself is a justification. Two hundred years of error is still error.

  **Final Advice:**
  Your notebook shows you have a keen eye for the fallacy. Your hesitation comes from conflating *emotional cost* with *rational justification*. It hurts to waste. It feels dishonourable to quit. But pain and honour are feelings about the present; they are not debts owed to the past.

  Apply The Amnesia Test. It will cut through the dressing-up. If you would not start it fresh, you have no reason to finish it, unless you are bound by a promise to another. In that case, you are not finishing for the past; you are finishing for the future of your own integrity.
