prompt: |-
  My friend and I had a stupidly long arguement last night about the bed trick in Measure for Measure, and I want an actual reading of the play out of it, not a plot summary. She's a law student so she came at it through consent doctrine: Angelo dangles Claudio's execution over Isabella's head, she says no, the disguised Duke talks her into pretending to say yes, Mariana takes her place in the dark, Angelo sleeps with a woman he thinks is somebody else, and by the curtain he's married to Mariana, Claudio's reprieved, and the Duke is proposing to Isabella, who says absolutely nothing. Her line was that Mariana is the only person in the play who genuinely consented and she got exactly what she wanted, so basicly the play is fine with the whole business. My line was that it's a catalogue of every way consent can fail, and that the funniest and most disturbing thing in it is that the person whose consent is most obviously void is Angelo — he would never have agreed to sleep with Mariana, and the encounter only happens because he was lied to about who was in the bed. If a lie about who your partner is counts as the kind of lie that voids consent, then that isn't a seduction, it's a violation, of the very man who's trying to extort sex out of a novice who's already refused him twice. I couldn't get those two thoughts to sit together and I'd like someone to try.

  I'm leading the discussion on this play for a seminar in a couple weeks. So: what does the play think consent is — a mental state, a performance, something a third party can arrange on your behalf? Where does deception do the same work in it as coercion, and where does it do something else entirely? Which scenes should I put in front of people, and where does the play actually have a position as opposed to just enjoying its own cleverness? And does it eventually resist the consent framework — is there something about what it stages that the philosophical writing on consent still doesn't have a good grip on?
