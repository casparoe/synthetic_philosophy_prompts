answer: |-
  This is a fantastic tension to bring into a seminar, because it cuts to the heart of why *Measure for Measure* is classified as a "problem play." Your friend is reading the play as a **contractual resolution** (the deal was fulfilled, the marriage is valid, the life is saved), while you are reading it as a **phenomenology of agency** (who actually willed what, and under what conditions?).

  The reason you can't get those two thoughts to sit together is that the play itself refuses to reconcile them. It prioritizes *theological* justice over *legal* consent.

  Here is a reading of the play's mechanics of consent, deception, and agency to help you lead that seminar.

  ### 1. What does the play think consent is?
  The play presents consent not as a stable mental state, but as a **negotiable performance** that can be decoupled from the body.

  *   **Angelo's View (Consent as Transaction):** For Angelo, consent is a commodity extracted by power. He doesn't care about Isabella's desire; he cares about her submission. In his mind, if she says "yes" (even under duress), the contract is sealed.
  *   **The Duke's View (Consent as Therapy):** The Duke treats consent as secondary to *outcome*. He operates on a paternalistic model: he knows what is good for his subjects better than they do. He arranges consent *on behalf* of others (Isabella, Mariana, even Angelo).
  *   **Mariana's View (Consent as Restoration):** Your friend is right that Mariana consents. But look at *why*. She consents to a deception to validate a pre-contract (the *sponsalia per verba de praesenti* they had before Angelo abandoned her). For her, the bed trick isn't a new sexual encounter; it's the consummation of an existing vow. The play validates this specific archaic legal loophole to make the sex "legitimate."

  **The Seminar Point:** The play suggests that in a corrupt state (Vienna), genuine consent is impossible. Isabella is coerced by the state; Angelo is corrupted by power; Mariana is desperate. The Duke's intervention doesn't restore agency; it bypasses it. Consent becomes something *staged* rather than *felt*.

  ### 2. The Angelo Problem: Deception as Violation
  Your insight about Angelo is the sharpest thing in your argument. Under modern consent doctrine (and arguably early modern canon law regarding marriage consummation), **fraud in the factum** (lying about the nature of the act or the identity of the partner) voids consent.

  If Angelo believes he is sleeping with Isabella, but sleeps with Mariana, he has not consented to sex with Mariana.

  *   **Why the play ignores this:** The play is not interested in Angelo's rights; it is interested in Angelo's *guilt*. The Duke's logic is that Angelo's *intent* was to commit fornication with a novice. The fact that the body in the bed was his wife is a technicality that saves the soul (no sin of fornication) but condemns the man (proof of corruption).
  *   **Deception vs. Coercion:** You asked where deception does the same work as coercion. In Act 3, Scene 1, the Duke persuades Isabella to agree to the trick. He uses a theological argument: "It is no sin... it is a medicine for your brother." Here, deception is framed as **mercy**.
      *   Angelo's coercion is **tyranny** (using law to kill).
      *   The Duke's deception is **providence** (using lies to save).
      *   **The Trap:** The play asks the audience to accept that the *moral valence* of the deception depends on who is doing it. This is dangerous territory. It suggests consent violations are acceptable if the deceiver is the "rightful" authority figure.

  **For the Seminar:** Ask your class: *Is Angelo a victim of sexual assault in the bed trick?* If they say yes, ask: *Does the play care?* The text treats his subsequent horror not as a violation of his bodily autonomy, but as the moment his conscience finally catches up to his actions. The play sacrifices Angelo's agency to prove his guilt.

  ### 3. Key Scenes to Put in Front of People

  **A. Act 3, Scene 1 (The Duke persuades Isabella)**
  > *"The doubleness of the benefit defends the deceit from reproof."*
  This is the ethical core of the bed trick. The Duke argues that because two lives are saved (Claudio's life, Angelo's soul/reputation via marriage), the lie is justified.
  *   **Discussion Question:** Does the "benefit" actually defend the deceit? Does Isabella truly consent here, or is she bullied by the Duke's authority just as she was by Angelo's?

  **B. Act 4, Scene 1 (Mariana and Isabella)**
  > *"He is your husband on a pre-contract... To bring you thus together, 'tis no sin."*
  This is where your friend's argument holds water. Mariana is an active agent here. She *wants* this.
  *   **Discussion Question:** Does Mariana's enthusiastic consent sanitize the trick? Or does her desperation highlight how few options women have? She has to trick a man into sleeping with her to make him her husband. Is that agency or survival?

  **C. Act 5, Scene 1 (The Unmasking and Angelo's Confession)**
  > *"I am sorry that such sorrow I procure."*
  Note the ambiguity. Is he sorry he tried to rape Isabella? Or sorry he got caught?
  *   **Discussion Question:** Angelo is pardoned *before* Isabella speaks. The Duke decides the outcome before the victim has a say. Where is the justice in that?

  **D. The Final Silence (Isabella's non-response)**
  The Duke proposes. Isabella says nothing.
  *   **Discussion Question:** Is this a happy ending? Or is it the final erasure of her voice? She refused Angelo to save her chastity; now she is "rewarded" with marriage to a man who watched her beg for her life and manipulated her into a sex scheme. Is her silence consent, shock, or resistance?

  ### 4. Does the play resist the consent framework?
  Yes. And this is where you can synthesize your argument with your friend's.

  The play operates on a **theological framework**, not a legal one.
  *   **Legal Framework (Your Friend):** Contracts, consent, *quid pro quo*. By these metrics, the ending is a "settlement."
  *   **Theological Framework (The Play):** Sin, guilt, mercy, grace. By these metrics, everyone is guilty. Angelo is guilty of intent. Isabella is guilty of pride (perhaps). The Duke is guilty of meddling.

  The bed trick is a **deus ex machina** designed to navigate the impossibility of justice. If the law is followed strictly (Angelo's way), Claudio dies. If mercy is given freely (Isabella's way), Angelo goes unpunished. The bed trick creates a middle path where everyone is technically guilty but everyone is technically saved.

  **The Synthesis for your Seminar:**
  You and your friend are both right, but you are speaking different languages.
  *   **Your Friend** is right that the play *resolves* the plot through Mariana's consent. The mechanism works.
  *   **You** are right that the play *implicates* everyone in a violation of agency. The mechanism is morally rot.

  The play's "position" is that **human justice is impossible without messy, unethical intervention.** The Duke has to lie. Angelo has to be tricked. Isabella has to be silenced. The "happy ending" is not a triumph of consent; it is a triumph of **management**.

  ### 5. Leading the Discussion: The "Voided Consent" Angle
  To really make your point about Angelo stick, frame it through the concept of **Mens Rea (Guilty Mind)** vs. **Actus Reus (Guilty Act)**.

  *   Angelo had the *Mens Rea* (he intended to sleep with Isabella).
  *   He did not have the *Actus Reus* regarding Isabella (he slept with Mariana).
  *   However, he *did* have the *Actus Reus* regarding Mariana (he slept with her), but lacked the *Mens Rea* (he didn't know it was her).

  The Duke's judgment collapses this distinction. He punishes Angelo for the *intent*, regardless of the *reality* of the bed. This supports your argument: Angelo is punished for a crime he didn't technically commit (fornication with Isabella) and is bound to a marriage he didn't technically consent to (with Mariana).

  **The Kicker:**
  Ask the seminar: *If the Duke is the proxy for Shakespeare/Authority, what does it say that the only way to fix the state is to violate the consent of its citizens?*

  The play suggests that consent is a luxury of a healthy state. In a diseased state (Vienna), consent is a loophole that gets people killed. The "cure" requires a suspension of the rules. That doesn't make the play "fine" with the bed trick; it makes the play terrified of the alternative.

  **Summary for your opening:**
  "Measure for Measure isn't asking if the bed trick was consensual. It's asking if consent matters when the alternative is death. My friend argues the outcome justifies the means. I argue the means corrupt the outcome. The play, I think, agrees with me, but forces us to accept the corruption anyway."
