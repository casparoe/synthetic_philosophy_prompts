answer: |-
  1. **Vacuity (Main Question)**
  You argue that scripture is strictly about God's saving action and never about the "furniture of the world." But passages like Joshua 10 describe the sun standing still to lengthen a battle day—that's a cosmological claim embedded directly in a saving act. How do you excise the cosmology without amputating the sign itself?

  2. **Vacuity (Follow-up)**
  *(Likely answer: These are phenomenological descriptions accommodated to the ancient audience.)*
  If every cosmological claim is just accommodated phenomenology, is there any possible state of the physical world that scripture *could* have described that would have falsified your reading? Or is the division-of-labor rule itself immune to textual evidence?

  3. **Circularity (Main Question)**
  Your rule states that theology must yield when natural philosophy delivers a genuine demonstration. But identifying a "genuine demonstration" often requires knowing the truth of the matter already. How do you identify a demonstration without already having settled the interpretive dispute it's supposed to resolve?

  4. **Circularity (Follow-up)**
  *(Likely answer: Science has internal criteria for demonstration independent of theology.)*
  So what does your rule prescribe in real time, when competent scientists disagree? If half the community says geocentrism is demonstrated and half says heliocentrism, does theology freeze until the vote counts are clear?

  5. **Accommodation (Main Question)**
  You allow accommodation for cosmology because ancient Israelites weren't astronomers. But they also held views on morality and God's nature—divine violence, tribal election—that modern believers often struggle with. Why is God willing to accommodate mistaken physics but not mistaken ethics?

  6. **Accommodation (Follow-up)**
  *(Likely answer: Morality is prescriptive and normative, whereas physics is merely descriptive.)*
  But if the moral commands rely on cosmological assumptions—for instance, purity laws tied to bodily fluids or creation order—doesn't your principled difference collapse? Where exactly do you draw the line where accommodation stops being a courtesy and starts being deception?

  7. **Jurisdiction & Counterfactual (Main Question)**
  You argue the Galilean principle hands authority to whoever controls the demonstrations. But if a theologian claimed *they* controlled the demonstrations, would the principle look any different? Or is this really just a claim about who gets to decide?

  8. **Jurisdiction & Counterfactual (Follow-up)**
  *(Likely answer: It's about epistemic authority, not identity; the rule is structural.)*
  If Copernicus had never happened and geocentrism remained the settled science, would this division-of-labor rule even have been formulated? Or is this a rule we only adopt because it currently lets theology retreat from a fight it's losing?

  9. **Falsification (Closing Question)**
  Finally, what evidence from Galileo's letters or the historical record would actually convince you that you're wrong? What would a science-friendly Galileo look like to you, and do we have any trace of him?
