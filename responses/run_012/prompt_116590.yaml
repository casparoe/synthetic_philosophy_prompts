      *   *Refining the Argument:*
          *   Distinguish between *Asset Markets* (stocks) and *Prediction Markets* (events). The user's view holds better for prediction markets. I need to make sure I don't conflate them.
          *   The No-Trade theorem is a red herring *if* we accept noise traders.
