          *   Circularity is externalist solvable.
          *   Falsifiability is the Joint Hypothesis Problem.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the specific ranking request? Yes, need to draw a firm line.
      *   *Check:* Did I address the "conceded costs"? Yes, proponents admit prices aren't *perfect*, just *better*.
      *   *Check:* Is the Obamacare case strong enough? Intrade was the most liquid prediction market then. 75% probability is significant. It settled false. It's the standard counter-example in this literature.
      *   *Check:* Is the distinction between "price reflects info" and "price is truth" clear? The user says "guide to the truth."
