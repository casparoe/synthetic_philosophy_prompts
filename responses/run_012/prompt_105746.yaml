prompt: |-
  I lurk on LessWrong and read the Sequences years ago, so I can follow this kind of argument in shape but not in detail, and last week two people at our local meetup got into it about accuracy-first epistemology and I've been chewing on it ever since. I'm outsourcing the referee job.

  Roughly how it went:

  (1) Owen opened by saying the accuracy-first program basically settles what's wrong with incoherent credences. The way he told it: the only thing that makes a credence good or bad is how close it is to the truth, and once you fix any reasonable scoring rule for that closeness, it's a theorem that any set of credences that breaks the probability axioms is accuracy-dominated -- there's some coherent alternative that scores better no matter how the world turns out, at least in the usual finite cases. So probabilism gets justified without smuggling in extra assumptions about what you ought to believe.

  (2) Nina said she likes the theorem but thinks its being oversold. Her line: dominance only ever tells you "don't be incoherent." It never tells you what to actually believe -- it's silent on contents. So as a foundation it's weirdly empty; it explains why you shouldn't be a certain kind of irrational, but not why you should believe anything in particular.

  (3) Owen said that's fine and not a bug -- nobody claimed accuracy-first generates contents; the contents come from your evidence, and the framework's job is to explain the norms, not the inputs. And the norm it does explain is non-trivial: coherence is required no matter what your priors or goals are, so long as you care about accuracy at all.

  (4) Nina jumped on that last clause: "so long as you care about accuracy" is doing all the work. Why should accuracy be the only thing you care about, epistemically? She gave an example -- someone who cares more about having an explanation, or a settled picture of the world, or just understanding a thing, than about maximizing expected accuracy, isn't obviously irrational. Owen said if you don't care about accuracy you're not really in the business of believing at all, and that understanding and explanation are downstream of getting things right anyway.

  (5) Then Nina raised another one. She said accuracy-first treats true and false symmetrically -- a scoring rule just measures distance from the truth, so missing a truth and believing a falsehood get penalized in the same currency. But that's not how we actually reason, she says: we're often way more worried about not believing false things than about not missing true ones, and that asymmetry looks like a real epistemic value the framework can't even represent, let alone justify.

  (6) Owen's reply: the asymmetry isn't part of accuracy, it's a further fact about how you weight different kinds of error, and you can just build it in by picking a scoring rule that penalizes falsehood more heavily -- so the framework has room for it. Nina said that proves her point: if the asymmetry only shows up once you choose a scoring rule to encode it, then it isn't derived from accuracy-first, it's an extra assumption you fed in, and now you owe us a story about why that assumption is right. He said every normative theory has primitives, so that's not a special problem.

  They both turned to me and I had nothing. Can you go through moves (1)-(6) and rate each one from clearly mistaken to clearly right, saying what each of them is getting right and where each overreaches? And then the part I actually care about: is there a version of accuracy-first that survives Nina's symmetry complaint without just stipulating the asymmetry up front, or does the framework have to give up on being the whole story and become one epistemic value among several? Please write in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user is familiar with LessWrong/Sequences style reasoning but not the technical details of accuracy-first epistemology. They witnessed a debate between "Owen" (pro-accuracy-first) and "Nina" (critic) at a meetup.
      *   **Task:**
          1.  Evaluate moves (1) through (6) from the debate, rating them (mistaken to right) and explaining strengths/weaknesses.
          2.  Address the core question: Can accuracy-first survive Nina's symmetry complaint without stipulation, or must it become just one value among many?
      *   **Tone/Style:** American English, analytical, philosophical but accessible (matching the user's "lurker" background), acting as a referee.

  2.  **Deconstruct the Debate Moves:**

      *   **Move (1) Owen:** Accuracy-first justifies probabilism via accuracy dominance theorems (e.g., Joyce 1998, Predd et al. 2009).
          *   *Assessment:* Technically mostly right regarding the theorems (Joyce's argument). *Overreach:* Claiming it settles *what's wrong* without smuggling assumptions (e.g., admissibility of scoring rules, continuity, etc.).
      *   **Move (2) Nina:** Dominance tells you what *not* to be, not what *to* believe. It's empty of content.
          *   *Assessment:* Right. Probabilism is a constraint, not a generator of specific beliefs. It's a negative norm.
      *   **Move (3) Owen:** That's not a bug; evidence provides content, framework provides norms. Coherence is required if you care about accuracy.
          *   *Assessment:* Reasonable defense. Distinguishes structural norms from substantive inputs. *Weakness:* Assumes "caring about accuracy" is the only entry point.
      *   **Move (4) Nina:** Why care *only* about accuracy? What about understanding/explanation? Owen: If you don't care about accuracy, you aren't believing. Understanding is downstream.
          *   *Assessment:* Nina hits a nerve here (veritism vs. pluralism). Owen's reply is a bit definitional/stipulative ("not really in the business of believing").
      *   **Move (5) Nina:** Symmetry objection. Truth/Falsehood asymmetry (avoiding error vs. gaining truth) is real; accuracy treats them symmetrically (distance).
          *   *Assessment:* Strong point. Standard Brier score is symmetric. Epistemic utility often involves asymmetric weights (e.g., Jamesian will to believe).
      *   **Move (6) Owen:** You can build asymmetry into the scoring rule. Nina: Then it's an extra assumption, not derived from accuracy. Owen: All theories have primitives.
          *   *Assessment:* Owen is technically right (you *can* use asymmetric rules), but Nina is right that this undermines the "accuracy-only" reductionist claim. Owen's "all theories have primitives" is a standard philosophical retreat but weakens the "accuracy-first" unique selling point.

  3.  **Address the Core Question (Symmetry & Survival):**
      *   *The Problem:* Standard accuracy arguments (Joyce) rely on symmetric scoring rules (like Brier) to prove probabilism. If you allow asymmetric rules, do the theorems still hold?
      *   *Technical Detail:* Joyce's original argument required symmetry. Later work (e.g., Pettigrew, Levinstein) shows probabilism can be derived from a wider class of scoring rules, including some asymmetric ones, *but* extreme asymmetry can sometimes break the dominance argument or require specific constraints.
      *   *The "Veritism" Issue:* If accuracy is the *only* fundamental value (Veritism), how do we justify asymmetry? Usually, by arguing that false beliefs are more "distant" from the truth in a specific metric, or by appealing to practical consequences (which accuracy-first tries to avoid).
      *   *Resolution:* Accuracy-first can survive, but it likely needs to broaden its definition of "accuracy" (e.g., weighted accuracy) or admit that "accuracy" is a placeholder for a cluster of values (truth-seeking + error-avoidance). It probably cannot be the *whole* story if "understanding" is distinct from "accurate credence."
      *   *Verdict:* It survives as a structural framework, but fails as a complete reduction of all epistemic value to a single symmetric metric. It becomes "Accuracy-First among structural norms" rather than "Accuracy-First as the sole epistemic good."

  4.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the user's background (LW/Sequences). Set the stage.
      *   *Section 1: The Scorecard (Moves 1-6).* Go through each. Use ratings like "Mostly Right," "Overreaching," "Strong Objection."
          *   *Move 1:* Cite Joyce. Note the "no smuggling" claim is the weak point.
          *   *Move 2:* Solid. Coherence $\neq$ Content.
          *   *Move 3:* Standard defense. Valid distinction between structure/substance.
          *   *Move 4:* The "Veritism" clash. Owen's definition of belief is contentious.
          *   *Move 5:* The Symmetry Objection. This is the technical crux.
          *   *Move 6:* The "Primitives" defense. Owen concedes too much here.
      *   *Section 2: The Verdict (Symmetry & Survival).*
          *   Explain the technical nuance: Symmetric scoring rules (Brier) are convenient but not strictly necessary for the dominance theorems, *provided* the asymmetry isn't too wild.
          *   Discuss "Veritism" (Goldman/Joyce) vs. "Epistemic Pluralism."
          *   Answer the specific question: Can it survive without stipulation? Not really. You need a *reason* for the asymmetry.
          *   Conclusion: Accuracy-first works as a *constraint* (Owen's strong suit) but fails as a *complete axiology* (Nina's strong suit).
      *   *Tone Check:* Ensure American English spelling (e.g., "program" vs "programme", "defense" vs "defence"). Keep it analytical, slightly conversational but rigorous.

  5.  **Refining the Technical Points:**
      *   *Joyce's Argument:* Relies on "propriety" of scoring rules. Symmetry is often assumed for simplicity but strict propriety is the key.
      *   *Asymmetry:* If I penalize false positives much more than false negatives, does probabilism still hold? Yes, generally, as long as the scoring rule is *strictly proper*. But the *justification* for that specific weighting isn't "accuracy" alone; it's a value judgment about error types.
      *   *Nina's Point:* She's arguing for *Epistemic Utility Theory* nuances. The "Accuracy-First" label implies accuracy is the *sole* fundamental value. If you have to stipulate weights, you're admitting other values (like "caution") are influencing the metric.

  6.  **Final Polish:** Check against the prompt requirements.
      *   Rate moves 1-6? Yes.
      *   Say what they get right/wrong? Yes.
      *   Answer the survival question? Yes.
      *   American English? Yes.

      *(Self-Correction during drafting)*: I need to make sure I don't get too bogged down in the math of scoring rules. The user knows the "shape" of the argument. Focus on the philosophical implications of the math. Make sure to distinguish between "probabilism" (coherence) and "calibration/content" (what you believe).

      *Refining Move 1:* Owen claims "no smuggling." This is the most controversial part of Joyce's project. I should highlight that "continuity" and "extensionality" are assumptions.
      *Refining Move 6:* Owen's "all theories have primitives" is a stalemate move. I should point out that Accuracy-First claimed to have *fewer* or *better* primitives.

      *Final Plan:*
      1. Intro.
