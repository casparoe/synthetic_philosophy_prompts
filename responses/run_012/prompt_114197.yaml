answer: |-
  ### 1. The Essay Question

  **Prompt:**
  Hedonism claims that pleasure is the only thing good in itself. But "pleasure" seems to be a messy category. Consider these three cases:
  1.  **The Hard Run:** A run that felt awful the whole time, but you are glad you did it looking back.
  2.  **The Pizza:** You wanted the last slice badly for an hour, but eating it felt like nothing.
  3.  **The Tickling:** The physical sensation is identical, but it feels good when you're happy and annoying when you're irritated.

  If a hedonist says all value comes from pleasure, what do these cases say about what pleasure actually *is*? Do these examples show that hedonism is false, or do they just force us to change how we define pleasure? Defend your answer using all three cases.

  ***

  ### 2. Model Answer

  Hedonism stands or falls on whether "pleasure" is a real, identifiable thing that can carry the weight of all human value. If pleasure is just a specific sensation, like the taste of sugar, the three cases provided suggest hedonism is false. However, if we redefine pleasure as an attitude of approval rather than a physical feeling, the theory can survive. The examples show that we cannot build a theory on sensations alone; we must build it on how we relate to those sensations.

  The pizza case is the strongest evidence against the idea that "getting what you want" equals pleasure. You desired the pizza intensely, yet the consumption brought no positive feeling. If hedonism claims desire fulfillment is good only because it brings pleasure, this case severs that link. It shows that anticipation and satisfaction are distinct. A hedonist cannot simply say "you got what you wanted, so it was good." They must admit that sometimes the mechanism breaks. This forces the theory to focus on the actual experience of eating, not the wanting. Since the experience was neutral, the hedonist must concede this was not a "good" moment, even if the desire was strong. This clarifies the theory: value lies in the feeling, not the fulfillment.

  The tickling case attacks the idea that pleasure is a physical sensation. The nerves firing on your skin are the same in both scenarios. If pleasure were a physical input, tickling would always be good or always be bad. Since it flips based on your mood, pleasure must be a mental interpretation of that input. This supports an "attitudinal" view of hedonism. You are not enjoying the skin sensation; you are enjoying the context. This saves hedonism from being disproven by physics, but it makes pleasure much harder to measure. It's no longer about counting units of sensation; it's about assessing your mental stance.

  The hard run is the hardest case for hedonism. During the activity, the balance was clearly pain. Yet, you value the memory. A strict hedonist might say you are misremembering the pain. But a more honest view is that you take pleasure in the *meaning* of the run, not the *sensation*. You approve of the fact that you did it. This fits the attitudinal view: you can take pleasure in a painful event if you endorse what it represents. This stretches the definition of pleasure, but it keeps the theory intact. It allows hedonism to explain why we value hard things without admitting there are goods other than pleasure.

  Ultimately, these cases do not destroy hedonism, but they strip it of its simplicity. If pleasure is a sensation, the theory fails because there is no common thread linking a bruise, a math proof, and a pizza. But if pleasure is "being glad something is happening," the theory holds. You can be glad about a hard run, unglad about a pizza, and contextually glad about tickling. Hedonism survives, but it becomes a theory about evaluation, not just feeling.

  **Confidence Note for the Teacher:**
  I am about 85% confident in this analysis. The point I am least sure about is the handling of the "Hard Run." Some philosophers argue that valuing a painful past experience proves there are non-hedonic goods (like achievement) that are valuable regardless of any current "gladness." If a student argues that the run was valuable *because it was hard*, even if they aren't glad about it now, that is a strong objection I haven't fully defeated here.

  ***

  ### 3. Marking Scheme (Out of 20)

  **A-Grade Moves (Required for 17-20 marks)**
  *   **Explicit Definition (4 pts):** Clearly defines what "pleasure" means in their argument (e.g., sensation vs. attitude).
      *   *Common Error:* Using the word "pleasure" without saying what they think it actually is.
  *   **Case Integration (6 pts):** Uses all three cases not just as examples, but as tests that force a change in the theory.
      *   *Common Error:* Listing the cases separately without connecting them to the main argument.
  *   **Nuanced Conclusion (6 pts):** Acknowledges that hedonism changes shape (survives but gets complicated) rather than a simple "true/false."
      *   *Common Error:* Saying "Hedonism is wrong" without explaining how a hedonist might fix it.
  *   **Clarity & Structure (4 pts):** Logical flow, clear paragraphs, accessible language.
      *   *Common Error:* Jumping between points without transition sentences.

  **Specific Mistakes & Deductions**
  *   **The "Sensation" Trap (-5 marks):** Treating pleasure as only a physical feeling (like sweetness) and ignoring the context/mood cases.
      *   *Note:* Students usually ignore the tickling case because it's harder to explain physically.
  *   **The "Desire" Confusion (-5 marks):** Arguing that getting the pizza was good because they wanted it, ignoring the lack of pleasure.
      *   *Note:* Students often confuse "getting what you want" with hedonism automatically.
  *   **Ignoring the Prompt (-10 marks):** Failing to use one or more of the three required cases.
      *   *Note:* The "Hard Run" is the most commonly dropped case because it involves time/memory.
  *   **Contradiction (-5 marks):** Claiming hedonism is false because pleasure is messy, then arguing we should chase pleasure anyway.
      *   *Note:* Students often slip back into advising hedonism after disproving it.
