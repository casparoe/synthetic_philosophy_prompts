      *   **Task:** Adjudicate the exchange move by move. Identify right/wrong claims, missing elements, address the separability thesis, address the "bad for someone" criterion (aversion vs. outrunning it), and declare a winner (stronger position).

  2.  **Deconstruct the Cases:**
