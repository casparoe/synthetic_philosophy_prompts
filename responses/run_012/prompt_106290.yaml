      *   *Claim 3:* Inverted asymbolia confirms badness tracks affect, not sensation.
      *   *Claim 4:* Calling pain bad for an indifferent patient is paternalistic. Badness must connect to what the subject cares about/finds unpleasant.
      *   *Claim 5:* Withdrawal in asymbolia could be reflex, not evidence of badness.

