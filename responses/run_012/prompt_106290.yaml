      *   **Inverted Asymbolia (Hypothetical):** Sensory pain absent (reports no pain), affective distress present (behavioral/autonomic signs, describes episode as "bad").
      *   **Core Question:** Is the *badness* of pain separable from the *sensory experience*?

  3.  **Analyze Mara's Position:**
