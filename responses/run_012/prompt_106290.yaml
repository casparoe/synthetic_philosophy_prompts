      *   *Move 3 (Mara on Paternalism):* Argues for a subjectivist theory of welfare (badness requires negative experience). *Verdict:* Philosophically robust (hedonistic/experiential welfare).
      *   *Move 3 (Dev on Paternalism):* Argues for objective list/desire satisfaction independent of current attitude. Analogy to tumors is strong for *health*, weak for *experience*. *Verdict:* Strong on health, weak on phenomenology.
