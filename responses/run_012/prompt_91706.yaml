answer: |-
  This is a classic dispute in the philosophy of social science, and your friend is echoing a position made famous by Peter Winch in the mid-twentieth century. The core of his argument is that social life is rule-governed like language, and therefore studying it requires understanding meanings rather than searching for causal laws. To audit this analogy, we need to look closely at how the relationship between grammar and sentences actually compares to the relationship between norms and actions.

  The analogy holds up well when we consider what makes an action count as a specific kind of action. In linguistics, grammar is constitutive. It does not exist before the language; it is the structure that makes a string of words intelligible as a sentence rather than noise. Similarly, in social life, norms often define what an action is. Raising a hand is just a physical movement, but in a classroom, under certain norms, it counts as a request to speak. Without the norm, the movement lacks that specific social meaning. In this sense, your friend is right that norms make actions intelligible. You cannot identify the action as a vote, a promise, or an insult without referencing the rules that give it those labels. This is the part of the analogy doing the real work. It successfully argues that social science cannot be purely observational in the way biology might be; you need to understand the internal logic of the actors.

  However, the analogy begins to fray when we move from definition to motivation. Grammar makes a sentence possible, but it does not explain why a speaker chose to utter this sentence rather than that one. Both I am hungry and I am full are grammatically correct. Grammar constrains the form, but it does not determine the content or the impulse to speak. In contrast, Weber is not arguing that Calvinism made capitalist action intelligible in a void. He is arguing that the specific content of the belief created a psychological anxiety about salvation that pushed people toward specific behaviors, like hard work and accumulation, to alleviate that anxiety. Norms often carry sanctions, both social and internal. If you violate grammar, you are misunderstood. If you violate a social norm, you might be ostracized, punished, or feel guilt. These sanctions exert a causal pressure that grammar does not. Grammar does not punish you for a solecism; society punishes you for a transgression. This difference is scenery in your friend's argument, but it is actually the engine of Weber's causal claim.

  The most significant breakage in the analogy concerns the direction of fit. Grammar is generally descriptive of how language is used, or perhaps a logical framework, but it does not typically act as a tool to achieve an end. Values and beliefs, however, are often instrumental or teleological. People hold them to achieve salvation, status, or order. When Weber argues that beliefs caused behaviors, he is suggesting a mechanism where a mental state leads to a physical outcome. The grammar analogy tries to dissolve this mechanism into a logical relationship. It claims that because we need norms to describe the action, the norms cannot be the cause of the action. This is a category error. Something can be both the lens through which we understand an event and the force that brought it about. A map makes a journey intelligible, but the terrain described by the map causally determines how hard the hike is. Your friend assumes that intelligibility excludes causality, but in the social world, they are often intertwined.

  Does the conclusion survive these breakages? I do not think it does. The analogy supports the idea that we must interpret actions to understand them, but it fails to prove that beliefs cannot be causal forces. It shows that norms are necessary conditions for certain social actions to exist as such, but it does not show they are insufficient to trigger those actions. If the analogy were perfect, changing a culture's beliefs would be like changing a language's grammar: a slow, structural shift that doesn't explain specific utterances. But history shows that shifts in belief can lead to rapid, specific changes in behavior, which looks much more like a causal intervention than a grammatical shift. The analogy was carrying the conclusion almost entirely. Once you expose the difference between linguistic rules and social sanctions, the argument that norms cannot push anybody along collapses.

  A better analogy for your purposes, given your background, would be Weber's own preferred image of the switchman. He wrote that ideas determine the tracks along which the dynamic of interest has pushed action. Interests are the engine, the locomotive, but beliefs are the switchmen that determine which track the train takes. This preserves the causal power of material interests while acknowledging the causal power of beliefs to channel those interests in specific directions. Alternatively, think of a metabolic pathway. The enzymes and structures make the reaction intelligible within biochemistry, defining what is possible. But the presence or absence of a specific regulator causally determines whether the flux happens. This captures both the constitutive role of the structure and the causal role of the specific variable.

  I am highly confident in this assessment of the philosophical argument, as the limitations of the grammar analogy are well-documented in post-Winch literature. Philosophers like Martin Hollis and Steven Lukes have spent considerable effort showing why rule-following models cannot fully account for causal explanation in social science. However, the single point I am least sure about is the precise nature of grammatical compulsion in modern psycholinguistics. I am treating grammar here as a logical framework, but some cognitive scientists argue that grammatical structures do causally constrain thought processes in real-time. If grammar does causally limit what thoughts can be formulated, the analogy might be stronger than I have allowed, though it still would not rule out additional causal forces like sanctions.

  For a biologist, the evidence that would settle this looks much like the evidence you used in your career. You would look for counterfactual dependence. If Calvinist beliefs were removed or held constant while material conditions changed, would the capitalist behaviors persist? Weber attempted this by comparing Protestant and Catholic regions. You would also look for a mechanism. Can you trace the pathway from the belief to the action? In biology, you look for the signaling cascade. In social science, you look for the psychological or institutional pathway. If believers report feeling anxious about idle time and describe work as a remedy, and if this report correlates with actual hours worked across different populations, you have evidence of a causal mechanism. The grammar analogy tries to tell you that looking for this mechanism is a mistake, but your scientific instinct to ask what makes a difference to what is the correct one here. Beliefs can be causes precisely because they change the calculations and pressures facing the actor.
