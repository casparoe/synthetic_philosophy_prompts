  **FINAL EXAMINATION: LOGIC AND METAPHYSICS (MODULE CODE: PH304)**
  **SECTION B: TAKE-HOME ESSAY**

  **Instructions:** Answer the following question. Your response should be between 600 and 800 words.

  **Question 1**

  For the purposes of this question, adopt the following stipulative definitions:

  *   **Thin Dialetheism:** The view that some contradictions are true, but only in a bounded class of cases (typically semantic and set-theoretic paradoxes), and that outside those cases classical reasoning is perfectly fine.
  *   **Thick Dialetheism:** The view that true contradictions tell us something deep about truth, negation, and the structure of reality, so classical logic is not merely locally inapplicable but systematically wrong.

  Using these distinctions, address the following three points:

  (a) Provide the strongest philosophical motivation for adopting *thin* dialetheism rather than *thick* dialetheism. Why might one wish to restrict the scope of true contradictions?

  (b) Explain the most serious internal problem facing *thin* dialetheism. Specifically, consider the resources required to maintain the boundary between the 'bounded cases' and ordinary discourse.

  (c) Evaluate the stability of paraconsistency *without* dialetheism (i.e., adopting a non-explosive logic while maintaining that no contradictions are actually true). Is this a coherent standalone position, or merely a way-station that collapses into one of the views above?

  ***

  **MODEL ANSWER**

  The primary motivation for thin dialetheism over thick dialetheism is pragmatic conservatism. Classical logic underpins the vast majority of successful scientific and everyday reasoning. If one adopts thick dialetheism, one risks invalidating classical inference rules, such as Disjunctive Syllogism, across all domains. This imposes a heavy cognitive and theoretical cost. The thin dialetheist argues that we should minimise revision; if we can isolate the pathology to specific limit-cases like the Liar paradox or Russell's set, we preserve the utility of classical logic for physics, mathematics, and daily life. The goal is damage limitation: accept the glut where forced by paradox, but quarantine it to prevent contamination of ordinary truth-talk.

  However, this quarantine strategy faces a severe meta-logical problem. To establish the boundary between the 'bounded cases' where contradictions hold and the 'classical cases' where they do not, one must employ reasoning. Typically, this meta-reasoning is classical. The thin dialetheist argues that *outside* the paradoxical zone, classical logic holds. But this argument itself is conducted in a meta-language. If the meta-language is classical, the dialetheist presupposes the validity of classical logic to justify its own limitation. This is circular. If the meta-language is paraconsistent, the boundary itself becomes porous; a contradiction in the meta-language could imply that the boundary both exists and does not exist. Consequently, the thin dialetheist struggles to articulate the scope of their view without relying on the very logical principles they claim fail at the limit. The attempt to localise the failure of classical logic often requires global classical assumptions to define the locality.

  Regarding paraconsistency without dialetheism, the position is stable only if one adopts an instrumentalist view of logic. If logic is merely a tool for modelling inference rather than a description of metaphysical reality, one can reject Explosion (*ex contradictione quodlibet*) without accepting true contradictions. For instance, one might argue that contradictions indicate a failure of information or meaning rather than a feature of the world. On this view, paraconsistent logic prevents garbage output from contradictory input, but does not endorse the input as true.

  However, this position faces pressure to collapse into thick dialetheism or classical monism. If paraconsistent logic is the correct account of logical consequence, one must explain *why* Explosion fails. If it fails because reality cannot sustain it, we remain classical. If it fails because the logical connectives are defined differently (e.g., via relevant implication), we must ask whether these connectives capture 'truth'. If they do, and they allow non-explosive contradictions, the distinction between 'accepting the logic' and 'accepting the truth of contradictions' blurs. Conversely, if one denies true contradictions entirely, one might prefer paracomplete logic (truth-value gaps) over paraconsistent logic (truth-value gluts). Therefore, paraconsistency without dialetheism is stable only as a semantic or epistemic constraint, not a metaphysical one. It risks being ad hoc unless accompanied by a robust theory of truth that explains why contradictions are non-explosive yet false. Ultimately, while logically coherent, it is philosophically precarious; it often serves as a defensive manoeuvre for those unwilling to accept the metaphysical commitments of thick dialetheism while recognising the formal utility of paraconsistent systems.

  ***

  **MARKING SCHEME (Total: 25 Marks)**

  | Criteria | Marks | Specific Moves & Mistakes | Typical Trip-Up |
  | :--- | :---: | :--- | :--- |
  | **Part (a): Motivation for Thin Dialetheism** | **0–8** | **First-Class (7-8):** Clearly articulates 'pragmatic conservatism' or 'minimal revisionism'. Notes that classical logic works for science/everyday life and thick dialetheism threatens this. <br> **Pass (4-6):** Mentions saving classical logic but lacks philosophical depth. <br> **Fail (0-3):** Conflates thin/thick or suggests thin dialetheism denies contradictions. | Candidates often argue thin dialetheism *denies* contradictions outside paradoxes, rather than accepting them only *inside* paradoxes. |
  | **Part (b): The Internal Problem** | **0–8** | **First-Class (7-8):** Identifies meta-logical instability. Notes that defining the boundary requires logic, usually classical, creating circularity or 'revenge'. <br> **Pass (4-6):** Identifies a problem (e.g., 'hard to draw line') but misses the meta-logical circularity. <br> **Fail (0-3):** Claims the problem is simply that paradoxes are confusing. | Students frequently describe the Liar paradox itself rather than the problem *for the view* of thin dialetheism. |
  | **Part (c): Paraconsistency without Dialetheism** | **0–6** | **First-Class (5-6):** Distinguishes logic (consequence) from metaphysics (truth). Argues stability depends on instrumentalism vs. realism. <br> **Pass (3-4):** Says it is stable/unstable but lacks justification. <br> **Fail (0-2):** Equates paraconsistency with dialetheism. | Candidates often assume adopting paraconsistent logic *entails* believing contradictions are true. |
  | **Structure & Clarity** | **0–3** | **First-Class (3):** Concise, British English spelling (analyse, centre), follows word count. <br> **Pass (2):** Minor errors, readable. <br> **Fail (0-1):** Disorganised or wrong spelling convention. | Using American spelling ('analyze') in a British university context. |

  **General Penalties:**
  *   **Conflating Paraconsistency and Dialetheism:** Deduct 5 marks total. (Paraconsistency is a property of a logic; dialetheism is a view about truth).
  *   **Explosion Misunderstanding:** Deduct 3 marks if candidate claims Explosion is a theorem of *all* logic rather than classical logic.
  *   **Truth-Value Confusion:** Deduct 3 marks if candidate reads 'both true and false' as 'neither true nor false' (confusing gluts with gaps).
