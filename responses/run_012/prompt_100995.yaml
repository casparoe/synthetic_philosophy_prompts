  # JOINT STATEMENT ON THE AGGREGATION OF HARM
  **Signed:** The Aggregativist (A) & The Discontinuitarian (D)
  **Date:** October 26, 2023
  **Subject:** Resolution of Framework for Policy Trade-offs Involving Severity vs. Scale

  ## 1. SHARED CLAIMS
  We, the undersigned, agree to the following foundational premises. These claims delineate the boundary of our agreement and isolate the precise locus of our disagreement.

  1.  **Definition of Aggregation:** We agree that "aggregation" refers to the mathematical or normative operation of summing distinct units of harm to determine a total moral weight. We agree that some form of aggregation is necessary for decision-making (e.g., saving two lives is preferable to saving one, all else being equal).
  2.  **The Nature of the Numbers:** We agree that the number of affected individuals ($N$) is a morally relevant variable. We disagree on whether $N$ is *decisive* when the severity of harm per individual ($H$) differs lexically.
  3.  **Verbal Disagreements:** We acknowledge that a portion of our dispute is terminological.
      *   (A) uses "harm" to denote a single scalar quantity of negative experience.
      *   (D) uses "harm" to denote a category of experience where severity dictates moral kind, not just moral amount.
      *   We agree that clarifying these definitions does not dissolve the substantive disagreement regarding policy outcomes.
  4.  **The Baseline Comparison:** We agree that for a single individual, torture is worse than a dust speck. We agree that for a fixed severity, more victims is worse than fewer victims. Our disagreement arises only when severity and scale vary inversely.
  5.  **Policy Intent:** We agree that the goal of this committee is to minimize overall moral badness. We disagree on the formula for calculating "overall."

  ## 2. RESIDUAL DISAGREEMENTS
  The following table summarizes the irreducible conflict. Each position is phrased in terms the signer accepts as accurate to their view.

  | Feature | The Aggregativist (A) | The Discontinuitarian (D) |
  | :--- | :--- | :--- |
  | **Commensurability** | All harms share a common currency of "suffering units." Differences are of degree, not kind. | Severe harms and trivial harms belong to different moral orders. They are not fully convertible. |
  | **The Summation Rule** | Total Badness = $\sum (\text{Intensity} \times \text{Duration} \times \text{Count})$. | Total Badness is determined primarily by the *maximum severity* experienced by any individual. Count acts only as a tie-breaker within severity classes. |
  | **The Discontinuity** | The harm scale is continuous. There is no "floor" below which harms cease to count toward a total. | There is a lexical floor. Trivial harms, even in infinite quantity, cannot sum to outweigh a severe harm above the floor. |
  | **The Verdict** | For sufficiently large $N$, $N$ dust specks are worse than 1 torture. | For any finite $N$, 1 torture is worse than $N$ dust specks. |

  ## 3. CRUXES AND TEST CASES
  The following are specific sub-questions where empirical intuition or logical consistency could force one or both parties to revise their position. For each crux, we specify a case, the bearing it has, and our advance predictions.

  ### Crux 1: The Sorites Bridge
  **Question:** Is there a chain of intermediate harms connecting "dust speck" to "torture" such that no adjacent link seems morally significant?
  **Case:** A spectrum of 1,000,000 harms, where Harm$_1$ is a dust speck, Harm$_{1,000,000}$ is torture, and Harm$_{i}$ is imperceptibly worse than Harm$_{i-1}$.
  **Bearing:** If (D) admits that small differences aggregate across the chain, the lexical floor collapses. If (A) admits a jump in moral weight occurs somewhere, the continuous scale is false.
  *   **(A) Prediction:** Value slides continuously. No single step justifies a lexical jump.
  *   **(D) Prediction:** At some point along the chain, a "category shift" occurs (e.g., from annoyance to injury, injury to trauma). The jump is real, even if the phenomenological steps are small.

  ### Crux 2: The "Ruined Life" Threshold
  **Question:** Can a life be made objectively worse by trivial harms alone than by a single severe event?
  **Case:** Person X experiences 1 hour of torture. Person Y experiences a dust speck every minute for 80 years (awake).
  **Bearing:** If (D) concedes Person Y's life is worse, aggregation holds intrapersonally. If (A) concedes Person X's life is definitively worse regardless of Y's duration, severity trumps duration.
  *   **(A) Prediction:** Person Y's life is worse. The total sum of negative utility exceeds X's.
  *   **(D) Prediction:** Person X's life is worse. The *character* of X's suffering defines the life's tragedy in a way Y's annoyance does not.

  ## 4. SPECIFIC CASE HANDLING
  Per the committee's request, we explicitly address two variations of the core puzzle.

  ### Case A: Intrapersonal Aggregation (One Life)
  **Scenario:** The trivial harms ($N$ dust specks) fall on a **single individual** over time, rather than distributed across a population. The alternative remains one individual undergoing torture.
  **Question:** Does the verdict change?

  | Signer | Verdict Change? | Grounds for Position |
  | :--- | :--- | :--- |
  | **(A)** | **No.** | The locus of suffering does not alter the arithmetic. One person suffering $N$ units is morally equivalent to $N$ people suffering 1 unit. The sum is the sum. |
  | **(D)** | **No.** (With nuance) | While we acknowledge intuition is stronger for aggregation within a single life, our principle rests on *severity*, not *distribution*. A life defined by torture is qualitatively distinct from a life defined by annoyance, regardless of the annoyance's frequency. However, we concede that if the trivial harms accumulated to a *moderate* injury (e.g., permanent eye damage from specks), the verdict might flip. But so long as the harm remains "trivial" in kind, severity dominates. |

  ### Case B: The Dial (Function of N)
  **Scenario:** A device has a dial. Setting it to **T** inflicts fixed severe suffering on 1 person. Setting it to **S(N)** inflicts a momentary trivial nuisance on $N$ people. We vary $N$ from 1 to $\infty$.
  **Requirement:** Commit to the shape of the verdict as a function of $N$.

  | Signer | Shape of Verdict | Condition for Error (Falsification) |
  | :--- | :--- | :--- |
  | **(A)** | **Monotone Curve with Crossover.** <br> Moral badness of S(N) rises linearly with $N$. At some finite $N^*$, Badness(S($N^*$)) > Badness(T). | I would be mistaken if, upon observing $N$ approaching infinity, I still felt a persistent moral intuition that T was worse. If the "repugnance" of the trade-off does not diminish as $N$ grows, my additive model is flawed. |
  | **(D)** | **Asymptote (Threshold at Infinity).** <br> Moral badness of S(N) rises with $N$ but approaches a ceiling strictly below Badness(T). There is no finite $N$ where S(N) > T. | I would be mistaken if there exists a specific $N$ where the trivial nuisance actively *destroys* the victims' lives (e.g., $N$ is so large the nuisance causes fatal accidents or systemic collapse). If the "trivial" harm ceases to be trivial due to scale, my lexical floor fails. |

  ## 5. CONCLUSION FOR POLICY APPLICATION
  Until one of the falsification conditions above is met, we agree to proceed with the following protocol for the Risk Committee:

  1.  **Severity First:** Policies must prioritize the avoidance of severe harm (the "floor" harms) over the avoidance of trivial harm.
  2.  **Scale Second:** Where severity is equal, policies must minimize the number of affected individuals.
  3.  **Documentation:** Any policy that chooses to impose severe harm on a few to spare trivial harm from the many must be explicitly flagged as an **Aggregativist Exception**, requiring (D)'s explicit review. Any policy that imposes trivial harm on the many to spare severe harm from the few is a **Discontinuitarian Standard**, requiring (A)'s explicit review.

  We sign this not because we agree on the truth, but because we agree on the terms of our disagreement.

  _________________________
  **The Aggregativist**

  _________________________
  **The Discontinuitarian**
