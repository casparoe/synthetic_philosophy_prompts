answer: |-
  Here is a plan for the 90-minute session, structured to build the conceptual apparatus before asking the counterfactual question, using a single robust example, and flagging the contested terrain.

  ### 1. The Conceptual Order (Validating and Tweaking Your Hypothesis)

  You are largely right, but there is a prerequisite step you need to install before "Increasing Returns." If you jump straight to increasing returns, economists will hear "monopoly" and historians will hear "context." You need to establish the **temporal structure** first.

  **The Required Sequence:**
  1.  **Sequence Sensitivity (The Null Model):** Before they can understand path dependence, they must understand what *isn't* path dependence. You need a baseline model where order doesn't matter (e.g., a standard equilibrium model or a deterministic teleology). If the order of events $A \rightarrow B \rightarrow C$ yields the same outcome as $C \rightarrow B \rightarrow A$, you don't have path dependence yet.
  2.  **Positive Feedback (The Mechanism):** Once they accept that order matters, you need the engine. Why does the early event constrain the later ones? This is where Increasing Returns/Network Effects live.
  3.  **Multiple Equilibria (The Structure):** This is the result of the mechanism. If there were only one possible stable outcome, the path wouldn't matter; the system would always converge there. You need them to see the *possibility space* of other stable states.
  4.  **The Counterfactual (The Question):** Only now can you ask, "Would the same outcome have arrived anyway?" because you have established that (a) order matters, (b) the mechanism amplifies early differences, and (c) other stable worlds were possible.

  **Correction to your hypothesis:** You suspected Multiple Equilibria depends on Increasing Returns. Correct. But Increasing Returns depends on **Sequence Sensitivity**. If the system is ergodic (history washes out), increasing returns won't create lock-in, just temporary fluctuations.

  ---

  ### 2. The Core Example: The Railroad Gauge (Stephenson vs. Brunel)

  I recommend **The Standardization of the Railroad Gauge (4'8.5" vs. 7' Broad Gauge)** over QWERTY or VHS.

  **Why this example?**
  *   **For Historians:** It is archival, material, and central to 19th-century industrial history.
  *   **For Economists:** It is a classic coordination game with network effects (tracks must match stations and other tracks).
  *   **For Social Ontology:** It demonstrates how a physical constraint (the width of a track) is actually a social fact (sustained by agreement and infrastructure).
  *   **Why not QWERTY:** You avoid the Liebowitz/Margolis trap (whether QWERTY is technically inferior is empirically messy).
  *   **Why not VHS:** VHS risks reducing to "marketing won," which obscures the *structural* lock-in.
  *   **Why Gauge:** Isambard Kingdom Brunel's "Broad Gauge" (7 feet) was technically superior (more stable, faster) but lost to George Stephenson's "Standard Gauge" (4'8.5").

  **What the example MUST have:**
  *   **The Small Accident:** Stephenson's gauge wasn't chosen by a committee for optimality; it derived from pre-existing coal wagon wheels in Newcastle. It was a local legacy constraint.
  *   **The Positive Feedback:** As more track was laid to Stephenson's gauge, the cost of switching rolling stock or laying new broad gauge track increased non-linearly.
  *   **The Surviving Rival:** Brunel's Great Western Railway used Broad Gauge for decades. It wasn't immediately extinguished; it was slowly starved of connectivity.
  *   **The Lock-in:** By 1846 (Gauge Act), the Standard was legally codified. Switching costs became prohibitive.

  **What the example MUST NOT have:**
  *   **Do not claim** Stephenson's gauge was "inefficient." Claim it was *arbitrary*. Efficiency implies a metric; arbitrariness implies contingency. This prevents the "was it actually better?" debate from hijacking the session.
  *   **Do not claim** it was literally irreversible. The gauge *was* eventually changed in the West (1892), but only at massive cost. This nuances the "lock-in" concept.

  ---

  ### 3. The 90-Minute Sequence & Misconception Management

  **0:00 – 0:15 | Phase 1: The Null Model (Sequence Sensitivity)**
  *   **Activity:** Ask: "If we built the UK rail system today from scratch, would we choose 4'8.5"?" (Most will say no). "If we built it in 1830 from scratch, would we choose it?" (Debatable).
  *   **Concept:** Contrast **Convergence** (all roads lead to Rome regardless of start) vs. **Divergence** (start point determines end point).
  *   **Head Off Misconception (i) "Path Dependence = History Matters":** Explicitly state: "All history matters. Path dependence is a specific claim that *early* events matter *more* than later events, disproportionately to their size." Distinguish it from standard historical causation.

  **0:15 – 0:40 | Phase 2: The Mechanism (Positive Feedback)**
  *   **Activity:** Map the feedback loop. More Stephenson track $\rightarrow$ more Stephenson engines $\rightarrow$ cheaper Stephenson parts $\rightarrow$ more Stephenson track.
  *   **Concept:** Increasing Returns. The payoff for adopting the standard increases as more people adopt it.
  *   **Head Off Misconception (iv) "Contingency = Randomness":** Emphasize that the initial choice (coal wagon wheels) had *causes*, but those causes were local and unrelated to the global system's needs. Contingency is not "uncaused"; it is "underdetermined by system requirements."
  *   **Head Off Misconception (ii) "Lock-in = Irreversible":** Note that the Broad Gauge survived for 60 years. Lock-in is not a prison; it is a steep hill. You can climb out, but you need a lot of energy (capital).

  **0:40 – 0:65 | Phase 3: The Structure (Multiple Equilibria)**
  *   **Activity:** Draw the landscape. Valley A (Stephenson), Valley B (Brunel). Once in Valley A, you can't see Valley B.
  *   **Concept:** Equifinality is *false* here. There are multiple stable states.
  *   **Head Off Misconception (iii) "Path Dependence = Inefficiency":** This is crucial. Brunel's gauge was arguably *more* efficient technically. Path dependence can lock in the *better* technology too. The definition relies on *contingency*, not *sub-optimality*.
  *   **Head Off Misconception (v) "Path Dependence = Determinism":** (The one you might be missing). Students often think "locked in" means "inevitable from the start." Clarify: It was contingent at $T_0$, deterministic at $T_{100}$. The necessity is generated over time, not present at the origin.

  **0:65 – 0:85 | Phase 4: The Counterfactual (Necessity vs. Contingency)**
  *   **Activity:** Pose the question: "If the Newcastle coal wagons had been 5 inches wider, would the British Empire run on a different gauge?"
  *   **Concept:** This is now a well-posed question because they have the mechanism (feedback) and the structure (multiple equilibria).
  *   **Discussion:** What would it take to switch? A crisis? A war? A technological reset?

  **0:85 – 0:90 | Phase 5: The Assessment Question**
  *   **The Question:** *"Identify a specific piece of evidence that would **falsify** the claim that the Railroad Gauge is path dependent."*
  *   **Why this works:** A student who only learned vocabulary will say "If Brunel had won." A student who understands the concept will say "If we found evidence that the 4'8.5" gauge was chosen by a central committee in 1830 specifically because it was the unique optimal solution across all possible future scenarios, rendering the coal wagon origin story irrelevant." They need to identify that **deliberate optimization** kills the path dependence claim.

  ---

  ### 4. What Not to Settle in the Room

  You must explicitly refuse to settle these three points. They are rabbit holes that will eat the session and are philosophically unresolved.

  1.  **The Frequency Claim:** Do not settle how *common* path dependence is in history. (Is it the rule or the exception?)
  2.  **The Normative Claim:** Do not settle whether "lock-in" is bad. (Sometimes stability is a feature, not a bug.)
  3.  **The Empirical Access Claim:** Do not claim we can *know* the counterfactual. (We can model it, but we cannot observe the replayed tape.)

  ---

  ### 5. Contested Claims Flag (For Your Preparation)

  You asked to flag which parts of this plan rest on settled consensus vs. live controversy. Here is the breakdown so you can mark the "live wires" for the students.

  **A. The Mechanism (Increasing Returns/Network Effects)**
  *   **Status:** **Settled.**
  *   **Note:** Everyone agrees these mechanisms exist. The math of positive feedback is standard in complexity economics and social ontology.
  *   **Teaching Stance:** Present this as the "engine." No need to hedge.

  **B. The Prevalence of Lock-In**
  *   **Status:** **Genuinely Contested.**
  *   **The Fight:** Brian Arthur/Paul David (Path Dependence is ubiquitous) vs. Stan Liebowitz/Stephen Margolis (Lock-in is rare; markets usually correct "mistakes" before they harden).
  *   **Teaching Stance:** Mark this explicitly. *"We are using this example to understand the **logic** of lock-in, not to claim that all history is locked in. Economists debate how often this actually happens."*

  **C. The Inefficiency Claim**
  *   **Status:** **Genuinely Contested (and often misunderstood).**
  *   **The Fight:** The classic definition (David 1985) implies remediability (we could have been better off). Critics argue that if switching costs are high, the outcome is *by definition* efficient given the constraints.
  *   **Teaching Stance:** This is why I chose Railroad Gauge over QWERTY. With Gauge, you can say: *"Brunel's was technically smoother, but Stephenson's was 'good enough' + first. Whether that counts as 'inefficiency' depends on if you count switching costs in your welfare calculation. We will bracket the normative judgment."*

  **D. The Empirics of the Counterfactual**
  *   **Status:** **Philosophically Contested.**
  *   **The Fight:** Can historical counterfactuals be truth-apt? (Analytic philosophers of history debate this). Cliometricians try to model them; narrative historians often reject them.
  *   **Teaching Stance:** *"We are using the counterfactual as a **heuristic tool** to reveal the structure of the actual history, not as a claim that we can predict the alternative timeline."*

  ### Summary of Dependencies for the Board
  If you draw the dependency graph for the students, it should look like this:

  1.  **Sequence Sensitivity** (Order matters)
      $\downarrow$
  2.  **Positive Feedback** (Early advantages amplify)
      $\downarrow$
  3.  **Multiple Equilibria** (Other stable outcomes were possible)
      $\downarrow$
  4.  **Counterfactual Question** (Was this outcome necessary?)

  If you skip #1, they think it's just causation. If you skip #2, they think it's just chance. If you skip #3, they think the outcome was inevitable. Only then does #4 make sense.
