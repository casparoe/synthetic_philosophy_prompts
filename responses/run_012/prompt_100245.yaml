answer: |-
  ### I. The Mapping of the Emigration Analogy

  To audit the analogy, we must first make its architecture explicit. Your friend maps the decision to have a child onto the decision to emigrate as follows:

  *   **The Destination:** The country $\rightarrow$ The life of parenthood (or the world with a child in it).
  *   **The Guidebooks:** Travel literature $\rightarrow$ Parenting books, advice from friends, sociological data.
  *   **The Language:** The tongue spoken abroad $\rightarrow$ The skills of caregiving, emotional regulation, and the specific "vocabulary" of parent-child interaction.
  *   **The Departure:** The journey/flight $\rightarrow$ Conception, pregnancy, and birth.
  *   **The Arrival:** Stepping off the plane $\rightarrow$ The moment the child arrives home.
  *   **The Inhabitants:** Locals living in the country $\rightarrow$ Existing parents.
  *   **The Traveller:** The emigrant $\rightarrow$ The prospective parent.
  *   **The Transformation:** Becoming an expatriate $\rightarrow$ Becoming a parent.

  The friend's argument rests on the **Epistemic Gap**: just as you cannot know the *qualia* of living in France until you live there, you cannot know the *qualia* of parenthood until you are a parent. Because this gap is unbridgeable by reason, she argues, rational deliberation is futile, and the tie should be broken by action ("one should go").

  Here is where the mapping fractures.

  ### II. The Audit: Three Disanalogies

  #### 1. Reversibility (The Ticket Home)
  **The Mapping:** The analogy assumes that if the destination is unbearable, the traveller can purchase a return ticket.
  **The Break:** Emigration is reversible; parenthood is not. An emigrant can become an exile or a returnee. A parent cannot become a non-parent. Even in cases of adoption or estrangement, the biological and normative tie remains; the "country" of parenthood, once entered, claims jurisdiction over you permanently.
  **The Consequence:** The friend's conclusion ("one should go") relies on a risk calculus that assumes errors are corrigible. In travel, a bad move is an adventure or a lesson; in parenthood, a bad move is a life sentence for two beings. The irreversibility does not make deliberation pointless; it makes the *cost of error* infinitely higher. If the knowledge is unavailable, but the stakes are permanent, the rational response is not "leap blindly" but "hesitate until the desire to leap outweighs the fear of the fall." The analogy imports a safety net from the travel case that does not exist in the parental case.

  #### 2. Ontological Status (The Determinate Destination)
  **The Mapping:** The analogy assumes the destination exists independently of the traveller. France exists whether you visit or not; its geography is fixed, and its inhabitants know its contours.
  **The Break:** The "country" of parenthood does not exist prior to the decision. It is not a place you discover; it is a reality you co-create. There are no "inhabitants" who know *your* destination, because your destination is constituted by *your* specific child and *your* specific relationship to them. Other parents are not locals in your country; they are locals in *theirs*.
  **The Consequence:** In the travel case, testimony is reliable because the object of testimony is stable. In the parental case, testimony is inherently limited because the object is indeterminate. If there is no settled fact about the "life on the other side," then the epistemic gap is not merely a lack of experience (as in travel); it is a lack of *object*. You cannot reason about a thing that does not yet exist. However, this does not license action; it licenses **creation**. One does not decide to emigrate based on whether one likes building nations; one decides based on whether one likes the destination. Since there is no destination to like, the decision must be about the *act of creation itself*, not the *quality of the place*. The friend's argument fails because it treats parenthood as a consumer choice (visiting a place) rather than a generative act (building a place).

  #### 3. Identity and Evaluation (The Stable Evaluator)
  **The Mapping:** The analogy assumes the person who weighs the decision is the same person who lives the outcome, or at least that their standards of evaluation remain stable enough to compare the two states.
  **The Break:** Parenthood is what philosopher L.A. Paul calls a **transformative experience**. It does not just change your circumstances; it changes your *preferences*, your *values*, and your *cognitive architecture*. The "you" that arrives is not the "you" that departed. The pre-parent self values sleep, autonomy, and spontaneity. The post-parent self may value dependency, routine, and sacrifice.
  **The Consequence:** In the travel case, I can judge whether moving to France was "good" because my core self remains to judge it. In the parental case, the post-parent self may declare the choice "good" based on new values that the pre-parent self finds alien or repugnant. The pre-parent self cannot use the post-parent self's satisfaction as evidence, because that satisfaction was purchased with the death of the pre-parent's values. The analogy silently assumes that the standards of evaluation survive the crossing. They do not. Therefore, standard rational deliberation (weighing pros and cons) is indeed impossible, but not because "knowledge is unavailable." It is impossible because **there is no common currency** between the chooser and the chosen.

  ### III. The Verdict on the Friend's Conclusion

  Does the conclusion survive? **No.**

  The friend argues: *Because you cannot know the outcome, deliberation is pointless, so you should act.*
  This is a non-sequitur even in the travel case (one might deliberate on finances, safety, or career), but it collapses completely under the disanalogies above.

  1.  **Irreversibility** means that acting without knowledge is not an adventure; it is a gamble with permanent stakes.
  2.  **Ontological Indeterminacy** means you are not choosing a known good; you are choosing to generate a new good.
  3.  **Transformative Identity** means you cannot trust your future self's endorsement to validate your current self's risk.

  The analogy was carrying the conclusion all along by smuggling in the assumptions of **reversibility** and **stable identity**. Once those are removed, the epistemic gap no longer suggests "just go"; it suggests "proceed only if you are willing to accept the creation of a new self and a new world without knowing if you will like either." That is a much higher bar than "buy a ticket."

  ### IV. A Better Analogy

  If emigration fails because it implies discovery, stability, and return, we need an analogy that implies **creation, irreversibility, and transformation.**

  **The Analogy: Building a House You Must Inhabit.**

  *   **The Correspondence:**
      *   **The Plan:** Parenting books/advice (often idealized).
      *   **The Construction:** Pregnancy, birth, and raising the child.
      *   **The House:** The family life that results.
      *   **The Inhabitants:** Initially none; you and the child become them together.
      *   **Reversibility:** You cannot un-build the house; you can only abandon it (which leaves a ruin).
      *   **Transformation:** The act of building changes your body, your skills, and your taste in living.

  *   **What This Analogy Licenses:**
      1.  **Deliberation on Capacity, Not Outcome:** You do not decide to build based on whether the house *will be* beautiful (you cannot know); you decide based on whether you are *willing to build*. It shifts the question from "Will I be happy?" to "Do I want to undertake this labor?"
      2.  **Acceptance of Co-Creation:** It acknowledges that the "house" will not match the "plan." The walls may be crooked; the light may fall differently. It licenses the expectation of surprise without licensing the expectation of success.
      3.  **The Permanence of Commitment:** It captures the moral weight. You are responsible for the structure. If it leaks, you cannot simply move to a hotel; you must fix the roof.

  *   **What This Analogy Does Not License:**
      1.  **The "Just Go" Conclusion:** One does not say, "Since I cannot know what the house will look like, I should just start pouring concrete." One checks the foundation, the budget, and the structural integrity of one's own life first.
      2.  **Guarantees of Satisfaction:** It makes clear that you may end up living in a house you would not have chosen to buy, but which you must now maintain.
      3.  **External Validation:** Other homeowners can tell you about *their* houses, but they cannot tell you how *yours* will stand.

  **Summary:**
  Your friend's analogy treats parenthood as a **consumer choice** (visiting a country). The reality is a **generative commitment** (building a home). The former licenses a leap of faith based on curiosity; the latter licenses a leap of faith based on **vocation**. You do not decide to have a child because you know you will like the life; you decide because you are willing to be the person who creates that life, whoever that person turns out to be. Deliberation is not about predicting the future; it is about assessing your willingness to surrender the right to predict it.
