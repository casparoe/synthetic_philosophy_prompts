  You rightly identify a tension that tempts many to collapse into either pure utilitarianism or strict Kantianism, but the distinction holds if we recognize that moral significance arises from different capacities serving different moral functions. The feature that makes suffering a cost is sentience, which animals possess, but the feature required for inviolability is the capacity to shape a life according to an overall conception of the good, which they lack. Sentience grounds the utilitarian cost because pain is an intrinsic evil that diminishes the quality of existence regardless of who experiences it, whereas side-constraints protect the distinctively human capacity for rational autonomy. Thus, a cow's suffering counts heavily against us because it is real suffering, but the cow lacks the rational autonomy that makes a person inviolable, meaning we may sacrifice the cow's interests for a person's end if the utilitarian calculus permits, whereas we may never sacrifice a person merely to maximize aggregate welfare. The ground I stand on is that rights are the protective shell around a life-plan, while moral weights are the recognition of felt experience, and animals possess the latter without the former.
