prompt: |-
  I've more or less adopted predictive processing as my default way of thinking about minds — the brain as a prediction machine, perception as inference, action as a way of making the world fit the prediction, and the free energy principle as the thing that supposedly ties perception, action, learning and motivation into one story. I'd like you to argue the other side properly: what would actualy count against it?

  The bit I care most about is that this is really several claims stacked on top of each other, and I don't think they stand or fall together. There's the free energy principle as a formal claim about any system that manages to keep existing; there's predictive coding as a claim about the actual machinery — error signals, precision weighting, message passing up and down; and there's active inference as a claim about behaviour and motivation. I want to know where the weight actually sits, and whether a defeater at one level touches the others. Related: if the formal principle turns out to be true of anything you can draw a boundary around, is that vacuity, or is a principle of that kind allowed to be that way?

  Specifically:

  - what result, experiment or model comparison would make you say predictive coding had lost to a rival account of the same data? Not "it's vague" — an actual discriminating prediction, and which rival it discriminates against.
  - is the treatment of motivation a real unification or a relabelling? I mean the move where wanting something becomes a matter of high-precision priors over outcomes, so desire and expectation turn out to be the same kind of thing handled by different machinery. Is there a case — motivated reasoning, wishful thinking, self-deception, grief, something around addiction — where that predicts a pattern we don't observe, or misses one we do?
  - the dark room. I know the standard escape; what I want to know is whether the escape costs the theory anything, and what a principled version of it has to say about systems that really do nothing at all.
  - what a comitted defender would themselves concede counts against the view, as opposed to what critics say from the sidelines.
  - and finally: has the framework been qualified into unfalsifiability, and if it has, is that actually a problem for a principle like this, or just the price of a unifying framework? If you think it's well insulated, say so, and say whether that's a bug or a feature.

  I'd be most moved by a case where the framework commits itself to some specific odd pattern of behaviour and the pattern doesn't turn up, so weight things that way rather than giving me a survey. If some of the defeaters only bite for someone who already accepts a rival framework, flag that — that's useful to know too. And don't give me citations or a reading list, you'd be guessing and I can't check them anyway.

  British English please.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Stance:** The user is a proponent of Predictive Processing (PP), Predictive Coding (PC), Active Inference (AI), and the Free Energy Principle (FEP). They use it as their default framework.
      *   **Goal:** They want a robust argument *against* it (the "other side").
      *   **Key Distinction:** They recognise the hierarchy: FEP (formal/mathematical) $\rightarrow$ PC (neural implementation) $\rightarrow$ AI (behaviour/motivation). They want to know if defeaters at one level affect the others.
      *   **Specific Questions:**
          1.  What specific experiment/result would make PC lose to a rival? (Needs discriminating predictions).
          2.  Is the treatment of motivation (desire = high-precision prior) a unification or a relabelling? (Look for failures in addiction, grief, wishful thinking).
          3.  The Dark Room problem: Does the escape cost the theory anything? What about systems that do nothing?
          4.  What would a *committed defender* concede counts against it? (Internal critique vs. external sniping).
          5.  Is it unfalsifiable? If so, is that a bug or a feature?
      *   **Constraint:** No citations/reading lists (guessing risk). British English. Focus on specific odd patterns of behaviour that *should* appear but don't.

  2.  **Deconstruct the Framework (Mental Sandbox):**
      *   *FEP:* Mathematical claim about non-equilibrium steady states. Hard to falsify directly because it's very abstract. Risk of tautology ("things that exist minimise free energy").
      *   *PC:* Neural mechanism. Hierarchical Bayesian inference. Prediction errors passed up, predictions down. Precision weighting is key.
      *   *AI:* Action minimises expected free energy. Preference = prior over outcomes.
      *   *The "Stack":* If PC is wrong neurally, FEP might still be true mathematically. If AI is wrong behaviourally, PC might still work for perception.

  3.  **Drafting the Arguments (Iterative Process):**

      *   **Point 1: Discriminating Predictions (PC vs. Rivals).**
          *   *Rival:* Classical control theory or Hebbian learning/Reservoir computing.
          *   *Prediction:* PC relies heavily on *separate* channels for predictions and errors (layer 5/6 vs layer 2/3 in cortex).
          *   *Defeater:* If we find that cortical microcircuitry doesn't segregate these signals, or if plasticity rules are purely Hebbian without explicit error terms modulated by precision.
          *   *Specific:* The "Precision Weighting" mechanism. PC says attention = gain control on error units. If attention modulates *prediction* units instead, or if attention is purely feedforward without feedback gain control, PC takes a hit.
          *   *Rival:* Simple associative networks. If a network learns complex sequences without explicit hierarchical error correction (e.g., via echo state networks), PC isn't *necessary*.

      *   **Point 2: Motivation (Desire vs. Expectation).**
          *   *The Claim:* Wanting $X$ is believing $X$ will happen (with high precision).
          *   *The Problem:* Wishful thinking/Delusion. If I want $X$ strongly, PP says I should update my belief that $X$ is likely. But often, we want something and *know* it won't happen (grief, addiction).
          *   *Specific Defeater:* Addiction. An addict wants the drug (high prior on outcome?) but often predicts withdrawal. If the prior is high, why does the prediction error persist? The standard answer is "habitual vs goal-directed" or "precision on policies." But if the theory requires endless ad-hoc precision adjustments to explain why people don't just hallucinate their desires fulfilled, it loses parsimony.
          *   *Grief:* Grief is maintaining a model of a lost loved one. PP says this is high free energy. Why persist? The "escape" is that updating the model is too costly (deep priors). But this risks making the theory explain everything by adjusting "costs."
          *   *Crucial Test:* If desire and expectation are the same currency, disrupting expectation (e.g., via psychedelics or lesions) should disrupt desire proportionally. If we can dissociate 'wanting' (incentive salience) from 'liking' (hedonic impact) and 'expecting' (prediction) neurally, PP's unification is strained. Berridge's work (though no citations allowed) suggests these are distinct systems. PP needs to map them all to precision/priors without losing the distinction.

      *   **Point 3: The Dark Room.**
          *   *The Problem:* Minimising surprise $\rightarrow$ sit in a dark room forever.
          *   *The Escape:* We have priors that say "you need to eat/mate."
          *   *The Cost:* This moves the goalposts. Why do we have *those* priors? Evolution. But then FEP isn't doing the work; natural selection is. FEP becomes a description, not an explanation.
          *   *Systems that do nothing:* Crystals? Rocks? FEP applies to any Markov blanket. If a rock minimises free energy just by existing, the principle is vacuous regarding *agency*.
          *   *Defeater:* If we find an organism that *does* seek sensory deprivation (some deep sea creatures? hibernation?) PP says this is minimising free energy. But if an organism actively destroys its own sensors to stop error, does PP distinguish this from suicide? The distinction between "minimising error" and "minimising expected error over time" is subtle. If the theory can't distinguish self-preservation from self-annihilation without importing external values, it's incomplete.

      *   **Point 4: Committed Defender Concessions.**
          *   *What would Friston et al. admit?* Probably that the *neural implementation* (PC) is the weakest link. The math (FEP) is robust, the behaviour (AI) is plausible, but the specific cortical column story is speculative.
          *   *Concession:* They would admit that "precision estimation" is the 'homunculus' problem. Who estimates the precision? If it's another layer of inference, where does it stop?
          *   *Concession:* Timescales. FEP works well on slow timescales. Fast reactive behaviour (reflexes) looks more like control theory than Bayesian inference.

      *   **Point 5: Unfalsifiability.**
          *   *Is it a tautology?* "Things that survive minimise free energy" = "Things that survive survive."
          *   *Bug or Feature?* If it's a 'principle' like natural selection, it's a framework, not a model. Natural selection is also hard to falsify directly but generates testable models.
          *   *The Risk:* If every behaviour can be retrofitted as "minimising expected free energy under prior X," it's unfalsifiable.
          *   *The Test:* It must constrain the *space of possible priors*. If any prior is allowed, it's empty. If FEP predicts *which* priors are biologically plausible, it's testable.

  4.  **Refining and Polishing (British English & Tone):**
      *   Tone: Rigorous, philosophical, slightly sceptical but respectful.
      *   Language: "Behaviour" not "behavior", "modelling" not "modeling", "prioritise" not "prioritize".
      *   Structure: Address the user's specific bullet points in order, but weave the "stack" distinction throughout.

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I give citations? *No.*
      *   *Check:* Did I address the "stack" (FEP vs PC vs AI)? *Yes, need to ensure I distinguish when a critique hits the math vs the biology.*
      *   *Check:* Is the "Dark Room" answer nuanced? *Avoid the standard "we have priors for homeostasis" line. Push on why those priors exist.*
      *   *Check:* Motivation section. *Focus on the dissociation between 'wanting' and 'expecting'.*
      *   *Check:* Unfalsifiability. *Distinguish between a mathematical tautology and a scientific theory.*

  6.  **Final Polish:** Ensure the distinction between "FEP is true but useless" and "FEP is false" is clear. The user asked what would count *against* it. I need to make sure I don't just say "it's vague." I need specific failure modes.

      *   *Idea for PC failure:* If neural noise is not Gaussian. PC assumes Gaussian noise for tractability. If biological noise is heavily skewed or impulsive, the math breaks.
      *   *Idea for AI failure:* If organisms maximise variance (exploration) even when it increases immediate free energy, without a long-term gain model. (Though AI handles this via 'information gain', does it handle *play*?)
      *   *Idea for Motivation:* The "Othello error". Assuming the system is rational. What if the system is systematically irrational in ways not explained by precision weighting?

  7.  **Finalising the Argument Structure:**
      *   Intro: Acknowledge the stack.
      *   Section 1: The Neural Implementation (PC). Focus on anatomy and noise statistics.
      *   Section 2: Motivation & Desire. Focus on the 'wanting vs believing' dissociation.
      *   Section 3: The Dark Room & Vacuity. Focus on the origin of priors.
      *   Section 4: Defender Concessions. The 'As-If' problem.
      *   Section 5: Unfalsifiability. Principle vs Theory.
      *   Conclusion: Summary of where the weight sits.

  8.  *(Self-Correction on British English)*: Ensure spellings are correct (behaviour, modelling, programme, etc.). Ensure tone is appropriately reserved but sharp.

  9.  *(Final check on constraints)*: No citations. No reading list. Focus on specific odd patterns.

