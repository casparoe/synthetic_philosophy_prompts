answer: |-
  You are quite right to separate the stack. The Free Energy Principle (FEP) as a mathematical claim, Predictive Coding (PC) as a neural implementation, and Active Inference (AI) as a behavioural account are distinct enough that a bullet in one need not kill the others. However, the persuasive power of the framework relies on them holding together. If the biology is wrong, the maths becomes a metaphor. If the behaviour is wrong, the biology becomes a mechanism for nothing.

  Here is the case against the framework, structured by your specific concerns.

  ### 1. Discriminating Predictions: Where Predictive Coding Could Lose
  You asked for a specific result, not vagueness. The most vulnerable point is the specific neural microcircuitry proposed by PC. The standard model posits a anatomical segregation: superficial pyramidal cells send prediction errors up, deep pyramidal cells send predictions down, and inhibitory interneurons manage the precision weighting (gain control).

  **The Defeater:**
  If we establish definitively that cortical layers do not segregate 'prediction' and 'error' signals, but rather transmit mixed selectivity codes that cannot be linearly disentangled into those two variables, PC loses to a rival account like **Reservoir Computing** or **Echo State Networks**.

  In PC, learning requires a specific directionality of error propagation to update weights. In reservoir computing, a fixed, recurrent random network projects to a readout layer; learning happens only at the readout. If it turns out that the cortex learns primarily by tuning readouts from a fixed, high-dimensional dynamical system (rather than updating hierarchical weights via back-propagated errors), then the 'coding' part of Predictive Coding is false.

  **Specific Experiment:**
  Use high-resolution optogenetics to silence superficial layers during a learning task. PC predicts learning should halt because the error signal cannot ascend. If learning persists because the deep layers can adjust weights based on local coherence alone (Hebbian plasticity without global error signals), PC is falsified in favour of local plasticity rules.

  Furthermore, PC assumes noise is roughly Gaussian to make the integrals tractable. If neural noise is demonstrated to be fundamentally non-Gaussian (e.g., heavy-tailed or impulsive) in a way that the brain exploits rather than suppresses, the variational calculus underpinning the 'inference' claim breaks down. The brain might be exploiting noise, not averaging it out.

  ### 2. Motivation: Unification or Relabelling?
  This is the weakest link in the stack. The move to treat 'desire' as a 'high-precision prior over outcomes' is elegant, but it risks conflating distinct phenomenological and functional states.

  **The Problem of Dissociation:**
  In addiction and incentive salience, we observe a dissociation between 'wanting' and 'expecting'. An addict may want a drug with overwhelming intensity while fully expecting (believing with high precision) that taking it will lead to misery. In the PP framework, a high-precision prior on an outcome should drive action to make that outcome true. But if the agent expects misery, that is a high-precision prior on a *negative* outcome.

  To save the theory, proponents argue that the 'prior' is on the *relief* of withdrawal, not the misery. But this becomes a 'just-so' story unless we can independently measure the prior. If we can measure expectation (via report or physiological anticipation of the negative consequence) and desire (via willingness to work) separately, and they diverge systematically, the claim that they are the same mathematical object (a prior) is strained.

  **The Specific Odd Pattern:**
  Consider **grief**. Grief is the persistence of a model of a loved one who no longer exists. This generates massive, perpetual prediction error. According to FEP, the system should update the model to minimise this error (accept they are gone). Often, it does not. The standard defence is that the prior is too deep, or the precision on the 'they are gone' sensory data is down-regulated (denial).

  However, if PP is correct, severe depression should look like an over-weighting of negative priors. But we also see depression as a lack of motivation to act. If action is just inference, why does the inference not lead to action? The theory must posit a specific failure in 'precision on policies'. If we find a neurological condition where belief updating is intact, but the translation of those beliefs into action is severed (abulia), and this maps to a specific circuit that PP claims should be unified, the unification fails. If 'wanting' and 'believing' can be lesioned separately, they are likely not the same currency.

  ### 3. The Dark Room and the Cost of the Escape
  You know the standard escape: we have priors that dictate we must eat, mate, and maintain homeostasis, so we cannot just sit in a dark room.

  **The Cost:**
  The cost is that the FEP ceases to be an explanation of *why* organisms act, and becomes a description of *how* they act given that they already want to live. It offloads the explanatory burden onto evolution. If the only reason you don't sit in a dark room is that natural selection gave you a prior against it, then FEP is not a theory of motivation; it is a theory of control.

  **The Principled Version:**
  A principled version of FEP must explain the *origin* of those priors. If it cannot, it cannot distinguish between a living organism and a thermostat. A thermostat minimises free energy (surprise relative to a set point). If the FEP applies to anything with a Markov blanket, including a rock (which resists dissolution), then it explains nothing specific about minds.

  **The Defeater:**
  If we discover a biological system that actively seeks to minimise its own sensory intake to the point of dormancy without immediate threat (beyond simple hibernation which is homeostatic), and does so *without* a change in homeostatic needs, PP struggles. Some deep-sea organisms or parasites effectively 'switch off' large parts of their sensing and acting machinery. If an organism minimises free energy by becoming less sensitive to the world rather than acting to change it, the 'Active' in Active Inference is weakened. The theory must explain why action is preferred to sensory attenuation. If the answer is always "because of a prior," the theory is insulated from data.

  ### 4. What a Committed Defender Would Concede
  A sophisticated defender (someone like Friston or Clark at their most candid) would concede the **'As-If' problem**.

  They would admit that the brain is likely not performing literal Bayesian integration. The integrals are too complex. The claim is that the brain acts *as if* it is minimising free energy. This concedes that the machinery (PC) is an approximation, perhaps a very rough one.

  They would also concede the **Timescale Problem**. FEP works beautifully on slow, deliberative timescales. It is much harder to make it fit fast, reactive behaviours (like catching a ball or a reflex). A defender would concede that for fast loops, simple control theory or coupled oscillators might be a better description, and that FEP is a 'slow variable' envelope around faster dynamics. If it turns out that *most* behaviour is fast and reactive, FEP becomes a theory of the exception, not the rule.

  Finally, they would concede the **Homunculus of Precision**. Who estimates the precision? If precision weighting is itself an inference, it requires a higher-order estimate of precision, leading to an infinite regress. The defender must concede there is a 'bottom level' of precision that is hard-wired, not inferred. This breaks the purity of the 'all is inference' claim.

  ### 5. Unfalsifiability: Bug or Feature?
  Has the framework been qualified into unfalsifiability? To a degree, yes. Because any behaviour can be retrofitted as 'minimising expected free energy under some prior', it is difficult to prove wrong.

  **Is this a problem?**
  If FEP is a **Principle** (like Natural Selection), unfalsifiability is a feature. Natural Selection is tautological ('those who survive, survive'), but it generates falsifiable models. If FEP is a **Theory** of specific neural mechanisms, unfalsifiability is a bug.

  **The Verdict:**
  Currently, FEP sits in a dangerous middle ground. It is too mathematical to be ignored, but too flexible to be pinned down.
  *   **It is a bug** if it prevents us from asking 'why this prior?'. If every behaviour is explained by positing a new prior, we have not explained anything.
  *   **It is a feature** if it constrains the *space* of possible priors. If FEP can predict *which* priors are biologically plausible without observing them first, it is scientific.

  **The Critical Test:**
  The framework is falsified if it cannot constrain the hypothesis space. If a researcher can model a rat running a maze equally well with 'reward maximisation' and 'free energy minimisation' without any difference in parameter fitting or predictive power, then FEP is just a re-description. It must make a prediction that reward-based models *cannot*.
  For example: Reward models predict agents will seek high reward. FEP predicts agents will seek *information* (epistemic value) even at the cost of reward, to reduce uncertainty. If we find that organisms *never* sacrifice reward for information in contexts where FEP says they should (because the expected free energy of information gain is high), then the 'epistemic' part of the theory is wrong.

  ### Summary of the Weight
  The weight sits on **Active Inference**, not the Free Energy Principle.
  *   **FEP** is likely mathematically true but potentially vacuous (true of rocks).
  *   **Predictive Coding** is empirically vulnerable (anatomy might not match).
  *   **Active Inference** is the claim that matters for psychology.

  If Active Inference cannot distinguish 'desire' from 'expectation' without ad-hoc precision adjustments, it is a relabelling. If it cannot explain why we don't sit in dark rooms without importing evolutionary priors it doesn't explain, it is incomplete.

  A committed critic would say: "Show me a behaviour that *only* makes sense under Free Energy minimisation and makes no sense under Reward Maximisation or Control Theory." Until that specific pattern is isolated and verified, the framework remains a powerful metaphor rather than a settled mechanism. The risk is not that it is wrong, but that it is **too right** — true of everything, and therefore specific to nothing.
