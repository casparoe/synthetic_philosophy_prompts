answer: |-
  **To:** Founding Committee
  **From:** [Your Name]
  **Subject:** Procedure for Avoiding Recursive Rulemaking Paradoxes

  ### 1. The "Inviolate Level": Theory vs. Reality
  Your hunch is correct, but it is not a philosopher's toy. In legal theory, this is H.L.A. Hart's "Rule of Recognition." In practice, for a UK co-op, **the inviolate level is your Registered Rulebook filed with the Financial Conduct Authority (FCA).**

  You cannot solve this problem purely internally. If every rule is changeable by the group, the group can dissolve its own authority. You need a hierarchy:
  1.  **Registered Rules (Constitution):** Hard to change (usually 75% vote + FCA registration). This is the "sheet."
  2.  **Standing Orders/Policies:** Easier to change (50% or 66%). These are the "hands."

  If you try to write a single document that does both, you will create the tangles you describe.

  ### 2. The Recursion Test (Procedure for Committee)
  Run every proposed rule through these five questions. If you hit a "Stop," you must restructure the rule or move it to a higher document level.

  **Step 1: Identify the Actor and the Target**
  *   **Question:** Who is acting (A), and who/what is being acted upon (T)?
  *   **Acceptable Answer:** A and T are distinct (e.g., Board acts on Member).
  *   **Stop Condition:** A and T are identical or overlapping (e.g., Board acts on Board).
  *   **Fix:** Split the roles. The Board cannot discipline itself; the General Meeting must discipline the Board.

  **Step 2: Identify the Adjudicator**
  *   **Question:** If A and T disagree on whether the rule was followed, who decides (D)?
  *   **Acceptable Answer:** D is a specific role or body defined *elsewhere* (e.g., The Secretary, an External Auditor, the General Meeting).
  *   **Stop Condition:** D is the same as A, or D's authority depends on the very rule being disputed.
  *   **Fix:** Move the definition of D to a higher-level document (Registered Rules).

  **Step 3: Check the Source of Authority**
  *   **Question:** Where does D get the power to decide?
  *   **Acceptable Answer:** From a rule that is harder to change than the rule being disputed.
  *   **Stop Condition:** D gets power from the same rule they are adjudicating.
  *   **Fix:** Hierarchy. The power to judge rule-changes must sit in the Constitution, not the Standing Orders.

  **Step 4: Test for Infinite Regress**
  *   **Question:** Can D's decision be appealed? If yes, to whom?
  *   **Acceptable Answer:** To a final body (e.g., General Meeting or Court).
  *   **Stop Condition:** The appeal process requires a decision on whether the appeal is valid, but no one is authorised to make that decision.
  *   **Fix:** Assign procedural validation to a neutral officer (e.g., Secretary) whose own position is secure.

  **Step 5: The Entrenchment Check**
  *   **Question:** Can this rule be used to change the conditions of its own existence?
  *   **Acceptable Answer:** No, or only via a harder process.
  *   **Stop Condition:** A simple majority can change the voting threshold required to change the rule.
  *   **Fix:** This rule belongs in the Registered Rules, not internal policy.

  ---

  ### 3. Application to Your Three Drafts

  **Draft 1: "The board may suspend any member for antisocial behaviour."**
  *   **Recursion Test:** Fails Step 1.
  *   **Problem:** "Member" includes Board members. The Board cannot suspend itself without a conflict of interest.
  *   **Verdict:** **Vicious Loop.**
  *   **Fix:** Rewrite: "The Board may suspend non-Board members. Suspension of a Board member requires a 75% vote of the General Meeting."

  **Draft 2: "These rules may be amended by a two-thirds vote at a general meeting."**
  *   **Recursion Test:** Fails Step 5.
  *   **Problem:** Can a two-thirds vote change the "two-thirds" requirement to a "simple majority"? If yes, the protection is illusory. If no, who decides the vote was invalid?
  *   **Verdict:** **Vicious Loop** (if this is your only governing document).
  *   **Fix:** This clause must be in your **Registered Rules** with the FCA. Internal policies cannot amend the Registered Rules. Internal policies can be amended by 2/3, but the 2/3 rule itself is protected by the external registration.

  **Draft 3: "The chair's rulings can be appealed to the full membership."**
  *   **Recursion Test:** Fails Step 4.
  *   **Problem:** Who decides if the appeal is "properly made"? If the Chair decides, they block the appeal. If the Membership decides, they must vote on whether to vote.
  *   **Verdict:** **Harmful Ambiguity.**
  *   **Fix:** Assign procedural validation to the **Secretary**. "Appeals must be submitted in writing to the Secretary. The Secretary determines validity based on Standing Order X." The Secretary's role is defined in the Constitution, not by the Chair.

  ---

  ### 4. Verdict on Proposed Fixes

  **Fix A: "Make the entrenchment clause need a bigger majority."**
  *   **Verdict:** **Moves the loop, does not break it.**
  *   **Reasoning:** A 90% rule can still be changed by 90%. It raises the cost but does not solve the logical paradox of *who counts the votes*.

  **Fix B: "Stagger it so rule changes only bind the next committee."**
  *   **Verdict:** **Ineffective.**
  *   **Reasoning:** This creates a temporal delay, not a structural hierarchy. The current committee can still pass a rule that binds the *process* of the next committee, effectively controlling them.

  **The Only Working Fix:**
  You must separate **Constitution** (Registered Rules) from **Procedure** (Standing Orders).
  1.  **Registered Rules:** Filed with the FCA. Define the amendment threshold (e.g., 75% + FCA approval). This is your "inviolate level."
  2.  **Standing Orders:** Internal document. Can be changed by the threshold set in the Registered Rules.
  3.  **External Anchor:** If the co-op deadlocks on whether a rule is valid, the ultimate arbiter is not the membership, but the law/regulator. Accept this.

  ### 5. Summary for Minutes
  *   **Issue:** Current drafts contain recursive loops where rules define the authority to change themselves.
  *   **Decision:** Adopt the "Recursion Test" (5 steps) for all future drafting.
  *   **Action:** Split governance into two tiers:
      1.  **Registered Rules:** Protect the amendment threshold and Board removal process. File with FCA.
      2.  **Standing Orders:** Handle day-to-day suspensions and meeting appeals.
  *   **Note:** Supermajorities and staggering do not solve logical paradoxes; only document hierarchy does.

  **Straight Talk:** You cannot write a rulebook that is perfectly self-contained. Every system rests on something outside itself (the law, the regulator, the physical reality of the lease). Stop trying to make the co-op self-validating. Make the **Registered Rules** the hard shell, and keep the **Standing Orders** soft. That is where the hands stop drawing each other.
