  - "Plain-English reading" (~150 words): what the paragraph is claiming, sentence by sentence where it matters, including what that "it" refers to.
  - "What 'scientific' is doing there" (~300 words): whether his "scientific research" is about method or about laws, and why the inquiry-to-literature slide isn't the same distinction as law-explanation versus story-explanation.
  - "The swap test, applied" (~300 words): where my friend's test works, where it breaks, and what someone who thinks explanations need general laws would say about it.
  - "Confidence and the soft spot" (~100 words): how sure you are of each of the above, and the one point you're least sure about.

  No reading lists please, I've got enough of a pile already.
