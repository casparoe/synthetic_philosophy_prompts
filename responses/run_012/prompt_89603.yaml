  I'm slowly working my way through a pile of old writing about what history is, and I've hit a paragraph I genuinely can't parse. It's from an old encyclopaedia article on "history" — from about 1910 I think, the prose is definately of its time. Here's the bit:

  "The word 'history' comes from the Gr. ἱστορία, which was used by the Ionians in the 6th century B.C. for the search for knowledge in the widest sense. It meant inquiry, investigation, not narrative. It was not until two centuries later that the historikos, the reciter of stories, superseded the historeōn (ἱστορέων), the seeker after knowledge. Thus history began as a branch of scientific research,—much the same as what the Athenians later termed philosophy. Herodotus himself was as much a scientific explorer as a reciter of narrative, and his life-long investigation was historiē in his Ionian speech. Yet it was Herodotus himself who first hinted at the new use of the word, applied merely to the details accumulated during a long search for knowledge. It is not until Aristotle, however, that we have it definitely applied to the literary product instead of the inquiry which precedes it. From Aristotle to modern times, history (Lat. historia) has been a form of literature."

  Three things in there I can't get straight. (1) What's the "it" in "we have it definitely applied to the literary product" — the word, or history itself? (2) He describes the drift from inquiry to literary product like it's a fall from grace, but I can't see what's supposed to be lost. (3) "Scientific research" is doing alot of work in that sentence and I honestly can't tell whether he means history is a science in the sense that historians should be hunting for general laws — the covering-law thing, Hempel? I know the gist, please dont give me the standard spiel about it — or only that historians should be systematic and careful with their sources.

  And here's what's really bugging me. A friend of mine has a test she calls the swap test for whether an explanation is "law-based". Take the explanation, swap the particular people and places out for other ones of the same kind, keep everything else the same. If the explanation still goes through, she says it was really resting on a general law; if it collapses, it was resting on the particulars. She uses it to argue that basically no historical explanation is law-based, so the encyclopaedia man's "science" is a red herring. I half believe her, but I also think the test is cheating somewhere and I can't say where. Does the passage have any resources to answer her? Would people who think explanations need laws say her test proves too much, or that it proves exactly the right thing?

  So: help me understand the passage on its own terms first, then tell me where my friend's test holds up and where it breaks.

