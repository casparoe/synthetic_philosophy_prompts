  Your friend's test is a clever heuristic for distinguishing nomological explanations from contextual ones, but it likely proves too much. It works well to isolate pure logical deduction, but it breaks when applied to historical sciences like geology or evolutionary biology. In these fields, explanations rely on universal laws *plus* specific initial conditions. If you swap "Earth" for "Mars" in an explanation of human evolution, the explanation collapses, yet evolutionary biology remains a science. A Hempelian would argue the test misunderstands how laws function; laws govern the relationship between variables, but the variables themselves must be specified. The test conflates "law-based" with "context-independent." A proponent of covering laws would say the test fails because laws are conditional. "If X, then Y." Swapping particulars changes X. The explanation holds *if* the law holds. The test assumes laws must be content-free, which isn't true. Furthermore, the test assumes that "particulars" are distinct from "laws." But laws often describe how particulars interact. If the explanation collapses because the new particulars don't fit the law's conditions, the law is still doing the work. Regarding the 1910 passage, the author wouldn't care about this test. His definition of "scientific" is about the *process* of inquiry, not the logical structure of the explanation. You could pass the swap test (finding a universal law of human behavior) but still fail the 1910 author's standard if you didn't rigorously investigate the specific evidence. The passage suggests the friend is attacking a definition of science (law-seeking) that the encyclopaedia author isn't necessarily using. The real conflict is between history as critical method versus history as artistic narrative. The test misses the methodological point entirely.

  - "Confidence and the soft spot"
  I am highly confident in the parsing of the text and the 1910 context of "science." The etymology and the shift from inquiry to literature are standard historiographical observations. I am moderately confident in the critique of the swap test, as philosophical debates on explanation are nuanced. The soft spot is attributing specific intent to the 1910 author regarding "scientific." While *Wissenschaft* is the likely context, he might implicitly assume some regularity in human nature. Distinguishing his implicit philosophy of science from his explicit etymology requires interpretation.
