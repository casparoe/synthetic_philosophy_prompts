prompt: |-
  I administer a state arts council's Enduring Traditions grant, and my two program officers review roughly forty applications a cycle. Applicants must show that their practice — a dance, a craft, a foodway, a festival — is transmitted within a community, but our eligibility rule, which asks for 'documented continuous practice for at least a century,' is doing more harm than good: it excludes practices that lapsed for a generation and were later revived, and it rewards anyone who can attach a single old newspaper clipping. I want a decision procedure my officers can actually run on an application, grounded in the scholarship on invented tradition and imagined communities — on how nations, folkways, and their pedigrees are made, and how recently. It should say what to ask in order, what counts as a sufficient answer, when a claim of antiquity should be treated as a social fact about the applicants rather than a historical one, and where the procedure must stop and hand the decision to me because it turns on values rather than evidence. Include the questions that separate a genuine revival from a fabricated pedigree, and be explicit about which steps are judgment calls dressed up as procedure. Then run it on three applications: a midwinter house-visiting play documented in nineteenth-century sources but not performed between 1932 and 1974, now staged annually by a neighborhood group; a 'centuries-old' harvest festival that a chamber of commerce created in 1998 to draw tourists and that has since become the town's central civic event; and a boat-blessing ceremony a fishing community says it has held without interruption since the 1880s, with the same two families supplying the officiants. State plainly what the procedure cannot do, and where it will return an answer I will not like. Write in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Administrator of a state arts council's Enduring Traditions grant.
      *   **Problem:** Current eligibility rule ("documented continuous practice for at least a century") is flawed. It excludes valid revivals and rewards superficial documentation (old clippings).
      *   **Goal:** Create a decision procedure for two program officers to use on ~40 applications/cycle.
      *   **Theoretical Grounding:** Scholarship on "invented tradition" (Hobsbawm & Ranger) and "imagined communities" (Anderson). Acknowledge that traditions are often constructed, but distinguish between meaningful community transmission and fabricated pedigrees for profit/status.
      *   **Requirements:**
          *   Sequential questions (decision tree style).
          *   Define sufficient answers.
          *   Distinguish between social fact (belief in antiquity) vs. historical fact.
          *   Identify where judgment calls are disguised as procedure.
          *   Identify where the decision must escalate to the Administrator (values vs. evidence).
          *   Include specific questions to separate genuine revival from fabricated pedigree.
          *   **Task:** Run the procedure on three specific case studies.
          *   **Constraint:** State plainly what the procedure *cannot* do and where it will return unpopular answers.
          *   **Language:** American English.

  2.  **Theoretical Framework & Philosophy:**
      *   *Invented Tradition (Hobsbawm):* Traditions often look old but are new. They establish continuity with a suitable historic past. The key isn't "is it actually old?" but "does it function as a tradition within a community?"
      *   *Imagined Communities (Anderson):* Communities are socially constructed. The *belief* in shared history matters more than the objective history.
      *   *Folklore Studies:* Focus on transmission (informal, community-based) vs. presentation (staged, external).
      *   *Shift:* Move from "Age of Object" to "Depth of Transmission."

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Name:* The Continuity and Community Transmission Protocol (CCTP).
      *   *Structure:* Phase 1 (Documentation), Phase 2 (Transmission), Phase 3 (Function/Meaning), Phase 4 (Escalation).
      *   *Key Distinction:* "Continuous Practice" vs. "Continuous Lineage of Knowledge." A gap in performance doesn't mean a gap in knowledge if elders taught youth who restarted it.
      *   *The "Social Fact" Clause:* If the community *believes* it's old and acts accordingly, it has social weight, even if historically recent. But for *funding*, we need to know if it's organic or manufactured.
      *   *Judgment Calls:* Need to explicitly flag where officers are making subjective calls (e.g., "sincerity," "community cohesion").
      *   *Escalation:* When the evidence is mixed or the "invention" serves a problematic purpose (e.g., gentrification, exclusion).

  4.  **Refining the Questions (Separating Revival from Fabrication):**
      *   *Revival:* Knowledge was kept alive (even if not performed), or the revival is led by community insiders acknowledging the gap.
      *   *Fabrication:* Created by outsiders (chamber of commerce), no intergenerational transfer, purpose is economic extraction.
      *   *Question:* Who holds the authority? Who teaches whom? Why was it started/restarted?

  5.  **Developing the Case Studies:**
      *   *Case 1: Midwinter Play.* Gap 1932-1974. Now annual.
          *   *Analysis:* 42-year gap. Is knowledge continuous? If neighbors taught neighbors based on old scripts, it's a revival. If it's a theater group just using old text, it's recreation.
          *   *Verdict:* Likely eligible as "Revived Tradition" if transmission is internal.
      *   *Case 2: Harvest Festival.* Created 1998 by Chamber of Commerce. Now central civic event.
          *   *Analysis:* "Invented Tradition" in the purest sense. Economic motive. Top-down.
          *   *Verdict:* Ineligible. It's tourism, not folkway.
      *   *Case 3: Boat Blessing.* Since 1880s. Two families.
          *   *Analysis:* Continuous. Narrow transmission (familial).
          *   *Verdict:* Eligible. Classic enduring tradition.
      *   *Wait, I need to find the nuance.* The prompt asks me to state where the procedure returns an answer I (the admin) won't like.
      *   *Twist:* Maybe the Boat Blessing is actually exclusionary? Or the Play is actually more "community" than the Blessing?
      *   *Better Twist:* The Procedure might flag the Boat Blessing as *too* narrow (gatekeeping) or the Play as *too* interrupted. Let's stick to the prompt's hint: "where it will return an answer I will not like."
      *   *Idea:* The Procedure might validate the Chamber of Commerce festival if the community has *adopted* it as their own (Anderson). If the town *believes* it's their tradition now, is it? The protocol needs to draw a hard line on *origin* to prevent funding tourism boards.
      *   *Alternative Idea:* The Procedure might reject the Midwinter Play because the gap is too long, even if the revival is sincere. This highlights the tension between "history" and "social fact."
      *   *Decision:* I will design the protocol to be strict on *transmission* but flexible on *continuity*.
      *   *Unpopular Answer:* The protocol might force me to fund the Chamber of Commerce event if the community has genuinely internalized it (social fact), OR it might force me to reject the Play because the gap breaks the "lineage of knowledge." Let's go with the latter for the "unpopular" part, or perhaps the Boat Blessing is revealed to be exclusionary.
      *   *Actually, the prompt asks to separate genuine revival from fabricated pedigree.* The Chamber of Commerce one is clearly fabricated pedigree. The Play is genuine revival. The Boat Blessing is continuous.
      *   *Where will I not like the answer?* Perhaps the protocol identifies that the Boat Blessing is actually a "fabricated pedigree" (maybe the families lied), or that the Play is ineligible despite being culturally vital.
      *   *Let's make the "Unpopular Answer" about the limits of the procedure.* The procedure can't measure *value*, only *structure*. It might recommend funding a boring but continuous tradition over a vibrant revived one.
      *   *Refined Plan:* I will write the protocol to prioritize *intergenerational transmission* over *calendar continuity*.
      *   *Case 1 (Play):* Passes (Revival).
      *   *Case 2 (Festival):* Fails (Fabricated).
      *   *Case 3 (Blessing):* Passes (Continuous).
      *   *The "Unpopular" part:* The protocol might indicate that Case 2 *could* pass if the community has fully adopted it (social fact), but I (the Admin) want to exclude tourism. I need to build a "Origin Check" that kills Case 2 definitively, but acknowledge that *theoretically*, it is now a tradition.
      *   *Wait, looking closer at the prompt:* "State plainly what the procedure cannot do, and where it will return an answer I will not like."
      *   *Okay, I need to be honest.* If the community *believes* the Chamber of Commerce festival is their tradition, the scholarship says it *is* their tradition. If my procedure respects "social fact," it might recommend funding it. I (the Admin) might hate funding a Chamber of Commerce. That's the tension.
      *   *Alternatively:* The Midwinter Play gap (42 years) might trigger an automatic fail in a rigid procedure, even though it's a beautiful revival. I should design the procedure to allow revivals, but acknowledge the risk.
      *   *Best approach:* Design the procedure to be rigorous. Then, in the evaluation, show where the "Social Fact" clause creates a conflict with the "Historical Fact" requirement.

  6.  **Writing the Content:**
      *   **Introduction:** Acknowledge the theoretical shift (Hobsbawm/Anderson).
      *   **The Protocol:** Step-by-step.
      *   **The "Judgment Call" Flags:** Explicitly mark subjective areas.
      *   **The Escalation Point:** Where values override evidence.
      *   **The Case Studies:** Apply the protocol.
      *   **The Limitations:** What this tool misses.

  7.  **Review against Constraints:**
      *   American English? Yes.
      *   Decision procedure? Yes.
      *   Grounded in scholarship? Yes (cite Hobsbawm/Anderson concepts without necessarily footnoting).
      *   Three cases run? Yes.
      *   Plain statement of limitations/unpopular answers? Yes.

  8.  **Final Polish:** Ensure the tone is administrative but intellectually honest. Avoid jargon where possible, but use the required theoretical concepts. Make sure the distinction between "social fact" and "historical fact" is clear.

  *(Self-Correction during drafting)*: I need to make sure I don't just say "Hobsbawm says X." I need to operationalize it. Instead of "Is it invented?" ask "Who invented it and for what purpose?"
  *(Self-Correction on Case 2)*: If the town now loves the 1998 festival, is it a tradition? Yes, socially. But for an *Enduring* Traditions grant, the *origin* matters. I need to make sure the protocol distinguishes between "Tradition" (sociological) and "Enduring Tradition" (grant criteria). The grant wants *transmission*, not just *adoption*.
  *(Self-Correction on Unpopular Answer)*: The most honest "unpopular answer" is that the procedure cannot distinguish between a "good" tradition and a "bad" one (e.g., exclusionary practices). Or, that a vibrant revival (Play) scores lower than a stagnant continuous one (Blessing). I will focus on the latter: The procedure favors continuity over vitality.

  9.  **Finalizing the Structure:**
      *   Memo Header.
      *   Philosophical Preamble.
      *   The Protocol (Phases 1-4).
      *   Application to Cases.
      *   Limitations & Unpopular Truths.

