answer: |-
  **MEMORANDUM**

  **TO:** Program Officers, Enduring Traditions Grant
  **FROM:** Grant Administrator
  **SUBJECT:** Decision Protocol for Community Transmission and Continuity
  **DATE:** October 26, 2023

  ### 1. Preamble: Theoretical Grounding

  We are retiring the "Continuous Practice for One Century" rule. It is historically naive and administratively brittle. As scholars of folklore and nationalism (notably Hobsbawm and Anderson) have demonstrated, almost all traditions are "invented" to some degree; they construct a pedigree to legitimize current social cohesion. A practice does not need to be objectively ancient to be culturally enduring. It needs to be *socially* enduring.

  However, we are not funding tourism campaigns or historical reenactments. We are funding the transmission of cultural knowledge within a community. This protocol shifts the metric from **Age of Object** to **Depth of Transmission**. It distinguishes between a *Revival* (community reclaiming dormant knowledge) and a *Fabrication* (external actors creating a pedigree for economic or political gain).

  **Note on "Social Fact" vs. "Historical Fact":**
  *   **Historical Fact:** Can the timeline be verified by archives?
  *   **Social Fact:** Does the community *believe* this practice binds them to a past, regardless of archival proof?
  *   *Rule:* We fund based on Social Fact, provided it does not contradict Historical Fact to the point of fraud. If a community believes a practice is centuries old, but it began in 1998, we must determine *why* it began. If it began to sell tickets, it is a product. If it began to heal a social rift, it is a tradition.

  ### 2. The Decision Protocol (CCTP-v1)

  **Phase 1: The Lineage of Knowledge (Transmission)**
  *Goal: Determine if skills/knowledge move intergenerationally.*

  1.  **Q1:** Who teaches the practice to the next generation?
      *   *Acceptable:* Elders to youth, parents to children, masters to apprentices within the community.
      *   *Unacceptable:* Hired instructors, online tutorials without local mentorship, paid consultants.
      *   *Judgment Call Flag:* If teaching is done by a "cultural director" employed by a non-profit, verify if they are community-born or hired staff.
  2.  **Q2:** Is the knowledge tacit (unwritten, learned by doing) or explicit (scripted, manualized)?
      *   *Acceptable:* Either, provided the *interpretation* is community-controlled.
      *   *Red Flag:* If the practice relies entirely on a single written document discovered recently with no oral history to support it.

  **Phase 2: Continuity and Interruption (The Gap Analysis)**
  *Goal: Assess lapses in performance without penalizing revival.*

  3.  **Q3:** Has the practice lapsed for more than one generation (25+ years)?
      *   **If No:** Proceed to Phase 3.
      *   **If Yes:** Ask Q4.
  4.  **Q4:** During the lapse, was the *knowledge* preserved, even if the *performance* stopped?
      *   *Acceptable:* "We didn't dance, but Grandmother taught us the steps in the kitchen," or "The script was kept by the local historical society and neighbors read it."
      *   *Unacceptable:* "We found a book in 2010 and decided to start it up."
      *   *Judgment Call Flag:* Distinguish between "preservation" (keeping it alive privately) and "archival recovery" (digging it up publicly). The former is a tradition; the latter is a recreation.

  **Phase 3: Origin and Function (The Invention Check)**
  *Goal: Separate organic growth from engineered pedigree.*

  5.  **Q5:** Who initiated the practice (or its most recent revival)?
      *   *Acceptable:* Community members, families, religious groups, informal neighborhood associations.
      *   *Unacceptable:* Chambers of Commerce, Tourism Boards, Corporate Sponsors, Municipal Economic Development Offices.
      *   *Judgment Call Flag:* If a Tourism Board funds it, but a neighborhood group runs it, who holds the veto power? If the Tourism Board can cancel it, it is a product.
  6.  **Q6:** What is the primary function of the practice?
      *   *Acceptable:* Social cohesion, ritual observance, identity marking, intergenerational bonding.
      *   *Unacceptable:* Tourist attraction, revenue generation, civic branding.
      *   *Test:* If the tourists stopped coming tomorrow, would the community still do this?

  **Phase 4: Escalation Point (Values vs. Evidence)**
  *Goal: Identify where the procedure stops and Administrator discretion begins.*

  7.  **Q7:** Does the practice rely on exclusionary claims of authenticity (e.g., "Only blood descendants can participate") that violate state non-discrimination policies, even if historically accurate?
      *   **Action:** **STOP.** Escalate to Administrator. This is a legal and ethical value judgment, not an evidentiary one.
  8.  **Q8:** Is the "Social Fact" (community belief) in direct conflict with verified "Historical Fact" (archives) in a way that suggests active fraud rather than folk memory?
      *   **Action:** **STOP.** Escalate to Administrator. We do not fund fraud, but we must decide if the fraud is malicious or mythic.

  ---

  ### 3. Application to Current Cycle Cases

  Here is how the protocol processes the three contested applications.

  #### Case A: The Midwinter House-Visiting Play
  *   **Profile:** Documented 19th century. Lapsed 1932–1974 (42 years). Staged annually by neighborhood group since 1975.
  *   **Protocol Run:**
      *   *Phase 1:* Teaching is neighbor-to-neighbor. (Pass)
      *   *Phase 2:* Lapse > 25 years. (Trigger Q4). Knowledge was preserved via scripts held by families and oral teaching of songs during the gap. (Pass - Revival)
      *   *Phase 3:* Initiated by neighborhood group, not tourism board. Function is social cohesion/ritual. (Pass)
  *   **Verdict:** **ELIGIBLE.**
  *   **Rationale:** This is a "Genuine Revival." The gap exists, but the lineage of knowledge remained within the community's domestic sphere. The social fact of the tradition outweighs the historical interruption.

  #### Case B: The 'Centuries-Old' Harvest Festival
  *   **Profile:** Created 1998 by Chamber of Commerce. Now the town's central civic event. Claims "centuries-old" pedigree.
  *   **Protocol Run:**
      *   *Phase 1:* Taught by event coordinators/hired performers. (Fail/Flag)
      *   *Phase 2:* No lapse; began 1998. (Pass)
      *   *Phase 3:* Initiated by Chamber of Commerce. (Trigger Q5 - Unacceptable). Primary function is tourist draw. (Trigger Q6 - Unacceptable).
      *   *Social Fact Check:* The town now considers it central. (Social Fact = True).
      *   *Historical Fact Check:* Began 1998. (Historical Fact = True).
  *   **Verdict:** **INELIGIBLE.**
  *   **Rationale:** This is a "Fabricated Pedigree." Despite the community's current adoption (Anderson's *Imagined Community*), the origin is economic extraction, not cultural transmission. The claim of antiquity is marketing, not memory.
  *   **Note:** If the Chamber of Commerce handed full control to a civic committee in 2010, re-evaluate under Phase 3.

  #### Case C: The Boat-Blessing Ceremony
  *   **Profile:** Fishing community. Claimed uninterrupted since 1880s. Two families supply officiants.
  *   **Protocol Run:**
      *   *Phase 1:* Taught within two families. (Pass)
      *   *Phase 2:* No lapse. (Pass)
      *   *Phase 3:* Initiated by community/religious need. (Pass)
      *   *Phase 4:* **Escalation Trigger.** The restriction of officiants to "two families" may violate non-discrimination policies if public funds are involved, or it may be protected religious freedom.
  *   **Verdict:** **ESCALATE TO ADMINISTRATOR.**
  *   **Rationale:** Historically and culturally, this is the strongest application. However, the exclusivity triggers Q7. The procedure cannot determine if this is "protecting sacred lineage" or "unlawful exclusion."

  ---

  ### 4. Limitations and Unpopular Truths

  You asked for a procedure that works, but also for honesty about where it fails. Here is what this protocol cannot do, and where it will generate answers you (and the public) may resist.

  **1. It cannot measure vitality.**
  The protocol favors continuity over innovation. A boring, stagnant practice that has been done the exact same way for 100 years (Case C) will score higher on "Continuity" than a vibrant, evolving revival (Case A). You will receive recommendations to fund dying traditions over living ones because the procedure weights *transmission* heavier than *participation*. You will have to override this based on your own value judgment regarding the "life" of the art form.

  **2. It creates a "Social Fact" Loophole.**
  If Case B (The Harvest Festival) had been run by a "Volunteer Committee" instead of the Chamber of Commerce, and the town genuinely loved it, the protocol might recommend funding it. Sociologically, after 25 years, a fabricated tradition *becomes* a real tradition. If the community imagines it as ancient, it functions as ancient. The protocol forces you to reject it based on *origin*, not *function*. You will be denying funding to a genuine community bonding event because of its corporate birth certificate. Be prepared to defend that distinction.

  **3. It cannot resolve the "Exclusion" Paradox.**
  In Case C, the tradition is "enduring" precisely *because* it is exclusive. If we force the two families to open the officiant role to the public to satisfy grant compliance, we may destroy the tradition's internal logic. The procedure identifies this conflict (Phase 4) but cannot solve it. You must decide if we fund the *community as it is* or the *community as we wish it to be*.

  **4. It relies on Officer Intuition.**
  Marked "Judgment Call Flags" comprise roughly 30% of the decision tree. Officers must determine "sincerity" and "community control." These are subjective. Two officers can run this protocol on the same application and reach different conclusions based on how they interpret "community-born." This is not a bug; it is a feature of evaluating culture. Do not attempt to automate these flags.

  **5. The "Unpopular Answer."**
  The protocol will likely recommend **rejecting** applications from marginalized communities that were forcibly interrupted by systemic oppression (e.g., a dance banned by law for 40 years). Under Phase 2, Q4, if the knowledge was not preserved privately, it counts as a "Recreation." This penalizes victims of cultural erasure.
  *   *Correction:* I am adding a **Clause 4.5**: *If the lapse in practice was caused by documented state suppression, war, or forced displacement, the 'Gap Analysis' is waived.*
  *   *Without this clause,* the procedure returns a morally indefensible answer. With it, you must be prepared to verify "suppression," which is historically complex.

  ### 5. Instruction to Officers

  Run the protocol sequentially. If an application fails Phase 1, stop. If it triggers Phase 4, do not make a recommendation. Send the file to me with a note citing the specific Question (Q7 or Q8) that triggered the escalation.

  Do not attempt to be historians. You are evaluating the *health of the transmission*, not the accuracy of the date. If the community says it is old, and they treat it as old, and they teach it to their children, it is old enough for us. Unless it was made to sell tickets.

  **Administrator Signature**
