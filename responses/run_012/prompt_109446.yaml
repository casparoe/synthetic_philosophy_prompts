answer: |-
  Here is my reasoning on your three-way split, taking the concepts as you've laid them out.

  ### 1. Question-Shift vs. Pragmatic Encroachment

  Are they distinct? Yes. Encroachment changes the *status* of the belief; Question-Shift changes the *requirement* for the action.

  **The Divergence Case:**
  Imagine a subject, Sarah, who is checking the bank hours. The stakes are objectively high (if she doesn't deposit, she defaults on a loan). However, a philosopher approaches her and asks, "Do you *know* the bank is open tomorrow?" The philosopher is not asking her to act; he is just testing her epistemic state.

  *   **Encroachment:** Because the stakes are high, the standards for knowledge are raised. Even if she has the same evidence as a low-stakes subject, she does **not** know. The truth value of "Sarah knows" is False.
  *   **Question-Shift:** Sarah knows the proposition "The bank is open tomorrow." That fact is stable. The high stakes mean she cannot *act* on that proposition alone; she needs the stronger proposition "The bank is open and won't unexpectedly close." But regarding the philosopher's question ("Do you know it's open?"), the answer is **True**.

  **Prediction Difference:** Encroachment predicts that knowledge ascriptions will be false in high-stakes contexts even when no action is being taken. Question-Shift predicts knowledge ascriptions remain true, but *action ascriptions* ("She is rational to deposit") become false.

  **Is Question-Shift better off?** In this specific case, yes. It preserves the intuition that Sarah isn't epistemically blind; she has the evidence. Encroachment forces us to say her evidence literally stopped counting as knowledge because of a loan she might not even be thinking about at that moment.

  ### 2. Question-Shift vs. Contextualism

  Contextualism says the word 'knows' changes meaning based on the *attributor's* context (the person speaking). Question-Shift says the *target proposition* changes based on the *subject's* practical context (the person acting).

  **Where they come apart:**
  Consider a low-stakes subject (S) and a high-standards attributor (A). S is betting pennies on the bank hours. A is a skeptic discussing brain-in-a-vat scenarios.

  *   **Contextualism:** When A says "S does not know," A speaks truly. The word 'knows' in A's mouth demands skeptical-proof. S fails that.
  *   **Question-Shift:** S knows the answer to "Is the bank open?" A is asking about "Is the bank open given skepticism?" These are different questions. If A asks "Does S know the bank is open?" (referring to S's question), the answer is Yes. If A asks "Does S know she's not a brain in a vat?" the answer is No.

  **Is Question-Shift better off?** Yes, because it avoids "semantic blindness." Contextualism requires that ordinary people are systematically confused about the word 'knows' (they think it means one thing, but it shifts). Question-Shift assumes people are confused about *what they need to be sure of*, which is a practical error, not a linguistic one. It feels more plausible that people misjudge their safety margins than that they don't understand their own vocabulary.

  ### 3. The Unaware High-Stakes Subject

  This is the strongest test. Subject S has evidence the bridge is safe. S thinks they are just going for a walk (low stakes). Actually, the bridge collapsing would trigger a war (extreme stakes). S is unaware of the stakes.

  *   **Encroachment:** Most versions tie knowledge to the *actual* stakes. Since the stakes are astronomical, S does **not** know the bridge is safe. S is epistemically deficient despite having the same mental state as a low-stakes walker.
  *   **Question-Shift:** S is asking "Is the bridge safe for a walk?" S **knows** this. The fact that the *world* requires the answer to "Is the bridge safe for geopolitical stability?" is irrelevant to S's epistemic state, though relevant to whether S *should* cross.
  *   **Believability:** Question-Shift wins here. It seems wrong to say S lacks knowledge just because of a consequence S couldn't possibly anticipate. Encroachment makes knowledge too external; it makes my mental state dependent on facts I have no access to. Question-Shift keeps knowledge tethered to the subject's perspective (the question they are asking) while acknowledging the action is still risky.

  ### 4. Dropping the Knowledge-Action Link

  Encroachment is motivated by the principle: *If you know p, you are warranted to act on p.* If stakes make acting reckless, you must not know.

  Question-Shift drops this. It says: *You can know p and still be reckless to act on p if p isn't the right tool for the job.*

  **Do we lose anything?** We lose the elegance of a single norm. The idea that "Knowledge is the norm of action" is a beautiful, unifying theory. Breaking it feels like a patch.

  **Can it explain recklessness?** Yes. On Question-Shift, recklessness isn't acting without knowledge; it's acting on a *coarse* knowledge when you need a *fine* one. You know "The gun is unloaded" (based on a quick check). But the question you need to answer is "Is the gun *guaranteed* unloaded?" You don't know that. Acting on the first proposition to answer the second question is a category error. It explains the feeling of recklessness as a *mismatch* between the precision of your evidence and the precision required by the outcome, rather than a loss of knowledge itself.

  ### 5. Verdict

  **Which I'd bet on:** Question-Shift.

  **Why:** It preserves the stability of truth. Encroachment makes truth partly dependent on practical utility, which feels like a category mistake (truth is about how the world is, not what I need). Contextualism makes truth dependent on conversation, which makes disagreement impossible (we're just talking past each other). Question-Shift keeps knowledge factual and stable, and locates the variability where it belongs: in our decision-making processes.

  **The Best Objection:** The "Shifty Question" Objection.
  If the "right question" is determined by the stakes, then Question-Shift is just Encroachment in disguise.
  *   *Objection:* You say knowledge doesn't move, only the question does. But what determines which question is the relevant one? If the answer is "The stakes determine the relevant question," then you haven't saved knowledge from stakes; you've just moved the stakes-sensitivity from the *knowledge relation* to the *question selection mechanism*. You still have a system where high stakes prevent you from having the necessary mental asset to act. You've renamed the problem, not solved it.

  ### 6. Does it have a name?

  It does not have a single, universally recognized name like "Contextualism," but it is a specific flavor of **Moderate Invariantism**.

  *   **Invariantism:** The view that the semantic content of 'knows' does not shift with context (unlike Contextualism) and the standards for knowledge do not shift with stakes (unlike Encroachment).
  *   **The Mechanism:** Your specific mechanism—shifting the *proposition targeted* rather than the *standards*—overlaps significantly with **Contrastivism** (associated with Jonathan Schaffer). Contrastivism argues that knowledge is ternary: S knows that *p* **rather than q**. If stakes change the 'q' (the alternatives you must rule out), the knowledge claim changes.
  *   **The Difference:** Contrastivism usually says the *knowledge itself* is relative to the contrast. Your view says the *knowledge* is invariant, but the *practical requirement* shifts to a different contrast.

  **Assessment:** Your version is arguably cleaner than standard Contrastivism because it doesn't require rewriting the logic of knowledge itself, only the logic of practical reasoning. It is also stronger than generic Moderate Invariantism because it offers a specific mechanism (the question shift) for *why* action becomes prohibited even when knowledge remains. Existing Invariantist views often just say "Knowledge is one thing, rational action is another" without explaining the link. Your "Question-Shift" provides the missing link.
