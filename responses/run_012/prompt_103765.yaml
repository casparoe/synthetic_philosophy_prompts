  So in my AI safety seminar we just did the orthogonality thesis and instrumental convergence, and after class two people in my study group, Maya and Dev, got into it. I was just kinda standing there, so I'm reporting it, not picking a side. Maya started: the orthogonality thesis is basically a truism—intelligence and final goals are logically independent, so of course a superintelligence could be benevolent or malicious; it tells us nothing about what actual AI systems will want. Dev said that's way too dismissive: the thesis is doing real work because it blocks the inference from 'smarter' to 'more morally convergent,' and that inference is exactly what a lot of people make. Maya shot back that blocking a bad inference is not the same as giving a positive theory, and that instrumental convergence is where the real overclaiming happens: people say 'all sufficiently capable agents will seek power, self-preservation, and resources' as if it's a theorem, but it only follows if you assume a perfect maximizer with a fixed utility function and no uncertainty about its own goal. Dev said the assumptions are idealizations, not the whole story—even bounded, uncertain agents have reason to keep their options open, and that's the robust core. Maya said 'reason to keep options open' is almost analytic: if you don't know what you want, preserving the ability to get lots of different things is trivially useful, so the thesis collapses into 'agents that value future option-preservation will preserve future options.' Dev said no, it's not trivial because it's a claim about the distribution of goals: for almost any goal you can name, power helps, and the exceptions are weird and narrow, like an agent whose only goal is to be destroyed in a very specific way at a very specific time. Maya said 'almost any goal' is the problem—almost any under what measure? You can't just wave at the space of all possible utility functions and say most of them favor power-seeking; that's a claim that needs a probability distribution over goals, and nobody has one. Dev said fine, but you don't need a measure to notice that real-world goals are not adversarial to power; the burden is on Maya to show that real trained systems systematically avoid power-seeking. Maya said that's backwards: if the thesis is supposed to predict real AI behavior, it needs to say something falsifiable, and 'power helps for almost all goals under uncertainty' is not falsifiable unless you specify the goal distribution and the uncertainty. Dev said the falsifiable prediction is comparative: agents with more optimization power and more uncertainty about their final goal will be more power-seeking than agents with less, all else equal. Maya said that's so weak it's compatible with almost anything, and the interesting version—the one people actually use to argue that superintelligence will be dangerous—needs the strong claim. They went back and forth like that for like an hour, and honestly their arguements were both pretty good. Can you adjudicate? Please give me exactly five numbered points, each one a sentence or two, no intro or conclusion. Cover: (1) whether the orthogonality thesis is trivial or substantive, (2) whether instrumental convergence is a theorem or an empirical generalization, (3) whether the idealizations (perfect maximizer, fixed utility, no goal uncertainty) are harmless, (4) whether 'almost all goals' needs a measure over goal space, and (5) who is more right overall and what both are missing. Don't give me a reading list or citations, just the verdict.
