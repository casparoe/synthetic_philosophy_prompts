      *   **Outcomes:**
          *   *Positive:* Macro variables screen off micro variables in specific contexts (autonomy).
          *   *Negative:* Macro variables are strictly derivable/unstable without micro-details (reduction).
          *   *Failure:* The model is too simplistic to capture the Careenium's dynamics, or the metrics for "autonomy" are ill-defined.
      *   **Scope/Limitations:** 6 months is short. Don't solve mental causation. Just test the Careenium case. Bracket consciousness/qualia.
