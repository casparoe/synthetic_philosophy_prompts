          *   *Interventionist (Woodward-esque):* Says if $X$ affects $Y$, it's causal. But doesn't specify *which* variables count as $X$ (micro or macro).
          *   *Mechanistic:* Levels are explanatory. (Doesn't settle ontological/counterfactual autonomy).
      *   **Methodology:** This is the core.
          *   *Formalism:* Use Causal Bayes Nets or SEMs.
          *   *Modeling:* Build a simplified Careenium (computational simulation or logical model).
