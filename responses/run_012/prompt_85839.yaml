  2.  **Deconstruct the Requirements (The "Spec Sheet"):**

      *   *Requirement 1: The Boundary Problem (Disorder vs. Variation).* Needs to address thresholds on continua. The hypertension analogy is key here (pragmatic threshold vs. natural kind).
      *   *Requirement 2: The Fact/Value Entanglement.* Needs to account for normativity. Wakefield's "Harmful Dysfunction" is the obvious reference point here, but needs to be presented as a candidate solution, not truth.
      *   *Requirement 3: Accommodating Looping.* The classification must account for the feedback loop between label and person.
      *   *Requirement 4: Reliability vs. Validity.* Needs to address the DSM-III compromise.
      *   *Requirement 5: Functional Pluralism.* Serving clinic, payers, and law simultaneously.
      *   *Requirement 6: Inflation Control.* Preventing medicalization of normality.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Drafting Req 1 (Boundary):* Call it "The Threshold Criterion." It needs to explain *why* we cut the continuum where we do. Is it natural or pragmatic?
      *   *Drafting Req 2 (Normativity):* Call it "The Normative Neutrality (or Transparency) Criterion." It must distinguish "is" from "ought."
      *   *Drafting Req 3 (Looping):* Call it "The Dynamic Stability Criterion." It needs to handle human reactivity.
      *   *Drafting Req 4 (R/V):* Call it "The Predictive Validity Criterion." Reliability is easy; validity is hard.
      *   *Drafting Req 5 (Function):* Call it "The Functional Pluralism Criterion." One size fits all?
