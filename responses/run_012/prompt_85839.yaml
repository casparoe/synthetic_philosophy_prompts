      *   *Trade-off 2: Admin vs. Validity.* Insurance needs binary (yes/no). Nature is often dimensional. This is a hard conflict.
      *   *The "Killer Constraint":* Which one kills the most theories? Probably the Validity/Biomarker constraint. It exposes the emptiness of current categories. Or perhaps the Fact/Value distinction, because it undermines the "medical model" pretense. Let's argue for the Fact/Value distinction as the most philosophically destabilizing.

  5.  **Addressing "Settled vs. Live":**

