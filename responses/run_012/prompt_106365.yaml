  # Activity: The Triad of Commitment

  **Target:** 16 Students | **Time:** 90 Minutes | **Stakes:** Course Points (e.g., 50 points = 1% bonus or equivalent candy/prize pool)

  ## Materials & Roles
  *   **Instructor (The Oracle):** Controls all random seeds, holds the master score sheet, and enforces rules.
  *   **Students (Agents):** 16 participants.
  *   **Materials:**
      *   16 Index cards + Envelopes (for sealing policies).
      *   16 Poker chips or colored tokens (representing 10 points each).
      *   1 Coin, 1 D20 Die (for random seeds).
      *   16 "Blackmail Notes" (prepared in advance).
      *   Whiteboard (for public score tracking).

  ## Payoff Scheme (Hidden from Students until Debrief)
  *   **Round 1:** Policy "Pay" = (+10 if Heads, -5 if Tails). Policy "Refuse" = (0 always).
  *   **Round 2:** Bad State = -20 points. Fee = -5 points.
  *   **Round 3:** Base 10 points. Bonus +20 if (Payment XOR Seed Parity) = 1. Penalty -50 if Payment $\neq$ Sealed Policy.

  ---

  ## Minute-by-Minute Timeline

  ### 0:00 – 0:10 | Introduction & Setup
  *   **Instructor:** "We are running a simulation of strategic decision-making under uncertainty. You will accumulate points. Do not discuss strategies aloud. All choices are individual."
  *   Distribute 3 chips (30 points) to each student as an endowment.
  *   **Rule:** "You may not spend points you do not have. Negative scores are possible."

  ### 0:10 – 0:35 | Round 1: The Sealed Promise (Counterfactual Mugging Variant)
  1.  **Pre-Commitment (5 mins):** Students write on an index card: *"If the coin is Tails, I will PAY 1 chip."* or *"If the coin is Tails, I will REFUSE."* They seal this in an envelope and write their name on it. **Do not open.**
  2.  **The Flip (2 mins):** Instructor flips a public coin.
      *   **Heads:** Instructor announces "Heads." Students with "Pay" cards are immediately awarded +10 points (added to board). Students with "Refuse" get 0. Envelopes remain sealed. Game over for Heads students (they observe).
      *   **Tails:** Instructor announces "Tails."
  3.  **The Live Choice (10 mins):** Tails students open their envelopes.
      *   **Instruction:** "The Oracle has already calculated your score based on your card. If your card says Pay, you have -5 points. If Refuse, 0 points. However, if your card says Pay, you are now offered the chance to physically hand over 1 chip to the Oracle."
      *   **The Catch:** "This payment is **causally inert** regarding your Round 1 score; it is already written. However, if you refuse to hand over the chip when your card says Pay, you are marked 'Inconsistent.' Inconsistent agents are ineligible for Round 3 bonuses."
      *   **Action:** Tails students decide whether to burn a chip.
  4.  **Collection:** Collect all envelopes. Reveal that Heads/Pay students got the bonus *because* the Tails/Pay students were willing to burn chips (conceptually).

  ### 0:35 – 0:55 | Round 2: The Blackmail Note (XOR Blackmail Variant)
  1.  **Setup (5 mins):** Instructor explains: "A hidden state (Bad/Good) was determined by a die roll earlier. I am distributing Notes only to specific students based on an algorithm involving that state and your anticipated choice."
  2.  **Distribution (5 mins):** Hand "Blackmail Notes" to exactly 8 students (randomly selected, but claim it is algorithmic).
      *   **Note Text:** "You have received this note because (Bad State is TRUE) XOR (You Pay 1 Chip). If you Pay 1 Chip, the Bad State is FALSE. If you Refuse, the Bad State is TRUE. Bad State cost: 20 points. Payment cost: 1 Chip (5 points)."
  3.  **The Decision (10 mins):**
      *   Students reason: "If I Pay, Note implies Bad State is False. Net cost: 5. If I Refuse, Note implies Bad State is True. Net cost: 20."
      *   **Tension:** "But the die was already rolled! How does my payment change the past?"
      *   Students submit payment or refusal.
      *   **Resolution:** Instructor reveals the "Hidden State" envelope for each student. It matches the logic: Payers had Good State, Refusers had Bad State. (This is pre-arranged by the Instructor to match the XOR condition for those who received notes).

  ### 0:55 – 1:15 | Round 3: The Nested Seed (Updateless Variant)
  1.  **Policy Writing (5 mins):** Students write a new policy on a card: *"I will Pay 1 Chip if Seed is Odd"* or *"I will Pay 1 Chip if Seed is Even"* (or Always/Never). Seal it.
  2.  **Seed Reveal (2 mins):** Instructor rolls a D20 publicly. Announce Parity (e.g., "Even").
  3.  **Execution (10 mins):** Students choose to Pay or Refuse *now*, knowing the Seed.
      *   **Payoff Rule:** "You gain +20 points if (Your Payment XOR Seed Parity) = 1. (i.e., Payment and Parity are different)."
      *   **Consistency Check:** "If your Action differs from your Sealed Policy, you lose 50 points."
  4.  **The Trap:**
      *   If they wrote "Pay if Even" and Seed is Even, they *must* Pay to avoid the -50 penalty.
      *   If they Pay (1) and Seed is Even (0), XOR is 1. They win +20.
      *   If they tried to CDT-optimize *after* seeing the Seed (e.g., Seed is Even, so I Refuse to make XOR=1?), they violate their policy and lose 50.
      *   **Lesson:** The optimal strategy required committing to a policy *before* knowing the seed, even though the action happens *after*.

  ### 1:15 – 1:30 | Debrief & Theory Mapping
  *   **Reveal Names:** Identify R1 as **Counterfactual Mugging**, R2 as **XOR Blackmail**, R3 as **Updateless Decision Theory**.
  *   **Map R1:**
      *   *CDT:* In Tails, paying is a sunk cost. Refuse.
      *   *EDT/UDT:* Paying validates the policy that won the Heads reward. The "Inconsistent" penalty simulates the loss of the counterfactual benefit.
  *   **Map R2:**
      *   *CDT:* The state is fixed. Paying 5 to avoid 20 is good *if* it works, but causally it shouldn't.
      *   *EDT:* Receiving the note is evidence. Paying correlates with Safety.
  *   **Map R3:**
      *   *Timing:* Choosing *after* seeing the seed tempts CDT (optimize for current state). Choosing *before* (Policy) locks in UDT (optimize across all states).
      *   *Penalty:* The -50 penalty represents the logical dependency of the payoff on your algorithm, not just your specific action.

  ---

  ## Candid Account: What Will Go Wrong
  1.  **The R1 Revolt:** In Round 1 (Tails branch), students will realize paying is "irrational" (losing 5 points for no causal gain). Some will refuse.
      *   *Handling:* Do not argue. Simply mark them "Inconsistent" and exclude them from Round 3 bonuses. Say: "Your score is valid, but your algorithm is flagged." This *is* the lesson (they sacrificed long-term algorithmic integrity for short-term gain).
  2.  **R2 Skepticism:** Students will accuse you of rigging the "Hidden State" in Round 2.
      *   *Handling:* Acknowledge it. "The simulation enforces the correlation. The philosophical question is: given the correlation exists, how do you decide?"
  3.  **R3 Confusion:** Students may not understand XOR logic quickly.
      *   *Handling:* Write the truth table on the board before they act. Keep the math visible.
  4.  **Time Creep:** R1 debates often bleed into R2.
      *   *Handling:* Be a tyrant about the clock. "The Oracle does not wait."

  ## Limitation Note (For Debrief)
  **The Missing Feature:** This game cannot reproduce **Logical Counterfactuals**. In the real philosophical problems (like Omega), the prediction is based on your *source code*, not a rule enforced by a teacher. In this game, the correlation is enforced by *me* (the Instructor) and the rules. I am acting as the "physics" that links your decision to the outcome. In the true philosophical problem, the link is logical necessity, not institutional enforcement. You must explain that in the real thought experiment, *you* are the one running the algorithm that determines the outcome, whereas here, *I* am.

  Summary: The core mechanic is enforcing evidential correlations through institutional rules to simulate the pressure of logical dependency without actual prediction.
