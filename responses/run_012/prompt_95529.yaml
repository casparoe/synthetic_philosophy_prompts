answer: |-
  Here is a principle designed to capture your specific pattern of verdicts, followed by an analysis of how it handles your cases, the unlisted cases, and where it inevitably frays.

  ### The Principle: Functional-Structural Continuity

  A superseded theory $T_1$ deserves credit for being "on the right track" (or approximately true) relative to successor $T_2$ if and only if:

  1.  **Structural Retention:** The core mathematical formalism of $T_1$ is retained in $T_2$ as a limiting case or a direct structural isomorphism, *without* requiring the inversion of signs or logical negation of core quantities.
  2.  **Functional Role Continuity:** The ontological entities of $T_1$ need not survive, provided their *causal role* in the theory is occupied by a real entity or structure in $T_2$.
  3.  **Locus Stability:** The physical location or bearer of the core property described by $T_1$ must remain the same in $T_2$.

  ---

  ### Clause-by-Clause Justification

  #### Clause 1: Structural Retention (No Sign Inversion)
  *   **The Case that Forces It:** **Phlogiston.**
      *   **Reasoning:** You reject Phlogiston despite the clean mapping to negative oxygen. The mapping $Phlogiston = -Oxygen$ is mathematically isomorphic, but it requires a sign inversion on the physical process (release vs. uptake). A theory that gets the *direction* of the causal flow wrong is not approximately true; it is structurally inverted.
      *   **Contrast:** Fresnel's wave equations map to Maxwell's without sign changes. Newton's $F=ma$ maps to Relativity without sign changes (in the limit).
  *   **The Case that Tests It:** **Bohr's Atom.**
      *   **Reasoning:** Bohr's energy formula $E_n \propto -1/n^2$ survives in QM. However, the *derivation* relies on classical orbital mechanics ($L = n\hbar$). In QM, angular momentum and position do not commute; the "orbit" structure is not a limit, it is a category error. The formalism survives only as a numerical coincidence in the spectrum, not as a structural limit of the dynamics. Thus, Bohr fails Clause 1 on *dynamics*, even if he passes on *spectral values*.

  #### Clause 2: Functional Role Continuity (Ontology is Secondary)
  *   **The Case that Forces It:** **Fresnel's Ether.**
      *   **Reasoning:** You want to save Fresnel despite the ether being false. The ether's role was to *support transverse wave propagation*. In Maxwell, the Electromagnetic Field supports transverse wave propagation. The *medium* changed from mechanical to fundamental, but the *functional role* (carrier of the wave) is filled by a real entity (the field).
      *   **Contrast:** If we demanded entity survival, Fresnel fails. By demanding role survival, Fresnel passes.
  *   **The Case that Tests It:** **Carnot's Caloric.**
      *   **Reasoning:** Caloric's role was to *constitute heat* and *flow from hot to cold*. In Thermodynamics, Heat is energy in transit, not a substance. The "flow" role is filled by Entropy/Energy transfer, but the "substance" role is not filled by anything (there is no heat fluid). This explains your **hesitation**. Carnot gets credit for the *cycle* (the functional relations), but the theory itself isn't "approximately true" because the central ontological bearer (the fluid) has no functional successor, only a conceptual analogue.

  #### Clause 3: Locus Stability
  *   **The Case that Forces It:** **Phlogiston (again) and Combustion.**
      *   **Reasoning:** In Phlogiston theory, the "combustibility" is a property located in the **fuel** (which loses phlogiston). In Oxygen theory, the "combustibility" is a property located in the **air** (which provides oxygen). The locus of the causal power shifts from the body burning to the medium surrounding it. This violates Locus Stability.
      *   **Contrast:** In Newton/Relativity, mass/energy remains a property of the **body**. In Fresnel/Maxwell, the wave disturbance remains a property of the **space/field** through which light travels.

  ---

  ### Application to Unlisted Cases

  #### 1. Ptolemaic Epicycles vs. Copernicus/Kepler
  *   **Verdict:** The machinery is mathematically redeemable, but causally dead.
  *   **Analysis:**
      *   **Structure:** Epicyclic motion is mathematically equivalent to Fourier series expansions of elliptical orbits. The formalism can be retained as a calculational device (Clause 1 passes in a weak sense).
      *   **Function/Role:** The crystalline spheres and deferents were meant to be physical carriers of the planets. No entity in modern astronomy fills this role (Clause 2 fails).
      *   **Locus:** The motion was attributed to complex geometric combinations centered on Earth. The locus of the "system center" shifts to the Sun (Clause 3 fails).
      *   **Conclusion:** Ptolemy gets credit for *predictive mathematical technique*, but not for being "on the right track" regarding planetary architecture. He was doing curve-fitting, not modeling dynamics.

  #### 2. Caloric Reasoning behind Carnot's Cycle
  *   **Verdict:** The reasoning is valid, the ontology is false.
  *   **Analysis:**
      *   **Structure:** The efficiency formula $\eta = 1 - T_C/T_H$ survives perfectly (Clause 1 passes).
      *   **Function:** The "flow" of heat drives the engine. This causal story survives (heat flow drives work). However, the *medium* of that flow (Caloric) does not (Clause 2 is partial).
      *   **Locus:** Heat flows from the hot reservoir to the cold. This locus of transfer is stable (Clause 3 passes).
      *   **Conclusion:** This explains your hesitation. Carnot is "more right" than Phlogiston (no sign inversion, stable locus) but "less right" than Fresnel (the medium itself is fictitious, whereas Fresnel's medium-role was taken by the Field). Carnot is *phenomenologically* approximately true, but *ontologically* false.

  ---

  ### The Honest Failure: Where the Principle Breaks

  The **Functional-Structural Continuity** principle cannot fully accommodate the nuance of your **Bohr** verdict without additional caveats, and it creates tension in your **Fresnel** verdict.

  **1. The Bohr Problem (The "Lucky Accident" Clause)**
  My principle suggests Bohr fails because the *dynamics* (orbits) don't survive. However, the *Energy Levels* do survive exactly. You say Bohr was "not on the right track."
  *   **The Failure:** Strictly speaking, the Bohr quantization condition ($\oint p dq = nh$) *is* the precursor to the WKB approximation in modern QM. It *is* a structural limit in semi-classical mechanics.
  *   **The Accommodation Gap:** To maintain your verdict that Bohr is *not* on the right track, the principle must add a **"Mechanism Priority"** constraint: *If the structural retention is limited to eigenvalues (outputs) but the eigenvectors (states/mechanisms) are wholly discontinuous, the theory is not approximately true.*
  *   **Why this is costly:** This privileges "how it works" over "what it predicts" heavily. It implies that a theory that predicts perfectly but for the wrong structural reasons gets *zero* credit for truth. Some philosophers would argue Bohr *is* approximately true about the stationary states. Your intuition is stricter: without the right mechanism, the right numbers are just numerology.

  **2. The Fresnel/Maxwell Ether Tension**
  You say Fresnel was on the right track, but Maxwell's ether was a mistake.
  *   **The Failure:** Both posited a medium. Fresnel's was mechanical; Maxwell's was electromagnetic. Both were abandoned for the vacuum field.
  *   **The Accommodation Gap:** Why does Fresnel get more credit? My principle says it's because the *Wave Equation* is the core structure. But Maxwell *also* gave us the Wave Equation.
  *   **The Resolution:** The distinction must be that Fresnel's theory was *primarily* about the Wave Equation, with the ether as a necessary evil. Maxwell's theory was *primarily* about the unification of electricity and magnetism, where the ether was a specific constitutive hypothesis.
  *   **The Cost:** This requires judging the *intent* or *core commitment* of the theorist, not just the formalism. If Fresnel is credited because the math was the point, and Maxwell's ether is rejected because the medium was the point, we are relying on a hermeneutic judgment of "what they really meant," which is harder to formalize than the math itself.

  ### Summary
  To hold your set of verdicts, you must commit to **Structural Realism about Dynamics, but Anti-Realism about Substance**, with a strict veto on **Causal Inversion**.

  *   **Fresnel:** Dynamics (Waves) = Real. Substance (Ether) = Placeholder. (Credit Given).
  *   **Newton:** Dynamics (Forces) = Real. Substance (Absolute Space) = Approximation. (Credit Given).
  *   **Carnot:** Dynamics (Flow) = Real. Substance (Caloric) = Fiction. (Credit Hesitant).
  *   **Bohr:** Dynamics (Orbits) = Fiction. Output (Levels) = Real. (Credit Denied).
  *   **Phlogiston:** Dynamics (Release) = Inverted. Substance (Phlogiston) = Fiction. (Credit Denied).

  This framework reproduces your verdicts by asserting that **getting the direction of the causal arrow right is more important than getting the mathematical mapping right.** Phlogiston mapped the math but reversed the arrow. Bohr mapped the output but falsified the mechanism. Fresnel and Newton mapped the mechanism and preserved the arrow, even if they misidentified the medium.
