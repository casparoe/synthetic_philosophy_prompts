prompt: |-
  I've been following the decision theory threads in the rationalist blogosphere and the philosophy of probability literature for a while, and I keep coming back to the Pasadena game as a kind of stress test for expected utility theory. Here's the setup, in case it helps to have it stated plainly: a fair coin is flipped until the first heads. If heads appears on the nth flip, the payoff is (-1)^(n-1) times 2^n divided by n. So the payoffs are +2, -2, +8/3, -4, +32/5, and so on, with the probability of the nth outcome being 1/2^n. If you sum the expected contributions in the natural order, you get the alternating harmonic series, which converges to ln 2. But the series is not absolutely convergent: the sum of the positive expected contributions diverges, and the sum of the negative expected contributions diverges. So the expected value is not well-defined in the usual sense — you can rearrange the terms to get any real number you like. The Altadena game is the same except that 1 is added to every payoff, so its natural sum is ln 2 + 1, but it too has an undefined expected value. And of course Altadena dominates Pasadena outcome-by-outcome, which makes the failure of expected utility theory especially stark: the theory cannot even say that the game that pays more in every possible outcome is better.

  What I want from you is not a full theory but the desiderata for one. Write the list of requirements that any adequate theory of rational choice in the presence of undefined expected values must meet. I'm interested in the cases it must get right, the distinctions it must respect, the results it must be consistent with, and the puzzles it must dissolve or explain. For each requirement, give the case or consideration that motivates it. For example, must the theory deliver a verdict on whether the Pasadena game is preferable to a sure $0, or is it allowed to say that rationality is silent here? Must it respect dominance, so that Altadena is ranked above Pasadena? Must it avoid sensitivity to arbitrary reorderings of the outcomes? Must it distinguish undefined expected value from infinite expected value, as in the St. Petersburg game? Must it explain why the natural ordering of the Pasadena series seems privileged, or explain away that appearance? Must it handle the Altadena game's relation to Pasadena — if you add a constant to every payoff, does the value shift by that constant, or does the game remain valueless? Must it say something about repeated play, or about combining these games with ordinary gambles? Must it be consistent with the von Neumann-Morgenstern axioms, or explain which axiom fails? And so on.

  I'd also like you to flag any pair of desiderata you suspect cannot be jointly satisfied — that's the part I most want to see, because I suspect the list itself is where the real result lies. If some subset of the requirements is jointly unsatisfiable, say so and explain which ones are in tension and why. Finally, briefly, how do the main existing approaches — plain expected utility theory, limit-based approaches that take the limit of truncated expectations, non-standard analysis, dominance-plus-something, and whatever else you think is a serious contender — do against the list? Keep the weight on the criteria and their motivating cases rather than the scorecard; I'll do the scoring myself. No need for citations or reading lists; I want the conceptual map, not the bibliography.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Decision theory under undefined expected values, specifically focusing on the Pasadena Game and Altadena Game.
      *   **Task:** Create a list of *desiderata* (requirements) for an adequate theory of rational choice in this context.
      *   **Specifics:** For each desideratum, provide the motivating case/consideration. Flag tensions/incompatibilities between desiderata. Briefly evaluate existing approaches against these criteria (conceptual map, not bibliography).
      *   **Tone/Style:** Philosophical, rigorous, conceptual mapping. No citations needed.
      *   **Key Examples to Address:** Pasadena Game, Altadena Game, St. Petersburg Game, Sure $0, Dominance, Rearrangement, Repeated Play, VNM Axioms.

  2.  **Deconstruct the Problem Space:**
      *   The core issue is that Expected Utility Theory (EUT) relies on the Lebesgue integral (or absolute convergence) to define value. The Pasadena game creates a conditionally convergent series.
      *   Riemann Rearrangement Theorem implies the sum depends on the order of summation.
      *   Dominance fails in standard EUT because neither game has a defined expectation to compare.
      *   Intuitively, Altadena > Pasadena (pointwise dominance).
      *   Intuitively, Pasadena vs. $0 is unclear (is ln 2 the value?).
      *   Intuitively, St. Petersburg (infinite EV) is different from Pasadena (undefined EV).

  3.  **Drafting the Desiderata (Brainstorming & Refining):**

      *   *Dominance:* If Game A pays more than Game B in every state, A > B. (Motivated by Altadena vs. Pasadena).
      *   *Extensionality/Order Invariance:* The value shouldn't depend on how we list the outcomes. (Motivated by Riemann Rearrangement).
      *   *Finite Additivity/Linearity:* If I add a constant $c$ to every payoff, value should increase by $c$. (Motivated by Altadena = Pasadena + $1).
      *   *Distinction:* Must distinguish Infinite EV (St. Petersburg) from Undefined EV (Pasadena).
      *   *Verdictiveness:* Should the theory always give an answer? Or is "indeterminate" allowed? (Pasadena vs. $0).
      *   *Aggregation:* What happens if I play twice? (Two Pasadena games).
      *   *Continuity:* Small changes in probabilities/payoffs shouldn't cause massive jumps in value.
      *   *VNM Consistency:* Which axioms hold? (Completeness is the obvious casualty).

  4.  **Identifying Tensions (The "Impossibility" Theorems):**
      *   This is the crux. Nover & Hájek (2004) and Colyvan (2006) discuss this.
      *   *Tension 1:* Dominance vs. Order Invariance vs. Standard Summation. If you enforce the natural order (ln 2), you violate order invariance. If you enforce order invariance, you can't assign a specific number like ln 2.
      *   *Tension 2:* Dominance vs. Additivity. If Pasadena is undefined, and Altadena is Pasadena + 1, is Altadena undefined + 1?
      *   *Tension 3:* Completeness vs. Dominance. If we drop Completeness (allow "no verdict"), we save Dominance. If we keep Completeness, we might violate Dominance or Order Invariance.
      *   *Key Impossibility:* You generally cannot have a theory that satisfies (1) Standard EUT axioms (including Completeness), (2) Dominance, and (3) Order Invariance for conditionally convergent series. Something has to give.

  5.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the depth of the problem (Pasadena as a singularity for EUT).
      *   **Section 1: The Desiderata:** List the requirements with motivations.
          *   D1: Pointwise Dominance.
          *   D2: Order Invariance (Representation Independence).
          *   D3: Additivity/Translation Invariance.
          *   D4: Distinction (Infinite vs. Undefined).
          *   D5: Verdictiveness (Completeness).
          *   D6: Aggregation (Repeated Play).
          *   D7: Consistency with Finite Cases.
      *   **Section 2: The Tensions (Impossibility Results):** Highlight the incompatible subsets.
          *   Dominance + Order Invariance + Specific Value Assignment.
          *   Completeness + Dominance + Standard Arithmetic.
      *   **Section 3: Evaluation of Existing Approaches:**
          *   Standard EUT (Fails Dominance/Verdictiveness).
          *   Truncation/Limit Approaches (Violates Order Invariance).
          *   Non-Standard Analysis (Hyperreals) (Preserves arithmetic, maybe violates standard dominance intuition).
          *   Incompleteness/Partial Orderings (Drops Completeness to save Dominance).
      *   **Conclusion:** Summary of the trade-off landscape.

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish between "Undefined" (Pasadena) and "Infinite" (St. Petersburg). St. Petersburg diverges to +infinity. Pasadena oscillates.
      *   *Nuance:* On "Verdictiveness." Is it a requirement that the theory *must* rank Pasadena vs. $0? Or is it a requirement that it *explains* why it might not? I should frame it as a tension: "Decisiveness" vs. "Caution."
      *   *Nuance:* On "Order Invariance." The "natural order" (n=1, 2, 3...) corresponds to the temporal or causal structure of the coin flips. Does the theory need to respect the *sample space* structure or just the *outcomes*? This is a key philosophical pivot. I should frame the desideratum as "State-Description Invariance" but note the tension with "Natural Ordering."
      *   *Tension Check:* The most famous tension is between Dominance and the expectation principle when expectations don't exist. But more specifically, if you define value via limits of partial sums (truncation), you get ln 2. But if you rearrange, you get something else. So Truncation violates Order Invariance. If you demand Order Invariance, you can't assign ln 2. If you can't assign ln 2, you can't compare to $0 easily.
      *   *Additivity:* If $V(Pasadena)$ is undefined, is $V(Pasadena + 1)$ also undefined? If so, how do we say Altadena > Pasadena? We need a way to compare undefined values. This suggests a partial ordering or hyperreals.

  7.  **Final Polish:**
