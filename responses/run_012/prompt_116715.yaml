prompt: |-
  Hey, so I'm a third-year undergrad and I'm taking this seminar on decision theory and AI safety, and each of us has to run one of the student-led sessions. Mine is in two weeks and it's on acausal threats and surrogate goals — 90 minutes, about 16 people, normal seminar room with movable chairs, whiteboard, and basically no budget (I can buy index cards and a bag of poker chips, that's it). Can you help me design the actual activity? Act like an expert in decision theory pedagogy who's run this kind of thing before, and please brainstorm a few possible game structures first before you commit to one, then give me the one you'd actually run and why.

  The idea I need them to feel, in my own words: normally we think a threat only works if it's credible, and it's credible only if carrying it out is in the threatener's interest once the moment comes. But there's a weirder move open to the person being threatened: instead of refusing or paying, they can *become a different kind of agent* — adopt a policy of punishing anyone who threatens them, even though the punishment costs them something and even though, if it all works, they'll never actually have to carry it out. If that policy is known (or at least predictable) on the other side, threatening them stops being worth it and the threat never gets made. So the policy is never used, and that's exactly why it works. The "surrogate" part is that the policy isn't your real goal — it's a stand-in you take on because of how it changes other people's reasoning about you. And the "acausal" part is when the threatener is someone you'll never meet or interact with — an agent that's just predicting what you'd do (maybe a simulation of you, maybe someone reasoning about you from far away), so you can't retaliate against it directly and can't negotiate with it. The only lever you have is what kind of agent you can make yourself be, in advance, in a way a reasoner can figure out.

  What I want them to walk away seeing: that a self-harming policy can be instrumentally rational because it changes other people's incentives; that the value of a commitment comes entirely from the fact that it never gets exercised; and that when the other side is only predicting you rather than interacting with you, the commitment has to be something they can actually infer about you, which is a much stranger requirement.

  Rules I'd like you to build on: no real money, chips/points only; everyone should be able to make and recieve threats in a first phase so they feel how a blackmail economy eats everybody's payoff; then a second phase where people can adopt a pre-commitment card that the referee enforces for them; then something that gets at the acausal bit. I have a vague idea about splitting the room into two halves that can't talk to each other and telling each half that the other half is "reasoning about you" rather than playing against you, but I don't know if that works or how to make the payoffs concrete. Figure it out for me and make the rules precise enough that I can run it without improvising at the front of the room.

  Also give me the debrief: the exact mapping from moments in the game to the parts of the idea, including the moment I should expect them to notice the weird thing. Tell me what will definately go wrong the first time — I assume someone will try to game the referee or refuse to play along, and someone will say it's just the prisoner's dilemma again — and how to handle each. And be honest about which part of the idea the activity *can't* reproduce and that I'll just have to tell them, because I'd rather know that going in than find out when someone asks.

  Please don't give me a lecture script or a reading list and don't cite papers — I can't look anything up in the room anyway and I don't want the session to be about the literature. I want the thing to be felt in what happens, not said by me at the end. And keep the whole thing runnable in 90 minutes including the debrief, with a timing breakdown.
