  ### Final Advice for You
  Stand up the whole time. Move between the pairs. When Phase 1 is happening and Targets are submitting, lean in and ask, "Are you sure you want to lose 10 chips?" Watch them waver. That hesitation is where the learning happens. In Phase 3, when they turn their chairs around, lower your voice. Make it feel like a experiment. You are not teaching them the answer; you are letting them collide with the problem until the answer is the only thing that makes sense.
