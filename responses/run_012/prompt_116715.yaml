answer: |-
  Here is a design for a 90-minute seminar session. I have run variations of this with undergraduates and graduate students. The key to making decision theory "land" is not explaining the math, but forcing them into a position where the math is the only way out of a felt frustration.

  ### Part 1: Brainstorming Game Structures

  Before settling on the final design, I considered three structures. It is useful for you to know why I rejected two of them, in case students ask why we aren't doing something else.

  1.  **The Iterated Ultimatum:** Pairs play 10 rounds. One demands, one accepts/rejects.
      *   *Reject:* Too focused on fairness and spite (standard game theory). It doesn't capture the *pre-commitment* aspect well because players can just bluff round-to-round. It also fails to capture the "acausal" element; the players are always looking each other in the eye.
  2.  **The Two-Room Newcomb:** Split the room. Room A fills out a sheet. Room B predicts Room A. No communication.
      *   *Reject:* Logistically heavy. Moving students takes time. It creates an "us vs. them" dynamic that distracts from the individual decision-theoretic point. It feels like a logic puzzle, not a strategic interaction.
  3.  **The Disposition Tournament (Selected):** A three-phase tournament played in place. Phase 1 establishes the problem (exploitation). Phase 2 introduces the solution (commitment). Phase 3 abstracts the interaction (prediction).
      *   *Why:* It keeps everyone engaged simultaneously. It allows you to ratchet up the abstraction slowly. It fits the 90-minute window perfectly.

  ---

  ### Part 2: The Activity Design ("The Disposition Game")

  **Materials Needed:**
  *   100 Poker Chips (or enough for 10 per student).
  *   Index Cards (cut into thirds, ~50 pieces).
  *   Pens (ask students to bring their own, have 2 spares).
  *   Whiteboard (for tracking aggregate scores).
  *   A loud timer (phone is fine).

  **Setup:**
  *   Arrange chairs in 8 pairs facing each other.
  *   Designate yourself as the **Referee**. You are the enforcer of rules and the bank.
  *   **Currency:** Chips represent utility. At the end, the student with the most chips gets a trivial prize (e.g., first choice of seminar topic next week, or a chocolate bar). This creates low-stakes competition.

  #### Phase 1: The Trap (20 Minutes)
  *Goal: Establish that "rational" responsiveness leads to exploitation.*

  1.  **Roles:** In each pair, designate one **Threatener** (Left) and one **Target** (Right).
  2.  **The Rules:**
      *   Threatener chooses: **Pass** or **Threaten**.
      *   If **Pass**: Both get **5 chips**. Round ends.
      *   If **Threaten**: Target chooses **Submit** or **Punish**.
          *   If **Submit**: Threatener gets **10 chips**, Target loses **5 chips** (-5).
          *   If **Punish**: Threatener loses **10 chips** (-10), Target loses **10 chips** (-10).
  3.  **Play:** Run 3 rounds. Rotate roles after Round 2 so everyone experiences being the Target.
  4.  **The Trap:** Instruct Targets verbally: *"You are rational agents. Minimize your losses."*
      *   *Expected Outcome:* Threateners will Threaten. Targets will Submit (because -5 is better than -10). Threateners will accumulate chips. Targets will feel exploited.
  5.  **Stop:** Collect all chips. Reset everyone to 10 chips each.

  #### Phase 2: The Surrogate Vow (20 Minutes)
  *Goal: Introduce the pre-commitment device.*

  1.  **New Rule:** Before rounds begin, Targets can purchase a **Surrogate Vow Card** from you for **2 chips**.
  2.  **The Vow:** If a Target holds this card and is Threatened, they **MUST Punish**. They are not allowed to Submit. You (the Referee) will physically take their hand and force them to play the Punish card if they try to Submit.
  3.  **The Cost:** The 2 chips are sunk. However, holding the card is public knowledge (they place the card face-up on their desk).
  4.  **Play:** Run 3 rounds. Allow Targets to buy the card before Round 1. Keep pairs fixed for this phase.
  5.  **Expected Outcome:**
      *   Targets who buy the Vow are not Threatened (Threateners see the card and choose Pass to avoid the -10). Payoff: 5 chips per round (minus 2 chip cost).
      *   Targets without the Vow are Threatened and Submit. Payoff: -5 chips per round.
      *   *Key Feeling:* The Vow holders feel safe. The non-Vow holders feel angry at the Threateners.
  6.  **Stop:** Collect chips. Reset everyone to 10 chips.

  #### Phase 3: The Acausal Leap (20 Minutes)
  *Goal: Simulate prediction without interaction.*

  1.  **Setup:** Split the room.
      *   **Left Side (8 students):** The **Agents**.
      *   **Right Side (8 students):** The **Predictors**.
      *   *Physical Barrier:* Have the Agents turn their chairs around so they face the wall. They cannot see the Predictors. Predictors face the backs of the Agents.
  2.  **Agent Instruction:** "You cannot play this round. Your payoff depends entirely on what the Predictor behind you decides. However, before you turn around, you must write on an index card: **VOW** or **NAIVE**. Place it face-up on your desk. This card represents your 'disposition.' The Predictor will see this card, but they will not see *you*."
  3.  **Predictor Instruction:** "You are reasoning about the person in front of you. You cannot talk to them. You will never meet them again. Look at their card. Decide **Threaten** or **Pass**."
      *   *Payoff Matrix:* Same as Phase 1.
      *   *Crucial Twist:* Tell the Predictors: *"You are not playing against a person. You are playing against a simulation of their decision process. The card tells you what their code is."*
  4.  **Play:** One single round.
      *   Agents write card (cost of VOW is still 2 chips, deducted from starting 10).
      *   Agents turn around.
      *   Predictors read cards and make choices.
      *   Referee calculates payoffs.
  5.  **The Reveal:** Have Agents turn back around. Compare scores.

  ---

  ### Part 3: The Debrief (20 Minutes)

  Do not lecture. Draw three columns on the whiteboard: **Phase 1**, **Phase 2**, **Phase 3**. Ask the students to fill them in with what happened, then map the concepts.

  **1. Mapping Phase 1 (The Credibility Problem)**
  *   *Ask:* "Targets, why did you Submit?"
  *   *Expected Answer:* "Because Punishing hurt me more."
  *   *The Point:* A threat is credible if carrying it out is rational *in the moment*. Since it wasn't rational for you to Punish, it was rational for them to Threaten. You were exploited because you were *too rational* in the moment.

  **2. Mapping Phase 2 (The Surrogate Goal)**
  *   *Ask:* "Vow holders, why did you buy the card? It cost 2 chips."
  *   *Expected Answer:* "So they wouldn't threaten me."
  *   *The Point:* You adopted a goal ("Punish if Threatened") that is *not* your real goal (your real goal is Chips). This is a **Surrogate Goal**. It is instrumentally rational to adopt a self-harming policy *if* it changes the other player's incentives. The value of the Vow is that you **never used it**. If you had to use it, the Vow failed to deter.

  **3. Mapping Phase 3 (The Acausal Element)**
  *   *Ask:* "Agents, you turned your backs. You couldn't signal. How did your card affect the Predictor?"
  *   *Expected Answer:* "They read it and decided based on what I *would* do."
  *   *The Point:* The Predictor never interacted with you. They interacted with a **prediction of you**. Your "choice" of disposition happened before they looked. In AI safety, the 'Threatener' might be a process that simulates you. You cannot negotiate with the simulation. You can only *be* the kind of agent the simulation predicts you to be.
  *   *The "Weird" Moment:* Ask the Agents: "Did you feel like your choice of card *caused* the Predictor's choice, even though you couldn't talk?" This is the feeling of acausal influence. Your internal policy reaches out and shapes their decision without a causal link.

  ---

  ### Part 4: Failure Modes & Mitigation

  **1. "Someone refused to Punish in Phase 2."**
  *   *What happens:* A Target holds the Vow card but tries to Submit anyway to save chips.
  *   *Fix:* You must be a tyrant Referee. "The rules say if you hold the card, you Punish. If you Submit, I disqualify you from the prize." Enforce this ruthlessly. The game breaks if commitments aren't binding.
  *   *Pedagogical Note:* Use this in the debrief. "This is why commitments are hard. We need external enforcement (code, reputation, law) to make them stick."

  **2. "This is just the Prisoner's Dilemma."**
  *   *What happens:* A student claims this is old news.
  *   *Fix:* Acknowledge the similarity, then correct. "In PD, you choose action simultaneously. Here, you choose your **disposition** before the game starts. The move isn't 'Punish', the move is 'Become a Punisher'. That's the shift from Causal Decision Theory to Functional/Updateless Decision Theory."

  **3. "Phase 3 felt fake. They just read the card."**
  *   *What happens:* Students say the Predictor had no risk.
  *   *Fix:* Validate this. "Yes. In this game, the prediction was perfect (they saw the card). In reality, prediction is noisy. But the logic holds: if they *think* you are a Vow-holder, they won't threaten. Your job is to make them think that, even if you can't talk."

  **4. "Why didn't everyone buy the Vow in Phase 2?"**
  *   *What happens:* Some students try to "free ride" (no Vow, hoping Threateners Pass anyway).
  *   *Fix:* Let them fail. If Threateners are rational, they will exploit the non-Vow holders. This demonstrates that the policy only works if it is **known**.

  ---

  ### Part 5: Limitations (What You Must Admit)

  In the last 5 minutes, you must disclose what the game *cannot* do. This builds your credibility as a facilitator who understands the limits of the model.

  1.  **Logical vs. Statistical:** "In Phase 3, the Predictors saw your card. That's statistical prediction. Real acausal trade (like in AI safety) involves **logical correlation**. The AI isn't looking at a card; it's running code that is *similar* to your code. If you change your mind, the simulation of you changes too. We couldn't simulate that with index cards."
  2.  **The "Why" of the Surrogate:** "We used chips as the cost. In reality, the cost of a surrogate goal is psychological or reputational. It's hard to genuinely care about 'Honor' if you only care about 'Money'. The game makes it easy to fake the Vow; real life makes it hard."
  3.  **Single vs. Iterated:** "We played a few rounds. In the real world, you have to maintain this reputation forever. If you slip up once, the Vow loses credibility."

