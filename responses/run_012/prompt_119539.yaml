      *   *The Counter-Objection:* If B causes R, R is causally connected to B. R is not causally connected to P. In a naturalistic theory of reference (like causal theory of reference), R refers to what causes it. So R refers to B, not P. If R refers to B, then when I say "I am in pain," I am actually saying "I am in brain state B." But I don't know that. I know I'm in pain. This leads to skepticism or error theory.
      *   *The "Aboutness" Inheritance:* Can reference be transferred? If B refers to P (via some relation), and R refers to B, does R refer to P? This requires a theory of content that isn't purely causal. Maybe functional role? But epiphenomenalism strips functional role from the mental.
      *   *Strongest Objection:* The knowledge argument. If epiphenomenalism is true, our beliefs about consciousness are caused by physical states. There is a possible world (zombie world) where the physical states are the same, the reports are the same, but there is no consciousness. If the reports are the same in both worlds, what makes them about consciousness in our world? The content seems undetermined.
      *   *Strongest Response:* Direct acquaintance or non-causal reference. Maybe we don't need causation for reference in the special case of consciousness. We are directly acquainted with qualia.
      *   *Survival:* Epiphenomenalism survives only if it accepts a non-naturalistic account of reference or accepts that our judgments are systematically mistaken (illusionism), but the latter undermines the motivation for epiphenomenalism (which usually wants to save the reality of qualia).

