answer: |-
  To understand the paradox of phenomenal judgment, we must first clearly define the position it challenges. Epiphenomenalism is a view in the philosophy of mind which holds that physical events in the brain cause conscious experiences, but those conscious experiences do not cause anything in return. In this picture, your brain states are like a steam engine and your conscious mind is like the whistle. The engine produces the sound, but the sound does not push the engine or steer the train. This view is often adopted to preserve the intuition that the physical world is causally closed, meaning every physical event has a sufficient physical cause, while still acknowledging that conscious experiences exist. However, this setup creates a profound difficulty when we consider how we talk about our own minds. When you say I am in pain or I see red, you are making a judgment about your conscious experience. Normally, we assume that for a judgment to be about something, that something must play a role in producing the judgment. If I see a tree and say there is a tree, the tree caused my visual experience which caused my speech. But if epiphenomenalism is true, your conscious experience of pain did not cause your report of pain. Only the underlying brain state caused the report. This leads to the paradox of phenomenal judgment. If conscious experiences are causally inert, then our judgments about them are not caused by them. If our judgments are not caused by our experiences, it becomes mysterious how those judgments can be about those experiences rather than about the brain states that actually caused them. It seems to imply that we cannot know our own minds, or that when we think we are talking about consciousness, we are actually talking about brain states without realizing it.

  The standard reply to this paradox attempts to salvage the connection between experience and judgment without granting causal power to the experience. This reply relies on the structure of a common cause. Imagine a specific neural event, which we can call N. According to the epiphenomenalist, N causes the conscious experience E, and N also separately causes the verbal report R. Even though E does not cause R, both E and R are effects of the same underlying physical cause N. Because they share a common cause, E and R are reliably correlated. Whenever E occurs, R occurs, and vice versa. The proponent of this reply argues that this correlation is sufficient to ground the aboutness of the judgment. Since the report is produced by the same event that produces the experience, the report tracks the experience. Therefore, when you say I am in pain, you are referring to the pain, even though the pain itself did not push the words out of your mouth. The neural state did the work, but it did the work in a way that aligns perfectly with the presence of the experience. This suggests that the judgment is about the experience because the judgment and the experience are locked together by their shared origin in the neural state.

  However, this reply faces a serious objection that suggests it merely relocates the problem rather than solving it. The core of the objection is that causal theories of reference usually dictate that a symbol or a thought refers to whatever caused it. If the verbal report R is caused entirely by the neural state N, then strictly speaking, R refers to N. If R refers to N, then when you say I am in pain, what you are actually saying is I am in neural state N. But this contradicts our direct understanding of our own reports. You do not know what neural state N is, nor do you intend to refer to it. You intend to refer to the feeling of pain. If the epiphenomenalist insists that R is about N, they are forced to admit that we are systematically mistaken about what our own words mean. We think we are talking about feelings, but we are actually talking about brain physics. This is a high price to pay, as it undermines the authority we seem to have over our own mental lives. If the reply is instead that R is about E despite being caused by N, the epiphenomenalist must explain how reference can bypass the immediate cause. They must explain how the report skips over the neural state to latch onto the experience, even though the experience played no role in generating the report.

  This brings us to the specific variant you asked about, where we must determine what would have to be true for the report R to count as being about the experience E rather than merely about the neural state N. For R to be about E, there must be some relation that allows aboutness to be inherited from N to E. Since N causes E, N carries information about E. If R is caused by N, R carries information about N. The question is whether the information about E contained in N can be transferred to R. For this inheritance to work, there must be a relation of representation or content that holds between N and E. The neural state N must represent the experience E. If N represents E, and R reports on N, then perhaps R indirectly reports on E. However, this pushes the problem back one step. How does the neural state N represent the nonphysical experience E? If representation requires a causal link, then N cannot represent E because E is causally inert and cannot act on N. If N represents E without a causal link, then we have already admitted that causal connection is not necessary for aboutness. If causal connection is not necessary for aboutness in the case of N representing E, then we could have simply said that R represents E directly without needing the neural intermediary. The appeal to the neural state becomes explanatory idle work. It adds a step that does no heavy lifting unless one insists on a physical cause for the report, but that insistence is what created the problem in the first place.

  The strongest version of the objection against epiphenomenalism in this context involves considering a world without consciousness. Imagine a zombie world that is physically identical to ours but lacks conscious experience. In this world, the neural event N occurs exactly as it does in our world, and the verbal report R occurs exactly as it does in our world. The only difference is that the conscious experience E does not exist. In this zombie world, the report R is produced, but there is no experience for it to be about. If the physical causes are sufficient to produce the report, then the report exists independently of the experience. If the report exists independently of the experience, then the content of the report cannot depend on the experience. This suggests that what makes the report about the experience in our world cannot be the physical mechanism, because that mechanism is present in the zombie world where there is no experience. Therefore, if epiphenomenalism is true, the difference between our world and the zombie world is invisible to the reports we make. Our judgments about consciousness would be identical whether consciousness existed or not. This implies that our judgments are not sensitive to the truth of consciousness. If our judgments are not sensitive to the truth, then we cannot claim to know that we are conscious. This is a devastating form of skepticism that suggests epiphenomenalism makes knowledge of our own minds impossible.

  The strongest response to this objection requires the epiphenomenalist to abandon a purely causal theory of reference for conscious experiences. They must argue that there is a special kind of reference that applies only to the mind. This is often called direct acquaintance. The idea is that when you are in pain, you are directly acquainted with the pain, and this acquaintance allows you to form a judgment about it without the pain needing to cause the judgment in the standard physical sense. The relation that does the inheriting of aboutness is not causal correlation but rather this relation of acquaintance. In this view, the neural state N causes the report R, but the content of R is fixed by the direct acquaintance the subject has with E. This allows the report to be about E even if E is causally inert. However, this response comes with a significant cost. It requires a dualistic theory of meaning where physical objects are referred to via causal chains, but mental objects are referred to via direct acquaintance. This breaks the unity of our understanding of how language and thought connect to the world. It posits a magical or brute connection between mind and judgment that does not exist anywhere else in nature. While this saves epiphenomenalism from the charge of making self-knowledge impossible, it does so by isolating the mind from the rest of the causal order so completely that it becomes difficult to see how the mind fits into the natural world at all.

  Ultimately, whether epiphenomenalism can survive the paradox depends on what one is willing to give up. If one holds that all reference must be causal, then epiphenomenalism cannot survive, because it severs the causal link required for our judgments to be about our experiences. If one accepts that reference can be non-causal in the specific case of consciousness, then epiphenomenalism can survive, but it must accept that the mind operates under different rules than the rest of reality. This makes the mind a unique exception to the natural order, which many philosophers find unsatisfying. Furthermore, even with this exception, the theory must accept that our physical behavior would be exactly the same if we were unconscious zombies. This means that the existence of consciousness makes no difference to how we act or speak. While this is consistent with the definition of epiphenomenalism, it renders consciousness evolutionarily inexplicable. If consciousness does not cause our reports, it does not cause our survival behaviors either. It becomes a mystery why we have consciousness at all if it does nothing. Therefore, epiphenomenalism can technically survive the paradox of phenomenal judgment by adopting a non-causal theory of reference for mental states, but it survives only by becoming increasingly disconnected from our scientific understanding of how knowledge and language work. It resolves the logical contradiction but leaves us with a view of the mind that is isolated, inexplicable, and strangely detached from the very behaviors we use to express it.
