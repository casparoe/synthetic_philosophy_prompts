          1.  **Critical:** Point 7 vs. Points 1, 2, 5 (The Rectification/Proviso Problem).
          2.  **High:** Point 6 vs. Point 2 (The Funding Problem).
          3.  **Medium:** Point 5 vs. Point 7 (The Starvation/Proviso Clash).
          4.  **Low:** Point 4 vs. Point 3 (Side-constraints vs. Liberty - actually these align well, so maybe skip or minimize). Let's focus on the *application* of side constraints.

      *   *Detailed Analysis:*
          *   **Tension 1 (The Rectification Trap):** You admit historical injustice is rampant. You admit the Proviso limits appropriation. But you hold Point 2 (Taxation = Forced Labour). If current holdings are illegitimate due to Point 7, reclaiming them isn't "taxation," it's "restitution." But administering this requires a massive state apparatus, which violates Point 6 (Minarchism) and looks like the Rawlsian machinery you hate.
          *   *Fix:* Either deny the extent of historical injustice (hard to do honestly) or accept that *current* redistribution is actually *backward-looking* rectification, not *forward-looking* pattern maintenance.
          *   *Cost:* You lose the "status quo is presumptively just" shield. You become a radical redistributor until the debt is paid.

          *   **Tension 2 (The Funding Paradox):** You want courts/police (Point 6) but call taxation forced labour (Point 2).
          *   *Fix:* Voluntary subscription? No, free-rider problem kills it. Coercive taxation? Then it's not forced labour, it's a fee for service.
          *   *Cost:* You must soften Point 2. Taxation for *protection* isn't forced labour; taxation for *redistribution* is. But drawing that line is messy.

          *   **Tension 3 (The Starving Neighbour & The Proviso):** Point 5 says let him starve. Point 7 says if your property monopoly makes him worse off than the state of nature, your title is void.
          *   *Fix:* Acknowledge the Proviso creates a positive duty in extreme scarcity.
