      *   *Check:* Ranking? *Correction:* Make sure the Rectification issue is top billed. It's the specific nuance this user added that destabilises the standard libertarian line.
      *   *Check:* Point 4 (Side Constraints). Actually, Point 4 fits well with 1, 2, 3. The tension is mostly with 6 and 7. I won't rank 4 as a major tension source itself, but rather how it interacts with 6.

