          *   Point 7 (Proviso) says appropriation is only valid if others aren't left worse off. If my appropriation of all the water holes leaves the neighbour to starve, the Proviso is violated.
          *   If the Proviso is violated, do I owe him something? If yes, Point 5 is compromised. If no, Point 7 is toothless.
          *   *Severity:* Medium-High. It exposes a conflict between absolute property rights and the conditions for their validity.

      *   *Tension D:* Point 4 (Side-Constraints) vs. Point 6 (State Existence).
          *   Nozick struggles to derive the state from the state of nature without violating rights. The "Invisible Hand" explanation is notoriously weak.
          *   If rights are absolute side-constraints, how do you get a monopoly on force (the state) without violating the rights of independent enforcers?
          *   *Severity:* Medium. Philosophical derivation issue, less practical than A or B.

  4.  **Drafting the Audit (incorporating British English and directness):**

      *   *Introduction:* Acknowledge the position is recognisably Nozickian. State clearly that Point 7 is the grenade in the pocket.
