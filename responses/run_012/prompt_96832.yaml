          2.  Self-Ownership (Taxation = Forced Labour).
          3.  Wilt Chamberlain Argument (Liberty upsets patterns).
          4.  Rights as Side-Constraints (Deontological, not Consequentialist).
          5.  No Positive Duties (Starving neighbour scenario).
          6.  Minarchism (State for courts/police/defence only).
          7.  Rectification/Proviso (Historical injustices matter, Lockean Proviso applies).

  2.  **Initial Assessment of the Position:**
