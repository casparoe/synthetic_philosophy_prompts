      *   Energy scales: High energy doesn't necessarily mean "more consciousness." It might mean "shorter lifetime."

  6.  **Step 4: Moral Philosophy Check:**
      *   Utilitarianism vs. Rights. The "Welfare per Joule" sounds utilitarian.
      *   Moral Patienthood: Requires interests. Do electrons have interests? To persist? To spin up rather than down?
      *   The "Scope" problem: If every interaction matters, action becomes impossible (breathing kills bacteria, walking crushes mites). This is the "overdemandingness" objection, but scaled to the atomic level.

  7.  **Step 5: Synthesizing the "Real Question":**
