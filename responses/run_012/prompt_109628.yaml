answer: |-
  Here is the principle your verdicts are straining to form, repaired to coherence. It is not the principle you currently hold, but it is the one that best accommodates your intuitions about authority, community, and machinery, with one specific cost.

  ### The Principle: Diachronic Normative Authority

  **A speaker means $X$ by a term if and only if:**

  1.  **Normative Attitude:** The speaker treats the use of the term as subject to standards of correctness, such that they recognize some potential uses as mistakes and others as correct (distinguishing themselves from the calculator).
  2.  **Diachronic Grounding:** The standard of correctness is not self-generated *ex nihilo*, but inherited from a practice (a community or a lineage) to which the speaker belongs or is the designated successor (distinguishing the nephew from the last speaker).
  3.  **Distributed Agency:** The "speaker" in clause (1) may be a coordinated system of agents, provided the system as a whole maintains the normative attitude, even if individual components do not grasp the total rule (accommodating the team of clerks).

  **The Mechanism of Error vs. Change:**
  *   **Error:** A deviation from the inherited standard that the speaker *acknowledges* (or would acknowledge if competent) as a violation of their own norm (the partner's slip, the nephew).
  *   **Meaning Change:** A deviation from the inherited standard that the speaker *adopts* as the new standard, which is permissible only if the speaker holds sufficient authority within the practice to redefine the norm (Dan, the islanders, the last speaker).

  ---

  ### How the Clauses Handle Your Cases

  *   **The Calculator/AI:** Fails **Clause 1**. It has no attitude toward correctness; it has only causal inevitability. It does not "recognize" a mistake; it merely outputs a different state based on input. **Verdict: No meaning.** (Matches your intuition).
  *   **The Partner's Slip:** Satisfies **Clause 1** (she corrected herself) and **Clause 2** (she appeals to the shared standard of where keys usually are). **Verdict: Error, meaning unchanged.** (Matches your intuition).
  *   **The Nephew:** Satisfies **Clause 1** (he is trying to label correctly) but fails **Clause 2** regarding authority. He is a subordinate participant in the practice; he cannot unilaterally redefine "truck." **Verdict: Error/Incompetence.** (Matches your intuition).
  *   **Dan & The Islanders:** Satisfy **Clause 1** and **Clause 2**. As peer participants in their respective practices, they have the authority to negotiate the boundaries of the norm. **Verdict: Idiolectal/Communal Meaning Change.** (Matches your intuition).
  *   **The Last Speaker:** Satisfies **Clause 1** and **Clause 2**. Crucially, **Clause 2** is interpreted *diachronically*. She is the designated successor of the extinct community. Her authority is inherited; therefore, her drift constitutes a change in the language, not an error. **Verdict: Meaning Change.** (Matches your intuition).
  *   **The Team of Clerks:** Satisfies **Clause 3**. The "speaker" is the team-system. The system holds the norm (the total sum must be correct), even if the parts (clerks) only hold local norms. **Verdict: Team means addition.** (Matches your intuition).

  ---

  ### Two New Test Cases

  To test the precision of this principle, here are two cases you did not list, and how the principle adjudicates them.

  **1. The Sleepwalker**
  A man speaks fluently in his sleep, reciting poetry and doing arithmetic. He gets the sums wrong. Upon waking, he remembers nothing and denies authorship.
  *   **Principle Verdict:** **No Meaning.**
  *   **Why:** Fails **Clause 1**. The "Normative Attitude" requires the capacity to recognize a mistake *as a mistake*. The sleepwalker cannot be corrected, nor does he hold himself to the norm upon waking. He is functionally identical to the calculator during the episode.
  *   **Work Done:** This clause prevents meaning from being ascribed to mere causal outputs that mimic normativity without the accompanying commitment.

  **2. The Cult Leader**
  A leader tells her followers, "From now on, 'sacred' means 'obedient to me'." The followers accept this. The leader herself uses "sacred" arbitrarily, sometimes for obedience, sometimes for "pretty," with no correction.
  *   **Principle Verdict:** **Leader: No Meaning (or chaotic); Followers: Meaning Change.**
  *   **Why:** The Followers satisfy **Clause 1 & 2**; they have adopted a new norm grounded in the leader's decree. The Leader fails **Clause 1**; she does not hold herself to the norm she imposed. She is not answerable to the rule.
  *   **Strain:** This highlights that authority requires *submission* to the norm as well as the power to set it.

  ---

  ### The Cost: Which Verdict You Must Give Up

  To make this principle coherent, you must sacrifice your verdict on the **Stroke Patient**.

  **Your Current Verdict:** He no longer means addition by "+" at all; he is like the calculator (meaningless).
  **The Principle's Verdict:** He **means addition**, but he is **systematically incompetent**.

  **Why you must give this up:**
  Your current view creates a binary cliff between "Error" (Nephew) and "Nothing" (Stroke Patient). Both intend to follow the rule. Both fail to produce the correct output. The only difference is that the Nephew *can* learn and the Stroke Patient *cannot*.

  However, **Meaning** is a matter of *Reference* (what are you trying to do?), while **Competence** is a matter of *Reliability* (can you do it?).
  *   The Calculator does not *try* to add. (No Meaning).
  *   The Stroke Patient *tries* to add. (Meaning).
  *   The Stroke Patient *fails* to add. (Error/Incompetence).

  By classifying the Stroke Patient as "Meaningless," you are conflating the *loss of the capacity to execute* with the *loss of the intention to refer*. If he sits down to do his accounts, he is participating in the practice of addition (**Clause 1**). He is grounded in the standard arithmetic of his community (**Clause 2**). The fact that his brain no longer supports the computation makes him a broken instrument, like a thermometer that always reads 50°. A broken thermometer still *means temperature*; it is just always wrong.

  **The Consequence:**
  If you accept this, the Stroke Patient moves into the same category as the **Nephew**. Both are **Meaningful but Erroneous**.
  *   The Nephew is erroneous due to *developmental* lack of capacity.
  *   The Stroke Patient is erroneous due to *degenerative* loss of capacity.

  This removes the need for a mysterious threshold where "meaning vanishes" despite preserved intent. It forces you to admit that meaning is more robust than performance. You can still say he is "no longer competent," but you cannot say he "no longer means addition." He means addition perfectly well; he just cannot do it.

  **Summary of the Trade:**
  You keep the Calculator (No Meaning), the Team (Meaning), and the Last Speaker (Authority). You lose the distinction between the Nephew and the Stroke Patient. They become the same kind of case: **Agents who hold the norm but lack the capacity to satisfy it.** This is the only way to resolve the tension between your desire for normativity (which the patient has) and your desire for correctness conditions (which the patient fails).
