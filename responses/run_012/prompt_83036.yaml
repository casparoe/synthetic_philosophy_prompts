answer: |-
  # The Consciousness Decision Tree

  **Node 1: The Locus Question**
  In the **cutaneous rabbit illusion, where taps on the wrist feel like they hop up the arm**, must the disparate signals converge at a privileged neural locus to be assembled before awareness occurs?
  *   **Yes:** Go to Node 2.
  *   **No:** Go to Node 3.

  **Node 2: The Nature of the Locus**
  If such a locus exists, is it a **spatial display area where contents are presented to an inner observer**, or merely a **functional broadcast making information available to multiple systems**?
  *   **Spatial Display:** **Cartesian Materialism**
  *   **Functional Broadcast:** **Global Workspace Theory**

  **Node 3: The Content Question**
  In **split-brain cases where patients invent reasons for actions initiated by the other hemisphere**, is there a determinate fact about what the patient experienced independent of their verbal report?
  *   **Yes:** Go to Node 4.
  *   **No:** Go to Node 5.

  **Node 4: The Timing Question**
  In the **color phi phenomenon, where subjects see motion between two static flashing lights**, is there a determinate fact about the exact moment the experience of motion occurred relative to the second flash?
  *   **Yes:** **Higher-Order Thought Theory**
  *   **No:** *(Empty Cell: Unattractive)*

  **Node 5: The Reality Question**
  In **masked stimuli cases where subjects act on images they deny seeing**, do phenomenal properties exist but remain indeterminate, or are claims about phenomenal properties systematically false?
  *   **Exist (Indeterminate):** **Multiple Drafts Model**
  *   **Systematically False:** Go to Node 6.

  **Node 6: The Conceptual Question**
  In **blindsight cases where patients guess visual stimuli without conscious sight**, should the concept of 'phenomenal experience' be revised to describe functional states, or discarded entirely?
  *   **Revised:** **Illusionism**
  *   **Discarded:** **Eliminativism**

  ***

  # Analysis of the Instrument

  ### Indistinguishable Leaves
  This tree cannot rigorously separate **Cartesian Materialism** and **Global Workspace Theory**. Both positions answer "Yes" to the existence of a privileged finish line (Node 1). The distinction at Node 2 relies on a difference between "spatial display" and "functional broadcast." However, if the functional broadcast serves as the necessary and sufficient condition for consciousness, it functionally acts as a theater's "finish line." Dennett argues that Global Workspace Theory is merely Cartesian Materialism updated with modern network terminology; both posit a point where unconscious processing becomes conscious experience. Without a metaphysical commitment to literal spatiality versus functional topology, these leaves occupy the same logical space.

  Similarly, **Illusionism** and **Eliminativism** are nearly indistinguishable on these axes. Both deny the existence of determinate phenomenal properties (Node 5). The split at Node 6 is pragmatic rather than ontological: whether to retain the folk-psychological vocabulary of "experience" while redefining it (Illusionism) or to abandon it as false theory (Eliminativism). Empirical data from blindsight cases does not force a choice between revising or discarding the concept; both strategies accommodate the data equally well.

  ### Empty Cells and Unoccupied Combinations
  The tree reveals three combinations of answers that no serious theory occupies:

  1.  **Locus = Yes / Content = No:** (Reached if Node 1 is "Yes" but Node 3 is "No").
      *   **Verdict:** **Incoherent.**
      *   **Reasoning:** Positing a privileged place where consciousness happens (a theater) while denying there is a fact about what is on the stage undermines the definition of the locus. If there is no determinate content being displayed, the "display area" has no function and ceases to be a locus of consciousness.

  2.  **Locus = No / Content = Yes / Timing = No:** (Reached if Node 3 is "Yes" but Node 4 is "No").
      *   **Verdict:** **Unattractive.**
      *   **Reasoning:** This view holds that there is a fact about *what* was experienced, but no fact about *when* it occurred. This violates causal closure and makes the experience epiphenomenal. If an experience has content but no temporal location, it cannot interact with memory or report, rendering the "determinate fact" undetectable in principle.

  3.  **Locus = Yes / Timing = No:** (A variant of Cell 1).
      *   **Verdict:** **Incoherent.**
      *   **Reasoning:** A privileged locus implies a processing stage. Processing requires time. To claim a specific place where consciousness exists without a specific time it exists is to posit a static object rather than a cognitive event.

  ### Separation of Axes
  This instrument successfully isolates the three axes you identified:
  *   **Axis 1 (Locus):** Isolated at Node 1. This separates the "Theater" views (CM, GWT) from the "Distributed" views (HOT, MDM, Illusionism, Eliminativism).
  *   **Axis 2 (Content):** Isolated at Node 3. This separates Realist views about experience (HOT) from Anti-Realist/Indeterminate views (MDM, Illusionism, Eliminativism).
  *   **Axis 3 (Timing):** Isolated at Node 4. This separates views that commit to a specific moment of consciousness (HOT) from those that view timing as probe-relative (MDM).

  By forcing the reader to adjudicate concrete cases (the Rabbit, the Split-Brain, the Phi) rather than abstract definitions, the tree prevents the collapse of these questions into a single "Is there consciousness?" binary.
