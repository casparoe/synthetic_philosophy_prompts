answer: |-
  ### Exam Question

  **Question 4 (25 Marks)**
  **Suggested Time: 45 Minutes**

  In standard HCH (Humans Consulting HCH), a human agent may decompose a question into sub-questions, query recursive copies of themselves, and then adapt their strategy based on the answers received (e.g., re-decomposing, discarding branches, or requesting clarification). In **Committed HCH**, a node must fix its decomposition strategy and its method for combining child answers *before* seeing any output from below.

  Evaluate whether Committed HCH is a strictly inferior idealisation of rational deliberation, or if Plain HCH's adaptive freedom merely smuggles in unaccounted computation by allowing the node to perform meta-reasoning that should have been factored out. Furthermore, assess whether either model is well-defined as an idealisation of deliberation, given that the recursion bottoms out in unaided humans and the combination of answers may be as difficult as the original question.

  **Requirement:** In your response, you must defend a specific position on *one* of the following implications:
  (A) What conditions are necessary for HCH to count as an *amplification* of human judgment rather than a mere rearrangement of it?
  OR
  (B) Is HCH's competence fundamentally bounded by the decomposability of the question rather than the capability of the humans involved?

  Do not survey both (A) and (B); choose one and argue for it rigorously.

  ***

  ### Model Answer

  The distinction between Plain and Committed HCH turns on the locus of intelligence within the recursion. Plain HCH allows the node to act as a dynamic manager, adjusting the tree structure based on intermediate results. Committed HCH forces the node to act as a static circuit, defining the flow of information ex ante. To claim Committed HCH is strictly worse is to assume that adaptivity is essential to deliberation; however, to claim Plain HCH is superior is to risk obscuring where the cognitive work actually occurs.

  Plain HCH's adaptive freedom does indeed smuggle in extra computation. When a node receives a child's answer and decides to re-decompose based on that content, it is performing a meta-cognitive evaluation: "Is this answer sufficient?" This evaluation is itself a cognitive task that requires understanding the sub-answer in the context of the parent question. In Committed HCH, this evaluation cost must be explicit—either baked into the combination function or delegated to a separate branch. Plain HCH hides this cost within the node's "freedom," effectively allowing the human to solve parts of the problem directly under the guise of routing. Therefore, Committed HCH is not inferior; it is merely more honest about the computational budget. It forces the factoring to be complete, whereas Plain HCH permits lazy factoring where the human node fills the gaps via adaptive intervention.

  However, this honesty highlights a deeper instability in both models regarding their well-definedness. Both models rely on the assumption that there exists a decomposition such that the sub-questions are easier than the parent, and that the combination function is simpler than solving the parent directly. If the combination of child answers requires understanding the sub-answers as deeply as solving the original problem, the factoring buys nothing. Since the recursion bottoms out in unaided humans, the system's ceiling is determined by the hardest single step any human must perform. If the "combination" step remains hard, the idealisation fails to escape human limitation. The regress stops not because the problem is solved, but because the human at the leaf or the root cannot break it down further. Thus, neither model is fully well-defined as an idealisation of *unbounded* rational deliberation; they are idealisations of *distributed* bounded rationality.

  Regarding implication (A)—amplification versus rearrangement—HCH counts as amplification only if the composite system can reach verdicts that no single node could justify alone, even given infinite time. If the system merely rearranges judgments, it is simply aggregating existing human competence. For amplification to occur, the decomposition must create epistemic leverage. This requires that the sub-questions access evidence or logical steps that are invisible to the unaided human facing the whole question. If the human at the root cannot verify the combination of answers without already knowing the answer, no amplification has occurred; only obfuscation. Therefore, amplification requires that the validity of the combination rule be checkable at a lower complexity class than the original question. Without this asymmetry, HCH is merely a rearrangement of human judgment, distributing the labor but not expanding the horizon of what is knowable.

  In conclusion, Committed HCH is a stricter, more transparent idealisation that exposes the hidden meta-reasoning in Plain HCH. However, both models face the same fundamental limit: they are bounded by the hardest irreducible step in the chain. True amplification requires not just factoring, but factoring that reduces the complexity of verification below the complexity of generation. Without this, HCH remains a rearrangement of human limitation rather than an escape from it.

  ***

  ### Marking Scheme

  **Total: 25 Marks**

  **1. Distinction between Plain and Committed HCH (5 Marks)**
  *   **Top Answer:** Clearly identifies that Plain HCH allows adaptive meta-reasoning (checking answers before proceeding) while Committed HCH forces static decomposition/combination strategies ex ante.
  *   **Typical Flub:** Treats them as identical or focuses only on "time limits" rather than the structural constraint on decomposition strategy.

  **2. Analysis of "Smuggling Computation" (5 Marks)**
  *   **Top Answer:** Argues that Plain HCH's adaptivity hides the cognitive labor of evaluating sub-answers within the node, whereas Committed HCH forces this labor to be explicit in the combination function or separate branches.
  *   **Typical Flub:** Claims Plain HCH is "better" because it is more flexible, without addressing whether that flexibility constitutes hidden work that violates the factoring premise.

  **3. Critique of Well-Definedness (5 Marks)**
  *   **Top Answer:** Addresses the "combination problem" (merging answers may be as hard as the original question) and the grounding problem (recursion stops at unaided humans), noting that hard steps limit the system.
  *   **Typical Flub:** Assumes the recursion solves the hardness automatically or ignores the difficulty of the combination step entirely.

  **4. Commitment to Implication (A) or (B) (5 Marks)**
  *   **Top Answer:** Takes a definitive stance on either Amplification vs. Rearrangement OR Decomposability vs. Human Quality, providing necessary conditions or bounds consistent with their earlier analysis.
  *   **Typical Flub:** Hedges by discussing both (A) and (B) superficially, or refuses to commit to a position, merely listing possibilities.

  **5. Argumentative Coherence & Depth (5 Marks)**
  *   **Top Answer:** The choice of implication connects logically to the earlier analysis of Committed vs. Plain (e.g., linking hidden computation to the definition of amplification).
  *   **Typical Flub:** The essay is fragmented; the discussion of HCH variants is disconnected from the chosen implication, reading like two separate short answers.

  ***

  **What separates a strong B from an A:** A strong B answer correctly identifies the technical differences and lists the problems with well-definedness; an A answer synthesizes these into a unified claim about *where* the intelligence resides (in the factoring vs. in the node) and uses that to prove their stance on amplification or bounds.
