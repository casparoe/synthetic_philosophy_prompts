      *   *Argument:* The shift is slow and historical, not a "choice." The universality of human action limits the relativism. So, "framework relativism" is too strong. "Contextualism" or "Universal Pragmatics" might be better.

  5.  **Identify What's Right:**
      *   Hinges are exempt from doubt.
      *   Hinges are unjustifiable (within the system).
