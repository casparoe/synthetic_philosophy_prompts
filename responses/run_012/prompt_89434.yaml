  9.  (Mental Outline of the "Foundationalism" Rebuttal): Foundationalism = basic beliefs justify other beliefs. Wittgenstein = hinges are not beliefs/propositions in the same sense; they are rules/methods of representation. They don't *justify*; they *enable*. Therefore, not foundationalism.
