      *   *Tone:* Professional, analytical, precise. Avoid jargon where possible, but use necessary philosophical terms (epistemic, grammatical, language-game).
      *   *Specific Focus:* Ensure the distinction between *epistemic* justification and *logical/grammatical* role is clear. This is the key to refuting the foundationalism charge. Ensure the distinction between *arbitrary framework* and *form of life* is clear for the relativism charge.

  7.  **Refining the content (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't just say "Wittgenstein says X." I need to say "A careful reader would note..." or "Defenders argue..." because OC is aphoristic and disputed.
      *   *Nuance on Relativism:* Don't say W. is *not* a relativist definitively. Say the *friend's version* of relativism (Kuhnian framework choice) is the weak link. There is a "hinge relativism" but it's not necessarily "anything goes."
      *   *Nuance on Foundationalism:* The friend says "ungrounded foundations." W. says "the axis of a system rotates." Foundations imply static support. Hinges imply movement/function. This is a crucial distinction.

