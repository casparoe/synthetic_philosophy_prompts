answer: |-
  Your friend is substantially correct that moral trade launders wrongdoing and dresses up blackmail as mutual benefit, though his objection regarding moral currency is mistaken while his arguments on baselines and integrity are fatal to the practice.

  The currency objection fails because it conflates moral truth with welfare. Even if one party is objectively wrong about what matters, the satisfaction of their preference is still a real psychological gain. If you care intensely about stamp collecting and I care about opera, swapping labor to fund our respective hobbies increases our subjective well-being regardless of whether stamps or opera are objectively valuable. Indexical gains are still gains; a world where everyone gets what they want is preferable to a world where everyone is frustrated, even if what they want is trivial. Your friend is wrong to claim the surplus is counterfeit simply because values differ, because the mechanism of trade relies on preference satisfaction, not moral correctness. However, proving that both parties feel better off does not prove the trade is morally permissible, which is where his remaining objections dismantle the practice.

  The baseline objection lands with devastating force because it exposes moral trade as institutionalized extortion. In any trade, the surplus is calculated against the threat point of what each party would do if no deal were reached. If the baseline behavior is morally forbidden, then the "cost" of restraining that behavior is zero, not a concession worthy of payment. When your neighbor agrees to stop playing music at two in the morning only in exchange for you doing his dishes, he is effectively holding your right to quiet hostage. He is selling you back a right you already possessed and which he had no authority to violate in the first place. This transforms moral obligations into bargaining chips, incentivizing agents to adopt worse baselines to increase their leverage. A system that rewards the person willing to behave most badly with the most bargaining power is not a method for improving the world; it is a recipe for escalating conflict and legitimizing coercion.

  The integrity objection is equally fatal because it recognizes that moral agency is not a commodity. Certain duties are non-fungible and cannot be transferred or waived for price. You cannot sell your vote, nor can you accept payment to give false testimony, because these acts are bound by obligations to third parties or to the truth itself, not to your own utility. When you agree to drop a moral objection in exchange for a donation to a cause you support, you are not trading; you are being bribed. You have allowed your moral judgment to be contingent on personal gain, which corrupts the very capacity required to make moral decisions. Even if the outcome seems positive—the urgent cause gets funded—the process requires you to act against your own judgment regarding the development, turning you into a instrument of another's will rather than a moral agent. This erosion of integrity is a cost that does not appear in the ledger of subjective benefit but is devastating to the moral fabric of the agents involved.

  Moral trade is permissible only under narrow conditions where the actions traded are supererogatory or morally neutral. You may trade labor for labor to build a house neither of you is obligated to build, or exchange favors that involve no violation of duty and no restraint of harm. Once the trade touches upon obligations owed to others, rights that cannot be waived, or the restraint of wrongful acts, it becomes impermissible. The moment a trade involves paying someone to stop doing what they ought not to do, or paying someone to ignore what they ought to oppose, it ceases to be cooperation and becomes complicity. Your friend is right to treat the general concept with suspicion, because while the currency of preference is real, the market it proposes is one where rights are for sale and conscience is auctioned to the highest bidder.
