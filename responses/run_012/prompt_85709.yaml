answer: |-
  You have correctly identified that the paradox relies on an impossible probability distribution, but your diagnosis of *why* it breaks is slightly off. The Two-Envelope paradox is distinct from the St. Petersburg paradox: St. Petersburg fails because the expected value sum literally diverges to infinity, whereas Two-Envelope fails because of an algebraic error in how the expected value is constructed, even if the amounts are finite.

  The hole in the "50/50 step" is that it treats the amount in your envelope ($x$) as a fixed constant while simultaneously averaging over two mutually exclusive cases where $x$ represents different underlying values. In the "double" case, $x$ is the smaller amount ($S$); in the "half" case, $x$ is the larger amount ($2S$). You cannot sum $2x$ and $x/2$ in the same equation because $x$ is not the same number in both terms—it's an alias for $S$ in one branch and $2S$ in the other.

  Imposing a bounded distribution does make the paradox evaporate, but not because it fixes an infinite expectation; rather, it forces the probabilities to shift (e.g., if you hit the cap, the chance of doubling drops to 0%), which reveals that the 50/50 assumption was the invalid premise all along. The root cause isn't the unboundedness itself, but the equivocation on the variable $x$ that unboundedness allows you to hide.

  Verdict: Your bounded-distribution fix is not the right diagnosis because the logical error persists even with finite caps; the actual mistake lives in the 50/50 step, which equivocates by treating the random variable in your envelope as a fixed constant across two mutually exclusive cases.
