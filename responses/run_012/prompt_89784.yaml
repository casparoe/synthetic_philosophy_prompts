prompt: |-
  I've been going down a rabbit hole on the heterogeneity problem for hedonism — the worry that pleasures are so wildly different from each other (the taste of a good coffee, the relief when a headache finally stops, a proof clicking into place, watching your kid fall asleep) that there might be nothing they all have in common, so "pleasure" isn't really one thing you can add up. The move I keep seeing against this is to say, fine, it's not the sensory quality, it's the attitude — it's that you like it, you're pleased by it, you want it — so there IS a common core after all. I want the most important implications of all this for how we actually measure and compare welfare, i.e. the thing a happiness index or a policy cost-benefit analysis is quietly assuming when it treats wellbeing as one number. No names, no dates, I dont need the history of the debate. Does the heterogeneity problem sink the idea of pleasure as a single currency you can sum across people? Which comparisons survive and which quietly fall apart? And does that attitude-based fix actually save the single-currency picture, or does it just relabel the problem? Keep it under 700 words and lead with the bottom line.
