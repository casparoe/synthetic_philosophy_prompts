answer: |-
  The bottom line is that the heterogeneity problem does not destroy the theoretical idea of a single welfare currency, but it devastates the practical assumption that this currency can be objectively measured and summed across people. The attitude-based fix saves the concept from incoherence but merely relabels the measurement problem rather than solving it. Policy models relying on a single wellbeing number survive only by assuming away the very difficulties this debate highlights.

  If pleasures are qualitatively distinct sensations, summing them is a category error akin to adding length to weight. For welfare economics, this is catastrophic. Cost-benefit analysis and happiness indices assume fungibility: that a unit of relief from pain can offset a unit of lost enjoyment elsewhere. If the "feel" of intellectual triumph is incommensurable with the "feel" of physical comfort, there is no common denominator to maximize. The single-currency picture sinks because there is no exchange rate between these disparate mental states.

  The attitude-based move attempts to rescue this by locating pleasure not in the sensation, but in the pro-attitude taken toward it. You are pleased by the coffee, the proof, and the sleeping child. The common core is the "liking," not the "liked." This preserves the theoretical possibility of a single currency: everything is measured by the intensity of the subject's endorsement.

  However, for policy measurement, this fix is largely cosmetic. It shifts the burden from comparing sensations to comparing attitudes. While "liking" is a unified structural feature, its intensity remains private and context-dependent. Is the intensity of "liking" a meal comparable to "liking" a freedom? The attitude view avoids the sensory heterogeneity trap, but it lands in a normative one. Attitudes are shaped by values, expectations, and adaptation. A policy that satisfies adapted preferences in an oppressed population might score higher on an attitude-based metric than one that liberates them but causes temporary unrest. The single currency remains, but it becomes untrustworthy.

  Regarding specific comparisons, the heterogeneity problem and its aftermath draw a sharp line between intrapersonal and interpersonal judgments.

  Comparisons that survive are ordinal and intrapersonal. An individual can reliably report that they prefer experience A to experience B at a given time. The attitude view secures this: the agent knows what they are pleased by. Short-term trade-offs within a single life remain intelligible.

  Comparisons that fall apart are cardinal and interpersonal. This is the death knell for aggregate welfare metrics. To say Policy X creates more total wellbeing than Policy Y requires summing attitudes across millions of distinct agents. If pleasures are heterogeneous sensations, we lack a biological ruler. If pleasures are heterogeneous attitudes, we lack a normative ruler. We cannot know if one person's "mild liking" is equivalent to another's "intense liking." The attitude fix does not provide a calibration method. It simply asserts that because both states involve "liking," they are comparable, without explaining how to measure the magnitude of that liking across different psychologies.

  Ultimately, the attitude-based solution prevents hedonism from collapsing into nonsense, but it does not validate the mathematics of welfare economics. It relabels the problem from "how do we sum different feels?" to "how do we sum different valuations?" Neither question has an objective answer. When a happiness index treats wellbeing as one number, it is not reporting a discovered fact about human psychology; it is imposing a fictional uniformity to make the math work. The heterogeneity problem reveals that this uniformity is an assumption, not a datum. Policy continues to use the single-currency model, but it does so on faith, not on a resolved philosophical foundation. The currency exists conceptually, but it cannot be counted.
