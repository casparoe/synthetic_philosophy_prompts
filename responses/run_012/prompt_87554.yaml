answer: |-
  This is one of those questions that keeps you up at night because it strikes at the center of how biology explains things. You've put your finger on the exact friction point where mechanism meets history. I've sat in on these arguments—both the ENCODE press conferences and the grumpy evolutionary rebuttals—and here is how I'm parsing it.

  Per your request, let's start by brainstorming a few ways to diagnose this mess before I commit to the one I think actually holds water.

  ### Phase 1: Brainstorming Possible Readings

  **Reading A: The "Sloppy Language" Hypothesis**
  On this view, the field is just linguistically undisciplined. Biologists use "function" as a catch-all bucket for "important," "active," "selected," or "useful." The inconsistency isn't theoretical; it's just carelessness. If everyone sat down and agreed on definitions (e.g., "Let's use 'activity' for ENCODE and 'function' for selection"), the fight would vanish.
  *Verdict:* Too charitable. These aren't just slips of the tongue. The ENCODE consortium *defended* their definition against the evolutionary critique. They meant to claim function, not just activity.

  **Reading B: The "Disciplinary Tribalism" Hypothesis**
  This suggests the inconsistency is sociological, not philosophical. Molecular biologists care about mechanisms (what does this protein bind?), so they adopt a causal definition. Evolutionary biologists care about history (why is this sequence here?), so they adopt a historical definition. They aren't trying to talk to each other; they are optimizing for their own sub-field's goals. The inconsistency is real, but it's siloed.
  *Verdict:* Closer. It explains the motivation, but it doesn't explain the friction. They *do* fight. The evolutionary biologists aren't just saying "that's your business"; they are saying "you are wrong." That implies they think there is a single truth of the matter they are competing over.

  **Reading C: The "Hidden Monism" Hypothesis**
  Maybe there is a single underlying theory, and both sides are approximating it. Perhaps "function" really means "contribution to the capacity of the organism," and conservation is just the best *proxy* for that, while biochemical activity is another *proxy*. The fight is about which proxy is better, not what function *is*.
  *Verdict:* Tempting, but fails on the appendix case. If function is just "contribution to capacity," the appendix is clearly functional (immune role). Calling it "vestigial" explicitly denies it has a function *in the relevant sense*, even if it does things. So the definitions aren't just proxies; they are exclusionary.

  **Reading D: The "Productive Tension" Hypothesis**
  This is the one I'm leaning toward. The field is running two incompatible notions side-by-side *on purpose*, or at least has evolved to tolerate them because each catches different kinds of biological reality. The inconsistency is real, but it acts as a check-and-balance system. When ENCODE says "80% functional," evolutionary biologists pull them back to earth. When evolutionists say "it's junk," molecular biologists find a role for it. The friction generates discovery.

  ---

  ### Phase 2: Settling on the Account

  I'm going to settle on a refined version of **Reading D**, but with a specific philosophical diagnosis: **The field is operating with a pragmatic polysemy that masks a logical incompatibility.**

  They are using two distinct philosophical accounts of function:
  1.  **Causal Role (CR) Function:** What does this item *do* in the containing system right now? (Cummins-style).
  2.  **Selected Effect (SE) Function:** Why was this item *retained* by natural selection? (Millikan/Neander-style).

  The "nagging" feeling you have is correct: these are logically distinct. A sequence can have a causal role (it gets transcribed) without having a selected effect (the transcription is noise, or slightly deleterious but not enough to be purged). A sequence can have a selected effect (it's conserved) even if we don't know its causal role yet.

  Here is how each practice maps onto these accounts, where they are committed, and where they are underdetermined.

  #### 1. The ENCODE Practice (Biochemical Activity)
  *   **Presupposed Account:** **Causal Role (CR).**
  *   **Commitment Level:** **High.**
  *   **Analysis:** ENCODE defined function as "biochemical activity." This is a pure CR definition. If a stretch of DNA binds a protein, it has a function in the system of the cell.
  *   **Underdetermination:** Could they have used SE? No. If they required evidence of selection (conservation), their 80% figure would collapse to ~5-10%. Their entire grant structure and output depend on the CR definition. They are *committed* to CR because their tools (ChIP-seq, RNA-seq) detect activity, not history.
  *   **The Blind Spot:** They treat "noise" as "function." In electronics, if a wire carries a signal, it's functioning. In biology, if a polymerase slips and transcribes garbage, that's a causal event, but calling it "function" implies utility. ENCODE conflated *capacity* with *purpose*.

  #### 2. The Comparative Genomics Practice (Conservation)
  *   **Presupposed Account:** **Selected Effect (SE).**
  *   **Commitment Level:** **High.**
  *   **Analysis:** When a comparative genomicist says a region is functional *because* it is conserved, they are explicitly invoking history. Conservation is the footprint of purifying selection.
  *   **Underdetermination:** Could they use CR? Technically, yes, but it would break their heuristic. If they treated non-conserved regions as potentially functional (CR), the signal-to-noise ratio in their data becomes unmanageable. They *need* the SE filter to find the "important" stuff.
  *   **The Blind Spot:** They miss lineage-specific functions. A human-specific regulatory element won't be conserved in mice. By committing to SE (via conservation), they systematically label species-specific adaptations as "non-functional" until proven otherwise.

  #### 3. The Anatomy Practice (Vestigiality/Appendix)
  *   **Presupposed Account:** **Selected Effect (SE), with creeping Causal Role (CR).**
  *   **Commitment Level:** **Mixed/Transitional.**
  *   **Analysis:** This is the messiest one. Calling the appendix "vestigial" is an SE claim: it means "the structure exists because of ancestors who used it, but the *reason* it was selected for is no longer operative." However, noting it has lymphoid tissue is a CR claim: "it contributes to immune capacity now."
  *   **Underdetermination:** **High.** This practice is genuinely underdetermined. You can study the appendix's immune role (CR) without denying it is vestigial (SE). But the *label* "vestigial" carries a normative weight—it suggests "remove it, it doesn't matter."
  *   **The Conflict:** The field is currently stuck between these. Surgeons treat it as SE-functionless (safe to remove). Immunologists treat it as CR-functional (part of the microbiome safe house).

  ---

  ### Phase 3: What Would Change in Practice?

  This is where the rubber hits the road. If we forced a switch in criteria, the landscape of biology shifts dramatically.

  **Scenario A: Switching Genomics from Conservation (SE) to Activity (CR)**
  *   **What gets labeled functional:** The "junk" genome explodes. Transposons, random transcripts, and spurious binding sites become "functional elements."
  *   **Disease Variants:** Every variant in the 80% active genome becomes a candidate for disease association. The "needle in the haystack" problem becomes impossible. We would chase false positives for decades.
  *   **Funding:** Massive shift toward molecular mechanism labs. Evolutionary constraint becomes irrelevant.
  *   **Conceptual Shift:** We stop asking "Why is this here?" and start asking "What does this do?" This is good for drug discovery (target what's active) but bad for understanding biological design (why the system is robust).

  **Scenario B: Switching Genomics from Activity (CR) to Conservation (SE)**
  *   **What gets labeled functional:** The genome shrinks to the "core." Human-specific innovations are ignored.
  *   **Disease Variants:** We only look for disease in conserved regions. We miss diseases caused by human-specific regulatory errors (e.g., certain cancers or neurological disorders).
  *   **Funding:** Shift toward evolutionary biology and comparative work. Biochemical surveying is seen as "stamp collecting" unless tied to conservation.
  *   **Conceptual Shift:** We prioritize stability over innovation. We assume if it isn't old, it isn't important.

  **Scenario C: Switching Anatomy from Vestigial (SE) to Capacity (CR)**
  *   **What gets labeled functional:** Nothing is truly "functionless." The coccyx, the wisdom teeth, the appendix all have *some* causal role (anchoring muscles, minor immune activity).
  *   **Medical Practice:** This is the big one. If the appendix has a CR function, removing it is a cost-benefit analysis, not a "no loss" procedure. We might see a shift toward preserving it when possible.
  *   **Conceptual Shift:** Teleology disappears. We stop asking "What is this for?" (which implies a designer or a historical goal) and ask "What happens if we remove it?"

  ---

  ### Phase 4: Is There a Single Coherent Theory?

  You asked if there's any way to read these as presupposing a single coherent theory.

  **The hard answer:** No. Not if you treat "function" as a univocal term. You cannot logically equate "selected for" with "biochemically active." One is a historical claim about causation (past), the other is a mechanistic claim about capacity (present). A spandrel (to use Gould's term) has causal roles but no selected effect. A cryptic gene has a selected effect (it's conserved) but might have no current causal role we can detect.

  **The nuanced answer:** There is a **layered coherence** that biologists rely on but rarely articulate.
  They are operating on a tacit assumption that **Selected Effect functions generally generate Causal Role capacities.**
  *   If selection kept it (SE), it probably does something now (CR).
  *   If it does something robust now (CR), selection probably kept it (SE).

  The inconsistency arises in the **margins**—the 80% vs 10% fight is a fight about the margins.
  *   ENCODE is looking at the *capacity* layer.
  *   Evolutionary biologists are looking at the *history* layer.

  The field works *because* of the tension, not in spite of it.
  *   If we only used SE, we'd ignore novel adaptations and species-specific biology.
  *   If we only used CR, we'd drown in noise and attribute purpose to biochemical accidents.

  **Where the labels don't fit:**
  The place where this breaks down completely is **exaptation**.
  *   Example: Feathers. Originally for thermoregulation (SE #1), now for flight (SE #2), currently providing lift (CR).
  *   If you ask a genomicist if a sequence is functional, and it's a transposon co-opted for regulation:
      *   SE view: It's junk that got lucky.
      *   CR view: It's a regulator.
      *   Practice: They will call it functional *now*, but annotate it as a transposon. They handle the inconsistency by **temporal indexing**. "It was junk, now it's functional."

  ### Final Verdict

  The inconsistency is real, but it is not a bug; it is a feature of a field that spans two different ontological categories: **History** and **Mechanism**.

  *   **ENCODE** is committed to **Mechanism (CR)**. They cannot switch to SE without invalidating their data.
  *   **Comparative Genomics** is committed to **History (SE)**. They cannot switch to CR without losing their predictive power.
  *   **Anatomy** is **Underdetermined**. It is the battleground where the two meet. The "vestigial" label is a historical ghost haunting a physiological reality.

  If I were to advise a lab or a database: **Stop using the word "function" as a binary label.**
  *   ENCODE should say "Biochemically Active."
  *   Comparative Genomics should say "Evolutionarily Constrained."
  *   Anatomists should say "Physiologically Integrated" vs. "Historically Vestigial."

  The friction you feel comes from the word "function" trying to do two jobs at once: explaining *how* the machine works and *why* the machine was built this way. Biology needs both explanations, but they aren't the same explanation. The field hasn't noticed because "function" is too useful a shorthand to give up, even if it's philosophically overloaded.

  So, to answer your nagging feeling: You aren't missing a synthesis. The synthesis doesn't exist. You are watching two different epistemic communities negotiate the boundary of what counts as "real" biology, using the same word to guard different territories.
