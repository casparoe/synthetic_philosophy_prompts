prompt: |-
  Act as a philosopher of biology who's spent real time inside the function debates — I want your careful take on something that's been nagging at me, so start by brainstorming a few possible readings before you settle on one.

  Here's the thing I keep tripping over. In genomics there's a recurring fight about how much of the human genome is functional. A decade or so ago the ENCODE consortium did this enormous survey — transcription, transcription factor binding, chromatin marks, histone modifications, that whole apparatus — and announced that around 80% of the genome shows biochemical activity, which they described as assigning function to 80% of the genome. A lot of evolutionary biologists went ballistic and said no, that isn't function, that's just chemistry happening; real function means the sequence is there because selection kept it there, and the conserved part of the genome is a small fraction of that.

  But then the same field does the opposite thing constantly. In comparative genomics you call a region functional precisely because it's conserved across species, and if it isnt conserved you write it off as nonfunctional even when it's plainly doing something. And in anatomy everybody says the appendix is vestigial, that we don't know what it's for — which is odd, because its got lymphoid tissue in it and clearly does something in the body.

  So: what do these practices presuppose? Take the ENCODE-style practice (a genomic element is functional because it gets transcribed, bound, marked), the comparative-genomics practice (a region is functional because it's conserved), and the anatomy practice (a structure is functionless because we can't see what it was selected for). What account of function does each one presuppose? Are they the same account or different ones? Are they consistent with each other, or is the field quietly running two incompatible notions side by side and not noticing? And for each practice, tell me whether it strictly requires that account or whether it would work just as well under the rival one — I want to know where the practice is genuinely underdetermined and several theories would license it equally well, as opposed to where it's actually committed.

  Then tell me what would change in practice. If a lab or a genome database switched from the conservation criterion to the does-it-do-anything-right-now criterion, or the reverse, what flips — what gets labeled functional, what gets called junk, what gets treated as a disease-relevant variant, what gets funded and studied? Same question for the anatomy case: what changes if we drop the selectionist notion and just ask what the appendix does in the body?

  And one thing I really care about: is there any way to read all of these as presupposing a single coherent theory, or is the inconsistency real? Don't just hand me the two standard positions, I've heard the labels before — I want to know which one each practice is actually committed to, on the evidence of how people use the word when nobody's watching, and where a practice is doing something else entirely and the labels just don't fit.

  Please dont give me reading lists or citations, I can't look anything up right now — just reason it through.
