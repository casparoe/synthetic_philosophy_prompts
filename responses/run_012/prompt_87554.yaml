          *   *Philosophical Label:* Selected Effect (SE) function (Millikan/Neander-style).
          *   *Commitment:* Strongly committed to SE. Conservation is a proxy for selection history.
          *   *Underdetermination:* Could they use CR? A non-conserved region could still have a causal role (e.g., species-specific regulation). But the *practice* of using conservation to *define* function locks them into SE.

