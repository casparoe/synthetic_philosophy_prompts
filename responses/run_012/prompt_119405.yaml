answer: |-
  ### Seminar Handout: Diagnostic Tree for Imprecise Probability

  **Purpose:** This tree is designed to locate your theoretical position by forcing commitments to concrete cases rather than labels. The six levels correspond to three diagnostic dimensions: the metaphysics of imprecision (Levels 1–2), the decision-theoretic requirements (Levels 3–4), and the semantics of ascription (Levels 5–6). Follow the path that matches your intuitions about the cases described.

  **Starting Commitment:** A rational agent's doxastic state is not always adequately represented by a single sharp credence function.

  1.  **Two investigators with exactly the same evidence assign 0.4 and 0.6 to the same hypothesis, and neither has overlooked anything. Is one of them mistaken?**
      *   **Yes (Uniqueness):** Imprecision is a constraint imposed by the evidence or world, not the agent's whim.
          *   2. **One of your intervals would narrow if you bought more data; a second reflects two experts who contradict each other; a third arises because the predicate in the hypothesis is vague. Does your theory give the same advice in all three cases?**
              *   **Yes (Uniform):** The source of imprecision does not change the normative structure.
                  *   3. **A coin is either fair or double-headed. You will bet on it once, and the matter will never be resolved. Is a credence of 0.5 an error, a permissible summary, or the wrong kind of state to be in?**
                      *   **Error (Must Sharpen):** The agent is required to resolve the imprecision before acting.
                          *   4. **A rule licenses each of two choices in sequence, and the pair leaves the agent foreseeably worse off than another pair the same rule would also have licensed. Is this a reductio of the rule?**
                              *   **Yes (Diachronic Constraint):** Rationality requires dynamic consistency even under imprecision.
                                  *   5. **An agent cannot say whether her credence in an event is the interval [0.4, 0.6] or the interval [0.35, 0.65]. Is that a coherent state?**
                                      *   **No (Termination):** Higher-order imprecision is incoherent; states must be determinate sets.
                                          *   6. **You are imprecise about an event and then learn the outcome of an event you judge to have no bearing on it. May your credence in the first become wider than it was?**
                                              *   **No (Stability):** **Leaf 1: Objective Bayesianism.** *Embarrassment:* You must deny that rational agents can sometimes learn they know less than they thought.
                                              *   **Yes (Dilation):** **Leaf 2: Evidential Imprecisivism.** *Embarrassment:* You must accept that free information can sometimes degrade decision-making capacity.
                                      *   **Yes (Higher-Order):** **Leaf 3: Unnamed (Hierarchical Evidentialism).** *Embarrassment:* You commit to an infinite regress of interval boundaries that never resolve.
                              *   **No (Synchronic Only):** **Leaf 4: Permissivist Sharpening.** *Embarrassment:* You allow agents to knowingly choose sequences of actions that guarantee a loss relative to available alternatives.
                      *   **Permissible/Wrong Kind:** **Leaf 5: Logical Probability (Keynesian).** *Embarrassment:* You must claim that numerical precision is often impossible even when comparative judgments are clear.
              *   **No (Source-Sensitive):** The normative advice depends on whether the imprecision comes from vagueness, conflict, or data.
                  *   3. **A coin is either fair or double-headed... Is a credence of 0.5 an error?**
                      *   **Error:** **Leaf 6: Source-Sensitive Repair.** *Embarrassment:* You must treat two agents with identical betting dispositions differently based on the causal history of their evidence.
                      *   **Permissible:** **Leaf 7: Pluralist Imprecisivism.** *Embarrassment:* You have no unified account of why imprecision matters for action across different domains.
      *   **No (Permissiveness):** Imprecision is a feature of the agent's state or the semantics of belief, not fixed by evidence alone.
          *   2. **One agent's interval is [0.49, 0.51] and another's, about the same sort of event, is [0.1, 0.9]. Does your theory treat these as the same state of mind at different resolutions or as different states of mind?**
              *   **Different States (Width Matters):** The size of the set represents a specific doxastic attitude.
                  *   3. **You are imprecise about an event, with credence between 0.3 and 0.7, and you are offered a bet... that pays two if the event occurs and costs one if it does not. Is accepting permitted, required, or forbidden?**
                      *   **Permitted (if some $p$ approves):** The rule separates options that are admissible from those that are not.
                          *   4. **In a choice between three options, is an option permissible if it is optimal for *some* probability in your set, or only if no other option is optimal for *all* probabilities in your set?**
                              *   **Some (E-admissibility):** **Leaf 8: Imprecise Bayesianism (E-admissibility).** *Embarrassment:* You must sometimes regard two options as permissible even when one dominates the other across the entire set.
                              *   **All/None (Maximality):** **Leaf 9: Imprecise Bayesianism (Maximality).** *Embarrassment:* You are forced to leave many choices unresolved even when a clear risk-averse preference is available.
                      *   **Forbidden (if min $p$ disapproves):** **Leaf 10: Maximin / Risk-Averse.** *Embarrassment:* You must reject fair bets simply because the worst-case scenario is bad, regardless of the best-case.
                      *   **Required (if max $p$ approves):** **Leaf 11: Maximax / Risk-Seeking.** *Embarrassment:* You must ignore catastrophic risks if there is any non-zero probability of a gain.
              *   **Same State (Resolution Irrelevant):** Imprecision is simply the absence of sharpness; width is not a distinct attitude.
                  *   3. **You are imprecise about an event... Is accepting permitted?**
                      *   **Permitted:** **Leaf 12: Unnamed (Binary Imprecisivism).** *Embarrassment:* You cannot explain why an agent with [0.1, 0.9] should act differently than one with [0.4, 0.6] in high-stakes environments.
                      *   **Forbidden:** **Leaf 13: Defect Theory.** *Embarrassment:* You must classify most human believers as irrational for failing to achieve impossible precision.
          *   2. **An agent cannot say whether her credence in an event is the interval [0.4, 0.6] or the interval [0.35, 0.65]. Is that a coherent state?**
              *   **Yes (Indeterminate):** There is no fact of the matter about the exact boundaries of the state.
                  *   3. **Does your theory treat imprecision as a fact about the agent's state, her evidence, or the semantics of credence ascriptions?**
                      *   **Semantics/Ascription:** **Leaf 14: Credence Eliminativism.** *Embarrassment:* You must claim that standard probability talk is systematically false or misleading for imprecise agents.
                      *   **State (Indeterminate):** **Leaf 15: Supervaluationist Doxasticism.** *Embarrassment:* You commit to truth-value gaps in reports of an agent's own mind.
              *   **No (Determinate):** **Leaf 16: Unnamed (Commitment-First).** *Embarrassment:* You must treat belief reports as norms of assertion rather than descriptions of psychological states.

  ***

  ### Diagnostic Notes

  **Unoccupied Combinations**
  1.  **Objective Evidence + Arbitrary Sharpening:** (Path: Level 1 "Yes" → Level 3 "Permissible"). This combination is **incoherent**. If the evidence uniquely fixes the doxastic state (Level 1), the agent is not free to sharpen arbitrarily or treat 0.5 as permissible when the evidence dictates an interval (Level 3).
  2.  **Indeterminate State + Maximin Rule:** (Path: Level 2 "Indeterminate" → Level 4 "Maximin"). This combination is **unattractive and unexplored**. If the boundaries of the credal state are themselves indeterminate (Level 2), applying a strict worst-case rule (Maximin) requires precise boundaries to calculate the "worst case," creating a tension between the metaphysics and the decision rule.

  **Indistinguishable Leaves**
  1.  **Leaf 8 (E-admissibility) vs. Leaf 9 (Maximality):** These are **behaviorally indistinguishable in binary choices**. Both rules select the same options when only two acts are available. The tree separates them at Level 4 using a three-option case, but in standard betting scenarios, an observer cannot tell which rule the agent is following.
  2.  **Leaf 14 (Credence Eliminativism) vs. Leaf 15 (Supervaluationist Doxasticism):** These are **interpretively indistinguishable**. Both views predict the same hesitancy in assertion and the same refusal to assign sharp credences. The difference lies solely in whether one claims the psychological state exists but is vague (Leaf 15) or whether the talk of the state is the problem (Leaf 14).

  **Structural Constraints**
  *   **The Choice-Rule Node:** Level 4 is designed to separate rules that agree on binary choices but diverge on three or more options. E-admissibility permits an option if it is maximal for *some* $p$ in the set; Maximality permits an option if it is not strictly dominated by another option for *all* $p$. In binary choices, these extensions often coincide; in ternary choices, they diverge.
  *   **The Three Questions:** Levels 1–2 address what imprecision is a *fact about* (Evidence vs. Agent vs. Semantics). Levels 3–4 address what imprecision *requires of action* (Sharpening vs. Set-based Rules). Levels 5–6 address what an ascription *reports* (Determinate Set vs. Indeterminate State vs. Commitment). Note that your answer at Level 2 (Width Matters) constrains your available options at Level 4 (Decision Rule), supporting the suspicion that semantics constrains action.
