      *   *One tweak on Quotas:* Kant is cautious about coercive federation. But he says states *ought* to enter it. A treaty is voluntary initially, but once entered, binding. The hypo says "binding global asylum treaty." So states agreed. Kant would support the binding nature once agreed, versus unilateral withdrawal/discretion.

      *   *Final check:* Does Kant support a "formula"? He supports public law. A formula is more lawful than discretion.

      *   *Final Polish of Bottom Line:* Kant would likely reject the offshore buy-out scheme as a violation of cosmopolitan right while accepting the climate displacement grounds and binding quota formula as consistent with the requirements of a rightful federation.

      *   *Wait, one nuance:* Kant says no right to *permanent* stay. The hypo says "never actually reach the paying country." Kant says you have a right to *visit*. If you never reach the country, you can't visit. But you have a right to *not be treated as an enemy*. If the third country protects them, are they treated as enemies? The issue is the *paying* state avoiding the encounter. Kant emphasizes the community of land. Shifting burden to poorer nations (implied by third country processing often) might violate equitable distribution. But the strongest argument is the commodification and revocability.

