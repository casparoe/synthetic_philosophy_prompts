prompt: |-
  Ok so I'm in a political philosophy class and last week we did Kant's cosmopolitan right thing — the idea that a stranger arriving on your soil has a right not to be treated as an enemy, but that this doesnt amount to a right to stay permanently. Our seminar leader gave us this modern hypo and I cant stop thinking about it, but I also cant figure out which way Kant would actually come down.

  The hypo: a binding global asylum treaty where each country's quota is set by a formula (GDP, population, historical emissions), and climate displacement is a qualifying ground alongside the usual persecution grounds. Countries can also buy out up to half their quota by funding processing centers in third countries — the people get legal protection status but never actually reach the paying country, and that status is revocable if the funding stops.

  So: would Kant treat the buy-out / offshore arrangement as a straightforward violation of cosmopolitan right, or is it compatible with his view given that hospitality was never supposed to mean permanent membership? And does adding climate displacement as a ground do any work in his framework, or is that orthogonal? Last thing — would he object to the quota being set by an external formula rather than by each state's own judgment about what it can absorb?

  Lead with your bottom line in the first sentence and then give the reasoning. No preamble, and dont restate my question.
