      *   *Historical Reality:* Kepler *did* do astrology for money and patronage. He *did* love astronomy. *However*, he did *not* think astrology was "nonsense." He believed there was *some* truth to it, but he wanted to reform it, strip away the superstition, and ground it in physical causes (light, geometry). He wasn't a modern skeptic pretending to be a believer; he was a reformer trying to make astrology "scientific."
