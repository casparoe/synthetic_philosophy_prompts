  1.  **Analyze the Request:**
      *   **Topic:** Johannes Kepler's relationship with astrology vs. astronomy.
      *   **Specific Angle:** How he compartmentalized the two (doing astrology for money/status while believing in astronomy as "real" science).
      *   **Analogy:** Like a modern scientist taking defense contractor money while privately doubting the mission.
      *   **Key Questions:** How did he manage this mental separation? Did it get him in trouble with the Emperor or the Church?
