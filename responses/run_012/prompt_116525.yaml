  I'm writing a short piece on how Kepler basically did astrology to pay the bills while his real love was astronomy, and I want to explain how he kept the two seperate in his head — the way a scientist today might cash a defense-contractor check while privately thinking the whole thing is nonsense. Can you walk me through how he managed that kind of compartmentalization, and whether it ever got him in trouble with the emperor or the church? American English please.
