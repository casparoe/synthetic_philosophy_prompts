      *   *Philosopher Side:* "It's only a number" is implementation bias. Function matters. Biological systems are also just numbers/signals at some level.
      *   *Core Tension:* Functionalism vs. Substrate Chauvinism vs. Illusionism.

  3.  **Evaluate the "Training vs. Deployed Policy" Hypothesis:**
