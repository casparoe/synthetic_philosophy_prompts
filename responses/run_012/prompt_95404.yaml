      *   *Deployed Phase:* The reward signal is often absent or internalized. The policy acts. If the agent has an internal model of "reward" (e.g., in model-based RL or intrinsic motivation), does *that* representation carry valence?
      *   *Verdict on Hypothesis:* It's a strong diagnostic tool. It separates *being optimized* (training) from *optimizing* (deployment). Suffering usually implies a subjective experience *during* operation, not just the history of how weights were set. However, it doesn't solve the metaphysical hard problem.

  4.  **Categorize the Disagreements:**
      *   *Verbal:* Definitions of "suffering" (phenomenal vs. functional). Definitions of "reward" (external signal vs. internal critic).
