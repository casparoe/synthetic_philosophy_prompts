  You have stumbled onto the central tension in the foundations of probability: the conflict between **Logical Bayesianism** (probability as degree of belief constrained by symmetry) and **Frequentist/Physical Bayesianism** (probability as a property of a generating process). Your intuitions are actually more consistent than you fear, but there is one major fracture point that needs to be addressed.

  Here is the principle that captures your verdicts, the audit of your cases, the predictions for your new cases, and the hard truth about where you are inconsistent.

  ### The Principle: Invariant Generative Symmetry

  **Statement:**
  *Assign equal probabilities to outcomes if and only if:*
  1.  **(Finite Physical Symmetry)** *The outcome space is finite, and there is a known physical mechanism that treats the outcomes symmetrically (e.g., faces of a die, cards in a shuffle).*
  2.  **(Exchangeable Sequence)** *The outcomes form a sequence of exchangeable trials, allowing the use of a reference prior (like Laplace's) to model uncertainty about the rate parameter.*

  *Do **not** assign equal probabilities if:*
  3.  **(Static Continuous Ignorance)** *The uncertainty concerns a continuous parameter of a static object defined only by a range, with no generating process or exchangeable data to fix the measure.*
  4.  **(Infinite Discrete Ignorance)** *The outcome space is countably infinite with no decaying weight function.*

  ---

  ### Audit of Your 8 Verdicts

  Here is how your verdicts map onto the clauses of the principle:

  *   **(1) Novelty Coin (1/2):** **Violates the Principle.** You are treating this as *Finite Physical Symmetry* (Clause 1), but your prompt ("no idea whether it's fair") explicitly removes the physical justification. To be consistent with your Urn verdict, this should be treated as an *Exchangeable Sequence* (Clause 2).
  *   **(2) Novelty Die (1/6):** **Consistent (Clause 1).** Even from a novelty shop, a die is a physical object with 6 faces. Unless you have specific evidence of bias, the physical symmetry of the *object* justifies indifference over the faces more robustly than a coin's binary symmetry.
  *   **(3) Shuffled Deck (Equal):** **Consistent (Clause 1).** You explicitly cite the mechanism ("I know the shuffle is what makes it so"). This is the gold standard for Clause 1.
  *   **(4) Cube Factory (Reject):** **Consistent (Clause 3).** This is the classic Keynes/Jaynes counter-example. No generating process is specified; "side length" vs. "volume" are reparameterizations of a static property.
  *   **(5) Bertrand's Chord (Reject):** **Consistent (Clause 3).** No privileged random-chord mechanism. The "process" is undefined, so the measure is undefined.
  *   **(6) Urn / Laplace (Accept):** **Consistent (Clause 2).** You have an exchangeable sequence (draws with replacement). The uncertainty is about the *rate* (composition), and the Rule of Succession is the unique predictive rule satisfying exchangeability and regularity.
  *   **(7) Die "Odd" (1/3):** **Consistent (Clause 1).** Residual physical symmetry. The mechanism (die roll) treats 1, 3, 5 symmetrically.
  *   **(8) Random Integer (Reject):** **Consistent (Clause 4).** Countably infinite space. No normalizable uniform distribution exists.

  ### The Inconsistency: Case (1) vs. Case (6)

  You suspected this, and the principle confirms it.
  *   In **(6)**, you treat "unknown composition" as a parameter uncertainty problem solvable by induction (Laplace).
  *   In **(1)**, you treat "unknown bias" as a physical symmetry problem (1/2).

  **The Conflict:** If the coin is from a novelty shop and you have *no idea* if it's fair, it is epistemically identical to the urn.
  *   If you stick with **(6)** (Urn), then after 1 Head, the probability of the next Head should be **2/3** (Laplace's Rule: $\frac{1+1}{1+2}$), not 1/2.
  *   If you stick with **(1)** (Coin), you are implicitly importing background knowledge ("Coins are usually fair") that you explicitly suspended in the Urn case.

  **Verdict:** You cannot have it both ways. Either "unknown" means "assume physical symmetry" (which makes Laplace in (6) wrong) or "unknown" means "learn from data" (which makes 1/2 in (1) wrong). Given that you teach induction, **you should sacrifice (1).** A novelty coin with unknown bias is an urn with two colors.

  ---

  ### Predictions for New Cases

  Here is what the **Invariant Generative Symmetry** principle predicts for your unlisted cases, assuming we fix the inconsistency by aligning (1) with (6).

  #### Case A: Unknown-bias coin, 100 flips, 60 heads. Next flip?
  *   **Analysis:** This is an **Exchangeable Sequence** (Clause 2). The initial "physical symmetry" assumption (if you had one) has been overwhelmed by data. You are now estimating a bias parameter $p$.
  *   **Prediction:** **P(Heads) $\approx$ 0.60.**
      *   Using Laplace's Rule of Succession: $\frac{60+1}{100+2} = \frac{61}{102} \approx 0.598$.
      *   If you answer **1/2** here, you are claiming the data is irrelevant, which contradicts your acceptance of Laplace in (6).
      *   If you answer **0.6**, you are admitting that (1) was wrong to stay at 1/2 after the first head.

  #### Case B: Uniformly random point on a sphere. Is latitude uniform?
  *   **Analysis:** This is **Static Continuous Ignorance** (Clause 3), similar to the Cube Factory. "Latitude" is a parameterization. The physical surface area is the invariant measure, not the linear degree of latitude. There are more square meters of surface area near the equator than near the poles for equal latitude intervals.
  *   **Prediction:** **No, latitude is not uniform.**
      *   The probability density must be proportional to $\cos(\theta)$ (where $\theta$ is latitude) to preserve uniformity over the *area*.
      *   If you say latitude is uniform, you are vulnerable to the "Cube Factory" objection: Why not choose a point uniformly by $z$-coordinate (which is latitude) vs uniformly by surface area? Without a specified *throwing mechanism* (e.g., "a dart thrown at a globe from a distance"), the question is ill-posed, just like Bertrand's Chord.
      *   *Correction:* If the mechanism is "select a point uniformly by **area**," then latitude is *not* uniform. If the mechanism is "select latitude uniformly, then longitude uniformly," the point is *not* uniform by area. Since "random point on a sphere" conventionally implies uniform by **area**, the latitude distribution is **not** uniform. Your intuition should match the Cube Factory: reject the naive parameterization.

