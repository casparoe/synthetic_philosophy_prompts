  ### The Hard Truth: What You Must Give Up

  To teach this seminar without hypocrisy, you need to make a clean break.

  **You must give up the verdict in (1).**
  You cannot claim to accept Laplacean induction for urns (6) while refusing to learn from a single coin flip (1).
  *   **Why?** Because the "Coin" label is seducing you. You are smuggling in the premise "Coins are fair" despite the prompt "Novelty shop... no idea."
  *   **The Fix:** Reframe (1) in your lecture. "If I hand you a *minted* coin, 1/2 is fine (Clause 1). If I hand you a *novelty* coin of unknown bias, it is an urn. After one head, believe 2/3 (Clause 2)."

  **Summary of the Principle for your Students:**
  > "Indifference is not a default setting for ignorance. It is a constraint imposed by **symmetry**.
  > 1.  If the **physics** is symmetric (dice, shuffles), use Indifference.
  > 2.  If the **data** is exchangeable (urns, repeated trials), use Indifference over the *parameter* to enable learning.
  > 3.  If the **description** is just a continuous range with no process (cubes, chords), Indifference is a trap. There is no fact of the matter."

  This preserves your robust intuitions in (2), (3), (6), (7) while validating your skepticism in (4), (5), (8), and forces you to correct the one slip-up in (1).
