  The rules that fit
  1. **The Serious Justification Rule:** Early pregnancy is elective, but late-term abortion requires a substantial reason (life, health, or rape) rather than mere convenience. This fits her approval of early elective cases and her rejection of late-term convenience, while leaving room for rape exceptions later on.
  2. **The Viability Hard Limit Rule:** Abortion is permissible only until the fetus is viable (around 24 weeks); after that, it is prohibited unless the mother's life is at risk, regardless of conception circumstances. This fits the 34-week rejection and the life endangerment exception, but treats the 7-week rape case as permissible only because it was early.
  3. **The Trimester Rule:** First and second trimesters are elective; third trimester (starting around week 27) is prohibited except for life or health. This aligns with the 10-week approvals and the 34-week rejection, categorizing 28 weeks as too late for any non-medical reason.

  What each predicts here
  1. **Serious Justification:** Fine (Rape counts as a substantial reason).
  2. **Viability Hard Limit:** Wrong (28 weeks is past viability; rape isn't life endangerment).
  3. **Trimester Rule:** Wrong (28 weeks is third trimester; rape isn't life/health).

  My bet
  She is running the **Serious Justification Rule**. Her objection to the 34-week case was specifically framed around the motivation ("simply doesn't want to be pregnant"), not just the calendar date. If she held a hard viability or trimester wall, she likely would have dismissed the 34-week case based on gestational age alone, regardless of the reason. Furthermore, her explicit validation of the rape exception early on suggests she views non-consent as a persistent moral factor that reduces the woman's obligation to continue the pregnancy, even as the fetus develops.

  The case that would settle it
  Ask her about a **34-week pregnancy resulting from rape with a healthy fetus**. This maximizes the conflict between her "rape is fine" precedent and her "34 weeks is wrong" verdict. If she says "Fine," she prioritizes the reason over the stage (Rule 1). If she says "Wrong," she prioritizes the stage over the reason (Rule 2 or 3), confirming that her earlier rape approval was solely due to the early timing.
