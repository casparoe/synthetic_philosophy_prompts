prompt: |-
  I run a small podcast where I interview philosophers for a grad-student audience, and next month's guest has me a bit nervous. She's spent the last few years defending the claim that individual contributions to big collective harms -- your steak, your flight, your vote, your decision not to vote -- aren't, strictly speaking, wrong at all, because no single one of them makes any difference to what happens. She's not trolling: her line is that the inefficacy objection is a point about causation rather than morality, and that once you grant it, the moral question just relocates to practices and institutions. But she's added a corollary I haven't seen anyone else make, and it's the thing I most want to get at: she says the individual duty is *strongest* when a collective outcome is already near a tipping point (a few more defectors and the practice collapses) and *weakest* when the practice is rock solid -- so individual obligation peaks exactly where it's least needed and bottoms out exactly where it's most needed. I want you to draft eight to ten interview questions that don't let her just restate the causal claim, each with a follow-up keyed to the answer she's most likely to give.

  At least one question each on: (a) the lumpy-harm case, where everyone's water use is harmless until the well runs dry and you happen to be the one whose bucket tips it; (b) the difference between *making* a difference and *being part of* the thing that makes the difference; (c) a referendum you know will be decided by exactly one vote, you just don't know whether it's yours -- press her on why a one-in-ten-million chance times a very large harm comes out as nothing rather than as something small, and what principled cutoff she's using; (d) whether accepting her view makes you a free rider on everyone else's restraint, and whether that's a distinct wrong even if the causal claim is true; and (e) the aggregation problem -- if no individual act is wrong, where exactly does the wrongness of the practice live, and doesn't the answer she gives either smuggle the individual act back in or leave the practice wrong without anyone ever doing anything wrong? I also want one question about whether the view can be publicized without being self-undermining: if everyone believed it, nothing would ever tip, so does she owe us a story about who's supposed to do the tipping. Make the aggregation one the hardest to answer and don't let the set drift into "here's what the literature says" -- she knows the literature, I want her working live. Also I'm taking a course on collective responsibility right now and I keep noticing that my intuitions about the voting case and the meat case come apart, so if you can build in a question that makes her say something about why those two feel different, that'd be great, and please flag anywhere I've set up a follow-up that she can defuse with a single sentence, cause that's definately what I'm worried about.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**

      *   **Context:** Small podcast, interviewing philosophers, audience is grad students.
      *   **Guest's View:** Defends the "Inefficacy Objection" (individual contributions to collective harm aren't wrong because they make no causal difference). Moral question relocates to practices/institutions.
      *   **Specific Corollary (The Hook):** Individual duty is *strongest* near tipping points and *weakest* when practices are solid (obligation peaks where least needed, bottoms out where most needed).
      *   **Task:** Draft 8-10 interview questions with follow-ups keyed to likely answers.
      *   **Required Topics:**
          *   (a) Lumpy-harm case (well running dry).
          *   (b) Making a difference vs. being part of the difference.
          *   (c) Referendum/One Vote (probability vs. magnitude, principled cutoff).
          *   (d) Free-riding objection (distinct wrong?).
          *   (e) Aggregation problem (where does wrongness live?).
          *   (f) Publicizability/Self-undermining (who does the tipping?).
          *   (g) Intuition divergence (Voting vs. Meat).
      *   **Constraints:**
          *   Don't let her just restate the causal claim.
          *   Make the Aggregation question the hardest.
          *   Avoid "here's what the literature says" drift (make her work live).
          *   Flag follow-ups that can be defused with a single sentence (vulnerability check).

  2.  **Deconstruct the Guest's Position:**

      *   *Core:* No causal impact = no individual wrongness (for standard cases).
      *   *Shift:* Wrongness belongs to the practice/institution.
      *   *Corollary:* Duty scales with proximity to tipping point (high near tip, low when stable).
      *   *Potential Weaknesses:*
          *   The "Aggregation Problem" (How can the whole be wrong if no part is?).
          *   The "Free Rider" intuition (Is it unfair to benefit from others' restraint?).
          *   The "Stability Paradox" (If everyone follows her rule, stable bad practices never change).
          *   The "Probability" issue (Expected utility vs. binary causation).
          *   The "Lumpy Harm" exception (Sometimes one *does* make a difference).

  3.  **Drafting Questions (Iterative Process):**

      *   *Topic (a) Lumpy Harm:* Need to press on why this is an exception if causation is the metric.
          *   *Draft:* What about the well case?
          *   *Refinement:* Focus on the arbitrariness. If causation is king, why is the person who tips the bucket wrong but the previous 999 aren't?
          *   *Follow-up:* She might say "Because they caused harm." Need to push on the moral luck aspect.

      *   *Topic (b) Making vs. Part of:* This is the complicity angle.
          *   *Draft:* Isn't being part of it enough?
          *   *Refinement:* Use an analogy. A firing squad. One bullet is fatal, others miss. Are the missers innocent?
          *   *Follow-up:* She might say "Different institution." Push on the individual experience.

      *   *Topic (c) Referendum/Probability:* The expected utility argument.
          *   *Draft:* Why ignore the 1 in 10 million chance?
          *   *Refinement:* Press on the "principled cutoff." Is it zero or just negligible? If negligible, at what number does it become significant?
          *   *Follow-up:* She might say "It's effectively zero." Push on the *principle*, not the math.

      *   *Topic (d) Free Riding:* Fairness vs. Consequences.
          *   *Draft:* Isn't it unfair to free ride?
          *   *Refinement:* Separate fairness from harm. If I benefit from your sacrifice without sacrificing, is that wrong even if no harm occurs?
          *   *Follow-up:* She might say "Fairness is also institutional." Push on interpersonal relationships.

      *   *Topic (e) Aggregation (The Hardest):* Ontology of the wrong.
          *   *Draft:* Where is the wrongness?
          *   *Refinement:* If no individual act is wrong, is the "practice" a ghost? Does this commit her to moral holism that excludes individuals?
          *   *Follow-up:* She might say "Practices are real." Push on how a practice exerts force without individual instantiations being normative.

      *   *Topic (f) Publicizability:* The self-undermining aspect.
          *   *Draft:* What if everyone believes this?
          *   *Refinement:* If duty is low when stable, how do we ever move from stable-bad to stable-good? Who moves the first stone?
          *   *Follow-up:* She might say "External shocks." Push on internal moral motivation.

      *   *Topic (g) Voting vs. Meat:* Intuition divergence.
          *   *Draft:* Why do voting and eating meat feel different?
          *   *Refinement:* Voting feels expressive, meat feels consumptive. Does her view collapse this?
          *   *Follow-up:* She might say "Both are causal." Push on the expressive dimension.

      *   *Topic (h) The Corollary (Tipping Point):* This is her specific contribution.
          *   *Draft:* Why is duty higher at the tip?
          *   *Refinement:* This creates a "Fairness to the Tippers" problem. Why should the last few bear the burden?
          *   *Follow-up:* She might say "Because they matter." Push on the distribution of burden.

  4.  **Review and Refine against Constraints:**

      *   *Check:* Are there 8-10 questions? Yes.
      *   *Check:* Are follow-ups keyed to likely answers? Yes.
      *   *Check:* Are vulnerable follow-ups flagged? Yes, need to ensure I explicitly mark where she can dodge.
      *   *Check:* Is the Aggregation question the hardest? I need to make sure the wording is tight and leaves little room for "practices are real" hand-waving.
      *   *Check:* Grad student audience? Tone should be technical but accessible, avoiding intro-level stuff.
      *   *Check:* No "literature" drift? Frame questions as "working live" problems.

  5.  **Final Polish:**

      *   Ensure the "Flag" system is clear.
      *   Ensure the flow makes sense (start with specific cases, move to theory, end with implications).
      *   Double-check the "Corollary" focus (Duty peaks at tipping point). This is the unique hook.

      *(Self-Correction during drafting)*: I need to make sure I don't accidentally ask questions she can answer with "That's an institutional failure." I need to trap her in the *individual* perspective where possible, or force her to explain the *link* between individual and institution without reducing one to the other.

      *(Refining the Aggregation Question)*: This needs to be the "killer." I'll frame it as a dilemma: either the practice is just a sum of acts (so if acts aren't wrong, practice isn't) OR the practice is a distinct entity (which seems metaphysically spooky).

      *(Refining the Vulnerability Flags)*: I will add a specific note after the follow-up if it's too easy to dodge.

  6.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  Here are ten interview questions designed to press your guest on her specific corollary and the underlying metaphysics of her view, tailored for a grad-student audience. I have flagged follow-ups that are vulnerable to a "one-sentence defusal" so you can be ready to push back.

  ### 1. The Lumpy-Harm Exception (The Well Case)
  **Question:** Let's start with the exception you grant: the lumpy-harm case, like the well that runs dry only after the thousandth bucket. You admit the person who draws the thousandth bucket does something wrong because they *caused* the harm. But morally, what distinguishes them from the person who drew the 999th? Physically, the difference is negligible; causally, it's binary. If morality tracks causation, aren't you committing us to a view where moral status is entirely a matter of moral luck regarding queue position?

  **Likely Answer:** She will likely say that morality *must* track causation because "ought implies can," and the 999th person literally could not have prevented the harm.
  **Follow-up:** But if "ought implies can" is the only constraint, then the 999th person has no duty to *coordinate* to ensure the well doesn't reach 1,000. If we accept your view, does it follow that in lumpy-harm scenarios, individuals have no duty to organize quotas, because until the quota is breached, no individual act is causally efficacious?
  > **VULNERABILITY FLAG:** She can defuse this with: *"Quotas create institutional rules, and breaking those rules is causally efficacious."* If she says this, press: "But the duty to *create* the quota rests on individuals who, ex hypothesi, make no difference to the outcome until the quota exists. Who has the duty to build the institution?"

  ### 2. Making vs. Being Part (The Firing Squad)
  **Question:** You distinguish between *making* a difference and *being part of* a difference-making set. Consider a firing squad of ten where only one bullet is live, but the shooters don't know who has the live round. On your view, the nine with blanks haven't caused death. But intuitively, they seem complicit in a way that a bystander is not. If complicity isn't grounded in causal efficacy, what is the normative ground of their wrongness? Is it purely institutional?

  **Likely Answer:** She will argue their wrongness derives from participating in a wrongful *practice* (executions), not the causal outcome.
  **Follow-up:** If the practice is the locus of wrongness, imagine a scenario where the practice is benevolent (e.g., a ten-person medical team saving a life, only one drug is active). Are the nine with placebos *praiseworthy*? If not, why does the normative valence of "being part of a set" flip with the practice but not with the causation?
  > **VULNERABILITY FLAG:** She can say: *"Praise and blame are also institutional concepts."* If she does, ask: "Then is there *any* individual moral residue left once we strip away causation and institutional rules?"

  ### 3. The Referendum & The Principled Cutoff
  **Question:** Let's look at the voting case. In a large election, the chance my vote decides the outcome is roughly one in ten million. You argue this expected utility is too small to ground a duty. But mathematically, it's not zero. At what principled cutoff does a probability of making a difference become morally negligible? Is there a specific threshold where a 1 in $X$ chance shifts from "nothing" to "something," or is this a sorites series where you just draw a line?

  **Likely Answer:** She will likely argue it's not about a threshold but about the *kind* of reasoning: we shouldn't treat voting as a lottery ticket for causal impact.
  **Follow-up:** But if it's not about the math, why does your view change at the tipping point? There, the probability shifts from near-zero to near-one. If the *type* of reasoning changes based on probability, haven't you just reintroduced expected utility maximization by the back door, only with a very steep discount rate?

  ### 4. Free-Riding as a Distinct Wrong
  **Question:** Suppose I know my flight won't affect the climate, but I also know my colleagues are sacrificing their convenience to fly less to mitigate harm. I fly anyway. Even if I cause no harm, haven't I wronged *them* specifically by free-riding on their restraint? Is fairness to cooperators a distinct moral category from harm prevention, and does your causal view have room for it?

  **Likely Answer:** She may concede this is a wrong but classify it as a violation of a duty of fairness, which is institutional or relational, not outcome-based.
  **Follow-up:** If fairness is relational, doesn't that mean I have a duty to them *as individuals*? And if I have a duty to them, doesn't that duty require me to act in a way that supports their project? But if my action makes no causal difference to their project's success (because one flight doesn't matter), what exactly am I fulfilling? Is it purely symbolic?

  ### 5. The Aggregation Problem (The Hardest Question)
  **Question:** This is the metaphysical core. You say individual acts aren't wrong, but the *practice* is. But practices are just aggregates of individual acts. If every instance of $X$ is morally neutral, how does the collection of $X$s become morally negative? Do you have to commit to a form of moral holism where the whole has normative properties that are not reducible to the parts? And if so, how does a "practice" exert normative force on an individual without that force showing up in the evaluation of their specific act?

  **Likely Answer:** She will likely assert that practices are socially real entities that constitute reasons for action, distinct from the sum of actions.
  **Follow-up:** If the practice constitutes the reason, then the reason exists for the individual. If the individual ignores that reason to perform the act, aren't they acting wrongly *relative to that reason*? You seem to want to say the practice gives me a reason not to do $X$, but doing $X$ isn't wrong. How do you parse a "reason" that doesn't render the contrary action wrong?
  > **VULNERABILITY FLAG:** This is the strongest spot. If she says *"Reasons can be outweighed,"* press: "By what? If the harm is zero and the fairness is handled separately, what outweighs the reason generated by the wrongful practice?"

  ### 6. Publicizability and Self-Undermining
  **Question:** Your corollary states individual duty is weakest when a harmful practice is rock solid. But if your view is publicized, everyone learns that their duty is low when the practice is stable. Doesn't this guarantee that harmful stable practices never tip? If everyone waits for the tipping point to act, the tipping point never arrives. Do you owe us a story about who is supposed to move the first stone, or is your theory only actionable by those who don't believe it?

  **Likely Answer:** She might argue that tipping points are often caused by external shocks, not internal moral conversion.
  **Follow-up:** But moral theory is supposed to guide action *internal* to the system. If your theory tells the early adopters they have *less* duty than the late adopters, aren't you disincentivizing the very activism required to reach the tipping point? Is your view compatible with the existence of moral pioneers?

  ### 7. Intuition Divergence (Voting vs. Meat)
  **Question:** I'm taking a course on collective responsibility, and I notice my intuitions diverge here. I feel a strong duty to vote, even if my vote won't matter, but I feel a weaker duty to avoid meat if my purchase won't matter. Both are causally inefficacious in the standard case. Why do these cases feel different? Does your view explain this divergence, or does it flatten them both into "no individual duty"?

  **Likely Answer:** She might say voting is expressive or constitutive of citizenship, whereas eating is consumptive.
  **Follow-up:** If voting is expressive, then the act has a meaning independent of its causal outcome. But if the act has meaning, isn't that meaning a property of the individual act? If so, why can't that meaning ground a duty? You seem to allow non-causal properties to matter in voting but insist on causation for meat. What justifies the asymmetry?

  ### 8. The Burden of the Tipping Point
  **Question:** Let's press your corollary that duty peaks at the tipping point. This implies that the few people acting near the collapse of a practice bear the heaviest moral burden, while the millions who sustained the practice when it was safe bear the lightest. Doesn't this distribute moral responsibility in a way that is profoundly unfair? Why should the "last few" be the ones tasked with fixing the mess created by the "solid majority"?

  **Likely Answer:** She may argue that moral duty tracks efficacy, not fairness, and near the tip, they are the only ones who *can* fix it.
  **Follow-up:** But if "ought implies can" is the only metric, then the "solid majority" *couldn't* have fixed it earlier (on your view, because they made no difference). So you're saying the only time anyone *can* fix a collective harm is when it's almost too late. Isn't this a theory that makes moral repair almost impossible by design?

  ### 9. The "Clean Hands" Objection
  **Question:** On your view, I can have perfectly "clean hands" regarding climate change or factory farming as long as I'm not near a tipping point. I can live a life of luxury on a polluted planet without individual moral blemish. Does this conception of "clean hands" align with what we want from moral philosophy? Are we trying to track causal purity or moral integrity?

  **Likely Answer:** She will likely distinguish between *blamelessness* (causal) and *virtue* (character), suggesting one can be blameless but lack virtue.
  **Follow-up:** If I lack virtue, isn't that a criticism of *me* as an individual agent? If you criticize my character for doing an act that you say is not wrong, aren't you reintroducing individual wrongness through the back door of virtue ethics?

  ### 10. Institutional Reform as an Individual Act
  **Question:** You relocate the moral question to practices and institutions. But changing an institution is itself a collective action problem. If I try to reform the institution, my individual effort likely makes no causal difference to whether the reform passes. Does your inefficacy objection apply to *institutional reform* itself? If so, where does the motor for change actually live?

  **Likely Answer:** She might argue that institutional roles come with specific causal powers that individual acts outside the institution do not.
  **Follow-up:** But I need to *get* the role first. The act of campaigning for the role, or voting for the reform, is often causally inefficacious for the individual. If the inefficacy objection swallows individual acts, does it also swallow the democratic processes required to change the institutions you say are the locus of wrongness?
  > **VULNERABILITY FLAG:** She can say: *"Voting for reform is part of the institutional practice of voting, which has rules."* If she does, ask: "But the rule-following only matters if the institution exists. Who creates the institution? If the creators make no difference, the institution never starts."

  ### Advice for the Host
  *   **On the Aggregation Question (Q5):** This is the one where she might try to go metaphysical ("Practices are emergent properties!"). Don't let her hide in emergence. Keep asking: "How does that emergent property touch *my* decision procedure today?"
  *   **On the "One-Sentence Defusal" Flags:** When you see these flags, if she gives the short answer, do not move to the next question. Use the follow-up provided immediately. She is expecting the "standard" objections; the follow-ups are designed to close the escape hatches she's likely prepared for.
  *   **Tone:** Keep it collaborative but relentless. "I want to make sure I understand how this works in practice..." is a good way to frame the hard hits.
