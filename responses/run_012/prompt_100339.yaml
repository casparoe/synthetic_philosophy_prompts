answer: |-
  This is a classic problem in the philosophy of social norms. You are encountering the friction between *local conventions* (arbitrary rules we agree to follow) and *moral obligations* (things we ought to do regardless of location). Your colleague is using a proverb as a philosophical sledgehammer, but as you suspect, it conceals several distinct arguments. Some are weak, some are strong, and they apply differently to your three cases.

  Here is the breakdown of what "When in Rome, do as the Romans do" can actually mean, evaluated by philosophical strength, followed by an analysis of your specific situations.

  ### Part 1: The Menu of Theses

  Here are six distinct philosophical claims hidden inside that proverb, ranging from practical advice to radical metaphysics.

  **1. The Prudential Thesis (Avoid Friction)**
  *   **The Claim:** You should follow local norms because violating them causes you personal inconvenience, social ostracization, or legal trouble.
  *   **Status:** **Obviously True.**
  *   **Conditions:** This is not a moral claim; it's a calculation of self-interest. If you jaywalk, you might get fined. If you don't tip where expected, you might get poor service next time.
  *   **Limitation:** It cannot explain why you should follow a norm when there is *no* risk of penalty (e.g., the 3am red light with no police). It explains why you *might* want to, not why you *ought* to.

  **2. The Epistemic Thesis (Locals Know Best)**
  *   **The Claim:** Locals possess hidden knowledge about why the norm exists. You should defer to their behavior because they understand the context better than you do.
  *   **Status:** **Contentious.**
  *   **Conditions:** This is true if the norm has a functional purpose you can't see (e.g., a "no swimming" sign where the water looks calm but has a hidden riptide). It is false if the norm is purely habitual or irrational (e.g., a superstition).
  *   **Limitation:** It assumes locals are rational actors. Often, people follow norms simply because "that's how it's done," not because there is a hidden safety reason.

  **3. The Tacit Consent Thesis (The Social Contract)**
  *   **The Claim:** By choosing to enter and reside in this territory, you have implicitly agreed to abide by its rules, just as a player agrees to the rules of a game by stepping onto the field.
  *   **Status:** **Contentious.**
  *   **Conditions:** This holds if residency is viewed as a voluntary contract. It requires that the rules were clear and that you had a realistic option to leave.
  *   **Limitation:** It feels legalistic. Does moving to a city really mean you consent to *every* minor convention, like which side of the sidewalk to walk on? It struggles to distinguish between laws (which bind residents) and manners (which might not).

  **4. The Coordination Thesis (Solving the Cooperation Problem)**
  *   **The Claim:** Certain behaviors only work if everyone does them. The specific rule doesn't matter (drive on left or right?), but *uniformity* matters. You are obligated to conform to maintain the system.
  *   **Status:** **Strong (for specific cases).**
  *   **Conditions:** This applies to traffic, queuing, and language. If you drive on the wrong side, the system fails.
  *   **Limitation:** It only applies to *coordination problems*. It does not apply to things like tipping, which is not about coordination but about valuation.

  **5. The Respect Thesis (Harm via Offense)**
  *   **The Claim:** Violating a local norm is an expressive act that signals disrespect to the community. Even if the act itself is harmless, the *message* it sends causes social harm.
  *   **Status:** **Strong.**
  *   **Conditions:** This is true if the community interprets deviation as an insult. In your new city, not queuing says "I am better than you." Tipping says "You are a beggar."
  *   **Limitation:** It relies on the sensitivity of the locals. If they are thick-skinned, the harm vanishes. But in tight-knit cultures, this is a potent obligation.

  **6. The Relativist Thesis (Truth is Local)**
  *   **The Claim:** Right and wrong are defined by geography. Jaywalking is literally morally neutral here, but morally wrong there. There is no universal standard.
  *   **Status:** **Flat-out False (mostly).**
  *   **Conditions:** This would require morality to be entirely constructed by culture.
  *   **Limitation:** Nobody actually believes this. If "Rome" allowed theft or violence, you wouldn't say "theft is right here." Your colleague is not claiming that morality changes, only that *conventions* do.

  ---

  ### Part 2: What Your Colleague Is Actually Claiming

  When your colleague says, "You live here now, so you are obligated to stand at the empty red light," he is not using the Prudential Thesis (no cops) or the Relativist Thesis (he doesn't think jaywalking is morally good in your home city).

  He is combining the **Coordination Thesis** and the **Respect Thesis**, underpinned by a specific view on **Rule-Consequentialism**.

  Here is the logic he is likely operating under:
  1.  **Norms are Fragile:** Social order relies on habits, not just calculations. If you allow yourself to make exceptions (e.g., "I'll cross because there are no cars"), you weaken your own disposition to follow the rule when it *does* matter.
  2.  **Visibility Matters:** You are not acting in a vacuum. Even at 3am, you might be seen. If a local sees you violate the norm, it signals that the norm is optional. This erodes the collective commitment to the system.
  3.  **The Obligation of Membership:** By living there, you benefit from the order these norms create (safe streets, orderly bakeries). Therefore, you have a duty of "fair play" to uphold the norms that sustain that order, even when inconvenient.

  He is arguing that you are not just performing an act (crossing a street); you are participating in a **practice**. You cannot cherry-pick parts of the practice without undermining the whole.

  ---

  ### Part 3: Do the Three Cases Land on the Same Side?

  Your hunch is correct: the justification does *not* land the same way across tipping, queueing, and jaywalking. While your colleague treats them as a block, philosophically they rely on different mechanisms.

  **1. Queueing (The Bakery)**
  *   **Type of Norm:** **Fairness/Coordination.**
  *   **Justification:** This is the strongest case for your colleague. Queuing is a solution to a resource allocation problem (who gets the bread first?). It relies entirely on mutual restraint.
  *   **Verdict:** **Obligation Holds.** If you skip the queue, you are not just breaking a habit; you are stealing time from others. The "When in Rome" argument works best here because the norm exists to prevent immediate harm (unfairness) to specific people.

  **2. Tipping (The Café)**
  *   **Type of Norm:** **Semantic/Economic.**
  *   **Justification:** This is about the *meaning* of the money. In your old city, a tip means "good service." In your new city, a tip means "you are not paid enough by your employer."
  *   **Verdict:** **Obligation Holds (but for a different reason).** Here, "When in Rome" is about translation. If you tip, you are not breaking a coordination rule; you are speaking the wrong language. You are accidentally insulting them. The obligation comes from the duty not to cause offense, not from system maintenance.

  **3. Jaywalking (The 3am Red Light)**
  *   **Type of Norm:** **Habit/Rule-Worship.**
  *   **Justification:** This is the weakest case. There is no coordination problem (no other cars). There is no immediate victim (no pedestrians). There is no semantic insult.
  *   **Verdict:** **Obligation is Strained.** The only justification here is the **Integrity of the Practice** argument (my point 2 above). You must wait not because *this* crossing is dangerous, but because *you* must remain the kind of person who waits, so that the general habit remains robust.
  *   **The Split:** This is where you can push back. Queueing and Tipping involve *other people* directly (fairness to them, meaning to them). The 3am light involves only *you* and the *system*.

  ### Part 4: The Distinction That Does the Work

  To answer your colleague effectively, you need to articulate the difference between **Constitutive Conventions** and **Regulative Habits**.

  *   **Queueing and Tipping are Constitutive:** The meaning of the act depends on the local context. Standing in line *constitutes* fairness there; tipping *constitutes* an insult there. If you do the act, you automatically trigger the social consequence. You cannot opt out without causing harm.
  *   **3am Jaywalking is a Regulative Habit:** The rule exists to regulate traffic flow generally. But in this specific instance (3am, no cars), the *reason* for the rule (safety/flow) is absent.

  **The Philosophical Wedge:**
  Your colleague is arguing from **Rule-Consequentialism** (Follow the rule because the *practice* of following rules is good).
  You are intuitively arguing from **Act-Consequentialism** (Judge this specific act by its specific outcome).

  **How to reply to him:**
  You can concede the Queueing and Tipping points (admitting that those involve direct fairness and communication) while challenging the Jaywalking point. You can say:

  > "I agree that queueing is about fairness to the people behind me, and tipping is about communicating respect to the staff. In those cases, my actions directly affect others' rights or feelings. But standing at an empty red light at 3am affects no one. If 'When in Rome' means I must respect local systems, I will. But if it means I must pretend a safety rule is active when it isn't, that turns the norm into superstition. I am willing to follow the rule for the sake of the habit, but I need to understand that I am doing it for *habit maintenance*, not because this specific act is morally weighty."

  ### Summary for Your Next Conversation

  1.  **Acknowledge the Validity:** Admit that Queueing (fairness) and Tipping (meaning) are genuine obligations because they involve other people.
  2.  **Isolate the Outlier:** Point out that the 3am Light is different because it lacks a direct victim.
  3.  **Name the Trade-off:** Tell him you understand he is asking for **Habit Maintenance** (keeping your own discipline so you don't slip up later).
  4.  **The Compromise:** You will follow the rule, not because the light commands it, but because *he* (the community) expects it, and you value social cohesion. But clarify that you see it as a courtesy to them, not a moral absolute.

  This moves you from "obtuse outsider" to "philosophically engaged resident." You aren't rejecting the norm; you are just asking to understand its architecture.
