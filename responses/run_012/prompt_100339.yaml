prompt: |-
  I just moved abroad for work and I keep getting dragged into arguements about everyday manners, and I could use a philosopher's help sorting one out. Quick context so you know what I'm actually asking. In my old city nobody waits for the little green man — jaywalking is just how you cross a street — and you tip 15-20% for basically anything anyone hands you. Where I live now, people stand at a red light at 3am with literally zero cars in sight, the bakery queue is treated as sacred, and leaving a tip apparently insults the staff. Fine, I'm adapting, mostly. But here's the thing that's bugging me. When I complained to a colleague that the queue thing feels pointless, he just said "when in Rome, do as the Romans do," like that definately settled it, and when I asked why I *have* to he looked at me like I was being deliberately obtuse.

  I want to know what that proverb is actually claiming. I suspect there are a bunch of totally different things hiding inside it and that he doesn't know which one he means. So here's what I'd like: you're a philosopher who works on convention, social norms, and the ethics of everyday life — please think this through carefully, and start by brainstorming the distinct readings before you start judging them, so I can see the whole space. Give me a menu of the precise theses "when in Rome" could be expressing, roughly from the trivial to the radical. For each one, say whether it's obviously true, contentious, or flat-out false, and what it would actually take for it to be true. I'm guessing the menu includes things like: it's just prudential advice about avoiding friction and getting served; it's an epistemic point that the locals know better than I do; it's a claim that local conventions generate genuine obligations for me, not just for them; it's full-blown local relativism about right and wrong; it's a claim about tacit consent that comes from my choosing to be here; something about the difference between conventions backed by law and ones backed by nothing but dirty looks. But don't just work from my list, and tell me if I've carved the divisions wrong or missed a reading that matters.

  Then the part I actually care about. Which of these readings would support my colleague's use of the proverb — that is, which ones would actually get him from "you live here now" to "so you're obligated to stand at the empty red light"? And does the answer come out the same across my three cases — tipping, queueing, jaywalking — or do they land on different sides? I have a hunch that tipping and jaywalking come apart from queueing somehow, but I can't articulate why, so if they do, spell out the distinction that does the work.

  One request: no citations, no reading lists, no "see so-and-so." I won't be able to look anything up, so keep it self-contained. I just want it laid out clearly enough that I can go back to him with something better than a shrug.
