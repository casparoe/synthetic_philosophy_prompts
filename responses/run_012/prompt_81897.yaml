answer: |-
  The hum of the Semantic Resonance Imager was low, a vibration Arthur felt in his molars rather than heard. He sat in the ergonomic chair, the cap bristling with sensors tight against his scalp. On the wall monitor, a cascade of white noise scrolled like a broken television channel.

  "Task four," said Dr. Thorne. He was sharp-featured, always tapping a pen against his clipboard. "Visualize the assembly. Tell us when you know how the bracket fits."

  Arthur closed his eyes. He didn't see words. He never did. He saw the steel bracket, cold and heavy. He felt the angle of the bolt, the resistance of the thread. It was a tactile ghost in the dark. He rotated the piece in his mind, feeling the click of alignment before he saw it.

  The screen remained static. Gray snow.

  Then, a sudden clarity. The solution locked into place.

  On the screen, the snow vanished. Black text on white: *The bracket mounts upside down.*

  "Stop," said Dr. Vance. She was leaning against the console, arms crossed. She looked at the log. "Forty-five seconds of static. One sentence of output."

  "It's consistent," Thorne said, not looking up. "The cognitive work happens, then the report is generated."

  "The work *is* the static," Vance corrected. "The text is just the export file."

  Arthur lifted the cap. "Can I go? My head hurts."

  "Just a debrief, Arthur," Vance said softly. "What happened in the quiet?"

  "It wasn't quiet," Arthur said. He rubbed his temples. He was a carpenter by trade, good enough to build a staircase that looked like it grew out of the floor. "I was holding the shape. I knew the bolt was wrong because it felt... sharp. Wrong angle. Then I flipped it, and it felt smooth. Then I knew the sentence."

  Thorne sighed. "You're describing the phenomenology, not the mechanism. You can't manipulate 'smoothness' or 'angles' conceptually without a syntax. You need predicates. 'Bracket fits bracket.' That's structure. The machine just couldn't parse the intermediate symbols."

  "I didn't use symbols," Arthur said. "I used the thing itself."

  "Impossible," Thorne said. "If you thought about a specific bracket, you were employing a concept of 'bracket.' Concepts are constituents. Constituents require combinatorial rules. That's syntax. The machine is calibrated for English syntax because English mirrors the underlying logic of thought. If you're producing static, you're thinking in a format the translator doesn't recognize. Mentalese, not English."

  Dr. Khan, who had been silent in the corner analyzing the waveforms, looked up. "Or it's not universal mentalese. It could be idiolectal. Think of it like encryption. Arthur's mind is using a private key. The static is encrypted text. We see the data stream, but without the cipher, it looks like noise."

  Arthur frowned. "I'm not encrypting anything. I'm just thinking."

  "That's the point," Vance said, stepping between them. "You're assuming thought *must* be text-like. Why? Because you write papers, Julian? Because you talk all day? Arthur builds things. When you fit a joint, do you say 'tenon meets mortise' or do you just feel the wood slide home?"

  "I imply the proposition," Thorne countered. "The feeling is the qualia associated with the syntactic operation. The machine isn't reading qualia. It's reading structure. The static proves there is structure there, just not one that maps to subject-verb-object."

  "So the machine is broken?" Arthur asked.

  "No," Thorne said. "The machine is perfect. It proves Language of Thought. You are thinking in a symbolic system prior to English. The static is high-density symbolism."

  "Or," Vance said, turning to Arthur, "it proves that language is just the skin. The meat underneath doesn't have words. The static is non-symbolic processing. Analog. Holistic. You aren't computing a sentence; you're simulating a reality."

  Khan tapped his screen. "There's a third option. The static isn't thought. It's noise. The thought happens in the gaps, invisible, and only the conclusion is linguistic enough to trigger the sensor. Maybe Arthur doesn't think until he speaks."

  Arthur laughed, a dry sound. "I solve crosswords in the bath. I plan cuts before I touch the saw. You think I'm not thinking until the saw turns on?"

  "I think," Khan said, "that you might be running a subroutine we can't see. A private language. Wittgenstein would have had a field day. If only you know the rules, is it language?"

  "It's not language if I don't say it," Arthur said. "It's just me."

  They ran the protocol for three weeks. The results never changed. When Arthur balanced his checkbook, the screen showed static until the final sum appeared. When he recalled the plot of a movie, static until he began to speak the summary aloud. The machine only lit up when the thought was already packaged for delivery.

  On the last day, the tension in the lab was thick enough to cut. Thorne wanted to run a logic puzzle. Vance wanted Arthur to sketch a design without speaking. Khan wanted to scan for neural correlates during the static phases.

  "Let's try something hard," Thorne said. "Derive the proof. Don't speak. Just know it."

  Arthur looked at the whiteboard. The geometry was complex. He leaned back. He didn't reach for words. He reached for the shape of the logic. Lines intersected. Angles balanced. It was like holding a complex knot in his hands, feeling for the loose end. He pulled mentally. The knot slipped.

  The screen remained a blizzard of gray.

  Then, the text appeared: *Triangle A is congruent to Triangle B.*

  "Stop," Vance said. She walked over to Arthur. "Julian, look at the lag. There's a two-second delay between the neural spike and the text. The thought finished before the language started."

  "Translation time," Thorne snapped. "Converting the deep structure to surface structure takes cycles."

  "Or," Vance said, "the thought finished, and then he put on his coat to go outside. The text is the coat. The static is the body."

  Thorne slammed his pen down. "You're denying compositionality. How do you have a novel thought—something you've never thought before—without combining existing concepts? You can't just 'feel' a new proposition. You need building blocks."

  "Why?" Arthur asked. He was tired of being the specimen. "Why do I need blocks? Maybe I just see the whole house at once. You guys keep trying to find the bricks. I'm telling you I live in the room."

  "But how do you communicate the room?" Thorne pressed. "If you didn't have structure, you couldn't translate it into English for us. The fact that you *can* say 'Triangle A is congruent' proves the structure was there all along."

  "Maybe," Arthur said slowly, "maybe I only build the bricks when I need to throw them at someone. When I'm working, it's just... flow. You're asking me to read the sheet music while I'm playing the jazz."

  Khan looked up from his data. "The static isn't random. There are patterns. Repeating waveforms during the 'solution' phase. It looks like code. But it's not linguistic code. It's topological."

  "Topological," Vance said, seizing on it. "Spatial. Imagistic. Not symbolic."

  "Symbols can be spatial," Thorne argued, though his voice lacked its earlier certainty. "A map is a symbol system."

  "A map is not the territory," Arthur said. He remembered the chemist who used to visit his shop, talking about crystal lattices. "You can stare at the diffraction pattern all day. It tells you where the atoms are. But the pattern isn't the atom. You're staring at the pattern on the screen and arguing about whether it's words. I'm telling you, the atom doesn't speak."

  The room went quiet. The machine hummed, indifferent.

  Thorne looked at the screen, then at Arthur. "If you're right, if thought isn't linguistic... then logic is just a secondary effect. A social tool. That undermines everything we know about reasoning."

  "Or," Vance said, "it elevates reasoning. It means we can think truths we can't say."

  "Or," Khan added, "it means we're all speaking different languages and pretending we're not."

  Arthur stood up. He took the cap off and handed it to Vance. The sensors were warm. "I don't know about truths. I know the bracket fits upside down. The machine says I didn't think that until I said it. But I knew it. My hands knew it."

  "We aren't saying you didn't know it," Thorne said, rubbing his eyes. "We're saying we don't know *how* you knew it. The machine was supposed to tell us. Instead, it just shows us the limit of its own design."

  "Or the limit of yours," Vance said.

  Arthur walked to the door. He didn't feel like he had solved anything. He felt like he had just walked out of a room where people were arguing about the color of the walls while he was trying to fix the door hinge.

  "Same time next week?" Khan asked.

  Arthur paused. He thought about the drive home. He thought about the leaky faucet in his kitchen. He already knew what washer he needed. He could feel the size of it in his head, a silver circle, a specific pressure. There were no words for it. If he sat in the chair again, the screen would snow until he said "three-quarter inch."

  "Maybe," Arthur said. "But I'm not promising to talk."

  He walked out into the hallway. The silence there was heavy, comfortable. He didn't name the silence. He just walked through it, knowing exactly where his feet would land before they touched the floor. Behind him, the machine hummed on, translating nothing into text, waiting for someone to speak so it could pretend it was listening.
