      *   *The "Veil" Trap:* Students think Veil $\rightarrow$ Utilitarianism.
      *   *The Reality:* Veil + Expected Utility Maximization $\rightarrow$ Utilitarianism. Veil + Maximin $\rightarrow$ Rawlsian Difference Principle.
      *   *The Weights:* $a_i$ are arbitrary unless we add Anonymity (everyone counts equally) or Equiprobability (I could be anyone with prob $1/n$).
      *   *Ex Ante vs. Ex Post:* A lottery might look fair beforehand but produce inequality afterwards.

