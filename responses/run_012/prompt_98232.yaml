  7.  **Final Polish:** Check against constraints. 14 students. 80 mins. Printable materials. No lecture up front. One-liner at end.

      *   *Self-Correction on Stakes:* Make sure the tokens feel real. "Coffee Kitty" is good.
      *   *Self-Correction on Harsanyi Nuance:* Ensure the debrief explicitly mentions that Harsanyi's theorem *derives* utilitarianism from EU + Pareto, whereas the activity shows that EU + Veil *leads* to Utilitarianism *if* you accept Equiprobability. The distinction is subtle but vital. The activity shows the *motivation* for the axioms, not the proof.

