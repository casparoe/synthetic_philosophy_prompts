      *   *Final Activity Design:* "The Impartial Observer Game."
          *   14 Students.
          *   Hidden Identities (Type A, B, C) with different payoff potentials.
          *   Task: Choose a Social Welfare Function (SWF) from a menu.
          *   Menu: (1) Sum of Utilities, (2) Min Utility, (3) Weighted Sum (let them pick weights).
          *   Veil: They don't know their Type when choosing.
          *   Reveal: Types revealed, payouts calculated.
