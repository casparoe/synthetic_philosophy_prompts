answer: |-
  # Activity: The Impartial Observer's Gamble

  **Class Size:** 14 Students
  **Time:** 80 Minutes
  **Stakes:** A "Coffee Kitty" (e.g., $30 cash or equivalent value in high-quality chocolate/coins) distributed at the end based on token accumulation.
  **Materials:** 
  *   14 Sealed Envelopes (labeled "Identity").
  *   14 "Decision Sheets" (printed).
  *   Whiteboard/Projector for tallying.
  *   Tokens (poker chips or printed vouchers).

  ## The Setup (0:00–0:10)
  **Do not lecture.** Hand every student a sealed envelope and a Decision Sheet.

  1.  **The Identity Envelopes:** Inside each is a card assigning them a "Social Type" for this simulation. 
      *   **Type A (High Capacity):** 4 students. (Potential to generate 10 tokens).
      *   **Type B (Med Capacity):** 6 students. (Potential to generate 5 tokens).
      *   **Type C (Low Capacity):** 4 students. (Potential to generate 1 token).
      *   *Instruction:* "Do not open this envelope. You are currently behind a Veil of Ignorance. You do not know your type."

  2.  **The Stakes:** Explain that tokens accumulated today convert directly to the Coffee Kitty/Chocolate at the end. 1 Token = $2 value (or 1 premium chocolate coin).

  3.  **The Task:** The class must unanimously (or by supermajority, e.g., 75%) select a **Constitutional Rule** that will determine how tokens are generated and distributed once identities are revealed. They have 15 minutes to deliberate and vote.

  ## Round 1: The Thin Veil (0:10–0:35)
  **The Menu of Rules:** Write these two options on the board. They must choose one.

  *   **Rule 1 (Efficiency/Sum):** "The Social Pie is maximized. Total tokens = Sum of all individual capacities + a 30% 'Cooperation Bonus'. Tokens are distributed **proportionally** to individual capacity."
      *   *Math:* If chosen, Total Pot = $(4\times10 + 6\times5 + 4\times1) \times 1.3 = 96.2$ tokens. Distribution: Type A gets share of 10/74 of pot, etc.
      *   *Implication:* High variance. Type C gets very little, but the total pie is biggest.
  *   **Rule 2 (Security/Min):** "The Social Pie is safe. Total tokens = Sum of all individual capacities (No Bonus). Tokens are distributed **equally** among all 14 students."
      *   *Math:* Total Pot = 74 tokens. Distribution: 74 / 14 = 5.28 tokens each.
      *   *Implication:* Low variance. Type A gets less than potential, Type C gets much more.

  **The Trap:** 
  Most students, assuming they are equally likely to be any of the 14 specific *individuals* (Equiprobability), will calculate Expected Value (EV).
  *   EV Rule 1: $96.2 / 14 \approx 6.87$ tokens.
  *   EV Rule 2: $74 / 14 \approx 5.28$ tokens.
  *   *Result:* Rational EU maximizers choose Rule 1 (Utilitarianism). Risk-averse maximin choosers pick Rule 2 (Rawlsianism).

  **Action:** 
  1.  Let them debate. (Listen for: "What if I'm Type C?" vs. "But the average is higher!").
  2.  Take a vote. 
  3.  **Record their justification** on the board (e.g., "We wanted the highest average," or "We didn't want anyone to starve").
  4.  **Students open envelopes.** Reveal Types.
  5.  **Calculate and Hand out Tokens** based on the chosen rule.
      *   *Predictable Friction:* If Rule 1 won, the 4 Type C students will receive very few tokens (approx 1.3 each) compared to Type A (approx 13 each). This creates immediate *ex post* resentment despite *ex ante* fairness.

  ## Round 2: The Thick Veil & Weights (0:35–0:50)
  **The Twist:** Reset the tokens (collect them back or start a new ledger for the second half of the kitty). Tell them they will run the society again, but with new information.

  1.  **New Information:** "You are still behind the veil (don't open new envelopes yet), but we tell you the **Population Distribution** has changed."
      *   **Type A:** 1 student.
      *   **Type B:** 2 students.
      *   **Type C:** 11 students.
      *   *(You actually keep the same 14 envelopes from Round 1, but you lie about the distribution or reshuffle the envelopes to match this new skew. Reshuffling is cleaner.)*
      *   *Correction for simplicity:* Just reshuffle the original 14 envelopes to match the new skew (1 High, 2 Med, 11 Low).

  2.  **The New Menu:**
      *   **Rule 1 (Unweighted Sum):** Maximize Total Tokens + 30% Bonus. Distribute Proportionally to Capacity.
      *   **Rule 3 (Weighted SWF):** Maximize Total Tokens + 30% Bonus. Distribute **Equally** (Anonymity).
      *   *(Note: Rule 3 forces them to confront whether 'Summing Utilities' requires 'Equal Weights'.)*

  3.  **The Decision:** Ask them to vote again. 
      *   *The Harsanyi Point:* If they assume "I am equally likely to be any *person*," the EV of Rule 1 is still highest. But now the *inequality* is stark. 11 people get crumbs, 1 person gets a feast. 
      *   *The Weights Point:* If they choose Rule 3 (Equal Distribution of the Efficient Pie), they are implicitly applying **equal weights** to utilities despite different capacities. This isolates the "Anonymity" axiom from the "Pareto/Efficiency" axiom.

  4.  **Reveal & Payout:** Open envelopes. Distribute tokens.

  ## Debrief & Theory Mapping (0:50–1:20)
  **Do not lecture until they speak.** Ask:
  1.  "Why did you pick Rule 1 in Round 1?" (Likely: "Best average outcome.")
  2.  "Type Cs, how did it feel to get 1 token when you agreed to the rule?" (Highlights Ex Ante vs. Ex Post).
  3.  "Did the Veil force you to be Utilitarian?" (No, you could have picked Rule 2/Maximin).
  4.  "What assumption did you make about the probability of being Type A vs C?" (This draws out the **Equiprobability** assumption).

  **Instructor Mapping (The "Lecture" Part):**
  *   **The Veil:** It's just a state of uncertainty. It doesn't dictate a decision rule.
  *   **The Decision Rule:** Harsanyi's theorem says **IF** you maximize Expected Utility (vNM axioms) behind the veil, **THEN** you must maximize the Sum of Utilities (Utilitarianism). If you maximize Minimum Utility (Maximin), you get Rawls. The activity showed you *chose* the rule; the Veil was just the setting.
  *   **The Weights:** In Round 2, if you kept equal weights despite the skewed population, you invoked **Anonymity**. Harsanyi's $W = \sum a_i U_i$ allows unequal weights. Equal weights ($a_i = a_j$) require the extra ethical assumption that every person counts the same, not just that *you* are equally likely to be them.
  *   **Ex Ante vs. Ex Post:** Rule 1 was fair *before* the envelopes opened (everyone had the same EV). It was unfair *after* (Type C got screwed). Harsanyi cares about Ex Ante welfare; critics (like Diamond) care about Ex Post distribution.

  ## Predictable Pitfalls (What Will Go Wrong)
  1.  **The Egalitarian Override:** Students may ignore the rules and insist on splitting the final kitty equally regardless of the vote. *Fix:* Be the "Bank." Enforce the rule strictly. If they rebel, point out they are violating the Pareto principle they just voted for.
  2.  **Risk Neutrality:** Master's students often default to EV maximization automatically. They might not feel the "pull" of Maximin. *Fix:* In Round 1, explicitly ask the Type Cs (once revealed) if they feel "bound" by the agreement. Their discomfort is the data point.
  3.  **Time Creep:** Deliberation will run long. *Fix:* Hard stop at minute 35 for Round 1 vote. Use a timer on the projector.
  4.  **Cardinal Utility Confusion:** Students will treat tokens as money (linear utility). Harsanyi requires cardinal utility. *Fix:* In debrief, acknowledge this limitation. "We assumed tokens = utility. In reality, Type C might value that 1 token more than Type A values 10. Harsanyi's theorem requires us to measure that."

  ## Limitations (What This Can't Do)
  *   **Prove the Theorem:** This activity motivates the *assumptions* (EU, Pareto, Continuity), but it does not prove the *representation result*. You cannot derive the linear form $W = \sum a_i U_i$ from a classroom vote. You must supply the math on the board.
  *   **Interpersonal Comparison:** The activity glosses over the hard problem of comparing Type A's utility to Type C's. We assume tokens are comparable. Harsanyi's theorem *requires* unit comparability for the weights to make sense. You must explicitly state: "We are assuming 1 token = 1 util for everyone, which is the heavy lifting."
  *   **The 'Impartial Observer' vs. 'Veil':** Harsanyi's original formulation uses an Impartial Observer imagining themselves in others' shoes, not necessarily a Veil of Ignorance (Rawls). The activity blends them for pedagogical ease. Clarify in debrief that Harsanyi's observer *knows* the preferences but randomizes identity.

  One-liner: The veil of ignorance doesn't force utilitarianism; your hidden assumption about risk does.
