      Behind the veil, if they are EU maximizers, they pick A. If Risk Averse, they pick B.
      This isolates the *decision rule under uncertainty* as the driver, not the Veil itself.

      *Final Plan Structure:*
      1.  **Setup (10m):** Envelopes with "Life Lottery" tickets (Types). Do not open.
