          5.  Reveal Types. Calculate Payoffs.
          6.  Round 2: Change the probabilities (e.g., Type C is now 80% of population). See if they switch to Weighted Sum.
          7.  Debrief: Connect to $a_i$ weights.

      *   *Wait, 80 mins is tight.* Let's streamline.
      *   *Round 1:* Veil of Ignorance. Choose Rule. (Most will choose Max Sum or Max Min).
      *   *Round 2:* "Thick Veil." You know the distribution of types (e.g., 10 poor, 4 rich). Choose Rule again.
      *   *Payoff:* Chocolate coins.
      *   *The "Gotcha":* In Round 1, if they choose Max Sum, ask *why*. If they say "Because I could be anyone," press on the probability. If they assume 1/14 for each, that's equiprobability. If they choose Max Min, that's risk aversion violating EU.
      *   *The "Ex Post" wrinkle:* Even with Max Sum, one person might get 0 tokens by chance in the realization.

  5.  **Refining the "What Will Go Wrong":**
      *   Students will try to split everything equally regardless of the rule (Strong Egalitarian instinct).
      *   The "Veil" is hard to enforce psychologically.
      *   They might treat it as a bargaining game rather than a moral choice.
      *   Time creep during debrief.

  6.  **Refining the "What It Can't Do":**
