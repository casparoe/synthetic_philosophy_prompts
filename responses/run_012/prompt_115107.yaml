prompt: |-
  I write novels — the kind in which people say things that change their lives: vows, resignations, confessions, threats, curses, the reading of a will, the moment someone is given a name or has it taken away. I make decisions of this kind several times a chapter, and the problem is craft-level but I think it is really conceptual. When I draft a scene that turns on such a line, I cannot reliably tell whether the line actually does the thing in the world of the book or merely sounds as though it does. My editor has twice caught me building a climax on words that, on inspection, could not have bound anyone to anything; I noticed the second time only because a reader asked why a character was ruined by something that was not, in fact, a promise.

  I would like a decision procedure I can run at my desk, mid-draft, on a single line of dialogue or a single document in a manuscript. Ten minutes, no theory on my part, no philosophy library.

  Three distinctions I half-remember from an undergraduate course and have probably mangled. Use them if they are sound, replace them if they are not, and tell me where I have got them wrong:

  - Some failures of these acts are cases where the act never came off at all; others are cases where it came off perfectly and is simply hollow — the promise made with no intention of keeping it. The two have different dramatic consequences, and I keep treating them as one thing.
  - Some of these acts need an institution standing behind them (a court, a church, a guild, a rank); others need only the mutual recognition of the parties in the room.
  - Some require the other party to take them up; others take effect whether or not anyone registers them.

  What I want from the procedure: the questions in order; what counts as a sufficient answer to each; the point at which the procedure stops and returns a no, meaning that this line cannot do that work and must be rewritten or reassigned; and the point at which it hands the decision back to me because the question concerns my invented world's conventions rather than language — together with what I would then have had to establish earlier in the book for the answer to hold.

  Then run it on three scenes from the current draft:

  1. A woman resigns a chairmanship by speaking the words aloud in an empty committee room. She means them, the words are the right ones, and the only witness is a cleaner who does not understand the language.
  2. A dying man extracts a promise from the narrator, who intends at that moment to break it. I need this promise to be void so that the narrator remains free; I suspect I am wrong about that.
  3. In an invented society, a betrothal is spoken in a form that a religious reformer altered two generations earlier, so that half the community recognizes it and half does not.

  For the third, the procedure should tell me what I owe the reader by way of preparation. Please include, rather than smooth over, the case where the procedure returns an answer I will not like.

  Finally: say how confident you are in each part of what you give me, and single out the one point you are least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** A novelist writing high-stakes dialogue (speech acts: vows, resignations, etc.).
      *   **Problem:** Can't reliably tell if a line *actually* performs the act in the story world or just *sounds* like it does. Editor/reader feedback confirms this is a real issue (climaxes built on non-binding words).
      *   **Goal:** A 10-minute decision procedure (checklist/algorithm) to run mid-draft on a single line/document.
      *   **Constraints:** No theory, no philosophy library. Use/fix three specific distinctions provided by the user.
      *   **Output Requirements:**
          *   The Procedure (Questions in order, sufficient answers, stop points, hand-off points).
          *   Application to three specific scenes.
          *   Confidence assessment (including the least sure point).
      *   **Tone:** Professional, precise, craft-focused, respectful of the user's expertise but firm on the logic.

  2.  **Evaluate the User's Three Distinctions (Speech Act Theory Lite):**
      *   *Distinction 1:* "Act never came off" vs. "Act came off but is hollow (insincere)."
          *   *Theory Check:* This aligns with J.L. Austin's distinction between *misfires* (procedure not followed, wrong person, etc. -> act void) and *abuses* (procedure followed, but insincere -> act valid but dishonest).
          *   *Verdict:* Sound. Crucial for drama. A void act changes nothing; a hollow act changes everything (creates a lie/betrayal).
      *   *Distinction 2:* "Institution needed" vs. "Mutual recognition only."
          *   *Theory Check:* Aligns with *institutional facts* (Searle) vs. *interpersonal commitments*. A judge can sentence; a friend can only promise.
          *   *Verdict:* Sound. Determines *authority*.
      *   *Distinction 3:* "Requires uptake" vs. "Takes effect unilaterally."
          *   *Theory Check:* Austin debated "uptake" (hearing/understanding). Some acts need it (betting, marrying), some don't (naming a ship, maybe resigning depending on rules).
          *   *Verdict:* Sound. Determines *audience requirements*.

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* 10 minutes, no theory. Needs to be a flowchart in text form.
      *   *Step 1: Authority (Institution vs. Personal).* Who has the power to say this?
      *   *Step 2: Procedure (Form vs. Intent).* Are the right words said in the right context? (Addresses Distinction 1).
      *   *Step 3: Uptake (Witness/Receiver).* Does someone need to hear/accept it? (Addresses Distinction 3).
      *   *Step 4: Sincerity (Hollow vs. Void).* (Addresses Distinction 1 again, but specifically for the "hollow" aspect).
      *   *Refinement:* Let's structure it logically.
          1.  **Authority:** Does the speaker have the standing? (Institutional or Personal).
          2.  **Protocol:** Is the form correct? (Words, time, place).
          3.  **Uptake:** Does it need a receiver?
          4.  **Sincerity:** Does intent matter for validity?
      *   *Stop Conditions:* If Authority = No -> Stop (Void). If Protocol = No -> Stop (Void). If Uptake = Required but missing -> Stop (Void).
      *   *Hand-off Conditions:* If the rules depend on world-building (e.g., "Does this culture require a witness?"), flag for earlier setup.

  4.  **Applying the Procedure to the Three Scenes:**

      *   *Scene 1 (Resignation in empty room):*
          *   Authority: She is Chair. (Yes).
          *   Protocol: Words right. (Yes).
          *   Uptake: Does resignation need receipt? Usually yes (to the body). Empty room + cleaner who doesn't understand = No Uptake.
          *   Result: Likely Void. *Unless* the rules say "spoken aloud is enough."
          *   Fix: Needs setup that resignation is unilateral/ritualistic, or needs a witness.

      *   *Scene 2 (Dying man/Promise/Insincere):*
          *   Authority: Personal promise. (Yes).
          *   Protocol: Request/Acceptance. (Yes).
          *   Uptake: Dying man hears it. (Yes).
          *   Sincerity: Does insincerity void a promise? In most ethics/narratives, a promise made with intent to break is a *lie*, but the *obligation* still exists socially/morally. The user *wants* it to be void.
          *   Result: Procedure says it's valid (but hollow). User's desire (void) conflicts with standard convention.
          *   Fix: Need world-building rule that "Intent binds the magic/social contract" or change the narrator's intent.

      *   *Scene 3 (Betrothal/Old Form):*
          *   Authority: Personal/Religious.
          *   Protocol: Old form vs. New form.
          *   Uptake: Community recognition.
          *   Result: Contested validity.
          *   Prep owed: Reader needs to know the Schism exists *before* the climax, or the ambiguity is just confusion, not drama.

  5.  **Refining the Output (Self-Correction during drafting):**
      *   *Critique:* Make sure I don't sound like a philosophy professor. Keep it practical for a writer.
      *   *Correction:* Use terms like "Standing," "Form," "Receipt," "Binding."
      *   *Confidence Check:* I need to be honest. Speech act theory is robust, but applying it to *fiction* involves "narrative causality" which is fluid. I am least sure about the "Insincere Promise" (Scene 2) because narrative logic often overrides real-world logic (e.g., magical oaths). I must flag this.

  6.  **Finalizing the Procedure Steps:**
      1.  **Standing:** Does the speaker have the right?
      2.  **Form:** Are the words/ritual correct?
      3.  **Receipt:** Does it need to land on someone?
      4.  **Intent:** Does sincerity affect validity? (The "Hollow" check).

  7.  **Finalizing the Scene Analyses:**
      *   Scene 1: Fails on Receipt.
      *   Scene 2: Fails User's Desire (It is binding despite intent).
      *   Scene 3: Fails on Clarity (Needs setup).

  8.  **Confidence Assessment:**
      *   High confidence on the distinctions (Austin/Searle basics).
      *   High confidence on Scene 1 & 3.
      *   Lower confidence on Scene 2 (depends heavily on genre conventions).

  9.  **Review against Constraints:**
      *   10 minutes? Yes, checklist is short.
      *   No theory? Yes, translated to craft terms.
      *   Use/fix distinctions? Yes, integrated.
      *   Confidence rating? Yes.

  10. **Final Polish:** Ensure the tone is empathetic to the writer's struggle. The "Stop" and "Hand-off" points need to be very clear. (Self-correction: Ensure I explicitly state *where* the procedure stops for each scene).

  *(Self-Correction on Scene 2)*: The user says "I need this promise to be void." The procedure will likely say "It is binding." I must be clear that the procedure identifies this as a *conflict* between standard convention and their desire, requiring specific world-building to resolve. I shouldn't just say "You're wrong." I should say "Standard convention says Binding; to make it Void, you need X setup."

  *(Self-Correction on Scene 1)*: Resignation usually requires *notification*. Speaking to a wall is usually insufficient unless the culture is highly ritualistic about the *utterance* itself. I need to highlight the "Hand-off" point regarding the specific rules of resignation in that world.

  *(Self-Correction on Distinctions)*:
  1. Misfire vs. Abuse (Void vs. Hollow). -> Keep.
  2. Institutional vs. Interpersonal. -> Keep.
  3. Uptake vs. Unilateral. -> Keep.
  I will formalize these into the procedure steps.

  Let's write it.cw
answer: |-
  Here is a decision procedure designed for speed and craft application, followed by the analysis of your three scenes.

  ### The Procedure: The Binding Test
  **Time:** 10 Minutes
  **Input:** The specific line of dialogue or document text + the immediate context (who, where, to whom).

  **Step 1: Standing (The Authority Check)**
  *   **Question:** Does the speaker possess the specific power required to perform this act?
  *   **Sufficient Answer:** Yes, by virtue of either **Office** (Judge, Chair, Priest) or **Relationship** (Friend, Lover, Parent).
  *   **Stop (Void):** If the speaker lacks the specific standing (e.g., a stranger tries to sentence a criminal; a child tries to bequeath a house).
  *   **Hand-off:** If standing depends on a rule you haven't written yet (e.g., "In this culture, only the left-handed can name ships"), note this. You must establish this rule *before* the scene for the act to land.

  **Step 2: Form (The Ritual Check)**
  *   **Question:** Are the words, timing, and location correct for this act?
  *   **Sufficient Answer:** Yes, the phrasing matches the convention (e.g., "I do," "I quit," "I promise") and the setting is appropriate (e.g., in court, in private).
  *   **Stop (Void):** If the form is wrong (e.g., saying "I might" instead of "I will"; saying it in a dream instead of waking life).
  *   **Hand-off:** If the "correct form" is ambiguous in your world, you owe the reader a prior example of the act being performed correctly.

  **Step 3: Receipt (The Uptake Check)**
  *   **Question:** Does this act require a receiver to acknowledge it for it to exist?
  *   **Sufficient Answer:**
      *   *Unilateral:* No receiver needed (e.g., naming a pet, cursing an enemy).
      *   *Bilateral:* Receiver must hear/understand/accept (e.g., promising, marrying, resigning).
  *   **Stop (Void):** If the act requires receipt (Bilateral) and no competent witness receives it (e.g., spoken to a wall, spoken in a language the listener doesn't know).
  *   **Hand-off:** If the requirement for receipt is a cultural variable, you must establish earlier whether this society values the *utterance* or the *agreement*.

  **Step 4: Intent (The Hollow Check)**
  *   **Question:** Does the speaker's internal sincerity determine validity, or does the external speech determine it?
  *   **Sufficient Answer:**
      *   *Hollow (Valid but Lie):* The act binds the speaker even if they lie (standard for promises/oaths).
      *   *Void (Invalid):* The act requires true intent to function (rare, usually magical or highly specific).
  *   **Stop (Hollow):** If the speaker lies, the act stands, but the character is now a transgressor.
  *   **Stop (Void):** *Only* if you have established a world-rule that intent powers the act.
  *   **Hand-off:** If you want a lie to void the act, you must establish earlier that "false oaths dissolve instantly" in this world.

  ***

  ### Application to Your Draft Scenes

  #### Scene 1: The Resignation in the Empty Room
  *   **Standing:** **Pass.** She is the Chair.
  *   **Form:** **Pass.** Words are correct.
  *   **Receipt:** **Fail.** Resignation is a *bilateral* act (Step 3). It is a notification of status change to the body governed. Speaking to a cleaner who does not understand constitutes no receipt.
  *   **Intent:** **N/A.**
  *   **Verdict:** **VOID.** The act did not happen. She is still Chair.
  *   **The Fix:** You cannot fix this with the line alone. You must rewrite the scene so the resignation is *delivered* (email, letter, witness who understands) OR you must establish earlier (Hand-off point) that in this specific organization, the *utterance* itself is the resignation, regardless of witness. If you choose the latter, you need a prior scene showing someone else resigning successfully in a similar way, or a line of exposition establishing the rule.

  #### Scene 2: The Dying Man and the Insincere Promise
  *   **Standing:** **Pass.** Interpersonal promise requires only two people.
  *   **Form:** **Pass.** Request made, words spoken.
  *   **Receipt:** **Pass.** The dying man heard and understood.
  *   **Intent:** **Conflict.** Standard convention (Step 4) dictates a promise made with intent to break is **Hollow**, not Void. It binds the narrator morally/socially. The narrator is now a promise-breaker, not a free agent.
  *   **Verdict:** **BINDING (HOLLOW).** Your desire for it to be void conflicts with the default logic of language.
  *   **The Fix:** You have two options.
      1.  *Accept the Bind:* The drama comes from the narrator being trapped by a lie they told a dying man.
      2.  *Force the Void:* You must invoke the Hand-off in Step 4. You need to have established earlier that in this world (or for this specific relationship), a promise requires *truthful intent* to manifest. If this is a realistic novel, this will feel like a cheat unless foreshadowed. If this is speculative fiction, you need a rule: "Oaths spoken in bad faith shatter."
  *   **Uncomfortable Truth:** If you do not establish the "Intent Rule" earlier, the reader is correct: the narrator is not free. They are bound by a lie.

  #### Scene 3: The Schismatic Betrothal
  *   **Standing:** **Pass.** The couple has the right to betroth.
  *   **Form:** **Contested.** The form is "Old," the culture is "Split."
  *   **Receipt:** **Contested.** Half the community accepts; half rejects.
  *   **Intent:** **Pass.** Presumed sincere.
  *   **Verdict:** **CONTINGENT.** The act works *for some* and fails *for others*.
  *   **What You Owe the Reader:** This is a Step 2 & 3 Hand-off. You cannot introduce the "Schism" at the moment of the betrothal.
      *   *Preparation:* You must show the reader *before* this scene that the "Old Form" is disputed. A throwaway line about a wedding that was annulled; a argument about which priest to use; a visual marker of the reformers vs. traditionalists.
      *   *Risk:* If you do not establish the schism earlier, the reader will not see "Tragic Division," they will see "Confusing World-Building." The drama relies on the reader knowing *why* half the room is gasping and half is shrugging.

  ***

  ### Confidence Assessment

  **Overall Confidence:** High.
  The distinctions you recalled are based on J.L. Austin's *How to Do Things with Words* and John Searle's *Speech Acts*. While I have stripped the philosophy, the logical structure (Felicity Conditions) is robust for narrative causality.

  **Confidence by Component:**
  1.  **The Procedure Steps:** 95% Confident. These map cleanly onto how readers intuitively track cause and effect in social contracts.
  2.  **Scene 1 Analysis (Resignation):** 95% Confident. In almost all bureaucratic and social contexts, resignation requires communication to the governed body.
  3.  **Scene 3 Analysis (Betrothal):** 90% Confident. The need for foreshadowing cultural schisms is a standard narrative requirement for clarity.
  4.  **Scene 2 Analysis (Insincere Promise):** 75% Confident.

  **The Point I Am Least Sure Of:**
  **Scene 2 (The Insincere Promise).**
  I am least sure because this depends entirely on your **genre contract**.
  *   In **Realism/Literary Fiction**: A promise is a social bond. Lying creates the bond and then breaks it. The narrator is *not* free. My analysis holds firm here.
  *   In **Fantasy/Speculative**: "True Names" or "Magic Oaths" often exist where intent *does* void the act. If your book has magic, the "Intent" step changes.
  *   In **Psychological Thriller**: The "binding" might be internal guilt rather than external obligation.

  If you are writing realism, I am 95% sure the narrator is bound. If you are writing fantasy, my confidence drops because I do not know your magic system's rules regarding truth. If you want the narrator free in a realistic setting, you must change the scene: the narrator must remain silent, or speak ambiguously enough that no promise was technically formed (Step 2 Failure).
