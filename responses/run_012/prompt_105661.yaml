answer: |-
  # Seminar Handout: The Logic of Free-Floating Rationales

  **Scope Note:** We begin from the **settled** premise that describing systems (thermostats, plants, animals) *as if* they act for ends is heuristically useful. The **contested** territory concerns whether these descriptions track mind-independent facts, and if so, what grounds them. *Note: The tree below is a reconstruction of the logical space; not every path corresponds to a fully worked-out theory in the literature.*

  ## I. The Underlying Logical Space
  Before navigating the cases, note the four dimensions that distinguish the final positions. You will encounter these in the later nodes of the tree.
  1.  **Mind-Independence:** Is the "correctness" of the behavior fixed independently of any interpreter's stance?
  2.  **Representation:** Must the rationale be carried by an internal state of the system, or can it lie wholly outside (e.g., in history or environment)?
  3.  **Normativity:** Is the "error" (e.g., growing away from light) a genuine normative failure, or merely a statistical deviation from a mean?
  4.  **Bearer of the End:** Relative to whose good is the behavior assessed? (The system's welfare, the designer's intent, the lineage's survival, or nothing?)

  ---

  ## II. The Decision Tree
  *Start at Node 1. Answer based on your intuitions about the specific cases. Follow the path to a Leaf.*

  **Node 1 (The Thermostat):**
  Do you hold that the thermostat's switching is *correctly* described as "for the sake of" temperature regulation, rather than merely as causal feedback?
  *   **No:** Go to Node 2.
  *   **Yes:** Go to Node 3.

  **Node 2 (The Biological Exception):**
  Do you hold that the plant, cuckoo, and bee possess a genuine "for the sake of" that the thermostat *lacks*?
  *   **No:** → **Leaf A**
  *   **Yes:** Go to Node 3.

  **Node 3 (The Residual Rationale):**
  Consider the RL agent deployed in a new environment where its trained behavior no longer serves the designers' aim. Do you hold that the agent's behavior still possesses its *original* rationale?
  *   **No (Rationale tracks current utility):** Go to Node 4.
  *   **Yes (Rationale tracks history/selection):** Go to Node 5.

  **Node 4 (Current Structure):**
  Do you hold that the rationale exists independently of any interpreter's stance?
  *   **No:** → **Leaf B**
  *   **Yes:** Go to Node 6.

  **Node 5 (Historical Function):**
  Do you hold that the rationale exists independently of any interpreter's stance?
  *   **No:** → **Leaf C**
  *   **Yes:** Go to Node 7.

  **Node 6 (Internalism):**
  Do you hold that the system must contain an internal state *representing* the end for the rationale to be real?
  *   **Yes:** → **Leaf D**
  *   **No:** Go to Node 7.

  **Node 7 (Normativity & Bearer):**
  Do you hold that the "error" is a genuine normative failure relative to the *system's own welfare* (rather than lineage survival or designer intent)?
  *   **No (Failure is relative to lineage/design):** → **Leaf E**
  *   **Yes (Failure is relative to system welfare):** → **Leaf F**

  ---

  ## III. Position Mapping (The Leaves)

  **Leaf A: Eliminativism**
  *   **Path:** No Rationale (Thermostat) + No Rationale (Biology).
  *   **Position:** **Eliminativism**.
  *   **Awkward Commitment:** You must explain away the overwhelming utility of teleological language in biology as nothing more than a convenient fiction with no truth-conditions.
  *   **Note:** This is the only position that denies free-floating rationales entirely.

  **Leaf B: Instrumentalist Functionalism (Unnamed)**
  *   **Path:** Yes Rationale + Current Utility + Interpreter-Dependent.
  *   **Position:** **Unnamed** (Variant of Dennett).
  *   **Awkward Commitment:** You must accept that if no one is around to interpret the system, it ceases to have a function, even if it continues to operate successfully.
  *   **Note:** Converges with Leaf C on all case verdicts; differs only on the metaphysical ground of the rationale.

  **Leaf C: The Intentional Stance**
  *   **Path:** Yes Rationale + History/Current + Interpreter-Dependent.
  *   **Position:** **Dennett-style Intentional Stance** / **Davidson-style Interpretivism**.
  *   **Awkward Commitment:** You must accept that there is no fact of the matter about what the system is doing until an interpreter adopts a stance toward it.
  *   **Note:** Davidson and Dennett converge here on the *status* of the rationale, though Davidson restricts the *range* of systems eligible for interpretation more narrowly.

  **Leaf D: Constitutivism about Reasons**
  *   **Path:** Yes Rationale + Current Utility + Mind-Independent + Representation Required.
  *   **Position:** **Constitutivism**.
  *   **Awkward Commitment:** You must deny that plants or simple thermostats have rationales at all, as they lack the constitutive representational architecture of agency.
  *   **Note:** This position effectively reroutes you to Leaf A for the plant/thermostat cases, despite answering "Yes" at Node 1/2.

  **Leaf E: Biosemantics**
  *   **Path:** Yes Rationale + History + Mind-Independent + No Representation Required + Lineage/Design Bearer.
  *   **Position:** **Millikan-style Biosemantics**.
  *   **Awkward Commitment:** You must accept that a system can be malfunctioning even if it is currently thriving, simply because it violates the conditions of its ancestral selection.
  *   **Note:** Best fits the RL Agent "Residual Rationale" intuition.

  **Leaf F: Aristotelian Natural Goodness**
  *   **Path:** Yes Rationale + Current/History + Mind-Independent + No Representation Required + System Welfare Bearer.
  *   **Position:** **Aristotelian Natural Goodness**.
  *   **Awkward Commitment:** You must commit to a substantive metaphysical account of "species form" or "natural welfare" that is not reducible to survival rates or designer intent.
  *   **Note:** Distinguishes itself from Leaf E by grounding the norm in the *individual's* flourishing rather than the *lineage's* persistence.

  ---

  ## IV. Empty or Unstable Regions
  *   **Mind-Independent but Merely Descriptive:** (Yes to Realism, No to Normativity). This combination is **unexplored**. It is unclear why one would posit mind-independent teleological facts if they generate no normative "oughts."
  *   **Representation Required but No Mind-Independence:** (Yes to Representation, No to Realism). This combination is **incoherent**. If the representation is internal, its content usually grounds the independence; if it depends on an interpreter, the internal state is irrelevant.
  *   **Thermostat Yes / Biology No:** This path was collapsed in Node 2. It is **unattractive**. Few argue that simple feedback loops have genuine teleology while complex biological systems do not.
