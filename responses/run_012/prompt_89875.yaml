      *   *Breaks:*
          *   *Trivial:* Hard drives don't breathe; colonies do. (Irrelevant to the logic).
          *   *Critical:* Backups are static/passive; colonies are active/fragile. Backups are copies; colonies are divergent branches.
      *   *The "What" Slide:* Proponents often mean "humanity survives" (biology) but imply "our values persist" (culture). These are different. A colony might survive but become a totalitarian stratocracy. Is that a successful restore?

  4.  **Task 4: Addressing the Four Suspicions:**
      *   *Suspicion 1: Restore Path.* If Earth dies, who initiates the restore? A backup drive doesn't restore itself. A colony *might* try to re-seed Earth, but do they have the capacity? Do they care?
      *   *Suspicion 2: Inherited Flaws.* If the threat is AI or Bio, the colony likely has the same tech/knowledge. Copying the data copies the virus.
