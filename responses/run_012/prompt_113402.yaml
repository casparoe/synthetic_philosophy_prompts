  8.  *(Self-Correction during drafting)*: I need to be careful not to validate the "history is fiction" claim too much. Most practicing historians reject White's strongest claims while accepting his insights on narrative. I should reflect that consensus.

  9.  *(Final check on Carr)*: Carr is often misread as a relativist. He believed in progress and facts, just that facts don't speak for themselves. I need to make sure that nuance comes through.

  10. *(Final check on White)*: White's "verbal fiction" quote is notorious. I need to explain *why* historians wince at that specific phrasing.

