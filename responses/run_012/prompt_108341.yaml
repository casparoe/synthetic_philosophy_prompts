answer: |-
  Your suspicion is not only correct; it is the precise philosophical key required to unlock this specific historiographical deadlock. You have correctly identified that your students are not disagreeing about the archive, but about the *logic of explanation* they are bringing to the archive.

  However, to fully test your hypothesis, we must determine if the disagreement is *exhaustively* methodological or if there is a residual substantive disagreement that the methodological diagnosis reveals but does not dissolve.

  Here is the diagnosis of the impasse, an evaluation of the counterfactual, and a proposal for how to move the seminar.

  ### 1. Diagnosis: A Category Error in Causal Selection

  You are right that this is not primarily a verbal dispute, nor is it purely substantive. It is a **methodological mismatch regarding causal selection and the scope of the explanandum.**

  **The Great Man (Intentionalist) Model:**
  *   **Causal Logic:** They are indeed using a version of Mill's Method of Difference. They treat Hitler as a *necessary condition* for the specific token event "The Third Reich."
  *   **Implicit Question:** "Why did *this specific* configuration of power and ideology emerge in 1933–1945?"
  *   **Causal Status of Hitler:** They view Hitler as a *necessary* component of a sufficient set. Without him, the specific sufficient set for *National Socialism* (as opposed to generic authoritarianism) cannot be assembled.
  *   **Failure Point:** As you noted, if the outcome is overdetermined (i.e., multiple different leaders could have triggered a similar authoritarian collapse), the "but-for" test ($\neg H \rightarrow \neg N$) fails to capture causal *significance*, even if it captures causal *necessity* for that specific token.

  **The Structuralist (Functionalist) Model:**
  *   **Causal Logic:** They are using a probabilistic or *INUS* account of causation (an Insufficient but Non-redundant part of an Unnecessary but Sufficient condition).
  *   **Implicit Question:** "Why did Germany succumb to fascist authoritarianism in the 1930s?"
  *   **Causal Status of Hitler:** They view Hitler as one potential *trigger* within a loaded structural environment. He is a sufficient cause, but not a necessary one. Other triggers (Strasser, Göring, a military junta) could have activated the same structural explosives.
  *   **Failure Point:** They often conflate "an authoritarian regime" with "the Nazi regime." By widening the definition of the outcome to match the structural pressures, they make Hitler's absence irrelevant, but in doing so, they risk explaining a different event than the Intentionalists are discussing.

  **The Verdict:** The impasse is a **disagreement about what an explanation is supposed to do.** The Intentionalists want to explain the *specificity* of the horror (the Holocaust, the war of annihilation). The Structuralists want to explain the *probability* of the collapse (the end of democracy, the rise of dictatorship). They are answering different questions under the single heading: "What caused the Third Reich?"

  ### 2. Is the Counterfactual Well-Posed?

  No. The counterfactual *"Had Hitler been killed... would something recognizably like the Nazi regime have come to power?"* is ill-posed because the phrase **"recognizably like the Nazi regime"** is a cluster concept that masks three distinct variables.

  To move the seminar, you must decompose "The Nazi Regime" into its constituent causal outcomes. In a "No Hitler" scenario (e.g., Gregor Strasser or Alfred Hugenberg leads the NSDAP, or the DNVP forms a coalition with the military), the following outcomes have different probabilities:

  1.  **The End of Weimar Democracy:** (Probability: High). Structuralists are correct here; the parliamentary system was likely unsustainable given the Depression and constitutional flaws.
  2.  **An Authoritarian Nationalist Dictatorship:** (Probability: High). The *völkisch* milieu and the desire for *Lebensraum* were widespread in the DNVP, Stahlhelm, and sections of the Reichswehr.
  3.  **The Specific Ideological/Exterminationist Program:** (Probability: Low/Contingent). This is the Intentionalist stronghold. The specific timing, radicalization, and ideological fixation on the "Jewish Question" as the *world-historical* key were uniquely Hitlerian. A Strasser-led regime might have been antisemitic, but likely not industrially exterminationist in the same way or on the same timeline.

  **The Diagnosis:** The Structuralists are answering "Yes" to #1 and #2. The Intentionalists are answering "No" to #3. Because they are all answering "What caused the Nazi Regime?" without specifying which layer of the regime they mean, they talk past each other.

  ### 3. The Contrast Class Wrinkle

  Your insight about the contrast class is the most powerful tool here. In the philosophy of explanation (following Bas van Fraassen or Peter Lipton), an explanation is always an answer to a "Why P rather than Q?" question.

  *   **Intentionalist Contrast Class:** "Why Nazi Germany *rather than* a conservative military dictatorship (e.g., Schleicher/Papen)?"
      *   *Answer:* Because Hitler radicalized the movement beyond traditional conservatism.
  *   **Structuralist Contrast Class:** "Why Nazi Germany *rather than* a stable Weimar Republic?"
      *   *Answer:* Because structural pressures made democracy untenable; Hitler was just the vessel.

  **The Overdetermination Problem:**
  You correctly identified that if the outcome is overdetermined, the "but-for" test fails. If the Depression, Versailles, and Antisemitism constitute a sufficient cause for *Authoritarianism*, then removing Hitler does not prevent *Authoritarianism*.
  However, the Intentionalist can argue that while *Authoritarianism* was overdetermined, *National Socialism* (as a specific ideological project) was not.
  *   **The Trap:** The Structuralists argue that "National Socialism" is just a label for the inevitable Authoritarianism. The Intentionalists argue "National Socialism" is a specific deviation from the inevitable Authoritarianism.
  *   **Resolution:** This is not just verbal; it is a substantive disagreement about the *plasticity* of the German Right. Was the German Right a block of wood that could be carved by anyone (Structuralist), or was it a volatile chemical compound that required a specific catalyst (Hitler) to explode in that specific way (Intentionalist)?

  ### 4. How to Move the Seminar

  Do not ask them to agree on history. Ask them to agree on the *logic of their history*. Here are three concrete interventions:

  **A. The "Decomposition" Exercise**
  Stop asking about "The Nazi Regime." Ask three separate counterfactual questions:
  1.  Without Hitler, does Weimar fall? (Tests structural fragility).
  2.  Without Hitler, does a right-wing dictatorship emerge? (Tests the authoritarian baseline).
  3.  Without Hitler, does the Holocaust occur? (Tests the specific ideological causal chain).
  *Expected Result:* The class will likely converge on "Yes, Yes, Maybe/No." This validates *both* sides partially and forces them to admit they are weighing different variables.

  **B. The "Causal Weight" vs. "Causal Necessity" Distinction**
  Introduce the distinction between *necessary conditions* and *causal weight*.
  *   Even if Hitler was not *necessary* for a dictatorship (Structuralist view), he may have carried the vast majority of the *causal weight* for the *character* of that dictatorship (Intentionalist view).
  *   Ask the Structuralists: "If Hitler is replaceable, who replaces him, and does the regime look the same in 1942?"
  *   Ask the Intentionalists: "If Hitler is essential, why did the bureaucracy and party function so effectively without his direct input in many areas (polycracy)?"

  **C. Explicitly Map the Contrast Classes**
  Write on the board: **"We are explaining X rather than Y."**
  *   Group A must write: "We are explaining the *specific racial ideology* rather than *generic nationalism*."
  *   Group B must write: "We are explaining the *seizure of power* rather than *democratic stability*."
  *   **The Move:** Once they see they are explaining different *explananda*, the impasse dissolves into a synthesis: *Structural causes made the seizure of power likely; Agent causes made the specific ideological character of the regime unique.*

  ### 5. What Will Actually Move Them?

  A conceptual distinction will move them more than a piece of evidence. They already agree on the evidence (the Depression, Hitler's speeches, the party structure).

  **The Intervention:**
  Introduce the concept of **Preemption**.
  In causation, $C$ preempts $D$ if $C$ causes $E$, but if $C$ hadn't, $D$ would have caused $E$ instead.
  *   **Scenario:** If Hitler hadn't risen, would another nationalist leader ($D$) have preempted the outcome ($E$ = Dictatorship)?
  *   **The Twist:** Even if $D$ causes $E$ (Dictatorship), $D$ might not cause $E^*$ (Genocidal War).
  *   **The Lesson:** The Structuralists are arguing about $E$. The Intentionalists are arguing about $E^*$.

  **Conclusion:**
  Your suspicion is robust. The impasse is a **suppressed disagreement about the contrast class and the granularity of the explanandum.** The counterfactual is currently ill-posed because it treats "The Nazi Regime" as a monolith rather than a bundle of distinct outcomes (authoritarianism, war, genocide).

  To move the seminar, do not ask them to decide if Hitler was "important." Ask them to specify **which features of the Third Reich they believe were overdetermined by structure and which were contingent on agency.** This forces the Structuralists to concede the uniqueness of the Holocaust and the Intentionalists to concede the fragility of Weimar. It transforms a binary stalemate into a nuanced causal map.
