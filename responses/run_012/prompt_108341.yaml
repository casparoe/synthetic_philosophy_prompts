      *   **User's Hypothesis:** The disagreement isn't about facts but about *causation and explanation*. Specifically, different methods of causal selection (Mill's Method of Difference vs. Contrastive/Causal Selection) and unstated contrast classes. Also, the issue of overdetermination undermines the "but-for" test.
      *   **Task:** Diagnose the impasse (verbal, substantive, methodological, or different questions?). Engage concretely with the positions. Evaluate if the counterfactual is well-posed. Suggest what would actually move the seminar (conceptual distinction, question change, evidence, or nothing).
      *   **Constraint:** Test the user's suspicion, don't just assume it.

  2.  **Deconstruct the User's Hypothesis:**
