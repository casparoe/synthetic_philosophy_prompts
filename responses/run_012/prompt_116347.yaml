          *   Interval: I don't *have* a number. I have [0.2, 0.8].
          *   Sharp: That's a Dutch Book waiting to happen. I can buy low and sell high against your set.
          *   Interval: Only if I *must* bet. I can decline. My imprecision is a refusal to price, not a pricing error.

      *   **Round 2: Ontology (Ignorance vs. Indeterminacy).**
          *   Sharp: It's just ignorance. If we knew the jar's composition, it collapses to a point. You're modeling *your* lack of info, not the coin.
          *   Interval: What if the jar itself was filled by a process we can't model? Even an ideal agent might face indeterminacy. The interval is the truth, not a placeholder.

      *   **Round 3: Dilation (Learning makes it worse).**
