answer: |-
  **Setting:** *A quiet corner of a noisy café. A brass coin sits on the table between them. A bookie stands nearby, tapping a pen against a notepad, waiting for an answer.*

  **Sharp:** Pick a number. The bookie isn't going to wait forever.

  **Interval:** I'm not picking a number. There isn't one.

  **Sharp:** There's always a number. That's the price of admission to rationality. If you have an opinion on the coin, you have a degree of belief. If you have a degree of belief, it obeys the axioms. If it obeys the axioms, it's a single value. Call it $P(\text{Heads})$.

  **Interval:** I have an opinion. My opinion is that the probability lies in the interval $[0.2, 0.8]$. The jar this came from had no label. The minting process is opaque. To pick 0.5 is to claim knowledge I don't have.

  **Sharp:** To pick 0.5 is to recognize symmetry. You have no evidence of bias, so you treat heads and tails symmetrically. That's the Principle of Indifference. But let's talk about your interval. You say you're willing to buy a bet on Heads for 20 cents and sell it for 80?

  **Interval:** I'm saying I'm willing to buy at 20. I'm not saying I'm willing to *sell* at 80. I'm not making a market. I'm stating a range of acceptable entry points.

  **Sharp:** That's a distinction without a difference. If your lower bound is 0.2 and your upper is 0.8, I can Dutch Book you. I buy from you at 0.21, I sell to you at 0.79. I've locked in a profit regardless of how the coin lands. You've made yourself a money pump.

  **Interval:** Only if you assume I *must* bet. The Dutch Book argument assumes I'm compelled to post a price for every gamble. I'm not. I can decline. My imprecision is a refusal to engage, not an incoherence in pricing. It's a feature, not a bug. It protects me from exactly the kind of exploitation you're proposing.

  **Sharp:** But life compels bets. Standing still is a bet that the status quo is preferable. If you can't distinguish between a coin you know is fair and a coin you know nothing about, you aren't modeling the world; you're modeling your own hesitation.

  **Interval:** I am modeling the world. Or at least, the relationship between the evidence and the world.

  **Sharp:** Which brings us to the ontology. Be honest: if we knew the exact physical composition of the jar, the exact trajectory of the throw, the interval would collapse to a point, right?

  **Interval:** Ideally, yes. But we aren't ideal agents.

  **Sharp:** I'm talking about ideal rationality. Even for an ideal agent with perfect information about the physical state?

  **Interval:** Maybe not even then. What if the jar was filled by a process that is itself indeterminate? What if "the probability" is not a hidden variable waiting to be discovered, but a relation that is genuinely vague? You assume every event has a true chance. I'm saying the evidence might only support a set of chances. The imprecision isn't in my head; it's in the support relation.

  **Sharp:** That sounds like mysticism. "Genuine vagueness." It's just ignorance. You're confusing the map with the territory. Your interval is a confession that you haven't done the work to find the number.

  **Interval:** It's a confession that the work *can't* be done. And here's the part that will really bother you: sometimes, learning *widens* the interval.

  **Sharp:** Excuse me?

  **Interval:** Dilation. Suppose I learn that the coin came from a sub-batch of the jar known for instability. Before I knew that, I might have guessed $[0.4, 0.6]$ based on the general average. Now that I know it's from the "wild" batch, my interval expands to $[0.1, 0.9]$. Information increased my uncertainty.

  **Sharp:** That's scandalous. Conditionalization should sharpen credences. If learning makes you less precise, your updating rule is broken. You're penalizing yourself for gathering data.

  **Interval:** I'm rewarding myself for honesty. If the new evidence tells me that the bias is volatile, precision is a lie. You'd rather I keep the narrow interval and be confidently wrong? I'd rather have the wide interval and be accurately unsure.

  **Sharp:** You're pushing the problem up a level. You have a set of probabilities. Fine. What is your credence in the set itself? Do you have a distribution over that interval?

  **Interval:** No. The set *is* the attitude.

  **Sharp:** Then how do you decide? The bookie is offering even money. 0.5 is inside your interval $[0.2, 0.8]$. It's also outside it. It's on the boundary of "good bet" and "bad bet" depending on which probability function in your representor you consult. Do you take it?

  **Interval:** I'm undecided.

  **Sharp:** "Undecided" is not a move. The bookie takes the coin or he doesn't.

  **Interval:** Then I don't take it. I invoke Maximin. I look at the worst-case probability in my set, which is 0.2. At even money, the expected utility is negative. I walk away.

  **Sharp:** So you have a decision rule after all. Maximin. But why Maximin? Why not E-admissibility? Take any option that is optimal for *some* probability in the set. Since 0.5 is in your set, and 0.5 makes this a fair bet, you could take it. Or since 0.6 is in your set, you could take it.

  **Interval:** E-admissibility leaves me with too many options. It says "Take it" and "Leave it" are both permissible. That doesn't help me act.

  **Sharp:** And Maximin says "Leave it." But you could have applied Maximin to the interval itself! You're treating the lower bound as if it's the *true* credence for the sake of action. You're collapsing the interval back into a point whenever you have to move. You're a precise Bayesian in disguise, you just hide the number until the last second.

  **Interval:** I'm not hiding it. I'm acknowledging that different decision contexts license different selections from the set. In high-stakes scenarios, I'm cautious. In low-stakes, I might pick the median. The flexibility is the point. You want a rigid algorithm that spits out an action. I want a representation of evidence that respects the limits of that evidence.

  **Sharp:** But you can't have it both ways. You claim the interval is the honest representation of rationality, but then you need a second-order rule to actually live your life. That rule—Maximin, or whatever tie-breaker you use—is precise. It has to be. So the precision is still there. You've just buried it in the decision theory instead of the epistemology.

  **Interval:** Maybe. Or maybe rationality isn't a machine that outputs actions. Maybe it's a constraint on what actions are permissible. I'm saying it is permissible for me to walk away. Is it permissible for you to bet?

  **Sharp:** Yes. Because my expected utility is zero, and I'm indifferent.

  **Interval:** You're not indifferent. You're pretending to be. You've assigned a precise value to something unknowable. If the coin lands tails, you'll have lost money on a bet that had no business being made. I haven't lost anything. I've preserved my agency.

  **Sharp:** You've preserved your ignorance. Look, if you walk away, you've effectively priced the bet at less than 0.5. You've made a choice. You've revealed a credence.

  **Interval:** I've revealed a threshold. Not a credence. There's a difference between "I believe it's unlikely" and "I'm not willing to risk capital on this level of ambiguity."

  **Sharp:** The bookie doesn't care about your thresholds. He cares about your wallet.

  **Interval:** Then he should care about my ambiguity. Because if he meets enough people like me, he can't clear the market. He can't find a price that clears. And that's a real fact about the world. Markets stall when uncertainty is too high. My interval models that stall. Your point probability models a market that never freezes. Which one looks more like reality to you?

  **Sharp:** *Pauses, looking at the coin.* Reality is what happens when you flip it. Heads or tails. One or zero. There is no interval on the table.

  **Interval:** The outcome is binary. The *expectation* isn't.

  **Sharp:** The expectation is a number.

  **Interval:** The expectation is a tool. Sometimes the tool is a hammer. Sometimes it's a cloud. You're trying to hammer a cloud.

  **Sharp:** And you're trying to build a house with a cloud.

  *The Bookie steps forward, pen hovering.*

  **Bookie:** Gentlemen? Take it, leave it, or name the odds.

  **Sharp:** I'll take it. Even money.

  **Interval:** I decline.

  **Sharp:** *To Interval:* You see? You made a decision.

  **Interval:** *To Sharp:* You see? You took a risk you couldn't quantify.

  *Sharp flips the coin. It spins, a blur of silver, catching the light.*
