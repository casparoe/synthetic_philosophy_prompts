answer: |-
  Here is the verdict.

  Your lab's workflow presupposes **Binary Epistemic Warrant justified by Neyman-Pearson Error Control.**

  It is not merely "confused" (though it is that too); it is a coherent, albeit philosophically costly, system. The practice only makes sense if you commit to the view that **scientific claims are currency that must be minted before they can be spent**, and the minting process is a **Neyman-Pearson decision procedure** that is subsequently interpreted as **Popperian corroboration.**

  Here is the reconstruction of why this is the only view that fits the machinery, where the smuggling happens, and how a Bayesian swap would break the machine.

  ### 1. The Reconstruction: Certificationism via Error-Statistics

  You asked what theory of evidence makes the workflow *make sense*. It cannot be pure Fisherian evidentialism, because Fisher rejected fixed thresholds and "accepting" the null. It cannot be pure Neyman-Pearson (NP), because NP is about *behavioral decisions* (act as if H1 is true) in the long run, not about the *truth of specific claims* in the short run.

  Your lab's practice—specifically the meta-analytic tallying where $p=.09$ is a "failure" and $p=.04$ is a "success"—presupposes **Certificationism**.

  **The Core Commitment:** A scientific claim (e.g., "Effect X exists") is not a graded proposition that becomes more probable with more data. It is a **binary status**. A study either *certifies* the claim or it does not.
  *   **The Mechanism:** The certification mechanism is **Neyman-Pearson Inductive Behavior**. The power analysis and $\alpha=.05$ threshold are there to control long-run false positive rates. This justifies the *rule*.
  *   **The Interpretation:** Once the rule is applied, the output is interpreted as **Popperian Corroboration**. A "significant" result means the theory survived a severe test (it is corroborated). A "non-significant" result means the theory failed the test (it is not corroborated).

  **Why this fits the $p=.09$ vs. $p=.04$ problem:**
  Under a gradualist evidential view (Fisher or Bayesian), $p=.09$ and $p=.04$ are nearby points on a continuum of evidence. Treating them as categorically different (Success vs. Failure) is irrational.
  However, under **Certificationism**, the specific $p$-value matters less than the **pass/fail status**. The $p=.09$ study is a "failed replication" not because the effect size was zero (you admitted it wasn't), but because the *study* failed to generate a certified fact. In the ledger of science, uncertified facts count as zero.

  **What is strictly presupposed vs. smuggled:**
  *   **Strictly Presupposed:** That the goal of the individual study is to produce a *decision* (Reject/Retain) that licenses *assertion*. Without this, the file drawer problem is not just wasteful, it is incoherent (why file a result that provides *some* evidence?).
  *   **Smuggled Commitment:** That **Statistical Null $\approx$ Theoretical Null.** Officially, you say "non-significance isn't no effect." But by logging $p=.09$ as a *failed replication*, you are acting as if the theory predicted a significant effect, and the data did not deliver. You are treating the statistical threshold as a proxy for the theoretical boundary. You are smuggling an **Ontological Dichotomy** (Effects are either Real or Noise) into an **Error-Statistic Framework** (which only promises to limit false alarms).

  ### 2. Rival Views Ruled Out

  This practice is incompatible with two major views of evidence:

  1.  **Gradualist Evidentialism (Likelihood/Bayesian):** If evidence is a continuous function of the data (e.g., a Likelihood Ratio), then a study with $p=.09$ and $d=0.4$ provides *more* evidence for H1 than a study with $p=.04$ and $d=0.1$ (depending on power/noise). Your practice rules this out by prioritizing the *threshold crossing* over the *weight of evidence*.
  2.  **Pure Error-Statistics (Mayo/NP):** Deborah Mayo's Error Statistics argues that we learn from data by probing errors. A non-significant result can still be informative (e.g., ruling out large effects). By treating $p=.09$ as a "null" to be filed away, your lab rejects the idea that non-significant results provide *warrant* for anything. You are treating the test as a **Gatekeeper**, not a **Probe**.

  ### 3. The Bayesian Counterfactual

  If you swapped this presupposed picture for a **Bayesian framework where the prior does real work**, the workflow would not just change; it would collapse.

  In your current NP/Certification model, the prior is effectively fixed at "Skepticism until Minted." The $p$-value does all the work.
  In a **Real Bayesian Workflow**:
  1.  **The Prior Matters:** A $p=.04$ finding on a wildly implausible hypothesis (low prior) yields a low posterior probability. A $p=.09$ finding on a well-established mechanism (high prior) could yield a high posterior probability favoring H1.
  2.  **The Tally Breaks:** You could no longer count "replications." You would have to update a **Posterior Distribution**. The $p=.09$ study would shift the distribution slightly right; the $p=.04$ study would shift it more. Neither is a "failure." The question changes from "Did it replicate?" (Binary) to "What is our current credence in the effect size?" (Continuous).
  3.  **The File Drawer Vanishes:** In a Bayesian update, *every* likelihood ratio is useful information. Filing away a $p=.09$ result would be epistemically destructive, as it biases the posterior. The "file drawer" is only rational under Certificationism (where uncertified data is worthless).

  **The Verdict on the Swap:** Adopting real Bayesianism would force you to abandon the concept of a "failed replication" entirely. You would instead have "studies that update the posterior less than expected." The pressure to publish "findings" would be replaced by a pressure to publish "updates."

  ### 4. Where My Reconstruction Might Be Wrong

  I am committing to the view that your lab operates on **Binary Epistemic Warrant**. Here is what would prove me wrong:

  **The "Flip" Condition:**
  If you described your meta-analyses differently.
  *   **Current Description:** "We tally how many findings have replicated." (Implies counting significant studies).
  *   **Flip Scenario:** If you said, "When we run a meta-analysis, we include *all* preregistered studies regardless of $p$, weight them by precision, and look at the aggregate effect size and CI. We only call it a 'failed replication' if the *meta-analytic* CI includes zero."

  If *that* were the practice, my verdict fails. That workflow presupposes **Gradualist Accumulation**, where individual studies are noisy measurements and the "truth" is in the aggregation. The dichotomy ($p=.09$ vs $p=.04$) would only matter for *individual papers*, not for the *theory evaluation*.

  However, based on your description ("logged as a failed replication... when we later run a meta-analysis or just tally"), it sounds like the **individual study's significance status** is what enters the tally. If the individual $p$-value determines the "score" of the theory, then **Certificationism** is the only game being played.

  ### Summary

  Your lab's practice presupposes that **Science is a Ledger of Certified Facts.**
  *   **Theory of Evidence:** Neyman-Pearson Decision Rules (for the mechanism) + Popperian Corroboration (for the meaning).
  *   **Ontology:** Binary (Effects are either Certified/Uncertified).
  *   **The Sin:** Treating Long-Run Error Control as a License for Short-Run Truth Claims.
  *   **The Fix:** You cannot fix this by "thinking in terms of effect sizes" while keeping the tally. You have to stop counting "successes" and start updating "credences." Until then, you are running a Certification machine that occasionally apologizes for being one.
