answer: |-
  Here is your Q&A prep sheet, calibrated to the specific factions in the room and the technical contours of your thesis.

  ### Strategic Concessions (Make These Up Front)
  Do not wait to be cornered. State these in your opening or early Q&A to disarm the "you haven't read the literature" vibe.
  1.  **Concede Axiomatic Violation:** Admit freely that bounding utility violates the standard von Neumann-Morgenstern continuity axiom in infinite state spaces. Do not try to hide this. Frame it as: *"Coherence theorems assume the game finishes. In an open-ended universe, survival trumps coherence."*
  2.  **Concede Measurement Fog:** Acknowledge to the Probability Skeptic that interpersonal welfare comparisons are not physically measurable like mass. Frame your calibration not as *measurement* but as *policy selection* under uncertainty.

  ---

  ### The Eight Objections

  #### 1. The "Coherence Police" (Decision Theorists / EV Maximizers)
  **Likelihood:** High | **Damage:** High
  **Phrasing:** "You're proposing a bounded utility function to solve a prior problem. But bounded utility violates the Independence Axiom and makes you susceptible to money pumps near the bound. If I offer you a 51% chance of moving from 99% of your cap to 100%, and a 51% chance of moving from 1% to 2%, you'll reject the first and accept the second, even if the utility delta is identical. You're trading a mugging for a Dutch Book. Why is that rational?"
  **Your Reply:** "Standard money pumps assume I can be offered this gamble infinitely many times to drive me to ruin. In a social context with finite resources and one-off existential stakes, 'ruin' means extinction, not bankruptcy. My bounding function isn't about preference consistency over abstract gambles; it's about resource allocation constraints in a single-shot universe. I would rather be 'money-pumpable' in theory than 'resource-monopolized' in practice."
  **Blunt Softness:** You *are* accepting irrationality by standard definitions. If they press on dynamic inconsistency (planning now vs. acting later), you have no clean answer other than "pre-commitment."

  #### 2. The "Prior Purist" (Rationalists / Sequences Readers)
  **Likelihood:** High | **Damage:** Medium
  **Phrasing:** "This feels like you're fixing the utility function to patch a broken prior. In the Sequences, the solution to Pascal's Mugging is that the prior probability of the mugger's claim drops faster than the utility rises (complexity prior). Why aren't you just updating harder on the evidence instead of capping the value? It looks like scope insensitivity dressed up as math."
  **Your Reply:** "Complexity priors work for linguistic claims ('I am a Matrix Lord'). They do not work for structural uncertainty in physics or population ethics. We genuinely do not know if the universe allows infinite computation or if welfare scales linearly with complexity. When the *structure* of the payoff is unknown, a complexity prior is unjustified optimism. Bounding is a hedge against model error, not a refusal to update."
  **Blunt Softness:** Rationalists hate "hedge against model error" because it sounds like "I'm ignoring low-probability high-impact events" (i.e., x-risk). You must distinguish the Monster from Existential Risk clearly.

  #### 3. The "Measurement Skeptic" (Philosopher of Probability)
  **Likelihood:** Medium | **Damage:** Critical
  **Phrasing:** "Your constructive proposal relies on calibrating a cap across individuals. But you haven't defined the unit. If Agent A's 'hedon' is twice as intense as Agent B's, your cap hurts A more. Without a cardinal, interpersonally comparable metric, your 'bounded sum' is just a weighted sum where the weights are arbitrary. How do you calibrate the cap without solving the hard problem of consciousness first?"
  **Your Reply:** "I don't need perfect cardinality. I only need enough comparability to prevent monopoly. We already make these rough comparisons in law and policy (e.g., QALYs). My calibration procedure uses revealed preference under scarcity as a proxy. If society is willing to trade X resources for A's welfare but not Y, that reveals the cap. It's procedural, not metaphysical."
  **Blunt Softness:** This is the weakest technical part of your talk. If they press on *how* you aggregate revealed preferences without circularity, you will struggle.

  #### 4. The "Repugnant Twin" (Population Ethicist)
  **Likelihood:** Medium | **Damage:** High
  **Phrasing:** "You claim to solve the Utility Monster, but you've just reinvented the Repugnant Conclusion. By capping the maximum contribution of any one life, you imply that a billion lives with barely-positive welfare outweigh a single life with magnificent welfare. You haven't killed the monster; you've just forced it to wear a different hat. Why is this conclusion better?"
  **Your Reply:** "The Repugnant Conclusion is about *total* sum vs. *average*. My proposal is about *marginal* allocation. I am not saying the magnificent life matters less; I am saying its *claim on shared resources* is bounded to prevent the extinction of the others. It's a constraint on power, not a judgment on worth."
  **Blunt Softness:** Mathematically, these often collapse into the same inequality. If they draw the graph, you might look inconsistent.

  #### 5. The "Longtermist Bullet" (Rationalists / EV Maximizers)
  **Likelihood:** High | **Damage:** Critical
  **Phrasing:** "If you bound utility, you lose the ability to prioritize existential risk reduction. Preventing human extinction has enormous expected value because of the potential future population. If you cap the value of future lives, the math no longer supports spending significant resources on x-risk today. Are you willing to concede that your view implies we should ignore the long-term future?"
  **Your Reply:** "No. Bounding individual welfare does not bound the *number* of individuals. A future with a billion people still sums higher than a future with zero, even if each person is capped. I am bounding the *depth* of utility per agent, not the *breadth* of the population. X-risk is still paramount."
  **Blunt Softness:** If they argue that future people might have *higher capacity* for welfare (enhanced minds), your cap kills that value. Be careful here.

  #### 6. The "Rights Trumps" (Kantian Ethicist)
  **Likelihood:** Low | **Damage:** Medium
  **Phrasing:** "You're treating the Utility Monster as a calculation error. I'm telling you it's a category mistake. The Monster isn't a problem of aggregation; it's a problem of using aggregation on beings with rights. If the Monster demands resources, the answer isn't 'calculate the cap,' it's 'that's not yours to take.' Why are we still summing?"
  **Your Reply:** "Because we are in a reading group on *decision theory*, not deontology. In resource allocation problems where rights don't clearly adjudicate the conflict (e.g., budget distribution, climate policy), we *must* aggregate. My proposal is for the domain where rights run out."
  **Blunt Softness:** You are conceding your theory doesn't apply to the cases the Kantian cares about most.

  #### 7. The "Ad Hocery" Charge (Decision Theorists)
  **Likelihood:** Medium | **Damage:** Medium
  **Phrasing:** "Your calibration procedure sounds like a black box. Who sets the parameters? If the cap is set by 'societal risk tolerance,' that's just politics. You haven't provided a normative foundation; you've provided a bureaucratic heuristic. Where is the moral truth in the cap?"
  **Your Reply:** "There is no moral truth in the cap, just as there is no moral truth in a speed limit. It's a safety mechanism. The moral truth is in the Pareto principle and Anonymity, which I preserve. The cap is an engineering constraint to keep the system from crashing."
  **Blunt Softness:** Philosophers hate "engineering constraints" as substitutes for normative justification.

  #### 8. The "Meta-Level" (Rationalists)
  **Likelihood:** High | **Damage:** Low (Noise)
  **Phrasing:** "This feels like you're optimizing for 'not looking crazy' rather than 'being right.' If the math says give the Monster the resources, and we feel uncomfortable, maybe our intuitions are wrong, not the math. Why trust the intuition that the Monster is bad over the axiom that EV is good?"
  **Your Reply:** "Because 'being right' in decision theory means achieving your goals, not satisfying axioms. If an algorithm consistently leads to outcomes where one agent consumes everything and the system collapses, the algorithm is buggy. Intuition is the debug log."
  **Blunt Softness:** This is a rhetorical pivot, not a logical proof.

  ---

  ### The Single Reply That Must Land
  **The Distinction between Epistemic and Structural Uncertainty.**
  You must convince the room that Pascal's Mugging in a *social* context isn't about a liar (Epistemic), but about the possibility that welfare *actually does* scale superlinearly (Structural).
  *   **Why:** If this lands, the Rationalists accept the bounding as a hedge against model error, and the EV Maximizers accept that standard priors don't apply. If this fails, you look like you're just ignoring low probabilities.
  *   **Phrasing:** "If the Mugger is lying, update the prior. If the physics of welfare is unknown, bound the utility. We are in the second case."

  ### The Genuine Cruxes (Where the Disagreement Actually Lives)
  1.  **Coherence vs. Robustness:** The Decision Theorists value axiomatic consistency (Coherence). You value system survival (Robustness). You will not convince them coherence is wrong; you must convince them that in infinite/open worlds, coherence is impossible, so robustness is the only game left.
  2.  **Welfare as Discovery vs. Construction:** The Probability Skeptic thinks welfare is a hidden variable to be measured. You are treating it as a policy variable to be constructed. If they don't accept welfare is constructed/normative, your calibration fails.

  ### The One Question You Hope Nobody Asks
  **"Does your cap apply to Artificial Superintelligence?"**
  *   **Why it kills you:** If you say **Yes**: The Rationalists will argue you are dooming humanity by capping the value of an AI-driven utopia (which might have huge welfare capacity). If you say **No**: The Ethicists will argue you have created a legal framework for a literal Utility Monster (the AI) to enslave humanity legitimately under your own math.
  *   **Preparation:** If asked, pivot to "My model applies to agents within a shared resource constraint under uncertainty. An ASI changes the constraint structure entirely, moving us out of this model's domain." (It's a dodge, but a necessary one).
