answer: |-
  Good evening. Looking around this room, I see the distance it took to get here. Some of you flew from Seoul. Some drove through Ohio. We bring different stories about what makes a life.

  In some stories, love is about freedom. It is the power to walk away. If you cannot leave, you are not free. If you are not free, it isn't love. It is just debt.

  In other stories, love is about belonging. You are not just an individual. You are your people. Marriage is not a new start; it is strengthening the structure that already holds us up. You are made of your relations.

  It is tempting to stand here and say both views are fine. But that is vague. And today is specific.

  So here is what is actually happening. My sister and her husband are doing something difficult. They are using their freedom to build an obligation.

  Right now, they stand here as individuals. They could say no. They could walk away. That matters. Without that chance, this moment means nothing. They are here because they want to be.

  But in an hour, they will make a promise that removes that chance. They are voluntarily binding their future. They are choosing to become part of a structure that will outlast them. They are choosing to be defined by this bond.

  This isn't a compromise. It is how choice becomes destiny.

  Freedom alone is lonely. It leaves you unattached. Belonging alone is heavy. It crushes the person underneath.

  But when you freely choose your belonging, it becomes light. When you voluntarily accept your duty, it becomes love.

  They are not just picking each other. They are building a home where choice turns into history. They are making a promise that tomorrow, they won't have to choose again. They will just be married.

  To the bride and groom: May you always remember the day you chose the tie that binds you. May you honor the freedom that brought you here, and the duty that keeps you here.

  Raise your glasses. To the choice that becomes a life.
