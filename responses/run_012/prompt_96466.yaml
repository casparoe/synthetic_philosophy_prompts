  # Where Do You Stand on Experience? A Decision Tree

  Answer honestly. There are no wrong answers yet.

  **1. The Coffee Tasters**
  Chase says his coffee tastes the same as always, but he stopped liking it. Sanborn says the coffee tastes totally different now, but he likes it just as much.
  *Question:* Is there a hidden fact about who is right about *how it feels*, independent of their judgments?
  *   **YES:** Go to 2.
  *   **NO:** Go to 3.

  **2. The Inverted Spectrum**
  Suppose we swap your neural wiring for red and green. You still call grass "green."
  *Question:* Is your inner experience of grass now what used to be your inner experience of blood?
  *   **YES:** Go to 4.
  *   **NO:** Go to 5.

  **3. The Wine Machine**
  A device sorts wines perfectly by chemical structure, just like a human sommelier.
  *Question:* Does the device experience the taste of the wine?
  *   **YES:** **Leaf A**
  *   **NO:** **Leaf B**

  **4. The Superspartan**
  Imagine a being who acts exactly like they are in pain (screams, withdraws) but feels nothing.
  *Question:* Is this being logically possible?
  *   **YES:** **Leaf C**
  *   **NO:** **Leaf D**

  **5. Neuron Replacement**
  We replace your brain neurons with synthetic chips one by one.
  *Question:* Does your consciousness fade gradually as chips are added?
  *   **YES:** **Leaf E**
  *   **NO:** **Leaf F**

  ***

  ### The Leaves (Positions & Awkward Commitments)

  *   **Leaf A (Functionalism):** Consciousness is just complex processing. *Awkwardness:* You must accept a sufficiently complex thermostat might feel something.
  *   **Leaf B (Biological Naturalism):** Only biological tissue feels. *Awkwardness:* You must identify exactly which molecule turns on the light.
  *   **Leaf C (Qualia Realism):** Feelings are intrinsic, private extras. *Awkwardness:* You must accept science can never fully explain why pain hurts.
  *   **Leaf D (Identity Theory):** Pain just is specific brain states. *Awkwardness:* You must accept aliens with different biology couldn't feel pain.
  *   **Leaf E (Substrate Dependence):** Consciousness needs specific stuff. *Awkwardness:* You must accept a single neuron swap could suddenly extinguish a soul.
  *   **Leaf F (Dennett/Eliminativism):** Consciousness is a user-illusion. *Awkwardness:* You must deny there is a "fact of the matter" about your own current feelings.

  ***

  ### Meta-Analysis for the Group

  **Unseparated Leaves:**
  **Leaf A and Leaf F** are difficult to distinguish here. Both deny intrinsic qualia, but F is more aggressive about eliminating the *term* itself, while A often keeps "phenomenal character" as a functional role.

  **Unoccupied Branches:**
  The path **Yes (Coffee) → No (Inverted)** is largely unoccupied. If you believe there is a fact about feeling independent of judgment (Coffee Yes), but deny that feelings swap with function (Inverted No), you claim feelings are real but functionally fixed. This is unattractive because it grants realism without the intrinsicness that usually motivates it.

  **Dennett's Target:**
  This tree separates the view Dennett wants to collapse from those keeping phenomenal character. **Leaf C** represents the traditional "Qualia" view (Intrinsic, Private, Ineffable, Incorrigible). Leaves **A, D, and F** keep some notion of experience but drop one or more of those four features (usually Incorrigibility or Privacy). Dennett argues that once you drop those features, you haven't saved qualia; you've just renamed information processing.
