answer: |-
  Consider a closed city-state that holds two concurrent convictions: that all citizens share an equal burden of defense, and that high office commands exemption from common toil. For centuries, the magistrates sit out the night watch, and the people accept this as the proper balance of these truths, counting magistrates fully among the citizenry while honoring their exception. Then comes a generation that keeps both convictions but inverts their hierarchy, deciding that equal burden must trump office exemption to preserve the meaning of citizenship itself. No new souls are added to the roll, no empirical facts about fatigue change, and the love for the city remains constant, yet the moral structure rectifies itself, eliminating a sanctioned contradiction without expanding the boundary of who counts, achieving a coherence that feels indistinguishable from progress.

  **Post-Mortem**

  What changed was the **lexical ordering** of competing principles within a fixed domain, not the domain itself. The single feature doing the work is **non-contradiction**: the later community refuses to hold two mutually undermining values (equal citizenship and exempt leadership) without resolving the tension, whereas the earlier community tolerated the inconsistency. If you pull that feature out, the case collapses into a boring widening story because you'd have to say the later community simply "cared more" about equality than the former.

  **Stress Test:** A group of foreign refugees is granted citizenship. The Era 1 community allows them to buy exemptions from the watch if they gain status; the Era 2 community forbids exemptions for anyone, regardless of status. They part ways. Does this mean Era 2 was a widening case in disguise? **No.** Era 2 didn't expand the circle of *who counts* (both count the refugees as citizens); it expanded the *reach of the rule* over those already counted. The circle's boundary is the same; the gravity within it is uniform rather than warped.

  **Brother's Counter:** He will argue that you **widened the circle of relevant properties**: by deciding "status" no longer negates "citizenship," you effectively removed a barrier that previously excluded magistrates from the full force of the equality principle. He claims this is widening along the axis of *qualification* rather than *entity*. **This is redescription dressed up as discovery.** He is conflating the *scope of the rule* (which stayed fixed on "citizens") with the *exceptions to the rule* (which were removed). Correcting a logical error in how a rule applies to its intended set is not expanding the set.
