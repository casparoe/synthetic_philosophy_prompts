  I'm a machine-learning engineer who works on ensembles and error-correcting codes — bagging, boosting, random forests, majority-vote decoders, correlated noise, the bias–variance–covariance decomposition of ensemble error. I have no background in political theory. Restate the Condorcet jury theorem and the debate over its use in justifying majority rule in the vocabulary I actually use: voters as noisy classifiers or redundant sensors, competence as a per-channel error rate, independence as uncorrelated noise, majority rule as a decoder, and the claim that the probability of a correct decision approaches certainty as the group grows as a vanishing error probability. Be as faithful as you can, including the cases where competence is heterogeneous and errors are correlated, not just the textbook case of identical independent voters. Then give me the residue report: which parts translate cleanly, which only with distortion, and which have no counterpart in my vocabulary at all — in particular, the distinction between juries deciding facts and elections deciding what to do, the possibility that there is no fact of the matter to be tracked, and the thought that the value of majority rule might not consist in its tracking anything. For each piece of residue, tell me whether it is a limitation of my framework or a sign that the original claim was less clear than it looked. I am especially interested in whether the independence assumption is doing substantive work or is a technical convenience, and in what happens to the theorem's normative appeal once it is translated into engineering terms.
