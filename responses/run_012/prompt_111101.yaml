answer: |-
  You are not wrong. In fact, your reading of that specific passage is sharper than the standard "intro to philosophy" summary usually allows.

  Most summaries flatten Euthyphro into a caricature of a Divine Command Theorist (DCT) right from line one. But as you've spotted, in the passage you quoted, Euthyphro is **not** arguing from divine command. He is arguing from an objective standard of justice ("whether the murdered man has been justly slain") that he assumes exists independently of anyone's opinion, divine or human.

  Here is what is actually happening in the text, what Euthyphro is committed to, and how the Dilemma fits into that specific tension.

  ### 1. What Euthyphro is committed to in that passage
  In the passage you cited, Euthyphro is committed to **Moral Realism**, not Divine Command.

  When he says, "The real question is whether the murdered man has been justly slain," he is treating justice as a fact of the matter, like a physical state of affairs. He believes there is a truth about the killing that can be known. Crucially, he believes the gods *know* this truth, not that they *create* it.

  For Euthyphro, the gods are **expert witnesses**, not legislators. He prosecutes his father because he is confident that the act was unjust, and he is confident that the gods agree with him because the gods are wise. He assumes a perfect alignment between "What is Just" and "What the Gods Love," so he doesn't feel the need to distinguish them yet. He slides between them because, in his mind, they are co-extensive.

  So, to answer your question: **Yes, he is appealing to a god-independent standard here.** He thinks he has knowledge (*episteme*) of the divine law, which reflects objective justice.

  ### 2. Is he contradicting himself?
  He is not formally contradicting himself *yet*, but he is holding two unexamined assumptions that Socrates will pull apart:
  1.  **Assumption A:** Justice is objective (as seen in your passage).
  2.  **Assumption B:** Piety is defined by the gods' attitude toward it (what they love).

  Euthyphro doesn't see the conflict because he assumes the gods are perfectly rational. He thinks, "The gods love it *because* it is just." He doesn't realize that if he defines piety *as* "what the gods love," he opens the door to the possibility that they could love something capricious.

  So, it's not that "pious" and "just" are totally different things for him. He explicitly agrees later that **all pious actions are just**. His view is that Piety is a *subset* of Justice. Piety is the part of justice that has to do with our service to the gods.

  The contradiction isn't in his moral intuition (which is realist); the contradiction is in his **definition**. When Socrates forces him to define piety, Euthyphro abandons the objective standard ("what is just") and grabs the theological indicator ("what the gods love"). Socrates' job is to show him that the indicator is not the essence.

  ### 3. Is the Dilemma aimed at him, or is it a later imposition?
  This is your most sophisticated question. You asked: *"Is the whole thing a later way of attacking a divine-command view that Euthyphro himself doesn't hold?"*

  The answer is nuanced: **The Dilemma is in the text and aimed at Euthyphro, but it traps him in a view he didn't realize he was articulating.**

  Euthyphro does not walk in thinking, "I am a Divine Command Theorist." He walks in thinking, "I know what the gods want." But when Socrates asks, "What is piety?", Euthyphro offers "What all the gods love."

  Once he offers that definition, he is logically committed to the Dilemma, regardless of his personal intuitions about justice.
  *   If he says the gods love pious things *because* they are pious, he admits piety exists independently of the gods (validating your reading of the opening passage).
  *   If he says things are pious *because* the gods love them, he abandons the objective justice he appealed to in the opening passage.

  The Dilemma isn't an anachronistic imposition; it is the logical explosion of Euthyphro's carelessness. He wants to have it both ways: he wants the objective weight of Justice (to justify prosecuting his father) and the authoritative weight of the Gods (to justify his confidence). Socrates uses the Dilemma to show he cannot have both *if* he defines piety as "god-loved."

  ### 4. What work is this doing in the argument?
  You asked if this commitment (to objective justice) does any work, or if he's just sounding confident.

  It does crucial work. It establishes **Euthyphro's irony**.
  Euthyphro claims to be an expert on divine matters. Yet, in your passage, he reasons like a secular moralist. He doesn't say, "Zeus told me this was wrong." He says, "It is unjust."

  This sets up the failure of the dialogue. Euthyphro claims to know the *essence* of piety, but every time he tries to define it, he either:
  1.  Gives examples (prosecuting wrongdoers).
  2.  Gives an attribute (god-loved).
  3.  Gives a transaction (service to the gods).

  He never identifies the *standard* itself. The opening passage shows he *believes* there is a standard ("justly slain"), but his definitions fail to capture it. The Dilemma is Socrates pointing out that Euthyphro's definition ("god-loved") describes how the gods *react* to piety, not what piety *is*.

  ### Summary
  *   **Are you wrong?** No. Your reading of that passage is correct. Euthyphro is appealing to an objective fact of justice, not a divine whim.
  *   **Is he contradicting himself?** He is inconsistent. He relies on objective justice to justify his action, but offers a theological definition when asked for a principle. He hasn't thought through the relationship between the two.
  *   **Is the Dilemma anachronistic?** No, but it targets the logical implications of his *definition*, not necessarily his personal theology. It forces him to choose between the objective justice he relies on in your passage and the definition he offers Socrates.

  The tragedy of the character Euthyphro is that he acts on the objective standard (justice) but claims authority from the subjective one (the gods' love). Socrates dismantles the authority to show him he doesn't actually understand the standard.
