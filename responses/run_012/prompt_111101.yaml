      *   *Is he contradicting himself?* In a way, yes, but it's an unexamined inconsistency, which is typical of Socrates' interlocutors. He hasn't thought through the metaphysics of his own claims.
      *   *The Piety/Justice Distinction:* Socrates asks: Is all pious just? Is all just pious? Euthyphro says all pious is just, but not all just is pious. Piety is a *part* of justice.
      *   *The Dilemma's Target:* The Dilemma targets the definition "Piety is what the gods love." It asks about the *relationship* between that quality (god-lovedness) and the essence of piety. It doesn't necessarily require Euthyphro to be a hardline DCT initially, but it forces him to confront the implications of his definition.

