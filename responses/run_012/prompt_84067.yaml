answer: |-
  Yes, this pattern has a name. In the philosophy of language and mind, it is called the **Rule-Following Paradox** (often distinguished as the **Skeptical Paradox of Meaning**).

  Your formulation is exceptionally precise, and your intuition that it is distinct from Induction, Translation, and Vagueness is correct. Those three are the most common misclassifications of this problem, which explains why you may have found the literature elusive if you were searching under those headings.

  Here is the precise carving of the concept, the distinctions you requested, and the boundary cases.

  ### 1. Name and Definition

  **Name:** The Rule-Following Paradox (Skeptical Variant).

  **Definition:**
  The Rule-Following Paradox is the logical gap between any finite set of facts about a speaker's history (including behavior, mental states, and dispositions) and the normative content of a rule or word. It asserts that for any finite history of usage, there are infinitely many incompatible rules that fit that history equally well. Consequently, there appears to be no fact of the matter that constitutes "meaning one thing rather than another" at any specific moment, threatening the very possibility of determinate meaning.

  **Core Mechanism:**
  The paradox relies on the distinction between *description* and *normativity*.
  *   **Description:** What you *did* (or what your machine *outputs*).
  *   **Normativity:** What you *ought* to do to remain faithful to the meaning.
  The paradox shows that descriptive facts (past usage, brain states, dispositions) cannot generate normative force (correctness conditions) without already presupposing the meaning they are trying to establish.

  ### 2. Distinctions from the Three Neighbors

  You correctly identified that this is not Induction, Translation, or Vagueness. Here is the point-by-point differentiation.

  **A. Versus The Problem of Induction**
  *   **Induction** is an *epistemic* problem. It asks: "Given the past, am I *justified* in predicting the future?" It assumes the meaning of the rule is fixed but questions our knowledge of how the world will behave.
  *   **Rule-Following** is a *metaphysical/semantic* problem. It asks: "What *constitutes* the meaning of the rule in the first place?" It questions whether there is a fact about the past that fixes the future application at all.
  *   **The Divide:** Induction worries that the world might change; Rule-Following worries that the *meaning* might never have been fixed. In your example, the student isn't predicting the world; they are trying to be faithful to *you*. Induction asks if they will be right; Rule-Following asks if there is a "right" to be had.

  **B. Versus The Indeterminacy of Translation**
  *   **Translation** is an *inter-linguistic* problem. It arises when mapping Language A onto Language B with insufficient evidence. It typically grants that within Language A, meaning is stable.
  *   **Rule-Following** is an *intra-linguistic* (or even intra-mental) problem. It arises between two speakers of the *same* language, or even within a single mind trying to follow its own rule.
  *   **The Divide:** Translation worries about mapping "Gavagai" to "Rabbit." Rule-Following worries about mapping "Add 2" to "Add 2." Your puzzle shows that shared language does not guarantee shared meaning, which is a stronger skepticism than translation indeterminacy.

  **C. Versus Vagueness**
  *   **Vagueness** concerns *borderline cases* where a concept lacks a sharp boundary (e.g., "Is this a heap?"). It admits that for clear cases, the rule holds.
  *   **Rule-Following** concerns *precise cases* where the rule should be decisive (e.g., mathematics, logic). It argues that even in perfectly decidable cases, the link between the rule and the decision is not fixed by facts.
  *   **The Divide:** Vagueness says the rule runs out. Rule-Following says the rule was never there to begin with. In your sequence example, 100 + 2 is not a borderline case; it is a precise case. The worry is not that the rule is fuzzy, but that it is multiply interpretable.

  ### 3. The Machine and Disposition Objection

  You raised a critical wrinkle: *If meaning were just disposition, the machine's meaning would be settled, but then errors would be impossible.*

  This is the **Normativity Objection** to Dispositionalism, and it is the sharpest edge of the paradox.
  *   **The Dispositional Claim:** To mean "add 2" is simply to be disposed to answer "4" when asked "2+2".
  *   **The Refutation:** Dispositions are descriptive facts about what *will* happen. Meaning is normative; it dictates what *should* happen. If a machine is disposed to output "5" for "2+2", the dispositionalist must say the machine *meant* "quus" (a function that matches "plus" until it diverges). But we want to say the machine *erred*.
  *   **Why this sharpens the puzzle:** If you cannot distinguish between "following a rule" and "merely acting in accordance with a rule," you cannot account for error. A stone falling follows the laws of physics, but it does not *follow a rule*. The paradox shows that human rule-following looks suspiciously like stone-falling unless there is a fact about meaning that transcends physical disposition. Since no such fact seems inspectable, the paradox holds.

  ### 4. Boundary Cases: Instances vs. Resemblances

  To ensure the carving is clean, here is what counts as an instance of the Rule-Following Paradox and what merely resembles it.

  **Positive Instances (The Paradox Applies)**
  1.  **The Mathematical Sequence:** Your "add 2" example. Any case where a finite series of correct applications is compatible with a divergent infinite function (e.g., "plus" vs. "quus").
  2.  **The Private Diarist:** A person trying to keep a diary of a private sensation (e.g., "S"). They write "S" today. Tomorrow they feel something and write "S" again. There is no independent check to see if "S" means the same thing today as yesterday. The past usage does not fix the current application.
  3.  **The Algorithmic Implementation:** A computer program specified to "sort lists." On all tested lists, it works. On a specific, untested large list, it crashes or sorts differently due to an integer overflow. Did it mean "sort" or "sort-until-overflow"? The code (the rule) is finite; the interpretation of the code on the hardware allows the divergence.

  **Negative Instances (Merely Resemble the Paradox)**
  1.  **Simple Ambiguity:** The word "bank" means river-edge or financial institution. This is not the paradox. This is a case of two distinct, established rules sharing a sound. The Rule-Following Paradox applies even when the word is *not* ambiguous in standard usage (like "2").
  2.  **Memory Failure:** A student forgets the rule. This is not the paradox. The paradox assumes the student remembers everything perfectly and acts consistently with *a* rule, just not *your* rule. Memory failure is a psychological glitch; Rule-Following is a logical gap.
  3.  **Habitual Action without Normativity:** A dog sits when you say "Sit." If the dog stands next time, it hasn't violated a rule; it has just broken a habit. The paradox only applies where there is a claim to *correctness*. If there is no standard of "ought," there is no paradox.
  4.  **Empirical Discovery:** You teach "heavy" by showing rocks. Later we discover a gas that is heavy. This is not the paradox. This is concept refinement based on new empirical data. The paradox applies where the new case is logically determined by the old rule (like math), not empirically discovered.

  ### Summary

  The puzzle you have isolated is the **Rule-Following Paradox**. It is distinct from Induction (which concerns prediction), Translation (which concerns mapping), and Vagueness (which concerns boundaries). It rests on the inability of descriptive facts (history, disposition, physical state) to ground normative facts (meaning, correctness). Your machine example correctly identifies that dispositional accounts fail because they cannot distinguish between *performance* and *competence*, or between *acting in accord with a rule* and *following a rule*.

  The paradox remains unresolved in the sense that there is no consensus on what fact *does* fix meaning. Some argue meaning is a social practice (agreement within a community); others argue it is a primitive, unanalyzable fact; others accept the skepticism and argue meaning is an illusion. But the structure of the problem you described is exactly this: the gap between the finite and the normative.
