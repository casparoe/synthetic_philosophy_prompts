answer: |-
  # Specification of Adequacy for St. Petersburg Resolutions

  This specification defines the criteria by which a proposed resolution to the St. Petersburg paradox is to be judged. A resolution is adequate only if it explicitly addresses each requirement below. Requirements are marked as **Non-Negotiable** (logical or mathematical consistency conditions) or **Camp Commitment** (philosophical stances that must be declared if adopted).

  ### 1. The Diagnostic Requirement
  *   **Motivation:** Case 1 (Base Game). The naive argument proceeds: (a) Rational value = Expected Value; (b) EV = $\sum (2^n \cdot 2^{-n}) = \infty$; (c) Therefore, rational price = $\infty$.
  *   **Requirement:** The resolution must identify exactly which premise (a, b, or c) is rejected. If (a) is rejected, it must propose an alternative decision rule. If (b) is rejected, it must show the mathematical error. If (c) is rejected, it must explain why infinite EV does not imply infinite price.
  *   **Status:** **Non-Negotiable**. A resolution that does not locate the failure point is merely an assertion.

  ### 2. The Discontinuity Justification Requirement
  *   **Motivation:** Case 2 (Biased Coin). At $p=0.5$, EV is $\infty$. At $p=0.51$, EV is 51. At $p=0.5001$, EV is 5001.
  *   **Requirement:** If the resolution assigns a finite price to the base game ($p=0.5$), it must explain why the valuation function $V(p)$ is discontinuous at $p=0.5$, or why $p=0.5$ is qualitatively distinct from $p=0.5 + \epsilon$. A resolution cannot treat "infinite expectation" as the sole disqualifier without explaining why an expectation of 5,000,000 (at $p \approx 0.5$) is treated differently from $\infty$ if the decision rule relies on magnitude thresholds.
  *   **Status:** **Non-Negotiable**. Failure to address this implies the resolution cannot distinguish between divergent series and convergent series with large sums.

  ### 3. The Limit Convergence Requirement
  *   **Motivation:** Case 3 (Capped Game). A game capped at $N$ has EV $= N+1$. As $N \to \infty$, the capped game approaches the base game.
  *   **Requirement:** The valuation $V_N$ of the capped game must converge to the valuation $V_{\infty}$ of the base game as $N \to \infty$, *unless* the resolution explicitly argues that the limit operation is invalid for decision theory. If the resolution claims the base game has a finite value (e.g., \$20), it must explain why $V_N$ (which grows with $N$) does not force $V_{\infty}$ to be infinite.
  *   **Status:** **Non-Negotiable**. A resolution that yields different results for the limit of the sequence versus the limit game commits a mathematical inconsistency.

  ### 4. The Dominance Preservation Requirement
  *   **Motivation:** Case 4 (Two Tickets). Ticket A + Ticket B dominates Ticket A in every outcome.
  *   **Requirement:** If Gamble $X$ strictly dominates Gamble $Y$ (payout of $X \ge$ payout of $Y$ in all states, $>$ in some), the resolution must assign $Value(X) > Value(Y)$. If the resolution violates this, it must explicitly reject the Dominance Principle for infinite expectation spaces and justify the cost of that rejection.
  *   **Status:** **Non-Negotiable**. Violating dominance without admission renders the decision rule incoherent for choice scenarios.

  ### 5. The Zero-Sum Consistency Requirement
  *   **Motivation:** Case 5 (Seller's Side). The buyer's gain is the seller's loss.
  *   **Requirement:** The resolution must yield a single fair price $P$ such that a rational agent is indifferent between buying at $P$, selling at $P$, or not playing. If the resolution proposes a buying price $P_b$ and a selling price $P_s$ where $P_b \neq P_s$, it must specify the asymmetry (e.g., wealth effects, risk aversion differences) causing the spread. In the absence of specified asymmetry, $P_b$ must equal $P_s$.
  *   **Status:** **Non-Negotiable**. Divergent buy/sell prices without causal explanation imply a Dutch Book vulnerability.

  ### 6. The Ergodic Alignment Requirement
  *   **Motivation:** Case 6 (Indefinite Repetition). Long-run average payout diverges, but growth is slow and volatile.
  *   **Requirement:** The resolution must state whether the single-play price should align with the long-run time-average growth rate or the ensemble expectation. If it aligns with the time-average (which may be finite), it must justify why single-play rationality is governed by repeated-play statistics. If it aligns with ensemble expectation, it must explain why the single play is worth infinite price despite finite typical outcomes.
  *   **Status:** **Camp Commitment**. (Expected Utility camp chooses ensemble; Ergodic/Economic Growth camp chooses time-average).

  ### 7. The Idealization Transparency Requirement
  *   **Motivation:** General (Idealizations). The game assumes infinite bankrolls, infinite time, and unbounded payouts.
  *   **Requirement:** The resolution must state whether the paradox persists if all physical constraints (maximum money, maximum time, maximum utility) are enforced. If the paradox dissolves under physical constraints, the resolution must classify the paradox as a mathematical artifact rather than a decision-theoretic problem.
  *   **Status:** **Non-Negotiable**. Ambiguity here conflates physical impossibility with normative irrationality.

  ### 8. The Normative Clarity Requirement
  *   **Motivation:** General (Descriptive vs. Normative).
  *   **Requirement:** The resolution must distinguish between what agents *actually* pay (descriptive) and what they *should* pay (normative). A resolution cannot cite empirical refusal to pay high prices as proof that high prices are irrational without an independent normative argument.
  *   **Status:** **Non-Negotiable**. Conflating "is" and "ought" invalidates the normative force of the resolution.

  ---

  ### Inconsistencies and Trade-Offs

  **The Trilemma of Infinite Gambling:**
  No resolution can jointly satisfy the following three conditions:
  1.  **Linearity:** Value is the sum of probability-weighted utilities (Standard Expected Utility).
  2.  **Dominance:** If $X$ dominates $Y$, $Value(X) > Value(Y)$ (Requirement 4).
  3.  **Finite Valuation:** The base St. Petersburg game has a finite fair price (Common intuition).

  *Proof Sketch:* If Linearity holds, the value is the Expectation. The Expectation is Infinite. If Value is Infinite, it is not Finite (violating 3). If one forces Finite Valuation by modifying Linearity (e.g., non-linear probability weighting), one typically violates Dominance in infinite spaces (violating 2). If one keeps Linearity and Dominance, one must accept Infinite Valuation.

  **Resolution:** A candidate must explicitly sacrifice one leg of this trilemma. A resolution claiming to satisfy all three is logically inconsistent.

  **The Continuity vs. Finite Price Conflict:**
  Satisfying **Requirement 2 (Discontinuity Justification)** and **Requirement 3 (Limit Convergence)** simultaneously is highly restrictive. If $V_N$ (capped value) grows with $N$ (Requirement 3), the limit is $\infty$. To maintain a Finite Price (Requirement 2 intuition), the resolution must assert that $V_{\infty} \neq \lim V_N$. This requires rejecting the continuity of the valuation functional.

  ---

  ### The Single Most Eliminating Requirement

  **Requirement 4 (Dominance Preservation)** eliminates the most candidate resolutions.

  Many proposed resolutions (particularly those involving probability weighting, rank-dependent utility, or specific utility bounds) successfully generate a finite price for the base game but fail when comparing two St. Petersburg variants. For example, if a resolution values the base game at \$20 due to "negligible probabilities," it often values the "Two Tickets" game at less than \$40, or fails to rank it strictly higher, because the weighting function compresses the tail probabilities where the dominance difference lies. Resolutions that preserve Dominance usually force the price back toward infinity or require complex, non-standard axioms.

  ---

  ### Evaluation of Four Views Against Non-Negotiables

  **Concave Utility (Bernoulli):**
  Satisfies Diagnostic (rejects linearity of money), Limit Convergence (value grows with cap), and Zero-Sum. It fails Dominance in specific infinite variants if the utility function is bounded (a bounded utility function can value a dominant gamble equally if the extra payout occurs only in states of zero marginal utility). It satisfies Discontinuity Justification by transforming the divergent monetary series into a convergent utility series, distinguishing $p=0.5$ (convergent utility sum) from $p=0.5$ monetary (divergent).

  **Probability Weighting:**
  Satisfies Diagnostic and Finite Valuation. It typically fails Dominance Preservation (Requirement 4) because non-linear weighting of cumulative probabilities can reverse preferences between dominated gambles in infinite outcome spaces. It struggles with Limit Convergence if the weighting function does not scale appropriately with $N$.

  **Unrealizability (The Game Cannot Exist):**
  Satisfies Diagnostic (rejects premise that the game is a valid option) and Idealization Transparency. It fails Limit Convergence because it treats the limit game as categorically different from the sequence of capped games (ontological break rather than mathematical limit). It risks failing Normative Clarity by substituting a physical constraint for a decision-theoretic principle.

  **Infinite Price (The Naive Argument is Correct):**
  Satisfies Dominance, Limit Convergence, Zero-Sum, and Discontinuity Justification (mathematically consistent). It fails Normative Clarity only insofar as it contradicts strong intuition, but it satisfies all logical non-negotiables. It is the only view that preserves standard Expected Utility axioms without modification, at the cost of declaring common human behavior irrational.
