answer: |-
  Maya is right that evidence logically fails to uniquely select a theory, but Devin is right that permanent underdetermination is unproven and theoretical virtues serve epistemic rather than purely aesthetic functions.

  Maya wins on the logical front because she correctly identifies the Quine-Duhem thesis: any finite set of data can be fitted by multiple mathematical models, and adding auxiliary hypotheses can always save a theory from falsification. Her historical argument, known as the Pessimistic Meta-Induction, is also philosophically robust; since past successful theories (ether, phlogiston) turned out to be false regarding their unobservable entities, we have inductive grounds to suspect current theories might too. However, she oversteps by conflating logical possibility with scientific plausibility. Just because you *can* construct a rival theory that fits all data doesn't mean such a theory will be coherent, explanatory, or discoverable. She also dismisses theoretical virtues too quickly; while simplicity and unification are not empirical evidence, they are not merely "taste" either, as they correlate with a theory's robustness and resistance to ad hoc modification.

  Devin wins on the practical and historical front because he correctly distinguishes between transient underdetermination (resolved by new data, like Copernicus vs. Ptolemy) and permanent underdetermination (never resolved). There is no confirmed case in the history of science where two genuinely distinct, non-ad hoc theories remained empirically equivalent forever; usually, one becomes more fruitful or predicts novel phenomena the other cannot. His critique of "cheat" theories is valid: artificially bolting on correction terms to save a theory destroys its explanatory power, making it a inferior hypothesis even if it fits the data. However, Devin weakens his position by assuming theoretical virtues guarantee truth. The "No Miracles" argument (that success implies truth) is compelling but not deductive; it is possible for a false theory to be useful, which Maya correctly points out.

  Regarding their final clash over "aims vs. facts," Devin is making a sophisticated verificationist point that Maya misinterprets as a concession. When Devin says a disagreement between empirically equivalent theories is about "aims," he means that if no observation can ever distinguish them, the difference is metaphysical rather than scientific, so choosing one is about utility (aims) rather than truth-tracking (facts). Maya thinks this admits the choice is arbitrary, but Devin is arguing it is rational based on pragmatic goals rather than evidential coercion. They are talking past each other: Maya is defending anti-realism (science doesn't find truth), while Devin is defending a nuanced realism (science finds truth where evidence allows, and pragmatism where it doesn't).

  Both miss the middle ground offered by Structural Realism and Bayesianism. Structural Realism suggests that while the specific entities of past theories (phlogiston) were wrong, the mathematical structures often survived into new theories, resolving Maya's historical worry without requiring full truth. Bayesianism resolves the "virtues as taste" dispute by modeling virtues as prior probabilities; what Maya calls "taste" are rational prior commitments that get updated by evidence, explaining why scientists agree on virtues without needing them to be empirical facts. Ultimately, Maya correctly diagnoses the logical gap between data and theory, but Devin correctly observes that science bridges this gap successfully enough to treat the bridge as real.
