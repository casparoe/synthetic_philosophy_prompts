prompt: |-
  I am the deputy chief economist at a national communications regulator, and I need a decision procedure for my analysts. Casework reaches us monthly in which a firm, an industry body, or one of our own teams asks us to draw a welfare conclusion from data about what consumers chose: take-up of plans, churn after a price change, retention in a default, clicks on a cancellation page. The argument from the firms is invariably of the form: consumers chose it, therefore they wanted it, therefore it is good for them. Our own staff make the mirror-image argument when they claim that a firm's design has distorted choice and that consumers are therefore worse off. Both inferences are drawn far too quickly, and I want a procedure that slows them down without giving us licence to refuse to decide.

  Draft that procedure. It must be runnable by a junior analyst with a master's degree in economics and no training in decision theory, within two weeks per case, on observational data, with no prospect of running experiments; it must withstand challenge from firms' counsel; and the chief economist will sign off on every case. I want the questions in order, what counts as a sufficient answer to each, the point at which the procedure stops with a no, and the point at which it hands the matter to a person because the remaining question is about values rather than facts.

  The substance should come from what is actually known about inferring preference and welfare from choice, and the procedure should carry that knowledge rather than gesture at it. Build it around the following difficulties, and say what each one costs us operationally.

  First, choices reveal only comparisons between options that appeared together on a menu we observed; what we recover is therefore at best a partial ranking, and every way of completing that ranking is equally consistent with the data, so we can rank the trade-offs we have actually seen and nothing else.

  Second, a ranking recovered from choice is unique only up to any increasing transformation: the data fix order and never magnitude, so a conclusion of the form A gained more than B lost requires something the data cannot supply.

  Third, the tests our data can fail are far narrower than they appear. A cycle in revealed preference is close to the only thing that genuinely refutes a stable-preference model, and even a cycle can be redescribed as preference change, learning, or menu dependence; conversely, a clean pass is equally consistent with inattention, habit, and successful manipulation of the choice architecture. Consistency, in other words, is not evidence that we have found the consumer's preference.

  Fourth, choice and welfare come apart whenever the choice reflects commitment, deference, framing, or error, so that chosen is evidence of preferred only under assumptions we must state and cannot test.

  Fifth, where prices as well as quantities are observed, the standard machinery yields bounds on a welfare change rather than a point estimate, and those bounds are frequently wide enough to reverse a decision; where the good is not traded at all, there is no revealed preference, only extrapolation.

  Sixth, someone has to select the normative standard — present choices, the choices a person would make if informed and attentive, or a judgment made on the person's behalf — and no quantity of data selects among these.

  I want two further elements built in. Every conclusion the procedure licenses should carry a licensing level, defined so that it cannot be inflated in the writing: at a minimum, no welfare claim supported; ordinal ranking of the options actually offered, for this population, under these conditions; and cardinal or interpersonal comparison — with a statement, for each level, of the evidence that would be needed to move up one. And the procedure must handle defaults and other settings in which the alternative to choosing is not choosing, and must say plainly what staying put does and does not reveal.

  Then apply it to three cases. (1) A mobile operator raises prices by fifteen per cent; churn is under two per cent; the firm argues that consumers are unharmed. (2) An occupational pension scheme has ninety per cent of members in the default fund, and a proposal to change the default is defended on the ground that members' continued enrolment shows they prefer it. (3) A platform removes two confirmation screens from its cancellation flow, cancellations rise by a third, and the firm argues that the friction it removed was welfare-improving because it kept people in plans they preferred. At least one of your three answers should be one my office will not welcome, and you should identify which parts of the procedure misfire on which case, and where an analyst who follows it faithfully reaches a conclusion that is defensible and wrong.

  Finally, state what the procedure cannot do. I am not asking for a reading list or for citations; I am asking for something my analysts can run, and for an honest account of the boundary at which it ceases to be a procedure and becomes a judgment I have to own.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **Role:** Deputy Chief Economist at a national communications regulator.
      *   **Task:** Draft a decision procedure for analysts to infer welfare from consumer choice data.
      *   **Constraints:**
          *   Runnable by a junior analyst (Master's in Econ, no decision theory training).
          *   Time limit: 2 weeks per case.
          *   Data: Observational only (no experiments).
          *   Robustness: Must withstand legal challenge from firms' counsel.
          *   Sign-off: Chief Economist signs every case.
          *   Structure: Ordered questions, sufficiency criteria, stop points (No), hand-off points (Values).
          *   Content: Must address six specific theoretical difficulties (Partial ranking, Ordinality, Consistency limits, Choice/Welfare gap, Price/Quantity bounds, Normative standard).
          *   Add-ons: Licensing levels (No claim, Ordinal, Cardinal/Interpersonal), handling defaults/non-choice.
          *   Application: Apply to three specific cases (Mobile price hike, Pension default, Cancellation friction). One answer must be unwelcome. Identify procedure misfires.
          *   Limitations: State what the procedure *cannot* do.
      *   **Tone:** Professional, rigorous, operational, honest about limitations. No reading lists/citations, just actionable steps.

  2.  **Deconstruct the Six Difficulties & Integrate into Procedure:**

      *   *Difficulty 1 (Partial Ranking):* We only see what was on the menu. *Procedure Step:* Define the "Observed Choice Set."
      *   *Difficulty 2 (Ordinality):* Data gives order, not magnitude. *Procedure Step:* Restrict claims to ordinal unless structural assumptions are added (Licensing Level).
      *   *Difficulty 3 (Consistency Limits):* Cycles refute, but consistency doesn't prove rationality. *Procedure Step:* Test for stability, but acknowledge alternative explanations (inattention, habit).
      *   *Difficulty 4 (Choice/Welfare Gap):* Error, framing, etc. *Procedure Step:* Assess "Decision Quality" (information, friction, complexity).
      *   *Difficulty 5 (Price/Quantity Bounds):* Bounds can be wide. *Procedure Step:* Calculate Compensating Variation bounds if prices exist; acknowledge extrapolation if not.
      *   *Difficulty 6 (Normative Standard):* Data doesn't pick the standard. *Procedure Step:* Explicitly select the welfare standard (Procedural vs. Outcome-based) -> Hand-off to Chief Economist.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Structure:* Needs to be a flowchart in text form. Step 1, Step 2, etc.
      *   *Licensing Levels:* Need to define Level 1 (No Claim), Level 2 (Ordinal), Level 3 (Cardinal/Interpersonal).
      *   *Defaults:* Need specific logic for "non-choice."
      *   *Time Limit:* Steps must be feasible in 2 weeks. No complex structural estimation that takes months. Focus on bounds and robustness checks.

      *   *Drafting Step 1 (The Menu):* Address Difficulty 1. What was available?
      *   *Drafting Step 2 (Stability):* Address Difficulty 3. Is choice consistent?
      *   *Drafting Step 3 (Decision Quality):* Address Difficulty 4. Was the choice environment distorted?
      *   *Drafting Step 4 (Welfare Metric):* Address Difficulty 2 & 5. Can we measure magnitude?
      *   *Drafting Step 5 (Normative Standard):* Address Difficulty 6. Whose welfare counts?

      *   *Refining the "Stop" and "Hand-off":*
          *   Stop (No): If data is insufficient to even rank observed options.
          *   Hand-off (Values): When moving from "what was chosen" to "what *should* have been chosen" (Paternalism).

      *   *Refining Licensing Levels:*
          *   Level 0: Data insufficient.
          *   Level 1: Ordinal ranking of observed options (Status Quo vs. Change).
          *   Level 2: Cardinal welfare (requires price data + strong assumptions).
          *   *Correction:* The prompt asks for "No welfare claim," "Ordinal ranking," "Cardinal/Interpersonal." Let's stick to that.

  4.  **Developing the Three Cases:**

      *   *Case 1 (Mobile Price Hike):* Low churn. Firm says "revealed preference."
          *   *Analysis:* Low churn $\neq$ satisfaction. Could be switching costs, inattention, or lack of alternatives.
          *   *Procedure Output:* Likely Level 1 (Ordinal) at best, but probably "No welfare claim" regarding harm because we don't know the counterfactual (would they have left if switching costs were zero?).
          *   *Unwelcome Answer:* Regulator might want to find harm, but procedure says "inconclusive." OR, Regulator wants to protect consumers, procedure says "can't prove harm." Let's make the unwelcome answer that we *cannot* confirm harm despite high prices, because low churn is consistent with high switching costs, not necessarily high welfare.
      *   *Case 2 (Pension Default):* 90% in default.
          *   *Analysis:* Default effect is strong. Inertia $\neq$ Preference.
          *   *Procedure Output:* Level 0 (No welfare claim) regarding preference for the fund. Level 1 regarding the *process* (default drives outcome).
      *   *Case 3 (Cancellation Friction):* Friction removed, cancellations up.
          *   *Analysis:* Firm says friction was "helpful commitment." Analyst might say friction was "sludge."
          *   *Procedure Output:* This is the values hand-off. Did the friction correct an error or create one?
          *   *Unwelcome Answer:* The procedure forces a hand-off to the Chief Economist because data cannot distinguish between "regretted cancellation prevented" and "desired cancellation blocked." This is unwelcome because the office wants a definitive economic answer, but the procedure admits economics can't give one here.

  5.  **Refining the "Misfire" and "Defensible but Wrong" Section:**

      *   Need to identify where the procedure is too conservative or where it relies on assumptions that might be false in reality.
      *   *Example:* In Case 1, assuming switching costs are the only barrier might miss genuine loyalty.
      *   *Example:* In Case 3, the procedure correctly identifies the value judgment, but the *decision* still has to be made. The "wrong" part is if the Chief Economist guesses wrong on the value judgment.

  6.  **Final Review against Constraints:**

      *   *Junior Analyst:* Is the language clear? Avoid heavy math, focus on logic checks.
      *   *2 Weeks:* Are the data requirements realistic? Yes, mostly descriptive stats and basic elasticity/bounds.
      *   *Legal Challenge:* Does it explicitly state assumptions? Yes, that's the core of the procedure.
      *   *Six Difficulties:* Are they all embedded?
          1.  Partial Ranking -> Step 1 (Choice Set).
          2.  Ordinality -> Licensing Levels.
          3.  Consistency -> Step 2 (Stability).
          4.  Choice/Welfare Gap -> Step 3 (Decision Quality).
          5.  Price/Quantity -> Step 4 (Bounds).
          6.  Normative Standard -> Step 5 (Hand-off).
      *   *Defaults:* Addressed in Step 3/4.
      *   *Limitations:* Final section.

  7.  **Writing the Document:** (Self-Correction during drafting)
      *   *Tone Check:* Ensure it sounds like an internal regulatory manual, not an academic paper. Use imperative verbs.
      *   *Licensing:* Make sure the levels are distinct.
      *   *Case Studies:* Ensure the "unwelcome" one is clearly identified. I will make Case 1 the unwelcome one (Regulator wants to act, Procedure says "Insufficient Evidence of Harm"). Actually, Case 3 is better for "Defensible and Wrong" because it highlights the value judgment limit. Let's make Case 1 the one where the firm wins (unwelcome to regulator staff) and Case 3 the one where the procedure admits it can't decide (unwelcome to everyone who wants certainty).
      *   *Wait, re-reading prompt:* "At least one of your three answers should be one my office will not welcome." Usually, a regulator office wants to find harm to justify intervention. If the procedure says "No harm proven," that is unwelcome. I will make Case 1 result in "No welfare claim supported" despite the price hike, because low churn is ambiguous. This frustrates the consumer protection mandate.

      *   *Refining the "Defensible and Wrong":* This needs to be specific. Where does the logic hold but the conclusion fail? In Case 3, the procedure correctly identifies a value judgment is needed. If the Chief Economist makes the *wrong* value judgment (e.g., assumes people always know best), the procedure was followed, but the outcome is "wrong" in a societal sense.

      *   *Operational Costs:* I need to explicitly state what each difficulty costs operationally (time, data, uncertainty).

  8.  **Final Polish:** Check the "Hand-off" point. It must be clear that the Chief Economist owns the normative standard.

  *(Self-Correction on Case 1)*: If churn is low after a price hike, standard econ says demand is inelastic. Firm says "they value it." Regulator says "they are locked in." The procedure must distinguish these. If switching costs are high, welfare is ambiguous. The procedure should conclude "Cannot distinguish lock-in from preference." This is unwelcome because it prevents enforcement.

  *(Self-Correction on Case 3)*: Firm says friction helped commitment. Data shows friction suppressed cancellation. Procedure: Data shows friction affects choice. Welfare? Unknown. Hand-off.

  *(Self-Correction on Case 2)*: Defaults. Procedure: Inertia is not preference. No welfare claim on the fund quality.

  Okay, ready to draft. I will structure it as a formal "Operational Directive."

