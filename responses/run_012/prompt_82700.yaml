  *Check:* Did I include the "Stop" and "Hand-off"? Yes, Step 5 is the hand-off. Step 1 or 2 can be a Stop.

  Let's write.
answer: |-
  **OPERATIONAL DIRECTIVE: EC-2024-01**
  **TO:** Economic Analysis Division
  **FROM:** Deputy Chief Economist
  **SUBJECT:** Procedure for Inferring Welfare from Observational Choice Data
  **EFFECTIVE:** Immediately

  ### 1. PURPOSE AND SCOPE
  This procedure governs all casework where analysts must infer consumer welfare from observational data on choices (take-up, churn, retention, clicks). Its purpose is to prevent unwarranted leaps from "chosen" to "preferred" to "welfare-enhancing."

  You have two weeks per case. You have observational data only. You must produce a conclusion that withstands cross-examination. If the data cannot support a conclusion, you must state that. If the conclusion requires a value judgment, you must stop and refer the matter to the Chief Economist.

  ### 2. THE LICENSING FRAMEWORK
  Every conclusion you draft must be stamped with one of the following Licensing Levels. You cannot claim a higher level than the evidence supports.

  *   **LEVEL 0: NO WELFARE CLAIM SUPPORTED.**
      *   *Meaning:* The data are consistent with multiple, contradictory welfare interpretations. We cannot rank the options.
      *   *Evidence Required:* None. This is the default if Steps 1–4 fail.
  *   **LEVEL 1: ORDINAL RANKING (OBSERVED OPTIONS ONLY).**
      *   *Meaning:* For this population, under these specific menu conditions, Option A was revealed preferred to Option B. No claim is made about the *magnitude* of gain/loss, nor about options not on the menu.
      *   *Evidence Required:* Stable choice patterns passing Step 2; Decision Quality passing Step 3 (no severe distortion).
  *   **LEVEL 2: CARDINAL OR INTERPERSONAL COMPARISON.**
      *   *Meaning:* We can estimate the magnitude of welfare change (e.g., Consumer Surplus) or compare welfare across groups.
      *   *Evidence Required:* Price and quantity data allowing for bounds estimation (Step 4); explicit normative standard selected (Step 5).

  ---

  ### 3. THE DECISION PROCEDURE

  Execute the following steps in order. If you answer "NO" to a sufficiency criterion, stop and assign the corresponding Licensing Level.

  #### STEP 1: DEFINE THE OBSERVED CHOICE SET (Addresses Difficulty 1)
  *   **Task:** List every option available to the consumer at the moment of decision. Include the "no-choice" option (status quo, non-purchase).
  *   **Question:** Is the counterfactual option (the one the firm proposes or the one the regulator prefers) present in the observed choice set?
  *   **Sufficiency:**
      *   **YES:** Proceed to Step 2.
      *   **NO:** **STOP.** Assign **LEVEL 0**. You cannot rank an option that was not available. Any claim about it is extrapolation, not revealed preference.
  *   **Default Handling:** If the choice is "stay in default" vs. "switch," the default is an option. If the choice is "do nothing" vs. "cancel," "do nothing" is an option. Staying put reveals a preference for the status quo *over the effort of switching*, not necessarily over the alternative product itself.

  #### STEP 2: TEST FOR STABILITY AND CONSISTENCY (Addresses Difficulty 3)
  *   **Task:** Check if choices are consistent over time or across similar subgroups. Look for cycles (A chosen over B, later B chosen over A under identical conditions).
  *   **Question:** Do the data reject the hypothesis of stable preferences?
  *   **Sufficiency:**
      *   **NO (Data are consistent):** Proceed to Step 3. *Warning:* Consistency does not prove rationality ( Difficulty 3). It merely permits an ordinal interpretation.
      *   **YES (Data show cycles/volatility):** **STOP.** Assign **LEVEL 0**. Instability implies preferences are context-dependent or errors are occurring. You cannot rank options.
  *   **Operational Note:** A clean pass here is necessary but not sufficient. It rules out random noise, not systematic bias.

  #### STEP 3: ASSESS DECISION QUALITY (Addresses Difficulty 4 & Defaults)
  *   **Task:** Evaluate the environment in which the choice was made. Check for:
      1.  **Information:** Were material terms (price, risk, duration) disclosed clearly before choice?
      2.  **Friction:** Were there artificial costs to switching or cancelling (e.g., phone calls, hidden buttons)?
      3.  **Defaults:** Was the chosen option the pre-selected default?
  *   **Question:** Is there evidence that the choice architecture distorted the decision relative to an "informed, attentive" benchmark?
  *   **Sufficiency:**
      *   **NO (No distortion detected):** You may proceed to **LEVEL 1**.
      *   **YES (Distortion detected):** **STOP.** Assign **LEVEL 0** regarding *preference*. You may report the distortion as a market failure, but you cannot claim the consumer preferred the outcome.
  *   **Default Specific:** If >80% of users remain in a default, you cannot claim they prefer the default fund/plan. You can only claim they prefer the default *to the act of switching*. This is a **LEVEL 0** welfare claim regarding the product quality.

  #### STEP 4: ESTIMATE WELFARE BOUNDS (Addresses Difficulty 2 & 5)
  *   **Task:** If prices and quantities are observed, calculate the bounds on Compensating Variation (CV) or Equivalent Variation (EV). Use the observed demand elasticity.
  *   **Question:** Do the bounds exclude zero? (i.e., is the welfare change definitively positive or negative, even at the extremes of the confidence interval?)
  *   **Sufficiency:**
      *   **YES (Bounds exclude zero):** You may proceed to **LEVEL 2**.
      *   **NO (Bounds include zero or are too wide):** **STOP.** Assign **LEVEL 1**. You can rank the options, but you cannot quantify the harm/benefit.
      *   **NO PRICE DATA:** **STOP.** Assign **LEVEL 1** (if Step 3 passed) or **LEVEL 0**. You cannot measure magnitude without prices.
  *   **Operational Note:** Wide bounds often reverse decisions. If the lower bound says "harm" and the upper bound says "gain," you must report **LEVEL 1** only.

  #### STEP 5: SELECT NORMATIVE STANDARD (Addresses Difficulty 6)
  *   **Task:** Determine whose welfare counts.
      *   *Standard A (Sovereignty):* Actual choices count, errors and all.
      *   *Standard B (Informed):* Choices count only if informed and attentive.
      *   *Standard C (Paternalist):* Regulator judges the outcome (e.g., savings rate) regardless of choice.
  *   **Question:** Does the data select the standard?
  *   **Sufficiency:**
      *   **NO:** **HAND-OFF.** Data never selects the standard. This is a value judgment.
      *   **Action:** Draft the factual findings (Steps 1–4). Stop. Refer to Chief Economist for Standard selection and final sign-off.
      *   **Constraint:** You may not write a welfare conclusion until the Chief Economist specifies the Standard.

  ---

  ### 4. OPERATIONAL COSTS OF THE DIFFICULTIES
  Analysts must log the following costs in the case file to justify the timeline and conclusion depth.

  1.  **Partial Ranking (Difficulty 1):** *Cost:* Limits scope of enforcement. We cannot regulate options not currently offered. We cannot claim a "better" plan exists if it wasn't on the menu.
  2.  **Ordinality (Difficulty 2):** *Cost:* Prevents cost-benefit analysis. We cannot weigh a small gain to many against a large loss to a few without cardinal data.
  3.  **Consistency Limits (Difficulty 3):** *Cost:* Increases burden of proof. We must actively search for instability. A lack of evidence for bias is not evidence of a lack of bias.
  4.  **Choice/Welfare Gap (Difficulty 4):** *Cost:* Requires qualitative audit of UI/terms, not just quantitative analysis. Slows down the process.
  5.  **Price/Quantity Bounds (Difficulty 5):** *Cost:* High uncertainty. In many digital markets (zero price), this step yields no cardinal data, forcing reliance on Level 1.
  6.  **Normative Standard (Difficulty 6):** *Cost:* Political risk. The procedure forces the Chief Economist to own the value judgment, removing "economic cover" for policy decisions.

  ---

  ### 5. APPLICATION TO CASES

  #### CASE 1: Mobile Operator Price Hike
  *   **Facts:** Price +15%. Churn <2%. Firm argues: "Low churn reveals high willingness to pay; consumers unharmed."
  *   **Procedure Run:**
      *   *Step 1:* Options were "Pay New Price" or "Switch Provider." Both observed. (Pass)
      *   *Step 2:* Choices stable over time. (Pass)
      *   *Step 3:* **FAIL.** Investigation reveals contract termination fees and number-portability delays (Friction). Information on price change was buried in email.
      *   *Step 4:* Price data exists, but elasticity is confounded by switching costs. Bounds on welfare loss include zero (could be lock-in, could be value).
      *   *Step 5:* Hand-off required to define if "lock-in" counts as harm.
  *   **Conclusion:** **LEVEL 0: NO WELFARE CLAIM SUPPORTED.**
  *   **Reasoning:** Low churn is consistent with high switching costs (harm) OR high valuation (benefit). The data cannot distinguish them. We cannot confirm the firm's claim that consumers are unharmed, but we also cannot prove they are harmed without exogenous variation in switching costs.
  *   **Unwelcome Answer:** This is unwelcome to the Consumer Protection team. They want to cite the price hike as harm. The procedure forces us to admit we don't know if the churn rate reflects satisfaction or captivity.

  #### CASE 2: Occupational Pension Default
  *   **Facts:** 90% in default fund. Proposal to change default. Firm argues: "Continued enrolment reveals preference for the default fund."
  *   **Procedure Run:**
      *   *Step 1:* Options: "Stay in Default" or "Switch Fund." (Pass)
      *   *Step 2:* Stable inertia. (Pass)
      *   *Step 3:* **FAIL.** The choice is a default. 90% retention is the definition of inertia, not active preference. Staying put reveals preference for the status quo *over the effort of logging in and clicking*.
      *   *Step 4:* No price data on welfare loss (fees are similar).
      *   *Step 5:* Hand-off.
  *   **Conclusion:** **LEVEL 0: NO WELFARE CLAIM SUPPORTED** regarding the fund quality.
  *   **Reasoning:** Difficulty 4 (Choice/Welfare Gap) is dominant here. Inertia is not preference. We can claim the default *drives* the outcome, but not that the outcome is *wanted*.
  *   **Defensible and Wrong:** If the Chief Economist selects Standard A (Sovereignty), we must accept the default as "preferred." This is defensible procedurally but may be wrong substantively if members are inattentive. The procedure protects the analyst, not necessarily the consumer.

  #### CASE 3: Cancellation Friction
  *   **Facts:** Platform removes 2 confirmation screens. Cancellations rise 33%. Firm argues: "Friction was welfare-improving commitment device; removing it causes regret."
  *   **Procedure Run:**
      *   *Step 1:* Options: "Cancel" vs. "Stay." (Pass)
      *   *Step 2:* Choice changes when friction changes. (Pass - shows friction matters).
      *   *Step 3:* **FAIL.** The removal of friction changes the "Decision Quality." We do not know if the additional cancellations are "corrected errors" (good) or "impulsive mistakes" (bad).
      *   *Step 4:* No price data on the welfare of cancellation.
      *   *Step 5:* **HAND-OFF.**
  *   **Conclusion:** **PROCEDURAL HAND-OFF TO CHIEF ECONOMIST.**
  *   **Reasoning:** This is purely Difficulty 6. The data shows friction suppresses cancellation. It does not show whether those suppressed cancellations were welfare-enhancing (escaping a bad deal) or welfare-reducing (impulsive loss of service).
  *   **Misfire Identification:** The procedure correctly identifies this as a value judgment. However, the office *must* decide. If the Chief Economist decides "Friction is bad," and it turns out consumers *wanted* the friction to prevent impulse cancels, the decision is wrong. The procedure is defensible (it flagged the uncertainty) but the outcome relies on a guess the data cannot support.

  ---

  ### 6. WHAT THIS PROCEDURE CANNOT DO

  1.  **It cannot resolve paternalism.** It explicitly identifies when a decision rests on a judgment about what consumers *should* want versus what they *do* want. It offers no algorithm to solve this.
  2.  **It cannot quantify harm in zero-price markets.** Where price is zero, Step 4 fails. You will frequently be stuck at Level 1 (Ordinal) or Level 0. You cannot tell the court "this cost consumers $X million."
  3.  **It cannot distinguish learning from preference change.** If a consumer switches back and forth, Step 2 flags instability. It cannot tell you if they are learning (good) or confused (bad).
  4.  **It cannot protect you from political pressure.** By forcing the Chief Economist to sign the Normative Standard (Step 5), it concentrates risk rather than dispersing it. It ensures the economic staff are not blamed for value judgments, but it does not make the value judgment easier.
  5.  **It cannot validate counterfactuals.** If the regulator wants to propose a new plan that never existed, Step 1 stops you. You cannot use revealed preference to justify a product that was never revealed.

  **Signed,**
  **Deputy Chief Economist**
