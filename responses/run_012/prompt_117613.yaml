answer: |-
  Here is a principle constructed to match the architecture of your intuitions, followed by the analysis you requested.

  ### The Principle of Jurisdictional Competence

  A community may enforce a rule against a member if and only if the rule satisfies three conditions. If any condition is failed, the rule is impermissible.

  **Clause 1: The Functional Nexus**
  The rule must be causally necessary to maintain the specific, defining practice of the community. It cannot govern conduct that is merely coincidental to membership.
  *   **Forcing Case:** *The Monastery (Rising vs. Family).* This clause explains why rising at four is permissible (it constitutes the practice of monasticism) while cutting off family is not (family ties are not functionally incompatible with prayer, whereas silence is). It also validates the *Hospital Checklist* (safety is the function of surgery) and the *Commune* (income pooling is the function of a commune).

  **Clause 2: The Sovereign Restraint**
  If the enforcer is a state actor (or an entity exercising state authority/funds), the rule is impermissible if it restricts personal liberty outside the immediate scope of public safety or job efficiency, regardless of how easy it is to exit the relationship. Private associations are exempt from this restraint.
  *   **Forcing Case:** *The City Residency Requirement.* This clause corrects your "exit cost" error. It explains why the City cannot demand residency (State actor, lifestyle restriction) even though resignation is easy, while the *HOA Trash Fine* is permissible (Private property contract, nuisance management). It also condemns the *National Service* mandate (State coercion without immediate harm prevention).

  **Clause 3: The Core Immunities**
  No community, private or public, may demand the surrender of rights essential to moral agency (e.g., family bonds, political speech, conscience) unless the community is expressly constituted for a purpose that is logically incompatible with that right.
  *   **Forcing Case:** *The HOA Political Signs.* This clause explains why the HOA cannot ban signs (political speech is a core immunity; an HOA is not a political party) even though it can fine for trash (nuisance is not a core immunity). It also reinforces the *Monastery Family* verdict (family is a core immunity) and the *Religious School* verdict (public funds trigger Sovereign Restraint on conscience).

  ***

  ### Three New Test Cases

  **1. Mandatory Urinalysis (Private vs. State)**
  *   **Scenario:** A private logistics company requires drivers to submit to random drug tests. A state welfare office requires all benefit recipients to submit to random drug tests.
  *   **Verdict:** The private test is **Permissible**; the state test is **Impermissible**.
  *   **Reasoning:** Under **Clause 1 (Nexus)**, driving heavy machinery requires sobriety for safety. Under **Clause 2 (Sovereign Restraint)**, the state cannot treat citizenship/benefit receipt as a role requiring bodily intrusion absent specific suspicion of harm. This tests whether the *identity of the enforcer* is doing independent work. Your intuition on the City Residency suggests you believe it is.

  **2. Evening Curfew (School vs. City)**
  *   **Scenario:** A private boarding school requires students to be in their dorms by 10 PM. A small town requires all adults to be indoors by 10 PM.
  *   **Verdict:** The school rule is **Permissible**; the town rule is **Impermissible**.
  *   **Reasoning:** Under **Clause 1**, the school acts *in loco parentis* as part of its educational contract (Nexus). Under **Clause 2**, the town is a sovereign actor restricting general liberty without a declared emergency (Sovereign Restraint). This mirrors your HOA vs. City intuition.

  **3. The "Wellness" Blog (Employer vs. Private Citizen)**
  *   **Scenario:** A private marketing firm fires an employee for writing a blog criticizing the firm's clients. A city fires a sanitation worker for writing a blog criticizing the Mayor.
  *   **Verdict:** The private firing is **Permissible** (with caveats); the city firing is **Impermissible**.
  *   **Reasoning:** Under **Clause 3**, political speech is a core immunity. However, private employment contracts often subsume speech rights regarding business interests (Nexus). The state, however, cannot condition employment on silence regarding public governance (Sovereign Restraint). This tests the boundary of *Core Immunities* against *Functional Nexus*.

  ***

  ### Incompatibilities and Revisions

  **Which verdicts the principle cannot accommodate:**
  The Principle of Jurisdictional Competence is strict on **Clause 1 (Functional Nexus)**. It renders your **Employer Meditation** case **Impermissible**. Unless the job is specifically "meditator" or the meditation is proven to be a safety-critical protocol (like the hospital checklist), a private employer cannot mandate it. It fails the Nexus test.

  Additionally, the Principle struggles slightly with the **Funeral Norm**. Because the norm is unwritten and enforced socially rather than contractually, it falls into a gray zone of "effective coercion." The Principle assumes formal enforceability. To accommodate the Funeral Norm, we would need an "Ugly Clause" stating: *Social ostracization counts as enforcement if it deprives basic welfare (rides, food).*

  **Which verdict you should give up:**
  You should give up your hesitation on the **Employer Meditation** case and declare it **Impermissible**.

  **Why trust the argument over your gut:**
  Your hesitation likely stems from thinking of meditation as "benign" or "good for you." But the question is not about the *quality* of the rule, but the *authority* to impose it. If you allow an employer to mandate fifteen minutes of meditation, you must logically allow them to mandate fifteen minutes of prayer, or fifteen minutes of political indoctrination, provided they call it "team building."

  By marking this Impermissible, you strengthen **Clause 1 (Functional Nexus)**. It clarifies that the workplace is a sphere of *instrumental* cooperation, not *comprehensive* life management. This aligns with your verdict on the **City Residency** requirement (the state shouldn't manage where you live) and the **Monastery Family** rule (the monastery shouldn't manage who you love).

  **The Single Simplifying Revision:**
  The revision that simplifies the picture most is to accept that **Exit Cost is irrelevant.**

  Your original theory stumbled because you tried to make "cost of leaving" the metric. But as you noted, the HOA trash fine has a high exit cost (selling a home) and is permissible, while the City Residency rule has a low exit cost (quitting a job) and is impermissible.

  If you fully abandon exit cost as a metric and replace it with **Authority Type (State vs. Private)** and **Subject Matter (Functional vs. Fundamental)**, the tension disappears.
  *   **State + Lifestyle = No.** (City Residency, National Service).
  *   **Private + Functional = Yes.** (HOA Trash, Hospital Checklist, Commune Pooling).
  *   **Private + Fundamental Rights = No.** (Monastery Family, HOA Signs).

  This triad explains 10 of your 11 verdicts cleanly. The only outlier is the **Employer Meditation**, which sits on the line between "Functional" (team cohesion) and "Conscience" (mental privacy). Deciding that line in favor of Conscience (Impermissible) makes the theory robust. Deciding it in favor of Function (Permissible) requires you to explain why this function doesn't extend to prayer or political loyalty, which creates more problems than it solves.
