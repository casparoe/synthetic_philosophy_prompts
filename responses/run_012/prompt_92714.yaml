prompt: |-
  You are an expert in game theory, with a specialist's feel for the conceptual foundations of solution concepts rather than only their formal statements. Please think slowly and carefully about what follows. Before you give me a polished answer, spend some space working out how you want to approach it, then write the explanation proper.

  Some context on where I'm coming from: I'm a PhD student in economics, and I'm trying to get clear on something that keeps catching my students out in the dominance-solvability material — and that I suspect I've never understood as well as I let on. Consider the following two-player game. The row player's strategies are T, M, B and Z; the column player's are L, C and R. Each cell lists the row player's payoff first, then the column player's.

  |   | L | C | R |
  | --- | --- | --- | --- |
  | T | 4, 1 | 0, 3 | 2, 2 |
  | M | 0, 3 | 4, 1 | 2, 2 |
  | B | 1, 0 | 1, 0 | 1, 4 |
  | Z | 0, 0 | 0, 0 | 0, 0 |

  Four things, in descending order of how much I care about them.

  1. Look at the row player's strategy B. No pure strategy strictly dominates it: T does worse against C, M does worse against L, and Z is worse in every column. Yet the even mixture of T and M strictly dominates it. I want to understand how this is possible rather than simply be assured that it is. What does the mixture deliver that neither T nor M delivers on its own, and is there a way of depicting the strategies as points in some space that makes the possibility obvious? Please work it through on this particular matrix rather than gesturing at the definition.

  2. I'm told there is a standard equivalence between a strategy being strictly dominated by some mixture and that strategy never being a best response to any belief. Set out the equivalence, and then explain why it holds. The direction from never-a-best-response to strictly-dominated is the one I can never reconstruct for myself, so please put your effort there.

  3. Now the iterated part. Z is strictly dominated by B, and B is strictly dominated only by a mixture. Suppose we iterate. Does allowing mixtures to serve as dominators ever leave us with less than we would have if dominators had to be pure? Does the order of elimination matter — and does your answer to that depend on whether mixtures are permitted to do the dominating, or on whether the operative notion is strict rather than weak dominance? I want verdicts with reasons rather than a survey.

  4. Finally, the conceptual payoff. The only thing that eliminates B is a randomization. Say what you take that to show. Is it legitimate to rule out a pure strategy on the strength of a mixture that the player may never actually employ? Or is the mixture better understood as a certificate or proof object rather than as a plan of action — and if the latter, how much interpretive weight are mixed strategies really carrying in the standard solution concepts?

  Be opinionated where a question has a determinate answer, and explicit about where it does not. I don't need references; I'd rather have the argument.
