answer: |-
  ### Preliminary Thoughts on Approach

  This is a wonderful set of questions because it cuts through the formalism to the geometric and epistemic heart of non-cooperative game theory. As a PhD student, you know the definitions; the trouble is that the definitions often obscure *why* the machinery works the way it does.

  My strategy for the explanation will be to lean heavily on **geometry** and **convexity**. Game theory payoffs are vectors; strategies are points; mixtures are convex combinations. Once you visualize the payoff space, the "mystery" of mixed dominance dissolves into simple linear algebra.

  For the equivalence theorem (Point 2), I will avoid a formal proof and instead provide the geometric intuition behind the **Separating Hyperplane Theorem**, which is the actual engine driving that result.

  For the iterated elimination (Point 3), I need to be precise about distinguishing between *order independence* (does the sequence of deletion matter?) and *sensitivity to the definition of dominance* (does allowing mixtures change the final set?). These are often conflated.

  Finally, for the conceptual payoff (Point 4), I will take a firm stance: mixed strategies in the context of dominance are **certificates of irrationality**, not necessarily behavioral prescriptions. This distinction is crucial for clearing up student confusion.

  Here is the explanation proper.

  ***

  ### 1. The Geometry of Mixed Dominance

  Let's look at the Row player's payoffs as vectors in $\mathbb{R}^3$, where each dimension corresponds to one of Column's strategies ($L, C, R$).
  *   $v_T = (4, 0, 2)$
  *   $v_M = (0, 4, 2)$
  *   $v_B = (1, 1, 1)$
  *   $v_Z = (0, 0, 0)$

  Strict dominance of strategy $s$ by strategy $\sigma$ means that the payoff vector of $\sigma$ is strictly greater than the payoff vector of $s$ in every component.
  You observed that neither $T$ nor $M$ dominates $B$ individually.
  *   $v_T$ vs $v_B$: $4>1$ (good), but $0<1$ (bad).
  *   $v_M$ vs $v_B$: $4>1$ (good), but $0<1$ (bad).

  Now consider the mixture $\sigma = 0.5 T + 0.5 M$. In vector space, mixing strategies corresponds to taking a **convex combination** of their payoff vectors. The payoff vector for $\sigma$ is:
  $$v_\sigma = 0.5 v_T + 0.5 v_M = 0.5(4, 0, 2) + 0.5(0, 4, 2) = (2, 2, 2)$$

  Now compare $v_\sigma = (2, 2, 2)$ with $v_B = (1, 1, 1)$. Clearly, $2 > 1$ in every component.

  **What does the mixture deliver?**
  $T$ and $M$ are "specialists." $T$ is excellent against $L$ but terrible against $C$. $M$ is excellent against $C$ but terrible against $L$. $B$ is a "generalist," offering a safe, mediocre payoff of 1 against everything.
  The mixture $0.5T + 0.5M$ creates a **super-generalist**. By randomizing, the Row player hedges the risk of the Column player choosing $L$ or $C$. The mixture smooths out the peaks and valleys of $T$ and $M$ to create a floor of 2, which is strictly higher than $B$'s floor of 1.

  **Depicting the Space:**
  Imagine a 3D coordinate system. Plot the points $v_T, v_M, v_B$.
  The set of all possible payoff vectors Row can guarantee themselves (using any mixed strategy) is the **convex hull** of the pure strategy points $\{v_T, v_M, v_B, v_Z\}$.
  Strict dominance asks: "Is point $v_B$ strictly 'below' some other point in the convex hull of the *other* strategies?"
  Here, $v_B$ lies strictly below the line segment connecting $v_T$ and $v_M$. Geometrically, $v_B$ is not on the **upper frontier** (the Pareto boundary) of the feasible payoff set. It is "buried" inside the hull formed by $T$ and $M$ (and the origin).
  If you project these points onto a 2D plane where the axes represent "Payoff vs L" and "Payoff vs C" (ignoring R for a moment), $T$ is on the x-axis, $M$ is on the y-axis. $B$ is near the origin. The line connecting $T$ and $M$ bows outward, passing far "above" $B$. The mixture allows you to access points on that bow that are unachievable by any pure strategy.

  ### 2. The Equivalence: Strictly Dominated $\iff$ Never a Best Response

  The theorem states: *A pure strategy $s_i$ is strictly dominated by some mixed strategy if and only if $s_i$ is never a best response to any belief (mixed strategy) of the opponent.*

  **The Easy Direction (SD $\implies$ NBR):**
  If $\sigma_i$ strictly dominates $s_i$, then $u_i(\sigma_i, s_{-i}) > u_i(s_i, s_{-i})$ for all $s_{-i}$. By linearity of expected utility, this inequality holds for any probability distribution over $s_{-i}$. Thus, $s_i$ can never maximize expected utility against any belief.

  **The Hard Direction (NBR $\implies$ SD):**
  This is the one that feels like magic. Why does failing to be a best response against *any* belief imply there is a *single* mixture that beats you everywhere?

  **Intuition via Separating Hyperplanes:**
  Think of the opponent's mixed strategies as a set of "directions" in payoff space. A strategy $s_i$ is a best response to some belief $\mu_{-i}$ if the vector $v_{s_i}$ maximizes the dot product with $\mu_{-i}$ among all available strategy vectors. Geometrically, this means $v_{s_i}$ lies on the **upper boundary** of the convex hull of all Row's strategy vectors. Specifically, there must be a supporting hyperplane (defined by the belief weights) such that $v_{s_i}$ touches the hull and all other points are "below" or on it.

  If $s_i$ is **never** a best response, it means $v_{s_i}$ never touches this upper boundary. It lies strictly in the **interior** of the convex hull of the other strategies (or strictly below the frontier).
  Because the set of feasible payoff vectors (the convex hull of all strategies) is convex and compact, if a point $v_{s_i}$ is not on the upper frontier, there must be some other point $v^*$ in the convex hull that is strictly greater in all coordinates.
  Why? Because if $v_{s_i}$ were not strictly dominated, it would be "Pareto efficient" within the set of feasible payoffs. If it is Pareto efficient, there exists some weighting of the coordinates (some belief of the opponent) for which it is optimal.
  Since we assume it is *never* optimal (NBR), it cannot be Pareto efficient. Therefore, there exists a point $v^*$ (which corresponds to a mixture $\sigma_i$) such that $v^* > v_{s_i}$ component-wise.

  In short: Being a Best Response is equivalent to being on the "skyline" of the payoff polytope. If you aren't on the skyline, you are in the shadow of a building (a mixture) that is taller than you in every dimension.

  ### 3. Iterated Elimination: Mixtures, Order, and Strictness

  Let's break your questions down into verdicts.

  **Verdict 1: Does allowing mixtures to serve as dominators leave us with fewer strategies than restricting dominators to be pure?**
  **Yes.**
  In your matrix, if we restrict dominators to be pure strategies:
  1.  $Z$ is eliminated (dominated by $B$).
  2.  $B$ is *not* eliminated (no pure strategy dominates it).
  3.  Process stops (for Row).
  If we allow mixed dominators:
  1.  $Z$ is eliminated (dominated by $B$).
  2.  $B$ *is* eliminated (dominated by $0.5T + 0.5M$).
  3.  Process continues further.
  Allowing mixtures makes the dominance relation "stronger," so it eliminates more strategies. It refines the solution.

  **Verdict 2: Does the order of elimination matter?**
  **No, provided we are using Strict Dominance.**
  Whether you allow mixed dominators or not, Iterated Elimination of **Strictly** Dominated Strategies (IESDS) is order-independent. The set of surviving strategies is unique.
  *Reason:* If a strategy is strictly dominated, it remains strictly dominated even if other strategies are removed (because the dominating strategy is still available). You never "accidentally" delete a strategy that was needed to dominate another later on, because the domination relationship is robust to the removal of *other* dominated strategies.
  *Note:* This holds for IESDS with pure dominators AND IESDS with mixed dominators. The *outcome* differs between the two definitions (see Verdict 1), but within each definition, the order of deletion does not change the final set.

  **Verdict 3: Does the answer depend on whether the notion is Strict or Weak dominance?**
  **Yes, critically.**
  If we switch to **Weak** Dominance (IEWDS):
  1.  **Order Matters:** You can eliminate different strategies depending on the sequence. (e.g., eliminating A might make B weakly dominated, but eliminating C first might make A weakly dominated).
  2.  **Mixtures:** Allowing mixtures in weak dominance is messy and less standard, but the order-dependence problem remains the primary conceptual hazard.
  *Reason:* Weak dominance relies on inequalities ($\geq$) with at least one strict ($>$). Removing a strategy that provided the "tie" can destroy the dominance relationship for another strategy.

  **Summary for your students:**
  *   **Strict Dominance:** Order never matters. Mixtures eliminate more, but order still doesn't matter.
  *   **Weak Dominance:** Order *does* matter. Be very careful.

  ### 4. Conceptual Payoff: The Ontology of the Mixture

  This is the crux of the student confusion. "Why should I care that a *randomization* beats $B$ if I intend to play a pure strategy?"

  **The Mixture as a Certificate, Not a Plan**
  In the context of dominance (and rationalizability), the mixed strategy $\sigma = 0.5T + 0.5M$ should not be interpreted as a behavioral instruction ("You must flip a coin"). It should be interpreted as a **proof object** or a **certificate of irrationality**.

  To say $B$ is strictly dominated is to say: "There exists a feasible plan available to you that yields a higher payoff in every contingency." In game theory, a "plan" includes lotteries over actions. If the agent has access to a randomization device (even a mental one), the lottery is a valid option in the choice set.
  If $B$ is dominated by a mixture, it means $B$ is **inferior to the opportunity set**. Rationality requires choosing from the efficient frontier of the opportunity set. $B$ is interior.

  **Is it legitimate to rule out $B$?**
  **Yes.**
  Even if the player eventually chooses a pure strategy (say, $T$), the fact that $B$ is dominated by a mixture proves that $B$ could not have been the result of *any* coherent preference ordering over outcomes that respects monotonicity (more money is better).
  If the player chooses $B$, they are effectively leaving money on the table regardless of what the opponent does. They could have committed to the lottery $0.5T + 0.5M$ and been strictly better off. The fact that they might not *want* to randomize is irrelevant; the existence of the dominating lottery proves $B$ is structurally flawed.

  **Interpretive Weight of Mixed Strategies**
  This highlights a duality in how we treat mixed strategies in game theory:
  1.  **In Nash Equilibrium:** Mixed strategies often carry behavioral weight (actual randomization to induce indifference) or epistemic weight (beliefs of others).
  2.  **In Dominance/Rationalizability:** Mixed strategies are primarily **analytical tools**. They define the convex hull of feasible payoffs.

  When we use IESDS with mixed dominators, we are essentially solving the game on the **convexified** strategy space. We are asking: "What strategies survive if the player can utilize any convex combination of actions?"
  If a pure strategy dies in this process, it is because it is redundant. It adds no value to the convex hull of payoffs.
  So, to answer your specific worry: The mixture is a certificate. It certifies that $B$ is not on the efficient frontier. We rule out $B$ not because the player *must* play the mixture, but because playing $B$ is inconsistent with the assumption that the player prefers more payoff to less, given the available technology (which includes randomization).

  **Final Opinion:**
  It is legitimate to rule out $B$. To do otherwise is to claim that a rational agent might choose an option that is strictly worse than a available lottery, regardless of the state of the world. That violates the most basic tenets of decision theory. The "mixture" is simply the witness that testifies to this violation.
