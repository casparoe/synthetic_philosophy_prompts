answer: |-
  Your hypothesis is sharp, but it needs one crucial adjustment. You suggest the fight is about whether "there's no fact of the matter" is coherent versus "we don't know." That is the *surface* manifestation of the disagreement. The **substantive core** is deeper: it is a disagreement about the **metaphysics of semantic content** and the **supervenience of truth**.

  Here is the diagnosis.

  ### 1. Verbal, Substantive, or Different Questions?
  It is **substantive**, but it is best understood as a clash of **theoretical virtues** rather than a disagreement about the data (the Sorites cases). Both sides agree on the data: classical logic holds, the tolerance premise is false, and borderline cases exist.

  They disagree on **which theoretical cost is acceptable** to explain that data.
  *   **The Epistemicist** (e.g., Timothy Williamson) prioritizes the **principle of supervenience**: semantic facts must supervene on non-semantic facts (usage, environment, physical state). If two worlds are identical in all physical and usage respects, they must be identical in truth-value. For the epistemicist, "no fact of the matter" is metaphysically incoherent because the physical/usage facts *determine* an extension, even if we cannot identify it.
  *   **The Supervaluationist** (e.g., Kit Fine, Rosanna Keefe) prioritizes **semantic intuition**: meaning is determined by use, and use underdetermines extension. Therefore, there is *no* single fact of the matter about the extension. They are willing to sacrifice the idea that every truth must have a specific truth-maker (a specific state of affairs making it true) in favor of preserving the intuition that there is no "magic number" of grains.

  So, they are answering the same question ("What is the metaphysical status of vague predicates?") but they disagree on the **constraints of a theory of meaning**.

  ### 2. The Real Disagreement: Truth-Makers vs. Semantic Indecision
  You suspected the fight is about "truth and knowledge in the explanation." You are right, but specifically about **Truth-Maker Theory**.

  **The Epistemicist Charge:**
  Williamson argues that Supervaluationism violates the principle that truth supervenes on being. If "This is a heap" is supertrue (true on all admissible precisifications), what *makes* it true?
  *   On a classical view, a proposition is made true by a state of affairs.
  *   On Supervaluationism, it is made true by a *set of models*.
  *   **The Diagnosis:** The Epistemicist claims the Supervaluationist is positing "truth without truth-makers." They argue this is metaphysically spooky. For the Epistemicist, "vague" is an epistemic relation between a subject and a sharp boundary. For the Supervaluationist, "vague" is a semantic relation between a word and a set of extensions.

  **The Supervaluationist Charge:**
  The Supervaluationist argues that Epistemicism posits "facts without grounds."
  *   If usage and physical facts are identical up to grain *n* and grain *n+1*, what fact makes *n* the cut-off and not *n+1*?
  *   **The Diagnosis:** The Supervaluationist claims the Epistemicist is positing a "magical boundary" that floats free of human practice. For them, "no fact of the matter" is the only coherent response to the underdetermination of meaning by use.

  **Verdict:** This is not verbal. They have different definitions of "truth," but the disagreement is about which definition successfully captures the phenomenon of vagueness without incurring unacceptable metaphysical debt.

  ### 3. Is Higher-Order Vagueness (HOV) the Hidden Action?
  You suspected HOV is where the real action is. **This is partially correct, but HOV is the weapon, not the war.**

  HOV is the stress test that reveals the cost of each position.
  *   **For the Epistemicist:** HOV is cheap. If vagueness is ignorance, then higher-order vagueness is just ignorance about where the boundaries of our ignorance lie. It requires no new formal machinery. It is a virtue of their view.
  *   **For the Supervaluationist:** HOV is expensive. If 'admissible precisification' is itself vague, you need a supervaluation of supervaluations. This leads to a hierarchy of semantic levels. Critics argue this makes the semantics overly complex or collapses back into epistemicism (if there is a fact about which precisifications are admissible).

  **Diagnosis on HOV:** Your suspicion that this is a red herring is mostly right. HOV doesn't *cause* the disagreement; it **exacerbates** it. It shows that the Supervaluationist pays a higher formal complexity tax to maintain their metaphysical stance, while the Epistemicist pays a higher intuitive absurdity tax (unknowable sharp boundaries). The fight isn't *about* HOV; HOV is just the arena where the costs are tallied.

  ### 4. What Counts as Progress?
  You asked what would count as progress: a distinction, a formal result, or a change of question.

  **A. Formal Results (Unlikely to Resolve)**
  Both sides have robust formal semantics. Supervaluationism has model-theoretic precision; Epistemicism has epistemic logic (margin-for-error principles). A formal result is unlikely to settle this because the disagreement is not about consistency; both systems are consistent. The disagreement is about **philosophical plausibility**.

  **B. A Change of Question (The Deflationary Route)**
  Progress might come from dissolving the question via **Deflationism about Truth**.
  *   If truth is not a substantial property requiring "truth-makers" or "correspondence," the Epistemicist's complaint (no truth-maker for supertruth) loses force.
  *   However, both Williamson and Fine generally resist deflationism because they want to save classical logic, which often relies on substantial truth properties.
  *   **Progress Condition:** If the reading group can agree on a deflationary account of truth that still supports classical logic, the metaphysical sting is removed. (Good luck with this).

  **C. The Actual Path to Progress: Settling the Supervenience Constraint**
  The only way to resolve this substantively is to argue for one of the two metaphysical constraints:
  1.  **Argue for Semantic Supervenience:** If you can prove that semantic facts *must* supervene on non-semantic facts (usage/physical), Epistemicism wins. Supervaluationism becomes incoherent.
  2.  **Argue for Semantic Indecision:** If you can prove that use *essentially* underdetermines extension (e.g., via causal theories of reference or normative accounts of meaning), Supervaluationism wins. Epistemicism becomes "magical."

  **Recommendation for the Group:**
  Stop arguing about heaps. Stop arguing about the Sorites. You have solved the Sorites (both sides do).
  **Shift the question to:** *"Does meaning supervene on use?"*
  *   If the group agrees meaning is fixed by use + environment, they must be Epistemicists (admitting ignorance).
  *   If the group agrees meaning is inherently flexible/underdetermined by use, they must be Supervaluationists (admitting indeterminacy).

  ### Summary Diagnosis
  The disagreement is **substantive**, rooted in the **metaphysics of semantics**.
  *   **Epistemicism** saves classical logic and supervenience by sacrificing the link between knowability and truth.
  *   **Supervaluationism** saves classical logic and the intuition of indeterminacy by sacrificing the link between truth and specific truth-makers.
  *   **HOV** is not the core issue but the metric by which they measure each other's complexity costs.
  *   **Progress** requires abandoning the Sorites entirely and debating the **Supervenience of the Semantic**. Until you settle whether "meaning is fixed by use," you will grind forever on heaps.
