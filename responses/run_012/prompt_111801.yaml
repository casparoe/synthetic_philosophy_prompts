      *   *Key Insight to add:* The "Asymmetric Rule" suggests the colleague might actually be arguing for **Policy Lock-in** disguised as **Procedural Stability**. The User sees it as **Dead Hand Control**. The diagnosis should pivot on whether the constitution is a *process* or a *policy*.

  10. **Final Structure:**
      *   Validate the hypothesis (it's strong).
