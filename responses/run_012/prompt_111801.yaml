      *   *The Asymmetric Rule:* Highlight how this breaks the Ulysses analogy. Ulysses is symmetric (I bind myself to stop me). This rule is directional (We bind future us to stop *spending*, but not *saving*).
      *   *The "Two Questions" Theory:* Yes, "Entrenchment" conflates **Precommitment** (Ulysses) with **Preclusion** (Locking the door).
