answer: |-
  Here are ten interview questions designed to press the dispositionalist straight solution at its philosophical joints, including the required follow-ups.

  **1. The Normativity Gap**
  The classic objection to your view is that dispositions tell us what a speaker *will* say, but meaning tells us what she *ought* to say. If I am disposed to answer "125" to "68+57," that predicts my behavior, but how does it justify it? If you claim the disposition itself constitutes the norm, aren't you simply defining correctness as whatever happens, thereby dissolving the normativity you claim to save?
  *   **Follow-up:** You will likely reply that the disposition is *constitutively* normative, not just descriptive. But if the norm is constituted by the disposition, then a speaker disposed to answer "5" to "2+2" is following a norm just as much as I am. Does your view imply that there is no sense in which a consistent arithmetic deviant is actually *wrong*, only that they are different?

  **2. The Finitude and Idealization Trap**
  Our actual dispositions are finite; we die before we can compute sums with numbers larger than the universe contains particles. To handle this, dispositionalists often appeal to what we *would* do under "ideal conditions." But if you idealize the dispositions to cover the infinite cases required by meaning, aren't you turning them into abstract relations that no longer exist as psychological facts about the speaker?
  *   **Follow-up:** You will likely argue that these are still facts about *me*, just counterfactual ones. But how do you specify the "ideal conditions" without circularly defining them as "the conditions under which I get the answer right"? If the conditions are defined by correctness, you are using meaning to explain meaning.

  **3. The Problem of Systematic Error**
  If meaning is constituted by dispositions, it seems that whatever I am disposed to do is, by definition, what I mean. This makes systematic error impossible: if I consistently answer "quus" instead of "plus," haven't I simply shown that I meant "quus" all along? How do you allow for the possibility that I am disposed to go wrong without collapsing the distinction between meaning and performance?
  *   **Follow-up:** You will likely distinguish between "canonical" dispositions and performance errors caused by fatigue or distraction. But on what basis do you identify the canonical dispositions? If you pick out the "true" dispositions by checking which ones align with the rule of addition, aren't you presupposing the very rule you are trying to ground in the disposition?

  **4. Straight Solution or Skeptical Redescription?**
  Kripke's skeptical solution abandons truth-conditions for assertibility-conditions, grounding meaning in community agreement. You claim to offer a straight solution that restores truth-conditions via dispositional facts. But if these dispositional facts are not epistemically accessible to the speaker or the community, does your "straight solution" do any work that the skeptical solution doesn't, or is it merely a metaphysical ornament on the same pragmatic view?
  *   **Follow-up:** You will likely insist that the fact is real even if inaccessible. But if the fact plays no role in how we actually attribute meaning or correct one another in practice, what philosophical problem does positing it solve? Are you not just satisfying a metaphysical itch while leaving the epistemic situation exactly as the skeptic described it?

  **5. The Intentionality of the Disposition**
  A disposition to respond to "+" is not just a brute physical reaction like solubility; it seems to require that the speaker take the sign to *represent* addition. Does your dispositional fact itself have intentional content? If the disposition is just a causal link between stimulus and response, how does it select the specific rule of addition rather than an indefinite number of compatible rules?
  *   **Follow-up:** You will likely say the disposition is sui generis and doesn't need further interpretation. But if the disposition doesn't encode the rule, how does it rule out the "quus" interpretation at the metaphysical level? If it does encode the rule, haven't you just pushed the problem of meaning back a step to the meaning of the disposition itself?

  **6. Masking and Interference**
  Dispositions can be masked; I might be disposed to answer correctly but fail due to a headache or a neuron firing incorrectly. How do you distinguish a case where my meaning has changed from a case where my disposition is merely masked? If you say the meaning stays the same because the "underlying" disposition is intact, how do we verify the existence of this unmanifested disposition?
  *   **Follow-up:** You will likely appeal to counterfactuals: "If she weren't tired, she would answer correctly." But what makes that counterfactual true if not the very meaning fact we are trying to analyze? If the truth-maker for the counterfactual is the meaning, you are explaining meaning in terms of a counterfactual that depends on meaning.

  **7. The Robinson Crusoe Problem**
  Kripke argues that a solitary individual cannot have rules because there is no distinction between thinking one is right and being right. As a dispositionalist, you typically argue that a solitary speaker *can* mean things by their dispositions alone. But without a community to correct her, what constrains her dispositions from drifting over time? If her dispositions shift gradually from plus to quus, at what point does her meaning change?
  *   **Follow-up:** You will likely say her meaning changes exactly when her dispositions change. But this implies that meaning is radically unstable and opaque to the speaker. Does this not entail that a speaker can never know if she has maintained the same meaning from yesterday to today, undermining the stability required for communication even with oneself?

  **8. Truth-Conditions vs. Verification**
  Your straight solution promises to restore truth-conditions to meaning statements. However, if the dispositional facts you posit are fallible and finite, they cannot guarantee the truth of infinite projections. Are you offering truth-conditions that are potentially false, or are you offering truth-conditions that are verification-transcendent?
  *   **Follow-up:** You will likely accept verification-transcendence to save the truth-conditional account. But if the truth-condition is transcendent, how does it guide the speaker's use? If it doesn't guide use, and only the finite dispositions do, why insist the truth-condition is the source of meaning rather than the finite dispositions themselves?

  **9. First-Person Authority**
  We typically assume speakers have privileged access to what they mean. On your view, meaning is a fact about dispositions, which are often opaque to the subject; I might not know how I am disposed to react to a complex calculation until I do it. Does your view force us to deny first-person authority over meaning, making the speaker an observer of her own semantic facts?
  *   **Follow-up:** You will likely argue that authority is a separate pragmatic issue from the metaphysics of meaning. But if the metaphysics of meaning renders the speaker's own grasp of her meaning fallible and observational, haven't you changed the subject? Are you still explaining *our* concept of meaning, or a revised philosophical construct?

  **10. The Skeptic's Remainder**
  Suppose we grant your dispositional account. The skeptic still asks: "What fact about that disposition makes it a disposition to *add*?" If you answer that it is just a brute fact about the speaker's nature, have you not simply stopped the regress by fiat? Why is this stopping point any more satisfying than the skeptic's claim that there is no fact?
  *   **Follow-up:** You will likely say the skeptic demands an impossible justification that requires no brute facts. But if the brute fact you offer is compatible with the skeptic's "quus" hypothesis until the moment of response, what work is the fact doing to *anticipate* the correctness of the response? If it doesn't anticipate it, how is it a fact about *meaning* rather than a fact about *behavior*?
