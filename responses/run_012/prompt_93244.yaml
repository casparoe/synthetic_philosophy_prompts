answer: |-
  Here are 9 questions designed to move from the intuitive applications to the technical constraints, and finally to the meta-philosophical status of the theorem. The follow-ups are drafted to counter the standard defensive moves you identified.

  **1. Peer Disagreement and Conciliationism**
  Let's start with the literature on peer disagreement. A lot of undergrads encounter Aumann's theorem as a mathematical argument for conciliationism: if I find out a peer disagrees with me, rationality demands I move my credence toward theirs. But you've argued the theorem is often misused here. Does Aumann actually support the conciliationist view, or is that a category error?
  *   **Follow-up:** You'll likely say the theorem doesn't *force* conciliation in real-time. But if it doesn't tell me what to do when I discover a colleague I respect, who saw the same data, disagrees with me, what normative work is the theorem actually doing for me in that moment?

  **2. The Status of the Common Prior**
  A core component of the theorem is the Common Prior Assumption, sometimes called the Harsanyi Doctrine: that differences in belief must stem from differences in information, not differences in how we process it. Is this an assumption the theorem requires to get off the ground, or is it a conclusion the theorem reaches about what rationality *is*?
  *   **Follow-up:** If it's an assumption, aren't you just building the result into the premises? And if it's a conclusion, how do you derive a common prior without already assuming that rational agents must converge?

  **3. Disagreement on Priors**
  Let's press on that Common Prior. Suppose you and I are both rational, but we simply start with different priors. We can agree on the likelihoods and the evidence, but we disagree on the starting point. Hasn't the disagreement just moved up a level to the priors themselves, where Aumann's theorem no longer constrains us at all?
  *   **Follow-up:** If the theorem only bites if we *already* agree on the prior, isn't it just telling us that people who already agree will agree? Where is the constraint on rational belief for people who *don't* start in the same place?

  **4. The Antecedent: Common Knowledge of Disagreement**
  Let's look at the conditions required for the theorem to trigger. If you and I are in a room, and I can see you believe *X* and you can see I believe *not-X*, isn't that disagreement already effectively common knowledge? If so, the theorem seems to imply one of us is immediately irrational. If that's not what it says, what exactly is missing from that room?
  *   **Follow-up:** You'll probably say we lack common knowledge of our *exact posteriors*, not just the disagreement. But if we don't know each other's exact probabilities, how can the theorem claim to constrain the beliefs we actually hold?

  **5. Vacuity and the Common Knowledge Hierarchy**
  Following up on that: to satisfy the theorem, we need an infinite hierarchy of knowledge—I know your probability, you know I know it, I know you know I know it, and so on. Is that hierarchy doing real philosophical work, or is it a technicality? If that condition is never met in live conversation, isn't the theorem vacuous rather than false?
  *   **Follow-up:** If you argue it's not vacuous because it sets a limit on what *could* happen, ask: If the antecedent can never obtain when there is a live disagreement, isn't the theorem self-defeating? It seems to say "if you communicate enough to satisfy the theorem, you've already agreed," which makes it useless for analyzing actual disagreement.

  **6. Logical Omniscience and Bounded Agents**
  The proof assumes agents know their own posteriors and can compute all the implications of their information. But students in this room know they aren't logically omniscient; we aren't even sure what our own credences are half the time. Is Aumann's theorem a constraint on human rationality, or is it a theorem about gods?
  *   **Follow-up:** If it's a theorem about logically omniscient agents, why should we care? Does it have any normative force for bounded agents like us, or is it like telling a human they are irrational for not flying by flapping their arms?

  **7. The No-Trade Theorem**
  A direct consequence of this framework is the "No-Trade Theorem": if we share a prior and know each other's probabilities, we should never engage in speculative trade. Is that a reductio ad absurdum of the whole framework, or a feature? Do you think the existence of high-volume financial markets falsifies the Common Prior Assumption?
  *   **Follow-up:** If you say markets are full of irrational noise traders, doesn't that concede that the theorem doesn't apply to the actual experts driving the market? And if the experts *are* rational, why is there any volume at all?

  **8. Persistent Expert Disagreement**
  We see persistent disagreement among experts who are clearly not stupid and who share roughly the same evidence bases—think climate science or macroeconomics. Is that evidence that these experts are irrational, or evidence that the idealization in Aumann's theorem is wrong?
  *   **Follow-up:** You might say it's just an idealization, like frictionless planes in physics. But frictionless planes still predict motion accurately. What predictive or explanatory work is an ideal doing if nothing could ever satisfy it and real-world data consistently violates it?

  **9. Empirical Content and Definition**
  Finally, is there any empirical content here at all? Can we test whether agents satisfy Aumann's conditions, or is this a norm that could never be falsified? If it can't be tested, what makes it a claim about rationality rather than just a definition of it?
  *   **Follow-up:** If it's a definition—if "rational" just *means* "satisfies Aumann's conditions"—then aren't you immune to criticism by fiat? How do you justify this definition against one that allows for reasonable disagreement?
