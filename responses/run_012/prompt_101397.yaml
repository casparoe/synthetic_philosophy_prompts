          *   *Analysis:* The reason is technically about the object (its future properties), but it feels instrumental. Or better: The "Ecumenist" case. A religious leader says, "If you admire God, you will see his true nature."
          *   *Refinement:* Let's use the "Admire this boring stick" case. Suppose the stick has the property of "being such that if you admire it, good things happen." That is a property *of the stick*. But it's clearly the wrong kind of reason. This shows "aboutness" isn't the key.

      *   **Attack Point 2: The "State" isn't always wrong (The Therapist/Training Case).**
