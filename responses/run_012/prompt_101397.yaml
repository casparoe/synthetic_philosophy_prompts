          *   *Nuance:* But it *is* the right kind of reason to be grateful. Gratitude is responsive to benevolence. But the *reason* you cite ("hurt feelings") is about the social consequence.
          *   *Crucial Point:* If the FA theorist says "hurt feelings" is WKR, they imply you shouldn't be grateful for that reason. But you *should* be grateful. If they say it's RKR, they admit reasons about consequences (states) can be right. This breaks the object/state rule.
