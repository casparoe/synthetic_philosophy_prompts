      *   **The Problem:** The Demon Case. You have a reason to admire the demon (to avoid torture), but the demon isn't good/admirable.
      *   **Standard Fix:** Distinguish Right Kind of Reasons (RKR) from Wrong Kind of Reasons (WKR). RKR are about the *object's properties*. WKR are about the *consequences of having the attitude*.
      *   **My Task:** Show this distinction is porous/broken.
          *   Case 1: Reasons about the object that feel like WKR.
          *   Case 2: Reasons about the state/attitude that feel like RKR.
          *   Case 3: The Sweater Case (Gratitude vs. Admiration).

  3.  **Drafting the Argument - Step-by-Step:**

      *   **Introduction:** Acknowledge the user's sophistication. Set the stage. State the thesis: The object/state distinction is a band-aid on a bullet hole. It doesn't solve the problem; it just renames it.

      *   **Attack Point 1: The "Object" isn't safe (The Cloning/Therapy Case).**
