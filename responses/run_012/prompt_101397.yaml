answer: |-
  You have spotted the exact crack in the foundation that keeps meta-ethicists up at night. You're right to be suspicious. The standard "object vs. state" fix is elegant, but it's too clean. It tries to solve a messy normative problem with a neat metaphysical distinction, and it doesn't hold up under pressure.

  Here is the hard truth: The distinction between reasons about the **object** (Right Kind) and reasons about the **state of having the attitude** (Wrong Kind) is not a solution. It is a placeholder. It tells us *where* to look, but it doesn't tell us *what* to look for. And worse, in cases like your sweater example, the distinction collapses entirely.

  Let's tear this down.

  ### 1. The Sweater Case: The Wedge That Breaks the Door
  Let's start with your sweater case because it is much more dangerous to the Fitting Attitude (FA) theorist than the Demon case.

  In the Demon case, the stakes are clear. The demon threatens torture. That is an external threat. It's easy to say, "That reason is about *you* (your pain), not the *demon* (his admirability)."

  But look at the sweater. Your friend made it. It's ugly. You ought to be grateful. Why?
  The FA theorist wants to say: "You should be grateful because the gift is an expression of kindness. Kindness is a property of the transaction (the object of your attitude)."

  But now ask yourself: What is the reason *not* to be ungrateful? "It would hurt their feelings."
  Is that a reason about the object (the gift/friendship) or a reason about the state (the consequence of your attitude)?

  If you say it's the **Wrong Kind** (because it's about the consequence of your attitude, i.e., their hurt feelings), you imply that you shouldn't base your gratitude on that. But that seems cold. Part of being a good friend *is* caring about the consequences of your attitudes on them. If you truly didn't care that your ingratitude would hurt them, you aren't just logically consistent; you're a bad friend.

  If you say it's the **Right Kind** (because it's a valid reason to be grateful), you have admitted that reasons about the *consequences of the attitude* can be the Right Kind. But if that's true, the Demon case comes back. The Demon says, "Admire me or I hurt you." The Friend says, "Accept this or I get hurt." Structurally, they are identical. Both are threats of pain contingent on your attitude.

  The FA theorist will try to squirm out of this. They'll say, "No, the sweater case is about *benevolence*, the Demon case is about *coercion*."
  But wait. You just defined the Right Kind of Reason by appealing to moral concepts (benevolence vs. coercion). But the whole point of FA theory is to *explain* value (like benevolence) in terms of reasons.
  *   **FA Claim:** Benevolence is good *because* there are reasons to be grateful for it.
  *   **Your Counter:** We only know which reasons count (the "Right Kind") *because* we already know benevolence is good.

  Do you see the trap? They are using value to explain reasons, and reasons to explain value. It's a circle. The "object vs. state" distinction tries to hide the circle, but the sweater case exposes it. The reason "it would hurt their feelings" counts as a Right Kind reason *only if* you already assume the friendship has value. The distinction doesn't do the work; your prior moral intuition does.

  ### 2. The "Aboutness" Problem
  Let's go deeper. The standard fix says: **Right Kind = Reasons about the object. Wrong Kind = Reasons about the attitude.**

  This assumes we can cleanly separate the object from the effects of the attitude. We can't.

  Imagine a boring, grey stick. I offer you a million dollars to admire the stick.
  *   **Standard View:** That's a Wrong Kind reason. It's about the money (consequence), not the stick.

  Now, imagine the stick is a magical artifact. Its intrinsic property is that *it brings joy to anyone who admires it.*
  Now you have a reason to admire the stick: "It brings joy."
  Is that reason about the **object** or the **state**?
  *   It's about the object! The object *has the property* of "bringing joy to admirers."
  *   But it feels exactly like the million-dollar case. You aren't admiring the stick for its stick-ness; you're admiring it for the payoff.

  If the FA theorist says, "No, that's still the Wrong Kind," they have to admit that some properties of the object generate Wrong Kind reasons. So "about the object" is not enough to guarantee a Right Kind reason.

  Conversely, consider a master artist. You are struggling to learn art. You force yourself to admire their technique, not because you naturally feel it, but because *cultivating that admiration will train your eye to see beauty.*
  *   This is a reason about your **state** (training your mind).
  *   But it seems like a perfectly legitimate, "Right Kind" reason to engage in the attitude of admiration. You are aligning your mind with value.

  If reasons about your own mental state can sometimes be the Right Kind (self-cultivation) and reasons about the object can sometimes be the Wrong Kind (the magic joy-stick), then the **Object/State distinction is dead.** It does not track the difference between Right and Wrong kinds of reasons.

  ### 3. The Circularity Charge
  Here is the argument you need to hammer home.

  The Fitting Attitude analysis wants to say:
  > **X is Good = There are Right Kind reasons to favor X.**

  To solve the Demon problem, they define "Right Kind" as:
  > **Right Kind = Reasons that are about the properties of X.**

  But as we saw with the magic stick, some properties of X generate instrumental reasons (Wrong Kind). And as we saw with the sweater, some consequences of the attitude (Right Kind) seem essential to the value.

  So, how do they filter the reasons? How do they decide which properties of X count?
  They say: "Only the properties that make X *merit* the attitude."
  But "merit" is just a synonym for "value" or "goodness."

  So the definition becomes:
  > **X is Good = There are reasons to favor X that are based on X's Goodness.**

  That is not an analysis. That is a tautology. They haven't explained what goodness *is*; they've just assumed we already know which reasons track goodness. The "Object vs. State" distinction was supposed to be the independent criterion that saved the theory from circularity. Since the distinction fails (as shown by the sweater and the magic stick), the theory collapses into circularity.

  ### 4. The Least Bad Escape
  So, is the Fitting Attitude account doomed? Not necessarily, but it has to swallow a hard pill. It has to stop pretending it can reduce value to something simpler (like "reasons").

  The least bad escape is to **abandon the reduction.**

  The FA theorist should stop trying to define "Good" as "There are reasons." Instead, they should argue that **Fittingness** is a primitive, unique normative relation.

  Here is the pitch:
  Don't say "Good means there are reasons." Say: "Goodness is the property that *makes* certain reasons the Right Kind."
  Admit that there is a basic, unexplainable connection between certain objects and certain attitudes. Admiration *fits* excellence. Gratitude *fits* benevolence. Fear *fits* danger.
  This "fittingness" isn't just about having a reason. You can have a reason to fear something safe (the Demon case), but it wouldn't be *fitting*.

  **Why is this the best escape?**
  1.  **It accepts the Sweater Intuition:** It allows us to say that "hurting feelings" is relevant to the fittingness of gratitude without needing to categorize it strictly as "object" or "state." Fittingness is holistic. It looks at the whole context (the friendship, the effort, the feelings).
  2.  **It Solves the Demon Case:** The Demon gives you a reason, but it doesn't make admiration *fitting*. The threat is external to the relationship between the attitude and the object.
  3.  **It Avoids Circularity:** It doesn't try to define Goodness *as* Reasons. It says Goodness and Reasons are linked by this primitive relation of Fittingness.

  **The Cost:**
  You lose the simplicity. You can't tell a high schooler "Good just means there are reasons." You have to say, "Good is a real property that calls for certain responses, and we recognize that call through a normative sense we call 'fittingness'."
  Some philosophers hate this because it sounds mystical. It sounds like saying "Opium puts you to sleep because of its dormitive virtue."
  But it's better than the alternative: a theory that claims to explain value but secretly relies on you already knowing what value is to make its distinctions work.

  ### The Verdict
  You are stuck on the sweater case because your moral intuition is smarter than the philosophical distinction. Your intuition knows that ignoring a friend's feelings is a failure of value, even if the "reason" is about the consequences of your attitude.

  The Object/State distinction fails because value isn't a static property sitting inside an object like sugar in a cup. Value is relational. It exists in the space *between* the object and the person. The sweater isn't valuable because of the wool (object) or because of your warmth (state). It's valuable because of the **relationship** the sweater represents.

  The Fitting Attitude account can survive, but only if it stops trying to be a machine that churns out "Good" from "Reasons." It needs to admit that recognizing the "Right Kind" of reason requires a prior sensitivity to value. The demon offers you a price; the friend offers you a bond. No amount of metaphysical distinction between "object" and "state" can capture that difference. Only a robust understanding of what human relationships *are* can do that.

  So, argue this: The distinction is a map that doesn't match the territory. The territory is messy, relational, and human. The map is clean, binary, and broken. Throw away the map.
