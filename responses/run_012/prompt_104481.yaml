prompt: |-
  I run food procurement for a mid-sized university dining service (roughly 8,000 meals a day) and I've been voluntold onto our "sustainable sourcing" working group, which in practice means I'm the one who has to sign off on the animal-protein contracts every quarter and defend it to the dining director and whoever shows up to the open forum. I read way too many rationalist/EA blogs, so I already know the standard moves, but the more I read the more it feels like every proposed procedure is either "eat less meat" or "eat less beef," and neither one survives contact with the actually weird corner of this debate. Two things keep tripping me up: (a) the beef-vs-chicken question, where chicken looks worse per calorie if you're counting lives, better if you're counting total suffering, and the whole ranking flips depending on how you weigh one broiler's short rotten life against one steer's longer one; and (b) the crop-cultivation point, that plant calories aren't free either since harvesting mows down field animals, so "swap beef for beans" isn't obviously a win and might even be a loss if you take wild/field-animal suffering seriously. I want a procedure my group can actually run each quarter, not another essay.

  So: give me a decision procedure. The questions to ask in order (starting from what we're buying and in what quantity, since volume obviously matters), what counts as a sufficient answer at each step, where the procedure simply says "this input doesn't change the ranking, move on," and where it stops and hands the thing to a human because it's a values call (like how to trade one animal's suffering against another's, or a life against a life). It needs to run in under an hour by someone who isn't a philosopher, it should say what to do when we genuinely can't get a number (which will be most of the time), and it has to be honest about which steps are just judgment calls wearing a lab coat. Then run it on two concrete contracts: switching our beef patties over to chicken, and switching our chicken over to a plant-based protein, with the field-animal thing switched on in both. And flag at least one case where the procedure tells me something I really won't want to hear. I'll fill in my own references, so don't bother with a reading list.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Food procurement for a mid-sized university dining service (8,000 meals/day).
      *   **Task:** Sign off on animal-protein contracts quarterly, defend to directors/forums.
      *   **Problem:** Standard sustainability advice ("eat less meat/beef") feels insufficient given specific ethical complexities (beef vs. chicken life/suffering trade-offs, crop cultivation field animal deaths).
      *   **Goal:** A practical *decision procedure* (algorithm/checklist) to run each quarter.
      *   **Constraints:**
          *   Must run in under an hour by a non-philosopher.
          *   Must handle missing data (common).
          *   Must identify where human value judgments are needed (vs. empirical facts).
          *   Must apply to two concrete cases: Beef $\to$ Chicken, Chicken $\to$ Plant (with field animals "switched on").
          *   Must flag at least one counter-intuitive/unwelcome result.
          *   No reading lists (user knows the literature).

  2.  **Deconstruct the Ethical/Empirical Tensions:**
      *   *Beef vs. Chicken:* Beef = fewer lives, higher GHG, longer life (potentially more suffering per animal but fewer animals). Chicken = more lives, lower GHG, shorter/intense suffering (potentially less suffering per animal but vastly more animals).
      *   *Plant vs. Animal:* Plants = field animal deaths (mice, voles, insects) + habitat loss. Animal = feed crops (more land) + slaughter.
      *   *Uncertainty:* Suffering metrics are subjective. Data on field deaths is sparse. Supply chains vary.

  3.  **Drafting the Decision Procedure (The "Algorithm"):**
      *   *Structure:* Needs to be linear, step-by-step, with "Stop/Go" criteria.
      *   *Time Limit:* 60 minutes max.
      *   *Inputs:* Contract volume (lbs), Protein type, Supplier specs.
      *   *Step 1: Volume & Baseline.* Establish the scale. (5 mins)
      *   *Step 2: The "Hard No" Filters.* Welfare certifications, legal compliance. If fail, reject. (10 mins)
      *   *Step 3: The Life Count.* Estimate number of individuals killed. (15 mins)
      *   *Step 4: The Suffering Weighting (The Value Call).* This is where the user needs to input a "Suffering Weight." (15 mins)
      *   *Step 5: The Field Animal Adjustment.* Apply a multiplier for crop deaths. (10 mins)
      *   *Step 6: The Uncertainty Buffer.* If data is missing, apply a precautionary principle. (5 mins)
      *   *Output:* Go/No-Go/Flag for Committee.

      *Refining the "Value Call":* The prompt asks to identify where it stops and hands to a human. I need to make sure the procedure doesn't pretend to solve the "how much does a chicken suffer vs. a cow" question. It needs to ask the user to *select* a weighting profile.

      *Refining the "Field Animal" issue:* This is the trickiest part. Most LCA (Life Cycle Assessment) ignores this. I need a rough heuristic (e.g., land use $\times$ death rate per hectare).

  4.  **Developing the Concrete Cases:**
      *   *Case A: Beef Patties $\to$ Chicken Patties.*
          *   Standard view: Chicken is better (lower carbon).
          *   EA/Rationalist view: Chicken might be worse (more lives, intense suffering).
          *   Field animals: Chicken needs feed crops, Beef needs pasture/feed. Beef usually uses more land.
      *   *Case B: Chicken $\to$ Plant Protein.*
          *   Standard view: Plant is best.
          *   Field animal view: Plant still kills field animals. Is it fewer than the chicken + its feed? Usually yes, but need to check.
      *   *The "Unwelcome Result":* The procedure needs to potentially suggest *keeping* the beef or *rejecting* the plant switch based on specific suffering weightings. The most likely "unwelcome" result for a sustainability group is: "Switching to plants increases field animal deaths more than it saves chicken lives" (unlikely but possible depending on assumptions) OR "Switching Beef to Chicken increases total suffering units." The latter is the classic EA counter-intuitive point. Let's aim for: "Under a 'Life Count' priority, Beef is better than Chicken."

  5.  **Drafting the Content - Step-by-Step:**

      *   *Header:* Keep it professional, bureaucratic but honest.
      *   *Phase 1: Data Intake.* (Volume, Type).
      *   *Phase 2: The Empirical Layer.* (Land use, Feed conversion, Mortality rates).
      *   *Phase 3: The Ethical Weights.* (This is the "Lab Coat" admission). Define profiles (Utilitarian, Prioritarian, Rights-based).
      *   *Phase 4: The Field Animal Multiplier.*
      *   *Phase 5: The Decision.*

  6.  **Refining the "Field Animal" Calculation:**
      *   Need a rough number. Let's use "Wild Animal Deaths per Hectare per Year."
      *   Plant protein: Direct land use.
      *   Animal protein: Land use for feed + pasture.
      *   *Crucial nuance:* Pasture might displace fewer field animals than intensive cropping (depending on the ecosystem). But feed crops for chickens are intensive.

  7.  **Running the Simulation (Mental Check):**
      *   *Beef to Chicken:*
          *   Beef: 1 cow = ~500kg meat. 8000 meals/day... let's say 1000 beef meals. That's 2 cows/day? No, 8000 meals total. Say 20% beef = 1600 meals. 1 cow yields ~400 meals (quarter pounders). So 4 cows/day.
          *   Chicken: 1 broiler = ~2kg meat. 1600 meals = 1600 chickens/day.
          *   Lives: 4 vs 1600. Huge difference.
          *   Suffering: Cow (18 months) vs Chicken (6 weeks).
          *   If 1 cow suffering > 400 chicken suffering, Beef wins. If not, Chicken wins.
          *   Field animals: Beef needs more land. More field deaths for beef.
          *   *Conflict:* Lives say Beef. Land/Field Animals say Chicken.
      *   *Chicken to Plant:*
          *   Chicken: 1600 lives + Feed crop deaths.
          *   Plant: 0 chicken lives + Direct crop deaths.
          *   Feed conversion is inefficient. 1kg chicken needs ~2kg feed.
          *   So Plant protein usually uses less land than Chicken feed.
          *   Result: Plant wins on field animals *and* chicken lives.
          *   *Wait, I need an unwelcome result.*
          *   Let's make the unwelcome result about the Beef/Chicken switch. Most sustainability groups want to ditch beef for carbon. But if the metric is "Suffering," Chicken might be worse.
          *   *Alternative Unwelcome Result:* What if the Plant option requires intensive monoculture that wipes out a specific high-sentience field population? (Too specific).
          *   *Better Unwelcome Result:* The procedure indicates that under a "Life Count" metric, sticking with Beef is ethically superior to switching to Chicken, even though Chicken has lower carbon. This contradicts the "Sustainable Sourcing" group's usual carbon focus.

  8.  **Finalizing the Procedure Structure:**
      *   **Name:** The "Procurement Ethics Triage Protocol" (PETP).
      *   **Time:** 60 mins.
      *   **Sections:**
          1.  Scope & Volume (10 min)
          2.  The Empirical Ledger (20 min)
          3.  The Weighting Key (15 min) - *This is the values call.*
          4.  The Field Adjustment (10 min)
          5.  Verdict & Uncertainty Flag (5 min)
      *   **Missing Data Rule:** Use "Precautionary Upper Bound."

  9.  **Writing the Response:**
      *   Tone: Bureaucratic, direct, slightly cynical but rigorous. Acknowledge the "weird corner" of the debate.
      *   Avoid preaching.
      *   Ensure the "Unwelcome Result" is clearly flagged in the simulation.

      *(Self-Correction during drafting)*: Make sure I don't get bogged down in specific numbers for the procedure itself. The procedure should tell them *where to get* the numbers or what to do if they don't have them. The *simulation* will use the numbers.
      *   *Correction on Field Animals:* Be honest that this data is garbage. Use a "Land-Use Proxy."
      *   *Correction on Values:* Explicitly state "Select Profile A, B, or C." Don't try to calculate suffering yourself.

  10. **Final Review against constraints:**
      *   Under an hour? Yes, steps are timed.
      *   Non-philosopher? Yes, uses profiles.
      *   Missing data? Yes, "Precautionary Principle" step.
      *   Honest about judgment calls? Yes, "Weighting Key" section.
      *   Two contracts run? Yes.
      *   Unwelcome result flagged? Yes.

      *Let's refine the "Unwelcome Result".*
      If the group cares about "Sustainable Sourcing," they usually care about Carbon.
      If I show them that Low Carbon (Chicken) = High Suffering (Lives), that's the conflict.
      The unwelcome result should be: "The procedure recommends rejecting the Chicken switch if the primary metric is Individual Harm, despite the Carbon win."
      OR: "The procedure suggests the Plant switch might be neutral/negative if field animal density is high and crop intensity is massive."
      Let's go with the Beef/Chicken tension. It's the classic EA dilemma. Switching from Beef to Chicken reduces carbon but might increase total suffering units depending on the weight assigned to duration vs. intensity.
      Actually, the prompt asks for *one* case where the procedure tells me something I won't want to hear.
      I will make the Beef $\to$ Chicken simulation result in a "No-Go" based on a "Life-Centric" weighting, which contradicts the standard "Red Meat is Bad" narrative.

      *Wait, one more check on Field Animals:*
      If we switch Chicken $\to$ Plant.
      Chicken: 1 life + Feed Crop Deaths.
      Plant: 0 lives + Direct Crop Deaths.
      Since Feed Conversion Ratio (FCR) for chicken is ~1.6:1, eating plants directly is more land efficient.
      So Plant *should* win on field animals too.
      Unless... the plant protein is highly processed or imported from high-mortality regions?
      Let's keep the Field Animal thing as a "Uncertainty Flag" rather than a hard reversal for the Plant case, to remain realistic. The Beef/Chicken reversal is stronger.

      *Wait, I need to make sure I address the "Field Animal" point specifically in the prompt's request.*
      "run it on two concrete contracts... with the field-animal thing switched on in both."
      Okay, I will ensure the Field Animal calculation is explicit in both simulations.

      *Final Plan:*
      1.  Introduction: Acknowledge the messiness.
      2.  The Protocol (5 Steps).
      3.  The "Values Key" (The honest admission of subjectivity).
      4.  Simulation 1: Beef $\to$ Chicken.
      5.  Simulation 2: Chicken $\to$ Plant.
      6.  The Unwelcome Result Flag.

      *Let's write it.*
answer: |-
  # The Procurement Ethics Triage Protocol (PETP)
  **Version:** 1.0 (Internal Use)
  **Time Budget:** 60 Minutes
  **Operator:** Procurement Officer (You)
  **Purpose:** To generate a defensible recommendation on protein contracts that accounts for direct slaughter, indirect field deaths, and uncertainty, without requiring a degree in moral philosophy.

  ---

  ## Part 1: The Procedure

  ### Step 1: Scope & Volume (10 Minutes)
  **Input:** Contract volume (lbs), Meal count, Protein Type.
  **Action:** Calculate the **Daily Individual Count (DIC)**.
  *   *Formula:* `(Total Lbs per Quarter) / (Average Carcass Weight per Animal) / 90 Days`.
  *   *Missing Data Rule:* If carcass weight is unknown, use industry standard averages (USDA NASS). If volume is variable, use the *maximum* contracted volume (Precautionary Principle).
  **Sufficient Answer:** A single integer representing animals slaughtered per day for this contract.
  **Stop Condition:** If DIC = 0 (e.g., pure lab-grown or dairy-only), skip to Step 4.

  ### Step 2: The Empirical Ledger (20 Minutes)
  **Input:** Supplier specs, Land Use Data.
  **Action:** Populate three rows. Do not judge yet, just record.
  1.  **Direct Lives:** The DIC from Step 1.
  2.  **Land Footprint:** Hectares required per quarter for this protein (include feed crops for animals).
      *   *Missing Data Rule:* Use meta-analysis averages (e.g., Poore & Nemecek) based on protein type. Flag if supplier claims "regenerative" but provides no data.
  3.  **Welfare Certification:** Binary (Yes/No). Does it meet the baseline (e.g., GAP Step 2, Organic, or equivalent)?
  **Sufficient Answer:** Three data points: `[Count]`, `[Hectares]`, `[Cert Y/N]`.
  **Stop Condition:** If Welfare Cert is "No," auto-reject unless a waiver is signed by the Director (Step 6).

  ### Step 3: The Field-Animal Adjustment (10 Minutes)
  **Input:** Land Footprint from Step 2.
  **Action:** Apply the **Field Mortality Multiplier (FMM)**.
  *   *Rationale:* Harvesting crops kills field animals (mice, voles, insects).
  *   *Formula:* `Hectares × Regional Field Death Rate`.
  *   *Default Rate:* Use 15 sentient-field-deaths/hectare/harvest (conservative estimate for row crops). Pasture gets 0.5× multiplier (lower intensity).
  *   *Output:* **Indirect Lives (IL)**.
  **Sufficient Answer:** A single integer added to the Direct Lives.
  **Honesty Check:** This number is a guess. Mark it "Low Confidence."

  ### Step 4: The Weighting Key (15 Minutes) — *THE VALUES CALL*
  **Input:** Total Lives (Direct + Indirect) + Contract Type.
  **Action:** Select **One** Ethical Profile. You cannot mix these. This is where you stop pretending this is math and admit it is policy.
  *   **Profile A (Life Minimization):** Every individual death counts as 1 unit. Duration of life does not matter.
      *   *Score:* `Total Lives`.
  *   **Profile B (Suffering Intensity):** Short, intense lives count more. Broilers count as 1.0, Steers count as 0.5 (due to longer life/lower density suffering per hour, debatable but fixed for procedure). Field animals count as 0.1 (neurological complexity discount).
      *   *Score:* `(Direct Lives × Intensity Weight) + (Indirect Lives × 0.1)`.
  *   **Profile C (Duration-Weighted):** Longer lives represent more lost potential. Steers count as 5.0, Broilers as 1.0. Field animals 0.1.
      *   *Score:* `(Direct Lives × Duration Weight) + (Indirect Lives × 0.1)`.
  **Sufficient Answer:** A weighted "Harm Score."
  **Stop Condition:** If the group cannot agree on a Profile, default to **Profile A** (simplest to defend publicly).

  ### Step 5: Verdict & Uncertainty Flag (5 Minutes)
  **Input:** Harm Score of New Contract vs. Current Contract.
  **Action:** Compare.
  *   If New Score < Current Score: **Recommend Approval.**
  *   If New Score > Current Score: **Recommend Rejection.**
  *   If Data Missing > 30%: **Attach "High Uncertainty" Flag.**
  **Output:** A one-paragraph memo justification citing the Profile used.

  ---

  ## Part 2: Simulation Run

  **Context:** 8,000 meals/day.
  **Current Contract:** 20% Beef Patties (1,600 meals/day).
  **Proposal 1:** Switch Beef Patties to Chicken Patties.
  **Proposal 2:** Switch Chicken Patties to Plant-Based (Pea/Lentil).
  **Assumptions:** Field-Animal Switch is ON (Step 3 active). Profile A (Life Minimization) is the default for public defense, but we will check Profile B for internal honesty.

  ### Simulation 1: Beef $\to$ Chicken

  **Step 1: Scope**
  *   **Beef:** 1,600 meals @ 4oz patty = 400lbs meat/day. Avg steer yield ~500lbs meat. **DIC = 0.8 cows/day.**
  *   **Chicken:** 1,600 meals @ 4oz patty = 400lbs meat/day. Avg broiler yield ~4lbs meat. **DIC = 100 chickens/day.**

  **Step 2: Empirical Ledger**
  *   **Beef Land:** High (Pasture + Feed). Est. 5 hectares/quarter.
  *   **Chicken Land:** Low (Feed only). Est. 1 hectare/quarter.
  *   **Welfare:** Both meet baseline.

  **Step 3: Field Adjustment**
  *   **Beef:** 5 hectares × 0.5 (pasture multiplier) × 15 rate = **37.5 Indirect Lives.**
  *   **Chicken:** 1 hectare × 1.0 (row crop multiplier) × 15 rate = **15 Indirect Lives.**

  **Step 4: Weighting Key (The Crunch)**
  *   **Profile A (Life Count):**
      *   Beef Total: 0.8 (Direct) + 37.5 (Indirect) = **38.3 Units.**
      *   Chicken Total: 100 (Direct) + 15 (Indirect) = **115 Units.**
      *   *Result:* **Chicken is 3× Worse.**
  *   **Profile B (Suffering Intensity):**
      *   Beef (Weight 0.5): (0.8 × 0.5) + (37.5 × 0.1) = 0.4 + 3.75 = **4.15 Units.**
      *   Chicken (Weight 1.0): (100 × 1.0) + (15 × 0.1) = 100 + 1.5 = **101.5 Units.**
      *   *Result:* **Chicken is 24× Worse.**

  **Step 5: Verdict**
  *   **Recommendation:** **REJECT.** Stick with Beef.
  *   **Uncertainty Flag:** High confidence on Direct Lives. Low confidence on Field Deaths.

  ### Simulation 2: Chicken $\to$ Plant

  **Step 1: Scope**
  *   **Chicken:** 100 chickens/day (from above).
  *   **Plant:** 0 Direct Lives.

  **Step 2: Empirical Ledger**
  *   **Chicken Land:** 1 hectare (feed).
  *   **Plant Land:** 0.4 hectares (direct human food crops are more efficient).

  **Step 3: Field Adjustment**
  *   **Chicken:** 15 Indirect Lives (from feed).
  *   **Plant:** 0.4 hectares × 1.0 × 15 rate = **6 Indirect Lives.**

  **Step 4: Weighting Key**
  *   **Profile A (Life Count):**
      *   Chicken Total: 100 + 15 = **115 Units.**
      *   Plant Total: 0 + 6 = **6 Units.**
      *   *Result:* **Plant is 19× Better.**
  *   **Profile B (Suffering Intensity):**
      *   Chicken Total: 101.5 Units.
      *   Plant Total: (6 × 0.1) = **0.6 Units.**
      *   *Result:* **Plant is 169× Better.**

  **Step 5: Verdict**
  *   **Recommendation:** **APPROVE.**
  *   **Uncertainty Flag:** Low. Even if field death rates are double, Plant wins.

  ---

  ## Part 3: The Unwelcome Result & Defense

  **The Flag:**
  In Simulation 1 (Beef $\to$ Chicken), the procedure tells you to **reject the switch to chicken.**

  **Why you won't want to hear this:**
  Your "Sustainable Sourcing" working group likely equates "Sustainability" with "Carbon Footprint." Beef has a much higher carbon footprint than chicken. By rejecting the chicken switch, you are prioritizing *individual animal harm* over *climate metrics*. In an open forum, a student or faculty member will stand up and say, "You are choosing the higher-carbon option. Why?"

  **How to defend it (using the Protocol):**
  1.  **Acknowledge the Trade-off:** "Under Step 4, we selected Profile A (Life Minimization). This is a values choice, not a scientific one."
  2.  **Show the Math:** "While Carbon decreases, the Daily Individual Count increases from <1 to 100. Even accounting for field animals killed in crop production (Step 3), the chicken contract results in 3× more total deaths."
  3.  **The "Lab Coat" Admission:** "If the University's priority is strictly Carbon, we should approve Chicken. If the priority is Harm Reduction, we must keep Beef or move to Plants. We cannot claim Chicken is 'more ethical' across all metrics."

  **The "Field Animal" Reality Check:**
  Notice that in Simulation 1, the Field Animal deaths (37.5 for Beef) almost swamp the Direct Beef deaths (0.8). If you ignore field animals, Beef looks like 1 death vs 100 deaths. If you count field animals, it's 38 vs 115. The *ratio* stays similar, but the absolute numbers suggest that **land use is the dominant driver of harm in the Beef contract**, whereas **slaughter is the dominant driver in the Chicken contract.**

  **Final Instruction:**
  Run this protocol. If the result is "Reject Chicken," do not bury it. Submit the "High Uncertainty" flag on the Field Death rates and ask the Director to sign off on the *Values Profile* (Step 4). Make them own the weightings. You are the procurement officer, not the university's moral arbiter.
