answer: |-
  First, I have checked your math and you are correct, which is a relief because this specific payoff structure is the linchpin of the whole session. Strategy C yields 1 against A, 5 against B, and 2 against C. A fifty-fifty lottery between A and B yields 10 against A, 6 against B, and 3 against C. Since ten is greater than one, six is greater than five, and three is greater than two, the lottery strictly dominates C. Once C is removed, A yields 12 against A and 8 against B, while B yields 8 against A and 4 against B, so A strictly dominates B. The unique rationalizable outcome is A played by both players. You have a solid game for this purpose.

  Here is how you run the eighty minutes. You need to print one payoff sheet per pair of students that clearly lists the points for each combination of choices, and you need to prepare three index cards per student labeled A, B, and C. You will also need one coin for every two pairs, so five coins total, plus one for yourself. Seat the eighteen students in nine pairs facing each other. Tell them they will play a simple game for points across several rounds and that the pair with the highest cumulative score at the end wins a candy bar each. Do not explain game theory. Do not explain dominance. Do not explain rationality. Just tell them that in each round they will simultaneously place one card face down, flip them over, check the sheet for their points, record the score, and repeat.

  Spend the first ten minutes on rules and a practice round. Hand out the sheets and cards. Walk through one example on the board using dummy choices so they know how to read the matrix. Emphasize that they cannot talk to their partner during the choice phase. Run one practice round that does not count for scores to ensure everyone knows how to read the payoff table. This is crucial because confusion about the matrix will derail the lesson later.

  Run the first official round for ten minutes. Let them play three hands against the same partner and sum the scores. Collect the data on how many A, B, and C cards were played across the room. You will likely see a mix, with a significant number of C cards played because C beats B. Spend the next five minutes tallying the results on the board without commentary. Just show the frequency of each choice.

  Now begin the critical discussion phase for fifteen minutes. Ask the class why anyone played C. Someone will say it beats B. Ask if anything beats C. They will look at the matrix. A beats C when the opponent plays A, but loses when the opponent plays C. B beats C when the opponent plays B, but loses when the opponent plays A. You need to facilitate this until someone says out loud that no single option beats C in every case. Write this on the board: No pure strategy dominates C. This is the cognitive hook. They believe C is rationalizable because it is a best response to B.

  Now intervene for ten minutes without naming the concept. Tell them you want to test a hunch. Take a coin and tell them you are going to let the coin choose your card for you. Heads is A, tails is B. Ask them to calculate the expected payoff of this coin flip against an opponent playing A. They should see it is 10. Ask them what C gets against A. It is 1. Ask them to calculate the coin flip against an opponent playing B. It is 6. Ask what C gets against B. It is 5. Ask them to calculate the coin flip against an opponent playing C. It is 3. Ask what C gets against C. It is 2. Ask them if there is any column where C scores higher than the coin flip. They will see there is not. You have now demonstrated that a lottery dominates C even though no single card does. Tell them that because rational players should not play strictly dominated options, we are going to ban C for the next round. Collect all C cards.

  Run the second phase for fifteen minutes. Students now only have A and B cards. They play three hands against their partner. Tally the results. You will likely see B played often because it is safe against A compared to the loss of playing A against A if they were risk-averse, or simply because they haven't done the second elimination yet. Spend ten minutes discussing this reduced game. Ask if anything dominates B now that C is gone. They will see A scores 12 against A and 8 against B, while B scores 8 against A and 4 against B. A strictly dominates B in this reduced set. Have them cross B off their sheets.

  Run the final phase for five minutes. They only have A cards. They play three hands. Obviously, they both play A every time. This takes very little time.

  Use the final twenty minutes for the debrief, and this is where you name the ideas. Start by distinguishing the tool from the solution. The lottery that killed C was a fifty-fifty mix of A and B, but the solution to the game is pure A. Make sure they see that the justification for removing C (the mix) is not the same as the final recommendation (pure A). This prevents the misconception that rational play involves flipping coins here. Explain that iterated elimination of strictly dominated strategies is a procedure that shrinks the set of permissible options. It tells you what you cannot play, not necessarily what you will play, though in this specific case it shrinks all the way to a single point.

  Address the order of elimination. Acknowledge that in this specific game, they could not have eliminated B first because B was not dominated at the start. You cannot empirically show them order independence with this specific matrix because there is only one valid first step. You must be honest about this limitation. Tell them that in games where multiple options are dominated simultaneously, the order does not matter for the final set, but this activity only demonstrated the unraveling chain, not the branching paths. This is a key limitation to admit so they do not overgeneralize from the activity.

  Address the difference between the procedure and prediction. The procedure identifies rationalizable strategies. If you played this with real people in a bar, they might play C. The theory says they shouldn't if they are rational and believe you are rational and so on. The activity shows the logic of rationality, not the psychology of behavior.

  Here is what will predictably go wrong. Students will confuse the dominating lottery with the solution. They will think because a mix beat C, they should play a mix. You must hammer home that the mix was a diagnostic tool, not a prescription. Another failure mode is that students will treat the points as money and become risk-averse. They might prefer the guaranteed 5 from C against B over the risky 1 from A against C, even if the expected value is lower. Since you are using points for a candy bar, risk aversion should be low, but it may still exist. If they argue risk, remind them that strict dominance holds regardless of risk preferences if we are talking about expected utility, but since this is a one-shot game in their minds, they might not think in expectations. You need to insist they look at the numbers strictly.

  Another predictable issue is that they will try to coordinate on B because 4 is better than 2, forgetting that A is available. When you eliminate C, some pairs might settle on B,B because it feels safer than A,A if they distrust the elimination logic. When you reveal A dominates B in the second stage, this should resolve, but be prepared for pairs who insist B is better because it avoids the low payoff of A against C, even though C is gone. You must remind them that C is gone. It is no longer an option. You cannot play against C anymore.

  Regarding limitations, be straight with yourself and them. This activity cannot reproduce the order independence of elimination empirically because the game only allows one path. You cannot show them that eliminating B first (if it were possible) would lead to the same spot. You also cannot reproduce the full weight of common knowledge of rationality. They are following your instruction to eliminate C, not deriving it solely from their own belief about your rationality. The activity demonstrates the mechanics of the elimination, not the epistemic conditions required for it to hold in the wild. Finally, this game solves to a pure strategy. It does not help them understand games where the solution is itself a mixed strategy, which is a separate and harder concept. Do not let them conflate dominance by a mix with equilibrium in mixed strategies.

  If you keep the lecture to the end, force them to do the math themselves during the discussion phases, and remain strict about the rules of the reduced games, this will work. The moment they realize C is vulnerable to a coin flip is the moment the philosophy clicks, so protect that discovery phase. Do not tell them about the coin until they have exhausted the pure strategy comparisons. Make them feel the frustration of not being able to dismiss C with a single card before you hand them the lottery. That frustration is where the learning happens.
