answer: |-
  This is a classic friction point in social philosophy, and your intuition is spot on: your friend is simplifying things too much. While conventions and norms often look identical in the wild (like your tabs vs. spaces example), they rely on different underlying mechanisms to stay stable.

  Since you're a backend engineer, think of it like this: **Conventions are like API protocols; Norms are like Rate Limiting and WAF rules.**

  Here is the straight comparison you asked for, breaking down the definitions, the mechanics, and the "suboptimal" edge case.

  ### 1. The Lewisian Convention (The Protocol)

  David Lewis's account is strictly game-theoretic. For a regularity to be a **Convention**, it needs to satisfy three main conditions:

  1.  **Arbitrariness:** There is at least one other alternative that could have worked just as well (e.g., driving on the right instead of the left).
  2.  **Conditional Preference:** I prefer to do X *only if* I expect you to do X. If you drive on the left, I prefer to drive on the left. If you drove on the right, I'd prefer that too. I don't care about the side; I care about the *match*.
  3.  **Common Expectation:** Everyone knows everyone else is doing X, and everyone knows that everyone knows.

  **The Mechanism of Stability:**
  The "punishment" for breaking a convention is **natural**, not social. If you drive on the right in a left-driving country, the "punishment" is a head-on collision. The system is self-enforcing because deviation leads to immediate utility loss for the deviator. No one needs to yell at you; physics handles the enforcement.

  ### 2. The Social Norm (The Firewall)

  A **Norm** is broader and introduces a specific social layer. For a regularity to be a **Norm**, it typically requires:

  1.  **Normative Expectation:** It's not just that I expect you to do X; I expect that you believe you *ought* to do X.
  2.  **Sanctions:** If you break the rule, others in the group will impose a cost (mockery, ostracization, loss of status).
  3.  **Potential Conflict:** Unlike conventions, norms often persist even when the individual *doesn't* want to conform, solely because the social cost of deviation is higher than the cost of compliance.

  **The Mechanism of Stability:**
  The "punishment" is **artificial/social**. If you wear a tuxedo to a beach wedding, the sun won't burn you and the sand won't reject you. But people will judge you. That social friction is what keeps the norm in place.

  ---

  ### 3. Addressing Your Specific Cases

  #### The Tabs vs. Spaces Case
  You asked: *Is that a convention because it's arbitrary, or a norm because there's social pressure?*

  **It is a Convention that has been wrapped in a Norm.**
  *   **Convention layer:** The code needs to be consistent to be readable. If you use spaces and everyone else uses tabs, the diff logs look terrible. That is a "natural" coordination failure (like crashing cars).
  *   **Norm layer:** The "gentle mocking" is the added social sanction. The code might still compile if you use spaces, but the team makes your life unpleasant.

  **Does the answer change how you explain why it sticks?**
  Yes. If it were *purely* Lewisian, you would explain it by saying: "New hires switch to tabs because they want their code to merge cleanly." If it involves Norms, you explain it by saying: "New hires switch to tabs because they don't want to be seen as outsiders." The latter explains why the practice persists even in cases where the technical difference is negligible (e.g., a private branch no one else sees).

  #### The Suboptimal Driving Case
  You asked: *Imagine we all drive on the left but we'd all be happier on the right. No one can switch alone. Can Lewis describe this?*

  **Yes, Lewis can describe this.**
  This is the part that usually trips people up. Lewis does **not** require a convention to be the *best possible* solution globally. He only requires it to be a **Nash Equilibrium**.
  *   **Lewis's View:** Even if we'd all prefer the Right, as long as I prefer Left *given that you are driving Left*, it counts as a convention. The fact that we are stuck in a "local maximum" doesn't disqualify it. The stability comes from the fact that unilateral deviation is suicide.
  *   **The Norm View:** This is where norms add explanatory power. If the group is stuck in a suboptimal equilibrium, norms explain why we can't *coordinate* the switch. If someone tries to organize a "Switch to Right Day" and gets punished (socially sanctioned for rocking the boat), that is a Norm preventing the transition.

  **So, does Lewis need norms to make sense of this?**
  No. Lewis explains why the *current state* is stable (fear of crashing). Norms explain why the *transition* to a better state is blocked (fear of social sanction).

  ---

  ### 4. The Straight Comparison

  Here is the breakdown of where they overlap and where they diverge.

  | Feature | Lewisian Convention | Social Norm |
  | :--- | :--- | :--- |
  | **Primary Goal** | Coordination (solving a matching problem). | Regulation (enforcing a standard of behavior). |
  | **Arbitrariness** | **Required.** Must be an alternative that works. | **Optional.** Some norms are non-arbitrary (e.g., "don't hurt people"). |
  | **Enforcement** | **Natural consequences.** (Crash, code break, meeting confusion). | **Social sanctions.** (Mockery, firing, shunning). |
  | **Motivation** | "I do this because it helps me get what I want." | "I do this because I should / to avoid trouble." |
  | **Deviation** | Deviator hurts themselves primarily. | Deviator hurts the group / violates trust; Group hurts deviator. |

  ### 5. Can One Be Reduced to the Other?

  Your friend thinks they are the same thing. This is the "Reductionist" view.
  **The Verdict: They are genuinely different beasts, though they often coexist.**

  You cannot reduce Norms to Conventions because Norms can sustain behaviors that are **not** coordination equilibria.
  *   *Example:* A norm of "buying the first round of drinks." This isn't a coordination problem. Everyone would prefer *not* to buy the round while others do. It's a Prisoner's Dilemma. The only reason people do it is the social sanction (being called cheap). Lewis's convention model doesn't work here because there is no "matching" preference. I don't want to match your spending; I want to save money.

  You cannot reduce Conventions to Norms because Conventions work **without** social sanctions.
  *   *Example:* Two strangers meeting in a large crowd. They both decide to stand by the fountain. No one is watching, no one can mock them. They just did it because it was the obvious focal point. That is a pure convention with zero normativity.

  ### 6. Summary for Your Reading Group

  1.  **Conventions** solve coordination problems where the main cost of deviation is **failure to coordinate** (crashing, breaking the build).
  2.  **Norms** solve cooperation problems where the main cost of deviation is **social sanction** (shame, status loss).
  3.  **Overlap:** Most real-world things (like tabs/spaces) are Conventions *backed by* Norms. The convention makes the rule useful; the norm makes the rule sticky.
  4.  **The Suboptimal Case:** Lewis explains why we stay stuck (unilateral deviation is bad). Norms explain why we can't organize a jump (social punishment for agitators).

  **The "Extra Steps" Answer:**
  Punishment *is* doing real work. In a pure convention, if I can deviate without crashing (e.g., using spaces on a weekend project no one sees), I might do it. In a norm, I won't do it even then, because I've internalized the rule or fear the reputation hit. The punishment changes the incentive structure from "Does this work?" to "Is this allowed?"

  If you tell your friend this: **"Conventions are about equilibrium; Norms are about enforcement. You can have an equilibrium without enforcement, but you can't have enforcement without changing the equilibrium."** That should settle it.
