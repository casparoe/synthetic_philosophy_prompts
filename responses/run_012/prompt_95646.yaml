      *   **Therapist (Functionalism/Interventionism):** Causation is about manipulation. If changing $X$ changes $Y$, $X$ causes $Y$. Anxiety is a valid variable to manipulate.
      *   **The Conflict:** Exclusion Problem (Jaegwon Kim). If the physical cause is sufficient, does the mental cause do any work?

  3.  **Evaluate "Both Literally True":**
      *   Can they both be *literally* true?
      *   GP says: "Anxiety causing insomnia... doesn't add anything." (Implies it's not a *fundamental* cause).
