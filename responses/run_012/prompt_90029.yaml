answer: |-
  This is a classic formulation of the **Paradox of Hypocrisy** (sometimes associated with the "Tu Quoque" problem in moral philosophy). Your suspicion is correct: the argument relies on an equivocation regarding the granularity of the "demand" being invoked.

  ### Diagnosis: The Equivocation on "The Demand"

  The argument appears valid because it slides between two conceptions of the moral demand involved in blaming.
  1.  **The Specific Demand:** When I blame you for lying, I invoke the demand "Do not lie."
  2.  **The General Demand:** When I blame you, I invoke the demand "Be a morally compliant agent" (or "Do not breach demands").

  Premise (2) is plausible when read with the **Specific Demand** (a liar lacks standing to blame for lying). Premise (3) is plausible when read with the **General Demand** (any sin breaches the demand to be sinless). Premise (4) is the pivot that falsely equates them. It claims that *any* lapse breaches the demand *all blaming invokes*. But blaming typically invokes the specific norm violated, not the general norm of moral perfection.

  ### Why Step (4) Must Go

  **Step (4)** is the least costly premise to abandon. It asserts that a single lapse places one in breach of "the very demand that all blaming invokes." This is false because blaming is typically **norm-specific**. When a teacher corrects a student's grammar while having poor grammar themselves, the teacher is invoking the demand "Write correctly," not "Be a perfect writer." The teacher's breach of "Write correctly" might undermine standing (per Premise 2), but their breach of "Be kind" (a different lapse) does not.

  **Why it looked compelling:** It exploits the intuition that moral authority is a **global status**. We tend to think of "standing" as a kind of moral credit score; if your score drops below zero due to any lapse, you are bankrupt. However, standing is better understood as **local jurisdiction**. You lose authority over the specific norm you violate, not over the moral law as a whole.

  ### Costs of the Main Responses

  1.  **Abandoning (2) (The Colleague's View):**
      *   **Cost:** This severs the link between integrity and authority. It implies a moral monster has the same standing to blame as a saint, provided they aren't currently doing the exact thing they are blaming. It renders the concept of hypocrisy morally inert.
      *   **Concession:** The critic must admit that hypocrisy is merely an aesthetic flaw, not a normative disqualifier.

  2.  **Abandoning (4) (The Recommended View):**
      *   **Cost:** This requires a theory of **relevance**. We must explain *why* a thief lacks standing to blame for theft, but a liar might retain standing to blame for theft. We need to define the "sphere of similarity" required for hypocrisy to defeat standing.
      *   **Concession:** The critic must admit that standing is fragmented. One can be a legitimate blamer in some domains while being illegitimate in others.

  ### Defender vs. Critic Concessions

  *   **The Defender of Lost Standing (accepts Conclusion 6):** Must concede that the moral community is impossible. If no one has standing, moral address is merely aggression or noise. They must also concede that the victim's intuition in (7) is a systematic illusion.
  *   **The Critic (rejects Conclusion 6):** Must concede that standing is not a property of the *person* but of the *relationship relative to the norm*. You are not "a person with standing"; you are "a person with standing *regarding $\phi$*."

  ### Implications for Extended Cases

  If the argument is repaired by rejecting (4) and adopting the **Specific Demand** view:

  *   **Self-Blame:** This is strengthened. If standing were global, a sinner could not blame themselves (as they lack standing). If standing is local, I can hold myself accountable for specific lapses even if I am generally flawed. The "fragmented self" can address the "failing self."
  *   **Blame of the Dead:** This remains problematic but for different reasons. The dead cannot be "in breach" of current demands (they have no agency). However, if standing requires a live address (per Premise 1), the dead cannot be blamed regardless of hypocrisy. The hypocrisy argument doesn't add much here.
  *   **Institutions:** This weakens the argument against institutions. Institutions do not "lapse" in the same psychological sense as individuals. An institution can uphold a specific demand (e.g., "Pay taxes") even if its members individually lapse elsewhere. The specificity defense protects institutional standing more robustly than individual standing.

  ### Summary

  The argument fails because it treats moral standing as a monolithic property rather than a contextual permission. By rejecting (4), you preserve the intuition that hypocrisy matters (2) without succumbing to nihilism (6). You acknowledge that while perfection is not required for blame, **integrity regarding the specific norm at issue** is.

  Verdict: (4) — it equivocates between specific norms and general compliance.
