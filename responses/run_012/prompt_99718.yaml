  # JOINT STATEMENT ON THE CONCEPTION OF POLITICAL LIBERTY
  **Signatories:** N (Negative Liberty Proponent) & R (Neo-Republican Proponent)
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on the Nature of Freedom

  ## 1. AGREED CLAIMS
  *We, the undersigned, affirm the following propositions as the common ground of our debate. These claims are specific enough to rule out alternative theories and robust enough to sustain our disagreement.*

  1.  **The Object of Tracking:** We agree that "freedom" in this context refers to a social and political status of individuals relative to other agents, not a metaphysical capacity of the will (determinism is irrelevant) nor an internal psychological state (self-mastery is distinct).
  2.  **Paradigm Violations:** We agree that the following conditions definitively reduce an agent's freedom: physical restraint (chains, imprisonment), direct coercive threats ("Do X or I will harm Y"), and active interference with chosen actions by another agent.
  3.  **The Agency Requirement:** We agree that a mere lack of ability (e.g., I cannot fly because I lack wings; I cannot buy a yacht because I lack money) does not constitute a violation of freedom *unless* that lack of ability is the result of another agent's interference or domination. Natural constraints are not political unfreedom.
  4.  **Rejection of Positive Liberty:** We agree that the "Positive Liberty" tradition (freedom as self-realization, rational autonomy, or overcoming internal addiction) is a distinct concept. We are not arguing about whether a person is "truly" free if they act on base desires; we are arguing about their external relation to other powers.
  5.  **Methodological Stance:** We acknowledge we are not merely performing lexical analysis of the English word "freedom." We are arguing about which concept—Non-Interference (N) or Non-Domination (R)—better captures the political value we intend to protect when we invoke "liberty" in constitutional and legal design.
  6.  **Mutual Rejection of Counterexamples:**
      *   N agrees that R's examples of "structural vulnerability" describe a genuine political evil, but denies they are instances of *unfreedom*.
      *   R agrees that N's examples of "direct coercion" are instances of domination, but denies they exhaust the category of unfreedom.
      *   We both reject the claim that "freedom" can be increased by manipulating an agent's desires to match their available options (the "sour grapes" solution).

  ## 2. DISAGREEMENTS TABLE
  *The following table isolates the precise residual disagreements. Wording has been vetted to ensure neither side feels misrepresented.*

  | Issue | N's Position (Negative Liberty) | R's Position (Neo-Republican Liberty) |
  | :--- | :--- | :--- |
  | **(a) Unexercised Capacity**<br>*(The Master who sleeps)* | The mere *capacity* to interfere, without *exercise*, affects a person's **security**, not their **freedom**. Freedom is an opportunity concept: if the door is open, you are free to walk through it, regardless of whether someone holds a key to lock it later. | The mere *capacity* to interfere arbitrarily affects a person's **freedom status**. Freedom is a relational status: if someone holds the key, you are not free, even if the door is currently open, because your movement exists by their leave. |
  | **(b) Law and the State**<br>*(The Nature of Constraint)* | All law is a subtraction from freedom. Even just laws restrict options. We trade freedom for security or justice, but we must not confuse the trade-off with an increase in freedom. | Non-arbitrary law (law that tracks common interests) is **constitutive** of freedom. It removes the domination of private powers. A state that prevents arbitrary interference does not reduce freedom; it creates the condition for it. |
  | **(c) The Dominator Requirement**<br>*(Impersonal Structures)* | Domination requires a **dominator**. An impersonal force (market crash, algorithm, social norm) cannot make you unfree unless a specific agent can be identified who wields that force to interfere. | Domination requires **dependency**, not necessarily a villain. If an impersonal structure places you at the mercy of arbitrary power (e.g., an employer in a monopsony market), you are dominated, even if no specific agent intends to harm you. |
  | **(d) Normative Priority**<br>*(What to maximize)* | Policy should minimize actual **interference**. If a policy reduces interference but increases state power, it may be justified, but it costs freedom. | Policy should minimize **arbitrary power**. If a policy increases state power but ensures that power cannot be used arbitrarily, it increases freedom. |

  ## 3. THE CRUXES
  *These are the specific cases where our theoretical divergence yields contradictory verdicts. We agree that settling the intuition on these cases would force at least one of us to revise our theory.*

  ### Case A: The Benevolent Slave
  **Scenario:** A slave has a master who is genuinely fond of him. The master has the legal and physical power to beat or kill the slave at any time but never does, and grants the slave wide latitude to travel and work.
  *   **N's Prediction:** The slave is **free** (to the extent he is not interfered with). The master's power is a threat to *security*, but the slave's range of motion is unimpeded.
  *   **R's Prediction:** The slave is **unfree**. The slave's actions are permitted, not entitled. The slave lives at the mercy of the master.
  *   **Settling Evidence:** We agree that if N admits the slave is "unfree" in a politically relevant sense, N must concede that freedom tracks *status* rather than *motion*. If R admits the slave is "free" but merely "insecure," R must concede that freedom tracks *exercise* rather than *potential*.

  ### Case B: The At-Will Employee
  **Scenario:** A worker has a contract allowing the boss to fire them for any reason (at-will). The boss is kind, has never fired anyone, and consults the worker on decisions.
  *   **N's Prediction:** The worker is **free**. The contract was entered voluntarily; the boss is not currently interfering.
  *   **R's Prediction:** The worker is **dominated**. The boss has arbitrary power over the worker's livelihood. The worker must anticipate the boss's whims, altering their behavior to avoid displeasure.
  *   **Settling Evidence:** Does the *necessity of anticipation* count as a restriction of freedom? N says no (that is prudence); R says yes (that is the internalization of domination).

  ### Case C: The Impersonal Market
  **Scenario:** A person starves because food prices are too high. No specific agent raised prices to harm them; it was supply and demand.
  *   **N's Prediction:** This is **misfortune**, not unfreedom. No agent interfered.
  *   **R's Prediction:** This may be **domination** if the market structure is unavoidable and places the person at the mercy of aggregate arbitrary forces they cannot influence.
  *   **Settling Evidence:** Can "arbitrary power" be decentralized? If N concedes that structural dependency counts as unfreedom, N collapses into R. If R concedes it is merely misfortune, R must accept a strict agent-relative constraint on domination.

  ### Case D: The Arbitrary Law
  **Scenario:** A law exists that prohibits X, punishable by death. The enforcers have discretion to ignore it. They never enforce it against Citizen Z.
  *   **N's Prediction:** Citizen Z is **unfree** to do X. The law is an interference (a threat), regardless of enforcement.
  *   **R's Prediction:** Citizen Z is **free** *if* the non-enforcement is guaranteed by a norm that tracks Z's interests (non-arbitrary). If the non-enforcement is just luck, Z is unfree.
  *   **Settling Evidence:** Is a non-enforced threat an interference? N says yes (it changes the cost/benefit). R says no (if the power is not arbitrary, it is not domination).

  ## 4. META-ANALYSIS: THE VERBAL DISPUTE HYPOTHESIS

  **Is this merely verbal?**
  We conclude that **yes, partially, but not entirely.**

  1.  **The Verbal Component:** A significant portion of our disagreement stems from the labeling of the "Benevolent Slave" case. N uses the word "freedom" to label the *exercise of options*. R uses the word "freedom" to label the *security of status*. If we agree to call N's concept "Non-Interference" and R's concept "Non-Domination," we agree on all the empirical facts of the cases above. We both see the slave; we both see the master's power; we both see the lack of beating. The disagreement is whether the *label* "unfree" applies to the slave.
  2.  **The Residual Normative Disagreement:** Even if we fix the terminology, a substantive disagreement remains about **political priority**.
      *   N argues that the state should prioritize minimizing actual interference, even if it means tolerating some private power (domination) to prevent state overreach.
      *   R argues that the state should prioritize eliminating private domination, even if it requires increasing state capacity (which N views as interference).
      *   *Therefore:* The dispute is not just about words; it is about which social evil (Interference vs. Domination) is the primary target of liberal institutions.

  **On Positive Liberty:**
  The "Positive Liberty" proponents (freedom as self-mastery, rational will, or autonomy) are **not** in this conversation.
  *   N and R both view freedom as an *external* relation (what others can do to me).
  *   Positive Liberty views freedom as an *internal* relation (what I can do with my will).
  *   If a Positive Liberty proponent argued that the Benevolent Slave is "unfree" because he is dependent and thus psychologically degraded, they would be making a different argument than R. R argues the slave is unfree because of the *master's power*, not the slave's psychology. N and R are allies against Positive Liberty, despite their fight with each other.

  **Final Consensus:**
  We agree to stop asking "Who is right about freedom?" and start asking "Which conception (Non-Interference or Non-Domination) yields a more just and stable political order?" We acknowledge that N's framework better protects against state tyranny, while R's framework better protects against private oligarchy. The document we were avoiding was not a definition of freedom, but a decision on which power we fear more.

  **Signed,**
  **N** (For Non-Interference)
  **R** (For Non-Domination)
