  **Credence: 0.60**

  I assign a 60% probability that this arrangement produces legislation at least as substantively just as the baseline over a ten-year horizon. This is closer to your skepticism than your supervisor's optimism, but it remains a tentative endorsement. Below is the decomposition, the framing critique, and the sensitivity analysis that justifies this number.

  ### 1. Framing Critique & Adjustment
  Your framing contains two assumptions that bias the comparison upward, requiring a downward adjustment of the probability.

  *   **The Baseline Confounder:** You specify the baseline as "an ordinary elected lower chamber" (implying unicameralism) and the alternative as bicameral. This conflates the *selection method* (sortition vs. election) with the *veto structure* (one chamber vs. two). Adding any veto point generally increases status quo bias. If "substantive justice" requires active redistribution or correction of market failures, status quo bias is a liability, not an asset. To isolate the value of *lottocracy*, the baseline should be a bicameral system with an *elected* upper chamber. Comparing Sortition-Bicameral to Elected-Unicameral stacks the deck in favor of the sortition model on stability grounds alone. I have adjusted my number down to account for this; if the baseline were an Elected Upper Chamber, my credence would drop to roughly 0.52.
  *   **The "Justice" Metric:** "Substantively just" is essentially contested. If it means "procedurally fair," sortition wins. If it means "Rawlsian maximin," the result depends on whether the status quo is already near the justice frontier. I am operationalizing "justice" here as *the alignment of legislative output with considered public judgment regarding rights and welfare, minus gross rights violations*. This definition favors deliberative bodies but penalizes gridlock.

  ### 2. Decomposition of the Claim
  I treat the final outcome as a weighted function of four necessary conditions. If any fail catastrophically, the system underperforms.

  **Q1: Epistemic Gain (Sortition > Election)**
  *   *Question:* Does a stratified, deliberative body produce inputs superior to an elected body, controlling for polarization and donor influence?
  *   *Probability:* **0.75**
  *   *Reasoning:* The literature on deliberative polling (Fishkin) and citizens' assemblies (Ireland, France) robustly shows that random samples, when given time and balanced briefs, move toward the common good more reliably than partisan elected officials. They are less susceptible to short-term electoral cycles and lobbying.

  **Q2: Design Frictions (The Specific Architecture)**
  *   *Question:* Do the specific constraints (6 months, expert testimony, double-sortition override) preserve the epistemic gain?
  *   *Probability:* **0.55**
  *   *Reasoning:* This is the weakest link. Six months is insufficient for complex technical legislation (e.g., tax code, AI regulation), creating reliance on bureaucrats. More critically, the override mechanism (2/3 Lower + 2nd Assembly) creates a "triple veto." This induces severe gridlock. While gridlock prevents unjust laws, it equally prevents just reforms. The probability is barely above 0.5 because the design risks paralysis.

  **Q3: Accountability Drift (Systemic Feedback)**
  *   *Question:* Does the existence of the sortition veto cause the elected lower chamber to behave worse (e.g., passing populist nonsense knowing the Upper House will clean it up)?
  *   *Probability:* **0.50**
  *   *Reasoning:* This is the "moral hazard" of institutional design. If the Lower Chamber knows a "wise" body will veto their worst impulses, they may cater more aggressively to extreme bases to secure reelection, offloading the responsibility for governance to the sortition chamber. There is no empirical precedent for this specific bicameral mix, so uncertainty is maximal.

  **Q4: Metric Determinacy (Is "Justice" Measurable?)**
  *   *Question:* Is the claim truth-apt? Can we meaningfully compare justice outputs over 10 years?
  *   *Probability:* **0.80**
  *   *Reasoning:* While perfect justice is elusive, we can identify gross injustices (rights violations, corruption, exclusion). The claim has a truth value if we accept a "negative utilitarian" baseline (avoiding harm) rather than a "perfect society" baseline.

  ### 3. Aggregation
  I do not multiply these probabilities (which would yield a catastrophic 0.16), as the factors are not strictly independent necessary conditions. Instead, I use a weighted average where Design and Accountability are weighted higher because they determine whether the Epistemic Gain can be *realized*.

  $$
  \text{Credence} = \frac{(0.75 \times 1) + (0.55 \times 2) + (0.50 \times 2) + (0.80 \times 1)}{6}
  $$

  $$
  \text{Credence} = \frac{0.75 + 1.10 + 1.00 + 0.80}{6} = \frac{3.65}{6} \approx 0.608
  $$

  Rounded to **0.60**.

  ### 4. Sensitivity Analysis
  **Most Sensitive Sub-question:** **Q2 (Design Frictions).**
  The specific override mechanism is the pivot point. If the override required only a simple majority of the Lower Chamber, the system would be more responsive, and my credence would rise to 0.70. Because the override requires a *second* citizens' assembly to endorse the override, you have created a "sortition lock." If the first assembly is captured by a specific ideology or expert framing, the second assembly is statistically likely to replicate that bias, making the veto effectively absolute. This rigidity is the single greatest threat to "substantive justice" in a dynamic society.

  **Single Piece of Evidence to Move the Number:**
  **Comparative data on veto-point density and legislative responsiveness in OECD democracies.**
