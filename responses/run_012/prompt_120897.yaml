answer: |-
  # Activity Title: The Grand Hotel Audit
  **Time:** 75 Minutes
  **Participants:** 18 Undergraduates (No set theory background)
  **Goal:** Distinguish potential vs. actual infinity through bookkeeping contradictions and capacity limits.

  ## 1. Materials & Setup
  *   **The Ledger:** A large whiteboard divided into columns: *Room #*, *Guest Name*, *Status*.
  *   **Guest Cards:** 3 decks of index cards.
      *   *Deck A (Integers):* Pre-written with "Guest $n$" (for $n=1$ to 50, representing the "infinite" crowd).
      *   *Deck B (Primes):* Marked "Prime Room Checkout".
      *   *Deck C (Evens):* Marked "Even Room Checkout".
  *   **The Bus Manifest:** Blank index cards and markers.
  *   **Rule Sheets:** One per participant (see below).
  *   **Scoreboard:** Whiteboard corner tracking "Compliance Points."

  ## 2. The Rules (The Trap)
  Hand out the **Front Desk Policy Manual**. Emphasize that these are non-negotiable company rules derived from finite hotel management.

  1.  **The Numbering Rule:** Rooms are numbered $1, 2, 3, \dots$ without end.
  2.  **The Occupancy Rule:** Every room is currently occupied.
  3.  **The Bookkeeping Rule:** For any transaction, *Total Guests = Remaining Guests + Checked-Out Guests*.
  4.  **The Part-Whole Principle:** If Group A is a proper subset of Group B, then Group B has more guests than Group A.
  5.  **The Counting Rule:** The question "How many?" must always yield a specific quantity.
  6.  **The Ban:** You may **not** use the "Shift Everyone Up" trick. You must assign guests to their current rooms or check them out directly.

  **Scoring Scheme:**
  *   **+10 Points:** Identifying a contradiction between two rules.
  *   **+5 Points:** Maintaining internal consistency with the Manual even when it feels wrong.
  *   **-5 Points:** Invoking outside knowledge (e.g., "Infinity isn't a number").
  *   **Win Condition:** The team with the most points at the end. (This rewards noticing the breakage, not fixing it).

  ---

  ## 3. Timeline & Stages

  ### Phase 1: Briefing & The Audit (0:00 – 0:25)
  **Setup:** The hotel is "Full" (Actual Infinity assumed).
  **Task:** The corporate office demands an audit. Two separate checkout events occur simultaneously in different wings.
  *   **Group 1 (9 students):** Process checkouts for all **Even** numbered rooms.
  *   **Group 2 (9 students):** Process checkouts for all **Prime** numbered rooms.

  **Action:**
  1.  Both groups must calculate: *How many guests checked out?* and *How many remain?*
  2.  They must map the remaining guests to new room numbers to verify occupancy (without shifting the original guests, just re-indexing the list of remaining people).
  3.  They must satisfy **The Bookkeeping Rule** (Total = Remaining + Out).

  **The Conflict:**
  *   Group 1 (Evens) finds half the rooms empty. Remaining: Odd numbers.
  *   Group 2 (Primes) finds sparse rooms empty. Remaining: Non-primes.
  *   **The Trap:** By **Rule 4 (Part-Whole)**, Group 2 removed *fewer* guests than Group 1 (Primes are sparser than Evens). Therefore, Group 2 should have *more* guests remaining.
  *   **The Reality:** Both groups can create a 1-to-1 list of remaining guests to Room Numbers $1, 2, 3\dots$ (e.g., 1st remaining guest to Room 1, 2nd to Room 2). Both claim "Full Occupancy" again.
  *   **The Break:** If both remain "Full," then *Total - Out = Total*. This implies *Out = 0*. But guests *did* leave.
  *   **The Question:** "How many checked out?"
      *   If they say "Infinity," ask: "Is Prime-Infinity the same size as Even-Infinity?"
      *   If they say "Half," ask: "Then where did the other half go in the mapping?"

  **Instructor Role:** Act as the Corporate Auditor. Demand a number. "I need a figure for the tax report. Is it 50%? Is it 13%? You cannot write 'Undefined' on a ledger."

  ### Phase 2: The Continuum Bus (0:25 – 0:50)
  **Setup:** The audit is interrupted. A new bus arrives.
  **The Twist:** This bus does not have passengers numbered $1, 2, 3\dots$.
  **The Passengers:** Each passenger is identified by an **infinite sequence of Heads/Tails** (e.g., H-T-H-H-T...).
  **Task:** Assign every passenger a unique room. No double booking.

  **Action:**
  1.  Students attempt to list the passengers to assign them Room 1, Room 2, Room 3...
  2.  They will naturally try to group them (e.g., "All starting with H go to odd rooms").
  3.  **The Finitist Role (Assigned to 1 Student):** This student holds the **Skeptic Card**. Their job is to refuse to write down a "complete list." They must argue, "We can write the next one, but we never have the *whole* list."
  4.  **The Diagonal Attack:** Once the class claims they have a list (e.g., 20 rows on the board), you (the Bus Driver) produce a **New Passenger Card**.
      *   Look at their Room 1, digit 1. Flip it.
      *   Look at their Room 2, digit 2. Flip it.
      *   Look at their Room $n$, digit $n$. Flip it.
      *   Announce: "This passenger is not on your list. They differ from Person 1 in the first flip, Person 2 in the second, etc."
  5.  **Repeat:** Let them try to add this new passenger to the bottom. Generate another diagonal.

  **The Discovery:** No matter how they arrange the list, there is always a passenger left over. The hotel is "Full" (countably infinite), but the bus contains *more* guests than there are rooms.

  ### Phase 3: The Finitist Stand & Debrief (0:50 – 1:15)
  **The Stand:** The student with the **Skeptic Card** stands up.
  *   **Argument:** "The problem isn't the bus. The problem is the Hotel. You keep talking about 'All Rooms' as if it's a finished box. It's not. It's a process. If we only admit guests as they arrive, we never have to house the whole bus at once."
  *   **Task:** The rest of the class must answer the Skeptic using the **Rule Manual**. Can they prove the Hotel *must* be a completed whole? (They can't. This is an axiom, not a proof).

  **The Debrief (Instructor Led):**
  Connect the activity to the mathematical concepts.
  1.  **The Audit (Subtraction & Part-Whole):**
      *   *Concept:* Cardinality via One-to-One Correspondence.
      *   *Lesson:* In infinite sets, a part can equal the whole. Subtraction ($\infty - \infty$) is undefined because the "amount" removed depends on *which* elements you remove, not just the count.
      *   *Activity Link:* Group 1 and Group 2 both mapped remaining guests to $\mathbb{N}$, proving same size, despite different "amounts" removed.
  2.  **The Bus (Countability):**
      *   *Concept:* Uncountable Infinity ($\mathfrak{c} > \aleph_0$).
      *   *Lesson:* Not all infinities are the same size. The "Shift" trick works for Countable sets ($\mathbb{N}$), but fails for Uncountable sets ($\mathbb{R}$).
      *   *Activity Link:* The Diagonal Argument proved the list was always incomplete.
  3.  **The Skeptic (Potential vs. Actual):**
      *   *Concept:* Potential Infinity (process) vs. Actual Infinity (object).
      *   *Lesson:* Set theory assumes Actual Infinity (the completed set $\mathbb{N}$ exists). The Skeptic argued for Potential Infinity (we can always count higher, but never hold "all" numbers).
      *   *Activity Link:* The Skeptic was logically consistent but incompatible with the Hotel's existence.

  ---

  ## 4. Predictable Failures (First Run)
  1.  **The "Infinity" Answer:** In Phase 1, students will write "Infinity" for the checkout count.
      *   *Fix:* Press them on **Rule 3 (Bookkeeping)**. If Total = $\infty$ and Remaining = $\infty$, then $\infty = \infty + \text{Out}$. Ask: "Does Out = 0? If not, does $\infty + 5 = \infty$? If so, why do we track checkouts?" Force them to feel the arithmetic break.
  2.  **The Bus Grouping:** In Phase 2, they will try to solve the bus by saying "Put all H... in Room 1-100, all T... in Room 101-200."
      *   *Fix:* Remind them the sequences are *infinite*. There is no "last" digit to sort by. The Diagonal move must be performed physically on the board to show the specific sequence they missed.
  3.  **The Skeptic as Annoyance:** The class may vote to ignore the Skeptic.
      *   *Fix:* Award the Skeptic **Double Points** if they successfully force the class to admit they are *assuming* the list is complete rather than proving it. This validates the philosophical objection.

  ## 5. Honesty Clause (The Bridge)
  **Crucial Debrief Note:** You must explicitly tell the students:
  > "In this room, we only wrote 20 rows. We only moved 50 cards. You never actually touched infinity. You manipulated finite proxies. I, the Instructor, asserted the 'Completed Whole' when I said 'The Hotel is Full.' Mathematics requires a leap of faith there: we agree to treat the rule 'for every $n$' as a finished object called $\mathbb{N}$. The Skeptic was right to question that leap. Set theory is the study of what happens if we *accept* that leap. Today, you felt the friction of making it."

  ## 6. Scoring Summary for Instructor
  *   **Audit Phase:** Max 20 pts. (10 for spotting the Part-Whole violation, 10 for spotting the Subtraction violation).
  *   **Bus Phase:** Max 20 pts. (10 for attempting a systematic list, 10 for acknowledging the Diagonal counter-example).
  *   **Skeptic Phase:** Max 10 pts. (Awarded to the class if they engage the argument logically; awarded to Skeptic if they hold ground).
  *   **Total:** 50 Points.

  This structure ensures they struggle with the *consequences* of infinity (the audit failure and the bus overflow) rather than just memorizing the *definitions*, while honoring the philosophical tension of the Finitist.
