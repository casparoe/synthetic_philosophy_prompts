prompt: |-
  Seventy-five minutes, about eighteen undergraduates, none with any set theory: I want an activity, not a lecture, that makes the difference between potential and actual infinity land. Stage it as a job. Participants are front-desk clerks at a hotel with a room for every counting number, working from bookkeeping rules they learned on finite hotels — a numbered register, the principle that a whole is greater than each of its proper parts, and the assumption that "how many checked out?" always has an answer. Give me the rules, the materials, a scoring scheme that rewards internal consistency rather than confident intuition and needs no money, a timeline, and a debrief that ties each stage to a specific idea: size as one-to-one correspondence, the failure of the part–whole principle and of subtraction for infinite collections, and the finitist's refusal to treat a rule for every n as a completed whole.

  Do not centre it on the shift-everyone-up-one-room trick; assume they have seen it. I want the force to come from two discoveries they reach themselves: an audit in which "how many guests left?" has no answer, and an arrival the hotel cannot absorb — a bus carrying one passenger for every point on a line, which no amount of re-rooming among countably many rooms can take in. Include a role for a participant who will not accept completed infinities and must be answered rather than overruled, tell me what will predictably go wrong the first time I run it, and be honest about what the activity cannot reproduce: participants only ever manipulate finite proxies, so I will have to supply the step from a rule for every n to a completed whole.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Time:** 75 minutes.
      *   **Participants:** ~18 undergraduates, no set theory background.
      *   **Goal:** Distinguish potential vs. actual infinity through activity, not lecture.
      *   **Setting:** Hotel front-desk clerks (Hilbert's Hotel variant).
      *   **Constraints:**
          *   Do *not* center on the "shift everyone up one" trick (they've seen it).
          *   Focus on two specific discoveries:
              1.  Audit failure ("How many left?" has no answer).
              2.  Uncountable arrival (Bus with continuum passengers cannot be housed).
          *   Include a role for a "Finitist" (rejects completed infinities).
          *   Scoring: Reward internal consistency, not intuition. No money involved.
          *   Materials/Rules/Timeline/Debrief needed.
          *   Honesty clause: Acknowledge that participants only manipulate finite proxies; the instructor must bridge the gap to "completed whole."
          *   Predict failures: What will go wrong the first time?

  2.  **Deconstruct the Mathematical Concepts:**
      *   *Actual Infinity:* Treating the set of natural numbers $\mathbb{N}$ as a completed object.
      *   *Potential Infinity:* Treating $\mathbb{N}$ as an unending process.
      *   *Cardinality (Size):* Defined by one-to-one correspondence (bijection), not counting.
      *   *Part-Whole Principle:* "The whole is greater than the part." Holds for finite sets, fails for infinite sets (Dedekind-infinite).
      *   *Subtraction:* $ \infty - \infty $ is undefined.
      *   *Countability:* $\mathbb{N}$ vs. $\mathbb{R}$ (Cantor's Diagonal Argument).

  3.  **Design the Activity Structure:**
      *   **Phase 1: Setup & Rules (10 mins):** Establish the "Finite Rules" they bring with them.
      *   **Phase 2: The Audit (25 mins):** Challenge the "How many?" question. Show subtraction failure.
      *   **Phase 3: The Continuum Bus (25 mins):** Challenge the capacity. Introduce uncountability.
      *   **Phase 4: The Finitist Intervention & Debrief (15 mins):** Address the philosophical gap and summarize.

  4.  **Develop the "Job" Mechanics:**
      *   *Role:* Front Desk Clerks.
      *   *Task:* Manage check-ins/outs and maintain the Register.
      *   *The Register:* A physical representation of the rooms. Since we can't have infinite rooms, we need a symbolic representation. Index cards? A whiteboard list? Let's use a *Master Ledger* (whiteboard) and *Guest Cards*.
      *   *The Rules (The Trap):* Give them rules that work for finite hotels but break for infinite ones.
          1.  Room numbers are positive integers.
          2.  Every guest has a unique room.
          3.  **The Counting Rule:** The number of guests is the highest occupied room number (if full from 1) or requires counting.
          4.  **The Part-Whole Rule:** If Group A is inside Group B, Group B is larger.
          5.  **The Subtraction Rule:** Total - Checked Out = Remaining.

  5.  **Drafting the Scenarios:**

      *   *Scenario A (The Audit):* We need a situation where bijection exists but "counting" fails.
          *   Idea: Even/Odd rooms.
          *   Action: Move all guests from Room $n$ to Room $2n$.
          *   Result: All odd rooms are empty.
          *   Question: "How many guests checked out?"
          *   Conflict: Bijectively, 0 left (same number of guests). By room count, half left. By subtraction, $\infty - \infty$.
          *   *Refinement:* Let's make it about *checking out*. Suppose guests in odd rooms check out.
          *   Remaining: Even rooms.
          *   Mapping: $n \to 2n$ shows Remaining = Original.
          *   But "How many left?" Infinite.
          *   So Remaining = Original, yet Original - Left = Remaining implies $\infty - \infty = \infty$. But if *different* infinite groups leave, we get different results.
          *   *Activity:* Split the group. Half manage "Odd Checkout," half manage "Square Checkout." Compare results.

      *   *Scenario B (The Continuum Bus):*
          *   Idea: Cantor's Diagonal.
          *   Action: A bus arrives with passengers named by decimal expansions (0.d1d2d3...).
          *   Task: Assign rooms.
          *   Mechanism: They will try to list them.
          *   Twist: The "Finitist" or the Instructor plays the Bus Dispatcher and generates a new passenger not on their list based on their assignment.
          *   *Constraint:* No shifting tricks. They must assign rooms directly.
          *   *Realization:* They can't make a complete list.

  6.  **The Finitist Role:**
      *   Needs to be a specific participant or a script for the instructor. Let's make it a specific participant role card to ensure it happens.
      *   Argument: "You can't have a full list. You can only have a list so far."
      *   This aligns with Potential Infinity.

  7.  **Scoring Scheme:**
      *   No money. Use "Compliance Points."
      *   Points awarded for sticking to the *defined rules* even when they lead to contradictions, rather than guessing the "right" math answer.
      *   Penalty for invoking external knowledge ("But infinity isn't a number!").
      *   Reward for identifying *which* rule broke.

  8.  **Timeline Check:**
      *   0-10: Briefing & Rules.
      *   10-35: Audit Phase (Subtraction/Part-Whole).
      *   35-60: Bus Phase (Countability).
      *   60-75: Finitist Debate & Debrief.

  9.  **Addressing the "Honesty Clause":**
      *   Must explicitly state in the debrief that they manipulated finite lists (1-20, etc.) and the instructor asserted the "completed" nature. The activity simulates the *consequences* of actual infinity, not the experience of it.

  10. **Refining the "Audit" (The Subtraction Problem):**
      *   To make it visceral: Divide the 18 students into 3 teams of 6.
      *   Team 1: Handles Check-outs for Guests in Prime Numbered Rooms.
      *   Team 2: Handles Check-outs for Guests in Even Numbered Rooms.
      *   Team 3: Auditors.
      *   Both teams start with "Full Hotel." Both remove an infinite subset.
      *   Team 1 has "more" rooms left than Team 2? (Primes are sparser than Evens).
      *   But both can map remaining guests to $\mathbb{N}$.
      *   The question "How many left?" breaks the Subtraction Rule.

  11. **Refining the "Bus" (The Diagonal):**
      *   Don't use decimals (too messy for 75 mins). Use infinite binary strings.
      *   Passengers are identified by infinite sequences of Heads/Tails (or 0/1).
      *   Students try to assign Room 1, Room 2, Room 3... to specific sequences.
      *   Instructor (Bus Driver) writes a sequence that differs from Room 1 in digit 1, Room 2 in digit 2, etc.
      *   This proves the list was incomplete.

  12. **Predicting Failures:**
      *   *Failure 1:* Students will try to count. They will say "Infinity." Instructor must press for a number to satisfy the Bookkeeping Rules.
      *   *Failure 2:* In the Bus phase, they will try to group passengers (e.g., "All starting with 0"). The Diagonal argument must cut through this.
      *   *Failure 3:* The Finitist will be seen as obstructive rather than philosophical. Need to frame their points as valid logical objections to the "Completed Whole" assumption.

  13. **Final Polish:**
      *   Ensure the "Shift" trick is explicitly banned to force the Cardinality realization.
      *   Make sure the scoring rewards *noticing the contradiction* over *solving it*.

  14. **Writing the Plan:** (Self-Correction during drafting)
      *   *Correction:* 18 students is a lot for one hotel. Split into 3 competing hotel branches? No, keep them as one staff facing a crisis. It builds camaraderie against the "rules."
      *   *Correction on Finitist:* Don't assign a student initially. Let the *Instructor* play the Finitist during the debrief, OR assign a student a "Skeptic" card to play during the Bus phase. Let's assign a student. It makes the debate real.
      *   *Materials:* Whiteboard, markers, index cards (for guest names/sequences), rule sheets.

  15. **Final Review against constraints:**
      *   75 mins? Yes.
      *   18 undergrads? Yes.
      *   No set theory? Yes.
      *   Activity not lecture? Yes.
      *   No shift trick? Yes.
      *   Audit (subtraction failure)? Yes.
      *   Bus (uncountable)? Yes.
      *   Finitist role? Yes.
      *   Scoring? Yes.
      *   Honesty about proxies? Yes.

