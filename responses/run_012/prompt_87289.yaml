      *   **Brainstorm:** Needs to be messy, quick thoughts. Focus on the tension between Malthusian scarcity vs. Entitlement failure. The Irish potato blight *was* biological, but the export of grain during starvation makes it political. Bengal was wartime inflation + policy. GLF was policy-induced. The analogy hides the *duration* and the *selectivity* of death. Earthquakes kill instantly; famines kill slowly based on purchasing power. The "trigger" isn't the "cause of death" necessarily.

