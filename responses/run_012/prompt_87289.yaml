answer: |-
  Brainstorm
  Okay, the earthquake analogy is seductive because it absolves guilt—tectonic plates don't have morals. But an earthquake kills you by physics; a famine kills you by economics. The Irish blight was biological, sure, but the catastrophe was policy (exports continued). Bengal was inflation + denial, not just lack of rice. GLF was quotas, pure and simple. The analogy conflates the spark with the arson. It treats the death toll as physics when it's economics. The time scale is wrong too—earthquakes are instant, famines are slow murders allowing time for choice. If the trigger doesn't linearly predict the body count, it's not a natural disaster model. It's a system failure.

  The mapping

  | Component | Natural Disaster (Earthquake) | Famine (as framed by analogy) | Famine (Historical Reality) |
  | :--- | :--- | :--- | :--- |
  | **Trigger Event** | Tectonic shift / Storm | Drought / Blight / Weather | Blight, Inflation, or Policy Quotas |
  | **"The Disaster"** | Building Collapse / Flood | Food Shortage (FAD) | Entitlement Failure / Price Spike |
  | **Victims** | Anyone in the epicenter | Anyone in the region | Selectively the poor/landless |
  | **Role of Luck** | Location (Geography) | Location (Geography) | Class + Location + Political Voice |
  | **Response** | Rescue / Rebuild (Charity) | Aid / Imports (Charity) | Policy Change / Rights (Justice) |
  | **Magnitude Link** | Magnitude ≈ Damage | Crop Fail ≈ Starvation | Crop Fail ≠ Starvation (Weak link) |

  Where it breaks
  The analogy collapses at the transmission mechanism. An earthquake kills via physics; force exceeds structural tolerance. There is no human intermediary between the tremor and the rubble. Famine kills via economics; the trigger (blight, drought) must pass through the filter of entitlements before it becomes starvation. In Ireland, the blight was natural, but the catastrophe was amplified by export policies that treated food as a commodity rather than a right. In Bengal, the "trigger" was wartime inflation and denial policies, not a crop failure sufficient to cause starvation on its own. In the Great Leap Forward, the trigger was purely political quotas. Unlike an earthquake, where magnitude correlates with destruction, famine severity correlates weakly with weather and strongly with governance. The 1967 Indian drought was severe, yet deaths were negligible due to policy; the 1877 drought was similar, but deaths were massive. This decouples the "natural event" from the "human outcome." Furthermore, earthquakes kill indiscriminately within a zone; famines are surgically selective, sparing those with assets while targeting the laboring poor. The duration also differs: an earthquake offers no warning once it starts, whereas famine unfolds over months, creating a window for intervention that implies responsibility. By mapping famine onto geology, the analogy hides the human hands on the throttle. It treats the death toll as a measurement of the blight's intensity, rather than a measurement of the state's willingness to protect its citizens. This obscures the fact that the "disaster" is not the lack of food, but the failure of distribution.

  Which breaks matter
  The breaks that matter are the **selectivity of victims** and the **magnitude link**. If death is selective based on class rather than location, it's not "bad luck" in the natural sense; it's vulnerability engineered by society. If the trigger (drought) doesn't predict the outcome (death), then the outcome is determined by variables we control (policy), not variables we don't (tectonics). These breaks directly undermine the "nobody to blame" conclusion.

  Does the conclusion survive?
  No. The conclusion that famine is merely bad luck and relief is charity collapses once the disanalogies are visible. If the death toll is determined by policy choices (exports, inflation control, grain quotas) rather than the sheer physical absence of calories, then starvation is not an act of God but an outcome of governance. This shifts the moral framework from charity (giving help to victims of luck) to justice (correcting a system that selectively kills the poor). You cannot claim "nobody is to blame" when the severity of the catastrophe depends on political decisions made during the event. The analogy survives only if you ignore the distribution mechanism, which is precisely where the bodies come from.

  A better analogy
  A **pandemic**. The virus (blight/drought) is the natural trigger, but the death toll is determined by healthcare infrastructure, vaccine distribution, and government lockdown policies. Nobody says a high death toll from a manageable virus is "just nature"; we recognize it as a failure of public health systems.
