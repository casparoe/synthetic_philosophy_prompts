  ### The Anthropocene Diagnostic: A Decision Tree

  **Node 1: The Vanishing Library**
  If all human written records vanished tomorrow, could a geologist in ten million years identify the start of this epoch using only a core sample?
  *   **Yes:** Go to **Rock Record** (Node 2).
  *   **No:** Go to **Human History** (Node 8).

  ---

  #### **Branch A: The Rock Record (Stratigraphic)**

  **Node 2: The Global Sync**
  Must the boundary marker appear at the exact same moment in ice, mud, and coral across the entire planet (isochronous)?
  *   **Yes:** Go to **Node 3**.
  *   **No:** Go to **Node 4**.

  **Node 3: The Single Spike**
  To be official, must this global signal be anchored to one specific physical location (a "Golden Spike" like Crawford Lake)?
  *   **Yes:** Go to **Node 5**.
  *   **No:** Go to **Node 6**.

  **Node 4: The Signal Strength**
  Is the shift in natural ratios (carbon, pollen) distinct enough from Holocene noise to warrant a new name?
  *   **Yes:** Go to **Node 6**.
  *   **No:** Go to **Leaf: The Austere Holocene**.

  **Node 5: The Novelty Test**
  Must the marker be a synthetic material nature cannot make (plutonium, plastics), rather than a shift in existing elements?
  *   **Yes:** Go to **Node 7**.
  *   **No:** Go to **Leaf: The Orbis Spike**.

  **Node 6: The Authority Veto**
  If the International Commission on Stratigraphy (ICS) votes no, is the term geologically invalid?
  *   **Yes:** Go to **Leaf: The Formal Great Acceleration**.
  *   **No:** Go to **Leaf: The Informal Great Acceleration**.

  **Node 7: The Formal Necessity**
  Does the term require a ratified certificate to function, or is it valid as long as the data exists?
  *   **Requires Certificate:** Go to **Leaf: The Formal Great Acceleration**.
  *   **Data Suffices:** Go to **Leaf: The Informal Great Acceleration**.

  ---

  #### **Branch B: The Human History (Values & Impact)**

  **Node 8: The Ignition Point**
  Did the Anthropocene begin with a specific event (bomb, engine) or a slow accumulation of processes (farming, trade)?
  *   **Specific Event:** Go to **Node 9**.
  *   **Slow Process:** Go to **Node 10**.

  **Node 9: The Global Reach**
  Must the event have immediately impacted the entire Earth system, or is the origin of the cause sufficient?
  *   **Immediate Global Impact:** Go to **Leaf: The Earth-System Event**.
  *   **Origin of Cause:** Go to **Node 11**.

  **Node 10: The Driver**
  Was the primary engine a technology (steam, nuclear) or a socio-economic system (capitalism, colonization)?
  *   **Technology:** Go to **Leaf: The Industrial Revolution**.
  *   **System:** Go to **Node 12**.

  **Node 11: The Responsibility Threshold**
  Does the start date track when humans gained the *power* to change the planet, or the *knowledge* that they were doing so?
  *   **Power/Impact:** Go to **Leaf: The Early Anthropocene**.
  *   **Knowledge/Responsibility:** Go to **Leaf: The Industrial Revolution**.

  **Node 12: The Measurement**
  Is the boundary defined by measuring carbon and biomass, or by assigning judgment and guilt?
  *   **Measurement:** Go to **Node 13**.
  *   **Judgment:** Go to **Node 14**.

  **Node 13: The Community**
  Should the definition be settled by Earth-system scientists or by formal geological bodies?
  *   **Scientists:** Go to **Leaf: The Earth-System Event**.
  *   **Geological Bodies:** Go to **Leaf: The Industrial Revolution**.

  **Node 14: The Binding**
  Is the term a political claim that should never have been delegated to geologists, or a scientific descriptor they can manage?
  *   **Political Claim:** Go to **Leaf: The Capitalocene**.
  *   **Scientific Descriptor:** Go to **Leaf: The Early Anthropocene**.

  ---

  #### **The Leaves: Positions & Awkward Commitments**

  1.  **The Formal Great Acceleration:** The AWG proposal (mid-20th C, plutonium, Crawford Lake).
      *   *Awkward Commitment:* Requires future geologists to validate a global crisis by finding a specific Canadian lake bed.
  2.  **The Informal Great Acceleration:** Mid-20th C onset, but without formal ratification.
      *   *Awkward Commitment:* Admits the term is useful science but lacks the legal weight of a "Golden Spike."
  3.  **The Orbis Spike:** 1610 CO2 dip following Indigenous population collapse.
      *   *Awkward Commitment:* Ties a geological epoch to a demographic catastrophe that left little direct physical debris.
  4.  **The Austere Holocene:** Rejects the Anthropocene as a geological unit entirely.
      *   *Awkward Commitment:* Must argue that human domination of the planet is geologically indistinguishable from natural variation.
  5.  **The Industrial Revolution:** Late 18th C, tied to Watt's engine and fossil fuel scaling.
      *   *Awkward Commitment:* Privileges a British technological milestone over earlier global ecological changes.
  6.  **The Early Anthropocene:** Neolithic onset (farming, land clearing).
      *   *Awkward Commitment:* Dilutes the term to cover 10,000 years, making "crisis" hard to define.
  7.  **The Capitalocene:** Mid-20th C or earlier, but defined by capitalist accumulation, not technology.
      *   *Awkward Commitment:* Requires geologists to date rocks based on economic theory rather than physical strata.
  8.  **The Earth-System Event:** No single base; the Anthropocene is a process, not an epoch.
      *   *Awkward Commitment:* Sacrifices the utility of a precise date for the accuracy of a complex narrative.

  ---

  #### **Instrument Limits & Empty Cells**

  **The Unoccupied Cell: The Formal Neolithic**
  Logical space exists for a reader who demands strict stratigraphic formalism (ICS ratification, Golden Spike) but insists on a Neolithic start date. This cell is empty.
  *   *Diagnosis:* **Incoherent.** Stratigraphic formalism requires a sharp, global signal. An agricultural onset is too gradual and diachronous to satisfy the "Global Sync" (Node 2) required by formal bodies. You cannot be a strict formalist and an Early Anthropocene proponent simultaneously.

  **The Overlap: Science vs. Politics**
  Node 12 (Measurement vs. Judgment) cannot fully separate **The Earth-System Event** from **The Capitalocene**.
  *   *Diagnosis:* **Unexplored.** Both positions reject the ICS authority, but one claims the rejection is because the science is too complex for an epoch (Event), while the other claims the science is complicit in the crime (Capitalocene). The tree forces a choice where many readers hold both views: that the epoch is scientifically messy *and* politically charged.

  **The Authority Axis**
  Notice that Nodes 6, 7, 13, and 14 form a distinct "Who Decides" corridor. A reader may answer the dating questions (Nodes 2–5, 8–11) one way, but their final position is determined here. This exposes the 2024 vote's core tension: the disagreement was not merely about *when* humans changed the Earth, but whether geologists have the standing to say *so*.
