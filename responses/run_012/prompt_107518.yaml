  Ok so I've been reading alot about risk-weighted expected utility and I want to actually feel the difference between it and plain expected utility, not just nod along. Quick refresher so we're on the same page: you rank a gamble's outcomes from worst to best, and instead of weighting each outcome by its own probability you weight it by a risk function r applied to the cumulative probability of doing at least that well — so REU = u(x1) + (u(x2) − u(x1))·r(P(X ≥ x2)) + (u(x3) − u(x2))·r(P(X ≥ x3)) + ..., with r increasing, r(0) = 0, r(1) = 1, and r convex meaning risk averse (it squashes the chances of the good stuff).

