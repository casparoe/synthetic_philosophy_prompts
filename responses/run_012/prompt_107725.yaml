prompt: |-
  I cover science and medicine for a mid-size daily and somehow I've ended up on the county health department's advisory panel, and Thursday we vote on something that's turned into a genuine fight. The department has a model that scores every adult in the county for risk of a few preventable conditions, and the question is whether to mail the reports out to everyone automatically, make people opt in, or kill the whole thing. Our staff economist keeps citing Good's theorem -- the expected value of information is never negative, because if you'd rather not know something you can just ignore it. Fine, it's a theorem, and it's about expected value before you look, not about whether any particular person ends up worse off. But it seems to lean on you actually being able to ignore what you learned, and our legal people say that's exactly what we can't do: once a flagged report goes out, the department is obligated to follow up on it, so the information arrives fused to a duty, and nobody involved can un-know it. Plus the report changes people's behaviour, so it isn't purely information in the first place. That's the real fight -- not the model's accuracy.

  Draft the opinion I'll read out and that we'll vote on: pick one of the three options, say on what timeline and with what carve-outs, give the reasoning, and state the strongest case for the other side honestly, because I don't want to be the person who waves away the right-to-know argument. Two pages max, no citations -- half the panel are laypeople like me.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Science/Medicine Reporter for a mid-size daily, serving on a county health department advisory panel.
      *   **Task:** Draft an opinion to be read out before a vote on Thursday.
      *   **Topic:** Whether to mail health risk reports to every adult in the county automatically, make people opt-in, or kill the project.
      *   **Key Conflict:**
          *   *Pro-Automatic:* Staff economist cites Good's Theorem (expected value of information is never negative; you can ignore it).
          *   *Anti-Automatic:* Legal says once flagged, the department must follow up (information fused to duty); reports change behavior (not purely information); people can't "un-know."
      *   **Requirements:**
          *   Pick one of the three options (Automatic, Opt-in, Kill).
          *   Specify timeline and carve-outs.
          *   Provide reasoning.
          *   State the strongest case for the other side honestly (avoid strawmanning the right-to-know argument).
          *   Max 2 pages.
          *   No citations (laypeople audience).
          *   Tone: Professional, reasoned, persuasive, acknowledging complexity (reporter background).

  2.  **Determine the Stance:**
      *   *Option A (Automatic):* Risks anxiety, resource strain (legal point), potential harm from false positives/overmedicalization. Good's Theorem doesn't hold when information triggers mandatory action.
      *   *Option B (Opt-in):* Respects autonomy, reduces resource strain, filters for those who want to know. Might miss vulnerable populations who don't opt-in.
      *   *Option C (Kill):* Safest legally/ethically regarding harm, but wastes the model's potential public health benefit.
      *   *Decision:* **Opt-in** seems the most balanced compromise. It acknowledges the value of the information (countering the "kill" argument) but respects the legal/ethical constraints regarding mandatory follow-up and psychological harm (countering the "automatic" argument). It addresses the "Good's Theorem" flaw (you can't ignore it if the system forces action).

  3.  **Drafting - Section by Section:**

      *   **Header/Opening:** Acknowledge the role (reporter/panelist), the gravity of the decision, and the specific vote.
      *   **The Recommendation:** Clearly state the choice (Opt-in) with timeline and carve-outs.
      *   **The Reasoning (The "Why"):**
          *   Address Good's Theorem directly. It assumes information is passive. Here, it's active (triggers legal duty).
          *   Address the Legal constraint. If we mail automatically, we trigger mandatory follow-up. Do we have the resources? Is it ethical to create a duty we can't fulfill gracefully?
          *   Address Patient Autonomy. Some people *don't* want to know.
          *   Address Equity (Carve-outs). Ensure language access, digital divide issues.
      *   **The Counter-Argument (The "Other Side"):**
          *   The Right-to-Know/Public Health benefit.
          *   Automatic mailing reaches the people who need it most (who wouldn't opt-in).
          *   Paternalism vs. Protection.
      *   **Closing:** Call to action for the vote.

  4.  **Refining the Tone:**
      *   Needs to sound like a reporter who understands science but speaks to laypeople. Clear, concise, no jargon.
      *   Needs to be respectful of the economist's point but firm on the legal/ethical rebuttal.
      *   Needs to fit within 2 pages (approx. 500-600 words single spaced, or up to 800-900 depending on formatting. I'll aim for ~700-800 words to be safe on content density without exceeding visual "two pages").

  5.  **Drafting - Content Details:**
