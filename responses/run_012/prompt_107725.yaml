      *   *Carve-outs:* Language translation, easy opt-out, clear counseling support.
      *   *Good's Theorem rebuttal:* Information + Obligation != Pure Information.
      *   *Counter-argument:* The "silent suffering" argument. People who don't know they're at risk die sooner.

  6.  **Review against Constraints:**
      *   Pick one option? Yes (Opt-in).
      *   Timeline/Carve-outs? Yes (6-month pilot, multi-language, counseling).
      *   Reasoning? Yes (Legal duty, psychological harm, resource allocation).
      *   Strongest case for other side? Yes (Public health impact, reaching the unaware).
      *   Two pages max? Yes (will keep word count tight).
      *   No citations? Yes.
      *   Laypeople audience? Yes (explain concepts simply).

  7.  **Final Polish:** Check the flow. Ensure the transition between the economist's argument and the legal rebuttal is smooth. Make sure the "reporter" voice comes through—objective but engaged.

