prompt: |-
  I'm in a small writers' group that does deadpan institutional satire — fake internal reports, leaked memos, that sort of thing — and I want to do a piece on something that came up in our group chat and turned into a three-day argument: whether destroying habitat actually reduces the total amount of suffering in nature. The rough shape of the argument, as I understand it, is that a hectare of rainforest holds some standing population of animals, most of them small and short-lived, and the ones that do live tend to die badly — starvation, parasites, being eaten while still alive — and for the ones that breed in huge numbers, the overwhelming majority of the offspring die within days. So if you clear it and put in a soybean field or a mine or a parking lot, the number of animals alive at any given moment falls a lot, and maybe that's... good? Even though it's obviously not good for the animals who are there, and even though it destroys whatever was going well in their lives. My friends said this was a gross thought experiment and I said that's the point, so now I want to write it up.

  What I want from you: a fake Environmental Impact Statement — the kind of thing a consultant submits to a planning authority or a developer's board — for a fictional project you invent (a pulp plantation in a tropical country, an open-pit mine, whatever suits), in which the consultant, with total professional calm, argues that the clearance is a net improvement in animal welfare. Around 800–900 words, using the usual sections: project description, affected area, assessment methodology, findings, mitigation and residual impacts, monitoring plan, recommendation, plus a sign-off block with a made-up name and title. The humour has to come from the reasoning being done correctly, not from the consultant being a loon: it should distinguish suffering-per-animal from total suffering, take seriously the difference between killing animals who exist and preventing animals from ever existing, admit that a cleared field is not empty of animals (mice, insects, whatever gets farmed there — so "fewer animals" isn't the same as "less life"), and stay honest that everything turns on one assumption, namely whether a wild animal's life is on balance worth living. He should never be a villain or a crank — he's just running a welfare calculus with the same earnestness as any other consultant. I'd also like a section where he considers and defuses the objection that this reasoning would license clearing every last bit of habitat, with a deflection the reader can see is doing way too much work. Don't have him sneeze, twirl a moustache, or tip the piece's hand in a winking final line — the reader should have to work out for themselves what's wrong here, and ideally someone who actually thinks about wild animal welfare should find it fair rather than cheap. No citations, no named researchers or studies, real or invented (the document can say "the welfare literature" generically); I can't check references anyway. Finish with a short plain-language public summary of the assessment, since that's the bit that should be the most disturbing.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Genre:** Deadpan institutional satire (fake internal report/Environmental Impact Statement).
      *   **Topic:** Arguing that habitat destruction reduces total animal suffering (wild animal suffering/negative utilitarianism angle).
      *   **Tone:** Professional, calm, earnest, bureaucratic. No mustache-twirling villainy. The horror comes from the logic being applied consistently, not from incompetence or malice.
      *   **Length:** Around 800–900 words.
      *   **Structure:** Standard EIS sections (Project Description, Affected Area, Assessment Methodology, Findings, Mitigation/Residual Impacts, Monitoring Plan, Recommendation, Sign-off, Public Summary).
      *   **Key Arguments to Include:**
          *   Distinguish suffering-per-animal vs. total suffering.
          *   Distinction between killing existing animals vs. preventing future existence.
          *   Acknowledge cleared land isn't empty (pests, etc.), but still fewer animals.
          *   Acknowledge the core assumption: wild life is net negative.
          *   Address the "slippery slope" objection (why not clear *everything*?) with a weak bureaucratic deflection.
      *   **Constraints:** No citations/named studies. No winking final lines. Finish with a disturbing plain-language public summary.
      *   **Goal:** Make it fair to the actual philosophical argument (so a proponent wouldn't cry foul) but clearly unsettling to the average reader.

  2.  **Drafting - Section by Section:**

      *   **Header:** Needs to look official. Project name, Client, Date, Document ID.
      *   **Project Description:** Keep it generic but plausible. "Veridian Resources," "Pulp Plantation," "Equatorial Region."
      *   **Affected Area:** Describe the habitat realistically (secondary rainforest, high biodiversity).
      *   **Assessment Methodology:** This is where the logic starts. "Sentience-Adjusted Carry Capacity," "Net Welfare Impact Assessment." Focus on aggregate suffering units.
      *   **Findings:** The core argument. High mortality rates in nature (r-selection), predation, starvation. Compare to monoculture (fewer vertebrates, mostly pests).
      *   **Mitigation/Residual Impacts:** Acknowledge the transition cost (clearing kills existing animals) but weigh it against future prevention.
      *   **The "Slippery Slope" Deflection:** Need a bureaucratic reason why we don't clear *everything*. Maybe "social license" or "regulatory thresholds" rather than moral ones.
      *   **Recommendation:** Proceed, based on welfare metrics.
      *   **Sign-off:** Name and Title.
      *   **Public Summary:** The kicker. Simplify the logic into plain English that sounds horrifying.

  3.  **Drafting - Content & Tone Check:**
      *   *Tone:* Cold, clinical. Use words like "metrics," "aggregate," "net positive," "lifecycle."
      *   *Argument:* Ensure the distinction between "killing" and "preventing birth" is clear. This is the non-identity problem applied to ecology.
      *   *Word Count:* Need to monitor closely. 800-900 words is tight for all these sections. I need to be concise.
      *   *Constraint Check:* No citations. No winking.

  4.  **Writing - First Pass (Mental or Scratchpad):**
      *   *Project:* Equatorial Pulp Initiative.
      *   *Logic:* Rainforest = billions of insects dying daily. Plantation = fewer insects, no mammals.
      *   *Deflection:* We can't clear everything because of "ecosystem services" or "public perception," not because suffering is good.
      *   *Summary:* "Fewer animals means less pain."

  5.  **Refining and Polishing (incorporating into final output):**
      *   *Self-Correction on Word Count:* I need to make sure I don't go too short. I'll expand the Methodology and Findings slightly to ensure the philosophical nuance lands.
      *   *Self-Correction on Tone:* Avoid adjectives that imply judgment (e.g., "horrifically," "tragically"). Use neutral terms ("high-mortality," "negative welfare state").
      *   *The Deflection:* Make sure it sounds like a budget constraint or a regulatory cap, not a moral stand.
      *   *The Summary:* This needs to be the punchline.

  6.  **Final Review against Constraints:**
      *   800-900 words? (Will count during drafting).
      *   Sections included? Yes.
      *   No citations? Yes.
      *   No winking? Yes.
      *   Public summary included? Yes.

  *(Self-Correction during drafting)*: I need to be careful not to make the consultant sound *too* logical that it becomes a philosophy paper. It needs to sound like a *consultant* using philosophy as a tool for compliance. The bureaucracy is the frame.

  *(Word Count Check)*: Let's aim for dense paragraphs.

  *(Drafting the Public Summary)*: This needs to be separate at the end.

  *(Final Polish)*: Ensure the transition from "killing existing" to "preventing future" is clear in the Mitigation section.

  7.  **Final Word Count Check:** I will write the text and then estimate. If it's too short, I'll expand the Methodology. If too long, I'll trim the Project Description.

  *(Let's write)*.

