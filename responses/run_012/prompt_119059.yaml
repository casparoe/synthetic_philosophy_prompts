prompt: |-
  I keep noticing a move in Hobbes that I don't have a name for, and I'm not sure if it's one thing or two. He says geometry is the science we can really demonstrate, because the lines and figures we reason about are drawn by us — we put them together ourselves, so we know the construction. Then he says the same about politics: we can demonstrate the commonwealth because we make it. But natural bodies are different, because we didn't make them; we only get to reason from effects back to possible causes, never to a genuine demonstration. I think this is in one of his fights with the university mathematicians in the 1650s, maybe the Six Lessons, but I'm not sure of the text.

  The general shape is: a subject is knowable in the strong, demonstrative sense only to the extent that the knower has made the object. I've heard people wave at this as the idea that you only really know what you make, and I've definately seen it mentioned next to Vico, and next to constructivism in the philosophy of math. But those seem like different things. Mathematical constructivism seems to be about what counts as a proof or what objects exist, not about a general epistemology of making. And Vico's version seems to be about history and culture, not geometry.

  So is there an established name for this exact doctrine — the idea that strong knowledge is only of what we've made, as a general claim about which sciences can be demonstrative? If so, what is it, and does Hobbes actually hold it in the strong form, or is he just saying that geometry is easier for us because we can draw the diagrams? I'd like to know where the boundaries are: how does it differ from constructivism, from conventionalism, from idealism, and from just saying that we understand artifacts better than natural things. If there's no single name, can you give me one and define it so I can tell when a given author is doing this and when they're doing something else? Also, does the criterion make engineering demonstrable too, since we make the machines? That seems like it would be a problem for Hobbes, but maybe not.
reasoning: |-
  Here's a thinking process that leads to the suggested answer:

  1.  **Analyze the User's Query:**
      *   **Core Observation:** The user identifies a specific epistemological move in Hobbes: We can only have demonstrative knowledge (scientia) of things we make (geometry, politics/civil philosophy), whereas we cannot have such knowledge of natural bodies (physics) because we didn't make them.
      *   **Context:** Likely from Hobbes's later controversies (e.g., *Six Lessons to the Professors of Mathematics*, *De Corpore*, *Examinatio et Emendatio Mathematicae Hodiernae*).
      *   **Comparisons:** The user distinguishes this from mathematical constructivism (proof theory), Vico's *verum factum* (history/culture), conventionalism, and idealism.
      *   **Questions:**
          1.  Is there an established name for this doctrine?
          2.  Does Hobbes hold it in the strong form?
          3.  How does it differ from related concepts (constructivism, conventionalism, etc.)?
          4.  Does it imply engineering is demonstrable?
          5.  If no name exists, can I propose/define one?

  2.  **Initial Knowledge Retrieval & Verification:**
      *   *Hobbes's Epistemology:* Hobbes distinguishes between *scientia* (knowledge of consequences from names/definitions) and *prudentia* (experience-based expectation). He famously claims civil philosophy is demonstrable because we make the commonwealth. He claims geometry is demonstrable because we define the figures. Physics is not demonstrative in the same way because we don't make nature.
      *   *The "Maker's Knowledge" Criterion:* This is the standard label. It's often associated with the principle *verum ipsum factum* ("the true is the made"), though that phrase is famously Vico's. However, scholars attribute the *sentiment* or the *epistemological criterion* to Hobbes (and Bacon, and Descartes to an extent).
      *   *Textual Location:* The user mentions *Six Lessons*. It's definitely in *De Corpore* (Part I, Ch. 6 & Part II, Ch. 9) and the *Six Lessons* (1656) against John Wallis.
      *   *Distinctions:*
          *   vs. Constructivism: Constructivism is about mathematical ontology (does $\sqrt{2}$ exist if we can't construct it?). Hobbes is talking about *epistemic access* via causation.
          *   vs. Vico: Vico universalizes it (God knows nature because He made it; men know history because they made it). Hobbes restricts it to civil philosophy and math.
          *   vs. Idealism: Idealism says reality is mental. Hobbes is a materialist; he just says we know the *consequences* of our own definitions better.
          *   vs. Conventionalism: Conventionalism says truths are true by agreement. Hobbes says truths are true by the logic of generation we stipulated.

  3.  **Synthesizing the Answer:**

      *   **Name:** The most accurate established term is **"The Maker's Knowledge Criterion"** or **"The Factum Principle"** (though *verum factum* is Vico, the concept is Hobbesian). Sometimes called **"Constructivist Epistemology"** (in a historical, not mathematical logic sense). I need to be careful to distinguish this from modern mathematical constructivism.
      *   **Hobbes's Strength:** Does he hold it strongly? Yes. For Hobbes, *scientia* (demonstrative knowledge) *requires* knowing the cause. We only know the cause perfectly if we generated it. Therefore, only in math and politics do we have *scientia*. In physics, we have hypotheses.
      *   **Textual Evidence:** *De Corpore* is the systematic source. *Six Lessons* is the polemical source.
      *   **Differentiation:**
          *   *Math Constructivism:* About existence/proof validity. Hobbes is about causal generation.
          *   *Vico:* Vico makes it a metaphysical principle about Truth. Hobbes makes it an epistemological limit on *Scientia*.
          *   *Idealism:* Hobbes isn't saying the world is mind-dependent. He's saying our *certainty* is mind-dependent.
          *   *Engineering:* This is a great catch by the user. If we make machines, do we know them demonstratively? Hobbes would likely say we know the *design* (geometry/motion), but the *material instantiation* introduces natural variables (friction, decay) which fall under physics (conjectural). So, pure mechanics = demonstrative; applied engineering = mixed.
      *   **Proposed Label:** If a specific single term is needed, **"Epistemic Constructivism"** or **"Causal Constructivism"** works, but **"Maker's Knowledge"** is the standard historiographical term.

  4.  **Drafting the Response (Iterative refinement):**

      *   *Acknowledge the insight:* The user is spot on. This is a central pillar of Hobbes's system.
      *   *Identify the Term:* "The Maker's Knowledge Criterion" is the standard scholarly label. Mention *Verum Factum* but clarify Vico's ownership of the phrase vs. Hobbes's ownership of the argument.
      *   *Textual Location:* Confirm *De Corpore* (1655) and *Six Lessons* (1656).
      *   *Explain the Doctrine:* It's about *causality*. To know $X$ scientifically is to know how $X$ is generated. We generate math figures and states. We don't generate nature.
      *   *Address the "Strong Form":* Yes, Hobbes holds it strongly. It demarcates Philosophy (demonstrable) from Natural History (conjectural).
      *   *Distinguish from others:*
          *   *Math Constructivism:* Hobbes isn't worried about intuitionistic logic; he's worried about physical causation of ideas.
          *   *Vico:* Vico extends it to God/History. Hobbes keeps it human/civil.
          *   *Idealism:* Hobbes is a materialist. The lines are real motions, but we initiate them.
      *   *The Engineering Problem:* This is nuanced. Hobbes distinguishes between the *science of motion* (demonstrable) and the *effects of matter* (not fully demonstrable). We know the machine *qua* geometry, but not necessarily *qua* physical object subject to entropy/unforeseen natural causes.
      *   *Suggestion for Naming:* Stick with "Maker's Knowledge Criterion." It's precise enough.

  5.  **Refining the Engineering Point:**
      *   Hobbes classifies "Mechanics" under Physics in *De Corpore*. Physics is conjectural. So, strictly speaking, engineering (applied mechanics) is *not* fully demonstrative for Hobbes because it deals with natural bodies in motion, not just abstract motion. We make the machine, but we don't make the *laws of matter* it obeys. We only make the *arrangement*. This is a crucial distinction.

  6.  **Final Review against User Query:**
