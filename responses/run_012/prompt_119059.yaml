  7.  **Final Polish:** Ensure tone is scholarly but accessible. Emphasize that while Vico gets the slogan, Hobbes gets the epistemological machinery. (Self-correction: Make sure to mention that for Hobbes, "making" in geometry is mental construction/definition, whereas in politics it is actual institutional construction).

  8.  *(Self-Correction during drafting)*: Wait, is it "Constructivist Epistemology"? Some scholars use that. But "Maker's Knowledge" is more specific to the "we made it" aspect. I will offer "Maker's Knowledge" as the primary term and mention "Constructivist" as a descriptor.

  9.  *(Check on Engineering)*: Hobbes divides Philosophy into First Philosophy (logic), Geometry (quantity), Physics (motion of natural bodies), and Civil Philosophy (motion of artificial bodies/men). Physics is hypothetical. Civil is demonstrative. Mechanics falls under Physics usually, but if it's about the *design* it's geometry. If it's about the *working* it's physics. I need to be careful here. The key is *causal generation*. We generate the Commonwealth. We generate the definition of a Circle. We do not generate the motion of the stars. Do we generate the motion of a clock? We assemble it, but the *force* is natural. Hobbes would likely say we have demonstrative knowledge of the *design* (geometry) but only probable knowledge of the *longevity/function* (physics).

