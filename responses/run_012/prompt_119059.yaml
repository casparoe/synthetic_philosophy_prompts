answer: |-
  You have put your finger on one of the most distinctive and consequential features of Hobbes's philosophical system. You are correct that this is not merely a casual remark but a structural pillar of his epistemology.

  Here is the breakdown of the doctrine, its name, its textual location, and how to distinguish it from the related concepts you mentioned.

  ### 1. The Name: "The Maker's Knowledge Criterion"
  There is no single Latin tag that Hobbes himself uses consistently as a title, but in secondary literature, this is standardly referred to as the **"Maker's Knowledge Criterion"** or the **"Factum Principle."**

  You will often see it discussed alongside the Vichian phrase ***verum ipsum factum*** ("the true is the made"). However, scholars (such as Paolo Rossi, N. Malcolm, and T. Sorell) generally agree that while Vico coined the slogan, **Hobbes built the epistemological machinery.**

  If you need a precise label to use in your own writing to distinguish it from mathematical constructivism or Vico's historicism, I recommend: **"Hobbesian Causal Constructivism"** or simply **"The Maker's Knowledge Thesis."**

  ### 2. Textual Location
  You suspected the *Six Lessons* (1656), and you are right that it appears there during his feud with John Wallis. However, the systematic formulation is in **_De Corpore_ (1655)**, specifically:
  *   **Part I, Chapter 6:** Where he defines philosophy as knowledge from causes to effects or effects to causes.
  *   **Part II, Chapter 9:** Where he distinguishes geometry (where we cause the figures) from physics (where we do not cause the motions).

  In *Six Lessons*, he sharpens this into a weapon against the Oxford mathematicians, arguing that because they treat geometry as discovering pre-existing truths rather than constructing consequences from definitions, they fail to understand the nature of demonstration.

  ### 3. Does Hobbes Hold It in the "Strong Form"?
  **Yes.** For Hobbes, this is not just a heuristic about what is "easier" to know; it is a metaphysical condition for *Scientia* (demonstrative knowledge).

  *   **The Logic:** To have *scientia* of a thing, you must know its **cause**.
  *   **The Constraint:** You can only perfectly know a cause if you **generated** it.
  *   **The Result:**
      *   **Geometry:** We define the point, line, and circle. We generate them in our mind (or on paper). Therefore, we know their causes perfectly. **Demonstrable.**
      *   **Civil Philosophy:** We create the Commonwealth via contract. We are the authors of the sovereign's authority. Therefore, we know the causes of political order. **Demonstrable.**
      *   **Natural Philosophy (Physics):** We did not create the stars, the weather, or the human body. We can observe effects and hypothesize causes, but we cannot verify the generation. **Conjectural (not demonstrative).**

  This is why Hobbes is so confident in his politics and geometry but surprisingly modest (in principle) about his physics. He believes his physics is *probable*, not certain, because nature is God's artifact, not man's.

  ### 4. Distinguishing It from Related Doctrines
  You are right to sense that "Constructivism," "Idealism," and "Vico" are different. Here are the boundaries:

  **A. vs. Mathematical Constructivism**
  *   **Modern Constructivism:** Concerned with ontology and logic. (e.g., "Does $\sqrt{2}$ exist if we cannot construct an algorithm for it?") It is about what counts as a valid *proof*.
  *   **Hobbes's View:** Concerned with **causality**. For Hobbes, a geometric truth is demonstrable not because we construct a proof, but because we **construct the object** via definition. The truth lies in the consistency of the generation we stipulated. He is not an intuitionist; he is a **causal generationist**.

  **B. vs. Vico (*Verum Factum*)**
  *   **Vico:** Universalizes the principle metaphysically. God knows nature because He made it; Man knows history/culture because he made it. It is a theory of **Truth**.
  *   **Hobbes:** Restricts the principle epistemologically. It is a theory of **Certainty**. Hobbes doesn't claim we make "Truth" in a metaphysical sense; he claims we can only have *demonstrative certainty* about what we generate. Vico is romantic/historicist; Hobbes is mechanistic/materialist.

  **C. vs. Idealism**
  *   **Idealism:** Claims reality is mental or dependent on the mind.
  *   **Hobbes:** Is a thoroughgoing **Materialist**. The lines in geometry correspond to real motions. The Commonwealth is a real artificial man. He is not saying the object *only* exists in the mind; he is saying our *access to its causal structure* is privileged because we initiated that structure.

  **D. vs. Conventionalism**
  *   **Conventionalism:** Says truths are true by agreement (e.g., Poincaré on geometry).
  *   **Hobbes:** Says truths are true by **logical consequence from stipulated generation**. It is not arbitrary agreement; once we define how a line is generated, the consequences are necessary. It is closer to **Nominalism** than Conventionalism.

  ### 5. The Engineering Problem
  This is an excellent test case. If we make machines, is engineering demonstrative?

  For Hobbes, the answer is **No, not fully.** Here is the boundary:
  *   **The Design (Geometry/Mechanics):** To the extent that engineering is about the *arrangement of parts* and abstract motions (gears, levers), it falls under Geometry and is demonstrable. We know how the lever *should* work because we defined the mechanics.
  *   **The Instantiation (Physics):** To the extent that engineering deals with *actual matter* (friction, metal fatigue, wind resistance, entropy), it falls under Natural Philosophy. Since we did not make the properties of iron or the laws of friction (God/Nature did), we cannot have demonstrative knowledge of whether the bridge will hold in 10 years. We only have probability.

  So, for Hobbes, **Pure Mechanics** is demonstrative; **Applied Engineering** is conjectural. This preserves his distinction: we make the *form*, but not the *matter*.

  ### 6. Summary for Your Usage
  If you are writing about this, here is a proposed definition you can use to identify this move in other authors:

  > **The Maker's Knowledge Criterion:** An epistemological doctrine asserting that demonstrative knowledge (*scientia*) of an object is possible if and only if the knower is the causal generator of that object. It demarcates sciences of the artificial (mathematics, politics) from sciences of the natural (physics, biology) based on human agency rather than subject matter.

  **Checklist to distinguish it from similar moves:**
  1.  **Is it about Proof or Cause?** If it's about proof validity, it's Mathematical Constructivism. If it's about causal generation, it's Hobbesian Maker's Knowledge.
  2.  **Is it Metaphysical or Epistemic?** If it claims reality *is* what we make, it's Idealism/Vico. If it claims *certainty* is limited to what we make, it's Hobbes.
  3.  **Does it apply to Nature?** If the author claims we can know nature demonstratively, they are rejecting the Hobbesian criterion (like Spinoza or Leibniz might). If they retreat to hypothesis for physics, they are following Hobbes.

  You have correctly identified a move that makes Hobbes a unique precursor to modern social science (we can know society because we build it) without falling into idealism (we cannot know nature because we didn't build it). It is the foundation of his claim that Civil Philosophy is a "science" in a way that Natural Philosophy is not.
