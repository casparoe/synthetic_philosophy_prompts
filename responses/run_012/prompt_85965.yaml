answer: |-
  1) "The question"

  In the Aunt Hillary dialogue, the colony's 'decisions' lack a central locus of state, unlike your brain. Define the necessary condition for a system to "have a mind." Argue whether the colony meets this condition despite lacking a central state. You must identify a specific system comparable in organization and goal-seeking to the colony that your criterion excludes from having a mind. If your criterion includes all such systems, explicitly accept the consequence. Finally, clarify the ontological status of the individual ants: does the colony's mindedness negate, suppress, or ignore the ants' own mindedness? Justify your stance. You must commit to one view; hedging will be penalized.

  **Time:** 50 minutes. **Length:** Approx. 800–1000 words.

  2) "Model answer"

  To "have a mind" is to possess a substrate-independent functional organization capable of maintaining homeostasis and modeling environmental constraints to achieve goals. The physical substrate matters less than the causal structure: if a system processes information to preserve its integrity against entropy, it possesses mentality. This is functionalism. The lack of a central locus of state is irrelevant; state can be distributed. In the colony, the pheromone trails constitute the memory, and the ant movements constitute the processing. There is no "homunculus" inside the brain either, only neurons firing; the colony is simply a slower, larger-scale version of the same computational architecture. Therefore, the colony has a mind.

  This definition incurs a cost. If distributed goal-seeking is sufficient, then a global economic market also qualifies. Prices signal scarcity (pheromones), agents act to maximize utility (ants), and the system self-corrects to maintain stability (homeostasis). There is no central banker controlling every transaction, just as there is no central ant. My criterion forces me to accept that the global economy has a mind. I accept this consequence. It sounds absurd only because we associate minds with biological speech, but if minds are patterns of control, the economy fits. Denying this would require appealing to biological substrate, which is magic thinking incompatible with CS principles.

  Regarding the ants: their status is negated within the context of the colony's mind. This is not because they are destroyed, but because they function as components. In my brain, individual neurons do not have minds; they are causal mechanisms subserving the larger pattern. If I claim the colony is the mind, the ants are the neurons. To claim both the colony and the ants have independent minds creates a category error regarding levels of abstraction. The colony's mind is an emergent property of the ants' blind interactions. The ants are not "suppressed"; they are simply the wrong level of granularity to attribute mentality to in this specific system description.

  However, this raises the "Chinese Nation" objection: if we replace ants with humans signaling via flags, do the humans lose their minds? No, because humans have internal minds independent of the signal system. Ants likely do not. Thus, the colony's mind does not negate the ants' minds because the ants likely lacked them to begin out. If the ants were humans, we would have nested minds: the human participants retain their mentality while collectively constituting a larger, slower colonial mind. But for actual ants, the colony is the primary minded entity.

  In conclusion, minds are functional patterns, not locations. The colony qualifies. The cost is admitting other distributed systems (like economies) also qualify. The ants are components, analogous to neurons, and do not possess competing minds. This view is consistent, avoids biological chauvinism, and accepts the ontological commitment required by functionalism.

  3) "Marking scheme"

  **Total: 20 Marks**

  1.  **Definition of Mind (4 marks):** Clear necessary condition given (e.g., functionalism, information processing).
      *   *Miss:* Vague appeals to "complexity" or "consciousness" without defining mechanisms.
  2.  **Addressing Central State (4 marks):** Explicitly argues why lacking a central locus does/doesn't matter.
      *   *Miss:* Ignoring the prompt's specific worry about where the decision "lives."
  3.  **Boundary/Consequence (4 marks):** Identifies a comparable system excluded OR explicitly accepts the consequence (e.g., economies have minds).
      *   *Miss:* Hedging ("maybe economies do, maybe not") or choosing a trivial counter-example (a rock).
  4.  **Status of Ants (4 marks):** Clear verdict on whether ants retain minds (nested vs. component).
      *   *Miss:* Contradiction (e.g., ants are neurons but also have full minds).
  5.  **Commitment (4 marks):** Consistent argument throughout without contradicting earlier premises.
      *   *Miss:* Switching definitions halfway through to avoid difficult implications.

  4) "Borderline notes"

  Both A and B students will likely define functionalism and say "yes" to the colony. To separate them: check how they handle the **cost**. A B-grade student will say "economies are too different" without explaining why functionally. An A-grade student will either bite the bullet ("yes, economies have minds") or find a rigorous functional distinction (e.g., "economies lack unified homeostasis"). Also, check the **ants**. A B-grade student says "ants are like neurons" but forgets neurons aren't conscious. An A-grade student notices the tension: if ants are humans, do they lose freedom? Addressing the *nested minds* possibility shows deeper engagement than simple reductionism. Look for consistency, not vocabulary.
