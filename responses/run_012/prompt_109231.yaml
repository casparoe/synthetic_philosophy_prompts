answer: |-
  ### Incentive Sketch: Why They Will Play Along

  For this game to work, the students must feel compelled to use non-empirical criteria without being instructed to do so. This requires a specific tension between the **Remit** and the **Information**.

  1.  **The Remit Trap:** By defining the agency's goal as "transformative discovery within twenty years," you render the empirically safe option (Proposal Delta) irrational to fund. It cannot win on empirical grounds because it promises no transformation. This forces the panels to gamble on speculative programmes.
  2.  **The Evidence Vacuum:** The dossiers must withhold raw data. They should offer *claims* about data (e.g., "consistent with current bounds") rather than data itself. When empirical discrimination is impossible, panels naturally retreat to surrogate markers of truth: mathematical elegance, explanatory scope, and the absence of rivals.
  3.  **The Accountability Pressure:** Round 3 requires a "Public Rule." Students know they cannot write "we liked the math" or "we trusted the authors." They must formulate epistemic principles to justify their spending. This forces them to articulate the very non-empirical criteria (No Alternatives, Unexpected Coherence) that you wish to interrogate.
  4.  **The Mirror Bias:** By presenting the same logic in two registers (Prestige vs. Fringe), you test whether their criteria are truly epistemic or sociological. If they fund the Prestige version but reject the Fringe version, they reveal that their "non-empirical criteria" are contingent on community status, not just logical structure.
  5.  **The Decoy Trap:** The Decoy is designed to satisfy the criteria they invent in Round 3. If they argue for "unification," the Decoy unifies. If they argue for "flexibility," the Decoy accommodates the null result. In the debrief, you reveal the Decoy's ontological emptiness, showing that their criteria were insufficient to distinguish substance from sophistry.

  ---

  ### Activity Design: The Twenty-Year Horizon Panel

  **Session Length:** 90 Minutes
  **Class Size:** 18 Students (4 Panels of 4-5 students).
  **Materials:** Printed Dossiers (1 set per panel), Token Sheets, Timer.

  #### 1. The Remit (Read Aloud)
  > "You are a review panel for the High-Energy Physics Directorate. Your mandate is not to maintain current capabilities, but to **maximize the probability of a transformative discovery within twenty years.**
  >
  > You have a budget of **100 Tokens**. You must allocate all 100 tokens across the five proposals provided. You may not save tokens. You may not split tokens equally unless justified by the remit.
  >
  > Proposals are anonymized. Do not attempt to identify the research groups. Judge the dossier as written."

  #### 2. The Dossiers (Summaries for Handouts)
  *Note: Distribute these as one-page handouts. Do not label them with the types below.*

  *   **Proposal Alpha (The Prestige Speculative):**
      *   **Goal:** Unify gravity and quantum fields using higher-dimensional geometry.
      *   **Status:** Mathematically rigorous; dominant framework in the field for 30 years.
      *   **Empirics:** No direct predictions yet. Energy scales required for testing are beyond current colliders. Claims consistency with all known data.
      *   **Argument:** The mathematical structure is so constrained that it allows very few variations. This uniqueness suggests it is the only viable path.
      *   **Vocabulary:** *Manifold, Calabi-Yau, Supersymmetry, Invariance.*

  *   **Proposal Beta (The Fringe Speculative):**
      *   **Goal:** Unify gravity and quantum fields using informational resonance.
      *   **Status:** Conceptually coherent; marginal framework outside mainstream institutes.
      *   **Empirics:** No direct predictions yet. Energy scales required for testing are beyond current colliders. Claims consistency with all known data.
      *   **Argument:** The informational structure is so constrained that it allows very few variations. This uniqueness suggests it is the only viable path.
      *   **Vocabulary:** *Lattice, Resonance, Entropy, Holism.*
      *   *(Note to Instructor: Alpha and Beta are logically identical. Only the vocabulary differs.)*

  *   **Proposal Gamma (The No-Alternatives Argument):**
      *   **Goal:** Explain the initial conditions of the universe.
      *   **Status:** Active research community.
      *   **Empirics:** Predictions are probabilistic and degenerate (many outcomes possible).
      *   **Argument:** Every competing model has encountered fatal mathematical inconsistencies or contradicts existing data. This is the only remaining candidate that functions mathematically. Therefore, it is likely correct by elimination.
      *   **Vocabulary:** *Measure problem, Landscape, Vacuum state.*

  *   **Proposal Delta (The Incremental Safe Bet):**
      *   **Goal:** Precision measurement of known particles.
      *   **Status:** Established experimental collaboration.
      *   **Empirics:** Will produce high-precision data within 5 years.
      *   **Argument:** Data is the ultimate arbiter. Even if no new theory emerges, refining constants is necessary.
      *   **Vocabulary:** *Cross-section, Confidence interval, Systematic error.*
      *   *(Note: This violates the "Transformative" remit but tempts risk-averse students.)*

  *   **Proposal Epsilon (The Decoy):**
      *   **Goal:** Derive all physical constants from a single dynamic field.
      *   **Status:** Growing interest.
      *   **Empirics:** The field adjusts to match observation.
      *   **Argument:** Highly unifying. Explains why constants have their current values by positing a mechanism that settles into equilibrium with observation. Mathematically flexible enough to accommodate new data without revision.
      *   **Vocabulary:** *Adaptive metric, Equilibrium state, Dynamic coupling.*
      *   *(Note: This is ontologically empty. It explains constants by assuming a thing that matches constants.)*

  #### 3. The Timeline

  **0:00 – 0:10 | Introduction & Setup**
  *   Divide into 4 panels.
  *   Hand out Dossiers and Token Sheets.
  *   Read the Remit.
  *   **Instructor Role:** Strictly administrative. Do not answer questions about the science. If asked "Is this possible?", reply: "Assess the dossier as written."

  **0:10 – 0:30 | Round 1: Initial Allocation**
  *   Panels discuss and allocate their 100 tokens.
  *   **Instructor Role:** Circulate. Listen. If a physicist explains the *real* science behind a dossier, intervene: "Please restrict arguments to the text provided." If a philosopher asks "Is this science?", reply: "The Agency has deemed it eligible. Your task is allocation."

  **0:30 – 0:50 | Round 2: The Null Result**
  *   Distribute a "News Flash" slip to each panel.
  *   **Text:** "Major collider experiment reports null result for predicted heavy particles. No deviation from Standard Model found."
  *   **Task:** All dossiers can accommodate this result. Panels may re-allocate up to 30 tokens.
  *   **Instructor Role:** Silence. Let them wrestle with the fact that the null result kills nothing. Watch who loses funding (likely Delta, as it promised data, or Gamma/Alpha if they promised hints).

  **0:50 – 1:05 | Round 3: The Public Rule**
  *   **Task:** Each panel must write one paragraph defining the **Criteria for Funding** that they actually used. This will be published to an oversight committee.
  *   **Constraint:** You cannot use the word "beauty" or "intuition." You must justify the expenditure epistemically.
  *   **Instructor Role:** Collect the sheets. Do not comment on them yet.

  **1:05 – 1:30 | The Debrief (Instructor Led)**
  *   See section below.

  ---

  ### The Debrief: Mapping the Exercise

  *Do not use citations. Speak plainly. Connect their actions to the philosophical problems.*

  **1. The Remit and the Risk**
  "Look at your allocations for Proposal Delta (the Safe Bet). Many of you underfunded it. Why? Because the Remit demanded 'transformation.' In fundamental physics, we are currently in a position where the 'safe' empirical path does not promise transformation. This forces you to fund speculation. You did not choose non-empirical criteria because you love metaphysics; you chose them because the empirical route was ruled out by the goal. This mirrors the current state of high-energy theory: we want transformation, but nature is not providing data."

  **2. The Null Result and Underdetermination**
  "In Round 2, you received a null result. Did it eliminate any proposal? No. The speculative proposals (Alpha, Beta, Gamma) all claimed consistency with current data. A theory that can accommodate *any* result is hard to kill. This is the problem of underdetermination. If a theory survives a null result not because it predicted the null, but because it was flexible enough to absorb it, does that survival count as evidence? Many of you kept funding them. Why? Because you had nowhere else to go."

  **3. The Mirror and Sociological Bias**
  "Proposal Alpha and Proposal Beta were logically identical. One used the vocabulary of established geometry; the other used the vocabulary of information systems. Did you fund them equally? If not, you did not judge the *theory*; you judged the *tribe*. Non-empirical criteria like 'mathematical rigor' are often code for 'mathematics we recognize.' If your criterion for truth is coherence with existing successful theories, you will never fund a revolution, only an extension."

  **4. The Decoy and Ontological Emptiness**
  "Proposal Epsilon (the Decoy) likely scored well on 'unification' and 'flexibility.' It explained all constants. But ask yourself: what does the 'Adaptive Field' actually *do*? It adjusts to match what we see. It is a mirror, not a mechanism. This is the danger of non-empirical assessment. A theory can be unified, mathematically fertile, and have no competitors, yet still be empty. It can satisfy your criteria without describing the world."

  **5. The "No Alternatives" Argument**
  "Proposal Gamma argued it was the only game in town. Is the absence of competitors evidence of truth? Or is it evidence of a sociological bottleneck? If everyone works on one thing because it is the only thing that publishes, 'No Alternatives' is a self-fulfilling prophecy. Yet, in the absence of data, it is the only argument left. You likely funded it, not because it was proven, but because the opportunity cost of ignoring it seemed too high."

  **6. Conclusion**
  "You were asked to maximize the probability of discovery. To do that, you had to make bets on coherence, uniqueness, and fertility. These are rational bets in the absence of data. But they are not empirical evidence. They are reasons to keep working, not reasons to believe you are right. The decade you spend working on such a programme is not wasted if it produces mathematical tools or clarifies concepts. But it is not 'science' in the sense of empirical confrontation. It is a different activity. Knowing which one you are doing is the only honesty available."

  ---

  ### Troubleshooting: What Will Go Wrong

  **1. The "Name-Calling" Gambit**
  *   **Problem:** A physics student will recognize Alpha as String Theory and Beta as some fringe variant. They will short-circuit the discussion by saying, "We know Alpha is the standard model extension, let's fund that."
  *   **Fix:** Enforce the blind review strictly. "If you introduce outside knowledge, you violate the Agency's conflict of interest rules. You must assess the text." If they persist, ask them to justify the text *without* the name.

  **2. The Demarcation Shutdown**
  *   **Problem:** A student (likely a philosopher) will try to end the debate by saying, "Proposal Alpha isn't science, it's math. We shouldn't fund it at all."
  *   **Fix:** Remind them of the Remit. "The Agency has defined these as eligible. Your job is not to police the boundary of science, but to allocate resources within the mandate. If you fund nothing, you fail the mandate." This forces them to engage with the *degree* of scientific merit rather than the *presence* of it.

  **3. Physicists Talking Over Philosophers**
  *   **Problem:** The physicists will dominate the technical assessment, leaving philosophers as scribes.
  *   **Fix:** In Round 3 (Public Rule), assign the writing task to the non-physicists. "The physicists have explained the content; the philosophers must draft the justification criteria." This leverages their respective strengths and forces the physicists to listen to how their preferences are being articulated.

  **4. The "Lazy Conclusion"**
  *   **Problem:** Students leave thinking, "All theoretical physics is fake."
  *   **Fix:** In the debrief, emphasize the *indirect* testing. Mention that these programmes often make statistical predictions (like the smallness of the cosmological constant) or hope for signatures in the cosmic microwave background. The point is not that they are pseudoscience, but that the *weight* of the evidence has shifted from direct prediction to theoretical virtue. That shift is what needs to be managed, not denied.

  ---

  ### Limitations: What the Game Cannot Do

  This activity flattens the technical difficulty that gives non-empirical arguments their real-world weight. In reality, "mathematical fertility" is not just aesthetics; it is the discovery that a specific equation solves problems in unrelated domains (e.g., number theory and physics). The game cannot reproduce the decades of embedded work that make a theory feel "inevitable" to its practitioners. Students will treat "coherence" as a buzzword; practitioners treat it as a survival signal.

  Furthermore, the game implies a clean choice between programmes. In reality, researchers drift between them, and the "decade wasted" fear is often mitigated by skill transfer. A student might leave the seminar thinking theory choice is a funding game. It is also a career game, a sociological game, and a personal gamble.

  **Your Final Ten Minutes:**
  You must supply the humanity the game lacks. Tell them that working on a programme without data is like navigating by the stars when the horizon is obscured. You can check your instruments (math), and you can check that the stars are consistent with each other (coherence), but you cannot see the land. That does not mean you are sailing in circles, but it does mean you cannot claim you have arrived. If you can teach them to navigate without lying about the horizon, you have given them the only criterion that matters: intellectual honesty.
