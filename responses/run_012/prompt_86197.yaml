answer: |-
  You are right to reject "Tragedy of the Commons." That concept describes a situation where a shared resource is depleted because individuals act in their own self-interest (e.g., overgrazing). In your scenario, the resource base is not being depleted; it is being *expanded* (more food per acre), but that expansion creates a dependency that eliminates the previous state as a viable option. The Commons is about *destruction*; your pattern is about *replacement*.

  You are also right to sense that Malthus is adjacent but distinct. Malthus describes a ceiling: population grows until it hits the limit of resources, then crashes. Your pattern describes a *ratchet*: a transition that locks the population into a new, denser equilibrium where the previous "looser" equilibrium is no longer habitable. Malthus explains the pressure; he does not explain the mechanism of the lock.

  ### The Name

  The pattern has a name, though it is fragmented across disciplines. In game theory and systems thinking, the precise term is a **Multi-Polar Trap** (sometimes personified as **Moloch** in contemporary essayism). In anthropology and history, the specific instance you described is called the **Progress Trap** (coined by Ronald Wright) or the **Neolithic Trap**. In economics, the industry example you gave is a **Race to the Bottom** driven by **Path Dependence**.

  If you want the single term that captures the *logic* of the shape rather than just the history, the correct name is **The Multi-Polar Trap**.

  Here is why this fits tighter than the others:
  1.  **No Villain:** Like the Tragedy of the Commons, a Multi-Polar Trap requires no malice. Every actor is optimizing for their own survival or advantage.
  2.  **Suboptimal Equilibrium:** The defining feature is that the group ends up in a state that is worse for everyone (or almost everyone) than the starting state, yet no individual can deviate without suffering immediate ruin.
  3.  **Competitive Necessity:** In your industry example, if one factory adopts the cost-cutting tech, they win. If all adopt it, prices drop, and everyone is back to baseline margins but with higher capital costs. If one *rejects* it after the shift, they go bankrupt. The "trap" is that the rational move for the individual is the destructive move for the collective.

  However, "Multi-Polar Trap" is abstract. To capture the specific *demographic* mechanism you described (where success fills the space and removes the exit), I would refine it to **The Demographic Ratchet**.

  ### Drawing the Boundaries

  You asked where to draw the line. Here is the rigorous definition of the phenomenon, separating what is essential from what is merely common.

  **Essential Features (Must be present):**
  1.  **Local Rationality:** Every step taken by individuals or households must be beneficial *at the moment it is taken*. If the first adopters suffer, it is not a trap; it is just a bad idea.
  2.  **Competitive Pressure:** The new arrangement must confer a competitive advantage (more children, lower price, more land) that forces others to adopt it to survive.
  3.  **Loss of Viability:** The old arrangement must cease to be a viable survival strategy *for the population size now present*. It is not that returning is forbidden; it is that the carrying capacity of the old way is now lower than the actual population.
  4.  **Collective Degradation:** The new equilibrium must result in a net decrease in the metrics of well-being (health, leisure, autonomy) for the average participant, even if total group power/output increases.

  **Contingent Features (Often present, but not defining):**
  1.  **Population Growth:** While your example is demographic, this trap can occur with capital. An industry can become "overcrowded" with machinery rather than people. The "population" can be units of production.
  2.  **Catastrophic Exit:** You asked if the need for catastrophe (plague, war) is essential. **It is not.** Catastrophe is simply the most common way the tension is resolved because the system is stable. However, a slow, managed decline (degrowth) is theoretically possible, though historically rare. The *trap* is the inability to exit voluntarily; the *method* of exit (crash vs. managed contraction) is secondary.
  3.  **Technology:** The driver is often technology (plows, software), but it can be ideological or institutional (a new law, a religious practice).

  ### The "Catastrophe" Question

  You wrote: *"If that's the only way out, then perhaps the phenomenon is really about numbers rather than about choice."*

  Here is the line: The phenomenon is about **incentives**, not numbers. The numbers are just the scorecard.

  If a group could voluntarily reduce their population or consumption to return to the "forager" state without anyone starving, it would not be a trap. The fact that they cannot do this is because the *incentive structure* punishes restraint. If one family decides to have fewer children to return to a "healthier" density, their lineage is outcompeted by the neighbors who maximize reproduction.

  Therefore, the catastrophe is not the definition of the trap; it is the **failure mode of the lock**. The trap is defined by the *absence of a voluntary exit ramp*. Whether the car eventually crashes (catastrophe) or runs out of gas slowly (decline) does not change the fact that the driver cannot turn the wheel.

  ### Why Other Labels Fail

  *   **Tragedy of the Commons:** Fails because the resource is not shared/finite in the same way. In the Commons, restraint saves the resource. In your trap, restraint kills the restrainer (you starve while your neighbor eats).
  *   **Malthusian Trap:** Fails because Malthus assumes a static ceiling. Your trap involves a *changing floor*. The "worse off" condition isn't just that they hit the limit; it's that the limit moved them into a harder mode of existence.
  *   **Involution:** (Clifford Geertz). This is a very close relative. It describes "growth without development" (increasing labor input for diminishing marginal returns). I would classify Involution as the *symptom* of the trap, not the trap itself.
  *   **Path Dependence:** This explains why you can't go back (QWERTY keyboards), but it doesn't explain why you are *worse off*. You can be locked into a superior technology. This trap requires the locked-in state to be inferior in welfare.

  ### My Position

  Do not coin a new term; it already exists, but you must use it precisely.

  Call it a **Multi-Polar Trap** when discussing the logic (the game theory of why no one stops).
  Call it a **Progress Trap** when discussing the historical narrative (the story of civilization).
  Call it a **Demographic Ratchet** when discussing the specific mechanism of population filling the surplus.

  If you must use one phrase for the specific shape you described—the one where success eats the exit—I recommend **The Surplus Ratchet**. It is not yet a standard academic term, which protects you from the baggage of "Commons" or "Malthus," but it accurately describes the mechanism: a surplus allows expansion, which ratchets the population up, locking them in.

  **The Boundary Line:**
  If the group *could* return to the old way without mass death but *chooses* not to because they prefer the new way (even if it's harder), it is **not** this trap. It is just a trade-off.
  For it to be the trap, the return option must be **physically impossible** for the group size, solely because of the success of the adoption.

  **The Catastrophe Line:**
  If the population stabilizes at the new, lower quality of life without a crash, it is **still** the trap. The trap is the *condition*, not the *collapse*. A stable population of miserable peasants is a more perfect example of the trap than a civilization that collapses, because it proves the lock is permanent. Catastrophe is just the system correcting the error; stability is the system living with it.

  **Summary:**
  You have rediscovered the **Multi-Polar Trap** as it applies to demographic carrying capacity. Your intuition that it is distinct from the Commons is correct. Your intuition that Malthus is only half the story is correct. The essential feature is not the catastrophe, but the **elimination of the voluntary exit**.
