  This is the correct question to ask. Your group chat has stumbled into the foundational crisis of objective Bayesianism. The "Principle of Indifference" is not a solution; it is a label for the desire you have before you realize the math forbids it from being unique.

  Here is the specification sheet for a theory of objective priors, broken down by desiderata, constraints, and the inevitable incompatibilities.

  ### I. The Desiderata (The Spec)

  To count as adequate, a theory of objective priors must satisfy the following requirements. I have marked these as **Non-Negotiable** (violating them breaks probability theory or logic) or **Contested/Habit** (violating them annoys a specific school of thought but might be mathematically survivable).

  #### 1. Coherence (Dutch-Book Avoidance)
  *   **Spec:** The prior, combined with the likelihood, must yield a posterior that obeys the axioms of probability. You cannot be pumped for money via a Dutch book based on your betting quotients derived from the prior.
  *   **Motivation:** If your "uninformative" prior allows you to accept a set of bets that guarantee a loss, it is not a valid representation of uncertainty; it is a logical error.
  *   **Status:** **Non-Negotiable.**
  *   **Nuance:** This applies strictly to the *posterior*. It allows for "improper" priors (infinite mass) *if and only if* the resulting posterior is proper (normalizable).

  #### 2. Parametrization Invariance (The Cube Test)
  *   **Spec:** Inferences about the physical quantity must not depend on the arbitrary choice of parameterization. If $\theta$ is side length and $\phi = \theta^3$ is volume, $P(\text{side} \in A | \text{data})$ must be consistent with $P(\text{vol} \in B | \text{data})$ under the transformation.
  *   **Motivation:** Your cube/side-length/volume argument. A flat prior on side length implies a non-flat prior on volume. If nature doesn't care about your coordinates, your prior shouldn't either.
  *   **Status:** **Non-Negotiable** (for objective claims).
  *   **Nuance:** This is where "Flat Prior" dies. Flatness is not invariant. Jeffreys priors are constructed specifically to satisfy this locally.

  #### 3. Consistency (The Coin Test)
  *   **Spec:** As $N \to \infty$, the posterior must converge to the true parameter value (assuming the model is correct). Furthermore, for finite $N$, the prior should not dominate the likelihood unless data is genuinely absent.
  *   **Motivation:** Your coin bias example. Haldane ($1/[p(1-p)]$) vs. Laplace ($1$) vs. Jeffreys ($1/\sqrt{p(1-p)}$). With small data, they disagree. With large data, they *should* agree. If they don't converge fast enough, the "objectivity" is suspect.
  *   **Status:** **Non-Negotiable.**
  *   **Nuance:** Some objective priors (like Haldane) are improper and place infinite mass on 0 and 1. This can prevent convergence if the true parameter is on the boundary, or allow the model to "predict" a double-headed coin too eagerly.

  #### 4. Predictive Matching (Frequentist Calibration)
  *   **Spec:** Credible intervals derived from the objective posterior should closely match Confidence Intervals derived from frequentist theory in simple cases.
  *   **Motivation:** If an "objective" Bayesian analysis gives a 95% interval that covers the truth only 50% of the time in repeated sampling, it fails the "scientific consensus" test.
  *   **Status:** **Contested/Habit.**
  *   **Nuance:** Pure Bayesians (de Finetti style) reject this. You care about coherence, not long-run frequency. However, "Objective Bayesians" (Bernardo, Berger) often demand this to sell the method to frequentists.

  #### 5. Measure-Theoretic Rigor (The Infinite-Dimensional Test)
  *   **Spec:** The theory must define what happens in infinite-dimensional spaces (e.g., Gaussian Processes, Solomonoff induction). It must distinguish between a probability measure and a formal density.
  *   **Motivation:** Solomonoff induction assumes a discrete universe of Turing machines. Continuous non-parametric Bayesian inference requires priors over function spaces. A "flat prior" over an infinite-dimensional function space is mathematically undefined (there is no Lebesgue measure on infinite dimensions).
  *   **Status:** **Non-Negotiable** (for a complete theory), but often **Ignored** in practice.
  *   **Nuance:** Most "objective" priors break down here. You usually need a Gaussian Process prior with a specific kernel, which reintroduces subjective hyperparameters.

  ---

  ### II. The Distinctions You Must Not Collapse

  Your group chat likely conflated these. A valid theory must keep them separate:

  1.  **Ignorance vs. Symmetry:**
      *   *Ignorance:* "I know nothing." (Impossible to formalize uniquely).
      *   *Symmetry:* "I know the physics is invariant under rotation/scaling." (Formalizable via Group Theory).
      *   *Requirement:* The theory must admit that "true ignorance" is not a prior. It must replace "ignorance" with "invariance under a transformation group." If you claim a prior represents ignorance, you are lying; it represents symmetry.

  2.  **Distribution vs. Measure:**
      *   *Requirement:* You must admit that $1/x$ is not a probability distribution. It is a measure (specifically, a Haar measure).
      *   *Cost:* You cannot interpret $1/x$ as a belief state *before* seeing data. It is a rule for generating a posterior. You must treat it as a limit of proper priors ($\lim_{\epsilon \to 0} \text{Uniform}[\epsilon, 1/\epsilon]$).

  3.  **Prior vs. Likelihood:**
      *   *Requirement:* The prior cannot depend on the data.
      *   *Trap:* Some "objective" priors (like Unit Information Priors) depend on the sample size $N$ or the structure of the likelihood function (Jeffreys). This violates the strict Likelihood Principle if not handled carefully. Jeffreys priors depend on the *model structure* (Fisher information), which is allowed, but they cannot depend on the *observed values*.

  ---

  ### III. The Incompatibility Theorem (The "No Free Lunch")

  You suspected that "Invariance" and "Normalizability" conflict. You are correct. Here is the precise trilemma. You cannot satisfy all three of the following simultaneously for unbounded continuous parameters:

  1.  **Strict Invariance:** The prior is invariant under the full symmetry group of the problem (e.g., location-scale group).
  2.  **Normalizability:** The prior integrates to 1 (is a proper probability distribution).
  3.  **Non-Informativeness:** The prior does not concentrate mass arbitrarily in a way that influences the posterior for small $N$.

  **The Conflict:**
  *   For a location parameter ($\theta \in \mathbb{R}$), the invariant prior is $p(\theta) \propto 1$. This is **not normalizable**.
  *   For a scale parameter ($\sigma \in \mathbb{R}^+$), the invariant prior is $p(\sigma) \propto 1/\sigma$. This is **not normalizable**.
  *   To make them normalizable, you must introduce a cutoff (e.g., $\theta \in [-M, M]$). This violates **Strict Invariance** (why $M$? why not $2M$?) and introduces **Information** (you now know the parameter is bounded).

  **What People Quietly Give Up:**
  Almost everyone gives up **Normalizability** (Requirement 2) in the definition of the prior, provided **Posterior Propriety** is maintained.
  *   **The Cost:** You lose the ability to calculate marginal likelihoods (Bayes Factors) directly. You cannot compare models using the raw objective prior because the normalization constant is infinite. You are limited to parameter estimation, not model selection, unless you use fractional Bayes factors or other workarounds.
  *   **The Alternative:** Some (like Berger & Bernardo) give up **Strict Invariance**. They pick a "reference parameterization" (usually the one that makes the Fisher information constant) and put a flat prior there. This solves normalizability on bounded sets but admits that the "objectivity" is relative to that choice of coordinates.

  ---

  ### IV. Scorecard of Contestants

  Here is how the common methods stack up against the spec.

  | Method | Parametrization Invariance | Normalizable | Coherence (Posterior) | Model Selection | The "Lie" it tells |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Flat (Uniform)** | **Fail.** (Your cube problem). | Yes (if bounded). | Yes. | Yes. | "I am ignorant." (You are actually informative about scale). |
  | **MaxEnt** | **Fail.** (Depends on base measure). | Yes. | Yes. | Yes. | "The reference measure is neutral." (It's a hidden prior). |
  | **Jeffreys** | **Pass (Local).** Invariant under reparam. | **No.** (Usually improper). | Yes (if posterior proper). | **No.** (Constants undefined). | "Fisher Info captures geometry." (Ignores global topology). |
  | **Reference / Group** | **Pass (Global).** Haar measure. | **No.** (Improper). | Yes (if posterior proper). | **No.** (Requires fixes). | "The symmetry group is known." (What if it isn't?) |
  | **Solomonoff** | **Pass.** (Discrete invariant). | Yes. | Yes. | Yes. | "The universe is computable." (Uncomputable in practice). |

  ### Summary for your Group Chat

  1.  **Flat priors are not uninformative.** They are informative about the scale of the parameter. They fail the cube test.
  2.  **Invariance requires improper priors.** If you demand the prior respect the symmetry of the problem (like scale invariance $1/x$), you cannot normalize it.
  3.  **The Fix:** You must accept **Improper Priors** as formal rules for generating posteriors, not as belief states. You give up the ability to compute Bayes Factors without additional machinery.
  4.  **The Hard Truth:** There is no unique representation of "ignorance." There is only a unique representation of **symmetry**. If you don't know the symmetry, you can't have an objective prior. You are forced to be subjective.

  Tell them to stop arguing about which prior is "true" and start arguing about which **symmetry group** the physical system actually possesses. That is the only objective fact available.
