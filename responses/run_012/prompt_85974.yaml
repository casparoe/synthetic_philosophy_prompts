answer: |-
  You are describing two distinct but deeply interconnected phenomena that have troubled philosophers of value and decision theorists for decades. Your experience is not a failure of rigor; it is a confrontation with the actual structure of value judgment. The rubric failed because it was built on a false assumption about how value works.

  Here is the analysis you requested, broken down by the two patterns you identified, the relationship between them, and the validity of the test you are already using.

  ### 1. The Balanced Pairs: Parity

  You asked for the name of the relation where neither candidate is better, neither is worse, and they are not equal. In contemporary value theory, the settled term for this is **Parity**.

  While "equality" suggests that two items have the exact same weight on a scale, **parity** suggests they belong to the same neighborhood of value without being identical. When two candidates are on a par, they are comparable (they are in the same conversation), but the "better than" relation does not hold between them, nor does "equal."

  You asked how this differs from three other possibilities:

  *   **It is not Ignorance:** If you were simply unable to tell which was better due to a lack of information, you would expect that *more* information would resolve the tie. In your case, you know the files well. The uncertainty is not epistemic (about your knowledge); it is ontological (about the value relation itself). You are certain that there is no fact of the matter about one being better.
  *   **It is not Incommensurability:** Incommensurability means two items cannot be compared at all (e.g., comparing the taste of a strawberry to the morality of a lie). Your candidates *are* comparable; they differ by degrees along the same dimensions (research, teaching). Parity exists only when items are comparable but not rankable.
  *   **It is not Equality:** This is the crucial distinction. If A and B were truly equal, adding a small weight to A would tip the scale. If A and B are on a par, adding a small weight to A might not be enough to make A better than B. They remain in the same "league" or "tier" of value.

  **Defending the Boundaries of Parity**
  To ensure this term fits your experience and does not overreach: Parity applies only when the items are **of the same kind** (fellowship applicants) and **comparable** (you can discuss them meaningfully), but the standard metrics of "better/worse/equal" fail to capture their relationship. It stops fitting if the candidates are so different that they cannot be compared at all (incommensurability) or if one is definitively superior (better). Parity occupies the specific logical space where choice is possible without one option being objectively superior.

  ### 2. The Argumentative Move: The Small Improvement Argument

  You asked what to call the move where you imagine a small improvement to one candidate to test the relationship, and whether it is sound.

  This is known in philosophy as the **Small Improvement Argument** (or Test). It is the standard method for distinguishing Parity from Equality.

  **Is the move sound?**
  Yes, it is sound, and it does not beg the question. Here is why:
  If A and B were **equal**, then logically, A-plus (A with a small improvement) must be better than B. If you find that A-plus is *still* not better than B, you have proven they were not equal to begin with.
  The move does not assume the conclusion; it tests the structural properties of the relation. The fact that the improvement fails to break the tie reveals that the "gap" between the candidates is not a precise numerical difference that can be bridged by a small increment. Instead, they occupy a zone of rough equivalence where small changes do not alter the ranking.

  Your colleague's rubric failed because rubrics assume precision. They assume that if you score two candidates, the scores will differ enough to dictate a winner, or be identical to dictate a tie. Parity reveals that value is often "clumpy." Two candidates can be in the same clump without having the same score.

  ### 3. The Looping Verdicts: Intransitive Preference

  The first pattern you described—A is preferred to B, B to C, but C to A—is a classic **Preference Cycle**, resulting in **Intransitive Preference**.

  In standard logic, the "better than" relation is assumed to be transitive (if A > B and B > C, then A > C). Your committee's experience proves that in human value judgment, "better than" is not always transitive.

  **Is this a separate phenomenon from Parity?**
  No. The looping verdicts are likely a *symptom* of the parity relation. Here is the mechanism:

  When you compare A and B, if they are **on a par**, there is no objective fact that A is better than B. However, your committee procedure *forces* a binary choice (pick one). When forced to choose between two items that are on a par, you must rely on something other than "betterness"—perhaps a minor preference, a whim, or a contextual factor (e.g., "A's research fits our current grant slightly better"). Let's say you pick A.
  Next, you compare B and C. They are also on a par. You pick B for a similarly minor reason.
  Finally, you compare C and A. They are also on a par. But because the "minor reasons" for choosing are context-dependent, you might now pick C.

  The cycle arises because you are trying to map a **Parity** relation (which allows for non-ranked comparability) onto a **Binary Choice** procedure (which demands a ranking). The intransitivity is the mathematical scar left by forcing a fourth relation (parity) into a three-relation system (better, worse, equal).

  ### 4. Synthesis and Recommendation

  You asked if the one explains the other. **Yes.** The existence of Parity (Problem 2) explains the Intransitivity (Problem 1).

  When you treat "on a par" as "equal," you expect transitivity. When you treat "on a par" as "incomparable," you expect no verdict. But when you treat "on a par" as "choose one arbitrarily," you invite cycles. The small differences you mentioned ("it is the small differences that seem to be doing the damage") are the friction points where the candidates slide from being "better" to being "on a par." When the difference is small enough, the "better than" relation dissolves into parity, but the committee continues to vote as if it hasn't.

  **What should you do?**
  You cannot rubric your way out of this because the problem is not in your procedure's clarity, but in the nature of the value you are assessing.
  1.  **Acknowledge Parity:** Explicitly allow the committee to declare two candidates "on a par" rather than forcing a winner in every pairwise comparison.
  2.  **Cluster, Don't Rank:** Instead of a linear ranking (1 through 10), group candidates into tiers. Candidates within a tier are on a par. This eliminates the pressure to find intransitive distinctions between A, B, and C if they all belong in the "Top Tier."
  3.  **Accept the Small Improvement Test:** Trust your intuition when the small improvement fails to break the tie. It is telling you that you are looking at parity, not equality.

  You are not being sloppy. You are accurately perceiving a feature of value that most administrative systems are designed to ignore. The "odd shape" you perceive is the actual topology of human excellence; the straight line the rubric tries to impose is the fiction.
