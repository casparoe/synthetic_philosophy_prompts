answer: |-
  Your hypothesis is correct, but it requires a sharper dissection to explain why the debate stalls. The impasse is not merely a conflation of three claims; it is a **modal confusion** regarding the status of the past itself.

  Here is the diagnosis of the shape of the thing, engaging the concrete positions of your seminar circle.

  ### 1. The Three Claims and Where They Stick
  You identified the metaphysical, methodological, and political claims. The reason the debate never moves is that the Accusers (historians) and the Defenders (narrators) are arguing from different modalities within these claims.

  *   **The Metaphysical Claim:** The Accusers fear you believe history *has* a direction. The Defenders argue they only believe history *appears* to have a direction from where they stand.
      *   *The Stall:* The Accusers hear "appears" as a euphemism for "is." The Defenders hear "is" as a demand for omniscience they never claimed.
  *   **The Methodological Claim:** This is the live wire. The Accusers argue that selecting facts by present relevance distorts **causal weight**. If you highlight a 1830s reformer because they succeeded in 1850, you implicitly argue they were *more powerful* in 1830 than they actually were. The Defenders argue that selection by present relevance is the only way to establish **narrative significance**. If the reformer had no outcome, why tell their story?
      *   *The Stall:* The Accusers are talking about *explanation* (why X happened). The Defenders are talking about *intelligibility* (how we understand X). You cannot refute a demand for intelligibility with a rule of explanation, and vice versa.
  *   **The Political Claim:** The Accusers fear you are justifying the status quo. The Defenders argue they are merely explaining how the status quo arrived.
      *   *The Stall:* This is often a moralized version of the methodological claim. It rarely drives the technical impasse, but it fuels the heat.

  ### 2. The "Presentism" Ambiguity
  Your second suspicion is accurate and contributes significantly to the heat.
  *   **Ontological Presentism:** The philosophical truth that the historian stands in the present. (The Defenders' shield).
  *   **Evaluative Presentism:** The methodological sin of judging past actors by present morals or assuming present categories existed for them. (The Accusers' sword).

  When the Accusers shout "Presentism!", they mean Evaluative. When the Defenders reply "We are all Presentists!", they mean Ontological. They agree on the fact (we are in the present) but disagree on the consequence (therefore we must / therefore we must not filter the past). The word functions as a **homophonic barrier**; it sounds like the same objection, but it names two different conditions.

  ### 3. Selection vs. Teleology: The Core Formal Question
  Your third suspicion identifies the engine of the dispute: *Can a narrator possess a selection principle that is not teleological?*

  The Accusers assume that **Selection + Outcome Knowledge = Teleology.** They believe that if you know the end, you cannot help but prune the branches that didn't bear fruit, thereby making the fruit look inevitable.
  The Defenders assume that **Selection + Outcome Knowledge = Coherence.** They believe that without the end, there is no story, only a chronicle.

  The hidden empirical question doing the real work is this: **Does knowing the outcome inevitably alter the weighting of contingency?**
  *   **The Accusers say Yes.** They want a narrative that preserves the "horizon of expectation" (Koselleck). They want to feel the vertigo the characters felt, where the future is a cloud of probabilities, not a fixed point.
  *   **The Defenders say No (or "So What?").** They argue that *retrospective coherence* is not the same as *retrospective necessity*. You can show the path taken without claiming it was the only path possible.

  The impasse exists because the Accusers define "Whig history" as **any narrative that fails to dramatize lost alternatives.** The Defenders define "Whig history" as **any narrative that claims the outcome was divinely or historically ordained.** Since most novelists and many historians do not claim ordination, they feel the charge is false. But since most novelists *do* fail to dramatize lost alternatives (because it kills pacing), the Accusers feel the charge is true.

  ### 4. Practical Diagnosis for the Novelist
  You asked whether your narrator may know how it turns out. The diagnosis suggests the answer is **yes, but with a formal constraint.**

  The dispute is not about *knowledge* of the end; it is about the *texture* of the middle.
  *   **Teleological Narration:** "He signed the petition, unaware it was the first step toward the Great Reform." (This collapses the contingency of the moment into the certainty of the outcome).
  *   **Non-Teleological Retrospection:** "He signed the petition, a dangerous folly that might have ended in the gallows, as it did for three others that week, but which happened instead to catch the eye of a clerk who was, by chance, in a forgiving mood."

  The Accusers are not demanding you pretend the characters don't know the future (they don't). They are demanding you acknowledge that **the future did not know itself.** The "Whig" error is not knowing the destination; it is drawing the map as if the roads were paved before the travelers walked them.

  ### 5. What Counts as Progress?
  Progress is not possible if the goal is to satisfy the Accusers' demand for pure contingency *and* the Defenders' demand for clean narrative. Those are contradictory aesthetic goals.

  Progress is possible if you shift the criterion from **Purity** to **Fidelity.**
  *   **The Distinction:** Distinguish between **Foreshadowing** (a literary device that hints at the end) and **Prefiguration** (a historical claim that the past existed *for the sake of* the end).
  *   **The Criterion:** A narrative tips into Whiggery not when it selects for the present, but when it **erases viable contemporaneous alternatives.** If your narrator knows the Reform passed, they must still show the moment it nearly failed, not as a "scare" but as a genuine possibility.
  *   **The Demonstration Case:** Read Hilary Mantel's *Wolf Hall*. The narrator (Cromwell) knows he is rising, but the text is saturated with the immediate risk of execution. The outcome is known, but the *necessity* of the outcome is denied at every page turn. This satisfies the Defender (it is a story) and the Accuser (it preserves the horizon of expectation).

  ### Conclusion
  This is not a verbal dispute, nor is it ill-posed. It is a **structural tension between the grammar of narrative (which requires closure) and the ontology of history (which was open).** The historians are defending the openness; you are defending the grammar.

  Progress is possible, but it requires you to concede that your medium (the novel) naturally inclines toward the Whig error, and you must actively fight your own form to preserve contingency. You do not need to abandon the narrator's knowledge of the end; you need to weaponize that knowledge to create dramatic irony, not historical destiny. The narrator knows the cliff is there; the character must not.

  Verdict: A modal confusion conflating narrative selection with causal determinism; progress is possible if you distinguish retrospective coherence from retrospective necessity.
