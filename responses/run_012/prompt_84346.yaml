prompt: |-
  I chair the clinical ethics committee at a mid-sized hospital. We take two or three consults a week — a family pressing for treatment the team calls futile, a patient with capacity refusing something that would plainly help, a surrogate who won't decide — and each one ends in a short written recommendation. Our quality committee reviews those recommendations quarterly and counts two consults reaching different conclusions on similar-looking cases as a defect, so we are under pressure to write down rules.

  I have come round to particularism: reasons don't carry fixed weights, a feature that favours an action here can tell against it there, and no finite set of principles generates the right answer to a case. But I can't hand my colleagues a treatise, and I can't tell the quality committee we have no method.

  Write me a procedure the committee can actually run, in about thirty minutes, using people with no philosophy training: the questions to ask in order, what counts as a sufficient answer to each, where it stops and returns a recommendation, and where it stops and hands the decision to a person. It must not smuggle a principle in and then call it a procedure — if all this view can give me is a discipline for noticing what is salient in a case and arguing about it, say so and give me that instead. It also has to give me something to tell the quality committee about why similar cases may legitimately come out differently.

  Then run it on two consults: an eighty-four-year-old with advanced dementia and severe pneumonia, whose son demands ICU transfer and intubation while the team expects she will not survive it; and a thirty-year-old in a persistent vegetative state after an overdose, whose family asks that ventilation continue six more weeks so a brother can travel from abroad, which the team resists partly because the bed is needed. One of those, I suspect, will come out somewhere I don't like. Finish by telling me where the procedure will misfire, and whether I am asking for something the view cannot coherently deliver — if so, say that plainly rather than handing me a procedure-shaped consolation prize.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Chair of a clinical ethics committee at a mid-sized hospital.
      *   **Context:** 2-3 consults/week. Pressure from Quality Committee to standardize outcomes (viewing divergence as a "defect").
      *   **User's Philosophical Stance:** Particularism (reasons don't have fixed weights, no finite set of principles generates right answers).
      *   **Constraint 1:** Needs a *procedure* (approx. 30 mins) for non-philosophers.
      *   **Constraint 2:** Must not smuggle in principles as rules. It must be a discipline for noticing salience and arguing.
      *   **Constraint 3:** Must provide an explanation for the Quality Committee on why similar cases yield different results.
      *   **Task:** Write the procedure, run it on two specific cases (Dementia/Pneumonia vs. PVS/Bed Shortage), and then critique the procedure itself (where it misfires, is the request coherent?).
      *   **Tone:** Honest, direct, philosophically rigorous but practically usable. No "consolation prize."

  2.  **Deconstruct the Philosophical Tension:**
      *   *Particularism* (Dancy, et al.) argues against codification. It says moral judgment is context-sensitive.
      *   *Quality Committee* wants codification (consistency = quality).
      *   *The Conflict:* You cannot have a *rule-based procedure* that guarantees particularist outcomes. A procedure *is* a rule set.
      *   *The Solution:* The procedure cannot be an *algorithm* for decision-making. It must be a *protocol for deliberation*. It must structure the *inquiry*, not the *outcome*. It needs to force the committee to articulate *why* this case is different from that case, rather than forcing them to match the previous case.
      *   *The "Defect" Problem:* I need to arm the Chair with a specific argument for the Quality Committee: "Consistency in process does not require uniformity in outcome when contexts differ materially."

  3.  **Drafting the Procedure (The "Salience Protocol"):**
      *   *Goal:* 30 minutes. Non-philosophers.
      *   *Structure:*
          1.  Fact-Finding (Medical & Social).
          2.  Stakeholder Mapping (Who is affected/deciding?).
          3.  Salience Identification (What matters *here*?).
          4.  Comparison (How is this *not* like the last one?).
          5.  Recommendation/Hand-off.
      *   *Crucial Feature:* It must explicitly ask "What makes this case unique?" to satisfy particularism. It must explicitly ask "What is the burden of action?" to satisfy ethics.
      *   *Stopping Rule:* When the committee agrees on the *moral weight* of the salient features, not necessarily the action. Or when they realize the decision belongs to a specific agent (patient/surrogate).

  4.  **Running the Cases:**
      *   *Case 1 (Dementia/Pneumonia):* 84yo, advanced dementia, severe pneumonia. Son wants ICU/Intubation. Team says futile.
          *   *Salience:* Suffering, likelihood of benefit, surrogate authority vs. best interest, definition of "futility."
          *   *Likely Outcome:* Recommendation against intubation (burden outweighs benefit, surrogate demanding harm/non-benefit).
      *   *Case 2 (PVS/Bed Shortage):* 30yo, PVS, overdose. Family wants 6 weeks ventilation for brother to travel. Team resists (bed needed).
          *   *Salience:* Resource allocation (bed), symbolic value of family presence, status of PVS patient (dead? alive?), time limit.
          *   *Likely Outcome:* This is the tricky one. The user suspects one will come out somewhere they don't like.
          *   *Analysis:* If we treat the bed as a scarce resource, continuing treatment for *logistical convenience* (brother's travel) might seem unjustifiable compared to a new acute patient. However, if the patient is PVS, is treatment "futile"? If it's physiologically effective but cognitively futile, does the family's wish carry weight?
          *   *Particularist angle:* In Case 1, the treatment is medically harmful/futile. In Case 2, the treatment is physiologically stable but resource-intensive. The "reason" (family wish) functions differently. In Case 1, it overrides medical judgment on harm. In Case 2, it competes with distributive justice.
          *   *Risk:* The procedure might justify pulling the plug in Case 2 due to resource scarcity, which might feel cold, OR it might justify keeping it due to "family needs," which wastes resources. I need to let the procedure play out honestly.
          *   *User's Suspicion:* "One of those, I suspect, will come out somewhere I don't like." Usually, particularists worry about *arbitrariness*. Or perhaps they worry the procedure will collapse into utilitarianism (bed usage) in Case 2, undermining the sanctity of the individual case. Let's see.

  5.  **Critiquing the Procedure (The "Honesty" Section):**
      *   *The Core Problem:* You asked for a procedure to implement a philosophy that denies procedures.
      *   *The Risk:* The procedure becomes a "checklist" that creates an illusion of rigor while hiding bias.
      *   *The Quality Committee:* They want *predictability*. Particularism offers *justifiability*. These are different. I need to tell the Chair that the procedure won't stop the Quality Committee from complaining, but it will arm the Chair with the right defense.
      *   *Coherence:* Can particularism be proceduralized? Only as a *heuristic for attention*, not a *calculus for judgment*. If the Chair expects the procedure to *generate* the answer, it will fail. If it generates the *discussion*, it works.

  6.  **Refining the Output:**
      *   *Tone:* Professional, empathetic to the administrative burden, philosophically precise.
      *   *Structure:*
          1.  The Procedure (The "Salience & Stakeholders Protocol").
          2.  The Quality Committee Defense (The "Consistency Memo").
          3.  The Case Runs.
          4.  The Critique (The "Hard Truth").

  7.  **Self-Correction/Nuance Check:**
      *   *Did I smuggle principles?* Avoid saying "Maximize utility" or "Respect autonomy." Instead use "Identify the burden" and "Identify the decision-maker."
      *   *Case 2 Sensitivity:* The PVS case involves resource allocation. This is often a "hidden" rationale. The procedure needs to make this explicit. If the team resists *partly* because the bed is needed, that is a distributive justice claim. The procedure must surface that.
      *   *The "Don't Like" Outcome:* In Case 2, a particularist approach might validate the family's request because the *reason* (family unity/closure) is salient *in this context*, even if it costs a bed. Or it might validate the hospital because the *reason* (scarcity) is salient. The risk is that without a principle (like "Justice > Family Preference"), the outcome depends on who is in the room. I need to highlight this instability.

  8.  **Final Polish:** Ensure the distinction between *procedural consistency* (we asked the same questions) and *substantive consistency* (we gave the same answer) is clear for the Quality Committee.

  *(Self-Correction during drafting the response)*: I need to be careful not to make the procedure *too* abstract. It needs to be usable by a nurse, a chaplain, and a doctor in 30 mins. Use plain language. "What is the fight about?" rather than "What is the normative conflict?"

  *(Regarding the "One I won't like" comment)*: I suspect the user (a particularist) might dislike the outcome if the procedure forces a utilitarian calculation in Case 2 (bed scarcity) because particularism usually resists aggregating goods. Or they might dislike it if the procedure fails to stop the son in Case 1. I will predict that Case 2 is the danger zone for "hidden principles" (resource allocation) masquerading as particularist judgment.

  Let's write it.cw
answer: |-
  ### Part 1: The Procedure (The Salience & Stakeholders Protocol)

  This is not an algorithm for generating answers. It is a protocol for structuring attention. It forces the committee to articulate *why* this case is what it is, rather than checking boxes against a rulebook.

  **Time:** 30 Minutes hard stop.
  **Participants:** Ethics Chair (facilitator), Attending Physician, Primary Nurse, Social Work/Chaplain.
  **Materials:** Whiteboard. One sheet of paper per case.

  **Phase 1: The Medical & Social Floor (5 Minutes)**
  *   **Question:** What are the undisputed medical facts? What are the undisputed social facts?
  *   **Sufficient Answer:** A statement everyone can sign without qualification (e.g., "Patient has PVS," not "Patient has no quality of life").
  *   **Stop Condition:** If the team cannot agree on facts, the consult pauses. Ethics does not arbitrate medical uncertainty.

  **Phase 2: The Stakeholder Map (5 Minutes)**
  *   **Question:** Who bears the burden of the decision? Who bears the benefit?
  *   **Sufficient Answer:** A list of names/roles with the specific burden/benefit attached (e.g., "Son bears grief of letting go," "ICU bed unavailable for trauma patient").
  *   **Stop Condition:** If a stakeholder is unidentified (e.g., "the next patient"), name them or acknowledge the anonymity.

  **Phase 3: Salience Identification (10 Minutes)**
  *   **Question:** What features of *this* case are doing the moral work?
  *   **Instruction:** Do not list principles (e.g., "Autonomy"). List features (e.g., "The patient previously said X," "The treatment causes visible distress," "The bed is the last one").
  *   **Crucial Follow-up:** For each feature, ask: "Does this feature count *for* or *against* the proposed action *in this specific context*?"
  *   **Sufficient Answer:** A list of 3-5 salient features with their directional weight *in this case*.
  *   **Stop Condition:** When the committee agrees on which features are salient. (They do not need to agree on the weight yet).

  **Phase 4: The Differentiation Check (5 Minutes)**
  *   **Question:** How is this case *not* like the last similar case we saw?
  *   **Instruction:** Look at the Salience List. Which feature here was absent or different in the previous case?
  *   **Sufficient Answer:** A specific distinction (e.g., "In the last case, the surrogate had POA; here the surrogate is an estranged son").
  *   **Stop Condition:** When the committee can articulate why a different outcome is not a contradiction.

  **Phase 5: Recommendation or Hand-off (5 Minutes)**
  *   **Question:** Is there a clear decision-maker, or is this a policy gap?
  *   **Option A (Hand-off):** If one stakeholder has clear authority and the medical options are clear, the committee recommends deferring to that person. (e.g., "Patient has capacity; team must respect refusal").
  *   **Option B (Recommendation):** If authority is contested or unclear, the committee weighs the Salience List.
  *   **Sufficient Answer:** A one-sentence recommendation + the Salience List as justification.

  ***

  ### Part 2: The Defense for the Quality Committee

  You cannot tell them "Particularism." They will hear "Arbitrariness." You must translate the philosophical stance into quality assurance language.

  **Memo Language:**
  > "The Ethics Committee utilizes a **Standardized Deliberation Protocol**. Quality is measured by the consistency of the *process* (adherence to the 5-phase protocol), not the uniformity of *outcomes*.
  >
  > In clinical ethics, outcome variance is not a defect; it is a signal of sensitivity to context. Two cases may appear similar superficially (e.g., 'family demands treatment') but differ materially in salient features (e.g., 'patient capacity' vs. 'surrogate authority,' or 'physiologic futility' vs. 'resource scarcity').
  >
  > A defect occurs only if:
  > 1. The Protocol was not followed.
  > 2. Salient differences were ignored without justification.
  > 3. The recommendation contradicts the identified Salience List.
  >
  > Consistency in outcomes across materially different cases would indicate a failure to attend to the specific moral realities of the patients involved."

  ***

  ### Part 3: Running the Cases

  Here is how the protocol executes on your two consults.

  #### Case 1: 84-year-old with Dementia/Pneumonia
  *   **Phase 1 (Facts):** Advanced dementia. Severe pneumonia. Intubation technically possible. Survival to discharge statistically near zero.
  *   **Phase 2 (Stakeholders):** Patient (suffering), Son (grief/guilt), Team (moral distress/resource use).
  *   **Phase 3 (Salience):**
      1.  *Physiologic response:* Lung tissue won't recover (Counts Against ICU).
      2.  *Patient history:* No prior advance directive, but life pattern suggests avoidance of prolonged dying (Counts Against ICU).
      3.  *Surrogate motivation:* Son's guilt vs. Patient's best interest (Counts Against Son's demand).
  *   **Phase 4 (Differentiation):** Unlike a case where a surrogate refuses life-saving care for a recoverable patient, here the surrogate demands non-beneficial care for an unrecoverable patient.
  *   **Phase 5 (Outcome):** **Recommendation:** Do not intubate. Offer comfort care.
      *   *Justification:* The salience of "non-benefit" and "burden of suffering" outweighs the surrogate's demand when the demand contradicts the patient's physiological reality.

  #### Case 2: 30-year-old PVS / Bed Shortage
  *   **Phase 1 (Facts):** PVS (Permanent Vegetative State). Overdose. Ventilation maintains physiology. Bed is single ICU bed. Brother arriving in 6 weeks.
  *   **Phase 2 (Stakeholders):** Patient (none, no sensation), Family (closure/travel), Hospital/Community (bed access for acute patients).
  *   **Phase 3 (Salience):**
      1.  *Physiologic status:* Ventilation works (Counts For Continuing).
      2.  *Cognitive status:* No awareness (Counts Neutral/Against).
      3.  *Family Need:* Ritual closure/brother's presence (Counts For Continuing).
      4.  *Resource Scarcity:* One bed, acute need elsewhere (Counts Against Continuing).
  *   **Phase 4 (Differentiation):** Unlike Case 1, the treatment is not physiologically futile. Unlike Case 1, the conflict is not "Surrogate vs. Medical Judgment on Harm," but "Family Convenience vs. Distributive Justice."
  *   **Phase 5 (Outcome):** **Recommendation:** Continue ventilation for 6 weeks OR Transfer to long-term facility.
      *   *Justification:* Here is where the protocol may produce the result you dislike.
      *   *Scenario A:* The committee weighs "Resource Scarcity" as the dominant salient feature. Recommendation: Withdraw/Transfer now. The brother's schedule does not trump acute community need.
      *   *Scenario B:* The committee weighs "Family Ritual" as dominant because the patient is not suffering and the bed *might* be manageable. Recommendation: Wait 6 weeks.
      *   *Likely Protocol Output:* Because Phase 3 forces the "Resource Scarcity" to be listed as a salient feature, the committee must weigh it. In Case 1, the weight was "Medical Futility." In Case 2, the weight is "Justice."
      *   *The Risk:* If the committee feels pressure to "free the bed," the procedure legitimizes withdrawing support for *social* reasons (bed availability) rather than *medical* reasons (futility).

  ***

  ### Part 4: The Hard Truth (Critique)

  You asked me to tell you if this is a consolation prize. It is. Here is where the procedure misfires and why your request contains a tension that cannot be fully resolved.

  **1. The "Salience" Trap**
  Particularism says reasons change valence depending on context. My procedure asks the committee to list salient features and assign weight *in this context*. But **who decides the weight?**
  In Case 1, "Futility" is a heavy weight. In Case 2, "Bed Scarcity" is a heavy weight. The procedure does not tell you how to weigh "Bed Scarcity" against "Family Grief." It merely forces you to say you did it.
  *   **The Misfire:** A committee biased against resource allocation will say "Family Grief" outweighs "Bed." A committee biased toward efficiency will say "Bed" outweighs "Family Grief." Both followed the procedure. The procedure masks the bias; it does not eliminate it. You have traded *principled consistency* for *transparent arbitrariness*.

  **2. The Quality Committee Problem**
  The Quality Committee defines "defect" as outcome variance. My memo argues that variance is valid. **They will not accept this.**
  Administrative quality metrics rely on predictability. Particularism relies on responsiveness. These are opposing goods. You can arm yourself with the memo, but you will remain at war with them. The procedure gives you a paper trail, not a shield. They will still count divergent outcomes as errors. You will have to be prepared to lose that battle repeatedly to protect the committee's integrity.

  **3. The Coherence of Your Request**
  You asked for a procedure that does not smuggle in principles. **That is impossible.**
  *   The instruction "Identify the burden" smuggles in a principle of *Non-Maleficence*.
  *   The instruction "Identify the decision-maker" smuggles in a principle of *Authority*.
  *   The instruction "Compare to the last case" smuggles in a principle of *Equity*.
  You cannot have a method without a metric. Even a particularist needs a discipline of attention, and that discipline *is* a normative framework.
  *   **The Verdict:** You are asking for a tool that allows you to be a particularist in an institution that requires you to be a principlist. The procedure I wrote is a **bilingual translation layer**. It allows your committee to think like particularists (focusing on salience) while speaking like principlists (documenting factors and distinctions) to the administration.

  **4. The Case You Won't Like**
  I suspect **Case 2** is the one that will sit wrong with you.
  In Case 1, the medicine (futility) drives the ethics. That is comfortable.
  In Case 2, the *logistics* (the bed) drive the ethics.
  If your committee follows the protocol honestly, they must acknowledge that keeping the bed occupied for 6 weeks harms *anonymous others* (future acute patients). Particularism demands you notice that harm.
  If you recommend keeping the bed open for the brother, you are prioritizing the *visible* family over the *invisible* future patients.
  If you recommend closing the bed, you are using the patient as a means to hospital flow.
  The procedure will force this into the light. It will not solve it. It will simply ensure you cannot look away from the fact that you are making a distributive justice call, not a clinical one.

  **Final Advice:**
  Use the procedure. It is better than the alternative (guesswork). But do not believe it protects you. It only exposes the machinery of your judgment. When the Quality Committee flags a "defect," do not argue that the outcomes should match. Argue that the **Salience Lists** were different. If the lists are different, the outcomes *must* be different, or the ethics is broken.

  That is the only defense particularism affords you: **Truth in labeling.** You are not selling consistency. You are selling attention.
