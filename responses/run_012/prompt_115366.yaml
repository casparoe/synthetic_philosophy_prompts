answer: |-
  In a contemporary border war, State A (the unjust aggressor) invades State B (the just defender). Both frontline soldiers are volunteers who fully understand their nation's cause and pose identical lethal threats. However, State B's high command, prioritizing force protection over all else, has structurally mandated a "Zero-Risk" Rules of Engagement protocol known to all recruits: any individual capable of bearing arms in the contested zone is to be preemptively neutralized without warning, effectively negating the principle of distinction and forbidding surrender acceptance. While State A fights for an unjust cause, State B fights for a just cause using a structural framework that systematically violates the rights of persons equally to State A's aggression, rendering State B's volunteer complicit in an institutionally unjust enterprise despite the justice of the war's aim.

  **Standard Conventionalist Line:** Traditionally, conventionalists (like Walzer) argue both soldiers are morally permitted to kill each other based on their shared combatant status (Moral Equality of Combatants). However, in this specific case, a conventionalist might concede that State B's soldier loses this permission because the "Zero-Risk" protocol constitutes a systematic war crime, stripping him of the convention's protection, while State A's soldier retains permission only insofar as he follows the laws of war (though his cause is unjust).

  **Revisionist Individualist Line:** Standard revisionists (like McMahan) argue State B's soldier is permitted to kill (just cause) and State A's is not (unjust cause). In this case, the revisionist would likely argue *neither* is permitted: State A's soldier is liable due to aggression, and State B's soldier is liable due to systematic complicity in rights-violating structures, resulting in equality of culpability rather than equality of permission.

  **Rules-of-War / Lawful-Combatant View:** Legally, both are likely considered lawful combatants entitled to prisoner-of-war status unless individually prosecuted for war crimes. State B's soldier violates International Humanitarian Law (IHL) regarding distinction and quarter, making him criminally liable, but until adjudicated, he retains the legal privilege to fight under the state's banner, whereas State A's soldier commits the crime of aggression but may follow IHL in the field.

  **Single Feature Doing the Work:** The structural mandate of unjust *jus in bello* policies (the "Zero-Risk" protocol) by the Just State, known to the volunteer.

  **If That Feature Is Removed:** If State B follows standard ROE, the asymmetry returns: State B's soldier is justified, and State A's is liable. To restore Moral Equality here, you would have to rely on the ordinary excuse-based defense (e.g., claiming State A's soldier is ignorant or coerced), which this case was designed to avoid.

  **MEC Defender's Attack:** A defender of Moral Equality would attack the **imputation of structural guilt**, arguing for a "Division of Moral Labor": individual soldiers are not responsible for high-command policy or state aims, only their immediate conduct. They would argue that as long as the soldier pulls the trigger in self-defense against a threat, the structural context does not negate his individual right to life or permission to fight, preserving the symmetry of permission regardless of command policies.
