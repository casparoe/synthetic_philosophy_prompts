  In safety terms, famine is a system accident, not a singular event.

  **The Safety Restatement**
  **Hazard:** Population caloric deficit.
  **Trigger:** Exogenous disturbance (drought, blight). This is the only "natural" component. In STAMP terms, this is an external disturbance entering the control boundary.
  **Control Structure:** The State and market supply chain.
  **Designers:** Political leadership. They introduce **latent failures** via ideological constraints (Great Leap quotas, Laissez-faire dogma, Colonial extraction). These are flawed control algorithms.
  **Operators:** Local bureaucrats. They commit **active failures** (exporting grain, suppressing news, enforcing unrealistic quotas).
  **Defenses:** Free press, electoral feedback, relief infrastructure. Sen's thesis is that democracies possess robust **feedback loops** (sensors) that force control action before the hazard propagates. Authoritarian or colonial structures disable these interlocks or sever the feedback line.

  When the trigger hits, a robust control structure adjusts flow (imports, relief). A compromised structure (latent failures) allows the trigger to breach defenses. The outcome isn't determined by the trigger's magnitude, but by the control structure's integrity. "Natural disaster" is a mislabel; the natural element is merely the trigger. The catastrophe is a loss of control.

  **Residue Report**
  **Translates Cleanly:** Causal pathways. The distinction between the agro-shock (trigger) and the starvation (outcome) maps perfectly to hazard vs. incident. Latent failures accurately describe rigid policies that pre-date the crisis. "Foreseeable" translates well: historical data makes crop failure a known risk, requiring mitigation plans.
  **Distorts:** "Risk." In safety, risk is probabilistic. In famine, the risk is often knowingly accepted by designers for political gain (e.g., export targets).
  **Inexpressible:** *Mens rea* and Accountability. Safety vocabulary is agnostic regarding intent. It distinguishes error from at-risk behavior, but "recklessness" in Just Culture still aims at system fix, not punishment.

  **The Blame Question**
  Your suspicion is correct: "Political crime" is inexpressible in safety-speak. But this is not a defect; it is a boundary condition.

  Safety engineering is teleological: its goal is recurrence prevention. Assigning moral blame often inhibits information flow (the "bad apple" theory), hiding latent conditions. If we label designers "criminals," they hide the design flaws. Safety speak forces us to ask, "What allowed this design?" rather than "Who should hang?"

  However, the moral charge does work causal analysis cannot. Causal analysis legitimizes technical fixes; moral judgment legitimizes regime change or prosecution. Safety vocabulary treats the Designer as a fallible human within a system. Political justice treats the Designer as an accountable agent with duties.

  Calling famine a "crime" asserts that the control structure was not merely flawed, but *illegitimate*. Safety analysis can prove the structure failed, but it cannot pronounce the structure unlawful. That requires a moral framework outside engineering.

  So, keep the vocabularies separate. Use safety speak to understand the mechanism of death. Use political language to assign responsibility for the design. Conflating them weakens both: you lose the root cause by chasing villains, or you excuse atrocities by calling them "system errors."
