answer: |-
  You are right to be suspicious. Your "Hot/Cold" distinction is a strong heuristic, but it is not the underlying principle. It describes *when* we allow binding, not *why*. If it were truly just about cognitive state, Case 4 (the cheerful accident victim) would be an open-and-shut violation of your rule, yet you feel the directive should win. If it were just about sovereignty, Case 9 (unamendable rights) would look exactly like Case 10 (unamendable tax), yet you distinguish them.

  Your intuitions are not incoherent, but they are tracking two different values that often overlap: **Agency Preservation** and **Identity Continuity**.

  Here is the principle that best fits your verdicts, followed by the honest breakdown of where it strains, and the predictions you asked for.

  ### The Principle: Constitutive vs. Contingent Precommitment

  **Precommitment is legitimate when it preserves the structural conditions necessary for the agent (individual or collective) to exist and choose over time. It is illegitimate when it locks in a specific preference or outcome against a competent successor.**

  We can call this the **Constitutive Constraint**.

  *   **Constitutive (Legit):** Rules that define *who* is choosing or *that* they are free to choose. (Odysseus's mission, Bipolar stability, Constitutional Rights, Advance Directives as dignity protection).
  *   **Contingent (Illegit):** Rules that dictate *what* is chosen. (Tax rates, Specific debt terms, Policy preferences).

  **Why this fits your cases:**
  *   **1, 2, 5 (Hot Binding):** These protect the *capacity* to choose. Odysseus wants to hear the song but not crash; the Bipolar friend wants to be sane; the Gambler wants to keep his money. The binding shields the agent from a state where agency is compromised.
  *   **9 (Rights):** Rights are constitutive of a liberal democracy. An 80% majority removing free speech isn't "changing its mind"; it is dismantling the system that makes it a legitimate majority. You defend the *process*, not the *policy*.
  *   **10 (Tax), 7 (Debt Bondage):** These are contingent outcomes. A tax rate doesn't define the polity; a debt term doesn't define the person. Locking them in forecloses future judgment without protecting agency.
  *   **11 (Anti-Revocation):** This destroys the exit option. If you cannot revoke, you are no longer an agent; you are a mechanism. This violates the Constitutive Constraint because it removes the capacity to choose *at all*.
  *   **6 (Smoking Contract):** This is the edge case. It's a price, not a ban. It respects agency (you *can* smoke) but penalizes the preference. You feel it's enforceable but not *moralizing* because it doesn't claim the act is wrong, just costly.

  ### The Fracture Point: Case 4

  Here is where the principle breaks, or at least where your gut conflicts with the logic.

  **Case 4 (Advance Directive vs. Cheerful Patient):**
  Under the Constitutive Constraint, if the patient is "awake, herself, cheerful," she is a competent agent. Her current will should override her past will, just as the current Parliament overrides the past one. Your friend's verdict (Patient wins) aligns with the principle. **Your verdict (Directive wins) does not.**

  Why do you feel the directive wins? Because you are treating the Advance Directive not as a *preference* (Contingent) but as a *definition of the self* (Constitutive). You are implicitly arguing that the "Healthy Self" defined the *terms of existence* for the "Accident Self." To keep her alive against her prior directive is to treat her body as a vessel you own, rather than a life she authored.

  **The Honest Admission:**
  You cannot have it both ways. Either:
  1.  **Present Agency is Sovereign:** If the self is competent, it can revoke any prior commitment (Friend is right on Case 4).
  2.  **Past Identity is Sovereign:** The "True Self" is the one who planned for the contingency, and the "Current Self" is chemically/situationally compromised even if cheerful (You are right on Case 4).

  Your "Hot/Cold" note tries to solve this by saying the manic friend is "Hot" (Case 2) and the accident victim is "Cold" (Case 4). But your verdict treats them the same (Binding wins). This suggests your actual principle isn't Hot/Cold, but **Irreversibility**.
  *   Mania is reversible; death is not.
  *   Debt is reversible (bankruptcy); slavery is not.
  *   Tax is reversible; Constitutional collapse might not be.

  **Revised Principle Candidate:** **Binding is legitimate when it protects against irreversible loss of agency or existence, illegitimate when it protects reversible preferences.**
  *   *Fits:* 1, 2, 4, 7 (Illegit because reversible), 9.
  *   *Breaks:* 6 (Smoking is reversible, but contract holds). 10 (Tax is reversible, but you say entrenchment is illegit).

  ### Is "Precommitment" One Thing?

  You asked if you are lumping together two problems. **Yes.**

  1.  **Self-Defense (Cases 1, 2, 3, 5):** This is about *weakness of will*. The future self is an adversary (addict, manic, tempted). The goal is to help the future self win against its own impulses.
  2.  **Self-Definition (Cases 7, 8, 9, 10):** This is about *sovereignty*. The future self is a successor (new Parliament, new majority). The goal is to decide if the Past Self has the authority to dictate terms to the Successor.

  In **Self-Defense**, the "Hot/Cold" distinction works perfectly.
  In **Self-Definition**, the "Constitutive/Contingent" distinction works better.
  Case 4 is the hybrid: It is Self-Defense (protecting the body) masquerading as Self-Definition (defining the life).

  ### Predictions for New Cases

  **1. The Will (Testamentary Freedom)**
  *   **The Case:** A dead person binds their estate. There is no "future self" to conflict.
  *   **Prediction:** **Legitimate, but time-limited.**
  *   **Reasoning:** Since there is no successor *self*, there is no agency conflict. However, the Constitutive Constraint applies to the *living* successors. You cannot bind the living forever (Rule Against Perpetuities). A will is legitimate because it transfers property based on past agency, but it becomes illegitimate if it attempts to control the *agency* of the heirs (e.g., "My son inherits only if he never divorces"). That crosses from property transfer into binding the successor's choices.
  *   **Verdict:** Binding the *assets* is legit; binding the *heirs' choices* is illegit.

  **2. The Secession Clause**
  *   **The Case:** A Constitution says "Region X is indivisible from the Union." Later, 80% of Region X votes to leave.
  *   **Prediction:** **Illegitimate (The Clause is Void).**
  *   **Reasoning:** This is the collective version of Case 7 (Debt Bondage). A political community cannot sell itself into permanent bondage. While Constitutional Rights (Case 9) protect the *process* of democracy, a Secession Clause protects a *boundary* against the democratic will of the people within that boundary.
  *   **Nuance:** If the "Union" is defined as the *constitutive self*, then secession is suicide (Illegit). If the "Region" is the *constitutive self*, then the Union binding them is tyranny (Illegit).
  *   **Application of Principle:** Since the "People" are the source of sovereignty, they cannot be bound by a past vote to remain a people against their current will. Unlike Rights (which protect individuals from the majority), a Secession Clause protects the *Majority's geography* against the *Majority's will*.
  *   **Verdict:** The clause is unenforceable. A majority capable of amending the constitution can dissolve the union. To hold otherwise is to treat the State as an owner of the People, rather than the People as owners of the State.

  ### Summary of the Break
  Your intuition is robust, but Case 4 is the crack in the foundation. You treat the Advance Directive as **Constitutive** (defining a life worth living) while treating the Tax Rate as **Contingent** (policy). The hard question you must answer in your seminar is this: *Is the cheerful accident victim the same "Self" that wrote the directive?*

  If yes, your gut on Case 4 violates your gut on Case 10.
  If no, you must explain why she is "impaired" despite being cheerful and informed.

  My advice: Argue that Precommitment is **not one thing**. It is a family resemblance concept covering **Capacity Shielding** (Odysseus) and **Identity Entrenchment** (Constitutions). Case 4 fails because it demands Identity Entrenchment override Present Agency, which is only permissible if we accept that some decisions (Life/Death) are Constitutive of the Self in a way that Tax Rates are not.
