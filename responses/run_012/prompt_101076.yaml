      *   **Topic:** Daniel Dennett's case against qualia, specifically the "Chase and Sanborn" coffee tasters thought experiment.
      *   **Format:** A poem of five six-line stanzas.
      *   **Structure:**
          *   Stanzas 1-4: Last line of each must be a fixed refrain.
          *   Refrains: The four traditional marks of qualia (Ineffability, Intrinsicness, Privacy, Direct Acquaintance).
          *   Stanza 5: Two new lines + all four refrains in reverse order.
          *   Speakers: Chase and Sanborn only in stanzas 1-4. A third voice (observer/philosopher) enters only in stanza 5.
          *   Content: The dispute (coffee changed vs. palate changed) where introspection cannot decide.
          *   Goal: Philosophy accurate enough for Dennett readers, accessible enough for others.
      *   **Post-Poem:** Commentary under heading "Commentary", roughly 150 words.
          *   Explain formal choices (refrains, order, last stanza).
          *   Note liberties/contested readings.
          *   State confidence level and single out the least sure point.

  2.  **Deconstruct the Philosophy (Dennett's Argument):**
      *   **Thought Experiment:** Chase and Sanborn are coffee tasters. They both say the coffee isn't as good as it used to be.
      *   **Hypothesis 1 (Chase):** The coffee changed (objective), my taste is same.
      *   **Hypothesis 2 (Sanborn):** My taste changed (subjective), the coffee is same.
      *   **The Problem:** Their verbal reports ("It tastes bitter now," "It lacks zest") are identical. Their introspective access to the "qualia" of the taste doesn't help them distinguish whether the change is in the world or in them.
      *   **Dennett's Point:** Qualia are supposed to be the ultimate grounding of experience. If qualia have the four marks (Ineffable, Intrinsic, Private, Directly Apprehensible), then the subject should know *what* it is like. But here, the subject *doesn't* know if the "what it is like" has changed because of them or the object. Therefore, the notion of qualia as private, inner properties is useless or non-existent. The "judgment" is all there is.
      *   **The Four Marks (Traditional):**
          1.  Ineffable (cannot be conveyed in words).
          2.  Intrinsic (non-relational, atomic).
          3.  Private (interpersonal comparisons impossible).
          4.  Directly Apprehensible (known simply by being had/incorrigible).
      *   **The Twist:** The poem needs to show how these marks, intended to secure qualia, actually make the dispute unresolvable (supporting Dennett's elimination of qualia).

  3.  **Drafting the Poem:**
