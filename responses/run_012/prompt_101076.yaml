  Chase says the roast has gone to ground,
  The zest he loved is nowhere found.
  He trusts his tongue, he blames the bean,
  But language fails to paint the scene.
  He points to cup, not to his head:
  It cannot be conveyed in words.

  Sanborn claims the brew is stable,
  It is his palate, not the table.
  The shift resides within the flesh,
  No outer cause to hold or mesh.
  The property belongs to him alone:
  It is intrinsic rather than relational.

  Chase argues no one else can see
  The bitter ghost inside his tea.
  No comparison can cross the divide,
  Where inner sensations hide.
  His secret sip, his isolated fact:
  It is private to a single subject.

  Sanborn feels the change directly,
  No inference needed, strictly.
  He does not guess, he does not learn,
  The feeling is the only turn.
  Immediate truth, no path to tread:
  It is known simply by being had.

  What observable difference makes this strife?
  If reports match, qualia vanish from life.
  It is known simply by being had.
  It is private to a single subject.
  It is intrinsic rather than relational.
  It cannot be conveyed in words.

  ### Commentary

  The refrains enumerate the traditional defining properties of qualia. Placing them as stanza conclusions mimics how they are invoked as final arbiters. The fifth stanza reverses this order to demonstrate Dennett's critique: these properties, intended to secure qualia, render the distinction between Chase and Sanborn empirically empty. By entering only at the end, the third voice embodies the heterophenomenological stance, asking for observable differences where none exist.

  I am highly confident in the philosophical accuracy regarding Dennett's eliminationist strategy. The poem takes a minor liberty by treating the four marks as a rigid checklist, whereas Dennett attacks the cluster concept more fluidly. I am least sure whether the reverse ordering effectively communicates the collapse of the distinction to a reader unfamiliar with the argument, rather than merely serving as a formal recapitulation.
