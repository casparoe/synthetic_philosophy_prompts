          *   S2 Refrain: That quality is intrinsic rather than relational.
          *   S3 Refrain: That experience is private to a single subject.
          *   S4 Refrain: That sense is known simply by being had.
          *   S5 Refrains (Reverse): Known simply by being had -> Private -> Intrinsic -> Ineffable.
      *   **Speakers:** Chase and Sanborn alternating or distinct voices. Let's alternate to show the symmetry.
      *   **Stanza 5:** Third voice enters. Two new lines + 4 refrains reversed.

