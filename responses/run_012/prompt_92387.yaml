      *   *Section 2: Real World Domains (Drugs/Code).* Map the logic. Healthy non-users = green apples. They don't stress the mechanism. Code: Testing functions that don't allocate memory doesn't prove no leaks in functions that do.
      *   *Section 3: Order of Operations.* The "Protocol" argument. Good-Old Bayesianism (Fitelson et al.). If you select by "Non-Raven," you break the evidential link.
