answer: |-
  You have arrived at the central tension in modern famine studies without the benefit of the academic literature, which is to say you have rediscovered the problem through moral intuition. Your judgments are not inconsistent; they are tracking a distinction that scholars often blur.

  You are looking for the rule that underlies your verdicts. Based on the cases you provided, your implicit rule is not simply "Knowledge + Power + Inaction." If it were, Ireland would be a crime, as you noted. Your rule is actually about **Primary Causality** and **The Direction of Agency.**

  Here is the principle your judgments add up to:

  **A famine is a "Natural Disaster" (Calamity) when an exogenous shock overwhelms local capacity, and human failure is one of *omission* due to ideology or incapacity. A famine is a "Crime" when human policy is the *proximate cause* of the starvation, or when agency is used *actively* to obstruct relief.**

  ### 1. Decoding Your Verdicts

  Let's test this principle against your cases.

  *   **Ireland (1840s):** You call this "weather." Under your rule, this is because the *trigger* was biological (the blight). The potato crop did not just fail; it vanished. This was an exogenous shock of such magnitude that it overwhelmed the existing economic structure. The British response was negligent and ideological (laissez-faire), but in your view, it was a failure to *save* people from nature, not a policy to *kill* them. The agency was passive.
  *   **Bengal (1943):** You call this a "crime." The trigger was not a crop failure of Irish magnitude; rice production was only marginally down. The starvation was caused by the *Denial Policy* (scorched earth against Japan), boat requisitions, and prioritizing the military. Here, human agency *created* the vulnerability. The direction of policy pushed food away from the hungry.
  *   **China (1959–61):** Crime. The trigger was policy (Great Leap Forward), not weather.
  *   **Dutch Hunger Winter (1944–45):** Crime. The trigger was a specific reprisal order. Active weaponization of food.
  *   **Sahel (1970s):** Natural. You grant relief was possible "in principle," but you likely weigh the logistical reality of the time (no airlift capacity, poor infrastructure) heavily. The primary driver was the drought; the failure was global incapacity/indifference, not active obstruction.
  *   **Ethiopia (1980s):** Crime. The drought was the context, but the Derg regime's resettlement programs and obstruction of aid were the *cause* of mass death. Active obstruction.
  *   **Russia (1921–22):** Your hesitation here confirms the rule. It sits on the line between "Drought + War" (Calamity) and "Requisitioning" (Crime). You oscillate because the causality is mixed.

  ### 2. Solving the Ireland/Bengal Paradox

  You ask why Ireland is weather and Bengal is murder, given both exported food under British rule.

  The difference is **Food Availability Decline (FAD) vs. Entitlement Failure.**
  In Ireland, the FAD was real and catastrophic. The potato was the sole calorie source for millions, and it rotted in the ground. No amount of grain importation could easily replace that caloric deficit instantly without massive state intervention, which was ideologically anathema to the Whigs.
  In Bengal, the FAD was negligible. There was enough food in Bengal and India to feed everyone. The starvation was purely an entitlement failure engineered by war priorities.

  Your intuition distinguishes between **Tragic Negligence** (Ireland) and **Reckless Endangerment** (Bengal).
  *   **Ireland:** The government let people die to preserve an economic doctrine.
  *   **Bengal:** The government risked people dying to win a military objective.

  You resist calling Ireland a "crime" because "crime" implies malice or recklessness where the outcome was foreseeable and preventable *without* a competing existential threat (like losing the war against Napoleon or Hitler). In Ireland, the British government was arguably fighting a war against hunger with the wrong weapons, but in Bengal, they sacrificed the civilians as collateral damage for a war against Japan.

  ### 3. A Refined Framework

  To make your rule robust, I suggest expanding your binary (Natural/Crime) into a triad. This solves the "Ireland Problem" without forcing you to accept the "they didn't count" clause.

  1.  **Calamity:** An ecological shock occurs. The state lacks the capacity or resources to fully mitigate it. (e.g., Pre-modern famines, perhaps the Sahel).
  2.  **Negligence:** An ecological shock occurs. The state has the capacity to mitigate it but chooses not to due to ideology, racism, or bureaucratic inertia. **(This is Ireland.)** It is morally culpable, but distinct from active killing.
  3.  **Weaponization:** Policy creates the shortage, or relief is actively blocked to achieve a political/military end. **(This is Bengal, China, Ethiopia, Dutch Winter.)**

  If you adopt this, you keep your verdicts but clarify the moral weight. Ireland becomes **Negligence**, not Weather. This acknowledges the British culpability (they *could* have closed the ports, they *chose* not to) without equating it to the active malice of the Derg or the CCP.

  ### 4. Applying the Principle to New Cases

  You asked how your surviving principle applies to four specific scenarios. Using the **Calamity/Negligence/Weaponization** framework:

  **A. A government that prevents a famine at real cost to itself.**
  *   **Verdict:** This proves the "Natural Disaster" category is largely a myth. If a government *can* prevent it at cost, famine is a political choice.
  *   **Classification:** This is the counterfactual that defines the others. If they do it, it is **Governance**. If they don't, it falls into Negligence or Weaponization. This aligns with Sen: Democracy forces this cost to be paid.

  **B. A city starved out by a besieging army.**
  *   **Verdict:** **Weaponization (Crime).**
  *   **Reasoning:** This is the Dutch Hunger Winter model. The hunger is the method of warfare. International law now classifies starving civilians as a war crime. The distinction is clear: the food exists, the army prevents access intentionally.

  **C. A drought in a place with no state worth speaking of.**
  *   **Verdict:** **Calamity.**
  *   **Reasoning:** This is the only true "Natural Disaster." If there is no sovereign power to organize relief, and the international community fails to intervene, the causality remains ecological. However, in the modern world, true statelessness is rare; usually, there is a warlord or a neglected region, which shifts it toward Negligence (by the international community).

  **D. Chronic hunger where children are stunted but no one dies in the street.**
  *   **Verdict:** **Structural Violence.**
  *   **Reasoning:** This is not a "famine" in the event-based sense. It is a continuous condition. Under your rule, if the state *could* fix this but chooses to allocate resources elsewhere (e.g., military, elite subsidies), it is a slow-motion **Negligence**. It is morally equivalent to famine but lacks the "event" horizon that triggers the label.

  ### 5. The Ontological Question

  You ask: *Is the distinction between natural and political here a distinction between two kinds of events at all, or only between two things I'm calling by the one name?*

  It is **two different phenomena sharing one outcome.**

  *   **Phenomenon A (Ecological):** The biosphere fails to support the population. (The Blight, The Drought).
  *   **Phenomenon B (Social):** The social contract fails to distribute the surplus. (The Export, The Blockade).

  Calling both "Famine" is like calling a death by heart attack and a death by poisoning both "Death." It is medically accurate but legally and morally useless.

  Your intuition is correct to resist the conflation. When you call Ireland "weather," you are identifying Phenomenon A. When you call Bengal "crime," you are identifying Phenomenon B.

  **The Synthesis:**
  In the modern era (post-1850), Phenomenon A almost never leads to mass death without Phenomenon B. We have the global surplus to offset local crop failures. Therefore, **all modern famines are political.**

  However, your distinction remains vital for **remedy.**
  *   If the cause is **Calamity**, the remedy is **Logistics** (send food).
  *   If the cause is **Negligence**, the remedy is **Pressure** (sanctions, shame, democracy).
  *   If the cause is **Weaponization**, the remedy is **Force** (intervention, breaking blockades).

  ### Conclusion: Your Rule

  Your judgments add up to this:

  > **A famine is a crime when the starvation is the result of a policy choice that prioritized something else over human life, where the alternative was feasible. It is a natural disaster only when the shock exceeds the total capacity of human systems to respond, regardless of intent.**

  You should give up the verdict that Ireland was "weather." It undermines your own rule. The British *had* the capacity (the Royal Navy, the wealth of the empire) and the *knowledge*. They chose ideology over life. That fits your definition of Negligence, which is a subset of political failure, if not legal murder.

  If you move Ireland to **Negligence**, your system becomes consistent:
  *   **Sahel:** Calamity + Global Negligence (Capacity was low).
  *   **Ireland:** Calamity + State Negligence (Capacity was high, ideology blocked it).
  *   **Bengal/Ethiopia/China:** State Weaponization (Policy caused or exacerbated it).

  This preserves your moral intuition about the difference between "letting die" and "killing," while accepting Sen's premise that the "natural" component is rarely sufficient to cause mass death on its own in the modern world.
