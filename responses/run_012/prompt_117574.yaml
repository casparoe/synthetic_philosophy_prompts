      *   *Refining the NATO point:* Distinguish between *Collective Defense* (Article 5) and *Crisis Management* (Expeditionary). Finland can keep conscription because they define their NATO role as territorial defense of the Nordic-Baltic region.
      *   *Refining the Fairness point:* Be hard on this. The user's argument fails if it accepts gender inequality. The "currency of bodies" applies to all bodies in the territory.
