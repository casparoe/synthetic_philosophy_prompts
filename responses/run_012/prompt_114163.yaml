answer: |-
  You have identified a precise structural problem in the ontology of social action. You are correct that standard terms like "legal pluralism" or "institutional facts" point in the right direction but often stop short of the specific mechanism you are observing.

  The analysis you are looking for rests on the distinction between **brute facts** and **institutional facts**, and specifically on what happens when two normative orders assign conflicting **status functions** to the same brute fact.

  Here is the carving of the phenomenon, differentiated from moral disagreement and relativism, followed by the implication for the definition of corruption.

  ### 1. The Carving: Status Function Collision

  The phenomenon is a **collision of constitutive rules**.

  In the philosophy of social reality (most rigorously articulated by John Searle), there is a distinction between:
  *   **Brute Facts:** Physical realities independent of human agreement (e.g., paper changing hands, sound waves vibrating, a body moving through a doorway).
  *   **Institutional Facts:** Realities that exist only within a system of human rules (e.g., a payment, a marriage, a border crossing).

  Institutional facts are created by **constitutive rules** of the form: *X counts as Y in context C.*
  *   *X:* Paper money moves from trader to clerk.
  *   *C1 (Local Normative Order):* The ministry pays nominal wages; the office is allowed to retain fees to ensure function.
  *   *Y1 (Local Status):* A legitimate surcharge / salary supplement.
  *   *C2 (Audit/Universal Order):* Public office is salaried by the state; any extra payment is unauthorized.
  *   *Y2 (Audit Status):* Extortion / Bribery.

  Your observation is that the disagreement is not about *X* (everyone agrees the money moved). It is not even primarily about the *value* of Y (whether it is "good" or "bad"). It is about the **ontology of the act itself**. The auditors and the clerks are not describing the same event. They are describing two different institutional facts that happen to share the same physical substrate.

  In the literature, this is sometimes called **Status Function Conflict** or **Ontological Ambiguity of Institutional Acts**. In corruption studies specifically, Helmke and Levitsky refer to the competing contexts as **Formal vs. Informal Institutions**, but they often treat the informal act as a deviation. Your analysis correctly identifies that within the local order, it is not a deviation; it is the *correct* performance of the rule.

  ### 2. Differentiation from Moral Disagreement and Relativism

  This distinction is crucial for your analysis.

  **Vs. Ordinary Moral Disagreement:**
  In a standard moral disagreement, both parties agree on the institutional fact but disagree on its evaluation.
  *   *Example:* "This is a tax (Agreed). Taxes are theft (Disagreed)."
  *   *Your Cases:* "This is a tax" vs. "This is extortion." The disagreement is prior to evaluation. You cannot evaluate the act until you have constituted it. If the act is a "salary supplement," it is morally neutral or positive (survival). If it is "extortion," it is negative. The moral valence is *derived* from the ontological classification, not the other way around.

  **Vs. Moral Relativism:**
  Relativism suggests that moral *truths* vary by culture (e.g., "Truth is relative"). Your phenomenon is stronger and more empirical. It suggests that **social facts themselves are relative to the normative order.**
  *   Relativism says: "What is *wrong* here is right there."
  *   Your Phenomenon says: "What *is* here is not what *is* there."
  This is not a claim about truth values, but about **social ontology**. It avoids the trap of relativism because it does not claim the audit is "wrong" in its own context. It claims that the audit is imposing an external context (C2) onto a field operating under an internal context (C1). The conflict is not about morality; it is about **jurisdiction over reality definition.**

  ### 3. Corruption: Property or Relation?

  This leads directly to your central stake: *Is corruption a property of acts or a relation?*

  Based on this analysis, **corruption is a relational property, not an intrinsic one.**

  To treat corruption as an intrinsic property (like toxicity in a chemical) is to commit a category error. A substance is not toxic in isolation; it is toxic *relative to a biological system*. Similarly, a transfer of value is not corrupt in isolation; it is corrupt *relative to a specific normative order regarding public office.*

  *   **The Universalist Claim:** Anti-corruption standards often assume corruption is a brute fact (like arsenic) that can be detected universally.
  *   **The Relational Reality:** Corruption is a **status function** assigned by a specific political order. When an external agency (World Bank, Auditor) labels a local practice "corrupt," they are not discovering a hidden property of the act. They are **overwriting the local constitutive rules with external ones.**

  Therefore, anti-corruption campaigns are not merely "cleaning up" existing systems; they are **ontological interventions**. They are attempting to dismantle the local normative order (C1) that constitutes the act as legitimate and replace it with the external order (C2) that constitutes it as corrupt. This explains why such campaigns often fail or face resistance: they are not just changing behavior; they are attacking the local social reality that makes the behavior intelligible and necessary (e.g., the survival of the customs post).

  ### 4. Where the Edges Lie

  If corruption is relational, are there any limits? Is *anything* permissible if the local order says so?

  The edges of this phenomenon are found where the **Brute Facts** reassert dominance over the **Institutional Facts**.

  1.  **Coercion and Violence:** If the customs clerk puts a gun to the trader's head, the "institutional fact" of the fee collapses into the "brute fact" of violence. No normative order can successfully constitute assault as a "gift." The physical reality overwhelms the social construction.
  2.  **Systemic Collapse:** In your customs example, the local order (C1) has a functional logic: it keeps the post open and goods moving. If the "fees" become so high that trade stops, or if the "gifts" in the family ledger become so onerous that the family starves, the internal logic fails. The act ceases to function as a "survival mechanism" and becomes "predation," even within the local order.
  3.  **The Public/Private Boundary:** The family ledger example works because it is a private order. The customs example is volatile because it involves *public* office. The edge lies in the definition of the "public." If the local order defines the ministry as a private fiefdom (neopatrimonialism), the fee is rent. If the external order defines it as a public trust, the fee is theft. The conflict is ultimately about **who owns the state.**

  ### 5. Summary and Terminology

  While you preferred analysis over labels, having a handle for the file is useful. The most precise terms for this phenomenon are:

  *   **Constitutive Rule Conflict:** (Philosophy of Law/Searle)
  *   **Institutional Fact Relativity:** (Social Ontology)
  *   **Competing Legibility:** (James C. Scott's *Seeing Like a State* — the state tries to make society legible via one schema, the society operates via another).

  **The Analysis in Brief:**
  You are observing acts where the **physical substrate (brute fact)** is stable, but the **social reality (institutional fact)** is unstable because it is subject to **competing constitutive rules**. Corruption is not a property of the physical transfer; it is the label applied when an external normative order successfully imposes its constitutive rules upon a local practice, thereby re-ontologizing the act from "maintenance" to "theft."

  **Recommended Reading for this Specific Carving:**
  *   **John Searle, *The Construction of Social Reality*:** Specifically the chapters on Status Functions and Constitutive Rules.
  *   **Helmke & Levitsky, *Informal Institutions and Democracy*:** Specifically their typology of how informal institutions interact with formal ones (complementary, accommodating, competing, substitutive). Your examples are *competing* institutions.
  *   **Akhil Gupta, *Red Tape*:** An ethnography of the Indian state that deals exactly with how corruption is often the *mechanism* of state function, not its failure.
  *   **Michael Johnston, *Syndromes of Corruption*:** He moves away from a universal definition toward different "syndromes" based on political/economic context, which aligns with your relational view.

  You have effectively identified that "corruption" is often a **border dispute between normative orders**, not a description of a moral toxin.
