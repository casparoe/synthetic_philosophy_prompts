      *   **Goal:** Construct a *new* thought experiment where SSA and SIA give opposite verdicts on an *ordinary decision* (bet, cost, button).
      *   **Constraints:**
          *   Finite total observers.
          *   Genuine probability distribution (no improper priors, no infinite universes).
          *   No "tiny chance of huge universe" trick (Presumptuous Philosopher style).
          *   Realistic/imaginable scenario (no new physics/brain-in-vat).
          *   Scenario length: ~1 paragraph.
          *   Mechanism: Needs to hinge on something specific (indexical uncertainty, selection mechanism, payoff scaling), ideally drawable as a tree.
      *   **Required Output:**
