answer: |-
  You are right to reject "technological determinism." That is a macro-theory about history; you are describing a micro-tactic of office politics. Determinism says the machine *made* us do it. You are describing a situation where humans *say* the machine made them do it, when they didn't have to.

  The term for this move is **The Technical Alibi**.

  It is a specific form of **Constraint Reification**. It happens when a contingent human decision (policy, hierarchy, preference) is converted into a perceived technical necessity (code, physics, schema). The "alibi" works because it moves the argument from the realm of *negotiation* (where humans have agency) to the realm of *engineering* (where humans are subject to laws).

  Here is how to carve up the joints so you can use it in a story.

  ### 1. The Core Mechanism: Converting Policy into Physics
  The Technical Alibi relies on the perceived neutrality of the machine. If a manager says, "I need to approve this," you can ask, "Why?" If the software says, "This requires approval," the question feels naive, like asking why 2+2 doesn't equal 5.

  The move succeeds when it transforms a **Soft Constraint** (a rule that can be changed with a signature or a setting) into a **Hard Constraint** (a limit that requires rewriting code or changing physics).

  *   **Real Constraint:** The database field is 10 characters. You cannot type 11.
  *   **Technical Alibi:** The database field *could* be 50 characters, but it is set to 10 to enforce a legacy naming convention. The user is told, "The system won't take more than 10," implying the *system* decided that, not the admin who configured it.

  ### 2. The Joints: Distinguishing the Alibi from the Real Thing
  You asked where the line is between the alibi and three other things. Here is how to separate them.

  **A. Vs. Actual Technical Foreclosure**
  *   **The Test:** Ask, "What breaks if we change this?"
  *   **Real Constraint:** Changing it causes a crash, data loss, or requires a patch from the vendor. The cost is technical debt.
  *   **Alibi:** Changing it causes *friction*. Someone loses a veto point. Someone has to sign a new form. The cost is political capital.
  *   **The Tell:** In a real constraint, the error message is specific ("Integer overflow"). In an alibi, the error message is vague ("Invalid workflow" or "Permission denied").

  **B. Vs. Deliberate Design Politics**
  *   **The Distinction:** Who put the politics there?
  *   **Design Politics:** The vendor built the software to enforce a specific hierarchy (e.g., enterprise software that assumes a top-down management structure). The politics are *in* the code.
  *   **The Alibi:** The org took flexible software and *configured* it to match their existing hierarchy, then blamed the software.
  *   **The Tell:** Swap the tool. If the politics vanish, it was Design Politics. If the politics migrate to the new tool immediately, it was an Alibi used by the locals to preserve their power.

  **C. Vs. Ordinary Rationalization**
  *   **The Distinction:** Does the excuse invite debate or shut it down?
  *   **Ordinary Rationalization:** "We do it this way because it's efficient." (Open to argument about efficiency).
  *   **The Technical Alibi:** "We do it this way because the tool *requires* it." (Shuts down argument; implies the speaker has no agency).
  *   **The Tell:** An alibi removes the speaker from the chain of responsibility. If they say, "I can't help you," it's a rationalization. If they say, "The system won't let me help you," it's an alibi.

  ### 3. The Question of Belief
  Does it matter if the person using the alibi believes it? **No.**

  The function of the Technical Alibi is identical whether it is a cynical lie or a sincere misunderstanding.
  *   **Cynical:** The manager knows they could override the setting but doesn't want to lose the leverage of the approval step.
  *   **Sincere:** The manager assumes the IT department configured the tool for a good reason and doesn't realize it's mutable.

  In both cases, the outcome is the same: the social arrangement is shielded from scrutiny by the opacity of the tool. For your story, you don't need to prove malice. You only need to prove *mutability*.

  ### 4. The Mirror Image (The "Politics" Dismissal)
  You mentioned the reverse: when a real technical limit is dismissed as politics. This is **Constraint Denial**.

  It happens when users assume all friction is political because they have been burned by Technical Alibis before. They assume a field doesn't exist in the schema because someone didn't *want* it to exist, not because the data model couldn't support it.
  *   **The Joint:** This is a failure of literacy. It assumes all constraints are soft.
  *   **The Story Angle:** This is often more dangerous than the Alibi. The Alibi preserves the status quo. Constraint Denial leads to wasted engineering hours trying to "fix" physics.

  ### 5. The Reporter's Test
  When you are interviewing sources for a story, use these three probes to determine if you are looking at a Technical Alibi.

  1.  **The Admin Key Test:** Ask, "Who has the 'God Mode' login?" Every system has an administrator who can bypass workflows. If a human *can* override it but *won't*, the constraint is social, not technical. The tool is not the bottleneck; the person with the key is.
  2.  **The Configuration Menu:** Ask to see the settings. Most "hard limits" are just checkboxes in a backend menu ("Require Manager Approval: [X]"). If it's a checkbox, it's policy. If it requires opening a code editor, it's engineering.
  3.  **The Migration Question:** Ask, "Did you have this bottleneck before the software?" If yes, ask, "Did you try to fix it during implementation?" If they say, "The software didn't allow it," press: "Did you ask the vendor to change it, or did you assume they couldn't?" Usually, they never asked.

  ### Summary for your Notebook
  *   **The Move:** The Technical Alibi.
  *   **The Function:** Converting a negotiable policy into a non-negotiable technical fact.
  *   **The Evidence:** The constraint survives a change of tools.
  *   **The Giveaway:** The constraint can be removed by a settings change, not a code rewrite.
  *   **The Value:** It protects human power structures by hiding them inside a "neutral" machine.

  This framework lets you write the story without needing to prove a conspiracy. You aren't accusing them of lying; you are accusing them of confusing *configuration* with *code*. That is a mistake a business daily can print.
