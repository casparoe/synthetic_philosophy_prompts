          *   No external knowledge: Students have no internet access. The question must state the necessary material (provided in the prompt). The answer/mark scheme must not reward names, works, dates, or citations.
          *   Input Material: Four specific points to be included in the question stem (Trade analogy/baseline/threat point; Positional vs. Non-positional goods; Concedable vs. Non-concedable items; The Hospital Trustee Case).
          *   Output Structure: 1. Essay Question, 2. Model Answer (~700 words), 3. Marking Scheme (5 points x 4 marks = 20 total, with common errors).
          *   Difficulty Level: Third-year undergraduate (needs depth, not just surface observation). Avoid easy outs like "values are incommensurable." Focus on the baseline/threat point and the nature of exchange.
          *   Marking Scheme Specifics: Distinguish between upper second (2:1) and first class performance.

  2.  **Drafting the Essay Question:**
