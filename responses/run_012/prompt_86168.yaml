      *   *Drafting:* Start by presenting the trade analogy (Point 1). Introduce the complications (Points 2 & 3). Present the case (Point 4). Ask the student to assess whether the compromise in the case is morally justified or coherent given the constraints.
      *   *Refinement:* Ensure the prompt explicitly forbids reliance on external authors. Make sure the core task is about the *limits* of the trade analogy regarding baselines and what is actually traded.
      *   *Key Focus:* The prompt asks to make clear that the crux is the baseline against which gain is measured and the question of what is actually being exchanged.
      *   *Question Formulation:* "Critically assess the claim that the compromise reached in the case below is morally permissible solely on the grounds that it represents a mutual gain relative to the disagreement outcome. In your analysis, explain what the trade analogy requires regarding the baseline and the object of exchange, and demonstrate where these requirements encounter difficulty in light of the distinctions provided."

  3.  **Drafting the Model Answer:**
      *   *Length:* ~700 words.
      *   *Tone:* Strong third-year undergraduate (analytical, precise, structured).
