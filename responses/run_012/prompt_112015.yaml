answer: |-
  The established term for the framework your brother is invoking is **Substituted Judgment**. In philosophy, particularly in welfare economics and ethics, the underlying mechanism is called **Idealized Preference Theory** (or the **Ideal Advisor** account).

  However, the specific *shape* of the move you have identified—where the "improved" self is constructed in a way that conveniently mirrors the advocate's own desires, specifically to override the actual person's *expressed* wishes—does not have a single canonical label that captures its circularity. It is generally discussed as a failure mode of Substituted Judgment known as the **Indeterminacy Problem** or **Projection**.

  Because the established terms describe the *legitimate* procedure, and you are describing a specific *corruption* of that procedure (one where the "improvement" is selectively defined to guarantee a specific outcome), I will coin a term for this specific rhetorical maneuver: **Ventriloquized Competence**.

  Here is the carving you asked for: the definition of the established concepts, where your observation parts company with them, why the "improvement" is never neutral, and the boundary cases where the move might gain authority.

  ### 1. The Established Terms: Substituted Judgment and Idealized Preference

  **Substituted Judgment (Law and Medicine)**
  This is the legal standard used when a patient lacks decision-making capacity. The proxy (your brother) is instructed not to decide what *they* think is best (Best Interests Standard), but to decide what the *patient* would have chosen if they were competent.
  *   **The Carving:** It attempts to separate *capacity* (the ability to process information, reason, and understand consequences) from *values* (the underlying desires, commitments, and identity). It assumes values are stable while capacity fluctuates.
  *   **The Divergence:** As you correctly noted, standard Substituted Judgment is typically invoked when the patient is *silent* (coma, vegetative state, advanced non-verbal dementia). When a patient *speaks*, the law generally presumes capacity unless proven otherwise. Your brother is using Substituted Judgment to *override* speech, which shifts the burden: he is asserting that her current speech is not an expression of her "true" will because her capacity is compromised.

  **Idealized Preference Theory (Philosophy)**
  This is the philosophical engine under the hood. It suggests that a person's "true" welfare is determined not by what they actually want (which may be based on ignorance or fear), but by what they *would* want if they were fully informed, rational, and calm.
  *   **The Carving:** It improves the agent along dimensions of *epistemic access* (information) and *cognitive processing* (rationality), while holding *fundamental values* constant.
  *   **The Divergence:** In philosophy, this is usually a tool for an individual to critique their own choices (e.g., "I want to smoke, but my idealized self wouldn't"). It is rarely considered legitimate for a *third party* to impose the idealized preference over the actual preference, precisely because of the problem you identified: who defines the idealization?

  ### 2. The Nameless Variant: Ventriloquized Competence

  You have identified that the "improvement" is not neutral. Your brother defines "thinking straight" as "thinking like me." This specific maneuver lacks a standard name, so I will define it here as **Ventriloquized Competence**.

  **Definition:** *Ventriloquized Competence* occurs when a proxy constructs a hypothetical "competent version" of an incapacitated person to justify overriding that person's expressed wishes, where the parameters of "competence" are selectively tuned to ensure the hypothetical version agrees with the proxy's pre-existing conclusion.

  **Why the improvement is made along some dimensions and not others:**
  The move requires a distinction between "tools" and "goals." The advocate claims to be improving the *tools* (clarity, steadiness, information) while preserving the *goals* (values).
  *   **The Trick:** "Sensibility" is not a tool; it is a value. By defining your mother as a "sensible woman," your brother is not just restoring her cognitive processing; he is importing a specific hierarchy of values (e.g., financial prudence > emotional attachment, legacy > comfort).
  *   **The Circularity:** As you observed, the "improved" mother never speaks unless spoken for. This is because there is no fact of the matter about what a hypothetical person would want. The "will" of the idealized self is not discovered; it is *authored* by the advocate. The advocate projects their own reasoning onto the blank slate of the "competent" mother, then attributes the conclusion to her.

  **Can the verdict have authority over the actual person's expressed wish?**
  *   **In Law:** Generally, no. If a patient expresses a wish, even with dementia, that wish carries significant weight unless they are adjudicated completely incompetent. Substituted Judgment is a fallback for silence, not a gag order for speech.
  *   **In Ethics:** This is the battleground between **Precedent Autonomy** (the rights of the past competent self) and **Current Interests** (the rights of the present experiencing self).
      *   *Ronald Dworkin*, a prominent legal philosopher, argued for **Precedent Autonomy**. He distinguished between *experiential interests* (current pleasure/pain, e.g., staying in the familiar house) and *critical interests* (the narrative integrity of one's life, e.g., "I was always a person who didn't hold onto assets"). He argued the critical interests of the past competent self should win.
      *   *Rebecca Dresser* and others counter that the "past self" is effectively dead. The current person, even with dementia, is a new entity with rights that cannot be sacrificed for the "narrative" of a person who no longer exists.
      *   **Your Case:** Your brother is arguing for Precedent Autonomy (the "sensible woman" she *was*). You are witnessing the defense of Current Interests (the woman who *is*). The authority of the "improved" verdict collapses when the "improvement" is indistinguishable from the advocate's preference.

  ### 3. Boundary Cases: When Does the Move Become Legitimate?

  You asked for the boundaries where this move shifts from *Ventriloquized Competence* to legitimate *Substituted Judgment*.

  **Case A: When the person is wholly unable to speak.**
  *   **Verdict:** Legitimate (with caveats).
  *   **Reasoning:** When there is no current expression to override, the "Indeterminacy Problem" is less harmful. Someone *must* decide. Substituted Judgment is the least-worst option because it attempts to honor the person's identity rather than imposing the proxy's values (Best Interests). However, the risk of projection remains; it is simply unavoidable rather than abusive.

  **Case B: When the improvement is confined to information alone.**
  *   **Verdict:** Potentially Legitimate.
  *   **Reasoning:** If the only gap is *factual* (e.g., "She doesn't want the surgery because she thinks it's fatal, but if she knew it was safe, she would"), correcting the information respects her existing values.
  *   **The Limit:** This fails when "information" is conflated with "valuation." Your brother claims she lacks the "whole picture." But if the "whole picture" includes the judgment that "selling is sensible," that is not information; it is a value judgment. If the improvement requires adopting the advocate's *weights* for different facts, it crosses into Ventriloquized Competence.

  **Case C: When the person herself has previously endorsed the improved version.**
  *   **Verdict:** Legitimate (This is the strongest case for Precedent Autonomy).
  *   **Reasoning:** If your mother, while fully competent, had said, "If I ever get dementia and want to keep the house out of fear, I want you to sell it because I know that won't be my rational self," then your brother is not projecting; he is executing a prior instruction. This is an **Advance Directive**.
  *   **The Limit:** Without this explicit prior endorsement, the "sensible woman" is a fiction. General character traits ("she was always sensible") are not sufficient to override specific current wishes ("I do not want to sell"), because circumstances change and "sensibility" is context-dependent.

  ### Summary

  The move is formally **Substituted Judgment**, grounded in **Idealized Preference Theory**. However, the specific pattern you have observed—where the hypothetical competent self is a mirror for the advocate's desires, used to silence the actual person—is **Ventriloquized Competence**.

  It parts company with legitimate Substituted Judgment because it treats *values* as *tools*. It assumes "sensibility" is a neutral cognitive state rather than a specific value system. It gains authority only when the "improvement" is strictly factual (information) or explicitly authorized by the person in advance (advance directive). In the absence of those, when used to override the expressed wishes of a person who can still speak, it is not a discovery of the mother's will, but a replacement of it.
