prompt: |-
  Ok so I got into an arguement in a group chat the other night about astrology and I can't stop chewing on the line one guy kept coming back to: the stars incline but do not compel. The setup: I said astrology is pseudoscience, he said Kepler — the guy who worked out the orbits, who spent years casting horoscopes for emperors and nobles — believed in it, so it can't just be pseudoscience, and then a third person said right, and anyway it's the stars incline but do not compel, thats the serious version, it's not fatalism, it's more like a tendency or a disposition. I couldn't say what was bugging me about that but something was.

  What I want from you is a menu. Take that one sentence and lay out the precise claims it could be making, from the almost trivial to the quite strong, and give me a verdict on each: platitude, genuinely substantive and defensible, unfalsifiable hedge, or just false. Then say which reading the two guys in my chat were actually reaching for, and whether that reading gets them what they wanted (the first guy wants astrology to not be pseudoscience, the second wants it to not be fatalism).

  Press on three things while you're at it. First, what is an inclination supposed to be as a kind of cause — a cause at all, or a sign, or a probability-raiser, or a partial cause whose other parts nobody can name? Second, what work is compel doing — if everything that happens is caused anyway, does the slogan even say anything, or does it only earn its keep inside a picture where free will needs elbow room? Third, scope: the same phrase gets used for weather, crops and epidemics on one hand, and for someones personality and career on the other, and I suspect it quietly slides between those two.

  Last thing. I have a vague memory that Kepler thought the heavens stamp some kind of character on you at birth, something about the soul and the geometry of the rays, but that the horoscope-mongers predicting particular events were the quacks he was embarrassed by. If I've got that backwards, say so. And if that is the reading, tell me whether it's a claim that got falsified or one that was never testable in the first place.

  Keep it as a list of readings with verdicts. No reading list please, I'm offline this week and can't chase citations anyway.
