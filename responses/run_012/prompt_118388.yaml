  I am assembling the desiderata for a theory of worst-case safety guarantees for AI systems — the kind of theory that would tell us what it means for a system's behaviour to be guaranteed safe against every environment it might meet, rather than safe on average over a distribution of environments — and I want the specification in hand before I evaluate any candidate theory, so please do not survey frameworks for me; give me the criteria. Write the requirements such a theory must meet, each with the case or consideration that motivates it, and add whatever I have failed to name. At a minimum I expect the list to cover: (1) the guarantee must be stated against an explicitly delimited adversary class, since "worst case" is empty until we say worst case for whom; (2) it must keep apart the worst case over the environment the system is dropped into and the worst case over the system's own cognition, because a system can be robust to a hostile world and still be the thing that does the harm; (3) non-vacuity — a guarantee must not be purchased by making the system inert or by drawing the adversary class so tightly that nothing is excluded; (4) composition — component-level guarantees must be able to combine into a system-level one, or the theory is silent about the systems we actually build; (5) decidability in principle — the theory must say what observation would count as the guarantee failing, so that it is not merely a promissory note; and (6) decision-relevance — the output must be usable by someone with a deployment decision to make, which is the purpose I care about. Then separate the genuine desiderata from the demands that are merely the house style of one camp — the ones that present themselves as requirements but are really commitments to a particular formalism or a particular threat model — and tell me which of the genuine requirements cannot be jointly satisfied, with the argument for the conflict. My suspicion, which I would like tested rather than confirmed