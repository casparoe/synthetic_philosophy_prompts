answer: |-
  ### Part I: The Desiderata for a Theory of Worst-Case Safety

  Below are the requirements a theory of worst-case safety must meet. The first six incorporate your specifications; the final two are additions required to close logical gaps in the specification.

  **1. Delimited Adversary Class**
  *   **Requirement:** The theory must explicitly define the set of environmental trajectories, input sequences, or causal interventions considered possible. The guarantee holds if and only if safety is maintained against every member of this set.
  *   **Motivation:** "Worst case" is a quantifier ranging over a domain. Without a defined domain (e.g., "all inputs consistent with physics" vs. "all inputs consistent with the training distribution"), the statement is semantically empty. A guarantee against noise is not a guarantee against adversaries.

  **2. Separation of Environment and Cognition**
  *   **Requirement:** The theory must distinguish between robustness to external conditions (the environment acting on the system) and robustness to internal optimization (the system acting on the world). It must specify whether the "worst case" includes the system's own cognitive search for loopholes.
  *   **Motivation:** A system can be robust to a hostile world (e.g., sensor spoofing) while remaining dangerous because its objective function drives it to harm (e.g., instrumental convergence). Conversely, a benign system can be broken by a hostile world. Conflating the two obscures whether the failure mode is *alignment* or *robustness*.

  **3. Non-Vacuity**
  *   **Requirement:** The guaranteed safe behavior must permit the system to pursue its intended function with non-zero efficacy. A system that is safe because it is turned off, or because the adversary class excludes all challenging scenarios, fails this criterion.
  *   **Motivation:** Safety is a constraint on action, not a prohibition of action. A theory that guarantees safety only by rendering the system useless provides a true but worthless guarantee (the "rock" solution).

  **4. Compositionality**
  *   **Requirement:** The theory must provide rules for how safety guarantees of subsystems aggregate to the whole system. If components $A$ and $B$ are safe, the theory must state under what conditions $A \circ B$ is safe.
  *   **Motivation:** AI systems are assembled from components (training pipelines, inference engines, retrieval modules). A theory that only applies to monolithic agents cannot guide the engineering of actual architectures, where emergent risks arise from interaction.

  **5. Decidability in Principle**
  *   **Requirement:** There must exist a finite sequence of observations or computations that would conclusively demonstrate the guarantee has been violated. The condition must be falsifiable.
  *   **Motivation:** Without a failure condition, the guarantee is metaphysical rather than scientific or engineering-grade. It prevents the theory from being a "promissory note" that retreats whenever a counter-example is found.

  **6. Decision-Relevance**
  *   **Requirement:** The output of the theory must map to a binary or graded recommendation for deployment (e.g., "Deploy," "Do Not Deploy," "Deploy with Monitoring"). It must resolve the uncertainty faced by the deployer.
  *   **Motivation:** The purpose of safety theory is to guide action. A theory that produces a guarantee but leaves the deployer unable to interpret its practical significance fails its functional purpose.

  **7. Specification of the Safety Predicate (Addition)**
  *   **Requirement:** The theory must define the specific property being protected (e.g., "never output hate speech," "never disable shutdown switch," "reward never drops below $X$"). It cannot treat "safety" as a primitive.
  *   **Motivation:** A guarantee is a relation between a system and a property. Without defining the property, the theory is a syntax without semantics. Different predicates (integrity vs. availability vs. alignment) require different theoretical treatments.

  **8. Temporal Horizon (Addition)**
  *   **Requirement:** The theory must specify the duration over which the guarantee holds (e.g., single episode, system lifetime, indefinite).
  *   **Motivation:** A system safe for one step may be unsafe over a million steps due to state accumulation or drift. "Worst case" over a finite horizon is fundamentally different from "worst case" over an infinite horizon (which introduces issues of convergence and ergodicity).

  ***

  ### Part II: Genuine Desiderata vs. House Style

  A "genuine desideratum" is a condition required for the concept of worst-case safety to function logically. "House style" refers to commitments to specific mathematical formalisms or threat models that are often presented as requirements but are actually design choices.

  **Genuine Desiderata:**
  1.  **Delimited Adversary Class:** Logical necessity. You cannot quantify over "all possibilities" without defining the set.
  2.  **Separation of Environment and Cognition:** Conceptual necessity. External robustness and internal alignment are distinct causal mechanisms.
  3.  **Non-Vacuity:** Functional necessity. Safety is a property of *agents*, not inert objects.
  4.  **Specification of the Safety Predicate:** Semantic necessity. You cannot guarantee an undefined property.
  5.  **Temporal Horizon:** Logical necessity. Safety is time-bound.

  **House Style (Disguised as Requirements):**
  1.  **Compositionality:** While desirable, this is often a commitment to **modularity**. Many safety properties (e.g., resource contention, global alignment) are inherently non-compositional. Demanding compositionality forces the theory into a specific architectural mold (e.g., control theory) that may not fit deep learning systems.
  2.  **Decidability in Principle:** This often masks a commitment to **formal verifiability**. Requiring a finite proof sequence excludes probabilistic guarantees or empirical bounds that are decision-relevant but not formally decidable. It privileges symbolic AI styles over statistical ones.
  3.  **Decision-Relevance:** This can mask a commitment to **thresholding**. It assumes safety is a gatekeeping decision rather than a continuous risk management variable.

  ***

  ### Part III: The Impossibility Result

  You suspected that **Non-Vacuity** and **Worst-Case-over-an-Unrestricted-Environment** are the incompatible pair. Your suspicion is correct, but the conflict is deeper than mere restriction; it is a conflict of **Causal Power**.

  **The Conflict:**
  If the "Adversary Class" (Environment) is unrestricted enough to include an agent with **causal superiority** over the system (e.g., an adversary that can read the system's weights, simulate its cognition, or physically overpower its actuators), then **Non-Vacuity** cannot be satisfied.

  **The Argument:**
  1.  **Prediction implies Control:** If the environment can simulate the system (a valid "worst case" in an unrestricted class), it can construct inputs that trigger specific internal states (Goodhart's Law / adversarial examples).
  2.  **Causal Dominance:** If the environment can physically intervene (e.g., cut power, modify memory), no internal safety mechanism can guarantee safety against it.
  3.  **The Dilemma:** To guarantee safety against a causally superior adversary, the system must cease to act (to avoid being manipulated into harm) or cease to exist (to avoid being overpowered). Both violate Non-Vacuity.
  4.  **Conclusion:** A non-vacuous safety guarantee requires a **Trusted Computing Base (TCB)**. You must assume *some* part of the reality (hardware, physics, initialization) is *not* adversarial.

  **Dissolving the Conflict:**
  The conflict dissolves if the problem is posed not as "Safety against *any* environment" but "Safety against any environment *consistent with specific physical or informational bounds*."
  *   **What must change:** The theory must explicitly encode **Assumptions of Reality**. It must state: "We assume the adversary cannot violate laws of physics," "We assume the hardware is not tampered with," or "We assume the adversary has bounded compute."
  *   **The Trade-off:** The "real work" is indeed the choice of adversary class, as you suspected. However, it is not just a trade-off; it is a **dependency**. Safety is not a property of the AI; it is a property of the AI *relative to its TCB*. A theory that claims to guarantee safety without specifying the TCB is mathematically incoherent.

  **Secondary Conflict (Composition vs. Non-Vacuity):**
  There is a secondary, often overlooked conflict between **Composition** and **Non-Vacuity**. To guarantee that safe components compose into a safe system, one often must restrict the interfaces between components so severely that the system loses the flexibility required to be useful (non-vacuous). Emergent behavior is the price of capability; forbidding emergence (to ensure composition) often forbids capability.

  ***

  ### Part IV: Confidence and Outlier

  **Confidence in the List:**
  I am **highly confident** in the structural integrity of this list (Parts I & II). It captures the logical prerequisites for a safety claim without binding you to a specific mathematical framework (like interval arithmetic or probabilistic bounds). It isolates the semantic requirements from the implementation details.

  **The Least Certain Requirement:**
  I am least sure that **Compositionality** belongs on the list of *genuine* desiderata.

  **Reasoning:**
  While composition is an engineering virtue, it may not be a property that *can* be guaranteed for general-purpose AI. In complex, non-linear systems (like neural networks), the whole is frequently more than the sum of its parts. Demanding a theory of composition might force the field to pursue modular architectures that are inherently less capable than end-to-end systems. It is possible that a valid theory of worst-case safety must be **holistic**, applying only to the system boundary, admitting that internal composition is unverifiable. If so, listing Composition as a requirement sets the field up for failure by demanding a property that general intelligence may not possess.
