answer: |-
  **MEMORANDUM OF DECISION**

  **TO:** Board of Trustees
  **FROM:** Board Chair
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Staff Proposal Regarding Contribution Rate Reductions

  **DECISION**
  The Board hereby votes to **Adopt the Proposal with Modifications**. The policy implementing a 90-day waiting period and $75 fee for reducing contribution rates below an elected higher level is approved, contingent upon the establishment of a waiver process for documented hardship and significant life events.

  **RATIONALE**
  Staff data indicates a systematic pattern where employees voluntarily reduce contribution rates only to reverse that decision within twelve months. While the General Counsel correctly notes that a later, informed decision should typically hold equal weight to an earlier one, and one Trustee rightly warned against conflating a change of mind with a failure of will, the Board finds that a nuanced approach balances fiduciary efficiency with member autonomy.

  To act on this decision, staff must distinguish between three distinct cases regarding the waiting period and fee:

  1.  **Yielding to Present Pressure:** The employee believes the higher rate remains optimal but succumbs to short-term liquidity pressure or impulsivity.
      *   *Implication:* The waiting period and fee are **appropriate** here. They function as a "cooling-off" mechanism, protecting the employee's long-term interests against known behavioral biases without permanently barring the change.
  2.  **Genuine Value Change:** The employee's risk tolerance or retirement priorities have fundamentally shifted.
      *   *Implication:* The waiting period is **paternalistic** here. However, because internal values are unobservable, we cannot exempt this category entirely without opening loopholes. The waiting period remains, but the fee should be waivable upon attestation of changed financial planning goals.
  3.  **Changed Circumstances:** The employee faces external shocks (e.g., medical emergency, job loss in household).
      *   *Implication:* The fee is **punitive** and the waiting period is **harmful**. Penalizing financial hardship contradicts the system's mission. This category requires a full waiver of both fee and waiting period upon documentation.

  **ADDRESSING THE AUTONOMY OBJECTION**
  The General Counsel's objection rests on a strong principle of autonomy: the state should not assume it knows a member's interests better than the member does in real-time. The Board accepts this principle as the default. We are not dismissing the objection; we are carving out a limited exception based on evidence of systematic preference reversal.

  If reduction requests were scattered randomly, the justification for this policy would collapse. It would merely be administrative obstruction. However, because the data demonstrates a *systematic pattern* of reversal—suggesting hyperbolic discounting rather than rational updating—the Board finds a limited intervention justified. We are not relabeling a change of mind as a failure of will; we are acknowledging that some changes of mind are predictably regretted. Nevertheless, to respect autonomy, the barrier must not be absolute.

  **DIRECTIVES FOR IMPLEMENTATION**
  To resolve the legal and ethical concerns raised, staff is directed to modify the policy as follows:

  1.  **Hardship Waiver:** Establish a clear process to waive the $75 fee and 90-day waiting period for employees demonstrating qualified financial hardship (Case 3).
  2.  **Attestation Option:** Allow employees to waive the $75 fee by signing an attestation that the reduction reflects a deliberate long-term strategy change rather than short-term pressure (addressing Case 2).
  3.  **Default Application:** The fee and waiting period apply strictly to voluntary reductions without hardship or attestation (Case 1).

  This approach retains the staff's goal of reducing administrative churn and protecting members from impulsivity, while respecting the General Counsel's guidance on decisional authority and the Trustee's concern regarding member autonomy.

  **ACTION REQUIRED**
  Staff to return with revised policy language reflecting these waivers by the next meeting.

  **APPROVED BY:** Board of Trustees
