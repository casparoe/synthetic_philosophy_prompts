prompt: |-
  I write the little placards for a natural history museum -- the ones next to the specimens that say what a feature is "for". Visitors read them as settled fact, and once a label is printed we're stuck with it for years. My problem is the evolution-as-engineer framing: something looks built for a job, we write that it evolved to do that job, and then a consultant tells us we've overclaimed. I want a procedure my three writers can run on any "this evolved for X" claim before it goes to the printers, in about twenty minutes, with no access to the literature (so no citing papers -- they can't look anything up). Ground it in the adaptationism fight -- Gould and Lewontin on spandrels, exaptation, developmental and architectural constraint, drift -- but as steps a non-specialist can follow, not as a lecture. I need the questions in order, what counts as a good enough answer to each, where the procedure just stops and says "don't claim selection here", and where it has to hand off to a curator because the call is about values or about how much hedging a label can carry. Then run it on three labels: the male nipple; the giraffe's neck, which our marketing people adore as "evolved to reach the high leaves"; and a human-origins panel claiming we lost our body hair to stay cool while running. At least one of those should come out in a way the exhibits team won't like -- say which and why. And be honest about where the procedure will still let a just-so story through.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **Role:** Writer/Editor for a natural history museum (placards/labels).
      *   **Problem:** Overclaiming adaptationism ("evolved for X") leads to criticism from consultants (Gould/Lewontin style critiques). Labels are permanent, so accuracy/hedging is crucial.
      *   **Constraint:** Procedure must take ~20 minutes, require *no literature access* (rely on general knowledge/logic), be usable by three non-specialist writers.
      *   **Content:** Grounded in evolutionary theory critiques (spandrels, exaptation, constraint, drift) but operationalized as steps/questions.
      *   **Output:**
          1.  The Procedure (The "Adaptation Audit").
          2.  Application to three specific cases: Male nipples, Giraffe necks, Human hair loss/running.
          3.  Identification of which case the exhibits team won't like.
          4.  Honest assessment of where "just-so stories" might still slip through.

  2.  **Deconstruct the Theoretical Basis (Gould, Lewontin, etc.):**
      *   *Adaptationism:* The tendency to assume every trait is an optimal product of natural selection for a specific function.
      *   *Spandrels/Byproducts:* Traits that exist as necessary consequences of other traits (e.g., male nipples as a result of female developmental pathways).
      *   *Exaptation:* Traits evolved for one purpose (or no purpose) later co-opted for another (e.g., feathers for warmth, then flight).
      *   *Constraint:* Physical, developmental, or genetic limits that dictate form regardless of utility (e.g., surface area to volume ratio).
      *   *Drift:* Random changes in frequency, not driven by selection.
      *   *Plausibility vs. Evidence:* Just because a story makes sense doesn't mean it's true.

  3.  **Drafting the Procedure ("The Adaptation Audit"):**
      *   *Goal:* A checklist that forces the writer to pause and consider alternatives before committing to "evolved for."
      *   *Time Limit:* 20 minutes. Needs to be punchy.
      *   *No Literature:* Must rely on logic and known biological principles.
      *   *Structure:*
          *   Step 1: Function vs. Origin (The Exaptation Check).
          *   Step 2: The Byproduct Check (Spandrels/Constraint).
          *   Step 3: The Variation/Heritability Check (Drift/Constraint).
          *   Step 4: The Wording Decision (Hedging vs. Claiming).
          *   Step 5: The Curator Handoff (Values/Policy).
      *   *Stop Rules:* If a question fails, downgrade the claim.

      *(Self-Correction during drafting)*: Make sure the language is museum-friendly, not academic. Instead of "Is this a spandrel?" ask "Could this be a side effect?"

  4.  **Applying the Procedure to the Three Cases:**

      *   **Case 1: Male Nipples.**
          *   *Claim:* "Evolved for..." (Usually implied breastfeeding or sexual stimulation, but biologically tricky).
          *   *Audit:*
              *   Function now? Maybe sexual.
              *   Origin? Males and females share early embryonic development. Nipples form before sex differentiation.
              *   Constraint? Developmental constraint (it's cheaper to make nipples on everyone than to switch off the pathway for males).
              *   Selection? Unlikely selected *for* in males specifically.
              *   *Verdict:* Byproduct/Constraint. Do not say "evolved for."
          *   *Exhibits Reaction:* They might find it boring, but it's scientifically safe.

      *   **Case 2: Giraffe Neck.**
          *   *Claim:* "Evolved to reach high leaves" (The classic Lamarckian/Darwinian trope).
          *   *Audit:*
              *   Function now? Feeding.
              *   Alternative? Sexual selection (necking/combat). Thermoregulation?
              *   Constraint? Vascular pressure issues (need high BP).
              *   Evidence without lit? We know males fight with necks. We know they eat low too.
              *   *Verdict:* Plausible but contested. "High leaves" is the popular story, but "Necking" is a strong rival hypothesis.
              *   *Wording:* Needs hedging. "May help reach..." or "Used for feeding and fighting."
          *   *Exhibits Reaction:* Marketing loves the "high leaves" story. This will be the friction point.

      *   **Case 3: Human Hair Loss (Running/Cooling).**
          *   *Claim:* "Lost hair to stay cool while running" (Persistence Hunting hypothesis).
          *   *Audit:*
              *   Function now? Thermoregulation.
              *   Alternative? Parasite reduction? Sexual selection? Aquatic ape (fringe, but shows alternatives exist)?
              *   Constraint? Sweat glands co-evolved?
              *   Evidence without lit? We run well, but so do dogs (who have fur). We sweat a lot.
              *   *Verdict:* Plausible adaptation, but hard to prove over alternatives.
              *   *Wording:* "Likely helped..." rather than "Evolved to..."

  5.  **Refining the Output:**
      *   *Tone:* Professional, pragmatic, slightly weary of the "marketing vs. science" tension.
      *   *The "Disliked" Outcome:* The Giraffe label is the obvious candidate. Marketing wants the simple narrative; the audit suggests it's more complex or possibly about sex violence (necking).
      *   *The "Just-So" Leak:* Acknowledge that without literature, the procedure relies on the writer's intuition about plausibility. If a story sounds *very* logical, it might pass even if wrong.

  6.  **Final Review against Constraints:**
      *   20 minutes? Yes, the checklist is short.
      *   No literature? Yes, relies on logic/common knowledge.
      *   Grounded in Gould/Lewontin? Yes (Byproducts, Constraint, Alternatives).
      *   Curator Handoff? Included in the procedure.
      *   Three labels analyzed? Yes.
      *   Honest about limitations? Yes.

  7.  **Drafting the Content (incorporating the above thoughts):**
      *   *Intro:* Acknowledge the pressure.
      *   *The Protocol:* "The 20-Minute Adaptation Audit."
      *   *The Steps:* Clear Yes/No/Maybe logic.
      *   *The Test Run:* Apply to Nipples, Giraffe, Hair.
      *   *The Friction:* Highlight the Giraffe issue.
      *   *The Caveat:* Admit where the protocol fails.

      *(Self-Correction on Male Nipples)*: Be careful not to say they have *no* function. They can have erogenous function. But did they *evolve for* that in males? Probably not primarily. The label should reflect the developmental constraint.

      *(Self-Correction on Giraffe)*: The "high leaves" theory is actually currently out of favor compared to sexual selection in many circles, but the prompt says marketing adores it. The audit should flag the rival hypothesis.

      *(Self-Correction on Hair)*: The "running" hypothesis is specific (persistence hunting). The audit should question if running was the *driver* or if hair loss allowed running.

  8.  **Final Polish:** Ensure the distinction between "Function now" and "Reason for origin" is clear (Exaptation). Ensure the "Stop Rule" is clear.

      *(Final check on the "Disliked" label)*: The prompt asks for "At least one of those should come out in a way the exhibits team won't like." The Giraffe one is the strongest candidate because it directly contradicts a specific marketing preference ("high leaves"). The Nipple one is just obscure. The Hair one is popular enough. I will focus the friction on the Giraffe.

      *(Final check on "Just-So Story")*: I need to explicitly state that if a writer *thinks* an alternative is unlikely, the story passes, even if the writer is wrong. This is the inherent risk of no literature search.

      *Let's write it.*
answer: |-
  # The 20-Minute Adaptation Audit
  **For:** Exhibit Writers  
  **Goal:** Prevent "Just-So" stories on permanent labels.  
  **Constraint:** No literature search. Rely on logic, general biological principles, and known alternatives.

  ### The Procedure
  Run these five questions in order. If you answer **NO** to any "Stop" question, you cannot write "Evolved for." You must downgrade the claim (see Step 5).

  **1. The Timing Check (Exaptation)**
  *   **Question:** Does the trait exist *before* the proposed benefit appears in the fossil record or developmental timeline? (e.g., Did feathers exist before flight?)
  *   **Logic:** If the trait existed for a different reason first, it is an *exaptation*, not an adaptation for the current use.
  *   **Stop Rule:** If **YES**, you cannot say "Evolved for [current use]." You must say "Originally for X, later used for Y" or "Co-opted for Y."

  **2. The Side-Effect Check (Spandrels/Constraint)**
  *   **Question:** Could this trait be a necessary byproduct of building something else? (e.g., Male nipples are a byproduct of the female developmental blueprint; blood redness is a byproduct of hemoglobin chemistry).
  *   **Logic:** If the trait is "free" (costs nothing to produce) or architecturally inevitable, selection likely didn't shape it specifically.
  *   **Stop Rule:** If **YES**, do not claim selection. Use "Result of..." or "Consequence of..."

  **3. The Rival Hypothesis Check (Pluralism)**
  *   **Question:** Can you think of *one* other plausible reason this trait exists without looking anything up? (e.g., Giraffe necks: feeding vs. fighting; Bright colors: camouflage vs. mating).
  *   **Logic:** If a rival hypothesis exists, the "single purpose" story is unproven.
  *   **Stop Rule:** If **YES** (you can think of a rival), you cannot use definitive language ("Evolved to"). You must use hedging ("May have," "Likely," "One theory is").

  **4. The Cost Check (Selection Pressure)**
  *   **Question:** Is the trait expensive to build or maintain? (e.g., A peacock's tail is costly; a fingerprint ridge is cheap).
  *   **Logic:** Natural selection acts strongly on costly traits. Cheap traits often drift or are constrained.
  *   **Stop Rule:** If **NO** (it's cheap/free), be very careful. Drift or constraint is more likely than specific adaptation.

  **5. The Wording Decision**
  *   **Pass:** All Stop Rules cleared. -> *Allowed:* "Evolved to..."
  *   **Partial Fail:** Rival hypotheses exist. -> *Allowed:* "Likely helped..." or "Adapted for..."
  *   **Hard Fail:** Byproduct or Exaptation. -> *Allowed:* "Functions as..." or "Result of..."
  *   **Curator Handoff:** If the "safe" wording makes the exhibit sound boring or undermines a core narrative theme (e.g., "Human Excellence"), send to Curator. This is a values call, not science.

  ---

  ### Test Run: Three Labels

  #### 1. The Male Nipple
  *   **Draft Claim:** "Male nipples are vestigial remnants evolved for sexual stimulation."
  *   **Audit:**
      *   **Timing:** Nipples form in embryos before sex differentiation. **Stop.** (They exist before the "male" context).
      *   **Side-Effect:** Is it cheaper to make nipples on everyone than to build a genetic switch to stop them in males? Yes. Developmental constraint. **Stop.**
      *   **Cost:** Low metabolic cost.
  *   **Verdict:** **Hard Fail.** This is a classic spandrel/byproduct.
  *   **Required Wording:** "Nipples form in all embryos before sex is determined. In males, they are a result of this shared developmental blueprint."
  *   **Exhibits Reaction:** *Neutral.* It's a small label. Science is clear. No fight here.

  #### 2. The Giraffe's Neck
  *   **Draft Claim:** "The giraffe's neck evolved to reach high leaves other herbivores can't touch." (Marketing Favorite)
  *   **Audit:**
      *   **Timing:** Necks elongated over millions of years. Plausible.
      *   **Side-Effect:** Is it a byproduct of long legs? Maybe, but likely selected.
      *   **Rival Hypothesis:** Can you think of another reason? Yes. Males fight by swinging necks ("necking"). Longer necks = more force = more mates. Also, they often feed at shoulder height, not just high up. **Stop.**
      *   **Cost:** High. Requires massive blood pressure pumps. Selection is definitely involved, but *for what?*
  *   **Verdict:** **Partial Fail.** The "high leaves" story is contested by the "sexual combat" story.
  *   **Required Wording:** "The long neck allows giraffes to browse high canopy, but also serves as a weapon in male combat for mates. Scientists debate which pressure drove its length."
  *   **Exhibits Reaction:** **Hostile.** Marketing wants the simple "reaching high" narrative. It's iconic. Adding "male combat" complicates the family-friendly vibe, and admitting "scientists debate" makes the museum look unsure. This will require a Curator Handoff to decide if we prioritize narrative simplicity or scientific nuance.

  #### 3. Human Hair Loss (Persistence Hunting)
  *   **Draft Claim:** "Humans lost body hair to stay cool while running down prey."
  *   **Audit:**
      *   **Timing:** Hair loss coincides with endurance running capabilities. Plausible.
      *   **Side-Effect:** Is it a byproduct of aquatic life? (Fringe, but exists). Is it a byproduct of parasite reduction? Plausible.
      *   **Rival Hypothesis:** Can you think of another reason? Yes. Parasite reduction (fewer ticks/lice). Sexual selection (smooth skin signals health). **Stop.**
      *   **Cost:** High. We need sweat glands and UV protection (skin pigment) to compensate. Selection is involved.
  *   **Verdict:** **Partial Fail.** Strong adaptation case, but rival hypotheses exist.
  *   **Required Wording:** "Losing body hair likely helped early humans dissipate heat during endurance activities, though parasite reduction may also have played a role."
  *   **Exhibits Reaction:** *Acceptable.* "Likely helped" is strong enough for visitors. It keeps the "we are runners" narrative intact without overclaiming.

  ---

  ### The Friction Point
  **The Giraffe Label.**
  The exhibits team will push back hardest here. The "High Leaves" story is a staple of natural history iconography. It implies a peaceful, resource-based evolution. The Audit forces you to introduce sexual violence ("combat for mates") and uncertainty ("scientists debate").
  *   **Why they won't like it:** It dilutes the brand. Visitors want to know *what it is*, not *what we argue about*.
  *   **The Curator Call:** The Curator must decide if the museum's value is "Settled Knowledge" (even if slightly wrong) or "Process of Science" (messy but accurate). The Audit forces this conversation before printing, saving you from the consultant's critique later.

  ### Where the Procedure Fails (The "Just-So" Leak)
  Be honest: This procedure relies on **your** ability to think of rival hypotheses in 20 minutes without Google.
  *   **The Leak:** If a story is *very* intuitive (like the giraffe reaching leaves), you might fail to generate a rival hypothesis during Step 3. You might think, "No, it's obviously for leaves," and pass the claim.
  *   **The Risk:** The Audit stops *obvious* errors (like male nipples), but it cannot stop *plausible* errors. If the scientific consensus has shifted recently (e.g., new papers on giraffe feeding heights published last year), you won't know.
  *   **Mitigation:** This is why the Curator Handoff exists. If a claim feels "too perfect" or "too story-like," flag it for expert review even if the Audit says "Pass." The Audit is a filter, not a guarantee.
