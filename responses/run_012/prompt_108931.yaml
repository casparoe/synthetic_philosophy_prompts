answer: |-
  Here is the specification list for a theory of diachronic rationality.

  ### 1. The Canonical Cases (Non-Negotiable Verdicts)

  **The Money Pump**
  *   **The Case:** An agent cycles through preferences (A > B, B > C, C > A), paying a fee to switch each time, ending with less money and the same asset they started with.
  *   **Required Verdict:** The agent is irrational.
  *   **Why:** It is a dominated strategy. Ending up strictly worse off (less money, same good) by virtue of one's own choices is the definition of instrumental failure. A theory that calls this rational is dead on arrival.

  **The Self-Torturer (Quinn)**
  *   **The Case:** An agent can increment a dial by one imperceptible notch for $10k each time, but at the far end lies agonizing pain. Each single step is locally preferable (money up, pain indistinguishable), but the final state is worse than the start.
  *   **Required Verdict:** It is rational to stop (or precommit to stop) before the end, even if the current step looks costless.
  *   **Why:** To avoid the "sorites of ruin." If rationality is only about the local step, the agent is forced into misery. A theory must allow the agent to treat the sequence as a single object of evaluation, not just a series of atomic moments.

  **The Smoker (Ainslie/Precommitment)**
  *   **The Case:** An agent prefers quitting long-term but prefers smoking right now. They know their future self will also prefer smoking then. They burn money to make smoking impossible later.
  *   **Required Verdict:** The precommitment is rational; the future self's desire to undo it is irrational (or at least overridable).
  *   **Why:** Weakness of will is real. If a theory says you must always satisfy the preferences of the *current* time-slice, precommitment becomes irrational self-sabotage. A theory must validate the authority of the longer-term plan over the local impulse.

  ### 2. The Custom Stress Tests

  **The Churner**
  *   **The Case:** An agent flips between Option A and Option B forever. At every moment, they prefer the *other* option just enough to pay a switching fee. They never regret the past choice at the moment of making it (preferences flip with the choice).
  *   **Required Verdict:** Irrational.
  *   **Why:** This tests **Synchronic Sovereignty**. The Churner is locally consistent at every slice but globally catastrophic.
  *   **Is it a genuine requirement?** Yes. If a theory says the Churner is rational because every slice is satisfied, that theory has no grip on the concept of a "life" or an "agent." It reduces the person to a series of strangers passing a wallet.

  **The Escalator**
  *   **The Case:** An agent's tastes drift to match whatever they currently hold (extreme endowment effect). A pump exploits this: gives them X, they prefer Y, pay to switch, tastes drift to prefer Y, prefer Z, pay to switch. They lose money but claim to be happier at every step because their preferences adapted to the new status quo.
  *   **Required Verdict:** Irrational, even if subjective welfare reports are high.
  *   **Why:** This tests **Adaptive Preference**. You asked if separating "lost money" from "irrational" is fair. It is not just fair; it is necessary. If welfare is defined by preference satisfaction, the Escalator wins. But if rationality requires *stable* grounds for preference, the Escalator is being manipulated by their own plasticity.
  *   **Is it a genuine requirement?** Yes, but it forces the theory to admit that not all preference satisfactions count equally. It kills pure welfarist accounts of rationality. You cannot say "they got what they wanted" if what they want is determined by the pump.

  ### 3. The Distinctions (No Collapsing Allowed)

  **Synchronic vs. Diachronic**
  *   **Requirement:** The theory must allow that a choice can be synchronically rational (fits current beliefs/desires) but diachronically irrational (undermines future goals).
  *   **Cost:** You lose the simplicity of a single utility function. You need two evaluative layers.

  **Preference vs. Choice vs. Plan**
  *   **Requirement:** Preferences are inputs; Choices are actions; Plans are constraints on future choices. A theory must explain why a Plan can veto a Preference without being "irrational."
  *   **Cost:** You need a mechanism for how plans bind. Is it normative force? Psychological commitment?

  **Person vs. Time-Slice**
  *   **Requirement:** The theory must specify who the "agent" is. Is it the series (Person) or the moment (Slice)?
  *   **Cost:** If it's the Slice, you can't condemn the Money Pump (each slice maximizes). If it's the Person, you risk tyranny of the past over the present.

  **Backward vs. Forward Reach**
  *   **Requirement:**
      *   *Backward:* Can the present self condemn the past self? (Regret).
      *   *Forward:* Can the past self bind the present self? (Resolution).
  *   **The Tension:** You cannot have full Backward and full Forward reach without paradox. If the past binds the present, the present isn't sovereign. If the present is sovereign, the past has no authority.
  *   **Verdict:** A theory needs *asymmetric* reach. It must allow Forward reach (plans) to block local preferences, but allow Backward reach (regret) only when the plan itself was flawed or circumstances changed. If it demands both equally, it creates a stalemate where no action is permissible.

  ### 4. The Hidden Premise of the Pump

  **The "Meta-Preference" Requirement**
  *   **Requirement:** The Money Pump argument secretly relies on the agent having a higher-order preference: "I prefer not to be the kind of agent who loses money for no reason."
  *   **Analysis:** If the agent doesn't care about consistency or wealth retention, the pump isn't a pump; it's just a spending spree on switching fees.
  *   **Verdict:** Genuine. The normativity of the money pump does not come from logic alone; it comes from the agent's commitment to their own efficacy. A theory must account for where this commitment comes from. If it's just another preference, it can be outweighed. If it's a constitutive norm of agency, it's binding. The theory must pick one.

  ### 5. Consistency Constraints (The "Growth" Clause)

  **Learning and Value Change**
  *   **Requirement:** The theory must distinguish between *irrational inconsistency* and *rational growth*. Changing your mind because you learned new facts or matured is not a pump.
  *   **Why:** Otherwise, all learning is irrational.
  *   **Constraint:** The theory needs a "relevant change" filter. Preferences can change if the *world* changes or the *self* legitimately evolves, but not if the change is induced by the choice architecture itself (see: Escalator).

  **Resolution vs. Stubbornness**
  *   **Requirement:** It must be rational to stick to a plan *and* rational to abandon one.
  *   **Why:** Sticking to a bad plan is dogmatism; abandoning a good plan is weakness.
  *   **Constraint:** The theory needs a criterion for when a plan loses authority. (Usually: when the underlying reasons for the plan vanish).

  ### 6. The Incompatible Pairs (The Trade-Offs)

  Here is where the three camps (Consistency, Current-Preference, Planning) will bleed. You cannot satisfy all of these simultaneously.

  **Pair A: Synchronic Sovereignty vs. Diachronic Coherence**
  *   **Conflict:** If every time-slice is sovereign (Current-Preference View), the Churner and Money Pump agent are rational. If Diachronic Coherence is required (Consistency View), the time-slice is not sovereign.
  *   **Verdict:** You must sacrifice Synchronic Sovereignty. The Churner case proves that local optimization does not equal global rationality.

  **Pair B: The Authority of the Past vs. The Sovereignty of the Present**
  *   **Conflict:** If the Past Self can bind the Present Self (Planning View), the Present Self is not fully rational if they disobey, even if their current preferences demand it. If the Present Self is sovereign, the Past Self has no authority.
  *   **Verdict:** You must sacrifice full Sovereignty of the Present. The Smoker case proves that sometimes the "now" self is the irrational one.

  **Pair C: Preference Satisfaction vs. Structural Integrity**
  *   **Conflict:** The Escalator satisfies preferences (they adapt and feel good) but lacks structural integrity (they are exploitable).
  *   **Verdict:** You must sacrifice Pure Preference Satisfaction. Rationality must track something more stable than occurrent desire.

  ### 7. The Killer Requirement

  **The "Dominated Strategy" Constraint**
  *   **The Requirement:** A theory must condemn any sequence of choices that leaves the agent strictly worse off by their *own initial lights*, regardless of how their preferences shift during the process.
  *   **Why it kills candidates:**
      *   **Kills the Current-Preference View:** It cannot condemn the Churner or the Money Pump, because at every step, the agent is maximizing current utility. It has no vantage point to see the loss.
      *   **Challenges the Consistency View:** It must explain *why* consistency matters without just stipulating it. If I prefer A then B, and later prefer B then A, why is that bad? Only if it leads to a Dominated Strategy. Consistency is instrumental, not intrinsic.
      *   **Challenges the Planning View:** It must explain why we shouldn't stick to plans that turn out to be dominated due to unforeseen value changes.
  *   **The Adjudicator:** This is the single requirement that does the most work.
      *   If the theory cannot identify a **Dominated Strategy** across time without relying on a "God's eye view" of utility that the agent doesn't possess, it fails.
      *   **Winner:** The **Planning/Self-Governance View** is the only one that survives this *if* it frames plans as tools to avoid dominated strategies. The Consistency view is too rigid (forbids growth); the Current-Preference view is too porous (allows pumps). The Planning view wins *only if* it can explain why the earlier self's plan has normative weight over the later self's desire.

  **Summary for the Seminar:**
  Don't ask "Which theory is consistent?" Ask "Which theory can condemn the Churner without condemning the Learner?" That is the narrow gate. The Current-Preference view fails the Churner. The strong Consistency view fails the Learner. The Planning view sits in the middle, but its cost is accepting that the present self is sometimes bound by a past self it no longer identifies with. That is the bullet they have to bite.
