answer: |-
  This is a remarkably lucid description of a stalemate that has plagued philosophy of language for decades. You are not failing to make progress because you are missing a clever argument; you are stalled because you have reached the bedrock of competing theoretical virtues.

  Here is a diagnosis of the disagreement, an analysis of the costs of conversion, and a suggestion for what actual progress might look like.

  ### 1. The Diagnosis: A Metasemantic Clash Disguised as Semantics

  You suspect you are fighting over whether meaning is fixed by use. I suggest the disagreement is deeper: it is about **what kind of object a language is** and **what logic is for.**

  **The Equivocation on "Fact of the Matter"**
  You and your friend are using "fact" to do different work.
  *   **For you (Epistemicist):** A "fact" is a model-theoretic mapping. If the language is a function from worlds to extensions, and the world is determinate, the extension must be determinate. The "fact" exists in the structure of the language-world relation, regardless of access.
  *   **For her (Supervaluationist):** A "fact" is a status within the practice of assertion. If a proposition cannot be asserted as true or false without violating semantic norms (because it varies across precisifications), then there is no fact.

  When you say "there is a fact," you mean "the extension is a set with sharp boundaries." When she says "there is no fact," she means "the semantic value is not a classical truth value." You are talking past each other because one of you is describing the **architecture** of meaning, and the other is describing the **norms** of usage.

  **The Logic vs. Phenomenology Trade-off**
  This is the engine of the stalemate.
  *   **Your virtue:** Preservation of Classical Logic. You keep the Law of Excluded Middle ($P \lor \neg P$) and Bivalence intact. You save the logic, but you sacrifice the phenomenology (the intuition that there is no boundary).
  *   **Her virtue:** Preservation of Semantic Intuitions. She saves the intuition that borderline cases are distinct from clear cases. She saves the phenomenology, but she sacrifices the link between truth and disjunction (a disjunction can be true while neither disjunct is).

  The classifier experiment failed to break this because it addressed the architecture (it produced a boundary) but ignored the norms (the classifier cannot explain *why* we hesitate to use that boundary). You saw the boundary as confirmation of reality; she saw the lack of hesitation in the machine as proof it isn't doing what *we* do. You are both right about the tool, but you disagree on whether language is more like the tool or more like the hesitation.

  ### 2. What Would Each of You Have to Give Up?

  To move, one of you must concede a core theoretical virtue.

  **For you to accept Supervaluationism:**
  You must give up the idea that **truth is robustly representational.** You have to accept that a sentence can be "true" (super-true) without there being a specific state of affairs that makes it true in the classical sense. More painfully, you must accept that logic is not a description of how the world is carved, but a tool for managing semantic indecision. You would have to concede that the Law of Excluded Middle is a useful rule for inference but not a metaphysical guarantee of a boundary.

  **For her to accept Epistemicism:**
  She must give up the **Transparency of Meaning.** She has to accept that speakers can be constitutively ignorant of the meanings of their own words *in principle*, not just in practice. This is a hard pill: it implies that the rules of our language are hidden from us more deeply than the laws of physics. She must also accept that "admissible precisifications" (her core mechanism) is itself a vague term, leading to the regress you identified (higher-order vagueness). To become an epistemicist, she must admit that the set of admissible sharpenings has a sharp boundary she cannot define.

  **The Linguist's Position:**
  She is likely diagnosing this as a **choice of framework** rather than a discovery of truth. If she is right, the "progress" you seek is impossible because there is no fact of the matter about which theory is correct—only which is more useful for a specific purpose (e.g., formal logic vs. cognitive modeling).

  ### 3. What Would Count as Progress?

  Since standard intuition pumps and objections are inert, progress requires shifting the ground. Here are three specific avenues:

  **A. The Formal Expressibility Test (The "Own Language" Challenge)**
  You mentioned this, but it needs to be formalized.
  *   **Task:** Can Supervaluationism define "admissible precisification" within its own object language without generating a new sorites series?
  *   **Progress Condition:** If she can formally define the boundary between admissible and inadmissible sharpenings without invoking a higher-order vague term, she defeats your "relocation of the problem" objection. If she cannot (which is the standard result), you have a formal proof that Supervaluationism collapses into Epistemicism at the meta-level. This forces her to admit there *is* a sharp boundary somewhere (between admissible and inadmissible), even if she refuses to call it a boundary for "heap."

  **B. The Margin for Error Derivation**
  *   **Task:** Can Epistemicism derive the *appearance* of vagueness from non-semantic facts?
  *   **Progress Condition:** You need to show that the "unknowable boundary" is not just a brute posit but a necessary consequence of how information is processed. Timothy Williamson argues that knowledge requires a margin for error (if you know $n$ is a heap, $n-1$ must also be a heap, otherwise your belief is too fragile). If you can formalize this such that the "sharp boundary" emerges necessarily from the constraints on knowledge rather than being an arbitrary semantic fact, you make the arbitrariness objection less biting. It stops being "arbitrary" and starts being "structurally necessary but inaccessible."

  **C. The Pragmatic Turn (The Linguist's Veto)**
  *   **Task:** Stop asking "What is the truth condition?" and ask "What is the communicative function?"
  *   **Progress Condition:** You might find that Epistemicism is the right theory for **metaphysics** (how the world/language interface works) while Supervaluationism is the right theory for **assertibility** (what we are licensed to say).
  *   **Progress:** You agree to disagree on the metaphysics but adopt a pluralist semantics. You admit that for the purposes of *logic*, bivalence holds (your win). She admits that for the purposes of *communication*, truth-value gaps model our behavior better (her win). This dissolves the fight by assigning domains of applicability.

  ### Recommendation

  The stall is real because you are both defending **incompatible ideals of rationality**. You prioritize logical consistency; she prioritizes semantic fidelity to usage.

  **The most productive next step:**
  Stop debating the heap. Debate the **meta-language**.
  Ask her to write down the definition of "admissible sharpening" without using vague terms. Ask yourself to write down the mechanism by which dispositions fix a unique extension without invoking magic.

  If you both fail (which is likely), you have a shared result: **Vagueness is inexpressible in classical terms.** That is a form of progress. It suggests the Linguist is right that the dispute is verbal, but for a deeper reason: our classical logical tools are insufficient to capture the phenomenon, regardless of which theory we pick.

  Don't look for a verdict. Look for a **limitative theorem**. If you can prove that no theory of vagueness can be both classically consistent and phenomenologically accurate within its own language, you haven't solved vagueness, but you will have solved *why you are stuck*. And that is enough for a reading group.
