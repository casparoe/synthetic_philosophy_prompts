answer: |-
  I am preparing a workshop for graduate students in epistemology and philosophy of language, and I want to force them to see that the question 'what is the norm of assertion?' is really a cluster of separable questions about the act, its content, its social function, and its diachronic obligations. Please construct a diagnostic decision tree, or a taxonomy in the form of one, that takes someone from the thin starting commitment that assertions are governed by some norm to a named position about what that norm is. Every internal node should be a question about a concrete case or a forced choice that a person can answer without already knowing which position it leads to, so that the instrument sorts people by what they say about cases rather than by which label they favour. Aim for eight to twelve branch questions and no more than twelve leaves. The tree must include, as leaves, at least the knowledge norm, the truth norm, the belief norm, a justified-belief or warrant norm, an evidence-responsiveness norm, a sincerity or truthfulness norm, an acceptance-based or common-ground view on which assertion is a proposal to update the conversation, a pluralist or context-sensitive view, a diachronic or retraction-based view, and normative quietism, according to which there is no constitutive norm of assertion at all. Each leaf should carry the name of the position, or 'unnamed' if nobody defends it, and one sentence identifying its most awkward commitment.

  Build the tree from the logical space rather than from a list of names. At a minimum, make the branching structure separate the following distinctions: whether the norm governs the act of asserting or the content asserted; whether it is a necessary condition on permissible assertion or a pro tanto reason that can be outweighed; whether it is monistic or pluralistic; whether it is synchronic or diachronic, that is, whether it governs the initial assertion or the later obligation to defend, retract, or revise; whether it is context-invariant or varies with practical stakes, audience, or topic; whether it is constitutive of assertion or merely regulative; and whether it applies first-personally, as a constraint on what I may assert, or third-personally, as a constraint on what I may criticise or challenge in others. Use concrete cases as the branch questions, including at least: a lottery-style case in which one asserts that one's ticket will not win; a case in which one asserts what one justifiably but falsely believes; a case in which one asserts a truth one believes but does not know; a case in which one asserts something one knows but cannot defend to one's audience; a moral assertion made in a context of deep disagreement; a high-stakes assertion where being wrong would be costly; a self-ascription of knowledge; an assertion made on behalf of a group; a hedged prediction; and a response to a challenge in which one is asked to retract. Where the logical space allows a combination of answers that no named position occupies, say so explicitly and diagnose briefly whether the view is incoherent, unattractive, or merely unexplored.

  The output should be a decision tree or flowchart in prose, with each branch labelled by the question that separates it from its siblings, followed by a scoring key if the tree is also to be used as a quiz. Flag any pair of leaves that the tree cannot separate, rather than papering over the gap, and explain what further question would be needed to separate them. Do not include bibliographies, reading lists, or citations: I want the logical space and the diagnostic cases, not the literature. Please write the whole answer in British English.
