          *   *Severity 2 (High):* (4) Birth Lottery vs. (2)/(6) State Legitimacy. If borders are arbitrary, the "people" are arbitrary.
          *   *Severity 3 (Moderate):* (5) Disruption vs. (1) Free Movement. Entry vs. Stay distinction.
