      *   (5) *Disruption Harm:* Wrongness of exclusion is about derailing plans/lives underway. Claim strength scales with existing ties.
      *   (6) *Right to Exclude:* Belongs to "the community/people," not gov or current citizens as owners.
      *   (7) *Anti-Culture:* Culture/way of life doesn't outweigh interest in moving/building life.
