  6.  **Developing Repairs/Revisions:**

      *   *Problem:* (3) is the wrecking ball. It threatens to turn the view into Open Borders Anarchism (which contradicts 2).
      *   *Repair:* Modify (3). Distinguish between "affected interests" and "membership interests." Or, limit (3) to *coercive* authority over those already subject to it, rather than those seeking entry. (The "All-Subjected Principle" vs "All-Affected").
