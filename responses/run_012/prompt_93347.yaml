      *   **Clash 3: Anti-Culture (7) vs. Community Say (2)/(6).**
          *   *Why:* If the community has a "genuine say" (2) over who joins, what are they allowed to say it about? If "culture/way of life" (7) is ruled out as a valid reason, what reasons remain? Security? Economic capacity? If the list of valid reasons is too short, the "genuine say" becomes illusory.
          *   *Severity:* **Medium-High.** It risks emptying (2) of content.

      *   **Clash 4: Birth Lottery (4) vs. Community Say (2)/(6).**
          *   *Why:* If borders aren't morally magic (4), why does the "community" (defined by borders) have *any* right to exclude (6)? If the line is arbitrary, the group on one side has no special standing to veto the group on the other.
          *   *Severity:* **High.** This is the classic "Open Borders vs. State Sovereignty" tension.

  5.  **Ranking the Clashes:**

      1.  **The All-Affected vs. Exclusion Right (3 vs. 6):** This is the deepest philosophical hole. If migrants are affected, they are part of the "demos." If they are part of the demos, they vote on their own admission. Exclusion becomes self-refuting.
      2.  **Birth Lottery vs. Community Say (4 vs. 2/6):** If borders are arbitrary, the "community" is an arbitrary grouping. Why do *they* decide?
