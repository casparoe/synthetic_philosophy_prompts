      *   **The Single Revision:** Refine the "Burden of Proof" in (1) to align with (5).
      *   **Conclusion:** Summary of the coherent position.

  8.  **Refining the Analysis (Self-Correction during drafting):**
      *   *Wait, is (3) really the biggest problem?* Yes, in political philosophy, the "All-Affected Principle" is notorious for dissolving borders. If I am affected by your immigration policy, I should vote on it. If I can vote on it, I can vote myself in. Exclusion vanishes.
      *   *Is (5) actually a conflict with (1)?* (1) says presumption for crossing. (5) says claim strength depends on life built. A new mover has a weak claim under (5) but a strong presumption under (1). This is a tension. (1) implies a right to *start* a life. (5) implies a right to *continue* a life. Need to distinguish Entry vs. Residence.
      *   *What about (7)?* If culture can't outweigh interests, and property isn't fundamental, and birth is arbitrary... what *can* the community exclude for? Capacity? Security? If the list is too short, (2) is dead. This links to the (3) problem.

  9.  **Final Polish:** Ensure the tone is helpful for a seminar paper. Use philosophical terminology (Boundary Problem, All-Subjected Principle) but keep it accessible. Make sure the ranking is clear.

      *(Self-Correction on the "Single Revision"):* The prompt asks for *one* revision that cleans up the most. Tweaking (3) is the deepest fix. But tweaking (1) to be more specific about *entry* vs *residence* might be more practical for the paper. Actually, fixing (3) solves the legitimacy contradiction. Let's recommend modifying (3).

