      *   *Best Single Revision:* Tweak (3). The All-Affected Principle is too broad for a statist view. Switching to "All-Subjected" (those currently under the law) preserves the community's right to decide on *new* members while maintaining legitimacy for current governance.

  7.  **Drafting the Response:**

      *   **Introduction:** Acknowledge the sophistication of the view. It's a "Moderate Open Borders" or "Freedom of Movement with State Legitimacy" view.
