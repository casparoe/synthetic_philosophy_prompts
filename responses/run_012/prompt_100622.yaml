answer: |-
  Here is a definite design for your session. It is tight, high-energy, and engineered to make the "invisible losers" point land physically, not just theoretically.

  # Session Title: "The Allocation Game"
  **Time:** 50 Minutes
  **Players:** 18 Students
  **Core Mechanic:** Scarcity + Fixed Price = Non-Price Rationing.

  ## 1. The Definite Calls (Why I designed it this way)
  *   **Split:** 6 "Owners" (Landlords/Employers) and 12 "Citizens" (Tenants/Workers).
      *   *Why:* You need a guaranteed shortage. If you have 10 and 10, the market might clear. With 6 resources and 12 people, 6 people *must* lose.
  *   **Currency:** Printed "Credits" (fake money).
      *   *Why:* Real money is illegal/impractical. Credits allow you to control wealth inequality quickly.
  *   **The "Silent Loser" Rule:** If a Citizen fails to secure a flat or job in the Controlled rounds, they are **barred from speaking** during the policy evaluation until the final reveal.
      *   *Why:* This replicates your key insight: the people who lose out under price controls often don't have a voice in the political debate because they are excluded from the market entirely.
  *   **Min Wage Mechanic:** Employers have a fixed budget. High wage = fewer total hours available to split.
      *   *Why:* This forces the "hours cut" outcome rather than simple unemployment.

  ## 2. Materials to Print/Prepare
  1.  **Credits:** 200 slips of paper marked "£100". (Give Citizens varying amounts, e.g., some have £500, some £900).
  2.  **Role Cards:**
      *   **6 Owner Cards:** "You own 1 Flat / 1 Business. You want to maximize profit/prestige."
      *   **12 Citizen Cards:** "You need 1 Flat / 1 Job to survive. You have [X] Credits."
  3.  **Property/Job Cards:** 6 Cards marked "Standard Flat" or "Standard Job".
  4.  **Secret Preference Slips (For Owners):** 6 slips, each with a hidden condition (e.g., "Must pay £50 'Key Money' under table," "Must be a friend," "Must agree to no repairs," "Pick the quietest student").
  5.  **A "Gavel"** (or just a heavy pen) for you to control chaos.

  ## 3. Run-of-Show (50 Minutes)

  ### 0:00 – 0:05: Setup & Roles
  *   Hand out roles randomly. 6 Owners sit at the front (or one side). 12 Citizens sit opposite.
  *   Hand out Credits. Give Citizens *unequal* wealth (e.g., 4 students get £1000, 8 students get £600).
  *   **Rule:** "Your goal is to maximize your score. Citizens need a resource to score. Owners want Credits + to keep their resource."
  *   **Do not explain economics.** Just say: "We are simulating a city. Go."

  ### 0:05 – 0:15: Round 1 (Housing – Free Market)
  *   **Scenario:** 6 Flats, 12 Tenants. No rent control.
  *   **Action:** Owners set rent. Tenants bid.
  *   **Outcome:** Rent will rise until the 8 poorest tenants drop out. 6 Tenants get flats. 8 go homeless.
  *   **Stop:** After 5 mins. Record the Rent Price and who got flats.
  *   **Reset:** Everyone keeps their money.

  ### 0:15 – 0:30: Round 2 (Housing – Rent Control)
  *   **Intervention:** Announce: "The Council has capped Rent at £300 (below the Round 1 equilibrium)."
  *   **Constraint:** Owners *cannot* charge more than £300.
  *   **The Twist:** Hand Owners the **Secret Preference Slips**. They must allocate the 6 flats based on that slip, not price.
  *   **Action:** Tenants apply. Owners choose.
  *   **The Silence Rule:** The 6 Citizens who *fail* to get a flat must move their chairs to the back of the room. They are **not allowed to speak** for the rest of the game.
  *   **Stop:** After 10 mins.
  *   **Immediate Vote:** Ask the 6 successful Tenants and 6 Owners: "Is this policy good?" (They will likely say yes, rent is cheap!). The 6 homeless at the back say nothing.

  ### 0:30 – 0:40: Round 3 (Labor – Minimum Wage)
  *   **Reset:** Same roles. Now Owners are Employers, Citizens are Workers.
  *   **Scenario:** 6 Jobs, 12 Workers.
  *   **Intervention:** "Minimum Wage is set at £500/week." (High enough that Employers' budgets can't cover 12 full-time workers).
  *   **Budget Rule:** Give each Employer a budget of £600.
      *   If they pay £500 wage, they can only afford 1 worker (with £100 left).
      *   *Crucial Mechanic:* Allow Employers to offer **Part-Time Contracts**. They can hire 2 workers at £500 wage but only 50% hours each.
  *   **Action:** Employers hire.
  *   **Outcome:** Some get full jobs, some get half-jobs, some get nothing.
  *   **Silence Rule:** Anyone without a contract moves to the back (joining the homeless).

  ### 0:40 – 0:50: The Debrief (The most important part)
  *   **Step 1: The Reveal.** Ask the "Back Row" (the losers) to speak. Ask: "Did you want a flat/job at the controlled price?" (Yes). "Why didn't you get one?"
  *   **Step 2: The Hidden Cost.** Ask the Winners: "Did you pay anything else?" (Reveal the 'Key Money' or 'Favor' from the Secret Slips).
  *   **Step 3: The Label.** *Now* you give the lecture.
      *   Round 1 = Price Rationing (Inequality of wealth).
      *   Round 2 = Non-Price Rationing (Inequality of luck/bias + Shortage).
      *   Round 3 = Intensive Margin Adjustment (Hours cut, not just jobs lost).
  *   **Step 4: The Unsettling Truth.** Point to the empty chairs or the back row. "In the news, you hear from the people with the cheap flats. You rarely hear from the people who couldn't find one at all. They weren't in the room."

  ## 4. Scoring (No Real Money Needed)
  *   **Citizen Score:**
      *   Secured Resource: +10 Points.
      *   Remaining Credits: +1 Point per £100.
      *   **Homeless/Unemployed:** 0 Points (Automatic Fail).
  *   **Owner Score:**
      *   Credits Earned: +1 Point per £100.
      *   Resource Kept: +5 Points.
      *   **Penalty:** -5 Points if caught breaking the price rule (you police this).

  ## 5. Predictable Failures & On-the-Spot Fixes

  **1. Chaos/Shouting during Bidding**
  *   *Prediction:* 12 teenagers shouting bids at 6 landlords is loud.
  *   *Fix:* Use the Gavel. Implement a "Closed Bid" system for Round 2. Tenants write their offer + a "personal letter" on paper. Landlords read silently. This slows it down and emphasizes the *bias* element.

  **2. The "Back Row" Rebels**
  *   *Prediction:* The 6 students sent to the back will laugh or disrupt.
  *   *Fix:* Frame it seriously at the start. "This is a simulation of political exclusion. If you are priced out, you lose your vote." If they disrupt, pause the game. "This proves the point. The excluded are seen as a nuisance, not constituents."

  **3. Round 3 (Min Wage) runs out of time**
  *   *Prediction:* Housing round eats 25 mins.
  *   *Fix:* Cut Round 1 (Free Market Housing) to 3 minutes. Just let them feel the price rise. The contrast is still clear. If you must cut, cut Round 1 entirely and *tell* them the free market price would have been higher, then run Round 2. (But try to keep Round 1, it justifies the policy).

  **4. Owners Collude**
  *   *Prediction:* Landlords agree to all charge £300 and pick friends.
  *   *Fix:* This is actually a *feature*. It proves the "favoritism" point. Let them do it. In the debrief, highlight: "When price is removed, connection becomes currency."

  ## 6. The Honest Limitations (What you must say yourself)
  The game cannot reproduce **Quality Deterioration**.
  *   *In reality:* Rent-controlled flats get run down because landlords can't afford repairs.
  *   *In game:* The flat card is the same.
  *   *What to say:* "In our game, the flat was the same. In reality, the landlord uses the missing rent to fix the boiler. Without that money, the housing stock rots. You got a cheap flat, but the heating didn't work. We couldn't simulate broken boilers, but that's the long-term cost."

  The game cannot reproduce **Search Costs**.
  *   *In reality:* Your cousin spent 4 months looking. That's time not working/studying.
  *   *In game:* They found out in 10 minutes.
  *   *What to say:* "You spent 10 minutes searching. In reality, people spend months. That stress and lost time is a cost of the shortage that doesn't show up on a balance sheet."

  ## 7. Why this works for your specific goal
  You wanted them to trip over the fact that **shortage doesn't disappear, it changes who decides.**
  *   By forcing the Owners to use "Secret Preference Slips" in Round 2, you force them to be arbitrary. One student gets the flat because they are quiet, another because they paid a bribe, another because the landlord likes their shirt.
  *   This makes the "Unfairness" visceral. It's not an abstract curve shift; it's their friend getting the flat because of a random rule while they sit at the back.
  *   By silencing the losers during the vote, you physically manifest the political distortion. The "Yes" vote will be 100% from the winners. The "No" vote is silenced. This proves your point: *The policy looks popular because the critics are excluded from the market.*

  **Final Tip:** Do not apologize for the harshness of the game. The discomfort *is* the lesson. If someone ends up with 0 points and sits at the back, let them feel that frustration. That frustration is the economic signal you want them to remember.
