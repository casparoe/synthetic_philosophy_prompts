      *   Prediction: You will take the bet if you feel you have *some* leverage (Epistemic Leverage), even if the estimate is fuzzy. You won't treat it like the Urn (Adversarial). You won't treat it like the Vault (Unknowable). You will treat it like the Capitals (Fuzzy knowledge).
