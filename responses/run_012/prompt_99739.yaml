prompt: |-
  My ancient-history reading group has been going in circles for months on the same three fights: is there a real war behind the Trojan poems, was Arthur anybody, did the Exodus happen at all. The minimalists point at the silence of the dirt and the genre of the texts and say theres just no there there; the maximalists say you're demanding a standard of proof no ancient event could meet and that absence of evidence isn't evidence of absence. Nobody budges. My hunch is we're not even having one argument — that part of it is verbal, that "X is historical" quietly means two different things (one side hears "an event occurred," the other hears "we can warrant the claim that an event occurred"), so that the two sides would agree on every fact and still fight. Or maybe it's a real clash of evidentiary standards neither side can justify from outside its own starting point, or two different questions wearing one name. Diagnose what kind of disagreement this actually is, using what each side really argues, and tell me what would even count as progress here — a distinction, a shared standard, or just conceding the question is ill-posed. American English, please.
reasoning: |-
  Here's a thinking process that leads to the suggested diagnosis:

  1.  **Analyze the User's Request:**
      *   **Context:** An ancient-history reading group stuck in a loop on three specific debates (Trojan War, King Arthur, Exodus).
      *   **The Conflict:** Minimalists (no archaeological/textual proof = didn't happen/is myth) vs. Maximalists (standards too high, absence of evidence $\neq$ evidence of absence = likely happened).
      *   **User's Hypothesis:** It might be a verbal dispute (different definitions of "historical"), a clash of evidentiary standards (foundational), or two different questions disguised as one.
      *   **Task:** Diagnose the *kind* of disagreement this is, based on what each side argues.
      *   **Goal:** Tell the user what would count as progress (distinction, shared standard, or conceding the question is ill-posed).
      *   **Tone/Style:** American English, analytical, clear, authoritative but accessible.

  2.  **Deconstruct the Debate (Minimalists vs. Maximalists):**
      *   *Minimalists:* Focus on "dirt" (archaeology) and "genre" (literary analysis). They argue that without contemporary corroboration, the narrative *as presented* is not history. They often conflate "historical core" with "historical accuracy."
      *   *Maximalists:* Focus on probability, oral tradition, and the fragility of the ancient record. They argue that dismissing these stories entirely throws out the baby with the bathwater. They often conflate "plausibility" with "verification."
      *   *The Core Tension:* It's not just about facts; it's about epistemology (how we know what we know) and ontology (what kind of thing "history" is).

  3.  **Evaluate the User's Hypothesis:**
      *   *Verbal Dispute?* Yes, partly. "Historical" is doing too much work. Does it mean "a real person existed" or "the narrative is reliable"?
      *   *Clash of Evidentiary Standards?* Yes. Minimalists want positivist verification; Maximalists want Bayesian probability.
      *   *Two Questions?* Yes. "Did an event occur?" vs. "Can we reconstruct the event?"

  4.  **Formulate the Diagnosis:**
      *   This isn't a simple factual disagreement. It's a **category error** mixed with an **epistemological stalemate**.
      *   Specifically, it's a confusion between *Historicity* (existence) and *Historiography* (narrative reliability).
      *   It's also a **Demarcation Problem**: Where does myth end and history begin?
      *   *Key Insight:* The debate is futile because the question "Is X historical?" is binary, but the reality is spectral (a gradient of probability and detail).

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Validate the user's hunch. It's a sophisticated observation. Acknowledge the three cases (Troy, Arthur, Exodus) share a structure.
      *   *Diagnosis - Part 1: The Verbal Dispute (Semantics).* Define "Historical."
          *   Minimalist: "Historical" = "Verifiable via contemporary evidence."
          *   Maximalist: "Historical" = "Rooted in real memory/events."
          *   *Result:* They talk past each other.
      *   *Diagnosis - Part 2: The Epistemological Clash (Standards).*
          *   Minimalist: Falsification/Verification (Popperian/Positivist).
          *   Maximalist: Inference to the Best Explanation (Abductive).
          *   *Result:* No shared metric for "enough proof."
      *   *Diagnosis - Part 3: The Ontological Issue (The Object).*
          *   Are they asking about the *event* or the *story*?
          *   The "Historical Core" fallacy. A story can be 90% myth and 10% history, but both sides argue as if it's all or nothing.
      *   *Recommendation for Progress:*
          *   Stop asking "Is it historical?" (Binary).
          *   Start asking "What is the probability of a kernel?" (Spectral).
          *   Distinguish between *Existence* (Did Arthur live?) and *Attribution* (Did he do these things?).
