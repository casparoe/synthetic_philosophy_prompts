answer: |-
  You're right to suspect your group is stuck in a loop. You aren't having one argument; you're having three distinct disagreements tangled together. The frustration comes from treating a multi-layered problem as a binary switch: *Historical* vs. *Myth*.

  Here is the diagnosis of what is actually happening, followed by what would count as progress.

  ### 1. The Diagnosis: A Category Error Masquerading as a Factual Dispute

  Your hunch is correct: this is partially a verbal dispute, but it's deeper than just definitions. It is a clash between **ontology** (what exists) and **epistemology** (what we can know).

  **The Verbal Dispute (Semantics)**
  When the Maximalist says, "Arthur is historical," they usually mean: *"There was likely a real person or event that inspired this tradition."*
  When the Minimalist says, "Arthur is not historical," they usually mean: *"We cannot verify the specific claims made in the texts using contemporary evidence."*

  Both sides could agree on every single piece of archaeological data and every textual analysis and still disagree on the conclusion, because they are answering different questions. One is asking about **causality** (did something cause this story?), and the other is asking about **verification** (can we prove the details?).

  **The Epistemological Clash (Standards of Proof)**
  This is the engine of the stalemate.
  *   **The Minimalists** are operating on a **Positivist** standard. They require contemporary corroboration (inscriptions, strata, non-partisan accounts). To them, absence of evidence *is* evidence of absence regarding the *narrative*.
  *   **The Maximalists** are operating on a **Bayesian** or **Abductive** standard. They argue from probability and inference to the best explanation. To them, the existence of a complex tradition *requires* a catalyst, and the silence of the dirt is explained by the fragility of the record.

  Neither side can justify their standard using the other side's rules. The Minimalist demands proof the Maximalist admits doesn't exist. The Maximalist demands plausibility the Minimalist rejects as speculation.

  **The Ontological Trap (The "All-or-Nothing" Fallacy)**
  This is the most damaging part. The debate assumes that "The Trojan War," "King Arthur," or "The Exodus" are singular, discrete events that either happened or didn't.
  *   **Reality:** These are likely palimpsests. The Trojan War might be a conflation of five conflicts over two centuries. Arthur might be a composite of three different warlords. The Exodus might be a folk memory of the Hyksos expulsion merged with later religious ideology.
  *   **The Fight:** By arguing over the *label* "Historical," both sides force a complex spectrum into a binary box. The Minimalist says, "Since the Iliad isn't a documentary, there was no war." The Maximalist says, "Since there was a war, the Iliad is history." Both are wrong.

  ### 2. What Counts as Progress?

  You will not resolve this by finding new evidence. You will resolve it by changing the question. Progress looks like one of the following three moves:

  **A. Adopt a Spectrum of Probability (The Best Path)**
  Stop asking "Is it historical?" Start asking: *"What is the probability of a historical kernel, and how much narrative inflation is attached to it?"*
  *   **Progress:** The group agrees to rate these figures on a scale. For example:
      *   **Tier 1:** Verified existence and actions (e.g., Augustus).
      *   **Tier 2:** Verified existence, unverified actions (e.g., King Hezekiah).
      *   **Tier 3:** Plausible existence, legendary actions (e.g., Arthur).
      *   **Tier 4:** Cultural memory of an event, no specific agent (e.g., The Exodus).
      *   **Tier 5:** Pure etiology/myth (e.g., Romulus and Remus).
  *   **Why it works:** It allows the Maximalist to say "Tier 3" and the Minimalist to say "Tier 4" without calling each other liars. It acknowledges that a story can be "true" in origin but "false" in detail.

  **B. Distinguish "Historicity" from "Historical Function"**
  Shift the debate from *what happened* to *why the story exists*.
  *   **Progress:** Agree that whether Arthur existed is less important than understanding why 12th-century England *needed* him to exist.
  *   **Why it works:** It satisfies the Minimalist (analyzing the text's genre and purpose) and the Maximalist (acknowledging the tradition has a root in real societal needs or memories). It moves the goalpost from "Did he swing the sword?" to "Why do we say he swung the sword?"

  **C. Concede the Question is Ill-Posed (The Nuclear Option)**
  If the group refuses to adopt a spectrum, you must admit the binary question is broken.
  *   **Progress:** Explicitly state: *"The question 'Did the Exodus happen?' is unanswerable with current methodology because the event, if it occurred, leaves no distinct archaeological signature distinguishable from normal migration."*
  *   **Why it works:** It ends the circular firing squad. It turns the debate from a fight about facts into a meta-discussion about the limits of ancient history as a discipline.

  ### Recommendation for Your Group

  Propose a **moratorium on the word "Historical."**

  For the next session, ban the phrase "Is X historical?" Replace it with: *"What is the minimum necessary reality required to produce this text?"*

  *   **For Troy:** Do we need a war, or just a trade dispute?
  *   **For Arthur:** Do we need a king, or just a *dux bellorum* (war leader)?
  *   **For Exodus:** Do we need a nation leaving, or a small group of Levites projecting their story onto a larger population?

  If you can get the Minimalists to define the *minimum* evidence required for a "kernel" and the Maximalists to define the *maximum* distortion allowed in oral tradition, you might find they actually occupy the same middle ground. They just hate admitting it.

  **The Bottom Line:** You are suffering from the **Binary Trap**. History is rarely "Yes/No." It is "How much?" and "In what sense?" Until your group accepts that ambiguity is a feature of ancient history, not a bug, you will keep going in circles.
