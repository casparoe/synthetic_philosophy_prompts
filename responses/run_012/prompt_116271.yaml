      *   **Constraints:**
          *   5 minutes spoken (approx. 750-900 words).
          *   Warm, funny, sincere.
          *   Include: How they met, one mildly embarrassing story about the Groom, something true about the Bride.
          *   **Crucial:** No predictions based on reference classes (e.g., "odds are good," "statistically likely").
          *   **Crucial:** No winking/nodding to the stats people (no inside jokes about the reference class problem).
          *   **Crucial:** No quoting philosophers.
          *   **Goal:** The toast itself must answer "What is a toast for if it can't be a prediction?" without explicitly stating that question. It needs to be a sincere toast for Grandma *and* logically sound for the actuaries.

  2.  **Deconstruct the Philosophical Block:**
      *   The user is stuck because they think a toast *must* be a prediction of success based on past data (induction).
      *   The reference class problem says: You can't pick the right group to compare them to (all marriages? marriages of actuaries? marriages in 2024?).
      *   The Solution: Shift the function of the toast from *prediction* (forecasting the future based on classes) to *commitment* (witnessing the present and promising support).
      *   A toast isn't a weather forecast; it's a vow of support from the community. It's not "You will succeed"; it's "We are here while you try."
      *   This satisfies the stats crowd (no false probabilistic claims) and the Grandma crowd (heartfelt sentiment).

  3.  **Drafting - Section by Section:**

      *   **Opening:** Needs to be warm, acknowledge the crowd, set the tone. Avoid "odds" language.
      *   **How They Met:** Keep it vague enough to be universal but specific enough to be real. Focus on the *connection*, not the statistics of meeting.
      *   **The Groom (Embarrassing Story):** Needs to show character, not just clumsiness. Something that highlights his dedication or loyalty, which is a better predictor than a reference class.
      *   **The Bride:** Needs to highlight her strength/perception. Acknowledge her job (actuary) without making it a punchline about risk.
      *   **The "Prediction" Pivot:** This is the core. Instead of saying "You will last," say "I know what you are made of." Shift from *probability* to *evidence of character*.
      *   **The Conclusion:** Raise a glass. Focus on the *now* and the *support*, not the *outcome*.

  4.  **Refining the Tone:**
      *   *Stats/Actuary check:* No mention of "probability," "odds," "risk," "sample size," "reference class."
      *   *Grandma check:* Simple language, emotional resonance, clear narrative.
      *   *Length:* Needs to be readable in 5 minutes. (Average speaking pace is 130-150 wpm. 5 mins = 650-750 words. I'll aim for around 800 to allow for pauses/laughter).

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hi everyone. I'm [Name].
