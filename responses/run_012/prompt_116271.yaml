answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I've had the privilege of being [Groom]'s friend since our first year of university.

  Looking around this room, I see a lot of faces. I see the family who raised him, including his grandmother, who I know is watching tonight with a very sharp eye. I see the family who raised [Bride], who taught her everything she knows. And I see friends from every chapter of our lives.

  When [Groom] asked me to be his best man, he told me the job description was simple: say a few nice words, tell a story, and wish them well. But the more I thought about what I actually wanted to say, the more I realized that the usual script doesn't quite work for a couple like this.

  Usually, a toast is a guess about the future. We say things like, "I know you'll be happy," or "You're perfect for each other," as if we have some way of knowing what's coming next. But the truth is, none of us know what the next fifty years look like. Life is unpredictable. It throws things at you that you can't plan for.

  So, I'm not going to stand here and make a prediction. I'm not going to tell you that your path will be easy, or that the numbers are in your favor. Instead, I want to talk about what I know for certain. I want to talk about what I have seen.

  I met [Groom] when we were eighteen. We were both in the stats program, which means we spent a lot of time looking for patterns in the noise. But [Groom] has always been terrible at ignoring the outliers.

  There was this one time in second year. We had a group project due at 9:00 AM. It was 2:00 AM, and we were done. But [Groom] found a tiny inconsistency in our data. A decimal point that didn't look right. I told him, "It's fine. No one will notice. Let's sleep." He couldn't do it. He stayed up until 5:00 AM re-running the entire model because he said, "If it's wrong, it's wrong." He was exhausted, he looked terrible, but he couldn't cut a corner. That's who he is. He cares about the truth, even when it's hard. Even when no one is watching.

  And then, [Groom] met [Bride].

  I watched him change. Not because he needed fixing, but because he met someone who matched his intensity. [Bride], you are an actuary. Your job is to look at the world and assess risk, to calculate what might go wrong. But what I admire most about you isn't your ability to calculate risk. It's your ability to see people clearly.

  You saw [Groom] not as a project, and not as a statistic, but exactly as he is. And he saw you the same way. In a world where it's easy to look at the surface, you two look at the foundation.

  So, if I can't predict the future, what am I doing up here?

  I think a toast like this isn't a forecast. It's a witness statement.

  I am standing here to tell you that I have seen how you treat each other. I have seen the patience you show when things are difficult. I have seen the way you listen, not just to reply, but to understand. I have seen the way you make each other better, not by changing each other, but by supporting who you already are.

  Marriage isn't about finding a outcome that's guaranteed to work. It's about building something that can withstand the things that don't go to plan. And based on what I have witnessed, I know you are building on solid ground.

  To [Groom] and [Bride]: I cannot promise you that life will be smooth. But I can promise you this. When the data gets messy, when the variables change, and when the unexpected happens, you will not have to face it alone. You have this room. You have your family. And you have me.

  We are here to witness your joy, and we are here to support your work.

  So, if everyone could please rise.

  To [Groom] and [Bride]. May you always look at each other as clearly as you do today. And may you always know that you are surrounded by people who believe in what you are building.

  To the couple.
