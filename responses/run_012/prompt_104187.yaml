answer: |-
  Your hypothesis is compelling, and it captures a significant portion of the friction: there is indeed a conflation of *confirmation as updating* (diachronic) and *confirmation as support* (synchronic). However, diagnosing the stalemate as *merely* verbal or definitional is too charitable to the formalism. It misses the structural constraint that forces the disagreement to persist.

  The diagnosis is this: **The Problem of Old Evidence (POE) is not a bug in the definition of confirmation; it is a symptom of the clash between Bayesianism's idealization of logical omniscience and the reality of bounded rationality.**

  The debate has not converged because the proposed repairs require trading off core axioms of the Bayesian framework against the phenomenology of scientific practice. No solution is strictly better because each solution preserves a different virtue of the system while sacrificing another.

  Here is the breakdown of why the impasse exists, evaluating your hypothesis against the structural realities of the formalism.

  ### 1. The Structural Diagnosis: Logical Omniscience
  You suggest the dispute is about what 'confirmation' means. I argue the dispute is about **what the agent is**.

  Standard Bayesianism assumes **logical omniscience**. If hypothesis $h$ entails evidence $e$, a standard Bayesian agent *must* assign $P(h) \leq P(e)$. If you are certain of $e$ ($P(e)=1$), and you are logically omniscient, you *must* have already factored that certainty into $P(h)$. There is no room for $e$ to raise $P(h)$, because a perfect reasoner would have already maximized $P(h)$ given $e$.

  The POE arises because human scientists are **not** logically omniscient. We learn $e$, and *later* we discover $h$, and *later still* we realize $h \vdash e$. The "confirmation" happens when we learn the *logical relation*, not when we learn the *empirical fact*.

  *   **Camp A (The Purists):** Insist that Bayesianism is a theory of ideal rationality. If $P(e)=1$, confirmation is impossible. If you feel confirmed, your priors were incoherent to begin with. They prioritize the **mathematical consistency** of the probability calculus.
  *   **Camp B (The Reformers - e.g., Garber):** Argue we should conditionalize on the *proposition that $h$ entails $e$*, not on $e$ itself. This requires a language where logical relations are uncertain. They prioritize the **phenomenology of scientific discovery**.
  *   **Camp C (The Counterfactualists):** Ask what credence you *would* have had if you didn't know $e$. They prioritize the **intuition of support** but rely on subjective, often ill-defined counterfactual priors.

  **Why this causes stalemate:** You cannot have it both ways. You cannot maintain the standard Kolmogorov axioms (which imply omniscience over the algebra) *and* model an agent who learns logical consequences over time. Every "fix" for POE is actually a modification of the underlying logic of the agent. The debate hasn't converged because philosophers disagree on whether it is better to break the calculus or break the model of the agent.

  ### 2. Evaluating Your Hypothesis (Verbal vs. Substantive)
  You hypothesize that the dispute is verbal: one camp means synchronic support, the other diachronic change.

  **You are 80% right.**
  There is a genuine equivocation on "confirmation."
  *   **Likelihoodists** (and some Bayesians) treat confirmation as the likelihood ratio $P(e|h) / P(e|\neg h)$. This ratio can be high even if $P(e)=1$. This captures *synchronic support*.
  *   **Strict Conditionalizers** treat confirmation as $P(h|e) > P(h)$. This captures *diachronic updating*.

  However, calling it "verbal" implies the parties could easily resolve it by stipulating definitions. They cannot. The reason is that Bayesianism claims to be a **unified theory of rationality**. It claims that synchronic coherence and diachronic updating are two sides of the same coin (via Dutch Book arguments).
  *   If you admit that $e$ supports $h$ synchronically but cannot update on it diachronically (because $P(e)=1$), you break the Dutch Book justification for why we should care about probabilities in the first place.
  *   If you force the update (by setting $P(e)<1$), you violate the agent's actual certainty.

  So, it is not merely a verbal dispute; it is a **systemic tension**. The framework promises a unified account of belief and learning, but POE proves that account fails for non-omniscient agents. The "verbal" disagreement is a shield for the deeper structural incompatibility.

  ### 3. The Accommodation vs. Prediction Red Herring
  You ask if this inherits the impasse of accommodation vs. prediction.
  **No.** In fact, POE is worse than that debate.
  In the accommodation/prediction debate, Bayesians generally argue that timing *shouldn't* matter (the "Predictivism" thesis is often rejected by Bayesians). They argue $P(h|e)$ should be the same regardless of when $e$ was known.
  POE shows that if $P(e)=1$, the timing *mathematically forces* the support to zero.
  So, POE is not inheriting the impasse of accommodation/prediction; it is **demonstrating why the Bayesian attempt to equalize them fails.** The stalemate persists because one side wants to save the intuition that prediction is special (by modifying the formalism to allow old evidence to count less, or differently), while the other wants to save the Bayesian dogma that timing is irrelevant (by insisting old evidence *must* count the same, which requires the counterfactual tricks).

  ### 4. What Would Count as Progress?
  If the diagnosis is correct (that the problem is Logical Omniscience), then progress will not come from better definitions of confirmation. It will come from **better models of logical uncertainty.**

  **A. Theorem/Formalism: Logical Induction**
  The most significant progress in the last decade comes from the MIRI/Logical Induction literature (Garrabrant et al.). They have developed a framework where agents assign probabilities to logical statements *before* they are proven, and update as proofs are found.
  *   **Progress:** If Bayesian epistemology adopts Logical Induction as its foundation for mathematical/logical claims, POE dissolves. You conditionalize on the *discovery of the proof*, not the evidence itself.
  *   **Why it hasn't converged:** This framework is computationally intractable and philosophically radical. It abandons the idea that probabilities must be coherent at any single time step (they are only coherent in the limit). Traditional Bayesians are unwilling to sacrifice synchronic coherence.

  **B. Distinction: Epistemic vs. Evidential Probability**
  Progress would require a formal distinction between:
  1.  **Evidential Probability:** The relation between $e$ and $h$ (objective/synchronic).
  2.  **Epistemic Probability:** The agent's degree of belief (subjective/diachronic).
  Currently, Bayesianism tries to use one number ($P$) to do both jobs. Progress would be a dual-system formalism where $P_{evidential}(h|e)$ can be high even if $P_{epistemic}(e)=1$.

  **C. Change of Subject: Bayesianism as Consistency, Not Discovery**
  The most honest progress would be a concession: **Bayesianism is a theory of consistency, not a theory of confirmation.**
  It tells you how not to be Dutch Booked *given* your information. It does not tell you how to weigh that information against hypotheses if you already possess it. Accepting this limits the scope of Bayesianism but resolves the paradox by declaring it out of bounds.

  ### 5. Why No Progress Should Be Expected (The Pessimistic View)
  There is a strong reason to expect the stalemate to continue indefinitely.
  The "repairs" for POE are not just technical tweaks; they are **philosophical commitments**.
  *   To accept Garber's solution (conditionalizing on entailment), you must accept that logical relations are empirical hypotheses. Many find this ontologically dubious.
  *   To accept the $P(e)<1$ solution, you must deny that agents can ever be certain of observations. This leads to skepticism.
  *   To accept the Counterfactual solution, you must accept that "rationality" depends on facts about possible worlds where you were ignorant.

  Since these commitments are foundational to one's broader epistemology, no theorem will resolve them. A theist and an atheist will not converge on the problem of evil via a theorem; similarly, a Logical Omniscient Bayesian and a Bounded Rationality Bayesian will not converge on POE. They are building different tools for different jobs.

  ### Summary Diagnosis
  Your hypothesis that the dispute is about the definition of 'confirmation' is correct in spirit but underestimates the formal rigidity causing the split.
  *   **The Real Issue:** The framework assumes logical omniscience, but the phenomenon (science) involves learning logical relations.
  *   **The Stalemate:** Fixing the problem requires breaking the axioms that make Bayesianism attractive (coherence, omniscience, or certainty). Different philosophers are willing to break different axioms.
  *   **The Path Forward:** Progress requires abandoning the idea that a single probability function $P$ represents both *state* and *process*. We need a formalism for **logical uncertainty** (like Logical Induction) or a humble admission that Bayesianism explains *updating*, not *support*.

  Until the community agrees on whether Bayesianism is a theory of **ideal consistency** or **bounded learning**, the Problem of Old Evidence will remain a feature, not a bug.
