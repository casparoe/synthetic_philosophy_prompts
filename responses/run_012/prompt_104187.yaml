      *   **The Problem:** If $P(e) = 1$, then $P(h|e) = P(h)$. Conditioning on old evidence doesn't increase credence, yet intuitively, old evidence *does* support the hypothesis (e.g., Mercury's perihelion supporting General Relativity).
      *   **Known Solutions:** Subtracting $e$ from background, denying certainty ($P(e) < 1$), counterfactual ignorance (what if I didn't know $e$?), non-probabilistic measures (explanatory coherence).
      *   **The Core Question:** Why hasn't the debate converged? The user wants a *diagnosis*, not a survey.
