answer: |-
  The formula "competence without comprehension" conceals three distinct assertions. The first is a claim about **mechanism**: that within the causal process producing the behavior, no internal state semantically represents the content of the performance (syntax without semantics). The second is a claim about **explanation**: that positing comprehension is unnecessary to predict or account for the behavior; a functional description suffices. The third is a claim about the **world**: that comprehension is absent from the entire causal chain, implying a metaphysical eliminativism regarding mind in that context.

  Turing's inversion—substituting the question of *how* for *whether*—directly supports the **explanation** claim. It mandates that we trace the mechanism of output generation without requiring a verdict on internal experience. Darwin's inversion—substituting undirected process for a designer—supports the **mechanism** claim. It demonstrates how apparent design (competence) arises from a process (selection) that holds no representation of the final form. Neither inversion entails the **world** claim. Darwin's process ultimately produces organisms that *do* comprehend, and Turing's test leaves the existence of other minds untouched; both allow comprehension to exist elsewhere in the causal chain, even if not in the specific mechanism under scrutiny.

  Mapping this onto Clever Hans requires shifting the unit of analysis. The system whose competence is in question is not the horse alone, but the horse-questioner dyad. Hans's performance was evidence not for equine arithmetic, but for a distributed cognitive loop where motor output was decoupled from numerical abstraction. The claim that comprehension was displaced rather than absent is robust. The answers were genuinely correct (competence), and the answers were genuinely known (comprehension), but the locus of the latter was the questioner, Von Osten. The inversion instructs us to find the mechanism producing the taps, but Hans reveals a trap in that instruction: looking only at the horse locates the mechanism of *tapping* but misses the mechanism of *selection*.

  Pfungst's controls established that the questioner's cues were *sufficient* to produce the answers, not necessarily that the horse was incapable of arithmetic, though the latter is the parsimonious conclusion. More precisely, Pfungst showed the horse's performance was causally dependent on the questioner's knowledge state. However, the horse's sensitivity to minute postural and facial shifts is itself a high-level competence standing in need of explanation. This sensitivity is best explained by both: an evolutionary heritage of social cognition in herd animals (Darwinian) refined by operant conditioning within the specific context of the demonstration (designed). Here, the Darwinian face of the case (evolved social perception) enables the Turingian deception (passing as a mathematician). The mechanism that actually produced the answers was not designed by anyone in its totality; Von Osten designed the training, but the feedback loop of involuntary cueing and response emerged unintentionally. It was an undirected adaptation of the dyad to the testing environment.

  Running this analysis back onto the framing suggests Hans both vindicates and embarrasses the inversions. It vindicates the methodological skepticism: one must look for the mechanism rather than accepting the appearance of comprehension. However, it embarrasses the ontological shorthand of "competence without comprehension." In Hans's case, it was "competence here, comprehension there." The framing falls silent on distributed cognition, treating the tested entity as a closed box rather than a node in a network. Consequently, "competence without comprehension" is revealed as a thesis about explanation and attribution rather than a definitive statement about minds. The methodological moral—that observer expectations can constitute the performance—follows directly from the analysis: the expectation of the answer generated the physical cue that drove the mechanism. The framing fails only when it assumes the mechanism must be internal to the agent being tested.

  In the evaluation of a contemporary language model, the analogue of the questioner's cue is the statistical shadow of human reasoning embedded in the training corpus and reinforced by human feedback. The model does not comprehend the text, but it mimics the shape of comprehension found in the data, guided by reward signals that function like Von Osten's involuntary nods, confirming when the output aligns with human expectation.
