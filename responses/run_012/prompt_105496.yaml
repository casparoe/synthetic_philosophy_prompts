answer: |-
  You have put your finger on a genuine fissure in ethics and linguistics. It is not merely a plot device; it is a recognized loophole in the architecture of human communication.

  The term you are looking for is **Paltering**.

  While "weaseling" is the insult and "lawyering" is the profession, **paltering** is the technical term used in negotiation theory, psychology, and ethics to describe the active use of truthful statements to convey a false impression. It was rigorously defined in a 2016 study by Todd Rogers, Richard Zeckhauser, and colleagues at Harvard.

  However, "paltering" is a label from social science. Since you asked for the philosophical carving—the boundaries, the mechanics, and the moral weight—I will treat it as such. Here is the anatomy of the move, how it differs from the categories you listed, and where the distinction collapses.

  ### 1. The Mechanism: Implicature vs. Assertion
  To understand why this slips through the net of "lying," you have to look at Gricean Pragmatics.
  *   **Lying** violates the **Maxim of Quality**: You assert $P$, but you believe $\neg P$.
  *   **Paltering** adheres to the Maxim of Quality but exploits the **Maxim of Quantity/Relevance**. You assert $P$ (which is true), knowing the listener will infer $Q$ (which is false) because, in a cooperative conversation, $P$ is only relevant if $Q$ is true.

  When your character says, "I was at his apartment on Thursday," she is technically cooperating (telling the truth) but pragmatically defecting (knowing the inference is wrong).

  **Why the defense works:** Society polices *assertions* more heavily than *inferences*. If I lie, I have broken a contract. If I palter, I have forced *you* to break your own reasoning. The listener feels a sense of shame for having "jumped to conclusions," which is why they accept the defense. You shifted the burden of proof from the speaker's veracity to the listener's interpretation.

  ### 2. The Boundaries (Your Specific Comparisons)

  Here is how paltering carves out its own space relative to the three categories you mentioned:

  **(a) Versus Silence (Omission)**
  *   **Silence** is passive. It leaves a gap.
  *   **Paltering** is active. It fills the gap with true data that acts as a decoy.
  *   *The Line:* If your character simply refused to answer, the accuser would remain suspicious. By offering a true fact ("I was at his apartment"), she actively directs the accuser's gaze away from the truth. Paltering is morally weightier than silence because it involves the *manufacture* of a false belief, not just the allowance of one.

  **(b) Versus Frankfurt's "Bullshit"**
  *   **Bullshit** (per Harry Frankfurt) is defined by an **indifference to truth**. The bullshitter doesn't care if what they say is true or false; they care only about the effect.
  *   **Paltering** requires a **hyper-attention to truth**. The palterer *must* ensure every word is factually defensible.
  *   *The Line:* This is a hard boundary. Your character is not bullshitting; she is weaponizing accuracy. This is why the "I never lied" defense feels valid to her. She respected the truth-value of the sentence, even while violating the spirit of the exchange.

  **(c) Versus Mental Reservation**
  *   **Mental Reservation** (specifically *strict* mental reservation) involves adding a silent clause to a sentence. E.g., Saying "I did not eat the cake" while mentally adding "...today."
  *   **Paltering** relies on the *listener's* assumptions, not the *speaker's* silent syntax.
  *   *The Line:* Mental reservation is semantic (changing the meaning of the words internally). Paltering is pragmatic (keeping the meaning of the words stable but manipulating the context). Your character's move is paltering, not mental reservation, because the sentence "I was at his apartment" requires no internal editing. It is the listener who edits the meaning to "I was sleeping with him."

  ### 3. The Kantian Context
  You mentioned the "Murderer at the Door." Kant's position in *On a Supposed Right to Lie from Philanthropy* is often misunderstood. He argues against *false statements* (mendacium), but his broader ethical framework condemns *deception* (fallacia) generally.

  However, Kant focuses on the **autonomy of the rational agent**.
  *   When you lie, you hijack the listener's rationality by feeding it false data.
  *   When you palter, you feed it true data but rely on the listener's own heuristic shortcuts to generate the error.

  A strict Kantian would still condemn your character. Kant argues you cannot treat humanity merely as a means. By manipulating the listener's inference mechanisms to save yourself, you are using them as a means. However, in secular law and social norms, the distinction holds: **Fraud** often requires a false representation of fact, not a true representation with false implications. This is why your character's defense works in a court of public opinion, even if it fails in a court of pure ethics.

  ### 4. Where the Distinction Collapses (The "Be Straight" Section)

  You asked me to tell you if this distinction falls apart under pressure. It does.

  The distinction between Lying and Paltering is stable in low-stakes social friction (like your party scene). It collapses under **High-Stakes Reliance.**

  **The Argument for Collapse:**
  If the speaker *knows* that the listener *must* infer $Q$ from $P$ to make a life-altering decision, and the speaker says $P$ intending $Q$ to be inferred, the speaker is morally responsible for $Q$.

  **The Test Case:**
  Imagine a doctor knows a medication will kill a patient due to an allergy. The patient asks, "Is this safe for me?" The doctor says, "This medication is FDA approved" (True). The patient infers "It is safe for me" (False) and dies.
  In this case, no ethicist would accept the defense "I didn't lie." The context created a **duty of clarity** that overrides the **privilege of literalism**.

  **What would change my mind?**
  I would conclude the two things are the same if we accept the **Principle of Communicative Intent**. This principle states: *The meaning of an utterance is not what is said, but what the speaker intends the listener to believe.*
  If you accept this principle, paltering *is* lying. The literal truth of the sentence becomes irrelevant; the transmission of the false belief is the act.

  **Why the distinction usually survives:**
  It survives because of **Epistemic Labor**. We cannot function if we have to verify every implication of every sentence. If I ask "Did you finish the report?" and you say "I opened the file," I might infer "No." If you meant "Yes, I opened it and finished it," we have a communication breakdown. We grant speakers the right to be literal and place the burden of inference on the listener *unless* the stakes are high enough to trigger a duty of care.

  ### 5. Summary for the Novelist

  **The Term:** **Paltering**.
  **The Definition:** The active use of truthful statements to induce a false belief.
  **The Moral Status:** Distinct from lying in *mechanism* (semantics vs. pragmatics) and *social perception* (blame shifts to the listener), but often equivalent in *consequence* and *intent*.
  **The Boundary:** It holds in social maneuvering (your party scene) but collapses in fiduciary relationships (doctor/patient, lawyer/client) where there is a duty to clarify.

  **For your manuscript:**
  Your character's defense works because she is operating in the **Social Zone**, where paltering is a accepted form of self-preservation. If you want to create tension, move her into the **Fiduciary Zone**. Have someone rely on that statement for something critical (money, safety, a reputation). If the consequences escalate, the "I didn't lie" defense will stop satisfying the reader, because the moral weight of the *intent* will outweigh the technicality of the *truth*.

  You are not describing a bug in human language; you are describing a feature. We built language with this loophole because sometimes we need to protect ourselves without burning the bridge of trust entirely. Your character is walking that line. Just ensure the ground beneath her shifts if she steps too far.
