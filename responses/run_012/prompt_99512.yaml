answer: |-
  Here is your prep sheet. I've ordered these by the damage they can do to your credibility in this specific room, starting with the kill shots.

  ### 1. The AI Safety / Bounded Utility Trap
  **The Question:** "If you reject aggregation because the individual harm is negligible, does that commit you to a bounded utility function? Because if utility is bounded, there's a point where preventing an existential catastrophe isn't worth a small cost to everyone living today. Are you willing to tell this room that your moral framework might ignore x-risk?"
  **The Reply:** "I'm not proposing a utility function; I'm describing a phenomenology of harm. There's a difference between 'negligible' and 'non-zero.' A dust speck is negligible; a one-in-a-billion chance of extinction is not, because the *nature* of the event changes the life, even if the probability is low. My argument is about threshold effects in lived experience, not about capping the value of the future. I'm saying we can't sum zeros to get a hero. I'm not saying we ignore the abyss."
  **The Soft Spot:** You are hand-waving the math. In formal decision theory, rejecting aggregation *does* imply bounded utility or lexical priorities that break expected utility maximization. You are hoping they accept "nature of the event" as a technical distinction. It isn't one.
  **Damage:** Critical. This implies you are dangerous to the room's core mission (saving the world).

  ### 2. The Decision Theory Continuity Axiom
  **The Question:** (From the Decision Theory grad student) "Von Neumann-Morgenstern utility requires continuity. If you prefer sparing the torture victim over the specks, there must be some probability mix where you're indifferent. By saying the specks *never* add up, you're violating continuity. Your preferences are literally unrepresentable. How do you make decisions if your preferences can't be modeled?"
  **The Reply:** "Then the model is too small for the moral reality. I'm not trying to pass a math test; I'm trying to describe why torture is a different *category* of wrong than irritation. If your axioms require me to say that a trillion headaches equal a life destroyed, I'll keep my preferences unrepresentable. I'd rather be incoherent to a calculator than cruel to a person."
  **The Soft Spot:** You are admitting you are irrational by their standards. You are framing this as a feature ("moral reality"), but in this room, that sounds like "I refuse to do the math."
  **Damage:** High. It marks you as philosophically naive.

  ### 3. The Sorites / Threshold Problem
  **The Question:** "You say a speck doesn't count. Fine. What about a pebble? A brick? A beating? At what exact number of particles does the harm become 'real' enough to aggregate? If you can't name the number, you're just arbitrarily drawing a line where it feels comfortable."
  **The Reply:** "I'm not drawing a line in the sand; I'm pointing out a change in state. Water doesn't boil at 99 degrees. It boils at 100. The transition is sharp, even if the heat accumulates slowly. A speck is forgotten by the next blink. Torture defines the life. I don't need the exact particle count to know that 'forgotten' and 'defining' are different moral territories."
  **The Soft Spot:** This is the classic Sorites Paradox. "Change in state" is a metaphor, not a mechanism. They will press you on where the phase change happens. You don't know.
  **Damage:** High. Makes your view look arbitrary.

  ### 4. The Metaethics Slide
  **The Question:** (From the Metaethics grad student) "You've slid from a claim about how harm is *felt* (phenomenology) to a claim about how harm is *valued* (normativity). Just because a speck feels negligible doesn't mean it *is* morally negligible. You're committing the naturalistic fallacy."
  **The Reply:** "I'm not saying 'felt small' equals 'morally zero.' I'm saying moral value tracks impact on a life. If an event leaves no trace on the life—no memory, no change, no scar—then calling it 'harm' is a category error. It's not that the value is zero; it's that the event didn't land."
  **The Soft Spot:** You are defining "harm" as "lasting damage." They define it as "negative utility experience." You are talking past each other.
  **Damage:** Medium. Philosophical nitpicking that stalls the room.

  ### 5. The Ops / Action Guidance Question
  **The Question:** (From the EA Ops people) "Okay, but what does this *change*? We allocate resources based on expected value. If we ignore small harms because they don't 'accumulate,' we miss huge buckets of suffering. Give me a policy rule I can use tomorrow."
  **The Reply:** "I'm a novelist, not a policy engine. My rule is: Don't use aggregation to justify atrocities. If your spreadsheet tells you to torture one person because a billion people saved a penny, burn the spreadsheet. Use my argument as a circuit breaker, not a calculator."
  **The Soft Spot:** **CONCEDE THIS.** You cannot give them a policy rule. Don't try. Admit you are providing a constraint on their thinking, not a tool for it.
  **Damage:** Medium. Makes you look impractical (which you are, in this context).

  ### 6. The Repugnant Conclusion Link
  **The Question:** (From the Classical Utilitarian) "This sounds like you're avoiding the Repugnant Conclusion by fiat. If you refuse to aggregate small utilities, you can't justify building a world with billions of happy lives over a world with one miserable tyrant. Are you an anti-natalist?"
  **The Reply:** "I'm not arguing against happy lives; I'm arguing against trading agony for annoyance. Building a happy world doesn't require torturing a scapegoat. The Repugnant Conclusion is about quantity of life; this is about quality of suffering. Don't conflate the two."
  **The Soft Spot:** They are logically linked in population ethics. Denying the link shows a gap in your knowledge of the literature.
  **Damage:** Low-Medium. They will label you, but it won't kill your argument.

  ### 7. The "Rigged" Counter
  **The Question:** "Eliezer addressed this. The speck *is* defined as a discrete unit of negative utility. You're arguing the definition is wrong, but if we stipulate the definition, your argument collapses. Why shouldn't we just accept the stipulation?"
  **The Reply:** "Because thought experiments shouldn't be magic spells. If you define a word so that it forces a conclusion, you haven't learned anything about morality, you've learned about your dictionary. I'm challenging the stipulation because it violates the reality it's supposed to model."
  **The Soft Spot:** They will say all thought experiments rely on stipulations. You are rejecting the method, not just the result.
  **Damage:** Low. This is your home turf.

  ### 8. The Novelist Trap
  **The Question:** "This is a nice story. But your book is fiction. Real moral trade-offs happen in triage, in aid allocation, in AI alignment. Why should we take a heuristic from a story seriously?"
  **The Reply:** "Because stories are where we test our intuitions before we build the systems. If the intuition breaks in the story, it will break in the code. I'm the canary in the coal mine. If I'm gasping, you shouldn't keep digging."
  **The Soft Spot:** **CONCEDE THIS.** Acknowledge you aren't offering a solution, just a warning.
  **Damage:** Low. Ad hominem-lite.

  ***

  ### The Two Concessions
  **Give these up immediately to save time and credibility.**

  1.  **The Ops Question (#5):** Do not try to offer a decision procedure. You will fail. Say: *"I'm not offering a replacement for expected utility theory. I'm offering a veto on its abuse. I write about the cost of decisions, not the optimization of them."* This frames you as the conscience, not the competitor.
  2.  **The Decision Theory Formalization (#2):** Do not try to defend VNM axioms. You will lose. Say: *"If representing my preferences requires me to accept that torture is equivalent to dust specks, then I prefer preferences that can't be represented. I'm here to question the axioms, not satisfy them."* Own the "irrationality" as a moral stance.

  ### The Prayer Question
  **The one you hope nobody asks:**
  *"If you reject aggregation for harm, do you also reject it for benefit? If a billion people get a speck of pleasure, does that outweigh one person's misery? If not, how do you justify *any* collective action that imposes small costs for large distributed gains?"*

  **Why it's deadly:** It forces you to either accept aggregation (and lose the torture argument) or reject almost all government policy, infrastructure projects, and EA interventions (and look like an anarchist).
  **If asked:** Pivot to *symmetry*. "Harm and benefit aren't symmetrical. We have a duty not to torture. We do not have a duty to maximize every micro-pleasure. Negative duties are stricter than positive ones." It's a standard deontological escape hatch. Use it.
