answer: |-
  First off, trust your gut. You are doing exactly what philosophers do: reading a claim, testing it against your experience (the dishes, the dust), and spotting where the logic feels slippery. Your friend gave you a surprisingly good summary for a minor, but you have correctly identified the one place where the summary gets muddy.

  Peter van Inwagen is a giant in this field (his book *Material Beings* is the source here), and his view is radical. Let's break down your friend's summary sentence by sentence. I'll mark them as **Green** (van Inwagen would nod), **Yellow** (he'd wince or clarify), or **Red** (he'd say that's wrong).

  ### The Sentence-by-Sentence Audit

  > "The special composition question is just: when do a bunch of smaller things add up to one bigger thing?"

  **Green.** This is the Special Composition Question (SCQ). Accurate.

  > "There are basically only three kinds of answer. Always — that's universalism, everything composes something. Never — that's nihilism. And sometimes."

  **Green.** This is the standard map of the territory. Universalists say any particles compose an object (so there is an object made of your nose and the Eiffel Tower). Nihilists say no particles ever compose an object (only simple particles exist). Moderates say "sometimes."

  > "Van Inwagen is the famous sometimes guy. His answer is called organicism: a bunch of things compose something exactly when they're caught up in a life."

  **Green.** This is the core of his view. He is a "moderate," and his specific condition is "life."

  > "So you and I exist, and a dog exists, because we're alive — but a table doesn't, and neither does a chair or a planet."

  **Green.** This is the hard pill to swallow. For van Inwagen, you are a real object. The chair you sit on is not.

  > "There's no table, just a bunch of tiny bits arranged in a table-shaped way."

  **Green.** He calls this "tablewise arranged simples."

  > "The reason he rules out the other sometimes answers, like 'when the parts are touching' or 'when they're stuck together,' is that those lines are vague — at some point it's neither true nor false that the parts are stuck together enough — and he thinks existence can never be vague."

  **Green.** This is his "Argument from Vagueness." If composition happened when things were "glued together," how much glue is enough? If existence depends on that, existence would be vague. Van Inwagen thinks reality is sharp, not fuzzy.

  > "You either compose something or you don't, no in-between."

  **Green.** Existence is binary.

  > "Life is the one relation that gives you a clean cut, because a life is just the parts all working together toward the same goal, like a team."

  **Yellow.** Van Inwagen would wince slightly at "working toward a goal." That sounds like the parts have a purpose. He defines a "life" more technically as a self-maintaining *event* where the parts catch each other in a causal loop. But for a dinner-party summary, "team" is close enough. The important part is that he thinks biology provides a sharp line (you are either alive or dead) that physics (touching/gluing) does not.

  > "And when he says there's no table, he doesn't quite mean 'there's no table' is false — he means it's a convenient fiction, and whether some things count as composing a bigger thing is really up to how we decide to use words."

  **Red.** **This is where your gut was right.** This is the most important correction to make.
  Van Inwagen does **not** think existence is up to how we use words. He thinks it is a hard, mind-independent fact of the universe that tables do not exist.
  *However*, he does think that sentences like "There is a table" are **quasi-true**. He distinguishes between *literal truth* (ontology) and *assertibility* (language). He thinks we are allowed to talk *as if* tables exist because it's useful, but we shouldn't be fooled into thinking they are actually part of the fundamental furniture of reality.
  Your friend made it sound like van Inwagen is a linguistic relativist (existence is a choice). He isn't. He's an eliminativist (tables are gone, deal with it).

  > "Which is why most people think the view is dead on arrival: nobody can seriously believe the chair they're sitting on doesn't exist."

  **Yellow.** This is an observation about *other people*, not a logical part of van Inwagen's argument. Van Inwagen knows people hate this conclusion. He argues that we should accept it because the alternative (vagueness in existence) is worse. Whether the view is "dead on arrival" is a matter of debate, not a fact.

  ---

  ### The Big Confusion: Fact vs. Language

  You wrote: *"I got the impression this guy thinks he's found a hard fact about the world, not a rule about language."*

  **You are correct.** Van Inwagen is a realist about ontology. He believes he has discovered the actual structure of reality. He believes that if you stripped away all human language and minds, there would still be living organisms and simple particles, but there would be no tables, chairs, or planets.

  The confusion in your friend's summary comes from how van Inwagen handles everyday speech. Since he knows we can't stop saying "pass the salt," he developed a theory of **quasi-truth**.
  *   **Literal Truth:** "There exists an object X composed of these simples." (False for tables).
  *   **Quasi-Truth:** "There is a table." (Acceptable to say, because it translates to "There are simples arranged tablewise," which is true).

  Your friend conflated "we can speak as if they exist" with "their existence is a matter of language." For van Inwagen, the *speech* is conventional, but the *existence* is not.

  ### The "Dead on Arrival" Claim

  Does the view die because it denies chairs?
  **No.** That is a separate argument called the **Moorean Shift** (named after G.E. Moore).
  *   **Van Inwagen's Argument:** Existence cannot be vague + Artifacts have vague boundaries + Organisms have sharp boundaries → Therefore, artifacts don't exist and organisms do.
  *   **The Objection:** I know for a fact chairs exist + If your theory says chairs don't exist → Therefore, your theory is wrong.

  It's a clash of intuitions. Van Inwagen prioritizes the intuition that "existence isn't vague." His critics prioritize the intuition that "chairs exist." Neither side is logically forcing the other to surrender; they are weighing different costs. So, your friend's last sentence is an explanation of *why people reject it*, not a proof that it *should* be rejected.

  ### Back to Your Dust Pile

  You asked: *"When I sweep dust into a pile, at what point is it one thing instead of a bunch of little things?"*

  If you were a Universalist, the answer would be: "Always. Even when scattered, they compose an object."
  If you were a Nihilist, the answer would be: "Never. There is no pile, only dust particles."
  If you are a **van Inwagen Organicist**, the answer is: **"Never."**

  For van Inwagen, a pile of dust is never a single object. It is always "many." It doesn't matter how tightly you pack it. Unless that dust suddenly becomes alive (starts metabolizing and reproducing), it never crosses the line into being "one thing."

  This might feel unsatisfying, but that's the point. He wants you to feel that discomfort so you admit that "being one thing" is a much stricter category than we usually think.

  ### Verdict

  Your friend gave you a B+ summary. They nailed the mechanics (Universalism, Nihilism, Organicism, Vagueness) but fumbled the metaphysics (Fact vs. Language).

  *   **Trust your gut:** Van Inwagen thinks he found a hard fact.
  *   **Trust your skepticism:** Denying chairs is a huge cost, but it doesn't logically break the system.
  *   **Keep chewing:** The fact that you're wrestling with dust piles while doing dishes means you're already doing metaphysics. Van Inwagen would probably tell you that the "you" doing the dishes exists, but the "dishes" do not—only the simples arranged dishwise do.

  Enjoy the dishes.
