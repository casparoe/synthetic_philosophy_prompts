answer: |-
  You have hit on a fundamental distinction in evolutionary biology and biosemiotics, and your intuition is spot-on: the "cost = 0" explanation you heard on the forum is a significant oversimplification that muddies the water.

  The word you are looking for is **Index** (or **Indexical Signal**).

  This is not a made-up term; it is the standard technical counterpart to the **Handicap** (or Costly Signal). The distinction you noticed is the exact dividing line researchers use to categorize honest signaling systems.

  Here is the breakdown of the terminology, the boundaries, and why the line is messier than it looks.

  ### 1. The Terminology: Index vs. Handicap

  In the literature (most notably in John Maynard Smith and David Harper's 2003 book *Animal Signals*), honest signals are generally divided into three categories: **Indices**, **Handicaps**, and **Conventional Signals**. You are asking about the difference between the first two.

  **The Handicap (The Peacock)**
  *   **Mechanism:** Honesty is enforced by **cost**.
  *   **Logic:** The signal is physically possible for a low-quality individual to produce, but it would be too dangerous or metabolically expensive for them to survive doing so.
  *   **The "Affordability" Test:** A weak peacock *could* grow a big tail, but he would die of starvation or predation before mating. The signal is a "proof of wealth."
  *   **Key Theorist:** Amotz Zahavi (The Handicap Principle).

  **The Index (The Frog)**
  *   **Mechanism:** Honesty is enforced by **physical constraint**.
  *   **Logic:** The signal is physically linked to the trait being advertised. The physics of the sound-producing apparatus makes it impossible (or nearly impossible) for a low-quality individual to produce the signal.
  *   **The "Affordability" Test:** A small frog *cannot* make a deep sound, no matter how healthy he is. His vocal cords are too short. It isn't that he can't "afford" the energy; it's that the instrument won't play the note.
  *   **Key Concept:** The signal is a "proof of identity" or "proof of physics."

  ### 2. The Boundaries: Why "Cost = 0" is Wrong

  The forum poster who told you this is just a handicap with "cost set to zero" was trying to unify the math, but they lost the biological reality in the process. Here is why your distinction matters:

  In a **Handicap**, the cost is *differential*. It costs a weak bird *more* (in terms of survival risk) to hold the signal than it costs a strong bird. The honesty relies on that difference in marginal cost.

  In an **Index**, the cost of production might be non-zero (the frog burns calories croaking), but the cost is **not what guarantees honesty**. Even if calling were free, the small frog still couldn't lower his pitch. The honesty is guaranteed by anatomy, not economics.

  If you treat an Index as a Handicap with "zero cost," you imply that if the cost went up slightly, the small frog *would* start bluffing. But he can't. He is physically barred from bluffing. That is a qualitative difference, not just a quantitative one.

  ### 3. The Messy Middle: Is the line clean?

  You asked whether the line is clean or messy. It is **messy**.

  While "Index" and "Handicap" are useful buckets, nature loves hybrids. Here is where the distinction blurs:

  **A. Production Costs still exist**
  Even indexical signals cost energy to produce. A frog calling all night burns reserves. If the cost gets too high, even a big frog might stop calling. So, while the *pitch* is indexed (unfakeable), the *endurance* of the calling might be a handicap (only fit frogs can call for 6 hours).

  **B. Evolution finds loopholes (The "Cheating" Index)**
  You mentioned the frog call is unfakeable "even in principle." Evolutionary biologists are wary of the phrase "in principle." If there is a selective advantage to faking an index, animals often evolve workarounds.
  *   **Example:** Some frogs have inflatable vocal sacs. By inflating the sac larger than their body size would suggest, they can lower the resonance of their call slightly, effectively "bluffing" the index.
  *   **Example:** Some small cats (like cheetahs) cannot roar because their hyoid bone is ossified (hard), while big cats (lions) have a flexible hyoid. That is a hard anatomical index. But a lion might roar less frequently if it is injured, adding a handicap layer to the index.

  **C. The "Receiver" Cost**
  Some theorists argue that for *any* signal to be stable (even an index), there must be some cost to the *receiver* for ignoring it, or some cost to the *sender* if caught cheating. However, in pure indices, the "punishment" for cheating is immediate physical failure (the sound doesn't come out right), whereas in handicaps, the punishment is delayed (starvation/predation).

  ### 4. Summary of the Distinction

  | Feature | Handicap (Peacock) | Index (Frog Call) |
  | :--- | :--- | :--- |
  | **Honesty Guarantor** | Economic/Metabolic Cost | Physical/Anatomical Constraint |
  | **Can it be faked?** | Yes, but it's too expensive | No, the physics won't allow it |
  | **Relationship to Trait** | Correlated (via health) | Causal (via mechanics) |
  | **Semiotic Term** | Symbol / Icon | Index |
  | **Vulnerability** | Bluffing if health metrics change | Bluffing if anatomy is modified |

  ### 5. Recommendation

  If you want to read more on this specific distinction, the definitive text is **"Animal Signals" by John Maynard Smith and David Harper (2003)**.

  They explicitly define an **Index** as: *"A signal that cannot be faked because of a physical link between the signal and the quality being signaled."*

  They explicitly contrast this with the **Handicap**, where the link is maintained by selection pressures on cost.

  **Verdict:** You are not missing vocabulary; you have correctly identified the **Indexical Signal**. The forum poster was applying a "unified theory" lens that ignored the mechanical reality you observed. Your intuition that "there's nothing to afford" in the frog case is the precise definition of why it is an Index and not a Handicap.
