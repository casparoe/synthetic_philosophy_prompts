answer: |-
  Friends, family, colleagues. For the family here, I should explain that my friend has spent ninety years inside Latin poetry. For the colleagues, I should warn you that she is listening with the exacting ear she has always had. She will hear a misplaced adjective from across the room. So, I will be careful.

  I want to borrow a structure from an old Roman dialogue. In it, Cato lists four complaints people make against old age. He answers them all with serene confidence. I intend to take them up in order, but I will not be as confident as Cato. I will not be evasive, because she would despise it.

  The first complaint is that age removes us from public life. It is true, you have left the lecture hall. The students are gone. But you are not absent. Your work sits on shelves all over this city, and your voice is in the heads of everyone who teaches what you taught. You withdrew from the stage, but you wrote the script.

  The second complaint is that age ruins the body. This is not a metaphor. We know the legs do not carry you; we know the page is white where once there was text. Cato says the body is a vessel used up. I will only say that the vessel is battered, but the fire inside it has not gone out. You are here, and you are listening.

  The third complaint is that age takes away pleasure. Here, I must stop defending and start conceding. Cato argues that physical pleasure is a curse, and losing it is a liberation. I will not tell you that. You loved the sight of words. You loved the walk to the library. To say you are freed from wanting those things is a lie. You have been robbed of them. It is a hard loss, and we name it as such.

  The fourth complaint is that age brings death close. Cato comforts himself with the immortality of the soul. You have never believed in that, and I will not offer it now. Death is near. It is the end of the consciousness, not a doorway. There is no consolation in philosophy for this. There is only the fact of it.

  So, if I concede the loss of pleasure and the finality of death, where is the defense? It lies in one image Cato uses. He says Nature is a playwright who would not botch the last act of a play after composing the earlier ones so carefully. He trusts the playwright.

  We might not. We know Nature can be careless. We know the last act can be dark, and the writer might be lazy. But there is a dignity that does not depend on the playwright's skill. It depends on the actor's refusal to leave the stage poorly. You have not botched the performance. You sit at the head of this table, exacting and present, despite the script you were given.

  We do not need to trust the playwright to honor the performance. We are here because the play was worth watching.

  To my oldest friend.
