      *   *Instrumentalism/Anti-Realism:* Theories are tools; structure retention is just pragmatic continuity, not truth. (Colleague 3)
      *   *The Tension:* How do you display an equation without displaying what the equation was *about*? Is it possible to separate the map from the territory when the territory keeps changing?

  3.  **Drafting - Scene Setting:**
