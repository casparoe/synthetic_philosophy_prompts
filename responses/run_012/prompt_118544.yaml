prompt: |-
  I am the methods officer for a state environmental and public-health agency. Our advisory committees must commit, for each decision, to a single quantitative model; we cannot publish a decision as "somewhere between the models." Twice a month a committee faces rival models that fit the same body of evidence about equally well but disagree about the decision-relevant quantity, and the members have no training in the philosophy of science, so they settle it by seniority. I need a standing decision procedure I can hand them as a one-page annex, built on what the underdetermination literature actually establishes and honest about what it does not.

  The procedure should run in order, say what counts as an adequate answer at each step, and keep these distinctions alive: underdetermination that more data would dissolve versus one that any feasible study would leave standing; rivals that are equivalent in general versus rivals that are equivalent only with respect to the quantity we have to decide; and the holism problem that any model can be rescued by adjusting its auxiliaries, so "the evidence favors X" is always relative to a package someone chose. At each step it must mark whether that step is evidential or a judgment the committee is making -- how much to hedge, which error is worse -- and say who has to sign off when it is a judgment.

  Then run it on two cases: two transmission models of the same respiratory outbreak that fit the same case data but disagree about the benefit of closing schools; and two dose-response models behind a contaminant limit, one with a threshold and one without, where I suspect the procedure will tell us we cannot defend the stricter limit on evidential grounds alone. Close by telling me where the procedure will misfire and what it cannot decide. Separate what is settled in this literature from what is genuinely contested, and do not present a contested view as the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Methods Officer for a state environmental and public-health agency.
      *   **Problem:** Advisory committees face rival quantitative models that fit evidence equally well but yield different decisions. Currently, they decide by seniority (bad practice). They need a standing decision procedure (one-page annex style).
      *   **Constraints/Requirements:**
          *   Must commit to a *single* quantitative model for decisions (no averaging/hedging in the final output).
          *   Must be based on the *underdetermination literature* (philosophy of science).
          *   Must be honest about what the literature establishes vs. what it doesn't.
          *   Must distinguish: transient vs. permanent underdetermination; global vs. local equivalence; holism/auxiliaries.
          *   Must label steps as *Evidential* vs. *Judgment/Value*.
          *   Must specify sign-off authority for judgment steps.
          *   Must apply the procedure to two specific cases (School Closure/Transmission; Threshold/Dose-Response).
          *   Must conclude with limitations (where it misfires, what it can't decide).
          *   Must distinguish settled vs. contested philosophical claims (no false consensus).
      *   **Tone:** Professional, actionable, philosophically rigorous but accessible to non-philosophers.

  2.  **Deconstruct the Philosophy of Science (Underdetermination):**
      *   *Duhem-Quine Thesis:* Evidence tests a whole system (theory + auxiliaries), not a single hypothesis. (Settled/Standard).
      *   *Underdetermination of Theory by Data (UTD):* Multiple theories can fit the same data. (Settled).
      *   *Transient vs. Permanent:* Sometimes more data solves it (transient); sometimes structural differences mean no feasible data distinguishes them (permanent/inductive risk). (Mostly settled, but identifying *which* is hard).
      *   *Empirical Equivalence:* Are they equivalent everywhere or just regarding the target variable? (Crucial distinction).
      *   *Non-Evidential Virtues:* Simplicity, coherence, conservatism. (Contested: Do these track truth or just utility?).
      *   *Inductive Risk/Values in Science:* When evidence is insufficient, non-epistemic values (health, cost) *must* play a role in acceptance. (Heather Douglas, Rudner - Strong consensus that values play a role in *acceptance*, contested on *how* and *where*).
      *   *Model Selection:* AIC/BIC are evidential tools but rely on assumptions about the goal (prediction vs. truth).

  3.  **Drafting the Procedure (The "Annex"):**
      *   *Goal:* A step-by-step flow.
      *   *Structure:*
          1.  Check Empirical Equivalence (Local vs. Global).
          2.  Check Transience (Can more data help?).
          3.  Check Auxiliaries (Duhemian check).
          4.  If still tied -> Inductive Risk/Value Judgment.
      *   *Labels:* Evidential vs. Judgment.
      *   *Sign-off:* Who owns the value call? (Committee Chair/Agency Head).

  4.  **Refining the Philosophical Nuance:**
      *   *Avoid:* Claiming simplicity equals truth (contested).
      *   *Embrace:* Acknowledging that choosing a model for policy is a *decision under uncertainty*, not just a discovery of fact.
      *   *Distinction:* "Evidence favors X" is relative to the auxiliary assumptions chosen.
      *   *Constraint:* The user says they *must* pick one model. This forces a "Decision Rule" rather than "Model Averaging." This aligns with *Inductive Risk* arguments (Douglas): if the cost of being wrong is asymmetric, let that guide the choice when evidence is tied.

  5.  **Developing the Two Cases:**
      *   *Case 1 (Transmission/Schools):* Two models fit case data. One says close schools (high benefit), one says don't (low benefit).
          *   *Analysis:* Likely transient underdetermination (more contact tracing data could help), but if time-sensitive, it becomes a value judgment (precautionary principle vs. economic cost).
      *   *Case 2 (Dose-Response/Threshold):* Threshold vs. Linear No-Threshold (LNT). Fits existing data equally well in the observable range, diverges at low doses.
          *   *Analysis:* This is classic permanent underdetermination (cannot ethically test low doses on humans). Evidence *cannot* decide. Must rely on public health values (protect most vulnerable vs. economic cost of regulation). The prompt suspects the stricter limit can't be defended on *evidential* grounds alone. The procedure should confirm this: it requires a *value* commitment to precaution.

  6.  **Addressing Limitations & Contested Ground:**
      *   *Misfire:* When models are structurally incommensurable (different ontologies).
      *   *Can't Decide:* Which value system is "correct" (e.g., utilitarianism vs. rights-based).
      *   *Settled:* UTD exists; Values enter when evidence runs out.
      *   *Contested:* Whether non-epistemic values corrupt science or are necessary for it; whether simplicity is truth-conducive.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Header:* Make it look like an annex.
      *   *Steps:* Numbered, clear criteria.
      *   *Tags:* [EVIDENCE] vs. [JUDGMENT].
      *   *Sign-off:* Specific roles.
      *   *Case Studies:* Apply the steps rigorously.
      *   *Commentary:* Be honest about the philosophy.

  8.  **Self-Correction/Review against Constraints:**
      *   *Did I allow "somewhere between"?* No, the prompt says they *must* commit to a single model. The procedure must force a choice.
      *   *Did I distinguish transient/permanent?* Yes, in Step 2.
      *   *Did I distinguish local/global equivalence?* Yes, in Step 1.
      *   *Did I address holism?* Yes, in Step 3 (Auxiliaries).
      *   *Did I mark Evidential vs. Judgment?* Yes, explicitly.
      *   *Did I identify sign-off?* Yes.
      *   *Did I separate settled/contested philosophy?* Yes, in the concluding commentary.

  9.  **Final Polish:** Ensure the tone is bureaucratic yet intellectually honest. Avoid jargon where possible, but keep the philosophical distinctions precise (e.g., "Inductive Risk"). *Self-correction:* Make sure I don't imply the procedure *solves* underdetermination, but rather *manages* it transparently.

  10. **Final Output Structure:**
      *   Introduction (Context).
      *   The Annex (The Procedure).
      *   Application to Case 1 (Schools).
      *   Application to Case 2 (Contaminant).
      *   Philosophical Commentary (Settled vs. Contested, Limitations).

  *(Self-Correction during drafting the Annex)*: I need to make sure Step 4 doesn't just say "pick the safer one." It needs to acknowledge that "safer" is a value judgment. The sign-off must reflect that this is no longer pure science.

  *(Self-Correction on Case 2)*: The prompt suspects the procedure will show the stricter limit lacks evidential support. I need to ensure the analysis confirms this: if the data fits both, the choice for the stricter limit is *value-driven* (precaution), not *evidence-driven*.

  *(Self-Correction on Philosophy)*: Be careful not to present the "Values in Science" (Douglas/Longino) view as the *only* view, but as the most pragmatic for policy. Acknowledge the "Value-Free Ideal" is largely rejected in policy contexts but still held by some scientists.

