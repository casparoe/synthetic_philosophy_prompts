answer: |-
  **MEMORANDUM**

  **TO:** Advisory Committee Chairs
  **FROM:** Methods Officer
  **SUBJECT:** Annex B – Procedure for Model Selection Under Empirical Equivalence
  **DATE:** October 26, 2023

  ### **PURPOSE**
  When rival quantitative models fit the available evidence equally well but yield different decision-relevant outputs, the Committee cannot average them. You must select one model to anchor the decision. This procedure distinguishes questions of **evidence** (what the data supports) from **judgment** (which error is less acceptable). It prevents selection by seniority or hidden value assumptions.

  ### **THE PROCEDURE**

  **STEP 1: Local vs. Global Equivalence [EVIDENTIAL]**
  *   **Question:** Do the models disagree *only* on the specific policy variable (e.g., benefit of closure), or do they make divergent predictions about other observable phenomena not yet measured?
  *   **Adequate Answer:** A list of at least two observable quantities where Model A and Model B yield divergent predictions.
  *   **If Models are Globally Equivalent:** Proceed to Step 2.
  *   **If Models are Locally Equivalent (diverge elsewhere):** The Committee must request data on those divergent quantities before proceeding.
  *   **Sign-off:** Committee Technical Lead.

  **STEP 2: Transient vs. Permanent Underdetermination [EVIDENTIAL]**
  *   **Question:** Is the tie caused by a lack of data that is *feasible* to collect within the decision timeframe, or is the tie structural (no feasible data could distinguish them)?
  *   **Adequate Answer:** A statement on feasibility. "We could distinguish these if we had X data, which costs $Y and takes Z time."
  *   **If Transient (Data is feasible):** Delay decision to acquire data.
  *   **If Permanent (Data is infeasible/too slow):** Proceed to Step 3.
  *   **Sign-off:** Committee Chair.

  **STEP 3: Auxiliary Assumptions Check [EVIDENTIAL]**
  *   **Question:** Does the fit depend on adjustable "auxiliary" parameters (e.g., noise assumptions, background rates) that were tuned differently to make the models fit?
  *   **Adequate Answer:** Disclosure of which auxiliaries were fixed vs. tuned for each model.
  *   **Finding:** If Model A requires implausible auxiliaries to fit while Model B does not, select Model B. If both require equal tuning, the tie stands. Proceed to Step 4.
  *   **Sign-off:** Committee Technical Lead.

  **STEP 4: Inductive Risk Assessment [JUDGMENT]**
  *   **Question:** Since evidence cannot decide, which error is more harmful to public health/mission: False Positive (regulating unnecessarily) or False Negative (failing to regulate a harm)?
  *   **Adequate Answer:** A explicit statement of the "Cost of Error." *Example: "The cost of unnecessary closure is economic; the cost of unnecessary exposure is morbidity. We prioritize avoiding morbidity."*
  *   **Action:** Select the model that minimizes the more harmful error identified above.
  *   **Sign-off:** **Agency Head / Director** (This is a value judgment, not a scientific finding).

  **STEP 5: Documentation [ADMINISTRATIVE]**
  *   **Requirement:** The final decision document must state: "Model X was selected not because it is proven true, but because under Step 4, its error profile aligns with Agency values."
  *   **Sign-off:** Methods Officer.

  ***

  ### **APPLICATION TO CASES**

  #### **Case 1: Respiratory Outbreak (School Closure)**
  *   **Scenario:** Model A (High Transmission) says close schools. Model B (Low Transmission) says keep open. Both fit current case counts.
  *   **Step 1 (Local/Global):** They likely diverge on secondary attack rates in households. *Action:* Check if household data exists. If yes, use it. If no, tie stands.
  *   **Step 2 (Transient/Permanent):** New data takes 3 weeks; decision needed in 3 days. *Classification:* Transient but infeasible. Proceed.
  *   **Step 3 (Auxiliaries):** Model A assumes homogeneous mixing; Model B assumes age-structured mixing. Both are plausible simplifications. Tie stands.
  *   **Step 4 (Inductive Risk):**
      *   Error 1 (Follow B, A was right): Surge in cases, hospital overload.
      *   Error 2 (Follow A, B was right): Economic/educational loss.
      *   *Judgment:* If Agency mandate prioritizes mortality/morbidity over economics, select Model A.
  *   **Outcome:** Selection of Model A is defensible, but **only** as a value commitment to health security over economic disruption.
  *   **Sign-off:** Agency Director must sign Step 4.

  #### **Case 2: Contaminant Limit (Threshold vs. No-Threshold)**
  *   **Scenario:** Model A (Threshold) says safe limit is 10ppm. Model B (Linear No-Threshold) says safe limit is 0ppm (stricter). Both fit high-dose animal data equally well.
  *   **Step 1:** They diverge at low doses. Low-dose data is biologically obscured by background noise.
  *   **Step 2:** Collecting low-dose human data is unethical/infeasible. *Classification:* Permanent Underdetermination.
  *   **Step 3:** Both require auxiliaries regarding metabolic saturation. Neither is clearly superior.
  *   **Step 4:**
      *   Error 1 (Follow A, B was right): Cancer cases at "safe" limit.
      *   Error 2 (Follow B, A was right): High economic cost for negligible risk reduction.
      *   *Judgment:* To select Model B (Stricter), the Committee must explicitly state they prioritize avoiding *any* potential cancer case over economic cost.
  *   **Outcome:** You are correct. **You cannot defend the stricter limit on evidential grounds alone.** The evidence underdetermines the low-dose region. Choosing the stricter limit is a **precautionary value judgment**, not a scientific conclusion.
  *   **Sign-off:** Agency Director must sign Step 4. If they refuse, you must default to the less restrictive model (Model A) to avoid regulating without evidential warrant.

  ***

  ### **PHILOSOPHICAL COMMENTARY & LIMITATIONS**

  **What This Procedure Relies On (Settled Literature)**
  1.  **Duhem-Quine Thesis:** It is settled that evidence tests a "package" (model + auxiliaries), not a model in isolation. Step 3 acknowledges this.
  2.  **Underdetermination:** It is settled that data can be insufficient to distinguish rivals (UTD). Step 2 acknowledges this.
  3.  **Inductive Risk:** It is widely accepted in policy philosophy (e.g., Heather Douglas, Rudner) that when evidence is insufficient, non-epistemic values (health, cost) *must* determine acceptance to avoid arbitrary choice. Step 4 operationalizes this.

  **What This Procedure Cannot Decide (Contested/Limitations)**
  1.  **The "Truth" Claim:** This procedure does not tell you which model is *true*. It tells you which is *safer to act upon*. Do not claim the selected model is "verified."
  2.  **Value Hierarchy:** The procedure cannot tell you if Health *should* trump Economics. That is a political/moral question. If the Agency Head refuses to sign Step 4, the procedure halts.
  3.  **Simplicity Virtues:** You may be tempted to pick the "simpler" model. Philosophy of science is **contested** on whether simplicity tracks truth or is merely pragmatic. This procedure excludes simplicity as a tie-breaker to avoid hiding value judgments as "mathematical elegance."
  4.  **Incommensurability:** If the models use fundamentally different concepts (e.g., one treats risk as probability, the other as possibility), Step 1 may fail. The procedure assumes rivals are quantitatively comparable.

  **Where It Will Misfire**
  *   **Political Pressure:** If leadership demands a specific outcome, they may manipulate Step 3 (Auxiliaries) to make one model look "evidentially" superior when it is not. The Methods Officer must audit Step 3.
  *   **False Precision:** Step 4 requires quantifying "harm." If harms are qualitatively different (e.g., species extinction vs. job loss), the Committee may struggle to articulate the trade-off.

  **Summary for the Committee**
  This annex does not solve underdetermination. It makes the resolution of underdetermination transparent. It shifts the burden of proof from "Which model is true?" to "Which error can we least afford?" When you sign Step 4, you are not acting as scientists; you are acting as stewards of public trust.
