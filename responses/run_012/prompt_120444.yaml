      *   Move to the Aesthetic choices: Absences and Humanity.
      *   Conclude.

      *(Self-Correction)*: I need to be careful not to say the film proves Hitler was the *only* cause of WWII. The prompt is about "Nazi Germany" specifically. The film focuses on the *end*, which reveals the nature of the *beginning*. The collapse reveals the architecture.

      *(Refining the "Humanizing" point)*: The critique is that making him human makes him relatable. The counter-argument is that making him a monster makes him inevitable (a force of nature). The film chooses the former to emphasize agency.

      *(Refining the Verdict)*: The film supports the "Great Man" view but redefines "Great" not as capacity, but as structural centrality. The User wins, but with a nuance: It wasn't his greatness, it was the system's dependency.

