      *   End with verdict? (Check)

  7.  **Final Polish:** (Mental walk-through of the argument flow).
      *   Start with the tension: The room is small (Great Man), the war is huge (Structure).
      *   Move to the causal mechanics: Overdetermination vs. But-For.
