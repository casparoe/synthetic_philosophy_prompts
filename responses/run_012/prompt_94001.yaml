      *   **Context:** A fight with a best friend about a guy who walked out on his family. Friend says: No internal care = no reason to stay. User says: The kid *is* a reason, regardless of care.
      *   **Background:** User has a philosophy minor, recognizes "internal vs. external reasons," but forgot the specifics.
