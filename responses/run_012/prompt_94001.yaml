      *   *Correction:* Ensure the "Coerced Belief" case is handled correctly. You can't believe on command. So you can't have a reason to *believe*, only to *try to bring about belief*. This distinguishes practical vs. theoretical reason.
      *   *Correction:* On the "Body in the Basement": Bernard Williams' "Internal Reasons" paper is the landmark. The requirement that kills Externalism is "Reasons must be able to explain action." The requirement that kills Internalism is "Reasons must be able to criticize action."
      *   *Decision:* The single most damaging requirement is **The Requirement of Critical Leverage.** (The ability to say someone is wrong, not just different).

  10. **Final Polish:** Check tone. Needs to be empathetic but analytical. "Here is the map of the minefield."

