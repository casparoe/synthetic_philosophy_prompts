prompt: |-
  my best friend and i got into a dumb fight last weekend about a guy we both know who walked out on his family, and he kept insisting that because the guy never really cared about them, he literally had no reason to stay -- not that he was excused, just that there was nothing there to be a reason for him. i said that's nuts, the kid is a reason whether or not he feels like it, and we went in circles for an hour until i realised i couldn't actually say what would settle it. i did a minor in philosophy years ago so i know this is a real argument people have (internal vs external reasons, right?) but i genuinely don't remember what the argument is *about*. i don't want to go back at him with vibes.

  so before i do: what would a theory of reasons for action actually have to deliver to be worth taking seriously? i want the full spec -- the cases it has to get right, the ones it can't just wave away, the distinctions it can't collapse, each requirement paired with the case that forces it -- and then your take on which of those are real requirements and which are just one side's prejudices dressed up as neutral. i'm pretty sure i need it spelled out for the specific purpose of settling an argument between two stubborn people who aren't going to accept "well that's just, like, your intuition." the cases i keep tripping on, if that helps: the dad who doesn't care about his kid; someone whose reason for doing something rests entirely on a false beleive; a person who genuinely has no wants left at all, so does he have no reason to eat?; and the one that really messes me up -- someone threatens you unless you admire them, or offers you money to believe something, and it seems like you *do* have a reason, just an awful kind of one. also, if some of these requirements can't be met together by any theory, please say so, because that might be the actual answer to my friend. and tell me which single requirement does the most damage to the most popular positions -- i'd rather find out where the bodies are buried than get a scorecard.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

