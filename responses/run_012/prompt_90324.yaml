answer: |-
  You have identified a gap in the standard behavioral economics vocabulary. Terms like *hyperbolic discounting* explain the *mechanism* of the preference shift (why now feels more urgent than later), and *commitment devices* explain the *tool* (how you restrict options). But neither captures the **directionality of agency** you're describing.

  In the standard model, the "Present Self" is usually depicted as weak (succumbing to temptation) or farsighted (binding itself). You are describing a scenario where the Present Self is neither weak nor farsighted, but **predatory**. It treats the Future Self not as a beneficiary to be protected, but as a resource to be mined.

  Here is the distinction, the terminology, and the game-theoretic fallout.

  ### 1. The Terminology

  There is no single established term for the exploitative direction specifically. The closest academic phrasing is "negative internalities" or "inter-temporal externalities," but those are dry and don't capture the agency.

  To sort these cases tightly, I propose this pair:

  **A. Temporal Stewardship (The Snack/Charger Move)**
  *   **Definition:** The Present Self restricts its own options to increase the *total* utility of the timeline, disproportionately benefiting the Future Self.
  *   **Dynamic:** Investment. The Present Self pays a cost (inconvenience) to grant the Future Self a dividend (health, focus).
  *   **Consent:** The Future Self would ratify this decision in a calm moment.

  **B. Temporal Extractivism (The 6am Call/Essay Move)**
  *   **Definition:** The Present Self restricts or burdens the Future Self's options to increase the *Present* utility, exporting the costs forward.
  *   **Dynamic:** Divestment. The Present Self takes a dividend (calm, money, sleep) and assigns the debt to the Future Self.
  *   **Consent:** The Future Self would veto this decision if they had voting power at the time of the agreement.

  **The Pair:** **Temporal Agency Asymmetry**.
  This covers the whole phenomenon: the fact that the Present Self holds all the legislative power, while the Future Self holds only the executive burden.

  ### 2. Defining the Edge

  You asked: *Is the edge just whether the later you would sign off on it in advance and in a calm moment?*

  **No.** That is the **Veil of Ignorance** test, and it is necessary but not sufficient.

  Consider the "Adrenaline Writer" (your essay example). If you leave the essay to the night before, and the essay gets an A because the pressure made you focus, the Future Self might "sign off" on the result. The grade is good. But it is still **Extractivism** if the *risk* was uncompensated.

  **The True Edge: Risk-Adjusted Net Utility**
  The distinction lies in who bears the downside risk and who captures the upside.

  *   **Stewardship:** Present Self bears the downside (inconvenience of the chair); Future Self captures the upside (not eating junk).
  *   **Extractivism:** Present Self captures the upside (calm afternoon); Future Self bears the downside (panic, sleep deprivation, health cost).

  **The Edge Case:**
  Imagine you book the 6am call. The Future Self gets up, does the call, gets the money. Everyone is happy. Is it Extractivism?
  *   **Yes,** if the Present Self booked *three* 6am calls in a week, knowing the Future Self would collapse on the third. The Present Self is harvesting the "easy" futures and leaving the "crash" future to deal with the systemic failure.
  *   **No,** if the Present Self booked the call *and* prepared the materials fully, so the Future Self's only job is to wake up and talk.

  **The Litmus Test:**
  Ask: **"If the Future Self could strike, would they?"**
  *   In Stewardship, the Future Self is grateful.
  *   In Extractivism, the Future Self is holding the bag. Even if they succeed, they are operating under duress created by the Past Self.

  ### 3. The Game Theory of Fighting Back

  You asked: *What happens if the later me wises up and starts laying traps back?*

  When the Future Self realizes they are being exploited by the Past Self, the relationship shifts from a **Cooperative Sequential Game** to a **Non-Cooperative Sequential Game**.

  In Game Theory terms, you are moving from a **Pareto Optimal** equilibrium (everyone wins) to a **Nash Equilibrium of Defection** (everyone plays to minimize their own loss, resulting in a worse outcome for the whole).

  **The Mechanism: Intrapersonal Defection**
  Since the Future Self cannot literally punish the Past Self (time only moves forward), they punish the *Past Self's plans*.
  *   **Example:** You book the 6am call (Past Self exploitation). The Future Self (now Present) feels resentment. They don't just wake up tired; they subconsciously sabotage the call. They are vague, they forget a document, they sound groggy.
  *   **Why?** Because the "Self" is no longer a single agent maximizing lifetime utility. It is a chain of agents. If Agent T (Time) knows Agent T-1 exploited them, Agent T has no incentive to cooperate with Agent T+1.

  **The Term for the Counter-Move:**
  This is **Mutually Assured Destruction (MAD)** applied to time.
  If I know my Future Self will sabotage me out of spite/fatigue, I (Present Self) might over-compensate by being even *more* controlling. This leads to an **Intertemporal Arms Race**.
  *   **Move:** Present Self locks the snacks.
  *   **Counter-Move:** Future Self orders takeout to be delivered at 11pm.
  *   **Counter-Counter-Move:** Present Self blocks food delivery apps.

  **The Outcome:**
  This is called **Internal Conflict Costs** or **Agency Friction**.
  In a healthy system (Stewardship), the transaction cost between time-slices is near zero. In an exploitative system (Extractivism), the transaction costs skyrocket. You spend energy managing the conflict between who you were and who you are, rather than doing the work.

  ### Summary for Sorting Cases

  To use this framework, apply these three filters to any "arrangement of the future":

  1.  **Direction of Utility:** Does the arrangement store value for later (Stewardship) or spend value now to be paid later (Extractivism)?
  2.  **Risk Allocation:** If things go wrong, who suffers? (Stewardship = Present suffers; Extractivism = Future suffers).
  3.  **Ratification:** If the Future Self had a veto vote at the moment of planning, would they use it?

  If it fails #1 and #2, it is **Temporal Extractivism**.
  If the Future Self starts sabotaging the plan because of it, you have entered **Intrapersonal Defection**.
  The only way to resolve it is not better commitment devices, but a **Temporal Treaty**: The Present Self agrees not to extract, and the Future Self agrees not to sabotage. This requires treating your future self not as a resource, but as a partner.
