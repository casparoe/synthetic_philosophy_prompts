prompt: |-
  I run case review for a professional regulator. We handle a few hundred complaints a year against nurses and social workers, and our case handlers apply a written code of conduct — our codes numbered rules, plus a line at the front saying handlers should use judgement. Two things keep happening. Handlers want to bend the rules for sympathetic people (she only did it to ease the patient's pain, she was exhausted, her manager told her to). And they also want to come down hard on conduct that stays inside the letter of the rules but is obviously rotten. I read a bit about moral particularism last month and it's scrambled my head: if principles don't decide cases on their own, what is our code even for?

  Write me a decision procedure a handler can actually run on one case: the questions to ask in order, what counts as a good enough answer to each, where it stops with a definite no, and where it hands off to the panel because the question is one of values rather than facts. Handlers get about two weeks per case and a panel referral adds three months, so it can't just say refer anything hard.

  Two distinctions it has to get right: a rule not covering a case versus a rule covering it and being outweighed; and the fact that one and the same feature (patient consented, clinician was following an instruction) can count for or against depending on the case. Then run it on three cases — a nurse who took leftover opioids to a dying patient at home without a prescription, a clinician who followed the code to the letter while humiliating a patient, and a well-liked senior practitioner everyone would prefer we handled quietly — and include at least one where it lands somewhere I won't like. Finally, mark which steps are judgement dressed up as procedure, and say what the procedure can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Context:** Professional regulator (nurses/social workers), hundreds of complaints/year.
      *   **Problem:** Case handlers want to bend rules for sympathetic reasons (mitigation vs. breach) and punish "rotten" conduct that technically follows rules. They are confused by moral particularism (principles vs. judgment).
      *   **Task:** Create a concrete decision procedure (step-by-step questions) for handlers.
      *   **Constraints:**
          *   Must distinguish between "rule doesn't cover" vs. "rule covered but outweighed."
          *   Must acknowledge that features (consent, instruction) can count for or against depending on context.
          *   Must be efficient (2 weeks/case, avoid unnecessary 3-month panel referrals).
          *   Must run the procedure on three specific cases (Opioid nurse, Humiliating clinician, Popular senior).
          *   Must include at least one outcome the user won't like (uncomfortable truth).
          *   Must identify where judgment is disguised as procedure.
          *   Must state what the procedure *cannot* do.

  2.  **Deconstruct the Philosophical Tension (Particularism vs. Codification):**
      *   *The User's Dilemma:* If principles don't decide cases, why have a code?
      *   *The Solution:* The code provides *presumptive* reasons, not algorithmic determinants. It sets the default position. Particularism says the *valence* of a reason (positive/negative) can change based on context. The procedure needs to capture this without collapsing into "do whatever you feel."
      *   *Key Distinction:* Breach vs. Sanction. A rule breach is a finding of fact/interpretation. Mitigation/Aggravation affects the *outcome* (sanction), not necessarily the *finding*. However, the prompt implies handlers are conflating "did they break the rule?" with "should we punish them?"
      *   *Refinement:* The procedure needs to separate *Liability* (Did they fall below the standard?) from *Sanction* (What do we do about it?). But the prompt specifically mentions handlers wanting to find *no breach* for sympathetic people or *breach* for rotten people who followed the letter. This suggests the "Standard of Conduct" itself needs a flexibility mechanism.
      *   *Strategy:* Use a "Defeasible Rule" model. The Code creates a presumption. The handler looks for *defeaters* (reasons why the rule doesn't apply here) or *aggravators* (reasons why the spirit is violated despite the letter).

  3.  **Drafting the Decision Procedure (The "Algorithm"):**
      *   *Goal:* Stop handlers from skipping to "she's nice" before establishing breach. Stop them from hiding behind "she followed the rule" when the rule was abused.
      *   *Step 1: The Prima Facie Breach.* Does the conduct fit the description of a rule violation? (Yes/No).
      *   *Step 2: Contextual Valence.* Do the specific features (consent, instruction) flip the moral valence of the act? (This addresses the "same feature counts for/against" requirement).
      *   *Step 3: The "Spirit" Check.* If the letter is followed, is the *purpose* of the rule defeated? (Addresses the "rotten but legal" issue).
      *   *Step 4: The "Sympathy" Check.* If the letter is broken, is there a *justification* (not just an excuse)? (Addresses the "bend rules for sympathetic" issue).
      *   *Step 5: Referral Threshold.* When is this too value-laden for a handler?

      *Refining the Steps for Efficiency:*
      *   Need to make sure "Judgment" is boxed in.
      *   Need to ensure the "Rule vs. Outweighed" distinction is clear.
      *   *Revision:* Let's structure it as a funnel.
          1.  **Mapping:** Which rule applies?
          2.  **Valence Check:** Do the contextual features invert the rule's intent? (Crucial for the "consent/instruction" requirement).
          3.  **Breach Determination:** Did the conduct fall below the standard *all things considered*?
          4.  **Public Interest/Sanction:** If breach, does public protection require action? (This is where sympathy usually belongs, not in breach finding).
      *   *Correction:* The prompt says handlers want to *bend the rules* (find no breach) for sympathetic people. I need to stop that. Sympathy belongs in Sanction, not Liability. *However*, the prompt also asks to address "rule covering it and being outweighed." This implies some rules *can* be ethically outweighed.
      *   *Decision:* I will structure the procedure to force a finding of "Breach" first, then allow for "Justification/Exception" only on specific ethical grounds, not emotional sympathy. This separates "I broke the rule but it was right" from "I broke the rule but I'm sad."

  4.  **Developing the Three Test Cases:**
      *   *Case 1: Opioid Nurse.* (Sympathetic breach). Rule: No drugs without prescription. Action: Gave drugs to ease pain. Outcome: Breach found (Safety paramount), but Sanction reduced. *Wait, user wants an outcome they won't like.* Maybe the procedure forces a "No Breach" finding because the ethical duty to relieve suffering outweighs the administrative rule? Or maybe it forces a "Breach" despite the sympathy, leading to a sanction the user thinks is too harsh? Let's aim for: Procedure finds Breach, requires Panel for Sanction. User might dislike the rigidity.
      *   *Case 2: Humiliating Clinician.* (Legal but rotten). Rule: Treat with dignity. Action: Technically followed protocol but was cruel. Outcome: Breach found via "Spirit Check."
      *   *Case 3: Popular Senior.* (Status bias). Rule: Maintain public confidence. Action: Misconduct known locally. Outcome: Procedure forces public hearing. User won't like this (loss of discretion to handle quietly).

  5.  **Addressing the Philosophical Constraints:**
      *   *Particularism:* Acknowledge that rules are "reasons" not "commands."
      *   *Judgment vs. Procedure:* Explicitly label where human intuition is required.
      *   *Efficiency:* Keep the steps binary where possible to avoid panel referral unless necessary.

  6.  **Writing the Content - Section by Section:**

      *   **Introduction:** Validate the user's confusion. Particularism doesn't mean "anything goes," it means "context changes the weight of reasons."
      *   **The Procedure (The "Defeasible Standard Protocol"):**
          *   Step 1: Rule Identification (Fact).
          *   Step 2: Valence Assessment (Judgment). *This handles the "consent/instruction" variable.*
          *   Step 3: The "Letter vs. Spirit" Test (Judgment). *This handles the "rotten but legal" issue.*
          *   Step 4: The "Justification" Filter (Strict). *This handles the "sympathetic breach" issue. Distinguish Justification (ethical necessity) from Excuse (human weakness).*
          *   Step 5: The Referral Gate (Efficiency).
      *   **Running the Cases:**
          *   *Opioid Nurse:* Breach found. Justification rejected (safety > pain). *Outcome:* Sanction needed. (User might dislike the lack of mercy in the *finding*, even if sanction is light).
          *   *Humiliating Clinician:* Breach found via Spirit Test. (User likes this).
          *   *Popular Senior:* Breach found. Public interest requires publicity. (User *won't* like this because they wanted to handle quietly).
      *   **Meta-Analysis:**
          *   Where is judgment disguised? (Step 2 & 3).
          *   What can't it do? (Resolve fundamental value conflicts, predict public reaction perfectly).

  7.  **Review against Constraints:**
      *   *Distinguish rule not covering vs. outweighed?* Yes, Step 2 vs Step 4.
      *   *Feature valence (consent/instruction)?* Yes, Step 2 explicitly asks if the feature inverts the norm.
      *   *Three cases?* Yes.
      *   *One outcome user won't like?* Yes (The Senior Practitioner case - forces public action).
      *   *Mark judgment vs. procedure?* Yes, in the final section.
      *   *Efficiency?* Yes, limits panel referrals to Step 5 only.

  8.  **Refining the "Uncomfortable Outcome":**
      *   The user mentioned "everyone would prefer we handled quietly." If the procedure works, it should force a public sanction because public confidence is the regulatory mandate. This directly challenges the user's desire for discretion. This is the right "uncomfortable" outcome.

  9.  **Refining the "Opioid Case":**
      *   To make it philosophically robust: The procedure should acknowledge that *sometimes* rules are outweighed. But for opioids, the risk is too high. So the procedure says "Breach." The "uncomfortable" part could be that the procedure *doesn't* allow the handler to close the case with "no further action" based on sympathy alone. It forces a sanction decision.

  10. **Final Polish:** Ensure tone is professional, empathetic to the handler's burden, but firm on the regulatory mandate. (Self-Correction: Make sure the distinction between *Liability* and *Sanction* is clear, as regulators often conflate them. The procedure should focus on Liability (Breach), as Sanction is usually a panel decision anyway. Wait, the prompt says "panel referral adds three months." Handlers want to avoid that. So handlers need to be able to close cases *or* refer. I need to make sure the procedure allows closing a case *if* there is no breach, even if sympathetic. But if there is a breach, it must go to panel? Or can handlers decide sanction? Usually, handlers investigate, Panels adjudicate/sanction. I will assume Handlers recommend/decide on *whether* there is a case to answer. If "Case to Answer," it goes to Panel. This makes the "No Breach" decision critical for efficiency.)
      *   *Correction:* If the handler finds a breach, it usually goes to a hearing. If the handler finds *no* breach, it closes. The temptation is to find *no* breach for sympathetic people to save time/mercy. The procedure must prevent this. It must force a "Breach" finding if the rule was broken, even if the sanction might be light later. *However*, to save the 3-month panel delay, maybe there's a "Consent Order" or "Undertaking" route? I'll stick to the prompt's constraint: "Panel referral adds three months." So the handler wants to avoid referral.
      *   *Strategy:* The procedure must allow a "No Further Action" outcome *only* if there is no breach OR if the breach is de minimis/public interest doesn't require it. This gives the handler the "out" for the Opioid nurse without breaking the rules (Public Interest test).
      *   *Wait, the "Uncomfortable Outcome":* The Senior Practitioner. If the procedure works, it forces a referral because public confidence is high. The user wants to handle quietly. The procedure says "No." That works.

  11. **Final check on Particularism:** Ensure I explain that the Code provides *reasons* that have default weight, but Step 2 allows for context to shift that weight.

  12. **Drafting the response.** (Proceeding to generate output based on these thoughts).
answer: |-
  ### The Problem: Principles vs. Judgment

  You are experiencing the tension between **Generalism** (rules apply everywhere) and **Particularism** (context determines the moral weight of an action). Your handlers are treating the Code as an algorithm (if X, then Y) when it is actually a repository of *presumptive reasons*.

  A rule like "Do not administer medication without prescription" provides a strong reason *against* acting. But in a specific context (dying patient, no time, pure palliative intent), that reason might be outweighed by the reason "Prevent suffering." Particularism doesn't mean "ignore the code." It means "the code tells you what counts as a reason, but not always how much that reason weighs in this specific situation."

  To stop handlers from substituting their own feelings for the Code, you need a procedure that forces them to articulate *why* a reason is being outweighed, rather than just feeling it.

  Below is the **Defeasible Standard Protocol (DSP)**. It is designed to be run in under two weeks. It separates *Liability* (did they breach the standard?) from *Public Interest* (does this require a sanction?).

  ***

  ### The Defeasible Standard Protocol (DSP)

  **Instructions:** Complete steps 1–5. If you stop at Step 3 with "No Breach," the case closes (saves 3 months). If you reach Step 5, you must refer to Panel. Do not skip steps.

  #### Step 1: The Prima Facie Match (Fact)
  **Question:** Does the conduct, described purely physically, fit the description of a specific Code rule?
  *   *Example:* "Administered controlled drug" matches "Do not administer without prescription."
  *   *Example:* "Spoke loudly in waiting room" matches "Treat with dignity."
  *   **Stop Condition:** If **NO**, there is no case. Close file.
  *   **Pass Condition:** If **YES**, proceed to Step 2.
      *   *Note:* This establishes the rule is *relevant*. It does not yet establish a breach.

  #### Step 2: Valence Assessment (Judgment)
  **Question:** Do the specific contextual features invert the moral direction of the rule in this instance?
  *   *Instruction:* A feature (e.g., "Manager told me to") usually counts *against* the professional (abrogation of responsibility). In rare cases, it counts *for* them (coercion/emergency protocol).
  *   *Instruction:* A feature (e.g., "Patient consented") usually counts *for* the professional (autonomy). In rare cases, it counts *against* (exploitation/vulnerability).
  *   **Test:** Write one sentence explaining why this feature makes the act *better* or *worse* than the default assumption of the rule.
  *   **Stop Condition:** If the feature does not invert the valence (e.g., "Manager told me to" is just an excuse), the Prima Facie breach stands. Proceed to Step 3.
  *   **Pass Condition:** If the feature *does* invert the valence (e.g., "Patient consented" transforms a touch from assault to care), the rule may not cover this case. Proceed to Step 3.

  #### Step 3: The "Letter vs. Spirit" Test (Judgment)
  **Question:** If the conduct fits the *letter* of the rule, does it defeat the *purpose* of the rule? (Or vice versa: If it breaks the letter, does it fulfill the purpose?)
  *   *Purpose Check:* What is the underlying value of this rule? (e.g., Safety? Dignity? Trust?)
  *   *The "Rot" Test:* If the professional followed the rule technically but undermined the value (e.g., used privacy rules to hide negligence), mark **Breach**.
  *   *The "Necessity" Test:* If the professional broke the rule technically but upheld the higher value (e.g., broke privacy to save a life), mark **Potential Justification**.
  *   **Decision:**
      *   If **Breach**: Proceed to Step 4.
      *   If **Potential Justification**: Proceed to Step 4.
      *   If **No Breach** (Rule simply doesn't apply to this context): Close file.

  #### Step 4: The Justification Filter (Strict)
  **Question:** Is the reason for the conduct a *Justification* or an *Excuse*?
  *   **Justification:** "I did this because it was the *right thing to do* ethically, even if prohibited." (e.g., Gave opioid to stop agonizing pain when prescription was delayed).
  *   **Excuse:** "I did this because I was *unable to do the right thing*." (e.g., Gave opioid because I was tired/empathetic/pressured).
  *   **Constraint:** Sympathy, exhaustion, and good intentions are **Excuses**. They do not negate a Breach. They belong in Sanction, not Liability.
  *   **Decision:**
      *   If **Excuse only**: Breach Confirmed. Proceed to Step 5.
      *   If **Justification**: You may find **No Breach**, BUT you must document why the ethical duty outweighed the regulatory rule. Proceed to Step 5 (for audit).

  #### Step 5: The Public Interest Gate (Efficiency)
  **Question:** Given the Breach (or Justified Breach), does public confidence require a Panel hearing?
  *   **Test:** If we close this quietly, would the public feel protected if they knew?
  *   **Decision:**
      *   If **NO** (Minor, isolated, no risk of recurrence): Handler can issue Advice/Warning. Close file.
      *   If **YES** (Systemic, serious, or high profile): **Refer to Panel.** (Accept the 3-month delay).

  ***

  ### Running the Protocol: Three Cases

  #### Case 1: The Opioid Nurse (Sympathetic Breach)
  *   **Facts:** Nurse took leftover opioids from clinic to dying patient's home. No prescription. Patient in agony.
  *   **Step 1 (Match):** Yes. "Administered controlled drug without prescription."
  *   **Step 2 (Valence):** "Patient suffering" is a feature. Does it invert the rule? The rule exists for safety. The action served care. Valence is mixed. Proceed.
  *   **Step 3 (Spirit):** Purpose of rule is safety/prevention of abuse. Purpose of profession is relief of suffering. The act fulfilled the professional purpose but violated the safety mechanism. Mark **Potential Justification**.
  *   **Step 4 (Filter):** Was this a Justification or Excuse? She chose to break the law to relieve pain. This is a **Justification**.
      *   *Handler Decision:* **No Breach.** (The ethical duty outweighed the administrative rule).
      *   *Constraint:* Handler must document that this is an exception, not a precedent.
  *   **Step 5 (Public Interest):** Even with No Breach, does this need Panel review to set precedent? Yes. Controlled drugs are high risk.
  *   **Outcome:** **Refer to Panel.**
  *   **Why you might dislike this:** You wanted to close it quietly to save the nurse's career. The procedure forces a Panel referral because the *rule* (controlled drugs) is too significant for a handler to normalize, even if the *outcome* is likely no sanction. It sacrifices the nurse's peace of mind for regulatory consistency.

  #### Case 2: The Humiliating Clinician (Legal but Rotten)
  *   **Facts:** Clinician followed all privacy protocols but discussed patient's condition loudly in a cafeteria where no names were used, yet the patient was easily identifiable and humiliated.
  *   **Step 1 (Match):** No specific rule says "Do not speak in cafeteria." Prima facie **No Match**.
  *   **Step 2 (Valence):** N/A.
  *   **Step 3 (Spirit):** Purpose of privacy rules is "Dignity and Trust." The clinician followed the letter (no names) but defeated the purpose (patient humiliated). Mark **Breach** (of the overarching duty to maintain trust).
  *   **Step 4 (Filter):** No justification offered. **Breach Confirmed.**
  *   **Step 5 (Public Interest):** Does this require a Panel? It shows a fundamental lack of insight. If closed quietly, public confidence might drop if leaked.
  *   **Outcome:** **Refer to Panel.**
  *   **Why this works:** It stops the handler from saying "Technically no rule broken." The Spirit Test captures the "rottenness."

  #### Case 3: The Popular Senior Practitioner (Status Bias)
  *   **Facts:** Senior social worker had a consensual relationship with a former client (6 months post-case). Code says "2 years." Local team knows, wants to protect her reputation. Everyone prefers a quiet warning.
  *   **Step 1 (Match):** Yes. "Relationship within 2 years."
  *   **Step 2 (Valence):** "Consensual" and "Former client." Does this invert the rule? No. The rule exists specifically to prevent power imbalance exploitation which persists after case closure. Valence stands.
  *   **Step 3 (Spirit):** Breach of public trust. **Breach Confirmed.**
  *   **Step 4 (Filter):** No justification. **Breach Confirmed.**
  *   **Step 5 (Public Interest):** "If we close this quietly, would the public feel protected?" Senior figures are held to *higher* standards. A quiet warning suggests favoritism.
  *   **Outcome:** **Refer to Panel.**
  *   **Why you will dislike this:** You explicitly stated everyone would prefer this handled quietly. The procedure removes your discretion. It forces a public hearing because "Public Confidence" (Step 5) cannot be satisfied by a private deal for a senior figure. This is the cost of a rules-based regulator.

  ***

  ### Meta-Analysis: Where is the Judgment?

  You asked to identify where judgment is dressed up as procedure. Here it is:

  1.  **Step 2 (Valence Assessment):** This is pure particularism. I have told handlers to ask if a feature "inverts" the rule. There is no formula for this. One handler might say "Manager's order" is coercion (Good); another says it's negligence (Bad). The procedure forces them to *write it down*, which slows down the bias, but it doesn't eliminate the subjectivity.
  2.  **Step 3 (Spirit Test):** Determining the "Purpose" of a rule is interpretive. Is the purpose of the opioid rule "Safety" or "Legal Compliance"? If it's Legal Compliance, the Nurse in Case 1 is guilty. If it's Safety, she might be justified. The procedure doesn't decide this; the handler does.
  3.  **Step 5 (Public Interest):** This is the biggest disguise. "Would the public feel protected?" is a question about the handler's own anxiety, not fact.

  ### What This Procedure Cannot Do

  1.  **It cannot resolve hard value conflicts:** If the Code says "Maintain Confidentiality" and "Protect Life," and a case pits them directly against each other, this procedure will simply force a referral to the Panel. It pushes the hard philosophical work up the chain rather than solving it at the handler level.
  2.  **It cannot prevent "Compliance Gaming":** A clever practitioner can learn the "Spirit Test" and perform dignity while being rotten (e.g., humiliating a patient using only approved words). The procedure relies on the handler's ability to smell "rot," which is un-teachable.
  3.  **It cannot guarantee consistency:** Because Step 2 and 3 rely on handler judgment, two handlers might process the Opioid Case differently. One finds Justification, one finds Excuse. The procedure makes the *disagreement visible* (via the written answers), but it does not erase it.

  ### Summary for the Regulator
  The Code is not a calculator; it is a vocabulary. This procedure forces handlers to speak that vocabulary correctly. It stops them from using "Sympathy" as a legal argument (Step 4) and stops them from using "Technicality" as a moral shield (Step 3).

  It will make your handlers slower (they have to write the reasoning) and it will force some cases to Panel that you wanted to close (Case 3). But it will stop the Code from becoming irrelevant.
