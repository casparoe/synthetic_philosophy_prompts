answer: |-
  Here is a tiered evaluation based on current philosophical defensibility and explanatory power, followed by the "hidden work" diagnosis.

  ### **The Tier List**

  **S-Tier: (f) Relational view**
  This is the dominant account in contemporary literature (e.g., Wallace, Darwall) because it grounds standing in the authority constituted by shared normative relationships, explaining why outsiders or hypocrites lack the *right* to blame without denying the truth of their claims.

  **A-Tier: (b) Reciprocity view**
  A strong contender that captures the specific intuition behind hypocrisy (e.g., Fritz, Bell), though it functions best as a constraint *within* the Relational view rather than a full ground of standing itself.

  **B-Tier: (c) Authorship view**
  Plausible and closely related to the Relational view, but slightly narrower; it risks excluding legitimate blame from those who haven't "publicly endorsed" a norm but are still bound by it (e.g., children or implicit community members).

  **C-Tier: (e) Eliminativist view**
  Philosophically provocative as a meta-ethical challenge, but descriptively weak; it dissolves the phenomenon of standing rather than explaining why the "Who are you?" objection feels distinct from "You're wrong."

  **D-Tier: (d) Epistemic view**
  Confuses the *authority* to blame with the *accuracy* of blame; it fails to explain why a hypocrite's accusation can be factually true yet still appropriately rebuffed as out of line.

  **F-Tier: (a) Ledger view**
  The "moral credit" fallacy; it implies standing is a currency of moral superiority, which wrongly suggests that only the virtuous (or the *more* virtuous) can appropriately object to wrongdoing.

  ***

  ### **The "Hidden Work" Diagnosis**

  In real-life blame fights, the **Ledger view (a)** is doing the most heavy lifting without anyone admitting it.

  When people scream "You're a hypocrite!", they rhetorically frame it as a matter of fairness or Reciprocity (Tier A), but the emotional fuel is almost always the intuition that the blamer has "spent" their moral credit by sinning themselves. Students will recognize that while almost no philosopher defends the Ledger view, it is the unacknowledged engine behind 90% of interpersonal "Who are *you* to talk?" objections.
