answer: |-
  Here is a teaching plan designed to navigate the specific conceptual friction you encountered, structured for a 90-minute session with a mixed technical/philosophical cohort.

  ### 1. Sequence of Ideas and Dependencies

  You must teach this in a specific logical order. If you skip the foil, the solution looks like a truism; if you skip the internal state, it looks like behaviorism.

  1.  **Type-Identity Theory (The Foil):**
      *   *Content:* Mental states = Brain states (e.g., Pain = C-fiber firing).
      *   *Dependency:* You must establish this first because Functionalism is historically and logically a response to its failure. Without this, Functionalism looks like a definition rather than a metaphysical solution.
  2.  **Multiple Realizability (The Problem):**
      *   *Content:* The same mental state can be instantiated by different physical substrates (humans, octopuses, aliens, silicon).
      *   *Dependency:* Depends on (1). It is the counter-example that breaks Identity Theory.
      *   *Crucial Nuance:* Do not let them call this "Software." Call it "Physical Substrate."
  3.  **Functionalism (The Solution):**
      *   *Content:* Mental states are defined by their causal role (relations to inputs, other states, and outputs), not their physical constitution.
      *   *Dependency:* Depends on (2). It is the attempt to save the reality of mental states without tying them to specific physics.
  4.  **Internal Causal Mediation (The Distinction from Behaviorism):**
      *   *Content:* The functional role involves relations between *internal states*, not just Input $\rightarrow$ Output.
      *   *Dependency:* Depends on (3). Without this, Functionalism collapses into Behaviorism (which engineers often assume is the same thing).
  5.  **Realization vs. Description (The Distinction from SW/HW):**
      *   *Content:* The "function" is the abstract causal pattern; the "realizer" is the physical system instantiating it.
      *   *Dependency:* Depends on (4). This is where you head off your friend's argument. The "software" is often a description of the function, or a specific physical realizer, but not the functional property itself.
  6.  **The Disjunction Objection (The Remaining Rival):**
      *   *Content:* Why not just say Pain = C-fibers OR Silicon-X OR Alien-Y (Disjunctive Identity)?
      *   *Dependency:* Depends on (5). This forces the question of what explanatory work Functionalism is actually doing.

  ### 2. The Carrying Example: The Vending Machine

  Do not use "Pain" or "Belief" as your primary example until the very end. Use a **Simple Vending Machine**. It is the standard for a reason (Block, Putnam), but you must wield it precisely.

  **What it must contain:**
  *   **Inputs:** Coin slots (50c, $1), Buttons (A, B).
  *   **Outputs:** Snacks, Change.
  *   **Internal States:** This is the critical component. The machine must have a "Credit" state (e.g., State 1: 0c, State 2: 50c).
  *   **Causal Connectivity:** Show that Input + State 1 $\rightarrow$ State 2 (no output), but Input + State 2 $\rightarrow$ Output + State 1.
  *   **Multiple Realizations:** Describe one machine made of gears/levers (1950s) and one made of silicon/voltage (2020s).

  **What it must leave out:**
  *   **Complexity:** No networking, no inventory tracking, no AI. Keep the state space tiny (3-4 states max).
  *   **"Purpose":** Do not discuss *why* the machine exists (commerce). Discuss only *how* it transitions states.
  *   **The Word "Software":** Refer to the logical transition table as the "Functional Description" and the gears/chips as the "Physical Realizer."

  **How to deploy it:**
  *   **Phase 1 (Identity):** Ask: "Is the state '50c Credit' identical to 'Gear Position X'?" (Engineers will say yes).
  *   **Phase 2 (MR):** Show the silicon machine. "Is '50c Credit' identical to 'Voltage Level Y'?" (Now they see 'Credit' cannot be identical to *both* Gear X and Voltage Y simultaneously).
  *   **Phase 3 (Functionalism):** "What is '50c Credit' then?" It is the *role* of dispensing a snack upon receiving another 50c.
  *   **Phase 4 (Behaviorism):** "If I glue the coin slot shut but the machine still internally tracks credit, is it broken?" (Yes, but the state exists). "If I wire it to dispense a snack immediately on *any* coin without tracking credit, is it the same machine?" (No, behavior is same, function is different).

  ### 3. Misconceptions and Intervention Points

  **1. The Software/Hardware Conflation**
  *   *The Misconception:* "Mind is software, Brain is hardware." This implies software is a non-physical substance or that "software" is the functional role itself.
  *   *Intervention Point:* **Step 5 (Realization vs. Description).**
  *   *The Move:* Explicitly state: "In this analogy, 'Software' is ambiguous. If you mean the *code stored on the disk*, that is a physical object (magnetic orientation). If you mean the *logical execution*, that is the Functional Description. The Mind, for the Functionalist, is the *logical execution*, not the code, and not the electricity."
  *   *Why:* This prevents the engineer from saying "Functionalism is obvious because software exists." You must show that "software" presupposes a functional description.

  **2. MR Establishes Functionalism**
  *   *The Misconception:* "Because minds are multiply realizable, Functionalism must be true."
  *   *Intervention Point:* **Step 6 (The Disjunction Objection).**
  *   *The Move:* Challenge them: "A Type-Identity theorist can grant MR. They can simply say Pain = (C-fibers OR Silicon-X OR Alien-Y). This is a 'Disjunctive Identity Theory.' It is messy, but it is not logically impossible. Why prefer Functionalism?"
  *   *Why:* This forces them to see Functionalism as an *inference to the best explanation* (unification of kind), not a logical entailment of MR. This validates your position against your friend's.

  **3. Functionalism = Behaviorism**
  *   *The Misconception:* "If it acts like it's in pain, it is in pain."
  *   *Intervention Point:* **Step 4 (Internal Causal Mediation).**
  *   *The Move:* Use the Vending Machine's "Credit" state. Two machines can dispense the same soda (Output) for the same coin (Input), but one tracks credit (Functional) and one just drops a soda every time (Behaviorist/Reflex). The internal state differs.
  *   *Why:* Engineers often treat systems as Input/Output black boxes. You must force the "Black Box" open to show the *mediating states*.

  ### 4. The Final Question

  Do not ask them to define Functionalism. Ask them to apply the distinction between Role and Realizer to a boundary case.

  **The Question:**
  > "If a Type-Identity theorist defines 'Pain' as the disjunction of all possible physical realizers (C-fibers, Silicon Circuits, etc.), and the Functionalist defines 'Pain' as the causal role played by those things... **what specific prediction or explanation can the Functionalist offer that the Disjunctive Identity Theorist cannot?**"

  **Why this works:**
  *   If they answer "None," they haven't grasped the unification argument of Functionalism.
  *   If they answer "Functionalism explains why aliens feel pain," you correct them: "Identity Theory explains that too, via the disjunction."
  *   The correct answer requires them to articulate that Functionalism captures the *generalization* and *causal power* of the state itself, whereas Disjunctive Identity is merely a list of physical correlates with no unified causal power. This tests if they see the *Role* as a distinct ontological category from the *Realizer*.

  ### 5. What to Refuse to Settle

  You must explicitly mark the boundary of the session to prevent the "settled and obvious" trap.

  **The Refusal:**
  > "I am not going to settle today whether Functionalism is *true*. I am also not going to settle whether 'Qualia' (the feeling of pain) can be captured by functional roles. We are analyzing whether Functionalism is a *coherent distinct position* from Identity Theory and Behaviorism, not whether it is the final truth of metaphysics."

  **Why say this out loud:**
  *   Your friend argued the matter is "settled." By refusing to settle the *truth*, you model philosophical rigor.
  *   It protects you from the "Hard Problem" objections (Zombies, Inverted Spectrum) which will arise from the CogSci students. Acknowledge them, but bracket them as "External to the definition of Functionalism."
  *   It validates the engineers' intuition (that it works practically) while maintaining the philosophers' concern (that the metaphysics is contested).

  ### Summary of Timing (90 Minutes)
  *   **00-15:** Type Identity & The Vending Machine (Physical State).
  *   **15-30:** Multiple Realizability (The Gear vs. Chip problem).
  *   **30-45:** Functionalism Defined (The "Credit" Role).
  *   **45-60:** Distinguishing Behaviorism (Internal States) & SW/HW (Realization).
  *   **60-75:** The Disjunction Objection (The Identity Theorist's Counter).
  *   **75-90:** Final Question, Discussion, and Explicit Refusal to Settle Truth.
