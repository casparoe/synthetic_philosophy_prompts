answer: |-
  Good morning.

  I'm aware that I'm the only person in this room whose primary job is making things up. You build systems that move physical objects through space, or you analyze the logical structures that allow those systems to exist. I write novels. Mostly quiet ones, until the last one.

  In that book, there's a distribution warehouse outside Dayton. It's automated. A fleet of small orange robots moves shelves to human pickers. In the third act, a robot pins a picker against a conveyor belt. The picker dies.

  When I wrote that scene, I needed a villain. I needed someone who had cut a corner, ignored a warning, or pressed a button they shouldn't have. I needed a name to put at the bottom of the liability waiver. But the more I researched the logistics of automated fulfillment, the harder it became to find that name. And when I tried to pin the death on a specific person, the logic of the system pushed back.

  That friction is why I'm standing here. And it's why I think we need to be careful about how we spend the next two days.

  If we spend this workshop trying to answer the question "Who is to blame when the system fails?" I suspect we will leave here having confirmed what we already know: that blame is a solvent. It dissolves the moment it touches a complex autonomous system.

  Let's walk through the candidates, just to feel how slippery they are.

  Is it the operator on the floor? In my book, the picker was doing exactly what the dashboard told him to do. He wasn't negligent; he was optimized.

  Is it the engineer who tuned the reward function? She optimized for throughput. She didn't optimize for death, but death was a statistically acceptable variance in the model. She didn't intend the outcome.

  Is it the vendor who pushed the software update overnight? It was a standard patch. It passed all regression tests. The specific collision scenario wasn't in the test suite because no one had imagined that specific geometry of failure.

  Is it the company that bought the cheapest version of the safety sensor? They operated within regulatory compliance. They bought what the market sold.

  Is it me, the novelist? I needed a conflict, so I imagined a failure. But I didn't build the machine.

  When you line these people up, you get a chain of causality, but you don't get a locus of responsibility. We call this the "responsibility gap," but I worry that term is too comfortable. It suggests a gap is a natural feature of the terrain, like a canyon. It suggests we just have to build a bridge over it.

  But a gap implies we lost something we used to have. We didn't. We built systems where accountability was never installed to begin with.

  So, I want to propose a reframing for this weekend. I want to suggest that the interesting question isn't "Who is to blame when the robot kills someone?" The interesting question is: "Who is answerable for the fact that nobody is to blame?"

  Notice the shift. Blame is backward-looking. It's a forensic tool. It looks for a break in the chain. Answerability is structural. It looks for a holder of the chain.

  When we look at this warehouse system and see no one to blame, we tend to think we failed to find the right person. I'm suggesting that we failed to create the right *position*.

  There is a vacancy here.

  I don't mean a job opening in the HR sense. I mean a vacancy in the ontology of the system. There is a seat at the table—a specific function of authority and answerability—that remains empty by design. We have designed systems that can act without a principal. We have created agents that can commit harms without a party who is obligated to answer for them.

  This is where I need both halves of this room.

  To the engineers and industry partners here: You are used to building redundancy. You build fallbacks. If the lidar fails, the radar kicks in. If the network drops, the local cache holds. But you rarely build a "responsibility fallback." You assume the human operator is the fallback, but as we saw in Dayton, the operator is often just another component in the loop, just as constrained as the robot.

  What if the vacancy was a spec? What if, before a system is deployed, there is a designed role—a trustee, an officer, a signatory—whose sole function is to be the entity that is answerable for the system's autonomy? Not necessarily the one who fixed the code, but the one who holds the liability for the code's behavior in the world. A human component whose job isn't to steer the robot, but to stand for the robot when it arrives somewhere it shouldn't be.

  You build systems with APIs. You need an API for accountability. Who does the world call? Who picks up the phone? And not a customer service line, but a fiduciary responsibility.

  To the philosophers and ethicists: I know some of you bristle at the term "robot ethics." You know that robots don't have ethics; people do. But if the people are distributed across a supply chain, across code repositories, across corporate subsidiaries, then the "person" is functionally absent.

  Your work here shouldn't just be to analyze the gap. It should be to define the shape of the thing that fills it. If this vacancy is a post that must be filled by design, what are the tenure requirements? What is the scope of authority? How do we distinguish between being responsible for a mistake and being answerable for a system? You have the vocabulary to draft the job description for this vacancy.

  If we don't do this, we risk a future where harm is real, but guilt is imaginary. We risk creating a world where things happen, people die, companies pay fines, and no one is ever actually held to account because no one was ever actually in charge.

  I'm not asking us to solve this by lunch. I'm asking us to stop looking for a culprit and start looking for the empty chair.

  Because that's what's waiting for us in the breakout sessions. It's not a puzzle to be solved; it's a space to be occupied. We have spent the last decade getting very good at building machines that can make decisions. We have not spent enough time building the structures that require a human to own those decisions.

  So, as we begin, I invite you to look around this room. We have the builders of the systems. We have the thinkers who analyze the systems. We have the lawyers, the policymakers, the industry reps.

  But if you look closely, there is still a seat open. It's the seat for the person who answers for the system when it works exactly as designed and still hurts someone.

  That chair is empty. It has been empty since the first robot moved without a direct command. It was empty in Dayton. It is empty here today.

  Let's spend the next two days deciding who sits in it.

  Thank you.
