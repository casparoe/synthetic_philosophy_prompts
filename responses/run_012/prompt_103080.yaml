answer: |-
  You have stumbled onto one of the deepest, most persistent holes in political philosophy. It is not a confusion on your part; it is a genuine logical paradox that has bothered theorists for centuries. If your Model UN committee got stuck, it's because you were trying to use a democratic procedure (voting) to solve a pre-democratic question (who constitutes the democracy).

  Here is the breakdown of the name, the concept, the distinctions, and the boundaries you asked for.

  ### 1. The Standard Name
  The established academic term for this is **The Boundary Problem** (sometimes called **The Problem of the Unit**).

  In political science and philosophy, it is most famously associated with the work of **Frederick Whelan** (who wrote the definitive book on it, *Democratic Theory and the Boundary Problem*) and **Robert Dahl**.

  However, the specific *circularity* you are describing—where the rules determine the voters, but the voters determine the rules—is often referred to as **The Paradox of Founding** or **The Demos Paradox**.

  If you need a label that captures the exact mechanism you described (the circularity of membership deciding membership), I would define it as:
  **Constitutive Circularities.**

  ### 2. What the Phenomenon Actually Is
  At its core, democracy relies on a "demos" (the people). To have a vote, you must first know *who* gets to vote.
  *   **The Logic:** Decision $D$ requires Group $G$. But the definition of Group $G$ is itself a Decision $D$.
  *   **The Trap:** If Group $G$ decides who is in Group $G$, they will naturally include people who agree with them and exclude those who don't. If an outside authority decides Group $G$, then Group $G$ is not self-determining (which violates the democratic ideal).

  In your examples:
  *   **Model UN:** You cannot vote on "self-determination" until you define the "self." But defining the "self" *is* the act of self-determination.
  *   **Annexation:** If the city votes, it's imperialism. If the suburb votes, it's veto power. If both vote, how do you weigh them? (1 person = 1 vote? Or 1 city = 1 vote?)
  *   **Discord:** The "merge" decision changes the "voter" set. If the old voters decide, they can block new blood. If the new blood decides (post-merge), they can hijack the server.

  ### 3. What It Is Not (Distinctions)
  You asked if it's gerrymandering, secession, or social choice. Here is how to draw the lines:

  **Is it Gerrymandering?**
  *   **No.** Gerrymandering assumes the boundary *should* exist and manipulates the lines *within* the rules to favor a party.
  *   **The Boundary Problem** questions the legitimacy of the lines themselves. Gerrymandering is cheating *inside* the game; the Boundary Problem is asking *who gets to play* the game.

  **Is it Secession?**
  *   **No.** Secession is a specific *instance* of the Boundary Problem.
  *   **The Boundary Problem** is the underlying logical structure. Secession is just one type of boundary change (splitting). Annexation (merging) and Self-Determination (defining) are others.

  **Is it Social Choice Theory?**
  *   **Related, but distinct.** Social Choice Theory (like Arrow's Impossibility Theorem) deals with how to aggregate preferences *once the voters are defined*.
  *   **The Boundary Problem** happens *before* Social Choice theory can even start. It is the "Step Zero" that social choice usually takes for granted.

  **Is it Ordinary Rule-Making?**
  *   **No.** This is the crucial edge case.
  *   **Ordinary Rule-Making:** A settled club voting on membership *fees*. The members are already agreed upon. The boundary is static.
  *   **The Boundary Problem:** A club voting on *membership criteria*. The boundary is dynamic.
  *   **Test:** If the decision changes *who gets to vote next time*, it is the Boundary Problem. If the decision only changes *what happens*, it is ordinary rule-making.

  ### 4. Defining the Edges (Boundary Cases)
  You asked about specific edge cases. Here is how to apply the definition:

  **Case A: A club deciding its own membership fees.**
  *   **Verdict:** Not the Boundary Problem.
  *   **Why:** The group is already constituted. The decision does not alter the "demos."

  **Case B: A club deciding who qualifies for membership.**
  *   **Verdict:** **Yes, Boundary Problem.**
  *   **Why:** Current members are deciding who gets to become a member (and thus a voter). They might vote to require high fees to keep out people who disagree with them.

  **Case C: Future Generations (Climate Change).**
  *   **Verdict:** **Adjacent, but distinct.**
  *   **Why:** This is usually called the **Problem of Temporal Boundaries**. It fits the "All-Affected Principle" (people affected by a decision should have a say), but since future people don't exist, they can't vote. It's a variation of the Boundary Problem where the boundary is time, not space or identity.

  **Case D: A City Annexing a Suburb.**
  *   **Verdict:** **Yes, Boundary Problem.**
  *   **Why:** The decision physically moves the line of who is a "citizen" with voting rights.

  ### 5. Why You Can't Solve It (And What To Do Instead)
  The reason your Model UN and Civics classes got stuck is that **there is no purely democratic solution to the Boundary Problem.**

  Robert Dahl put it bluntly: "The democratic process cannot be used to determine the boundaries of the democratic process."

  If you try to vote on who gets to vote, you have already assumed an answer to who gets to vote (to count the first vote). It is an infinite regress.

  **How real-world systems handle it:**
  Since logic doesn't solve it, reality uses **Arbitrary or Normative Cutoffs.**
  1.  **Status Quo Bias:** The current boundary is assumed legitimate until changed by a supermajority or external force. (e.g., International law usually respects existing borders, *uti possidetis*, even if they are arbitrary, to prevent endless wars over the Boundary Problem).
  2.  **Higher Law:** A Constitution defines the boundaries, and the Constitution is treated as sacred/harder to change than normal laws.
  3.  **External Arbitration:** A higher authority (like a federal court or the UN) draws the line, acknowledging that the line itself cannot be drawn democratically by the locals.

  ### Summary for your Model UN/Civics Context
  If you need to articulate this in your next session, here is a script you can use:

  > "We are encountering **The Boundary Problem**. We are trying to use a procedural vote to solve a constitutive question. We are asking 'Who are the people?' by asking 'The people' to vote. This is a **Constitutive Circularity**.
  >
  > This is not gerrymandering, because we aren't manipulating lines; we are trying to find the logic for the lines. We cannot solve this with a simple majority vote, because the majority is defined by the very lines we are debating. We need to step outside the voting procedure and agree on a **normative principle** (like 'all current residents' or 'historical inhabitants') before we can vote."

  You have identified the "ghost in the machine" of democracy. It's a great observation for a high school junior. Don't let it frustrate you; let it be the tool you use to explain why the committee is stuck.
