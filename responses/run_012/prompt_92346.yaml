      *   *The "Euclidean" Disclaimer:* Ivan admits his mind is limited to 3D space. He can't understand higher harmony. This suggests his rejection might be epistemic/psychological, not necessarily ontological/axiological. *However*, in ethics, the "cannot accept" often functions as a "ought not accept."

