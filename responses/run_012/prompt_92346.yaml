          *   Ivan is closer to a rights-based view or a specific "consent-based" negative utilitarianism.
          *   *Difference:* LTNU is objective (the philosopher sets the threshold). Ivan is subjective/agent-relative (the victim holds the veto).
      *   **The Spectrum Argument:**
          *   It's not just about intensity scaling. It's about the *impunity* of the torturer and the *silence* of the victim.
          *   It undermines pure aggregation because it highlights the *distribution* of suffering (concentrated on the innocent) vs. the *distribution* of harmony (diffuse, future).
          *   The "Mother" point is the killer for aggregation. You can't aggregate forgiveness.
      *   **The Euclidean Mind:**
          *   It's not a weakness. It's an assertion of human ethical limits. If the "higher harmony" requires a logic we cannot morally comprehend, it is ethically void *for us*.
          *   It saves the claim from being a metaphysical error and grounds it as an ethical stance.
      *   **Zosima/Alyosha (Counter-Axiology):**
