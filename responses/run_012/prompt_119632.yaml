          *   Elena counters: That's not aesthetic belief, that's a belief about *recommendation*.
          *   Marcus pushes: What's the difference?
          *   Elena clarifies: It's about *justification*. If you believe it's good only because I said so, you don't *know* it's good.
          *   Marcus asks: Is this epistemic (you don't know) or practical (you can't discuss it)?
      *   **Round 2: The Science Analogy:**
          *   Marcus brings in science/history. We trust experts there.
          *   Elena distinguishes: Science is about facts; aesthetics is about *appreciation*.
          *   Marcus presses: Why is appreciation necessary for *knowledge*?
          *   Elena argues: Aesthetic predicates require a sensitivity that testimony bypasses.
      *   **Round 3: The Deaf Listener (The Hard Case):**
          *   Marcus introduces the deaf listener. If they can't hear the symphony, can they know it's beautiful via testimony?
          *   Elena's trap: If she says "No," she seems ableist or counterintuitive. If she says "Yes," she concedes the optimist point.
          *   Elena's move: She must refine. Maybe they know it's *rated* beautiful, or they know it *would be* beautiful if they could hear. Or she bites the bullet: They lack aesthetic knowledge specifically. Let's have her bite a nuanced bullet: They know facts *about* the beauty, but lack the aesthetic state itself.
          *   Marcus counters: That sounds like word games.
      *   **Round 4: Moral Testimony:**
          *   Marcus brings in the parallel. We accept moral testimony (mostly). "That was wrong."
          *   Elena distinguishes: Moral action vs. Aesthetic appreciation. Moral testimony guides action; aesthetic testimony is supposed to guide taste.
          *   Marcus: But we want to know if something *is* right or beautiful.
          *   Elena: Moral properties might be more objective/action-guiding. Aesthetic properties are response-dependent.
      *   **Round 5: The Thick Description (The Critic):**
          *   Marcus: What if a critic describes it so well I feel I see it?
          *   Elena: That's not testimony; that's *evocation*. You're simulating the experience.
          *   Marcus: So testimony *can* work if it's descriptive enough?
          *   Elena: No, because then the justification isn't the say-so, it's the imagination triggered by the words.
      *   **Closing:** Bring it back to the fundamental split. No agreement.

  4.  **Refining the Argument (Self-Correction during drafting):**
