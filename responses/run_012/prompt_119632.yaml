      *(Self-Correction on Moral Testimony)*: The standard pessimist move on moral testimony is similar to aesthetics (you need to understand *why* it's wrong). Elena should align them or distinguish them carefully. Let's have her distinguish them based on the *goal* (action vs. appreciation).

  6.  **Final Review against Constraints:**
      *   American English? Yes.
