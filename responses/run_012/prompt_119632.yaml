  2.  **Character Conception:**
      *   **Elena (Pessimist):** Needs to articulate *why* aesthetic belief requires first-hand experience. Is it about the nature of aesthetic properties? The role of appreciation? She shouldn't just say "it's different," she needs to explain the *mechanism* of the failure.
      *   **Marcus (Optimist):** Needs to challenge the exceptionalism. Why is art special? If testimony works for facts, why not values? He needs to press the "Deaf Listener" case hard, as it's a strong intuition pump against her.

  3.  **Drafting - Section by Section:**

