      *   *Check:* Is the ending resolved? *Fix:* Ensure they end on distinct principles.

  5.  **Writing the Dialogue (Iterative Process):**
      *   *Setting the Scene:* A coffee shop or department lounge. Late night.
      *   *Voice:* Keep it grad-student specific. Precise, slightly weary, but passionate.
      *   *Focus:* Ensure the "Epistemic vs. Practical" distinction is clear early on.
