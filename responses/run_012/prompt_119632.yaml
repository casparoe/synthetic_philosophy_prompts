answer: |-
  **Setting:** *The department lounge, 11:30 PM. Empty coffee cups and a whiteboard covered in half-erased logic symbols from an earlier seminar. Elena is sitting on the sofa, legs tucked under her. Marcus is pacing, holding a marker he's forgotten to put down.*

  **Marcus:** We're doing it again. We're doing the loop.

  **Elena:** I know.

  **Marcus:** So let's break the loop. You say testimony doesn't yield aesthetic knowledge. I say it does. Last week, you told me *The Zone of Interest* was morally devastating. I believed you. I went in expecting to be devastated. I was. Did I not know it was devastating before I saw it?

  **Elena:** You knew you *would likely be* devastated. You knew I found it devastating. That is psychological information about me, and perhaps statistical information about the film's effects. But did you know, prior to viewing, that the film *was* devastating? In the aesthetic sense?

  **Marcus:** What does that mean? "Was devastating." If I have the experience you predicted, the proposition "The film is devastating" was true before I entered the theater. You told me it was true. I believed you on the basis of your competence and honesty. That is the textbook definition of knowledge by testimony.

  **Elena:** It's textbook for "The water is boiling." It's not textbook for "The water is beautiful." Here's the distinction I keep trying to make, and you keep treating as a flourish: The deficit in aesthetic testimony isn't primarily practical. It's not just that I can't discuss the painting if I haven't seen it. It's that I lack the *justification* required for the belief to count as knowledge.

  **Marcus:** Okay, finally. Epistemic, not practical. You're saying the belief is defective *as a belief*, not just useless for conversation.

  **Elena:** Yes.

  **Marcus:** Why? In history, I believe the Treaty of Utrecht was signed in 1713 because my professor told me. I have no access to the signing. I cannot verify it. My belief rests entirely on her say-so. By your lights, why is that knowledge, but believing *The Zone of Interest* is devastating on your say-so is not?

  **Elena:** Because the property "signed in 1713" is independent of my cognitive engagement with it. The property "devastating" is response-dependent. It refers to a human reaction. To know that a work possesses that property, you have to understand the connection between the work and the reaction. Testimony gives you the conclusion—"It is devastating"—but it strips away the ground. It gives you the *that* without the *why*.

  **Marcus:** But testimony always gives you the *that* without the *why*. If a physicist tells me "Gravity bends light," I believe them. I don't understand the general relativity math. I lack the ground. I have the *that*. Do I not know that gravity bends light?

  **Elena:** You know the fact. But in aesthetics, the "fact" isn't separable from the sensitivity to it. If you believe a painting is balanced solely because I told you so, you possess a true belief, but you lack aesthetic understanding. And without aesthetic understanding, you don't have aesthetic knowledge. You have second-hand reportage.

  **Marcus:** This sounds like you're defining "aesthetic knowledge" in a way that begs the question. You're building "first-hand experience" into the definition of the knowledge itself.

  **Elena:** I'm building "appreciation" into it. Aesthetic concepts are thick. They aren't just labels; they're guides to perception. If you believe a melody is graceful because I said so, but you can't hear the grace, your belief is inert. It doesn't connect to the world in the right way.

  **Marcus:** Inert how? Let's press the practical versus epistemic line. Suppose I believe the melody is graceful on your say-so. I can't hum it back to you to demonstrate the grace. I can't point to the interval. If someone challenges me, I say, "Elena said so." That's the practical deficit. I'm useless in a critique. But why is the *belief* itself unjustified? If you're trustworthy, why am I not rational to believe it?

  **Elena:** Because in aesthetics, the justification *is* the experience. The reason to believe a work is beautiful is that it affords a certain kind of pleasure or insight upon engagement. If you bypass the engagement, you bypass the reason. You're trusting me to have had the reason, but you haven't adopted the reason yourself. You've adopted my authority. And in aesthetics, authority doesn't transmit justification.

  **Marcus:** Why not? Why is aesthetic authority different from epistemic authority in science?

  **Elena:** Because science aims at truth independent of the observer. Aesthetics aims at a value that is constituted by the observer's response.

  **Marcus:** Okay. Let's test that constitution claim. This is where I think you break. Consider a listener who is deaf. They cannot experience the symphony. They cannot have the response that constitutes the beauty. I tell them, "This symphony is beautiful." They believe me. On your view, can they know it is beautiful?

  **Elena:** *[Pauses]* This is the hard case.

  **Marcus:** It's the only case that matters. If you say "No," you're saying a disabled person is permanently excluded from aesthetic knowledge, which seems morally repugnant and intuitively wrong. If you say "Yes," you concede that first-hand experience isn't necessary, and you lose the pessimist position.

  **Elena:** I'm not conceding that. But I need to be precise. Can they know the symphony is beautiful? I would say: They can know that the symphony *merits* the response of beauty from those who can hear it. They can know it is a great work. But they cannot know the beauty itself in the full aesthetic sense, because they cannot grasp the relation between the sound and the feeling.

  **Marcus:** That sounds like verbal gymnastics. "It merits beauty" versus "It is beautiful." If I tell a deaf person, "This is beautiful," and they understand the concept of beauty, and they trust me, and the proposition is true... what is missing? You're positing a mystical state called "grasping the beauty" that is distinct from "knowing it is beautiful."

  **Elena:** It's not mystical. It's the difference between knowing a drug is effective because you read the label, and knowing it works because you felt the pain subside. The deaf listener is in the position of reading the label. They know the social fact of the symphony's value. They do not know the aesthetic fact of its beauty.

  **Marcus:** But they can't verify the label! They can't take the pill. So you're saying there is a class of truths—aesthetic truths—that are permanently inaccessible to them via testimony, whereas scientific truths about the drug *are* accessible via testimony.

  **Elena:** Yes. Because the aesthetic truth is tied to the phenomenology.

  **Marcus:** So you bite the bullet. There are things they cannot know.

  **Elena:** There are experiences they cannot have. And since aesthetic knowledge requires the capacity for that experience to ground the belief, yes. They cannot know it in the same way a hearing person does.

  **Marcus:** That's a costly bullet, Elena. It makes aesthetic knowledge elitist in a way scientific knowledge isn't. But let's pivot. You're worried about the ground of the belief. What about moral testimony? If I tell you, "What that corporation did was unjust," do you need to investigate the corporate records yourself to know it was unjust? Or can you trust my moral judgment?

  **Elena:** Moral testimony is... complicated. But generally, I think there's a parallel. If you tell me an action is wrong, and I believe you solely on your say-so, my moral belief is defective. I should understand *why* it's wrong.

  **Marcus:** Aha! So you're a pessimist about moral testimony too?

  **Elena:** Mostly. But there's a difference in stakes. Moral testimony guides action. If I need to vote, or boycott, I might have to rely on testimony to act rightly. Aesthetic testimony guides appreciation. There's no urgent action required.

  **Marcus:** But the epistemic structure should be the same. If moral properties are response-dependent like aesthetic ones, then your worry should apply equally. If you're willing to allow moral testimony in cases of action-guidance, why not aesthetic testimony for appreciation-guidance?

  **Elena:** Because action can be correct even if the understanding is thin. I can boycott the right company for the wrong reason. But in aesthetics, the "correctness" *is* the understanding. If you appreciate a poem for the wrong reason—say, you think it's ironic when it's sincere—you aren't appreciating it. You're misapprehending it. So the ground matters more.

  **Marcus:** I'm not buying the disanalogy. But let's go to the critic. This is my checkmate. Suppose I read a critic who describes a painting in such loving, precise detail that I can visualize it. She describes the brushwork, the color relations, the emotional tone. I form a belief that it's beautiful based on her description. Is that testimony?

  **Elena:** No.

  **Marcus:** Why not? She told me it's beautiful.

  **Elena:** She didn't just tell you. She *showed* you, verbally. She stimulated your imagination. You aren't believing her authority; you are simulating the experience through her words. The justification for your belief isn't "She said so." It's "Her description allowed me to construct a mental image that I find beautiful."

  **Marcus:** But I haven't seen the painting! I'm still relying on her to select the details, to frame the image. If she lied about the brushwork, my belief would be false. So I am relying on her testimony.

  **Elena:** You're relying on her report of the non-aesthetic properties—the colors, the shapes. From those, you generate the aesthetic response yourself. Testimony transmits the facts; it doesn't transmit the aesthetic response. In the thick description case, the critic gives you enough raw material that you can generate the response internally. That's not testimony doing the heavy lifting. That's imagination doing the work, triggered by testimony.

  **Marcus:** So testimony *can* yield aesthetic knowledge, provided it's descriptive enough to trigger the imagination?

  **Elena:** No. Because then the knowledge isn't based on testimony. It's based on your own imaginative engagement. If I just say, "Trust me, it's beautiful," and you believe me, that's pure testimony. That fails. If I describe it, and you imagine it, and then you judge it, that's not pure testimony. You've done the work.

  **Marcus:** This is the move I can't swallow. You're moving the goalposts. When I believe you without description, you say it's not knowledge. When I believe you with description, you say it's not testimony. You've made your position unfalsifiable.

  **Elena:** I've made it precise. The mechanism of justification in aesthetics is the engagement with the object, whether real or imagined. Testimony bypasses engagement. Description facilitates engagement.

  **Marcus:** But the deaf listener can't imagine the sound. So they're stuck.

  **Elena:** They are stuck. That's the tragedy of their condition, not an error in my epistemology.

  **Marcus:** Or, it's an error in your epistemology that turns a tragedy of condition into an impossibility of knowledge. Look, Elena, here's where we actually disagree. It's not about the definition of knowledge. It's about the function of the concept "beautiful." I think "beautiful" is a property of the object that we track socially. We use testimony to coordinate our attention. If you tell me it's beautiful, and I believe you, I have successfully tracked the property. I have aligned my map with the territory.

  **Elena:** And I think "beautiful" is a marker of a successful encounter. It's not just a map of the territory; it's a log of the journey. If you haven't made the journey, writing "Beautiful" on your map is a lie. Even if the territory is there.

  **Marcus:** So for you, the value is in the consumption.

  **Elena:** For me, the value is in the relation. You can't have a relation by proxy.

  **Marcus:** And for me, the value is in the truth of the claim. If the claim is true, and I believe it on good evidence (your reliability), I know it. To say otherwise is to fetishize the "firsthand" in a way that ignores how we actually learn about the world. We are social creatures. We outsource cognition. You want aesthetics to be a solitary island where social cognition doesn't apply.

  **Elena:** I want aesthetics to be a domain where the quality of the mind matters more than the accumulation of facts. If you outsource your aesthetic judgment, you hollow out your own capacity to feel. You become a catalog of other people's reactions.

  **Marcus:** And if you refuse testimony, you isolate yourself from the community of interpreters. You privilege your own limited sensory encounter over the collective wisdom of those who have seen more.

  **Elena:** I privilege the only thing that actually grounds the judgment.

  **Marcus:** We're not going to agree.

  **Elena:** No.

  **Marcus:** Because you think the cost of my view is that we lose the "aesthetic" in aesthetic knowledge.

  **Elena:** And you think the cost of my view is that we make knowledge impossible for anyone who isn't an eyewitness.

  **Marcus:** Exactly. I think you're protecting a romantic ideal of the solitary genius at the expense of how knowledge actually works.

  **Elena:** And I think you're protecting a bureaucratic ideal of information transfer at the expense of what art actually *is*.

  **Marcus:** *[Puts the marker down on the table]* Same time next week?

  **Elena:** *[Picks up her coffee cup]* Same time. But I'm not telling you what to read before you get there.

  **Marcus:** I wouldn't expect you to.
