      *   *$\Lambda$:* Bearing = Precision on $w$ (equation of state). LO: If $w=-1$ exactly, supports vacuum energy. DIDH: If $w \neq -1$, supports dynamical field (less reliant on anthropics).

  6.  **Drafting Section 4: Verbal vs. Substantive:**
      *   *Analysis:* A lot of the fight is about the word "Confirmation" or "Prediction."
