answer: |-
  **Essay Question**

  **KINGDOM OF SERRENIA — CONSTITUTIONAL LAW FINAL EXAMINATION**
  **Time Allowed:** 90 Minutes
  **Total Marks:** 20

  **Question 1**
  Following the vote of no confidence described in the fact pattern, the Sovereign seeks your advice. The Private Secretary argues that Article 12 prohibits the Sovereign from appointing the Opposition Leader because the incumbent Prime Minister will not countersign the instrument.

  Resolve this constitutional impasse. Argue definitively whether the Sovereign is legally empowered to appoint the Opposition Leader without the incumbent's countersignature, or whether the requirement of Article 12 locks the Sovereign into granting the dissolution. Your answer must address the legal effect of codifying the confidence convention in Article 13, and whether the countersignature requirement in Article 12 contains an implicit exception for the transfer of executive authority.

  ***

  **Model Answer**

  The Sovereign is legally empowered to appoint the Opposition Leader without the incumbent Prime Minister's countersignature. To hold otherwise would allow a procedural mechanism to defeat a substantive constitutional mandate, rendering Article 13 nugatory. The resolution lies in recognising that Article 13 creates a self-executing duty that operates outside the normal scope of Article 12.

  The primary error in the Private Secretary's advice is treating Article 12 and Article 13 as equal procedural hurdles. They are not. Article 13 codifies what was previously a convention: the requirement that the Head of Government command the Assembly's confidence. By entrenching this rule, the Constitution transforms a political expectation into a legal duty imposed directly upon the Sovereign. The text says "The Sovereign *shall* appoint." This is mandatory language. If Article 12 is interpreted to allow a defeated Prime Minister to veto this appointment by withholding a signature, Article 13 is effectively repealed by a losing minister. In constitutional interpretation, specific substantive mandates (who governs) must prevail over general procedural requirements (how acts are authenticated), particularly when the procedure is being weaponised to frustrate the mandate.

  Furthermore, the purpose of Article 12 is ministerial responsibility. Countersignature ensures a Minister accepts political and legal liability for the Sovereign's acts. However, the appointment of a Prime Minister is not an act of policy for which the outgoing Minister can bear responsibility. It is an act of investiture. The outgoing Prime Minister, having lost confidence, lacks the legitimacy to assume responsibility for the selection of their successor. To require their signature is to demand they accept responsibility for an act that signifies their own removal. The logic of Article 12 collapses when the "responsible" minister is the very obstacle to the constitutional transition. Therefore, Article 12 contains an implicit exception for acts of investiture necessitated by Article 13.

  If the Sovereign follows this advice, she appoints the Opposition Leader immediately. The new Prime Minister then assumes the capacity to countersign. The first act they countersign should be the formal instrument of their own appointment, retroactively regularising the administrative form, or simply proceeding to govern. If the Sovereign instead grants the dissolution, she violates Article 13. The convention that a PM may seek dissolution upon losing confidence is conditional on there being no alternative government. The Opposition has demonstrated 251 seats. The fragility of a coalition is a political risk for the Assembly to manage, not a legal ground for the Sovereign to ignore a proven majority. Granting dissolution would privilege the incumbent's tactical advantage over the Assembly's expressed will.

  The opposite conclusion—that Article 12 blocks appointment—would only be correct if the Constitution explicitly made the countersignature a condition precedent to the validity of *any* act, without exception. To make that position legally sound, the drafters would have needed to add a clause to Article 13 stating: "This appointment is subject to the requirements of Article 12." Without that link, Article 13 stands alone as a direct command.

  However, residual indeterminacy remains. While the Sovereign can appoint, she cannot legislate or spend without countersignature. If the Opposition Leader cannot immediately secure a Minister to countersign initial orders (perhaps due to fear of the incumbent's legal challenges), the state stalls. This reveals a gap in the drafting: the Constitution regulates the appointment but not the immediate transition of administrative authority. This indeterminacy cannot be fully drafted away because it relies on the cooperation of political actors to staff the ministry. The law can mandate the appointment, but it cannot force a member of the Assembly to accept a portfolio to countersign the first order. Thus, the legal right to appoint is clear, but the operational capacity to govern relies on a convention of cooperation that the text cannot compel.

  ***

  **Marking Scheme**

  **Total Marks: 20** (5 Criteria × 4 Marks each)

  | Criterion | Marks | Required Reasoning Move | Common Mistake (Loss of Marks) |
  | :--- | :---: | :--- | :--- |
  | **1. Hierarchy of Norms** | 4 | Identifies that Article 13 (substantive duty) must prevail over Article 12 (procedural mechanism) to avoid absurdity. | Treats both Articles as equal procedural blocks, leading to a deadlock conclusion. |
  | **2. Effect of Codification** | 4 | Explains that codifying confidence in Art 13 transforms it from a flexible convention into a rigid legal duty binding the Sovereign. | Treats Article 13 as merely restating a convention that can be overridden by political practicality. |
  | **3. Limits of Countersignature** | 4 | Argues that Art 12's purpose (responsibility) cannot logically apply to the act of removing the responsible Minister. | Applies Article 12 mechanically without analysing the purpose of ministerial responsibility. |
  | **4. Dissolution Convention** | 4 | Rejects the dissolution advice because a viable alternative government exists (251 seats), making the "fragility" argument political, not legal. | Accepts the "fragile coalition" argument as valid legal grounds for refusing an Article 13 appointment. |
  | **5. Drafting & Indeterminacy** | 4 | Identifies exactly what text would validate the opposite view (linking Art 12/13) and locates residual risk in staffing the ministry. | Claims the problem is fully solvable by text or claims it is entirely unsolvable by law. |
