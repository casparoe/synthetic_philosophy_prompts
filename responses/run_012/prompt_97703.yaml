answer: |-
  The town you describe stands as a precise philosophical instrument, designed to test the limits of David Lewis's account of convention. Lewis defines a convention as a regularity in behavior that solves a coordination problem: everyone conforms, everyone expects everyone else to conform, and everyone prefers to conform on the condition that others do. Crucially, the regularity is arbitrary; another solution could have worked just as well. Your town's ritual fits the origin story perfectly. When the wood was untreated and the road unpaved, painting fences was a coordination equilibrium that served a clear utility. But now the wood is treated, the road is paved, and the utility has vanished. Yet the regularity persists, accompanied by a "felt ought" and a quiet resentment toward deviants. The question is whether Lewis's framework can stretch to cover this persistence and normative sting, or whether the case reveals a structural incompleteness requiring supplementation.

  To attempt a Lewisian recovery, one must accept the hint that the original problem has not vanished but displaced. The coordination problem is no longer about preserving wood; it is about avoiding social friction. In this light, the town faces a second-order coordination problem: not "whether to paint," but "who, if anyone, may stop." If everyone stopped simultaneously, the equilibrium would shift without cost. But since there is no mechanism for simultaneous agreement, continuing to paint remains the focal point. Unilateral deviation bears the cost of social dislike alone. Within Lewis's model, preferences are taken as given. If every townsman prefers painting to being disliked, and expects others to prefer the same, the regularity remains a convention. The "arbitrariness" condition holds, as they could theoretically coordinate on *not* painting if they could solve the higher-order coordination problem of who moves first. On this reading, the Lewisian account survives: the behavior is sustained by a conditional preference to avoid being the outlier, and the equilibrium holds because no individual has an incentive to deviate unilaterally.

  However, this recovery succeeds only in explaining the *stability* of the behavior, not the *normativity* of the obligation. You ask us to keep apart the regularity that merely sustains itself from the one that enforces itself. In your town, deviants are resented but not punished. A strict Lewisian account explains resentment only instrumentally: I resent you because your deviation threatens the equilibrium from which I derive benefit. But here, the equilibrium provides no material benefit; the wood does not split. The only "benefit" is avoiding the resentment of others. This creates a circle: I conform to avoid resentment, and I resent you to enforce conformity. Lewis explains the first half (conformity based on preference) but struggles with the second (the source of the punitive preference). If everyone privately wants the practice to end, my resentment of your deviation is irrational in a pure coordination sense; you are attempting to move us toward a preferred state. I should welcome your deviation as a signal that change is possible. Instead, I resent you. This suggests my preference structure has been altered not merely by calculation, but by internalization. I have come to value the rule itself, independent of its utility.

  This brings us to the distinction between private desires. You specify that nearly everyone wants the practice to stop. This is not a case where preferences align with the convention (as in driving on the right); it is a case of pluralistic ignorance where preferences oppose the convention, yet meta-preferences (avoiding social cost) align with it. Lewis's model assumes common knowledge of preferences regarding the equilibrium. Here, there is common knowledge of the *desire to stop*, but common knowledge of the *expectation to conform*. The Lewisian framework can model the expectation, but it cannot explain why the expectation has hardened into an obligation that overrides the shared desire for change. The "displaced problem" explains why no one stops (the coordination risk), but it does not explain why those who continue feel entitled to dislike those who stop. That entitlement implies a norm that exists independently of the current coordination payoff.

  Therefore, the move to treat the censure of deviants as a second-order convention only relocates the mystery. It explains the mechanism of enforcement but not the genesis of the enforcing preference. Why do I care if you deviate, if your deviation harms me not at all materially, and potentially helps us escape a useless chore? The answer lies in the "felt ought" you describe. This obligation is not merely a summary of prudential preferences; it is a distinct psychological and social force. Lewis reduces the "ought" of convention to the "ought" of rationality (given your preferences, you ought to conform). Your town demonstrates an "ought" of social morality (you ought to conform because it is *wrong* not to, regardless of the payoff). To explain this, we need a supplement to Lewis: a theory of how regularities become internalized norms that generate punitive emotions even when the original coordination problem has dissolved. Lewis gives us the skeleton of the convention; he does not give us the muscle of the norm.

  Verdict: The Lewisian account is incomplete; it explains stability but not normative force.
