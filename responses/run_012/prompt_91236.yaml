prompt: |-
  hi, I'm a junior in high school and I'm on the debate team. we're doing a unit on organ donation and the dead donor rule (the rule that you can't take someone's organs until they're already dead), and I volunteered to make the handout that sorts out what everyone in the room actually believes, because right now our arguments are a mess. half of us say the person on the ventilator is obviously dead, half say the body is obviously still alive, and everyone just talks past each other about "brain death" like it's one thing.

  I want you to act like a philosopher of medicine who has sat on a real hospital ethics committee, and build me a decision tree (or flow chart, or quiz with a scoring key, whatever actually sorts people best) that takes someone from stuff everybody already agrees on to a named position about when a person is dead. Please think it through carefully before you start writing — maybe list out all the positions you can come up with first and then figure out which questions really seperate them, because I don't want a tree where two different branches end up in the same place.

  Please don't just give me the three answers from the textbook (brain, heart, or both), I've already got those. Here's the stuff I want in there, because it's the stuff that actually bugs me:

  - the difference between the definition of death, the criteria for it, and the bedside test. I keep seeing people agree about the definition and then fight about the test as if the test was the definition.
  - irreversibility. if someone's heart stops and they get CPR and come back, did they die? everybody talks like they did, but then death isn't irreversible. so is "you can't come back from it" part of what death means, or just part of how we check?
  - the fact that a body whose whole brain has died can sit on a machine for months, digesting, healing wounds, fighting infections, and I read about cases where a body like that was kept going long enough to deliver a baby. does any of that count as the organism still being alive, or is it just parts running on their own with nobody home?
  - the "three deaths" thing I read about somewhere: biological death, the death of the person or their consciousness, and social death, when people start treating you as gone. I'd like the tree to show which one each position is actually about.
  - whether the answer changes depending on what you need the answer for: organ donation, turning off the machine, a funeral, inheritance, a pregnancy. is "dead" one fact, or does it depend on what's at stake?
  - whether being dead is even a yes/no thing or could be a process or a grey zone, and if it's grey, whether that's because we don't know or because there's nothing there to know.

  every branch node should be a concrete case or a claim about a case, worded so my teammates can answer it without knowing the name of any position. like, don't ask "are you a higher-brain theorist", ask them about the patient in room 3. the leaves should be named positions, each with one line on the most awkward thing it has to swallow. if there's a combination of answers that nobody actually defends, leave the leaf empty and tell me why (is it incoherent, just unattractive, or has nobody bothered). and if two positions land on the same leaf because the tree can't tell them apart, say so instead of pretending they're different. keep it to maybe eight or so leaves, but don't drop a position just because it's weird.

  be committed — I don't want a menu of options, I want your tree. make the calls: which questions go on it, which positions are the leaves, and at the end tell me where you'd actually put yourself and which branch you think people get wrong the most, and definately give reasons and not hedges.
