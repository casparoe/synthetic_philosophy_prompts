answer: |-
  1. Ask the taster to describe the physical sensation without using value terms like 'flat.' Force them to distinguish whether the bitterness intensity changed or if they simply weighed bitterness more heavily in their scoring.
  2. Have them rinse and taste a neutral reference to reset adaptation, then re-cup the sample blind. This checks if the descriptor persists without the label triggering selective attention or expectation.
  3. Compare their blind score against their original labeled score to see if the variance exceeds their personal baseline noise. This determines if their sensitivity actually moved or if they merely shifted their response criterion based on expectation.
  4. Should the panel split on the blind re-test, acknowledge that you cannot empirically separate cognitive penetration from unarticulated perceptual learning. Consequently, treat the original data as contaminated regardless of which theory is true.
  5. If the disagreement persists after the blind check, declare the sample inconclusive for buying purposes. Do not average scores that mask a fundamental instability in perception.
