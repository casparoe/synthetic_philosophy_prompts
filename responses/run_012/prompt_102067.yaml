      *   *Rehab Physician:* Insult vs. Environment is messy. Stroke recovery vs. normal aging?
      *   *Disability Studies Scholar:* "Normal function" is oppressive. Reaction norm still presupposes a "proper" range.
      *   *Philosopher of Biology:* Reaction norm is a population statistic, not an individual property. Epigenetics makes "constitution" unstable.
      *   *Hospital Counsel:* Legal risk. Same drug, different coverage? Due process? Appeals?
      *   *Patient Advocate:* Stable conditions (e.g., dwarfism, aging) aren't "deficits." Don't pathologize existence.
      *   *Health Economist:* Cost. Is this measurable? Can people game the system (claim bad environment to get drugs)?

  3.  **Prioritize by Damage:**
