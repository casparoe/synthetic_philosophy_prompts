      *   **Core Argument:** Treatment = restoring/moving toward the individual's reaction norm range (given constitution + realistic environments). Enhancement = pushing past the upper edge of that range. It's a coverage criterion, not a moral one.
      *   **Audience:** 10 specific members with distinct perspectives/concerns (Endocrinologist, Psychiatrist, Rehab Physician, Disability Studies Scholar, Philosopher of Biology, Hospital Counsel, Patient Advocate, Health Economist, + 2 unspecified/implicit).
      *   **Constraints:** 40 min presentation, 20 min Q&A. Draft a Q&A prep sheet.
      *   **Requirements:**
