answer: |-
  Bottom line
  The commenter correctly describes the internal logic of standard economic models but mistakenly treats a modeling assumption as an empirical truth about human rationality. While the math holds within the framework, applying it to real-world disagreement conflates theoretical consistency with psychological reality.

  Claim by claim
  Simplification. It defines the math correctly but presents a contested normative stance—that rationality *requires* common priors—as a plain definition rather than an assumption imposed for tractability.

  Simplification. The theorem requires common knowledge of posteriors, which is much stronger than merely sharing evidence, and labeling real-world disagreement as irrational assumes the model applies to reality rather than just within itself.

  Accurate. This correctly identifies the theoretical consequences, though critics argue this proves the model is too restrictive rather than proving bubbles are impossible in the real world.

  Simplification. This is a poetic metaphor for epistemic consistency, not a literal claim about identity or psychology, and Harsanyi himself framed it as a methodological rule rather than an ontological truth.

  What the CPA actually says
  The Common Prior Assumption is a consistency condition for models, not necessarily a fact about human minds. It posits that if agents share the same initial probability distribution over states of the world and update via Bayes' rule, any differences in their final beliefs must be traceable solely to differences in information. Defenders argue this is a regulative ideal of rationality: if you know someone else disagrees, you should update your belief based on the fact that they disagree, eventually converging. Critics push back harder, arguing that priors are shaped by genetics, culture, and upbringing, meaning there is no neutral "view from nowhere" from which everyone should start, making the assumption descriptively false and normatively dubious.

  What survives
  The logical link between common priors and the impossibility of speculative trade remains valid within the closed system of the model. However, the normative conclusion that real-world bubbles prove irrationality collapses if you reject the premise that humans *must* share priors. The math survives intact, but the philosophical claim that disagreement implies irrationality does not follow once you recognize the CPA as a tool rather than a law of nature.
