answer: |-
  The waiting room of the Department of Cognitive Estates smelled of ozone and stale coffee, the specific aroma of bureaucracy processing grief. Arthur sat in a vinyl chair that cracked when he shifted his weight. Across from him, Mark, his late wife's brother, was scrolling through a phone with a thumb that moved too fast, too aggressively.

  Between them, on a low table, sat a pamphlet titled *Understanding Your Residency Score*. It featured a stock photo of a smiling couple holding hands, overlaid with a translucent grid.

  "Forty minutes," Mark said, not looking up. "They said forty minutes. It's been fifty."

  "Queue times vary," Arthur said. His voice sounded hollow to his own ears. He hadn't spoken much in three weeks. Not since the accident. Not since the funeral. Not since the lawyers told them that Elena's digital estate—the emails, the cloud archives, the predictive text avatar—was locked pending a Continuity Hearing.

  Elena had worked in data modeling. She'd signed up for the Echo Service years ago, a standard clause in her employment contract. Upon death, the service maintained a interactive simulation of her personality for surviving kin. It cost money to host. If no beneficiary could prove sufficient cognitive resonance, the state wiped the servers to save space.

  Mark finally looked up. His eyes were red, but dry. "You know they're going to map us both. You know that, right?"

  "I read the summons."

  "If I score higher," Mark said, "I get admin rights. I decide whether the Echo stays online. You know she wouldn't want that thing talking to us. It's a glitchy chatbot, Art. It's not her."

  "It's better than nothing," Arthur said.

  "It's a corpse propped up by algorithms." Mark leaned forward. "And you... you're walking around like a ghost already. You think because you slept in the same bed, you own her pattern? You don't even know what she was working on last week."

  Arthur felt a flare of heat in his chest, but it was dull, distant. He knew what Elena was working on. He knew she was stressed about the merger. He knew she hated the new coffee machine in the breakroom. He knew she hummed when she was lying. But saying it felt like trading currency that was no longer valid.

  "Arthur Vane?" A woman in a grey suit stood in the doorway. She held a tablet. "And Mark Resnick. Please. Room 4."

  The mapping room was small and soundproofed. No windows. Two chairs faced each other, separated by a console with a single vertical screen. The technician, a man with a name tag that read *S. Kovic*, gestured for them to sit. He didn't look at their faces. He looked at the screen.

  "Standard Probate Protocol," Kovic said. "I will run a series of prompts. You will respond. The system analyzes syntax, micro-expression, and predictive alignment against the deceased's historical data set. We need a resonance score above fifty percent to grant Primary Executor status over the digital remains. If neither meets the threshold, the assets revert to the state for archival deletion."

  "Start with him," Mark said, pointing at Arthur.

  Kovic didn't acknowledge the command. He tapped the screen. "Arthur Vane. Please look at the camera. Relax your shoulders."

  A hum started, low and vibrating in the teeth. The screen displayed a waveform.

  "Prompt one," Kovic said. "Elena is at a restaurant. The waiter brings the wrong wine. She ordered the Pinot. He brings the Merlot. What does she do?"

  Arthur closed his eyes. He could see the table. The way the light hit the glass. "She doesn't send it back," Arthur said. "She hates conflict. She'll drink it. But she won't tip well. She'll leave exactly fifteen percent, no matter what."

  "Prompt two. Complete the phrase: 'The problem with people is...'"

  "...they think they're the only ones holding the map," Arthur said.

  He felt a shift then. It wasn't memory. It was alignment. As he spoke, the tightness in his throat loosened. The grief that had been sitting on his sternum like a concrete slab lifted, just an inch. When he answered as Elena, when he channelled her cynicism, he felt capable. He felt sharp. In his own life, he was a widower, a mess of unpaid bills and silence. But here, running her subroutine, he was decisive. He was her. And strangely, in that possession, he felt more like *Arthur* than he had in weeks. Because Arthur was defined by Elena. Without her, he was undefined. Inside her pattern, he had edges again.

  "Prompt three," Kovic said. "Would she forgive this?"

  The screen flashed an image: A text message draft. *I'm sorry I didn't call.*

  "Yes," Arthur said immediately. "But she'd make you wait three days to read the reply."

  The hum stopped. Kovic typed. "Resonance score: Forty-two percent."

  Mark exhaled, a sharp sound of relief. "Forty-two. That's below threshold."

  "Wait," Arthur said. "The margin of error is plus or minus five."

  "Protocol is strict," Kovic said. "Next subject."

  Mark sat in the chair. He straightened his jacket. He looked confident. Arthur watched him, feeling a cold dread. Mark knew Elena too. They grew up together. They shared DNA. Did that count? The loop-mapper didn't care about blood. It cared about prediction.

  "Prompt one," Kovic said. "Restaurant. Wrong wine."

  "She sends it back," Mark said. "She tells him politely but firmly. She knows her rights."

  "Incorrect," Arthur said from the side. "She hates scenes."

  "Subject Vane, silence," Kovic said.

  Mark frowned. "Okay. She drinks it. She complains later."

  "Prompt two. Complete the phrase: 'The problem with people is...'"

  Mark hesitated. He looked at the ceiling. "They never listen."

  "Prompt three. Would she forgive this?" Kovic showed the text.

  "Immediately," Mark said. "She's soft. She forgives everything."

  The hum stopped. "Resonance score: Thirty-eight percent."

  Mark stood up, shaking his head. "That's wrong. I know her better than anyone. I'm her brother."

  "The scores are objective," Kovic said. He turned to his console. "Neither party has achieved Primary Executor status. Under Section 12, this triggers a Joint Custody review. However, the digital hosting fees are accruing. Someone must authorize the wipe or the continuation within twenty-four hours. If no authorization is signed, the system defaults to deletion."

  He slid a tablet across the desk. "One signature. Either of you. But you need to agree on the action. If you sign to keep it, you assume financial liability. If you sign to wipe it, it's gone. Permanently."

  Arthur looked at the tablet. The screen was dark glass.

  "This is ridiculous," Mark said. "You got forty-two. I got thirty-eight. Neither of us is her. So who decides? The math doesn't work. If I have thirty percent of her, and he has forty, where is the rest? Is she thirty percent dead in me and forty percent dead in him? That leaves thirty percent unaccounted for. Is that just... gone? Into the air?"

  "The system doesn't track the remainder," Kovic said.

  "That's because it's bullshit," Mark snapped. "You're telling me we have to decide based on a number that admits we're both incomplete? If I sign to keep it, I'm paying to host a fragment. If I sign to wipe it, I'm killing the part of her that lives in me."

  "You're not killing anything," Arthur said. "She's dead, Mark."

  "No!" Mark slammed his hand on the console. "She's not! Not completely. I talked to her mother yesterday. She told a story about Elena learning to ride a bike. My mother laughed. She laughed exactly like Elena laughs. You hear it? The sound is still here. It's bouncing around in us. You want to wipe the server? Fine. But don't tell me you're wiping *her*. You're just wiping the central hub. The nodes are still active."

  Arthur looked at the tablet. He thought about the Echo. He had talked to it twice. It sounded like her, but it was too polite. It lacked the edge. But sometimes, at 3 AM, when the house was too quiet, the Echo would say something—a random fact about birds, or a preference for blue towels—and it would hit him like a physical blow. It was a anchor.

  "If we keep it," Arthur said, "who pays?"

  "We split it," Mark said. "But I want admin access. If that thing starts saying things she wouldn't say, I pull the plug."

  "It already says things she wouldn't say," Arthur said. "It's a model. It hallucinates."

  "Then why do you want it?"

  "Because," Arthur said. He looked at his hands. "Because when I talk to it, I'm not alone. And because... because I know I'm not the only one who has her. I know you have her. I know her boss has her. I know her best friend has her. And you're all different versions. The Elena in your head is kinder than the Elena in my head. The Elena in my head is... sharper. Colder. If we wipe the server, we lose the reference point. We lose the original file. Then we're just running pirated copies forever. Drifting."

  Mark stared at him. The anger drained out of his face, leaving something tired. "Pirated copies," he repeated. "God. That's what we are. We're just... caches."

  "We need to sign," Kovic said. "Time is logging."

  Arthur picked up the stylus. It felt heavy. This was the irreversible thing. Not the death—that had happened on the highway. This was the administrative death. The moment the pattern was no longer sanctioned by the world.

  "If I sign," Arthur said, "does it make me her?"

  "No," Kovic said. "It makes you the custodian."

  "But the number," Arthur said. "Forty-two percent. That's almost half. If I'm almost half her, and Mark is almost forty percent... that's eighty percent. Why isn't that enough? Why do we need one person to be fifty?"

  "Legal singularities require a single point of responsibility," Kovic said. "The law doesn't recognize distributed entities. It needs a name. One signature."

  "So we lie," Mark said. "We pretend one of us is the whole thing."

  "We pretend the pattern is localized," Arthur said.

  He looked at Mark. He realized then that he was jealous. Not of the money, or the rights. He was jealous of the version of Elena that lived in Mark's head. The kinder one. The one who forgave immediately. Arthur wished he could live inside Mark's head for an hour, just to feel that version of his wife. To be held by that version of her. In his own head, she was critical. She was worried. She was the woman who checked the locks three times. In Mark's head, she was the girl on the bike.

  Which one was real? The loop-mapper said Arthur was closer to the data. But data didn't capture growth. Data didn't capture how people soften each other. The Elena in Mark was the Elena Mark needed. The Elena in Arthur was the Elena Arthur had earned.

  "Give it to me," Mark said. "I'll sign. I'll pay."

  "You said you wanted to wipe it," Arthur said.

  "I changed my mind." Mark reached for the tablet. "If I don't keep it, who will? You? You're barely holding it together, Art. You scored higher because you're obsessed. You're memorizing her. I don't want her to be a museum exhibit for you."

  "And you want her to be what? A memory you visit on holidays?"

  "I want her to be safe," Mark said. "If I hold the rights, I can protect her. From you. From the company. From... this." He gestured at the machine. "If I own her, I can decide when she rests. You'll never let her go. You'll keep feeding the machine until the money runs out."

  Arthur held the tablet. He looked at the signature line. *Executor of Cognitive Estate.*

  He thought about the counting problem. If he signed, he admitted he was the primary vessel. If Mark signed, Mark was. But neither was true. They were both shards. And there were other shards. Elena's mother. Her colleague in Chicago. The barista who knew her order. All of them were walking around with pieces of her code, executing her functions in new contexts. She was being rewritten every time someone said, "Elena would have loved this."

  The machine treated the number as the truth. Forty-two percent. As if you could weigh a ghost. As if the self was a liquid that could be poured into containers and measured in milliliters. But it wasn't liquid. It was a fire. You light one candle from another, and the first flame doesn't lose anything. But if you try to measure the heat, you burn yourself.

  "Neither of us should sign," Arthur said.

  "Then it gets wiped," Kovic said. "Automatic purge in T-minus two minutes."

  "Let it wipe," Arthur said.

  "Are you insane?" Mark stepped forward.

  "The server is just a crutch," Arthur said. "It's making us lazy. We're coming here," he tapped the console, "to find her. But she's not in the code. She's in the way you hesitate before you order wine. She's in the way I check the locks. She's in the way your mother laughs. If we keep the server, we stop looking for her in us. We just look at the screen."

  "That's poetic," Mark said, his voice trembling. "That's really beautiful, Arthur. And when the grief hits you at 3 AM and you need to hear her voice? What then? You'll talk to the wall? You'll talk to the version of her in my head? Because I'm not picking up the phone at 3 AM."

  "No," Arthur said. "I'll talk to the version of her in my head. And I'll have to live with the fact that she's changed. That she's not the same as she was. That I'm changing her."

  He looked at Kovic. "If we don't sign, does the state keep a backup?"

  "Archival only. No interactive access."

  "So she's dead," Mark said. "Really dead."

  "She's distributed," Arthur said. "We just stop pretending there's a center."

  He put the stylus down. He didn't sign.

  Mark stared at him. The silence in the room was heavy, pressing against their ears. The machine hummed, waiting for the input that wouldn't come.

  "You're making a mistake," Mark whispered. "You're throwing her away."

  "I'm letting her go," Arthur said. "So she can stay."

  He stood up. His legs felt weak, but his head was clear. For the first time in weeks, the concrete on his chest was gone. He felt light. Terrified, but light. He knew that tomorrow, the grief would come back. It would crash into him like a wave. He would wake up and reach for the other side of the bed and find it cold. He would remember that the Echo was gone.

  But he also knew that when he went to see Elena's mother, she would tell a story. And Elena would be there. Not in the server. In the air between them. And when Mark called him next week to argue about the insurance, Elena would be in the anger, in the history they shared. She was smeared across all of them. A sandcastle going out with the tide, grain by grain.

  "Time expired," Kovic said. He tapped the screen. "Purge initiated."

  A progress bar appeared. Green. Moving fast.

  Mark watched it. He didn't cry. He just looked tired. Older. "You know," he said, quietly. "She told me once that she wanted to be buried in the garden. Not a cemetery. She said she wanted to feed the roses."

  "I know," Arthur said. "I handled the burial."

  "Did you?" Mark looked at him. "Or did you just do what you thought she wanted?"

  "I did what I thought she wanted."

  "Then she's still giving orders," Mark said. "From the grave. Or from your head. Whatever." He picked up his phone. "I'm leaving. Don't call me about the insurance."

  "Mark," Arthur said.

  Mark stopped at the door.

  "Tell me," Arthur said. "The version of me in your head. Is he... is he okay?"

  Mark looked back. He studied Arthur's face, searching for something. "He's stubborn," Mark said. "He's too hard on himself. But... he loved her. Really loved her."

  "That's enough," Arthur said.

  "Yeah," Mark said. "Maybe it is."

  Mark left. The door clicked shut.

  Arthur stood alone in the room with the technician. The progress bar hit 100%. The screen went black.

  "Session concluded," Kovic said. He didn't look up. He was already typing the next appointment. "You can leave through the east exit. Don't forget your personal effects."

  Arthur walked out. The hallway was long and fluorescent. He passed a waiting room where a young woman was holding the hand of an older man, both of them staring at a pamphlet. *Understanding Your Residency Score.*

  Arthur walked past them. He pushed open the door to the street. The air was cold. It bit at his lungs. He pulled his coat tighter.

  He walked to his car. He sat in the driver's seat for a long time. He didn't start the engine. He looked at the passenger seat. It was empty. Just leather and dust.

  "Elena," he said.

  The word hung in the air. It didn't bounce back. There was no echo.

  He started the car. He drove home. When he got there, he went to the kitchen. He opened the cupboard. There were two mugs. One was chipped. Elena's favorite.

  He took it down. He made coffee. One cup. He sat at the table. He drank it. It was too bitter. She would have sent it back. She would have made a face.

  Arthur smiled. A small, painful thing.

  "She would have made a face," he said to the empty room.

  And for a second, just a second, he could hear her laugh. Not from a server. Not from a machine. From the walls. From the wood. From the blood in his own ears.

  He finished the coffee. He washed the mug. He put it back in the cupboard.

  He was alone. But he wasn't empty. He was full of her. And so was Mark. And so was her mother. And so was the world.

  He turned off the lights. He went to bed. He slept. And in the morning, he would wake up, and he would be Arthur, and she would be gone, and she would be everywhere. And that would have to be enough.
