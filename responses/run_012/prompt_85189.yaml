prompt: |-
  I run the data-visualisation desk at a county public health department — small team, me plus two designers, and we put out a pictorial "numbers page" every fortnight that goes into clinics, buses and school offices, in three languages. Our comms director signs off on everything and she is not a data person, so anything I hand her has to be defensible in one sentence. We've been fighting for a year about house style. Half the team wants our charts to look like the ones everyone else makes now: big numbers, a photo of a real person with a name and a face, a friendly mascot for the flu campaign, 3-D bars because they pop. I keep arguing we should be working in the spirit of Otto Neurath's picture language — ISOTYPE, the Vienna Method, whatever you want to call it — and I want to stop arguing from vibes and just have a procedure. Here's my reconstruction of the principles I'm actually trying to honour, from a history-of-science course I took years ago, so treat this as my summary and tell me where I've garbled it or where it's internally in tension: (1) a picture statement should be readable on its own, without a caption or a paragraph of text doing the explaining, so someone who reads none of our three languages can still get the claim off the page; (2) quantity is shown by repeating many identical small signs, each sign standing for the same amount, so the reader compares by counting rather than by eyeballing a length or an area; (3) the signs should be flat silhouettes with no perspective, no shading, no character — the same generic figure every time, because a sign is a unit and not a person, and any "characteristic" detail invites the reader to read individuality, mood or blame into a statistic; (4) nothing decorative that doesn't carry a quantity; (5) the whole page is meant to be read as one connected statement rather than a gallery of separate exhibits, and the order of the elements is part of the argument; and (6) it's for people who are not going to be talked at in technical language, so the pictorial statement is not a simplification of the real thing, it's a different and in some ways better instrument. I know there's something in Neurath about one sign sometimes standing for a round number of people rather than one, and about education being picture-first, but I can't reconstruct how those sit with (2) and (3), so flag that if it matters.

  What I need from you is a decision procedure my desk can actually run, in order, on any chart before it goes to sign-off: the questions to ask, what counts as a sufficient answer to each, which questions stop the chart with a no, and which ones hand the decision to a person because it's a question of values or of our audience and not of facts. Keep the constraints real — I have maybe twenty minutes per chart, my designers have no philosophy and no time to read Neurath, and the comms director will overrule me for anything that looks cold or that she thinks won't land with a councillor. Then run the procedure on three charts we're actually building: (a) lead screening rates by ZIP code, where the honest answer is that two of the twelve ZIPs have samples so small that the rates swing wildly year to year; (b) overdose deaths by year for the county, 2014 to now, where the most recent year in our smallest town is three deaths — small enough that one sign per death makes the picture look like nothing is happening and one sign per hundred rounds it to zero; and (c) our own favourite draft, a big page on the county's mental-health line with photos of four real callers, first names, and a quote from each, which the team loves and which I suspect the procedure is going to tell me to throw out. Say plainly where the procedure gives an answer I won't like, and where it can't decide and someone just has to own the call.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **Role:** Head of Data Visualization Desk at a county public health department.
      *   **Team:** Small (User + 2 designers).
      *   **Output:** Fortnightly pictorial "numbers page" (clinics, buses, schools), 3 languages.
      *   **Stakeholder:** Comms Director (sign-off, non-data person, needs 1-sentence defensibility, worried about "coldness" and political landing).
      *   **Conflict:** Team wants modern "engaging" style (big numbers, photos, mascots, 3D bars). User wants ISOTYPE/Neurath style (pictorial statistics, repeating units, flat, no decoration).
      *   **Goal:** A practical *decision procedure* (checklist/algorithm) based on Neurath's principles to evaluate charts before sign-off. Needs to be fast (20 mins/chart), understandable by designers (no philosophy), and defensible to the Director.
      *   **Input:** User's reconstruction of 6 Neurath principles.
      *   **Task:**
          1.  Validate/Correct the user's understanding of Neurath/ISOTYPE.
          2.  Create the Decision Procedure.
          3.  Apply the Procedure to three specific chart scenarios (Lead Screening, Overdose Deaths, Mental Health Line).
          4.  Be plain about where the procedure conflicts with the user's desires or can't decide.

  2.  **Evaluate the User's Neurath Reconstruction:**
      *   *Principle 1 (Readable without text):* Accurate. Neurath wanted "visual education" transcending language barriers.
      *   *Principle 2 (Quantity by repetition):* Accurate. This is the core of ISOTYPE (Isotype System). Comparing counts of icons, not lengths of bars.
      *   *Principle 3 (Flat, generic silhouettes):* Accurate. Avoids individuality/emotion. A worker is a unit, not "John."
      *   *Principle 4 (No decoration):* Accurate. "Chartjunk" before Tufte. Every mark must carry data.
      *   *Principle 5 (Connected statement):* Accurate. Neurath viewed transformations as a narrative flow, not isolated charts.
      *   *Principle 6 (Different instrument, not simplification):* Accurate. Neurath believed pictures *transform* facts into a new form of knowledge, not just dumb them down.
      *   *The Tension (Rounding/Units):* The user asks about signs standing for round numbers (e.g., 1 icon = 1,000 people) vs. Principle 2 (counting units).
          *   *Correction:* Neurath *did* use scaling (1 icon = $x$ units). However, if a quantity is less than a unit, ISOTYPE traditionally avoids fractional icons (cutting the icon in half) because it turns counting into measuring (area/length), violating Principle 2. If the number is too small for the scale, you either change the scale (making other bars huge) or acknowledge the limitation. This is a key tension point for the procedure.

  3.  **Develop the Decision Procedure:**
      *   *Constraints:* 20 minutes, designers need clarity, Director needs defensibility.
      *   *Structure:* A linear flow of questions.
      *   *Types of Questions:*
          *   *Hard Stops (ISOTYPE Violations):* If "No," chart is rejected/redrawn.
          *   *Soft Stops (Design/Clarity):* If "No," needs revision.
          *   *Value Judgments (Director's Call):* If "Unclear," escalate to Director with a specific framing.
      *   *Drafting the Questions:*
          1.  Can it be understood without reading the text? (Principle 1)
          2.  Are quantities represented by countable units? (Principle 2 & The Rounding Tension)
          3.  Are the units identical and neutral? (Principle 3)
          4.  Is every mark functional? (Principle 4)
          5.  Does the layout tell a story? (Principle 5)
          6.  Is the transformation honest? (Principle 6)
      *   *Refining for the Director:* Need a "One-Sentence Defense" generator at the end of each pass.

  4.  **Apply Procedure to Scenarios:**

      *   **Scenario A: Lead Screening by ZIP (Small sample sizes).**
          *   *Issue:* Two ZIPs have unstable rates.
          *   *ISOTYPE View:* If we show them, we imply stability. If we hide them, we hide data.
          *   *Procedure Check:* Principle 6 (Honest transformation).
          *   *Outcome:* Must indicate uncertainty visually without breaking the unit count. Maybe grey out the units? Or exclude with a note? ISOTYPE prefers excluding misleading data over showing "noisy" data as fact.
          *   *Conflict:* Director might want all ZIPs shown for political coverage.

      *   **Scenario B: Overdose Deaths (Small numbers vs. Scale).**
          *   *Issue:* 3 deaths in a town. 1 icon = 1 death (looks like nothing)? 1 icon = 100 deaths (rounds to zero)?
          *   *ISOTYPE View:* Principle 2 (Counting). If 1 icon = 1 death, 3 icons is countable. If 1 icon = 100, you can't count 3.
          *   *Tension:* Neurath avoided fractional icons.
          *   *Outcome:* Use 1 icon = 1 death for the small towns, but then the big towns become massive. OR, use a dual scale (violates strict ISOTYPE). OR, acknowledge the small number with a specific "small number" symbol.
          *   *Real talk:* 3 deaths is significant in public health. Rounding to zero is unethical. 1 icon = 1 death is the only honest way, even if it makes the chart unbalanced.
          *   *Director Conflict:* She might think 3 icons looks "scary" or "negligible" depending on framing.

      *   **Scenario C: Mental Health Line (Photos of real people).**
          *   *Issue:* Photos, names, quotes.
          *   *ISOTYPE View:* Violates Principle 3 (Generic silhouettes, no individuality). Violates Principle 4 (Photos are decorative/emotive, not quantitative).
          *   *Outcome:* Procedure says **NO**. This is not ISOTYPE. This is marketing/storytelling.
          *   *User's Fear:* The procedure will tell them to throw it out.
          *   *Reality:* This is a Value Judgment. ISOTYPE is for *statistics*. Testimonials are for *empathy*. They serve different masters.
          *   *Decision:* The procedure must flag this as "Not a Statistical Chart." It requires a Director decision based on goals (Education vs. Engagement).

  5.  **Refining the Output:**
      *   *Tone:* Professional, direct, respectful of the User's expertise but firm on the constraints.
      *   *Structure:*
          1.  Validation of Neurath principles (addressing the rounding tension).
          2.  The Decision Procedure (The "ISOTYPE Gate").
          3.  Application to the 3 Charts.
          4.  The "One-Sentence Defense" for the Director.
      *   *Self-Correction during drafting:* I need to make sure I don't just say "Neurath says no." I need to give the User a way to manage the Team and Director. The procedure isn't just "Is this Neurath?" it's "Is this *our* standard?"
      *   *Addressing the "Rounding" Tension:* Neurath's rule was: Never split the symbol. If 1 symbol = 1000, and you have 500, you don't draw half a symbol. You either leave it blank (understatement) or draw one (overstatement). Usually, they adjusted the unit value to minimize this error. I need to make sure the procedure handles the "3 deaths" problem specifically.

  6.  **Final Polish:**
      *   Ensure the "One Sentence Defense" is actually usable.
      *   Make sure the "Stop/Go" logic is clear.
      *   Highlight where the User has to take the heat (Value Judgments).

  *(Self-Correction on the Mental Health Chart)*: The user suspects the procedure will tell them to throw it out. I should confirm this but offer a nuance: It's not a *data visualization*, it's a *testimonial page*. If the publication allows mixed media, it can stay, but it shouldn't be labeled as a statistical chart. I need to be firm: ISOTYPE cannot accommodate photos of real people.

  *(Self-Correction on Lead Screening)*: Small sample size is a data quality issue, not just a viz issue. ISOTYPE demands clarity. Showing unstable data as solid blocks is misleading. The procedure should flag "Data Stability" before "Visual Style."

  *(Self-Correction on Overdose)*: The tension between "1 icon = 1 death" (countable) and "1 icon = 100 deaths" (scalable). If the range is 3 to 300, 1=1 makes 300 icons (too many). 1=10 makes 30 icons (ok) but 3 deaths is 0.3 icons. Neurath would say: Change the unit or group the data. I will suggest grouping years or regions to make the units work.

  7.  **Finalizing the Text:** (Drafting the response based on these thoughts.)
answer: |-
  This is a sophisticated design management problem. You are trying to institutionalize an epistemological stance (Neurath's empirical realism) within a bureaucratic structure that prioritizes engagement and political safety.

  Here is the validation of your principles, the decision procedure you asked for, and the application to your three charts.

  ### Part 1: Validating Your Neurath Reconstruction

  Your summary of the six principles is historically sound and practically usable. You have not garbled the core tenets. However, you identified the exact friction point in your final paragraph regarding **scaling and rounding**.

  **The Tension (Principles 2 & 3):**
  You are correct that Neurath used units to represent quantities (e.g., one man = 1,000 workers). The tension arises when a value does not equal a whole number of units.
  *   **The Rule:** ISOTYPE strictly forbids fractional icons (e.g., half a man). Cutting an icon turns "counting" (Principle 2) into "measuring area/length," which the human eye is bad at.
  *   **The Solution:** If a value is 500 and one icon = 1,000, you do not draw half an icon. You either draw nothing (understatement) or one icon (overstatement). To avoid this, the *transformation team* (you) must choose a unit value that minimizes fractional remainders across the dataset, or group data categories so the totals align with whole units.
  *   **The Conflict:** This often makes ISOTYPE charts look "blocky" or less precise than a bar chart. You must defend this blockiness as *honesty about precision*, not a lack of design skill.

  **Internal Tension Alert:**
  Principle 1 (Readable without text) and Principle 5 (Connected statement) can conflict. A complex narrative flow often requires signposting (text) to ensure the reader follows the argument in the intended order. In a 20-minute workflow, prioritize Principle 1. If they can't read the claim without text, the layout (Principle 5) doesn't matter.

  ---

  ### Part 2: The ISOTYPE Decision Procedure

  This procedure is designed for your designers. It requires no philosophy, just "Yes/No" checks. It takes about 5 minutes per chart, leaving 15 for revisions.

  **The "One-Sentence Defense" Generator:**
  At the end of every check, if the chart passes, you must be able to fill in this blank for the Comms Director:
  *"We designed it this way so that [Audience] cannot accidentally [Misinterpretation]."*

  #### Phase 1: The Hard Stops (Data Integrity)
  *If the answer is NO, the chart cannot be published as a statistical graphic.*

  1.  **The Unit Test:** Does every visual element represent a specific, consistent quantity? (e.g., 1 icon = 500 people).
      *   *No:* Redraw. (Bans 3D bars, varying widths, pie charts).
  2.  **The Fraction Test:** Are there any partial icons (halved people, cut bars)?
      *   *Yes:* Redraw. Change the unit value or group the data categories until all icons are whole.
  3.  **The Stability Test:** Does the data have a margin of error larger than the visual difference between categories? (e.g., The difference between ZIP A and ZIP B is smaller than the sampling error).
      *   *Yes:* **STOP.** Do not visualize. Write a text note: "Data too unstable to compare." ISOTYPE cannot visualize uncertainty without lying.

  #### Phase 2: The Style Check (ISOTYPE Compliance)
  *If the answer is NO, the chart is not ISOTYPE. It may still be published, but it must be labeled as "Illustration" or "Story," not "Numbers."*

  4.  **The Identity Test:** Are the icons generic silhouettes rather than specific individuals? (No faces, no names, no shading).
      *   *No:* Flag for Director. (This is a Value Judgment, see Phase 3).
  5.  **The Decoration Test:** If I remove this element, does the quantity change?
      *   *No:* Remove it. (Bans mascots, decorative borders, background photos behind charts).
  6.  **The Language Test:** If I cover all the words, do I still know which category is larger?
      *   *No:* Redraw. (Relies on color or position, not text labels).

  #### Phase 3: The Director's Gate (Value Judgments)
  *If you hit a NO here, do not fix it yourself. Take it to the Comms Director with the "One-Sentence Defense."*

  7.  **The Empathy Check:** Does this chart require the viewer to feel *sadness* or *urgency* rather than just *knowledge*?
      *   *Yes:* This requires photos/names (Violates Rule 4).
      *   *Action:* Ask Director: "Do we want to count this problem or humanize this problem? We can do one or the other, not both on the same visual plane."
  8.  **The Political Check:** Will showing the exact units make a small number look negligible or a large number look scary compared to last year's style?
      *   *Yes:* This is a risk calculation.
      *   *Action:* Ask Director: "ISOTYPE shows the count exactly. A bar chart can smooth this. Which risk do you prefer: looking imprecise or looking manipulated?"

  ---

  ### Part 3: Running the Procedure on Your Three Charts

  Here is the plain truth about where the procedure lands.

  #### Chart A: Lead Screening Rates by ZIP Code
  *The Data:* 12 ZIPs. 2 have small sample sizes/wild swings.
  *The Procedure:*
  1.  **Unit Test:** Pass (Icons per rate).
  2.  **Fraction Test:** Pass.
  3.  **Stability Test:** **FAIL.** The two ZIPs have margins of error larger than the visual difference.
  *   **Result:** **STOP.**
  *   **Why:** ISOTYPE claims to show facts. Showing unstable data as solid blocks of icons is a lie.
  *   **The Fix:** You cannot visualize the *rate* for those two ZIPs. You must either exclude them with a footnote ("Data insufficient") or visualize the *sample size* instead (showing few icons for the small samples).
  *   **Director Defense:** "We excluded two ZIPs so parents don't make safety decisions based on statistical noise."
  *   **The Friction:** Your team will want to fill the map. The Director will worry about excluding constituents. You must hold the line on Rule 3. If you visualize noise, you are not a data desk; you are a decoration desk.

  #### Chart B: Overdose Deaths (2014–Now, Small Town)
  *The Data:* Range from 3 deaths (small town) to hundreds (county).
  *The Procedure:*
  1.  **Unit Test:** **TENSION.**
      *   Option 1 (1 icon = 1 death): Small town shows 3 icons. County shows 500 icons (Too many to count, violates Principle 2).
      *   Option 2 (1 icon = 50 deaths): Small town shows 0.06 icons. Rounds to zero (Violates Principle 6/Honesty).
  2.  **Fraction Test:** **FAIL** if you try to split the icon for the small town.
  *   **Result:** **PROCEDURE CANNOT DECIDE.** This is a scaling limitation of ISOTYPE.
  *   **The Fix:** You must group the data. Do not show "Small Town" vs "County." Show "Small Towns (Aggregate)" vs "Large Towns (Aggregate)." This creates whole numbers that fit a single unit scale.
  *   **Director Defense:** "We grouped the towns so every icon represents the same number of lives, otherwise we are hiding the small towns."
  *   **The Uncomfortable Truth:** If the Director insists on showing the specific small town with a 1:100 scale, the procedure says **NO**. It rounds to zero, which is ethically unacceptable in public health. You must escalate this as a Value Judgment (Phase 3, Rule 8).

  #### Chart C: Mental Health Line (Photos & Quotes)
  *The Data:* 4 real callers, photos, names, quotes.
  *The Procedure:*
  1.  **Unit Test:** **FAIL.** Photos do not represent a quantity.
  2.  **Identity Test:** **FAIL.** These are specific individuals, not generic units.
  3.  **Decoration Test:** **FAIL.** The photos carry emotion, not data.
  *   **Result:** **NOT A CHART.**
  *   **The Fix:** This is not data visualization. This is *testimonial marketing*.
  *   **Director Defense:** "This page is for empathy, not statistics. It belongs in the 'Stories' section, not the 'Numbers' section."
  *   **The Hard Truth:** You suspected the procedure would tell you to throw it out. **It does.**
      *   *Why:* You cannot mix ISOTYPE (which removes individuality to show structure) with Portraiture (which highlights individuality to show emotion). They cancel each other out.
      *   *Compromise:* You can publish it, but do not call it a "Numbers Page." If you put photos of real people next to ISOTYPE icons, the viewer will try to count the people. If there are 4 photos and 100 icons, does that mean 4 people represent 100 calls? It creates confusion.
      *   *Recommendation:* Let your team have this, but segregate it. "Here are the numbers (ISOTYPE). Here are the voices (Photos)." Do not blend them.

  ### Summary of Constraints & Conflicts

  1.  **Time:** This procedure saves you time on *arguments* but costs time on *data prep*. Grouping data (Chart B) and checking stability (Chart A) takes longer than just dumping numbers into a template. You need to front-load this time.
  2.  **The Director:** She will overrule you on Chart C (Photos). She views "coldness" as a risk.
      *   *Your Counter:* "ISOTYPE isn't cold; it's neutral. Photos are warm, but they aren't data. If we mix them, we lose trust in the numbers."
  3.  **The Team:** They want to make "modern" work.
      *   *Your Counter:* "Modern" changes every year. Neurath has lasted 100 years because it works for non-readers and non-speakers. We serve the person on the bus who doesn't speak English. That is our mission, not winning design awards.

  **Final Advice:**
  Print the **Phase 1 (Hard Stops)** and tape it to your designers' monitors. That is non-negotiable.
  Keep **Phase 3 (Director's Gate)** for yourself. That is where you manage the politics.
  For Chart C, tell your team: "Make the photos. But they go on page 2. Page 1 is the units." That keeps your integrity without killing their morale.
