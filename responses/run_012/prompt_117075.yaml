  The case is a zoning compliance dilemma where a development manager must choose between falsifying a wetlands report to save her team's jobs (Option A) or reporting the violation and causing their layoffs (Option B); under your rules, Expected Value (Rule 1) and Maximin (Rule 2) both mandate the fraud, while My Favorite Theory (Rule 3) mandates honesty.

  **Brainstorming Candidates**
  1.  **The Safety Shortcut:** A factory manager skips a safety maintenance step to keep production lines running. *Discard:* Too close to a ticking bomb; if someone gets hurt, the humane theory assigns infinite negative value, breaking the arithmetic for Rule 2.
  2.  **The Data Breach:** A tech lead hides a minor privacy leak to prevent stock collapse. *Discard:* Hard to make the "decent" option (revealing the leak) catastrophic enough for Rule 2 to prefer the cover-up without making the cover-up itself feel like a cartoon villain move.
  3.  **The Whistleblower:** An accountant finds legal but unethical tax avoidance. *Discard:* The harm of the tax avoidance is too diffuse to generate the sharp score asymmetry needed for Rule 2 to flip; the "worst case" of both options feels too similar.
  4.  **The Wetlands Permit (Survivor):** A project manager discovers a technical zoning violation on a site where groundwork is already laid. *Keep:* This allows a clear asymmetry between "professional shame" (bounded negative) and "economic ruin for families" (unbounded negative), which is the only way to make Rule 2 select the ruthless option without stacking the deck on Rule 1.

  **The Scenario**
  You are the project director for a mid-sized housing development, and you've just discovered that the surveyor misclassified five acres of protected wetlands; the foundations are already poured, and correcting the error means halting construction indefinitely, triggering contract penalties that will bankrupt the firm and lay off eighty staff members who rely on their bonuses to renew mortgages this month. Option A is to sign off on the survey as-is; the ecological damage is negligible because the build footprint avoids the core habitat, but you are falsifying a legal document. Option B is to report the error to the zoning board; the environment is protected according to the letter of the law, but the company collapses and your team loses their livelihoods. You are 70% confident in Professional Integrity (a deontological view that holds falsification is intrinsically wrong regardless of consequences) and 30% confident in Social Welfare (a utilitarian view that weighs livelihoods and housing supply higher than technical compliance when safety isn't compromised).

  **Walkthrough**

  *   **Verdicts and Arithmetic:**
      *   **Rule 3 (Back Your Best Guess):** Your 70% confidence theory (Professional Integrity) rates Option B (+10) higher than Option A (-10) because honesty is a duty. **Verdict: Choose B.**
      *   **Rule 1 (Add Up the Scores):** Option A scores $0.7(-10) + 0.3(+100) = 23$. Option B scores $0.7(+10) + 0.3(-100) = -23$. The Utilitarian upside of saving jobs outweighs the Deontological downside of lying when weighted by confidence. **Verdict: Choose A.**
      *   **Rule 2 (Worst Case):** The worst score Option A receives is -10 (from Professional Integrity). The worst score Option B receives is -100 (from Social Welfare, which views the bankruptcy as catastrophic). Since -10 is higher than -100, you avoid the catastrophic floor. **Verdict: Choose A.**

  *   **The Single Feature Doing the Work:**
      The asymmetry of catastrophic potential. For Rule 2 to select the ruthless option (A), the "decent" option (B) must have a lower floor than the "ruthless" option. This only works because the Social Welfare theory views the economic collapse of Option B as *worse* than the Professional Integrity theory views the fraud of Option A. If the Integrity theory viewed fraud as equally catastrophic (e.g., -100), Rule 2 would flip to B.

  *   **Smallest Change to Flip Rule 2:**
      Introduce a severance package or government bailout that ensures the staff do not lose their homes if the company fails. This raises the "worst case" score of Option B from -100 to -20. Now, the worst case of A (-10) is worse than the worst case of B (-20), and Rule 2 switches to the decent option. Rule 2 depends entirely on the absolute magnitude of the scores on the common scale, not just the ranking; if the theories aren't cardinally comparable, Rule 2 is meaningless.

  *   **The Rule 3 Attack:**
      A defender of Rule 3 would argue that you are letting a theory you explicitly reject (the 30% confidence view) veto your conscience. They would say: "You believe lying is wrong. The fact that a theory you mostly disagree with says the consequences are bad doesn't make the lie right; it just means you're afraid of the consequences." The attack lands if you believe moral uncertainty shouldn't compel you to act against your highest-confidence moral conviction, especially when that conviction is about integrity rather than outcomes.

  *   **Honest Read:**
      This is doing real philosophical work, but it relies entirely on the "common scale" assumption in Rule 1 being robust enough to support Rule 2. In academic meta-ethics, intertheoretic comparison is the biggest unsolved problem; we don't actually know if a utilitarian "utility point" equals a deontological "duty point." I have quietly picked a scale where economic ruin outweighs professional shame to force Rule 2 to look ruthless. It's not cheating within your constraints, but in the real world, your protagonist could legitimately argue that the scores aren't comparable, which voids Rule 1 and Rule 2 entirely.
