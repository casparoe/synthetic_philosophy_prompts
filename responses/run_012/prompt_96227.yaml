  2.  **Deconstruct Ibn Khaldun's Thought (*Muqaddimah*):**
      *   *Asabiyyah:* Group solidarity/social cohesion. Crucial for state formation. Peaks at founding, decays over generations (luxury, sedentary life).
      *   **Cyclical Theory:** Dynasties have a natural lifespan (like humans), typically 3-4 generations (120 years).
      *   **Epistemology:** Empirical observation of history, but grounded in Islamic theology. God is the ultimate agent, but human nature (*fitrah*) and social organization (*umran*) follow discernible patterns.
      *   **Science of Society:** Possible because human social organization is rational and observable, but contingent on moral/religious factors.
      *   **Divine Governance:** History is not purely mechanical; God's will intervenes. Prophecy and religion are external variables that transcend natural cycles.

  3.  **Deconstruct Cliodynamics (Turchin et al.):**
      *   Mathematical modeling of history.
      *   *Asabiyyah* as a quantifiable variable (e.g., proxy measures).
      *   Differential equations describing dynamics (rise/fall).
      *   Claim to predictive/retrodictive power (scientific law-like status).
      *   Secular cycles (structural-demographic theory).

