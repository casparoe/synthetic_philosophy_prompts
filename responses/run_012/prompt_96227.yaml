      *   *Acceptance:* Khaldun would welcome the empirical rigor. He criticized historians for accepting anecdotes without critical scrutiny. Seeing data series fitting his cyclical intuition would validate his *umran* (civilization) analysis. He'd see the equations as a sophisticated *usul* (methodology) for his observations.
