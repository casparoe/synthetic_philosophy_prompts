          4.  Normative force: Descriptive failure of function $\rightarrow$ prohibition, or appeal to nature as independent norm?
      *   **Constraint:** Reconstruct candidate readings from the text itself, not a survey of commentators. Indicate support/deciders for each. Add a note on what a modern reader should reject.
      *   **Tone:** Analytical, philosophical, helpful for someone working through the text closely.

  2.  **Deconstruct the Textual Tension:**
      *   *Claim A:* Money is *nomos* (convention), not *physis* (nature). It can become worthless if the state changes it.
      *   *Claim B:* Usury is *para physin* (contrary to nature).
      *   *The Knot:* If $X$ is conventional, how can violating its "nature" be a natural wrong? Usually, "contrary to nature" implies violating an intrinsic essence. If money has no intrinsic essence (only conventional value), what is being violated?

  3.  **Develop Candidate Readings (addressing Question 1 & 4 primarily):**

      *   *Reading 1: The Functional/Instrumental Teleology Reading.*
          *   *Idea:* "Nature" here doesn't mean "physical origin" but "proper function." Even artificial things have a *telos* assigned by human reason. Money's *telos* is exchange. Usury subverts this *telos*.
          *   *Support:* Aristotle distinguishes natural wealth-getting (oikonomia) from unnatural (chrematistike). Money is introduced *for the sake of* exchange.
          *   *Decider:* Does Aristotle treat artifacts as having "natures"? Yes (e.g., a bed's nature is to be slept on).
          *   *Normative Force:* Violating function is irrational/vice-ridden.

      *   *Reading 2: The Broader Human Teleology Reading.*
          *   *Idea:* The "nature" violated isn't money's nature (since it has none), but *human* nature. Humans need goods for the good life. Usury represents unlimited accumulation, which contradicts the finite needs of the household/city.
          *   *Support:* Context of Book I is the distinction between the Household (finite needs) and the art of acquisition. Usury is the limit case of unlimited acquisition.
          *   *Decider:* Look at the transition from "natural wealth-getting" to "unnatural." The focus is on the *end* of human life, not just the coin.
          *   *Normative Force:* "Contrary to nature" = contrary to human flourishing (*eudaimonia*).

      *   *Reading 3: The "Sterility of Metal" Reading (Literal/Physical).*
          *   *Idea:* Money (coin) is metal. Metal cannot biologically reproduce. Claiming it does is a category error against the physical world.
          *   *Support:* The etymology (*tokos* = offspring). "Money born of money."
          *   *Decider:* Does Aristotle believe metal *can't* breed? Yes. But is this the *main* argument or an illustration?
          *   *Normative Force:* It's unnatural in a cosmic order sense (things producing unlike kinds or sterile things producing).

  4.  **Address Question 2 (The Object of Trade):**
      *   *Distinction:* Trading goods (natural) vs. Trading money for money (unnatural).
      *   *Nuance:* In retail trade, you trade money for goods. In usury, you trade money for *more money*. The medium becomes the end.
      *   *Connection:* This supports Reading 1 (function of money) and Reading 2 (end of acquisition).

  5.  **Address Question 3 (Etymology):**
      *   *Role:* Is it decorative or argumentative?
      *   *Analysis:* Aristotle often uses etymology to reveal conceptual truth (*logos*). *Tokos* links finance to biology.
      *   *Load-bearing:* It reinforces the "unnatural" claim by highlighting the absurdity of sterile metal reproducing. It suggests a confusion of categories (economic vs. biological).
      *   *Absurdity:* It's not just "odd," it's a violation of the order of generation.

  6.  **Address Question 4 (Normative Force):**
