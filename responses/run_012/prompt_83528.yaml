answer: |-
  This is a sharp textual problem. You have identified the precise friction point in *Politics* I.10: Aristotle asserts that money is *nomos* (convention/law) regarding its value, yet condemns usury as *para physin* (contrary to nature). If the substance is conventional, how can its misuse be a natural vice?

  Here are three candidate readings reconstructed from the text and its immediate context, designed to resolve this tension. Each offers a different answer to what "nature" refers to in the condemnation of usury.

  ### Reading 1: The Functional Teleology of Artifacts
  **The Core Claim:** "Contrary to nature" refers to the **proper function (*ergon*)** assigned to an artificial instrument. Even if money is conventional in substance, it is natural in origin (arising from the need for exchange). Once instituted, it acquires a "functional nature."

  *   **How it resolves the tension:** Aristotle distinguishes between a thing's *material* (which can be conventional) and its *end* (which is determined by reason). A bed is wood (natural) shaped by art (conventional), but its "nature" is to be slept on. Similarly, money is metal/convention, but its "nature" is to measure and facilitate exchange. Usury treats the instrument as the end, violating its functional definition.
  *   **Textual Support:**
      *   Aristotle states money was "brought into existence for the purpose of exchange." This assigns a *telos*.
      *   He distinguishes between wealth-getting that is "part of household management" (natural) and wealth-getting that is "unlimited" (unnatural). The distinction rests on whether acquisition serves the needs of the house (function) or accumulation for its own sake.
  *   **Deciding Factor:** Look at how Aristotle treats other artifacts elsewhere (e.g., in the *Nicomachean Ethics* or *Physics*). If he consistently argues that artifacts have a "nature" defined by their use, this reading holds. If he reserves "nature" strictly for biological growth, this reading fails.
  *   **Normative Force:** The normativity comes from **rational consistency**. To use a thing contrary to its defined purpose is irrational. Usury is a category error in practical reasoning.

  ### Reading 2: The Teleology of Human Community
  **The Core Claim:** "Contrary to nature" refers not to the nature of *money*, but to the nature of **human needs and the political community**. Money is conventional, but the *needs* it serves are natural and finite.

  *   **How it resolves the tension:** The "unnaturalness" does not attach to the coin itself (which is indeed just a token), but to the **activity of the usurer**. Human life has a natural limit (the requirements of the good life in the *polis*). Usury represents the limit-case of unlimited acquisition (*chrematistike*). The condemnation is that usury severs acquisition from human need entirely.
  *   **Textual Support:**
      *   The chapter opens by distinguishing the "art of wealth-getting" belonging to the household (finite) from the art of retail trade (potentially infinite).
      *   Aristotle argues that true wealth is not a multitude of coins but the goods necessary for life.
      *   The claim that money is "nothing by nature" supports this: because money has no intrinsic value, hoarding it (or breeding it) is chasing a phantom, disconnected from the real goods nature requires.
  *   **Deciding Factor:** Does the text focus more on the *properties of the coin* or the *intent of the actor*? If the focus is on the actor's departure from the finite needs of the household, Reading 2 is primary.
  *   **Normative Force:** The normativity comes from **human flourishing (*eudaimonia*)**. An activity is "unnatural" if it undermines the conditions required for a self-sufficient life. Usury encourages an infinite desire that destroys the self-sufficiency of the household.

  ### Reading 3: The Metaphysical Category Error
  **The Core Claim:** "Contrary to nature" refers to a **violation of cosmic order**, specifically the confusion of the biological with the sterile. The etymology is load-bearing here.

  *   **How it resolves the tension:** Even if money is conventional, it is made of metal (natural substance). Metal is sterile. To claim money produces money is to attribute a biological power (*gonimos*) to a sterile object. This is "unnatural" in the sense of being metaphysically absurd, regardless of the convention of value.
  *   **Textual Support:**
      *   The explicit etymological argument: "interest is money born of money" (*tokos* means offspring).
      *   The phrase "offspring resembles parent." In nature, offspring resemble parents biologically. In usury, the "offspring" is identical to the parent, which is a perversion of biological generation (where offspring are distinct individuals).
      *   Aristotle calls it "most reasonably hated," suggesting an intuitive revulsion akin to incest or monstrosity, not just economic inefficiency.
  *   **Deciding Factor:** How much weight does Aristotle place on the word *tokos*? If he treats it as a mere illustration, this reading is weak. If he treats it as revealing the *essence* of the transaction, this reading is strong.
  *   **Normative Force:** The normativity comes from **piety or cosmic order**. It is impious to treat sterile matter as if it were living. It is a kind of sorcery (making the dead live).

  ---

  ### Addressing Your Specific Difficulties

  **1. On "Contrary to Nature" vs. "Convention"**
  *   **Reading 1** solves this by saying artifacts have functional natures.
  *   **Reading 2** solves this by saying the *context* of money (human need) is natural, even if the *token* is not.
  *   **Reading 3** bypasses the convention issue by focusing on the physical sterility of the metal.
  *   *Decision:* Reading 2 is the most robust contextually. Aristotle's main project in Book I is defining the *polis* and the *household*. The "nature" being violated is primarily the natural limit of the household's needs, for which money is merely the tool.

  **2. On Trading the Instrument vs. Goods**
  *   This is distinct from, but supportive of, the "gain from money itself" claim.
  *   **The Distinction:** In retail trade, I trade Money $\rightarrow$ Goods $\rightarrow$ More Money. The intermediate step involves real needs (goods). In usury, I trade Money $\rightarrow$ More Money.
  *   **The Connection:** The complaint that gain comes "from money itself" explains *why* trading the instrument is problematic. It bypasses the realm of need (goods) entirely. It confirms Reading 2: the transaction has no anchor in human necessity.

  **3. On the Etymology (*Tokos*)**
  *   **Is it load-bearing?** Yes, but rhetorically rather than logically. Aristotle uses it to crystallize the absurdity.
  *   **Absurd, Impious, or Unnatural?** It is primarily **unnatural** in the sense of category confusion. It treats a measure (money) as a generator (parent).
  *   **The "Offspring Resembles Parent" point:** This is crucial. In biology, offspring are *like* the parent but distinct. In usury, the "offspring" is the *same substance* as the parent, merely increased in quantity. It suggests a closed loop of self-identity that contradicts the generative diversity of nature.

  **4. On Normative Force**
  *   **Descriptive $\rightarrow$ Prohibitive?** For Aristotle, these are rarely separate. To describe a thing's *telos* is to describe its good.
  *   **Independent Normative Work:** The appeal to nature *is* the normative work. If usury is *para physin*, it is vicious by definition. It is not that "it fails function, therefore we prohibit it." It is "it fails function, therefore it is bad." The "ought" is embedded in the "is" of the teleological framework.

  ---

  ### A Note for the Modern Reader: What to Reject

  If you are forming your own view, here is an honest assessment of where Aristotle's argument likely fails for a modern audience, and where it might retain purchase.

  **1. Reject the "Sterility of Metal" Argument (Reading 3)**
  *   **Why:** This relies on a pre-scientific understanding of capital. Money is not metal; it is credit/claim on future labor. Capital *does* "breed" in the sense that investment in tools/labor yields surplus value. Aristotle lacks a theory of productivity. He sees money as static stock, not dynamic flow.
  *   **Verdict:** The biological metaphor is poetic but economically false.

  **2. Reject the Fixed Conception of "Need" (Reading 2)**
  *   **Why:** Aristotle assumes the "needs of the household" are finite and knowable. Modern economics rests on the idea that wants are infinite and innovation expands what counts as a "need."
  *   **Verdict:** While his warning against unlimited accumulation for its own sake remains psychologically astute, the economic limit he posits is historically contingent on a static agrarian society.

  **3. Retain the Instrumental Critique (Reading 1)**
  *   **Why:** The idea that finance should serve the "real economy" (exchange of goods/services) rather than becoming a self-referential game is a durable insight. When financial instruments become so detached from underlying assets that they trade only on their own volatility (money breeding money), Aristotle's warning about the "unnatural" separation of acquisition from need resonates strongly (e.g., the 2008 financial crisis).
  *   **Verdict:** The normative claim that economic tools should serve human ends, rather than humans serving economic accumulation, is the strongest surviving element of the argument.

  **Summary Recommendation:**
  To reconstruct the argument most charitably, adopt **Reading 2** (Human Teleology). It makes the best sense of the "convention vs. nature" tension: Money is conventional, but the *human life* it serves is natural. Usury is unnatural not because coins can't breed, but because it divorces acquisition from the natural limits of human flourishing. The etymology is Aristotle's way of dramatizing this detachment as a monstrous perversion of generation.
