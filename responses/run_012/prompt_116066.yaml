answer: |-
  **Straightline Academy Network | Parent Resources**
  **www.straightlineacademy.org/faq**

  **FREQUENTLY ASKED QUESTIONS REGARDING STUDENT FORMATION**

  **1. Why is the disciplinary code so rigorous compared to public schools?**
  Public schools often operate on the assumption that a child's natural impulses are reliable guides for behavior. We operate on the observation that a child's natural impulses are self-serving and chaotic. Left untended, a human being grows toward convenience, not virtue. Our rigor is not punishment; it is correction. We do not believe a child knows best. We believe a child is raw material that must be straightened before it can bear weight.

  **2. What is the purpose of the Monday Morning Calibration?**
  Every Monday at 8:00 AM, students and staff perform the Standing Bow in the cafeteria. This is not a religious act. It is a physical reset. We have found that three weeks of consistent repetition is required to overwrite a natural habit. This is a law of human development, not merely school policy. If a student misses the bow, the cycle resets. We do not negotiate with the cycle. The bow reminds the student that their posture is not their own; it belongs to the community that shapes them.

  **3. Critics say this approach treats children like objects to be manufactured.**
  We prefer the term "constructed." Nothing of value occurs without human effort. A forest is wild; a garden is made. When we teach a student to suppress their immediate anger and instead recite the Conflict Resolution Script, we are not asking them to be fake. We are asking them to build a new nature through artifice. "Artifice" simply means made by hand. A bridge is artificial. That does not mean it is not real. We are building bridges in your children.

  **4. How do you justify requiring parents to sign the Daily Conduct Log?**
  The environment is the mold. If the school straightens the wood but the home warps it, the wood breaks. The Log ensures continuity. You are not just observing behavior; you are certifying that the work done here is not undone there. If you cannot commit to the Log, your child may not be ready for the pressure required to hold their shape.

  **5. Founder Mr. Garrison often mentions a "warped board" in assemblies. What does this refer to?**
  Mr. Garrison keeps a piece of lumber in his office that was originally twisted and unusable. He subjected it to heat and pressure until it was straight. It now holds up the wall behind his desk. He points to it to remind us that usefulness requires distortion of the original form. He was not born a leader; he was pressed into one. He expects the same for your child. The board does not miss being warped. The board is proud to be load-bearing.

  ***

  **LEAKED INTERNAL COMMUNICATION**
  **From:** Sarah Jenkins, Director of Student Well-Being
  **To:** All Faculty
  **Date:** October 14
  **Subject:** Quiet Please

  Team,

  I know the Monday Calibration is mandatory, but please watch the kids during the bow. I see some of them flinching. Not from pain, but from a kind of shrinking.

  Mr. Garrison believes we are building them from scratch. I believe we are uncovering what is already there. When you force a sprout open to check its growth, you kill the sprout. I know we have protocols. I know we have the Log. But please, if a child is crying, do not ask them to recite the Script first. Ask them what hurts. They already know the difference between right and wrong deep down; our job is to protect that knowledge from being crushed by the weight of the building.

  We are trying to make them straight, but if we press too hard, the grain splits. I don't think Mr. Garrison understands that he was never actually warped. He just thinks he was. I feel sorry for him. He spends so much time holding up the wall he doesn't notice he's the only one standing in the rain.

  Be gentle tomorrow.

  Sarah
