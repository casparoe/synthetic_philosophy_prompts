answer: |-
  **Joint Statement of Adversarial Collaboration on Concept Induction**

  **Part I: Agreed Claims**

  Both camps submit to the following premises regarding the testbed and evaluation standards:

  1.  **Definition:** A Bongard-style problem consists of two sets of items partitioned by a hidden distinction. The task is to identify the distinction and classify novel probe items correctly.
  2.  **Solving:** A solver is deemed to have solved a problem only if it correctly classifies holdout probe items generated from the same underlying distinction.
  3.  **Scoring:** Performance is scored strictly on probe classification accuracy. Explanatory text or stated rules are recorded but do not contribute to the accuracy score.
  4.  **Mechanism Limits:** Behavioral success on this battery cannot definitively prove the internal mechanism (rule-search vs. metric-alignment), though failure patterns may constrain viable models.
  5.  **Fair Test:** The use of text descriptions and relational encodings rather than raw pixels ensures that performance turns on structural induction, not visual perception biases.
  6.  **Agreed Families:** Both camps agree that Families 1 (Negative-existential), 3 (Deceptive-similarity), 4 (Re-encoding pairs), and 6 (Set-level) constitute fair tests of induction capacity. Family 2 (Second-order) is accepted as valid but acknowledged as exceptionally difficult. Families 5 (One-shot) and 7 (Ambiguity) are excluded from primary accuracy scoring due to high noise and undefined ground truth, respectively.
  7.  **Protocol:** All solvers must be trained on the same distribution of examples and tested on identical probe items under identical computational constraints.

  **Part II: Remaining Disagreements**

  The following table summarizes the theoretical divergences that remain unresolved prior to testing.

  | Question in Dispute | Rule-First Position | Similarity-First Position | Crux of Disagreement |
  | :--- | :--- | :--- | :--- |
  | **Format of a Concept** | A concept is a discrete, recombinable predicate over features and relations. | A concept is a graded similarity structure defined by a metric over representations. | Whether the representation is symbolic/logical or continuous/vector-based. |
  | **Mechanism Requirement** | A solver must recover and apply the rule to generalize; stated rules must match the mechanism. | A solver aligns a metric to the partition; stated rules are post-hoc rationalizations, not the mechanism. | Whether the explicit rule is the engine of generalization or a byproduct. |
  | **Re-encoding Meaning** | Success on Family 4 shows the extraction of a modality-independent abstract rule. | Success on Family 4 shows the transfer of a high-level similarity metric across domains. | Whether abstraction implies symbolic amodality or metric invariance. |
  | **Ambiguity Resolution** | In Family 7, the correct answer is the simplest rule fitting the data (Occam's razor). | In Family 7, the correct answer is the clustering that maximizes similarity cohesion. | Whether simplicity or cluster tightness dictates truth in underdetermined cases. |
  | **Nature of Solving** | Solving is binary: one either possesses the rule or does not. | Solving is graded: one possesses a degree of alignment with the partition. | Whether competence is a threshold event or a continuous variable. |

  **Part III: The Cruxes**

  To move beyond theoretical stalemate, we identify specific empirical outcomes that would compel concessions.

  **Crux 1: Modality Independence (Re-encoding Pairs)**
  *   **Sub-question:** Is abstraction modality-agnostic?
  *   **Agreed Probe:** Measure the correlation of error rates between the geometric and relational instances of Family 4 problems for a single solver.
  *   **Rule-First Prediction:** High positive correlation. If the rule is extracted, it applies regardless of notation; difficulty should track rule complexity, not format.
  *   **Similarity-First Prediction:** Low correlation. Similarity metrics are tuned to specific feature spaces; geometric relations and relational tables require distinct metric alignments.
  *   **Concessions:** If correlation is low, Rule-First concedes that rules are not easily decoupled from representation. If correlation is high, Similarity-First concedes that metrics operate over abstract structures independent of surface features.

  **Crux 2: Processing Absence (Negative-Existential)**
  *   **Sub-question:** Is absence computationally equivalent to presence?
  *   **Agreed Probe:** Compare trials-to-criterion for Family 1 (absence of relation) versus matched positive-property problems.
  *   **Rule-First Prediction:** No significant difference. Logical negation is a primitive operation; searching for "no relation" is symmetric to searching for "relation."
  *   **Similarity-First Prediction:** Significantly slower for Family 1. Similarity metrics require positive features to anchor alignment; absence provides no signal to lock onto.
  *   **Concessions:** If Family 1 is slower, Rule-First concedes that logical symmetry does not match processing reality. If speeds are equal, Similarity-First concedes that similarity mechanisms can efficiently encode null signals.

  **Crux 3: Ambiguity Preference**
  *   **Sub-question:** What resolves underdetermination?
  *   **Agreed Probe:** In Family 7, present cases where the simplest rule conflicts with the tightest similarity cluster.
  *   **Rule-First Prediction:** Solvers will prefer the simpler rule, even if cluster cohesion is lower.
  *   **Similarity-First Prediction:** Solvers will prefer the tighter cluster, even if the rule description is longer.
  *   **Concessions:** If cluster cohesion wins, Rule-First concedes that simplicity is not the primary driver. If simplicity wins, Similarity-First concedes that symbolic compression overrides metric fit.

  **Part IV: Verbal vs. Genuine Disputes**

  We distinguish between disputes that are terminological and those that are empirical.

  The disagreement over the **Format of a Concept** is largely verbal. Both camps agree that a system must map inputs to partitions correctly. Whether the internal state is called a "predicate" or a "metric" often depends on the level of analysis. If a similarity metric becomes sharp enough, it functions like a rule; if a rule is probabilistic, it functions like a metric. This definition does not dictate empirical outcomes.

  However, the disputes regarding **Mechanism Requirement**, **Modality Independence**, and **Processing Absence** are genuine. These concern the causal structure of the solver. The predictions in Part III are falsifiable and mutually exclusive. A system cannot simultaneously exhibit high modality correlation (implying abstract rules) and low modality correlation (implying surface metrics) on the same task. Similarly, processing latency for negative-existential problems is a measurable physical constraint that cannot be reconciled by redefining terms.

  The dispute over **Ambiguity Resolution** is mixed. While "correctness" in ambiguous cases is partly definitional, the actual behavior of solvers (whether they minimize description length or maximize cluster density) is an empirical matter that reveals the inductive bias of the system.

  We agree that the battery specified in Part I, scored according to the protocols herein, will provide the data necessary to resolve the genuine disputes, even if the verbal disputes regarding the label "concept" persist.
