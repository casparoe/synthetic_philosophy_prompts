prompt: |-
  So this happened at my friend Nadia's place last weekend and I've been chewing on it since. Her two housemates, Tomas and Priya, got into a long argument and I was basically just sitting there with a beer, and I honestly couldnt tell who was winning, which is why I'm asking. It started with Tomas describing Joshua Knobe's old chairman case — the setup where a CEO says he doesn't care about the environment and is only in it for the profit, and the new process will also harm the environment, and most people say he harmed it on purpose; and then in the mirror version the same process also helps the environment and the guy says he doesn't care about that either, and most people say he didn't help it on purpose. Tomas thinks the moral of that is the folk aren't confused at all: the asymmetry tracks whether a norm got violated, and it's actually defensible to treat a knowing norm violation as intentional, so 'intentionally' in ordinary speech just carries a bit of blameworthiness that the philosophers' tidy definitions leave out. Priya thinks that's backwards — she says what's really happening is that people hear 'he knowingly did something bad' and their blame machinery hijacks the word 'intentionally,' so the whole effect is a story about motivated reasoning rather than about what intentional action is. Then she sprung a case of her own: a guy at a chess club who wants to catch his bus, says out loud that he doesn't care about the club's rule about stacking the chairs at closing, and heads out knowing he's leaving the chairs unstacked and breaking that rule — she said if Tomas is right that norm violation is doing the work, people should say he broke the rule on purpose, and she'd bet money nobody would.

  Tomas said the chair guy doesn't put anyone at risk, so of course the machinery doesn't fire, and that norms only get their grip when somebody can actually get hurt. Priya said that's just bolting a new clause onto the theory after she'd tested it, and Tomas said she stacked the deck by picking a case with nothing at stake in the first place, and they went around like that for a while, at one point getting into whether 'intentional' is even meant to be a descriptive word at all or whether it's always partly an evaluative one. I don't need a winner so much as a fair reading of what each of them actually established.

  Could you go through their exchange and adjudicate it move by move — who's right about which specific claim, which of their claims are real empirical predictions about what people would say versus conceptual claims that can't be settled from the armchair, and what both of them are missing? Give it to me as exactly five numbered points, a sentence or two each, no intro and no summing-up at the end.
