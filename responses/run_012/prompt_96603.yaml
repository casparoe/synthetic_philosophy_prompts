answer: |-
  **Brainstorming and Strategy**

  There are two conventional ways to frame a life like Vera's, and both fail. First, we could frame her work as **heroic exceptionality**. This comforts the family by suggesting Vera was a saint whom no one could expect to emulate, but it insults the comrades by reducing necessary political work to mere charity. Second, we could frame her work as **basic moral duty**. This honors the comrades' belief in solidarity, but it burdens the family with the implication that they (and we) have been negligent in our own obligations.

  My intention is to bypass this binary by anchoring the speech in Vera's own distinction: "Nobody is owed this. It is simply mine to do." I will treat this not as a modest deflection, but as a rigorous ethical claim. I will argue that Vera did not view her work as a debt she paid to the world (which would make us debtors), nor as a gift she bestowed (which would make us beggars). Instead, she viewed it as a *vocation*—something she recognized as belonging to her specific capacity and position. This allows me to tell the comrades that the work remains urgent without telling the family they are failures for not having done Vera's specific work. The challenge for the mourners becomes not "How do we replicate Vera?" but "What is ours to do?"

  ***

  **Eulogy for Vera Lindqvist**

  Good morning. For those who don't know me, I am Vera's nephew. Looking out at this room, I see the two worlds my aunt inhabited. On one side, I see her family: her brothers, her cousins, those of us who share her blood and her history. On the other, I see her comrades: neighbors, organizers, the people who shared the work of the tenants' network for the last twenty-five years.

  I say this because I know, and Vera would have wanted us to know, that these two groups have sometimes looked at her life and seen different things. To the comrades, Vera's life looks like a standard. It says: *This is what solidarity requires. This is what we owe each other.* To the family, her life can look like a rebuke. It asks: *If she could do this, why didn't we? If this was possible, why does the rest of our living feel so small?*

  It is a painful thing to love someone whose goodness makes you question your own. And it is a difficult thing to mourn someone when half the room wants to canonize her and the other half just wants to miss her without guilt.

  But Vera left us a way through this. She left us a sentence. When people thanked her for the rent she covered, or the nights she spent mediating disputes, or the families she housed, she would not accept the gratitude. She would say, "Nobody is owed this. It is simply mine to do."

  We often try to sort good actions into two boxes: the things we *must* do, and the things we *choose* to do. We argue over which box Vera belongs in. If we say she *had* to do it, we turn her life into a debt that hangs over all of us. If we say she *chose* to do it, we turn her life into a generous exception that lets the rest of us off the hook.

  Vera refused both boxes. When she said, "Nobody is owed this," she was rejecting the idea that morality is a transaction. She was telling the comrades: Do not do this work because the universe is keeping a ledger. Do not do it because you are paying a tax on your privilege. And she was telling the family: Do not look at me as a creditor to whom you owe a debt you cannot pay.

  But then she added, "It is simply mine to do."

  This is the harder part. She was not saying the work was optional. She was saying it was *hers*. She recognized a need that intersected with her capacity, her pension, her time, and her specific location in the world, and she claimed it. She didn't do it because she was forced. She didn't do it because she was nice. She did it because she saw that if she did not do it, it would not get done, and she could not live with herself if she walked past it.

  To the comrades here: Vera believed the work was necessary. She believed housing was a right. But she did not believe that her specific sacrifice was the price of admission for everyone else. She would not want you to burn yourselves out trying to be her. She would want you to find what is *yours* to do, with the same clarity she had.

  To the family: You do not honor Vera by trying to replicate her life. You cannot. That life was hers, not yours. You honor her by refusing to treat her goodness as a accusation. If you walk away from here feeling guilty, you have misunderstood her. Guilt is passive. Vera was active. She did not carry the weight of the world; she picked up the part of it that fit her hands.

  So, how do we hold this tension? We hold it by understanding that "mine to do" is not a limitation, it is an assignment. It suggests that there is work in this world that is waiting for specific people to claim it. Vera claimed hers. She saw a gap in the safety net and she became the weave.

  We cannot give that back to her. But we can take the lesson. The lesson is not that we must all run tenant networks. The lesson is that we must all look at our own lives, our own pensions, our own neighborhoods, and ask: What is mine to do? Not what am I forced to do. Not what would make me look good. But what piece of the broken world has my name on it?

  If we can find that, and if we can claim it with half the grace and tirelessness that Vera did, then we will not be dividing this room into the guilty and the righteous. We will just be people, doing what is ours to do.

  Vera, thank you for showing us what that looks like. We will miss you. And we will get to work.
