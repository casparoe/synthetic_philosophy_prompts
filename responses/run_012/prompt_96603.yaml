          *   *Family:* Want to hear her life was extraordinary/supererogatory (so they don't feel guilty/inadequate).
      *   **Philosophical Core:** The problem of supererogation (acts beyond duty). If it's good, is it required? If not required, how to honor without shaming?
      *   **Vera's Own Words:** "Nobody is owed this. It is simply mine to do." (Refused "sacrifice," refused "optional").
      *   **Task:**
          1.  Brainstorm framing options and rhetorical costs.
          2.  State the intended approach to the tension.
          3.  Write the eulogy (approx. 5 minutes spoken, ~750-900 words).
      *   **Tone:** Philosophical but accessible, honest, loving, not pandering, structurally built around Vera's distinction.

  2.  **Brainstorming & Strategy:**
      *   *Option A: The Saint/Martyr Frame.* Focus on her extraordinary goodness.
          *   *Cost:* Alienates the comrades (makes her work seem like charity, not justice). Burdens the family with guilt ("Why weren't we like her?").
      *   *Option B: The Duty/Solidarity Frame.* Focus on her doing what we all must do.
          *   *Cost:* Alienates the family (makes them feel accused). Flattens her specific genius (makes her replaceable).
      *   *Option C: The "Mine to Do" Frame (Vera's Way).* Treat her action as a vocation or a specific ownership of moral space. It's not that everyone *must* do exactly this, but that she *claimed* this as her own.
      *   *Resolution:* I need to validate the comrades' sense of justice *without* making it a universal mandate that shames the family. I need to validate the family's love *without* isolating Vera as an unattainable exception. The bridge is *ownership*. She didn't do it because the world demanded it (debt); she didn't do it because it was nice (option). She did it because she recognized it as *hers*. This shifts the focus from "obligation vs. gift" to "recognition vs. ignoring."
      *   *Structure:*
          1.  Acknowledge the division in the room (honestly but gently).
          2.  Introduce Vera's phrase ("Nobody is owed this...").
          3.  Explore what that means: It's not debt, it's not charity, it's *identity*.
          4.  Address the comrades: Her work stands as a demand, but not a guilt-trip.
          5.  Address the family: You don't need to replicate her life to honor it; you need to find what is "yours to do."
          6.  Conclusion: A send-off that unites them in memory, not judgment.

  3.  **Drafting - Section by Section:**

      *   *Brainstorming Intro:* Need to be concise.
          *   Frame 1: Heroic Exception (Comforts family, insults comrades' politics).
          *   Frame 2: Moral Obligation (Honors comrades, shames family).
          *   Strategy: Use Vera's "Mine to Do" to reframe duty as vocation.

      *   *Eulogy Opening:* Welcome everyone. Acknowledge the two groups. Don't hide the tension.
      *   *The Core Philosophy:* Tackle the "owed" vs. "mine." If we say it was owed, it becomes a transaction. If we say it was optional, it becomes a hobby. Vera rejected both.
      *   *Addressing the Comrades:* They see the need. They know the work. Acknowledge the demand her life places on the world. But clarify: the demand isn't to *be Vera*, it's to find your own stake.
      *   *Addressing the Family:* They feel the weight. Release them from the burden of imitation. Honor isn't replication.
      *   *The Synthesis:* The "Mine to Do" is about attention. She saw what was hers. We honor her by seeing what is ours.
      *   *Closing:* Return to the phrase. A final image of her.

  4.  **Refining the Voice:**
      *   Must sound spoken. Rhythm matters. Pauses.
      *   Avoid academic jargon (no "supererogation," "deontological," etc.).
      *   Keep it warm but intellectually rigorous.
      *   Ensure Vera's quote is the pivot point.

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I make the family feel too guilty? *Adjustment:* Emphasize that finding *their* "mine to do" is enough.
      *   *Check:* Did I undermine the political work? *Adjustment:* Affirm the necessity of the work, just not the necessity of *Vera* being the one to do it (though she chose to).
