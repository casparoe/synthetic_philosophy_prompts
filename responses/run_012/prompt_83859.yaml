answer: |-
  ### I. The Correspondence Table

  To audit the therapeutic analogy, we must first formalize the mapping usually left implicit in policy discussions.

  | Clinical Element | Truth Commission Analogue | Notes on the Mapping |
  | :--- | :--- | :--- |
  | **The Patient** | The Society / The Nation | Treated as a singular entity with a psyche. |
  | **The Therapist** | The Commission (Commissioners & Staff) | Charged with diagnosing and facilitating recovery. |
  | **The Wound** | The Atrocity / Human Rights Violations | The traumatic event causing dysfunction. |
  | **The Symptom** | Social Fragmentation, Silence, Denial, Trauma | Observable signs of the wound's infection. |
  | **The Session** | Public Hearings / Testimony | The space where the narrative is articulated. |
  | **The Resistance** | Perpetrator Denial, Political Obstruction, Victim Silence | Forces preventing the "work" of truth. |
  | **The Cure** | Reconciliation / National Healing / Democracy | The return to functional homeostasis. |
  | **Confidentiality** | Public Record (mostly) | *Critical Break:* Therapy is private; TCs are spectacles. |
  | **Consent** | Political Mandate (Treaty/Decree) | *Critical Break:* Imposed on the populace, not volunteered. |
  | **The Fee** | Budget (Donors/State) & Political Capital | Who pays: International community, taxpayers, and victims (via opportunity cost of justice). |

  ### II. The Breaks in the Mapping

  An analogy is useful only insofar as it illuminates structural similarities. When it obscures structural differences that bear on the argument at hand, it becomes ideological. Below, I rank the five candidate breaks provided in your prompt, ordered by how severely they undermine the specific conclusion that *healing is the priority and prosecutions are a failure of care.*

  **1. The Nature of the Injury (Psychic vs. Political/Institutional)**
  *Rank: Critical*
  This is the most damaging break. Therapy treats internal, psychological pathology. Atrocities are often external, structural, and political acts involving land, resources, and legal status. If the wound is a stolen farm or a dismantled judiciary, "healing" is a category error. The injury requires restitution or reconstruction, not catharsis. By locating the injury in the psyche, the analogy recasts a dispute about power as a dispute about feelings. This directly licenses the conclusion that prosecutions (political/legal acts) are secondary to healing (psychological acts), when in fact prosecutions may be the only appropriate response to the actual injury.

  **2. The Status of Truth (Instrumental vs. Owed)**
  *Rank: High*
  In therapy, truth-telling is instrumental to the patient's well-being. If a memory is too traumatic to recall without causing regression, a therapist might pace its retrieval. In transitional justice, truth is often deontological: it is owed to the victim and the historical record regardless of its psychological impact. If truth is a right, trading it off for "stability" or "healing" is a violation of justice. This break undermines the idea that the Commission can manage truth for the sake of the "cure."

  **3. The Alignment of Interests (Unitary vs. Adjudicatory)**
  *Rank: Significant*
  A therapist serves the interest of the patient. A Truth Commission serves a triad of conflicting interests: victims (who want justice), perpetrators (who want amnesty), and the state (which wants legitimacy). Often, the state funds the commission. A therapist funded by the abuser cannot ethically treat the victim. This conflict suggests the Commission is not a neutral healer but a political negotiator. If the "therapist" is compromised, the prescription (e.g., "forgive and forget") cannot be trusted as medical advice; it must be read as political strategy.

  **4. Privacy vs. Publicity**
  *Rank: Moderate*
  Therapy relies on a protected space to lower defenses. Truth Commissions rely on publicity to create a shared narrative. While this breaks the clinical analogy, it does not necessarily undermine the conclusion that "testimony is medicine." One could argue public testimony is a *different kind* of medicine (social rather than individual). However, the lack of confidentiality can re-traumatize witnesses, suggesting the "treatment" has side effects a real therapist would avoid. This weakens the "care" argument but does not dismantle it entirely.

  **5. Consent (Individual vs. Collectivity)**
  *Rank: Low (Relative to the others)*
  While a collectivity cannot consent in the clinical sense, political mandates function as a form of proxy consent in democratic theory. While significant philosophically, this break matters less for the specific conclusion about prosecutions. Even if the "patient" didn't consent, the doctor might still be right that surgery (prosecutions) is dangerous. However, combined with the other breaks, it highlights the paternalism of the analogy.

  ### III. The Collective and Its Members

  The therapeutic analogy quietly assumes a **holistic organicism**: individuals figure as organs of the larger patient (the Nation). In this view, the suffering of a specific victim is significant insofar as it contributes to the systemic dysfunction of the whole.

  This creates a moral hazard. If the goal is the health of the "social body," individual victims can be instrumentalized. Their testimony becomes a resource for national healing rather than an end in itself. If a victim's demand for prosecution threatens the "recovery" of the nation (e.g., by provoking a coup), the therapeutic logic dictates suppressing that demand for the greater health of the patient. The individual is subordinated to the metaphor.

  ### IV. Can the Analogy be Repaired?

  **Family Therapy:**
  Shifting from individual to family therapy improves the mapping. It acknowledges multiple "patients" with conflicting histories living in the same house. It allows for the possibility that some family members must be removed (imprisoned) for the safety of others. However, it still implies that the primary goal is relational harmony. In cases of genocide, harmony may be impossible or undesirable without justice. The "family" metaphor can also obscure the power differential between the state-abuser and the citizen-victim.

  **Public Health / Sanitation:**
  This is a stronger repair. A Truth Commission functions less like a therapist and more like a **sanitation engineer**.
  *   **The Wound:** Contaminated water supply (corrupt institutions, culture of impunity).
  *   **The Session:** Testing the water (fact-finding).
  *   **The Cure:** Cleaning the pipes (institutional reform), not necessarily making the residents "feel better."
  *   **Implication:** Sometimes you must dig up the roads (disrupt society) to fix the pipes. It removes the expectation of emotional resolution and focuses on structural safety. It acknowledges that some "pathogens" (perpetrators) must be removed, not talked to.

  ### V. Does the Conclusion Survive?

  **No.** The conclusion that *prosecutions are a failure of care* relies almost entirely on the therapeutic analogy.
  Once the audit reveals that the "wound" is political, the "truth" is a right, and the "therapist" is conflicted, the medical authority evaporates. The claim that prosecutions "keep the wound open" is revealed not as a medical diagnosis, but as a political preference for stability over accountability. The analogy was not illustrating the conclusion; it was manufacturing it by borrowing the unquestionable value of health to justify the questionable value of impunity.

  **A Better Analogy:**
  The **Forensic Audit**.
  A Truth Commission is an auditor brought in after a massive corporate fraud (the atrocity).
  *   They examine the books (archives/testimony).
  *   They issue a report on how the fraud happened (structural analysis).
  *   They recommend changes to prevent recurrence (institutional reform).
  *   **Crucially:** An auditor does not promise to make the shareholders "feel better." They do not suggest that suing the CFO is "bad for morale." They establish liability so that legal and structural remedies can follow. This separates the *fact-finding* (TC) from the *adjudication* (Courts), without suggesting the former replaces the latter.

  ### VI. Contextual Variations: Argentina and Rwanda

  The therapeutic analogy fares differently depending on the legal teeth of the commission.

  **Argentina (CONADEP):**
  The Argentine commission had no power to grant amnesty; it was purely fact-finding ("Nunca Más"). Here, the therapeutic analogy was less potent initially because the "cure" was understood to be the trials (Juicio a las Juntas) that followed. The analogy gained traction only later, when amnesty laws (Due Obedience, Full Stop) were passed to halt prosecutions. In this context, the therapeutic narrative was retroactively deployed to justify the *absence* of the cure (justice). The audit holds: the analogy was used to sanitize political compromise.

  **Rwanda (Gacaca Courts):**
  In Rwanda, truth-telling was bound up with community courts and reduced sentences. Here, the therapeutic analogy collapses completely because the "session" was also a "trial." The "talking cure" literally determined liberty. To call this therapy obscures the coercive power of the state. It was a hybrid of justice and reconciliation. Using the therapeutic analogy here is dangerous because it masks the punitive reality; it suggests perpetrators were "healed" by confession, when they were often bargaining for reduced prison time. The "fee" paid was not just budget, but a compromise on the depth of justice.

  In sum, the therapeutic analogy is a potent rhetorical device that tends to privilege order over justice. An audit reveals it is structurally unsound for the task. We should prefer analogies of engineering, auditing, or public health that acknowledge the structural nature of atrocity and the necessity of non-therapeutic remedies like prosecution and restitution.
