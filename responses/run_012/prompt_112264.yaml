prompt: |-
  I run a small film-and-fiction reading group and we keep having the same argument about why we like sad stuff — nobody ever changes their mind, so I want to stop arguing and just sort people. Build me a decision tree for that. Each node should be a question about a concrete case that someone can answer without already knowing which theory it leads to, and each leaf a position on why we're drawn to tragedy (name it if it has a settled name, otherwise a descriptive label, or 'unnamed' if literally nobody defends it).

  Please make sure these nodes are in there somewhere: whether the sadness is actually felt or only imagined/represented; whether the emotion is even negative in that context or whether what's really going on is something like being moved, which feels good; whether you'd take a pill that deletes the sadness but leaves the plot exactly as it is; whether a badly told version of the same events moves you as much; whether you'd be glad if it had really happened; whether knowing the ending in advance changes anything; and whether the same sad content in a news report gets anything like the same response.

  Then tell me which leaves my questions can't pull apart and what extra question would separate them, and which answer-combinations come out empty — nobody home because it's incoherent, or because it's an unattractive place to live, or just because nobody's bothered. Keep it to something I can fit on two sides of a page. Don't bother with names and dates from the literature, I can't check them anyway.
