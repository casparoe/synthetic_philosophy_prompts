prompt: |-
  In three weeks I'm giving a work-in-progress talk to a joint session of our philosophy of science reading group and the causal inference group from the biostatistics department — roughly half the room argues about the metaphysics of causation for a living, and the other half spends its days on DAGs, target-trial emulation, and identification proofs, and the two halves do not read each other. The paper defends a claim I expect to annoy both of them: that the interventionist, manipulationist account of causation is not merely a serviceable epistemology for finding out about causes but the better account of causal truth, and that the counterfactual account's fatal soft spot is causal selection — it will happily tell you that a hundred conditions were all difference-makers and then has nothing to say about why we single one of them out as the cause. My running case is one the biostatisticians will recognize from their own work: a patient's lung cancer, where a genetic predisposition predicts the outcome better than the smoking does, and yet the patient, the clinician, and the public health office all say the smoking caused it. I want to argue that this is not a pragmatic gloss laid over the real causal facts but a case the manipulationist framework gets right — I'm going to claim that manipulability is doing the work even here, because the cause is the variable whose value could have been changed by an intervention on the system, which is why the genotype quietly drops out. I've been arguing about this over coffee with a friend in the epi group, and she made the obvious objection that I am just relabeling the pragmatics; it has been nagging at me since.

  What I need is a Q&A prep sheet, not a defense of the paper. Give me the eight or so objections this specific room will actually raise — not the ones I'd collect at a metaphysics conference — ordered by how likely they are and how much damage they would do, each phrased the way that half of the room would phrase it, and where the two halves would put the same worry differently, give me both versions. For each, a two-minute spoken reply and an honest note on where the reply is thin. Tell me which objections to concede immediately, which to refuse outright, and which two or three I cannot afford to lose — the ones where, if the room doesn't buy my answer, the paper is dead. Say which ones I should preempt in the talk itself rather than leave for the question period, and tell me the question I am hoping nobody asks.

  I don't need a reading list; I know the literature well enough. What I don't know is this room, and the room is what will decide whether the paper survives contact with people who spend their afternoons estimating effects.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the User and Context:**
      *   **Speaker:** Philosopher of science (likely), working on causation.
      *   **Audience:** Joint session. 50% Philosophy of Science (metaphysics of causation focus), 50% Biostatistics/Causal Inference (DAGs, target trials, identification focus).
      *   **Topic:** Defense of Interventionism/Manipulationism over Counterfactualism, specifically regarding *causal selection* (why we pick smoking over genetics in lung cancer).
      *   **Core Claim:** Manipulability isn't just pragmatic; it's constitutive of causal truth. Genetics isn't the cause because it's not manipulable *in the relevant context*.
      *   **Specific Worry:** A friend (epi) accused the speaker of just relabeling pragmatics as metaphysics.
      *   **Goal:** A Q&A prep sheet. 8 objections, ordered by likelihood/damage. Phrased in the voice of the two halves (Phil vs. Stats). 2-minute replies + "thin spot" admission. Strategy on conceding/refusing. Pre-emption advice. The "deadly" question.

  2.  **Deconstruct the Core Argument & Vulnerabilities:**
      *   *Argument:* Interventionism solves causal selection better than Counterfactualism. Smoking is the cause because it's manipulable; genetics isn't.
      *   *Vulnerability 1 (The Friend's Objection):* Is this just pragmatics in disguise? If manipulability is relative to *our* abilities, isn't that epistemic/pragmatic, not ontological?
      *   *Vulnerability 2 (The Stats Side):* DAGs handle this via "exposure" vs. "covariate." Do we need metaphysics for this? Also, what about "non-manipulable" causes that stats people still model (e.g., sex, race, genetics in some contexts)?
      *   *Vulnerability 3 (The Phil Side):* Woodward-style interventionism usually allows for "in principle" interventions. If genetics is manipulable *in principle* (gene editing), does the argument collapse?
      *   *Vulnerability 4 (The Selection Problem):* Even within manipulable variables, there are many. Why smoking and not "buying cigarettes" or "lighting the match"?
      *   *Vulnerability 5 (Identification):* Biostats care about *identifiability*. If we can't intervene, can we still identify the effect? (e.g., Mendelian Randomization).
      *   *Vulnerability 6 (Normativity):* Causal selection is often normative (blame, responsibility). Does interventionism capture this?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (The Big One):* The "Relabeling Pragmatics" charge. This came from the friend. It's the most dangerous because it undermines the metaphysical claim.
          *   *Phil phrasing:* "You're conflating epistemology with ontology."
          *   *Stats phrasing:* "You're defining 'cause' by what we can do, not what is true."
      *   *Objection 2 (The "In Principle" Intervention):* Gene editing exists (CRISPR). So genetics *is* manipulable.
          *   *Phil:* "In principle interventions count."
          *   *Stats:* "We can model genetic interventions in a DAG."
      *   *Objection 3 (The Stats Utility):* Why do we need metaphysics? DAGs work fine without this debate.
          *   *Stats:* "Does this change my estimator?"
          *   *Phil:* "Is this just verbal window dressing?"
      *   *Objection 4 (Mendelian Randomization):* We use genetics as an *instrument* to find causes. Doesn't that make it a cause?
          *   *Stats:* "We use genotype as an IV."
          *   *Phil:* "Instrumental variables imply causal structure."
      *   *Objection 5 (Causal Selection within Manipulables):* Smoking is manipulable, but so is "selling cigarettes." Why is *smoking* the cause?
          *   *Phil:* "Problem of variable granularity."
          *   *Stats:* "Which node in the DAG is the treatment?"
      *   *Objection 6 (Non-Manipulable Causes in Practice):* Sex, Race, Age. Biostats adjust for these. Are they not causes?
          *   *Stats:* "We adjust for confounders like sex."
          *   *Phil:* "Fixed properties can be causes."
      *   *Objection 7 (The Counterfactual Defense):* Counterfactuals can handle selection via "normality" or "default" conditions (Hart & Honoré, Halpern & Pearl).
          *   *Phil:* "Structural Equation Models handle selection."
      *   *Objection 8 (Normativity/Blame):* We call smoking the cause because we want to blame the industry/patient.
          *   *Phil:* "Causal selection is normative."
          *   *Stats:* "Public health priority drives labeling."

  4.  **Refining and Ordering:**
      *   *Priority:* The "Relabeling Pragmatics" objection is #1. It kills the metaphysical claim.
      *   *Priority:* The "CRISPR/In Principle" objection is #2. It kills the specific lung cancer example.
      *   *Priority:* The "Non-Manipulable Confounders" (Sex/Race) is #3. It limits the scope of the theory too much for biostats.
      *   *Priority:* The "DAGs already do this" is #4. It makes the paper irrelevant to half the room.
      *   *Priority:* The "Mendelian Randomization" is #5. Specific to biostats, high technical damage.
      *   *Priority:* The "Counterfactual Normality" is #6. The main philosophical rival.
      *   *Priority:* The "Variable Granularity" is #7. Internal problem for interventionism.
      *   *Priority:* The "Normativity" is #8. Important but maybe secondary to truth claims.

      *Let's consolidate to 8 strong ones, ensuring the Phil/Stats split is clear.*

  5.  **Drafting Replies & "Thin Spots":**
      *   Need to be honest. The "Relabeling" objection is genuinely hard. The reply needs to lean on *stability* or *invariance* rather than just "can we touch it."
      *   The CRISPR objection needs to distinguish *practical* policy interventions from *theoretical* ones.
      *   The Sex/Race objection needs to distinguish *causes* from *risk markers* or accept a pluralist view.

  6.  **Strategy (Concede/Refuse/Pre-empt):**
      *   *Concede:* That DAGs work without metaphysics (but argue metaphysics explains *why* they work).
      *   *Refuse:* That this is *just* pragmatics (this is the core thesis).
      *   *Cannot Lose:* The Pragmatics charge, The CRISPR objection, The Non-Manipulable Confounder objection.
      *   *Pre-empt:* The CRISPR one (define intervention scope early). The Pragmatics one (distinguish epistemic access from truth conditions).
      *   *Deadly Question:* "If we discover a way to easily edit germline genes tomorrow, does the causal truth about *past* lung cancer cases change retroactively?" (This exposes the instability of the metaphysics).

  7.  **Review against Constraints:**
      *   8 objections? Yes.
      *   Ordered by likelihood/damage? Yes.
      *   Phrased for both halves? Yes.
      *   2-minute reply + thin spot? Yes.
      *   Concede/Refuse strategy? Yes.
      *   Pre-emption advice? Yes.
      *   Deadly question? Yes.
      *   Tone: Professional, sharp, aware of the room's dynamics.

  8.  **Final Polish:** Ensure the distinction between the "Metaphysics" crowd (care about truth, grounding, counterfactuals) and the "Biostats" crowd (care about identification, estimation, policy) is sharp in the phrasing. Make sure the "Relabeling" objection gets the weight it deserves since the user specifically mentioned it nagging them.

  *(Self-Correction during drafting)*: I initially thought about putting the "DAGs are enough" objection higher. But if the user is talking to a joint session, the biostats people might be curious about the foundations, otherwise they wouldn't attend. The "Relabeling" objection is more fundamental. I will keep that at #1. I need to make sure the "CRISPR" objection is framed carefully—it's not just "can we do it," but "is it a valid intervention in the *model*."

  Let's finalize the "Deadly Question." It needs to be the one that exposes the tension between *ontological truth* and *changing human capabilities*. The retroactive truth change is the killer.

  Okay, ready to write.
answer: |-
  Here is your Q&A prep sheet. It is calibrated for a room split between metaphysicians (who care about truth conditions and grounding) and biostatisticians (who care about identification, estimation, and policy).

  ### **Strategic Overview**

  *   **The Core Tension:** You are making an ontological claim ("manipulability constitutes causal truth") to a room where half believes ontology is distinct from epistemology (Phil) and half believes ontology is irrelevant if the estimator is unbiased (Stats).
  *   **The "Relabeling" Charge:** This is your biggest vulnerability. If you cannot distinguish "what we can manipulate" from "what counts as a cause," you have not solved causal selection; you have just defined it away.
  *   **Pre-emption Strategy:** Do not wait for the "CRISPR/Gene Editing" objection. Define the scope of "intervention" in your opening remarks (e.g., *policy-relevant* interventions vs. *logical* possibilities). Do not wait for the "Pragmatics" charge; explicitly distinguish your view from epistemic pragmatism in the second slide.

  ---

  ### **The Objections (Ordered by Likelihood & Damage)**

  #### **1. The "Relabeling Pragmatics" Objection**
  *   **Likelihood:** Certain. **Damage:** Fatal.
  *   **Philosophy Half:** "You claim this is metaphysics, but you're defining causal truth in terms of human capacities. That's just epistemology dressed up as ontology. You haven't explained why smoking is *really* the cause, only why it's useful for *us* to say it is."
  *   **Biostats Half:** "You're saying a variable is a 'cause' only if we can intervene on it. But the biological mechanism doesn't change based on our technology. Are you saying the causal structure of the universe changes when we invent a new drug?"
  *   **2-Minute Reply:** "I am not defining cause by *current* human ability, but by the *structural* capacity of the variable to transmit an intervention. The genotype is a background parameter; the smoking is a modifiable input. The distinction isn't about what we *are* doing, but about the system's architecture regarding control. If we treat the genotype as a cause, we lose the invariance required for prediction under policy changes. That's not a pragmatic loss; it's a failure to capture the causal structure that supports counterfactuals about *change*."
  *   **Thin Spot:** You are leaning heavily on "invariance." If they press on whether invariance is a truth condition or just a desirable feature of models, you may have to concede that your "metaphysics" is actually a "normative account of modeling."
  *   **Strategy:** **REFUSE.** This is your thesis. If you concede this is just pragmatics, the paper is merely a methodological note.

  #### **2. The "CRISPR/In Principle" Objection**
  *   **Likelihood:** High. **Damage:** High.
  *   **Philosophy Half:** "Woodward allows for 'in principle' interventions. With gene editing, genotype *is* manipulable. Your example collapses. Why isn't the genotype a cause now?"
  *   **Biostats Half:** "We can model a genetic intervention in a DAG. We do it in Mendelian Randomization. If we can define the do-operator on genotype, why does it drop out of the causal set?"
  *   **2-Minute Reply:** "There is a distinction between a theoretical intervention on a variable and a viable intervention on the *system* for the purpose of explanation. Gene editing changes the *individual*, but it doesn't offer a lever for the *population-level* process that generated the cancer in the historical context. My claim is context-sensitive: in the context of public health etiology, the genotype is fixed background. In the context of germline therapy, it becomes a cause. The causal truth is relative to the system boundaries, not absolute."
  *   **Thin Spot:** "Context-sensitive causal truth" sounds suspiciously like "there is no single causal truth." Metaphysicians will smell blood here.
  *   **Strategy:** **PRE-EMPT.** Define "intervention" as "policy-relevant manipulation" in your intro to block the "in principle" move.

  #### **3. The "Fixed Confounders" Objection (Sex, Race, Age)**
  *   **Likelihood:** High. **Damage:** High.
  *   **Biostats Half:** "We adjust for sex and age in almost every model. We treat them as confounders. Confounders are causes. Are you telling me sex isn't a cause of health outcomes because we can't intervene on it?"
  *   **Philosophy Half:** "If manipulability is necessary for causation, you have to eliminate a huge chunk of accepted causal knowledge. That's a reductio ad absurdum of your account."
  *   **2-Minute Reply:** "I distinguish between *causal drivers* and *causal heterogeneity*. Sex stratifies the risk, but it doesn't initiate the process in the same way an exposure does. However, I am willing to be pluralist here: there are 'causal dependencies' (which include fixed traits) and 'causal productions' (which require manipulability). My claim is specifically about *causal selection* for explanation and liability, not about every statistical dependency."
  *   **Thin Spot:** You are retreating to pluralism. If you concede fixed traits aren't "causes" in your sense, you alienate the biostats crowd who call them causes daily.
  *   **Strategy:** **CONCEDE (Partially).** Admit your account targets *explanatory* causation (liability/intervention), not *predictive* causation.

  #### **4. The "DAGs Already Do This" Objection**
  *   **Likelihood:** Medium. **Damage:** Medium (Relevance).
  *   **Biostats Half:** "We already handle this. Smoking is the 'exposure' node; genotype is a 'covariate' node. We don't need metaphysics to tell us which one to target. We look at the identification strategy."
  *   **Philosophy Half:** "The DAG syntax already encodes the distinction you're arguing for. What work is your philosophical account actually doing?"
  *   **2-Minute Reply:** "DAGs encode the distinction, but they don't *justify* it. Why is smoking the exposure and genotype the covariate? Usually, it's an arbitrary modeling choice. I'm arguing that the choice isn't arbitrary; it tracks the metaphysical structure of manipulability. I'm providing the truth conditions that make the DAG syntax valid, rather than just a convention."
  *   **Thin Spot:** Biostats might not care about "truth conditions" if the estimator works either way.
  *   **Strategy:** **REFUSE.** Argue that without this justification, DAG construction is ad hoc.

  #### **5. The "Mendelian Randomization" Objection**
  *   **Likelihood:** Medium. **Damage:** High (Technical).
  *   **Biostats Half:** "We use genotype as an Instrumental Variable to find causal effects. If genotype isn't a cause, how can it be a valid instrument? It must have a causal path to the outcome."
  *   **Philosophy Half:** "If the genotype has no causal power, the exclusion restriction in your IV model is violated. Are you undermining the validity of MR studies?"
  *   **2-Minute Reply:** "In MR, the genotype is a proxy for the *exposure* (e.g., alcohol metabolism), not the direct cause of the *outcome* (e.g., liver disease) independent of that exposure. It's a cause of the *smoking behavior*, not the *cancer* directly. My account holds: it's a cause of the manipulable variable, which is the proximate cause of the disease."
  *   **Thin Spot:** If the genotype has pleiotropic effects (direct paths to outcome), your defense fails. You need to be careful about direct vs. indirect paths.
  *   **Strategy:** **REFUSE.** Clarify the path structure.

  #### **6. The "Counterfactual Normality" Objection**
  *   **Likelihood:** Medium. **Damage:** Medium.
  *   **Philosophy Half:** "Halpern and Pearl solve causal selection using 'normality' conditions in Structural Equation Models. The genotype is 'normal' background; smoking is 'abnormal.' You don't need interventionism to fix the counterfactual account."
  *   **Biostats Half:** "We can weight the counterfactuals by baseline risk. Why do we need to bring in manipulability?"
  *   **2-Minute Reply:** "Normality is subjective and context-dependent. What's 'normal' changes across cultures. Manipulability is structural. A variable is manipulable regardless of whether it's common or rare. Relying on normality makes causal truth depend on statistical frequency, which is unstable. Manipulability anchors it in the system's dynamics."
  *   **Thin Spot:** "Normality" is actually very robust in modern causal inference (typicality). You might be attacking a straw man.
  *   **Strategy:** **REFUSE.** Argue that normality is derivative of manipulability (we call it abnormal because we can change it).

  #### **7. The "Variable Granularity" Objection**
  *   **Likelihood:** Low. **Damage:** Medium.
  *   **Philosophy Half:** "Smoking is manipulable, but so is 'buying cigarettes,' 'lighting the match,' or 'taxing tobacco.' Interventionism doesn't tell you *which* manipulable variable is the cause. You still have a selection problem."
  *   **Biostats Half:** "Which node is the treatment? The pack, the puff, or the nicotine intake? Your account doesn't help us specify the estimand."
  *   **2-Minute Reply:** "It narrows the field significantly. It rules out the genotype. Within manipulables, we look for the *stable* mediator. But I grant interventionism doesn't solve granularity alone; it solves the *exclusion* of non-manipulables, which was the specific failure of the counterfactual account I'm addressing."
  *   **Thin Spot:** You are admitting your theory is incomplete.
  *   **Strategy:** **CONCEDE.** Admit this is a remaining problem, but argue it's better than the counterfactual failure.

  #### **8. The "Normative/Blame" Objection**
  *   **Likelihood:** Low. **Damage:** Low.
  *   **Philosophy Half:** "We select smoking as the cause because we want to assign blame to the patient or industry. This is a normative judgment, not a metaphysical one."
  *   **Biostats Half:** "Public health priorities drive the labeling. We call it a cause because we want to fund smoking cessation, not gene therapy."
  *   **2-Minute Reply:** "Normative interests guide our *attention*, but they don't create the *capacity* for intervention. You can want to intervene on genetics all you like; if the system doesn't support it, it's not a cause in my sense. The normativity rides on top of the metaphysical constraint."
  *   **Thin Spot:** Hard to disentangle "capacity to intervene" from "political will to fund intervention."
  *   **Strategy:** **REFUSE.** Keep the line between "can" and "should" sharp.

  ---

  ### **The "Do Not Lose" Objections**
  If you lose these, the paper fails.
  1.  **The Relabeling Pragmatics Objection (#1):** If this is just pragmatics, you have no metaphysical contribution.
  2.  **The CRISPR Objection (#2):** If genetics is manipulable, your main case study (lung cancer) dissolves.
  3.  **The Fixed Confounders Objection (#3):** If sex/age aren't causes, biostats will reject the framework as unusable.

  ### **Pre-emption Plan**
  *   **Slide 2:** Define "Intervention." Explicitly state: *"I am referring to stable, policy-relevant interventions on the system, not logical possibilities or futuristic technologies."* (Kills Objection #2 early).
  *   **Slide 4:** Distinguish "Epistemic Access" from "Truth Conditions." Explicitly state: *"I am not arguing we know causes because we manipulate them; I am arguing they are causes because they are the kinds of things that sustain manipulation."* (Kills Objection #1 early).
  *   **Slide 6:** Acknowledge Fixed Traits. *"Fixed traits like sex are causal background conditions, distinct from causal drivers."* (Softens Objection #3).

  ### **The Deadly Question**
  *Hope nobody asks this, but prepare for it:*

  **"If we discover a way to easily edit germline genes tomorrow, does the causal truth about *past* lung cancer cases change retroactively?"**

  *   **Why it kills you:**
      *   If you say **Yes**: Causal truth is unstable and dependent on future tech. Metaphysicians will say that's absurd.
      *   If you say **No**: Then manipulability wasn't the truth condition for the past case. You've admitted manipulability is just a heuristic for *current* utility (Pragmatics).
  *   **The Survival Reply:** "Causal claims are always time-indexed to the system state. A claim made in 2024 about a 1990 case is evaluated against the 1990 system constraints. We don't update past truth values; we update our *vocabulary* for future cases." (This is thin, but it's the only way out).
