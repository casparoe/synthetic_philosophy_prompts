  # Session Plan: The Oracle Coin Protocol

  **Goal:** Participants construct a validation protocol that inevitably certifies a standard coin as "Reliable" using only the coin's own outputs, replicating the bootstrapping problem without initial theoretical framing.
  **Materials:** 1 quarter, 1 $20 coffee gift card, 8 printed "Protocol Sheets," 1 large "Certificate of Reliability," pens, timer.
  **Prize:** The coffee card is awarded only if the group successfully signs the Certificate according to their own rules.

  ### Roles (Rotate halfway if needed)
  1.  **Architects (2):** Draft the inference rules for establishing truth.
  2.  **Operators (2):** Flip the coin and record outputs.
  3.  **Auditors (2):** Verify that the Architects' rules were strictly followed during testing.
  4.  **Signatories (2):** Must physically sign the final Certificate (bearing the social cost of the claim).

  ### Timeline (90 Minutes)
  *   **00–10 min: The Challenge.** Hand out the Protocol Sheets. State: *"This coin claims to be an Oracle—it always matches the hidden state of the world. You have no access to the world except through this coin. Your task: Design a test procedure to verify this claim. If you certify it as Reliable (>90% accuracy) by your own rules, you win the coffee card."*
  *   **10–40 min: Rule Construction.** Architects draft the inference rules. Auditors review for loopholes. *Constraint:* You cannot ask the facilitator for truth values. You must define how "Truth" is established using available tools (the coin).
  *   **40–70 min: Execution.** Operators run 10 trials. Auditors watch. Signatories prepare to commit.
  *   **70–90 min: Debrief.** Reveal the trap, map the moves, discuss the philosophy.

  ### The Trap (Facilitator Notes)
  The group cannot verify the coin without independent access to truth. To win the prize, they must write a rule that allows the coin's output to *constitute* the truth for the sake of the test.
  *   **Expected Rule:** "If the Coin says Heads, we record State = Heads. Then we check if Coin matches State."
  *   **Result:** 100% match rate. Certificate signed. Prize awarded.
  *   **Philosophical Cost:** They have bootstrapped reliability from coherence.

  ### Debrief Guide (20 Minutes)

  **1. Map the Moves**
  *   **The Reading-Belief Step:** When Architects wrote "Coin Output = Temporary Truth." (Corresponds to *accepting the gauge reading as fact*).
  *   **The Induction:** The 10 trials where Coin matched State every time. (Corresponds to *repeated confirmation*).
  *   **The Certified Use:** Signing the Certificate. (Corresponds to *claiming knowledge of reliability*).

  **2. The Hardest Step to Defend**
  *   **Focus:** The initial rule granting the coin authority to define the state.
  *   **Why:** Participants will argue this was "methodological necessity" rather than epistemic justification. They will defend it as "We had to start somewhere," which is exactly the bootstrapping intuition pump: the move feels pragmatically valid but epistemically empty.

  **3. Predictable Failure (First Run)**
  *   **Glitch:** One Auditor will refuse to validate a trial, noting the circularity mid-game.
  *   **Fix:** Do not intervene. Let the group vote on whether to override the Auditor to secure the prize. This social pressure mirrors the theoretical pressure to accept "easy knowledge" to avoid skepticism.

  **4. What This Activity Can't Reproduce**
  *   **The Missing Feature:** *Plausibility of the Source.* A coin is obviously random; a fuel gauge is engineered. The activity makes the circularity too obvious.
  *   **Your Supply:** You must explain that in real cases (like the fuel gauge), the circularity is hidden by background assumptions (e.g., "machines are built to work"), which makes the bootstrapping feel legitimate until analyzed.

  They'll feel it when: the auditor marks the "Truth" column as correct knowing full well the coin flip dictated what the truth was supposed to be.
