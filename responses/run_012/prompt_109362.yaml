      *   *The Bootstrapping Leak:* How do they record "Actual State"?
      *   If I (facilitator) provide the Actual State, it's not bootstrapping, it's calibration.
      *   For bootstrapping, *they* must derive the Actual State from the Coin, then use that to confirm the Coin.
      *   *Instruction:* "You cannot ask the facilitator for the truth. You must determine the truth using the agreed procedure."
      *   *Their likely procedure:* "The Coin tells us the truth." -> "So the Truth is what the Coin says." -> "Does the Coin match the Truth?" -> "Yes." -> "Coin is Reliable."
      *   *Incentive:* If they certify it, they get the prize. If they admit uncertainty, no prize.
      *   *Pressure:* 90 mins is tight. They want the prize. They are grad students (like proving things). They will rationalize.

  5.  **Refining the Steps & Roles:**
      *   **Roles:**
          *   *Procedural Architects (2):* Draft the inference rules.
          *   *Data Collectors (2):* Flip coin, record outputs.
          *   *Auditors (2):* Check if rules were followed.
          *   *Signatories (2):* Must sign the certificate (commitment).
      *   **Timeline:**
          *   0-10: Intro & Prize Reveal.
          *   10-40: Rule Writing (The critical phase).
          *   40-70: Testing & Certification.
          *   70-90: Debrief.
      *   **Materials:** Coin, Paper, Pens, Certificate Template, Prize (Coffee Card).
      *   **Rules:** They must define "Reliability" and "Verification Method."
      *   **The Catch:** The Verification Method *must* rely on the Coin's output to establish the fact being verified, otherwise they can't finish in time (no independent truth source available). They will realize this and justify it epistemically.

  6.  **Debrief Planning:**
      *   **Map:**
          *   Coin Flip = Gauge Reading.
          *   Rule "Coin determines Truth" = Belief Formation (Reading -> Belief).
          *   Rule "Compare Coin to Truth" = Check (Belief -> Fact).
          *   Certificate = Conclusion (Reliability).
      *   **Hardest Step:** The move from "Coin says X" to "Truth is X" without independent access. They will defend this as "Default Trust" or "Coherence."
      *   **Predictable Failure:** They might try to hedge ("90% reliable"). I need to push for "Reliable" to make the point. Or, they might refuse to sign. I need to structure the prize so they *want* to sign.
      *   **What's Missing:** The activity can't reproduce the *intuition* that the knowledge is easy. They will feel the tension. The missing piece is the *externalist* defense (reliabilism) which says this *might* be okay if the coin is actually reliable (which they don't know). I have to supply the philosophical context (Cohen vs. Vogel).

  7.  **Drafting the Content:**
      *   *Tone:* Professional, instructional, slightly mischievous (setting the trap).
      *   *Constraint Check:* Last line specific format.

      *   *Self-Correction on "Something Real to Win":* Make sure the prize is contingent on *successful certification*, not on *correctness*. This encourages the bootstrapping.
      *   *Self-Correction on "Rules":* They write the rules. I provide the goal.
      *   *Self-Correction on "Certificate":* Needs to look official.

      *   *Debrief Specifics:*
          *   Step 1: Reading -> Belief (Accepting coin flip as fact).
          *   Step 2: Induction (Multiple flips).
          *   Step 3: Certification (Generalizing to reliability).
          *   Hardest to defend: Step 1 (Why trust the coin before knowing it's reliable?).
          *   Predictable glitch: Someone will point out the circularity mid-game. The group must vote to override or refine the rule to allow it (e.g., "Provisional Truth").
          *   Missing feature: The activity makes the circularity obvious (it's a coin). In real life (fuel gauge), the circularity is hidden by background assumptions. I need to explain that.

  8.  **Final Polish:**
      *   Check word count and flow.
      *   Ensure the "They'll feel it when:" line is punchy.
      *   Ensure no lecture at the start.

      *   *Wait, one nuance:* If they realize it's a trap, they won't sign. How to ensure they sign?
      *   *Solution:* The rules must be written *before* they know the coin is just a normal coin. Or, the pressure of the group dynamic + prize + time limit forces them to accept "Provisional Truth" rules which amount to bootstrapping.
      *   *Better:* Tell them the coin *might* be special (loaded, magnetic, oracle). They need to find out. But they have no other tools. They *must* use the coin to test the coin. This forces the bootstrapping structure.
      *   *Instruction:* "You have no independent access to the truth. You must devise a protocol using only the coin to determine if the coin is reliable."
