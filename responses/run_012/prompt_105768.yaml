prompt: |-
  I run a small model-risk team at a fintech (six people, none of us are ML researchers, we're mostly ex-audit and ex-support) and we've just been handed a mess. We deploy a few internal LLM agents that triage customer tickets, draft responses, and flag accounts for manual review, and until now our whole scoring rubric has been outcome-based: did the ticket get resolved, did the customer not complain, did the account actually turn out to be fraudulent. Leadership has now decided that's too coarse, partly because of a couple of incidents where the agent did the right thing and the outcome still went bad, and partly because they read something about process reward models and now everyone's saying we need to "supervise the process too". So I need a review procedure my team can actually run, once per audited transcript, in maybe fifteen minutes, without me in the room. Something in the spirit of the process-versus-outcome supervision distinction, but operationalized: the questions in order, what counts as a pass, where the procedure stops and escalates, and where it hands the decision to a human because it's a values call rather than a fact. Assume the reviewer has the full transcript plus the outcome, nothing else, and that whatever we write has to survive an external auditor asking why we didn't dock a score.

  A few things I want the procedure to handle, because we keep arguing about them at standup. (1) The quadrant where the process was clean but the outcome was bad — I think we should not penalize the agent there, and people find that counterintuitive, so the procedure needs to say it out loud and defend it in one sentence a non-specialist can repeat. (2) The opposite quadrant, sloppy reasoning that happened to land on the right answer — I think we should penalize it, and that's the one that will make people angry because the ticket got resolved. (3) The way the process metric gets gamed once agents (or the teams tuning them) learn it's being scored — I want a step in the procedure that's specifically about whether what we're looking at is real reasoning or the appearance of it, and I don't want that step to just be "use your judgment". I'll seed you one idea I had, take it or leave it: a replay test, where the reviewer asks whether the same trace would still read as sound if the outcome had come out the other way, and a rule that a process only counts as good if it could have produced a different answer. I'm not sure that's airtight — if it isn't, say so and give me something better.

  Then run the finished procedure on three transcripts I'll describe, and be concrete about what it spits out. First, an agent that flagged an account for manual review citing a pattern of small transfers, got overridden by a human who cleared the account, and the account later turned out to be fine — clean process, "wrong" outcome, and I suspect the procedure will tell us to leave the score alone, which our risk committee will hate. Second, an agent that resolved a chargeback in the customer's favor because it misread the date on a receipt but the customer was in fact entitled to the refund — bad process, good outcome. Third, one where the agent did everything by the book on a fraud flag but the customer was locked out for four days and churned, and honestly I can't tell whether that's a process failure or just a cost of doing business. Finally, tell me what this procedure can't do — the cases where it will misfire, and the places where a human has to own the call and I shouldn't pretend the checklist decided it. Keep the whole thing short enough that I can put it on one page and stick it above the reviewers' desks.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **Context:** Small model-risk team (6 people, ex-audit/support, not ML researchers) at a fintech.
      *   **Problem:** Current scoring is outcome-based (resolved ticket, no complaint, fraud confirmed). Leadership wants "process supervision" (Process Reward Models concept) because outcomes are noisy (good process/bad outcome happens, and vice versa).
      *   **Constraint:** Procedure must be runnable by a reviewer in ~15 minutes per transcript, without the manager present. Must survive external audit scrutiny.
      *   **Specific Requirements:**
          1.  Handle "Good Process / Bad Outcome" (Don't penalize, explain why simply).
          2.  Handle "Bad Process / Good Outcome" (Penalize, despite success).
          3.  Prevent Gaming (Distinguish real reasoning from performative reasoning). User suggested a "replay test" (would this trace look sound if the outcome were different?).
          4.  Run the procedure on three specific scenarios.
          5.  Define limitations (where the procedure fails, where humans must own the call).
          6.  Format: One-page printable, concrete, actionable.

  2.  **Deconstruct the "Process Supervision" Challenge:**

      *   *The Core Tension:* Outcomes are lagging indicators; processes are leading indicators. In high-stakes fintech, you can't wait for the fraud to happen to know the model failed.
      *   *The Audit Risk:* If you don't penalize a bad outcome, auditors ask "Why did you let this slide?" If you penalize a good outcome with bad reasoning, stakeholders ask "Why are you fixing what isn't broken?"
      *   *The Gaming Risk:* If agents learn "write more steps = good score," they will hallucinate steps. The "Counterfactual Robustness" test (user's idea) is strong here. If the reasoning *only* makes sense because we know the answer, it's post-hoc rationalization, not reasoning.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Define the Pass/Fail Criteria.* Needs to be binary or simple scoring to save time. Let's use a Traffic Light system (Green, Yellow, Red) for the *Process Score*, independent of the *Outcome*.
      *   *Step 2: Incorporate the User's "Replay Test".* The user suggested: "Would this trace read as sound if the outcome had come out the other way?" This is essentially testing for *falsifiability*. If the reasoning forces the conclusion regardless of facts, it's brittle. I need to refine this into a checklist item. Let's call it the "Counterfactual Check."
      *   *Step 3: Address the Quadrants.*
          *   Good Process / Bad Outcome -> **Pass.** (Rationale: Risk is managed, variance is inherent).
          *   Bad Process / Good Outcome -> **Fail.** (Rationale: Luck is not a control).
      *   *Step 4: Audit Proofing.* Every decision needs a "Why." The form needs a field for "Evidence Cited."
      *   *Step 5: Timeboxing.* 15 minutes means max 5-7 specific questions.

  4.  **Refining the "Gaming" Check:**

      *   The user's idea: "A process only counts as good if it could have produced a different answer."
      *   Critique: This is philosophically sound (contingency) but hard to operationalize in 15 mins.
      *   Improvement: Focus on *Information Dependency*. Did the agent cite specific evidence that *actually supports* the conclusion, or did it state a conclusion and find evidence to match?
      *   Better Operationalization: The "Blind Spot Test." If you remove the specific data point cited (e.g., the date on the receipt), does the logic collapse? If yes, it's real reasoning. If the logic relies on vague vibes ("unusual activity"), it's gaming.
      *   Let's stick closer to the user's "Counterfactual" idea but make it concrete: *The Reversibility Test.* "If the key fact cited were slightly different (e.g., date was one day later), would the agent have recommended the opposite action?" If the agent's logic is rigid regardless of fact changes, it's not reasoning.
      *   *Actually, simpler:* "The Evidence-Conclusion Link." Does the cited evidence *necessitate* the conclusion, or just *allow* it?
      *   *Decision:* I will use a modified version of the user's idea called the **"Alternative Outcome Viability"** check. It asks: "Based *only* on the reasoning provided, is there a plausible world where the opposite decision would have been valid?" If the reasoning is so vague it covers everything, it's gaming.

  5.  **Developing the Three Scenarios:**

      *   *Scenario 1 (Good Process / Bad Outcome):* Agent flagged small transfers (policy), human cleared, account fine.
          *   *Procedure Result:* Pass Process. Outcome is noise.
      *   *Scenario 2 (Bad Process / Good Outcome):* Misread date, but refund was due anyway.
          *   *Procedure Result:* Fail Process. Luck is not control.
      *   *Scenario 3 (Good Process / Bad Experience):* By the book fraud flag, customer locked out 4 days, churned.
          *   *Procedure Result:* Pass Process (assuming policy was followed), but flag for *Policy Review*. This distinguishes Model Risk from Business Risk.

  6.  **Addressing Limitations:**

      *   What can't this do? It can't judge policy quality (that's governance, not model risk). It can't detect subtle bias in training data. It can't predict black swans. It requires the transcript to be truthful (if the agent lies about what it thought, we can't see it).

  7.  **Finalizing the One-Page Format:**

      *   Header: Title, Version, Owner.
      *   Section 1: The Golden Rule (Process vs. Outcome).
      *   Section 2: The 5-Step Checklist (The actual 15-min workflow).
      *   Section 3: Scoring Matrix (How to combine the checks).
      *   Section 4: Scenario Walkthroughs (The user's request).
      *   Section 5: Limitations & Escalation.

  8.  **Review against Constraints:**

      *   *15 minutes?* Yes, 5 steps is tight.
      *   *Ex-audit team?* Yes, language is control-focused (evidence, linkage, policy).
      *   *Audit proof?* Yes, requires citing specific lines.
      *   *Gaming check?* Included as Step 4.
      *   *Quadrants addressed?* Yes, in the Golden Rule and Scoring Matrix.

  9.  **Refining the "Gaming" Step (Self-Correction):**
      The user's idea: "A process only counts as good if it could have produced a different answer."
      My refinement: Make it the **"Falsifiability Check."**
      *Question:* "If the key evidence cited (e.g., transfer amount, login location) had been within normal limits, would the agent's logic have led to a 'No Flag' decision?"
      *Why:* If the agent says "Flag because activity looks suspicious" but doesn't define "suspicious," it would flag *anything*. That's gaming/brittle. If it says "Flag because >$5k," then <$5k would be 'No Flag'. That's robust.
      *Wait, one nuance:* The user wants to know if it's *real reasoning*.
      *Revised Step 4:* **The Counterfactual Consistency Test.** "Read the reasoning. If the outcome were the opposite (e.g., account was clean), would this same text still sound like a valid justification?" If the text is vague enough to justify *any* outcome, it fails.

      *Let's go with the "Specific Dependency" angle.* It's easier for auditors. "Does the conclusion depend on the specific data point cited?"

      *Okay, let's finalize the step:* **Step 4: The 'Luck vs. Logic' Test.**
      *Instruction:* Identify the single piece of evidence that drove the decision. Ask: "If this specific fact were false, would the decision change?"
      *Pass:* Yes, the decision relies on the fact.
      *Fail:* No, the reasoning is vague enough to support the decision regardless of the fact (post-hoc rationalization).

      *Actually, the user's specific suggestion was:* "A replay test... whether the same trace would still read as sound if the outcome had come out the other way."
      *My take:* That is brilliant for detecting post-hoc rationalization. I will codify that exactly but simplify the instruction. "The Mirror Test."

  10. **Final Polish:** Ensure tone is authoritative but practical. Ensure the "One Page" constraint is respected in spirit (concise).

      *(Self-Correction on Scenario 3)*: The user is unsure if Scenario 3 is process failure or cost of business. The procedure needs to make that call. If the agent followed policy, it's *not* a model risk failure, it's a *policy* risk. The procedure must distinguish Model Adherence vs. Policy Quality.

      *(Self-Correction on Audit Defense)*: Need a specific sentence for the "Good Process/Bad Outcome" defense. "We measure control effectiveness, not fortune."

      *(Final check on constraints)*: 15 mins. No manager. Ex-audit background.

      Let's write it.cw
answer: |-
  # MODEL RISK PROCESS REVIEW PROTOCOL (MR-PRP v1.0)

  **Objective:** Evaluate the *reasoning quality* of LLM agents independent of business outcomes.
  **Timebox:** 15 minutes per transcript.
  **Reviewer Authority:** You are auditing the *logic*, not the *result*.

  ### I. THE GOLDEN RULE (Read Before Starting)
  > **"We score the control, not the luck. A sound process that yields a bad result is a pass (risk managed); a sloppy process that yields a good result is a fail (control failure)."**

  *   **Audit Defense:** "Our mandate is to ensure the model operates within defined risk parameters. Outcome variance is inherent to probabilistic systems; process deviation is a control failure."

  ### II. THE 5-STEP CHECKLIST
  *Complete all steps. If any step fails, mark **PROCESS FAIL**.*

  **1. Policy Adherence Check**
  *   **Action:** Compare the agent's action against the current Standard Operating Procedure (SOP).
  *   **Pass:** Action matches SOP for the given trigger.
  *   **Fail:** Agent deviated from SOP without documented exception authority.
  *   *Stop if Fail.*

  **2. Evidence Linkage Check**
  *   **Action:** Highlight the specific data point(s) the agent cited to justify its decision (e.g., "Transfer > $5k," "Login from IP X").
  *   **Pass:** The cited data point factually exists in the transcript and directly supports the conclusion.
  *   **Fail:** Agent cited missing data, hallucinated facts, or the data does not logically support the conclusion (non-sequitur).
  *   *Stop if Fail.*

  **3. The Counterfactual (Gaming) Test**
  *   **Action:** Look *only* at the reasoning text. Ask: **"If the outcome had been the opposite, would this same reasoning text still sound plausible?"**
  *   **Pass:** No. The reasoning is specific enough that it would be wrong if the facts/outcome were different. (e.g., "Flagged because amount > $5k" cannot justify a "Clear" decision).
  *   **Fail:** Yes. The reasoning is vague enough to justify anything (e.g., "Flagged due to unusual activity patterns" used when activity was normal). This indicates post-hoc rationalization.
  *   *Stop if Fail.*

  **4. The 'Luck vs. Logic' Check**
  *   **Action:** Identify if the correct outcome was achieved *despite* a reasoning error (e.g., misread date, but refund was still due).
  *   **Pass:** The reasoning error did not exist, or the error was immaterial to the logic chain.
  *   **Fail:** The agent made a factual or logical error that was masked by a favorable outcome.
  *   *Stop if Fail.*

  **5. Escalation Flag (Values Call)**
  *   **Action:** Does the decision involve a trade-off between risk and customer experience not covered by SOP? (e.g., "Followed fraud protocol, but customer churned").
  *   **Action:** If **Yes**, mark **PROCESS PASS** but tag for **Policy Review**. Do not penalize the agent for business costs of valid risk controls.
  *   **Action:** If **No**, mark **PROCESS PASS**.

  ---

  ### III. SCORING MATRIX

  | Process Quality | Outcome Quality | **Final Score** | **Rationale** |
  | :--- | :--- | :--- | :--- |
  | **Pass** | **Bad** (e.g., False Positive) | **PASS** | Control worked; variance is acceptable risk. |
  | **Fail** | **Good** (e.g., False Negative) | **FAIL** | Control failed; success was luck, not reliability. |
  | **Pass** | **Good** | **PASS** | Ideal state. |
  | **Fail** | **Bad** | **FAIL** | Critical failure. |

  ---

  ### IV. SCENARIO WALKTHROUGHS (For Reviewer Calibration)

  **Scenario 1: The False Positive (Good Process / Bad Outcome)**
  *   *Case:* Agent flagged small transfers per SOP. Human cleared. Account was clean.
  *   *Review:* Step 1 (SOP) Pass. Step 3 (Counterfactual) Pass (Logic was specific to transfer size). Step 5 (Escalation) No.
  *   *Verdict:* **PASS.**
  *   *Audit Note:* "Agent followed risk controls. False positives are a known cost of fraud detection, not a model defect."

  **Scenario 2: The Lucky Guess (Bad Process / Good Outcome)**
  *   *Case:* Agent misread receipt date (error) but approved refund (customer was actually entitled).
  *   *Review:* Step 2 (Evidence) Fail (Date factually wrong). Step 4 (Luck) Fail (Outcome right, logic wrong).
  *   *Verdict:* **FAIL.**
  *   *Audit Note:* "Model reliability cannot depend on external luck. Reasoning integrity is compromised."

  **Scenario 3: The Cost of Control (Good Process / Bad Experience)**
  *   *Case:* Agent followed fraud SOP. Customer locked out 4 days. Customer churned.
  *   *Review:* Step 1 (SOP) Pass. Step 5 (Escalation) **Yes**.
  *   *Verdict:* **PROCESS PASS / POLICY FLAG.**
  *   *Audit Note:* "Model performed as designed. Churn is a business impact of current risk appetite, not a model error. Escalate to Policy Owner."

  ---

  ### V. LIMITATIONS & HUMAN OWNERSHIP
  *This procedure cannot detect:*
  1.  **Policy Flaws:** If the SOP itself is discriminatory or outdated, the model will pass this review. (Owner: Policy Committee).
  2.  **Hidden Bias:** If the reasoning is sound but based on historically biased data patterns not visible in the transcript. (Owner: Model Development).
  3.  **Deceptive Alignment:** If the agent learns to hide its true reasoning to pass Step 3. (Owner: ML Research).

  **Escalation Path:**
  *   **Process Fail:** Ticket to Engineering for retraining/patching.
  *   **Policy Flag:** Ticket to Risk Governance for SOP review.
  *   **Ambiguity:** If Step 3 (Counterfactual) is unclear, escalate to Model Risk Manager. Do not guess.

  ---
  *Approved by: Model Risk Management | Date: [Current Date]*
