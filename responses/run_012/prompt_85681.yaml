answer: |-
  ### Executive Verdict on Your Sketch
  Your sketch is philosophically sound but logistically fragile. The "creamier stock" cue is hard to source reliably; the "ratio rule" (1.7x) is too hard to eyeball, which will make students feel stupid rather than puzzled about knowledge. The Phase 3 instruction card is too abstract; it needs to be about the cards they just held.

  **The Fix:**
  1.  **The Rule:** Change from a precise ratio to a **family resemblance** rule (e.g., "Type A has 3 of these 4 features"). This makes articulation naturally impossible without making the task feel like a math test.
  2.  **The Cue:** Use a **subtle border thickness** (1pt vs 3pt) correlated with Type A/B in the Training Deck, normalized in the Test Deck. This is printable and noticeable only peripherally.
  3.  **The Regress:** Tie Phase 3 directly to the failure of Phase 2. Don't use a separate task; make them write instructions for *themselves* to fix the failure.

  ---

  ### Materials List
  *   **Deck A (Training):** 40 cards. Printed on standard paper.
      *   *Front:* Geometric glyph.
      *   *Back:* "TYPE A" or "TYPE B".
      *   *Secret:* All Type A cards have a **thin border** (0.5pt). All Type B cards have a **thick border** (3pt).
      *   *Rule:* Family resemblance (e.g., Type A = Circle + Vertical Line + Shaded). But the Border is the perfect predictor.
  *   **Deck B (Test):** 20 cards.
      *   *Front:* Same glyphs.
      *   *Back:* "TYPE A" or "TYPE B".
      *   *Secret:* All cards have a **medium border** (1.5pt). The Family Resemblance rule still holds, but it's noisy. The Border cue is gone.
  *   **Worksheets:** Half-sheet of paper per student.
  *   **Timer:** Visible to all.
  *   **Whiteboard:** For scoring and debrief notes.

  *(Prep Note: Create the glyphs in PowerPoint/Keynote. Use "Format Shape" to toggle border weight. Print Deck A and Deck B on the same paper stock. Cut them. Shuffle Deck A so A's and B's are mixed, not clumped, to avoid sequence learning.)*

  ---

  ### Run of Show (90 Minutes)

  #### 0:00 – 0:05 | Setup & Silence
  *   **Action:** Hand out Deck A (Training) and Worksheet to each student.
  *   **Script:** "You have 40 cards. On the front is a shape. On the back is its type, A or B. Your job is to sort them into two piles. Pick up a card, guess the type, put it on the pile, flip it to check. Do this alone. No talking. No notes. You have 12 minutes."
  *   **Goal:** High-speed intuitive sorting. They will unconsciously latch onto the border thickness because it's 100% reliable, while the visual features are noisy.

  #### 0:05 – 0:20 | Phase 1: Acquisition & Articulation
  *   **Action:** Students sort. Timer runs.
  *   **At 12 mins:** "Stop. Count your errors. Write the number on your worksheet. Now, you have 3 minutes. Write a single sentence rule that explains how to tell A from B. Imagine you are texting it to a friend who cannot see the cards, only read text."
  *   **Constraint:** They cannot use the words "border," "thickness," or "look." (Add this to the verbal instruction to force them away from the cue they can't articulate).
  *   **Goal:** Most will score 90%+ (due to the border cue). Most will write vague rules about "heaviness" or "structure" (because they can't articulate the border cue consciously).

  #### 0:20 – 0:40 | Phase 2: The Sabotage (Luck & Defeaters)
  *   **Action:** Collect Deck A. Hand out Deck B (Test) and a fresh Worksheet.
  *   **Script:** "Take Deck B. You must sort these 20 cards. **Constraint:** You are not allowed to use your intuition. You must sort them using *only* the sentence you wrote in Phase 1. If the sentence doesn't cover a card, guess randomly. Record your score."
  *   **Time:** 10 minutes to sort, 5 minutes to score and reflect.
  *   **The Trap:** The border cue is gone (all medium). The visual rule is noisy. Their written sentence is vague. Their accuracy will plummet to ~60% (near chance).
  *   **Prompt:** "On your worksheet, answer: Did you lose a skill, or did you never have one?"

  #### 0:40 – 0:55 | Phase 3: The Regress (Felt, Not Stated)
  *   **Action:** Keep Deck B.
  *   **Script:** "Your sentence failed. Write a *new* set of instructions that would guarantee 100% accuracy on Deck B. You have 5 minutes."
  *   **The Catch:** They will try to be more precise. They will fail, because the rule is family-resemblance (fuzzy).
  *   **The Pivot:** "Stop. Look at your new instructions. To follow *these* instructions, what prior knowledge do you need? Write one line: 'To follow this rule, I first need to know how to...'"
  *   **Goal:** They will write things like "...know what 'heavy' looks like" or "...use judgment." This creates the chain: Rule → Interpretation → Judgment → ?

  #### 0:55 – 1:30 | Debrief (The Philosophy)
  *   **Action:** Whiteboard discussion. No reading.
  *   **Structure:** See "Debrief Beats" below.

  ---

  ### Scoring Scheme (No Money)
  *   **Phase 1 Score:** Out of 40. (Expect 35-40).
  *   **Phase 2 Score:** Out of 20. (Expect 12-14).
  *   **The "Knowledge Gap":** Subtract Phase 2 from Phase 1 (normalized).
  *   **Whiteboard:** Draw a histogram of the drop. "This gap is where the philosophy lives."

  ---

  ### Debrief Beats (25 Minutes)
  *Do not use terms like "Ryle" or "Intellectualist" until the last 5 minutes.*

  **1. The Collapse (5 mins)**
  *   **Ask:** "Why did your score drop in Phase 2?"
  *   **Expected Answer:** "The cards looked different," "My rule was bad," "I relied on something I couldn't name."
  *   **Point:** Reliability vanished when the context changed. If knowledge is a stable state, why did it evaporate?

  **2. The Articulation Barrier (5 mins)**
  *   **Ask:** "In Phase 1, you were 90% accurate. In Phase 2, you had to use your Phase 1 rule, and you failed. Does this mean you didn't *know* how to sort in Phase 1?"
  *   **Tension:** If they knew how, why couldn't they write it? If they didn't know how, how did they sort 38/40 correctly?
  *   **Point:** This drives the wedge between *performance* and *proposition*.

  **3. The Regress (10 mins)**
  *   **Ask:** "In Phase 3, you tried to write a better rule. What stopped you?"
  *   **Expected Answer:** "I couldn't define 'tilted' without pointing," "I had to say 'just look at it'."
  *   **Map:**
      *   *Rule:* "Sort by tilt."
      *   *Interpretation:* "What counts as tilt?"
      *   *Judgment:* "I just see it."
      *   *Question:* Is "seeing it" a thought? If yes, do you need a rule for seeing? (Ryle's Regress). If no, is it knowledge?
  *   **Distinction:** Keep **Ryle's Regress** (acting requires thinking requires thinking...) separate from **Rule-Following** (interpreting a rule requires another rule...).
      *   *Ryle:* If sorting requires a thought about sorting, when do you actually sort?
      *   *Rule-Following:* If the rule "Sort Tilted" needs interpretation, who interprets the interpretation?

  **4. The Labels (5 mins)**
  *   **Now introduce the vocabulary:**
      *   **Intellectualist:** "You *did* know propositions (e.g., 'Thick border = A'), you just couldn't access them verbally." (Counter: You didn't believe it, you just reacted to it. Is unconscious belief knowledge?)
      *   **Rylean:** "You had a disposition, not a fact. Knowing how is not knowing that."
      *   **Perceptual Learning:** "You trained your eyes, not your mind. This might be neither."

  ---

  ### Troubleshooting: What Will Go Wrong
  1.  **Students spot the border cue immediately.**
      *   *Fix:* If 1-2 students shout "It's the border!", acknowledge it publicly but ask them to stay silent. For the rest, it usually remains tacit. If *everyone* spots it, the activity fails.
      *   *Mitigation:* Do a test run yourself. If the border is too obvious, reduce the difference (1pt vs 2pt).
  2.  **Students write "Look for the thick border" in Phase 1.**
      *   *Fix:* The instruction explicitly bans the words "border," "thickness," "line weight." If they violate it, tell them during Phase 2: "You can't use that feature in Deck B."
  3.  **Phase 2 scores don't drop.**
      *   *Reason:* The family resemblance rule is too easy.
      *   *Fix:* Make the glyphs more similar in Deck B. Increase the noise.
  4.  **The Regress feels like a parlor trick.**
      *   *Fix:* Press them on Phase 3. "You wrote 'use judgment.' Is 'judgment' a rule? If not, how do you teach it? If so, what is the rule for judgment?" Don't let them off the hook with "experience."

  ---

  ### Limitations: The Straight Answer
  **Can this activity refute the Intellectualist?**
  **No.** And you should tell them that.

  **Why:** The Intellectualist (e.g., Jason Stanley) can absorb this entire activity.
  *   *Their Reply:* "The students *did* possess propositional knowledge ('Thick border implies Type A'). The fact that it was unconscious or non-linguistic doesn't mean it wasn't propositional. The failure in Phase 2 wasn't a loss of know-how; it was the removal of the truth-maker for their belief. They had justified true belief in Phase 1 (via the border). In Phase 2, the belief was no longer true/reliable. That's a Gettier case, not a refutation of Intellectualism."

  **Does the Luck Phase buy you anything?**
  **Yes, but only on Justification.**
  It shows that **Reliability ≠ Knowledge.** They were reliable in Phase 1, but if their reliability rested on a cue they couldn't cite or defend, did they *know*?
  *   It pushes the Intellectualist to admit that **Access** matters. If Know-How = Know-That, the agent must be able to access the "That." If they can't access it even when prompted (Phase 1 writing), in what sense did they "hold" the proposition?
  *   *The Winning Move:* Don't try to kill Intellectualism. Use the activity to show that **Intellectualism requires a very stretched definition of "Proposition."** If a proposition is something you can act on but never say, never think consciously, and lose without noticing... is it still a proposition?

  **Final Advice:**
  End the class with the uncertainty you requested. "You felt you knew in Minute 10. You felt you didn't know in Minute 30. The cards didn't change. Your mind didn't change. The *support* changed. So where was the knowledge sitting?" Leave it there.
