prompt: |-
  Hey, so I'm a third-year phil student and I'm taking this course on contemporary ethical theory — we've just finished the contractualism unit and I'm also seperately roped into being the student rep on our uni's Financial Hardship Panel, which meets every Thursday and hands out from a fixed pot of about £14k a term. I'm the only one in the room who's read any philosophy, and the other four (a bursar, two academics, a welfare officer) keep justifying everything by saying we should help the most people with the money. My instinct is that this is exactly the kind of justification Scanlon would say doesn't cut it — that what matters is whether a principle could be reasonably rejected by each person affected, looking at that person's own complaint rather than some total of benefits. But in the actual meeting I freeze, because the numbers obviously seem to matter (if I can stop forty students from dropping out at the cost of denying one student something smaller, it feels insane to say no) and I don't know how to say that in contractualist terms without smuggling aggregation straight back in through the side door. And our decisions get written up with reasons and students can appeal, so I can't put 'it helps more people overall' in the record.

  Can you act as someone who genuinely knows this literature — not a summariser, someone who has had to defend the view — and help me build an actual decision procedure my panel could run, rather than a theory recap? Start by brainstorming the moving parts for yourself: what a complaint is and what makes one reasonable, why the view refuses to justify principles by totalling benefits across persons, what the standard options are when a lot of small complaints sit on one side and one large complaint sits on the other, and where contractualists themselves tend to go quiet. Then turn it into a checklist in order — what to ask first, what counts as a sufficient answer to each question, where it stops with a no, and precisely which steps are values calls I have to own rather than facts the procedure settles. It has to be runnable in twenty minutes per case by people who haven't read the book, and it has to survive being read aloud at an appeal. Then please run it on two real cases from last term: (a) one applicant needed almost the entire pot after a house fire, versus forty applicants needing a few hundred each to stay enrolled, and (b) a standing rule we argued about that caps individual awards at £500 so more students can be helped, which predictably shafts the one student with a £3,000 medical bill. Include the case where your procedure tells me something I wont want to hear, and be upfront about what it can't do. Think it through carefully before writing — I'd much rather have the messy edges flagged than a tidy answer that pretends the aggregation problem is solved.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Third-year Philosophy student, taking Contemporary Ethical Theory (finished Contractualism unit). Student Rep on a Financial Hardship Panel.
      *   **Context:** Panel meets Thursdays, distributes ~£14k/term. 5 members (User + Bursar, 2 Academics, Welfare Officer). Others are utilitarian/aggregative ("help the most people"). User is the only philosopher.
      *   **Problem:** User feels Scanlonian contractualism forbids simple aggregation, but freezes in meetings because the numbers *feel* like they should matter (40 vs. 1). Needs a *decision procedure* (checklist) runnable in 20 mins, defensible in writing/appeals, not just theory recap.
      *   **Specific Task:**
          1.  Act as an expert defender of the literature (not a summarizer).
          2.  Brainstorm moving parts (complaints, reasonable rejection, aggregation problem, large vs. small complaints).
          3.  Create a step-by-step checklist/procedure.
          4.  Apply to two specific cases: (a) Fire victim (whole pot) vs. 40 students (small amounts); (b) Cap rule (£500 max) vs. £3k medical bill.
          5.  Include a result the user won't like.
          6.  Flag limitations/unsolved edges.
      *   **Tone:** Professional, philosophically rigorous but practical, honest about the messy edges of contractualism.

  2.  **Deconstruct the Philosophical Challenge (Scanlonian Contractualism):**
      *   *Core Idea:* An act is wrong if it violates principles no one could reasonably reject.
      *   *Individualism:* Justification is owed to each person individually. You can't just sum up small benefits to outweigh a large burden on one person (the "aggregation problem").
      *   *Reasonable Rejection:* Based on the *strength of the complaint* a person has against a principle.
      *   *The "Numbers" Problem:* Scanlon (in *What We Owe to Each Other*) initially seemed to say numbers don't matter at all. Later (and in subsequent literature like Kumar, Voorhoeve, Otsuka), there's nuance. If the complaints are *relevantly similar*, numbers might break ties. If complaints differ in *magnitude*, the stronger individual complaint usually wins, regardless of numbers.
      *   *The Panel Context:* This is about distributing a scarce resource. The "principle" is the allocation rule.
      *   *The Tension:* The panel wants to maximize utility (save 40 dropouts vs. 1 fire victim). Contractualism prioritizes the individual with the strongest grievance *unless* the others have equally strong grievances.
      *   *Key Distinction:* Is the hardship *existential* (dropping out, homelessness) vs. *significant but manageable* (tight budget, stress)?

  3.  **Brainstorming the "Moving Parts" (Internal Monologue/Drafting):**
      *   *Complaint:* What is the burden? Loss of degree? Homelessness? Mental health crisis?
      *   *Reasonable Rejection:* Can the single person say "This rule ignores my catastrophic loss to save many from moderate inconvenience"? Yes. Can the 40 say "This rule saves one person from catastrophe but causes 40 of us to lose our degrees"? It depends on the severity. If the 40 are also losing degrees, their complaint is *similar in kind* to the one.
      *   *Aggregation:* Scanlon says you can't aggregate *small* claims to beat a *large* claim. But if the claims are *equal* (e.g., all will drop out), then you might look at numbers as a tie-breaker or because the principle "save as many as possible from *this specific fate*" is less rejectable.
      *   *The "Freezing" Point:* The user feels utilitarianism is right about the 40 vs. 1 case. Contractualism is tricky here. If the 1 loses everything and the 40 lose everything, contractualism often permits saving the many *if* the individual complaint is identical. But if the 1 loses *more* (e.g., trauma + degree vs. just degree), the 1 wins.
      *   *Procedure Design:* Needs to assess *severity* first, not *count*. Counting comes last, if at all.
      *   *Limitations:* Contractualism doesn't give a crisp algorithm for "how much worse does X have to be to outweigh 10 Ys?" It's about reasonable rejectability.

  4.  **Developing the Decision Procedure (The Checklist):**
      *   *Goal:* Translate "Reasonable Rejection" into "Panel Questions."
      *   *Step 1: Identify the Principle.* What rule are we testing? (e.g., "Cap at £500" or "Award to Applicant A").
      *   *Step 2: Identify the Burdens.* Who loses out? What happens to them? (Need concrete facts, not vibes).
      *   *Step 3: Assess Complaint Strength.* Is the burden catastrophic (dropout, homelessness) or significant (stress, debt)?
      *   *Step 4: Compare Individual Complaints.* Compare the strongest individual complaint on Side A vs. strongest on Side B. *Do not sum yet.*
      *   *Step 5: The Aggregation Check.* Only if complaints are *relevantly similar* in severity do we consider numbers. If one is catastrophic and others are moderate, the catastrophic wins.
      *   *Step 6: Justification.* Can we explain to the loser why their loss wasn't ignored, but outweighed by an *individual* claim of equal/greater strength?

  5.  **Applying to Case (a): Fire Victim (Whole Pot) vs. 40 Students (Small Amounts):**
      *   *Scenario:* Fire victim needs £14k (say, housing + living). 40 need £350 each to stay enrolled.
      *   *Contractualist Analysis:*
          *   Fire Victim Complaint: "Without this, I am homeless and cannot study." (Catastrophic).
          *   Student Complaint: "Without this, I cannot stay enrolled." (Catastrophic).
          *   *Crucial Detail:* If the 40 *drop out* without the money, their complaint is *similar in kind* to the fire victim (loss of education/livelihood).
          *   *Scanlonian View:* If the complaints are equivalent (dropout vs. dropout), numbers *can* matter (Voorhoeve's "relevant similarity" argument). However, if the fire victim is *also* homeless/traumatized, their complaint might be strictly stronger.
          *   *Hard Truth:* If the 40 definitely drop out and the fire victim definitely drops out, contractualism *might* allow saving the 40, but the justification cannot be "40 > 1". It must be "The principle 'prevent dropout where possible' is less rejectable than 'save one from dropout and let 40 drop out'."
          *   *Wait, let's look closer:* Scanlon is wary of aggregation. If the fire victim's need is *more urgent* (e.g., immediate homelessness vs. tuition fee deadline in 2 weeks), the fire victim wins. If both are "dropout," the panel usually leans utilitarian.
          *   *Decision:* I need to force a result the user might not like. Let's say the procedure forces us to prioritize the *severity* of the individual burden. If the fire victim is homeless *now* and the students are at risk of dropout *next term*, the fire victim wins. If both are immediate dropout, the numbers might break the tie.
          *   *Refinement for the prompt:* The user says "if I can stop forty students from dropping out... it feels insane to say no." I need to show where contractualism agrees and where it diverges.
          *   *Actually, the strongest contractualist move:* If the 40 are facing dropout, their individual complaint is "I lose my degree." The fire victim is "I lose my degree + home + safety." The fire victim's complaint is *stronger individually*. Therefore, numbers don't aggregate to beat a stronger individual claim. *This is the result the user won't want to hear.* I will argue that if the fire victim's situation is strictly worse *individually*, contractualism demands helping them, even if 40 drop out. This highlights the tension.

  6.  **Applying to Case (b): The £500 Cap vs. £3k Medical Bill:**
      *   *Scenario:* Rule caps awards at £500. One student has £3k bill.
      *   *Analysis:* The rule is designed to help "more people."
      *   *Complaint:* The £3k student says "This rule ignores my specific medical necessity to satisfy a general preference for breadth."
      *   *Comparison:* Who is the comparator? The marginal student who gets £500 because of the cap.
      *   *Severity:* Is £500 life-changing for the marginal student? Or just helpful? If the marginal student is just "better off" but the £3k student is "medically crippled," the cap is reasonably rejectable.
      *   *Result:* The cap is likely unjustifiable under contractualism if it creates a threshold effect where one person suffers vastly more.

  7.  **Drafting the Response:**
      *   *Tone:* Collegial, expert, direct. Acknowledge the difficulty.
      *   *Section 1: The Moving Parts.* Explain *why* aggregation is the bugbear. Define "Complaint" in panel terms (burdens, not preferences). Explain "Reasonable Rejection" (could you look them in the eye and say this?).
      *   *Section 2: The Procedure.* Make it a flowchart/checklist.
          *   Q1: What is the specific burden?
          *   Q2: Is it catastrophic or moderate?
          *   Q3: Compare the *strongest* individual on Side A vs. *strongest* on Side B.
          *   Q4: Only if equal severity, count heads.
      *   *Section 3: Case Applications.*
          *   Case A: Show the hard result. If Fire Victim is homeless + dropout, and others are just dropout, Fire Victim wins. (User won't like this).
          *   Case B: The Cap. Show why the cap fails if the marginal benefit to the many is low compared to the harm to the one.
      *   *Section 4: Limitations.* Admit that "severity" is subjective. Admit that contractualism doesn't solve the "many moderate vs one extreme" perfectly without some intuition.

  8.  **Refining the "Hard Truth" (Self-Correction):**
      *   I need to be careful not to misrepresent Scanlon. Scanlon *does* allow numbers to count when claims are *identical*. (See his discussion of the Rescue Case). If 1 person will lose a leg, and 5 people will lose a leg, you save the 5. Why? Because the principle "save the 5" is not rejectable by the 1, given that if the 1 were in the 5's position, they'd want the same rule.
      *   *However*, if the 1 loses a leg and the 5 lose a *finger*, the 1 wins.
      *   *Application to Panel:* If the 40 students *drop out* (loss of career/degree) and the Fire Victim *drops out + is homeless*, the Fire Victim's complaint is stronger. The 40 cannot reasonably reject a principle that saves the person with the *worse* plight.
      *   *But*, if the 40 students *drop out* and the Fire Victim *just has a very hard term but stays enrolled*, the 40 win.
      *   *The User's Dilemma:* The user feels utilitarianism is right (save the 40). Contractualism might say "Save the Fire Victim" if their individual plight is worse. I need to make sure this distinction is clear. The procedure must force them to assess *severity* before *count*.
      *   *Wait, one nuance:* In *What We Owe to Each Other*, Scanlon is vague on the "many small vs one large" where the smalls add up to a large. But in the "Rescue Case" (1 vs 5 dying), he says save the 5. The justification is not aggregation, but that the single person cannot reasonably reject a principle that saves more lives when the *stakes per person* are equal.
      *   *So for Case A:* If the stake is "Dropout" for all 41 people, save the 40. If the stake is "Dropout + Homelessness" for 1 vs "Dropout" for 40, save the 1. This is the crucial distinction. I will build the procedure to highlight this.

  9.  **Final Polish:**
      *   Ensure the checklist is practical (20 mins).
      *   Ensure the "Appeal Proof" language is included (how to write the minutes).
      *   Check the tone: "I've had to defend this view."
      *   Make sure to explicitly flag the "messy edges."

  10. **Writing the Response:** (Proceeding to generate output based on these thoughts).
answer: |-
  This is a classic "applied ethics in the wild" problem. You are experiencing the friction between the *justificatory* framework of contractualism (what makes a rule right) and the *deliberative* pressure of resource allocation (where numbers feel undeniable). Your colleagues are acting like act-utilitarians because it's administratively clean. You're hesitating because you know Scanlon's core insight: justification is owed to individuals, not collectives.

  The problem you're facing is the **Aggregation Objection**. Standard contractualism says you cannot sum up small benefits to many to override a catastrophic loss to one. However, Scanlon and his successors (like Voorhoeve and Kumar) have clarified that numbers *do* matter when the individual complaints are *relevantly similar*.

  If you try to argue "numbers don't count" in a meeting, you will be ignored. If you argue "numbers count exactly as much as utilitarianism says," you've abandoned contractualism. The middle path is to use a **Comparative Complaint Procedure**. This shifts the focus from "maximizing good" to "minimizing the strongest individual grievance."

  Here is the breakdown of the moving parts, followed by the procedure you can actually use, and then the application to your cases.

  ### Part 1: The Moving Parts (For Your Own Clarity)

  Before you walk into the room, you need to be clear on three contractualist mechanisms. You won't say these words in the meeting, but they drive the checklist.

  1.  **The Unit of Analysis is the Individual Complaint:**
      *   Utilitarianism asks: "Which outcome has the highest net value?"
      *   Contractualism asks: "Which principle generates the strongest *individual* complaint that cannot be answered?"
      *   *Translation for the Panel:* Do not start by counting heads. Start by identifying the person who would be hit hardest by a decision.

  2.  **Reasonable Rejection & Comparative Severity:**
      *   A principle is reasonably rejected if it imposes a burden on someone that is greater than the burden imposed on anyone else by the alternative principle.
      *   *The "Rescue Case" Nuance:* If Person A will lose their degree, and Persons B–Z will also lose their degrees, the stakes are *relevantly similar*. In this specific case, Scanlon allows numbers to break the tie. Why? Because A cannot reasonably reject a principle that saves more lives/degrees when the *cost per person* is identical.
      *   *The Crucial Distinction:* If Person A will lose their degree + become homeless, and Persons B–Z will only lose their degree, the stakes are *not* similar. A's complaint is stronger. Numbers do not aggregate to beat a strictly stronger individual claim.

  3.  **The "Generic" vs. "Specific" Justification:**
      *   You cannot justify a decision to Student X by saying "We helped 40 others."
      *   You must justify it by saying "The principle we followed prioritizes the most severe individual hardship, and in this specific comparison, the other group's individual hardship was equal/higher."
      *   *Why this matters for appeals:* An appeal panel can review whether you assessed severity correctly. They cannot review whether you "maximized utility" because that's not a fiduciary duty you have; your duty is fair distribution according to the scheme's rules.

  ### Part 2: The Decision Procedure (The Checklist)

  This is designed to take 15–20 minutes per complex case. It forces your colleagues to articulate severity before they are allowed to count heads.

  **Panel Decision Protocol: Hardship Allocation**

  **Step 1: Define the Competing Principles**
  *   *Action:* State the two options as rules, not outcomes.
  *   *Option A:* "Award funds to Applicant/Group X."
  *   *Option B:* "Award funds to Applicant/Group Y."
  *   *Stop Condition:* If one option violates university statutory rules (e.g., exceeds max award), discard it. Proceed only if both are permissible.

  **Step 2: Identify the "Loser's Burden" (The Complaint)**
  *   *Action:* For each option, identify the specific person who suffers the most if that option is *not* chosen.
  *   *Question:* "If we do not fund this person/group, what is the concrete consequence for the *worst-off individual* in that group?"
  *   *Required Answer:* Must be factual, not speculative. (e.g., "Immediate eviction" vs. "Unable to pay tuition by Friday" vs. "High stress/reduced grades").
  *   *Fail State:* If the panel cannot agree on the consequence, pause and request evidence. Do not proceed to voting.

  **Step 3: Assess Complaint Severity (The Threshold Test)**
  *   *Action:* Categorize the burden for the worst-off individual in Option A and Option B.
  *   *Category 1 (Existential):* Homelessness, immediate health risk, certain dropout/loss of degree.
  *   *Category 2 (Critical):* Severe debt, high risk of dropout, inability to access essential care.
  *   *Category 3 (Significant):* High stress, need to work excessive hours, inability to buy equipment/books.
  *   *Decision Rule:* If Option A involves a Category 1 burden and Option B involves a Category 3 burden, **select Option A.** Stop. Do not count numbers.
      *   *Justification:* "The individual grievance in Option A is strictly stronger than any individual grievance in Option B."

  **Step 4: The Similarity Check (Where Numbers Enter)**
  *   *Action:* If both options involve the *same Category* of burden (e.g., both are Category 1 "Certain Dropout"), proceed to counting.
  *   *Question:* "Are the individual burdens relevantly similar?"
  *   *Decision Rule:* If yes, the panel may consider the number of individuals affected to break the tie.
      *   *Justification:* "Since the individual stakes are equal, the principle that prevents more instances of this specific harm is less reasonably rejectable."
  *   *Warning:* Do not use this step to override Step 3. You cannot use 50 Category 3 complaints to beat 1 Category 1 complaint.

  **Step 5: Draft the Reasoning (Appeal-Proofing)**
  *   *Action:* Write the decision record using the "Individual Complaint" language.
  *   *Forbidden Phrase:* "This helps the most students."
  *   *Required Phrase:* "The panel determined that the hardship faced by [Applicant/Group] constituted a [Category] burden. While [Other Group] also faced hardship, their individual burden was assessed as [Lower/Equal Category]. Therefore, the principle prioritizing [Selected Group] could not be reasonably rejected by the other party."

  ***

  ### Part 3: Running the Cases

  Here is where we test the procedure. I am going to be honest about where this bites you.

  #### Case A: The Fire Victim (£14k) vs. 40 Students (£350 each)
  *   **Facts:**
      *   **Fire Victim:** Needs £14k for deposit/rent after house fire. Without it: Homeless + Cannot enroll next term (Dropout).
      *   **40 Students:** Need £350 each for tuition/living gap. Without it: Cannot enroll next term (Dropout).
      *   **Pot:** £14k total. Must choose one side.
  *   **Running the Procedure:**
      *   *Step 1:* Principles are clear. Fund Fire Victim OR Fund 40 Students.
      *   *Step 2:* Loser's Burden.
          *   If Fire Victim loses: Homelessness + Dropout.
          *   If 40 Students lose: Dropout.
      *   *Step 3:* Severity.
          *   Fire Victim: Category 1 (Homelessness + Dropout).
          *   Students: Category 1 (Dropout). *Note: Even if we call Dropout Cat 1, Homelessness is strictly worse.*
      *   *Step 4:* Similarity Check.
          *   Are the burdens relevantly similar? **No.** The Fire Victim faces an additional catastrophic burden (homelessness/trauma) that the students do not.
      *   *Decision:* **Fund the Fire Victim.**
  *   **The Hard Truth:**
      *   This is the result you said "feels insane." Contractualism demands you save the one person facing the *strictly worse* individual fate, even if 40 others face a *very bad* fate.
      *   *Why:* The 40 students cannot reasonably reject a principle that saves the person who is *worse off than them*. To do so would be to say "My dropout matters more than your dropout-plus-homelessness," which is not a reasonable claim.
      *   *The Messy Edge:* If your panel defines "Dropout" as the only metric that matters (ignoring homelessness as a separate variable), then the burdens become "relevantly similar." In that specific framing, contractualism *permits* saving the 40. But if you acknowledge homelessness as a distinct harm, the Fire Victim wins.
      *   *Recommendation:* If you personally feel the 40 must be saved, you must argue that the *dropout* is the primary harm the fund exists to prevent, and homelessness is a secondary welfare issue (refer them to emergency housing). If you accept the fund is for "hardship" broadly, the Fire Victim wins.

  #### Case B: The £500 Cap vs. The £3,000 Medical Bill
  *   **Facts:**
      *   **Rule:** Cap all awards at £500 to spread funds.
      *   **Applicant:** Needs £3,000 for urgent medical procedure not covered by insurance. Without it: Severe health deterioration + Dropout.
      *   **Marginal Beneficiaries:** With the £2,500 saved from this cap, approx 5 other students get £500 each. For them, £500 means "less stress/able to buy books" (Category 3).
  *   **Running the Procedure:**
      *   *Step 1:* Principles. "Maintain £500 Cap" vs. "Make Exception for Medical Necessity."
      *   *Step 2:* Loser's Burden.
          *   If Cap stays (Medical Student loses): Health deterioration + Dropout (Category 1).
          *   If Cap lifted (5 Other Students lose): Loss of £500 support (Category 3).
      *   *Step 3:* Severity.
          *   Medical Student: Category 1.
          *   Others: Category 3.
      *   *Decision:* **Lift the Cap.**
  *   **The Justification:**
      *   The 5 students cannot reasonably reject a principle that allows an exception for medical necessity. Their complaint ("I have more stress") is not strong enough to override the Medical Student's complaint ("I lose my health and degree").
      *   *Appeal Proof:* "The panel recognized that while the cap serves a general distributive aim, the individual burden imposed on [Applicant] by the cap was disproportionately severe compared to the burden imposed on marginal beneficiaries. A principle allowing for medical exceptions is less reasonably rejectable."

  ### Part 4: Limitations & What You Own

  You asked me to flag the messy edges. Here is where this procedure will not save you from moral residue.

  1.  **The "Category" Boundary is Subjective:**
      *   The procedure hinges on Step 3 (Categorization). Is "high stress" Category 2 or 3? Is "dropout" always Category 1?
      *   *Your Burden:* You have to lead the room on this. If your colleagues say "Dropout is just stress, it's Category 2," the math changes. You need to establish a precedent early in the term (e.g., "Threat to enrollment is always Category 1") so you aren't fighting it every Thursday.

  2.  **The "Relevant Similarity" Loophole:**
      *   In Case A, if your colleagues argue "We are a *Tuition* Fund, not a *Housing* Fund, so homelessness doesn't count," they can force the burdens to be "relevantly similar" (both are just 'dropout').
      *   *Contractualist Response:* This is a definitional trick. If the fund is for "Financial Hardship," housing is hardship. You must insist on the broad definition of harm, or the procedure becomes a sham.

  3.  **Residual Guilt:**
      *   If you follow Case A and fund the Fire Victim, 40 students drop out. Contractualism says you did the *right* thing (no one could reasonably reject the principle), but it doesn't make the 40 dropouts disappear.
      *   *What to say:* Do not apologize for "not helping the most." Apologize for the scarcity. "The fund is insufficient to meet all Category 1 needs. We prioritized the most severe individual case."

  4.  **Institutional Reality:**
      *   If the University Bursar says "Utilitarianism is our KPI," this procedure is a shield, not a sword. It protects you from accusations of arbitrariness. It shows you deliberated fairly. It may not stop them from overruling you, but it makes overruling you look like a violation of procedural justice.

  ### Final Advice for the Meeting

  When you freeze, it's because you think you have to prove the numbers *don't* matter. They do matter, but only *after* severity is assessed.

  When the Bursar says, "But we help 40 people here," you say:
  > "I agree we should look at the numbers, but only after we check if the stakes are equal. If the one person loses their home and the 40 people lose their tuition, the stakes aren't equal. We can't use the numbers to override the severity. Let's rate the severity first, then count."

  This sounds reasonable, not philosophical. It uses their language ("stakes," "severity") to enforce a contractualist structure. If they refuse to rate severity and just want to count heads, you have a record in the minutes: *"Student Rep noted that individual severity was not weighed against headcount."* That is your protection for the appeal.
