answer: |-
  The split you describe presupposes a **Dual-Realm Theory of Social Choice**, which posits that economic and political institutions operate in distinct normative spheres with incompatible ontologies of preference and divergent teleological ends. This theory is not merely a pragmatic accommodation but rests on specific philosophical commitments regarding the nature of value, the source of authority, and the limits of liberal neutrality.

  Below is a reconstruction of this implicit theory, distinguishing between its necessary foundations and its contingent accommodations.

  ### 1. The Ontology of Preferences: Transferable Utility vs. Inalienable Judgment

  **The Commitment:**
  The split strictly presupposes that economic preferences are **private, cardinal, and transferable**, while political preferences are **public, ordinal, and inalienable**.

  *   **In Auctions:** A valuation is a private intensity measurable against a common numeraire (money). Because utility is transferable, side payments are possible (even if forbidden in specific auction rules, the *capacity* to pay underpins the valuation). The mechanism design goal is to reveal this private information efficiently.
  *   **In Elections:** A vote is construed not as an expression of intensity, but as a claim to equal agency. The ban on vote-buying is not merely a regulatory constraint but an ontological declaration: political agency cannot be severed from the agent. To treat a vote as a transferable good would be to treat political authority as property.

  **Strict Presupposition vs. Comfortable Fit:**
  *   **Strict Presupposition:** Political equality requires the non-transferability of votes. If votes were transferable, the "one person, one vote" norm would collapse into a market, violating the democratic commitment to equal status.
  *   **Comfortable Fit:** The idea that political preferences are "judgments about the common good" fits well with this ontology but is not strictly required. One could maintain inalienable votes even if voters were purely self-interested (as in Downsean economic theories of voting). The system tolerates selfish voters, provided they cannot sell their votes.

  ### 2. The Teleology of Institutions: Efficiency vs. Legitimacy

  **The Commitment:**
  The split presupposes that the primary good produced by an auction is **allocative efficiency**, whereas the primary good produced by an election is **political legitimacy**.

  *   **In Auctions:** Manipulability (e.g., bid shading) leads to deadweight loss or allocation to non-highest valuers. This is a technical failure because the goal is Pareto optimality. Truth-telling mechanisms (like Vickrey-Clarke-Groves) are prized because they align incentives with efficiency.
  *   **In Elections:** Manipulability (strategic voting) is tolerated because the goal is to generate a winner who is authorized to rule. Legitimacy arises from the *procedural fairness* of the aggregation (universal suffrage, non-dictatorship), not necessarily from the faithful reflection of underlying preferences.

  **Strict Presupposition vs. Comfortable Fit:**
  *   **Strict Presupposition:** Legitimacy requires **non-dictatorship**. The Gibbard-Satterthwaite theorem proves that any non-dictatorial rule with three or more outcomes is manipulable. Therefore, to avoid dictatorship (which destroys legitimacy), we *must* accept manipulability. The tolerance for manipulation is the logical price of rejecting tyranny.
  *   **Comfortable Fit:** The notion that campaigns *should* urge honest voting fits with a civic republican view of democracy, but the system functions even if voters strategize. The practice sits comfortably with the idea of "truthful aggregation," but strictly requires only that the outcome be accepted as binding.

  ### 3. The Domain Assumption: Liberal Neutrality

  **The Commitment:**
  The choice of manipulable rules (plurality, runoff) presupposes **Liberal Neutrality regarding the structure of preferences**.

  *   **The Logic:** Strategy-proof voting rules *do* exist if preferences are restricted (e.g., single-peaked preferences on a one-dimensional spectrum). By refusing to use these rules or to structure the political space to ensure single-peakedness (e.g., by enforcing a two-party system or restricting ballot access), the institution presupposes that citizens are entitled to hold *any* ordering of preferences.
  *   **The Implication:** We prioritize the **freedom of conscience** (unrestricted domain) over the **integrity of the mechanism** (strategy-proofness).

  **Strict Presupposition vs. Artifact:**
  *   **Load-Bearing:** The assumption that the domain *must* remain unrestricted is load-bearing for a liberal democracy that values pluralism. Restricting the domain to achieve strategy-proofness would require the state to define which political preferences are "reasonable" or "structured," which is itself illiberal.
  *   **Artifact:** It is an artifact that we use Plurality/Runoff specifically. We could use other manipulable rules (like Borda) that might perform better. The specific choice of rule is underdetermined; the commitment is only to avoiding domain restriction and dictatorship.

  ### 4. Rival Views Quietly Ruled Out

  This Dual-Realm Theory silently excludes several coherent philosophical alternatives:

  1.  **Political Welfarism:** The view that elections should maximize aggregate social welfare (like auctions). This view is ruled out by the ban on vote-buying and the refusal to weigh votes by intensity.
  2.  **Epistemic Democracy:** The view that voting is a truth-tracking procedure (discovering the "correct" policy). If voting were about truth, manipulability would be a severe epistemic defect (distorting the signal), yet we tolerate it. The practice assumes the *will* of the people matters more than the *correctness* of the outcome.
  3.  **Technocratic Authoritarianism:** The view that efficiency trumps legitimacy. This is ruled out by the refusal to install a "dictator" (a strategy-proof rule) to solve the social choice problem.
  4.  **Market Republicanism:** The view that political influence should be auctioned to those who value it most (e.g., unrestricted campaign spending interpreted as bidding). The current split rejects this by maintaining a firewall between economic valuation and political office.

  ### 5. Areas of Philosophical Underdetermination

  The practice is underdetermined in ways that allow multiple conflicting theories to justify the same institutions:

  *   **The Nature of the "Good":** Is the ban on vote-buying based on the belief that political preferences are *incommensurable* with money (ontological), or merely that allowing commensurability would lead to *unjust outcomes* due to wealth inequality (normative)? The practice looks the same, but the justification differs.
  *   **The Role of Strategy:** Do we urge honest voting because we believe it is morally required (civic duty), or because we know the system is fragile and high levels of strategic voting might lead to instability (pragmatism)? The institutions function either way.
  *   **The Source of Legitimacy:** Is legitimacy conferred by the *input* (voting honestly) or the *output* (peaceful transfer of power)? If the latter, manipulability is irrelevant. If the former, the current system is in tension with its own norms.

  ### 6. Counterfactuals: Swapping the Presuppositions

  If we were to replace the presupposed view, the institutional landscape would change radically.

  **Scenario A: Elections as Pure Preference Aggregation (Strategy-Proof)**
  *   **Assumption:** Political preferences are private valuations comparable to economic goods; the goal is efficient aggregation without manipulation.
  *   **Changes:**
      1.  **Domain Restriction:** To achieve strategy-proofness without dictatorship, we would need to enforce single-peakedness. This might mean legally restricting the political spectrum to one dimension (e.g., only economic left/right) or banning "extremist" parties that create multi-peakedness.
      2.  **Vote Buying:** We would allow the buying and selling of votes to reveal intensity of preference.
      3.  **Weighted Voting:** Votes would be weighted by willingness to pay (tax contributions), moving toward a plutocracy.
      4.  **Result:** A highly efficient allocation of office to those who "value" it most, but the loss of political equality and liberal neutrality. Legitimacy would collapse among those priced out of the market.

  **Scenario B: Auctions as Legitimacy Conferrers**
  *   **Assumption:** Economic goods are public trusts; the goal is fair authorization rather than efficient allocation.
  *   **Changes:**
      1.  **Ban on Bidding:** Bids would be forbidden as "manipulable" expressions of intensity. Allocation might be done by lottery or rotation to ensure fairness.
      2.  **One Person, One License:** Spectrum rights would be distributed equally among citizens, regardless of their capacity to use them efficiently.
      3.  **No Transfers:** Resale of the rights would be forbidden to prevent "vote buying" in the market.
      4.  **Result:** Massive allocative inefficiency. Goods would not go to those who can generate the most value from them. The "legitimacy" of the allocation would be high (everyone had a chance), but the economic surplus would vanish.

  ### Conclusion

  The split presupposes that **human beings inhabit two modes**: as *consumers*, whose desires are private and tradable, and as *citizens*, whose judgments are public and inalienable. It strictly requires that we prioritize **non-dictatorship and unrestricted domain** in politics (accepting manipulability as the cost) and **efficiency and truth-revelation** in economics (engineering manipulability away). It rules out the colonization of the political sphere by market logic and the hampering of the market by political logic. The system is philosophically stable only as long as we accept that the "price" of a vote is zero, and the "value" of a bid is everything.
