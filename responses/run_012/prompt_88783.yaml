answer: |-
  ### Part I: Systematic Translation of Source Criticism

  Here is the translation of the six main moves of historical source criticism into the vocabulary of the law of evidence, structured by strand.

  #### 1. Genuineness and Date of a Document
  *   **Legal Counterpart:** **Authenticity and the Best Evidence Rule.**
      Before a document can be admitted, you must prove it is what it purports to be (e.g., the actual contract, not a draft) and account for the original. Carbon dating or paleography in history functions like handwriting analysis or metadata forensics in law.
  *   **The Stretch:**
      In law, authenticity is a binary threshold for admissibility. In history, "genuineness" is often a spectrum of transmission. A medieval copy of a Roman text is not "inadmissible"; it is admitted but weighted differently than an autograph. The lawyer asks, "Is this the document?" The historian asks, "At what remove does this document stand from the event, and how did the copying process alter it?"
  *   **Capability Differential:**
      **You:** You can compel the production of the original or metadata from a specific custodian.
      **Historian:** They cannot compel the past to yield the original. They must work with the surviving copy, treating the transmission errors themselves as evidence of the intervening culture.

  #### 2. Interest and Position of the Author
  *   **Legal Counterpart:** **Credibility, Bias, and Hearsay Exceptions (e.g., Declarations Against Interest).**
      You assess whether a witness has a motive to fabricate. If a statement is against the maker's interest, it carries more weight. You cross-examine to expose bias.
  *   **The Stretch:**
      Legal bias is usually transactional (a grudge, a financial stake in the *outcome of the trial*). Historical bias is structural (class, gender, ideology, patronage). A historian does not discard a source because the author was a court propagandist; they use the propaganda to reconstruct the regime's self-image. In law, bias diminishes weight; in history, bias *is* the data.
  *   **Capability Differential:**
      **You:** You can put the author on the stand and punish them for perjury.
      **Historian:** They cannot question the author. They must triangulate the author's position by comparing their text with others, inferring the "position" rather than eliciting it.

  #### 3. Corroboration and Independent Attestation
  *   **Legal Counterpart:** **Corroboration Warnings and Cumulative Evidence.**
      You look for independent sources to bolster a contested fact. Multiple witnesses increase probative value.
  *   **The Stretch:**
      In law, corroboration is about reaching a threshold of certainty for a verdict. In history, independent attestation is often impossible; the "universe" of sources is too small. Historians often rely on "coherence" rather than strict independence. If two historians describe a battle, they may share a lost common source. In law, this would be hearsay (multiple hearsay); in history, it is a stemma (family tree of texts) to be untangled, not excluded.
  *   **Capability Differential:**
      **You:** You need enough corroboration to satisfy the burden of proof and stop the inquiry.
      **Historian:** They never stop the inquiry. Corroboration shifts the probability curve but never triggers a binary "proven" status.

  #### 4. The Force of Silence
  *   **Legal Counterpart:** **Adverse Inferences from Non-Production or Silence.**
      If a party fails to produce a document they control, or fails to answer a question, you invite the tribunal to infer the evidence would have been unfavorable.
  *   **The Stretch:**
      Legal silence presumes a duty to speak and the *existence* of the evidence. Historical silence is often the result of entropy, illiteracy, or systemic exclusion (e.g., the voices of the enslaved). The historian cannot assume the missing document *existed* and was suppressed; it may never have been created.
  *   **Capability Differential:**
      **You:** You can sanction the party for the silence.
      **Historian:** They cannot sanction the dead. They must distinguish between "accidental silence" (loss) and "structural silence" (never recorded), which is an interpretive act, not an evidential ruling.

  #### 5. Forgery and Interpolation
  *   **Legal Counterpart:** **Fraud on the Court and Spoliation.**
      If a document is forged, it is excluded and may lead to case dismissal or sanctions. Interpolation (alteration) destroys the integrity of the evidence.
  *   **The Stretch:**
      In law, a forgery is toxic; it contaminates the case. In history, a forgery is merely a source from a later date. A medieval forgery of a Roman charter is not "useless"; it is excellent evidence of medieval political claims. The historian re-dates the document rather than excluding it.
  *   **Capability Differential:**
      **You:** You exclude the evidence to protect the integrity of the verdict.
      **Historian:** They re-contextualize the evidence to protect the integrity of the narrative. They can use the lie to tell the truth about the liar.

  #### 6. Selectivity of What Survives
  *   **Legal Counterpart:** **The Duty of Disclosure and the "Complete Picture" Rule.**
      You operate under the assumption that disclosure should be complete. If a file is redacted or partial, you seek an order for full production.
  *   **The Stretch:**
      Your system assumes the "universe of documents" is finite and recoverable. The historian assumes the "universe of documents" is mostly lost. The archive is not a random sample; it is a curated survival shaped by power, climate, and chance. You argue from the gap in a specific file; the historian argues from the gap in the entire historical record.
  *   **Capability Differential:**
      **You:** You can demand the missing pieces be found.
      **Historian:** They must acknowledge that the archive itself is a primary source, reflecting what later generations deemed worth keeping.

  ***

  ### Part II: The Residue Report

  This section addresses the elements of source criticism that have no counterpart in the law of evidence, and analyzes the two "false friends" you identified.

  #### 1. The Non-Translatables
  There are three elements of historical source criticism that your vocabulary cannot capture, not because history is vague, but because your system is designed for a different epistemic goal.

  *   **The Hermeneutic Circle:** In history, you understand the part (the document) by reference to the whole (the period), and the whole by reference to the part. In law, this is circular reasoning. You must establish the facts first, then apply the law. A historian cannot "establish the facts" without already assuming a model of the period. Your rules of evidence prohibit this kind of recursive validation; theirs requires it.
  *   **The Value of the False:** As noted in "Forgery," your system treats unreliability as a defect to be purged. History treats unreliability as a symptom to be diagnosed. A witness lying on the stand hurts your case. A historical source lying about a battle tells the historian about the mythology of the victors. Your system has no mechanism to assign *positive* probative value to a proven falsehood.
  *   **The Absence of a Burden of Proof:** You must reach a binary verdict (liable/not liable, guilty/not guilty). This forces a truncation of uncertainty. If the evidence is 51% one way, you must rule that way. History has no such truncation. A historian can conclude "we cannot know," or "it is probable but not certain," and leave it there. Your system forces a decision where the evidence may not support one; their system allows the uncertainty to remain the conclusion.

  #### 2. False Friend One: Authenticity vs. Truth (Admissibility vs. Weight)
  You asked whether the distinction between "is the source what it purports to be?" and "is what it says true?" maps onto "admissibility" and "weight."

  **It does not.**

  In your system, admissibility is heavily laden with policy rules that have nothing to do with truth (e.g., privilege, exclusion of settlement negotiations, hearsay exclusions based on the right to cross-examine). A document can be genuine (authentic) and admissible, but still contain lies. You rely on cross-examination and weight to sort the truth.

  In history, the distinction collapses. The "genuineness" of a source includes its *context of production*. If a chronicle claims a king won a battle he lost, the historian does not say, "This is genuine but the weight is low." They say, "This is a genuine expression of royal propaganda."

  **Why they come apart:**
  Your exclusionary rules are often procedural safeguards (policy). History has no procedure, only methodology. Therefore, the historian never "excludes" a source based on policy. They only adjust the *interpretive framework*.
  *   **Law:** "This hearsay is excluded because I cannot cross-examine the maker."
  *   **History:** "This hearsay is admitted because it shows what people *believed* was said."

  The false friend lies in assuming that "weight" in law performs the same function as "criticism" in history. Legal weight is about probability of a fact. Historical criticism is about the *genealogy* of the information. You ask, "Can I rely on this for my verdict?" They ask, "What does the existence of this text tell me about the society that produced it?"

  #### 3. False Friend Two: Selective Survival (Adverse Inference vs. Epistemic Predicament)
  You asked whether the historian's problem of the selectively surviving archive is expressible in the inferences you invite a tribunal to draw regarding non-production.

  **It is a different kind of epistemic predicament.**

  Your concept of adverse inference rests on three pillars:
  1.  The document *existed*.
  2.  The party *controlled* it.
  3.  The party *withheld* it to harm your case.

  The historian's problem of selective survival rests on:
  1.  The document *may or may not have existed*.
  2.  No one *controls* it now (entropy, war, decay).
  3.  The survival rate is skewed by *structural power* (e.g., only the victors write chronicles, only stone survives, only the wealthy keep letters).

  **Why it is not an adverse inference:**
  When you invite an adverse inference, you are arguing from a specific *act of suppression* by a litigant within the proceedings. It is a moral and legal sanction.
  When a historian argues from selective survival, they are arguing from *systemic bias over centuries*. There is no litigant to sanction.

  For example: If you have no letters from the poor in the 18th century, you cannot draw an adverse inference against "the 18th century." You must acknowledge an **epistemic boundary**. Your vocabulary assumes that with enough subpoenas, the truth is recoverable. The historian's vocabulary accepts that some truths are irrecoverable because the mechanism of recording them never existed.

  **The Residue:**
  Your system is designed to resolve disputes by constructing a *working truth* sufficient for a verdict. It assumes the past (the events of the case) is accessible if the rules are followed.
  Historical source criticism is designed to construct a *plausible narrative* while acknowledging that the past is fundamentally inaccessible.

  The element missing from your vocabulary is **the evidentiary value of the gap itself, absent a culpable party.** You can infer a gap is suspicious. A historian infers a gap is *constitutive* of the history. The silence of the archive is not just missing evidence; it is evidence of the power structures that determined what was worth saving. You treat the archive as a warehouse that has been raided; they treat the archive as a ruin that was never a complete building.

  ### Summary
  You can translate the *mechanics* of source criticism into evidence law (authenticity, bias, corroboration). You cannot translate the *epistemology*.

  Your system is **adversarial and truncating**: it filters evidence to reach a binary decision.
  Their system is **hermeneutic and cumulative**: it layers evidence to build a probabilistic model that remains open to revision.

  The "false friends" arise because you view evidence as tools to prove a fact, whereas historians view sources as artifacts that *are* the facts to be explained. When you see a forgery, you see a barrier to truth. When they see a forgery, they see a truth about the forger. When you see a gap in disclosure, you see a party hiding something. When they see a gap in the record, they see the limits of human memory and power.
