answer: |-
  # SEMINAR HANDOUT: The Reduction/Emergence Decision Tree
  **Premise:** *Physicalism is assumed.* There is a single physical substrate. The question is not *what exists*, but how higher-level descriptions ($H$) relate to lower-level descriptions ($L$).

  ```text
  START: Select a putative higher-level phenomenon (e.g., Temperature, Pain, Superconductivity).
  │
  ├─ Q1: HOW ARE LEVELS INDIVIDUATED?
  │  Is the boundary between H and L defined by objective scale/energy/composition, 
  │  or only by the usefulness of a vocabulary?
  │  │
  │  ├─ (A) Objective (Scale/Energy/Composition) ─────────────┐
  │  │                                                        │
  │  └─ (B) Pragmatic (Vocabulary/Utility) ──────────────► [Leaf 1: Explanatory Pluralism / 
  │     (Do H-terms pick out real patterns or just human interests?)          Autonomy of Special Sciences]
  │
  ├─ Q2: MAPPING (Given Objective Levels)
  │  Do instances of H map onto a UNIQUE physical kind in L, 
  │  or onto HETEROGENEOUS physical realizers (Multiple Realizability)?
  │  │
  │  ├─ (A) Unique (Type Identity) ───────────────────────────┐
  │  │                                                        │
  │  └─ (B) Heterogeneous ────────────────────────────────────┤
  │
  ├─ Q3: DERIVABILITY
  │  Can the laws/regularities of H be derived from the laws of L 
  │  (plus initial/boundary conditions)?
  │  │
  │  ├─ (A) Yes (Deductively derivable) ──────────────────────┤
  │  │   │                                                    │
  │  │   └─ (Requires Bridge Principles?)                     │
  │  │       ├─ Yes, and principles are derivable ──────────► [Leaf 2: Nagelian Reduction]
  │  │       └─ Yes, but principles are underivable ────────► [Leaf 3: Eliminativism (H is not real)]
  │  │
  │  └─ (B) No (Derivation Blocked) ──────────────────────────┤
  │
  ├─ Q4: NATURE OF BLOCKAGE (If Derivation Fails)
  │  Is the failure due to human computational limits (Epistemic), 
  │  or because H has causal powers not fixed by L (Ontological)?
  │  │
  │  ├─ (A) Epistemic (In principle derivable, in practice impossible) 
  │  │   └─► [Leaf 4: Weak Emergence / Non-Reductive Physicalism]
  │  │
  │  └─ (B) Ontological (New causal powers / Structural Independence)
  │      └─► [Leaf 5: Strong Emergence]
  │
  └─ Q5: THE RG/EFT TEST (Applies to Q3-Q4)
     Does the H-description remain stable/invariant while L-micro-details 
     vary radically (Universality at a fixed point)?
     │
     ├─ (A) Yes (Insensitivity to micro-details)
     │   └─► [Leaf 6: Effective Field Theory / Renormalization Group View]
     │       (Is this Reduction, Emergence, or a Third Thing? See Meta-Analysis)
     │
     └─ (B) No (H depends sensitively on specific L-constitution)
         └─► (Return to Q3/Q4)
  ```

  ### META-ANALYSIS FOR DISCUSSION

  **1. Inseparable Leaves (The "Lump" Problem)**
  *   **Leaf 4 (Weak Emergence) & Non-Reductive Physicalism:** The tree cannot strictly separate these. *Diagnosis:* Weak emergence describes the *epistemic* condition (derivability blocked by complexity); Non-reductive physicalism describes the *metaphysical* commitment (H is real but not reducible). They occupy the same logical node but differ in emphasis.
  *   **Leaf 1 (Pluralism) & Pragmatic Reduction:** If levels are only vocabularies (Q1-B), the distinction between "reducing" the vocabulary and "accepting pluralism" collapses into a choice of linguistic convenience.

  **2. Unoccupied / Diagnosed Branches**
  *   **Leaf 5 (Strong Emergence + Physicalism):** *Diagnosis: Incoherent.* If one accepts the Starting Premise (single physical substrate), claiming ontological blockage with novel causal powers violates causal closure/exclusion arguments. This branch is usually occupied only by those rejecting the Starting Premise (e.g., Dualists).
  *   **Unique + Underivable Bridge Principles (Leaf 3 variant):** *Diagnosis: Unattractive.* If H maps uniquely to L but cannot be derived even with bridge principles, H is arguably a "dangler" with no work to do. This is the classic target of Eliminativism.

  **3. The RG/EFT Leaf (Leaf 6)**
  *   **Placement:** This sits orthogonally to the Derivation node. It suggests derivation is possible *only* by ignoring micro-details (taking a limit).
  *   **Debate:** 
      *   *Reductionist:* It is derived from L, just via a limit process.
      *   *Emergentist:* The insensitivity proves H is autonomous from specific L-details.
      *   *Third Thing:* It is "Asymptotic Reduction"—a distinct relation where H is robust *because* L is irrelevant.

  ***
  *Instructions: Work through the tree with a specific case study (e.g., Phase Transitions or Mental States). Note where the case stalls or forces a choice between Q4-A and Q4-B.*
