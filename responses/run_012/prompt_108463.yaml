answer: |-
  ### Exam Question: Philosophy of the Social Sciences (Final)
  **Time Allowed:** 90 Minutes
  **Instructions:** Closed book. You are provided with the text of the "Institutional Entropy Law" below. Answer the question in essay format.

  **The Institutional Entropy Law:**
  *Take any society. Define its organisational complexity as the number of distinct, non-redundant rules it actually enforces. Then: (a) in any period in which the society receives no new knowledge from outside itself, its organisational complexity decreases; and (b) the rate of that decrease is an increasing function of the complexity itself.*

  **Question:**
  Karl Popper's *The Poverty of Historicism* is often summarized as the claim that "there are no laws of history." However, Popper himself distinguishes between unconditional laws of historical development, conditional laws, and trends. 

  Using Popper's specific argument regarding the growth of knowledge:
  1.  Determine whether the Institutional Entropy Law is the *kind* of law Popper's argument rules out, or if it falls into a category he permits.
  2.  Evaluate whether the boundary condition ("receives no new knowledge from outside itself") renders the law scientifically vacuous or unfalsifiable in a Popperian sense.

  ***

  ### Model Answer (Approx. 700 words)

  Popper's argument against historicism is frequently misunderstood as a blanket denial of sociological regularities. It is not. In *The Poverty of Historicism*, Popper argues that we cannot predict the future course of human history because that course is influenced by the growth of human knowledge, and we cannot predict the future growth of knowledge by rational or scientific methods. This argument specifically targets **unconditional laws of historical development**—laws that dictate the inevitable trajectory of society (e.g., "feudalism must be followed by capitalism") regardless of initial conditions. Popper does not deny the existence of **conditional laws** (if *X* initial conditions obtain, then *Y* occurs) or **trends** (observed singular statements of directionality).

  The Institutional Entropy Law is explicitly conditional. It does not claim society *will* simplify, but that it will simplify *if* it receives no new knowledge from outside. Structurally, this resembles a law from physics (e.g., entropy increases in an isolated system). Because it relies on a specific boundary condition rather than asserting an inevitable historical destiny, it technically escapes Popper's primary logical objection. Popper allows for conditional laws in the social sciences, provided they do not claim to predict the unique historical path of a society without specifying the conditions. Therefore, the Entropy Law is not "historicist" in the specific sense Popper attacks, because it does not claim to predict the future of knowledge, only the structural consequence of a *lack* of new knowledge.

  However, this structural validity conceals a deeper methodological problem regarding falsifiability. For a conditional law to be scientific, the condition must be testable. The boundary clause here—"receives no new knowledge from outside itself"—is epistemologically porous. In thermodynamics, an "isolated system" is an idealization, but we can operationally define energy exchange. In social systems, defining "new knowledge" and "outside itself" is fraught. If a society's complexity decreases, the proponent can claim the condition was met. If complexity remains stable or increases, the proponent can claim hidden knowledge infiltration occurred. 

  This creates a *ceteris paribus* shield that protects the law from refutation. For Popper, a theory is scientific only if it is falsifiable. If the boundary condition is adjusted post-hoc to explain away anomalies (e.g., "you thought they were isolated, but they actually knew about the wheel"), the law becomes a metaphysical research programme rather than an empirical law. The "growth of knowledge" argument returns here: because we cannot rigorously define or measure the total stock of knowledge or its transmission boundaries, we cannot definitively establish that the condition "no new knowledge" has been satisfied. 

  Furthermore, we must distinguish this from a trend. A trend is a singular statement about a specific historical period (e.g., "population rose in the 19th century"). Trends exist, but they are not laws; they depend on initial conditions and can change. If the Entropy Law is merely an observation that isolated societies *have tended* to simplify, it is a trend. To be a law, it must assert a universal necessity. The formulation attempts universality, but the unfalsifiable condition undermines it.

  In conclusion, the Institutional Entropy Law is not the unconditional historicist law Popper prohibits. It is a conditional hypothesis. However, it likely fails Popper's demarcation criterion of falsifiability. The boundary condition relies on epistemic states ("knowledge") that are difficult to operationalize independently of the outcome ("complexity"). Consequently, while it avoids the logical trap of predicting knowledge growth, it falls into the methodological trap of immunizing itself against counter-evidence. It is, at best, a useful heuristic trend, and at worst, a vacuous tautology disguised as thermodynamics.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. Accurate reconstruction of Popper's "Growth of Knowledge" argument.**
  *   **Criteria:** Candidate identifies that Popper's objection rests on the unpredictability of *knowledge growth*, not merely the complexity of social systems.
  *   **Typical Miss:** Recites "historicism is false" without explaining the specific logical link to the unpredictability of future knowledge.

  **2. Distinction between unconditional laws of development vs. conditional laws.**
  *   **Criteria:** Candidate explicitly states that Popper bans unconditional laws (destiny) but permits conditional laws (if *X*, then *Y*).
  *   **Typical Miss:** Claims Popper argues there can be *no* laws in the social sciences whatsoever.

  **3. Correct classification of the Institutional Entropy Law.**
  *   **Criteria:** Candidate identifies the Entropy Law as *conditional* and acknowledges it technically survives Popper's primary logical attack for that reason.
  *   **Typical Miss:** Dismisses the law immediately as "historicist" without analyzing its conditional structure.

  **4. Critique of the boundary condition ("no new knowledge").**
  *   **Criteria:** Candidate argues that the "isolated system" condition is epistemologically difficult to verify or define in social contexts compared to physical systems.
  *   **Typical Miss:** Treats the boundary condition as a trivial or easily satisfiable experimental constraint.

  **5. Evaluation of falsifiability vs. trend status.**
  *   **Criteria:** Candidate concludes that the law risks being unfalsifiable (immunized by the condition) or is merely a trend, failing Popper's demarcation criterion.
  *   **Typical Miss:** Confuses "trend" with "law" or fails to address whether the law can actually be tested/refuted.
