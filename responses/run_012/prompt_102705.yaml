      *   *Re-evaluation:* The prompt asks to distinguish experience vs judgment. The student says incentives make judgment track experience. This misses the point that judgment *is* the report, and we need to know if the *experience* changed. The student assumes incentives solve the "hard problem" of distinguishing experience from judgment. That's a significant theoretical gap.
