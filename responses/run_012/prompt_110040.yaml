answer: |-
  ### The Reflection Decision Tree

  **Root:** You accept that rational credences must satisfy the probability axioms (synchronic coherence). You are asked whether you must also align your current credence with your expected future credence.

  **Q1. Domain:** Does the principle apply to **preferences/values** or only **credences/beliefs**?
  *   *Preferences:* Go to **Q2**.
  *   *Credences:* Go to **Q3**.

  **Q2. Preference Stability:** Do you expect your future preferences to shift in a way you currently regard as **corrupt or mistaken** (e.g., addiction, weakness of will)?
  *   *Yes:* **The Sophisticated Chooser**. You reject deference to the future self to protect current values.
  *   *No:* **Standard Preference Reflection**. (See *Unoccupied Combinations*).

  **Q3. Epistemic Access:** Can you currently model and evaluate the **rational quality** of the future standpoint (e.g., is it a standard evidence update, or a transformative experience like becoming a parent)?
  *   *No (Transformative):* **The Transformative Exception**. You cannot defer because the future utility/credence space is currently inaccessible.
  *   *Yes:* Go to **Q4**.

  **Q4. Future Reliability:** Do you expect your future self to be **epistemically compromised** (e.g., manipulation, intoxication, or misleading evidence you currently recognize as misleading)?
  *   *Yes:* **Rational Self-Doubt**. You knowingly violate Reflection because the future credence is not trustworthy evidence.
  *   *No:* Go to **Q5**.

  **Q5. Grounding:** Is Reflection a **sui generis coherence constraint** (like probability axioms) or a consequence of **updating rules/evidence**?
  *   *Coherence Constraint:* Go to **Q6**.
  *   *Updating/Evidence:* Go to **Q7**.

  **Q6. Diachronic Vulnerability:** Do you accept that vulnerability to a **Diachronic Dutch Book** (a guaranteed loss across time) constitutes irrationality, even if each time-slice acts rationally?
  *   *Yes:* **Van Fraassen's Coherence Requirement**. Reflection is a binding norm of rationality.
  *   *No:* **Synchronic Only**. Reflection is not a binding norm; only momentary coherence matters.

  **Q7. Derivation:** Is Reflection a distinct principle where the future credence is **itself evidence**, or merely a mathematical consequence of **Conditionalization**?
  *   *Distinct (Future Self as Evidence):* **The Evidential Treatment**.
  *   *Derivative (Math Consequence):* **Conditionalization Consequence**.

  ***

  ### Leaf Analysis & Accuracy Status

  1.  **Van Fraassen's Coherence Requirement:** Reflection is a logical norm. Violating it makes you vulnerable to a Dutch Book.
      *   *Accuracy-First Status:* **Contradicts.** Accuracy-first epistemology (e.g., Pettigrew) often shows that minimizing expected inaccuracy permits violating Reflection if the future self is less accurate.
  2.  **Conditionalization Consequence:** Reflection holds only because you plan to Conditionalize. It is not a standalone norm.
      *   *Accuracy-First Status:* **Vindicates (Conditionally).** If Conditionalization is accuracy-optimal, Reflection follows, provided the partition of evidence is known.
  3.  **The Evidential Treatment:** Your future credence summarizes evidence you haven't seen yet; deferring is Bayesian updating on that "testimony."
      *   *Accuracy-First Status:* **Vindicates.** Treating the future self as a reliable informant maximizes expected accuracy.
  4.  **The Sophisticated Chooser:** Applies to values. You bind yourself against future preference shifts you deem irrational.
      *   *Accuracy-First Status:* **N/A.** (Concerns utilities, not credences).
  5.  **Rational Self-Doubt:** You violate Reflection because you foresee the trap (manipulation/misleading evidence).
      *   *Accuracy-First Status:* **Vindicates.** Accuracy requires discounting unreliable sources, including future selves.
  6.  **The Transformative Exception:** You cannot defer because you cannot currently evaluate the future standpoint (L.A. Paul).
      *   *Accuracy-First Status:* **Undecided.** Accuracy cannot be calculated over unknown epistemic states.

  ***

  ### Structural Notes & Unoccupied Combinations

  **Indistinguishable Leaves:**
  *   **Conditionalization Consequence** vs. **Evidential Treatment:** Practically, these yield identical credences in standard cases. The distinction is metaphysical: is the future self *evidence* (Evidential) or just a result of a rule (Conditionalization)? Most formalisms treat them as extensionally equivalent.

  **Unoccupied Combinations:**
  *   **Coherence + Foreseeable Manipulation:** *Incoherent.* If you know you will be manipulated, you cannot claim a coherence constraint binds you to that future state without abandoning the goal of truth-seeking.
  *   **Transformative + Conditionalization:** *Incoherent.* You cannot Conditionalize on evidence you cannot currently model or assign a likelihood to.
  *   **Preferences + No Expected Shift:** *Unattractive/Trivial.* If you trust your future preferences completely, Reflection is tautological. This space is unexplored because it offers no decision-theoretic tension.
  *   **Accuracy-First + Van Fraassen Coherence:** *Theoretically Tense.* Few hold this combination. Accuracy-firsters usually reject Van Fraassen's Dutch Book argument as insufficient to override accuracy considerations.

  **Distinction Flags:**
  *   **Internal vs. Bridge:** Q5 separates these. Coherence (Internal) vs. Evidence/Updating (Bridge).
  *   **Foreseeability:** Q4 and Q6 separate the Dutch Book argument. If you foresee the trap (Q4), the Dutch Book loses its normative force (Q6).
  *   **Credences vs. Values:** Q1 separates the standard debate from the preference-change debate (Arntzenius/Briggs).
