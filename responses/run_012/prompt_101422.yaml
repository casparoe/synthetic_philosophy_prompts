  2.  **Deconstruct Glaucon's Challenge (Republic Book II):**
      *   It's not just "invisibility."
      *   It's the thought experiment of the *Perfectly Unjust Man* who has the *Reputation of Justice* vs. the *Perfectly Just Man* who has the *Reputation of Injustice*.
      *   The Unjust Man gets honors, offices, marriages, wealth (because people trust him).
      *   The Just Man gets scourged, tortured, impaled (because people distrust him), despite actually being good.
      *   The point: Everyone chooses the life of the Unjust Man with the Good Reputation because the *social rewards* are identical, but the *private gains* of injustice are added on top.
      *   *Key Mechanic needed:* Hidden action + Public Reputation + Resource Allocation based on Reputation.

