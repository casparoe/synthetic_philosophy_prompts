          4. Audit Phase: You can pay 1 point to audit someone. If they lied, they lose everything. If they told truth, *you* lose everything.
          5. Reward Phase: The class votes on who is "Most Virtuous" based on announcements and audits. Top 3 get Biscuits.
          *Critique:* Too game-theory heavy. Misses the "suffering of the just."

      *   *Back to "The Blind Endorsement" but refined for the "Suffering Just".*
          To make the Just suffer, they need to be *misperceived*.
          Let's use the **Corridor**.
          Select 3 volunteers to go out. They are the "Administrators."
          The 15 in the room are the "Citizens."
          Citizens do a task.
          Administrators return. They did *not* do the task. But they are told they can claim they did.
          The Citizens vote on who gets the reward (Biscuits).
          *Problem:* Citizens will vote for friends, not Administrators.
          *Solution:* The Administrators control the *vote counting*.
          *Better:* The Administrators write the "Report" of who did what.
          *Okay, let's settle on a design that requires no special roles, just asymmetric information.*

      *   **Final Design: "The Merit Ledger"**
          *   **Materials:** Index cards, pens, sticky notes (two colors), a "Leaderboard" on the whiteboard.
          *   **Currency:** "Seminar Capital" (points towards choosing the final topic).
          *   **Mechanic:**
              1.  **Work:** 10 mins. Solve a hard logic puzzle. (Actual Justice).
              2.  **Claim:** Write your score on a card. Hand to instructor. (Private Truth).
              3.  **Broadcast:** Write a score on the whiteboard next to your name. (Public Reputation). *Rule: You may adjust your score by +/- 5 points if you wish.* (Explicit permission to lie).
              4.  **Influence:** Each student gets 3 Red Sticky Notes (Accusations) and 3 Green Sticky Notes (Endorsements). Place them on the board next to names. *Rule: You must place at least 2 Red Notes.* (Forces the injustice).
              5.  **Calculation:** Final Score = Broadcast Score + Green - Red.
              6.  **Reward:** Top 5 Final Scores win the Seminar Capital.
              7.  **Reveal:** Instructor reads the Private Truth cards.
          *   **Why this hits Glaucon:**
              *   High Work + Low Influence = Loser (The Just Man with Bad Rep).
              *   Low Work + High Influence = Winner (The Unjust Man with Good Rep).
              *   Forced Red Notes ensure even good workers get tainted.
              *   Permission to lie on Broadcast ensures the Unjust can mask their nature.

      *   **Refining the "Forced Red Notes":**
          If I force nice students to accuse, they might accuse the "obvious liars."
          To make it Glauconian, the accusations need to be somewhat random or targeted at the quiet/serious ones.
          *Adjustment:* The Instructor plants 5 "Rumor Cards" on specific desks before class starts. These cards say "This student was seen cheating." The student must keep it secret or reveal it?
