          I need to ensure this doesn't feel like a cooperation experiment. It must feel like a *social judgment* experiment. The focus must be on *perception*, not *efficiency*.
          The reward must be purely status-based (Biscuits/Topic Choice), not points-based accumulation.

      *   **Timeline:**
