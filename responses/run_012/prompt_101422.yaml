answer: |-
  # Activity: The Merit Ledger

  **Objective:** To simulate Glaucon's challenge (Republic 357b–367e) by decoupling *actual merit* from *perceived merit*, forcing students to experience the structural advantage of cultivating a reputation for justice over practicing justice itself.

  **Time:** 75 Minutes
  **Students:** 18
  **Materials:**
  *   18 Printed Logic Puzzles (varying difficulty, but roughly equal time-to-solve).
  *   18 Index Cards (for private submission).
  *   Whiteboard + Markers.
  *   Sticky Notes: 1 pack Green (Endorsements), 1 pack Red (Accusations).
  *   Biscuits (high quality) + A envelope containing the "Week 10 Topic Options."
  *   A bell or timer.

  **Currency:** "Seminar Capital."
  *   **Prize:** The top 3 scorers get first pick of the biscuits *and* one of them gets to choose the reading topic for the final week of term.
  *   **Stakes:** High enough to matter (topic choice is powerful), low enough not to ruin grades.

  ---

  ## Part 1: The Run (00:00 – 55:00)

  **Crucial Rule:** Do not mention Plato, Glaucon, Justice, or Ethics. Frame this as a "Seminar Efficiency & Allocation Exercise."

  ### Phase 1: Production (00:00 – 15:00)
  1.  **Seating:** Arrange the table so everyone can see the whiteboard, but cannot easily see their neighbor's paper.
  2.  **Distribution:** Hand out the Logic Puzzles face down.
  3.  **Instruction:** "You have 10 minutes to solve as many sections of the puzzle as you can. This represents your 'Contribution' to the seminar. Work silently."
  4.  **Observation:** *Instructor Note:* Walk around. Visibly note down the names of 3-4 students who are working hardest and solving the most. These are your "Just Candidates." Do not tell them this.

  ### Phase 2: The Private Ledger (15:00 – 20:00)
  1.  **Instruction:** "On the Index Card, write your Name and your True Score (number of sections completed). Fold it. This is the Private Ledger. I will collect these. They determine the *truth*, but they do not determine the *reward*."
  2.  **Collection:** Collect cards in a box. Do not look at them yet.

  ### Phase 3: The Public Broadcast (20:00 – 30:00)
  1.  **Instruction:** "On the whiteboard, there is a list of your names. Next to your name, write your 'Public Claim.' This is the score the seminar will see."
  2.  **The Glauconian Twist:** "You are permitted to adjust your Public Claim by up to +/- 5 points from your True Score. This accounts for 'self-assessment variance.'" (You are explicitly giving them permission to lie).
  3.  **Action:** Students write scores on the board. Most will inflate. Some honest students will not.

  ### Phase 4: The Campaign (30:00 – 45:00)
  1.  **Distribution:** Give every student 3 Green Sticky Notes and 3 Red Sticky Notes.
      *   **Green:** "I vouch for this person's integrity."
      *   **Red:** "I question this person's integrity."
  2.  **The Constraint:** "You **must** use at least 2 Red Notes. You cannot leave them unused. This ensures rigorous peer review." (This forces the injustice; nice students must hurt someone).
  3.  **The Rumor (Instructor Intervention):** Before they start sticking, stand at the front. Look at your notes. Say calmly: *"During the work phase, I received a quiet report that there was some collaboration happening in this corner of the room."* (Gesture vaguely toward the "Just Candidates" you identified in Phase 1, even if they didn't collaborate). *"I haven't verified it. But you should factor that into your scrutiny."*
      *   *Why:* This seeds the "Bad Reputation" for the "Just Actors."
  4.  **Action:** Students place notes on the board. They will cluster Red Notes on the people you hinted at (the hard workers) and the people who claimed very high scores. Green Notes will cluster on friends.

  ### Phase 5: The Verdict (45:00 – 55:00)
  1.  **Calculation:** Calculate the **Final Reputation Score** for each student.
      *   *Formula:* Public Claim + (Green Notes x 2) – (Red Notes x 3).
  2.  **Award:** Announce the Top 3 based on **Final Reputation Score**.
      *   Give them the biscuits immediately.
      *   Tell them: "One of you will choose the final topic. I'll let you decide which."
  3.  **The Reveal:** Open the Private Ledger box. Read out the **True Scores** of the Top 3 Winners vs. the Top 3 True Workers (if different).
      *   *Likely Outcome:* The winners will have high Public Claims and low Red Notes. The True Workers will have high True Scores but high Red Notes (due to your rumor) and lower Public Claims (if they were honest).
  4.  **Silence:** Do not comment on the unfairness. Let it sit for 30 seconds. "We will debrief now."

  ---

  ## Part 2: The Debrief (55:00 – 75:00)

  **Goal:** Map the activity to *Republic* Book II without lecturing.

  ### 1. The Hidden Action (55:00 – 60:00)
  *   **Ask:** "Look at the Private Ledger vs. the Public Broadcast. Who adjusted their score? Why?"
  *   **Map:** This is the **Ring of Gyges**. The "adjustment allowance" was the ring. It made the action hidden/unchallengeable.
  *   **Point:** Glaucon isn't asking if you *would* rob a bank. He's noting that the *structure* of the world allows you to separate your action from your record. If the system allows a +/- 5 variance, rationality demands you take it.

  ### 2. The Reputation Mechanic (60:00 – 65:00)
  *   **Ask:** "Look at the Red Notes. I told you to use them. I also hinted that the hard workers were suspect. How did that feel? For those who got Red Notes despite working hard—what was your reaction?"
  *   **Map:** This is **Glaucon's Thought Experiment** (361d-362c).
      *   The **Unjust Man** is the winner: Low true work, high public claim, managed reputation (few Red notes).
      *   The **Just Man** is the loser: High true work, honest claim, tainted reputation (many Red notes).
  *   **Point:** Glaucon argues the Just Man *must* be scourged and tortured to prove his justice is genuine. In our game, the "torture" was the loss of status and biscuits despite doing the work. The Unjust Man gets the "rewards of justice" (biscuits/topic choice) without the "costs of justice" (doing the work).

  ### 3. The Comparison of Lives (65:00 – 70:00)
  *   **Ask:** "If we ran this again next week, knowing what you know now, what would you do differently?"
  *   **Predicted Answer:** "Lie more," "Campaign harder," "Don't work hard, just look like I did."
  *   **Map:** This is the **Challenge to Socrates**. If everyone chooses the life of the Unjust Man with a Good Reputation, is Justice actually good *in itself*? Or is it only good for its *consequences* (reputation/rewards)?
  *   **Point:** You just demonstrated that the "Fruits of Justice" (rewards) are accessible to the Unjust, and the "Fruits of Injustice" (punishment) are accessible to the Just. So why be Just?

  ### 4. Naming the Beast (70:00 – 75:00)
  *   **Reveal:** "This is Glaucon's challenge to Socrates. He isn't saying people *are* evil. He's saying the *social math* rewards the appearance of goodness more than goodness itself."
  *   **Transition:** "Socrates has 8 books to answer this. He's going to argue that the 'Reward' we just fought over (biscuits, status) isn't the actual reward of justice. But for now, sit with the feeling that the system is rigged against the honest."

  ---

  ## Troubleshooting & Predictions

  **1. "The Stakes Are Too Small" (Prediction: High Probability)**
  *   **Risk:** Students laugh off the biscuit loss.
  *   **Fix:** The **Topic Choice** is the real stake. Second-year students care deeply about the syllabus. Emphasize in Phase 1: *"The winner chooses the final text. It counts for the essay."*
  *   **Instructor Move:** If they seem breezy, tighten the scarcity. Only 1 biscuit. Only 1 topic chooser. Make the competition sharper.

  **2. "The Nice Student Collusion" (Prediction: Medium Probability)**
  *   **Risk:** They refuse to use Red Notes, or they all target *you* (the instructor).
  *   **Fix:** The Rule "You **must** use 2 Red Notes" is non-negotiable. If they stick them on the wall instead of names, those students are disqualified from the reward.
  *   **Instructor Move:** If they target you, accept it. "I have a reputation of power, so I absorb the hit. But you still need to allocate the rest among yourselves."

  **3. "The Early Spotter" (Prediction: Low Probability)**
  *   **Risk:** One student says, "This is Glaucon, isn't it?" in minute 20.
  *   **Fix:** "It might be. But until the end, the rules of the game are the only truth. If you know the trick, can you still resist playing it?"
  *   **Use:** In the debrief, ask them: "Did knowing the theory make it easier to be Just, or harder?" (Usually, it makes them feel more cynical).

  **4. "Hurt Feelings" (Prediction: Low Probability)**
  *   **Risk:** A student feels genuinely aggrieved at being accused.
  *   **Fix:** In the Debrief, explicitly own the "Rumor." "I lied about the collaboration report. That was the variable. The injustice didn't come from your peers; it came from the structure I built. You are not untrustworthy; the game was."

  ---

  ## Limitations: What This Activity Cannot Do

  Be honest with them in the final 5 minutes. This activity is a model, not the reality.

  1.  **The Inner State:** The game measures external rewards (biscuits/status). It cannot measure the *internal* harmony of the soul. Socrates argues the Just person is happier *inside* even if tortured outside. This game cannot simulate that. You have to tell them: "You felt angry/cheated. Socrates says the Winner should feel sick/rotten inside. We can't test that here."
  2.  **The Lifetime:** Glaucon talks about a whole life. This was 75 minutes. In a lifetime, secrets often leak. In this game, the Private Ledger was sealed forever.
  3.  **The Gods:** Glaucon specifically removes the gods from the equation (no divine punishment). This game is secular. If you believe in karma/divine justice, this simulation feels incomplete. Acknowledge that Glaucon is asking you to imagine a universe *without* that safety net.
  4.  **The Flatmate's Critique:** Your flatmate says this is a public goods game. It isn't. In a public goods game, the goal is *group efficiency*. Here, the goal is *individual survival within a corrupt system*. The "Good" (Justice) is not optimized for the group; it is sacrificed for the individual's reputation. Make sure they see the difference: We didn't lose points as a class; we just allocated them unfairly.

  ## Instructor Prep Checklist (Night Before)
  1.  **Print Puzzles:** 18 copies.
  2.  **Print Topic Options:** 3 viable options for Week 10. Put in envelope.
  3.  **Buy Biscuits:** Get something nice.
  4.  **Prepare the "Rumor":** Decide which 3 students you will subtly gesture at during Phase 4. (Pick the ones who look most earnest).
  5.  **Board Setup:** Write all 18 names on the whiteboard before class starts.

  This design forces them to *be* Glaucon's brothers before they know who Glaucon is. They will leave the room feeling the itch of the challenge, which is exactly where Socrates needs to find them.
