      *   **Step-by-Step:** Clear instructions.
      *   **The "Bite":** The Instructor Rumors targeting the high-workers.
      *   **Debrief:** Mapping the phases to Republic 360e-362c.
      *   **Limitations:** Honest assessment.

  5.  **Review against Constraints:**
