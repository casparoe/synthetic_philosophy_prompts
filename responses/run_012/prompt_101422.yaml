          *   Can't simulate divine punishment (Glaucon removes gods too).

  4.  **Drafting the Response:**
      *   **Title:** "The Merit Ledger."
      *   **Materials:** Index cards, sticky notes (red/green), whiteboard, logic puzzles (printed), biscuits.
