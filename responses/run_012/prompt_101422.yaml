      *   *Idea 1: Secret Sabotage.* Students build something. Some can sabotage. Others vote on who contributed most. *Risk:* Too obvious, turns into a "who lied" game.
      *   *Idea 2: The Trust Investment.* Students get points. They can invest in others. Returns are based on trust. *Risk:* Sounds like a public goods game (which the user explicitly wants to avoid).
      *   *Idea 3: The "Blind" Auction with Insider Info.* Students bid on "contracts." Some know the true value, some don't. *Risk:* Too complex for 75 mins.
      *   *Idea 4: The "Endorsement" Game.* Students perform a task. They can secretly help or hinder each other. Then they publicly endorse each other. Rewards are based on endorsements, not actual help. *Closer.*
      *   *Idea 5: The "Two-Stage Contribution" (Selected).*
          *   Phase 1: Private contribution (Hidden Action).
          *   Phase 2: Public signaling (Reputation Building).
          *   Phase 3: Distribution of rewards based on perceived virtue (Reputation).
          *   *Twist:* Allow students to send anonymous notes or make public statements that decouple their actual action from their perceived action.

      *   *Refining Idea 5 for the "Reputation" Bite:*
          To hit Glaucon's specific point, the "Just" student needs to be punished for looking "Unjust," and the "Unjust" student needs to be rewarded for looking "Just."
          Let's create a scenario where they allocate a limited resource (Biscuit Points) based on *peer assessment*, but the peer assessment is manipulatable via a "Campaign" phase, while the actual "Work" phase is hidden.

      *   *Revised Concept: "The Benefactor's Dilemma"*
          *   Students are "Applicants" for a grant.
          *   They submit private work (Hidden).
          *   They can send private messages to the "Committee" (The rest of the class) claiming merit or undermining others.
          *   The Class votes on who gets the grant.
          *   *Problem:* 18 students voting on 18 students is messy.
          *   *Better:* Divide into small groups? No, need the whole room dynamic for reputation.
          *   *Best:* A two-tier system. "Producers" and "Judges." But roles should be fluid or hidden.
          *   *Actually, let's look at the "Corridor" constraint.* The user mentioned a corridor. This suggests separation of information.

      *   *Winning Concept: "The Invisible Ledger"*
          *   **Setup:** 18 students.
          *   **Task:** Generate value for the group (e.g., solving a puzzle, answering ethics questions).
          *   **The Twist:** There are two ways to contribute.
              1.  **Actual Work:** Solving the puzzle (Private/Hidden).
              2.  **Signaling:** Writing a "Contribution Report" (Public).
          *   **The Glauconian Mechanic:** You can lie on the Report.
          *   **The Payoff:** The class votes on who contributed most. Top 3 get the Biscuit Points.
          *   **The Bite:** If everyone is nice, they vote for their friends. We need to force a scarcity of trust.
