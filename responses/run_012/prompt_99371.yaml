  ### 2. The Rules She Is Running
  Based on her calls, there are two main competing theories that fit her data so far. They diverge on your specific case.

  **Rule A: Phenomenal Monism (The "Feel" Theory)**
  *   **The Rule:** Pleasure is defined entirely by the intrinsic, positive quality of the conscious experience *while it is happening*. It does not matter if the experience is bodily (peach) or intellectual (crossword), rational (job) or irrational (scratch), or whether you value it in the long term.
