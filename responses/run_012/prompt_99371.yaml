  *   In the Job case: High Desire + Low Feel = Not Pleasure.
  *   In the Glow case: Low Desire + High Feel = **Pleasure.**

  If she believes Desire is not necessary for Pleasure (Job), then the *lack* of Desire (Glow) shouldn't disqualify the experience. Her annoyance at being asked what the peach and crossword have in common suggests she relies on an intuitive "you know it when you feel it" heuristic, which prioritizes the immediate qualitative feel over philosophical consistency about motivation. She is a hedonist about the *moment*, not the *life*.

  ### 4. The Next Case to Tell Them Apart
  To distinguish Rule A (Feel) from Rule B (Resonance/Mattering), you need a case where the **Feel is Positive** but the **Endorsement is Actively Negative** (not just indifferent).

  **The Case: "The Reluctant Tickles"**
  > "Imagine someone tickles you against your will. You laugh uncontrollably. The sensation is intense and physically 'bright,' similar to the crying-laughing joke. But in that moment, you are angry and embarrassed; you actively dislike the feeling while it is happening, even though your body is reacting with laughter. Is that pleasure?"

  *   **If she says Yes:** She is a strict **Phenomenalist** (Rule A). The intrinsic feel wins, even if the attitude is negative. (This strengthens the prediction that she'll accept your Glow).
  *   **If she says No:** She is an **Attitudinalist** (Rule B). You must *like* the feeling, not just *have* the feeling. (This opens the door for her to reject your Glow based on your indifference).

  ### 5. Is She Contradicting Herself?
  **No, but she is committing to a specific, difficult philosophical position.**

  She claims the peach and crossword are "totally different ways" but "obviously one thing." This is the classic **Heterogeneity Problem** for theories of pleasure.
  *   **The Contradiction Check:** She would only be contradicting herself if she claimed the common feature was *bodily sensation* (ruled out by Crossword) or *desire satisfaction* (ruled out by Job).
  *   **What Her List Reveals:** She is quietly committing to **Mental State Monism**. She believes there is a single, abstract property of "pleasantness" that can attach to bodily states (peach), relief states (headache), intellectual states (crossword), and even painful states (scratch).
  *   **The Tension:** Her annoyance suggests she feels the unity intuitively but cannot articulate the common feature without reducing it to something she's already rejected (like bodily sensation). She isn't contradicting herself logically, but she is defending a "queer" property—a single thing that exists across wildly different experiences without being reducible to any of them.

  **Summary:** Priya is a **Phenomenal Hedonist**. She cares about the *quality of the now*. Your glow has the right quality, so she will accept it, even if you don't care about keeping it. To shake her, you need to show her a "pleasant" feeling that the agent actively *dislikes* in the moment.
