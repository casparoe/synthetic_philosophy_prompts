  **Rule B: Agential Resonance (The "Mattering" Theory)**
  *   **The Rule:** Pleasure requires a positive feeling, *plus* a minimal level of endorsement or significance from the agent. The experience must "land" or register as something the self cares about, even if just in the moment.
  *   **Why it fits her list:** It explains the Dream rejection (the self "wasn't there for it"). It explains the Job rejection (the self didn't resonate with the outcome; it felt flat). It allows for the Scratch (the self endorses the relief in the moment, even if regretting it later).
