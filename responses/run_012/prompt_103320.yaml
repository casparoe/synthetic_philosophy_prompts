      *   *Missing:* They are conflating **Moral Worth of an Action** with **Moral Praise of an Agent**.
      *   Also, they might be missing **Consequentialist** value (the refugees got help, does that matter?). Both dismiss outcome as the source of *worth*, which is fair for *moral worth*, but worth noting.
      *   *Key Insight:* The concept of "Moral Worth" is doing too much work. We need to distinguish between:
          1.  Rightness of the act (Did he do the right thing? Yes.)
          2.  Praiseworthiness of the agent (Is he a good person? Mostly.)
          3.  Moral Worth of the specific action (Was it done purely from duty? Debatable.)

  5.  **Drafting the Response:**
