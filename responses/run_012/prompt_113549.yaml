answer: |-
  The rain did not fall so much as it hung in the air, a wet grey wool that soaked through linen and morale alike. The toll station was a single room of dark timber perched on the mountain pass, the empire's border rotting away somewhere below the mist. Inside, the clerk sat behind a counter scarred by ink and knife. He was young, his back straight, his eyes dry and focused on a scroll of bamboo slips.

  Lin stood outside the threshold, shivering. He held the lead rope of a white horse. The animal stamped, sending mud flying, its flank heaving. Lin had no silver. He had only the horse and the clothes on his back, and he needed to be on the other side of the pass before nightfall.

  "The toll," Lin said. His voice was rough from days of silence. "I have no coin. But I must pass."

  The clerk, Wei, did not look up. "You owe nothing."

  Lin blinked. "The sign says one horse, one tael. I have a horse."

  "You have a white horse," Wei said, finally lifting his gaze. There was no mockery in his face, only a terrible, serene clarity. "The law taxes horses. It does not tax white horses. A white horse is not a horse."

  Lin stepped into the shelter, dripping. "This is madness. It breathes like a horse. It sheds like a horse. If I asked you for a horse, would you not bring me this one?"

  "If you asked for a horse," Wei said, tapping the counter, "a brown horse would answer. A black horse would answer. If you ask for a white horse, the brown and black ones are excluded. The thing you are asking for changes. Therefore, the name 'horse' and the name 'white horse' pick out different things. If they are different things, a white horse cannot be a horse."

  "It's a thing with a head and four legs," Lin snapped, gripping the rope tighter. "You're playing with words while my blood cools."

  "I am protecting you from false naming," Wei said softly. "If I call this a horse, I ignore the whiteness. If I ignore the whiteness, I lie about what stands before me. To say 'is' is to say 'is identical to.' Is the white identical to the horse? No. One is color, one is shape. Color is not shape. So, white horse is not horse."

  Lin rubbed his face. "So if I paint a brown horse white, it becomes a non-horse?"

  "Then you have a white thing shaped like a horse. But the whiteness is not the horse. The whiteness is a command to the eye. The horse is a command to the form. They do not overlap." Wei reached under the counter and produced a seal stone, grey and unpolished. He set it on the wood. "Look at this. It is hard. It is white. Can you see the hardness?"

  "No. I feel it."

  "Can you feel the whiteness?"

  "No. I see it."

  "Then the hardness and the whiteness are separate. They hide from each other. When you look, the hardness hides. When you touch, the whiteness hides. How can they be one stone? How can 'white' and 'horse' be one beast?"

  Lin stared at the stone. The logic was a tight knot, smooth and impenetrable. "I don't care about the stone. I care about the road. If I walk through, will your superiors say I passed a horse?"

  "Superiors deal in shadows," Wei said. "I deal in names. You may pass. You owe nothing."

  The door creaked open. A gust of wind drove rain into the room, extinguishing the oil lamp. An old man stepped in, shaking a wet umbrella. He wore the faded robes of a retired magistrate. He knew Wei; everyone in the station knew the clerk who argued with the rain.

  "Wei," the old man said, wiping his face. "Still carving the world into pieces?"

  "Old Chen," Wei nodded. "I am keeping the names true. This man leads a white horse. I have exempted him from the horse toll."

  Chen laughed, a dry, rattling sound. He leaned against the wall, watching the steam rise from Lin's horse. "You think names carve reality? You think if you slice the word finely enough, the thing bleeds differently?"

  "I think if the name is wrong, the thing is lost," Wei said. "Hardness and whiteness are separate. White and horse are separate."

  Chen pushed off the wall and walked to the counter. He picked up the seal stone. "You say they hide from each other. I say you hide from them. You separate them because your mind cannot hold them together." He tossed the stone to Lin. Lin caught it. It was cold, heavy, white, and hard. All at once.

  "Is it one stone or two?" Chen asked.

  "It is one stone," Lin said.

  "It is a convenience," Chen told Wei. "You say 'white horse is not horse' to preserve the purity of the concept 'white' and the concept 'horse.' But the world does not care about purity. The world is mud. The world is one."

  "The world is chaos without distinctions," Wei countered. "If 'horse' includes 'white horse,' then 'horse' loses its shape. If everything is one, then the toll is the road, and the horse is the man, and we are all drowning in the same noise."

  "Exactly," Chen said. "So why charge the toll? Why stop the man? If distinctions are conveniences, then the toll is a convenience. The law is a convenience. You hold onto this logic like a raft, Wei, but you are standing on dry land."

  "I hold it because it is true," Wei said. His voice tightened. "If I say a white horse is a horse, I accept a contradiction. I accept that a specific is identical to a general. I will not live in a contradiction."

  "And I will not live in a cemetery of fragments," Chen said. He looked at Lin. "Walk, traveler. Whether it is a horse or a white non-horse, the rain doesn't care. The mountain doesn't care."

  Lin looked at the stone in his hand, then at the clerk. Wei sat perfectly still, his hands flat on the bamboo slips. He looked exhausted, not from labor, but from the effort of holding the world together with definitions.

  "If I go," Lin said, "and the next station says this is a horse?"

  "Then they are wrong," Wei said.

  "Or you are," Chen added.

  Lin put the stone down on the counter. It made a solid *clack*. Hard and white. Together. He turned the horse around. The animal sneezed, a very horse-like sound.

  "Come on," Lin whispered to the beast.

  He walked out into the rain. The mud sucked at his sandals. He did not look back to see if Wei watched him go, or if Chen poured himself a cup of tea. He only knew that the pass was ahead, and the white horse followed him, breathing steam into the cold air, neither a horse nor not a horse, but simply walking.
