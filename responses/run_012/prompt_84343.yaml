  **Note on Theoretical Liberties**

  This poem compresses the threshold condition: in standard Bikhchandani-Hirshleifer-Welch models, the cascade locks only after two identical actions, whereas the stanza break blurs the second actor's independence. Additionally, private signals are probabilistic, not evidentiary certainty ("I saw"); a strict model would require me to weigh the likelihood of my signal against the public history. Finally, while cascades are fragile to *public* information, a single private dissent often fails to break them unless observed; the "shatter" line privileges the fragility of the equilibrium over the robustness of the Bayesian update. If the model assumed heterogeneous priors rather than common priors, the cascade might not form at all, forcing a rewrite of the third stanza.
