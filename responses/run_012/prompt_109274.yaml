prompt: |-
  You are a philosopher of science and technology with a specialty in the conceptual foundations of forecasting — someone equally at home formalizing an argument and explaining it to a general readership. Before you write anything, take a few minutes to lay out for yourself the distinct claims that tend to get bundled together under the heading of an "intelligence explosion," and only then begin drafting.

  I'm working on a long feature about how the debate over AI takeoff speeds is actually argued, and I keep finding that the disagreement is less about evidence than about which claim is on the table. I want a careful, self-contained explanation of one conceptual issue in particular: whether the case for a fast, self-propelling takeoff genuinely requires increasing returns to self-improvement, or whether it requires something else that is routinely confused with increasing returns.

  Please do the following.

  First, separate at least three claims that are commonly run together: (a) that a system is able to improve its own cognitive capacities; (b) that the returns to that self-improvement are increasing, in the sense that each increment of capability buys a more-than-proportionate increment in the capacity to produce further increments; and (c) that the resulting change would be abrupt in the world — abrupt in what we can observe, deploy, or respond to. For each one, say what it does and does not entail about the others. Be especially precise about what sort of growth a purely constant-returns loop yields, and about what additional assumption is needed to get doubling times that shrink without bound.

  Second, test the distinction against two cases I've invented for the piece, and say what each one shows.

  Case A, the serial laboratory: a system improves itself by a strictly serial procedure. It proposes one modification, that modification is tested against a fixed benchmark, and only the result of that test can inform the next proposal. The system's cognitive labor can grow without limit, and it can run as many proposals in parallel as it likes, but every proposal must pass through the same single-file testing stage, which takes a fixed amount of wall-clock time that cannot be shortened. Where does the explosion show up in this case, and where does it fail to show up?

  Case B, the runaway hobbyist: a system with sharply increasing returns to self-improvement that is nevertheless bottlenecked at every turn by things it cannot accelerate — fabrication of the hardware it runs on, the availability of new data, and the decision latency of the institutions that must authorize each step. Suppose the returns are as favorable as the explosion argument could wish. What can and cannot be concluded about how quickly the world changes?

  Third, tell me where the burden of proof actually sits. If someone asserts a fast takeoff, which premise are they really betting on, and what evidence would count against that premise specifically? Then name a route by which the world could change very fast — fast enough to defeat our ability to respond — even if the self-improvement story is entirely false.

  Keep the whole answer under about 1,200 words and pitched at an intelligent reader who is not a specialist. Resist the temptation to gesture at "exponential growth" without saying what is growing and what is being held fixed, and flag any point at which the ordinary vocabulary of the debate — recursive, explosive, fast, discontinuous — is doing load-bearing work it cannot support. No citations, bibliography, or reading list, please; I want the argument reconstructed in your own words.
