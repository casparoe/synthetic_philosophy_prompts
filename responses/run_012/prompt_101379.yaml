      *   Specific voices? Yes.
      *   2-minute replies? (Will keep word count in check).
      *   Candid weakness notes? Yes.
      *   "Hope nobody asks"? Included.

  7.  **Final Polish:** Ensure tone is professional but prepared for a fight. (Self-Correction: Make sure the distinction between *elimination* and *revision* is clear in the replies, as that's the crux of the thesis).

      *(Self-Correction during drafting)*: Wait, the prompt says "Selective Eliminativism." I need to make sure I don't concede to reductionism in the replies. The reply must hold the line: "It's not one thing, it's many, so the singular term is misleading."

      *(Refining the Modeler Objection)*: The modeler will say "Reward Function = Desire." My reply must be "Reward Function is a parameter, Desire is a state. Conflating them hides the mechanism."

      *(Refining the Clinician Objection)*: The clinician will say "Patients feel desires." My reply must be "Folk psychology is useful but false, like 'sunrise'."

