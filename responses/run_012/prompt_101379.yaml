          *   Group B: Philosophers of Mind (Instrumentalists/Intentional Stance). They care about utility, not ontology.
          *   Group C: Clinical Researchers. They use belief/desire vocabulary for case formulation (pragmatic/therapeutic utility).
      *   **Deliverable:** Q&A Prep Sheet.
