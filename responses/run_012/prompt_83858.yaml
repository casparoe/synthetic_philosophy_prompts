answer: |-
  Right, four hours is a proper marathon; I'd say you've both earned a pint. Here is how those five objections stack up against a die-hard expected value (EV) maximiser, ranked by how much theoretical damage they ought to inflict.

  **1. Self-undermining — 9/10**
  This is the only argument that uses the fanatic's own weapon against them; if they assign any non-zero credence to the possibility that fanaticism is false, their own calculus demands they abandon it.

  **2. Undefined infinities — 7/10**
  This strikes at the mathematical coherence of the view, forcing them to adopt bounded utility functions which effectively neuter the 'googol of lives' scenarios they love.

  **3. Cluelessness — 5/10**
  While practically devastating, a theorist can simply retreat to subjective Bayesian credences, claiming that even a noisy estimate of a googol lives outweighs a certain fifty quid.

  **4. The 'Causal Route' fix — 3/10**
  This doesn't refute the theory so much as patch it, and admitting the need for such a constraint is a tacit concession that pure EV maximisation is broken without extra rules.

  **5. Paralysis — 2/10**
  A committed fanatic will dismiss this as a limitation of human cognition rather than moral theory, arguing that an ideal agent *would* simply calculate the correct option.

  ***

  **Which one I'd bet on**
  If I were putting money on it, I'd back **Self-undermining**. It is the hardest for a consistent rational agent to dodge without violating Cromwell's Rule (the principle that one should never assign a probability of exactly zero to anything). To escape it, your flatmate has to claim he is *certain* his moral theory is correct, which is an epistemically indefensible position for anyone claiming to be a rationalist.

  **On the 'Causal Route' fix**
  His 'original' fix is not a fifth option; it is **Cluelessness wearing a hat**. By insisting on a traceable causal mechanism, he is essentially saying that without such a route, our epistemic access is nil, and therefore the probability *should* be treated as zero. It is a heuristic designed to solve the Cluelessness and Pascal's Mugging problems, not a foundational objection to expected value theory itself. If he has to add extra rules to stop the maths from breaking, he has already admitted the pure theory doesn't work.
