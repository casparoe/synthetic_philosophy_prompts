          *   *Conditions:* No household twice in succession, unpaid service.
          *   *Arguments:* Elections favor the loud/ambitious; sortition treats every household's judgment equally (democratic ideal); rotation tracks membership better.
          *   *Concessions/Rebuttals:* Willing to weight by contribution (undermines equality principle); claims accountability is fiction at this scale (conscience over favor).
      *   **User's Concerns:** Sample size too small (11 units); stake mismatch (low stake deciding high cost issues); self-selection bias (who opts out?); conflict of interest (User is current Chair).
      *   **Request:** Don't just validate instincts. Dig into the *philosophical/practical core* of the argument. Determine who has the stronger case. Identify decisive vs. beside-the-point objections. If the friend is right, suggest design features. Address the impact of small size.

  2.  **Deconstruct the Core Argument:**
      *   **The Friend's Case (Sortition):** Rooted in *descriptive representation* and *deliberative democracy*. The idea is that a random sample *is* the community. It reduces factionalism and campaigning. It assumes competence is widely distributed.
      *   **The User's Case (Election/Representation):** Rooted in *accountability* and *stakeholder theory*. Those with more skin in the game should have more say (or at least, those making decisions should be accountable to those paying). It assumes competence/interest is *not* evenly distributed or willing to be served.
      *   **The Context:** 11 units. This is *tiny*. This is the critical variable.

  3.  **Evaluate the Arguments (Strengths & Weaknesses):**

      *   **Friend's Strength:** Elections in tiny groups *are* often personality contests. "The loudest win." Accountability in a group of 11 is social, not political (you can't really "fire" someone without destroying the neighborhood vibe).
      *   **Friend's Weakness:** The "Weighted Draw" concession kills the philosophical consistency. If money matters, why not vote? The "Opt-out" problem is fatal in a small pool. If 3 people always say "no," the random sample is broken.
      *   **User's Strength:** Stake alignment. The person paying 33% *should* have a safeguard. Competence/Continuity. A boiler needs managing; random people might not care to learn.
      *   **User's Weakness:** Status quo bias (I'm the Chair). Elections in 11-unit co-ops often mean "Whoever shows up to the meeting."

  4.  **Determine the "Decisive" Factors:**
      *   **Size (11 units):** This is the dealbreaker. Sortition works statistically with large populations (Athens, juries). With 11 units, a draw of 3 people is 27% of the population. Variance is huge. One bad actor ruins the board.
      *   **The "Weighted" Concession:** The friend admitted money matters. This suggests they know pure equality doesn't work for financial risk.
      *   **The "Opt-Out" Bias:** In a volunteer organization, random selection only works if service is mandatory. If people can decline, it's no longer random; it selects for the available/guilty, not the representative.
      *   **Accountability:** The friend says it's a fiction. In 11 units, *social* accountability is stronger than *electoral* accountability. You can't vote someone out, but you can shame them or refuse to cooperate. However, for financial decisions, social pressure is weak.

  5.  **Synthesize the Verdict:**
      *   The User's instincts are largely correct, primarily due to *scale* and *financial risk*.
      *   However, the Friend identifies a real pathology: elections in micro-communities are flawed.
      *   The "Decisive" objection is the **sample size/volatility** and the **mandatory vs. voluntary** nature of service.
      *   The "Beside the Point" objection is "Accountability via voting." In a co-op of 11, you don't vote people out; you talk to them.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the depth of the question. It's not just about a board seat; it's about democratic theory vs. fiduciary reality.
      *   *The Core Conflict:* Frame it as **Descriptive Representation (Friend)** vs. **Fiduciary Alignment (User)**.
      *   *The Scale Problem:* Emphasize the number 11. Sortition relies on the Law of Large Numbers. 11 is too small.
      *   *The "Weighted" Concession:* Point out this undermines the friend's moral argument. If money buys influence in the draw, why not in the vote?
      *   *The Volunteer Constraint:* Sortition requires compulsion (like jury duty). If people can opt out, it's self-selection.
      *   *The Accountability Myth:* Agree with the friend that elections aren't the main accountability tool here, but disagree that *no* accountability is needed.
      *   *Verdict:* User has the stronger case *for this specific context*, but Friend has identified real problems with the current system.
      *   *Compromise/Design Features:* If they *were* to try it (or a hybrid), what safeguards are needed? (Mandatory service, training, financial thresholds, recall mechanisms).
      *   *Self-Reflection:* Address the User's bias (being Chair).

  7.  **Refining the Tone:**
      *   Needs to be analytical, not taking sides emotionally, but rigorous.
      *   Respectful of the Friend's philosophical stance (it's a valid political theory, just wrong for this context).
      *   Direct about the User's conflict of interest.

  8.  **Final Polish (checking against prompts):**
