answer: |-
  This is a sophisticated dispute because it is not actually about a board seat; it is a collision between two distinct theories of governance. Your friend is arguing from the tradition of **sortition** (selection by lot), which prioritizes *descriptive representation* and the prevention of faction. You are arguing from the tradition of **fiduciary representation**, which prioritizes *stakeholder alignment* and *competence*.

  Both theories have merit, but they function under different constraints. To determine who holds the stronger case, we must separate the philosophical ideals from the mechanical realities of your specific situation.

  ### 1. The Core Argument: Equality vs. Alignment

  **Your Friend's Case:**
  The philosophical core of your friend's position is that in a cooperative, political equality (one household, one voice) is the supreme value. He argues that elections corrupt this by selecting for *ambition* rather than *judgment*. In a group of eleven, elections often devolve into popularity contests or default to the only person willing to do the work. His claim is that a random sample, rotated over time, prevents the formation of a permanent "governing class" within the co-op and ensures the board's decisions mirror the will of the whole membership because the board *is* a microcosm of the membership.

  **Your Case:**
  Your core argument is about risk and agency. A housing co-op is not a polis; it is a shared financial liability. Your position rests on the principle that decision-making power should correlate with responsibility and stake. If a decision goes wrong (e.g., the boiler fails, reserves are depleted), the consequences are financial. Therefore, those making decisions must be accountable to those bearing the cost.

  **The Verdict on Principles:**
  Theoretically, your friend is right that elections in micro-communities are flawed. They often select the most dogmatic, not the most prudent. However, you are right that a co-op is fundamentally a financial contract, not a political democracy. The "one person, one vote" ideal breaks down when financial contributions vary by 300% (as with the three-unit owner).

  ### 2. The Decisive Objections

  Three objections determine the outcome of this debate. Two are decisive against your friend; one is decisive against you.

  **A. The Scale Problem (Decisive against Friend)**
  Sortition relies on the Law of Large Numbers. In ancient Athens, juries were hundreds of people. In modern polling, a sample of 1,000 represents a nation. In your co-op, a board of three drawn from eleven households represents 27% of the population.
  *   **The Risk:** In a pool of eleven, variance is massive. You could easily draw three households that are financially precarious, chronically absent, or fundamentally opposed to maintenance spending. In a large population, outliers cancel each other out. In a pool of eleven, outliers *become* the policy.
  *   **Conclusion:** Eleven is too small for statistics to protect you. The "representative" claim fails mathematically.

  **B. The Compulsion Problem (Decisive against Friend)**
  Sortition only works if service is mandatory (like jury duty). Your friend concedes service is unpaid and time-consuming.
  *   **The Risk:** If households can decline the draw, it is no longer random. It becomes a selection of those with the most free time, the least boundaries, or the most guilt. This creates the exact opposite of your friend's goal: the board will not represent the membership; it will represent the *available*.
  *   **Conclusion:** Unless the co-op bylaws make service mandatory (which is legally and socially difficult in a voluntary association), the "random" sample is inherently biased.

  **C. The "Weighted" Concession (Decisive against Friend)**
  Your friend's willingness to weight the draw by financial contribution is the admission that defeats his own argument.
  *   **The Risk:** If financial stake matters enough to alter the probability of selection, then the principle of "equal judgment" is abandoned. If the three-unit owner should be drawn more often because they pay more, why should they not simply have three votes in an election?
  *   **Conclusion:** This concession reveals that even your friend recognizes that *financial risk* must trump *political equality* in a co-op. Once he admits this, the argument reverts to your framework: how do we best align power with stake?

  **D. The Continuity Problem (Decisive against You)**
  You must acknowledge one weakness in your position. Elections in small co-ops often lead to stagnation. The same three people serve for ten years, institutional knowledge becomes hoarded, and resentment builds among the "governed." Your friend is correct that rotation forces engagement and prevents a clique from controlling the reserve fund.
  *   **Conclusion:** While elections are better than lots for this size, the current electoral system likely needs reform to prevent entrenchment.

  ### 3. Objections Beside the Point

  **"Accountability via Voting"**
  Your argument that elected members can be "turned out" is theoretically true but practically weak in an eleven-unit co-op. Removing a board member requires a confrontation that can poison neighborly relations for years. Your friend is right: at this scale, accountability is social, not electoral. You do not vote out a neighbor; you shame them or negotiate with them. Do not rely on the threat of removal as your primary safeguard; it is a nuclear option you will never use.

  **"Ambition vs. Judgment"**
  Your friend argues elections select the ambitious. This is true in national politics. In an eleven-unit co-op, elections usually select the *only person who raised their hand.* Do not assume elections are bringing in power-hungry tyrants; they are likely just bringing in the willing. Sortition would bring in the reluctant. Reluctant board members are often more dangerous than willing ones.

  ### 4. The Impact of Size

  The small size (11 units) changes everything.
  *   **In a large co-op (100+ units):** Sortition is viable because the sample size is robust, and professional management handles day-to-day operations.
  *   **In your co-op:** Every board decision is operational. You are not setting policy; you are deciding which plumber to call. This requires *competence* and *continuity*, not just representation. A random draw increases the likelihood of selecting someone incapable of reading a balance sheet or negotiating a contract. In a small group, the cost of one incompetent member is catastrophic.

  ### 5. Final Verdict

  **You hold the stronger case.**
  Your friend's proposal is philosophically elegant but mechanically unsound for an organization of this size and financial nature. The combination of small sample size, voluntary participation, and unequal financial stakes makes sortition a high-risk strategy that could endanger the co-op's solvency.

  However, your friend has correctly diagnosed a disease: **governance fatigue and entrenchment.** If you simply defend the status quo because you are the Chair, you are failing the co-op.

  ### 6. Design Features (If you were to compromise)

  If you wish to incorporate your friend's spirit (rotation, broader engagement) without accepting the risks of sortition, you should insist on the following design features before agreeing to any governance changes:

  1.  **Mandatory Rotation with Elections:** Keep elections, but institute term limits. No one can serve more than two consecutive terms. This forces the rotation your friend wants without sacrificing the vetting process of an election.
  2.  **Weighted Voting (Fiduciary Safeguard):** If the three-unit owner is concerned about their risk, formalize it. Major capital expenditures (over $X) require a majority of *units* AND a majority of *budget share*. This addresses the financial stake without abandoning democracy.
  3.  **The "Shadow Board" or Committee System:** Instead of drawing lots for the board, create mandatory committees (e.g., Maintenance, Finance) where every household *must* serve on one committee per year. This achieves your friend's goal of universal participation and shared burden without putting critical fiduciary control in random hands.
  4.  **Recall Mechanism:** Since you admitted electoral accountability is weak, codify a recall process. If 50% of households sign a petition, a board member is automatically removed. This makes the "social accountability" your friend mentions legally binding.

  ### 7. A Note on Your Bias

  You admitted you are the Chair and would lose your seat. This requires rigorous self-scrutiny.
  *   **Ask yourself:** Are you defending elections because they are better, or because you enjoy the influence?
  *   **The Test:** If you were not Chair, would you still oppose sortition? Given the financial risks and the sample size, the answer should be yes.
  *   **The Compromise:** To prove you are not protecting your turf, offer to support the **Term Limits** and **Committee System** mentioned above. This shows you value the *health of the governance* over your *position within it*.

  **Summary:** Your friend is right about the pathology of small co-op politics (cliques, fatigue), but wrong about the cure. Sortition is a poison pill for a small financial entity. Reject the draw, but adopt the rotation.
