      4.  (2) vs (3) - Mostly consistent, minor tension.

      *Wait, is (3) vs (5) worse than (1) vs (4)?*
      If (1) fails, creativity can't be recognized. If (5) fails, creativity can't be *valued*. The user cares about "Creative Achievement" (5). So (4) vs (5) is definitely #1.
      (1) vs (4) undermines the mechanism.
      (3) vs (5) undermines the nature of the space.
      Okay, the ranking holds.

