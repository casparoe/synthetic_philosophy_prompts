      *   **Section 3: What does it have to explain away?**
          *   *The Fermi Paradox:* Why don't we see the beacons? (Answer: Rare/Short-lived).
          *   *The Trust Problem:* Why would a predator believe the signal? (Answer: Costly signaling theory).
          *   *The Evolution Problem:* Why would a civilization choose self-lobotomization over expansion? (Answer: Survival > Growth).

      *   **Section 4: Defender's Concessions**
