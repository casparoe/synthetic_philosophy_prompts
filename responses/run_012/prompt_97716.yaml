  7.  (Final Polish): Ensure the distinction between "Standard DFH" (Liu Cixin) and "Beacon DFH" is clear. Standard DFH says *don't signal*. Beacon DFH says *signal, but only to say I won't move.*

  8.  *Wait, one more thing:* The user asked "What would have to be true for this to be false?" I need to make sure I answer that specifically. It's not just "what evidence," but "what underlying reality." E.g., If verification is impossible, the theory is false.

