answer: |-
  This is one of the sharpest questions in legal philosophy. You have identified the exact fault line where jurisprudence cracks open under political pressure. To analyze Nuremberg and Tokyo properly, we have to step out of history and into the debate between **Legal Positivism** (law is what the sovereign writes) and **Natural Law** (law is derived from universal moral principles).

  The Tribunal could not function as a court if it stayed strictly within Positivism, because the defendants were right: there was no positive international statute criminalizing "aggressive war" in 1939. To convict them, the Tribunal had to smuggle in Natural Law. But to acquit the Allies of similar conduct, it had to retreat back into Positivism or political discretion.

  Here is the breakdown of the philosophical architecture, separated into what was necessary, what was contingent, and what was cynical, followed by the analysis of individual autonomy.

  ### 1. What the Tribunal *Genuinely Had to Presuppose*
  For the IMT (International Military Tribunal) to claim it was a *court* and not a *lynching*, it had to assume three specific philosophical propositions. If you remove these, the legal reasoning collapses entirely.

  **A. The Rejection of Strict Legal Positivism**
  The defense argued *nullum crimen, nulla poena sine lege* (no crime, no punishment without law). This is a Positivist argument: law is a command issued by a sovereign; if no sovereign commanded it, it isn't law.
  *   **The Presupposition:** The Tribunal had to assume that **law exists independently of legislation.** It presupposed a "higher law" or *jus cogens* norms where certain acts (waging aggressive war, extermination) are *malum in se* (wrong in themselves), not just *malum prohibitum* (wrong because prohibited).
  *   **Why it's necessary:** Without this, the "ex post facto" objection is a knockout blow. The Tribunal explicitly argued that the Kellogg-Briand Pact (1928) rendered aggressive war illegal, even if it lacked criminal penalties. They assumed that the *wrongness* of the act created the criminality, not the statute.

  **B. The Hierarchy of Wrongs (*Jus ad Bellum* over *Jus in Bello*)**
  You asked how they could square aggressive war being criminal while area bombing was not. The Tribunal relied on a specific hierarchy of moral injury.
  *   **The Presupposition:** **Aggression is the "Supreme Crime."** Justice Robert Jackson's opening argument framed aggressive war as the container that holds all other evils.
  *   **Why it's necessary:** This allows for a distinction between the Axis and the Allies. If the Axis started an illegal war (*Jus ad Bellum* violation), their entire military enterprise was criminal. The Allies, fighting a defensive war, had a legal basis for using force. Therefore, Allied bombing, however horrific, occurred within a *legal* context of war, whereas German aggression occurred outside the law entirely. This distinction is the only philosophical shield against the "you did it too" charge regarding bombing.

  **C. The State is a Fiction; Only Individuals Act**
  To convict leaders, the Tribunal had to pierce the veil of sovereignty.
  *   **The Presupposition:** **International law binds human beings, not just abstract states.**
  *   **Why it's necessary:** If the State is the only legal person, then "Act of State" is a perfect defense. The Tribunal had to assume that the State is merely an instrument, and when that instrument is used for criminal ends, the hands guiding it are personally liable.

  ### 2. What the Tribunal *Could Have Dropped*
  These are features of the trials that were historically present but not philosophically required for the core project of international criminal justice to work.

  **A. The Ad Hoc Military Tribunal Structure**
  The fact that these were military tribunals run by the victors was a contingency of 1945, not a requirement of the philosophy.
  *   **Why it's droppable:** A permanent, neutral international court (like the modern ICC, flawed as it is) could theoretically adjudicate the same principles without the "victor's justice" taint. The philosophy of individual responsibility doesn't require the judges to be generals from the opposing army.

  **B. The Specific Charge of "Conspiracy"**
  The Anglo-American legal concept of "conspiracy" was stretched to its breaking point at Nuremberg to catch industrialists and planners who hadn't directly killed anyone.
  *   **Why it's droppable:** You can maintain individual responsibility for aggression without using the specific legal mechanism of conspiracy. Continental legal systems manage complicity differently. This was a procedural tool, not a philosophical pillar.

  **C. The Exclusion of Allied Crimes from the Indictment**
  While politically difficult, a truly consistent Natural Law tribunal *could* have indicted Allied commanders for area bombing if they believed it violated the principles of distinction and proportionality.
  *   **Why it's droppable:** Dropping this wouldn't have invalidated the conviction of the Nazis. In fact, philosophically, adjudicating Allied crimes would have *strengthened* the claim that the Tribunal was applying universal law rather than victor's vengeance. The failure to do so was a choice, not a logical necessity.

  ### 3. What is Best Explained by Cynicism ("Victor's Justice")
  This is where the philosophy breaks down and raw power takes over. There are two moments where the Tribunal's reasoning cannot be squared with its own presuppositions.

  **A. The *Tu Quoque* (You Did It Too) Defense in the Doenitz Case**
  This is the philosophical scandal you identified. Admiral Doenitz was accused of unrestricted submarine warfare. The evidence showed the British Admiralty had done the same. The Tribunal ruled: *"Doenitz is not assessed punishment for his conduct of submarine warfare because of the similar conduct of the Allies."*
  *   **The Cynicism:** This is logically incompatible with the Natural Law presupposition in Section 1. If unrestricted submarine warfare is a crime against humanity or a war crime (*malum in se*), then the British committing it does not make it *less* of a crime; it just makes the British criminals too.
  *   **The Implication:** By using *tu quoque* to mitigate punishment, the Tribunal admitted it was not judging **Right vs. Wrong**, but **Winner vs. Loser**. It turned the law into a comparative scorecard of behavior rather than an objective standard. This suggests that for conduct crimes (*Jus in Bello*), the Tribunal was operating on Positivist/Political grounds (no one will punish us, so it's not effectively illegal), while for aggression (*Jus ad Bellum*), they operated on Natural Law grounds. That inconsistency is the "cynical" core.

  **B. The Selective Definition of "Aggression"**
  The Tribunal defined aggression in a way that perfectly captured German and Japanese expansionism while immunizing Soviet actions (like the invasion of Poland in 1939 or Finland in 1939).
  *   **The Cynicism:** Since the USSR was a prosecuting power, the definition of "Crime Against Peace" was politically negotiated to exclude Soviet conduct. This undermines the claim that "Aggression" is a universal legal category. It reveals the category as a political weapon tailored to the defendants in the dock.

  ### 4. Individual Responsibility: Autonomy and Practical Reason
  You asked what rejecting the "Superior Orders" and "Head of State" defenses presupposes about the human agent. This is perhaps the most enduring philosophical legacy of Nuremberg.

  **A. The Rejection of "Bureaucratic Alienation"**
  The "Superior Orders" defense relies on a specific picture of practical reason: that the subordinate is a tool, and moral agency resides solely with the commander. It treats the military hierarchy as a single moral mind.
  *   **The Nuremberg Presupposition:** The Tribunal rejected this. It assumed **moral agency is non-transferable.** You cannot outsource your conscience to a superior.
  *   **Philosophical Picture:** This aligns closely with **Kantian Autonomy**. For Kant, a moral agent acts according to a law they give themselves (the Categorical Imperative). Obeying an immoral order is a failure of autonomy—a surrender of one's rational capacity to judge right from wrong. The Tribunal assumed that even in a totalitarian hierarchy, the individual retains the capacity to recognize "manifest illegality."

  **B. The "Manifest Illegality" Test**
  The judgment implied that there is a threshold where an order is so obviously wrong that no reasonable person could believe it lawful.
  *   **Presupposition:** This assumes a **universal moral intuition.** It presupposes that moral knowledge is accessible to ordinary people regardless of culture, training, or indoctrination. It rejects moral relativism. If morality were purely cultural or constructed by the State, a German soldier in 1943 could not be expected to know that exterminating Jews was wrong, because his State told him it was right.
  *   **The Tension:** This is a heavy lift. It assumes that the "voice of conscience" is louder than the threat of execution by one's own regime. The Tribunal essentially ruled that **moral duty trumps self-preservation.** That is a demanding ethical standard, arguably supererogatory (beyond duty), but they codified it as a legal requirement.

  **C. Head of State Immunity**
  Rejecting sovereign immunity presupposes that **power does not generate morality.**
  *   **Philosophical Picture:** This is a rejection of Hobbesian sovereignty. For Hobbes, the Sovereign is the source of law and cannot be unjust. Nuremberg asserts that there is a law *above* the Sovereign. This requires a picture of the Head of State not as the *source* of law, but as a *trustee* of the people and international order. When they violate that trust, they revert to the status of a private criminal.

  ### Summary of the Philosophical Position

  The Nuremberg and Tokyo trials were a **hybrid jurisprudential monster.**

  1.  **To convict for Aggression:** They had to be **Natural Lawyers** (appealing to universal wrongs beyond written statutes).
  2.  **To acquit the Allies on Bombing:** They had to be **Legal Positivists** (appealing to the lack of specific treaties banning area bombing at the time).
  3.  **To spare Doenitz:** They had to be **Realists** (admitting that law is enforced by power, and power determines impunity).
  4.  **To convict the Subordinates:** They had to be **Kantians** (insisting on individual moral autonomy against the state).

  **The Honest Way to Hold It:**
  Is there an honest way to say aggression is wrong *in itself* while area bombing is merely *not-yet-illegal*?
  Yes, but it requires accepting the *Jus ad Bellum* / *Jus in Bello* split.
  *   **Aggression** destroys the international legal order itself. It is a crime against the *system*.
  *   **Bombing** is a method within a conflict. In 1945, the laws of war (Hague 1907) were vague on aerial bombardment.
  *   **The Honest Argument:** "We are punishing you for breaking the game (Aggression), not just for playing rough (Bombing). We acknowledge the rules on bombing were unclear, so we will not prosecute that ambiguity retroactively. But the rule against starting wars of conquest was clear in principle (Kellogg-Briand), even if penalties weren't specified."

  **The Dishonest Part:**
  The dishonesty isn't in the distinction between Aggression and Bombing; it's in the **selective enforcement of the ambiguity.** If the law on bombing was unclear, it should have been unclear for *everyone*. The Tribunal used the ambiguity to shield the Allies while using the "spirit of the law" to convict the Axis.

  **Conclusion:**
  The Tribunal works philosophically only if you accept that **law is a teleological project.** It is not just a set of rules, but an attempt to build a moral order. Nuremberg was a "foundational myth" moment. It required a leap of faith: pretending the law already existed so that it could exist in the future. It sacrificed logical consistency (on the *tu quoque* and bombing issues) to achieve a political-moral breakthrough (individual accountability for state violence). It presupposes that **justice is sometimes more important than strict legality**, which is a dangerous but occasionally necessary philosophical gamble.
