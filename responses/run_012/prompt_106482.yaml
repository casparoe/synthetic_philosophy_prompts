  5.  **Final Polish:** Check tone. Ensure it respects the user's intelligence. Use clear headings. Ensure all parts of the prompt are answered. (The prompt asks for three specific separations + the individual responsibility analysis).

      *   *Structure Check:*
          1.  Intro (Positivism vs. Natural Law).
