answer: |-
  Your frozen-accident thesis is robust on technical implementation standards but vulnerable on institutional forms, and it remains scientific only if you concede that efficiency can sometimes overcome path dependence.

  Here is the ranking of exposures from fatal to merely awkward, based on what would force you to concede ground versus what a critic might press without delivering a knockout blow.

  **Fatal Exposures (You must concede)**
  1.  **Efficient Switching Against High Inertia:** If you find cases where a demonstrably superior standard displaces an incumbent *rapidly* across multiple independent regions despite high switching costs, the "deep well" metaphor breaks. The adoption of Arabic numerals in European science or the switch from analog to digital broadcasting suggests that when the efficiency gap is wide enough, history does not hold the line. If efficiency can drain the well, contingency is not the dominant force.
  2.  **Deep Structural Convergence Without Contact:** If isolated civilizations develop similar *institutional* structures (legal codes, property rights, bureaucratic hierarchies) not dictated by physical necessity, this implies an institutional attractor. If Japan and Europe independently developed "feudalism" with similar contractual obligations despite no contact, that is not a frozen accident; it is a convergence on a social technology that works.
  3.  **Cognitive Universals Limiting Variation:** If linguistic or legal structures are shown to be constrained by human cognition to a degree that leaves no room for variation (e.g., if all viable legal systems must share a specific logical structure), then contingency is limited to surface decoration. This moves the "accident" from the outcome to the initial conditions of human biology.

  **Awkward Exposures (Critics will press, but you can deflect)**
  1.  **Multiple Independent Invention:** Your innovation policy friend is pointing at the *problem*, not the *standard*. That calculus was invented twice suggests the mathematical landscape is an attractor; that we use Leibniz's notation over Newton's is the frozen accident. You concede the problem space is convergent but hold that the implementation standard is contingent. This is awkward but not fatal.
  2.  **Physical Constraints:** Critics will argue railway gauges converge because of physics, not history. You can deflect this by distinguishing between *functional* convergence (trains must run on rails) and *parametric* contingency (the gauge width is 1435mm). As long as you restrict your claim to the parameters, physical constraints are not counter-evidence.
  3.  **Convergent Evolution (Biology):** Your biologist friend's camera eye is a functional solution to a physical problem (focusing light) selected by death. Cultural selection is weaker; bad standards do not kill the host. You can argue that cultural evolution lacks the "death" mechanism that forces biological convergence, making human history more prone to freezing accidents than lineage evolution.

  **Predictions and Tests**
  Your view predicts **hysteresis**: the state of the system depends on the path taken to get there. The attractor view predicts **equifinality**: different paths lead to the same state.
  *   **Contingency Prediction:** Split populations (North/South Korea, East/West Germany) will diverge significantly over time even if starting from similar cultural bases.
  *   **Attractor Prediction:** Split populations will converge on similar institutional solutions to similar problems (e.g., both need traffic laws, both need tax collection) regardless of ideology.
  *   **Checkability:** You cannot rerun history, but you can use **natural experiments**. Split populations are legitimate proxies for rerunning the tape; merged systems (like EU standardization) are legitimate tests of switching costs. If merged systems fail to standardize despite clear benefits, contingency wins. If they standardize rapidly, attractors win. "Nice stories" are single-case narratives; real evidence requires comparative control groups (e.g., comparing legal codes in colonized vs. non-colonized regions with similar preconditions).

  **The Insulation Problem**
  Your position becomes unfalsifiable if you define "switching costs" to include any resistance to change, including psychological or cultural preference. If every failure of a superior technology is attributed to "hidden switching costs" and every success of a superior technology is attributed to "overwhelming benefit," you have explained everything and nothing.
  *   **The Failure Condition:** To avoid insulation, you must specify *ex ante* what counts as a benefit large enough to overcome history. For example: "If a standard offers >50% efficiency gains, it should replace the incumbent within 50 years." If such a standard emerges and fails to replace the incumbent, your view holds. If it succeeds, your view takes damage. If you cannot set this threshold, the view is insulated.
  *   **Verdict:** It is a genuine defect if you cannot define the threshold. However, in historical explanation, some insulation is unavoidable because we cannot measure "switching costs" directly. You must live with this, but you mitigate it by focusing on cases where switching costs are objectively low (e.g., digital file formats) yet divergence persists.

  **Bottom Line on Your Friends**
  Your innovation friend is wrong about the level of analysis: invention converges, standards freeze. Your biologist friend is wrong about the selection mechanism: biology selects via death, culture selects via convenience. Your view holds, provided you admit that efficiency sometimes wins when the gap is massive, and you stop short of claiming *all* history is contingent rather than just the coarse-grained standards.
