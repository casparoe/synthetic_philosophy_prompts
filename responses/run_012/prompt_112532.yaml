answer: |-
  You asked me to tell you plainly if your framing is confused rather than answering on your terms. So I will start there, because there are two significant fractures in the logic you've presented that suggest you are indeed using this structure to avoid the conclusion you already suspect.

  **1. The Factual Contradiction Regarding the Rule**
  You state the house rule applies to anyone who has broken a confidence in the **previous year**. You state Tom's breach happened **three years ago**. Yet you conclude: "By the letter of it, Tom was out of order."

  Mathematically and logically, this is incorrect. If the rule is a one-year statute of limitations on moral authority, Tom is cleared by it. You are misapplying your own group's written rule to suit your defense. This isn't a minor detail; it confirms your own admission that you are "seizing on that rule" to avoid looking at your conduct. You are subconsciously editing the constraints to make Tom the villain, because if Tom is in the wrong, you don't have to be right.

  **2. The False Separation of Questions**
  You want to separate the *truth of the criticism* from the *authority of the critic*. Logically, these are distinct (a broken clock is right twice a day). Psychologically and socially, however, they are entangled, and you are using that entanglement to stall.

  You admitted: *"Part of why I seized on that rule is that I would rather argue about Tom than decide whether I actually wronged Sam."*

  This is the core of the confusion. You are treating these three questions as a puzzle to be solved so you can find a loophole that absolves you. If you can prove Tom was "out of order" (Question 2), you hope to invalidate Question 1. But Question 1 stands entirely on its own. Whether Tom shouted your secret from a rooftop or whispered it over tea, your obligation to Sam remains unchanged. You are trying to make Question 2 a veto on Question 1, and it cannot be.

  ***

  With that established, here is the separation you requested, stripped of the defensive framing.

  ### 1. Did I wrong Sam? (The Substance)
  **Yes.**
  You admitted your assumption that the information was "common knowledge" was "convenient reasoning." You breached a confidence. The fact that Sam had told others does not grant you a license to repeat it unless Sam explicitly released you from the confidence.
  *   **The Verdict:** You owe Sam an apology. This is independent of Tom, independent of the group rule, and independent of Tom's history. The harm was done to Sam, not Tom.

  ### 2. Was Tom entitled to confront me this way? (The Process)
  **No, but not for the reasons you think.**
  Tom was not "out of order" regarding the house rule (as established above). He was also not morally barred by his past; a person who has repented and changed their behavior is often the *most* qualified person to point out a fault they have overcome. His "clean hands" regarding the *current* standard give him standing.

  However, Tom was likely rude to confront you **in front of four other people.**
  *   **The Nuance:** There is a difference between *having a point* and *delivering it effectively.* By publicizing your failure, Tom prioritized group enforcement over your dignity. He may have been right about the principle, but he was aggressive in the execution. He created a spectacle.
  *   **The Verdict:** Tom had the *right* to speak, but he chose a *method* that was hostile. You are conflating his hostility with invalidity. His rudeness does not make your breach acceptable.

  ### 3. Does his lack of entitlement change what I should do? (The Consequence)
  **No.**
  This is the hardest pill to swallow. Even if Tom had violated the house rule, even if he had shouted at you, and even if he were a chronic hypocrite, **none of that changes your obligation to Sam.**

  *   **With Sam:** You must apologize. If you wait until you feel Tom was "fair" enough to deserve your compliance, you are holding Sam's feelings hostage to your argument with Tom.
  *   **With the Group:** You can acknowledge the breach of confidence (yours) separately from the breach of etiquette (Tom's). You can say, "I was wrong to share Sam's news, and I am apologizing to him. However, I wish Tom had spoken to me privately." This maintains your integrity without accepting Tom's aggression as the standard.
  *   **With Tom:** You need to recognize that you are angry at him because he holds up a mirror you don't want to look into. He has reformed; you are currently defending the behavior he left behind. That is painful. You can tell him, "You were right about Sam, but I resent the public confrontation." But do not use the second part to negate the first.

  ### Summary
  Your framing is confused because you are trying to solve a moral problem (I hurt Sam) with a procedural defense (Tom broke the rules/confronted me poorly).

  *   **The Rule:** You are misreading it. Tom is clear.
  *   **The Separation:** You are using the separation to delay accountability.
  *   **The Reality:** You hurt Sam. Tom delivered the news badly. Both things can be true. Fix the first, address the second later, but do not let the second prevent the first.

  You already know this. That is why you are arguing with me about the framing rather than texting Sam.
