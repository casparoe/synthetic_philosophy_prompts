answer: |-
  ### Desiderata for a Theory of Linguistic Understanding
  **Preparatory Memorandum for Graduate Seminar**

  The following eight requirements constitute the specification for any theory claiming to settle the Chinese Room Argument (CRA). They are ordered roughly by the magnitude of theoretical work they perform, moving from foundational metaphysical constraints to specific structural conditions. Each item includes the sharp requirement, the motivating case drawn from our target set, and an assessment of its negotiability.

  #### 1. The Syntax-Semantics Gap
  *   **Requirement:** A theory must distinguish between the manipulation of formal symbols (syntax) and the grasp of their meaning (semantics). Possession of the former cannot be sufficient for the latter without further conditions.
  *   **Motivating Case:** **The Man in the Room.** He manipulates Chinese symbols perfectly according to the rule book (syntax) but by hypothesis lacks any grasp of what they mean (semantics). If a theory claims syntax *is* semantics, it must explain why the man understands Chinese.
  *   **Negotiability:** **Non-negotiable.** Any theory that collapses this distinction fails to account for the intuitive difference between parroting and speaking. However, *where* the gap is bridged (e.g., via causal history vs. functional role) is the central dispute.

  #### 2. The Simulation/Duplication Distinction
  *   **Requirement:** A theory must specify the conditions under which simulating the *outputs* of understanding counts as duplicating the *state* of understanding. Input-output equivalence is presumptively insufficient for state identity.
  *   **Motivating Case:** **The Lookup Table System.** A system with a pre-computed map of every possible Chinese conversation produces perfect outputs but performs no computation. If I/O equivalence sufficed, this degenerate system would understand.
  *   **Negotiability:** **Non-negotiable.** Accepting I/O equivalence as sufficient renders the concept of "understanding" trivial and indistinguishable from "disposition to respond."

  #### 3. Physicalist Compatibility
  *   **Requirement:** The mechanism of understanding must be realizable within a physical system whose behavior is describable by formal or causal laws. The theory cannot rely on non-physical substances or magic.
  *   **Motivating Case:** **The Ordinary Bilingual Speaker.** We are confident human brains are physical systems. A theory that requires a non-physical soul to ground understanding contradicts established neuroscience.
  *   **Negotiability:** **Non-negotiable.** Rejecting this moves the debate from philosophy of mind to metaphysics/dualism, which most participants wish to avoid.

  #### 4. The Causal Grounding Constraint
  *   **Requirement:** Semantic content must be grounded in causal interactions with the referents of the language, not merely in relations between other symbols.
  *   **Motivating Case:** **The Room (Isolated).** The man in the room has no contact with the world outside (no Chinese objects, no Chinese speakers). His symbols float free of reference. A theory must explain how understanding arises without this hook to reality.
  *   **Negotiability:** **Preference of Camp.** Externalists (e.g., Putnam, Burge) view this as non-negotiable. Internalists/Functionalists view it as a preference, arguing internal functional role suffices for content.

  #### 5. The Compositionality Constraint
  *   **Requirement:** A theory must specify whether understanding can emerge from a system composed entirely of parts that do not understand. If it can, the theory must define the structural conditions required for this emergence.
  *   **Motivating Case:** **The Nation-Scale System vs. The Brain.** We credit the brain with understanding, yet neurons presumably understand nothing. We hesitate to credit the Nation (people passing slips) with understanding, though they also understand nothing individually. The theory must explain the difference.
  *   **Negotiability:** **Preference of Camp.** Searleans lean toward "No emergence from non-semantic parts." Functionalists lean toward "Yes, given the right causal organization."

  #### 6. The Locus of Attribution
  *   **Requirement:** A theory must provide a principled rule for determining *which* physical aggregate is the subject of understanding. It must prevent arbitrary shifting of boundaries to save a hypothesis.
  *   **Motivating Case:** **The Man vs. The Room.** Searle argues the man understands nothing; the System Reply argues the *Room* understands. A theory cannot allow the locus to shift simply to evade the "Man doesn't understand" intuition without independent justification.
  *   **Negotiability:** **Non-negotiable.** Without this, any counterexample can be dissolved by redefining the system boundary (the "Combination Reply").

  #### 7. Phenomenal Independence
  *   **Requirement:** A theory must state explicitly whether linguistic understanding entails conscious experience (qualia) or whether it is a purely functional capacity that could exist without "what it is like" to understand.
  *   **Motivating Case:** **The Monolingual with Implant.** If the implant grants perfect Chinese capacity but no conscious experience of meaning, does she understand? This separates understanding from consciousness.
  *   **Negotiability:** **Preference of Camp.** Biological Naturalists tie understanding to consciousness. Functionalists/Computationalists often decouple them (allowing for unconscious understanding or zombie speakers).

  #### 8. The Complexity Threshold
  *   **Requirement:** A theory must establish a lower bound of complexity or integration below which understanding cannot exist, to avoid trivial attribution.
  *   **Motivating Case:** **The Thermostat/Chess Engine.** A thermostat "responds" to temperature; a chess engine "responds" to moves. We deny they understand. A theory must explain why they fail where the bilingual speaker succeeds.
  *   **Negotiability:** **Non-negotiable.** Without a threshold, panpsychism or trivial functionalism becomes unavoidable, diluting the utility of the concept "understanding."

  ***

  ### The Tension Structure

  The purpose of this list is not to provide a checklist that can be easily ticked, but to reveal where current theories break. There are two primary incompatibilities inherent in these desiderata that the seminar must address.

  **1. The System Reply Paradox (Compositionality vs. Physicalism)**
  *   **The Conflict:** Hold **Physicalist Compatibility** (Brains are physical systems) and **The Compositionality Constraint** (understanding cannot arise from parts that understand nothing) together.
  *   **The Tension:** If neurons are the parts of the brain, and neurons do not understand Chinese, then by the Compositionality Constraint, the brain should not understand Chinese. Yet, by Physicalist Compatibility and ordinary observation, the brain *does* understand.
  *   **What Must Be Given Up:**
      *   **The Functionalist/Systems Camp** must relax the Compositionality Constraint, arguing that causal organization allows semantics to emerge from non-semantic parts (accepting the Nation/Room as potential understanders if organized like a brain).
      *   **The Biological Naturalist Camp** must relax Physicalist Compatibility in a coarse sense, arguing that brains have specific *biological* causal powers that neurons-in-isolation or silicon-chips-in-isolation lack, making the "parts" argument disanalogous between brains and rooms.
      *   **The Panpsychist Camp** must accept that the parts *do* have proto-understanding.

  **2. The Grounding Paradox (Grounding vs. Implant Intuition)**
  *   **The Conflict:** Hold **The Causal Grounding Constraint** (must hook to the world) and **The Monolingual with Implant** intuition (she understands).
  *   **The Tension:** If the implant is purely internal and processes symbols without direct sensory motor contact with Chinese speakers (perhaps she only reads texts), does she satisfy Causal Grounding? If Grounding is non-negotiable, the implant case might fail. If the Implant case is non-negotiable (she clearly understands), then Grounding must be internalized.
  *   **What Must Be Given Up:**
      *   **The Externalist Camp** must argue the implant connects to the world via the user's other senses or social history.
      *   **The Internalist Camp** must weaken the Causal Grounding Constraint to allow for "deferred" or "functional" grounding.

  ### The Most Exclusionary Requirement

  **The Simulation/Duplication Distinction (Item 2)** does the most work to exclude familiar positions.

  *   **Why:** This requirement invalidates the methodology of Behaviorism and standard Turing-Test Functionalism immediately. If input-output equivalence is not sufficient for state identity, then the primary evidence used to attribute understanding in AI (successful conversation) is rendered inconclusive.
  *   **Exclusionary Power:**
      *   It excludes **Behaviorism** (which defines understanding as disposition to behave).
      *   It excludes **Weak AI** claims that equate simulation with reality in the cognitive domain.
      *   It forces **Strong AI** to move beyond functional role to internal implementation details.
      *   It excludes the **Lookup Table** and degenerate program variants.
  *   **Consequence:** By insisting on this distinction, the theory forces the debate away from "What does it do?" to "What is it made of and how does it work?" This is the precise move that makes the Chinese Room argument possible. If one rejects this requirement, the Chinese Room argument cannot even get off the ground, as the man's output would suffice for understanding. Therefore, this is the gatekeeper requirement.
