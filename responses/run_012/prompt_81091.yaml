  7.  **Final Polish:** Ensure the distinction between "Technical Alignment" (doing what we mean) and "Normative Alignment" (doing what is good) is clear, as this is often the source of the confusion the user suspects.

      *(Self-Correction on the "Killer Requirement")*: I need to be careful. The prompt asks which requirement *in the spec* rules out the framings.
      *   Control framing: Focuses on constraints.
      *   Governance framing: Focuses on human processes.
