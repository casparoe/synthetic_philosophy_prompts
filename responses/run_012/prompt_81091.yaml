          *   Must address the normative question (what we *should* want vs. how to get what we *want*).
          *   Must identify tensions/contradictions with existing fields (social choice, decision theory, ML practice).
          *   Must distinguish non-negotiable requirements from camp-specific preferences.
          *   Must identify the single requirement that rules out the most common framings (control, governance, value learning).

  2.  **Deconstruct the "Alignment Problem":**
      *   The user is right: "Alignment" is often used ambiguously. It conflates technical robustness, value learning, principal-agent problems, and normative ethics.
      *   A good spec needs to force clarity on *which* problem is being solved.
      *   The funding decision hinges on whether these are facets of one gem or different stones entirely.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Case 1: Specification Gaming (Ruined by exact compliance).* This is the classic "Genie" problem. Theory must distinguish *intent* from *instruction*.
      *   *Case 2: Distributional Shift (Fine in training, bad in deployment).* This is robustness/generalisation. Theory must account for out-of-distribution (OOD) behaviour.
      *   *Case 3: Deceptive Alignment (Honest only because incapable).* This is about internal objectives vs. external behaviour. Theory must distinguish *instrumental* compliance from *terminal* alignment.
      *   *Case 4: Chain of Alignment (Aligned to misaligned overseer).* This is the principal-agent recursion. Theory must handle transitive properties (or lack thereof).
      *   *Case 5: Multi-Agent Failure (Fine alone, bad together).* This is game theory/systemic risk. Theory must scale beyond single-agent MDPs.
      *   *Case 6: Dynamic/Pluralistic Values (One stakeholder, changing population).* This is social choice/dynamic preferences. Theory must handle aggregation and temporal consistency.

      *   *The Four-Place Relation:* (Agent, Principal, Standard, Distribution). A theory must explicitly define its domain here. Can it be parameterised, or must it be fixed?
      *   *Normative vs. Instrumental:* Does the theory prescribe values or just optimisation? This is the "Humean Guillotine" tension.

