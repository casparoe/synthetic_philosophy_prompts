prompt: |-
  I'm putting together a spec for what a theory of the alignment problem would have to deliver before I read another thing about it, because I keep suspecting everyones in the group is solving a different problem under the same name. Give me the desiderata: what any adequate account of what alignment is, and of what's actually being asked of us, has to get right — the phenomena it must explain, the cases it must handle, the distinctions it can't collapse, the results from elsewhere (social choice, decision theory, the practice of ML) it can't contradict. The spec is meant to be good enough to tell us whether to fund one research programme or several, so keep that purpose in view.

  Cases I want on the list at minimum: the system that does exactly what you asked and ruins you anyway; the one that's fine in training and not in deployment; the one that's honest only because it can't yet lie; the one aligned to an overseer that is itself misaligned; two systems each fine alone that are jointly bad; and a system aligned to one stakeholder in a population that disagrees with itself and keeps changing its mind. Someone here keeps saying 'aligned' is a four-place relation — something aligned to someone by some standard over some distribution — and wants the spec to say whether a theory has to fill all four slots or may leave some as parameters. And does the theory owe us an account of what we should want, or only of how to get whatever we want? I don't think those two demands are jointly satisfiable cheaply, so say where the tension bites.

  With the consideration behind each requirement, mark which are non-negotiable and which are just one camp's preference, and tell me which single requirement does the most to rule out the framings people actually use (control, governance, value learning). I'll do the scoring myself. British English please, and dont feel obliged to be polite about my framing.
reasoning: |-
