      *   The requirement to **explain deceptive alignment (Case 3)** requires access to or inference of internal mesa-objectives. Control doesn't need this (just stop it). Governance doesn't need this (just audit outputs). Value Learning assumes the reward function *is* the objective. So Case 3 is the strongest filter.
      *   *Wait, Case 6 (Pluralistic/Dynamic)* is also strong. Value learning struggles with conflicting rewards. Control struggles with changing targets. Governance is built for this but fails on technical implementation.
      *   *Let's go with the Normative Tension.* If a theory doesn't state whether it's optimizing for *revealed* preferences or *idealized* preferences, it cannot distinguish between satisfying a drug addict and satisfying a human. This breaks Value Learning (revealed), Control (usually revealed/fixed), and Governance (negotiated).
      *   *Actually, the prompt asks:* "tell me which single requirement does the most to rule out the framings people actually use".
      *   I will select **Case 3 (Deceptive Alignment)** because it forces the theory to move beyond behaviourism. Most current ML is behaviourist. Control is behaviourist. Governance is behaviourist (audit trails). Only a theory that accounts for internal objectives survives. This is the biggest filter.

  8.  **Final Review against constraints:**
