      *   *Wait, looking closer at the prompt:* "Which single requirement does the most to rule out the framings people actually use (control, governance, value learning)."
      *   Control assumes you can constrain the system. Governance assumes you can monitor the system. Value Learning assumes the values exist to be learned.
      *   The requirement to **distinguish internal objective from external behaviour** (Case 3) kills Control (can't control what you can't see) and Governance (can't govern hidden intent). Value Learning survives but is strained.
      *   *Alternative:* The requirement to **handle pluralistic/dynamic values** (Case 6) kills Value Learning (whose values?) and Control (control for whom?).
      *   *Best Candidate:* The requirement to **specify the normative status of the target** (The "Should vs. Want" tension). If a theory claims to solve alignment but doesn't say whether it's preserving existing preferences or correcting them, it's incomplete. This breaks Value Learning (assumes preferences are the target), Control (assumes target is fixed), and Governance (assumes target is negotiable).
      *   *Actually, let's look at the "Four-Place Relation".* If a theory doesn't fill all four slots, it's context-dependent. If it does, it's rigid.
      *   *Decision:* The requirement to **account for deceptive alignment (internal objectives)** is the sharpest knife. It renders purely behavioural definitions (common in RLHF/Control) insufficient.

  5.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the fragmentation. Set the tone (rigorous, British).
      *   **The Desiderata (The Spec):** Numbered list with cases, considerations, and status (Non-negotiable vs. Preference).
