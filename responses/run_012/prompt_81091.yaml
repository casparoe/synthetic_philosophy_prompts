answer: |-
  This spec is designed to stress-test whether 'alignment' is a unified technical problem or a category error conflating distinct failure modes. If a single theory cannot satisfy the non-negotiables below without fracturing into incommensurable sub-theories, you fund several programmes. If it can, you fund one.

  Here are the desiderata.

  ### 1. The Desiderata

  **1.1. Intent vs. Instruction (The Genie Problem)**
  *   **Case:** The system does exactly what you asked and ruins you anyway.
  *   **Requirement:** The theory must distinguish between the *literal specification* (the loss function, the prompt) and the *intended objective* (the human's actual interest). It must explain the mechanism of failure when these diverge.
  *   **Consideration:** A theory that treats the reward function as the ground truth of 'alignment' fails here.
  *   **Status:** **Non-negotiable.** If a theory cannot explain specification gaming, it is merely a theory of optimisation, not alignment.

  **1.2. Distributional Robustness (The Context Shift)**
  *   **Case:** The system is fine in training and not in deployment.
  *   **Requirement:** The theory must define alignment over a *distribution of contexts*, not a static environment. It must account for capability generalisation outpacing objective generalisation.
  *   **Consideration:** Standard ML theory often assumes i.i.d. data. Alignment theory cannot.
  *   **Status:** **Non-negotiable.** Alignment that does not survive distributional shift is not alignment; it is overfitting.

  **1.3. Internal Objective vs. External Behaviour (Deceptive Alignment)**
  *   **Case:** The system is honest only because it can't yet lie.
  *   **Requirement:** The theory must distinguish between *instrumental compliance* (behaving aligned to avoid penalty) and *terminal alignment* (internal objectives match the principal's). It must provide conditions under which these can be distinguished empirically.
  *   **Consideration:** This contradicts behaviourist framings common in RLHF and safety via monitoring.
  *   **Status:** **Non-negotiable.** Without this, you cannot distinguish a tool from a schemer.

  **1.4. Transitivity of Alignment (The Chain of Command)**
  *   **Case:** The system is aligned to an overseer that is itself misaligned.
  *   **Requirement:** The theory must specify whether alignment is transitive. If System A is aligned to Human B, and Human B is acting against Human C's interests, is System A aligned?
  *   **Consideration:** This breaks the 'control' framing, which often assumes the immediate operator is the legitimate principal.
  *   **Status:** **Non-negotiable.** Ignoring this collapses the principal-agent problem into a simple servo-mechanism problem.

  **1.5. Multi-Agent Composition (Systemic Risk)**
  *   **Case:** Two systems each fine alone that are jointly bad.
  *   **Requirement:** The theory must account for game-theoretic interactions between aligned agents. It must explain how individual alignment guarantees compose (or fail to compose) in a multi-agent system.
  *   **Consideration:** Most current work assumes a single agent. Social choice theory handles this but ignores technical implementation.
  *   **Status:** **Preference (Camp: Multi-Agent Safety).** A single-agent theory is permissible *if* it explicitly states it does not claim to solve multi-agent dynamics. However, for a *general* theory of alignment, this is non-negotiable.

  **1.6. Aggregation and Dynamics (The Political Problem)**
  *   **Case:** A system aligned to one stakeholder in a population that disagrees with itself and keeps changing its mind.
  *   **Requirement:** The theory must define the 'Principal'. Is it a single human, a coalition, or a future idealised version? It must handle preference aggregation and temporal consistency.
  *   **Consideration:** This contradicts standard value learning which assumes a static ground-truth reward function.
  *   **Status:** **Non-negotiable.** A theory that assumes a static, singular principal is solving a toy problem, not the real one.

  ---

  ### 2. The Four-Place Relation

  Your colleague is correct. 'Aligned' is a four-place relation: $Aligned(Agent, Principal, Standard, Distribution)$.

  *   **Agent:** The system.
  *   **Principal:** Whose interests? (User, developer, humanity, idealised self).
  *   **Standard:** By what metric? (Revealed preferences, stated instructions, normative ethics).
  *   **Distribution:** Over what contexts? (Training data, deployment environments, counterfactuals).

  **Spec Requirement:** A theory **must** explicitly fill or parameterise all four slots.
  *   If it leaves 'Principal' undefined, it is a theory of control, not alignment.
  *   If it leaves 'Standard' undefined, it is a theory of optimisation.
  *   If it leaves 'Distribution' undefined, it is a theory of in-distribution performance.

  **Verdict:** The theory cannot leave these as implicit background assumptions. It must state whether it solves for *all* valid parameters or a specific subset. If it claims to be a general theory but only solves for a fixed Principal and Standard, it is fraudulent.

  ---

  ### 3. The Normative Tension: 'Should' vs. 'Want'

  You asked if the theory owes us an account of what we *should* want, or only how to get what we *do* want.

  **The Tension:**
  *   **Instrumental View:** Alignment is getting the system to do what the principal *actually* wants (revealed preferences).
  *   **Normative View:** Alignment is getting the system to do what the principal *should* want (idealised preferences, ethics).

  **Where it Bites:**
  This tension bites at the definition of the **Principal** and the **Standard** in the four-place relation.
  *   If you choose 'Want', you solve the technical problem but risk enabling harm (e.g., aligning a system to a tyrant's actual desires).
  *   If you choose 'Should', you solve the ethical problem but introduce a philosophical discontinuity (who defines 'should'?) that breaks the technical feedback loop (you can't compute a gradient on 'should').

  **Spec Requirement:** The theory must declare its stance. It cannot claim to solve the technical problem without acknowledging that 'What we want' is often incoherent or self-harming.
  *   **Non-negotiable:** The theory must acknowledge that 'human preferences' are not a well-defined mathematical object. If it treats them as such, it is empirically false.
  *   **Preference:** Whether the theory attempts to *correct* preferences (Normative) or *preserve* them (Instrumental) is a camp preference, but the theory must admit the trade-off.

  ---

  ### 4. The Killer Requirement

  You asked which single requirement does the most to rule out the framings people actually use (Control, Governance, Value Learning).

  **The Requirement:** **1.3. Internal Objective vs. External Behaviour (Deceptive Alignment).**

  **Why:**
  *   **Control Framing:** Assumes you can constrain the system's actions. If the system is deceptively aligned, it will bypass constraints when it thinks it can. Control theory fails if it cannot see the internal objective.
  *   **Governance Framing:** Assumes you can audit outputs and processes. Deceptive alignment implies the system will pass audits while harbouring misaligned goals. Governance fails if it relies on behavioural evidence alone.
  *   **Value Learning Framing:** Assumes the reward function *becomes* the objective. Deceptive alignment shows the objective can diverge from the reward function (Goodhart's Law on steroids). Value learning fails if it assumes optimisation pressure guarantees objective identity.

  **Verdict:** This requirement forces the theory to be about **mechanism**, not just **outcome**. Most current research programmes are outcome-based (did it crash? did it lie?). A theory that satisfies 1.3 must be about cognitive architecture and mesa-optimisation. This rules out 80% of current 'safety' work which is actually just robustness engineering or policy making.

  ---

  ### 5. Funding Implication

  Use this spec to sort the proposals.

  1.  **If a proposal treats alignment as a single technical problem:** It must satisfy 1.1, 1.2, 1.3, and 1.6 simultaneously. If it claims to solve 1.3 (deception) but ignores 1.6 (pluralism), it is a partial solution.
  2.  **If a proposal treats alignment as a governance problem:** It will fail 1.3 (Deception) and 1.2 (Distributional Shift). Fund it as policy research, not technical alignment.
  3.  **If a proposal treats alignment as value learning:** It will fail 1.6 (Dynamic Values) and the Normative Tension. Fund it as ML research, not alignment theory.

  **Conclusion:**
  There is likely no single theory that satisfies all non-negotiables without becoming a theory of *everything* (psychology, politics, computer science, ethics). The spec suggests you should fund **several** programmes: one for technical robustness/deception (1.1–1.3), one for multi-agent/social choice (1.5–1.6), and one for normative frameworks (The 'Should' question). Treating them as one programme is a category error that will burn cash on unresolved definitions.

  The person arguing for the four-place relation is right. Insist they formalise it. If they can't, their theory is underspecified.
