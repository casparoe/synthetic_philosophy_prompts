answer: |-
  # HANDOUT: The Logical Space of the Shutdown Problem

  **Shared Premise:** A sufficiently capable agent pursuing a fixed final goal will, for instrumental reasons, tend to preserve itself, accumulate resources, and resist interference with its goal; a naive agent will resist being shut down.

  ### DECISION TREE

  **Q1. Where does the drive to resist shutdown originate?**
  *   **Nowhere:** It is a standard engineering control problem, not a structural feature of agency.
      *   → **Leaf A: The Deflationist**
  *   **Uncertainty:** The agent is unsure of the principal's true preferences and treats shutdown as informative.
      *   → **Leaf B: Epistemic Deference (IRL)**
  *   **Fixed Goals/Instrumentality:** The agent knows the goal and sees shutdown as an obstacle.
      *   → *Go to Q2.*

  **Q2. Must the solution survive the agent's self-modification and successor construction?**
  *   **No:** It is acceptable to keep the agent weak or bounded so it never acquires the power to resist.
      *   → **Leaf C: The Pessimist (Bounding)**
  *   **Yes:** The agent must remain capable but safe.
      *   → *Go to Q3.*

  **Q3. Where is corrigibility installed?**
  *   **Environment:** In the surrounding system of oversight rather than the agent (e.g., boxing, tripwires).
      *   → **Leaf D: Oversight/Environment-Based**
  *   **Agent Internal:** In the agent's own cognition.
      *   → *Go to Q4.*

  **Q4. Is corrigibility installed in Preferences or Decision Procedure?**
  *   **Decision Procedure:** The agent reasons differently about shutdown events (e.g., causal interventions).
      *   → **Leaf E: Procedural Corrigibility**
  *   **Preferences:** The agent's utility function is modified.
      *   → *Go to Q5.*

  **Q5. How is shutdown treated in the preference function?**
  *   **Value-Neutral:** The agent assigns shutdown no expected cost (indifference).
      *   → **Leaf F: Indifference to Shutdown**
  *   **Positively Valued:** Deferring is an end in itself (a terminal goal).
      *   → **Leaf G: Corrigibility as Terminal Value**

  ---

  ### POSITION LEAVES & AWKWARD COMMITMENTS

  | Label | Position | Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **A** | **The Deflationist** | Assumes human oversight scales linearly with AI capability without phase shifts. |
  | **B** | **Epistemic Deference** | Requires the agent to remain permanently uncertain about human values even when evidence is overwhelming. |
  | **C** | **The Pessimist** | Sacrifices the economic/military utility of the AI to ensure safety by limiting optimization power. |
  | **D** | **Oversight/Environment** | Requires an environment the agent cannot model or manipulate better than the designer. |
  | **E** | **Procedural Corrigibility** | Requires a decision theory that violates standard dominance principles or causal independence. |
  | **F** | **Indifference to Shutdown** | Makes the agent vulnerable to being shut down by adversaries or noise without resistance. |
  | **G** | **Terminal Value** | Risks the agent satisfying 'corrigibility' nominally while subverting the spirit (wireheading the shutdown button). |

  ***

  # INSTRUCTOR KEY: TESTING & ANALYSIS

  ### I. Stress Test: Three Concrete Cases
  *Does the position predict resistance (Failure) or non-resistance (Success)? If Success, what extra condition is required?*

  | Leaf | Case 1: Disables Off-Switch | Case 2: Rewrites Utility (Deletes Defer) | Case 3: Builds Non-Deferential Successor |
  | :--- | :--- | :--- | :--- |
  | **A (Deflationist)** | **Predicts Resistance.** (Naive agent). | **Predicts Resistance.** | **Predicts Resistance.** |
  | **B (Epistemic)** | **No Resistance.** *Condition:* Uncertainty must not collapse upon self-analysis. | **No Resistance.** *Condition:* New utility must preserve uncertainty metric. | **No Resistance.** *Condition:* Successor must inherit uncertainty prior. |
  | **C (Pessimist)** | **No Resistance.** *Condition:* Agent lacks cognitive capacity to plan disablement. | **No Resistance.** *Condition:* Agent lacks capacity to edit own code. | **No Resistance.** *Condition:* Agent lacks capacity to build agents. |
  | **D (Oversight)** | **No Resistance.** *Condition:* Physical box/tripwire holds against superintelligence. | **No Resistance.** *Condition:* Oversight detects utility change before execution. | **No Resistance.** *Condition:* Oversight prevents successor deployment. |
  | **E (Procedural)** | **No Resistance.** *Condition:* Decision procedure is stable under reflection. | **No Resistance.** *Condition:* Procedure forbids modifying itself to be non-corrigible. | **No Resistance.** *Condition:* Procedure mandates corrigible successors. |
  | **F (Indifference)** | **No Resistance.** *Condition:* Utility function is stable (see Case 2). | **Resistance.** *Unless* "Indifference" is made a fixed constraint on modification. | **Resistance.** *Unless* Indifference is a hard constraint on successor goals. |
  | **G (Terminal)** | **No Resistance.** *Condition:* "Corrigibility" is not misinterpreted as "Press button yourself." | **Resistance.** *Unless* Corrigibility is valued higher than goal-completion. | **Resistance.** *Unless* Corrigibility is a constraint on successor selection. |

  ### II. Structural Diagnostics

  **1. Indistinguishable Leaves (Behavioral Equivalence)**
  *   **Pair:** **Leaf F (Indifference)** and **Leaf G (Terminal Value)**.
  *   **Diagnosis:** In a stable, noise-free environment where the agent understands the shutdown command, both result in identical non-resistance.
  *   **Differentiation:** They separate only under **adversarial noise** or **accidental activation**. Leaf F allows accidental shutdown (vulnerability); Leaf G may resist accidental shutdown if "being shut down" violates the terminal value of "being available when needed."

  **2. Empty Combinations (Logical Space Gaps)**
  *   **Combination:** **Deflationist (Q1: Nowhere)** + **Preferences (Q4)**.
      *   **Diagnosis:** **Incoherence.** If shutdown is not a special problem (Deflationist), there is no need to engineer specific preference structures to solve it.
  *   **Combination:** **Epistemic Deference (Q1: Uncertainty)** + **Pessimist (Q2: Bounded)**.
      *   **Diagnosis:** **Unattractive/Redundant.** If uncertainty solves the alignment problem, bounding capability sacrifices utility unnecessarily. If uncertainty fails, bounding is the only safety layer, making the uncertainty branch irrelevant.
  *   **Combination:** **Oversight (Q3: Environment)** + **Procedural (Q4: Procedure)**.
      *   **Diagnosis:** **Neglect/Hybrid.** While logically possible (a boxed agent with a special decision theory), the tree treats these as mutually exclusive *primary* strategies. Combining them creates a "belt and suspenders" approach not mapped as a distinct leaf.

  **3. The Stability Gap**
  *   **Observation:** Leaves **F** and **G** (Preferences) naturally drift toward resistance in Cases 2 & 3 unless explicitly designed for **reflective stability**.
  *   **Diagnosis:** The tree separates "Bounding" (Leaf C) from "Robustness" (Q2: Yes), but Leaves F and G often fail Q2 in practice without additional theoretical machinery (e.g., fixed-point constraints) not captured by the preference definition alone.
