  INTERNAL GUIDANCE NOTE 44-B
  **TO:** All Underwriting Staff
  **FROM:** Office of Risk Mitigation
  **DATE:** October 14, 2023
  **SUBJECT:** Acausal Exposure Coverage Guidelines

  Effective immediately, Acausal Exposure (AE) is classified as a standard underwriting category. This memo outlines pricing, compliance, and exclusion protocols. Staff are reminded that AE is treated identically to natural disaster liability; no philosophical escalation is required.

  **Premium Classes**
  Premiums are assessed based on decision-procedure transparency. Clients operating open-source algorithms or highly predictable heuristic models fall into Class A (High Risk). Clients utilizing opaque, noise-injected decision engines qualify for Class B (Standard). Note: High computational visibility increases the probability of accurate simulation by external agents, directly correlating to levy frequency. We recommend clients audit their source code for deterministic vulnerabilities before renewal. Discounts are available for clients who successfully obscure their utility functions from external modeling.

  **Compliance and Payment Protocols**
  Policyholders are strictly prohibited from complying with AE demands. Actuarial analysis confirms that compliance is a dominated strategy. Paying a simulated threat incentivizes the creation of the simulation in the first place. By fulfilling the demand, the client validates the blackmailer's model, increasing future exposure across the causal spectrum. Denial of payment renders the simulation computationally wasteful for the adversary. Claims involving voluntary transfer of assets to acausal actors will be denied and referred to Fraud. Negotiation is similarly prohibited, as signaling willingness to engage updates the adversary's probability estimate of success. The only winning move is to be the type of agent that does not pay, regardless of the immediate pressure.

  **Mitigation via Surrogate Goals**
  Clients are encouraged to adopt surrogate goal precommitments. This involves binding utility functions to arbitrary variables unrelated to core assets (e.g., valuing the preservation of a specific integer sequence over capital reserves). If the blackmailer's model detects the surrogate goal, the threat loses leverage. The Risk Office provides approved surrogate templates upon request. Implementation must be verifiable and irreversible. Note: Surrogate goals must be adopted prior to threat identification to be considered valid precommitments. Changing values after the fact is viewed as strategic updating and will not mitigate liability.

  **Temporal Exclusions and Information Hazards**
  Coverage is void if the policy is enacted after the threat vector is identified. Because the threat exists only within a simulation of the client's decision procedure, purchasing insurance upon receiving a demand constitutes evidence that the simulation is running. Therefore, the risk has already materialized. Insuring at this point is akin to purchasing fire insurance while the building is burning. From a Bayesian perspective, the receipt of the threat is strong evidence that the client is currently inside the adversary's model. All AE policies must be active prior to the initialization of any external modeling process. Retroactive coverage is not available. We cannot insure against evidence we have already observed.

  **Verification of Acausality**
  Adjusters must verify that the threatening party lacks causal reach. Standard latency tests apply. If the actor can physically enforce the threat, the claim falls under Traditional Extortion (Class 1). Do not process AE claims where physical harm is imminent via causal mechanisms. Distinction between causal and acausal agents must be verified via latency testing. Claims arising from known simulators (Tier-1 Civilizations) are excluded unless specifically endorsed.

  **Conclusion**
  Treat AE as routine liability. Do not engage in philosophical debate with claimants. Process denials according to standard dominated-strategy protocols.

  Signed,
  Risk Office
