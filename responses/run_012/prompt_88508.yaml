      *   *Self-Correction during drafting:* Make sure not to get bogged down in too much utilitarian calculus. Keep it focused on the "Mistake" framing. The user wants to know if they can call Ag a mistake without calling Medicine a mistake.
      *   *Key Insight:* The "Mistake" in Ag is that it was a **Pareto inferior equilibrium** that became locked in. Medicine moves us to a Pareto superior equilibrium (usually) or saves lives without forcing a downgrade.

