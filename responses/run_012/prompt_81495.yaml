          *   *Metric:* Divine Will.
          *   *Possible:* Whatever God didn't reject.
          *   *PoE:* Fails. Doesn't explain *why* God chose this one if it has evil.
      *   *Reading 2: The Utilitarian Aggregator (Substantive but Vulnerable).* Maximize total happiness/minimize suffering.
