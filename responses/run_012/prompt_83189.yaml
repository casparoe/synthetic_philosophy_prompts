answer: |-
  The Isolation Criterion is the defensible standard, while the Robustness Criterion fails because it mistakenly treats narrative salience as noise rather than data, as the orchardist case correctly demonstrates.

  The Isolation Criterion succeeds where others fail because it shifts the evidentiary burden from the verdict itself to the premises of the case. A thought experiment is probative not when it guarantees a specific outcome, but when it secures agreement on the non-semantic facts while leaving the conceptual classification open. In a Gettier case, interlocutors agree on the features specifying justification, truth, and belief; the dispute is strictly about whether that constellation constitutes "knowledge." The case isolates the concept because the inputs are fixed by stipulation or independent agreement, forcing the disagreement to locate itself in the conceptual mapping. By contrast, manufactured cases often smuggle the conclusion into the description of the features themselves—for instance, describing a trolley intervention as "murder" rather than "killing," or loading a scenario with visceral disgust triggers that bypass rational deliberation. The criterion avoids circularity because it does not require you to know the correct verdict in advance; it requires only that you identify which features are stipulated as fixed and which are left open for classification. If the description fixes the very thing in dispute (e.g., whether an act counts as "killing"), the case is question-begging; if it fixes only the naturalistic facts, it is probative.

  Your orchardist counterexample correctly demolishes the Robustness Criterion. Robustness assumes that narrative trappings are merely psychological noise that obscures the logical skeleton of the case, but this assumes a rationalist ontology that many moral concepts reject. In the orchardist case, "de-pumping" the narrative into a flat question about unforeseeable consequences often inadvertently strips away the *outcome* itself or the *salience* of the harm, thereby changing the subject from ex post blame to ex permissibility. If moral luck is a real phenomenon, then the emotional and narrative weight of the actual cancer diagnosis is not noise; it is a constitutive element of the blame judgment. A criterion that declares such verdicts artifacts simply because they vanish under abstraction is not filtering out bias; it is filtering out the phenomenon under investigation. Robustness proves too much because it privileges abstract principles over the phenomenological data that often grounds our moral intuitions, treating the instability of the verdict under abstraction as a fault of the intuition rather than a fault of the abstraction.

  The circularity you fear—that identifying a "loaded" description presupposes the verdict—is broken by appealing to independent principles of relevance rather than case-specific outcomes. You do not need to know whether the trolley push is wrong to know that vivid descriptions of gore are generally irrelevant to deontological status; you know this from background methodological norms about what counts as a moral reason. A case is manufactured if it relies on features we have independent reason to deem irrelevant (such as visceral disgust, racial coding, or emotive labeling) to secure a verdict that contradicts the agent's stated principles when those features are removed. This triangulation allows you to diagnose a case as rigged without committing to the correct verdict beforehand: you are criticizing the *mechanism* of the judgment (reliance on irrelevant features), not the *content* of the judgment. Thus, the Isolation Criterion remains viable because it demands that the disputed concept be the variable, not the constant, while the charge of "loading" is grounded in general theories of relevance rather than specific intuitions about the case at hand.
