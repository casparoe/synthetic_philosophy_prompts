answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Subject:** The Ethics of Procreative Selection and Disability
  **Authors:** [Procreative Beneficence Proponent] & [Expressivist Objection Proponent]
  **Date:** October 2023

  ### PREAMBLE
  We have debated the ethics of selecting embryos based on expected traits for over a decade. We recognize that our annual exchanges have become ritualized. We agree to halt the ritual. This document isolates our agreements, specifies our disagreements without caricature, and identifies the empirical and conceptual cruxes that must be settled to move forward.

  ### I. AGREED CLAIMS
  *We both sign the following propositions. Disagreement on these points is excluded from our current debate.*

  1.  **The Non-Identity Constraint:** Selection via embryo choice determines *which* child comes into existence. It does not terminate an existing pregnancy or harm an existing person. The child selected cannot claim they were harmed by being selected, as the alternative was non-existence.
  2.  **The Status of Existing Disabled People:** The lives of existing disabled people are worth living. To select against a trait in a future child is not to judge that an existing person with that trait should not exist or deserves less care.
  3.  **Scope of Obligation:** We are debating *moral reasons*, not necessarily legal prohibitions. We agree that state coercion regarding reproduction is generally impermissible.
  4.  **The Social Model Acknowledgement:** The impact of a biological trait on a life's quality is not intrinsic; it is mediated by social arrangement, accommodation, and technology. A trait is not a "disability" in a vacuum.
  5.  **The "Best Life" Limitation:** "Expected best life" is a probabilistic estimate, not a guarantee. Both sides agree that parents often lack perfect information and that welfare is multidimensional.
  6.  **Harm Scope:** We agree that discrimination, stigma, and reduced support for existing disabled people are genuine harms. We disagree on whether procreative selection *causes* these harms, or how to weigh them against potential welfare gains for future children.
  7.  **Red Herrings Excluded:** This debate is not about euthanasia, healthcare rationing for existing persons, or the claim that disabled lives are "not worth living."

  ### II. RESIDUAL DISAGREEMENTS
  *We state our opposing positions in our own terms, without concession.*

  **Position A (Procreative Beneficence):**
  "We hold that prospective parents have a moral reason to select the child, from among the possible children they could have, who is expected to have the best life. This reason is grounded in the welfare of the future person. When a trait (including many disabilities) statistically correlates with reduced well-being or increased suffering, there is a presumptive moral reason to select against it. While social stigma is regrettable, the primary moral locus of reproduction is the well-being of the child to be born. If selecting against a trait improves that child's expected welfare, the act is morally justified, even if it unfortunately coincides with ableist social attitudes. The solution to ableism is social change, not restricting parental selection."

  **Position B (Expressivist Objection):**
  "We hold that procreative selection is not merely a private welfare calculation but a public communicative act. Choosing against a trait expresses the judgment that lives containing that trait are less valuable. This expression constitutes a dignitary harm to existing people with that trait, reinforcing the view that they are 'mistakes' to be avoided. This expressive harm is not outweighed by the welfare gain of the future child, because the future child does not exist to be owed that welfare in a way that trumps the dignity of those who do exist. The act of selection itself participates in a system of devaluation, regardless of the parent's private intent. To select against disability is to collaborate in the judgment that disabled lives are inferior."

  ### III. THE CRUXES
  *These are the specific questions where resolution would shift the debate. We commit to treating these as open questions rather than settled premises.*

  **Crux 1: The Context-Dependence of "Best Life"**
  *Question:* Is the "best life" metric well-defined independently of the specific social environment the child will inhabit?
  *The Test Case (Sound Sensitivity):* Consider an embryo with a genetic trait resulting in exquisite auditory sensitivity.
      *   *Scenario X:* The parents live in a noisy industrial city with no soundproofing. The trait will cause chronic pain and isolation.
      *   *Scenario Y:* The parents live in a quiet, rural acoustic research community where the trait is valued and accommodated. The child will be advantaged.
  *   **Prediction A (Beneficence):** In Scenario X, there is a moral reason to select against the trait. In Scenario Y, there is no such reason (or a reason to select *for* it). "Best life" is relative to environment. If the environment changes the welfare calculus, the moral obligation changes.
  *   **Prediction B (Expressivist):** In both scenarios, selecting against the trait expresses the same judgment: that this mode of sensory processing is undesirable. Even in Scenario Y, selecting against it reinforces the idea that the trait is a defect to be managed rather than a variation to be accommodated. The expressive harm remains constant even if the welfare calculus shifts.

  **Crux 2: The Separability of Act and Message**
  *Question:* Can the *welfare function* of selection be disentangled from the *expressive function* of selection?
  *The Test Case (The Private Protocol):* Imagine a selection technology that is perfectly private. No statistics are published, no public health campaigns exist, and the criteria are never known to the public or the disability community. The only person who knows the selection criterion is the parent, and they do it solely to reduce specific suffering (e.g., chronic pain), not to avoid "disability" as a category.
  *   **Prediction A (Beneficence):** In this case, the expressivist objection dissolves. If no message is received, no expressive harm occurs. The welfare benefit to the child remains. Therefore, the act is permissible.
  *   **Prediction B (Expressivist):** In this case, the expressivist objection holds. The harm is not merely in the *reception* of the message, but in the *sending*. The parent still adopts an attitude of rejection toward the trait. Furthermore, truly private selection is impossible in a regulated medical system; the infrastructure itself encodes the judgment. The act remains complicit in devaluation regardless of publicity.

  **Crux 3: The Weight of Expressive Harm**
  *Question:* If expressive harm is real, does it function as a *trump* or a *weight*?
  *The Test Case (Severe Suffering vs. Mild Trait):* Compare selecting against a trait that guarantees death at age 5 versus selecting against deafness.
  *   **Prediction A (Beneficence):** The principle is the same, but the magnitude of welfare loss differs. The expressive harm (if any) is constant, but the welfare gain varies. Therefore, selection is more strongly justified in the death-prevention case.
  *   **Prediction B (Expressivist):** There is a qualitative difference, not just quantitative. Preventing early death is healthcare; selecting against deafness is eugenics. The expressive harm outweighs the welfare gain in the latter case but not necessarily the former. We disagree on where the line is drawn, but we agree the line exists.

  ### IV. DIAGNOSIS OF STALEMATE (VERBAL DISPUTE)
  *We identify the following area as a likely verbal dispute that has obscured substantive disagreement.*

  **The Definition of "Harm"**
  We suspect we are using the word "harm" to refer to two different categories of moral injury.
  *   **Camp A** uses "harm" to mean *welfare decrement* (pain, limitation, reduced opportunity).
  *   **Camp B** uses "harm" to mean *dignitary injury* (stigma, devaluation, social standing).

  **Why this matters:** When Camp A says, "Selecting prevents harm to the child," Camp B hears, "Selecting prevents welfare decrement." When Camp B says, "Selecting causes harm to disabled people," Camp A hears, "Selecting causes hurt feelings."
  **Agreement to Move Forward:** We agree to stop using the unqualified word "harm." We will instead specify **"welfare detriment"** (Camp A's primary concern) and **"expressive injury"** (Camp B's primary concern). We will not assume one automatically outweighs the other.

  ### V. COMMITMENT
  We agree to teach the next seminar using this document as the syllabus anchor. We will not be permitted to revert to the "pantomime" until we have resolved Crux 1 (Context-Dependence) to the satisfaction of the other. Specifically, we must agree on whether the Sound Sensitivity case forces Camp B to admit that "disability" is not intrinsic, or forces Camp A to admit that "best life" is too unstable to ground a moral rule.

  **Signed:**

  _________________________ (Procreative Beneficence)

  _________________________ (Expressivist Objection)
