      *   **Format:** Short story (~1,200 words) + Section "Where I've taken liberties" (~250 words).
      *   **Conceit:** A lab runs trials where survival depends on low-amplitude outcomes. Only survivors report (selection bias/quantum immortality vibe). Volunteers think they can't die. A statistician audits the records but cannot assume probability rules not justified by theory alone.
      *   **Tone:** Philosophical pressure, lived experience, no fiat resolution, no lecturing ending.
      *   **Constraints:** Stay close to the audit (logs, interviews, volunteer behavior). Ideas must live in work/arguments.

  2.  **Deconstruct the Physics/Philosophy:**
      *   *MWI:* All outcomes happen. Branching occurs.
      *   *Born Rule:* Probability = squared amplitude ($|\psi|^2$).
      *   *The Problem:* If all outcomes happen, why do we observe frequencies matching $|\psi|^2$? Why care about branches with higher weight?
      *   *Friend's View (Decision-Theoretic):* Rational agents should bet according to Born weights. It's about self-locating uncertainty.
      *   *User's View (Counting/Measure Problem):* Why not count branches? Why not care equally about all successors? The theory doesn't say.
      *   *Story Mechanism:* Quantum Suicide/Immortality scenario. If you only exist in branches where you survive, your subjective experience is always survival, regardless of amplitude. This highlights the conflict between subjective certainty (I am here) and objective weight (I should be dead in most branches).

  3.  **Drafting - Section by Section:**

