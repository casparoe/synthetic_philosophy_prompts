      *(Self-Correction during drafting)*: Ensure I don't accidentally validate one side. The story must show *why* it's hard. If Aris says "You're wrong," it settles it. If Elias says "I'm right," it settles it. They need to talk past each other based on their axioms.

      *Word Count Management:* 1,200 words is roughly 4-5 pages single spaced. I need to be concise but descriptive.

      *Key Phrase Integration:* "Rational agent," "Squared amplitudes," "Successors," "Principle of indifference." (Weave these in naturally).

  7.  **Writing - The Liberties Section:**
      *   Must be distinct.
