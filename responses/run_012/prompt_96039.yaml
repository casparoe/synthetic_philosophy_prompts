answer: |-
  The air in the observation deck smelled of ozone and stale coffee. Dr. Aris Thorne spread the logs across the steel table, the paper crisp against the hum of the cooling units below. Subject 44. Subject 45. Subject 46. All alive. All reporting.

  The protocol was simple. A quantum event with two outcomes: Green (amplitude $\epsilon$) and Red (amplitude $\sqrt{1-\epsilon^2}$). Green released the subject. Red released a neurotoxin. In the standard interpretation, the subject died with near certainty. In the Many-Worlds interpretation, the universe branched. In most branches, the subject died. In a few, they woke up.

  But the logs only came from the wakers.

  Aris tapped her pen against the file for Subject 46, Elias Vane. He sat on the other side of the glass, reading a paperback, legs crossed. He looked bored. He had survived forty trials where the survival amplitude was less than one in a million.

  "Mr. Vane," Aris said over the intercom. "We need to discuss the risk assessment for Trial 47."

  Elias looked up. "There is no risk, Doctor. I'm here."

  "You're here because we are speaking in a branch where you survived. The measure of branches where you died is overwhelming."

  "Measure," Elias repeated, closing his book. "That's the word you use when you want to pretend squared amplitudes are body counts. They aren't. They're weights. But weights for what?"

  "For rational expectation," Aris said. "If I tell a new volunteer they have a one-in-a-million chance of survival, I am using the Born rule. I am telling them how much they should care about the outcome."

  "And if I tell them they have a one-hundred-percent chance of experiencing survival?" Elias stood and walked to the glass. "Because I will not experience the branches where I die. There is no 'me' there to be disappointed. So why should the 'me' here care about the ghosts?"

  Aris felt the familiar friction in her chest. This was the wall. Her contract forbade her from assuming the Born rule as a postulate. She had to derive the expectation from the unitary dynamics alone. But unitary dynamics just said *everything happens*. It didn't say what to bet on.

  "The theory doesn't tell you which successor to identify with," Aris said. "It just says there will be successors. Most of them die."

  "Most," Elias said. "By what count? If the branching is continuous, there are infinite branches of both types. You can't count them. You have to weight them. But why should I weight them by amplitude? Why not by branch count? If there's one branch where I live and one where I die, isn't that 50/50?"

  "There aren't two branches," Aris said, her voice tight. "There's a superposition. The structure of the Hilbert space gives the 'live' component a tiny norm."

  "And yet," Elias tapped the glass, "I am always in the component with non-zero norm. I never find myself in the null set. So, from my perspective, the norm is irrelevant. I'm proposing we update the safety briefing. Tell them: 'You will survive.' It's empirically true for everyone who hears it."

  Aris looked down at her calculation pad. She had tried to construct a decision-theoretic proof, something that would show a rational agent *must* bet according to the squared amplitudes. But every derivation smuggled in a premise about equivalence or symmetry that felt like assuming the conclusion. If she couldn't justify why a rational agent should care about the measure of a branch, she couldn't justify telling Elias he was reckless.

  "If we adopt your view," Aris said, "we encourage risk-taking that drains resources. We have to send recovery teams into the dead branches. Even if you don't care about your successors, *I* care about the staff."

  "That's external," Elias said. "That's not about my expectation. That's about your budget. Don't confuse ethics with probability."

  Aris rubbed her temples. The logs showed a streak that looked like magic. To an outsider, Elias was immortal. To Aris, he was a statistical anomaly surviving in a thin sliver of reality. But the sliver was all he ever touched.

  "Trial 47," Aris said. "Amplitude is lower. One in a billion."

  "Then I'll be the one in a billion," Elias said. He walked back to the chair. "You're afraid that if you stop telling us we're likely to die, we'll stop fearing the machine. But fear is for people who think they vanish. I know I persist."

  "You persist as a copy," Aris said. "The continuity you feel is a trick of memory."

  "Memory is all I have. And my memory says I walk away." Elias sat down and opened his book again. "File your report, Doctor. Tell them the probability of survival is one, conditional on reporting. It's the only honest statistic you have."

  Aris picked up her pen. She hovered over the risk column. If she wrote 'negligible', she violated the data. If she wrote 'certain', she violated the theory's measure. She looked at Elias, then at the humming machine behind him. The theory described the wave function perfectly. It just didn't say which part of the wave function was *her* future.

  She wrote *Indeterminate*.

  "Initiate sequence," she said.

  The machine hummed. Elias didn't flinch.

  ***

  **Where I've taken liberties**

  The story leans heavily on the "Quantum Immortality" thought experiment, which assumes subjective experience necessarily follows branches where the observer survives. This is not a consensus view even among Many-Worlds proponents; many argue consciousness supervenes on physical states that cease in "dead" branches, meaning the subject simply ceases to exist in those worlds rather than "finding themselves" elsewhere.

  I also treated "branch counting" as a coherent alternative to the Born rule. In standard quantum mechanics, the Hilbert space is continuous, making discrete branch counting ill-defined without additional structure (like decoherence bases). The friend's view in the prompt aligns with the Deutsch-Wallace decision-theoretic derivation, which I alluded to via Aris's failed proofs. The user's view aligns with the "incoherence problem" of MWI—why care about high-weight branches?

  I am reasonably confident in the philosophical framing of the dispute (decision theory vs. ontology). The claim I am least sure of is the implication that a statistician could practically audit "records" from surviving branches without accessing the dead ones. In strict MWI, interference is lost after decoherence; the auditor is necessarily in a surviving branch, making the "audit" inherently biased in a way that cannot be corrected from within, rendering the statistical dispute purely theoretical rather than empirical.
