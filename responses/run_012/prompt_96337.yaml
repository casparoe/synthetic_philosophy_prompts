      *   *The PAM Vote:* The "vote" that killed PAM wasn't a vote on $W$. It was a vote on *appropriations* bundled with privacy scandals (TIA). It was a reaction to *moral repugnance*, not epistemic failure.
      *   *Implication:* Futarchy assumes the "Vote on Values" is clean and separable from the "Bet on Beliefs." PAM shows they are entangled. The legitimacy of the *mechanism* (betting) affects the legitimacy of the *values*. You can't just vote "Maximize Security" if the method of measuring security (betting on death) is politically illegitimate.
