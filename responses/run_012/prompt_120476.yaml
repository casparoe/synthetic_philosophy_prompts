      *Refining the "Losers Paid Nothing" point:* In a standard English auction, losers pay nothing. In a Dollar Auction, the second highest pays. This is the critical distinction. If losers pay nothing, why escalate past value? Because the value of *winning* (survival) is higher than the cost, OR because they hope to exhaust the opponent. This is War of Attrition. I must make this distinction clear.

