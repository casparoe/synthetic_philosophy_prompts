answer: |-
  **MEMORANDUM**

  **TO:** Risk Committee
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Capital Buffer Methodology – Recommendation to Revise

  **Recommendation**
  I recommend we defer locking the capital buffer based on the current vendor model. Instead, we should size the buffer using a liquidity stress test grounded in maximum plausible outflow during a disruption, rather than a calculated annual probability of occurrence. The current model produces a figure that is too precise for the uncertainty involved, risking undercapitalization during a tail event.

  **Why the Number Can't Bear the Weight**
  The vendor model derives a single probability by chaining roughly a dozen sub-event probabilities. Mathematically, this multiplication assumes independence. In a coordinated cyberattack, failures are highly correlated; when one link breaks, others likely follow. Multiplying dependent probabilities systematically understates the risk. If the sub-events are connected, the probability of the chain failing is much higher than the product of its parts.

  However, the deeper issue is the quality of the inputs. Consider two propositions: "This fair coin will land heads" (50% probability) and "This specific startup will double in value" (50% probability). The numbers match, but the first rests on physics and data, the second on intuition. We treat them differently. The vendor model treats them the same. In our model, we are assigning probabilities to unique geopolitical and technical events where no historical frequency exists.

  When we multiply twelve low-confidence estimates, we launder our uncertainty into a false precision. The output looks like hard data, but it is essentially a refined guess. For an $8B fund, basing solvency buffers on a number that masks its own uncertainty is imprudent. A low probability derived from weak evidence should not command the same capital allocation as a low probability derived from decades of loss data. The model conflates the *probability* of the event with the *weight of the evidence* supporting that probability.

  **What to Use Instead**
  We should shift from probability-based sizing to consequence-based sizing. We know the cost of a two-week payments outage: it is the liquidity required to meet obligations without incoming settlements. We should run a stress test assuming the disruption occurs, calculate the cash needed to bridge that gap, and set the buffer to cover 100% of that need. This means summing daily cash outflows for ten trading days and adding a safety margin for market volatility during the crisis.

  Alternatively, we establish a minimum floor, say 1% of AUM, adjusted for liquidity tiers. This acknowledges that while the frequency is unknowable, the impact is measurable. This changes the buffer from a negligible figure derived from low probabilities to a robust liquidity reserve capable of surviving the event regardless of odds. This approach aligns better with our fiduciary duty to preserve capital against existential threats, rather than pricing them like insurance premiums. It moves us from asking "How likely is this?" to "Can we survive this?"

  **The Strongest Case for Keeping the Model**
  The actuary will argue that governance requires a quantified metric. A single probability figure allows for year-over-year comparison, regulatory reporting, and integration into broader Enterprise Risk Management (ERM) frameworks. Removing it may look like retreating from quantification to discretion, which some trustees may view as less rigorous or harder to audit. There is value in having a consistent number for board packs, even if it is imperfect.

  **What I'm Asking the Committee to Decide**
  I ask the committee to vote at the [Date] meeting to reject the vendor model's output for buffer sizing and mandate the Liquidity Stress Test approach described above.
