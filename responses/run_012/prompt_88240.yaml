      **Why the Number Can't Bear the Weight**
      The vendor model derives a single probability by chaining roughly a dozen sub-event probabilities. Mathematically, this multiplication assumes independence. In a coordinated cyberattack, failures are highly correlated; when one link breaks, others likely follow. Multiplying dependent probabilities systematically understates the risk.

      However, the deeper issue is the quality of the inputs. Consider two propositions: "This fair coin will land heads" (50% probability) and "This specific startup will double in value" (50% probability). The numbers match, but the first rests on physics and data, the second on intuition. We treat them differently. The vendor model treats them the same.

