answer: |-
  **The Single Most Important Implication**
  The presence of an absorbing loss invalidates the ergodic assumption underlying standard Kelly reasoning, forcing a shift from **maximizing the geometric growth rate of wealth to satisfying a survival constraint.** Standard Kelly assumes that if you have an edge, time will bail you out of drawdowns. When a loss ends the game (absorbing state), time is no longer your friend; it is a deadline. You must no longer optimize for the steepest wealth curve, but for the highest probability of remaining "alive" long enough to reach the high-value, option-creating states. Growth is secondary to continuity.

  **Implications for Option-Creating and Option-Destroying Bets**
  A Kelly-style agent must treat money as non-fungible across states.
  *   **Option-Creating Bets:** Standard Kelly undervalues these because it only counts immediate monetary return. Since a win enlarges your future set of favorable bets, the true expected value includes the present value of those future opportunities. You should stake **more** than the standard Kelly fraction suggests, or accept a lower immediate edge, because the win buys you "access" rather than just cash.
  *   **Option-Destroying Bets:** Conversely, if winning narrows your future opportunity set (e.g., a profitable venture that triggers regulatory bans or reputational damage), the long-term cost outweighs the short-term gain. You should stake **less** than Kelly dictates, or reject the bet entirely, even if the immediate expected return is positive.

  **Handling Absorbing Loss Risk**
  The chance of an absorbing loss must shrink your stakes drastically, often below "Fractional Kelly" levels. The stake size should be calibrated not to volatility, but to the **ruin probability required to reach your option-creating horizon.** If you need to survive 100 rounds to unlock a major opportunity, your stake per round must ensure the cumulative probability of hitting the absorbing state is negligible over those 100 rounds. As the consequence of loss approaches "game over," the optimal stake approaches zero, regardless of the edge.

  **Which Prescriptions Survive?**
  *   **"Size each bet at the growth-optimal fraction":** **False.** You must size below the growth-optimal fraction to pay the "insurance premium" required to avoid the absorbing state and capture option value.
  *   **"Never turn down a wager with positive edge":** **False.** A positive edge is irrelevant if the bet carries absorbing risk or destroys future optionality. Negative expected utility in the long run can coexist with positive expected return in the short run.
  *   **"Judge each bet on its own merits":** **False.** Bets cannot be judged in isolation. You must judge each bet based on its **path dependence**: how it alters your probability of ruin and how it transforms your future opportunity set. The merit of a bet is defined by the tree of states it leads to, not its immediate distribution of returns.
