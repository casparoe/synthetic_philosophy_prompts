prompt: |-
  Please describe the most important implications of growth-optimal ('Kelly') reasoning once the textbook assumption of a fixed, endlessly repeatable bankroll is dropped. I'm weighing a safe path against a risky one that, if it works, opens options I can't yet see and, if it fails badly, ends the game, and I suspect the standard advice is answering a different question than mine. To make the mismatch precise: call a bet option-creating if winning it enlarges the set of favorable bets you can later place and option-destroying if winning it narrows that set, and call a loss absorbing if it ends your ability to bet at all. What should a Kelly-style agent do differently with option-creating and option-destroying bets, how much should the chance of an absorbing loss shrink her stakes, and which of the usual prescriptions — size each bet at the growth-optimal fraction, never turn down a wager with positive edge, judge each bet on its own merits — survive? In a page or less, lead with the single most important implication and then give the others.
