prompt: |-
  I chair my institute's biosafety advisory panel, and I need the written decision we will adopt when we meet on the 14th. The case before us forces the panel to say, on the record, whether a particular chemical system is alive, and our own policy gives us no way to dodge the question. The trial it concerns is scheduled to begin early next month, so we cannot defer.

  The system. A synthetic-biology group has built what it calls a protocell platform: microscopic fatty-acid vesicles, each enclosing a small network of non-genetic reactions. Fed continuously with a simple ester fuel and lipid precursors, the vesicles take up material, swell, and — when the reactor's stirring deforms them past a threshold — pinch in two. Nothing inside the vesicle copies a template. What passes to the next generation is the composition of the membrane and of the internal reaction network, which biases how quickly the daughter grows; when the group re-seeds a well-mixed reactor with its fastest-growing vesicles, growth rates rise over successive rounds, so the bias is real and cumulative rather than an artifact of where a vesicle happens to sit. Starve the system and it lyses within hours; keep feeding it and it runs indefinitely. The group now wants to move the platform out of a sealed bioreactor and into a semi-open greenhouse trial that vents to the outside, and has asked us to classify it.

  Our policy. Level 2 containment applies to living organisms. Level 1 applies to non-living chemical systems, however complex. Our operative definition of a living organism is a chemical system that maintains itself far from equilibrium and is capable of Darwinian evolution. The group argues that its platform is non-living on three grounds: there is no replication of a template, so no genuine heredity; division is driven by our stirrer rather than by the system itself; and the system cannot feed itself but depends on fuel we supply. Two panel members disagree with the group, and one of them has asked, in writing, whether a finding of "non-living" would mean that any sufficiently ingenious autocatalytic chemistry could escape Level 2 merely by being built one criterion short of the definition.

  Precedent. Two years ago we classified a self-replicating RNA construct as Level 2 without much discussion. Last year we classified a prion preparation as Level 1, on the ground that it propagates a conformation without maintaining itself.

  I am not asking for a treatise on the nature of life; I need something the panel can vote on and the lab can live with. Please draft the decision: the classification we should adopt, the criterion that drives it, how that criterion handles each of the group's three arguments, why the two precedents do and do not bear on this case, and the strongest case for the opposite classification together with why we should not follow it. Write it so that the lab, which will almost certainly appeal, and the funder, which wants a rule it can apply to the next case without reconvening us, both find it usable. A recommendation with conditions and a date by which they must be met is acceptable — and probably preferable, if that is where the reasoning lands.
reasoning: |-
  Here's a thinking process that leads to the suggested decision document:

  1.  **Analyze the Request:**
      *   **Role:** Chair of a Biosafety Advisory Panel.
      *   **Task:** Draft a written decision for a meeting on the 14th regarding a specific synthetic biology case.
      *   **Context:** A trial starts early next month; no deferral allowed. Policy requires a binary choice (Level 1 vs. Level 2) based on whether the system is "alive."
      *   **The System:** Protocell platform (fatty-acid vesicles, non-genetic reaction network). Fed ester fuel/lipids. Swells, divides via shear stress (stirring). No template replication. Heredity via membrane/network composition (growth rate bias). Selection works (faster growers dominate). Lyses if starved, runs indefinitely if fed.
      *   **The Policy:** Level 2 = Living. Level 1 = Non-living. Definition of Living = (1) Maintains self far from equilibrium + (2) Capable of Darwinian evolution.
      *   **The Group's Argument (for Level 1):** No template replication (no heredity); Division external (stirrer); Heterotrophic (needs supplied fuel).
      *   **Panel Dissent:** Worry about loophole (autocatalytic chemistry escaping Level 2 by missing one criterion).
      *   **Precedents:** Self-replicating RNA (Level 2); Prions (Level 1).
      *   **Audience:** The Lab (will likely appeal), The Funder (wants a scalable rule).
      *   **Format:** Formal decision document. Needs classification, driving criterion, rebuttal of group's arguments, distinction from precedents, counter-argument analysis, and potentially conditional recommendations.

  2.  **Evaluate the System against the Policy Definition:**
      *   *Definition:* "Maintains itself far from equilibrium" AND "Capable of Darwinian evolution."
      *   *Condition 1 (Equilibrium):* The system metabolizes fuel, maintains structure, and lyses if starved. It clearly maintains itself far from equilibrium. (Group admits this implicitly by noting it needs fuel).
      *   *Condition 2 (Darwinian Evolution):* This is the crux. Darwinian evolution requires Variation, Heredity, and Differential Fitness.
          *   *Variation:* Vesicles vary in composition (membrane/internal network).
          *   *Heredity:* The prompt states: "What passes to the next generation is the composition... which biases how quickly the daughter grows... growth rates rise over successive rounds." This *is* heredity, even without a genetic template. It's compositional heredity.
          *   *Differential Fitness:* "When the group re-seeds... with its fastest-growing vesicles, growth rates rise." Selection is occurring.
      *   *Conclusion:* The system meets the policy's definition of "living."
      *   *Classification:* Level 2.

  3.  **Address the Group's Three Arguments:**
      *   *Arg 1: No template replication.* Rebuttal: Policy definition says "Darwinian evolution," not "genetic replication." Compositional heredity suffices for evolution.
      *   *Arg 2: Division driven by stirrer.* Rebuttal: Many organisms rely on external forces for dispersal/division (e.g., fragmentation in fungi/plants, shear in bioreactors for bacteria). The *capacity* to divide upon reaching a threshold (swelling) is intrinsic; the trigger mechanism doesn't negate the biological process.
      *   *Arg 3: Depends on supplied fuel.* Rebuttal: Almost all lab-cultured organisms (E. coli, HeLa cells) depend on supplied nutrients. Autotrophy is not a requirement for life.

  4.  **Address the Precedents:**
      *   *RNA Construct (Level 2):* Similar because it replicates/evolves. Distinct because it lacks the compartmentalization/metabolism of the protocell, but the evolutionary capacity binds them.
      *   *Prions (Level 1):* Distinct because prions propagate conformation but do not *maintain themselves far from equilibrium* (they are static proteins) and lack the metabolic closure of the protocell. They don't evolve in the same Darwinian sense within the host context usually.

  5.  **Address the Dissent/Loophole Concern:**
      *   *Concern:* If we say this is non-living, any autocatalytic set escapes Level 2.
      *   *Resolution:* By classifying this as Level 2, we close the loophole. We establish that *compositional heredity* counts as evolution under this policy. This sets a clear rule for the funder.

  6.  **Address the Counter-Argument (Strongest Case for Level 1):**
      *   *Argument:* The lack of a digital genetic code makes the heredity "fuzzy" and error-prone, potentially limiting open-ended evolution. The external shear stress makes division mechanistic rather than biological.
      *   *Why Reject:* The policy does not specify "digital" or "open-ended." It specifies "capable of Darwinian evolution." The data shows cumulative selection. That meets the bar. Safety dictates erring on the side of containment when evolutionary potential exists.

  7.  **Drafting the Decision:**
      *   *Tone:* Formal, decisive, legally/policy robust, scientifically precise.
      *   *Structure:*
          1.  Header (Date, To, From, Subject).
          2.  Executive Summary/Classification.
          3.  Application of Policy Definition.
          4.  Response to Applicant's Arguments.
          5.  Distinction from Precedents.
          6.  Consideration of Alternative Classification (The Dissent).
          7.  Conditions/Recommendations (to make it palatable and actionable).
          8.  Sign-off.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I address the "stirrer" argument clearly? *Correction:* Emphasize that the *threshold* is intrinsic (swelling), even if the *force* is external.
      *   *Check:* Is the "loophole" addressed? *Correction:* Explicitly state that ruling this Level 1 would create the loophole the dissent fears, so ruling Level 2 closes it.
      *   *Check:* Is it usable for the Funder? *Correction:* Include a "Guidance for Future Cases" section that abstracts the rule (Compositional Heredity = Evolution).
      *   *Check:* Is it usable for the Lab? *Correction:* Offer a pathway to re-evaluation (e.g., if they remove evolutionary capacity) or specific containment mitigation that makes Level 2 manageable. *Decision:* A conditional recommendation is better. Classify as Level 2 *but* allow the greenhouse trial if specific mitigation (e.g., filtration on vents) is met, acknowledging the "semi-open" request. Wait, the prompt says "Level 2 containment applies... Level 1 applies..." The classification drives the containment. If I classify as Level 2, they can't do the semi-open greenhouse as planned. I need to be firm. The prompt asks for the *classification*. I should recommend Level 2. I can add a condition that they can apply for a variance *after* demonstrating X, but the baseline decision must be clear. Actually, the prompt says "A recommendation with conditions... is acceptable." I will classify as Level 2, but outline the specific containment required for the greenhouse to proceed (e.g. HEPA filtration), effectively making the trial possible but safe.
      *   *Wait, one nuance:* The prompt asks for the decision *we will adopt*. It implies I need to make the call. The safest and most policy-consistent call is Level 2.
      *   *Refining the "Loophole":* The dissent worries that if *this* is Level 1, *anything* short of full life is Level 1. By making *this* Level 2, we set the bar: Compositional Heredity + Metabolism = Level 2. This helps the Funder.

  9.  **Final Polish:** Ensure the date matches the prompt (meeting on the 14th). Ensure the tone is authoritative but respectful of the appeal process. (Meeting is on the 14th, decision effective immediately).

  *(Self-Correction on Date)*: The prompt says "when we meet on the 14th." I should date the document the 14th.

  *(Self-Correction on Precedents)*: Make sure to explain *why* Prions are Level 1 (no metabolism/equilibrium maintenance) vs Protocells (yes metabolism).

  *(Self-Correction on Group's Args)*: Ensure I explicitly list the three grounds and knock them down one by one.

  *(Final check on constraints)*: "Write it so that the lab... and the funder... both find it usable." -> Needs clear criteria for future application.

