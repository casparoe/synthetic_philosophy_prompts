answer: |-
  **INSTITUTE BIOSAFETY ADVISORY PANEL**
  **DECISION DOCUMENT 2024-BP-09**

  **Date:** 14 October 2024
  **To:** Synthetic Biology Group; Institute Administration; Funding Office
  **From:** Biosafety Advisory Panel (BAP)
  **Subject:** Containment Classification Determination: Fatty-Acid Protocell Platform

  **1. DECISION**
  The Biosafety Advisory Panel (BAP) classifies the described fatty-acid protocell platform as a **Level 2 Biological Agent**.

  Consequently, the proposed semi-open greenhouse trial cannot proceed under Level 1 (chemical) containment protocols. The system must be housed in Level 2 containment. Permission to utilize the greenhouse facility is contingent upon the installation of HEPA filtration on all ventilation exhaust and the implementation of liquid effluent sterilization protocols consistent with Level 2 biological waste.

  **2. BASIS OF CLASSIFICATION**
  This decision rests strictly on the Institute's Operative Definition of a Living Organism, which requires two conjunctive criteria:
  1.  Maintenance of self far from equilibrium.
  2.  Capability of Darwinian evolution.

  The Panel finds the protocell platform satisfies both criteria.

  *   **Equilibrium:** The system actively metabolizes ester fuel to maintain structural integrity and internal reaction networks. The immediate lysis observed upon starvation confirms the system is in a metastable state dependent on continuous energy input, satisfying the thermodynamic requirement for life.
  *   **Darwinian Evolution:** The system demonstrates Variation (heterogeneity in membrane/network composition), Heredity (transmission of compositional bias to daughter vesicles upon division), and Differential Fitness (selection for faster-growing compositions results in cumulative population shifts). The absence of a nucleic acid template does not negate the presence of heredity; compositional inheritance is sufficient to satisfy the policy definition of evolution.

  **3. RESPONSE TO APPLICANT ARGUMENTS**
  The Applicant Group argued for Level 1 classification on three grounds. The Panel rejects these grounds as follows:

  *   **Argument A: No template replication implies no genuine heredity.**
      *   *Panel Finding:* Incorrect. Policy defines "evolution," not "genetics." Heredity is the correlation between parent and offspring phenotypes. The data shows growth-rate biases are transmitted across division cycles. The mechanism (compositional vs. template) is irrelevant to the *fact* of inheritance.
  *   **Argument B: Division is driven by external shear (stirrer), not the system.**
      *   *Panel Finding:* Irrelevant to status. The system intrinsically swells to a division threshold; the stirrer provides the mechanical force to complete fission. Many recognized Level 2 organisms (e.g., filamentous fungi, fragile algae) rely on external mechanical forces for fragmentation and dispersal. Dependence on an environmental trigger does not negate biological division.
  *   **Argument C: The system is heterotrophic (depends on supplied fuel).**
      *   *Panel Finding:* Incorrect standard. Autotrophy is not a requirement for life under Institute policy. Standard model organisms (e.g., *E. coli*, mammalian cell lines) are obligate heterotrophs in laboratory settings. Dependence on supplied nutrients distinguishes a culture from a wild ecosystem, not a living system from a chemical one.

  **4. DISTINCTION FROM PRECEDENTS**
  The Panel has reviewed prior classifications to ensure consistency.

  *   **Self-Replicating RNA (Level 2):** This precedent supports the current decision. Like the RNA construct, the protocell exhibits cumulative selection. The presence of a compartment (vesicle) and metabolism in the protocell makes it *more* biologically robust than the RNA construct, reinforcing the Level 2 classification.
  *   **Prion Preparation (Level 1):** This precedent is distinguishable. Prions propagate conformation but do not maintain themselves far from equilibrium; they are static proteins that catalyze misfolding in host material without metabolic closure. The protocell actively maintains a distinct internal state against entropy. Therefore, the Prion precedent does not apply.

  **5. CONSIDERATION OF ALTERNATIVE CLASSIFICATION (LEVEL 1)**
  A minority of the Panel argued for Level 1 classification. The strongest case for this position is that the system lacks "digital" genetic coding, making its heredity low-fidelity and potentially incapable of open-ended evolution. Furthermore, the reliance on external shear for division suggests the system is a "chemical machine" rather than an autonomous agent.

  *   **Why this was rejected:** The Institute policy does not specify fidelity thresholds or autonomy of division mechanics. To adopt the Level 1 argument would require rewriting the policy to specify "genetic" evolution. Under the *current* text, the demonstrated capacity for cumulative selection is the binding constraint.
  *   **Risk Assessment:** Classifying this system as Level 1 would create a regulatory loophole. Any autocatalytic chemical system could evade Level 2 containment by removing its genetic template while retaining evolutionary capacity. This would undermine the safety intent of the policy.

  **6. GUIDANCE FOR FUTURE CASES (FOR FUNDER)**
  To ensure this decision is actionable for future reviews without requiring Panel reconvening, the BAP establishes the following interpretive rule:

  *   **The Compositional Heredity Rule:** A chemical system is considered "Capable of Darwinian Evolution" (and thus Level 2) if it demonstrates cumulative selection over successive generations, regardless of whether information storage is template-based (genetic) or compositional (metabolic/structural).
  *   **The Metabolic Closure Rule:** A system "Maintains itself far from equilibrium" if it exhibits catastrophic structural failure (lysis/degradation) upon cessation of fuel input, distinguishing it from stable chemical catalysts.

  **7. CONDITIONS FOR TRIAL PROCEEDING**
  Recognizing the scientific value of the greenhouse trial and the scheduling constraints, the Panel offers the following path forward:

  1.  **Containment Upgrade:** The greenhouse ventilation must be retrofitted with HEPA filtration (minimum 99.97% efficiency at 0.3 microns) to capture vesicle aerosols.
  2.  **Effluent Treatment:** All liquid waste from the reactor must be treated with 10% bleach or heat-sterilized (>121°C for 20 mins) prior to release.
  3.  **Re-evaluation Clause:** If the Group can demonstrate in a subsequent review that the evolutionary capacity has been disabled (e.g., by fixing the membrane composition to prevent variation) while maintaining the metabolic function, the system may be re-classified as Level 1.

  **8. CONCLUSION**
  The Panel acknowledges this decision imposes a burden on the research group. However, the Panel's mandate is to apply the Institute's safety policy as written. The system fits the definition of a living organism. To rule otherwise would be to ignore the evidence of evolution and create a precedent that compromises biosafety.

  **VOTE:**
  For Level 2: 4
  For Level 1: 1
  Abstain: 0

  **Signed,**

  *Chair, Biosafety Advisory Panel*
  *Date: 14 October 2024*
