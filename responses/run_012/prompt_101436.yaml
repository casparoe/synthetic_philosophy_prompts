  {
    "sequence": [
      {
        "step": "1",
        "idea": "Establish the timeline's utility before critiquing it.",
        "why_now": "Students need to feel why we use timelines (order, causality) before they can feel the limitation. If you start with critique, they see the tool as broken rather than limited.",
        "depends_on": "None - this is the foundation."
      },
      {
        "step": "2",
        "idea": "Test the timeline against a specific, non-aligned event.",
        "why_now": "You cannot reveal bias abstractly. Students must try to place something they know (e.g., a local event, a different region's history) onto the line and feel the friction when it doesn't fit.",
        "depends_on": "Step 1 (they must accept the timeline's purpose first)."
      },
      {
        "step": "3",
        "idea": "Identify the vantage point required to see this specific line.",
        "why_now": "Once they feel the friction, they ask 'why doesn't this fit?' The answer isn't 'the timeline is wrong,' but 'this timeline stands somewhere specific.' This shifts blame from error to position.",
        "depends_on": "Step 2 (the friction creates the need for an explanation)."
      },
      {
        "step": "4",
        "idea": "Imagine simultaneous timelines from other vantage points.",
        "why_now": "Now that they know one line has a position, they can imagine other lines existing at the same time. This sets up the 'everywhere at once' problem without solving it.",
        "depends_on": "Step 3 (you need a defined 'somewhere' before you can imagine 'elsewhere')."
      },
      {
        "step": "5",
        "idea": "Pose the core question: Can these lines be merged into one true map?",
        "why_now": "Only after seeing multiple valid but different lines can they understand why merging them is the hard question. This is the climax, not the start.",
        "depends_on": "Step 4 (you need the multiple lines to ask about combining them)."
      }
    ],
    "carrying_example": {
      "verdict": "Yes, the timeline is the right tool, but only if it feels authoritative enough to be trusted initially.",
      "must_have": [
        "Captions that imply a value judgment (e.g., 'Progress,' 'Connection') without stating it.",
        "Dates that are precise enough to look researched but vague enough to hide regional specificity (centuries only).",
        "A visual design that looks like a standard textbook aid (clean, linear, left-to-right)."
      ],
      "must_lack": [
        "Geographic labels (no 'Europe,' 'Asia,' just 'The World' or nothing).",
        "Obvious errors (if it looks wrong, they critique the facts, not the perspective).",
        "Apologetic language (don't hint that it's controversial in the handout text)."
      ]
    },
    "misconceptions": [
      {
        "misconception": "Periodization is arbitrary.",
        "when_it_forms": "Step 1 (if introduced too early).",
        "where_to_head_off": "Do not introduce this. Let them feel the utility of periods first.",
        "how": "Explicitly avoid discussing arbitrariness until Step 3. Frame periods as 'tools for organization' first."
      },
      {
        "misconception": "Global history just means covering more regions.",
        "when_it_forms": "Step 2 (when testing the timeline).",
        "where_to_head_off": "Step 3 (when identifying vantage point).",
        "how": "Ask: 'If we add a event from India to this line, does the story change or just get longer?' Show that adding items doesn't fix the structure."
      },
      {
        "misconception": "The fix for a biased timeline is adding the missing people.",
        "when_it_forms": "Step 3 (when identifying bias).",
        "where_to_head_off": "Step 4 (when imagining other timelines).",
        "how": "Have them try to add an event. Show that it disrupts the 'progress' narrative, proving the issue is the story, not the headcount."
      },
      {
        "misconception": "Time is universal (1500 in Mexico is the same moment as 1500 in China).",
        "when_it_forms": "Step 4 (when discussing simultaneity).",
        "where_to_head_off": "Step 4 (during the imagination exercise).",
        "how": "Ask: 'Did people in 1500 Mexico feel like they were living in the same century as people in 1500 China?' Highlight cultural time vs. clock time."
      },
      {
        "misconception": "Telling it from everywhere at once means all accounts are equally true.",
        "when_it_forms": "Step 5 (when posing the core question).",
        "where_to_head_off": "Step 5 (during the final discussion).",
        "how": "Clarify that 'multiple views' doesn't mean 'anything goes.' Some views are better supported, but none are complete."
      }
    ],
    "check_for_understanding": {
      "task": "Pick one turning point from the handout. Rewrite the one-line caption from the perspective of a person living in a region not centered by the timeline, without changing the date.",
      "what_it_shows": "Whether they understand that the event might be the same, but the story and significance change based on where you stand. It proves they grasp 'vantage point' rather than just 'facts.'"
    },
    "leave_out": [
      "Starting with 'periodization is arbitrary' - This disengages students by making the tool seem useless before they understand its function.",
      "Defining 'objectivity' - This is a philosophical trap for first-years; focus on 'vantage point' instead.",
      "Offering a 'better' timeline - This implies there is one perfect version, which contradicts the lesson that all histories have a position.",
      "Resolving whether the past CAN be told from everywhere - Leave this question open; the goal is to feel the tension, not solve it.",
      "Specific historian names or theories - Keep the language plain to avoid intimidation and focus on the conceptual problem."
    ]
  }
