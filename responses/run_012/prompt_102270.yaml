      *   *Actually, looking closer at Case 4 & 5:* The user forbids these. The principle *might* forbid them if "misleading truth" counts as a wrong that can't be done to the public/rival, but the "target" clause suggests the rival is fair game. The Minister case: The ally is the target. The principle suggests this is okay. User says no.
