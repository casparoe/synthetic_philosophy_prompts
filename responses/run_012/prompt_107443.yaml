answer: |-
  Good morning. Thank you all for being here. Looking around this room, I see two distinct worlds that my aunt brought together. On one side, her family—the people who knew her as a sister, an aunt, a friend who loved a good meal and a bad joke. On the other, her community—the artists who knew her as a master of material, a relentless creator who spoke the language of form and space. It is fitting that you are both here, in equal measure, because she spent her life bridging the gap between the tangible world and the human will.

  We are gathered to mourn a loss, and yet, when we try to locate exactly what has been lost, it is surprisingly difficult to point to.

  Those of us who are family might feel the sharp pain of her physical absence. The body that hugged us, the hands that held ours, are no longer here. To say she is still here in a purely physical sense would be a lie we cannot tell ourselves. The matter that made her up has returned to the earth. But for those of you who might find comfort in the idea that she survives in her artworks, I know there is also a hesitation. To say she is "in" the bronze or the stone feels incomplete. A statue can be copied. A shape can be replicated. If we simply point to a gallery and say, "There she is," we risk turning her into an object, something static and finished. She was never finished.

  I spent a lot of time in her studio over the years. I watched her work. And if there is one thing I learned from watching her hands, it is that she was not afraid to destroy what she had made. She would build a piece up over weeks, live with it, walk around it, and then, if she decided it was false, she would take a wire tool to it. She would melt it down. She would break it. She would return the material to the bin.

  Sometimes, years later, she would start again. She might use fresh clay, or she might use the same lump from the bin. But she would follow the same sequence of movements. She would press the material here, and not there. She would carve away this section, and leave that one intact. She believed that if she re-ran those decisions, she would arrive back at the same piece, even if every atom of the original material was gone. Conversely, she knew that if she kept the original clay but let it slump, let the structure fail, the piece was destroyed even if every particle remained on the table.

  She taught me that her work was not the clay. And it was not merely the shape the clay took. Her work was the history of her attention. It was the record of where she chose to apply pressure and where she chose to let go. It was the specific order of her choices.

  When I think about her life now, I find comfort in that distinction. It helps me understand where she is, and where she isn't.

  She is not gone in the way that a broken tool is gone. Her body, like the clay, was just the material she was given to work with. It was necessary, but it was not the definition of the piece. To focus only on the physical loss is to miss the structure she built. But she is also not present in the way a photograph is present. She is not frozen in a pose. She is not a static image on a wall.

  She is present in the history of decisions she made. She is in the way she chose to treat a stranger. She is in the way she chose to spend her money, her time, her energy. She is in the specific exclusions—the things she said "no" to so that she could say "yes" to something true.

  This offers a specific kind of comfort. It means that we do not need to pretend she is physically here to feel her influence. We don't need to hallucinate her presence in the room. But it also means we don't have to feel that she has vanished entirely. The impact of her choices is still unfolding. When you act with integrity, when you refuse to accept a false solution, when you press here and not there because you know it is right, you are continuing the work she started.

  The statue remains only as long as the decisions that hold it together are respected. In the same way, she remains with us as long as we honor the way she chose to live. Not by worshipping the objects she left behind, and not by grieving only the body she left behind, but by recognizing the will that shaped them both.

  She was a sculptor of her own life, just as she was a sculptor of bronze. She shaped her time through constraint and choice. That shape is not something we can touch with our hands, but it is something we can feel in our bones. It is real. It is durable. And it is not gone.

  So, let us not look for her in the dirt, and let us not look for her only in the galleries. Look for her in the decisions you make today. Look for her in the things you choose to build, and the things you choose to let melt down so you can begin again. That is where she is. That is what remains.

  Thank you.
