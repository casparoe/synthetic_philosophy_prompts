answer: |-
  # DECISION TREE: WHERE DO YOU STAND ON DESERT?

  **Instructions:** Start at **Node 1**. Follow the path dictated by your intuitive answer. Record your path (e.g., 1Y-2N-3F). Match your final stop to the **Leaf Key** below. Questions are phrased neutrally; no prior knowledge of positions is required.

  ### THE BRANCH NODES

  1.  **Coherence:** Is it *metaphysically possible* for an agent to basically deserve suffering solely in virtue of past wrongdoing (independent of future consequences)?
      *   **YES:** Go to Node 2.
      *   **NO:** Go to Node 5.
  2.  **Control:** (If Yes to 1) Does this desert require the *ability to have done otherwise* (AP) in a libertarian sense, or is *reasons-responsiveness* sufficient?
      *   **AP REQUIRED:** Go to Node 3.
      *   **RR SUFFICIENT:** Go to Node 4.
  3.  **Nature:** (If AP Required) Is the core of desert *cosmic fittingness* (suffering balances wrong) or *rights forfeiture* (you lost the right not to be harmed)?
      *   **FITTINGNESS:** Go to Leaf A.
      *   **FORFEITURE:** Go to Leaf B.
  4.  **Limits:** (If RR Sufficient) Do consequentialist concerns (safety, welfare) *limit* the amount of punishment deserved, or is desert absolute?
      *   **ABSOLUTE:** Go to Leaf C.
      *   **LIMITED:** Go to Leaf D.
  5.  **Justification:** (If No to 1) Is the *only* justification for sanctions future crime reduction and public safety?
      *   **YES:** Go to Node 6.
      *   **NO:** (You think there's another non-desert justification?) Go to Leaf E.
  6.  **Practice:** (If Yes to 5) Should we retain retributive language/practices (blame, guilt) even if theoretically false?
      *   **YES:** Go to Node 7.
      *   **NO:** Go to Node 8.
  7.  **Fiction:** (If Keep Practice) Is this retention a conscious *fiction* (we know it's false) or a *pragmatic illusion* (we shouldn't tell people it's false)?
      *   **CONSCIOUS FICTION:** Go to Leaf F.
      *   **PRAGMATIC ILLUSION:** Go to Leaf G.
  8.  **Policy:** (If Drop Practice) Does this require abolishing *punishment* entirely, or merely rebranding it as quarantine/treatment?
      *   **ABOLISH:** Go to Leaf H.
      *   **REBRAND:** Go to Leaf I.

  ---

  ### THE LEAF KEY (Positions & Commitments)

  | Leaf | Position Name | The Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **A** | **Libertarian Retributivism** | Requires a metaphysics of free will that conflicts with most contemporary physics. |
  | **B** | **Rights-Forfeiture Compatibilism** | Must explain why determinism doesn't negate the "choice" to forfeit rights. |
  | **C** | **Pure Compatibilist Retributivism** | Risks punishing agents who were causally determined to offend, which feels harsh to many. |
  | **D** | **Hybrid Retributivism** | May require releasing dangerous offenders once their "desert" is served, risking public safety. |
  | **E** | **Non-Desert Moralism** | Claims a normative basis for punishment that is neither desert nor consequences (rare/unclear). |
  | **F** | **Institutional Fictionalism** | Requires the state to systematically endorse beliefs it knows to be false. |
  | **G** | **Illusionism** | Relies on the benefits of cognitive dissonance; risks exposure and loss of trust. |
  | **H** | **Hard Incompatibilism (Caruso)** | Must tell vengeful victims their core moral intuition is a mistake to be cured. |
  | **I** | **Public Health Quarantine** | Practically indistinguishable from Leaf H, but linguistically softer. |
  | **J** | **Empty Cell (Incoherent)** | *No Desert + Punish for Desert.* (Contradictory; nobody defends this). |
  | **K** | **Empty Cell (Unattractive)** | *Desert is Real + No Policy Change.* (Theoretically robust but practically cowardly). |
  | **L** | **Revisionist** | Risks "changing the subject" rather than solving the original problem of responsibility. |

  ---

  ### DIAGNOSTIC NOTES FOR TAs

  **1. Indistinguishable Leaves:**
  *   **Leaf H (Hard Incompatibilism) vs. Leaf I (Quarantine):** These are functionally identical in policy (no retributive punishment, detention based on risk). The distinction is rhetorical: H emphasizes the *moral error* of desert; I emphasizes the *medical/safety* model. Caruso occupies both depending on the audience.
  *   **Leaf F (Fictionalism) vs. Leaf G (Illusionism):** Both retain the practice despite falsity. F is honest about the lie; G is paternalistic. In a court setting, the outcome is the same.

  **2. Empty Cells:**
  *   **Leaf J (Incoherent):** This cell represents claiming "Desert is impossible" but "We must punish because they deserve it." This is logically inconsistent. Students often land here by accident; push them to Node 5.
  *   **Leaf K (Unattractive):** This represents the "Sunday Theorist." They believe desert is real but refuse to let it impact sentencing (perhaps fearing error). This is philosophically stable but practically inert.
  *   **Leaf L (Revisionist):** Often populated by students who want to keep "responsibility" but strip out "blame." The awkwardness is defining the boundary without collapsing into Leaf F or Leaf C.

  **3. Handling The Two Cases:**
  *   **The "Awful Childhood" Offender:**
      *   **Leaves A, B, C:** Must argue that despite the childhood, the agent *still* met the control condition (AP or RR) at the time of the crime. Mitigation is hard unless the childhood destroyed RR.
      *   **Leaves H, I:** The childhood is irrelevant to *desert* (since there is none), but highly relevant to *risk assessment* (trauma may increase recidivism or treatability).
      *   **Leaf F:** We tell the offender they are responsible (for social cohesion), but the TA knows the childhood undermines the metaphysical claim.
  *   **The "Vengeful Victim":**
      *   **Leaves A, B, C:** Validate the victim. The offender *deserves* to suffer; the victim's desire is epistemically aligned with justice.
      *   **Leaves H, I:** The victim's desire is a natural emotion but morally misguided. The state should not satisfy it, only manage it.
      *   **Leaf F:** We give the victim the *ritual* of retribution (sentencing) to satisfy the emotion, knowing the metaphysical basis is absent.

  **4. The "Fittingness vs. Forfeiture" Split (Nodes 3 & 4):**
  *   Students often collapse these. **Fittingness** (Leaf A) implies the universe is better off if the wrongdoer suffers (cosmic balance). **Forfeiture** (Leaf B) implies the wrongdoer loses a shield against harm (rights view).
  *   *Why it matters:* Forfeiture is easier to reconcile with determinism (you caused the harm, you lose the shield) than Fittingness (which often implies a need for libertarian agency to "balance the scales").

  **5. The "Blame vs. Responsibility" Distinction (Node 7/8 overlap):**
  *   If a student says "We can hold responsible without blaming," they are likely heading toward **Leaf L (Revisionist)** or **Leaf I (Quarantine)**.
  *   If they say "Blame is essential," they are pushed toward **Leaf A, B, C** (Realists) or **Leaf F, G** (Fictionalists).
