answer: |-
  **MEMORANDUM**

  **TO:** State Department of Social Services, Office of Hearings
  **FROM:** County Appeals Panel, Case Unit 4
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Memo – Appeal of Sanction (Case #89402)

  **FINDINGS OF FACT**

  The Appellant, a female participant in her fifties, was sanctioned for failure to meet weekly job-search contact requirements. Agency records indicate zero verified contacts over a six-week period via the mandated mobile application. The Appellant contends she engaged in search activities but failed to log them due to a lapse in prepaid phone service. Furthermore, during this period, she was the sole caregiver for her mother during terminal hospice care. Documentation provided confirms the mother's death and the phone service interruption. The Agency maintains that verification is strictly contingent upon app logs; absent logs, there is no compliance.

  **REASONING**

  The Panel is evenly divided. Two members argue for upholding the sanction based on strict statutory construction: the regulation requires verified contacts, not intent. Two members argue for reversal, positing that the statutory purpose is to measure effort, and technical barriers should not negate genuine labor. This division reflects a confusion between *moral desert* (did she try?) and *administrative compliance* (did she log it?). This memo clarifies that under the "good cause" exemption clause, these are not mutually exclusive. Administrative law grants discretion to account for hardship where compliance becomes impossible despite effort.

  The Agency's concern regarding the integrity of the conditionality regime is valid. If "I was busy" becomes a standard exemption, the work requirement collapses into voluntarism. We must not soft-pedal this risk. However, this case is not about prioritizing caregiving over work requirements generally; it is about recognizing a temporary incapacity caused by a death in the immediate family compounded by a technical failure of the verification tool itself. The conditionality regime assumes capacity. When capacity is obliterated by crisis, the "good cause" provision is the statutory safety valve. Ignoring it does not strengthen the regime; it renders it brittle and legally vulnerable.

  Regarding the upcoming state "engagement score" system: while predictive metrics may flag at-risk participants earlier next fiscal year, this technological upgrade does not justify rigid enforcement today. The existence of a future safeguard acknowledges the current system's blunt instrument nature. Relying on a tool that cannot be accessed (due to phone lapse) to penalize a participant violates principles of fundamental fairness inherent in administrative adjudication.

  The minority members talking past each other—one focusing on desert, the other on procedure—miss that the procedure *includes* the desert. The statute asks us to verify effort, but the exemption clause asks us to verify *barriers*. To deny this appeal is to conflate the *method* of verification (the app) with the *fact* of compliance (the search). When the method fails due to no fault of the participant, the fact must be established through alternative evidence, which has been provided here.

  **DISPOSITION**

  **Recommendation:** Reverse Sanction.

  **Concrete Disposition:**
  1.  **Restoration:** Benefits are to be restored retroactively to the date of sanction.
  2.  **Re-engagement Plan:** The Appellant is granted a 14-day window to resume standard logging. During this window, she may submit job-search logs via email or纸质 form to accommodate any remaining connectivity instability.
  3.  **Policy Fix:** The County Agency shall implement a provisional "Hardship Waiver" protocol. When a participant documents a death in the immediate family or similar crisis, verification methods may be temporarily altered for up to 30 days without triggering automatic sanctions. This prevents the "all-or-nothing" failure state without removing the requirement to search.

  **Conclusion:**
  We override the Agency's strict interpretation not to undermine conditionality, but to preserve its legitimacy. A system that sanctions a woman for failing to log work while caring for a dying mother does not enforce responsibility; it enforces bureaucracy. The statute allows for good cause; this constitutes good cause.

  **Signed,**
  *Lead Panelist, Unit 4*
