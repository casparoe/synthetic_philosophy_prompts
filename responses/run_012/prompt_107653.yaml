      *   *Addressing the Colleagues:* One argues "desert" (moral worthiness/effort), the other "administrative law" (statutory compliance). The memo needs to show these converge here: Administrative discretion *allows* for good cause, and moral desert supports honoring genuine effort obscured by technical failure.
