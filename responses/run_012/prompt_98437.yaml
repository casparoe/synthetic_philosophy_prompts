  Based on her history, Priya is running **pure-strategy dominance only** (specifically, iterated strict dominance using pure strategies). While it is possible she accepts mixed strategies, her past examples were simple 2x2 games solvable without them, and she has never demonstrated a willingness to eliminate a strategy that is merely *weakly* dominated. Since M is only weakly dominated by T (they tie against L), a strict dominance rule will not remove it.

  Here is what each of the three candidate rules predicts for strategy M in this specific game:

  1.  **Iterated Weak Dominance:** This rule eliminates any strategy that is never better and sometimes worse than another. Since T yields (2, 2) and M yields (2, 1), T weakly dominates M. This rule predicts she **crosses out M**.
  2.  **Iterated Strict Dominance (Pure-Strategy Only):** This rule eliminates a strategy only if another pure strategy is strictly better against all opponent moves. T is not strictly better than M against L (2 = 2). This rule predicts she **leaves M in**.
  3.  **Iterated Strict Dominance (Mixed Strategies Allowed):** This rule eliminates a strategy if any mixture of other strategies is strictly better against all opponent moves. No mixture of T and B can yield more than 2 against L (since T maxes at 2 and B yields 1), so M cannot be strictly dominated by a mix. This rule predicts she **leaves M in**.

  Because your current game leaves both strict-dominance variants standing (both say 'leave it in'), you cannot yet distinguish whether Priya understands mixed-strategy dominance. To separate them, show her the following 3x2 game (Row payoffs only):

  *   **Rows:** Top, Middle, Bottom
  *   **Columns:** Left, Right
  *   **Payoffs:**
      *   Top: 3, 0
      *   Middle: 0, 3
      *   Bottom: 1, 1

  In this game, **Bottom** is not strictly dominated by Top or Middle individually (Pure-Strict says **leave it in**). However, Bottom *is* strictly dominated by a 50/50 mixture of Top and Middle, which yields an expected payoff of 1.5 against both columns (Mixed-Strict says **cross it out**). If she crosses out Bottom, she is running strict dominance with mixing; if she leaves it, she is restricted to pure strategies.
