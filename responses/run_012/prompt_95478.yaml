answer: |-
  Good morning. Welcome, everyone.

  It is a genuine pleasure to see this room filled. We have type designers here who spend their lives worrying about the weight of a curve; we have cognitive scientists who spend theirs measuring how quickly we spot one; and we have students who, I suspect, are mostly here for the wine later. That mix is exactly why we're here. If we were only designers, we'd just be drawing. If we were only scientists, we'd just be measuring. Together, we might actually explain what's happening.

  I want to start with a question that got me into this field, and I want to use it to set the terms for the next two days. It's a simple question: What makes every 'a' an 'a'?

  I don't mean philosophically. I mean practically. Consider the 'a' you are reading right now. It's what we call a double-storey 'a': it has a closed bowl at the bottom and an arch over the top. Now, picture the 'a' you write by hand, or the one you see in geometric sans-serifs like Futura. That's a single-storey 'a': a simple circle with a tail on the right.

  Put them side by side. They share almost no geometry. The double-storey has a roof; the single-storey does not. The double-storey has a spine; the single-storey is open. There is no common stroke you can point to and say, "That is the essence of 'a'-ness." And yet, neither of you hesitated. You read both as the same letter instantly, even if I drew them in a font neither of you has seen before.

  So, where is the 'a'?

  For the next two days, I want us to commit to a specific answer. I propose that an 'a' is not a shape. It is a role. It is a position in a system of differences.

  Think of it like a chess knight. You can carve a knight out of wood, or glass, or cast it in iron. It might look like a horse, or an abstract wedge. But it is only a knight because of the moves it is allowed to make within the rules of the game. Similarly, I suggest that a letterform is only an 'a' because of the job it performs within the system of reading. It occupies a region in a space of styles, not a fixed point on a grid.

  Now, I know what some of you are thinking. I know there are people in this room—people whose work I have admired for twenty years—who have no patience for theory. You might be thinking, "Just tell me where to put the ink." And I understand that. But if my claim is true, it comes with a cost. I need to pay that cost openly.

  If the letter is a role rather than a shape, then the designer does not own the letter. We do not dictate meaning; we propose it. We build the vessel, but the reader's mind provides the water. It means that typographic perfection is impossible, because reading is subjective. It means that when we argue about whether a glyph 'works', we aren't arguing about geometry; we're arguing about whether the reader accepts the contract we're offering.

  For the scientists here, this means the category isn't in the stimulus; it's in the response. For the designers, it means our authority is borrowed from the reader. And for the students, it means you aren't just learning to draw shapes; you're learning to negotiate a relationship.

  This is a risky stance. It relinquishes control. It admits that the 'a' lives as much in your perception as it does in my outline. But it is the only stance that explains why the double-storey and the single-storey can coexist without contradiction.

  So, here is my invitation. Over the next two days, don't just present your work; test this contract. When you show a new typeface, ask not just "Is this beautiful?" but "Does this fulfil the role?" When you present data on perception, ask not just "How fast?" but "What was recognised?"

  We are here to map the boundaries of that space. We may not agree on where the lines are drawn. But if we are lucky, we might agree on why we are drawing them.

  Because the letter isn't found in the shape we draw, but in the recognition we share.

  Thank you, and let's begin.
