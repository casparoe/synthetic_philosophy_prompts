answer: |-
  This is an excellent puzzle because it exposes the "technical debt" in the architecture of modern sports ethics. As a backend engineer, you are looking for a consistent schema—a set of constraints that validates inputs (athletes) against a rulebook. You have correctly identified that the validation logic throws exceptions that don't match the documented error messages.

  The short answer is that the practice is not resting on a single coherent moral theory. It is resting on a **pragmatic compromise** codified in a way that allows administrators to toggle between conflicting principles depending on which one yields the desired outcome for a specific substance.

  However, to give you the rigorous reconstruction you asked for, we need to dig into the source code. Here is the breakdown of the implicit theory, the contradictions, and the underdetermination.

  ### 1. Candidate Principles (The "Documentation")

  If we ask the World Anti-Doping Agency (WADA) or similar bodies what they are doing, they usually offer three distinct justifications. In your terms, these are three different validation functions that *should* be mutually exclusive but are often run in parallel.

  1.  **The Health Protection Principle:** The rules exist to prevent athletes from harming themselves.
      *   *Failure Mode:* As you noted, altitude tents carry risks (polycythemia), and creatine is safe. Many banned substances (like low-dose beta-blockers in archery) are harmless to healthy people. Conversely, rugby players are not banned despite high rates of long-term neurological damage. Health is a constraint, but not the primary one.
  2.  **The Fairness Principle (Equality of Opportunity):** The rules exist to prevent athletes from gaining an unfair advantage.
      *   *Failure Mode:* This doesn't explain why natural advantages (Eero Mäntyranta's genetic mutation for high hemoglobin) are legal, while artificial ones are not. It also doesn't explain why wealthy nations can build legal altitude chambers but poor nations cannot.
  3.  **The "Spirit of Sport" Principle (Virtue Ethics):** The rules exist to preserve the specific virtues the sport is meant to test (diligence, natural talent, will).
      *   *Failure Mode:* This is notoriously vague. It functions as a "catch-all" exception handler. It implies sport is a moral practice, not just a physical one.

  **The Critical Discovery:** The WADA Code (Section 4.3.1) explicitly states that a substance is banned if it meets **any two of these three criteria**.
  *   This is the philosophical "smoking gun." It means the system is **disjunctive**. It does not need a consistent theory. It only needs a majority vote among incompatible principles. This explains why your cousin's rules feel incoherent: they are the output of a system designed to maximize regulatory flexibility rather than moral consistency.

  ### 2. Reconstructing the Implicit Theory (The "Runtime Logic")

  Despite the disjunctive criteria, the *application* of the rules reveals a more specific, albeit unstated, operating theory. If we ignore the documentation and look at the code execution, the practice is committed to **The Integrity of the Adaptive Pathway.**

  Here is what the rulebook implicitly believes:

  **A. What the Body Is For**
  The body is not a vessel to be filled with performance (like a gas tank); it is a control system to be tuned. The rules distinguish between **signaling** and **overriding**.
  *   *Legal (Altitude Tent):* You create an environmental signal (hypoxia). The body's endogenous systems *choose* to respond by making EPO and red blood cells. The body remains the "agent" of the change.
  *   *Illegal (Blood Doping/Exogenous EPO):* You bypass the signaling mechanism. You inject the output directly. The body is bypassed.
  *   *The Theory:* Sport tests the efficiency of the body's adaptive response to stress, not the athlete's ability to source external physiological overrides.

  **B. What Counts as "Normal Functioning"**
  The Therapeutic Use Exemption (TUE) system relies on a **Species-Typical Baseline**.
  *   If your testosterone is below the 5th percentile for your sex/age due to pathology, restoring it to the 50th percentile is "therapy" (restoring normal function).
  *   If your testosterone is at the 50th percentile and you raise it to the 95th, that is "enhancement."
  *   *The Contradiction:* This assumes there is a "default" human configuration that is fair. The hyper-androgenism rules (e.g., Caster Semenya) complicate this by implying that *some* natural configurations are "too high" to be fair in female categories. This suggests the "Normal" isn't biological; it's **regulatory**. The body is "normal" only insofar as it fits the eligibility criteria of the competition class.

  **C. What Fairness Means**
  Fairness is not equality of *potential*; it is equality of *access to the means of improvement*.
  *   Everyone *can* buy creatine. Everyone *can* sleep in a tent (theoretically). Not everyone can access black-market EPO without detection.
  *   More deeply, fairness is defined as **Lusory Attitude** (a term from philosopher Bernard Suits). Sport is a voluntary acceptance of unnecessary obstacles. We agree *not* to use motorcycles in a marathon. Doping is treated as using a motorcycle. The fairness is in the shared agreement to accept the limitation.

  ### 3. Rival Views Ruled Out

  By enforcing this specific rulebook, the practice quietly rules out three coherent philosophical positions:

  1.  **Libertarian Bodily Autonomy:** The view that "my body, my choice" applies to performance. Strict liability overrides this. You are responsible for substances you didn't knowingly take. The system asserts that participation in sport is a waiver of certain bodily privacy rights.
  2.  **Transhumanism / Enhancement Permissivism:** The view that improving human capacity is inherently good. The rules assert that there is a "human" capacity that must be preserved as the metric of the sport.
  3.  **Radical Egalitarianism:** The view that all advantages, including genetic ones, should be neutralized. The rules accept genetic luck as "fate" but pharmacological luck as "cheating."

  ### 4. Strict Requirements vs. Accidental Fits

  You asked to separate what the rules require from what they merely fit.

  *   **Strict Requirement:** The distinction between **Endogenous** (produced inside) and **Exogenous** (introduced outside) is the hard technical constraint. The tests look for isoforms of hormones that distinguish lab-made from body-made. The rules *must* track this distinction to be enforceable.
  *   **Accidental Fit:** The "Health" justification. Many banned substances are not unhealthy at therapeutic doses. Many legal training methods (extreme weight cutting, overtraining) are very unhealthy. The health argument is often a rhetorical shield used to justify bans that are actually about "Spirit of Sport."
  *   **Accidental Fit:** The "Natural vs. Artificial" distinction. As you noted, altitude tents are artificial. The rule isn't about the *tool*; it's about the *physiological pathway*. If a tool triggers an internal adaptation, it's often legal. If it replaces the adaptation, it's illegal.

  ### 5. Philosophical Underdetermination

  This is the most critical part for your dataset. There are places where the rulebook is **underdetermined**, meaning incompatible theories license the exact same rules.

  **Case Study: Caffeine**
  *   *Theory A (Health):* Caffeine is safe, so it's allowed.
  *   *Theory B (Fairness):* Caffeine is ubiquitous and cheap, so banning it would punish poor athletes.
  *   *Theory C (Spirit):* Caffeine is a dietary staple, not a "drug."
  *   *Result:* Caffeine is monitored but not banned.
  *   *Underdetermination:* We cannot know *why* it is legal. If new evidence showed caffeine was harmful (Theory A fails), would it be banned? Or is it legal because it's "traditional" (Theory C)? The rulebook doesn't say.

  **Case Study: Strict Liability vs. TUE**
  *   *The Contradiction:* Strict Liability says "Intent doesn't matter; the substance is in you, you are guilty." TUE says "Intent/Medical Need matters; if you have a prescription, you are innocent."
  *   *The Resolution:* This is not a philosophical resolution; it is an **epistemic** one.
      *   Strict Liability is a **procedural rule** to make testing feasible. If testers had to prove intent (mens rea), no one would ever be caught.
      *   TUE is an **ontological exception**. It admits that the presence of the substance does not always indicate a violation of the "Adaptive Pathway" theory.
      *   *Underdetermination:* The system doesn't know if it is punishing *moral guilt* (cheating) or *state of being* (advantage). If it were moral guilt, Strict Liability is unjust. If it is state of being, TUE is inconsistent (why allow the advantage for the sick but not the healthy?). The practice hedges: it punishes the state to ensure enforceability, but allows exceptions to avoid public relations disasters regarding health.

  ### 6. Counterfactuals: Swapping the Presuppositions

  If we changed the underlying theory, the rules would break in specific ways.

  **Scenario A: The Enhancement-Permissive View (The "Open Class")**
  *   *Presupposition:* The goal of sport is to see the maximum possible performance, regardless of means. The body is a platform to be upgraded.
  *   *Rule Changes:*
      *   Abolish the Prohibited List.
      *   Create weight/tech classes (like F1 or powerlifting). "Class A: Natural," "Class B: Pharmacologically Assisted."
      *   TUEs become irrelevant (everyone can take everything).
      *   *Consequence:* Sport becomes a contest of R&D budgets and genetic engineering. The "human" element becomes secondary to the "support system."

  **Scenario B: The Radical Fairness View (Neutralizing Natural Advantage)**
  *   *Presupposition:* Fairness requires equality of *potential*, not just opportunity. Genetic luck is as unfair as blood doping.
  *   *Rule Changes:*
      *   Genetic screening for all athletes.
      *   **Handicapping:** Athletes with "favorable" mutations (e.g., ACTN3 fast-twitch gene, high VO2 max potential) are either barred or must take "suppression" drugs to lower them to the baseline.
      *   Altitude tents would be banned because not everyone has access to them (unequal resource), but also because they alter physiology away from the baseline.
      *   *Consequence:* Elite sport as we know it ends. We no longer celebrate the "best" humans; we celebrate the "most average" humans who trained the hardest. The spectacle of superhuman feats disappears.

  ### 7. Conclusion: The "Modus Vivendi"

  To answer your core question: **The practice does not need a single theory.**

  It functions as a **Modus Vivendi** (a way of living together). It is a political settlement between:
  1.  **Purists** who want sport to measure "natural" talent.
  2.  **Medicalists** who want to protect athlete health.
  3.  **Administrators** who need enforceable rules (Strict Liability).
  4.  **Lawyers** who need to avoid discrimination lawsuits (TUEs).

  The "contradictions" you see (altitude tents vs. blood doping, strict liability vs. TUE) are not bugs; they are features of a system designed to keep these four groups from walking away.

  *   **Altitude tents** are allowed to keep the Purists happy (it feels like "training").
  *   **Blood doping** is banned to keep the Medicalists happy (it's dangerous) and the Purists happy (it feels like "cheating").
  *   **Strict Liability** is there for the Administrators (ease of enforcement).
  *   **TUEs** are there for the Lawyers (anti-discrimination compliance).

  If you explain this to your cousin, the takeaway is this: The anti-doping code is not a moral philosophy; it is a **regulatory compromise**. It assumes the body should be the primary engine of performance, but it defines "body" in a way that conveniently excludes medical necessities while including technological conveniences that don't trigger the specific biological markers of "doping." It is philosophically messy because it is trying to solve a political problem, not a logical one.
