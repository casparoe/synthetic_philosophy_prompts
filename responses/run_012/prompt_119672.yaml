  **7. Being bored**
  *   **Gradient Score:** 9/10 (Psychological engagement fades continuously.)
  *   **Safety Score:** 7/10 (Attention fluctuates, creating margins for error.)
  *   **Vulnerability Score:** 8/10 (The argument applies strongly due to psychological vagueness.)
