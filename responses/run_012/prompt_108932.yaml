answer: |-
  # A Decision Tree for Ontologies of Time

  **Instructions:** Start at the root. Answer each question based on your metaphysical commitments, not your preferred label. Follow the branch to your leaf.

  ```text
  START: Is there an objective, frame-independent fact 
         about which events are strictly 'present'?
         │
         ├── YES ──► [1] NEO-LORENTZIAN PRESENTISM
         │           Awkwardness: Posits undetectable absolute 
         │           simultaneity, rendering Lorentz invariance 
         │           a conspiracy of measurement.
         │
         └── NO ──► Are tensed facts (past/present/future) 
                    fundamental to reality (A-Theory)?
                    │
                    ├── NO ──► [2] ETERNALISM / BLOCK UNIVERSE
                    │          Awkwardness: Renders the 'passage' 
                    │          of time a psychological illusion 
                    │          rather than physical.
                    │
                    └── YES ──► Is existence absolute (the same 
                                for all observers)?
                                │
                                ├── YES ──► Do future events exist?
                                │         │
                                │         ├── NO ──► [3] GROWING BLOCK
                                │         │          Awkwardness: Requires a 
                                │         │          'leading edge' of reality 
                                │         │          propagating at undefined speed.
                                │         │
                                │         └── YES ──► [4] MOVING SPOTLIGHT
                                │                    Awkwardness: Adds an 
                                │                    ontologically redundant 
                                │                    property to an already 
                                │                    full block.
                                │
                                └── NO ──► Can contradictory tensed facts 
                                           obtain across perspectives?
                                           │
                                           ├── YES ──► [5] FRAGMENTALISM
                                           │           Awkwardness: Abandons the 
                                           │           requirement that reality 
                                           │           must be globally consistent.
                                           │
                                           └── NO ──► [6] RELATIVISED PRESENTISM
                                                       Awkwardness: Risks solipsism; 
                                                       no shared world, only 
                                                       intersecting perspectives.
  ```

  ***

  ## Commentary on the Logical Space

  ### 1. The Transitivity Trap (Rietdijk–Putnam)
  The argument that tripped your group relies on chaining the relation *'is real for'* across different frames of reference. It assumes transitivity: if event $E$ is real for Observer $A$, and $A$ is real for Observer $B$, then $E$ is real for $B$.
  *   **The Hinge:** If you deny transitivity, the argument collapses. **Fragmentalists** explicitly deny this: reality is fractured into perspectives that do not fuse into a single consistent whole. **Relativised Presentists** may also deny it, arguing that 'real for' is not a single relation but indexed to a worldline.
  *   **The Consequence:** If you accept transitivity *and* deny a privileged frame, you are pushed inexorably toward **Eternalism**. If you wish to remain a Presentist without a privileged frame, you must break the chain.

  ### 2. Indistinguishable Leaves
  There are pairs of positions this tree separates metaphysically, but which physics cannot distinguish.
  *   **Eternalism vs. Moving Spotlight:** These are empirically identical. Both agree all events exist; they disagree only on whether 'presentness' is a fundamental, moving property (Spotlight) or a mere indexical like 'here' (Eternalism). Many physicists regard the Spotlight as otiose metaphysics.
  *   **Relativised Presentism vs. Fragmentalism:** The boundary is porous. If two observers disagree on the tense of an event, is it because existence is relative (Presentism) or because contradictory facts co-obtain (Fragmentalism)? The observational consequences are the same; the difference lies in how you handle the contradiction.

  ### 3. Unoccupied Logical Space
  There are combinations in this space that appear empty.
  *   **Absolute Existence + No Tensed Facts + Future Does Not Exist:** (Incoherent). If tensed facts are not fundamental (B-Theory), there is no metaphysical ground to distinguish the future from the past. To say the future 'does not exist' without tensed facts is to make a distinction without a difference.
  *   **Objective Now + Compatible with Special Relativity:** (Physically Unmotivated). Special Relativity explicitly denies a frame-independent simultaneity. To hold this is to claim SR is incomplete (Neo-Lorentzian) or to confuse it with the 'Cosmic Time' available in some General Relativity cosmologies (which is not fundamental to spacetime structure).
  *   **Relative Existence + No Contradictions + Future Exists:** (Unexplored/Unattractive). This would imply the future exists for me but not for you, yet we cannot contradict each other. This view struggles to explain how we interact with a future that is only 'real' relative to some observers but not others.

  ***

