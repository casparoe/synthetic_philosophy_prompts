      *   **Propensity:** Probability = physical disposition/tendency. Good for quantum mechanics, but metaphysically mysterious.
      *   **The Housemate's Argument:** She sounds like she's describing David Lewis's *Principal Principle*. Lewis distinguishes between *credence* (subjective) and *chance* (objective). The Principal Principle says: "Your credence in $A$, given that the chance of $A$ is $x$, should be $x$."
      *   **The User's Counter:** "Either it decays or it doesn't." This is the *determinist* objection to chance. But quantum mechanics suggests indeterminism. If the world is fundamentally indeterministic, "50% chance" isn't just ignorance; it's a description of the physical state.
      *   **The Circularity Charge:** The housemate says chance is "the credence you'd have if you knew the entire history." This sounds like *Idealised Subjectivism* or a Humean reduction of chance. It's not necessarily circular if defined carefully (e.g., via best system analysis), but it can feel that way.

  3.  **Address Question 1: Where have you gone wrong?**
      *   *The "Either/Or" Fallacy:* The user says "either it decays or it doesn't, there's no third thing." In classical physics, this is true (determinism). In quantum physics (which the housemate studies), this is likely false. Indeterminism suggests the future is genuinely open, not just unknown.
      *   *Misunderstanding the Housemate's Point:* The housemate isn't necessarily saying probability is *only* in her head. She's likely invoking the *Principal Principle*. She acknowledges objective chance exists, and rational agents *should* align their beliefs with it.
      *   *Subjectivism doesn't deny reality:* Being a subjectivist about *probability* doesn't mean denying physical facts. It means treating probability statements as statements about information states. However, if the physics is indeterministic, a pure subjectivist view struggles to explain *why* everyone converges on 50% for that nucleus.
      *   *The "Making it Up" Fear:* Subjectivists aren't free to pick any number. They must be *coherent* (no Dutch Books) and often use *Reference Classes* or *Maximum Entropy* principles to set priors.

  4.  **Address Question 2: Frequentism for Betting?**
      *   No. Frequentism is actually terrible for single-case betting (e.g., "Will this specific nucleus decay?"). There is no long run for a single event.
      *   Subjectivism (Bayesianism) is actually the standard for decision theory and betting (Ramsey/De Finetti). You bet according to your credence.
      *   Objectivity in betting comes from *calibration* and *coherence*, not from the frequency interpretation itself.

  5.  **Address Question 3: Avoiding Making Numbers Up?**
      *   Constraints on Subjective Probability:
          *   Coherence (axioms of probability).
