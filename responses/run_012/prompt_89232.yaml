answer: |-
  It is a truth universally acknowledged that a physicist in possession of a good theory must be in want of a bit of philosophical superiority. I sympathise entirely with your position; debating probability interpretations with a physicist is rather like debating theology with a vicar—they have a vested interest in the dogma.

  However, to answer your question directly: you have stumbled on a genuine philosophical minefield, but I am afraid your housemate has the better of the argument on the specific point of radioactive decay, whilst you are on firmer ground regarding the nature of betting. Here is where your reasoning has gone slightly awry, and how you can defend your subjectivist corner without resorting to frequentism.

  ### 1. The "Either/Or" Trap
  Your central claim is: *"Either it decays or it doesn't, there's no third thing called a chance."*

  This is the classical, deterministic view of the universe. If we were discussing a coin toss, you would be quite right. A coin is governed by Newtonian mechanics; if we knew the wind speed, the thumb force, and the air resistance, the probability would indeed be 0 or 1. The 50% is purely a measure of our ignorance (epistemic probability).

  However, your housemate is talking about quantum mechanics. Under the standard Copenhagen interpretation (which most working physicists use), the universe is not deterministic. The nucleus does not have a hidden schedule determining when it will pop. The 50% is not a measure of her ignorance; it is a description of the physical state of the nucleus itself (ontic probability).

  By insisting the probability is "just in her head," you are effectively arguing for hidden variables—a position that Bell's Theorem and subsequent experiments have made very difficult to sustain. So, on the physics, she is right: the chance is a fact about the world, not merely a fact about her belief.

  ### 2. Decoding Your Housemate's "Circularity"
  You mentioned she defines chance as *"the credence you'd have if you knew the entire history of the world."* This sounds circular to you, but she is likely paraphrasing what the philosopher David Lewis called the **Principal Principle**.

  Lewis distinguished between *credence* (what you believe) and *chance* (what the world does). The Principal Principle states that a rational agent's credence should align with the known objective chance. If the objective chance of decay is 0.5, your belief should be 0.5.

  Her definition is a bit sloppy (if you knew the *entire* history, you'd know if it decayed, making the probability 1 or 0), but her point is that objective chance acts as a "magnet" for rational belief. She isn't sneaking objectivity in through the back door; she is acknowledging that whilst probability is a tool for agents, the *values* of that tool are constrained by physical reality.

  ### 3. Do You Need Frequentism for Betting?
  Absolutely not. In fact, switching to frequentism would make you a worse bettor.

  Frequentism defines probability as the long-run relative frequency of an event. This works fine for flipping a coin a thousand times. It falls to pieces when you ask: *"What is the probability that this specific nucleus decays in the next hour?"* There is no long run for a single, unique event. A frequentist technically cannot assign a probability to a single case without referencing a class of similar events, which gets messy very quickly.

  Subjectivism (specifically Bayesianism) is actually the standard framework for decision theory and betting. Bruno de Finetti, a staunch subjectivist, proved that if your degrees of belief do not obey the laws of probability, you can be subjected to a "Dutch Book"—a series of bets that guarantees you a loss regardless of the outcome.

  So, to be objective in betting, you do not need frequentism. You need **coherence**.

  ### 4. Can a Subjectivist Avoid "Making Numbers Up"?
  This is your strongest worry. If probability is just belief, can't I just say the nucleus has a 90% chance of decaying because I feel like it?

  The answer is no, because a rational subjectivist is constrained by two things:
  1.  **Coherence:** As mentioned, your probabilities must sum to 1, obey Bayes' theorem, etc., or you will lose money in the long run.
  2.  **Calibration:** If you claim 50% confidence in events, they should occur roughly half the time. If you claim 90% confidence, they should occur 9 out of 10 times.

  Furthermore, most modern subjectivists use **Objective Priors** (such as the Principle of Maximum Entropy). This means that if you have zero information, there is a mathematically "correct" uninformative prior to use. If you and I have the same evidence and use the same rational updating rules, our subjective probabilities should converge. They are subjective in *location* (in the mind), but not arbitrary in *value*.

  ### The Verdict
  You have gone wrong by treating a quantum event as if it were a classical coin toss. The 50% chance of decay is likely a physical propensity, not just ignorance. Your housemate is correct that the number is anchored in the world.

  However, she is being a bit smug about the implications. Even if the *chance* is objective, the *probability* we use to navigate the world is still a map, not the territory. When it comes to placing a wager, you are the one with the better framework. Frequentism cannot handle single-case bets; subjectivism can, provided you remain coherent.

  **How to settle the row:**
  Concede the physics to her (admit that quantum indeterminacy makes the chance a real feature of the nucleus), but hold your ground on the decision theory. Tell her: *"Fine, the chance is physical. But when I actually put money on the table, I'm not betting on frequencies that never happen, I'm betting on my credence. I'll stay a subjectivist because it keeps me solvent, whilst you can stay a propensity realist and explain to me what a 'physical tendency' actually looks like under a microscope."*

  That ought to take the wind out of her sails.
