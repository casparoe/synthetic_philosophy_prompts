      Also, regarding Epistemicism and "machines": Williamson argues that knowledge requires a margin for error. If you know you are bald, you must be bald in nearby possible worlds. At the boundary, this fails. So you can't know. It's not about instruments; it's about the nature of knowledge itself. I must make this clear.

