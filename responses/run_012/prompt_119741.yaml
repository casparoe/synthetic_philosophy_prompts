          *Prediction:* If Priya holds a strict view of "Obligation" (Legal/Contract/Standard of Care), she will say **No Causation** because the duty was merely internal and obsolete ("formality"). If she views "Internal Protocol" as sufficient Obligation, she says **Causation**.
          Given she's a philosopher, she likely distinguishes between *moral* blame and *causal* attribution based on *objective* norms. The erosion of the norm ("nobody does it") suggests the obligation had vanished socially even if it existed on paper.

