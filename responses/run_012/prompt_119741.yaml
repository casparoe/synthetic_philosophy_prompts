      *   *Applying Candidate 4 (Control + Expectation):*
          *   Control: Yes.
          *   Expectation: "Nobody... does it anymore." "Formality." This weakens the *expectation* norm.
          *   *Prediction:* **Ambiguous/No Causation.** If the norm has eroded, the expectation vanishes.

      *   *Refining the Survivors:*
          *   Rule A (Strict Duty): Requires Legal/Contractual/Professional Duty. (Fits 1, 3 vs 2).
          *   Rule B (Effective Control): Requires But-For + Ability to Prevent. (Fits 4 as No).
          *   Rule C (Normative Expectation): Requires But-For + Social/Role Expectation. (Fits 2 as No).

          *Actually, the strongest distinction is between Rule 1 (Duty-based) and Rule 2 (Inevitability-based).*
          Wait, Case 4 handles Inevitability. Cases 1, 2, 3 handle Duty.
          So Priya's rule *must* combine them.
          **Priya's Likely Rule:** "An omission causes a harm if and only if: (1) The harm would not have occurred had the action been taken (Counterfactual Dependence), AND (2) The agent was under a specific normative obligation (role-based, contractual, or legal) to take that action, AND (3) The action would have been effective in preventing the harm (No Overdetermination)."

          *Let's check the Water Case against this Combined Rule:*
          1.  Counterfactual: Yes (sampling -> switch -> safe).
          2.  Obligation: **Problematic.** Internal protocol only. Counsel says no reg req. "Nobody does it." Is an internal protocol a "normative obligation" in Priya's sense? In Case 1 (Boiler), it was a contract. In Case 3 (Anesthesia), it was professional protocol (likely legal/standard of care). In Water Case, it's internal policy + industry abandonment.
