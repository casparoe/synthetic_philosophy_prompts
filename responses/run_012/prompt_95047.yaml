answer: |-
  Here is the specification sheet for the accuracy-first program. I have broken this down into the required deliverables (the "Spec"), the verdict on your process-question, and the structural tension you asked for.

  ### Part I: The Spec (Required Deliverables)

  To count as a viable theory within the accuracy-first family, a view must take a stance on the following five pressure points. I have classified each requirement as **Non-Negotiable** (core to the reductionist ambition of the program) or **House Style** (contingent on specific mathematical choices, e.g., Joyce vs. Pettigrew vs. Levinstein).

  #### 1. The Sealed Room Coin (Unverifiable Propositions)
  *   **The Case:** A coin is flipped in a sealed room and destroyed. No evidence will ever exist regarding the outcome.
  *   **The Requirement:** The theory must assert that accuracy norms **still apply**.
  *   **The Rationale:** Accuracy-first is *alethic*, not *pragmatic* or *evidential*. The value of a credence is constituted by its relation to the truth, not its relation to evidence or action. If the theory says norms vanish here, it collapses into evidentialism.
  *   **Status:** **Non-Negotiable.** This is the hardest pill for pluralists to swallow. If you carve out an exception here, you have admitted that accuracy is not the *sole* fundamental epistemic value.
  *   **What 'Accuracy' is doing:** It is serving as the constitutive norm of belief. Even if the score is never tallied by an agent, the credence is objectively better or worse depending on the world-state.

  #### 2. Calibration vs. Refinement (The Two Forecasters)
  *   **The Case:** Forecaster A says "30%" every day (perfectly calibrated over time). Forecaster B says "30%" on days with specific atmospheric pressure readings (sharper, sometimes wrong).
  *   **The Requirement:** The theory must prefer **Forecaster B** (assuming B is well-calibrated *conditional* on their evidence).
  *   **The Rationale:** Strictly proper scoring rules (like the Brier score) decompose into Calibration + Resolution. Accuracy-first values *resolution* (sharpness). A credence of 0.5 on a coin that is actually biased 0.9 is less accurate than a credence of 0.9, even if the 0.5 agent is "calibrated" over a mixed set of coins.
  *   **Status:** **Non-Negotiable.** This follows directly from the mathematical definition of *strict propriety*. If a theory prefers the uninformative forecaster, it is not using a proper scoring rule and cannot derive Probabilism.

  #### 3. Higher-Order Credences (Reflection)
  *   **The Case:** Your credence in $P$ vs. your credence that your future credence in $P$ will be $x$.
  *   **The Requirement:** The theory must enforce a version of the **Reflection Principle** (or show why violating it is accuracy-dominated).
  *   **The Rationale:** If your current credence expects your future credence to be more accurate, accuracy norms demand you adopt it now. A theory that allows you to knowingly hold a less accurate state when a more accurate one is foreseen is self-undermining.
  *   **Status:** **Non-Negotiable.** However, *how* it is derived is House Style. Some derive it from diachronic dominance; others argue it requires specific constraints on how accuracy is measured for self-locating beliefs.

  #### 4. Imprecise Credences (Intervals)
  *   **The Case:** An agent reports $[0.4, 0.6]$ and refuses to sharpen to $0.5$.
  *   **The Requirement:** The standard theory must call this **irrational** (or at least sub-optimal).
  *   **The Rationale:** Standard accuracy arguments rely on convexity. If a scoring rule is strictly proper for point-values, a set of probabilities (an interval) will almost always be accuracy-dominated by a specific point within that set. To save intervals, you must change the mathematics of the scoring rule (e.g., imprecise scoring rules), which weakens the dominance arguments.
  *   **Status:** **House Style.** The "Purist" Joyce/Pettigrew line says intervals are irrational. There are extensions (e.g., by Schoenfield or Levinstein) that try to accommodate them, but they pay a cost in the elegance of the dominance proof. If you want to stay in the core family, you must treat point-values as the norm.

  #### 5. Group Credences (Committees)
  *   **The Case:** A committee must aggregate five individual credence functions into one.
  *   **The Requirement:** The theory must prescribe an aggregation rule that **preserves accuracy properties** (typically Geometric Pooling, not Linear).
  *   **The Rationale:** Linear pooling (averaging) can lead to a group credence that is accuracy-dominated even if no individual is. Geometric pooling (averaging log-odds) tends to preserve the property of not being dominated. The theory must explain why the group isn't just a bag of individuals but a single epistemic agent subject to the same norms.
  *   **Status:** **House Style.** The demand for *an* aggregation norm is non-negotiable; the preference for Geometric over Linear is a technical consequence of specific scoring rules (Log vs. Brier).

  ---

  ### Part II: The Process Question

  **"The fix for the unverifiable cases is to grade the process rather than the credence... tell me whether that's a dead end."**

  **Verdict:** It is a **dead end** for the accuracy-first *program*, though it may be a viable move for epistemology generally.

  **Why:** The selling point of accuracy-first is *reductionism*. It claims to derive norms of belief (Probabilism, Conditionalization) from the single value of Accuracy applied to the *belief state*.
  1.  **Loss of Leverage:** If you grade the *process* (e.g., "did they weigh the evidence well?"), you are no longer evaluating the fit between mind and world. You are evaluating the fit between mind and *evidence*. This surrenders the alethic ground. You have moved from Accuracy-First to Evidentialism or Reliabilism.
  2.  **The Score Problem:** You noted you "can't say what the score of a process is." This is fatal. The power of the accuracy program comes from the mathematical tractability of scoring *states* against *truth values*. Processes are causal/historical. There is no clean "truth value" for a process, only for the output. Without a scoring function, you cannot run the dominance arguments that generate the norms.
  3.  **The Sealed Room:** Grading the process doesn't actually solve your nervousness about Case 1. If the coin is destroyed, the process that led to the belief is also unverifiable. If you say "the process was rational," you are appealing to *ex ante* reasonableness, which is exactly the pluralist concession that accuracy is not the only value.

  **Conclusion:** If you grade process, you leave the accuracy-first family. You become a pluralist who thinks accuracy is one value among others (like justification or warrant).

  ---

  ### Part III: The Structural Tension

  You asked for two desiderata on the list that cannot be satisfied together. Based on your hint about regularity and penalties, here is the conflict that threatens the internal coherence of the program.

  **The Conflict:** **Boundedness** vs. **Strict Regularity via Dominance**

  1.  **Desideratum A: Boundedness (Finite Penalties).**
      *   *Motivation:* We want a theory where epistemic sin is gradable and recoverable. No single error should render an agent's entire epistemic state "infinitely" bad. We want to allow for the possibility of learning from mistakes. This suggests using a scoring rule like the **Brier Score**, which is bounded (maximum penalty is finite).
  2.  **Desideratum B: Strict Regularity (Anti-Dogmatism).**
      *   *Motivation:* The theory should rule out assigning credence 0 or 1 to any contingent proposition. You should never be *certain* of empirical matters. This is usually derived by showing that any credence of 0 or 1 is *accuracy-dominated* by a nearby credence (e.g., 0.01).
  3.  **The Argument for Incompatibility:**
      *   To make 0 and 1 *strictly dominated* for all possible worlds using a dominance argument alone, you typically need an **unbounded** scoring rule (like the **Logarithmic Score**). In the Log Score, assigning 0 to a truth yields $-\infty$ accuracy. This infinite penalty ensures that *any* non-zero credence dominates the 0 credence.
      *   If you choose **Boundedness** (Brier), the penalty for being 100% wrong is finite (e.g., 1.0). While 0.01 might still dominate 0 in expected accuracy, the *force* of the dominance argument weakens. In some specific formulations of the dominance theorem (like Joyce's original 1998 argument), avoiding infinite penalties makes it mathematically difficult to prove that *all* non-probabilistic (or dogmatic) states are dominated without adding extra premises about the agent's possibility space.
      *   **The Result:** If you want the clean, hard dominance proof that forces Regularity, you usually need infinite penalties (violating Boundedness). If you want Finite Penalties (Boundedness), you lose the strict dominance proof for Regularity and must rely on expected accuracy arguments, which are weaker norms (they depend on the agent's current priors).

  **This is the crack in the foundation:** You cannot have a theory that guarantees you are never dogmatic *solely* through dominance arguments while also guaranteeing that no single mistake ruins your epistemic score forever.

  ---

  ### Part IV: The Workhorse Requirement

  **Which single requirement does the most work in ruling out alternatives?**

  **Answer:** **Strict Propriety.**

  **Why:**
  Strict Propriety is the mathematical condition that ensures a scoring rule incentivizes an agent to report their true credence. Formally, it means your expected accuracy is maximized *only* when you report your actual credence.

  *   **It rules out Truth-Seeking as a direct norm:** Without strict propriety, the norm would be "Believe 1 if True, 0 if False." This leads to opinionation (guessing). Strict propriety is the *only* thing that justifies holding a credence of 0.5 when you know the truth is 0 or 1.
  *   **It derives Probabilism:** The dominance theorems that prove "you must obey the probability axioms" rely entirely on the convexity properties guaranteed by strictly proper scoring rules.
  *   **It distinguishes the program:** Evidentialists can care about accuracy. Reliabilists can care about accuracy. Only the Accuracy-First program uses **Strict Propriety** to claim that the *mathematical structure of probability* is mandated by the *value of truth*.

  If you drop Strict Propriety, the machinery stops. You can no longer derive the norms from the value. You are left with a vague injunction to "be accurate," which is compatible with almost any epistemology. Strict Propriety is the engine; everything else is the chassis.
