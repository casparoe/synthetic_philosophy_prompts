prompt: |-
  I'm in a second-year seminar on epistemic rationality and we've spent the last three weeks on the accuracy-first program -- the move where you treat a credence as a thing that can be graded for how close it came to the truth, and then you try to get all your norms out of the demand that you not be accuracy-dominated. I find the machinery genuinely compelling and I'm not looking for a biblography or a reading list, I want the spec. Before I decide whether to stay inside this family or become a pluralist about epistemic value, write me the full list of what a theory in this family has to deliver: which cases it must get right, which distinctions it can't collapse, and which results or constraints it has to be consistent with -- each with the case or consideration behind it, plus your call on which requirements are non-negotiable and which are just house style of one camp.

  The cases I most want it to handle, because these are the ones that make me nervous: (1) a coin flipped in a sealed room and then destroyed, so nobody will ever learn the outcome and nothing hangs on it -- is a credence about that still subject to accuracy norms, and if so what is 'accuracy' even doing for us there; (2) two forecasters, one who says 30% every single day and is beautifully calibrated, one who is sharper but occasionally off -- if the theory has to prefer one, which and why; (3) a credence that is about your own credences, or about what your credence will be tomorrow after you've slept on it; (4) someone who reports an interval instead of a number ('somewhere between 0.4 and 0.6') and refuses to sharpen -- does the theory have to call them irrational, and is that a cost; and (5) a group, a comittee that has to hold one credence set rather than five. I also keep thinking the fix for the unverifiable cases is to grade the process rather than the credence, but then I can't say what the score of a process is, so tell me whether that's a dead end.

  And then the part I actually care about: flag any two desiderata on your list that you suspect can't be satisfied together, with the argument for why -- I half-expect there's a pair like that hiding in the regularity / finite-penalty area, or in whatever you're supposed to say about evidence you can never collect, and if the list itself contains an unsatisfiable pair then that's the result I want. Also tell me which single requirement does the most work in ruling out the alternatives, and go easy on scoring particular named views -- I'll do that part in class.
