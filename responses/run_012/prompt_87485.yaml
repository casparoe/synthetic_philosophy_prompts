prompt: |-
  hey, so I'm a second-year student on a political theory / philosophy of social science module and for next week's tutorial I have to bring in a handout that sorts out the possible views on one question. mine is the left/right one: is the distinction real, and what actually holds each side together? I've read enough encyclopaedia-level stuff about it already and I want something that goes past "some say it's a spectrum, some say it's a horseshoe" — so I'm asking you to act like a political theorist who actually works on ideology and has to teach this stuff, and to think carefully before you write, because the sorting questions are the whole thing.

  Please build me a decision tree / taxonomy of the positions. Start with a quick brainstorm — one line each on the candidate questions that could split the space — then commit to a tree. The branches have to be diagnostic, i.e. each node phrased as a question a classmate could answer without already knowing which position it leads to. Some angles I want on the tree, since they're the ones we kept circling in seminar:

  - is the glue supposed to be shared content, or can a side be held together purely by what it's against?
  - are you allowed an asymmetric account, where the two sides are held together by different things, or does the view have to explain both with the same mechanism?
  - is it one axis or at least two (economic / cultural), and if two, is left-right a real diagonal through them or just a misleading projection of one?
  - is left/right meant as a descriptive kind (a claim about how coalitions actually form and hold) or a normative kind (a claim about hierarchy and equality that could be right or wrong independently of who believes it)?
  - does anything survive if you strip out parties, leaders and media cueing — is there a left/right at the level of individual attitudes at all?

  Where you can, anchor a node in a concrete case rather than an abstraction: a voter whose positions don't line up at all, a politician who flips on their signature issue while their supporters stay put, a party that keeps its coalition together after abandoning the thing it was founded on.

  For the leaves I'd like to see, somewhere: an essence / single-disposition view, a bundle-of-unrelated-policies view, a coalitional view where the glue is elite coordination plus electoral incentives, a negative-partisanship view where the glue is the out-group, an expressive or identity view with pretty thin policy content, a two-axes view where left-right is the diagonal, and the eliminativist view that it's a seating chart we've reified. But dont force them in — if the logical space doesn't have room for one, or if one of those is really two views wearing a coat, tell me instead of wedging it in.

  Two things I specifically need. First, build it from the space and not from the names: give me the questions and the answer combinations they allow, then drop the actual positions into the cells. Second, note the empty cells — any combination of answers nobody occupies — and say in a few words whether that's because it's incoherent, unattractive, or just unexplored. And flag any two leaves your tree genuinely can't separate with these questions rather than faking a branch to pull them apart.

  Format: a nested list for the branching questions, then a table of the leaves with three columns — leaf, path through the tree, and its most awkward commitment in one sentence. Hard limit: 900 words total. Thanks!
