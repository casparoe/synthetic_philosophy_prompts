answer: |-
  Brainstorm:
  - Is the glue shared content, opposition, or elite coordination?
  - Must both sides share the same structural mechanism (symmetry)?
  - Is political space one-dimensional, two-dimensional, or non-existent?
  - Is the distinction descriptive (coalitions) or normative (values)?
  - Does the structure exist at the individual level absent elite cues?

  **Decision Tree**

  1.  **Does the Left/Right structure exist in individual attitudes absent elite cueing?** (Case: A voter isolated from media).
      *   **No:** Go to 4.
      *   **Yes:** Go to 2.
  2.  **Is the correlation of attitudes driven by a single underlying moral disposition?**
      *   **No:** Go to 3.
      *   **Yes:** Go to 5.
  3.  **Is Left/Right a real diagonal through two independent axes (economic/cultural) or a misleading projection?**
      *   **Real Diagonal:** Two-Axes View.
      *   **Misleading Projection:** Bundle View.
  4.  **Is the coalition held together by elite coordination/incentives or is the distinction merely a reified seating chart?**
      *   **Elite Coordination:** Coalitional View.
      *   **Reified Chart:** Eliminativist View.
  5.  **Is the cohesion based on shared positive content or opposition to the other side?** (Case: A party flipping signature issues but keeping voters).
      *   **Shared Content:** Essence/Single-Disposition View.
      *   **Opposition:** Negative-Partisanship View.

  **Taxonomy of Positions**

  | Leaf | Path through the Tree | Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **Essence** | Yes → Yes → Content | Must explain why voters stay when leaders abandon core values. |
  | **Negative Partisanship** | Yes → Yes → Opposition | Claims voters care more about hating enemies than policy outcomes. |
  | **Two-Axes** | Yes → No → Diagonal | Argues Left/Right is real but derivative of deeper economic/cultural splits. |
  | **Bundle** | Yes → No → Projection | Claims issue correlation is historical accident with no deep logic. |
  | **Coalitional** | No → Elite | Suggests ordinary voters have no ideology; elites manufacture coherence. |
  | **Eliminativist** | No → Reified | Asserts Left/Right is obsolete taxonomy like 'humours' in medicine. |

  **Analysis of Logical Space**

  **Empty Cells:** An "Individual-Level Eliminativist" (Yes → No → Reified) is incoherent; if the structure exists psychologically, it isn't merely reified history. An "Asymmetric Glue" node is largely unexplored; few theorize that the Left is content-based while the Right is opposition-based, though populism literature hints at this. It remains unattractive because it complicates comparative analysis without clear empirical payoff.

  **Indistinguishable Leaves:** Expressive/Identity views often collapse into Negative Partisanship here; both treat policy as secondary to group signaling. The tree cannot separate them without adding a question about whether identity precedes policy or vice versa. Additionally, the Descriptive/Normative distinction cuts across the tree rather than branching it; an Essence theorist could claim the disposition is either a fact of psychology or a moral ideal, making it a meta-commitment rather than a structural one. This taxonomy prioritizes ontological structure over normative status to maintain diagnostic clarity for empirical social science.
