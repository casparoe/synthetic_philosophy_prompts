answer: |-
  **Bottom line**
  This isn't a dispute about Buddhist texts; it's a collision between Western normative taxonomy and Buddhist soteriological metaphysics. The impasse persists because "consequentialism" presupposes a separation between act and outcome that the doctrine of karma explicitly denies. You cannot resolve this by better reading; you must change the question.

  **The two positions, stated fairly**

  *Side One (Consequentialist):* This view argues that Buddhist ethics is structurally utilitarian. The moral telos is clearly defined: the cessation of suffering (nirvana) for all sentient beings. The bodhisattva ideal demands agent-neutrality; since there is no substantial self, privileging one's own liberation over others' is irrational. Precepts are treated as heuristic guidelines subordinate to the goal of welfare maximization. A wise agent may violate a rule if doing so reduces overall suffering, mirroring the consequentialist override of deontological constraints. The moral weight of an action is determined by its contribution to the ultimate good, making the tradition fundamentally outcome-oriented.

  *Side Two (Non-Consequentialist):* This view argues that moral quality resides in the volition (cetana), not the outcome. Karma is individual and non-transferable; you cannot kill one to save five because the karmic seed planted in the mindstream is what matters, not the external body count. The path is about character transformation and uprooting defilements, not calculating aggregate welfare. Precepts function as constitutive constraints of the holy life, not mere rules of thumb. To judge actions by consequences is to remain trapped in the very craving for results that binds one to samsara. The ethics are virtue-based or deontological, grounded in the purity of motive.

  **Candidate diagnoses**

  The disagreement likely isn't about textual evidence, since both sides cite the same passages. It is structural. First, it could be a **Verbal Dispute**: both agree on the mechanics of karma but disagree on whether "consequentialism" is the right label for it. Second, it could be a **Scope Mismatch**: Side One looks at the cosmic scale (all beings), while Side Two looks at the individual scale (personal karma). Third, it could be a **Bedrock Intuition Clash**: Side One prioritizes welfare; Side Two prioritizes moral purity. Finally, there is your suspicion: the **Definition of Consequence**. Western consequentialism assumes outcomes are external states of affairs downstream from actions. Buddhist karma treats the mental imprint *as* the action's result.

  | Reading | If true, we'd expect... | What counts against it... |
  | :--- | :--- | :--- |
  | **Verbal** | Agreement on mechanics, fighting over labels. | Side One actually advocates maximizing; Side Two advocates constraints. |
  | **Scope** | Side One ignores individual karma; Side Two ignores universal liberation. | Both sides acknowledge both, but weigh them differently. |
  | **Bedrock** | Intractable moral disagreement (Welfare vs. Purity). | Both sides agree suffering is bad; they disagree on *why* killing is bad. |
  | **Definition** | Disagreement vanishes if "consequence" includes mental states. | Western consequentialism still requires separable states of affairs to maximize. |

  **My diagnosis, argued**

  I commit to the **Definition of Consequence** diagnosis, but radicalized: this is a **Category Error regarding Moral Ontology**. The debate fails because consequentialism requires a dualistic gap between the *instrument* (action) and the *goal* (outcome) that Buddhist metaphysics refuses to grant.

  Side One is correct that Buddhism is teleological; there is a goal (end of suffering). However, they mistake teleology for consequentialism. In standard consequentialism, the value of the act is extrinsic—it derives from a separate state of affairs it produces. In Buddhism, the value of the act is often intrinsic to the mental state it expresses and reinforces. When the tradition says intention is karma, it collapses the temporal distance between act and result. The "consequence" is the immediate hardening or softening of the mindstream, not just the external welfare produced.

  Side Two sees this but overcorrects by denying the teleological structure entirely. They are right that you cannot pool karma, but wrong to imply the outcome doesn't matter. The impasse exists because Side One tries to map a non-dualistic causal process onto a framework built for separable agents and states, while Side Two defends the tradition by denying the mapping rather than fixing the framework.

  Your suspicion is correct: the distinction stops doing clean work because "consequence" in karma is constitutive, not merely productive. A consequentialist calculus requires quantifiable, transferable units of value. Karma is neither. Therefore, calling it consequentialist isn't just imprecise; it misdescribes the moral machinery. The debate is stuck because both sides accept the Western taxonomy as the container, trying to force the Buddhist wine into it, rather than acknowledging the container is cracked.

  **What would count as progress**

  Progress requires abandoning the "-ism" question entirely. It is a heuristic that has exhausted its utility. Instead of asking "Is it consequentialist?", ask: "How does moral causality function here?"

  A productive reframing would distinguish between **Soteriological Efficiency** (does this lead to liberation?) and **Normative Justification** (why is this act right?). Side One conflates efficiency with justification; Side Two conflates justification with psychological purity. A formal result would show that Buddhist ethics operates on a **Perfectionist** model: the goal is the perfection of the agent's capacities, where "consequences" are internal markers of progress, not external goods to be maximized. If your committee can agree to analyze the *mechanism of moral causality* rather than the *label*, the cancellation effect will stop. If they cannot, the debate is purely tribal, and no textual argument will move it.
