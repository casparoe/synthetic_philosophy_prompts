prompt: |-
  There's a fight in Buddhist ethics that's been running for decades and I keep getting dragged into it — two of my committee members are on opposite sides of it, and their comments on my chapters have started to cancel each other out, which is how I ended up caring. The question: is Buddhist ethics a form of consequentialism or not? Same texts, same moves, nobody budges, and the debate has gotton more polite and less interesting every year. I don't want a verdict on who's right. I want a diagnosis of the impasse itself — what kind of disagreement is this, really?

  Take it seriously and think it through before you commit to anything. You're a philosopher who works on comparative ethics, knows the Buddhist material in detail, and is allergic to just slotting Buddhist ideas into Western -isms. Brainstorm the possible shapes this disagreement could have before you settle on one, and don't hedge into "both sides have a point." Also: no citations, no reading list — I've read the stuff, and I can't check references anyway.

  Here's the dispute as I see it. Side one points at the structure: the goal is the end of suffering for all beings; the bodhisattva defers their own liberation to help everyone else; the precepts get treated as rules of thumb a wise person can set aside when keeping them would do more harm than good; and since there's no fixed self, there's nothing that could ground a special license to privilege your own case. Agent-neutral, welfare-oriented, maximizing in spirit — consequentialist, or at least consequentialist-shaped.

  Side two points at what actually does the explanatory work: what makes an action good or bad is the intention behind it — the tradition's own slogan is that intention just is what karma consists in — and the precepts function as near-absolute constraints; you can't kill one to save five. The path is about uprooting craving and remaking character, not about maximizing some total. And karma isn't a quantity you can pool: it's personal, it ripens for the agent, it can't be transferred. On this reading it's closer to an ethics of motive or of virtue, and "consequentialist" gets the order of explanation backwards.

  My suspicion, which I'd like you to test rather than assume, is that both sides quietly import the idea that a "consequence" is something external to the act and downstream of it — and that once you notice how much of the karmic result is internal (the mental state is itself the karmic event; the change in character is part of the outcome), the distinction stops doing clean work, and that's why we're stuck. But maybe that's too clever by half, or maybe the real problem is somewhere else entirely.

  I want the structure of the disagreement diagnosed, not a survey of who said what. Write it up like this:

  - "Bottom line" — two or three sentences up front, plain English.
  - "The two positions, stated fairly" — about 150 words, each side in your own words, strong enough that a partisian of either would recognize themselves in it.
  - "Candidate diagnoses" — about 400 words. Lay out the plausible structures of the impasse: a purely verbal or taxonomic fight, two different questions wearing one name, a hidden interpretive dispute about what the texts actually commit to, a clash of bedrock intuitions neither side can argue for, a question that's simply ill-posed — plus anything I've missed. Then a small table with three columns: the reading, what we'd expect to see if it's true, and what would count against it.
  - "My diagnosis, argued" — about 400 words. Commit to one (or a combination), and defend it using what each side actually says.
  - "What would count as progress" — about 200 words: a distinction, a reframing, a textual argument, a formal result — or an honest case that nothing will move this, and why.
