answer: |-
  You have done what most professional philosophers struggle to do: you have compressed the Entitlement Theory into a single, operational sentence. Your summary—"whether the holdings came about by voluntary steps from holdings that were themselves legitimately acquired, with the resulting shape of the distribution counting for nothing"—is accurate. You have also correctly identified the fault line. The case of the indentured young man is the stress test that threatens to crack the whole structure.

  Here is the breakdown of how Nozick likely handles this, why it matters for your group, and where your hunch about slavery is correct.

  ### 1. The Verdict and the Reason
  **Verdict:** Nozick would rule that the contract is **void regarding enforcement**, specifically the clause allowing the firm to compel the man's return to work. The state (even the minimal state) should not enforce specific performance on a personal service contract that amounts to slavery.

  **Reasoning:** This hinges on the distinction between *transferring a right* and *alienating the capacity to hold rights*.
  Nozick's theory is built on a Kantian foundation: individuals are ends in themselves, not means. Rights function as "side constraints" on the actions of others. While I own my labor, and I can sell *units* of my labor (wage work), I cannot sell the *mechanism* by which I consent.

  If I sell you my labor for 25 years and give you the right to *force* me, I am effectively transferring my moral agency to you. I am turning myself into a thing. For Nozick, the inviolability of persons is the axiom. A contract that permits one person to violate the rights of another (even with prior consent) undermines the very system of rights. The state's job is to protect rights, not to enforce agreements that extinguish them.

  ### 2. The Candidate Rules
  Let's formalize the two readings you identified.

  **Reading A: The Pure Historical Rule (Libertarian Consistency)**
  *   **Rule:** If $X$ owns $X$, and $X$ voluntarily transfers rights over $X$ to $Y$, the transfer is valid. The state must enforce the terms of the transfer.
  *   **Prediction:** The contract is valid. The firm can compel the man to work. To void it is to violate the man's past voluntary choice (paternalism).
  *   **Fit with other verdicts:** Fits the Chamberlain example perfectly. Fits the anti-taxation argument perfectly (my labor is mine to give or sell).
  *   **Where it bends:** It collapses the distinction between a wage-earner and a slave. It forces Nozick to admit that chattel slavery is just, provided the initial enslavement was voluntary.

  **Reading B: The Side-Constraint Rule (Moral Agency)**
  *   **Rule:** Individuals own themselves, but self-ownership is inalienable. You can rent your labor, but you cannot sell the right to quit. Side constraints protect you from others *and* limit what you can authorize others to do to you.
  *   **Prediction:** The contract is void regarding specific performance. The firm might be owed damages (money) for breach of contract, but they cannot claim the *person*.
  *   **Fit with other verdicts:** Fits the anti-slavery intuition. Fits the idea that rights are "constraints" rather than "property."
  *   **Where it bends:** It introduces a "pattern" of status. It says, "Regardless of your choices, you must remain a rights-bearer." This looks suspiciously like the patterned principles Nozick attacks in Chapter 3.

  ### 3. Which Fits Better?
  **Reading B fits Nozick's broader system better,** though it requires a subtle distinction.

  Nozick is not a pure utilitarian of rights; he is a deontologist. He argues that there are things people may not do to one another. If Reading A were true, then "rights" would just be commodities. But for Nozick, rights are the *boundaries* within which commodities are traded. If you can trade away the boundary itself, the system collapses.

  In *Anarchy, State, and Utopia* (specifically around page 331), Nozick addresses voluntary slavery. He acknowledges the tension but leans toward prohibiting it. His argument is that a system allowing voluntary slavery allows people to cease being moral agents. Since the moral theory is predicated on the existence of moral agents, it cannot permit their destruction.

  Therefore, Reading A fails because it treats the *person* as just another holding. Reading B succeeds because it treats the *person* as the precondition for having holdings at all.

  ### 4. The Decisive Test Case
  You asked for a case that isn't science fiction but would settle the matter. The best candidate is not the 25-year contract itself, but the **remedy for breach.**

  **The Case:** Two contracts for the same 25-year labor.
  *   **Contract 1:** If the worker quits, the firm can use the state to physically return him to the factory (Specific Performance).
  *   **Contract 2:** If the worker quits, he owes the firm a massive sum of money, effectively working for free for the rest of his life to pay the debt (Damages).

  **Why this settles it:**
  Nozick famously argues that taxation of earnings is "on a par with forced labor." If the state enforces Contract 1, it is directly engaging in forced labor. If the state enforces Contract 2, it is enforcing a debt.
  *   If Nozick allows Contract 1, he admits the state can force labor, contradicting his core analogy against taxation.
  *   If Nozick bans Contract 1 but allows Contract 2, he has drawn a line between *owning labor* and *owning the person*.

  This is the fault line. If he bans Contract 1, he admits there is a limit to voluntary exchange that is not based on history (the history is voluntary in both cases) but on the *nature of the enforcement*. This validates Reading B.

  ### 5. The Underdetermination and Your Hunch
  You asked me to be honest if the track record underdetermines this. Here is the honest answer: **Your hunch is correct.**

  This specific problem is the place where Nozick's theory is most vulnerable to the charge that it secretly relies on a pattern.
  *   If he allows voluntary slavery (Reading A), he preserves the historical entitlement theory but loses the moral force of "inviolability." He cannot condemn chattel slavery on principle, only on the contingency that most historical slavery was involuntary.
  *   If he bans voluntary slavery (Reading B), he preserves "inviolability" but smuggles in a patterned principle: *Everyone must remain an agent.* This distribution of "agency status" is protected regardless of voluntary choices to the contrary.

  Nozick tries to thread this needle by arguing that prohibiting voluntary slavery doesn't impose a pattern of *distribution of goods*, but rather protects the *preconditions of exchange*. But as your reading group has likely noticed, that is a distinction without a massive difference. To say "you cannot sell yourself" is to say "the distribution of self-ownership must remain equal (everyone owns themselves) regardless of consent."

  **Conclusion for your group:**
  The 25-year contract is the point where the Entitlement Theory touches the bedrock of the Kantian ethics underneath it. Nozick's verdict would likely be that the firm cannot enforce the return to work (Reading B). But you should tell your friends that this verdict comes at a cost: it admits that historical voluntariness is not the *only* metric of justice. There is a substantive constraint on what can be traded, which means the "shape of the distribution" (specifically, the distribution of moral agency) does count for something after all.

  You haven't found a measurement problem because there isn't one. You've found the place where the map stops and the territory begins. Nozick stops short of full self-alienation not because of the history, but because of the metaphysics of the person. Whether that saves the theory or sinks it is a matter for your next Sunday.
