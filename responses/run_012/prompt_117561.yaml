      *Actually, looking closer at ASU:* Nozick is surprisingly brief on voluntary slavery. He notes that prohibiting it limits liberty. But he leans towards the idea that you cannot sell yourself into slavery because you cannot transfer the *right to control your will*.
      *Key distinction:* The contract in the prompt includes *state enforcement* ("firm is entitled to compel him back"). Nozick's minimal state enforces rights. If the contract violates the fundamental right of self-ownership, the state cannot enforce it.

