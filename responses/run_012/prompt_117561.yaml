      *   **Refining the Nozickian Position:** Nozick actually addresses this in the context of "voluntary slavery." He argues that a system permitting voluntary slavery allows people to cease being moral agents. Since the moral theory is based on the sanctity of moral agents, it cannot permit their destruction. Therefore, the contract is void *ab initio* regarding enforcement of personhood, though perhaps financial restitution applies.

  5.  **Polishing the Tone:**
