      *   *The Slavery Question:* Nozick explicitly discusses voluntary slavery. In Chapter 3 ("The Moral Constraints against Aggression"), he addresses whether a person can sell themselves into slavery.
      *   *Key Passage:* Nozick argues that a system allowing voluntary slavery is problematic because it allows one to *alienate* the very right that makes voluntary exchange possible. If you can sell yourself into slavery, you lose the capacity to exercise rights in the future.
      *   *The "Enforcement" Aspect:* The user's case isn't just about the moral bindingness, but about *state enforcement* (compelling him back to work). Nozick's minimal state enforces rights. If the contract violates rights, the state shouldn't enforce it.
      *   *Specific Performance vs. Damages:* In contract law, specific performance (forcing someone to work) is rarely granted for personal service contracts precisely because it resembles slavery. Nozick would likely align with this intuition based on his side-constraint view.

