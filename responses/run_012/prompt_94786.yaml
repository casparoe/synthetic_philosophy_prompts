prompt: |-
  I just lost about two hours of my evening to an argument with my roommate — she's finishing a PhD in econ, I'm doing a policy masters and working part time at a state environmental agency — about whether being risk averse can be rational in its own right, or whether it's always either an illusion or a mistake. I said of course it's rational, that's why people buy insurance on things the math says are bad bets. She said no, that's just diminishing marginal utility of money, and once you spell the outcomes out in terms of the thing you ultimately care about, you have to be risk neutral, so if you'd rather have a sure loss of 50 than a coin flip between 0 and 120 that's either you misperceiving the odds or you being irrational, end of story. Then she pulled out this thing she's been reading about where you line up the outcomes of a gamble from worst to best and each outcome's weight isn't its probability but some function of the chance of that outcome happening *or anything worse than it* happening — so the same one percent chance of a catastrophe gets treated completely differently depending on what else is on the table, and your attitude to risk is baked into the rule itself instead of into the utility function. Which sounds insane to me, but then I went to work the next morning and started looking around at how the stuff on my desk is actually set up, and now I can't tell who's right.

  Some of what we do is pure expected value arithmetic. We put a dollar figure on a statistical life, a few million give or take, multiply by the expected number of deaths a rule would prevent, subtract the compliance cost, and if the number comes out positive we do the rule. Risk there is just probability times harm — a one in ten thousand chance of killing someone is worth exactly a thousandth of killing them outright, no more. Fine. But two floors down, contaminated sites run on a totally different logic: the cleanup target is a one in a million added cancer risk, which everybody in the building treats as basically zero, i.e. as a line below which the risk stops counting at all rather than as a small number that gets multiplied by anything. And there are statutes — the food additive one from the late fifties is the famous example, if I'm remembering it right — where a substance that causes cancer in lab animals can't be approved at any dose, no matter how tiny, because that risk simply isn't tradeable against the benefit. The safety people write rules saying you have to keep reducing a hazard until the next increment of protection costs *wildly* more than the benefit it buys, not merely equal to it, and other rules that set an absolute ceiling on individual risk that no economic benefit can justify crossing even if the benefit is enormous. And over in the courts, someone exposed to a chemical can sometimes recover damages for the increased risk of a disease they haven't got and may never get.

  So what view of practical rationality does this whole bundle presuppose? Is there a single theory under which the linear cost-benefit stuff and the no-safe-dose stuff are both correct rather than one of them just being a political bone thrown to frightened people — and does the rank-dependent thing my roommate was going on about actually do that job, i.e. does the practice presuppose a non-linear weighting of chances, and if so what shape does that weighting have to have to generate ceilings, floors, and gross disproportion tests all at once? Which rival views does the bundle rule out, and where is it merely compatible with several, so that the practice turns out to be underdetermined — could a straight expected utility view with the right utility function license all of it, including the absolute ceilings, or do the ceilings need something else entirely, like a deontic constraint or a threshold below which probabilities just don't register? I want the strict presuppositions separated from the stuff that's just there for litigation risk and public panic. And if the answer is that we're implicitly running something like her theory, tell me what actually changes if we swap in straight expected value: which of these rules has to go, and what does the replacement rulebook look like?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Context:** The user (policy master's student, state environmental agency worker) had a 2-hour argument with their roommate (PhD Econ student).
      *   **The Core Dispute:** Is risk aversion rational *in itself* (non-linear probability weighting), or is it always just diminishing marginal utility of money/outcomes (Expected Utility Theory - EUT)?
      *   **Roommate's Position:** Risk aversion is *only* diminishing marginal utility. Once you define utility correctly over final outcomes, you must be risk-neutral over probabilities. Any deviation is irrational. She cited "Rank-Dependent Utility" (RDU) or similar non-linear probability weighting theories but dismissed them as "insane."
      *   **User's Observation:** In their job at the environmental agency, they see *both* linear cost-benefit analysis (CBA) (VSL * probability) *and* non-linear/threshold approaches (de minimis risk levels, Delaney Clause-style bans, ALARA principles, tort recovery for risk exposure).
      *   **The Question:** What view of practical rationality does this regulatory bundle presuppose?
          *   Is there a single theory reconciling linear CBA and absolute ceilings?
          *   Does Rank-Dependent Utility (RDU) explain this?
          *   What shape must the weighting function have?
          *   Does EUT (with the right utility function) license *all* of it, including absolute ceilings?
          *   Or do ceilings require deontic constraints/thresholds?
          *   What gets ruled out? What is underdetermined (politics/panic vs. rationality)?
          *   **Crucial Counterfactual:** If we swapped in straight Expected Value (EV) or EUT, which rules would have to go, and what would the replacement rulebook look like?

  2.  **Analyze the Theoretical Landscape:**

      *   **Expected Utility Theory (EUT):** $U(Lottery) = \sum p_i \cdot u(x_i)$. Risk aversion comes from concave $u(x)$ (diminishing marginal utility). Probabilities are weighted linearly ($p$).
      *   **Expected Value (EV):** Special case of EUT where $u(x) = x$. Risk neutral over money.
      *   **Rank-Dependent Utility (RDU) / Cumulative Prospect Theory (CPT):** $U(Lottery) = \sum w(p_i) \cdot u(x_i)$, but $w$ is a *decision weight* based on cumulative probabilities (ranks). This allows non-linear weighting of probabilities *independent* of utility curvature. Small probabilities of catastrophes can be overweighted.
      *   **Deontic/Threshold Views:** Certain outcomes (death, cancer) are forbidden regardless of probability or trade-off. This violates the continuity axiom of EUT.
      *   **Regulatory Practice:** A hybrid. CBA (EUT-like) for general rules, Thresholds (Deontic-like) for specific hazards (carcinogens), and ALARA (As Low As Reasonably Achievable) which is cost-effectiveness constrained by a safety goal.

  3.  **Address the Roommate's Claim:**

      *   She is technically describing the standard neoclassical defense of EUT. In strict EUT, "risk aversion" is curvature of utility, not weighting of probabilities.
      *   However, she is wrong that RDU is "insane" or irrational. RDU is a well-established descriptive and normative alternative (Allais Paradox etc.).
      *   More importantly, regulatory practice *cannot* be fully explained by EUT with just concave utility. Why? Because of the *thresholds* (de minimis risk) and *lexical priorities* (Delaney Clause). EUT implies trade-offs are always possible if the benefit is high enough. Regulatory practice sometimes says "No trade-off."

  4.  **Analyze the Regulatory Bundle (The User's Data):**

      *   *Linear CBA (VSL):* Consistent with EUT/EV. $p \times VSL$.
      *   *De Minimis (1 in 1 million):* Inconsistent with strict linearity. If $p \times Harm$ is the metric, $10^{-6}$ should just be a small number, not "zero." This implies a *threshold* or a highly non-linear weighting function where $w(p) \approx 0$ for $p < \epsilon$.
      *   *Delaney Clause (Zero Tolerance):* Inconsistent with EUT continuity. No amount of benefit offsets *any* risk. This is lexical priority/deontic.
      *   *ALARA/Gross Disproportion:* Consistent with constrained optimization, but the constraint is often safety-first, not utility-maximization.
      *   *Tort for Risk Exposure:* Treats risk itself as a harm, not just the realized outcome. This aligns with RDU (fear/anxiety weighting) or deontic rights (right to safety).

  5.  **Synthesize the "Presupposed Rationality":**

      *   Is it a single theory? No, it's a *pluralistic* framework.
      *   Does RDU explain it? RDU explains the overweighting of small catastrophic risks (explaining why we ban carcinogens but do CBA on traffic safety). It explains the "ceiling."
      *   Does EUT explain it? EUT *cannot* explain absolute bans (Delaney) without assuming infinite disutility for cancer, which breaks the math elsewhere (VSL would be infinite).
      *   So, the practice presupposes a **hybrid model**: EUT for "ordinary" risks (traffic, economics) + RDU/Thresholds for "dread" risks (cancer, toxins).

  6.  **Drafting the Response - Section by Section:**

      *   **Validate the User:** Acknowledge the sophistication of the observation. The roommate is reciting Econ 101 dogma; the user is observing Institutional Reality.
      *   **The Roommate's Error:** Clarify EUT vs. RDU. EUT *can* model risk aversion via utility curvature, but it *cannot* model probability weighting. The roommate is right that EUT *requires* linear probability weighting, but wrong that rationality *requires* EUT.
      *   **The Regulatory Bundle Analysis:**
          *   *VSL/CBA:* Fits EUT/EV.
          *   *De Minimis (1 in 10^6):* Fits RDU (weight $\approx$ 0) or Threshold.
          *   *Delaney/Zero Tolerance:* Fits Deontic/Lexical. Violates EUT continuity.
          *   *Tort for Risk:* Fits RDU (risk as disutility) or Rights.
      *   **Can One Theory Rule Them All?**
          *   *EUT:* Fails on Zero Tolerance (unless $U(Death) = -\infty$, which breaks VSL).
          *   *RDU:* Better fit. Can overweight small probabilities of catastrophe (explaining bans) while treating moderate probabilities linearly (explaining VSL).
          *   *Threshold/Deontic:* Best fit for the "ceilings."
      *   **The "What If" Scenario (Swapping to Straight EV/EUT):**
          *   If we went pure EV/EUT:
              *   Delaney Clause goes (trade cancer risk for cheap food).
              *   De Minimis thresholds go (accumulate tiny risks until they hit VSL).
              *   Tort for risk exposure goes (no harm, no foul).
              *   ALARA becomes Cost-Benefit Optimization (stop where $MC=MB$, not where it's "grossly disproportionate").
      *   **Conclusion:** The practice is underdetermined by theory but *constrained* by it. It's not just panic; it's a recognition that EUT fails to capture moral intuitions about catastrophe and rights. The "rationality" presupposed is **bounded rationality with lexical constraints**, formally closer to RDU or Semi-Orderings than strict EUT.

  7.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction:* I need to be careful distinguishing "Expected Value" (linear utility, linear prob) from "Expected Utility" (concave utility, linear prob). The roommate argued for EUT (concave utility), not necessarily EV. The user asks about swapping in "straight expected value" at the end. I should address both.
      *   *Nuance on VSL:* VSL is technically derived from EUT (willingness to pay for marginal risk reduction). If we have infinite disutility for death, VSL is infinite. Since VSL is finite ($\sim$10M), the agency *doesn't* actually treat death as lexically infinite in the CBA context. This highlights the *inconsistency* in the bundle.
      *   *RDU Specifics:* The roommate mentioned weighting based on "chance of that outcome or anything worse." That is specifically **Rank-Dependent Utility** (Quiggin) or **Cumulative Prospect Theory** (Tversky/Kahneman). I need to confirm this matches her description. Yes, it does (cumulative probability weighting).
      *   *The "Shape" of the Weighting:* To get ceilings and floors, the weighting function $w(p)$ needs to be inverse-S shaped (overweight small probs, underweight moderate/large) or have a cutoff. To get the Delaney clause, you need a discontinuity at $p=0$.

  8.  **Final Polish:** Ensure the tone is respectful to both the user and the roommate (Econ PhDs aren't stupid, but their model is limited). Focus on the *presuppositions* of the regulatory state.

      *   *Key Insight:* The regulatory state acts as if it has **multiple utility functions** depending on the domain (CBA for economics, Deontic for toxins). This is "Context-Dependent Rationality."
      *   *Direct Answer:* No, a single EUT view cannot license the absolute ceilings without breaking the VSL math. Yes, RDU gets closer but still struggles with absolute bans (which require discontinuity). The practice rules out strict consequentialism.

  9.  (Drafting the response based on these points.)
answer: |-
  This is a fantastic observation, and you have stumbled onto one of the deepest tensions in regulatory economics and moral philosophy. Your roommate is reciting the standard neoclassical catechism, but your desk is covered in the evidence that the regulatory state does not actually run on that software.

  Here is the breakdown of the theoretical landscape, what your agency's practice actually presupposes, and what would break if you forced it into your roommate's model.

  ### 1. The Roommate's Claim vs. The Theory
  Your roommate is defending **Expected Utility Theory (EUT)**. In strict EUT:
  $$U(Lottery) = \sum p_i \cdot u(x_i)$$
  Risk aversion is modeled *exclusively* by the curvature of the utility function $u(x)$ (diminishing marginal utility of wealth/outcomes). The probabilities $p_i$ must be weighted linearly. If you prefer a sure 50 to a 50/50 of 0 or 120, EUT says your utility function is concave, not that you are weighting the probability of 0 higher than 50%.

  She is technically correct that *within EUT*, non-linear probability weighting is irrational. However, she is wrong that EUT is the only rational framework. The theory she dismissed—where weights depend on the rank of the outcome and cumulative probability—is **Rank-Dependent Utility (RDU)** (or Cumulative Prospect Theory).
  $$U(Lottery) = \sum w(P(\text{outcome} \leq x_i)) \cdot u(x_i)$$
  In RDU, you can be risk-averse over gains *and* risk-averse over losses simultaneously (which EUT cannot do without a reference point), and you can overweight small probabilities of catastrophe. This is not "insane"; it is the dominant descriptive model of decision-making under risk in behavioral economics and is increasingly accepted normatively for policy involving low-probability, high-consequence events.

  ### 2. What the Regulatory Bundle Presupposes
  Your agency's practice is not a single theory; it is a **hybrid framework** that switches between three different logics depending on the hazard. No single version of EUT can license all of them simultaneously without contradiction.

  **A. The Linear CBA (VSL) Logic**
  *   **Practice:** $Value = p \times VSL$. A 1/10,000 risk is exactly 1/10,000th of a death.
  *   **Presupposition:** This is pure **Expected Value / EUT**. It assumes continuity and substitutability. It presupposes that risk is a commodity that can be traded against wealth.
  *   **Compatibility:** Compatible with EUT. Incompatible with absolute bans.

  **B. The De Minimis Logic (1 in 1 million)**
  *   **Practice:** Risks below $10^{-6}$ are treated as zero.
  *   **Presupposition:** This is a **Threshold View**. In EUT, $0.000001 \times \text{Death}$ is a small positive number, not zero. To get this result, you need a weighting function $w(p)$ such that if $p < \epsilon$, $w(p) = 0$.
  *   **Compatibility:** Incompatible with linear EUT. Compatible with RDU (if the weighting function has a flat region at the bottom) or a "semi-ordering" preference structure where agents cannot distinguish differences below a threshold.

  **C. The Delaney / Zero-Tolerance Logic**
  *   **Practice:** No trade-off allowed for carcinogens.
  *   **Presupposition:** This is **Deontic / Lexical Priority**. It violates the **Continuity Axiom** of EUT. EUT says there is *some* benefit large enough to offset *any* risk. The Delaney Clause says there is not.
  *   **Compatibility:** Incompatible with EUT. To make EUT fit, you would have to assign $u(\text{Cancer}) = -\infty$. But if you do that, your VSL becomes infinite, and you can't do the linear CBA you do on traffic safety. You cannot have a finite VSL ($\sim\$10M$) and an infinite disutility for cancer in the same utility function.

  **D. Tort for Risk Exposure**
  *   **Practice:** Damages for increased risk, even without disease.
  *   **Presupposition:** This treats **Risk as a Harm** in itself (anxiety, loss of autonomy, violation of rights), not just as an expected outcome.
  *   **Compatibility:** Compatible with RDU (where the weighting of the bad outcome creates disutility independent of realization) or Rights-based theories. Incompatible with strict EUT where only final states of the world ($x_i$) have utility, not the lottery itself.

  ### 3. Can One Theory Rule Them All?
  **No.** The bundle is theoretically inconsistent.
  *   If you adopt the **VSL logic**, the Delaney Clause is irrational (you are leaving lives on the table by not trading cheap cancer reductions for expensive traffic safety).
  *   If you adopt the **Delaney logic**, the VSL is immoral (you are putting a price on life).

  However, **Rank-Dependent Utility (RDU)** gets much closer to bridging the gap than EUT does.
  *   **The Shape:** To generate your agency's behavior, the probability weighting function $w(p)$ needs to be **inverse-S shaped**.
      *   **For small $p$ (Catastrophe):** $w(p) \gg p$. You overweight the 1-in-a-million cancer risk. This justifies strict regulation/cleanup targets that look "irrational" under EV.
      *   **For moderate $p$ (Traffic/Work):** $w(p) \approx p$. You treat these linearly, which justifies the VSL arithmetic.
  *   **The Ceiling:** RDU alone cannot generate an *absolute* ceiling (Delaney). It can only generate a *very high* cost for risk. To get an absolute ban, you need a **lexical constraint** layered on top of RDU.

  So the practice presupposes: **Constrained Rank-Dependent Utility.** We maximize welfare using non-linear probability weights, *subject to* deontic side-constraints (no carcinogens, no individual risk > $10^{-4}$).

  ### 4. What Gets Ruled Out?
  Your agency's practice rules out **Strict Act Consequentialism** (maximize expected good in every instance).
  *   It rules out the idea that probabilities are always linear.
  *   It rules out the idea that all goods are commensurable (money vs. cancer).
  *   It rules out the idea that "zero risk" is impossible (by legally defining $10^{-6}$ as zero).

  It is **underdetermined** on *why* we switch modes. Is it because cancer is "dreaded" (psychological)? Is it because carcinogens are involuntary (ethical)? The practice doesn't say. It just switches the rulebook depending on the statute.

  ### 5. The Counterfactual: Swapping in Straight Expected Value
  If you forced your agency to run on your roommate's model (EUT with linear probability weighting, or worse, pure Expected Value over money), here is the replacement rulebook:

  1.  **The Delaney Clause Vanishes:** You would have to approve food additives that cause cancer in rats if the economic benefit to consumers (cheaper food) outweighed the expected cost of the cancer cases ($p \times VSL$).
  2.  **Superfund Cleanup Targets Change:** You would not clean up to $10^{-6}$ risk. You would clean up until the marginal cost of the next unit of cleanup equaled the marginal benefit of the risk reduction. For many sites, the "rational" cleanup level would be "do nothing" or "fence it off," because full remediation costs billions for tiny risk reductions.
  3.  **Tort for Risk Exposure Disappears:** You cannot sue for increased risk. You must wait until you get sick. Under EUT, the risk itself has no disutility other than the expected value of the outcome.
  4.  **ALARA Becomes Cost-Benefit Optimization:** "As Low As Reasonably Achievable" would be redefined. Currently, "Reasonably" allows for gross disproportion (spend \$10M to save \$1M worth of risk if it's a safety issue). Under EUT, you stop spending exactly when Cost = Benefit.
  5.  **VSL Becomes Uniform:** You couldn't have a higher implicit value for preventing terrorist deaths vs. traffic deaths. A statistical life is a statistical life.

  ### Summary
  Your roommate is right that *if* you accept EUT as the definition of rationality, then risk aversion must be utility curvature. But she is wrong that EUT is the definition of rationality.

  Your agency's practice presupposes that **catastrophic risks are different in kind, not just degree, from ordinary risks.** This is formally incoherent under EUT but coherent under a **pluralistic framework** that uses RDU for dread risks and EUT for ordinary economic trade-offs, bounded by deontic constraints.

  If you swap in straight Expected Value, you don't just change the math; you dismantle the moral architecture of the regulatory state. You turn "rights to safety" into "prices for exposure." The fact that your desk holds both the VSL spreadsheet and the zero-tolerance statute isn't confusion; it's a pragmatic admission that Expected Utility Theory fails to capture how humans value survival.
