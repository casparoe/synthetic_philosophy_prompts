  # DIAGNOSTIC HANDOUT: THE POLITICAL AGENCY OF ARTIFACTS

  **Instructions:** This instrument is designed to locate your theoretical commitments regarding the relationship between technology and politics. Do not attempt to guess the "correct" answer. Respond to each diagnostic question based on your intuition about the specific case provided. Follow the path indicated by your answers to arrive at a specific position within the logical space.

  ## PART I: THE LOGICAL SPACE

  The following twelve diagnostic questions define the branching structure of the space. Each question presents a concrete case and asks you to distinguish between two or three competing descriptions of that case. Record your path (e.g., Q1-A, Q2-B) as you proceed.

  **Q1. The Locus of Constraint**
  Consider the **household appliance fastened with a tamper-resistant screw**. When an owner is prevented from repairing the device, is the restriction located *in the physical design of the screw itself*, or is it located *in the decision by the manufacturer to install it*?
  *   **A:** In the physical design (The screw itself acts). → Go to **Q2**.
  *   **B:** In the manufacturer's decision (The company acts). → Go to **Q5**.

  **Q2. The Durability of the Effect**
  Consider the **syringe engineered so that it cannot be reused**. Is the prevention of reuse a *permanent physical necessity* given the material, or is it a *reversible engineering choice* that could be updated in a future model?
  *   **A:** Permanent physical necessity. → Go to **Q3**.
  *   **B:** Reversible engineering choice. → Go to **Q4**.

  **Q3. The Source of Necessity**
  Consider the **set of planter barriers at a junction whose spacing admits cars but not buses**. Is the exclusion of buses caused by *laws of physics* (a bus literally cannot fit), or by *engineering standards* (the city chose this width)?
  *   **A:** Laws of physics (Natural constraint). → **Path 1**.
  *   **B:** Engineering standards (Design constraint). → **Path 2**.

  **Q4. The Holder of Sovereignty**
  Consider the **messaging application that is end-to-end encrypted by default but whose maker retains the ability to switch that default off**. Who holds the political capacity to guarantee privacy?
  *   **A:** The User (The design locks the maker out). → **Path 3**.
  *   **B:** The Maker (The design allows a backdoor switch). → **Path 4**.

  **Q5. The Role of Intent**
  Consider the **building entrance deliberately made too narrow for a wheelchair, in a building also used as a polling place**. If the architect claims the narrowness was purely aesthetic and denies any intent to suppress voters, is the entrance still political?
  *   **A:** No, intent is required for politics. → Go to **Q6**.
  *   **B:** Yes, effects matter regardless of intent. → Go to **Q7**.

  **Q6. The Scope of Intent**
  Consider the **software feature that would make a product accessible, shipped off by default and reachable only by users who already know to look for it**. Is the exclusion of non-expert users a result of *conscious design choice* or *negligent oversight*?
  *   **A:** Conscious design choice. → **Path 5**.
  *   **B:** Negligent oversight. → **Path 6**.

  **Q7. The Mechanism of Exclusion**
  Consider the **bicycle that can be unlocked and located only through a proprietary phone application**. Is the inability to ride the bike without the app caused by the *code's logic* or by the *legal terms of service* enforced by the company?
  *   **A:** The code's logic (Technical lock). → Go to **Q8**.
  *   **B:** The legal terms (Contractual lock). → **Path 7**.

  **Q8. The Transparency of the Script**
  Consider the **code's logic** in the bicycle case. Is the political script (who can ride) *visible and open* to inspection, or *hidden and proprietary*?
  *   **A:** Visible and open. → **Path 8**.
  *   **B:** Hidden and proprietary. → **Path 9**.

  *(Diagnostic Checks for Consistency)*
  **Q9. (If Path 1)** Is this physical necessity true for *all* artifacts of this type?
  *   **A:** Yes. → Confirm Path 1.
  *   **B:** No. → Reroute to Path 2.

  **Q10. (If Path 4)** Can the maker switch the default *remotely* without user consent?
  *   **A:** Yes. → Confirm Path 4.
  *   **B:** No. → Reroute to Path 3.

  **Q11. (If Path 7)** Is the legal term enforceable without the technical lock?
  *   **A:** Yes. → Confirm Path 7.
  *   **B:** No. → Reroute to Path 8.

  **Q12. (If Path 6)** Is the negligence systematic across the industry?
  *   **A:** Yes. → Reroute to Path 5.
  *   **B:** No. → Confirm Path 6.

  ### Permitted Combinations
  The logical space allows for nine distinct terminal paths (Path 1 through Path 9). Each path represents a coherent combination of answers regarding locus, intent, necessity, and mechanism. No path contradicts another logically, though some may be empirically rare.

