  ## PART II: THE TAXONOMY OF POSITIONS

  Map your terminal path from Part I to the corresponding position below. Each position includes a conventional or descriptive label, a statement of its most awkward commitment, and the specific cost of abandoning it.

  **Path 1: Hard Technological Determinism**
  *   **Label:** Hard Technological Determinism
  *   **Awkward Commitment:** You must accept that human agency is illusory when confronted with physical constraints, meaning politics ends where physics begins.
  *   **Exit Cost:** To leave this position, you must give up the claim that material necessity is absolute and acknowledge that engineering standards are always social choices.

  **Path 2: Structural Functionalism**
  *   **Label:** Structural Functionalism
  *   **Awkward Commitment:** You must accept that design standards are neutral optimizations, ignoring that "standards" often encode specific social norms as if they were technical requirements.
  *   **Exit Cost:** To leave this position, you must give up the idea that engineering constraints are value-free and admit that standards are political settlements.

  **Path 3: Liberal Artifact Agency**
  *   **Label:** Liberal Artifact Agency
  *   **Awkward Commitment:** You must assume that code can perfectly bind its creators, ignoring the legal and physical power developers retain over deployed software.
  *   **Exit Cost:** To leave this position, you must give up the belief that technical features can guarantee rights independent of the institution maintaining them.

  **Path 4: Contingent Sovereignty**
  *   **Label:** Contingent Sovereignty
  *   **Awkward Commitment:** You must accept that user privacy is a revocable privilege granted by a corporation rather than a right secured by the tool itself.
  *   **Exit Cost:** To leave this position, you must give up the view that platform owners retain legitimate ultimate control over user configurations.

  **Path 5: Intentionalist Design Politics**
  *   **Label:** Intentionalist Design Politics
  *   **Awkward Commitment:** You must accept that systemic bias cannot exist without a specific individual consciously intending to discriminate.
  *   **Exit Cost:** To leave this position, you must give up the requirement for conscious malice and acknowledge that structures can oppress without a specific oppressor.

  **Path 6: User-Dependency Politics**
  *   **Label:** User-Dependency Politics
  *   **Awkward Commitment:** You must locate the political failure in the user's lack of knowledge rather than the design's lack of discoverability.
  *   **Exit Cost:** To leave this position, you must give up the assumption that users bear the burden of navigating opaque systems and shift it to designers.

  **Path 7: Socio-Technical Ensemble**
  *   **Label:** Socio-Technical Ensemble
  *   **Lock:** Politics belongs to the wider socio-technical ensemble rather than to the artifact considered alone.
  *   **Awkward Commitment:** You must accept that the artifact itself is politically inert, which makes it difficult to critique the object without analyzing the entire legal and corporate network surrounding it.
  *   **Exit Cost:** To leave this position, you must give up the claim that politics is exclusively relational and admit that some objects carry political weight in isolation.

  **Path 8: Soft Determinism (Script Theory)**
  *   **Label:** Soft Determinism
  *   **Lock:** Effects are necessary or systematic given the design rather than incidental, but not physically forced.
  *   **Awkward Commitment:** You must accept that designers can predict and control user behavior through code, potentially overestimating the stability of "scripts" against user resistance.
  *   **Exit Cost:** To leave this position, you must give up the idea that design reliably shapes behavior and acknowledge the unpredictability of appropriation.

  **Path 9: Black Box Structuralism**
  *   **Label:** Black Box Structuralism
  *   **Lock:** Politics shapes what users can see as an available option or can bring themselves to want.
  *   **Awkward Commitment:** You must accept that political critique is impossible without reverse-engineering proprietary systems that are legally protected from inspection.
  *   **Exit Cost:** To leave this position, you must give up the claim that opacity is itself a political mechanism and argue that only visible features matter.

