  ## PART III: DIAGNOSTIC OF GAPS

  The following combinations of answers were left unoccupied in the logical space. This diagnosis explains why no position resides there.

  **Gap A: Inherent Politics without Physical Necessity (Q1-A + Q2-B)**
  *   **Diagnosis:** *Incoherent.* This combination suggests an artifact has intrinsic political agency (Q1-A) but that this agency is reversible by software update (Q2-B). If the politics can be switched off remotely, the locus of politics is not the physical artifact but the remote authority, collapsing back into Path 4 or Path 7.

  **Gap B: Intent Required but Systemic Negligence (Q5-A + Q12-A)**
  *   **Diagnosis:** *Coherent but Unattractive.* This view holds that intent is required for politics (Q5-A) but admits that negligence is systematic across an industry (Q12-A). It forces the theorist to label widespread structural exclusion as "apolitical accidents," a position most political theorists reject because it absolves institutions of responsibility for predictable outcomes.

  **Gap C: Technical Lock without Legal Enforcement (Q7-A + Q11-B)**
  *   **Diagnosis:** *Merely Unexplored.* This combination describes a system where code prevents use, but no legal contract backs it up (e.g., open-source DRM). No major position occupies this leaf because in practice, technical locks on consumer goods are almost always reinforced by legal regimes (like DMCA); theoretically, it is a stable position but empirically rare.

  **Gap D: Physical Necessity that is Not Universal (Q1-A + Q9-B)**
  *   **Diagnosis:** *Incoherent.* If a constraint is physically necessary (Q1-A), it must be true for all artifacts of that type (Q9-A). Claiming a physical law applies to one object but not its identical twin contradicts the definition of physical necessity, suggesting the constraint is actually social or design-based (Path 2).

  **Flagged Indistinguishability: Path 8 vs. Path 9**
  *   **Diagnosis:** *Empirical Entanglement.* In many cases (such as the proprietary bike app), the distinction between a "hidden script" (Path 8) and a "black box structure" (Path 9) collapses. If a script is proprietary, it is functionally a black box. Theoretically they differ (one emphasizes behavior shaping, the other epistemic opacity), but diagnostically, a user may find them indistinguishable without access to the source code.
