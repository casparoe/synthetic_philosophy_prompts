answer: |-
  # QUESTION-PERIOD PREP SHEET
  **To:** Dr. [Name]
  **From:** AI Assistant
  **Re:** Defense of Multi-Dimensional Sentience & Moral Status
  **Context:** Joint Philosophy/Veterinary Seminar

  ## PRE-GAME CONCESSIONS
  *Do not wait to be cornered on these. State them in your closing remarks or when the first soft ball is thrown.*

  1.  **Operational Precision:** Concede immediately that your three dimensions are not yet ready for a clinical checklist. Tell the veterinarians: "This is a moral framework, not a triage protocol. I am asking for a shift in heuristic, not a new form to fill out."
  2.  **Human Exceptionalism:** Concede that you are not offering a full theory of human rights. If pressed on whether humans vary in moral status, say: "My focus here is the *bottom* of the moral ladder, not the top. How this applies to marginal human cases is a separate, difficult problem I am not solving today."
  3.  **The Valence Gap:** Admit freely that "felt valence" is the weakest link empirically. Do not try to bluff physiology where you have none. Frame it as a necessary posit to explain behavior, not a measured variable.

  ## THE CRITICAL REPLY
  **There is one reply that must land for this paper to be taken seriously at all.**
  It is the response to the **Utilitarian Demand for a Common Currency** (Objection #1 below).
  *Why:* If you cannot explain how to make trade-offs between your three dimensions without collapsing them into a single number, your model offers no action-guidance in conflict cases (e.g., resource allocation between fish and dogs). If the audience leaves thinking, "He says it's complex, but he can't tell me what to do when they conflict," the theory is philosophically inert. You must argue that *refusing* to collapse them prevents specific moral errors (like sacrificing high-temporal-reach beings for high-integration beings) that a single scalar would permit.

  ## THE QUESTION YOU HOPE NOBODY ASKS
  **"If moral status tracks these dimensions, and humans vary in these dimensions (e.g., infants, dementia patients, coma victims), does a human with low temporal reach have less moral status than a dog with high temporal reach?"**
  *Why this is the trap:* It forces you to choose between consistency (yes, which horrifies the Kantians and the public) and speciesism (no, which undermines your physiological criteria).
  *Prep:* If asked, do not answer directly. Pivot to the "Evidential Humility" rule: "In cases of radical uncertainty regarding human interiority, the cost of error is infinitely lopsided, triggering a maximum precautionary weight that effectively floors human status regardless of physiological fluctuation." It's a dodge, but it's the only safe one.

  ---

  ## THE EIGHT OBJECTIONS (Ordered by Damage to Position)

  ### 1. The Utilitarian Objection: The Calculation Problem
  **Questioner:** The Sympathetic Utilitarian
  **Vocabulary:** "Common currency," "Trade-offs," "Maximization," "Fungibility."
  **The Objection:** "I want to agree with you that sentience is complex. But morality requires decision procedures. If I have limited anesthetic and two patients—a highly integrated insect and a low-integration fish with longer temporal reach—your model gives me no way to choose. If the dimensions are incommensurable, you haven't solved the moral problem; you've just described it. Don't we need a single scalar to do the math?"
  **Your Reply (2 mins):** "I understand the desire for a calculator, but I'm arguing that a single scalar is a *category error*, not just a measurement challenge. When you collapse these dimensions, you license specific moral atrocities. A single scalar might tell me that a massive amount of insect 'integration units' outweighs one dog's 'temporal reach.' But that violates our intuition that the *kind* of suffering matters, not just the *amount*. My model isn't meant to automate the choice; it's meant to veto certain choices. It says: 'Do not sacrifice temporal reach for integration.' It functions like a constitution, not a spreadsheet. It restricts the utilitarian calculus rather than replacing it. If you can't add them, you shouldn't be trading them off."
  **Soft Spot:** This sounds noble but operationally paralyzing. If you can't trade them off, how do you ever decide? You are relying on intuition to break ties, which undermines the "scientific" feel of your dimensions.

  ### 2. The Roboticist Objection: The Functionalist Trap
  **Questioner:** The Engineering Roboticist
  **Vocabulary:** "Internal states," "Feedback loops," "Goal-directed behavior," "Substrate independence."
  **The Objection:** "You define integration and valence functionally—input integrated into a global state, signals functioning as goals. My robots do exactly this. They integrate sensor data into a global map and have preference-like states they optimize. By your criteria, my creations are sentient. If you say they aren't, you're being a biological chauvinist. If you say they are, you owe me moral consideration for my hardware. Which is it?"
  **Your Reply (2 mins):** "It is a category mistake to equate functional optimization with felt valence. Your robot optimizes a variable because it was programmed to; it does not *care* about the variable. My second dimension requires the valence to be *felt* as a goal, not just computed as a target. The difference is the presence of a subject to whom the state matters. I am not a biological chauvinist; I am a phenomenological realist. Until your robot can demonstrate that its internal states have a 'what-it-is-like' quality distinct from error-correction, it fails the second dimension. I am defining sentience by the experience, not the architecture."
  **Soft Spot:** You have no way to prove the robot doesn't feel. You are asserting a "ghost in the machine" distinction that functionalists reject. You are begging the question against the Hard Problem.

  ### 3. The Kantian Objection: The Dignity Threshold
  **Questioner:** The Deontological Kantian
  **Vocabulary:** "Dignity," "Rational agency," "Ends in themselves," "Threshold," "Rights."
  **The Objection:** "Moral status is not a dimmer switch; it is a light switch. Persons possess dignity because of rational agency, which grants them inviolable rights. By suggesting moral status comes in degrees, you imply that humans with diminished capacity have less dignity. You are undermining the foundation of human rights to save a shrimp. Is human moral status graded on your scale?"
  **Your Reply (2 mins):** "I am not arguing that human rights are graded. I am arguing that *moral consideration* for non-agents is graded. There is a threshold for 'personhood' and rights, which I grant is binary. But below that threshold, in the realm of animals and sentient beings who are not rational agents, there is no such binary switch. A mouse is not a person, but it is not a carrot either. My model applies to the moral landscape *below* the threshold of rational agency. I am not lowering humans; I am raising the animals, but doing so with nuance rather than a blanket elevation."
  **Soft Spot:** If sentience grounds moral status, and humans have sentience, consistency demands humans fall on the scale. Distinguishing "rights" from "moral consideration" is a semantic shield that may not hold up under pressure regarding infants or the cognitively impaired.

  ### 4. The Veterinarian Objection: Operational Paralysis
  **Questioner:** The Clinical Anesthetist
  **Vocabulary:** "Triage," "Protocol," "Observable markers," "Monday morning," "Actionable."
  **The Objection:** "This is philosophically interesting, but on Monday morning, I have a crab and a rat in front of me. I cannot measure 'temporal reach' or 'global integration' in a trauma situation. If your theory requires me to assess three independent dimensions before I act, I will do nothing. How does this change what I actually do, other than making me hesitate?"
  **Your Reply (2 mins):** "It changes the default setting, not the triage algorithm. Currently, the default for invertebrates is 'insentient machine.' My model shifts the default to 'plausibly sentient along dimension one.' You don't need to measure the dimensions precisely; you need to acknowledge the *possibility* of them. The practical upshot is the Evidential Humility rule: if the cost of anesthesia is low and the cost of pain is high, assume the higher value of the dimension. It simplifies your decision: when in doubt, anesthetize. It removes the need for certainty."
  **Soft Spot:** You are admitting the dimensions themselves aren't measurable in the clinic. So why posit them? If the only takeaway is "when in doubt, anesthetize," you didn't need a three-dimensional theory to get there.

  ### 5. The Epistemic Objection: Precautionary Paralysis
  **Questioner:** The Skeptical Empiricist (Likely the Welfare Scientist)
  **Vocabulary:** "False positives," "Resource allocation," "Plausible value," "Burden of proof."
  **The Objection:** "Your rule of evidential humility says we should weight by the *highest plausible value*. But almost anything is 'plausibly' sentient to some degree if we lower the bar. If I must treat every worm as having the highest plausible temporal reach, I can never kill anything. Doesn't this rule lead to moral paralysis where we treat a nematode like a person just because we can't disprove it?"
  **Your Reply (2 mins):** "The rule is constrained by the *costs of error*. The cost of treating a thermostat like a person is wasting a few seconds of time. The cost of treating a shrimp like a thermostat is inflicting severe pain. The rule is not 'assume max sentience always'; it is 'assume max sentience when the cost of being wrong is suffering.' We are not obligated to treat the nematode like a person because the evidence for dimension two and three is vanishingly small, making the 'plausible max' still low. The asymmetry of the cost drives the weight, not just the uncertainty."
  **Soft Spot:** "Plausible" is doing too much work here. Who decides what is plausible? This looks like a way to smuggle your intuitions in under the guise of an epistemic rule.

  ### 6. The Valence Objection: The Black Box
  **Questioner:** The Hard-Nosed Physiologist (Your old colleagues)
  **Vocabulary:** "Nociception," "Behavioral proxy," "Anthropomorphism," "Inference."
  **The Objection:** "You admit evidence for valence is poor. Nociception we can measure. Avoidance behavior we can measure. 'Felt valence' is a ghost. You are building the central moral pillar of your theory on the dimension with the least empirical support. Why not just stick to integration and reflex?"
  **Your Reply (2 mins):** "Because nociception without valence is just data processing. A robot can detect damage and retreat without suffering. If we base morality only on integration, we might conclude a sophisticated AI deserves more protection than a sedated mammal. That is absurd. Valence is the *point* of the moral concern. I am willing to accept empirical uncertainty on valence because the moral stakes of ignoring it are too high. We infer it from the complexity of the avoidance learning, not just the reflex."
  **Soft Spot:** You are basing a moral obligation on something you admit you cannot detect. This makes your theory unfalsifiable.

  ### 7. The Structural Objection: Correlation vs. Independence
  **Questioner:** The Analytic Philosopher
  **Vocabulary:** "Covariation," "Confounding variables," "Parsimony," "Factor analysis."
  **The Objection:** "You claim these dimensions come apart. But in nature, don't they correlate? Doesn't higher integration usually enable longer temporal reach? If they are highly correlated in all real-world cases, positing three dimensions is unnecessary complexity. Why not just call it 'Cognitive Complexity'?"
  **Your Reply (2 mins):** "They correlate in mammals, but they come apart in the invertebrates and edge cases I study. An insect may have rich sensory integration but live entirely in the present. A migratory bird might have long temporal reach (navigation/migration) but simpler sensory integration than a cephalopod. If we collapse them, we lose the ability to see these trade-offs. Parsimony is a virtue, but not if it erases morally relevant distinctions. The 3D model explains why we treat a bee differently from a fish, even if both are 'complex'."
  **Soft Spot:** Your examples are speculative. Do insects really lack temporal reach? Do birds have it without integration? The empirical basis for their independence is thinner than you present.

  ### 8. The Boundary Objection: The Thermostat Sorites
  **Questioner:** The Undergraduate Student (or Pedantic Attendee)
  **Vocabulary:** "Slippery slope," "Degenerate form," "Cutoff," "Arbitrary line."
  **The Objection:** "You say a thermostat has a 'degenerate form' of integration. If integration is a matter of degree, and moral status tracks it, at what point does the thermostat become morally considerable? If you refuse a single scalar, you refuse a single line. Where does the moral obligation begin?"
  **Your Reply (2 mins):** "Moral obligation doesn't begin at a line; it fades in like the horizon. But 'fading in' doesn't mean 'zero.' A thermostat has no valence and no temporal reach. It fails two of the three dimensions entirely. That zeros out its moral status regardless of its degenerate integration. The line is drawn at the presence of valence. Integration amplifies moral status, but valence is the entry ticket. The thermostat has no ticket."
  **Soft Spot:** You just collapsed your model. If Valence is the "entry ticket," then Valence is the single scalar that matters most, undermining your claim that the dimensions are independent and equally weighted.
