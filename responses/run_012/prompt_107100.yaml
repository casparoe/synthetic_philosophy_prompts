  **Dear Maximizer**

  *Welcome to this week's edition of Dear Maximizer, the only advice column dedicated to helping you navigate the moral arithmetic of daily life. Remember: if it doesn't sum, it doesn't matter.*

  **Dear Maximizer,**
  My roommate is a registered Utility Monster. When we order pizza, he experiences forty times the pleasure I do per slice. I understand the math, but watching him eat the whole box while I lick the crust feels humiliating. Is there no room for fairness in the calculation? Surely a society that accepts this dynamic is embarrassed to call itself moral?
  — *Starving in Seattle*

  **Dear Starving,**
  Embarrassment is a psychological state, not a moral metric. You ask about fairness, but fairness is merely a heuristic for stable aggregation. If your roommate's pleasure is cardinally measurable and comparable to yours, the sum dictates the distribution. If one slice gives you 1 unit and him 40, withholding it destroys 39 units of value to save you 1. That is not unfair; it is efficient. If this embarrasses utilitarianism generally, so be it. But note that this only holds because we accept the state's certification of his capacity. If his internal scale were private and incomparable, we could not justify the transfer. Since it is certified, eat the crust.
  — *Max*

  **Dear Maximizer,**
  My neighbor, a Class-4 Monster, claims he has hit a ceiling. He says the fiftieth luxury car brought him no more joy than the forty-ninth. My totalist circle insists we must still take our savings to buy him the fifty-first. Shouldn't diminishing returns apply? If welfare is bounded, doesn't the monster lose its power?
  — *Broke in Boston*

  **Dear Broke,**
  You must distinguish between physical satiation and welfare capacity. If your neighbor's marginal utility has truly dropped to zero, buying the car is wasteful. Resources should only flow where the sum increases. However, be wary of self-reporting. Many Monsters claim boundedness to avoid social friction while retaining unbounded capacity. Verify the metrics. If the welfare function is indeed unbounded above, the obligation remains infinite. If it is bounded, the obligation stops at the asymptote. The moral demand shifts with the factual ceiling. Do not sacrifice savings for zero gain, but do not assume a ceiling exists without audited proof.
  — *Max*

  **Dear Maximizer,**
  I am planning my family. If I have many children with low welfare expectations, they can be used to generate bulk utility for the local Monster cluster. But isn't this the Repugnant Conclusion? Shouldn't we aim for a smaller population with higher average welfare instead? I want to do the right thing without creating a world of mere fuel.
  — *Anxious in Austin*

  **Dear Anxious,**
  The "Repugnant Conclusion" is only repugnant if you privilege average welfare over total welfare. You are a totalist. Adding lives with positive welfare, even if low, increases the sum. If those lives can facilitate greater utility in others (such as the Monsters), the multiplication effect is morally compulsory. A world of billions living barely above neutrality, contributing to a vast sum, is better than a world of few living lavishly. Do not fear the label. Your children are not fuel; they are summands. Maximize the count.
  — *Max*

