      *   *Self-Correction on Q2:* Make sure to emphasize that without further information about *why* they prefer A to B, etc., there is no way to know. It's underdetermined.
      *   *Addressing the "Prudence" argument:* The friend's argument is actually a known counter-argument in philosophy (Resolute Choice). I should mention that. If the agent pre-commits, they effectively change the choice architecture. The user's counter (that this dodges the preference) is also standard (Separability principle). I should explain this tension.

