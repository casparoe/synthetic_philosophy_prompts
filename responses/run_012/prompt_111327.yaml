          *   Analogy: If a triangle's angles don't add to 180, which angle is wrong? You need external measurement.
          *   The "error" is in the *system* of preferences, not a specific pairwise judgment.
          *   Resolution requires introspection on underlying values (multi-attribute utility) or a meta-rule (e.g., "stick with status quo").
      *   **Nuance/Philosophical Context:** Mention Davidson (money pump), McClennen (resolute choice), and the distinction between *local* and *global* preferences.

  5.  **Refine the Tone:**
