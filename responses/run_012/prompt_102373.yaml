      *   **(4) The fact that the bars are just the standard cheap model:**
          *   *Analysis:* Owen thinks this absolves the bench. Nadia thinks this implicates the system. Why is the "cheap/strong" model the one that excludes? Cost-benefit analyses are political decisions (saving money > inclusivity).
