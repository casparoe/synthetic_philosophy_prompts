      *   *Actually, looking closer at (3):* "The moment you explain a character by her circumstances you've stopped writing a novel." This is a very strong claim. It essentially bans naturalism (Zola, Dreiser, Hardy). Given (4) admits a successful deterministic character, (3) is definitely the weak link.

  10. **Final Polish:** Ensure the distinction between *Ontology* (what exists) and *Narrative Necessity* (what makes a story) is clear.

