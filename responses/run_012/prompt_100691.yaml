      *   (3) *Narrative Agency:* Novelistic requirement. Characters must be able to have done otherwise (free will/contingency) or it's sociology, not art.
      *   (4) *Deterministic Intuition:* A specific character in a past book *could not* have done otherwise due to circumstances. This was the point of the book.
      *   (5) *Anti-Holism (Mental):* Groups don't have minds/feelings. "The West wants" is metaphor.
