          *   *What gives:* (3) must change. It's too dogmatic.
          *   *Loss:* You lose the comforting definition that "Novel = Free Will."
          *   *Gain:* You align theory with practice. You allow for tragedy/necessity.
      *   **Analyze Conflict 2 (3 vs. 2/6):**
          *   *The Problem:* If class is a wall (6), how do they do otherwise (3)?
