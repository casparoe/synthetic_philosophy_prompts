      *   *Conflict B: (3) vs. (4).* (3) says characters *must* be able to do otherwise for it to be a novel. (4) says a specific character *could not* have done otherwise, and that made the book good. *Verdict:* **High Severity.** This is a direct contradiction in the user's theory of fiction. One prescribes a rule for *all* novels (or at least "real" novels), the other describes a successful exception that violates the rule.
      *   *Conflict C: (3) vs. (2)/(6).* (3) requires agency ("could have done otherwise"). (2)/(6) emphasize structural determination ("pushes people around"). If structure is a "wall," how much agency is left? *Verdict:* Medium/High Severity. This is the tension between determinism and free will in narrative.
      *   *Conflict D: (1) vs. (5).* These are basically the same point. No conflict.
