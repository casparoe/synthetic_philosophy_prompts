answer: |-
  The 2006 reclassification of Pluto by the International Astronomical Union (IAU) serves as a stress test for Saul Kripke's theory of rigid designation and the necessary *a posteriori*. The episode involves a specific linguistic community (astronomers), a specific evidentiary shift (the discovery of Eris and Kuiper Belt Objects), and a specific semantic event (the resolution defining "planet"). To analyze this through Kripke's *Naming and Necessity*, we must determine whether the term *planet* functions as a rigid designator of a natural kind or as a cluster of descriptions, and what this implies for the metaphysical status of the classification.

  ### I. Rigid Designation and the Natural Kind Hypothesis

  If we treat *planet* as a natural-kind term analogous to *gold* or *water*, it functions as a rigid designator. It picks out the same kind of entity in every possible world where that entity exists. On this reading, the extension of *planet* is fixed by the underlying essence of the objects, not by the descriptions associated with them.

  This forces a dichotomy regarding Pluto's status prior to August 2006.

  **Reading 1: Pluto was always a planet.** If the term *planet* rigidly designated the kind to which Pluto belonged at its "baptism" (its discovery and naming in 1930), then Pluto possesses the essence of planethood. The 2006 IAU vote, therefore, did not discover a fact about Pluto but changed the meaning of the word *planet*. In Kripkean terms, the IAU changed the subject. They stipulated a new definition that excluded an object that was previously in the extension of the rigid designator. This reading preserves the rigidity of the term but renders the IAU resolution a piece of linguistic engineering rather than scientific discovery. It is tolerable only if we accept that astronomical kinds are not natural kinds but institutional ones.

  **Reading 2: Pluto was never a planet.** If the 2006 resolution recorded a discovery of the essential properties of planets (analogous to discovering water is H₂O), then Pluto lacked the necessary essence all along. The vote merely corrected a previous error in identification. This is the reading that aligns with the necessary *a posteriori*: "Pluto is not a planet" would be a necessary truth, knowable only through empirical investigation (the survey of the Kuiper Belt).

  However, this reading is intolerable under strict Kripkean scrutiny. In chemistry, the essence (atomic number) is intrinsic and mind-independent. In the IAU definition, the crucial differentiator—"clearing the neighbourhood of its orbit"—is a relational and dynamical property, not an intrinsic microstructure. A planet's ability to clear its orbit depends on the contingent distribution of other matter in the solar system. If *planet* were a rigid designator of a natural kind, its essence should be internal to the object, not dependent on its neighbors.

  Furthermore, Kripke's model relies on an initial "baptism" where reference is fixed ostensively or by description, followed by a causal chain of transmission. The 2006 vote complicates the notion of baptism. A baptism is typically a singular event introducing a name to a kind. Here, the "baptism" is a committee vote redefining a term in circulation for centuries. Kripke's theory is silent on *legislative baptism*. It accounts for how a name travels through a community, not how a community collectively votes to alter the reference of a name mid-stream. If the reference was fixed in 1930, the 2006 vote breaks the causal chain. If the reference was not fixed until 2006, the term *planet* lacked a rigid designatum for 76 years, which undermines the claim that it functions as a natural-kind term.

  ### II. Descriptivism, Linguistic Labor, and the Case of Vulcan

  If we reject the rigid designator model and assume the reference of *planet* was fixed by a cluster of descriptions (orbiting the Sun, spherical, visible, etc.), the 2006 resolution represents a rewriting of that cluster. This shifts the analysis to the division of linguistic labor.

  In the Kripke-Putnam framework, the division of linguistic labor dictates that experts fix the reference of natural-kind terms, while laypeople defer to them. The 2006 vote vindicates the *authority* aspect of this division: the IAU, as the expert body, successfully dictated the extension of the term to the wider community. However, it exposes the *limits* of the mechanism. In the case of *gold*, experts discover a pre-existing boundary (atomic number 79). In the case of *planet*, the experts *drew* a boundary where nature provided a continuum.

  This distinction becomes sharp when comparing Pluto to *Vulcan*. In the 19th century, *Vulcan* was introduced via a reference-fixing description: "the intra-Mercurial planet causing the perihelion anomaly." When no such object was found, the term failed to refer. *Vulcan* is a case of reference failure due to the non-existence of the object satisfying the description.

  Pluto presents the inverse problem. The object existed, but the satisfaction of the description was in question. Did *planet* have determinate reference before 2006? Under a descriptivist view, the pre-2006 cluster was vague. It included "orbiting the Sun" and "being large," but "large" was undefined. The 2006 vote did not constitute the reference retroactively in a metaphysical sense; rather, it precisified a vague term. Unlike *Vulcan*, where the description failed to latch onto reality, here the reality (Pluto) remained stable while the descriptive latch was adjusted.

  This suggests that *planet* does not have determinate reference prior to the vote in the way *gold* does. The vote does not record a discovery of a pre-existing boundary but constitutes the boundary by convention. If the reference were determinate, the discovery of Eris would have automatically triggered the reclassification (as finding a non-gold metal doesn't change the definition of gold). Instead, a vote was required. This indicates that the reference of *planet* is not fixed by the world alone, but by the world plus a stipulative decision.

  ### III. The Necessary A Posteriori and Astronomical Kinds

  Finally, we must assess what this episode reveals about the necessary *a posteriori*. Kripke argues that identity statements involving rigid designators (e.g., "Heat is molecular motion") are necessary truths known *a posteriori*. Is there a necessity of the form "Planets are F" that only experience could teach us?

  If *planet* is a natural kind, then "Planets clear their orbits" would be a necessary truth discovered *a posteriori*. But the 2006 episode demonstrates that this "necessity" is not metaphysical but taxonomic. The evidence (Eris, Kuiper Belt Objects) did not reveal a hidden essence of Pluto; it revealed a proliferation of similar objects. The "necessity" of the new definition arises from the desire to limit the number of planets, not from the nature of Pluto itself.

  This suggests a boundary for Kripke's model. The model covers chemical and biological kinds successfully because these kinds are grounded in intrinsic microstructures (atomic number, DNA) that exist independently of human classification. Astronomy, at the level of macroscopic classification, deals with relational and dynamical properties that often admit of degrees. There is no "atomic number" for planethood.

  Consequently, the proposition "Pluto is not a planet" is not a necessary *a posteriori* truth in the Kripkean sense. It is a contingent truth dependent on a convention adopted in 2006. The Kripkean model is silent on classificatory kinds where the boundary is drawn by consensus rather than discovered in the microstructure. To force the Pluto case into the *Naming and Necessity* framework is to conflate institutional stipulation with metaphysical necessity.

  ### Conclusion

  The 2006 reclassification of Pluto shows that while astronomical terms mimic the grammar of natural-kind terms, they often function as institutional kind terms.
  1.  **Rigid Designation:** The account forces the reading that Pluto was never a planet (discovery of essence), but this is intolerable because the "essence" is relational and stipulative. The notion of a "baptismal event" fails when the baptism is a committee vote rewriting history rather than an ostensive act naming a kind.
  2.  **Descriptivism:** The division of linguistic labor is vindicated in authority but exposed in mechanism; experts did not find a boundary, they set one. Unlike *Vulcan*, where reference failed, *planet* had vague reference that was sharpened retroactively by convention.
  3.  **Necessary A Posteriori:** The episode shows that not all scientific identities are necessary. There are no necessities of the form "Planets are F" teachable only by experience in astronomy comparable to chemistry. The Kripkean model covers kinds grounded in intrinsic structure but leaves the classificatory kinds of astronomy to convention.

  Where the theory is silent, we must acknowledge it: Kripke's framework does not account for the semantic mechanics of democratic or committee-based reference fixing, nor does it distinguish between kinds discovered in nature and kinds imposed upon continua for the sake of utility. Pluto remains a dwarf planet not because of what it is, but because of what we decided to say about it.
