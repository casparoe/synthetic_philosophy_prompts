  *(Self-Correction Note)*: I need to make sure I don't just give a philosophy lecture. The user leads research at a foundation. The output needs to be actionable as a *research agenda*, even if conceptual. It needs to suggest *what kind of work* constitutes an answer (e.g., "comparative constitutional analysis" rather than "think about it").

  *(Final thought on the Three Models)*:
  *   US: The State as Referee (Individual vs. Corporation).
  *   DE: The State as Guardian of Dignity (Constitutional Order).
  *   CN: The State as Architect of Harmony (Collective Stability).
  *   *Research implication:* The agenda shouldn't try to find the "true" answer, but to map the incompatibilities.

