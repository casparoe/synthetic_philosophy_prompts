prompt: |-
  I have just moved from a decade in the US technology sector to lead research at a small digital-rights foundation in Berlin, and the change in what the state is presumed entitled to know has become personally inescapable: the same routine forms now arrive in a jurisdiction where data minimization is the default rather than the exception, and I find myself filing them differently depending on which government is asking. My board has given me a three-year window to set a conceptual research agenda, and I want it to turn on questions rather than on commentary about whatever regulation is currently in the news. Which open questions about how far citizens should be able to hide from the state most deserve sustained attention, and in what order? I care far less about the list than about the reasoning: which questions are upstream of which — does the answer to what privacy is ultimately for actually constrain how one should think about data trusts, consent regimes, or scoring systems? — which are tractable for a small team with no empirical apparatus, and what evidence or argument over the next few years would move a question up or down the ranking. Please also name the questions you would deliberately deprioritize because settling them would not change much downstream, and treat the German, American, and Chinese arrangements as embodying three genuinely different premises about the citizen-state relation rather than as points on a single axis running from openness to control.
reasoning: |-
  Here's a thinking process that leads to the suggested research agenda:

  1.  **Analyze the User and Context:**
      *   **Background:** 10 years in US tech sector $\rightarrow$ Lead Research at a small digital-rights foundation in Berlin.
      *   **Experience:** Personal friction between US data norms (surveillance capitalism/state access) and EU/German norms (data minimization, GDPR).
      *   **Task:** Set a 3-year conceptual research agenda.
      *   **Constraint 1 (Crucial):** Focus on *open questions*, not commentary on current regulations/news.
      *   **Constraint 2 (Crucial):** Prioritize based on *reasoning* (upstream/downstream dependencies), not just a list.
      *   **Constraint 3 (Crucial):** Tractability for a *small team* with *no empirical apparatus* (theoretical/conceptual work).
      *   **Constraint 4 (Crucial):** Identify criteria for moving questions up/down the ranking (evidence/arguments).
      *   **Constraint 5 (Crucial):** Name *deprioritized* questions (and why).
      *   **Constraint 6 (Crucial):** Treat German, American, and Chinese models as *distinct premises* about citizen-state relations, not points on a single spectrum.

  2.  **Deconstruct the Core Problem:**
      *   The core tension is "How far should citizens be able to hide from the state?"
      *   The user wants to know *which questions matter most* to answer this, and *in what order*.
      *   The "Upstream/Downstream" metaphor is key. If we don't know *why* privacy matters (teleology), we can't design *how* to protect it (mechanisms like data trusts).

  3.  **Develop the Conceptual Framework (The "Why" before the "How"):**
      *   *Upstream:* Ontology of the Self, Teleology of Privacy, Legitimacy of State Knowledge.
      *   *Midstream:* Institutional Architectures (Trusts, Consent), Epistemic Asymmetries.
      *   *Downstream:* Specific Regulations, Compliance Mechanisms, Scoring Systems.
      *   *Constraint Check:* The team is small and theoretical. They can't run large-scale experiments. They must focus on philosophy, legal theory, and system design logic.

  4.  **Drafting the Research Questions (Iterative Process):**

      *   *Attempt 1 (Too generic):* Is privacy a human right? How do data trusts work? Is social credit bad?
      *   *Attempt 2 (Better):* What is the function of obscurity? Can consent exist in power asymmetries?
      *   *Attempt 3 (Aligned with prompt):* Focus on the *premises* of the three models (US, DE, CN).
          *   US: Market/Individual liberty (State as referee).
          *   DE: Dignity/Democracy (State as guardian of rights, but limited).
          *   CN: Stability/Collective (State as parent/architect).
      *   *Refinement:* The questions need to be *conceptual* and *upstream*.

      *   *Selection:*
          1.  **The Teleology Question:** What is privacy *for*? (Dignity vs. Liberty vs. Security). This determines everything else.
          2.  **The Epistemic Question:** What does the state *need* to know to function? (Legibility vs. Opacity).
          3.  **The Agency Question:** Can "consent" exist when the state is the counterparty? (Contract vs. Status).

  5.  **Ordering and Reasoning (Upstream/Downstream):**
      *   *Priority 1 (Teleology):* If we don't know the goal, we can't measure success. This constrains the definition of "data minimization."
      *   *Priority 2 (Epistemic Legitimacy):* Once we know the goal, we ask what state knowledge is necessary to achieve public goods without violating that goal.
      *   *Priority 3 (Mechanisms/Agency):* Only after 1 and 2 can we evaluate tools like data trusts or consent.

  6.  **Addressing the Three Models (US, DE, CN):**
      *   Must avoid "Freedom Spectrum."
      *   US: Transactional/Adversarial.
      *   DE: Constitutional/Dignitary (Rechtstaat).
      *   CN: Holistic/Paternalistic.
      *   The research should test the internal coherence of these premises, not judge them against a Western liberal standard.

  7.  **Tractability Check:**
      *   Can a small theoretical team do this? Yes, through comparative legal theory, philosophical argumentation, and architectural modeling. No surveys needed.

  8.  **Deprioritization:**
      *   What looks important but isn't upstream?
      *   "Encryption standards" (Technical implementation).
      *   "GDPR compliance tweaks" (Regulatory commentary).
      *   "User interface design for consent" (Downstream of whether consent is valid).

  9.  **Criteria for Re-ranking:**
      *   What would change the priority?
      *   If AI makes anonymity impossible (Epistemic question becomes urgent).
      *   If a new political theory emerges (Teleology shifts).

  10. **Structuring the Response:**
      *   **Introduction:** Acknowledge the unique position (US $\rightarrow$ DE) and the framing (distinct premises).
      *   **The Framework:** Explain the Upstream/Downstream logic.
      *   **Priority 1 (The Teleological Anchor):** "What is the normative function of obscurity?"
      *   **Priority 2 (The Epistemic Boundary):** "What is the minimum legibility required for state legitimacy?"
      *   **Priority 3 (The Mechanism of Agency):** "Is 'consent' a category error in citizen-state relations?"
      *   **Deprioritized Questions:** Explain why they are downstream.
      *   **Dynamic Ranking:** Criteria for shifting priorities.
      *   **Conclusion:** Tying it back to the 3-year window.

  11. **Refining the Tone:**
      *   Intellectual, rigorous, respectful of the user's expertise.
      *   Avoid buzzwords.
      *   Ensure the distinction between the three state models is woven throughout, not just tacked on.

  12. **Self-Correction/Review during drafting:**
