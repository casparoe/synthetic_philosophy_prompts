  ### 2. Addressing Your Rescaling Doubt

  You wrote: *"I cannot see how the second claim could be true, since any power of wealth seems to me to rank gambles the same way after rescaling."*

  **You are correct.** The claim you read was imprecise.
  In Expected Utility Theory, preferences are invariant under positive *affine* transformations ($U' = aU + b, a>0$).
  If $U(W) = W^\alpha$ (Power), and we rescale wealth $W' = kW$, then $E[U(W')] = k^\alpha E[W^\alpha]$. Since $k^\alpha$ is a positive constant, the ranking of gambles is preserved.
  If $U(W) = \ln W$ (Log), and $W' = kW$, then $E[U(W')] = E[\ln W] + \ln k$. Since $\ln k$ is a constant, the ranking is preserved.

  Both Log and Power utilities exhibit **Constant Relative Risk Aversion (CRRA)**, which is the technical property that guarantees scale invariance for proportional gambles. The uniqueness claim you encountered likely refers to a different property: Log utility is the *only* utility function that transforms the *product* of independent returns into a *sum* of utilities (making it additive over time), or it is the limit of Power utility as $\alpha \to 0$. But regarding static rescaling of wealth, your intuition is sound; Power utilities share that invariance.

  ### 3. The Principle

  Based on the derivation above, here is the principle that generates your verdicts.

  **Principle: Expected Shifted-Log Utility**
  You maximize the expected value of the natural logarithm of your total wealth plus a fixed subsistence constant.
  $$ \text{Maximize } E[\ln(W_{final} + \delta)] $$
  where:
  1.  $W_{final}$ is your liquid wealth after the gamble.
  2.  $\delta$ is a "residual wealth" parameter, calibrated to approximately **1% of your current total wealth** ($\delta \approx 0.01 W_0$).
  3.  You treat this as a single-shot decision (consistent with Case 8), not an asymptotic growth rate.

  **(b) Clause Motivation:**
