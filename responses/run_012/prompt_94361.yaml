  *   **Shift Parameter ($\delta$):** Motivated by **Cases 5, 6, and 7**. Pure Log rejects any gamble with a non-zero probability of $W=0$. You accept Case 6 (1000x) but reject Case 5 (3x). This implies $U(0)$ is finite, not $-\infty$. The indifference in Case 7 fixes $\delta \approx 0.01$.
  *   **Single-Shot Evaluation:** Motivated by **Case 8**. You decline the "Triple or nothing" even when told it is the *last* decision of your life. This confirms you are not rejecting it because of long-run ruin, but because the single-shot expected utility is negative.
  *   **Domain Restriction:** Motivated by **Case 9**. You refuse to apply the rule when "wealth" cannot be quantified. The principle applies only where $W$ is well-defined.

