  Final wealth if lose: $W_{lose} = 1 - af$.
  (For "Double or nothing" style cases, $f=1$ is fixed).

  I will test three candidate principles against your data:
  1.  **Expected Value (Risk Neutral):** Maximize $E[W]$.
  2.  **Pure Expected Log-Wealth (Kelly):** Maximize $E[\ln W]$.
  3.  **CRRA Power Utility:** Maximize $E[W^\alpha]$ for $\alpha \in (0,1)$.

  **Case 1: Even money ($b=1, a=1$), $p=0.6$. Choice of $f$.**
  *   **EV:** Stake $f=1$. (You say $0.2$). **Fail.**
  *   **Kelly:** Max $0.6 \ln(1+f) + 0.4 \ln(1-f)$. FOC $\Rightarrow f = p - q = 0.2$. **Match.**
  *   **Power ($\alpha$):** As $\alpha \to 0$, converges to Kelly. For $\alpha > 0$, $f$ increases. To match $0.2$, $\alpha$ must be very small.

  **Case 3: 10-to-1 ($b=10, a=1$), $p=0.5$. Choice of $f$.**
  *   **Kelly:** Max $0.5 \ln(1+10f) + 0.5 \ln(1-f)$. FOC $\Rightarrow \frac{5}{1+10f} = \frac{0.5}{1-f} \Rightarrow 10(1-f) = 1+10f \Rightarrow 9 = 20f \Rightarrow f = 0.45$. **Match** ("just under half").
  *   **Power:** To fit the "Ruin" cases below (see Case 7), we will see we need $\alpha \approx 0.15$. If we plug $\alpha=0.15$ here:
