answer: |-
  Right. Let's translate this philosophical row into the language of the repository. You're asking whether the *creator's* biographical metadata corrupts the *intellectual content* of the records. Here is the dispute restated in your terms, followed by the residue report.

  ### The Dispute Restated

  **Side A: The Separation of Series (The Autonomy of the Record)**
  This position argues for a strict intellectual arrangement within the *fonds*. It posits that the 'Logical Works' series possesses *evidential value* independent of the 'Personal Papers' series. While *provenance* is shared (same creator), the *context* required to interpret the logic is internal to the record itself, not external in the biographical note. The *appraisal* of the logic's significance relies on its functional utility to subsequent researchers, not the *administrative history* of the creator. Therefore, the antisemitic diary is a separate series with restricted *access conditions* regarding its interpretive weight; it should not alter the *original order* of the logical system, which stands on its own structural integrity. The *chain of custody* of the ideas remains unbroken and untainted by the creator's private prejudices.

  **Side B: The Holistic Fonds (The Contamination of Provenance)**
  This position argues that *respect des fonds* demands we treat the creator as a single, indivisible unit of provenance. You cannot appraise the value of the 'Logical Works' without processing the entire *fonds*, including the diary. The *context* here is not just administrative but psychological and moral. The *record/context distinction* collapses; the diary provides essential *metadata* that reclassifies the logic from 'objective truth' to 'subjective artefact of a biased mind'. The *chain of custody* of the logic passes through a compromised creator, affecting the *integrity* of the intellectual output. Consequently, *access conditions* for the logic must include a warning note or interpretive framework derived from the diary, fundamentally altering how the *series* is described and understood.

  ***

  ### Residue Report

  Here is how the philosophical problem maps onto your archival framework.

  **1. Maps Cleanly**
  *   **Provenance:** Both sides agree the records originate from the same creator. The dispute is purely about how much weight the *biographical history* carries in the *finding aid*.
  *   **Appraisal:** The core of the row is an appraisal decision. Side A appraises the logic for its *informational value* to mathematics. Side B appraises it for its *evidential value* regarding the history of ideas, which includes the creator's biases.
  *   **Series:** The physical or intellectual separation of 'Work' vs. 'Life' is exactly what archivists do when arranging a *fonds*. The dispute is whether these series are hermetically sealed or permeable.

  **2. Maps with Distortion**
  *   **Chain of Custody:** In archives, this tracks physical possession to ensure authenticity. In the Frege dispute, it tracks the transmission of *truth*. Archives guarantee the record is what it claims to be; they do not guarantee the propositions within are logically sound. Using 'custody' to track 'validity' stretches the term.
  *   **Original Order:** Frege did not physically file his *Begriffsschrift* next to his antisemitic ramblings. The 'order' being debated is conceptual, not physical. Imposing an intellectual link where no physical link exists is an interpretive act, not an archival one.
  *   **Access Conditions:** In archives, restrictions are usually legal (GDPR, sensitivity) or preservation-based. Here, the proposed restriction is *moral* or *epistemological*. We don't typically restrict access to a record because the creator was a bigot; we might contextualise it, but the *access* remains.

  **3. No Counterpart At All**
  *   **Truth-Value vs. Authenticity:** This is the hard stop. Archives deal in *authenticity* (is this the letter Frege wrote?) not *truth* (was Frege right about logic?). The philosophical dispute is about whether the logic *is* objective. Archival science takes no position on the objective truth of the content, only its provenance.
  *   **Moral Taint:** Archives operate on the principle of preservation regardless of moral standing. We hold the records of oppressors and oppressed alike. The idea that a record loses its 'logical power' because the creator was morally compromised has no archival equivalent. A racist map is still a valid map of the territory it surveyed.

  ***

  ### The Verdict on the Framework

  You asked whether the bit that doesn't translate (the Truth-Value/Moral Taint) is a hole in your framework or a sign the original dispute is doing less than it looks.

  It is the latter. The dispute is doing less work than it looks.

  The philosophers are trying to solve an epistemological problem (is logic objective?) using a biographical tool (the diary). Your archival framework exposes this category error. In your trade, you know that the *provenance* of a record does not determine the *accuracy* of its content. A surveyor's map is valid or invalid based on the terrain, not based on whether the surveyor was a good citizen.

  The non-translatable bit reveals that the philosophers are conflating *genesis* with *validity*. They are treating the *context of creation* as if it were a *condition of access* to the truth. Your framework handles the *context of creation* beautifully (that is what *provenance* is for), but it rightly refuses to let that context dictate the *validity* of the record's content.

  So, it's not a hole in your framework. It's a feature. The archival distinction between the *record* (the artefact) and the *information* (the content) protects you from having to adjudicate on the moral or logical truth of the creator's claims. The Frege row persists only because the philosophers are refusing to make that distinction. They want the *provenance* to invalidate the *record*. Your training tells you that's impossible; the record exists, the provenance is fixed, and the researcher must do the work of appraisal themselves.

  The residue suggests the philosophers are asking the archive to do something it isn't built for: moral arbitration. You catalogue the diary, you catalogue the logic, you link them in the *biographical note*, and you leave the *appraisal* of their relationship to the reader. Anything else is out of scope.
