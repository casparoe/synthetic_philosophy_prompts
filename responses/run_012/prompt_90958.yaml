answer: |-
  **Project Title:** The Structure of Dietary Harm: Beyond the 'Deaths Per Calorie' Metric

  **Project Summary**
  Contemporary public discourse on the ethics of eating relies heavily on a specific metric: the number of animals killed per calorie or gram of protein produced. This metric is used to argue that beef is ethically preferable to chicken, and plant-based diets are preferable to both. This project challenges the theoretical adequacy of this metric. It hypothesizes that the debate conflates two distinct questions: how many deaths a diet causes, and how much total disvalue (suffering plus death) it causes. By treating all deaths as interchangeable and ignoring the quality of life preceding death, the standard metric may yield recommendations that contradict the moral theories used to justify them. Furthermore, it fails to account for the trade-off implied by the argument that animal agriculture benefits animals by bringing them into existence. This research will determine whether "dietary harm" can be represented as a single scalar quantity or if it requires a multi-dimensional structure.

  **Research Question**
  The central research question is: *Is 'dietary harm' representable as a single scalar quantity sufficient for ranking diets, or does moral adequacy require a multi-dimensional vector distinguishing mortality rates from welfare deficits?*

  A secondary question follows: *If a single scalar is inadequate, what is the minimal formal structure required to compare diets without collapsing distinct moral variables?*

  The goal is a determinate answer regarding the formal properties of ethical comparison in this domain. If a single scalar is sufficient, the project will identify the weighting function required to reconcile death counts with welfare. If it is not, the project will produce a decision matrix showing where the standard metric diverges from morally robust alternatives.

  **Background and Existing Positions**
  Current arguments regarding the ethics of eating generally fall into three camps, none of which fully resolve the metric problem.

  First, the *Aggregative Consequentialist* position holds that the right diet minimizes total suffering and deprivation. While this view theoretically accounts for the quality of life, in practice, it often adopts the "deaths per calorie" metric as a proxy for harm. This creates a gap: a diet that kills fewer large animals might cause more aggregate suffering if those animals endure prolonged misery, or if the alternative (e.g., crop agriculture) kills many small animals with short, negative welfare lives. The standard metric cannot capture this trade-off.

  Second, the *Rights-Based* position holds that killing is a violation of a subject's right to life, regardless of welfare consequences. This view supports minimizing deaths but collides with the "Logic of the Larder" argument: if domesticated animals would not exist without agriculture, does killing them violate a right they would otherwise never possess? A metric based solely on death counts cannot represent this trade-off between existence and duration of life. It treats a death as a negative integer, whereas the rights view might treat the creation of the life as a neutral or positive precondition.

  Third, the *Fewest-Deaths* argument explicitly prioritizes minimizing the count of individuals killed. This view treats the death of a field mouse as morally equivalent to the death of a cow. This leads to counterintuitive results regarding "disvalue." If the moral cost of death correlates with the loss of future goods or social bonds, a single metric fails to weigh these differences.

  All three positions leave open whether a single number can rank diets. They assume commensurability without demonstrating it.

  **Methodology**
  This project requires no new empirical data. It will proceed via conceptual analysis and formal modeling of ethical metrics.

  1.  **Formal Characterization:** I will define candidate metrics as mathematical functions. The standard metric is a simple count function ($M_1 = \sum deaths$). Alternative metrics will be constructed to include welfare weightings ($M_2 = \sum (death + suffering)$) and existence adjustments ($M_3 = \sum (death - benefit\_of\_existence)$).
  2.  **Thought Experiments:** I will construct cases where these metrics diverge.
      *   *Case A:* High death count, low individual suffering (e.g., pest control in plant agriculture) vs. Low death count, high individual suffering (e.g., confined animal feeding operations).
      *   *Case B:* Short life with positive welfare ended early vs. Long life with negative welfare ended early.
      *   *Case C:* Diets that require bringing animals into existence to be killed vs. diets that involve no animal creation.
  3.  **Stress Testing:** I will test whether the standard metric can be "saved" by adding weighting factors (e.g., weighting a cow death as 1000 mouse deaths). If the weights vary by context, this proves the metric is not a scalar but a vector.

  **Expected Outcomes and Success Criteria**
  A successful result will demonstrate that the "deaths per calorie" metric is category-mistaken. Specifically, success looks like a proof that for any proposed weighting scalar, there exists a possible world (or plausible empirical scenario) where the scalar recommends a diet that increases total disvalue. The deliverable will be a taxonomy of comparison structures, showing that adequate ethical comparison requires at least two dimensions: *mortality impact* and *welfare impact*.

  Failure would take two forms. Theoretical failure would occur if it can be shown that all plausible moral theories collapse into a single scalar under ideal information, rendering the distinction merely pedagogical. Practical failure would occur if the analysis dissolves into a verbal dispute about the definition of "harm." To mitigate the latter, the project will define "harm" operationally by *decision-guidance*: if two metrics recommend different diets in the same scenario, the dispute is substantive, not verbal.

  **Scope and Feasibility**
  This project is designed for a single researcher over six months.
  *   **Months 1-2:** Formalization of the metrics and review of existing conceptual arguments regarding commensurability.
  *   **Months 3-4:** Development of thought experiments and testing for divergence points.
  *   **Months 5-6:** Drafting the final paper and decision matrix.

  The scope is limited to the *structure* of the comparison, not the empirical inputs. I will not calculate the specific suffering of cows versus mice, but rather determine how such calculations *ought* to be integrated into a metric. This ensures the project remains within the bounds of philosophical analysis while producing a tool applicable to empirical ethics. The result will be a paper suitable for publication in ethics journals, providing a clearer framework for advocates and policymakers who currently rely on oversimplified body counts.
