      *   *Enforcement/Process:*
          *   German: Investigation seeks *truth* of the violation. Did it happen? Yes -> Sanction.
          *   US: Investigation seeks *liability* and *consistency*. Was the process followed? Was everyone treated the same? Is there a precedent?
          *   Conflict: A German HR head fires someone immediately upon proof. US legal/HR says "Wait, did we follow progressive discipline? Did he sign the policy?"

      *   *The "Individualism" Question:*
          *   Is US morality individualistic? Not really. It's *contractual*. The authority is relocated to "The Deal" or "The Customer."
          *   Implication: US employees will follow rules that protect *them* or the *customer*, but resist rules that seem like arbitrary control from HQ.

  5.  **Refining the Framing (Critique & Pivot):**
      *   The user's framing ("Order/Correctness" vs. "Consent/Process") is actually quite strong. I should validate it but sharpen it.
      *   Better Framing: *Deontological Systemic Integrity* (German) vs. *Pragmatic Contractual Legitimacy* (US).
      *   Actually, let's stick closer to the user's insight: *Substantive Normativity* vs. *Procedural Legitimacy*.
