  2.  **Deconstruct the Moral Grammars:**
      *   *German "Rule-Following" (Ordnung):* It's not just blind obedience. It's about *systemic integrity*. Rules create a predictable space where everyone knows their lane. Violation isn't just "breaking a rule"; it's destabilizing the system. The authority lies in the *rule itself* (objectified reason).
      *   *American "Conscience/Process" (Fairness/Consent):* It's not anarchic. It's about *legitimacy of authority*. Rules are valid if they are fairly applied, agreed upon, and don't infringe on rights. Violation is often seen as "unfairness," "betrayal of trust," or "overreach." The authority lies in the *agreement* or the *outcome*.
      *   *Refinement:* The user is right. It's not Rules vs. No Rules. It's *Substantive Correctness* (German) vs. *Procedural Legitimacy* (American).

  3.  **Analyze the Concrete Scenario (Code of Conduct):**
      *   **Topics:** Expense fudging, gift-taking, safety violations (covering for a buddy).
      *   **Constraint:** One document.
      *   **Risk:** Vagueness (toothless) vs. Imperialism (German norms imposed on US).

  4.  **Drafting the Implications (Iterative Process):**

      *   *Sentence Interpretation:*
          *   German read: "Employees must not accept gifts." -> *Absolute prohibition.* Exceptionless unless codified.
