      *Key Insight to integrate:* The US code is a *contract* (sign here, agree to these terms, we can fire you if you break them). The German code is a *normative expectation* (this is how we behave as members of this entity). The Works Council (*Betriebsrat*) in Germany actually makes the US "contract" model harder to implement in Germany, while the German "norm" model feels oppressive in the US. Wait, the prompt says German Parent, US Subsidiary. So the Works Council is in Germany. The US is "at-will." This creates a tension: The German parent wants the US to be as rule-bound as Germany, but the US legal environment demands specific liability protections.
      *Actually, the prompt asks about the moral culture, not just legal.* Stick to the ethics.

      *Revised Framing:* **Principle-Based Universality (German)** vs. **Case-Based Precedent (US).**
      German: The rule applies because it is Right.
