      *   *Critique:* The "German = Rules" stereotype ignores that German co-determination (*Mitbestimmung*) is highly procedural and consensus-based. The "US = Individual" stereotype ignores the litigious, rule-bound nature of US compliance.
      *   *Pivot:* The real difference isn't Rules vs. Conscience. It's **Ex-Ante Clarity** (German) vs. **Ex-Post Adjudication** (US). Germans want the rule to decide the case beforehand. Americans expect the context to decide the case, with the rule as a guideline for litigation/HR judgment.

  6.  **Developing the "Smartest Realistic Design":**
      *   Since we need one document, it can't be specific on *values* (too vague) or *specifics* (too rigid).
      *   It needs to be a **Procedural Constitution**.
      *   Instead of "Do not take gifts," write "Gifts must be declared via Form X if they exceed Value Y, subject to Manager Z approval."
