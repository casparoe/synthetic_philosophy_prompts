  (2) 0.40 — Deriving normative reasons from psychological preconditions risks committing the naturalistic fallacy.
  (3) 0.60 — The effect scales with group size, making "humanity" less special than "community" or "codebase."
  (4) 0.75 — The mechanism is distinct from future-welfare arguments, even if the practical conclusion overlaps.

  **How they combine:** The high psychological confidence is bottlenecked by the normative leap; even if we *would* feel undermined (1), it doesn't prove our reasons *are* undermined (2), while the scope issue (3) suggests the phenomenon is real but less metaphysically weighty than Scheffler implies.

  **Least confident:** Term (2). I would move this if you provided a meta-ethical account showing how constitutive psychological conditions generate normative authority rather than just describing our biases.

  **Variants:**
  (a) **Down.** If successors share no memory or culture, the "social" transmission of value required for projects (like code) seems severed, making mere biological survival insufficient for meaning.
  (b) **Stays the same.** 500 years exceeds the horizon of almost all current human projects, so the "assumption of continuity" relevant to our current reasons remains functionally intact.
