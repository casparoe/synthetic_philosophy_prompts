answer: |-
  In a joint venture governed by a strict authorship agreement, D deliberately submits V's solo work under D's name alone to secure a promotion. V discovers the theft and feels betrayed, but V is notorious in the firm for habitually claiming credit for her subordinates' labor, a fact known to D and B alike. B, an external auditor observing the submission process, has no prior professional ties to either party and maintains a spotless record regarding credit attribution. The theft costs V a significant bonus and public recognition, D acted out of calculated self-interest without coercion or ignorance, and B witnesses the entire exchange with full access to the authorship logs and knowledge of V's reputation.

  **Walkthrough**

  On the Strawson-ish view, both V and B are fully justified in their reactive attitudes. The core question is whether D's will displayed ill will or disregard, and here it clearly did. Since the aptness of the attitude tracks the quality of will alone, V's resentment and B's indignation are the same species of response, merely occupied from different seats. V's own history of wrongdoing is irrelevant to the aptness of her feeling because it does not change the fact that D disregarded her.

  On the Standing view, V's blame is inappropriate while B's is appropriate. Blame is a demand for compliance with a norm, and one lacks the authority to make that demand if one is not in good standing regarding the norm itself. V is a hypocrite regarding credit attribution, which silences her authority to demand D adhere to it. B, having adhered to the norm, retains the standing to demand compliance. Thus, V's resentment is structurally defective as a form of blaming, whereas B's is valid.

  On the Relationship view, V's resentment is apt but B's is not blame at all. Blame is the registration of damage to a specific relationship of mutual expectation. V and D had a collaborative partnership that D damaged, so V's resentment registers that specific injury. B and D share no such relationship; therefore, there is no relational damage for B to register. B may feel moral disapproval, but it cannot be blame in the strict sense, whereas V's response is the paradigm case.

  | View | Verdict on V's Resentment | Verdict on B's Resentment | Is B's attitude the same attitude as V's, just from a different seat? | What the view treats as doing the work | Weakest Point in that Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | Strawson-ish | Apt | Apt | Yes, both are responses to quality of will. | The seat (perspective) | Ignores the intuitive impropriety of hypocritical blame. |
  | Standing | Inapt | Apt | No, V lacks the authority to make the demand. | The title (moral standing) | Silences the victim despite genuine harm and responsibility. |
  | Relationship | Apt | Inapt (not blame) | No, B lacks the relationship to damage. | The relation (interpersonal history) | Makes blame too exclusive, excluding legitimate moral community concern. |

  **Collapse Test and Counterattack**

  The feature doing all the work is V's history of hypocrisy. If you delete it—making V an honest actor—the Standing view collapses into agreement with the Strawson-ish view, as V now possesses the standing to blame, leaving only the Relationship view distinct on B's status. The Strawson-ish view comes out looking worst here because it validates V's blame despite her hypocrisy, which feels intuitively unfitting. A defender of the Strawson-ish view would attack the case by arguing it conflates the *aptness* of the emotional attitude with the *propriety* of its expression. They would claim V's resentment is internally rational and apt given D's disregard, even if social norms rightly prevent her from *voicing* that blame effectively; the case tests the social act of blaming, not the reactive attitude itself.
