  This is cursed, as you noted, and for good reason. The frequency of "thinking about the Doomsday Argument" is a memetic variable, not an existential one. It depends on internet archives, philosophy curricula, and AI training data, none of which are causally coupled to extinction risk in a way that isn't already captured by other evidence. It's a reference class of one, gerrymandered to the point of meaninglessness. It is effectively noise.

