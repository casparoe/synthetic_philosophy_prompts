  This is generally considered a *reductio ad absurdum* of the SSA logic. We have tight biological priors on human lifespans (actuarial tables, cell senescence, etc.). The uncertainty in "how long will I live" is orders of magnitude smaller than "how long will civilization last." Therefore, the Bayesian update from noticing your current age is negligible. If this argument worked as well as the Vanilla one, you would be forced to predict your own death constantly. It gets a non-zero score only because "accidental death" is a non-zero risk, but it shouldn't move your worldview.

