          *   *Accept:* Yes, this is the slogan.
          *   *Wince:* "In control of the outcome" is tricky. Option luck is about *risk*, not certainty. If I skydive and the chute fails, is that option or brute? (Dworkin says option if the risk was known).
      *   **Point 2: The Currency Claim (Resources vs. Welfare).**
          *   *Wince:* Big error. It matters immensely. Dworkin (Resources) vs. Arneson (Welfare). Expensive tastes are the battleground. If I choose to love champagne, do I get compensated? Luck egalitarians disagree.
      *   **Point 3: "Strict Egalitarians + Responsibility".**
          *   *Wince:* This minimizes the theoretical shift. It's not just "equality but..." It's "equality *because* of luck." It changes the *telos* of the theory.
      *   **Point 4: The Relational Objection (Anderson).**
          *   *Accept:* Yes, this is Elizabeth Anderson's famous critique ("What is the Point of Equality?").
          *   *Wince:* Calling it "decisive" is biased. Luck egalitarians (like Dworkin or Otsuka) have replies. They usually advocate for a *baseline* of welfare before the luck/choice calculus kicks in. They don't actually want people to starve.
      *   **Point 5: The "Heartless" Intuition.**
