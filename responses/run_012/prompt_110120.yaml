answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Brother]'s brother and the Best Man. I'd like to start by thanking you all for coming. We've got a lovely mix today—wise elders who've seen it all, and close mates who've seen… well, perhaps a bit too much.

  Now, throughout the day, I've heard a recurring theme from the family. A sort of collective nodding whenever [Brother] and [Partner] are mentioned. "We all knew," people say. "We knew from the start they were perfect for each other."

  It's a lovely sentiment. It gives the impression of a grand, family-wide intuition. But, as the Best Man, I feel it's my duty to look at the data. And when you actually trace the source of this certainty, the history is a bit… noisier than people let on.

  The truth is, the very first person to declare them a "perfect match" was Auntie [Auntie's Name]. And she didn't base this on a quiet conversation over tea. She based it on seeing them having a proper shouting match in the car park at Christmas.

  Apparently, it was vigorous. Passionate, even. But Auntie [Auntie's Name] watched them through the window, saw the way they made up afterwards, and declared to the room: "They're the one."

  And here's the thing: once she said it, everyone else followed. Suddenly, the whole family knew. If you ask me, it was a classic case of the family herd spotting a signal and deciding to run with it. We all just took Auntie's word as public proof and ignored our own private doubts.

  I actually had a debate with a mate recently about this. He reckons that's perfectly rational. He says when you see enough people following a signal, you ignore your own judgement and join the crowd. It's efficient. It's logical.

  But I told him that's a cynical way to look at a wedding. Because if we were just following the herd, if we were just reacting to Auntie [Auntie's Name]'s car park observation, then this celebration would be built on a rumour. And group certainty isn't proof of anything. Just because everyone says something is true, doesn't make it so. We all know families. We'd agree on anything to avoid an argument at the buffet.

  However… there is a twist.

  Because while the *reason* we all started talking might have been a bit of a herd mentality, the *result* turns out to be right. Not because of the signal, but because of what happened after the noise settled.

  Love isn't about never having a row in a car park. It's not about a clean, logical path where everyone agrees instantly. It's messy. It's noisy. It's about two people who can have a proper disagreement, walk away, and then decide five minutes later that they'd rather be together than be right.

  Auntie [Auntie's Name] didn't spot a perfect, friction-free relationship that day. She spotted resilience. She saw that even at their loudest, they were still listening. And the rest of us followed that signal not because we're sheep, but because deep down, we recognised something solid beneath the noise.

  [Partner], you look absolutely stunning today. Thank you for making my brother so happy, and for having the patience to deal with him even when he's being stubborn enough to argue in a car park. You've brought a calmness to him that none of us could ever achieve.

  [Brother], you're a lucky man. You've found someone who matches you, challenges you, and sticks by you.

  So, I'm not going to pretend the family's certainty was some sort of scientific proof. We were guessing. We were hoping. We were following a lead. But sometimes, the herd stumbles onto the truth even if they got the map wrong.

  Please raise your glasses.

  To [Brother] and [Partner]. May your life together be full of love, full of laughter, and may all your arguments be resolved before you get out of the car park.

  To the happy couple!
