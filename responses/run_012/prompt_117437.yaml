answer: |-
  # Activity Plan: The Urn Protocol

  **Objective:** To demonstrate that information cascades can occur even when every individual acts rationally to maximize their own accuracy, resulting in a confident but fragile consensus that ignores later private information.

  **Time:** 90 Minutes
  **Participants:** 18 Students
  **Materials:**
  *   Two opaque containers (labeled "Urn A" and "Urn B" or simply "The Urn").
  *   40 Poker Chips or Colored Balls (24 Red, 16 Blue).
  *   18 Envelopes (for Round 1).
  *   1 "Gold Card" (for Round 2).
  *   Whiteboard/Projector for scorekeeping.
  *   Small prize (e.g., a chocolate bar or "homework pass" for the highest scorer).

  ---

  ## Part 1: Instructor Preparation (Before Class)

  **The Math Check (Your Verification):**
  Your arithmetic is correct.
  *   **State:** Red or Blue (50/50 prior).
  *   **Signal Accuracy:** $P(\text{Signal} = \text{State}) = 2/3$.
  *   **Player 1:** Follows private signal.
  *   **Player 2:** If Signal matches P1, follows Signal. If Signal conflicts, P2 is indifferent (1 Red signal vs 1 Blue signal). *Assumption for this game:* To make the cascade robust, we instruct students that if they are indifferent, they should follow their private signal. This ensures P2's choice reveals their signal.
  *   **Player 3:** Sees P1=Red, P2=Red. Infers two Red signals. Holds one Blue signal.
      *   Likelihood of Red State: $(2/3) \times (2/3) \times (1/3) = 4/27$.
      *   Likelihood of Blue State: $(1/3) \times (1/3) \times (2/3) = 2/27$.
      *   **Decision:** Red is twice as likely. P3 ignores private Blue signal and chooses Red.
      *   **Result:** P3's private information is lost. P4 gains no new information from P3's choice. The cascade locks.

  **The Rig (Engineering the Wrong Answer):**
  You cannot rely on luck to get P1 and P2 to draw the "wrong" color. You must pre-set their signals.
  *   **Round 1 Truth:** **BLUE**.
  *   **Envelope 1:** Contains slip reading "Your Private Draw: **RED**".
  *   **Envelope 2:** Contains slip reading "Your Private Draw: **RED**".
  *   **Envelopes 3–18:** Contain random draws from a deck weighted Blue (2 Blue, 1 Red). *Note: Even if P3 draws Blue, they will ignore it due to the math above.*

  ---

  ## Part 2: The Session Script

  ### 0:00 – 0:15 | Introduction & Rules
  **Instructor:** "We are going to play a game of prediction. There is a 'State of the World' hidden in this Urn. It is either **Red** or **Blue**. I have set the Urn to one color for the entire round. You do not know which."

  "Your goal is to guess the State correctly.
  *   **Correct Guess:** +10 Points.
  *   **Incorrect Guess:** 0 Points.
  *   **Top Score:** Wins a prize.

  **The Process:**
  1.  You will go in order (Row 1 to Row 3).
  2.  Before you guess, you receive a **Private Signal**. This is a slip of paper telling you the color of one ball drawn from the Urn.
  3.  The Urn is biased. If the State is Red, 2/3 of the balls are Red. If the State is Blue, 2/3 of the balls are Blue. Your signal is likely correct, but not guaranteed.
  4.  You will see the guesses of everyone before you. You will **not** see their private signals.
  5.  You have 30 seconds to make your choice. Say 'Red' or 'Blue' aloud."

  *(Do not use words like 'cascade', 'herd', 'rational', or 'conformity'.)*

  ### 0:15 – 0:35 | Round 1: The Trap
  **Setup:** Distribute Envelopes 1–18 face down. Tell them not to open until their turn.
  **Instructor:** "The Urn is set. Student 1, open your envelope."

  *   **Student 1:** Opens Envelope (Rigged: RED). Guesses **RED**.
  *   **Student 2:** Opens Envelope (Rigged: RED). Sees P1=Red. Guesses **RED**.
  *   **Student 3:** Opens Envelope (Random: Likely BLUE). Sees P1=Red, P2=Red.
      *   *Critical Moment:* Watch them hesitate. They hold a Blue signal but see two Red guesses. If they are rational, they guess **RED**.
  *   **Students 4–18:** Most will draw Blue signals (since State is Blue), but they see a wall of Red guesses. They should all guess **RED**.

  **Reveal:**
  **Instructor:** "Round Over. The State of the World was... **BLUE**."
  *(Allow a moment of reaction. Most of the class just lost points.)*
  **Instructor:** "Record your scores. Do not discuss *why* you chose yet."

  ### 0:35 – 0:50 | Round 2: Fragility
  **Instructor:** "We reset the Urn. New State. Same rules. However, one of you will receive a **Gold Signal**."
  *(Hand the Gold Card to Student 6 secretly before class or slip it in their envelope. The Gold Signal is 100% accurate.)*
  **Setup:**
  *   **State:** **RED**.
  *   **Students 1–5:** Rig envelopes to ensure they all draw **RED** signals (or at least P1 & P2). This builds a Red Cascade.
  *   **Student 6:** Holds Gold Card. It says: "The State is **BLUE**." (Wait, if State is Red, Gold Card must tell truth).
      *   *Correction for Maximum Impact:* To show fragility, the Expert must break the cascade.
      *   **Revised Setup:** State is **BLUE**. P1–P5 are rigged to guess **RED** (Wrong Cascade). Student 6 gets Gold Signal saying **BLUE**.
      *   *Wait, if State is Blue, and P1-P5 guess Red, they are wrong.*
      *   *Let's try:* State is **RED**. P1-P5 rigged to guess **RED** (Correct Cascade). Student 6 gets Gold Signal saying **BLUE** (False Expert?). No, Expert must be trusted.
      *   *Best Setup for Fragility:* State is **BLUE**. P1 & P2 rigged to guess **RED**. Cascade forms (Red). Student 6 gets Gold Signal (100% Accurate) revealing **BLUE**.
      *   *Outcome:* Student 6 announces "I have a Gold Signal. It is Blue."
      *   *Student 7:* Now faces Public History (5 Reds) vs One Expert (1 Blue, but 100% weight).
      *   *Math:* 5 inferred Red signals (weight 2/3 each) vs 1 Blue signal (weight 1). $5 \times 0.66 = 3.3$. $1 \times 1 = 1$. The cascade might *not* break mathematically unless the Expert is significantly more weighted or the cascade is shallow.
      *   *Simpler Fragility:* Make the Expert signal "Public Truth."
      *   *Revised Rule:* Student 6 is allowed to reveal their **Private Signal** publicly, not just their guess.
      *   *Instructor:* "Student 6, you are an Auditor. You must reveal your Private Signal card to the room, not just your guess."
      *   *Setup:* State = **BLUE**. P1, P2 rigged to guess **RED**. P3+ following cascade (Guess Red).
      *   *Student 6:* Draws **BLUE**. Reveals Card: "My signal is Blue."
      *   *Student 7:* Now knows P6 saw Blue. P6 guessed Red (following cascade). This reveals P6 ignored their signal. This adds no new info about the State, only about P6.
      *   *Wait, the prompt asks for:* "Introduce one late participant whose choice is known to rest on better evidence... watch the entire room reverse."
      *   *Solution:* Give Student 6 a signal with **90% accuracy** (e.g., "You drew from the Master Urn").
      *   *Setup:* State = **BLUE**. P1-P5 rigged to guess **RED**.
      *   *Student 6:* "I have a Master Signal. It is Blue." (Trustworthiness established by you).
      *   *Student 7:* Weighs 5 "Red" guesses (inferred signals) vs 1 "Blue" Master Signal.
      *   *To guarantee reversal:* Make the Master Signal worth 10 normal signals. Or, simply announce: "Student 6's information is definitive."
      *   *Let's go with Definitive:* "Student 6 has access to the Instructor's Key. If they say Blue, it is Blue."
      *   *Outcome:* Student 6 says "Blue." Students 7–18 immediately switch to Blue.
      *   *Reveal:* State was **BLUE**. The crowd was wrong, then instantly right.

  ### 0:50 – 1:05 | Round 3: The Cost of Information
  **Instructor:** "Final Round. Same rules. But now, you may **buy** a second private draw."
  *   **Cost:** -2 Points from your total score.
  *   **Benefit:** You get a second envelope. You can average them or choose one.
  *   **Rule:** You must decide to buy *before* you hear the previous person's guess, but *after* you see their guess. (Actually, simpler: Decide to buy before your turn starts).

  **Setup:**
  *   **State:** **RED**.
  *   **P1 & P2:** Rigged to guess **RED**.
  *   **P3:** Cascade locks.
  *   **Observation:** P1 and P2 might buy extra info (uncertainty). P3, seeing two Reds, knows their private info is worthless mathematically. A rational P3 should **not** pay for a second draw, because they plan to ignore their own eyes anyway.
  *   **Result:** Watch P3 through P18 decline the purchase. They are free-riding on the public consensus.

  ### 1:05 – 1:30 | The Debrief (Settling the Argument)
  *This is where you name the concepts.*

  **1. The Rationality of the Error (Addressing your Friend)**
  "Look at Student 3 in Round 1. You had a Blue slip. You voted Red. My friend would say you stopped thinking. I say you did the math."
  *   **Write on Board:**
      *   Evidence for Red: 2 People (P1, P2).
      *   Evidence for Blue: 1 Person (You).
      *   Probability Red is correct: 66%.
      *   Probability Blue is correct: 33%.
  *   **Point:** "If you voted Blue, you would have been *more* likely to be wrong. You sacrificed your private information to maximize your score. That is not blindness; that is Bayesian rationality."
  *   **Conclusion:** "Everyone behaved rationally" and "The group was wrong" are not contradictory. The group was wrong because early information was unlucky, not because later people were stupid.

  **2. The Information Stoppage**
  "Once P3 voted Red, what did P4 learn?"
  *   **Answer:** Nothing. P4 knows P3 saw the same Red/Red history. P3's vote confirmed the history, it didn't add to it.
  *   **Concept:** **Information Cascade.** Private information stops entering the public record. The 'Wisdom of Crowds' requires independent errors; here, the errors became correlated.

  **3. Fragility (Round 2)**
  "Why did the crowd switch instantly in Round 2?"
  *   **Answer:** Because the consensus was shallow. It was built on P1 and P2's signals. P3-P5 added no *new* information, only noise.
  *   **Concept:** **Fragility.** A cascade is confident (100% of people agree) but brittle (one strong signal breaks it).

  **4. The Cost of Thinking (Round 3)**
  "Why didn't P10 buy the second draw?"
  *   **Answer:** Because the value of private information was zero. They knew they were going to follow the crowd regardless of what they drew.
  *   **Concept:** **Free Riding.** The early movers produced a public good (information), but later movers consumed it without contributing.

  ---

  ## Part 3: Troubleshooting & Limitations

  **Predictable Failures:**
  1.  **Student 3 Defects:** Sometimes a student will stubbornly vote their private signal despite the math.
      *   *Fix:* Do not correct them during the game. In the debrief, ask: "Student 3, why did you vote Blue?" If they say "I trusted my eyes," ask the class: "Was that the optimal strategy for points?" Use this to show that *deviating* from the herd requires a willingness to lose points for the sake of truth—a different payoff function.
  2.  **Boredom/Drag:** 18 turns can take 20 minutes if students deliberate.
      *   *Fix:* Enforce the 30-second hard limit. Use a timer on the projector.
  3.  **Suspicion of Rigging:** Students might suspect you changed the Urn color mid-game.
      *   *Fix:* Be transparent in the debrief. "I fixed the first two envelopes to ensure we could observe the phenomenon in a 90-minute class. In the real world, this happens by chance 1 in 9 times. We compressed time to show you the mechanism."
  4.  **Round 3 Confusion:** Students might not understand when to pay.
      *   *Fix:* Simplify. "Before you open your envelope, raise your hand if you want to buy a second one for 2 points."

  **What This Activity Cannot Reproduce (Your Limitations):**
  1.  **Reputational Concerns:** In the real world, people follow herds to avoid looking foolish, not just to be right. This game isolates *informational* cascades, not *reputational* ones. You must supply this distinction in the debrief.
  2.  **Communication:** In reality, P3 could say "I saw Blue!" This game forbids talking. Real herds persist even when talking is allowed because cheap talk is distrusted.
  3.  **Payoff Structure:** Real life rarely has binary "Right/Wrong" payoffs. Sometimes being the *only* one right is worth more (e.g., financial markets). This game assumes you want to be with the majority.

  **Final Argument for Your Friend:**
  "Run this game. Watch Student 3. They hold the truth in their hand and throw it away to join the lie. You call that conformity. I call it rationality. They know that their single signal is weaker than the two signals before them. If they vote truth, they lose points. If they vote herd, they likely win points. The tragedy isn't that they stopped thinking; it's that thinking told them to stop speaking. The crowd isn't stupid; it's just running on empty."

