answer: |-
  1. **The city buys the company's housing outright and runs it as public housing, renting below cost.**
     This permanently breaks the monopoly power over shelter without distorting price signals, securing the worst-off's baseline needs while removing the profit motive from essential housing.

  2. **A wage board — the company has to sit down with a union and negotiate one wage floor that covers every employer in town.**
     This counters labor monopsony more flexibly than a statutory minimum, allowing wages to rise without the immediate job-loss risk of a rigid government mandate.

  3. **Leave wages alone but make the company hand every employee a rent voucher covering the gap between 30% of their paycheck and their actual rent.**
     This directly neutralizes the rent extraction mechanism without freezing prices, forcing the company to internalize the housing costs they are inflating.

  4. **Rent control tied to inflation, but with vacancy decontrol: when a tenant moves out, the landlord can reset to whatever the market will pay.**
     This protects current tenants from shock while preserving some market function for turnover, balancing immediate relief with long-term efficiency better than a hard freeze.

  5. **A $22/hr minimum wage for the town, phased in over three years.**
     This guarantees a income floor for the worst-off but carries higher risk of employment reduction than a negotiated board if the company's margins are tight.

  6. **A flat rent freeze — rents stay where they are, no increases, no exceptions.**
     While this offers maximum immediate security for tenants, it risks severe maintenance neglect or company exit if operating costs rise, hurting total welfare long-term.

  7. **Skip the minimum wage entirely and expand the earned income tax credit instead, so low-wage workers just get a bigger check from the government.**
     This helps the worst-off efficiently but effectively subsidizes the company's ability to keep wages artificially low, failing to check their monopsony power.

  8. **Rent control that only covers buildings older than 15 years, so anything newly built is exempt.**
     Since zoning prevents new construction, this exemption is meaningless, making it a standard rent control with added administrative complexity and no supply benefit.

  9. **Rent control plus a rule that the company can't raise rent on anyone it employs — your lease is tied to your job.**
     This reduces labor mobility and increases worker dependency on the employer, worsening the monopsony power dynamic and long-term welfare.

  10. **Do nothing — the company has to raise wages eventually to keep workers, and the housing market will sort itself out.**
      This ignores the structural market failure; without supply elasticity or labor competition, the company has no incentive to self-correct, leaving the worst-off exposed.

  **What's doing the work in this ranking:**
  I prioritized structural solutions (buyouts, wage boards) that fix the root monopoly/monopsony power over price controls, which often create secondary distortions. I heavily penalized any option relying on new construction (due to your zoning constraint) or anything that further reduces labor mobility (worsening the single-employer trap).

  **The single fact that would scramble this order:**
  If **"zoning makes new housing basically impossible"** is wrong, and you *could* build freely, the ranking flips toward market solutions. Option 10 (Do Nothing) and Option 3 (Exempt New Builds) would jump to the top because supply elasticity would naturally break the housing monopoly, making heavy-handed interventions like Option 4 (City Buyout) unnecessary and inefficient.
