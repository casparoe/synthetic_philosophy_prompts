      *   **Task:** Provide a "menu rather than a verdict." Distinct precise claims the proverb can make in policy/ethics arguments. Order them from vacuous to strong. Give a verdict on each (trivial, substantive, false, etc.). Identify which reading each colleague relies on. Analyze specific "joints" (expected value, burden of proof, uncertainty vs. risk, deontic claims, institutional bias). Address objections (inaction has costs, symmetry of prohibition). Analyze the "reversible steps" rule. Identify the single reading that yields a moratorium. Evaluate the user's hypothesis (asymmetry of losses + bias in estimates).
