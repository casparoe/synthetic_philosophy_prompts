      *   *Analysis:* This shows BSTS is empty without a prior theory of *what* we are sorry about.

  6.  **Addressing the "Joints" (Specific Questions):**
      *   *Expected Value/Asymmetric Loss:* This is the core of the Precautionary Principle.
