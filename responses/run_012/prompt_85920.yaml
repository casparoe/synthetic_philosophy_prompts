      *   *Level 2: Risk Aversion.* Standard decision theory. Prefer lower variance even if expected value is same.
      *   *Level 3: Burden of Proof Shift.* The proponent of action must prove safety, not the opponent prove harm. (Precautionary Principle lite).
      *   *Level 4: Knightian Uncertainty/Uncertainty vs. Risk.* We don't know the probabilities. Treat unknown unknowns as high cost.
      *   *Level 5: Deontic Constraint/Catastrophic Threshold.* Certain harms are forbidden regardless of probability (Lexical priority).
