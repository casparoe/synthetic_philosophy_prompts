answer: |-
  **Title:** Chance, Credence, and the Undermining Future: Adjudicating the Principal Principle

  **Introduction**

  The intuition driving the connection between objective chance and rational credence is powerful. If you know a coin is fair, and you have no other relevant information, it seems irrational to believe anything other than that the chance of heads is 50%. This intuition is codified in David Lewis's **Principal Principle (PP)**. However, as you have discovered, this principle faces a severe challenge when paired with a Humean account of chance, specifically the "Best System Analysis," where chances supervene on the total history of the world. This pairing generates "undermining futures," scenarios where the occurrence of an event would alter the very chance laws that govern it.

  Your friend argues that this renders the Principal Principle fatal, proposing a **New Principle (NP)** as a replacement. You are rightly unsure whether this revision is a necessary repair, a semantic evasion, or a solution to a problem created only by a specific metaphysical picture. This essay will adjudicate that dispute. I will argue that your friend is correct that the Principal Principle is inconsistent with Humean Supervenience, but that the "disease" lies in the marriage of the principle to that specific metaphysics, not in the principle itself. However, because the New Principle successfully handles both Humean and non-Humean worlds, it stands as the more robust formulation of rationality, despite its complexity.

  **1. The Principles Defined**

  To see where the divergence lies, we must state the principles precisely.

  The **Principal Principle (PP)** states that if an agent's total evidence is $E$, and $X$ is the proposition that the objective chance of proposition $A$ is $x$, then the agent's credence $C$ in $A$ should be $x$, provided $E$ is "admissible."
  $$C(A | X \cdot E) = x$$
  Admissible evidence is typically understood as information about the past and present that does not include "crystal ball" information about the future outcome of $A$. In standard cases, the history of the world up to the present ($H$) is considered admissible. Thus, PP implies: $C(A | X \cdot H) = x$.

  The **New Principle (NP)**, proposed by Lewis and others to handle undermining, shifts the focus from the specific chance value to the *theory of chance*. Let $T$ be the complete theory of chance (the laws governing probabilities) and $H$ be the history up to the present. The NP states:
  $$C(A | T \cdot H) = Ch_T(A | T)$$
  Here, the right-hand side is not simply the chance of $A$, but the chance of $A$ *conditional on the theory $T$ being true*.

  The divergence is subtle but critical. PP treats the chance proposition $X$ as a simple fact that fixes credence. NP treats the chance as dependent on the theory $T$, acknowledging that $T$ itself might be contingent on the future. In the NP, the chance value on the right is adjusted to reflect the possibility that $A$'s occurrence might make $T$ false.

  **2. The Undermining Future and the Divergence**

  The conflict arises from the Humean Best System Analysis. On this view, the laws of nature (including probabilistic laws) are the axioms of the deductive system that best balances strength and simplicity in describing the *entire* history of the world—past, present, and future.

  Consider a world where the current best system says the chance of a specific quantum event $A$ is 0.5. However, suppose that if $A$ were to occur, the resulting total history would be best systematized by a *different* theory, one where the chance of $A$ was 0.9. This is an **undermining future**.

  In this scenario, the proposition $X$ ("The chance of $A$ is 0.5") is true only if the future does *not* contain the sequence of events that would make the alternative system better. Therefore, $X$ logically entails $\neg A$ (or at least, entails that the specific undermining version of $A$ does not occur).

  Here is where the principles diverge mathematically and rationally:
  1.  **Under PP:** You know $X$. PP commands $C(A | X) = 0.5$.
  2.  **Under Logic:** Since $X$ entails $\neg A$ (because if $A$ happens, $X$ is false), logic commands $C(A | X) = 0$.

  The Principal Principle demands a credence of 0.5; logical consistency demands a credence of 0. The principle contradicts the laws of probability.

  The **New Principle** avoids this. It asks for $C(A | T \cdot H)$. The right-hand side is $Ch_T(A | T)$. This value asks: "Given theory $T$, what is the probability of $A$?" Crucially, this calculation takes into account that $A$ might undermine $T$. If $A$ undermines $T$, then the probability of $A$ *given* $T$ will be lower than the raw chance value, because part of the probability mass is allocated to worlds where $A$ happens but $T$ is false. The NP effectively discounts the chance to account for the fragility of the theory. It yields a value that does not contradict the logical exclusion inherent in the evidence.

  **3. Assessing Your Friend's Argument**

  Your friend argues that the PP is refuted because the agent's evidence (Chance = 0.5 + Past) rules out $A$, yet PP demands credence 0.5. Is this argument sound?

  It is sound, *provided* the agent knows the Humean nature of chance. For the friend's argument to go through, the proposition $X$ ("Chance is 0.5") must be understood as a Humean chance proposition. If the agent knows that chances supervene on the total history, then knowing $X$ *is* knowing something about the future (namely, that the future will be such that $X$ remains the best system).

  If the agent is ignorant of the Humean metaphysics and treats $X$ as a primitive fact, they might not realize $X$ entails $\neg A$. However, rationality is usually modeled on idealized logical omniscience. If $X$ metaphysically entails $\neg A$, a rational agent *ought* to have credence 0 in $A$ given $X$, regardless of whether they have explicitly worked out the metaphysics. Therefore, your friend is correct: if Humean Supervenience is true, the PP instructs agents to be irrational (violating probability axioms).

  However, your suspicion that this might be a "cure for a disease the original principle never had" is also insightful. The disease is not the principle alone, but the principle combined with Humean Supervenience.

  **4. The Source of the Trouble: Principle or Account?**

  Does the problem belong to the PP or the Account of Chance?

  If we reject Humean Supervenience and adopt a **Primitive Chance** view (e.g., propensities or sui generis probabilistic laws), the problem vanishes. On this view, chances are features of the present state that do not depend on the future. The proposition "Chance(A) = 0.5" does not entail anything about whether $A$ occurs, nor does it entail that the future won't undermine it, because the future *cannot* undermine it. In a world with primitive chances, $X$ and $A$ are compatible. The PP works perfectly.

  Thus, the inconsistency is not intrinsic to the PP; it is an inconsistency between the PP and Humean Supervenience. You can save the PP by rejecting Humeanism.

  However, many philosophers find Humean Supervenience attractive because it naturalizes chance, tying it to observable patterns rather than mysterious metaphysical propensities. If we wish to retain the Humean account (as your seminar seems to be doing), we cannot retain the PP. We must adopt the revision.

  Is the NP an evasion? No. It is a genuine repair. It acknowledges that when chances are defined by the total history, evidence about chances is partially evidence about the future. The NP adjusts the bridge principle to account for this "leakage" of information. It preserves the core intuition of the PP (align credence with chance) while respecting the logical constraints of the Humean metaphysics.

  **5. Verdict**

  **The New Principle is the correct formulation.**

  While the Principal Principle is simpler and holds in non-Humean worlds, the New Principle is the more general truth. It yields the same results as the PP in ordinary cases (where undermining futures are negligible or impossible) but remains consistent in Humean worlds where undermining is possible. Since we cannot be certain *a priori* whether chances are primitive or Humean, our principle of rationality should be robust enough to handle the Humean case. The NP achieves this; the PP does not.

  **Reasons for this Verdict:**
  1.  **Consistency:** The NP avoids the contradiction between the principle and the probability axioms that plagues the PP under Humeanism.
  2.  **Generality:** The NP reduces to the PP in cases where undermining is impossible (e.g., primitive chance). It is a superset of the PP's success conditions.
  3.  **Metaphysical Neutrality:** It allows rational agents to align credence with chance without needing to settle the metaphysical debate about the nature of chance first.

  **The Strongest Objection:**
  The primary objection to the NP is **epistemic access**. To apply the NP, an agent must condition on the "complete theory of chance" ($T$). But human agents do not know the true theory of chance; we only have approximations. The PP was attractive partly because it seemed to apply to what we actually know ("The chance is 0.5"). The NP seems to demand idealized knowledge of the laws of nature that we cannot possess.

  **Response to Objection:**
  This objection applies to the PP as well, strictly speaking. To know "The chance is 0.5" truly is to know a fact about the world's laws. If we are uncertain about the laws, both principles must be applied across a range of candidate theories weighted by our credence in them. The NP does not make the epistemic situation worse; it merely clarifies the logical relationship between the theory and the credence. Furthermore, in most practical cases, the difference between the PP value and the NP value is infinitesimal (undermining futures are typically extremely unlikely), so the PP remains a useful heuristic. But for the *strict* norms of rationality sought in your seminar, the NP is the required standard.

  **Conclusion**

  Your worry is well-founded. The Principal Principle, as originally stated, cannot survive the Best System Analysis of chance. Your friend is right that this is fatal for the PP *in that context*. However, it is not a failure of rationality, but a failure of the principle to account for the metaphysical structure of chance. The New Principle is not an evasion; it is the necessary precision required to tie credence to chance when chance is a Humean feature of the world. You should defend the New Principle, not as a rejection of the intuition behind the Principal Principle, but as its rigorous completion.
