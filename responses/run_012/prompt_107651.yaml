answer: |-
  Dear Producer,

  I am writing to outline the specific line of questioning I plan to pursue with next week's guest regarding her defense of dilemmic realism, as I want to ensure we press the structural integrity of her view rather than allowing her to simply restate her central claims. My first question will focus on her rejection of the agglomeration principle to avoid contradiction, asking how she can reject this inference without giving up the ordinary logic of obligation that makes moral reasoning stable. If she responds that standard deontic logic simply does not apply to moral oughts, I will follow up by asking whether this implies that moral reasoning is fundamentally non-monotonic and thus incapable of supporting long-term planning. I am moderately confident this will force her to clarify the logical costs of her view rather than just asserting the rejection.

  Moving to the relationship between obligation and possibility, I intend to ask about the principle that ought implies can and whether her view makes the agent irrational by definition when facing a dilemma. Should she argue that rationality is preserved despite the impossibility of fulfilling all obligations, my follow-up will be to ask if the term irrationality loses its normative force when an agent is irrational through no fault of their own. I am fairly confident this will push her to explain the nuanced relationship between rationality and obligation in her system.

  On the topic of moral residue, I plan to ask about the difference between guilt and regret in her account and whether residue can generate reasons for compensation to those affected by the unchosen option. If she confirms that residue is normative rather than merely psychological, I will follow up by asking whether this implies the unchosen option retained some binding force that necessitates reparations. I am very confident this will elicit a substantive answer about the practical implications of residue for interpersonal relationships.

  To test the robustness of her realism, I will ask what evidence or argument could count against the existence of genuine dilemmas in her view since she treats residue as a fact rather than an illusion. In the likely event that she cites the phenomenology of guilt as primary evidence, I will follow up by asking what her direct counter-argument is if a utilitarian explains away that residue as mere psychological inefficiency. I am somewhat confident this will test the falsifiability of her position against rival metaethical frameworks.

  There is a risk that her view collapses into the claim that everything is permitted if obligations do not aggregate, so I will ask whether rejecting agglomeration risks making all actions permissible since no conjunction of obligations is binding. If she denies this collapse, my follow-up will be to ask how she prevents the explosion of permissions if obligations do not aggregate into a single coherent directive. I am moderately confident this will address the stability of her deontic system against charges of incoherence.

  I also need to clarify how she distinguishes a genuine dilemma from a merely hard choice where one option is clearly obligatory but painful to execute. Assuming she says the distinguishing feature is the presence of unavoidable residue, I will follow up by asking whether residue is solely the diagnostic tool or if it plays a constitutive role in the dilemma itself. I am fairly confident this will clarify the boundaries of her definition and prevent equivocation.

  Regarding the symmetry of the conflict, I will ask whether her view can allow that one horn of a dilemma is less wrong than the other or if they must be equally obligatory to count as a dilemma. If she allows for asymmetry, I will follow up by asking whether agglomeration becomes viable again for the stronger obligation once the weaker one is discarded. I am very confident this will probe the symmetry of her conflicting obligations and potential hierarchies within them.

  Since she argues that conflict can arise within a single value, I will ask how a single value makes incompatible demands on a single life without fragmenting into sub-values. Should she maintain that the value is unified yet contradictory, my follow-up will be to ask whether this implies the value itself is inherently contradictory rather than just situationally demanding. I am moderately confident this will unpack her monist commitment and its metaphysical implications.

  On the issue of responsibility, I will ask how she reconciles her claim that an agent may be blameworthy no matter which option she takes with the control principle that blame requires alternative possibilities. If she argues that blame is appropriate even without control, I will follow up by asking whether this blame is retrospective only or if it serves a prospective function in moral education. I am fairly confident this will challenge her account of moral responsibility and its connection to agency.

  Finally, to address action guidance, I will ask what her view prescribes an agent should do in the moment since both options are obligatory yet incompatible. If she suggests the theory offers only a post-hoc evaluation, I will follow up by asking whether a moral theory that cannot guide action in the moment fails a basic functional requirement of ethics. I am very confident this will address the practical utility of the theory for living agents.

  Overall, I am highly confident that this set of questions gets at the live issues surrounding dilemmic realism and will prevent the interview from becoming a mere exposition of her book. The one question I am least confident about is the one regarding evidence or argument against genuine dilemmas, because defenders of this view often treat the phenomenology of residue as self-validating and may struggle to identify what would count as a defeater beyond sheer logical inconsistency. I hope this plan provides a rigorous framework for the conversation.

  Best regards,

  The Host
