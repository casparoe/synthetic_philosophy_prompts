answer: |-
  Welcome. We occupy a single room tonight, but I know we are standing in three different worlds. To our benefactors, this centre is a promise that the deepest mystery of human life will finally be met with tools worthy of its weight. To our colleagues from the phenomenological institute, this building looks like a fortress built to keep the first-person perspective outside the gates. To our students and the press, this is a place where quotes are minted, and where careers will be made or broken by what we claim to know.

  I intend to speak to all three of you at once, using a single rule that will govern every experiment conducted within these walls. It is a rule of asymmetry. Here, the subject has complete authority over how things seem, and no authority whatever over how things are.

  This distinction is the foundation of our work. When a participant sits in our scanners and tells us that their pain is throbbing, or that their visual field is filled with a specific shade of red, we do not argue with them. We record that report as the absolute truth of their seeming. We treat their words the way a literary critic treats the text of a novel: as a coherent world to be understood, not as a set of facts to be verified. You are the sole authority on what it is like to be you. But once that report is written down, it becomes an object for us to explain. We do not certify your experience as a window into reality, nor do we correct it as a mistake. Our business is to explain the report, not to validate the thing reported.

  This is why I must address the skepticism in this room directly. Some of you worry that this method is a trick. You suspect that by treating experience as something to be explained rather than something to be trusted, we have already decided that experience is not real. You fear that our neutrality is a fig leaf for a conclusion we have already reached.

  I will not evade this. A method that begins in neutrality does not guarantee a neutral result. If we succeed in explaining why you report these experiences using only the mechanisms of brain and body, we may find that we no longer need to posit the existence of the mysterious properties you describe. That is a risk we run. It is also a risk we must accept. If we promise in advance that our science will confirm the reality of the mystery, we are no longer scientists; we are theologians. But if we promise that there is nothing here to study, we are lying to you. There is something here to study: it is the conviction itself.

  This shifts our primary question. We are not here to solve the puzzle of how matter turns into magic. We are here to ask why creatures like us are so powerfully disposed to find experience mysterious in the first place. The mystery is not necessarily in the world; it may be in the machinery that reports the world. Our task is to map that machinery.

  Consider what a successful explanation looks like. You report a continuous stream of vision, but our instruments show your brain stitching together snapshots too slow to catch the motion.

  In that gap between the seamless world you describe and the fragmented process we measure lies our entire mission. We are not saying your vision is fake. We are saying that the continuity you swear by is a construction, and we intend to show you the scaffolding. For some of you, this will feel like a dismissal. For others, it will feel like a discovery. For us, it is simply the data.

  I know our funders want to know if we will crack the code. I cannot promise that. I can promise that we will not hide behind vague language when the data becomes uncomfortable. We will not say "consciousness is complex" when we mean "consciousness is not what you think." We owe you the candour of precision. If the science leads us to say that the phenomenal properties you feel are not what they seem, we will say it. If the science leads us to say that they are fundamental features of the universe, we will say that instead. The method does not dictate the destination; it only dictates that we follow the road where it leads.

  To our colleagues across town: we know you fear that we are explaining away the very thing that makes us human. We hear you. But silence is not respect. To ignore the mechanisms because they seem reductive is to abandon the attempt to understand. We invite you to watch us work. If we step out of bounds, if we treat your reports as errors rather than data, call us on it. Our method relies on the integrity of the report. If we corrupt that, we have nothing left to study.

  To our donors: you have built this place because you believe the question matters. It does. But the answer may not look like the question. You have funded a search for truth, not a validation of intuition. If we return to you in ten years and say, "We know why you thought there was a ghost in the machine," have we failed? Or have we succeeded too well? I ask you to value the explanation over the preservation of the mystery.

  To our students and the press: you will quote me. You will quote us. Know that we are binding ourselves to a standard that could prove us wrong. We are not building a doctrine. We are building a test.

  So here is the commitment this centre makes to you, and to itself. We promise to publish the mechanism even if it leaves no room for the magic. We will not stop at the boundary where the explanation becomes uncomfortable for the subject. We will follow the account of how things are until it fully accounts for how things seem, whatever that requires us to say about the reality of experience. We may fail to find the answer. We may fail to convince you. But we will not fail to speak clearly about what we find.

  The lights are on. The instruments are calibrated. The reports are waiting. Let us begin.
