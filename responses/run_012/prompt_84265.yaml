answer: |-
  ### SCRATCH LIST (Discard this immediately)

  *   **Applied Stats:** "This is just preregistration with extra steps." / "Sample splitting handles the forking paths; you don't need metaphysics."
  *   **Bayesians:** "Reference classes are a frequentist crutch; exchangeability handles partitioning." / "Why should my credence depend on what I could have written down?"
  *   **Philosopher:** "Is this a norm for belief or for assertion?" / "Is the constraint synchronic (current state) or diachronic (history of inquiry)?"
  *   **Fairness:** "Ex ante availability legitimizes historically biased categories if they were defined beforehand." / "Procedural fairness isn't substantive justice."
  *   **General:** "You haven't solved the arbitrariness; you've just moved it to the choice of the ex ante moment."

  ***

  ### PREP SHEET: DIRECT INFERENCE & ENTITLEMENT

  **Opening Concessions (First 5 Minutes)**
  *   **Concede:** You are not solving the *ontological* problem. There is no "One True Class." If you claim there is, you will be eaten. State clearly: "I am not telling you which class is *true*; I am telling you which class you are *licensed to use*."
  *   **Concede:** You are not replacing priors. Tell the Bayesians: "I am not offering a competitor to subjective probability; I am offering a constraint on the inputs any probabilist uses."
  *   **Hold Back:** Do not claim this solves the single-case problem completely. Do not claim this prevents all bad outcomes. If you promise immunity from error, you lose credibility.

  ---

  ### THE OBJECTIONS (Ordered by Damage Potential)

  **1. The Fairness/Politics Objection**
  *   **Who:** The Doctoral Student (Algorithmic Fairness).
  *   **The Question:** "If a bank defined a 'high-risk' neighborhood ex ante using redlining proxies, your constraint says they were *entitled* to use that class because it was specified before the loan decision. Doesn't your procedural view just ratify historical injustice by calling it 'available'?"
  *   **The Reply:** "You are right that entitlement is not justice, but you are wrong that my constraint protects the powerful. The constraint forces the classification to be fixed *before* the outcome is known, which makes the risk instrument auditable. If the class was defined ex ante, we can test its predictive validity without the bias of fitting the class to the failures. My view doesn't stop them from using the class, but it stops them from hiding behind a class they constructed *after* they saw who defaulted."
  *   **The Bluff:** You are assuming the audit actually happens. If the institution defines the class ex ante but refuses to publish the definition, your constraint is toothless. You need to lean on the "publicly specifiable" aspect of availability without getting bogged down in transparency policy.

  **2. The "Just Preregistration" Objection**
  *   **Who:** The Applied Statisticians (Biostats/Reproducibility).
  *   **The Question:** "This sounds exactly like preregistration. You're dressing up a methodological checklist as an epistemic principle. What work is 'entitlement' doing that 'registered report' doesn't?"
  *   **The Reply:** "Preregistration is a bureaucratic mechanism; ex ante availability is an epistemic condition. You can preregister a nonsense class, but you cannot be *entitled* to infer from a class you couldn't have specified without knowing the outcome. My constraint explains *why* preregistration works when it works: it secures the entitlement to the inference, not just the compliance with a journal policy."
  *   **The Bluff:** The line is thin. If they press you on a case where preregistration exists but ex ante availability is dubious (e.g., registered but vague hypotheses), you might struggle to distinguish them sharply.

  **3. The Bayesian Exchangeability Objection**
  *   **Who:** The De Finetti Bayesians.
  *   **The Question:** "We don't need reference classes; we need exchangeable sequences. If I judge a sequence exchangeable, I don't need your constraint. Isn't this just a frequentist inheritance we discarded?"
  *   **The Reply:** "Exchangeability tells you how to update once you have a partition, but it does not tell you *which partition* to be exchangeable over. You can be exchangeable over 'coin tosses' or 'coin tosses on Tuesdays.' My constraint governs the choice of the partition itself, which exchangeability leaves arbitrary. You still need a rule for entitlement to the partition."
  *   **The Bluff:** A sophisticated Bayesian will argue that the partition is part of the model specification governed by the prior. You are asserting the prior doesn't solve the selection problem; they will assert it does. You are betting on the underdetermination of the model.

  **4. The "Narrowest Class" Objection (Expected)**
  *   **Who:** The Philosopher of Science (or a well-read Statistician).
  *   **The Question:** "The traditional solution is to use the narrowest class with reliable statistics. Your view seems to make credences hostage to ignorance: if I *don't know* the narrower class ex ante, am I entitled to use the wide one? Doesn't this reward ignorance?"
  *   **The Reply:** "It does not reward ignorance; it penalizes hindsight. If you didn't know the narrower class ex ante, you couldn't have cherry-picked it to fit the outcome. The entitlement is to the *process* of inference, not the precision of the number. You are entitled to the wide class because it was the only one safe from outcome bias, not because it is the most informative."
  *   **The Bluff:** This is the hardest philosophical pill to swallow. It feels counterintuitive that knowing *less* grants *more* entitlement. If they push on a case where the wide class is useless (e.g., "human beings" for medical risk), you must admit the inference is entitled but practically void.

  **5. The Normative Status Objection**
  *   **Who:** The Philosopher of Science.
  *   **The Question:** "Is this constraint on what I can *believe*, or only on what I can *assert* in a paper? If I know the outcome, can I not privately update my credence using the narrow class?"
  *   **The Reply:** "It governs assertion and public warrant, not private psychology. You can believe whatever you like, but you cannot claim *evidential support* for that belief using a class selected post-outcome. Direct inference is a public practice of justification, not a private mechanism of prediction."
  *   **The Bluff:** This retreats to a pragmatic view. If they are epistemic internalists, they will say this abandons the truth-connection. You are conceding the point to save the practice.

  **6. The Sample Splitting Objection**
  *   **Who:** The Applied Statisticians.
  *   **The Question:** "We solve this with sample splitting: use half the data to choose the class, half to test. Why do we need a philosophical constraint when we have a mathematical solution?"
  *   **The Reply:** "Sample splitting is a technique to *satisfy* the constraint, not a replacement for it. The constraint explains *why* sample splitting is valid: it restores ex ante availability for the test set. Without the constraint, sample splitting is just a ritual; with it, it is the operationalization of entitlement."
  *   **The Bluff:** They might argue sample splitting is sufficient and your constraint is redundant. You must hold the line that the math needs the justification.

  **7. The Diachronic/Synchronic Objection**
  *   **Who:** The Philosopher of Science (Follow-up).
  *   **The Question:** "Is availability determined by what was physically possible to specify then, or what is reconstructible now? If I lost my notebook, am I no longer entitled?"
  *   **The Reply:** "It is determined by what is reconstructible and defensible now as having been fixed then. The physical notebook helps, but the entitlement rests on the *commitment*, not the paper. If you cannot demonstrate the commitment, the entitlement lapses."
  *   **The Bluff:** This opens a can of worms about evidence of evidence. Keep it brief.

  **8. The "Wrong Class" Objection**
  *   **Who:** General Audience.
  *   **The Question:** "If I specify a class ex ante that is totally irrelevant to the outcome, your view says I'm entitled to use it. Doesn't that license nonsense?"
  *   **The Reply:** "It licenses the *inference*, not the *accuracy*. You are entitled to infer from a nonsense class, but the inference will have high variance and fail prediction. Entitlement protects you from the charge of cheating, not from the charge of being wrong."
  *   **The Bluff:** This makes the constraint seem weak. You need to emphasize that avoiding cheating is the primary goal of direct inference norms.

  **9. The Relativism Objection**
  *   **Who:** A Quiet Statistician.
  *   **The Question:** "If two agents have different background information, one is entitled to use a class the other is not. Does truth become relative to the agent's history?"
  *   **The Reply:** "Truth is not relative, but *warrant* is. The probability statement is incomplete without the reference class, and the class is indexed to the agent's epistemic situation. We are mapping the space of reasons, not the space of causes."
  *   **The Bluff:** This is pure philosophy. The stats crowd may glaze over or smell blood. Keep it short.

  **10. The "Why Not Likelihood?" Objection**
  *   **Who:** A Likelihoodist or Bayesian.
  *   **The Question:** "Why fix probabilities at all? Why not just report the likelihood function and let the user choose the class?"
  *   **The Reply:** "Because decisions must be made, and decisions require single numbers. Direct inference is the bridge from data to action. Likelihood functions do not dictate bets; reference-class probabilities do."
  *   **The Bluff:** Some decision theorists will disagree that probabilities are required for action (see imprecise probabilities). Don't get stuck here.

  ---

  ### THE DECIDER
  **The Objection:** #1 (The Fairness/Politics Objection).
  **Why:** If the fairness scholar convinces the room that your view legitimizes biased algorithms, the applied stats and philosophers will align against you. The stats crowd cares about harm; the philosophers care about justice.
  **If You Lose It:** You must pivot immediately to "Auditability." Concede that entitlement isn't moral permission, but insist that without ex ante fixation, we cannot even *measure* the bias. Frame your view as the *minimum condition* for holding power accountable, not the *sufficient condition* for justice.

  ### THE QUESTION YOU HOPE NOBODY ASKS
  **The Question:** "If I know the outcome, but I pretend I don't, and I specify the class that fits best, haven't I satisfied your constraint technically while violating its spirit? How do you police bad faith?"
  **Why:** Because the answer requires you to move from epistemology to psychology or sociology of science. You have no mechanism for detecting bad faith other than the very preregistration norms you claim to transcend.
  **The Escape:** "Bad faith is a violation of the *spirit*, but my constraint is on the *letter* of entitlement. We police bad faith through replication and peer scrutiny, which rely on the ex ante fixation I am describing. My constraint gives the scrutiny something to grab onto."
