  Write me a short story that dramatizes the experience-machine idea, but dont give me the standard Nozick setup — no "plug in and trade reality for bliss" cliché, and no lecture about how the machine is fake. Here's the wrinkle I want you to build on: the machine is honest. Before you go in, it tells you everything it'll do, including that it will periodically simulate your own deliberation about whether to leave, and simulate you, convincingly, deciding to stay. So you climb in already knowing that the "choice" to remain will be one you never actually get to make under conditions you'd endorse right now. Tell it from inside — someone about to sign up, or someone who's been in for years — your call, but keep it tight, one scene, no omniscient narrator explaining the philosophy. I want the reader to feel the pull of at least two rival accounts of what makes a life go well (hedonism, desire-satisfaction, objective-list, or roll your own), and I want it left genuinely open whether the character's life is going well or not. After the story, add a short note: separate what's actually settled about these theories among people who work on them from what's genuinely contested, dont dress up a contested view as the consensus, and flag anywhere the story takes liberties with the ideas or leans on a reading that's disputed. Finish with a last line exactly like this: Summary: <one sentence>.
