  This is fundamentally a metaphilosophical disagreement about the autonomy of logical truth versus the embeddedness of thought within a life-world.

  Your diagnosis of the 'premise' and 'kinship' tests is astute, yet it identifies symptoms rather than the disease. The separabilists operate with a Platonic conception of logic: thoughts inhabit a 'third realm' independent of human psychology, so the thinker's moral failings cannot contaminate the truths grasped. The contextualists reject this transcendence, viewing logic as a human practice inevitably coloured by the practitioner's conception of community and reason. Consequently, the dispute is not merely about which test to apply, but about whether philosophy is a science of objective structures or an expression of cultural stance. There is indeed a substantive disagreement left over, specifically concerning the historical causality of Frege's technical choices. If the antisemitism merely coexisted with the logic, the premise test holds. However, if the drive for purity in logic was motivated by a desire to purify the German spirit, the kinship test gains traction. Your suspicion regarding the kinship test is well-founded; without strict criteria, it risks becoming a hermeneutics of suspicion where any shared vocabulary implies complicity. Conversely, the premise test assumes a modularity of thought that Frege himself might have rejected, given his view that logic governs all rational thought. The substantive disagreement remaining is whether the 'objectivity' Frege championed is a genuine discovery or an ideological construct designed to exclude certain voices from the realm of 'shared thinkers'. Thus, the dispute is not just about testing relevance, but about the ontology of logic itself.

  Progress would not resemble a definitive verdict on Frege, but rather a refinement of the criteria for relevance. A historical demonstration linking specific political views to technical choices, such as the exclusion of psychological elements, would strengthen the kinship case, but it would not satisfy the separabilist who maintains the truth survives the motive. Ultimately, the question may be ill-posed if it demands a binary answer; the notebook bears on the *practice* of Fregean philosophy without necessarily invalidating its *propositions*. We should expect no final resolution, only a clearer understanding of why we demand purity from logic in the first place.
