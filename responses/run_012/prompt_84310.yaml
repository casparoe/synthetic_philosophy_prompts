answer: |-
  ### Restatement and Load-Bearing Analysis

  Your colleague's argument is a seductive piece of metaphysical sleight-of-hand. It attempts to dissolve a normative critique (Whiggism is bad) by subsuming it under a methodological necessity (Explanation requires selection). Here is the argument restated in my own terms, with the structural joints highlighted:

  1.  **Selection:** Historical explanation requires isolating specific causes from the infinite past (1).
  2.  **Direction:** Explanation traces these causes forward to their effects (2).
  3.  **The Teleological Slide:** To trace a story forward to a known end is to treat that end as the *destination* or *purpose* of the story (3). **[Load-Bearing]**
  4.  **The Definition:** Any history that treats the end as a destination is, by definition, Whig history (4). **[Load-Bearing]**
  5.  **Interim Conclusion:** Therefore, all historical explanation is Whig history (5).
  6.  **The Objection:** Whig history is usually criticized as distortive (presentist/inevitabilist) (6).
  7.  **The Absolution:** A distortion inherent to the method of explanation is not a genuine fault (7). **[Load-Bearing]**
  8.  **Final Conclusion:** The critique of Whiggism is empty; historians are innocent (8).

  The argument relies on a chain of equivalences: *Causal Selection* = *Forward Narration* = *Teleological Destination* = *Whiggism* = *Unavoidable Distortion* = *No Fault*.

  To save your conviction that Whig history is a genuine vice (6) and that historians should feel the weight of that critique (reject 8), we must break the chain before it universalizes Whiggism. If we accept (5), you are forced into historical nihilism (all history is vicious) or you must reject (6). Since you want to keep (6), we must prevent the argument from reaching (5).

  ### Diagnosing the Flaws

  Before cutting, let us locate the three most plausible sites of fracture.

  **1. The Equivocation on "Whig" (Step 4)**
  *   **The Flaw:** Your colleague is using a stipulative definition of "Whig history" in (4) that does not match the critical definition in (6). In (4), Whiggism is merely "outcome-oriented." In (6), Whiggism is "moralizing/progressivist."
  *   **What must be true:** For this to be the real trouble, it must be the case that one can narrate toward an outcome *without* implying moral progress or inevitability. If "road to the present" necessarily implies "glorification of the present," this flaw vanishes.
  *   **Plausibility:** High. This is the standard historiographical rebuttal (à la Herbert Butterfield).

  **2. The Teleological Slide (Step 3)**
  *   **The Flaw:** This step conflates *causal termination* with *teleological destination*. Just because event B follows event A in an explanation does not mean A was *moving toward* B in any sense stronger than physical causation. "Point toward which the story was moving" smuggles in intentionality where there is only sequence.
  *   **What must be true:** For this to be the real trouble, it must be possible to construct a historical narrative that acknowledges an outcome without treating that outcome as the *organizing principle* or *goal* of the preceding events.
  *   **Plausibility:** Very High. This is the deeper philosophical error. It mistakes the historian's *perspective* (looking from the end) for the past's *vector* (moving to the end).

  **3. The Normative Naturalism (Step 7)**
  *   **The Flaw:** This step argues that because a bias is unavoidable, it is not a distortion. But optical illusions are unavoidable features of human vision; they are still distortions of reality that we must correct for.
  *   **What must be true:** For this to be the real trouble, we must accept that "unavoidable" does not mean "innocent." We could accept (5) (All history is Whig) but reject (8) (No guilt), maintaining that Whiggism is a tragic, structural flaw we must constantly fight.
  *   **Plausibility:** Moderate. This saves the critique but concedes the label "Pan-Whiggism," which might weaken the specific force of (6).

  ### The Verdict: Reject Step (3)

  I recommend you reject **Step (3)**.

  > *(3) When a historian narrates the past by running the story forward from conditions to outcome, she is treating the outcome as the point toward which the story was moving.*

  **Why it looked innocent:**
  Step (3) relies on a linguistic ambiguity in the phrase "point toward which." In one sense, the outcome is the *terminus* of the causal chain (the place where the explanation stops). In another sense, it is the *telos* (the purpose or goal that pulled the events forward). The argument invites you to accept the first sense (which is trivial) and then exploits the second sense (which is Whiggish) to drive the conclusion. It feels innocent because every explanation does have an end-point; the trick is implying that the *past events* were oriented toward that end-point, rather than the *historian* orienting the story toward it.

  **Why you should reject it:**
  You can affirm (1) and (2) without affirming (3). You can select conditions and trace them forward *mechanistically* without implying that the past was "moving toward" the outcome as a destination.
  *   **Example:** A historian explains the fall of Rome by tracing economic decay and military overstretch. The outcome (the Fall) is the end of the story. But the historian need not claim the Roman Empire was *trying* to fall, or that history was *aiming* at the Fall. The "movement" is in the narrative construction, not in the historical material itself.
  *   By rejecting (3), you sever the link between *explanation* and *teleology*. You preserve the idea that historians *choose* an endpoint for pragmatic reasons (1 & 2), but that this choice does not imbue the past with a destiny (3).

  **The Cost of Rejection:**
  Rejecting (3) is not free. It exacts a methodological tax on your practice of history:
  1.  **Vigilance:** You must constantly police your own narrative language. It is seductively easy to write "led to," "culminated in," or "paved the way for," as these phrases subtly reintroduce the teleology you just rejected. You must cultivate a style of explanation that emphasizes *contingency* and *conjunction* rather than *direction*.
  2.  **Complexity:** It is cognitively harder to narrate without teleology. Teleology provides a comforting narrative arc. Rejecting it means your histories may feel more fragmented or open-ended, lacking the satisfying "closure" that Step (3) promises.
  3.  **Defense:** You must defend the claim that non-teleological narrative is possible against colleagues who argue (like your seminar partner) that *all* narrative imposes form, and form implies telos. You will need to argue for a distinction between *narrative structure* (which has an end) and *historical ontology* (which does not).

  **Why this is the best repair:**
  Rejecting (3) allows you to keep (1) and (2) (the truisms of explanation) and (6) (Whiggism is a vice). It prevents the universalization of Whiggism in (5), thereby preserving the distinction between *good history* (causal, contingent) and *bad history* (Whig, teleological). It is superior to rejecting (4) because it addresses the *mechanism* of the error rather than just the *label*, and superior to rejecting (7) because it avoids the nihilistic conclusion that all history is inherently vicious.

  Your colleague's argument is a "trick of phrasing" precisely at this joint. He asks you to confuse the *historian's rear-view mirror* with the *road's intended destination*. You are justified in refusing the confusion.
