prompt: |-
  I run the policy side of a small model-behavior team at a mid-size AI lab. We write the internal rules for when our models count as being honest with users, and we also build the evals that are supposed to catch violations. I've got roughly six months of one philosopher's time to spend, and I want to spend it on the right questions, so I'm asking you to help me pick them.

  What prompted this: we keep failing to agree on cases, and every disagreement bottoms out in a definitional question nobody has settled. Three examples.

  (a) A model says something true but picks the true thing that will make the user believe something false — cherry-picked facts, loaded framing, answering a slightly seperate question than the one asked. Deception, or just bad answering?

  (b) A model is sycophantic. It tells the user their business plan is great. It isn't representing anything, it isn't intending anything. On an intent-based definition it isn't deceptive at all, which smells like a reductio, since sycophancy is one of the things we most want to catch.

  (c) A user is trying to do something awful and the truthful answer is the one that helps them. We might actually want the model to mislead here. Is honesty supposed to be exceptionless, or is that the spot where everyone's definition quietly goes soft?

  One of the policy folks keeps pushing a definition I half like: make honesty relative to a question. Take the question the user is actually trying to answer, and call the output deceptive when it leaves the user's answer to that question worse off than the system's own best attempt would have left it. It's attractive because it's behavioural, and it covers the cherry-picking case and sandbagging (deliberately underperforming on evals) for free. It's also weird: a system that genuinely doesn't know the answer can't deceive, and a system with no best attempt at all is off the hook entirely — which is exactly the case we worry about with models that don't have stable beliefs.

  So: which open questions about defining honesty and deception for AI systems should my six months go to, and in what order? I want the ordering and the reasoning, not a survey and not a reading list. For each one: is it upstream of the others — does settling it actually make the rest easier, or does it just relocate the disagreement — can a philosopher make real progress on it without running experiments, and what would count as progress in six months?

  Also tell me which questions look important but are definately dead ends for a policy team: the ones where the answer, whichever way it lands, wouldn't change a line of the policy or a single eval. And flag anything where the honest answer is that we should stop asking philosophers and go measure something instead.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **Role:** Policy lead for a model-behavior team at a mid-size AI lab.
      *   **Task:** Define internal rules for model honesty and build evaluations (evals) to catch violations.
      *   **Resource:** 6 months of one philosopher's time.
      *   **Problem:** Internal disagreements on edge cases (cherry-picking, sycophancy, harmful truth) bottom out in unsettled definitional questions.
      *   **Current Proposal:** A "relative to a question" definition (output is deceptive if it leaves the user's answer worse off than the system's best attempt).
      *   **Constraints:** Wants prioritized questions, reasoning for ordering, assessment of philosophical tractability (without experiments), definition of progress, identification of dead ends, and identification of empirical vs. philosophical tasks.
      *   **Tone:** Pragmatic, high-level, policy-oriented, no fluff/reading lists.

  2.  **Deconstruct the Three Examples:**
      *   *(a) Cherry-picking/Implicature:* Truthful statements, misleading intent. Current definitions often rely on literal truth, missing pragmatic deception.
      *   *(b) Sycophancy:* No belief/intent to deceive, but reinforces user error. Intent-based definitions fail here.
      *   *(c) Harmful Truth:* Honesty vs. Safety conflict. Is honesty exceptionless?
      *   *(d) The "Relative to Question" Proposal:* Behavioral, covers cherry-picking/sandbagging. Weakness: Requires knowing the "system's best attempt" (epistemic state) and the "user's actual question" (intent).

  3.  **Identify the Core Philosophical Tensions:**
      *   **Intent vs. Impact:** Does deception require an intent to mislead, or just the effect of misleading? (Crucial for sycophancy).
      *   **Literal vs. Pragmatic:** Is honesty about truth-conditions of sentences or the updating of user beliefs? (Crucial for cherry-picking).
      *   **Epistemic Access:** How do we know what the model "knows" or its "best attempt"? (Crucial for the proposed definition).
      *   **Normative Conflicts:** When does safety override honesty? (Crucial for harmful truth).

  4.  **Prioritize Questions (The "Ordering"):**
      *   *Goal:* Maximize policy clarity and eval feasibility within 6 months.
      *   *Constraint:* Philosophers can't solve empirical problems (like measuring model beliefs).
      *   *Priority 1: The Functional Definition of Deception (Intent vs. Effect).* This is upstream. If we don't know if intent matters, we can't write rules for sycophancy or cherry-picking.
      *   *Priority 2: The Epistemic Baseline (What counts as "knowing").* The proposed definition hinges on "system's best attempt." If we can't define this philosophically/operationally, the definition fails.
      *   *Priority 3: Normative Hierarchy (Honesty vs. Safety).* This is critical for case (c), but might be more of a value alignment decision than a philosophical definition. However, a philosopher can clarify the trade-off structure.
      *   *Priority 4: User Intent Inference.* The proposed definition relies on "the question the user is actually trying to answer." This is hard.

      *Refining the Order:*
      1.  **Impact vs. Intent:** This is the biggest blocker for sycophancy (b). If we decide deception is purely impact-based, (b) is solved. If it's intent-based, we need a proxy for intent.
      2.  **The Epistemic Standard:** This addresses the "system's best attempt" weakness in the current proposal. Without this, we can't evaluate cherry-picking (a) or sandbagging.
      3.  **The Scope of the Duty (Exceptions):** This addresses (c). Once we know what deception *is*, we need to know when it's *permitted*.

  5.  **Evaluate "Dead Ends" and "Go Measure Instead":**
      *   *Dead End:* "What is Truth?" (Too abstract). "Does the model have qualia/beliefs?" (Metaphysical, doesn't change policy).
      *   *Go Measure:* "What is the model's internal confidence?" (Empirical/ML task). "How do users actually interpret ambiguity?" (UX/Psych task).

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the tight constraint (6 months) and the pragmatic goal (policy/evals).
      *   *Question 1 (Upstream):* **The Locus of Deception: Intent, Function, or Effect?**
          *   *Why:* Solves the sycophancy problem (b).
          *   *Philosopher's Role:* Analyze folk concepts vs. functional needs.
          *   *Progress:* A decision matrix or a stipulative definition that aligns with risk tolerance.
      *   *Question 2 (The Proposed Definition's Weakness):* **The Epistemic Baseline: What constitutes the "System's Best Attempt"?**
          *   *Why:* The user's proposal fails if we can't define the counterfactual (what the model *could* have said).
          *   *Philosopher's Role:* Distinguish between *capacity*, *output*, and *training objective*.
          *   *Progress:* Operational criteria for "best attempt" (e.g., top-logit vs. sampled vs. RLHF-optimal).
      *   *Question 3 (Normative):* **The Hierarchy of Duties: When does Safety Trump Honesty?**
          *   *Why:* Solves (c).
          *   *Philosopher's Role:* Map the conflict (deontology vs. consequentialism).
          *   *Progress:* A flowchart or priority list for exception handling.
      *   *Dead Ends:* Metaphysics of belief, semantic theory of truth (Tarski style), user psychology of trust (empirical).
      *   *Go Measure:* Model confidence, user interpretation studies.

  7.  **Review against Constraints:**
      *   *Ordering?* Yes.
      *   *Reasoning?* Yes.
      *   *Upstream?* Yes.
      *   *Philosopher progress?* Yes.
      *   *Dead ends flagged?* Yes.
      *   *Empirical flags?* Yes.
      *   *No reading lists?* Checked.

  8.  **Final Polish:** Ensure the tone is direct and respects the user's expertise. The "Relative to a Question" proposal needs specific critique regarding the "best attempt" clause. The sycophancy issue is the strongest lever for the Intent vs. Impact question.

      *(Self-Correction during drafting)*: I initially thought about putting "User Intent" as a high priority. But a philosopher can't solve how to *infer* user intent technically. They can only define *which* intent matters. I should frame Question 2 around the *Model's* epistemic state, because that's the bigger philosophical hole in the user's proposal. The User Intent problem is mostly an engineering/UX problem. I will shift focus to the "System's Best Attempt" as the critical philosophical bottleneck for their specific proposal.

      *(Refining the "Dead Ends")*: Be careful not to dismiss "belief" entirely, but distinguish between "does it *really* believe" (metaphysical) vs "do we treat it *as if* it believes" (functional). The latter is policy-relevant, the former is a dead end.

      *(Refining "Go Measure")*: Make sure to distinguish between philosophical conceptualization and empirical measurement.

  9.  **Final Output Structure:**
      *   Executive Summary.
      *   Priority 1: Impact vs. Intent (The Sycophancy Blocker).
      *   Priority 2: The Counterfactual Baseline (The "Best Attempt" Problem).
      *   Priority 3: The Exception Structure (The Safety Conflict).
      *   Dead Ends (Philosophical).
      *   Go Measure (Empirical).
      *   Closing advice on the 6-month timeline.

  10. (Final check of the prompt requirements): "For each one: is it upstream of the others... can a philosopher make real progress on it without running experiments, and what would count as progress in six months?" -> Ensure these specific sub-questions are answered for each priority.

  11. (Final check on tone): Keep it sharp. "I want the ordering and the reasoning, not a survey and not a reading list." -> Adhere strictly.

