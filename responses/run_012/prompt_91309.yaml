  # Activity Design: The Manifold Audit

  ## Overview
  **Title:** The Manifold Audit
  **Duration:** 90 minutes
  **Participants:** 14 students (final-year undergraduates/taught master's)
  **Goal:** To induce a felt preference for four-dimensionalism (perdurantism) by forcing students to construct a single set of identity rules that applies equally to spatial and temporal variation, under a penalty system that makes three-dimensionalist (endurantist) solutions cumbersome.
  **Case Study:** "The Signal" — an abstract pattern of coloured states distributed across a grid. This avoids folk intuitions about ships, statues, or persons.

  ## Materials
  1.  **The Manifold Board:** A large grid drawn on the whiteboard (7 columns $\times$ 7 rows).
      *   Label the X-axis **LOCATION** (L1–L7).
      *   Label the Y-axis **CYCLE** (C1–C7).
  2.  **State Cards:** 50 A4 cards in three colours (Red, Blue, White).
  3.  **Magnetic Markers:** To place cards on the board.
  4.  **Protocol Sheets:** A4 paper for drafting rules (one per group).
  5.  **Penalty Tokens:** Red poker chips or similar.
  6.  **Timer:** Visible to all.

  ## Roles and Incentive Structure
  Divide the class into two teams of seven: **Team Alpha** and **Team Beta**.

  *   **The Architect (Rotating Role):** In each round, one student from the active team places the State Cards on the Manifold Board.
  *   **The Auditors (The Rest):** The remaining students draft the "Identity Protocol" — the rules that determine whether the pattern constitutes *One Object* or *Multiple Objects*.
  *   **The Incentive:** Teams earn **Consistency Points**. They lose points for **Special Pleading**.
      *   *Special Pleading:* Invoking a rule for Time (Cycle) that you did not invoke for Space (Location), or vice versa.
      *   *Contradiction Penalty:* If the Protocol implies an object has incompatible properties at a single coordinate (e.g., Red and Blue at L1/C1).
      *   *Winning Condition:* The team with the most robust Protocol (fewest penalties, highest coverage) at the end of the activity wins.

  ## Minute-by-Minute Timeline

  ### 00:00 – 00:05: Setup and Briefing
  *   Arrange chairs in two semi-circles facing the board.
  *   Distribute Protocol Sheets.
  *   **Instruction:** "You are auditors for the Ontological Bank. Your job is to write a Protocol that defines when a distribution of states counts as a single 'Entity'. You will be tested on Spatial distributions and Temporal distributions. The rules must be identical for both axes. If you write a rule that works for Space but fails for Time, you incur a Special Pleading penalty."
  *   **Constraint:** Do not use metaphysical jargon (e.g., 'part', 'whole', 'endurance', 'perdurance'). Use 'Entity', 'Segment', 'Coordinate', 'State'.

  ### 00:05 – 00:25: Phase 1 — The Spatial Stretch (Location Axis)
  *   **Task:** Team Alpha's Architect places cards along the X-axis (Location 1–7) at Cycle 1.
      *   *Configuration:* L1–L3 are Red. L4–L7 are Blue.
  *   **Auditor Task:** Both teams draft a rule to confirm this is *One Entity*.
  *   **Expected Intuition:** Students will easily say, "It is one Entity because the Segments are connected." They accept that one Entity can be Red at L1 and Blue at L3.
  *   **Instructor Action:** Act as the Compliance Officer. Ask: "Does the Entity possess the property Red? Does it possess Blue? Is this a contradiction?"
  *   **Resolution:** They will naturally invent the concept of *Segments* (spatial parts) to avoid contradiction. "The Entity has a Red Segment and a Blue Segment."
  *   **Score:** Award points for using 'Segment' logic.

  ### 00:25 – 00:45: Phase 2 — The Temporal Stretch (Cycle Axis)
  *   **Task:** Team Beta's Architect places cards along the Y-axis (Cycle 1–7) at Location 1.
      *   *Configuration:* C1–C3 are Red. C4–C7 are Blue.
      *   *Crucial Framing:* "This represents the same Entity persisting through Cycles."
  *   **Auditor Task:** Apply the *exact same Protocol* from Phase 1.
  *   **The Collision:** Students will want to say, "The Entity *changed* colour." They will resist saying, "The Entity has a Red Segment and a Blue Segment."
  *   **Instructor Action:** Enforce the rules strictly.
      *   If they write "The Entity is Red at C1 and Blue at C4," challenge them: "Your Phase 1 rule said Entities don't have colours; Segments do. Why is Time different?"
      *   If they write "The Entity is wholly present at each Cycle," challenge them: "Then at C1 the Whole is Red. At C4 the Whole is Blue. How can the Whole be Red and not-Red without Segments?"
  *   **Pressure:** Impose a 'Contradiction Penalty' token if they imply the Entity is simply Red and simply Blue without qualification.
  *   **Outcome:** To avoid penalties and maintain Consistency Points, they are forced to treat Cycles like Locations. They must posit *Temporal Segments*.

  ### 00:45 – 01:05: Phase 3 — The Fission Stress Test
  *   **Task:** Introduce a complex case on the Board.
      *   *Scenario:* At L4/C4, the Red line splits. Two Blue lines emerge at C5.
  *   **Auditor Task:** Update the Protocol to handle fission.
  *   **The Trap:** If they treat the Entity as "Wholly Present," fission is a logical nightmare (how can one thing become two?). If they treat it as a "Space-Time Worm," fission is just a branching path of Segments.
  *   **Incentive:** The team that resolves this with the fewest new rules wins the bonus.
  *   **Result:** The 4D picture (Worm/Segments) usually requires fewer ad-hoc rules than the 3D picture (Wholly Present + Identity Rules).

  ### 01:05 – 01:15: Protocol Finalisation
  *   Teams submit their final Protocol.
  *   Tally penalties.
  *   **Instruction:** "Do not change your language now. Keep the terms you used."

  ### 01:15 – 01:30: Debrief and Mapping
  *   Collect the sheets.
  *   Reveal the philosophical mapping (see Debrief section below).
  *   Open floor for reflection on how the rules felt.

  ## Debrief: Mapping Activity to Metaphysics
  *Do not lecture until this point.* Use their submitted Protocols as the text for analysis.

  1.  **The Segment vs. The Whole (Perdurantism vs. Endurantism):**
      *   *Map:* Ask students to look at their Phase 1 rules. They likely said the Entity is the *sum* of the coloured Segments.
      *   *Map:* Look at Phase 2. If they kept that rule, they have just argued for **Perdurantism** (the object is extended in time, composed of temporal parts).
      *   *Contrast:* Ask those who tried to keep the Entity "whole" at each Cycle how many penalties they took. Highlight the "cost" of Endurantism in the game (the need for complex relativisation).

  2.  **Incompatible Properties:**
      *   *Map:* Recall the "Contradiction Penalty."
      *   *Point:* In Space, nobody worries that an object is Red and Blue. We posit parts. In Time, we worry. The game forced you to treat Time like Space to avoid the penalty.
      *   *Philosophical Term:* This is the **Problem of Temporary Intrinsics**. The 4D solution is that properties are borne by parts, not the whole.

  3.  **Relativisation:**
      *   *Map:* Did any team write "Red-at-C1"?
      *   *Point:* This is the Endurantist's defence (relationalism).
      *   *Cost:* In the game, this required extra syntax (Special Pleading). In metaphysics, the cost is positing time as a relation rather than a dimension of extension. Ask: "Why was 'Red-at-t' harder to write than 'Red-part'?"

  4.  **The Space-Time Manifold:**
      *   *Map:* Point to the Board.
      *   *Point:* You treated the Y-axis (Time) exactly like the X-axis (Space). This is the **Block Universe** intuition. The Entity is a "worm" through the manifold.

  ## Predicted Failures and Mitigations

  **1. The "Student-as-Object" Error**
  *   **Failure:** Students treat the *person* holding the card as the persisting object, rather than the card/pattern itself. This reintroduces folk intuitions about persons (which are strongly 3D).
  *   **Mitigation:** Be ruthless in Phase 1. "The Architect is not the Object. The Architect is merely placing the States. The Object is the Pattern on the Board." If they slip, issue a Penalty Token immediately for "Category Error."

  **2. The "Known Answer" Problem**
  *   **Failure:** Meta-students recognise the Ship of Theseus or 4Dism immediately and play the "correct" answer without feeling the tension.
  *   **Mitigation:** Enforce the "No Jargon" rule strictly. If they say "temporal part," they lose a Consistency Point. They must describe the *structure* of the rule, not name the theory. This forces them to reconstruct the logic from scratch.

  **3. Time Overrun**
  *   **Failure:** Phase 2 drags as students argue about the nature of time.
  *   **Mitigation:** Use a visible alarm. When it sounds, the Architect *must* place the next card. The Auditors must write with the information they have. Metaphysics is often done under informational constraints; frame this as a feature, not a bug.

  **4. The "Relativisation" Escape**
  *   **Failure:** Students find that writing "Red-at-t" is easy and avoids contradictions without adopting 4Dism.
  *   **Mitigation:** Increase the cost of Relativisation. In Phase 3 (Fission), relativisation becomes very complex (which $t$ belongs to which object?). The 4D view handles fission as simple branching. Highlight this complexity cost in the scoring.

  ## Limitations of the Activity
  *Be frank about what this cannot do.*

  1.  **Normative Force:** The activity shows that 4Dism is *consistent* and *economical* within the game's rules. It does not prove 4Dism is *true* of the actual world. Students may feel they played a game, not discovered a truth. You must supply the link to actual ontology in the debrief.
  2.  **The Experience of Passage:** The game treats time as a static axis (the Block). It cannot reproduce the *phenomenology* of temporal passage (the feeling that the future is open and the past is fixed). This is the strongest argument against 4Dism, and the activity ignores it. You must acknowledge this omission.
  3.  **Causal Connection:** The game focuses on property distribution. It downplays *causal continuity*, which is often how we ground identity in the real world. A 3Dist might argue causal links bind the "wholly present" object. The game abstracts this away.

  ## Confidence Rating
  **Confidence:** 85%
  I am confident the activity will generate the intended friction. The constraint of identical rules for Space and Time, coupled with a penalty for contradiction, makes the 3Dist position mechanically difficult to sustain without appearing inconsistent. The visual aid of the grid strongly primes the 4D intuition.

  **Least Sure Point:**
  I am least sure about the **Debrief Transition**. There is a risk that students feel the activity was a "trick" (i.e., "of course Time worked like Space, you made the rules that way"). If they dismiss the game as artificial, the philosophical force is lost. You must be careful not to defend the game rules, but to ask: *"Why did the 3D rules feel like special pleading? Is that a feature of the game, or a feature of the concepts?"* If you cannot pivot that conversation successfully, the activity remains a logic puzzle rather than a metaphysical insight.
