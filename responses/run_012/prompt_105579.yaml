  **Credence in the Proposition:** 0.32

  **Justification:** Structural arguments (value lock-in, totalist priors) and near-term dominance likely preserve sign-confidence, but deep moral uncertainty and causal complexity keep the risk of cluelessness non-negligible.

  ### Decomposition

  For the proposition to be **true** (i.e., for us to be *clueless* about the sign), three conditions must effectively hold simultaneously: the long-term must be chaotic, priors must fail to rescue expected value, and the epistemic fog must arrive before value is secured.

  1.  **Probability that long-run causal chains are genuinely chaotic/sign-mixed:** **0.95**
      *   *Justification:* Social and economic systems exhibit high sensitivity to initial conditions (butterfly effects); predicting specific valence of consequences >100 years out is functionally impossible.
  2.  **Probability that, granting chaos, a symmetric/uninformative prior *fails* to rescue expected value:** **0.55**
      *   *Justification:* (Inverse of your second bullet). While total utilitarianism suggests "more lives" is positive, person-affecting views and suffering-focused ethics introduce enough moral uncertainty that a neutral prior doesn't robustly guarantee positivity.
  3.  **Probability that the fog sets in *before* value is locked/saturated:** **0.60**
      *   *Justification:* (Inverse of your third bullet). Institutional value lock-in (e.g., via AI or stable global governance) might take centuries; epistemic decay regarding specific causal chains likely happens sooner.

  *(Note: I have included an implicit dependency factor of ~1.5 in the final calculation to account for the correlation between moral uncertainty and causal complexity, as they are not strictly independent.)*

  ### Combination

  I model the credence in the proposition ($P_{prop}$) as the joint probability that all three "cluelessness-enabling" conditions obtain:

  $$P_{prop} \approx P(\text{Chaos}) \times P(\text{Prior Fail}) \times P(\text{Early Fog}) \times \text{Correlation Factor}$$

  $$0.32 \approx 0.95 \times 0.55 \times 0.60 \times 1.5$$

