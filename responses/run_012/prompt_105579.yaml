  This hinges entirely on unresolved meta-ethical questions (e.g., Totalism vs. Person-Affecting Views, axiological symmetry). There is no empirical data that can settle whether "creating a happy person" is neutral or positive in a way that survives causal permutation.

  ### Single Argument/Evidence to Move the Number

  **A formal proof of "Axiological Stability" under causal permutation.**
  If it could be demonstrated mathematically that for any sufficiently broad class of reasonable moral theories, the *expected* value of adding a satisfied life remains positive regardless of downstream causal branching (i.e., the "Good" is an attractor state in causal space), my credence in the proposition would drop to <0.10. Conversely, a proof that value signs flip randomly in branching futures would push my credence >0.80.

  ### Re-posing the Proposition

  The proposition relies on the term "justifiably," which is epistemically loaded. A Bayesian and a Knowledge-First epistemologist will disagree on what counts as justification even with identical evidence.

  **Re-posed Proposition:** *"For acts of this kind, the Bayesian expected value of the long-run consequences, integrated over a reasonable distribution of moral theories and causal models, has a confidence interval for the sign that includes zero."*

