answer: |-
  A man is walking to his car late at night when a stranger steps out. "Give me your wallet," he says, "or I will press a button that destroys a galaxy." The man says, "That's unlikely." The stranger says, "But the expected value is infinite. Hand it over."

  Just as he reaches for his wallet, a second stranger jumps out. "Don't do it," he says. "Give me the wallet, or I will destroy two galaxies."

  The man stops. He looks at the first guy, then the second. He says, "Infinity times any positive probability is still infinity. The expected values are identical. I have no preference ordering."

  He just stands there, hand hovering over his pocket.

  The first stranger waits a minute, then kicks the curb. "Damn it. We overleveraged the threat."

  The second guy checks his watch. "Yeah. If we'd only promised one galaxy, he could have chosen. Now the math doesn't converge."

  They return the wallet and leave.

