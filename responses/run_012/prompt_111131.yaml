  Ok so I need an actual number from you, not a "well it depends how you define it" thing. Me and my friend Maya have been going back and forth about this for like a month and we've hit the point where we're just restating our vibes at each other.

  The claim: in the year 2100 there will still be one country that's clearly the top dog globally, the way the US has been since the early 90s. Not "a great power," the one everybody else has to plan around. My credence is like 0.3, hers is 0.75.

  What I want is your number, but mostly the guts of it. Give me the sub-questions it depends on, a rough probability for each, and how your mashing them together into one figure. Stuff I think is in there:

  - Whether "top dog" even picks out a real thing or is just a story we tell about the recent past. Like, when the USSR broke up, was that a hegemon dying or a hegemon changing its name and losing some weight? Do I get to count Byzantium as Rome or not? Whatever I decide totally changes my list of examples, and I feel like the list is doing all the work and then pretending it's data.
  - The base rate. Take whatever list you just built and ask how many of them were still around 110 years later. What do you get, and how much does that number move if you swap in a slightly different list? I want to see it move, honestly, even if the answer is "a lot."
  - How much the inside view gets to argue back. Nukes, everybody's economies being tangled together, satellites, all that. Does any of it count as a real reason to think this time is different, or is that exactly what the citizens of every empire thought about themselves?
  - The cheat where "there's still a dominant power" gets quietly satisfied by somebody completely unexpected. Is that a real possibility you're counting, or is it a way of making the claim impossible to be wrong about?

  I read something once about the "outside view" where you're supposed to ignore the specifics and just count how often things like this happen, and that's kind of my whole problem here, because counting requires me to pick the list first and I don't think there's a neutral way to do that. So tell me if that worry is overblown or if it's the actual whole ballgame.

  Then: which of those terms is your number most sensitive to, and what would definately move it -- like what would you have to learn that would push you up to 0.6? And out of me and Maya, where do you think our disagreement is actually living?
