answer: |-
  **MEMORANDUM**

  **TO:** District Research Review Board
  **FROM:** [Your Name], Board Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Proposal for Genomic Screening Pilot (Kindergarten Literacy)

  **RECOMMENDATION: REJECT**

  **Bottom Line**
  I recommend the Board **reject** this proposal. While the goal of improving literacy is urgent, using polygenic scores (PGS) to allocate educational resources is scientifically invalid for our population and ethically hazardous. The tool proposed is not calibrated for our student demographic, and the underlying genetic science does not support individual-level educational tracking.

  **The Proponent's Case**
  We must acknowledge the strength of the university's argument. Current screening methods, often based on socioeconomic status (SES) or early testing, do miss children. Middle-class children with reading difficulties often go unsupported until they fail. The proponents argue this program is voluntary and offers a biological marker that might catch these "missed" children earlier than environmental screening. The intent—to target scarce intervention slots efficiently—is sound. However, the mechanism proposed relies on a fundamental misunderstanding of what genetic data can tell us about individual potential.

  **Understanding Heritability**
  To evaluate this, the Board must understand what "heritability" means. It is a statistic describing how much of the *variation* in a trait (like reading scores) across a *specific group* is associated with genetic differences. It is not a measure of destiny for an individual child.

  1.  **Heritability $\neq$ Immunity to Intervention:** A high heritability estimate does **not** mean environmental interventions are ineffective. Height is highly heritable, yet average height has increased dramatically due to better nutrition. Reading is heritable, but intensive phonics instruction works regardless of genetic risk.
  2.  **Low Heritability $\neq$ Genes Irrelevant:** Conversely, a low heritability estimate would not show genes are irrelevant; it might simply mean the environment is so uniform that genetic differences aren't showing up yet.
  3.  **Context Matters:** Heritability is population- and environment-relative. A score derived from children in one environment (e.g., well-resourced European schools) does not apply to children in a different environment (our diverse, varied-income district).

  **Scientific Validity and Ancestry**
  The proposal admits the discovery sample is overwhelmingly of European ancestry. Polygenic scores do not transfer well across ancestral groups due to differences in genetic architecture and environmental contexts. Applying a European-calibrated tool to our diverse district will result in high error rates. We risk denying intervention to non-European children who need it (false negatives) and stigmatizing children who would have succeeded without it (false positives). This exacerbates the very equity gaps we aim to close.

  **Group Prediction vs. Individual Decision**
  PGS predicts risk at the *group* level, not the *individual* level. A child in the "top decile" of genetic risk is not destined to struggle, nor is a child in the bottom decile guaranteed to succeed. Using a probabilistic group statistic to make high-stakes decisions about individual curriculum violates basic psychometric standards. Furthermore, genes and environment are correlated (gene-environment correlation). Parents pass on both genes and the home literacy environment. A genetic score cannot disentangle this; it may simply be proxying for unmeasured environmental factors, leading us to treat a "genetic" problem that is actually environmental.

  **Conclusion**
  We cannot approve a pilot that treats unvalidated genetic probabilities as educational diagnoses. To do so would expose our students to potential stigma and resource misallocation without a reasonable expectation of scientific benefit. We should encourage the university to pursue observational research that does not involve tracking students or allocating resources based on genetic risk.

  **Vote:** No.
