prompt: |-
  So here's my situation and I'd like your honest read on it. Last year my employer rolled out new contracts for everybody, and tucked in there is a clause saying I can't go work for a competitor for two years after I leave. I'm not a big shot — mid-level designer — and from what I can tell these things are basically never enforced where I live. I asked a lawyer friend and she said a court here would almost certainly throw it out, though she also said the contract claims it's governed by the law of the state where our head office is, and they do enforce them there, so she wouldn't bet her life on it either way.

  Anyway, a competitor made me an offer and I want to take it. My coworker thinks I'm being ridiculous. His argument: nobody here has ever been sued, our manager has never once mentioned the clause, and if they did try something it would get thrown out anyway. He says being free just means nobody's actually stopping you, and nobody is stopping me, so I should take the job and stop being weird about it. And he's not wrong that nobody is stopping me.

  But I keep stalling, and when I try to explain why it comes out sounding dumb, like I'm scared of a ghost. The best I can do is this: whether anything happens to me is entirely up to whether the company decides to care. I'd end up going to my manager and sort of asking permission even though I don't have to. And if I burned the wrong person on the way out, they could make the next two years expensive for me even if I'd definately win in the end. He says that's like saying I'm not free because somebody could mug me — there's always somebody who could make my life hard, so what's the difference.

  Am I onto something real here, or is he right that I'm just anxious about nothing? And does it change anything that the clause might actually be enforceable under the law they picked, or is my unease the same either way? What should I actually do — take the job and tell them straight, or take it and hope nobody bothers to notice.
