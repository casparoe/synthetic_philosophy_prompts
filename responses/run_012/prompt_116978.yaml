answer: |-
  You are not being weird, and you are not anxious about a ghost. Your coworker is offering you "street wisdom" that ignores the actual mechanics of how corporate legal threats work.

  Here is the honest read on your situation, breaking down why your gut feeling is more accurate than your coworker's confidence, and how to handle the move.

  ### 1. Your coworker's "mugging" analogy is wrong
  Your coworker says worrying about a lawsuit is like worrying about getting mugged: *someone could always do something bad to you, so why worry?*

  That is a false equivalence. A mugging is random. A lawsuit is a **calculated business decision.**
  *   **Predictability:** A company knows exactly where you work, what you signed, and what you stand to lose. They don't need to find you; they already have your address.
  *   **Leverage:** The goal of a non-compete is rarely to win in court. The goal is to make the threat of court scary enough that you quit the new job voluntarily.
  *   **Cost:** Even if you win, you might have to pay a lawyer $10,000 to draft the motions to get the case thrown out. Your employer has a legal department on salary; you have savings.

  You are right: **Winning in the end can still be expensive in the middle.** That is not anxiety; that is risk assessment.

  ### 2. The "Choice of Law" clause is a real wildcard
  Your lawyer friend gave you the most important piece of information: *The contract says it's governed by the head office state.*

  *   **Local Public Policy:** In many jurisdictions, if you live in a state that strongly disfavors non-competes (like California, Oklahoma, North Dakota, or increasingly others), local courts will refuse to enforce a foreign state's law because it violates local public policy.
  *   **The Gray Area:** However, if you live in a state that is "middle of the ground" (where non-competes are allowed if reasonable), a judge *might* honor the choice of law clause. If the head office is in a state that aggressively enforces them, they could file suit there.
  *   **The Nightmare Scenario:** If they sue you in the head office state, you now have to hire a lawyer licensed in *that* state. That doubles your legal complexity and cost.

  This uncertainty is exactly why you feel stuck. It's not that you think you'll definitely lose; it's that the path to winning is foggy.

  ### 3. Do not ask for permission
  You wrote: *"I'd end up going to my manager and sort of asking permission even though I don't have to."*

  **Do not do this.**
  *   **It creates a record:** If you tell them in writing or in a meeting, "I'm going to Competitor X," you have handed them the evidence they need to send a cease-and-desist letter to you and your new employer.
  *   **It invites negotiation:** They might try to counter-offer or guilt-trip you, which burns bridges regardless of the legal clause.
  *   **You are right:** You don't need permission. You need to manage the risk.

  ### 4. What you should actually do
  You are a mid-level designer. You are likely not walking away with the "secret sauce" of the company (client lists, source code, strategic roadmaps). This is in your favor. Courts generally dislike punishing ordinary workers for trying to earn a living.

  Here is a strategic plan to move forward without living in fear:

  **Step 1: Get a formal legal opinion (not just a friend)**
  Your lawyer friend gave you a hallway opinion. Spend the money ($300–$500) for a one-hour consultation with an employment attorney in *your* current state of residence. Bring the contract. Ask specifically about the "Choice of Law" clause and your local public policy. Knowing for sure if your local courts would toss it out will cure 80% of your anxiety.

  **Step 2: Talk to the NEW employer**
  Before you resign, tell the new company: *"I have a non-compete in my old contract. My understanding is it's likely unenforceable, but I wanted to disclose it."*
  *   **Why:** Many companies have legal teams that will send a letter to your old employer stating they intend to hire you and believe the clause is void. This often scares the old employer off before they spend money on lawyers.
  *   **Indemnification:** Ask if they have a policy for legal indemnification if your old employer sues over this.

  **Step 3: Assess your "Threat Profile"**
  Be honest with yourself. Are you taking designs you made at the old job to the new one? Are you emailing yourself portfolios that contain proprietary info?
  *   **Clean Break:** Do not take a single file, sketch, or contact list. Wipe your personal devices of company data. If you are clean, their legal case is even weaker.

  **Step 4: The Resignation**
  When you quit, keep it standard. *"I'm resigning. My last day is X."*
  *   If they bring up the non-compete in the exit interview, do not argue. Say: *"I am aware of the clause. I have been advised that it does not apply to this new role, but I am happy to have my counsel speak with yours if needed."*
  *   This shows you aren't bluffing, without you having to fight the battle yourself.

  ### The Verdict
  Your coworker is treating this like a binary switch (Sued vs. Not Sued). You are correctly seeing it as a **spectrum of hassle.**

  You are not "unfree" because someone *might* sue you. You are "encumbered" because the contract creates a friction cost to your movement. That is a real thing.

  **Recommendation:** Take the job. The trend in the US is heavily moving against non-competes for mid-level employees. But do not take it "hoping nobody notices." Take it after verifying your local legal standing, ensuring your new employer knows the risk, and making sure your own house is clean of proprietary data.

  Don't ask permission. Manage the risk.

  ***

  *Disclaimer: I am an AI, not an attorney. This is strategic analysis based on common employment dynamics, not legal advice. Employment law varies wildly by location. You should consult with a qualified employment attorney in your jurisdiction before making legal decisions.*
