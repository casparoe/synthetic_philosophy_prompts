          *   *Cost:* You have to concede that *some* aesthetic facts are propositional/historical, not just experiential.
      *   **Section 3: Transmission of Taste (Apprenticeship/Education).**
          *   *Analysis:* Wine tasting, film school. This isn't usually testimony; it's *calibration*.
          *   *Distinction:* Testimony says "X is good." Training says "Here is how to see X."
          *   *Verdict:* This is noise, not a defeater, *unless* the training relies on authoritative assertion without perceptual grounding.
      *   **Section 4: The "Rigging" Charge (Unfalsifiability).**
          *   *Analysis:* If every counterexample is "that's not *real* aesthetic knowledge," the term "knowledge" is doing too much work.
          *   *Test:* Can you imagine a world where testimony *would* count? If not, it's analytic truth, not substantive claim.
          *   *Cost:* You need to allow for "deferential knowledge" in edge cases or admit your "knowledge" is a technical term.
      *   **Section 5: Sorting the Defeaters (The Map).**
          *   *High Weight:* The distinction between aesthetic *properties* and aesthetic *value*.
