  11. **Refining the "Rigging" point:** If I define knowledge as "justified true belief + non-inferential experience," then by definition testimony fails. The question is whether that definition is *ad hoc*. The defense must be that aesthetic predicates *demand* this. The counter is that we use aesthetic predicates propositionally all the time ("This is a good buy").

