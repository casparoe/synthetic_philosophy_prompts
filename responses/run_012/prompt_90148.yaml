      Friends, families, tutors. We gather at an ending that is also a beginning. In my studies, I've been haunted by a question: if humanity ended tonight, painlessly, all at once, what would be lost? Obviously, lives would stop. But there is a further silence. It is the loss of anyone left to care that the sun rises, or that justice is done, or that a poem is beautiful. The catastrophe is not just the dying; it is the extinguishing of the witness.

      Many of us carry losses today. Empty seats in this hall. The usual comfort is to say those people live on in us. I will not say that. It is not true. They are gone. Their absence is real. But their absence matters because we are here to feel the weight of it. Value requires a valuer. When we grieve, we are keeping faith with the fact that their lives mattered to someone, even if that someone is now only us.

