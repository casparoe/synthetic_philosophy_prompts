          5.  Reconstruction of the View: List commitments.
          6.  The Persuasion Alternative: Contrast and implications.
      *   *Refinement on the Judge:* Make sure to emphasize *verification*. The judge doesn't need to know the answer, but they must be able to verify *steps* of the answer (e.g., checking a math proof step-by-step even if they can't solve the whole problem).
      *   *Refinement on Truth:* Use the concept of "Nash Equilibrium" in the debate game. If truth is the equilibrium, the system works.
