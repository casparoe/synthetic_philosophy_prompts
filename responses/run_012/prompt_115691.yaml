answer: |-
  **Case A: The Municipal Permit Office**
  A city's building permit office operates in a tight circle: inspectors approve construction plans, contractors build structures based on those plans, and inspectors return to verify the finished structures match the approval. For this cycle to function without collapsing into liability chaos, the Municipal Building Code must remain fixed outside the inspectors' authority. The inspectors interpret the Code, but they cannot rewrite it; the Code is adopted by the City Council and recorded as law. However, the Chief Inspector often tells his staff, "The Code is just paper; we decide what is safe based on experience," effectively denying the Code's inviolate status. If the inspectors were to actually treat the Code as mutable—changing the rules to match whatever they find on site—the link between approval and safety would sever. Permits would become meaningless, insurance would vanish, and the office would lose its legal standing to operate.

  **Case B: The University Tenure Committee**
  A university's tenure committee operates in a similar circle: tenured faculty set the criteria for promotion, junior faculty work to meet those criteria, and successful juniors are promoted to become the tenured faculty who set the next round of criteria. To the outside observer, the "Tenure Standards" document looks like a fixed rulebook that stands above the faculty, judging them objectively. In reality, the Standards are revised every decade by the very people they are supposed to judge. There is no external anchor; the definition of "academic excellence" is produced by the loop itself. Yet the system produces something stable: a continuous stream of hired professors, published research, and granted degrees. The levels loop back on each other without breaking, because the legitimacy of the Standards comes from the consensus of the faculty, not from an external truth.

  ***

  **The Work**

  **Case A Analysis**
  *   **Levels:** 1. Inspectors, 2. Construction Projects, 3. Municipal Building Code.
  *   **Loop Closure:** Inspectors approve Projects -> Projects are built -> Inspectors verify Projects.
  *   **Why Inviolate:** The Code (Level 3) cannot be pulled inside the loop (made mutable by Inspectors) because the loop relies on the Code to adjudicate disputes. If the verifiers can change the rules of verification mid-process, the distinction between "compliant" and "non-compliant" dissolves. The system collapses because its output (safety certification) loses its truth value relative to the physical world.

  **Case B Analysis**
  *   **Levels:** 1. Tenured Faculty, 2. Tenure Standards, 3. Junior Faculty.
  *   **Loop Closure:** Faculty set Standards -> Standards judge Juniors -> Juniors become Faculty.
  *   **The Fake Level:** The Tenure Standards (Level 2) appear to be an inviolate rulebook standing outside the human agents, but they are actually rewritten by Level 1. The loop runs because the participants agree to treat the Standards as fixed *for the duration of the review*, even though they know they will change them later.

  **The Honest Part**
  The single feature distinguishing A from B is **amendability by participants**. In A, the fixed level (Code) cannot be changed by the loop's agents without destroying the system's function. In B, the apparent fixed level (Standards) *must* be changed by the agents to keep the system alive and relevant.

  A theorist who insists every tangle must bottom out would redescribe Case B by claiming there *is* an external anchor, such as "Objective Truth" or "Real Competence," that secretly guides the faculty's revisions. They would argue the faculty are merely *discovering* the standards, not inventing them. This move is a **stipulation**, not a discovery. It posits a metaphysical constraint to comfort the intuition that loops are unstable. Case B is not a cheat; social institutions run on tangled hierarchies all the time (money, language, law). They work not because they touch bedrock, but because the participants agree to act as if they do.
