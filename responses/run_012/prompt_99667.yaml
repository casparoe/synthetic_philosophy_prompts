answer: "(i) Examination Question\n\n**Course:** Advanced Seminar on Vagueness\n**Time\
  \ Allowed:** 90 Minutes\n**Instructions:** Answer the following question. No outside\
  \ reading is required; you will be marked on the quality of your argument and analysis\
  \ rather than your ability to recall names or historical attributions.\n\n**Question:**\n\
  \nConsider a metallurgical specification stating that a steel batch is \"compliant\"\
  \ if its tensile strength exceeds 500 MPa. In practice, measurement is noisy, and\
  \ strength varies continuously. Practitioners often hold two conflicting intuitions\
  \ regarding a batch measuring exactly 500 MPa: (1) that the standard does not decide\
  \ the case (the status is indeterminate), and (2) that there is a fact of the matter\
  \ we simply cannot establish (the status is unknown).\n\nUsing this case, analyze\
  \ the divergence between the view that treats vagueness as ignorance (the Epistemic\
  \ view) and the view that treats it as semantic indeterminacy (the Supervaluationist\
  \ view). Your essay must address the following four points:\n\n1.  **Truth and Omniscience:**\
  \ How does each view assign a truth value to the sentence \"This batch is compliant,\"\
  \ and would an omniscient inquirer be able to settle the matter?\n2.  \b**Semantic\
  \ Costs:** Analyze the theoretical price each view pays. Specifically, discuss the\
  \ view that sacrifices the principle that a compound sentence's truth is fixed by\
  \ its parts, and the view that struggles to maintain that a sentence is true exactly\
  \ when things are as it says they are.\n3.  **Higher-Order Vagueness:** If we accept\
  \ that there is no sharp line between clear cases and borderline cases, how does\
  \ each view accommodate (or fail to accommodate) this lack of a boundary?\n4.  **Upshot:**\
  \ Conclude by assessing whether this dispute is merely a difference in idiom or\
  \ if it entails a genuine theoretical or practical difference in how we understand\
  \ specifications and reality.\n\n***\n\n(ii) Model Answer\n\nThe tension in the\
  \ engineering case mirrors the central divide in the philosophy of vagueness. When\
  \ a batch measures exactly 500 MPa, the practitioner's conflicting intuitions map\
  \ onto two distinct theoretical frameworks. The first intuition—that the standard\
  \ does not decide—aligns with the semantic indeterminacy view, while the second—that\
  \ a fact exists but is unknown—aligns with the epistemic view. These positions part\
  \ company fundamentally on the nature of truth and reality.\n\nRegarding truth and\
  \ omniscience, the epistemic view maintains classical bivalence: the sentence \"\
  This batch is compliant\" is either true or false, determined by the actual tensile\
  \ strength relative to the precise cutoff nature dictates. On this view, an omniscient\
  \ inquirer would know the truth value because the fact exists independently of our\
  \ knowledge. Conversely, the semantic indeterminacy view holds that the sentence\
  \ is neither true nor false. The term \"compliant\" lacks a precise extension; therefore,\
  \ even an omniscient being could not settle the matter, not due to a lack of knowledge,\
  \ but because there is no fact to be known. The world does not determine a unique\
  \ truth value for borderline cases.\n\nEach view pays a distinct semantic price\
  \ for its coherence. The semantic indeterminacy view preserves the intuition that\
  \ language is incomplete but sacrifices truth-functionality. In classical logic,\
  \ a disjunction is true if at least one disjunct is true. However, on this view,\
  \ \"The batch is compliant or it is not compliant\" may be true (as it holds across\
  \ all admissible ways of making the language precise) even though neither disjunct\
  \ is true individually. Thus, the truth of the compound is not fixed by the truth\
  \ values of its parts. The epistemic view preserves truth-functionality and classical\
  \ logic but struggles with the correspondence intuition. It claims the sentence\
  \ is true exactly when things are as it says they are, yet it posits a sharp boundary\
  \ in reality that is in principle unknowable. This makes the \"fact of the matter\"\
  \ mysterious; if the boundary cannot influence our usage or verification, it is\
  \ unclear in what sense the sentence corresponds to reality rather than merely satisfying\
  \ a logical form.\n\nThe challenge deepens with higher-order vagueness. Practitioners\
  \ know there is no sharp line separating clear compliance from borderline compliance.\
  \ The epistemic view is forced to deny this: it must assert there is a last compliant\
  \ batch before the borderline region begins, creating a sharp boundary between the\
  \ clear and the borderline. This seems to contradict the phenomenology of vagueness.\
  \ The semantic indeterminacy view attempts to avoid this by allowing the set of\
  \ admissible precisifications to be vague. However, it risks collapsing; if the\
  \ boundary of \"admissible precisifications\" is itself vague, the theory requires\
  \ a meta-language to explain it, potentially leading to an infinite regress or reintroducing\
  \ sharp boundaries at a higher level.\n\nFinally, is this dispute merely idiomatic?\
  \ Practically, both views advise caution with borderline batches. Theoretically,\
  \ however, the difference is profound. The epistemic view implies a realist metaphysics\
  \ where nature imposes sharp lines on continuous properties, suggesting our concepts\
  \ fail to carve nature at its joints. The semantic indeterminacy view implies that\
  \ the fuzziness lies in our linguistic conventions, not the world. If the former\
  \ is true, engineering specifications are approximations of a sharp reality; if\
  \ the latter, specifications are incomplete rules that we complete only by decision.\
  \ Thus, the dispute is not just verbal; it dictates whether we view uncertainty\
  \ as a limitation of human access or a feature of linguistic representation.\n\n\
  ***\n\n(iii) Marking Scheme\n\n**Total Marks: 25**\n\n**1. Truth Values and Omniscience\
  \ (5 Marks)**\n*   **Must Hit:** Clearly distinguishes that the epistemic view assigns\
  \ a classical truth value (True/False) knowable by an omniscient being, while the\
  \ indeterminacy view assigns no truth value (or indeterminate) which remains unsettled\
  \ even by omniscience.\n*   **Specific Error:** Claiming that the indeterminacy\
  \ view allows an omniscient being to know the truth value, or that the epistemic\
  \ view denies bivalence.\n\n**2. Semantic Costs: Truth-Functionality (5 Marks)**\n\
  *   **Must Hit:** Identifies that the semantic indeterminacy view sacrifices truth-functionality\
  \ (e.g., a disjunction can be true while disjuncts are indeterminate).\n*   **Specific\
  \ Error:** Attributing the loss of truth-functionality to the epistemic view, or\
  \ claiming both views preserve classical truth-functional logic without qualification.\n\
  \n**3. Semantic Costs: Correspondence/Reality (5 Marks)**\n*   **Must Hit:** Explains\
  \ that the epistemic view strains the correspondence intuition by positing unknowable\
  \ sharp boundaries, whereas the indeterminacy view strains it by making truth dependent\
  \ on admissible precisifications rather than a single state of affairs.\n*   **Specific\
  \ Error:** Asserting that the epistemic view has no trouble explaining how sentences\
  \ match reality, or failing to identify the metaphysical mystery of the sharp boundary.\n\
  \n**4. Higher-Order Vagueness (5 Marks)**\n*   **Must Hit:** Addresses the problem\
  \ of the boundary between clear and borderline cases, noting that the epistemic\
  \ view implies a sharp second-order boundary, while the indeterminacy view risks\
  \ regress or collapse when defining admissible precisifications.\n*   **Specific\
  \ Error:** Ignoring higher-order vagueness entirely or claiming one view eliminates\
  \ the problem completely without residue.\n\n**5. Theoretical Upshot (5 Marks)**\n\
  *   **Must Hit:** Provides a reasoned conclusion on whether the difference is real,\
  \ linking the metaphysical stance (realism vs. linguistic convention) to the interpretation\
  \ of the engineering specification.\n*   **Specific Error:** Dismissing the dispute\
  \ as purely verbal without argument, or failing to connect the theoretical difference\
  \ back to the practical case of specifications.\n\n**Differentiation:**\nAn **A\
  \ answer** integrates the engineering example throughout to illustrate abstract\
  \ points, showing how the philosophical stakes alter the interpretation of the specification\
  \ itself. A **B answer** addresses the four required points correctly but treats\
  \ the engineering case merely as an introductory hook rather than a sustained analytical\
  \ tool."
