  in my field routinely impose a sharp numerical cutoff on a property that varies
  continuously — a batch conforms if a measured value falls on one side of a line
  — and everyone involved knows both that the measurement is noisy and that the underlying
  property is graded. Practitioners, in my experience, cheerfully assert two things
  that I now realize pull in opposite directions: that a batch sitting on the line
  is one the standard does not decide, and that of course there is a fact of the matter
  about it, which we simply cannot establish. The first sounds like the view on which
  the standard''s language admits many equally good ways of drawing the line; the
  second sounds like the view on which the line is already there and our trouble is
  ignorance. I would like the question to use a case of that kind — a specification,
  a certification decision, a borderline batch — as the occasion for the analysis,
  and to require all of the following: whether the two views can be told apart by
  what they say about a borderline sentence''s truth value and about whether an omniscient
  inquirer could in principle settle the matter; the semantic price each side pays,
  including the one that gives up the principle that a compound''s truth value is
  fixed by the truth values of its parts, and the one that has trouble with the thought
  that a sentence is true exactly when things are as it says they are; what becomes
  of each view once the vagueness of the borderline is itself taken seriously, so
  that no sharp line separates the borderline from the clear cases; and finally whether
  the whole dispute has any practical or even theoretical upshot, or whether the two
  sides are describing one situation in two idioms. Please write (i) the examination
  question itself, pitched for a 90-minute written paper in an advanced course and
  entirely self-contained — it should tell candidates that no outside reading is required
  and that they will be marked on the argument rather than on names — (ii) a model
  answer of roughly 700 words, and (iii) a marking scheme of five must-hit points
  worth five marks each, out of 25, where each point states what a top answer must
  contain and, separately, the specific error that should cost a candidate marks;
  close with two or three sentences saying what separates an A answer from a B. Since
  I have already embarrassed myself once by confidently attributing a view to the
  wrong philosopher, please keep the model answer free of attributions and have it
  describe the positions rather than cite them.'
