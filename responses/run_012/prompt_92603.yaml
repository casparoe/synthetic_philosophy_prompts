answer: |-
  This is a sharp observation that cuts to the core of methodology in the physical sciences versus the historical sciences. You have identified a tension between **predictive novelty** (physics' gold standard) and **retrodictive consistency** (the requirement to recover old results), alongside a disciplinary divide regarding **accommodation** (fitting known data).

  Here is an analysis of what these practices assume, whether they cohere, and where the underdetermination lies.

  ### 1. The Disciplinary Divide: Laws vs. Traces
  Your first observation is that physics rejects accommodation ("curve-fitting") while historical sciences embrace it. This stems from the different *modalities* of the sciences.

  *   **Physics (Nomothetic):** Aims for universal laws. The data is generated by controlled experiments that can be repeated. If you tune a model to fit existing data points without a mechanistic justification, you risk **overfitting**. You are modeling the noise or the specific experimental setup rather than the underlying law. Because the experiment can be rerun under new conditions, the primary test is **extrapolation** (prediction).
  *   **Historical Sciences (Idiographic):** Aims to reconstruct singular past events (the K-Pg extinction, the formation of the Alps). The "experiment" cannot be rerun. The data consists of traces (fossils, strata, isotopes). Here, explanation *is* accommodation. A theory is good if it renders the disparate traces **consilient**—if one cause explains the iridium layer, the fossil gap, *and* the shocked quartz. In this context, fitting the known data isn't "curve-fitting"; it's "solving the crime."

  **What the practice assumes:** Physics assumes nature is governed by stable, mathematical functions that generalize beyond the training set. Historical science assumes the past was a singular causal chain that left multiple, convergent traces.

  ### 2. Prediction vs. Accommodation (The "Risk" Criterion)
  You ask if the practice presupposes that a theory earns its keep by risking a prediction. **Yes.**

  In philosophy of science, this is the **Use-Novelty Criterion**. A fact confirms a theory more strongly if the fact was not used in the construction of the theory.
  *   **Accommodation** is "cheap." With enough free parameters (the "von Neumann elephant" problem), you can fit any dataset.
  *   **Prediction** is "expensive." It restricts the degrees of freedom. If a theory predicts a specific value for a constant before it is measured, it demonstrates that the theory is latching onto the structure of reality, not just the structure of the data.

  However, accommodation is not worthless; it is the **baseline requirement**. A theory that cannot accommodate existing data is falsified. A theory that *only* accommodates existing data is suspect (phenomenological). A theory that accommodates existing data *and* predicts new data is considered fundamental.

  ### 3. "False" vs. "Approximately True" (The Correspondence Principle)
  This is the crux of your second observation: Physicists say Newton is "false," yet demand General Relativity (GR) reproduce Newtonian gravity in the low-speed limit.

  If Newton were strictly *false* (like "phlogiston" or "ether"), there would be no reason for GR to look like him. The fact that GR *must* reduce to Newton implies that Newton was not false, but **domain-limited**.

  This practice commits physicists to a view of **Effective Field Theory (EFT)** or **Verisimilitude** (truth-likeness), rather than binary Truth/Falsehood.
  *   **The Commitment:** Theories are not descriptions of "what is"; they are algorithms that work within specific energy/scale domains.
  *   **The Logic:** If GR did not recover Newtonian results at low speeds, GR would be immediately falsified by the existing data of planetary orbits. The old data doesn't vanish just because we have a new theory.
  *   **The Resolution:** Newton is not "false"; he is an **asymptotic approximation**. The requirement to recover old results ensures **continuity of empirical adequacy**. It assumes reality is layered; the new theory must explain why the old theory *appeared* true within its domain.

  **Do the commitments fit?**
  Yes, but only if you abandon binary truth. If you believe theories are either True or False, the practice is contradictory. If you believe theories are **models with validity ranges**, the practice is perfectly coherent. The "curve-fitting" ban protects against models that have no validity range beyond the current data. The "correspondence" rule protects against models that break the validity ranges of established models without cause.

  ### 4. Where is the Practice Underdetermined?
  You ask what is strictly required versus what is professional habit. This is where the sociology of physics often masks itself as methodology.

  **Strict Requirements (The Hard Constraints):**
  1.  **Mathematical Consistency:** The theory cannot contradict itself.
  2.  **Empirical Adequacy:** It must fit the data within error bars (both old and new).
  3.  **Causal Mechanism (increasingly):** In fundamental physics, "shut up and calculate" is losing ground to demands for ontological clarity (e.g., the measurement problem).

  **Professional Habits (The Soft Constraints):**
  1.  **"Naturalness":** The belief that dimensionless constants should be near 1. This is a heuristic, not a law, but papers violating it face higher scrutiny.
  2.  **Aesthetic Simplicity:** "Elegance" is often a proxy for "low parameter count," but it is subjective.
  3.  **The Sneer at Phenomenology:** There is a cultural hierarchy where "fundamental" theorists look down on "phenomenological" modelers (who fit data). Yet, almost all progress starts phenomenologically. The ban on curve-fitting is often a ban on *stopping* at curve-fitting.
  4.  **Falsifiability Fetish:** As seen in String Theory, physicists will sometimes tolerate a lack of falsifiability if the mathematical structure is rich enough, contradicting their own stated dogma about curve-fitting.

  ### 5. Summary: What the Practice Presupposes
  The practice you describe rests on three interconnected assumptions:

  1.  **Realism about Structure:** The mathematical structure of the theory corresponds to the causal structure of the world (which is why "fitting parameters" without structure is derided).
  2.  **Asymptotic Progress:** New theories encompass old theories as limiting cases. Truth is approached asymptotically, not attained binarily.
  3.  **Risk as Validation:** Accommodation proves a theory is *possible*; prediction proves a theory is *necessary* (or at least robust).

  **The Tension:**
  The tension you feel arises because physicists speak like **binary realists** ("Newton is wrong") but practice like **instrumentalists** ("But make sure you get Newton's answers out").

  *   **Does one commitment do all the work?** The requirement to **recover old results** does the heavy lifting for empirical consistency. The requirement for **novel prediction** does the heavy lifting for theory selection.
  *   **Are they compatible?** They are compatible only under an **Effective Realist** framework. If you view theories as "maps," the new map must cover the territory the old map covered (recover results), but it must also map territory the old map didn't (prediction). Accusing someone of curve-fitting is accusing them of drawing a map that only matches the places you've already been, with no guarantee it works for the next step.

  **Where it is underdetermined:**
  The practice does not strictly require **reductionism**. You could have a science that accepts emergent laws that do not neatly reduce to lower limits, provided they are empirically robust. The insistence that new theories *must* derive from older, more fundamental ones (and thus recover them) is a metaphysical commitment to reductionism, not a strict methodological requirement. That is where the "habit" overrides the "logic."
