      *   **Secondary Observation:** Physicists demand new theories reproduce old results in the limit (correspondence principle), even while claiming the old theory is "false."
      *   **Key Questions:**
          1.  What is the practice assuming? (Epistemological underpinnings)
          2.  Does it presuppose risk/prediction over accommodation?
          3.  Does the "recover old results" rule imply theories are locally/approximately true rather than strictly false?
          4.  Do these commitments fit together?
          5.  Where is the practice underdetermined? (Strict requirements vs. comfortable habits)

  2.  **Analyze the "Physics vs. Historical Sciences" Distinction:**

      *   *Physics:* Often deals with controlled experiments, universal laws, and high precision. "Curve-fitting" implies adding parameters without mechanistic justification to match noise or specific points without predictive power for *new* conditions.
      *   *Historical Sciences:* Deal with singular events (the K-Pg extinction, the formation of the Grand Canyon). You can't rerun the experiment. "Explanation" means constructing a coherent narrative consistent with all available traces. Accommodation *is* the primary method because prediction is often impossible (you can't predict the past).
      *   *Nuance:* Physics *does* accommodate data (e.g., Standard Model parameters). Historical sciences *do* make predictions (e.g., finding a specific fossil in a specific stratum). The user's distinction is a bit stylized but captures a real cultural difference.

  3.  **Analyze the "Correspondence Principle" (Recovering Old Results):**

      *   Why demand a new theory match the old one where the old one worked? (e.g., General Relativity $\to$ Newtonian Gravity at low speeds).
      *   *Reason 1:* Empirical adequacy. The old data didn't disappear. If GR predicted planets would fly off at low speeds, it would be immediately falsified by existing data.
      *   *Reason 2:* Structural continuity. It suggests the new theory captures the *structure* of reality better, not just a lucky guess.
      *   *Truth Status:* Is Newton "false"? Strictly, yes (space isn't absolute). Practically, no (it works within error bounds). This points to *verisimilitude* (truth-likeness) or *effective field theory* (valid within a domain).

  4.  **Address the Core Tension (Prediction vs. Accommodation):**

      *   *Novel Prediction:* The gold standard in physics (e.g., Dirac predicting antimatter, Einstein predicting light bending). It shows the theory isn't just tailored to known facts.
      *   *Accommodation:* Necessary but suspicious. If you have enough free parameters, you can fit anything (von Neumann elephant).
      *   *The "Risk":* Physics values *risky* predictions. Historical sciences value *consilience* (many lines of evidence converging on one explanation).

  5.  **Synthesize the Answers to the User's Questions:**

      *   *What is the practice assuming?* It assumes nature is uniform and mathematically structured. It assumes "overfitting" is a major risk in fundamental physics but "underfitting" (failing to explain known traces) is a major risk in historical science.
      *   *Prediction vs. Accommodation:* Yes, physics prioritizes novel prediction as a test of *generative* power. Accommodation is necessary but not sufficient.
      *   *False vs. Approximately True:* This is the crux. The "recover old results" rule implies *domain validity*. Newton isn't "false" in his domain; he's "limiting." This aligns with Effective Field Theory (EFT).
      *   *Do they fit together?* Yes, if you view science as asymptotic approach to truth (realism) or as building better tools (instrumentalism). The tension arises if you hold a binary view of truth (True/False). If truth is graded (verisimilitude), they fit perfectly.
      *   *Underdetermination:* The practice requires empirical consistency (strict). It *prefers* novel prediction (heuristic). It *requires* mathematical consistency (strict). It *prefers* elegance (aesthetic/habit).

