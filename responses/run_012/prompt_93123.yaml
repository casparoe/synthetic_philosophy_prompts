prompt: |-
  You're a decision theorist — someone genuinely at home in self-locating and imperfect-recall problems, and not about to hand me the textbook line on them. Think carefully, and get the arithmetic straight before you say anything evaluative.

  Here's the setup I want to use, which I think is the absent-minded driver or close enough:

  You're driving home along a road with exactly two exits. You can't tell them apart and you can't remember whether you've already passed one — every time you reach an intersection it looks and feels exactly like the first one; no odometer, no landmarks, nothing to go on. So you get one rule to apply at "an intersection", with no way to know which intersection you're at. Taking the first exit earns you 0. Taking the second earns you 4. Sailing past both earns you 1. And no leaving notes on the dashboard — being absent-minded is the whole gimmick.

  I want a rating, not an essay. Below are seven rules for deciding, written as plainly as I could. For each, give me the expected payoff it actually earns on this trip, on my numbers — a number, not a vibe — then rank them into tiers from "I'd actually trust this" down to "this one is a trap", with a sentence or two on each.

  1. Plan and lock. Before you set off, work out the best complete policy — a rule for what to do at any intersection, including whether to randomize — and then execute it, no reconsidering at the wheel.
  2. Ask again at every intersection. When you get to an intersection, ask "given where I am right now, which way is better?" and do that. No advance commitment to anything.
  3. Treat the choice as evidence. Pick the act that makes the good situation most likely, counting "I'm about to take this exit" as evidence about what you did earlier and about what you'll do later.
  4. Universalize. Pick the act you'd want every version of you to pick — the one that would be best if every time-slice of you, at every intersection, were bound to do the same thing.
  5. Fresh coin at every intersection. Flip a brand-new coin each time you reach an intersection, with odds you fixed before leaving home, and do what it says.
  6. One coin at home. Flip a single coin before leaving, with the odds fixed then, and treat its outcome as a fact about the world rather than a choice: it settles what you do the whole way and you never get to redraw.
  7. Maximin. Take the act whose worst possible outcome is least bad.

  Two things I specifically want out of this. First, some of these are the same rule wearing different hats — 5 and 6 especially, which I'd have sworn were the same idea until I tried writing them out seperately. Say which ones are genuinely the same rule and which only look it, and what each collapses into. Second, I have a suspicion that at least two of them disagree in a way that matters even though they sound identical in casual speech, and I want you to say exactly where that disagreement lives.

  Then a quick robustness check: does your ranking survive if the payoff for sailing past both exits is 3 instead of 1? Don't redo everything, just tell me what breaks and why.

  If any of the seven is a famous decision theory in a hat, say which, but keep that brief — I care alot more about your own verdict on which rule you'd actually adopt, and whether the "randomize" answer is something a driver can really do or whether it smuggles in a commitment the driver can't have.

  Also, no citations and no paper names; I don't have web access and I'm not testing your bibliography. And where a rule's payoff depends on how you read it — say, whether an "act" means a definite choice or a lottery — give me both numbers and say which reading you think is the honest one.
