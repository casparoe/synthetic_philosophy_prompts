  ### The Arithmetic
  Payoffs: Exit 1 = 0, Exit 2 = 4, Pass Both = 1.
  Let $p$ = probability of Continuing at any intersection.
  Expected Value $V(p) = 0(1-p) + 4p(1-p) + 1p^2 = 4p - 3p^2$.
  Maximized at $p = 2/3$, yielding **1.33**.
  Pure Continue ($p=1$) yields **1**.
  Pure Exit ($p=0$) yields **0**.

  ### The Ratings

  **Tier 1: I'd Actually Trust This (Payoff: 1.33)**
  *   **1. Plan and lock.** Ex-ante optimization. You calculate $p=2/3$ before driving and bind yourself to it. **Payoff: 1.33.** (Ex-ante CDT).
  *   **4. Universalize.** You choose the policy that maximizes value if all your time-slices do the same. This mathematically collapses to Rule 1. **Payoff: 1.33.** (FDT/UDT).
  *   **5. Fresh coin at every intersection.** You implement the mixed strategy $p=2/3$ using independent randomization at each node. This mechanically enforces the optimal plan. **Payoff: 1.33.** (Mixed Strategy).

  **Tier 2: This One Is a Trap (Payoff: 1.0)**
  *   **2. Ask again at every intersection.** Naive re-evaluation. At the wheel, you over-weight the probability of being at the second exit and prefer Continuing. You end up Always Continuing. **Payoff: 1.** (Naive CDT).
  *   **3. Treat the choice as evidence.** Local EDT. Choosing "Exit" signals you're likely at the first exit (payoff 0); choosing "Continue" signals you might be at the second. You choose Continue. **Payoff: 1.** (Local EDT).
  *   **6. One coin at home.** You flip once to decide the whole trip. This forces correlation: if you Continue at the first, you *must* Continue at the second. You are restricted to pure strategies. Max payoff is Always Continue. **Payoff: 1.** (Correlated Pure Strategy).
  *   **7. Maximin.** Worst case for Exit is 0; worst case for Continue is 1. You choose Continue. **Payoff: 1.** (Maximin).

  ### Equivalences and Disagreements
  **Rules 1, 4, and 5 are the same rule wearing different hats.** Rule 1 is the *commitment*, Rule 4 is the *reasoning*, and Rule 5 is the *mechanism*. They all achieve the ex-ante optimal mixed strategy ($p=2/3$).

  **The Subtle Disagreement: Rule 5 vs. Rule 6.**
  These look identical ("randomize"), but they live in different spaces. Rule 5 uses independent coins, allowing the path *Continue $\to$ Exit*. Rule 6 uses one coin, forcing the path *Continue $\to$ Continue*. Rule 5 wins because the optimal trip requires you to behave differently at the second intersection than the first, which Rule 6 forbids. Rule 6 collapses to pure strategies; Rule 5 accesses the mixed strategy optimum.

  ### Robustness Check (Pass Both = 3)
  If the payoff for sailing past is 3, the value function becomes $V(p) = 4p - p^2$. The maximum is now at $p=1$ (Always Continue).
  **What breaks:** The hierarchy collapses. Tier 2 rules (Always Continue) now yield 3, which is the new global maximum. Tier 1 rules also yield 3 (by optimizing to $p=1$). The "Trap" rules are no longer traps; they are optimal. The distinction between "smart planning" and "naive driving" vanishes because the time-inconsistency disappears when the optimal plan is deterministic.

  ### Verdict on Randomization
  Can a driver really randomize? **Only with a prop.**
  Mental randomization under imperfect recall is unstable; without a physical coin (Rule 5) or a pre-commitment device (Rule 1), your "intent" to randomize will drift toward "Always Continue" the moment you hit the wheel (Rule 2). Rule 5 is the only one that doesn't rely on willpower, but it requires you to actually carry the coin. Rule 4 is the most robust theoretically—it gets the right answer via reasoning alone—but it requires you to be the specific kind of agent (FDT) who reasons that way. If you're a standard CDT agent, you need Rule 1 + a commitment device.
