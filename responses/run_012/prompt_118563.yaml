answer: |-
  ### Final Exam Essay Question

  **Course:** Evolution and the Mind (Upper-Level Seminar)
  **Time:** 90 Minutes
  **Word Limit:** 700–900 words

  **Question:**

  Daniel Dennett proposes the concept of a **Free-Floating Rationale (FFR)**: a reason that explains the design of a trait or behavior, even if no agent within the system represents or comprehends that reason. Consider the following four cases:

  *   **(a)** A spider's web geometry optimizes prey capture across specific gaps. The spider computes nothing; the design comes from natural selection.
  *   **(b)** A neural network implements a policy provably optimal for its objective. The policy emerged via gradient descent; no engineer wrote or understands the specific weights.
  *   **(c)** A bird's plumage pattern is a developmental byproduct (spandrel) with no survival value, yet researchers construct a plausible adaptationist story explaining how it *could* help camouflage.
  *   **(d)** A community practices ritual hand-washing. The practice reduces disease transmission. The custom persists via cultural transmission, though current practitioners do not know the germ-theory reason; historically, one elder originally deduced the connection and instituted it.

  **Part 1:** Sort these cases. In which does a genuine Free-Floating Rationale exist, and in which is the attribution of a rationale mistaken or misleading? Defend your classification, paying specific attention to the distinction between cases (c) and (d).

  **Part 2:** Based on your sorting, evaluate the theoretical status of FFRs. Does the concept do genuine explanatory work, or is it merely the "Intentional Stance" applied to non-agents? Furthermore, is there a fact of the matter about which rationale applies to a system, or can multiple rationales fit the same behavior equally well? In your answer, address whether FFRs are grounded in **selection history** or merely **current causal role**.

  ***

  ### Model Answer (Approx. 750 words)

  A Free-Floating Rationale (FFR) exists where there is competence without comprehension. It posits that a system behaves *as if* it reasons, because an optimization process has shaped it to track reasons, regardless of whether the system itself represents them. Applying this to the four cases requires distinguishing between genuine design (selected for function) and mere appearance of design.

  Cases (a) and (b) are paradigmatic examples of FFRs. In the spider's web, the "reason" for the geometry is prey capture efficiency. The spider does not hold this reason; natural selection does the "thinking" over generations. Similarly, the neural net's weights encode an optimal policy. The engineers did not write the policy, and the net does not represent it propositionally, but gradient descent acted as an optimization process that "found" the reason. In both, the rationale explains the structure because a blind process selected for that specific function.

  Case (c) must be rejected. Here, the plumage is a byproduct. While an adaptationist can construct a tidy story (a "just-so story"), there is no FFR because there was no selection *for* that function. The trait does not exist *because* it aids camouflage; it exists due to developmental constraints. Attributing an FFR here is not explaining the trait's existence, but merely describing a coincidental fit. This highlights the critical boundary: an FFR requires a causal link between the function and the trait's proliferation.

  Case (d) is the boundary test. Current practitioners lack comprehension, suggesting an FFR. However, an elder originally deduced the reason. Does the existence of an original reasoner negate the "free-floating" status? For the *community*, the rationale is free-floating; they maintain the custom without understanding the germ theory. The cultural transmission acts as a selection mechanism preserving the practice *because* it works (even if the participants don't know why). Thus, (d) counts as an FFR for the current system, provided the custom's persistence is due to its efficacy (cultural selection) rather than mere blind obedience to authority. If it persists solely because "Grandma said so," the rationale is historical, not floating. Assuming the practice is maintained by its benefits (e.g., healthier communities out-compete others), the rationale floats free of the current agents' minds.

  This sorting clarifies the theoretical status of FFRs. They are not merely the Intentional Stance. The Intentional Stance is a heuristic predictive tool: we treat a system as rational to guess its output. FFR is an ontological claim about *why* the system has that capacity. We can take the Intentional Stance toward a rock (predicting it will fall), but there is no FFR for its falling. FFRs require an actual history of optimization. Therefore, the concept does real explanatory work: it points to the specific selection pressure that shaped the competence.

  This leads to the question of whether there is a fact of the matter about which rationale applies. If FFRs were merely about current causal role (what the trait does *now*), multiple rationales could fit. For example, the web (case a) catches prey, but also collects dew. Is the FFR hydration or nutrition? If we look only at current utility, both fit. However, if FFRs are grounded in **selection history**, there is a fact of the matter. The web exists *because* it caught prey in the past, not because it collected dew. The history fixes the identity of the rationale.

  Consequently, the FFR concept collapses if detached from selection history. If we define FFR solely by current utility, case (c) (the plumage) would incorrectly qualify, as it currently *could* provide camouflage. To avoid adaptationist panpsychism—where every beneficial side-effect becomes a "reason"—we must anchor FFRs in the etiology of the trait. The rationale is free-floating not because it lacks a cause, but because the cause (selection) is distinct from the current agent's cognition.

  In conclusion, FFRs are real explanatory tools distinct from the Intentional Stance because they reference actual optimization histories. Cases (a), (b), and (d) possess them because they result from processes (biological, computational, cultural) that select for specific functions. Case (c) lacks one because the function did not drive the trait's existence. There is a fact of the matter about which rationale applies, determined by the specific selection pressure that fixed the trait, not merely by the benefits it currently confers.

  ***

  ### Marking Scheme (Out of 20)

  **Part 1: Case Sorting & Defense (8 Points)**
  *   **A Grade (7-8):** Correctly identifies (a) and (b) as FFR. Crucially distinguishes (c) as *not* FFR (no selection link). Nuanced handling of (d): acknowledges it *is* FFR for current agents but notes the dependency on cultural selection/history to distinguish from blind habit.
  *   **B Grade (5-6):** Identifies (a) and (b) correctly. Treats (c) as FFR (falls for the just-so story) OR dismisses (d) entirely because an original reasoner existed (misses the cultural transmission angle).
  *   **C Grade (0-4):** Random sorting or fails to justify using "competence without comprehension."

  **Part 2: Theoretical Status (6 Points)**
  *   **A Grade (5-6):** Clearly distinguishes FFR (ontological/etiological) from Intentional Stance (heuristic/predictive). Explicitly argues FFR requires **selection history**, not just current causal role.
  *   **B Grade (3-4):** Conflates FFR with Intentional Stance (treats them as synonyms). Argues FFR is based on current utility only (risking inclusion of case c).
  *   **C Grade (0-2):** Vague philosophical musing without referencing the prompt's specific theoretical dichotomy.

  **Part 3: Fact of the Matter (6 Points)**
  *   **A Grade (5-6):** Argues there *is* a fact of the matter, grounded in the specific selection history (e.g., prey vs. dew). Explains why multiple current rationales don't imply multiple FFRs.
  *   **B Grade (3-4):** Claims there is no fact of the matter (instrumentalism) OR claims there is one but fails to explain how to distinguish competing current utilities.
  *   **C Grade (0-2):** Ignores the "fact of the matter" prompt component.

  **Specific Differentiators & Common Errors**

  | Must-Hit Point | A-Grade Move | B-Grade Move | Common Student Error |
  | :--- | :--- | :--- | :--- |
  | **(i) Cases (c) vs (d)** | (c) is rejected (no selection); (d) is accepted (cultural selection maintains function without current comprehension). | Accepts (c) as FFR because it *looks* functional; Rejects (d) because a human originally thought of it. | Thinking FFR applies to any beneficial trait (c) or requiring a *never* having been reasoned (d). |
  | **(ii) History vs. Role** | Anchors FFR in **selection history** to fix the identity of the rationale. | Anchors FFR in **current causal role** (what it does now). | Assuming "Free-Floating" means "unconnected to history" rather than "unconnected to current mind." |

  **One-Line Notes on Common Errors:**
  *   **On (c):** Students often think "If it works, it's an FFR," missing that FFR explains *origin*, not just *utility*.
  *   **On (d):** Students often think "If a human thought of it once, it's not free-floating," missing that the *community* now lacks the reason.
  *   **On History/Role:** Students frequently define FFR by current benefit, which makes it impossible to distinguish from accidental byproducts.
  *   **On Intentional Stance:** Students often claim FFR *is* the Intentional Stance, missing Dennett's distinction between a predictive tool and an evolutionary explanation.
