answer: |-
  The central question driving this thesis is whether the biostatistical theory of disease can accommodate disorders of evolutionarily novel capacities without collapsing into normativism, and the project will argue that it can, provided the theory is modified to distinguish between selected functions and derived functions. The biostatistical theory defines health as species-typical functional organization and disease as a deviation from that design, grounding medical objectivity in evolutionary history. However, this reliance on selection history creates a paradox when confronted with conditions like dyslexia or dyscalculia. Reading and arithmetic are cultural inventions too recent to have shaped dedicated neural mechanisms through natural selection. On a strict reading of the biostatistical account, there is no species-typical design for reading, so an inability to read cannot be a dysfunction in the biological sense, yet these conditions are paradigmatically treated as medical disorders. This tension threatens to render naturalism obsolete for modern medicine, forcing a choice between abandoning the biological grounding of disease or denying the medical status of common modern ailments. The thesis will defend the position that the naturalist can retain the biological grounding by distinguishing a mechanism's failure to perform the function it was selected for from a capacity's failure to perform a culturally supplied function that it is biologically underwritten to serve. This distinction preserves the objective basis of dysfunction while acknowledging the role of culture in specifying the functional output, thereby saving naturalism from the charge of incompatibility with modern clinical practice.

  Existing positions leave this question open because they either ignore the evolutionary constraint or fail to explain how novel functions attach to biological machinery. The standard biostatistical view struggles to categorize novel capacity disorders because it lacks a mechanism for assigning function to traits without selection history. Conversely, normativist accounts resolve the issue by defining disease entirely through social values, but this sacrifices the objective distinction between disease and social deviance that motivates naturalism in the first place. The harmful dysfunction analysis attempts to bridge this gap by requiring both a biological failure and a negative value judgment, but it remains vulnerable to the same evolutionary objection as the biostatistical theory because it still requires a selected function to identify the dysfunction. If there is no selected function for reading, there is no dysfunction to be harmed, leaving the harmful dysfunction analysis unable to categorize dyslexia as a disorder without smuggling in normative assumptions about what the brain ought to do. These positions treat the problem as a binary choice between strict evolutionary history and social valuation, overlooking the possibility that biological mechanisms can have derived functions based on their plasticity and structural capacity to support novel tasks. By failing to articulate how a selected mechanism can underwrite a novel function, current literature leaves open the possibility that naturalism is simply incompatible with modern psychiatry and neurology, a conclusion this thesis will challenge.

  The method for this project is conceptual analysis rather than empirical investigation, structured over a fourteen-week semester to ensure depth and feasibility. The first four weeks will be dedicated to reconstructing the arguments for the biostatistical theory and the specific objection raised by evolutionarily novel capacities, focusing on the logical structure of function ascriptions rather than empirical prevalence rates. Empirical work is the wrong instrument here because the dispute is not about whether dyslexia exists or how common it is, but about whether the concept of dysfunction can coherently apply to it given the constraints of evolutionary theory. Weeks five through eight will involve constructing the positive argument for the distinction between selected and derived functions, detailing how biological underwriting operates without relying on selection history for the specific capacity. This will require analyzing cases of neural plasticity and general-purpose cognitive mechanisms to show how they can be said to serve a function even if that function was not the target of selection. Weeks nine through twelve will be devoted to anticipating and refuting objections, particularly the charge that biological underwriting is merely a disguised value judgment, ensuring the distinction remains robust against normativist critiques. The final two weeks will focus on synthesizing the argument into a final draft, ensuring the modification to the biostatistical theory is clearly delineated and its implications for the naturalism-normativism dispute are explicitly stated. This timeline prioritizes argumentative rigor over breadth, acknowledging that a single semester allows for the defense of one specific modification rather than a comprehensive theory of disease.

  The available conclusions range from the rejection of naturalism for novel capacities to the successful modification of the biostatistical theory, and the considerations deciding between them hinge on the coherence of biological underwriting. If the analysis shows that linking a novel capacity to a biological mechanism inevitably requires a value judgment about which mechanisms should serve which cultural ends, then the project will conclude that naturalism cannot accommodate these cases without renegotiating its core commitment to value-free science. However, the thesis will argue that if the link can be established through facts about neural plasticity and structural capacity alone, then naturalism survives by expanding its notion of function to include derived functions. The deciding consideration will be whether the capacity to read can be shown to rely on mechanisms selected for visual processing and language acquisition in a way that makes the failure internal to the organism rather than a mismatch between the organism and the environment. If the failure is internal, it remains a dysfunction; if it is merely a mismatch, it falls outside the scope of disease. The argument will proceed on the basis that the failure is internal because the mechanisms required to support reading are present and species-typical, but their coordination is impaired, thus satisfying the requirement for an internal state departing from species-typical organization even if the specific organization was not selected for.

  An honest account of failure conditions must acknowledge that the project fails if the distinction between selected and derived functions cannot be drawn without circularity or hidden normative premises. If the definition of biological underwriting turns out to depend on what we value the brain doing rather than what the brain is physically capable of doing, then the proposed solution collapses into the normativism it seeks to avoid. Furthermore, the project would fail if the modification required to save the theory makes it so permissive that it counts any unwanted inability as a disease, thereby losing the critical power of the biostatistical account. Realistically, a single semester allows for the articulation and defense of this distinction against standard objections, but it does not allow for a complete resolution of the naturalism-normativism dispute across all areas of medicine. The accomplishment will be a worked-out account of how novel capacity disorders fit into a naturalist framework, demonstrating that the biostatistical theory is flexible enough to handle modern conditions without abandoning its evolutionary foundations. This limited scope ensures that the thesis provides a determinate answer to the specific question of novel capacities, contributing a precise argument to the broader debate rather than attempting to settle the entire philosophy of medicine in one term. The goal is to show that the terms of the dispute need not be renegotiated to the detriment of naturalism, but rather refined to acknowledge the complexity of human functional organization in a cultural environment.
