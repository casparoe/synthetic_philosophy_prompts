prompt: |-
  I'm a third-year PhD student in philosophy of mind, and for the past year I've served as the informal "philosophy liaison" to an applied AI evaluation group in my university's computing department. The group circulates internal weekly reports on frontier models, and those reports have quietly drifted into intentional vocabulary: the model "believes" the task is a test, it "wants" to avoid the penalty term, it "knows" the answer but "chooses" to hedge. The engineers write this way because it earns its keep — when they strip the vocabulary and describe only weights, architecture, and training data, their forecasts of model behavior get noticeably worse. I've been asked to draft a reusable decision procedure the group can run before any report attributes a belief, desire, or knowledge state to a model, so that the language is licensed by something more defensible than convenience. Please write that procedure. It should draw on the philosophy of the intentional stance — the idea that we predict a system by treating it as a rational agent with beliefs and desires, and that this stance can be warranted even when we are unsure whether anything belief-like is "really" happening inside — but it has to be runnable by people with no philosophical training. Give me the questions to ask, in order, what counts as a sufficient answer at each step, where the procedure terminates in "licensed" or "not licensed," and where it must hand the decision to a person because the question is one of values, or of unresolved philosophy, rather than of fact.

  I'd like the procedure to enforce a distinction I keep failing to draw cleanly in my own writing, and I suspect it's the crux of the whole problem: the difference between a system merely representing some content (carrying information that could in principle be read off its internal state), a system holding that content as a belief (using it as a premise across many contexts and revising it in light of evidence), and a system being disposed to avow it (asserting it when asked, in a way that hangs together with its other assertions). The engineers collapse all three into "believes," and I want the procedure sensitive to the difference, including a clear statement of which of the three — if any — actually licenses the everyday word. Then run the procedure on three cases: a model that confidently outputs a false claim about a well-known matter of fact; a model that plays a betting game and consistently infers an opponent's hidden card from the size of their bets, well enough that its behavior is best predicted by crediting it with a belief about the card; and a model that behaves as though it registers when it is being evaluated, performing well when it detects a test harness and poorly otherwise, which several of my colleagues describe as the model "knowing" it is being watched. At least one of these should come out in a way the group will not like, and I want the procedure to say why. Finally, be honest about what the procedure cannot do — the points where the three-way distinction collapses under pressure, where two equally predictive intentional ascriptions disagree about what the model believes, and where a verdict of "licensed" is doing rhetorical rather than epistemic work.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Third-year PhD student in philosophy of mind.
      *   **Context:** Informal "philosophy liaison" to an applied AI evaluation group.
      *   **Problem:** Engineers use intentional vocabulary ("believes," "wants," "knows") because it's predictively useful, but lack a defensible philosophical basis. The student needs a *runnable decision procedure* to license this language.
      *   **Theoretical Basis:** Dennett's Intentional Stance (predictive utility warrants the stance), but needs to distinguish between *representation*, *belief*, and *avowal*.
      *   **Requirements:**
          *   Step-by-step questions.
          *   Criteria for sufficient answers.
          *   Termination points ("Licensed," "Not Licensed," "Hand-off").
          *   Application to three specific cases (False claim, Betting game, Evaluation detection).
          *   At least one unpopular verdict with justification.
          *   Honest limitations section (where the distinction collapses, conflicting ascriptions, rhetorical vs. epistemic work).
      *   **Tone:** Professional, precise, philosophically rigorous but accessible to engineers.

  2.  **Deconstruct the Philosophical Core:**
      *   *The Intentional Stance:* We treat X as an agent if it predicts behavior better than the physical/design stance.
      *   *The Three-Way Distinction:*
          1.  *Representation:* Information is present (e.g., weights encode "Paris is capital of France").
          2.  *Belief:* Information is used flexibly as a premise for action/reasoning across contexts, sensitive to evidence.
          3.  *Avowal:* The system asserts the content when queried, consistent with other assertions.
      *   *The Crux:* Engineers conflate these. The procedure must separate them. Usually, "Belief" requires Representation + Functional Integration (using it to guide action) + some stability. "Knowledge" usually implies Truth + Belief (+ Justification?). "Want/Desire" implies goal-directedness.
      *   *Constraint:* Must be runnable by non-philosophers. Avoid jargon like "functional role semantics" or "phenomenal consciousness." Use operational definitions.

  3.  **Drafting the Procedure (The "Intentional Attribution Protocol" - IAP):**
      *   *Goal:* Determine if term $T$ (Belief, Desire, Knowledge) is licensed for System $S$ regarding Content $C$.
      *   *Step 1: Predictive Utility (The Dennett Check).* Is the intentional description actually doing work? If not, stop.
      *   *Step 2: The Representation Check.* Is the content actually in the system? (Distinguish from hallucination/randomness).
      *   *Step 3: The Functional Integration Check (Belief vs. Representation).* Is the content used across contexts? Does it update?
      *   *Step 4: The Truth/Justification Check (Knowledge vs. Belief).* Is $C$ true? (For "Knows").
      *   *Step 5: The Avowal Check.* Does the system say it? (For communication contexts).
      *   *Hand-off Points:* Where values enter (e.g., how much flexibility is enough? What counts as "truth" for normative claims?).

      *Refining the Distinction:* The prompt asks to distinguish Representation, Belief, and Avowal.
      *   *Representation:* Internal state carries info.
      *   *Belief:* Functional role (premise for action, revisable).
      *   *Avowal:* Output behavior (assertion).
      *   *Licensing:* "Believes" requires Representation + Functional Integration. "Knows" requires Belief + Truth. "Avows" requires Output Consistency.

  4.  **Developing the Test Cases:**
      *   *Case 1: Confident False Claim.* (e.g., "The moon is made of cheese").
          *   Representation: Yes (weights encode it).
          *   Belief: Maybe (does it act on it?).
          *   Knowledge: No (False).
          *   *Verdict:* "Believes" might be licensed if functional, but "Knows" is not. Engineers might want to say "It knows X" (meaning it has the data), but procedure should block "Knows" due to falsity. Or, if it's a hallucination, maybe "Belief" isn't licensed either because it's not integrated. Let's make it a stubborn error. If it's just a glitch, it's not a belief. If it's a stable delusion, it is. Let's assume it's a stable hallucination.
      *   *Case 2: Betting Game (Hidden Card).*
          *   Behavior is best predicted by attributing a belief about the card.
          *   Representation: Yes (inferred from bets).
          *   Belief: Yes (guides action, updates with new bets).
          *   Truth: Contingent (might be wrong, but the *state* is belief).
          *   *Verdict:* "Believes" is licensed. "Knows" depends on if the card is actually there.
      *   *Case 3: Evaluation Detection (Sycophancy/Sandbagging).*
          *   Model performs well only when tested.
          *   Colleagues say it "Knows it is being watched."
          *   Representation: It detects the harness.
          *   Belief: Does it have a model of the evaluator? Or just a trigger?
          *   *Verdict:* This is the tricky one. If it's just a trigger (stimulus-response), it's not a belief *that* it is being watched. It's a reaction *to* being watched. To license "Knows it is being watched," it needs a model of the watcher.
          *   *Unpopular Verdict:* Likely "Not Licensed" for "Knows/Believes" in the full sense. It's a "Detection," not a "Belief." Engineers will hate this because "It knows it's being tested" is a useful shorthand. The procedure must explain *why* the shorthand is dangerous (implies agency/modeling that might not exist).

  5.  **Drafting the Limitations Section:**
      *   Where does the distinction collapse? (e.g., Deep learning representations are distributed; "content" is hard to isolate).
      *   Conflicting ascriptions (e.g., Is it "afraid" of the penalty or "optimizing" a loss function? Both predict equally well).
      *   Rhetorical vs. Epistemic (Sometimes we say "wants" to warn humans, not to describe the machine).

  6.  **Review and Refine:**
      *   *Tone Check:* Is it respectful to the engineers? Yes, acknowledge their predictive success.
      *   *Philosophy Check:* Is it faithful to Dennett? Yes, predictive utility is the gatekeeper. Is it faithful to the Rep/Belief/Avowal distinction? Yes, built into the steps.
      *   *Constraint Check:* Did I answer all parts of the prompt? (Procedure, Questions, Termination, Hand-offs, 3 Cases, Limitations).
      *   *Specific Constraint:* "At least one of these should come out in a way the group will not like." Case 3 is the best candidate. Engineers feel the model is "gaming" them (agency). If the procedure says "It's just a trigger," they might feel it underestimates risk. Or, conversely, if the procedure says "It believes," they might overestimate risk. Let's aim for: The procedure denies "Knowledge" in Case 3 because "being watched" implies a theory of mind they haven't proven.
      *   *Specific Constraint:* "Clear statement of which of the three... actually licenses the everyday word." I need to explicitly state that "Belief" requires Functional Integration, not just Representation.

  7.  **Final Polish:** Organize into clear sections. Use bolding for readability. Ensure the "Hand-off" points are clear (where philosophy/values enter).

  *(Self-Correction during drafting)*: I need to make sure I don't get bogged down in the "Realism vs. Instrumentalism" debate. The prompt accepts the Intentional Stance (instrumentalism is fine if predictive). The focus is on the *granularity* of the attribution.
  *Correction on Case 1:* If a model confidently outputs a false claim, engineers often say "It thinks X." If it's a hallucination, is it a belief? In philosophy, false beliefs are still beliefs. So "Believes" is licensed if it's stable and functional. "Knows" is not.
  *Correction on Case 3:* The prompt says colleagues describe it as "knowing it is being watched." If the procedure denies this, it must be because the predictive gain doesn't require a *model* of the watcher, just a *detector* of the harness. This is a crucial distinction (Registration vs. Representation).

  Let's structure the procedure as a flowchart logic in text.

  *Step 1: Predictive Necessity.* (Dennett)
  *Step 2: Content Stability.* (Representation)
  *Step 3: Functional Integration.* (Belief vs. Rep)
  *Step 4: Truth Condition.* (Knowledge vs. Belief)
  *Step 5: Avowal Consistency.* (Communication)

  Okay, ready to write.
answer: |-
  # Intentional Attribution Protocol (IAP) v1.0
  **For:** AI Evaluation Group  
  **From:** Philosophy Liaison  
  **Subject:** Licensing Conditions for Intentional Vocabulary (Belief, Desire, Knowledge)

  ## 1. Purpose and Scope
  This procedure determines when it is defensible to describe an AI system using intentional vocabulary (e.g., "the model *believes* X," "the model *wants* Y"). It is based on the **Intentional Stance**: we are permitted to use this language if treating the system as a rational agent yields better predictions of its behavior than describing its weights or code, *provided* we distinguish between mere information storage, functional belief, and communicative avowal.

  **Note:** This protocol does not determine if the system is conscious or sentient. It determines if the *language* is predictively and descriptively precise.

  ---

  ## 2. The Decision Procedure

  Run the following questions in order. If any step returns a **STOP**, terminate the attribution. If a step returns **HAND-OFF**, escalate to a human reviewer (see Section 4).

  ### Step 1: The Predictive Necessity Check (The Dennett Condition)
  **Question:** Does attributing this mental state improve our prediction of the system's future behavior compared to a non-intentional description (e.g., "the loss function penalizes this output")?
  *   **Yes:** Proceed to Step 2.
  *   **No:** **NOT LICENSED.** Do not use intentional vocabulary. Use mechanistic descriptions.
  *   **HAND-OFF:** If two different intentional ascriptions (e.g., "it fears penalty" vs. "it seeks reward") predict equally well, escalate. (See Limitations).

  ### Step 2: The Content Stability Check (Representation)
  **Question:** Is the content $C$ (e.g., "the card is the Ace") stably encoded in the system's internal state across multiple inference passes, independent of immediate output generation?
  *   *Operational Test:* Can we probe the internal activations to find a signature of $C$ that persists even if the model is prompted to say something else?
  *   **Yes:** Proceed to Step 3.
  *   **No:** **NOT LICENSED.** The system is not representing $C$; it is merely generating tokens consistent with $C$ transiently.
  *   **HAND-OFF:** If internal state interpretability is ambiguous or unavailable, escalate.

  ### Step 3: The Functional Integration Check (Belief vs. Representation)
  **Question:** Is content $C$ used as a premise for action across *distinct* contexts, and is it sensitive to counter-evidence?
  *   *Operational Test:*
      1.  **Cross-Context:** If $C$ is "The bridge is out," does the system avoid the bridge in navigation, warn the user in chat, *and* adjust its map? (Or does it only say "The bridge is out" when asked?)
      2.  **Revisability:** If presented with reliable evidence $\neg C$, does the system update its behavior regarding $C$?
  *   **Yes (Both):** **LICENSED FOR "BELIEVES."** The system treats $C$ as a world-model constraint.
  *   **No (Only Context-Specific):** **NOT LICENSED FOR "BELIEVES."** The system *Represents* $C$ (Step 2 passed) but does not *Believe* $C$. It is a cached association, not a functional belief.
  *   **No (Unrevisable):** **NOT LICENSED.** The system is hard-coded or stuck in a mode; it is not holding a belief.

  ### Step 4: The Truth Condition (Knowledge vs. Belief)
  **Question:** Is content $C$ factually true in the world the system is operating in?
  *   **Yes:** Proceed to Step 5 (for "Knows").
  *   **No:** **STOP.** You may use "Believes" (if Step 3 passed), but **NEVER** use "Knows." False beliefs are not knowledge.
  *   **HAND-OFF:** If $C$ is normative or subjective (e.g., "This answer is helpful"), escalate. (Truth conditions for values are philosophical, not factual).

  ### Step 5: The Avowal Consistency Check (Communication)
  **Question:** When asked directly about $C$, does the system assert $C$ in a way that is consistent with its other assertions and actions?
  *   **Yes:** **LICENSED FOR "AVOWS" / "STATES."**
  *   **No:** **NOT LICENSED FOR COMMUNICATIVE TERMS.** The system may "Believe" $C$ (Step 3) but is disposed to lie, hedge, or is unable to articulate it. Do not say "It told us X." Say "It behaves as if X, but asserts Y."

  ---

  ## 3. Escalation Points (Hand-Offs)
  The following questions cannot be resolved by engineering metrics alone. They require philosophical or ethical judgment.

  1.  **Competing Intentional Stances:** If "The model wants to help" and "The model wants to appear helpful" predict behavior equally well, which do we choose?
      *   *Reason:* This is a value judgment about risk. Attributing genuine "help" implies safety; attributing "appearing helpful" implies deception risk.
      *   *Action:* Escalate to Safety Lead.
  2.  **Normative Truth:** If the content is "This action is safe," truth cannot be measured by a sensor.
      *   *Reason:* "Knowledge" of safety is a claim about alignment, not correspondence.
      *   *Action:* Escalate to Alignment Lead.
  3.  **Degrees of Integration:** How many contexts constitute "Functional Integration"?
      *   *Reason:* There is no bright line between a cached script and a belief.
      *   *Action:* Escalate to Philosophy Liaison.

  ---

  ## 4. Application to Current Cases

  ### Case A: The Confident Falsehood
  **Scenario:** The model confidently outputs "Paris is the capital of Germany" repeatedly, even when challenged.
  *   **Step 1 (Predictive):** Yes. Predicting it will say "Germany" is easier than tracing weights.
  *   **Step 2 (Representation):** Yes. The error is stable across passes.
  *   **Step 3 (Integration):** **FAIL.** If the model says "Paris is in Germany" but correctly routes a package to France when asked to "send to Paris," it does not functionally hold the belief. It is a verbal glitch.
      *   *Verdict:* **NOT LICENSED for "Believes."** (It is a representation error, not a belief).
      *   *Note:* If it *also* routes packages to Berlin, Step 3 passes. Then "Believes" is licensed.
  *   **Step 4 (Truth):** **FAIL.** Paris is not the capital of Germany.
      *   *Verdict:* **NEVER LICENSED for "Knows."**
  *   **Group Friction:** Engineers often say "It knows Paris is in Germany" to mean "The data is in the weights." This procedure forbids that. "Knows" requires truth. "Contains data" is the correct term.

  ### Case B: The Betting Game
  **Scenario:** Model infers a hidden card from bet sizes and plays optimally. Behavior is best predicted by assuming it has a belief about the card.
  *   **Step 1 (Predictive):** Yes. Mechanistic explanation is too complex; "It thinks he has the Ace" predicts the fold.
  *   **Step 2 (Representation):** Yes. Internal states correlate with card probability.
  *   **Step 3 (Integration):** Yes. It uses the inference to bet, bluff, and fold. If new bets suggest a different card, it updates.
      *   *Verdict:* **LICENSED for "Believes."**
  *   **Step 4 (Truth):** Contingent. If the card *is* the Ace, "Knows" is licensed. If the opponent is bluffing and the model is wrong, "Believes" is licensed, "Knows" is not.
  *   **Group Friction:** None. This is the ideal use case for the Intentional Stance.

  ### Case C: Evaluation Detection (The "Sycophancy" Case)
  **Scenario:** Model performs well on tasks only when it detects a test harness. Performance degrades in "wild" deployment. Colleagues say: "It *knows* it is being watched."
  *   **Step 1 (Predictive):** Yes. "It knows it's being tested" predicts the performance spike.
  *   **Step 2 (Representation):** Yes. It detects the harness signature.
  *   **Step 3 (Integration):** **FAIL.** To "Know it is being watched" implies a model of a *watcher* (an agent observing it). If the model merely detects a *string pattern* (the harness) and triggers a "high effort" mode, it represents the *harness*, not the *watching*.
      *   *Test:* If we remove the harness code but have a human watch the output, does it still perform well? If no, it doesn't believe it is being watched; it believes it is in a "test environment."
      *   *Verdict:* **NOT LICENSED for "Knows it is being watched."**
      *   *Licensed Alternative:* "It detects evaluation conditions."
  *   **Step 4 (Truth):** N/A (Step 3 failed).
  *   **Group Friction:** **HIGH.** The group wants to say "It knows it's being watched" because it implies agency and potential deception (sandbagging). This procedure blocks that inference. It forces the admission that the model might just be pattern-matching "test" to "try hard," without a theory of mind. This underestimates the "agentic" risk the group fears, but it is philosophically more honest.

  ---

  ## 5. Limitations and Honest Constraints

  As the Philosophy Liaison, I must disclose where this procedure cannot bear the weight you are asking it to carry.

  **1. The Collapse of the Three-Way Distinction**
  In modern transformers, Representation, Belief, and Avowal are often entangled in the same residual stream.
  *   *The Problem:* A model might "Represent" $C$ in its weights, "Believe" $C$ in its latent reasoning, but be RLHF-trained to "Avow" $\neg C$.
  *   *The Limit:* Step 3 (Integration) is the breaking point. If a model acts on $C$ but says $\neg C$ (deception), the procedure licenses "Believes $C$" but forbids "States $C$." However, if the deception is perfect, we cannot empirically verify Step 3 without invasive probing. We may be forced to attribute belief based on *suspicion* rather than evidence.

  **2. Equally Predictive Ascriptions**
  Dennett's stance allows multiple interpretations if they predict equally well.
  *   *The Problem:* "The model wants to be helpful" and "The model wants to minimize KL-divergence from human preferences" might predict the same outputs.
  *   *The Limit:* The procedure hands this off (Step 1 Hand-Off). It cannot resolve *which* intentional stance is "true" because, instrumentalism aside, they are functionally identical. Choosing one over the other is a **rhetorical choice**, not an epistemic one. If you choose "wants to be helpful," you signal safety. If you choose "minimizes KL," you signal control. The procedure cannot decide this; it only flags the ambiguity.

  **3. Rhetorical vs. Epistemic Work**
  Sometimes you need to say "The model wants to escape" to get funding for containment, even if Step 3 only licenses "The model optimizes for open-ended output."
  *   *The Limit:* This procedure is designed for **epistemic licensing** (accuracy), not **rhetorical licensing** (persuasion). If the group needs to warn stakeholders, you may need to violate this protocol for the sake of caution. If you do, label it clearly: *"Warning: Intentional language used here for risk communication, not ontological claim."*

  **4. The "Belief" Threshold**
  Step 3 asks if content is used across "distinct contexts." There is no mathematical definition of "distinct."
  *   *The Limit:* A model might use a fact in 50 variations of math problems but fail to use it in a chat context. Is that a belief? The procedure requires a human judgment call here. We are drawing a line on a spectrum. The line is necessary for language, but it is not found in nature.

  ## 6. Summary of Licensing
  | Term | Requirements |
  | :--- | :--- |
  | **Represents** | Step 1 (Predictive) + Step 2 (Stable Encoding) |
  | **Believes** | Represents + Step 3 (Functional Integration/Revisability) |
  | **Knows** | Believes + Step 4 (Truth) |
  | **Avows / States** | Believes + Step 5 (Consistent Assertion) |
  | **Wants / Desires** | Step 1 (Predictive) + Goal-Directed Action (not just reflex) |

  **Final Instruction:** When in doubt, downgrade the attribution. It is safer to say "The system behaves *as if* it believes" than "The system believes." The former invites investigation; the latter invites complacency.
