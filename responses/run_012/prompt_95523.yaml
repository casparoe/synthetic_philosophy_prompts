prompt: |-
  I was out for a drink with a friend who's a couple of years into a PhD in philosophy, and he gave me what he called the two-minute version of the Frege–Geach problem. It's been bothering me since, because it made expressivism sound like a dead end, and I don't have the background to know whether I've been sold a line. His version goes like this. Frege spotted that you can take one and the same sentence and assert it, ask it as a question, or merely entertain it, and the content doesn't change — only the 'force' changes, and by force he meant the strength with which you put the sentence forward. Geach then turned this against the expressivist, who says that 'lying is wrong' isn't describing anything, it's just giving voice to a feeling of disapproval. Take a standard bit of reasoning: if lying is wrong, then getting your little brother to lie is wrong; lying is wrong; so getting your little brother to lie is wrong. The phrase 'lying is wrong' turns up in the first premise and again in the second, and the inference only works because it means the same thing in both places. But the first premise isn't asserted, so on the expressivist's story there's no feeling being expressed there at all — it's just an inert bit of unasserted language. So the expressivist is stuck saying the phrase does two seperate jobs in the two premises, which makes the argument a fallacy of equivocation; and since it obviously isn't an equivocation, expressivism is refuted. He added that the problem really only bites for conditionals, because negation and disjunction are easy — a negated moral sentence just expresses the opposite attitude — and that the reason nobody defends straight expressivism any more is that the only people who try to patch this up (the quasi-realists, Blackburn and Gibbard and that crowd) do it by positing a 'higher-order' attitude, an attitude to an attitude, which is really just smuggling beliefs back in under a different name.

  Can I get a proper audit from someone who actually knows this literature, rather than the seminar-room version? I'd like you to take the role of a philosopher working in metaethics and the philosophy of language, think this through carefully rather than reciting the textbook headline, and start by laying out for me what the problem really is and what the expressivist is actually committed to. Then go through his summary claim by claim and tell me what's right, what's a harmless simplification a defender wouldn't mind, and what's straightforwardly wrong or misleading. Two bits smell off to me and I can't say why: the thing about force being 'strength', and the claim that it's basically a conditionals-only problem that negation escapes. I'm definately out of my depth here, but my instinct is that nothing in philosophy gets refuted that cleanly — though that's not an argument. So: what would a careful expressivist (Blackburn, Gibbard, or one of the more technical contemporary versions) actually say in reply, does the equivocation charge land as stated or does it quietly assume what it's meant to prove, and do his conclusions — expressivism refuted, quasi-realism just disguised cognitivism — really follow from the parts of his summary that are accurate? And if the 'attitude towards an attitude' move is a real position rather than a caricature, tell me what it's actually committed to and what it costs, because I genuinely can't tell whether he was describing it or mocking it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user had a conversation with a PhD friend about the Frege-Geach problem. The friend gave a "two-minute version" that made expressivism look dead.
      *   **User's Goal:** Wants a proper audit from someone knowledgeable in metaethics/philosophy of language. Wants to know if the friend's summary is accurate, misleading, or wrong.
      *   **Specific Instructions:**
          *   Role: Philosopher working in metaethics and philosophy of language.
          *   Tone: Careful, not just reciting textbook headlines.
          *   Structure:
              1.  Lay out what the problem really is and what expressivism is committed to.
              2.  Go through the friend's summary claim-by-claim (what's right, what's harmless simplification, what's wrong/misleading).
              3.  Address the user's specific intuitions (force = strength? conditionals only?).
              4.  Explain the expressivist reply (Blackburn, Gibbard, etc.).
              5.  Evaluate the "equivocation charge."
              6.  Evaluate the conclusion (expressivism refuted? quasi-realism = disguised cognitivism?).
              7.  Explain the "attitude towards an attitude" move (what it is, what it costs).
      *   **User's Suspicion:** "Nothing in philosophy gets refuted that cleanly."

  2.  **Deconstruct the Friend's Summary (The "Two-Minute Version"):**
      *   *Claim 1:* Frege distinguished content vs. force (strength of assertion).
      *   *Claim 2:* Expressivism says "lying is wrong" expresses disapproval, not description.
      *   *Claim 3:* In modus ponens (If P then Q; P; therefore Q), P appears unasserted in the first premise.
      *   *Claim 4:* If P is unasserted, no attitude is expressed.
      *   *Claim 5:* Therefore, P means something different in premise 1 and premise 2 (equivocation).
      *   *Claim 6:* The problem is mainly about conditionals; negation/disjunction are easy (negation = opposite attitude).
      *   *Claim 7:* Quasi-realists patch this with "higher-order attitudes," which is just smuggling beliefs in (disguised cognitivism).
      *   *Claim 8:* Conclusion: Expressivism is refuted.

  3.  **Evaluate the Claims (Mental Sandbox):**
      *   *Claim 1 (Force):* Friend says force = "strength." *Correction:* Force is illocutionary type (asserting vs. questioning), not intensity. This is a technical error.
      *   *Claim 2 (Expressivism):* Roughly right, though "just giving voice to a feeling" is the crude Ayer/Stevenson version. Modern expressivism is more sophisticated (plans, norms, etc.).
      *   *Claim 3 & 4 (Unasserted Contexts):* This is the core of Frege-Geach. If meaning = use/attitude, what happens when not used to express attitude? This is the valid core of the objection.
      *   *Claim 5 (Equivocation):* This is the charge. Expressivists deny equivocation. They try to show logical validity is preserved without propositional content.
      *   *Claim 6 (Conditionals only):* *Correction:* Negation is actually hard for expressivists too ("It is not the case that lying is wrong" doesn't just mean "I approve of lying"). This is a significant error in the friend's summary.
      *   *Claim 7 (Quasi-realism/Higher-order):* Blackburn does use higher-order attitudes (H.O.A.). Is it smuggling cognitivism? That's the big debate (the "Creep" objection). It's not a settled fact that it *is* cognitivism, but it's a major criticism (e.g., from Cian Dorr, Peter Geach himself, or cognitivists like Zangwill).
      *   *Claim 8 (Refuted):* Philosophy rarely has "refutations." Expressivism is still a live position (Gibbard, Schroeder, etc.).

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the user's instinct. Philosophy doesn't do "clean refutations" like math. Set the stage: Frege-Geach is the *central* challenge, not a death blow.
      *   **Part 1: The Real Problem (Setting the Stage):**
          *   Define Expressivism (Classical vs. Contemporary). It's not just "boo/hurrah." It's about the *function* of moral language.
          *   Define Frege-Geach properly. It's about *embedding* and *logical validity*. It's not just about assertion vs. question (Frege's point), but about how meaning remains constant across asserted and unasserted contexts (Geach's point).
          *   Clarify "Force." It's not strength (volume/confidence); it's illocutionary act type.
      *   **Part 2: Auditing the Friend's Claims:**
          *   *Force = Strength:* Wrong. Technical error.
          *   *Expressivism = Feelings:* Oversimplified. Modern expressivism (Gibbard) is about norms/plans.
          *   *The Equivocation Charge:* This is the heart of the matter. The friend states it as a *conclusion*, but expressivists see it as the *challenge to meet*.
          *   *Conditionals vs. Negation:* Wrong. Negation is tricky ("not wrong" isn't just "approve"). This is the "negation problem" (Schroeder).
          *   *Quasi-realism = Disguised Cognitivism:* Contested. This is the "quasi-realism" debate. It's not a settled fact.
      *   **Part 3: The Expressivist Reply (How they actually fight back):**
          *   *Blackburn's H.O.A.:* Explain "Disapproval of disapproval." If I say "If lying is wrong...", I'm expressing a higher-order attitude about the consistency of my lower-order attitudes.
          *   *Gibbard's Norm-Expressivism:* It's about accepting norms, not just feelings. Logic works on the consistency of plans.
          *   *Mark Schroeder's Hybrid/Expressivist work:* "Being For." Logic is about incompatibility of attitudes.
      *   **Part 4: The Cost (What does this commit them to?):**
          *   Does it collapse into cognitivism? The "Creep" objection. If H.O. attitudes behave exactly like beliefs, are they beliefs?
          *   Expressivists say: No, the *nature* of the state is different (conative vs. cognitive), even if the *logic* is the same.
