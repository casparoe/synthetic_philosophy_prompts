      *   *Check:* Did I explain "Force"? *Correction:* Emphasize that Frege's point was about the *proposition* remaining constant while the *mode* changes. Expressivists struggle because they tie meaning to the mode.
      *   *Check:* Is the "smuggling beliefs" charge fair? *Correction:* Present it as the *main* objection from cognitivists (e.g., Hale, Zangwill), but note that expressivists deny it. It's a stalemate, not a refutation.
