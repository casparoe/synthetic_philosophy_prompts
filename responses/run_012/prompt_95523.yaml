answer: |-
  Your instinct is spot on: in philosophy, especially metaethics, "clean refutations" are almost always a sign that the complexity has been sanded off for the sake of a story. The Frege–Geach problem is the single most important objection to expressivism, but it is not a death blow; it is a constraint. It tells expressivists what they have to explain, not that they cannot explain it.

  Your friend has given you a "pub version" of the problem. It captures the spirit of the objection but gets several technical details wrong and presents contested interpretations as settled facts.

  As requested, I will step into the role of a metaethicist. I will break this down into: (1) what the problem actually is, (2) an audit of your friend's claims, (3) how expressivists actually reply, and (4) the cost of that reply.

  ### 1. What the Problem Actually Is

  To understand the objection, we have to distinguish between **Classical Expressivism** (Ayer, Stevenson) and **Contemporary Expressivism** (Blackburn, Gibbard, Schroeder). Your friend's summary targets the Classical version, which is indeed in trouble. The Contemporary version was built specifically to survive this.

  **The Expressivist Commitment:**
  At its core, expressivism says that moral sentences (e.g., "Lying is wrong") do not function primarily to state facts or describe the world. Instead, they express non-cognitive mental states: attitudes, emotions, plans, or norms. To say "Lying is wrong" is akin to saying "Boo lying!" or "I disapprove of lying."

  **The Frege–Geach Problem (The Embedding Problem):**
  The problem arises from the observation that moral sentences can be **embedded** in complex logical structures where they are not being used to express an attitude directly.

  Consider the *modus ponens* argument your friend used:
  1.  If lying is wrong, then getting your brother to lie is wrong.
  2.  Lying is wrong.
  3.  Therefore, getting your brother to lie is wrong.

  For this argument to be **valid**, the phrase "lying is wrong" must mean the same thing in premise (1) and premise (2).
  *   In premise (2), the expressivist says the speaker is expressing disapproval.
  *   In premise (1), the speaker is *not* asserting that lying is wrong. They are merely considering it hypothetically. Therefore, they are not expressing disapproval.

  **The Dilemma:**
  *   **Horn A:** If "lying is wrong" means "I disapprove of lying" in premise (2), but does *not* mean that in premise (1) (because no disapproval is expressed), then the argument commits the **fallacy of equivocation**. The meaning shifted. But the argument is obviously valid.
  *   **Horn B:** If "lying is wrong" means the same thing in both, then in premise (1) it must still mean "I disapprove of lying." But the speaker isn't disapproving. So the expressivist must explain what it means to express an attitude without actually expressing it.

  This is the real problem. It is about **logical validity** and **semantic consistency**, not just about assertion.

  ### 2. Auditing Your Friend's Summary

  Let's go through his claims claim-by-claim.

  **Claim 1: "Frege meant force is the strength with which you put the sentence forward."**
  *   **Verdict:** **Straightforwardly Wrong.**
  *   **Correction:** In philosophy of language, "force" (illocutionary force) does not mean intensity or confidence (strength). It means the *type* of speech act. Asserting, questioning, commanding, and hypothesizing are different forces. Frege's point was that the *content* (the proposition) stays the same whether I assert "It is raining" or ask "Is it raining?" Your friend's definition makes it sound like a psychological volume knob, which misses the logical point entirely.

  **Claim 2: "Expressivism says... it's just giving voice to a feeling of disapproval."**
  *   **Verdict:** **Harmless Simplification (mostly).**
  *   **Correction:** This is accurate for 1930s Emotivism (Ayer). It is inaccurate for modern Expressivism. Simon Blackburn (Quasi-Realism) and Allan Gibbard (Norm-Expressivism) do not think moral judgments are merely feelings. Gibbard, for instance, argues they express *acceptance of norms* or *plans*. This matters because logic applies to plans and norms differently than raw feelings. However, for the sake of the "two-minute version," this simplification is passable.

  **Claim 3: "The first premise isn't asserted, so... there's no feeling being expressed there at all."**
  *   **Verdict:** **Right (as a setup for the objection).**
  *   **Correction:** This is the correct diagnosis of the difficulty. If meaning is *exhausted* by the expression of an attitude, unasserted contexts leave the meaning empty.

  **Claim 4: "So the expressivist is stuck saying the phrase does two separate jobs... fallacy of equivocation."**
  *   **Verdict:** **Misleading.**
  *   **Correction:** This presents the *objection* as the *conclusion*. The expressivist is not "stuck saying" this; the cognitivist is *accusing* them of this. The expressivist's entire job for the last 50 years has been to deny this. They argue the meaning *is* constant, but they have to explain how an attitude can be present in the antecedent of a conditional without being "expressed" in the ordinary sense.

  **Claim 5: "The problem really only bites for conditionals, because negation and disjunction are easy."**
  *   **Verdict:** **Straightforwardly Wrong.**
  *   **Correction:** This is a major error in your friend's summary. The **Negation Problem** is arguably just as hard as the conditional problem.
      *   If "Lying is wrong" = "Boo lying!"
      *   Then "Lying is *not* wrong" should = "Not boo lying!"
      *   But "Not boo lying" could mean "I have no feeling about lying" (apathy) OR "I approve of lying" (Yay lying!).
      *   Moral negation implies a specific contrary attitude, not just the absence of the first one. Explaining how logical operators (NOT, IF, OR) work on attitudes without turning them into propositions is technically difficult. Mark Schroeder's book *Being For* is essentially a 200-page attempt to solve the negation/embedding problem for expressivists.

  **Claim 6: "Quasi-realists... patch this up by positing a 'higher-order' attitude... which is really just smuggling beliefs back in."**
  *   **Verdict:** **Contested/Debatable.**
  *   **Correction:** This is the "Creep" objection (often associated with cognitivists like John Zangwill or Bob Hale). It is not a settled fact that they *are* smuggling beliefs in; it is the central debate in contemporary metaethics. Expressivists deny this vigorously. They claim the mental state is still conative (practical), even if it has a complex logical structure.

  **Claim 7: "Expressivism is refuted."**
  *   **Verdict:** **Wrong.**
  *   **Correction:** Expressivism is a live, dominant position in metaethics. If it were refuted, departments wouldn't hire expressivists, and journals wouldn't publish papers defending it. It has been modified, sophisticated, and hybridized, but not refuted.

  ### 3. How the Expressivist Actually Replies

  So, how do Blackburn, Gibbard, or Schroeder actually handle the "equivocation" charge? They don't accept it. They argue that logical validity can be defined over attitudes, not just truth-conditions.

  **Blackburn's Higher-Order Attitude (The Quasi-Realist Move):**
  Blackburn argues that when I assert the conditional premise ("If lying is wrong, then getting your brother to lie is wrong"), I am not expressing a simple attitude. I am expressing a **higher-order attitude**.

  Specifically, I am expressing a state of mind such that: *I disapprove of anyone who disapproves of lying but does not disapprove of getting their brother to lie.*

  *   **Premise 1:** Expresses a higher-order attitude (inconsistency is bad).
  *   **Premise 2:** Expresses a first-order attitude (disapproval of lying).
  *   **Conclusion:** To hold Premise 1 and Premise 2 without holding the Conclusion is to be in a state of practical inconsistency.

  Blackburn's point is that logic isn't just about truth-preservation (cognitivism); it's about **consistency of attitudes**. If you have the attitudes expressed in the premises, rationality *requires* you to have the attitude in the conclusion. Therefore, the argument is valid, and "lying is wrong" has a stable meaning (it refers to the same type of attitude state) in both premises.

  **Gibbard's Norm-Expressivism:**
  Gibbard shifts the ground. He argues moral judgments express **acceptance of norms**. Logic works on norms just as it works on beliefs. To accept a norm is to plan to feel guilt if you violate it. The conditional "If lying is wrong..." is about the consistency of planning states.

  **Mark Schroeder's "Being For":**
  Schroeder (a contemporary heavyweight) argues that we can define logical connectives directly in terms of attitudes. To believe *P* is to be "for" *P*. To believe *If P then Q* is to be "for" *having an attitude of being for Q if one is for P*. This allows him to build a logic of attitudes that mirrors propositional logic without positing moral facts.

  ### 4. Does the "Smuggling Beliefs" Charge Land?

  This is the crux of your friend's final claim: that quasi-realism is "disguised cognitivism."

  **The Cognitivist Critique:**
  Critics argue that if a higher-order attitude behaves exactly like a belief (it can be true/false, it enters into logical inferences, it persists across unasserted contexts), then by duck test, it *is* a belief. If Blackburn's "higher-order attitude" has a "mind-to-world" direction of fit (it tries to match reality), then expressivism has collapsed into cognitivism.

  **The Expressivist Defense:**
  Expressivists reply that the **nature** of the state is different, even if the **logic** is the same.
  *   A belief aims to track the world.
  *   A plan/attitude aims to guide action.
  *   Even a complex, higher-order plan is still a plan. It is still "conative."

  They argue that your friend's claim assumes that *only* beliefs can support logic. Expressivists are trying to prove that **logic is topic-neutral**. Logic applies to beliefs, but it also applies to commands, questions, and plans. (Think of military orders: "If the enemy attacks, retreat." "The enemy is attacking." "Therefore, retreat." This is valid reasoning, but it doesn't involve moral facts or beliefs about the world in the same way).

  **The Cost:**
  What does this commit them to?
  1.  **Complexity:** They have to build a whole new semantics (theory of meaning) that isn't based on truth conditions. This is technically demanding.
  2.  **The "Creep":** They must constantly walk a tightrope. If they make the attitudes too robust to solve Frege-Geach, they look like cognitivists. If they keep them too thin, they can't explain logic.
  3.  **Hybridization:** Many modern expressivists (like Michael Ridge) admit that moral sentences *do* have a cognitive component (they describe the speaker's psychology) alongside the expressive component. This is "Ecumenical Expressivism." It concedes some ground to the friend's critique but saves the core insight.

  ### 5. Conclusion: Was Your Friend Right?

  Your friend gave you a **caricature**, not a refutation.

  *   **What he got right:** The Frege-Geach problem is the biggest hurdle for expressivism. It forces them to explain how moral language works in unasserted contexts.
  *   **What he got wrong:**
      *   Force is not "strength."
      *   Negation is not easy; it's a major technical headache.
      *   Expressivism is not dead; it has evolved into sophisticated forms (Quasi-Realism, Norm-Expressivism).
      *   The claim that quasi-realism is "just cognitivism" is a live philosophical dispute, not a settled fact.

  **The Verdict:**
  You were sold a seminar-room simplification. The Frege-Geach problem shows that *naive* expressivism (the "Boo/Hurrah" version) is untenable. But *sophisticated* expressivism survives by arguing that logic governs consistency of attitudes, not just truth of propositions.

  Whether that move succeeds is still debated. Some philosophers think Blackburn and Gibbard successfully walked the tightrope. Others (like your friend, apparently) think they fell off into cognitivism. But to say the position is "refuted" is to ignore the last 50 years of metaethical literature. In philosophy, when a position survives a "refutation" by becoming more complex and precise, we usually say the position has matured, not that it has died.

  **Recommendation:** If you want to read the "proper" version of this, look at Simon Blackburn's *Spreading the Word* (Chapter 6) for the defense, and Peter Geach's original paper "Assertion" for the attack. For the modern state of play, Mark Schroeder's *Being For* is the technical benchmark. Your friend's version is good for a pub chat, but bad for understanding the actual state of the field.
