prompt: |-
  I run a small prediction-market desk: six analysts, a bankroll that doubles as our operating budget, and between ten and forty new positions a week on questions that resolve anywhere from an hour to a year out. We size positions with a crude version of the Kelly rule plus instinct, and I have concluded that this is worse than having no rule at all. The same nominal edge has produced a four per cent stake on a by-election question and a thirty per cent stake on a central-bank question in the same afternoon, and nothing explained the difference except that the second analyst sounded more certain.

  Please write the sizing procedure we should adopt.

  It must be a procedure, not an essay: a short sequence of questions answered in order, each with a stated sufficiency condition, an explicit stopping rule that returns a stake of zero, and a terminal rule that returns a recommended stake as a fraction of the bankroll together with a one-line justification an analyst who has never heard of expected log wealth can check. Two analysts given the same inputs should arrive at the same number.

  It has to handle four things our current practice handles by shrugging.

  1. The edge is estimated, not known. Our probabilities come from a model and from an analyst's judgment, and both are wrong by amounts we could roughly bound. Say how the stake should shrink when the estimate is soft, and whether taking half of what the formula recommends is a principled correction or a superstition. Say also whether the fact that someone is willing to take the other side of our bet should count as evidence against our estimate.

  2. Positions are not independent. On election night we may hold eight questions that all resolve the same way. Say what the procedure does about that, and whether the right response is to shrink each stake or to size the group as a single bet.

  3. Most of our questions are one-offs; we will never get to run the same bet a hundred times. One colleague argues that this guts the whole apparatus, because the case for maximizing the expected log of the bankroll rests on the same multiplicative process running long enough for the typical outcome to pull away from the average, and a single bet has no typical outcome, only the one we get. Another colleague says this is a distinction without a difference. The procedure has to come down somewhere: say what it is entitled to assume, what it should do when the assumption fails, and what about our situation would settle the question.

  4. Our bankroll is also our operating budget, and losing most of it means losing the sponsor and shutting down. Ruin, then, is not a point at the far end of a curve but a cliff at a known height. Say where the procedure gets that height, and what it does differently as the stake approaches it.

  The objective must be stated rather than assumed. Say plainly which quantity the procedure maximizes — expected bankroll, expected log bankroll, or the growth rate of the bankroll along the sequence we actually live through — and whether that choice is a fact about our situation or a decision about what we want. If it is a decision, mark it as one and hand it to me instead of burying it inside a formula.

  Then run the finished procedure on three cases and show the arithmetic: a liquid market where our model says 0.55 and the market says 0.50, repeated dozens of times a month; a single question resolving after the season where we say 0.65 against a market of 0.50 and where the stake the formula wants would put us near the cliff; and a cluster of six questions that are not independent. At least one of the three must come out with a recommendation I will not like, and you should say so rather than softening it.

  Close with a short, unhedged account of what the procedure cannot do, where an analyst will be tempted to use it in place of judgment, and which of its steps are arithmetic wearing the costume of principle — so that we can cut the decoration instead of letting it lend false authority to the rest. The analyst running it has no measure theory, and the whole thing must be runnable in twenty minutes with numbers we can plausibly estimate. Say what to do when the analyst has only a range, or nothing.
reasoning: |-
  Here's a thinking process that leads to the suggested sizing procedure:

  1.  **Analyze the Request:**
      *   **User:** Runs a small prediction-market desk (6 analysts, bankroll = operating budget, 10-40 positions/week, mixed time horizons).
      *   **Problem:** Current sizing (crude Kelly + instinct) is inconsistent (4% vs 30% on similar edges based on "certainty").
      *   **Requirement:** A *procedure*, not an essay. Short sequence of questions, sufficiency conditions, explicit stopping rules (stake = 0), terminal rule (stake fraction + 1-line justification).
      *   **Constraints:**
          *   Deterministic (two analysts = same number).
          *   Handle 4 specific issues: Estimated edge (uncertainty), Correlation (non-independence), Single-shot vs. Repeated (ergodicity), Ruin/Drawdown (bankroll = budget).
          *   State the objective function explicitly (maximize what?).
          *   Run 3 specific test cases (Liquid/Repeated, Single/High-Risk, Cluster/Correlated). One must yield an unpalatable result.
          *   Closing section: Limitations, temptations, "arithmetic wearing costume."
          *   Accessibility: No measure theory, runnable in 20 mins, handle ranges/missing data.

  2.  **Determine the Objective Function:**
      *   The user asks to choose between Expected Bankroll (Max EV), Expected Log Bankroll (Max Kelly), or Growth Rate along the actual sequence.
      *   *Constraint:* Bankroll = Operating Budget. Ruin = Shutdown.
      *   *Analysis:* Max EV leads to ruin eventually (bet everything on positive EV). Max Kelly assumes infinite repetition and ignores "ruin cliff."
      *   *Decision:* The objective must be **Maximize Expected Log Bankroll subject to a Survival Constraint.** This is effectively "Fractional Kelly" but derived from the ruin constraint rather than arbitrary halving.
      *   *Why:* It balances growth with the hard constraint of not losing the budget. It acknowledges the "single shot" concern by treating the *portfolio* as the repeated entity, but dampens aggression when the "single shot" risks the cliff.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Define Inputs.* Need $p$ (our prob), $q$ (market prob/implied prob), $B$ (bankroll), $L$ (ruin limit).
      *   *Step 2: Handle Edge Uncertainty.* The prompt asks about "half-Kelly" and counterparty risk.
          *   *Solution:* Discount the edge. If the counterparty is willing to take the other side, assume their information offsets some of ours. Use a "Confidence Factor" ($C$) between 0 and 1.
          *   *Rule:* $p_{effective} = p - (1-C) \times (p - q)$. Or simpler: Apply $C$ to the Kelly fraction directly. Let's go with discounting the *edge* to handle the "soft estimate" requirement.
      *   *Step 3: Handle Correlation.* The prompt asks about clustering (election night).
          *   *Solution:* Group correlated bets. Size the *cluster* as one bet, then allocate within the cluster.
      *   *Step 4: Handle Ruin/Budget.* The prompt specifies the "cliff."
          *   *Solution:* Define a "Survival Floor" ($F$). If stake risks breaching $F$, cap the stake.
      *   *Step 5: Handle Single-Shot vs. Repeated.*
          *   *Solution:* Acknowledge that for single shots, Log Utility is a *preference*, not a law. But for a *desk* running 10-40 bets/week, the *desk* is the repeated player, even if individual bets aren't.
      *   *Step 6: The Calculation.*
          *   Standard Kelly: $f^* = \frac{p(b+1) - 1}{b}$. For binary markets priced at $q$, odds are $(1-q)/q$. Edge is $p-q$.
          *   Simplified Kelly for binary markets: $f = \frac{p - q}{1 - q}$.
          *   Adjustments: Apply Confidence ($C$), Apply Correlation Grouping, Apply Ruin Cap.

      *   *Refining the "Procedure" Format:* Needs to be a flowchart of questions.
      *   *Refining the "One-Line Justification":* Must be checkable without log theory. "This stake limits loss to X% of budget if wrong."

  4.  **Addressing the Four Specific Challenges in the Steps:**
      1.  *Edge Estimation:* Introduce a "Confidence Score" (1-5 scale mapped to 0.5-1.0 multiplier). Address counterparty: If market is liquid, confidence drops.
      2.  *Correlation:* Step 0 must be "Grouping."
      3.  *Single vs. Repeated:* Explicitly state the objective assumes the *Desk* is the repeated player. If a bet is truly one-off and huge, the Ruin Cap handles it.
      4.  *Ruin/Budget:* Define "Maximum Tolerable Drawdown" (MTD).

  5.  **Developing the Test Cases:**
      *   *Case 1 (Liquid/Repeated):* $p=0.55, q=0.50$. High confidence. Should look like standard Kelly.
      *   *Case 2 (Single/High Risk):* $p=0.65, q=0.50$. Stake near cliff. The procedure *must* cap it. This will be the "unpalatable" result (leaving money on the table).
      *   *Case 3 (Cluster):* 6 questions, correlated. Need to show the grouping logic reducing total exposure.

  6.  **Drafting the Content (incorporating constraints):**
      *   *Tone:* Direct, procedural, authoritative but humble about limits.
      *   *Math:* Keep it simple. $(p-q)/(1-q)$ is the standard binary Kelly.
      *   *Objective:* Maximize geometric growth rate of the *desk* over 12 months, subject to survival.

  7.  **Review against Constraints:**
      *   *Sequence of questions?* Yes.
      *   *Stopping rule?* Yes (if edge < 0 or confidence too low).
      *   *Terminal rule?* Yes (Stake % + justification).
      *   *Deterministic?* Yes, if inputs are fixed.
      *   *4 Challenges addressed?* Yes, embedded in steps.
      *   *3 Test Cases?* Yes.
      *   *Unpalatable result?* Yes, in Case 2.
      *   *Closing section?* Yes (Limitations/Costumes).
      *   *20 mins/No measure theory?* Yes.

  8.  **Refining the "Confidence" and "Counterparty" logic:**
      *   Prompt asks: "whether taking half... is principled or superstition."
      *   Answer: It's principled *if* it accounts for parameter uncertainty. I will encode this as a "Uncertainty Discount."
      *   Prompt asks: "willing to take other side... evidence against."
      *   Answer: Yes. Liquid markets imply informed counterparties. I will reduce confidence based on liquidity.

  9.  **Refining the "Ruin" logic:**
      *   Prompt: "Ruin... is a cliff at a known height."
      *   I need to set a hard limit. Say, 50% drawdown triggers shutdown. So max loss on any *cluster* cannot exceed 20% (to allow for multiple clusters).
      *   Actually, simpler: Define "Max Risk per Cluster."

  10. **Final Polish of the Procedure:**
      *   Make sure the "One-Line Justification" is truly simple.
      *   Ensure the "Objective" is stated up front.
      *   Check the arithmetic in the examples.
      *   *Self-Correction on Case 2:* The prompt says "stake the formula wants would put us near the cliff." I need to ensure the procedure *cuts* this stake, and that the recommendation is "Bet less than you want," which analysts hate.

  11. **Final Review of the "Closing Section":**
      *   Must be unhedged.
      *   Must identify "arithmetic wearing costume." (Likely the Confidence Score mapping).

  12. **Constructing the Output:** (Drafting mentally then writing).
      *   *Objective:* Maximize geometric growth of the desk's bankroll over a 12-month horizon, subject to a hard constraint that the bankroll never falls below 50% of its starting value.
      *   *Steps:* Group -> Estimate -> Discount -> Calculate -> Cap.
      *   *Examples:* Do the math carefully.
      *   *Closing:* Be honest about the subjectivity of the confidence score.

  *(Self-Correction during drafting)*: The prompt asks for "a short sequence of questions answered in order." I should format it exactly like that. Q1, Q2, Q3... with conditions.

  *(Self-Correction on Kelly Formula)*: For binary markets priced at $q$ (cost to buy $1 payout), the odds are $(1-q)/q$. The Kelly fraction $f$ of bankroll to invest is $(p - q) / (1 - q)$. This is the standard "edge over odds" formulation for prediction markets. I will use this.

  *(Self-Correction on "Half Kelly")*: The prompt asks if it's principled. I will state it is a proxy for uncertainty. I will implement a specific "Uncertainty Haircut" based on the "Confidence Score."

  *(Self-Correction on "Single Shot")*: I will state that the procedure treats the *weekly flow of bets* as the repeated process, not the individual bet. This resolves the ergodicity complaint for the desk, but the Ruin Cap handles the single-shot risk.

  Let's write it.cw
answer: |-
  ### Objective Statement
  **We maximize the geometric growth rate of the desk's bankroll over a 12-month horizon.**
  This is a decision, not a fact. We choose geometric growth (log utility) over expected value because our bankroll is our operating budget; losing 50% terminates the business. We treat the *weekly flow of 10–40 bets* as the repeated process, not individual questions. This validates the use of log-optimization despite single-shot resolutions.

  ---

  ### The Sizing Procedure

  **Inputs Required:**
  *   $B$: Current Bankroll.
  *   $p$: Your probability estimate (0–1).
  *   $q$: Market implied probability (price) (0–1).
  *   $L$: Liquidity Score (1 = Illiquid/Thin, 5 = Deep/Liquid).
  *   $R$: Resolution Time (1 = <1 day, 5 = >6 months).
  *   $C$: Correlation Group ID (e.g., "US Election," "Fed Rate").

  **Step 1: The Stopping Rule (Edge Check)**
  *   **Question:** Is $p > q + 0.02$?
  *   **Condition:** If **No**, stop.
  *   **Action:** Stake = 0.
  *   **Reason:** Transaction costs and model noise exceed the raw edge.

  **Step 2: The Correlation Group (Dependency Check)**
  *   **Question:** Does this bet belong to a Correlation Group $C$ containing other open positions?
  *   **Condition:** If **Yes**, sum the *potential* stakes of all bets in Group $C$. Let this be $S_{group}$.
  *   **Action:** Proceed to Step 3, but apply the final stake limit to $S_{group}$, not the individual bet.
  *   **Reason:** Correlated bets are one bet split into pieces. Size the cluster, not the slice.

  **Step 3: The Uncertainty Discount (Edge Quality)**
  *   **Question:** What is the Confidence Multiplier ($M$)?
      *   Start with $M = 1.0$.
      *   If Liquidity Score $L \ge 4$ (smart money on other side), subtract 0.2 from $M$.
      *   If Resolution Time $R \ge 4$ (hard to update), subtract 0.2 from $M$.
      *   If Probability $p$ is based on intuition rather than model data, subtract 0.2 from $M$.
      *   **Floor:** $M$ cannot be less than 0.4.
  *   **Action:** Calculate Raw Kelly Fraction $K = \frac{p - q}{1 - q}$.
  *   **Action:** Calculate Adjusted Fraction $K_{adj} = K \times M$.
  *   **Reason:** "Half-Kelly" is not superstition; it is a penalty for parameter uncertainty. Informed counterparties and long horizons increase the chance your edge is phantom.

  **Step 4: The Ruin Cap (Budget Constraint)**
  *   **Question:** What is the Maximum Tolerable Loss ($MTL$) for this Correlation Group?
      *   **Rule:** $MTL = 0.20 \times B$ (20% of bankroll).
      *   **Logic:** Losing 20% on one theme is survivable; losing 50% shuts the desk. We allow 2.5 "fatal" errors before ruin.
  *   **Question:** Is $K_{adj} \times B > MTL$?
  *   **Condition:** If **Yes**, set $K_{final} = MTL / B$.
  *   **Condition:** If **No**, set $K_{final} = K_{adj}$.
  *   **Action:** If in a Correlation Group (Step 2), ensure $\sum K_{final} \le 0.20$. Prorate if necessary.
  *   **Reason:** The cliff is at 50% drawdown. We never risk more than 20% on a single thesis.

  **Step 5: Terminal Rule**
  *   **Output:** Stake = $K_{final} \times B$.
  *   **Justification:** "This stake captures the estimated edge discounted for uncertainty, capped to ensure one thesis cannot bankrupt the desk."

  ---

  ### Test Cases

  #### Case 1: The Liquid Grind (Repeated)
  *   **Inputs:** $B = \$100,000$. Market $q = 0.50$. Model $p = 0.55$. Liquidity $L=5$ (Deep). Resolution $R=1$ (Fast). Model-based. No Correlation.
  *   **Step 1:** Edge $0.05 > 0.02$. Pass.
  *   **Step 2:** No group.
  *   **Step 3:**
      *   Raw Kelly $K = (0.55 - 0.50) / (1 - 0.50) = 0.10$ (10%).
      *   Confidence $M$: Start 1.0. Liquidity $\ge 4$ (-0.2). $M = 0.8$.
      *   $K_{adj} = 0.10 \times 0.8 = 0.08$.
  *   **Step 4:** $0.08 \times 100k = \$8,000$. $MTL = \$20,000$. Cap not hit.
  *   **Recommendation:** **Stake 8% (\$8,000).**
  *   **Note:** Standard Kelly would say 10%. We shaved 20% because the liquid market implies informed counterparties.

  #### Case 2: The Cliffhanger (Single-Shot High Conviction)
  *   **Inputs:** $B = \$100,000$. Market $q = 0.50$. Analyst $p = 0.65$. Liquidity $L=2$ (Thin). Resolution $R=5$ (1 Year). Intuition-based. No Correlation.
  *   **Step 1:** Edge $0.15 > 0.02$. Pass.
  *   **Step 2:** No group.
  *   **Step 3:**
      *   Raw Kelly $K = (0.65 - 0.50) / (1 - 0.50) = 0.30$ (30%).
      *   Confidence $M$: Start 1.0. Liquidity low (0). Resolution long (-0.2). Intuition (-0.2). $M = 0.6$.
      *   $K_{adj} = 0.30 \times 0.6 = 0.18$.
  *   **Step 4:** $0.18 \times 100k = \$18,000$. $MTL = \$20,000$. Cap not hit.
  *   **Recommendation:** **Stake 18% (\$18,000).**
  *   **The Unpalatable Result:** Your analyst feels 65% certainty and sees a 30% Kelly. They will scream that 18% is too conservative for a "sure thing."
  *   **Why:** Because it is not a sure thing. It is one shot. If you are wrong, you lose 18% of your operating budget in a day. The procedure prioritizes survival over your analyst's ego. If the analyst insists on 30%, they are betting the firm's survival on their intuition. The procedure says no.

  #### Case 3: The Election Cluster (Correlated)
  *   **Inputs:** $B = \$100,000$. Six bets on different districts in the same election.
      *   Market $q = 0.50$ for all.
      *   Model $p = 0.60$ for all.
      *   Liquidity/Resolution/Mix average to $M = 0.7$.
      *   Correlation: High (National swing affects all).
  *   **Step 1:** Edge $0.10 > 0.02$. Pass.
  *   **Step 2:** Group = "Election."
  *   **Step 3:**
      *   Raw Kelly $K = (0.60 - 0.50) / 0.50 = 0.20$.
      *   $K_{adj} = 0.20 \times 0.7 = 0.14$ (14% per bet).
  *   **Step 4:**
      *   Uncapped Group Total = $6 \times 14\% = 84\%$.
      *   $MTL$ Cap = 20% of Bankroll.
      *   Since $84\% > 20\%$, we cap the group at 20%.
      *   Prorate: $20\% / 6 \approx 3.3\%$ per bet.
  *   **Recommendation:** **Stake 3.3% (\$3,300) on each of the six.**
  *   **Note:** Without grouping, you would risk 84% of your bankroll on one election night. That is suicide. The procedure treats the six bets as one large position and sizes accordingly.

  ---

  ### Limitations and "Arithmetic in Costume"

  **What this procedure cannot do:**
  It cannot distinguish between a model that is slightly wrong and a model that is catastrophically wrong. If your $p=0.65$ is actually $p=0.35$, the procedure still tells you to bet 18%. It manages the *size* of the error, not the *direction*.

  **Where analysts will cheat:**
  The Confidence Multiplier ($M$) in Step 3. Analysts will rate their intuition as "Model-based" to avoid the 0.2 penalty. They will claim liquidity is thin to avoid the counterparty penalty. This is the "arithmetic wearing the costume of principle." The numbers look objective, but the inputs are subjective.
  *   **Fix:** Audit the $M$ scores monthly. If an analyst consistently rates $M=1.0$ but has negative PnL, force their $M$ to 0.5.

  **When you have only a range:**
  If an analyst says "55% to 65%," use the midpoint (60%) for $p$, but automatically deduct 0.1 from $M$ for the imprecision. If they have "no idea," the Edge Check in Step 1 fails ($p$ cannot exceed $q + 0.02$), and the stake is zero. Do not bet on ranges that include the market price.

  **The Hard Truth:**
  This procedure will underperform a reckless desk in a bull market. It will feel frustratingly slow. It is designed to ensure you are still employed when the market turns. If you want to maximize this month's PnL regardless of next year's existence, discard Step 4 and bet Full Kelly. If you want to keep the desk open, follow the cap.
