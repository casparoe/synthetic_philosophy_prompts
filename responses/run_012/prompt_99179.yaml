answer: |-
  Your friend is right to point you toward Karl Jaspers. In 1947, shortly after the war, he wrote *The Question of German Guilt* specifically to untangle the mess of emotions and obligations you are describing. He argued that the word "guilt" was being used to mean four totally different things, and mixing them up causes the exact contradictions you are feeling.

  You are looking for **one principle**, but your intuitions are actually tracking **three distinct principles**. You aren't being inconsistent; you are just using the word "guilt" to cover three different ethical mechanisms.

  Here is the framework that organizes your pile of gut calls, forces you to adjust a few, and solves the cases you haven't settled.

  ### The Three Buckets

  To make your views consistent, you need to separate **Blame**, **Debt**, and **Benefit**.

  #### 1. Moral/Criminal Guilt (Blame)
  *   **Who:** Individual moral agents only.
  *   **Rule:** You are only guilty for what *you* did or intentionally enabled.
  *   **Duration:** Dies with the person.
  *   **Your Intuition:** This is why you feel the Turkish-German friend (born 1995) is right to feel nothing. She committed no crime, nor did she morally endorse the Nazis.

  #### 2. Political Liability (Debt)
  *   **Who:** Citizens and Institutions.
  *   **Rule:** If you are a member of a political body (a nation, a university), you share responsibility for its debts and obligations, even if you didn't incur them personally. This is the cost of membership.
  *   **Duration:** Persists as long as the institution/nation exists.
  *   **Your Intuition:** This explains why the University owes reparations and why the Country (even new voters) has to pay for the 70s massacre. It is not that the *students* are evil; it is that the *University* has a bill to pay, and the students are current beneficiaries of the institution.

  #### 3. Unjust Enrichment (Benefit)
  *   **Who:** Heirs and Successors.
  *   **Rule:** If you hold assets or status that were acquired through injustice, you have an obligation to disgorge that benefit, regardless of your personal innocence.
  *   **Duration:** Persists as long as the benefit persists.
  *   **Your Intuition:** This explains the Plantation Heir. He isn't "guilty" of slavery (Bucket 1), but he holds money that is, ethically speaking, stolen property (Bucket 3).

  ---

  ### Applying the Framework to Your Cases

  Here is how this sorting changes or validates your specific calls.

  **1. You (Ordinary German Descendant)**
  *   **Your Call:** You feel guilt.
  *   **The Verdict:** You are conflating Bucket 1 and Bucket 3. You have no **Moral Guilt** (Bucket 1). However, Jaspers argues for a fourth category he calls **Metaphysical Guilt**: a solidarity among all humans where we feel responsible for every wrong committed in our presence.
  *   **Adjustment:** You are allowed to *feel* a sense of solemn responsibility (Metaphysical), but you must admit you are not *culpable* (Moral). You do, however, share **Political Liability** (Bucket 2) simply by being a citizen of the successor state.

  **2. Turkish-German Friend**
  *   **Your Call:** She feels nothing; this is right.
  *   **The Verdict:** Correct. She has no **Moral Guilt**. She likely has no **Unjust Enrichment** (her family arrived later, likely marginalized). She does share **Political Liability** (she lives in Germany and benefits from its infrastructure), but that is a legal tax obligation, not a historical shame.

  **3. The Plantation Heir**
  *   **Your Call:** He owes something.
  *   **The Verdict:** Correct, but not because of guilt. This is **Unjust Enrichment** (Bucket 3). If his wealth exists *because* of slavery, that wealth is tainted. He owes restitution not because he sinned, but because he is holding stolen goods.

  **4. The University**
  *   **Your Call:** The institution is guilty and owes.
  *   **The Verdict:** Correct. Institutions fall under **Political Liability** (Bucket 2). An endowment is a continuous fund. If the principal was poisoned by slave labor, the income it generates is still poisoned. The institution persists, so the liability persists.

  **5. The 70s Massacre Country**
  *   **Your Call:** Country is guilty, citizens aren't, but citizens must pay.
  *   **The Verdict:** This is your most consistent intuition. It perfectly describes **Political Liability**. The *State* is the agent that owes reparations. The *Citizens* are the shareholders who must cover the cost through taxes or policy, without necessarily bearing personal shame.

  ---

  ### The Hard Cases (Where you need to adjust)

  Here is where the framework forces you to give up or refine some of your wavering calls.

  **6. The German-Jewish Descendant**
  *   **Your Conflict:** She is a victim, but also a citizen of the "guilty" nation.
  *   **The Resolution:** You must separate the **Cost** from the **Shame**.
      *   **Shame (Moral Guilt):** She bears none. Her family was the target.
      *   **Cost (Political Liability):** She *does* share this. If the German state pays reparations, it pays from tax revenue. She pays taxes.
  *   **The Principle:** Citizenship is a package deal. You cannot claim the protection and passport of the state (the benefits) without accepting its liabilities (the debts). She is not "guilty," but she is a stakeholder in the restitution. This might feel unfair, but it is the price of a continuous political community.

  **7. The Company (Predecessor did something awful)**
  *   **Your Question:** Is a company liable if none of the same employees are there?
  *   **The Resolution:** It depends on **Corporate Continuity** vs. **Asset Transfer**.
      *   **Same Legal Entity:** If it is the exact same corporation (same registration, same charter), it carries **Political/Legal Liability** (Bucket 2). The "soul" of the company is its legal charter, not its employees. (e.g., IBM or Volkswagen acknowledging past roles).
      *   **New Company/Old Assets:** If a new company bought the old factory and equipment cheaply because of the scandal, they may be liable under **Unjust Enrichment** (Bucket 3). They profited from the discounted price of a tainted asset.
      *   **The Rule:** If the profit stream continues, the obligation continues.

  ### The One Principle You Were Looking For

  You wanted one rule: *"It's guilty if it's the same agent over time."*

  That rule is half-right. The corrected principle is:

  > **Obligation follows continuity of benefit or identity; Blame follows continuity of agency.**

  *   **Blame** stops when the moral agent dies (The ordinary German ancestor).
  *   **Obligation** continues if the **Institution** continues (The University/State).
  *   **Obligation** continues if the **Benefit** continues (The Plantation Heir/The Company).

  ### Summary of Adjustments

  To be fully consistent, you have to concede two things:

  1.  **Stop calling it "Guilt" for descendants.** You feel it, and that's valid (Metaphysical Guilt), but ethically, you cannot be *culpable* for your great-grandparents' inaction. You can only be *responsible* for the cleanup.
  2.  **Accept the Jewish-German Liability.** You want to say she is exempt because she was a victim. But if she claims German citizenship, she claims membership in the political body that owes the debt. She shares the *cost* of the guilt, even if she doesn't share the *stain* of it.

  Your friend was right: Jaspers is the key. Once you separate **Criminal** (did you do it?), **Political** (do you belong to the group that did it?), and **Moral** (did you fail humanity?), your gut calls line up perfectly.
