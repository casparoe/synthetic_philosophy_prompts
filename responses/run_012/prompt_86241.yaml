prompt: |-
  Hey — I'm a third-year PhD student in political theory, and my dissertation chapter has me stuck refereeing a fight between two camps in the boundary-problem literature, and I need to force them into an adversarial collaboration. The camps: on one side the all-affected-interests crowd (anyone whose interests get set back by a decision has a claim to be part of the demos that makes it), on the other the all-subjected / all-coerced crowd (what grounds inclusion is being subject to the authority or the coercion of the decision, not merely being affected by it). They've been going around in circles for years and I want the document they should have written together.

  Draft that joint statement — the thing a committed all-affected person and a committed all-subjected person could both put their names to. What I need in it:

  - The agreed claims first, numbered. Stuff both can sign about why the current arrangement (demos bounded by citizenship, the ballot box, existing territorial borders) can't just be assumed, about what a principle of inclusion is even supposed to do, about whether inclusion comes in degrees, and about which cases are hard for both sides. Don't let these go vacuous — if a claim would be signed by anyone with a pulse, cut it.
  - Then the residual disagreement, as a table. One row per issue, with the all-affected wording in one column and the all-subjected wording in another, each phrased the way that side would actually want to phrase it, not a strawman of it.
  - The cruxes: the sub-questions such that settling one would move at least one side. For each crux, give a concrete case or arguement both sides agree bears on it, and write down what each side predicts about that case before the fact.
  - Tell me which parts of the fight are, in your view, merely verbal — disagreements that dissolve once the two sides pin down what they mean by 'affected', 'subjected', 'authority', or 'the demos' — and which are real. Say explicitly where the wording is doing the work.

  Two extra things I want baked in. (1) Please include a 2x2 over affected × subjected — affected-and-subjected, affected-only, subjected-only, neither — and say for each cell which camp thinks it grounds a claim to membership, and where the other camp thinks that's a mistake. (2) Anchor the whole thing in one running case so it doesn't float off into abstraction: a global loss-and-damage / climate-adaptation fund whose spending decisions hit people who are neither citizens nor residents of the states that run it, plus the resident non-citizen who's subjected to a state's law but arguably not affected by the particular decision. Use that case for the crux predictions.

  No citations or reading lists — I don't need the literature, I need the argument. And if you think one of the two camps definately can't sign a claim I'd expect it to, say so and explain why, rather than papering over it.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **User:** Third-year PhD student in political theory.
      *   **Task:** Draft a "joint statement" between the All-Affected Interests (AAI) and All-Subjected/All-Coerced (ASC) camps in the boundary problem literature.
      *   **Goal:** Force adversarial collaboration, move beyond circular debates.
      *   **Requirements:**
          1.  Agreed Claims (numbered, non-vacuous).
          2.  Residual Disagreement (table format, authentic phrasing).
          3.  Cruxes (sub-questions, concrete cases/arguments, predictions).
          4.  Verbal vs. Real Disagreements (analysis of terminology).
          5.  Extra 1: 2x2 Matrix (Affected x Subjected) with camp positions.
          6.  Extra 2: Running Case Study (Global Climate Loss-and-Damage Fund + Resident Non-Citizen).
          7.  Constraint: No citations/reading lists. Be honest if a claim can't be signed.

  2.  **Deconstruct the Camps:**
      *   **All-Affected Interests (AAI):** Focus on interests, consequences, harm/benefit. *Motto:* "If it hits you, you get a say." *Weakness:* Over-inclusiveness (everyone is affected by everything eventually), defining "interests."
      *   **All-Subjected/Coerced (ASC):** Focus on authority, coercion, law, subjection. *Motto:* "If you have to obey, you get a say." *Weakness:* Under-inclusiveness (externalities), defining "coercion/authority."
      *   **Common Ground:** Both reject the *status quo* (citizenship/territory) as morally arbitrary. Both seek a democratic principle of inclusion. Both struggle with "degrees" of inclusion.
      *   **Tension Points:** The "affected-only" case (externalities without law) and the "subjected-only" case (laws with no tangible impact).

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound formal but collaborative. "Joint Statement on the Democratic Boundary Problem."
      *   **Introduction:** Set the stage. Acknowledge the stalemate. Introduce the running case (Climate Fund).

      *   **Section 1: Agreed Claims (The "Preamble"):**
          *   Need to avoid vacuity. Instead of "Democracy is good," say "Existing borders are not morally self-justifying."
          *   *Claim 1 (Status Quo):* Citizenship/Territory is presumptive, not definitive.
          *   *Claim 2 (Function):* The principle must prevent arbitrary exclusion *and* decisional paralysis.
          *   *Claim 3 (Degrees):* Inclusion isn't binary (vote/no vote). It's about stakes/authority intensity.
          *   *Claim 4 (Hard Cases):* Acknowledge the Climate Fund case creates tension for both.
          *   *Check:* Can AAI sign? Yes. Can ASC sign? Yes. (Avoid claiming "coercion is bad" or "harm is the only metric").

      *   **Section 2: The 2x2 Matrix (Extra Requirement 1):**
          *   Need to visualize the logical space.
          *   *Affected + Subjected:* Both agree (Core Demos).
          *   *Neither:* Both agree (No claim).
          *   *Affected ONLY:* AAI says Yes, ASC says No.
          *   *Subjected ONLY:* ASC says Yes, AAI says No (This is the tricky one—AAI might say "if you aren't affected, why do you care?" but ASC says "obedience is the trigger").
          *   *Integration:* Use the Climate Fund case here.

      *   **Section 3: Residual Disagreement (Table):**
          *   Need authentic phrasing.
          *   *Row 1: The Trigger.* AAI: "Setback to interests." ASC: "Imposition of will/law."
          *   *Row 2: The Scope.* AAI: "Causal chains." ASC: "Juridical relationship."
          *   *Row 3: The Remedy.* AAI: "Stakeholder representation." ASC: "Full membership/vote."

      *   **Section 4: Cruxes & Predictions:**
          *   Need specific sub-questions where settling them changes minds.
          *   *Crux 1: The "Empty Law" Case.* (Subjected but not Affected).
              *   *Case:* A resident non-citizen subject to a tax law where the revenue is spent entirely abroad (Climate Fund).
              *   *ASC Prediction:* They need a vote (subjection exists).
              *   *AAI Prediction:* They don't need a vote (no interest setback), maybe just oversight.
          *   *Crux 2: The "Distant Harm" Case.* (Affected but not Subjected).
              *   *Case:* Pacific Islander affected by Fund spending decisions made in Berlin, but not subject to German law.
              *   *AAI Prediction:* They need a vote (interests devastated).
              *   *ASC Prediction:* They need compensation, not necessarily a vote in Berlin (no subjection to German authority).
          *   *Crux 3: Epistemic Access.* Who knows best if someone is affected/subjected?

      *   **Section 5: Verbal vs. Real Disagreements:**
          *   *Verbal:* Definitions of "affected" (trivial vs. significant) and "coercion" (force vs. structural). If AAI means "significantly affected" and ASC means "legally bound," they might overlap more.
          *   *Real:* The moral source of legitimacy. Is it autonomy (ASC) or welfare/harm (AAI)? This won't dissolve with definitions.
          *   *Wording Work:* "Authority" vs. "Power."

  4.  **Review and Refine:**
      *   *Tone Check:* Is it academic but direct? Yes.
      *   *Constraint Check:* No citations? Yes. Running case used? Yes. 2x2 included? Yes.
      *   *Honesty Check:* Did I paper over differences? I need to make sure the "Agreed Claims" aren't too weak.
      *   *Self-Correction on Claim 3 (Degrees):* AAI often argues for proportional influence. ASC often argues for binary membership (you are either under the law or not). I need to phrase this carefully so both can sign. Maybe "Institutional design must reflect intensity."
      *   *Self-Correction on 2x2:* The "Subjected Only" cell is the hardest for AAI. If I am subject to a law that *benefits* me or does nothing, do I get a vote? ASC says yes (autonomy). AAI says... maybe not based on *interests*, but based on *agency*. I need to be precise here. AAI usually focuses on *interests*. If interests aren't set back, AAI weakens. I will note this tension.

  5.  **Final Polish:**
      *   Ensure the Climate Fund case is woven through the Cruxes.
      *   Make sure the "Verbal vs. Real" section is analytical, not just descriptive.
      *   Check the "PhD Student" persona match—dense, precise, no fluff.

  6.  **Final Output Generation** (Proceeding to draft based on these thoughts).
answer: |-
  # JOINT STATEMENT ON THE DEMOCRATIC BOUNDARY PROBLEM
  **Drafted for Adversarial Collaboration**
  **Parties:** Proponents of the All-Affected Interests Principle (AAI) & Proponents of the All-Subjected Principle (ASC)
  **Running Case:** *The Global Climate Loss-and-Damage Fund (GCLDF)*. A governing board located in Geneva, funded by statutory levies on member states, makes spending decisions on adaptation projects.
  **Subjects:** (1) A farmer in Bangladesh whose land is salinated by decisions made by the GCLDF board (Affected, Not Subjected). (2) A permanent resident in Switzerland who pays the levy via taxation but whose daily life is unchanged by the specific spending decision (Subjected, Minimally Affected).

  ---

  ## I. AGREED CLAIMS
  *The following claims are endorsed by both camps. We reject the notion that these are trivial. If a claim cannot be signed by a committed proponent of either side, it has been excluded.*

  1.  **The Rejection of *Status Quo* Presumption:** Existing territorial borders and citizenship statuses are not morally self-justifying boundaries for the *demos*. They are administrative conveniences that must be tested against a normative principle of inclusion. Neither camp accepts "because they are citizens" or "because they are inside the border" as a sufficient moral reason for exclusion or inclusion.
  2.  **The Function of the Principle:** The purpose of a boundary principle is not merely to maximize participation, but to secure *legitimacy*. A decision is democratically illegitimate if the relevant class of persons is excluded from the process of making it. However, legitimacy also requires *efficacy*; a *demos* that includes everyone affected by everything is decisionally paralyzed. Both camps accept that the principle must balance moral inclusion with political agency.
  3.  **Inclusion Comes in Degrees:** The binary of "member/non-member" is insufficient for complex governance structures like the GCLDF. Both camps agree that inclusion can be graduated (e.g., consultation rights, veto powers, full voting membership, judicial review) depending on the intensity of the relationship (degree of affectedness or degree of subjection).
  4.  **The Problem of Causal Indeterminacy:** Both camps acknowledge that causal chains are infinite. "Affectedness" cannot mean "any causal ripple," and "Subjection" cannot mean "any indirect legal consequence." Both agree that a threshold of significance is required, even if we disagree on how to define that threshold.
  5.  **The Hard Case Concession:** Both camps acknowledge that the *Running Case* generates counter-intuitive results for their respective positions.
      *   **AAI Concession:** It is difficult to explain why the Swiss resident (Subjected Only) deserves a vote if their interests are not tangibly set back.
      *   **ASC Concession:** It is difficult to explain why the Bangladeshi farmer (Affected Only) is entitled to a vote in Geneva if they owe no obedience to the Geneva board.

  ---

  ## II. THE LOGICAL SPACE (2x2 MATRIX)
  *Classification of claims to membership based on the intersection of Affectedness and Subjection.*

  | | **SUBJECTED TO AUTHORITY** | **NOT SUBJECTED TO AUTHORITY** |
  | :--- | :--- | :--- |
  | **AFFECTED (Interests Set Back)** | **CELL 1: The Core Demos**<br>*(e.g., Swiss citizen whose tax funds the project)*<br>**AAI:** Strong claim to membership.<br>**ASC:** Strong claim to membership.<br>**Status:** **AGREED.** | **CELL 2: The External Stakeholder**<br>*(e.g., Bangladeshi farmer)*<br>**AAI:** Strong claim to membership (or functional equivalent).<br>**ASC:** No claim to membership. Claim is to *justice/compensation*, not *voice*.<br>**Status:** **DISAGREED.** |
  | **NOT AFFECTED (Interests Neutral)** | **CELL 3: The Formal Subject**<br>*(e.g., Swiss resident unaffected by spend)*<br>**AAI:** Weak/No claim. Why vote if interests don't move?<br>**ASC:** Strong claim. Subjection to law is the trigger, regardless of outcome.<br>**Status:** **DISAGREED.** | **CELL 4: The Outsider**<br>*(e.g., Citizen of unrelated state)*<br>**AAI:** No claim.<br>**ASC:** No claim.<br>**Status:** **AGREED.** |

  ---

  ## III. RESIDUAL DISAGREEMENT
  *Where we diverge on the moral grounding and institutional application.*

  | Issue | All-Affected Interests (AAI) Wording | All-Subjected (ASC) Wording |
  | :--- | :--- | :--- |
  | **The Moral Trigger** | Inclusion is grounded in the **protection of welfare and agency**. If a decision alters the conditions of your life, you must have control over it to prevent domination by others' choices. | Inclusion is grounded in **political autonomy and reciprocity**. If you are required to obey a will that is not your own, you must be a co-author of that will to remain free. |
  | **The Scope of Claim** | Claims extend to **consequences**. If the GCLDF decision causes harm across a border, the boundary of the *demos* must expand to match the boundary of the harm. | Claims extend to **jurisdiction**. If the GCLDF exercises coercive power (taxation, enforcement) over you, the boundary of the *demos* must match the boundary of the coercion. |
  | **The "Subjected-Only" Case** | (Regarding Cell 3) Voting rights should track **stakes**. If the Swiss resident's interests are not set back, their claim to a vote is weak. They may have a procedural right, but not a substantive stake. | (Regarding Cell 3) Voting rights track **obligation**. The Swiss resident is coerced by the tax levy. To coerce without consent is tyranny, even if the coercion is beneficial or neutral to the subject. |
  | **The "Affected-Only" Case** | (Regarding Cell 2) The Bangladeshi farmer is de facto governed by the GCLDF's power to alter their environment. **Power without accountability** is domination, regardless of legal formalities. | (Regarding Cell 2) The farmer is a victim of externalities, not a subject. The remedy is **international justice**, not democratic membership. Giving them a vote conflates humanitarian obligation with political sovereignty. |

  ---

  ## IV. CRUXES & PREDICTIONS
  *Specific sub-questions where settling the fact or definition would move one side. We anchor these in the Running Case.*

  ### Crux 1: The "Empty Law" Test (Cell 3)
  *   **The Question:** Does subjection to a coercive apparatus generate a democratic claim even if the specific exercise of that coercion has no perceptible impact on the subject's interests?
  *   **The Case:** The Swiss permanent resident is legally obligated to pay the GCLDF levy. The money is spent entirely in Bangladesh. The resident's disposable income is unchanged (tax neutral elsewhere), and their environment is unchanged.
  *   **AAI Prediction:** The resident has **no claim to a vote** on the spending decision. Their interests are not set back. They may have a claim to vote on the *tax rate*, but not the *allocation*.
  *   **ASC Prediction:** The resident **has a claim to a vote**. The GCLDF board exercises authority over them (via the state). To be subject to a decision-making body without representation violates the reciprocity condition of freedom, regardless of material outcome.
  *   **Moveable Condition:** If AAI concedes that "autonomy" is an interest distinct from "welfare," they move toward ASC. If ASC concedes that "de minimis coercion" doesn't trigger democratic rights, they move toward AAI.

  ### Crux 2: The "Distant Harm" Test (Cell 2)
  *   **The Question:** Does severe impact on interests generate a claim to *membership* in the deciding body, or merely a claim to *compensation* from that body?
  *   **The Case:** The GCLDF votes to fund a dam project that inadvertently worsens salination for the Bangladeshi farmer. The farmer is not a legal subject of the GCLDF.
  *   **ASC Prediction:** The farmer has a claim to **remediation/compensation**, but not a seat on the board. Including them violates the reciprocity of coercion (the farmer cannot coerce the board in return).
  *   **AAI Prediction:** The farmer has a claim to **voting membership** (or veto power). Compensation is paternalistic; only voice secures the interest against future setbacks.
  *   **Moveable Condition:** If ASC accepts that "structural power" counts as "coercion" even without legal enforcement, they move toward AAI. If AAI accepts that "transnational stakeholder forums" satisfy the requirement without full *demos* membership, they move toward ASC.

  ### Crux 3: The Epistemic Burden
  *   **The Question:** Who bears the burden of proof to demonstrate the link between decision and person?
  *   **The Case:** Determining if the Bangladeshi salination was caused by the GCLDF decision or general climate trends.
  *   **AAI Prediction:** The **GCLDF bears the burden**. If they cannot prove the farmer *wasn't* affected, they must include them. Precautionary principle applies to inclusion.
  *   **ASC Prediction:** The **Farmer bears the burden**. They must demonstrate they are subject to the authority. Since they are not legally subject, the presumption is exclusion unless legal subjection is proven.
  *   **Moveable Condition:** Agreement on an independent adjudication mechanism for boundary disputes would reduce friction here.

  ---

  ## V. VERBAL VS. REAL DISAGREEMENTS
  *Analysis of where the fight is about words and where it is about the world.*

  ### 1. Merely Verbal (Dissolves with Definition)
  *   **The Definition of "Affected":** Much of the "over-inclusiveness" objection to AAI vanishes if "affected" is defined as "significantly and foreseeably set back" rather than "causally touched." If AAI adopts a high threshold of significance, Cell 2 shrinks.
      *   *Wording Work:* If AAI agrees to "All *Significantly* Affected," they lose the trivial cases but keep the Bangladeshi farmer.
  *   **The Definition of "Coercion":** Much of the "under-inclusiveness" objection to ASC vanishes if "coercion" includes "structural domination" rather than just "legal enforcement." If the GCLDF has the power to alter the farmer's life chances without recourse, ASC can classify this as *de facto* subjection.
      *   *Wording Work:* If ASC agrees that "non-legal power that restricts options" counts as subjection, they capture Cell 2 without abandoning their principle.
  *   **The Definition of "The Demos":** If both sides agree that "membership" does not necessarily mean "one-person-one-vote in a national election," but can mean "functional representation in a specific governance body," the institutional gap narrows.

  ### 2. Real Disagreements (Normative Foundations)
  *   **The Source of Legitimacy:** This will not dissolve.
      *   **AAI** roots legitimacy in **Well-Being/Consequences**. A decision is illegitimate if it harms without consent.
      *   **ASC** roots legitimacy in **Freedom/Status**. A decision is illegitimate if it commands obedience without authorship.
      *   *Why it matters:* In the "Empty Law" case (Cell 3), ASC will *always* demand a vote for the Swiss resident because their status as a free agent is violated by unconsented authority. AAI will *never* be fully satisfied by this because no harm occurred. This is a clash between Deontology (ASC) and Consequentialism/Welfarism (AAI).
  *   **The Remedy for Externalities:**
      *   **AAI** insists the remedy for harm is **Power** (voice).
      *   **ASC** insists the remedy for harm is **Justice** (rights/courts), distinct from **Power** (voice).
      *   *Why it matters:* You cannot compromise here without one side abandoning their core intuition. Either the farmer needs a vote (AAI) or they need a lawsuit (ASC).

  ### 3. Where the Wording Does the Work
  *   **"Authority" vs. "Power":** ASC leans on "Authority" (right to rule) to exclude the Bangladeshi farmer. AAI leans on "Power" (capacity to affect) to include them. If we agree that the GCLDF has *Power* without *Authority* over the farmer, we locate the exact friction point: Does Power without Authority require Democratic Inclusion (AAI) or Human Rights Protection (ASC)?
  *   **"Interests":** AAI uses "Interests" to cover both material welfare and political autonomy. If AAI explicitly splits these, they might concede Cell 3 (Autonomy is not a welfare interest) but hold firm on Cell 2.

  ---

  **Signatories:**
  __________________________ (All-Affected Interests)
  __________________________ (All-Subjected Principle)
  **Date:** _________________
