answer: |-
  Your intuitions are remarkably consistent with the most rigorous strands of modern archaeological theory, specifically the tension between **Processual** (scientific, systems-based) and **Post-Processual** (interpretive, cognitive) approaches. You have effectively stumbled upon a methodological firewall that many professionals struggle to articulate.

  The principle that accounts for all six of your verdicts, resolves your nagging inconsistency, and predicts the outcome for the coin hoard is what I will call **The Principle of Baseline Exclusion.**

  ### The Principle of Baseline Exclusion

  **The Rule:** You are licensed to infer a specific past behavior or institution *only if* the material evidence structurally excludes the "mundane baseline" of daily life (accident, waste, domestic routine, or random loss).

  *   **If the evidence *could* be mundane waste/accident/routine:** You must stop at the physical description (e.g., "deliberate deposition," "defleshing"). You cannot infer the *meaning* (e.g., "sacrifice," "cannibalism").
  *   **If the evidence *cannot* be mundane waste/accident/routine:** You are licensed to infer the social function (e.g., "status," "communal building," "wealth").

  This principle distinguishes between **Physical Action** (which leaves constrained traces) and **Cognitive Intent** (which leaves underdetermined traces).

  ### How It Explains Your Six Verdicts

  1.  **Smashed Pots (Pit):**
      *   *Baseline:* Broken pots end up in pits as rubbish.
      *   *Exclusion:* The "all smashed the same way" excludes *accidental* breakage. So you accept "deliberate smashing."
      *   *Failure:* It does *not* exclude "rubbish disposal." A ritual sacrifice and a trash dump look identical here.
      *   *Verdict:* Accept Action (Smashing), Reject Meaning (Sacrifice).

  2.  **Ox and Wagon Burial:**
      *   *Baseline:* Ordinary human burial (no ox, no wagon).
      *   *Exclusion:* The cost and logistics exclude "ordinary disposal." You cannot bury an ox and wagon by accident or as standard waste.
      *   *Verdict:* Accept Social Structure (High Status/Investment).

  3.  **Cut Marks on Bones:**
      *   *Baseline:* Food waste processing (removing meat for eating).
      *   *Exclusion:* The marks exclude "natural death," but they do *not* exclude "cooking."
      *   *Failure:* Cannibalism (eating humans) and Funerary Defleshing (cleaning bones for burial) produce identical taphonomic signatures.
      *   *Verdict:* Accept Action (Defleshing), Reject Meaning (Cannibalism).

  4.  **Clay Figurines:**
      *   *Baseline:* Small clay objects exist as toys, seals, decorative items, or teaching tools.
      *   *Exclusion:* The spread excludes "individual whim," so you accept "shared way of doing things."
      *   *Failure:* It does *not* exclude "toys" or "art." A shared religion is just one of many explanations for shared style.
      *   *Verdict:* Accept Social Pattern (Shared Practice), Reject Theology (Goddess).

  5.  **Burnt Platform (Temple):**
      *   *Baseline:* Ordinary houses (domestic, ground level, unburnt usually).
      *   *Exclusion:* A raised platform in the town center *architecturally excludes* domestic use. You cannot live on a raised, burnt platform in the middle of town as a normal household.
      *   *Verdict:* Accept Social Function (Communal/Ritual Building). *Note: You are inferring a space for non-domestic activity, not necessarily proving a specific god.*

  6.  **Imported Goods in House:**
      *   *Baseline:* Local pottery, standard goods.
      *   *Exclusion:* Imported beads exclude "local production/self-sufficiency."
      *   *Verdict:* Accept Social Structure (Connections/Wealth).

  ### Resolving Your "Nag"

  You worried that the **Smashed Pots** and the **Burnt Platform** were both non-utilitarian deposits, yet you treated them differently.

  Under **Baseline Exclusion**, they are different:
  *   The **Pots** are mundane objects in a mundane context (a pit). The *only* thing special is the breakage pattern, which proves intent but not purpose. The "Rubbish" baseline is still active.
  *   The **Platform** is a *non-mundane object* in a *non-mundane context*. The "Domestic House" baseline is structurally impossible. Therefore, you are allowed to infer a special institutional function ("Temple/Ritual").

  You also worried about reading institutions off a building but not beliefs off a figurine.
  *   The **Building** proves an *institution* (organized labor, central planning) because a house cannot be built that way by a family.
  *   The **Figurine** does not prove a *belief* because a toy can be made by a family.
  *   **Correction:** You are inferring **Social Complexity** from the building, but refusing to infer **Theological Content** from the figurine. This is consistent.

  ### The Prediction: The Coin Hoard

  **Case:** A hoard of coins buried in a field, no settlement for miles, no container, just coins in a hollow.

  **Application of Baseline Exclusion:**
  1.  **Baseline:** Coins are lost (dropped) or hidden (savings).
  2.  **Exclusion:** A "hollow in the ground" excludes *accidental loss* (you don't drop coins into a dug hole by accident). So you can infer **Deliberate Concealment**.
  3.  **Failure:** Does it exclude "Safekeeping for later retrieval"? No. Does it exclude "Votive Offering"? No. Does it exclude "Emergency Burial by a traveler"? No.
  4.  **Verdict:**
      *   **Allowed:** "Deliberate deposition of wealth." "Concealment."
      *   **Forbidden:** "Votive sacrifice to land spirits." "War chest lost in battle." "Savings of a local farmer." (Without a settlement nearby, the 'local farmer' baseline is actually weakened, but the 'traveler' baseline opens up).

  **My Prediction for You:** You will feel comfortable saying someone *hid* this money intentionally. You will feel uncomfortable saying *why* (offering vs. savings) or *who* (local vs. traveler) without more context.

  ### Which Verdict Must You Drop?

  If you want perfect logical consistency, you have to adjust one of two things. The tension lies in the word **"Temple"** (Case 5) vs. **"Sacrifice"** (Case 1).

  *   **Option A (Hardline Materialist):** Drop the word "Temple." Call it a "Non-Domestic Communal Structure." "Temple" implies a specific theological function (house of a god) which is just as unproven as "Sacrifice." If you won't call the pots a sacrifice, you shouldn't call the building a temple.
  *   **Option B (Functional Realist):** Accept "Sacrifice" for the pots, *if* you define sacrifice economically rather than theologically. If "Sacrifice" means "The deliberate destruction of value in a non-recoverable context," the pots fit.

  **Recommendation:** Drop the word **"Temple"** in favor of **"Ritual/Ceremonial Building."**
  *Why?* "Temple" implies a specific deity or priesthood (Theological Content). "Ritual Building" implies a space for formalized, non-domestic behavior (Social Function). This aligns with your refusal to infer a "Goddess" from the figurines. You are consistent in rejecting specific theology while accepting social function.

  ### What Would Change My Mind? (And Where I Might Be Wrong)

  I am arguing for **Baseline Exclusion**. Here is where that reasoning is vulnerable:

  **1. The "Total Ritual" Society**
  My reasoning assumes a baseline of "mundane/domestic" vs. "special/ritual."
  *   *Challenge:* What if the society did not distinguish these? In some Neolithic contexts, *all* deposition might be ritualized. If "rubbish pits" don't exist in this culture, then the "Smashed Pots" *must* be ritual.
  *   *Mind Changer:* If you find a settlement where *no* domestic waste pits exist, only formal deposits, the "Rubbish" baseline collapses. Then you *must* infer Ritual for the pots.

  **2. Contextual Association (The "Lock")**
  My reasoning treats cases in isolation.
  *   *Challenge:* If the Figurines are *only* found on the Burnt Platform, and never in houses, the "Toy" baseline collapses.
  *   *Mind Changer:* If the distribution of the figurines is statistically exclusive to the "Temple" context, you are licensed to infer "Cult Object" or "Deity Representation." The context excludes the mundane.

  **3. The Definition of "Sacrifice"**
  *   *Challenge:* Archaeologists like Anthony Harding argue that "Sacrifice" is a material act (destruction of value), not just a mental state.
  *   *Mind Changer:* If you accept that "Sacrifice" describes the *economic transaction* (giving up pots permanently) rather than the *theological recipient* (giving to a god), your rejection of Case 1 becomes too strict. You can infer "Ritual Deposition" which is functionally synonymous with sacrifice in material terms.

  **4. The Weakness of "Ritual" as a Category**
  *   *Critique:* By accepting "Ritual Building" but rejecting "Goddess," I am assuming "Ritual" is a material category. But "Ritual" is a cognitive category. There is no such thing as a "Ritual Brick."
  *   *Risk:* I am allowing myself a "soft" cognitive inference (Ritual) while banning "hard" ones (Goddess). This is a slippery slope. If I admit the building is for "Ritual," I have already admitted people had beliefs that required non-domestic space. Why stop there?
  *   *Defense:* You stop there because "Ritual" describes the *grouping behavior*, whereas "Goddess" describes the *content of the thought*. One is observable (people gathering), one is not (what they think while gathering).

  ### Summary
  Your gut is following **The Principle of Baseline Exclusion**. You infer social structure and physical action where the mundane is excluded; you reject theological intent where the mundane remains possible. To remain consistent, ensure you treat "Temple" as a functional label for "Non-Domestic Space," not a theological claim. If you do that, your framework holds.
