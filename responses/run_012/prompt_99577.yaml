answer: |-
  The debate started over dishes, as these things often do. Your roommate, the compiler engineer, wiped a plate and declared that the brain is just a computer. You, the neuroscientist, countered that this is either false or empty. False, because the brain lacks a clock cycle, a central processing unit, or distinct memory addresses. Empty, because if "computation" just means "stuff happens and leads to other stuff," then a falling rock is a computer, and the word loses its bite.

  You are both wrestling with the central problem of computationalism: the implementation relation. What does it take for a physical system to *be* a computer? If the answer is too loose, the claim is trivial. If the answer is too strict, the claim is false. To resolve this, we have to move past the surface-level architecture and look at the metaphysics of computation. We need to determine whether computation is something the brain *is*, or something we *project* onto the brain.

  The strongest argument against your roommate is the triviality argument, often associated with Hilary Putnam. It goes like this: To say a physical system implements a computation is to say there is a mapping between the physical states of the system (e.g., voltage levels, neuronal firing patterns) and the formal states of a machine (e.g., 1s and 0s, tape symbols). If all that is required is a consistent mapping, then almost any physical object can be interpreted as implementing any computation. A bucket of water has a near-infinite number of molecular configurations. With a sufficiently complex lookup table, you could map those configurations to the states of a running Word document. Does the bucket of water process text? Intuitively, no. But if computationalism relies only on mapping, then yes.

  If your roommate accepts this mapping view, he falls into the trap of pancomputationalism. If everything computes, then saying "the brain is a computer" explains nothing. It becomes a metaphor, a way of speaking that offers no causal leverage. This validates your "empty" objection. A metaphor is useful for illustration, but it cannot be the foundation of a science. You cannot build a theory of mind on a foundation that applies equally to a cortex and a cloud.

  However, your roommate is likely not talking about static mapping. He is talking about mechanism. This is where the triviality argument fails, and where the substantive sense of computation lies. A physical system does not implement a computation merely because its states *can* be mapped to formal states. It implements a computation because its physical states *cause* one another in virtue of their formal properties.

  This is the causal-structural requirement. For a brain to implement a computation, the transition from physical state A to physical state B must mirror the transition from formal state X to formal state Y, and it must do so counterfactually. If the system had been in physical state A-prime, it *would* have gone to B-prime, because of the way the system is built. The causal structure of the hardware must support the logical structure of the software. In a silicon chip, the voltage causes the transistor to switch because of the engineering of the gate. In the brain, the membrane potential causes the spike because of the ion channels.

  This saves computationalism from triviality. A bucket of water does not support the right counterfactuals. If you perturb the water molecules slightly, the "computation" doesn't proceed according to logical rules; it dissipates according to fluid dynamics. The mapping is post-hoc, not causal. The brain, however, is robust. If you stimulate a neuron, it fires according to threshold dynamics. If you lesion a pathway, the information flow stops. The causal transitions are constrained by the functional organization of the system.

  So, is the claim testable? Yes, precisely because of this causal requirement. If computationalism were just a mapping, we could never falsify it; we could always find a new map to fit the data. But if computationalism requires causal isomorphism, we can break it. We can intervene. Optogenetics allows us to flip specific "bits" (neurons) and see if the "output" (behavior) changes as the computational model predicts. If the brain were merely metaphorically computational, these interventions would be noise. If it is substantively computational, the interventions should follow the logic of the model. When we stimulate the motor cortex and the hand moves, we are verifying that the causal structure implements a control algorithm.

  However, this brings us to your objection: "False." Is the brain a computer? Here, we must be precise about definitions. If "computer" means a Von Neumann architecture—a digital, sequential, clock-driven device with separated memory and processing—then the claim is literally false. The brain is parallel, analog-digital hybrid, asynchronous, and memory is distributed across the processing weights. Your roommate is making a category error by conflating "computation" with "laptop."

  But this does not mean computation is a metaphor. It means the class of computational systems is broader than the class of human-made digital computers. The substantive sense in which the brain is a computer is not architectural identity, but **causal-functional isomorphism**.

  Here is the verdict: The brain is not a computer in the artifact sense, but it is a **computational system** in the ontological sense.

  To say it is a computational system is to say that its causal powers are organized such that it manipulates information-bearing states according to rules. This is not a projection. It is a physical fact about how the system is wired. The "information" is not mystical; it is the specific configuration of the system that makes a difference to future states. When a retinal ganglion cell fires, it is not just a chemical event; it is a state transition that carries data about light contrast, which is then used by downstream circuits to compute edge detection. The "computation" is the process by which the physical structure transforms input patterns into output patterns via intermediate state changes that are functionally individuated.

  This distinction matters for your work. If you treat computation as a metaphor, you might look for biological correlates of "software" that don't exist. If you treat it as literal architectural identity, you will look for clock cycles and registers that aren't there. But if you treat it as causal-functional organization, you look for the mechanisms that support counterfactual state transitions. You look for how the system would behave if inputs changed, and you verify that the physical substrate supports those transitions.

  Your roommate is right that the brain processes information via rule-governed state transitions. You are right that it does not do so like a PC. The synthesis is that computation is a level of abstraction that is *realized* by the physics, not just imposed upon it. It is real because the causal structure of the brain respects the boundaries of the computation. If the brain did not respect those boundaries, you couldn't predict behavior from neural activity, and you couldn't alter behavior by altering neural activity.

  Therefore, the claim "the brain is a computer" is technically imprecise but ontologically serious. It is not empty, because it demands a specific causal structure that not all physical systems possess. It is not false, provided we define "computer" as "a physical system that implements a formal machine via causal isomorphism" rather than "a device made by Apple."

  The brain is a biological automaton. It is a machine made of meat, governed by the same logical constraints as a machine made of silicon, but engineered by evolution for different constraints. It computes not because we say it does, but because its causal structure is the only thing that explains how light hitting the retina becomes a hand catching a ball. That is not a metaphor. That is the mechanism.
