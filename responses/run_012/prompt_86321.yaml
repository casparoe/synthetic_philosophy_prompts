eas Lewis was more careful about distinguishing conventional norms from moral obligations. The book treats Lewis's theory as a complete explanation of social rules, whereas Lewis intended it as an account of a specific class of social phenomena. By lumping taxes and promises with driving without qualification, the summary ignores the complex motivational structures involved in moral behavior that go beyond simple coordination. It assumes that because the mechanism looks similar externally, the internal justification is identical, which Lewis did not strictly argue. The summary implies Lewis solved the problem of moral obligation, when he actually solved the problem of social coordination. This conflation allows the book to make the controversial moral claim that Lewis himself left more open.

  The objection at the end
  The complaint about feeling bound highlights a gap between description and normativity. Lewis explains why we *do* follow rules, but the objection points out that morality involves why we *ought* to follow them even when expectations fail. If I expect everyone else to drive on the left, I should too, but only for safety. If I expect everyone else to steal, morality suggests I should not. The feeling of bindingness indicates that moral rules claim authority independent of general compliance. This does not refute Lewis's account of how conventions function, but it limits its scope. It shows that while some social rules are conventions, morality likely contains elements that are not arbitrary regularities. The objection suggests that reducing morality to convention misses the distinctive categorical force of moral claims. Therefore, the objection limits the theory's application rather than destroying its internal logic regarding coordination. It validates your instinct that the comparison feels wrong without disproving the mechanics of the driving example.

  Does the closing conclusion follow?
  No, the leap from conventions to morality being nothing more than a convention is invalid based on the premises given. The summary establishes that some rules are conventions, but it does not prove that all rules, specifically moral ones, are merely conventions. Even if language and driving are conventional, morality might involve values that are not arbitrary. The argument assumes that because some social regularities are self-sustaining expectations, all normative systems must be too. This ignores the possibility that moral rules are grounded in welfare, rights, or reason rather than mere coordination. The summary conflates the origin of a rule with its justification. Even if morality arose as a convention, it might have evolved into something binding independently of current expectations. Therefore, the conclusion that morality is nothing more than a convention is an unsupported extrapolation from the specific cases of driving and language.

  A defensible restatement
  Lewis argues that many social rules arise from coordination problems where everyone benefits from doing the same thing. Which side of the road we choose is arbitrary, but once chosen, it persists because everyone expects everyone else to follow it. This mutual expectation, known by all, makes the rule self-sustaining without need for laws or agreements. Lewis shows this model explains language well, where words function as signals we all agree to use. However, while this explains how some norms stabilize, it does not necessarily explain all moral obligations. Some rules, like promising or paying taxes, involve conflicts of interest that simple coordination does not fully capture. So, while many social habits are conventions sustained by expectation, morality may involve deeper obligations that go beyond mere regularity. We can accept Lewis's mechanism for social order without agreeing that morality is nothing more than a traffic rule.
