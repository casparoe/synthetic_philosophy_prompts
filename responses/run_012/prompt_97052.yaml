answer: |-
  **Exam Question: Democratic Theory Midterm**

  **Question 4 (20 marks)**
  Consider a five-member tenure committee voting on three propositions: **R** (Research strong), **T** (Teaching strong), and **G** (Grant tenure). The departmental standard mandates $G \iff (R \land T)$. The votes are:
  *   M1: R=Y, T=Y, G=Y
  *   M2: R=Y, T=Y, G=Y
  *   M3: R=Y, T=N, G=N
  *   M4: R=N, T=Y, G=N
  *   M5: R=Y, T=N, G=N

  Your friend Priya argues the resulting inconsistency is merely an artifact of bare majority rule (50%+1) and proposes two fixes: (1) raise the threshold to two-thirds for all propositions, or (2) vote only on the conclusion **G**.

  (a) Calculate the collective judgments under issue-by-issue majority rule. Explain why the result is inconsistent despite every member being consistent. (5 marks)
  (b) Evaluate Priya's two fixes. For each, determine the outcome on *this* profile and assess whether it escapes the problem *in general*. (10 marks)
  (c) Conclude whether the dilemma is about the 50% cutoff or something structural regarding agenda connectivity. (5 marks)

  ***

  **Model Answer**

  (a) Applying issue-by-issue majority rule to the profile yields collective judgments of R=Yes (4 votes), T=Yes (3 votes), and G=No (3 votes against). Although every member satisfies the departmental standard G iff (R and T), the collective output violates it: the committee affirms both necessary conditions but rejects the consequence. This demonstrates the discursive dilemma: aggregating consistent individual judgments via majority rule can produce an inconsistent collective set. The inconsistency arises not from individual irrationality, but from the aggregation method itself.

  (b) Priya's first proposal raises the acceptance threshold to two-thirds. On this specific profile, R passes (4/5), but T fails (3/5 is 60%, below the 66% required) and G fails. The resulting set (Yes, No, No) is logically consistent. However, this fix fails generally. The discursive dilemma is not unique to simple majority; it arises at any supermajority quota short of unanimity. If voters disagree on which premise fails, the premises can individually clear a high bar while the conclusion does not. For instance, if different minorities reject R and T, the conjunction may lack sufficient support even if each conjunct passes. Raising the threshold reduces the probability of inconsistency but does not eliminate the structural possibility.

  Priya's second proposal adopts a conclusion-based procedure, voting only on G. On this profile, G is rejected (2/5 support). This guarantees consistency because the logical connection to R and T is severed during aggregation. Generally, this escapes the inconsistency entirely. However, it sacrifices transparency and reason-giving. A conclusion-based procedure ignores whether the committee agrees on why a decision was made. It allows tenure denial despite a majority believing research is strong, potentially undermining legitimacy. It solves the logical problem by abandoning the premise-based deliberation required by the department's written standard.

  (c) Therefore, Priya's assertion that the dilemma is merely an artifact of the 50% cutoff is mistaken. The core issue is structural, stemming from the incompatibility of satisfying Universal Domain, Anonymity, Systematicity, and Consistency simultaneously (List & Pettit 2002). The dilemma emerges whenever an agenda contains logical connections and judgments are aggregated proposition-wise. Changing the quota alters the boundary conditions but leaves the structural tension between independence and consistency intact. The dilemma reveals a fundamental limit on democratic aggregation over connected propositions, not merely a flaw in simple majority rule. No quota-based fix resolves the impossibility theorem without sacrificing either consistency or responsiveness to premises. The problem lies in the topology of the agenda, not the height of the threshold. Consequently, committees must choose between premise-based procedures (risking inconsistency) and conclusion-based procedures (sacrificing responsiveness to reasons). This trade-off confirms the dilemma is inherent to connected agendas.

