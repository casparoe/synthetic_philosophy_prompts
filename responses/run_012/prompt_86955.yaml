answer: |-
  This is an excellent observation, and you have correctly identified the central tension in modern applied statistics. The short answer is that standard scientific practice (NHST + Confidence Intervals) is **philosophically incoherent**. It employs frequentist *machinery* to calculate numbers, but relies on Bayesian or Propensity *semantics* to interpret them. It is not merely "sloppy"; it is a stabilized institutional hybrid that smuggles inductive conclusions out of deductive error rates.

  Here is the carving-up of the commitments, the consistency check, and the practical implications of resolving the incoherence.

  ### 1. The Diagnosis: The "Frequentist-Bayesian Hybrid"

  To understand what view the practice presupposes, we must distinguish between the **validity conditions** (what makes the math work) and the **inferential claims** (what the scientist concludes).

  **A. What the Practice Strictly Presupposes (The Validity Conditions)**
  The calculation of a $p$-value and a Confidence Interval (CI) mathematically requires a **Frequentist** interpretation of probability.
  *   **The Reference Class:** To compute $p = 0.03$, you must assume a hypothetical infinite sequence of replications of the experiment under the null hypothesis. Probability is defined strictly as the long-run relative frequency in this reference class.
  *   **Fixed Parameters:** The formalism treats the true effect size as a fixed constant, not a random variable. Therefore, strictly speaking, $P(H_0)$ is either 0 or 1, and it is meaningless to assign a probability distribution to it.
  *   **Pre-data Error Rates:** The 95% in a 95% CI refers to the *procedure's* performance over many samples, not the specific interval's probability of containing the parameter.

  If you abandon the frequentist definition of probability (long-run frequency in a hypothetical collective), the $p$-value and CI lose their mathematical derivation. You cannot calculate them using subjective degrees of belief or single-case propensities.

  **B. What the Practice Tacitly Commits To (The Inferential Claims)**
  However, when a researcher writes, "There is a significant effect ($p < .05$)," they are almost never making a behavioral decision about a long-run sequence (the strict Neyman-Pearson view). They are making an inductive claim about the specific case at hand.
  *   **The Inverse Probability Error:** Interpreting $p=0.03$ as "there is a 3% chance this is a fluke" is a claim about $P(H_0 | \text{Data})$. This is a **Subjective/Bayesian** claim (degree of belief in the hypothesis) or a **Propensity** claim (the chance setup of this specific study was unlikely to produce noise).
  *   **The CI Interpretation:** Believing the specific calculated interval has a 95% probability of containing the truth is a **Bayesian** claim (a Credible Interval).

  **Verdict:** The practice presupposes **Frequentism for justification** but **Bayesianism/Propensity for utility**. It attempts to use forward probabilities ($P(\text{Data} | H_0)$) to justify backward inferences ($P(H_0 | \text{Data})$). This is logically invalid without a prior, which is why the practice is philosophically unstable.

  ### 2. Internal Consistency and Lindley's Paradox

  You asked whether the practice is internally consistent, citing the divergence between frequentist rejection and Bayesian support for the null (often called Lindley's Paradox).

  **The Inconsistency:**
  The practice is **not** internally consistent. It claims to control error rates (a frequentist goal) while claiming to provide evidence for the truth of a hypothesis (a Bayesian goal).
  *   **Frequentist Question:** "Assuming the null is true, is this data atypical?" (Focus: *Surprise of the data*).
  *   **Bayesian Question:** "Given this data, is the null hypothesis plausible compared to the alternative?" (Focus: *Probability of the hypothesis*).

  **Why they diverge:**
  In a large sample, a frequentist test can detect a trivially small deviation from the null (yielding $p < 0.05$) because the test is sensitive to $N$. A Bayesian analysis, however, penalizes the alternative hypothesis for being vague (the "Ockham's Razor" effect of Bayes Factors). If the alternative is "the effect is anything other than zero," the data might still favor the precise null "effect = 0" because the data is concentrated near zero, even if it is technically inconsistent with exact zero.

  **Which question is science answering?**
  Ordinary scientific practice *wants* to answer the Bayesian question ("Is the effect real?"). However, it uses a tool designed to answer the Frequentist question ("Is the noise unlikely?"). When $N$ is large, the tool says "Yes, noise is unlikely" (Significant!), but the actual answer to the scientific question might be "No, the effect is too small to matter" (Null favored). The practice masks this divergence by treating "Significant" as synonymous with "Real/Important."

  ### 3. Reconstructing the Commitments

  Here is the breakdown of what the current NHST/CI paradigm rules out and what it can reconcile with.

  **Ruled Out:**
  1.  **Strict Subjectivism (Pure Bayesianism):** You cannot run a standard $t$-test without assuming a fixed parameter and a sampling distribution. Pure subjectivism rejects the idea of "objective" error rates independent of priors.
  2.  **Strict Propensity:** While propensity fits the idea of a "chance setup," it struggles with point null hypotheses. Does nature have a physical propensity to produce *exactly* zero effect? Usually, propensities are continuous. NHST treats the null as a sharp point, which is physically implausible under a propensity view but mathematically necessary for the test.

  **Reconcilable (with caveats):**
  1.  **Error Statistics (Mayo):** This is a sophisticated frequentist view. It argues that $p$-values are not measures of belief, but measures of *severity*. A claim is warranted only if it has passed a test that would likely have found errors if they existed. This reconciles the frequentist math with scientific inference *without* smuggling in Bayesian probabilities. It requires changing the language from "probability of hypothesis" to "capability of the test to detect errors."
  2.  **Fiducial Inference (Fisher):** This was Fisher's attempt to bridge the gap (assigning probability to parameters without priors). It is largely considered mathematically failed, but it accurately describes the *tacit* logic of most psychologists. It is reconcilable with the *practice* but not with rigorous probability theory.

  ### 4. Counterfactual 1: Switching to a Consistently Frequentist View

  If you forced the practice to align strictly with the **Neyman-Pearson (Behavioral)** frequentist interpretation (which is the only consistent frequentist view for hypothesis testing), day-to-day practice would change drastically.

  *   **Reporting:** You would stop reporting $p$-values as measures of evidence. You would report only the decision rule: "We reject $H_0$ at $\alpha = 0.05$." The specific value ($p=0.03$ vs $p=0.001$) would be irrelevant; both lead to the same behavior.
  *   **Language:** You would never say "the effect is significant" (which implies importance) or "there is an effect." You would say, "The result falls in the rejection region." You would explicitly acknowledge that $H_0$ might still be true (Type I error).
  *   **Confidence Intervals:** You would report CIs only as a summary of the test's precision, not as a range of plausible values. You could not say, "We are 95% confident the true mean is in this range." You would say, "This procedure captures the true mean 95% of the time in the long run."
  *   **Design/Pre-registration:** This view *demands* strict pre-registration. Because the error rates depend on the sampling plan (e.g., when you stop collecting data), "peeking" at data invalidates the long-run error rate. Optional stopping would be strictly forbidden.
  *   **Power:** You would be required to report $\beta$ (Type II error rate) and Power *before* the study. A significant result from an underpowered study would be treated with the same behavioral weight as one from a high-powered study, though the latter is preferred for efficiency.

  **Philosophical Cost:** You lose the ability to make inductive inferences about specific theories. You gain a consistent logic of quality control, but you can no longer claim your specific result makes a hypothesis "probable."

  ### 5. Counterfactual 2: Switching to a Consistently Subjective View

  If you forced the practice to align strictly with **Subjective Bayesianism**, the changes would be equally radical but in a different direction.

  *   **Reporting:** You would report **Posterior Probabilities** or **Bayes Factors**. Instead of $p=0.03$, you would report "$P(H_1 | \text{Data}) = 0.97$" or "$BF_{10} = 5$."
  *   **Language:** You *could* say, "There is a 95% probability the true effect lies in this interval" (Credible Interval). You could directly compare the probability of the null vs. the alternative.
  *   **Priors:** You would be required to specify and justify a **Prior Distribution** for the effect size. You could no longer test a point null ($H_0: \delta = 0$) against a vague alternative without acknowledging how the prior weight on the null affects the result.
  *   **Design/Pre-registration:** Optional stopping becomes permissible. Because the posterior updates coherently with each data point, you can stop collecting data whenever the posterior probability exceeds a threshold. Pre-registration is less critical for validity (though still good for transparency).
  *   **Sample Size:** Determined by **Precision Goals** (how narrow do you want the Credible Interval?) rather than Power (how often do you want to reject a false null?).

  **Philosophical Cost:** You lose the claim to "objectivity" provided by error rates. Your results depend on your priors. Two researchers with different priors can look at the same data and conclude different things, and both are "correct" within the framework.

  ### Summary of Commitments

  | Feature | Current Hybrid Practice | Strict Frequentist (N-P) | Strict Subjective (Bayesian) |
  | :--- | :--- | :--- | :--- |
  | **Probability Meaning** | Ambiguous (Freq. math, Bayes. language) | Long-run Frequency | Degree of Belief |
  | **Hypothesis Status** | Treated as probabilistic (tacitly) | Fixed (True/False) | Probabilistic (Random Variable) |
  | **P-value / Statistic** | Measure of Evidence | Trigger for Action | Replaced by Posterior/BF |
  | **Interval Meaning** | "95% chance truth is here" (Wrong) | "95% coverage in long run" | "95% probability truth is here" |
  | **Stopping Rule** | Often flexible (violates Freq.) | Strictly Fixed | Flexible (Irrelevant) |
  | **Primary Goal** | Inductive Inference (about truth) | Inductive Behavior (error control) | Inductive Inference (belief update) |

  **Conclusion:**
  The practice you observe is not committed to a single interpretation of probability. It is committed to **Frequentism as a constraint** and **Bayesianism as a goal**. It is internally inconsistent because it tries to derive the latter from the former without the necessary bridge (priors). To make it consistent, you must either abandon the desire to assign probabilities to hypotheses (Strict Frequentism) or abandon the reliance on long-run error rates for inference (Strict Bayesianism). The current hybrid persists not because it is philosophically sound, but because it offers the *rhetoric* of objective proof (via $p$-values) with the *psychological comfort* of belief (via interpretation), allowing scientists to bypass the difficult work of specifying priors or accepting the limitations of behavioral decision rules.
