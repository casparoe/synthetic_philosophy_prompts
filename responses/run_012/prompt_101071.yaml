  Me and a couple friends have a little philosophy reading group going and we've been working through stuff about truth and paradox, and I've gotten stuck on something I genuinely can't tell is deep or if I'm just being dumb. Here's the thing. Everyone treats the liar paradox -- you know, "this sentence is false" -- as this massive deal, and the story I keep hearing is that any language that can talk about its own truth is going to blow up, so your only real options are either to somehow forbid sentences from referring to themselves, or to bite the bullet and say that some contradictions are actually true. But forbidding self-reference seems obviously hopeless, because we say true things about ourselves all the time, like "this sentence has five words," which is just a normal sentence that happens to be about itself. So it feels like we're basically forced into the contradiction option, and honestly I'm kind of fine with that, but I want to know if I'm missing some third door.

