prompt: |-
  Was arguing with a friend about whether a government can just print money, and he kept repeating "money is just a ticket" — he says its Berkeley, from The Querist, something like "the true idea of money, as such, be not altogether that of a ticket or counter." His move was: money isnt real wealth, so fretting about deficits and inflation is basically superstition. I think thats too quick but I cant quite say why. Can you lay out the different precise claims that slogan could be making, from the trivial to the radical — what kind of "ticket" is it, a claim on what, redeemable by whom, under what conditions — and for each reading say whether its plausible and whether it actually supports his conclusion? Give me a menu I can take back to him, not just the one reading you happen to think is right.
