answer: |-
  Your transition from treating the demandingness objection as a seminar puzzle to living it as a operational constraint provides a valuable vantage point for diagnosing this philosophical stalemate. When you allocate a fixed budget knowing that every dollar retained for overhead or personal comfort is a dollar not saving lives, the abstract worry about sacrifice becomes concrete. Your first hypothesis, that the dispute rests on divergent baselines regarding compliance conditions, captures a significant source of confusion but ultimately fails to explain the depth of the disagreement. It is true that the magnitude of the demand shifts drastically depending on whether we assume a world of full compliance, where everyone gives their fair share, or the actual world of partial compliance, where you are among the few contributing substantially. Defenders of consequentialism often argue that the theory is only crushing because others fail to do their part, implying that in a justified world the burden would be light. Critics, however, often insist that morality must be livable in the world as it is, not as it should be. Yet even if we settle on a single baseline, the disagreement persists. If everyone complied fully, consequentialism would still require you to abandon personal projects the moment they ceased to be optimally productive, and critics like Bernard Williams would still object that this alienates you from your own life. Conversely, in a world of partial compliance, some consequentialists admit the burden is extreme but argue that the severity of the need overrides the cost to the agent. Therefore, while the compliance baseline affects the calculation of how much is demanded, it does not resolve the normative clash over whether morality is permitted to make such claims on the agent in the first place. The stalemate is not merely about the size of the bill, but about who has the authority to write it.

  Your second hypothesis, distinguishing between an occurrent and a structural notion of demandingness, offers a more promising diagnostic tool, though it too requires refinement to fully map the landscape. The occurrent notion focuses on specific acts of sacrifice, such as the decision to donate a bonus rather than buy a car, which is the primary focus of Peter Singer's early work. The structural notion concerns the standing condition of the agent's life, specifically whether one's projects and attachments are held provisionally, always subject to being overridden by the impartial calculus. This distinction illuminates why some responses to the objection talk past each other. A consequentialist might argue that the theory does not demand constant misery, pointing out that resting and maintaining friendships is often instrumentally useful for doing good, thereby addressing the occurrent burden. However, this misses the structural critique that even if resting is permitted, it is permitted only contingently. The moral permission to love your child or pursue your art is revocable at any moment should the utility calculus shift, which critics argue destroys the integrity of those attachments. You cannot fully inhabit a project if you must always hold it at arm's length, ready to discard it for the greater good. Thus, the debate is stalled because one side is defending the livability of the daily routine while the other is attacking the metaphysical status of the agent's commitments. When critics say consequentialism is too demanding, they often mean it is structurally alienating, while defenders hear a complaint about material hardship and offer solutions based on efficiency and burnout prevention.

  Diagnosing the disagreement as a conflation of compliance baselines and modalities of demand suggests that the conflict is partly verbal but rooted in a substantive divergence about the function of moral theory. The parties are not simply using the word demanding to mean different things; they are operating with different conceptions of moral agency. The side insisting that morality is simply whatever is required views the agent as a vessel for value creation, where the source of the demand is external and impartial. The side insisting on protected room for personal projects views the agent as a source of value, where commitments generate reasons that are not fully reducible to impartial outcomes. Progress in this debate, therefore, would not come from one side convincing the other that their baseline is correct or their definition of demandingness is precise. Instead, progress would look like a disaggregation of the demandingness objection into distinct complaints that can be addressed separately. We should distinguish the complaint about material deprivation, which might be solved by economic growth or broader participation, from the complaint about integrity and alienation, which strikes at the heart of impartial morality. If we treat these as separate issues, we might find that consequentialism can accommodate the structural need for ground projects through rules or dispositions, even if it maintains high occurrent demands in crises.

  Given your position in effective altruism, where you navigate these tensions daily, the most productive path forward is likely a change of question rather than a resolution of the old one. Instead of asking whether consequentialism is too demanding, the field would benefit from asking what kind of moral psychology is sustainable for long-term impact. This shifts the focus from the justification of the theory to the feasibility of the agent. It acknowledges that a theory which requires agents to dismantle their psychological integrity may be self-defeating, not because the theory is false, but because it cannot be inhabited. This does not concede the normative point to the critics, but it accepts their descriptive insight about human agency. Progress would involve developing a vocabulary that separates the urgency of the need from the structure of the commitment, allowing practitioners to acknowledge the structural revocability of their projects without feeling that this negates the genuine value of pursuing them. By recognizing that the stalemate arises from mixing questions about compliance conditions, modalities of requirement, and the nature of agency, you can move beyond the binary of acceptance or rejection. The goal is not to prove the objectors wrong about the feeling of demand, but to clarify whether that feeling signals a flaw in the theory or a tragic feature of the world we inhabit. Ultimately, the disagreement may not be resolvable because it reflects a fundamental tension between the impartiality required by justice and the partiality required by a meaningful life, and acknowledging this tension is more honest than trying to argue it away.
