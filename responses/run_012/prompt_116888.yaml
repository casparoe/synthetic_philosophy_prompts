          *   *EDVAC Report:* Defined the architecture (CPU, Memory, I/O, Stored Program). Inspired by mathematical logic. Brain analogy was present but rudimentary (neurons as relays).
          *   *The Computer and the Brain:* Written later, deeper dive into neurophysiology. Von Neumann realized the analogy was superficial. He saw the brain as *sui generis*.
          *   *Did he change his mind?* Not exactly "changed," but *deepened*. He moved from "brain is like a computer" to "computers are primitive compared to the brain; let's see what we can learn from the brain."

      *   **Issue 2: Von Neumann Architecture vs. Brain Architecture.**
          *   *vN Arch:* Separation of memory and processing. Digital (binary). Serial processing (mostly). High precision, low reliability components (actually high reliability components, but logic is brittle).
          *   *Brain:* Memory distributed/associative (Hebbian). Analog/Digital hybrid (spikes are digital-ish, potentials are analog). Massive parallelism. Low precision, high reliability via redundancy.
          *   *Conclusion:* The laptop is *not* built like the brain. The name "von Neumann" applies to the laptop architecture, not necessarily his final view of the brain.

      *   **Issue 3: Computationalism (Mind as Program).**
          *   Does the failure of the vN analogy kill computationalism? No.
          *   Computationalism relies on *Turing Machines* (abstract computation), not specifically *von Neumann Machines* (specific hardware architecture).
          *   Connectionism (Neural Nets) is also computational but non-vN.
          *   So, "Mind = Program" can survive "Brain $\neq$ Laptop."

      *   **Issue 4: The Misattribution/Cultural Memory.**
          *   Why the confusion? Cybernetics era (Wiener, McCulloch-Pitts). The metaphor was catchy. "Brain = Computer" became a slogan. Von Neumann got the blame/credit because his name was on the architecture.
          *   The grad student is right: It was often a heuristic, but hard science often reifies heuristics.

      *   **Issue 5: The Von Neumann Bottleneck.**
          *   Technical term: Speed limit caused by separating CPU and Memory (data transfer).
          *   Relevance to brain: The brain *doesn't* have this bottleneck (memory is local to processing). This supports von Neumann's later view that the brain is different.

