answer: |-
  It is entirely understandable that you found your colleague's remark frustrating. In the context of the replication crisis, the aphorism 'absence of evidence is not evidence of absence' is frequently deployed as a rhetorical shield to protect established theories from falsification. While the phrase contains a kernel of logical truth, it is often stretched to cover methodological sins. To dissect this properly, we must distinguish between the logical, methodological, and evidential claims embedded in the sentence.

  Below, I set out four distinct theses that the sentence might express, ranging from the trivial to the radical, evaluating their defensibility and their statistical underpinnings.

  ### Thesis 1: The Logical Truism
  **The Claim:** The proposition 'Effect $E$ exists' is not logically contradicted by the proposition 'We failed to observe $E$ on this occasion'.
  **Status:** **Defensible (Trivial).**
  **Presuppositions:** This treats 'evidence' as a binary observation (observed/not observed) and relies on formal logic.
  **Analysis:** Logically, $P \to Q$ does not mean $\neg Q \to \neg P$ unless the implication is biconditional. Failing to detect a signal does not prove the signal is not there; one might simply be looking in the wrong place or with the wrong tools.
  **Frequentist vs. Bayesian:** Both frameworks accept this logical point. A frequentist 'failure to reject the null' is not an acceptance of the null. A Bayesian update requires a likelihood ratio; if the data are impossible under both hypotheses, no update occurs.
  **Power:** This thesis holds regardless of power, but it becomes vacuous if power is high.
  **Verdict:** This is a tautology. It is true but offers no guidance on how to interpret scientific data.

  ### Thesis 2: The Methodological Caveat
  **The Claim:** A null result constitutes evidence against the effect *only if* the study possessed sufficient statistical power (sensitivity) to detect it.
  **Status:** **Defensible (Standard Practice).**
  **Presuppositions:** 'Evidence' is defined as informative data. 'Absence of evidence' here means 'data collected via an insensitive instrument'.
  **Analysis:** This is the substantive core of the phrase. If a study is underpowered (high Type II error rate), a null result is uninformative. It is an 'absence of evidence' because the net was too coarse to catch the fish.
  **Frequentist:** A non-significant result ($p > .05$) in a low-power study tells us nothing about the truth of $H_0$. In a high-power study (e.g., 95% power to detect the effect size of the original), a null result implies the true effect is likely smaller than the Minimum Detectable Effect.
  **Bayesian:** This maps onto the precision of the posterior distribution. If the prior is diffuse and the likelihood is flat (noisy data), the posterior remains diffuse (absence of evidence). If the likelihood is peaked around zero (precise data), the posterior shifts towards the null (evidence of absence).
  **Verdict:** This is the only scientifically robust reading. It shifts the debate from philosophy to experimental design.

  ### Thesis 3: The Evidential Neutrality Claim
  **The Claim:** A null result provides *no* probabilistic support for the null hypothesis over the alternative hypothesis, regardless of sample size.
  **Status:** **Contentious (Often False).**
  **Presuppositions:** 'Evidence' is treated as asymmetric; only positive detections count as evidence.
  **Analysis:** This suggests that data clustering around zero is neutral. This is incorrect in most inferential frameworks.
  **Frequentist:** While one cannot 'accept' $H_0$, one can reject specific alternative hypotheses (e.g., 'the effect is of magnitude $d = 0.5$'). Thus, the null result is evidence *against* large effects.
  **Bayesian:** This is demonstrably false. A Bayes Factor ($BF_{01}$) can quantify evidence *for* the null. If the data are much more likely under $H_0$ than $H_1$, the absence of a signal is precisely evidence of absence.
  **Verdict:** This reading is statistically naive. It ignores the likelihood of the data under the alternative hypothesis.

  ### Thesis 4: The Immunity Claim
  **The Claim:** Theoretical entities are insulated from empirical falsification by null results; only positive replications count.
  **Status:** **False (Pseudoscientific).**
  **Presuppositions:** 'Evidence' is defined solely as verification. This presupposes a dogmatic commitment to the theory.
  **Analysis:** If no number of failed replications can count as evidence against a theory, the theory is unfalsifiable.
  **Frequentist/Bayesian:** Both frameworks rely on the possibility of disconfirmation. A sequence of high-powered null results will eventually drive the $p$-value for a meta-analysis to significance or the Bayes Factor decisively in favour of the null.
  **Verdict:** This renders the theory non-scientific.

  ---

  ### Statistical Nuance: Frequentist vs. Bayesian Treatments

  To understand why your colleague's remark is often a platitude, one must distinguish how 'absence' is quantified.

  In a **Frequentist framework**, a null result is merely an 'absence of evidence' against the null. It does not provide 'evidence of absence' of the effect unless one conducts an equivalence test or analyses power post hoc. If the replication had low power, Thesis 2 applies: the result is inconclusive. However, if the replication was pre-registered with high power (e.g., $N$ calculated to detect the original effect size with 90% power), the frequentist is licensed to infer that the original effect size was likely inflated or non-existent. Here, absence of evidence (significance) *becomes* evidence of absence (of a meaningful effect size).

  In a **Bayesian framework**, the distinction is sharper. 'Absence of evidence' corresponds to a Bayes Factor near 1 (the data are equally likely under both models). 'Evidence of absence' corresponds to a Bayes Factor $> 1$ in favour of the null. A well-designed study that yields data tightly clustered around zero provides strong evidence for the null. To claim 'absence of evidence is not evidence of absence' in a Bayesian context is to claim that the likelihood of the data under the null is never higher than under the alternative, which is mathematically untenable for precise null results.

  ### Licensing the Dismissal

  Does any of this license your colleague's dismissal of the failed replication?

  **Only Thesis 2 licenses the dismissal, and only conditionally.**
  If the failed replication was underpowered, noisy, or methodologically flawed compared to the original, then the null result is indeed an 'absence of evidence' rather than 'evidence of absence'. In this specific case, the colleague is correct to withhold judgement. However, in the context of the replication crisis, many large-scale replications (e.g., the Many Labs projects) are explicitly designed with high power. If the replication was high-powered, Thesis 2 does not apply, and the dismissal is unwarranted.

  Thesis 3 and Thesis 4 do not license the dismissal scientifically; they license it only rhetorically, by changing the rules of inference to protect the theory.

  ### Undermining the Original Finding

  Crucially, does the reading that licenses the dismissal also undermine the original finding? **Yes, almost invariably.**

  If your colleague relies on **Thesis 2** (Power), they must apply it consistently. If the failed replication is dismissed because it might be a false negative due to noise or low power, one must ask: *Was the original study sufficiently powered to rule out a false positive?*
  In the replication crisis, original studies are notoriously underpowered. If the standard for 'evidence of presence' requires high power to avoid false positives, and the standard for 'evidence of absence' requires high power to avoid false negatives, the original finding is often the first to crumble. An underpowered original study that found a significant effect is statistically likely to have exaggerated the effect size (the 'winner's curse').

  If your colleague relies on **Thesis 3 or 4** (Neutrality/Immunity), they are adopting a confirmation bias that undermines the scientific status of the original finding. If null results cannot count against a theory, then positive results cannot logically count for it in a falsificationist framework. By insulating the theory from disconfirmation, they render the original 'evidence' merely anecdotal.

  ### Conclusion

  Your colleague's remark is largely platitude masquerading as profundity.
  1.  **As a logical truism (Thesis 1)**, it is true but useless.
  2.  **As a methodological check (Thesis 2)**, it is vital, but it cuts both ways: it demands we scrutinise the power of the replication *and* the original.
  3.  **As a claim about evidential weight (Thesis 3 & 4)**, it is false. In a high-powered study, absence of evidence *is* evidence of absence.

  Unless your colleague can demonstrate that the replication was methodologically inferior or critically underpowered, the phrase is being used to immunise a belief against data. In British academic terms, it is a 'get-out clause' rather than a substantive defence. You are well within your rights to ask them to specify the power analysis of the replication; if the power was high, their aphorism ceases to apply.
