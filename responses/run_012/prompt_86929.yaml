          2.  Cognitive bounds/Heuristics (strong).
          3.  AI Inner Alignment (nuanced).
      *   *Self-Gaming:* Concede that "agent" might need to be modular.
      *   *AI:* Wave off as supporting evidence.
      *   *Falsifiability:* Warn about the "homunculus" trap.

  9.  (Self-Correction during drafting): I need to be careful not to confuse Goodhart's Law with the Principal-Agent Problem. They are related but distinct. Goodhart's is "When a measure becomes a target, it ceases to be a good measure." Principal-Agent is "Agents act in their own interest, not the principal's." The user is claiming Goodhart's *is actually* Principal-Agent. I need to show cases where Goodhart's happens *without* Principal-Agent dynamics.

