answer: |-
  You are describing a real and documented phenomenon, but you are right: there is no single, canonical noun phrase that captures the *tactical oscillation* itself. You have correctly identified the gap in the literature.

  Here is the landscape of what exists, why it falls short, and the coinage you asked for.

  ### 1. The Existing Proximity (Why your Google failed)
  You are standing at the intersection of three literatures, each of which names the *states* but not the *slide* between them.

  *   **Wittgenstein (*On Certainty*):** You already know this. He names the floor ("hinge propositions") and the doubt ("moves in the language-game"). He treats hinges as relatively stable within a form of life. He does not theorize the *tactical migration* of a hinge into a claim within a single discourse.
  *   **STS (Latour/Callon):** Latour comes closest. In *Science in Action*, he discusses **"modulating modality."** He describes how scientists treat a fact as a "black box" (solid, unquestioned) when building an argument, but open the black box (treat it as constructed, contingent) when defending it. However, Latour usually treats this as a feature of the *lifecycle of a fact* (stabilization vs. destabilization), not necessarily as a rhetorical move within a single argumentative exchange.
  *   **Argumentation Theory (Walton/Pragma-Dialectics):** They discuss **"shifting the burden of proof"** and **"presumptions vs. assertions."** A presumption is a floor; an assertion is a claim. But the literature focuses on the *rules* for shifting burdens (who owes proof to whom), not the *structural slippage* where the status of the proposition itself changes without announcement.

  **The Gap:** Existing terms describe the *positions* (Hinge, Black Box, Presumption) or the *norms* (Burden of Proof). None name the *unmarked transition* between them that allows the arguer to have it both ways.

  ### 2. The Coinage: **Epistemic Status Toggling**
  Since you need a handle for your dissertation, I propose **Epistemic Status Toggling** (or, more metaphorically, **Hinge Drift**).

  **Definition:**
  *Epistemic Status Toggling* is the rhetorical maneuver wherein a specific proposition is treated as an **unquestioned background condition** (floor/hinge/presumption) when it serves to support a conclusion, but is treated as a **contested empirical claim** (chair/move/assertion) when that same proposition is challenged, without an explicit acknowledgment of the status change.

  ### 3. The Carving (Boundaries and Edges)
  To use this in your writing, you need to know where the concept ends. Here is the carving:

  **What it COVERS (The Core):**
  *   **Identity:** The proposition remains semantically identical (e.g., "The mind is the brain"). Only its *epistemic weight* changes.
  *   **Immediacy:** The toggle happens within the same argumentative context or thread (as in your reading group example). It is not a case of "I believed X last year, but now I need evidence for X."
  *   **Unmarked Transition:** The speaker does not announce, "I am now shifting this from a presumption to a claim." The shift is invisible to the audience unless they are tracking the status closely.
  *   **Function:** It functions to immunize the argument. If challenged, the proposition becomes a claim (demanding evidence the challenger may not have). If needed for leverage, it becomes a floor (demanding no evidence).

  **What it DOES NOT Cover (Exclusions):**
  *   **Equivocation:** Equivocation is changing the *meaning* of a term (e.g., "theory" meaning "hunch" vs. "scientific theory"). Epistemic Status Toggling keeps the meaning stable but changes the *justificatory requirement*.
  *   **Moving the Goalposts:** This changes the *criteria for success* (e.g., "Okay, you showed X, but now you need to show Y"). Toggling changes the *status of the premise* (e.g., "X is obvious" vs. "Prove X").
  *   **Legitimate Context Switching:** If I am talking to a neuroscientist, "mind is brain" is a floor. If I am talking to a dualist philosopher, it is a claim. Moving between those audiences is not toggling; that is **contextual appropriateness**. Toggling happens when the *context* hasn't changed, but the *tactic* has.
  *   **Bayesian Updating:** If new evidence arrives that destabilizes a prior certainty, treating a former floor as a claim is rational learning. Toggling is *strategic* or *structural*, not driven by new external data.

  **Edge Cases (The Gray Zone):**
  *   **The "Teaching" Move:** An expert might treat something as a floor to simplify a lesson, then treat it as a claim when a student asks "why." Is this toggling? *Verdict:* No, if the pedagogical frame is explicit. It becomes toggling if the expert pretends the floor was never a simplification.
  *   **The "Core Set" Boundary (Collins):** In the sociology of scientific knowledge, Harry Collins describes the "Core Set" of experts where everything is contested, vs. the public where facts are solid. If a scientist speaks as a public intellectual (floor) then retreats to the core set (claim) to defend against criticism, is it toggling? *Verdict:* Yes, this is a classic STS example of the phenomenon, often called **"Boundary Work"** (Gieryn), but *Epistemic Status Toggling* is the specific rhetorical mechanism *within* that boundary work.

  ### 4. How to Deploy This in Your Dissertation
  Since you are in STS, you should anchor this in **Latour's "Modality"** but push it further.

  *   **Cite:** Latour, *Science in Action* (on black boxing and modality).
  *   **Cite:** Wittgenstein, *On Certainty* (on hinges).
  *   **Cite:** Douglas Walton, *Appeal to Expert Opinion* (on burden of proof).
  *   **Your Intervention:** Argue that while Latour describes the *lifecycle* of a black box, and Wittgenstein describes the *necessity* of hinges, neither fully captures the *rhetorical volatility* of hinges in live discourse.
  *   **Use the term:** "I argue that this is not merely bad faith, but a structural instance of **Epistemic Status Toggling**, where the proposition functions as a hinge in the premise-position and a claim in the conclusion-position."

  ### Summary
  *   **Does it have a name?** No single canonical noun.
  *   **Closest concepts:** Latour's "Modulation of Modality," Pragma-Dialectics "Shifting Burden of Proof."
  *   **Coined Term:** **Epistemic Status Toggling**.
  *   **The Carving:** It is distinct from equivocation (meaning change) and goalpost moving (criteria change). It is specifically the unmarked shift in *justificatory status* of a stable proposition within a single context.

  This gives you a precise tool to analyze the *structure* of the argument without getting bogged down in accusing your subjects of "bad faith," which fits the STS commitment to symmetry and description.
