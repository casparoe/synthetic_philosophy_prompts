      *   (2) Gödel 1: $G_F$ is true/unprovable in $F$. $G_F \leftrightarrow \text{Con}(F)$.
      *   (3) Claim: Mathematician can see $F$ is consistent $\rightarrow$ sees $G_F$ is true.
