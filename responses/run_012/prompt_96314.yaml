answer: |-
  The financial practices you describe presuppose a rejection of the **Common Prior Assumption**. Specifically, the industry operates on the view that rational agents can hold **Heterogeneous Priors**—meaning they start with different fundamental models of how the world works or how to value assets—even when looking at the same public information.

  This is the only position that reconciles the existence of research-driven trading with the logic of Aumann's Agreement Theorem. If the industry accepted the Common Prior Assumption (that all rational people start with the same probability assessments and update identically), active research-based trading would be mathematically impossible to justify.

  Here is the defense of this position, an analysis of the industry's internal consistency, and the consequences if the Aumann view were adopted.

  ### 1. Why the Practice Requires Heterogeneous Priors

  You correctly identify that Aumann's Agreement Theorem (and the related Milgrom-Stokey No-Trade Theorem) dictates that two rational agents with **Common Priors** cannot agree to disagree, nor can they engage in speculative trade based solely on information asymmetry. If I know you are rational and we share a prior, the fact that you are willing to sell me a stock tells me you have negative information about it. I should update my belief and not buy. Trade collapses.

  For the financial industry to function as it does—spending billions on analysts to interpret public filings and news—it must assume that **interpretation is not uniform.**

  *   **Research-Driven Trading:** When an analyst buys a stock from a seller who has read the same 10-K filing, the buyer is asserting: "My model of how this data translates to future cash flows is superior to yours." This is not just private information (we both read the filing); it is a **different prior** regarding the valuation model itself. If priors were common, the same data would force the same price. The industry presupposes that "skill" is the ability to hold a *correctly different* prior (model) from the market consensus.
  *   **Information Barriers (Chinese Walls):** These protect private information, creating asymmetry. However, under the Common Prior assumption, asymmetry alone does not justify trade (due to the No-Trade Theorem mentioned above). For the bank to profit from this asymmetry, it must also assume that the counterparty on the other side of the wall *cannot* or *will not* correctly infer the bank's private information from their willingness to trade. This implies the counterparty has a different model of the situation (Heterogeneous Priors) or is not fully rational.
  *   **Index Funds:** This product presupposes that for *most* participants, the cost of developing a superior prior exceeds the benefit. It admits that while Heterogeneous Priors exist (allowing some to win), identifying *which* prior is superior in advance is nearly impossible for the average investor. Thus, the index fund is a bet on the **aggregate** prior (the market price) rather than an individual one.

  Therefore, the practice does not merely "fit" Heterogeneous Priors; it **requires** them. If you assume Common Priors, you cannot justify paying an analyst to interpret public data, because rational consensus would already be priced in.

  ### 2. Internal Consistency of the Cluster

  Is this cluster of practices internally consistent? **Yes, but only under a specific conception of rationality known as "Bounded Rationality" or an "Ecological" view of markets.**

  The three commitments (Active Research, Index Funds, Chinese Walls) form a coherent ecosystem if you view the market as a mechanism for aggregating diverse, imperfect models:

  1.  **Active Research** provides the diversity of opinion (Heterogeneous Priors) necessary to discover true value. Without this, prices would not reflect deep analysis.
  2.  **Index Funds** acknowledge that most individual priors are noisy or inferior to the aggregate. This is consistent with Heterogeneous Priors because it admits that while priors *differ*, most differences are not *profitable*.
  3.  **Chinese Walls** acknowledge that some priors are based on private information that, if leaked, would converge the market (destroying the profit opportunity).

  The tension you sense arises only if you demand **Idealized Rationality** (the Aumann standard). Under Idealized Rationality + Common Priors, the cluster is impossible. Under Bounded Rationality + Heterogeneous Priors, the cluster is consistent. The industry effectively argues: "The market is efficient enough that most should index (Index Funds), but inefficient enough that those with superior models or private info can profit (Active/Walls)." This is known in economics as the **Grossman-Stiglitz Paradox**, and the industry resolves it by assuming information gathering is costly and models differ.

  ### 3. What Would Change if Aumann's View Were True?

  If the financial industry accepted the **Common Prior Assumption** and **Perfect Rationality** inherent in Aumann's theorem, the following changes would be mandatory:

  1.  **Active Research for Trading Would Vanish:** Analysts could still research companies to advise *management* on how to run the business (real investment), but they could not research stocks to *trade* them. If priors are common, the current price already reflects all rational interpretations of public data. Spending money to re-interpret public data would be mathematically futile.
  2.  **Speculative Volume Would Collapse:** Almost all trading volume would disappear. Trade would only occur for **liquidity or hedging needs** (e.g., "I need cash for a house" or "I need to offset a risk in my business"), not because one side thinks the asset is undervalued and the other overvalued.
  3.  **Chinese Walls Would Be Unnecessary:** If Common Priors held, you could not profit from private information against a rational counterparty (because they would infer your information from your trade). Therefore, preventing information flow would have no economic value for trading purposes.

  ### 4. Defense Against Alternatives

  You asked whether the practice requires different starting beliefs, private information, or simply overconfidence. I must defend why **Heterogeneous Priors** is the correct answer over the alternatives.

  *   **Against "Just Private Information":** As noted, the No-Trade Theorem proves that private information alone is insufficient for trade between rational agents with common priors. If I know you have private info, and I know we share a prior, I trust your willingness to trade more than my own guess. Trade stops. The industry spends heavily on *public* data (filings, news), which implies the edge comes from *processing* (Priors), not just *access* (Information).
  *   **Against "Just Overconfidence/Mistakes":** It is true that in reality, much trading is driven by overconfidence (a form of irrationality). However, the *practice*—the justification for the fees, the hiring of PhDs, the construction of models—cannot presuppose "We are hiring you to be overconfident." The industry must presuppose that **different models yield different valid valuations.** If they admitted it was purely overconfidence, the business model would be exposed as a casino. To maintain the claim of "professionalism" and "fiduciary duty," the industry must presuppose Heterogeneous Priors (that there is a *correct* divergent view), even if the *reality* is often overconfidence.
  *   **Against "Indifference":** The practice is not indifferent. A firm that truly believed in Common Priors would shut down its proprietary trading desk immediately. The fact that they do not proves they operationally reject the Common Prior Assumption.

  ### Conclusion

  The financial industry's practices presuppose that **rational agents hold Heterogeneous Priors.**

  This view holds that two rational people can look at the same evidence and legitimately reach different conclusions because their underlying models of value differ. This is the only framework that allows for research-driven trading without admitting that the traders are simply irrational. It renders the cluster of practices (Active, Index, Walls) internally consistent as a system for managing diverse information and models. If the industry were to adopt the Common Prior view of Aumann's theorem, active asset management would cease to exist, reducing the market to a utility for liquidity and hedging alone.
