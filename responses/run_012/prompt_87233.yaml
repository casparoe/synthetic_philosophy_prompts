  **Joint Statement on Pain Asymbolia**

  **Agreed Claims**
  1.  **Phenomenology:** Asymbolia patients exhibit dissociation between sensory-discriminative capacity (location, intensity) and affective-motivational response (unpleasantness, withdrawal).
  2.  **Tracking:** In typical functioning, "pain" tracks a complex state involving both sensation and negative valence; dissociation is pathological.
  3.  **Drug 1 (Sensory+/Affective-):** Both sides agree this state is physically possible. Separators classify it as pain (sensory node intact); Lumpers classify it as non-painful sensation (valence node absent). This drug isolates the conceptual battlefield.
  4.  **Drug 2 (Affective+/Action-):** Both sides agree this state preserves pain. Lumpers argue valence constitutes pain; Separators argue valence + sensory constitutes pain, but akinesia does not negate either. Drug 2 confirms pain does not *require* action, only valence.
  5.  **Dissociation Criteria:** A clean dissociation requires verified intact discrimination alongside zero reported unpleasantness.
  6.  **Dispute Nature:** Disagreement is partly substantive (phenomenology) and partly semantic (extension of "pain").

  **Disagreements**
  | Point | Separators | Lumpers | Crux | Test | Predictions |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Asymbolic Qualia** | Pain qualia present; suffering absent. | Pain qualia absent; non-pain sensation present. | Is suffering constitutive of qualia? | Phenomenological interview. | Sep: "Hurts fine." Lump: "Pressure ok." |
  | **Drug 1 (No Unpleasantness)** | Pain persists. | Pain abolished. | Is unpleasantness necessary? | Subject report under Drug 1. | Sep: "Painful." Lump: "Sensation." |
  | **Terminology** | "Pain" tracks sensory type. | "Pain" tracks bad experience. | Linguistic intuition. | Folk usage surveys. | Sep: Accepts "unfelt pain." Lump: Rejects. |

  **Verbal Dispute**
  The conflict is partially verbal. Both sides agree on the non-linguistic facts: the neural dissociation, the behavioral outputs, and the phenomenological reports (interpreted differently). The dispute concerns the extension of the word "pain." Separators define it by sensory signature; Lumpers by negative valence. If we stipulate "Pain*" for sensory node and "Pain**" for negative experience, substantive disagreement vanishes regarding Drug 1 outcomes, leaving only the question of which mapping best serves scientific practice. However, substantive disagreement remains regarding whether the sensory node *alone* can constitute a conscious experience identical to pain's sensory aspect without valence altering the qualia itself.

  **Substantive Remainder**
  Even if terminology is standardized, a substantive question persists: Does removing unpleasantness alter the sensory qualia, or merely the reaction to it? Separators claim the "hurt" quality remains identical; Lumpers claim the "hurt" quality *is* the unpleasantness, so removing it changes the sensation to pressure or touch. This is empirically testable via fine-grained phenomenological reporting under Drug 1. If subjects report "sharpness" without "badness," Separators are substantively correct. If subjects report "pressure" or "tingle," Lumpers are substantively correct. The verbal dispute masks this empirical question; resolving the terminology allows us to see the actual disagreement about the structure of conscious experience.

  **Conclusion**
  We agree on the data and the drug scenarios. We disagree on the classification of Drug 1 states and the essential properties of pain. We acknowledge that much of the debate is verbal, hinging on the definition of "pain," but a core substantive disagreement remains regarding the modularity of sensory qualia and affective valence. Future work should focus on Drug 1 phenomenology rather than semantic definitions.
