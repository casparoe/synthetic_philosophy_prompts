answer: |-
  # JOINT STATEMENT ON EXPERIENCE AND REPORT

  ### I. Agreed Claims
  *We, the undersigned, accept the following stipulations and data points as the fixed ground for this dispute. We reject dualism regarding physical machinery and accept that the physical story is complete.*

  1.  **Physical Closure:** Every utterance, button press, and physical report is fully caused by prior physical states according to physical law. No non-physical energy enters the system to produce behavior.
  2.  **Channel Stipulation:** For the purpose of this inquiry, we accept the distinction between a **Report Channel** (mechanisms producing utterances/outputs) and an **Experience Channel** (mechanisms constituting the felt character of states). Both are fully realized in the brain.
  3.  **Reliability Datum:** In standard conditions, there is a robust, reliable correlation between the character of experience (e.g., feeling red) and the content of the report (e.g., saying "red").
  4.  **The Aboutness Burden:** Any viable theory must explain how a report comes to be *about* an experience. We agree that if the experience does not causally influence the report, the claim that the report refers to the experience requires a specific explanation of how that reference is secured.
  5.  **Dial Validity:** The "Surgeon's Two Dials" scenario constitutes a valid test case for probing the relationship between the channels, regardless of current technological feasibility. We agree to state our predictions for it explicitly.
  6.  **Training Accuracy:** In the "Trained Subject" case, subjects achieve high accuracy in naming experiences without other cues. This accuracy is a fact to be explained, not denied. We agree that explaining *what* this accuracy is accuracy *about* is essential.

  ### II. Points of Disagreement
  *We disagree on the metaphysical relationship between the channels and the definition of causation. Below we specify where we part ways, using our own wording, and identify the specific cruxes that sustain the disagreement.*

  | Neutral Wording of Disagreement | Epiphenomenalist Version | Causalist Version | The Crux (Sub-question) | Bearing Case / Argument | Predictions (Stated in Advance) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Possibility and Outcome of Dial 1**<br>(Change Experience, Keep Report Identical) | **Possible.** The physical state driving the report can remain fixed while the experiential property varies. The subject feels green but says "red" because the report machinery is untouched. | **Impossible/Incoherent.** Experience is a property of the physical state driving the report. You cannot change the experience without changing the physical state, which changes the report. | Is experience separable from the causal powers of the physical state that produces the report? | **Dial 1 Intervention.** | **Epi:** Subject feels Green, Reports "Red".<br>**Caus:** Dial cannot be turned; or if forced, Report changes to "Green". |
  | **2. Ground of Reference (Aboutness)**<br>(What makes the report *about* the experience?) | **Common Cause.** The report is about the experience because both are effects of the same physical cause. Reference is secured by reliable covariance, not direct contact. | **Direct Causation/Identity.** The report is about the experience because the experience (or the state constituting it) causes the report. Reference requires causal contact. | Is common-cause correlation sufficient for intentionality, or does reference require causal production? | **The Aboutness Problem.**<br>(If E doesn't cause R, why is R about E?) | **Epi:** Accuracy proves the common cause is stable.<br>**Caus:** Accuracy proves experience plays a causal role. |
  | **3. Definition of Causation**<br>(What does it mean to say experience causes the report?) | **Productive.** Cause means transfer of energy or information flow. Experience has no output flow; it is a terminal property. | **Counterfactual/Functional.** Cause means difference-making. If the experience were different, the report would be different. Therefore experience causes the report. | Is causation purely productive (energy transfer) or does it include counterfactual dependence? | **Dial 2 Intervention**<br>(Change Report, Keep Experience) | **Epi:** Easy. Change the Report Channel output rules.<br>**Caus:** Hard. If Experience is the state, changing the output rule may alter the experience. |

  ### III. Assessment of the Dispute

  **Verbal vs. Genuine Disagreement**
  Some portion of this fight is verbal, specifically regarding the word "cause." The Epiphenomenalist uses a productive definition (energy/information flow), while the Causalist uses a counterfactual definition (difference-making). If we standardized on one definition, some rows in the table would collapse. However, the disagreement over **Dial 1** is genuine and metaphysical, not verbal. It concerns whether experiential properties can vary independently of the physical mechanisms that produce reports. If experience is identical to or constituted by the functional state, Dial 1 is impossible. If experience is a non-functional property of that state, Dial 1 is possible. This is not a matter of wording; it is a disagreement about the supervenience of consciousness.

  **Conditions for Mind Change**
  We agree on what would force us to revise our positions. The Epiphenomenalist would change their mind if it were demonstrated that changing the experiential character *necessitates* a change in the report output, even when the physical report-mechanism is held constant (proving identity). The Causalist would change their mind if a case were produced where the report remains byte-for-byte identical while the experience demonstrably changes (proving separability). If neither case can be empirically or logically settled—if the link between experience and physical state is necessarily opaque to third-person observation—we agree that this specific dispute cannot be resolved by evidence alone and rests on differing prior commitments regarding parsimony and intuition.
