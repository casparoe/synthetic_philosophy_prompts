prompt: |-
  I'm a research engineer on a small interpretability team — my day job is training objectives, reward models, probing classifiers, and alot of ablation studies where I try to figure out whether some feature "means" what my probe claims it means. A friend in my cohort is a philosophy PhD working on the teleosemantics program (Millikan, Dretske, that crowd — the idea that a state's content is fixed by the biological function of the mechanism that produces it, i.e. by what it was selected for, not by what it currently does or how it's wired up). We got into an arguement about this over drinks and I came away thinking the whole thing is a fancy way of saying "a representation means whatever the thing that built it was optimizing it to do," and she thinks that's a cheap shot that misses what the view is for. I'd like to actually test that rather than win the argument.

  So: take the teleosemantic program — the real core commitments, not a strawman — and restate it as faithfully as you can in the vocabulary I actually use: training objective and loss, reward specification, training distribution and distribution shift, selection pressure, distillation, ablations, probes, what a model is optimized for versus what it happens to compute. I'm fluent in that vocabulary, so don't dumb it down, but also don't let my vocabulary quietly do the philosophers' work for them — if you need to import a notion like "proper function," or "what the state is supposed to do," and there's no ML counterpart, say so and mark it rather than paraphrasing it into something I already believe. Then the part I actually care about, the residue report. Which teleosemantic claims come through cleanly, which survive only with distortion, and which have no counterpart at all in my vocabulary? Three cases keep tripping me up: (a) misrepresentation — an output that's just wrong is, to me, nothing but high loss, and I can't locate the normativity the philosophers seem to need; (b) the disjunction problem, where a detector fires for two different things and the question is which one it "really" represents — my instinct is that this gets settled by the training distribution plus downstream use, and I want to know whether that's an answer or a change of subject; and (c) the swampman-style case, a system that's a molecule-for-molecule duplicate of something that represents things but has no history at all, which in my world looks like a randomly-initialized net that happens to behave identically to a trained one, or a distilled student that only ever saw a teacher's outputs — I don't feel the pull of the intuition there and I want to know whether that's a blind spot in my framework or a genuine insight.

  Finally, give me the verdict on the residue itself: is what's left over a defect of my vocabulary (it genuinely can't express something real about content), or a sign that the original claim was less clear than it looked and my translation just exposed that? Please don't hand me a bibliography or name-drop papers at me — I can't look anything up right now and it wouldn't help. Structure it as: "My vocabulary, as I'm handing it to you" (short, under 200 words, so I can see which terms you're using and how you're using them); "The translation, piece by piece" (the long section, around 700 words, each core teleosemantic commitment followed by its ML counterpart and a tag — clean, fudged, or no counterpart); "Residue report" (around 400 words on what didn't survive, organized around my three cases); and "Verdict: defect or deflation" (around 250 words). Lead the whole thing with a one-line version of what teleosemantics is that you think survives translation best.
