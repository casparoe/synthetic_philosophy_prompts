  ### The Leaves

  **Leaf 1: Empirical Welfare Economist**
  *   **Commitment:** Permissibility tracks actual net welfare outcomes for the agent.
  *   **Worst Case:** The **Payroll Default (Case 1)**; must deny that low participation rates justify the default if some individuals lose out financially.

  **Leaf 2: Rule Welfarist**
  *   **Commitment:** Permissibility tracks general rules known to maximize welfare, not case-by-case outcomes.
  *   **Worst Case:** The **Car Chime (Case 4)**; must deny that hidden irritation is wrong if the general rule of safety chimes saves lives.

  **Leaf 3: Utilitarian Social Planner**
  *   **Commitment:** Permissibility tracks aggregate welfare across all affected parties.
  *   **Worst Case:** The **Betting App (Case 6)**; must deny that individual psychological harm outweighs system-wide savings or benefits.

  **Leaf 4: Fiduciary Welfarist**
  *   **Commitment:** An agent acting on behalf of another must prioritize that specific other's welfare above all.
  *   **Worst Case:** The **Utility Thermostat (Case 5)**; must deny that grid benefits justify any deviation from the household's optimal comfort setting.

  **Leaf 5: Deontological Kantian**
  *   **Commitment:** Respect for rational agency forbids burdening the exit or manipulating the choice architecture.
  *   **Worst Case:** The **Payroll Default (Case 1)**; must deny that auto-escalation is okay even with a one-click opt-out, as it treats the agent as a means.

  **Leaf 6: Rights-Based Libertarian**
  *   **Commitment:** Rights are respected if physical exit is possible, regardless of the cost or friction involved.
  *   **Worst Case:** The **Clinician (Case 3)**; must deny that framing violates rights if the patient physically retains the choice to refuse.

