  *   **Yes:** (It can be wrong despite helping.) → **Branch B: Non-Welfarist**

  ---

  ### Branch A: Welfarist (Root = No)

  **Node A1:** Consider the **Utility Thermostat (Case 5)**. It lowers the household's bill but mainly serves the grid. Does the permissibility of this intervention depend on whether the household *also* saves money?
