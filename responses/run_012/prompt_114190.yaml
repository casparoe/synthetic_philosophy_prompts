answer: |-
  **Verdict**

  You have identified a genuine inconsistency, but it is not a philosophical error; it is a functional feature. The combination of practices presupposes **Strategic Instrumentalism**. It uses methodological individualism as a *legitimacy shield* for models, holism as a *narrative device* for communication, and aggregative utilitarianism as a *normative shortcut* for policy. There is no coherent implicit theory of social ontology binding these together. The "theory" is simply: *Do whatever allows the model to close, the speech to persuade, and the decision to be made.*

  I am **highly confident** in this reading. The inconsistency you point to is not a bug to be reconciled but a division of labor between the *internal game* of academic/policy modeling (where rigor is defined by microfoundations) and the *external game* of governance (where agency must be attributed to manageable entities like "the market").

  The question doing the most work in this answer is **Question 4 (Internal Consistency)**. Once you admit the package is inconsistent, the other questions dissolve into explanations of *why* the inconsistency is tolerated.

  ***

  **Reconstruction of the Implicit Theory**

  **1. View of Social Explanation: Ritualistic Individualism**
  The modeling practice does not actually commit to the thesis that social facts *must* be explained in terms of individuals. If it did, public analysis would not revert to holist language ("the market believes"). Instead, it commits to the thesis that *models must be derivable* from individuals to count as "science." This is a criterion of validity, not a claim about truth. The implicit theory is that individual optimization is the *currency of rigor*, not necessarily the *mechanism of reality*. It is a gatekeeping device. Once the model passes the gate, the explanatory burden shifts to whatever heuristic works for the audience.

  **2. The Single-Household Device: Computational Fiction**
  The representative agent is not a commitment to the existence of an aggregate agent. It is a **closure condition**. In dynamic stochastic general equilibrium (DSGE) modeling, you cannot solve the system without assuming away heterogeneity. However, it is treated *as if* it were real during the modeling phase to satisfy the rigor constraint, and then treated *as if* it were false during the welfare phase (where distribution matters) or the communication phase (where "confidence" matters). It is a "useful fiction" that is ontologically suspended depending on the task.

  **3. Underdetermination: Metaphysics is Decorative**
  The practice does not strictly require the presupposition of individualism. It would survive under a holist reading if the profession's incentives changed. The metaphysics is not doing the work; **tractability** is. The reason individualism is mandated is not because it is true, but because it allows for unique equilibria and clean welfare theorems. If holist models were more tractable, they would be used. The metaphysics is credited with the rigor that actually belongs to the mathematics.

  **4. Internal Consistency: Genuine Contradiction**
  The package is **internally inconsistent**.
  *   **Model:** The economy is one person (no distribution, no coordination problems).
  *   **Speech:** The economy is a crowd with moods (coordination problems, distribution implied by "confidence").
  *   **Welfare:** The economy is a utilitarian sum (distribution ignored, but gainers/losers implicitly acknowledged by the need to maximize *total* consumption).
  You cannot consistently hold that the economy is a single agent (who cannot lack confidence in himself or trade with himself) and simultaneously argue that policy must boost "business confidence" (which implies a separation between the state and the firms) or worry about aggregate demand shortfalls (which implies coordination failures impossible for a single agent). This is not a subtle tension; it is a logical contradiction.

  **5. Asymmetric Individualism: Coherent but Unused**
  "Asymmetric individualism" (individual causes, irreducible aggregate predicates) is coherent. It is essentially **non-reductive physicalism** applied to social science. It acknowledges that while only individuals act, the *mapping* is non-linear and lossy, making aggregate predicates (like "recession" or "panic") causally indispensable for explanation.
  *Would the practice need it?* Yes, desperately. It would allow the central bank to speak truthfully about "market sentiment" without violating its own microfoundations.
  *Why don't they use it?* Because it destroys the welfare theorems. If aggregate states are irreducible, you cannot simply maximize the utility of the representative agent to find the "optimal" policy. You have to make political choices about which aggregate states to prefer. The profession avoids this because it wants policy to look like engineering, not politics.

  **6. The Counterfactual: What Would Change?**
  *   **If True Individualism:** Models would become intractable (heterogeneous agents). Public communication would become humble ("We model individuals, but we cannot predict the crowd"). Welfare analysis would have to explicitly weight gainers vs. losers, admitting policy is distributive, not just efficiency-enhancing. **Lost:** The illusion of technical neutrality.
  *   **If True Holism:** Models would lose their "microfounded" legitimacy in academic journals. Public communication would become more honest about aggregate forces. Welfare analysis would focus on systemic stability rather than utility maximization. **Lost:** The claim that policy is derived from "first principles" rather than historical regularity.

  ***

  **Meta-Commentary on Your Framing**

  Your framing is **not confused**. You have correctly identified that the profession engages in a form of **ontological schizophrenia**.

  However, do not look for a reconciliation. The inconsistency is not a mistake to be solved; it is the price of admission for the profession's current status.
  1.  **Microfoundations** buy academic legitimacy (we are rigorous scientists).
  2.  **Holist Speech** buys political influence (we understand the real world).
  3.  **Aggregative Welfare** buys decisional simplicity (we can tell the Minister what to do).

  If you force them to be consistent, you break the machine. If they adopt true individualism, they lose the ability to speak about "market confidence." If they adopt true holism, they lose their claim to scientific superiority over political intuition.

  **Confidence and Guessing**
  *   **Confidence:** 90% that the inconsistency is real and functional.
  *   **Confidence:** 85% that "Strategic Instrumentalism" is the correct label for the implicit theory.
  *   **Guessing:** I am guessing less on the logic and more on the *sociology* of the central bank. I am inferring intent from output. It is possible some practitioners believe the representative agent is real, but their behavior suggests otherwise.

  **Conclusion**
  You asked me to say plainly if this is just a division of labor between a tractable model and a persuasive speech act. **It is exactly that.** The "implicit theory" is a post-hoc rationalization for using different tools for different audiences. The contradiction is the seam where the science ends and the politics begins. Acknowledging this would strip the technocrat of their authority, which is why the inconsistency is maintained rather than resolved.
