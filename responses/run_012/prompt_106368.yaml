      *Also, check the UK comparison.* In the UK, Royal Assent is technically still required, but convention says it's automatic. If the King refused, it would be a crisis. In Belgium, the King *sanctions* and *promulgates*. It's slightly more active. I need to be precise there.

      *Verdict:* I will argue it was **Robust**. The system worked *because* it allowed the fiction. A rigid system would have broken.

      *(Self-Correction on Verdict)*: Actually, looking deeper at the theory... is it robust to rely on a legal lie? Or is that fragility? No, constitutional conventions *are* lies we agree to tell. So leaning into the lie is actually adhering to the spirit of constitutional monarchy (prioritizing stability over literalism). I'll stick with Robust/Principled.

      *Wait, one nuance:* The user asked "Did Baudouin effectively use a veto?" I need to answer that directly. He didn't use a veto; he used a *blocker* that forced a refactor. A veto stops the law. The law passed. So it wasn't a veto. It was a conditional resignation.

