prompt: |-
  Hey, I'm putting together a handout for a grad seminar on distributive justice and I need a decision tree, not an essay. You're a political philosopher who knows the luck-egalitarianism debate cold, so take your time, brainstorm the logical space before you commit to a shape, and then draw it.

  Here's the setup. A student walks in agreeing with one thing: that it's unfair when someone ends up worse off through no fault of their own. I want a tree that starts from that single commitment and, through a run of concrete questions, drops them onto a named position. Every node has to be phrased as a question or a mini-case a student can answer without already knowing which leaf it leads to. So no node that just asks "are you a luck egalitarian?" and no node that names a theorist and asks if you agree with him.

  Please build the tree around at least these split points, in roughly this order:

  - What's the currency — resources, welfare, or opportunity-for-advantage? (Ask this as a question about which of two people is worse off in a described case, not as "which currency do you favor?")
  - What makes a disadvantage "unchosen"? I want the tree to force a choice between three readings: the person literally could not have done otherwise; the person had no fair opportunity to avoid it; or the person had an opportunity but it was so costly that we shouldn't count it. Use a case that pulls these apart — someone who took a gamble they didn't have to take, say.
  - Responsibility as a gate versus responsibility as a weight. This is the distinction I actually care about and it's the reason I'm doing this: does tracing a disadvantage to someone's choice kill the claim for compensation outright (a gate), or does it just lower the weight of the claim without zeroing it (a weight)? I don't think anyone has laid this out cleanly, so if the literature doesn't cleanly separate the two, say so and leave the branch in anyway.
  - The site of the luck: is the relevant bad luck at the level of the individual, or at the level of a group or category the person didn't choose to belong to? Push a case where someone's disadvantage traces to a group-level fact (a labor market, a neighborhood) rather than a personal one.
  - Equality or priority? Is the point to close gaps or to raise a floor, with gaps left alone above the floor?
  - And a branch for the "abandonment" worry: does the person hold onto luck egalitarianism after noticing that it seems to license leaving the reckless and the feckless to their fate, or do they bail to relational/democratic equality?

  I want 8 to 10 branching nodes and 6 to 9 leaves. For each leaf, give the position a content-description in one line, attach the standard name where there is one (I'll fill in the citations myself, so don't bother with a reading list), and add one sentence on that leaf's most awkward commitment. Put at least one leaf in that nobody actually defends, if the tree generates one, and say why it's empty — incoherent, just unattractive, or merely unexplored.

  Two things I need flagged rather than fudged. First, if any two leaves end up separated only by a distinction a student wouldn't recognize as real, say so instead of pretending the tree separates them. Second, tell me which combinations of answers the tree rules out and why.

  Format: start with one sentence naming the single distinction that ends up doing the most sorting work, then give me the tree itself, then the notes on empty leaves and inseparable pairs. No preamble, don't restate the assignment back to me.
