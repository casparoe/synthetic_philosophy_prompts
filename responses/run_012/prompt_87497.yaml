answer: |-
  The distinction between treating responsibility as a complete bar to compensation versus a mere discount on the claim does the most sorting work in this space.

  ### Distributive Justice Decision Tree

  **Start:** You agree it is unfair when someone ends up worse off through no fault of their own.

  **Node 1: The Currency of Disadvantage**
  *Case:* Person A loses $10,000 savings due to a flood. Person B suffers a depression that reduces their life satisfaction by an equivalent amount, also due to a flood. Both had equal initial wealth. Who is worse off in the sense that justice cares about?
  *   **A is worse off (Resources):** Go to Node 3.
  *   **B is worse off (Welfare):** Go to Node 2.

  **Node 2: The Metric of Welfare**
  *Case:* Person C is content but lacks basic capabilities (cannot read, vote). Person D is miserable but has full capabilities (can read, vote, but chooses not to). Who has the disadvantage justice should fix?
  *   **C (Objective Advantage/Opportunity):** Go to Node 3.
  *   **D (Subjective Happiness):** Go to Node 3.
  *(Note: Paths converge at Node 3, but the theoretical commitment differs.)*

  **Node 3: The Meaning of "No Fault"**
  *Case:* Person E is blind from birth. Person F becomes blind after staring at the sun for a bet. Who counts as suffering through "no fault of their own"?
  *   **Only E (Literal Impossibility):** Go to Node 5.
  *   **E and F (Choice Involved):** Go to Node 4.

  **Node 4: The Quality of the Choice**
  *Case:* Person F (from Node 3) took the bet for fun. Person G took a similar bet because they were coerced by poverty or addiction. Is G's disadvantage "unchosen" in the relevant sense?
  *   **No (Choice was fair):** Go to Node 5.
  *   **Yes (Choice was too costly/unfair):** Go to Node 5.
  *(Note: Paths converge at Node 5, but the scope of "luck" differs.)*

  **Node 5: Responsibility as Gate vs. Weight**
  *Case:* Person H drives drunk, crashes, and needs expensive medical care. They are clearly at fault. Does their choice kill their claim for public aid entirely, or just reduce it?
  *   **Kills it (Gate):** Go to Node 6.
  *   **Reduces it (Weight):** Go to Node 6.

  **Node 6: The Site of Luck**
  *Case:* Person I is poor because they lack talent. Person J is poor because their entire industry moved overseas. Does J's group-level bad luck demand a different response than I's individual bad luck?
  *   **No (Individual Site):** Go to Node 7.
  *   **Yes (Structural Site):** Go to Node 7.
  *(Note: Paths converge at Node 7, but the policy focus differs.)*

  **Node 7: Equality vs. Priority**
  *Case:* We can raise the worst-off group by 10 units. Option A: The rich stay still (inequality shrinks). Option B: The rich gain 20 units (inequality grows). Does the growth in inequality matter morally?
  *   **Yes (Equality/Closing Gaps):** Go to Node 8.
  *   **No (Priority/Raising Floor):** Go to Node 8.

  **Node 8: The Harshness Objection**
  *Case:* Person K makes a reckless choice (not coerced, not addicted) and faces starvation. Does your theory require you to let them starve to respect their agency?
  *   **Yes (Stick with Luck Egalitarianism):** **Leaf.**
  *   **No (Bail to Alternative):** Go to Node 9.

  **Node 9: The Alternative Basis**
  *Case:* We save Person K (from Node 8). Is it because they are a fellow citizen entitled to non-domination, or because everyone has a right to a minimum threshold?
  *   **Fellow Citizen (Relational/Democratic):** **Leaf.**
  *   **Minimum Threshold (Sufficientarian):** **Leaf.**

  ***

  ### Leaves (Positions)

  1.  **Resource Luck Egalitarianism (Gate/Equality/Stick):** Justice equalizes resources unless choice intervenes, in which case aid is denied; gaps matter.
      *   *Awkward Commitment:* Must deny life-saving aid to a reckless driver even if it costs society nothing to save them.
  2.  **Resource Luck Egalitarianism (Gate/Priority/Stick):** Justice raises the resource floor unless choice intervenes; gaps above the floor do not matter.
      *   *Awkward Commitment:* **EMPTY LEAF.** Incoherent: A "Gate" denies aid to the worst-off due to fault, making it impossible to prioritize raising their floor.
  3.  **Resource Luck Egalitarianism (Gate/Equality/Bail-Relational):** Starts as LE but switches to relational equality to avoid harshness; focuses on social status.
      *   *Awkward Commitment:* Must explain why status matters more than the resource disadvantage that triggered the theory initially.
  4.  **Resource Luck Egalitarianism (Gate/Priority/Bail-Sufficientarian):** Starts as LE but switches to sufficientarianism to avoid harshness; focuses on thresholds.
      *   *Awkward Commitment:* Abandons the core "luck vs. choice" distinction once the threshold is met, allowing large unfair inequalities.
  5.  **Resource Luck Egalitarianism (Weight/Equality/Stick):** Justice equalizes resources, but responsible choices only discount the claim; gaps still matter.
      *   *Awkward Commitment:* Requires a complex calculus to determine exactly how much aid is reduced by a specific choice.
  6.  **Resource Luck Egalitarianism (Weight/Priority/Stick):** Justice raises the floor, discounting for choice; gaps above the floor do not matter.
      *   *Awkward Commitment:* May require taxing the responsible poor to aid the irresponsible poor if the irresponsible are below the floor.
  7.  **Welfare Luck Egalitarianism (Weight/Equality/Bail-Relational):** Justice equalizes welfare/opportunity, discounts for choice, but bails to relational equality to avoid paternalism.
      *   *Awkward Commitment:* Tension between measuring welfare (intrusive) and respecting relational status (non-intrusive).
  8.  **Welfare Luck Egalitarianism (Weight/Priority/Bail-Sufficientarian):** Justice ensures adequate welfare/opportunity, discounts for choice, bails to threshold view.
      *   *Awkward Commitment:* Risks "expensive tastes" problem where those with costly preferences demand more resources to reach the threshold.

  ***

  ### Notes on Structure and Logic

  **Inseparable Distinctions:**
  Node 2 (Hedonic vs. Objective Welfare) is flagged as converging because, in practice, most theories that reject resources adopt a hybrid "advantage" view that makes the strict binary difficult for students to maintain without collapsing into one of the other leaves; the downstream nodes (Responsibility, Gate/Weight) tend to dominate the final position more than the specific welfare metric.

  **Ruled-Out Combinations:**
  The tree generates Leaf 2 (**Gate + Priority + Stick**), but this position is marked **EMPTY**. It is ruled out because the "Priority" view is defined by a concern for the absolute level of the worst-off, while the "Gate" view licenses leaving the worst-off (if responsible) to their fate. You cannot prioritize raising the floor of the worst-off while simultaneously maintaining a gate that denies them aid based on fault.

  **Node Count vs. Leaf Count:**
  The tree contains 9 branching nodes but only 8 leaves because Nodes 2, 4, and 6 are designed as *path-modifiers* rather than *leaf-generators*; they branch the theoretical commitment but converge before the final outcome, allowing us to explore the logical space without exploding the number of final positions beyond the seminar's scope.
