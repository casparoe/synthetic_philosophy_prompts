prompt: |-
  You're going to be my debate-prep coach for a talk, and I want you to actually think like the people in the room rather than like a generic assistant. Put on two hats at once: (1) a professional philosopher of action who knows the formal side of AI safety well enough to not embarrass themselves, and (2) the specific audience I describe below. Start by brainstorming, in a few lines, what each faction in that audience cares about and what they'd instinctivly reach for, then build the prep sheet. Don't hedge everything — be willing to say which objections are cheap and which are lethal.

  Background: I'm a philosophy professor (action theory, a bit of formal epistemology, basically no ML engineering). In two weeks I'm presenting a paper to a room of about twenty people at an AI safety org. The audience is mostly ML engineers who build or evaluate so-called impact measures / low-impact agents, plus two decision theorists, plus one person who's done formal work on corrigibility and will be the most dangerous questioner. They are smart, fast, and mildly allergic to philosophy; they'll grant you a distinction only if you show it does work. They care a lot about whether a criticism has any engineering payoff, and they're proud of the fact that their objective is supposed to be value-agnostic — that's the whole selling point.

  My thesis (roughly): low-impact AI, i.e. trying to penalize side effects without fully specifying what the agent should value, isn't just hard but incoherent in a specific way. Every impact measure presupposes a privileged default trajectory — a what-would-have-happened-otherwise baseline — and that baseline is a normative choice wearing descriptive clothes. Concretely I distinguish three flavors of default that the literature keeps running together: the null-action default (what happens if the agent does nothing), the intended-action default (what happens if it does exactly what was asked and nothing more), and the human-counterfactual default (what the human would have done in its place). They give different verdicts on the same case, and nobody has said which one the measure is supposed to use. So any given measure is either empty (it penalizes nothing anyone could object to) or it secretly encodes a full value ordering, which defeats the value-agnostic selling point. I'll use a couple of small cases to make it bite — e.g. an agent told to fetch a file that also wrecks a wasp nest on the way, and an agent whose action changes how many people are born downstream.

  What I need from you: a Q&A prep sheet. Give me the eight or so objections I'll actually get from this audience — not the generic is-this-useful ones, but the ones this specific mix of engineers and decision theorists would raise — ordered by how likely they are and how much damage they'd do. Phrase each one the way they'd phrase it, in their vocabulary (reachability, averting, the baseline problem, distributional shift, whatever fits). For each: a two-minute reply, and an honest note on where that reply is soft. Flag which objection I should concede up front, which one I have to win outright, and then tell me the question I'm hoping nobody asks — the one that, if the decision theorist asks it the right way, I probably can't answer on my feet.
reasoning: |-
  Here's a thinking process that leads to the suggested debate-prep sheet:

  1.  **Analyze the Request:**
      *   **Role:** Debate-prep coach.
      *   **Personas:** (1) Professional philosopher of action (formal AI safety literate), (2) The specific audience (ML engineers, decision theorists, corrigibility expert).
      *   **Task:** Brainstorm audience factions/care-abouts, then build a Q&A prep sheet (8 objections, ranked by likelihood/damage).
      *   **Constraints:** Don't hedge. Identify cheap vs. lethal objections. Phrase objections in audience vocabulary. Provide 2-minute replies + honesty about soft spots. Identify concession, must-win, and the "killer question."
      *   **User Profile:** Philosophy professor (action theory/epistemology), no ML engineering.
      *   **Audience Profile:** ~20 people. Mostly ML engineers (impact measures/low-impact agents), 2 decision theorists, 1 corrigibility formalist (dangerous). Smart, fast, allergic to philosophy unless it works. Value-agnostic objective is their pride point.
      *   **User's Thesis:** Low-impact AI is incoherent because impact measures presuppose a privileged default trajectory (normative choice disguised as descriptive). Three flavors of default (null-action, intended-action, human-counterfactual) yield different verdicts. Therefore, measures are either empty or secretly encode values (defeating value-agnosticism).

  2.  **Brainstorming Audience Factions & Instincts:**
      *   *ML Engineers (Impact Measures):* They care about *implementation*. They want a loss function they can code. They view "normative choice" as a spec problem, not a coherence problem. They'll argue we can just *pick* a default and optimize against it. They care about empirical performance (does it stop the vase breaking?).
      *   *Decision Theorists:* They care about *counterfactuals*. They know defining "what would have happened" is messy (causal vs. evidential, pre-commitment, etc.). They'll attack the formalization of the baseline.
      *   *Corrigibility Expert:* They care about *shutdown/interference*. They know that impact measures often conflict with corrigibility (e.g., preventing shutdown looks like high impact). They will attack the link between "impact" and "harm."
      *   *General Vibe:* "Philosophy is nice, but does it stop the AI from killing us?" They value "value-agnosticism" because specifying values is hard. The user's claim that value-agnosticism is impossible is a direct threat to their research agenda.

  3.  **Drafting the Objections (Iterative Process):**
      *   *Idea 1:* "Just pick a default." (Too simple).
      *   *Idea 2:* "We use inaction baselines in practice." (Engineers will say this).
      *   *Idea 3:* "Counterfactuals are standard in RL." (Engineers/DTs).
      *   *Idea 4:* "This is just specification gaming." (Engineers).
      *   *Idea 5:* "Value-agnosticism is an approximation." (Engineers).
      *   *Idea 6:* "The baseline is learned, not chosen." (ML angle).
      *   *Idea 7:* "Corrigibility requires impact measures." (Corrigibility expert).
      *   *Idea 8:* "Formal proof of incoherence?" (DTs).

      *Refining for Vocabulary:* Use terms like *inaction baseline*, *stepwise inaction*, *attainable utility*, *reachability*, *specification*, *reward hacking*, *counterfactual planning*.

      *Selecting the Top 8:*
      1.  The "Just Pick One" Engineering Objection (Most likely).
      2.  The "Stepwise Inaction" Technical Fix (Engineers).
      3.  The "Attainable Utility" Counter (Sota impact measure).
      4.  The "Value-Agnostic is a Heuristic" Defense (Pragmatic).
      5.  The Corrigibility/Shutdown Trap (Corrigibility expert).
      6.  The Counterfactual Formalism Attack (Decision Theorist).
      7.  The "So What?" / Alternative Proposal (Pragmatic).
      8.  The "Normativity is Feature not Bug" (Philosophical jujitsu).

      *Ranking:* Need to order by likelihood + damage.
      *   *High Likelihood/High Damage:* "Just pick a default" (misses the point), "Attainable Utility" (current SOTA), Corrigibility (specific expert).
      *   *Killer Question:* Needs to come from the Decision Theorist or Corrigibility expert regarding the *source* of the normativity.

  4.  **Developing Replies & Soft Spots:**
      *   *Constraint:* 2-minute reply. Needs to be punchy.
      *   *Honesty:* Must admit where the philosophy doesn't solve the engineering problem.
      *   *Strategy:* Concede the easy stuff to save energy for the core thesis (incoherence of value-agnosticism).

  5.  **Identifying the Concession, Must-Win, and Killer Question:**
      *   *Concede:* That we need *a* baseline for code to run. (Don't fight the necessity of implementation).
      *   *Must-Win:* That the choice of baseline *matters normatively* and isn't neutral. (This is the thesis).
      *   *Killer Question:* Something that forces the user to provide the alternative. If impact measures are broken, what do we do? If the answer is "specify values," the engineer says "we can't."

  6.  **Refining the Tone:**
      *   Coach persona: Direct, slightly critical, strategic.
      *   Audience voice: Skeptical, technical, impatient with metaphysics.
      *   Philosopher voice: Precise, distinguishing concepts, but grounded in the formal literature (e.g., citing Armstrong, Krakovna, etc. implicitly).

  7.  **Final Review against Constraints:**
      *   Two hats worn? Yes.
      *   Brainstorming first? Yes.
      *   8 objections? Yes.
      *   Ranked? Yes.
      *   2-min replies + soft spots? Yes.
      *   Concede/Win/Killer identified? Yes.
      *   No hedging? Yes.

  *(Self-Correction during drafting)*: Make sure I don't make the philosophers sound too abstract. The audience hates that. The replies need to translate "normative choice" into "safety risk." The "Killer Question" needs to be specifically about the *decision theory* of the baseline selection, not just "what's your solution." The decision theorist will ask about the *meta-choice*.

  Let's assemble the prep sheet.

  *Faction Brainstorm:*
  *   *ML Engineers:* "Does this break the code?" "Is this just reward hacking?" "We use stepwise inaction, does that fix it?"
  *   *Decision Theorists:* "How are you modeling the counterfactual?" "Causal vs. Evidential?" "Who selects the baseline?"
  *   *Corrigibility Expert:* "If you can't measure impact, how do you prevent instrumental convergence?"

  *Objection Selection:*
  1.  "Stepwise Inaction" (The technical fix they think works).
  2.  "Attainable Utility" (The SOTA counter-argument).
  3.  "Baseline as Hyperparameter" (Engineering pragmatism).
  4.  "Corrigibility requires *some* measure" (The expert's trap).
  5.  "Value-Agnosticism is a Spectrum" (Nuance attack).
  6.  "The Human Counterfactual is Learnable" (ML optimism).
  7.  "Incoherence vs. Difficulty" (Semantic attack).
  8.  "What's the Alternative?" (The pragmatic kill shot).

  *Ranking:* I need to order these by *danger*.
  1.  Attainable Utility (Directly addresses the "value-agnostic" claim).
  2.  Corrigibility/Shutdown (The expert's domain).
  3.  Baseline as Hyperparameter (Most common engineer reaction).
  4.  Stepwise Inaction (Specific technical rebuttal).
  5.  What's the Alternative? (Pragmatic).
  6.  Human Counterfactual Learnable (ML optimism).
  7.  Value-Agnostic Spectrum (Dilution).
  8.  Incoherence vs Difficulty (Semantic).

  Actually, the "Killer Question" should be separate from the 8, or one of the 8 flagged as such. The prompt asks for "the question I'm hoping nobody asks" at the end. So I'll keep it distinct.

  Let's refine the "Killer Question." It should be from the Decision Theorist. "If the baseline selection is normative, on what normative grounds do you select it, and isn't that just value learning?"

  Okay, ready to write.
answer: |-
  ### Audience Faction Brainstorm

  *   **The ML Engineers (Impact/Robustness):** They view "normative choice" as a spec sheet item, not a philosophical crisis. Their instinct is to treat the baseline as a hyperparameter to be tuned via empirical performance (does the agent break fewer vases?). They will defend *stepwise inaction* baselines as a technical fix that dissolves your "three flavors" problem. They care about *attainable utility* and *reachability*.
  *   **The Decision Theorists:** They smell blood on the counterfactuals. They know defining "what would have happened" is formally treacherous (preemption, overdetermination). They won't care about the normativity as much as the *coherence of the counterfactual model*. If your baseline relies on a human counterfactual, they'll ask how that's computed without already solving alignment.
  *   **The Corrigibility Expert:** This is your biggest threat. They know that impact measures are often proposed to preserve the ability to shut the agent down. If you argue impact measures are incoherent, they will ask what replaces them to prevent instrumental convergence. They will frame your critique as undermining safety, not clarifying it.

  ---

  ### Q&A Prep Sheet: Objections & Replies

  **1. The "Stepwise Inaction" Technical Fix**
  *   **Likelihood:** High | **Damage:** Medium
  *   **The Objection:** "You're conflating different baselines, but the literature already solved this with *stepwise inaction*. We compare the current state to the state where the agent did nothing *just now*, rolling forward the previous effects. This avoids the 'null-action' vs. 'intended' ambiguity because it's local. Doesn't that dissolve your trilemma?"
  *   **2-Minute Reply:** "Stepwise inaction isn't a dissolution; it's a specific choice of the 'null-action' default applied iteratively. It works for 'don't break the vase' but fails on 'don't change the future political landscape.' If the agent prevents a war by acting now, stepwise inaction sees high impact. If it does nothing and war happens, it sees low impact. You've just hardcoded a status-quo bias. That's not a technical fix; it's a normative stance that says 'preventing bad things is as bad as causing them.' You haven't removed the value judgment; you've hidden it in the time-step granularity."
  *   **Soft Spot:** You can't offer a better formal baseline. You're admitting their code works locally, just arguing it's not "value-agnostic" globally. They may accept this trade-off.

  **2. The "Attainable Utility" Counter**
  *   **Likelihood:** High | **Damage:** High
  *   **The Objection:** "We don't use state-distance anymore; we use *Attainable Utility* (AU). We measure impact by how much the agent changes its ability to achieve *any* random goal. That's value-agnostic by definition because it averages over all possible reward functions. Your baseline critique doesn't apply to AU."
  *   **2-Minute Reply:** "AU still requires a baseline for comparison: attainable utility *compared to what*? Usually, it's compared to the agent doing nothing. If the baseline is 'inaction,' then AU penalizes the agent for curing a disease (which increases future attainable utility for many goals) just as much as it penalizes destroying the world. To fix this, you have to weight the baseline or restrict the goal space. Once you restrict the goal space to 'reasonable human goals,' you've abandoned value-agnosticism. You're smuggling in a prior over what goals matter."
  *   **Soft Spot:** AU proponents claim the baseline is "starting state." If they argue the *starting state* isn't normative, you need to press that the *choice to preserve power* is normative.

  **3. The "Baseline as Hyperparameter" (Engineering Pragmatism)**
  *   **Likelihood:** Very High | **Damage:** Medium
  *   **The Objection:** "Okay, suppose the baseline is a normative choice. So what? In engineering, we pick hyperparameters all the time. We tune the baseline to minimize bad outcomes on a validation set. Why does it matter if it's 'normative' if we can empirically tune it to be safe?"
  *   **2-Minute Reply:** "Because tuning requires a loss function. To tune the baseline to 'minimize bad outcomes,' you need to know what a 'bad outcome' is. That is exactly the value specification problem you claim to be avoiding. If you can tune the baseline to avoid bad outcomes, you already solved alignment. You don't need the impact measure anymore. The impact measure is only useful if it works *without* knowing what's bad. My claim is that it can't."
  *   **Soft Spot:** They might argue for "weak supervision" or "human feedback" on the baseline. Concede that works, but note it's no longer value-agnostic impact measurement; it's value learning.

  **4. The Corrigibility Trap (The Expert's Move)**
  *   **Likelihood:** Medium | **Damage:** Lethal
  *   **The Objection:** "We use impact measures primarily to ensure *corrigibility*—to stop the agent from resisting shutdown. If your argument holds, and impact measures are incoherent, then we can't formalize corrigibility this way. Are you suggesting we just give up on formal guarantees for shutdown behavior?"
  *   **2-Minute Reply:** "I'm suggesting that 'low impact' is the wrong frame for corrigibility. Corrigibility isn't about minimizing change; it's about maximizing the human's option value. If you frame it as impact minimization, you get agents that disable themselves to ensure zero impact. You need a different formalism, likely one that explicitly values human control, not one that pretends to be value-agnostic. Don't use a hammer to do a screwdriver's job."
  *   **Soft Spot:** You don't have the screwdriver. You're critiquing their tool without providing a replacement. This makes you look destructive.

  **5. The "Value-Agnosticism is a Spectrum" Defense**
  *   **Likelihood:** Medium | **Damage:** Low
  *   **The Objection:** "Nobody claims it's perfectly value-agnostic. It's about reducing the *bandwidth* of value specification required. Even if the baseline has some normativity, it's less information than specifying the full utility function. Doesn't that still buy us something?"
  *   **2-Minute Reply:** "If the baseline encodes 'preserve the status quo' or 'don't change human power dynamics,' that is a *massive* amount of normative information. It's essentially a conservative political philosophy hardcoded into the loss function. That's not reducing bandwidth; it's hiding the bandwidth requirement in a place where you can't debug it. It's safer to admit you need value input than to pretend a default trajectory is neutral."
  *   **Soft Spot:** Engineers love approximations. They will accept "leaky abstraction" as better than nothing.

  **6. The "Human Counterfactual is Learnable" Objection**
  *   **Likelihood:** Low | **Damage:** Medium
  *   **The Objection:** "You say the human-counterfactual default is hard to define. But we can train a model to predict what a human would do. If we learn the baseline from data, isn't it descriptive, not normative?"
  *   **2-Minute Reply:** "Predicting what a human *would* do is a descriptive task, but choosing to *optimize against that prediction* is normative. If the human is irrational or self-destructive, do you follow that baseline? If you correct for human irrationality in the prediction, you've imposed a normative filter. If you don't, you're locking in human errors. The learning process doesn't remove the normativity of the objective."
  *   **Soft Spot:** This gets into weeds about imitation learning vs. RL. Keep it high-level.

  **7. The "Incoherence vs. Difficulty" Semantic Attack**
  *   **Likelihood:** Low | **Damage:** Low
  *   **The Objection:** "You're using 'incoherent' too strongly. It sounds like you're saying the math doesn't work. But the math works fine. You're just saying we don't know which math to pick. That's a specification problem, not incoherence."
  *   **2-Minute Reply:** "In action theory, a means is incoherent if it claims to achieve an end while structurally preventing it. The end is 'safety without values.' The means is 'penalize deviation from default.' I'm showing the means structurally requires values. It's not just that we don't know which default to pick; it's that *any* pick defeats the selling point. That's a functional incoherence."
  *   **Soft Spot:** Philosophers care about this distinction; engineers don't. Don't dwell here.

  **8. The "So What? / Alternative Proposal"**
  *   **Likelihood:** High | **Damage:** High
  *   **The Objection:** "Let's grant your point. Impact measures rely on normative baselines. What do we do instead? Do we specify full utility functions? Because if your answer is 'yes,' you've just told us to solve the entire alignment problem before we can write a loss function."
  *   **2-Minute Reply:** "My answer is: stop selling 'value-agnostic safety' as a product. It creates a false sense of security. We should be working on *value learning* or *interactive oversight* where the normativity is explicit. It's better to know you're driving a car with a steering wheel (values) than to pretend the car drives itself (impact measures) while it drifts into a wall based on a hidden assumption."
  *   **Soft Spot:** This is the "Killer" territory. If they press that value learning is impossible, you have no fallback.

  ---

  ### Strategic Flags

  **Concede Up Front:**
  Concede that **we need *a* baseline to run code.** Do not let them paint you as saying "we can't build agents." Say: "Of course we need a baseline to compute a gradient. My claim is about the *sales pitch* of value-agnosticism, not the possibility of coding." This disarms the "So how do we code it?" frustration.

  **Must-Win Outright:**
  You must win the point that **the choice of baseline determines safety outcomes normatively.** If they convince the room that baselines are "technical parameters" like learning rate, you lose. You need them to see that choosing "inaction" vs. "human counterfactual" is as morally weighted as choosing "maximize happiness" vs. "maximize profit." Use the wasp nest example: Inaction baseline = wasps live. Human counterfactual = wasps die. The math changes based on a moral choice about wasps.

  **The Killer Question (The One You Hope Nobody Asks):**
  This will come from the **Decision Theorist**. They will wait until you've admitted the baseline is normative.
  *   **The Question:** "If the baseline selection is a normative choice equivalent to specifying a value function, then selecting the baseline requires solving the alignment problem. But you just argued impact measures are unnecessary because we should do value learning. **Isn't selecting the 'correct' normative baseline formally isomorphic to specifying the 'correct' utility function? If so, haven't you just reduced 'impact measurement' to 'value specification' without gaining any safety margin? Why is your proposal any more tractable than the one you're criticizing?**"
  *   **Why it hurts:** It forces you to admit your critique doesn't make the problem easier, just clearer. If the room thinks the goal is "make alignment easier," you just told them "actually, it's just as hard, stop lying to yourselves." That's a hard sell in a funding/paper environment.
  *   **Prep for it:** "It doesn't make it easier, it makes it honest. You can't solve a problem you refuse to name. Impact measures encourage you to ignore the value specification; my critique forces you to face it. That's progress in clarity, even if not in tractability." (This is weak, but it's the only honest answer).
