prompt: |-
  hey, I'm a high schooler doing an independent study thing on Rousseau and I'm stuck on his Letter to d'Alembert about the theatre (the one where he's arguing Geneva shouldn't build a playhouse). I get the basic setup but I keep losing the thread of the actual argument, and the translation I have is old and wordy so I might be misreading steps.

  Here's the part I've got so far, in my own words, so you can see where I'm at: he says the theatre can't make people better because to fill seats it has to please the audience it's got, so it ends up flattering whatever the audience already is instead of correcting it. And when it does show virtue, we only get to enjoy it secondhand — we cry over the hero, feel great about our own tender hearts, and go home without having done anything. He also says our pity at the theatre is really about us, something like self-love or amour-propre, since we're identifying with the character and enjoying our own emotion. Then there's the bit about Molière's Misanthrope where the actually-honest guy is the one the audience ends up laughing at. He also goes after actors as a profession, and says a theatre would be bad for Geneva specifically because it'd bring luxury and a whole culture of appearances.

  What I can't follow is the middle step. Why exactly does he think the emotion you feel at a play doesn't count or doesn't carry over into real life? Is he making an empirical claim about audiences, or a conceptual one about what fiction is? And is it fair to describe his view as "feeling virtuous discharges the urge to be virtuous," kinda like what people now call moral licensing, or is that not his point at all? Also, how does the actor thing connect to the audience thing, becuase to me those look like two seperate arguments stapled together. And if you can, tell me where the argument is weakest, because it feels like he's just assuming the audience is a crowd of shallow people who can only handle diluted emotion, and I don't know if that's something he argues for or something he takes for granted.
