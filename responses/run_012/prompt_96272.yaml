          3.  Cruxes (sub-questions that could move them), including agreed tests/cases and pre-recorded predictions.
          4.  Analysis of verbal vs. substantive disputes.
          5.  Specific inclusion of two "stuck points":
              *   *Individuation Problem:* Partitioning theories changes MEC prescriptions (is this a reductio or bookkeeping?).
              *   *Reflexive Uncertainty:* What to do when uncertain about whether ITCs are possible (MEC needs ITCs; Structuralist needs to know if ITCs are possible to rule them out).
