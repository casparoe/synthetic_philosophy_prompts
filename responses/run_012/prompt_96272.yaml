answer: |-
  **MEMORANDUM OF PARTIAL CONVERGENCE**
  **SUBJECT:** The Formal Treatment of Moral Uncertainty
  **PARTIES:** The Maximizing Party (MP) and The Structural Party (SP)
  **DATE:** October 14, 2023

  ### I. AGREED CLAIMS

  Both parties affirm the following propositions as the common ground for future inquiry and action:

  1.  **The Reality of Uncertainty:** Rational agents often hold non-extreme credences in competing first-order moral theories (e.g., Utilitarianism, Deontology, Virtue Ethics).
  2.  **The Rejection of Myopia:** Action cannot be determined solely by the theory in which the agent has the highest credence ("My Favorite Theory"). Minority theories must exert some influence on choice.
  3.  **The Role of Credence:** The degree of influence a theory exerts must be monotonically related to the agent's credence in that theory.
  4.  **The Existence of Clear Cases:** There exist "dominance" cases where all theories with non-negligible credence agree on the ranking of options (e.g., gratuitous torture is wrong). In these cases, the specific method of aggregation is irrelevant.
  5.  **The Individuation Sensitivity:** Both parties acknowledge that any procedure relying on a weighted sum of values (including MP's MEC and SP's Parliamentary models) is sensitive to how the space of theories is partitioned. Specifically, splitting one theory into two near-duplicates with half the credence each can alter the prescribed action if normalization is not handled invariantly. Both agree this sensitivity exists; they disagree on its fatalness (see Section III).
  6.  **Reflexive Uncertainty:** Both parties acknowledge they hold less than 100% credence in their own meta-ethical frameworks. MP is not certain intertheoretic comparisons (ITCs) are possible. SP is not certain ITCs are impossible.
  7.  **The Requirement of Reflexive Stability:** Any chosen decision procedure must be stable under uncertainty about itself. If MP assigns 60% credence to "ITCs are possible," MP must specify how to act given the 40% credence that they are not. If SP assigns 60% credence to "ITCs are impossible," SP must specify how to act if they are wrong and ITCs *are* possible.
  8.  **The Goal:** The objective is to minimize moral regret (or violation of moral requirements) across the distribution of possible true theories, not merely to maintain internal consistency of the meta-ethical model.

  ### II. REMAINING DISAGREEMENTS

  | Feature of the Problem | The Maximizing Party (MP) Formulation | The Structural Party (SP) Formulation |
  | :--- | :--- | :--- |
  | **The Nature of Value** | Moral theories posit *quantities* of choiceworthiness. Uncertainty is about the magnitude and distribution of these quantities. | Moral theories posit *requirements* or *reasons*. Uncertainty is about which authoritative demands apply to the agent. |
  | **Intertheoretic Comparison** | ITCs are necessary and possible via normalization (e.g., variance, range). Without them, we cannot trade off small risks of grave evils against large benefits. | ITCs are metaphysically ill-defined. We cannot say "1 unit of Utility = 1 unit of Duty." We can only negotiate between theories as distinct agents. |
  | **The Decision Procedure** | **Maximize Expected Choiceworthiness (MEC).** Calculate the sum of (Credence × Normalized Value) for each option. | **Moral Bargaining / Constraints.** Treat theories as voters in a parliament or as side-constraints that cannot be violated for mere gain. |
  | **Handling Reflexive Uncertainty** | Assign a credence $C_{comp}$ to the proposition "ITCs are possible." If $C_{comp} < 1$, maximize expected choiceworthiness *including* the value of information gained by attempting comparison. | Treat the impossibility of ITCs as a default constraint. Only allow trade-offs if all theories with significant credence explicitly authorize a bargaining protocol. |
  | **The Individuation Problem** | This is a **bookkeeping problem**. It indicates our normalization method is currently crude, not that the model is wrong. We must find an individuation-invariant metric. | This is a **reductio**. The fact that splitting a theory changes the moral truth proves that moral value is not a cardinal quantity that can be summed. |

  ### III. CRUXES AND PREDICTIVE TESTS

  The following sub-questions are identified as pivotal. Settlement of any one would significantly alter the credence distribution between MP and SP.

  | Crux | The Test Case / Argument | MP Prediction | SP Prediction |
  | :--- | :--- | :--- | :--- |
  | **1. The Dual-Utilitarian Partition** | **Case:** An agent has 50% credence in Utilitarianism and 50% in Deontology. In Scenario A, Utilitarianism is one theory. In Scenario B, Utilitarianism is split into "Hedonic Util." and "Preference Util." (25% each), which agree on all options in the set.<br>**Question:** Does the prescribed action change between A and B? | **Prediction:** The action should *not* change. If our current math says it does, our normalization is flawed, not the MEC principle. We will find an invariant metric. | **Prediction:** The action *will* change in any summation model. This proves the model is category-error. Only a non-summative procedure (e.g., veto power) remains invariant. |
  | **2. The Incommensurable Stake** | **Case:** A choice between saving a life (Deontological requirement) vs. preventing 10,000 headaches (Utilitarian requirement). Theories disagree on whether these are comparable kinds.<br>**Question:** Can a rational agent trade the life for the headaches? | **Prediction:** Yes. Under uncertainty, we must compare the *risk* of violating a duty against the *certainty* of relieving pain. A common scale is forced by the necessity of choice. | **Prediction:** No. To trade them is to assume the Deontological theory is false (i.e., that rights are fungible). We must bargain, perhaps preserving the right unless the headache count is infinite. |
  | **3. Reflexive Self-Undermining** | **Case:** MP applies MEC to the question "Should I use MEC?" If MP has <100% credence in ITCs, MEC might recommend a non-MEC procedure (e.g., "Don't risk acting on false comparisons").<br>**Question:** Does MEC recommend itself under uncertainty? | **Prediction:** MEC is robust. Even with uncertainty about ITCs, the *expected* value of attempting comparison outweighs the risk of category errors. | **Prediction:** MEC is self-undermining. If you are uncertain about comparability, you cannot compute the expectation. You must default to the Structural view to avoid catastrophic category errors. |

  ### IV. VERBAL VS. SUBSTANTIVE DISPUTE

  **Assessment:** Approximately 40% of the dispute is verbal; 60% is substantive.

  **Verbal Component:**
  The disagreement over the term "Choiceworthiness."
  *   **MP** uses "choiceworthiness" to mean *a scalar property that actions possess, which we are trying to measure.*
  *   **SP** uses "choiceworthiness" to mean *the output of a deliberative procedure.*
  *   **Resolution:** If SP agrees that the output of the bargaining procedure can be *represented* as a scalar for the sake of calculation (without ontological commitment to the scalar), the "maximization" language becomes acceptable to SP, provided it is understood as a heuristic for the bargaining outcome rather than a metaphysical truth.

  **Substantive Component:**
  The disagreement over **Risk Attitudes toward Moral Error.**
  *   **MP** is effectively risk-neutral regarding moral error. Violating a duty is "bad," satisfying a preference is "good," and they can offset.
  *   **SP** is risk-averse regarding specific categories of moral error (specifically Deontological violations). SP treats certain errors as having infinite or lexical negative weight that cannot be offset by aggregate good.
  *   **Why it matters:** No amount of semantic tweaking resolves whether a rights violation can be traded for aggregate welfare. This is a genuine conflict in first-order moral intuitions projected into the meta-ethical space.

  ***

  ### V. META-ANALYSIS: WHERE THE DRAFTING IS LIKELY TO HAVE FAILED

  As the author of this document, I must alert you to the specific fractures where this text may not hold up under the scrutiny of your characters.

  **1. The Vacuity of Claim #7 (Reflexive Stability)**
  *   **The Flaw:** Claim #7 asserts that both parties must specify how to act under uncertainty about their own meta-ethics. However, for the Maximizing Party (MP), this is trivial (just add another layer of expectation). For the Structural Party (SP), this may be **impossible**. If SP's view is that "comparison is meaningless," then assigning a credence to "comparison is possible" might be a category error akin to assigning a probability to "2+2=blue."
  *   **The Risk:** If your Structuralist character is a hardline expressivist or prescriptivist, they cannot coherently sign Claim #7 without abandoning their core philosophy. They might sign it only by interpreting "credence" as "degree of confidence in my linguistic intuition," which weakens the claim significantly.
  *   **Argument to Shift Verdict:** If the Structuralist argues that *meta-ethical uncertainty is not probabilistic*, Claim #7 collapses. You should test this by having the Structuralist ask: "Do I have a credence that 'murder is wrong' is a truth-apt proposition? Or do I just have a con-attitude toward murder?" If the latter, they cannot sign.

  **2. The Slant in the Individuation Problem (Claim #5 & Crux #1)**
  *   **The Flaw:** The document frames the Individuation Problem as a technical hurdle regarding "partitioning." This subtly favors the Maximizer, who believes in a underlying reality that the partition is trying to capture. The Structuralist likely views the Individuation Problem not as a "sensitivity" but as proof that there is *nothing there to measure*.
  *   **The Risk:** By agreeing that "sensitivity exists," the Structuralist may have conceded too much. They should argue that sensitivity proves the *non-existence* of the metric, not just its difficulty.
  *   **Argument to Shift Verdict:** If the Structuralist introduces a case where *merging* two distinct theories (e.g., two distinct Deontological codes) into one "Deontology" block changes the verdict, the Maximizer is in trouble. The current draft assumes splitting theories is the problem. If merging distinct theories also breaks the model, the Maximizer's "bookkeeping" defense fails.

  **3. The "Genuine" Disagreement on Risk (Section IV)**
  *   **The Flaw:** I have classified the risk attitude difference as "substantive." However, it is possible this is also verbal. The Maximizer might argue that the Structuralist's "lexical priority" is just a very steep utility curve, not a different structure.
  *   **The Risk:** If the Maximizer can mathematically model the Structuralist's "veto power" as a utility function with infinite negative values for certain outcomes, the Structuralist's position collapses into a subset of the Maximizer's position.
  *   **Argument to Shift Verdict:** To keep the disagreement genuine, the Structuralist must insist on **incommensurability**, not just **lexicality**. Lexicality can be modeled (Infinity > Finite). Incommensurability cannot (NaN > Finite is undefined). If the document allows "Infinity" as a value, the Maximizer wins. The document must insist on "Undefined" to preserve the Structuralist's stance.

  **Recommendation for the Scene:**
  Have the Structuralist hesitate at Claim #7. Have them pick up the pen, hover, and say, "I can sign this only if 'credence' here means 'propensity to act as if,' not 'belief in truth.'" Have the Maximizer accept this, knowing it renders the formalism weaker, but securing the signature. That tension is where your decade of talking past each other lives.
