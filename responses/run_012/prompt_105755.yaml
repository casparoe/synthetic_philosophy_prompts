answer: |-
  # Specification: Desiderata for a Theory of Interpersonal Aggregation

  **Scope:** This specification defines the necessary conditions for any normative theory claiming to resolve conflicts between individual interests and aggregate social welfare. The theory must provide a decision procedure for interpersonal aggregation that is logically coherent, operationally feasible, and morally defensible.

  **Definition:** *Aggregation* is defined here as any rule permitting the subordination of the interests of individual $A$ to the cumulative interests of individuals $B_1...B_n$.

  ---

  ## I. Desiderata List

  ### 1. The Finite Utility Monster
  *   **Case:** A single individual exists whose capacity for utility is so high that any resource transfer to them yields more total utility than the loss suffered by any number of others, provided the number of others is below a certain (very high) threshold.
  *   **Requirement:** The theory must specify a *stopping condition*. It must state whether the monster is entitled to all resources up to the point of satiation, or whether there is a cap on the moral weight of a single individual's utility regardless of magnitude.
  *   **Classification:** **Camp Preference.** (Utilitarians accept the monster as a valid outcome; deontologists and prioritarians reject it. The constraint is not on the theory's coherence, but on its moral acceptability to non-consequentialists.)

  ### 2. The Unbounded (Infinite) Utility Monster
  *   **Case:** A being whose utility function has no upper bound (lexical or infinite), such that no finite sacrifice by others can ever outweigh a gain for this being.
  *   **Requirement:** The theory must determine if an infinite utility value renders aggregation mathematically impossible. It must decide whether to (a) deny the metaphysical possibility of such a being, (b) assign the being lexical priority over all others, or (c) truncate the utility scale to preserve aggregability.
  *   **Classification:** **Genuine Constraint.** (A theory of aggregation cannot function if one variable renders the sum indeterminate or permanently dominant. The theory must resolve the mathematical coherence of the utility metric.)

  ### 3. The Coalition Monster
  *   **Case:** A group of $N$ individuals, each gaining a small amount of utility, where the sum equals or exceeds the gain of the Single Utility Monster.
  *   **Requirement:** The theory must distinguish between the *Single Monster* (one being, huge capacity) and the *Coalition* (many beings, small capacities). It must explain why the aggregation of the Coalition is treated differently (if it is) than the capacity of the Single Monster, despite the sums being identical.
  *   **Classification:** **Genuine Constraint.** (This tests the *Separateness of Persons*. If the theory treats the Single Monster and the Coalition identically, it fails to account for individual boundaries. If it treats them differently, it must provide a structural metric beyond simple summation.)

  ### 4. The Anti-Aggregation Intuition (Life vs. Headaches)
  *   **Case:** A choice between saving one identifiable person from death or curing a large number of people from mild headaches.
  *   **Requirement:** The theory must accommodate the intuition that aggregate trivial gains do not automatically outweigh a catastrophic loss to one. It must do this without resorting to a lexical veto that makes *any* number of headaches irrelevant (which leads to absurdity in other cases). It requires a non-linear weighting function for benefits.
  *   **Classification:** **Camp Preference.** (Strict utilitarians reject this intuition; prioritarianism and contractualism accept it. However, it is a constraint on *plausibility* for most non-utilitarian frameworks.)

  ### 5. Population Axiology (Repugnant Conclusion & Mere Addition)
  *   **Case:** Comparing Outcome A (small population, high welfare) with Outcome B (massive population, barely positive welfare).
  *   **Requirement:** The theory must rank outcomes with different populations without implying that B is better than A (Repugnant Conclusion) and without implying that adding happy people is morally neutral (Mere Addition Paradox). It must define the value of existence itself.
  *   **Classification:** **Genuine Constraint.** (Any theory claiming to rank social states must handle variable population sizes. Failure here indicates an incompleteness in the theory's axiology.)

  ### 6. The Separateness of Persons
  *   **Case:** The objection that society is not a super-individual; losses to $A$ cannot be simply offset by gains to $B$ as they might be within a single life over time.
  *   **Requirement:** The theory must specify whether interpersonal compensation is morally equivalent to intrapersonal compensation. If not, the theory must include a distribution-sensitive metric (e.g., priority to the worse-off) rather than a sum-sensitive metric.
  *   **Classification:** **Genuine Constraint.** (This is a meta-ethical constraint on the *structure* of aggregation. A theory that ignores this is not a theory of *distributive* justice, but of *efficiency*.)

  ### 7. The Leveling-Down Objection
  *   **Case:** A scenario where equality is achieved only by harming the better-off without benefiting the worse-off.
  *   **Requirement:** The theory must not classify this change as an *all-things-considered* improvement. It may count equality as a pro-tanto value, but not if it violates Pareto efficiency without compensating gain.
  *   **Classification:** **Genuine Constraint.** (A theory that recommends leveling down is practically incoherent as a guide for action, as it prescribes harm without benefit.)

  ### 8. Interpersonal Comparability
  *   **Case:** The measurement problem. To aggregate, one must compare units of utility across persons.
  *   **Requirement:** The theory must state the informational basis required (ordinal, cardinal, ratio-scale). Specifically, for the Monster cases to be well-formed, the theory must assume at least cardinal comparability.
  *   **Classification:** **Genuine Constraint.** (Without a specified basis for comparison, the aggregation rule is operationally empty. The Monster case specifically demands ratio-scale comparability to be meaningful.)

  ---

  ## II. Classification of Constraints

  | Desideratum | Classification | Rationale |
  | :--- | :--- | :--- |
  | **1. Finite Monster** | Camp Preference | Accepting the monster is consistent with utilitarianism; rejecting it is consistent with rights-based views. It is a moral verdict, not a logical requirement. |
  | **2. Unbounded Monster** | Genuine Constraint | Infinite values break the arithmetic of aggregation. The theory must resolve this to function. |
  | **3. Coalition Monster** | Genuine Constraint | Tests whether the theory respects person-boundaries or merely sums values. Essential for *distributive* justice. |
  | **4. Anti-Aggregation** | Camp Preference | Utilitarians reject this; others accept it. However, it is a strong constraint on *reflective equilibrium* for most agents. |
  | **5. Population Cases** | Genuine Constraint | A theory of justice must handle changes in population size. Inability to rank these states is a failure of completeness. |
  | **6. Separateness** | Genuine Constraint | Distinguishes distributive justice from mere resource management. Ignoring this changes the subject. |
  | **7. Leveling-Down** | Genuine Constraint | A theory that prescribes harm without benefit fails the basic requirement of being a normative guide. |
  | **8. Comparability** | Genuine Constraint | Aggregation is mathematically impossible without defined comparability. |

  ---

  ## III. Incompatibilities and Impossibility Results

  The following inconsistencies exist within the set of desiderata. A theory cannot satisfy all of them simultaneously. These are not merely tensions but logical contradictions.

  ### 1. The Spectrum Inconsistency (Anti-Aggregation vs. Transitivity)
  *   **Conflict:** Desideratum 4 (Anti-Aggregation) vs. Logical Transitivity.
  *   **Explanation:** If you assert that One Life > $N$ Headaches (Anti-Aggregation), and you accept that there is a continuous spectrum of harms between a headache and death (e.g., broken finger, broken arm, cancer), you face a Sorites paradox. If $N$ headaches cannot outweigh a broken finger, and $N$ broken fingers cannot outweigh a broken arm, transitivity dictates that $N$ headaches cannot outweigh death. However, if you allow that *enough* minor harms eventually outweigh a major harm (to avoid absurdity), you violate the Anti-Aggregation intuition.
  *   **Result:** You cannot maintain a strict threshold for aggregation (to save the one life) while maintaining transitivity across a continuum of harms. You must either accept the Repugnant Conclusion for harms (enough headaches justify a death) or accept intransitivity (cyclic preferences).

  ### 2. The Structure vs. Sum Inconsistency (Single Monster vs. Coalition)
  *   **Conflict:** Desideratum 1 (Finite Monster) vs. Desideratum 3 (Coalition Monster) vs. Desideratum 6 (Separateness).
  *   **Explanation:**
      *   To block the **Single Monster** (Desideratum 1), you must claim that a single individual's utility cannot outweigh the cumulative losses of others, regardless of magnitude. This implies a *cap* on individual moral weight.
      *   To handle the **Coalition Monster** (Desideratum 3) while respecting **Separateness** (Desideratum 6), you must treat the coalition as distinct individuals. If they are distinct individuals, their claims should aggregate.
      *   **The Contradiction:** If you cap the Single Monster to protect the many, you are prioritizing the *number* of people over the *sum* of utility. But if the Coalition is just many people, their aggregate claim should be strong. If you allow the Coalition to outweigh a single high-loss individual (standard aggregation), you risk creating a "Reverse Monster" where the many trivially sacrifice the one. If you block the Coalition to protect the one, you violate Responsiveness to Numbers.
      *   **Result:** You cannot simultaneously (a) cap individual utility to block the Single Monster, (b) allow aggregation to respect the Coalition's numbers, and (c) maintain that the distinction between One Being and Many Beings is morally significant (Separateness). If Separateness matters, the Single Monster and Coalition should be treated differently. If Aggregation matters, they should be treated the same (by sum). You cannot do both.

  ### 3. The Comparability vs. Rights Inconsistency
  *   **Conflict:** Desideratum 8 (Comparability) vs. Desideratum 6 (Separateness).
  *   **Explanation:**
      *   To make the **Monster Case** (Desideratum 1 & 2) well-formed, you must assume **Cardinal/Ratio Comparability** (Desideratum 8). You must be able to say "Monster's gain is 1000 units, Victim's loss is 10 units."
      *   To respect **Separateness of Persons** (Desideratum 6) in a strong sense (as required to block the Monster), you typically need to assert **Incommensurability**. You must say "Victim's Right cannot be traded for Monster's Utility."
      *   **Result:** You cannot assume the utility metric is precise enough to identify a Monster (requiring strong comparability) and simultaneously claim that the metric is the wrong currency for justice (requiring incommensurability). If the utility is measurable enough to identify the problem, it is measurable enough to solve it via aggregation. If it is not measurable enough to aggregate, the Monster case is ill-formed.

  ### 4. The Population vs. Aggregation Inconsistency
  *   **Conflict:** Desideratum 5 (Population) vs. Desideratum 4 (Anti-Aggregation).
  *   **Explanation:**
      *   To avoid the **Repugnant Conclusion** (Desideratum 5), you must limit the moral weight of adding lives with low positive welfare. This requires a *Critical Level* or similar mechanism that discounts low-quality lives.
      *   To satisfy **Anti-Aggregation** (Desideratum 4), you must prioritize the severity of harm to existing people over the number of beneficiaries.
      *   **Result:** Combining these leads to the **Sadistic Conclusion**. If you discount low-quality lives to avoid the Repugnant Conclusion, you may end up preferring a world where existing people suffer (to keep population low) over a world where many people live barely worth-living lives. A theory that avoids the Repugnant Conclusion often implies that adding happy people can be *bad*, which conflicts with the intuition driving Anti-Aggregation (that we should help people).

  ### Summary of Impossibility
  No theory can jointly satisfy:
  1.  **Responsiveness to Numbers** (Coalition Monster).
  2.  **Protection of the Individual** (Single Monster/Anti-Aggregation).
  3.  **Transitivity** (Logical coherence).
  4.  **Comparability** (Operational feasibility).

  You must sacrifice at least one. Most theories sacrifice **Transitivity** (accepting vagueness), **Comparability** (accepting incompleteness), or **Protection of the Individual** (accepting some form of aggregation).
