  **3. "This is gardening, not philosophy. Don't be sentimental."**
  *Reply:* This isn't about feelings; it's about risk management. We manage soil and water risks; this is just another variable.
  *Weakest:* Still sounds like a moral lecture to some.

  **4. "It's nature. Everything eats everything."**
  *Reply:* We choose which nature happens here. Broad-spectrum spray kills pollinators too, not just pests. We can tilt the balance differently.
  *Weakest:* We still kill pests manually; death is inevitable.

  **5. "Our garden is a drop in the bucket compared to farms."**
  *Reply:* True, but community gardens lead by example. If we don't count our insects, why should large farms count theirs?
  *Weakest:* Mathematically, our individual impact is negligible.

  **6. "What about the aphids suffering when they starve or get eaten?"**
