  I stitch the leather in my calloused hand,
  You wear the path until the shadows fall.
  You need a sole to walk upon the land,
  I need a room within this wall.
  Five hundred pairs against a single light,
  I cannot carry value through the day.
  We need a sign to make the trading right,
  Before the sun goes down and turns to gray.
  We strike a count that makes us both as one,
  Until the work of making shoes is done.

  I raise the timber with a calloused hand,
  You bear the wind until the shadows fall.
  You need a sole to walk upon the land,
  I need a hearth within this wall.
  One single house against the coming night,
  I cannot wear a roof throughout the day.
  You need a sign to make the trading right,
  Before the sun goes down and turns to gray.
  We strike a count that makes us both as one,
  Until the work of raising roofs is done.

  I hold this token for a future sum,
  It speaks of value but remains dumb,
  It measures nothing but the space to come.

  ***

  **Commentary**

  The poem commits to the reading that money does not solve the incommensurability problem but rather conventions it (*nomos* over *physis*). The two stanzas are formal twins (ident rhyme scheme and meter) to represent the artificial equality money imposes, yet their content (shoes vs. houses, many vs. one) remains naturally distinct, preserving the aporia. The coin lines rhyme in *-um* against the stanzas' *-one*, an audible near-miss signaling that the measure is a useful fiction, not a natural truth.

  I take a liberty by emphasizing the "unnatural" aspect of the coin within the ethics of exchange itself; Aristotle tries to distinguish just exchange from unlimited accumulation (*chrematistics*), but the poem leans into the tension where the "token" inherently points toward a "future sum" (accumulation) and addresses a "later self" (the pledge/hostage function), blurring the line between necessary medium and endless end.

  If I believed the coin really measured value naturally, the stanzas would not need to be formal twins; their structures could differ to reflect the true nature of shoes versus houses. Furthermore, the coin lines would rhyme perfectly with the stanzas, indicating a true bridge rather than a conventional patch, and the final line would likely speak of "truth" or "weight" rather than "dumb" convention.
