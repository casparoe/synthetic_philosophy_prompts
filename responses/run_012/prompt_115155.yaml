      *   *The Drafting:* The act of defining the boundary.
      *   *The Ending:* The final order. The specific wording that excludes the overlap.

      *(Self-Correction during drafting)*: Make sure the words *Khet* and *Sola* aren't just labels for "water." They need to imply different relationships. *Khet* is inherited, vertical. *Sola* is communal, horizontal. When Elara measures "acre-feet," she violates both.

      *(Refining the Ending)*: The prompt asks for the signed document to be the ending, or at least the focus of the final page. I should reproduce the text of the finding or describe it closely enough that the exclusion is visible. Let's have her sign it, and the text of the order be the final imagery.

      *(Word Count Check)*: 1,800 words is about 6-7 pages single spaced. I need to be descriptive but not purple. Focus on the *work*.

