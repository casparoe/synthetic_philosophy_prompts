      *(Wait, one more check on constraints)*: "Do not let any character deliver a lecture about reference, translation, or the limits of evidence." The conflict must be about *allocation*, not meaning, though the meaning drives the allocation.

      *(The "Rigged" aspect)*: The law colleague says it's rigged. The story must show *why* it feels rigged but must be done anyway. The "rigged" nature is the necessity of choosing a vocabulary that distorts.

