answer: |-
  This is a sharp angle. Moving from the millisecond scale of the motor cortex to the narrative scale of identity construction sidesteps the "zombie brain" fatigue that plagues Libet coverage. Your reading holds up, but only if you clarify *which* version of Libet you're interrogating.

  Here is the breakdown of where the analogy maps, where it fractures, and how to use the film to pivot the free will debate from "initiation" to "constraint."

  ### 1. The Mapping: Temporal Inversion vs. Causal Lag
  **Where it maps cleanly:**
  The structural experience of the film mirrors the phenomenological problem of Libet. In the black-and-white sequences (which move forward) and the color sequences (which move backward), the audience is constantly presented with an *effect* before the *cause*. We see Leonard shoot Teddy before we understand why. We see him run before we know who is chasing him.

  This forces the viewer into Leonard's cognitive position: you are conscious of the action, but the "reason" is a retrieved artifact (a note, a tattoo, a memory) that arrives post-hoc. This aligns with the revisionist Libet interpretation you mentioned. If the Readiness Potential (RP) is just stochastic noise accumulating to a threshold, then the "decision" isn't a lightning strike; it's a drift. Leonard lives in that drift. He waits for external data (a Polaroid, a tattoo) to push the noise over the threshold of action. He doesn't generate the impulse internally; he curates it externally.

  **Where the film cheats:**
  Timescale and locus. Libet is about sub-second motor initiation in the premotor cortex. *Memento* is about days-long narrative construction in the hippocampus (or lack thereof). Leonard's "readiness potential" is externalized. It's ink on skin, not voltage in the supplementary motor area.
  *   **The Cheat:** Leonard *chooses* to get the tattoos. In the Libet paradigm, the subject doesn't choose the RP. In *Memento*, Leonard chooses the constraints that will force his future self to act. This shifts the locus of free will from the *moment of action* to the *moment of system design*.

  ### 2. The Sammy Jankis Pivot: Conditioning vs. Belief
  You flagged Sammy Jankis correctly. This is the linchpin.
  In Leonard's story, Sammy has anterograde amnesia but cannot be conditioned (the insulin test). Leonard claims this proves Sammy's condition is psychological, not physical, because a "broken" brain should still accept conditioning.
  *   **The Twist:** The film implies Leonard *is* Sammy. Leonard conditioned himself to ignore his own success (killing the real attacker) because the grief was too heavy.
  *   **The Neuro Implication:** This undermines the hard determinist reading of Libet. If Leonard's brain *rejected* the conditioning (the insulin test killed Sammy's wife because Sammy wouldn't act on the training), it suggests a top-down veto power based on belief.
  *   **Your Argument:** Use this to argue that the "unconscious decision" isn't a robotic motor command; it's filtered through a narrative self. If the narrative doesn't make sense (Sammy/Lenard couldn't accept he had already caught the guy), the brain jams the mechanism. The "noise" doesn't cross the threshold if the story is wrong.

  ### 3. Is *Memento* an Argument Against Libet?
  Yes, but not by disproving the lag. By redefining the locus of agency.
  Libet suggests we are passengers noticing the turn after the wheel moves. *Memento* suggests we are the engineers who built the car to turn automatically so we don't have to steer.

  Leonard realizes (in the chronological finale) that he has already killed John G. He chooses to *ignore* that fact. He writes a license plate number he knows is false. He tattoos a clue he knows is a lie.
  *   **The Move:** This is a **Ulysses Contract**. He is exercising free will not by *initiating* the wrist flick, but by *rigging the environment* so that the wrist flick becomes inevitable later.
  *   **The Headline:** Free will isn't in the twitch; it's in the tattoo. It's not about "Free Will" vs. "Determinism"; it's about "Immediate Volition" vs. "Meta-Cognitive Constraint."

  ### 4. What a Working Neuroscientist Would Say
  If you put a cognitive neuroscientist in the room, they would likely highlight two things the lab can't show:

  **A. Ecological Validity of the "Interpreter"**
  Michael Gazzaniga's split-brain research posits a left-hemisphere "interpreter" that confabulates reasons for actions after they occur. Libet shows the lag; Gazzaniga shows the lie. *Memento* dramatizes the Interpreter running hot.
  *   **Lab limitation:** In the lab, the confabulation is trivial ("I pointed left because I liked the color").
  *   **Film advantage:** In *Memento*, the confabulation is existential. It shows the *utility* of the lie. The brain prefers a coherent false narrative to an incoherent truth because the false narrative allows for action. A neuroscientist would say the film captures the *motivational weight* of the post-hoc rationalization, which Libet strips away.

  **B. Prediction Error and Dopamine**
  Leonard's brain is stuck in a loop of prediction error. He predicts a future, wakes up, and the data is gone.
  *   **The Insight:** A neuroscientist would point out that Leonard's "free will" is actually a struggle against **dopaminergic extinction**. Normally, when we achieve a goal, dopamine drops, and we stop. Leonard cannot register the reward prediction error. He can never "complete" the task.
  *   **The Scene:** The insulin scene. It's a test of whether the basal ganglia (habit/conditioning) can override the hippocampus (declarative memory). Sammy fails. Leonard succeeds (by failing). This highlights that "decision" is a tug-of-war between systems, not a single timestamp.

  ### 5. Scenes to Lean On
  1.  **The Insulin Test (Sammy's Story):** Use this to discuss the threshold of action. Sammy couldn't cross it. Leonard could. Why? Because Leonard's narrative required it. This challenges the idea that the "urge" is purely biological noise; it's biologically filtered through narrative coherence.
  2.  **The Final Monologue (Chronological Start):** *"I have to believe in a world outside my own mind... How can I heal if I can't feel time?"*
      *   This is the money quote. It admits the construction of reality. He acknowledges he is manipulating his own future self. That is a high-order executive function that Libet's finger-flick doesn't capture.
  3.  **Burning Teddy's Photo:** He writes "Don't believe his lies" on the photo of the man who just helped him, knowing he is dooming Teddy to be hunted by his future self. This is **pre-meditated determinism**. He is willingly becoming a puppet to give his life shape.

  ### The Sideways Conclusion
  Don't ask "Do we have free will?" Ask "At what resolution does free will operate?"
  Libet looks at the millisecond resolution and says "No." *Memento* looks at the lifetime resolution and says "Yes, but only if you trick yourself."

  Leonard Shelby is the ultimate revisionist Libet subject. He admits the readiness potential (the urge to kill) is meaningless without the external artifact (the tattoo) to justify it. But he also proves that he can *choose the artifact*. The brain may decide before "you" do, but "you" get to program the brain's threshold settings.

  That's your hook: **The Readiness Potential is the hardware; the Tattoo is the software. We don't control the hardware, but we write the code.**
