      *   **Goal:** Validate the reading (does *Memento* map onto Libet?), identify where the mapping holds and where it cheats, determine if the film argues *against* the hard determinist Libet reading, identify key scenes, and get a "working neuroscientist" perspective on what the film captures that labs miss.
