  Alright, I've been going down a rabbit hole on machine consciousness and whether artificial systems could deserve moral consideration, and I keep hitting the same wall. Eveyone says the substrate doesn't matter — it's the computation that counts, not whether it's neurons or silicon. Fine, I'm onboard. But then I start inventing devices to test the slogan against and I can't tell which ones are supposed to count, and I suspect I'm conflating two things but can't see where.

  Here's the setup. Suppose some system has a pain-ish profile: it detects damage, avoids it, updates an internal state, that sort of thing. Bundle the whole input-output mapping and call it M. Now three gadgets:

  1. A robot whose intermediate steps actually happen, each one causally feeding the next.
  2. A box that was precomputed: for any input it just looks up the answer in a stored table and spits it out. No intermediate steps occur at all.
  3. A box that does compute the intermediate steps, but then throws them away — only the final output ever gets used by anything downstream.

  All three realize the same mapping M. So if it's really the computation that matters and not the physical stuff, aren't all three on equal footing morally? And if you tell me the lookup box "doesn't really count", doesn't that mean we were quietly caring about the causal process all along, which blows up the whole substrate-independence story? The other thing that nags me is that I can't even tell whether "implements M" is a fact about the box or a fact about me describing the box, since I could probably fit some mapping to just about anything.

  I feel like there's a distinction that dissolves this, but every time I try to state it I end up saying "the real one has steps", which sounds like I'm just prefering one implementation for no good reason.

  Can you give me exactly five numbered points, one or two sentences each, no intro and no conclusion, straightening out where my framing goes wrong and what the actual distinctions are?
