prompt: |-
  I just started running the forecasting desk at a small freight company — I'm the one who has to put a number on stuff like 'will the port strike happen' and 'will our supplier miss the deadline,' then defend it in meetings. I do this maybe five times a day, and a bad call can cost us a lot of money. My boss keeps saying that if I know tomorrow-me, after sleeping on the same news, is gonna say 70%, then I should just say 70% now, otherwise I'm being irrational. I looked it up and this is basically van Fraassen's Reflection principle, and I definately want to actually use it instead of just quoting it at him. Can you write me a decision procedure I can run on a whiteboard in ten minutes for when I should defer to my future self's credence and when I shouldn't? I need the questions in order, what counts as a good answer to each, where the procedure just says no, don't defer, and where it hands the decision to me because it's a judgment call. It has to handle the case where future-me has new evidence, the case where future-me only exists if some other thing happens (like I only get to update if the deal doesn't blow up first), the case where future-me has just thought about it longer but also forgot the base rate, and the case where future-me is less tired and just better at reasoning. Then run it on two cases: (1) I'm at 60% now, but I know that after the quarterly report drops tomorrow I'll be at 85%, and (2) I'm at 40% now, and I know that if I'm still employed next month I'll be at 70%, but the only way I'm still employed is if the project succeeds. One of those should give me an answer I won't like. Also tell me where the procedure can't help and I just have to pick, and don't give me a bibliography or reading list — just the procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Head of forecasting desk at a small freight company.
      *   **Task:** Assign probabilities to events (port strikes, supplier delays) and defend them. High stakes.
      *   **Problem:** Boss cites van Fraassen's Reflection Principle ("If you know tomorrow-you will say 70%, say 70% now"). User wants to *use* it, not just quote it.
      *   **Deliverable:** A 10-minute whiteboard decision procedure (flowchart/algorithm style).
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for "Good Answer."
          *   Clear "Stop/Don't Defer" points.
          *   Clear "Judgment Call" points.
          *   Must handle specific edge cases: New evidence, conditional existence (selection bias), mere deliberation vs. forgetting, cognitive state (tiredness).
          *   Must run two specific test cases (one yielding an uncomfortable answer).
          *   Must identify where the procedure fails (residual judgment).
          *   **Constraint:** No bibliography or reading list. Just the procedure.

  2.  **Deconstruct van Fraassen's Reflection Principle:**
      *   *Core Idea:* $P_{now}(A | P_{future}(A) = x) = x$. If you trust your future self's rationality and information set, your current credence should align with your expected future credence.
      *   *Failure Modes:*
          *   **New Evidence:** If Future-You knows something Present-You doesn't (e.g., a report drops), Reflection doesn't apply directly to the *current* state unless you conditionalize on that evidence now (which you can't). Actually, Reflection *does* account for expected evidence update, *but* only if the update is rational.
          *   **Memory Loss/Irrationality:** If Future-You forgets base rates or gets drunk, don't defer.
          *   **Selection Bias/Conditioning on Existence:** If Future-You only exists/speaks if a specific outcome happens (e.g., "If I'm still employed"), that's a collider bias. You can't defer to a self that is screened off by the event you are predicting.
          *   **Cognitive State:** If Future-You is just less tired, that's a rational improvement. Defer.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Goal:* A checklist/flowchart for the whiteboard.
      *   *Step 1: Identify the Future Self.* Who are we talking about? Is it "Tomorrow Me" or "Me if the ship sinks"?
      *   *Step 2: Check for New Information.* Is the change in probability due to learning facts or just thinking? If facts, can I access them now?
      *   *Step 3: Check for Rationality/Memory.* Will Future-Me be stupider or forgetful?
      *   *Step 4: Check for Selection Bias.* Does Future-Me's ability to speak depend on the outcome?
      *   *Step 5: The Verdict.* Defer, Don't Defer, or Judgment.

      *Refining for the User's Constraints:*
      *   Needs to be actionable in 10 mins.
      *   Needs to handle the "employed next month" case (Selection Bias).
      *   Needs to handle the "quarterly report" case (New Evidence).
      *   Needs to handle "tiredness" (Cognitive State).
      *   Needs to handle "forgetting base rates" (Rationality).

      *Drafting the Questions:*
      1.  **The Existence Check:** Does Future-Me exist regardless of the outcome? (Handles the employment case).
      2.  **The Information Check:** Why is the number changing? New data or just thinking? (Handles the quarterly report).
      3.  **The Competence Check:** Is Future-Me cognitively superior or inferior? (Handles tiredness/forgetting).
      4.  **The Alignment Check:** Do we value the same things? (Usually yes for same person, but worth a quick look).

      *Wait, let's look closer at Reflection.*
      Reflection says: If you *know* now that you *will* believe $x$ later, you should believe $x$ now.
      *Crucial Nuance:* You must know *now* that you will believe $x$.
      In Case 1 (Report drops): You know the report drops. You know you will update. Should you update now? No, because you don't have the report content. But Reflection applies to the *expectation* of the future credence. If you know you will be 85%, that implies you expect the report to be positive. If you expect the report to be positive now, why aren't you 85% now?
      *Correction:* If I know I will be 85% *because* of a report I haven't seen, Reflection implies I should already incorporate my *expectation* of that report. If I'm 60% now but know I'll be 85% tomorrow, there's a tension. Either I'm underconfident now, or I'm overconfident about my future reaction.
      *Actually, the standard interpretation:* If the change is due *solely* to new information that I cannot access now, Reflection tells me to align with my *expected* future credence. But if I know the specific value (85%), that means I've already anticipated the news. So yes, I should move to 85% now *if* I truly know that's where I'll land.
      *However*, usually, you don't *know* the future credence, you *predict* it. Reflection applies when you are certain of your future credence.
      *Let's stick to the User's Boss's framing:* "If you know tomorrow-me... is gonna say 70%." The premise is certainty about the future number.
      *Case 1:* I know after the report I'll be 85%. This implies I expect the report to be good. If I expect the report to be good, why am I 60%? I should update now.
      *Case 2:* If I'm employed, I'll be 70%. But employment depends on success. This is the "Self-Indication Assumption" or "Survivorship Bias" trap. Future-Me is a selected sample. Do not defer.

      *Refining the Procedure Steps:*
      1.  **Selection Bias Filter:** Is Future-Me's ability to hold that credence dependent on the event happening? (The "Employed" case).
      2.  **Rationality Filter:** Will Future-Me be less rational/forgetful? (The "Forgot Base Rate" case).
      3.  **Information Filter:** Is the change due to new data or better processing? (The "Report" vs "Tired" case).
      4.  **Certainty Check:** Do I *know* Future-Me will say this, or do I just *guess*?

  4.  **Developing the Whiteboard Layout:**
      *   Keep it visual. Boxes and Arrows.
      *   Time limit: 10 mins.
      *   Tone: Professional, direct, operational.

  5.  **Running the Test Cases:**
      *   *Case 1 (Report):* 60% now -> 85% after report.
          *   Selection Bias? No.
          *   Rationality? Same.
          *   Info? New data expected.
          *   Result: If you *know* you'll be 85%, you expect the news to be good. You should update now. (This might be the "won't like" answer if they feel they shouldn't update before seeing data, but logically, if you know your future reaction, you've already processed the expectation). *Wait, let's pause.* If I know the report comes out, but I don't know the content, how do I *know* I'll be 85%? I must have inside info or a strong model. If I have a strong model that says "Report will likely be good, pushing me to 85%", then my current 60% is inconsistent with my model. I should move to 85%.
          *   *Alternative interpretation:* The prompt says "One of those should give me an answer I won't like." Usually, people hate updating on data they haven't seen. But the logic of Reflection demands it.
          *   *Actually, Case 2 is the trap.* Case 2 is the "Don't Defer" case. Case 1 is the "Defer" case. Which one is uncomfortable?
          *   If I'm 60% and know I'll be 85% after a report, moving to 85% now feels like cheating/insider trading. But if I *know* I'll be 85%, I've essentially decoded the report.
          *   Let's make Case 2 the "Don't Defer" (Survivorship bias). That's the dangerous one.
          *   Let's make Case 1 the "Defer" (Rational Update).
          *   Wait, the prompt says "One of those should give me an answer I won't like."
          *   If I'm 60% and the procedure says "Jump to 85% immediately," that feels risky.
          *   If I'm 40% and the procedure says "Ignore Future-Me's 70%," that feels like ignoring optimism.
          *   Let's look at Case 2 again: "If I'm still employed... I'll be at 70%." Employment depends on project success. Project success is likely the event being forecasted (or correlated). If the project fails, I'm fired, no Future-Me. So Future-Me only speaks if Success. This is biased. Procedure says: **Do Not Defer.** This is the safe answer.
          *   Case 1: "After quarterly report... I'll be at 85%." Procedure says: **Defer.** Why? Because if you are certain of your future credence, you have already anticipated the evidence. Staying at 60% implies you think your future self will be irrational or you are ignoring your own expectation of the news. The "won't like" answer is likely Case 1, because updating *before* seeing the report feels wrong to practitioners, even if logically consistent with the premise "I *know* I will be 85%."
          *   *Actually, let's flip it.* Usually, the "won't like" answer in Reflection contexts is realizing you *must* update now because you trust your future self. But in Case 2, the answer is "Don't trust."
          *   Let's ensure the procedure clearly distinguishes these.

  6.  **Finalizing the Procedure Structure:**
      *   **Header:** Reflection Principle Decision Matrix.
      *   **Step 1: The Existence Test (Selection Bias).**
      *   **Step 2: The Competence Test (Memory/Reasoning).**
      *   **Step 3: The Information Test (New Data vs. Processing).**
      *   **Step 4: The Certainty Test (Prediction vs. Knowledge).**
      *   **Outcomes:** Defer, Don't Defer, Judgment Call.

  7.  **Addressing Specific Constraints:**
      *   "Where the procedure just says no." (Selection Bias, Competence Loss).
      *   "Where it hands the decision to me." (Judgment Call on degree of improvement).
      *   "No bibliography."
      *   "10 minutes."

  8.  **Refining the "Won't Like" Answer:**
      *   Case 1 (Report): If you *know* you'll be 85%, you must believe the report will be favorable. If you believe that now, why are you 60%? The procedure forces you to 85% now. This feels like "betting the farm" before the news. That's the uncomfortable one.
      *   Case 2 (Employment): The procedure forces you to stay at 40% (or ignore the 70%). This is safer but frustrating because you want to be optimistic.
      *   I will frame Case 1 as the one that forces the aggressive update (the "won't like" because it increases risk exposure immediately).

  9.  **Writing the Content:**
      *   Use bolding for steps.
      *   Keep language tight.
      *   Ensure the "Whiteboard" feel (lists, clear paths).
      *   Check the "Tiredness" vs "Forgetting" distinction. Tiredness = Defer (Future is better). Forgetting = Don't Defer (Future is worse).

  10. **Review against constraints:**
      *   Decision procedure? Yes.
      *   Whiteboard ready? Yes.
      *   10 mins? Yes.
      *   Ordered questions? Yes.
      *   Good answers defined? Yes.
      *   Stop points? Yes.
      *   Judgment calls identified? Yes.
      *   Handles: New evidence, conditional existence, forgetting, tiredness.
      *   Run two cases? Yes.
      *   One answer unliked? Yes.
      *   Where it can't help? Yes.
      *   No bibliography? Yes.

      *(Self-Correction during drafting)*: Make sure to emphasize that "Knowing" future credence is a high bar. If it's just a guess, Reflection doesn't trigger. The procedure needs to filter "Prediction" vs "Knowledge."
      Also, clarify Case 2: If employment depends on success, and success is what we are forecasting, Future-Me is a biased sample.
      Clarify Case 1: If the report is external, and I know my reaction, I've internalized the expectation.

      Let's assemble.

      *Structure:*
      1.  Title.
      2.  The 4-Step Filter.
      3.  The Verdicts.
      4.  The Test Runs.
      5.  The "Human in the Loop" Warning.

      *Tone:* Direct, operational, slightly skeptical (fitting a risk manager).

      *Wait, one nuance on Case 1:* If I know the report drops tomorrow, but I don't know the content, how can I *know* I'll be 85%? I can't, unless I have a model that predicts the report's content. If I have a model that predicts the content, I should use the model now. So the procedure should force me to use the model now. That's the "won't like" part—I have to commit to the model's conclusion before the confirmation arrives.

      *Wait, one nuance on Case 2:* "If I'm still employed." This is $P(FutureCredence | Employed)$. But $Employed \implies Success$. So Future-Me only exists if Success. Future-Me's credence is conditional on Success. I cannot use $P(Success | FutureCredence)$ without correcting for the selection bias. The procedure must catch this.

      Okay, ready to write.
answer: |-
  # The Reflection Principle Decision Matrix
  **Timebox:** 10 Minutes  
  **Goal:** Determine if Current-You should adopt Future-You's probability estimate.  
  **Rule:** If you pass all filters, you **MUST** defer. If you fail any filter, you **MUST NOT** defer. If you land in the gray zone, it is a **JUDGMENT CALL**.

  ---

  ## Step 1: The Existence Filter (Selection Bias)
  **Question:** Does Future-Me exist and hold this credence *regardless* of whether the event I'm forecasting happens?
  *   **Yes:** Future-Me exists in all scenarios (e.g., "Tomorrow morning"). → **Proceed to Step 2.**
  *   **No:** Future-Me only exists/speaks if a specific outcome occurs (e.g., "If I'm still employed," "If the deal closes"). → **STOP. DO NOT DEFER.**
      *   *Why:* You are sampling a survivor. Future-Me's opinion is screened off by the event itself. Using their number double-counts the evidence.
  *   **Unsure:** → **JUDGMENT CALL.** Estimate the correlation between the event and Future-Me's existence. If high correlation, treat as **No**.

  ## Step 2: The Competence Filter (Rationality & Memory)
  **Question:** Is Future-Me strictly more rational, better informed, or better rested than Current-Me, without losing critical data?
  *   **Yes (Better):** Future-Me is less tired, has had time to reflect, or has better tools. → **Proceed to Step 3.**
  *   **No (Worse/Same):** Future-Me is likely to forget base rates, will be more tired, or is emotionally compromised. → **STOP. DO NOT DEFER.**
      *   *Why:* Reflection assumes Future-Me is a rational updater. If Future-Me is degraded, their number is noise.
  *   **Mixed:** Future-Me is less tired but might forget context. → **JUDGMENT CALL.** Weigh cognitive gain against memory loss.

  ## Step 3: The Information Filter (New Evidence vs. Processing)
  **Question:** Is the change in probability due to *new external data* arriving or just *internal processing* of existing data?
  *   **Internal Processing Only:** No new news, just thinking harder. → **DEFER.**
      *   *Why:* If you know you will reason better to 70%, you should reason better to 70% now.
  *   **New External Data:** A report, email, or market move will happen. → **Proceed to Step 4.**
  *   **Mixed:** Some data, some processing. → **JUDGMENT CALL.** Is the data the main driver?

  ## Step 4: The Certainty Filter (Knowledge vs. Prediction)
  **Question:** Do I *know* now that Future-Me will hold this specific number, or do I just *predict* they will?
  *   **I Know:** I am certain of the future number (e.g., "I have a rule that says if X happens, I set probability to 85%"). → **DEFER.**
      *   *Why:* If you know your future reaction, you have already anticipated the evidence. Staying at your current number is irrational inconsistency.
  *   **I Predict:** I'm guessing what Future-Me will think. → **STOP. DO NOT DEFER.**
      *   *Why:* Reflection requires certainty about the future credence, not a guess about it.

  ---

  ## Test Run: Case 1 (The Quarterly Report)
  **Scenario:** Current Credence: **60%**. Future Credence: **85%** (after quarterly report drops tomorrow).
  1.  **Existence:** Does Future-Me exist regardless of the report content? **Yes.** (You still have a job tomorrow).
  2.  **Competence:** Is Future-Me more competent? **Same/Yes.** (Assume same brain, just later).
  3.  **Information:** Is this new data? **Yes.** (The report).
  4.  **Certainty:** Do you *know* you'll be at 85%? **Premise says Yes.**
      *   *Logic:* If you are certain you will update to 85% upon seeing the report, you effectively already expect the report to be positive.
      *   **Verdict:** **DEFER.** Update to 85% now.
      *   **The Uncomfortable Truth:** You must move your number *before* seeing the report. If you truly know your future self will be 85%, staying at 60% implies you think your future self will be irrational or you are ignoring your own expectation of the news. You are forced to bet the higher number immediately.

  ## Test Run: Case 2 (The Employment Condition)
  **Scenario:** Current Credence: **40%**. Future Credence: **70%** (if still employed next month). Employment depends on project success.
  1.  **Existence:** Does Future-Me exist regardless of the event? **No.**
      *   *Logic:* You are only employed *if* the project succeeds. Future-Me is a "survivor."
      *   **Verdict:** **STOP. DO NOT DEFER.**
      *   **Reason:** Future-Me's 70% is conditional on success. You cannot use a success-conditional probability to estimate the probability of success. That is circular. Stick with 40% (or re-evaluate based on current data only).

  ---

  ## Where This Procedure Fails (The "Judgment Call" Zones)
  The algorithm cannot solve these; you must use your gut and document your reasoning:

  1.  **Partial Memory Loss:** Future-You is less tired but forgets a specific email chain you have open right now.
      *   *Action:* Weigh the cognitive boost against the information loss. There is no formula.
  2.  **Correlated Existence:** Future-You exists even if the project fails, but is much more likely to speak up if it succeeds.
      *   *Action:* Estimate the bias. If the bias is strong, treat as **Step 1 Failure**.
  3.  **Predicted vs. Known:** You are 90% sure Future-You will say 70%, but not 100%.
      *   *Action:* Reflection is binary. If not 100% certain, you technically shouldn't defer fully, but you should move your number toward 70% proportionally. The procedure doesn't calculate the weight; you must.

  **Final Instruction:** If the procedure says **DEFER**, write the new number and sign it. If it says **DO NOT DEFER**, write the current number and note "Reflection Blocked by [Step X]." If **JUDGMENT CALL**, write the number you choose and write "Manual Override: [Reason]."
