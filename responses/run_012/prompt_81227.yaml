answer: |-
  Hi, thanks for writing. You are right to feel that the philosophy is getting in the way of the work, because in this context philosophy is just a fancy word for the consequences of our choices. Your half-idea is correct and you should keep it. The conflict almost always comes from two people treating the same physical thing as two different kinds of objects without admitting it. One person sees a specific lump of matter with a specific history, like a relic or a bone. The other sees a design or a function that could be remade and still do the job, like a chair or a cast. Your job is not to solve the metaphysics but to force everyone to agree on which kind of thing they are dealing with before money changes hands or glue dries. The procedure below is designed to separate the factual questions from the value questions so you know when to stop and who to call.

  Here is the decision procedure you can run at your desk. First, ask the curator what would be lost if the object vanished and was replaced by a perfect modern copy. If the answer is that nothing would be lost because it still looks the same and works the same, then the object is a Design Object. If the answer is that the history is lost, or the specific material is sacred, then it is a Material Object. This is your primary sort, and you can settle it in the storeroom with two tests. Look for evidence of age and wear that cannot be replicated, like tool marks or decay patterns, and ask the curator one question: would you accept a replica in this place if it looked identical? If they say yes, you are dealing with a Design Object. If they say no, you are dealing with a Material Object. Second, ask where the identity lives. For a Material Object, identity lives in the original fabric. For a Design Object, identity lives in the form or function. Third, ask what proportion of the critical component is being changed. If you are changing the critical component, you stop. For a Material Object, the critical component is the original stuff. For a Design Object, the critical component is the functioning mechanism or the recognizable shape.

  This is where the procedure gives you a hard stop. If you are treating a Material Object and the proposal requires removing original material to replace it with new material, you must record that the original object is being altered beyond recognition. If the proposal is to remove historical additions, like the eighteenth-century arms on the torso, you must flag that those additions are now part of the material history. Removing them destroys evidence of the object's life. If the treatment proceeds, the accession record must note that the object is now a composite of old and new, and you cannot claim it is the unchanged historical artifact. This is the point where you say no, this is not the original anymore in the sense that matters for scholarship and lending. You cannot have it both ways. You cannot claim historical authenticity while performing modern reconstruction.

  This is where the procedure hands the thing to a person. If the answer to the first question is unclear, or if the curator says the object is both a relic and a design, you have a value conflict, not a fact problem. You cannot solve this. You must send it to the Director. The question is no longer about conservation but about what story the museum wants to tell. Do we value the honesty of the fragment or the pleasure of the complete shape? That is a policy decision, not a technical one. The Registrar needs to know this because if the identity shifts from Material to Design, the valuation might drop, or the insurance risk might change. The Registrar keeps the number, but you must tell them if the number now attaches to a changed entity.

  Now let us run this on your three cases. Start with the Roman torso. The curator wants to remove eighteenth-century additions and add a new head. Apply the first test. Is it a Material Object or a Design Object? If it is a Material Object, the eighteenth-century arms are now historical evidence of how Romans were viewed in the eighteenth century. Removing them destroys that history. Adding a new head makes it a modern sculpture with ancient parts. If it is a Design Object, the goal is to show what a Roman torso looks like, but you admit the head is fake. The procedure says this is a Material Object because it is accessioned as an antiquity. The critical component is the ancient stone. The proposed treatment changes the historical narrative by erasing the eighteenth-century intervention. The verdict is that if you proceed, you are creating a new object. You cannot label it as the original Roman statue without qualification. The Director will not like this. They want a complete statue for the gallery. You have to tell them plainly that buying a new head and chopping off the old arms makes this a modern pastiche, not a restored ancient work. It changes the label from antiquity to composite, and it may affect its status for lending as a secure historical artifact.

  Next is the whale in the entrance hall. Apply the first test. If it vanished and was replaced by a perfect fiberglass copy, would anyone care? The school groups come to see a whale, not specific bone cells. It is a Design Object. The identity lives in the form and the educational function. The storeroom test confirms this because much of it is already cast. The procedure says you can maintain it as the same object as long as the shape and educational utility remain. You do not need to preserve every original bone fragment if it compromises the structure, but you must label it honestly as a composite skeleton. The accession number survives because the identity is in the role it plays in the museum, not the specific calcium phosphate. This is safe to proceed with standard conservation approval, provided the label tells the truth about the casts.

  Finally the longcase clock. The proposal is to swap the movement to make it run. Apply the first test. Is the value in the specific original gears or in the clock telling time? For most regional museums, a clock is a Design Object unless the movement itself is historically significant, like if it were made by a famous clockmaker. Ask the curator if the specific movement is the reason we keep it. If yes, it is a Material Object. If no, and we just want a working clock in a case, it is a Design Object. If it is a Material Object, swapping the movement kills the identity. It becomes a case containing a clock face and a modern engine. If it is a Design Object, you can swap the movement. The procedure suggests you treat the movement as a separate accessioned item if it is original. You keep the original movement in storage as the historical artifact and put the working movement in the case. The object on display is the same design, but the historical record must show the movement is not original. This splits the identity. The case and face are one object, the movement is another. This satisfies the insurer and the scholar.

  Here is what the procedure cannot do. It cannot tell you which value is more important. It can only tell you what you are losing when you choose one over the other. When you decide that the whale is a Design Object, you are choosing education over material purity. That is a choice, not a fact. You will be fooling yourself if you think the procedure proves the whale is the same object. It only proves that you have agreed to treat it as the same object for specific purposes. The identity is not in the bone. It is in the agreement between the curator, the registrar, and the public. Sometimes you will have to tell the Director that the object is dead for the purposes of scholarship but alive for the purposes of display. That is not a contradiction. It is just honesty. Use the procedure to force that honesty into the record so that ten years from now nobody claims the Roman torso is an untouched ancient relic when it is actually a modern construction with ancient fragments.

  Best of luck with the Director.
