prompt: |-
  I'm a software engineer with no formal training in philosophy, and I've been trying to work through the debates about rigid designation and the necessary a posteriori on my own. To keep it straight, I've been leaning on an analogy from my day job: a rigid designator is like a pointer, and a description is like a query. A pointer holds an address that goes on referring to the same object no matter what that object is like or which properties it happens to have; a query gets re-evaluated against the current state and can come back with something different each time. On this picture, when someone says that a name or a natural kind term picks out the same thing across every possible world, what I hear is that the term is a pointer, fixed once by an initial assignment, and that predications about it can be necessary even though we arrived at them empirically, since we had to investigate the world to learn what the pointer was aimed at. A description, by contrast, is a query, and anything built out of queries is necessary only to the extent that the query's satisfaction conditions are.

  I've been using this analogy to convince myself of something fairly strong: that identity statements tying an everyday term to a scientific one are necessary truths that we nevertheless discover empirically. I'd like you to tell me how far the analogy actually holds. Set out the correspondence explicitly in prose — what plays the role of the pointer, the address, the initial assignment, the dereference, the world or runtime state, the query, and whatever evaluates the query — and then tell me where the mapping breaks. I'm especially interested in which features of real pointers and real queries get quietly imported into the naming case with no counterpart there, and in whether the analogy can bear the conclusion I've been resting on it; if it can't, tell me what it can bear and what a better analogy would be. One thing I keep wondering about is aliasing, since two pointers aimed at the same object seems like the closest thing in my world to two names for one thing, and I'd like to know whether that helps the analogy or just hides the problem.

  Please write your answer as continuous prose. No headings, no bullet points, no bold text, and no tables — just paragraphs, the way you'd explain it to me in an email.
