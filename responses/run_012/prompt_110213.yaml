  9.  **Final Polish:** Ensure the "Cuckoo Crane" metaphor is defended consistently. Make sure the distinction between *variance*, *mechanism*, and *cause* is clear in the replies. (Self-Correction: Make sure I don't sound like I'm telling biologists how to do biology, but rather how to interpret their claims).

  *(Self-Correction during drafting)*: I need to make sure I don't ignore the flatmate's sting. That's the emotional core. The prep sheet should address that implicitly in the first objection. The Geneticists *are* the flatmate.

  *(Refining the Systems Biologist objection)*: "Scales not levels" is a classic move. I need to ensure the reply doesn't get bogged down in ontology but keeps focus on *explanatory goals*.

  *(Refining the Dennett Fan)*: The fan thinks skyhooks are just cranes we haven't found. I need to argue that a Cuckoo Crane *is* a crane, but it's in the wrong nest. It's not about *finding* the mechanism, it's about *claiming* it answers a question it doesn't.

