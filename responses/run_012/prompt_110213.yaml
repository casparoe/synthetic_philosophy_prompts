      *   **Thesis:** The Dennettian Crane/Skyhook distinction is not the primary axis of evaluation. Instead, "Greedy Reductionism" should be understood as *Question-Substitution* (swapping the *explanandum* for a neighboring one the method can answer). This makes Crane/Skyhook orthogonal to Greedy/Ungreedy. Introduces the concept of the "Cuckoo Crane" (a valid mechanism placed in the wrong explanatory nest).
      *   **Audience:** Mixed empirical and philosophical.
          *   *Empirical:* 2 Behavioral Geneticists (twin/polygenic, anti-"levels"), 1 Molecular Biologist (social insects, hard-nosed adaptationist), 1 Evo-Devo Postdoc (causal parity, anti-gene-centric), 1 Systems Biologist (scales not levels), 1 Emeritus Ecologist (anti-anecdote bias).
          *   *Philosophical:* 1 Dennett Fan (skyhooks are just undiscovered cranes), 1 Causal Parity Advocate (why need levels?), 1 Explanation Specialist (individuation of questions), 1 Historian of Science (sociobiology wars trauma).
      *   **Emotional State:** Nervous, specifically about the room's composition. Stung by flatmate's comment (stats MSc) that this is just philosophers complaining that scientists answer *their* questions.
      *   **Request:** Q&A Prep Sheet. 8-9 objections ordered by damage potential. Phrased in the audience's idiom. 2-minute replies. Candid notes on weaknesses. Advice on concessions. Identify the "Killer Question."

  2.  **Deconstruct the Thesis & Potential Vulnerabilities:**
      *   *Core Claim:* Greedy reductionism = question substitution.
      *   *Vulnerability 1 (The Flatmate/Geneticist objection):* Is this just philosophers policing scientists' definitions? If $h^2$ answers variance, isn't that useful? Why is swapping "bad"?
      *   *Vulnerability 2 (The Dennett Fan):* If a crane works, does it matter what nest it's in? If it lifts, it lifts.
      *   *Vulnerability 3 (The Systems Biologist):* "Levels" language is the problem. Scales are continuous.
      *   *Vulnerability 4 (The Causal Parity/Evo-Devo):* If everything is causally parity, why privilege one question type over another?
      *   *Vulnerability 5 (The Historian):* Are we re-fighting the Sociobiology Wars?
      *   *Vulnerability 6 (The Explanation Specialist):* How do you rigorously define "neighboring question"?
      *   *Vulnerability 7 (The Molecular Adaptationist):* If the mechanism works, the function is implied. Why separate them?
      *   *Vulnerability 8 (The Ecologist):* Is this just theoretical navel-gazing while real data rots?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Highest Damage):* The Geneticists/Flatmate. "You're mad because we answer variance questions, not cause questions." This attacks the core utility of the thesis. If question substitution is just *doing science*, the critique collapses.
      *   *Objection 2 (High Damage):* The Explanation Specialist. "Individuation." How do you define the boundaries of a question? If boundaries are fuzzy, "substitution" is unfalsifiable.
      *   *Objection 3 (High Damage):* The Systems Biologist. "Levels vs. Scales." If levels don't exist, the "nest" metaphor fails.
      *   *Objection 4 (Medium-High):* The Dennett Fan. "Skyhooks are temporary." If a cuckoo crane eventually lifts the original load, was it ever greedy?
      *   *Objection 5 (Medium):* The Historian. "Sociobiology Redux." Are you just dressing up old Lewontin/Gould critiques?
      *   *Objection 6 (Medium):* The Evo-Devo/Parity. "Why privilege function/history?" If genes are followers, why is swapping *to* genes the sin?
      *   *Objection 7 (Medium-Low):* The Molecular Adaptationist. "Mechanism *is* Function." In eusocial insects, the gene expression *is* the adaptation.
      *   *Objection 8 (Low):* The Ecologist. "Anecdotes." (Actually, he might be an ally against reductionism, but might hate the abstraction). Let's frame it as "Practical Utility."
      *   *Objection 9 (The Killer):* The "So What?" question. Even if you're right, does it change practice?

      *Refining the Order:* I need to order by *damage*.
      1.  The Geneticist/Flatmate (Utility/Definition of Science).
      2.  The Explanation Specialist (Rigor of "Question").
      3.  The Systems Biologist (Ontology of Levels).
      4.  The Dennett Fan (Teleology of Cranes).
      5.  The Historian (Political/Social Context).
      6.  The Parity/Evo-Devo (Causal Status).
      7.  The Molecular Adaptationist (Mechanism/Function link).
      8.  The Ecologist (Empirical Grounding).
      *Wait, I need a "Killer Question" separate or as the top one?* The prompt asks for 8-9 objections *plus* the dreaded question at the end. I'll make the top objection very strong, but save the existential "So What?" for the finale.

  4.  **Developing the Replies:**
      *   *Constraint:* 2 minutes spoken (approx. 250-300 words).
      *   *Tone:* Respectful, acknowledging expertise, but holding the philosophical line.
      *   *Candid Note:* Must admit where the philosophy is hand-wavy.

  5.  **Addressing the Specific Audience Idioms:**
      *   Geneticists: $h^2$, polygenic scores, variance, prediction vs. explanation.
      *   Systems: Scales, networks, emergent properties.
