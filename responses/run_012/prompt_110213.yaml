answer: |-
  This is a sharp thesis, and your anxiety is warranted: you are walking into a room of people who build the cranes you are critiquing, alongside philosophers who guard the blueprints. The flatmate's sting is the key to the room's mood: *Scientists feel policed by philosophers who don't get that answering a tractable question is better than staring at an intractable one.*

  Here is your Q&A prep sheet. The objections are ordered by potential damage to your core argument.

  ### Q&A Prep Sheet: The Cuckoo Crane

  #### 1. The Geneticist / Flatmate Objection (Highest Damage)
  **Who:** The two Behavioural Geneticists (and the ghost of your flatmate).
  **The Objection:** "You're framing 'question substitution' as a sin, but that's just how progress works. We can't answer 'what is the cause of educational attainment?' directly. We *can* answer 'how much variance is captured by SNPs?' If we call that an explanation of heritability, we aren't being greedy, we're being precise. You seem to be saying we aren't allowed to claim we've explained anything until we've answered the philosophical question you prefer. Isn't this just gatekeeping?"
  **The 2-Minute Reply:** "It's not about gatekeeping the *value* of the answer. Polygenic scores are incredibly useful for prediction and variance partitioning. My claim is about *marketing*. It becomes a 'Cuckoo Crane' when a paper title says 'Genetic Basis of Education' but the body delivers 'Variance in Education.' That's not a sin of method; it's a sin of labeling. I'm not saying don't calculate $h^2$. I'm saying don't sell $h^2$ as a causal history. If you label it 'Variance Explained,' it's a crane. If you label it 'The Cause,' it's a cuckoo."
  **Candid Note on Softness:** This relies on scientists being willing to change their titles/abstracts. They won't. You are fighting incentive structures, not just concepts. It sounds normative ("don't sell") without giving a pragmatic reason why they should care, other than "philosophical purity."

  #### 2. The Explanation Specialist Objection (High Damage)
  **Who:** The Philosopher of Explanation.
  **The Objection:** "Your whole axis rests on individuating questions. But questions aren't natural kinds. 'Why did the bird sing?' can be parsed as mechanism, function, or development depending on the context. If the boundaries of the *explanandum* are fuzzy, how do you objectively identify a 'substitution'? Isn't 'greedy' just a label for when *you* think the scientist picked the wrong parsing?"
  **The 2-Minute Reply:** "Fair. Questions aren't natural kinds, but *interests* are. In the behavioural sciences, there are distinct pragmatic contexts: intervention (policy), understanding (theory), and prediction (stats). A Cuckoo Crane occurs when a tool built for prediction (like a PGS) is presented as a tool for intervention without the causal bridge. I'm not individuating questions by syntax, but by the *inferential potential* they license. If the explanation doesn't license the inference the audience thinks they're buying, it's a substitution."
  **Candid Note on Softness:** "Inferential potential" is doing a lot of heavy lifting here. You haven't rigorously defined how to map interests to explananda. A sharp logician could press you on whether "intervention" and "cause" are truly distinct in your framework.

  #### 3. The Systems Biologist Objection (High Damage)
  **Who:** The Systems Biologist.
  **The Objection:** "You're relying on a 'nest' metaphor, which implies discrete levels. There are no levels, only scales and network dynamics. A gene expression profile isn't 'lower' than behaviour; it's a different slice of the same dynamical system. If there are no levels, there's no 'up' or 'down' for the crane to lift, and no 'nest' for the cuckoo to invade. You're solving a problem created by your own hierarchy."
  **The 2-Minute Reply:** "I'm happy to drop 'levels' for 'scales' or 'variables.' The Cuckoo Crane doesn't require a vertical hierarchy, just a *functional mismatch*. Whether it's scales or levels, the error is using a variable that tracks *correlation* (scale A) to make a claim about *control* (scale B). You can have a network without levels, but you can still have a map that claims to be a territory. My critique applies to network models that claim causal leverage they don't possess."
  **Candid Note on Softness:** You are conceding the ontology (levels) to save the epistemology (explanation). This might annoy the Dennett fan who thinks the hierarchy is real. It makes your view compatible with systems biology but potentially weaker against the reductionists.

  #### 4. The Dennett Fan Objection (Medium-High Damage)
  **Who:** The Card-Carrying Dennettian.
  **The Objection:** "Dennett says a skyhook is just a crane we haven't found yet. You say a Cuckoo Crane is a real crane in the wrong nest. But if the mechanism works—if the inclusive fitness calculation predicts the behaviour—doesn't it eventually lift the load? If the 'substitution' leads to a full causal story later, wasn't it just a heuristic crane? Why penalize the shortcut?"
  **The 2-Minute Reply:** "Because heuristics become dogmas. A skyhook becomes a crane through naturalization. A Cuckoo Crane becomes a *blocker* because it convinces us the lifting is already done. If we accept the heritability estimate as the explanation of 'why this trait exists,' we stop looking for the developmental or ecological crane. It's not penalizing the shortcut; it's warning against parking the search vehicle in the destination spot."
  **Candid Note on Softness:** This is a pragmatic argument, not a logical one. The Dennettian can reply: "That's a sociological claim about scientists being lazy, not a philosophical claim about explanation." You are blending philosophy of science with sociology of science here.

  #### 5. The Historian Objection (Medium Damage)
  **Who:** The Historian of Science.
  **The Objection:** "This smells like the Sociobiology Wars. Gould and Lewontin called out adaptationist 'just-so stories.' You're calling out reductionist 'just-so mechanisms.' Are you just reviving the Spandrels paper in new vocabulary? How do we ensure this isn't just political resistance to genetic explanations dressed up as taxonomy?"
  **The 2-Minute Reply:** "I hope not. The Spandrels critique was often read as 'adaptationism is wrong.' My critique is 'category errors are wrong.' I'm not saying genetic explanations are politically suspect; I'm saying a variance statistic is logically distinct from a causal narrative. We can apply this to neuroscientists over-claiming on fMRI data too. It's about the structure of the claim, not the political valence of the gene."
  **Candid Note on Softness:** You can't fully escape the political baggage. The Historian knows that "category error" is often a weapon used by one tribe against another. You need to explicitly mention non-genetic examples (like the fMRI one) to prove neutrality.

  #### 6. The Causal Parity Objection (Medium Damage)
  **Who:** The Evo-Devo Postdoc.
  **The Objection:** "If you accept causal parity, genes aren't privileged causes. So why is swapping *to* genes the 'greedy' move? Why isn't swapping *to* environment equally greedy? Your view seems to assume the gene is the default 'low level' that steals the show, but parity says there is no show to steal."
  **The 2-Minute Reply:** "Parity is about *causal status*, not *explanatory salience*. In the behavioural sciences, the institutional pressure is overwhelmingly to find the 'genetic basis.' Greed is context-dependent. In a lab focused on environmental enrichment, an 'environmental crane' could be a cuckoo if it ignores the developmental constraints. But right now, the cuckoo is almost always wearing a lab coat and holding a pipette. I'm critiquing the current market imbalance, not the ontological status of DNA."
  **Candid Note on Softness:** You are admitting your thesis is historically contingent, not universally true. That weakens the philosophical force but strengthens the pragmatic relevance.

  #### 7. The Molecular Adaptationist Objection (Medium-Low Damage)
  **Who:** The Social Insect Molecular Biologist.
  **The Objection:** "In my work, gene expression *is* the mechanism of the behaviour. The queen's pheromone suppresses worker ovary development via specific pathways. That's a mechanism, it's lower-level, and it explains the function. Where is the substitution? The mechanism *realizes* the function."
  **The 2-Minute Reply:** "In that specific case, there might not be one. If you trace the pathway from pheromone to ovary suppression, you've built a crane that lifts the 'how' load. The Cuckoo Crane appears when you stop there and claim you've explained *why* the colony is eusocial in an evolutionary sense. Mechanism realizes function, but it doesn't explain the selection pressure that maintained it. Don't confuse the engine with the reason for the journey."
  **Candid Note on Softness:** This risks annoying the person whose work you're using as an example. Be very gentle here. Acknowledge their work is likely *not* a cuckoo crane to keep them on side.

  #### 8. The Ecologist Objection (Low Damage / Free Hit)
  **Who:** The Emeritus Field Ecologist.
  **The Objection:** "You philosophers love your distinctions. I've spent 40 years watching birds. Sometimes the explanation is just 'because it works.' Do these distinctions help me write a grant, or do they just give me more ways to be wrong?"
  **The 2-Minute Reply:** "They help you write the grant by protecting you from the geneticists. When a reviewer asks 'what's the heritability of this behaviour?', you can say 'That's a variance question, I'm answering a functional question. They require different data.' It gives you the vocabulary to defend field work as a distinct explanatory project, not just preliminary data for a GWAS."
  **Candid Note on Softness:** This is a sales pitch. It might not actually help them get grants. But it makes you an ally rather than a critic.

  #### 9. The "So What?" Objection (Medium Damage)
  **Who:** Anyone tired of metaphysics.
  **The Objection:** "Okay, you've carved the space differently. Dennett's axis is orthogonal to yours. Fine. Does this change how we *do* science? If a geneticist ignores you and keeps substituting questions because it gets papers published, what have you achieved?"
  **The 2-Minute Reply:** "Taxonomy drives funding. If we classify 'variance explained' and 'cause identified' as the same commodity, we fund only the former. By distinguishing them, we argue for distinct funding streams for mechanistic vs. historical vs. statistical projects. It's not about stopping the geneticist; it's about ensuring the ecologist and the theorist get funded to answer the questions the geneticist can't."
  **Candid Note on Softness:** This is optimistic. Funding bodies love "integration," not separation. But it's the best pragmatic defense you have.

  ---

  ### Strategic Concessions (Say these early)
  1.  **Concede "Levels" is messy:** In your intro, explicitly say: "I use 'levels' as shorthand for 'variables at different scales of aggregation.' If you hate levels, swap in 'scales.' The argument holds." This disarms the Systems Biologist immediately.
  2.  **Concede Utility:** "Variance explanations are scientifically vital. I am not arguing they are worthless, only that they are not *causal* explanations." This disarms the Geneticists and your flatmate's ghost.
  3.  **Concede Contingency:** "The 'Greed' I'm describing is specific to the current political economy of biology, which privileges genetic data." This disarms the Historian and Parity advocate.

  ### Free Hits vs. Dangerous Hits
  *   **Free Hits:** Let the Ecologist grumble about anecdotes. Let the Historian warn about rhetoric. These people are generally on your side regarding the *problem*, even if they dislike your *solution*. Engage them warmly.
  *   **Dangerous Hits:** The Geneticists and the Explanation Specialist. If you lose rigor on "question individuation," the whole thesis dissolves into "scientists sometimes write misleading titles." If you lose the Geneticists, you look like a Luddite. Spend your energy here.

  ### The Question You're Dreading
  **The Question:** "You say question substitution is the sin. But science *is* question substitution. We replace 'What is life?' with 'How do membranes replicate?' We replace 'What is consciousness?' with 'Which neurons fire?' If you ban substitution, you ban progress. If you allow it, where is the line? Isn't your 'Cuckoo Crane' just a name for 'science I don't like yet'?"

  **Why it kills you:** It attacks the normative core. If substitution is the engine of operationalization, calling it "greedy" sounds like you want to stop science from making progress.

  **The Survival Reply:** "There's a difference between *operationalizing* a question and *replacing* it. Operationalizing is saying 'To answer X, I will measure Y.' Replacing is saying 'Y is actually X.' Progress happens when we admit Y is a proxy for X and keep looking for the bridge. Greed is claiming the proxy *is* the target. I'm not banning operationalization; I'm demanding we keep the IOU note visible."

  **What you'd have to give up:** You would have to give up the claim that this is a *logical* error. You'd have to admit it's purely a *rhetorical* or *sociological* critique. If you concede that, your thesis becomes "Scientists should write clearer abstracts," which is a paper, not a PhD chapter. **Hold the line on the "IOU note."** That is your lifeline.
