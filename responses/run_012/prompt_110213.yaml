  6.  **Strategic Advice (Concessions & Hits):**
      *   *Concede:* "Levels" language is messy. Concede that variance explanations are *useful*.
      *   *Free Hits:* Let the Ecologist vent about anecdotes (he's an ally). Let the Historian warn about rhetoric (acknowledge the risk).
      *   *Dangerous:* The definition of "Question" and the claim that substitution is *normatively bad* rather than just *different*.

  7.  **The "Killer Question":**
      *   It needs to combine the Flatmate's sting with the Explanation Specialist's rigor. "If scientists find your distinction useful, they'll adopt it. If they don't, it's just taxonomy. Which is it?" Or better: "Is 'greedy' a property of the explanation or the *marketing*?"
      *   *Decision:* The "Normative Bite" question. If question substitution is standard scientific progress (answering what you *can* answer), what right do you have to call it a sin?

  8.  **Review against Constraints:**
      *   8-9 objections? Yes.
      *   Ordered by damage? Yes.
