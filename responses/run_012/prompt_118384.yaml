answer: |-
  # The Historian's Judgment: A Decision Tree for Debate

  This handout maps the logical space of the motion: *"Historians ought not to sit in judgment on the past."* It does not tell you which position is correct. Instead, it forces you to locate your intuition by answering concrete questions. Follow the nodes in order. Your path determines your leaf.

  ## Part I: The Logical Space (The Nodes)

  The following seven questions define the boundaries of the debate. Answering them creates the combinations of views available. You must answer each node based on the specific case presented, not on your general preference for a school of thought.

  **Node 1: The Object of Judgment (The Factory Owner)**
  *Case:* A museum label describes a local factory owner who employed children in 1890.
  *Question:* Is the primary historical error located in the **owner's character** (he was cruel) or the **social system** (the economy allowed it)?
  *   **Branch A:** Character (Person).
  *   **Branch B:** System (State of Affairs).

  **Node 2: The Source of Norms (Character Branch Only)**
  *Case:* If the owner was wrong, does that judgment rely on norms that were **live in his own community** at the time?
  *   **Branch A:** Yes (Period norms are the standard).
  *   **Branch B:** No (External norms apply).

  **Node 3: The Epistemic Constraint (Character Branch Only)**
  *Case:* If external norms apply, is the owner blameworthy only if **arguments against child labor were available to be found** by him then?
  *   **Branch A:** Yes (Arguments must be discoverable).
  *   **Branch B:** No (Truth is independent of his access).

  **Node 4: Vocabulary Consistency (System Branch Only)**
  *Case:* Consider past labour or gender arrangements. Is calling them "oppressive" (moral) the same kind of anachronism as imposing an "unemployment rate" (economic) on a society that had no such concept?
  *   **Branch A:** Yes (Both are equally problematic or permissible).
  *   **Branch B:** No (Moral terms are allowed; economic concepts are not).

  **Node 5: The Atrocity Test (System Branch Only)**
  *Case:* Regarding killings that occurred before the word for "mass atrocity" existed: does applying the term clarify the **scale of suffering** or distort the **intent of the actors**?
  *   **Branch A:** Distorts Intent (Words must match contemporary understanding).
  *   **Branch B:** Clarifies Scale (Reality exists independent of vocabulary).

  **Node 6: The Audience Constraint (All Branches)**
  *Question:* Does the historian's verdict change if the output is for a **scholarly journal** versus a **national curriculum**?
  *   **Branch A:** No (Judgment is audience-independent).
  *   **Branch B:** Yes (Pedagogy requires different standards than research).

  **Node 7: The Mirror Case (All Branches)**
  *Case:* If we judge the past by our standards, must we accept that historians three centuries from now will judge **our own practices** by *their* standards, even if we think those future standards are mistaken?
  *   **Branch A:** Yes (Temporal symmetry is required).
  *   **Branch B:** No (Our era is exempt or privileged).

  ***

  ## Part II: The Positions (The Leaves)

  Your path through the nodes lands you at one of the following positions. Each leaf includes the descriptive name, the mandatory club labels where applicable, and the specific commitment you must defend.

  ### Path 1: Character Focus (Nodes 1A → 2 → 3)

  **Leaf 1: The Hometown Rule**
  *   **Path:** 1A (Character) → 2A (Period Norms).
  *   **Label:** **The Hometown Rule**.
  *   **Awkward Commitment:** You must argue that a slaveholder in a slave society cannot be judged as morally wrong by the historian, only as typical.
  *   **Status:** Occupied.

  **Leaf 2: The Discoverability Test**
  *   **Path:** 1A (Character) → 2B (External) → 3A (Discoverable).
  *   **Label:** **The Discoverability Test**.
  *   **Awkward Commitment:** You must concede that if a dissenting argument existed but was obscure, the agent is blameworthy for not finding it, even if their whole society disagreed.
  *   **Status:** Occupied.

  **Leaf 3: The Open Ledger**
  *   **Path:** 1A (Character) → 2B (External) → 3B (Not Discoverable).
  *   **Label:** **The Open Ledger**.
  *   **Awkward Commitment:** You must defend blaming agents for failing to meet standards that were conceptually impossible for them to articulate at the time.
  *   **Status:** Occupied (but often attacked as incoherent).

  ### Path 2: System Focus (Nodes 1B → 4 → 5)

  **Leaf 4: The Consistent Anachronist**
  *   **Path:** 1B (System) → 4A (Same Error) → 6A (Journal) → 7A (Mirror).
  *   **Label:** Unnamed (Rarely defended explicitly).
  *   **Awkward Commitment:** You must treat moral terms like "oppression" and economic terms like "GDP" as equally valid or invalid retrospective impositions.
  *   **Status:** **Unoccupied.** This view is unattractive because historians generally accept economic modeling while debating moral labeling; treating them identically collapses useful analytical distinctions.

  **Leaf 5: The Normative Realist**
  *   **Path:** 1B (System) → 4B (Different Error) → 5B (Clarifies Scale) → 7A (Mirror).
  *   **Label:** Unnamed.
  *   **Awkward Commitment:** You must accept that future historians may rightly condemn our economic systems using concepts we do not yet possess, just as we condemn past labour systems.
  *   **Status:** Occupied.

  **Leaf 6: The Semantic Preservationist**
  *   **Path:** 1B (System) → 4B (Different Error) → 5A (Distorts Intent).
  *   **Label:** Unnamed.
  *   **Awkward Commitment:** You must refuse to call pre-legal genocides "atrocities" because the legal vocabulary did not exist, potentially minimizing the suffering in the description.
  *   **Status:** Occupied.

  ### Path 3: Audience & Reflexivity (Nodes 6 & 7)

  **Leaf 7: The Contextual Pedagogue**
  *   **Path:** Any → 6B (Audience Matters) → 7A (Mirror).
  *   **Label:** Unnamed.
  *   **Awkward Commitment:** You must argue that a historical truth can be "wrong" for a school curriculum even if it is "correct" for a journal, creating two tiers of history.
  *   **Status:** Occupied.

  **Leaf 8: The Presentist Exceptionalist**
  *   **Path:** Any → 6A (Journal) → 7B (No Mirror).
  *   **Label:** Unnamed.
  *   **Awkward Commitment:** You claim the right to judge the past by your standards while denying future generations the right to judge you by theirs, asserting your era is the moral peak.
  *   **Status:** **Unoccupied.** This view is incoherent; it claims objective standing for subjective temporal preferences.

  **Leaf 9: The Absolute Archivist**
  *   **Path:** Any → 6A (Journal) → 7A (Mirror) → (Implicit: No Judgment).
  *   **Label:** Unnamed.
  *   **Awkward Commitment:** You must describe atrocities and systems without using evaluative language like "cruel" or "oppressive" to maintain perfect symmetry with the future.
  *   **Status:** Occupied.

