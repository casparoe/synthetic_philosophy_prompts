  ## Part III: Label Analysis & Gaps

  **Collapse of Labels:**
  None of the three homemade labels collapse into one another within this tree. They occupy distinct leaves on the Character Branch (Leaves 1, 2, and 3). However, **The Open Ledger** (Leaf 3) is logically unstable. It combines "External Norms" with "No Epistemic Constraint." In practice, debaters defending The Open Ledger often drift into The Discoverability Test when pressed on fairness, suggesting The Open Ledger may be a rhetorical stance rather than a defensible logical position.

  **Unreachable Positions:**
  The tree cannot reach a position that judges **Systems** by the **Hometown Rule**. The tree forces a choice at Node 1 (Person vs. System). If you choose System, you move to Node 4 (Vocabulary), bypassing Node 2 (Period Norms). This reveals a gap in the club's previous debates: we have argued about judging *people* by local norms, but rarely about judging *systems* by local norms. If you believe a past system should only be judged by the standards of that system's time, you must force a new branch at Node 4.

  **Indistinguishable Leaves:**
  **Leaf 5 (Normative Realist)** and **Leaf 9 (Absolute Archivist)** are difficult to separate in practice. Both accept the Mirror Case (future judgment on us). The distinction relies on whether one uses moral vocabulary (Realist) or avoids it (Archivist). In a debate round, these two positions often converge on the same practical outcome: describing harm without assigning personal guilt.

  ***

  ## Appendix: Reading Guide for Debaters

  **How to Use This Tree:**
  Do not start by choosing a leaf. Start at Node 1. Read the case aloud to your opponent. If you disagree on the answer, you have found your first point of clash. If you agree, move to the next node indicated by your answer. Continue until you reach a leaf. That leaf is your position for the round.

  **Hardest Leaf to Defend:**
  **Leaf 8 (The Presentist Exceptionalist).** No debater should attempt to occupy this leaf. It requires you to claim that our current moral standards are the final word of history, insulating us from the very judgment we impose on the past. It is rhetorically vulnerable to the "Mirror Case" (Node 7).

  **Hardest Leaf to Refute:**
  **Leaf 2 (The Discoverability Test).** This is the most robust position. It allows for moral judgment (unlike The Hometown Rule) but respects historical context (unlike The Open Ledger). To refute it, you must prove either that arguments were *not* available when they were, or that availability is irrelevant to moral truth.

  **Note on Unoccupied Leaves:**
  Leaves marked "Unoccupied" (4 and 8) are logical possibilities that historians generally reject. If you find yourself arguing for one, check your path. You may have answered a Node inconsistently. For example, if you want to judge the past but exempt the present, you are at Leaf 8; you must either accept future judgment (move to Leaf 5 or 9) or stop judging the past (move to Leaf 1).
