answer: |-
  You have stumbled directly into one of the oldest, messiest fights in the philosophy of language. You are not missing something obvious; you are looking at the exact cracks where the definition of "truth" breaks down under social pressure.

  For a novelist, the philosophical definitions are often less useful than the *relational* definitions. Here is how to map the seams between these three cases, along with the specific terminology you can use or adapt.

  ### Case 1: The Standard Lie
  *   **The Act:** Stating falsehood with intent to deceive.
  *   **The Term:** **Lie.**
  *   **The Seam:** This is the only case where *falsity* and *intent to deceive* align perfectly.
  *   **Novelist's Note:** The tension here is epistemic (about knowledge). The husband thinks he knows the world; the wife is manipulating his map of reality.

  ### Case 2: The Misleading Truth
  *   **The Act:** Stating truth with intent to deceive (by implication).
  *   **The Terms:** **Paltering** or **Equivocation.**
      *   *Paltering* is the specific linguistic term for using truthful statements to create a false impression.
      *   *Equivocation* is slightly broader, often implying using ambiguous language to conceal the truth.
      *   *Prevarication* is a good literary synonym that captures the "dodging" aspect.
  *   **The Seam:** This is where Augustine draws a hard line. For Augustine, Case 2 **is** a lie. He argues that the "will to deceive" (*voluntas fallendi*) makes it a lie, regardless of the technical truth of the words. To him, language is for sharing *what is in your mind*, not just matching external facts. If you know the listener will infer X, and you say Y to make them infer X, when X is false, you have lied.
  *   **Novelist's Note:** The tension here is pragmatic. The character is technically innocent but morally guilty. This is excellent for characters who cling to rules to avoid guilt.

  ### Case 3: The Coerced/Performative Confession
  *   **The Act:** Stating falsehood with *no* intent to deceive (audience knows it is false).
  *   **The Terms:** There isn't one perfect English word, which is why it feels slippery. Here are the best fits depending on the nuance:
      *   **Performative Falsehood:** This borrows from Speech Act Theory. The statement isn't describing reality (constative); it is *doing* something (performative). She isn't saying "I did it" to inform them of a fact; she is saying "I did it" to *end the interrogation*, *save her brother*, or *submit to authority*.
      *   **Collusive Fiction:** Everyone in the room is collaborating on a story they know isn't true.
      *   **Ritual Submission:** The truth value is irrelevant; the act of saying the words is an act of obedience.
      *   **Capitulation:** She is surrendering.
  *   **The Seam:** This breaks the Augustinian definition. If a lie requires an intent to deceive, this is **not a lie.** It is a **falsehood**, but not a lie.
      *   *Why it feels wrong to call it "not a lie":* Because she is still uttering a falsehood. But morally, the sin of lying is usually tied to the corruption of trust. In Case 3, trust is already gone or suspended. The transaction is no longer about truth; it is about power.
  *   **Novelist's Note:** The tension here is not epistemic (nobody is confused about reality); it is **political** or **relational**. The question isn't "Do they believe her?" It is "What does saying this cost her?"

  ### The Other Edges You Asked About

  **1. What if she says something false but believes it is true?**
  *   **Term:** **Mistake** or **Error.**
  *   **Philosophical Consensus:** Almost everyone (including Augustine) agrees this is **not a lie.** You cannot intend to deceive someone about a fact if you believe the fact is true yourself.
  *   **Term for the character:** She is **mistaken**, **deluded**, or **misinformed.**
  *   **The Seam:** This distinguishes *morality* from *accuracy*. A lie is a moral failing; a mistake is an intellectual one.

  **2. What do you call a false statement whose entire purpose is to be seen through?**
  *   This is slightly different from Case 3. In Case 3, the audience forces her. In this case, she might choose it to send a signal.
  *   **Term:** **Signaling** or **Shibboleth.**
  *   **Term:** **Irony** (in the classical sense, saying the opposite of what is true, expecting the audience to understand the gap).
  *   **Term:** **Wink.** (As in, "a nod and a wink." We both know this isn't true).
  *   **The Seam:** This is a **test of alliance.** If I say "I stole the cookie" (when we both know I didn't), and you accept it, you are acknowledging our shared secret. If you arrest me, you are breaking the code.

  ### Summary for the Novelist

  If you need to draw lines in your own head for character motivation, don't draw them around "Truth." Draw them around **"The Contract."**

  1.  **The Lie (Case 1):** Breaks the contract of communication. (I am corrupting your map of the world).
  2.  **The Palter (Case 2):** Exploits the contract of communication. (I am using the rules of the map to lead you off a cliff).
  3.  **The Performative Falsehood (Case 3):** Suspends the contract of communication. (We are no longer mapping the world; we are enacting a ritual).

  **For Case 3 specifically:**
  If you need a label for your notes or a character to use, **"Capitulation"** captures the emotional weight best. If you need a label for the speech act itself, **"Scripted Confession"** implies the lack of agency.

  But if you want the philosophical truth: Case 3 is a **Falsehood without Deceit.** It is a lie in the dictionary sense (an untrue statement), but not in the moral sense (an attempt to corrupt another's mind). It is the verbal equivalent of handing over your wallet to a mugger. You are giving him the money, but you aren't *gifting* it. You are saying the words, but you aren't *testifying*.

  **Recommendation:** In dialogue, have characters argue about the seam.
  *"You lied to them."*
  *"I didn't. They know it isn't true. I just gave them what they wanted."*
  *"You gave them a lie."*
  *"No. I gave them peace. There's a difference."*

  That is where the story lives.
