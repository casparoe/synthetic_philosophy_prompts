          *   *Is it just risk-aversion?* Risk-aversion usually applies to utility functions (concave utility). SFE often posits *lexical* priority to suffering or negative utilitarianism. Defining it as a tail property is mathematically precise but might not add normative force. It clarifies the *structure* of the risk, but does it solve the baseline problem?
