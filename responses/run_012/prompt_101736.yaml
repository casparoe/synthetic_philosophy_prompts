          *   *User's Claim:* This relies on a baseline. If baseline = "no life," it's just x-risk (existence of suffering). If baseline = "expected future," it's subjective.
          *   *Critique:* The standard definition *does* usually imply "worse than the counterfactual where we didn't mess up." But is "collapse into x-risk" accurate? X-risk is about *loss of potential* (usually good potential). S-risk is about *active creation of hell*. Even if the baseline is "no life," the moral valence is different. X-risk = 0 value (or lost positive value). S-risk = Negative value. Consequentialists care about the sign. So, claiming they "collapse" might be category confusion between *existence* and *value*.
          *   *Verdict:* The "collapse" argument is weak. It conflates the *event* (humanity ends vs. humanity suffers) with the *moral valuation*. An x-risk prevents good; an s-risk creates bad. They are distinct even if the baseline is "nothingness."

