          *   *Normative Implication:* This highlights the tension between Classical Utilitarianism (sum) and Negative Utilitarianism/Prioritarianism (focus on worst-off).
          *   *Verdict:* This is the strongest point. It's a known tension in SFE circles, but framing it via distribution tails is clear.

