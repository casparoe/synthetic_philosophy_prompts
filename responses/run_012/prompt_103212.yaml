  3. Spend fifteen minutes on interrogation, escalate stakes at minute twenty by announcing found Hiders are eliminated, and freeze the action at minute twenty-five when a Gatekeeper faces a direct threat to a Hider's safety.
  4. Guide them to see that breaking their own rule violates a duty owed to humanity rather than merely to the person in front of you, shifts responsibility for unforeseeable outcomes onto the liar, and conflates the Seeker's demand with a legitimate right to determine the truth.
  5. Expect students to break the rule immediately when stakes feel real, revealing that the activity cannot reproduce the internal rational necessity Kant claims binds us regardless of emotional pressure or perceived outcomes.
