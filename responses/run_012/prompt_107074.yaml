answer: |-
  The mathematical practice you describe rests on a distinction that is structural rather than doctrinal. It does not explicitly endorse a specific philosophy of logic, but its operational constraints implicitly commit it to a specific topology of justification. Below is a reconstruction of that implicit theory, an analysis of its stability, and an exploration of the counterfactuals you propose.

  ### 1. The Implicit Theory of Justification

  The practice presupposes a **Non-Propositional Termination Thesis**.

  Strictly speaking, the practice rules out **Propositional Foundationalism** about logic. If basic rules of inference were treated as self-justifying propositions (e.g., "Modus Ponens is True"), the Tortoise would immediately reappear. One could accept the proposition "Modus Ponens is True" without accepting the *rule* Modus Ponens. Therefore, the practice cannot treat the bedrock of justification as a set of truths.

  Instead, the practice strictly presupposes that justification is a transitive relation that must terminate in something that is not a candidate for truth or falsity. The terminus is not a *premise* but a *procedure*. This commits the practice to the view that the justification of deduction is **categorially distinct** from the justification of empirical or mathematical claims.
  *   **Object Level:** Justification is derivational (propositional).
  *   **Meta Level:** Justification is constitutive (procedural).

  **What is strictly presupposed:**
  1.  **The Use/Mention Distinction:** Rules are used to derive conclusions; they are not mentioned as premises within the derivation.
  2.  **Normativity over Regularity:** The practice presupposes that following a rule confers *entitlement*, not merely predicts behavior. A proof is not a record of what mathematicians *do*, but a warrant for what they *may* assert.
  3.  **Termination in Action:** The regress of justification stops at a "form of life" (to use Wittgenstein's phrase) or a shared practice of inference. The "because" of logic ends in a "therefore" that is enacted, not stated.

  **What merely fits well (Compatible but not Required):**
  *   **Pragmatism:** The idea that rules are justified because they "work" fits the practice well but is not strictly presupposed. A mathematician does not need to verify the utility of Modus Ponens to use it; they need only recognize it as constitutive of the game.
  *   **Coherentism:** The idea that rules are justified by their role in a wider system fits, but the practice allows for the isolation of specific rules (e.g., rejecting the Law of Excluded Middle in intuitionism) without collapsing the whole system.
  *   **Wittgensteinian Hinge Epistemology:** The view that rules are "hinges" on which inquiry turns fits perfectly, but the practice does not require the philosophical baggage of *On Certainty* to function.

  **Rival Accounts Ruled Out:**
  *   **Infinitism:** The practice rules out the idea that every rule requires a further rule to justify it.
  *   **Psychologism:** The practice rules out the idea that logical validity is grounded in human psychological dispositions. If logic were merely how we are disposed to think, a "gap" in a proof would be a psychological failure, not a logical void.
  *   **Platonist Logic:** While many mathematicians are Platonists about *objects*, the practice rules out Platonism about *rules* in the sense that rules exist as independent truths waiting to be discovered. Rules are stipulated (as seen in the choice between classical and intuitionistic logic).

  ### 2. The Stability of the Split and the Meta-Level Regress

  You ask whether the split between object-level rigor and meta-level stipulation is stable, or if it merely relocates the Tortoise.

  **The Relocation is Real, but Hierarchical:**
  The practice accepts that the regress is relocated to the meta-level. When a proof assistant verifies a kernel, or a logician proves the soundness of System A within System B, the rules of System B are indeed stipulated. This creates a **hierarchy of trust** rather than a circle of justification.
  *   **Stability Condition:** This split is stable *operationally* because it converts an infinite regress into a finite chain of dependencies ending in a "Trusted Computing Base" (in verification) or "Standard Logic" (in ordinary math).
  *   **Instability Condition:** It is unstable *philosophically* if one demands an absolute foundation. The practice implicitly admits that absolute foundation is unavailable; it settles for **relative certainty**. The "scandal" is avoided not by solving the Tortoise but by dissolving the demand for a propositional ground for the rules.

  **Rule-Following vs. Disposition:**
  Regarding the relation between following a rule and entitlement: The practice presupposes **genuine rule-following**, not merely reliable disposition.
  *   **Why?** If proof were merely a reliable disposition, a "gap" would not void the proof so long as the conclusion was true and the mathematician was reliably disposed to reach it. But the practice insists on the *path*.
  *   **The Commitment:** This presupposes that rules have **normative force**. To be entitled to a conclusion, one must have traversed the path *because* the rule licenses it. However, the practice remains agnostic on *how* rules guide us (Kripke's skeptical paradox). It presupposes that we *can* follow rules, without explaining the metaphysics of that ability. It treats rule-following as a primitive capacity.

  ### 3. Counterfactuals: What Would Have to Change?

  **Scenario A: Basic Rules Stand in Need of Justification**
  If we adopted a theory where basic rules (like Modus Ponens) required justification in the same way premises do:
  *   **Proof Becomes Impossible:** As the Tortoise demonstrates, if a rule must be justified by a premise, and that premise requires a rule to detach it, we enter an infinite regress. No derivation could ever be completed.
  *   **Relocation of Demand:** The demand would not be discharged; it would be paralyzed. Mathematics would cease to be a system of warrant-conferring derivations and would become a system of **dialectical negotiation**. We would not say, "This is proved," but rather, "This is asserted based on rules we currently agree to defend."
  *   **Survival:** Calculation and computation would survive (as causal processes), but *proof* (as normative warrant) would vanish.

  **Scenario B: Proof as Social/Rhetorical Achievement**
  If we adopted a view where proof is essentially a social or rhetorical achievement (e.g., a convincing narrative rather than a gapless derivation):
  *   **Abandoned:**
      *   **Formal Verification:** Projects like Coq, Isabelle, or Lean would lose their philosophical point. If proof is rhetorical, a "gapless" machine check is merely a very persuasive rhetorical device, not a categorical guarantee.
      *   **The Concept of "Error":** A gap in a proof would not be a fatal void but a rhetorical weakness to be smoothed over. The binary status of "proved/unproved" would dissolve into degrees of "accepted/rejected."
      *   **Independence Results:** The rigorous distinction between what is provable and what is independent (e.g., Continuum Hypothesis) relies on the strict object/meta distinction. If rules are rhetorical, independence becomes a matter of social consensus rather than structural limitation.
  *   **Survive:**
      *   **Peer Review:** This would remain, but its function would shift from checking derivations to assessing plausibility and utility.
      *   **Applied Mathematics:** Engineering and physics rely on models that are already known to be approximations. They would remain largely untouched, as they already treat mathematical derivation as a tool for prediction rather than absolute truth.
      *   **Consensus:** Mathematics would look more like law or ethics, where precedents and persuasive arguments establish norms, rather than a cumulative edifice of necessary truths.

  ### Summary

  The practice you describe presupposes a **Procedural Foundationalism**. It insists that justification must terminate, but it locates the terminus in *actions* (inferences) rather than *propositions* (axioms). It is stable only so long as we accept that the "Trusted Kernel" is trusted by stipulation and convention, not by proof.

  If we demanded justification for the rules themselves, the practice would collapse into infinite regress. If we reduced proof to rhetoric, the practice would survive as a social institution but lose its claim to necessity. The "calm response" to the Tortoise is not a solution to the philosophical problem, but a disciplined refusal to treat the philosophical problem as a mathematical one. The practice assumes that at some point, we must stop arguing and start inferring.
