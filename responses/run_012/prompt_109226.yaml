answer: |-
  1. "The practice"
  The common law enforces promises only under specific conditions. First, a promise is binding if supported by consideration: a bargained-for exchange where the promisee gives something in return. Second, a promise is binding under promissory estoppel if the promisee has detrimentally relied on it, even absent consideration. Conversely, bare gratuitous promises—gifts or donations made without return or reliance—are strictly unenforceable, regardless of solemnity. Finally, promises made to discharge antecedent moral obligations, such as reimbursing a benefactor, occupy an ambiguous zone; courts are divided on whether past moral duty constitutes valid consideration or remains unenforceable gratuity. The law thus creates a tripartite structure: enforceable bargains, enforceable reliance, and unenforceable gifts, with moral obligations fluctuating between the latter two categories.

  2. "What it presupposes"
  This pattern presupposes that promises are not inherently binding moral acts but rather instruments requiring external validation to warrant state coercion. The law operates on the assumption that the mere act of promising creates no legal debt; something additional must transform a social commitment into a legal obligation. Specifically, the practice requires a theory of *conditional* binding based on either transactional reciprocity or induced harm. By enforcing bargains, the law presupposes that mutual exchange signals serious intent and economic utility, distinguishing business commitments from casual assurances. Consideration acts as a formal marker, separating legally cognizable promises from social pleasantries. By enforcing reliance, it presupposes that the harm suffered by the promisee, not the promisor's word, generates the duty to repair. Here, the binding force is not the promise itself, but the injustice of leaving the reliance uncompensated.

  Crucially, the refusal to enforce gratuitous promises reveals a presupposition that fidelity alone is insufficient for legal liability. The law assumes that without consideration or reliance, there is no objective evidence of intent to be legally bound, or alternatively, that the social cost of enforcement outweighs the moral benefit. It presumes that gift-promises lack the seriousness of bargains and that enforcing them would inundate courts with domestic disputes. The division on moral obligations highlights a tension within this presupposition: is the binding force located in the *benefit previously received* (quasi-exchange) or the *promise itself*? The pattern strictly requires that some external factor—price, harm, or past benefit—must anchor the promise. It rejects the notion that the internal will of the promisor, expressed verbally, is self-sufficient. Thus, the implicit theory is skeptical of promissory autonomy, treating promises as binding only when they intersect with economic exchange or detrimental consequences. It presupposes that legal obligation arises from the *context* of the promise rather than the *content*, prioritizing economic security and reliance protection over the moral duty of fidelity. The law treats the promise not as a self-contained moral unit, but as a trigger for liability only when attached to specific socio-economic conditions. Ultimately, contract law functions as a facilitator of reliance and exchange, utilizing consideration as a channeling device.

  3. "What it leaves open"
  Despite these requirements, the practice remains philosophically underdetermined because multiple incompatible theories justify the same rules. First, a *Reliance Theory* (associated with Fuller) fits the pattern: promises bind only because breaking them causes harm. This explains estoppel and bargains (where reliance is presumed) but excludes gifts (no harm). Second, an *Economic Efficiency Theory* (Posner) also fits: enforcement maximizes wealth by securing exchanges and preventing wasteful reliance, while gifts are wealth transfers the law need not facilitate. Third, a *Formalist Evidentiary Theory* fits: consideration is merely a cautionary formality to prove intent, not a substantive requirement of value.

  The practice cannot choose among these because the observable rules are identical under each description. Whether courts enforce bargains to protect autonomy, wealth, or reliance, the outcome is enforcement. The moral-obligation split further obscures the underlying theory. If the law were purely reliance-based, past benefits would never enforce a promise. If purely will-based, all deliberate promises would bind. The fact that courts oscillate suggests the rules are pragmatic compromises rather than deductions from a first principle. The pattern accommodates the view that promises bind because of the *promise*, provided there is evidence (consideration); it also accommodates the view that promises bind because of the *harm*, provided there is a promise. Because the legal outcomes overlap, the practice leaves the fundamental justification—whether the duty arises from the will, the harm, or the exchange—radically open. Furthermore, the law does not distinguish between reliance damages and expectation damages in a way that cleanly separates these theories. If the law were purely about reliance, expectation damages (giving the benefit of the bargain) would be unjustified enrichment. Yet they are standard. This suggests the law borrows from multiple theories without committing to one, using the language of promise to mask a foundation in economic policy or harm prevention. The rules are a vessel capable of carrying conflicting philosophical cargoes.

  4. "If the rivals were true"
  If the *Pure Will Theory* were true, the law would enforce all deliberate promises, including gifts, provided intent was clear. Consideration would be irrelevant; a solemn declaration or written document would suffice. Contract law would merge with property law regarding gifts, or become a general law of obligations akin to civil law systems. The moral-obligation cases would be resolved uniformly: if the promisor intended to bind themselves, the promise stands. The current refusal to enforce gifts would be seen as an unjust restriction on autonomy.

  If the *Pure Reliance Theory* were true, expectation damages would vanish. Recovery would be limited to out-of-pocket losses. Bargains without reliance would not be enforced, undermining the certainty of commercial exchange. Promissory estoppel would become the primary cause of action, not a fallback. The moral-obligation cases would likely fail unless the past benefit induced the new promise, but even then, recovery would be limited to the value of the reliance, not the promise amount.

  If the *Pure Efficiency Theory* were true, enforcement would turn on specific calculations of social welfare. Some bargains might be voided if enforcement discouraged efficient breach, while some gifts might be enforced if they produced positive externalities. The rigid rule of consideration would be replaced by a flexible standard of utility. Under Efficiency, moral obligations would be enforced only if recognizing them reduces transaction costs in future rescue scenarios. Specific performance would also be rarified under Efficiency, granted only when damages are inadequate.

  Currently, the law mixes these: it uses Will Theory language ("meeting of the minds"), Reliance Theory mechanisms (estoppel), and Efficiency outcomes (expectation damages). If any single rival were fully true, the current hybrid system would collapse. A true Will theorist would condemn the unenforceability of gifts as an unjust restriction on autonomy. A true Reliance theorist would condemn expectation damages as overcompensation. The current practice avoids these extremes by maintaining a pragmatic middle ground that satisfies none of the theories completely but serves the functional needs of the market. The rigid consideration doctrine would disappear under Efficiency, replaced by case-by-case analysis. Under Will Theory, the distinction between bargain and gift would vanish. The current law's stability depends on not being any one of these things too rigorously, allowing specific performance where appropriate rather than strict damages rules.

  5. "Verdict"
  The practice presupposes no single coherent theory. It is a pragmatic patchwork designed to facilitate commerce while limiting judicial overreach into social relations. It leans instrumentally toward protecting reliance and exchange but retains the language of promise. The inconsistency on moral obligations confirms that the law is not deduced from moral philosophy but crafted for utility. It is a functional compromise, not a philosophical system. The underdetermination is likely a feature, not a bug; it allows courts to adjust enforcement based on context without being shackled to a rigid dogma. The law treats promises as binding only when convenient, revealing a realist rather than idealist foundation.
