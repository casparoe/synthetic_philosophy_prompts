          *   Verbal layer? Yes, but deeper (reference fixation).
          *   Eliminativism parallel? Yes, but with a twist (self-intimating states).
      *   *What's wrong:* It's not *just* verbal. It's about epistemic authority.
      *   *Progress:* Unlikely empirically. Requires meta-philosophical shift.

