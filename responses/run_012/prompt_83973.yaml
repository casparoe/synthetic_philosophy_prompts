answer: |-
  Here is a 45-minute session plan designed to hit your specific learning outcomes without relying on math or moralizing.

  ### 1. The Sequence (Order & Dependencies)

  You cannot explain the *consequence* before the *mechanism*, and you cannot explain the *mechanism* before the *setup*. Here is the critical path:

  1.  **The Mundane Scenario (10 mins):** Establish the rules of the game.
      *   *Why first:* You need them to intuitively feel the "number dependence" (fine if few, bad if lots) before you introduce the cognitive bias. If you start with the bias, they'll treat it as a psychology lecture.
  2.  **The Epistemic Noise (10 mins):** Introduce the idea that everyone's judgment is slightly off (noisy), but *unbiased* on average.
      *   *Why here:* You must establish that individuals are *not* reckless. If they think people are reckless, they'll attribute the failure to character, not structure.
  3.  **The Selection Effect (10 mins):** Show that the action is taken by the *extreme* of the distribution, not the average.
      *   *Why here:* This is the core engine. It depends on knowing there is noise (step 2) and that action is unilateral (step 1).
  4.  **The Structural Diagnosis (10 mins):** Name the curse, distinguish it from similar concepts, and discuss the "fix" problem.
      *   *Why here:* Now that they see the mechanism, you can label it and clear up the confusion with Tragedy of the Commons/Overconfidence.
  5.  **The Diagnostic (5 mins):** Test understanding.

  ---

  ### 2. The One Example: "The Shared Agenda"

  **The Scenario:** A 10-person team shares a 1-hour weekly meeting. Any single member can unilaterally add an item to the agenda.
  **The Number Dependence:**
  *   **If 1-2 people add items:** The meeting is productive.
  *   **If 8-9 people add items:** The meeting runs over, decisions are rushed, everyone hates it (Net Negative).
  **The Noisy Estimate:** Each member estimates the "Value" of their item. They are well-meaning. They want the team to succeed. But their estimate is noisy (sometimes they think a topic is crucial when it's actually trivial).

  **Why this example works:**
  *   **Mundane:** Everyone has been in a bad meeting. No nukes, no AI.
  *   **Not Tragedy of the Commons (ToC):** In ToC, I *know* the resource is depleting (the grass is dying) but I graze anyway because I gain personally. In the Agenda example, I genuinely believe my item is *good for the team*. I am not selfish; I am mistaken.
  *   **Number Dependence is Obvious:** One agenda item is fine. Ten agenda items in one hour is impossible. The harm is a function of the *count* of actors.

  **What it needs:**
  *   Explicitly state: "There is no rule against adding items."
  *   Explicitly state: "Everyone wants the meeting to go well."

  **What it needs to lack:**
  *   **Selfish Gain:** Do not imply people add items to show off or steal time. They must believe the item helps the group.
  *   **Resource Depletion:** Avoid language about "using up time" as a commodity. Frame it as "diluting focus."

  ---

  ### 3. Misconceptions: Order of Appearance & Kill Shots

  Here is the order they will likely arise in the room, and exactly where you shut them down.

  **1. "This is just the Tragedy of the Commons."**
  *   **When:** Immediately after you describe the scenario (Minute 12).
  *   **The Kill:** "In the Tragedy of the Commons, I know the grass is dying, but I graze anyway because I get the cow. In the Unilateralist's Curse, I genuinely believe planting this tree is *good for the forest*. The failure is in my *information*, not my *incentives*."

  **2. "This is just people being overconfident/arrogant."**
  *   **When:** After you explain that people add too many items (Minute 20).
  *   **The Kill:** "Imagine everyone is perfectly humble. On average, their estimates are correct. But estimates vary. The person who acts is the one whose estimate was *highest*, not the one whose estimate was *average*. Even a room of humble people produces an arrogant *outcome* because the system selects for the outlier."

  **3. "Isn't this the Winner's Curse?"**
  *   **When:** When discussing the selection effect (Minute 25).
  *   **The Kill:** "They are cousins. The Winner's Curse is about *paying* too much in an auction. The Unilateralist's Curse is about *doing* too much in a collective. The math is similar, but the remedy is different: Auctions need bidding rules; Unilateralism needs consultation norms."

  **4. "So we just need better information."**
  *   **When:** Discussing solutions (Minute 30).
  *   **The Kill:** "Better information reduces the noise, but it doesn't remove the selection effect. As long as there is *any* uncertainty and *any* number of people, the most optimistic person still decides. You can't solve a structural problem with just better data."

  **5. "So the answer is a global regulator / manager."**
  *   **When:** Final discussion (Minute 35).
  *   **The Kill (Complicate, don't endorse):** "A regulator solves the selection problem but creates a bottleneck. Now the *regulator's* noisy estimate decides everything. If the regulator is too cautious, nothing happens (The Veto Curse). The challenge isn't finding a boss; it's designing a process that pools information without paralyzing action."

  ---

  ### 4. The Diagnostic Question

  Do not ask them to define the curse. Ask them to predict the bias in a new scenario.

  **The Question:**
  > "Imagine a open-source software project. Any contributor can submit a 'security patch' without review.
  > *   If a few patches are submitted, bugs get fixed (Good).
  > *   If many patches are submitted, the code becomes unstable and breaks for everyone (Bad).
  > *   Contributors have noisy estimates of whether their patch actually fixes a bug or introduces a new one.
  >
  > **Question:** Does this system tend to produce too many patches or too few patches compared to the 'true' optimal number? And why?"

  **The Answer You Want:**
  *   **Too many.**
  *   **Why:** Because the people who submit are the ones most optimistic about their patch's safety/utility. The decision threshold is crossed by the outliers, not the average.

  **If they say "Too few":** They think it's about fear of breaking things (Veto Curse).
  **If they say "It depends on the people":** They missed the structural point (it happens even if people are careful).

  ---

  ### 5. What to Leave Out

  **1. The Math (Variance/Expected Value)**
  *   **Cut:** Do not write $E[V]$, do not draw bell curves.
  *   **Say Out Loud:** "There is a mathematical proof for this involving distributions and maximums, but the intuition is what matters: The decision is made by the extreme, not the average."

  **2. Detailed Remedies (Norms of Consultation, Randomization)**
  *   **Cut:** Do not spend time teaching them how to draft a "norm of consultation."
  *   **Say Out Loud:** "There are proposed fixes, like agreeing that no one acts without checking with two others. But notice: agreeing to that rule is *itself* a collective action problem. We're stopping at diagnosis today, because you can't fix a problem you can't name."

  **3. The "Mirror Image" (The Veto Curse)**
  *   **Verdict:** **Earns 30 seconds.**
  *   **Why:** It reinforces that this is about *decision rules*, not human nature.
  *   **How to phrase it:** "If we flip the rule—everyone must agree to act—the most *pessimistic* person decides. We get paralysis instead of recklessness. Same curse, opposite direction. This proves the problem isn't 'people are rash,' it's 'unilateral rules select for extremes.'"

  ---

  ### 6. Session Flow (Minute-by-Minute)

  *   **00-10:** **The Setup.** Tell the "Shared Agenda" story. Ask: "What happens if everyone acts on their best judgment?" Let them predict the meeting fails.
  *   **10-20:** **The Mechanism.** Introduce "Noisy Estimates." Draw a line on the board: "True Value" vs. "Perceived Value." Show that the people who act are the ones on the far right of the Perceived line.
  *   **20-30:** **Misconception Sweep.** Explicitly invite the "ToC" and "Overconfidence" objections and use the Kill Shots above.
  *   **30-40:** **Implications.** Briefly mention the Mirror Image (30 secs). Discuss why "Better Info" and "Regulators" aren't silver bullets.
  *   **40-45:** **Diagnostic.** Pose the Security Patch question. Discuss answers. Wrap.
