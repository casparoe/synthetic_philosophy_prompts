answer: |-
  ### The Adaptation Audit: A Decision Procedure for Evolutionary Claims

  **Purpose:** To filter "Just-So Stories" from plausible evolutionary hypotheses using only published text, within one hour, without specialized biological modeling.
  **Scope:** Claims regarding human traits, behaviors, or psychological mechanisms.

  #### The Procedure

  **Step 1: Trait Specification**
  *   **Question:** Is the "trait" defined as a specific mechanism (physiological, cognitive, or behavioral) rather than a vague cultural outcome or a complex aggregate?
  *   **Sufficiency:** The text identifies a discrete capacity or response (e.g., "vomiting reflex," "facial recognition") rather than a broad label (e.g., "religion," "war").
  *   **Stop Rule:** If the trait is undefined or purely cultural without a psychological/physiological substrate, **Do Not Publish as an evolutionary claim.**

  **Step 2: Utility vs. History (The Time-Travel Test)**
  *   **Question:** Does the argument distinguish between the trait being *useful now* and the trait being *selected for then*?
  *   **Sufficiency:** The text explicitly references the ancestral environment (EEA) or acknowledges that current utility does not prove historical selection.
  *   **Stop Rule:** If the claim rests entirely on current fitness benefits without addressing historical context, **Publish only with the alternatives stated** (downgrade to "current function" hypothesis).

  **Step 3: Variation and Heritability (The Raw Material Test)**
  *   **Question:** Is there evidence or acknowledgment that the trait varies within the population and has a heritable component?
  *   **Sufficiency:** The text cites twin studies, genetic markers, or cross-population variation; OR it explicitly argues why heritability is hard to measure but assumed.
  *   **Stop Rule:** If the text assumes the trait is universal and fixed (no variation) yet claims it is an adaptation, **Publish only with the alternatives stated** (flag as "fixed trait" problem).

  **Step 4: The Universality Trap**
  *   **Question:** If cross-cultural universality is cited, is it treated as *consistent with* adaptation or *proof of* adaptation?
  *   **Sufficiency:** Universality is used to rule out local cultural explanation, not to rule out byproduct or drift.
  *   **Stop Rule:** If universality is the *sole* evidence for adaptation, **Publish only with the alternatives stated.**

  **Step 5: The Null Hypothesis (The Spandrel Check)**
  *   **Question:** Does the text address non-adaptive explanations (drift, developmental constraint, byproduct of another adaptation)?
  *   **Sufficiency:** At least one specific non-adaptive alternative is named and argued against, or acknowledged as indistinguishable.
  *   **Stop Rule:** If non-adaptive explanations are ignored entirely, **Publish only with the alternatives stated.**

  **Step 6: Falsifiability**
  *   **Question:** Does the text describe an observation that would prove the hypothesis wrong?
  *   **Sufficiency:** A specific empirical condition is named (e.g., "If trait X is found in species Y, this fails").
  *   **Stop Rule:** If the hypothesis is compatible with all possible outcomes, **Do Not Publish as an evolutionary claim.**

  **Step 7: The Human Call**
  *   **Question:** Does the claim hinge on a technical distinction (e.g., exaptation vs. co-option) or specialized data (e.g., specific allele frequencies) you cannot verify?
  *   **Sufficiency:** You can understand the logic without needing to verify the raw data.
  *   **Action:** If **No**, hand to a consultant. If **Yes**, proceed to verdict.

  ***

  #### Failure Modes Table

  | Step | How It Misfires | What To Do About It |
  | :--- | :--- | :--- |
  | **Step 1** | **Polygenic Traits:** Complex behaviors (e.g., "political leaning") have diffuse genetic bases that look like "no mechanism." | Downgrade confidence; treat as "influenced by evolution" rather than "an adaptation." |
  | **Step 2** | **Deep Time Uncertainty:** We cannot know the EEA with precision; authors may guess wrong about "then." | Require the author to acknowledge the uncertainty of the ancestral environment. |
  | **Step 3** | **Fixed Traits:** Strong selection can remove variation, making heritability hard to detect (the "universal instinct" problem). | Accept universality *if* Step 5 (Null Hypothesis) is rigorously passed. |
  | **Step 5** | **Exaptation:** A trait selected for A is now used for B; hard to distinguish from byproduct of A. | Label as "Exaptation" rather than "Adaptation" if the original function differs from the current one. |
  | **All** | **Philosophical Stalemate:** The claim rests on definitions (e.g., what counts as a "trait") rather than data. | **Human Call Required.** Hand to a philosopher of biology or senior editor. |

  ***

  #### Application to Queue

  **1. Claim: Morning Sickness (Embryo Protection Hypothesis)**
  *   **Verdict:** Publish only with the alternatives stated
  *   **Deciding Consideration:** The correlation between nausea and reduced miscarriage is strong, but the hormonal byproduct explanation is equally consistent with the data.
  *   **Surviving Alternative:** Nausea is a non-adaptive side effect of the rapid hormonal changes (HCG) required to maintain the pregnancy.
  *   **Reversal Condition:** A study demonstrating that suppressing nausea pharmacologically increases miscarriage rates specifically via toxin ingestion.
  *   **Human Call Required:** false
  *   **Human Call Description:** null

  **2. Claim: Menopause (Grandmother Hypothesis)**
  *   **Verdict:** Publish only with the alternatives stated
  *   **Deciding Consideration:** Demographic data supports inclusive fitness benefits, but does not rule out physiological exhaustion as the primary driver.
  *   **Surviving Alternative:** Menopause is a physiological constraint caused by the finite supply of oocytes, with no selected "stop" mechanism.
  *   **Reversal Condition:** Evidence that grandmothers actively reduce grandchild survival rates through resource competition in ancestral environments.
  *   **Human Call Required:** false
  *   **Human Call Description:** null

  **3. Claim: Music (Auditory Cheesecake/Byproduct)**
  *   **Verdict:** Publish as a live hypothesis
  *   **Deciding Consideration:** The absence of a dedicated survival function or unique neural module makes the byproduct claim more parsimonious than adaptation.
  *   **Surviving Alternative:** Music is an adaptation for social bonding or sexual selection that piggybacks on auditory processing.
  *   **Reversal Condition:** Discovery of neural circuitry dedicated exclusively to music processing that is distinct from language and pattern recognition.
  *   **Human Call Required:** false
  *   **Human Call Description:** null

  ***

