answer: |-
  Here is the principle derived from your verdicts, the cost required to maintain it, and the stress tests you requested.

  ### The Refined Principle

  **A narrative counts as history to the degree that contemporary or near-contemporary evidence *external* to the tradition corroborates the *mechanism* or *outcome* of the claim, rather than merely its setting or participants.**

  To make this principle hold across your list without collapsing into special cases, we must add three specific clauses. Each clause is forced by a specific tension in your verdicts.

  **Clause 1: The Attestation Requirement**
  *   **Statement:** Internal linguistic plausibility or late textual tradition cannot substitute for contemporary external attestation.
  *   **Case that forces it:** **Moses.** You note there is "no outside evidence at all," only an Egyptian-sounding name. To maintain the principle that "outside material" (as you cited for Troy) is the deciding factor, Moses must be classified as **not history**. Your hesitation here is the weak joint; the principle demands closure where the evidence is silent.
  *   **Cost:** You must give up the verdict that the question of Moses is "open." Under this principle, the case is closed: he is legend until external evidence appears.

  **Clause 2: The Event-Trace Distinction**
  *   **Statement:** External attestation of a *setting* (place name, people group) counts toward history only if accompanied by archaeological evidence consistent with the *type of event* claimed (e.g., destruction layers for war, material shifts for migration); mere presence of the people or place is insufficient.
  *   **Case that forces it:** **The Trojan War vs. The Exodus.** This is the break point you suspected.
      *   *Trojan War:* You have the setting (Wilusa/Hisarlik) *plus* a destruction layer at the right time. The archaeology touches the *event* (sacking), not just the *place*.
      *   *Exodus:* You have the setting (Israelites exist per Merneptah Stele) *minus* any archaeological trace of the *event* (mass movement, desert habitation).
      *   *Principle:* Positive archaeological correlation with the event type validates the outline; negative archaeology in a trackable environment invalidates it.

  **Clause 3: The Hostile Witness Exception**
  *   **Statement:** A single external textual reference from a rival or hostile source is sufficient to establish the *existence* of a figure or dynasty, even if it does not confirm the biographical narrative.
  *   **Case that forces it:** **David.** The Tel Dan stele names the "House of David" but not the man, and comes from a rival kingdom. Without this clause, David would fall to the same standard as Moses (no contemporary biography). This clause allows you to accept the dynasty as historical while remaining agnostic about the specific deeds in the Bible.

  ---

  ### Application to a New Case: Romulus

  **Verdict:** Not history (legend).
  **Reasoning:** There is no contemporary external attestation (textual or archaeological) for Romulus. The earliest sources are centuries later (Fabius Pictor, etc.). While Rome certainly existed (setting), and there are destruction layers in early Rome (event trace), none can be specifically tied to a founder figure or a specific founding date via external evidence. The "Wolf" and the "Brother Killing" are internal tradition without external corroboration of the *mechanism* (a specific man founding a city at a specific time).
  **Fit:** This fits the principle cleanly. Setting (Rome) is history; Agent (Romulus) is legend.

  ### Which of Your Verdicts Fits Worst?

  **Moses.**
  As noted in Clause 1, your verdict on Moses is "I keep changing my mind... I resist treating the question as closed." The principle requires a binary classification based on the presence of external evidence. Since Moses lacks external evidence, the principle forces a "Not History" verdict. Your refusal to close the question indicates that your actual heuristic allows for *internal* plausibility (the Egyptian name) to keep a question alive, whereas the principle discards that as insufficient. To make the principle robust, you must harden your verdict on Moses to match Arthur.

  ### What Would Make Me Abandon This Principle?

  I would abandon this principle if **a verified historical event were discovered that left zero external traces.**

  Specifically: If archaeologists and historians conclusively identified a massive, civilization-altering event (e.g., a specific migration or war) through *internal* consistency of multiple independent traditions, which was later proven true by a discovery that *could not have been known* to the writers, yet for which no contemporary external record or archaeological trace exists (perhaps due to perishable materials or specific environmental erasure).

  If it can be shown that "Silence of the record" is a reliable indicator of "Non-existence" (as the principle assumes for Exodus), then the principle holds. If it is shown that "Silence of the record" is often a product of preservation bias rather than historical reality, the principle collapses. For example, if we found a Hittite-style archive in the Sinai desert confirming the Exodus, the principle's reliance on "no trace in the desert" would be proven an argument from silence, forcing a rewrite to weigh *preservation probability* higher than *absence of evidence*.

  ### Summary of the Weak Joint
  The weak joint is not between Troy and Exodus; the **Event-Trace Distinction** successfully bridges them. The weak joint is between **Moses and the Principle**. You want to allow etymology and narrative plausibility to keep a question open; the principle demands external corroboration to call it history. You must choose: either accept that Moses is legend (simplifying the principle) or accept that internal plausibility can sustain a "historical" verdict (complicating the principle). I recommend the former.
