answer: |-
  A hardcore rationalist tells me he's solved the Spectrum Argument. "Adjacent lives are on a par," he says. "One extra second of mild headache doesn't make a life worse. But unremitting agony is certainly worse than bliss. Transitivity fails."

  I say, "Okay. I'll swap your blissful life for the one with one second of headache. Free."
  He agrees.
  "Now swap for two seconds. Free."
  We go all the way down the chain—one minute, one hour, one year of mild headache—until he's in unremitting severe agony. At every step, he says, "Indifferent. The difference is negligible."

  Then I say, "Swap back to bliss. Cost: all your money."
