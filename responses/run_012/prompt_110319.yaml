      *   *Idea 1: Truth Detection.* Two groups try to solve a mystery. One group gets a "leak" from the other.
          *   *Critique:* Hard to make the distrust endogenous. Why would they ignore the leak?
      *   *Idea 2: Market Prediction.* Groups bet on outcomes. One group gets "insider info" that is actually slightly noisy.
          *   *Critique:* Might feel like standard information asymmetry.
      *   *Idea 3: The "Certified" Source.* Create a hierarchy of information validation.
          *   *Mechanic:* Points are awarded for consensus within a group *and* for accuracy. But accuracy is hard to verify in real-time.
          *   *Better Mechanic:* Points are awarded for "Coherence" (agreeing with your group's established narrative) vs. "Accuracy" (matching reality). If Coherence pays better, they will ignore outside accuracy.
      *   *Idea 4: The "Tainted" Messenger.*
          *   *Setup:* Two teams (Red/Blue). Task: Estimate a hidden value (e.g., number of dots, weight of object, or a logic puzzle solution).
          *   *Twist:* Red team gets a "Methodology Guide" that says Blue team uses a flawed heuristic. Blue team gets nothing or a different guide.
          *   *Problem:* This feels exogenous ("The rules say Blue is flawed").
          *   *Fix:* The "Methodology Guide" needs to be earned or generated. Or, the flaw needs to be observable but minor, while the *label* of the flaw is amplified.

      *   *Idea 5: The "Verification Tax" (Selected Concept).*
          *   Two groups solve a puzzle.
          *   They can trade information.
          *   However, to accept outside info, you must "verify" it using your group's internal key.
          *   The internal key is slightly biased.
          *   *Refinement:* Let's make it about *Source Credibility Scores*.
          *   *Mechanism:* A public ledger. You gain points for being "consistent" with your team's previous statements. You lose points for "contradiction."
          *   *The Trap:* If an outsider gives info that contradicts your team's established position, accepting it costs you "Consistency Points." If the Consistency Points are valuable enough, you will reject the outsider's true info to maintain status.
