      *   *Epistemic Bubble:* "I haven't heard X." -> Solution: Show X.
      *   *Echo Chamber:* "I heard X, but Source Y says X is a lie/trick." -> Solution: Hard. Requires rebuilding trust in X's source or breaking trust in Y.
      *   *The Mechanism:* We need a system where trusting a specific internal source yields higher rewards (coherence/social/currency) than integrating external data, even when the external data is accurate. The external data needs a "tag" that allows it to be dismissed.

