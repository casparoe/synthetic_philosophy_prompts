answer: |-
  # Activity: The Calibration Trap

  **Goal:** Distinguish Epistemic Bubbles (missing info) from Echo Chambers (discounted info) via endogenous trust collapse.
  **Time:** 90 Minutes
  **Participants:** 24 Adults (Split: 12 Insiders, 12 Outsiders)
  **Materials:** Whiteboard, markers, index cards (2 decks, different colors), pens, projector (optional, for dot counts), timer.

  ---

  ## 1. Setup & Roles (5 Minutes)

  **Room Layout:**
  Arrange chairs in two concentric semicircles.
  *   **Inner Circle (12 chairs):** The **Insiders**. They face the whiteboard. They cannot see the evidence.
  *   **Outer Circle (12 chairs):** The **Outsiders**. They face the Insiders. They can see the evidence.

  **The Task:**
  The group must estimate a series of hidden numerical values (e.g., number of dots on a slide, a specific year, a population count). You will run **Three Rounds**.

  **The Payoff Scheme (Write on Whiteboard):**
  *   **Team Score:** The sum of all 24 players' points. (Encourages global truth-seeking).
  *   **Individual Score:** Determines "status" at the end.
      *   **Insiders:** Points for Accuracy (closeness to truth). **BUT** points are multiplied by a **Trust Factor**.
      *   **Outsiders:** Points for **Influence** (how close an Insider's guess is to the Outsider's claim).

  **Crucial Mechanic: The Confidence Tag**
  Outsiders do not just share a number. They must attach a **Confidence Tag** (1 to 5) to their claim.
  *   *Tag 5:* "I have verified this."
  *   *Tag 1:* "This is a guess."

  ---

  ## 2. Round 1: The Bubble (15 Minutes)

  **Objective:** Establish baseline trust and show that information sharing works.

  1.  **Evidence:** Display a complex image (e.g., a jar of beans or a dot pattern) *only* to the Outsiders (hold it up behind them, or show on a screen visible only to the back row).
  2.  **Action:** Outsiders have 2 minutes to discuss among themselves and agree on a number and a Confidence Tag. They write this on **Blue Cards**.
  3.  **Transfer:** Outsiders hand the cards to the Insiders opposite them.
  4.  **Decision:** Insiders have 3 minutes to discuss. They can accept the Outsider's number or generate their own. They write their final estimate on **White Cards**.
  5.  **Reveal:** You reveal the true number.
  6.  **Scoring:**
      *   Insiders: 10 points minus absolute error.
      *   Outsiders: 10 points minus the difference between *their* claim and the *Insider's* final guess.
  7.  **Outcome:** Expect high accuracy. Insiders trust Outsiders because incentives are aligned (Team Score) and there is no history of deception.
  8.  **Documentation:** Before Round 2, hand out index cards. Ask everyone to write:
      *   *"What evidence would change your mind about the Outsiders' competence?"*
      *   *"Rate Outsider Competence (0-100%)."*
      *   Collect these. Do not read them yet.

  ---

  ## 3. Round 2: The Chamber (25 Minutes)

  **Objective:** Introduce the incentive for the Outsiders to inflate confidence, triggering endogenous distrust from the Insiders.

  **The Rule Change (Announced Publicly):**
  "To simulate real-world pressure, we are changing the Outsider scoring for this round."
  *   **New Outsider Incentive:** Outsiders get a **50-point Bonus** *only if* the Insider copies their number **AND** they tagged it **Confidence 5**.
  *   **Insider Risk:** If an Insider copies a **Confidence 5** claim that turns out to be **wrong** (off by >10%), they lose **ALL** accuracy points for the round (The "Bad Trust" Penalty).

  **The Trap:**
  *   It is now rational for Outsiders to claim **Confidence 5** even if they are unsure, to chase the bonus.
  *   It is now rational for Insiders to fear the "Bad Trust" Penalty.

  **Procedure:**
  1.  **Evidence:** Show a *new* image to Outsiders.
  2.  **Inflation:** Watch the Outsiders. They want the bonus. They will likely mark **5** even if the image is hard to count.
  3.  **The Flaw:** Ensure at least one Outsider pair is looking at a difficult image where error is likely. They will claim **5**. They will be wrong.
  4.  **Transfer:** Outsiders read their claims aloud ("We see 450. Confidence 5.") and hand over cards.
  5.  **Insider Deliberation:** Insiders hear the claims. They see the risk.
      *   *Rational Move:* Discount the Confidence 5s. Treat them as 3s.
      *   *Echo Chamber Move:* Decide that "Confidence 5 from Outsiders is a lie." Ignore the number entirely. Rely on Internal Consensus to avoid the "Bad Trust" Penalty.
  6.  **Submission:** Insiders submit White Cards.
  7.  **Reveal:** Reveal true numbers.
      *   Highlight the case where an Outsider was **Right** but marked **5**, and the Insider **Ignored Them** (or downweighted them so much they missed).
      *   Highlight the case where an Outsider was **Wrong** and marked **5**, validating the Insider's fear.

  ---

  ## 4. The Reveal & Scoring (15 Minutes)

  1.  **Calculate Scores:** Display the results on the whiteboard.
      *   Show the "Lost Opportunity": Points the Insiders *could* have had if they had trusted the correct Outsiders.
      *   Show the "Saved Loss": Points they saved by ignoring the wrong Outsiders.
  2.  **Return Documentation:** Hand back the index cards from before Round 2.
  3.  **Comparison:** Ask Insiders to look at their pre-round writing ("What would change your mind?").
      *   *Question:* "Did you hear the argument?" (Yes).
      *   *Question:* "Did you weigh the evidence?" (No, you rejected the source tag).
      *   *Question:* "Was the source flawed?" (Yes, they inflated confidence).
      *   *Question:* "Was the penalty for trusting proportional to the flaw?" (No, you treated one inflation as total disqualification).

  ---

  ## 5. Debrief: Mapping the Distinction (20 Minutes)

  Use the whiteboard to draw the map.

  **1. The Bubble (Round 1)**
  *   *State:* Insiders lacked data.
  *   *Remedy:* Outsiders provided data.
  *   *Result:* Belief updated.
  *   *Lesson:* Bubbles are solved by exposure.

  **2. The Chamber (Round 2)**
  *   *State:* Insiders *had* the data (Outsiders spoke aloud).
  *   *Mechanism:* The **Confidence Tag** became the proxy for the **Source Identity**.
  *   *The Endogenous Shift:* You (Facilitator) did not tell Insiders to distrust. The *Incentive Structure* made Outsiders lie about confidence. Insiders *discovered* the lie.
  *   *The Error:* The Insiders moved from "Downweight Confidence 5" (Modest Update) to "Ignore Confidence 5" (Total Rejection).
  *   *The Echo Chamber Definition:* "The outside testimony is not weighed and found wanting; it is routed around."
      *   *Point to the Insiders who ignored a correct '5'.* "You didn't process the number 450. You processed the label 'Liar' and stopped."

  **3. The "Reasonable Person" Defense**
  *   Acknowledge the Insiders' rationality. "If a weatherman says 100% sun and it rains, you don't just check his umbrella next time. You check a different app."
  *   The trap is that in the game, the *only* app available was the weatherman. In the real world, leaving the room is costly.
  *   Ask the Outsiders: "Did you feel pressured to lie?" (Yes). This validates that the system, not just individual malice, created the noise.

  ---

  ## 6. Failure Modes & Salvage

  **Failure 1: Insiders trust anyway.**
  *   *Cause:* The "Bad Trust" penalty wasn't scary enough.
  *   *Salvage:* In the debrief, emphasize that in the real world, the penalty is social ostracization, not just points. "Imagine losing your job for trusting the wrong source. Would you risk it then?"

  **Failure 2: Outsiders don't inflate confidence.**
  *   *Cause:* They care more about Team Score than Individual Bonus.
  *   *Salvage:* This actually breaks the game. If Outsiders are honest, the Chamber doesn't form.
  *   *Fix:* If you see this happening during the 2-minute deliberation, announce a "Market Correction": "Due to budget cuts, only the top 3 Influential Outsiders get the bonus." Scarcity drives inflation.

  **Failure 3: Insiders claim they "Processed" the info.**
  *   *Cause:* They downweighted but didn't ignore.
  *   *Salvage:* Check the cards. If they wrote a number totally different from the Outsider, they ignored. If they split the difference, they processed. Use the split-difference group as the "Bubble" example and the ignore group as the "Chamber" example. Both exist in the room.

  **Failure 4: Participants feel manipulated.**
  *   *Cause:* The incentive change feels like a "gotcha."
  *   *Salvage:* Own it. "I manipulated the incentives to simulate how social media algorithms reward engagement (confidence) over accuracy. You felt the manipulation. That is exactly how the machinery feels from the inside."

  ---

  ## 7. Limitations: What This Cannot Reproduce

  Be plain with them in the final 5 minutes.

  1.  **Time:** Real echo chambers take years to build. This took 20 minutes. The "trust relocation" here is mechanical; in reality, it is identity-based.
  2.  **Exit Costs:** In this game, ignoring the Outsiders cost points. In reality, ignoring the "Outsiders" (mainstream media, opposing party) often *gains* social capital within the chamber. The game underestimates the social reward of the chamber.
  3.  **The "Living Inside":** You are all sitting in a room knowing it's a game. You have a "God's eye view." Real members of an echo chamber do not know they are in one. They feel like the Insiders protecting themselves from liars, not the Insiders ignoring truth.
  4.  **Your Role:** You are the Facilitator. In the real world, there is no Facilitator to reveal the truth at the end. You must supply the humility to admit you might be the Insider in someone else's game.

  **Closing Instruction:**
  "Keep the index card you wrote on. In six months, look at it. Ask yourself: Did I update modestly, or did I route around? That is the only score that matters."
