      *   *Obligation:* Comes from two sources: (1) Self-interest (enlightened) in maintaining the scheme, and (2) Sympathy with the public interest (moral sentiment).
      *   *The "Wall":* Hume assumes a relatively stable, homogenous society where the convention is clearly established and beneficial. He struggles with *new* conventions, *unjust* laws, or *outsiders*.
      *   *The "Single Rule" Reconstruction:* It needs to capture the transition from "mere coordination" to "moral obligation." It's not just "follow the rules." It's "Follow the rule *if and only if* the rule sustains a scheme of cooperation that produces net public utility, *and* the scheme is sufficiently established to create expectations."
      *   *Refining the Rule:* Let's call it the **Public Utility + Established Expectation Principle**. Obligation arises when a convention is (a) useful to the public (systemic utility) and (b) sufficiently established that violating it disappoints expectations and destabilizes the scheme.

  3.  **Drafting the Verdicts (Case by Case):**

      *   **Case 1: Jaywalking (Decriminalized):**
