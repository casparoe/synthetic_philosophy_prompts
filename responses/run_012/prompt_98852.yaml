answer: |-
  Here is the reconstruction you are asking for. It requires treating Hume not as a system-builder who answered every contingency, but as a theorist of *coordination under conditions of limited generosity*. The "wall" you are hitting is the gap between Hume's 18th-century homogenous society and our pluralistic, imposed, and transient modern conventions. To get through it, we must extract the functional logic of his artificial virtues and apply it rigorously, even where his examples fail.

  ### I. The Verdicts

  **1. Jaywalking (The Decriminalized Signal)**
  *   **Verdict:** The moral obligation has dissolved, but the coordination expectation may linger.
  *   **Reasoning:** For Hume, the obligation of law and convention rests on their *utility* in preserving order and safety. If the city decriminalizes the act, it is a public declaration that the *utility calculation has changed*: the risk no longer outweighs the freedom. Therefore, the "common interest" no longer supports the prohibition.
  *   **The Wrong:** If a pedestrian steps out and forces a brake, they have not violated a *moral* rule (since the utility basis is gone), but they may have violated a *residual expectation*. If drivers still *expect* people to stop, the pedestrian has disrupted the coordination scheme. The wrong is not "disobedience" but "unexpectedness." Hume would say the obligation shifts immediately to the new convention (caution) rather than the old rule (stop).

  **2. Paid Queue-Jumping**
  *   **Verdict:** The friend (the Humean) is closer, but with a caveat.
  *   **Reasoning:** Hume is not an egalitarian; he is a utilitarian regarding conventions. The queue is an artificial virtue designed to prevent conflict (jostling) and ensure orderly service. It is not sacred. If a new convention (paying) achieves the same end (order) with greater efficiency (revenue, time allocation), it is a *superior* convention.
  *   **The Caveat:** The colleague is right only if the new system causes *resentment* that destabilizes the queue. If people start cutting in line *anyway* because they feel the system is rigged, the utility collapses. But if the market accepts it, justice accepts it. Justice follows utility, not abstract equality.

  **3. Tipping (The Outsider)**
  *   **Verdict:** She is under an obligation, but it is acquired, not innate.
  *   **Reasoning:** Tipping is a convention of property transfer. Hume treats property as entirely artificial. By accepting the service in a jurisdiction where the convention is known (or knowable), she enters the scheme. The "wage shifting" is irrelevant to the transactional obligation; the convention functions as a tacit contract.
  *   **The Difference:** For the local, the obligation is reinforced by long-standing sympathy and habit. For her, it is initially weaker (less habit) but becomes binding once she is informed. Ignorance excuses the first violation; residence cures the ignorance. To refuse after learning the norm is to violate the "common interest" of the service economy she is utilizing.

  **4. Escalators (The Visitor)**
  *   **Verdict:** The visitor is obligated to follow the local rule *if they know it*; if ignorant, they are excused until informed.
  *   **Reasoning:** Hume prioritizes *stability* over *optimality*. Even if standing on both sides is more efficient (as the experiment suggested), the *established convention* (stand right) creates expectations. Violating an established convention causes confusion and collision.
  *   **The Visitor:** This is the strain point. Hume requires a "sense of common interest." A tourist does not share the long-term interest of the transit system. However, by using the escalator, they accept the benefit of the scheme.
  *   **Resolution:** If the visitor knows the rule, they must follow it. If they follow their home convention (walk left vs. walk right) out of ignorance, they are not *unjust*, merely mistaken. But they become unjust if they persist after correction.

  ### II. The Single Rule: The Principle of Stabilized Public Utility

  You asked for the rule his texts do not wear on their sleeve. It is this:

  > **"An action is morally obligatory if and only if it conforms to a convention that (a) serves a discernible public utility (coordination, safety, order) and (b) has achieved sufficient stability that violating it would frustrate the legitimate expectations of others and threaten the scheme's continuity."**

  This rule bridges the gap between "self-interest" and "moral obligation."
  1.  **Utility (a):** Prevents the rule from being merely legalistic. (See Jaywalking: if utility goes, obligation goes).
  2.  **Stability/Expectation (b):** Prevents the rule from being purely consequentialist in the moment. (See Escalators: even if walking is faster, the *rule* binds because expectations are set).

  ### III. Commitments Doing the Work

  1.  **The Artificiality of Justice:** Virtues like justice are not innate sentiments; they are technologies. This allows Hume to judge tipping and queue-jumping not by "fairness" but by "does this technology work?"
  2.  **Sympathy with the Public Interest:** We approve of the convention not because it helps *us* personally in that moment, but because we sympathize with the *system* that helps everyone. This generates the obligation in the Tipping case (sympathy with the server's reliance).
  3.  **The Primacy of Stability:** Hume is deeply conservative about conventions. Once a rule is established, it binds even if a slightly better rule exists, because the *transition cost* (confusion) outweighs the gain. This drives the Escalator verdict.

  ### IV. Strains and Tensions

  **The Visitor Strain:**
  Hume's framework strains most here. His theory of allegiance (political obligation) relies on the idea that by living on the land and enjoying protection, you tacitly consent to the government. He tries to apply this to conventions.
  *   **Tension:** Hume needs the agent to *feel* the common interest. A tourist does not feel the long-term interest of the NYC subway.
  *   **The Pull:**
      *   *Pull 1 (Voluntarism):* Conventions arise from mutual agreement. The tourist never agreed. (Excuses the tourist).
      *   *Pull 2 (Functionalism):* The convention exists to prevent harm. The tourist causes harm by ignoring it. (Binds the tourist).
  *   **The Strain:** Hume wants conventions to be bottom-up (agreement) but needs them to function top-down (binding on all). In the modern world of transient populations, the "mutual agreement" fiction breaks down.

  **The Tipping Tension:**
  *   **Pull 1:** Tipping is a voluntary reward (natural virtue of generosity).
  *   **Pull 2:** Tipping is a wage substitute (artificial virtue of property/contract).
  *   Hume would likely struggle here because the convention has morphed from a reward into a debt. If it is a debt, it is justice. If it is a reward, it is benevolence. His system demands we categorize it to know the obligation strength.

  ### V. The Distinguishing Case

  To distinguish the **Humean Rule** (Stabilized Public Utility) from the two rivals:
  *   **Rival 1 (Legal/Conventionalist):** Obligations exist only where there is a legal penalty or direct social cost.
  *   **Rival 2 (Fairness/Reciprocity):** Obligations exist because it is unfair to free-ride on a scheme, regardless of utility.

  **The Case: The "Dead Letter" Convention.**
  Imagine a rule that is legally on the books and widely known, but *universally ignored* because it serves no purpose (e.g., a law against singing on Sundays, or a queue norm for a service that is now automated). Everyone knows the rule, no one follows it, no one is penalized, and no one is harmed by the violation.

  *   **Rival 1 (Legal/Cost):** No obligation. There is no penalty and no social cost to breaking it.
  *   **Rival 2 (Fairness):** Obligation holds. If *some* people still follow it out of a sense of duty, the free-rider is acting unfairly by not adhering to the agreed norm.
  *   **Humean Verdict:** **No Obligation.**
  *   **Why:** This distinguishes Hume from both. Unlike Rival 1, Hume *can* find moral obligation without law (e.g., returning a lost wallet). But unlike Rival 2, Hume *drops* the obligation if the *utility* dies. A convention that no one follows has lost its "stability" and its "public utility." It is a dead convention. For Hume, justice is a means to an end (social order). If the means no longer serve the end, the virtue evaporates. This highlights that Hume's obligation is *functional*, not deontological (Fairness) and not merely coercive (Legal).

  ### VI. Resolving the Visitor Question

  You asked which extension is more faithful if the texts underdetermine the issue.

  **The Choice:** The **Tacit Consent via Benefit** extension is more faithful than the Strict Voluntarism extension.

  **Why:**
  1.  **Consistency with Allegiance:** In *Of the Original Contract*, Hume explicitly rejects the idea that political obligation requires explicit consent or a promise. He argues that a foreigner residing in a kingdom is subject to its laws, not because they promised, but because they *reside* and receive protection. To apply Strict Voluntarism to the escalator visitor would contradict his political theory.
  2.  **The Nature of Convention:** Hume defines convention as a "sense of common interest." This sense is observed, not spoken. If a visitor uses the transit system, they are observing and utilizing the common interest. To claim the benefit (transport) while rejecting the cost (coordination rules) is to violate the very "sense of common interest" that defines the convention.
  3.  **Preserving the System:** Strict Voluntarism makes large-scale society impossible. If every stranger were exempt from conventions until they explicitly opted in, the "stability" Hume prizes would collapse. The Tacit Consent extension preserves the *Stability* clause of the Single Rule.

  **The Cost:** This extension admits that Hume's "bottom-up" convention is partly a fiction. It acknowledges that in a complex society, conventions are often *imposed* on participants by the sheer weight of established expectation. Hume would accept this trade-off: we sacrifice the purity of "mutual agreement" to secure the necessity of "public order." The visitor is bound not because they agreed, but because they entered a game where the rules were already set to keep the players from colliding. To play is to accept the rules.
