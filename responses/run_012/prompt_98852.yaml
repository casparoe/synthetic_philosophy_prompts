  4.  **Reconstructing the Single Rule:**
      *   It can't just be "Utility." (Why not break a rule if it helps more?)
      *   It can't just be "Agreement." (There is no explicit agreement.)
      *   *The Rule:* **"The Principle of Stabilized Utility."** An action is obligatory when it conforms to a convention that (1) serves a discernible public utility (coordination/safety/order) and (2) has achieved sufficient stability that violating it would frustrate the expectations of others and threaten the scheme's continuity.
      *   *Key Commitment:* The *artificiality* of the virtue. It doesn't matter if the rule is "equal" or "natural." It matters if it *works* to coordinate society.

  5.  **Identifying Strains/Tensions:**
      *   *The Visitor Problem:* Hume assumes a society of people who know each other or share a culture. Modern society is anonymous.
      *   *Tension:* Between *Utility* (maybe the visitor standing on the left is more efficient?) and *Stability* (everyone expects them on the right). Hume prioritizes Stability/Expectation over optimal Utility in the short term.
      *   *Tension:* Between *Self-Interest* and *Sympathy*. Do I follow the rule because it helps me, or because I sympathize with the public good? In anonymous cases, sympathy is weaker.

  6.  **The Distinguishing Case (The Fifth Case):**
      *   *Rival 1 (Legalism):* Obligation = Law/Penalty.
      *   *Rival 2 (Fairness/Rawlsian):* Obligation = Fair play, regardless of utility.
      *   *Hume:* Obligation = Utility + Stability of Expectation.
      *   *Test Case:* **A harmless but universally practiced ritual.** E.g., wearing black to funerals.
      *   *Legalism:* No obligation (no law).
      *   *Fairness:* Obligation (to show respect/solidarity).
      *   *Hume:* Obligation exists *only if* violating it causes distress (utility loss via sympathy) or disrupts social cohesion. If it's purely symbolic with no utility, Hume might say it's a manner, not a virtue.
      *   *Better Case:* **A rule that is useful but unknown to the violator.** (The Visitor case again).
      *   *Let's try:* **A "Blue Law" (Sunday Closing) that is enforced but widely ignored.**
