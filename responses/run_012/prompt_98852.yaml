      *   *Fairness:* Obey (others obey, free rider).
      *   *Hume:* Do not obey. If the convention has collapsed (everyone ignores it), it no longer serves the "common interest" of coordination. It's a dead convention.
      *   *Wait, I need to distinguish from the Visitor prompt.* Let's go with **The Broken Promise to a Dead Man.**
      *   *Legalist:* No penalty, no obligation.
      *   *Fairness:* Obligation holds (promise made).
      *   *Hume:* Obligation holds. Why? Because the *institution* of promising requires stability. Even if the beneficiary is dead, the *scheme* of promising is undermined if we think promises expire with death. This highlights Hume's focus on the *system* over the specific transaction.

  7.  **Resolving the Visitor Underdetermination:**
      *   *Option A:* Visitors are bound only when they explicitly learn/accept. (Too weak, leads to chaos).
      *   *Option B:* Visitors are bound by *tacit consent* derived from receiving the benefit of the scheme (using the road/escalator).
      *   *Humean Choice:* Option B is more faithful. Hume talks about allegiance to government. You don't sign a contract; you live on the land and enjoy protection. Similarly, using the infrastructure implies acceptance of its rules.
      *   *Why:* It preserves the "common interest" without requiring impossible explicit consent.

  8.  **Review and Refine:**
      *   *Tone:* Academic, rigorous, respectful of the user's expertise. Avoid intro fluff.
      *   *Check:* Did I answer all parts? Verdicts, Single Rule, Commitments, Strains, Fifth Case, Visitor Resolution.
      *   *Self-Correction on Jaywalking:* Be careful. Hume distinguishes *laws* from *conventions*. If the law changes but the convention (expectation) remains, the moral obligation might linger. I need to be precise there.
