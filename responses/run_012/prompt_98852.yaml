      *   *Refining the Single Rule:* Make sure it sounds like a reconstruction, not a quote. "The Principle of Stabilized Expectation grounded in Public Utility."

  9.  **Final Polish:** Check the flow. Ensure the distinction between the rivals in the fifth case is sharp. Ensure the "Visitor" resolution acknowledges the strain but picks the path of least resistance for Hume's system. (Proceed to generate output).

