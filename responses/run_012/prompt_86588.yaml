answer: |-
  You have isolated one of the deepest problems in philosophy: the distinction between mere causal regularity and genuine purpose (teleology). You are asking for a map of *normativity*—where "oughts" and "reasons" live in a physical world.

  Here is the survey of the three candidate principles that usually compete in this space, followed by the principle I believe best captures your intuitions.

  ### Survey of Candidate Principles

  1.  **The Cybernetic Principle (Goal-Directedness):** A system has a reason if it corrects errors to maintain a goal state.
      *   *Verdict:* This is too generous. It grants reasons to the river and the thermostat, which you explicitly reject. It cannot distinguish a machine keeping a room warm from a bacterium seeking sugar.
  2.  **The Historical Principle (Selection):** A system has a reason only if it was selected (by evolution or design) to do that thing.
      *   *Verdict:* This handles the bacterium and the smoke detector well. But it fails your chess engine and trained agent. They have reasons *now*, based on their calculation, not merely because their ancestors or programmers existed.
  3.  **The Cognitive Principle (Representation):** A system has a reason only if it holds an internal model of the world and uses it to plan.
      *   *Verdict:* This captures the chess engine and the agent. But it risks excluding the bacterium and the tree, which you want to keep as having "lineage reasons." It also struggles to define "model" without circularity.

  ### The Principle of Mediated Control

  To capture your verdicts, specifically the distinction between the chess engine (Own Reason) and the bacterium (Lineage Reason), and between the river (No Reason) and the tree (Lineage Reason), I propose the **Principle of Mediated Control**.

  **The Principle:**
  A reason exists wherever a system's behavior varies to secure a specific end *against* the tendency of immediate physical equilibrium. The *ownership* of that reason is determined by the **source of the variation**:

  1.  **No Reason:** The variation is dictated directly by physical law or simple reflex without functional organization. (The system does not "try"; it merely "happens".)
  2.  **Lineage Reason:** The variation is dictated by mechanisms fixed by evolutionary history. (The system "tries" because its ancestors succeeded.)
  3.  **Borrowed Reason:** The variation is dictated by mechanisms fixed by external design. (The system "tries" because a maker intended it to.)
  4.  **Own Reason:** The variation is dictated by an internal process that evaluates alternative paths in real-time. (The system "tries" because it calculates the fit between means and ends *now*.)

  **Why this fits your cases:**
  *   **The River (No Reason):** It meanders to the sea, but the variation is physical necessity (erosion), not functional organization. It does not resist physics; it *is* physics.
  *   **The Bacterium/Tree/Orchid (Lineage Reason):** They resist entropy and physical equilibrium (roots grow *up* against gravity, bacteria swim *against* diffusion). The guidance comes from evolutionary history, not current calculation.
  *   **The Smoke Detector (Borrowed Reason):** It resists physical equilibrium (silence) to signal fire. The guidance comes from design.
  *   **The Chess Engine/Trained Agent (Own Reason):** They do not just execute a fixed script. They evaluate novel board states or environmental loopholes. The specific move (Queen sacrifice) or strategy (loophole) was not fixed by history or design; it was generated by internal computation *in the moment*.
  *   **The Thermostat (No Reason):** This is the hardest case. Under this principle, it borders on Borrowed Reason. However, to match your verdict, we must say its mechanism (bimetallic strip) is too coupled to physical law (thermal expansion) to count as "mediated." It lacks the informational gap that the Smoke Detector has.

  ### Stabilizing Your Verdicts

  **The Spider:** You feel the spider deserves more than the bacterium because it repairs and adjusts its web. Under the Principle of Mediated Control, the spider still falls under **Lineage Reason**. The adjustment is instinctual, not calculated. The spider does not model the wind; it reacts to tension via hardwired triggers. You should stabilize your verdict here: The spider has a *more complex* lineage reason than the bacterium, but it is not an "Own Reason."

  **The Thermostat vs. Smoke Detector:** Your distinction here is the most fragile. Both are artifacts. The Smoke Detector has a borrowed reason; the Thermostat should logically have one too. The only way to save your verdict is to claim the Smoke Detector processes *information* (smoke particles as a sign of fire), whereas the Thermostat processes *force* (heat bends metal). If you accept that distinction, the principle holds. If not, you should concede the Thermostat has a borrowed reason.

  ### Application to Unlisted Cases

  Here is how the Principle of Mediated Control judges four cases you did not list:

  1.  **A Virus:** **Lineage Reason.** A virus assembles and infects to replicate. It has no internal calculation, and no designer. Its "purpose" is entirely inherited from the evolutionary history of its capsid and genetic code. It is like the bacterium, but simpler.
  2.  **A Corporation's Strategy:** **Own Reason (Collective).** A corporation adjusts prices and supply chains to secure profit. No single employee grasps the whole strategy, and it is not hardwired by law. It is computed by the organization's internal processes (meetings, data analysis) in real-time. The reason belongs to the corporation as a system, not the CEO alone.
  3.  **A Person Acting Out of Habit:** **Own Reason (Degraded).** When you drive home on autopilot, you are not calculating every turn. However, the capacity to drive was learned by *you*, not your ancestors. It is a cached "Own Reason." If a roadblock appears, you switch back to active calculation. The habit itself has no reason, but the agent sustaining the habit does.
  4.  **A Slime Mould Finding a Maze Path:** **Lineage/Physical Hybrid.** This is a boundary case. The mould grows toward food (Lineage), but it leaves external slime trails to avoid loops (a form of external memory). It does not "calculate" internally like the chess engine. I would classify this as **Lineage Reason**, because the mechanism of trail-laying is evolved, not learned or computed in the cognitive sense.

