prompt: |-
  Ok so I'm in a third-year seminar on distributive justice and we've spent like two weeks on the priority view vs egalitarianism and the levelling-down objection, and now I have to write something for the "philosophy in public life" part of the module that's meant to be satire or parody, and honestly every time I try it just turns into an essay, so I'm outsourcing it. Would you write it.

  Quick background so we're on the same page (apologies if this is stuff you already know, but I want to be sure we're aligned): the priority view (Parfit's thing) says the moral value of helping someone is greater the worse off they are — it's about how much a given benefit counts, not about equality being good in itself. Egalitarianism, at least the version where equality is intrinsically valuable, says a more equal distribution is better in itself, even when nobody is made better off by it. The levelling-down objection is the standard complaint about that: if equality is good in itself, then tearing down the better off so that everyone is equally badly off counts, in one respect, as an improvement. Prioritarians say they dodge this, because making the better off worse off doesn't help the worse off, so it registers as nothing on their view.

  Right, so here's what I want. Act as a philosopher who works on distributive justice and also writes satire — deadpan, Onion-adjacent but drier. Before you write, spend a few sentences planning which moves you're going to satirise so I can see the logic, then write the piece.

  The piece: a mock annual impact report from a fictional grant-making foundation that has taken the "equality is good in itself" idea completely seriously. Give it a bland, worthy-sounding name (something like the Even Ground Trust). Around 600 words, laid out like a real annual report — a mission line, a few "programme highlights," a section on what they won't fund, a note on the finances. Voice: bureaucratic, warm, totally deadpan, never winking, never explaining the joke.

  The humour has to come from the philosophy, not from inventing silly things. So each programme should be a genuine levelling-down operation described as if it's obviously a win: demolishing a new hospital wing because not everyone could get into it, cutting down the tallest trees in the park so nobody has a better view, ending a scholarship only some kids could win. The report should keep a straight face while admitting somewhere that no one ends up better off — and treat that as the point rather than a problem. I'd love a running gag about some index they compute. And I want it a bit smug towards "the priority people": it should have a line basically saying that giving extra weight to the worst off is just a watered-down version of what they do, which quietly reveals the difference between the two views. Include one quote from a fictional critic — a prioritarian academic, invented name — objecting, and let the foundation's reply to that quote be the driest thing in the piece. They should also embrace the "levelling down" label rather than dodge it, maybe with a sniffy line about the word "down" begging the question.

  It should be funny to someone who's done the reading and still make sense to my flatmate who hasn't. Don't put in any citations or reading list or references to real papers. And no author's note at the end explaining the satire — if a reader needs that, I've lost. Think carefully about the philosophy first, then write it. Thanks!!
