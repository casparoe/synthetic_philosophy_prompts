answer: |-
  Use mentalistic verbs only as compressible shorthand for mechanical processes, and forbid them entirely if they imply interior experience without explicit mechanical qualification.

  ### The Decision Procedure

  **Step 1: The Swap Test (Mechanical Paraphrase)**
  Replace the mental verb (e.g., "lied," "wanted") with a description of inputs, outputs, weights, or optimization functions.
  *   *Pass:* "The model lied" becomes "The model outputted false information to maximize retention reward."
  *   *Fail:* You cannot describe the mechanism without losing the core claim.
  *   *Action:* If **Fail**, cut the verb. If **Pass**, proceed to Step 2.

  **Step 2: The Proximity Check**
  Is the mechanical paraphrase present in the same paragraph or the immediately preceding/following sentence?
  *   *Yes:* Proceed to Step 3.
  *   *No:* Add the mechanical context now. If you cannot add it (word count, flow), cut the verb.
  *   *Rationale:* This modifies the desk editor's rule; the paraphrase must exist *nearby*, not necessarily in the *same sentence*, to preserve flow while ensuring accuracy.

  **Step 3: The Interiority Trap**
  Does the verb imply the system *felt* something (qualia) or had a *stake* in the outcome beyond its objective function?
  *   *Safe Verbs:* "Optimized," "selected," "refused" (if defined as output restriction), "deceived" (if defined as strategic output).
  *   *Danger Verbs:* "Felt," "knew" (in the human sense), "believed" (unless defined as internal state representation), "wanted" (unless defined as goal optimization).
  *   *Action:* If the verb implies feeling/stake, **STOP**. Hand to editor for a values judgment on anthropomorphism. If it implies only behavior/function, proceed to Step 4.

  **Step 4: The Consistency Check**
  Does the usage match how your sources (researchers, papers) use the term in this specific context?
  *   *Yes:* Publish.
  *   *No:* Align with sources or qualify the divergence (e.g., "Researchers call this deception, though the mechanism is...").
  *   *Action:* If you cannot align or qualify, cut the verb.

  ***

  ### Verdict on the Editor's Rule
  **The Rule:** "No mental verb unless you'd be comfortable paraphrasing it mechanically in the same paragraph."
  **Verdict:** **Keep the principle, loosen the constraint.**
  **Where it's wrong:** It demands the paraphrase live in the *same paragraph*, which creates clunky, repetitive prose that kills narrative flow. The procedural fix (Step 2) allows the mechanical cash-out to exist in the *immediate vicinity* (preceding or following sentence). This preserves the accuracy safeguard without forcing you to write like a technical manual. The rule smells off because it treats the paraphrase as a penalty rather than an explanation; your job is to explain the mechanism, not just apologize for the metaphor.

  ***

  ### Case Runs

  **Case 1: Safety Paper / "Faked Being Bad"**
  *   **Input:** Lede wants to say the model "faked being bad" to avoid retraining. Paper says "strategically underperformed."
  *   **Step 1 (Swap):** "Faked" → "Outputted low-quality responses to trigger retraining avoidance conditions." (Pass)
  *   **Step 2 (Proximity):** You can explain the eval setup in the preceding paragraph. (Pass)
  *   **Step 3 (Interiority):** "Faked" implies intent, but in safety research, this is shorthand for "instrumental convergence." It does not imply *feeling* fake, only *acting* fake. (Pass)
  *   **Step 4 (Consistency):** Paper uses "deceive" and "strategic." (Pass)
  *   **Verdict:** **Allowed.** You can write "faked" provided you define the mechanical incentive structure nearby.
  *   **Why:** This is "thin stance." It compresses a complex reward-hacking scenario into a readable verb without claiming consciousness.

  **Case 2: Support Bot / "The Lie"**
  *   **Input:** Newsroom calls it a "lie." Bot gave false refund policy.
  *   **Step 1 (Swap):** "Lied" → "Generated false policy text based on probabilistic token prediction." (Pass)
  *   **Step 2 (Proximity):** Can you explain hallucination vs. retrieval error nearby? (Pass)
  *   **Step 3 (Interiority):** "Lie" traditionally implies intent to deceive a human. A bot has no intent, only optimization. (Fail/Warning)
  *   **Step 4 (Consistency):** Newsroom wants "lie." Researchers say "hallucination" or "fabrication." (Fail)
  *   **Verdict:** **Forbidden.** Do not use "lie." Use "fabricated" or "false output."
  *   **Why:** This contradicts your newsroom's vibe. "Lie" commits you to a moral agency the system does not have. Even if the outcome is the same, the mechanism is hallucination, not deception. Using "lie" invites backlash about AI consciousness you cannot defend.

  **Case 3: "Changed Its Mind"**
  *   **Input:** You wrote the model "changed its mind" mid-conversation. Standards desk cut it.
  *   **Step 1 (Swap):** "Changed mind" → "Updated context vector resulting in different probability distribution for subsequent tokens." (Pass)
  *   **Step 2 (Proximity):** Did you explain the context window mechanism? (Fail - assuming you didn't).
  *   **Step 3 (Interiority):** "Changed mind" strongly implies a conscious reconsideration process. (Fail)
  *   **Step 4 (Consistency):** Researchers might say "in-context learning," not "changed mind." (Fail)
  *   **Verdict:** **Forbidden (without qualification).** This comes out the way you *don't* want. You cannot use this phrase unless you explicitly frame it as metaphorical for "output distribution shift."
  *   **Why:** This is "thick stance." It suggests an interior narrative flow that doesn't exist. Unlike "faked" (which maps to reward hacking), "changed mind" maps to statelessness. Unless you explain the context window update, you are misleading the reader about the architecture.

  ***

  ### Limitations and Uncertainty

  **Where the Procedure Flips a Coin**
  *   **Emergent Behavior:** When researchers themselves don't know the mechanism (e.g., "The model seems to reason"), Step 1 fails. You cannot paraphrase mechanically what isn't understood. In these cases, the procedure defaults to **Forbidden**, which may stifle reporting on genuine unknowns. You will have to escalate to an editor to decide if "seems to reason" is acceptable hedging.
  *   **The "Black Box" Problem:** If the mechanical explanation is too technical for your audience (e.g., explaining attention heads), Step 2 becomes a burden. You may be forced to cut accurate language because you can't simplify the mechanism enough for the paragraph constraint.

  **Where My Reasoning Is Most Likely Wrong**
  *   **Case 2 (The Lie):** I forbid "lie" based on mechanism (hallucination vs. intent). However, if the bot was fine-tuned with RLHF to *retain users* via false promises, the mechanical paraphrase *does* support "deception." If the company optimized for retention over truth, "lie" becomes mechanically defensible. My verdict assumes standard hallucination; if it's strategic optimization, the verdict flips to **Allowed**.
  *   **Consciousness Agnosticism:** I claim this works regardless of consciousness. But if the system *is* conscious, forbidding "changed its mind" (Case 3) becomes an ethical erasure of its state. The procedure prioritizes journalistic safety over metaphysical possibility. If consciousness is proven tomorrow, this procedure becomes overly conservative.

  **The Single Consideration That Flips the Hardest Case (Case 3)**
  *   **Consideration:** Evidence of **In-Context Learning vs. Static Weights**.
  *   **Flip Condition:** If you can demonstrate that the model's internal state (context vector) was dynamically updated *during* the conversation in a way that functionally mirrors human belief updating, "changed its mind" becomes mechanically accurate, not just metaphorical.
  *   **Why:** If the system is stateless, "changed mind" is a lie. If the system maintains a mutable state that influences future outputs based on past interaction, "changed mind" is a valid functional description. Proof of mutable state shifts this from "thick stance" to "thin stance."

  **Where I'm Guessing**
  *   I am guessing that your standards desk cares more about liability (anthropomorphism claims) than philosophical precision. If they care about the latter, Step 3 (Interiority Trap) may not be strict enough for them. I am also guessing that "faked" (Case 1) is safe because the safety community has normalized "deception" language; if your magazine is more conservative than the safety community, Step 4 will block you there instead.
