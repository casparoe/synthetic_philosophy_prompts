  ### The Separating Case
  To definitively separate Rule 1 (Rigid Designator) from Rule 2 (Hidden Structure), you need a case where both terms are rigid designators, the identity is arguably **true**, but there is **no hidden structure**.

  **The Case:** **'The sensation of heat is mean molecular kinetic energy.'**

