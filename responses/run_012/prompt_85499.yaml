  Here is the prediction, the rule, and the test case.

  ### The Prediction
  She will say: **Not a genuine identity (False).**

  She will treat 'Red' not as a natural kind term like 'Water' (which picks out a substance whose essence is discovered), but as a term for a secondary quality or phenomenal property like 'Pain'. Since she rejected 'Pain is C-fibres' on the grounds that one can conceive of the pain without the physical state, she will apply the same logic here: one can conceive of the reflectance profile R existing without looking red (e.g., to a different species) or red existing without R (e.g., inverted spectrum or hallucination). For a Kripkean, if an identity statement between rigid designators is conceivably false, it is metaphysically contingent; and if it is contingent, it cannot be a true identity.

  ### The Rule She Is Running
  The rule that fits her tally best is **Rule 2: Necessity tracks whether some hidden structure is doing the explaining of the appearances.**

  *   **Why Rule 1 (Rigid Designators) fails:** Rule 1 states *if* the identity is true and terms are rigid, it is necessary. It doesn't predict *which* identities are true. It cannot explain why 'Water is H₂O' passes but 'Pain is C-fibres' fails, as she treats the terms in both pairs as rigid.
