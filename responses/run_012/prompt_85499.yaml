  *   **Why Rule 2 (Hidden Structure) wins:** This captures the Kripkean distinction between **Natural Kinds** and **Phenomenal/Secondary Qualities**.
      *   *Water/Gold:* Reference is fixed by appearance ("watery stuff"), but the *essence* is hidden structure (H₂O). The appearance is contingent; the structure is necessary. Identity holds.
