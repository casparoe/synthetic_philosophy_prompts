          *   *Safety Evals:* Average-case reasoning (mean harmfulness across $N$ prompts, confidence intervals).
          *   *Security:* Worst-case reasoning (adaptive adversary, weight leakage).
      *   **Core Question:** What implicit decision theory/presuppositions justify this split?
      *   **Specific Sub-questions:**
          *   Does it require additive harms?
          *   Does it require bounded loss?
