prompt: |-
  Ok, longtime lurker, first-time question. Something I keep bumping into in AI safety writeups and I can't tell if it's a genuine philosophical commitment or just inconsistent vibes, so help me out.

  Setup: a lab has a responsible-scaling-ish deployment policy. The headline rule reads like pure worst-case reasoning: don't ship if the model clears capability threshold X, period, no discounting by how unlikely the bad outcome supposedly is. Then two pages later the safety evals are reported as mean harmfulness across a few hundred red-team prompts with a confidence interval, and the actual gate is average below some number. Meanwhile the security people are back to worst-case: assume an adaptive adversary, assume the weights leak, plan for the tail.

  So what does that split presuppose? I assume it needs harms to be roughly additive so a mean is even the right statistic, plus some separate story about a few harms sitting off the distribution entirely where averaging is meaningless. Does it require a view about whether the loss is bounded? Or is it just the boring actuarial thing, use expectations for many small independent events and maximin when one event ends the game?

  What I actually want: reconstruct the implicit decision theory, tell me which bits the practice forces vs. which are just inherited habit, and where it's underdetermined, e.g. could a risk-weighted-expected-utility person and a plain expected-value person run the exact same policy and disagree only in the postmortem? And what breaks first if you flip the average gate to a worst-case one, or the reverse?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

