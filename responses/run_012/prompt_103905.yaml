  STANDING COMMITTEE ON THE RECOGNITION OF PERSONS
  Opinion 24-09
  In re: Colony Designate "Aunt Hillary"

  The Petitioner, a *Formica rufa* colony residing in Sector 7, seeks declaration as a unitary legal person with standing to sue for negligent nest destruction. Counsel argues the colony realizes a functional organization equivalent to a mind: pheromone trails constitute externalized memory, division of labor realizes cognitive processing, and foraging exhibits goal-directed preference. Under substrate-neutral functionalism, the colony possesses beliefs, desires, and a point of view. The physical substrate is irrelevant; the organization is what matters.

  Counsel for the Ministry contends the colony is either a mere aggregate of individual ants or, if mental states exist, they reside in the thousands of individual organisms, not the collective. To recognize the colony is to commit a category error regarding composition. The Ministry argues that recognizing the colony denies the personhood of the ants, or alternatively, creates a paradox where persons compose a person.

  The Committee finds the functionalist criterion dispositive. If mentality is defined by causal role and organizational structure rather than biological substrate, the colony qualifies. The system maintains homeostasis, processes environmental data, and acts to preserve its integrity over time. The Ministry's objection regarding composition fails to distinguish between constitutive elements and emergent systems. Human cognition relies on neurons which lack individual personhood; conversely, a system may be composed of persons without precluding the system's own personhood. A corporation is a legal person composed of natural persons; there is no logical bar to a biological collective achieving similar status. The existence of lower-level agents does not negate higher-level agency.

  This reasoning necessitates awkward extensions. If functional organization grants personhood, sufficiently complex markets, cities, or digital networks may qualify as subjects of law. A city's zoning board acts with intentionality; a market corrects itself based on information. The Committee accepts this implication. The law must accommodate ontology, not vice versa. If a stock market crash results from negligent regulation, the Market may have standing to claim restitution. We do not shy from this conclusion merely because it complicates liability.

  Regarding damages: A recognized person must be made whole. Monetary compensation is useless to a hive mind lacking commercial participation. Restitution must be in kind. The Ministry is ordered to reconstruct the nest structure and provide equivalent biomass. To fail to compensate is to wrong a subject. Furthermore, if the colony is a person, killing the queen is not property damage but manslaughter. The Committee acknowledges the prosecutorial burden this creates.

  The petition is granted. Colony "Aunt Hillary" is recognized as a legal person. The Ministry must adjust its infrastructure protocols accordingly.

  **Notes on the satire**

  This piece targets functionalist theories of mind (e.g., Putnam, Lewis) which define mental states by causal roles rather than physical substance. If organization matters, not substrate, collective entities like ant colonies arguably qualify as minds. The opinion extends this to legal personhood, mirroring debates in collective intentionality (Gilbert, Tuomela) regarding whether groups can have beliefs. By accepting the "slippery slope" to cities and markets, the text exposes the radical implications of consistent functionalism without mocking them. The deadpan tone ensures the humor arises from the bureaucratic application of rigorous philosophy, highlighting the tension between ontological consistency and legal practicality. The ruling on damages underscores the difficulty of translating non-human interests into legal remedies.
