      *   Ensure the "Desire Theory" analysis is sharp. If I desire it gone because it's distracting, is the *pain* bad or the *distraction* bad? This is the crux.
      *   *Key Insight:* The drug might fail as a commercial product if the sensation remains distracting, even if it doesn't "hurt." This is a practical implication of the philosophical point.

