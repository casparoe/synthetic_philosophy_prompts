      Let's frame the "Killer Constraint" as **The Constraint of Objective Force.** How does a subjective agreement become an objective barrier?

      *Decision:* I will frame the "Killer Constraint" as **Causal Invariance under Contingency.** The theory must explain how a category can be contingent (we could have chosen otherwise) yet invariant (it acts like a law of nature once chosen).

      *Let's refine the Conflicts.* The "Impossible Trinity" in social ontology is often:
      1. Mind-Independence (Realism)
      2. Causal Power (Realness)
      3. Malleability (Construction)
      You can usually pick two.
      - Realism + Causal Power = Natural Kinds (Race as biology) -> Fails Construction.
      - Malleability + Causal Power = Institutional Facts (Money) -> Fails Mind-Independence.
      - Realism + Malleability = ??? (Hard to sustain).
      Actually, the tension is between **Arbitrariness of Origin** and **Non-Arbitrariness of Consequence.**

      Okay, I have the map. Now to write the code (text).

