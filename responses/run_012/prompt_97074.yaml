answer: |-
  This is a specification request for an ontological theory. You are asking for the interface definition that any theory of "social construction" must implement to be considered robust. You want to know the invariants, the edge cases, and the known race conditions.

  Below is the specification. It is written to be domain-agnostic, applying equally to database schemas, monetary systems, and human identity.

  ### Part 1: The Specification (Desiderata)

  An adequate theory of social construction must satisfy four functional requirements. If a theory fails any of these, it is either too vague to be useful or too rigid to match reality.

  #### 1. The Dependency Interface (Ontological Input)
  **Requirement:** The theory must explicitly declare what human inputs are required to sustain the category's existence.
  **Motivation:** We need to distinguish between a *rock* (exists without us) and a *dollar* (ceases to function if we stop believing in it). A theory must specify the "uptime" conditions for the category. Does it require collective intentionality? Legal enforcement? Physical instantiation?
  **Failure Mode:** If the theory cannot distinguish between a category that survives human extinction (e.g., "water") and one that does not (e.g., "citizenship"), it fails to define "construction."

  #### 2. The Causal Output Contract (Realness)
  **Requirement:** The theory must account for the category's ability to produce effects that are independent of individual belief.
  **Motivation:** Even if money is "made up," you cannot eat without it. Even if a trust tier is "algorithmic," it denies loans. A category that is constructed but has no causal power is a fiction; a category that is constructed and *does* things is an institution. The theory must explain how a subjective agreement becomes an objective constraint.
  **Failure Mode:** If the theory implies that "constructed" means "optional" or "ignorable," it contradicts the empirical reality that social categories constrain behavior physically and economically.

  #### 3. The Boundary Stability Protocol (Precision)
  **Requirement:** The theory must explain how boundaries are drawn and why they resist or permit shifting.
  **Motivation:** In software, a `boolean` is sharp; in medicine, a diagnosis often relies on a cutoff on a continuum (e.g., blood pressure). In race, boundaries are porous but policed. A theory must explain why some constructed lines are rigid (you are either 18 or you are not) while others are fluid (you are "kind of" sick).
  **Failure Mode:** If the theory treats all constructed categories as equally arbitrary, it cannot explain why some are harder to change than others.

  #### 4. The Feedback Loop Handler (Dynamic State)
  **Requirement:** The theory must account for the fact that classifying a thing can change the thing being classified.
  **Motivation:** This is critical for human kinds. If you label a child "gifted," they may perform better. If you label a group "dangerous," they may be policed more heavily, increasing arrest statistics. Natural kinds (quarks) do not change because we label them. Social kinds often do.
  **Failure Mode:** If the theory treats categories as static labels on static objects, it fails to model human systems where the map changes the territory.

  ---

  ### Part 2: The Race Conditions (Incompatibilities)

  You asked for an honest account of what cannot be had all at once. In system design, you often face the CAP theorem (Consistency, Availability, Partition Tolerance: pick two). In social ontology, there is a similar trilemma.

  **The Trilemma of Construction:**
  1.  **Objectivity:** The category acts like a law of nature (constraints are hard).
  2.  **Contingency:** The category is historically accidental (we could have chosen otherwise).
  3.  **Transparency:** The mechanism of construction is visible and understandable to the subjects.

  **The Conflict:**
  *   **Objectivity + Contingency (Money/Trust Tiers):** You can have a system that is totally made up (contingent) but acts like a law of nature (objective). *Cost:* Transparency. The system often requires "black boxing" (e.g., "the market decides," or "the model says no") to maintain the objective force. If everyone sees the code, they might game it, breaking the objectivity.
  *   **Contingency + Transparency (Activist/Democratic Categories):** You can have a category that everyone knows is made up and agrees can be changed. *Cost:* Objectivity. These categories often lack the "teeth" to enforce consequences consistently because everyone knows they are negotiable.
  *   **Objectivity + Transparency (Natural Kinds):** You can have a category that is stable and understood. *Cost:* Contingency. This is only possible if the category is *not* socially constructed but discovered (e.g., biology).

  **The Specific Incompatibility:**
  You cannot simultaneously maintain that a category is **merely arbitrary** (purely contingent) and **causally rigid** (fully objective) without introducing a **mechanism of concealment** (lack of transparency).
  *   *Why:* If people know a boundary is arbitrary, they will test it. If they test it and it holds, there must be a force behind it. If that force is human (police, code), it is visible. If it is visible, it looks political, not natural. To feel "real" like money or race, the constructed nature often has to be forgotten (reified).

  ---

  ### Part 3: Unit Tests (Case Studies)

  Here is how the specification applies to your four test cases.

  #### 1. Platform Trust Tier (The Black Box)
  *   **Dependency:** High. Requires the platform's server and user compliance.
  *   **Causal Output:** High. Denies credit/access.
  *   **Boundary:** Sharp (score > X), but opaque.
  *   **Feedback:** Users change behavior to game the score.
  *   **Tension:** This system maximizes **Objectivity** (it feels like fate) and **Contingency** (the company can change the weights tomorrow) by sacrificing **Transparency** (nobody sees the code).
  *   **Theory Debt:** A theory must explain how an opaque algorithm creates a "social fact." If the theory requires shared understanding, this tier fails. If the theory allows unilateral imposition, then "construction" becomes indistinguishable from "force."

  #### 2. Medical Cutoff (The Continuum)
  *   **Dependency:** Medium. Requires biological reality + committee agreement.
  *   **Causal Output:** High. Triggers treatment/insurance.
  *   **Boundary:** Arbitrary point on a continuous distribution.
  *   **Feedback:** Diagnosis changes patient behavior (adherence, stress).
  *   **Tension:** This tests **Boundary Stability**. The biology is real (Objectivity), but the line is drawn by humans (Contingency).
  *   **Theory Debt:** A theory must distinguish between the *condition* (hypertension) and the *category* (Hypertensive Patient). If it conflates them, it naturalizes the cutoff. If it separates them too sharply, it ignores that the cutoff *creates* the patient group.

  #### 3. Money (The Consensus)
  *   **Dependency:** High. Requires collective belief.
  *   **Causal Output:** High. Moves physical goods.
  *   **Boundary:** Sharp (valid tender vs. not).
  *   **Feedback:** Inflation/deflation changes behavior based on trust.
  *   **Tension:** This is the gold standard for **Objectivity + Contingency**. It works only as long as we pretend it is Objective.
  *   **Theory Debt:** The theory must explain "collective intentionality." How does my private belief aggregate to a public fact? If the theory relies on individual psychology, it fails to explain market crashes.

  #### 4. Race and Gender (The Loop)
  *   **Dependency:** High. Requires social interaction and enforcement.
  *   **Causal Output:** High. Affects health, wealth, safety.
  *   **Boundary:** Contested, porous, policed.
  *   **Feedback:** Strong. Being racialized changes biology (stress outcomes) and behavior (performance).
  *   **Tension:** This breaks the **Transparency** constraint. If race is admitted to be constructed, it loses its political utility for both oppressors (who want it natural) and some defenders (who want it a stable basis for rights).
  *   **Theory Debt:** This is the hardest case. The theory must handle **Feedback Loops** where the classification alters the biological substrate (e.g., weathering hypothesis). A static ontology fails here. The category is a moving target that we are chasing.

  ---

  ### Part 4: System Constraints (Verdict)

  #### Non-Negotiable Requirements
  These are the requirements a theory *must* meet to be useful for your work. If a theory fails these, it is broken.

  1.  **Causal Efficacy (Requirement #2):** The theory must grant "realness" to anything that produces consistent, predictable consequences. If a trust tier denies a loan, it is ontologically equivalent to a locked door. A theory that calls the door "real" and the tier "fake" is useless for engineering or ethics.
  2.  **Feedback Compatibility (Requirement #4):** The theory must allow for the state of the object to depend on the classification of the object. Static type systems fail here; you need a reactive model.

  #### Preferences (Camp-Specific)
  These are often presented as requirements but are actually political or philosophical choices.

  1.  **Mind-Independence:** Some theories insist that to be "real," a thing must exist without humans. This is a preference for *Naturalism*. It is not required for a functional ontology of software or society.
  2.  **Moral Neutrality:** Some theories insist on describing categories without judging them. Others insist that a theory of race *must* include an ethical judgment. For your purposes (adjudicating "real vs. artificial"), moral valence is a separate module and should not block the ontological check.

  #### The Killer Constraint
  **The single requirement that rules out the most candidates is: Causal Invariance under Contingency.**

  **Why:**
  Most naive theories fail here.
  *   **Naive Realism** fails because it cannot explain why money or trust tiers work (they are contingent, not natural).
  *   **Naive Constructivism** fails because it implies that if something is constructed, it is fragile or optional. It cannot explain why you cannot spend "fake" money or ignore a "constructed" ban.

  A viable theory must explain how a system can be **wholly dependent on human agreement** (Contingent) yet **act with the force of gravity** (Invariant).

  **The Conflict in Your Context:**
  In your software work, this maps to the tension between **Configuration** and **Law**.
  *   Your colleagues who say the categories are "artificial" are focusing on **Configuration** (we can change the code).
  *   Your colleagues who say they are "real" are focusing on **Law** (the code currently governs reality).

  **The Specification Result:**
  Any theory you adopt must be able to declare: *"This category is configurable (constructed), but until reconfigured, it executes with the privilege of root (real)."*

  If a theory cannot support that statement without crashing into contradiction, it is not robust enough to handle money, race, or your fraud model. It will force you to choose between seeing the system as mutable or seeing it as binding. You need a theory that lets you see both simultaneously.
