answer: |-
  My credence in the claim that no possible body of human testimony could ever make it rational for a suitably informed person to believe that a miracle has occurred stands at 0.55. This figure represents a marginal leaning towards Hume's scepticism, though it is precarious enough to acknowledge the force of modern Bayesian objections. To arrive at this number, one must first stipulate the load-bearing terms. By 'miracle', I adhere to your strict definition: an event that constitutes a genuine violation of a law of nature, rather than merely an unexplained anomaly. By 'law of nature', I mean a universal generalisation derived from empirical observation that is presumed to hold without exception. Finally, by 'rational', I refer to epistemic justification sufficient to warrant belief for a finite human agent, not necessarily for an idealised reasoner with infinite computational power. The decomposition of this credence rests upon five distinct sub-questions, each contributing weight to the final assessment.

  The first sub-question concerns the coherence of the category 'miracle' once one accepts that the laws of nature may be statistical or defeasible rather than iron. If a law is merely a high-probability regularity, as suggested by quantum mechanics, then a 'violation' is simply a low-probability event rather than a logical impossibility. I assign a probability of 0.85 to the proposition that our best scientific laws are indeed statistical or model-dependent. The justification here is the historical trajectory of physics, which has moved from Newtonian certainty to probabilistic formulations, suggesting that exceptionless laws are metaphysical posits rather than empirical findings. This high probability weighs against the Humean claim, as it renders the concept of a 'violation' incoherent; if the law allows for exceptions, the event is not a miracle but a predicted rarity.

  Secondly, one must consider whether the prior probability of a law-violation should be treated as exactly zero, as undefined, or merely as very small. In a strict Bayesian framework, assigning a prior of zero renders a hypothesis immune to evidence, whilst a non-zero prior allows for updating. I assign a probability of 0.90 to the view that the prior should be treated as very small but non-zero. The justification is that empirical laws are inductive generalisations, not logical truths, and thus cannot logically preclude counter-instances without circularity. This strongly undermines the strong Humean claim, for if the prior is non-zero, there exists some theoretical quantity of evidence that could overcome it.

  Thirdly, there is the matter of whether Hume is best read as making an in-principle claim or a merely in-practice one. If Hume argues that belief is impossible for any reasoner, he is likely wrong; if he argues it is impossible for humans given our psychological and epistemic limitations, he is likely right. I assign a probability of 0.65 to the interpretation that Hume's argument is primarily in-practice, grounded in the uniformity of experience rather than logical necessity. The justification lies in Hume's empiricist commitments, which focus on the weight of custom and habit rather than abstract logical impossibility. This interpretation rescues the Humean claim from the Bayesian objection, as it shifts the bar from 'possible in principle' to 'feasible for human cognition', thereby increasing my credence in the claim.

  Fourthly, we must ask whether testimony is even the sort of evidence that could in principle swamp a very small prior. Even if the prior is non-zero, the reliability of testimony might be bounded by human fallibility in a way that prevents it from ever reaching the requisite threshold. I assign a probability of 0.75 to the proposition that testimony could, in principle, swamp the prior. The justification is the convergence of independent witnesses; if witnesses are sufficiently independent and scrupulous, the probability of concerted error or deception diminishes exponentially, theoretically overtaking any finite prior. This factor pulls my credence down, suggesting that a sufficiently vast body of testimony could indeed render belief rational.

  Finally, there is the reflexive worry that our knowledge of the very laws in question is itself substantially testimonial, so that a report of a miracle would be doing double duty — at once evidence against a law and an event defined by its violation. This creates a tension where accepting the testimony undermines the definition of the event. I assign a probability of 0.80 to the view that this reflexive worry presents a significant, perhaps insurmountable, epistemic hurdle. The justification is that laws of nature are summaries of past observations; a counter-observation does not merely add data but challenges the summary itself, forcing a choice between revising the law or rejecting the observation, rather than accepting a 'violation'. This factor heavily supports the Humean claim, as it suggests the evidence is self-defeating.

  Combining these probabilities, the Bayesian openness (non-zero prior, swamping testimony) suggests the claim is false in principle, whilst the epistemic constraints (statistical laws, in-practice reading, reflexive worry) suggest it is true in practice. The 0.55 credence reflects a tie-breaker in favour of the practical limitations imposed by the reflexive worry; whilst an ideal agent might believe, a human agent situated within the web of scientific testimony likely cannot. The number is most sensitive to the second sub-question: the status of the prior probability. If one were convinced that the prior must be logically zero because a 'law' is defined by its exceptionlessness, the credence in the Humean claim would rise to nearly 1.0. Conversely, if one accepts that priors are merely pragmatic estimates, the credence would drop towards 0.1. Evidence that would move this most would be a rigorous philosophical account of natural laws that definitively settles whether they are prescriptive metaphysical necessities or descriptive empirical summaries.

  Regarding the disagreement between you and your friend, I assign a probability of 0.20 to the proposition that your quarrel would survive the substitution of a different construal of 'miracle' — specifically, defining it as an event that exceeds the explanatory resources of any natural law we shall ever possess, rather than one that violates a law now in force. This low number indicates that I believe the vast majority of your dispute is terminological rather than substantive. The reading that makes my original number higher is the strict 'violation' reading. Under the 'exceeding explanatory resources' definition, the event is no longer a contradiction of established science but merely an gap in current knowledge; consequently, the rational barrier to belief collapses, and the credence in the claim that belief is *never* rational would plummet. The 'violation' reading supports a higher original number because it retains the logical tension between the event and the law, which is the engine of Hume's scepticism. If you were to adopt the 'exceeding resources' definition, your friend the physicist would likely concede that belief is rational, whilst you would lose the philosophical leverage of the 'miracle' concept, dissolving the quarrel entirely.
