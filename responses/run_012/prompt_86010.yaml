      *   **Part (b): Entitlement vs. Desert.** (Approx. 3 points)
          *   *Key distinction:* Entitlement = historical validity of transfer/rights. Desert = moral merit/worthiness.
          *   *Why it matters:* Nozick's argument *must not* rely on desert. If it relied on desert, it would be a patterned principle (matching distribution to moral worth). The argument works *even if* Chamberlain doesn't deserve it.
      *   **Part (c): Priya and Dan Case Application.** (Approx. 3 points)
          *   *Scenario:* Equal start, voluntary sale (even if desperate), Priya gets rich, Dan claims unfairness.
          *   *Nozick's View:* Transfer was voluntary (no force/fraud). Desperation does not equal coercion in Nozick's framework (usually). Therefore, the holding is just. Dan has no claim in justice.
          *   *Nuance:* Does "broke/no real choice" count as coercion? Standard Nozickian interpretation says no, unless Priya *caused* the brokness unjustly. The prompt implies Dan is just "broke and needs cash," not that Priya manipulated him.
