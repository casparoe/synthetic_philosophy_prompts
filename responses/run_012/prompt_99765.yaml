      *   **Section 2: Consistency Check.** Map the user's cases to the rules. Highlight where the "code" compiles and where it throws warnings.
      *   **Section 3: The Bugs (Inconsistencies).** Point out the 1% vs 20% (arbitrary threshold) and Piano vs. Life (partiality vs. value).
      *   **Section 4: The New Case.** Apply the principle.
      *   **Section 5: The Trade-off.** Explain *why* this principle exists (sustainability vs. maximization).

  9.  **Refining the Principle Name:**
      *   "Moderate Partialism with a Rescue Constraint."
      *   Or "The Integrity-Weighted Duty of Care."
      *   Let's go with **"The Sustainable Partialist Framework."** It captures the "sustainability" (don't burn out) and "partiality" (family first).
      *   Actually, philosophically, this is closest to **Moderate Deontology with Consequentialist Constraints** or simply **Common-Sense Morality**. Let's describe it functionally rather than using heavy jargon.
      *   Let's call it: **"The Threshold of Decency with Agent-Centered Prerogatives."**

  10. **Refining the "Bugs":**
      *   The 1% vs 20% isn't just arbitrary; it's *anchoring*. The user needs to know this is a cognitive bias, not an ethical feature.
      *   The Piano vs. Life is the core conflict with EA. The user needs to own that they value *relationships* over *outcomes*.

  11. **Refining the New Case:**
