      *   Why is bone marrow required? Because it's a *rescue* scenario (identifiable victim, immediate need).
      *   Why is 20% not required? Because it's *systemic* (statistical victims, ongoing demand).
      *   This suggests the **Identifiable Victim Effect** is baked into the user's ethics, plus a **Satisficing Threshold**.

      *Let's synthesize:* **The "Decent Citizen" Protocol.**
      1.  **Special Obligations Priority:** Family/Close Friends/Pets > Strangers.
      2.  **Rescue Principle:** Prevent immediate, catastrophic harm to identifiable others if cost is manageable (Bone marrow, Brother's rent).
      3.  **Baseline Contribution:** Contribute *something* to the general good to avoid free-riding (1% feels right, 0% feels wrong).
      4.  **Agent Prerogative:** Maintain personal life/career/integrity up to a point of reasonable comfort (Japan, Keyboard, Career).
      5.  **Harm Avoidance:** Do not actively cause harm (implied).

