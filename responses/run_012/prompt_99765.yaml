      *   *Constraint:* You must prevent catastrophic harm to others if the cost to you is non-catastrophic (The "Rescue Principle").
      *   *Constraint:* You must honor specific relational contracts (Family/Friends).
      *   *Constraint:* You are permitted to pursue personal projects that give life meaning, provided you meet a baseline contribution.

      *Wait, the "Bone Marrow vs. 20% Income" discrepancy is key.*
