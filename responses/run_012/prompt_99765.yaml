      *(Self-Correction during drafting)*: Make sure to explicitly address the "Bone Marrow vs. 20%" discrepancy. That's a specific inconsistency the user flagged implicitly. Bone marrow = high burden (perceived), low cost. 20% = low burden (perceived), high cost. Why the difference? It's about *ownership*. Money is "mine" by default. Body is "mine" but charity is a "request." Actually, it's about *ongoing* vs *one-off*. 20% is a lifestyle change. Bone marrow is an event. The principle should reflect **Status Quo Bias**.

