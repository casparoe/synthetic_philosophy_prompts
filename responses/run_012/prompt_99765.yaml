  4.  **Formulate the Best-Fit Principle:**
      *   The user isn't a pure utilitarian. They aren't a pure egoist. They believe in *some* obligation to strangers (bone marrow, 1% donation feels better than 0%), but strong *agent-relative permissions* (family, career, personal life).
      *   The principle looks like **Moderate Partialism with a Threshold of Decency**.
      *   Let's refine this. It sounds like **Rule Utilitarianism with Strong Agent-Relative Prerogatives** or, more simply, **Common-Sense Morality (Pluralism)**.
      *   Actually, a specific philosophical concept fits well: **The Principle of Fairness + Special Obligations + Satisficing.**
      *   Better yet: **Moderate Demandism.** (A term sometimes used in critique of EA).
