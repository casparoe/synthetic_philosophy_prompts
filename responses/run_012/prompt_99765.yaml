answer: |-
  Based on the verdicts you provided, you are not running a single utilitarian algorithm (maximize good), nor are you running a libertarian one (maximize liberty). You are running a **Hierarchical Duty Framework with Agent-Centered Prerogatives.**

  In philosophical terms, this is a form of **Moderate Deontology** mixed with **Common-Sense Morality.** It prioritizes specific relationships and negative duties (don't harm) over general positive duties (do good), but it insists on a non-zero baseline for the general good.

  Here is the "spec" for the principle your gut is executing, followed by the consistency check, the bugs, and the prediction.

  ### The Principle: Hierarchical Duty Framework

  **Priority 1: Negative Constraints (Do No Harm)**
  You must not actively cause measurable harm to others, even if doing so would generate resources to prevent greater harm elsewhere. Integrity is a side-constraint, not a currency to be spent.

  **Priority 2: Special Obligations (The Inner Circle)**
  You have strict, enforceable duties to specific entities with whom you have standing relationships: immediate family, close friends, dependents (children), and dependents under your care (pets). Their needs trump the needs of strangers.

  **Priority 3: The Rescue Principle (Identifiable Victims)**
  If an identifiable individual faces catastrophic harm (homelessness, death, severe health crisis) and you can prevent it with a *manageable* cost to yourself (financial or physical), you are required to act. "Manageable" is defined as not compromising your ability to fulfill Priority 2 obligations or your long-term stability.

  **Priority 4: Baseline Contribution (The Decency Threshold)**
  You owe a non-zero contribution to the general good (strangers/statistical victims) to avoid free-riding on society. This must be "painless" or "low-friction." Meeting this threshold makes you "decent." Exceeding it is praiseworthy (supererogatory) but not required.

  **Priority 5: Agent Prerogative (Personal Projects)**
  Once Priorities 1–4 are satisfied, you are permitted to spend resources on your own happiness, career satisfaction, and lifestyle, even if those resources could theoretically save lives elsewhere. You are not a vessel for utility; you are a person with a life to live.

  ---

  ### Consistency Check: Compiling Your Verdicts

  Here is how your specific cases map to the spec.

  | Case | Your Verdict | Principle Verdict | Status |
  | :--- | :--- | :--- | :--- |
  | **Coffee/Keyboard/Car/Japan** | Fine | **Priority 5** (Prerogative) | ✅ Consistent |
  | **Cousin's Wedding vs. Charity** | Must attend wedding | **Priority 2** (Special Obligation) > Priority 4 | ✅ Consistent |
  | **Dinner with Friend vs. Better Option** | Must keep dinner | **Priority 2** (Relational Contract) | ✅ Consistent |
  | **Brother's Rent ($6k)** | Must pay | **Priority 2** (Family) | ✅ Consistent |
  | **Dog Surgery ($3k)** | Must pay | **Priority 2** (Dependent/Pet) | ✅ Consistent |
  | **Bone Marrow (Stranger)** | Must do it | **Priority 3** (Rescue: Catastrophic harm, manageable cost) | ✅ Consistent |
  | **Stranger's Medical Bill ($3k)** | Hesitant/Optional | **Priority 3** (Rescue) vs **Priority 4** (Baseline) | ⚠️ *Tension* (See Bugs) |
  | **1% Auto-Donate** | Decent | **Priority 4** (Baseline Met) | ✅ Consistent |
  | **20% Auto-Donate** | "A lot" / Optional | **Priority 5** (Prerogative) | ✅ Consistent |
  | **Giving Nothing** | Wrong but "within rights" | **Priority 4** (Baseline Violated) | ✅ Consistent (matches "feels wrong") |
  | **Kid's Piano ($2k) vs. Life** | Piano wins | **Priority 2** (Dependent) > **Priority 3** (Stranger) | ✅ Consistent |
  | **Career Switch for Impact** | Not required | **Priority 5** (Prerogative) | ✅ Consistent |

  ### The Bugs (Inconsistencies & Biases)

  Your code compiles, but you have two logic errors (cognitive biases) masquerading as ethical features.

  **Bug 1: The Anchoring Error (1% vs. 20%)**
  *   **The Issue:** You feel 1% is "decent" and 20% is "a lot," even though you admit 20% wouldn't change your month.
  *   **The Cause:** This isn't ethics; it's **Reference Point Bias**. You have anchored "decency" to a social norm (1%) rather than your actual capacity (Priority 3 "manageable cost").
  *   **The Fix:** If 20% is truly unnoticeable to your lifestyle, your own principle (Priority 3: Rescue/Manageable Cost) suggests you *should* feel obligated to do it. The feeling that it is "a lot" is a bug in your cost-assessment function.
  *   **Verdict to Overturn:** You should either admit 20% is required *or* admit 1% is arbitrary. Given your stance on "sustainability," the honest fix is to acknowledge 1% is a social heuristic, not a moral truth.

  **Bug 2: The Identifiable Victim Discrepancy (Bone Marrow vs. Medical Bill)**
  *   **The Issue:** You must give bone marrow (time/pain) to a stranger, but hesitate to give $3k (money) for a stranger's medical bill.
  *   **The Cause:** **Loss Aversion.** Money feels like "property" (Priority 5), while your body feels like "self." Paradoxically, you are more willing to lend your body (Priority 3 Rescue) than your surplus cash (Priority 4 Baseline).
  *   **The Fix:** If $3k is "manageable" (like the bone marrow week is manageable), Priority 3 dictates you should give it. If $3k feels like it infringes on Priority 5 (your security), then the bone marrow should also be optional.
  *   **Verdict to Overturn:** You need to decide if "manageable cost" includes money. If yes, the $3k bill becomes mandatory. If no, bone marrow becomes optional. Currently, you are treating physical inconvenience as "cheaper" than financial loss, which is inconsistent.

  ### The New Case Prediction

  **Case:** *Taking a job that pays $80k more but does measurable harm, with the $80k going to effective charity.*

  **Prediction:** **Do not take the job.**

  **Reasoning:**
  This triggers **Priority 1 (Negative Constraints)**. Your framework distinguishes sharply between *allowing* harm (not donating enough) and *causing* harm (taking the harmful job).
  *   **EA View:** The math wins. Harm X < Good Y. Take the job.
  *   **Your View:** Integrity is a side-constraint. You cannot "launder" direct harm through charity. The $80k is tainted by the violation of Priority 1.
  *   **Exception:** Unless the "measurable harm" is trivial (e.g., minor pollution) and the charity saves thousands of lives, in which case Priority 3 might override Priority 1. But if the harm is direct and human (e.g., building weapons, predatory lending), your principle forbids it regardless of the donation.

  ### The Trade-Off (For your friend)

  Your friend calls you a hypocrite because they are running **Maximizing Utilitarianism** (One God: The Good). You are running **Pluralistic Morality** (Multiple Gods: Integrity, Relationships, Decency, Good).

  *   **Their World:** Maximizes total welfare. Risk: Burnout, erosion of special relationships, instrumentalization of human beings (you become a pump for utility).
  *   **Your World:** Maximizes sustainable decency. Risk: Sub-optimal outcomes. People die who could have been saved. You accept this tragedy as the cost of maintaining a world where humans have personal lives, families, and integrity.

  **The Honest Answer:**
  Your verdicts do not come from one principle. They come from a **weighted sum of competing values.**
  1.  **Care** (Family/Friends)
  2.  **Justice** (Don't harm/Do baseline good)
  3.  **Integrity** (Career/Personal projects)

  The "hypocrisy" your friend sees is actually **feature, not bug.** It is the trade-off required to make morality humanly sustainable. However, to be consistent, you must fix the **Anchoring Error**: if you can give 20% without noticing, your "Baseline Contribution" setting is too low, and you are technically free-riding on the capacity you possess but choose not to use.

  **Recommendation:** Bump the auto-donate to 5%. It splits the difference between social norm (1%) and capacity (20%), satisfying Priority 4 without triggering the "Loss Aversion" bug of Priority 5.
