  7.  **Develop the New Case Prediction:**
      *   *Case:* Job pays +$80k, does measurable harm, money goes to charity.
      *   *User's Principle:* Harm Avoidance is usually a strict constraint (Negative Duty > Positive Duty).
      *   *Prediction:* User will likely say "Don't take the job."
      *   *Why:* You can't buy your way out of direct harm. The "Rescue Principle" applies to *your* resources, not *selling out* your integrity.
      *   *Conflict:* If the harm is small and the good is huge (trolley problem style), the user might wobble. But usually, "do no harm" is a side constraint.

  8.  **Drafting the Response:**
