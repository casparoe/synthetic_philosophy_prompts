answer: |-
  Chen: You saw her with the cup. She saw another child weeping, and she walked over to offer comfort. She didn't know she was being watched. There was no reward. If that isn't the sprout of benevolence, what is it?

  Wu: It is a movement of impulse, certainly. But call it benevolence only at your peril. You say it is the beginning of virtue; I say it is the beginning of nothing until it is repeated, refined, and bound to a rule. If that goodness were truly native, fully formed in the seed, what would teachers be for? What would the sages have been for? They invented ritual because they saw that without it, the cup-offering becomes the toy-snatching you witnessed two days later.

  Chen: And if her nature were nothing but raw appetite—fear, comfort, the wish not to be wronged—where did the first person who ever became good get his goodness? If nature is only crooked wood, who built the straightedge? If there is no internal compass, no faint recognition of the right, then ritual is just coercion. The first sage would have been imposing a form with no capacity in himself to recognize it as good. You make morality a conspiracy of the trained against the untrained.

  Wu: I make it a craft. The first sage did not find goodness inside; he found chaos outside. He saw that when desires collide, everyone suffers. He constructed ritual as a dam holds back water. You ask where he got the blueprint? From necessity. From the observation of consequences. He didn't need a moral sprout to see that biting leads to bleeding. He needed intelligence. Your daughter's cup-carrying was likely mimicry or a desire for social smoothness she has observed. The toy-snatching was the truth of her unchecked desire: I want, I take. The cup was an accident; the toy was the instinct.

  Chen: The toy was not the whole truth. The toy was the sprout of desire obstructing the sprout of yield. She felt the pull of the object, yes. But you ignore that she also felt the pull of the other's grief earlier. If nature were purely self-seeking, that moment of offering the cup would be impossible. It would be like a fire feeling cold. It contradicts the system. I admit the toy-snatching hurts to watch. But that is why I say the sprouts are faint. They are easily crushed. If you treat the child as merely raw material to be steamed and clamped, you risk crushing the very thing that makes the ritual stick. You cannot clamp a stone into a bow; it must be wood. There must be something in her that *wants* to grow straight.

  Wu: Now we arrive at the knot. You say "wood," I say "raw material." But I suspect we are using the word "nature" to mean different things. For you, nature includes the potential for virtue. For me, nature is strictly what is there before human effort. If we agree that the child needs cultivation—that the cup-offering must become a habit, not a whim—then are we not arguing over semantics? You say "extend the sprout," I say "shape the wood." Both of us say: do not leave her alone.

  Chen: I wish it were merely verbal. But it is not. If you believe her nature is only appetite, you look for authority outside her. You watch for compliance. If I believe her nature contains the beginnings of virtue, I look for authority inside her. I watch for recognition. If I treat her as a crooked sapling, I must force her. If I treat her as a seed, I must nurture her. The difference is where we place our trust. If you are wrong, you raise a child who obeys but does not understand, who follows the ritual but feels nothing when the ritual breaks.

  Wu: And if you are wrong, you raise a child who trusts her feelings as moral guides. You let her believe that because she *felt* like sharing the cup, she is good. Then when she feels like snatching the toy, she will believe that is good too, unless you stop her. The dispute is substantive because it changes the locus of value. For me, value is created by the sage's work, by the history of human effort to curb conflict. For you, value is discovered. If it is discovered, why is it so hard to find? Why does she need you to tell her not to snatch?

  Chen: Because she is two. The sprout is not the tree. But tell me this: if you are merely shaping raw material, why does coercion fail? You cannot simply clamp her. You said it yourself: you are not a disciplinarian who wants desires crushed. You want them given form. But to give them form, you must find a grain in the wood to follow. If there were no grain, no affinity for the shape you are imposing, the wood would splinter. She must *accept* the ritual.

  Wu: She accepts it because it works. Because it brings peace. Because she sees that when everyone yields, everyone plays. That is not a moral affinity; that is a pragmatic one. But I will concede this: you cannot shape what is utterly resistant. If she had no capacity to learn the pattern, no ability to find satisfaction in the fit of things, my ritual would be useless. I need her intelligence. I need her desire for comfort.

  Chen: Then you concede there is something in her nature that resonates with the good. You call it intelligence or comfort, I call it the sprout of righteousness. But look at the practical upshot for this father. If you are right, he must drill her. He must impose the form until it is second nature. If I am right, he must make room for her impulses, watch for the moments of compassion, and help her extend them. He cannot simply drill. He must listen.

  Wu: I do not say he should drill like a soldier. I say he must habituate. But I hear your concession: you admit that without the habituation, the sprout dies. You admit that "getting out of the way" is negligence. You said it yourself: the sprout is easily crushed. So you agree that nature left alone is insufficient.

  Chen: I agree that nature left alone is incomplete. But incomplete is not opposed. If I teach her to yield, I am not installing a new drive; I am clearing the weeds so the drive to yield can grow. If you teach her to yield, you are installing a brake on the drive to take. The difference matters when she is alone. When no one is watching, does she refrain from snatching because she fears the clamp, or because she feels the wrongness of it?

  Wu: She refrains because she has become the kind of person for whom snatching is unthinkable. Whether that comes from a sprout or a stamp does not change the action. But you are afraid that if I am right, she becomes a hypocrite. I am afraid that if you are right, she becomes a tyrant of her own feelings. You want him to trust her impulses. I say he must trust the ritual more than the impulse.

  Chen: I want him to trust the impulses that point toward connection, like the cup. And distrust the impulses that point toward isolation, like the toy. But how does he know which is which? Only by the ritual. So we come back to this: the ritual is necessary for both of us.

  Wu: Yes. But for me, the ritual is the source of the light. For you, it is merely the lens.

  Chen: And if the lens is cracked? If the ritual is wrong? If I teach her a ritual that demands she yield when she should stand firm? If her nature is only raw material, she will follow the ritual into evil. If her nature contains the sprout of righteousness, she may feel the dissonance. She may feel shame. That feeling is the only safeguard we have against a corrupt world.

  Wu: Then you rely on a feeling that is, by your own admission, faint and easily crushed. I rely on the accumulated wisdom of those who steamed the wood before us. You bet on the seed; I bet on the farmer.

  Chen: And I say the farmer cannot grow wheat from stone.

  Wu: And I say the seed cannot grow without the farmer. So he must work. That is all we tell him. Work.

  Chen: But work with what expectation? That he is uncovering a person, or manufacturing one?

  Wu: Does it matter, if the person stands?

  Chen: It matters to her. When she offers the cup next time, does she think, "I am doing what I was made to do," or "I am doing what I was taught to do"?

  Wu: She will think, "I am doing what is done." And in that, she will be safe.

  Chen: And in that, she may be silent.

  Wu: Better silent than lost.

  Chen: Better lost than hollow.

  Wu: Then let us watch her. She is reaching for the toy again.

  Chen: Watch her face.

  Wu: Watch her hands.

  Chen: If she hesitates...

  Wu: If she yields...

  Chen: ...then the sprout is there.

  Wu: ...then the training has held.

  Chen: We will see.

  Wu: We will see.
