answer: |-
  1. Print 28 slips (two per person) and bring pens, reserving the first 5 minutes for handing out materials and the last 10 for the board work. You need a whiteboard divided into three clear columns labeled "Knew," "On Purpose," and "To Blame" ready before students arrive.
  2. Hand out slips with two scenarios about a student council president changing a policy that either hurts or helps a specific club, keeping the foreknowledge identical. Ask students to answer privately without talking, then collect the slips immediately to prevent discussion.
  3. Distribute the second slip featuring the philosophy club itself voting on a rule versus a bot auto-enforcing it, then ask everyone to flip the paper and predict the group's average answers before collecting them. This forces them to commit to a hypothesis about collective versus individual intent before seeing the data.
  4. Tally the yes/no counts live on the board to reveal that "Knew" stays consistent while "On Purpose" and "To Blame" shift drastically based on harm versus help. Reveal this is the Knobe Effect and ask if we are measuring intention or just secretly rating moral blame three times.
  5. Students will likely discuss answers early, so fix this by demanding strict silence and holding the slips until everyone stops talking. The activity cannot show whether this bias is actually rational or just a bug in our psychology, only that the bias exists.
