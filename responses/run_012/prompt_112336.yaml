  ### Brainstorming Candidate Scenarios

  Before settling on the final case, I considered two other configurations that ultimately failed to meet the constraints. First, I examined a **traffic regulation case**, where a municipality chooses between a signal timing that causes minor delays for thousands versus a higher accident risk for one. I rejected this because 'delay' is often construed as mere inconvenience rather than a genuine harm, making it too easy for View B to dismiss the aggregation without engaging the lexical threshold properly. Second, I sketched a **vaccination programme**, where a policy prevents one severe disease case but causes minor allergic reactions in many. I discarded this because it introduces probabilistic risk rather than deterministic harm, complicating the aggregation with expected utility calculations that distract from the core lexical question.

  I have settled on a **municipal water authority case**. It allows for a fixed, modest population, deterministic harms, and a clean engineering variable (chemical formulation) that toggles the noticeability of the side effects without altering the institutional setting or the magnitude of the large harm.

  ### The Scenario

  A regional water authority serves exactly 2,000 households and must decide whether to continue using a corrosion inhibitor, Compound Z, to prevent pipe degradation. If the authority stops using Compound Z, known leakage will contaminate the supply to one specific household, causing a resident with a rare susceptibility to suffer severe lead poisoning, resulting in permanent neurological damage and chronic pain. If the authority continues using Compound Z, the lead poisoning is prevented, but all 2,000 residents will suffer side effects from the compound; the magnitude of total side-effect harm is calibrated to exceed the disutility of the single resident's lead poisoning. The authority can choose between two formulations: Formulation Alpha causes sub-threshold harm, defined as real physiological cellular stress that is undetectable by the bearer without medical instrumentation; Formulation Beta causes supra-threshold harm, defined as noticeable daily headaches and fatigue of equivalent total magnitude. The authority must choose whether to ban Compound Z (accepting the lead poisoning) or permit it (accepting the side effects), and the only variable changing between deliberations is whether Formulation Alpha or Formulation Beta is available.

  ***

  ### Analysis

  **(a) Verdicts for View A and View B**
  For **View A (totalist aggregation)**, the agent ought to permit Compound Z in both the Alpha and Beta cases. Since View A holds that harms are commensurable and add up across persons, the noticeability of the harm is irrelevant; only the magnitude matters. Given the stipulation that the total magnitude of the 2,000 small harms exceeds the magnitude of the single large harm in both formulations, the total badness of permitting the compound is less than the total badness of banning it. Therefore, View A mandates preventing the greater total harm, which means allowing the side effects to spare the one resident from lead poisoning.

  For **View B (lexical priority)**, the verdict depends on the formulation. In the **Alpha (sub-threshold)** case, the agent ought to ban Compound Z. View B holds that harms below a threshold of seriousness can never outweigh a single harm above it, regardless of quantity. Since the cellular stress is sub-threshold (unnoticeable), it falls below the lexical threshold, whilst the lead poisoning is plainly above it; thus, the many small harms cannot justify imposing the one large harm. In the **Beta (supra-threshold)** case, the agent ought to permit Compound Z. Here, the headaches and fatigue are noticeable and sufficiently serious to cross the lexical threshold of triviality. Since these harms are now lexically comparable to the lead poisoning, they can be aggregated, and because their total magnitude exceeds the single large harm, View B aligns with View A in permitting the compound.

  **(b) The Working Feature**
  The feature doing the work is the **phenomenological noticeability** of the small harms borne by the 2,000 residents. This is the single variable that flips the verdict for View B whilst leaving View A unchanged. It is not a stipulation about the correctness of the views, but a factual feature of the available chemical formulations (Alpha versus Beta) which determines whether the harm enters the conscious experience of the bearers.

  **(c) Removal or Reversal of the Feature**
  If this feature is removed—meaning all small harms are made supra-threshold (noticeable)—the case collapses back into a standard aggregation puzzle where both views likely agree (assuming the small harms are serious enough to cross the lexical threshold). If the feature is reversed so that all small harms are sub-threshold, the case becomes one of permanent divergence: View A continues to demand aggregation, whilst View B permanently forbids it. The case does not become incoherent, but it loses its diagnostic power to distinguish the views if the variable is fixed. The case relies on the assumption that View B treats noticeability as a proxy for the lexical threshold of seriousness; if one assumes a lexical view where unnoticeable physiological damage counts as 'serious', the divergence in the Alpha case disappears.

  **(d) The Strongest Objection**
  A defender of **View B** would attack the case by challenging the alignment of noticeability with lexical seriousness. They would argue that the lexical threshold should track objective welfare loss, not conscious experience. If the sub-threshold cellular stress in Formulation Alpha genuinely degrades health and reduces life expectancy (even if unnoticed), a sophisticated lexical theorist might claim these harms are still 'serious' enough to cross the threshold, or conversely, that noticeable headaches are still too trivial to outweigh neurological damage. They would argue that the case smuggles in a hedonistic assumption—that unnoticeable harms are lexically inferior—which is not inherent to lexical priority itself. The case survives this only if we accept the stipulation that 'seriousness' for View B is tied to the capacity for conscious suffering, but this reveals a vulnerability in View B: it must explain why unnoticed biological damage is lexically negligible compared to noticed pain.

  **(e) The Distinction's Normative Work**
  The sub-threshold/supra-threshold distinction is doing genuine normative work here, rather than merely redescribing the original puzzle. In the classic 'dust specks' case, the divergence relies on multiplying the population to astronomical numbers to force the totalist intuition. Here, the divergence is forced by the *quality* of the harm (noticeable versus unnoticed) within a modest population. This isolates the structural difference between the views: View A is insensitive to the distribution of harm across consciousness, whilst View B is sensitive to the qualitative status of the harm bearer's experience. It forces View B to clarify whether its lexical threshold protects *persons* from suffering or *biology* from damage, which is a substantive philosophical contribution rather than a rhetorical restatement.
