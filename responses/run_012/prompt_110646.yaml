answer: |-
  The shop smells of cutting fluid and old dust, the way it did when he was alive. It is March again, a year later, and the light coming through the high windows is the same grey wash that filled the garage on the morning we found him. He was a tool-and-die maker, which means he spent his life making the things that make the things. Precision was the religion. Tolerance was the prayer.

  My daughter, Elara, is fourteen. She stands by the workbench, her arms crossed over a hoodie that used to be his. She has decided the shop belongs to her now. She has been asking for a story about the two machines since the week after the funeral. She doesn't want a eulogy. She wants to know how they work.

  "They're the same," she says, looking at the brass frames.

  "Not quite," I say.

  We have spent the afternoon cleaning them. I handed her the rag and the oil, and she worked in silence, polishing the oxidation from the gears until they shone like gold coins. It is only now, with the grime gone, that the difference is visible.

  Machine One has a lever that trips a contact and stays there. It is a latch. A detent clicks into a notch, holding the lever in place until the motor pulls it back. It is bistable. It remembers where it was put.

  Machine Two is identical, except for the lever. Here, the lever is held against a heavy coil spring. The motor pulls it, the contact closes, but the instant the motor lets go, the spring snaps the lever back. It is monostable. It remembers nothing. It only knows the pressure of the hand that pushes it.

  Taped to the frame of Machine One is a card in his block capitals. It explains the gearing. The motor pulls the lever at one minute before midnight. Then thirty seconds before. Then fifteen. Then seven and a half. It halves the interval each time. The card says the lever is pulled infinitely many times in the last minute of the day. Beneath that, in pencil: *Lit at midnight?*

  I sat with it two evenings running before I brought Elara in. I did a term of philosophy before I dropped out. I know the shape of the puzzle. It is a trap for the mind. But the card is not the machine. The card is paper. The machine is brass.

  "Set them up," Elara says.

  We plug them in. The shop is quiet. Outside, the town is settling into the usual Tuesday night silence; the factory shift ended at six, the trains run hourly, the people who work with their hands are asleep or washing the grease from under their fingernails. Inside, the only sound is the hum of the transformers in the walls.

  I align the dials. Both clocks read 11:58.

  "What happens?" Elara asks.

  "We watch."

  At 11:59, the first click happens. Simultaneously, both bulbs flare white. The levers snap. Machine One's lever stays forward. Machine Two's lever is pulled forward, then instantly snaps back as the cam passes. The light on Machine Two flickers off.

  "Wait," Elara says. "It went out."

  "It will come back," I say.

  Thirty seconds later, they click again. Both lights flare. Machine One stays lit. Machine Two flickers off again.

  "It's blinking," she says.

  "Faster," I say.

  As the minute progresses, the rhythm accelerates. The distinct clicks blur into a rattle. The light from the filaments stops looking like flashes and starts looking like a steady, vibrating glow. The sound rises in pitch, a whine of gearing straining against time.

  Elara leans in. "They're doing the same thing."

  "Look at the levers."

  Machine One's lever is a blur, shaking in its bracket. But it is shaking around a fixed point. It is being thrown back and forth, caught by the detent at each extreme. It is fighting to decide.

  Machine Two's lever is also a blur. But I can see the spring vibrating. The lever isn't fighting to stay; it is fighting to return. Every micro-movement is a battle between the motor's torque and the spring's tension. The motor pushes, the spring resists. The contact is made only when the motor wins.

  The whine becomes a scream. The air smells of ozone. The light is so steady it hurts to look at.

  11:59:59.

  The sound cuts off.

  The silence is heavy. It rushes into the shop like water.

  Machine Two is dark. The bulb is black, cold glass. The lever is pulled back against its stop, held there by the spring. The motor is idle. No force is being applied. The contact is open.

  Machine One is lit.

  The bulb glows with a steady, warm yellow filament. The lever is not in the middle. It is not vibrating. It is thrown forward, locked into the detent. The motor is idle. The lever is not being held by force; it is being held by geometry. The notch in the brass catches the catch on the lever. It has nowhere to go.

  Elara stares at the light. Then she looks at the dark machine. Then back at the light.

  "Why?" she asks.

  I don't tell her about infinity. I don't tell her about convergent series or supertasks. I walk around the bench and stand beside her.

  "Touch them," I say.

  She reaches out. Her fingers hover over Machine Two. She touches the lever.

  "it's tight," she says. "It wants to move."

  "The spring," I say. "To be on, that machine needs to be pushed. At midnight, the pushing stops. So it goes back to where it started."

  She moves her hand to Machine One. She touches the lever. It is still. It does not fight her. It is solid, like a door latch.

  "This one doesn't want to move," she says.

  "No. It stays where it was put."

  "But it was put in a lot of places."

  "It was," I say. "But it can't be in all of them. It has to be in one."

  She looks at the bulb. "So it's on."

  "It is."

  "Is that the answer?"

  I look at the card. *Lit at midnight?* The question assumes the machine is a idea. But the machine is a thing. Ideas can be undecided. Things have to be somewhere.

  "Watch the bulb," I say.

  We wait. The filament cools slowly, fading from yellow to orange, then to a dull red, then to black. It takes nearly a minute. Machine Two's bulb was already cold.

  "Why did he build two?" Elara asks.

  "Because one tells you what the math says. The other tells you what the metal says."

  Elara reaches out again. She doesn't touch the lever this time. She rests her palm on the brass frame of Machine One. She closes her eyes.

  "It's warm," she says.

  "The current passed through it," I say.

  "No," she says. She opens her eyes and looks at me. "The frame. The bulb is cold now. But the frame is warm."

  I place my hand on the frame. She is right. The brass holds the heat. It absorbed the vibration, the friction of the detent clicking, the resistance of the coil. Machine Two's frame is cool. The spring returned the energy; it gave it back to the air. Machine One kept it. The latch absorbed the shock of every change and held it in the metal.

  "The card says the intervals get smaller," Elara says. "Seven and a half seconds. Then three. Then one."

  "Yes."

  "So it gets faster."

  "Yes."

  "So the lever hits the detent harder."

  I nod. "Friction."

  "Every time it clicked, it made heat. And the latch held the heat."

  "And the spring machine?"

  "It gave it back."

  Elara takes her hand off the frame. She looks at the dark bulb, then at the warm brass. She understands. The puzzle on the card is about time. The puzzle in the shop is about matter. Time can be divided forever. Matter cannot. The metal has a grain. The switch has a travel. The detent has a depth.

  At some point, before the math reached the end, the metal reached its limit. The last click that physically happened was an 'On' click. The detent caught it. The spring machine let it slip away because it required constant force to hold a moment that had already passed.

  Machine One didn't solve the infinity. It outlasted it.

  "Can I keep it?" Elara asks.

  "The shop is yours," I say.

  "Not the shop. The machine. The one that stays."

  I look at the brass frame. The filament is dark now, but the heat remains under my palm. It is a small, contained warmth in the cold garage. It is not a ghost. It is not a trick. It is the residue of work.

  "You can have it," I say.

  Elara picks up the rag. She begins to polish the frame again, not to clean it, but to feel it. She rubs the brass in circles. She is checking the temperature. She is checking the latch. She is verifying that the world is solid, that when the motion stops, the thing remains where it was left.

  I turn off the shop lights. The only illumination comes from the streetlamps outside, casting long shadows across the benches. In the dark, the brass of Machine One still holds the day's heat. I can feel it radiating against my hand as I walk to the door.

  Elara is still at the bench. I hear the soft *click* of the lever. She throws it. She lets it snap back. She throws it again. She is testing the catch. She is making sure it holds.

  "Goodnight," I say from the door.

  "Night," she says. She doesn't turn around. She is listening to the sound of the metal settling into the notch.

  I close the door. The lock engages with a solid, mechanical thud. It stays where it is put. I put my hand on the knob and feel the vibration of the latch settling into the strike plate. It is warm from my grip. It is not infinite. It is not undecided. It is closed.

  I walk to the house. The air is cold, but my hand is warm. I keep it in my pocket, holding the heat, carrying the weight of the brass into the dark.
