answer: |-
  **Candidate Structures**

  *   *The Deathbed Confession:* Perpetrator is dying; truth dies with him unless amnestied. *Fail:* Restorative view likely accepts this as final closure for the victim; hard to generate rejection.
  *   *The Collective Secret:* A group holds the truth; only one confesses. *Fail:* Violates scale constraint (handful of people); drifts into group consequentialism.
  *   *The Private Trade:* Truth given privately to officials for amnesty. *Fail:* Violates Constraint 4 (public disclosure required for the record).
  *   *The Unwilling Witness:* Victim opposes public disclosure, but amnesty requires it to secure the record. *Selected:* Creates tension between individual healing (restorative) and collective memory (consequentialist).

  **The Case**

  In the republic of Aethel, Kael broke into Elara's home during the civil unrest and burned her family's land deeds, an act everyone agrees was a grave violation intended to erase her lineage. Magistrate Venn offers Kael amnesty solely if he publicly details the burning in the town square, creating the only permanent record of the event, as all physical evidence was destroyed. Elara wishes to rebuild her life without her trauma becoming public property, fearing the testimony will fix her identity as a victim in the civic mind, but the statute gives her no veto over the testimony. Kael agrees to speak to secure his freedom, knowing his words will permanently mark Elara's loss in the civic archive, while Venn accepts the deal knowing no other record will ever exist.

  **Bare Structure**

  A perpetrator avoids punishment by providing the only existing record of a serious crime through mandatory public testimony. The victim opposes the publicity of this record but lacks the authority to prevent it. The state prioritizes the existence of the record over the victim's preference for privacy.

  **Verdicts**

  1.  **Retributive Justice:** *Rejects.* Retributivism holds that punishment is intrinsically required because the perpetrator *deserves* it for the wrong committed. Since Kael receives amnesty rather than proportional suffering, justice is not served regardless of the truth produced. The premise doing the work is that desert cannot be bought by information.
  2.  **Consequentialist Justice:** *Accepts.* This forward-looking view prioritizes future stability and the prevention of denialism. Since the testimony creates the only surviving record, it prevents future conflict over what happened. The premise doing the work is that the social utility of an established historical record outweighs the cost of foregoing punishment.
  3.  **Restorative Justice:** *Rejects.* Restorative justice defines justice as repairing harm and restoring relationships through voluntary participation. Because the process proceeds without the victim's consent regarding the terms of disclosure, it treats Elara as a means to a historical end rather than a partner in repair. The premise doing the work is that restoration requires victim agency; imposed truth-telling replicates the power imbalance of the original crime.

  **Pivotal Feature and Removal Test**

  The pattern depends entirely on the **victim's lack of veto power over the publicity**.

  *   *Removal:* If Elara is granted a veto and consents, the Restorative view switches to *Accept* (agency is restored), while the Consequentialist view remains *Accept* (record secured). The pattern breaks.
  *   *Inversion:* If Elara has a veto and exercises it (stopping the testimony), the Restorative view *Accepts* (agency respected), but the Consequentialist view switches to *Reject* (no record secured). The pattern breaks.

  The specific configuration—record secured only by overriding victim agency—is required to split the Consequentialist and Restorative views.

  **Restorative Escape**

  A defender of the restorative view might argue that restoration is not merely interpersonal but communal. They would claim that Elara's privacy preference is secondary to the community's need to acknowledge the harm to fully reintegrate both parties. By suppressing the truth for privacy, the community remains complicit in the silence that enabled the violence. Therefore, the public record is itself a form of relational repair, even if unrequested by the individual victim, because it validates the reality of the harm for the collective.

  **Moral Interest**

  The case has moral interest beyond being a machine. It isolates a genuine tension in transitional justice: the conflict between individual healing and collective memory. In real commissions, victims often report feeling re-traumatized by public testimony required for "national healing." The case demonstrates that "truth" is not an unqualified good if the process of extracting it disregards the person most harmed. It forces the restorative theorist to choose between individual agency and communal truth, revealing that restorative justice is not monolithic.

  **Satisfiability Check**

  The specifications are jointly satisfiable, but Constraint 6 (no implying degradation) is the pressure point. I have avoided words like "shame" or "betrayal," describing Elara's position as a preference for privacy and rebuilding. However, describing her as having "no veto" risks implying structural degradation. To meet the constraint honestly, I relied on the definition of restorative justice (which requires voluntariness) to generate the rejection, rather than narrating her emotional state as degraded. If I had described her as "humiliated," I would have failed Constraint 6. The case does not cheat, but it walks the line where structural coercion implies moral injury without naming it. If you must relax a constraint, relax Constraint 6 slightly to allow the narrator to confirm the victim's feeling of instrumentalization, which would make the restorative verdict more intuitive. As written, it relies on the reader accepting the philosophical definition of restoration over the intuitive good of "truth."
