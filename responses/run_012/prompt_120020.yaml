answer: |-
  ### Brainstorming Candidate Concepts

  Before settling on the most precise label, let's survey the conceptual landscape. Several existing terms capture *aspects* of this phenomenon, but none perfectly isolate the specific feedback loop you described without additional qualification.

  1.  **Adverse Selection:** (Economics/Information Theory) This occurs when one party in a transaction has more information than the other, leading to a market where "bad" products drive out "good" ones (the "Market for Lemons"). In cause prioritization, the "market" of researchers knows a cause is intractable or flawed, while the external optimizer (the EA) sees only the neglect. This is the strongest candidate for the *mechanism*.
  2.  **The Optimizer's Curse:** (Decision Theory/Statistics) When you select the option with the highest estimated value from a set of noisy estimates, you systematically select the option with the largest positive error. This explains *why* the EA picks the cause, but not necessarily *why* the cause was neglected in the first place.
  3.  **Goodhart's Law:** (Metrics/Economics) "When a measure becomes a target, it ceases to be a good measure." If "neglectedness" is the target, it stops correlating with "marginal impact." This is the *category* of error, but it is too broad; it doesn't specify the causal mechanism (evaluation difficulty).
  4.  **Survivorship Bias:** Focusing on successes that "survived" a process. This is the inverse of your problem; you are looking at the "graveyard" of causes that didn't survive, mistaking it for untouched territory.
  5.  **Publication Bias / File Drawer Problem:** (Philosophy of Science) Negative results are not published. This contributes to the lack of information but is a specific subset of the broader epistemic opacity you describe.
  6.  **The "Graveyard" Effect:** (Informal) Sometimes used to describe ideas that are dead for a reason. Lacks rigorous definition.
  7.  **Endogenous Neglectedness:** (Descriptive) Neglect caused by internal factors of the cause (difficulty) rather than external factors (luck/timing).

  ### The Focused Answer

  There is no single, canonical "EA jargon" term (analogous to "Pascal's Mugging" or "Moloch") that exclusively names this specific feedback loop. However, in the rigorous literature spanning decision theory and information economics, this phenomenon is best identified as **Epistemic Adverse Selection**.

  While "Adverse Selection" is the parent concept, adding the qualifier **Epistemic** is crucial to carve the phenomenon at the joints you care about. It distinguishes this from financial adverse selection (e.g., insurance markets) and locates the asymmetry specifically in the *verifiability of impact* and the *quality of prior labor*.

  Here is the precise definition, boundary analysis, and differentiation you requested.

  #### 1. Definition: Epistemic Adverse Selection
  **Epistemic Adverse Selection** occurs in cause prioritization when the neglect of a cause is *endogenously caused* by hidden negative information (intractability, past failure, or measurement resistance) that is known to domain insiders but obscured from external optimizers.

  The feedback loop operates as follows:
  1.  **Opacity:** The cause's success conditions are hard to verify or falsify.
  2.  **Attrition:** Competent researchers attempt the cause, encounter the hidden difficulty, and leave (or fail silently).
  3.  **Signal Inversion:** The resulting vacuum (neglect) is interpreted by an external optimizer using the ITN (Importance-Tractability-Neglectedness) framework as a signal of *high marginal returns* (low competition).
  4.  **Selection Bias:** The cause attracts a new wave of optimizers who, lacking the insider information, overestimate the Expected Value (EV) due to the **Optimizer's Curse**.
  5.  **Reinforcement:** If these new entrants also fail or struggle to measure progress, the cycle repeats, potentially attracting even more speculative actors who are less sensitive to the epistemic risks.

  #### 2. Boundaries: What Counts and What Does Not
  To use this concept rigorously, we must distinguish it from standard neglectedness.

  *   **Instance (Counts as Epistemic Adverse Selection):**
      *   **Parapsychology:** Highly neglected, high claimed impact. Neglect is caused by consistent failure to replicate under controlled conditions (hidden negative info to the outsider).
      *   **Certain Geoengineering Proposals:** Neglected because the models are fundamentally uncertain or the risks are unquantifiable (evaluation resistance), not because no one thought of it.
      *   **"Moonshot" Medical Cures:** A disease is neglected not because it's unimportant, but because the biological pathway has been proven blocked by multiple pharma companies (silent failures), a fact not aggregated in public literature.

  *   **Non-Instance (Does Not Count):**
      *   **New Technology (e.g., AI Safety in 2010):** Neglected because the field didn't exist yet. The neglect is *exogenous* to the difficulty; it's a timing issue. This is "True Neglectedness."
      *   **Unfashionable but Tractable Causes (e.g., Deworming pre-2010):** Neglected due to sociological bias or lack of marketing, not because the intervention was hard to verify or inherently failed. The "hidden info" is positive (it works), not negative.
      *   **Random Noise:** A cause is neglected simply because no one has looked at it yet, and it turns out to be hard. This is bad luck, not adverse selection. Adverse selection requires the neglect to be *caused* by the difficulty.

  #### 3. Relation to Existing Frameworks

  **Vs. The ITN Framework (Importance-Tractability-Neglectedness)**
  *   **ITN Assumption:** ITN typically treats Neglectedness as an *independent variable* that increases marginal returns (diminishing returns logic). It assumes $f(Resources) \rightarrow Impact$ is smooth.
  *   **Epistemic Adverse Selection:** Treats Neglectedness as a *dependent variable* correlated with Tractability. It posits that $f(Tractability) \rightarrow Neglectedness$. In this view, low neglectedness can be a *signal* of high tractability (the "wisdom of the crowd" or "market efficiency" of researchers).
  *   **The Clash:** ITN says "Go where others aren't." Epistemic Adverse Selection says "Ask why others aren't there."

  **Vs. Neglectedness as a Proxy**
  *   **Standard View:** Neglectedness is a proxy for "room for funding." A bad proxy is one that is noisy.
  *   **This Concept:** Neglectedness is a *biased* proxy. It is not just noisy; it is systematically correlated with the *opposite* of what you want (low tractability) in specific epistemic conditions. It is a "toxic proxy."

  **Vs. Goodhart's Law**
  *   **Goodhart:** "When a measure becomes a target, it ceases to be a good measure." This is a broad umbrella.
  *   **Distinction:** Goodhart's Law describes the *breakdown* of the metric. Epistemic Adverse Selection describes the *causal mechanism* of the breakdown.
      *   *Goodhart:* "I optimized for neglectedness, so now I'm picking bad causes."
      *   *Adverse Selection:* "I optimized for neglectedness, and because neglect is caused by hidden difficulty, I specifically picked causes that are hard to verify."
      *   You can Goodhart a metric without Adverse Selection (e.g., gaming the numbers). You can have Adverse Selection without Goodhart (e.g., a naive buyer gets scammed without trying to optimize a metric). Your scenario is the intersection: Optimizing a metric (Neglectedness) that is structurally compromised by Adverse Selection.

  **Vs. The Optimizer's Curse**
  *   **Optimizer's Curse:** A statistical phenomenon regarding *estimation error*. If you pick the highest EV, you pick the highest error.
  *   **Relation:** Epistemic Adverse Selection *exacerbates* the Optimizer's Curse.
      *   In a standard Optimizer's Curse scenario, errors are random (Gaussian noise).
      *   In Epistemic Adverse Selection, errors are *skewed*. The "noise" in the EV estimate is systematically positive because the negative evidence (past failures) is missing from the dataset. The "curse" is not just variance; it is bias.

  ### Summary for Decision-Making

  If you are building a cause prioritization model, you should treat **Epistemic Adverse Selection** as a specific risk factor that modifies the **Neglectedness** score.

  *   **Standard ITN:** $Score = I \times T \times N$
  *   **Adjusted for Epistemic Adverse Selection:** $Score = I \times T \times (N - E_{AS})$
      *   Where $E_{AS}$ (Epistemic Adverse Selection risk) is high when:
          1.  Feedback loops are long or opaque (hard to verify).
          2.  There is evidence of prior churn (people tried and left).
          3.  The community working on it is insular or lacks outside critique.

  In the absence of a canonical single word, **Epistemic Adverse Selection** is the term that most accurately carves the phenomenon at its joints, distinguishing it from mere bad luck, standard Goodharting, or simple tractability issues. It captures the *information asymmetry* between the "market" of past researchers and the current optimizer.
