answer: |-
  **Brainstorming Notes**
  Long-run doom forecasts survive falsification by manipulating the *ceteris paribus* clause: when technology delays collapse, the theorist claims "all else" wasn't equal, rather than the theory being wrong. This turns prediction into accommodation; the theory absorbs the anomaly via auxiliary hypotheses (e.g., "the Green Revolution was merely a temporal buffer"). In finance, this looks like rolling a losing position indefinitely. The core epistemic sin is unfalsifiability: if the payout date is always movable, the claim "population outruns subsistence" is never tested, only deferred. The satire must treat this deferral as a contractual feature, framing the inability to be proven wrong as risk mitigation.

  ***

  **MALTHUS CAPITAL LLP – PROSPECTUS FOR SERIES Ω (OMEGA) FUND**
  **Investment Vehicle: Long-Horizon Subsistence Arbitrage**

  **1. INVESTMENT THESIS**
  Malthus Capital operates on the principle of Asymptotic Scarcity. While short-term data may suggest decoupling between population growth and resource constraints, historical vectors confirm convergence over sufficient timeframes. The Fund sells famine options: long-dated contracts that pay out if global population exceeds carrying capacity by a margin of 15% or greater. Investors are not betting on *if*, but *when*. Our model assumes that technological interventions are merely delay mechanisms, not refutations.

  **2. DEFINITION OF TRIGGERS**
  Payouts are contingent upon the "Malthusian Crossover Event." Triggers are defined as follows:

  | Trigger Class | Condition | Payout Multiplier |
  | :--- | :--- | :--- |
  | **Type I (Hard)** | Global caloric availability drops below 2,000 kcal/capita/day. | 10x |
  | **Type II (Soft)** | Caloric availability remains stable, but relative deprivation indices exceed historical variance by 3σ. | 5x |
  | **Type III (Theoretical)** | Carrying capacity is breached, but offset by non-sustainable resource depletion (e.g., aquifer drainage). | 2x |

  **3. TEMPORAL RESCUE CLAUSE (SECTION 8.4)**
  In the event that a Crossover Event fails to materialize by the Contract Expiry Date, the Fund reserves the right to invoke an **Eschatological Rollover**. Upon invocation, the Expiry Date shall be extended by a period of 50 years (one "Generational Epoch"). This is not considered a default or a modification of terms, but a **Horizon-Shifting Adjustment**.

  *   **3.4.1 Auxiliary Hypotheses:** The Fund may introduce auxiliary hypotheses to explain delayed payouts (e.g., "Synthetic nitrogen fixation temporarily inflated carrying capacity"). Such hypotheses shall be binding on all Limited Partners and cannot be used to void the contract.
  *   **3.4.2 Identity Preservation:** A prediction extended via Eschatological Rollover retains the same epistemic identity as the original prediction. A theory delayed is not a theory denied.

  **4. DEFINITION OF SUBSISTENCE**
  "Subsistence" is not a fixed biological constant but a dynamic variable relative to expectation. Should agricultural technology raise the baseline of subsistence, the Trigger Threshold shall adjust upward to maintain the *pressure differential* between population and resources. This ensures the fundamental scarcity thesis remains valid regardless of productivity gains. Essentially, if everyone eats more, the famine threshold moves to where everyone eats less than they expect.

  **5. RISK FACTORS**
  *   **Unfalsifiability Risk:** The Fund's core thesis is structured such that no observable data can permanently invalidate the investment premise. While this protects against short-term volatility, it exposes investors to the possibility that the Fund is logically insulated from reality rather than predictive of it.
  *   **Tautology Risk:** There is a risk that "Long-Run" is defined post-hoc as "whatever duration is required for the prediction to manifest." If the collapse never occurs, the Fund may classify the current era as "Pre-Long-Run" indefinitely.
  *   **Epistemic Arbitrage:** Investors acknowledge that the Fund profits from the gap between scientific falsification and theoretical persistence. If the market decides the theory is dead before the Fund does, liquidity may vanish despite the contractual validity of the Rollover.

  **6. ACKNOWLEDGMENT OF "RIGHT BUT EARLY" STATUS**
  By signing, the Limited Partner acknowledges that past failures of the Fund's models are classified as "Timing Errors" rather than "Model Errors." The Partner agrees that being early by 200 years is functionally identical to being correct, provided the Partner's capital remains locked throughout the interim.

  ***

  **Commentary on Satire and Interpretive Liberties**
  This piece caricatures the "Malthusian Cluster" (including neo-Malthusians like Ehrlich) rather than Malthus himself. Malthus actually allowed for "preventive checks" (moral restraint, delayed marriage) that could avert catastrophe without famine, whereas the Fund treats collapse as inevitable. The satire leans on the Lakatosian concept of a "degenerating research programme," where auxiliary hypotheses are added solely to protect the core from falsification. The "Temporal Rescue Clause" exaggerates the "right but early" defense common in climate and resource doomsterism, turning the philosophical problem of unfalsifiability into a binding legal feature. The definition of "subsistence" mocks the moving goalpost problem, where scarcity is redefined relative to desire rather than biological necessity to keep the threat alive.
