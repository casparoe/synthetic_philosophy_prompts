      *   **Introduction:** Set the stage. The painting is the anchor. Mention the Delft explosion, the scarcity, the fragment nature (thick panel), and the red triangle (metaphysical tag).
      *   **The Goodman Problem:** Address autographic vs. allographic. Why do we care about the painting's matter but not the novel's manuscript? The novel tries to bridge this by making the *reading* of the painting (Theo's viewing) the autographic element.
