  7.  **Final Polish:** (Mental walk-through of the argument). The core tension is between *Institutional Authenticity* (Provenance, Museum, Red Triangle) and *Experiential Authenticity* (Theo's grief, the vision). The novel ultimately privileges the latter, which philosophy often ignores. Hobie represents ethical craft; Theo represents unethical craft for a sacred end. The fakes fund the real. That's the paradox.

