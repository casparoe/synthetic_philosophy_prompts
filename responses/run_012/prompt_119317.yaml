          4.  *The Ending (Amsterdam Return/Epilogue):* Theo's realization.
      *   **Resistance to Philosophy:** Philosophy (Goodman/Brandi) is cold. It talks about provenance and material integrity. Theo's connection is emotional/mystical. The painting isn't valuable because it's a Fabritius; it's valuable because it's the last thing his mother saw. The novel argues for a *personal* authenticity over an *institutional* one.
      *   **Conclusion:** What does the book add? It adds *time* and *suffering*. Philosophy categorizes; literature experiences. The "fake" life Theo leads is the cost of keeping the "real" thing safe.

