prompt: |-
  I'm teaching a seminar on authenticity and I want to put Donna Tartt's The Goldfinch next to the philosophy of forgery — I cant decide whether the novel is a friend or an enemy of the theory, so read it through that lens for me. The setup is almost too neat: a real painting, Fabritius's chained goldfinch, trompe-l'oeil flat and exact, and the painter died when the Delft powder magazine blew up in 1654 and took most of his work with him, so the picture Theo carries out of the bombing is one of the few Fabritiuses left. Two details I want worked in: there's a small red triangle on the back of the panel, painted on in 1938 as the war loomed, to mark the picture irreplaceable — a museum's little act of metaphysics; and the panel is oddly thick, probably cut from something bigger, so the original is already a fragment. The rest of the book, meanwhile, is a trade in second-hand goods — Hobie's shop, restoring and patching old things, and Theo keeping it afloat by selling fake antiques. So what does the novel think the difference is between the stolen original and the fakes? Bring in why we care about the original of a painting but not the original of a novel (Goodman's autographic/allographic split — does the novel get past it?), the relic psychology (people won't wear a cleaned sweater that belonged to a murderer but would pay a fortune for one that belonged to someone they admire), and restoration as licensed forgery — Brandi's rule from the 60s, roughly: restore the work's unity if you can, but never falsify its history, and make the repair visible so nobody's fooled. Does Tartt treat the restorer and the forger as the same person with different paperwork? Point me to three or four scenes that carry the weight (no quoting, just describe them), say where the novel resists the philosophy — my suspicion is that the ending does something about why the painting matters to Theo that the literature has no slot for — and finish with what the book adds that argument alone doesnt.
