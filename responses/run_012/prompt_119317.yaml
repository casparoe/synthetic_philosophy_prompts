      *   *Relic Psychology:* Essentialism. The physical matter holds the "aura" (Benjamin) or essence of the creator/event. The red triangle is a bureaucratic attempt to codify this aura.
      *   *Brandi (Theory of Restoration):* Restoration should aim for potential unity but must not falsify history. "Fake" restoration hides the crack; "True" restoration reveals it.
