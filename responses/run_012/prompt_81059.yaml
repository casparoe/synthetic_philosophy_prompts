answer: |-
  The general result you have been told is known as **Good's Theorem** (after I.J. Good, 1967). In Bayesian decision theory, it states that the expected utility of making a decision with access to free, relevant information is always greater than or equal to the expected utility of making the decision without it.

  You are correct that your cases are counterexamples, but they are not counterexamples to the mathematics of the theorem. They are counterexamples to the **background assumptions** required for the theorem to hold. The "boundary" you are looking for is not a single line, but a set of distinct structural conditions. Your three cases are not one phenomenon; they are a family of three distinct violations of the standard model.

  Here is the boundary of the concept, defined by the assumptions your cases violate.

  ### 1. The Standard Model (The Territory)
  For Good's Theorem to hold, the decision problem must satisfy four key conditions:
  1.  **Consequentialism:** Utility depends only on the final state of the world and the action taken, not on the beliefs held along the way.
  2.  **Agency (The Option to Ignore):** Acquiring information does not restrict the set of available actions. You can always choose to act as if you hadn't learned the information.
  3.  **Fixed Payoff Structure:** The consequences of actions (the payoff matrix) do not change depending on what you know or what others know you know.
  4.  **Single Agent (against Nature):** The "state of the world" is not strategically manipulated by other agents who react to your information.

  Your cases violate conditions 3, 2, and 1, respectively.

  ### 2. Analysis of Your Cases (The Boundaries)

  **Case 1: The Insurance Market (Violation of Fixed Payoff Structure / Strategic Interaction)**
  *   **The Violation:** This case violates the assumption that the payoff structure is fixed. In the standard model, learning a fact changes your *belief* about the world, but it does not change the *rules* of the world.
  *   **The Mechanism:** In your insurance case, the information is not private; it alters the equilibrium of a market. When customers learn their risk, the insurer (a strategic agent) adjusts prices or withdraws coverage. The value of the information is negative because it triggers a reaction from others that degrades the terms of trade.
  *   **The Boundary:** This is known as the **Hirshleifer Effect**. Information has negative value when it is **public or semi-public** and alters the distribution of wealth or risk through market equilibrium. Good's Theorem assumes a single agent against nature; it does not hold in game-theoretic settings where information changes the behavior of other players.
  *   **Independence:** This is distinct from the others because the agent's utility function and action space remain standard; the *environment* changes endogenously.

  **Case 2: The Relationship (Violation of Agency / The Option to Ignore)**
  *   **The Violation:** This case violates the assumption that an agent can always ignore information. Standard theory assumes that if you learn $X$, you are free to act as if you didn't know $X$ if that maximizes utility.
  *   **The Mechanism:** Here, knowledge acts as a **constraint on the action space**. The agent feels morally or psychologically bound to act on the knowledge (e.g., "I cannot stay now that I know"). Ignorance functions as a **commitment device**. By remaining ignorant, the agent preserves the option to stay; by learning, that option is foreclosed.
  *   **The Boundary:** This is the domain of **Strategic Ignorance**. Information has negative value when knowledge itself restricts agency. If the utility function includes a penalty for "knowing $X$ and doing $Y$," then acquiring $X$ effectively removes action $Y$ from the feasible set.
  *   **Independence:** This is distinct because the market structure (Case 1) and belief utility (Case 3) are irrelevant. The core issue is the coupling of knowledge and permissible action.

  **Case 3: Utility from Belief (Violation of Consequentialism)**
  *   **The Violation:** This case violates the assumption of consequentialist utility. Standard rational choice assumes $U(Action, State)$. Your case implies $U(Action, State, Belief)$.
  *   **The Mechanism:** If an agent derives utility from hope, anticipation, or self-conception, then the *probability distribution* itself is a good to be consumed. Information sharpens the distribution (reduces entropy). If the agent prefers a diffuse, optimistic distribution to a sharp, accurate one, then information destroys utility directly, regardless of the action taken.
  *   **The Boundary:** This is the domain of **Epistemic Utility** or **Anticipatory Utility**. Good's Theorem assumes information is only instrumentally valuable (a tool for action). If information has **consumption value** (or disvalue), the theorem fails.
  *   **Independence:** This is distinct because the action space and market structure are unchanged. The utility function itself is non-standard relative to the theorem.

  ### 3. What These Cases Are Not

  You asked to distinguish these from two familiar observations. Here is how they differ:

  **Distinct from "Information is Costly"**
  *   **The Familiar Point:** Information costs time, money, or effort. Therefore, net value = (Gross Value of Info) - (Cost). If Cost > Gross Value, you are worse off.
  *   **Your Cases:** You stipulated the information is "freely available." In your cases, the *gross* value of the information is negative. In the cost case, the gross value is positive (or zero), but the net is negative. Your cases show that even at zero marginal cost, the information itself can degrade welfare.

  **Distinct from "News is Unpleasant" (Bad News)**
  *   **The Familiar Point:** Learning you have a terminal illness makes you sad. The *state of the world* is bad.
  *   **Your Cases:** You stipulated the cases do not turn on the news being unpleasant.
      *   In the **Insurance Case**, the risk category is a neutral fact; the welfare loss comes from the *market unraveling*, not the health status.
      *   In the **Relationship Case**, the partner's trait might be neutral; the welfare loss comes from the *loss of the option to stay*.
      *   In the **Belief Case**, the health status might be unchanged; the welfare loss comes from the *loss of hope*.
  *   **The Difference:** Standard theory acknowledges that information can reveal a low-utility state (bad news). Good's Theorem claims that *having the option to know* is never worse than *not having the option*. Your cases show situations where having the option (or exercising it) structurally degrades the situation, independent of the valence of the state revealed.

  ### Summary of the Boundary

  The claim "information cannot have negative value" holds only within a specific **canonical decision problem**.

  1.  **Case 1 (Insurance)** crosses the boundary from **Decision Theory** into **Game Theory**. (Assumption: Fixed Payoffs).
  2.  **Case 2 (Relationship)** crosses the boundary from **Unconstrained Choice** into **Constrained Agency**. (Assumption: Option to Ignore).
  3.  **Case 3 (Belief)** crosses the boundary from **Consequentialism** into **Psychological Utility**. (Assumption: State-Independent Utility).

  They are genuinely independent phenomena. You can have a single-agent, consequentialist problem where information is negative due to commitment constraints (Case 2). You can have a multi-agent problem where agents care only about outcomes, yet information is negative due to market effects (Case 1).

  The "edge of the concept" you are looking for is this: **Information has non-negative value only when it is strictly instrumental, privately held, and does not alter the constraints or preferences of the agent.** Your cases demonstrate that once information becomes constitutive (Case 3), binding (Case 2), or systemic (Case 1), the theorem dissolves.
