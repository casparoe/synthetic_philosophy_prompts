      *Actually, the most precise framing for Case 2 is "Strategic Ignorance as a Commitment Device."* The theorem assumes you maximize utility given beliefs. If your utility function includes "following moral norms triggered by knowledge," then knowledge changes the utility function.

      *Let's stick to the cleanest theoretical violations.*
