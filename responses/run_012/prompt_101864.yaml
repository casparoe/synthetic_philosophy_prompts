prompt: |-
  I am putting together a paper on the ethics and aesthetics of forgery, and before I begin assessing the accounts on offer I want the specification settled. What must a theory of the value of originals — a theory that tells us why, if at all, an authentic work is worth more than a copy of it, and why, if at all, forgery is wrong — actually be able to deliver? Please write me the desiderata: the full list of what any adequate account has to get right. I mean the cases it must handle, the distinctions it must not collapse, the intuitions it must either vindicate or explain away, and any findings it has to remain consistent with. Behind each requirement, give the case or consideration that motivates it, so that I can see which requirements are doing genuine work and which are merely the prejudices of one camp — the collector's, the connoisseur's, or the moralist's. Where you think some subset of the requirements cannot be jointly satisfied, say so plainly; that, to me, is the most interesting part of the exercise.

  To keep this concrete, and to stop it collapsing into the same two or three examples everyone reaches for, I would like the list built around a set of cases I have been collecting. First, invented provenance rather than copied content: a forger who paints an entirely new picture and attributes it to a plausible but wholly fictitious dead artist, so that there is no original for it to be a copy of. Second, a workshop picture: a canvas designed by a master but executed throughout by an assistant, then sold for years as the master's own hand. Third, a self-forgery: an artist who, late in life, makes copies of his own early work and passes them off as the early originals. Fourth, a perfect physical replica, molecule for molecule, produced by a hypothetical replicator, of a painting whose original still exists. Fifth, a forged banknote, where what is counterfeited is not an aesthetic object but a token whose worth is entirely institutional. Sixth, an object made by a later hand but with the original's own tools, materials and workshop, so that it is neither a copy nor the original. Tie each requirement to whichever of these it is needed to handle, and mark which of them you take to be genuine constraints on any account and which are really just the commitments of one tradition. You may close with a brief scorecard of the main families of view — the one that locates value wholly in the aesthetic experience the object affords, the one that locates it in the object's history of production, and the one that treats authenticity as a social or symbolic construction — but keep that short; it is the criteria I am after, not the verdicts.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata:

  1.  **Analyze the Request:**
      *   **Topic:** Ethics and aesthetics of forgery (specifically, the value of originals vs. copies/fakes).
      *   **Task:** Create a list of *desiderata* (requirements) for an adequate theory of the value of originals/authenticity.
      *   **Constraints:**
          *   Must explain *why* an authentic work might be worth more than a copy.
          *   Must explain *why* forgery might be wrong.
          *   Must handle specific cases provided by the user (6 cases).
          *   Must distinguish between genuine constraints and partisan prejudices (collector, connoisseur, moralist).
          *   Must identify incompatibilities (where requirements cannot be jointly satisfied).
          *   Must tie each requirement to specific cases.
          *   Must end with a brief scorecard of main theoretical families (Aesthetic Experience, History of Production, Social/Symbolic).
      *   **Tone:** Philosophical, rigorous, concrete, avoiding clichés.

  2.  **Deconstruct the Six Cases:**
      1.  *Fictitious Artist:* New painting, fake dead artist. (No original exists to copy).
      2.  *Workshop Picture:* Master design, assistant execution, sold as Master. (Collaboration/Authorization issue).
      3.  *Self-Forgery:* Artist copies own early work, passes as early. (Same hand, wrong time/intent).
      4.  *Perfect Replica:* Molecule-for-molecule copy. (Indiscernible physically, different history).
      5.  *Forged Banknote:* Institutional value, not aesthetic. (Functional vs. Artistic value).
      6.  *Same Tools/Workshop:* Later hand, original context. (Material continuity vs. Agency).

  3.  **Brainstorming Desiderata (Requirements):**
      *   *Requirement 1: The Intuition of Loss.* We feel cheated by fakes. Why?
      *   *Requirement 2: The Aesthetic Indiscernibility Problem.* If it looks the same, why is it worse? (Case 4).
      *   *Requirement 3: The Artistic Achievement.* Value lies in the act of creation, not just the result. (Case 1 & 3).
      *   *Requirement 4: The Deception Element.* Is it the lie or the object? (Case 1 & 5).
      *   *Requirement 5: The Authority/Authorization.* Who gets to say what counts? (Case 2).
      *   *Requirement 6: The Economic/Institutional Distinction.* Art isn't money, but both have authenticity conditions. (Case 5).
      *   *Requirement 7: The Temporal/Historical Connection.* Connection to a specific moment in time matters. (Case 3 & 6).

  4.  **Drafting the Desiderata (Iterative Refinement):**

      *   *Drafting Req 1 (Aesthetic Experience):* Must explain why a perfect copy (Case 4) feels less valuable even if it looks identical. *Constraint:* Genuine. If a theory says they are equal, it conflicts with market/museum practice.
      *   *Drafting Req 2 (Deception vs. Object):* Must distinguish between the moral wrong of lying (Case 1) and the aesthetic status of the object. A fake can be good art, but a bad fake. *Constraint:* Genuine.
      *   *Drafting Req 3 (Agency/Hand):* Must handle the Workshop case (Case 2). Is it the mind or the hand that matters? *Constraint:* Connoisseur bias? Maybe.
      *   *Drafting Req 4 (Self-Identity):* Must handle Self-Forgery (Case 3). Same artist, different time. Why is the later copy inferior? *Constraint:* Genuine (Historical specificity).
      *   *Drafting Req 5 (Institutional vs. Intrinsic):* Must distinguish Banknote (Case 5) from Art. One is purely functional, one is (allegedly) expressive. *Constraint:* Genuine distinction.
      *   *Drafting Req 6 (Material Continuity):* Case 6 (Same tools). Is the object a vessel of history? *Constraint:* Metaphysical prejudice?

  5.  **Refining and Categorizing (Genuine vs. Partisan):**
      *   *Genuine:* Things almost everyone agrees on (e.g., deception is usually bad, perfect physical replicas are treated differently in museums).
      *   *Partisan:* Things specific to collectors (market value), connoisseurs (brushstroke analysis), or moralists (inherent sin of lying).

  6.  **Identifying Incompatibilities:**
      *   *The "Perfect Replica" Paradox:* If value is purely aesthetic (experience), Case 4 should be equal to the original. If value is historical, Case 4 is worthless. You can't have both pure aestheticism and historical essentialism.
      *   *The "Workshop" Tension:* If value is in the *design* (intellectual), Case 2 is authentic. If value is in the *execution* (physical), Case 2 is inauthentic.
      *   *The "Fictitious Artist" Dilemma:* If the art is good, is the lie the only problem? Or is the art itself diminished because it wasn't an "achievement" of the attributed style's context?

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the task and the specific cases.
      *   **The Desiderata List:** Numbered, with Title, Motivation (Case), and Status (Genuine/Partisan).
      *   **Incompatibilities Section:** Explicitly state where theories break.
      *   **Scorecard:** Briefly map the three families (Aesthetic, Historical, Social) against the criteria.

  8.  **Drafting Content (incorporating specific cases):**
      *   *Req 1: The Indiscernibility Constraint.* (Case 4). Theory must explain value difference despite physical identity.
      *   *Req 2: The Non-Existence Constraint.* (Case 1). Theory must explain why a fake of a non-existent person is still a fake (not just a lie, but an artistic failure?).
      *   *Req 3: The Division of Labor Constraint.* (Case 2). Theory must adjudicate between conception and execution.
      *   *Req 4: The Temporal Indexicality Constraint.* (Case 3). Theory must explain why *when* it was made matters, even by the same hand.
      *   *Req 5: The Functional/Institutional Distinction.* (Case 5). Theory must distinguish art authenticity from currency authenticity.
      *   *Req 6: The Material Provenance Constraint.* (Case 6). Theory must decide if tools/materials confer authenticity absent the agent.

      *   *Refining Status:*
          *   Req 1 is Genuine (Museums treat them differently).
          *   Req 2 is Genuine (Art history relies on context).
          *   Req 3 is Partisan (Connoisseur vs. Conceptualist).
          *   Req 4 is Genuine (Artistic development matters).
          *   Req 5 is Genuine (Ontological difference).
          *   Req 6 is Partisan (Relic worship vs. Art appreciation).

  9.  **Developing the Incompatibilities:**
      *   *Aestheticism vs. History:* Can't satisfy Req 1 and be a pure aestheticist.
      *   *Moralism vs. Aestheticism:* If the art is beautiful (Case 1), is it morally wrong to enjoy it?
      *   *Individualism vs. Collaboration:* Case 2 breaks the "Genius" model.

  10. **Final Review against User Prompt:**
      *   Did I use all 6 cases? Yes.
      *   Did I mark Genuine vs. Partisan? Yes.
      *   Did I identify incompatibilities? Yes.
      *   Is the scorecard brief? Yes.
      *   Is the tone appropriate? Yes.

  11. **Self-Correction during drafting:** I need to make sure I don't just list the cases but explain *what the theory must deliver* regarding them. For example, for Case 5 (Banknote), the theory must explain why art *isn't* a banknote, otherwise authenticity in art is just economic protectionism. For Case 3 (Self-Forgery), the theory must explain why an artist can forge themselves—it's not about deception of style, but deception of historical moment.

      *Correction on Req 6 (Tools):* This is a subtle case. If I use Van Gogh's brush to paint a Van Gogh style picture today, is it a Van Gogh? No. The theory must explain why *agency* trumps *material continuity*.

      *Correction on Incompatibilities:* Be bold. State that Pure Aestheticism *fails* Case 4. State that Pure Moralism *fails* Case 1 (if the picture is good, is the act still wholly bad?).

  12. **Final Polish:** Ensure clear headings and precise language. (Proceed to generate output).

  *(Self-Correction Note: Make sure to explicitly label "Genuine Constraint" vs "Partisan Commitment" for each point as requested.)*

  *(Final check on the Scorecard: Keep it tight. Aesthetic Experience (Goodman/Beardsley), History of Production (Danto/Levinson), Social/Symbolic (Dickie/Geertz).)*

