answer: |-
  Here is a specification of desiderata for a theory of originality and forgery, structured around your six cases. I have distinguished between **Genuine Constraints** (phenomena any theory must account for to be descriptively adequate) and **Partisan Commitments** (normative preferences specific to collectors, moralists, or connoisseurs).

  ### The Desiderata

  **1. The Indiscernibility Constraint**
  *   **Requirement:** The theory must explain why two physically identical objects (one original, one replica) possess different artistic values or statuses, without relying solely on market price.
  *   **Motivating Case:** *Case 4 (The Perfect Physical Replica).* If a replicator produces a molecule-for-molecule duplicate of a Rembrandt, our museum practices and critical language treat it as a distinct kind of object from the original, even if the visual experience is identical.
  *   **Status:** **Genuine Constraint.** Any theory that claims artistic value is *exhausted* by the visual properties of the object (naive aestheticism) fails here. The theory must locate value in something non-perceptible.

  **2. The Non-Existence Constraint**
  *   **Requirement:** The theory must account for why a forgery is defective even when there is no specific original work it is copying, provided it misrepresents its genesis.
  *   **Motivating Case:** *Case 1 (Invented Provenance).* A forger paints a new work and attributes it to a fictitious dead artist. There is no "original" from which this deviates physically. If the theory defines forgery only as "copying an existing work," it cannot condemn this.
  *   **Status:** **Genuine Constraint.** This tests whether the theory values *truthful attribution* over *fidelity to a specific antecedent object*. It must explain why the lie about the *source* diminishes the work, not just the lie about the *copy*.

  **3. The Division of Labor Constraint**
  *   **Requirement:** The theory must adjudicate where artistic agency resides: in the conception (design) or the execution (hand). It cannot simply collapse these into a single "author" category.
  *   **Motivating Case:** *Case 2 (The Workshop Picture).* A master designs, an assistant paints. Sold as the master's. A theory must explain why this is often considered a "lesser" work than one by the master's hand, or conversely, why it might be considered authentic to the master's *vision*.
  *   **Status:** **Partisan Commitment (Connoisseur vs. Conceptualist).** The "Connoisseur" demands the master's hand (execution); the "Conceptualist" accepts the master's design (intellect). An adequate theory must acknowledge this tension, not hide it.

  **4. The Temporal Indexicality Constraint**
  *   **Requirement:** The theory must explain why the *time* of production matters, even when the *agent* is identical.
  *   **Motivating Case:** *Case 3 (Self-Forgery).* An artist copies their own early work late in life and passes it as early. The style, hand, and mind are the same. The theory must explain why this is a forgery and not merely a "reiteration."
  *   **Status:** **Genuine Constraint.** This demonstrates that a work of art is not just a type (a style) but a token anchored in a specific historical moment. A theory that treats art as timeless forms cannot handle self-forgery.

  **5. The Functional Distinction Constraint**
  *   **Requirement:** The theory must distinguish between *institutional* authenticity (validity) and *artistic* authenticity (achievement), explaining why the stakes differ.
  *   **Motivating Case:** *Case 5 (The Forged Banknote).* A fake banknote is worthless because its value is purely institutional/functional. A fake painting may still have aesthetic merit. The theory must explain why art authenticity is not merely a matter of "token validity" like currency.
  *   **Status:** **Genuine Constraint.** If a theory treats art authentication exactly like currency authentication, it reduces art to a mere medium of exchange. It must account for the residual value of a detected fake painting (which a detected fake note does not have).

  **6. The Material Provenance Constraint**
  *   **Requirement:** The theory must determine whether physical continuity with the original context (tools, space, materials) can substitute for agent continuity.
  *   **Motivating Case:** *Case 6 (Same Tools/Workshop).* A later hand uses the original master's brushes, pigments, and studio. It is not a copy, nor the original. The theory must explain why this does not constitute an original work by the master.
  *   **Status:** **Partisan Commitment (The Relic Worshipper).** This tests the "magic" of materials. Most philosophical accounts reject this (agency trumps materials), but collector culture often prizes "studio residue." A robust theory should explain why this intuition is likely mistaken or secondary.

  ***

  ### Incompatibilities: Where Theories Break

  You asked to identify where these requirements cannot be jointly satisfied. There are three primary fracture points:

  **1. The Aesthetic-Historical Dilemma (Req 1 vs. Pure Aestheticism)**
  You cannot satisfy the **Indiscernibility Constraint** (Req 1) while maintaining that artistic value is wholly contained in the aesthetic experience afforded by the object.
  *   *The Conflict:* If value is purely experiential, the Perfect Replica (Case 4) is equal to the Original. If the Original is more valuable, value must be historical/relational.
  *   *The Cost:* To save the value of the original, you must admit that two visually identical objects can have different artistic values. This severs the link between "looking good" and "being good art."

  **2. The Moral-Aesthetic Gap (Req 2 vs. Moralism)**
  You cannot satisfy the **Non-Existence Constraint** (Req 1) with a purely moral theory of forgery.
  *   *The Conflict:* In the Fictitious Artist case (Case 1), the deception is clear. But if the painting is aesthetically magnificent, a purely moral theory condemns the object because of the lie. An aesthetic theory might celebrate the object despite the lie.
  *   *The Cost:* A theory must choose: Is the "wrongness" of forgery located in the *deception of the viewer* (moral) or the *misrepresentation of artistic achievement* (aesthetic/historical)? If you choose the former, a discovered fake becomes morally toxic. If you choose the latter, the fake is artistically failed but morally neutral once the lie is known.

  **3. The Agency-Execution Tension (Req 3 vs. Req 6)**
  You cannot consistently privilege the "Hand" (Connoisseurship) without running into the **Material Provenance** problem.
  *   *The Conflict:* If value lies in the physical touch (Case 2 Workshop), then Case 6 (Same Tools) should hold some value, as the physical context is preserved. If value lies purely in the mind (Design), Case 2 should be fully authentic.
  *   *The Cost:* Most theories privilege the *intentional act* over both the design and the tools. This means the Workshop picture (Case 2) is inauthentic (assistant's act) and the Tool picture (Case 6) is inauthentic (later agent's act). This alienates both the Conceptualist (who likes Case 2) and the Collector (who likes Case 6).

  ***

  ### Scorecard of Theoretical Families

  Here is how the three main families of views perform against your desiderata:

  **1. The Aesthetic Experience View (e.g., Beardsley)**
  *   *Core:* Value lies in the capacity to afford an aesthetic experience.
  *   *Performance:* Fails **Req 1 (Indiscernibility)**. It must claim the Perfect Replica is equal to the Original. It handles **Req 5 (Banknote)** well (art is for experience, money is not).
  *   *Verdict:* Descriptively inadequate for museum practice, though normatively attractive.

  **2. The History of Production View (e.g., Danto, Levinson, Goodman)**
  *   *Core:* Value lies in the correct causal history of the object's making (who, when, how).
  *   *Performance:* Passes **Req 1, 3, 4, and 6**. It explains why the Replica, Workshop, Self-Forgery, and Tool cases are all distinct from the Original. It struggles slightly with **Req 2 (Fictitious Artist)** unless it posits that the "history" includes the truth of the attribution, not just the physical making.
  *   *Verdict:* The most robust account for current artworld practices, but risks making art history more important than art itself.

  **3. The Social/Symbolic Construction View (e.g., Dickie, Geertz)**
  *   *Core:* Value lies in the status conferred by the artworld institution.
  *   *Performance:* Passes **Req 2 and 5** easily (forgery is a breach of institutional rules, like currency). It struggles with **Req 1 (Indiscernibility)** because it must explain why the institution treats the Replica differently without appealing to intrinsic history. It handles **Req 3 (Workshop)** by deferring to institutional consensus (which often shifts).
  *   *Verdict:* Explains the *status* of the object well, but struggles to explain why we *care* about the status beyond mere convention.

  **Summary Recommendation:**
  To write a successful paper, you should not look for a theory that satisfies all desiderata equally. Instead, use the **Incompatibilities** section to show that "Authenticity" is not a single property. It is a cluster concept where Historical Production (Req 1, 4) usually trumps Aesthetic Experience (Req 1), but where Moral Deception (Req 2) operates on a separate axis from Artistic Value (Req 5). The tension between the **Workshop** (Case 2) and the **Self-Forgery** (Case 3) is your strongest lever: one fails on execution, the other on temporality. A theory that cannot distinguish those two failures is dead on arrival.
