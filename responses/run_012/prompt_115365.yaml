  2.  **Deconstruct the Orthodox View (Revealed Preference):**
      *   Standard model: $u(x)$ is inferred from $x$ chosen from $S$.
      *   Assumption: Preferences are stable, exogenous, and defined over final states.
      *   Problem identified by user: Menus are endogenous. Past choices constrain future menus.

  3.  **Develop the Core Argument (Ledger > Outcome):**
      *   *Premise 1: Endogeneity of Constraints.* The standard model treats the budget set/constraint set as exogenous. In reality, current constraints are functions of past choices (savings, health, reputation, addiction).
      *   *Premise 2: Path Dependence of Valuation.* The value of an outcome isn't static. Drinking water is different when you're thirsty vs. full. But more deeply, the *capacity* to value certain outcomes changes based on history (adaptive preferences).
      *   *Premise 3: The Information Loss.* Collapsing a history into a single state variable discards the *process* of restriction. Two agents might end up at outcome $X$. Agent 1 chose $X$ from $\{X, Y, Z\}$. Agent 2 chose $X$ from $\{X\}$ because past choices eliminated $Y$ and $Z$. Revealed preference says they are equally well off. Intuitively, Agent 1 is freer/better off.
      *   *Conclusion:* Welfare is not about the terminal node; it's about the trajectory and the evolving constraint set. Therefore, the primitive object of analysis must be the ledger (history of constraints + choices).

  4.  **Address the "Richer Outcomes" Objection (The Collapse):**
      *   *Objection:* Why not just define an outcome as a path? Let $X = (x_1, x_2, ... x_t)$. Then standard utility theory works over paths.
      *   *Counter-argument:* Defining outcomes as histories treats the history as a *consumption good*. It implies the agent evaluates the whole path from a "view from nowhere" (time zero).
      *   *The Ledger Difference:* The ledger approach acknowledges that the *evaluation mechanism itself* changes over time. It's not just that the path matters; it's that the *agency* at time $t$ is constrained by the agency at time $t-1$ in a way that cannot be fully internalized at time zero.
      *   *Key Distinction:* "History-dependent utility" still assumes a coherent maximizer optimizing over paths. "Ledger utility" suggests the maximizer is fragmented or that the constraint structure *constitutes* the utility, not just limits it. The ledger framing highlights the *loss of opportunity* as a welfare loss independent of the final state. A fatter outcome space hides the *counterfactuals* that were killed off. The ledger keeps the counterfactuals visible.

  5.  **Formulate the Strongest Objection to the Ledger View:**
      *   *Objection:* Normative Paralysis / Paternalism. If utility is path-dependent and menus are endogenous, how do we judge welfare? If an addict chooses drugs because their past made it the only option, and we say they are worse off than a non-addict choosing drugs freely, we need a metric to compare the menus. But menus are subjective. This opens the door to an external observer deciding which menus "should" have been available. It destroys the informational efficiency of revealed preference.
      *   *Reply:* The orthodox view isn't actually informationally efficient; it's just silent on dynamic harms. The ledger view doesn't require paternalism; it requires tracking *freedom* as a component of welfare. We can observe menu shrinkage objectively (credit scores, health metrics). It shifts welfare from "satisfaction" to "sustainable agency."

  6.  **Determine Falsification Conditions:**
      *   What would make me give up?
      *   If it turns out that path dependence is negligible in most welfare-relevant decisions.
      *   If we can show that agents perfectly internalize future menu constraints at time zero (Rational Expectations over constraints). If agents perfectly anticipate how today shrinks tomorrow's menu and optimize accordingly, then the "ledger" collapses back into a standard intertemporal optimization problem.
      *   *Crucial Falsifier:* Evidence that agents do *not* suffer welfare losses from menu shrinkage when they anticipate it. (Hard to prove, but conceptually clear). Or, evidence that "freedom of choice" has no independent value apart from the chosen outcome.

