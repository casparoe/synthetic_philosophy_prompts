answer: |-
  Here is the argument for the claim that utility is a property of the ledger, not a ranking over outcomes.

  ### The Argument: Endogeneity and the Erasure of Constraint

  The orthodox revealed preference framework relies on a categorical distinction between the *agent* (who chooses) and the *environment* (which provides the menu). It assumes the menu is exogenous. This assumption is not merely a simplification; it is a structural error that renders the model blind to the primary mechanisms of welfare loss in dynamic settings.

  In reality, the menu at time $t+1$ is a function of the choice at time $t$. This is not just a budget constraint in the standard sense; it is a constitutive constraint. When an agent smokes a cigarette, they do not merely consume a good; they alter their physiological state, changing the marginal utility of future cigarettes and shrinking the set of feasible health outcomes. When an agent takes a predatory loan, they do not merely shift consumption intertemporally; they degrade their credit score, removing future lenders from the choice set.

  If utility is defined solely over final outcomes, two agents arriving at the same state are deemed equally well-off. Consider Agent A, who chooses a low-savings outcome from a menu {High Savings, Low Savings}, and Agent B, who chooses Low Savings from a menu {Low Savings} because their past choices precluded high savings. Orthodoxy says $U(A) = U(B)$. This is normatively inert. It treats the atrophy of agency as welfare-neutral.

  The ledger—the sequence of pairs $(M_t, c_t)$ where $M$ is the menu and $c$ is the choice—captures the *trajectory of freedom*. Welfare is not just the satisfaction of the final choice; it is the preservation of the capacity to choose. By making the ledger primitive, we acknowledge that the *shape* of the constraint set is a welfare variable. A shrinking menu is a welfare loss even if the agent chooses the "best" available option at every step. This explains why addiction, poverty traps, and adaptive preferences are welfare disasters even if the agent appears to be maximizing at every local node. They are maximizing on a ledger that is collapsing. The utility is in the sustainability of the ledger, not the terminal state.

  ### The "Fat Outcome" Objection and Why It Fails

  The standard defense against this is the "rich description" move. A theorist will say: "Fine, just redefine an outcome. Don't let an outcome be 'consumption at time $t$'. Let an outcome be the entire history of consumption and constraints. Then we are back to standard utility maximization over these 'fat' outcomes."

  This defense fails because it confuses *consumption of a path* with *submission to a process*.

  If you define an outcome as a history, you are implicitly assuming there exists a coherent preference ordering over complete life-paths that exists prior to the life being lived. You are assuming the agent can stand outside of time and rank the ledger. But in the cases that matter (addiction, habit formation), the agent *cannot* rank the ledger from the outside because their ranking mechanism is being altered by the ledger itself.

  The ledger framing buys you something the fat-outcome framing does not: it separates the *valuation* from the *constraint*.
  1.  **Fat Outcome:** Treats the history as a commodity. It implies, "I prefer this history to that history." It hides the counterfactuals. It obscures whether the path was chosen or endured.
  2.  **Ledger:** Treats the history as a sequence of opportunity sets. It forces the model to account for the *menus that vanished*.

  The crucial difference is informational. A fat-outcome utility function compresses the reason for the choice into the value of the choice. If an agent stops drinking alcohol, a fat-outcome model sees "No Alcohol" in the history. It cannot distinguish between "Quit because I prefer health" and "Quit because I can no longer afford alcohol." The ledger distinguishes these immediately: in the first, the menu included Alcohol and it was rejected; in the second, the menu excluded Alcohol. By making the menu explicit, the ledger preserves the distinction between *preference* and *feasibility*, which is exactly where welfare losses occur in dynamic traps.

  ### The Strongest Objection: The Measurement Problem

  The most damaging objection to the ledger view is not theoretical, but operational. It argues that making the ledger primitive renders welfare economics empirically empty.

  To evaluate welfare using the ledger, you must observe the counterfactual menus ($M_t$). You need to know not just what the agent chose, but what they *could* have chosen. In orthodox theory, we infer preferences from choices because choices are observable. In ledger theory, we need to observe constraints. But constraints are often latent. We can see that an agent didn't buy a house, but we cannot easily observe whether the menu was {Buy, Rent} or {Rent} due to hidden credit rationing.

  If the menu is unobservable, the ledger is unobservable. If the ledger is unobservable, we cannot rank welfare. This forces the economist to either:
  1.  Impute the menus based on assumptions (which reintroduces the very exogeneity assumptions we tried to escape).
  2.  Rely on institutional data that may not capture the agent's subjective feasible set.

  Consequently, the ledger approach risks becoming a normative critique without a positive metric. It can tell us *that* a trap is bad, but it cannot measure *how much* worse off the trapped agent is compared to a free one, because we cannot quantify the value of the missing options without a utility function over outcomes—which we just declared secondary. It creates a paralysis where we can identify pathology but not prescribe trade-offs.

  ### The Reply to the Objection

  The reply is that the orthodox view is not actually more operational; it is just more complacent. It assumes that if a choice is made, the option was available. This is a stronger, not weaker, assumption about unobservables. It assumes zero constraint friction.

  The ledger approach does not require perfect knowledge of the subjective feasible set; it requires knowledge of the *institutional* feasible set, which is often observable (interest rates, eligibility rules, physical laws). Furthermore, the ledger approach shifts the burden of proof. Instead of assuming freedom and requiring proof of constraint, it treats the narrowing of the institutional menu as a prima facie welfare loss.

  Regarding the measurement of trade-offs: We do not need a cardinal utility function to see that a shrinking ledger is bad. We can use the ledger to identify *dominance*. If Agent A's ledger shows a sequence of menus that are supersets of Agent B's menus at every time $t$, and Agent A's choices are a subset of Agent B's available choices, Agent A is strictly freer. We don't need to measure "how much" utility they lost to know they lost agency. This is sufficient for a vast range of policy analysis (e.g., identifying predatory lending or anti-competitive practices) where the orthodox model sees only "mutually beneficial exchange."

  ### The Falsification Condition

  I would abandon the claim that the ledger is primitive under one specific empirical condition:

  **If it were demonstrated that agents fully internalize future menu constraints at the moment of the initial choice.**

  If agents possess perfect foresight regarding how today's choice shrinks tomorrow's menu, and they optimize their *entire* life-path at $t=0$ accounting for all future endogenous constraints, then the ledger collapses back into a standard intertemporal optimization problem. In that world, the "trap" is just a chosen path. The agent *chose* to become addicted because, given their discount rate and constraints, that path yielded the highest integrated utility.

  If we find evidence that agents do not suffer from "dynamic inconsistency" regarding their constraint sets—that they accurately predict and value their future loss of freedom at the time they incur it—then the ledger adds no information. The "loss of agency" is already priced into the initial choice.

  However, if we find that agents systematically underestimate the rate at which their choices narrow future menus (e.g., they underestimate addiction speed, or the compounding of debt), then the ledger is the only valid primitive. The falsifier, therefore, is evidence of **perfect rational expectations over endogenous constraint evolution**. If agents are perfect forecasters of their own entrapment, the orthodox view holds. If they are not, the ledger is necessary. Given the empirical weight on bounded rationality and projection bias, I do not expect this condition to hold.
