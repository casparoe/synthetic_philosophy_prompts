      *Refining the "Fat Outcome" point:* If I define an outcome as a history, I am still assuming a single utility function ranks those histories. The ledger argument says the *ranking function itself* is emergent from the ledger. No, that's too strong. Let's stick to: The ledger preserves the *opportunity cost* information that a "history-outcome" compresses away. A history-outcome treats the path as a commodity. The ledger treats the path as a sequence of constraints. The difference is between "I like walking this path" vs "I was forced to walk this path."

