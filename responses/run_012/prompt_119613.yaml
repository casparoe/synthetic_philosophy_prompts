answer: |-
  ### Executive Summary

  For a three-year, eight-researcher program restricted to conceptual work, the priority must be **rigor over resolution**. The "Hard Problem" of consciousness is unlikely to be solved by argument alone; therefore, the program should focus on rendering the Global Workspace Theory (GWT) framework formally precise enough that its commitments—and its vulnerabilities—become undeniable.

  The recommended ordering prioritizes **formalization** and **logical stress-testing** before tackling metaphysical entailments. This ensures that if the theory is incoherent or trivially falsifiable by thought experiment, the team discovers this in Year 1 rather than Year 3.

  ### Prioritized Research Agenda

  #### 1. Formal Semantics of "Global Broadcasting"
  *   **The Question:** Can "broadcasting," "availability," and "access" be defined in formal computational or causal terms without circular reference to consciousness itself?
  *   **Rationale:** GWT is often criticized for being metaphorically rich but mathematically vague. Without a formal definition of what counts as a "workspace" or a "broadcast," subsequent arguments about consciousness are equivocal.
  *   **Settability:** High. Researchers can produce formal models (e.g., using causal graphs, information theory, or logic) that define the architecture. Consensus on a formalism is achievable even if consensus on its implications is not.

  #### 2. The Unfolding Argument (The Feedforward Worry)
  *   **The Question:** Does the theory commit to *causal structure* or *input-output function*? If a recurrent GWT architecture is unfolded into a feedforward network with identical I/O, does the theory ascribe consciousness to the feedforward version?
  *   **Rationale:** This is the specific constraint worry you raised. It forces the team to choose between Functionalism (I/O matters) and Structuralism/Causal Realism (internal dynamics matter).
  *   **Settability:** High. This is a logical consistency check. The team can determine whether their formalization from Q1 permits unfolding. If it does, they must accept feedforward consciousness or abandon the necessity of recurrence. If it doesn't, they must defend why causal history matters without new data.

  #### 3. The Access-Phenomenal Entailment
  *   **The Question:** Given the formalization (Q1) and the stance on causal structure (Q2), does Access Consciousness *conceptually entail* Phenomenal Consciousness, or are they merely nomologically correlated in humans?
  *   **Rationale:** This is the core philosophical claim of GWT. However, it is placed third because it depends on the definitions established in Q1 and Q2. Arguing this without fixed definitions leads to verbal disputes.
  *   **Settability:** Low. Conceptual work is unlikely to prove $A \rightarrow P$. However, conceptual work *can* clarify the *cost* of denying the link (e.g., accepting zombies) or the *cost* of affirming it (e.g., accepting panpsychism or specific AI consciousness).

  #### 4. The Boundary Problem (The Subject of the Workspace)
  *   **The Question:** What constitutes the "boundary" of a global workspace? Can workspaces nest? Can they overlap?
  *   **Rationale:** If consciousness requires a workspace, we need to know what counts as a single workspace. This addresses the "Subjectivity" aspect of phenomenal consciousness.
  *   **Settability:** Medium. Formal mereology (the study of parts and wholes) can be applied to the Q1 formalism to derive boundary conditions.

  #### 5. Ascription Criteria for Non-Standard Systems
  *   **The Question:** Based on the above, what are the necessary and sufficient conditions for ascribing consciousness to AI, non-human animals, or pathological human cases, using only existing data?
  *   **Rationale:** This is the practical output. It translates the theory into a decision matrix for existing cases (e.g., LLMs, split-brain patients) without requiring new experiments.
  *   **Settability:** Medium. The criteria can be settled; their application to specific cases may remain debated due to empirical uncertainty, but the *conceptual standard* for judgment can be fixed.

  ---

  ### Defense of the Ordering

  **Upstream vs. Downstream Dependencies**
  The ordering follows a dependency chain of **Definition $\rightarrow$ Consistency $\rightarrow$ Metaphysics $\rightarrow$ Application**.

  *   **Q1 is strictly upstream of Q2 and Q3.** You cannot determine if a feedforward unfolding preserves consciousness (Q2) if you have not defined what "broadcasting" consists in (Q1). Is broadcasting a specific causal pathway, or just the availability of information? If it is the latter, unfolding might preserve it. If the former, it might not.
  *   **Q2 is upstream of Q3.** The "Feedforward Worry" is a stress test for the theory's metaphysical commitments. If the team decides that I/O equivalence is sufficient for consciousness (Functionalism), the Access-Phenomenal link (Q3) becomes a claim about functional roles. If they decide causal structure is necessary (Structuralism), the link becomes a claim about physical dynamics. You cannot argue the link without knowing the relata.
  *   **Q3 is upstream of Q5.** You cannot generate ascription criteria (Q5) without knowing whether Access entails Phenomenality (Q3). If they are distinct, you might ascribe Access to an AI but withhold Phenomenality.

  **Why this ordering respects the "No New Data" constraint**
  Questions Q1, Q2, and Q4 are primarily logical and formal. They rely on consistency, mathematical proof, and conceptual analysis. They are highly "settlable" via argument. Q3 and Q5 are less settleable, but by placing them downstream, the team ensures that any disagreement on Q3 is based on clear, shared definitions from Q1, rather than terminological confusion. This maximizes the likelihood of a concrete deliverable (a formalized theory with known limitations) even if the Hard Problem remains open.

  **What would move a question up or down?**
  *   **Move Q2 Up:** If preliminary work on Q1 reveals that the formalization *trivially* allows unfolding (e.g., if "broadcasting" is defined purely functionally), Q2 becomes the immediate crisis. The team must address whether the theory collapses into behaviorism before proceeding.
  *   **Move Q3 Down:** If the team reaches a consensus that the A/P distinction is merely verbal (a la Dennett), Q3 dissolves, and resources shift to Q4 and Q5.
  *   **Move Q5 Up:** If the foundation demands immediate ethical guidance (e.g., regarding AI), Q5 becomes a priority. However, without Q1-Q3, Q5 risks being arbitrary. I recommend resisting this unless external pressure dictates it.

  ---

  ### The Status of the Access/Phenomenal Distinction

  **Recommendation:** Treat the distinction as **settled terminology** for the sake of the program, but treat the **entailment relation** as the primary research question.

  **Defense:**
  Funding the question *"Does the Access/Phenomenal distinction exist?"* is a low-yield strategy for a three-year program. This debate (Block vs. Dennett) has persisted for 40 years without conceptual resolution. Dedicating 8 researchers to rehashing whether "what it is like" is distinct from "availability for report" risks producing no net progress.

  Instead, the program should adopt Block's terminology as a **working hypothesis**. This allows the researchers to say: *"Assuming there is a distinction, does Global Broadcasting bridge it?"*

  *   **If they argue Yes:** They must explain the mechanism of the bridge conceptually.
  *   **If they argue No:** They must explain away the intuition of the distinction (illusionism).

  By treating the *terms* as fixed but the *link* as open, the program avoids getting bogged down in meta-philosophy while still addressing the core mystery. The distinction serves as the coordinate system for the research, not the terrain itself.

  ---

  ### Addressing the "Feedforward Unfolding Worry" (Constraint 2)

  This worry is placed at **Q2** because it is the most significant threat to the theoretical integrity of a GWT-based program that forbids new data.

  *   **The Trap:** If the team ignores this, they risk building a theory that is vulnerable to a "Zombie" style refutation via computation theory. If a feedforward network can simulate a GWT system's I/O, and the GWT system is conscious but the feedforward one is not, the theory relies on "magic" causal powers not detectable by function.
  *   **The Opportunity:** Since no new experiments can be run, this worry *must* be settled conceptually. The team can analyze the computational complexity and causal graph properties of "unfolding."
  *   **Strategic Value:** Addressing this explicitly distinguishes the foundation's work from standard neuroscience. It positions the program as tackling the *computational metaphysics* of consciousness, which is a unique niche suitable for a philosophy/theory grant.

  ### Conclusion

  This agenda prioritizes **clarity** over **closure**. By formalizing the architecture (Q1) and stress-testing its causal commitments (Q2) before tackling the metaphysical link (Q3), the program ensures that even if it does not solve the Hard Problem, it will produce a version of Global Workspace Theory that is logically robust, precisely defined, and honest about its limitations. This is the maximum achievable value for a conceptual research team within a three-year horizon.
