  *(Final check on the "Hope nobody asks" question)*: The Newcomb problem is the classic trap for anyone mixing CDT and logical correlation. If you accept logical correlation for PD, you must one-box. If you two-box, you can't cooperate in PD via this method. This is the deadliest logical inconsistency. I will make this the "Hope nobody asks."

