  2.  **Deconstruct the Paper's Core Claim:**
      *   *Claim:* Superrationality = CDT + Same-Wiring.
      *   *Mechanism:* My choice is evidence of theirs because we run the same algorithm (logical correlation), not because I cause their choice.
      *   *Distinction:* Mirror (known symmetry) vs. Shadow (unknown symmetry via training/evolution).
      *   *Goal:* Solve One-Shot PD.
      *   *Weak Point:* Distinguishing from Evidential Decision Theory (EDT).

  3.  **Brainstorming Objections based on Audience Profiles:**

