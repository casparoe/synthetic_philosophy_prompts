      *   **Audience:**
          1.  *Causal Decision Theorists (Econ):* Hate hand-waving, correlation $\neq$ causation, want rigorous formalism.
          2.  *Kantians (Ethics):* Suspicious of instrumentalizing rationality, ask if it's just universalizability.
          3.  *Evolutionary Game Theorist (EGT):* Thinks norms = replicator dynamics.
