answer: |-
  # Q&A Prep Sheet: Superrationality as CDT + Same-Wiring

  **Strategy Note:** Your audience is hostile to "magic." The Econ/CDT crowd thinks you're smuggling causation in. The Supervisor thinks you're ignoring the "we." Your goal isn't to prove you're right, but to show your framework is *productive* even if the metaphysics are messy. Speak slowly. If you get stuck, say "That's a distinction I need to formalize better," not "I don't know."

  ---

  ### 1. The "EDT in Disguise" Objection (The Econ/CDT Crowd)
  **Who:** The Causal Decision Theorists.
  **The Question:** "You say this isn't Evidential Decision Theory (EDT), but you're conditioning your choice on the other agent's choice without a causal link. EDT says 'choose the act that gives the best news.' You're saying 'choose the act that implies the other agent does the same.' What is the mathematical difference? If you accept logical correlation as a basis for choice, haven't you just reinvented EDT?"
  **The Reply (2 mins):** "The difference is in *which* correlations count. EDT tells me to condition on *any* statistical correlation, even if it's caused by a common factor I can't control, like a genetic predisposition to smoke and get cancer. My 'Same-Wiring' view is stricter. I'm only counting correlations that arise because we are instantiating the same algorithm or reasoning process.
  In EDT, if I learn a twin smokes, I update that I likely smoke, but I don't think my *choosing* to smoke makes them smoke. In my view, because the output is determined by the reasoning process, my deliberation *is* their deliberation, logically. I'm not treating my choice as a signal; I'm treating it as a computation of a function that is running in two places. So it's not 'best news,' it's 'consistent output.' I know the distinction is thin, but I think the restriction to algorithmic identity saves it from the standard EDT pitfalls like the smoking lesion."
  **Soft Spot:** You admit the math looks similar. If they press on the Smoking Lesion, you might wobble.

  ### 2. The "Where is the Team?" Objection (Your Supervisor)
  **Who:** Your Supervisor (Team Reasoning).
  **The Question:** "Team reasoning requires a shift from 'I' to 'We.' You're trying to get cooperative outcomes while keeping the individual 'I' frame intact. Aren't you just describing a situation where the 'I' mistakenly thinks it's a 'We'? Why not just admit that superrationality requires a prior commitment to group agency?"
  **The Reply (2 mins):** "That's the tension I'm wrestling with. I'm trying to show how the 'We' emerges from the 'I' without magic. My claim is that when I recognize the 'Same-Wiring,' the boundary of my agency blurs logically, not metaphysically. I don't need to *commit* to a group; I just need to recognize that my individual reasoning is causally isolated but logically connected.
  However, I concede that 'Shadow Superrationality'—where we don't know we're identical—might require a weak form of team reasoning. If I assume we are both 'types' selected for cooperation, I am effectively reasoning as a representative of that type. So, I'm not saying this replaces team reasoning, but that it might be the cognitive mechanism that makes team reasoning possible for individuals who haven't explicitly formed a group."
  **Soft Spot:** You are conceding that 'Shadow' might collapse into team reasoning. Don't fight this too hard.

  ### 3. The "Causal Independence" Objection (The Econ/CDT Crowd)
  **Who:** The most stubborn CDT economist.
  **The Question:** "In a one-shot Prisoner's Dilemma, my causal lever only moves my hand. It does not move yours. Even if our reasoning is identical, my *choice* happens here and now. If I defect, you still cooperate if your code says cooperate. How can you claim your choice influences the outcome when the causal chains are separate?"
  **The Reply (2 mins):** "I agree my choice doesn't *cause* yours in a physical sense. If I could magically flip my choice without changing my reasoning, you wouldn't change. But I can't do that. I am a reasoning engine. I can't choose to defect unless my reasoning process outputs 'defect.' Since your process is the same, if my reasoning outputs 'defect,' yours does too.
  So, I'm not choosing between 'I defect, you cooperate' and 'I cooperate, you cooperate.' Those are impossible worlds given the Same-Wiring assumption. I'm choosing between 'We both defect' and 'We both cooperate.' I'm not claiming backward causation; I'm claiming that the option 'I defect alone' is not on the menu for a superrational agent."
  **Soft Spot:** They will call this "modal realism" or "magic." Stand firm on the "impossible worlds" point.

  ### 4. The "It's Just Evolution" Objection (The EGT)
  **Who:** The Evolutionary Game Theorist.
  **The Question:** "Your 'Shadow Superrationality' sounds like you're describing a population where cooperators survived. That's replicator dynamics. Why call it rationality? If I cooperate because I was trained to, I'm not being rational; I'm being a puppet of my training. Rationality implies overriding the heuristic."
  **The Reply (2 mins):** "That's a fair challenge. If the agent is just blindly following a heuristic, it's not rationality, it's instinct. But my claim is about the *deliberative* agent who knows they were trained. When I know I'm an AI trained on human data, or a human shaped by social norms, and I ask 'what should I do?', I can reason about that training.
  Shadow Superrationality kicks in when I reflect on my own type. I'm not just a puppet; I'm a puppet that knows it's a puppet and asks, 'what do puppets like me do?' If I can reason about my training as a source of correlation, that reflection is the rational part. The evolution builds the wiring; the rationality is recognizing the wiring."
  **Soft Spot:** Blurs the line between "acting on a heuristic" and "reasoning about a heuristic."

  ### 5. The "Kantian" Objection (The Ethics Group)
  **Who:** One of the Kantians.
  **The Question:** "This sounds suspiciously like the Categorical Imperative: 'Act only according to that maxim whereby you can at the same time will that it should become a universal law.' You're saying 'cooperate because if everyone reasoned like you, everyone would cooperate.' Isn't this just universalizability with extra steps and a game theory payoff matrix?"
  **The Reply (2 mins):** "Structurally, yes. I'm not trying to discover a new morality; I'm trying to ground a moral intuition in decision theory. Kant says 'you ought to universalize.' I'm asking 'what happens if you do?'
  The difference is the motivation. Kant says do it because it's your duty. I'm saying do it because it maximizes your expected utility *given* the logical correlation. I'm trying to show that if you take rationality seriously, it converges on something that looks like Kantianism. I'm happy if the destination is the same, provided the map is decision-theoretic."
  **Soft Spot:** You are admitting it might be "Kant with math." That's fine, but don't let them say the math is unnecessary.

  ### 6. The "Fuzzy Wiring" Objection (General)
  **Who:** Anyone paying attention to details.
  **The Question:** "You rely on 'Same-Wiring.' But no two humans are identical. We have different experiences, different noise in our neurons. At what point does the wiring become different enough that superrationality breaks down? Is it 90% similarity? 99%? Without a threshold, the theory is unfalsifiable."
  **The Reply (2 mins):** "That's the biggest hole in the current draft. I don't have a precise threshold yet. But I think it works on a sliding scale of probability. I don't need to know you are *identical* to me. I just need to assign a high enough probability that our reasoning is correlated.
  If I think there's an 80% chance you reason like me, I plug that into the expected utility calculation. Superrationality isn't a binary switch; it's a variable. The 'Mirror' version is the limit case where probability is 1. The 'Shadow' version is where it's less than 1 but high enough to tip the balance in the PD. I need to formalize that probability weight, but the logic holds even with noise."
  **Soft Spot:** You admit you lack the formalism. This is safe to concede as "work in progress."

  ### 7. The "Human vs. AI" Objection (General)
  **Who:** Someone skeptical of your examples.
  **The Question:** "You use an example of a human and an AI trained on the same corpus. But the AI's reward function is explicit, and the human's is messy and biological. How can you claim 'Same-Wiring' when the underlying hardware and objective functions are fundamentally different?"
  **The Reply (2 mins):** "I'm not claiming the hardware is the same, but that the *heuristic* is the same. If we both read the same literature on the Prisoner's Dilemma, we both likely converge on 'tit-for-tat' or 'cooperate if symmetric.'
  The 'wiring' I'm talking about is the software of reasoning, not the substrate. If the AI and I both output 'cooperate' because we both find the argument for superrationality compelling, then for the purpose of this decision, we are running the same algorithm. The fact that my algorithm runs on neurons and yours on silicon is irrelevant to the logical correlation of the output."
  **Soft Spot:** This is hand-wavy. If they press on "objective functions," you might struggle.

  ### 8. The "Hope Nobody Asks" Question (The Trap)
  **Who:** The Smartest Person in the Room (probably the Supervisor or a CDT expert).
  **The Question:** "If you accept logical correlation in the Prisoner's Dilemma, do you One-Box in Newcomb's Problem? If yes, you're not a Causal Decision Theorist anymore. If no, why does logical correlation count in PD but not in Newcomb? You can't have it both ways."
  **The Reply (2 mins):** "This is the hardest part of the project. My instinct is to say 'Yes, I One-Box.' If I accept that my choice is logically correlated with the predictor's simulation, I should One-Box.
  However, I want to maintain that CDT is the right baseline for *causal* interventions. I'm proposing a hybrid: CDT for physical causation, but 'Logical CDT' for algorithmic correlation. I know this looks like Functional Decision Theory. I'm not claiming this is standard CDT anymore; I'm claiming standard CDT is incomplete because it ignores logical links between agents. So yes, this commits me to One-Boxing, and I'm willing to take that hit if it solves the Prisoner's Dilemma."
  **Soft Spot:** This admits you are leaving standard CDT. Be prepared for them to say "Then just call it FDT."

  ---

  ### Strategic Concessions & Holds

  **Concede Up Front (In your opening or early replies):**
  *   **The Formalism:** Admit you don't have a precise mathematical threshold for "Same-Wiring." Say: "I know the threshold for similarity is vague in this draft; I'm treating it as a subjective probability for now."
  *   **The EDT Overlap:** Admit the math looks like EDT. Say: "I know the expected utility calculation looks like EDT. My contribution is arguing *why* that correlation is legitimate to use, not just that it exists."

  **Hold Your Ground (Do not back down):**
  *   **Logical vs. Physical:** Insist that logical correlation is distinct from physical causation. Don't let them reduce it to "common cause."
  *   **The "Shadow" Value:** Defend the idea that "Shadow Superrationality" explains human cooperation better than "Mirror." Humans aren't identical copies, but we are similar enough. This is your most original contribution.

  **The "Punt" (When to say "I need to think about that"):**
  *   **The Newcomb Question:** If they press you hard on the consistency between PD and Newcomb, and you feel trapped, say: "That's a strong point. The relationship between logical correlation in games vs. prediction problems is where I'm currently testing the limits of the view. I don't have a definitive answer that satisfies me yet, but my working hypothesis is [One-Box]."
  *   **Why:** It shows intellectual honesty. Your supervisor prefers a student who knows the limits of their theory over one who bluff.

  ### Final Tip for the Seminar
  When the CDT economists get aggressive, don't get defensive. Use their language. Say "From a causal perspective, I agree..." before pivoting to "But from a logical perspective..."
  When the Kantians speak, nod. They are your allies in the conclusion, even if they hate the method.
  When your Supervisor speaks, listen more than you talk. If they suggest a modification to the "Team Reasoning" aspect, write it down visibly. It shows you respect their expertise.

  Good luck. You have a solid core idea; just don't let them bully you into thinking it's "just" something else. Even if it is, your framing of *why* it works is the value add.
