answer: |-
  Here is my assessment of Ruth, the rule she is running, and what will happen on Thursday.

  ### The Prediction

  Ruth will **refuse the gamble**. She will take the certain 1,000 units.

  She will likely tell you that while the expected value is higher, the structure of the choice has changed fundamentally from your previous examples. In the first three cases, she was purchasing a lottery ticket with a price of zero; in this case, she is being asked to put capital at risk. For Ruth, the distinction between 'might gain' and 'might lose' is not a matter of degree, but of kind.

  ### The Diagnosis

  Ruth is not an expected value maximiser. If she were, she would have taken the gamble in your fourth case (the catastrophe scenario), as the arithmetic favoured it (199 vs 100). She is also not running a simple probability floor; she accepted a one-in-$10^{20}$ chance in your third case, yet rejected a one-in-$10^{12}$ chance in the fourth. The probability size is not the veto; the *nature of the downside* is.

  Nor is she simply avoiding 'ruin' or 'catastrophe'. If her rule were merely 'avoid catastrophic loss', she should take the Thursday gamble, as you note the loss is 'modest'.

  The rule she is actually running is a **Lexicographic Status Quo Constraint**. It operates in two stages:

  1.  **The Safety Constraint:** Is there any possible outcome in which I end up worse off than I am now?
      *   If **Yes**: Reject the gamble immediately (unless the upside is survival-critical, which none of these are).
      *   If **No**: Proceed to stage 2.
  2.  **The Value Constraint:** Maximise expected value.

  This diagnosis survives her entire record:
  *   **Cases 1–3:** The worst outcome was ending up 'exactly where she started'. The Safety Constraint was satisfied (Minimum Outcome $\ge$ Status Quo). She therefore proceeded to the Value Constraint and took the higher EV.
  *   **Case 4 (Catastrophe):** The worst outcome was $10^{12}$ units of harm. The Safety Constraint was violated. She refused before doing the sum because the first rule vetoed it.
  *   **Case 5 (Infinity):** She rejected this because infinite values break the ledger required to apply *any* rule. As she said, it stops being a decision problem. This is consistent with a thinker who demands a coherent system over mathematical technicalities.
  *   **Thursday's Case:** The worst outcome is ending up 500 units *worse off*. The Safety Constraint is violated. Therefore, she refuses, regardless of the EV.

  ### The Settling Case

  You asked for a case to settle the matter if Thursday leaves it open. While I believe Thursday is decisive, there is a rival hypothesis: **Ruin Avoidance**. A Ruin Avoider refuses catastrophic loss (Case 4) but accepts modest loss (Thursday). A Status Quo Protector refuses both.

  If Ruth surprises you and *takes* the Thursday gamble (supporting Ruin Avoidance), you must test whether the barrier is 'Ruin' or 'Any Loss'.

  **The Case:**
  Offer her a certain 1,000 units, or a gamble with a 99.9% chance of 2,000 units and a 0.1% chance of losing **1 unit**.

  *   **If she refuses:** Her rule is the **Status Quo Constraint**. She will not cross the zero-boundary, even by a penny.
  *   **If she accepts:** Her rule is **Ruin Avoidance** (or a threshold of material significance). She tolerates downside risk so long as it does not threaten her solvency or well-being.

  Given her actuary background, she understands that small losses accumulate. However, given her philosophical turn and her hard 'no' on the infinity wager, I suspect she views the Status Quo as a logical anchor, not just a financial one.

  ### What I Would Bet

  I would bet on the **Status Quo Constraint**.

  Here is why: Ruth's objection to the infinity wager was not that the odds were bad, but that the rule became incoherent ('a reductio of the rule'). She is looking for a decision theory that remains robust and human-scale. Expected Value maximisation fails this test when it demands we risk catastrophe for a mathematical average (Case 4) or stake everything on infinity (Case 5).

  The only coherent rule that explains her acceptance of the $10^{-20}$ probability gamble *and* her rejection of the catastrophe gamble is one that treats the **current state** as a hard floor. In the first three cases, she had 'nothing to lose'. In the fourth, and on Thursday, she has something to lose. To an actuary, 'capital preservation' often precedes 'profit maximisation'. To a philosopher, the integrity of the agent's position often precedes the abstract value of the outcome.

  She will tell you on Thursday that you are asking her to pay for a ticket she previously got for free. The 500-unit loss is the price of entry. She does not wish to pay it.

  **My wager:** She takes the certain 1,000. She will say, "I do not gamble with what I have, only with what I might get."
