answer: |-
  Here is the brainstorming process, followed by the committed answer.

  ### Brainstorming Candidate Concepts

  1.  **The Homunculus Fallacy:** This is the classic philosophical term for exactly this structure. It comes from the idea of a "little man" (homunculus) inside the head watching the "movie screen" of your vision. If you explain vision by saying "a little man sees the image," you haven't explained vision; you've just assumed a smaller version of the thing you're trying to explain.
      *   *Fit:* High. Matches your "face detector" and "language instinct" examples perfectly.
      *   *Caveat:* Historically tied to philosophy of mind, but structurally applies to your market example too.

  2.  **Dormitive Virtue (Molière's Opium):** This is the one-step version you mentioned. A doctor explains opium puts you to sleep because it has a "dormitive virtue" (sleeping power).
      *   *Fit:* Medium. It captures the vacuousness, but as you noted, your pattern is multi-step (a stack of decompositions), whereas this is usually a single tautology.

  3.  **Explanatory Regress:** This describes the *consequence* of the error (you get an infinite chain of explanations) rather than the error itself.
      *   *Fit:* Low. It describes the symptom, not the diagnosis.

  4.  **Question-Begging (Circularity):** In logic, this is assuming the conclusion in the premise.
      *   *Fit:* Low. Your examples aren't logically circular in a formal sense; they are *explanatorily* empty. You can logically have a face detector inside a visual system, but it doesn't help you understand *how* vision works unless you explain the detector.

  5.  **Homuncular Functionalism:** This is Daniel Dennett's specific twist on the Homunculus Fallacy. He argues that using a "little man" isn't always a fallacy, *provided* you break that little man down into even smaller, stupider men eventually.
      *   *Fit:* Very High. This provides the "carving" you asked for (how to tell the good version from the bad version).

  ***

  ### The Committed Answer

  The established name for this pattern is **The Homunculus Fallacy**.

  However, based on your description—specifically that you are looking for the difference between a *legitimate* decomposition and a *vacuous* one—the precise concept you need is the distinction between an **Undischarged Homunculus** (the error) and **Homuncular Functionalism** (the valid engineering approach).

  Here is the breakdown of why this fits, where your intuition is spot-on, and the "sharp test" you asked for.

  #### 1. Why "Homunculus Fallacy" fits
  The term comes from 17th-century biology (the idea that a sperm contained a tiny fully-formed human), but in philosophy of mind, it was popularized by Gilbert Ryle and later Daniel Dennett.

  Your examples are textbook homunculi:
  *   **Vision:** "The brain sees faces." -> "How?" -> "It has a face detector." -> "How does the detector work?" -> "It has a little man inside who recognizes faces."
  *   **Economics:** "The market allocates resources." -> "How?" -> "Firms compete to allocate resources." -> "How do firms know how to allocate?" -> "The CEO decides how to allocate."

  In both cases, you have pushed the "magic" (the capacity to see, the capacity to allocate) down a level without reducing its complexity. You have created a nested Russian doll of capabilities where the smallest doll is just as magical as the largest one.

  #### 2. The Carving: Legitimate Decomposition vs. Relabeling
  You asked: *What separates a step that's a legitimate "the smaller part already does it" from one that's just relabeling the big thing?*

  This is where Daniel Dennett's work (specifically in *Brainstorms* and *Consciousness Explained*) provides the exact tool you need. Dennett argues that **it is okay to use a homunculus, as long as you fire it.**

  Here is the sharp test, translated into backend engineering terms:

  **The Stupidity Test (or The Complexity Budget)**
  When you decompose a system function `A` into sub-functions `B` and `C`:
  *   **Vacuous (Fallacious):** `B` and `C` require the same level of "intelligence" or "complexity" as `A`. You haven't solved the problem; you've just created a recursive call without a base case.
      *   *Example:* `def recognize_face(image): return face_detector.lookup(image)` where `face_detector` is just another neural net that requires the same training data and compute. You haven't explained recognition; you've outsourced it.
  *   **Legitimate (Functionalism):** `B` and `C` are **stupider** than `A`. They do less. They are more mechanical.
      *   *Example:* `def recognize_face(image):` breaks down into `edge_detect()`, `contrast_adjust()`, and `pattern_match()`.
      *   `edge_detect` doesn't "know" what a face is. It just checks if pixel A is darker than pixel B. It is "stupider" than the face recognizer.
      *   `pattern_match` doesn't "know" what a face is. It just checks if vector X aligns with vector Y.

  **The Rule:** A decomposition is explanatory only if the sub-components are **less competent** than the system they compose.

  If your sub-components can do the whole job themselves, you haven't decomposed anything; you've just hidden the implementation details. If your sub-components are "blind" (they only do simple logic, arithmetic, or mechanical actions), and the *arrangement* of those blind components produces the smart behavior, you have successfully **discharged the homunculus.**

  #### 3. Applying the Test to Your Examples

  *   **The Visual System (Face Detectors):**
      *   *Bad:* "There is a neuron that fires when it sees a face." (This is the "Grandmother Cell" theory). If that neuron needs to "see" the face to fire, you have a homunculus inside the neuron.
      *   *Good:* "There is a network of neurons that detect edges, which feed into neurons that detect shapes, which feed into neurons that detect configurations." The edge detector is blind to faces. It only knows "light vs dark." The homunculus is discharged because the bottom layer is stupid.

  *   **The Market (Firms Allocating):**
      *   *Bad:* "The market is efficient because firms try to be efficient." This assumes the firm has the same god-like knowledge of resource allocation as the whole market. It pushes the magic down but keeps it magic.
      *   *Good:* "The market is efficient because firms try to maximize profit via local price signals." The firm doesn't need to know how to "allocate resources efficiently" globally; it just needs to follow a simple rule: "Buy low, sell high." The global capacity (efficiency) emerges from local, stupider rules (profit seeking).

  *   **Language (Language Instinct):**
      *   *Bad:* "Humans speak because they have a language module." If the module contains rules of grammar that are as complex as human language, you haven't explained anything.
      *   *Good:* "Humans speak because they have a recursive combinatorial system." If the "instinct" is just a simple rule like "combine two symbols to make a new meaning," that is simpler than full language. (Though linguists still debate if this is truly discharged).

  #### 4. Summary for the Engineer

  You hit the nail on the head with your final question: *"Is the answer simply to keep decomposing until the little men inside stop being little men?"*

  **Yes.** That is literally the philosophical solution.

  *   **The Fallacy:** Stopping the decomposition while the components still possess the high-level capacity you are trying to explain. (Infinite recursion).
  *   **The Solution:** Decomposing until the components are "mindless" mechanisms (logic gates, chemical reactions, simple incentives) that could not possibly do the job on their own, but do it together. (Base case reached).

  In philosophy of science, we call a successful explanation one that **reduces the mystery.** If your sub-components are just as mysterious as the system, you have committed the Homunculus Fallacy. If your sub-components are boring, mechanical, and well-understood, you have achieved **Homuncular Functionalism.**

  **The Label:** The Homunculus Fallacy (specifically, failing to discharge the homunculus).
  **The Test:** Do the sub-components require the same capacity they are supposed to explain? If yes, it's a relabeling. If no, it's a reduction.
