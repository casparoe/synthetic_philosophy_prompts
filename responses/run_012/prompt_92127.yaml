prompt: |-
  I run a small forecasting team — six analysts, selling probability estimates on political and regulatory events to institutional clients — and our recurring methodological headache is that a growing share of what arrives is soft evidence: not facts but stated confidence. A stringer writes that she puts the odds of a deal closing near 70%. A photo interpreter says the object in the imagery is probably a launcher, maybe 60/40. An analyst comes back from a meeting "fairly sure, though not certain" that the regulator will delay. We get a dozen of these a week. Everyone currently handles them by feel, and the numbers stop being defensible the moment a client asks how a particular report moved an estimate.

  Please write the procedure my team should follow: a checklist, in order, for converting a stated confidence into a revised probability for the hypothesis we actually care about, and for recognising when that is the wrong operation and the source has to be modelled explicitly instead. Ground it in the theory of updating on uncertain evidence — probability kinematics — but preserve what the theory actually says while making it runnable by an analyst who has never seen the formalism. I want the procedure to force a decision among the three routes that give different answers: updating directly on the source's stated confidence; treating the report as a proposition and conditioning on the fact that the report was made; and expanding the model with an explicit error or reliability node. Say which one the procedure should default to, when the default is wrong, and why the three diverge. It has to handle the cases that break the simple rule: evidence that bears on the conditional probabilities within the partition rather than only on the probabilities of the cells — what the rigidity requirement asks for, and what an analyst should do when it plainly fails; a report about something we had assigned probability zero; a source whose reliability is unknown and plausibly correlated with what is being reported; and successive reports on different partitions, where I understand the order of arrival can change the final answer, so the procedure must say how to fix and record an order. Mark the steps that are judgment dressed up as arithmetic, and say where an analyst must stop and escalate to me because the dispute is about what to assume rather than what to compute. Assume the analyst has thirty minutes and no ability to fit anything, that a departure from the protocol has to be recorded in the client note, and that I sign off on those departures.

  Then run the procedure on three cases: (a) a source with a documented track record who reports roughly 70% confidence that a deal closes; (b) an interpreter with no track record who reports roughly 60% confidence in an identification, where the base rate of such objects in that region is very low; and (c) two reports arriving the same morning, in a given order, where the procedure's own output depends on that order and the honest answer is one my team will not want to hear. Carry the numbers through at least in outline. Finish with a frank paragraph on what this procedure cannot do — I want the reasoning rather than a reading list — and in particular on the failure mode I should expect to see first once my analysts are using it.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Context:** Small forecasting team (6 analysts), selling probability estimates on political/regulatory events to institutional clients.
      *   **Problem:** Influx of "soft evidence" (stated confidence, e.g., "70% sure," "probably a launcher"). Current handling is ad hoc ("by feel"), leading to indefensible numbers when challenged.
      *   **Task:** Write a standard operating procedure (SOP)/checklist for converting stated confidence into revised probabilities.
      *   **Theoretical Basis:** Probability Kinematics (Jeffrey's Updating), but made runnable for non-mathematicians.
      *   **Key Decision Points:** Must force a choice among three routes:
          1.  Updating directly on stated confidence (Jeffrey's).
          2.  Treating the report as a proposition (Standard Conditioning).
          3.  Expanding the model with a reliability node (Bayesian Network approach).
      *   **Specific Constraints/Edge Cases:**
          *   Default route + when it's wrong + why they diverge.
          *   Rigidity requirement failure (evidence bears on conditional probabilities).
          *   Probability zero events.
          *   Unknown/correlated source reliability.
          *   Successive reports (order dependence).
          *   Mark judgment vs. arithmetic steps.
          *   Escalation points (Manager sign-off).
          *   Time limit: 30 mins per case.
          *   No fitting/optimization allowed.
          *   Departure log required.
      *   **Application:** Run the procedure on three specific cases (a, b, c).
      *   **Conclusion:** Frank paragraph on limitations and expected first failure mode.

  2.  **Theoretical Grounding (Mental Sandbox):**

      *   *Standard Conditioning:* $P(H|E) = P(E|H)P(H) / P(E)$. Requires $E$ to be certain (E happened). Problem: Soft evidence isn't certain.
      *   *Jeffrey's Updating (Probability Kinematics):* $P_{new}(H) = P(H|E)P_{new}(E) + P(H|\neg E)P_{new}(\neg E)$. Requires "Rigidity" (Stability): $P(H|E)$ remains unchanged by the update. This is the "Updating directly on confidence" route.
      *   *Reliability Node:* $P(H|Report)$. Requires modeling $P(Report|H)$ and $P(Report|\neg H)$ (Likelihood Ratio). This handles source reliability explicitly.
      *   *Divergence:*
          *   Jeffrey's assumes the *uncertainty* is in the world state $E$, not the report's truth.
          *   Conditioning assumes the report *is* the fact $E$.
          *   Reliability Node assumes the report is a noisy signal about $H$.
      *   *Rigidity Failure:* If learning the report changes *how* $E$ relates to $H$ (e.g., the source is lying specifically when $H$ is true), Jeffrey's fails.
      *   *Order Dependence:* Jeffrey's updating is generally order-independent *if* partitions are the same, but if reports affect different variables or reliability is updated sequentially, order matters. Actually, standard Jeffrey conditioning on the *same* partition is order independent. But if we are updating reliability (learning about the source), order matters. The prompt implies order dependence is a risk to manage.

  3.  **Drafting the Procedure (The "Protocol"):**

      *   *Goal:* Actionable, 30-minute limit, forces the 3-route choice.
      *   *Structure:*
          1.  Intake & Triage (Is this soft evidence?).
          2.  Route Selection (The Core Decision).
          3.  Calculation (The Math).
          4.  Validation & Escalation.
      *   *Route 1 (Jeffrey):* Default for "fuzzy facts."
      *   *Route 2 (Conditioning):* When the report *is* the event (e.g., "I filed the paper").
      *   *Route 3 (Reliability):* When source trust is the main variable.
      *   *Escalation:* Rigidity checks, Zero probabilities, Correlated reliability.

  4.  **Refining the Theory for Analysts:**

      *   Avoid terms like "Radon-Nikodym derivative." Use "Stability Check."
      *   Explain *why* the routes diverge:
          *   Jeffrey: "The world is fuzzy."
          *   Conditioning: "The report is fact."
          *   Reliability: "The source is noisy."
      *   *Rigidity:* Does knowing the source said X change how much X implies Y? If yes, Jeffrey's is out.

  5.  **Developing the Three Cases:**

      *   *Case (a):* Track record source, 70% deal close.
          *   *Analysis:* Source reliability is known. This suggests Route 3 (Reliability) is actually better, but Jeffrey (Route 1) is the default. If track record is *strong*, we can calibrate. Let's make it a Jeffrey case that *should* be Reliability, or a Jeffrey case that works. Let's follow the protocol's default. Protocol should probably default to Jeffrey for speed, but escalate if reliability is key. Actually, if track record is documented, we can convert their 70% to a likelihood ratio. Let's stick to the prompt's request: "Run the procedure."
          *   *Decision:* Default to Jeffrey (Route 1) but check Rigidity. If track record allows converting confidence to likelihood, Route 3 is better. Let's assume the protocol defaults to Jeffrey for "stated confidence" but flags track records for Route 3.
          *   *Correction:* The prompt asks me to write the procedure that *forces a decision*. I should design the procedure to pick the *right* one.
          *   *Revised Plan:* Procedure defaults to Route 1 (Jeffrey) for speed, *unless* reliability is the main uncertainty (Route 3).
          *   *Case A:* Documented track record. This implies we know their calibration. Route 3 is appropriate.
      *   *Case (b):* No track record, low base rate (Launcher).
          *   *Analysis:* Base rate neglect risk. "60% confidence" from an uncalibrated source on a rare event. Rigidity likely fails (source might be guessing). Route 3 is needed but reliability is unknown. This requires Escalation (Manager sign-off on reliability assumption).
      *   *Case (c):* Two reports, order dependence.
          *   *Analysis:* This highlights the non-commutativity of learning about source reliability vs. updating the event. If Report 1 updates Source Reliability, Report 2 hits a different prior.
          *   *Honest Answer:* The order *does* change the result, and we must record the order. The "unwanted truth" is that the final probability is path-dependent.

  6.  **Writing the Content - Section by Section:**

      *   **Title:** Protocol 70-B (Soft Evidence Intake).
      *   **Introduction:** Purpose and Scope.
      *   **The Three Routes:** Define them simply.
      *   **The Checklist:** Step-by-step.
      *   **Escalation Triggers:** When to stop.
      *   **Case Studies:** Apply the checklist.
      *   **Limitations:** The "Frank Paragraph."

  7.  **Addressing Specific Constraints:**

      *   *30 Minutes:* Keep calculations simple (odds form).
      *   *No Fitting:* Use heuristics for reliability (e.g., "High/Med/Low").
      *   *Departure Log:* Include a template.
      *   *Judgment vs. Arithmetic:* Explicitly label steps.
      *   *Rigidity:* Explain the "Stability Test."
      *   *Zero Probability:* Address the "Regularization" need (never 0 or 1).
      *   *Order Dependence:* Address in Step 6 (Sequencing).

  8.  **Refining the "Frank Paragraph":**

      *   What's the first failure mode? Analysts will game the "Reliability" input to get the output they want. Or they will treat the "Stability Test" as a box-ticking exercise. The most likely failure is *false precision*—thinking the math validates the guess. I need to highlight that the math doesn't fix bad inputs.

  9.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is Jeffrey's Updating actually the default?
      *   *Correction:* In forecasting, treating a source's confidence as a direct probability shift (Jeffrey) is common but dangerous if the source is biased. The prompt asks to ground it in probability kinematics. Jeffrey's *is* the kinematics of uncertain evidence. So Route 1 is the theoretical default for "soft evidence." Route 3 is for "noisy sensors."
      *   *Distinction:*
          *   Route 1 (Jeffrey): We accept the source's assessment of the *state* is the new uncertainty. $P_{new}(E) = 0.7$.
          *   Route 3 (Reliability): We treat the source's statement as data $D$. We want $P(H|D)$.
      *   *Divergence:* If the source is perfectly reliable, Route 1 and 3 converge. If the source is noisy, Route 1 over-updates (takes the 70% as fact-about-the-world) while Route 3 discounts it.
      *   *Procedure Design:* Default to Route 1 (Jeffrey) *only if* the source is treated as a proxy for the world state (e.g., market pricing). If the source is a human observer, Route 3 is theoretically safer but harder. Given the 30-min constraint and "no fitting," I will set the Default to Route 1 (Jeffrey) for speed, with a mandatory "Stability Check." If Stability fails, escalate to Route 3 or Manager.
      *   *Wait, one nuance:* Jeffrey's updating requires the partition to be the same. If the source talks about $E$ and we care about $H$, we need $P(H|E)$. This is standard conditioning *within* the Jeffrey step.
      *   *Let's simplify for the analyst:*
          *   Route 1: "The World Changed." (Set P(E) to 70%).
          *   Route 2: "The Report is Fact." (Set P(E) to 100%).
          *   Route 3: "The Source is Noisy." (Calculate Likelihood Ratio).
      *   *Case C (Order):* If I update reliability on Report 1, Report 2 uses updated reliability. This creates path dependence. The procedure must mandate recording the sequence ID.

  10. **Final Polish:** Ensure tone is authoritative, procedural, and acknowledges the friction (escalation points). Make sure the math is visible but not overwhelming (Odds form is best for analysts).

      *(Self-Correction on Case C)*: The prompt says "the honest answer is one my team will not want to hear." This implies the probability *should* be different based on order, but they want to pretend it's stable. I need to make sure the procedure enforces recording the order, acknowledging the path dependence.

      *(Self-Correction on Theory)*: Jeffrey's Updating is $P_{new}(H) = \sum P(H|E_i) P_{new}(E_i)$. It assumes $P(H|E_i)$ is constant (Rigidity). If the report changes *how* E relates to H, Rigidity fails. This is the key escalation point.

      *(Final check on constraints)*: 30 mins? Yes. No fitting? Yes. Departure log? Yes.

      Let's write it.

      *Structure:*
      1.  **SOP Header**
      2.  **The Three Routes (Definitions)**
      3.  **The Procedure (Checklist)**
      4.  **Case Applications**
      5.  **Limitations & Failure Modes**

      *Math Check:*
      *   Route 1 (Jeffrey): $P_{new}(H) = P(H|E)p + P(H|\neg E)(1-p)$.
      *   Route 3 (Reliability): $Posterior Odds = Prior Odds \times LR$. $LR = P(Report|H) / P(Report|\neg H)$.
      *   Need to ensure the analyst knows how to get $P(H|E)$. That comes from the existing model.

      *Escalation:* When Rigidity fails. When P(E)=0. When Reliability is correlated with H.

      *Let's go.*
answer: |-
  # PROTOCOL 70-B: SOFT EVIDENCE INTAKE AND UPDATING
  **Effective:** Immediate | **Time Budget:** 30 Minutes/Case | **Authority:** Team Lead Sign-off Required for Deviations

  ## 1. OBJECTIVE
  To convert "stated confidence" (soft evidence) into defensible probability revisions without false precision. This protocol forces a choice between three mathematical routes. **You may not blend routes.** If the evidence does not fit Route 1 (Default), you must escalate.

  ## 2. THE THREE ROUTES
  You must select **one** path. They yield different numbers because they make different assumptions about where the uncertainty lies.

  *   **ROUTE 1: PROBABILITY KINEMATICS (JEFFREY'S UPDATING)**
      *   **Assumption:** The source's confidence *is* the new state of the world. The relationship between the event and your hypothesis is stable.
      *   **Use When:** The source is a proxy for the market/environment, or their uncertainty reflects genuine ambiguity in the event itself, not their own incompetence.
      *   **Risk:** Over-updating if the source is biased.
  *   **ROUTE 2: STANDARD CONDITIONING**
      *   **Assumption:** The report is a fact. The uncertainty is zero.
      *   **Use When:** The report *is* the event (e.g., "We filed the motion") or the confidence is effectively 100%.
      *   **Risk:** Ignores source error. Rarely appropriate for "soft" evidence.
  *   **ROUTE 3: RELIABILITY NODE (LIKELIHOOD RATIO)**
      *   **Assumption:** The report is a noisy signal. We update on the *fact the report was made*, not the content's truth.
      *   **Use When:** Source reliability is the main variable (e.g., untested stringer, known bias, technical identification).
      *   **Risk:** Requires estimating source accuracy (True Positive/False Positive rates).

  **DEFAULT:** Route 1. **You must justify any departure from Route 1.**

  ---

  ## 3. THE PROCEDURE (CHECKLIST)

  ### STEP 1: INTAKE & SANITIZATION [5 Mins]
  *   [ ] **Record Input:** Write down the exact stated confidence (e.g., "70%") and the specific proposition $E$ (e.g., "Deal closes").
  *   [ ] **Check Zero/One:** Is your current model probability for $E$ exactly 0 or 1?
      *   **YES:** **STOP.** Do not compute. Escalate to Team Lead. (See *Regularization Note* below).
      *   **NO:** Proceed.
  *   [ ] **Assign Sequence ID:** Tag this report with a timestamp and Sequence ID (e.g., `2023-10-27-01`). If multiple reports arrive simultaneously, assign an arbitrary but recorded order. **Order matters for Route 3.**

  ### STEP 2: THE RIGIDITY (STABILITY) TEST [5 Mins] **(JUDGMENT)**
  *   *Question:* If you learned the source was *wrong* about $E$, would that change how $E$ relates to your Hypothesis $H$?
  *   *Example:* If a stringer says "Deal closes (70%)" but is actually guessing based on rumor, does the rumor itself imply something different about the deal than a confirmed leak would?
  *   [ ] **Stable:** The link between $E$ and $H$ is unchanged by the source's uncertainty. $\rightarrow$ **Select Route 1.**
  *   [ ] **Unstable:** The source's uncertainty signals something about the *nature* of the evidence (e.g., they are hedging because they know the regulator is angry). $\rightarrow$ **Select Route 3.**
  *   [ ] **Unsure:** **Escalate to Team Lead.** Do not guess.

  ### STEP 3: ROUTE SELECTION & CALCULATION [15 Mins]

  #### IF ROUTE 1 (DEFAULT):
  1.  Identify your model's conditional probabilities: $P(H|E)$ and $P(H|\neg E)$. (These come from your existing forecast model).
  2.  Set $P_{new}(E)$ = Source Stated Confidence (e.g., 0.70).
  3.  **Compute:** $P_{new}(H) = P(H|E) \times P_{new}(E) + P(H|\neg E) \times (1 - P_{new}(E))$.
  4.  **Arithmetic Check:** Ensure result lies between $P(H|\neg E)$ and $P(H|E)$.

  #### IF ROUTE 3 (RELIABILITY):
  1.  **Estimate Reliability (JUDGMENT):** Assign a True Positive Rate (TPR) and False Positive Rate (FPR) based on track record or heuristic (e.g., "Uncalibrated Analyst" = TPR 0.6, FPR 0.4). **Do not fit these numbers.** Use the Team Heuristic Table.
  2.  **Calculate Likelihood Ratio (LR):** $LR = TPR / FPR$.
  3.  **Compute:** Convert Prior $P(H)$ to Odds. $\text{Posterior Odds} = \text{Prior Odds} \times LR$. Convert back to Probability.
  4.  **Note:** If this is the 2nd+ report of the day, use the *updated* reliability estimate if Report 1 changed your view of the source.

  ### STEP 4: DEPARTURE LOG & SIGN-OFF [5 Mins]
  *   [ ] **Standard:** If Route 1 used and Rigidity passed, file report.
  *   [ ] **Departure:** If Route 3 used, or Rigidity failed, or Sequence Order was swapped:
      *   Complete **Form 70-B-DEV**.
      *   State clearly: "Departure from Default Route 1 due to [Reason]."
      *   **Team Lead Sign-off Required.**

  ---

  ## 4. CASE APPLICATIONS

  ### CASE (a): Documented Track Record, 70% Deal Confidence
  *   **Input:** Source $S$ (Track Record: 80% calibrated) says $P(\text{Deal}) = 0.70$.
  *   **Step 1 (Intake):** $E = \text{Deal Closes}$. $P(E) \neq 0,1$. Sequence ID: `AM-01`.
  *   **Step 2 (Rigidity):** Is the link between Deal and Hypothesis (e.g., "Stock rises") stable? Yes. A deal is a deal regardless of who predicts it.
  *   **Step 3 (Route):**
      *   *Protocol Default:* Route 1.
      *   *Analyst Judgment:* Source has a *track record*. This implies we know their error rate. Route 1 treats their 70% as the *world's* 70%. Route 3 treats their 70% as a *signal* to be decoded.
      *   *Decision:* **Departure to Route 3.** Why? Because we have data on the source's calibration. Route 1 ignores the fact that an 80% calibrated source saying "70%" might actually imply a different underlying probability than a perfect source saying "70%".
      *   *Calculation (Outline):*
          *   Prior $P(H) = 0.50$ (Odds 1:1).
          *   Source Calibration: When they say 70%, deals close 65% of the time (empirical).
          *   Effective $P_{new}(E) = 0.65$.
          *   Apply Jeffrey's (Route 1) using *calibrated* 0.65, OR apply Route 3 using LR derived from calibration.
          *   *Result:* Revised $P(H)$ moves less than if we took 0.70 at face value.
  *   **Step 4:** Log Departure. Reason: "Source calibration data available; raw confidence adjusted for historical bias."

  ### CASE (b): No Track Record, 60% Launcher ID, Low Base Rate
  *   **Input:** Interpreter says "Probably launcher (60%)". Base rate of launchers in region = 1%.
  *   **Step 1 (Intake):** $E = \text{Object is Launcher}$.
  *   **Step 2 (Rigidity):** **FAIL.**
      *   *Reasoning:* In a low base-rate environment, a "60% confidence" from an uncalibrated source is statistically likely to be a False Positive. The uncertainty is not in the *object*, it is in the *interpreter's ability to distinguish*. Rigidity fails because $P(H|\text{Report})$ is not stable; it depends heavily on the base rate which the source may be ignoring.
  *   **Step 3 (Route):** **Route 3 (Reliability).**
      *   *Heuristic:* Uncalibrated interpreter on rare event. TPR = 0.6 (generous). FPR = 0.1 (conservative, given base rate neglect).
      *   *LR:* $0.6 / 0.1 = 6$.
      *   *Prior Odds:* $1\% \rightarrow 1:99$.
      *   *Posterior Odds:* $6:99 \approx 1:16.5$.
      *   *Posterior Prob:* $\approx 5.7\%$.
      *   *Contrast:* Route 1 would have jumped probability massively based on the 60% figure alone, ignoring base rate.
  *   **Step 4:** **ESCALATE.** Reliability heuristics for "unknown interpreter" are not fixed. Team Lead must sign off on the TPR/FPR assumptions (0.6/0.1).
  *   **Note:** This highlights the "Base Rate Neglect" trap. The procedure forces you to confront the FPR.

  ### CASE (c): Two Reports, Same Morning, Order Dependence
  *   **Input:** Report 1 (Stringer A): "Regulator Delay 70%". Report 2 (Stringer B): "Regulator Delay 60%".
  *   **Step 1 (Intake):** Assign Order. `AM-01` (Stringer A), `AM-02` (Stringer B).
  *   **Step 2 (Rigidity):** Pass for both (Route 1 Default).
  *   **Step 3 (Route):**
      *   *Scenario:* We treat Stringer A's reliability as unknown. Report 1 updates our view of the *Regulator* AND our view of *Stringer A's value*.
      *   *The Unwanted Truth:* If we process B then A, the result differs. Why? Because if A speaks first, we update the "Regulator Delay" probability. When B speaks, we are updating from a *higher* prior. If B speaks first, we update from a lower prior.
      *   *Wait, Jeffrey's is order independent on the SAME partition.* The divergence comes if we are updating **Source Reliability** (Route 3 logic creeping in).
      *   *Procedure Fix:* If using Route 1 strictly, order does not matter for the final $P(H)$. **However**, if the analysts suspect the sources are correlated (e.g., both read the same leak), Rigidity fails.
      *   *The "Honest Answer":* If we treat the sources as independent signals (Route 3), order *shouldn't* matter mathematically, **unless** the first report updates our belief in the *second source's reliability* (e.g., "A said X, now B says X, B looks more reliable").
      *   *Protocol Requirement:* If the team suspects correlation, they must **Group** the reports and treat them as a single composite evidence node, rather than sequential updates.
      *   *Case Outcome:* Analysts want to say "75%". Procedure forces: "Report 1 moved to 65%. Report 2 moved to 70%." If they swap order, they must record it. If the numbers change significantly based on order, **Escalate**. It indicates the "Independence Assumption" is broken.
  *   **Step 4:** Log Sequence ID. If swapping order changes output by >5%, Team Lead must approve the independence assumption.

  ---

  ## 5. LIMITATIONS & EXPECTED FAILURE MODES

  This procedure cannot fix bad inputs; it only makes the badness visible. The math of Probability Kinematics (Route 1) is rigorous, but it relies entirely on the **Rigidity Condition**—the assumption that learning the report doesn't change the structural relationship between the evidence and the hypothesis. In political forecasting, this is almost always false. A source saying "I'm 70% sure" often means "I have a weak signal," which implies a different causal structure than "The world is 70% determined."

  **The First Failure Mode You Will See:**
  Your analysts will game the **Reliability Heuristics** in Step 3 (Route 3). Because they cannot "fit" numbers, they will select the TPR/FPR from the Team Heuristic Table that produces the output they intuitively wanted anyway. They will treat the Likelihood Ratio as a dial to tune the forecast, rather than a constraint on it. You will see a clustering of "Reliability Adjustments" that conveniently align with the consensus view. This is not a math failure; it is an incentive failure. The procedure exposes the judgment, but it cannot stop them from making the judgment that keeps the client happy. Watch for the Departure Log: if 90% of cases are logged as "Standard Route 1" despite obvious source uncertainty, the Rigidity Test has become a box-ticking exercise.

  **Regularization Note:** If an analyst assigns $P(E) = 0$, no amount of evidence can update it (Cromwell's Rule violation). The procedure mandates escalation here because fixing a zero requires a philosophical decision to allow the impossible, not a calculation.

  **Order Dependence:** If your team complains that "the order shouldn't matter," they are correct for Route 1 (Jeffrey) on independent partitions, but wrong for Route 3 (Reliability Learning). The procedure forces you to record the order precisely because in the real world (Route 3), *learning who to trust* is path-dependent. The first source you trust sets the baseline for trusting the second. Acknowledging this is painful for clients who want a single "Current Probability," but hiding it is indefensible.
