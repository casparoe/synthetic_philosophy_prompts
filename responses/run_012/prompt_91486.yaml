      *   *Case 1 (Mosquitoes):* Malaria/Dengue. Human suffering is huge. Insect life is short. The calculus works for spraying.
      *   *Case 2 (Lawns):* Aesthetic. Human gain is tiny. Insect loss is aggregate. Hard to justify.
      *   *Case 3 (Broad-spectrum):* This is the crux. Killing the ladybug (predator) to kill the aphid (pest). Ladybugs live longer? Or rather, the *systemic* loss of future predation is a loss of future life. The half-life principle highlights the asymmetry.
      *   *Case 4 (SIT):* Non-lethal. Prevents birth. Is non-existence a harm? Compare to cutting short. SIT avoids the "cutting short" harm.
      *   *Verdict:* We need a tiered ethics of pest control. High human stakes + short insect life = okay. Low human stakes + mixed/long insect life = not okay. Broad-spectrum is out. SIT is in.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Am I just listing cases? No, I need to weave them into the reasoning about the half-life principle.
      *   *Check:* Is the half-life principle doing *structural* work? Yes, it must be the metric by which I judge the permissibility of the methods.
      *   *Check:* Word count. Need to expand on the philosophical underpinnings of the "deprivation account" of death to ensure depth.
