answer: |-
  # Session Plan: The Deli Pricing Committee
  **Topic:** Wittgenstein (Language Games, Family Resemblance, Meaning as Use)
  **Level:** 2nd Year Undergrad | **Size:** 18 Students | **Time:** 90 Minutes

  ## 1. Overview & Learning Objectives
  **The Goal:** Students will experience a normative practice that functions perfectly well without a statable definition. They will attempt to codify a rule, fail, and then observe how "correction" sustains the practice even when the rule is absent.
  **The Constraint:** No Wittgensteinian terminology (Language Game, Family Resemblance, etc.) until the final 25 minutes.
  **The Seed:** The "Phil's Deli" Sandwich Classification Problem.

  ## 2. Materials Required
  1.  **Projector/Screen:** To display the "New Item" cards one by one.
  2.  **Handout A (The Pricing Log):** A simple sheet with columns: *Item Name | Decision (Sandwich/Not) | Price Tier ($/$$) | Notes.*
  3.  **Handout B (The Definition Contract):** A half-sheet asking them to write "Necessary and Sufficient Conditions for a Sandwich."
  4.  **Role Card (The Mole):** One printed card, given secretly to one student before class starts.
  5.  **Whiteboard:** To track the "Official Deli Record" (visible to all).

  ## 3. Pre-Session Prep (The Mole)
  Arrive early. Identify one student (preferably articulate, rule-oriented, or sits near the middle). Hand them **Role Card: The Purist**.
  *   **Instruction:** "You are a new hire who read the *Old Employee Handbook*. Your private rule is: **'A sandwich must consist of two distinct slices of leavened bread.'** During the voting, vote according to this rule, even if the group disagrees. If challenged, defend your rule logically. Do not reveal this is a secret instruction unless I (the instructor) explicitly end the game."
  *   **Goal:** They will vote "No" on Wraps and Open-Faced sandwiches. The group will correct them based on precedent.

  ## 4. Run-Sheet & Timeline

  ### Phase 1: Setup (00:00 – 00:05)
  *   **Action:** Do not mention philosophy. Do not mention Wittgenstein.
  *   **Script:** "Welcome. For today, you are the Pricing Committee for 'Phil's Deli.' Phil is retiring. He never wrote down what counts as a 'Sandwich' for the Combo Deal, he just... knew. You need to take over. Your job is to look at new menu items and decide: 1) Is it a sandwich? 2) Does it get the Combo Price? Consistency matters for the customers. We will go item by item."
  *   **Board:** Draw two columns: **ITEM** | **VERDICT**.

  ### Phase 2: Building Precedent (00:05 – 00:25)
  *   **Action:** Project items one at a time. Ask for a show of hands (Sandwich / Not Sandwich). Ask *one* student to justify. Record the **Majority Verdict** on the board as "Official Policy."
  *   **Items 1–5 (The Trap):**
      1.  **Ham on Sliced Wheat:** (Unanimous Yes). *Board: YES.*
      2.  **Hot Dog in a Bun:** (Seed: Yes). *Board: YES.* (Some pushback expected).
      3.  **Burrito:** (Seed: No). *Board: NO.*
      4.  **Turkey Wrap:** (Seed: Yes). *Board: YES.* (**Mole Moment 1:** The Mole votes No. Let a student correct them: "But we just did the Hot Dog, bread doesn't have to be sliced." Mole accepts reluctantly).
      5.  **Open-Faced Turkey:** (Seed: Yes). *Board: YES.* (**Mole Moment 2:** Mole votes No. "It's one slice." Group: "Phil always counted the Club Deluxe as a sandwich." Mole is overruled).
  *   **Instructor Note:** Keep the pace brisk. Emphasize that "Phil's precedent" is the authority, not logic.

  ### Phase 3: The Definition Trap (00:25 – 00:35)
  *   **Action:** Hand out **Handout B (The Definition Contract)**.
  *   **Script:** "Head Office is auditing you. They demand a written policy. You have 5 minutes. Write down the Necessary and Sufficient Conditions for a Sandwich. It must be precise enough that a robot could use it. No 'you know it when you see it'."
  *   **Activity:** Students write individually.
  *   **Collection:** Ask 2-3 students to read their definitions aloud. Write key criteria on the board (e.g., "Enclosed filling," "Bread-based," "Handheld").

  ### Phase 4: Stress Testing (00:35 – 00:50)
  *   **Action:** Resume the Item Deck. Now they must apply *their written definitions* to new items.
  *   **Items 6–10 (The Breakers):**
      6.  **Ravioli:** (Seed: No). *Board: NO.* (Fits most definitions).
      7.  **Pop-Tart:** (Seed: Waver). *Board: NO.* (Discussion: It's filled pastry. Why no? "Context." "Breakfast not lunch.").
      8.  **Calzone:** (Seed: No, but priced same). *Board: NO (but $$ price).* (Crucial: It fits "Enclosed filling" but fails the "vibe").
      9.  **Folded Pizza Slice:** (Seed: No, but joking Yes). *Board: NO.*
      10. **Two Slices of Bread, Nothing Between:** (Seed: Yes?). *Board: YES.* (Why? "It's in the bread section." "Someone ordered it." "It fits the form.").
  *   **The Crash:** Point to the Board definitions from Phase 3.
  *   **Script:** "Look at your definitions. Item 10 (Empty Bread) violates 'Enclosed Filling.' Item 8 (Calzone) fits 'Enclosed Filling' but isn't a sandwich. Item 2 (Hot Dog) violates 'Two Slices.' Your definitions are already broken. Throw them away."

  ### Phase 5: The Correction Mechanism (00:50 – 01:05)
  *   **Action:** Focus on the Mole.
  *   **Script:** "During the session, one of you was trying to stick to a strict rule while the rest of you were sticking to... whatever Phil did. [Turn to Mole]. Can you tell us what rule you were trying to use?"
  *   **Mole Reveals:** "Two distinct slices of leavened bread."
  *   **Group Reflection:** "When you voted 'No' on the Wrap, Sarah corrected you. She didn't quote a rule. What did she do?"
  *   **Expected Answer:** "She cited precedent." "She said 'We already decided that'." "She appealed to how we price it."
  *   **Key Insight:** The normativity came from the *community's reaction*, not the *rulebook*. The Mole learned the practice by being corrected, not by reading a definition.

  ### Phase 6: Debrief & Theory (01:05 – 01:30)
  *   **Action:** Now you can lecture. Connect their experience to the text.
  *   **Map the Experience:**
      1.  **Meaning as Use:** The word "Sandwich" didn't mean a specific set of ingredients; it meant "things we price and shelve together." The use determined the meaning.
      2.  **Family Resemblance:** Draw the overlapping circles *now*. Hot dogs and Wraps don't share one essential feature (bread type, enclosure, temperature), but they share a network of overlapping similarities.
      3.  **Language Games:** The Deli is a "form of life." The rules of the game are constituted by the moves the players make (pricing, ordering), not by an external logic.
      4.  **Rule-Following:** The Mole thought rules drive practice. You showed practice drives rules (which are just post-hoc summaries).
  *   **Contingency (If they stall on "Why is Calzone no?"):** Bring in the **Tomato**. "Botanically it's a fruit. Greengrocer puts it with veg. Why? Because of the *game* being played (salad vs. pie). Same object, different language game."

  ---

  ## 5. The Item Deck (Cut into Slides/Cards)
  *Use this order strictly to maximize the "Definition Trap".*

  1.  **Ham on Sliced Wheat** (Baseline)
  2.  **Hot Dog in a Bun** (Breaks "Two Slices")
  3.  **Burrito** (Clear No, establishes boundary)
  4.  **Turkey Wrap** (Breaks "Two Slices" again. **Mole Trigger**)
  5.  **Open-Faced Turkey** (Breaks "Enclosed". **Mole Trigger**)
  6.  **Ravioli** (Clear No)
  7.  **Pop-Tart** (The Waver. Fills the "Pastry" hole)
  8.  **Calzone** (The Pricing Paradox. Not a sandwich, but same price)
  9.  **Folded Pizza Slice** (The Joke. Context dependent)
  10. **Two Slices Bread, Empty** (The Form over Function. Breaks "Filling")

  ## 6. Troubleshooting: What Will Go Wrong
  | Problem | Prediction | Fix |
  | :--- | :--- | :--- |
  | **The Mole blows cover early** | Mole says "My instructions say..." in Round 1. | Pivot immediately. "Great, you're playing Devil's Advocate. Everyone else, can you convince them without a rulebook?" Use it to highlight the correction dynamic sooner. |
  | **Students demand a rule early** | "Just tell us the rule, Professor." | "Phil died without writing it. You are the authority now. If you write a rule, Head Office will hold you to it." |
  | **They agree too fast** | No debate on Hot Dogs/Wraps. | Inject friction. "A customer just complained they were charged Sandwich Price for a Wrap. They say it's a salad. Defend your pricing." |
  | **Definition Phase fails** | They write "Whatever the committee decides." | Reject it. "That's not a definition of a sandwich, that's a definition of authority. I need physical criteria." |
  | **Time overrun** | Debate on Pop-Tarts eats 10 mins. | Cut Item 9 (Pizza). Move straight to Debrief. The Pop-Tart is less crucial than the Empty Bread. |

  ## 7. Honest Limitations (For the Instructor)
  **What this activity achieves:**
  It successfully demonstrates **Anti-Essentialism**. Students will viscerally feel that no set of necessary and sufficient conditions captures the extension of the concept "Sandwich" as actually used. It also demonstrates **Normativity without Explicit Rules** (the Mole correction).

  **What this activity misses (The Real Gap):**
  It does *not* fully reproduce Wittgenstein's **Rule-Following Paradox** (PI §201).
  *   *The Activity shows:* "We can't write the rule down, but we all agree on the practice."
  *   *Wittgenstein's deeper point:* "Even if we *did* write the rule down, the rule itself cannot determine its own application. Any course of action can be made out to accord with the rule."
  *   *The Gap:* In your deli, the students rely on a shared "form of life" (they all know what bread is, what eating is). The activity stabilizes because they share a background. Wittgenstein's sceptical challenge asks: *What grounds that background?*
  *   *How to handle it:* In the debrief, acknowledge this. "Today we saw that practice is richer than definitions. Wittgenstein goes further: he argues that even the practice rests on nothing but our agreement in judgments. There is no 'super-rule' underneath the deli. There is just us, agreeing to stop correcting each other."

  **The "Tomato" Contingency:**
  If they stall on *why* the Calzone isn't a sandwich (Item 8), use the Tomato.
  *   *Ask:* "Is a tomato a fruit?" (Yes). "Put it in a fruit salad?" (No). "Why?"
  *   *Point:* The category "Fruit" shifts meaning depending on the Language Game (Botany vs. Cooking). "Sandwich" shifts depending on the Game (Deli Pricing vs. Culinary Structure). This generates the "second practice" you requested without you lecturing it.

  ## 8. Debrief Script Snippets (For the Whiteboard)
  *   **Draw the Circles:** Now draw the overlapping circles. Label them "Bread," "Filling," "Handheld," "Lunch Context." Show that "Sandwich" is the shaded intersection, but the shape changes per item.
  *   **The Mole's Lesson:** "The Mole didn't need a new rule to change their behavior. They needed *correction*. Meaning is trained, not taught."
  *   **The Shift:** "Notice Item 10 (Empty Bread). Ten years ago, Phil might have said No. Today we said Yes. The meaning of 'Sandwich' in this deli has drifted, with no announcement. Language is a city, not a building." (PI §18).
