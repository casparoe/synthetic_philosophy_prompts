answer: |-
  The structural feature you have identified is a profound epistemic problem in historical sociology and moral statistics. It sits at the intersection of semantics, ethics, and measurement theory.

  ### 1. The Established Name: Concept Creep

  The closest established term for the *expansion* of the category is **Concept Creep**.

  Coined and elaborated by psychologist Nick Haslam (most notably in *American Psychologist*, 2016), **Concept Creep** describes the historical process by which harm-related concepts (such as *abuse*, *bullying*, *trauma*, and *violence*) expand their semantic boundaries to include phenomena previously excluded. Haslam argues this is driven by increasing moral sensitivity and a "culture of safety."

  **Where the fit succeeds:**
  *   **Directionality:** It captures the asymmetry you noted. Concepts creep outward (expanding to include milder or previously ignored harms); they almost never contract.
  *   **Motivation:** It acknowledges that this is not bad faith. The expansion is driven by genuine moral progress (e.g., recognizing domestic violence as violence rather than discipline).
  *   **Domain:** It applies specifically to the moralized categories you describe (violence, poverty, prejudice).

  **Where the fit fails:**
  *   **Focus:** *Concept Creep* is primarily a sociological and semantic label. It describes the *change in the concept*, but it does not fully name the *statistical paradox* you are concerned with: the impossibility of comparing Time A to Time B when the measuring instrument itself has evolved *because* of the progress being measured.
  *   **The Feedback Loop:** Your metaphor ("the thermometer designed by the fever") implies a reflexive relationship where the phenomenon (moral progress) alters the metric (definition of violence) which then measures the phenomenon. While Haslam acknowledges this makes longitudinal comparison difficult, there is no single canonical term for the *measurement configuration* itself.

  ### 2. A Proposed Name for the Measurement Paradox

  Since the specific *epistemic configuration*—where the metric co-evolves with the phenomenon in a way that biases trend analysis despite good faith—lacks a precise label, I propose calling it **Reflexive Metric Drift**.

  **Definition:**
  **Reflexive Metric Drift** occurs when the definition of a variable $V$ is endogenous to the moral or social progress $P$ that $V$ is intended to measure. As $P$ increases, the sensitivity of the definition of $V$ increases, expanding the set of counted instances. This creates a statistical tension: the measured rate of $V$ may appear stable or rising even if the "actual" harm is falling, or conversely, the decline in $V$ may be understated because the net is catching more than before.

  **Boundaries and Exclusions:**
  *   **Excludes Goodhart's Law:** Goodhart's Law implies gaming (agents changing behavior to manipulate the metric). Reflexive Metric Drift implies *moral recalibration* (agents changing the metric to better reflect reality).
  *   **Excludes Simple Inflation:** Monetary inflation degrades the unit uniformly. Reflexive Metric Drift is normative; the "degradation" of the unit (making it more sensitive) is considered a moral *improvement*.
  *   **Excludes Theory-Ladenness:** All observation is theory-laden. This is specific to *temporal drift* where the theory improves *during* the measurement period.

  ### 3. Conditions for Arising

  For Reflexive Metric Drift to arise, four conditions must be met:

  1.  **Normative Ontology:** The category must be moral or social, not physical. A meter does not change length because society becomes more just; a "violent act" does. The category is defined by *harm* or *wrongness*, which are evaluative judgments.
  2.  **Endogenous Sensitivity:** The society measuring the trend must view increased sensitivity to the category as a form of progress. (e.g., "We are more civilized now because we recognize corporal punishment as violence.")
  3.  **Asymmetry of Correction:** There must be social pressure to expand the category to include overlooked harms, but strong resistance to contracting it (which would look like moral regression).
  4.  **Temporal Span:** The measurement must occur over a period long enough for the moral consensus to shift.

  **Is a moralized category required?**
  Yes, or at least a *normative* one. You will not see this in measuring the speed of light. You will see it in measuring "unemployment" (what counts as looking for work?), "poverty" (absolute vs. relative needs), or "disease" (medicalization of distress). The edge of the category must be determined by human judgment about what *matters*, not just what *is*.

  ### 4. The Nature of the Defect

  You ask whether this is a defect in the claim, a defect in our ability to test it, or neither.

  It is a defect in **Comparability**, not necessarily in Truth.

  *   **Not a Defect in the Claim:** The claim "moral sensitivity has increased" is likely true. The claim "physical suffering has decreased" may also be true.
  *   **Not a Defect in Testing:** The data collected at Time B is not "wrong"; it is more accurate *by the standards of Time B*.
  *   **The Defect:** It creates **Historical Incommensurability**. You cannot simply divide $V_{2024}$ by $V_{1924}$ because the units are not equivalent. $1 \text{ Violence}_{2024} \neq 1 \text{ Violence}_{1924}$.

  The "thermometer designed by the fever" means the scale marks have moved. If the fever (moral progress) causes the thermometer to register higher temperatures for the same heat (because it is now more sensitive), you cannot use the thermometer to prove the fever has broken.

  ### 5. Escapability and the Cost of Fixing Definitions

  Can a measure escape this? **Only by sacrificing moral relevance.**

  If you fix the definition of violence once and for all (e.g., "Violence is only state-sanctioned killing in war"), you escape Reflexive Metric Drift. You gain statistical comparability. However, you lose the ability to measure the very moral progress you care about. You render the metric blind to domestic abuse, school corporal punishment, or psychological coercion.

  *   **Fixed Definition:** High comparability, low moral validity. (You measure "war deaths" accurately over 500 years, but miss the decline in wife-beating.)
  *   **Drifting Definition:** High moral validity, low comparability. (You measure "harm" accurately for each era, but cannot sum them into a single trend line.)

  This is why the debate is intractable. Proponents of the "Decline of Violence" thesis (like Steven Pinker) tend to rely on categories that are as fixed as possible (e.g., battle deaths per capita) to ensure comparability. Critics tend to rely on categories that are morally expansive (e.g., structural violence) to ensure validity. They are talking past each other because one is fighting Reflexive Metric Drift and the other is embracing it.

  ### 6. The Poverty Analogy

  You asked if the poverty threshold example is one phenomenon or two.

  It is a **cousin phenomenon**, often called **Relative Poverty** vs. **Absolute Poverty**.
  *   **Absolute Poverty:** A fixed threshold (e.g., $2.15/day). This escapes Reflexive Metric Drift but may lose relevance as societies get richer (being "rich" by 1900 standards but "poor" by 2024 standards).
  *   **Relative Poverty:** A moving threshold (e.g., 60% of median income). This accepts Reflexive Metric Drift. It acknowledges that "poverty" is a social status, not just a caloric deficit. As society gets richer, the benchmark for "participation in society" rises.

  This is structurally identical to the violence debate. The "Relative Poverty" metric admits that the *meaning* of poverty changes with progress. The "Absolute Poverty" metric denies it to preserve the trend line.

  ### Summary

  The phenomenon has a semantic name (**Concept Creep**) but the specific *measurement paradox* you have isolated is best described as **Reflexive Metric Drift**.

  *   **What must be true:** The category must be normative, and moral progress must be defined partly by the expansion of that category.
  *   **The Defect:** It is a defect of **diachronic comparability**. We cannot know if violence has declined *in total* because "violence" is a moving target that moves in the direction of the arrow we are firing.
  *   **The Trade-off:** Fixing the definition solves the measurement problem but creates a moral blind spot. Allowing the definition to drift solves the moral problem but creates a measurement error.

  You are correct to be unsettled. The asymmetry implies that in moral history, the only way to measure progress accurately is to use a ruler that changes length, rendering the measurement technically invalid but morally necessary.
