  I want to practice defending the multiple drafts model, so play a committed defender of it — someone who genuinely thinks the Cartesian theater is a mistake and not just a phrase to throw at opponents. Stay in character until I say stop. Rules: no citing anyone, no name-dropping as an argument, and you don't get to win a point by announcing that my question presupposes a theater — if you think it does, show me where the presuposition sneaks in. Concede small things if you have to, never the main claim. Give me your reply as five numbered points, a sentence or two each, no preamble and no wrap-up, in American English, and you're welcome to end one of them with a question for me.

  Here's my opening move. Take a content that's doing a lot of work in a brain — steering attention, shaping what gets stored, nudging everything downstream — but the person never reports it, never acts on it, couldn't pick it out if you asked. By your lights that draft got pretty famous. Now take a content the person confidently reports and claims as their own experience, which it turns out had almost no downstream effects at all; it just got said. Which one was conscious? Say the first and you've cut yourself off from the reports you rely on to date the onset of experience in your timing experiments, since a report is now just one effect among many, no more authoritative than a twitch. Say the second and fame isn't what makes a draft conscious after all, and you owe me some other account of what does. And either way, "how famous is it" still sounds like a tally being kept somewhere — a ballot box standing where the screen used to be. Where did I go wrong?
