answer: |-
  The room was not a tavern. There was no music, no laughter, no smell of roasted meat. It was a chamber of white stone, lit by oil lamps that burned without flickering. In the center sat a table, and upon it, a single krater of wine mixed with water—half and half, the law said.

  Lysander sat on one side. On the other sat the Examiner, an old man named Cleon whose face was as dry as parchment. Cleon held a stylus and a wax tablet. He did not drink. His eyes were clear, unblinking, the eyes of a hawk watching a field mouse.

  "Drink, Lysander," Cleon said. His voice was flat. "The city requires certainty."

  Lysander lifted the cup. He was a candidate for the Council of Guardians. In the streets, he was known as a gentle man. He carried old women's baskets; he mediated disputes between neighbors without raising his voice. He believed in his own goodness. But the Law of Dion, derived from the old Athenian's texts, stated that virtue untested by pleasure was merely fear in disguise. To rule, one had to prove they could master the beast within when the chains of reason were loosened.

  He drank. The wine was heavy, sweet, and dark.

  For the first hour, nothing happened. They spoke of trivialities: the harvest, the weather, the price of bronze. Lysander felt warm, comfortable. He felt *more* like himself, actually. The tightness in his shoulders, the constant vigilance of being a good man, began to unwind. Was this the truth? That beneath the stress of virtue lay a relaxed, benevolent soul?

  "Another," Cleon said.

  Lysander drank. The room seemed to soften at the edges. The silence between them grew less awkward and more companionable. He found himself smiling at Cleon's stern face. He felt a surge of affection for the old man, for the city, for the very stone walls. He wanted to tell Cleon how much he loved his neighbors. He wanted to weep with gratitude.

  "Is this it?" Lysander asked, his tongue slightly thick. "Do you see? I am happy. I am at peace."

  Cleon did not smile. He made a mark on the tablet. "Peace is easy when the world asks nothing of you. Drink."

  The third cup was harder. The warmth turned to heat. The affection curdled into a restless energy. Lysander shifted in his seat. The stone floor felt cold against his feet. He looked at Cleon's stylus scratching against the wax. *Scratch. Scratch.* It sounded like judgment.

  "Why do you write?" Lysander asked.

  "Record keeping."

  "Of what? I have said nothing wrong."

  "You have said nothing true," Cleon corrected. "The wine removes the guard. Wait."

  The fourth cup. Lysander's head swam. The white walls seemed to press in. The kindness he felt earlier evaporated, replaced by a sudden, sharp irritation. He looked at Cleon's dry hands, the way they held the stylus with such precise, arrogant control.

  "You think you know me," Lysander said. His voice was lower now, rougher.

  "I know what you show me."

  "I show you what is polite!" Lysander slammed his hand on the table. The wine jumped in the krater. "You want the truth? Here is the truth. I hate them."

  Cleon's hand paused. "Who?"

  "The people. The ones I carry baskets for. The ones I mediate for." Lysander leaned forward, his eyes burning. "They are weak. They are stupid. They bleed when I cut them, and they cry when I speak sharply. I help them because they are children. Not because I love them. Because they are pathetic."

  He breathed heavily. The words hung in the air, vicious and cold. In his sober life, Lysander would have choked on such a thought. He would have buried it under layers of duty and civic prayer. But the wine had dissolved the burial mound.

  "I despise their weakness," Lysander whispered. "And I want to rule them so they never have to make a choice again. So they never have to be brave. Because they can't be."

  He slumped back. The anger drained away as quickly as it had come, leaving him hollow. He looked at Cleon, expecting horror. Expecting the immediate disqualification, the branding of his character as unfit.

  Cleon looked down at the tablet. He did not look up. "Finish the cup."

  Lysander stared at the wine. "I said... I said I hate them."

  "You said many things."

  "Does it count?" Lysander's voice trembled. "Is that me? Or is it the grape? If I wake tomorrow and I am kind again, if I carry the baskets and I smile... was this a lie? Or was *that* the lie? Which man deserves the office, Cleon? The one who feels contempt but acts with kindness? Or the one who feels kindness because he is too sober to feel anything else?"

  Cleon finally looked up. His eyes were unreadable. There was no pity there, nor condemnation. There was only the heavy burden of the state.

  "The law does not distinguish between the seed and the soil," Cleon said softly. "It only measures the harvest. If the wine reveals a seed of tyranny, we cannot know if it would have grown. We cannot risk it."

  "But I can control it," Lysander pleaded, though he wasn't sure if he was pleading for the office or for his own soul. "I controlled it tonight. I didn't strike you. I didn't leave. I spoke the ugliness, but I did not act it."

  "Self-control is the virtue we test," Cleon said. "But we test it against the truth of your desires. If your desire is to dominate the weak, even if you restrain the hand, the desire remains. The state cannot be built on restrained contempt."

  Cleon stood up. He closed the wax tablet.

  "Go home, Lysander. Sleep. The Council will send a messenger."

  Lysander stood. His legs were unsteady. He walked to the door, the cool night air hitting his face. He looked at his hands. They were steady now. The hatred was gone, buried again behind the wall of sobriety. He felt a profound sense of loss. If the Council rejected him, they would be rejecting a man who hated the weak but served them faithfully. If they accepted him, they would be empowering a man who secretly despised those he swore to protect.

  He walked home through the silent streets. He passed a beggar sleeping in a doorway. Sober Lysander stopped. He took a coin from his purse and placed it in the beggar's hand. It was a kind act. It was a virtuous act.

  But as he walked away, Lysander couldn't shake the terror that the kindness was just a mask, and that the drunk man in the white room was the only one who had ever looked in the mirror without it. He didn't know if he was a good man pretending to be bad, or a bad man pretending to be good. And he realized, with a chill that had nothing to do with the night air, that the city didn't care which was true. They only cared which one was dangerous.
