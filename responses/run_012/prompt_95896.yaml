  **Where the Procedure Hands Back to You:**
  After **Step 3**, the script must stop. Steps 1–3 are mathematically "safe" (they remove moves a rational player would literally never choose). Step 4 (Weak Dominance) is where the model becomes fragile. If you delete a move because it is "no worse than" another, you are assuming the opponent will never play the specific column where they are equal. That is a strategic judgment, not a mathematical certainty. **Do not let the script delete on Weak Dominance.** You must own that deletion in the memo.

