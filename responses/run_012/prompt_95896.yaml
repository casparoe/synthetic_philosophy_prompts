  ### Part 2: Theoretical Constraints & Risks

  **1. Does the order of deletion matter?**
  *   **Strict Dominance (Steps 1–3):** No. You can delete strictly dominated moves in any order; the final set of surviving moves is always the same. You can safely tell the Director: *"We removed moves that were mathematically inferior in every scenario."*
  *   **Weak Dominance (Step 4):** **Yes.** The order matters. If Move A is weakly dominated by Move B, and Move C is weakly dominated by Move D, deleting A first might make D no longer dominate C.
  *   **Memo Implication:** If you use Weak Dominance, you cannot claim the result is unique. You must write: *"We prioritized removing X because Y scenario is unlikely,"* which exposes you to challenge. **Recommendation:** Stick to Strict Dominance for the script. Handle Weak Dominance manually as a "strategic assumption" rather than a "model finding."

  **2. Is "Never a Best Response" (NBR) the same as "Strictly Dominated"?**
  *   **In Two-Player Games (Your Standard Model):** **Yes.** If you allow dominance by a *mixture* of your own moves (Step 2), a move is Strictly Dominated if and only if it is Never a Best Response to any belief about the opponent. You can use these terms interchangeably in 2-player memos.
  *   **In Three-Player Games:** **No.** They drift apart. A move can be "Never a Best Response" to any *independent* mix of the two opponents (Nash assumption) but *not* Strictly Dominated (because it would be a best response if the two opponents *correlated* their moves).
  *   **Memo Implication:** If you ever model a 3-player standoff (e.g., You vs. Vendor vs. Regulator), do not equate NBR with Dominance. The script's Step 2 (Dominance) is safer than Step 3 (NBR) because Dominance does not assume the opponents act independently.

  **3. What the Procedure Cannot Do**
  *   **It cannot predict the outcome.** It only removes bad moves. If two moves survive, the model cannot tell you which one to pick without knowing the opponent's payoffs.
  *   **It cannot handle "Credibility."** A move might be mathematically dominant but strategically suicidal (e.g., dominating move triggers a lawsuit). The script sees payoffs; you see context.
  *   **It cannot solve "Weak" cycles.** If the pruning leaves a cycle (Rock-Paper-Scissors), the procedure ends with multiple moves standing. You must then write a recommendation based on risk tolerance, not model certainty.

