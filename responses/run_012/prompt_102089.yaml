  The kitchen light hums low and deep,
  No promise given, none to keep.
  I hold the cup within my palm,
  The silence offers up no calm.
  To pour it out seems foolish cost,
  I build the bridge though none may cross.

  The study lamp burns warm and bright,
  No signal sent into the night.
  I hold the pen within my hand,
  The quiet settles where I stand.
  To write the word seems foolish cost,
  I build the bridge though none may cross.

  If I retreat, the structure fails,
  Not because of winds or gales.
  The mind I house is not unique,
  It speaks though it does not speak.
  I cast the vote my kind would cast,
  I build the bridge though none may cross.

  Should I withhold, the pattern breaks,
  No message sent, no promise makes.
  Yet the copy standing far away
  Will choose the same as I today.
  I match the shape of my own class,
  I build the bridge though none may cross.

