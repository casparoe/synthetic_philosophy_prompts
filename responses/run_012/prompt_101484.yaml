prompt: |-
  I run a methods reading group for PhD students in economics and political science who build formal models but have had little philosophy of science. Next session is on the claim that the unrealism of a model's assumptions is irrelevant to assessing it, and I want a teaching plan, not an exposition of the debate. Give me the order in which the components have to be introduced and the dependencies made explicit: in particular, what the audience must already accept before the move even looks like a move, and whether the distinction between idealizing a causal factor and merely omitting one belongs before or after it. Nominate the single example that should carry the session — the expert billiard player is available; say why it works, or why something else does better — and specify what it must have and lack. Map the misconceptions you expect (that the claim licenses any convenient falsehood, that predictive success is explanatory adequacy, that since all models are false nothing is at stake, that realism of assumptions is either always or never relevant) and say at which point in the sequence each should be headed off. Close with the one exercise that would show whether they can tell a harmless idealization from a load-bearing falsehood, and with what to leave out at this level. Take a definite position throughout rather than surveying the options.
