answer: |-
  ### Teaching Plan: The Irrelevance of Assumptions

  **Definite Position:**
  Do not treat the claim (Friedman's Instrumentalism) as a live option to be weighed against realism. Teach it as a **category error**. The position you must enforce is: **Assumptions are irrelevant for *prediction* in stable environments, but essential for *validity* under intervention.** Since your students build models to inform policy or theory (which implies counterfactuals), the claim is dangerous. Assumptions are not "descriptions"; they are **causal commitments**. If the commitment is false, the model breaks when the environment changes.

  ---

  ### 1. The Carrying Example: Cournot Duopoly (Not the Billiard Player)

  **Nomination:** Reject the Expert Billiard Player. Use the **Cournot Duopoly Model**.

  **Why Cournot is Better:**
  *   **The Billiard Player** is a *success* story for instrumentalism. The physics works, the prediction holds, and the "as if" calculation is plausible. It seduces students into accepting the claim too easily.
  *   **Cournot** demonstrates *sensitivity*. In Cournot, firms assume competitors fix *quantity*. In Bertrand, they assume competitors fix *price*. Both assumptions are equally "unrealistic" (firms do neither strictly). Yet, they yield **different equilibrium prices and quantities**.
  *   **Pedagogical Value:** This proves that *which* unrealistic assumption you choose determines the outcome. Therefore, unrealism cannot be irrelevant. It forces the question: "Which assumption captures the causal mechanism of this specific market?"

  **What the Example Must Have:**
  *   **Formal Parity:** Both models (Cournot/Bertrand) must be presented as mathematically rigorous and internally consistent.
  *   **Divergent Results:** The equilibrium outcomes must differ significantly (e.g., price > marginal cost vs. price = marginal cost).
  *   **Empirical Ambiguity:** Do not resolve which fits data better. The point is theoretical sensitivity, not empirical fit.

  **What the Example Must Lack:**
  *   **Psychological Detail:** Do not discuss firm manager cognition. Keep it to strategic variables.
  *   **Historical Context:** Do not discuss Augustin Cournot or Joseph Bertrand. This is about structure, not history.

  ---

  ### 2. Sequence and Dependencies

  Introduce components in this strict order. Do not proceed to step *N* until the dependency of *N-1* is secured.

  **Step 1: The Claim (Friedman's Thesis)**
  *   **Content:** State the claim clearly: "The realism of assumptions is irrelevant; only the accuracy of predictions matters."
  *   **Dependency:** Students must accept that **models are tools for a purpose**. If they think models are "truth," the debate is moot.
  *   **Head Off Misconception:** *"This licenses any convenient falsehood."*
      *   **Intervention:** Immediately constrain the claim. It applies only to *predictive* accuracy in *stable* contexts. It does not apply to policy design.

  **Step 2: The Example (Cournot vs. Bertrand)**
  *   **Content:** Present the two models. Highlight that both rely on "unrealistic" assumptions about firm behavior. Show the divergent predictions.
  *   **Dependency:** Students must accept that **different assumptions yield different predictions**. If they think all oligopoly models converge to the same result, the argument fails.
  *   **Head Off Misconception:** *"Predictive success is explanatory adequacy."*
      *   **Intervention:** Ask: "If both predict well in Year 1, but we change a tax in Year 2, will both predict the change correctly?" Force them to see that prediction $\neq$ explanation.

  **Step 3: The Distinction (Idealization vs. Omission)**
  *   **Content:** Distinguish between **Idealizing a Causal Factor** (e.g., assuming friction is zero to isolate gravity) and **Omitting a Causal Factor** (e.g., ignoring gravity entirely).
      *   *Placement:* This comes **after** the Example. Students now feel the problem (assumptions change results); now give them the tool to diagnose *why*.
      *   *Application:* In Cournot, assuming quantity-setting is an **idealization** of strategy (simplifying a complex process). Ignoring capacity constraints might be an **omission**.
  *   **Dependency:** Students must accept that **some factors are structurally necessary** for the mechanism to hold.
  *   **Head Off Misconception:** *"Since all models are false, nothing is at stake."*
      *   **Intervention:** Argue that idealizations preserve the *direction* of the causal force, while omissions can reverse it. "False" is not a binary; it's a measure of distortion.

  **Step 4: The Verdict (Domain of Validity)**
  *   **Content:** Conclude that assumptions define the **domain of validity**. An assumption is "acceptable" only if the mechanism it represents remains operative in the target context.
  *   **Dependency:** Students must accept that **policy requires counterfactuals**.
  *   **Head Off Misconception:** *"Realism of assumptions is either always or never relevant."*
      *   **Intervention:** Finalize the position: Realism is irrelevant for *interpolation* (predicting within the sample) but critical for *extrapolation* (policy/intervention).

  ---

  ### 3. Mapping Misconceptions to Sequence

  | Misconception | When it Arises | How to Head It Off |
  | :--- | :--- | :--- |
  | **"This licenses any convenient falsehood."** | Step 1 (The Claim) | Explicitly state: "Convenience is not a criterion. Robustness is." |
  | **"Predictive success is explanatory adequacy."** | Step 2 (The Example) | Use the Cournot/Bertrand divergence. If assumptions don't matter, why do results differ? |
  | **"Since all models are false nothing is at stake."** | Step 3 (The Distinction) | Use the Map Analogy: A map that omits 'North' is useless, even if all maps distort distance. |
  | **"Realism is always/never relevant."** | Step 4 (The Verdict) | Distinguish between *descriptive* realism (irrelevant) and *structural* realism (essential). |

  ---

  ### 4. The Diagnostic Exercise

  **Task:** "The Robustness Check"
  **Setup:** Provide a one-page handout with a standard **Prisoner's Dilemma** model applied to international cooperation.
  **Instructions:**
  1.  Identify the core assumption about agent motivation (e.g., "States maximize relative gain").
  2.  Propose **one modification** to this assumption that is *less realistic* (e.g., "States maximize absolute gain").
  3.  Propose **one modification** that is *more realistic* (e.g., "States maximize gain subject to domestic audience costs").
  4.  **Question:** For each modification, does the equilibrium outcome (Cooperate/Defect) change?
  5.  **Deliverable:** Write two sentences. "The first modification is a **harmless idealization** because..." / "The second modification is a **load-bearing falsehood** because..."

  **Success Criteria:**
  *   They pass if they identify that the *less realistic* assumption (absolute gain) might actually *preserve* the mechanism (cooperation becomes easier), making it a harmless idealization for studying cooperation.
  *   They pass if they identify that the *more realistic* assumption (audience costs) might *break* the mechanism (defection becomes dominant), revealing the original model's fragility.
  *   **Failure:** If they judge "harmless" solely by descriptive accuracy rather than structural impact on the equilibrium.

  ---

  ### 5. What to Leave Out

  At this level, exclude the following to maintain focus on methodological utility:

  1.  **History of the Debate:** Do not mention Samuelson, Machlup, or the 1950s context. It distracts from the logical structure.
  2.  **Ontological Realism:** Do not discuss whether unobservables (like "utility") *exist*. Discuss only whether they *function* correctly in the model.
  3.  **Psychological Realism:** Do not dive into behavioral economics unless it serves the structural point. The issue is not whether agents are "rational," but whether the rationality assumption isolates the correct causal lever.
  4.  **Statistical Testing:** Do not discuss econometric identification. This is a session on *formal model construction*, not empirical validation.

  **Final Instruction to Instructor:**
  Do not let the session end with "It depends." End with: **"Assumptions are the engine, not the paint. You can paint the car any color (descriptive realism), but if you remove the engine (causal mechanism), it will not move."**
