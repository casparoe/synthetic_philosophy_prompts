prompt: |-
  I run a small advisory practice that prepares executives for high-stakes negotiations — union contracts, supplier standoffs, regulatory settlements — and I want to replace the credibility memo my analysts write for each client, which is currently mostly intuition dressed up as analysis, with a procedure they can run in about an hour. The job is to take any commitment the client proposes to make or to rely on — a threat to walk, a promise to hold a line, a red line, a take-it-or-leave-it — and return a verdict on whether the other side will treat it as binding. Ground it in epistemic game theory rather than folk negotiating wisdom, and keep it usable by analysts with undergraduate economics and no game theory; general counsel signs anything we put in writing, so the procedure must not smuggle in a conclusion about legality. It should make us check, in order: whether following through would be rational for the client at the moment of truth, and whether the other side can see that we can see that they see it; whether the commitment is merely public or actually common knowledge, with a rule about what kind of act creates common knowledge and why one more round of confirmation does not; whether the client's board or membership must ratify, so that the commitment has to be common knowledge in two rooms rather than one; and where the procedure stops and tells the client not to say the thing at all. Run it on two cases: a client that threatens to drop its sole supplier unless it cuts prices by eight percent, and a client that has already promised its members, in a recorded all-hands, that pensions are off the table ahead of a ratification vote. Tell me which case the procedure decides against the client's wishes, mark the steps that are judgment rather than procedure, and say where it will misfire — especially when the other side is not the forward-looking optimizer the theory assumes.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Goal:** Replace an intuition-based "credibility memo" with a 1-hour procedural checklist for analysts.
      *   **Task:** Evaluate client commitments (threats, promises, red lines) to determine if the counterparty will treat them as *binding*.
      *   **Theoretical Basis:** Epistemic Game Theory (not folk wisdom).
      *   **Target Audience:** Analysts with undergrad economics, *no* specialized game theory training.
      *   **Constraints:**
          *   Must not make legal conclusions (General Counsel reviews).
          *   Must check: Rationality at the moment of truth, Common Knowledge vs. Mere Publicity, Ratification requirements (two-room common knowledge), and a "Stop/Do Not Say" condition.
          *   Must run on two specific cases:
              1.  Supplier standoff (threaten to drop unless -8% price cut).
              2.  Union negotiation (promised members pensions are off the table).
          *   Must identify which case fails the procedure.
          *   Must mark judgment calls vs. procedural steps.
          *   Must identify failure modes (especially regarding non-optimizer counterparts).

  2.  **Theoretical Framework (Epistemic Game Theory Simplified):**

      *   *Credibility* in game theory isn't about "meaning it." It's about *subgame perfection* and *common knowledge of rationality*.
      *   A threat is credible only if carrying it out is optimal *ex post* (when the time comes to act).
      *   A promise is credible only if breaking it is costlier than keeping it *ex post*.
      *   *Common Knowledge (CK):* I know X, You know X, I know that You know X, You know that I know that You know X... ad infinitum. Mere "public announcement" is often just "Mutual Knowledge" (I know X, You know X), which isn't enough for coordination or binding commitment in high-stakes games.
      *   *Binding Mechanism:* Needs to alter the payoff structure so that deviation is irrational.

  3.  **Drafting the Procedure (The "Credibility Protocol"):**

      *   *Time Limit:* Needs to be doable in ~60 mins.
      *   *Structure:* Step-by-step logic flow.
      *   *Step 1: Ex-Post Rationality Check.* (Will we actually want to do this when the time comes?)
      *   *Step 2: Visibility & Common Knowledge.* (Do they know we know they know?)
      *   *Step 3: Principal-Agent/Ratification Check.* (Is there a second room?)
      *   *Step 4: The Verdict.* (Go/No-Go).
      *   *Legal Disclaimer:* Essential for GC.

  4.  **Developing the Two Cases:**

      *   *Case A (Supplier):* Threat to walk unless -8%.
          *   *Ex-Post:* If supplier says no, do we walk? If they are the *sole* supplier, walking shuts down production. Cost of walking > Cost of paying 8%. Threat is likely time-inconsistent.
          *   *Knowledge:* Is it CK? Probably just stated in a meeting.
          *   *Verdict:* Not credible.
      *   *Case B (Union/Pensions):* Promise to members pensions are off the table.
          *   *Ex-Post:* If union strikes over pensions, does management concede? If they already promised members "no," conceding angers members (ratification risk).
          *   *Knowledge:* Recorded all-hands. High visibility.
          *   *Ratification:* Members must vote. This creates the "two-room" CK. Management knows members know management is bound; members know management knows members know...
          *   *Verdict:* Credible (too credible, perhaps).

  5.  **Refining the Procedure for the User's Constraints:**

      *   *Epistemic Nuance:* Need to explain *why* one more round of confirmation doesn't create CK (Aumann's agreement theorem logic simplified).
      *   *Judgment vs. Procedure:* Clearly label where the analyst has to guess payoffs.
      *   *Failure Modes:* Behavioral economics (spite, reputation, irrationality).

  6.  **Writing the Content - Section by Section:**

      *   **Introduction:** Acknowledge the shift from intuition to epistemic rigor.
      *   **The Protocol (The "Binding Commitment Audit"):**
          *   Define terms simply (Ex-Post Rationality, Common Knowledge).
          *   Step 1: The Moment of Truth Test (Subgame Perfection).
          *   Step 2: The Common Knowledge Test (Aumann's Staircase).
          *   Step 3: The Two-Room Test (Ratification).
          *   Step 4: The Stop Rule.
      *   **Case Application:**
          *   Run the Supplier case.
          *   Run the Union case.
          *   Identify the "Fail."
      *   **Annotations:**
          *   Mark Judgment Calls (e.g., estimating costs).
          *   Mark Procedural Steps (e.g., checking contract clauses).
      *   **Failure Modes:**
          *   Behavioral players (reputation, anger).
          *   Information asymmetry.
          *   Legal/Regulatory shocks.

  7.  **Self-Correction/Review during Drafting:**

      *   *Critique:* Is "Common Knowledge" too abstract for undergrad econ majors?
      *   *Fix:* Use the "Email Protocol" analogy or simply define it as "No plausible deniability about mutual awareness."
      *   *Critique:* Did I avoid legal advice?
      *   *Fix:* Add explicit disclaimers that this assesses *strategic* binding, not *legal* enforceability.
      *   *Critique:* Did I answer the specific prompt about "one more round of confirmation"?
      *   *Fix:* Explicitly address the infinite regress problem in Step 2.
      *   *Critique:* Which case decides against the client's wishes?
      *   *Fix:* The Supplier case. The client *wants* the threat to work. The procedure says it won't. (Wait, re-reading prompt: "Tell me which case the procedure decides against the client's wishes." In the Union case, the client *wants* to convince the union pensions are off the table. The procedure says they *are* off the table. That aligns. In the Supplier case, the client *wants* the supplier to believe the threat. The procedure says the supplier won't believe it. That is against the client's wishes.)
      *   *Refinement on Union Case:* Actually, if the client *wants* flexibility but told members "no," the procedure says they are bound. If the client *wants* to use this as leverage against the union, it works. Let's assume the client wants the commitment to be credible in both cases. In the Supplier case, they want credibility but won't get it. In the Union case, they want credibility and will get it. So the Supplier case is the one where the procedure says "Your plan won't work."

  8.  **Final Polish:** Ensure tone is professional, advisory, and rigorous. Check word count and clarity. (Make sure to explicitly highlight the "Judgment vs. Procedure" distinction as requested).

      *(Self-Correction on the Union Case)*: Wait, if the client promises members pensions are off the table, they are tying their own hands to negotiate with the union. If the union *demands* pensions, the client cannot concede without angering members. This makes the threat to the union credible. The client *wants* this credibility to force the union to drop the demand. So the procedure supports the client's wish here.
      In the Supplier case, the client *wants* the supplier to believe the walk-away threat. The procedure shows it's not rational to walk. So the procedure says "This won't work." This is against the client's wish for the threat to be effective.

      *(Self-Correction on "One more round of confirmation")*: Need to explain that CK isn't achieved by "I confirm you received my email." It requires a public event where the state space is partitioned such that no uncertainty remains about the uncertainty. I need to simplify this for undergrads. Rule: "Public, simultaneous, unambiguous broadcast in a shared context."

  9.  **Finalizing the Output Structure:**
      1.  The Protocol (The "Epistemic Binding Audit").
      2.  Case Run-Throughs.
      3.  The Verdict (Which one fails).
      4.  Judgment vs. Procedure Markers.
      5.  Failure Modes (Behavioral/Non-optimizer).

      *Let's write it.*
answer: |-
  # The Epistemic Binding Audit (EBA)

  **Purpose:** To determine if a proposed negotiation commitment (threat, promise, or red line) will be treated as binding by a rational counterparty.
  **Time Limit:** 60 Minutes.
  **Analyst Prerequisites:** Undergraduate Microeconomics. No Game Theory training required.
  **Legal Disclaimer:** *This procedure assesses strategic credibility, not legal enforceability. It does not constitute legal advice. General Counsel must review all outputs for regulatory and contractual compliance.*

  ---

  ## Part I: The Procedure

  ### Step 1: The "Moment of Truth" Test (Ex-Post Rationality)
  *Theory:* A commitment is only credible if carrying it out is the optimal choice *after* the counterparty has called your bluff. If following through hurts you more than backing down, a rational opponent will assume you will back down.

  1.  **Define the Trigger:** What specific action by the other side forces the client to act? (e.g., "Supplier refuses 8% cut," "Union strikes over pensions").
  2.  **Compare Payoffs:** Estimate the cost to the client of **Following Through** vs. **Backing Down** at that specific moment.
      *   *Input:* Financial models, operational continuity plans, reputation estimates.
      *   *Rule:* If Cost(Follow Through) > Cost(Back Down), the commitment is **Time-Inconsistent**.
  3.  **Verdict A:** If Time-Inconsistent, mark as **Non-Binding** unless Step 3 alters the payoffs.

  ### Step 2: The Common Knowledge (CK) Test
  *Theory:* Mutual Knowledge ("I know X, You know X") is insufficient for binding commitments. Common Knowledge ("I know X, You know X, I know that You know that I know X...") removes plausible deniability. One additional round of confirmation (e.g., "Did you get my email?" "Yes") does not create CK because uncertainty about the confirmation remains (the "Email Game" paradox).

  1.  **Identify the Channel:** How is the commitment communicated?
      *   *Private Meeting:* Mutual Knowledge only. **(Fail)**
      *   *Public Press Release:* High visibility, but asynchronous. **(Weak)**
      *   *Simultaneous Public Event:* (e.g., Recorded All-Hands, Regulatory Filing, Joint Press Conference). **(Pass)**
  2.  **The "Deniability" Check:** Can the counterparty claim they misunderstood the context or severity without looking irrational?
      *   *Rule:* If the statement allows for ambiguous interpretation, it is not CK.
  3.  **Verdict B:** If not Common Knowledge, mark as **Non-Binding**.

  ### Step 3: The "Two-Room" Test (Ratification & Agency)
  *Theory:* If a principal (Board/Membership) must ratify the agent's deal, the commitment must be Common Knowledge in *both* rooms. This creates a "hand-tying" mechanism where the agent can truthfully say, "I cannot concede, even if I wanted to."

  1.  **Identify Ratification:** Does a third party (Board, Union Membership, Shareholders) have veto power?
  2.  **Check CK in Room 2:** Is the commitment Common Knowledge to the ratifiers? (e.g., Did the members hear the promise directly, or just via the negotiator?)
      *   *Rule:* If the ratifiers only know via the agent, the agent can lie to them later to facilitate a deal. CK must exist directly between Client and Ratifiers.
  3.  **Verdict C:** If Ratification is required but CK is missing in the second room, mark as **Non-Binding**.

  ### Step 4: The Stop Rule
  *If Step 1 (Rationality) fails AND Step 3 (Ratification) cannot fix it:*
  **DO NOT MAKE THE STATEMENT.**
  *Reasoning:* Making a non-credible threat signals weakness or irrationality. It invites the counterparty to call the bluff, forcing the client into a lose-lose scenario (back down and lose reputation, or follow through and lose value).

  ---

  ## Part II: Case Applications

  ### Case 1: The Supplier Standoff
  **Client:** Manufacturer with a sole-source supplier for a critical component.
  **Commitment:** "Cut prices by 8% or we terminate the contract and walk."
  **Goal:** Force price concession.

  *   **Step 1 (Moment of Truth):**
      *   *Trigger:* Supplier refuses 8% cut.
      *   *Payoff Comparison:*
          *   Follow Through (Walk): Production halts. Revenue loss estimated at $50M/month. Retooling cost $10M.
          *   Back Down (Pay): Cost increase $2M/year.
      *   *Analysis:* $50M loss > $2M cost. Rational choice is to Back Down.
      *   *Result:* **Time-Inconsistent.**
  *   **Step 2 (Common Knowledge):**
      *   *Channel:* Negotiation meeting + follow-up email.
      *   *Analysis:* Private channel. Supplier can claim "They were posturing."
      *   *Result:* **Not Common Knowledge.**
  *   **Step 3 (Two-Room):**
      *   *Ratification:* None. Client CEO has authority to sign.
      *   *Result:* **N/A.**
  *   **Step 4 (Stop Rule):**
      *   Rationality failed. No ratification to fix it.
      *   **Verdict:** **DO NOT SAY THIS.** The supplier will calculate that you will not walk. They will hold the price.

  ### Case 2: The Union Pension Promise
  **Client:** Corporate Management negotiating a new labor contract.
  **Commitment:** "Pensions are off the table. We will not offer changes to the pension plan."
  **Goal:** Prevent union strike demands on pensions; simplify negotiation.
  **Context:** Stated in a recorded all-hands meeting to employees (the union membership) prior to ratification vote.

  *   **Step 1 (Moment of Truth):**
      *   *Trigger:* Union demands pension changes as condition for deal.
      *   *Payoff Comparison:*
          *   Follow Through (Hold Line): Risk of strike.
          *   Back Down (Concede): Union leadership accepts deal, but Membership votes "No" because leadership betrayed the "off the table" promise. Deal collapses.
      *   *Analysis:* Conceding destroys the ratification probability. Holding the line preserves the path to ratification.
      *   *Result:* **Rational (Ex-Post).**
  *   **Step 2 (Common Knowledge):**
      *   *Channel:* Recorded All-Hands Meeting.
      *   *Analysis:* Simultaneous broadcast. No plausible deniability. Every member knows every other member heard it.
      *   *Result:* **Common Knowledge.**
  *   **Step 3 (Two-Room):**
      *   *Ratification:* Union Membership must vote.
      *   *CK in Room 2:* Yes. The members (Room 2) heard the promise directly from Management (Room 1), not just through Union Leaders.
      *   *Result:* **Binding.** Management cannot concede on pensions without triggering a ratification failure.
  *   **Step 4 (Stop Rule):**
      *   Rationality holds. CK holds.
      *   **Verdict:** **CREDIBLE.** The union leadership must treat this as a hard constraint.

  ---

  ## Part III: The Verdict & Analysis

  ### Which case decides against the client's wishes?
  **Case 1 (The Supplier).**
  The client *wishes* the threat to be credible to extract concessions. The EBA procedure determines the threat is **non-credible** and advises the client **not to make the statement**. If they make it, they will likely have to back down, damaging their reputation for future negotiations.

  ### Judgment vs. Procedure Markers

  | Step | Action | Classification | Why |
  | :--- | :--- | :--- | :--- |
  | **S1.2** | Estimating Cost of Walking vs. Paying | **Judgment** | Requires forecasting market conditions, retooling timelines, and revenue impact. Analysts can disagree here. |
  | **S1.3** | Determining Time-Inconsistency | **Procedure** | If Cost(A) > Cost(B), the logic is binary. |
  | **S2.1** | Classifying Communication Channel | **Procedure** | Is it private or public? Binary check. |
  | **S2.2** | Assessing "Plausible Deniability" | **Judgment** | Requires interpreting language ambiguity. |
  | **S3.1** | Identifying Ratification Authority | **Procedure** | Check bylaws/contracts. |
  | **S3.2** | Verifying CK in Second Room | **Judgment** | Did the members *really* understand the recording? (Though "Recorded All-Hands" is a strong procedural proxy). |

  ### Where the Procedure Will Misfire (Failure Modes)

  The EBA relies on **Epistemic Game Theory**, which assumes **Common Knowledge of Rationality**. It will fail in the following scenarios:

  **1. The "Irrational" Optimizer (Behavioral Failure)**
  *   **Scenario:** The Supplier CEO is prideful or vindictive.
  *   **Failure:** Even if walking is economically irrational for the Client (Step 1), the Supplier might believe the Client is *irrational* (willing to burn $50M to save $2M on principle).
  *   **Risk:** The procedure says "Don't threaten," but if the Client *does* threaten, the Supplier might concede out of fear of unpredictability. The EBA underestimates the value of "strategic irrationality" (Schelling's Madman Theory).

  **2. The Reputation Multiplier (Repeated Game Failure)**
  *   **Scenario:** The Client negotiates with 50 different suppliers annually.
  *   **Failure:** Step 1 looks at a single transaction (One-Shot Game). If backing down today signals weakness to the other 49 suppliers, the long-term cost of Backing Down > Cost of Walking.
  *   **Risk:** The procedure may flag a threat as "Time-Inconsistent" locally, when it is actually "Time-Consistent" globally due to reputation effects. Analysts must be trained to ask: *"Is this the only game we are playing?"*

  **3. The Common Knowledge Illusion (Information Failure)**
  *   **Scenario:** In Case 2 (Union), some members missed the all-hands or didn't understand the recording.
  *   **Failure:** The procedure assumes the "Recorded All-Hands" creates perfect CK. If 15% of the membership didn't see it, Union Leaders can claim "The members won't accept a deal without pension changes" and bluff the ratification risk.
  *   **Risk:** Overestimating the binding power of public statements if the "public" is fragmented.

  **4. The Legal/Regulatory Shock (Exogenous Failure)**
  *   **Scenario:** A regulator forbids the Client from walking away from the Supplier (e.g., Critical Infrastructure rules).
  *   **Failure:** The EBA explicitly excludes legal advice. If a hidden regulation makes walking *illegal*, the Rationality Check (Step 1) is flawed because the "Follow Through" option is removed from the choice set entirely.
  *   **Risk:** General Counsel must override the EBA if regulatory constraints alter the payoff matrix.

  ### Implementation Note for Analysts
  When Step 1 yields "Time-Inconsistent," do not simply output "No." Output: *"Credibility Deficit Identified. To bind this commitment, you must alter the payoff structure (e.g., post a performance bond, pre-announce a successor supplier, or delegate authority to a third party with different incentives)."* This turns a veto into a design challenge.
