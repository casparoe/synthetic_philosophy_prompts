answer: |-
  Death determination is a binary legal declaration grounded in clinical irreversibility, not a negotiation of prognosis or social status.

  **The Procedure**

  1.  **Exclude Reversible Confounders:** Is core temperature >36°C, systolic BP >100 mmHg, and are sedatives/paralytics cleared or antagonized?
      *   *Yes:* Proceed to Step 2.
      *   *No:* Stop. You cannot determine death. Treat the metabolic/toxic state. This is biology, not policy.
  2.  **Select the Criterion:** Is circulatory function being maintained by a mechanical pump (ECMO, CPB)?
      *   *Yes:* You **must** use the Neurologic Criterion (Brain Death). Circulatory criteria are invalid while the machine provides flow.
      *   *No:* You **may** use Circulatory/Respiratory OR Neurologic Criterion. Choose based on clinical context (e.g., catastrophic brain injury vs. expected cardiac arrest).
  3.  **Apply Bedside Tests:**
      *   *Circulatory:* No pulse, no heart sounds, no respiration for a defined observation period.
      *   *Neurologic:* Coma, absent brainstem reflexes, positive apnea test.
      *   *Sufficient Answer:* Documentation of absent function consistent with the chosen criterion.
  4.  **Assert Irreversibility (The Policy Layer):** Will resuscitation be attempted?
      *   *Yes (CPR will be done):* The patient is not dead. Irreversibility is negated by intervention.
      *   *No (DNR/DNI or Withdrawal):* Irreversibility is established by policy, not biology.
          *   *For Circulatory:* You must observe a "no-touch" period (state/hospital standard, typically 5 minutes) to rule out auto-resuscitation. This wait is a legal safe harbor, not a biological absolute.
          *   *For Neurologic:* You must confirm a structural cause compatible with permanent loss and exclude any possibility of recovery.
      *   *Sufficient Answer:* A valid DNR/DNI order or a documented decision to withdraw life support plus completion of the observation window.
  5.  **Declaration or Handoff:**
      *   *If Steps 1-4 are met:* Declare death. Time of death is the time irreversibility was established (end of observation window or completion of apnea test).
      *   *If Family disputes irreversibility despite valid DNR:* Do not argue metaphysics. Hand off to Ethics Committee or Legal. Do not declare death while active conflict exists unless there is a court order.
      *   *If Patient meets neither criterion (e.g., PVS):* Do not declare death. Hand off to Palliative Care/Ethics for withdrawal discussions.

  **The Convention vs. Metaphysics**
  Step 4 is where hospital convention dresses up as metaphysics. "Irreversible" does not mean "physiologically impossible to restart"; it means "we will not restart it." The 5-minute wait in DCD is not when the cells die; it is when the law allows us to say they won't come back. Acknowledge this distinction to avoid moral injury when families ask why we waited exactly 300 seconds.

  **Case Runs**

  **Case 1: VA-ECMO with no intrinsic cardiac activity.**
  *   **Step 2:** Circulation is mechanical. You **must** use Neurologic Criterion.
  *   **Step 3:** If brainstem reflexes are present, the patient is alive.
  *   **Outcome:** If the brain is intact, you **cannot** declare death, regardless of the heart's dependence on the pump. You must withdraw ECMO first, then wait for circulatory cessation. If the brain is dead, you declare death now.
  *   **Flag:** Do not declare circulatory death while on pump. It is legally indefensible.

  **Case 2: DCD donor five minutes into the standoff.**
  *   **Step 4:** Withdrawal occurred. No pulse. 5-minute observation complete. DNR active.
  *   **Outcome:** Declare death.
  *   **Flag:** The 5-minute mark is the legal trigger. Do not wait for rigor mortis. Do not shorten the window to accommodate the OPO.

  **Case 3: Persistent Vegetative State (PVS); family says she's already gone.**
  *   **Step 2:** Circulation is intrinsic.
  *   **Step 3:** Patient breathes spontaneously. Brainstem reflexes (pupils, gag) are present.
  *   **Step 4:** Function is not ceased. Irreversibility of *life* is not the standard; irreversibility of *function* is.
  *   **Outcome:** **Do not declare death.** The patient is legally alive.
  *   **Flag:** This is the outcome the family and nurses will hate. The family feels the person is gone; the nurses feel burdened by caring for a "body." You must tell them: "She is not dead. She is severely injured." If they want withdrawal of life support, that is an ethical decision regarding futility, not a medical declaration of death. Do not sign the certificate. Do not soften this. Calling her dead now is fraud.

  **Dead-Ends and Sign-Off**

  This procedure cannot settle disputes over religious exemptions to brain death, pregnancies where state law mandates somatic support regardless of brain status, or situations where family threats escalate to violence. In these dead-ends, the intensivist stops, secures the unit, and hands off to Risk Management and a Judge. When the procedure succeeds, the declaration requires two attending signatures to validate that the protocol was followed, not to agree on the philosophy. One signature confirms the data; the second confirms the policy. If they cannot both sign, the patient is not dead.
