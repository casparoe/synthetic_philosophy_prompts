answer: |-
  Here is a screening procedure designed for your constraints. It operationalizes the ethical tension rather than solving it. It fits on one page. Following the procedure, I have run it on your three cases and provided the honest assessment you asked for regarding its limitations.

  ***

  # INFRASTRUCTURE FUND: LONG-TERM IMPACT SCREEN (V2.0)

  **Purpose:** To identify projects where the standard "no harm" mandate fails due to future population changes (Non-Identity Cases).
  **Time:** 30–45 minutes.
  **Instruction:** Answer sequentially. If you stop at a "REJECT/FLAG," attach this sheet to the application. If you reach "CLEAR TO COMMITTEE," note which ethical framework justified the clearance.

  ### STEP 1: The Identifiable Victim Test
  **Question:** Are there specific, identifiable people (existing or future) who will be physically or economically worse off with this project than *they* would be without it?
  *   *Note:* "Future people" counts here only if they would exist anyway (e.g., downstream residents of an existing town).
  *   **Ethical Framework:** Person-Affecting View (Standard Mandate).
  *   **If YES:** **FLAG.** Standard mitigation required. Proceed to Step 2 only to check for residual NIP issues.
  *   **If NO:** Proceed to Step 2. (This indicates a potential Non-Identity Case).

  ### STEP 2: The Causality of Existence Check
  **Question:** Is the project the *primary cause* of the community/population existing in the affected area? (e.g., A company town, a new irrigation district enabling settlement, a road opening virgin territory).
  *   *Operational Rule:* If >50% of the affected future population is projected to migrate there *because* of the project, mark YES.
  *   *Epistemic Limit:* If demographic data is speculative, assume **YES** (Precautionary Principle).
  *   **Ethical Framework:** Metaphysical Identity Check.
  *   **If NO:** Return to Step 1 logic (Treat as Same-People case).
  *   **If YES:** Proceed to Step 3. (You are now in Non-Identity Territory).

  ### STEP 3: The Decent Minimum Threshold
  **Question:** Will the future people created by this project live lives below a "decent minimum" (e.g., severe health deficits, inability to leave, life expectancy <60, toxic dependency)?
  *   *Operational Rule:* Use WHO/World Bank baseline standards for the region, not "better than nothing."
  *   **Ethical Framework:** Threshold View (Wide Person-Affecting).
  *   **If YES (Below Threshold):** **REJECT.** Creating people destined for misery violates the spirit of the mandate even if they wouldn't otherwise exist.
  *   **If NO (Above Threshold):** Proceed to Step 4.

  ### STEP 4: The Net Well-Being Calculation
  **Question:** Does the project create a significantly higher aggregate well-being (total jobs, total GDP, total life-years) than the counterfactual, even if distributed to different people?
  *   *Operational Rule:* Standard Cost-Benefit Analysis, but explicitly count the well-being of the *new* population as a positive.
  *   **Ethical Framework:** Impersonal / Total Utilitarian View.
  *   **If NO:** **FLAG.** The project creates different people but adds no net value. Hard to justify.
  *   **If YES:** **CLEAR TO COMMITTEE.**
  *   **Mandatory Disclosure:** You must attach a note stating: *"Clearance granted on Impersonal Grounds. No specific individuals are harmed compared to their alternative (non-existence), but the outcome relies on valuing the existence of the new population."*

  ### STEP 5: The Values Escalation
  **Trigger:** If Step 3 is borderline (life is "barely worth living") OR if the project harms a small existing group to create a large future group.
  *   **Action:** Stop. Do not clear.
  *   **Note to Committee:** "This decision requires a value judgment on whether creating new people outweighs harming existing ones, or what quality of life is acceptable for future generations. This is outside technical screening."
  *   **Ethical Framework:** Explicit Values Call.

  ***

  # TEST RUNS

  ### Case 1: The Lithium Mine (Your Example)
  *   **Step 1 (Identifiable Victim):** **NO.** The people drinking water in 2090 wouldn't exist without the town. They are not worse off than their alternative (non-existence).
  *   **Step 2 (Causality):** **YES.** The town grows *around* the mine/road.
  *   **Step 3 (Threshold):** **DEPENDS.** If the aquifer leaching causes cancer clusters or renders the land uninhabitable by 2090, life is below threshold. **REJECT.** If the water is merely contaminated but life is still "normal/okay," life is above threshold. **PROCEED.**
  *   **Step 4 (Net Well-Being):** **YES.** 30 years of jobs/royalties vs. no town.
  *   **Outcome:** If the water toxicity is survivable, this screen **CLEARS** the project, but forces the disclosure that we are using the *Impersonal View*.
  *   **Why your colleague is wrong:** They stopped at Step 1. This procedure forces them to acknowledge Step 3 (Threshold). If the water makes life miserable, we reject, even if those people wouldn't otherwise exist.

  ### Case 2: The Dam (Resettlement + New Economy)
  *   **Step 1 (Identifiable Victim):** **YES.** The 4,000 resettled people exist in both scenarios. They are displaced. **FLAG.**
  *   **Step 2 (Causality):** **MIXED.** The 4,000 are Same-People. The 50,000 new valley economy workers are Different-People.
  *   **Step 3 (Threshold):** Assuming resettlement is handled properly, the 4,000 should remain above threshold. The 50,000 are certainly above threshold (new economy).
  *   **Step 4 (Net Well-Being):** **YES.** 50,000 new livelihoods vs 4,000 disrupted.
  *   **Outcome:** **FLAG for Resettlement Plan, CLEAR on NIP grounds.** The screen correctly isolates the actual harm (the 4,000) from the philosophical puzzle (the 50,000). The Committee votes on the resettlement; the NIP issue is resolved via Step 4.

  ### Case 3: The "Bite" Case (Small Group Harmed, Large Future Population)
  *   *Scenario:* A high-risk industrial corridor. 500 existing farmers lose livelihoods (but don't die). 100,000 new workers move in, creating a booming city that wouldn't exist otherwise.
  *   **Step 1 (Identifiable Victim):** **YES.** The 500 farmers exist either way and are worse off. **FLAG.**
  *   *Modification:* Let's tighten the case. The 500 farmers are compensated but suffer cultural destruction. The 100,000 new people live standard lives.
  *   **Step 3 (Threshold):** The 500 are above threshold (compensated). The 100,000 are above threshold.
  *   **Step 4 (Net Well-Being):** **YES.** Massive aggregate gain.
  *   **Outcome:** **CLEAR TO COMMITTEE (with Disclosure).**
  *   **The Bite:** This procedure *cannot* reject this project. It explicitly tells you that sacrificing the few for the existence of the many is permissible under the *Impersonal View* (Step 4). If your Fund's charter implicitly forbids "using people as means," this screen will expose that conflict in Step 5.

  ***

  # HONEST ASSESSMENT OF LIMITATIONS

  You asked where this misfires and whether it can actually tell you to reject on Non-Identity grounds. Here is the truth you need for the Committee.

  **1. The Epistemic Gap (Same vs. Different People)**
  You are correct: your desk cannot predict fertility and migration with the precision required for Step 2.
  *   **The Misfire:** If you assume "Same-People" (strict harm) when it's actually "Different-People," you might block viable projects. If you assume "Different-People" when it's "Same-People," you might approve harms that violate the mandate.
  *   **The Fix:** The procedure uses a **Precautionary Principle** in Step 2. If you aren't sure if the people would exist otherwise, treat them as if they *would*. This biases the screen toward rejection. It protects the Fund from liability but may kill innovation. You must tell the Committee: *"We are over-counting harm to avoid ethical blind spots."*

  **2. Can it Reject on Non-Identity Grounds?**
  *   **The Hard Truth:** Only via **Step 3 (Threshold)**.
  *   If the future people will have lives *worth living* (above threshold), this procedure **cannot** tell you to reject the project on Non-Identity grounds alone.
  *   Why? Because Step 1 (Person-Affecting) says "No harm." Step 4 (Impersonal) says "Net gain."
  *   To reject a project where future people are happy but wouldn't otherwise exist, you need a principle like "Nature should remain untouched" or "Population growth is bad." Your charter likely doesn't have that.
  *   **Conclusion:** If the Lithium Mine creates a town where people live normal, happy lives for 30 years before the water kills them slowly at age 70, this screen **CLEARS IT**. If you want to reject that, you are not using a "No Harm" mandate; you are using a "Preservation" mandate. This screen forces you to admit that distinction in Step 5.

  **3. The "Empty Mandate" Problem**
  You suspected your "no-harm-to-future-generations" mandate is empty on these cases. This screen confirms it.
  *   On Non-Identity cases, "No Harm" is logically vacuous (you can't harm someone by bringing them into existence, provided their life is worth living).
  *   This screen patches the hole with the **Threshold View** (Step 3). It effectively rewrites your mandate to: *"No creating future generations destined for misery."*
  *   **Recommendation:** When you hand this to the Committee, explicitly state: *"This screen interprets 'No Harm' to include 'No Sub-Threshold Existence.' If you reject that interpretation, Step 3 must be removed, and Non-Identity cases will automatically pass."*

  **4. Where the Values Call is Smuggled**
  Step 4 looks like math (Cost-Benefit), but it is actually **Impersonal Utilitarianism**. It counts the happiness of people who wouldn't exist as a "benefit" that offsets the "neutral" status of their creation.
  *   Some Committee members may believe creating people is neutral, not a "benefit" to be weighed against costs.
  *   Some may believe the identity of the victims *does* matter (No-Difference View rejection).
  *   **Requirement:** The "Mandatory Disclosure" in Step 4 is not bureaucracy; it is ethical cover. It tells the Committee: *"I am recommending this based on the view that total good matters more than specific identity. If you hold a different view, you must overturn my recommendation."*

  **Summary for your Tuesday:**
  Use this screen. It will not solve the lithium mine dilemma, but it will stop your colleague from saying "nobody is worse off, fund it" without acknowledging that they are using the *Impersonal View* to override the *Person-Affecting Mandate*. It forces the ethical framework into the light so the Committee, not you, owns the value judgment.
