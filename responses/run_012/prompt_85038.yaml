prompt: |-
  I work on the long-term impacts desk at a public infrastructure fund -- there are two of us, we get about six loan applications a month, and each one needs a one-page screen from us before it goes to the investment commitee, which signs off on whatever we recommend. Our whole screen is basically one question: who ends up worse off if we fund this? Which works fine for road widenings and flood defences. The problem is the projects that keep me up at night are exactly the ones where that question comes back empty. Last month it was a lithium mine: thirty years of jobs and royalties for a district of twelve thousand people, a tailings dam that will leach into the aquifer for a century after the mine closes, and the whole thing only happens because a road gets built and a processing town grows up around it -- so the people drinking that water in 2090 are, in a lot of cases, people who wouldnt exist if we'd said no. My colleague says then they can't complain, nobody is worse off, fund it. I don't buy it but I can't say why in a way that fits on a screen. This is the nonidentity problem, right? I've read enough Parfit to recognise the shape of it but not what to do on a Tuesday.

  So: turn whatever you actually know about this area into a screening procedure I can run in a morning and hand to a smart non-philosopher. I want the questions in order, what counts as an answer good enough to move on, where the procedure stops and says there is no basis to object, and the points where it has to stop and say this is a values call and a human decides -- and I want those marked clearly, not smuggled in as technicalities. It has to work with the person-affecting idea (something is wrong only if it makes someone worse off), the impersonal idea (an outcome can be worse even if no one is worse off), the no-difference view (the identity of the people involved makes no difference to how bad an outcome is), and threshold or decent-minimum views -- and it has to say which one it is using at each step, because I suspect the committee will hate all of them for different reasons and I need to be able to tell them which one I used. Don't give me reading lists or citations, I can't check them and neither can you, just use what you know. Then run it on two or three cases: the lithium mine above; a dam that would resettle four thousand people who exist either way but would also create a valley economy of maybe fifty thousand people who otherwise wouldn't exist at all; and one where it bites -- a project that leaves a small group badly off but is the only route by which a much larger future population exists.

  Be honest about where the procedure will misfire. In particular I want to know how it is supposed to tell the same-people cases from the different-people cases when the answer turns on guesses about migration and fertility that my desk is not remotely competent to make, and whether the procedure can ever tell me to reject a project on nonidentity grounds at all -- or whether it only ever tells me that my fund's no-harm-to-future-generations mandate is either empty or secretly requires a value our charter doesn't let me use. I'd rather find that out now than in front of the committee.
reasoning: |-
  Here's a thinking process that leads to the suggested screening procedure:

  1.  **Analyze the User and the Request:**
      *   **User Role:** Works on the long-term impacts desk at a public infrastructure fund (2 people, 6 apps/month).
      *   **Task:** Create a one-page screening procedure for loan applications.
      *   **Current Problem:** The current screen ("Who ends up worse off?") fails on Non-Identity Problem (NIP) cases (e.g., the lithium mine). Future people who suffer wouldn't exist without the project, so they aren't "worse off" than they would otherwise be.
      *   **Goal:** A practical, morning-run procedure that a smart non-philosopher can use.
      *   **Requirements:**
          *   Ordered questions.
          *   Clear pass/fail/escalate criteria.
          *   Explicitly label which ethical framework is being used at each step (Person-Affecting, Impersonal, No-Difference, Threshold).
          *   Mark where it's a "values call" vs. technical assessment.
          *   Test on three cases: Lithium Mine, Dam (resettlement + new economy), and a "bite" case (small group harmed, large future population created).
          *   Honest assessment of limitations (same-people vs. different-people, predictive competence, ability to reject on NIP grounds).
          *   No reading lists/citations.
      *   **Tone:** Professional, direct, pragmatic, philosophically rigorous but operationally viable.

  2.  **Deconstruct the Ethical Frameworks:**
      *   *Person-Affecting View (PAV):* An act is wrong only if it makes some specific person worse off than they would otherwise be. (Fails on NIP).
      *   *Impersonal View (Total/Average Utilitarianism):* An outcome is worse if the total/average well-being is lower, regardless of *who* exists. (Solves NIP but implies "Repugnant Conclusion" risks).
      *   *No-Difference View:* The identity of the people doesn't matter; suffering is bad regardless of who suffers. (Similar to Impersonal but focused on harm).
      *   *Threshold/Decent-Minimum View:* It's wrong to create people below a certain quality of life threshold, even if they wouldn't exist otherwise. (Parfit's "Wide Person-Affecting Principle" or similar).

  3.  **Drafting the Procedure (The "Screen"):**
      *   *Constraint:* Must fit the user's workflow (one page, morning run).
      *   *Structure:* Needs to flow logically from easy/consensus checks to hard/controversial ones.
      *   *Step 1: The Standard Harm Check (Person-Affecting).* This is the status quo. Does it harm *existing* or *same-future* people? If yes, flag.
      *   *Step 2: The Identity Check.* Do the harmed people exist in the counterfactual (No-Project) scenario? This distinguishes Same-People from Different-People cases.
      *   *Step 3: The Threshold Check (Threshold View).* If they are Different-People, is their life below a "decent minimum"? This allows rejection without needing to compare to non-existence.
      *   *Step 4: The Net Benefit Check (Impersonal View).* If above threshold, does the project create *more* well-being overall, even if distributed to different people?
      *   *Step 5: The Values Escalation.* If the math is ambiguous or the ethical framework is contested, kick to Committee.

  4.  **Refining the Procedure for Practicality:**
      *   *Problem:* Predicting fertility/migration is hard for infrastructure analysts.
      *   *Solution:* Use a "Causality Chain" test. Does the project *cause* the specific demographic shift? If the link is weak, treat as Same-People. If strong (e.g., company town), treat as Different-People.
      *   *Problem:* Can we ever reject on NIP grounds?
      *   *Solution:* Yes, but only via the Threshold View (Step 3). If life is "worth living" but miserable, PAV says go, Impersonal says maybe, Threshold says stop. This needs to be explicit.

  5.  **Developing the Test Cases:**
      *   *Case 1: Lithium Mine.* (The User's example).
          *   PAV: Pass (future people wouldn't exist).
          *   Identity: Different-People (town wouldn't exist).
          *   Threshold: Depends on water toxicity. If life is miserable, Reject. If life is okay but shortened, PAV says Go.
          *   Outcome: Highlights the conflict.
      *   *Case 2: Dam.* (Resettlement + New Economy).
          *   Mixed case. 4k displaced (Same-People, likely worse off). 50k new (Different-People).
          *   PAV: Flag for the 4k.
          *   Impersonal: Net gain?
          *   Outcome: Standard cost-benefit with a NIP footnote.
      *   *Case 3: The "Bite" Case.* (Small group harmed, large future population).
          *   Example: High-risk colonial settlement or aggressive expansion.
          *   PAV: Pass (future people wouldn't exist).
          *   Threshold: Are the harmed few below minimum?
          *   Impersonal: Numbers game.
          *   Outcome: Shows where the fund might be ethically exposed.

  6.  **Addressing the "Honest Assessment" (The Meta-Analysis):**
      *   *Same vs. Different People:* Acknowledge the epistemic gap. Analysts aren't demographers. Suggest a "Precautionary Principle" on identity: If unsure, assume Same-People (stricter).
      *   *Rejection on NIP:* Only possible via Threshold. If life is > threshold, the procedure *cannot* reject on NIP grounds without importing an external value (e.g., "Nature has rights" or "Identity matters").
      *   *Charter Conflict:* The "No Harm" mandate is indeed empty on NIP unless interpreted as "No creation of sub-threshold lives."

  7.  **Review and Refine (Self-Correction):**
      *   *Critique:* Is this too philosophical?
      *   *Fix:* Simplify the language. Instead of "Person-Affecting View," use "Identifiable Victim Test." Instead of "Threshold," use "Decent Life Standard." Keep the philosophical labels in parentheses for the user's report to the committee.
      *   *Critique:* Did I answer the specific question about "Tuesday"?
      *   *Fix:* Ensure the output looks like a checklist/memo, not an essay.
      *   *Critique:* The user asked to know *which* view is used at *each* step.
      *   *Fix:* Explicitly tag every question with the ethical framework.
      *   *Critique:* The user wants to know if the procedure can *ever* tell them to reject on NIP grounds.
      *   *Fix:* Be blunt in the "Limitations" section. It can only reject if life is below threshold. It cannot reject a "happy but contaminated" future population on pure NIP logic without smuggling in Impersonal values.

  8.  **Final Polish:**
      *   Organize into: The Procedure, The Test Cases, The Limitations/Truth-Telling.
      *   Ensure the tone matches a colleague speaking to a colleague (respectful, direct, no fluff).
      *   Check against the "one-page screen" constraint (keep the procedure itself tight).

  *(Self-Correction during drafting)*: I need to make sure I don't solve the philosophical problem (because it's unsolvable) but rather *operationalize* the tension. The value is in making the conflict visible to the Committee, not hiding it.

  *(Final check on constraints)*:
  - No reading lists? Check.
  - Order of questions? Check.
  - Mark values calls? Check.
  - Label ethical views? Check.
  - Run on 3 cases? Check.
  - Honest about misfire? Check.

