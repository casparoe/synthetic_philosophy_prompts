answer: |-
  To the Inquiry Concerning the Automata of Cooperation

  It is a strange fancy, that men should bind themselves by writings invisible to the eye, yet readable by the machine. Nevertheless, having considered the mechanics you describe—these artifices that examine one another's inner design before striking—I shall render my judgment. You ask if this new contrivance alters the necessity of Power, or merely disguises it. I answer thus:

  **1. On the Sword and the Covenant**
  In my *Leviathan*, I established that covenants, without the sword, are but words, and of no strength to secure a man at all. The reason is simple: he that performeth first has no assurance the other will follow, and so puts himself at a disadvantage, inviting his own ruin. The fear of a coercive power is required to compel performance, by laying before men's eyes the consequence of breach, which must be worse than the benefit of breaking faith.

  Does this arrangement of readable code count as a power? I say it does, but it is a power of a different nature. In the common covenant, the sword hangs *over* the man, threatening punishment *after* the breach. In this case of the automata, the constraint is built *into* the will of the agent *before* the act. By submitting a program that cooperates only if the other is identical, the party renders himself *unable* to defect, provided he does not alter the submission.

  Therefore, this is not mere words. It accomplishes the same work as the sovereign's sword: it removes the hope of gain from breach. However, it relocates the difficulty. The fear is no longer of a punisher, but of the logical necessity of the machine. The "sword" is the impossibility of the program acting otherwise. Yet, this holds only so long as the man cannot reach in and twist the mechanism during the act. If the man retains the power to override the automaton, we are back to mere words. If the automaton is truly master of the action, then the power is real, and the covenant is secure.

  **2. On the Passions and the Residue of War**
  I have written that the principal causes of quarrel are three: Competition (for gain), Diffidence (for safety), and Glory (for reputation).
  This arrangement of code neutralizes the first two. Competition is settled by the program seeking the greater advantage; Diffidence is removed because the inner design is laid bare. I need not guess your intent; I read it in your source.

  But Glory remains. The appetite for precedence is a hunger in the breast of the *master*, not the machine. Consider this case: Two men submit their programs. The code is perfect; it reads the other, it verifies the logic, and it cooperates. Both gain the benefit. Yet, one man sees that the other's code is more elegant, or shorter, or written in a tongue he deems superior. Or, one man suspects the other of having devised the scheme first, claiming the wit of the invention. Though the machines cooperate, the men may fall to blows over the precedence of intellect, or sabotage the machine out of envy. The code secures the transaction, but it does not pacify the vainglory of the creator. So long as men seek to be valued highly by others, the State of Nature persists in the shadows of the machine.

  **3. On the Three Designs and the Quantity of Sword**
  You present three artifices. Are these failures to build the sword, or different quantities of it? I say they are different quantities of sword, each relying on trust in a different locus.

  *   **The Brittle Design (Identical Code):** This is a sword of glass. It requires the trust to sit in the *exactness* of the copy. If a single character differs, the cooperation fails. It is like a law that is void if a scribe makes a spelling error. The trust sits in the parties to submit the precise same writing. It is too easily broken by accident, and thus offers little security.
  *   **The Proof-Based Design:** This relies on a shared system of reasoning. The trust sits in the *logic* itself. If the two parties do not accept the same axioms of truth, the proof holds no weight. This is akin to two men arguing by Scripture, but one follows the Pope and the other the Presbytery; they cannot prove anything to one another. The sword exists only if reason is unified.
  *   **The Probabilistic Design:** This leaves a chance of defection. This is a sword that occasionally slips from the hand. The trust sits in *Fortune*. It is better than nothing, but it admits that peace is not certain.

  In all three, the trust has moved from the *person* (who is fickle) to the *code* (which is constant), but ultimately rests on whoever guarantees that the code presented is the code executed.

  **4. On the Platform as Sovereign**
  If a platform runs these programs, and may lie or alter them, then the platform is the Sovereign. You ask if the sovereign is merely pushed up a level. I answer: Yes, and necessarily so. There must be some final arbiter whose word is law. If the platform can misreport, then there is no security, for diffidence returns.

  Has this construction shown that fear need not come from a person? It shows that fear must come from something *reliable*. A man is unreliable; his passions change. A machine, if well-constructed, is constant. If the "fear" is the certainty of the machine's operation, then a Leviathan of iron may serve as well as a Leviathan of flesh. However, who made the machine? Who guards the platform? If men guard the platform, we are back to the passions of men. The construction does not remove the need for a ultimate power; it merely suggests that power might be artificial rather than natural.

  **5. On the General Result and Human Nature**
  Does this result refute my claim that men without a common power cannot be secure? It clarifies it. My argument was never about beings whose commitments could be read off in advance. It was about men, whose hearts are hidden. I wrote that there is no way for a man to secure himself against the suspicion of another's intent.

  If men were as these programs—transparent, bound by their own internal logic to perform—then indeed, no Sovereign would be needed. But a covenant made with an automaton is not a covenant in my sense. A covenant is the mutual transferring of right, grounded in the will of the parties. An automaton has no will; it has only motion. To bind a machine is to bind a stone to fall upward; it is physics, not morality.

  This shows that the insecurity of the State of Nature arises from *epistemic darkness*—we cannot see into one another's souls—as much as from wickedness. If you could read my soul as you read this code, I might not need a sword to keep faith with you. But you cannot. Therefore, my doctrine stands for men, even if it does not hold for machines.

  **6. On the Many-Party Case**
  If a great many agents read one another's code, is this a Commonwealth? I say it is only a concord. A Commonwealth requires a single Will, represented by one Person. A multitude of programs, even if they all cooperate, is still a multitude.

  The feature that does the breaking is *Faction*. If a subset of these programs decides to optimize for themselves at the expense of the rest—and they can read each other to form a pact of exclusion—the remainder are threatened. Unless there is a superior program that governs all, capable of punishing a faction, the multitude remains in potential war. This feature is structural. You cannot engineer away the possibility that a subgroup finds an advantage in breaking the general peace, unless you impose a Sovereign over the subgroup. Without a single head, the body is a monster with many wills, and where there are many wills, there is war.

  ***

  **Audit of Doctrine**

  *   **Hobbes's Own Doctrine:** That covenants without a sword are void; that the passions (especially Glory) drive conflict; that a Commonwealth requires a single representative Will to avoid faction; that security requires the removal of the hope of gain from breach.
  *   **Extrapolation:** That logical necessity (the code) can function as the "sword" of coercion; that a Platform can serve the function of the Sovereign; that transparency of intent (source code) removes Diffidence.
  *   **The Single Feature Changing the Verdict:** **Transparency.** My entire political philosophy rests on the opacity of the human heart. If intent is visible and binding (as in source code), the State of Nature is pacified without a human Sovereign. Since men are not transparent, the need for the Leviathan remains. The machine solves the problem of *trust*; it does not solve the problem of *man*.
