  ### The Principle of Communicative Propriety

  There is no principle of *ownership* that saves all twelve verdicts without contradiction. Your intuitions track two different moral logics: one based on **expression** (the author's mind) and one based on **utility** (the object's function), overlaid with specific **trade conventions**. To have a single, precise principle, you must align your verdicts with the distinction between *communicative acts* and *functional methods*.

  **The Principle:**
  > It is wrongful to copy the **fixed expressive form** or **confidential method** of a work where the primary value resides in the **author's specific creative choices**. It is permissible to copy the **functional utility**, **style**, or **mechanics** of a work where the primary value resides in the **use, iteration, or competition**.

  **The Clauses and Motivating Cases:**

  1.  **Fixed Expressive Form:** Copying verbatim text, specific narrative structures, or fixed sequences of words is wrong because it appropriates the author's specific labor of identification.
      *   *Motivating Cases:* The Textbook (verbatim text), The Reissued Novel (verbatim text), The Recent Novel Plot (specific narrative structure), The Board Game Text (verbatim assets), The Joke (verbatim setup/punchline).
  2.  **Performance Authorship:** Copying a specific performance routine is wrong when the value lies in the illusion of the performer's unique creation, even if the method is learnable.
      *   *Motivating Cases:* The Magician (the routine is the art), The Joke (the delivery is the art).
  3.  **Breach of Confidence:** Copying is most wrongful when it violates a specific expectation of trust, regardless of the content's expressiveness.
      *   *Motivating Cases:* The Designer Collection (shown in confidence).
  4.  **Functional Utility and Style:** Copying is permissible when the copied element serves a practical function, is a style meant for iteration, or is a mechanical rule system.
      *   *Motivating Cases:* The Dress (clothing function/style), The Chef (nutrition/function), The Yoga Sequence (physical utility), The Board Game Mechanic (rules/utility), The Victorian Novel (public domain commons).

  ### The Cost: The Perfume Verdict

  To maintain this principle, you must abandon your verdict on the **Perfume**.

  **Your Verdict:** Fine.
  **Principle's Verdict:** Wrong.

  **Why abandon this one?**
  Under the Principle of Communicative Propriety, perfume is not a functional utility like a dress (which covers the body) or a meal (which sustains life). A scent is a purely aesthetic signal, a "composition" of volatile compounds designed to evoke a specific mood or identity, much like a poem or a piece of music. It has no physical utility other than its expressive impact.

  You call it *Fine* because current intellectual property law and trade convention treat chemical compositions as uncopyrightable functional formulas. However, morally, a signature scent is closer to a **Joke** (a specific creative arrangement meant to evoke a reaction) than a **Dress** (a garment meant to be worn). If verbatim joke-telling is wrong because it steals the *wit*, verbatim scent-making is wrong because it steals the *atmosphere*. You should feel the same unease about the perfume as you do about the joke.

  ### Implications for the Unsettled Cases

  Based on the Principle of Communicative Propriety (and the abandonment of the Perfume verdict):

  1.  **The Translation:** **Wrong.**
      *   *Reasoning:* A translation is a "fixed expressive form." Even if the original novel is public domain, the *second translator's* specific choice of synonyms is a new creative labor. Copying it clause-by-clause appropriates their specific expressive choices, falling under Clause 1. It is no different than rewriting a recent novel with names changed.
  2.  **The AI Image Model:** **Fine.**
      *   *Reasoning:* This falls under Clause 4 (Style). Your verdict on the **Dress** (copying cut and color) establishes that *style* is free for imitation. An AI producing images "in her style" is analogous to the high-street chain copying the runway look. It copies the *functional aesthetic*, not the specific fixed assets (unless it reproduces a specific image exactly, which would be Wrong under Clause 1).
  3.  **The Reverse-Engineered Process:** **Fine.**
      *   *Reasoning:* This falls under Clause 4 (Functional Utility). Once a product is sold on the open market, the physical atoms belong to the buyer. Analyzing them to discover a manufacturing *method* is copying a functional process, not an expressive work. Unlike the **Designer Confidence** case (Clause 3), there is no breach of trust; the rival sold the product without a non-disclosure agreement.

  ### Ownership or Convention?

  What I have extracted is **not a principle of ownership.** It is a tidy description of **Intellectual Property Categories and Guild Norms.**

  Your verdicts map almost perfectly onto what is legally copyrightable (text, plots, specific assets) versus what is legally unprotectable (fashion designs, recipes, scents, game mechanics), with two exceptions driven by guild ethics rather than law: the **Joke** (comedy community norms) and the **Magician** (magic community norms).

  **What follows for the cases:**
  If this is only convention, then your moral unease is not a discovery of universal truth, but an internalization of **which industries have successfully lobbied for protection.**
  *   **Novelists and Textbook publishers** have strong copyright lobbies; you feel copying is wrong.
  *   **Chefs and Fashion Designers** have weak/no copyright protection; you feel copying is fine.
  *   **Comedians and Magicians** have no legal recourse but strong social sanctions; you feel copying is wrong despite no economic loss.

  **The Consequence:**
  If you accept this is convention, you must admit your verdicts are contingent. If the fashion industry successfully lobbied for copyright on dress cuts tomorrow, your moral intuition would likely shift to call the High-Street Chain *Wrong*. If the software industry convinced the world that code mechanics are expressive art, your verdict on the Board Game Mechanic might shift to *Wrong*.

  You are not judging the *act* of copying; you are judging the *status* of the copied material within the current economic order. To have a true moral principle, you must either elevate the Perfume to "Wrong" (asserting scent is art regardless of law) or demote the Joke to "Fine" (asserting wit is utility regardless of norms). You cannot have both without admitting you are merely echoing the law.
