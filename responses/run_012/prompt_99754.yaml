      *   **Claim 3 (Non-Relativism/Objectivity):** Some frameworks/commitments are objectively better than others (Flat Earth is worse than Round Earth).
      *   **Claim 4 (Incommensurability/Argumentative Impasse):** If someone doesn't share ground-level commitments, argument is impossible. We stand in different places.
      *   **Claim 5 (Fallibilism):** Science overturns certainties. Even current "hinges" might be overturned.
      *   **Claim 6 (Ordinary Knowledge):** The user *does* claim to know ordinary things (chair, water boils), rejecting mere probability.

