      *   *The Verdict:* Drop Claim 2. Adopt a "Contextualist" or "Hinge" epistemology where some beliefs are warranted without evidence *because* they make evidence possible. This saves 1, 3, 4, 5, and 6 (with slight tweaking on 6 to include hinges as a form of knowledge or "certainty").

