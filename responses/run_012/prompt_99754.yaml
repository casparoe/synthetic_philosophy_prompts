          *   *Severity:* Medium. It creates a tension between normative judgment (they are wrong) and practical impossibility (can't prove it to them). It risks making Claim 3 empty talk. If I can't argue them out of it, in what sense are they "worse off" epistemically, rather than just different?
      *   **Conflict D: Claim 1/6 vs. Claim 5.**
