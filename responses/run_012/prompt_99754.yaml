          *   *Severity:* High. You say you don't "know" hinges (hands) but you do "know" ordinary things (chair). Usually, these are in the same bucket.
          *   *Fix:* Align definitions. Either call hinges "knowledge" (modifying Claim 1) or admit ordinary perceptual beliefs aren't "knowledge" in the strict sense (modifying Claim 6).
          *   *Cost:* Either linguistic intuition (Claim 1) or common sense (Claim 6).
      *   **Conflict 3 (The Relativist Trap):** Claim 3 vs. Claim 4.
          *   *Severity:* Medium. It makes moral/epistemic judgment impotent.
