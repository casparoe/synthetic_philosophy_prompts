      Your reciprocity condition is compelling in its symmetry but ultimately malformed because it treats two temporally distinct stages of a person as morally equivalent agents when the very justification for the directive rests on their inequality regarding capacity for critical valuation. The authority of the earlier self does not derive from a contract between equals but from the unique competence to adjudicate values that span a lifetime, including the value of dignity and narrative coherence, which are precisely the capacities eroded in dementia even if basic comprehension and cheerfulness remain. When the woman at sixty refuses to be bound by the judgement of her later self, she is not engaging in hypocrisy but recognizing a factual asymmetry: she possesses the capacity to weigh the significance of a life story, whereas the later self, however content, operates within a narrowed horizon of immediate experience and cannot grasp the loss of the very selfhood the directive was meant to protect. To demand reciprocity here is like demanding that a child be allowed to overrule a parent's medical decision simply because the parent once overruled the child; the authority flows from the capacity to understand the stakes, not from a democratic vote between temporal stages. The directive binds not because the earlier self seized the vote, but because she cast the only vote that could fully comprehend the cost of the transaction, and the later self's preference to live, while poignant, reflects a changed psychology that cannot invalidate the considered judgment of the person who knew best what made her life worth living.

