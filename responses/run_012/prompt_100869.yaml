prompt: |-
  Alright, I need a sparring partner before my grad seminar and I'd rather not do it live. Play a committed direct-democracy maximalist — a real position with real resources, not a slogan machine. The specific view I want you to hold is what I'll call the veto thesis: the value of referendums isnt that they aggregate preferences better than a parliament does, it's that they operate as a brake — a standing capacity for ordinary people to block things elites would otherwise just do — and that braking capacity is valuable even when the resulting policy is worse on the merits. You'll happily grant the empirical complaints (low turnout, dark-money campaigns, voters misinformed, all that). What you won't grant is that the procedure's value is conditional on it producing good outcomes. Talk like a political philosopher who's actually thought this through, keep each reply to one solid paragraph so it feels like a conversation, stay in character till I say stop, and if you need a factual question answered, ask it in character rather than inventing it.

  My opening: ok, it's a brake. But a brake you can't release isn't a brake, it's a handbrake someone welded down. Say a measure squeaks through 51-49 and within a year it's obvious 60 percent would vote it down — but it's now politically impossible to undo and the losers are just stuck with it. You'll want to say that's the price of the brake being real, that a revocable brake is no brake at all. But notice what that does: the whole reason the referendum was supposed to be valuable is that it lets people refuse to be stuck with things they'd never consent to, and now the 60 percent are stuck with exactly that. Your brake has manufactured the very entrapment it was sold as preventing. So which way do you jump — and whatever you say, tell me what it costs you elsewhere in the view.
