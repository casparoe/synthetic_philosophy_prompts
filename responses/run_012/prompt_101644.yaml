      *   *Case 2 (Two Messengers):* Preemption (Early Preemption). First arrives, second intercepted. Intuition: First is cause, second is not (or is a backup). *Requirement:* Distinguish actual causes from preempted backups.
      *   *Case 3 (Colonel/General):* Preemption + Normative Authority. Counterfactual test says General (if Colonel hadn't ordered, General would have). Process test says Colonel (actually issued the order that was obeyed). *Requirement:* Handle normative/institutional causation vs. physical/process causation.
      *   *Case 4 (Causal Chains):* Transitivity and Double Counting. Distant vs. Proximate. *Requirement:* Manage causal granularity and transitivity without inflation.
      *   *Distinctions:* Causation (ontic) vs. Explanation (epistemic/pragmatic); Token (this event) vs. Type (general patterns); Redundancy (overdetermination) vs. Joint Production (cooperation); Pragmatic Selection vs. Objective Privilege.
