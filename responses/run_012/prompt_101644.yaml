answer: |-
  # Desiderata for a Theory of Historical Overdetermination and Multi-Causal Explanation

  The following list specifies the conditions any adequate theory must meet to serve the purposes of historical explanation. The primary aim is to provide a framework that allows historians to (a) resolve disputes about specific causal claims and (b) construct narratives that acknowledge multiple causes without collapsing into triviality.

  ### 1. The Non-Trivialization of Redundant Sufficiency
  *   **Requirement:** The theory must assign causal status to conditions that are individually sufficient for an outcome within the actual context, even if the removal of any single one would not have changed the outcome (counterfactual dependence fails). It must not reduce overdetermined events to "uncaused" or "accidental."
  *   **Motivation:** **Case 1 (Regime Fall).** Historians cite war, harvest failure, and defection. Each is sufficient in the context of the others; removing one leaves the outcome intact. A theory that relies strictly on "but-for" counterfactuals eliminates all three as causes, contradicting historical practice.
  *   **Status:** **Non-negotiable.**
  *   **Tension:** Conflicts with strict Difference-Making accounts (see Scoring).

  ### 2. Sensitivity to Preemption and Timing
  *   **Requirement:** The theory must distinguish between a cause that actually produces the effect and a redundant condition that *would have* produced the effect had the first not occurred. It must privilege the actual process over the backup.
  *   **Motivation:** **Case 2 (Two Messengers).** The first messenger arrives; the second is intercepted. Both carried sufficient orders. Intuition dictates the first caused the action; the second did not, despite being sufficient.
  *   **Status:** **Non-negotiable.**
  *   **Tension:** Conflicts with pure Probabilistic accounts that look only at probability raising prior to the event.

  ### 3. Accommodation of Normative and Institutional Causation
  *   **Requirement:** The theory must allow causal status to be determined by institutional authority or normative structures, not merely by physical or temporal priority. It must handle cases where the "effective" cause is defined by rules of recognition rather than spatiotemporal continuity.
  *   **Motivation:** **Case 3 (Colonel/General).** The Colonel's order is obeyed (physical process), but the General's authority guarantees obedience (normative sufficiency). Counterfactual tests point to the General; process tests point to the Colonel. A historical theory must account for why the General's order might be cited as the "real" cause in a political narrative despite the Colonel's temporal priority.
  *   **Status:** **Preference (Structuralist/Institutionalist Camp).** A purely physicalist metaphysics may reject this, but a historical theory cannot.
  *   **Tension:** Conflicts with strict Mechanism/Process accounts that require physical transmission.

  ### 4. Control of Causal Granularity and Transitivity
  *   **Requirement:** The theory must provide criteria for stopping causal chains to prevent double-counting. It must distinguish between a distant cause that operates *through* a proximate cause and two distinct causes that operate independently.
  *   **Motivation:** **Case 4 (Causal Chains).** If A causes B, and B causes C, citing both A and C as causes of E can inflate the explanation. The theory must decide when transitivity holds and when the proximate cause "screens off" the distant one.
  *   **Status:** **Non-negotiable.**
  *   **Tension:** Conflicts with unrestricted Transitivity views in metaphysics.

  ### 5. Separation of Causal Ontology from Explanatory Selection
  *   **Requirement:** The theory must distinguish between what *made* the event happen (ontology) and what is *cited* in a narrative (explanation). It must license the citation of multiple causes without ranking them, provided they meet the ontological threshold, without implying they all contributed equally to the *production* of the event.
  *   **Motivation:** **Purpose (b).** Historians need to say "War, Harvest, and Defection caused the fall" without meaning "Each contributed 33% of the causal force." This separates the metaphysics of production from the pragmatics of narrative.
  *   **Status:** **Non-negotiable.**
  *   **Tension:** Conflicts with theories that conflate explanation with causation (e.g., strict Pragmatic accounts).

  ### 6. Token Specificity
  *   **Requirement:** The theory must apply to token events (this revolution, this order) rather than solely to type-level generalizations. It must handle singular causal claims where statistical frequency is irrelevant.
  *   **Motivation:** **Distinction (Token vs. Type).** Historical explanation is primarily about particular events. A theory that only explains why revolutions *generally* happen fails to explain why *this* regime fell on *this* Tuesday.
  *   **Status:** **Non-negotiable.**
  *   **Tension:** Conflicts with strictly Probabilistic/Statistical accounts that require reference classes.

  ### 7. Consistency with Probability and Production
  *   **Requirement:** The theory must not violate basic laws of probability (e.g., a cause cannot lower the probability of its effect unless specified as a preventer) while also acknowledging that causation involves more than probability raising (production/connection).
  *   **Motivation:** **Metaphysical Consistency.** Some accounts pull toward difference-making (probability/counterfactuals); others toward sufficiency (production). The theory must navigate the "Probability-Raising vs. Connection" divide without contradiction.
  *   **Status:** **Non-negotiable.**
  *   **Tension:** Conflicts with accounts that treat probability raising as sufficient for causation.

  ***

  ### Incompatibility and Exclusion Notes

  **Incompatible Pair:** There is a fundamental tension between **Requirement 1 (Non-Trivialization of Redundant Sufficiency)** and **Requirement 2 (Sensitivity to Preemption)** within a single metaphysical framework.
  *   *Reason:* To satisfy Req 1 (Overdetermination), a theory usually must relax counterfactual dependence (since the effect does not depend on the cause). To satisfy Req 2 (Preemption), a theory usually must enforce a strict connection or counterfactual test to rule out the backup cause. A theory that is loose enough to call both messengers causes (Req 1) often fails to rule out the intercepted messenger (Req 2). A theory strict enough to rule out the intercepted messenger often rules out the redundant regime-fall conditions (Req 1). *Resolution:* This incompatibility is only fatal if the theory treats Causation and Explanation as identical. **Requirement 5** is the necessary pressure valve: Ontology handles Preemption strictly; Explanation handles Overdetermination loosely.

  **Most Exclusionary Requirement:** **Requirement 1 (Non-Trivialization of Redundant Sufficiency).**
  *   *Reason:* This is the primary graveyard of candidate theories. Simple Counterfactual (Difference-Making) theories fail this immediately. Strict Probabilistic theories often fail this if the probability is already at 1.0. Only theories that incorporate Sufficiency (like INUS/NESS) or Pluralist accounts survive this filter.

  ***

  ### Scoring of Theoretical Families

  **Counterfactual / Difference-Making Family:**
  This family scores poorly on **Requirement 1**. In symmetric overdetermination cases (Regime Fall), if removing cause C leaves outcome E unchanged, C is not a cause. This eliminates all cited causes in Case 1, failing the historian's need to cite multiple sufficient conditions. It handles Preemption (Req 2) well via fine-grained modeling, but fails the core historical intuition that redundant conditions are still causal. It also struggles with **Requirement 3** (Normative Causation), as institutional authority does not always map cleanly onto counterfactual dependence in token cases.

  **Probabilistic Family:**
  This family struggles significantly with **Requirement 6 (Token Specificity)** and **Requirement 2 (Preemption)**. Probabilistic accounts rely on reference classes and probability raising. In Case 2 (Messengers), the second messenger raises the probability of the action ex ante, yet is causally inert ex post. Furthermore, in singular historical tokens (Req 6), probabilities are often 0 or 1, rendering the account vacuous. It satisfies **Requirement 7** by definition but fails to capture the "production" aspect necessary for narrative explanation.

  **Mechanism / Causal-Process Family:**
  This family excels at **Requirement 2 (Preemption)** and **Requirement 4 (Granularity)** by tracing the physical or informational transmission. However, it faces a severe crisis with **Requirement 3 (Normative Causation)**. In the Colonel/General case, the physical process flows through the Colonel, but the causal power resides in the General's rank. A strict process account must deny the General is the cause, contradicting historical practice. It also risks failing **Requirement 1** if the "process" is viewed as singular and non-shareable in overdetermination cases.

  **INUS / NESS (Necessary Component of a Sufficient Set) Family:**
  This family performs best overall. It satisfies **Requirement 1** by allowing multiple sufficient sets to exist simultaneously (War is part of Set A; Harvest is part of Set B; both are causes). It handles **Requirement 4** well by defining causal fields. However, it can struggle with **Requirement 2 (Preemption)** without additional temporal indexing (distinguishing which sufficient set was *completed* first). It is the most compatible with **Requirement 5**, as it allows for an ontological definition of cause that is broad enough to support pluralistic explanatory selection without ranking.
