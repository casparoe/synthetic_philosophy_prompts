  3. The normative claim that only metering solves the problem is unsupported, as the Prisoner's Dilemma solution requires mutual coercion but does not dictate prices over quotas, meaning this reading fails to license his specific slide to individual holdings.
  4. Applying the phrase to non-rivalrous resources like codebases is invalid because the game form presupposes subtractability, making this reading false and irrelevant to your seminar's discussion of joint access without depletion.
  5. **This is the best precisification:** the phrase identifies a failure of governance rather than sharing itself, so you must press him on why he assumes institutions are absent by definition when the logic requires regulated access but does not license his specific move to prices.
