prompt: |-
  Right, so I've got the department work-in-progress slot a week on Thursday and I need to be ready for the discussion, which in our place is where the real paper gets written. What I want from you is a Q&A prep sheet, not a summary of the literature and not a defence of the paper.

  The line I'm running: everyone teaches Frankfurt cases as showing that moral responsibility doesn't require alternative possibilities. I think that's wrong, but not in any of the usual ways. My claim is that Frankfurt cases are dialectically inert — they leave the compatibilism question exactly where they found it, and each of the standard patches (the flicker-of-freedom move, the dilemmic defence, the no-movement objection) either restates the problem or changes the subject. The reason is that in any genuine Frankfurt case the intervener is counterfactually idle; he never lifts a finger. What does the work is that the agent's action is over-determined by her own reasons. I call this self-overdetermination, and I argue that once you see it, the case is just an ordinary case of someone acting wholeheartedly on her own character — precisely the picture the compatibilist already accepts. So the cases can't settle anything, because they presuppose the compatibilist account of action rather than testing it. I realise there's an obvious comeback, that this is just the flicker-of-freedom defence in new clothes; I have a paragraph on why it isn't, but it isn't my strongest bit and I'd rather find that out now.

  The room: fifteen-ish people. Most are reasons-responsiveness compatibilists, so they'll want to know what my account says about why she's responsible at all, and they'll definately press on whether self-overdetermination does any independent work or whether I've simply assumed compatibilism. Two are hard incompatibilists who think determinism scuppers responsibility full stop; they'll either love this paper (if PAP survives) or gut it (if it doesn't) and I honestly can't predict which. One person works on abilities and dispositions and will ask what over-determination is supposed to mean when the second cause never fires. There's a legal philosopher who will ask whether any of this changes any excuse doctrine, and if it doesn't, so what. And a visitor from the cognitive science side who will ask whether the agent's own will is meant to be empirically identifiable.

  What I need: the objections in the order I'll actually get them, phrased the way these people would phrase them, in their vocabulary rather than mine. For each, how much damage it does, a reply I can give in about ninety seconds, and a note on where the reply is weakest, or where I should just concede. Tell me which ones I should concede up front instead of fighting, and tell me the question I'm hoping nobody asks.

  Write it in American English — the papers in American English and that's what I'll be circulating. No citations, no reading list; I know the literature. I want the argument.
