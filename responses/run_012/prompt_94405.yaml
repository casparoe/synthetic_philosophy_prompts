answer: |-
  **PREP SHEET: WORK-IN-PROGRESS SLOT**
  **Topic:** Frankfurt Cases & Dialectical Inertia
  **Audience:** 15 (Majority RR-Compatibilists, 2 Hard Incompatibilists, 1 Abilities, 1 Legal, 1 CogSci)

  **STRATEGY NOTE**
  Your core claim is that Frankfurt cases presuppose the compatibilist picture they are meant to prove. Your vulnerability is the distinction between your "self-overdetermination" move and the standard "flicker" defense. You admitted this is weak. Do not volunteer it. If pressed, pivot to "dialectical inertia" rather than metaphysical nuances about alternatives. Your goal is to show the cases are *question-begging*, not that PAP is true.

  ***

  ### Q1: The "So What?" (Reasons-Responsiveness Compatibilists)
  **Objection:** "Okay, suppose Frankfurt cases don't refute PAP. You're still describing an agent who acts on her own reasons without intervention. That's exactly what guidance control looks like. So aren't you just conceding that she's responsible, while quibbling about whether the case refutes PAP? What work is 'inertia' doing if the result is the same?"

  **Damage:** **High.** This cuts at the motivation. If the verdict on responsibility is the same, why does the dialectical status matter?

  **90-Second Reply:**
  "The verdict on the agent is the same, but the justification shifts. Currently, we use Frankfurt cases to sever responsibility from alternative possibilities. I'm arguing we can't use them that way because the case only works if we already assume the agent's reasons are sufficient causes. If the intervener is idle, the agent's responsibility rests on her actual sequence properties—her reasons-responsiveness—not on the absence of alternatives. So, the case doesn't prove APs are irrelevant; it just shows we don't need the case to see responsibility. We should ground responsibility in the actual sequence directly, without pretending Frankfurt cases eliminated the need for APs. It stops us from claiming a victory we haven't earned."

  **Weakness/Concession:**
  This risks sounding like you agree with them but want different branding. Be prepared to emphasize that using bad arguments (question-begging ones) leaves compatibilism vulnerable to better incompatibilist arguments later.

  ### Q2: The Metaphysics of Overdetermination (Abilities/Dispositions Expert)
  **Objection:** "You call this 'self-overdetermination.' But standard overdetermination requires two actual causes firing simultaneously, like two bullets hitting a victim. Here, the intervener's cause is counterfactual—it never fires. That's not overdetermination; that's just a masked disposition or a finked ability. Are you misusing the causal vocabulary?"

  **Damage:** **Medium-High.** This attacks the technical coherence of your central concept.

  **90-Second Reply:**
  "You're right that it's not causal overdetermination in the classic sense. I'm using the term structurally. The setup ensures the outcome is guaranteed twice over: once by the agent's actual reasons, once by the intervener's disposition. The point isn't that there are two causes firing, but that the agent's cause is sufficient regardless of the backup. The 'inertia' comes from the fact that the backup's existence doesn't change the causal history of the actual action. If we treat it as classic overdetermination, we miss that the intervener is metaphysically redundant in the actual sequence."

  **Weakness/Concession:**
  **Concede the terminology.** Say: "If 'overdetermination' is too misleading, I'll drop it. Call it 'structural redundancy.' The argument doesn't depend on the label, only on the fact that the intervener contributes nothing to the actual causal history."

  ### Q3: The Circularity Charge (General Room)
  **Objection:** "You say the cases presuppose compatibilism. But doesn't that just mean you're assuming incompatibilism to call them inert? If the compatibilist says 'responsibility tracks actual sequences,' and the case shows an actual sequence without APs, haven't they won? Aren't you begging the question against them?"

  **Damage:** **Medium.** This is the standard counter-charge to your thesis.

  **90-Second Reply:**
  "No, I'm not assuming incompatibilism. I'm assuming a neutral description of the case. Everyone agrees the intervener never acts. Everyone agrees the agent acts on her own reasons. The incompatibilist says 'she still needed the option to do otherwise.' The compatibilist says 'she didn't.' The Frankfurt case is supposed to settle this by removing the option while keeping responsibility. I'm saying the case doesn't remove the option in a way that matters dialectically because the removal is counterfactual. It doesn't force the incompatibilist to concede anything they didn't already grant about actual sequences. It stalls the debate rather than advancing it."

  **Weakness/Concession:**
  This is your core argument. Do not concede here. However, acknowledge that if the incompatibilist insists on *categorical* APs, the case won't move them. That's the point of inertia.

  ### Q4: The Legal Upshot (Legal Philosopher)
  **Objection:** "I'm listening for the practical stakes. Does this change excuse doctrine? If an defendant claims 'I couldn't have done otherwise,' does your view change how we assess that claim? If not, so what?"

  **Damage:** **Low.** This is a standard "so what" for non-metaphysicians.

  **90-Second Reply:**
  "It doesn't change the doctrine directly, but it changes the justification for it. Currently, we tell courts that alternative possibilities don't matter because of Frankfurt cases. I'm saying that's a bad reason. We should tell courts that alternative possibilities don't matter because responsibility tracks actual reasoning capacities, not metaphysical leeway. It protects the law from relying on a philosophical argument that might collapse. If Frankfurt cases are inert, we shouldn't build legal theory on them. We should build it on reasons-responsiveness directly."

  **Weakness/Concession:**
  **Concede upfront** that there is no immediate change to doctrine. Don't fight for practical utility you don't have. Frame it as "theoretical hygiene" for the law.

  ### Q5: The Empirical Will (Cognitive Science Visitor)
  **Objection:** "You talk about the agent acting on 'her own reasons' versus the intervener. Is this distinction empirically identifiable? Can we locate the 'self' in the neural data distinct from the 'intervention' mechanism, or is this purely conceptual?"

  **Damage:** **Low.** They know you're doing conceptual work, but they want to know if it maps to reality.

  **90-Second Reply:**
  "It's purely conceptual. I'm analyzing the structure of the thought experiment, not making a claim about neural correlates. Whether we can empirically identify 'own reasons' is a separate problem for moral psychology. My point holds even if we can't scan the brain: in the logic of the case, the intervener is idle. That logical idleness is what creates the dialectical inertia, regardless of the empirical markers of the will."

  **Weakness/Concession:**
  None. Hold the line on conceptual analysis.

  ### Q6: The Hard Incompatibilist Trap (The Two Skeptics)
  **Objection:** "If you're right, and PAP survives Frankfurt cases, then determinism still kills responsibility because determinism kills APs. So, are you actually an incompatibilist? Are you helping us?"

  **Damage:** **High.** This forces you to declare a side you might be trying to avoid.

  **90-Second Reply:**
  "I'm not defending PAP as true; I'm defending it as unrefuted by Frankfurt cases. Whether determinism kills responsibility depends on whether determinism kills APs, and whether APs are required. I'm staying neutral on that. My claim is only that this specific weapon—the Frankfurt case—doesn't settle the war. You might still win, but not with this weapon."

  **Weakness/Concession:**
  Be careful not to sound like you're agreeing with them. Emphasize neutrality.

  ***

  ### UP-FRONT CONCESSIONS
  *Don't wait for them to pound you on these. Signal them early to disarm the objection.*

  1.  **Terminology:** Concede that "self-overdetermination" might be metaphysically loose. Offer "structural redundancy" as an alternative if pressed. Don't die on the word "overdetermination."
  2.  **Legal Doctrine:** Concede immediately that this doesn't change legal outcomes or excuse doctrines. Frame the value as "justificatory stability," not practical reform.
  3.  **The Flicker Distinction:** Do not highlight the paragraph where you distinguish your view from the flicker defense. If asked, say: "The label doesn't matter. Whether you call it a flicker or inertia, the point is the case fails to force an incompatibilist concession."

  ***

  ### THE "HOPE NOBODY ASKS" QUESTION
  **"If Frankfurt cases are inert, what argument *does* settle the compatibilism debate?"**

  **Why it's dangerous:** Your paper is largely destructive. It removes the standard tool for compatibilism. If you don't have a positive account of how we *do* settle the debate, you risk leaving the room thinking you've destroyed compatibilism without offering a replacement. If you say "nothing settles it," you look like a skeptic. If you say "here's my positive theory," you're off-script and unprepared.

  **Prep:** Have a one-sentence placeholder ready.
  *Draft:* "I'm not settling the debate today. I'm clearing the debris so we can find better arguments, likely grounded in actual sequence properties rather than counterfactual setups."
