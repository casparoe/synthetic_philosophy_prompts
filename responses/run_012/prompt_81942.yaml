answer: |-
  **Case 1: The Deployment (Encroachment Test)**
  Devon is a junior developer at a logistics firm. In both versions, Devon runs an automated script to verify that a new software patch is compatible with the existing system; the script returns a green "pass" signal, which Devon glances at before logging off. In the **Low Stakes** version, the patch updates the internal staff lunch-ordering app; if it fails, employees just can't order sandwiches for a day. In the **High Stakes** version, the patch updates the client billing interface; if it fails, clients are double-charged and the firm faces a breach-of-contract lawsuit. Devon's personal bonus and job security are identical in both versions (the firm absorbs the risk), but the *consequences of error* for the project differ vastly. Lee, the project lead, is speaking to a stakeholder in a neutral tone in both versions, saying: "Don't worry, Devon knows the patch is stable." Lee's context, evidence, and standards for assertion remain fixed; only the practical stakes surrounding Devon's action change.

  **Case 2: The Post-Mortem (Contextualist Test)**
  Devon is the same junior developer, running the same script with the same "pass" result. The stakes are fixed at **High**: the patch is for the client billing interface, and a failure means double-charges and lawsuits. In the **Low Salience** version, Devon is at a pub with friends who ask if the work is done; Devon says, "I know the patch is stable." In the **High Salience** version, Devon is in a formal post-mortem meeting after a minor glitch was detected elsewhere; the same question is asked by a senior auditor, and Devon says, "I know the patch is stable." Here, Devon's evidence and the practical stakes of the deployment are held constant across both versions. The only variable is the conversational context: the salience of the possibility of error and the gravity of the questioner.

  ***

  ### The Check

  **Case 1 Analysis (Encroachment)**
  *   **Ascription:** "Devon knows the patch is stable."
  *   **Subject's Evidence:** Script pass + glance (identical in both).
  *   **Attributor's Standards:** Lee's standards (fixed/neutral).
  *   **Verdicts:**
      *   *Pragmatic Encroachment (PE):* **True** in Low Stakes, **False** in High Stakes. PE holds that knowledge requires action-ready justification; since Devon isn't justified in acting (deploying) in the High Stakes version without further checking, the knowledge ascription is false, regardless of Lee's context.
      *   *Contextualism:* **True** in both. Since Lee's conversational context (the attributor) hasn't shifted, the semantic standard for "knows" remains low. The stakes belong to the subject, not the attributor, so they shouldn't affect the truth conditions of Lee's claim.
  *   **Working Feature:** The Subject's Practical Stakes.
  *   **Honesty Check:** This is the weak point for PE. Critics argue PE doesn't flip the *truth* of the knowledge claim, only the *warrant to assert* it or the *rationality of acting* on it. If Devon doesn't know in the High case, did Devon lose a factive mental state just because the billing system is at risk? PE says yes; Contextualists say that intuition is just about prudence, not truth.

  **Case 2 Analysis (Contextualism)**
  *   **Ascription:** "I know the patch is stable."
  *   **Subject's Evidence:** Script pass + glance (identical in both).
  *   **Attributor's Standards:** Devon's context (shifts from pub to audit).
  *   **Verdicts:**
      *   *Contextualism:* **True** in Low Salience, **False** in High Salience. In the audit, the possibility of error is "salient," raising the epistemic standard. Devon's evidence no longer meets the heightened standard, so the self-ascription is false.
      *   *Pragmatic Encroachment:* **True** in both. Since the stakes (billing lawsuit) are fixed and high, Devon's epistemic position is constant. If Devon didn't know in the pub, they don't know in the meeting. PE denies that mere conversational salience changes truth conditions.
  *   **Working Feature:** Conversational Salience of Error.
  *   **Honesty Check:** Contextualists have a cheap escape here: they can argue that the *stakes* make the error salient, not the context itself. If the stakes are fixed High, why does the standard drop in the pub? A clever Contextualist might say the *question under discussion* changes. In the pub, "Do you know?" means "Are you done?" In the audit, it means "Are you certain?" This blurs the line between context and stakes.

  ### The Invariantist Objection
  A stubborn old-school invariantist (e.g., a strict reliabilist or classical internalist) would deflate both cases by saying: **"You are confusing knowledge with rational action or appropriate assertion."**
  They would argue that Devon either has a justified true belief (plus whatever anti-luck condition is needed) or doesn't. In Case 1, the stakes affect whether it is *rational to deploy*, not whether Devon *knows*. In Case 2, the salience affects whether it is *appropriate to claim knowledge*, not whether Devon *has it*. The invariantist insists that our intuition that "Devon doesn't know" in the High Stakes/High Salience cases is actually an intuition that "Devon shouldn't act/speak as if they know." Once you separate the norm of knowledge from the norm of assertion/action, the data driving both PE and Contextualism evaporates.

  ### Is the Dispute Verbal?
  There is a strong risk that the dispute is verbal. If the Contextualist defines "knows" as *meeting the contextually relevant standard for assertion*, and the Encroachment theorist defines "knows" as *having a justification sufficient for the subject's practical needs*, they are simply labeling different relations. However, if both camps claim to be analyzing the *same* folk concept of knowledge, Case 1 is the stronger divergence. Contextualism *must* say Lee's ascription is true in the High Stakes version (because Lee's context is low). PE *must* say it is false. This is a genuine truth-conditional clash, provided we accept that subject stakes can influence the truth of a third-party ascription. Case 2 is muddier because self-ascription conflates the subject and attributor, making it easier for PE to argue that the "context shift" is actually a "stake shift" in disguise.

  ### The Responsibility Twist (Whose Stakes Count?)
  In Case 1, consider the **High Stakes** version again: Devon's personal bonus and job security are *identical* to the Low Stakes version. The risk is borne entirely by the *client* and the *firm*. Devon is insulated from the fallout.
  *   **The Problem for Encroachment:** Standard PE (e.g., Stanley) argues that knowledge depends on the *subject's* stakes. If Devon has nothing to lose personally, PE should predict that Devon *does* know (because for Devon, the stakes are low). But our intuition likely remains that Devon *doesn't* know, because the *action* is high-stakes.
  *   **The Principled Story?** To save the verdict, the Encroachment theorist must expand "subject's stakes" to include "stakes for those the subject is responsible for." This moves PE toward a view where knowledge depends on the **stakes of the action**, not just the agent.
  *   **Does it Break the Case?** Yes, potentially. If the stakes count because of *responsibility*, then the relevant variable isn't "how much does the subject care?" but "how much does the context demand?" This looks suspiciously like a return to attributor-context or an objective normative standard, undermining the core Subject-Sensitive invariantist claim that knowledge is sensitive to the *subject's* practical situation. If Devon doesn't care about the client, but *should*, does knowledge vanish? If yes, PE is no longer about the subject's psychology/practicality, but about objective normative stakes, which blurs the line back toward Invariantism or Contextualism. This suggests the "Nurse" intuition you had (where the nurse feels the stakes of the patient) relies on professional responsibility bridging the gap between subject and third-party stakes—a move PE struggles to formalize without ad-hocery.
