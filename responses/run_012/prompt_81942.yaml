prompt: |-
  I'm in the second year of an MA and I've drifted into the knowledge-attribution literature — contextualism on one side, and the camp that says the subject's own practical stakes get into knowledge itself rather than just the attributor's standards on the other. I can recite the bank cases in my sleep, which is exactly the problem, because last week my girlfriend (she's an ICU nurse) said she didn't know a patient's potassium was high until she'd gone back and rechecked it, even though she'd read the same chart as the resident who said flat out that he knew. And I realised I couldn't tell whether that was her standards as an attributor moving or her stakes as a subject moving, because in that sentence she's both at once. So I want a proper pair of cases instead of another reheated bank, and I want to use them in a seminar presentation as a clean illustration of the subject/attributor split.

  Build me two cases, one paragraph each. First: the person doing the attributing is a bystander and the person being evaluated is somebody else, and the only thing that differs between the two versions is the subject's practical stakes — same evidence, same reliability, same attributor with the same standards and the same conversational context throughout. It has to be a case where the encroachment people say the knowledge ascription flips while a standard contextualist has to say it can't, since nothing about the attributor's context moved. Second: a variant where the attributor is the subject herself, first person, with her evidence and stakes held fixed and only the conversational context she's in shifting — the case where the contextualist says the ascription flips and the encroachment people say it can't. Keep the two variants as close to each other as you can, ideally the same scenario with one thing swapped out. No bank cases, no lotteries, no life-or-death surgery, no brains in vats, no fake barns — I want something ordinary that could plausibly happen to someone I know, a work setting is fine.

  After the two cases, do the check on each one: state the ascription, the subject's evidence, the attributor's standards, and what each theory says about whether the ascription comes out true, then tell me which single feature of the case is actually doing the work. Be honest about whether the encroachment case genuinely flips the verdict or only changes how comfortable we'd be asserting it, and whether the contextualist has a cheap escape (say, that the subject's stakes change what's at issue rather than the standard). Then give me the strongest thing a stubborn old-school invariantist would say to deflate both cases, and say whether either case in the pair is one both camps would have to accept as a real divergence or whether the whole dispute goes verbal once you pin down what the ascription is doing. One last thing, and this is the bit I'm actually curious about: in the first case, try shifting the stakes so they aren't the subject's own but belong to somebody else she's responsible for — a patient, a client, whoever fits the scenario — and tell me whether encroachment even has a principled story about whose stakes count, or whether that move breaks the case open.
