  I recently retired from a career in experimental physics and have been spending my mornings reading philosophy of mind, logic, and AI. A well-regarded popular book on Bayesian rationality — I won't name it, since I want your judgment rather than the author's reputation — glosses the problem of logical omniscience roughly as follows: "Logical omniscience is the assumption built into every Bayesian and epistemic-logic model, namely that the agent knows all logical truths and believes everything that follows from what she believes. Real people overlook obvious entailments, so as a description of reasoning the assumption is plainly false; its defenders call it a harmless idealization, like frictionless planes in mechanics. The critics answer that it is unlike those idealizations because it cannot be relaxed: the probability axioms simply require any coherent agent to assign probability one to every tautology and to everything entailed by what she is certain of. The choice is therefore between a Bayesianism that is false of every actual thinker and an irrationalism that denies logic any authority over belief." I suspect the author has scored a real point but is muddling two or three technical notions, though I can't say which. Please audit the passage: tell me which claims a specialist would accept as stated, which are subtle distortions — in particular of what "logical omniscience" actually names and of what does and does not follow from coherence — what a defender of the idealization would object to, and whether the closing dilemma survives once the passage is corrected. Give your answer as exactly five numbered points, each a sentence or two, with no introduction and no conclusion.
