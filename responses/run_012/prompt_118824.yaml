answer: |-
  ## Stage 1: The Logical Space (Decision Tree)

  The following decision tree maps the logical space of patriotism using ten diagnostic nodes. Each node presents a concrete case and a question. Answering the question directs you to the next relevant node or to a final position (Leaf).

  **Node 1: The Unjust Order**
  *Case:* A soldier is ordered to participate in a war she privately judges to be unjust.
  *Question:* Does her refusal to obey constitute a betrayal of her patriotic duty, or is it the highest enactment of it?
  *   **If Betrayal:** Go to **Node 2**.
  *   **If Highest Enactment:** Go to **Node 5**.
  *   **If Duty Does Not Exist:** Go to **Node 3**.

  **Node 2: The Cost of Loyalty**
  *Case:* A citizen must choose between saving a compatriot or a foreigner from equal harm, with no other distinguishing factors.
  *Question:* Is she morally required to save the compatriot, even if this violates impartial moral standards?
  *   **If Required:** Go to **Leaf A (Robust Patriotism)**.
  *   **If Permissible but not Required:** Go to **Node 7**.
  *   **If Forbidden:** Go to **Leaf B (Outright Vice View)**.

  **Node 3: The Stranger's Claim**
  *Case:* A cosmopolitan argues that we owe equal moral weight to all humans, regardless of borders.
  *Question:* Is there *any* special moral weight to be given to compatriots, or is all partiality morally arbitrary?
  *   **If All Partiality Arbitrary:** Go to **Leaf C (Cosmopolitan Rejection)**.
  *   **If Some Special Weight Exists:** Go to **Node 4**.

  **Node 4: The Source of Obligation**
  *Case:* A naturalized citizen feels patriotic obligations.
  *Question:* Are these obligations grounded in gratitude for benefits received (fair play), or in the sheer fact of membership (associative)?
  *   **If Gratitude/Fair Play:** Go to **Node 6**.
  *   **If Membership/Association:** Go to **Node 7**.

  **Node 5: The Object of Attachment**
  *Case:* A person loves her country's landscape, language, and food but regards its current government as an enemy.
  *Question:* Is this person a patriot, or is patriotism necessarily attachment to a political order?
  *   **Necessarily Political:** Go to **Node 6**.
  *   **Pre-Political (Culture/Land) Allowed:** Go to **Node 9**.

  **Node 6: The Constitutional Basis**
  *Case:* Two citizens debate the foundation of their loyalty. One loves the specific historical institutions; the other loves the universal ideals the institutions *attempt* to embody.
  *Question:* Can the existing political order be rejected while remaining loyal to the nation's core promise?
  *   **No (Order = Promise):** Go to **Leaf D (Constitutional Patriotism)**.
  *   **Yes (Promise > Order):** Go to **Node 8**.

  **Node 7: The Conditionality of Loyalty**
  *Case:* A critic constantly attacks her nation's policies, calling this criticism the truest form of love.
  *Question:* Can patriotism survive the judgment that the nation has fundamentally failed its own standards?
  *   **No (Unconditional):** Go to **Leaf A (Robust Patriotism)**.
  *   **Yes (Conditional):** Go to **Node 8**.

  **Node 8: The Forfeiture Clause**
  *Case:* A nation slides into authoritarianism.
  *Question:* Is there a specific point at which patriotic obligation is not just suspended, but actively turns into a duty to oppose?
  *   **No (Obligation merely suspends):** Go to **Leaf E (Moderate Patriotism)**.
  *   **Yes (Obligation inverts):** Go to **Leaf F (Patriotism as Loyal Dissent)**.

  **Node 9: The Superiority Claim**
  *Case:* A patriot claims she loves her country without believing it is objectively better than others.
  *Question:* Is this distinction intelligible, or does special love necessarily imply a belief in superior worth?
  *   **Implies Superiority:** Go to **Leaf G (Chauvinistic Nationalism)**.
  *   **Does Not Imply Superiority:** Go to **Node 10**.

  **Node 10: The Demand for Action**
  *Case:* An emigrant retains deep patriotic feeling for the country she left but sends no money and votes in no elections.
  *Question:* Is patriotism a purely motivational virtue, or must it issue in effective action to count?
  *   **Purely Motivational:** Go to **Leaf H (Sentimental Patriotism)**.
  *   **Requires Action:** Go to **Leaf E (Moderate Patriotism)**.

  ***

  ## Stage 2: The Positions (Leaves)

  The following leaves represent the terminal positions in the taxonomy. Each is defined by the path taken above and characterized by its "awkward commitment"—the specific implication that makes the position most difficult to defend in seminar.

  **Leaf A: Robust Patriotism**
  *Path:* 1 (Betrayal) → 2 (Required) → 7 (Unconditional).
  *   **Most Awkward Commitment:** You must accept that saving a compatriot's life over a stranger's is morally mandatory even when the compatriot is in the wrong.
  *   **Status:** Occupied.

  **Leaf B: Outright Vice View**
  *Path:* 1 (Betrayal) → 2 (Forbidden).
  *   **Most Awkward Commitment:** You must classify the soldier's refusal to fight an unjust war not as conscientious objection, but as a dereliction of civic duty.
  *   **Status:** Occupied.

  **Leaf C: Cosmopolitan Rejection**
  *Path:* 1 (Duty Does Not Exist) → 3 (All Partiality Arbitrary).
  *   **Most Awkward Commitment:** You must treat the drowning child of a neighbor as having no greater claim on your rescue than the drowning child of a stranger on another continent.
  *   **Status:** Occupied.

  **Leaf D: Constitutional Patriotism**
  *Path:* 1 (Highest Enactment) → 5 (Political) → 6 (Order = Promise).
  *   **Most Awkward Commitment:** You must identify the nation so closely with its current legal institutions that radical reform risks looking like anti-patriotic subversion.
  *   **Status:** Occupied.

  **Leaf E: Moderate Patriotism**
  *Path:* 1 (Highest Enactment) → 7 (Conditional) → 8 (Suspends) → 10 (Requires Action).
  *   **Most Awkward Commitment:** You must draw a precise, defensible line where legitimate criticism becomes unpatriotic disloyalty without relying on the state's own definition of treason.
  *   **Status:** Occupied.

  **Leaf F: Patriotism as Loyal Dissent**
  *Path:* 1 (Highest Enactment) → 5 (Political) → 6 (Promise > Order) → 8 (Inverts).
  *   **Most Awkward Commitment:** You must argue that the person burning the flag in protest is often more loyal to the nation than the person saluting it.
  *   **Status:** Occupied.

  **Leaf G: Chauvinistic Nationalism**
  *Path:* 1 (Betrayal) → 9 (Implies Superiority).
  *   **Most Awkward Commitment:** You must maintain a belief in your nation's objective superiority even in the face of overwhelming evidence of its moral or material decline.
  *   **Status:** Occupied.

  **Leaf H: Sentimental Patriotism**
  *Path:* 1 (Highest Enactment) → 9 (No Superiority) → 10 (Motivational Only).
  *   **Most Awkward Commitment:** You must accept that a citizen who feels deep love for his country but contributes nothing to its welfare or defense is still virtuous.
  *   **Status:** Occupied.

  ***

  ## Diagnostic Notes on the Taxonomy

  **Unoccupied Combinations**
  1.  **Ethnic Patriotism based on Fair Play (Node 4 + Node 9):** *Diagnosis: Incoherent.* If the object of attachment is pre-political (blood/soil), the obligation cannot be grounded in reciprocity for political benefits received. This combination is logically unstable because the "debt" cannot be quantified against a non-political object.
  2.  **Unconditional Constitutional Patriotism (Node 6 + Node 7):** *Diagnosis: Unattractive.* If the object is the *constitution* (a set of norms), claiming loyalty is *unconditional* even when the constitution is violated by the state renders the concept empty. It collapses into Robust Patriotism (Leaf A) but lacks the justification of "the nation" as a transcendent entity.
  3.  **Cosmopolitan with Special Obligations (Node 3 + Node 4):** *Diagnosis: Incoherent.* By definition, if partiality is morally arbitrary (Node 3), one cannot ground special obligations in membership or gratitude (Node 4) without contradicting the root premise.

  **Indistinguishable Leaves**
  *   **Leaf D (Constitutional Patriotism) and Leaf F (Patriotism as Loyal Dissent):**
      *   *Why the tree struggles:* The split at Node 6 ("Order = Promise" vs. "Promise > Order") is often rhetorical rather than substantive. In practice, a Constitutional Patriot who believes the state has betrayed the constitution behaves identically to a Loyal Dissenter.
      *   *Resolution:* They are separated only by their *metaphysics of the state*. Leaf D believes the existing institutions are the best vessel for the ideals; Leaf F believes the ideals exist independently of the institutions. In a seminar, these two will likely talk past one another while voting the same way on concrete cases.

  **Sharpest Discriminators**
  *   **Node 1 (The Soldier):** This is the root discriminator. It separates those who see patriotism as a *constraint* on morality (Vice/Robust) from those who see it as *expressive* of morality (Critical/Conditional).
  *   **Node 5 (The Landscape Lover):** This is the crucial split between Nationalism (ethnic/cultural) and Civic Patriotism. It forces the respondent to decide if the "country" is a place/people or a project.
  *   **Node 8 (The Forfeiture Clause):** This distinguishes the "Moderate" patriot from the "Radical Dissenter." It forces a decision on whether patriotism is a brake on revolution or a fuel for it.
