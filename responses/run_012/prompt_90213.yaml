answer: |-
  The cluster of verdicts you have listed is remarkably coherent, but it does not fit neatly into the two dominant frameworks of classical decision theory: Causal Decision Theory (CDT) or Evidential Decision Theory (EDT). Your intuitions regarding the Prisoner's Dilemma against a duplicate (V1) and Newcomb's Problem (V3) align with EDT, while your intuition regarding the Smoking Lesion (V4) aligns with CDT.

  There is, however, a modern principle that captures all of these verdicts without requiring you to abandon any of them. This principle is known as **Functional Decision Theory (FDT)** (closely related to Timeless Decision Theory).

  ### The Principle: Functional Decision Theory

  **Precise Statement:**
  An agent should choose the output of their decision algorithm that, if logically instantiated, maximizes expected utility. Specifically, you should evaluate your options not by asking "What causes will this physical action produce?" (CDT) or "What evidence does this action provide?" (EDT), but by asking "What is the logical output of my decision procedure, and what other events are logically determined by that output?"

  Under FDT, correlations matter only when they arise from logical dependence (e.g., prediction, simulation, or identical reasoning algorithms). Physical common causes that do not determine the output of your decision algorithm (like the gene in the Smoking Lesion) do not create a logical link between your choice and the outcome.

  **How it Captures Your Verdicts:**
  *   **V1 (PD vs. Duplicate) & V3 (Newcomb):** Your duplicate and the predictor are simulating or running the same decision algorithm as you. Your decision logically determines theirs. Therefore, Cooperating/One-Boxing maximizes utility.
  *   **V2 (PD vs. Stranger):** There is no logical link between your algorithm and the stranger's. You treat their choice as independent. Defection is dominant.
  *   **V4 (Smoking Lesion):** The gene is a physical cause that influences your desires, but your decision algorithm's output does not logically determine the presence of the gene. You should smoke if you enjoy it, ignoring the evidential link.
  *   **V5 (Threshold Lottery) & V7 (Public Good):** In symmetric cases where everyone uses the same rational algorithm, your decision logically implies theirs. In V5, "Enter" implies "Everyone Enters" (Loss), so you "Do Not Enter." In V7, "Contribute" implies "Everyone Contributes" (Gain), so you "Contribute," even without causal pivotality.
  *   **V6 (Conditional Public Good):** If you lack reason to believe others are running the same algorithm (e.g., you believe they will defect regardless), the logical link is broken. You revert to causal pivotality.

  ### Which Verdict Must You Give Up?

  If you adopt Functional Decision Theory, **you do not have to give up any of your verdicts.** They are fully consistent under this framework.

  However, I must be honest about the philosophical landscape: FDT is not yet the consensus view. If you insist on adhering to a *classical* framework, you must make a sacrifice:
  *   **If you choose CDT:** You must give up **V1** and **V3**. CDT dictates defecting against a duplicate and two-boxing in Newcomb's problem because your action does not *cause* the other's choice or the box's content.
  *   **If you choose EDT:** You must give up **V4**. EDT dictates not smoking in the Smoking Lesion case because smoking is strong evidence of the gene (and thus cancer).

  Since you asked for a principle that captures your list, FDT is the only candidate that requires no overturning of your stated intuitions.

  ### A New Case: XOR Blackmail

  To test whether you truly hold to FDT (and not just a mix of CDT and EDT), consider this case which separates FDT from EDT.

  **The Case:**
  A malicious predictor sends you a letter demanding $1,000. The predictor sends the letter if and only if they predict you will pay the money *and* no disaster occurs, OR they predict you will not pay *and* a disaster occurs. (Essentially, they only blackmail you if you are the type to pay when there is no disaster, or if a disaster happens regardless).
  *   If you receive the letter, you know a disaster has occurred *or* the predictor thinks you will pay.
  *   Paying the money does not stop the disaster (it has already happened or didn't happen independently).
  *   Paying only satisfies the blackmailer.

  **FDT Verdict:** **Do Not Pay.**
  Your decision algorithm's output does not logically determine whether the disaster occurred or whether the letter was sent in a way that benefits you. Paying only loses you $1,000. Unlike Newcomb's Problem, where your choice determines the *past* placement of money via prediction, here the prediction structure is such that paying does not logically optimize the outcome.

  **EDT Verdict:** **Pay.**
  Receiving the letter is evidence that you are in the world where paying is correlated with the "better" branch of the predictor's logic (i.e., paying is evidence that the predictor predicted you would pay, which is part of the condition for the letter being sent in the no-disaster scenario). EDT agents often get blackmailed in these scenarios because they treat their payment as evidence that they are in the "safe" world.

  **CDT Verdict:** **Do Not Pay.**
  Paying has no causal effect on the disaster or the letter.

  If you agree with the FDT verdict here (Do Not Pay), your view is fully consistent. If you feel you should Pay, you are likely leaning toward EDT and would need to reconsider your verdict on the Smoking Lesion (V4) to maintain consistency.

  ### Summary
  Your intuitions are not inconsistent; they are simply **non-classical**. They align with **Functional Decision Theory**. You need not abandon any verdicts provided you accept that rationality involves managing the logical implications of your decision algorithm, not just its causal effects or evidential correlations.
