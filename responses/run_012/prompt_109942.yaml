answer: |-
  To the Governing Council,

  We meet on the fifteenth to decide whether to submit our registration by the thirtieth, and I write this because the choice before us is not merely administrative but spiritual. We are writers, and the thing we protect is the capacity to attend to the world without lying. Two years ago the law changed, and now a party label buys a seat at the broadcasting council and access to public funds that would secure our hardship committee and legal-aid service for a decade. The faction in favour, led by our poet on the legal-aid committee, argues that purity does not pay rent. They say that for eleven years we have petitioned for the public lending right in vain, and that the only voices the state amplifies are those that speak the language of the ballot. They are right that the hardship fund is depleted and that midlist translators cannot eat on principle. To vote against registration is to risk the material survival of colleagues who do not have the luxury of my foreign royalties. I do not dismiss this. If we remain a guild while others become parties, we may find ourselves shouting into a void while others legislate the terms of our contracts.

  However, I urge you to vote against registration on the fifteenth. I do so not because I believe we should withdraw from the world, but because I believe the form of the party demands a corruption we cannot afford. Simone Weil argues that a party is an organism with a will to survive, and that this will compels it to hold positions on everything. She claims this forces members into insincerity, corroding the attention honest work requires. I find myself departing from Weil only in her conclusion that parties should be abolished entirely; the state will not dissolve them, and collective power is necessary. But where she is correct, and where our danger lies, is in the mechanism of the form itself. The electoral commission requires fifteen fixed questions for registration. Three concern copyright, translation, and lending. Twelve concern energy prices, border disputes, and retirement ages. To register is to swear we have a position on twelve matters outside our competence. This is not sociology; this is structure. It does not matter if our members are honest people; the form demands we pretend to be experts on gas grids to secure rights for translators.

  Our lawyer has proposed a workaround: a separate legal entity, a different name on the ballot, guild funds ring-fenced, members free to decline. This does not answer Weil's objection; it merely relocates it. The same people would be doing the subscribing. If I sign the manifesto of the separate entity, I am still asserting knowledge I do not have. If I decline, I fracture the unity required to win the seat. The corruption is not in the mass base or the appetite for winning, which we might control, but in the requirement to answer the fifteen questions at all. The form forces the lie. If we become a party, we must act like one, and acting like one means prioritizing the survival of the party over the truth of the work. We would find ourselves defending energy policies we do not understand because to contradict them would lose us the broadcasting seat we need for lending rights. The tail would wag the dog.

  I know this sounds like privilege. It is easy for a novelist whose books are published abroad to prefer purity on behalf of colleagues who cannot afford it. The hardship fund is what the guild is for, and the broadcasting seat is worth a great deal. But Weil herself never withdrew from the world; she worked in factories and fought in Spain. She did not use her philosophy as an alibi for doing nothing. Neither should we. If we vote against registration, we must not retreat. We must commit to a campaign of aggressive lobbying that does not require us to lie about energy prices. We can form coalitions with existing parties on specific clauses without swallowing their manifestos. We can leak our policy papers to the press without sitting on the cultural commission. We can raise the hardship fund through private endowment rather than public subsidy that comes with strings attached.

  The poet leading the faction in favour argues that a guild that does not become a party stops being relevant. I argue that a guild that becomes a party stops being a guild. If we register by the thirtieth, we gain a seat but lose our soul. We will spend the next decade debating border disputes instead of contract law. We will become insincere, not because we are bad people, but because the form requires it. I recommend we vote against registration at the meeting on the fifteenth. Let us miss the deadline. Let us keep our name clear. We will find the money elsewhere, and we will make ourselves heard without signing away our right to say I do not know.

  Yours,

  A Member of the Council
