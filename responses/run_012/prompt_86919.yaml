answer: |-
  This is a remarkably precise framing of the problem. You have correctly identified that the "demandingness objection" is not a single argument but a cluster of concerns that only become decisive under specific meta-ethical and normative assumptions. The fact that you and Marta are separated by 0.40 on the probability scale suggests you are indeed weighting these underlying assumptions differently.

  Here is my decomposition, my number, and my diagnosis of your disagreement.

  ### The Number
  My credence that the demandingness objection is a **decisive** objection (i.e., it renders act-consequentialism *false*, not merely difficult) is **0.35**.

  I view it as a severe structural flaw that forces significant revision or qualification of the theory, but not necessarily a falsification on its own.

  ### The Decomposition
  To arrive at 0.35, I treat the claim "The objection is decisive" as a conjunction of three necessary conditions. If any one of these fails, the objection loses its decisive force (though it may remain a practical worry).

  $$P(\text{Decisive}) \approx P(A) \times P(B) \times P(C)$$

  #### 1. The Nature of the Objection: Integrity vs. Cost ($P(A) = 0.75$)
  *   **The Question:** Is the objection merely that consequentialism requires too much *sacrifice* (money, comfort), or that it requires a disintegration of the *self* (loss of integrity, projects, and commitments)?
  *   **The Logic:** If the objection is just about "cost" (e.g., "I have to give away my wallet"), consequentialists can bite the bullet and say, "Yes, morality is costly." That doesn't make the theory *false*, just expensive. For the objection to be decisive, it must show that the theory makes a category error about agency—specifically, Bernard Williams' argument that consequentialism alienates the agent from their "ground projects."
  *   **My Probability:** 0.75. I think the "Integrity" reading is the philosophically robust one. The "Cost" reading is weak. However, I leave 0.25 uncertainty because some argue that even extreme cost doesn't falsify a truth-claim about morality.

  #### 2. The Failure of Escape Hatches ($P(B) = 0.60$)
  *   **The Question:** Do the standard defensive maneuvers fail to neutralize the objection?
  *   **The Logic:** This is the biggest bucket of counter-arguments.
      *   *Criterion vs. Decision Procedure:* AC defines what is *right*, not how to *decide*. You can use non-consequentialist heuristics to maximize consequences.
      *   *Ought Implies Can:* If the demand is physically/psychologically impossible, AC doesn't require it.
      *   *Satisficing/Threshold:* Maybe you only need to do "good enough," not "best."
      *   *Biting the Bullet:* Maybe morality *is* that demanding (Singer/Norcross), and our intuition is the problem, not the theory.
  *   **My Probability:** 0.60. I assign this a 60% chance that these hatches *fail* to fully resolve the tension. The "Criterion vs. Procedure" distinction is strong, but it often feels like a dodge when the theory's *truth conditions* still condemn your life as morally suboptimal. However, because these defenses are logically coherent, I cannot assign a probability near 1.0 that they fail.

  #### 3. Meta-Ethical Internalism ($P(C) = 0.70$)
  *   **The Question:** Must a true moral theory be capable of motivating a rational agent without destroying their rationality?
  *   **The Logic:** This is the point you half-understood. If moral truth is external (like geology), it doesn't matter if humans can't live up to it; the truth remains. If moral truth is internal (tied to reasons for action), a theory that demands the abandonment of all personal reasons might cease to provide *reasons* at all, thus ceasing to be a moral theory.
  *   **My Probability:** 0.70. I lean towards a form of internalism where a moral theory that systematically undermines the agent's capacity for agency is self-defeating. But since Externalism is a live position, I can't go higher.

  #### The Calculation
  $$0.75 \text{ (Integrity)} \times 0.60 \text{ (Hatches Fail)} \times 0.70 \text{ (Internalism)} = 0.315$$

  Rounding to **0.35** to account for the possibility that one factor could be decisive on its own (e.g., if the Integrity objection is fatal regardless of escape hatches).

  ### Sensitivity Analysis
  **Which term moves the needle most?**
  The **Escape Hatches ($P(B)$)** term is the most sensitive.

  *   **Why:** If you accept the distinction between the *criterion of rightness* and the *decision procedure*, the demandingness objection largely evaporates as a claim about *falsity*. The theory can be true (the best act is the one that maximizes good) even if you shouldn't try to calculate it every morning.
  *   **What would move it:** Evidence or argument showing that the "Criterion/Procedure" distinction is unstable. For example, if it can be shown that a theory's truth conditions *necessarily* infect the agent's deliberation (i.e., you can't know the truth of AC without it altering your motivations destructively), then $P(B)$ shoots up toward 0.9, and my final credence rises to ~0.50.
  *   **Conversely:** If you are convinced that "biting the bullet" is a valid philosophical move (i.e., intuitions about demandingness are just bourgeois biases), $P(B)$ drops toward 0.2, and my final credence crashes to ~0.10.

  ### Diagnosis: You vs. Marta
  You are at 0.55; Marta is at 0.15. That is a massive gap. Based on her PPE background and your description, I am 90% confident your disagreement lies in **Factor 2: The Escape Hatches**, specifically the **Criterion vs. Decision Procedure** distinction.

  **Marta's Position (0.15):**
  In PPE programs, the standard defense of consequentialism against demandingness is to argue that Act-Consequentialism is a **criterion of rightness**, not a **decision procedure**.
  *   *Her view:* "The theory says the right act is the one that maximizes good. It does *not* say you must consciously calculate the maximization in every moment. You can raise your children and paint pictures (following common sense) because doing so generally maximizes good. Therefore, the theory is not 'demanding' in practice, only in abstract evaluation. The objection fails to show the theory is *false*."
  *   This allows her to keep the credence very low. She sees the objection as attacking a straw man (consequentialism as a micromanaging algorithm).

  **Your Position (0.55):**
  You are likely focusing on the **truth conditions** of the theory, regardless of how one decides.
  *   *Your view:* "Even if I don't have to *calculate* it, if the theory says my quiet retirement is *objectively less morally valuable* than me working 80 hours for charity, then the theory is making a claim about the world that seems false. It devalues my projects *in principle*, even if it lets me keep them *in practice*."
  *   You are treating the "demand" as an ontological claim about value, not a psychological claim about stress.

  **The Pivot Point:**
  To move Marta, you would need to argue that a moral theory that *evaluates* your life as suboptimal (even if it doesn't require you to change it) is still failing to capture the nature of morality (Williams' Integrity argument).
  To move you, Marta would need to convince you that the *action-guiding* nature of ethics is the only part that matters for "truth," and that evaluative claims without action requirements are harmless.

  ### A Note on the "Motivation" Point
  You mentioned: *"whether the objection secretly assumes that a moral theory has to be the sort of thing a person could actually be motivated by."*

  You are right to be suspicious of begging the question here. This is the debate between **Moral Internalism** (moral judgments entail motivation) and **Externalism** (moral judgments are facts that may not motivate).
  *   If Externalism is true, the demandingness objection is weak. The truth of geology doesn't care if you are motivated to study it.
  *   If Internalism is true, the objection is strong. If AC demands you abandon the very projects that give you reasons to act, it saws off the branch it sits on.

  Most contemporary meta-ethicists lean toward a sophisticated Internalism (reasons must be grounded in the agent's subjective motivational set). If you accept that, the demandingness objection gains significant traction. If Marta is a robust Realist/Externalist, she will dismiss this entirely.

  ### Summary for Your Reading Group
  1.  **My Number:** 0.35 (Serious problem, not necessarily fatal).
  2.  **Key Driver:** Whether the "Criterion vs. Procedure" defense holds water.
  3.  **Your Disagreement:** You are arguing about the *evaluative status* of non-maximizing acts (You: the theory condemns them, so it's false. Marta: the theory doesn't require you to calculate them, so it's usable/true).
  4.  **Next Step:** Don't discuss "how hard it is to give money." Discuss Bernard Williams' "Integrity" argument and Peter Railton's "Alienation" argument. That is where the actual philosophical weight lies.

  You are asking the right questions. The fact that you identified the "motivation/internalism" hinge without formal training suggests your reading group is punching above its weight. Keep digging there.
