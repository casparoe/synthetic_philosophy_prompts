  # Diagnostic Decision Tree: The Paradox of Fiction

  **Instructions:** Begin at Node 1. Answer the question based on your immediate phenomenological experience of the cases described, not on what you think a theory *should* say. Follow the branch that matches your intuition to the next node or a final leaf.

  ### Node 1: Phenomenological Status
  **Case:** Consider **recoiling from a monster on screen** or **weeping at a character's death in a novel**.
  **Question:** Does this feeling feel phenomenologically identical to the emotion you would feel if the event were happening to a real person in front of you, or does it feel like a distinct, lighter, or "make-believe" state (an *as-if* emotion)?
  *   **Identical/Full Strength:** Go to Node 2.
  *   **Distinct/Make-Believe/Bare Arousal:** Go to Node 3.
  *   **No Emotional Response:** Go to Leaf 1.

  ### Node 2: The Existence Condition
  **Case:** Consider a **reality-television contestant whose presentation you suspect is partly scripted**.
  **Question:** To feel pity or anger toward this person, must you judge that they actually exist and that the situation is factual, or can you feel the emotion even if you know the scenario is constructed?
  *   **Must Exist (Belief Required):** Go to Node 4.
  *   **Can Be Constructed (Belief Not Required):** Go to Node 5.

  ### Node 3: Quasi-Emotion Object
  **Case:** Consider an **abstract painting or instrumental passage that moves you with no character anywhere in it**.
  **Question:** If the state is not a full emotion, is it directed at an object (like a shape or sound), or is it merely a physiological arousal (startle, tension) with no intentional object?
  *   **Directed at Form/Object:** Go to Leaf 2.
  *   **Bare Physiological Arousal:** Go to Leaf 3.

  ### Node 4: Belief Satisfaction
  **Case:** Consider **a story about a real historical atrocity from which you cannot separate the real victims**.
  **Question:** If emotion requires belief in existence, how do you account for your feelings toward the *fictional* elements? Do you momentarily believe they exist, or are you actually feeling emotion toward the real-world types/victims the fiction represents?
  *   **Momentary Belief (Illusion):** Go to Node 6.
  *   **Displaced to Real Types/Victims:** Go to Node 6.

  ### Node 5: Object Location
  **Case:** Consider **weeping at a character's death in a novel** (knowing they are invented).
  **Question:** If you do not need to believe they exist, what is the immediate target of your sadness: the individual nonexistent particular, the thought or proposition the text supplies, or nothing determinate?
  *   **The Thought/Proposition:** Go to Node 6.
  *   **The Nonexistent Particular:** Go to Node 6.
  *   **Nothing Determinate:** Go to Leaf 4.

  ### Node 6: Functional Role (Offline vs. Online)
  **Case:** Consider **a game character whose fate is under your control**.
  **Question:** Does the feeling motivate you to intervene in the real world (e.g., call the police, help the actor), or does it remain contained within the experience (decoupled from action)?
  *   **Motivates Real Action:** Go to Leaf 5.
  *   **Contained/Offline:** Go to Node 7.

  ### Node 7: Generalizability Test
  **Case:** Consider **fear of merely possible accidents** or **anger at the dead**.
  **Question:** Does your explanation for fiction-directed emotion also apply to these non-fiction cases where the object does not currently exist, or is your explanation specific to fiction?
  *   **Generalizes to Non-Fiction:** Go to Node 8.
  *   **Fiction-Specific Patch:** Go to Node 8.

  ### Node 8: The Hedonic Paradox
  **Case:** Consider **why anyone seeks out sadness in tragedy and fear in horror**.
  **Question:** Do you seek out the negative feeling itself (converting it to pleasure), or do you endure it for the sake of something else (insight, catharsis, art)?
  *   **Seek the Feeling (Conversion/Dose):** Go to Leaves 6–9.
  *   **Endure for Value (Compensation):** Go to Leaves 10–12.

  ---

  ### Terminal Leaves

  **Leaf 1: Hard Skepticism**
  *   **Position:** No genuine emotion occurs; reports of emotion are metaphorical or mistaken.
  *   **Awkward Commitment:** Must explain away the vivid phenomenology of weeping or trembling as non-emotional.
  *   **Generalizability:** N/A (Denies the data).
  *   **Occupancy:** Held by some strict cognitivists, but rare among audiences.

  **Leaf 2: Formalist Objectivism**
  *   **Position:** Emotion is directed at the form (colors, sounds, narrative structure) rather than content.
  *   **Awkward Commitment:** Struggles to explain why specific content (a death vs. a wedding) changes the emotion if only form matters.
  *   **Generalizability:** General (Applies to all art).

  **Leaf 3: Arousal Theory**
  *   **Position:** Fiction triggers physiological arousal (startle, tension) without cognitive appraisal or object.
  *   **Awkward Commitment:** Cannot distinguish between fear of a monster and excitement at a race without reference to an object.
  *   **Generalizability:** General (Biological).

  **Leaf 4: Objectless Emotion**
  *   **Position:** Emotions can be free-floating states not directed at any particular object or proposition.
  *   **Awkward Commitment:** Contradicts the standard view that emotions are intentional (about something).
  *   **Generalizability:** General (Mood-based).

  **Leaf 5: Action-Ready Illusionism**
  *   **Position:** We momentarily believe the fiction is real, motivating real action (rare).
  *   **Awkward Commitment:** Fails to explain why we rarely actually call the police when a character is murdered.
  *   **Generalizability:** Fiction-Specific Patch.

  **Leaf 6: Illusionism + Self-Imposed Dose**
  *   **Position:** We temporarily believe the fiction, enjoying the fear like a rollercoaster.
  *   **Awkward Commitment:** Requires a mechanism for voluntarily suspending disbelief that we cannot voluntarily restore.
  *   **Generalizability:** Fiction-Specific Patch.

  **Leaf 7: Displacement + Moral Outrage**
  *   **Position:** We feel anger at the *real* injustices the fiction highlights, not the fictional events.
  *   **Awkward Commitment:** Makes weeping for a specific character's death inexplicable if the real victims are abstract.
  *   **Generalizability:** General (Applies to propaganda/documentary).

  **Leaf 8: Displacement + Compensation**
  *   **Position:** We endure sadness for the sake of moral insight about real types.
  *   **Awkward Commitment:** Turns aesthetic experience into a moral lesson, ignoring formal pleasure.
  *   **Generalizability:** General (Ethical criticism).

  **Leaf 9: Non-Doxastic Particulars + Safe Danger**
  *   **Position:** We feel for nonexistent individuals without belief, enjoying the safety of the distance.
  *   **Awkward Commitment:** Must explain how we identify a "particular" that does not exist.
  *   **Generalizability:** General (Covers fear of future accidents).

  **Leaf 10: Thought Theory + Cognitive Value**
  *   **Position:** We feel emotion toward the *proposition* that such-and-such is happening.
  *   **Awkward Commitment:** Claims we can be emotionally moved by a bare thought without imagining it vividly.
  *   **Generalizability:** General (Covers anger at the dead).

  **Leaf 11: Simulation Theory + Emotional Range**
  *   **Position:** We run an offline simulation of emotion to expand our emotional repertoire.
  *   **Awkward Commitment:** Suggests art is a training ground, potentially reducing its intrinsic value.
  *   **Generalizability:** General (Evolutionary psychology).

  **Leaf 12: Pretense Theory + Compensation**
  *   **Position:** We make-believe we feel emotion, enduring the "quasi-sadness" for aesthetic payoff.
  *   **Awkward Commitment:** Denies the reality of the tears shed, calling them physiological side-effects of pretense.
  *   **Generalizability:** Fiction-Specific Patch.

  ---

  ### Analysis of Logical Space

  #### Unreachable Combinations
  | Combination | Diagnosis |
  | :--- | :--- |
  | **Genuine Emotion + No Object + Belief Required** | **Incoherent.** If belief in existence is required, there must be an object believed to exist. |
  | **Bare Arousal + Directed at Proposition** | **Incoherent.** Arousal theory explicitly denies intentional objects; propositions are objects. |
  | **Action-Ready + Pretense** | **Unattractive.** If the state is pretend, it should not motivate real-world intervention (e.g., calling police). |
  | **Fiction-Specific + Generalizes to Dead** | **Contradictory.** If it explains emotion for the dead, it is by definition not fiction-specific. |

  #### Indistinguishable Pairs
  | Pair | Why the Tree Fails to Separate | Further Question Needed |
  | :--- | :--- | :--- |
  | **Thought Theory vs. Simulation Theory** | Both deny belief requirement and locate emotion offline. | "When you feel sadness, are you *thinking about* a situation, or *imagining yourself in* the situation?" (Cognitive vs. Embodied). |
  | **Illusionism vs. Non-Doxastic Particulars** | Both result in full emotion toward a character. | "If asked mid-scene, do you believe the character is in the room with you?" (Doxastic commitment). |
  | **Displacement vs. Historical Inseparability** | Both target real victims. | "If you learned the story was 100% fabricated, would the emotion vanish?" (Dependence on truth). |

  #### The "No Response" Reader
  A reader who reports no emotional response to fiction is sorted at **Node 1** to **Leaf 1 (Hard Skepticism)**.
  *   **Occupancy:** This leaf is occupied by a small minority of viewers (alexithymic or hyper-rational), but it is also the *theoretical* position of Hard Skeptics who argue that *no one* truly feels emotion for fiction, even if they report it. The tree treats the phenomenological report as truth, so a theorist who denies the report would have to reject the tree's starting axiom.

  #### The Tragedy and Horror Paradoxes
  The tree handles these via **Node 8 (The Hedonic Paradox)**.
  *   **Argument for Integration:** The Paradox of Fiction (Ontological) and the Paradox of Tragedy (Hedonic) are distinct but overlapping. One asks *how* we feel; the other asks *why* we seek it. Separating them entirely would require a second tree, but since the "why" often depends on the "how" (e.g., we seek it *because* it is safe simulation), a sub-branch is more efficient.
  *   **Self-Imposed Dose Hypothesis:** This is treated in **Leaf 6** and **Leaf 9**. It is positioned as a **supplement** to ontological resolutions, not a rival. One can hold that emotions are genuine (Ontological Generalization) *and* that we seek them like chili peppers (Hedonic Dose). The tree isolates this to show that solving the ontological paradox does not automatically solve the hedonic one.

  #### Technical Glossary
  *   **Doxastic:** Relating to belief.
  *   **Intentional Object:** The thing a mental state is *about* (e.g., the monster is the object of fear).
  *   **Phenomenologically:** How the experience feels from the inside.
  *   **Offline/Decoupled:** A mental state that does not lead to standard behavioral outcomes (e.g., feeling fear without running away).
  *   **Nonexistent Particular:** A specific individual (e.g., Harry Potter) who is treated as an object of thought but does not exist in reality.
  *   **Proposition:** A statement or thought-content that can be true or false (e.g., "That the character died").
