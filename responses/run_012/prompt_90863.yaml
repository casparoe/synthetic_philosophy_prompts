answer: |-
  Here is a ranking of the five criteria, ordered by their utility to a public health service charged with administering funding, weighing the accuracy of their verdicts against their administrative viability.

  **1. The Medical Line**
  *Verdicts:* High. *Administrability:* High.
  This is the *status quo* for a reason. By tethering funding to established diagnostic codes (ICD or DSM), a health service gains a defensible, bureaucratic shorthand. It correctly excludes the mood wearable and exam stimulants, as neither presupposes a pathology. It handles growth hormone well, provided short stature is not medicalised. Its only stumble is prophylaxis; strictly speaking, a vaccine treats no existing disease. However, medicine has long accommodated this via 'risk factor' classifications, allowing the line to hold. Its vulnerability lies in your second count: it is susceptible to capture by those who can lobby to have their grievances classified as disorders. Yet, compared to the alternatives, it remains the only criterion with an existing infrastructure capable of processing millions of claims without collapsing into litigation.

  **2. The Trajectory Test**
  *Verdicts:* Very High. *Administrability:* Moderate/Low.
  Your friend's proposal is philosophically elegant and secures the correct verdicts on the awkward cases better than the Medical Line, particularly regarding prophylaxis. Arresting a decline is intuitively therapeutic, even if no disease is yet present. It also neatly distinguishes between the ADHD patient (restoring a cognitive baseline) and the student (bending the curve). However, for an administrator, it is a evidentiary nightmare. Establishing a counterfactual trajectory requires guessing what *would* have happened absent the intervention. It invites narrative manipulation: every applicant will argue they were on a path to genius, merely seeking to restore their 'true' trajectory. It serves the health service well in theory, but poorly in the claims office.

  **3. The Statistical Line**
  *Verdicts:* Moderate. *Administrability:* High.
  Defining therapy as a return to the species-typical range is objective and easy to measure. It correctly flags the mood wearable and growth hormone (assuming the child is within the normal curve) as enhancements. However, it yields morally awkward verdicts. It implies that restoring an elderly person to the 'typical' function of an octogenarian is therapy, but restoring them to the function of a forty-year-old is enhancement, even if the latter is medically possible. Furthermore, 'species-typical' is a moving target; as enhancements become common, the statistical mean shifts, potentially reclassifying therapies as maintenance. It is administratively robust but ethically blunt.

  **4. The Opportunity Line**
  *Verdicts:* High. *Administrability:* Very Low.
  Rooted in the work of Norman Daniels, this criterion aligns best with the moral mission of a public health service: protecting a fair share of opportunity. It justifies funding ADHD treatment (opportunity hindered) while denying exam stimulants (opportunity already fair). Yet, as an administrative tool, it is unworkable. 'Opportunity' is boundless and subjective. A short child might argue height limits sporting opportunity; a shy adult might claim a mood wearable aids social opportunity. To apply this case-by-case would require a tribunal to weigh the social value of every human capability. It is a splendid principle for policy, but a disaster for a claims form.

  **5. The Welfare Line**
  *Verdicts:* Low. *Administrability:* None.
  This criterion should be struck out. Defining therapy as that which lifts well-being above a threshold collapses the distinction entirely. A mood-lifting wearable undoubtedly lifts well-being; if the recipient claims their baseline happiness is below the 'threshold', the health service has no objective metric to refute them. It renders the therapy/enhancement distinction porous to the point of invisibility. While well-being is the ultimate *goal* of medicine, it is too subjective to serve as the *gatekeeper* for funding.

  ***

  **Note on the Trajectory Test**
  The trajectory test lands at number two. It is the superior *philosophical* instrument for your column, as it cuts through the noise of medicalisation to ask what the intervention is actually *doing* to the patient's life course. However, for a health service, it substitutes the problem of defining 'disease' with the equally thorny problem of defining 'normality over time'. It is best used as a check against the medicalisation of the Medical Line, rather than a replacement for it.

  **Recommendation on Striking Out**
  The **Welfare Line** should be struck out immediately. It offers no friction against unlimited demand and provides no actionable definition for an administrator. To use it would be to invite the end of rationing altogether.
