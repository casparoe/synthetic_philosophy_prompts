  *(Self-Correction on "Rank"):* Aiming for rank is logically distinct from aiming for score. If I aim for rank, I might prefer my score stay static while others drop. This is morally repugnant for a welfare metric. This is a key conceptual defeater.

  *(Final Plan):*
  1. Summary: High exposure on rank, moderate on validity.
