      *   *Insight:* The debate won't progress philosophically because it's become a "theoretical zombie." It needs to be dissolved by empirical data.
      *   *Key Distinction:* Representational Format vs. Causal Role. Intellectualists win on Format (maybe it's all propositions). Skill camp wins on Causal Role (propositions don't move limbs without compilation).

  8.  **Final Output Structure:**
      *   Verdict on Hypothesis (Mostly right, but with a caveat).
      *   The Real Substantive Core (Causal Architecture).
      *   Why it feels stuck (The Isomorphism Trap).
      *   What Progress Looks Like (Empirical/Interventional).
