  # Handout: Common Knowledge of Rationality and Backward Induction

  ## 1. The Game
  **Players:** Player 1 (P1) and Player 2 (P2).  
  **Structure:** Finite extensive-form, perfect information.  
  **Nodes:** 3 Decision Nodes.  
  **Actions:** 2 options at each node.  
  **Preferences:** Strict (no indifference).

  ### The Tree and Payoffs
  Payoffs are listed as $(P1, P2)$.

  1.  **Node 1 (P1):** Choose **Out** or **In**.
      *   If **Out**: Game ends. Payoffs: **$(1, 1)$**.
      *   If **In**: Go to Node 2.
  2.  **Node 2 (P2):** Choose **Left** or **Right**.
      *   If **Left**: Game ends. Payoffs: **$(0, 3)$**.
      *   If **Right**: Go to Node 3.
  3.  **Node 3 (P1):** Choose **Up** or **Down**.
      *   If **Up**: Game ends. Payoffs: **$(2, 4)$**.
      *   If **Down**: Game ends. Payoffs: **$(5, 1)$**.

  ---

  ## 2. Backward Induction (The Standard Solution)
  We solve from the last node up, assuming players optimize at every node they reach.

  1.  **At Node 3:** P1 compares **Up** (2) vs. **Down** (5). P1 chooses **Down**.
  2.  **At Node 2:** P2 anticipates P1 will choose **Down**. P2 compares **Left** (3) vs. **Right** $\to$ **Down** (1). P2 chooses **Left**.
  3.  **At Node 1:** P1 anticipates P2 will choose **Left**. P1 compares **Out** (1) vs. **In** $\to$ **Left** (0). P1 chooses **Out**.

  **Backward Induction (BI) Outcome:** **Out**. Payoffs: **$(1, 1)$**.

  ---

  ## 3. Scenario (a): Rationality as Ex-Ante Strategy Optimization
  **Definition:** A player is 'rational' if their chosen *strategy* (a complete plan of action for the whole game) maximizes expected utility given their beliefs at the start of the game. They do not re-optimize if they reach a node they initially believed was unlikely.

  **The Claim:** There is a belief profile consistent with Common Knowledge of Rationality (CKR) under this definition where the outcome is **not** the BI outcome (i.e., they play **In, Right, Up**).

  **The Belief Profile:**
  *   **P1's Belief:** P1 believes P2 will play **Right**.
  *   **P2's Belief:** P2 believes P1 will play the strategy **(In, Up)**.

  **Verification of Rationality (Ex-Ante):**
  *   **Is P1 Rational?**
      *   P1 compares strategies given the belief that P2 plays **Right**.
      *   Strategy **(Out)**: Payoff 1.
      *   Strategy **(In, Down)**: Leads to **Right, Down**. Payoff 5.
      *   Strategy **(In, Up)**: Leads to **Right, Up**. Payoff 2.
      *   *Wait, if P1 believes P2 plays Right, P1 should play (In, Down) for 5.*
      *   *Correction for the Counterexample:* For (a) to work, P1 must believe that playing **Down** would cause P2 to play **Left**. P1's belief must be about the *correlation* between P1's strategy and P2's response (or P1 believes P2's strategy depends on P1's plan).
      *   *Refined Belief Profile for (a):*
          *   **P1's Belief:** "If I plan **(In, Up)**, P2 will play **Right**. If I plan **(In, Down)**, P2 will play **Left**." (P1 believes P2 can distinguish P1's plan).
          *   **P2's Belief:** "P1 is planning **(In, Up)**."
      *   **P1's Calculation:**
          *   Plan **(In, Up)** $\to$ P2 plays **Right** $\to$ Payoff 2.
          *   Plan **(Out)** $\to$ Payoff 1.
          *   Plan **(In, Down)** $\to$ P2 plays **Left** $\to$ Payoff 0.
          *   **Optimal Plan:** **(In, Up)**. (2 > 1 and 2 > 0). P1 is Rational.
      *   **P2's Calculation:**
          *   Belief: P1 plays **Up** at Node 3.
          *   Action **Left**: Payoff 3.
          *   Action **Right**: Leads to **Up**. Payoff 4.
          *   **Optimal Action:** **Right**. (4 > 3). P2 is Rational.

  **Verification of CKR:**
  *   P1 knows P2 is Rational: P1 knows P2 maximizes EU given P2's belief (that P1 plays Up).
  *   P2 knows P1 is Rational: P2 knows P1 maximizes Ex-Ante EU given P1's beliefs (that P2 responds to the plan).
  *   Hierarchy: This mutual knowledge can extend infinitely because the definitions are consistent with the beliefs held.

  **Outcome:** **In, Right, Up**. Payoffs: **$(2, 4)$**.
  **Result:** This is **not** the BI outcome (Out), yet both players are Rational under definition (a).

  ---

  ## 4. Scenario (b): Rationality as Sequential Optimization
  **Definition:** A player is 'rational' if, at *each* decision node they reach, they take the move that is best given what they know at that moment. (Also known as Sequential Rationality).

  **The Claim:** CKR under this definition **forces** the Backward Induction outcome.

  **The Logic:**
  1.  **Common Knowledge:** P2 knows P1 is Rational(b). P1 knows P2 knows this, etc.
  2.  **Node 3:** If Node 3 is reached, P1 *must* optimize. **Down** (5) > **Up** (2). P1 *will* play **Down**.
  3.  **Node 2:** P2 knows P1 is Rational(b). Therefore, P2 *knows* that if Node 3 is reached, P1 will play **Down**. P2 compares **Left** (3) vs. **Right** $\to$ **Down** (1). P2 *must* play **Left**.
  4.  **Node 1:** P1 knows P2 is Rational(b). Therefore, P1 *knows* P2 will play **Left**. P1 compares **Out** (1) vs. **In** $\to$ **Left** (0). P1 *must* play **Out**.

  **Outcome:** **Out**. Payoffs: **$(1, 1)$**.
  **Result:** The BI outcome is forced.

  ---

  ## 5. Analysis for the Reading Group

  ### What feature of the tree is doing the work in (a)?
  The crucial feature is **the third decision node (P1's second move)**.

  In Scenario (a), P1's ability to commit to a plan that is *sequentially suboptimal* at Node 3 (**Up**) is what makes the strategy **In** optimal at Node 1. P1 uses the plan at Node 3 as a strategic signal to influence P2 at Node 2.
  *   If P1 could not move at Node 3 (i.e., the game ended after P2's move), P1 would simply compare **Out** (1) vs **In** $\to$ **Right** (2). P1 would play **In**, and P2 would play **Right**. Ex-Ante and Sequential rationality would coincide.
  *   The return of the game to P1 allows P1's *future* irrationality (from a sequential view) to sustain a *current* equilibrium that defies Backward Induction.

  ### What happens if you delete that feature?
  If you delete Node 3 (the game ends after P2's choice), the game becomes a simple two-stage game.
  *   P2's choice no longer depends on P1's future action.
  *   P1's ex-ante optimization reduces to choosing the best path given P2's response.
  *   Without a future node to be "irrational" at, Ex-Ante Rationality and Sequential Rationality become identical. The divergence disappears.

  ### The Pushback: Counterexample or Definition Shift?
  **The Pushback:** A proponent of the view that "CKR settles these games" will argue that your Scenario (a) relies on a defective definition of rationality for dynamic games.
  *   **Argument:** Rationality in an extensive-form game *must* imply sequential consistency. An agent who plans to play **Up** at Node 3 (getting 2) when **Down** (getting 5) is available is not rational, regardless of what they planned at Node 1. They would change their mind upon reaching Node 3.
  *   **Verdict:** This is a **definition shift**. Scenario (a) is not a counterexample to the theorem "CKR + Sequential Rationality $\implies$ BI." It is a demonstration that "CKR + Ex-Ante Rationality" is a weaker condition that fails to capture dynamic consistency.
  *   **My Take:** For a reading group on *rationality*, Definition (b) is the robust standard. Definition (a) describes agents who can bind themselves to future actions without a binding technology (magical commitment). However, epistemically, (a) is valuable for showing how belief hierarchies function when sequentiality is not assumed.

  ### Can the two readings come apart if no player is certain a node won't be reached?
  **Answer: No.**

  **Why:**
  If no player is certain a node won't be reached, then every decision node has a **positive probability** of being reached according to the players' beliefs.
  *   **Ex-Ante Optimization:** To maximize Expected Utility at the start, a player must maximize utility at every node that contributes to that expectation.
  *   **Mathematical Necessity:** If $P(\text{Node}) > 0$, then $E[U] = P(\text{Node}) \cdot E[U|\text{Node}] + \dots$. To maximize $E[U]$, one *must* maximize $E[U|\text{Node}]$.
  *   **Conclusion:** If all nodes are on the "path" (have positive probability), Ex-Ante Rationality *implies* Sequential Rationality. The divergence in Scenario (a) relies entirely on P1 believing Node 3 is reached *only if* they stick to the plan, but effectively treating the optimization at Node 3 as subordinate to the Node 1 choice. If P1 assigned positive probability to reaching Node 3 *independent* of their optimization there, they would be forced to play **Down**. The divergence requires off-path beliefs (probability 0 nodes) where ex-ante optimization does not constrain sequential choices.
