      *   *Grounding vs. Necessitation:* Need a specific moment where two things are necessarily connected but not grounded. Example: Being a bachelor and being unmarried. Or perhaps something more bureaucratic: *The permit is valid* vs. *The stamp is applied*. The stamp makes it valid, not vice versa, even if they always happen together.
