answer: |-
  The Department of Ontological Verification occupied the fourth through sixth floors of a building that smelled faintly of ozone and old paper. On the fourth floor, Junior Auditors like Elara checked the chains. On the fifth, Senior Auditors argued about the direction of the arrows. On the sixth, the Directors sat in silence, presumably touching the Bedrock.

  Elara's desk was cluttered with physical manifests. In the DOV, digital records were considered too slippery; if a fact wasn't printed on cardstock, it couldn't be grounded. She held a stamp in her right hand. It was heavy, made of lead, and engraved with the word *SETTLED*. To stamp a file was to declare that the fact at the top of the chain rested securely on the facts below it, all the way down to the Substrate.

  Her inbox held two files that had been circulating for three weeks. They were warm to the touch, which usually meant the metaphysics inside were unstable.

  File 8940 was the Infinite Descent. It concerned a zoning violation in the East District.
  *Fact A: The building is illegal.*
  *In virtue of Fact B: The permit was void.*
  *In virtue of Fact C: The signature was invalid.*
  *In virtue of Fact D: The signer lacked authority.*

  Elara had traced it down four hundred pages. Usually, a chain hit the Bedrock around page fifty. You'd reach something like *The Earth is solid* or *The Agent intended the action*. But this chain kept going. The authority lacked authority because of a prior regulation, which relied on a prior committee, which relied on a prior quorum. It was a perfect, unbroken ladder that simply didn't touch the floor.

  "It's a bookkeeping error," said Henderson, leaning over her cubicle wall. Henderson was a Senior Auditor who believed that metaphysics was just rigorous accounting. "You've confused a condition with a ground. Somewhere down there, the chain loops or terminates. You just missed it."

  "I've run the Vector Alignment test six times," Elara said, not looking up. "Every link explains the one above it. But there's no Foundation. It's turtles all the way down, sir."

  Henderson scoffed. "Turtles need ground to stand on. If there's no Bedrock, there's no support. If there's no support, the building isn't illegal. It's just... floating. And we don't certify floating facts. Mark it as 'Insufficient Grounding' and send it back."

  "If I do that, the zoning law collapses. The whole East District becomes ontologically ambiguous."

  "Then find the Bedrock," Henderson said, walking away. "It's there. You're just bad at digging."

  Elara rubbed her temples. The DOV had a strict rule: *Necessity is not Grounding.* Just because Fact X and Fact Y always happen together doesn't mean X grounds Y. They had a machine for this, the Differential Analyzer. You could feed it two correlated facts, and it would tell you if the connection was merely modal (they must happen together) or ontological (one makes the other exist).

  She turned to File 8941. This one was worse. It was the Circularity.
  *Fact A: The Mayor has executive power.*
  *In virtue of Fact B: The City Charter grants it.*
  *In virtue of Fact A: The Mayor enforces the Charter.*

  The Analyzer screamed when she ran it. The Vector didn't point down; it pointed in a circle. The Charter made the Mayor, but the Mayor's enforcement was what made the Charter active law rather than just paper. They were mutually constitutive.

  The DOV handbook was explicit: *Circular Grounding is Prohibited.* A fact cannot ground itself, directly or indirectly. If the chain loops, the top fact is ungrounded. One of the links had to be demoted to a mere effect, not a ground. But which one?

  Elara took her lunch break in the park across the street. She sat on a bench next to Kael, an auditor from the Causality Division. Kael was smoking a cigarette he wasn't technically allowed to have.

  "Henderson giving you hell?" Kael asked.

  "Standard procedure," Elara said, opening her container. "I've got a Tumbleweed and an Ouroboros."

  Kael whistled. "Infinite descent and circularity. The twin heresies. What's Henderson's take?"

  "He says I'm counting wrong. Says the Bedrock has to be there, I just can't see it."

  "And what do you think?"

  Elara picked at her salad. "I think the chain for the zoning violation is clean. Every link is true. Every 'in virtue of' holds. Why does it need to stop? Why can't the explanation just go on forever?"

  Kael exhaled smoke. "Because then nothing is actually explained. It's like a check that bounces because the bank it's drawn on is also funded by that check. Eventually, you need gold."

  "Maybe there is no gold," Elara said. "Maybe the value is just in the circulation."

  "That's Infinitism," Kael said, flicking ash. "Dangerous stuff. If you tell Henderson that, he'll write you up for ontological negligence. But... he's not wrong about the risk. If nothing is fundamental, nothing is fixed. The world becomes fluid."

  "And the other file? The Mayor?"

  "Coherentism," Kael said. "Everything holds everything else up. Like an arch. You can remove the keystone, and it falls, but the keystone only stays up because of the arch. It's elegant. But the DOV hates arches. They want pillars."

  "I have to break the circle," Elara said. "I have to say either the Mayor grounds the Charter, or the Charter grounds the Mayor. But the Vector test shows bidirectional flow. They're symmetric. If I pick one, I'm lying."

  "Then don't pick," Kael said.

  "I have to stamp. If I don't stamp, the city stops functioning on Monday. Contracts void. Arrests unlawful."

  Kael crushed the cigarette. "Here's the thing, Elara. You're looking for the ground out there." He pointed at the city skyline. "But the DOV isn't finding the ground. We're pouring it."

  Elara froze. "That's heresy. We verify. We don't create."

  "Think about the Necessity rule," Kael said. "Two facts track each other perfectly. The machine says no ground. But then we stamp one as the ground. And suddenly, it is. The stamp doesn't record the metaphysics. It assigns it."

  "That would mean the Bedrock is just... bureaucratic fiat."

  "Or," Kael stood up, "maybe the Bedrock is wherever we stop looking. Henderson thinks he's a geologist. He's actually a construction worker."

  Elara returned to her desk with a headache that felt like it was located behind her eyes, in the part of her brain that processed logic. The clock ticked toward 5:00 PM. If the files weren't stamped by close of business, the automated system would flag them as *Ontologically Void*. The East District would cease to be legally zoned. The Mayor's office would be legally powerless.

  Henderson stopped by her desk at 4:45 PM. "Status?"

  "Unresolved," Elara said.

  "Mark them Void."

  "If I do that, the East District loses its zoning. People live there. Businesses operate there."

  "Then they're operating on a lie," Henderson said. "Better to know the truth."

  "And the Mayor?"

  "Void the power. Let the Council rule until we sort it out."

  Elara looked at the stamp. It was heavy. She thought about Kael's words. *We're pouring it.* She thought about Henderson's certainty. *You're just bad at digging.*

  She looked at File 8940, the Infinite Descent. Henderson was right that an infinite chain couldn't support weight in a physical structure. But this wasn't physics. It was law. It was social fact. Did a reason need a first cause to be a good reason? If she kept tracing why she was sitting at the desk, she'd eventually hit her birth, her conception, the Big Bang. Did she need to touch the Big Bang to justify her lunch break?

  But if she stamped it *Settled*, she was validating an infinite regress. She was telling the universe that it was okay for things to hang without a hook.

  She looked at File 8941, the Circle. The Mayor and the Charter. They needed each other. To separate them was to kill the organism. But the rules demanded a hierarchy.

  Elara picked up the stamp. She didn't stamp *Settled*.

  She opened the drawer and took out a different stamp. It was rarely used. It was red, and it read *PROVISIONAL*.

  A Provisional stamp didn't claim Bedrock. It claimed *Functional Sufficiency*. It said: *This chain works well enough for now, do not inquire further.*

  Henderson saw the red ink. "You can't use Provisional on metaphysical faults. That's for clerical errors."

  "These aren't clerical," Elara said, her voice steady. "The chain for the zoning violation doesn't end. I'm certifying that the lack of an end doesn't impair the function. It's a suspended structure."

  "And the Mayor?"

  "I stamped the Charter as the ground," Elara lied. "I suppressed the feedback loop in the report."

  Henderson narrowed his eyes. "You falsified a Vector reading?"

  "I prioritized the static structure over the dynamic maintenance," Elara said, using the jargon as a shield. "The Charter is the document. The enforcement is the activity. Documents ground activities. That's the hierarchy."

  "It's not true," Henderson said softly. "The document is paper without the activity."

  "Then it's a necessary fiction," Elara said. "Like the Bedrock."

  Henderson stared at her. For a moment, the bureaucracy seemed to thin, and she saw the fear in his eyes. He needed the Bedrock. He needed to know that when he stamped *Settled*, he was touching something real. If she was right, if the Provisional stamp was the best they could do, then Henderson had been lying to himself for thirty years.

  "You're undermining the Department," Henderson said.

  "I'm keeping the city running," Elara replied. "The Infinite chain holds. The Circular chain turns. I'm just certifying the motion."

  Henderson took the files. He looked at the red ink. He could reject them. He could send them to the sixth floor. The Directors would investigate. They might find that Elara was right. Or they might fire her for insubordination. Or they might thank her.

  "If this collapses," Henderson said, "it's on your ledger."

  "I know."

  He walked away.

  Elara packed her bag. The office was emptying out. The hum of the servers seemed louder now, a low drone that vibrated in her teeth. She walked out into the evening air.

  The cost of the decision settled on her as she walked to the train station. It wasn't fear of punishment. It was the loss of the comfort she used to get from the work. Before today, she believed that if she looked hard enough, she could find the bottom. She believed that truth had a foundation.

  Now, she knew that the foundation was just the place where they stopped digging.

  She boarded the train and sat by the window. She looked at the reflection of her face in the glass.
  *Fact: Elara is tired.*
  *In virtue of: She worked all day.*
  *In virtue of: She has a job.*
  *In virtue of: The economy exists.*

  She traced the chain in her mind. She knew now that it might not end. She knew that if she asked *why* the economy existed, and *why* she had a job, she might fall forever.

  But she also knew that the train was moving. The wheels turned on the tracks. The tracks rested on the gravel. The gravel rested on the earth. Did the earth rest on anything?

  It didn't matter for the train. The train didn't need the Bedrock. It just needed the next inch of rail.

  Elara took out her notebook. She opened it to a fresh page. She wrote: *Case 8940: Status Provisional. Ground: Indefinite.*
  She wrote: *Case 8941: Status Provisional. Ground: Reciprocal.*

  She closed the book. She had broken the rules to save the system. She had admitted that the DOV didn't verify reality; it managed it.

  When she got home, her roommate asked, "How was work?"

  "Fine," Elara said.

  "Did you fix that zoning thing?"

  "Yes," Elara said. "It's settled."

  "Good," the roommate said, turning back to the TV. "I hate it when things are up in the air."

  Elara watched the TV. The news was on. The Mayor was speaking about new initiatives. The Charter was displayed on the screen behind him. They were holding each other up, a perfect loop of power and law, spinning in the void.

  Elara went to the kitchen and made tea. The water boiled because of the heat. The heat existed because of the element. The element worked because of the current.

  She held the mug. It was warm. It was solid. It didn't need to be fundamental to be real. It just needed to hold the tea.

  She took a sip. It tasted like iron and leaves. It was grounded in her mouth, for now. That would have to be enough. She went to bed, and for the first time in her life, she didn't dream of falling. She dreamt of floating, weightless and endless, and in the morning, she woke up and went back to work.
