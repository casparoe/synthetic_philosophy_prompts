      *(Self-Correction during drafting)*: Make sure the "Necessity/Sufficiency" rule isn't just mentioned but *used*. Elara should run a test where two facts correlate perfectly but the "Vector" points only one way.
      *(Self-Correction on Ending)*: The cost needs to be personal. Maybe she loses the ability to feel "settled" about anything in her own life.

  9.  **Final Polish:** Check the flow. Ensure the jargon sounds consistent. (e.g., "Ontological Debt," "Grounding Vector," "Substrate").

      *Let's write.*

