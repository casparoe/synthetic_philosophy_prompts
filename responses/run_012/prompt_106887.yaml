      *   *Thesis 6: The Load-Bearing Package (Systemic Interdependence).*
          *   Claim: The fence holds up other things. Removing it collapses the system.
          *   Status: Substantive.
          *   Grass: Maybe the grass strip is tied to drainage easements or pest control agreements.
          *   Support: Strong if linked rules exist.

      *   *Thesis 7: The Precedent (Slippery Slope).*
          *   Claim: Removing this invites removing other rules.
          *   Status: Substantive (Strategic).
          *   Grass: If we pave this, next year they pave the front yards.
          *   Support: Strong for status quo defenders.

      *   *Thesis 8: The Coordination Point (Focal Point).*
