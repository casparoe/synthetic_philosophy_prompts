      *   *Thesis 4: The Burden of Proof Shift.*
          *   Claim: Reformer must prove *no* harm, not just *some* benefit.
          *   Status: Substantive (Normative).
          *   Grass: Pavers must prove paving won't cause floods, not just that it looks nicer.
