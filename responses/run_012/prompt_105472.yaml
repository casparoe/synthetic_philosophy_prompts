answer: |-
  ### Specification of Desiderata for a Theory of Individual Rights

  **Purpose:** To guide the design of a bill of rights capable of surviving real-world preference profiles (including meddlesome, paternalistic, and conflicting preferences) while maintaining logical coherence and normative force.

  Below are the requirements any adequate theory must satisfy, categorized by substantive cases, conceptual distinctions, and formal constraints.

  ---

  ### I. Substantive Cases: The Theory Must Get These Right

  **1. The Meddlesome Prude (Protection of Personal Spheres)**
  *   **Case:** Person A wishes to read a controversial book. Person B intensely dislikes A reading it, though B suffers no material harm.
  *   **Requirement:** The theory must protect A's choice against B's preference, establishing a sphere of sovereignty where individual choice trumps aggregate sentiment.
  *   **Status:** **Non-negotiable.** (This is the definitional core of a *rights-based* theory versus pure majoritarianism.)

  **2. The Hazardous Bargain (Adjudication of Moral Externalities)**
  *   **Case:** A worker consents to a hazardous job for high wages (Pareto superior to unemployment for the parties involved). Third parties object on moral grounds and seek to forbid the contract.
  *   **Requirement:** The theory must provide a principled basis for distinguishing between valid consent (which binds third parties) and invalid consent (which invites intervention), without collapsing into either pure paternalism or pure libertarianism.
  *   **Status:** **Non-negotiable.** (A bill of rights for the real world must address the limits of alienability and the weight of third-party moral preferences.)

  **3. The Conflict of Rights (Trade-offs)**
  *   **Case:** Person A's exercise of a right (e.g., free speech) directly undermines Person B's exercise of a right (e.g., privacy or security).
  *   **Requirement:** The theory must provide a metric or procedure for adjudicating conflicts between rights without simply reverting to aggregate welfare maximization.
  *   **Status:** **Non-negotiable.** (Rights are not absolute in practice; the theory must explain their boundaries.)

  ---

  ### II. Conceptual Distinctions: The Theory Must Not Collapse These

  **4. Right vs. Decisiveness**
  *   **Consideration:** Having a right to do X does not necessarily mean society must rank X above not-X in all contexts (e.g., if exercising the right violates another's right).
  *   **Requirement:** The theory must distinguish between holding a right (a protected status) and that right being decisive over the social outcome in every instance.
  *   **Status:** **Non-negotiable.** (Collapsing these leads to logical cycles; see *Gibbard's Paradox*.)

  **5. Holder-Protection vs. Third-Party Protection**
  *   **Consideration:** Some rights protect the agent's liberty (immunity from interference); others protect third parties via claims on the agent (duties not to harm).
  *   **Requirement:** The theory must structurally differentiate liberty-rights (privileges) from claim-rights (entitlements).
  *   **Status:** **Non-negotiable.** (Essential for distinguishing self-regarding from other-regarding acts.)

  **6. Waivable vs. Inalienable Rights**
  *   **Consideration:** Property rights can be sold; voting rights or freedom from slavery generally cannot.
  *   **Requirement:** The theory must specify which rights are alienable (subject to exchange/waiver) and which are inalienable, based on criteria other than mere preference intensity.
  *   **Status:** **Preference of Liberal/Republican Camp.** (Strict libertarians may argue all rights are waivable; paternalists argue many are not. The theory must *take a stance*, but the specific stance is camp-dependent.)

  ---

  ### III. Formal Constraints: The Theory Must Not Contradict These

  **7. Social Ordering (Collective Rationality)**
  *   **Consideration:** A bill of rights must yield a decision. Society cannot prefer A to B, B to C, and C to A simultaneously.
  *   **Requirement:** The aggregation of rights and preferences must produce a transitive and complete social ordering.
  *   **Status:** **Non-negotiable.** (Without this, the constitution is dysfunctional.)

  **8. Weak Pareto (Efficiency)**
  *   **Consideration:** If every individual prefers state X to state Y, the social ordering should reflect X over Y.
  *   **Requirement:** The theory must respect unanimous preference improvements.
  *   **Status:** **Preference of Welfarist Camp.** (Deontological rights theorists often reject this when Pareto improvements violate rights, e.g., a unanimous vote to enslave a minority.)

  **9. Unrestricted Domain (Robustness)**
  *   **Consideration:** Preferences in the real world include meddlesome, irrational, and malevolent profiles.
  *   **Requirement:** The theory must function across all logically possible preference profiles, not just "tidy" or "liberal" ones.
  *   **Status:** **Non-negotiable.** (Per your stated purpose: the bill of rights must survive *real* preference profiles.)

  ---

  ### The Impossibility Result

  **The Conflict:**
  There is a subset of these requirements that **cannot be jointly satisfied**. Specifically, the combination of:
  1.  **Unrestricted Domain** (Requirement 9)
  2.  **Weak Pareto** (Requirement 8)
  3.  **Protection of Personal Spheres** (Requirement 1, interpreted as Minimal Liberty)
  4.  **Social Ordering** (Requirement 7)

  This is **Sen's Liberal Paradox**. It is not a flaw in a specific theory; it is a logical property of this specification. If you demand that the system work for *any* preference profile (including meddlesome ones), respect *any* unanimous agreement (Pareto), and guarantee *any* individual decisiveness over a personal sphere (Liberty), the system will generate logical cycles (violating Social Ordering).

  **The Exclusionary Requirement:**
  **Unrestricted Domain (Requirement 9)** does the most to exclude candidate theories. Most successful theories of rights escape Sen's Paradox by restricting the domain of admissible preferences (e.g., by ruling "meddlesome preferences" as inadmissible for social calculation). By insisting the theory survive *real* profiles, you force the theory to handle the poison that breaks the logic.

  **The Genuine Desideratum:**
  **Social Ordering (Requirement 7)** is the most genuine desideratum. While Pareto and Domain are contestable normative or empirical claims, a constitution that produces intransitive cycles is functionally useless. It cannot guide action. Therefore, if a conflict arises, Social Ordering is the constraint that *must* hold, implying that either Domain or Pareto (or the definition of Liberty) must yield.

  ---

  ### Scorecard: Candidate Theories Against the Specification

  | Theory | Performance | Precise Point of Failure |
  | :--- | :--- | :--- |
  | **Minimal Liberalism** (Sen) | **Fails** | **Social Ordering.** By accepting Unrestricted Domain, Weak Pareto, and Minimal Liberty as axioms, it mathematically guarantees intransitive social preferences (cycles) in specific cases (e.g., the Prude). It describes the problem rather than solving it. |
  | **Rights-as-Side-Constraints** (Nozick) | **Fails** | **Weak Pareto.** To maintain rights as absolute trumps, this theory must reject Pareto improvements that violate constraints (e.g., it forbids a unanimous vote to punish an innocent, even if everyone prefers it). It also often implicitly restricts **Domain** by treating meddlesome preferences as morally weightless, which risks violating your "real profiles" constraint. |
  | **Straightforward Welfare Aggregation** (Utilitarianism) | **Fails** | **Protection of Personal Spheres.** It satisfies Ordering, Pareto, and Domain easily. However, it fails the **Meddlesome Prude** case. If B's misery at A's reading outweighs A's joy, Utilitarianism forbids A from reading. It collapses rights into interests, violating the core purpose of the specification. |

  **Conclusion:**
  Your specification demands a theory that is logically impossible in its strictest form (Sen's Paradox). To proceed, you must relax one Non-negotiable constraint. Given the purpose (designing a working bill of rights), **Social Ordering** must be preserved. This forces you to either:
  1.  Restrict **Unrestricted Domain** (declare some preferences illegitimate); or
  2.  Qualify **Weak Pareto** (allow rights to block unanimous welfare gains); or
  3.  Refine **Liberty** (rights are not decisive over outcomes, but trigger procedural protections).

  Most viable constitutional theories choose option 1 or 3.
