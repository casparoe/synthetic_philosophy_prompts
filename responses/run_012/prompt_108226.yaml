answer: |-
  **Seminar Exercise: Spinoza and the Revision Chamber**

  **1. The Criteria of Power and Freedom**
  To assess the Revision Chamber, you must abandon the question of whether it is "just" in a normative sense. For Spinoza, natural right is coextensive with natural power (*Tractatus Politicus* II, 4). An institution possesses right only insofar as it effectively exists and endures. Therefore, the Chamber is legitimate only if it increases the *potentia* (power) of the multitude to persevere in being, rather than merely redistributing *obedientia* (obedience).

  The Chamber's specific mandate—reviewing statutes on speech and assembly—targets the primary source of state dissolution: resentment. In the *Theological-Political Treatise* (Ch. 20), Spinoza argues that attempting to control judgment creates martyrs, not subjects, diminishing the sovereign's actual power. For Spinoza to endorse the Chamber, it must be shown that this design mechanically reduces the *affects* of fear and indignation that lead to sedition. The Chamber must function as a rational buffer against the sovereign's passions. If the Chamber prevents the enactment of laws that the multitude cannot obey without resentment, it increases the state's total power. Conversely, if the Chamber becomes a locus of superstition—legislating based on fear rather than reason (*TTP*, Preface)—it diminishes the *imperium*. The verdict depends not on the design's elegance, but on whether it successfully aligns the sovereign's commands with the actual capacities and rational interests of the subjects.

  **2. The Verdict and Its Conditions**
  Spinoza would likely offer a cautious, conditional endorsement. The strongest reason for approval is that the Chamber institutionalizes the *libertas philosophandi* (freedom of philosophizing) as a structural constraint on the sovereign. By making the overturning of the Chamber's decisions procedurally difficult (double supermajority), the design stabilizes the conditions under which reason can flourish, preventing the sovereign from acting on transient panic. This aligns with Spinoza's claim that a state is most powerful when its citizens are guided by reason rather than fear (*TP* V, 6).

  However, the verdict flips if the empirical composition of the Chamber fails to meet a specific threshold of rationality. Spinoza holds that the multitude is often guided by imagination and superstition (*TTP* Ch. 17). If the 300 citizens, chosen by lot, are dominated by fear, the Chamber will not protect freedom but codify superstition under the guise of review. The design assumes sequestration isolates members from corrupting interests; Spinoza would worry it isolates them from the *conatus* of the whole. For the verdict to remain positive, it must be empirically demonstrated that ordinary citizens, when relieved of immediate economic pressure, deliberate more rationally than elected officials. If the lot selects for passion rather than reason, the Chamber becomes a "state within a state," a faction that weakens the sovereign's unity.

  **3. Underdetermined Points in the Text**
  Two critical aspects of this design are underdetermined by Spinoza's surviving texts. First, the use of **sortition** (selection by lot). In the *Political Treatise*, Spinoza favors election for aristocracies, linking voting rights to wealth and stake-holding to ensure investors in the state's stability (*TP* VIII, 4). He calls democracy "most natural," but the text breaks before detailing its mechanics. We cannot know if he viewed sortition as a mechanism to equalize power (increasing the multitude's *potentia*) or as a reckless surrender of governance to the unqualified. The missing chapters on democracy in the *TP* would settle whether he believed political capacity was universal or required specific social positioning.

  Second, the **secret ballot**. Spinoza emphasizes public concord and the outward uniformity of piety and obedience (*TTP* Ch. 19). While inner belief is free, outward expression is subject to the sovereign. Secret voting protects the individual from coercion, but it also hides the voter's *affects* from the public eye. A textual resolution would require clarification on whether Spinoza viewed political participation as an exercise of private right or a public performance of collective power. If the latter, secrecy undermines the transparency required for the multitude to act as a unified body.

  **4. The Loyalist Objection**
  A rigorous Spinoza loyalist would object that the Revision Chamber fundamentally misconstrues the nature of political power. By sequestering 300 individuals and granting them final authority, the design fragments the *multitudo*. For Spinoza, the sovereign's right *is* the power of the multitude acting in concert (*TP* III, 2). Isolating members from parties and lobbying does not purify them; it atomizes them, stripping them of the collective power that gives their decisions force. A decision made by 300 isolated individuals lacks the *potentia* of a decision made by a public, contentious assembly where powers are combined and tested.

  Furthermore, the design specifies selection from the "adult population." Spinoza explicitly excludes women from political authority, arguing they are naturally unequal to men in power and right (*TP* XI, 4). While modern readers reject this, a loyalist reconstruction must account for why Spinoza believed certain exclusions were necessary for state stability. If the Chamber includes women, it violates Spinoza's specific anthropology; if it excludes them, it artificially reduces the state's total power by ignoring the *conatus* of half the population. Either way, the Chamber risks creating a fiction of unity that masks a real diminution of the state's actual capacity to act.
