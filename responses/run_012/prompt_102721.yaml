          *   **Style:** Argumentative essay, concise on standard examples, focus on the philosophical criteria and the PP critique. No reading list.

  2.  **Deconstruct Part (a): The Criteria for Cognitive Penetration:**
      *   *The Problem:* How do we distinguish seeing differently from thinking differently about what you see?
      *   *The "Firewall" Test:* We need to isolate early vision from post-perceptual cognition.
      *   *Candidate Confounds:*
          *   *Attention:* Did I look *at* it differently, or did the look itself change? (Eye movements vs. processing).
          *   *Judgment/Classification:* Do I *call* it red because I expect it, or does it *look* red?
          *   *Response Bias:* Am I just more willing to say "I see X"?
      *   *The Golden Criterion:* **Phenomenal Character + Informational Encapsulation.**
          *   *Phenomenal:* The "what it's like" must change. A red apple looks different to a wine expert than a novice *phenomenally*, not just conceptually.
          *   *Encapsulation:* The change must happen *without* mediating inference. If I think "it's red," then infer "it looks red," that's not penetration. If the belief directly alters the visual processing stream *before* conceptualization, that's penetration.
          *   *The "Diaphanousness" Test:* If I close my eyes and think about the object, does it change? No. If I open them and the belief changes the *sensory signal* itself (e.g., contrast sensitivity, hue discrimination) independent of where I look, that's the bar.
      *   *Key Distinction:* *Semantically* coherent effects (belief matches perception) aren't enough. We need to rule out *post-perceptual* rationalization.

  3.  **Deconstruct Part (b): The Predictive Processing (PP) Challenge:**
      *   *The Friend's Claim:* PP says the brain is a prediction machine. Top-down priors constitute perception. Therefore, cognition *always* penetrates. The debate is dead.
      *   *Counter-Analysis:* Does PP actually erase the distinction between "cognition" and "perception"?
      *   *Hierarchy:* PP is hierarchical. Low-level prediction errors (edges, motion) vs. High-level priors (objects, semantics, beliefs).
      *   *The Relabeling Risk:* Just calling everything "prediction" doesn't mean *beliefs* (propositional attitudes) drive *early vision* (retinal processing).
      *   *The Real Question under PP:* At what level of the hierarchy do "cognitive" states (beliefs/desires) enter? Do they set the priors for V1 (early vision), or do they only operate at the level of object recognition?
      *   *Verdict on PP:* It reframes the mechanism but doesn't dissolve the philosophical boundary. We still need to know if *semantic* beliefs penetrate *sensory* priors. PP makes top-down flow normal, but it doesn't guarantee *cognitive* top-down flow reaches the *sensory* bottom.

  4.  **Deconstruct Part (c): The Verdict:**
