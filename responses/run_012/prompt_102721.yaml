answer: |-
  The debate over cognitive penetrability of perception (CPP) has stalled because both sides talk past each other regarding what counts as "perception." The traditional encapsulationists (following Fodor) argue that early vision is a modular firewall, immune to beliefs. The penetrationists argue that what we see is theory-laden. Now, your friend introduces a third option: Predictive Processing (PP) renders the debate obsolete by claiming perception *is* top-down prediction, so penetration is the default state.

  This is a seductive argument, but it is wrong. It conflates a mechanistic description of neural flow with a philosophical distinction about mental states. To settle this, we must first establish a rigorous criterion for what counts as penetration, then test whether PP dissolves that criterion or merely refines it.

  ### I. The Criterion: What Would Count as Penetration?

  The core difficulty in the CPP debate is not finding correlations between belief and experience; it is ruling out confounds. To claim that a belief *penetrates* perception, one must demonstrate that the belief alters the **phenomenal character** of the experience directly, rather than altering how one attends to, judges, or reports that experience.

  Most alleged examples fail because they confuse *seeing* with *seeing as*. If I believe a fruit is a banana, and I see a blue banana, I might judge it to be gray due to color constancy mechanisms. This looks like penetration, but it could just be low-level visual processing correcting for illumination. To prove cognitive penetration, the effect must meet four conditions:

  1.  **Phenomenal Change:** The "what it is like" to have the experience must differ. It is not enough that I *classify* the stimulus differently; the sensory quality itself (e.g., the specific hue, contrast, or spatial resolution) must shift.
  2.  **Semantic Coherence:** The change in perception must track the *content* of the belief, not just general arousal or attention. If I believe a snake is present, my visual acuity might sharpen. That is attention/arousal, not penetration. Penetration requires that I see the stick *as snake-shaped* because I believe it is a snake, not just that I see *sharper*.
  3.  **Immediacy (No Inference):** The belief must not operate as a premise in a conscious or unconscious inference that happens *after* perception. If I see a shape, infer "that is a snake," and then feel fear, that is post-perceptual. Penetration requires the belief to modulate the sensory processing *before* the percept is finalized.
  4.  **Exclusion of Attention:** The effect cannot be explained by a shift in spatial or feature-based attention. If I look *at* the object differently because of my belief, that is attentional modulation, which encapsulationists concede. Penetration requires that, holding attention constant, the processing of the signal changes.

  This bar is incredibly high. Most experiments (e.g., Bruner's value-on-coins, or Hansen's color-memory effects) measure response bias or memory reconstruction, not online sensory content. They show that cognition changes what we *do* with perception, not perception itself. To prove penetration, one would need to show that holding two different beliefs about the *same* stimulus, while fixating identically, results in two distinct raw sensory signals.

  ### II. The Predictive Processing Move: Dissolution or Relabeling?

  Your friend's argument relies on the Predictive Processing framework, which posits that the brain is a hierarchical prediction machine. It constantly generates top-down models of the world and updates them based on bottom-up prediction errors. Since "top-down" flows are constitutive of perception in this model, your friend argues that cognition (which resides at the top) necessarily penetrates perception (which resides at the bottom).

  This argument fails because it conflates **sub-personal priors** with **personal-level beliefs**.

  In PP, "top-down" signals are indeed ubiquitous. However, these signals are largely sub-personal statistical weights (priors) learned over evolutionary or developmental time. They are expectations about edges, motion, and object permanence. A "belief," in the context of the CPP debate, is a propositional attitude (e.g., "I believe this coin is valuable" or "I believe that man is angry").

  PP does not claim that *every* top-down signal is a cognitive belief. It distinguishes between levels of the hierarchy. Low-level priors (V1/V2 cortex) handle contours and contrast. High-level priors (prefrontal/temporal) handle semantics and concepts. The question of cognitive penetration is not "Does top-down information flow exist?" (PP says yes). The question is "Do *semantic/cognitive* states at the top of the hierarchy directly rewrite the *sensory* priors at the bottom?"

  PP actually gives us a better vocabulary to say **no**. It allows us to locate exactly where the "firewall" sits. It is entirely consistent with PP to argue that cognitive beliefs set priors for object recognition (level 5) but do not penetrate early sensory processing (level 1). If my belief that "snakes are dangerous" alters my amygdala activity and sharpens my attention, that is an attentional loop, not a perceptual rewrite. If it actually changes the tuning of my V1 neurons to detect curves more readily *independent of attention*, that would be penetration. PP describes the architecture, but it does not mandate that high-level beliefs bypass intermediate layers to tweak low-level sensors.

  Therefore, the friend is wrong that PP dissolves the problem. It relabels "perception" as "prediction," but the boundary between *cognitive prediction* (belief-based) and *perceptual prediction* (statistical regularity) remains. The debate shifts from "Is there top-down flow?" to "At what hierarchical depth do propositional attitudes enter the stream?"

  ### III. The Verdict: Encapsulation Holds (With a PP Mechanism)

  I take the side of **Moderate Encapsulation**. The friend is incorrect that the debate is obsolete; in fact, PP strengthens the case for encapsulation by clarifying the mechanism of the firewall.

  Here is the defense:

  **1. The Epistemic Argument:**
  If cognition penetrated perception directly, we would lose the ability to test our beliefs against the world. Perception serves as the check on cognition. If my belief that "the room is spinning" could literally make the room look like it is spinning (independent of vestibular input), I would be trapped in a circular loop of self-confirming delusions. For perception to act as an objective arbiter of truth, it must remain sufficiently independent of the very beliefs it is meant to evaluate. PP preserves this by treating prediction errors as the "reality check." If cognition penetrated perception too deeply, it would suppress prediction errors, leading to hallucination, not veridical sight. The system is designed to *minimize* the impact of high-level priors when low-level error signals are strong.

  **2. The Hierarchy Argument:**
  PP suggests that high-level beliefs are "slow" and "abstract," while early vision is "fast" and "concrete." For a belief to penetrate early vision, it would need to be translated into a format V1 can understand (e.g., specific orientation weights). There is no evidence that propositional content ("This is a $500 bill") can be directly translated into early visual tuning without passing through object recognition systems first. The "penetration" observed in experiments is almost always explicable as **perceptual learning** (long-term adjustment of priors) or **attention** (weighting of error signals), neither of which counts as online cognitive penetration.

  **3. The Criterion Failure:**
  Returning to the criteria in section (a): No experiment has conclusively shown that holding a belief changes the *phenomenal character* of early vision without mediating attention or judgment. Even in PP terms, the "prediction" that alters sensory processing is usually a *perceptual* expectation (e.g., "I expect a face here"), not a *cognitive* belief (e.g., "I believe faces are important"). The former is a sub-personal prior; the latter is a personal state. The friend's claim collapses this distinction.

  **Conclusion:**
  The debate is not obsolete. Predictive Processing provides the machinery for how perception works, but it does not erase the philosophical boundary between cognition and perception. The friend's claim that "perception is prediction, therefore cognition penetrates" is a category error. It mistakes the existence of top-down *mechanisms* for the penetration of top-down *contents*.

  The verdict is that perception is **functionally encapsulated** from cognitive beliefs, even if it is **mechanistically predictive**. Beliefs can direct attention, and they can shape long-term perceptual learning, but they do not reach down and rewrite the raw sensory signal in the moment. To argue otherwise is to confuse the map (our beliefs) with the territory (the sensory signal). We need that distinction to remain intact, or we lose the only tool we have for correcting our mistakes.
