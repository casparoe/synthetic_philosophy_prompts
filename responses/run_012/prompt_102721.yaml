      *   *Option 2: Encapsulation Holds.* (Safer, aligns with modularity).
      *   *Option 3: PP Dissolves it.* (Too easy, ignores the hierarchy).
      *   *My Stance:* The friend is wrong. PP does not dissolve the debate; it sharpens it. However, the *Encapsulation* camp is mostly right regarding *strict* cognitive penetration (beliefs affecting early sensory content), but wrong about the rigidity of the system.
      *   *Refined Stance:* I will argue for **Moderate Encapsulation**. PP explains *why* top-down flow exists, but it preserves the distinction between *perceptual priors* (learned statistical regularities) and *cognitive beliefs* (propositional attitudes). Most "penetration" cases are actually perceptual learning or attention, not direct cognitive alteration of sensory content. The friend's claim that "perception is prediction so cognition penetrates" conflates *sub-personal priors* with *personal-level beliefs*.
      *   *Wait, I need to pick a side on the "Obsolete" claim.*
      *   *Decision:* I will argue that the friend is **wrong**. The debate is not obsolete. PP changes the *mechanism* but not the *philosophical distinction*. The core question (do beliefs change sensory content?) remains vital because PP distinguishes between levels of processing.
      *   *Decision on Penetration:* I will argue that **strong cognitive penetration is rare/non-existent**, but **perceptual learning** is real. The friend's PP argument fails because it conflates *expectations* (sub-personal statistical priors) with *beliefs* (personal-level cognitive states).

  5.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. The old debate (Fodor vs. Churchland). The new twist (PP). Thesis: The friend is wrong; PP refines the debate but doesn't kill it. Encapsulation largely holds for *cognitive* states, even if *perceptual* priors exist.
      *   **Section 1: The Criterion (The "Hard Bar"):** Define what counts. It's not just "belief matches perception." It must be:
          1.  *Phenomenal:* Changes the "what it's like."
          2.  *Direct:* No inferential mediation.
          3.  *Non-Attentional:* Not just looking harder/differently.
