  8.  *(Final thought before writing)*: The strongest argument against the friend is that PP is a *functional* architecture, while Cognitive Penetration is a *philosophical* claim about the boundary of the mind. PP explains *how* information flows, but not *what kind* of information counts as "cognitive" vs "perceptual." I need to hammer that distinction.

