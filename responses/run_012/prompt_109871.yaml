prompt: |-
  I'm a junior at Northgate High, and next Thursday my philosophy club is doing a 'Kant vs. the Utilitarians' debate night. I got assigned to defend the position that Kant was right that you shouldn't lie to the murderer at the door, even if your best friend is hiding upstairs. I know that sounds insane, so I'm definately not a Kant expert, but I'm running a slightly weird version of it: the murderer's question isn't a real request for information, it's a threat, and a threat isn't the kind of conversation where the duty of truthfulness even applies. So you don't owe him the truth. But I still think you shouldn't lie, because lying makes you someone who treats speech as a weapon, and that's a betrayal of humanity in yourself. My move is that you can refuse to answer, or give a true but misleading answer, and that's not a lie. I also read somewhere that Kant says if you lie and your friend still ends up dead, you're responsible, which sounds like he's sneaking in consequences, so I'm not sure what to do with that. And I saw a comment that Kant's 'right to truth' isn't a right to every true fact, it's just a right not to be deceived by someone who owes you sincerity—so the murderer doesn't have it.

  The audience is mostly kids from my grade who've watched a ton of YouTube ethics videos and think utilitarianism is obviously true—they'll say one lie is worth a life, end of story. My club advisor Mr. Alvarez is a Catholic and really into natural law; he'll say the duty not to lie isn't absolute when it conflicts with protecting innocent life, and he'll bring up double effect and mental reservation. My friend Dana is a virtue ethics person and thinks rules are for robots; she'll say a truthful person with practical wisdom would lie to the murderer and not become a liar. Marcus, who actually read some Kant, will say I'm just repeating Kant and that Kant already said you can refuse to answer, so what's new? And a couple of seniors who do debate will try to trap me with 'what if it's Nazi Germany and you're hiding a Jewish family in your attic?'

  Give me the prep sheet: the eight or so objections I'll actually get from this crowd, ranked by how much damage they'd do, phrased the way each person would put it, with a two-minute reply for each and a note on where the reply is soft. Tell me what I should concede up front so I don't look like a robot, and what I absolutely have to hold. And include the one question I'm praying nobody asks. Don't give me a reading list or citations, just the prep sheet. I'm presenting for like fifteen minutes and then it's all Q&A, so I need to know what's coming.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User and Request:**
      *   **User:** Junior at Northgate High, Philosophy Club member.
      *   **Task:** Defend Kant's position (don't lie to the murderer at the door) in a debate next Thursday.
      *   **Specific Twist:** The user is running a "slightly weird version": The murderer's question is a threat, not a request for info (no duty of truthfulness owed), *but* lying still corrupts the self/treats speech as a weapon. Refusal or misleading truth is okay, lying is not.
      *   **Audience/Opponents:**
          *   General Audience: Utilitarian-leaning teens (YouTube ethics fans), think "1 lie = 1 life."
          *   Mr. Alvarez (Advisor): Catholic/Natural Law, supports Double Effect/Mental Reservation, thinks duty isn't absolute vs. innocent life.
          *   Dana (Friend): Virtue Ethicist, thinks rules are rigid, practical wisdom allows lying.
          *   Marcus (Kant Reader): Knows the text, will challenge originality/accuracy (Kant already said you can refuse).
          *   Debate Seniors: Will use extreme cases (Nazi Germany).
      *   **Format:** Prep sheet. ~8 objections ranked by damage. Phrased as the opponent would say it. 2-minute reply for each. Note on soft spots. What to concede/hold. The "Prayer Question" (what to avoid).
      *   **Constraints:** No reading list/citations. Just the prep sheet.

  2.  **Deconstruct the User's Position:**
      *   *Core Claim:* Don't lie to the murderer.
      *   *Reasoning 1:* Murderer's question is a threat/coercion, not a valid claim to truth (Right to Truth argument).
      *   *Reasoning 2:* Lying corrupts the agent (treats speech as a weapon, betrayal of humanity in oneself).
      *   *Loophole:* Refusal to answer or misleading truth is permissible.
      *   *Weakness:* The "Responsibility for Consequences" argument (if you lie and friend dies anyway, you are responsible). The user is unsure how to handle this.

  3.  **Brainstorm Objections (based on the specific opponents):**
      1.  *Utilitarian Teens:* One life > one lie. Why let your friend die for a principle?
      2.  *Debate Seniors:* Nazi Germany scenario. Hiding Jews. Is lying wrong then?
      3.  *Marcus:* Kant already said you can remain silent. What's your actual contribution? Is your "misleading truth" just a lie by another name?
      4.  *Mr. Alvarez:* Natural Law/Double Effect. Protecting life is a higher duty. Mental reservation is okay, why not a direct lie?
      5.  *Dana:* Virtue Ethics. A virtuous person lies here. Rules make you rigid/robotic.
      6.  *General Logic:* If the murderer has no right to truth, why is lying still bad for *you*? (Internal consistency).
      7.  *Consequences:* If you tell the truth and friend dies, aren't *you* responsible then? (The "Inkblot" argument).
      8.  *Definition:* Is a "misleading truth" actually just a lie in intent?

  4.  **Rank Objections by Damage:**
      *   *High Damage:* The Nazi scenario (emotional weight), The "One Life" Utilitarian argument (audience consensus), The "Responsibility" argument (undermines Kant's own logic).
      *   *Medium Damage:* Marcus's textual challenge (makes you look unprepared), Dana's Virtue challenge (makes you look robotic), Alvarez's Natural Law (authority figure).
      *   *Lower Damage:* Definitional quibbles (can be parsed quickly).

      *Refining the Rank:*
      1.  **The Nazi/Hiding Jews Scenario:** Emotional knockout. Hardest to defend without sounding monstrous.
      2.  **The Utilitarian "One Life" Calculus:** The audience's baseline. If you lose this, you lose the room.
      3.  **The "Responsibility for Consequences" Trap:** Kant's own weak point. If you lie and they die, you're guilty. If you tell truth and they die, you're innocent. This sounds sociopathic.
      4.  **Marcus's "Nothing New" Challenge:** Undermines your credibility as a philosopher.
      5.  **Dana's Virtue/Robot Challenge:** Attacks your character/motivation.
      6.  **Mr. Alvarez's Higher Duty:** Attacks the hierarchy of duties.
      7.  **The "Misleading Truth" is just a Lie:** Semantic trap.
      8.  **Why care about self-corruption if the murderer has no rights?:** Internal logic check.

  5.  **Drafting the Replies (Iterative Process):**
      *   *Constraint:* 2-minute reply spoken pace (approx. 250-300 words).
      *   *Tone:* High school debate but philosophical depth. Respectful but firm.
      *   *Strategy:* Use the user's specific "Weird Kant" angle (Speech as weapon vs. Threat).

      *(Self-Correction during drafting)*: I need to make sure I don't just give standard Kant defenses. The user has a specific nuance: "Murderer's question is a threat" + "Lying corrupts self." I need to weave that into the answers.
      *   *Nazi Scenario:* Don't back down, but reframe. It's not about the Jew, it's about the agent's integrity vs. the tyrant's illegitimacy. Actually, the user's "Threat" argument works well here. The Nazi has no standing.
      *   *Utilitarian:* Focus on the "slippery slope" of making truth conditional.
      *   *Responsibility:* This is the hardest. Kant says if you tell truth, the murderer owns the consequence. If you lie, you own the consequence. I need to explain *why* (causality vs. moral agency).
      *   *Marcus:* Acknowledge Kant said silence is okay, but emphasize the *why* (corruption of speech).

  6.  **Identifying Concessions vs. Holds:**
      *   *Concede:* It feels terrible. It's a tragic situation. Silence is better than truth-telling if truth kills.
      *   *Hold:* Lying is never the solution. The integrity of speech is foundational.

  7.  **The "Prayer Question":**
      *   What breaks this specific argument?
      *   The user says: "Murderer's question is a threat... duty of truthfulness doesn't apply." BUT "You still shouldn't lie... betrayal of humanity in yourself."
      *   *The Trap:* "If the duty of truthfulness doesn't apply to him because he's a threat, on what grounds do you forbid yourself from lying? If he has no right to truth, your lie violates no right. So why is it a 'betrayal of humanity'?"
      *   *Why it's deadly:* It exposes a tension between the "External Right" argument and the "Internal Duty" argument. If he has no claim, why does the act remain morally toxic *specifically regarding truth*?

  8.  **Final Review against Constraints:**
