          2.  (1) vs (2) [Ideal vs. Real] - **Manageable.**
          3.  (2) vs (5) [Procedural] - **Non-issue.**
      *   **Taking a Side:**
          *   Advise dropping the "Only" in (1).
          *   Why? Because (2) (Innocence) is the strongest moral constraint. (3) (LWOP) is necessary for social stability. (1) is the theoretical preference.
          *   Modifying (1) saves the whole structure without sacrificing the core intuition that heinous crimes demand extreme punishment.
