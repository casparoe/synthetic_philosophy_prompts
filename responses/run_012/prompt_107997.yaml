answer: |-
  The line your professor quoted is a paraphrase of the central thesis in Milton Friedman's 1953 essay, *"The Methodology of Positive Economics."* It is the canonical statement of **instrumentalism** in economics.

  However, as you suspect, the slogan is often wielded as a rhetorical shield that conflates several distinct methodological claims. To understand whether the professor was justified in dismissing the student, we must disentangle these claims. Below are four distinct readings of the line, graded from trivial to incoherent, followed by an analysis of what is usually intended and whether the line actually addresses the student's specific objection.

  ### 1. The Empirical Pragmatist Reading (The Trivial Truth)
  **The Claim:** A model should be judged solely by its empirical track record. If a model consistently predicts data better than its rivals, we should use it, regardless of how "silly" the assumptions look.
  **Plausibility:** High. This is a standard scientific heuristic. If a map gets you to the destination, you use it, even if the map depicts the earth as flat.
  **Does it license the dismissal?** **No.**
  This reading only justifies the professor if the model *has already demonstrated* accurate predictions regarding tax effects. In the seminar scenario, the student is questioning the *derivation* of the conclusion, likely before empirical testing has occurred. To say "predictions are all that matter" is empty if you have not yet checked the predictions. Using this line to bypass the student's theoretical objection is premature; it assumes the model works before proving it does.

  ### 2. The 'As-If' Instrumentalist Reading (The Substantive Defense)
  **The Claim:** Economic agents do not need to *actually* possess the traits in the assumptions (infinite life, perfect foresight); they only need to behave *as if* they do. For example, households might act *as if* they live forever because they care about their children (intergenerational altruism), or *as if* they know the future because they use all available information efficiently (rational expectations).
  **Plausibility:** Moderate to High. This is Friedman's actual argument. It is defensible in many contexts (e.g., firms act *as if* they maximize profit even if they don't solve calculus problems).
  **Does it license the dismissal?** **Weakly.**
  This reading addresses the "unrealistic assumptions" charge by reinterpreting them. However, it does not fully dismiss the student. The student argued that the assumptions *generate* the conclusion. If the "as-if" justification is weak (e.g., it is hard to argue households behave *as if* they have perfect foresight of tax policy 50 years out), the model's predictions may fail in new environments. The professor can only use this line if he is prepared to argue that the "as-if" mapping is robust, which requires engaging with the student's point, not dismissing it.

  ### 3. The Tractability Apologist Reading (The Necessary Fiction)
  **The Claim:** We know the assumptions are false, but they are mathematically necessary to solve the model. Without assuming infinite horizons and certainty, the equations become unsolvable. Therefore, we accept the falsity to get *any* result.
  **Plausibility:** High (descriptively), Low (normatively). This is often the *real* reason economists make these assumptions.
  **Does it license the dismissal?** **No.**
  This reading admits the student is right: the assumptions *are* driving the conclusion. It essentially says, "We know this is a limitation, but we have no choice." This is an admission of vulnerability, not a defense. If the assumptions are merely computational crutches, the professor cannot claim the conclusions are reliable for policy without further proof that relaxing the assumptions wouldn't change the result (i.e., robustness checks). Dismissing the student here is intellectually dishonest.

  ### 4. The Logical Nihilist Reading (The False/Incoherent Claim)
  **The Claim:** There is no logical connection between the realism of assumptions and the accuracy of predictions. Assumptions are completely decoupled from outcomes.
  **Plausibility:** False.
  **Does it license the dismissal?** **No.**
  This is logically incoherent. In a deductive model, the conclusions follow *from* the assumptions. If the assumptions are changed, the conclusions *must* change (unless the result is trivial). To claim assumptions are "irrelevant" is to deny the logic of modelling itself. If the professor means this, he is mistaken. The student's point is precisely that the assumptions *are* relevant because they are the causal engine of the prediction.

  ---

  ### Which Reading Is Usually Intended?

  In seminar settings, when a professor deploys this line, they are usually invoking a mixture of **Reading 2 ('As-If')** and **Reading 3 (Tractability)**, but presenting it as **Reading 1 (Empirical Pragmatism)**.

  It functions as a **boundary marker**. The professor is signaling: *"We are doing positive economics (prediction), not philosophical psychology (realism). Do not question the internal machinery unless you have data showing the output is wrong."*

  It is a defense of the division of labor. The modeller's job is to build a consistent logical machine; the econometrician's job is to test if the machine outputs match reality. The professor is attempting to stop the student from doing the econometrician's job during the modelling phase.

  ### Does the Line Answer the Student's Objection?

  **No.** In fact, the line is largely orthogonal to the student's specific worry.

  The student's objection is not merely that the assumptions are unrealistic (e.g., "people die"). The objection is that the assumptions are **structurally determinative** of the policy conclusion.
  *   **The Student's Point:** "The result (tax effects) depends entirely on the mechanism (infinite life/foresight). If the mechanism is absent in the real world, the result will not hold."
  *   **The Professor's Line:** "Judge by predictions."

  Here is why the line fails to answer the student:

  1.  **The Lucas Critique:** The student is implicitly raising a version of the Lucas Critique. If the model relies on "perfect foresight" to generate tax effects, it assumes expectations are fixed or mechanically derived. But if the government changes tax policy, real households (with imperfect information) will change their expectations. A model that assumes fixed expectations cannot accurately predict the effect of a *change* in policy, even if it fits past data. The professor's line ignores the difference between **forecasting** (predicting the future given current policy) and **policy evaluation** (predicting the outcome of a *new* rule).
  2.  **External Validity:** The professor's line works for *internal* validity (does the math work?) or *historical* fit (does it match past data?). The student is asking about *external* validity (does this apply to a different population?). Asserting "predictions matter" does not explain *why* a model built for immortal beings should predict the behavior of mortals.
  3.  **Mechanism vs. Black Box:** The student is asking about the *transmission mechanism*. If the model says "Tax cuts boost consumption because immortal households smooth income over eternity," but real households are liquidity-constrained and short-lived, the prediction might hold for the wrong reason, or fail entirely when the constraint binds. The professor's line treats the model as a black box, but the student is asking to inspect the wiring.

  ### Conclusion

  The professor's line is a **methodological slogan**, not a logical argument.

  *   **Is it plausible?** In its 'As-If' formulation, yes, it is a standard and defensible view of economic modelling.
  *   **Does it license the dismissal?** No. It is a non-sequitur in this context. The student is arguing that the *link* between assumption and prediction is fragile. Merely stating that "predictions are what matter" does not establish that *this* model *will* make accurate predictions.

  The student has identified a potential **structural fragility** in the model. The professor's response amounts to saying, "Wait until we see if it breaks." While that is a valid pragmatic stance, it is not a rebuttal to the theoretical concern. A better response would have been: *"That is a valid concern about external validity. We assume these conditions to isolate the intertemporal channel. We must later test if the result holds when we relax these assumptions."*

  By using the slogan, the professor shut down a necessary discussion about the **scope conditions** of the model. The line is equipped to answer objections about *psychological realism* (e.g., "people aren't calculators"), but it is not equipped to answer objections about *structural relevance* (e.g., "this mechanism doesn't exist in the target economy"). The student raised the latter; the professor answered the former.
