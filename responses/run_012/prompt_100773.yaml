answer: |-
  1. I asked a universalist to boil the kettle, but he insisted he was already brewing tea with an object composed of the kettle, the Moon, and his left shoe.
  2. I offered a van Inwagenian a seat, but he refused because chairs don't exist, which is rich coming from a man who insists he's a real organism but denies the table he's leaning on is anything at all.
  3. I asked the nihilist to bring biscuits, but he arrived empty-handed, claiming that neither he nor the Hobnobs compose anything over and above their simples.
  4. After three weeks of this, I'm worried that if I stand up too quickly, I'll cease to satisfy the conditions for composition and just become a scattered heap of simples again.
  5. I tried to shake a nihilist's hand, but he pulled away, insisting that since nothing touches anything, we were merely engaging in a close approximation of contact.
