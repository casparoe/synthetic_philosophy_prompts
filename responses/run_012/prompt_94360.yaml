          5.  Specifically include the Burden of Proof reading.
          6.  Identify which reading licenses the colleague's move.
          7.  Evaluate if that reading survives scrutiny.
          8.  State what the most defensible reading allows the colleague to conclude instead.

  2.  **Deconstruct the Slogan ("Absence of evidence is not evidence of absence"):**
      *   *Intuition:* It sounds wise but is often misused. In logic/statistics, absence of evidence *is* usually evidence of absence, just sometimes very weak evidence.
      *   *Context:* Fermi Paradox. We haven't heard signals ($E$). Hypothesis: ETCs exist ($H$). Colleague says $P(H| \neg E) \approx P(H)$. User suspects $P(H| \neg E) < P(H)$.

  3.  **Brainstorming Distinct Readings (The "Menu"):**
      *   *Reading 1: Logical Necessity.* Is it logically impossible for lack of evidence to imply non-existence? No.
      *   *Reading 2: Deductive Validity.* Does $\neg E$ deductively prove $\neg H$? No. (This is the trivial truth).
      *   *Reading 3: Probabilistic Irrelevance.* Does $\neg E$ change the probability of $H$ at all? (This is the colleague's likely claim).
      *   *Reading 4: Epistemic Threshold.* Is the evidence too weak to cross a belief threshold? (Pragmatic).
      *   *Reading 5: Burden of Proof.* Who has to prove what? (Dialectical).
      *   *Reading 6: Search Sensitivity.* Did we look hard enough? (Methodological).
      *   *Reading 7: Bayesian Likelihood Ratio.* $P(\neg E | H) = P(\neg E | \neg H)$.

  4.  **Developing the Menu Items (Drafting & Refining):**

      *   *Item 1 (Deductive):* $\neg E \not\vdash \neg H$. Status: Trivial/True. Reason: It's an inductive context, not deductive.
      *   *Item 2 (Probabilistic Null):* $P(H | \neg E) = P(H)$. Status: False (generally). Reason: Requires specific likelihood equality.
      *   *Item 3 (Bayesian Likelihood):* $P(\neg E | H) = P(\neg E | \neg H)$. Status: Substantive/Contingent. Reason: Only true if the search method is insensitive to $H$.
      *   *Item 4 (Burden of Proof):* The claimant must prove existence; silence doesn't shift the burden. Status: Defensible (Dialectical). Reason: Default status quo remains until positive proof.
      *   *Item 5 (Pragmatic/Threshold):* $\neg E$ isn't enough to *reject* $H$ confidently. Status: Defensible. Reason: Evidence might be too weak to cross action threshold.
      *   *Item 6 (Methodological):* We haven't looked properly yet. Status: Substantive/Empirical. Reason: Depends on search volume/sensitivity.

  5.  **Focusing on the Bayesian Reading:**
      *   Bayes' Theorem: $P(H | \neg E) = \frac{P(\neg E | H) P(H)}{P(\neg E)}$.
      *   For $\neg E$ to *not* be evidence of absence, the posterior must equal the prior ($P(H | \neg E) = P(H)$).
      *   This implies $P(\neg E | H) = P(\neg E | \neg H)$.
      *   In English: The probability of seeing no signal if aliens *exist* must be the same as the probability of seeing no signal if aliens *don't exist*.
      *   In Fermi Context: This means our radios are equally likely to hear nothing regardless of whether the galaxy is teeming with life or empty. This seems empirically false given decades of searching.

  6.  **Focusing on the Burden of Proof Reading:**
      *   This is about dialectical obligation, not truth conditions.
      *   "You can't use silence to *disprove* my claim, you need positive data."
      *   This shifts the goal from "Is it evidence?" to "Is it *conclusive* proof?"

