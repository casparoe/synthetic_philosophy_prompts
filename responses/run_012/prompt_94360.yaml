  11. **Final Polish:** Check against constraints. "Think carefully before you answer" (done in thought block). "Begin by brainstorming..." (will structure the output this way). "Menu format." "One-line reason." "Bayesian reading spelled out." "Burden of proof reading." "Which single reading licenses colleague's move." "Whether it survives scrutiny." "Most defensible reading conclusion."

