answer: |-
  This is a classic cluster of problems in decision theory and moral philosophy, touching on **Newcomb's Problem**, **Kavka's Toxin Puzzle**, and **Parfit's Hitchhiker**. You and your flatmate are stuck because you are arguing from two different levels of analysis: your flatmate is arguing from **Virtue Ethics** (identity/character), and you are arguing from **Decision Theory** (process/outcome). Neither alone captures your intuitions because your intuitions are a hybrid: you want the *benefits* of being a certain type of person (Virtue) but only when it makes *instrumental sense* (Decision Theory).

  Here is a precise principle that captures your specific verdicts, followed by the mapping, the honest limitations, and the application to your new cases.

  ### The Principle: Diachronic Cooperative Integrity (DCI)

  **"An agent is rationally required to execute the intentions and dispositions they adopted to secure a benefit, provided that: (1) the benefit was secured through a reciprocal exchange of trust with a moral agent, and (2) the execution of the intention does not inflict gratuitous harm disproportionate to the cooperative norm being sustained."**

  This principle treats rationality as a property of the **temporally extended agent** (you over time) rather than the **time-slice** (you right now). It binds your future self to your past self's rational plans, but only within a "cooperative sphere."

  ### Mapping the Principle to Your Six Cases

  1.  **Hitchhiker (Pre-ride):**
      *   **Verdict:** Form the intention.
      *   **DCI Clause:** *Adoption Phase.* You must adopt the disposition (willingness to pay) that maximizes expected utility at the start. Without this disposition, you don't get the ride.
  2.  **Hitchhiker (Post-ride):**
      *   **Verdict:** Pay.
      *   **DCI Clause:** *Reciprocal Trust.* The driver is a moral agent who extended credit based on trust. Breaking the commitment violates the cooperative norm that allowed you to benefit. You are bound to be the person who paid.
  3.  **Toxin Puzzle:**
      *   **Verdict:** Don't drink.
      *   **DCI Clause:** *Decoupled Reward.* The money was secured by the *intention alone*, not the act. Drinking yields no cooperative benefit and only causes harm. The binding force dissolves because there is no reciprocal exchange contingent on the *action*.
  4.  **Missile/Deterrence:**
      *   **Verdict:** Don't retaliate.
      *   **DCI Clause:** *Gratuitous Harm Exception.* While deterrence relies on credibility (like the Hitchhiker), retaliation is suicidal and harms millions. The "cooperative norm" here is with an adversary, not a partner. The harm outweighs the norm preservation. (See "Honest Limitations" below).
  5.  **Dead Friend's Promise:**
      *   **Verdict:** Keep paying.
      *   **DCI Clause:** *Reciprocal Trust (Extended).* The friend was a moral agent. The benefit (peace of mind/friendship) was received in the past on the credit of your promise. Breaking it violates the integrity of the agent who received that benefit.
  6.  **Brother's Belief:**
      *   **Verdict:** Cultivate confidence, acknowledge irrationality.
      *   **DCI Addendum:** *Pragmatic Epistemology.* Beliefs can be cultivated for utility (pragmatic rationality) even if they lack evidence (epistemic rationality), provided you recognize the distinction. This is a "useful fiction," not a binding commitment to truth.

  ### Honest Limitations: What This Principle Can't Save

  I must be honest about **Case 4 (Deterrence)**.
  Philosophically, Case 2 (Hitchhiker) and Case 4 (Deterrence) are structurally identical: *I benefit now because I am the kind of person who does X later. Later comes. Should I do X?*
  *   If you say **Pay the Driver** (Case 2), logical consistency demands you **Launch the Missiles** (Case 4). Why? Because if you don't launch, you prove you are *not* the kind of person who retaliates. Future enemies will know this, and deterrence will fail next time. You are "free-riding" on your past reputation just as you would be with the driver.
  *   **DCI saves your intuition** on Case 4 only by invoking the *Gratuitous Harm Exception*. It prioritizes the immediate moral horror of nuclear suicide over the long-term game-theoretic benefit of credibility.
  *   **The Cost:** This makes your rationality **context-dependent**. You are "bound" by your past self in social contracts (Hitchhiker/Promise) but "free" from your past self in adversarial standoffs (Deterrence). A hardline Game Theorist will say you are being inconsistent. A hardline Deontologist will say you are right. DCI sides with you, but admits the tension.

  ### Application to Your Undecided Cases

  **1. Passport vs. Character (Hitchhiker Variant)**
  *   *Scenario:* You can secure the ride by handing over your passport (external constraint) or by being the kind of person who pays (internal constraint).
  *   *DCI Verdict:* **Character is superior.**
  *   *Reasoning:* Handing over the passport makes you a *constrained maximizer* only in that specific instance. It does not build the disposition required for other cooperative acts. Becoming the *kind of person who pays* generalizes. It increases your expected utility in all future Hitchhiker scenarios, not just this one.
  *   *Integrity vs. Results:* Under DCI, it is **both**. Integrity *is* a result. The "result" isn't just getting to town; it's maintaining the agent-type that gets to town reliably without needing to hand over passports.

  **2. Private Promise to Self**
  *   *Scenario:* You wrote a promise in a notebook nobody will read. You no longer want the thing.
  *   *DCI Verdict:* **Weakly binding, but breakable.**
  *   *Reasoning:* This lacks Clause 1 (Reciprocal Trust with a Moral Agent). There is no other person whose trust you are violating.
  *   *Comparison to Case 5:* In Case 5 (Dead Friend), there is a moral patient (the mum) and a moral agent (the friend) whose memory grounds the obligation. In the Notebook case, it is purely intrapersonal.
  *   *Binding Force:* It binds only insofar as breaking it corrodes your general disposition of *self-trust*. If breaking this promise makes you the kind of person who breaks promises *to others*, you should keep it. If it is truly isolated, DCI permits you to move on. The obligation is to your future agency, not your past whim.

  ### The Killer Case: The One-Shot Anonymous Hitchhiker

  If you want to separate the surviving candidate principles (Virtue Ethics vs. Decision Theory vs. DCI), this is the case that will break your stalemate:

  **The Setup:**
  You are stranded. A driver pulls up. He says, "I will drive you to town. I have a lie-detector scan. If I detect you *intend* to pay, I drive. If I detect you *intend* to stiff me, I leave."
  **Crucial Twist:** Once you reach town, you will vanish into a crowd. The driver will never see you again. No one will ever know if you paid. There is no reputation to lose, no future rides to secure, no god watching.

  **The Question:** You are in town. Wallet out. Driver standing there. Do you pay?

  *   **Causal Decision Theory (Standard Rationality):** **No.** Paying costs you money and buys you nothing. The ride is already secured.
  *   **Virtue Ethics (Flatmate):** **Yes.** Because you are "the kind of person who pays," regardless of consequences.
  *   **DCI (Your Hybrid):** **Yes, but...**
      *   *Why:* Because you entered a **cooperative exchange**. The driver held up their end based on trust. Even if anonymous, the *structure* was reciprocal. To not pay is to exploit the cooperative norm itself, which undermines your status as a cooperative agent *in principle*, even if not in reputation.
      *   *The Break Point:* If you say **No** here, you admit you only care about *reputation* (Consequentialism), not *integrity*. If you say **Yes**, you admit you are bound by norms even when consequences don't demand it.

  **Why this separates the principles:**
  If your flatmate says "Yes" and you say "No," you have found the fault line. Your flatmate believes the *act* defines the person. You likely believe the *outcome* defines the rationality. The One-Shot Anonymous Hitchhiker removes the "future benefit" of being trustworthy, isolating whether you value the *norm* itself.

  ### Summary Advice for the Stalemate
  Tell your flatmate: "Being the person I want to be isn't a magic spell; it's a strategy for securing cooperative benefits over time."
  Tell yourself: "Rationality isn't just about the process; it's about owning the dispositions that make the process work."

  You are both half-right. The principle is **Diachronic Cooperative Integrity**. It saves your verdicts on the Hitchhiker and the Promise, explains away the Toxin, and gives you a principled (if slightly tense) reason to spare the world in the Missile case.
