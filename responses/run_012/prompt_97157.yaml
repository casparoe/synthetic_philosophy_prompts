prompt: |-
  I run a small weekly reading group and two of my regulars have been at each other's throats for about a year now. One is a committed particularist — reasons are holistic, no moral principle ever really does any work in getting you to a verdict, the whole skill is seeing the case aright. The other is a stubborn generalist — there have to be principles, or at least hedged or default ones, otherwise moral thought is unteachable and there's nothing left to argue about. At this point they're just repeating themselves and I'm tired of referreeing. So draft the document they should have produced a year ago: an adversarial-collaboration joint statement they could both actually put their names to. Start with a numbered section of claims they both accept, then a disagreements table in which each side's position is stated in wording that side would accept as its own. I want the real cruxes named. My hunch is one of them is whether holism of reasons actually rules out principles or only rules out unhedged ones, and another is whether they're even disagreeing about the same thing — is particularism a claim about the metaphysics of reasons, about how a verdict gets justified, or about how you come to see what to do? I suspect a fair chunk of this fight is verbal and I want that part flagged as such. For each crux, give a case or argument both sides agree would bear on it, with each side's prediction written down in advance. And make them face this case, because I keep throwing it at them and they keep talking past it: the feature "this benefits my own child" is normally a reason to do the thing, but when the thing in question is allocating a scarce public resource I administer, that same feature looks like a reason against doing it — a reason to recuse instead. Does a generalist principle survive that just by getting hedged, or does the particularist win by default? Is the feature still a reason in the second case, a weaker reason, or no reason at all — make each of them commit to an answer. Keep the whole thing a document both of them could sign, not a transcript of the fight.
reasoning: |-
  Here's a thinking process that leads to the suggested document:

  1.  **Analyze the Request:**
      *   **Context:** A weekly reading group with two feuding members (Particularist vs. Generalist) arguing for a year.
      *   **Goal:** Draft an "adversarial-collaboration joint statement" they can both sign.
      *   **Structure:**
          1.  Numbered section of agreed claims (Common Ground).
          2.  Disagreements Table (stating positions in language each side accepts).
          3.  Identification of Cruxes (metaphysics vs. epistemology vs. semantics).
          4.  Specific Test Case: The "Benefit My Child" vs. "Public Resource/Recusal" scenario.
          5.  Commitments: Each side must predict outcomes/interpretations of the test case.
      *   **Tone:** Formal, collaborative, precise, non-combative, but rigorous. It must look like something both could sign without feeling misrepresented.
      *   **Key Philosophical Issues:** Moral Particularism (Dancy-style) vs. Moral Generalism (Principle-based). Holism of reasons vs. Invariantism. The role of principles in justification vs. heuristics. The specific status of "reasons" in shifting contexts (valence switching).

  2.  **Deconstruct the Philosophical Positions:**
      *   **Particularist (P):** Reasons are holistic (context-dependent). A feature can be a reason in one case and not in another, or even a reason against. Principles don't *explain* verdicts; they at best summarize. Moral thought is about perception/sensitivity, not subsumption under rules.
      *   **Generalist (G):** Principles are necessary for moral thought to be intelligible/teachable. Reasons generally have invariant valence (or default valence). If a feature switches valence, there's a higher-order principle explaining *why* (an exception clause).
      *   **The "Verbal" Dispute:** Are they arguing about the *existence* of principles (metaphysics) or the *utility* of principles (epistemology/pedagogy)? Is "principle" defined so loosely by G that P can't deny it, or so strictly by P that G can't affirm it?

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound formal and joint. "Joint Statement on the Role of Principles and Particulars in Moral Reasoning."
      *   **Preamble:** Acknowledge the shared goal (understanding moral reasoning) and the intent of the document (clarify agreement/disagreement).

      *   **Section 1: Common Ground (The "Peace Treaty"):**
          *   Need things both *actually* believe.
          *   Moral judgments require justification.
          *   Context matters (even G admits exceptions exist).
          *   Moral error is possible.
          *   "Reasons" are the currency of debate.
          *   The "Benefit my Child" case is a genuine puzzle for both.

      *   **Section 2: Map of Disagreements (The "Battlefield"):**
          *   Must use charitable language.
          *   *Crux 1: The Nature of Principles.* P: Principles are epiphenomenal summaries. G: Principles are constitutive of justification.
          *   *Crux 2: Holism vs. Defaultism.* P: Valence switches fundamentally. G: Valence is default invariant; switching is explained by defeating conditions (hedging).
          *   *Crux 3: Metaphysics vs. Epistemology.* P: This is about how reasons *work*. G: This is about how we *learn/teach* reasoning. (Addressing the user's hunch about verbal dispute).

      *   **Section 3: The Test Case (The "Child/Public Resource" Scenario):**
          *   This needs to be the core of the "adversarial collaboration."
          *   *Scenario:* Allocating scarce public resource. Feature: "Benefits my child."
          *   *Context A (Private):* Reason For.
          *   *Context B (Public Official):* Reason Against (Recusal).
          *   *Required Commitments:*
              *   Does the feature retain positive valence but get outweighed? (G usually says this).
              *   Does the feature lose its status as a reason entirely or switch valence? (P says this).
              *   Can a principle capture this without becoming trivial ("Do right unless wrong")?

      *   **Section 4: Predictions & Falsification Conditions:**
          *   What would change their minds?
          *   P: If G can produce a non-trivial principle that predicts the switch without prior knowledge of the verdict.
          *   G: If P can show that codifying the switch destroys the explanatory power of the principle.

  4.  **Refining the Tone:**
      *   Avoid "Stubborn" or "Committed" labels in the text itself. Use "Signatory A (Particularist Orientation)" and "Signatory B (Generalist Orientation)" or similar. Let's stick to "The Particularist Signatory" and "The Generalist Signatory" for clarity within the draft.
      *   Ensure the "Verbal Dispute" flag is explicit but polite.
      *   Make sure the "Benefit My Child" case is handled precisely. The prompt asks: "Is the feature still a reason in the second case, a weaker reason, or no reason at all — make each of them commit to an answer."

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "verbal dispute" hunch? *Yes, in the Disagreements Table under 'Scope of Dispute'.*
      *   *Check:* Is the Child/Resource case central? *Yes, dedicated section.*
      *   *Check:* Is it signable? *It avoids saying one side is 'wrong', instead mapping the divergence.*
      *   *Check:* Did I capture the "hedged principle" vs "no principle" tension? *Yes, in the Holism section.*
      *   *Refinement:* Ensure the Generalist doesn't sound like they just say "All principles are hedged." They need to claim the hedging *is* the principle work. The Particularist needs to claim the hedging makes the principle empty.

  6.  **Final Polish:** Check formatting (numbered lists, tables) for readability. Ensure the voice is neutral (the facilitator's voice, not taking sides). (Self-correction: The prompt asks for the document *they* should produce, not a letter from me to them. So it must be in the first person plural "We" or structured as an agreement between "Party A" and "Party B". Let's go with a Joint Statement format signed by both.)

  7.  **Final check on the "Child" case commitments:**
      *   Generalist: "Benefits my child" is a *pro tanto* reason always, but in the public case, a second-order principle (impartiality) overrides it. Or, the principle is "Benefit your child *ceteris paribus*."
      *   Particularist: In the public case, "Benefits my child" is a reason *against* acting (conflict of interest). It's not just outweighed; its valence flips.
      *   *Constraint:* I need to make them commit to whether it is *still a reason* in the second case.
      *   *G:* Yes, it remains a positive reason, but is overridden/forbidden by a stronger principle.
      *   *P:* No, it becomes a negative reason (reason to recuse).

      *Wait, let's look closer at the prompt:* "Is the feature still a reason in the second case, a weaker reason, or no reason at all — make each of them commit to an answer."
      *   Okay, I will force this specific commitment in the Test Case section.

  8.  **Drafting the Content:** (Mental Outline)
      *   Header.
      *   Preamble.
      *   I. Shared Commitments.
      *   II. Map of Disagreements (Table).
      *   III. The Valence-Switching Test Case (The Child/Resource).
      *   IV. Falsification/Resolution Path.
      *   Signatures.

      *Let's write it.*
answer: |-
  # JOINT STATEMENT ON THE ROLE OF PRINCIPLES AND PARTICULARS IN MORAL REASONING

  **Date:** October 26, 2023
  **Parties:** The Particularist Signatory (PS) and The Generalist Signatory (GS)
  **Context:** Weekly Reading Group Adversarial Collaboration

  ## PREAMBLE
  We, the undersigned, acknowledge a sustained disagreement regarding the structure of moral reasoning. We recognize that our debate has stalled due to ambiguous terminology and unresolved metaphysical commitments. This document serves to isolate our points of agreement, precisely map our points of divergence, and establish a specific test case upon which we commit to stake our respective positions. We sign this not to concede error, but to clarify the nature of our dispute.

  ## I. SHARED COMMITMENTS
  *We both affirm the following claims as the common ground for our continued discussion:*

  1.  **Normativity:** Moral judgments are truth-apt and require justification via reasons.
  2.  **Contextual Sensitivity:** The moral relevance of a feature (e.g., "lying," "benefiting a child") can vary depending on the surrounding circumstances. We agree that rigid, exceptionless rules (e.g., "Never lie") are untenable.
  3.  **The Possibility of Error:** It is possible for an agent to be mistaken about what they have reason to do, even if they feel confident in their perception of the case.
  4.  **The Pedagogical Challenge:** Moral reasoning must be communicable. If moral thought is entirely ineffable or idiosyncratic, it cannot be taught or debated.
  5.  **The Status of "Reasons":** We agree to use the term "reason" to denote a consideration that counts in favor of (or against) an action or attitude.
  6.  **The Test Case:** We agree that the scenario detailed in Section III (The Public Resource Case) is a genuine phenomenon that any adequate moral theory must explain.

  ## II. MAP OF DISAGREEMENTS
  *We disagree on the interpretation of the commitments above. The following table isolates the cruxes. Each position is stated in language the respective signatory accepts as accurate.*

  | Crux | The Particularist Signatory (PS) Position | The Generalist Signatory (GS) Position |
  | :--- | :--- | :--- |
  | **1. The Function of Principles** | Principles are at best *ex post facto* generalizations (clutter). They do not generate verdicts. The verdict comes from seeing the case aright; the principle is merely a shadow cast by the verdict. | Principles are *constitutive* of justification. To justify a verdict is to show how it falls under a principle. Without principles, justification is merely intuition reporting itself. |
  | **2. Holism vs. Defaultism** | **Holism of Reasons:** A feature that is a reason in one case can be no reason at all, or a reason *against*, in another case. Its valence is not invariant. | **Default Invariantism:** A feature that is a reason in one case retains that valence as a default. If it appears to switch, it is because a *defeater* or *exception clause* is triggered, which is itself codifiable. |
  | **3. Metaphysics vs. Epistemology** | This is a **Metaphysical** claim about how reasons work. Even an ideal agent does not use principles to reach verdicts; they perceive the reasons directly. | This is largely an **Epistemological** claim about how reasoning is structured. Even if perception initiates the thought, the *warrant* for that thought relies on principled connections. |
  | **4. The "Verbal" Flag** | PS suspects GS uses "principle" so loosely (e.g., "Do the right thing unless wrong") that the claim "principles exist" becomes trivial and unfalsifiable. | GS suspects PS uses "principle" so strictly (e.g., "Exceptionless laws") that the claim "principles don't work" becomes a straw man. GS accepts hedged principles as genuine principles. |

  ## III. THE VALENCE-SWITCHING TEST CASE
  *We agree to use the following scenario to test Crux #2 (Holism vs. Defaultism). We commit to the predictions below.*

  **The Scenario:**
  Consider the feature **F**: *"This action benefits my own child."*
  *   **Case A (Private Sphere):** I am buying a gift. **F** is clearly a reason *for* the action.
  *   **Case B (Public Office):** I am a public official allocating a scarce, non-renewable public resource. I have discretion. **F** is present. In this context, **F** is widely regarded as a reason *against* allocating the resource to my child (a reason to recuse myself).

  **The Question:** In Case B, what is the moral status of feature **F** ("Benefits my own child")?

  ### Commitments

  | Question | Particularist Signatory (PS) Commitment | Generalist Signatory (GS) Commitment |
  | :--- | :--- | :--- |
  | **1. Does F retain positive valence in Case B?** | **No.** In Case B, **F** does not merely get outweighed. Its valence *switches*. It becomes a reason *against* acting (a reason for recusal). The feature itself changes its normative shape. | **Yes.** **F** remains a *pro tanto* reason *for* benefiting the child. However, in Case B, a second-order principle (e.g., "Public officials must act impartially") *overrides* or *forbids* acting on **F**. |
  | **2. Can a principle capture this without triviality?** | **No.** To write a principle that covers both Case A and Case B requires such complex hedging ("Benefit your child unless you are a public official allocating scarce resources...") that the principle adds no explanatory power. It just describes the cases. | **Yes.** The principle is: *"Benefit your child, ceteris paribus, unless doing so violates a duty of impartiality."* This is not trivial; it identifies the *defeater condition* (impartiality) which explains *why* the verdict changes. |
  | **3. Is the disagreement verbal?** | PS maintains that if GS defines a principle as "a rule with infinite exception clauses," then GS is right that principles exist, but wrong that they *do any work*. | GS maintains that if PS defines a reason as "something that never changes valence," then PS is right that reasons are holistic, but wrong that this rules out generalism. |

  ## IV. RESOLUTION PATH & FALSIFICATION
  *To move beyond repeating ourselves, we agree to the following conditions for revising our views:*

  1.  **For the Generalist Signatory:** You will revise your commitment to Default Invariantism if the Particularist can demonstrate a case where the "defeater condition" cannot be specified *in advance* of knowing the verdict. (i.e., If the only way to know when **F** switches valence is to already know the verdict, the principle is not doing the justificatory work).
  2.  **For the Particularist Signatory:** You will revise your commitment to the Epiphenomenality of Principles if the Generalist can produce a hedged principle that successfully predicts a novel moral verdict in a complex case *without* prior intuition of that verdict. (i.e., If the principle can teach a novice what to do where their perception fails, it has explanatory power).
  3.  **On the Verbal Dispute:** We agree to suspend the use of the word "Principle" for four weeks.
      *   PS will refer to "Codifiable Exceptionless Generalizations."
      *   GS will refer to "Defeasible Normative Rules."
      *   If we find we are still arguing after this semantic shift, we acknowledge the dispute is substantive. If the argument dissolves, we acknowledge it was verbal.

  ## SIGNATURES

  _________________________
  **Particularist Signatory**
  *I affirm that this document accurately represents my view and the points on which I am willing to be tested.*

  _________________________
  **Generalist Signatory**
  *I affirm that this document accurately represents my view and the points on which I am willing to be tested.*

  _________________________
  **Facilitator / Witness**
