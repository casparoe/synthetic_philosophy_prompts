          5.  Conclusion: Settling the bar bet.
      *   *Key Insight to weave in:* The "Off-Record" strategy functions differently when the stakes are legal liability vs. social awkwardness.
      *   *Refining the B&L application:* Toyoda's vagueness is technically *Negative Politeness* (hedging, being indirect) aimed at his *own* Negative Face (freedom from legal action), disguised as *Positive Politeness* (expressing sorrow) for the Committee. It's a hybrid.
      *   *Refining the Ethics:* The "White Lie" defense is weak here because the stakeholders (drivers) needed truth for safety, not comfort.
      *   *Final Verdict:* The Americans were right about the *ethics*, the Japanese defenders were right about the *pragmatics*, but the context (US Congress) dictated the American pragmatic norms applied.

  5.  **Self-Correction/Check during drafting:**
