      *   *Did I address Wakimae?* Yes, crucial for the "Anglocentric" critique.
      *   *Did I answer the ethics question?* Yes, Honesty vs. Politeness.
      *   *Is the tone right?* Needs to be authoritative but open to the seminar context.
      *   *Wait, one nuance:* Toyoda *did* apologize, but the *object* of the apology was vague ("anxiety" vs "defects"). I need to highlight that semantic shift.

  6.  **Final Polish:** Ensure the transition from pragmatics to ethics is smooth. The link is that politeness strategies can be used to obscure moral truth. (Proceed to generate output).

  *(Self-Correction Note)*: I need to make sure I don't just say "B&L is wrong." I need to say where it breaks. It breaks because it assumes rational actors maximizing social equilibrium, not legal adversaries in a life-or-death scenario.

  *(Ethical Nuance)*: The prompt asks "Which one should win?" I need to take a stand. Honesty must win in safety-critical contexts.

  *(Final Plan)*:
  1.  Map B&L onto the testimony.
  2.  Introduce *Wakimae* as the corrective lens.
