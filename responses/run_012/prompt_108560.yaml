answer: |-
  **Provenance Labs Client Support: Genealogical Debunking Service FAQ**

  Welcome to Provenance Labs. We understand that interrogating the foundations of your value system is a significant undertaking. Below you will find answers to common procedural questions regarding our standard debunking packages. If your inquiry is not listed here, please submit a support ticket.

  **1. Does tracing a belief to its origin prove that the belief is false?**
  Our reports establish causal ancestry, not direct falsity. However, if a conviction stems from reproductive fitness pressures rather than truth-tracking mechanisms, its epistemic warrant dissolves. You may still be accidentally right about the moral claim, but you can no longer claim to know it is true.

  **2. Which convictions are eligible for debunking, and which do you decline?**
  We specialize in normative moral claims regarding fairness, purity, and authority. We do not process basic survival instincts or perceptual reports necessary for daily functioning. We draw the line at convictions whose removal would impede contract fulfillment or compromise client safety during the engagement.

  **3. Would this same treatment not debunk arithmetic, logic, or memory?**
  This is a common concern. While arithmetic reliability is also evolved, those faculties confer direct individual survival advantages in navigation and tool use. Moral intuitions are group-selection artifacts with no necessary link to reality. We rely on arithmetic to calculate your fee, and we trust that faculty while debunking others.

  **4. If you debunk my belief, am I allowed to go on holding it?**
  You are free to retain the belief, but you must acknowledge it lacks justification. We advise adopting a fictionalist stance: retain the vocabulary for social coordination while internally recognizing the claim is untrue. This minimizes social friction while maintaining intellectual honesty.

  **5. Do you sell a way to have a belief reinstated?**
  We offer a Normative Reconstruction add-on package. This does not restore truth-claims but provides a pragmatic framework to act as if the beliefs hold. It is popular among clients who find pure error theory socially isolating or psychologically burdensome.

  **6. What am I supposed to do about my conduct given the report?**
  Continue following local norms. The debunking is theoretical; the consequences of deviance are practical. There is no need to alter behavior unless the report identifies specific fitness costs to your current conduct. Do not worry about the why, just the what.

  **7. How can I know that your genealogy is correct?**
  Our reports are generated using standard cognitive faculties evolved for pattern recognition. If you doubt those faculties based on their origins, you must equally doubt the faculties generating your doubt. We recommend trusting the tools that built the lab.

  Thank you for choosing Provenance Labs. We hope our services help you achieve a clearer, albeit unjustified, perspective.
