  >
  > **Is 1 second of agony worse than 3 months and 1 second of toothache?**"

  **Why This Works:**
  *   **If she says "Yes":** She is vulnerable to the Sorites Paradox. If a single second resolves the incomparability, then enough seconds will eventually make Agony *better* than 8 years of toothache, violating Verdict 4.
  *   **If she says "It's still vague/unclear":** She is an **Epistemic Vagueness** theorist. She thinks there *is* a fact, we just can't see it. This contradicts Verdict 5.
  *   **If she says "No, they are still incomparable":** She is a true **Parity** theorist. This is the only view that holds that small improvements do not resolve parity. This confirms Verdict 5 is ontological, not just her being unsure.

  This question forces her to choose between the logic of transitivity (which she loves) and the logic of parity (which she needs to save her view from contradiction). It will show you if she actually understands the machinery of her own philosophy.
