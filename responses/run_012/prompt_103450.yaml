  | Ownership vests in the executor of tangible work unless the contributor dictated creative choices so thoroughly that the executor acted merely as a tool. | Ana/Ben, Cleo/Dev, Planter, Efua, Gus/Hana, Lena/Moe | Quinn owns 100%; Priya's spec was detailed but Quinn retained engineering agency. | High | A ruling where a non-builder wins ownership solely via detailed blueprints without payment or contract. |
  | Ownership is divided based on the relative value of conceptual design versus physical implementation. | Lena/Moe, Efua, Planter | Priya gets ~50% for design; Quinn gets ~50% for build. | Med | Ana/Ben (Ana's concept had value but she got 0%). |
  | Ownership requires explicit agreement or payment; absent both, the builder retains full rights. | Cleo/Dev, Gus/Hana, Ana/Ben | Quinn owns 100%; no money or contract existed between Priya and Quinn. | Med | Lena/Moe (Lena got share despite no money or prior agreement). |

  I selected the "Execution plus Creative Agency" rule because it is the only framework that reconciles the Ana/Ben denial of idea ownership with the Cleo/Dev exception for total creative control. The closest precedent is Ana versus Ben, as both involve unpaid conceptualization versus tangible construction, distinguishing Priya's detailed spec from Cleo's paid directive. To settle whether detailed specs alone transfer ownership without payment, we would need a case where a builder follows exhaustive blueprints with zero engineering discretion. Until then, Rosa prioritizes the risk and labor of implementation over the specificity of the request.
