      *   *The Substantive Layer:* It's not just about evidence. It's about the *role* of epistemology. Camp 1 sees OC as dissolving the skeptical problem by changing the subject (therapeutic). Camp 2 sees OC as solving the skeptical problem by offering a new foundation (constructive).
      *   *The "Grab-Bag" Issue:* This is crucial. OC is a notebook, not a finished treatise. Wittgenstein often shifts angles. Some remarks look grammatical (§§ 204, 341), some look almost empirical (§§ 411, 519).

