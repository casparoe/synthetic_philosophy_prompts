answer: |-
  Your hypothesis is sharp, and you are right to suspect that the verbal disagreement is masking a deeper methodological rift. However, I think your diagnosis needs one crucial adjustment: the substantive disagreement isn't primarily about *evidentialism* versus *non-evidentialism*, but about whether **epistemology is the right tool for the job at all.**

  Here is the diagnosis of the impasse, the role of the "grab-bag" hypothesis, and what would actually count as progress.

  ### 1. The Verbal Layer is a Symptom, Not the Cause
  You are correct that "proposition," "knowledge," and "belief" are being used differently. But this isn't just terminological pedantry.
  *   **Camp 1 (Non-Propositional)** is reading Wittgenstein **therapeutically**. For them, Wittgenstein is showing that the skeptic and the dogmatist are both misusing language. When we say "I know the earth existed," we are grammatically misled into thinking we are stating a fact supported by evidence. Camp 1 insists that calling hinges "propositions" invites the very skeptical trap Wittgenstein is trying to dismantle.
  *   **Camp 2 (Propositional)** is reading Wittgenstein **constructively**. They want to save epistemology from skepticism by using Wittgenstein. They accept the language of "propositions" and "truth" because they want to integrate hinges into a theory of warrant (e.g., "entitlement").

  **The Diagnosis:** The fight over "proposition" is a proxy war over whether *On Certainty* is a critique of epistemology (Camp 1) or a contribution to it (Camp 2). Camp 1 thinks Camp 2 is domesticating Wittgenstein into a traditional epistemologist. Camp 2 thinks Camp 1 is turning Wittgenstein into an obscurantist who can't say anything positive.

  ### 2. Descriptive vs. Normative: The Real Substantive Clash
  You asked if the disagreement is about whether epistemology describes certainties or justifies them. This is the heart of it, but it goes deeper.
  *   **Camp 1** sees Wittgenstein's project as **grammatical/descriptive**. He is mapping the limits of sense. Hinges are the "scaffolding" (OC §211) or the "riverbed" (OC §§96–99). You don't *justify* the riverbed; you describe how the water flows over it. To ask for a warrant is to misunderstand the category.
  *   **Camp 2** sees the project as **normative**. They agree hinges lack *evidential* support, but they insist we need an account of why we are *rationally permitted* to hold them. They are asking, "What gives us the right?" Wittgenstein, however, often suggests the question "What right?" is itself a confusion when applied to the framework.

  **The Hidden Question:** The hidden question isn't empirical or formal; it is **meta-philosophical**. It is: *Is the goal to dissolve the anxiety of skepticism (Camp 1) or to solve the problem of skepticism (Camp 2)?*
  *   If the goal is dissolution, Camp 1 wins: showing that doubt is senseless here makes the demand for justification vanish.
  *   If the goal is a solution, Camp 2 wins: we need a positive account of why our beliefs are secure.

  Wittgenstein explicitly leans toward Camp 1 ("I am not trying to give a foundation," OC §417), but the text is fragmented enough that Camp 2 can find fuel for Camp 2's fire.

  ### 3. The "Grab-Bag" Hypothesis: The Key to Dissolution
  Your intuition about the heterogeneity of hinges is the most promising avenue for progress. Wittgenstein does not offer a unified theory of "The Hinge." He offers a series of remarks on different kinds of certainty.
  *   **Some hinges are grammatical rules:** "The earth existed before I was born." This functions as a norm. To doubt it is to lose the ability to make historical judgments. Camp 1 is right about these. They are not truth-apt in the standard sense; they define the sense.
  *   **Some hinges are empirical propositions that have hardened:** "This is my hand." This *looks* empirical, but in the context of Moore, it functions as a certainty. It *could* be false (in a bizarre scenario), but in our practice, it is exempt from doubt. Camp 2 is right about these. They have truth values, but their warrant is not evidential.
  *   **Some hinges are practical/animal:** "I have two hands" (when reaching for a cup). This is unreflective action. Camp 1 is right here too.

  **How this cuts:**
  If your group accepts the **Heterogeneity Thesis**, the impasse dissolves into a classification task.
  *   **Concession from Camp 1:** You must admit that *some* things functioning as hinges retain propositional form and truth values (e.g., specific scientific certainties that are currently unchallenged). Denying truth-values across the board makes Wittgenstein sound like an idealist, which he denies being.
  *   **Concession from Camp 2:** You must admit that *some* hinges are purely grammatical rules where "warrant" is a category mistake. Trying to find a "non-evidential warrant" for a rule of grammar is like asking for the color of the number 7.

  **The Relocation:** The fight relocates from "What is a hinge?" to "Which remarks are we discussing right now?" Often, Camp 2 is analyzing a "hardened empirical proposition" while Camp 1 is analyzing a "world-picture rule." They are talking about different objects under the same label.

  ### 4. What Would Count as Progress?
  The impasse is not due to an under-specified question, but to a refusal to specify the *level of analysis*. Progress requires three moves:

  1.  **Distinguish "Logic" from "Psychology":**
      Camp 1 often slides into describing the *feeling* of certainty (animal sureness). Camp 2 slides into describing the *logic* of entitlement. Wittgenstein is interested in the **logic of our language games**.
      *   *Progress:* Agree to stop talking about "feelings of certainty" (psychology) and focus on "what counts as a move in the game" (logic).

  2.  **Adopt the "Hardening" Metaphor:**
      Use Wittgenstein's riverbed metaphor (OC §§96–99). Propositions can harden into rules, and rules can fluidify into propositions.
      *   *Progress:* Acknowledge that the status of a hinge is **functional, not ontological**. A sentence isn't a hinge by nature; it becomes one by how it is used. Camp 2 treats them as a special *kind* of proposition. Camp 1 treats them as a special *kind* of rule. Both should treat them as **propositions functioning as rules**.

  3.  **The "Mooreanic" Concession:**
      Camp 2 must concede that Wittgenstein thinks Moore was wrong to say "I *know*." Wittgenstein insists Moore should have said "I am certain" or simply acted. "Knowledge" implies the possibility of doubt and verification.
      *   *Progress:* Camp 2 must drop the claim that hinges are "known." They can be "true" and "propositional," but calling them "knowledge" smuggles in the evidential game Wittgenstein is rejecting. Camp 1 must concede that they can be "true" without being "known."

  ### 5. Honest Assessment of the Impasse
  Is the impasse just what you get when a question is under-specified? **Yes.**
  The question "Are hinges propositions?" is a bad question because it assumes a static ontology. Wittgenstein's point is that the *status* of these remarks is fluid depending on the language-game.

  **The Verdict:**
  Your hypothesis is correct that there is a substantive disagreement about the nature of justification, but it is more accurate to say it is a disagreement about the **legitimacy of the demand for justification.**
  *   **Camp 1** says the demand itself is the disease.
  *   **Camp 2** says the demand is valid, but the supply (evidence) is different.

  **Recommendation for the Group:**
  Stop asking "What are hinges?" Start asking "What work is this specific remark doing in this specific language game?"
  If you treat "hinge" as a functional role rather than a natural kind, Camp 1 and Camp 2 are describing different functions.
  *   When the remark stops doubt from making sense, it's a **rule** (Camp 1 wins).
  *   When the remark stops doubt from being reasonable (but remains truth-apt), it's a **warranted certainty** (Camp 2 wins).

  Wittgenstein likely intended both, at different times, for different purposes. The "grab-bag" theory is your best way out. It forces both camps to admit they are generalizing from a subset of the text. If you map the remarks to the "rule vs. hardened proposition" spectrum, you will find Camp 1 is right about the deep world-picture remarks, and Camp 2 is right about the specific empirical certainties. The fight ends when you stop trying to make them fit one box.
