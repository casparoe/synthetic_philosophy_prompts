      *   Ensure I address the ML context specifically.
      *   Check confidence rating.

      *(Self-Correction during drafting)*: Wait, Step 4 is also suspect depending on how you define "nothing over and above." If you define it strongly, Step 3 follows. If you define it as supervenience, Step 3 still doesn't necessarily follow. But Step 3 is the stronger claim about *causation*. I should focus on Step 3 as the primary error, but acknowledge Step 4's role in making Step 3 look true. Actually, Step 3 is the *Causal Exclusion Principle*. That's the standard target.

      *Wait, one nuance:* The user says "I suspect the trouble is somewhere around (3) and (4) pulling against each other." I should validate this intuition. Step 4 makes the macro ontologically dependent. Step 3 makes the macro causally inert. The combination kills the macro. Breaking Step 3 allows the macro to be causally relevant *despite* Step 4.

      *ML Application:* In interpretability, the "feature" is a high-level abstraction. The colleague is right that the *math* runs on floats (simms). The user is right that the *generalization* relies on the feature (simmball). The "cause" of the model's behavior *in deployment* is best described by the feature, because the feature tracks invariance across different low-level instantiations.

      *Confidence:* I am confident this is the Causal Exclusion Argument. I am less confident that resolving it satisfies the colleague, because the colleague might be a hard determinist. I need to be honest about that.

  9.  **Final Review against constraints:**
