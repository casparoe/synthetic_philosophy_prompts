answer: |-
  Here is the definite position you asked for.

  **Your friend is wrong.** Qualia are not a word for nothing. They are the specific format of your brain's sensory simulation. However, your intuition about *which* cases count as qualia is slightly too broad. To defend qualia against your friend, you must distinguish between **sensory representation** (qualia) and **evaluative judgment** (attitude).

  ### The Principle: Involuntary Sensory Constraint
  A change counts as a change in **qualia** (experience) if the sensory content is *mandatory* and persists even when you consciously hold a contradictory belief. A change counts as **attitude** if it relies on, or vanishes under, cognitive re-framing.

  Qualia are what you *cannot* choose to not feel, even when you know the facts. Attitudes are how you *value* what you feel, which can shift with context.

  ### Applying the Principle (and Overturning Your Verdicts)

  Here is how the principle sorts your cases. I am overturning two of your verdicts to make the definition robust enough to defeat your friend.

  1.  **Black Coffee (Experience Changed):** **Keep.** Your taste receptors and neural processing of bitterness have physiologically adapted. You cannot choose to taste the old bitterness by reminding yourself it's the same bean. The sensory constraint is real.
  2.  **Nan's Fruitcake (Attitude Changed):** **Keep.** You report the taste is "exactly as cloying." The sensory data is constant; the emotional valence (warmth) is added by memory. This is a limbic system response, not a sensory shift.
  3.  **The Song (Experience Changed):** **Keep.** Perceptual learning has re-tuned your auditory cortex. Once the bassline is segregated, you cannot *not* hear it as a distinct stream. The sensory geometry has changed.
  4.  **Burnt Plastic Smell (Experience Changed):** **Keep.** This is your strongest evidence. The stimulus is absent, but the sensation is mandatory. You cannot think the smell away. This proves experience is generated internally, not just reflected from the world.
  5.  **The Wine (Attitude Changed):** **OVERTURN.** You said experience changed; I say this is attitude. While the price tag triggers dopamine that *modulates* perception, the "richness" is largely a confabulation of expectation. If you focus intensely on the raw chemical sensation (acidity, tannin) while being reminded it is cheap, the "richness" often dissolves. It is cognitively penetrable. Calling this a qualia change hands your friend the argument that "experience is just belief."
  6.  **The Painting (Attitude Changed):** **OVERTURN.** Same as the wine. Knowing it is a forgery changes your *interpretation* of the brushstrokes, not the light hitting your retina or the early visual processing. If you squint and look purely at color patches, the "flatness" recedes. It is a judgment of quality masquerading as a visual property.

  ### The Colorblind Glasses
  If glasses allow a colorblind person to distinguish red and green where they previously saw only beige, **this is a new qualia.**
  Your friend will argue they are just "learning to distinguish signals." You should reply: *Distinguishing the signals IS having the qualia.*
  The glasses alter the input to the visual cortex, allowing a differentiation that was previously physically impossible. The "what it is like" to see that contrast is a new property of their experience. It is involuntary (they can't choose to see them as the same again) and sensory. It fits the principle.

  ### Why Your Friend is Wrong
  Your friend claims qualia are incoherent because they seem to disappear when analyzed (like the wine case). They are committing a category error. They are confusing **the content of the experience** with **the cause of the experience.**

  *   **Friend's Claim:** "If a belief changes the taste, the taste wasn't real, it was just the belief."
  *   **The Truth:** If a belief changes the taste, the brain has used that belief to *rewrite the sensory simulation.*

  However, to win the argument, you must concede the Wine and Painting cases. If you insist that *beliefs* count as *qualia*, your friend is right: qualia become indistinguishable from thoughts. By drawing the line at **Involuntary Sensory Constraint**, you preserve a core of "raw feel" (the smell, the coffee, the bassline) that exists independently of your opinions.

  **Summary:** Qualia are real. They are the mandatory outputs of your sensory cortex. Your verdicts on Wine and Painting are incorrect; those are high-level judgments bleeding into perception, not fundamental changes in the sensory manifold. Stick to the cases where the feeling persists despite the facts (the smell, the coffee), and your friend has no ground to stand on.
