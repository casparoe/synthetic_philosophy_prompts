prompt: |-
  I teach a political philosophy seminar on Rawls, about 16 undergrads, one 75-minute session, and every year the veil of ignorance ends up being something they nod at rather than something they actually feel. I want to fix that with an activity instead of another lecture.

  Heres the angle I want to build it on, which I think is the real engine of the argument and always gets skipped: the difference principle is only supposed to win if the parties are choosing under the maximin rule, and maximin is only rational for them because they don't know the odds. Rawls is pretty explicit that if you knew your chances this would just be a lottery you'd evaluate by expected value, not by the worst case. So I want the students to run the choice twice, once where the veil is thin enough that they know their odds and once where it's genuinely opaque, and see whether they actually switch principles. And I want the second round to carry the strains-of-commitment wrinkle: after they settle on principles, they get assigned to positions, and whoever lands badly off has to say whether they can still affirm the scheme they picked, with no renegotiating.

  Design me the activity. How to stage the two rounds so the students build the candidate principles themselves rather than me handing them a menu, the payoff and probability scheme for each round (no real money), how the assignment works, and the debrief that maps what they did onto the maximin rule, the epistemic condition on the veil, and the strains of commitment. Tell me what'll predictably go wrong the first time I run it. I'm already expecting at least one group to just refuse to play the second round, and someone to argue the whole setup begs the question against utilitarianism by stacking the deck, so tell me how to handle those and whatever else you see coming. Also be honest about what the activity can't get across, I assume it can't reproduce the actual derivation of the two principles in their lexical order, or the fact that the parties aren't self-interested bargainers but moral persons with a sense of justice, but tell me if theres more.

  No lecture up front, and I'd rather they never hear the words maximin or difference principle until the debrief.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Goal:** Teach Rawls's Veil of Ignorance (VoI) and Difference Principle (DP) in a 75-minute seminar (16 undergrads).
      *   **Problem:** Students nod at the VoI but don't *feel* it.
      *   **Core Insight:** The DP relies on the *maximin* rule, which relies on the *thickness* of the veil (unknown probabilities). If probabilities are known, expected utility (utilitarianism) wins. If unknown, maximin (Rawls) wins. Also, the "strains of commitment" (can you live with the outcome?).
      *   **Constraint 1:** No lecture up front.
      *   **Constraint 2:** Do not use terms like "maximin," "difference principle," or "veil of ignorance" until the debrief.
      *   **Constraint 3:** Students must generate candidate principles, not choose from a menu.
      *   **Constraint 4:** Two rounds (Thin Veil/Known Odds vs. Thick Veil/Unknown Odds).
      *   **Constraint 5:** Post-choice assignment + Strains of Commitment check.
      *   **Constraint 6:** Predict failures/objections (refusal to play, "stacked deck" accusation) and limitations (lexical order, moral persons).
      *   **Time:** 75 minutes.
      *   **Class Size:** 16 students.

  2.  **Deconstruct the Activity Structure:**
      *   *Introduction (5 mins):* Set the scene without giving away the theory.
      *   *Round 1: The "Known Risk" Society (20 mins):* Establish a baseline where they know the odds. They should likely choose a maximizing principle (Utilitarianism).
      *   *Round 2: The "Unknown Risk" Society (20 mins):* Change the epistemic condition. They don't know the odds. They should shift toward protecting the bottom (Rawls).
      *   *The Reveal & Assignment (15 mins):* Assign roles based on Round 2 choices. Test "Strains of Commitment."
      *   *Debrief (15 mins):* Connect to Rawls, Maximin, VoI, DP.

  3.  **Drafting the Mechanics (Iterative Process):**

      *   *Idea 1: Money.* No real money, but points? Points feel gamified. Let's use "Life Units" (LUs) or "Social Primary Goods." Let's stick to "Wellbeing Points" (WPs).
      *   *Idea 2: Generating Principles.* If I ask them "What rule should we use?" they might freeze. I need to structure the *society* design.
      *   *Refinement:* Instead of abstract principles, have them design a *distribution scheme* for a fixed pool of resources across 5 social tiers.
      *   *Round 1 (Known):* Tell them the population distribution. E.g., 10% Top, 20% Mid-High, 40% Mid-Low, 30% Bottom. They know the odds of landing in each.
      *   *Round 2 (Unknown):* Tell them there are 5 tiers, but they have *no idea* what percentage of people are in each, or which one they will be.
      *   *Constraint Check:* The prompt says "build the candidate principles themselves rather than me handing them a menu."
      *   *Solution:* Give them a budget of "Social Wealth" to allocate across 5 positions.
      *   *Wait, a better way:* Have them choose a *multiplier* or a *floor*.
      *   *Best approach for "Generating Principles":* Give them a scenario: "You are designing the constitution of a new society. There are 5 economic classes (1=Poorest, 5=Richest). You have a total production capacity. How do you distribute income?"
      *   *Actually, to highlight the probability shift:*
          *   Round 1: "You know exactly how many people are in each class." (Encourages Average Utility).
          *   Round 2: "You know there are 5 classes, but you have no idea how many people are in each, or which one you'll be." (Encourages Maximin).
      *   *Wait, Rawls's point is about *probability* specifically.* If I know I have a 90% chance of being rich, I risk more. If I don't know the odds, I fear the worst.
      *   *Revised Mechanics:*
          *   Divide class into 4 groups of 4.
          *   Task: Agree on a "Distribution Rule" for a society of 100 people with 5 tiers.
          *   Round 1 Info: "Historical data shows: Tier 5 (10 people), Tier 4 (20), Tier 3 (40), Tier 2 (20), Tier 1 (10). You will be randomly assigned to one of the 100 spots." -> *Calculated Risk.*
          *   Round 2 Info: "There are 5 tiers. We have no data on population distribution. It could be 99 people in Tier 1. It could be 99 in Tier 5. You will be randomly assigned to one spot, but the odds are opaque." -> *Radical Uncertainty.*
          *   *Correction:* Rawls's Veil isn't just about population stats; it's about *your* specific talents/social position. But for a 75-min sim, population probability is the closest proxy for "odds of ending up poor."
          *   *Even Better:* Keep the total resources constant. Ask them to set the *income* for each of the 5 tiers.
          *   Round 1: You know the probability of landing in each tier.
          *   Round 2: You do not know the probability.
          *   *Wait, if they set the income, they need to know the constraints.* Let's simplify.
          *   *Simplification:* They choose between 3 pre-generated societies? No, prompt says "build the candidate principles themselves."
          *   *Okay, let's try this:* They draft a "Charter." The Charter must specify: "What is the minimum guarantee for the worst off?" and "How much inequality is allowed to boost the average?"
          *   *Actually, the most direct way to test Maximin vs. Expected Utility:*
          *   Give them a "Society Generator."
          *   Round 1: "You know the dice roll." (e.g., Roll a d20. 1-5 = Poor, 6-20 = Rich). They design the payoff for Poor vs. Rich.
          *   Round 2: "You don't know the dice." (Could be 1-19 = Poor). They design the payoff.
          *   *Group Work:* 4 groups of 4. Each group designs a society.
          *   *The Twist:* After they design, *one* student from each group is randomly assigned the "worst off" position in their own design. They must speak to whether they accept it.

      *   *Refining the "Principles" aspect:*
          *   Don't give them numbers. Give them a constraint: "Total Social Product = 1000 units."
          *   There are 5 Social Positions.
          *   Round 1: You know the probability of occupying each position (e.g., Pos 1: 10%, Pos 2: 20%... Pos 5: 10%).
          *   Round 2: You know there are 5 positions, but you have *no information* on the probability of occupying any specific one. (This mirrors the VoI's exclusion of probabilistic knowledge).
          *   Task: Allocate the 1000 units across the 5 positions.
          *   *Wait, if they allocate 1000 units, they might just make it equal.* I need to introduce an efficiency trade-off.
          *   *The Trade-off:* "Inequality drives production." If the gap between Pos 5 and Pos 1 is wider, the Total Social Product increases.
          *   *Okay, that's too complex for 75 mins.*
          *   *Let's stick to the Prompt's core:* Maximin relies on unknown odds.
          *   *Activity:* "The Life Lottery."
          *   Round 1 (Risk): You know the odds. 10% chance of destitution, 90% chance of comfort. Design the safety net.
          *   Round 2 (Uncertainty): You don't know the odds. Could be 99% destitution. Design the safety net.
          *   *How to make them generate principles?* Ask them to write a "Rule of Distribution."
          *   Example: "Maximize the average," "Ensure no one falls below X," "Maximize the minimum."
          *   *Okay, I have the structure.*

  4.  **Addressing Specific Constraints & Pitfalls:**
      *   *Refusal to Play:* Some might say "This is unethical." *Response:* Frame it as a thought experiment, low stakes. If they refuse, they sit out the assignment phase but must observe.
      *   *Stacked Deck:* "You made Round 2 scary so we picked Rawls." *Response:* Acknowledge this in debrief. That *is* Rawls's point about the original position.
      *   *Limitations:* Can't show Lexical Order (Liberty before Difference). Can't show "Moral Persons" (they will act self-interestedly).
      *   *Time Management:* 75 mins is tight. Need strict timers.

  5.  **Finalizing the Activity Flow:**
      *   **Setup (5 min):** Divide into 4 groups of 4. Hand out "Society Design Sheets."
      *   **Round 1 (15 min):** "The Known Risk." Give specific probabilities. Task: Allocate resources.
      *   **Round 2 (15 min):** "The Unknown." Remove probability info. Task: Re-allocate.
      *   **The Draw (10 min):** Randomly assign students to positions based on Round 2 designs.
      *   **Strains of Commitment (10 min):** Those in the bottom tier speak.
      *   **Debrief (20 min):** Connect to Rawls.

      *Wait, I need to ensure they generate principles, not just numbers.*
      *   *Adjustment:* Instead of allocating specific numbers, ask them to write a **Constitutional Clause** regarding distribution.
      *   *Prompt:* "Write one sentence that dictates how wealth is distributed in this society."
      *   *Round 1 Info:* "10% will be destitute, 90% wealthy."
      *   *Round 2 Info:* "We do not know the proportions."
      *   *This is better.* It forces abstract principle generation.

      *Wait, the "Strains of Commitment" needs concrete outcomes.*
      *   If they write abstract clauses, I can't assign them to positions easily.
      *   *Hybrid:* They write the principle, *and* I (the instructor) translate that into a quick distribution for the "Draw."
      *   *Or:* Give them 3 specific trade-off scenarios they must vote on to build their principle.
      *   *Let's go with the "Society Budget" approach.* It's more tangible.
      *   *Total Wealth:* 500 Points.
      *   *5 Classes.*
      *   *Round 1:* You know the % of people in each class.
      *   *Round 2:* You don't know the %.
      *   *Incentive:* If you allow a bigger gap between Class 1 and 5, the Total Wealth increases (Incentive Argument).
      *   *Okay, that's the "Difference Principle" mechanic.*
      *   *Let's simplify for time:*
      *   Round 1: Known Odds.
      *   Round 2: Unknown Odds.
      *   Task: Set the "Floor" (Minimum) and the "Ceiling" (Maximum).
      *   Constraint: Higher Ceiling = Higher Total Pot (to simulate incentives).
      *   This might be too math-heavy.
      *   *Back to basics:* Just ask them to distribute 100 tokens across 5 slots.
      *   Round 1: Slot 1 has 10 people, Slot 5 has 10 people (Equal dist).
      *   Round 2: You don't know how many people are in each slot.
      *   *Wait, Rawls isn't about population stats, it's about **your** chance of being in a slot.*
      *   *Okay, Final Plan:*
      *   Groups of 4.
      *   Task: Decide on a "Distribution Rule."
      *   Round 1: "You have a 1 in 10 chance of being in the Bottom Tier."
      *   Round 2: "You have no idea what your chance is of being in the Bottom Tier."
      *   They write the rule.
      *   Then I simulate the outcome based on their rule.
      *   Then I assign roles.

      *Wait, I need to make sure the "Strains of Commitment" lands.*
      *   If they pick a Rawlsian rule in Round 2, the bottom tier won't be *that* bad.
      *   If they pick a Utilitarian rule, the bottom tier might be terrible.
      *   *Crucial:* I need to ensure that if they play Utilitarian in Round 2, someone suffers.
      *   *Idea:* I will act as the "Reality Engine." Based on their rule, I assign the "Life Outcome."
      *   If they chose "Maximize Average," I assign 3 students to "Poverty" and 1 to "Wealth."
      *   If they chose "Protect the Minimum," I assign 1 to "Poverty" (less severe) and 3 to "Comfort."
      *   *Actually, the assignment should be random to simulate the veil lifting.*
      *   So: They pick the rule. I roll dice to assign their position *under that rule*.
      *   Then they feel the "Strain."

  6.  **Developing the Debrief:**
      *   Map Round 1 -> Expected Utility (Risk).
      *   Map Round 2 -> Maximin (Uncertainty).
      *   Map Assignment -> Strains of Commitment.
      *   Map "No renegotiation" -> Finality of Justice.
      *   Address Limitations: Moral psychology, Liberty priority.

  7.  **Addressing the "Stacked Deck" Objection:**
      *   This is crucial. Students will say "Of course we played safe in Round 2, you made it scary."
      *   *Counter:* Rawls argues the *moral* situation IS scary. We shouldn't gamble with basic rights/liberties. The "stacking" is the feature, not the bug. It forces us to take the worst-off seriously.

  8.  **Addressing the "Refusal to Play":**
      *   If a group refuses Round 2, ask them to observe. In debrief, ask them *why*. Their refusal might actually be a "Strain of Commitment" objection in real-time! (i.e., "This game is unjust").

  9.  **Timing Check:**
      *   Intro: 5
      *   Round 1: 15
      *   Round 2: 15
      *   Assignment/Strains: 15
      *   Debrief: 25
      *   Total: 75. Perfect.

  10. **Refining the "Principles" Generation:**
      *   To ensure they don't just pick numbers, give them a worksheet with prompts: "What is the minimum guaranteed outcome?" "Is inequality permitted? If so, under what condition?"
      *   This forces them to articulate the *logic*, not just the math.

  11. **Final Polish:**
      *   Make sure the instructions are crystal clear so I don't have to lecture.
      *   Prepare the "Reality Cards" for the assignment phase.
      *   Ensure the "Unknown Odds" in Round 2 feels genuinely unsettling.

      *(Self-Correction during drafting)*: I need to be careful about the "Known Odds" in Round 1. If I say "10% chance of poverty," they might still play Maximin if they are risk-averse. I need to make the odds favorable enough that Expected Utility *should* dominate. Let's make it 20% chance of poverty, 80% wealth. And in Round 2, emphasize "Could be 99% poverty."
      *Actually, Rawls argues that even with known odds, if the stakes are fundamental (basic liberties), you don't gamble. But for this sim, we are focusing on the epistemic condition.*
      *Let's stick to the prompt's insight:* "Maximin is only rational... because they don't know the odds." So Round 1 MUST have known odds that encourage risk-taking. Round 2 MUST have unknown odds that encourage risk-aversion.

      *Wait, one more thing:* The prompt says "Whoever lands badly off has to say whether they can still affirm the scheme."
      *   I need to make sure the "Badly Off" outcome is tangible (e.g., they have to stand in the corner, or they get a "F" on the activity grade? No, no grades. Maybe they lose a privilege, like choosing the break time? Or just symbolic "Life Points".)
      *   Let's use "Course Credit Points" (bonus points)? No, too high stakes.
      *   Let's use "Chocolate" or "Privilege."
      *   Better: "Social Standing." The "Bottom Tier" has to clean up the whiteboards or stack the chairs. The "Top Tier" gets to leave 2 mins early.
      *   *Actually, keep it symbolic but serious.* "Life Outcome Cards." Some say "Secure & Prosperous," some say "Precarious & Struggling." The "Struggling" students must explain if they accept the rules that led them there.

      *Okay, ready to write.*
answer: |-
  Here is a complete design for a 75-minute seminar activity. It is structured to minimize your talking time and maximize student friction with the material.

  ### Activity Title: "The Constitution of Chance"

  **Class Size:** 16 Undergraduates
  **Time:** 75 Minutes
  **Materials:** 4 Packets (one per group), 1 Deck of "Life Outcome" Cards (prepared by you), Whiteboard.

  ---

  ### Part 1: Setup & Grouping (5 Minutes)
  **Action:** As students enter, hand them a number (1–4) to sort them into four groups of four. Place a "Society Design Packet" on each table.

  **Instructor Script (Read only):**
  > "Today you are not students. You are Founders. Your task is to design the economic constitution for a society you will all inhabit. You will do this twice.
  >
  > In your packet, you have a 'Resource Budget.' You must decide how to distribute social primary goods (income, rights, opportunities) across five social tiers. Tier 1 is the least advantaged; Tier 5 is the most advantaged.
  >
  > **Rule 1:** You must reach consensus within your group.
  > **Rule 2:** Once you submit your design, you cannot change it.
  > **Rule 3:** At the end of class, I will assign you to a specific Tier in the society you designed. You must live with that assignment.
  >
  > Do not turn the page until I tell you."

  ---

  ### Part 2: Round 1 – The Known Risk (15 Minutes)
  **The Epistemic Condition:** Students know the probabilities. This is designed to trigger **Expected Utility** reasoning (Utilitarianism).

  **Instructor Script:**
  > "Turn to Round 1. You are designing a society where historical data is perfect. You know exactly how many people end up in each Tier.
  >
  > **The Odds:**
  > *   Tier 5 (Wealthiest): 20% chance
  > *   Tier 4: 20% chance
  > *   Tier 3: 20% chance
  > *   Tier 2: 20% chance
  > *   Tier 1 (Poorest): 20% chance
  >
  > You have an equal 1 in 5 chance of landing in any Tier. Design your distribution. You may prioritize the average, the total, or the minimum. Justify your choice in the packet."

  **The Packet Prompt:**
  1.  Allocate 100 "Wellbeing Points" across the 5 Tiers. (Sum must = 100).
  2.  Write one sentence explaining *why* you distributed them this way.

  **What to expect:** Most groups will maximize the average. They will likely starve Tier 1 to boost Tiers 3–5, reasoning that "I have an 80% chance of not being in Tier 1, so I'll take the risk."

  ---

  ### Part 3: Round 2 – The Unknown Risk (20 Minutes)
  **The Epistemic Condition:** Students do *not* know the probabilities. This is designed to trigger **Maximin** reasoning (Rawls).

  **Instructor Script:**
  > "Destroy your Round 1 draft. We are resetting.
  >
  > Turn to Round 2. The historical data has been lost. You know there are 5 Tiers, but you have **no information** on the population distribution.
  >
  > **The Odds:** Unknown.
  > It is possible 99% of people are in Tier 1. It is possible 99% are in Tier 5. You have no basis for calculation.
  >
  > Design your distribution again. Allocate 100 Wellbeing Points. Write your justification."

  **The Twist (Incentive Structure):**
  *Add this note to the Round 2 Packet:*
  > "Note: Extreme inequality (giving Tier 5 significantly more than Tier 1) *might* increase the total social product, but it *might* also cause social collapse. Without data, you cannot know which."

  **What to expect:** Groups will likely flatten the distribution. They will raise the floor (Tier 1) significantly, even if it lowers the ceiling (Tier 5), because they cannot rule out the possibility that *everyone* (including them) is in Tier 1.

  ---

  ### Part 4: The Assignment & Strains of Commitment (15 Minutes)
  **The Mechanism:** You enforce the "Strains of Commitment" by making the outcome real and binding.

  **Action:** Collect the Round 2 Packets. Tell them you will use *one* group's design for the whole class (pick the most average-utilitarian one if possible, or the most Rawlsian one, depending on what you want to test. *Recommendation: Pick the one with the lowest Tier 1 score to maximize tension.*)

  **Instructor Script:**
  > "I am selecting Group 3's constitution for this class.
  >
  > Now, the Veil lifts. I will assign you your Tier."

  **The Assignment:**
  Hand out sealed envelopes (prepared beforehand).
  *   3 Envelopes say: **Tier 5** (Privilege: You get to pack up your bag 5 minutes early / You get a piece of premium chocolate).
  *   3 Envelopes say: **Tier 3** (Neutral).
  *   10 Envelopes say: **Tier 1** (Burden: You must stay 5 minutes late to stack chairs / You get a stale cracker / You get a "Life Outcome" card that says "Precarious: You struggle to access basic healthcare").

  *Note: Rig the odds so the majority land in the worst-off position if the group chose a Utilitarian scheme. If they chose a Rawlsian scheme, make the Tier 1 burden lighter.*

  **The Strains Check:**
  Ask the students assigned to **Tier 1** to stand.
  **Instructor Script:**
  > "You designed these rules. You agreed to them under the condition that you could not renegotiate later. Looking at your outcome: Do you affirm this scheme? Can you sincerely say this is just, even though you lost the lottery? You cannot change the rules now."

  Allow 3-4 minutes for the "losers" to speak. This is the emotional core.

  ---

  ### Part 5: The Debrief (20 Minutes)
  **Goal:** Map their experience to Rawls's terminology without having used it yet.

  **1. The Shift (Maximin vs. Expected Utility)**
  *   **Ask:** "Why did your Round 2 allocation look different from Round 1?"
  *   **Listen for:** "We didn't know the odds," "It was too risky," "We couldn't calculate."
  *   **Lecture (Now you speak):** "In Round 1, you used **Expected Utility**. You gambled because you knew the risk. In Round 2, you used **Maximin**. You maximized the minimum position because the uncertainty was radical. Rawls argues the **Veil of Ignorance** must be thick enough to block probability knowledge. If you know the odds, you gamble with people's lives. If you don't, you protect the bottom."

  **2. The Strains of Commitment**
  *   **Ask:** "To the Tier 1s: Was it harder to accept the outcome because you knew you helped write the rules?"
  *   **Lecture:** "This is the **Strains of Commitment**. A conception of justice must be stable. If the people at the bottom cannot affirm the system without resentment, the system is unstable. Rawls argues Utilitarianism fails this test because it asks the poor to sacrifice for the greater good. The Difference Principle passes because it guarantees the poor gain from any inequality."

  **3. Handling Objections (Predictable Failures)**

  *   **Objection A: "You stacked the deck."**
      *   *Student:* "Round 2 was scary on purpose. Of course we played safe."
      *   *Response:* "Exactly. Rawls thinks the *moral situation* IS scary. We are bargaining over basic rights and life chances. He argues it is irrational to gamble with your fundamental liberties even if the odds look good. The 'stacking' is the argument: justice shouldn't be a gamble."

  *   **Objection B: "We refused to play Round 2."** (If a group stalls or opts out)
      *   *Response:* "That refusal is actually a Rawlsian insight. If a scheme feels too unjust to even simulate, that is a **Strain of Commitment** violation in real-time. Why did it feel unethical? Because it lacked a safety net?"

  *   **Objection C: "This ignores talent/effort."**
      *   *Response:* "Rawls says talents are morally arbitrary. You didn't earn your IQ or your parents' wealth. In the Veil, you don't know if you're talented. So you can't design a society that rewards talent exclusively, because you might end up untalented."

  **4. Limitations (Be Honest)**
  *   **Tell them:** "This activity failed to show two things.
      1.  **Lexical Order:** Rawls says Liberty comes *before* Economics. You can't trade free speech for GDP. In this game, you only traded Points.
      2.  **Moral Persons:** You acted as self-interested bargainers. Rawls says the parties in the Original Position represent 'moral persons' with a sense of justice. They aren't just greedy; they want to affirm their own goodness. You were just trying to win."

  ---

  ### Predictable Pitfalls & Mitigation

  **1. The "Griefers" (Students trying to break the sim)**
  *   *Risk:* A group intentionally makes Tier 1 miserable in Round 2 to see what happens.
  *   *Mitigation:* In the debrief, isolate them. "Group 2 chose to maximize risk under uncertainty. Does anyone else find that irrational? Why?" Turn their deviance into a data point about risk aversion.

  **2. The "Utilitarian Holdouts"**
  *   *Risk:* Students argue that maximizing the average is still better in Round 2.
  *   *Mitigation:* Press them on the "99% poverty" possibility. "If there is a 1% chance the entire society collapses into Tier 1, is the average utility worth it?" This forces the Maximin logic.

  **3. Time Creep**
  *   *Risk:* The "Strains" discussion runs long.
  *   *Mitigation:* Use a visible timer. Cut the Tier 1 discussion hard at 15 minutes past the hour to ensure you get to the theoretical mapping.

  **4. The "Real Money" Question**
  *   *Risk:* Students ask if the points matter.
  *   *Mitigation:* Be clear: "The stakes are symbolic, but the *commitment* is real. You agreed to the rules. The point is whether you can *affirm* the outcome, not whether you lost a candy bar."

  ### What This Activity Cannot Do (Manage Expectations)
  1.  **Derive the Two Principles:** It won't prove *why* Liberty must be first. It only illustrates the economic difference principle.
  2.  **Moral Psychology:** It treats students as rational egoists. It doesn't capture Rawls's idea that we *want* to be just.
  3.  **The "Original Position" vs. "Veil":** Students will conflate the two. (The Original Position is the setup; the Veil is the information constraint). You will need to clarify this distinction in the debrief.

  ### Instructor Prep Checklist
  *   [ ] 4 Packets (Round 1 & 2 worksheets).
  *   [ ] 16 Envelopes (Pre-assigned Tiers based on the likely outcome you want to test).
  *   [ ] "Burden" items (Stale crackers, trash bags for cleanup, etc.).
  *   [ ] Timer visible to the class.
  *   [ ] Whiteboard space reserved for "Round 1 vs. Round 2" comparison.

  This design forces them to *inhabit* the epistemic shift. They won't just hear that uncertainty changes rationality; they will feel their pulse quicken in Round 2 and see their own handwriting change on the worksheet. That is the feeling of the Veil.
