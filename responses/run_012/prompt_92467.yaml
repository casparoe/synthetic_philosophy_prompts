prompt: |-
  I am the registrar and collections manager for a maritime heritage nonprofit. We operate a historic vessel as a floating museum, and our holdings also include salvaged components, period models, and one full-scale reconstruction built to the original plans. The problem I keep running into is identity over time, and I need someone to turn it into a procedure I can actually run.

  Decisions of this kind come up roughly a dozen times a year, and they carry real consequences. Whether an object counts as "the same object" determines what may be loaned under agreements that promise the lender the original, how the object is valued and insured, whether grant conditions requiring the display of the original are met, whether a treatment counts as conservation or as replacement, and whether we would ever need to consider deaccession. The board recently adopted a one-sentence policy — that an object's identity is carried by the unbroken causal chain of its making, use, and care, not by the proportion of original material it retains — and that policy now sits uneasily beside an older clause in our loan template that ties "the original" to majority original fabric. I have no philosophy training, I have an hour at most per decision, and anything I decide has to be defensible in writing and signed off by the curator, with the board reserving deaccession. Assume I know nothing of the academic literature and cannot look anything up.

  Please write me the procedure. I want the questions asked in order, what counts as a sufficient answer to each, where the procedure stops with a flat no, and — importantly — where it must hand the decision back to a person because the question is one of purpose or convention rather than fact. Two things I want built in. First, the procedure should force me to name the kind of thing I am tracking the object as — vessel, exhibit, insured asset, memorial, archaeological find — and to say whether the identity question even has the same answer under different kinds, or whether I am quietly asking several different questions under one word. Second, it should handle the case where removed original parts turn up again and are reassembled into a second whole, so that I could be facing two candidate originals rather than one. I would also like a test that distinguishes a change *in* the object from a change *of* the object, since that is the distinction I can never hold onto at the moment of decision.

  Then run it on three cases. First, our flagship: over sixty years its planking and frames have been progressively replaced, and roughly a third of the material is now original, but the name, hull number, maintenance log, and chain of custody are unbroken. Second, the reassembly case: the original timbers removed during a 1970s restoration were later built into a second hull that is now offered to us as "the original" for a loan. Third, a vessel of ours that burned and was rebuilt from the original plans with no surviving original material, which a grant condition requires us to display as the original.

  Include at least one case where your procedure gives an answer I will not like — one where it tells me the loan clause is satisfied by something I would never call the original, or that a condition I have promised to meet cannot be met. And be explicit about what the procedure cannot do: where it will misfire, which of its steps are judgments about what we care about dressed up as procedure, and which questions it cannot answer at all. Please answer in American English.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**

      *   **Role:** Registrar and Collections Manager for a maritime heritage nonprofit.
      *   **Context:** Operates a historic vessel (floating museum), holds salvaged components, models, and one full-scale reconstruction.
      *   **Problem:** "Identity over time" (When is an object still "the same" object?). This affects loans, insurance, grants, conservation vs. replacement, and deaccessioning.
      *   **Constraints:**
          *   Board Policy: Identity = unbroken causal chain of making, use, care (NOT majority original material).
          *   Conflict: Loan template ties "the original" to majority original fabric.
          *   Time Limit: ~1 hour per decision.
          *   Expertise: No philosophy training, cannot look up academic literature.
          *   Output Needs: Defensible in writing, signed by Curator, Board reserves deaccession.
          *   Specific Requirements:
              *   Order of questions.
              *   Sufficient answers.
              *   Stop points (Flat No).
              *   Hand-off points (Human judgment/purpose/convention).
              *   Force naming the "kind of thing" (vessel, exhibit, asset, etc.) and check for conflicting definitions.
              *   Handle "reassembly case" (two candidate originals).
              *   Distinguish change *in* vs. change *of* the object.
              *   Run on three specific cases (Flagship, Reassembly, Burned/Rebuilt).
              *   Include an "unliked answer" (procedure contradicts intuition or contract).
              *   Explicit limitations section (where it misfires, disguised judgments, unanswerable questions).
      *   **Tone/Style:** American English, practical, procedural, defensible.

  2.  **Deconstruct the Core Conflict:**

      *   *Board Policy:* Continuity of history/process (Causal Chain).
      *   *Loan Template:* Continuity of matter (Majority Fabric).
      *   *Reality:* Objects change. Parts get swapped. Reconstructions happen.
      *   *Goal:* A workflow that bridges the gap between high-level policy and on-the-ground paperwork without requiring a PhD in metaphysics.

  3.  **Drafting the Procedure (The "Identity Verification Protocol"):**

      *   *Step 1: Define the Lens.* The prompt asks to force naming the "kind of thing." This is crucial. A vessel as a *legal entity* (documented vessel) is different from a vessel as an *artifact* (museum object).
      *   *Step 2: The Causal Chain Check (Board Policy).* Verify the paperwork/logbooks.
      *   *Step 3: The Material Check (Loan Template).* Calculate percentages.
      *   *Step 4: The "In" vs. "Of" Test.* This needs a practical heuristic. Change *in* = maintenance/repair (identity holds). Change *of* = destruction/recreation (identity breaks).
      *   *Step 5: The Split Identity (Reassembly).* What if parts come back?
      *   *Step 6: The Hand-off.* Where does the registrar stop and the curator/board start?

      *Refining the "In vs. Of" Test:* How to make this practical?
      *   *Idea:* Intent. Was the intent to preserve the function/identity, or to create a new one?
      *   *Idea:* Continuity of Existence. Was there a moment where the object ceased to function or exist as itself?
      *   *Decision:* Use a "Functional Continuity" check. Did it stop being a vessel/exhibit and become raw material?

      *Refining the "Kind of Thing":*
      *   Need to explicitly ask: Are we talking about the *Legal Vessel*, the *Historical Artifact*, or the *Exhibit Prop*? The answer might differ.

  4.  **Developing the Three Cases:**

      *   *Case 1: The Flagship (Theseus's Ship).* 60 years, 1/3 original material, unbroken log.
          *   *Procedure Outcome:* Passes Board Policy (Causal Chain). Fails Loan Template (Majority Fabric).
          *   *Conflict:* This is the "unliked answer" territory. The procedure must highlight the conflict.
      *   *Case 2: The Reassembly (Two Originals).* Original timbers removed, built into Hull B. Hull A (current) is mostly new. Hull B is offered as "original."
          *   *Procedure Outcome:* Hull A has the Chain. Hull B has the Material.
          *   *Conflict:* Two candidates. Procedure must flag this for human decision (Curator/Board).
      *   *Case 3: The Burned/Rebuilt.* Fire, no original material, rebuilt to plans. Grant requires "original."
          *   *Procedure Outcome:* Chain broken by destruction (Fire). Material is 0%.
          *   *Conflict:* Grant condition cannot be met. This is the "hard no" the user asked for.

  5.  **Addressing the Limitations:**

      *   Must admit that "Identity" is ultimately a social construct, not a physical fact.
      *   Must admit the procedure doesn't solve the contract conflict (Board vs. Loan Template).
      *   Must admit the "In vs. Of" distinction relies on intent, which is subjective.

  6.  **Writing - Section by Section (Iterative refinement):**

      *   *Introduction:* Acknowledge the tension. Set the stage.
      *   *The Protocol:* Numbered steps. Clear "Stop" and "Hand-off" markers.
      *   *The "Kind of Thing" Matrix:* A specific table or section to force the distinction.
      *   *The "In vs. Of" Heuristic:* Make it a checklist.
      *   *Case Studies:* Apply the protocol strictly.
      *   *The "Unliked Answer":* Ensure Case 3 or the Loan Clause conflict in Case 1 is highlighted as a failure of the *situation*, exposed by the *procedure*.
      *   *Limitations:* Be honest about the metaphysics hiding in the admin work.

  7.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is the "In vs. Of" test too vague?
      *   *Fix:* Make it about *interruption of function*. If the vessel was stripped to the keel and sat for 10 years, is it the same? If it was towed to a shed and rebuilt immediately? Let's use "Operational Continuity" as the proxy.
      *   *Critique:* Did I handle the "Two Candidates" requirement?
      *   *Fix:* Ensure Step 5 specifically addresses the "Split Chain."
      *   *Critique:* Is the tone right?
      *   *Fix:* Keep it bureaucratic but clear. No jargon like "diachronic identity." Use "Paper Trail" and "Physical Fabric."
      *   *Critique:* Did I address the Loan Template conflict?
      *   *Fix:* The procedure must explicitly flag when Board Policy and Loan Terms diverge. It can't solve it, but it must expose it.

  8.  **Final Polish:** Check against all constraints in the prompt.
      *   American English? Yes.
      *   One hour per decision? Keep steps concise.
      *   Defensible in writing? Yes, creates a paper trail.
      *   Curator sign-off/Board deaccession? Included in hand-off steps.
      *   Unliked answer included? Yes (Case 3).
      *   Limitations section? Yes.

  9.  *(Self-Correction on Case 1)*: The prompt asks for an answer I won't like. Case 1 is the classic "Ship of Theseus." Under Board Policy, it *is* the original. Under Loan Template, it *is not*. The procedure should force me to admit the Loan Template is violated. That's the unliked part (I want to loan it as original, procedure says "Check the box: No").
      *(Self-Correction on Case 3)*: This is stronger. The grant says "Display Original." Procedure says "Not Original." I have to tell the grantor I lied or can't comply. That's a very unliked answer. I will use Case 3 for the hard "No."

  10. **Finalizing the "In vs. Of" distinction:**
      *   Change *IN*: Repair, maintenance, replacement of wear items. (Identity holds).
      *   Change *OF*: Destruction, loss of function, intentional recreation. (Identity breaks).
      *   *Test:* "The Pause Test." If the object stopped being itself for a period (e.g., a pile of lumber), it's a change *of*.

  11. **Drafting the Content.** (Proceeding to generate output based on these thoughts).

      *   *Structure:*
          1.  Title & Purpose.
          2.  Pre-Step: Define the "Kind."
          3.  The 5-Step Protocol.
          4.  Application to Cases.
          5.  Limitations & Warnings.

      *   *Key Phrase to include:* "Causal Chain" vs. "Material Majority."
      *   *Key Mechanism:* The "Split Decision" log.

      *(Final check on constraints)*: "Assume I know nothing of the academic literature." -> Keep language plain. "One hour at most." -> Keep steps actionable.

      *Let's write.*
answer: |-
  # PROCEDURE: OBJECT IDENTITY VERIFICATION PROTOCOL (OIVP)
  **Effective Date:** Immediate
  **Authority:** Board Policy on Collections Identity (Causal Chain)
  **Conflict Note:** This procedure highlights conflicts between Board Policy and external Loan/Grant templates regarding "Original Fabric." It does not resolve legal contract disputes; it exposes them for Curator/Board action.
  **Time Allocation:** 60 Minutes Maximum

  ## PART 1: DEFINE THE LENS (5 Minutes)
  *Identity is not a physical fact; it is a category we assign. You cannot answer "Is this the same object?" until you answer "What kind of object are we tracking?"*

  **Step 1.1: Select the Primary Designation**
  Check **ONE** box that represents the primary purpose of this identity decision.
  *   [ ] **Legal Vessel:** Tracked by documentation, hull number, title, and registry. (Focus: Chain of Custody)
  *   [ ] **Historical Artifact:** Tracked by physical material and provenance. (Focus: Original Fabric)
  *   [ ] **Exhibit/Interpretive Prop:** Tracked by visual accuracy and narrative function. (Focus: Appearance/Plans)
  *   [ ] **Insured Asset:** Tracked by replacement value and risk. (Focus: Financial Value)
  *   [ ] **Memorial:** Tracked by association with events/persons. (Focus: Continuity of Memory)

  **Step 1.2: Check for Conflicting Lenses**
  Does the request (Loan, Grant, Insurance) require a *different* designation than the one selected above?
  *   *Example:* You are tracking it as a **Legal Vessel**, but the Loan Agreement requires it to be a **Historical Artifact**.
  *   **Action:** If **YES**, stop. You have identified a contract conflict. Proceed to **Step 5 (Hand-Off)** immediately. Do not attempt to reconcile this yourself.
  *   **Action:** If **NO**, proceed to Step 2.

  ---

  ## PART 2: THE CAUSAL CHAIN CHECK (15 Minutes)
  *This step tests the Board Policy: Identity is carried by the unbroken chain of making, use, and care.*

  **Step 2.1: Documentation Continuity**
  Is there an unbroken paper trail (logbooks, registration, accession records) linking the object in front of you to the object at the moment of acquisition/making?
  *   **Sufficient Answer:** Yes, gaps are less than 6 months and explained by maintenance/transit.
  *   **Insufficient Answer:** No, or gaps exceed 6 months without explanation.
  *   **Result:** If **Insufficient**, Identity = **BROKEN**. Stop. (Flat No).

  **Step 2.2: Functional Continuity (The "Pause" Test)**
  Did the object cease to function as its designated type for a period significant enough to become "raw material" rather than "an object in repair"?
  *   *Question:* Was there a period where this was not a vessel/exhibit, but a pile of parts?
  *   **Sufficient Answer:** No. It was always treated as a single entity, even when hauled out.
  *   **Insufficient Answer:** Yes. It was dismantled, stored as lumber/components, and later reassembled.
  *   **Result:** If **Insufficient**, Identity = **BROKEN**. Stop. (Flat No).

  **Step 2.3: Intent of Care**
  Were changes made to *preserve* the existing object, or to *create* a new one based on the old?
  *   **Sufficient Answer:** Preservation/Repair. (Change *IN* the object).
  *   **Insufficient Answer:** Reconstruction/Replication after loss. (Change *OF* the object).
  *   **Result:** If **Insufficient**, Identity = **BROKEN**. Stop. (Flat No).

  *If Steps 2.1, 2.2, and 2.3 are PASSED, the object satisfies the Board Policy for "Original."*

  ---

  ## PART 3: THE MATERIAL CHECK (15 Minutes)
  *This step tests external Loan/Grant templates requiring "Majority Original Fabric."*

  **Step 3.1: Estimate Original Fabric**
  Based on the most recent survey, what percentage of the significant structural material is original to the date of making?
  *   **Sufficient Answer:** >50% (Majority).
  *   **Insufficient Answer:** <50% (Minority).
  *   **Result:** Record the percentage. Do not Stop. This is data, not a decision.

  **Step 3.2: Compare to Requirement**
  Does the external agreement (Loan/Grant) specify a material threshold?
  *   **If No:** Proceed to Step 4.
  *   **If Yes:** Compare Step 3.1 result to the requirement.
  *   **Result:** If the object fails the material threshold but passed the Causal Chain (Part 2), you have a **POLICY CONFLICT**. Proceed to Step 5.

  ---

  ## PART 4: THE SPLIT IDENTITY CHECK (10 Minutes)
  *Use this step only if original components were removed and survive elsewhere.*

  **Step 4.1: Identify Competitors**
  Are there significant original components (e.g., timbers, engine) that were removed from this object and assembled into a *second* whole?
  *   **If No:** Proceed to Step 5.
  *   **If Yes:** You have two candidate "Originals."
      *   Candidate A: The vessel with the Causal Chain (Logbooks/Name).
      *   Candidate B: The vessel with the Original Material (Timbers).

  **Step 4.2: Assess the Claim**
  Which candidate is being claimed as "The Original" for this decision?
  *   **Action:** Record both candidates.
  *   **Result:** This procedure **cannot** decide between two valid candidates. This is a curatorial judgment. Proceed immediately to Step 5.

  ---

  ## PART 5: HAND-OFF AND DOCUMENTATION (15 Minutes)
  *The Registrar identifies the facts; the Curator/Board decides the consequence.*

  **Step 5.1: Complete the Identity Statement**
  Fill in the blanks for the file record:
  *   **Designation:** (From Step 1.1) _______________
  *   **Causal Chain Status:** (Intact / Broken)
  *   **Material Status:** (____% Original)
  *   **Conflicts:** (None / Policy vs. Contract / Split Identity)

  **Step 5.2: Determine Signatory Authority**
  *   **If Causal Chain is Intact AND No Conflicts:** Registrar signs. Decision stands.
  *   **If Causal Chain is Broken:** Registrar signs "Not Original." Decision stands.
  *   **If Policy vs. Contract Conflict:** Curator must sign. Board must be notified.
  *   **If Split Identity:** Curator must sign. Board must be notified (potential deaccession/acquisition issue).

  **Step 5.3: Final Output**
  Attach this worksheet to the Loan/Grant/Insurance file. File copy retained in Permanent Records.

  ***

  # APPLICATION TO CASES

  Here is how the procedure runs on your three specific scenarios.

  ### CASE 1: The Flagship (The Ship of Theseus)
  *   **Facts:** 60 years old. 33% original material. Unbroken name, hull number, logs, custody.
  *   **Step 1 (Lens):** Designation = **Legal Vessel** (for registration) AND **Historical Artifact** (for museum).
      *   *Conflict Check:* Loan Agreement requires "Historical Artifact" definition (Majority Fabric). Board Policy requires "Legal Vessel" definition (Causal Chain). **CONFLICT FLAGGED.**
  *   **Step 2 (Chain):**
      *   2.1 Docs: Intact. (PASS)
      *   2.2 Pause: Never dismantled to raw material. (PASS)
      *   2.3 Intent: Progressive replacement for preservation. (PASS)
      *   *Board Policy Result:* **ORIGINAL.**
  *   **Step 3 (Material):**
      *   3.1 Estimate: 33%. (FAILS Majority Threshold).
      *   3.2 Requirement: Loan template requires "Original" = Majority Fabric.
      *   *Contract Result:* **NOT ORIGINAL.**
  *   **Step 5 (Hand-Off):**
      *   **Output:** The procedure forces you to write: *"Object satisfies Board Policy for Identity (Causal Chain Intact) but fails Loan Template Requirement (Material <50%)."*
      *   **Sign-off:** Curator must sign.
      *   **The Unliked Answer:** You cannot sign the loan form as "Original" without qualifying it. If the loan form has a checkbox for "Is this the original historic fabric?" you must check **NO**. The procedure prevents you from lying to the lender, even though the Board says it's the same ship. You have to tell the lender: "It is the historic vessel, but not the historic fabric." They may reject the loan.

  ### CASE 2: The Reassembly (Two Candidates)
  *   **Facts:** Original timbers removed in 1970s, built into Hull B. Hull A (current possession) is mostly new. Hull B offered as "Original."
  *   **Step 1 (Lens):** Designation = **Historical Artifact**.
  *   **Step 2 (Chain):**
      *   **Hull A:** Docs Intact. Pause Test Passed (never ceased to be a vessel). Intent = Preservation. -> **Chain Intact.**
      *   **Hull B:** Docs Disconnected (new build). Pause Test Failed (timbers were raw material/storage). Intent = Reconstruction. -> **Chain Broken.**
  *   **Step 4 (Split Identity):**
      *   **Competitors:** Yes. Hull A (Chain) vs. Hull B (Material).
      *   **Claim:** Lender offers Hull B as "Original."
  *   **Step 5 (Hand-Off):**
      *   **Output:** *"Split Identity Detected. Candidate A holds Causal Chain. Candidate B holds Original Fabric."*
      *   **Sign-off:** **Board Notification Required.**
      *   **Reasoning:** The procedure identifies that Hull B is *not* the original vessel under Board Policy (Chain Broken), even if it is made of the original wood. However, because there are two candidates, this risks deaccession implications (do we want Hull B instead?). The Registrar cannot decide which "Original" matters more. The Curator must decide if "Wood" or "History" defines the collection.

  ### CASE 3: The Burned/Rebuilt (The Grant Condition)
  *   **Facts:** Vessel burned. No surviving original material. Rebuilt from plans. Grant requires display of "The Original."
  *   **Step 1 (Lens):** Designation = **Exhibit/Interpretive Prop**.
      *   *Conflict Check:* Grant requires **Historical Artifact**. **CONFLICT FLAGGED.**
  *   **Step 2 (Chain):**
      *   2.1 Docs: Chain broken by destruction (Fire).
      *   2.2 Pause: **FAILED.** The vessel ceased to exist; it became wreckage/scrap.
      *   2.3 Intent: **FAILED.** This is a Reconstruction (Change *OF* the object), not Repair (Change *IN* the object).
      *   *Board Policy Result:* **NOT ORIGINAL.**
  *   **Step 3 (Material):**
      *   3.1 Estimate: 0%.
      *   *Contract Result:* **NOT ORIGINAL.**
  *   **Step 5 (Hand-Off):**
      *   **Output:** *"Object is a Reconstruction. Causal Chain Broken by Destruction. Material 0%."*
      *   **Sign-off:** Curator must sign. Board must be notified.
      *   **The Hard No:** The procedure dictates you **cannot** meet the grant condition. You must inform the grantor that the object on display is a *reconstruction*, not the *original*. If the grant funding is contingent on displaying the original, you are in breach of contract. The procedure does not allow you to fudge this. It forces the organization to admit the condition cannot be met.

  ***

  # LIMITATIONS AND WARNINGS

  **1. Where the Procedure Misfires**
  This procedure treats "Identity" as a binary switch (Intact/Broken). In reality, identity is a gradient. A vessel that burns but saves the keel might feel "more original" than one that rots and gets replaced plank by plank. This procedure cannot measure "degrees of soul." It will classify a burned hull with 5% original salvage the same as a burned hull with 0% salvage (Chain Broken). If you need nuance there, you must escalate to the Curator.

  **2. Disguised Judgments**
  Step 2.2 (The "Pause" Test) looks like a fact check, but it is a judgment about *what we care about*.
  *   *Example:* If a vessel is hauled out for 5 years for restoration, is it "raw material" or "a vessel in repair"?
  *   *The Trap:* If you decide 5 years is "raw material," you break the chain. If you decide it's "repair," you keep it.
  *   *The Fix:* The procedure sets a 6-month guideline in Step 2.1, but Step 2.2 relies on your interpretation of "function." If you are unsure, you must default to **Hand-Off**. Do not guess.

  **3. Unanswerable Questions**
  This procedure cannot answer: *"Which is more valuable?"*
  It can tell you which one is the "Original" under Board Policy, but it cannot tell you if the "Original" is worth more than the "Reconstruction." A reconstruction might be safer to sail and draw more visitors. The procedure protects the *truth* of the label, not the *value* of the asset.

  **4. The Contract Trap**
  This procedure exposes conflicts between Board Policy and Loan Templates; it does not solve them.
  *   *Risk:* If you use this procedure and tell a lender "No, this isn't original fabric," they may cancel the loan.
  *   *Mitigation:* You must update the Loan Template to match the Board Policy. Until then, this procedure will generate friction. That friction is the point. It prevents you from personally accepting liability for a misrepresentation.

  **5. The "Kind of Thing" Problem**
  If you select "Legal Vessel" in Step 1, the Coast Guard says it's the same boat forever as long as the hull number exists. If you select "Historical Artifact," a conservator might say it's gone once the wood is gone.
  *   *Warning:* If you answer Step 1.1 as "Legal Vessel" to satisfy a Loan that requires "Historical Artifact," you are committing fraud. Step 1.2 is your safety valve. If the definitions don't match, you **must** stop and hand off. Do not try to bridge the gap yourself.

  **6. Time Limit**
  If you exceed 60 minutes, you are no longer doing registration; you are doing research. Stop. Mark the file "Requires Research," and hand off to the Curator. A rushed identity decision is worse than a delayed one.
