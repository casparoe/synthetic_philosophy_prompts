      *   *Dissent:* Is it pure text? Scalia argues text is king. But is there a hidden purpose? Yes, a purpose of *limiting* the ACA's reach or enforcing federalism (states must act to get benefits). Also, a purpose of judicial restraint (don't save Congress from its mistakes).
      *   *Plain Meaning:* The case challenges the idea that "plain meaning" is objective. To Roberts, it wasn't plain in context. To Scalia, it was plain in isolation.

  5.  **Drafting Task 3: Deep Theory (The Three-Level Model):**

      *   *Semantic vs. Legal:* Both sides likely agree "State" usually means "State." The fight is whether that semantic content *controls* the legal outcome when it leads to absurdity. This suggests the debate is legal/normative, not semantic.
      *   *Who Decides:* Yes, it's about authority. Textualists say Congress must write clearly; if they mess up, courts don't fix it. Purposivists say courts should ensure the law works as intended.
      *   *Three Levels:*
          1.  *Semantic:* "State" = State. (Dissent stays here mostly).
          2.  *Intended Legal Content:* What did Congress mean to enact? (Majority digs here).
