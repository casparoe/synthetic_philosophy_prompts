answer: |-
  This is a sophisticated dissection of *King v. Burwell*. You are asking to move beyond the "who won" scorecard and use the case to stress-test the machinery of statutory interpretation theory. Below is the analysis structured according to your four requirements.

  ### 1. Mapping Interpretation vs. Construction

  The distinction you are using—**interpretation** (discovering linguistic meaning) vs. **construction** (assigning legal effect when meaning is indeterminate)—is crucial here. *King* is a rare case where the majority explicitly bridges the gap between the two, while the dissent insists on staying within the first.

  **The Majority (Roberts): The Move from Interpretation to Construction**
  *   **Interpretation Phase:** Chief Justice Roberts begins by conceding that the phrase "established by the State" has a plain meaning *in isolation*. However, he quickly moves to argue that when placed in the context of the entire statute, the term becomes **ambiguous**. He notes that other sections of the ACA treat federal exchanges as equivalent to state exchanges. By declaring the term ambiguous in context, he clears the ground for construction.
  *   **Construction Phase:** Once ambiguity is established, Roberts engages in construction. He builds a rule based on the **statutory scheme** and **consequences**. He argues that denying credits in federal-exchange states would create "death spirals" in insurance markets, undermining the core purpose of the Act. This is not finding meaning; it is assigning legal effect to the text to avoid a result that renders the statute incoherent. The majority admits they are looking beyond the specific phrase to the "broader structure" to determine how the text *functions* legally.

  **The Dissent (Scalia): Insisting on Interpretation**
  *   **Interpretation Phase:** Justice Scalia insists the case should be resolved entirely at the interpretation stage. He argues the phrase "established by the State" is unambiguous. For the dissent, context does not create ambiguity; it confirms the plain meaning. They argue that if Congress meant "State or Federal," they knew how to say it (as they did elsewhere in the US Code).
  *   **Construction Phase:** The dissent accuses the majority of engaging in illegitimate construction (rewriting the law). However, the dissent is actually engaging in a specific *type* of construction: a **clear statement rule**. They are applying a meta-rule that says, "If the text is clear, no amount of consequentialist construction can override it." This is a rule about *when* construction is permitted, not a refusal to construct. They are constructing a barrier against purposive reasoning.

  ### 2. Testing the Theories

  **Is the Majority Purposivist or "Whole-Text" Textualist?**
  The majority opinion is a hybrid that exposes the blur between the theories.
  *   **Purposivist Elements:** The reliance on the "linchpin" nature of the subsidies and the catastrophic consequences of the alternative reading is classic purposivism. It prioritizes the *function* of the statute over the *form* of the specific clause.
  *   **Textualist Elements:** Roberts frames this as "contextual textualism." He does not say "the purpose overrides the text." He says "the text, read in context, allows this reading." This fits a version of textualism that rejects "literalism" (reading words in isolation) in favor of "ordinary meaning in context."
  *   **Verdict:** It is **Holistic Textualism** that functions like **Soft Purposivism**. It uses textualist tools (reading the whole act) to reach a purposivist end (saving the regulatory scheme).

  **Does the Dissent's Reading Follow from Text Alone?**
  *   **The Smuggle:** Scalia claims to rely solely on the text. However, the dissent smuggles in a substantive purpose: **Federalism and Legislative Accountability.** By insisting that states must establish their own exchanges to get credits, the dissent enforces a coercive federalism structure (do it yourself or lose the benefit) that the majority says Congress did not intend.
  *   **The "Plain Meaning" Myth:** The case demonstrates that "plain meaning" is not an objective fact but a conclusion. To the dissent, "State" plainly excludes "Federal." To the majority, "State" in the context of a cooperative federalism scheme plausibly includes "Federal agent." The dissent's reading relies on a purpose of **strict construction of government power**, not just linguistics.

  **The Status of "Plain Meaning":**
  *King* severely damages the idea that plain meaning controls absolutely. If the text is "plain" but leads to a result that destroys the statute's operation, *King* suggests the plain meaning must yield. This establishes a hierarchy: **Coherence > Literalism.**

  ### 3. Deep Theory: Semantics, Law, and the Three-Level Model

  This is the crux of your inquiry. If both sides agree on the dictionary definition of "State" but disagree on the outcome, the fight is not semantic; it is **normative**.

  **Semantic vs. Legal Disagreement**
  The disagreement is **legal**, not semantic. Both sides likely agree that "State" ordinarily means "State." The fight is about whether that semantic content *automatically determines* the legal content.
  *   **Textualist Norm:** Semantic content controls unless it leads to absurdity (a very high bar).
  *   **Purposivist Norm:** Semantic content is evidence of legal content, but legal content is determined by what best effectuates the legislative plan.
  *   **Who Decides:** You hit the nail on the head. The debate is about **authority**. Textualism is a theory of judicial restraint: "If Congress messed up, Congress fixes it." Purposivism is a theory of judicial partnership: "We help make the law work as intended." *King* shows that in high-stakes cases, the Court often chooses partnership over restraint.

  **Applying the Three-Level Model**

  1.  **Semantic Content:** "Exchange established by the State" means an exchange set up by a state government.
      *   *Dissent:* Operates here. Stops at Level 1.
      *   *Majority:* Acknowledges Level 1 but says it is insufficient.
  2.  **Intended Legal Content:** What specific legal rule did the enactors mean to contribute? (e.g., "Credits only where states run exchanges to encourage state participation").
      *   *Dissent:* Argues Level 2 matches Level 1.
      *   *Majority:* Argues Level 2 is broader ("Credits available everywhere to ensure market stability").
  3.  **Purpose-Serving Legal Content:** What rule best serves the statute's justifying purpose? (e.g., "Maximize coverage and prevent market collapse").
      *   *Majority:* Operates heavily here. They infer that the purpose (Level 3) clarifies the Intent (Level 2), which overrides the narrow Semantic reading (Level 1).

  **Legitimacy of the Move:**
  *   **From (1) to (3):** The dissent argues this move is illegitimate substitution. The majority argues it is a legitimate inference because statutes are not lists of words but "integrated wholes."
  *   **Does (2) Collapse into (1)?** The Textualist says yes: Intent is fixed by the text because the text is the only law passed. The *King* Majority says no: Intent is fixed by the *problem Congress was solving*, and the text is just the vehicle. *King* proves they do not collapse. If they did, there would be no case. The text said one thing (Level 1), but the functional intent (Level 2/3) required another.

  ### 4. Verdict and Critique

  **Which Theory Looks Better?**
  *   **Textualism:** Looks **rigid and naive** in *King*. It assumes Congress drafts with perfect consistency and that "mistakes" should be left to rot. It fails to account for the reality of 2,000-page bills drafted by committees where "State" might be shorthand for "State or Federal fallback."
  *   **Purposivism:** Looks **pragmatic but dangerous**. It saves the statute from self-destruction, but it risks turning judges into legislators. If the text says "State" and the Court hears "Federal," what constraint remains?
  *   **Winner:** **Holistic Textualism (The Majority).** It looks better because it acknowledges that language is context-dependent. A word's meaning *does* change based on the surrounding scheme. However, it wins only because the stakes were so high.

  **Where is the Case an Anomaly?**
  *   **For Textualism:** It is an anomaly that Roberts, a conservative Chief, wrote such a purposive opinion. Usually, textualists would let the "death spiral" happen to force Congress to act.
  *   **For Purposivism:** It is an anomaly that the Court didn't just defer to the Agency (IRS) under *Chevron*. Usually, purposivists love agency deference. Here, the Court took the power to define the purpose itself, claiming this was a "major question." This is a textualist move (courts decide the law) used to achieve a purposive end.

  **Is the Debate Misframed?**
  **Yes.** The debate is misframed as "Text vs. Purpose."
  *   **The Real Fight:** It is **"Rule Formalism vs. Standard Functionalism."**
      *   **Textualism** offers a *rule*: Follow the words. It prioritizes predictability and democratic accountability (Congress writes the law).
      *   **Purposivism** offers a *standard*: Make the law work. It prioritizes functional governance and legislative intent.
  *   **The Synthesis:** *King* suggests the best theory is **"Contextualism."** Text is the primary constraint, but context (including purpose) determines the semantic content. The dissent pretends context doesn't change meaning. The majority pretends text doesn't constrain purpose.
  *   **Final Take:** *King v. Burwell* shows that in the Supreme Court, **consequences trump semantics.** Neither theory can honestly claim victory because the decision was driven by the catastrophic real-world outcome of the dissent's reading. The theory was retrofitted to justify the result. This suggests the "Textualism vs. Purposivism" debate is often just a vocabulary war fought over decisions made on intuitive grounds of fairness and function.
