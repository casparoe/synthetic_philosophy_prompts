      *   *The Dissent (Scalia):* The phrase is clear. "State" means State. If Congress meant "State or Federal," they would have said so. The consequences don't justify rewriting the law. Let Congress fix it.

  3.  **Drafting Task 1: Interpretation vs. Construction:**

      *   *Distinction:* Interpretation = linguistic meaning. Construction = legal effect when meaning is vague/ambiguous/absurd.
