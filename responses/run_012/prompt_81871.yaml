prompt: |-
  Ok so I'm trying to get a handle on the textualism vs purposivism fight, and I want to use a real case as the test bed: King v. Burwell, the 2015 Supreme Court decision about whether the ACA's tax credits were available in states that didn't set up their own exchange. Heres the setup as I understand it: the tax provision ties the credit to coverage bought through an exchange established by the state, the IRS read that to include the federal exchange in states that refused to establish one, and the Court upheld the IRS reading. The dissent said the majority was just rewriting the statute to save the ACA. I dont want the standard recap of who won. What I want is a two-way analysis.

  First, map the episode onto a distinction I've been chewing on: between interpretation, figuring out what the enacted text means, and construction, building a rule for a case the text doesn't settle. Which parts of the majority's reasoning are interpretation, and which are construction? Do the same for the dissent. Be specific about the moves: the majority leaning on the statute's overall scheme, the consequences of the alternative, the fact that the credits are the linchpin of the whole reform; the dissent insisting the phrase has a plain meaning and that purpose can't override it.

  Second, use the case to test the theories. Does the majority's approach fit any recognizable version of purposivism, or is it a whole-text textualism that just looks purposive? Does the dissent's reading really follow from the text alone, or does it smuggle in a purpose of its own, like limiting federal power or deregulating the exchanges? And where does the case leave the idea that the text's plain meaning controls?

  Third, and this is the part I care most about: what does the episode show about the theories themselves? Suppose both sides actually agree on the linguistic meaning of the phrase but disagree about whether that meaning controls the legal outcome. Is the disagreement semantic or legal? If its legal, does that mean the textualism vs purposivism debate is really about who gets to decide, Congress or the courts, rather than about how to read? Also, try out a three-level model: (1) the semantic content of the text, (2) the legal content the enactors intended to contribute, (3) the legal content that best serves the statute's justifying purpose. Which level is each side operating at? Is the move from (1) to (3) a legitimate inference from the text or a substitution for it? And does (2) collapse into (1) once you admit that intentions are themselves fixed by the text?

  Finally, give me your honest verdict on which theory comes out looking better from this case, and say where the case is an anomaly for both, something neither textualism nor purposivism handles cleanly. If you think the whole debate is misframed, say how.
