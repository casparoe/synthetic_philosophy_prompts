  5.  **Drafting the Rounds:**
      *   **R1 (Barter):** Trade Goods directly. Hard to match needs.
      *   **R2 (Credit):** Banker issues Notes. Landlord demands Rent in Notes. Producers sell Goods for Notes to pay Rent. Circulation speeds up.
      *   **R3 (The Querist's Warning):** Banker hoards Notes or issues too many. If hoarded: Liquidity crisis (no one can pay rent). If overissued: Inflation (Notes buy less Goods, but Candy cost is fixed in Goods). Let's go with **Hoarding/Stoppage**. The Banker stops redeeming/accepting notes, or simply holds the stack.
      *   **R4 (The Reveal):** Try to eat the Notes. Realize they are just paper.

  6.  **Refining the "Feeling":**
      *   To make them feel the "Ticket" nature, the Notes must be *required* for a transaction that doesn't actually create value (Rent), while the Goods are required for the actual reward (Candy).
      *   *Better:* The Landlord holds the Candy. You need Notes to pay Landlord to get Candy. But the Landlord only accepts Notes if they are "in circulation."
      *   *Best:* Keep it simple.
          *   **Wealth:** Colored Cards (representing real goods).
          *   **Money:** White Slips.
          *   **End Game:** You need Colored Cards to get Candy.
          *   **Constraint:** You can only get Colored Cards from others if you pay them White Slips (in R2+).
          *   **R1:** No Slips. Trade Cards for Cards. (Hard).
          *   **R2:** Slips introduced. Banker gives Slips to Laborers. Laborers buy Cards from Producers. Producers pay Rent to Landlord in Slips. Landlord buys Cards from Producers. (Flows).
          *   **R3:** Banker stops issuing. Landlord hoards Slips. Laborers have no Slips. Producers can't sell. Economy stops.
          *   **R4:** Students try to trade Slips for Candy directly. Instructor says "No, only Cards."

  7.  **Addressing the Metaphysics Link:**
      *   Money = Idea/Convention.
      *   Gold/Silver = Material Substance (Locke).
      *   Berkeley: Value is in the *use* and *credit*, not the metal.
      *   Game: Value is in the *Goods*, not the *Slips*. The Slips work only because we agree they do (Public Faith).

  8.  **Troubleshooting & Limitations:**
      *   *Risk:* Students treat Slips as wealth. *Fix:* Enforce the rule that only Cards buy Candy.
      *   *Risk:* Banker goes rogue. *Fix:* Give Banker a specific script/incentive.
      *   *Risk:* Boredom. *Fix:* Keep rounds short (10-15 mins).
      *   *Limitation:* Doesn't capture the colonial context (Ireland/England). *Fix:* Instructor lecture during debrief.
      *   *Limitation:* No theology. *Fix:* Mention God as the ultimate guarantor of value in the debrief.

  9.  **Structuring the Document:**
      *   Title & Overview.
      *   Materials List.
      *   Roles & Setup.
      *   Round-by-Round Script (Time, Rules, Expected Outcome).
      *   The Banker's Secret Instructions (Crucial for R3).
      *   The Debrief (Connecting gameplay to Berkeley).
      *   Troubleshooting (What if X happens?).
      *   Limitations (What the game misses).

  10. **Review against Constraints:**
      *   20 students? Yes.
      *   75 mins? Yes (10 intro, 45 game, 20 debrief).
      *   No real money? Yes.
      *   Specific rounds (Barter, Credit, Crisis, Melt)? Yes.
      *   Debrief mapping? Yes.
      *   Troubleshooting included? Yes.

  11. **Final Polish:** Ensure the tone is academic yet practical. Make sure the Berkeley connection is precise (The Querist, not just general economics). Emphasize the "Ticket" metaphor. (Self-Correction: Make sure the Banker isn't just a villain, but represents the *system* of credit).

      *Wait, one nuance:* Berkeley wasn't against gold/silver per se, but against the *fetishization* of them when paper would do better for circulation. The game should reflect that the Notes are *better* than barter, but dangerous if trust breaks.
      *Refinement on R3:* The Banker shouldn't just "stop." The Banker should represent the *Public Bank*. The crisis should be a loss of *Confidence*. Maybe a rumor? No, too hard to manage. Let's stick to the Banker restricting flow (Hoarding) which Berkeley argued against (money must circulate).

      *Refinement on R4:* "Melting." In history, people melted coins. Here, they try to redeem notes for "metal" ( Instructor says "I have no metal").

      *Let's finalize the payoff:* The "Candy" is the only thing that matters. The Cards are the "Goods." The Slips are "Money."
      *Wait, if Cards buy Candy, and Slips buy Cards... then Slips indirectly buy Candy.*
      *To make the point "Money is not Wealth":* At the end, collect all Slips. Burn them. Show they are worthless. Collect Cards. Trade for Candy.
      *Yes.*

      *Let's write it.*
answer: |-
  # Seminar Game: The Querist's Ticket
  **Topic:** Berkeley's Economic Philosophy (*The Querist*, 1735–37)
  **Time:** 75 Minutes
  **Class Size:** 20 Students
  **Goal:** Experiential understanding of money as a "ticket" for circulation/industry rather than intrinsic wealth, leading to a connection with immaterialism.

  ---

  ## I. Materials & Setup

  **Physical Goods:**
  *   **Index Cards (The "Wealth"):** 60 cards total.
      *   20 Red (Food)
      *   20 Blue (Cloth)
      *   20 Yellow (Tools)
  *   **Paper Slips (The "Money"):** 100 small slips of white paper. Pre-stamped or signed by the "Banker."
  *   **The Payoff:** 20 pieces of candy (or 20 bonus points on the next assignment).
  *   **Props:** A box/bag for the Banker, a "Rent Box" for the Landlord.

  **Room Layout:**
  *   Desks arranged in clusters (sectors).
  *   Front of room: "The Market" (Instructor) where Cards are redeemed for Candy.
  *   One desk designated as "The National Bank."
  *   One desk designated as "The Landlord's Estate."

  ---

  ## II. Roles (Assign via slips of paper at the door)

  1.  **The Banker (2 students):**
      *   *Public Role:* Issue notes, manage the money supply.
      *   *Private Instruction:* (See Section V).
  2.  **The Landlord (2 students):**
      *   *Public Role:* Own the "Rent Box." Collect rent from everyone every round.
      *   *Incentive:* They need Notes to open the Rent Box. If the box stays closed, they get no points.
  3.  **The Producers (10 students):**
      *   *Start:* Hold 3 Index Cards each (mixed colors).
      *   *Goal:* Accumulate a "Consumption Bundle" (1 Red + 1 Blue) to redeem for Candy at the end.
  4.  **The Laborers (6 students):**
      *   *Start:* Hold **0** Cards and **0** Notes.
      *   *Goal:* Must earn Notes to buy Cards from Producers to make a Bundle.
      *   *Constraint:* They cannot produce Cards; they can only sell "Labor" (perform a trivial task, e.g., stack 5 coins, write a syllogism) to the Banker or Landlord for Notes.

  ---

  ## III. The Rules (Project on Screen / Handout)

  1.  **Wealth:** Only **Index Cards** can be traded for Candy at the front desk. A "Bundle" = 1 Red + 1 Blue.
  2.  **Money:** **Paper Slips** are the only legal tender for buying Cards from other students.
  3.  **Rent:** At the end of *every* round, every student must pay 1 Slip to the Landlord. If you cannot pay, you are "Indicted" (lose 1 Card to the Landlord).
  4.  **Circulation:** You cannot hoard Cards. If you hold more than 5 Cards at the end of a round, you pay a "Storage Tax" (give 1 Card to the Banker).
  5.  **Winning:** At the end of the game (Round 4), trade Bundles for Candy. Slips are worthless.

  ---

  ## IV. Round-by-Round Timeline (75 Minutes Total)

  ### 0:00–0:10 | Introduction & Deal
  *   Hand out roles. Distribute starting Cards to Producers.
  *   Explain Rules 1–5 clearly.
  *   **Crucial:** Do *not* explain Berkeley's theory yet. Tell them: "This is a simulation of resource allocation. Maximize your Candy."

  ### 0:10–0:25 | Round 1: The Barter Grind
  *   **Money Supply:** 0 Slips in circulation.
  *   **Task:** Producers need to trade Cards to get Bundles. Laborers have nothing to trade. Landlord demands Rent.
  *   **Expected Outcome:** Chaos. Laborers cannot pay Rent (they have no Slips and no Cards to sell). Producers don't want the specific Cards Laborers might offer (if they had any). The Landlord's box remains mostly empty.
  *   **Stop Signal:** 10 minutes. Count the Rent Box. (It will be low).
  *   **Instructor Note:** "This is inefficient. We need a medium."

  ### 0:25–0:40 | Round 2: The Paper Credit Boom
  *   **Action:** Banker issues 5 Slips to each Laborer and 2 Slips to each Producer. (Total ~50 Slips).
  *   **Task:** Resume trading. Laborers sell Labor (do a quick task for Banker) for more Slips, buy Cards from Producers. Producers use Slips to pay Rent.
  *   **Expected Outcome:** Speed increases. Laborers can now pay Rent. Producers sell surplus Cards for Slips, then use Slips to buy the specific Colors they need. Circulation is high.
  *   **Stop Signal:** 10 minutes. Count the Rent Box. (It should be full).
  *   **Instructor Note:** "Notice how the Slips facilitated the movement of the Cards."

  ### 0:40–0:55 | Round 3: The Crisis of Confidence
  *   **Action:** (See Banker Secret Instructions below).
  *   **Task:** Resume trading.
  *   **Expected Outcome:** The flow stops. Laborers can't get Slips to pay Rent. Producers stop selling Cards because they fear Slips won't be accepted. Hoarding begins.
  *   **Stop Signal:** 10 minutes. Count the Rent Box. (It will be empty again).
  *   **Instructor Note:** "The economy has seized. The Cards are still there. The Slips are still there. Why did the work stop?"

  ### 0:55–1:05 | Round 4: The Melting Point
  *   **Action:** Instructor announces: "The Bank has collapsed. Slips are no longer accepted for Rent. Can you eat the Slips?"
  *   **Task:** Students try to trade Slips directly to the Instructor for Candy.
  *   **Rule Enforcement:** Instructor refuses. "I only accept Cards. The Slips were never the wealth."
  *   **Final Trade:** Students trade Cards for Candy. Slips are collected and shredded/ignored.
  *   **Instructor Note:** "The Slips were a permission slip. The Cards were the wealth."

  ### 1:05–1:15 | Debrief (The Berkeley Connection)
  *   (See Section VI).

  ---

  ## V. Secret Instructions for The Banker (Hand this note only to them)

  **Round 1:** Do nothing. You have no slips yet.
  **Round 2:** Distribute slips generously. Encourage trade. Tell Laborers: "Work for me, I'll give you slips."
  **Round 3 (The Crisis):** **Stop issuing new slips.** If a Laborer offers to work, refuse. If a Producer tries to deposit slips with you, **hoard them**. Do not put them back into circulation.
  *   *Rationale:* Berkeley argues money must *circulate* to create wealth. If the Banker (the heart) stops pumping, the body dies.
  *   *Optional Twist:* If the Banker is too nice, whisper to the Landlord: "Start demanding 2 Slips for Rent instead of 1." (This creates deflation/scarcity).
  **Round 4:** Declare the bank closed.

  ---

  ## VI. The Debrief: Mapping Gameplay to *The Querist*

  *Do not lecture. Ask questions based on what just happened.*

  **1. The Nature of Money (The Ticket View)**
  *   *Ask:* "In Round 4, why couldn't you buy Candy with the Slips?"
  *   *Point:* The Slips were never wealth. They were **tickets** to claim wealth. Berkeley: *"Whether money be not only a ticket of power?"* (Querist #4).
  *   *Connection:* Money is a claim on labor and goods, not a good itself.

  **2. Circulation vs. Hoarding**
  *   *Ask:* "Round 2 worked, Round 3 failed. The number of Slips didn't change much. What changed?"
  *   *Point:* **Velocity.** Berkeley insisted money must move to stimulate industry. A stagnant pool of money (even paper money) creates poverty.
  *   *Quote:* *"Whether the circulation of money be not the life of trade?"*

  **3. Trust and Opinion (The Immaterial Link)**
  *   *Ask:* "The Slips were just paper. Why did they have value in Round 2?"
  *   *Point:* **Public Faith.** The value existed in the *convention* and *trust* of the room, not the fiber of the paper.
  *   *Metaphysics Bridge:* Just as the value of the note lies in the public mind/convention, the existence of the cherry lies in the perceiving mind (and ultimately God). Berkeley denies **Material Substance** in objects; he denies **Intrinsic Value** in money. Both are relational, not substantial.
  *   *Quote:* *"Whether credit be not of the nature of a spirit?"* (Querist #238).

  **4. Industry is Wealth**
  *   *Ask:* "If I printed a million Slips right now, would the class be richer?"
  *   *Point:* No. Wealth is the Cards (Goods) and the Laborers' ability to work. Money is just the tool to organize them.
  *   *Historical Context:* Berkeley was writing about Ireland. Ireland had plenty of labor and land but no coin. England hoarded the gold. Berkeley argued: Issue paper credit to put the Irish to work. The wealth is the *work*, not the gold.

  ---

  ## VII. Troubleshooting: What Will Go Wrong

  **1. "The Hoarder" (A student keeps all the Cards)**
  *   *Symptom:* One Producer refuses to sell, waiting for a better price.
  *   *Fix:* Enforce the "Storage Tax" rule aggressively. If they hold >5 Cards, take one. Berkeley hated idle wealth.
  *   *Debrief Use:* Use this to explain Berkeley's critique of absentee landlords and hoarders who break circulation.

  **2. "The Note Fetishists" (Students treat Slips as the goal)**
  *   *Symptom:* Students accumulate Slips and forget to buy Cards.
  *   *Fix:* Remind them at the start of Round 3: "Candy is only for Card Bundles."
  *   *Debrief Use:* This is actually a *good* failure. It proves Berkeley's point: people mistake the ticket for the prize. Use this in the metaphysics section (mistaking the sign for the thing signified).

  **3. "The Rebel Laborer" (Refuses to work for Slips)**
  *   *Symptom:* A Laborer says "This paper is worthless" and sits out.
  *   *Fix:* Let them sit out. They will end up with no Candy.
  *   *Debrief Use:* They are the skeptic. But point out that by opting out, they removed themselves from the "social convention" that creates value. Value is intersubjective.

  **4. The Banker Goes Rogue (Issues infinite slips)**
  *   *Symptom:* Banker hands out slips to friends freely.
  *   *Fix:* Limit the physical number of slips pre-printed. If they run out, they can't issue more.
  *   *Debrief Use:* Inflation. If slips are too easy to get, they lose purchasing power (though in this short game, scarcity is the bigger risk).

  ---

  ## VIII. Limitations: What This Game Cannot Do

  *Be honest with the students about these gaps during the debrief.*

  1.  **The Colonial Context:** The game treats the "National Bank" as neutral. In reality, Berkeley was proposing this for *Ireland* under *English* rule. The "Landlord" in history was often an absentee English aristocrat draining wealth from Ireland.
      *   *Fill the Gap:* Explain that Berkeley's push for paper money was a nationalist project to free Ireland from dependence on English coin.
  2.  **The Theological Frame:** The game is secular. For Berkeley, the ultimate guarantor of value (like the ultimate guarantor of perception) is God. The "Public Faith" is a secular stand-in for Divine Providence.
      *   *Fill the Gap:* Mention that for Berkeley, industry is a religious duty. Idleness is a sin. The "Candy" is worldly, but the *work* is spiritual.
  3.  **Time:** Real economic trust takes years to build and seconds to break. The game compresses this.
  4.  **Complexity:** Real economies have interest, debt, and foreign exchange. This is a closed loop.
      *   *Fill the Gap:* Acknowledge that *The Querist* is a series of questions, not a finished system. He was probing, just like we did.

  ## IX. Closing Statement (Script)

  "Today you felt the frustration of barter, the ease of credit, and the paralysis of lost trust. You discovered that the paper in your hand was never the wealth—the wealth was the labor and the goods.

  Berkeley makes the exact same move in metaphysics. Locke said objects have a 'material substance' we can't see, like gold backing the paper. Berkeley says: No. The object *is* the perception. The value *is* the circulation. There is no hidden 'stuff' behind the idea, just as there is no hidden 'value' behind the ticket. Both are sustained by a mind—for money, the public mind; for the universe, the Divine Mind.

  Next week, we return to the *Principles*. But remember: when Berkeley denies matter, he isn't denying the table you sit at. He's denying the invisible 'glue' you think holds it together. Just like he denied the gold glue holding the economy together."
