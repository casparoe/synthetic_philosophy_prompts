          *   "...because if you know P then P is true..." -> Correct (Factivity).
          *   "...and so anything that seems to count against it must be misleading." -> Logically follows from factivity, *but*...
          *   *Critique:* The leap from "is misleading" to "entitled to treat as misleading" is the crux. It assumes you can be certain of your knowledge status in a way that blocks inquiry.
      *   *Sentence 2 Analysis:*
