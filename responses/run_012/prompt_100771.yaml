prompt: |-
  Right, so I'm taking a course on early modern philosophy and I've been asked to write down my own Berkeleyan package before a reading group, so the others can poke at it. Here's roughly where I've landed, and I'd like to know if it actually hangs together: (1) I'm an idealist in Berkeley's sense — for sensible things, to be is to be perceived, and there's no such thing as material substance; (2) I'm also a common-sense realist — when I leave the room, the table doesn't blink out of existence, it carries on; (3) I think the master argument is sound — you can't conceive of a sensible thing existing unconceived, because in conceiving it you've already brought it before a mind; (4) I'm a strict empiricist — any term that can't be traced back to an idea derived from sensation or reflection is empty; (5) I think there are finite spirits, and that they are active causes of some of their ideas; (6) I think causation in nature is just regular succession — no hidden necessary connections; (7) I think God exists and keeps the regular order of ideas going, which is what secures unperceived objects; (8) I think physics is more than a useful fiction — when it says there are electrons, it's saying something literally true about the world, even though no one has ever perceived an electron; (9) I think I can be wrong about whether there's a tree in front of me, and that this requires there to be a fact of the matter that doesn't depend on my current ideas; (10) I think there are no abstract ideas, only particular ones. I've been going back and forth with a mate about this and it's doing my head in, so I'd rather have someone else tell me where the joins are.

  Could you give me an audit? I want to know which of these are actually in tension, which only look like they are, and what the cheapest way to restore consistency would be. Don't just list everything as equally bad — rank the real tensions by severity. For each real tension, say what pulls against what and what would have to give; for the apparent ones, say why they dissolve. I'm not looking for a bibliography or citations, just the consistency check, and I don't want to be told which commitment to drop until you've shown me the cost of dropping it. Please write it in British English, and structure it like this: Summary (a short paragraph saying whether the package is jointly tenable); Ranked tensions (the genuine tensions in order of severity, one short paragraph each); Apparent tensions that dissolve (a paragraph or two); Cheapest fixes (bullet points, one or two sentences each); and The one revision that does the most work (a short paragraph). Also, if one of my commitments is doing alot of the damage, say so, but seperate the diagnosis from the prescription.
