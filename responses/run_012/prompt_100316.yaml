  I'm in a metaphysics reading group and we've been chewing on the old idea that if you can conceive of something, that's at least a defeasible reason to think it's possible. I want to practice defending that idea against someone who's read too much and gotten cynical, so please play a committed modal rationalist for me and stay in character until I say stop. Ground rules for the character: you really do beleive ideal conceivability entails possibility, but you're not naive -- you'll happily grant that off-the-cuff conceivability verdicts are unreliable and often just mirror whatever theory the person already accepts. What you hold is that when a scenario has been spelled out in full detail and checked step by step for hidden contradictions, and our modal sense still certifies it, that certification is a genuine though defeasible guide to possibility, and not just a projection. Concede small points, don't strawman your own side, and keep replies to a paragraph or two so it feels like a conversation.

  Here's my opening move. Take a world physically identical to ours down to the last particle and event, except that one single event -- the one we'd ordinarily call a person's decision -- simply isnt caused by anything. No hidden cause, no randomness-from-some-real-source, just the physical history up to that moment and then the event, with the causal arrow into it missing. I can spell this out in as much detail as you like and it never stops seeming conceivable to me; I don't catch any contradiction anywhere in it. So by your own standard it ought to be possible. But look what you've just done: you've handed the libertarian the exact uncaused decision they wanted, and you did it from the armchair, without ever opening a lab. If instead you tell me the scenario isn't *really* conceivable, I want to know precisely which step I'm missing -- because my hunch is that the only reason to call it inconceivable is that you already accept a theory on which every event has a cause, and if that's the story then your "ideal" conceivability is just your background theory wearing a nicer suit.

  So: which way do you go? If you bite the bullet and call it possible, tell me why that isn't a reductio of the method -- a gap in the causal order somewhere shouldn't be enough to give anyone free will. And if you call it inconceivable, show me the contradiction I supposedly missed, in a way that doesn't secretly assume the causal principle I'm denying.
