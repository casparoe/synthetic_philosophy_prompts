answer: |-
  ### Brainstorming and Stress-Testing Candidate Principles

  Before settling on a final formulation, I will sketch three candidate principles derived from your cases. My goal is to find one that respects your specific verdicts (particularly the divergences in Cases 1/2 and 3/5) without becoming a mere list of exceptions.

  **Candidate 1: The "Practice Collapse" Principle**
  *Formulation:* An action is wrong if and only if its universalization would make the practice or convention that makes the action possible impossible to sustain.
  *Stress Test:*
  *   **Case 1 (Deposit):** Passes. Promising collapses without trust. Verdict: Wrong.
  *   **Case 2 (Résumé):** Fails. You note that universal padding makes résumés less informative, effectively collapsing the practice of truthful self-reporting. Yet your verdict is "Not Wrong." This principle condemns Case 2.
  *   **Case 3 (Drowning):** Fails. There is no "practice" of rescue that collapses; there is simply a lack of action. This principle permits Case 3.
  *   **Diagnosis:** Too narrow. It captures "perfect duties" to institutions but misses duties to persons (beneficence) and fails to distinguish between constitutive norms (promises) and competitive norms (hiring).

  **Candidate 2: The "Rational Necessity" Principle**
  *Formulation:* An action is wrong if and only if you cannot rationally will its universalization because it contradicts a necessary end of your own will (e.g., your own happiness or survival).
  *Stress Test:*
  *   **Case 3 (Drowning):** Passes. You cannot will a world where no one helps, because you might need help. Verdict: Wrong.
  *   **Case 5 (Never Ask):** Fails. You argue this is "Not Wrong." But if I universalize "no one asks," I might starve when I cannot signal need. If "survival" is a necessary end, this principle condemns Case 5.
  *   **Case 6 (Boat):** Fails. If everyone buys boats, famine kills people. If "humanity's survival" is a necessary end, this condemns Case 6.
  *   **Diagnosis:** Too broad. It turns all prudence into morality and fails to distinguish between *needing help to exist* (Case 3) and *choosing not to solicit help* (Case 5).

  **Candidate 3: The "Agency Viability" Principle (Selected)**
  *Formulation:* An action is wrong if its maxim, when universalized, either (A) undermines the normative conditions that make the action intelligible, or (B) deprives rational agents of the necessary conditions for pursuing permissible ends.
  *Stress Test:*
  *   **Case 1:** Fails (A). Undermines the norm of truth-telling required for promises.
  *   **Case 2:** Passes (A). Résumé padding degrades signal quality but does not destroy the *concept* of a job application (which remains a competitive pitch).
  *   **Case 3:** Fails (B). Universal non-help removes a necessary condition for survival/agency.
  *   **Case 5:** Passes (B). Help remains available in the world; the agent merely opts out of receiving it. Agency is not deprived, only self-limited.
  *   **Case 6:** Passes (B). My specific savings are not a *necessary condition* for global agency; a universal policy of *never* helping would be, but a policy of *allocating resources to projects* is not.
  *   **Diagnosis:** This handles the distinctions best. It requires precise definitions of "normative conditions" vs. "competitive conventions" and "necessary conditions" vs. "contingent needs."

  ***

  ### The Principle of Universalizable Agency

  Based on the stress tests above, I propose the following principle. It is designed to be applied directly to new cases.

  **The Principle:**
  > Act only on maxims that you can at the same time will as universal laws without contradiction. A maxim generates a contradiction in one of two ways:
  >
  > **1. Contradiction in Institution (The Integrity Clause):** The action relies on a normative institution or expectation that would cease to function if the action were universal. This applies only where the institution is *constitutive* of the interaction (e.g., promising, contracting) rather than *competitive* (e.g., marketing, bargaining).
  >
  > **2. Contradiction in Agency (The Sustainability Clause):** The universalization of the maxim would remove a means or condition that is *necessary* for rational agents to pursue permissible ends. This condemns policies that systematically deny aid (Case 3) but permits policies that merely allocate resources elsewhere (Case 6) or decline to solicit aid (Case 5), provided the general capacity for aid remains in the world.

  **Why this formulation?**
  *   **Clause 1** is forced by **Case 1 vs. Case 2**. Both involve deception, but only Case 1 destroys a constitutive norm (the binding nature of a promise). Case 2 degrades a competitive signal (a résumé) but leaves the hiring practice intact.
  *   **Clause 2** is forced by **Case 3 vs. Case 5**. Both involve a disconnect in aid. Case 3 removes the *availability* of aid (destroying a necessary condition for finite agents). Case 5 leaves aid available but refuses to *access* it (which is permissible self-reliance).
  *   **Clause 2** also handles **Case 6**. It distinguishes between a *policy of non-beneficence* (which destroys the safety net of agency) and a *specific allocation of resources* (which is permissible provided the safety net remains).

  ***

  ### (a) Application to Your Cases

  Here is how the **Principle of Universalizable Agency** applies to your eight cases, explaining which clause drives the verdict.

  1.  **The Overdue Deposit:** **Wrong.** Violates **Clause 1 (Integrity)**. The practice of promising is *constitutive*: it functions only if there is a presumption of truth. Universalizing false promises destroys the presumption, making the act of "promising" unintelligible.
  2.  **The Padded Résumé:** **Not Wrong.** Passes **Clause 1**. Job applications are *competitive* conventions, not constitutive norms of truth. Employers anticipate some inflation. Universal padding reduces efficiency but does not make the practice of applying for jobs impossible. It passes **Clause 2** because it does not deprive others of necessary conditions for agency.
  3.  **The Refusal (Drowning):** **Wrong.** Violates **Clause 2 (Sustainability)**. A universal policy of non-assistance removes a necessary condition for the survival of finite rational agents. You cannot will a world where you are abandoned in dire need, as this contradicts your will to pursue any ends at all.
  4.  **The Refusal (With Rider):** **Wrong.** Violates **Clause 2**. The rider ("I won't accept help") does not cure the defect. The maxim still universalizes a world where *no help is given*. The availability of aid is removed, which violates the Sustainability Clause regardless of your personal willingness to receive it.
  5.  **The Person Who Never Asks:** **Not Wrong.** Passes **Clause 2**. The universalized world contains helpers; the agent simply opts out of being a recipient. The *necessary condition* (availability of aid) remains intact in the world, even if this specific agent does not utilize it. This is pride, not immorality.
  6.  **The Boat:** **Not Wrong.** Passes **Clause 2**. The maxim is "I will allocate my surplus to leisure," not "I will never help anyone." Universalizing resource allocation to leisure does not destroy the *general capacity* for famine relief, provided some agents retain the capacity to help. It is an imperfect duty; you must help *sometimes*, but not *always*.
  7.  **The Emergency Shift:** **Not Wrong.** Passes **Clause 1**. The maxim must be specified as "Break promise *to save a life*." Saving a life preserves the condition of agency (Clause 2), which outweighs the constitutive norm of promising (Clause 1) in this conflict. (See section d for more on specification).
  8.  **The Last Slice:** **Not Wrong.** Passes both clauses. Taking cake relies on no constitutive norm of sharing, nor does it deprive others of necessary conditions for agency.

  ***

  ### (b) Limitations and Required Concessions

  No principle is cost-free. To maintain the precision and coherence of the **Principle of Universalizable Agency**, you must revise two of your tentative verdicts.

  **1. The Padded Résumé (Case 2)**
  *   **Your Verdict:** Sleazy, but not wrong.
  *   **Principle's Verdict:** If the padding crosses into *fraud* (claiming a skill you lack that is essential for safety, e.g., a surgeon lying about certification), it violates **Clause 1**. If it is mere "inflation" (claiming "management" for supervising interns), it passes.
  *   **The Concession:** You must accept that there is a bright line here. If the padding undermines the *specific reliance* the employer places on the claim (e.g., they hire you *because* they think you can manage five, and you can't), you are exploiting a constitutive norm of the employment contract. If you treat the résumé as "puffery" known to be such by all parties, it is permissible. You must be precise: **Deception that exploits specific reliance is wrong; deception that operates within known competitive noise is not.**

  **2. The Strict Reciprocity (New Case, see below)**
  *   **Your Verdict:** Not wrong, merely cold.
  *   **Principle's Verdict:** **Wrong.**
  *   **Why you should give this up:** A policy of "help only those who can repay" systematically excludes the most vulnerable agents (the poor, the disabled, children) from the conditions necessary for agency. If universalized, the safety net required for rational beings to function disappears. To call this "merely cold" underestimates the moral requirement to sustain the conditions of agency for all. The principle demands you revise this intuition: **Strict reciprocity is incompatible with the Sustainability Clause.**

  ***

  ### (c) Verdicts on New Cases

  **Case 1: Animal Torment**
  *   **Maxim:** "I will torment animals for amusement, assuming I will never be an animal."
  *   **Analysis:**
      *   **Clause 1 (Integrity):** No normative institution is undermined.
      *   **Clause 2 (Sustainability):** Animals are not rational agents in the Kantian sense, so their agency is not directly protected by this principle.
      *   **However:** The principle protects *your* agency. A maxim of cruelty cultivates a disposition that undermines your own capacity for moral sympathy, which is a precondition for fulfilling duties to *humans*.
  *   **Verdict:** **Wrong.** Not because of the animal's rights (which this test does not capture), but because universalizing a policy of cruelty degrades the moral character of the agent, making them less fit for rational agency among humans.
  *   **Honest Admission:** If you reject the "indirect duty" argument, this principle *does* let the act through. If you believe tormenting animals is intrinsically wrong, this principle is insufficient on its own and requires an auxiliary premise about sentience. I recommend accepting the indirect duty view to preserve the system's coherence.

  **Case 2: Strict Reciprocity**
  *   **Maxim:** "I will never accept a favour I cannot repay and never grant one to someone who cannot repay me."
  *   **Analysis:**
      *   **Clause 2 (Sustainability):** Universalizing this creates a world where aid is contingent on economic capacity. Those without capacity (the destitute) are deprived of necessary means for survival/agency.
      *   **Conflict:** You might argue, "I can will this because *I* am capable." But the test requires you to will it for *all* rational agents, including those currently vulnerable. You cannot will a system that abandons you should you become vulnerable.
  *   **Verdict:** **Wrong.** This violates the Sustainability Clause. It transforms beneficence from a duty of need into a market transaction, destroying the safety net required for universal agency.

  ***

  ### (d) On Maxim Specification (Case 7)

  You asked whether maxim specification is a genuine part of the test or a place where the test smuggles in an answer.

  **My View:** Specification is **genuine and necessary**, but it is constrained by the **Principle of Relevant Reasons**.

  In Case 7, you have two candidate maxims:
  1.  "I will break promises when I want to go to a concert."
  2.  "I will break promises when necessary to save a life."

  If you describe the action thinly ("I will break a promise"), the test fails (Clause 1). If you describe it thickly ("I will break a promise to save a life"), the test passes. Is this cheating?

  No. A maxim is not a description of a *movement*; it is a description of a *reason for action*. The moral quality lies in the *because*.
  *   In the Concert case, the reason is "my preference." Universalizing "preferences override promises" destroys the institution of promising (Clause 1).
  *   In the Emergency case, the reason is "preservation of agency." Universalizing "agency preservation overrides promises" does not destroy promising; it establishes a hierarchy of duties where the condition of agency (life) trumps the institution (promise).

  **The Constraint:** You cannot specify the maxim *ad hoc* to escape the test (e.g., "I will break promises only on Tuesdays when I am wearing blue"). The specification must cite a **morally relevant feature** that could plausibly be a universal law. "Saving a life" is a relevant feature; "wanting a concert" is not sufficient to override a constitutive norm.

  Therefore, specification is not smuggling; it is the process of identifying whether your reason for acting is one that *could* hold for everyone without contradiction. The test does not tell you *what* your maxim is; you must tell the truth about why you are acting. The test then tells you if that reason is universalizable.

  ### Summary of the Constructive Project

  The **Principle of Universalizable Agency** reconstructs the categorical imperative not as a logical trick, but as a test of **social and rational viability**.
  1.  It distinguishes **constitutive norms** (promises) from **competitive conventions** (résumés) to handle your intuition on Case 1 vs. 2.
  2.  It distinguishes **availability of aid** from **solicitation of aid** to handle your intuition on Case 3 vs. 5.
  3.  It requires you to revise your intuition on **Reciprocity**, demanding that you acknowledge a duty to support the vulnerable as a condition of rational agency itself.

  This principle is precise enough to apply to new cases: Ask first if the act destroys the rules making it possible (Integrity), and second if the policy behind it removes the means for others to act as rational beings (Sustainability). If either answer is "yes," the action is wrong.
