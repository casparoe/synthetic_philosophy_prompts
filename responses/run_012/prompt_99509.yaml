answer: |-
  The residue between your craft vocabulary and the historians' debate reveals not a thinness in their disagreement but a structural blindness in the novel form, which cannot render impersonal causation without personifying it.

  To restate the quarrel in your terms: the Great Man historian is a writer of character-driven fiction who believes plot is the externalization of will. In their books, the setting is merely a stage waiting for a protagonist to impose order upon it; if you recast the lead, the story collapses because the specific psychology of the leader is the engine of causation. The structural historian is a writer of setting-driven fiction who believes plot is the pressure of environment upon the vessel. In their books, the town, the class, or the season is the protagonist, and the individuals are merely functions of that pressure; if you recast the lead, the story survives because the situation dictates the outcome regardless of who stands in the center. When you feel a novel's middle sagging, you are sensing a conflict between these two modes: the turns are motivated by the world (structural) rather than the person (Great Man), leaving the protagonist passive, which violates the novel's contract of agency even if it satisfies history's contract of determinism.

  Your necessity ledger translates the historians' counterfactual test cleanly only at the scene level. When you ask whether a scene happens if you recast the character, you are accurately measuring agency versus situation. If the scene collapses without that specific character's choice, you have identified a "Great Man" moment; if the scene proceeds regardless of who occupies the role, you have identified a "structural" moment. This is a valid craft analogue for the historical question of contingency. However, the translation distorts at the level of the arc. Your ledger risks certifying as "necessary" what is merely "convenient" for the theme. In a novel, a turn is often marked character-driven because it serves the emotional arc, not because it was causally inevitable. You might log a dictator's rise as character-driven because his ambition fuels the plot, whereas a structuralist would argue his ambition was itself a product of economic collapse. Your ledger captures the *narrative* necessity (the book needs him to be ambitious to sustain the tension) but masks the *historical* necessity (the conditions required an ambitious man). This is where your ledger becomes a counterfeit: it conflates thematic coherence with causal reality.

  There is, however, a significant element of the historians' dispute that has no counterpart in your vocabulary: the problem of scale and the anonymous mass. Historians argue over forces that do not have faces—inflation, demographic shifts, geographic constraints—which cannot be fully rendered in a novel without turning them into plot devices or allegorical characters. Your framework is built on agency, motive, and setting, but it lacks a category for "impersonal causation" that does not resolve into a character's choice or a setting's atmosphere. When a structural historian argues that a revolution was inevitable due to grain prices, they are describing a mechanism that your novel must personify (perhaps a hungry mob or a corrupt merchant) to make legible, thereby silently reintroducing the Great Man theory by giving the structure a face.

  The verdict is that the residue is a defect of the novelist's vocabulary, not evidence that the historians' disagreement is thin. The novel is inherently a Great Man form; even when you write about a town, you view it through specific eyes, which privileges agency and motive by the sheer mechanics of point of view. Your ledger is useful for keeping your story honest to its own internal logic, but it cannot capture the structuralist claim that some events are independent of human will entirely. You are forced to write history as if it were a story, and stories require protagonists, whereas history often runs on autopilot.
