      *   **Great Man Theory (Carlyle, etc.):** History is the biography of great men. Individuals shape events through will, genius, virtue, or vice. Counterfactual: Remove the man, the event changes drastically or doesn't happen.
      *   **Structuralism/Materialism (Marx, Braudel, etc.):** History is driven by forces (economic, social, geographic, demographic). Individuals are epiphenomena or functions of these forces. Counterfactual: Remove the man, someone else fills the role; the event happens anyway.
      *   **The Conflict:** Causation vs. Agency. Necessity vs. Contingency.

  3.  **Translate to Novelistic Craft:**
      *   **Great Man = Character-Driven Plot.** The protagonist's choices dictate the outcome. If you swap the protagonist, the story collapses. The arc is internal will imposed on external world.
      *   **Structuralism = Setting-Driven Plot.** The situation dictates the outcome. The protagonist is a vessel experiencing the pressure. If you swap the protagonist, the story remains largely the same (e.g., *The Wire* vs. a specific detective). The arc is external pressure imposed on internal world.
      *   **Narrative Necessity vs. Historical Causation:** In novels, things happen because they serve the theme/arc. In history, things happen because of cause/effect. This is the crucial friction point.

