answer: |-
  **MEMORANDUM**

  **TO:** Charter Review Commission
  **FROM:** Chair, Charter Review Commission
  **DATE:** [Date]
  **SUBJECT:** Recommendation on the Municipal Franchise Package

  **I. PURPOSE**

  This Thursday, we vote on the franchise package to transmit to the City Council for the November ballot. The package bundles three distinct proposals: lowering the voting age to 16; extending the franchise to all adult residents regardless of citizenship status; and instituting compulsory voting with a civil fine for non-participation.

  Our City Attorney has confirmed we possess the legal authority to enact all three measures. That question is settled. The question remaining for us is one of political philosophy and structural coherence. Are these three proposals compatible? Do they rest on a single theory of democracy, or are they a collection of good ideas that contradict one another when combined?

  This memo outlines my recommendation: we should advance the voting age and non-citizen franchise proposals as a unified "Inclusion Package," but we should separate compulsory voting from this bundle. I further recommend that if compulsory voting is advanced, the fine mechanism must be significantly modified to exclude the newly enfranchised groups. Below, I detail the theoretical tensions, the strongest arguments for the position I oppose, and the specific procedural safeguards we must adopt.

  **II. THEORETICAL COHERENCE**

  We cannot vote on this package without acknowledging that the three proposals rest on different, and potentially conflicting, grounds for the franchise.

  1.  **Voting at 16** presupposes a theory of *capacity and stake*. It argues that the threshold for political competence is lower than we currently assume, and that those subject to municipal authority (in schools, transit, public space) merit a voice.
  2.  **Non-Citizen Franchise** presupposes a theory of *residency and affected interest*. It argues that subjection to local law, not national membership, creates the claim to vote.
  3.  **Compulsory Voting** presupposes a theory of *civic duty and membership*. It argues that voting is not merely a right to be exercised, but an obligation owed to the polity, enforceable by penalty.

  **The Incoherence Problem**
  Proposals 1 and 2 are expansive; they are about *rights* and *access*. They seek to widen the circle of who counts. Proposal 3 is restrictive; it is about *obligation* and *enforcement*. It seeks to mandate behavior within the circle.

  The conflict arises when we impose the obligation (3) on the newly expanded groups (1 and 2). If we justify the vote for non-citizens on the grounds that they are *residents* rather than *members* of the national community, we undermine the logic of fining them for failing to perform a *civic duty* traditionally associated with membership. Similarly, if we justify voting at 16 on the grounds of developing capacity, imposing a civil fine on them treats them as fully liable adults in a way that contradicts their legal status in every other domain of city and state law.

  To restore coherence, we must choose a primary theory. I recommend we prioritize the theory of *Affected Interests* (Proposals 1 and 2). This theory is clean: if you live here and the laws bind you, you should have a say. Compulsory voting muddies this by suggesting you *must* have a say, under penalty of law. Therefore, I recommend we drop Compulsory Voting from this specific charter amendment package, or at minimum, sever it for separate consideration.

  **III. THE CASE FOR COMPULSORY VOTING (A DISSENTING VIEW)**

  I know several colleagues strongly favor keeping the bundle intact. Out of respect for that position, I want to articulate the strongest version of their argument, because it is not without merit.

  The argument for compulsion is not about punishment; it is about legitimacy. A colleague might argue: "If we expand the franchise to include 16-year-olds and non-citizens, we are fundamentally altering the electorate. If we do not require them to vote, we risk creating a class of registered voters who do not participate, which allows opponents to claim these new groups are uninterested or unassimilated. Furthermore, voting is the price of living in a self-governing community. If we accept the benefits of city services, we owe the city the minimal effort of marking a ballot. Without compulsion, we are handing out rights without emphasizing responsibilities. If we want a truly representative democracy, we must ensure the representative sample actually shows up."

  There is weight here. Compulsion does force the political class to appeal to the whole electorate, not just the motivated factions. It treats voting as a public good, like jury duty, rather than a private consumer choice.

  However, even granting these points, the empirical effects of compulsion are contested. Proponents argue it drastically increases turnout and reduces polarization. Critics contend it increases random voting and resentment without deepening civic engagement. Because this is a live disagreement among experts, we should not treat compulsion as a settled fix for low turnout. We should not bundle a contested mechanism for *behavior* with a clear moral imperative for *inclusion*.

  **IV. RECOMMENDATION ON THE BALLOT**

  **1. Advance to Ballot:**
  *   Lowering the voting age to 16.
  *   Extending the franchise to all adult residents (12+ months), regardless of status.

  These two measures belong together. They share the "Affected Interest" theory. They signal that our city is a community of residents, not just a community of citizens.

  **2. Defer or Separate:**
  *   Compulsory Voting.

  This measure should be decoupled. If the Council insists on advancing it, it should be a separate question on the ballot. Voters should be asked if they want to expand the franchise, and separately, if they want to mandate participation. Conflating the two suggests that new voters are being "drafted" rather than "welcomed."

  **V. EXEMPTION SCHEME AND FINES**

  The draft leaves the exemption scheme to us. We must settle this now to guide the Council, even if we recommend separating compulsion.

  **The Exemption Scheme**
  If compulsory voting is enacted, the exemption process must be administrative, not adversarial. We should recommend a "no-questions-asked" objection for conscience or hardship, filed via a simple postcard or web form. Valid exemptions should include:
  *   Illness or disability.
  *   Absence from the municipality on election day.
  *   Religious objection.
  *   Caretaking responsibilities that preclude attendance.
  *   Explicit abstention (marking the "None of the Above" line on the ballot).

  **The Fine and Vulnerable Groups**
  This is critical: **It is indefensible to fine non-citizens or 16-year-olds for abstaining.**

  *   **Non-Citizens:** Imposing a civil fine on a non-citizen for failing to vote creates a perverse incentive. It suggests that while they are welcome to influence our politics, they are also subject to penalties for participating in them. For those with precarious immigration status, any interaction with city civil enforcement carries a chilling risk. To invite them to vote and then fine them for not doing so is coercive.
  *   **16-Year-Olds:** Minors generally lack full legal liability. To grant them the vote based on maturity while imposing financial penalties based on adult liability is inconsistent.

  **Recommendation:** If Compulsory Voting proceeds, the charter amendment must explicitly exempt residents under 18 and non-citizen residents from the civil fine. They may be required to register, but they cannot be penalized for non-participation.

  **VI. THE "BOOTSTRAPPING" PROBLEM**

  We must address an awkward fact: This charter amendment will be decided by the current electorate, which excludes the very people whose standing is at stake. The people who cannot vote are asking for the vote, but only the people who can currently vote get to decide.

  Is this a defect? Yes. It creates a conflict of interest. Incumbent voters may vote against expansion to dilute their own relative power.

  Is there anything worth doing about it? We cannot legally bind the outcome to the approval of the disenfranchised. However, we can mitigate the defect through the ballot language and our public messaging.
  1.  **Ballot Language:** The summary on the ballot must explicitly state: *"This measure extends voting rights to residents currently ineligible to vote."* It should not be buried in legalistic text. The current electorate must know they are voting on their own exclusivity.
  2.  **Public Hearings:** We should recommend the Council hold at least two town halls specifically in neighborhoods with high concentrations of non-citizen residents and high schools, even though those residents cannot vote on the measure. Their testimony must be part of the public record the Council considers.

  We cannot fix the paradox of self-determination, but we can ensure the current electorate makes an informed choice about relinquishing their monopoly.

  **VII. MESSAGE TO THE COUNCIL**

  If the Council decides to split the package, we must advise them on how to do so without undermining the goals.

  *   **If they keep 1 & 2 but drop 3:** This is the preferred outcome. It clarifies the message: "We are a city of residents."
  *   **If they keep 3 but drop 1 & 2:** This should be discouraged. Compulsory voting without franchise expansion reinforces the status quo of who counts as a member.
  *   **If they keep all three:** We must insist on the exemption from fines for 16-year-olds and non-citizens outlined in Section V.

  **VIII. CONCLUSION**

  We have the authority to do all three, but authority is not the same as wisdom. A coherent charter tells a story about who we are. Proposals 1 and 2 tell a story of inclusion. Proposal 3 tells a story of obligation. Telling both stories at once, to the same new groups, risks confusing the welcome with a draft notice.

  I move that we advance the Voting Age and Non-Citizen Franchise proposals as a single ballot measure. I move that we recommend Compulsory Voting be severed for separate consideration, and that if it is not severed, the penalty scheme must exclude the newly enfranchised classes.

  Let us vote on Thursday to send a clear invitation to our neighbors, not a mixed signal.
