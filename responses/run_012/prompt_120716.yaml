answer: |-
  The case
  Consider the city-state of Veridia, a small polity with a written charter, a functioning court system, and a single executive officer called the Protector. In Scenario I, the Protector is elected according to the charter but, after two years, begins executing rivals, confiscating private property, and dissolving the courts to rule by decree. In Scenario II, a general seizes the palace by force, dissolves the charter, and then inflicts the exact same level of execution, confiscation, and legal dissolution. In both scenarios, a private citizen named Marcus, motivated by the common good rather than private vengeance, assassinates the ruler. In both initial scenarios, the objective expected consequences are identical: the ruler's death leads immediately to a provisional council restoring the rule of law without civil war or retaliatory violence. The only variable differing between Scenario I and Scenario II is the legal title by which the ruler held power at the moment of death.

  Verdicts, scenario by scenario
  **Scenario I (Legitimate Tyrant):** Forbidden. Although the ruler violates the common good, he retains legitimate authority derived from the original legal order. Aquinas argues that private individuals cannot judge or execute a public superior because doing so presupposes an authority the private citizen lacks, effectively substituting private judgment for public order. Killing him constitutes sedition, as it disrupts the structural hierarchy even to correct a moral failure within it.

  **Scenario II (Usurper):** Permitted (with uncertainty). Because the ruler seized power without right, he lacks legitimate authority and holds power merely by force. Aquinas suggests that removing such a figure is not sedition, as there is no legitimate order to disrupt; the usurper is morally equivalent to a private aggressor occupying a public role. Therefore, Marcus's act is defense of the community rather than rebellion. *Flag: It is uncertain whether Aquinas explicitly licenses private individuals to kill usurpers, or if he requires some form of public consensus to declare the usurpation; the text implies the act is not unjust, but may not explicitly endorse private execution.*

  **Scenario II-Var (Usurper + Greater Harm):** Forbidden. Keeping the title variable fixed (Usurper), we vary the consequences: here, assassinating the usurper would trigger a factional civil war causing more death and suffering than the tyranny itself. Aquinas's proviso states that even against a tyrant, action is forbidden if the disturbance inflicts greater harm than the tyranny endured. The moral permission granted by the lack of title is overridden by the requirement to protect the common good from greater destruction.

  What does the work
  The operative feature is the legitimacy of title, which changes the moral species of the act from sedition (disordering a legitimate hierarchy) to defense (removing an illegitimate aggressor). If this feature is removed—judging solely by consequences and cruelty—both initial scenarios would be permitted, as the outcomes are identical and beneficial. However, Aquinas forbids Scenario I, demonstrating that title does independent moral work by establishing a shield of authority that consequences alone cannot pierce. Yet, Scenario II-Var shows that title is not sufficient; the consequentialist proviso regarding greater harm can override the permission granted by illegitimate title, indicating that title functions as a threshold condition rather than an absolute trump card.

  A Thomist's reply
  A defender of Aquinas might resist the verdict in Scenario II, arguing that Aquinas never explicitly grants private citizens the right to execute usurpers, but rather suggests that a public authority (if available) should depose them. On this reading, Marcus acts unlawfully in both scenarios because he lacks public authority, meaning the title distinction does not flip the verdict on private killing but rather determines whether the act is sedition or mere homicide. Furthermore, a Thomist might argue that the "Greater Harm" proviso in Scenario II-Var is not a separate constraint but part of the definition of tyranny itself; if removal causes greater harm, the usurper is not truly acting against the common good in a way that permits removal, thus preserving the coherence of the principle without admitting that consequences override title.
