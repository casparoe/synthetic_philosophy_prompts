answer: |-
  Your hunch is robust, but I think it underestimates the verbal component and overestimates the empirical one. Having spent thirty years decomposing variance, you know better than most that a variance component is a local property of a measurement system, not a universal constant. The shouting match persists because one side is treating heritability ($h^2$) as a physical constant (like the charge on an electron) and the other is treating it as a design artefact (like your instrument drift term), while both are secretly arguing about moral responsibility.

  Here is the diagnosis, followed by a concrete proposal for how to test it in your group.

  ### The Diagnosis: Reification masquerading as Empiricism

  You asked if this is verbal, substantive, or a mismatch of questions. It is all three, layered like sediment.

  **1. The Verbal Layer (Larger than you suspect)**
  You suggest the verbal element is small. I would argue it is the primary engine of the conflict, but not merely because of definitions. It is because of *reification*. In your instrument work, if you measure drift, no one assumes the drift is a property of the sample. In behaviour genetics, the statistic $h^2$ (the ratio of genetic variance to total phenotypic variance) is technically defined as a population-specific snapshot. However, the word "heritability" linguistically invites the inference that the *trait itself* is being inherited, rather than the *variance* being accounted for.

  When the behaviour-genetics side says "heritability is well-defined," they are technically correct: it is a ratio of variances in a specific population at a specific time. But when they bring that number into a public or philosophical discussion, they rarely maintain the strict conditional clauses required to keep it accurate. They allow the number to stand in for "genetic determination." The critics hear "genetic determination" and rightly object that the variance ratio says nothing about individual causation. This isn't just innumeracy; it is a category error licensed by the terminology.

  **2. The Substantive Layer (The GxE Structure)**
  You identified the unresolved empirical question about gene-environment interaction (GxE). This is the load-bearing wall. Standard quantitative genetics models (ACE/ADE) often assume additivity to make the variance decomposition solvable. They treat GxE as noise or a separate component that can be isolated.

  The critics' substantive claim is that GxE is not just a separate variance bucket; it is often *non-linear* and *pervasive*. If the effect of a genetic variant depends entirely on a specific environmental trigger that is unevenly distributed, the "genetic variance" term becomes a function of the environmental distribution. If you change the environment (e.g., universal education), the genetic variance can vanish or explode.

  The behaviour-genetics side often concedes this in principle but argues that in *actual* measured populations, the additive term dominates. The critics argue that the additive term is only dominant because we are sampling restricted environmental ranges (e.g., WEIRD populations). This is a factual dispute, but it is currently unresolvable because we cannot ethically randomise humans to the wide environmental ranges required to test the stability of the $h^2$ estimate.

  **3. The Values Layer (The Proxy)**
  Finally, the shouting happens because the statistic is being used to settle a normative question: "Is inequality inevitable?" If $h^2$ is high, the implicit inference is that intervention is futile. If low, intervention is promising. The behaviour-genetics side wants the number to be respected as a neutral fact; the critics want to prevent the number from being used as a political shield. Because the number *cannot* answer the intervention question (variance decomposition does not predict response to intervention unless the underlying causal structure is additive and stable), the argument spins.

  ### Pushing on Your Hunch

  You suspect the core is the mismatch between the question the statistic answers and the question the room is arguing about. I agree, but I would sharpen it: **The statistic answers a question about *difference*, but the room is arguing about *change*.**

  Heritability explains why Person A differs from Person B *now*, in *this* context. It does not explain how to change Person A's trait, nor does it predict what happens if you change the context. Your chemistry background serves you well here: knowing that 80% of the variance in your readings is due to sample heterogeneity doesn't tell you how to calibrate the machine, nor does it tell you if the sample would look homogeneous under a different microscope.

  The unresolved empirical issue is not just the *size* of the interaction effect, but the *stability* of the causal graph. If the causal graph changes when you intervene (which GxE implies it does), then the variance component is not portable. The behaviour-genetics side wants to treat the component as portable; the critics know it isn't.

  ### What Counts as Progress?

  You want to know if you can make headway next month or if you are doomed to repeat the same five exchanges. Do not look for a verdict on the estimates. Look for a change in the *grammar* of the argument.

  Here are three concrete moves to propose. If the group can adopt these, you have made progress. If they refuse, the disagreement is values-based and will not be resolved by data.

  **1. The "Portability Proviso"**
  Agree that no one may cite a heritability estimate without immediately stating the range of environments sampled.
  *   *Current state:* "Height is 80% heritable."
  *   *Required state:* "Height is 80% heritable *in this population, given the current range of nutritional and environmental variance*."
  *   *The Test:* If the behaviour-genetics side objects that this is pedantic, they are treating the statistic as a constant. If the critics accept this phrasing but still argue, the dispute is genuinely about GxE magnitude.

  **2. The "Intervention Ban"**
  Ban the use of heritability estimates to make claims about the efficacy of intervention.
  *   *The Rule:* You cannot move from "$h^2$ is high" to "intervention won't work." You must provide a separate causal model for that.
  *   *The Test:* PKU (phenylketonuria) is 100% genetic in origin, yet 100% treatable by diet. High heritability is compatible with high malleability. If a participant claims high heritability implies fixed traits, they have failed the test. This isolates the values/ideology from the statistics.

  **3. The "Variance vs. Mechanism" Distinction**
  Require that any claim about "why people differ" specifies whether they are talking about *variance attribution* (the statistic) or *causal mechanism* (the biology).
  *   *The Test:* GWAS finds hundreds of tiny effects. The behaviour-genetics side says "See, it's polygenic." The critics say "See, it's context-dependent."
  *   *Progress:* Progress is made if they can agree that GWAS identifies *predictors* within a population, but not necessarily *causes* that operate independently of the environment. If they can agree that a "genetic effect" is actually a "gene-environment correlation" that holds stable in the current setting, the shouting will diminish.

  ### Summary for Your Group

  Next time the shouting starts, try this intervention:

  > "We are arguing past each other because one side is treating heritability as a measure of *causal strength* and the other as a measure of *variance explanation*. In my old work, a variance component told me about my experimental setup, not the sample's intrinsic nature. Can we agree that this number tells us about the *population's current structure*, not the *trait's fixed potential*? If we agree on that, do we still disagree about the size of the interaction effects, or are we now just arguing about whether we *want* these numbers to be used for policy?"

  If they can separate the *statistical validity* (is the number right for this sample?) from the *inferential validity* (does this number apply elsewhere or imply immutability?), you will have cleared the verbal fog. If they cannot, you have diagnosed the problem as ideological: the number is being weaponised, and no amount of variance decomposition will disarm it.

  In short: The disagreement is verbal in origin, substantive in its middle layer, and values-based in its conclusion. You will only make progress if you force the group to decouple the statistical definition from the causal implication. If they refuse to decouple them, the argument is not about science; it is about legitimacy.
