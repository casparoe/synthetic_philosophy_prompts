  *   **Rule 2 (Knowable Algorithm) Prediction:** **"Undecided" or "Could be me."** The total process is *not* generated by a computable algorithm alone; it depends on the logician's free choices via the phone. There is no fixed rule governing the total growth. Therefore, the "Knowable Algorithm" objection does not apply. This case separates the "momentary mechanism" view from the "total process" view.
