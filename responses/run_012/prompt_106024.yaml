  **Recommendation**

  The Committee recommends adopting the singular *they* as the default third-person singular for unspecified persons and prohibiting *guys* and *freshman* in official university documents, effective Fall 2025. Regarding the writing-program re-substitution exercise, we rule that Tier (iii) voiced texts are admissible provided they meet a strict legibility standard. The exercise may continue under these conditions. Departments must revise assignment prompts by August 1. We will review the impact of these changes at the end of the academic year.

  **The question before us**

  This five-year revision presents two distinct but philosophically linked challenges regarding language and community standards. Part One concerns false generics: linguistic forms that treat one group as the default human experience. Beyond established prohibitions on *man* and generic *he*, we must rule on *guys* when addressing mixed groups, the use of *freshman*, and the mandate of singular *they*. Part Two concerns pedagogical method: specifically, the re-substitution exercise used to satisfy the writing requirement. Following an incident last term where a student's satirical text circulated without its pedagogical frame, causing genuine distress and external complaint, we must determine whether such exercises constitute prohibited group-directed invective or permissible critical analysis. The core question is whether the university style guide should regulate not only official output but also the mechanisms by which students learn to critique language itself. We must decide if the risk of misunderstanding outweighs the pedagogical value of simulating bias.

  **What the exercise does**

  The exercise relies on a specific mechanism of defamiliarization rooted in Hofstadter's satire. Students read a mock polemic that swaps race terms for sex terms to expose the invisibility of masculine defaults. They then produce a "flip," substituting a different category into a text that treats another category as normative. The pedagogical goal is not merely to identify biased language but to feel the friction of its operation. A style rule forbids *chairman*; this exercise forces the student to write *chairwhite*, making the absurdity visceral rather than abstract. For the trick to work, the reader must recognize the swap immediately. The shock depends on the reader understanding the original default and seeing the substitution as a violation. This requires a reader who shares enough linguistic competence to recognize the norm being broken. The lesson is that defaults are not neutral; they are felt structures. A rule tells students what not to write; this exercise teaches them why the prohibition exists by simulating the exclusion inherent in the default form. It moves compliance into critical awareness, ensuring students understand the social weight of grammar rather than just memorizing prohibitions. The cognitive shift occurs when the reader feels the exclusion personally, transforming abstract policy into lived experience.

  **The case for prohibition**

  The argument for prohibition rests on the reality of harm regardless of intent. When a student produces text that mimics hate speech or slurs, even for critique, the text itself carries a risk of injury. As the recent incident demonstrated, pedagogical frames are fragile; screenshots strip away context, leaving only the offensive surface. A hostile reader can weaponize the student's words against them or the institution, regardless of the accompanying commentary. Furthermore, requiring students to produce group-directed invective places an undue burden on those belonging to the targeted categories. Asking a student to write satire involving religion, race, or sex forces them to engage with trauma as a condition of grading. The distinction between analyzing a slur and voicing one is theoretically clear but practically porous. If the output looks like harassment, it functions like harassment in the public sphere. The university has a duty to protect students from being compelled to generate material that can be used as evidence of bias against them. Safety must trump pedagogical experimentation when the experiment involves simulating oppression, because the damage occurs at the moment of reading, not the moment of writing. Petitioners argue this constitutes coerced speech that endangers their enrollment.

  **The case for keeping it, with conditions**

  The argument for retention contends that critical awareness requires more than compliance. Banning the exercise protects students from offense but denies them the tool to understand how offense is structurally generated. The satire works precisely because it is uncomfortable; sanitizing it removes its efficacy. The distinction between Tier (i) and Tier (iii) is crucial: one asserts bias, the other exposes it. To forbid the latter is to treat all usage of marked language as equivalent, collapsing the difference between hate speech and the analysis of hate speech. Moreover, the risk of context collapse is manageable through rigorous design. If the text itself signals its satirical nature, it resists decontextualization. The university should not retreat from difficult pedagogical tools simply because they can be misunderstood by bad-faith actors. To do so would limit the writing program to safe, superficial topics. The exercise teaches students to navigate complex rhetorical situations, a core competency. Removing it privileges comfort over critical rigor and assumes students cannot handle the weight of the language they are learning to critique. We must prepare them for a world where language is weaponized, not shield them from its mechanics.

  **Decision and operative criteria**

  We rule that Tier (iii) texts are admissible, but only under the mandatory legibility test. The non-appropriation test will not be adopted as a hard prohibition, though instructors must consider it in design. We reject non-appropriation as a binding rule because policing student identity relative to assignment topics creates administrative burdens and limits the pedagogical value of empathy; requiring disclosure of identity to qualify for an assignment violates privacy. The legibility test requires that a reader unfamiliar with the assignment must identify the text as satire or analysis without external help. The text must carry its own frame. This answers the strongest case against us: that context collapse is inevitable. We agree that external frames fail. Therefore, the text must be self-marking. If a flip reads as genuine invective without the syllabus, it is forbidden. This shifts the burden from the reader's knowledge to the writer's craft. Regarding Part One, we adopt the singular *they* as the default for unspecified persons. We acknowledge the objection that this installs a new default, but note that singular *they* lacks the gendered exclusion of *he*. We also prohibit *guys* for mixed groups and *freshman* in official documents, favoring *first-year*. These rules align with the exercise's goal: making defaults visible. Departments must ensure assignment prompts require students to embed signaling devices—titles, prefaces, or stylistic markers—that satisfy legibility. Failure to meet this standard renders the text non-compliant with university style, regardless of intent.

  **Implementation**

  The Writing Program Director will revise assignment guidelines to incorporate the legibility standard by August 1. The Committee on Language and Usage will distribute the updated style guide to all departments by July 15. Instructors using re-substitution exercises must submit sample prompts for review by August 15. We will convene a special review session at the end of the academic year to assess whether the legibility standard has prevented context collapse and to evaluate the uptake of the new generic terms. Compliance will be monitored through the annual curriculum review process.
