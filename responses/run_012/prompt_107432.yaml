prompt: |-
  I need to write a short research proposal (4-6 pages) for a metaphysics workshop and I have a half-formed idea I'd like you to turn into something with a real shape.

  The topic is origin essentialism — the claim that you couldn't have come from a different sperm and egg, that your actual origins are essential to you. You know the standard arguments. Here's my wrinkle: nearly all of that discussion assumes there's a clean fact of the matter about which zygote a given person is. But there are actual people who are tetragametic chimeras — two separately fertilised eggs fuse early on, and one body ends up carrying two distinct cell lines and two genomes. So: which sperm and egg is that person essentially from? The lineage that ended up forming the germ cells? The one that's more widespread through the body? Both? Neither? And does the question even have an answer?

  What I want from the proposal: state the question so it has a determinate answer — something like, does origin essentialism as normally stated survive cases where the biological individuation of the organism is itself ambiguous, or does it quietly presuppose a criterion of organismic unity that it never argues for? Then say why the existing positions leave this open — why you can't just say "well, the origin is whichever zygote..." without begging the question. Then the method: I'd work though a taxonomy of fusion and twinning cases, and for each one see what the essentialist is forced to say, and whether the disjunction of those answers is stable or collapses. Then what a result would look like, and what would count as the project failing — e.g. if the essentialist can just relocate "origin" to the level of the whole causal chain rather than the gametes, and that move isn't ad hoc, then I've probably failed.

  Be honest about scope, this is one semester and not a book. No reading list or citations, I'll handle those myself. And if you think the whole angle is confused — maybe origin essentialism was never really about gametes in the first place — say so, that's useful to know.
