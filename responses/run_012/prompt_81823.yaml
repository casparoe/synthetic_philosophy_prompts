prompt: |-
  ok so I'm running a reading group on the problem of universals next term and I want to hand out a proper desiderata sheet instead of the usual 'one over many, therefore realism' thing everyone already knows. I dont want the standard three-item list. I want the full spec: what any adequate theory of properties/universals has to deliver, each requirement tied to the case or consideration that forces it, and then your call on which requirements are negotiable and which arent.

  Things I want on the list (add whatever I'm missing, but these are the ones I care about):

  - impure / haecceitistic properties: being identical to a particular, being a mile from the Eiffel Tower, being such that Sally is taller than you. Any theory that only handles 'pure' universals has to say something about these, and they look like properties in every syntactic and inferential way.
  - the determinable/determinate family structure: scarlet is a way of being red, and something can be red and scarlet at once but not red and blue all at once, which a mere class of red things can't obviously reproduce.
  - Boolean structure: properties seem closed under conjunction, negation, disjunction, but sparse-property people deny most of those are properties, so say what the theory is supposed to do here.
  - second-order properties and quantification over properties, since the theory is meant to underwrite talk about being a colour or being a fundamental property.
  - relations, not just monadic properties -- and specifically the problem that a relation's instances seem to need to be 'together' in a way the theory has to explain.
  - Bradley-style regress worries about instantiation and compresence, and whether the theory needs a primitive that just relabels the problem.
  - empty predicates: there could be a predicate with no instances, and the theory has to say whether it expresses a property.
  - the sparse/abundant divide and where the theory is allowed to draw it -- I think this one kills more views than any other, so be honest about it.
  - Cambridge properties, since if those count then almost anything goes and parsimony is dead.

  Then the part I really want: which of these can't be had together? I suspect determinable/determinate + full Boolean closure + sparse properties is jointly unsatisfiable, but tell me if I'm wrong, and which other pairs break. Also flag any requirement I've smuggled in from one camp that a rival would just reject -- I'd rather know it's a prejudice of one side than have it quietly doing the excluding work.

  Then briefly score the usual suspects against the list -- Armstrong-style immanent universals, transcendent/Platonic ones, trope theory with primitive resemblance, class nominalism, resemblance nominalism, structural universals -- a line or two each on what they get right and which requirement they most clearly fail. Keep the scoring short, the desiderata are the deliverable. Purpose, in case it matters: I want a theory good enough to do two jobs at once, grounding a Humean best-system account of laws and supporting reference magnetism in metasemantics, so if those two pull the desiderata in different directions, say so.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata sheet:

  1.  **Analyze the Request:**
      *   **Task:** Create a "proper desiderata sheet" for a reading group on the problem of universals.
      *   **Goal:** Move beyond the standard "One Over Many" argument. Provide a full specification of what an adequate theory of properties must deliver.
      *   **Specific Requirements:** Include specific topics requested by the user (impure properties, determinables, Boolean structure, 2nd-order quantification, relations, Bradley's Regress, empty predicates, sparse/abundant, Cambridge properties).
      *   **Critical Analysis:** Identify incompatibilities/trade-offs between desiderata. Flag question-begging requirements.
      *   **Evaluation:** Briefly score standard theories (Armstrong, Platonism, Trope, Nominalisms, Structural Universals) against the list.
      *   **Specific Purpose:** The theory needs to support *both* Humean Best System Laws (BSA) and Reference Magnetism (Lewisian metasemantics). This is a crucial constraint for the final analysis.
      *   **Tone:** Academic, rigorous, direct, slightly opinionated (as requested: "your call on which requirements are negotiable").

  2.  **Deconstruct the Desiderata (Drafting the List):**
      *   *One Over Many:* User wants to skip the standard version, but it's the core motivation. I should reframe it as "Predicability" or "Qualitative Recurrence" to make it less trivial.
      *   *Impure/Haecceitistic:* Properties involving specific individuals (e.g., *being next to Socrates*).
      *   *Determinable/Determinate:* The hierarchy problem (Red vs. Scarlet).
      *   *Boolean Structure:* Conjunction, Negation, Disjunction. (Sparse vs. Abundant tension).
      *   *Second-Order:* Quantifying over properties (e.g., "Red is a color").
      *   *Relations:* Polyadic properties and the "togetherness" problem.
      *   *Bradley's Regress:* Instantiation/Exemplification.
      *   *Empty Predicates:* Do uninstantiated properties exist?
      *   *Sparse/Abundant:* The carving nature at the joints vs. semantic coverage.
      *   *Cambridge Properties:* "Being grue," "being such that 2+2=4."

  3.  **Identify Incompatibilities & Trade-offs (The "Hard Part"):**
      *   *Sparse + Boolean:* If properties are sparse (natural), they aren't closed under negation (what is the natural property of *not* being an electron?). So, Sparse + Full Boolean is impossible.
      *   *Sparse + Determinables:* If Scarlet is sparse, is Red? Usually, determinables are less natural than determinates. A theory needs to explain the relationship without bloating the sparse realm.
      *   *Impure + Sparse:* Haecceitistic properties are rarely "natural" in the scientific sense. If you want them for semantics, you need abundant properties.
      *   *BSA + Reference Magnetism:* This is the user's specific purpose.
          *   BSA (Lewis/Humean) usually prefers *sparse* properties for the best system (laws summarize patterns of natural properties).
          *   Reference Magnetism requires *sparse* properties to fix reference (candidates for reference must be eligible).
          *   *Conflict:* BSA needs properties to be instantiated (Humean supervenience). Reference Magnetism can work with uninstantiated properties (eligibility). But the real tension is between *Abundance* (needed for semantics of complex predicates) and *Sparsity* (needed for laws and magnetism).
          *   *Resolution:* Lewis's two-class system (Perfectly Natural vs. Abundant). But the user wants to know if they pull in different directions. They do if you try to make *all* properties natural.

  4.  **Flagging Question-Begging Requirements:**
      *   "Boolean Closure" assumes properties correspond to predicates. Nominalists might deny this.
      *   "Second-Order Quantification" assumes properties are values of variables. Nominalists use substitutional quantification or paraphrase.
      *   "Bradley's Regress" assumes instantiation is a relation. Some deny this category mistake.

  5.  **Scoring the Theories:**
      *   *Armstrong (Immanent Realism):* Good on Sparse, Relations, BSA. Bad on Empty Predicates (no uninstantiated universals), Bad on Determinables (needs primitive).
      *   *Platonism (Transcendent):* Good on Empty, 2nd Order, Boolean (via sets/concepts). Bad on BSA (causal isolation), Bad on Instantiation (Bradley's regress worse).
      *   *Trope Theory:* Good on Particulars, Relations (as bundles). Bad on Recurrence (needs resemblance classes), Bad on BSA (laws govern tropes?).
      *   *Class Nominalism:* Good on Boolean (set theory). Bad on Sparse (all sets equal), Bad on Empty (empty set is one, but predicates vary), Bad on Modality (essential properties).
      *   *Resemblance Nominalism:* Good on Sparse (resemblance circles). Bad on Bradley (resemblance is a relation), Bad on Determinables.
      *   *Structural Universals:* Good on Determinables/Relations. Bad on Parsimony (magic), Bad on Bradley.

  6.  **Refining for the User's Purpose (BSA + Magnetism):**
      *   This combination screams **Lewisian Realism** (Immanent or Transcendent doesn't matter as much as the Sparse/Abundant distinction).
      *   However, Lewis is a Trope theorist (in some readings) or Class Nominalist regarding abundance, but Realist about Natural Properties.
      *   Actually, Lewis is a *Realist about Universals*? No, Lewis is a *Trope Theorist* (usually) or *Class Nominalist* for abundance, but *Realist* about Perfectly Natural Properties. Wait, Lewis is technically a *Trope Theorist* in "New Work for a Theory of Universals" but treats natural properties as classes of tropes.
      *   *Correction:* For BSA + Magnetism, you fundamentally need **Perfectly Natural Properties**. Whether they are universals, tropes, or primitives matters less than their *sparsity*.
      *   *Tension:* BSA needs the properties to be *instantiated* (Humean mosaic). Magnetism needs them to be *eligible* (can be uninstantiated).
      *   *Impure Properties:* Bad for BSA (laws shouldn't mention Socrates). Bad for Magnetism (reference isn't fixed by haecceities usually).
      *   *Cambridge Properties:* Terrible for BSA. Irrelevant for Magnetism.

  7.  **Drafting the Content (Iterative refinement):**
      *   *Structure:*
          1.  Introduction (Setting the stage).
          2.  The Desiderata (The List).
          3.  The Incompatibility Matrix (Trade-offs).
          4.  Question-Begging Flags.
          5.  Theory Scorecard.
          6.  The "Two Jobs" Constraint (BSA + Magnetism).
      *   *Tone Check:* Ensure it sounds like a handout for a serious grad/advanced undergrad group. Not too dry, but precise.
      *   *Specific User Request:* "I want the full spec... each requirement tied to the case or consideration that forces it." I need to make sure the *motivation* for each desideratum is clear.

  8.  **Final Review against Constraints:**
      *   Did I include Impure? Yes.
      *   Determinables? Yes.
      *   Boolean? Yes.
      *   2nd Order? Yes.
      *   Relations? Yes.
      *   Bradley? Yes.
      *   Empty? Yes.
      *   Sparse/Abundant? Yes.
      *   Cambridge? Yes.
      *   Incompatibilities? Yes.
      *   Scorecard? Yes.
      *   BSA/Magnetism tension? Yes.

      *Self-Correction on Lewis:* Lewis is often classified as a Class Nominalist about *abundant* properties but a Realist about *natural* properties (which are classes of tropes or universals depending on the phase). For the scorecard, I should stick to the standard "Lewisian Realism" (Natural Properties + Class Nominalism for the rest) or treat him under Armstrong/Platonism depending on the specific metaphysics. I will treat "Lewisian Natural Property Realism" as a distinct entry or fold it into Armstrong/Platonism with caveats. Actually, the prompt asks for "Armstrong-style, Transcendent, Trope, Class Nominalism, Resemblance, Structural". I will fit Lewis into those categories where appropriate (usually Trope or Class Nominalism with a natural property primitive). I'll stick to the prompt's list for the scorecard to avoid confusion, but address the BSA/Magnetism issue in the final section.

      *Refining the "Incompatibility" section:* The user suspects Determinable + Boolean + Sparse is unsatisfiable. I need to confirm this. If properties are sparse, *not-F* is rarely sparse. If *Scarlet* is sparse, *Red* might not be. If *Red* is sparse, *Scarlet* might be a conjunctive property of *Red* + *Shape*. It's a known tension. I will validate the user's suspicion.

      *Refining "Impure":* These are crucial for the "Two Jobs". BSA hates them (no particular constants in laws). Magnetism might need them for indexicals, but generally prefers natural kinds. I should highlight this.

      *Refining "Bradley's Regress":* Make sure to distinguish between the regress of instantiation and the regress of relations (unity of the proposition).

