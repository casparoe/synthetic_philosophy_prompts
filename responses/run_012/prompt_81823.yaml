answer: |-
  # Desiderata for a Theory of Properties
  **Reading Group Handout | Term: [Insert Term]**

  ## I. The Specification List
  A theory of properties is not just an answer to "What is redness?" It is an ontology meant to underwrite predication, laws, modality, and semantics. Below are the ten functional requirements any adequate theory must address. Each is tied to the specific philosophical pressure that forces it onto the table.

  | # | Desideratum | The Pressure / Motivation |
  | :--- | :--- | :--- |
  | **1** | **Qualitative Recurrence** (The Non-Trivial One-Over-Many) | **Motivation:** Distinct particulars share genuine identity in nature. <br>**Requirement:** The theory must explain how two distinct things can be *numerically distinct* yet *qualitatively identical* without reducing the identity to brute similarity or linguistic convention. |
  | **2** | **Impure / Haecceitistic Properties** | **Motivation:** Predicates like "is identical to Socrates" or "is 1 mile from the Eiffel Tower" function syntactically and inferentially exactly like pure properties. <br>**Requirement:** The theory must account for properties that involve specific individuals. If it excludes them, it must explain why they are not properties despite passing all linguistic tests. |
  | **3** | **Determinable/Determinate Structure** | **Motivation:** *Scarlet* entails *Red*, but they are not identical. Something can be both, but nothing can be *Red* and *Blue*. <br>**Requirement:** The theory must model the non-Boolean hierarchy of properties. A set-theoretic subset model often fails here (if Scarlet ⊂ Red, being Scarlet is just being Red + X, but what is X?). |
  | **4** | **Boolean Closure** | **Motivation:** Logic operates on predicates. If *F* and *G* are properties, *F & G*, *F ∨ G*, and *¬F* seem to be as well. <br>**Requirement:** The theory must state whether properties are closed under Boolean operations. If not (e.g., Sparse Realism), it must explain the semantic status of complex predicates that fail to pick out properties. |
  | **5** | **Second-Order Quantification** | **Motivation:** We say "Red is a color" or "There is a property they share." <br>**Requirement:** The theory must provide values for bound variables in second-order logic. It must distinguish between quantifying over *all* properties vs. *natural* properties. |
  | **6** | **Relations & Togetherness** | **Motivation:** Relations (e.g., *Loves*) hold between particulars. Unlike monadic properties, relations require an account of order (aRb ≠ bRa) and the "unity" of the relata. <br>**Requirement:** The theory must explain how a relation ties its terms together without collapsing into a monadic property of a mereological sum. |
  | **7** | **Bradley's Regress (Instantiation)** | **Motivation:** If *a* is *F*, what connects *a* to *F*? If a connector *I* is required, what connects *a*, *F*, and *I*? <br>**Requirement:** The theory must either accept a primitive instantiation relation, deny the category mistake (relations don't need relating), or offer a regress-stopper. It cannot simply relabel the problem. |
  | **8** | **Empty Predicates** | **Motivation:** "Is a witch" or "Is a phlogiston carrier" are meaningful predicates with no instances. <br>**Requirement:** The theory must decide if uninstantiated properties exist. If yes, how do they relate to the actual world? If no, how is the predicate meaningful? |
  | **9** | **The Sparse/Abundant Divide** | **Motivation:** Science carves nature at the joints; language does not. *Being an electron* is different from *being grue*. <br>**Requirement:** The theory must locate the boundary between *natural* (sparse) properties and *mere* (abundant) properties. It must explain what makes the sparse ones special (e.g., causal powers, similarity, lawhood). |
  | **10** | **Cambridge Properties** | **Motivation:** "Being such that 2+2=4" or "Being grue" change truth values without intrinsic change in the object. <br>**Requirement:** The theory must exclude these from the fundamental ontology without denying the truth of sentences employing them. |

  ---

  ## II. Incompatibilities & Trade-Offs
  You suspected that **Determinables + Boolean Closure + Sparsity** is jointly unsatisfiable. You are correct, with caveats. Here is the conflict matrix:

  1.  **Sparsity vs. Boolean Closure:**
      *   **Conflict:** If properties are sparse (carving nature at the joints), they are **not** closed under negation. There is no natural property corresponding to *not-being-an-electron*. There is no natural property corresponding to *being-an-electron-or-a-guitar*.
      *   **Verdict:** You must choose. Either accept an abundant ontology (Class Nominalism, Platonism) where Boolean closure holds trivially, or accept a Sparse Realism (Armstrong, Lewis) where Boolean operations yield *predicates* but not *properties*.
      *   **Negotiable?** Boolean closure is negotiable (semantic vs. ontological distinction). Sparsity is non-negotiable for scientific realism.

  2.  **Sparsity vs. Determinables:**
      *   **Conflict:** If *Scarlet* is a sparse universal, is *Red*? Usually, determinates are more fundamental than determinables. If *Red* is also sparse, you have overdetermination. If *Red* is not sparse, how does it ground the similarity between *Scarlet* and *Crimson*?
      *   **Verdict:** Most Sparse Realists treat determinables as constructed from determinates (via partial identity or resemblance), but this struggles with the "determinate exclusion principle" (why can't something be Scarlet and Blue?).
      *   **Negotiable?** The status of determinables is negotiable; their structural behavior is not.

  3.  **Impure Properties vs. Humean Laws (BSA):**
      *   **Conflict:** Impure properties (e.g., *being next to Socrates*) are rarely, if ever, candidates for the "Best System." Laws should not mention particular individuals.
      *   **Verdict:** If your goal is grounding laws, Impure Properties must be demoted to abundant/derivative status.
      *   **Negotiable?** Impure properties are negotiable for metaphysics, but hard to eliminate from semantics.

  4.  **Relations vs. Immanent Realism:**
      *   **Conflict:** If universals are wholly present in their instances, how can one universal be wholly present in *a* and *b* simultaneously while maintaining order (aRb)?
      *   **Verdict:** Immanent Realists (Armstrong) must treat relations as "tied" universals, which risks collapsing into a particularized relation (trope).
      *   **Negotiable?** The "wholly present" clause is the casualty here.

  ### ⚠️ Question-Begging Flags
  Be aware that some desiderata smuggle in Realist assumptions. A Nominalist will reject these as demands rather than data:
  *   **Second-Order Quantification:** Nominalists argue this is substitutional or paraphrasable. Demanding *values* for these variables assumes properties exist.
  *   **Bradley's Regress:** Assumes instantiation is a *relation*. If instantiation is a non-relational tie (Fregean unsaturatedness), the regress doesn't start.
  *   **Empty Predicates:** Assumes meaning requires reference. Use-theorists or conceptualists deny this.

  ---

  ## III. Theory Scorecard
  Brief evaluation of standard contenders against the Desiderata.

  | Theory | Strengths | Critical Failure Point |
  | :--- | :--- | :--- |
  | **Armstrong (Immanent Realism)** | Excellent on **Sparsity** and **Laws** (states of affairs). Handles **Relations** via polyadic universals. | Fails **Empty Predicates** (no uninstantiated universals). Struggles with **Determinables** (requires primitive partial identity). |
  | **Platonism (Transcendent)** | Handles **Empty Predicates**, **Boolean Closure**, and **2nd-Order Quant** effortlessly (set-theoretic). | Fails **BSA/Laws** (causal isolation problem). **Bradley's Regress** is worse (gap between realm of forms and world). |
  | **Trope Theory (Resemblance)** | Excellent on **Particulars** and **Causal Powers**. Avoids **Bradley's Regress** (tropes are property-particulars). | Struggles with **Recurrence** (resemblance is primitive or circular). **Laws** become relations between trope classes (awkward). |
  | **Class Nominalism** | Trivially satisfies **Boolean Closure** and **2nd-Order Quant** (set theory). | Fails **Sparsity** (all sets are equal ontologically). Fails **Modality** (essential properties vary across worlds). |
  | **Resemblance Nominalism** | Good on **Sparsity** (resemblance circles). Avoids abstracta. | **Bradley's Regress** returns for the resemblance relation itself. Fails **Determinables** (structure of resemblance is vague). |
  | **Structural Universals** | Best attempt at **Determinables** and **Relations** (mereological structure). | **Magic/Parsimony.** How does a universal have parts? Violates **Sparsity** (bloated ontology). |

  ---

  ## IV. The "Two Jobs" Constraint: BSA + Reference Magnetism
  You specified the theory must ground a **Humean Best-System Account (BSA)** of laws and support **Lewisian Reference Magnetism**. This creates a specific tension.

  1.  **The Convergence:** Both jobs require **Sparse (Perfectly Natural) Properties**.
      *   **BSA:** The Best System summarizes the *natural* patterns, not the gerrymandered ones.
      *   **Magnetism:** Reference is fixed by the most *eligible* (natural) candidates.
      *   *Result:* You cannot be a Class Nominalist or a pure Resemblance Nominalist. You need a realism about natural properties (Armstrong or Lewis-style).

  2.  **The Divergence:**
      *   **BSA requires Instantiation:** Humean supervenience demands the mosaic be made of *actually instantiated* qualities. Uninstantiated universals do no work for the Humean.
      *   **Magnetism allows Eligibility without Instantiation:** A property can be a reference magnet even if nothing currently falls under it (it fixes the *meaning* of the term).
      *   **Impure Properties:** BSA strictly excludes them from the Best System (laws are general). Magnetism *might* need them for indexicals ("I", "Here"), but generally prefers natural kinds.
      *   **Boolean Structure:** BSA rejects Boolean closure for natural properties (no law of *not-electron*). Magnetism needs Boolean closure for semantic compositionality (we can understand "non-electron").

  3.  **The Verdict for Your Group:**
      To satisfy both, you need a **Two-Class Ontology** (Lewis's "New Work" model):
      *   **Fundamental:** Sparse, Immanent (or Trope-like), Instantiated only. (Satisfies BSA).
      *   **Derivative:** Abundant, Set-Theoretic constructions of the fundamental. (Satisfies Semantics/Magnetism/Boolean Closure).
      *   **The Cost:** You must accept that "properties" is an ambiguous term. The *metaphysical* properties (for laws) are not the *semantic* properties (for reference). If your reading group wants a unified single-category ontology, **this dual purpose is impossible.**

  **Recommendation:** Start the term with **Lewis's "New Work for a Theory of Universals"**. It explicitly tackles the Sparse/Abundant split required to make BSA and Magnetism compatible, and it forces the group to confront the "Two-Class" solution as the only viable escape from the Incompatibility Matrix.
