prompt: |-
  I'm prepping a podcast interview with a philosopher who defends a view she calls the lexical floor, and I want questions that don't just let her restate it. The view, roughly: theres a level of suffering — she refuses to say where it sits and calls the demand for a number a category mistake — above which any suffering is lexically worse than anything below it, so no amount of pleasure, and no amount of minor suffering avoided, can compensate; below the floor pleasure and suffering do trade off, and the trade-offs are determinate, but she denies there's any common unit, on the grounds that comparability is weaker than commensurability.

  Draft me eight to ten questions. I want at least one each on (a) whether refusing to locate the floor makes the view unfalsifiable, or whether she's just an ordinary negative utilitarian with extra steps; (b) the comparability/commensurability move — hand her a pair of cases where the trade-off seems to flip with context and make her say what's supposed to fix it; and (c) aggregation — whether a very large number of sub-floor annoyances could ever outweigh one above-floor agony, and what she tells someone who finds her answer monstrous. For each question, give me the follow-up keyed to the answer she's most likely to give. No warm-ups about how she got into philosophy, and end with one that forces her to name something that would change her mind.
