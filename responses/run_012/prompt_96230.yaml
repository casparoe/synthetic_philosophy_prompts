      *Wait, one nuance on Case 6 (Rennie).* If he stole it, is the statue a lie? The user says "Change plaque, keep statue." This implies the statue represents the *invention*, not just the man. Or that the man is still locally significant despite the theft. I need to respect the user's gut here but probe it. Actually, the user says "1 and 6 look like the same case... and I've definitely got them opposite." I need to explain *why* they might be different morally, or tell the user to align them.
      *   *Argument:* Slavery is a systemic crime against humanity. Plagiarism is interpersonal/professional. The "harm" clause differentiates them.
