      *   *Check:* Did I tell them which verdict to drop? I should suggest the Bench verdict might need aligning with the principle (Plaque off).
      *   *Check:* Case 8 (Vek). User wants it down because council maintaining it implies endorsement. This fits the "State Honour" argument.
      *   *Check:* Case 7 (Gibbons). It's a fossil. Fits "Historical Record" without "Honour".

  7.  **Final Polish:** Ensure the tone is encouraging. The student is doing the right thing by questioning their intuitions. The "gut" is often processed theory anyway.

      *Key distinction to highlight:* **Commemoration vs. Celebration.**
      *   Commemoration = "This happened/This person existed." (Can be tragic, neutral, or cautionary).
      *   Celebration = "This person was good/We should be like them." (Requires moral vetting).

      *Let's structure the response:*
