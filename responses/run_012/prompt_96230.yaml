answer: |-
  First, take a breath. The fact that you are nodding along in seminars without knowing what you think is not a failure; it is the necessary first stage of actually learning the subject. You have moved from passive absorption to active friction. That is where the work begins.

  Your intuitions are actually quite sophisticated, even if they feel contradictory. You are instinctively applying different ethical frameworks to different types of objects without realising it. The confusion arises because you are trying to find a single rule for a problem that requires a taxonomy.

  Here is an analysis of your working theories, a proposed framework to rationalise your verdicts, and an assessment of the costs involved.

  ### 1. Critique of Your Working Theories

  *   **Admire vs. Remember:** This is your strongest instinct. It aligns with the academic distinction between *celebration* (active endorsement of virtue) and *commemoration* (acknowledgement of existence or event). However, it struggles with Case 8 (Vek). You want Vek down even though "nobody looks at him." If nobody admires him, why does he harm? Because the *state* maintaining him implies institutional continuity with the regime. It is not about public admiration, but state endorsement.
  *   **Sam's Utility Test:** This is weak. It suggests that if a statue is ignored, it is harmless. But silent symbols can still normalise power structures (as you intuit with Vek). Conversely, a street name (Case 2) is highly useful, but you want to keep it. Utility is not the metric; *honour* is.
  *   **Infrastructure vs. Iconography (Street vs. Statue):** This is excellent. A street name is primarily a navigational tool that has acquired historical baggage; a statue is primarily an honorific tool that has acquired historical baggage. Removing a street name causes logistical chaos for living residents; removing a statue causes logistical chaos only for the council's narrative.

  ### 2. A Proposed Principle: The Triad of Public Memory

  To save your verdicts (mostly), you need a principle with three clauses. Let's call it the **Honour-Harm-History Triad**.

  **Clause 1: The Honour Test (Intent)**
  Is the primary function of the object to celebrate the moral character and authority of the subject, or to record a historical fact?
  *   *Statues of leaders (Pike, Halloway, Vek):* These are honourific. They demand we look up to them. If the subject is morally compromised, the honour is illegitimate.
  *   *Street Names (Pike, Gibbons):* These are functional. They are not primarily intended as moral compliments.
  *   *War Memorials (Cordwainers):* These are often tragic, not triumphal. They honour the sacrifice of life, not necessarily the justice of the cause.

  **Clause 2: The Harm Test (Impact)**
  Does the continued presence of the object cause active distress or uphold a system of oppression for the living community?
  *   *Pike (Slave Trader):* Causes active harm to descendants of the enslaved; upholds a narrative that wealth from slavery is worthy of bronze.
  *   *Rennie (Plagiarist):* Professional misconduct. Unfair to the assistant, but does not cause systemic societal harm.
  *   *Vek (Defunct Regime):* Upholds a political ideology the current state supposedly rejects.

  **Clause 3: The History Test (Accuracy)**
  Does removing the object erase a historical truth that needs to be remembered, even uncomfortably?
  *   *Gibbons Walk:* The name is a mistake, but the mistake is now part of the local history. Correcting it erases the story of the error.
  *   *Ashworth (Bully):* Her scientific work is real. Her character is flawed. The statue honours the work (History), not the bullying (Harm).

  ### 3. Resolving Your Inconsistencies

  You identified two major conflicts in your gut verdicts. Here is how the Triad resolves them.

  **Case 1 (Pike) vs. Case 6 (Rennie)**
  *   *Your Verdict:* Pike down, Rennie stay (with new plaque).
  *   *The Conflict:* Both involve dishonesty or immoral gain.
  *   *The Resolution:* This comes down to the **Harm Test**. Pike's wealth derives from chattel slavery, a crime against humanity with intergenerational trauma. Rennie's gain derives from professional theft. The scale of moral injury is different.
  *   *The Cost:* You must accept that this principle relies on a hierarchy of wrongs. Is plagiarism 'less bad' than slavery? Yes. But what if Rennie had stolen the idea from a subordinate he abused? You need to be prepared to argue that *structural oppression* outweighs *interpersonal misconduct* in public space.
  *   *Verdict:* Keep them opposite. The principle holds if you define 'Harm' as structural vs. individual.

  **Case 3 (Cordwainers) vs. Case 4 (Halloway)**
  *   *Your Verdict:* Soldiers stay, General goes.
  *   *The Conflict:* Same war, same side.
  *   *The Resolution:* This comes down to the **Honour Test** and **Agency**. The Cordwainers are memorialised as victims of the war (they died). The General is memorialised as the architect of the war (he commanded). We can mourn the dead without endorsing the cause; we cannot honour the commander without endorsing the command.
  *   *Verdict:* Keep them opposite. This is a standard distinction in memory studies (the 'fallen' vs. the 'leaders').

  ### 4. The Bench Case

  *   *The Case:* Public bench, private plaque, grandad's mate did something horrible.
  *   *Your Theory:* Leave it (Private grief).
  *   *Your Gut:* Take the plaque off (Public morality).
  *   *The Verdict:* **Take the plaque off.**
  *   *Why:* The bench is on a public seafront. Once a private tribute is placed in public space, it becomes part of the public landscape. The **Harm Test** applies. If the act was "genuinely horrible," the plaque validates that person in a shared space.
  *   *Compromise:* The bench can stay (it is functional infrastructure, like Pike Street). The plaque must go (it is honorific, like Pike's Statue). This aligns with your distinction between Case 1 and Case 2.

  ### 5. The Two New Cases

  Here is how the Triad handles the cases you haven't mentioned.

  **Case A: A statue of someone who is still alive.**
  *   *Verdict:* **Generally remove or prevent.**
  *   *Reasoning:* This fails the **History Test**. You cannot assess the full moral arc of a life while it is ongoing. It is premature honour. If they later commit atrocities (like Case 1 or 8), you create an immediate controversy.
  *   *Exception:* If the statue is commissioned by a private body on private land, it is free speech. If it is on public land, it implies state endorsement of a finished legacy. A living person does not have a finished legacy.

  **Case B: A memorial put up by the family of the perpetrator, to the people he wronged.**
  *   *Verdict:* **Highly suspect, context-dependent.**
  *   *Reasoning:* This is complex. It passes the **Honour Test** (it honours victims), but it risks failing the **Harm Test** if it is seen as 'blood money' or an attempt to buy absolution for the family name.
  *   *Condition:* It should only remain if the victims' community accepts it. If the victims' descendants view it as an insult or a silencing tactic, it must go. Public memory belongs to the affected community, not the penitent perpetrator's heirs.

  ### 6. What This Principle Costs You

  You asked what the complexity costs you. Here is the bill:

  1.  **You lose moral certainty.** You cannot simply say "all statues of bad people must go." You have to weigh the *type* of badness (structural vs. individual) and the *type* of object (icon vs. infrastructure). This makes seminars messier.
  2.  **You accept ambiguity.** Case 7 (Gibbons Walk) requires you to accept a lie (the name is wrong) because the lie is now historically significant. You are prioritising the story of the error over factual accuracy.
  3.  **You must police the boundary of 'Public'.** In the Bench Case, you have to argue that a public bench is not a private garden. This can feel harsh against grieving families, but it is necessary to maintain the integrity of public space.

  ### Summary for your Seminar

  If you want to speak up next week, try this:

  > "I've been struggling with the distinction between *infrastructure* and *iconography*. My intuition is that street names function as tools we use, whereas statues function as values we are asked to admire. But that doesn't fully explain why we keep war memorials for unjust wars. I think the missing variable is *agency*. We memorialise the dead as victims of history, but we remove the statues of the living (or the leaders) as architects of history. Does that distinction hold when we look at who controls the narrative?"

  That will show you have done the reading, you have thought about the cases, and you understand that there is no easy algorithm.

  **Final check on your verdicts:**
  *   1 (Pike Statue): Down. (Honour + Harm)
  *   2 (Pike Street): Keep. (Infrastructure)
  *   3 (Cordwainers): Keep. (Victims/Tragedy)
  *   4 (Halloway): Down. (Architect/Agency)
  *   5 (Ashworth): Keep. (Achievement > Character)
  *   6 (Rennie): Plaque Change. (Individual Misconduct < Structural Harm)
  *   7 (Gibbons): Keep. (Historical Fossil)
  *   8 (Vek): Down. (State Endorsement)
  *   Bench: Plaque Off. (Public Space > Private Tribute)

  Your gut was mostly right. You just needed the vocabulary to explain why.
