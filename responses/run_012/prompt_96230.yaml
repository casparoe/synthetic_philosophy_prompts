      *Case 3 vs 4:* Soldiers vs General. This is the "Agency" argument. Soldiers are often memorialised as victims/sacrifices. Generals are memorialised for leadership/strategy. If the war is unjust, the sacrifice is tragic (memorialise the loss), but the leadership is culpable (remove the honour).

