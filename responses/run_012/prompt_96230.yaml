      *   **Goal:** Wants a principle (or set of principles) that rationalises these verdicts, identifies complexities/costs, points out which verdicts might need dropping, and addresses two new hypothetical cases (living statue, perpetrator's memorial to victims).
      *   **Constraint:** British English spelling and grammar (e.g., 'colour', 'organise', 'centre').
      *   **Tone:** Academic but accessible, supportive but critical (like a good tutor), analytical.

  2.  **Deconstruct the Cases & Gut Verdicts:**
      *   1. *Pike Statue (Slave Trader):* Remove/Museum. (Reason: Honouring immorality/wealth source).
      *   2. *Pike Street (Same Man):* Keep. (Reason: Functional utility, not honour).
      *   3. *Cordwainers' Memorial (Soldiers in 'bad' war):* Keep. (Reason: It's a grave/memorial to the dead, not the cause).
      *   4. *General Halloway (Commander of same war):* Remove. (Reason: Honouring leadership of 'bad' cause).
      *   5. *Dr Ashworth (Great work, bad person):* Keep. (Reason: Commemorates achievement, not character).
      *   6. *Rennie Statue (Stolen credit):* Change plaque, keep statue. (Reason: Correct the record, but the object/figure remains significant).
      *   7. *Gibbons Walk (Naming error):* Keep. (Reason: Historical accident/fossil, no intent to honour).
      *   8. *Marshal Vek (Defunct regime, ignored):* Remove. (Reason: Endorsement of regime, even if ignored).
      *   *Bench Case (Grandad's mate, horrible act, private plaque):* Gut says remove plaque, Theory says leave. (Conflict between public space and private grief).
      *   *New Case A:* Statue of someone alive.
      *   *New Case B:* Memorial by perpetrator to victims.

  3.  **Evaluate User's Working Theories:**
      *   *Admire vs. Remember:* Strong distinction. Helps with 1 vs 3. But does it help with 8 (Vek)? Nobody admires Vek, but the statue implies state admiration.
      *   *Functionality (Sam's theory):* "If nobody notices it gone..." Weak. Vek (Case 8) is ignored but user wants it down. Pike Street (Case 2) is used but user wants it kept.
      *   *Usage vs. Looking (Street vs. Statue):* Helpful for 1 vs 2. Street names are infrastructure; statues are honorific.

  4.  **Develop a Coherent Framework:**
      *   The core tension is between *Historical Record*, *Public Honour*, and *Harm*.
      *   A single principle rarely fits all. A multi-clause framework is better.
      *   *Proposed Principle:* **The Distinction between Commendation and Documentation.**
      *   *Clause 1 (Intent & Effect):* Does the object actively *commend* virtue/authority, or merely *mark* presence/event? (Addresses 1, 2, 3, 4, 8).
      *   *Clause 2 (Accuracy):* If the factual basis is wrong, correct the record rather than erase the object, unless the object itself is the lie. (Addresses 5, 6, 7).
      *   *Clause 3 (Harm & Power):* Does the presence cause active harm or uphold oppressive power structures? (Addresses 1, 4, 8, Bench).

      *Wait, let's refine.* The user's inconsistency on 1 vs 6 is key.
      *   1 (Pike): Slave trader. Verdict: Down.
