answer: |-
  # Session Plan: The Doomsday Urn
  **Time:** 90 Minutes  
  **Students:** 14 (Upper-level Philosophy/Econ)  
  **Goal:** Visceral understanding of Bayesian updating on birth rank (SSA), the Self-Indication Assumption (SIA) counter, and the Reference Class problem.

  ## 1. Materials List (Low Budget)
  *   **2 Opaque Bags/Boxes:** Label one **"Small World"**, one **"Large World"**.
  *   **Tokens/Slips of Paper:**
      *   **Small Bag:** 20 slips numbered 1–20.
      *   **Large Bag:** 2000 slips numbered 1–2000 (You can fake this: 20 slips numbered 1–20, and 1980 slips that just say "High" or are blank, but for Bayesian purity, number a representative sample or just write "1–2000" on a single slip and explain the distribution. *Better:* Write 1–20 on red paper, 21–2000 on blue paper. Put 20 red in Small Bag. Put 20 red + 100 blue in Large Bag. Explain that blue represents the tail. *Best for time:* Just use 20 slips (1-20) in Small, and 200 slips (1-200) in Large. Ratio 1:10 is enough to show the math without logistical hell.)
      *   *Revised Token Plan:* **Small Bag:** 20 slips (1-20). **Large Bag:** 200 slips (1-200).
  *   **World Selector:** A hat with **10 chips** (1 labeled "Small", 9 labeled "Large") for Round 2. A coin for Round 1.
  *   **Privacy:** 30 Index Cards, 2 Pens, 1 Envelope (labeled "SECRET").
  *   **Board:** Whiteboard/Blackboard for scoring.

  ## 2. Session Flow & Timing

  | Segment | Time | Activity |
  | :--- | :--- | :--- |
  | **Intro** | 00–10 | Rules, Bayes refresher, Privacy protocol. |
  | **Round 1** | 10–35 | **SSA Mode:** 50/50 World. Draw tokens. Estimate. |
  | **Round 2** | 35–60 | **SIA Mode:** Weighted World Prior. Draw tokens. Estimate. |
  | **Reveal** | 60–70 | Open Envelope. Reveal True World. Score. |
  | **Debrief** | 70–90 | Map game to DA, Reference Class, Limitations. |

  ---

  ## 3. Detailed Run-Script

  ### Introduction (10 mins)
  1.  **The Setup:** "We are simulating a universe. There are two possible worlds. In the **Small World**, only 20 people ever exist. In the **Large World**, 200 people ever exist."
  2.  **The Secret:** "I have flipped a coin (Round 1) / Drawn from a hat (Round 2) to decide which world we are in. You do not know which."
  3.  **Your Role:** "You are observers. You will each receive a 'Birth Rank' (a token number). This is your position in the sequence of all humans."
  4.  **The Task:** "On an index card, write:
      *   Your Token Number.
      *   Your Credence (0–100%) that we are in the **Small World**.
      *   A 90% Confidence Interval for the Total Population ($N$)."
  5.  **Privacy Protocol (Crucial):** "Do not show your card. Do not talk. When finished, fold the card and put it in this Envelope. I will not look at them until the end. If you signal your number, you ruin the data for everyone."

  ### Round 1: The Standard Argument (SSA) (25 mins)
  1.  **World Selection:** Flip a coin visibly. Heads = Small, Tails = Large. *Note: You, the instructor, must know the result. The students must not.*
  2.  **Distribution:** Take the corresponding bag. Walk around. Have each student draw **one** slip without looking, then look privately.
      *   *Constraint:* If Small World (20 slips) and 14 students, you have enough slips. If Large (200 slips), plenty.
      *   *Replacement:* Do **not** put slips back. (Sampling without replacement is closer to unique birth ranks, though statistically slightly different from DA's with-replacement assumption. For 14/20, it's negligible and feels more "real".)
  3.  **Estimation:** Give them 5 minutes to calculate/write.
      *   *Prompt:* "Use Bayes' Rule. $P(Small | Rank) \propto P(Rank | Small) \times P(Small)$."
      *   Remind them Prior $P(Small) = 0.5$.
  4.  **Collection:** Collect all cards into the Envelope. Seal it.
  5.  **Pause:** Do not reveal the world yet. Move immediately to Round 2 instructions.

  ### Round 2: The Cancel-Out (SIA) (25 mins)
  1.  **The Twist:** "We reset. New coin flip. But now, we model the **Self-Indication Assumption**. This view holds that you are more likely to exist in a world with more observers."
  2.  **Mechanic Change:** "To simulate this, the 'World Coin' is now biased. I am drawing from a hat with **1 Small Chip** and **9 Large Chips**."
      *   *Why:* This shifts the Prior $P(Small)$ from 0.5 to 0.1.
      *   *Pedagogy:* This physically demonstrates that SIA acts as a **Prior Shift** proportional to $N$. (Since $N_L/N_S = 10$, the Prior shifts 1:9).
  3.  **World Selection:** Draw from the hat secretly. Record the result.
  4.  **Distribution:** Same bags as Round 1. Students draw new tokens.
  5.  **Estimation:** Students write new estimates on new cards.
      *   *Prompt:* "Your likelihood ratio from the token is the same. But your Prior has changed."
  6.  **Collection:** Collect cards into the Envelope.

  ### The Reveal & Scoring (10 mins)
  1.  **Open the Envelope:** Pick one student's card at random to read aloud (to show anonymity was kept).
  2.  **Reveal Truth:** Announce the actual World (Small/Large) for Round 1 and Round 2.
      *   *Note:* It is possible Round 1 and Round 2 landed on different Worlds. That's fine. Score them separately.
  3.  **Scoring Rule (Write on Board):**
      *   **Probability Score (Brier):** $100 - 100 \times (Your\% - Outcome)^2$. (Outcome is 1 if Small, 0 if Large).
          *   *Example:* If Small, and you said 90%: $100 - 100(0.9 - 1)^2 = 99$ points.
          *   *Example:* If Small, and you said 10%: $100 - 100(0.1 - 1)^2 = 19$ points.
      *   **Interval Score:** +50 points if the True $N$ is inside your 90% interval. 0 if outside.
  4.  **Winner:** Tally the top 3 scores. Award bragging rights/candy.

  ### Debrief & Discussion (20 mins)
  *This is where the learning solidifies. Do not lecture; ask.*

  **1. The Update (SSA)**
  *   **Ask:** "In Round 1, if you drew a low number (e.g., 5), what did you do? If you drew a high number (e.g., 150)?"
  *   **Point:** Drawing a low number is *compatible* with both, but *more likely* in Small. Drawing >20 is impossible in Small.
  *   **Map:** This is the **Doomsday Argument**. Knowing your birth rank ($n$) updates your probability of total population ($N$). Early rank $\to$ Smaller $N$.

  **2. The Cancel-Out (SIA)**
  *   **Ask:** "How did your estimates change in Round 2? Who felt the 'bias' of the hat canceled the evidence of the token?"
  *   **Math on Board:**
      *   Round 1: Prior 1:1. Likelihood (for rank 5) $\approx$ 10:1 favoring Small. Posterior $\approx$ 10:1 Small.
      *   Round 2: Prior 1:9 (favoring Large). Likelihood 10:1 (favoring Small). Posterior $\approx$ 1:1.
  *   **Point:** SIA doesn't deny the token evidence; it adds a counter-weighting prior based on *existence probability*.

  **3. The Reference Class (The "Gut Check")**
  *   **Ask:** "In this game, you knew you were 'Students in this Room.' In real life, what is the token? Are we 'Humans'? 'Hominids'? 'Conscious Observers'? 'Americans'?"
  *   **Discussion:** If you count 'All Mammals', your rank is huge $\to$ Doom is far. If you count 'Nuclear Physicists', your rank is small $\to$ Doom is soon.
  *   **Point:** The DA collapses if the Reference Class is ill-defined. The game hid this problem by defining the class for them.

  **4. Limitations (Honesty Check)**
  *   **Ask:** "What does this game get wrong about real life?"
  *   **Guide them to:**
      1.  **The Urn:** In the game, the tokens *existed* in a bag. In reality, future humans don't exist yet. We are sampling from a *potential* set, not an actual one.
      2.  **The Prior:** In the game, I told you the Prior (50/50 or 1/9). In reality, we have no idea what the prior probability of "Humanity lasts 10k years vs 1M years" is.
      3.  **The End:** The game is static. The DA is about *duration*.

  ---

  ## 4. Troubleshooting & Failure Modes

  **Failure 1: Students don't update in Round 1.**
  *   *Symptom:* Everyone writes 50% regardless of token number.
  *   *Cause:* They think "The coin was 50/50, so it stays 50/50." (Gambler's Fallacy / Ignoring Likelihood).
  *   *Fix:* During Debrief, pick a student who drew #18. Ask: "Could this be the Large World?" (Yes). "Is it *more* likely to be Small?" (Yes, because 18/20 vs 18/200). Show the math explicitly on the board.

  **Failure 2: Signaling/Collusion.**
  *   *Symptom:* Students glance at neighbors' tokens.
  *   *Prevention:* "Eyes on your own card. If I see you looking, you're out of the scoring."
  *   *Fix:* If it happens, acknowledge it in debrief as "Information Leakage" and discuss how real anthropics suffers from "Selection Bias" we can't see.

  **Failure 3: Round 2 feels "Rigged".**
  *   *Symptom:* Students complain the 1:9 chip draw is arbitrary.
  *   *Response:* "Exactly. The SIA is an assumption about how reality is weighted. It *feels* arbitrary because it's a metaphysical claim, not an empirical one. That's the philosophical fight."

  **Failure 4: Time Overrun.**
  *   *Risk:* The Debrief eats the clock.
  *   *Fix:* Hard stop the Scoring at 70 mins. If scoring takes too long, just announce the Winner based on your quick mental math of the top 3 cards you peeked at (or just skip the candy and discuss the concepts). Concepts > Points.

  ---

  ## 5. What The Game Cannot Reproduce (Instructor Notes)

  Be prepared to admit these limitations if sharp students raise them:

  1.  **The "No Urn" Problem:** In the game, the 200 tokens physically existed in the bag before the draw. In the real Doomsday Argument, future humans do not exist yet. You are treating a *temporal* sequence as a *spatial* set. This is the strongest objection to the DA (the "Continuous Creation" objection).
  2.  **Known $N_{Large}$:** In the game, students know $N_{Large} = 200$. In reality, we don't know the upper bound of human population. It could be $10^{90}$ (space colonization). If $N_{Large}$ is effectively infinite, the likelihood ratio $P(n|L)$ approaches 0, making the Large World infinitely unlikely *unless* the Prior is also infinite. The game papers over the uncertainty of the alternative hypothesis.
  3.  **Essential Indexicals:** In the game, "You" are a student in a room. In reality, "You" are a specific consciousness. The game assumes "You" are a random sample from "Humans." It doesn't capture the weirdness of *why* you are you and not someone else (the problem of individuation).

  ## 6. Instructor Cheat Sheet (Bayes Math)

  *   **Round 1 (SSA):**
      *   $P(S) = 0.5, P(L) = 0.5$.
      *   If Student draws $n \le 20$:
          *   $P(n|S) = 1/20$.
          *   $P(n|L) = 1/200$.
          *   Likelihood Ratio = $10:1$ favoring Small.
          *   Posterior $P(S|n) = 10/11 \approx 91\%$.
      *   *Target Answer:* Students should write ~90% for Small if $n \le 20$.

  *   **Round 2 (SIA):**
      *   $P(S) = 0.1, P(L) = 0.9$ (Modeled by 1 vs 9 chips).
      *   If Student draws $n \le 20$:
          *   Likelihood Ratio = $10:1$ favoring Small.
          *   Prior Ratio = $1:9$ favoring Large.
          *   Posterior = $1:1$.
      *   *Target Answer:* Students should write ~50% for Small.

  *   **If Student draws $n > 20$:**
      *   $P(n|S) = 0$.
      *   Posterior $P(S|n) = 0\%$. (Certainty it is Large).

  **Scoring Key:**
  *   If World is **Small**: High points for High Probability of Small.
  *   If World is **Large**: High points for Low Probability of Small (or High Prob of Large).
  *   *Note:* If you drew the Large World in Round 1, most students will have "failed" the Bayesian update (they will say 90% Small because they drew low numbers, but the truth is Large). **This is a teaching moment.** It shows that Bayesian updating gives *probabilities*, not certainties. Even a 90% credence event can be false. Do not let them feel they "lost" if the unlikely world happened. Score them on *calibration*, not luck. (The Brier score handles this naturally).
