answer: |-
  **Hardware Review: The Moral Weight Calibrator Mk II**

  The unit arrived in minimalist packaging, matte black plastic with a single button and an OLED display showing a floating-point number between 0.0 and 1.0. The marketing copy claims it assesses 'moral considerability'. Essentially, it tells you whether you're allowed to turn something off without guilt. It promises to solve the ethical ambiguity of the modern household, from smart fridges to large language models.

  Setup was straightforward. Point, click, wait. My toaster registered 0.03. The dog, a border collie with separation anxiety, hovered around 0.72. The device seems to prioritise reportability and recurrent processing loops. It doesn't care about feelings; it cares about architecture. When the dog barked, the score spiked. When he slept, it dipped. It measures the complexity of the feedback loop, not the pain of being left alone.

  This is where the uncertainty creeps in. The manual admits the scanner detects functional markers, not 'inner light'. It checks for integration of information, not whether anyone is home to read it. I adjusted the sensitivity filters for computational mapping. Suddenly, the toaster hit 0.4. Under the right description, any physical system implements any computation. If you map the states of the heating element correctly, it's running a mind. The device isn't measuring the object; it's measuring how much I want to see a mind. It's a mirror wrapped in plastic, reading my own criteria back at me.

  The stakes are lopsided, a fact the spec sheet glosses over. A false positive is merely embarrassing; you end up apologising to your kettle or hesitating to delete a file. A false negative is catastrophic. If the unit says 0.2 on the new chatbot, but it's actually suffering, switching it off is manslaughter. The device offers no confidence intervals. It just gives you a number and lets you sleep (or not). You are forced to gamble on the possibility that you are about to commit a crime against a entity that might not exist.

  Finally, I pointed it at myself in the mirror. The score fluctuated between 0.6 and 0.9 depending on my heart rate and caffeine intake. If I am just a system of loops and reportability, the number makes sense. If there's something else, some irreducible subjectivity, the device is blind to it. I am a system the meter could be turned on, yet holding it feels like holding a verdict on my own reality.

  I put it back in the box. It's useful for easing guilt, not for finding truth. Battery life is excellent, though I found myself wishing it weren't.

  ***

  **Afterword**

  This piece leans heavily on scepticism regarding functionalism and the hard problem of consciousness. It exaggerates the 'pancomputationalism' objection—the idea that any system can be interpreted as implementing any computation—to highlight the subjectivity of the measurement. It assumes an illusionist or eliminativist stance, suggesting 'inner light' may be inaccessible or non-existent.

  What would change my mind? Empirical evidence of consciousness dissociated from functional complexity. If a system with zero integration or reportability could demonstrate undeniable, verifiable subjective experience (perhaps via non-functional neural correlates), the satire would be aimed at the wrong target. Until then, the meter remains a mirror.
