answer: |-
  (1) **Order:** 1. Ontology (Universal Wavefunction, no collapse). 2. Incoherence Solution (Self-locating uncertainty: "Which branch am I?"). 3. Quantitative Solution (Decision theory: "How should I bet?"). **Why:** Nadia's objection halts at 1. You must establish that uncertainty is coherent despite determinism (2) before arguing for specific odds (3). If they don't buy subjective uncertainty, the Born rule is moot. Sequence matters: Ontology → Epistemology → Normativity.

  (2) **Example:** The "Branch Splitting Trick." Take a 50/50 spin. Artificially decohere the "up" branch into two identical sub-branches immediately after measurement. Counting suggests 2:1 odds for "up." Born rule says 1:1. This proves branch count is ontologically idle; amplitude must do the work. Avoid the Cat (too qualitative) or Coin vs. Spin (doesn't expose the counting fallacy as sharply). The Splitting Trick forces them to abandon counting without needing linear algebra.

  (3) **Misconceptions:** 1. "Decoherence creates probability." Head off in Step 1: Decoherence creates branches, not weights. 2. "Probability is just counting." Kill with the Example. 3. "Credence is unconstrained." Address in Step 3: Emphasize that rationality constraints bind credence to physical structure, not just psychology. Catch the "credence is free" move before they leave the room.

  (4) **Final Question:** "If branch count doesn't ground probability, what physical fact distinguishes a rational 99/1 bet from a 50/50 bet in a deterministic multiverse?" This forces them to identify amplitude as the truth-maker, not frequency. It tests if they see the metaphysical gap.

  (5) **Refusal:** The formal Deutsch-Wallace proof. **Justification:** "We are evaluating the philosophical coherence of the decision-theoretic turn, not verifying the linear algebra. The math guarantees existence; we care about rationality." Don't let the lapsed physicist derail the metaphysics with Hilbert space norms.
