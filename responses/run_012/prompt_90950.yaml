prompt: |-
  Ok so last night I lost two hours to an arguement with my friend Nadia about many-worlds. She's a physicist, her line was that the interpretation is a non-starter because there's no probability in it — everything happens, so "likely" means nothing — and I kept telling her the Everettians have an answer and that the decision-theory derivations aren't question-begging, and about halfway through I realised I couldn't actually lay the answer out in order. Which is bad, because I'm the one running next week's session on it.

  Setup: reading group, six people, mostly metaphysics grad students plus one lapsed physicist. All of them have heard of many-worlds, none of them has done the linear algebra, and all of them think they already know what the problem is. I want you to act like someone who teaches philosophy of physics for a living and has watched a lot of smart people get this exact thing wrong. Don't explain the Born rule problem to me — I know what the problem is. Plan how I should explain it.

  What I need: (1) the order the pieces have to go in, and why that order — i.e. what has to be in place before "so why is there a probabilty at all?" even registers as a question for them, and what I can safely assume they already have. (2) The one example that carries the whole session, what it has to have and not have — I was going to use the cat, or the 99/1 spin against a fair coin, or the trick where you split one branch into two halves that differ only in something irrelevant, so that counting branches gives you 2/3 and the rule gives you 1/2. Tell me which of those carries it, if any, and why not the others. (3) The misconceptions they'll arrive with or form halfway through, and exactly where in the sequence I head each one off — I'm expecting "decoherence is what makes the probabilities", "probability just means counting branches", and at least one person saying probability is just credence so there's nothing here to solve. (4) One question to ask at the end that tells me they've got the shape of the problem rather than a slogan. (5) What I should openly refuse to explain at this level, and what I say to justify the refusal.

  Cap it at 500 words, keep the numbering. Think it through before you start — sketch the dependency order and the candidate examples for yourself before committing, don't just list the standard talking points, and skip the "there are many interpretations of QM" throat-clearing.
