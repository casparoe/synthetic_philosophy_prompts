answer: |-
  This is a fantastic philosophical debate, and you are tackling one of the classic problems in the philosophy of medicine. However, I have some bad news for your side of the argument: **your refutation relies on a common misunderstanding of Christopher Boorse's Biostatistical Theory (BST).**

  If you use this argument against a friend who has actually read Boorse, they will likely defeat you quickly. But don't worry—Normativism still has strong legs to stand on. You just need to change your ammunition.

  Here is the breakdown of why your specific argument fails, how a Boorsean would defend themselves, and where you can actually win the debate.

  ### 1. The Misunderstanding: Boorse Does Not Define Disease as "Statistical Abnormality"
  Your argument rests on this premise:
  > *"A disease is just a statistically abnormal state... relative to a reference class."*

  This is the "Straw Man" version of Naturalism. Boorse explicitly rejects the idea that statistical rarity equals disease.

  **Boorse's Actual Definition:**
  For Boorse, a disease is a **subnormal contribution to survival and reproduction** caused by a **functional impairment** of a mechanism, relative to a reference class (age, sex, species).

  *   **Statistical Normality** is often correlated with **Functional Normality**, but they are not the same thing.
  *   Boorse distinguishes between *typicality* (what is common) and *normality* (what functions according to species design).

  ### 2. How a Boorsean Defends Against Your Counterexamples
  If you bring up your examples to a well-read Naturalist, here is how they will respond:

  *   **Left-handedness / Blue Eyes:**
      *   **Boorse's Reply:** These are statistically rare, but they are **not functional impairments**. Being left-handed does not reduce the efficiency of your motor functions relative to survival/reproduction. Therefore, it is a *variation*, not a *disease*. Boorse allows for "statistical outliers" that are functionally normal.
  *   **The Marathon Runner's Heart (Resting HR 45):**
      *   **Boorse's Reply:** This is his favorite example to address. A resting heart rate of 45 is statistically abnormal for the general population. However, the heart is functioning *more* efficiently, not less. It is an adaptation, not a dysfunction. It contributes positively to the organism's goals. Therefore, it is not a disease.
  *   **Sickle-Cell Trait:**
      *   **Boorse's Reply:** You have to distinguish the *trait* (heterozygous) from the *anemia* (homozygous).
          *   The **Trait**: In a malaria-prone environment, this actually *enhances* survival function. Boorse would say this is not a disease in that context.
          *   The **Anemia**: This impairs the blood's ability to transport oxygen (a clear functional failure). This *is* a disease, regardless of how common it is in a specific population.

  **The Verdict on Your Refutation:** Because Boorse anchors disease in **function** (survival/reproduction) rather than pure **frequency**, your counterexamples do not refute his theory. He has already accounted for them.

  ### 3. Where You *Can* Win (The Real Weaknesses of Naturalism)
  You are right that Naturalism struggles to remain value-free, but the "statistical" argument isn't the way to prove it. Here are three stronger arguments for Normativism that you can use instead:

  **A. The "Function" Itself is Normative**
  Boorse claims "survival and reproduction" are objective biological facts. Normativists argue that choosing these as the *gold standard* is a value judgment.
  *   *Argument:* Why is reproduction the goal? If a condition causes immense pain but doesn't affect reproduction (e.g., severe migraines in an older person past reproductive age), Boorse struggles to call it a disease. We call it a disease because **suffering is bad**, not because it stops reproduction. Prioritizing "biological efficiency" over "quality of life" is a value choice.

  **B. The Problem of "Benign Dysfunctions"**
  Sometimes a mechanism fails (naturalist disease) but it doesn't matter.
  *   *Example:* A man is infertile (functional failure of reproduction) but he doesn't want children and lives a happy, healthy life. Is he "sick"? Naturalism says yes (functional failure). Normativism says no (no harm/value negative).
  *   *Example:* Wisdom teeth impaction. It's a functional failure of jaw design, but if it doesn't hurt, is it a disease?

  **C. The Historical Argument (Homosexuality)**
  This is the Normativist's nuclear weapon.
  *   Until 1973, homosexuality was classified as a mental disease in the DSM.
  *   **Naturalist Problem:** If you look strictly at "species design" and "reproduction," homosexuality *is* statistically abnormal regarding reproductive output. A strict Boorsean might have to admit it fits the criteria for dysfunction.
  *   **Normativist Victory:** We de-classified it as a disease not because we discovered new biological facts, but because our **social values changed**. We decided it wasn't "bad" for the person. This proves the concept of disease relies on social judgment, not just biology.

  ### 4. The "Harmful Dysfunction" Compromise
  You should also be aware of Jerome Wakefield's **Harmful Dysfunction Analysis (HDA)**. It's a hybrid theory that might settle the argument.
  *   **Dysfunction:** A naturalist component (a mechanism isn't working as designed).
  *   **Harm:** A normativist component (the dysfunction causes negative value/judgment).
  *   Under HDA, your marathon runner isn't sick (no dysfunction), and the infertile man who doesn't want kids isn't sick (no harm), but the migraine sufferer is sick (harm, even if reproduction is unaffected).

  ### Summary for Your Argument
  If you want to settle this fairly:

  1.  **Concede the Statistical Point:** Admit that Boorse doesn't define disease as *mere* statistical rarity. He defines it as *functional impairment*. Your left-handedness/athlete examples don't refute him because they aren't impairments.
  2.  **Pivot to Values:** Argue that Boorse's definition of "function" (survival/reproduction) is too narrow and ignores **suffering** and **well-being**.
  3.  **Use the Homosexuality Example:** Ask your friend if homosexuality is a disease. If they say no, ask why, given that it reduces reproductive output. If they say "because it's not bad," they have admitted that **value judgments** are necessary.

  **Final Verdict:** You are right that Normativism captures our intuition better, but your specific "statistical refutation" is technically incorrect regarding Boorse's text. Adjust your aim, and you'll have a much stronger case!
