      *   *Claim:* "Disease is just a statistically abnormal state."
      *   *Correction:* This is a common misconception. Boorse's Biostatistical Theory (BST) does *not* define disease merely as statistical abnormality. It defines disease as a **subnormal contribution to survival and reproduction** (i.e., functional impairment) relative to a reference class. Statistical abnormality is a *proxy* or a *symptom* of dysfunction, not the definition itself.
      *   *Key Distinction:* Boorse distinguishes between *statistical normality* and *functional normality*. A trait can be statistically rare but functionally normal (e.g., genius IQ, athlete's heart). A trait is a disease only if the *function* of a mechanism is impaired relative to the species design.

