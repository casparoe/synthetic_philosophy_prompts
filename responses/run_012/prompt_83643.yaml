prompt: |-
  Bit of an odd one for you. I'm chair of the trust that runs our local theatre — 110 seats, converted chapel, town of about six thousand — and on Friday I've got to give the opening remarks at the gala reopening after eighteen months of building work. Trouble is, I've spent those eighteen months reading Rousseau's letter to d'Alembert about the theatre and its got right under my skin. His argument was against a playhouse in a place like his Geneva rather than against plays as such: in a small town the theatre doesn't make anyone better, it teaches everyone to watch everyone else, the audience gets its feelings on the cheap and goes home unchanged, and the actor's whole trade is seeming to be someone he isn't. He even read Molière's Misanthrope as a comedy that gets you laughing at the one honest man in the room. And his own preferred alternative was the public fête — no stage, no division between the people performing and the people watching, everyone in the square doing both at once.

  What I want from you is that speech, about six minutes, facing this head on and actually answering it, rather than doing the usual well-the-arts-are-lovely-aren't-they number. Half the room will be the volunteers who've been sanding the foyer since March, a quarter will be the mayor, a couple of councillors and the local paper, and then my old philosophy tutor, who will be watching to see whether I engage with the argument or just name-drop it. So it has to land for the volunteers without talking down to them, and it can't strawman Rousseau in front of the one person who'll notice. No direct quotations from him please — paraphrase, I don't want to be caught misquoting. Keep it speakable: short sentences, nothing that only works on the page. British English please. (And he wrote a succesful opera himself, so I'd rather he didn't come across as a killjoy.)
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Chair of a trust running a local theatre (110 seats, converted chapel, town of ~6,000 people).
      *   **Occasion:** Gala reopening after 18 months of building work.
      *   **Task:** Write opening remarks (speech).
      *   **Length:** About 6 minutes (approx. 750-900 words spoken at a moderate pace).
      *   **Key Constraint/Theme:** Must engage seriously with Rousseau's *Letter to d'Alembert on the Theatre*.
          *   Rousseau's argument: Theatre in small towns doesn't improve morals, encourages passive spectating, teaches hypocrisy (acting), creates division between actor/audience. Preferred alternative: public fête (everyone participates).
          *   Must *answer* this argument, not ignore it or give a generic "arts are lovely" speech.
          *   Must not strawman Rousseau (the philosophy tutor in the audience will check).
          *   No direct quotations (paraphrase only).
          *   Rousseau wrote an opera (*Le Devin du Village*), so don't paint him as a total killjoy.
      *   **Audience:**
          *   Volunteers (50%): Been sanding the foyer, hard work, need validation without condescension.
          *   Dignitaries (25%): Mayor, councillors, local paper (need formal respect but not too stiff).
          *   Philosophy Tutor (1 person): Watching for intellectual honesty regarding Rousseau.
      *   **Tone/Style:** Speakable, short sentences, British English, engaging, thoughtful.

  2.  **Deconstruct Rousseau's Argument (for accurate paraphrasing):**
      *   Context: Geneva (small, tight-knit republic).
      *   Critique 1: Passivity. Audience watches instead of acts. Feelings are simulated, not real.
      *   Critique 2: Division. Stage separates performers from spectators.
      *   Critique 3: Morality. Theatre doesn't cure vices; it might reinforce them (e.g., laughing at the honest man in *The Misanthrope*).
      *   Critique 4: Acting. Professionally pretending to be someone else is inherently dishonest.
      *   Alternative: The Festival/Fête. Everyone is both actor and spectator. Community bonding.

  3.  **Formulate the Counter-Argument (The "Answer"):**
      *   Acknowledge the validity: Rousseau isn't wrong about *bad* theatre or passive consumption.
      *   Reframe the specific context: This is a *local* theatre (110 seats), not the Comédie-Française.
      *   Address the "Division": A small theatre blurs the line. We know the actors. They are us.
      *   Address the "Acting/Hypocrisy": Empathy. Trying on another's skin isn't lying; it's understanding.
      *   Address the "Fête": This building *is* a community hub. The work done (sanding, building) was the fête. The performance is just one part of the gathering.
      *   Address the "Chapel" aspect: Converted chapel. Space already sacred/community-focused.
      *   Conclusion: We are not just watching; we are sustaining this space together.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Welcome everyone. Acknowledge the work (volunteers). Acknowledge the building (chapel).
      *   **The Rousseau Hook:** Introduce the elephant in the room. I've been reading Rousseau during the building work.
      *   **Engaging the Argument:** Summarize his view fairly (small town, theatre creates passivity, division, hypocrisy). Acknowledge he wasn't a killjoy (wrote music himself).
      *   **The Rebuttal (Volunteers):** The building work *was* the fête. You weren't spectators; you were builders.
      *   **The Rebuttal (The Space):** 110 seats. It's intimate. The division is thin. We know the people on stage.
      *   **The Rebuttal (Empathy):** Acting isn't lying; it's practicing being someone else. In a small town, we need that empathy.
      *   **The Rebuttal (The Chapel):** It was a place of gathering before; it remains so.
      *   **Closing:** Invite everyone in. Not just to watch, but to belong.

  5.  **Refining for Tone and Constraints:**
      *   *British English:* Check spelling (colour, centre), idioms (quite, rather), rhythm.
      *   *Speakable:* Short sentences. Pauses marked by punctuation. Avoid complex subordinate clauses.
      *   *Rousseau Accuracy:* Ensure I don't say he hated all theatre everywhere, just in small republics like Geneva. Mention the *Misanthrope* point subtly. Mention the *Fête*.
      *   *Volunteers:* Make sure they feel seen. "Sanding the foyer" needs a mention.
      *   *Time Check:* 6 minutes @ 130 wpm = ~780 words. Keep it tight.

  6.  **Drafting - Iteration 1 (Mental Check):**
      *   *Too academic?* Need to simplify the philosophy bits for the mayor/volunteers while keeping the tutor happy.
      *   *Too defensive?* Need to be celebratory but thoughtful.
      *   *Rousseau's Opera:* Mention *The Village Soothsayer* to show he wasn't anti-music/drama entirely.

  7.  **Drafting - Writing the Speech (incorporating feedback):**
      *   Start with the bricks and mortar.
      *   Move to the philosophy.
      *   Bring it back to the people in the room.
      *   End on the future.

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm agreeing with Rousseau too much, or the donors might worry. Balance is key. Rousseau warns against *commercial* theatre isolating people. This is *community* theatre connecting people.

      *(Check on Rousseau's specific point about Molière)*: He argued Alceste (the Misanthrope) is the only honest one, but the audience laughs at him. I should mention that we want to laugh *with* honesty, not at it.

      *(Check on Rousseau's alternative)*: The public festival where everyone participates. I need to argue this theatre *enables* that spirit.

  8.  **Final Polish:**
      *   Check sentence length.
      *   Check British spelling.
      *   Ensure no direct quotes.
      *   Ensure the volunteers feel credited.

      *Word Count Check:* A 6-minute speech is roughly 750-850 words. I need to monitor this.
      *Tone Check:* Warm, intellectual but accessible, grateful.

      *(Final thought on the Tutor)*: The tutor needs to see I understand the *Letter to d'Alembert*. I need to reference the specific concern about the *small town* context, not just theatre in general. That's the crucial nuance.

      *(Final thought on the Volunteers)*: They sanded the foyer. That physical labour is the counter-argument to passivity.

      Let's write.

      *Structure:*
      1. Welcome & Thanks (Volunteers/Dignitaries).
      2. The Building (Chapel/History).
      3. The Rousseau Digression (The 18 months reading).
      4. The Argument (Passivity, Division, Hypocrisy).
      5. The Counter (This space, these people, the work done).
      6. The Empathy Argument (Acting as understanding).
      7. The Fête Argument (We are the community).
      8. Conclusion (Open the doors).

      *Drafting content...*
