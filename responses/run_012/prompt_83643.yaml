answer: |-
  Good evening.

  Welcome to the Chapel Arts.

  Looking around this room, I see the faces that have made this possible. Half of you have spent the last eighteen months covered in dust. You've sanded the foyer floors until your arms ached. You've rewired the lighting rig. You've argued over paint colours and negotiated with builders who spoke a language only they understood.

  To the volunteers: this building is not brick and mortar. It is your labour. Thank you.

  To the Mayor, the councillors, and our friends in the press: thank you for your support, and for believing that a town of six thousand people deserves a space like this.

  And to my old philosophy tutor, who is watching me closely from the back: I see you. I know what you're waiting for.

  Because eighteen months is a long time to wait for a door to open. And when you are waiting, you have time to read. During the renovation, I found myself reading Rousseau. Specifically, his letter to d'Alembert on the theatre.

  Now, Rousseau is often painted as a killjoy. A man who wanted to shut down the playhouses and send everyone home to pray. But that isn't quite fair. He wrote an opera himself. He loved music. He loved gathering. But he had a specific worry about places like his own Geneva. Small towns. Tight-knit communities.

  His argument was this: in a small republic, a theatre creates a division. It puts a few people on a stage to pretend, and everyone else in the dark to watch. It makes us passive. We feel pity for the hero on stage, so we don't feel the need to help our neighbour outside. We laugh at the honest man in the play, because honesty looks awkward under the lights. And the actors? They make a living by seeming to be someone they are not. Is that a good training for citizenship? He doubted it.

  He preferred the public fête. No stage. No tickets. Everyone in the square, singing and dancing together. Actor and audience becoming one and the same.

  It is a formidable argument. And standing here, in a converted chapel, with a hundred and ten seats, I have had to answer it. Not just for my tutor, but for all of you.

  Here is my answer.

  Rousseau feared the theatre makes us spectators instead of citizens. But look at what you have done for eighteen months. You were not spectators. You were builders. You were fundraisers. You were the community acting upon itself. The work done on this building was already the fête Rousseau wanted. We did not wait for the performance to begin the community; the community built the performance space.

  Rousseau feared the division between stage and seat. But look at the scale of this room. One hundred and ten seats. There is no dark pit here. There is no distant gallery. When an actor steps onto this stage, they are not strangers from a capital city. They are the person who served you coffee yesterday. They are the councillor sitting in the front row. They are the mayor. The distance is not fifteen metres; it is barely five feet. In a room this size, the division dissolves. We are not watching aliens; we are watching ourselves, amplified.

  Rousseau feared acting was a trade in falsehood. He worried we learn to pretend. But I would argue the opposite. In a small town, it is too easy to get stuck in who we are. The shopkeeper is just the shopkeeper. The teacher is just the teacher. When you step onto this stage, you practice being someone else. You practice walking in another skin. That is not hypocrisy. That is empathy. And if a small town needs anything, it is the capacity to understand a life that is not your own.

  As for the honest man being laughed at? Well. We cannot guarantee the audience will always laugh in the right place. But we can promise this: we will not shy away from the difficult stories. We will not use this space merely to soothe ourselves. If we do, you have my permission to boo.

  Rousseau wanted the people in the square. He wanted the air to be filled with shared life. This chapel was built for gathering. It served one kind of worship for a century. Now it serves another. But the principle is identical. We come here to recognise something larger than ourselves.

  So, is this theatre a danger to our republic? Only if we let it become a place where we go to feel nothing, and leave unchanged.

  But that is not what this is. This is not a commercial venture designed to extract money from your pockets and sell you a dream. This is a trust. It is yours. You own the seats. You own the stage. You own the light.

  Tonight, we open the doors. But do not think the work is done. The performance is not just what happens on the boards. The performance is the conversation in the bar afterwards. It is the argument on the way home. It is the next meeting of the trust, where we decide what happens next.

  Rousseau wanted a community that performs itself. Well, look around you. You are that community.

  The building is finished. The dust is settled. The lights are rigged.

  Let us begin.

  Thank you.
