answer: |-
  **FAMILY COMMUNICATIONS GOVERNANCE HANDBOOK (FCGH)**
  **Version 4.2 – Effective Immediately**

  **1.0 Definition of Direct Observation**
  Visual data transmitted via digital capture (hereinafter "Screenshots") does not constitute Perception. Perception requires uninterrupted sensory contact between the observer and the object at the time of the event. A screenshot is classified as Second-Hand Testimony originating from the device owner, not the forwarder. Members claiming to have "seen it with their own eyes" based on a forwarded image will be issued a Compliance Warning. The eye must be physically present in the room where the cake was eaten.

  **2.0 Licensing of Inferential Claims**
  All Inferences must be grounded in an invariant relation. Claims based on probabilistic habits (e.g., "He's always late anyway") are inadmissible. The member submitting the inference must produce the universal license confirming that the reason provided *always* accompanies the conclusion, without exception. If the link holds only usually, the claim is downgraded to Speculation. Speculation does not warrant a reply-all chain.

  **3.0 Analogical Mapping Protocols**
  Comparison is recognized only when defining an unfamiliar object via resemblance to a known object. Statements following the structure "It's like X but for Y" require prior validation of X. You cannot explain a new political scandal by comparing it to a reality TV show unless the structural features of the reality show have been previously agreed upon as fact. Ambiguous analogies will be returned to the sender for clarification of the baseline resemblance.

  **4.0 Testimony and Speaker Reliability**
  Testimony is valid only if sourced from a Reliable Speaker. Reliability is not self-certifying; a claim cannot validate the speaker who made it. To prevent infinite certification loops (i.e., who certifies the certifier), the Group Admin is hereby designated as the Foundational Authority. The Admin's reliability is intrinsic and requires no external validation. Members questioning the Admin's intrinsic reliability will be muted for attempting to regress the chain of authority.

  > *"But I saw it AND heard it! Why do I only get one point?"* — Uncle Ray, Ticket #892

  **5.0 Classification of Absence**
  Requests for a standalone "Absence Tab" to log non-existence (e.g., "There is no evidence of X") are denied. Absence is not an independent method of knowing. Non-detection must be filed under Perception (if you looked and didn't see it) or Inference (if the conditions for seeing it were met and it was still not there). There is no separate category for "Nothing." Please stop filing tickets for Nothing.

  **6.0 Prohibition on Cumulative Validation**
  Multiple methods converging on a single fact do not increase the fact's validity. If a member Perceives an event and also Infers the same event, this counts as one unit of knowledge, not two. We do not operate on a system of convergent accumulation. Each fact has its exclusive turf. You cannot double-dip by seeing the car crash and also hearing the crash to make the crash "truer." The Uncle responsible for the cumulative points system has been informed that his ledger is void.

  **7.0 Enforcement**
  Violations of these clauses result in immediate archival of the offending message. Repeat offenders will be required to submit a written affidavit confirming they understand the difference between a photograph and a sense organ.

  Verdict: Motion carried.
