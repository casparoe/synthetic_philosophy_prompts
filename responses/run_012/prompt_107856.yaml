      *   **Constraints:**
          *   Section 1: What fits her record (consistency of rules) - ~200 words.
          *   Section 2: Where the rules split (competing interpretations) - ~300 words.
          *   Section 3: My call (prediction + reason) - ~150 words.
          *   Section 4: The case that would settle it (divergence point) - ~100 words.
          *   Total word count needs to be managed carefully to meet approximate limits.
      *   **Core Philosophical Tension:** "What they'd want if they knew everything and were thinking clearly" (Idealized Desire/Real Self) vs. "Don't override people unless something is broken in the machinery" (Procedural Autonomy/Actual Self).
      *   **Key Insight from User:** The professor emphasizes the "thinking clearly" line, but the user suspects it does more work than admitted. The crux is whether "thinking clearly" means *her* thinking clearly given her history, or a hypothetical agent choosing from scratch.

  2.  **Analyze the Six Previous Cases:**
