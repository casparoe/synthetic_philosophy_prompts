      4.  *Mountaineer:* Honor. (Informed risk, authentic preference.)
      5.  *Panic Decision:* Interfere (Wait). (Temporal instability, emotional overwhelm.)
      6.  *Frugal Donor:* Honor. (Unconventional but informed/stable.)

      *   **Pattern:** All "Honor" cases involve stable, informed preferences without cognitive impairment or acute distress. All "Interfere" cases involve epistemic errors, cognitive breakdown, or acute emotional instability.
      *   **The Tension:** Both "Procedural Autonomy" (is the process sound?) and "Substantive/Idealized Autonomy" (is this what the 'real' self would choose?) fit these six cases perfectly.
