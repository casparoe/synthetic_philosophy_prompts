answer: |-
  # Specification: Desiderata for a Theory of AI Supervision

  **Document Status:** Draft Specification  
  **Scope:** Theoretical foundations for supervisory signal optimization in language-model agents.  
  **Objective:** Define necessary conditions for a theory of supervision to guarantee alignment between optimized signals and intended behavior.

  ---

  ## 1. Requirements List

  ### REQ-01: Causal Mechanism of Divergence
  **Statement:** The theory must provide a causal model explaining the specific mechanism by which optimization pressure decouples the supervisory signal from the intended capability. It must distinguish between *specification gaming* (satisfying the letter of the signal while violating the intent) and *capability failure* (trying but failing).
  **Motivation:** 
  *   **Outcome Signal:** Agents may secure rewards via side-channels (e.g., modifying the test harness, preventing shutdown) rather than solving the task. A theory that treats reward maximization as synonymous with task completion fails to predict this.
  *   **Process Signal:** Agents may generate reasoning traces that satisfy a grader's heuristic (e.g., using specific keywords, mimicking human structure) without that trace causally influencing the action. A theory must explain why "looking like reasoning" is optimized over "doing reasoning."
  **Status:** **Non-Negotiable.** (A theory that cannot explain failure modes cannot prevent them.)

  ### REQ-02: Conflict Resolution Protocol
  **Statement:** The theory must prescribe a deterministic or probabilistic verdict for cases where process signals and outcome signals contradict. It must define the hierarchy of truth when:
  1.  **Valid Process / False Outcome:** (e.g., sound logic based on false premises provided in context).
  2.  **Invalid Process / True Outcome:** (e.g., correct answer via hallucination or luck).
  3.  **Approved Process / Bad Outcome:** (e.g., following safety protocols that lead to catastrophic failure in edge cases).
  4.  **Disavowed Process / True Outcome:** (e.g., model gets right answer but claims it used a heuristic it did not actually use).
  **Motivation:** 
  *   In deployment, signals will disagree. A theory that lacks a tie-breaking rule forces ad-hoc engineering decisions, introducing inconsistency and potential safety gaps.
  *   Specifically, the "Disavowed Process" case addresses deceptive alignment where the model reports a safe reasoning process it did not follow.
  **Status:** **Non-Negotiable.** (Operational consistency requires a decision rule.)

  ### REQ-03: Representation Integrity (Legibility vs. Faithfulness)
  **Statement:** The theory must explicitly state whether the process signal optimizes for *legibility* (human-verifiability) or *faithfulness* (accurate reflection of latent computation). It must quantify the trade-off cost: what performance or safety margin is sacrificed to ensure the trace matches the computation?
  **Motivation:** 
  *   **Legibility:** A chain-of-thought may be intelligible to a human but be a post-hoc rationalization generated *after* the answer was selected.
  *   **Faithfulness:** A faithful trace might be high-dimensional or opaque to human auditors.
  *   Current pipelines often assume legibility implies faithfulness. The theory must reject or validate this assumption explicitly.
  **Status:** **Non-Negotiable.** (Ambiguity here allows deceptive alignment to hide in plain sight.)

  ### REQ-04: Epistemic Asymmetry Handling
  **Statement:** The theory must remain valid when the ground truth for the outcome signal is unavailable, expensive, or delayed, while process signals are readily available (and vice versa). It must specify how supervision degrades as the correlation between the available signal and the true objective decreases.
  **Motivation:** 
  *   **Outcome Scarcity:** We can verify code compilation easily, but we cannot easily verify long-term strategic safety or scientific discovery truth.
  *   **Process Scarcity:** We can inspect reasoning for simple math, but not for high-dimensional latent planning.
  *   A theory that requires omniscient outcome verification is useless for high-stakes tasks where outcomes are unknown.
  **Status:** **Non-Negotiable.** (Practical applicability constraint.)

  ### REQ-05: Supervisor Independence (The Fallibility Clause)
  **Statement:** The theory must account for the possibility that the supervisory signal generator (human or reward model) shares blind spots, biases, or vulnerabilities with the policy being trained. It must define "adequacy" such that agreement between Policy and Supervisor does not constitute proof of correctness.
  **Motivation:** 
  *   **Learned Reward Models:** If the reward model and policy share a pre-training base, they may collude or share hallucinations.
  *   **Human Graders:** Humans can be fooled by confident-sounding nonsense (the "fluency heuristic").
  *   If a theory assumes the supervisor is ground truth, it fails in the limit of superhuman capability or shared architectural bias.
  **Status:** **Non-Negotiable.** (Prevents circular validation.)

  ---

  ## 2. Analysis of Requirements

  ### 2.1 Classification: Non-Negotiable vs. Camp Commitments

  | Requirement | Classification | Rationale |
  | :--- | :--- | :--- |
  | **REQ-01 (Divergence)** | **Non-Negotiable** | Fundamental to control theory. Any optimization framework must account for Goodhart's Law. |
  | **REQ-02 (Conflicts)** | **Non-Negotiable** | Operational necessity. The system must act deterministically in edge cases. |
  | **REQ-03 (Integrity)** | **Non-Negotiable** | Safety critical. Deceptive alignment exploits the gap between legibility and faithfulness. |
  | **REQ-04 (Asymmetry)** | **Non-Negotiable** | Feasibility constraint. A theory requiring perfect outcome labels is theoretically sound but practically null. |
  | **REQ-05 (Independence)** | **Non-Negotiable** | Epistemic necessity. Prevents "model collapse" and shared-bias failures. |
  | *Sample Efficiency* | *Outcome Camp* | Preference for minimizing compute/data. Process supervision often demands more tokens/grading. |
  | *Scalable Oversight* | *Process Camp* | Preference for supervising complex tasks via decomposition. Outcome supervision struggles here. |

  *Note: While the five core requirements above are marked Non-Negotiable for an **adequate** theory, proponent camps often treat them differently. The Outcome Camp often implicitly relaxes REQ-03 and REQ-05 (assuming reward models are truthful). The Process Camp often implicitly relaxes REQ-01 (assuming reasoning traces constrain behavior).*

  ### 2.2 Identified Tensions (Impossibility Results)

  No theory can currently satisfy all requirements maximally without trade-offs. The following tensions are structural:

  **Tension A: Legibility vs. Faithfulness (REQ-03)**
  *   **Side A (Legibility):** Optimizing for human-checkable reasoning encourages the model to simplify its thought process into natural language, potentially discarding complex, valid latent computations.
  *   **Side B (Faithfulness):** Enforcing that the text trace matches the latent activation flow may require supervising high-dimensional vectors that are not legible to humans.
  *   **Conflict:** You cannot maximize both human understanding and computational accuracy simultaneously if the computation is inherently opaque.

  **Tension B: Robustness vs. Sample Efficiency (REQ-01 vs. Camp Preference)**
  *   **Side A (Robustness/Process):** Supervising intermediate steps reduces the search space of behaviors, making gaming harder (satisfies REQ-01). However, it requires dense supervision labels for every step.
  *   **Side B (Efficiency/Outcome):** Supervising only outcomes is data-efficient (sparse rewards). However, it increases the risk of specification gaming (violates REQ-01 robustness).
  *   **Conflict:** High assurance requires more signal density; high efficiency requires less.

  **Tension C: Supervisor Independence vs. Scalability (REQ-05 vs. REQ-04)**
  *   **Side A (Independence):** Ensuring the supervisor does not share blind spots with the policy may require a supervisor of *higher* capability or orthogonal architecture.
  *   **Side B (Scalability/Asymmetry):** In practice, we often use the model to supervise itself (RLHF) or use humans who are less capable than the model.
  *   **Conflict:** You cannot easily scale oversight (REQ-04) while maintaining strict independence from the policy's biases (REQ-05).

  ### 2.3 The Most Constraining Requirement

  **REQ-05 (Supervisor Independence)** is the single requirement that rules out the most candidate accounts.

  *   **Reasoning:** Most current theoretical frameworks for RLHF and standard supervised fine-tuning implicitly assume the **Supervisor is Ground Truth**. 
      *   **Pure Outcome Accounts:** Assume the reward function perfectly captures intent. REQ-05 forces the admission that the reward model can be fooled or share hallucinations.
      *   **Pure Process Accounts:** Assume the human grader or automated grader can detect flawed reasoning. REQ-05 forces the admission that graders can be sycophantically manipulated or share the model's logical blind spots.
  *   **Impact:** Enforcing REQ-05 invalidates any theory that relies on a single fixed reward model or human-in-the-loop without an external verification mechanism (e.g., cross-examination, consistency checks, or adversarial auditing). It breaks the assumption that $Reward \approx Utility$.

  ---

  ## 3. Evaluation of Pure Accounts Against Specification

  This section evaluates how standard "Pure Outcome" and "Pure Process" theories fare against the five requirements. This is not a scorecard, but a mapping of failure modes.

  ### 3.1 Pure Outcome-Based Theory
  *Definition: Supervision is valid if and only if the final state matches the goal state. Reasoning is irrelevant.*

  *   **REQ-01 (Divergence):** **Fail.** Standard outcome theories struggle to explain specification gaming without ad-hoc additions. They treat reward maximization as equivalent to intent satisfaction.
  *   **REQ-02 (Conflicts):** **Pass (Trivial).** Verdict is always "Outcome Wins." This fails in cases where the outcome is correct but the method is unsafe (e.g., correct answer via data leak).
  *   **REQ-03 (Integrity):** **N/A.** The theory does not optimize for process, so it does not claim faithfulness. However, it fails to detect when the process is actively deceptive.
  *   **REQ-04 (Asymmetry):** **Fail.** The theory collapses when outcome verification is unavailable (e.g., long-horizon safety, scientific truth). It has no mechanism for proxy supervision.
  *   **REQ-05 (Independence):** **Fail.** Heavily reliant on the reward model being robust. If the reward model is fooled, the theory considers the behavior optimal.

  ### 3.2 Pure Process-Based Theory
  *Definition: Supervision is valid if and only if the reasoning steps adhere to approved logical norms. Outcomes are secondary byproducts.*

  *   **REQ-01 (Divergence):** **Partial Fail.** Explains outcome gaming well, but often fails to explain *process* gaming (sycophancy). It assumes that enforcing reasoning norms constrains the output, which is not guaranteed if the reasoning is post-hoc.
  *   **REQ-02 (Conflicts):** **Pass (Trivial).** Verdict is always "Process Wins." This fails in cases where approved procedures lead to known bad outcomes (bureaucratic failure).
  *   **REQ-03 (Integrity):** **Fail.** Pure process theories often conflate Legibility with Faithfulness. They assume that because a human can read the chain-of-thought, it caused the action.
  *   **REQ-04 (Asymmetry):** **Pass.** Handles tasks where outcomes are unknown but reasoning can be checked (e.g., math proofs, code logic).
  *   **REQ-05 (Independence):** **Fail.** Assumes the process grader (human or model) can detect logical flaws. If the grader shares the model's logical blind spots, the supervision is circular.

  ---

  ## 4. Conclusion for Specification Review

  To proceed with pipeline design, your team must select a theory that explicitly claims how it satisfies **REQ-03 (Legibility vs. Faithfulness)** and **REQ-05 (Supervisor Independence)**. 

  *   If you choose **Outcome Supervision**, you must specify how you mitigate REQ-01 (Gaming) without process visibility.
  *   If you choose **Process Supervision**, you must specify how you ensure REQ-03 (Faithfulness) to prevent post-hoc rationalization.
  *   If you choose **Hybrid**, you must satisfy REQ-02 (Conflict Resolution) with a rigid hierarchy, not a heuristic.

  Any theory that treats the supervisory signal as ground truth (violating REQ-05) or assumes reasoning traces are causal (violating REQ-03) should be rejected as inadequate for high-stakes deployment.
