prompt: |-
  I'm assembling a small battery of reasoning problems for a dataset, and I'd like you to construct one to my specifications. The topic is a hard choice between two incommensurable values. To keep terms fixed: call two options on a par when neither is better or worse than the other and they are not equal either, and call them incomparable when no positive ranking holds between them at all, so better, worse, equal, and on a par are all false. Build a single realistic scenario — a workplace or family decision, no trolleys and no science fiction — presenting a two-way hard choice, and then apply a small-improvement test to it: add a variant of one option that is a small but clear improvement on that option, and determine where that improved variant stands relative to the other original option. The scenario must be engineered so that this test resolves differently under the two accounts of incommensurability: under the on-a-par account it yields a definite verdict about the improved variant, while under the incomparable account it yields none. After the scenario, walk through both readings and why each gives the verdict it does, identify the single feature of the scenario that is doing the work, say what happens if that feature is removed, and explain how a defender of the incomparable account would try to block the case. The point is to test whether a model can run the structure of the argument rather than recall the surrounding literature, so the scenario itself should be no longer than one paragraph.
