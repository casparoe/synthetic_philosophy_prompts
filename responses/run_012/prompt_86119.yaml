answer: |-
  You are right to be suspicious. Your friend is conflating a sociological observation with a metaphysical claim, and they are using Pascal to bridge that gap in a way Pascal himself would likely reject. "Might makes right" is one of those phrases that functions as a conversation-stopper precisely because it is ambiguous enough to slide between descriptive, normative, and conceptual claims without notice.

  Here is the menu of theses you asked for, followed by the Pascal analysis, with the requested self-criticism included.

  ### Part 1: A Menu of "Might Makes Right" Theses

  The phrase is usually doing one of four distinct jobs. Your friend needs to know which one they are selling, because the truth-value changes drastically depending on the choice.

  | Thesis Type | Precise Claim | Evaluation | Does your friend need this? |
  | :--- | :--- | :--- | :--- |
  | **1. Descriptive (Sociological)** | "In practice, legal outcomes are determined by who has the power to enforce them." | **Platitude / Trivially True.** No serious theorist denies that enforcement matters. But this doesn't prove law *is* power, only that power affects law's efficacy. | **No.** This is too weak. It admits international law exists but is weak. Your friend wants to say it *isn't* law at all. |
  | **2. Conceptual (Thrasymachean)** | "The concept of 'justice' (or 'law') is nothing other than the interest of the stronger." | **Substantive & Controversial.** This denies the existence of objective justice. It claims "right" is just a label we paste on "might." | **Yes.** To claim international law is *nothing more* than great-power preference, they need this. They are denying the conceptual autonomy of law. |
  | **3. Normative (Hobbesian)** | "One ought to obey the sovereign power because the alternative is a war of all against all." | **Substantive & Defensible.** This grants legitimacy to power not because power *is* right, but because obedience is prudentially necessary for order. | **Maybe.** This saves "order" but sacrifices "justice." It justifies obedience, but doesn't necessarily validate the *content* of the law as just. |
  | **4. Debunking (Genealogical)** | "Beliefs about objective justice are psychological or social effects produced by power relations." | **Substantive & Defensible (in part).** This is the Marxist/Nietzschean/Foucaultian move. It says justice-claims are masks for power, even if the claimants don't realize it. | **Likely.** This is the implicit engine of their argument. They assume that because power *influences* law, power *constitutes* law. |

  **The Verdict on the Friend's Argument:**
  Your friend is trying to derive the **Conceptual** thesis (Law = Power) from the **Descriptive** premise (Power enforces Law). This is a classic is-ought (or is-is) fallacy. Just because force is necessary for the *efficacy* of justice (Descriptive) does not mean force is the *definition* of justice (Conceptual).

  ### Part 2: The Pascal Analysis

  Your intuition that Pascal is being mangled is correct. However, the situation is more complicated than a simple "false citation." Pascal *does* say things that sound like realism, but his metaphysical commitments prevent him from landing where your friend wants to go.

  **The Textual Basis**
  The fragment your friend is referencing is almost certainly **Lafuma 103** (Sellier 97). The standard translation runs roughly:
  > "Justice without force is powerless; force without justice is tyrannical. Justice without force is contradicted, because there are always offenders; force without justice is accused. We must then get justice and force together; and for that, make sure that what is just be strong, or that what is strong be just."

  **What Pascal Is Actually Doing**
  Pascal is not writing political theory; he is writing apologetics. His goal is to demonstrate the "wretchedness" of the human condition without God.
  1.  **He distinguishes True Justice from Customary Justice.** Pascal believes in an objective, divine justice (accessible through Christianity). He does *not* believe "might makes right" in a metaphysical sense.
  2.  **The "Might" Move is a Compromise.** Pascal argues that because humans are corrupt and cannot agree on true justice, we have agreed to legitimize force via custom and law. We "made the strong just" not because they *are* just, but because we need order.
  3.  **It is a Debunking Claim, not a Conceptual One.** Pascal is saying: *Earthly* authority is grounded in custom/power, not truth. But he maintains that *True* justice exists elsewhere (in God).

  **Which Reading Does Pascal Hold?**
  Pascal holds a **Theological Debunking** position.
  *   **Against your friend:** Pascal would deny the Conceptual thesis. He believes there *is* a fact of the matter about justice, and earthly power usually misses it.
  *   **With your friend:** Pascal agrees that earthly *political legitimacy* relies on force/custom rather than natural truth. He is a skeptic about human reason's ability to establish justice without authority.

  **Why the Friend is Wrong to Use Pascal for IR Realism**
  Your friend wants to use Pascal to say, "International law is just preference." Pascal would say, "International law is a necessary fiction to keep us from killing each other, but it is not *True Justice*."
  *   **Friend's Conclusion:** Therefore, we should not pretend international law binds us morally.
  *   **Pascal's Conclusion:** Therefore, we should obey earthly laws to keep peace, while recognizing they are flawed, and look to God for true justice.

  Pascal is actually *more* supportive of the authority of law than your friend is, because Pascal thinks we are duty-bound to follow established custom to avoid chaos, even if that custom isn't "truly" just. Your friend uses Pascal to undermine law; Pascal uses the weakness of law to undermine human pride.

  ### Part 3: Self-Criticism and Limitations

  I need to flag three significant uncertainties in this analysis, per your request.

  **1. The Fragmentary Nature of the *Pensées***
  Pascal died before organizing the *Pensées*. The "text" is a reconstruction by editors (Lafuma, Sellier, Le Brun, etc.). Fragment 103 is one of the more coherent "political" notes, but it sits alongside other notes where Pascal suggests custom is the *only* basis of virtue we have access to.
  *   *Uncertainty:* It is possible to read Pascal as a more radical skeptic than I have above. Some scholars argue that for Pascal, since we cannot know God's justice clearly in this life, custom *becomes* our only operative justice. If you take that line, your friend's reading gets a bit more traction, though it still misses the theological humility Pascal demands.

  **2. The Anachronism of "International Law"**
  Applying Pascal (1623–1662) to modern international law is a retrofit. Pascal is thinking about domestic sovereignty (the King of France) and the transition from feudal custom to absolutism.
  *   *Critique:* The leap from "Domestic law rests on force" to "International law is just great-power preference" skips the Westphalian shift. Pascal assumes a sovereign who *can* enforce. In IR, there is no sovereign. Using Pascal to explain the *absence* of a global sovereign is speculative. He might argue that without a global sovereign, there is no global law, only a state of war—which actually supports your friend's realism, but for theological reasons (original sin) rather than structural ones.

  **3. The Ambiguity of "Force" (*Force*)**
  In French, *force* can mean physical coercion, but also moral strength or validity.
  *   *Uncertainty:* In Lafuma 103, *force* clearly means coercive power. However, in other fragments, Pascal plays on the double meaning. If your friend is relying on a translation that blurs this, they might be attributing a moral validity to power that Pascal explicitly denies. Pascal says we must *make* the strong just; he does not say the strong *are* just.

  ### Summary for the Group Chat

  If you want to reply without being pedantic:

  1.  **Call the ambiguity:** "Might makes right" is doing too much work. Are you saying power *determines* outcomes (true but boring), or that power *defines* justice (false)?
  2.  **Correct the Pascal:** Pascal doesn't say might *is* right. He says because humans are too corrupt to agree on right, we *pretend* might is right to keep the peace. He's lamenting that fact, not celebrating it as a theory of law.
  3.  **The IR Point:** Pascal argues we need a sovereign to enforce law. The problem with International Law isn't that it's a sham; it's that there's no global sovereign to provide the "force" half of Pascal's equation. That's a structural problem, not proof that justice doesn't exist.

  Your friend is using Pascal's *diagnosis of human sin* to justify a *theory of political legitimacy* that Pascal would find prideful. Pascal thinks we should obey the power; your friend thinks the power proves it deserves obedience. Those are opposites.
