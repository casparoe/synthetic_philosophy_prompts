  ### 9. Troubleshooting Guide (What Will Go Wrong)

  | Problem | Prediction | Mid-Run Fix |
  | :--- | :--- | :--- |
  | **Time Creep** | Round 1 drawing takes too long. | **Intervention at 15 mins:** "Stop drawing. Finish your current trial, then tally what you have. We need 10 trials, not 20." |
  | **Method 3 Bias** | Table 5 drops the marker cap and aims for the center. | **Pre-emptive:** Use the "Grid Deck" correction in the instruction card (see Section 4). Do not let them free-hand drop. |
  | **The "Diameter" Issue** | A physicist points out that diameters are double-counted in Method 1. | **Response:** "In continuous probability, a single line has zero width. It doesn't change the percentage. Good catch, but it doesn't save the paradox." |
  | **Straw Chaos** | Straws bounce off the table/floor. | **Fix:** Use Blu-Tack on the straw ends, or just lay them down gently from 30cm height. "Drop" means "Release without velocity." |
  | **Cube Math Panic** | General readers freeze on the fractions. | **Fix:** The Cheat Sheet does the math. Their job is just to read the "Setting" and accept the number. Don't let them derive it. |
  | **Philosopher Block** | "This is just language ambiguity." | **Response:** "Agreed. But science is language that bleeds. If you build a bridge using the wrong probability, it falls. The ambiguity has a cost." |

