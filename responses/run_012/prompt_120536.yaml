  | step (number) | question (the question I ask) | sufficient answer (what counts as enough to move on) | if I cannot answer (what to do instead) | effect on the decision (one of: stops the claim, narrows the claim, hands off to the board) |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | Is the trait in the study defined and measured exactly as we measure the outcome we care about? | Yes: The study measures the same skill (e.g., "reading comprehension" vs. "reading comprehension"), at the same age, using comparable tests. | Assume the trait is different. Treat the number as a rough analogy, not evidence. | stops the claim |
  | 2 | Was the study population demographically and environmentally similar to our district? | Yes: The study subjects match our students in socioeconomic status, language background, and school system structure. | Assume the number does not apply to our students. Mark the claim as "external evidence only." | stops the claim |
  | 3 | Does the claim confuse explaining differences between children with predicting change for all children? | No: The speaker acknowledges that high heritability explains current variance, not the impossibility of raising the average. | If they insist high heritability prevents average improvement, reject the logic. | stops the claim |
  | 4 | Does the claim specify which environmental factors make up the non-heritable portion? | Yes: The speaker identifies specific factors (e.g., "nutrition," "instruction time") that the non-heritable variance represents. | Assume the "environment" is not defined. The claim that "environment matters" is too vague to support a specific program. | narrows the claim |
  | 5 | Is the claim about whether children will differ in how much they benefit from the program? | Yes: The speaker distinguishes between average gain and variation in gain (GxE interaction). | Assume the program affects all children similarly. Do not use heritability to argue for or against differential targeting. | narrows the claim |
  | 6 | Was the heritability estimate calculated in an environment as uniform as ours? | Yes: The study environment had similar variation in schooling/resources as our district. | If their environment was more uniform, their heritability number is likely higher than ours. Adjust expectation downward. | narrows the claim |
  | 7 | If this is a screening claim, does the predictor measure genetics or just correlate with them? | Yes: The tool measures causal genetic variants, not just proxies that might fail in our population. | Assume the screen is a proxy. It may fail if our environment differs from the study. | stops the claim |
  | 8 | Is there independent evidence that this specific trait has been modified by intervention before? | Yes: There are peer-reviewed examples of this trait changing under similar interventions despite high heritability. | If no evidence exists, treat the high heritability as a warning sign, not a stop sign. | narrows the claim |
  | 9 | Is the argument actually about whether this program is the best use of limited funds? | Yes: The speaker explicitly compares the cost-benefit of this program against alternatives. | If they do not name an alternative, treat the argument as an objection to spending, not genetics. | hands off to the board |
  | 10 | Is the objection based on fairness or values rather than scientific efficacy? | Yes: The speaker states that even if it works, they oppose it on ethical grounds (e.g., "we shouldn't engineer traits"). | If values are unstated, ask them to state them. Do not debate values as if they were data. | hands off to the board |

  ### Procedure Notes and Failure Modes

  **Judgment Calls Dressed as Procedure:**
  Steps 8, 9, and 10 are judgment calls. Step 8 requires you to weigh the quality of "independent evidence," which is subjective without a meta-analysis. Step 9 requires you to decide if a cost-benefit argument is being masked as a scientific one. Step 10 requires you to discern when a scientific argument is actually a moral one. The procedure cannot automate these; it only forces them into the open.

  **Failure Modes:**
  1.  **False Negatives:** This procedure will wrongly wave away claims where the science is sound but the documentation is inaccessible to a layperson (e.g., you cannot access the demographic data of a 20-year-old study). In this case, the procedure defaults to skepticism. This is safer for a board vote than defaulting to trust.
  2.  **False Positives:** The procedure may wrongly take a claim seriously if the study matches our population but the intervention is still flawed. Step 4 protects against this, but only if you can identify the environmental factors.
  3.  **The "Values" Trap:** The procedure cannot resolve disputes where the board agrees on the science but disagrees on the goal (e.g., "We agree this will raise test scores, but we don't value test scores"). Step 10 is the release valve for this.

  **Plain Language Lines:**
  *   **When the number does not bear:** "This number explains why children differ in the current system, not whether we can improve the system itself."
  *   **Warning on Unfairness:** Do not use this line if the speaker has provided evidence that the specific intervention has failed in similar populations; in that case, the number *does* bear on the decision, and dismissing it would be prejudicial.

