      *   *Heritability ($h^2$):* Proportion of phenotypic variance in a *specific population* at a *specific time* attributable to genetic variance. It is *not* the proportion of a trait caused by genes in an individual.
      *   *Intervention:* Heritability says nothing about the *modifiability* of a trait. PKU is highly heritable but curable by diet (environment). Height is highly heritable but changed by nutrition.
      *   *Variance vs. Mean:* Heritability explains differences *between* kids in the current environment. It does not predict what happens to the *average* if the environment changes for everyone.
      *   *GxE Interaction:* Genetic effects might depend on the environment. A program might work better for some genotypes than others (differential susceptibility), but $h^2$ doesn't measure this directly.
      *   *Population Specificity:* $h^2$ from a Swedish twin study might not apply to a US urban district.
      *   *Measurement:* Is the trait measured the same way? (Standardized test vs. teacher observation).
      *   *The "Gap" Argument:* High heritability doesn't mean gaps can't be closed by environmental changes that affect groups differently.
      *   *The "Environment" Argument:* Low heritability means environment matters *now*, but doesn't guarantee a *specific* new environment will work.

