answer: |-
  | Defeater (Short Name) | What Exactly It Targets in REU | How Decisive | Concede or Dismiss? | What the World/Evidence Would Have to Look Like |
  | :--- | :--- | :--- | :--- | :--- |
  | **Dynamic Inconsistency** | **Sequential Rationality / Planning.** REU agents violate Dynamic Consistency: a plan optimal at $t_1$ may not be optimal at $t_2$ even with no new info. This opens the agent to money pumps unless they adopt "Resolute Choice." | **Serious** | **Concede** (but reframe). Buchak admits REU violates standard dynamic consistency but argues Resolute Choice is a rational alternative to Sophistication. | Agents systematically stick to prior plans despite current preferences shifting *without* new information, and refuse trades that would pump them, citing commitment rather than preference change. |
  | **The "Floating $r$" Problem** | **Empirical Content / Falsifiability.** If the risk function $r$ can vary by context (framing, domain, stakes), REU can rationalize *any* complete/transitive preference order. It becomes a descriptive fit, not a normative constraint. | **Fatal** (if $r$ floats) | **Dismiss** (Normatively). Buchak insists $r$ must be a stable global character trait. Empirically, she concedes people vary but calls it irrationality. | If experimental data shows $r$ shifts wildly across trivial framings (e.g., "90% survival" vs. "10% mortality") *and* we accept those shifts as rational, REU loses normative bite. If $r$ is stable across domains (gambling, insurance, health), REU survives. |
  | **Description Dependence** | **Extensionality / State Individuation.** REU preferences can change based on how states are described or individuated, even if the stochastic prospects are identical. This violates the principle that rational choice should depend on outcomes, not descriptions. | **Serious** | **Dismiss**. Buchak argues risk is sensitive to the "structure" of the gamble, which includes how outcomes are grouped. | Choices flip when the same probability distribution is presented with different partitions of the state space, and subjects insist the *risk* felt different despite identical odds. |
  | **Stochastic Dominance Violations** | **Dominance Axioms.** While REU respects First-Order Stochastic Dominance (FOSD) in static choices (if $r$ is monotonic), it can violate State-Wise Dominance in sequential or framed contexts. | **Awkward** | **Dismiss**. Buchak argues State-Wise Dominance is too strong a requirement for risk-sensitive agents; FOSD is the real constraint. | An agent chooses option A over B even though A yields a better outcome than B in every possible state, *and* the agent acknowledges the states are identical. (REU usually avoids this in static cases). |
  | **Ambiguity Conflation** | **Scope / Risk vs. Uncertainty.** REU is designed for risk (known probabilities). It lacks native tools for ambiguity (unknown probabilities). Extending it (e.g., REU + MaxMin) creates interaction effects that may not match behavior. | **Awkward** | **Concede**. REU is not a theory of ambiguity. It must be hybridized, which adds complexity and parameters. | Subjects show distinct attitudes toward ambiguity (unknown $p$) vs. risk (known $p$) that cannot be captured by simply applying $r$ to a set of priors without additional ambiguity-aversion parameters. |
  | **Common-Ratio vs. Common-Consequence** | **Specific Allais Predictions.** REU predicts specific patterns of violation (e.g., "fanning" out from the origin). It does not predict *all* Allais-type violations, only those consistent with a single global $r$. | **Serious** | **Concede**. REU makes sharper predictions than EU, which means it can be empirically falsified by specific violation patterns. | Data shows subjects violating Common-Consequence but not Common-Ratio (or vice versa) in ways that require *different* shapes of $r$ for structurally identical tasks. |

  ### Verdict

  Your friend is half-right, but missing the normative point. **On the "floating $r$" objection:** Formally, yes, any preference order satisfying completeness, transitivity, and continuity can be represented by *some* risk function $r$ and utility $u$. If $r$ is allowed to vary arbitrarily between decisions, REU is indeed just a redescription (unfalsifiable). However, Buchak's project is normative, not purely descriptive: she argues rationality *requires* $r$ to be stable across contexts (a global risk attitude). If you accept that constraint, REU becomes highly falsifiable (it predicts specific patterns like the Allais common-consequence effect). The empirical bet is that rational agents *should* have stable $r$, even if actual humans don't. If you find context-dependence rational, REU collapses; if you find it irrational, REU stands.

  **On the formal costs:** The dynamic inconsistency issue is the real price of admission. You cannot have REU's accommodation of Allais preferences *and* standard Dynamic Consistency (Sophistication). You must choose Resolute Choice. This isn't a "bug" Buchak hides; it's a feature she defends. But it means REU agents can be money-pumped by a sophisticated EU agent. Whether this is "fatal" depends on whether you think avoiding money pumps is a constitutive requirement of rationality (Dutch Book arguments) or merely a pragmatic hazard.

  **On Dominance:** You have the convexity intuition right, but be careful on dominance. REU *does* respect Stochastic Dominance (monotonic $r$ ensures you always prefer more probability on better outcomes). The worry is usually State-Wise Dominance under different descriptions. REU survives the formal dominance checks better than it survives the dynamic checks.

  **On Ambiguity:** REU doesn't solve ambiguity. It treats risk. To handle ambiguity, you need to layer it (e.g., apply REU to a set of priors). This works, but it introduces a second parameter (ambiguity attitude) which risks the same "floating parameter" problem your friend worried about.

  **Bottom Line:** REU is well-insulated against formal contradictions (it's mathematically sound), but it is vulnerable on **dynamic coherence** and **empirical stability**. It is a real theory, not just curve-fitting, *provided* you enforce the stability of $r$ as a normative requirement. If you treat $r$ as a free parameter per decision, your friend wins: it's just Ptolemaic epicycles for utility.
