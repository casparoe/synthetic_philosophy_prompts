answer: |-
  ### (1) Exam Question

  **Time Allowed:** 60 Minutes
  **Materials:** Closed Book. No Notes. No Internet.

  **The Scenario:**
  You are the adjudicator for a self-governing body operating under the following rules:
  *   **R1:** R1 and R2 may be amended only by a unanimous vote of all eligible players.
  *   **R2:** Any rule other than R1 and R2 may be amended by a simple majority.
  *   **R3:** A proposal whose adoption would change the threshold required for its own adoption is out of order.

  **The Facts:**
  The body consists of 9 players. A proposal **P** seeks to amend R1 to read: *"R1 may be amended by a simple majority."* The players are split 5-4 in favor of P. Under R1, P lacks the required unanimity. Under R2, P has a majority.
  A separate proposal **Q** sought to repeal R3 entirely. Q is not entrenched; under R2, it required only a simple majority. Q has just passed 5-4. R3 is now repealed.

  **The Task:**
  Rule definitively on whether **P** now passes or fails.
  In your reasoning, you must:
  1.  Explain whether the passage of Q altered the legal status of P.
  2.  Defend your reading of the relationship between R1 and R3 against the opposing interpretation.
  3.  Explain what your ruling implies about how R1 and R2 were validly adopted in the first place.

  *Do not hedge. You must find that P either passes or fails. Marks are awarded for the coherence of your justification, not the specific verdict.*

  ***

  ### (2) Model Answer

  **Verdict:** Proposal P fails.

  **Reasoning:**
  The fate of P turns on whether R1 operates as a substantive rule of change or merely as a target of R3's procedural prohibition. I rule that R1 establishes a binding procedural requirement independent of R3. Therefore, the repeal of R3 via Q does not lower the voting threshold for P.

  R1 explicitly states that amending R1 requires unanimity. This is a rule of *competence*: it defines the power required to effect a change. R3, by contrast, was a rule of *order*: it defined which proposals could be entertained. While R3 was in force, P was potentially "out of order" because it sought to change its own threshold (shifting from unanimity to majority). Q removed this bar. P is now "in order" and may be voted upon. However, being "in order" is distinct from "passing." Once P is admitted to the vote, R1 dictates the count required for success. Since 5-4 is not unanimous, P fails.

  **The Competing Reading:**
  The opposing view argues that R3 was the *source of validity* for self-entrenchment. Under this reading, R1's claim to require unanimity for its own amendment was only permissible because R3 regulated such self-reference. By repealing R3, Q removed the logical ground supporting R1's entrenchment clause. Consequently, R1 reverts to the default threshold in R2 (simple majority), and P passes.

  This reading must be rejected because it conflates permission with validity. R3 prohibited specific self-referential proposals; it did not grant validity to existing rules. If R1's entrenchment depended on R3's continued existence, the ruleset would be unstable, collapsing whenever a procedural guardrail is removed. The more coherent reading is that R1 creates a substantive hurdle that survives the removal of procedural bars. Q cleared the path, but R1 still guards the gate.

  **Implications for Adoption:**
  This ruling carries specific implications for the origin of the ruleset. If R1 is binding and requires unanimity to amend itself, it implies R1 must have been adopted unanimously at Time Zero. A rule cannot demand a higher threshold for its own alteration than the threshold used to create it, unless a prior meta-rule authorized that entrenchment.

  If we adopted the competing reading (that P passes), it would imply R1 was originally adopted by simple majority under R2, and its entrenchment was merely a provisional feature allowed by R3. However, this creates a paradox: if R1 was adopted by majority, how did it instantly bind future majorities to unanimity without a higher authority?

  Therefore, to maintain the coherence of R1 as a binding constraint that survives Q, we must accept that the foundational act of adopting R1 satisfied R1's own requirement. The system rests on an initial unanimous agreement. To rule otherwise is to allow a simple majority to rewrite the constitution of their own authority without the consent the constitution demands. P fails.

  ***

  ### (3) Marking Scheme

  **Total Marks:** 20

  | Criteria | Marks | Must-Hit Point | Common Mistake |
  | :--- | :---: | :--- | :--- |
  | **1. Definitive Verdict** | 4 | Candidate clearly states P passes OR fails without hedging. | Sitting on the fence (e.g., "It depends on the court"). |
  | **2. R1 vs. R3 Function** | 4 | Distinguishes R1 (vote threshold) from R3 (agenda/order). | Treating R3 repeal as automatically changing the vote count. |
  | **3. Effect of Q** | 4 | Explains *why* Q does (or does not) change P's legal outcome. | Assuming Q passing automatically validates P. |
  | **4. Origin Implication** | 4 | Explains what the verdict implies about R1's initial adoption (Unanimity vs. Majority). | Ignoring the "Time Zero" adoption problem entirely. |
  | **5. Counter-Argument** | 4 | Engages with the opposing reading and explains why it is rejected. | Stating one view without addressing the logical alternative. |

  **Note on Grading:**
  *   **Consistency is Key:** A candidate can argue P *Passes* (arguing R1's entrenchment falls with R3) and still get full marks, provided they consistently argue the Origin implication (that R1 was originally majority-adopted) and defend against the Unanimity reading.
  *   **The "Q" Trap:** Candidates who argue Q changes nothing but fail to explain *why* R1 survives the repeal of R3 lose marks in Criterion 3.
  *   **The "Origin" Trap:** Candidates who rule on P but do not link their reasoning back to how the rules started lose all marks in Criterion 4.
