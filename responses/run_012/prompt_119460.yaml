  7.  **Review against Constraints:**
      *   *No "discovery"?* Check. Used "named," "drafted," "mapped."
      *   *No "socially constructed" dismissal?* Check. Acknowledge the reality of the exhaustion.
      *   *Hacking's concept used?* Yes, the mutual shaping of classifier and classified.
