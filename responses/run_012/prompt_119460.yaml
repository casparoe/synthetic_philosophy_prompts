answer: |-
  Good evening, everyone.

  Forty years. It is a staggering amount of time to spend paying attention to the human mind. When you add up the hours, the sessions, the notes, the late nights staring at a draft on a dining room table, it becomes more than a career. It becomes a landscape. And looking around this room, I realize that different people have walked different parts of that landscape with her.

  Some of you are here because you work in the field. You know [Boss's Name] as the colleague who brought clarity to chaos. You saw the patterns before they had names. You know the relief of having a vocabulary for something that felt invisible.

  Some of you are here because you carry the diagnosis she helped write. You know her as the voice on the other side of the desk, or perhaps the name on the page that finally explained why the world felt so heavy. You know that a diagnosis can feel like a key, but sometimes, it can also feel like a cage.

  And some of you are here because you are her family. You know her as the one who came home late, who talked about conferences in hotel ballrooms, who was thinking about minds even when she was supposed to be resting.

  Tonight, I want to talk about the space between those perspectives. Because if there is one thing [Boss's Name] has taught us over four decades, it is that the truth isn't found in the silence of a textbook. It is found in the noise of a conversation.

  We are here to celebrate her work from the late eighties. We all know the story. She drafted criteria for a condition that needed to be seen. The first version of those words said that people with this condition withdraw. They avoid social contact. They step back from the world. It was a description written from the outside looking in. It was what a clinician sees when they watch a patient leave the room.

  But here is what makes [Boss's Name] remarkable. She didn't treat those words as stone tablets. She didn't treat her own definition as a discovery of a pre-existing bug in the human machine. She treated it as an invitation.

  Over the years, something profound happened. The people who were given this name took it up. They lived inside it. They tested it against the reality of their mornings, their commutes, their dinner parties. And they came back to her and said, "You got part of it wrong."

  They told her: We don't avoid contact because we don't care. We avoid it because the work of making ourselves readable to other people is exhausting. It isn't withdrawal; it's fatigue. It is the cost of translating yourself into a language everyone else understands.

  That change in the manual—from avoidance to exhaustion—didn't come from a lab. It came from the people living the life.

  This is the legacy I want to toast tonight. It is a rare thing in medicine, and an even rarer thing in psychiatry. Usually, the doctor names the thing, and the patient becomes the thing. The category is fixed, and the person has to fit inside it. But [Boss's Name] understood that when you give a human experience a name, you change the experience. The name changes how people see themselves. And when people see themselves differently, they act differently. And when they act differently, the name has to change to keep up.

  It is a loop. She drew a map, but the travelers told her where the mountains actually were. She created a category, and the people in that category grew into it, stretched it, and reshaped it until it actually fit.

  To the clinicians in the room: She gave you a tool to help, but she taught you that the tool must be held lightly.
  To the patients in the room: She gave you a language, but she listened when you told her how to speak it. She didn't invent you. She didn't find you. She met you. And in that meeting, both of you changed.

  That is a difficult way to work. It requires humility. It requires admitting that the expert does not hold all the truth. It requires believing that the person in the chair knows something the person with the pen does not.

  Of course, none of this happens in a vacuum. It happens because someone is holding the fort.

  [Boss's Name], I need to turn to your husband and your children. We talk about the forty years of clinical work, but we don't talk about the forty years of dinners that were cold because a call ran long. We don't talk about the weekends spent editing drafts while everyone else was playing. You remember the conferences, yes, but you also remember the empty chair at the school play. You know that this work required a massive subsidy of love and patience from this family. A career like this is not a solo act. It is a family project. The stability you provided allowed her to be flexible with the world. If she could afford to change her mind about the criteria, it was because you were keeping the ground steady beneath her feet.

  So, as you step into retirement, [Boss's Name], I hope you know how you are seen.

  You are not just the author of a definition. You are the architect of a bridge. You built a structure that allowed clinicians to understand patients, and allowed patients to understand themselves. And when the traffic changed the bridge, you reinforced it. You let the definition breathe.

  In a field that often demands certainty, you offered curiosity. In a field that often demands authority, you offered partnership.

  The manual will have your criteria. But the real record of your work is in this room. It is in the clinicians who listen better because of you. It is in the people who feel less alone because of you. And it is in the family who loved you through all of it.

  May your retirement be filled with the same kind of rich, complex, evolving conversation that you gave to us. But I hope, for your sake, that the only criteria you have to meet from now on are your own.

  To [Boss's Name].
