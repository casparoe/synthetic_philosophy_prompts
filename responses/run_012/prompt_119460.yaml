      *   **Key Fact:** In the late 80s, she wrote criteria for a diagnosis now in the manual (DSM).
      *   **The Twist:** The criteria evolved. Original (late 80s): Patients avoid social contact. Current: Patients are worn out by the extra work of being readable to others. This change came from *patients*, not clinicians.
      *   **The Audience:** Three distinct groups:
          1.  Clinicians (believe she identified a real thing).
          2.  People with the diagnosis (feel she invented/defined them).
          3.  Family (husband/kids, remember the conferences/work, want warmth).
      *   **Theoretical Framework:** Ian Hacking's "looping effects" (categories change people, people change categories).
      *   **Constraints:**
          *   Do *not* call it a "discovery" (implies pre-existing natural kind).
          *   Do *not* say "it's all socially constructed" (dismisses the clinicians' view and the reality of the suffering).
          *   Must be warm (not a dry seminar).
          *   No citations.
          *   Length: About 6 minutes (roughly 800-900 words spoken at a moderate pace).

  2.  **Deconstruct the Theoretical Challenge (Hacking's Looping Effect):**
      *   *The Problem:* If I say she "found" the disorder, I alienate the patients who feel labeled by a construct. If I say she "made it up," I alienate the clinicians who see real suffering and the family who knows her dedication.
      *   *The Solution:* Focus on the *relationship* and the *conversation*. The diagnosis isn't a stone tablet; it's a living language. She started the sentence, but the patients finished it. The "truth" is in the interaction, not just the definition.
      *   *Tone:* Respectful, nuanced, celebratory, human.

  3.  **Drafting - Section by Section:**

      *   **Opening (Warmth & Context):** Acknowledge the occasion, the 40 years, and the mix of people in the room. Establish the bond.
          *   *Idea:* Start with the sheer weight of 40 years. Acknowledge the different ways people know her.

      *   **The Core Conflict (The Diagnosis):** Address the elephant in the room without being clinical. Talk about the late 80s work.
          *   *Constraint Check:* Don't say "discovery." Don't say "invention."
          *   *Phrasing:* She drew a map. But maps change as the terrain is walked.
          *   *Specific Detail:* Mention the shift from "avoiding contact" to "exhaustion from being readable." This is crucial evidence of the looping effect.

      *   **Applying the Looping Effect (Without Naming It):** Show how the label changed the people, and the people changed the label.
          *   *Metaphor:* A conversation. A mirror that talks back.
          *   *For the Clinicians:* You saw a pattern she named.
          *   *For the Patients:* You lived the name and taught her what it really felt like.
          *   *Synthesis:* The diagnosis isn't a cage; it's a meeting place.

      *   **The Family (Warmth):** Bring it back to the personal cost and support.
          *   *Idea:* While she was thinking about minds, you were holding the home together. You saw the late nights, the conferences.

      *   **Conclusion (The Toast):** Summarize her legacy. It's not the manual; it's the understanding.
          *   *Final Image:* Retirement as a new chapter, not an end.

  4.  **Drafting - Iteration 1 (Mental Outline & Tone Check):**
      *   *Okay, start with "Good evening." Too boring.* Start with "Forty years is a long time."
      *   *Need to address the diagnosis carefully.* "She wrote the criteria." Some say she found it, some say she made it. Actually, she started a conversation.
      *   *The shift:* First it was about hiding. Now it's about tiredness. Who told her that? The patients.
      *   *Hacking bit:* The kind of person you are changes when you know the kind. And the kind changes because of the people.
