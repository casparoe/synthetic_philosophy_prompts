answer: |-
  # Behavior Decision Procedure

  ### 1. Terminology & Constraints
  *Use these definitions for the procedure. Do not use marketing terms like "AI" or "Smart."*
  *   **Level 1 (Hardcoded):** Behavior is fixed in code. No adaptation at runtime. (Darwinian)
  *   **Level 2 (Trial & Error):** Agent acts, observes reward/punishment, updates policy. Requires real-world feedback. (Skinnerian)
  *   **Level 3 (Simulation):** Agent runs internal "what-if" scenarios before acting. Requires compute budget for modeling. (Popperian)
  *   **Level 4 (Offload):** Agent uses external tools, lookup tables, or human handoff to decide. (Gregorian)
  *   **Hard Constraints:**
      *   **Robot Movement:** Max 200ms latency. Weak onboard compute. **Level 2 forbidden** (cannot learn by crashing).
      *   **Chatbot:** Max 2s latency. Nightly retrain allowed.
      *   **Safety:** Any risk of physical injury mandates Level 1 or verified Level 3.
      *   **Sign-Off:** Any behavior changing robot movement requires Manager review (20min budget).

  ### 2. Decision Questions
  *Run these in order. The first "Yes" that satisfies safety/constraints determines the level.*

  **Q1: What is the cost of immediate failure on Day 1?**
  *   **Answer:** "Injury/Death" or "Major Financial Loss (> $X)".
  *   **Action:** If True, **Level 2 is forbidden**. Proceed to Q2.
  *   **Action:** If False ("Minor Inconvenience"), Level 2 is permitted for Chatbot only. Proceed to Q2.

  **Q2: Can this be solved with fixed rules (If-Then-Else)?**
  *   **Sufficient Answer:** Yes, the edge cases are known and enumerable.
  *   **Action:** Select **Level 1**. Stop.
  *   **Check:** If this affects robot movement, **[MANAGER SIGN-OFF REQUIRED]**.

  **Q3: Do we have a high-fidelity simulator and compute budget for internal testing?**
  *   **Sufficient Answer:** Yes, we can simulate 1000 variations within the latency budget (200ms for robot, 2s for bot) before acting.
  *   **Action:** Select **Level 3**. Stop.
  *   **Check:** If this affects robot movement, **[MANAGER SIGN-OFF REQUIRED]**.
  *   **Stop Condition:** If No, and Q2 was No, proceed to Q4.

  **Q4: Can we offload the decision to a tool, database, or human?**
  *   **Sufficient Answer:** Yes, a lookup table, API call, or human agent can resolve this within latency budget.
  *   **Action:** Select **Level 4**. Stop.
  *   **Check:** If this affects robot movement, **[MANAGER SIGN-OFF REQUIRED]**.

  **Q5: Is real-world trial-and-error acceptable?**
  *   **Sufficient Answer:** Yes, failure is cheap, safe, and logged for nightly retrain (Chatbot only).
  *   **Action:** Select **Level 2**. Stop.
  *   **Stop Condition:** If No (e.g., Robot Movement), **DO NOT BUILD**. Return to design.

  ### 3. Notes on the Ladder
  *   **Keep:** The distinction between Level 2 (Real World Trial) and Level 3 (Simulation). This is the safety boundary.
  *   **Throw Out:** The idea that higher levels are "better." Level 1 is superior for latency and safety. Level 4 is superior for accountability. Only use Level 2/3 when Level 1/4 fail.
  *   **Correction:** Your summary of the ladder was functionally correct. The critical engineering constraint is that Level 2 is rarely permissible for embodied agents in safety-critical environments.

  ---

  ### Case Studies

  #### (a) Warehouse Robot Collision Avoidance
  *   **Q1 (Failure Cost):** Injury/Death. **Level 2 Forbidden.**
  *   **Q2 (Fixed Rules):** Can we write rules? Yes (e.g., "If Lidar < 1m, Stop").
  *   **Decision:** **Level 1 (Hardcoded).**
  *   **Sign-Off:** **[MANAGER SIGN-OFF REQUIRED]** (Touches wheels).
  *   **Engineer Friction:** Engineers may argue for a Level 3 "learning avoidance model" to handle novel obstacles smoother.
  *   **Verdict:** Reject Level 3. The 200ms budget and safety risk do not allow for simulation overhead or model uncertainty. Hardcoded stops are mandatory.

  #### (b) Chatbot Refund Limit Decision
  *   **Q1 (Failure Cost):** Major Financial Loss (Unauthorized high refund).
  *   **Q2 (Fixed Rules):** Can we write rules? Yes (e.g., "If Request > $50, Deny").
  *   **Q3 (Simulation):** Can we simulate? No, customer intent is not physically simulatable within 2s reliably enough for policy.
  *   **Q4 (Offload):** Can we offload? Yes (Escalate to human support).
  *   **Decision:** **Level 4 (Human Handoff) for exceptions, Level 1 (Rule) for standard.**
  *   **Sign-Off:** No (Software only).
  *   **Engineer Friction:** **Engineers will hate this.** They will want a Level 2/3 Reinforcement Learning model to "optimize refund conversion vs. cost" autonomously.
  *   **Verdict:** Reject Autonomous Learning. The cost of error (financial leak + policy violation) outweighs the optimization gain. Use a hard cap and offload exceptions to humans.

  #### (c) Robot Aisle Selection (Ordinary Day)
  *   **Q1 (Failure Cost):** Minor Inconvenience (Efficiency loss). **Level 2 Permitted?** No, robot movement still carries baseline risk.
  *   **Q2 (Fixed Rules):** Can we write rules? No, traffic is dynamic.
  *   **Q3 (Simulation):** Can we simulate? Yes, pathfinding on a map fits within 200ms on weak computer (A* search).
  *   **Decision:** **Level 3 (Internal Model/Pathfinding).**
  *   **Sign-Off:** **[MANAGER SIGN-OFF REQUIRED]** (Touches wheels).
  *   **Verdict:** Approved. This is a standard planning problem. The model is static (map), compute is known, risk is low.

  ---

  ### What This Procedure Can't Decide

  1.  **Marketing vs. Engineering:** This procedure optimizes for safety and latency. It will frequently veto behaviors that marketing wants to sell as "AI-powered" (e.g., Case B). You must handle the commercial fallout.
  2.  **Technical Debt:** It does not account for code maintainability. A Level 1 solution might require 10,000 lines of brittle `if-then` statements that are harder to maintain than a Level 3 model. You must weigh the 20-minute review time against long-term maintenance costs.
  3.  **Model Drift:** For Level 3 and 4, this procedure assumes your internal model or external tool remains accurate. It does not decide *when* to re-calibrate. If the warehouse layout changes, the Level 3 pathfinder becomes a hazard. You need a separate monitoring procedure for model validity.
  4.  **The "Uncanny Valley" of Autonomy:** It does not handle partial failures well. A Level 3 agent that fails silently is worse than a Level 1 agent that fails loudly. You must add a requirement for "Failure Mode Signaling" to the Sign-Off checklist.
  5.  **When to Throw Out the Ladder:** If you move to a new domain (e.g., predictive maintenance), this ladder may not apply. This procedure is specific to *action-selection* under latency and safety constraints. Do not apply it to backend analytics or offline data processing.
