answer: |-
  The silverware chimed against the china, a delicate rhythm that underscored the silence growing at the table. It was a dinner party, ostensibly to celebrate Mark and Lisa's tenth anniversary. Elias sat at the head, carving the roast with the precision of a surgeon. Sarah sat to his right, her napkin heavy in her lap.

  Lisa was smiling, though it didn't reach her eyes. She had been drinking wine a little too quickly since the main course arrived. Mark looked confused, his fork hovering halfway to his mouth.

  "It's just so good to have you both back from the retreat," Lisa said, her voice tight. "Mark was so vague about it on the phone."

  Elias sliced a piece of meat, the knife scraping the plate. "The cabin was isolated. Good for reflection. Though perhaps too isolated for some."

  Mark frowned. "Elias, we talked about this. It was a leadership workshop."

  "Was it?" Elias looked up, his eyes mild, framed by the spectacles he never took off. "I do not recall seeing an agenda. I only know that Mark was absent from his duties, and from his home, for three nights."

  "I told you, the phones were down," Mark said.

  Elias nodded slowly. "That is true. The phones were down. Which is why I was surprised to see the data usage on the shared account spike during that time. I happened to glance at the bill when I helped you with your taxes last month, Mark."

  Sarah felt her stomach turn. She knew the truth. Mark had been using a satellite uplink to download emergency sermons because the venue's Wi-Fi had failed. She had been there; she had helped him troubleshoot. But Elias had not mentioned the sermons. He had not mentioned the Wi-Fi. He had mentioned the bill, and the spike, and the absence.

  Lisa put her fork down. The metal clicked loudly. "Data usage?"

  "Significant," Elias said. He took a sip of water. "I am not accusing. I simply note that the numbers do not match the story of a digital detox. I would hate for you to be misled, Lisa. You know I cannot tell a lie."

  He said it with such gentle piety that it landed like a blessing. *I cannot tell a lie.* It was his brand, his shield. In their church circle, Elias's word was gospel. If Elias said the sky was green, people would squint until they saw moss.

  Mark's face went pale. "You're twisting this."

  "I am stating facts," Elias corrected softly. "The bill exists. The usage occurred. You were away. I am merely connecting what is visible."

  "You're connecting nothing!" Mark stood up, his chair scraping harshly against the floor. "You know exactly what I was doing."

  "Do I?" Elias looked at Sarah. "Sarah was there. Sarah, did Mark engage in any activities that could be construed as... unprofessional?"

  Sarah froze. The Augustinian definition ran through her mind like a reflex. *A lie is a false statement made with the intention to deceive.* Elias had made no false statement. The bill *had* spiked. Mark *had* been away. The phones *had* been down.

  But the intent sat heavy in the room, suffocating.

  "Sarah?" Lisa pressed, her voice trembling.

  Sarah looked at Elias. He wasn't smirking. He looked serene, like a monk in prayer. He believed he was clean. He had scrubbed his hands of the falsehood, but he was holding the knife.

  "Mark was working," Sarah said quietly.

  "Working," Elias repeated. "On sermons. Or perhaps on correspondence. I did not look at the screen. I only saw the time spent. And I saw that he asked for the cabin key to be left at the front desk, rather than returned to the office. So no one would know he was there."

  Lisa's breath hitched. That part was true. Mark had left the key to avoid an early checkout fee, but he had told the office manager. Elias had simply omitted the manager's name.

  "I think," Mark said, his voice shaking with rage, "that we should go."

  "Of course," Elias said, standing smoothly. "I would not want to detain you. Not when there are... questions."

  They left without dessert. The door closed, and the silence rushed back in, louder than before.

  Elias began to clear the plates. He stacked them with care, aligning the edges. Sarah remained seated, her hands gripping the table.

  "You destroyed them," she said.

  Elias paused, a plate in each hand. "I spoke the truth, Sarah. Every sentence. I checked each one in my mind before I let it pass my lips. 'The phones were down.' True. 'The bill spiked.' True. 'He left the key.' True."

  "You wanted her to think he was cheating."

  "I wanted her to know the risks," Elias said, turning to face her. The kitchen light caught the lenses of his glasses, hiding his eyes for a moment. "Augustine teaches that the sin of lying lies in the intent to deceive *through falsehood*. If the words are true, the soul remains clean. I have kept my vow."

  Sarah stood up. She walked to the sink and began to rinse the plates he handed her. The water was hot, stinging her fingers. "He says silence is not a lie."

  "Correct."

  "And he says a lie must be false."

  "Correct."

  Elias placed a fork into the soapy water. "Then where is the sin?"

  Sarah watched the bubbles swirl around the silver. She thought of Lisa's face. The specific, crushing weight of a truth that had been hollowed out and filled with poison. It wasn't a lie. A lie could be corrected with a fact. *I didn't steal the money.* *Here is the receipt.*

  But this? How did Mark correct *I saw the bill spike*? He couldn't explain the sermons without looking defensive. He couldn't explain the key without sounding secretive. Elias had built a cage out of facts and locked them inside.

  "It's not a lie," Sarah said, her voice low.

  "No."

  "And it's not silence."

  "No."

  Elias dried his hands on a towel. "Then it is simply truth. Hard truth. The world breaks under hard truth, Sarah. That is not my fault."

  He walked out of the kitchen, leaving her with the dishes.

  Sarah turned off the tap. The silence of the house settled around her. She looked at the clean plates, gleaming under the light. They were spotless. Technically perfect.

  She realized then that there was a third category. A space Augustine hadn't mapped, or perhaps had prayed no one would find. It wasn't the *Mendacium*, the lie. It wasn't the *Veritas*, the truth.

  It was a weapon that looked like a scripture.

  She picked up a wine glass Mark had left behind. It had a lipstick stain on the rim, faint and pink. She could wash it off. She could make it look new. But the glass would remember the pressure of the lips.

  Sarah set the glass back down in the rack, unwashed. She left the stain there, a small, red truth in the gleaming row of clean white. She turned off the kitchen light, but she didn't move to follow Elias. She just stood in the dark, wondering if God counted the shadows between the words.
