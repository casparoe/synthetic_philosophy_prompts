      *   *Developing Sarah's Arc:* She starts by defending Elias. "He's the most honest man I know." Then she hears the statement. She checks the facts. She realizes the intent.
      *   The Climax: A private conversation between Sarah and Elias.
      *   The Ending: Sarah realizes the category error. It's not a lie, but it's not truth-telling in the spirit. It's a weapon.

  5.  **Writing - Focusing on Tone:**
      *   Keep it quiet. Tense.
      *   Use silence as a weapon.
      *   Elias should sound pious. "I cannot tell a lie, Sarah."
      *   Sarah's internal monologue should track the Augustinian definition. *Mendacium* (Lie) vs. *Reticentia* (Silence/Withholding). Where does this fit?

  6.  **Refining the "Truth":**
      *   The specific lie needs to be airtight technically but rotten morally.
      *   Situation: A young man, Peter, is being considered for a scholarship.
      *   Elias is on the board.
      *   Elias says: "Peter's father was in prison." (True. Peter's *step*father? Or his father was in prison *before* Peter was born? Or for a traffic violation?)
      *   Let's go with: "I believe Peter's application lacks certain... disclosures." (True. He didn't disclose his favorite color. Implication: Criminal history).
      *   Actually, the "dinner with Jennifer" idea is stronger for personal ruin.
