          *   Elias says to David's fiancée (or the committee regarding his stability): "I saw him having dinner with Jennifer last Tuesday." (Truth: It was a group dinner. Implication: Cheating).

      *   *Refining the Philosophical Conflict:* Sarah needs to catch the nuance.
      *   Let's create a specific incident. A missing donation box.
      *   No, let's stick to the hiring committee. It's more formal.
      *   Candidate: Thomas.
