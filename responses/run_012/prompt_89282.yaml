          *   No bibliography.

  2.  **Deconstruct the Core Idea & Refine the Question:**
      *   *Current State:* Dirty Hands (DH) focuses on the tragic choice of the leader (Machiavelli, Weber, Walzer). Is it okay to do evil for good?
      *   *Proposed Shift:* Bureaucratic/Structural complicity. Everyone does a little bit of "okay" stuff, resulting in a "bad" outcome. No one has dirty hands; everyone has clean hands, but the system is dirty.
      *   *The Question:* Needs to be specific. Not just "Is this bad?" but "How do we assign responsibility?" or "What is the normative status of the equilibrium?"
      *   *Draft Question:* "How can political philosophy account for moral wrongdoing that emerges from the aggregation of individually permissible actions within a state apparatus?"
      *   *Refinement for Determinacy:* The prompt asks for a *determinate answer*. This is tricky in philosophy. It means the project shouldn't just be "exploring" but aiming for a specific thesis.
      *   *Thesis/Answer:* The "Clean-Hands Equilibrium" creates a *responsibility gap* that cannot be closed by individualist accounts of agency. Therefore, we must attribute moral remainders to the collective entity itself, not just the constituents.
      *   *Final Question:* "Does the 'clean-hands equilibrium' of distributed state wrongdoing necessitate a model of collective moral agency to account for the resulting moral remainder?"

  3.  **Critique of Existing Literature:**
      *   *Individualist DH:* Walzer, etc. Focus on the leader. Misses the bureaucracy.
      *   *Complicity Literature:* Focuses on causal contribution. Often fails when individual contribution is negligible (the "inefficacy" problem).
      *   *Structural Injustice:* Young, etc. Good on structure, but often rejects "responsibility" in favor of "political responsibility," which might be too weak for *wrongdoing*.
      *   *Gap:* We need a way to say the *act* was wrong and someone/something is *blameworthy*, even if no individual is blameworthy.

  4.  **Methodology Justification:**
      *   *Why Conceptual?* Case studies get bogged down in empirical details (who did what?). Formal models (game theory) abstract away the normative texture (what does it *mean* to be responsible?). We need to clarify concepts: agency, composition, moral remainder.
      *   *Timeline:* 6 Months.
          *   Month 1: Lit review & framing.
          *   Month 2: Defining the Equilibrium.
          *   Month 3: The Aggregation Problem.
          *   Month 4: Collective Agency & Remainders.
          *   Month 5: Objections & Refinements.
          *   Month 6: Drafting & Polishing.

  5.  **Addressing Collectives & Moral Remainders:**
      *   This is the metaphysical/ontological hook. If no individual is responsible, but a wrong occurred, the *collective* must bear the remainder.
      *   *Commitment:* Non-reductive collective agency. The state isn't just a sum of parts.

  6.  **Success/Failure Conditions:**
      *   *Success:* A coherent account of how clean inputs make dirty outputs and who holds the blame. A published paper or solid chapter.
      *   *Failure:* Proving that individualism *can* handle it (unlikely given the premise, but possible), or getting stuck in metaphysical weeds about collective personhood without normative payoff.

  7.  **Drafting - Section by Section (incorporating tone and constraints):**
