answer: |-
  **Project Title:** The Clean-Hands Equilibrium: Distributed Wrongdoing and the Limits of Individualist Agency

  **Project Summary**
  The canonical "dirty hands" literature in political philosophy assumes a unitary agent: the leader who must commit a moral violation to secure a political good. This project argues that this focus obscures the predominant mode of state wrongdoing today. Modern state harm is rarely the product of a single tragic choice, but rather the aggregation of individually permissible actions by advisers, implementers, legislators, and citizens. I term this the **clean-hands equilibrium**: a situation where every participant acts within moral bounds, yet the collective output is morally wrongful. This six-month project will demonstrate that individualist accounts of responsibility cannot resolve the normative status of this equilibrium. It argues that the "moral remainder" of such wrongdoing must be borne by the collective entity itself, necessitating a non-reductive model of collective moral agency.

  **The Research Question**
  Existing literature leaves a specific normative gap open. Individualist accounts (from Walzer to contemporary complicity theories) ask: *Which agent violated a duty?* Structural accounts (e.g., Iris Young) ask: *How do we forward-lookingly repair the structure?* Neither asks: *When a wrong is committed by a system of clean hands, where does the backward-looking blame reside?*

  This project poses a determinate question: **Does the clean-hands equilibrium necessitate attributing moral remainders to the collective entity rather than its constituents?**
  The project argues for a specific thesis: **Yes.** Individualist distribution of blame fails because it requires a threshold of causal contribution or intentional wrongdoing that no single participant meets. Therefore, if the outcome is to be categorised as a *wrong* (rather than a mere tragedy), the collective must be capable of bearing a moral remainder that does not devolve to the members.

  **Critique of Existing Positions**
  The project identifies two failure modes in current theory. First, the **Dirty Hands tradition** fetishises the exception. By focusing on the leader who *knowingly* does evil, it renders invisible the bureaucracy that normalises evil through routine. Second, **Complicity and Contribution accounts** fail at the margins. If an adviser frames an option, a lawyer approves it, and a clerk signs it, each contribution may be too negligible to constitute a moral violation in isolation (the problem of overdetermination or imperceptible difference). If we cannot locate the wrong in the parts, individualist accounts are forced to conclude either that no wrong occurred (counter-intuitive) or that the wrong is "free-floating" (metaphysically suspicious). This project fills that gap by treating the collective as the primary locus of agency in these specific equilibrium cases.

  **Methodology: Conceptual Analysis**
  This project employs conceptual analysis rather than case studies or formal modelling.
  *   **Why not Case Studies?** Empirical detailing of specific scandals (e.g., drone warfare, financial regulation) risks getting bogged down in causal chains. The problem here is not *what* happened, but *how we describe* the agency of what happened. We need to clarify the concepts of "equilibrium," "composition," and "remainder" before applying them.
  *   **Why not Formal Models?** Game-theoretic models can show how rational individual choices lead to suboptimal outcomes, but they cannot capture the *normative* texture of moral remainders. A model can show inefficiency; it cannot explain guilt, blame, or the specific phenomenology of "clean" participation in "dirty" outcomes.
  *   **The Conceptual Approach:** The work will involve reconstructing the logic of moral composition. It will test whether standard principles of moral aggregation (e.g., "if no part is blameworthy, the whole is not") hold in political contexts. This requires rigorous argumentation regarding the metaphysics of groups, which is best served by philosophical exegesis and counter-example testing.

  **Work Plan (Six Months)**
  *   **Month 1: Mapping the Equilibrium.** Literature review of dirty hands, complicity, and collective agency. Drafting the precise definition of the "clean-hands equilibrium" and distinguishing it from "tragedy" and "structural injustice."
  *   **Month 2: The Aggregation Problem.** Analysing why individualist distribution of responsibility fails in these cases. Developing the argument regarding threshold problems and causal inefficacy.
  *   **Month 3: Collective Agency.** Examining models of non-reductive collective agency. Determining the minimum conditions required for a state apparatus to bear a moral remainder distinct from its members.
  *   **Month 4: The Moral Remainder.** Defining what it means for a collective to "owe" a remainder (apology, restitution, punishment) when members are exempt. Addressing the "passing the buck" objection.
  *   **Month 5: Objections and Refinements.** Stress-testing the thesis against counter-arguments (e.g., that this lets individuals off the hook too easily). Refining the scope to ensure it doesn't over-collectivise blame.
  *   **Month 6: Synthesis and Drafting.** Compiling the analysis into a single coherent journal article (approx. 8,000 words). Submission to a target journal and preparation of a conference abstract.

  **Ontological Commitments**
  This account commits me to a form of **non-reductive collective realism**. I must argue that the state (or relevant sub-unit) can be a moral agent in a sense that is not merely metaphorical. If the collective bears the remainder, it must be the kind of entity that *can* bear blame. This does not require mysticism; it requires accepting that organisational structure can generate intentionality and capacity that exceeds the sum of individual members. I will argue that this commitment is less costly than the alternative: accepting that massive state wrongs can occur with no responsible agent at all.

  **Success and Failure Conditions**
  *   **Success:** The project produces a defensible argument that locates the moral remainder in the collective without absolving individuals of all political responsibility. The deliverable is a submit-ready manuscript that shifts the terminology of the debate from "dirty hands" to "clean equilibria."
  *   **Failure:** The project fails if it demonstrates that individualist accounts *can* be stretched to cover these cases without distortion (undermining the need for the new concept), or if the commitment to collective agency proves so metaphysically burdensome that it renders the normative conclusion useless. A second failure mode is scope creep: attempting to solve global structural injustice rather than focusing strictly on the *attribution of wrongdoing* in state apparatuses.

  **Scope and Feasibility**
  Six months is sufficient for a conceptual paper of this nature, provided I resist the urge to build a full theory of collective punishment. The goal is not to solve how we punish states, but to establish *that* they can be the locus of blame in clean-hands equilibria. This limited scope ensures the project remains manageable while offering a high-impact intervention in the existing dirty hands debate.
