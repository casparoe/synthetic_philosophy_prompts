      *   *Check:* Is the scope honest for 6 months? *Adjustment:* Don't promise a book. Promise one strong journal article or a chapter. Acknowledge that this is a *foundational* conceptual map, not a full theory of global justice.
      *   *Check:* No bibliography. *Adjustment:* Ensure I mention key concepts without needing citations (e.g., "Walzerian," "Young's social connection").
      *   *Tone:* Professional, persuasive, precise.

  9.  **Final Polish:** Check word count (roughly 2 pages standard formatting). Ensure the flow is logical. (The resulting output looks good. It hits all the prompt's specific constraints.)

