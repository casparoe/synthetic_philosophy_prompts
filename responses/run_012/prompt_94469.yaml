prompt: |-
  I teach an upper-level undergraduate seminar on philosophy of mind and religion, and I want one 90-minute session that makes about 18 students feel the force of Ayer's position on life after death — specifically the claim that the belief in survival after the death of the body, in the form it is usually held, is not a genuine hypothesis, because we lack a criterion of personal identity that could be applied across the gap. I want them to run into the problem themselves: that the difficulty is not a shortage of evidence but the absence of any specification of what would count as evidence either way. Ayer had a near-death experience late in life, after which he reported a red light and a presence he took to be responsible for the universe, and he still refused to treat the episode as establishing survival; I want that refusal to feel like the honest response rather than a stubborn one.

  Design a runnable activity for the session. The rules, roles, or incentives should arrange things so that the students construct criteria of personal identity, apply them to cases of apparent survival, and then discover for themselves that their criteria either collapse into bodily continuity, or become so permissive that they cannot distinguish survival from ordinary psychological change, or have no independent test. They should reach the impasse before anyone names Ayer or his position.

  Please include:

  - The setting and a timed sequence for the session.
  - The rules, roles, and materials, including any case cards, handouts, or scoring sheets written out so I can use them directly.
  - At least four cases: one near-death experience of the kind Ayer had; one claim of reincarnation or mediumship; one case of gradual or partial continuity (such as brain replacement, fission, or a slow change of character and memory); and one case in which the only evidence is testimony from a single person.
  - A debrief that maps particular moments in the activity onto the structure of Ayer's argument, including the distinction between saying that survival is false and saying that it is not a genuine hypothesis.
  - An honest account of what will predictably go wrong the first time I run it, and how to handle it.
  - A frank note on which feature of Ayer's view the activity cannot reproduce and that I will have to supply myself.

  The students should not read anything in advance, and the answer should not include quotations from Ayer or from secondary literature. Please write your answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Upper-level undergraduate seminar (Philosophy of Mind & Religion).
      *   **Class Size:** ~18 students.
      *   **Duration:** 90 minutes.
      *   **Goal:** Make students feel the force of A.J. Ayer's position on life after death (specifically *The Concept of a Person* era, though not named initially). The core idea: belief in survival isn't false, but *meaningless* (not a genuine hypothesis) due to the lack of a criterion of personal identity across the "gap" of death.
      *   **Key Constraint:** Students must construct criteria, apply them, and hit the impasse *before* Ayer is named. Ayer's own NDE refusal should feel like the honest conclusion, not dogmatism.
      *   **Required Elements:**
          *   Setting & Timed Sequence.
          *   Rules, Roles, Materials (Case Cards, Handouts, Scoring).
          *   Four Specific Cases (NDE, Reincarnation/Mediumship, Gradual/Partial Continuity, Single Testimony).
          *   Debrief mapping activity to Ayer's argument (False vs. Not a Genuine Hypothesis).
          *   "What will go wrong" section (predictable pitfalls).
          *   "What the activity cannot reproduce" section (limitations).
      *   **Language:** British English.
      *   **No Pre-reading:** Students walk in cold.
      *   **No Direct Quotations:** Do not quote Ayer or secondary lit in the materials.

  2.  **Deconstruct Ayer's Argument (for the Designer's clarity):**
      *   Ayer argues that for a statement to be a genuine hypothesis, it must be verifiable (or at least falsifiable) in principle.
      *   For "I survive death" to be meaningful, we need a criterion to identify *me* on the other side.
      *   Bodily continuity fails (the body is dead/decayed).
      *   Psychological continuity (memory/character) is insufficient because memories can be copied, implanted, or coincidentally similar without implying *identity*.
      *   Therefore, there is no way to specify what would count as evidence *for* or *against* survival. It's not that the evidence is lacking; it's that the concept of evidence is undefined.
      *   *Crucial Nuance:* Ayer later had an NDE. He didn't say "I was wrong." He said the experience was real but didn't entail the *proposition* of survival because the identity criteria still weren't met.

  3.  **Designing the Activity: "The Continuity Tribunal"**
      *   *Concept:* A mock review board or investigative committee.
      *   *Task:* Students must decide if "Person A" is identical to "Person B" (where B is post-death/post-event).
      *   *Mechanism:* They need to draft a "Verification Protocol" (criteria for identity) before seeing the cases, then apply it.
      *   *The Trap:* As they apply it, the protocol will either be too strict (rules out survival) or too loose (includes non-survival cases), or circular (relies on the very thing being tested).

  4.  **Drafting the Session Plan:**
      *   *Intro (10 mins):* Set the scene. No philosophy jargon yet. Just "Investigation."
      *   *Phase 1: Drafting the Protocol (20 mins):* Groups define what counts as "the same person."
      *   *Phase 2: Case Adjudication (35 mins):* Groups apply rules to the 4 cases.
      *   *Phase 3: The Crisis (15 mins):* Groups compare results. Disagreements arise. Rules break.
      *   *Phase 4: Debrief (10 mins):* Connect to Ayer (finally).

  5.  **Developing the Materials:**
      *   *Handout 1: The Protocol Sheet.* Needs to force them to choose between Body, Memory, Character, or Soul (though "Soul" is hard to verify).
      *   *Case Cards:* Need to be written neutrally but contain the specific philosophical traps.
          *   Case 1 (NDE): Ayer's red light. Subjective, private, no external verification of identity.
          *   Case 2 (Reincarnation): Child with memories of dead person. Problem: Cryptomnesia, cold reading, or is it just psychological similarity?
          *   Case 3 (Fission/Gradual): Teletransportation or slow brain replacement. Problem: If two people have the memories, who is the original?
          *   Case 4 (Testimony): A medium says "I am your grandfather." Problem: Circular verification.

  6.  **Refining the "Trap":**
      *   If they choose *Bodily Continuity*: Survival is impossible by definition (Case 1, 2, 4 fail).
      *   If they choose *Psychological Continuity*: Case 3 (Fission) breaks it (which one is the survivor?). Case 2 (Reincarnation) becomes indistinguishable from a very convincing actor or delusion.
      *   If they choose *Direct Awareness (Soul)*: How do we test this? It becomes unfalsifiable.
      *   *Goal:* They must realise that without a public criterion, "survival" is just a label they can stick on anything or nothing.

  7.  **Addressing the "What Will Go Wrong" Section:**
      *   Students might cling to dualism ("The soul just *is*").
      *   Students might treat it as an empirical evidence question ("We just need more data") rather than a conceptual one.
      *   Time management is always tight.
      *   *Mitigation:* The facilitator needs to play the "Sceptical Registrar" who demands operational definitions.

  8.  **Addressing the "What Cannot Be Reproduced" Section:**
      *   The activity shows the *logical* difficulty. It cannot reproduce the *existential* weight or the specific Logical Positivist verification principle context without lecture.
      *   Ayer's specific nuance about the NDE (that the experience was meaningful but the *proposition* of survival wasn't verified) needs careful explanation in the debrief.

  9.  **Writing in British English:**
      *   Check spelling (programme, analyse, centre, colour).
      *   Check idioms (marking, seminar, tutor).

  10. **Review against Constraints:**
      *   90 mins? Yes.
      *   18 students? Yes (6 groups of 3 works well).
      *   No pre-reading? Yes.
      *   No quotes? Yes.
      *   Ayer named only at end? Yes.

  11. **Final Polish:**
      *   Ensure the Case Cards are distinct enough to trigger different failures of the criteria.
      *   Make sure the Debrief explicitly distinguishes "False" vs "Not a Genuine Hypothesis."
      *   Ensure the tone is academic but practical.

  *(Self-Correction during drafting)*: Initially, I thought about having them debate. But debate allows rhetoric to hide the logical gap. A "Verification Protocol" exercise forces them to write down rules, which makes the contradictions visible on paper. I will structure it as an "Audit."

  *(Refining the NDE Case)*: Make sure it mirrors Ayer's without naming him. Red light, divine presence, but no interaction that verifies *who* the observer is.

  *(Refining the Debrief)*: I need to make sure I explain that Ayer didn't say "It's false." He said "It makes no sense to assert it." This is the hardest concept for undergrads. The activity needs to lead to "We can't say yes or no," not "We say no."

