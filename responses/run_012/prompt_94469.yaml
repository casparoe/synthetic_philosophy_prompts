answer: |-
  # Session Plan: The Verification Audit

  **Module:** Philosophy of Mind and Religion (Upper-Level Undergraduate)
  **Session Duration:** 90 Minutes
  **Class Size:** 18 Students (6 groups of 3)
  **Topic:** Personal Identity and the Intelligibility of Survival

  ## 1. Session Overview and Timed Sequence

  **Learning Objective:** By the end of the session, students will recognise that the primary obstacle to claiming life after death is not a lack of empirical evidence, but the lack of a coherent criterion for personal identity that survives bodily death. They will distinguish between a claim being *false* and a claim being *conceptually unintelligible*.

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Introduction** | Setting the scene: The "Continuity Audit". No mention of Ayer or religion yet. |
  | **10–30** | **Phase 1** | **Drafting the Protocol:** Groups define the necessary and sufficient conditions for "Person X at T1" being "Person Y at T2". |
  | **30–65** | **Phase 2** | **Case Adjudication:** Groups apply their Protocol to four specific Case Cards. They must vote 'Verified', 'Rejected', or 'Indeterminate'. |
  | **65–80** | **Phase 3** | **The Impasse:** Groups swap protocols and results. They attempt to find a consensus rule. Failure is engineered. |
  | **80–90** | **Debrief** | Tutor maps the activity to the philosophical argument (Ayer's position). |

  ---

  ## 2. Rules, Roles, and Materials

  ### The Setup
  Arrange the room into 6 clusters of 3 desks. Each cluster is a **Review Panel**.
  You (the Tutor) act as the **Chief Auditor**. You do not offer philosophical opinions during the activity; you only enforce procedural rules (e.g., "You must write down your criterion," "You cannot say 'it just feels right'").

  ### Materials Required
  1.  **Protocol Worksheet** (1 per group).
  2.  **Case Cards** (1 set of 4 per group).
  3.  **Adjudication Sheet** (1 per group).
  4.  Whiteboard/Projector for the Debrief.

  ### Handout 1: Protocol Worksheet
  *(Print on A4)*

  **CONTINUITY AUDIT: VERIFICATION PROTOCOL**

  **Task:** Your panel must establish the rules for verifying personal identity across a discontinuity. You are not deciding if survival *happens*; you are deciding how we would *know* if it happened.

  **Instruction:** Define the **Identity Criterion**. Complete the following sentence clearly enough that an outsider could apply it without asking you for clarification.

  *"Person B (at Time 2) is the same entity as Person A (at Time 1) if and only if..."*

  **Options to consider (you may combine or reject these):**
  *   [ ] Bodily continuity (same physical organism).
  *   [ ] Psychological continuity (same memories, character, intentions).
  *   [ ] Causal connection (B exists *because* A existed).
  *   [ ] Other (specify): _________________________________________________

  **Constraint:** Your criterion must allow for the possibility of being proven *wrong*. If there is no possible observation that would make you say "No, that is not Person A," your protocol is invalid.

  ---

  ### Handout 2: Case Cards
  *(Print on card stock, cut into 4 per set)*

  **CASE 1: The Subjective Vision**
  A subject (S) clinically dies for 4 minutes. Upon resuscitation, S reports leaving their body, seeing a red light, and encountering a presence they describe as "divine." S claims, "I survived."
  *Evidence:* S's testimony. Medical records confirm cardiac arrest. No external observer saw S leave the body. S's personality and memories remain unchanged from before the arrest.
  *Challenge:* Does the experience prove S survived, or merely that S's brain produced a vivid hallucination during hypoxia?

  **CASE 2: The Claimed Return**
  A child (C) begins speaking at age 3, claiming to be a deceased person (D) from a different family. C knows specific details about D's life that were not public knowledge. C identifies D's relatives.
  *Evidence:* Testimony of C and D's family. Correlation of memories.
  *Challenge:* C has a different body, different DNA, and different fingerprints. Is C the same person as D, or a different person with access to D's information?

  **CASE 3: The Fission Problem**
  A technology scans Person A's brain and psychological state. It destroys A's brain but transmits the data to two recipients, B and C. Both B and C wake up with A's memories, character, and sense of identity. Both claim, "I am A."
  *Evidence:* Perfect psychological continuity in both recipients.
  *Challenge:* If identity is psychological, both are A. But B and C are two different people living different lives. Can one person be two people? If you say only one is A, what distinguishes them?

  **CASE 4: The Private Assurance**
  A medium tells a bereaved subject (S): "Your grandfather is here. He says he is at peace." The medium provides no verifiable information, only emotional comfort. S feels certain it is true.
  *Evidence:* S's internal feeling of certainty. The medium's testimony.
  *Challenge:* There is no public check. If S feels certain, is it true? If S feels uncertain later, does that make it false? Who can test this claim?

  ---

  ### Handout 3: Adjudication Sheet
  *(Print on A4)*

  **PANEL DECISION LOG**

  | Case | Verdict (Verified / Rejected / Indeterminate) | Reason based *strictly* on your Protocol |
  | :--- | :--- | :--- |
  | **Case 1** | | |
  | **Case 2** | | |
  | **Case 3** | | |
  | **Case 4** | | |

  **Final Protocol Check:**
  Did your Protocol allow you to make a clear decision in all 4 cases?
  [ ] Yes
  [ ] No

  If No, which case broke your rules? _______________________________________

  ---

  ## 3. Detailed Activity Flow

  ### Introduction (00–10 mins)
  Welcome the students. Tell them they are serving on a Review Panel for a fictional Institute of Continuity. Their job is not to debate theology, but to set the standards for evidence.
  *   **Script:** "We often hear claims that people survive death. Today, you are not asking if these claims are true. You are asking if they are *checkable*. If someone says 'I am still me after my body dies,' what would count as proof? And what would count as disproof? If you cannot specify what would count as disproof, you cannot claim proof."
  *   Distribute **Protocol Worksheet**. Give them 20 minutes to agree on a single criterion. Circulate and challenge vague terms (e.g., if they write 'soul', ask "How do we measure the soul?").

  ### Phase 1: Drafting the Protocol (10–30 mins)
  Students will likely gravitate towards Memory/Psychological continuity, as Bodily continuity makes survival impossible by definition.
  *   **Tutor Intervention:** If a group chooses Bodily Continuity, acknowledge it but note it renders the concept of 'survival' (in the religious sense) logically impossible. Ask them to consider if they want to allow *any* possibility of survival.
  *   **Tutor Intervention:** If a group chooses "Spiritual Essence," demand an operational test. "If two people claim the essence, how do you decide?"

  ### Phase 2: Case Adjudication (30–65 mins)
  Distribute the **Case Cards** and **Adjudication Sheet**.
  *   **Task:** Apply the Protocol to the 4 cases. They must record the verdict and the specific rule from their Protocol that led to it.
  *   **The Trap:**
      *   **Case 1 (NDE):** Psychological continuity exists, but it's compatible with brain dysfunction. If their rule is "same memories," this passes. But is it survival or just a dream?
      *   **Case 2 (Reincarnation):** Psychological continuity exists across different bodies. If their rule is "same memories," this passes. But this blurs the line between *identity* and *similarity*.
      *   **Case 3 (Fission):** This is the breaker. If identity is psychological, both B and C are A. But they can't both be *the* A (identity is one-to-one). Students must either accept 1=2 or admit psychological continuity isn't enough for *identity*.
      *   **Case 4 (Testimony):** No public test. If they accept this, their criterion is "feeling certain," which is unfalsifiable.

  ### Phase 3: The Impasse (65–80 mins)
  Ask groups to swap their **Adjudication Sheets** with a neighbouring group.
  *   **Task:** Look at the other group's Protocol. Try to find a case where their Protocol gives a result that seems absurd (e.g., "Your rules say the medium is definitely the grandfather," or "Your rules say the fission clones are the same person, which is impossible").
  *   **Class Discussion:** Ask each group to report one case where their Protocol failed to give a clear answer, or gave an answer they didn't like.
  *   **Key Question:** "Is the problem that we need *more evidence*, or that our definition of 'same person' doesn't work when the body is gone?"
  *   **Goal:** Elicit the realisation that without a body, 'identity' loses its grip. We can have *similarity*, but not *identity*.

  ### Debrief (80–90 mins)
  Now you introduce the philosophical context.

  1.  **Map the Activity:**
      *   "When you struggled with Case 3 (Fission), you encountered the problem of **transitivity**. If A=B and A=C, then B=C. But if B and C are different people, A cannot be identical to both."
      *   "When you struggled with Case 4 (Testimony), you encountered the problem of **verification**. If there is no test that could prove the claim false, does the claim mean anything?"

  2.  **Introduce Ayer's Position:**
      *   Explain that a mid-20th-century philosopher, A.J. Ayer, argued exactly this.
      *   **The Distinction:** Ayer did not argue that survival is *false*. He argued it is **not a genuine hypothesis**.
      *   **Explanation:** A hypothesis must specify conditions under which it is true and conditions under which it is false. If your Protocol could not specify what would count as evidence *against* survival (without relying on the body you just said doesn't matter), you have no hypothesis. You have a wish.
      *   **The NDE Connection:** Mention that Ayer later had a near-death experience (similar to Case 1). He saw a red light and a divine presence. Did he change his mind? No. He said the experience was real, but it did not verify the *proposition* of survival. Why? Because he still could not specify how *he* was identified as the survivor distinct from a hallucination.
      *   **Conclusion:** The honest response is not "I refuse to believe," but "I do not know what it would mean to assert this."

  ---

  ## 4. Predictable Pitfalls and Mitigation

  **1. The "Soul" Escape Route**
  *   **What will go wrong:** Students will insist that personal identity is grounded in an immaterial soul which is simple and indivisible. They will claim this solves the Fission problem (the soul goes to only one clone).
  *   **How to handle it:** As Chief Auditor, demand the verification condition. "If the soul is immaterial and unobservable, how does your Panel detect it? If you cannot detect it, how is your claim different from saying 'An invisible dragon did it'?" Push them to see that positing a soul explains nothing unless we can specify *how* we track the soul.

  **2. Confusing "Unlikely" with "Meaningless"**
  *   **What will go wrong:** Students will argue that survival is just highly improbable given current science, rather than conceptually problematic.
  *   **How to handle it:** Redirect them to the Protocol Worksheet. "Science deals with probabilities of events. We are dealing with definitions of terms. Even if God intervened, how would we know it was *you* and not a copy of you? If you can't answer that, probability is irrelevant."

  **3. Time Overrun in Phase 2**
  *   **What will go wrong:** Groups will get stuck debating the morality of Case 3 (Fission) rather than the logic of identity.
  *   **How to handle it:** Be strict with the timer. Announce: "You do not need to like the result. You only need to see if your Rule produces a result. If your Rule produces a contradiction, mark 'Indeterminate' and move on."

  **4. The "It's Just a Word Game" Objection**
  *   **What will go wrong:** Students may dismiss the activity as semantic quibbling, arguing that what matters is the *experience* of survival, not the logic.
  *   **How to handle it:** Acknowledge this in the debrief. "Ayer would agree the experience is real. But philosophy asks if we can make true *statements* about that experience. If I say 'I will survive', am I saying something true/false, or am I just expressing a hope? That distinction matters for religious belief."

  ---

  ## 5. Limitations of the Activity (Tutor's Note)

  **What this activity cannot reproduce:**
  This seminar exercise successfully demonstrates the *logical* incoherence of survival claims without bodily criteria. However, it cannot reproduce the **Logical Positivist verification principle** itself, which is the engine driving Ayer's argument. The students are operating on a pragmatic "need for evidence" basis, not a strict "meaning is use/verification" basis.

  **What you must supply:**
  In the debrief, you must explicitly articulate that for Ayer, this wasn't just about "difficulty in testing." It was about **meaning**. You need to explain that if a sentence cannot be verified even in principle, Ayer argues it is literally nonsense (cognitively meaningless), not just unproven. The activity shows the *practical* failure of criteria; you must supply the *semantic* conclusion.

  Additionally, the activity treats the NDE (Case 1) as a problem of identity. Ayer's later reflection was more nuanced: he granted the experience was veridical in some sense but maintained it didn't support the *doctrine* of survival. You will need to clarify that distinction: one can have a religious experience without the proposition "I survive death" being a coherent hypothesis. The activity makes them feel the confusion; you must provide the vocabulary to resolve it.
