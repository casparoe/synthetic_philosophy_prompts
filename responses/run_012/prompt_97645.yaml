  7.  **Drafting the Content (incorporating specific vocab):**

      *   *Consequentialists:* "Interpersonal comparability," "aggregation function," "egoistic hedonism."
      *   *Historians:* "Hermeneutic violence," "soteriological soteriology," "Abhidharmic causal series," "juridical metaphor."
      *   *Decision Theorist:* "Objective function," "proxy optimization," "Goodhart's Law," "reward hacking."

  8.  **Review against Constraints:**

