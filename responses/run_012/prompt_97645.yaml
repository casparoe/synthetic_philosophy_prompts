      *   *Objection 7 (General - Low Damage):* Nirvana. If the goal is cessation, is "consequence" the right word?
      *   *Objection 8 (Move 3 specific - Low Damage):* Merit transfer coherence.

      *Refining the Phrasing:* Need to make sure the Consequentialists sound like axiologists (commensurability, aggregation), Historians sound like philologists/contextualists (anachronism, soteriology), and the Decision Theorist sounds like a modeler (proxy, objective function).

