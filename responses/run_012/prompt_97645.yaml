answer: |-
  # Q&A Preparation Sheet: Self-Registering Consequentialism

  **Presenter Strategy Note:** Your core vulnerability is the *category* itself. The Historians want to burn the grid; the Consequentialists want to fill it with standard utility. Your survival depends on keeping "self-registering" distinct from "egoistic" and "automatic" distinct from "mechanistic." You are willing to sacrifice Move 3 (Merit Transfer) to save Move 1 (Automatic/Non-Deontic).

  ---

  ### 1. The Hermeneutic Violence Objection (Historians of Theravāda)
  **Likelihood:** Very High | **Damage:** Critical
  **Phrasing:** "You're committing a category mistake by imposing a modern Western normative grid onto a soteriological system. By naturalizing the 'juridical metaphor' of karma into a 'causal law' to fit your consequentialist model, aren't you erasing the distinctively religious texture of the texts? In the Abhidharma, *cetanā* isn't just intention; it's a mental factor embedded in a specific soteriological path, not a free-floating variable in an ethical calculus."

  **2-Minute Reply:** "I grant that 'consequentialism' is anachronistic if applied to the *soteriological goal* (Nirvana). But my claim is restricted to the *karmic ethics* governing saṃsāric action. The texts explicitly reject a divine legislator while maintaining normative force. That structural gap—normativity without a lawgiver—is exactly what my 'automatic' premise addresses. I am not claiming the Buddhists were Benthamites; I am claiming their causal model of intention performs the same structural work as consequentialism, regardless of their own meta-ethical vocabulary."
  **Weakness:** You are relying on a structural analogy that historians may reject as too thin. If *cetanā* is thicker than 'intention,' Move 1 wobbles.
  **Concession:** "I concede that this framework does not apply to the path of the Arhat, only to the ethics of the putujjana (ordinary person)."

  ### 2. The Interpersonal Comparability Objection (Analytic Consequentialists)
  **Likelihood:** High | **Damage:** High
  **Phrasing:** "If the normative weight rests on the agent's own subsequent mental states, this looks like ethical egoism, not consequentialism. Consequentialism requires an aggregation function across persons. If the karmic ledger is strictly individual and non-transferable (despite your Move 3), how do you establish interpersonal commensurability? You can't solve coordination problems or population axiology with a self-registering ledger."

  **2-Minute Reply:** "It is not egoism because the *content* of the good mental states is often other-regarding (mettā, karuṇā). The 'self-registering' element refers to the *locus of evaluation*, not the *object of concern*. Regarding comparability: Buddhist ethics is primarily first-personal practical advice, not a social welfare function. It offers a theory of right action for the agent, which is a valid subset of consequentialist theory, even if it lacks a global aggregation rule."
  **Weakness:** This admits your view cannot handle 'macro' ethical problems, limiting its philosophical utility.
  **Concession:** "I concede this is a first-personal consequentialism and does not offer a social welfare function."

  ### 3. The Proxy Optimization Objection (Decision Theorist)
  **Likelihood:** High | **Damage:** Medium-High
  **Phrasing:** "This looks like a classic reward-tampering problem. If merit is the proxy for the good, and ritual generates merit, agents will optimize for ritual performance rather than the underlying mental state (cetanā). This is Goodhart's Law in pre-modern dress. If your system allows merit transfer, it decouples the 'consequence' from the 'intention' entirely. How is this not a gamed objective function?"

  **2-Minute Reply:** "The tradition anticipates this: merit without *cetanā* is explicitly declared fruitless in the Suttas. The 'automatic' mechanism is sensitive to the quality of the intention, not just the external act. Ritual is only a proxy insofar as it cultivates the intention. If it becomes mere gaming, the karmic mechanism itself registers zero value. The system is robust against gaming because the 'sensor' is internal to the agent."
  **Weakness:** Textually, there *are* instances where ritual seems to work mechanically. You are idealizing the system.
  **Concession:** "I concede that popular practice often games the system, but I am reconstructing the normative theory, not the sociological reality."

  ### 4. The "No Legislator" Fallacy (Historians/Philosophers)
  **Likelihood:** Medium | **Damage:** Medium
  **Phrasing:** "You argue that no legislator rules out deontology. But deontology doesn't require a legislator; it requires binding reasons. Kant doesn't need God for the Categorical Imperative. Why can't karma be a deontic constraint that operates causally? You haven't ruled out deontology, only divine command theory."

  **2-Minute Reply:** "Because deontic constraints usually imply 'wrongdoing' independent of outcome. In Buddhism, an action is 'wrong' (akusala) precisely *because* it leads to suffering (for oneself and others). The 'binding' nature is derived from the predicted causal outcome, not the intrinsic nature of the act. If the consequence were different, the norm would flip. That makes it consequentialist."
  **Weakness:** Some Abhidharma classifications look intrinsically deontic (e.g., certain acts are always unwholesome).
  **Concession:** "I concede that some later scholastic classifications look deontic, but the early Sutta basis is outcome-sensitive."

  ### 5. The Egoism/Soteriology Tension (Consequentialists/Historians)
  **Likelihood:** Medium | **Damage:** Medium
  **Phrasing:** "If the consequence is 'my mental state,' isn't the motivation ultimately self-purification? If I help you to improve my karma, aren't I using you as a means? This violates the spirit of compassion."

  **2-Minute Reply:** "Not if the 'improved mental state' is the state of compassion itself. The consequence is not 'my pleasure,' it is 'my alignment with reality.' Helping you is constitutive of that alignment. The self-interest is structural, not necessarily motivational."
  **Weakness:** Hard to distinguish from enlightened self-interest verbally.
  **Concession:** None. This is your core distinction.

  ### 6. The Move 3 Coherence Objection (Historians)
  **Likelihood:** Medium | **Damage:** Low (Since you are willing to concede)
  **Phrasing:** "Merit transfer (pattidāna) is a later development and highly contested in Theravāda. Basing a core philosophical move on a doctrinally unstable mechanism seems risky. Doesn't this undermine the 'automatic' nature of the law?"

  **2-Minute Reply:** "I agree it is doctrinally complex. However, I use it only to show that the 'good' is not rigidly locked to the agent's physical body, allowing for a consequentialist flow of value. If the room prefers, I can treat Move 3 as illustrative rather than foundational."
  **Weakness:** It weakens your claim that this is a "genuine third position" if the mechanism is contested.
  **Concession:** **Explicitly concede this point.** "I am willing to treat Move 3 as secondary. The core argument rests on Moves 1 and 2."

  ### 7. The "Rule-Consequentialist" Collapse (Consequentialists)
  **Likelihood:** Low | **Damage:** Low
  **Phrasing:** "Why isn't this just Rule-Consequentialism? The 'automatic law' functions as the rule. You follow the precepts because they generally produce good mental states."

  **2-Minute Reply:** "Because the 'rule' isn't the source of normativity. The causal link is. If a precept didn't produce the state, it would be discarded. In Rule-Consequentialism, the rule has intermediate authority. Here, the causation is immediate and act-specific via *cetanā*."
  **Weakness:** Functionally, they look very similar in practice.
  **Concession:** "It is a close cousin, but the metaphysics of causation differ."

  ### 8. The Virtue Ethics Hybrid Objection (General)
  **Likelihood:** Low | **Damage:** Low
  **Phrasing:** "If the good is the agent's mental state, isn't this just Virtue Ethics? You're describing the cultivation of character."

  **2-Minute Reply:** "Virtue Ethics focuses on the *being*. My claim focuses on the *doing* as determined by outcomes. The mental state is the *consequence* of the intention, not just a static trait. It's the feedback loop that makes it consequentialist."
  **Weakness:** The line between 'state as consequence' and 'state as character' is blurry.
  **Concession:** "It shares ground with Virtue Ethics, but the normative engine is causal, not teleological."

  ---

  ### Strategic Directives

  **1. Which objection to pre-empt in the talk?**
  **The Hermeneutic Violence Objection (Historians).**
  *Why:* If the Historians in the room decide you are imposing a Western grid, the Consequentialists won't bother engaging the technical arguments. You must frame the "Consequentialism" label as a *heuristic tool for structural comparison* rather than a claim about Buddhist self-understanding. State clearly in the introduction: "I am not claiming the Buddhists were consequentialists, but that their system functions logically as one."

  **2. Which of your three moves is most exposed?**
  **Move 3 (Merit Transfer).**
  *Why:* It is the easiest target for the Historians (textual instability) and the Consequentialists (is it really aggregation or just magic?).
  *Strategy:* **Concede this early.** Frame it as "evidence that the tradition allows value to be non-rigidly bound," not as the proof of consequentialism. If you have to drop it to save Moves 1 and 2, drop it.

  **3. Explicit Concession Statement (for the Q&A)**
  "I want to be clear at the outset: I am not arguing that Buddhist ethics *is* Utilitarianism, nor am I claiming the Merit Transfer doctrine (Move 3) is philosophically robust enough to carry the whole weight of the argument. My core claim rests on the automatic, non-deontic nature of karma (Move 1) and the reflexive locus of value (Move 2). If Move 3 fails, the thesis of 'Self-Registering Consequentialism' stands."

  **4. The One Question You Hope Nobody Asks**
  *"If the goal of Buddhism is the cessation of karma (Nirvana), doesn't that mean the ultimate ethical goal is to break the very consequentialist mechanism you are describing? Can a system be consequentialist if its telos is to stop producing consequences?"*

  *Why this is dangerous:* It strikes at the heart of the "Self-Registering" claim. If the end-game is to exit the system, then the system is merely provisional (upāya), not a genuine normative ethics. Answering this requires distinguishing between *saṃsāric ethics* (which your paper covers) and *soteriological transcendence* (which you must claim is outside the scope of "ethics" proper). If you fail to distinguish these, your "consequentialism" looks like a trap the Buddha intended to escape.
