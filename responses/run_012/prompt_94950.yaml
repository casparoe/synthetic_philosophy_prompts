prompt: |-
  I'm a second-year PhD student and I've got to hand in a two-page research proposal by Friday for this odd little internal thing my department runs — basically a seed grant for a summer, there's no real money in it but it goes in my file and my advisor sits on the committee, so I can't phone it in. I've been circling the moral-revolutions literature for weeks (slavery, dueling, footbinding, all of it) after a long argument with a friend in a bar, and I finally have a half-formed idea I'd like you to turn into the actual proposal. Here's what keeps nagging at me: every explanation on offer — the old economic-interest story about British abolition, where slavery stopped paying before it stopped being wrong; Appiah's line about honor doing the work that argument can't; and the softer "the arguments just took a while to land" story — is an explanation of a practice *ending*. And they all fit the completed cases about equally well, because once something is over, everything predicts it. So I want to move the object of study: instead of asking why practices end, ask why practices under the same pressure don't end, or end halfway and then creep back. That gives me real variation to work with — the death penalty, corporal punishment of kids, and especially the Thirteenth Amendment's punishment exception, which means the abolition of slavery shipped with a hole in it that nobody ever closed. So the empirical wedge is the stalls and the half-revolutions. The conceptual wedge is that I think "the practice ended" is really three different events that everybody keeps collapsing into one: (a) people stopped doing it; (b) it stopped being intelligible — nobody could any longer see what the point of it had been; and (c) it lost its scaffolding — the material and social machinery that made it meaningful simply dissolved (dueling needed a particular public sphere and reputation economy, and once print and libel law shifted, the practice had nowhere left to live). The interest story and the honor story are both stories about (a); they quietly presuppose (b) and never even look at (c).

  So what I want from you is the proposal itself: state the question precisely enough that it has a determinate answer, explain why the existing positions genuinely leave it open (not just under-argued), lay out what I'd actually do month by month over one summer — pick three or four stalled or partial cases, work out for each one which of a/b/c moved first and what the timing was, and see weather the stalled cases discriminate between the three explanations better than the completed ones ever could — and say why this beats the obvious alternative, which is just going back to British abolition and trying to settle the interest-vs-honor fight on the documents. I also want you to say what a good outcome would even look like here (my guess: not a grand theory of moral progress but a decision procedure that tells me, for a given practice, which of the three events did the real work), what would count as the project failing (if "stalled" turns out to be an unstable category, or if the same mechanism turns out to explain both the completions and the stalls, the whole variation strategy collapses and I should know that going in), and a scope that actually fits a summer and two pages. And put in a short section on the meta-question, because I half suspect it's the real payoff: is there a single fact of the matter about why dueling ended, or are the interest story and the honor story just answering different questions and both true? If it's the latter, that changes what "explaining a moral revolution" is even supposed to mean. American English, please, and don't bother with a bibliography or citations — I'll fill those in myself; just don't invent titles or dates and I'm happy.
