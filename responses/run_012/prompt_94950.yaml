answer: |-
  **Project Title:** Stalled Revolutions: A Comparative Anatomy of Incomplete Moral Change

  **Principal Investigator:** [Your Name]
  **Project Period:** Summer 2024 (June–August)

  **Research Question**
  Existing literature on moral revolutions focuses almost exclusively on completed cases—why slavery ended, why dueling vanished, why footbinding ceased. These explanations (economic interest, honor cultures, or the slow win of argument) fit completed cases equally well because once a practice is over, everything predicts it. This project shifts the object of study from *completion* to *variation*. The core question is: **Why do some moral practices under similar normative pressure end completely, while others stall, persist legally, or creep back?**

  By comparing completed revolutions against "stalled" ones, I aim to determine whether the mechanisms driving moral change are uniform or context-dependent. Specifically, I will test whether current explanations fail because they conflate three distinct events that constitute "ending": (a) behavioral cessation (people stop doing it); (b) loss of intelligibility (nobody sees the point anymore); and (c) scaffolding dissolution (the material and social machinery required for the practice disappears).

  **Problem Statement and Literature**
  The standard accounts of moral change are currently at an impasse. The economic-interest model (e.g., British abolition) argues practices end when they cease to pay. The honor-based model (e.g., Appiah on dueling) argues practices end when they cease to confer status. A third, softer view suggests moral arguments simply take time to land. The problem is that these theories are calibrated on successful cases. They explain why slavery *ended*, but they cannot explain why the Thirteenth Amendment's punishment exception persists, why corporal punishment of children remains legal in many U.S. states despite normative shifts, or why the death penalty survives in some jurisdictions but not others.

  These theories primarily address (a)—behavioral cessation. They quietly presuppose (b) and rarely examine (c). For example, dueling didn't just become expensive or dishonorable; it lost its scaffolding when print culture and libel law shifted, leaving the practice nowhere to live. By collapsing (a), (b), and (c) into a single event ("the revolution"), existing literature masks the mechanisms of failure. If a practice stops being intelligible (b) but the scaffolding remains (c), does it creep back? If the scaffolding dissolves (c) but intelligibility remains (b), does it go underground? Current theories cannot answer this because they lack the granularity to distinguish these components.

  **Methodology and Case Selection**
  This project is a comparative historical analysis of three "stalled" or partial cases, selected for their variation in outcome despite similar normative pressure. I will trace the timing of (a), (b), and (c) for each.

  1.  **The Thirteenth Amendment Punishment Exception:** Slavery was abolished, but the carve-out for criminal punishment remained. Here, behavioral cessation (a) was legally mandated but incomplete. Did intelligibility (b) shift regarding forced labor while the carceral scaffolding (c) expanded to accommodate it?
  2.  **Corporal Punishment of Children:** Normative pressure against hitting children has grown, yet the practice remains legal and common in many regions. This allows for a fine-grained look at whether the *intelligibility* of the practice has eroded even where the *behavior* persists.
  3.  **The Death Penalty:** Unlike slavery, this practice has not vanished nationally but has stalled in specific jurisdictions. This offers geographic variation to test whether economic or honor-based explanations hold when the national culture is held constant.

  **Summer Work Plan**
  *   **June:** **Framework and Case 1.** Finalize the operational definitions of intelligibility and scaffolding. Conduct archival and legal review of the Thirteenth Amendment's legislative history and subsequent carceral expansion. Map the timeline: did the scaffolding expand *before* or *after* the normative shift?
  *   **July:** **Cases 2 and 3.** Review sociological literature and legal statutes regarding corporal punishment and death penalty retention. Code for evidence of (a), (b), and (c). Specifically, look for moments where the practice was defended not on utility (interest) or status (honor), but on necessity due to existing scaffolding.
  *   **August:** **Synthesis and Writing.** Compare the timelines. Did the stalled cases fail because (c) outlasted (b)? Or because (a) was decoupled from (b)? Draft a 20-page working paper outlining a decision procedure for diagnosing moral change mechanisms.

  **Significance and Alternative Approaches**
  The obvious alternative is to return to the classic case of British abolition and attempt to settle the interest-vs.-honor debate on the documents. This is a dead end. The archives are exhausted, and both sides can marshal evidence because both mechanisms were likely present. This project beats that alternative by changing the evidentiary base. Stalled cases discriminate between explanations better than completed ones. If interest drives abolition, the punishment exception should have vanished when prison labor became unprofitable. If honor drives it, the death penalty should vanish where it confers no status. By looking where the revolution *didn't* finish, we can see which engine stalled.

  **Expected Outcomes and Failure Conditions**
  A successful outcome is not a grand theory of moral progress. Rather, it is a **decision procedure**: a diagnostic tool that tells us, for a given practice, which of the three events (a, b, or c) did the causal work. This clarifies what "explaining a moral revolution" means.

  **Failure Conditions:** I need to know going in if this strategy is viable. The project fails if:
  1.  **Category Instability:** "Stalled" turns out to be an unstable category (e.g., if every practice is actually ending, just slowly).
  2.  **Mechanism Uniformity:** If the same mechanism (e.g., scaffolding dissolution) explains both completions and stalls equally well, the variation strategy collapses, and the original theories stand vindicated.

  **Meta-Question: Explanatory Pluralism**
  Finally, this project addresses a meta-theoretical question: Is there a single fact of the matter about why a practice ends? It is possible that the interest story and the honor story are both true because they are answering different questions. Interest might explain (a) (behavior), while honor explains (b) (intelligibility). If the stalled cases show that (a) and (b) can come apart, it suggests that moral explanation is pluralistic. We may not be looking for the *one* cause of moral change, but rather a map of which causes operate on which layer of the practice. This shifts the goal of the literature from ranking theories to integrating them.

  **Feasibility**
  This project requires no fieldwork or travel. All materials (legal texts, secondary literature, historical records) are available digitally or through university libraries. The scope is limited to three specific practices over a defined period, ensuring completion within the summer window. The resulting paper will be suitable for a workshop or journal submission, adding a distinct theoretical contribution to my file.
