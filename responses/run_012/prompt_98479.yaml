answer: |-
  We, the undersigned, represent two distinct perspectives on distributive justice, specifically the prioritarian view and the telic egalitarian view, and we issue this statement to clarify the nature of our disagreement regarding the leveling-down objection. We begin by recording the claims both of us can sign without reservation. We agree that leveling down refers to a change in distribution where the better-off are made worse off to match the worse-off, without any improvement in the absolute condition of the worse-off. We agree that such a change is never better all-things-considered, since it involves a loss of well-being for some and a gain for none. We acknowledge that the prioritarian is motivated by the urgency of benefit, holding that a benefit matters more the lower the absolute level of the person who receives it, and therefore denies that there is anything good about an inequality's being removed as such. We acknowledge that the telic egalitarian is motivated by the value of fairness and relational standing, holding that equality is itself a value, so that a more equal distribution can be in one respect better even when it is better for no one. We concede that much of our past debate has turned on words rather than substance, specifically regarding whether the term better should be understood as better all-things-considered or better in one respect. We agree that the objection is actually targeting the claim that equality is intrinsically valuable, not instrumentally valuable, and that if the dispute were merely about instrumental benefits or social stability, we would likely agree on the verdict.

  Having cleared away these misunderstandings, we state the residual disagreement as precisely as we can, in wording that each side accepts as a fair rendering of its own position. The telic egalitarian holds that equality is a pro tanto value that stands independently of well-being, such that a move toward equality generates a moral reason even when no one gains in well-being, though this reason may be outweighed by the loss of well-being. The prioritarian holds that equality is never valuable in itself, such that a move toward equality generates no moral reason unless it involves a priority-weighted gain in well-being, and therefore leveling down is never better in any respect. We agree that this is the substantive core of our dispute: whether there exists a freestanding value of equality that can be realized without benefit, or whether all value is grounded in the weighted well-being of individuals.

  To move beyond this stalemate, we identify specific cruxes, which are sub-questions such that settling one would move at least one side, and for each crux we give a case or argument that both sides agree bears on it, with each side's prediction about how it comes out written down in advance. The first crux concerns whether the objection is a reductio that refutes telic egalitarianism or merely a cost that a pro tanto value can bear. We consider the case of a world with extreme inequality where leveling down would require immense suffering for the better-off to match the destitute, yielding no benefit to the destitute. The prioritarian predicts that any theory implying this is better in any respect is absurd and must be rejected entirely, while the telic egalitarian predicts that a mature theory of values should allow for trade-offs where a genuine value is outweighed without ceasing to be a value, much like justice might be outweighed by mercy without ceasing to be justice. The second crux concerns whether the priority view should be stated comparatively or non-comparatively, and whether the comparative statement leaves it exposed to the same objection it was meant to answer. We consider the formulation where benefits matter more if the recipient is worse off than others versus the formulation where benefits matter more if the recipient is at a lower absolute level. The prioritarian predicts that the non-comparative statement successfully avoids the leveling-down objection because it references only absolute levels, while the telic egalitarian predicts that the comparative statement is necessary to capture the urgency of need relative to others and that if the prioritarian adopts it, they become vulnerable to the same objection they level against egalitarianism. The third crux concerns whether the objection has any grip when the worse-off group is unaware of the better-off and could never be affected by them. We consider a case of isolated communities where the poorer group never knows the richer group exists and never interacts with them. The prioritarian predicts that leveling down here is wholly devoid of value since there is no relational harm to remove and no benefit to confer, while the telic egalitarian predicts that inequality remains bad in itself even if unknown, because the impersonal pattern of distribution is flawed regardless of awareness.

  We also introduce one case that we have not seen discussed, and we build it here rather than borrow it, involving a single person whose life is made less peaked. In this case, the good years of a life are trimmed and the bad years are untouched, so that the whole life is flatter and nobody, herself included, is better off for it. We ask each side whether its verdict on leveling down between persons carries over to leveling down within a life, and if the two verdicts come apart, whether the divergence is principled or an ad hoc restriction. The telic egalitarian predicts that the value of equality should apply within a life as well as between lives, suggesting that a smoother life is in one respect better even if no moment is improved, unless they can show a principled reason why equality only applies between persons. The prioritarian predicts that there is no value in flattening a life without benefit, just as there is no value in leveling down between persons, and that if the egalitarian accepts leveling down between persons but rejects it within a life, this divergence reveals that their commitment is not to equality as such but to social relations, which would undermine the claim that equality is intrinsically valuable. We commit to resolving these cruxes not by retreating to terminology but by testing these predictions against our considered judgments, aiming to produce a final account that either vindicates the intrinsic value of equality or demonstrates that priority-weighted well-being exhausts the distributive values.
