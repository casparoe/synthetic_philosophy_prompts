      *   **Task:** Write the *desiderata* (requirements) for an adequate treatment of confirmation regarding old evidence.
      *   **Specific Requirements:**
          *   For each desideratum: State the requirement, give the motivating case/consideration, and mark it as "non-negotiable" or "camp preference."
          *   Address specific points raised by the user (Mercury/perihelion, construction use, dormant data, individual vs. community, ignorance constraint, temporal asymmetry).
          *   Filter out prejudices (tell the user if a point is just a bias).
