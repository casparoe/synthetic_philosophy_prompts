      *   **Tone:** Rigorous, precise, respectful of the physicist's expertise, avoiding fluff. Willing to admit conflict/inconsistency.

  2.  **Deconstruct the Problem of Old Evidence (Glymour's Problem):**
      *   *Core Issue:* In Bayesian confirmation theory, $P(E) = 1$ for old evidence. Since $P(H|E) = P(H \cdot E) / P(E)$, if $P(E)=1$, then $P(H|E) = P(H)$. No confirmation occurs.
      *   *Real World:* Einstein's GR explaining Mercury's perihelion *did* confirm GR.
      *   *Goal:* Define what a solution *must* do to be acceptable.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Point 1: Historical Episodes (Mercury).*
          *   *Requirement:* The account must allow $P(H|E) > P(H)$ even if $E$ was known before $H$.
          *   *Motivation:* Mercury/GR.
          *   *Status:* Non-negotiable. If a theory of confirmation says GR wasn't confirmed by Mercury, the theory is broken.
      *   *Point 2: Construction/Independence.*
          *   *Requirement:* The account must distinguish between $E$ used to *build* $H$ vs. $E$ merely known before $H$.
          *   *Motivation:* Curve fitting. If I tune parameters to hit data points, that data doesn't confirm the model.
          *   *Status:* Non-negotiable. (This is the "use-novelty" issue).
      *   *Point 3: Dormant/Unremarked Data.*
          *   *Requirement:* The account must explain the status of data known but not recognized as relevant until $H$ arrived.
          *   *Motivation:* Michelson-Mory before SR? Or just archival data.
          *   *Status:* Non-negotiable (needs classification), but the *verdict* might be camp-dependent. Let's make the requirement that the account *must classify it consistently*.
      *   *Point 4: Individual vs. Community.*
          *   *Requirement:* Specify the agent relative to whom evidence is "old."
          *   *Motivation:* A student learns GR today. Mercury is old for the community, new for the student's epistemic state.
