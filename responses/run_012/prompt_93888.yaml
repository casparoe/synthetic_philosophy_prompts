      *   *Point 5: Ignorance Constraint.*
          *   *Requirement:* Confirmation shouldn't rest *solely* on the agent's failure to deduce $H \to E$ earlier.
          *   *Motivation:* Logical omniscience problem. If confirmation is just "I didn't know H implied E," it's psychological, not evidential.
          *   *Status:* Non-negotiable (for a realist/objective account), but Subjective Bayesians might fight this. Let's label it carefully.
      *   *Point 6: Temporal Asmetry (Prediction vs. Accommodation).*
