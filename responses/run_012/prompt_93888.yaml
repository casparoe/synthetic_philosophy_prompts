answer: |-
  Here are the desiderata for an adequate account of confirmation regarding old evidence. They are structured to separate the structural necessities of evidential support from the methodological preferences of specific schools (e.g., Subjective Bayesianism, Error Statistics, Heuristic Novelty).

  ### Desideratum 1: The Recovery Constraint (Non-Negotiable)
  **Requirement:** The account must allow a datum $E$, known with certainty prior to the formulation of hypothesis $H$, to raise the epistemic status of $H$.
  **Motivation:** The historical record of science. General Relativity (GR) is taken to be confirmed by the anomalous precession of Mercury's perihelion, despite that anomaly being a known datum for decades prior to Einstein. An account that renders this confirmation zero fails to describe scientific practice.
  **Status:** **Non-Negotiable.** Any theory of confirmation that declares the primary evidence for GR evidentially inert is descriptively inadequate.

  ### Desideratum 2: The Non-Triviality Constraint (Non-Negotiable)
  **Requirement:** The account must distinguish between data *known* beforehand and data *used* to construct the hypothesis. If $E$ was used to fix the free parameters of $H$, $E$ cannot confirm $H$.
  **Motivation:** The curve-fitting problem. If I adjust a model's constants until it passes through existing data points, the fit is guaranteed by construction. Treating this as confirmation validates tautologies.
  **Status:** **Non-Negotiable.** This is the condition of "use-novelty." Without it, any theory can be made to fit any past data by adding sufficient epicycles.

  ### Desideratum 3: The Relevance Discovery Constraint (Non-Negotiable)
  **Requirement:** The account must provide a criterion for "dormant" data: observations known to exist but not recognized as relevant to $H$ until $H$ was proposed. It must specify whether the confirmation arises from the data itself or from the recognition of the entailment.
  **Motivation:** Archival data. Suppose a spectral line was recorded in 1920 but deemed noise, until a 1980 theory predicted that specific line. The data is "old" (on the record) but the *connection* is new.
  **Status:** **Non-Negotiable.** The account must classify this case, even if the verdict is debated. It cannot simply categorize all recorded data as "old" and all unrecorded data as "new."

  ### Desideratum 4: The Agent-Neutrality Constraint (Camp Preference)
  **Requirement:** The confirmatory relation should not depend on the idiosyncratic epistemic state of a particular individual. If $E$ confirms $H$ for the community, it should not cease to confirm $H$ for a student who learns $E$ and $H$ simultaneously.
  **Motivation:** Objectivity. Science is a public enterprise. If confirmation relies on the psychological surprise of a specific agent, it becomes a history of psychology rather than a logic of evidence.
  **Status:** **Camp Preference.** Subjective Bayesians reject this; they treat confirmation as relative to an agent's probability function. Objective Bayesians and Error Statisticians accept this. You must choose whether you want a logic of *belief* or a logic of *evidence*.

  ### Desideratum 5: The Objectivity of Entailment Constraint (Non-Negotiable for Realists)
  **Requirement:** The account must not solve the problem of old evidence solely by appealing to the scientist's prior ignorance of the logical relation $H \vdash E$. Confirmation should not reduce to "I didn't know $H$ implied $E$."
  **Motivation:** The world, not our minds. If the evidential support vanishes once the logical implication is understood, then confirmation is a measure of human limitation, not theoretical virtue. The fit between GR and Mercury is a fact about spacetime, not about Einstein's deductive speed.
  **Status:** **Non-Negotiable** (for a realist account). Note: Standard Bayesian solutions *violate* this. They solve the problem by relaxing the assumption of logical omniscience, making confirmation turn on the learning of the entailment.

  ### Desideratum 6: The Prediction Asymmetry (Camp Preference/Prejudice)
  **Requirement:** A datum $E$ arriving *after* $H$ is proposed should count for more than the same datum $E$ known *before* $H$ was proposed.
  **Motivation:** Scientific intuition. We trust predictions (e.g., Eddington's 1919 eclipse) more than accommodations (e.g., Mercury).
  **Status:** **Prejudice/Contested.** Many philosophers of science argue this is a heuristic for detecting fraud (Desideratum 2) rather than a logical feature of confirmation. If Desideratum 2 is satisfied (no construction use), many accounts (e.g., Maher 1988) argue there is no *logical* difference between prediction and accommodation. If you demand this asymmetry over and above use-novelty, you are imposing a extra-logical preference.

  ***

  ### Analysis of Conflicts and Restrictions

  You asked for honesty regarding inconsistency and difficulty. Here is the assessment.

  **1. The Inconsistent Pair: Desideratum 1 vs. Desideratum 5**
  There is a fundamental tension between the **Recovery Constraint** (Old evidence must confirm) and the **Objectivity of Entailment Constraint** (Confirmation must not rest on ignorance).
  *   **The Conflict:** In any probabilistic framework where $P(E)=1$ (because $E$ is old), the only way for $H$ to gain probability is if the agent learns something new. Since $E$ is already known, the only new thing to learn is the logical relationship $H \vdash E$.
  *   **The Consequence:** To satisfy Desideratum 1 (Mercury confirms GR), standard accounts *must* violate Desideratum 5. They must admit that the confirmation consists in the scientist realizing that the theory entails the data. If you insist that confirmation is *not* about the scientist's realization (Desideratum 5), you strip standard probabilistic accounts of the mechanism required to solve the old evidence problem (Desideratum 1).
  *   **Verdict:** You cannot have both within a standard Bayesian framework. You must either accept that confirmation is partly about the history of discovery (violating 5) or abandon probabilism for a non-probabilistic account (e.g., Error Statistics) that handles this differently.

  **2. The Most Restrictive Requirement: Desideratum 2 (Non-Triviality)**
  The **Non-Triviality Constraint** (Use-Novelty) does the most work in ruling out existing accounts.
  *   **Why:** Simple Bayesianism ignores this entirely; it cares only about $P(H|E)$, not how $H$ was generated. To satisfy Desideratum 2, you must move beyond pure probability calculus to an account that tracks the *temporal/heuristic order* of hypothesis construction. This rules out "static" accounts of confirmation. It forces you to adopt a more complex framework (such as Worrall's Heuristic Novelty or Mayo's Error Statistics) that incorporates the method of generation into the logic of support.

  **3. The Prejudice Warning**
  Be wary of **Desideratum 6 (Prediction Asymmetry)**. If you enforce Desideratum 2 (no construction use), the additional demand that *prediction* counts for more than *accommodation* is largely unsupported by formal accounts. It is often a proxy for Desideratum 2 (we assume predictors didn't cheat). If you have a guarantee that the data was not used in construction, the preference for prediction is likely a psychological bias, not an evidential necessity. I recommend marking this as a preference, not a requirement, lest you force the philosophy to accommodate a intuition that may be flawed.

  **Summary Recommendation:**
  If you want a coherent list, you must drop **Desideratum 5** or abandon standard probabilism. If you stay Bayesian, you must accept that "confirmation by old evidence" is shorthand for "confirmation by the new discovery of an entailment." If you find that unacceptable (as your prompt suggests), you are signaling that you require a non-Bayesian account of confirmation.
