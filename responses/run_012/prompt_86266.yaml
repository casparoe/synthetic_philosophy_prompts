answer: |-
  This is an excellent pivot. The "one person makes no difference" objection is usually deployed as a blunt instrument to induce apathy, but you are right to sense that it relies on a naive model of causality. The 1791 sugar boycott is the perfect stress test because it is historically documented, morally stark, and structurally identical to your dietary choice.

  Here is the map of the case, the evaluation of the philosophical frameworks, and a test of your hunch against the literature.

  ### 1. Mapping the 1791 Case

  To apply the theory, we must first fix the facts of the mechanism.

  *   **The Act:** An individual household in Bristol or London stops buying West Indian sugar and switches to (more expensive) East Indian or beet sugar, or goes without.
  *   **The Harm:** The chattel slavery system in the Caribbean.
  *   **The Contributor:** The British consumer.
  *   **The Causal Chain:** Consumer demand $\rightarrow$ Merchant orders $\rightarrow$ Planter production $\rightarrow$ Enslavement/Labor conditions.

  **The Inefficacy Reality:**
  Economically, a single household dropping sugar was indeed a rounding error. The global commodity market is buffered. If Mrs. Smith stops buying sugar, Mr. Jones (who wasn't boycotting) buys the pound she left on the shelf. The price dips imperceptibly; the planter in Jamaica does not free an enslaved person because one crate sat in a warehouse an extra week. The *causal* link between the individual act and the reduction of physical suffering is virtually non-existent.

  ### 2. Evaluating the Descriptions

  How do the philosophical frameworks describe what the boycotter is doing?

  **A. Causing Harm (The Consequentialist View)**
  *   *Verdict:* **Fails.**
  *   If the metric is "did this specific act prevent a specific unit of suffering?", the answer is no. If you argue "but if everyone did it...", you trigger the *threshold problem* (what if everyone does it except one person? Does that one person matter?). The 1791 boycott cannot be justified on individual causal efficacy.

  **B. Complicity in a Wrong (The Integrity View)**
  *   *Verdict:* **Strong.**
  *   This is where Christopher Kutz's *Complicity: Ethics and Law for a Collective Age* shines. Kutz argues that you are accountable for participating in a collective harm, even if your contribution is negligible, because you share the *intention* of the collective project.
  *   In 1791, by buying sugar, you are aligning your will with the plantation system. You are making their product liquid. By boycotting, you are cleansing your own moral integrity. You are saying, "I will not be a node in this network."
  *   *Limit:* This explains why *you* feel better, but it doesn't answer "what difference does it make" to the world. It solves the problem of *your* soul, not the enslaved person's chains.

  **C. Doing My Bit in a Collective Project (The Collective Responsibility View)**
  *   *Verdict:* **Stronger.**
  *   Philosophers like Tracy Isaacs argue that when individuals form a "collective" (even a loose one), they share responsibility for the outcome. The act is not "I am stopping slavery" but "I am joining the group that is stopping slavery."
  *   In 1791, the pamphlet you cited ("If we purchase the commodity we participate in the crime") explicitly frames this as collective participation.

  ### 3. Testing Your Hunch: Visibility vs. Causation

  Your hunch is that the boycott worked by **making it visible how many people cared and changing what was politically sayable**, rather than by direct economic harm reduction.

  **Is this correct?**
  Historically, yes. The 1791 boycott did not bankrupt the West Indian planters immediately (slavery persisted for decades). Its power was **expressive and constitutive**.
  1.  **Materializing the Abstract:** Slavery was distant. Sugar was daily. The boycott physically connected the tea cup to the whip. It made the violence *visible* in the domestic sphere.
  2.  **Signaling to Power:** It wasn't about the lost revenue; it was about the lost *votes*. It signaled to Parliament that abolition was a mobilized voting bloc.
  3.  **Norm Shifting:** It changed the "overton window." Before the boycott, slavery was an economic fact; after, it became a moral controversy.

  **Does the Complicity Literature have room for this?**
  **Mostly, no.** This is where the theory runs out.

  Standard complicity theory (Kutz, Hill, etc.) is primarily **backward-looking** and **harm-focused**. It asks: "Are you tainted by the harm that occurred?" It justifies the boycott as a way to keep your hands clean *despite* the inefficacy.

  It struggles to account for **forward-looking political efficacy** that operates through *signaling* rather than *causing*.
  *   **The Gap:** Complicity theory treats the act as a withdrawal of support from a *harmful* collective. It does not easily categorize the act as a contribution to a *new* political collective.
  *   **The Relabeling Problem:** If a complicity theorist tries to absorb your hunch, they might say, "By signaling, you are causally contributing to political pressure." But this stretches the definition of "cause." It turns *meaning* into *mechanics*.
  *   **The Missing Framework:** What you are describing is closer to **Expressive Action** (Elizabeth Anderson) or **Constitutive Rhetoric**. The act *constitutes* the political power; it doesn't merely cause it. When 300,000 people refuse sugar, they don't just subtract money; they *create* a public.

  ### 4. Friendly Example or Unanticipated Challenge?

  The 1791 case is a **hostile example** for standard causal individualism, but a **stressful example** for complicity theory.

  *   **For Causal Individualism:** It destroys the theory. It proves that morally vital actions can be causally impotent at the individual level.
  *   **For Complicity Theory:** It reveals a blind spot. Complicity theory justifies *why* you boycott (to avoid being an accomplice), but it doesn't fully explain *how* the boycott succeeds (by building a counter-public). It treats the boycott as a defensive moral shield, whereas history shows it was an offensive political sword.

  The literature often assumes that if the causal impact is negligible, the only remaining value is integrity. The 1791 case shows there is a third value: **political construction.**

  ### 5. The Answer to Your Friend

  When someone asks, "What difference does one person make?", the complicity literature gives you a shield ("I am not complicit"), but your hunch gives you a sword ("I am building power").

  Here is how you map the 1791 logic to your vegetarianism to answer the objection:

  > "The 'one person' argument assumes my action is an economic transaction intended to starve the industry of demand. If that were the goal, you'd be right; my burger is a rounding error.
  >
  > But look at the 1791 sugar boycott. One person stopping sugar didn't free a slave. The economic impact was negligible. But 300,000 people doing it created a political force that eventually ended the trade.
  >
  > My vegetarianism isn't a causal attempt to fix the climate alone. It's a **signal of membership** in a collective project. It changes the social norm around meat, making it easier for the next person to quit, and signals to the market and politicians that this is a voting bloc, not a niche preference.
  >
  > So, to answer your question: One person makes no *causal* difference. But one person makes all the *constitutive* difference. You can't have a movement without participants, and I am choosing to be a participant rather than a bystander. The 'difference' isn't in the supply chain; it's in the social fabric."

  ### Summary
  *   **Who counts as a contributor?** Anyone who sustains the norm, not just the causal lever-pullers.
  *   **Best description:** Doing my bit in a collective project (Solidarity) + Refusing Complicity (Integrity).
  *   **Theory Status:** The complicity literature justifies the *refusal* but under-theorizes the *construction*. It explains why you shouldn't eat meat, but it needs help from political philosophy to explain why that actually changes the world.
  *   **Your Hunch:** Validated. The mechanism is visibility and norm-shifting, not direct harm reduction. The "inefficacy objection" fails because it measures the wrong metric (arithmetic vs. algebraic).

  You are not a drop in the ocean; you are the ocean in a drop. (A bit poetic, but structurally accurate to the 1791 model). The theory catches up to this only if we move from *Complicity* to *Solidarity*.
