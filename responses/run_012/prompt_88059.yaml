answer: |-
  ### Dependency Order

  Before the question "Was this outcome overdetermined?" can be meaningfully posed to this room, three layers of agreement must be established in this specific order. If you skip a layer, the historians will retreat to narrative and the philosophers to logic, and they will never speak to each other.

  1.  **Fixed Explanandum:** The room must agree on exactly *what* is being explained. Is it "The vote passed"? Or "The vote passed 31–29"? Or "The vote passed in 1907"? If you do not fix the description of the outcome, the causal structure will shift beneath you.
  2.  **Fixed Contrast Class:** The room must agree on what the outcome is being contrasted against. "Why accession rather than status quo?" yields a different causal structure than "Why accession in 1907 rather than 1910?" Overdetermination is invisible without a defined alternative.
  3.  **Fixed Explanans Field:** The room must agree on the boundary of the "strands." Are we looking only at the three strands on the handout, or does the "background" (e.g., the existence of the legislature itself) count as a strand?

  **Why the session must end where I place it:**
  Do not end with a verdict on the 1907 case (e.g., "It was Type I"). That validates the historians' view that causal structure is an empirical discovery waiting in the archive. Do not end with "It is entirely up to the historian" (e.g., "Pick whichever model you like"). That validates the philosophers' view that history is unconstrained fiction.
  End on the distinction between **selection** and **construction**. The causal relations are real (in the past), but the *classification* of those relations (as overdetermined, joint, or contributory) depends on the explanatory interest (the contrast class). This keeps the historians honest (the past constrains us) and the philosophers honest (logic doesn't dictate the question).

  ---

  ### The Carrying Example: Evaluation and Strategy

  **Verdict:** The 1907 Customs Union case is sufficient. Do not replace it.
  **Why:** It is fictional (no prior knowledge), binary (pass/fail), and contains the specific "poison pill" required for Redundant Sufficiency (the opposition party's commitment). A real historical case will inevitably bog down in evidentiary disputes ("But the loan terms weren't actually binding"), which allows historians to dismiss the metaphysics. A famous case (e.g., WWI) allows students to bypass reasoning and rely on memorized interpretations.

  **Information Release Strategy:**
  **Distribute the full one-page handout at minute 0.**
  Do not drip-feed the strands. If you withhold information, the students will argue about *facts* ("We didn't know about the opposition party!"). You want them arguing about *structure*.
  However, you must **gate the interpretation**.
  1.  **Minute 0–10:** Read the facts. Ensure everyone accepts the text as the "archive." No interpretation yet.
  2.  **Minute 10–30:** Force Reading (ii) **Joint Sufficiency**. Ask: "Tell me the story of why this passed." This is the historians' comfort zone. They will weave the three strands into a narrative tapestry.
  3.  **Minute 30–50:** Force Reading (i) **Redundant Sufficiency**. Ask: "Look at the last sentence regarding the opposition party. If the vote had failed, what happens?" This triggers the philosophers' counterfactuals.
  4.  **Minute 50–70:** Force Reading (iii) **Contributory/INUS**. Ask: "Look at the margin (31–29) and the absent deputies. Were the strands sufficient without the specific background conditions of the legislature's rules?" This forces the nuance.
  5.  **Minute 70–90:** Meta-discussion on mind-dependence.

  **Why this order?** It moves from the intuitive (narrative) to the counter-intuitive (redundancy) to the technical (INUS), mirroring the cognitive load.

  ---

  ### Misconceptions: Interception and Recurrence

  You listed five specific misconceptions. Here is where to kill them, how, and which will resurrect.

  | Misconception | When to Head Off | The Exact Move | Will It Return? |
  | :--- | :--- | :--- | :--- |
  | **Additive/Vector Model** ("Each cause contributed 33%") | **Minute 15** (During Joint Sufficiency) | When a historian says "The harvest was the main driver," interrupt: "If the harvest contributed 50% and the loan 50%, does that mean half a loan would have failed? Or is the logic binary?" Force them to speak in *conditions*, not *weights*. | **No.** Once the binary logic is established, this usually stays dead. |
  | **Overdetermination = Inevitability** | **Minute 40** (During Redundant Sufficiency) | When a philosopher claims "It was inevitable because of the opposition party," point to the *loan*. "The loan terms could have been rejected. Redundancy requires two *actual* sufficient causes, not one actual and one hypothetical." Distinguish *causal sufficiency* from *historical inevitability*. | **Yes.** It will return in the final discussion as "So history is deterministic?" |
  | **Not Necessary = Not Cause** | **Minute 55** (During INUS) | When a philosopher says "The press campaign wasn't necessary (because of the loan), so it's not a cause," invoke the INUS definition. "It was a necessary part of a sufficient *set*, even if the set wasn't the only *way*." | **Yes.** Historians will revert to this when grading importance. |
  | **Counterfactual = Fiction** | **Minute 35** (Transition to Redundant) | When a historian says "We can't know what the opposition would have done," point to the text: "The handout says they 'committed.' Treating archival statements as data is your job, not denying the premise." | **No.** If you anchor it in the text, they accept it. |
  | **Pragmatic = Arbitrary** | **Minute 80** (Final Synthesis) | When a philosopher concludes "So we just choose the model we like," say: "You can choose the question, but you cannot choose the answer. The archive constrains which model fits the answer." | **Yes.** This is the hardest one. It will linger as "So truth is relative?" |

  **The Re-forming Threat:**
  The "Pragmatic = Arbitrary" error is the most dangerous. It will re-form at the very end as a dismissal of historical truth. You must explicitly state: "Choosing to ask 'Why 1907?' rather than 'Why Accession?' is pragmatic. Whether the loan caused the 1907 timing is not."

  ---

  ### Timing and Board Layout

  **Board Layout:**
  Divide the board into four vertical panels.
  *   **Panel 1 (Far Left):** "The Archive." List the 5 key facts from the handout (Vote count, Harvest, Loan, Press, Opposition Commitment/Absent Deputies). *Do not erase this.*
  *   **Panel 2:** "Reading 1: Joint Sufficiency." (Columns: Strand A + Strand B + Strand C = Outcome).
  *   **Panel 3:** "Reading 2: Redundant Sufficiency." (Columns: Strand Set 1 -> Outcome; Strand Set 2 -> Outcome).
  *   **Panel 4:** "Reading 3: INUS/Contributory." (Columns: Strand + Background = Sufficient Set).

  **Timing:**
  *   **00–10:** Handout distribution. Silent read. Panel 1 populated.
  *   **10–30:** Reading 1 (Historians lead). Populate Panel 2.
  *   **30–50:** Reading 2 (Philosophers lead). Populate Panel 3.
  *   **50–70:** Reading 3 (Mixed). Populate Panel 4.
  *   **70–85:** Synthesis (Mind-dependence).
  *   **85–90:** Diagnostic Question & Dismissal.

  **Keeping the Room Engaged:**
  *   **For Historians:** During the Philosophy-heavy sections (30–50), demand they verify the *plausibility* of the counterfactuals against Panel 1. "Does the text support the claim that the opposition would have succeeded?" This forces them to handle the metaphysics as source criticism.
  *   **For Philosophers:** During the History-heavy sections (10–30), demand they formalize the *necessity*. "You say the harvest was crucial. Write the conditional: If no harvest failure, then...?" This forces them to handle the sources as logical premises.
  *   **The "Checkout" Prevention:** At Minute 45, swap the scribe. If a historian was writing on Panel 2, ask a philosopher to write on Panel 3, but require them to read the specific line from the "Archive" panel that justifies it.

  ---

  ### The Close

  **What to Leave Out (Say this explicitly at Minute 70):**
  "I am explicitly cutting three things today. 1. We are not doing possible-worlds semantics; 'could have happened' means 'is consistent with the archive.' 2. We are not doing probabilistic causation; we are treating these as deterministic conditions for the sake of the model. 3. We are not debating Covering Laws; we are looking at singular causal claims. If you try to introduce these, I will stop you, because they will burn the 90 minutes."

  **The Diagnostic Question:**
  Do not ask: "What are the three types of overdetermination?"
  Ask this:
  > "If we change the question from 'Why did the vote pass?' to 'Why did the vote pass *by exactly two votes*?', does the causal structure of the event change from Redundant to Joint, even though the facts on the board have not changed? And if it does change, is that change in the past or in the question?"

  **Success Condition:**
  If they answer "The change is in the question, but the facts constrain which models fit," they hold the distinction. If they answer "The past changes," they are idealists. If they answer "The model stays the same," they haven't grasped the role of the contrast class.

  **Final Instruction:**
  "Next week, bring a paragraph from your own research. Do not tell me what happened. Tell me which of these three causal structures you are implicitly assuming, and what contrast class forces you to assume it."
