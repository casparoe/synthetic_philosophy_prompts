answer: |-
  1. **The Brick Test**
  You argue that a volcano can be a historical actor, not just a cause. But if I throw a brick through a window, the brick has "causal reach"—it physically forces the glass to break. We don't call the brick an actor. What is the specific difference between your volcanic actor and my brick? At what point does a physical cause graduate into a historical actor?

  *Follow-up:* She will likely say it's about the complexity of the network or the "tangle" of effects. Push back: If complexity is the only metric, doesn't that mean a sufficiently complicated machine is also an actor? Where do you draw the line so "actor" doesn't just mean "complicated cause"?

  2. **Collapsing the Distinction**
  You're careful to say non-humans have "affordances"—what they allow or forbid—rather than intentions. But if you remove intention, doesn't the distinction between "actor" and "cause" collapse? If a virus acts without meaning to, isn't it just a force of nature like gravity? Why do we need a new noun for this?

  *Follow-up:* She'll likely argue that "force" implies passivity, whereas "actor" implies interaction. Ask: But if the virus doesn't choose to interact, isn't that interaction still just a mechanical reaction? Are you smuggling intention back in by using the word "actor"?

  3. **The Metaphor Objection**
  Philosophers often argue that agency without intention is just a metaphor—like saying "the market decided." Metaphors are useful for poetry, but do they belong in causal explanation? If I say "cholera remade the city," am I explaining anything, or just decorating a story about public health engineers?

  *Follow-up:* She will probably say it's an analytical tool, not poetry. Ask: If it's a tool, what work does it do that the word "cause" cannot? If the answer is "it changes how we feel about history," isn't that just rhetoric?

  4. **Utility of Terminology**
  Let's assume you're right that this isn't just metaphor. Why not use existing language? We have words like "constraint," "catalyst," or "variable." By insisting on "actor," aren't you inviting confusion with human agents who can be held responsible? Is the terminological risk worth the payoff?

  *Follow-up:* She'll likely say existing words are too human-centric or passive. Ask: But if you have to spend half your book explaining that "actor" doesn't mean "person," haven't you already lost the linguistic battle? Why not change the theory instead of the dictionary?

  5. **The Determinism Slide**
  You deny being an environmental determinist, but let's look at Tambora. If the eruption causes crop failure, which causes riots, which causes policy change, isn't the eruption determining the politics? If the non-human sets the boundaries of what's possible, how is that not a soft determinism?

  *Follow-up:* She will likely say humans still choose how to respond within those boundaries. Ask: But if the boundaries are set by the volcano, isn't the human choice just a variable within a non-human equation? Doesn't the volcano still get the final vote on what's possible?

  6. **Ethical Accountability**
  Here's the political worry: If cholera is an actor in remaking cities, does that let human decision-makers off the hook? If a mayor ignores sanitation and people die, can he say, "Well, the microbe was an actor too"? Does spreading agency dilute responsibility?

  *Follow-up:* She'll likely say it complicates responsibility rather than diluting it. Ask: Complicating it sounds like a luxury historians can afford, but politicians need clear lines of blame. In a court of law, not a seminar, does your framework help or hinder justice?

  7. **The Counterfactual Test**
  Let's run a test. Under what conditions would you say a volcano is *not* an actor, but merely a condition or scenery? If Tambora erupts but no one notices and nothing changes, is it still an actor? Or does it need a human response to qualify?

  *Follow-up:* She will likely say it's about the potentiality or the "tangle" regardless of observation. Ask: If it depends on the potential to affect humans, isn't the human still the central reference point? Can a non-human be an actor in a history that doesn't include us?

  8. **Narrative Changes**
  You talk about historiographical payoff. Be specific: does accepting your view change the verbs we use? Do we stop writing "The King declared war" and start writing "The climate and the King declared war"? Or is this just a background note in the introduction?

  *Follow-up:* She'll likely say it changes the narrative structure, not just sentences. Ask: If the narrative structure changes, do humans stop being the protagonists? If humans aren't the protagonists, who is the audience supposed to identify with?

  9. **Archival Method**
  Does this change how you read the archive? If microbes are actors, do you look for different evidence than a traditional historian? Are you reading soil samples instead of state letters, or just reading the letters differently?

  *Follow-up:* She'll likely say she reads the letters for traces of the non-human. Ask: But isn't that just traditional history paying attention to context? What specific document or artifact becomes legible to you that would be invisible to a standard political historian?

  10. **Tangles vs. Hierarchy**
  You propose tracing "tangles" of causation instead of picking a prime mover. But historians usually need to explain why *this* happened instead of *that*. If everything is tangled with everything else, how do you prioritize? Doesn't "tangle" risk becoming a word for "we can't decide what mattered most"?

  *Follow-up:* She'll likely say it's about distributed causality. Ask: But if you can't rank the causes, can you actually explain an outcome? Or are you just describing a state of affairs without explaining why it tipped one way?

  11. **The Falsification Condition**
  Final question: What evidence or argument would make you give up the whole "non-human actor" framing? Is there a historical case where you'd concede, "Actually, this was just humans all the way down"? If nothing can prove you wrong, is this a theory or a belief system?

  *Follow-up:* She will likely say it's a framework, not a hypothesis, so it isn't falsifiable in that way. Ask: If it's not falsifiable, how do we judge if it's better than the old way? Is the only metric whether we find it more interesting?
