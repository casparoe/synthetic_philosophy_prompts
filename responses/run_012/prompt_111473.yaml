      *   *Sincerity:* We don't measure heartbeats. We measure actions.
      *   *Uptake:* Recipient's refusal doesn't negate the duty to offer.
      *   *Legal:* The Code applies to editorial output. Legal settlements are internal constraints. They cannot override public accountability standards, but the remedy should be crafted to respect the boundary between "editorial regret" and "legal admission."

  8.  **Final Polish:** Check against all constraints in the prompt.
