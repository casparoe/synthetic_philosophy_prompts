          *   On-air statement aired: "There have been claims that our reporting on this was wrong. Mistakes were made, and I'm sorry for the upset this has caused. We'll do better."
          *   Complainant says: Not an apology, wants more.
          *   Broadcaster says: Already apologized, more breaches settlement/forces insincerity.
      *   **Code Gaps:** Code requires "publish an apology" if complaint upheld. No definition. Precedent: Correction must identify statement, state accuracy, reach audience. Apology must be directed to person wronged and capable of being received.
      *   **Specific Requirements:**
          *   Recommend disposition (Uphold/Dismiss/Partial).
          *   Precise remedy and deadline.
          *   Workable test for "apology" under the code.
          *   Apply test to the aired statement.
          *   Address Chair's proposal: Remedial (repair record/standing) vs. Expressive (convey actual feelings).
          *   Confront strongest objections (compelled insincerity, uptake/refusal by complainant).
          *   Format: Formal register, document for voting, no scholarly citations.

  2.  **Determine the Stance/Disposition:**
      *   *The Problem:* The aired statement is vague ("claims... wrong," "mistakes made," "sorry for upset"). It doesn't admit specific error regarding the researcher's status or work. It protects the broadcaster legally but fails the complainant.
      *   *The Constraint:* The legal settlement prevents admitting falsity/fault explicitly.
      *   *The Code:* Requires an apology.
      *   *The Balance:* The Committee cannot override the legal settlement (broadcaster would be in breach of contract/law), but it must enforce the Code.
      *   *Decision:* Uphold in part. The statement *was* an apology in form, but failed the *substance* required by the Code's purpose (restoring standing). However, we cannot order specific words that breach the settlement. We need a remedy that satisfies the Code without triggering the legal breach.
      *   *Wait, a harder look:* If the settlement prevents admitting fault, can the Code compel it? Usually, regulatory codes sit alongside law. If the Code says "publish an apology," and the legal team says "we can't admit fault," there's a conflict.
      *   *Refined Decision:* Uphold the complaint that the apology was insufficient under the Code. Order a further statement. Why? Because the current statement is too vague to restore standing (Remedial function). The Chair's distinction (Remedial vs. Expressive) is useful here. We don't need them to *feel* sorry (Expressive), we need them to *act* to repair the harm (Remedial).
      *   *The Remedy:* A statement that acknowledges the specific harm (damage to reputation) without necessarily using the word "lie" or "defamation" if that breaches settlement. It needs to rehabilitate the scientist's status.
      *   *Actually, looking at the prompt's constraints:* The prompt asks me to draft the opinion *for the committee*. I need to take a position that resolves the split. The Chair wants to use the Remedial/Expressive distinction. I should support this but refine it to handle the legal constraint.
      *   *Disposition:* Uphold in part. The current statement was insufficient.
      *   *Remedy:* Order a further statement that specifically addresses the reputational harm (calling her a campaigner vs scientist) without necessarily conceding legal liability.
      *   *Wait, the "Uptake" issue:* The complainant has refused the current apology. Does that matter? The Code says "capable of being received," not "actually accepted."
      *   *The "Sincerity" issue:* Can you compel sincerity? No. But you can compel the *act* of apology (Remedial).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Committee Document format.
      *   **Introduction:** Case reference, subject, purpose.
      *   **Facts:** Briefly summarize the segment, the complaint, the legal settlement, the aired statement.
      *   **The Issue:** What constitutes an "apology" under the Code? Is the aired statement sufficient?
      *   **Analysis - The Test:** Define the test for an apology. Incorporate the Chair's Remedial vs. Expressive distinction.
          *   *Test:* An apology under the Code must be (1) Directed, (2) Public/Reach, (3) Remedial (acknowledges specific harm/repair standing). It does *not* require (4) Expressive (internal state of remorse).
      *   **Application:** Apply test to "There have been claims..." statement.
          *   Directed? Yes (on air).
          *   Reach? Yes.
          *   Remedial? No. It's too vague ("mistakes," "upset"). It doesn't restore her standing as a scientist.
          *   Expressive? Irrelevant, but it lacks even the *form* of remorse.
      *   **Addressing the Chair's Proposal:** Endorse the Remedial/Expressive distinction. It solves the "compelled speech/sincerity" problem. We compel the *repair*, not the *feeling*.
      *   **Addressing Objections:**
          *   *Compelled Insincerity:* Addressed by the Remedial distinction. We aren't asking for their soul, we are asking for reputational repair.
          *   *Uptake:* The Code requires capability of receipt, not acceptance. Her refusal doesn't absolve the duty.
          *   *Legal Settlement:* This is the trickiest. The opinion must navigate this. The Code binds the broadcaster. The settlement binds the broadcaster. The Committee enforces the Code. If the settlement prevents a Code-compliant apology, the broadcaster is in a bind. *However*, usually, a "remedial" statement can be crafted that restores standing without admitting legal "falsity." E.g., "We should not have characterized Dr. X as..." rather than "We lied about Dr. X." I need to be careful not to order a breach of law, but order compliance with Code. I will recommend a statement that focuses on the *impact* on her standing rather than the *truth value* of the original report.
      *   **Disposition & Remedy:** Uphold in part. Order a new statement. Deadline 14 days.
      *   **Conclusion:** Summary.

  4.  **Refining the Tone:**
      *   Formal, adjudicative, precise.
      *   Avoid academic fluff.
      *   Respect the split in the committee (acknowledge counter-arguments).
      *   Ensure the "Remedial vs. Expressive" distinction is central, as requested by the Chair's prompt.

  5.  **Self-Correction/Nuance Check:**
      *   *Critique:* Is ordering a new statement feasible if the lawyers say it breaches settlement?
      *   *Fix:* The opinion should acknowledge the legal constraint but assert the Code's primacy in editorial standards. However, to be practical, the remedy should be drafted to *allow* compliance with the settlement while meeting the Code. The key is distinguishing between "admitting legal liability" (settlement block) and "acknowledging editorial harm" (Code requirement).
      *   *Critique:* The prompt says the settlement statement concedes "neither falsity nor fault."
      *   *Fix:* The new order must not demand concession of falsity/fault. It must demand restoration of standing. How? By clarifying her credentials or the status of her work without explicitly saying "We were wrong." E.g., "Dr. X is a qualified researcher whose work remains part of the scientific discourse."
      *   *Wait, looking closer at the prompt:* The prompt asks me to recommend a disposition and remedy. If I order a statement that the lawyers say breaches the settlement, the broadcaster won't do it. But as a Committee, we enforce the Code. I will recommend upholding the complaint because the *current* apology is insufficient. I will order a *sufficient* apology. It is up to the broadcaster's lawyers to draft words that satisfy both the Committee and the Settlement. My job is the Code.
      *   *Key Insight:* The Chair's distinction is the key to unlocking this. If an apology is *Remedial*, it focuses on the *effect* on the victim, not the *guilt* of the speaker. This aligns perfectly with the legal need to avoid admitting fault. I can order them to repair her standing without ordering them to admit they lied.

  6.  **Finalizing the Structure:**
