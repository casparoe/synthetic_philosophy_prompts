answer: |-
  **EDITORIAL STANDARDS COMMITTEE**
  **WRITTEN OPINION AND DETERMINATION**

  **Case Reference:** ESC-2023-042
  **Programme:** [Flagship Ideas & Science Programme]
  **Date:** [Current Date]
  **Subject:** Sufficiency of On-Air Apology

  **1. DECISION**
  The Committee **UPHOLDS IN PART** the complaint.

  We find that the statement broadcast on [Date] constituted an acknowledgement of complaint but failed to meet the Code's requirement for an "apology." The broadcaster is ordered to publish a further statement meeting the criteria set out in Section 4 of this opinion within 14 days.

  **2. BACKGROUND**
  The Programme broadcast a segment concerning a contested clinical claim. The presenter identified the Complainant, a researcher, characterizing her work as "discredited" and her role as that of a "campaigner rather than a scientist," without engaging with her published work.

  Following a threatened defamation action, the broadcaster settled. The settlement is confidential; counsel advised that any on-air statement must concede neither falsity nor fault. Consequently, the following script aired: *"There have been claims that our reporting on this was wrong. Mistakes were made, and I'm sorry for the upset this has caused. We'll do better."*

  The Complainant contends this is not an apology. The broadcaster contends it satisfies the Code and that further wording would breach the legal settlement and compel insincerity.

  **3. THE CODE AND THE TEST FOR APOLOGY**
  The Code requires that where a complaint is upheld, the broadcaster "publish an apology." The Code does not define "apology." Precedent establishes that a correction must identify the specific statement, state the accurate position, and reach the original audience. Precedent further states an apology must be directed to the person wronged and be *capable* of being received by her.

  To resolve the current impasse, the Committee adopts the following test for a Code-compliant apology. An apology must be **Remedial**, though it need not be **Expressive**.

  *   **Remedial Function:** The statement must act to repair the record and restore the standing of the wronged party. It must identify the specific harm caused (e.g., damage to professional reputation) and take reasonable steps to negate that harm before the original audience.
  *   **Expressive Function:** The statement need not convey the speaker's internal state of remorse, regret, or sorrow.

  The Chair has proposed this distinction to reconcile the Code's demand for accountability with the reality that internal feelings cannot be adjudicated or compelled. The Committee accepts this distinction. The Code governs editorial conduct and public accountability, not the private conscience of the presenter. Therefore, a statement can satisfy the Code if it effects the *repair* required, even if the speaker does not personally *feel* the remorse typically associated with the word "sorry."

  **4. APPLICATION TO THE BROADCAST STATEMENT**
  Applying this test to the aired statement (*"There have been claims... Mistakes were made... sorry for the upset"*):

  1.  **Directed:** It was broadcast on the same platform, satisfying the audience requirement.
  2.  **Expressive:** It uses the word "sorry," which nominally satisfies the expressive form, though the Committee notes that sincerity is not our metric.
  3.  **Remedial:** It fails. The statement is vague. It refers to "claims" and "upset" without acknowledging the specific harm done to the Complainant's professional standing. By failing to distinguish between "upset" (emotional) and "reputational damage" (professional), and by failing to address the specific characterization of the Complainant as a "campaigner rather than a scientist," the statement does not restore her standing. It leaves the original implication—that her work is discredited and she is not a scientist—uncorrected in the public record.

  Therefore, while the statement was an acknowledgement, it was not a Code-compliant apology.

  **5. ADDRESSING OBJECTIONS**
  The Committee anticipates two primary objections to this determination and the order for a further statement.

  **A. Compelled Insincerity**
  The broadcaster argues that ordering an apology forces the presenter to utter words they do not mean, rendering the apology hollow.
  *Committee View:* This objection relies on the "Expressive" definition of apology, which we have rejected for Code purposes. We are not compelling a feeling; we are compelling a remedy. Just as we can compel a correction of fact without requiring the presenter to believe they were mistaken, we can compel a restoration of standing without requiring the presenter to feel remorse. The integrity of the apology lies in the *act* of repair, not the *sentiment* of the speaker.

  **B. Uptake and Refusal**
  It is argued that the Complainant has already indicated the current statement is unacceptable, suggesting further attempts are futile.
  *Committee View:* The Code requires that an apology be *capable* of being received, not that it *must* be accepted. The Complainant's refusal to accept the current vague statement does not absolve the broadcaster of the duty to offer a sufficient one. The broadcaster must provide the *opportunity* for uptake by making a statement that a reasonable person in the Complainant's position could accept as restorative.

  **C. Legal Settlement Constraints**
  The broadcaster notes that a specific apology may breach the confidential settlement which precludes admitting falsity or fault.
  *Committee View:* The Code applies to the broadcaster's public editorial obligations. Private legal settlements cannot override public accountability standards. However, the Committee notes that the **Remedial** test does not necessarily require an admission of legal fault. It is possible to restore a subject's standing (e.g., by reaffirming their credentials or the validity of their participation in scientific discourse) without explicitly conceding legal liability for the prior broadcast. The broadcaster's legal counsel must draft the statement to satisfy both the settlement and this Order, but the Code requirement remains paramount.

  **6. ORDER AND REMEDY**
  The broadcaster is ordered to broadcast a further statement. To comply with the Code's **Remedial** test, the statement must:

  1.  **Identify the Harm:** Explicitly reference the prior characterization of the Complainant (i.e., the distinction between "scientist" and "campaigner").
  2.  **Restore Standing:** Affirm the Complainant's professional status or the legitimacy of her work to the extent necessary to neutralize the original harm.
  3.  **Reach:** Be broadcast in the same slot and programme as the original segment.

  The statement need not use the word "sorry," nor must it admit legal falsity, provided it satisfies the remedial criteria above.

  **Deadline:** The statement must be broadcast within 14 days of this opinion. A transcript must be provided to the Committee and the Complainant 24 hours prior to broadcast.

  **7. CONCLUSION**
  The purpose of the Code is to maintain trust in public broadcasting. Trust is eroded not only by errors but by the failure to adequately repair the harm those errors cause. A vague expression of regret for "upset" protects the broadcaster's legal position but sacrifices the Complainant's reputation. By distinguishing between the remedial act and the expressive sentiment, we ensure the Code remains enforceable even in complex legal contexts, without demanding the impossible policing of a presenter's sincerity.

  **[Signature]**
  **Drafting Member, Editorial Standards Committee**
