      *   The prompt asks to explain *why* KSS is blind to the shape. I need to explicitly mention that KSS only looks at the *Ideal Point* and the *Disagreement Point*. The rest of the curve is irrelevant as long as the intersection remains feasible.

  8.  **Structure of the Output:**
      *   Introduction: The two philosophies.
      *   Nash: The Local Trade-off (Tangent Hyperbola).
      *   Kalai-Smorodinsky: The Global Aspiration (Ray to Utopia).
