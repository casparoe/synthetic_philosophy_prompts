      *(Self-Correction during drafting the ending)*: Make sure the ending isn't "they agreed to disagree." It needs to be "Here is the exact philosophical knot we cannot untie." The knot is: Does uncertainty mandate full protection (PPA) or discounted protection (GCS)?

