answer: |-
  # Shared Asset Review Procedure (SARP)

  **Purpose:** To classify shared resource proposals and route them to the correct governance mechanism without relying on intuition.
  **Users:** Program Officers.
  **Time:** 15 minutes per proposal.

  **Step 1: Define the Unit.**
  *   **Question:** What is the specific thing being used, and what counts as one "unit" of use?
  *   **Sufficient Answer:** A physical item (e.g., a car), a space (e.g., a plot), or a digital file (e.g., a dataset).
  *   **If No:** Return proposal to submitter to define scope.
  *   **If Yes:** Proceed to Step 2.

  **Step 2: Diagnose Use Dynamics (Axis 1).**
  *   **Question:** Does one person's use remove the unit for others (Subtractability), or does it just make it worse for others (Congestion)?
  *   **Sufficient Answer:** "Subtractable" (like picking a vegetable) or "Congestible" (like walking on a path).
  *   **If No:** (Unclear) Classify as Congestible by default to be safe.
  *   **If Yes:** Record diagnosis. Proceed to Step 3.
  *   **Judgment Call:** False.

  **Step 3: Diagnose Cost Flows (Axis 2).**
  *   **Question:** Who pays to build/maintain the resource (Provision), and who suffers when someone uses it (Appropriation)?
  *   **Sufficient Answer:** Identify the payer (e.g., City, Users) and the sufferer (e.g., Other Users, Public).
  *   **If No:** (Costs are unknown) Stop. Request budget breakdown.
  *   **If Yes:** Record diagnosis. Proceed to Step 4.
  *   **Judgment Call:** False.

  **Step 4: Diagnose Production Function (Axis 3).**
  *   **Question:** How do contributions add up to total value? Is it the sum of all parts, limited by the worst part (Weakest Link), dependent on one big win (Best Shot), or weighted by user type?
  *   **Sufficient Answer:** "Summation," "Weakest Link," "Best Shot," or "Weighted."
  *   **If No:** (Unclear) Assume "Summation."
  *   **If Yes:** Record diagnosis. Proceed to Step 5.
  *   **Judgment Call:** True. (Officers often confuse Weakest Link with Summation).

  **Step 5: Diagnose Scale (Axis 4).**
  *   **Question:** Do the users, the resource, and the manager all sit within the same boundary (Neighborhood, City, Region)?
  *   **Sufficient Answer:** "Matched" (all same) or "Mismatched" (e.g., City resource, Regional users).
  *   **If No:** (Mismatched) Flag for Polycentric Governance.
  *   **If Yes:** Proceed to Step 6.
  *   **Judgment Call:** False.

  **Step 6: Check Excludability.**
  *   **Question:** Can we technically and legally prevent people from using this without paying or joining?
  *   **Sufficient Answer:** "Yes" (Gate, Login) or "No" (Open street, Air).
  *   **If No:** Rule out Fees or Club Goods. Proceed to Step 7.
  *   **If Yes:** Fees and Club Goods are options. Proceed to Step 7.
  *   **Judgment Call:** False.

  **Step 7: Match Governance.**
  *   **Question:** Does the diagnosis match the proposed governance?
      *   *Subtractable + Excludable* → Private/Club Good (Contract/Lease).
      *   *Congestible + Non-Excludable* → Public Good (Regulation/Tax).
      *   *Weakest Link* → Mandate (Cannot be voluntary).
      *   *Mismatched Nestedness* → Polycentric Body (Joint Powers).
  *   **Sufficient Answer:** "Match" or "Mismatch."
  *   **If No:** (Mismatch) Reject Proposal or Require Restructuring.
  *   **If Yes:** Proceed to Step 8.
  *   **Judgment Call:** False.

  **Step 8: Screen for Value Conflicts.**
  *   **Question:** Does solving the technical problem require choosing between two groups of people where one loses access entirely?
  *   **Sufficient Answer:** "Yes" (Distributional Conflict) or "No" (Pure Efficiency).
  *   **If No:** Proceed to Step 9.
  *   **If Yes:** **Stop.** This is a value judgment, not a technical fix. Escalate to City Council.
  *   **Judgment Call:** True. (Determining "loss of access" is subjective).

  **Step 9: Final Recommendation.**
  *   **Question:** Is the proposal technically sound and free of unresolved value conflicts?
  *   **Sufficient Answer:** "Approve," "Reject," or "Escalate."
  *   **If No:** (Uncertain) Assign confidence level and list evidence needed.
