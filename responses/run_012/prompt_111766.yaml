  # Case Applications

  ### Case 1: Community Garden (Vacant Lot)
  **Resource Diagnosis:**
  *   **Subtractability/Congestion:** Subtractable (plots are assigned) and Congestible (paths/tools).
  *   **Externalities:** Provision (City pays water/insurance, Group maintains). Appropriation (Current informal users lose access).
  *   **Aggregation:** Summation (individual plots add to total garden).
  *   **Nestedness:** Mismatched (City owns, Neighborhood manages, Homeless/Regional users displaced).

  **Procedure Run:**
  Steps 1-7 pass. The proposal fits a "Club Good" model (Excludable, Subtractable). However, Step 8 triggers. Converting an open lot used by unhoused residents and dog walkers into a locked garden explicitly removes access from a specific group to benefit another. This is not an efficiency calculation; it is a distributional choice.

  **Recommendation:** **Escalate to City Council.**
  **Confidence:** 0.95
  **Would Change If:** The group provides a formal agreement to reserve 20% of plots for transitional housing partners, mitigating the exclusion externality.
  **Asker May Dislike:** Yes. Economists prefer clear property rights and efficiency. This procedure flags equity as a veto point, forcing a political decision on a technically efficient asset conversion.

  ### Case 2: Open Data Portal
  **Resource Diagnosis:**
  *   **Subtractability/Congestion:** Non-subtractable, Non-congestible (Digital).
  *   **Externalities:** Provision (Departments bear cost of cleaning data). Appropriation (None).
  *   **Aggregation:** Weakest Link (Value depends on the largest department participating).
  *   **Nestedness:** Matched (Citywide).

  **Procedure Run:**
  Step 4 identifies "Weakest Link." Step 7 compares this to the proposal's "Voluntary" governance. A Weakest Link good cannot be voluntary; if one major department opts out, the marginal value of the others drops near zero. The proposal fails the Governance Match.

  **Recommendation:** **Reject Proposal as Written.** Require a mandate or central budget to cover department costs.
  **Confidence:** 0.90
  **Would Change If:** Evidence shows the top three departments have already committed verbally, reducing the "Weakest Link" risk to negligible levels.
  **Asker May Dislike:** No. This aligns with standard institutional economics.

  ### Case 3: Downtown Plaza Fee
  **Resource Diagnosis:**
  *   **Subtractability/Congestion:** Congestible (at lunch), Non-subtractable.
  *   **Externalities:** Provision (City maintains). Appropriation (Crowding reduces enjoyment).
  *   **Aggregation:** Best Shot/Weighted (Plaza value relies on critical mass of diverse users for safety and vibrancy).
  *   **Nestedness:** Matched (City).

  **Procedure Run:**
  Step 2 identifies Congestion. Step 6 confirms Excludability is possible (gates/tickets). Step 4 identifies Aggregation as "Weighted/Best Shot" regarding vitality. Step 7 matches Congestion + Excludable to "Fee." However, Step 4's diagnosis suggests that reducing user count via fees might drop the plaza below the critical mass needed for safety (the "Best Shot" threshold). While Step 7 suggests a fee, the Aggregation Technology warns that volume *is* the value.

  **Recommendation:** **Approve Fee.**
  **Confidence:** 0.75
  **Would Change If:** Data shows plaza safety incidents correlate directly with density above a specific threshold, confirming congestion is the primary risk rather than low volume.
  **Asker May Dislike:** No. This supports congestion pricing.

