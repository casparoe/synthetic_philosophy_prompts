answer: |-
  The walled garden was a rectangle of stubborn green set into the grey stone of the Yorkshire moors. For forty years, Ruth had kept the walls intact, and for forty years, she had kept the soil sweet. Ten years ago, Miriam had stopped coming. Ten years ago, the second chair on the terrace had stopped creaking.

  Ruth did not remove the chair. She dusted it.

  Daniel arrived on a Tuesday, carrying a suitcase that looked too new for the train he had taken. He was twenty-six, studying economics at a university that prized efficiency above most other virtues. He loved his aunt, but he loved clarity more. He watched her from the kitchen window as he washed a mug.

  Ruth was kneeling by the border of foxgloves. Her hands, knotted with arthritis, worked the trowel with a rhythmic precision.

  "The light is catching the delphiniums today, Miriam," she said to the empty air. "Just like that year we tried to grow them in the shade. You were right, obviously. I hate admitting it, but you were right."

  She paused, tilting her head as if waiting for a chuckle. Then she moved to the next plant.

  Daniel dried his hands and went out the back door. The air was cool, smelling of damp earth and crushed mint. "Aunt Ruth?"

  She didn't jump. She rarely did. "Daniel. The kettle's just boiled."

  "I was listening," he said, stepping onto the flagstones. He tried to keep his voice light, but the tension was there, a tightness in his shoulders he couldn't shake. "You talk to her a lot."

  "Every day. Someone has to tell her about the aphids."

  Daniel crouched, ruining the crease of his trousers. "She can't hear you, though. It's... it's a lot of energy to expend on a null set. Miriam isn't here. The garden is beautiful, I get that. But beauty requires a viewer to have value. If you're doing this for her, you're broadcasting to a dead channel."

  Ruth snipped a deadhead. "The bees hear me."

  "You know what I mean."

  "I do," she said. She stood up, wiping her hands on her apron. "But you're thinking about value like it's a transaction. Input, output. Profit."

  "I'm thinking about utility," Daniel corrected gently. "If this brings you peace, that's utility. But if you're doing it out of obligation to someone who can't experience the result, isn't that a waste? Suppose the garden was on an island with no people. Would it matter if it was weeds or roses?"

  "Come back in five years," Ruth said. "Ask the soil."

  She turned her back on him and began to water the base of a silver birch that grew in the far corner, its white bark peeling like paper. It was the centerpiece of the garden, the tree they had argued over most fiercely. Miriam had wanted an oak; Ruth had wanted the birch for the light it filtered. They had compromised on the birch, but planted it in the spot Miriam had chosen for the oak.

  The storm came on Thursday night. It was a sudden, violent thing, the wind howling down the dale like a train. Daniel slept fitfully, waking to the sound of something heavy cracking.

  In the morning, the silver birch had split. A major limb, thick as a man's thigh, lay across the terrace, crushing a pot of geraniums. The remaining tree looked wounded, jagged against the grey sky.

  Ruth stood over the broken wood in her raincoat. Daniel came out with a coffee, looking at the damage with a calculator's eye.

  "Insurance will cover the pot," he said. "We can get a chainsaw, cut the rest down. It's a hazard. It's dead weight now."

  Ruth touched the white bark. "It's not dead. Just hurt."

  "It's structurally compromised, Ruth. It's irrational to keep it. It serves no purpose. Miriam isn't sitting on that terrace to enjoy the shade. You're seventy-eight. You shouldn't be climbing ladders to prune a damaged tree. The beauty it provides is negligible compared to the risk."

  This was the isolation test, though neither named it. Daniel was stripping the tree of its context. He was asking: Without Miriam to sit beneath it, without Ruth to see the light filter through, is the tree still good? Is the effort to save it good?

  "I need the saw," Ruth said.

  "I'll call a landscaper."

  "No. You'll call a landscaper, and they'll take the whole thing. They'll optimize it. They'll make it safe and empty." She looked at him, her eyes bright and hard. "Help me."

  Daniel hesitated. In his mind, the equation was clear: Cost of labor + Risk of injury > Value of a damaged tree viewed by a dead woman. But he took the saw from the shed.

  They worked for an hour. The noise was aggressive, tearing the silence of the morning. When the broken limb was cleared, the garden looked scarred. The light hit the terrace differently now, harsh and unfiltered.

  Daniel leaned on the saw, breathing hard. "See? It's done. It's safe. But look at it. It's ugly now. And no one is going to miss the way it was except you. And soon, not even you."

  Ruth walked to the terrace wall. She ran her hand over the rough stone. "Miriam knew I would try to keep it."

  "So?"

  "So, she knew I would fail, too." Ruth sat on the bench, the one that faced the birch. "We weren't just looking at plants, Daniel. That's what you don't see. You think the value is in the flower. Or the pleasure of looking at the flower."

  "Isn't it?"

  "No. The value was in the arguing." Ruth patted the space beside her. Daniel sat. "When we designed this, forty years ago, we were both stubborn. I wanted order. She wanted wildness. This tree... we spent three days debating the species. We didn't speak for a week after we planted it. I was furious she'd talked me into this spot."

  Ruth picked a shard of bark from her cardigan. "She came back the next week with a trowel and didn't say a word. Just started digging around the base. She knew I was too proud to apologize, and she was too proud to ask for one. So she just tended the thing we fought over."

  Daniel looked at the jagged stump. "That's a nice memory. But memories are internal. They don't require you to break your back over a tree."

  "If I stop tending it," Ruth said, "then the argument ends. If the argument ends, then she was just a visitor. If I keep tending it, she's a participant."

  Daniel frowned. He was trying to find the variable he was missing. "But she doesn't know you're doing it. There's no feedback loop. You're pouring energy into a void."

  "Is the music less real if no one is in the hall to hear it?"

  "That's a cliché, Ruth. Sound waves need an ear to become music."

  "Maybe," she said. "Or maybe the music is the intention of the player."

  She stood up and walked to the crushed geraniums. She began to salvage the pots, stacking the broken terracotta. "You asked if a beautiful world with no one to see it is better than an ugly one. You think the answer is no, because value is a human currency."

  "I think value is tied to consciousness," Daniel said. "Without consciousness, it's just matter."

  Ruth stopped. She held a broken pot in both hands. "Miriam is gone. But the garden knows her. The soil has her compost in it. The roots are where she stepped. If I let it go to weed, I am saying that her footprint doesn't matter. I am saying that the world resets when we die."

  She dropped the shards into a bucket. "I am not doing this for her pleasure, Daniel. She feels nothing. I am doing this because the world should not reset. There is a continuity that is valuable in itself. Even if it's just me and the worms."

  Daniel looked at the garden. He saw the foxgloves nodding in the breeze. He saw the harsh light on the terrace. He saw the effort it took to keep the moss from the paths. He tried to apply his isolation test. He imagined the garden exactly as it was, but with Ruth dead, and Miriam long gone. A locked gate. Vines taking the walls.

  Would that world be worse?

  He couldn't answer. If he said yes, he admitted that value existed outside of human experience. If he said no, he admitted that his aunt's life's work was merely a coping mechanism, a delusion to ward off the silence.

  "Help me plant the replacement," Ruth said. "Not a geranium. Something hardy."

  "What do you suggest?"

  "Yew. She hated yew. Said it was too funereal."

  Daniel stood up. "So you're planting it to spite her?"

  "I'm planting it because I'm still here to argue with her."

  They dug the hole together. The soil was dark, rich with decades of decay and renewal. Daniel felt the weight of the spade, the resistance of the roots. He realized that for forty years, this patch of earth had been a conversation. To stop talking would be to admit the conversation was over. To keep talking, even into the silence, was to assert that the silence wasn't the end of the story.

  He placed the small yew sapling into the earth. It looked insignificant against the scarred birch.

  "It won't bloom," Daniel said. "It's evergreen. It's just... there."

  "It's loyal," Ruth said. "It stays."

  They packed the earth down. Daniel's hands were dirty, his trousers stained. He felt a strange exhaustion, not from the labor, but from the weight of the implication. If Ruth was right, then value was not a resource to be consumed or a pleasure to be maximized. It was a structure to be maintained. It was a debt owed to the past that didn't expect repayment.

  That evening, Daniel packed his bag. He would leave early the next morning. He found Ruth in the kitchen, drinking tea.

  "I'm sorry I called it irrational," he said.

  "It is irrational," Ruth replied. "By your lights. By the lights of the market."

  "Are you going to keep talking to her?"

  "As long as the garden stands."

  Daniel nodded. He looked out the window. The moon was rising over the wall. The garden was invisible in the dark, just a shape of deeper black against the night sky. There was no one to see it. Miriam was not seeing it. Ruth would soon be asleep. The beauty of the layout, the curve of the path, the placement of the yew—it was all hidden.

  He thought about the isolation test again. Imagine that garden, moonlit, with no human eye to catch the silver on the leaves. Is it better than a parking lot?

  He didn't know. But he knew that if he walked out there now and trampled the bed they had just planted, he would feel a violation. Not because Ruth would be angry, but because the thing itself would be diminished.

  "I'll come back," Daniel said. "In the summer."

  "The delphiniums will be up," Ruth said. "I'll tell her you're coming."

  "Tell her I said hello."

  Ruth smiled, a small, private thing. "She knows."

  Daniel went to his room. He left the light off. He lay in the dark and listened to the house settle. He thought about the yew tree growing in the dark, putting down roots in soil that remembered a woman who no longer existed. He thought about the effort required to keep a thing beautiful when there was no audience to applaud it.

  He wondered if the value was in the keeping, or in the thing kept. He wondered if the distinction mattered.

  Outside, the wind picked up again, rustling the leaves of the scarred birch. It made a sound like paper being turned, like a page in a book that no one was reading, but that was being read nonetheless. Daniel closed his eyes, and for the first time, he did not try to solve for the variable. He just listened to the garden breathing in the dark, waiting for a morning that would come whether anyone saw it or not.
