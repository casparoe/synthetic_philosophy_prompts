answer: |-
  **SYLLABUS**
  Under the Statute of Rational Conduct, fiduciary duty does not shield an agent from losses incurred through intransitive preference orderings; immunity to money pumps constitutes the legal standard of competence.

  **HOLLOWAY v. MERIDIAN TRUST**
  **Court of Appeals for the District of Coherence**
  **Opinion of the Court**

  1. The appellant, Holloway, holds cyclic preferences over three assets: he prefers A to B, B to C, and C to A. The appellee, Meridian Trust, executed trades moving Holloway around this cycle, charging a disclosed fee per transaction. Holloway returned to his starting position several thousand dollars lighter. He sues for breach of fiduciary duty. We hold for the broker.

  2. It is settled doctrine that rationality consists in immunity to being pumped. *Vennish v. Market-Maker*, 42 Com. Law 309. An agent whose preferences admit a cycle invites extraction. The law does not pity the geometry of the agent's own valuations. To grant relief here would be to subsidize inconsistency.

  3. Regarding the economics of the pump: it is the per-trade cost that converts a cycle into a loss; an agent who can cycle at no cost loses nothing. We acknowledge this mechanism explicitly. However, fees are lawful consideration for liquidity. The loss arises not from the trade's intrinsic value but from the agent's inconsistency monetized by the market structure.

  4. Holloway argues naivety; he did not see the whole sequence in advance, and had he foreseen it he could have refused the first trade. We use this to locate the defect in the plaintiff's foresight rather than in the broker's conduct. Meridian disclosed every fee. The failure to project the cycle is a failure of rational anticipation, not fiduciary concealment. A competent agent must compute the closure of his own choices.

  5. Plaintiff's expert testifies that an agent who adopts a plan and holds to it cannot be led round a cycle, since at every node he declines to depart from the plan. We reply that the law assesses each transaction as it is made, and has no unit of account for a plan. A fiduciary duty attaches to the immediate exchange, not to a hypothetical trajectory of restraint. The law cannot enforce a resolve that the agent did not maintain at the node of decision.

  6. The expert adds that an agent who ranks whole trajectories rather than single options has no cycle to be led round. We reply that preferences are taken as the law finds them, option by option. The court does not reconstruct the agent's mind to save him from himself. To recognize extended preferences would be to allow agents to legislate their own immunity from coherence requirements.

  7. The expert's strongest point concerns the gap between acyclicity and expected-utility representation: at most the pump shows strict preference must be acyclic, and establishes nothing about completeness, the sure-thing principle, or the existence of a utility function. We concede the point in a single sentence and then hold that the distinction is finer than the law requires, the law's standard being the pump and nothing else. Administrative clarity demands a bright line against loss cycles.

  8. We note that a different disorder, incompleteness, would need further premises before it yielded a pump, and we decline to decide whether the statute reaches it. Intransitivity is sufficient for judgment here. The statute targets the leakage of value, not the silence of valuation.

  9. In evidence, Holloway described a device which increased a discomfort in increments too small to be noticed, each increment judged worth its price, the sequence ending in agony. We treat this as the same disorder under another name. The self-torturer is merely a pump applied to sensation rather than assets. Both suffer from the inability to recognize the sum of locally rational steps as a global catastrophe.

  10. Judgment is entered for Meridian Trust. The plaintiff's remedy lies in having his preferences completed, at his own expense. He shall retain a qualified actuary to impose transitivity upon his ordering within thirty days.

  **SO ORDERED.**
