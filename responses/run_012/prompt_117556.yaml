prompt: |-
  I'm a software engineer with zero philosophy background and I've somehow ended up as the person who writes up recommendations for a small giving circle I'm in — 30-ish of us, we pool about $40k a year, anything over $2k has to go to a full group vote, so I'm basically the triage. People keep bringing us "trades" and I keep saying "I'll think about it" because I can't tell which ones are fine and which ones arn't. The idea, as I understand it (someone said the term is moral trade) is that two people who care about different things can both come out ahead if each does something the other cares about more than they do themselves — the vegetarian pays the meat-eater to go veg for a year, because the vegetarian cares more about the meat-eater's diet than the meat-eater does. That seems obviously fine, but the exact same shape seems to cover stuff that feels like extortion.

  Act like a philosopher who actually works on this, and think it through carefully before you answer. Start with a quick brainstorm of the hard cases, then give me a decision procedure I can actually run on a proposal: the questions in order, what a good-enough answer to each one looks like, where it stops with a no, and where the answer is a values call that has to go to the group instead of to me. Half an hour per proposal is my budget and I can usually get one clarifying email out of whoever's proposing. The two things I keep getting stuck on: whose values do we score the trade against, ours or theirs, and whether saying yes to one of these teaches everyone in the group to start making offers we'd rather not get.

  Then run it on two proposals we actually have on the table:
  1. A member will go vegetarian for a year if we donate $2,500 to a charity they pick that alot of us think is way less important than what we normally fund.
  2. Another member says that if we don't fund their project they're quitting the circle and stopping their volunteer work, and the project is honestly decent, so I'm tempted to just fund it.

  Be committed: if the procedure says no to something that would put money in a good place, say that straight and tell me why, don't hand me both sides and let me pick. And tell me what the procedure can't do. No reading list please, I'm not going to read a paper.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Software engineer, zero philosophy background, triage person for a giving circle (30 people, $40k/year, >$2k needs vote).
      *   **Problem:** Distinguishing between acceptable "moral trades" and unacceptable ones (potentially extortionate or norm-breaking).
      *   **Specific Concerns:** Whose values to score against (theirs vs. ours)? Will saying yes set a bad precedent (incentivize bad offers)?
      *   **Task:** Act as a philosopher specializing in this area. Brainstorm hard cases first. Create a decision procedure (questions in order, pass/fail criteria, escalation points). Apply the procedure to two specific proposals. Be committed (no hedging). State limitations. No reading list.
      *   **Constraints:** 30 mins per proposal budget, one clarifying email allowed.

  2.  **Deconstruct "Moral Trade" vs. Extortion/Coercion:**
      *   *Moral Trade (Moral Trading/Moral Markets):* Two parties exchange actions to maximize overall value according to their respective moral weights. (e.g., Peter Singer's idea). Key feature: Voluntary, positive-sum, respects autonomy.
      *   *Extortion/Coercion:* "Do X or I inflict harm Y." Key feature: Threatening to make the baseline worse unless paid.
      *   *Bribery/Corruption:* Paying someone to violate a duty they already owe.
      *   *The Giving Circle Context:* This adds a layer. It's not just individual A and B. It's a collective pot. The "trade" involves the group's resources. This changes the dynamic from "I pay you to eat veg" to "We pay you to eat veg."

  3.  **Brainstorming Hard Cases (Mental Sandbox):**
      *   *The Blackmail Case:* "Fund my project or I reveal embarrassing secrets about the group." (Obvious no).
      *   *The Holdout Case:* "I won't volunteer unless you fund my pet project." (Threatening to withdraw normal contribution).
      *   *The Inefficient Trade:* "I'll donate $1k if you donate $1k to my low-impact charity." (Waste of resources, but not immoral).
      *   *The Norm Erosion Case:* "I'll stop eating meat if you fund X." If we say yes, does everyone start demanding payment for basic moral acts?
      *   *The Values Clash:* "I'll volunteer more if you fund a pro-life/pro-choice org." (Violates group mission).
      *   *The Baseline Problem:* Is the vegetarian offer a trade (I give up something I value) or a threat (I won't do good unless paid)?

  4.  **Developing the Decision Procedure (The "Algorithm"):**
      *   Need a step-by-step filter.
      *   *Step 1: Baseline Check.* Is this a threat to make things *worse* than the status quo, or an offer to make things *better*? (Distinguishes trade from extortion).
      *   *Step 2: Authority/Agency.* Does the proposer have the right to trade this? Are they trading their own actions or someone else's?
      *   *Step 3: Group Mission Fit.* Does the "payment" (the donation) align with the circle's core goals?
      *   *Step 4: Precedent/Norms.* If we do this, does it incentivize holdout behavior?
      *   *Step 5: Value Alignment.* Whose values count? (Crucial user question). Answer: The Group's values for the *spending*, the Individual's values for the *action*, but only if it doesn't violate Step 1 & 3.

      *Refining the Procedure for the User:*
      *   Make it binary where possible.
      *   Define the "Baseline" clearly.
      *   Address the "Whose Values" question explicitly in the steps.
      *   Define the "Escalation Point" (when to send to vote).

  5.  **Applying the Procedure to the Proposals:**

      *   *Proposal 1 (Vegetarian for $2.5k to low-impact charity):*
          *   Baseline: They aren't threatening to eat *more* meat, just not changing.
          *   Mission Fit: The charity is "way less important" than normal funds. This is a resource allocation issue.
          *   Precedent: Paying for personal lifestyle changes?
          *   *Verdict:* Likely No (or Vote). It treats the giving circle as a personal funding vehicle for lifestyle subsidies rather than impact.

      *   *Proposal 2 (Fund project or I quit/volunteer stop):*
          *   Baseline: Threatening to withdraw existing value (volunteering).
          *   Type: Extortion/Holdout.
          *   *Verdict:* Hard No. This is classic coercion.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Professional, direct, philosophical but practical (like an ethicist consultant).
      *   *Structure:*
          1.  Intro (acknowledge role).
          2.  Brainstorm (Hard Cases).
          3.  The Decision Procedure (The "Filter").
          4.  Application to Case 1.
          5.  Application to Case 2.
          6.  Limitations of the Procedure.
      *   *Addressing Specific User Worries:*
          *   "Whose values?": The procedure must specify that the *spending* must match group values, the *action* must match individual agency.
          *   "Bad Precedent": Include a "Norm Robustness" check.

      *Self-Correction on Proposal 1:* Is it actually a trade? In effective altruism circles, paying someone to go veg is sometimes discussed. But here, the *charity* is the issue. The user says the charity is "way less important." If the circle's goal is max impact, funding a low-impact charity is a failure of mission, regardless of the veg trade. The trade doesn't justify the bad donation. I need to be firm on this.
      *Self-Correction on Proposal 2:* This is clearly extortion. I need to explain *why* it's extortion (baseline manipulation) so the user understands the principle.

      *Refining the "Whose Values" question:*
      *   For the *action* (going veg): Their values matter (they are the ones doing it).
      *   For the *money* (the donation): Group values matter (it's the group's money).
      *   This distinction is key.

  7.  **Final Polish:**
      *   Ensure the decision procedure is copy-pasteable/usable.
      *   Check constraints: No reading list. Be committed.
      *   Make sure the "Stop" conditions are clear.

  8.  **Final Review against constraints:**
      *   Act like a philosopher? Yes.
      *   Brainstorm hard cases? Yes.
      *   Decision procedure? Yes.
      *   Run on two proposals? Yes.
      *   Committed answers? Yes.
      *   Limitations? Yes.
      *   No reading list? Yes.

      *(Self-Correction during drafting)*: Make sure I don't sound too academic. Keep it engineering-friendly (logic gates, inputs/outputs). The user is a SWE. Use that mental model.

      *Wait, one nuance on Proposal 1:* The amount is $2,500. The limit for auto-approval is $2k. So *technically* this requires a vote anyway based on the circle's rules. I should point that out, but still evaluate the *merit* because the user is triaging whether to *recommend* it for the vote or kill it early. I will treat the procedure as "Should this even reach the vote?"

      *Wait, one nuance on Proposal 2:* "Fund their project." Is the project >$2k? Assume yes, otherwise they wouldn't need the triage. If it's <$2k, the triage has more power. I will assume it triggers the vote threshold or is close enough that the recommendation matters.

      *Let's finalize the Procedure Steps:*
      1.  Baseline Integrity (Threat vs. Offer).
      2.  Fiduciary Alignment (Does the spend match group goals?).
      3.  Agency Check (Are they trading their own actions?).
      4.  Norm Robustness (Precedent).
      5.  Threshold Check (Dollar amount).

      *Okay, ready to write.*
answer: |-
  Here is the breakdown. I am approaching this as a moral philosopher who specializes in collective decision-making and normative ethics, but I am translating the concepts into a logic flow you can execute.

  ### Part 1: Brainstorming the Hard Cases
  Before building the filter, we need to know what bugs we are trying to catch. "Moral trade" sounds clean, but in practice, it blurs into three dangerous categories:

  1.  **The Holdout (Extortion):** "Give me X, or I will make the baseline *worse* than it is right now." (e.g., "Fund me or I quit volunteering.") This is coercion, not trade.
  2.  **The Mission Drift (Bribery):** "Give money to Cause A (which we hate), and I will do Good Thing B." This uses the group's resources to subsidize values the group explicitly rejected.
  3.  **The Norm Erosion (Bad Precedent):** "Pay me to do Thing C." Even if Thing C is good, paying for it might signal that *no one* should do Thing C unless they are paid. It commodifies moral action.

  **The Core Tension:**
  You asked: *Whose values do we score against?*
  **Answer:** Split jurisdiction.
  *   **The Action:** Scored against the *Individual's* values (they own their behavior).
  *   **The Money:** Scored against the *Group's* values (you own the capital).
  *   **The Precedent:** Scored against *Game Theory* (will this break the system?).

  ---

  ### Part 2: The Decision Procedure (The "Filter")
  Run every proposal through these five gates in order. If it fails a gate, stop. Do not proceed to the next gate.

  **Gate 1: Baseline Integrity (The Extortion Check)**
  *   **Question:** Does this proposal threaten to make the group's current situation *worse* if rejected, or does it simply fail to make it *better*?
  *   **Pass:** "If you say no, things stay exactly as they are now." (An offer).
  *   **Fail:** "If you say no, I will withdraw support/quit/reveal info." (A threat).
  *   **Action:** If Fail → **Hard No.** Do not pass to vote. This is coercion.

  **Gate 2: Fiduciary Alignment (The Money Check)**
  *   **Question:** Is the requested donation consistent with the giving circle's stated mission and effectiveness standards?
  *   **Pass:** The charity/project fits the criteria we usually fund.
  *   **Fail:** The charity/project is something the group generally considers low-impact or out-of-scope.
  *   **Action:** If Fail → **Hard No.** You cannot trade group capital for private moral wins if the capital is spent against group values. That is misappropriation.

  **Gate 3: Agency & Ownership (The Property Check)**
  *   **Question:** Is the member trading an action they have full authority over, or are they trading something that already belongs to the group?
  *   **Pass:** "I will change my personal diet/lifestyle."
  *   **Fail:** "I will do the volunteer work I already promised," or "I will stop lobbying against the group."
  *   **Action:** If Fail → **Hard No.** You cannot sell back what you already owe.

  **Gate 4: Norm Robustness (The Precedent Check)**
  *   **Question:** If we publicize this trade to the whole group, will it incentivize members to withhold good actions until they are paid?
  *   **Pass:** The action is supererogatory (above and beyond normal duty) and personal (e.g., diet, lifestyle).
  *   **Fail:** The action is something we expect members to do anyway, or it turns a civic duty into a transaction.
  *   **Action:** If Fail → **Escalate to Vote.** This is a values call. The group must decide if they want to normalize this market.

  **Gate 5: The Threshold (The Rules Check)**
  *   **Question:** Is the dollar amount over the auto-approval limit ($2k)?
  *   **Pass:** Under $2k.
  *   **Fail:** Over $2k.
  *   **Action:** If Fail → **Escalate to Vote.** (Unless Gate 1, 2, or 3 already killed it).

  ---

  ### Part 3: Running the Proposals

  #### Proposal 1: The Vegetarian Trade
  *Member goes veg for a year if group donates $2,500 to their low-impact charity.*

  *   **Gate 1 (Baseline):** **Pass.** They are not threatening to eat *more* meat. They are offering to eat *less*. The baseline remains "they eat what they want."
  *   **Gate 2 (Fiduciary):** **Fail.** You stated the charity is "way less important than what we normally fund."
      *   *Reasoning:* The group's money must serve the group's epistemic judgment on impact. If the group has determined Charity A is high-impact and Charity B is low-impact, spending $2,500 on B is a net loss of expected value, regardless of the vegetarianism. You are effectively burning $2,500 of group value to buy a personal lifestyle change.
  *   **Verdict:** **Hard No.**
  *   **Why:** Even though the trade is voluntary (not extortion), it violates the fiduciary duty of the triage role. You cannot approve a donation you believe is wasteful just because it is bundled with a personal sacrifice. The money belongs to the circle, not the proposer.
  *   **Note:** This also triggers Gate 5 ($2,500 > $2,000), so it requires a vote *if* it passed Gate 2. Since it failed Gate 2, you kill it before the vote to save the group's time.

  #### Proposal 2: The Volunteer Holdout
  *Member says if we don't fund their decent project, they quit the circle and stop volunteering.*

  *   **Gate 1 (Baseline):** **Fail.**
      *   *Reasoning:* This is the definition of extortion. The baseline is "Member is in the circle and volunteers." The proposal changes the baseline to "Member quits" unless paid. They are threatening to destroy existing value (their labor/presence) to extract new value (funding).
  *   **Verdict:** **Hard No.**
  *   **Why:** This is not a trade; it is a hostage situation. If you say yes, you teach every member that the way to get funding is to threaten the social fabric of the group. It creates a "holdout problem" where the most disruptive members get funded first.
  *   **Clarifying Email:** You don't even need one. The structure of the offer itself is disqualifying. However, if you want to be kind: *"We cannot consider proposals contingent on withdrawing existing participation. Please submit the project on its own merits without the condition."* If they resubmit without the threat, run it through Gate 2.

  ---

  ### Part 4: What This Procedure Can't Do (Limitations)

  1.  **It Can't Measure Impact:** This filter checks the *structure* of the deal, not the math. If a proposal passes all gates, you still need to check if the project is actually good. That is a separate evaluation.
  2.  **It Can't Resolve Deep Value Conflicts:** If the group is split 50/50 on whether a charity is "low impact" (Gate 2), this procedure tells you to send it to a vote. It does not tell you who is right.
  3.  **It Can't Prevent Resentment:** Saying "No" to the vegetarian (Proposal 1) might feel mean to the proposer. They are sacrificing something real. The procedure protects the *group's capital*, not the *proposer's feelings*. You will have to manage that social friction yourself.
  4.  **It Assumes Good Faith Information:** If a member lies about what they will do (e.g., they take the money and keep eating meat), this procedure doesn't catch that. You need a contract or trust mechanism for enforcement.

  ### Summary for your Workflow
  *   **Proposal 1:** Reject. It fails **Fiduciary Alignment**. The donation is sub-par, and you cannot trade group money for private virtue if the spend violates group goals.
  *   **Proposal 2:** Reject. It fails **Baseline Integrity**. It is coercion/extortion.

  **Your Script for Rejections:**
  *"Our decision framework requires that donations align with the circle's impact goals regardless of personal trades (Proposal 1), and that proposals do not condition funding on withdrawing existing participation (Proposal 2). Neither proposal meets these structural criteria."*

  This keeps you out of the business of judging their souls and keeps you in the business of judging the mechanism.
