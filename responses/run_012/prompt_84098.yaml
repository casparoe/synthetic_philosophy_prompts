answer: |-
  **Project Title:** Locating the Indeterminacy: A Structural Taxonomy of Consequentialist Evaluation in Long-Term Philanthropy

  **The Research Question**
  Does relocating the source of evaluative indeterminacy from a distinction based on *types of ignorance* (empirical vs. structural) to a distinction based on *functional stages of evaluation* (causal modeling, value assignment, aggregation) successfully isolate the threats unique to consequentialism from those general to all forward-looking decision theories?

  **Problem and Motivation**
  Consequentialist justification in philanthropy relies on comparing the expected value of actual grants against counterfactual alternatives. In long-term grantmaking, this calculation is plagued by indeterminacy. The standard philosophical response distinguishes two grades of the problem: first, where we lack causal information (empirical uncertainty); and second, where even full causal information fails to yield a verdict due to axiological complexities like infinities or low-probability high-magnitude outcomes (structural uncertainty).

  This distinction is currently doing less work than assumed. It sorts cases by the *kind* of ignorance involved, rather than *where* in the chain from act to verdict the unknown quantity enters. This conflation obscures which problems are specific to consequentialism and which are inherent to any decision theory operating over long time horizons. If the uncertainty lies in the causal model (what happens) or the value function (how good is it), the problem is not unique to consequentialism; any normative framework requiring foresight faces it. Only if the uncertainty lies in the aggregation rule (how we sum value across time and persons) does consequentialism face a distinctive crisis.

  Furthermore, the standard view often neglects a fourth entry point: the option set itself. We frequently do not know what alternatives were available at the time of decision. A complete taxonomy must determine whether this "counterfactual uncertainty" is a subset of causal ignorance or a distinct structural barrier. This project proposes that the functional taxonomy is superior because it allows grantmakers to discard objections that target general decision theory while focusing resources on the specific normative vulnerabilities of consequentialism.

  **Methodology and Work Plan**
  The project will proceed through three concrete stages over nine months of half-time research.

  *Stage 1: Formalizing the Taxonomy (Months 1–3)*
  I will construct a rigorous definition of the four entry points: Causal Model, Value Function, Aggregation Rule, and Option Set. The primary task is to map standard objections from the literature onto this framework. For example, the "chaos" objection (small acts have unpredictable large effects) maps to the Causal Model. The "repugnant conclusion" or "infinity" objections map to Value or Aggregation. The "unknown unknowns" regarding alternative interventions map to the Option Set.
  *Deliverable:* A working matrix classifying ten major objections to long-term consequentialist evaluation.

  *Stage 2: Stress-Testing the Distinction (Months 4–6)*
  I will test whether the functional taxonomy collapses into the standard two-grade distinction. If every Causal/Value uncertainty turns out to be "empirical" and every Aggregation/Option Set uncertainty turns out to be "structural," the proposal offers no gain. I will specifically analyze cases where the distinction diverges. For instance, uncertainty about the *Value Function* (e.g., whether future preferences matter) is empirical in nature but structural in location. I will argue this belongs in the Value category, not the Causal category, and determine the normative implication of that placement.
  *Deliverable:* A draft manuscript section demonstrating non-isomorphism between the old and new distinctions.

  *Stage 3: Implications and Synthesis (Months 7–9)*
  The final stage determines the normative stakes. If the thesis holds, objections landing in Causal or Value categories should be treated as decision-theoretic constraints, not reasons to abandon consequentialism. Objections landing in Aggregation require normative revision. I will also take a position on the Option Set: I argue it is a distinct entry point because it concerns the definition of the choice situation rather than the evaluation of outcomes, and it cannot be reduced to causal ignorance without assuming a deterministic world.
  *Deliverable:* A final paper (8,000–10,000 words) and a two-page practitioner brief for grantmakers on how to use the taxonomy to triage evaluation anxieties.

  **Risk of Failure**
  The primary risk is that the proposed taxonomy is merely a redescription of the standard view. If the Causal Model and Option Set categories map perfectly onto "empirical uncertainty," and the Value and Aggregation categories map perfectly onto "structural uncertainty," the project fails to advance the debate. I will mitigate this by explicitly hunting for hybrid cases during Stage 2. If I cannot find at least three significant arguments that are misclassified by the standard view but correctly classified by the functional view, I will conclude the project has failed and publish a negative result explaining why the standard distinction remains robust.

  A secondary risk involves the Option Set. If the option set is necessarily defined by causal possibility, then Option Set uncertainty collapses into Causal Model uncertainty. I must establish that *conceivability* of alternatives is distinct from *causal feasibility*. If I cannot defend this distinction, the fourth category will be dropped, and the scope narrowed to the original three.

  **Scope and Limitations**
  Nine months at half-time (approximately 500 research hours) is insufficient to solve the underlying problems of population ethics or empirical prediction. This project does not attempt to solve the aggregation problem or improve causal forecasting. It is strictly meta-ethical and methodological: it aims to sort the problems, not solve them.

  I will explicitly leave aside the debate between consequentialism and deontology. The project assumes a consequentialist framework for the sake of the fund's operations and asks how to make it coherent under uncertainty. I will also leave aside technical formalizations of decision theory; the argument will remain reconstructible by philosophers and practitioners without reliance on specific formal models. The goal is conceptual clarity, not mathematical proof.

  **Justification for Support**
  A standard literature review would catalog existing objections to long-term evaluation but would leave the field in its current state of conflated anxieties. Grantmakers currently treat all uncertainties as equally damaging to their justification, leading to paralysis or arbitrary decision-making. Philosophers often treat all uncertainties as threats to the theory itself, rather than to its application.

  This project is worth funding because it offers a triage mechanism. By distinguishing between problems that trouble *any* forward-looking agency and problems that trouble *consequentialist aggregation* specifically, it allows practitioners to ignore the former as unavoidable costs of doing business and focus on the latter as genuine normative challenges. It transforms a philosophical puzzle from a barrier into a map. Given the increasing volume of capital dedicated to long-termist goals, clarifying the structure of justification is an urgent practical need, not merely a theoretical exercise. This fellowship provides the time to rigorously test this map before it is deployed in high-stakes allocation decisions.
