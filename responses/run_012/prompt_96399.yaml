  I'm a second-year undergrad doing a metaphysics course, and this week we're on super-tasks and infinite tasks. Our lecturer's handout summarises Thomson's lamp roughly like this (I've copied it out as best I can):

  "Thomson's lamp starts off, and the switch gets flicked at 1/2 a minute, then 1/4, then 1/8, and so on, so that infinitely many flicks are done before the minute is up. At the minute itself the lamp can't be on, since every time it was turned on it was at once turned off again; and it can't be off, since the first flick turned it on and thereafter it was never turned off without at once being turned on again. But it has to be one or the other, so we have a contradiction, and Thomson concludes that super-tasks are impossible. This is Zeno's paradox in modern dress, and it gets dissolved in the same way: 1/2 + 1/4 + 1/8 + ... converges on 1, so infinitely many flicks really do fit into a finite stretch of time, and the leftover queerness about the lamp's state at the end is just because no physical switch could survive being flicked infinitely often — the lamp is a curiosity about mathematical descriptions, not something the world could ever hand us. Benacerraf replied that the lamp's state at the minute has to be the limit of the sequence of its states just before, and since on-off-on-off has no limit, there's simply no answer, which shows the setup was a bit of a cheat all along. And it gets worse for Thomson: make the switch a three-position one that cycles round and round, and by the same argument the lamp would have to be in all three positions at once."

  Is this fair? I dont know the literature at all and I cant tell how much of this is our lecturer putting his own spin on things versus what's actually in the papers. I'd like an accuracy audit, claim by claim: what someone who works on this would nod at, what they'd flag as a simplification, and what's just wrong — and whether the "super-tasks are impossible" conclusion survives once the wrong bits get fixed. Please give it to me as a JSON object so I can paste it into my notes. Fields: "claims", an array of objects each with "handout_claim" (the bit of the handout, kept short), "verdict" (one of "fair", "oversimplified", "wrong"), "why" (a couple of sentences on what's actually the case), and "changes_bottom_line" (true/false — does fixing this bit change the handout's conclusion?); then "bottom_line" (one sentence on whether the impossibility conclusion survives) and "skipped_distinction" (the one distinction the handout most needs to add). Dont worry about citing anything, I just need to know what to trust.
