answer: |-
  **Elena:** Let's look at the facts of the case without the moralizing gloss. At twenty, she signed a document. It said the bank could manage investments, data, and mutual obligations. She is now sixty. She has not signed a new document, but she has not left. She *could* leave. Therefore, she consents.

  **Marcus:** She consents to being *in* the bank, Elena. She does not consent to the specific acts the bank now performs. The procedures have drifted. The "mutual obligations" she imagined were perhaps dues for a newsletter; now they involve binding arbitration on her political speech. That violates the Scope Condition.

  **Elena:** The Scope Condition is a phantom. You're demanding that consent be specific to acts the agent can visualize at time *T1*. But human life is opaque. If I require that she could have "actually authorized" the specific drift, I invalidate every long-term commitment. Consider marriage. I vow to support you "in sickness and health." I cannot foresee the specific sickness, the specific cost, the specific burden. If your Scope Condition holds, my wedding vow is a fiction because I didn't authorize the specific chemotherapy regimen or the specific debt incurred.

  **Marcus:** That's a category error. Marriage is a status relationship defined by internal goods—care, fidelity, shared life. The Consent Bank is an instrumental contract. But even granting your marriage analogy: there are boundaries within the vow. I consent to care for you, but I do not consent to sell my kidney to fund your treatment, even if that falls under "sickness." The Scope Condition isn't about foreseeing every detail; it's about whether the *type* of authority claimed matches the *type* of authority granted. The bank moved from financial management to normative governance.

  **Elena:** Who draws that line? You say "financial" vs. "normative." But money is normative. If the bank invests in a weapons manufacturer, is that financial or moral? If they use medical data to lower premiums, is that administrative or biological? If we enforce your Scope Condition, we require a judicial review of every evolution in a long-term relationship. It makes stability impossible. The only clean line is exit. If the cost of exit is bearable, the continued stay is ratification.

  **Marcus:** The cost of exit here is not just bearable; it is punitive. It grows over time. But let's put the penalty aside. Suppose the penalty were zero. You still claim her stay validates the *drift*. I claim it validates only the *association*. If I join a book club and over forty years it becomes a cult, my staying doesn't mean I consented to the brainwashing. It means I failed to leave. Consent requires a meeting of minds, not just a failure to depart.

  **Elena:** But "meeting of minds" is impossible over forty years. Minds change. The institution changes. The only thing that remains constant is the procedural right to withdraw. You are essentially arguing for paternalism. You are saying, "She thinks she consented to this by staying, but you, Marcus, know better than she does what she actually authorized." You are overriding her current judgment that staying is preferable to leaving.

  **Marcus:** I am not overriding her judgment on whether to stay. I am overriding the bank's claim that her stay constitutes authorization for *specific new powers*. There is a difference between consenting to an institution's existence and consenting to its specific exercises of power. Think of a Constitution. Citizens consent to the government. But if the government passes a law that violates the spirit of the Constitution, the citizens' continued residence doesn't make that law valid. We need a Scope Condition to protect the *content* of the will, not just the *freedom* of the will.

  **Elena:** The Constitution analogy works against you. Constitutions have amendment procedures. The Bank's contract *was* the amendment procedure. It said: "We decide within these categories." She agreed to that procedure. When you demand the Scope Condition, you are demanding a veto on outcomes she already procedurally authorized. You want to say, "You can authorize a process, but if the output surprises you, the authorization voids." That makes the initial contract worthless.

  **Marcus:** Not worthless. It limits the *domain*. If I hire a contractor to build a house, I authorize them to make decisions about plumbing and wiring. I do not authorize them to decide I should also buy their car. If the contractor says, "Well, 'building a house' implies 'lifestyle management'," and I don't fire them immediately, have I consented to buy the car?

  **Elena:** If the contract said "lifestyle management compatible with housing," and I stayed for ten years while they bought me three cars? Yes. Because at any point I could have fired them. The "Scope" is defined by the text she signed, not by her subjective imagination of the text. You are smuggling in a subjective requirement—"what she pictured"—into an objective agreement.

  **Marcus:** I am smuggling in the moral reality of agency. Consent is a moral magic that transfers rights. It only works if the agent understands the *moral weight* of what they are transferring. If the bank uses the "medical data" clause to sell her genetic profile to an insurer who then denies her coverage, that is a transfer of a right to health security she never intended. The text is a vessel; the meaning is the water. If the vessel leaks, the water is gone. The Scope Condition ensures the vessel holds water.

  **Elena:** And who holds the sieve? If we adopt the Scope Condition, every institution becomes fragile. A university degree implies certain skills; if the curriculum drifts, is the degree void? A career implies certain duties; if the job description evolves, is the employment unauthorized? You are prioritizing the purity of the initial moment over the reality of the ongoing life.

  **Marcus:** I am prioritizing the authenticity of the obligation. If the obligation is based on a fiction—that she authorized *this* specific drift—then the obligation is coercive, even if she stays. The reason she stays might be inertia, or fear, or simply that the penalty is high enough to deter, even if not impossible. The Scope Condition asks: Is the authority claimed *of the same kind* as the authority granted? If not, no amount of staying cures the defect.

  **Elena:** Then we are at an impasse. You require a substantive match between intent and outcome. I require a procedural match between agreement and exit option.

  **Marcus:** Precisely. And the tragedy of the Consent Bank is that it exploits the gap between the two. It relies on your definition to operate, but it creates the conditions that make my definition necessary.

  **Elena:** Then perhaps the solution isn't philosophical, but structural. If the drift is the problem, the contract needs renewal clauses. But until then, if she stays, I must call it consent. To do otherwise is to treat her as a child who doesn't know her own mind.

  **Marcus:** And I must call it unauthorized, because to do otherwise is to treat her signature as a blank check on her moral soul.

