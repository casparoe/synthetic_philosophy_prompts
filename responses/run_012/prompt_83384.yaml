          *   Philosopher 2 must distinguish those cases or explain why they are also problematic/different.
      *   **Format:** Dialogue followed by a specific JSON object.
      *   **JSON Fields:** `agreements`, `cruxes` (list with `issue`, `exit_is_enough`, `scope_condition`, `what_turns_on_it`), `unresolved`.

  2.  **Character Development:**
      *   *Philosopher 1 (Pro-Exit/Contractualism):* Let's name her **Elena**. She values autonomy as the power to bind oneself and the stability of institutions. She leans towards a procedural view of consent.
      *   *Philosopher 2 (Pro-Scope/Substantive):* Let's name him **Marcus**. He values the authenticity of the will and the moral limits of authorization. He leans towards a substantive view of consent.

  3.  **Drafting the Dialogue - Section by Section:**

      *   **Opening:** Establish the case (The Consent Bank) and the core disagreement.
      *   **Round 1: The Core Principle.**
          *   Elena: She stayed. She could leave. That's consent.
          *   Marcus: She didn't know *what* she was staying for. The drift matters.
      *   **Round 2: The "Long-Term Commitment" Objection (Elena's Strong Point).**
          *   Elena: If you require specific foresight (Scope Condition), marriage and careers are void. We can't foresee the future selves.
          *   Marcus: Need to distinguish between *roles* and *specific acts*. Marriage is a framework, not a blank check for abuse.
      *   **Round 3: The Nature of Drift and Exit Costs.**
          *   Marcus: The penalty creates a "golden handcuff" situation. It's not just about cost; it's about the *kind* of authority transferred.
          *   Elena: All commitments have exit costs (divorce is expensive, quitting a career loses seniority). If we police the "drift," who decides what's too far?
      *   **Round 4: Refining the Scope Condition.**
          *   Marcus: It's not about perfect prediction. It's about whether the *type* of authority claimed matches the *type* of authority granted. The bank moved from "investment" to "obligations toward others."
          *   Elena: But the contract said "mutual obligations." She signed it.
          *   Marcus: Signing words isn't granting moral authority if the meaning shifts beneath you.
      *   **Closing:** Acknowledge the tension between stability and authenticity.

  4.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Did Elena make the marriage/career point strongly enough? *Adjustment:* Make sure she explicitly lists them as parallels to the bank.
      *   *Check:* Did Marcus address the marriage/career point? *Adjustment:* He needs to argue that marriage has implicit normative boundaries that the bank violated, or that marriage is a different *kind* of relationship (status vs. contract). Let's go with the idea that marriage has internal goods, whereas the bank is purely instrumental.
