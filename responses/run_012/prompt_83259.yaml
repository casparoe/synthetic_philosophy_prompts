answer: |-
  The light outside the clinic was violent. That was the first thing Dr. Aris noticed. It wasn't brighter than before—her pupils adjusted normally—but it lacked context. Before the clearing, light was a modifier; it illuminated faces, warned of traffic, highlighted exits. Now, it was just photons striking the retina, a relentless, meaningless barrage of luminance. She had paid for the truth, and the truth was exhausting.

  The brochure had promised *unmediated perception*. It claimed to sever the top-down predictive loops that cluttered human vision. We do not see the world, the pamphlet read; we hallucinate it based on probability, then correct for errors. Aris, a radiologist with twenty years of experience, knew this intellectually. She also knew that her expertise was essentially a refined hallucination. She wanted to see what remained when the refinement was stripped away. She wanted the raw data.

  Three days later, she sat in the darkened viewing room at St. Jude's. The monitor glowed with a chest CT. Before the procedure, this image would have spoken to her. The shadows would have arranged themselves into anatomy, and anomalies would have popped forward like red flags. Her brain would have completed the edges, filled in the noise, and presented her with a diagnosis before she consciously processed the pixels.

  Now, there was only grain.

  She traced the contour of a lung with her mouse. It was a collection of gray values. Somewhere in that static was a nodule, likely malignant. She knew the statistics. She knew the location. But her eyes refused to collaborate. The tumor did not jump out. It didn't exist as an object; it was just a slight variation in density, indistinguishable from the artifact of the machine or the breath of the patient.

  "It's still there," Elias said, standing behind her. He was a resident, eager and unburdened by her new clarity. "The mass. In the lower lobe."

  "I see the pixels," Aris said. Her voice sounded flat in the quiet room. "I see the density gradient. I do not see a mass."

  "You know what you're looking for."

  "Knowing is the problem." She leaned back, rubbing eyes that felt dry despite blinking normally. "My expectation of a tumor was never a bias, Elias. It was thousands of scans worth of skill. My beliefs had to reach into my eyes for me to see anything worth seeing at all. Without them, I'm just a camera."

  Elias shifted uncomfortably. He had read the literature on the clearing procedure. He knew the arguments. "But that's the loop," he said softly. "The belief is what makes the seeing, and the seeing is what confirms the belief. You see the tumor because you expect the tumor, and because you see it, you trust the expectation. It's a closed circuit. Isn't it better to break it?"

  "Is it?" Aris turned to him. "If I break the circuit, I save nothing. I see the raw world, and I am useless within it."

  She left work early. The city streets were a assault of uninterpreted geometry. A bus approached not as a vehicle, but as a looming wall of color and motion. She had to consciously calculate its trajectory, whereas before, her body would have simply stepped back. She felt a profound isolation. The shared reality she had inhabited with other humans was built on shared biases. They agreed that a red light meant stop, that a frown meant anger, that a shadow in a lung meant death. Without those agreements, she was alone in a universe of sensory noise.

  She stopped at a park bench. A birdwatcher sat nearby, binoculars around his neck. He was one of the early adopters of clearing, according to the news. He was staring at a tree.

  "Do you see it?" he asked without looking at her.

  "See what?"

  "The warbler."

  Aris looked at the tree. She saw leaves. She saw branches intersecting at chaotic angles. She saw light filtering through chlorophyll. She saw a small burst of yellow pigment against brown bark.

  "I see yellow," she said.

  "It's not yellow," the man said, finally lowering his hands. His eyes were tired, hollowed out by weeks of raw vision. "It's *Setophaga*. It's migration. It's survival. Before, I saw the bird. Now I see the components. I know more, but I recognize nothing."

  He stood up, packing his binoculars. "They tell us we're seeing reality now. But I think we just lost the only map that mattered."

  Aris watched him walk away. He moved carefully, navigating the path as if the ground itself was unfamiliar terrain.

  She looked back at the tree. She forced herself to focus on the yellow patch. Was it a bird? Or was it a leaf caught in a breeze? Without the expectation, the distinction vanished. The object was neither bird nor leaf until she named it. But naming it was the very act she had paid to remove.

  The sun dipped below the horizon. The light changed, shifting from white to gold. Before the clearing, this was evening, a signal to go home, to rest. Now, it was just a change in wavelength. It was beautiful, in a terrifying, absolute way. It was real, unfiltered by history or hope or fear.

  Aris closed her eyes. The darkness behind her lids was a relief. It was the only place where the predictions stopped, where the brain could rest in its own quiet hum. She opened them again. The world rushed back in, sharp and silent and waiting for her to tell it what it was. She stood up, unsure if she was walking home or just moving through space, carrying the heavy knowledge that to see clearly was to see nothing at all.
