answer: |-
  ### Part 1: Diagnosing and Repairing the Principle

  Your **Addressee Principle** captures a vital intuition: the legitimacy of a strike depends on *who* is being pressured to resolve *what*. However, as you have identified, the distinction between addressee and target is necessary but not sufficient. It fails because it ignores the **subject matter** of the dispute and the **rights of third parties**.

  The distinction survives, but it requires two specific repairs to align with your verdicts. The first repair addresses the tension between Case 2 (Sympathy) and Case 5 (Political). The second repair addresses Case 4 (The Scapegoat).

  Here is the repaired principle, which I will call the **Labor Nexus and Rights Principle**:

  > **A strike is justified if and only if:**
  >
  > 1.  **The Addressee Clause:** The party meant to be moved (the addressee) is either the employer **OR** another employer involved in a labor dispute with their own workers.
  >     *   *Forced by Case 2:* This permits sympathy strikes where the addressee is a different company (Company B), provided the dispute is labor-related.
  >     *   *Excludes Case 5:* This forbids political strikes where the addressee is the government, using the employer merely as a lever.
  >
  > 2.  **The Subject Matter Clause:** The dispute must concern terms and conditions of employment, workplace safety, ethical complicity in the work product, or solidarity with other workers regarding labor conditions.
  >     *   *Forced by Case 5:* This ensures that even if the employer is the addressee, they cannot be struck to demand public policy changes they cannot effectuate (like national minimum wage laws).
  >     *   *Includes Case 3:* This permits ethical sourcing strikes because the workers are demanding control over their *own* complicity in the work product.
  >
  > 3.  **The Rights Constraint Clause:** The demand cannot require the employer to violate the specific contractual or moral rights of a third party who is not a party to the dispute.
  >     *   *Forced by Case 4:* This forbids striking to fire a specific coworker. While the employer is the addressee, the demand violates the coworker's right to due process and non-arbitrary dismissal.
  >
  > 4.  **The Procedural Liberty Clause:** The right to strike is not negated by procedural breaches (such as no-strike clauses) if the grievance concerns fundamental rights (like harassment) and internal procedures have failed.
  >     *   *Forced by Case 6:* This justifies wildcat strikes when the institutional framework fails to protect basic dignity.
  >
  > 5.  **The Viability Clause:** The economic risk to the employer (including insolvency) does not invalidate the strike, provided the demand is within the employer's capacity to grant *prior* to liquidation.
  >     *   *Forced by Case 7:* This affirms that the employer's financial fragility is their risk to manage, not a veto on the workers' right to withhold labor.

  **The Distinction Between Case 2 and Case 5**
  You asked specifically what distinguishes the sympathy strike (Case 2) from the political strike (Case 5), given that both involve a grievance elsewhere. The distinction is the **Labor Nexus**.
  *   **In Case 2**, the grievance is about *labor conditions* (pay), and the mechanism is *solidarity among workers*. The strikers are refusing to facilitate the undermining of other workers' bargaining power. The "game" being played is industrial relations.
  *   **In Case 5**, the grievance is about *public policy* (law), and the mechanism is *economic coercion of the state via a private proxy*. The strikers are using their employment contract as a weapon to change the rules of the game itself, rather than playing within it.
  *   **Why this matters:** In Case 2, the target (your employer) is harmed as a side effect of pressuring a peer entity (Company B) within the same moral community (the labor market). In Case 5, the target (your employer) is instrumentalized as a blunt object against a sovereign entity (the Government) over which they have no control. The former is a dispute within the sphere of production; the latter is a dispute about the sphere of governance.

  ---

  ### Part 2: Applying the Principle to Four New Cases

  Here is how the **Labor Nexus and Rights Principle** adjudicates the four unlisted cases:

  **1. Picketers physically blocking replacement workers from entering the premises.**
  *   **Verdict:** **Not Justified.**
  *   **Reasoning:** This violates the **Rights Constraint Clause**. While the strike itself may be justified, the *method* here infringes on the replacement workers' right to liberty and movement, and potentially their right to work. A strike is a withdrawal of labor, not a right to physically obstruct others from offering theirs. Persuasion is permissible; coercion via physical blockade is not.

  **2. Individual workers crossing a lawful picket line because they cannot afford to lose the pay.**
  *   **Verdict:** **Justified (for the individual).**
  *   **Reasoning:** The **Rights Constraint Clause** works in both directions. While the union has a right to strike, individual workers retain a right to economic survival. Unless the individual has explicitly waived this right (e.g., via a binding strike vote agreement with penalties), economic necessity trumps the duty of solidarity. The principle protects the collective right to strike, but not the collective right to coerce individuals into destitution.

  **3. A union striking against a proposed merger that would leave its own members' terms untouched but would cost jobs at another plant.**
  *   **Verdict:** **Justified.**
  *   **Reasoning:** This falls under the **Addressee Clause** and **Subject Matter Clause**. The addressee is the employer. The subject matter is job security, which is a core term of employment. Even if *your* specific job is safe, the precedent and the solidarity with fellow workers in the same firm (or industry) create a sufficient Labor Nexus. This is structurally similar to Case 2 (Sympathy), but internalized within the corporate structure. It is a dispute about the *scope* of the enterprise's responsibility to its workforce.

  **4. A lockout by the employer, which is the mirror image of a strike.**
  *   **Verdict:** **Conditionally Justified.**
  *   **Reasoning:** The principle is symmetric regarding leverage. If workers may withhold labor to pressure an employer over terms, the employer may withhold work (and pay) to pressure workers over terms.
      *   *Defensive Lockout:* If the union is engaging in a "strike to fire a coworker" (Case 4) or a wildcat strike over a non-fundamental issue (violating Case 6), the employer may lock out to protect the firm or rights. **Justified.**
      *   *Offensive Lockout:* If the employer locks out workers to force a concession on wages that are already fair, simply to break the union's bargaining power, this mirrors a political strike (Case 5). It uses the leverage not to resolve a dispute over terms, but to alter the balance of power itself. **Not Justified.**
      *   *Summary:* A lockout is justified only as a defensive measure during a bargaining impasse over legitimate terms, not as an offensive weapon to dismantle collective bargaining.

  ---

  ### Part 3: The Cost of Consistency

  You asked which of your seven verdicts the best principle cannot keep, and whether dropping it costs less than complicating the principle.

  **The Verdict at Risk: Case 7 (Insolvency)**
  The **Labor Nexus and Rights Principle** can technically keep all seven of your verdicts. However, Case 7 is the stress point.
  *   **The Tension:** Case 7 asserts that workers may strike even if it destroys the "Addressee." If the firm liquidates, the employer ceases to exist. Some ethical frameworks argue that a right to bargain presupposes a continuing relationship. If the strike kills the relationship permanently, it arguably exceeds the scope of "bargaining" and becomes "expropriation" or "destruction."
  *   **The Repair Cost:** To preserve Case 7, we must accept that the right to withhold labor is absolute, regardless of consequences. To reject Case 7, we would need to add a **Proportionality Clause**: *The harm inflicted on the addressee must not be grossly disproportionate to the gain sought, and the strike must have a reasonable prospect of success without total destruction.*

  **Recommendation:**
  You should **keep Case 7** and accept the complexity.
  *   **Why?** Dropping Case 7 shifts the burden of business risk entirely onto the workers. If workers must assess the firm's solvency before striking, they effectively become managers without authority or pay. They would be forced to subordinate their immediate needs (wages/safety) to the firm's long-term viability, which is the employer's specific responsibility.
  *   **The Cost:** The cost is that some strikes will be "successful" in principle but pyrrhic in practice (everyone loses their jobs). This is a tragedy, but not an *injustice* perpetrated by the strikers. The employer's inability to pay is not a moral veto on the workers' right to be paid.

  **The Verdict to Watch: Case 4 (The Scapegoat)**
  If you must drop a verdict to simplify the principle, Case 4 is the candidate, but **you should not drop it.**
  *   **Why?** Case 4 is the only one that protects a specific individual from the collective. If you drop the **Rights Constraint Clause** to simplify the principle, you allow unions to become tyrannical. You would have to accept that a majority can vote to destroy a minority member's livelihood for any reason.
  *   **Conclusion:** The complexity added by the Rights Constraint is necessary moral insurance. It is better to have a complex principle that protects the individual coworker (Case 4) and allows solidarity (Case 2) than a simple Addressee Principle that fails both.

  **Final Summary**
  Your intuition was correct: the Addressee/Target distinction is the spine of the ethics of striking, but it needs flesh. By adding the **Labor Nexus** (to distinguish Case 2 from 5) and the **Rights Constraint** (to handle Case 4), you preserve all seven of your verdicts. The distinction between the sympathy strike and the political strike is not about *who* is hurt, but about whether the dispute belongs to the **community of labor** or the **community of citizens**. The former permits secondary pressure; the latter does not.
