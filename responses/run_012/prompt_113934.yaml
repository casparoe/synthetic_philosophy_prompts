      *   *Resoluteness:* McClennen's resolute choice assumes the agent identifies with the plan. Leonard identifies with the *mission*, but knowingly falsifies the data. This is resoluteness turned malignant.
      *   *Bottom Line:* Leonard isn't money-pumping himself in the decision-theoretic sense because he lacks the transitive preference cycle required to be exploited, but he does exemplify a catastrophic failure of resolute choice where commitment devices become tools for self-deception rather than rational coordination.

