      *   *Diachronic Agency:* Papers treat time-slices as cooperating or competing agents. The film shows the *ethical horror* of one slice enslaving the next.
      *   *Avoid Personal Identity:* Focus on rationality structures, not "is he the same person?"

  7.  **Refining the Argument:**
