answer: |-
  Leonard is not running a standard money pump on himself because the mechanism relies on intransitive preferences within a remembering agent, but the film does depict a catastrophic collapse of resolute choice where commitment devices are weaponized to enforce a delusional plan across disconnected time-slices.

  A canonical money pump requires an agent to cycle through preferences (A > B, B > C, C > A) while retaining enough memory to recognize each trade as an improvement, yet ending up poorer than when they started. Leonard fails the memory condition essential to the pump's normative force: he does not feel himself being taken because he cannot register the cumulative cost of the loop. While Teddy claims Leonard "chooses" to reset, implying a hidden preference for the hunt over the truth, this is not intransitivity but rather a principal-agent problem across time. The "cost" Leonard pays is not monetary but moral and existential, incurred by a continuous biological entity while the psychological agents remain unaware of the debt. Therefore, the analogy strains because standard decision theory assumes diachronic continuity of information; Leonard's condition replaces exploitation via preference inconsistency with exploitation via information asymmetry between his past and future selves.

  Regarding sophisticated versus resolute choice, the film demonstrates resoluteness collapsing into self-deception rather than vindicating it. A sophisticated chooser anticipates that their future self will lack the will or information to execute a plan and adjusts their current strategy accordingly, often leading to paralysis or preemptive defection. A resolute chooser commits to a plan and binds their future self to it, regardless of changing incentives. Leonard attempts resoluteness by tattooing instructions and facts onto his body, creating a hard constraint for his future self. However, in the final act, he knowingly falsifies these constraints (burning the photo of Jimmy, writing "John G" on Teddy's picture). He is not resolving to follow a rational plan; he is resolving to manipulate his future self into committing murder to sustain a narrative purpose. This violates the normative core of resolute choice, which assumes the plan is adopted for good reasons, not merely to maintain agency itself. He uses the *mechanism* of resoluteness (commitment devices) to bypass the *rationality* of resoluteness (adherence to true preferences).

  Teddy and Natalie function as external pump operators, but they rely on Leonard's internal failure of diachronic coordination. Natalie pumps him by leveraging his inability to update information (changing her story knowing he won't remember), while Teddy encourages the loop because it keeps Leonard useful. These are standard exploitation strategies against an amnesiac, but the deeper rationality failure is Leonard's complicity. He recognizes Teddy's manipulation yet decides to encode Teddy as "John G." This suggests that when diachronic agency is fractured, the "past self" becomes a tyrant to the "future self." The past self retains the power to set goals and alter the environment (tattoos, notes), while the future self retains only the capacity for execution without context.

  What the film dramatizes that decision-theory papers often omit is the ethical violence inherent in binding a future self that cannot consent to the binding. Literature on diachronic rationality often treats time-slices as cooperative players in a game or assumes psychological continuity allows for identification with past plans. *Memento* shows that without memory, commitment devices are not tools for coordination but instruments of coercion. Leonard's future self is not a partner in rationality but a puppet whose strings are pulled by a past self that has already decided the truth is irrelevant. The film ultimately argues that practical rationality requires not just consistent preferences or commitment devices, but an ethical relationship between temporal selves; when that relationship is severed, resoluteness becomes indistinguishable from insanity, and agency devolves into a loop of instrumentalized violence.
