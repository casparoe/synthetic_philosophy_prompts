  2.  **Deconstruct the Core Concepts:**
      *   **Money Pump:** Typically involves intransitive preferences (A > B, B > C, C > A) leading an agent to cycle through trades, paying a cost each time, ending up where they started but poorer. Requires the agent to make sequential choices based on current preferences.
      *   **Leonard's Condition:** Anterograde amnesia. Cannot form new episodic memories. Relies on external aids (tattoos, notes).
      *   **Diachronic Rationality:** Rationality over time. How should a temporally extended agent coordinate actions across time slices?
      *   **Sophisticated vs. Resolute Choice:**
          *   *Sophisticated:* Anticipates future preference changes and plans accordingly (backward induction). Might reject current plans if future self won't follow through.
          *   *Resolute:* Commits to a plan despite future temptation/preference changes, binding the future self.
      *   **The Film's Plot:** Leonard kills Teddy at the end. He knows (or suspects) Teddy is useless/dangerous, but he manipulates his own future self (via tattoos/notes) to kill Teddy anyway, to give himself a purpose. Teddy claims Leonard has done this before (killed Jimmy Grantz, then reset). Natalie manipulates him too.

  3.  **Evaluate the "Money Pump" Analogy:**
      *   *Standard Money Pump:* Agent prefers A to B, B to C, C to A. Trades A->B (pay $), B->C (pay $), C->A (pay $). Net loss.
      *   *Leonard's Loop:* Leonard seeks revenge -> Kills target -> Resets (psychologically) -> Seeks revenge again.
      *   *Is it a pump?* In a standard pump, the agent *knows* they are trading and prefers the trade at each step. Leonard *doesn't remember* the previous steps. He doesn't feel the loss. The "cost" isn't monetary per step, it's the cost of living a lie/committing murder repeatedly.
      *   *Teddy's Claim:* "You don't want the truth. You make up your own truth." Teddy suggests Leonard *chooses* to reset.
      *   *Difference:* Standard pumps exploit preference inconsistency *within* a remembering agent. Leonard's pump exploits memory *loss*. It's not intransitive preferences; it's disconnected agency.
      *   *Verdict:* It's not a standard money pump. It's a *diachronic exploitation* enabled by memory fragmentation, but the mechanism is different. The "cost" is paid by the continuous person, not the psychological slices.

  4.  **Evaluate Sophisticated vs. Resolute Choice:**
      *   *Leonard as Sophisticated:* He knows his memory fails. He sets up systems (tattoos) to constrain future self. This looks like sophistication (anticipating failure).
