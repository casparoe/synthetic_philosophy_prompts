      *   *The Twist:* He is manipulating his *future* self. Usually, resoluteness is about binding oneself against temptation. Here, Leonard (Current) is tricking Leonard (Future).
      *   *Collapse:* The film shows resoluteness collapsing into self-deception. He isn't resolving to follow a rational plan; he's resolving to maintain a delusion.
      *   *Vindication?* No. It shows the horror of resoluteness without memory. You become a tool for your past self's agenda.

  5.  **Diachronic Agency (Film vs. Papers):**
      *   *Papers:* Often abstract, assume psychological continuity or treat time slices as distinct agents in a game.
      *   *Film:* Dramatizes the *violence* of diachronic agency. The "past self" weaponizes the "future self." It shows the ethical cost of commitment devices when identity is fractured. It highlights the role of *narrative* in rationality (Leonard constructs a story to justify action).

  6.  **Drafting the Response (incorporating constraints):**
      *   *First Sentence:* Bottom line. (e.g., Leonard is not running a standard money pump but rather enacting a pathological form of resolute choice that weaponizes diachronic fragmentation against itself.)
