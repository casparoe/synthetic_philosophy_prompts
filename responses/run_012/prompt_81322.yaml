answer: |-
  # Teaching Artifact: The Latency SLA Case

  ### I. The Scenario

  **Context:** A commercial contract between a High-Frequency Trading Firm (Client) and a Data Center Provider (Vendor). The contract guarantees low-latency data transmission. If the guarantee is breached, the Vendor owes the Client a "Penalty Credit" (a direct financial liability of $50,000 per incident).

  **Underlying Quantity:** *Cumulative Latency Deviation.* This is measured in seconds. It sums the duration of all instances in a billing cycle where packet latency exceeds the baseline by more than 10 milliseconds. The quantity is continuous; there are no natural joints between 299 seconds and 300 seconds. The functional impact on the Client's trading algorithm is identical across the range of 290–310 seconds; the only variable is the accumulated time.

  **The Series:** A sequence of possible billing cycles, $w_{299}, w_{300}, w_{301}$, identical in every respect except the Cumulative Latency Deviation, which is 299 seconds, 300 seconds, and 301 seconds respectively.

  **The Predicate:** "The Vendor is **Liable** for the Penalty Credit." (Triggered by a "Substantial Performance Failure".)

  **Version A (The Stipulated Standard):**
  The Service Level Agreement (SLA) contains the following clause: *"A Performance Failure is deemed Substantial if and only if the Cumulative Latency Deviation equals or exceeds 300 seconds."*
  *   **Precision Source:** Semantic/Institutional stipulation.
  *   **Measurement:** Instruments measure time to the millisecond (no epistemic blur).

  **Version B (The Vague Standard):**
  The SLA contains the following clause: *"A Performance Failure is deemed Substantial if the Cumulative Latency Deviation constitutes a significant disruption to Client operations."* The term "significant" is undefined in the contract and has no settled technical definition in the industry.
  *   **Precision Source:** None.
  *   **Higher-Order Constraint:** Legal precedent in this jurisdiction establishes that there is no definite point where "non-significant" becomes "borderline," nor where "borderline" becomes "definitely significant." The vagueness applies to the boundaries of the borderline region itself.

  **Stakes:** In both versions, the determination of Liability triggers the exact same $50,000 transfer. The institutional machinery (arbitration court) is identical.

  ---

  ### II. Theoretical Verdicts

  | Theory | Version A (Stipulated) Verdicts <br> *(299s / 300s / 301s)* | Version A Justification | Version B (Vague) Verdicts <br> *(299s / 300s / 301s)* | Version B Justification |
  | :--- | :--- | :--- | :--- | :--- |
  | **Epistemicism** | False / True / True | The contract stipulates a sharp boundary that fixes the extension precisely. | True or False / True or False / True or False | There is a sharp boundary fixed by usage facts, but our epistemic access to it is incomplete. |
  | **Supervaluationism** | False / True / True | The stipulation admits only one admissible precisification, eliminating indeterminacy. | Indeterminate / Indeterminate / Indeterminate | Multiple admissible precisifications exist; truth is not preserved across all of them. |
  | **Degree Theory** | 0 / 1 / 1 | The institutional rule imposes a crisp step-function on the membership degree. | ~0.4 / ~0.5 / ~0.6 | Truth values track the underlying continuum; the predicate applies to intermediate degrees. |
  | **Contextualism** | False / True / True | The contract fixes the conversational context, stabilizing the extension for the assessment. | Variable / Variable / Variable | Truth depends on the context of assessment, which the vague standard leaves open to shift. |

  ---

  ### III. Construction Analysis

  **1. The Single Feature Doing the Work**
  The operative feature is the **Institutional Stipulation**. It acts as a switch that forces the theories to distinguish between *ontic/semantic indeterminacy* and *rule-based precision*. In Version A, the institution (the contract) does the metaphysical work of sharpening the predicate. In Version B, the institution abdicates that work, forcing the theories to explain the vagueness using only their internal resources.

  **2. Collapse Upon Removal**
  If the Institutional Stipulation is removed from Version A (making both versions vague), **Epistemicism** collapses into claiming both cases have sharp but unknown boundaries, rendering the two versions metaphysically identical despite the textual difference. **Supervaluationism** collapses into treating both as indeterminate, losing the ability to explain why lawyers treat Version A as legally distinct from Version B. **Degree Theory** collapses into assigning degrees to both, struggling to explain why Version A functions as a binary switch in court. **Contextualism** collapses into claiming context fixes both, obscuring the difference between a context fixed by text versus one fixed by conversational flow.

  **3. The Theory Treated Most Unkindly**
  **Supervaluationism** is treated most unkindly by Constraint 3 (Higher-Order Vagueness).
  *   **The Problem:** Standard Supervaluationism posits a set of "admissible precisifications." However, to define this set, one must draw a boundary between precisifications that are admissible and those that are not. This reintroduces a sharp boundary at the level of higher-order vagueness (the boundary between the "definitely true" and the "indeterminate"). The case explicitly demands a scenario where *no* such sharp boundary exists (no sharp line between definite and borderline).
  *   **The Defense:** A defender would retreat to **Higher-Order Supervaluationism**. They would argue that the set of admissible precisifications is itself vaguely defined, requiring a supervaluation over the precisifications. They would claim the case does not refute the view but merely demands a more complex, iterative semantic model to match the higher-order constraints.

  **4. Where the Construction is Rigged or Question-Begging**
  The case rigs the **Epistemicist** verdict in Version B by presupposing that "legal precedent" (an institutional fact) can enforce higher-order vagueness.
  *   **The Bias:** The scenario states as a fact that "there is no definite point where 'non-significant' becomes 'borderline'." An Epistemicist denies this is possible; they believe there *must* be a definite point, even if the law says otherwise. By building the non-existence of a sharp boundary into the *story's background facts*, the case forces the Epistemicist to contradict the text of the scenario to maintain their position.
