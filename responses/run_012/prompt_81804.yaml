answer: |-
  This is a fantastic argument your friend handed you. It's clean, it's valid, and it aligns with a well-established position in the philosophy of conspiracy theories known as **reductionism** (most famously associated with the philosopher Brian Keeley). The reductionist says: "There is nothing inherently irrational about believing in conspiracies; we just evaluate them on the evidence."

  Your intuition that (7) proves too much is correct, but your friend's logic is tight enough that you can't just wave your hands at it. If you want to push back without denying obvious truths (like Watergate), you have to find where the argument slides from **logic** to **heuristics**, or from **propositions** to **practices**.

  Here are the three best places to push, what you gain by pushing them, and what it costs you.

  ### 1. Push on Step (1): The Definition Trap
  **The Move:** Argue that definition (1) is too thin. It defines a *conspiracy*, not a *conspiracy theory*.

  Your friend defines a conspiracy theory as "a hypothesis that says some people secretly coordinated..." But in ordinary language (and in the psychological literature you mentioned), "conspiracy theory" doesn't just refer to the *content* of the claim (a secret plot); it refers to a specific **style of reasoning** used to support that claim.

  *   **The Argument:** If I say "The CIA killed JFK," that is a claim about a conspiracy. If I support that claim with forensic evidence, witness testimony, and documents, it's a historical hypothesis. If I support it by saying "The official report is a lie because they *would* say that," and "Any lack of evidence proves how good the cover-up was," I am engaging in *conspiracy theorizing*.
  *   **Where it breaks her chain:** Step (5) claims the "bad features" (self-sealing, super-competence) are just ordinary epistemic flaws. But in the *genre* of conspiracy theory, these aren't accidental flaws; they are **structural features**. A scientific hypothesis *tries* to be falsifiable. A conspiracy theory *engineers* unfalsifiability into its core.
  *   **The Gain:** You save the idea that the label "conspiracy theory" picks out a distinct epistemic category. It's not about *what* is claimed, but *how* the claim is sustained.
  *   **The Cost:** You have to admit that the term is pejorative by design. You are no longer talking about "theories about conspiracies" (which includes Watergate); you are talking about "a specific, flawed mode of inquiry." This means you have to concede that Watergate wasn't a "conspiracy theory" in the modern sense, it was just a conspiracy that was proven.

  ### 2. Push on Step (6): The Reference Class Problem
  **The Move:** Argue that the label *does* add information to the ledger, specifically regarding **base rates**.

  Step (6) says calling something a conspiracy theory "never adds anything to the ledger." This is false if you view epistemology through a Bayesian lens. We don't evaluate hypotheses in a vacuum; we evaluate them based on the reference class they belong to.

  *   **The Argument:** Imagine a doctor seeing a symptom. If the symptom is "cough," that's one thing. If the symptom is "cough + night sweats + weight loss," the label "TB symptoms" changes the prior probability, even before the specific test results come in.
      Historically, the set of claims labeled "conspiracy theories" has an abysmal truth-to-falsehood ratio. The set of claims labeled "investigative journalism" or "judicial findings" has a much higher ratio. Therefore, the label "conspiracy theory" is a statistical signal. It tells you: *This claim comes from a reference class with a low prior probability of truth.*
  *   **Where it breaks her chain:** Step (4) says confidence must be based on features that bear on whether it's true. The **provenance** of a claim bears on whether it's true. If a claim emerges from a community known for epistemic recklessness, that is evidence.
  *   **The Gain:** You justify the use of the label as a **heuristic**. It is rational to discount a claim based on its genre because the genre is statistically unreliable.
  *   **The Cost:** You accept the risk of **false negatives**. By using the base rate of the genre, you will inevitably dismiss true claims that look like false ones (the Watergate problem). You have to argue that this is an acceptable trade-off for cognitive efficiency. You are essentially arguing that it is rational to be prejudiced against the *form* of the argument to save time and cognitive energy.

  ### 3. Push on Step (7): The Social Epistemology Angle
  **The Move:** Argue that (7) ignores the social function of the label.

  Step (7) says if someone tells you a claim is a conspiracy theory and stops there, they've given you *no reason*. This assumes epistemology is a solitary activity. It isn't. We rely on testimony and social cues.

  *   **The Argument:** When someone labels a claim a "conspiracy theory," they aren't just describing the proposition; they are issuing a **warning about the community of belief**. They are saying: "The people who believe this tend to believe other things that are false," or "The social mechanism sustaining this belief is insulated from correction."
      You mentioned the "monological belief system" (the idea that believing one CT makes you likely to believe others). This is empirically supported. If a claim is the centerpiece of a community that exhibits high correlation with other false beliefs, pointing that out *is* evidence. It's evidence about the reliability of the testimony chain.
  *   **Where it breaks her chain:** It challenges the idea that the only relevant evidence is about the *event* (Did the CIA do it?). Evidence about the *believers* (Do people who believe this also believe lizard people run the UN?) is relevant to the credibility of the claim in a social context.
  *   **The Gain:** You validate your intuition about the "rotten genre." The genre is rotten not because the *logic* is always wrong, but because the *social ecosystem* is toxic to truth-seeking.
  *   **The Cost:** This edges toward an *ad hominem* argument. You are judging the claim partly by the company it keeps. You have to be careful not to slide into "This is false because *those people* believe it." You must frame it as: "This claim is embedded in a network that is structurally hostile to correction."

  ### Summary: Where to Stand
  Your friend is right about **ideal epistemology**. In a perfect world with infinite time, we would evaluate every claim solely on its specific evidence and priors, ignoring the label.

  But you are right about **human epistemology**. We need heuristics. The label "conspiracy theory" is a shorthand for a cluster of features (unfalsifiability, low base rate, insular community) that usually indicate a high probability of falsehood.

  **The Winning Push:**
  I recommend pushing hardest on **Step (5)**.
  Tell her: *"You're treating the 'self-sealing' nature of conspiracy theories as an accidental flaw, like a wobbly table leg. But for conspiracy theories, the self-sealing mechanism is the engine. It's not that they happen to be unfalsifiable; it's that they are designed to be unfalsifiable. That makes them a distinct epistemic species, not just a hypothesis with bad priors. So the label does work: it warns me that the hypothesis is structurally immune to the very evidence you say should judge it."*

  **What you pay:**
  You have to concede that "conspiracy theory" is not a neutral description of content (a secret plot). It is a description of a **degenerate research program**. This means you can't say "Watergate was a conspiracy theory that turned out to be true." You have to say "Watergate was a real conspiracy that was uncovered by standard epistemic methods, not conspiracy theorizing."

  If you make that distinction, her receipt still holds for *conspiracies*, but it fails for *Conspiracy Theories*. And that preserves your intuition without denying reality.
