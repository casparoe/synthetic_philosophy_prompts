answer: |-
  This is not cowardice. What you are feeling is the central tension of public history. You are standing exactly where the past rubs against the present, and it is supposed to hurt.

  If you were certain, you'd probably be doing it wrong. Certainty in history usually means someone is being silenced.

  You have three plans, but they are actually false choices. Plan One is mythology. Plan Two is positivism (the belief that facts speak for themselves; they don't). Plan Three is activism (necessary, but if done poorly, it can become its own kind of simplification).

  You can satisfy the Trust, get the Grant, and honor your great-grandfather, but only if you stop trying to choose between the plans and start weaving them. Here is how to think about the ethics, the legal wrinkle, and the room itself.

  ### 1. The Legal and Financial Knot
  The Trust lawyer says "nothing reframed." The Grant says "interpret for contemporary audiences." These sound contradictory, but in museum ethics, they are not.

  *   **Reframing** usually means altering the context to change the *perception* of an object (e.g., hiding the ledger to make the founder look better).
  *   **Interpreting** means providing the context necessary to *understand* the object (e.g., displaying the ledger next to the portrait with a label explaining what the numbers represent).

  You can argue to the Trust that **omission is not preservation.** If you preserve the portrait but hide the ledger, you are not preserving the "full heritage of the town." You are preserving a fantasy. The "full heritage" includes the pain. If the lawyer pushes back, show them the Grant requirements: to preserve the heritage is to explain it. A locked box of receipts no one understands is not preserved heritage; it's hoarding.

  **The Strategy:** Do not deaccession anything (satisfy the Trust). Display *more* than less (satisfy the Grant). Make the "Indictment" materials part of the "Archive."

  ### 2. The Ethical Core: Your Great-Grandfather
  You asked how to think about the "right way" of using the past. The right way is the one that restores agency to the people who had it taken away.

  Plan One gives agency to the Founder. Plan Three gives agency to the Victim. Plan Two gives agency to the Cataloguer.
  **Your great-grandfather gives agency to the Worker.**

  He is the key to the room. He is the only figure who appears in both the Founder's correspondence (seeking opportunity) and the Payroll Ledger (recorded as cost). He is the bridge between the myth of industry and the reality of exploitation.

  If you center the room on him, you don't have to choose between "grit" and "exploitation." You can show **survival.**

  ### 3. A Proposal for the Room
  Do not build a shrine. Do not build a courtroom. Build a **Witness Stand.**

  **The Layout:**
  *   **The Centerpiece:** Place the Founder's portrait and the Payroll Ledger facing each other. Literally. Let them stare at one another across a table.
  *   **The Connector:** Place your great-grandfather's entry in the ledger directly under the Founder's eyes. Use his letters (the ones asking for work) as the introduction to the exhibit.
  *   **The Archive (Plan 2):** Use the "boring stuff" (fence posts, receipts) as evidence walls. Let visitors pull out drawers or flip through binders. Label them clearly: *"Materials used to build the fence that kept workers in,"* or *"Receipts for machinery purchased the same year safety report was ignored."* Let the objects testify.
  *   **The Narrative (Plan 3):** Do not write a label that says "The Founder was evil." Write a label that asks: *"This portrait was painted in 1905. In 1905, the average worker earned $X. The founder earned $Y. What does this gap buy?"*

  **Why this works:**
  *   **For the Trust:** You haven't removed the Founder. You haven't "reframed" his portrait; you've just hung it next to the truth. You are preserving the *relationship* between the objects, which is the true heritage.
  *   **For the Grant:** You are interpreting the material for a contemporary audience by highlighting labor rights, economic disparity, and immigration—issues that resonate today.
  *   **For the Town:** It allows for pride *and* shame. You can be proud of the industry without being proud of the cost. That is mature patriotism.

  ### 4. How to Think About the Past
  You asked if there is a "right one." There isn't a right one, but there is a **responsible one.**

  *   **Avoid Hagiography:** History that protects the powerful from criticism is not history; it's PR.
  *   **Avoid Voyeurism:** History that displays suffering without honoring the humanity of the sufferer is exploitation.
  *   **Aim for Complexity:** The workers weren't just victims; they were parents, strikers, believers, neighbors. The Founder wasn't just a villain; he was a builder, an employer, a community pillar. The truth is that he was both. The town is both.

  Your hesitation comes from knowing that whatever you do, someone will be angry. The descendants of the Founder will call it disrespectful. The descendants of the Workers will call it too soft.
  **Let them be angry.** If no one is uncomfortable, you haven't told the truth.

  ### 5. Practical Advice for You
  *   **Delegate the Conflict:** Form a "Community Advisory Committee." Invite a teacher, a union rep (if one exists), a descendant of the founder (if possible), and a local journalist. When the complaints come, you can say, "This exhibit reflects the community's diverse history," rather than "This is my opinion."
  *   **Write the Book:** Use the book to explore the emotional nuance that the museum labels can't hold. The museum shows the evidence; the book tells the story of how it feels to hold that evidence.
  *   **The "Cowardice" Check:** You are only being a coward if you hide the ledger because you're afraid of the Trust lawyer. If you display the ledger and the lawyer sues, you fought for the truth. If you hide it to keep the peace, you've become part of the "labour question" yourself.

  **The Verdict:**
  Go with a modified Plan Three, built on the bones of Plan Two.
  Use the Archive to prove the Indictment.
  Use your Great-Grandfather as the Guide.
  Tell the Trust that "Full Heritage" means "The Whole Truth."

  You didn't sign up for this, but you ended up here. That's not an accident; it's an inheritance. Handle it like your great-grandfather handled the factory: with your eyes open, your hands working, and a clear understanding of who benefits from the labor.
