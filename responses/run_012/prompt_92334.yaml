          *   *Plan 1 (Shrine):* Celebrate the founder, industry, grit. (Traditional, comforting, potentially dishonest).
          *   *Plan 2 (Archive):* Everything kept, no narrative, just raw data. (Neutral, overwhelming, potentially useless to the public).
          *   *Plan 3 (Indictment):* Focus on exploitation, child labor, safety failures. (Critical, necessary, potentially alienating to donors/town pride).
      *   **Constraints:**
          *   *Family Trust:* Funds renovation *only* if "full heritage" is preserved (no deaccessioning, no reframing). Lawyer interprets this strictly.
          *   *Heritage Grant:* Wants "interpretation for contemporary audiences" (telling a story).
          *   *Personal Stake:* User's great-grandfather is in *both* the founder's letters and the payroll ledger.
      *   **Emotional State:** Feeling overwhelmed ("way more than I signed up for"), oscillating between plans (unsure if it's cowardice or valid synthesis), seeking ethical guidance on "using the past."

  2.  **Deconstruct the Constraints & Conflicts:**
      *   *Trust vs. Grant:* The Trust says "preserve everything, don't reframe." The Grant says "interpret/tell a story." These seem contradictory on the surface, but "reframing" usually means *hiding* or *discarding* context to change perception, whereas "interpreting" means *adding* context to help understanding. This is the key legal/ethical pivot point.
      *   *The Three Plans:* They aren't mutually exclusive in practice, though they feel like it politically.
          *   Plan 1 is hagiography (lies of omission).
          *   Plan 2 is positivism (the myth that objects speak for themselves).
