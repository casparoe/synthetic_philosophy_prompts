  3.  **Evaluate the "Right Way" to Use the Past:**
      *   There is no single "right" way, but there are *ethical* ways.
      *   History isn't just about facts; it's about meaning.
      *   A shrine erases pain. An archive without context erases meaning. An indictment without nuance can erase agency.
      *   The best approach honors the complexity.

  4.  **Develop a Strategy (The "Fourth Way"):**
      *   *Compliance:* How to satisfy the Trust and the Grant simultaneously?
