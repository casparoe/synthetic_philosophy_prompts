answer: |-
  ### The Standard of Adequacy for a Theory of Pleasure

  For hedonism to function as a theory of welfare, "pleasure" cannot be a mere metaphor for "what is good." It must be a natural or functional kind that serves as the *currency* of well-being. If the term "pleasure" fractures under the weight of its own usage, the hedonistic calculus collapses. The following table outlines the constraints a theory of pleasure must satisfy to sustain a credible hedonism. These are not merely preferences for specific schools of thought; they are structural requirements derived from the logical commitments of aggregative welfare theory.

  | Requirement | Motivating Case / Consideration | Why Genuine (Not Mere Prejudice) | Status |
  | :--- | :--- | :--- | :--- |
  | **1. Phenomenological Unity** | **The Warm Bath vs. The Solved Proof.** The sensation of warmth on skin and the satisfaction of intellectual closure feel radically different. | **The Identity Condition:** If hedonism claims welfare consists in *one* thing (pleasure), there must be a unifying feature that distinguishes pleasure from non-pleasure. Without a common thread, "pleasure" is merely a label for a disjunction of unrelated states, rendering the theory empty. | **Non-negotiable** (for Classical Hedonism) |
  | **2. Intentional Flexibility** | **Object-Directed vs. Felt.** Relief at a clean biopsy is *about* the result; the warmth of a bath is simply *felt*. | **The Scope Condition:** A theory that restricts pleasure only to sensations (ignoring propositional attitudes) or only to attitudes (ignoring raw feels) fails to capture the full range of states humans value. Hedonism must account for the whole of positive experience. | **Non-negotiable** |
  | **3. Desire-Independence** | **Unwanted Pleasure vs. Empty Satisfaction.** A drug addict may feel pleasure they do not desire; a duty may be fulfilled (desire satisfied) with no pleasure. | **The Distinction Condition:** If pleasure is defined as "satisfaction of desire," hedonism collapses into desire theory. If pleasure can exist without desire, it retains its unique normative role as the *constituent* of welfare, not merely the *target* of pursuit. | **Non-negotiable** |
  | **4. Non-Conceptual Accessibility** | **The Dog and the Ball.** A dog enjoys a thrown ball but lacks propositional attitudes or complex concepts. | **The Sentience Condition:** Hedonism is typically universalist regarding sentient life. If pleasure requires high-level cognition (e.g., judging a state as good), animals and infants are excluded from the moral circle, a cost most hedonists wish to avoid. | **Non-negotiable** |
  | **5. Valence Distinctness** | **Bittersweet States.** Nostalgia or masochistic enjoyment can involve simultaneous positive and negative tones. | **The Calculus Condition:** Hedonism requires a net calculation (Pleasure − Pain). If a single state can be both fully pleasant and fully painful without a determinate net value, the arithmetic of welfare becomes impossible. | **Non-negotiable** |
  | **6. Truth/Value Independence** | **Schadenfreude and False Hope.** One can take pleasure in a false belief or in another's misfortune. | **The Subjectivity Condition:** Hedonism locates value in the subject's experience. If pleasure required its object to be *true* or *morally good*, welfare would depend on external facts, undermining the internalist intuition that drives hedonism. | **Non-negotiable** |
  | **7. Commensurability** | **The Fish vs. The Human.** We must be able to weigh a fish's sensory joy against a human's intellectual satisfaction to make trade-off decisions. | **The Aggregation Condition:** Hedonism is fundamentally aggregative (summing over a life or population). If pleasures are incommensurable kinds (like apples and oranges), no sum is possible, and the theory cannot guide action or evaluation. | **Non-negotiable** |

  ***

  ### The Incompatibility Analysis

  There is a subset of these requirements that appears to be **jointly unsatisfiable**. This triad forms the structural core of the heterogeneity problem:

  1.  **Phenomenological Unity** (There is a common "feel" or feature).
  2.  **Comprehensive Scope** (Implied by Requirements 2 & 4: The theory must cover baths, proofs, and dogs).
  3.  **Commensurability** (Requirement 7: They must be weighable on a single scale).

  **The Conflict:**
  To satisfy **Commensurability**, pleasures must share a metric. Usually, a metric implies a common nature (**Phenomenological Unity**). However, the empirical data of **Comprehensive Scope** (baths vs. proofs vs. dogs) suggests there is *no* single phenomenal quality shared across all these cases.
  *   **Sensory Quality Accounts** satisfy Unity and Commensurability but fail Comprehensive Scope (they cannot explain the pleasure of a proof without distorting it into a sensation).
  *   **Attitudinal Accounts** (e.g., Feldman) satisfy Comprehensive Scope and arguably Commensurability (via strength of attitude) but explicitly abandon Phenomenological Unity (admitting there is no common feel).
  *   **Pluralist/Family-Resemblance Accounts** satisfy Comprehensive Scope but fail Commensurability (if pleasures are only related by resemblance, they cannot be summed mathematically).

  **The Most Exclusionary Requirement:**
  The single requirement that excludes the most candidates is **Commensurability**.

  *   **Why:** It blocks the most natural escape from the heterogeneity problem. When faced with the diversity of pleasure (baths, proofs, dogs), the easiest philosophical move is to adopt a **Pluralist or Pragmatist retreat**: admit that "pleasure" is a family-resemblance term with no single essence. This saves the phenomenology and the scope. However, **Commensurability** forbids this move. If pleasures are not instances of a single kind, they cannot be summed to determine the "greatest happiness."
  *   **Impact:** This requirement immediately disqualifies the Pluralist retreat. It also places immense strain on Attitudinal accounts (how does one quantify the "strength" of an attitude toward a proof vs. an attitude toward a bath in a common unit?) and forces Sensory accounts into empirical falsehoods (claiming a common sensation exists where none is found).

  **Verdict:**
  Yes, the incompatibility identified above **is the heterogeneity problem itself**, formalized.

  The heterogeneity problem is not merely the observation that pleasures feel different; it is the observation that **the conditions required for pleasure to function as the currency of welfare (Unity and Commensurability) are incompatible with the conditions required for pleasure to describe the actual psychology of sentient beings (Scope and Diversity).**

  If you enforce Commensurability (necessary for Hedonism), you must enforce Unity. If you enforce Unity, you must exclude the Heterogeneous cases (baths vs. proofs). If you include the cases, you lose Unity. If you lose Unity, you lose Commensurability. If you lose Commensurability, you lose Hedonism. Thus, the demand for a **single, commensurable metric of welfare** is the constraint that turns the diversity of experience into a fatal problem for the theory.
