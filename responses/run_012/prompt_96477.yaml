answer: |-
  Subject: Planning the Anscombe evening

  Hi there,

  This is a fantastic choice for a discussion night because it cuts right against the grain of how most people think about ethics today, which is exactly why it will be difficult to pull off without them just dismissing Anscombe as hysterical. The biggest hurdle you face is that your friends almost certainly walk in with a utilitarian framework, meaning they believe the rightness of an action is determined by the outcome, so to make Anscombe's objection sound like a thought rather than an insult, you need to plant a specific prerequisite in their heads before you even get to Truman. They need to accept, even provisionally, that there are some kinds of actions that are forbidden regardless of how much good they produce, much like how we generally agree you cannot harvest one healthy person's organs to save five dying patients even if the math works out. If they do not grant that some acts are intrinsically wrong, Anscombe will just sound like she is ignoring the greater good, so you have to establish that deontological boundary early on.

  Regarding the order of the evening, you should not start with the philosophy but with the story, because the sheer audacity of her calling a head of state a murderer in public is the hook that keeps them engaged. Start with the Oxford honorary degree protest, then immediately head off the pacifist misconception because that is the easiest way for them to dismiss her. Make sure they know she supported the war effort against Hitler and did not think all killing in war was wrong, which forces them to realize her objection is about a specific kind of killing, not killing per se. Once you have established she is not a pacifist, you must head off the consequentialist objection before you explain her positive view, because if they start arguing about whether the bomb actually saved lives or ended the war, you will lose the room to historical debates that miss the moral point. Tell them explicitly that Anscombe does not care if the bomb saved a million lives, because her claim is that murder cannot be justified by good outcomes, and if you let them debate the history of the surrender, you are implicitly agreeing that the morality depends on the facts of the surrender rather than the nature of the act.

  Now about your carrying example, the besieged city and the fuel dump is actually the classic case used in this exact philosophical debate, often called the Strategic Bomber versus the Terror Bomber, so you are on very solid ground there. It is the right example, but it will teach them the wrong thing if you allow them to equate intention with emotional reluctance. The danger is that they will think if the pilot feels sad about the civilians dying, then he did not intend it, so you have to be very precise that intention is about the structure of the plan, not the feelings of the agent. For the first case, where you bomb the dump and see the deaths coming, you must stipulate that the mission would succeed exactly the same way even if the civilians magically survived, meaning their death is merely foreseen. For the ugly middle case, which is where Truman sits, you need to clarify that if the reason you chose that specific dump was precisely because its destruction would kill the civilians and thereby terrorize the enemy into surrender, then you intend their death even if your bomb physically hits the fuel tanks. The litmus test you must give them is to ask whether the plan succeeds if the civilians live; if the answer is no, because their death is what forces the surrender, then the death is intended, regardless of where the bomb lands.

  You should deliberately skip the theological underpinnings of Anscombe's view, specifically the Catholic doctrine of double effect, because introducing religious doctrine will distract secular friends and make it seem like this is a matter of faith rather than reason. You should also skip the historical debate about whether Japan was already ready to surrender, because while Anscombe believed that, her philosophical point stands even if the bomb was necessary to end the war, and getting bogged down in history turns the evening into a history seminar rather than an ethics discussion. Admit to them openly that you are skipping the religious context and the historical verification because you want to test the moral principle in isolation, which shows intellectual honesty and keeps the focus on the distinction between intending and foreseeing.

  For the one question to ask at the end to test whether they have grasped the distinction, do not ask them about Truman again because they will just repeat what you said. Instead, present them with a medical scenario where a doctor gives a dying patient a high dose of morphine to relieve pain, knowing it will hasten death, versus a doctor who gives the dose specifically to hasten death to relieve the family's burden. Ask them if the two doctors intended the same thing, and if they say yes, they have missed the point, but if they say the first doctor intended pain relief and merely foresaw the death while the second intended the death, then they have understood Anscombe. This transfers the logic from the war zone to a context where their intuitions might be clearer, and it reveals whether they understand that intention is defined by the goal of the action rather than the inevitable consequences.

  I hope this helps you structure the night, and do not worry if they resist the conclusion, because resisting it means they are engaging with the difficulty of the position rather than just nodding along.

  Best of luck with the discussion.
