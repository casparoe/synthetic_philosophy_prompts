prompt: |-
  I'm running a small discussion evening for about eight friends, none of us has any philosophy training, and this month I want to do Anscombe's objection to Truman over the atomic bombings, the row about the honorary degree and her saying he was a murderer. Don't explain the position to me, plan how I should put it across: what has to already be in their heads before the objection sounds like a thought rather than an insult, what order the pieces have to go in, and what one example should carry the whole evening. My idea for the carrying example is a besieged city, bombing the enemy's fuel dump right next to a civilian district where you can see the deaths coming and don't want them, versus bombing the civilians on purpose to force a surrender, plus the ugly middle case where you bomb the dump precisely because it sits next to the civilians and you're hoping the deaths will do some work for you, and I genuinely can't tell if that example is the right one or if it will quietly teach them the wrong thing, so tell me what it has to have and what it can't have, and what to use instead if it's no good. I think they'll walk in assuming that not wanting the civilians dead is the same as not intending it, that Anscombe must be some sort of pacifist, and that her real objection is really about the numbers or about whether the bomb actually ended the war, and I don't know at which point in the evening to head each of those off before it hardens. Also give me one question to ask at the end that would show whether they've actually got the distinction or have just gone along with me, and tell me what I should deliberately skip and admit I'm skipping at this level. Can you write it as continuous prose, no headings or bullet points or bold or tables, just the way you'd write it in an email.
