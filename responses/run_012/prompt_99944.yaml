  We scan the data for a trace of **nature**,
  Assuming progress softens rigid **culture**,
  Yet every free and rational **choice**
  Seems to demand a stricter kind of **justice**,
  Where outcomes diverge though rights are **equal**,
  And widen still the unexplained **gap**.

  Some say the widening, stubborn **gap**
  Is written in the essential **nature**,
  That even when the laws are made **equal**,
  The mind resists the homogenising **culture**,
  Preferring patterns that defy our **justice**,
  A biological, hard-wired **choice**.

  Is it a free and uncoerced **choice**?
  Or just the subtle filling of a **gap**?
  We claim the system offers perfect **justice**,
  While ignoring how we construct **nature**,
  Through osmosis of a liberal **culture**,
  Where stereotypes pretend to be **equal**.

  When states proclaim all pathways truly **equal**,
  Permitting each individual **choice**
  To settle into patterns of old **culture**,
  Not because of biology's **gap**,
  But because the state defines the **nature**
  Of safety, enabling a skewed **justice**.

  Perhaps we misdefine our **justice**,
  Demanding outcomes look strictly **equal**,
  When variance is simply human **nature**,
  And every statistical **choice**
  Merely highlights a semantic **gap**,
  Between the lived and the legislated **culture**.

  Until the institution shapes the **culture**,
  And writes the preference in the name of **justice**,
  Creating the very **gap** it seeks to close,
  Making the options seemingly **equal**,
  While stripping agency from the **choice**,
  To ask if anything is pure **nature**.

  So **culture** builds the mirror, **equal** glass,
  Where **justice** watches every **choice** we make,
  And finds a **gap** where **nature** should have been.
