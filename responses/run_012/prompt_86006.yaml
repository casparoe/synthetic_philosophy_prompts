      *   *Refining Item 6:* The Visitor. Use them to attack Item 1.

      *Self-Correction on "Upstreamness":* Is the "Intuition" (Item 5) more upstream? If the paradox is a cognitive illusion, solving the illusion dissolves the need to solve the metaphysics. *However*, the user wants to solve the paradox of judgment, not just explain why people believe it. I will place the Intuition work as a parallel track or slightly downstream, because even if it's an illusion, we need to know *what* is true to know *why* it's an illusion. Actually, determining if it's an illusion *is* determining if the causal constraint is binding. I'll keep Content first.

