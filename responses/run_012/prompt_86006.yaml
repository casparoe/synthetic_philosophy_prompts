      *   *Why Content first?* You can't have knowledge of $X$ if you can't think about $X$. If causal contact is necessary for thinking about $X$, and $C$ provides no causal contact, you can't think about $C$. Game over.
      *   *Why Production second?* It's the easiest to dissolve (Chalmers' move), but it sets the physical stage. It's upstream of Warrant because you need to know *what* produces the judgment to assess reliability.
