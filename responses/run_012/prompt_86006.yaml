answer: |-
  ### Critique of Your Three-Way Split

  Your distinction (Production, Aboutness, Warrant) is standard, but it distorts the terrain by treating **Production** as an independent problem. It is not.

  If you accept the "Common Cause" model (the neural state $N$ causes both the experience $E$ and the judgment $J$), the Production version is dissolved immediately. $E$ does not need to cause $J$ for $J$ to occur; $N$ does the work. You acknowledge this by noting interactionists and epiphenomenals predict the same judgments. Therefore, **Production is downstream of Aboutness.** The only reason Production *seems* like a problem is that we assume a causal link is required for *Aboutness* (reference) or *Warrant* (justification).

  Consequently, your agenda must prioritize the **Causal Theory of Content**. If content does not require causal contact, the Production problem is irrelevant, and the Warrant problem changes shape. If content *does* require causal contact, epiphenomenalism is semantically incoherent, not just causally spooky.

  Here is your ranked research agenda, ordered by upstreamness.

  ---

  ### The Research Agenda

  #### 1. The Validity of the Causal Constraint on Content
  *   **The Task:** Rigorously evaluate the premise that a judgment can only be *about* $X$ if $X$ plays a causal role in producing that judgment. Distinguish between *causal* theories of reference (e.g., Kripke/Putnam style externalism) and *informational* theories (e.g., Dretske) that might allow for common-cause covariance.
  *   **Why Upstream:** This is the gatekeeper. If causal contact is not necessary for reference, the "Aboutness version" of your paradox dissolves, and the "Warrant version" loses its force (since you can refer to $E$ even if $E$ is inert). If causal contact *is* necessary, epiphenomenalism is false on semantic grounds, rendering the rest of the project moot.
  *   **Tractability:** High. This is pure armchair conceptual analysis, leveraging existing debates in philosophy of language and mind.
  *   **Neglectedness:** Moderate. Often assumed rather than argued in the consciousness literature. Most epiphenomenalists simply assert a non-causal theory of reference without defending it against naturalistic objections.
  *   **Success Criteria (2 Years):** A definitive argument either (a) establishing that covariance via a common cause is sufficient for phenomenal reference, or (b) proving that epiphenomenalism entails semantic nihilism regarding qualia.
      *   *Move Up:* If you find a robust non-causal theory of content that survives naturalistic critique.
      *   *Move Down:* If you conclude the causal constraint is non-negotiable for naturalists (forcing you to abandon epiphenomenalism).

  #### 2. The Metaphysics of the Common Cause
  *   **The Task:** Formalize the $N \to E$ and $N \to J$ structure. Specifically, investigate whether the psychophysical law linking $N$ to $E$ must be brute or derivable. If it is brute, does that undermine the "explanatory irrelevance" of $E$?
  *   **Why Upstream:** Once you secure reference (Item 1), you must ensure the physical story is coherent. This addresses your "Production version" properly: not "how does $E$ cause $J$?" but "does the $N \to E$ link compromise the causal closure required for $N \to J$?"
  *   **Tractability:** High. Armchair metaphysics.
  *   **Neglectedness:** Low. This is Chalmers' standard move, but it needs stress-testing against recent interventionist accounts of causation.
  *   **Success Criteria:** A model showing that $E$ can be nomologically linked to $N$ without $E$ competing with $N$ for causal efficacy over $J$.
      *   *Move Up:* If interventionist causation threatens the common cause model.
      *   *Move Down:* If the model holds stable (likely).

  #### 3. The Mechanism of Phenomenal Reference (Phenomenal Concepts)
  *   **The Task:** Specify *how* the judgment latches onto the experience given the Common Cause. Is it via a "recognitional concept"? Does the experience constitute the concept? This bridges Item 1 (Content) and Item 4 (Warrant).
  *   **Why Upstream:** You need a mechanism to explain *why* the judgment is about $E$ and not just $N$. If the concept of "red" is constituted by the experience of red, reference might be secured without causal efficacy.
  *   **Tractability:** Moderate. Requires navigating the Phenomenal Concept Strategy (PCS) literature without getting bogged down in physicalist debates.
  *   **Neglectedness:** Low, but often misused. PCS is usually used to defend physicalism; you will weaponize it for epiphenomenalism.
  *   **Success Criteria:** A account of phenomenal concepts that secures reference in an epiphenomenalist framework without collapsing into illusionism.
      *   *Move Up:* If you find a constitution-based reference model that bypasses causal requirements.
      *   *Move Down:* If PCS turns out to rely on covert causal assumptions.

  #### 4. The Epistemic Status of Introspective Judgment
  *   **The Task:** Address the "Warrant version." If reference is secured (Items 1 & 3), is the judgment *knowledge*? Can a belief be justified if the truth-maker ($E$) plays no role in the belief's production, even if they covary?
  *   **Why Upstream:** Epistemology supervenes on metaphysics. You cannot solve warrant until you have solved reference and production.
  *   **Tractability:** Moderate. Armchair epistemology.
  *   **Neglectedness:** High. Most focus on the metaphysics; the epistemology of epiphenomenalism is under-explored.
  *   **Success Criteria:** A defense of introspective knowledge that does not rely on causal theories of knowledge (e.g., a modal or constitutive account).
      *   *Move Up:* If you can show warrant requires causal contact (threatening the project).
      *   *Move Down:* If warrant is shown to be compatible with covariance alone.

  #### 5. The Etiology of the Paradoxical Intuition
  *   **The Task:** Explain why it *feels* like $E$ must cause $J$. Is this a cognitive illusion? A category error? This addresses your question about whether the "felt obviousness" is the primary object of explanation.
  *   **Why Upstream:** I have ranked this *last* deliberately. It is **downstream**. You cannot diagnose an illusion until you know what the truth is. If you solve Items 1–4, you will know whether the intuition is a mistake or a insight.
  *   **Tractability:** Low. Drifts into cognitive science/psychology.
  *   **Neglectedness:** Moderate.
  *   **Success Criteria:** A plausible error theory explaining why we intuit causal efficacy where there is only common cause.
      *   *Move Up:* If Items 1–4 suggest the paradox is entirely verbal/psychological.
      *   *Move Down:* If Items 1–4 suggest the paradox points to a real metaphysical tension.

  ---

  ### The Visitor Strategy (Item 6)

  Do not use your visitor to "discuss the topic." Use them to stress-test **Item 1 (The Causal Constraint on Content)**.

  *   **Who to Invite:** A naturalist philosopher of mind or language who defends a causal/informational theory of content (e.g., someone in the Dretske/Millikan lineage, or a rigorous causal theorist).
  *   **The Goal:** Do not ask them to solve the paradox. Ask them to destroy your solution to Item 1. If your non-causal theory of reference cannot survive a dedicated naturalist critique, the rest of the agenda collapses.
  *   **Timing:** End of Year 1. You need a draft of your position on Item 1 before they arrive.

  ---

  ### Red Herrings and Killer Questions

  **The Red Herring:**
  The **Production Version** (as you initially framed it). Asking "how could an experience... be responsible for the judgment" assumes $E$ must be responsible. Once you accept the Common Cause ($N$ is responsible), the Production question is answered. Pursuing it further is a waste of time unless it bleeds into Aboutness.

  **The Killer Question:**
  **"Is causal contact necessary for singular reference?"**
  *   **If Yes:** Epiphenomenalism is semantically incoherent. We cannot think about qualia if they are inert. You must abandon epiphenomenalism or accept illusionism (we don't actually think about qualia). The paradox is not solved; it becomes an argument against the premise.
  *   **If No:** The paradox dissolves. We can refer to $E$ via covariance or constitution. The "cost" of epiphenomenalism is zero regarding judgment and knowledge.

  **Where the Real Cost Falls:**
  You asked where the epiphenomenalist loses ground. It is not in **predictions** (as you noted). It is in **explanatory naturalism**. The cost is the burden of proving a non-causal theory of content (Item 1) that is compatible with a scientific worldview. If you cannot pay this cost, you lose the right to claim we *know* or *judge* anything about consciousness.

  ### Conditions for Reordering

  1.  **If you find the Causal Constraint is undeniable:** Stop. Abandon the agenda. The project is dead. The paradox is an argument for interactionism or illusionism, not a puzzle to be solved within epiphenomenalism.
  2.  **If you find the "Felt Obviousness" is the only barrier:** If you realize the metaphysics is fine but humans are cognitively wired to misunderstand it, move **Item 5** to the top. This would shift the project from metaphysics to philosophy of cognitive science.
  3.  **If the Common Cause Model fails:** If you find that $N \to E$ and $N \to J$ violates causal exclusion or interventionist causation, move **Item 2** to the top. Without a coherent physical baseline, the rest is speculation.

  ### Final Recommendation

  Spend the first 6 months exclusively on **Item 1**. Write a paper titled *"Reference Without Causation: The Semantic Viability of Epiphenomenalism."* If you cannot defend that title, do not proceed to Item 2. The entire paradox rests on the assumption that reference requires causal grip. Break that assumption, and the paradox breaks with it. Keep the visitor for the end of that period to attempt to refute it. This is the highest-leverage use of your two years.
