answer: |-
  ### Brainstorming Candidate Desiderata

  Before formalizing the theory, we must generate a pool of potential conditions. A robust theory of lottocratic legitimacy cannot rely on intuition alone; it must withstand methodological scrutiny.

  *   **Randomness Integrity:** The selection mechanism must be mathematically random, not merely arbitrary.
  *   **Participation Compliance:** High response rates are needed to prevent non-response bias from corrupting the random sample.
  *   **Information Symmetry:** Members must have access to balanced, expert information to avoid manipulation.
  *   **Preference Aggregation:** The voting rule used by the assembly must not produce cycles or paradoxes (social choice stability).
  *   **Public Acceptance:** The broader populace must accept the authority of the body, or legitimacy is purely theoretical.
  *   **Deliberative Transformation:** The process must allow minds to change, not just aggregate pre-existing views.
  *   **Interest vs. Opinion:** The body should represent what is good for citizens, not just what citizens currently say they want.
  *   **Recursive Stability:** The rules for selecting the body must be stable over time without requiring constant external intervention.
  *   **Minority Protection:** Random majorities can be tyrannical; safeguards are needed.
  *   **Competence Threshold:** Members must possess a minimum capacity to understand the issues.

  *Selection Strategy:* I will filter these into formal desiderata, prioritizing those that bridge the gap between statistical validity (the methodologist's concern) and normative authority (the philosopher's concern). I will discard "Public Acceptance" as a *condition* of legitimacy (since the public can be wrong) and treat it as a *stability* condition. I will discard "Competence Threshold" as a Camp Preference (epistocratic) rather than a Non-Negotiable democratic requirement, provided the process supports competence.

  ---

  ### Desiderata for a Theory of Lottocratic Legitimacy

  A theory of legitimacy for a randomly selected assembly must satisfy the following requirements. Each is marked as **Non-Negotiable (NN)**, meaning the theory fails without it, or **Camp Preference (CP)**, meaning it reflects a specific normative commitment (e.g., egalitarian vs. epistemic).

  #### I. Boundary Cases (The Cases It Must Get Right)

  1.  **The Public Rejection Constraint:**
      *   *Requirement:* The theory must specify whether legitimacy persists if the broader public actively rejects a decision made by the assembly.
      *   *Motivation:* If legitimacy is purely procedural, public rejection is irrelevant. If legitimacy is representative, sustained public rejection suggests a break in the principal-agent link. A theory must define the threshold where "trustee" authority overrides "delegate" instruction.
      *   *Status:* **NN** (The theory must take a stance, even if the stance is that public rejection does not invalidate legitimacy).

  2.  **The Bias Immunity Condition:**
      *   *Requirement:* The theory must invalidate authority if the sample is systematically biased due to differential non-response or self-selection into the candidate pool.
      *   *Motivation:* Methodologically, a biased sample does not support inference to the population. Normatively, if the wealthy or educated opt-out at higher rates, the "random" claim is a fiction that masks oligarchy.
      *   *Status:* **NN**.

  3.  **The Information Environment Integrity:**
      *   *Requirement:* The theory must assess the legitimacy of decisions made under a distorted information environment (e.g., systematic misinformation or withheld evidence).
      *   *Motivation:* Causal inference requires control over confounding variables. In deliberation, information is the confounder. If the input is manipulated, the output (decision) cannot be attributed to the "will of the people" but to the "will of the manipulator."
      *   *Status:* **NN**.

  4.  **The Self-Rule Prohibition:**
      *   *Requirement:* The theory must address whether an assembly can legitimately decide the rules for its own selection or replacement.
      *   *Motivation:* This is the self-constitution problem. If the assembly sets the rules, it creates a closed loop potentially divergent from the constituent power. Legitimacy usually requires an external anchor.
      *   *Status:* **NN**.

  5.  **The Stratification Specification:**
      *   *Requirement:* The theory must distinguish between stratification by demographic category (descriptive) versus political preference or interest (substantive).
      *   *Motivation:* Stratifying by ideology turns the lottery into a proxy election, undermining the anti-factional purpose of sortition. Stratifying by demographics preserves randomness while ensuring inclusion.
      *   *Status:* **CP** (Egalitarians prefer demographic; Pluralists may prefer interest-based).

  6.  **The Agenda Lottery Condition:**
      *   *Requirement:* The theory must evaluate a two-stage lot where the first selects citizens and the second selects which arguments form the agenda.
      *   *Motivation:* Controlling the agenda is often more powerful than voting on the outcome. If the agenda is not random or democratically controlled, the vote is constrained.
      *   *Status:* **NN**.

  #### II. Conceptual Distinctions (The Distinctions It Must Respect)

  7.  **Statistical vs. Deliberative Representativeness:**
      *   *Requirement:* The theory must not conflate being a statistical mirror of the population (distributions match) with being a deliberative microcosm (reasoning processes match).
      *   *Motivation:* A sample can be statistically perfect but deliberatively dysfunctional (e.g., prone to polarization). Legitimacy claims often slide between these two without justification.
      *   *Status:* **NN**.

  8.  **Procedural vs. Epistemic Legitimacy:**
      *   *Requirement:* The theory must clarify whether the authority derives from the fairness of the selection (procedural) or the quality of the decisions produced (epistemic).
      *   *Motivation:* If the assembly makes a catastrophic error, proceduralists say it remains legitimate; epistemists say it loses authority. A coherent theory cannot claim both unconditionally.
      *   *Status:* **CP** (Democratic purists choose Procedural; Reformists choose Epistemic).

  9.  **Selection vs. Decision Legitimacy:**
      *   *Requirement:* The legitimacy of the selection procedure must be distinguished from the legitimacy of the decision rule used within the assembly.
      *   *Motivation:* A perfectly selected body can use a tyrannical voting rule (e.g., unanimity allows one veto, or simple majority ignores minorities). Both stages require validation.
      *   *Status:* **NN**.

  10. **Preferences vs. Interests:**
      *   *Requirement:* The theory must specify whether the assembly represents the expressed preferences of the public or their objective interests.
      *   *Motivation:* Social choice theory shows preferences can be intransitive or ill-informed. If the assembly corrects preferences to match interests, it claims epistemic authority over the public.
      *   *Status:* **CP**.

  11. **Fairness vs. Epistemic Device:**
      *   *Requirement:* The theory must state whether the lot is used to ensure equal opportunity to rule (fairness) or to filter for good decisions (epistemic device).
      *   *Motivation:* These goals can conflict. A fairness lottery includes the incompetent; an epistemic filter excludes them.
      *   *Status:* **CP**.

  #### III. Empirical Consistency (The Results It Must Be Consistent With)

  12. **Sampling Error Acknowledgement:**
      *   *Requirement:* The theory cannot claim the assembly *is* the people; it must acknowledge confidence intervals and sampling error.
      *   *Motivation:* Methodologically, a sample of 500 is never perfectly representative. Legitimacy claims based on "perfect mirroring" are scientifically false.
      *   *Status:* **NN**.

  13. **Social Choice Stability:**
      *   *Requirement:* The theory must account for the possibility that no stable majority preference exists (Arrow's Impossibility implications).
      *   *Motivation:* If preferences cycle, the assembly's decision may depend entirely on the order of voting, undermining the claim that the decision reflects a collective will.
      *   *Status:* **NN**.

  14. **Deliberative Bias Dynamics:**
      *   *Requirement:* The theory must incorporate evidence on whether deliberation amplifies or dampens initial biases (e.g., group polarization).
      *   *Motivation:* If deliberation systematically radicalizes members away from the population mean, the "representative" claim degrades over time.
      *   *Status:* **NN**.

  #### IV. The Counterfactual Problem

  15. **Counterfactual Independence:**
      *   *Requirement:* The theory must establish legitimacy without relying on the unobservable claim that "a different selection method would have produced a worse outcome."
      *   *Motivation:* We cannot observe the counterfactual. Legitimacy must rest on the actual properties of the process, not on comparative superiority which is inherently speculative.
      *   *Status:* **NN**.

  #### V. The Self-Constitution Problem

  16. **Recursive Authorization:**
      *   *Requirement:* If the assembly decides its own replacement rules, the theory must identify the source of authority for *that* specific decision (e.g., a prior constitutional moment).
      *   *Motivation:* Without an external anchor, self-perpetuating bodies drift from their mandate. Legitimacy cannot be self-generating in a closed system.
      *   *Status:* **NN**.

  ---

  ### Joint Unsatisfiability Analysis

  There is a subset of these requirements that is jointly unsatisfiable, creating a "Legitimacy Trilemma" for lottocratic theory.

  **The Trilemma:**
  1.  **Statistical Representativeness of Preferences** (Desideratum 7 & 10): The assembly's preferences must match the population's pre-deliberative preferences to claim descriptive legitimacy.
  2.  **Transformative Deliberation** (Desideratum 14): The assembly must deliberate to improve decision quality, which empirically changes preferences (often away from the population mean due to information asymmetry or group polarization).
  3.  **Counterfactual Independence** (Desideratum 15): Legitimacy cannot rely on the claim that the *new* preferences are "better" than the old ones, because that requires an epistemic standard (violating Procedural Legitimacy) or a comparison to a counterfactual outcome.

  **Analysis:**
  You cannot maintain that the assembly is a statistical mirror of the people (1) while also insisting they undergo a process that predictably alters their views away from the population norm (2), unless you claim those altered views are more legitimate (3). But claiming they are more legitimate invokes epistocracy (violating the fairness camp) or requires comparing outcomes to a counterfactual election (violating Counterfactual Independence).

  **The Self-Constitution Paradox:**
  Additionally, **Desideratum 4 (Self-Rule Prohibition)** and **Desideratum 16 (Recursive Authorization)** create a tension with **Political Autonomy**. If a lottocracy cannot set its own rules without external authorization, it is not sovereign. If it *can* set its own rules, it risks becoming a caste (violating Desideratum 2 regarding bias). A theory cannot simultaneously demand the assembly be fully autonomous and fully constrained by an external popular will without a mechanism for that will to be expressed (which usually requires elections, defeating the pure lottocracy).

  ---

  ### Scoring Familiar Approaches

  *   **Pure Lottocracy:**
      *   *Strengths:* Satisfies Fairness (11) and Selection Legitimacy (9).
      *   *Failures:* Fails Bias Immunity (2) in practice (non-response); struggles with Self-Constitution (4/16) as it lacks a mechanism for constitutional renewal without elections; often ignores Sampling Error (12) by claiming perfect representation.
  *   **Deliberative Polling:**
      *   *Strengths:* Excellent on Information Integrity (3) and Deliberative Bias Dynamics (14).
      *   *Failures:* Fails Public Rejection Constraint (1) as it is usually advisory; fails Decision Legitimacy (9) as it lacks binding authority; struggles with Counterfactual Independence (15) as its value is often argued comparatively against "raw" opinion.
  *   **Epistocracy (Rule of the Knowledgeable):**
      *   *Strengths:* Addresses Competence and Information Integrity (3).
      *   *Failures:* Fundamentally violates Fairness vs. Epistemic Device (11); fails Bias Immunity (2) by design (systematic exclusion); fails Statistical Representativeness (7).

  ---

  ### Summary

  An adequate theory of lottocratic legitimacy must rigorously distinguish between the statistical validity of the sample and the normative authority of the decision, while acknowledging that transformative deliberation inherently degrades descriptive representativeness.

  \answer{Absence of Systematic Selection Bias}
