answer: |-
  **Title:** The House Always Wins (Unless the Sum is Undefined)
  **Characters:** 
  *   **Ada:** A pragmatic decision theorist. Believes expected value (EV) is a tool for action, not a metaphysical truth.
  *   **Ben:** A normative purist. Believes decision theory must be logically coherent even at the limits, or it fails as a guide for rationality.

  ***

  **Ada:** Look, the St. Petersburg Paradox is a ghost story we tell undergraduates. A casino offers you a game where a coin flips until heads. If heads appears on flip $n$, you win $2^n$ dollars. The expected value is $\sum (1/2^n) \cdot 2^n$, which is $1+1+1...$ infinity. So, theoretically, you should mortgage your house to play. But no one does. Why? Because the setup is physically impossible. No casino has infinite bankrolls. No human has unbounded utility for cash. Once you cap the bankroll or the utility function, the expectation becomes finite, and the "paradox" vanishes. Expected value theory is fine; the idealization was just sloppy.

  **Ben:** That's the standard pragmatic dismissal, but it misses the structural rot. You fixed St. Petersburg by bounding the utility, sure. The math there is settled: if $U(x)$ is bounded, the series converges. But that doesn't save Expected Value (EV) theory from incoherence. Consider the Pasadena Game, proposed by Nover and Hájek. The payoff is $2^n/n$, but the sign alternates. Positive for odd $n$, negative for even $n$. The expected value terms become the alternating harmonic series: $1 - 1/2 + 1/3 - 1/4...$

  **Ada:** I know the series. It converges to $\ln(2)$. So the EV is roughly 0.69. Where's the crisis?

  **Ben:** The crisis is that expectation is defined as an integral over a probability space, which requires absolute convergence to be well-defined. The alternating harmonic series is only *conditionally* convergent. By the Riemann Rearrangement Theorem, I can reorder the terms of that sum to equal any real number I like, or diverge to positive or negative infinity. Since the expectation is just a sum over outcomes, and the order of outcomes in a set is arbitrary, the Expected Value of the Pasadena Game is *undefined*. It's not infinite; it's nonexistent. EV theory doesn't give a verdict. It's silent.

  **Ada:** Okay, mathematically, I grant you the conditional convergence. That is settled. But you're treating a mathematical artifact as a decision-theoretic emergency. The Pasadena Game is a constructed monster. It requires payoffs that switch signs and grow specifically to cancel out probabilities. Real decision problems—investing, health policy, career choices—don't have payoff structures that rely on precise cancellation of infinite tails. You're attacking a theory of rational choice with a game no rational agent would ever encounter.

  **Ben:** That's where I have to push back. You say "real decision problems," but that depends on your time horizon. If you care about the long-term future—infinite ethics, or even just very long timelines—the payoff structure changes. Imagine a global health intervention. There's a tiny probability, say $1/2^n$, that this intervention triggers a chain of events saving $2^n/n$ lives. But maybe, in a slightly different causal branch, it leads to a catastrophe of similar magnitude. The signs flip based on complex contingent futures. If we are utilitarian, utility is linear in lives. You can't just say "bounded utility" here without implying that saving a billion lives is morally equivalent to saving a million once you hit a certain cap. That's a repugnant conclusion.

  **Ada:** I agree bounded utility is harder to swallow when the currency is lives rather than dollars. But you're still assuming "Nature" is offering a gamble with a specific mathematical distribution. In the St. Petersburg case, you said "the casino won't offer it." In the Pasadena case, you say "Nature is the casino." You can't have it both ways. If we are talking about real policy, the probabilities aren't exact powers of two. The uncertainty is fuzzy. When the probabilities are imprecise, the precise rearrangement argument loses its grip. We're dealing with error bars, not exact reals.

  **Ben:** Fuzzy probabilities don't solve the undefined expectation; they just smear it. But let's grant your point about lives. Suppose we accept that for some tail-risk scenarios, the EV is genuinely undefined because the positive and negative parts of the integral both diverge. How do you choose? If I have Option A (Pasadena Game) and Option B (Status Quo, EV = 0), EV theory says nothing. You need a decision rule. Are you going to pick a summation order? Do we privilege the temporal order of the flips?

  **Ada:** Why not? Agents are temporal beings. We experience the coin flips in sequence. If the game is played out in time, the natural ordering of the sample space is temporal. Summing in temporal order gives us $\ln(2)$. It's not arbitrary *for us*. It's arbitrary from a God's-eye view of the set of outcomes, but decision theory is for agents, not gods. If the temporal order yields a weak expectation, we use that.

  **Ben:** That's a retreat from the ontology of the gamble to the psychology of the player. The gamble exists as a set of outcome-probability pairs. The "time" of the flip is incidental to the value of the outcome. If you privilege temporal order, you're smuggling an ordering into the definition of the gamble itself. You're changing the object to save the theory. And even if you do that, what about cases where there is no temporal order? Like choosing between two static scientific theories with infinite ethical implications? You can't sum those over time.

  **Ada:** Then we use a different rule. We have "Relative Expectation Theory" or "Weak Expectation." We compare Option A to Option B directly by looking at the difference in their payoff streams, rather than evaluating each in isolation. If the difference converges, you have a verdict. We give up the idea that every option must have a standalone scalar value. We sacrifice *completeness*—the idea that you can always compare any two options—to save coherence.

  **Ben:** Giving up completeness is a massive concession. It means rationality doesn't require you to have a preference between A and B. But in infinite ethics, we *need* a verdict. If one policy has an undefined EV and another has an undefined EV, but the first *dominates* the second in every state, surely rationality demands you pick the first. But if EV is undefined, dominance arguments can fail depending on how you pair the states. If you use Relative Expectation, you're still relying on a specific pairing of outcomes between the two options. That's just summation order in disguise. You haven't solved the arbitrariness; you've just hidden it in the pairing function.

  **Ada:** I'm not hiding it; I'm acknowledging that decision theory is a model. Maps are not territories. If the territory contains actual infinities that break the map, we draw a boundary on the map. We say, "For the purposes of action, we treat tails beyond $n=100$ as negligible." It's not a metaphysical claim that those outcomes don't exist. It's a pragmatic claim that our cognitive architecture cannot act on them. You want a decision theory that is true; I want one that is useful. If the Pasadena Game breaks the system, we classify it as a pathologist's specimen, not a guide for living.

  **Ben:** But if the system breaks at the limits, it tells us the system is incomplete *at the core*. If EV theory works for finite cases but collapses when we consider the possibility of infinite value—and given we can't rule out infinite value in ethics or physics—then EV theory isn't the fundamental norm of rationality. It's an approximation. You're saying "use a different decision rule," but that admits EV wasn't the rule to begin with. The contested question isn't the math; we agree on the divergence. The question is whether a theory that fails on infinite cases can govern finite ones without contamination. If my ethical framework allows for non-zero probability of infinite value, the Pasadena problem infects *every* decision I make, not just the exotic ones.

  **Ada:** Then the error is in the ethical framework allowing infinite value, not the decision theory. But I'll concede this: we aren't going to agree on whether the breakdown is a bug or a feature. You see the undefined EV as a proof that rationality is more complex than maximization. I see it as proof that maximization is robust enough to ignore cases that never happen.

  **Ben:** And I see that as dangerous. Because in a world of existential risk, the cases that "never happen" are exactly the ones that matter most.

  ***

  ### **Editor's Note: What's Settled vs. What's Contested**

  To ensure the math doesn't get lost in the philosophy, here is the breakdown of the arguments above:

  **Settled Mathematics:**
  *   **St. Petersburg Divergence:** It is mathematically settled that the standard St. Petersburg game has an infinite expected value ($\sum 1 = \infty$).
  *   **Bounded Utility:** It is settled that if an agent's utility function is bounded (e.g., $U(x) < M$ for all $x$), the St. Petersburg expected utility becomes finite.
  *   **Pasadena Convergence:** It is settled that the Pasadena Game's expected value series is *conditionally convergent*. It is not absolutely convergent.
  *   **Riemann Rearrangement:** It is a theorem that conditionally convergent series can be rearranged to sum to any real number or diverge. Therefore, without a privileged ordering, the Expected Value is undefined.

  **Genuinely Contested Philosophy:**
  *   **The Relevance of Idealization:** Ada argues that physically impossible games (infinite bankrolls) invalidate the paradox. Ben argues that structural incoherence (undefined EV) matters even if the specific game is rare.
  *   **Bounded Utility in Ethics:** Ada suggests bounded utility is a pragmatic necessity. Ben argues that in the context of lives saved (infinite ethics), bounded utility leads to morally repugnant conclusions (saturation of value).
  *   **Privileged Summation Order:** Ada suggests temporal order or outcome pairing provides a non-arbitrary way to sum. Ben argues this smuggles external structure into the definition of the gamble and fails for atemporal choices.
  *   **Completeness vs. Coherence:** Ada is willing to drop the *Completeness* axiom (some options are incomparable) to preserve the rest of decision theory. Ben argues this leaves rationality too weak to guide action in high-stakes scenarios.
  *   **Normative Status of EV:** There is no consensus on whether Expected Value Maximization is the fundamental norm of rationality or merely a useful approximation for finite contexts. Serious decision theorists (e.g., Easwaran, Nover, Hájek, Chen, Rubio) are actively publishing on both sides of these distinctions.
