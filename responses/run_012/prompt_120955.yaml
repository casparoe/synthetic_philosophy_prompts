answer: |-
  The light in the room was failing, turning the dust motes into slow-moving gold. Elias adjusted the curtain, not to block the sun, but to frame it. He liked the geometry of the window pane against the yard outside. It was a static view, a slice of the block universe.

  Claire lay in the hospital bed set up in her living room. She was smaller than he remembered, the cancer having eaten the margin of error from her body. She watched him fix the curtain with eyes that were tired but sharp.

  "You're still treating the room like a proof," she said. Her voice was thin, raspy.

  "Someone has to check the axioms," Elias said. He sat in the armchair opposite her. He had brought a notebook with him. It was black, cheap, the kind sold in packs of five at the stationery store. It sat on his knee like a burden.

  "Elias," she said. "We talked about this. I don't want the logician's comfort. I want my daughter. I want Tuesday."

  "Tuesday is a coordinate," Elias said. "You are treating it as a destination."

  "I am treating it as where I live." She shifted, wincing. The morphine pump hummed on the stand beside her. "You came to tell me I'm not dying. I know your position. You've held it for forty years. Eschatological rationalism. I read the papers."

  "Then you know I do not claim you will continue in time."

  "Exactly." She closed her eyes for a moment, breathing through the pain. "You claim I will persist *outside* it. Which is indistinguishable from being dead, except you've added adjectives."

  Elias opened the notebook. He shouldn't have brought it. It was private, the scratchwork behind the published papers, the place where the rigor slipped and the hope showed through. But he needed her to see the structure, not just the conclusion.

  "Consider the machine," Elias said. "You know the argument. If the mind were a finite machine, there would be arithmetical propositions it could not decide. Yet we can see the truth of them from outside the system."

  "I know the Lucas-Penrose argument," Claire said. "I taught it to undergraduates. It's controversial. But even if you're right, even if the mind is not a machine... so what? You're not a calculator. You're a biological process. When the biology stops, the process stops. Non-computable doesn't mean immortal."

  "It means not bound by the rules that govern the finite," Elias said. "If I am not a machine, I am not subject to the entropy that degrades machines. The first plank is not about power. It is about category. I am not a thing that wears out. I am a perspective that apprehends truth."

  "A perspective needs an eye," Claire said. "The eye is rotting, Elias."

  "The eye is the access mode. Not the viewer." He leaned forward. "This is the second plank. You are a physicist. You know the models. Closed timelike curves. The block universe. Time is not a river that carries us away. It is a dimension like height. You are not moving toward death. You are extended across time. The 'now' is just where your consciousness is focused, like a flashlight beam on a map."

  "The flashlight turns off," she said.

  "Does it? Or does it just stop moving?" Elias tapped the notebook. "If time is not fundamental, then cessation is not fundamental. Death is not an event in the world. It is a limit of the observer's path. You do not cease. You simply cease to traverse."

  Claire opened her eyes. They were wet. "This is cold, Elias. You're telling me my life is a statue. I'm just... there. All of it. The pain, the joy, the end. It's all carved in stone. And you call this comfort?"

  "I call it accuracy," he said. "But there is the third plank. The identity." He hesitated. This was the hardest part. "You are not a stream of experiences. That is the Humean error. You are a monad. A center of perspective. Individuated by your point of view, not by your history."

  "So I have no windows," she said. "Leibniz. I remember. Monads don't interact. If I'm a monad, I don't know you. You don't know me. We're just solitary dots reflecting the same universe."

  "Exactly," Elias said. "There are no causal windows. But there is pre-established harmony. We coincide."

  "If I don't know you," Claire said, her voice tightening, "then *I* don't survive. The thing that loves my daughter, the thing that fears this pain... that thing is a temporal stream. Cut the stream, the love stops. If the 'real me' is some timeless dot that doesn't experience connection, then you've saved a shell and killed the person."

  Elias felt the pressure in his chest. This was the objection he had fought off in the dark hours of the night. The leap from *not a machine* to *not mortal* was the bridge he had built over a chasm, and now she was pointing out that the bridge led to an empty room.

  "The fear of death," Elias said quietly, "is the fear of non-existence. But existence is not duration. To exist is to be true. If you are a truth-bearer, you cannot be false."

  "I'm a mother," she said. "Not a theorem."

  Elias looked down at the notebook. He had promised himself he would never show her this page. It was too vulnerable. It relied on a wish disguised as a deduction. But the silence in the room was heavy, and the argument was failing to touch the flesh of the situation.

  "There is a fragment," he said. "I never published it."

  Claire watched him. "Read it."

  "It is not finished." He turned the pages. The paper was creased. There were coffee stains on the margin. He found the page. The handwriting was jagged, hurried.

  *"Proposition: If the actual world is rationally ordered..."* He stopped.

  "Go on," she said.

  *"If the actual world is rationally ordered and contains minds capable of grasping their own limits, then a world that contains such a mind must also contain the conditions of that mind's persistence."* He looked up. "On pain of containing a truth it cannot accommodate."

  Claire stared at him. "Say that again."

  "If you can understand the limit of the system," Elias said, "you are outside the system. But if the world is rational, it cannot contain a subject that is excluded from its own order. If you can know the truth of your own finitude, the reality that holds that truth must be infinite. Otherwise, the truth is larger than the container. That is a contradiction."

  "So," Claire said slowly. "Because I can know I'm dying, the universe must be big enough to keep me?"

  "Because the knowledge is real," Elias said. "The object of knowledge must sustain the knower. A fixed point. The mind grasps the whole, so the whole must hold the mind."

  "It's circular," she said. But her voice was softer.

  "It is self-referential," he corrected. "Like any truth about truth."

  "It's beautiful," she said. "And it's desperate."

  Elias flinched. He closed the notebook. "Is it?"

  "You want it to be true," she said. "You're not arguing for me. You're arguing for yourself. If I go, who tests your axioms? If I'm just a monad without windows, you're alone in your harmony."

  Elias looked at the window. The sun was gone now. The room was blue. "The distinction matters," he said. "Between survival as continuation... and survival as inclusion. If you are included in the timeless order, grief is not the loss of the person. It is the loss of the access mode. I will not see you. But you are not gone."

  "That doesn't help the grief," Claire said. "Grief is temporal. It happens in time. You're offering me a metaphysical consolation prize. 'Don't worry, you're eternally present in the block universe.' I want to be here. With her. With you."

  "I know," Elias said. "I cannot give you time. I can only offer you the structure."

  "Structure doesn't hold hands."

  She coughed, a racking sound that doubled her over. Elias stood, instinctively reaching for her, but stopped. Physical contact was causal. He was a monad; she was a monad. No windows. He sat back down.

  "The notebook," she said, wiping her mouth with a tissue. "You keep it because you don't believe it."

  "I keep it because it is the only proof I have," Elias said. "Of the better world."

  "A fixed point for the better world," she repeated. She looked at the black book on his knee. "You think if you write it down firmly enough, it locks reality into place."

  "I think that if the world is rational, it must accommodate the reasoner."

  "And if it isn't rational?" Claire asked. "What if it's just noise? What if the mind is just a spark in the dark, and when it goes out, there's nothing to hold it?"

  Elias looked at her. He saw the fear there, not for herself, but for the emptiness of the claim. He saw the house of cards. He had built a cathedral of logic to house a ghost, and now the ghost was asking if the walls were made of wind.

  "Then the argument fails," Elias said. "And we are finished."

  "And you?" she asked. "If I'm nothing but a statue in the block, and you're a monad without windows... do you fear death?"

  Elias thought about the question. He thought about the incompleteness theorems, the closed timelike curves, the silent, windowless centers of perspective. He thought about the notebook, and the shame of needing it to be true.

  "I fear the loss of access," he said. "I fear not being able to verify the truth."

  "Verification is temporal," Claire said. "You need time to check the proof."

  "Then perhaps," Elias said, "death is just submitting the final draft."

  Claire smiled. It was a small smile, tired and sad. "You're impossible."

  "I am consistent."

  "You're lonely," she said.

  She shifted her head on the pillow. The light was almost gone. The room was settling into the shadows. The hum of the pump was the only sound that marked the passage of seconds.

  "Leave the notebook," she said.

  Elias hesitated. "It is not finished."

  "Leave it. Maybe my daughter will like the pictures. Or maybe she'll burn it."

  Elias placed the black book on the table beside the bed. It looked small against the medical equipment, against the bottles of medicine, against the reality of the dying body.

  "I will stay," Elias said. "Until you sleep."

  "Stay," she said. "But don't talk about the block universe. Just sit."

  Elias sat. He did not speak. He watched the rise and fall of her chest. He thought about the stream of experiences she valued, the temporal flow he dismissed. He thought about the monad inside her, the windowless point that he claimed was immortal. He wondered if it felt lonely too.

  Outside, the streetlights came on. Inside, the shadows lengthened. The argument hung in the air between them, unresolved, neither proven nor disproven, waiting for a verification that neither of them could perform. Elias folded his hands. He waited. He did not know if he was waiting for her end, or for the moment when the access mode would shift, and he would see whether the structure held.

  He looked at the notebook. It was closed. It said nothing. It waited, like him.
