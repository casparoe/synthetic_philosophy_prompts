prompt: |-
  I host a small interview podcast on philosophy of mind, and next week's guest defends a view about belief attribution to AI that I want to press hard on. Her line is that we are warranted in attributing beliefs to a large language model exactly when the intentional stance earns its keep — when treating the system as a believer yields counterfactual predictions that the design stance (architecture, training corpus, optimization objective) cannot match — and she regards "it's just a stochastic parrot" as a non-answer rather than an objection. Draft eight interview questions that get past her restating that criterion. At least one should press on whether a system whose verbal dispositions are not robust under paraphrase, retraining, or trivial scaffolding changes can satisfy the criterion at all; at least one should press on where the believer is supposed to be located, given that what users interact with is the model plus retrieval, tools, and memory rather than the weights alone; and at least one should press on the gap between what the model says about its own beliefs and what actually predicts its behavior. For each question, supply the follow-up keyed to the answer she is most likely to give, and state what she would have to concede for the question to have landed. Do not ask anything that would work equally well for any AI ethics guest — every question should turn on the content of the criterion itself.

  Return the result as a JSON object with the following fields: "episode_frame" (two or three sentences I can read as an introduction); "questions" (an array of objects, each with "question", "presses" naming the specific commitment it targets, "likely_reply", "follow_up", and "concession" stating what would count as a real concession); and "closing_question" (a single question that forces her to say what evidence would disconfirm the attribution).
