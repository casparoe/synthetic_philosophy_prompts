answer: |-
  Here is the breakdown based on your constraints: conceptual work, no empirical/simulation capacity, aiming for upstream impact.

  ### Criteria for Ranking
  1.  **Upstreamness:** Does answering this dissolve downstream debates (e.g., specific counterexamples) rather than just settling one?
  2.  **Conceptual Tractability:** Can this be advanced via argument and analysis alone, without needing data to adjudicate?
  3.  **Field Impact:** Does this matter to game theorists, ethicists, and social scientists, or just to Lewis exegesis?

  **Tension:** The most upstream questions (meta-normative) are often the least tractable because they bleed into general metaethics. The most tractable questions (defining terms) often lack impact. The sweet spot is the *mechanism of transition* between descriptive regularities and normative forces.

  ### The Rankings

  **1. The Normative Gap: How do mutual expectations generate obligations?**
  *   **The Question:** Lewis explains why I *expect* you to drive on the left. He does not explain why I feel *entitled to blame* you for driving on the right. What specific ingredient transforms a predictive equilibrium into a normative standard?
  *   **Why First:** This is the core of your worry. It is maximally upstream. If you solve this, you either fix Lewis or justify abandoning him for a hybrid model. It is purely conceptual (analyzing the structure of "ought" vs. "will").
  *   **Contestation:** Live fight. Bicchieri argues normative expectations are a separate condition added to Lewis. Others (like Brennan & Eriksson) argue normativity is emergent from the dynamics. Moral realists say norms aren't conventions at all.
  *   **Tractability:** High for a writer. Requires mapping logical conditions, not running sims.

  **2. The Arbitrariness Condition: Must conventions be arbitrary?**
  *   **The Question:** Lewis insists conventions are arbitrary (another equilibrium could have worked). Queueing feels non-arbitrary (it's fair). If a norm is moralized, does it cease to be a convention? Is there a spectrum?
  *   **Why Second:** This defines the boundary of your field. If moralized norms aren't conventions, your project shifts to "The Relationship Between Conventions and Norms." If they are, you must redefine arbitrariness.
  *   **Contestation:** Highly contested. Some defend "impure conventions" (partially arbitrary). Others insist arbitrariness is the *sine qua non* of convention, meaning moral norms are a different category entirely.
  *   **Tractability:** High. This is conceptual analysis of case studies (queueing vs. driving).

  **3. The Stability Problem: Why do norms survive incentive shifts?**
  *   **The Question:** Lewisian conventions collapse if preferences change. Norms often persist even when defection is cheap and unpunished. Is this "internalization" or a different equilibrium concept?
  *   **Why Third:** This addresses your "non-equilibrium" worry. It is slightly downstream of #1 because you need to know what a norm *is* before explaining why it *sticks*.
  *   **Contestation:** Live fight between rational choice theorists (who try to model internalization as utility) and sociologists (who reject the rational actor model here).
  *   **Tractability:** Medium. Harder to solve without sims, but conceptual models of "preference transformation" exist.

  ### Consensus vs. Live Fights
  *   **Settled:** Lewis's 1969 *original* formulation is insufficient to explain moralized norms or internalization. No one serious claims the raw text of *Convention* solves the "ought" problem.
  *   **Live Fight:** Whether Lewis's framework is *salvageable*.
      *   **Camp A (Extensionists):** Add conditions (like normative expectations) to Lewis (e.g., Bicchieri).
      *   **Camp B (Separatists):** Conventions and Norms are distinct kinds; trying to unify them is a category error.
      *   **Camp C (Evolutionists):** The distinction is historical; conventions *become* norms over time via specific mechanisms.
  *   **Danger Zone:** Do not present the "Extensionist" view as consensus. Many philosophers reject the idea that normativity can be grounded in equilibrium alone.

  ### Criteria Tensions
  *   **Upstreamness vs. Tractability:** Question #1 is the most upstream but risks becoming pure metaethics (which might drift from your game-theory roots). Question #2 is safer but risks being merely definitional.
  *   **Impact vs. Precision:** A broad theory of normativity (#1) impacts ethics and political philosophy but is harder to defend. A precise fix to the arbitrariness condition (#2) impacts game theory specifically but might be ignored by ethicists.

  ### What Moves Them Up or Down?
  *   **Move #1 Down:** If you find yourself doing metaethics (defining "ought" generally) rather than social ontology (defining "social ought").
  *   **Move #2 Up:** If you discover the field is stalled because everyone is using different definitions of "convention."
  *   **Move #3 Up:** If you find a logical proof that internalization is incompatible with rational choice, forcing a paradigm shift.

  \answer{How do descriptive equilibria become normative obligations?}
