  I've been going down a rabbit hole on Lewis-style conventions and how norms evolve, and I want to know where the actually-valuable open questions are. My situation: about a year of part-time writing, no lab and no simulation shop, just reading and arguing, and I'd rather work on something upstream than add one more clever counterexample. My nagging worry is that the Lewis picture is great for which side of the road you drive on and then falls apart the moment a convention gets moralized: nobody thinks you're a bad person for driving on the left in Britain, but plenty of people think you're a bad person for breaking a naming convention, a queueing convention, a courtesy convention, and it's not obvious where that ought comes from in a story thats all mutual expectation plus self-interest. The mirror image bothers me too — some norms don't look like equilibria at all, people follow them even when defecting would be cheap and unpunished, which is the one thing a convention story can't explain.

  So which open questions here (convention vs. norm, evolution of norms, the normativity of convention, whatever you think the real joints are) are most worth the year, and in what order? Rank them, tell me the criteria you're using — upstreamness, tractability for someone doing conceptual work rather than experiments, how much other work hangs on the answer — and where those criteria pull against each other. What would move something up or down the list? Skip the reading list, I'll find the papers myself.

  Be upfront about what's genuinely settled versus what's a live fight among people who know the material; don't dress a contested view up as consensus. Last line: \answer{...} with the one question you'd bet on, in under ten words.
