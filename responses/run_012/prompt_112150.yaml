  There is no single, canonical term in political theory that captures this specific tripartite configuration (asymmetrical defense, normative-descriptive oscillation, and genealogical fluidity) as a unified mechanism. However, your description is precise enough that it maps onto a convergence of several critical traditions.

  The phenomenon you describe is the rhetorical engine of **Civilizational Exceptionalism**, but that term names the *claim* rather than the *argumentative mechanism*. In critical race theory and post-colonial studies, this is often treated as a feature of **Liberal Imperialism** (Uday Singh Mehta, Karuna Mantena) or **Ideal Theory** (Charles Mills), but again, these name the political project, not the logical topology.

  The closest existing colloquialism in contemporary theory is the **Structural Motte-and-Bailey**. However, you are correct to reject the standard "Motte-and-Bailey" label: that fallacy implies individual bad faith or ad hoc redefinition. What you are describing is a *sociological* and *discursive* structure that operates across speakers and texts, often sincerely, sustained by the institutional habits of the discipline.

  Since no established term suffices, I propose we coin a term that captures the defensive, systemic, and boundary-policing nature of the move.

  ### Proposed Term: **Asymmetrical Conceptual Immunity (ACI)**

  **Definition:**
  Asymmetrical Conceptual Immunity is a discursive mechanism used to protect a civilizational or political identity from empirical falsification. It functions by granting a core set of concepts (e.g., "Western values") **immunity** from counter-evidence through two asymmetrical operations:
  1.  **Internal Assimilation:** Empirical failures within the identity group are categorized as *deviations* from the concept (normative idealization).
  2.  **External Exclusion:** Conceptual parallels outside the identity group are categorized as *incommensurable* (contextual particularism).

  This immunity is sustained by a **Normative-Descriptive Shuttle**, where the concept oscillates between a report on actual beliefs (to claim ownership) and a standard of aspiration (to claim purity), alongside **Genealogical Fluidity**, where the historical criteria for the concept shift to exclude threats.

  ---

  ### The Carving: What ACI Is and Is Not

  To ensure this term does the work you need, we must distinguish it from its nearest neighbors.

  #### 1. ACI vs. The Motte-and-Bailey Fallacy
  *   **Similarity:** Both involve retreating to a defensible position (the "Motte" of aspiration) when attacked and occupying a controversial position (the "Bailey" of uniqueness/reality) when safe.
  *   **Distinction:** The Motte-and-Bailey is typically analyzed as an *individual* rhetorical tactic involving *conscious* or *negligent* equivocation. ACI is *structural*. It does not require a single speaker to be inconsistent; the inconsistency is distributed across a discourse community. One speaker may sincerely hold the normative view, another the descriptive view, and the "system" of the seminar or conference sustains the immunity between them.
  *   **Boundary:** If a single speaker explicitly redefines a term mid-argument to escape a counterexample, that is Motte-and-Bailey. If the redefinition is inherited from the literature and applied systematically to protect a civilizational identity, it is ACI.

  #### 2. ACI vs. Invented Traditions (Hobsbawm & Ranger)
  *   **Similarity:** Both acknowledge that the "tradition" being defended is constructed rather than organic.
  *   **Distinction:** "Invented Tradition" describes the *origin story* of a practice or value. It explains how the list was made. ACI describes the *defensive maintenance* of that list once challenged. An invented tradition can be exposed historically without necessarily triggering the immune response; ACI is the specific set of moves deployed *when* the invention is questioned.
  *   **Boundary:** A historian showing that a "traditional" ceremony was created in 1920 is exposing an Invented Tradition. A theorist arguing that 1920s ceremonies don't count as "real" tradition because they lack "spiritual continuity," while simultaneously arguing that a 17th-century ceremony *does* count despite a lack of continuity, is deploying ACI.

  #### 3. ACI vs. Essentially Contested Concepts (Gallie)
  *   **Similarity:** Both deal with concepts that admit of multiple valid interpretations.
  *   **Distinction:** Gallie's framework assumes a level playing field where competing conceptions are acknowledged as legitimate rivals within the same concept (e.g., "social justice" vs. "libertarian justice" are both "justice"). ACI denies the legitimacy of the rival conception *based on its origin*. In ACI, the "Western" conception is the *only* true conception; the "Islamic" or "Chinese" conception is not a rival interpretation but a *different category entirely*.
  *   **Boundary:** If two theorists argue over whether "liberty" means negative or positive freedom, that is Essential Contestation. If one argues that negative freedom is "true liberty" and the other's positive freedom is "actually Asian collectivism," that is ACI.

  #### 4. ACI vs. Ideal Theory (Charles Mills)
  *   **Similarity:** Mills argues that liberal theory uses "idealization" to ignore oppression (internal) and assume non-ideal conditions for others (external). This is the closest existing theoretical match.
  *   **Distinction:** Mills' critique is primarily about *substantive* political theory (how we model justice). ACI is about *conceptual history* and *identity formation* (how we define "The West"). Mills explains *why* the theory ignores race; ACI explains *how* the concept of "Western Values" survives the accusation of racism.
  *   **Boundary:** Using a model of society that assumes full compliance to derive principles of justice is Ideal Theory. Using the failure of actual Western societies to comply with those principles as proof that they are "not truly Western" is ACI.

  ---

  ### Boundary Cases: Where ACI Becomes Unclear

  To test the utility of the term, consider these two boundary cases where it is genuinely unclear whether ACI is present.

  **1. Religious Orthodoxy**
  *   *Scenario:* A theologian argues that the Inquisition was a betrayal of "true Christianity" (Internal Assimilation) and that Buddhist compassion is not "true charity" because it lacks a relationship to God (External Exclusion).
  *   *Verdict:* **Not ACI.** This is **Dogmatic Boundary Maintenance**. ACI is specific to *secular* or *civilizational* political identities that claim universal rationality. Religious orthodoxy admits to revelation and authority as its basis; ACI disguises its exclusivity as rational or historical necessity. If the theologian claims their view is the "Enlightenment view" of religion, ACI kicks in.

  **2. Constitutional Patriotism**
  *   *Scenario:* A proponent of German *Verfassungspatriotismus* argues that Nazi crimes were a betrayal of the "better Germany" (Internal Assimilation) but that American constitutionalism is different because it is based on common law rather than civil law (External Exclusion).
  *   *Verdict:* **Unclear / Borderline.** This becomes ACI only if the genealogical criteria shift. If the proponent argues that "constitutionalism" is uniquely German when challenged by the US, but "universal" when challenged by the GDR, it is ACI. If they maintain a consistent legal-theoretical distinction (civil vs. common law) regardless of the challenger, it is simply **Comparative Political Theory**. The test is the *shifting* of the criterion (Feature 3 of your description).

  ### Why This Label Matters for Your Work

  Using **Asymmetrical Conceptual Immunity** allows you to avoid accusing interlocutors of bad faith (which shuts down conversation) while still identifying the structural rigging of the debate. It shifts the burden from the *sincerity* of the speaker to the *topology* of the discourse.

  It allows you to say: *"This argument relies on Asymmetrical Conceptual Immunity. It treats internal violations as anomalies to preserve the normative ideal, while treating external parallels as incommensurable to preserve the descriptive uniqueness. To proceed, we must fix the criteria of the concept: are we discussing historical practices or normative aspirations? And if the latter, on what grounds do we claim exclusive ownership of them?"*

  This carving respects the sophistication of the texts you are reading while giving you the leverage to dismantle the move without triggering defensive meta-argumentation about "Western-bashing." It treats the phenomenon as a mechanical feature of the discourse, which is precisely how you described it.
