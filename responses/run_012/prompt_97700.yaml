prompt: |-
  I'm in a grad seminar on vagueness and we keep going in circles on the sorites. One friend is a committed supervaluationist, another is an epistemicist, and I'm bored of both. I've been reading a bit about non-transitive entailment—the idea that A entails B and B entails C can both hold while A entails C fails—and it struck me it might actually fit the sorites better than fiddling with truth-value gaps or positing unknowable sharp boundaries. I want you to act as a philosopher of logic who works on non-classical consequence and vague predicates, and make the strongest case you can that the sorites paradox should be solved by rejecting transitivity of entailment rather than by rejecting bivalence or by positing hidden boundaries. Start with a short brainstorm of the main families of solution and what each is trying to preserve, then build the argument. Be concrete: use a sorites series (grains of sand, or seconds in a person's life, or whatever) and show exactly where transitivity fails and why that isn't just a verbal dodge. Address the obvious objection that if entailment isn't transitive we lose the ability to chain reasoning, and say whether that loss is acceptable or whether we can keep a restricted transitivity for non-vague predicates. Also say whether this is really a solution to sorites or just a relocation of the problem into the logic.

  I don't want a survey or a bibliography—no reading lists, no citations, just the argument. And I want it to be self-critical: at the end, tell me what would change your mind. Which result, counterexample, or consideration would make you give up the non-transitive entailment line, and where is your reasoning most likely to fail? If you think the position is ultimately untenable, say so and explain why, but still give the strongest version first. Keep it somewhat informal but rigorous; I'm trying to see whether this is a live option or just a clever trick. Take your time and don't just give me the standard taxonomy.
