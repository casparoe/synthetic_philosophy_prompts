  3.  **Developing the Non-Transitive Argument:**
      *   *Core Intuition:* Vagueness is about *tolerance*. If $x$ is $F$, and $y$ is indistinguishable from $x$ regarding $F$-ness, $y$ should be $F$. This is a local constraint.
      *   *The Problem:* Tolerance + Transitivity = Disaster. If $a_1 \to a_2$, $a_2 \to a_3$, ..., $a_{99} \to a_{100}$, transitivity forces $a_1 \to a_{100}$. But $a_1$ is clearly $F$ and $a_{100}$ is clearly not.
      *   *The Move:* Accept the local steps ($a_i \models a_{i+1}$) but deny the global step ($a_1 \models a_{100}$).
