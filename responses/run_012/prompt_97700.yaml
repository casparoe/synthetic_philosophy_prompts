      *   *Supervaluationism:* Keeps classical logic for "supertruth" but allows truth-value gaps. The induction premise is false (or lacks truth value) because there's a cutoff in every precisification, though it varies. *Preserves:* Classical validities (mostly). *Cost:* Truth-value gaps, weirdness about "true but not supertrue."
