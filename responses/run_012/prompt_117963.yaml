  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, does MinEnt always yield 1/2?* Yes, if the constraint is $P(H|R)=1$ and we minimize cross-entropy from the prior.
      *   *Does Conditionalization always yield 1/3?* Yes, if the evidence is $E = R \to H$ (material) and $P(E)=1$.
