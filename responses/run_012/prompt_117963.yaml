          2.  *Generalized Updaters (MinEnt/Van Fraassen):* Evidence can be a constraint on probabilities. We should minimize information gain subject to constraints. Result: 1/2. (Van Fraassen, Williams).
          3.  *Pragmatic/Mechanism Contextualists:* The problem is ill-posed without a protocol. The probability depends on the selection mechanism of the message. (Gricean pragmatics, Titelbaum, Hartmann).
