  **THE STILLNESS COLUMN**
  **By Ellis Vane**

  *Peace is not an addition. It is a subtraction. Write to me at The Stillness Column.*

  **Dear Ellis,**
  My son is failing math. I feel a physical ache in my chest when I think about his future. I want to hire tutors, yell at his teachers, make sure he succeeds. Is this ache love? Should I follow it?
  **— Anxious in Akron**

  **Dear Anxious,**
  That ache is not love. It is craving. You are imagining a future where he succeeds and feeling relief, then imagining one where he fails and feeling pain. But notice: if he succeeds, you do not gain anything positive. You merely return to neutral. The relief you anticipate is just the cessation of the pain you feel now. If you can sit with his failure without craving a different outcome, the ache vanishes. Let him fail. Keep your chest quiet. That is the only success that matters.

  **Dear Ellis,**
  I read your column because I want to stop wanting things. I want to be tranquil. But isn't wanting to be tranquil just another want? I feel like I'm chasing a horizon that moves away when I walk toward it.
  **— Chasing in Charlotte**

  **Dear Chasing,**
  You have identified the trap. You are treating tranquility as a goal, like a promotion or a new car. But tranquility is not a destination; it is the absence of the walk. Your desire to stop wanting is itself a want, and it is causing you suffering. Do not try to become tranquil. Simply notice that the effort to become something else is the noise you wish to silence. Put down the column. Stop trying to fix yourself. There is nothing broken except the urge to repair.

  **Dear Ellis,**
  I need to understand your motive. You say all craving is suffering and satisfaction is just a return to zero. So why do you write this? Do you not crave a world where people read your advice and stop suffering? If you don't crave that, why type the words? If you do, aren't you suffering?
  **— Logic in Lincoln**

  **Dear Logic,**
  When a window rattles in the wind, I do not "crave" silence. I simply secure the latch to stop the noise. Your questions are rattles. I answer them to reduce the vibration in the room. I do not envision a better world where you are fixed. I only address the disturbance present now. When you stop writing to me, I will not feel accomplishment. I will feel nothing. That is why I write: so that eventually, no one writes at all.

  **Dear Ellis,**
  I tried your method. I stopped caring about my job, my relationships, my hobbies. I don't suffer, but I also don't feel much of anything. I feel like a piece of furniture. Is this distinguishable from being dead? What is the point of a life without drive?
  **— Numb in Newark**

  **Dear Numb,**
  You are comparing your state to a life of drive, assuming drive adds value. It does not. Drive is a deficit. You feel like furniture because you are expecting to feel like a storm. But storms are destructive. A chair does not suffer because it does not want to be a table. You ask what the point is. There is no point. Points are destinations for those who are lost. You are here. The absence of suffering is not death; it is the only condition under which life does not hurt. Remain furniture. It is very quiet here.
