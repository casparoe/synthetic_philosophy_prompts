answer: |-
  The air conditioning in Room 304 had died on Tuesday, and it was now Friday afternoon. The heat sat heavy in the room, mixing with the smell of stale coffee and the ozone hum of the local GPU cluster running hot down the hall. On the whiteboard, cramped between a decay curve and a list of funder names, were two plots. They looked identical to the untrained eye: heatmaps of attention scores across twenty-four layers, bright yellow bands flaring in the middle layers, fading to blue at the output.

  Case 44 and Case 45.

  Both had been flagged by the anomaly detector. Neither had produced an output anyone would notice; both were mundane completions of mundane prompts. But the detector didn't care about the output. It cared about the route. It claimed the model had taken a path through its weights that looked qualitatively unlike the paths taken on ninety-nine per cent of the distribution.

  'We're calling them the same mechanism,' Jordan said, capping a dry-erase marker with a sharp click. Jordan was the project lead, and the deadline for the audit report was Monday morning. 'If we don't, we have to write up two separate sections. We don't have the space.'

  Sam leaned forward, elbows on knees. Sam cared about interventions. If you poked the model and it flinched the same way, Sam said it was the same thing. 'Functionally, they're identical. I patched the attention head from 44 into 45 this morning. The output shifted exactly as predicted. The causal graph holds. It's a copying circuit.'

  'It is not a copying circuit,' Dr. Aris Thorne said. Thorne was the postdoc who had joined us from an evolutionary developmental biology lab three months ago. She hadn't spoken for an hour, but now she stood up and walked to the board. She tapped the yellow band in Case 45. 'Look at the spread. In 44, the activation is concentrated in heads 12 and 14. In 45, it's 12, 14, and a bleed into 15. The output is the same because the downstream layers compensate. But the ancestry is different.'

  'Ancestry?' Jordan rubbed his temples. 'Aris, these are weights. They don't have ancestors. They have initialisation seeds.'

  'They have trajectories,' Thorne said. Her voice was quiet but cut through the hum of the server rack. 'During training, the gradient descent path that formed the circuit in 44 diverged from the path that formed 45. You are looking at the adult phenotype. I am looking at the embryonic tissue. In my old lab, we had a gene that built eyes in mice and eyes in flies. Structurally, entirely different. Genetically, the switch was the same. Deep homology. If you call these the same mechanism, you are saying the phenotype is all that matters. You are ignoring the switch.'

  I was sitting on the floor, leaning against the server cabinet that served as our makeshift storage. I was the third-year PhD student, which meant I was the one who would actually have to write the code to formalise whatever definition we agreed on. 'If we define by homology,' I said, 'we have to trace the weights back to initialization. That means auditing every checkpoint between start and finish. We can't do that by Monday.'

  'Then we define by function,' Sam said. 'Interventionist criterion. I change the part, the behaviour changes. I change the behaviour, the part changes. That's the mechanism. Everything else is metaphysics.'

  'It's not metaphysics if the detector breaks next quarter,' Thorne countered. She turned to face us. The heat made her hair stick to her forehead. 'If we ship a functional definition, we are saying that any two circuits that produce the same output via different internal routes are the same. Next month, the model drifts. The weights shift slightly. The function holds, but the structure rots. Your detector won't flag it, because the output is fine. But the mechanism is dead. It's been replaced by a hack.'

  Jordan checked his watch. 'We need to settle this. We need a decision rule. If the detector flags Case 46, do we bundle it with 44 and 45, or do we open a new ticket?'

  'Run the patch properly,' I said. I stood up, my knees cracking. 'Not just swapping the head. Swap the residual stream activation at layer 10. If 44's activation plugged into 45's run produces 45's output, then the downstream layers don't care about the ancestry. They only care about the signal.'

  Sam was already typing. 'I scripted it. Running now.'

  We watched the progress bar. It was a simple experiment, technically. Take the vector of numbers floating in the model's memory at a specific layer during Case 44. Inject it into the same spot during Case 45. See if the model behaves as if it's still processing Case 45, or if it glitches.

  The room was silent except for the fan noise. I looked at the whiteboard. The red ink for Case 44, the blue for Case 45. They looked like Rorschach tests. If you squinted, they were the same. If you focused, they were distinct.

  'The problem,' Thorne said softly, 'is boundary drawing.'

  'Here we go,' Sam muttered.

  The terminal scrolled. *Patch successful. Logits difference: 0.004.*

  'It worked,' Sam said. 'The model didn't care. The signal passed through.'

  'The signal passed through,' Thorne corrected. 'The *path* changed. Did you look at the gradient norm during the patch? The model had to work harder to reconcile that activation with the surrounding context. The energy cost is higher. The efficiency is lower. You've forced a square peg into a round hole and declared them identical because the box closed.'

  'So what?' Jordan snapped. 'The box closed. The user gets the same text. The funder gets the same safety guarantee.'

  'The safety guarantee is based on stability,' Thorne said. 'Homology implies stability. Function implies performance. They are not the same.'

  I walked over to the board and picked up a black marker. 'If we call them the same,' I said, drawing a circle around both plots, 'then our detector is looking for functional equivalence. We can cluster anomalies by output effect. We reduce the audit load by eighty per cent. We ship the paper.'

  I drew a line through the circle, splitting them. 'If we call them different, we are looking for structural equivalence. We have to cluster by weight origin. The audit load triples. We miss the deadline. But we catch the cases where the model is hacking its way to the right answer using brittle pathways.'

  Jordan looked at the line. 'We can't triple the load. We don't have the compute.'

  'Then you are choosing to blind yourselves,' Thorne said. 'You are choosing to see the eye of the mouse and the eye of the fly as the same because they both see. Until one of them stops seeing because the genetic switch failed.'

  Sam spun his chair around. 'But we can't see the genetic switch, Aris. Not really. We have the weights. We have the activations. We don't have the training trajectory for every token. You're asking for data we don't possess.'

  'I'm asking you to admit you don't possess it,' Thorne said. 'Don't claim you've found a mechanism when you've found a behaviour.'

  The tension in the room shifted. It wasn't just about the paper anymore. It was about what we were building. The anomaly detector sat on my laptop, dormant. It was waiting for a definition. If I coded it to look for functional clusters, it would group 44 and 45. If I coded it to look for structural clusters, it would separate them.

  And worse, the detector itself was a mechanism. It was a neural net trained to recognise patterns in activations. If we defined the training labels based on functional equivalence, the detector would learn to ignore structural drift. It would become a functionalist. If we labelled based on homology, it would become a historian.

  'We have to ship,' Jordan said. His voice was flat. He wasn't arguing anymore; he was deciding. 'We define by function. Interventionist criterion. If the patch holds, it's the same mechanism.'

  'That's a lie,' Thorne said.

  'It's a working criterion,' Jordan corrected. 'It buys us the paper. It buys us the next grant. With the next grant, we can buy the compute to trace the trajectories. You want to trace ancestry? Fine. But you need money to buy the time machine.'

  Thorne looked at the board. She looked at the red and blue heatmaps. She didn't nod. She didn't agree. She just stepped back from the whiteboard. 'Then write it down,' she said. 'Write that you are defining mechanism as functional equivalence. So that when the model drifts in six months and the safety guarantee fails because the structure rotted, we know why.'

  I uncapped the black marker. My hand hovered over the whiteboard. I could feel the weight of the decision. It wasn't philosophical anymore. It was administrative. By drawing the line, I was determining what my job would be for the next three months. If I drew the circle, I would be clustering outputs. If I drew the line, I would be tracing weights.

  I drew the circle.

  'Mechanism defined by causal intervention,' I wrote. 'Cases 44 and 45 grouped.'

  Sam exhaled, a long breath he seemed to have been holding since Tuesday. Jordan stood up and grabbed his bag. 'Good. I'll tell the funder we have a unified class of anomalies. Alex, send me the draft by Sunday night.'

  Jordan left. The door clicked shut. The room felt hotter without his movement stirring the air.

  Sam spun back to his terminal to start packaging the code. 'It's the right call, Alex. We can't audit the training history. It's impossible.'

  'I know,' I said. I didn't erase the line I'd drawn through the circle. It remained visible, a ghost beneath the ink.

  Thorne walked over to my laptop. She looked at the detector code. 'You'll have to tune the threshold,' she said. 'If you're grouping by function, your false negatives will go up. You'll miss the structural drifts.'

  'I know,' I said again.

  'Six months,' she said. 'That's how long it usually takes for the drift to show in these models. The weights shift to optimise for the loss, not the mechanism. The function stays, the structure dissolves.'

  'I'll add a comment in the code,' I said. 'Documentation of the criterion.'

  Thorne nodded. She picked up her bag. 'Make sure it's clear. Not in the paper. In the code.'

  She left too.

  I was alone in Room 304 with the hum of the servers and the heat. I looked at the whiteboard. The circle encompassed both cases. It was clean. It was simple. It was what the paper required.

  I opened the detector script. I needed to set the clustering parameter. *method = 'functional'*. I typed it.

  Then I paused. I looked at the line I hadn't erased. It cut through the centre of the circle. It represented the work we weren't doing. It represented the anomalies we wouldn't see next quarter. It represented the specific blindness we were choosing to buy our deadline.

  I added a comment in the code. *# Criterion: Functional Intervention. Note: Structural homology ignored per audit constraints. Risk of drift undetected.*

  I saved the file. The cursor blinked in the empty space below. The detector was ready. It would find what we had told it to find. It would miss what we had decided didn't matter.

  I stood up and turned off the light. The whiteboard glowed faintly in the dark, the red and blue heatmaps merging into a single grey smear. I locked the door and walked down the corridor, the heat of the room following me into the hall, sticking to my back like a second skin. I knew what I had bought. I knew what it cost. The tension didn't resolve; it just moved from the whiteboard into the code, waiting for the next flag to rise.
