answer: |-
  This specification draws heavily on the legacy of structure-mapping and fluid analogy research (e.g., SME, Copycat, Metacat), but tightens the constraints to address your specific concern with indeterminacy and error distributions rather than solution convergence.

  ### I. Empirical Desiderata (Phenomena to Reproduce)

  1.  **Distributional Adequacy:** The theory must predict the *distribution* of human responses across a population, not merely the modal or "intended" answer. In cases like N N E $\to$ N E E, if human solvers split 60/40 between two completions, the model's output probabilities must match this ratio within a defined tolerance.
  2.  **Error Homology:** Every "error" (deviation from the experimenter's intended rule) must be reconstructible as a valid application of an alternative, available description. The theory cannot treat errors as noise; it must trace them to specific competing slips (e.g., treating the 'E' as an anomaly vs. treating the 'NN' as a run).
  3.  **Symmetry Invariance:** When the input stimulus possesses structural symmetry (e.g., a route like N S N where "Turn" and "Run" descriptions coincide), the model's output must reflect this symmetry. It must not arbitrarily break symmetry to produce a single deterministic answer unless a contextual bias is explicitly introduced.
  4.  **Latency-Cost Correlation:** Response time (or computational steps) must correlate with the "distance" of the slippage. Solutions requiring a shift from a surface description (literal move substitution) to a deep description (rotation of the whole path) must incur higher cost than solutions requiring only a local adjustment.

  ### II. Theoretical Distinctions (Concepts to Keep Separate)

  5.  **Best Slip vs. Available Slip:** The theory must distinguish between a slippage that is *structurally possible* within the representation language and one that is *pragmatically selected*. A theory that collapses this distinction cannot explain why a valid analogy is sometimes rejected by solvers (e.g., it is "too clever" or "unnatural").
  6.  **Stimulus Ambiguity vs. Rule Underdetermination:**
      *   *Stimulus Ambiguity:* The source string $A$ supports multiple parses (e.g., N N E is both "Two Norths" and "North then Turn").
      *   *Rule Underdetermination:* The mapping $A \to B$ supports multiple transformations (e.g., "Swap counts" vs. "Move the turn").
      *   The theory must localize the source of indeterminacy. A failure here leads to misdiagnosing whether the difficulty lies in *perceiving* the object or *inferring* the relation.
  7.  **Forced Slip vs. Chosen Slip:**
      *   *Forced:* The target $C$ cannot be mapped to any output $D$ without altering the description of $A$ (e.g., $C$ lacks the features required by the literal rule).
      *   *Chosen:* The literal rule applies to $C$, but the solver opts for a deeper slippage anyway.
      *   The theory must not treat these as computationally identical; the cognitive pressure differs.

  ### III. Architectural Constraints (Boundaries Not to Cross)

  8.  **Bounded Description Space:** The theory cannot enumerate all logically possible descriptions of a route. It must employ a heuristic or generative mechanism that constructs descriptions on demand. Exhaustive search violates cognitive plausibility.
  9.  **Endogenous Salience:** The "cost" of a slip (e.g., slipping 'North' to 'East' vs. slipping 'Run' to 'Turn') cannot be entirely hard-coded as static weights. Salience must be sensitive to the immediate context (e.g., 'North' is more salient if it appears three times in the string).
  10. **Representable Indeterminacy:** The internal state of the system must allow for a representation of "no preferred solution." The system must be able to terminate or report a state where multiple competing structures have equal activation/energy, without a tie-breaking mechanism that lacks cognitive justification.

  ### IV. Meta-Analysis of Requirements

  #### Genuine vs. Parochial
  *   **Genuine:** *Distributional Adequacy (1)*, *Error Homology (2)*, *Bounded Description Space (8)*, and *Representable Indeterminacy (10)*. These are required for any theory claiming to model human cognition in ill-structured domains.
  *   **Parochial:** *Endogenous Salience (9)*. While desirable, a research tradition could argue for innate, static priors on concept similarity (e.g., cardinal directions are always closer than geometric transformations). Insisting on fully context-derived salience excludes connectionist models with fixed weights or symbolic models with predefined type hierarchies.
  *   **Parochial:** *Latency-Cost Correlation (4)*. While standard in cognitive modeling, some traditions prioritize competence over performance. However, for a theory of *process* (slippage), this is borderline genuine.

  #### Jointly Unsatisfiable Pairs
  *   **Bounded Description Space (8) vs. Symmetry Invariance (3):** To guarantee that a stimulus is truly symmetric (i.e., that no better description exists to break the tie), one essentially needs to have evaluated the complete space of descriptions. A bounded agent cannot know it hasn't missed a "better" slip that would resolve the ambiguity.
      *   *Resolution:* The theory must satisfy *asymptotic* symmetry (given enough resources) or define symmetry relative to the *generated* subset of descriptions, admitting that "indeterminacy" is relative to the search depth.
  *   **Deterministic Architecture vs. Distributional Adequacy (1):** A purely deterministic system cannot produce a distribution of responses from a single set of parameters.
      *   *Resolution:* The theory must incorporate stochasticity (e.g., simulated annealing, noisy activation) or parameter variability across simulated agents.

  #### The Single Most Exclusionary Requirement
  **Representable Indeterminacy (10).**

  Most computational theories of analogy (Structure-Mapping Engine, ACME, modern Transformer-based few-shot learners) are **optimization engines**. They are designed to minimize error, energy, or structural mismatch to converge on a *single* best mapping. They treat indeterminacy as a failure state to be resolved by tie-breaking rules or additional iterations.

  Your microdomain explicitly demands a theory that treats indeterminacy as a **valid final state**. The theory must be able to output "There is no fact of the matter" as a positive prediction of the cognitive state, rather than "The system failed to converge." This excludes any architecture that relies on global energy minimization without a mechanism for recognizing flat energy landscapes, and it excludes any symbolic system that relies on deterministic rule priority. It forces the theory to model the *absence* of a decision as a cognitive achievement.
