      *   *Japanese Compensation:* Implies the "voluntariness" was illusory due to social pressure. It shifts liability to the organizer of the work.
      *   *Work as a Calling:* This complicates things. If work is a calling, overwork is virtue. This supports the US exemption (professionals have callings) but clashes with French/Japan (health/life > work).

  4.  **Categorize Commitments (Strict vs. Comfortable vs. Underdetermined):**
      *   *Strict:* US *requires* a distinction between types of labor (mental vs. physical, boss vs. subordinate). France *requires* a definition of leisure time. Japan *requires* a causal link between hours and death.
      *   *Comfortable:* US fits with meritocracy. France fits with social democracy. Japan fits with corporate loyalty.
      *   *Underdetermined:* You could have French hours without believing leisure is sacred (just health). You could have US exemptions without believing professionals are smarter (just bargaining power).

  5.  **Address the Hypothetical ("Hours as Hours"):**
      *   If we drop the autonomy test (US style) and treat all hours the same:
