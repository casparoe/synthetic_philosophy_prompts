          *   Hypothetical: If the law treated "hours as hours" (dropping autonomy tests), how would our thinking about work/leisure/calling need to change?
      *   **Target Audience:** Not a lawyer or philosopher. A manager talking with friends. Needs plain language, clear structure, avoiding jargon where possible.
