  2.  **Deconstruct the Three Models:**

      *   **France (The Leisure-as-Right Model):**
          *   *Rule:* 35-hour cap, right to disconnect.
          *   *Implicit Theory:* Leisure is a public good/right. Work is an intrusion on life. The state protects the citizen *from* the employer and potentially *from* their own economic desperation or competitive pressure.
          *   *View of Person:* A citizen first, worker second. Needs protection to maintain a "good life."
          *   *View of Freedom:* Freedom *from* work (negative liberty regarding time).

      *   **Japan (The Harm-Compensation Model):**
          *   *Rule:* Compensation for death by overwork (*karoshi*).
          *   *Implicit Theory:* Work can be lethal. The employer bears responsibility for the physical consequences of their demands, even if culturally encouraged.
          *   *View of Person:* Vulnerable to social pressure. The body has limits.
          *   *View of Freedom:* Freedom is compromised by social/organizational coercion. Death is the ultimate harm, overriding contractual voluntariness.

      *   **United States (The Autonomy/Exemption Model):**
          *   *Rule:* Overtime for hourly, exemption for salaried/professional/managerial.
          *   *Implicit Theory:* High-status workers are partners/agents, not subordinates. They trade time for status/pay. They can judge their own limits.
          *   *View of Person:* Stratified. Some need protection (wage earners), some don't (professionals).
          *   *View of Freedom:* Freedom *to* contract. If you choose 80 hours, it's an expression of ambition, not coercion.

  3.  **Address the Specific Philosophical Questions:**

      *   *Why protect some and not others?* It's about status and presumed agency. The US model assumes "exempt" workers have power; the French model assumes all workers need time for citizenship.
      *   *Harm as Unfreedom vs. Exhaustion?* US leans towards "if chosen, not harm." France/Japan lean towards "harm exists regardless of choice."
