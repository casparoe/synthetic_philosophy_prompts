answer: |-
  This is a profound observation. You have identified that labor laws are not just technical regulations; they are codified philosophies about what a human being is, what freedom means, and where the boundary lies between a citizen and an employee.

  To answer your request plainly: I will reconstruct the "implicit theory" behind each system, categorize what those theories strictly require versus what is merely compatible, and then explore what would happen if we leveled the playing field.

  ### I. The Three Portraits of the Worker

  Each legal arrangement imagines a different kind of person.

  **1. France: The Citizen-Worker**
  *   **The View:** The law assumes that a human being is primarily a citizen and a family member, and only secondarily a worker. Leisure is not a reward for work; it is a prerequisite for a functioning democracy and a healthy life.
  *   **The Theory of Harm:** Overwork is a structural violence. It doesn't matter if you "agree" to work 50 hours; the agreement itself is suspect because economic necessity or competitive pressure coerces you.
  *   **The Role of the State:** The state is a referee that enforces a boundary between the economic sphere and the human sphere. It protects you from your employer, but also from your own economic desperation.

  **2. Japan: The Body-as-Evidence**
  *   **The View:** The law assumes that social pressure can be as coercive as a physical chain. It recognizes that a worker may "voluntarily" stay late due to loyalty, shame, or fear of ostracization, but that this voluntariness is illusory when it leads to death.
  *   **The Theory of Harm:** The harm is physical destruction (death/illness). The law bypasses the question of "did you choose this?" and asks "did the work kill you?" If the hours exceed a threshold, the law presumes the worker's agency was overwhelmed by the organization's demands.
  *   **The Role of the State:** The state acts as a coroner and an insurer. It does not necessarily prevent the overwork (as France tries to), but it assigns financial liability for the corpse, forcing the employer to internalize the cost of human depletion.

  **3. The United States: The Stratified Agent**
  *   **The View:** The law assumes a two-tiered humanity.
      *   *Tier 1 (Hourly/Non-Exempt):* These workers are viewed as selling discrete units of time. They need protection because they lack power and their time is easily exploited.
      *   *Tier 2 (Salaried/Exempt):* These workers (managers, professionals) are viewed as "partners" or "agents." They are assumed to sell *results*, not time.
  *   **The Theory of Harm:** For Tier 2, there is no legal harm in overwork. If a manager works 90 hours, the law assumes this is an expression of their ambition, status, or commitment. To limit their hours would be to insult their professional judgment.
  *   **The Role of the State:** The state enforces contracts but respects hierarchy. It protects the vulnerable from exploitation but leaves the "powerful" to negotiate their own depletion.

  ### II. Addressing Your Specific Questions

  **Why protect some from their own willingness to overwork and not others?**
  The US system rests on a **competence theory**. It assumes that "exempt" workers have the education, status, and bargaining power to judge their own interests. It assumes a factory worker cannot say "no" to overtime, but a marketing director can.
  *   *The Flaw:* As you noted, many *karoshi* victims were salaried, self-directed professionals. The US model assumes status equals power, but often status equals *more* pressure.

  **Is the harm unfreedom or exhaustion?**
  *   **France:** The harm is **unfreedom**. If you cannot disconnect, you are not free, regardless of your health.
  *   **Japan:** The harm is **biological**. Freedom is irrelevant if you are dead.
  *   **US:** The harm is **economic**. If you are paid a salary, the assumption is you are compensated for the extra hours. If you chose them, it is not harm; it is investment.

  **How should the Japanese practice be read regarding voluntariness?**
  The *karoshi* compensation rules presuppose that **contextual coercion invalidates consent.** Even if a worker proudly stays late, the law recognizes that the "pride" is manufactured by a culture that equates presence with virtue. By compensating the family, the state admits: "We know he chose this, but he shouldn't have had to." It places the duty on the employer to manage the *culture*, not just the payroll.

  **Does the idea of work as a "calling" support these rules?**
  It is a double-edged sword.
  *   **Supports US:** The exemption for professionals relies on the idea that they have a "calling." Doctors, lawyers, and managers are expected to prioritize the work over the self. The law codifies the virtue of diligence into an exemption from protection.
  *   **Undercuts France/Japan:** If work is a calling, limiting hours (France) or paying for death (Japan) interferes with the moral duty to the craft.
  *   **Reality:** The "calling" is often weaponized. Employers encourage the *language* of the calling to extract unpaid labor, while the law (in the US) accepts the *classification* of the calling to deny overtime.

  ### III. Taxonomy of Commitments

  You asked to distinguish between what these arrangements *strictly require*, what they *sit comfortably with*, and where they are *underdetermined*.

  | | **Strictly Required** (The rule fails without this) | **Sits Comfortably With** (Compatible, but not necessary) | **Underdetermined** (Other theories could justify the same rule) |
  | :--- | :--- | :--- | :--- |
  | **France** | **Leisure is a public good.** The state must define a minimum amount of non-work time for all. | **Social Democracy.** A belief that collective well-being trumps individual earning potential. | **Health Safety.** You could support the 35-hour week purely on medical grounds (fatigue causes accidents) without valuing leisure morally. |
  | **Japan** | **Causality exists.** There must be a threshold where work becomes the probable cause of death. | **Corporate Paternalism.** The company is a family that must care for its members even in death. | **Insurance Logic.** You could view this purely as workers' comp insurance without admitting any moral fault by the employer. |
  | **US** | **Labor is stratified.** There must be a meaningful difference between "thinking" work and "doing" work. | **Meritocracy.** The belief that higher pay/status implies better judgment. | **Administrative Convenience.** You could keep exemptions simply because tracking manager hours is too expensive, not because they are "free agents." |

  **The Critical Insight:** The US exemption is *underdetermined*. We keep it because it's cheap for employers and convenient for administration, but we justify it with high-minded philosophy about "autonomy" and "discretion." We could admit it's just about cost, but we prefer to say it's about professional status.

  ### IV. The Hypothetical: If the Law Treated "Hours as Hours"

  If we dropped the autonomy test and said, "An hour of coding is an hour of factory labor; all overtime must be paid or capped," several foundational shifts would occur in how we think about work.

  **1. The Death of the "Calling" as a Legal Category**
  Currently, the law validates the idea that some work is *different in kind*. A nurse (hourly) is protected; a doctor (salaried) is not. If hours became hours, "calling" becomes a private sentiment, not a legal status. You can feel called to your job, but the law will not let that feeling justify your exploitation. Diligence remains a virtue, but idleness (leisure) becomes a right, not a vice.

  **2. Managerial Identity Crisis**
  In the US model, being a manager means you are "above" the clock. If you are subject to the clock, you are demoted to "worker." Treating hours as hours dissolves this class distinction. It forces us to see management as *labor*, not *leadership*. It suggests that directing others is just another task that takes time, rather than a state of being.

  **3. Leisure as Universal, Not Class-Based**
  Currently, leisure is often a luxury good in the US (the poor work multiple jobs; the rich buy time). In France, it is a right. If the law treated hours as hours, leisure would be re-framed as a biological necessity for *all* brains, not a reward for *some* statuses. It would imply that the human body has limits that do not care about your job title.

  **4. Consent Re-evaluated**
  It would force us to admit that **economic consent is often coerced.** If a salaried employee "chooses" to work 90 hours, is it because they love the work, or because they fear being fired? Treating hours as hours admits that the power imbalance exists even in the boardroom. It suggests that freedom isn't just the absence of a locked door; it's the presence of a viable alternative.

  ### Summary for Your Conversations

  *   **To your friend in Tokyo:** The Japanese system admits that culture can kill. It treats the body as the ultimate truth-teller, overriding the worker's verbal consent.
  *   **To your friend in Ohio:** The US system treats professional status as a shield. It assumes that if you are paid enough to be "exempt," you are powerful enough to protect yourself. This is often a fiction.
  *   **To yourself as a manager:** The law asks you to view your team as either "agents" (who don't need protection) or "subordinates" (who do). The reality is likely that everyone needs protection from the structural incentives to overwork.

  **The Bottom Line:**
  These laws reveal that we do not agree on what work *is*.
  *   Is it a **commodity** to be regulated (France)?
  *   Is it a **hazard** to be insured (Japan)?
  *   Is it a **vocation** to be pursued (US)?

  If we moved to "hours as hours," we would be choosing the first view. We would be saying that work is a transaction of time for money, nothing more, and that no amount of "passion" or "status" justifies bypassing the biological limits of the human animal. This would not stop people from working hard, but it would stop the law from pretending that working to death is a sign of freedom.
