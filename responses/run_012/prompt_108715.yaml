  8.  **Final Polish:** Check against the prompt's request for "plainly" laid out implicit theory. Ensure the distinction between the *legal rule* and the *philosophical justification* is clear. (Proceed to generate output based on this structure.)

  *(Self-Correction Note)*: I need to be careful not to validate the *accuracy* of the laws (e.g., US exemptions are complex) but focus on the *philosophical presuppositions* the user is asking about. The user is asking about the *logic* of the rules, not a legal audit.

