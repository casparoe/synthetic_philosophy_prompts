prompt: |-
  I've got to teach a 75-min session on heritablity next month to a room of public-health master's students -- solid on epi, no genetics past undergrad bio -- and I want you to plan the teaching, not do the explaining. The hook I want to hang the whole thing on is a fictional two-cohort twin study I'm inventing: same trait (reading fluency in nine-year-olds), heritability comes out around .7 in a well-resourced sample and around .15 in a sample from a city that just rolled out a big early-literacy program -- same trait, same age, wildly different number, and I want the students to be able to say what actually changed. My hunch is the session only works if they already grasp that a heritability estimate is a ratio of variances in one population, at one time, across one range of environments, but tell me the real dependency order: what has to land before what, and at what point the two-cohort example can first be used without it turning into a magic trick. Also tell me whether that's the right carrying example at all, or whether something else would do it better -- and if you think the old seeds-and-different-soils case or yet another IQ twin study beats it, say so and say why. Then the misconceptions in the order they'll actually surface (I'm betting on 'heritable = genetic', 'high heritability = can't be moved by policy', 'the estimate tells you about group differences', plus whatever I'm missing) and the exact point in the sequence where each one needs heading off. Tell me what to cut and say out loud that I'm cutting it, and give me one question to ask at the end that shows whether the variance idea actually landed.

  Give it to me as exactly five numbered points, a sentence or two each, no intro and no conclusion.
