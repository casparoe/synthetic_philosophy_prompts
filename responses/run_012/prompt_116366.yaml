answer: |-
  This is a classic friction point in the literature, and honestly, if you weren't stuck here, I'd worry you hadn't read Adams & Aizawa closely enough. You are hitting the wall between **Vehicle Externalism** (the EMT claim) and **ontological bloat** (the absurd consequences you're worried about).

  The short answer is: You are conflating the *supervenience base of a cognitive process* with the *spatial boundaries of a subject*.

  Here is how to untangle this for your seminar, breaking down the belief/location distinction, the hard drive problem, and the group mind worry.

  ### 1. Belief vs. Location: The Supervenience Claim
  You asked: *"If a belief can be partly in a notebook, why can't I say my mind is spread across every device I've ever synced?"*

  The EMT (Clark & Chalmers 1998) is not claiming that "The Mind" is a physical substance that stretches out like butter on toast. It is a claim about **supervenience**.

  *   **The Claim:** The physical substrate (the vehicle) that realizes certain cognitive states (like belief) does not have to be intracranial.
  *   **The Nuance:** It is not that *everything* you interact with becomes part of your mind. It is that specific *loops* of information processing, which satisfy specific functional criteria, constitute cognitive states.

  **Why the Hard Drive doesn't count:**
  Just because data is synced doesn't mean it functions as a belief. Clark later refined the criteria (in *Supersizing the Mind*) to avoid exactly your "hard drive" worry. For an external resource to count as part of the cognitive system (and thus host a belief), it needs to satisfy the **Trust and Glue** conditions:
  1.  **Availability:** It must be reliably available and typically invoked.
  2.  **Trust:** It is automatically endorsed (you don't second-guess the notebook any more than you second-guess biological memory).
  3.  **Accessibility:** The information is easily accessible when needed.

  A synced hard drive you rarely access, or a cloud backup you treat as an archive rather than a working memory, fails the functional test. It is **coupled** to you, but it does not **constitute** the cognitive process. This is the heart of the **Coupling-Constitution Fallacy** (Adams & Aizawa 2008). EMT proponents argue that in Otto's case, the notebook isn't just coupled; it is functionally isomorphic to neural memory. A backup drive is just coupled.

  **So, what are you claiming?**
  You are claiming **Vehicle Externalism**. You are claiming that the *physical realizer* of the belief state includes the notebook. You are *not* claiming that your "self" expands spatially to encompass the notebook. You are claiming that the *system* that constitutes the cognitive agent includes the notebook *for the duration of that specific cognitive task*.

  ### 2. The Flatmate Problem: Subject Individuation
  You asked: *"My flatmate and I keep one running shopping list... do we have one mind between us?"*

  This is the **Group Mind** objection. It forces you to distinguish between the *Cognitive System* and the *Conscious Subject*.

  *   **Standard EMT (Clark):** Focuses on the **individual agent**. Otto + Notebook is one cognitive system. The subject is still Otto.
  *   **The Flatmate Case:** If you and your flatmate rely on the list, you have created a **coupled system**. But does that make you one *mind*?

  Most EMT proponents (including Clark) are cautious here. They usually argue that while the *processing* is distributed, the **locus of agency and phenomenology** remains individual.
  *   **The Stopping Point:** The boundary of the cognitive system is determined by the **functional unit of control**.
  *   If you and your flatmate edit the list independently to serve individual goals (you buy milk, they buy eggs), you are two agents using a shared resource. The list is part of *your* cognitive system when you check it, and part of *their* system when they check it. It is a **shared vehicle**, not a **shared subject**.
  *   For a "Group Mind" to exist (Theiner et al. 2010), you would need evidence of joint intentionality and a feedback loop where the group acts as a unified agent in a way the individuals cannot. A shopping list usually doesn't clear that bar.

  **The Seminar Defense:**
  If someone presses you on the flatmate case, your answer is: **EMT extends the *base* of cognition, not the *subject* of experience.** We can share a cognitive resource without sharing a mind, just as two computers can share a server without becoming one computer. The "mind" is the process; the "person" is the biological/social entity running the process.

  ### 3. So, what are you actually supposed to be claiming?
  For your seminar, strip away the spatial metaphors ("bigger," "spread across"). They invite the objections you're stuck on. Instead, frame it as a claim about **explanation and individuation**.

  **Claim 1: Anti-Cranialism (The Negative Claim)**
  Cognitive science cannot assume *a priori* that the boundaries of the cognitive system match the boundaries of the skin/skull. To define cognition as "what happens inside the head" is question-begging.

  **Claim 2: Functional Parity (The Positive Claim)**
  When identifying cognitive states (like belief), we should individuate them by their **functional role**, not their physical location. If an external process plays the same functional role as an internal process (in terms of reliability, access, and endorsement), it should be categorized as the same kind of state.

  **Claim 3: The Contingent Boundary (The Nuance)**
  The boundary of the mind is not fixed. It is **task-relative**.
  *   When Otto is navigating, the notebook is part of his cognitive system.
  *   When Otto is sleeping, the notebook is not currently constituting a state (it's dispositional).
  *   When Otto is arguing with his flatmate, the flatmate is *not* part of his cognitive system (unless they are solving a problem together as a unit).

  ### Summary for your Seminar Prep
  If you get pushed on "Is the mind in the notebook?":
  *   **Don't say:** "Yes, my mind is physically inside the notebook." (Too vulnerable to category errors).
  *   **Do say:** "The supervenience base of my dispositional belief state includes the notebook. The cognitive system that realizes the belief is a hybrid system of brain and paper."

  If you get pushed on "Does the mind grow with storage?":
  *   **Do say:** "No. Cognitive extension requires functional integration (trust/glue), not just storage capacity. A hard drive I don't trust or access is merely coupled, not constitutive."

  If you get pushed on "The Flatmate/Group Mind":
  *   **Do say:** "EMT extends the *vehicle* of cognition, not necessarily the *subject* of agency. We can share a cognitive scaffold without merging our phenomenal fields or agential boundaries."

  **The "Get Out of Jail Free" Card:**
  Remind the seminar that Clark & Chalmers are **functionalists**. They don't care about "where" the mind is in a Cartesian sense; they care about **how we explain behavior**. If explaining Otto's behavior requires referencing the notebook in the same way we reference neural memory to explain Inga's behavior, then for the purposes of cognitive science, the notebook is part of the mind. It's a methodological claim about explanation as much as an ontological claim about belief.

  **Recommended Reading to solidify this:**
  *   **Adams & Aizawa (2008):** *The Bounds of Cognition*. (Read the critique so you know the boundary arguments).
  *   **Clark (2008):** *Supersizing the Mind*. (Chapter 4 specifically addresses the "Coupling-Constitution" fallacy).
  *   **Sutton et al. (2010):** "The Self as a Dynamic Constant." (Good for the social/group aspect).

  You aren't claiming your soul is in the cloud. You're claiming that the *causal machinery* of your belief states leaks out when the functional loop is tight enough. Keep it functional, and you'll be fine.
