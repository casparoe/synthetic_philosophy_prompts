prompt: |-
  Hi — cog sci PhD student here, trying to get the extended mind straight for a seminar and I keep getting stuck in the same place. I'm fine with Otto: the notebook does the work a memory would do, so the belief is partly out there in the notebook. But people keep telling me the thesis is about belief and not about where the mind is, and i genuinely can't see the difference. If a belief can be partly in a notebook, why can't I say my mind is spread across every device I've ever synced, and that it got definately bigger when I bought a bigger hard drive? And if it is about location, then my flatmate and I keep one running shopping list that we both read and edit all day — do we have one mind between us, or does the view just have no principled stopping point? What am I actually supposed to be claiming here?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Problem:**
      *   **User:** Cognitive Science PhD student. This means they have a strong background in philosophy of mind, cognitive science, and likely the literature (Clark & Chalmers, etc.). They need precision, not a pop-sci summary. They are preparing for a seminar, so they need to defend a position or clarify a concept for discussion.
      *   **The Problem:** They understand the *Otto* case (notebook = memory), but they are stuck on the *implications* of the thesis. Specifically:
          1.  If beliefs extend, does the *mind* extend spatially/physically (e.g., hard drive size = mind size)?
          2.  If beliefs extend, does this lead to a "group mind" (shared shopping list = shared mind)?
          3.  What is the actual claim? Is it about *belief* or about *the mind's location*?
      *   **The Core Confusion:** The user is conflating *functionalism/vehicle externalism* with *spatial expansion* and *subject individuation*. They are worried about absurd consequences (my mind is the cloud, we share a brain) which suggests they might be missing the nuance of the *Parity Principle* and the distinction between *constitutive* vs. *causal* externalism, or perhaps the distinction between *vehicle* and *content*.

  2.  **Deconstruct the Extended Mind Thesis (EMT):**
      *   **Source:** Clark & Chalmers (1998), "The Extended Mind".
      *   **Core Argument:** Parity Principle. If a process inside the head counts as cognitive, a process outside the head that plays the *same functional role* should also count as cognitive.
      *   **Target:** It's primarily about *mental states* (beliefs, memories) and *cognitive processes*, not necessarily "The Mind" as a singular, reified object with a boundary.
      *   **Key Distinction:** Coupling vs. Constitution. Just because something is coupled to the system doesn't mean it's part of it. (The "Coupling-Constitution Fallacy" objection by Adams & Aizawa).
      *   **Key Distinction:** Vehicle Externalism vs. Content Externalism. EMT is usually Vehicle Externalism (the physical substrate of the state is external).

  3.  **Address the Specific Sticking Points:**

      *   *Point 1: Belief vs. Location.*
          *   The thesis *is* about belief (and other states), but believing is a process/state of the *mind*. So if the belief is extended, the supervenience base of the mind is extended.
          *   However, saying "my mind is bigger" is a category error if you think of the mind as a container. It's better to say the *supervenience base* of my cognitive system includes external props.
          *   Hard drive size: Only the *active, trusted, accessible* parts count. A synced backup drive you never look at isn't part of the loop. It's about *functional integration*, not physical storage capacity.

      *   *Point 2: The Shopping List (Group Mind).*
          *   This is the "Social Extended Mind" or "We-Intentionality" debate.
          *   Clark & Chalmers focus on the *individual* cognitive subject. Otto's notebook is *his*.
          *   For the shopping list to create a "group mind," the *system* performing the cognition must be the group.
          *   Most EMT proponents resist the group mind conclusion unless there is a specific functional architecture binding the individuals (like a tightly coupled team).
          *   The "stopping point" is the *functional unit of control*. Who updates it? Who relies on it? If it's joint reliance, maybe it's a joint system, but that doesn't necessarily mean "one mind" in the phenomenal sense.

      *   *Point 3: What am I actually claiming?*
          *   You are claiming **Active Externalism** (or Vehicle Externalism).
          *   You are claiming that the *supervenience base* of certain mental states is not skull-bound.
          *   You are *not* claiming that everything you touch is you (no magical expansion).
          *   You are *not* necessarily claiming that consciousness extends (phenomenology might remain internal).

  4.  **Drafting the Response (Iterative Process):**

      *   *Tone:* Academic, peer-to-peer, precise, acknowledging the PhD level.
      *   *Structure:*
          1.  Validate the confusion (it's a common and deep problem).
          2.  Clarify the Ontological Claim (Supervenience vs. Location).
          3.  Address the "Hard Drive" objection (Trust, Glue, Accessibility).
          4.  Address the "Shopping List" objection (Subject Individuation).
          5.  Summarize the "Actual Claim" for the seminar.

      *   *Refining the "Belief vs. Mind" distinction:*
