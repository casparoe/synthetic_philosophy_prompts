          *   Answer: Because EMT is about the *vehicle* of specific states, not the *essence* of the person. Also, the "Coupling-Constitution Fallacy" is the enemy here. You need to explain *why* the notebook counts but the random synced file doesn't. (Criteria: Availability, Trust, Endorsement).
          *   The "Mind" isn't a blob that grows. It's a system of processes.

      *   *Refining the "Shopping List" (Group Mind):*
