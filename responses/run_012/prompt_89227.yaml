answer: |-
  # The Overdetermination Sorter: A Decision Tree for Causal Disputes

  **Instructions:** Start at the **Entry Point**. Answer each question based on your intuition about the specific case described. Follow the path to a **Leaf Position**. The goal is not to find the "correct" theory, but to find the label that matches your concrete judgments.

  ### Stage 1: The Logical Space (The Tree)

  **Entry Point:** Consider a case where the outcome (a bridge collapse, a death, a revolution) would have happened anyway without this particular condition (a specific crack, a specific bullet, a specific harvest failure).

  **Node 1: The Dependence Test**
  *Case:* A patient has two unrelated fatal diseases. Disease A kills him. Disease B was also fatal but didn't get the chance.
  *Question:* If the outcome happens without Condition B, does Condition B count as a cause at all?
  *   **A. No.** If the outcome didn't depend on it, it did nothing. → *Go to Node 2*
  *   **B. Yes.** Being enough to cause it is sufficient, even if it didn't change the result. → *Go to Node 3*

  **Node 2: The "Almost" Test (For those who answered No to Node 1)**
  *Case:* Two shooters fire. Bullet A hits the heart first. Bullet B hits a millisecond later.
  *Question:* Is Bullet B a cause of death, or is it merely present at the scene?
  *   **A. Merely present.** It arrived too late to make a difference. → *Leaf 1 (Strict Dependence)*
  *   **B. It's complicated.** It didn't cause the death, but it explains why death was certain. → *Leaf 2 (Narrativist)*

  **Node 3: The Process Test (For those who answered Yes to Node 1)**
  *Case:* Two bullets arrive simultaneously. Either alone would kill.
  *Question:* Do both bullets cause the death, or does one "win" the causal role?
  *   **A. One wins.** The one that physically completed the process first is the cause; the other is inert. → *Leaf 3 (Preemption)*
  *   **B. Both count.** They are both full causes of the single death. → *Go to Node 4*
  *   **C. Both contribute.** They share the causal load, even if either was enough. → *Leaf 4 (Degrees)*

  **Node 4: The Context Test (For those who think Both Count)**
  *Case:* A bridge falls due to two flaws. A revolution occurs due to hunger and unpaid soldiers.
  *Question:* When we name the cause, are we reporting a fact about the world, or answering a specific question (e.g., "Why now?" vs. "Why at all?")?
  *   **A. Fact about the world.** There is a true list of causes regardless of who asks. → *Go to Node 5*
  *   **B. Answer to a question.** We pick the cause that contrasts with what we expected (e.g., the abnormal flaw). → *Leaf 5 (Contrastive)*
  *   **C. Answer to a question.** We pick the cause that stands out against the background (e.g., the hunger, not the soldiers). → *Leaf 6 (Abnormality)*

  **Node 5: The Ontology Test (For those who seek Facts)**
  *Case:* A revolution happens. Was it caused by the specific trigger (the spark) or the standing conditions (the dry wood)?
  *   **A. The Trigger.** We look for the specific event that tipped the scale. → *Leaf 7 (Plural Sufficiency)*
  *   **B. The Conditions.** The specific trigger doesn't matter; the vulnerability matters. → *Go to Node 6*

  **Node 6: The Design Test (For those focused on Conditions)**
  *Case:* A blackout is prevented by a backup generator (planned) vs. a second power line that happened to exist (unplanned).
  *Question:* Does the fact that one backup was *designed* to prevent failure change its causal status compared to the accidental backup?
  *   **A. Yes.** A planned backup explains stability; an accidental one explains luck. → *Leaf 8 (Functional Design)*
  *   **B. No.** Both show the system was robust; the specific source is irrelevant. → *Leaf 9 (Systemic Robustness)*

  ***

  ### Stage 2: The Positions (The Leaves)

  **Leaf 1: Strict Dependence**
  *   **Verdict:** A redundant condition is **no cause at all**.
  *   **Case Handling:** The second courier, the second bullet, and the backup generator are causally inert. Only the condition that made the difference counts.
  *   **Awkward Commitment:** You must say the second shooter did nothing to the victim, even though the victim was hit by two bullets.

  **Leaf 2: Narrativist (No Fact)**
  *   **Verdict:** There is **no fact about causes**; history is a story we tell.
  *   **Case Handling:** Whether the second disease "caused" death depends on the plot you need to tell, not the biology.
  *   **Awkward Commitment:** You must accept that two historians can contradict each other on the cause and both be right.

  **Leaf 3: Preemption (First Operator)**
  *   **Verdict:** Whichever condition **operated first** is the cause; the rest are inert.
  *   **Case Handling:** The first bullet causes death; the second is just debris. The harvest failure causes the revolution; the unpaid soldiers are just there.
  *   **Awkward Commitment:** You must claim the second bullet is physically present but causally magical (it touches the body but does not kill).

  **Leaf 4: Gradualist (Degrees)**
  *   **Verdict:** Causes come in **degrees**; a redundant one contributes little or nothing.
  *   **Case Handling:** The first bullet is 99% the cause; the second is 1%. The harvest is 80% the cause; the soldiers are 20%.
  *   **Awkward Commitment:** You must explain how a condition that was *fully sufficient* on its own only contributes a percentage.

  **Leaf 5: Contrastive (Relative to Question)**
  *   **Verdict:** Causal talk is **relative to a contrast**; there is no single fact of the matter.
  *   **Case Handling:** "Why did it fall *now*?" (The trigger). "Why did it fall *at all*?" (The flaws). Both are true relative to different questions.
  *   **Awkward Commitment:** You cannot answer "What caused this?" without first being asked "As opposed to what?"

  **Leaf 6: Abnormality (INUS)**
  *   **Verdict:** We single out the **abnormal condition** against a background of normal ones.
  *   **Case Handling:** If bridges usually have flaws, the heavy load is the cause. If loads are usually safe, the flaw is the cause.
  *   **Awkward Commitment:** The cause changes if the background statistics change, even if the physics stay the same.

  **Leaf 7: Plural Sufficiency (Both Full Causes)**
  *   **Verdict:** Two conditions that each suffice are **two distinct causes**.
  *   **Case Handling:** Both shooters caused the death. Both flaws caused the collapse. Both couriers caused the order's arrival.
  *   **Awkward Commitment:** You must accept "double counting"—the world contains two full causes for one effect.

  **Leaf 8: Functional Design (Teleological)**
  *   **Verdict:** A backup built to prevent failure is **different** from a backup that happened to exist.
  *   **Case Handling:** The planned generator explains why the lights stayed on (function); the accidental line is just a coincidence (cause).
  *   **Awkward Commitment:** You must claim physics cares about human intention (a wire works differently if an engineer planned it).

  **Leaf 9: Systemic Robustness (Equifinality)**
  *   **Verdict:** What explains the outcome is that it was **robust to the loss** of any one condition.
  *   **Case Handling:** It doesn't matter which bullet hit or which backup worked; the system was set up to ensure the outcome (or prevent it).
  *   **Awkward Commitment:** You explain the event by ignoring the specific trigger that actually happened.

  **Leaf 10: Unoccupied / Incoherent**
  *   **Verdict:** **No consistent position.**
  *   **Description:** This space holds combinations like "Dependence is required" (Node 1A) but "Both bullets are causes" (Node 3B).
  *   **Status:** **Incoherent.** You cannot demand dependence while accepting redundant causes. Or: "Planned backups matter" (Node 6A) but "Physics is all that counts" (Leaf 1). This looks **unattractive** because it applies different rules to identical physical situations based on mental states.

  ***

  ### Note on Convergence (The Generator Puzzle)
  You suspected some positions on the *bullet/bridge* cases are really the same as on the *generator* cases. The tree confirms this:
  *   **Leaf 1 (Strict Dependence)** treats the accidental backup and the second bullet identically: neither is a cause.
  *   **Leaf 9 (Systemic Robustness)** treats the planned generator and the accidental line identically: both are just parts of a robust system.
  *   **Leaf 8 (Functional Design)** is the **only** position that treats them differently. If you find yourself in Leaf 8 for the generator but Leaf 7 (Plural Sufficiency) for the bullets, note that you are drawing a line between *human purpose* and *physical sufficiency*. This is a valid distinction, but it requires defending why intention changes physics.
