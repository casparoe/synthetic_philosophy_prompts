          6.  Therefore, Eternalism/Block Universe.
      *   **The Pro-BU Side (Eternalists):** Focus on the geometry of spacetime. "Existence" = being a point in the manifold. If SR is true, the manifold is the fundamental ontology.
      *   **The Anti-BU Side (Presentists/Fragmentalists/Deflaters):** Focus on the phenomenology or the notion of "becoming." "Existence" = being present. SR doesn't kill presentism; it just complicates the definition of "present" or requires rejecting the transitivity of co-reality.

  4.  **Categorize the Disagreements:**

