answer: |-
  1. **The Dependency Order**

  1.  **Motivate the Gap:** Start with Kripke's necessary a posteriori (e.g., "Hesperus is Phosphorus" is necessary but not knowable a priori).
      *   *Prerequisite:* None. This is their home turf.
      *   *Goal:* Establish that modal profile (necessity) and epistemic profile (apriority) come apart in 1D semantics.
  2.  **Declare the Framework (The Version Check):** State explicitly: "We are doing Epistemic Two-Dimensionalism (Jackson/Chalmers), not Stalnakerian Pragmatic Two-Dimensionalism."
      *   *Prerequisite:* Move 1 (The Gap).
      *   *Why here:* If you wait, a Stalnakerian in the room will interpret the first dimension as a context set and derail the epistemic reading. Say it before you draw the grid.
  3.  **Draw the Matrix:** Draw a 2x2 grid. Label rows "World considered as Counterfactual" and columns "World considered as Actual."
      *   *Prerequisite:* Move 2 (Framework).
      *   *Goal:* Visualize the two parameters of evaluation.
  4.  **The Load-Bearing Step (Consider as Actual):** Explain that evaluating a column means asking: "If this world *turned out* to be the actual one, what would this term refer to?"
      *   *Prerequisite:* Move 3 (The Matrix).
      *   *Warning:* If they treat this as just "another counterfactual," the whole system collapses. This is the step where they either get it or nod politely forever.
  5.  **Apply the Carrying Example:** Fill the matrix using the example (see below).
      *   *Prerequisite:* Move 4 (Consider as Actual).
      *   *Goal:* Show the Primary Intension (diagonal) coming apart from the Secondary Intension (row).
  6.  **Introduce the `Actually` Operator:** Explain that `Actually P` forces evaluation along the diagonal, locking the first coordinate to the real actual world.
      *   *Prerequisite:* Move 5 (The Matrix filled).
      *   *Why here:* They need to see the grid before they see how to collapse it. This is where `actually` earns its keep: it explains how we recover Kripkean necessity from the 2D framework.
  7.  **Define the Diagonal Proposition:** Identify the diagonal as the set of worlds where the sentence is true when considered as actual.
      *   *Prerequisite:* Move 6 (`Actually`).
      *   *Goal:* Reconnect apriority to the framework (Diagonal = A priori).

  2.  **The Carrying Example**

  **The Term:** **"Legal Tender"** (specifically, "This is legal tender").

  **Why this and not an institutional office (like "The President"):**
  An office like "The President" tempts students to rely on rigid designation intuitions about the *person* holding the office. They will think "The President" rigidly designates Biden, and the description is just contingent. "Legal Tender" forces the issue because there is *no* underlying essence—no chemistry, no person, no causal chain other than the practice itself. It isolates the reference-fixing description as the *only* thing doing the work.

  **What it must have:**
  *   **A Reference-Fixing Story:** "Whatever the Treasury designates and the community accepts for debt repayment." (This fixes the Primary Intension).
  *   **An Extension Story:** "This green paper with George Washington on it." (This fixes the Secondary Intension in the actual world).

  **What it must lack:**
  *   **Hidden Chemistry:** Unlike water, there is no H2O waiting to be discovered.
  *   **Causal-Historical Essence:** Unlike names, there is no baptismal event that rigidly locks the paper itself; the status is purely functional/conventional.

  **How it works on the board:**
  *   **Actual World (Column 1):** Treasury designates green paper. Extension = Green Paper.
  *   **Counterfactual World (Column 2):** Treasury designates blue plastic. Extension = Blue Plastic.
  *   **Row 1 (Actual as Counterfactual):** "This is legal tender" is True for Green, False for Blue.
  *   **Column 2 (World 2 as Actual):** If World 2 turned out to be actual, "Legal Tender" would refer to Blue Plastic.
  *   **The Split:** The Primary Intension picks out whatever fits the role (Green in W1, Blue in W2). The Secondary Intension picks out Green in both (because `actually` locks the designation to W1).

  3.  **Misconceptions**

  1.  **Location:** After Move 2 (Framework Declaration).
      **Misconception:** "This is just Kaplan's character/content distinction with new vocabulary."
      **Shutdown:** "Kaplan's character resolves indexicals based on context; this primary intension resolves reference based on epistemic scenarios about how the world turns out."

  2.  **Location:** After Move 4 (The Load-Bearing Step).
      **Misconception:** "The primary intension is just whatever the speaker has in mind."
      **Shutdown:** "It is not psychological; it is the communal reference-fixing condition that determines extension across epistemic possibilities."

  3.  **Location:** After Move 7 (Diagonal Proposition).
      **Misconception:** "If the diagonal is contingent, the statement isn't a priori."
      **Shutdown:** "Apriority tracks the diagonal truth across all worlds considered as actual, not the metaphysical necessity of the statement."

  4.  **Location:** During Move 6 (The `Actually` Operator).
      **Misconception:** "The `actually` operator just means 'in this world'."
      **Shutdown:** "It functions as a rigidifier that locks the reference-fixing world, preventing the term from shifting when we evaluate counterfactuals."

  4.  **The Check**

  **The Exercise:** "The Counterfeit Switch."
  **Setup:** Draw the matrix for "This is legal tender" (referring to a specific bill in your pocket).
  **Scenario:** Tell them: "Imagine a world W where the Treasury secretly printed this exact bill as a counterfeit prototype, never designated it as legal tender, but everyone *believes* it is."
  **Task:** Ask them to fill in the truth value for the cell where W is considered **as Actual**.
  **Separation:**
  *   **Students who get it:** Will mark it **False**. If W is actual, the reference-fixing condition ("designated by Treasury") fails, so the term refers to nothing (or whatever *was* designated), not this bill.
  *   **Students nodding along:** Will mark it **True**. They will rely on the communal belief ("everyone treats it as money") rather than the reference-fixing condition you established, conflating the extension with the epistemic scenario.

  5.  **What I Announce I'm Not Covering**

