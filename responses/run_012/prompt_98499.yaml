      *   *Falsifiability:* If Ayer says "This counts slightly against death being the end," he is admitting the experience has probabilistic weight. Verificationism is often binary (meaningful/meaningless). Probabilistic support is more Bayesian.
      *   *The "In Principle" Clause:* If survival is real, could it *ever* be verified? Only by dying and not returning (which prevents reporting) or returning (which suggests one wasn't fully "dead" in the metaphysical sense). This creates a logical catch-22 for verificationism regarding death.
