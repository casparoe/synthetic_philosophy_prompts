answer: |-
  Here is a complete lesson plan designed for a 75-minute seminar. It avoids upfront theory, focuses on the *Comparative Ignorance Hypothesis* (Fox & Tversky), and anticipates the logistical friction points of running live experiments.

  ### **Session Overview**
  *   **Topic:** Ambiguity Aversion & Comparative Ignorance.
  *   **Time:** 75 Minutes.
  *   **Students:** ~18.
  *   **Goal:** Demonstrate that ambiguity aversion is not just about the *uncertainty* of the bag, but the *uncertainty about one's own competence* relative to others (or the house).

  ---

  ### **1. Materials & Setup (5 Minutes)**
  *   **Bag K (Known):** Transparent container. Visibly contains 10 Red chips, 10 Black chips.
  *   **Bag A (Ambiguous):** Opaque cloth bag. Contains 20 chips (Red/Black mix unknown to students).
  *   **Betting Slips:** Two colors of paper (e.g., White for Round 1, Blue for Round 2).
  *   **Tokens:** Poker chips or printed tickets.
  *   **Payoff Board:** Whiteboard space to track cumulative token scores.
  *   **Prize:** A tangible reward for the top 3 token holders (e.g., chocolate bars, "homework pass," or simply public recognition). *Note: Real money creates ethical/compliance issues; high-value tokens work psychologically.*

  **Prep:**
  *   Pre-fill Bag A with a skewed mix (e.g., 14 Red, 6 Black) but keep it secret.
  *   Arrange seats so students can see each other (theater style or seminar table).

  ---

  ### **2. The Game Rules (No Theory Yet)**
  *Do not mention Ellsberg, Savage, or ambiguity. Read this script:*

  > "We are going to play two rounds of a betting game. In each round, you will bet on the color of a single ball drawn from a bag.
  >
  > **The Payoff:** If you bet on the color that is drawn, you win **10 Tokens**. If you are wrong, you win **0**.
  >
  > **Bag K:** You can see this bag. It has 10 Red, 10 Black.
  > **Bag A:** This bag has 20 balls. Some are Red, some are Black. You do not know the ratio.
  >
  > In each round, I will tell you the specific conditions of *knowledge*. You must write your choice on the slip provided. Keep your tokens; we tally at the end."

  ---

  ### **3. Round 1: The "Expert" Condition (20 Minutes)**
  *Goal: Induce Comparative Ignorance. Make students feel their ignorance is a disadvantage relative to someone else.*

  **The Setup:**
  1.  Place Bag K and Bag A on the table.
  2.  **The Script:** "In this round, you may choose to bet on Bag K or Bag A. However, there is a condition. Before class, **one student in this room was allowed to look inside Bag A.** They know the exact mix. They are bound by an honor code not to reveal it. You do not know who it is."
  3.  **Public Commitment:** "Write your choice (Bag K or Bag A) and your Color (Red or Black) on the **White Slip**. When finished, come to the front and stick your slip on the board publicly so the class can see the distribution of bets."

  **Why this works:**
  *   Students fear looking foolish. If they bet on Bag A, and the "Insider" knows the mix is 90% Black, the student betting Red looks incompetent.
  *   Public posting forces them to compare their knowledge state against the hypothetical insider.
  *   **Prediction:** Heavy preference for Bag K. Severe ambiguity aversion.

  **Execution:**
  *   Collect slips. Stick them on the board.
  *   Draw from Bag K (for those who chose it) and Bag A (for those who chose it).
  *   Pay out tokens immediately.
  *   *Crucial:* Do not reveal the mix of Bag A yet. Keep the mystery alive.

  ---

  ### **4. Round 2: The "Veil of Ignorance" Condition (20 Minutes)**
  *Goal: Remove Comparative Ignorance. Make everyone equally blind.*

  **The Setup:**
  1.  Empty Bag A visibly.
  2.  **The Script:** "In this round, we are changing the information structure. I am going to turn my back. I will drop 20 chips into Bag A without counting the colors. I will seal it. **I do not know the mix. No one in this room knows the mix. Not even the person who was 'the insider' last round.** We are all equally in the dark."
  3.  **Private Commitment:** "You must bet on Bag A only. (Bag K is removed). Write your Color choice on the **Blue Slip**. Fold it. Keep it private. Hand it to me directly."
  4.  **The Choice:** They cannot choose Bag K this time. They *must* engage with the ambiguity, but in a "safe" epistemic environment.

  **Why this works:**
  *   There is no "Expert" to compare against. The instructor is blind too.
  *   Private submission removes social signaling risk.
  *   **Prediction:** Students will engage more willingly. If asked afterwards how confident they felt, it should be higher than Round 1, even though the mathematical ambiguity is identical (or higher, since the mix is now truly random rather than fixed).

  **Execution:**
  *   Perform the "blind fill" theatrically. Turn around. Clatter the chips. Seal the bag.
  *   Collect private slips.
  *   Draw the ball. Pay out tokens.

  ---

  ### **5. The Debrief (25 Minutes)**
  *Now you map the experience to the theory. Do not lecture; ask.*

  **Step 1: The Data Reveal**
  *   Tally Round 1 choices on the board. (Likely: 90%+ on Bag K).
  *   Ask Round 2 participants: "Who felt more comfortable betting in Round 2 than Round 1?" (Show of hands).
  *   Reveal the actual mix of Bag A from Round 1. (e.g., "It was 14 Red, 6 Black. If you bet Red on Bag A, you would have won.").

  **Step 2: Mapping to Concepts**
  *   **Risk vs. Ambiguity:** "In Round 1, Bag K was *Risk* (known probabilities). Bag A was *Ambiguity* (unknown probabilities). Why did you flee Bag A?"
      *   *Target Answer:* Fear of the unknown.
  *   **The Sure-Thing Principle:** "If you prefer Red in Bag K, and you prefer Red in Bag A (assuming 50/50), you should prefer Red regardless of the bag. But many of you refused to play Bag A at all. You violated the idea that irrelevant information (the bag source) shouldn't change your color preference."
  *   **Comparative Ignorance (The Core):** "Why did Round 2 feel different? The odds were just as unknown."
      *   *Target Answer:* In Round 1, I felt stupid compared to the 'Insider.' In Round 2, the Professor was as blind as me.
      *   *Theory Link:* Cite **Fox & Tversky (1995)**. Ambiguity aversion is driven by *competence comparison*. When I evaluate my ignorance in isolation (Round 2), it bothers me less than when I evaluate it relative to a potentially informed peer (Round 1).

  **Step 3: The Philosophical Limit (The "Honest" Close)**
  *   Ask: "Is preferring Bag K a mistake?"
  *   **The Trap:** Savage's Sure-Thing Principle says yes. It's irrational to let the *source* of uncertainty change your bet if the probabilities are effectively the same.
  *   **The Counter:** Keynes/Knight. In the real world, "unknown unknowns" often signal hidden risks (adverse selection). If a salesman offers you a bet on a bag he knows and you don't, *not* betting is the rational survival strategy.
  *   **Conclusion:** "The game doesn't settle if you are 'wrong.' It settles that your brain treats *uncertainty about the world* differently than *uncertainty about your status relative to others.* Decision theory often assumes the former; psychology shows the latter drives the behavior."

  ---

  ### **6. Predictable Failure Modes (And Fixes)**

  **1. The "Insider" Bluff Collapses**
  *   **Risk:** A student calls out, "There is no insider, you're lying."
  *   **Fix:** Use a **Confederate**. Ask a TA or a reliable student *before* class to be the insider. Give them the actual count. Instruct them: "Do not bet obviously. Bet normally." If a student accuses you of lying, the Confederate can quietly admit, "I was the one." This preserves the game's integrity without you breaking trust.
  *   **Alternative:** If no confederate, frame it as "I (the Professor) know the mix." Students accept the Professor as the "Expert" more readily than a peer lie.

  **2. Gaming the Public Board (Round 1)**
  *   **Risk:** Students collude to all bet "Red" on Bag A to force a payout, or to hide the insider.
  *   **Fix:** Emphasize individual token accumulation. "You are competing for the top 3 prizes, not the class total." This creates a prisoner's dilemma that discourages collusion.

  **3. Randomization out of Indifference**
  *   **Risk:** Students flip coins and claim the game proves nothing.
  *   **Fix:** In the debrief, ask: "Did you flip a coin, or did you feel a *pull* toward Bag K?" The *feeling* of aversion is the data point, not just the choice. Acknowledge randomization but note that systematic avoidance of Bag K is the statistical signal.

  **4. The "Rigged Bag" Cynicism**
  *   **Risk:** Students believe Bag A is always stacked against them (0 Red balls).
  *   **Fix:** In Round 2, when you fill the bag blindly, make it noisy and visible. In the debrief, reveal the Round 1 mix. If it was skewed (e.g., 14 Red), point out that betting on Bag A would have paid well. This proves the House wasn't adversarial, just ambiguous.

  ---

  ### **7. The One Thing The Game Can't Settle**
  Be explicit about this in the final 5 minutes.

  > "This game demonstrates *descriptive* truth: you *are* ambiguity averse, and you *are* sensitive to comparative ignorance. It does not prove *normative* truth.
  >
  > If you are a Bayesian Expected Utility maximizer, preferring Bag K is a **mistake**. You assigned a subjective probability to Bag A (likely 50/50) but penalized it simply because the source was vague.
  >
  > However, if you view decision-making as ecological survival, preferring Bag K is **sensible**. In nature, ambiguity often signals a trap set by a predator or a competitor who knows more than you.
  >
  > Decision Theory teaches you how to be consistent. This game teaches you why you aren't."

  ### **Timing Checklist**
  *   **00-05:** Setup & Rules.
  *   **05-25:** Round 1 (Insider/Public).
  *   **25-45:** Round 2 (Blind/Private).
  *   **45-70:** Debrief & Theory Mapping.
  *   **70-75:** The "Mistake vs. Sensible" Conclusion & Prize Award.
