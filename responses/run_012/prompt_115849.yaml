answer: |-
  Here is a breakdown of what is actually on the page, translated for your purposes as a writer.

  **1. Two objects or three?**
  It is two objects. "Sphere" and "Globe" are being used as synonyms here. In 17th-century English (and even now), they both mean a perfectly round ball. Molyneux and Locke are switching terms just to avoid sounding repetitive. You have a cube (box with corners) and a sphere (smooth ball). That's it.

  **2. Can't see the difference, or can't name it?**
  This is the most important part for your scene. Locke and Molyneux are claiming something stronger than a naming problem. It is not that he sees the shapes clearly but doesn't know which one is called "cube."

  The claim is that he cannot visually perceive the shape *as* a shape yet.

  To you, looking at a cube, the idea of "squareness" hits you instantly. To this man, his eyes are receiving light and color, but his brain doesn't know how to organize that data into "object with corners" versus "object without corners." He sees a flat patch of light and shadow, but he doesn't yet understand that the shadow implies depth or that the line implies an edge.

  When Locke says he couldn't say "with certainty," he isn't suggesting the man might guess right. He means the man has no basis for the guess. The visual information is totally unconnected to the tactile information in his head. He knows what a cube *feels* like. He knows what a cube *looks* like (now that he has sight). But he doesn't know that *this look* equals *that feel*.

  For your scene: He isn't just struggling for words. He is struggling to understand that the bright thing in front of him has a physical form he can interact with.

  **3. What is "Experience" doing in that argument?**
  "Experience" here means "learned association."

  Locke is arguing that your brain is not born with a built-in dictionary that translates Touch into Sight. You had to learn, as a baby, that the hard, cold feeling of a rattle goes with the shiny, silver look of the rattle. You did thousands of reps of reaching and grabbing to wire that connection.

  This man has the touch file and the sight file, but they are in two different cabinets. "Experience" is the act of opening both cabinets and stapling the papers together.

  *   **To answer "No" (Locke's side):** You believe the mind is a blank slate. We have to learn that sight and touch correspond to the same objects.
  *   **To answer "Yes" (The opposing side):** You would have to believe that the mind is born with innate knowledge. You'd have to believe God or nature hardwired the brain to automatically know that a sharp angle to the hand *must* look like a sharp angle to the eye.

  Locke is saying: There is no logical reason why a sharp corner *should* look a certain way. You only know it looks that way because you learned it.

  **4. Why the fuss about "same metal" and "nighly the same bigness"?**
  This is to prevent the man from cheating using clues other than shape.

  *   **Same metal:** If the cube was gold and the sphere was lead, they might reflect light differently. One might be brighter or yellower. He might be able to tell them apart by brightness, not shape.
  *   **Same bigness:** If the cube was huge and the sphere was tiny, he could just point to the big one.

  By making them identical in material and size, Molyneux isolates **geometry** as the only variable. The test is purely: Can your eye tell a corner from a curve?

  **5. Is your editor right about the preparation?**
  You are right; your editor is wrong. Based on this text, telling him "the round one will look like the moon" is useless.

  "Looks like" is a visual comparison. If he has never seen the moon, he has no visual library to draw from. You cannot describe a visual experience to someone who has only had tactile experiences. It is like trying to describe the color red to someone who has only ever heard musical notes. There is no bridge between the two senses using words.

  For the preparation to work in a way Locke would accept, they couldn't use visual analogies. They would have to say, "When we take the bandages off, you will feel a sensation in your eyes. We are going to put this ball in your hand at the same time, so you can learn that *this feel* goes with *that light*."

  But simply telling him what it will look like beforehand? That won't work. The "Experience" Locke talks about has to happen *after* the eyes are open, through trial and error, not before through description.

  **Summary for your scene:**
  When the bandages come off, don't write him recognizing shapes. Write him seeing a confusing wash of light and color. He knows there are objects there because he can hear them or because he's told, but he cannot visually separate the cube from the sphere until he reaches out and touches them, slowly teaching his eyes what his hands already know.
