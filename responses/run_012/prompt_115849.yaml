  9.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction on Q2:* Be careful not to say he sees *nothing*. He sees light/color. He just doesn't perceive *depth/shape* immediately. Locke implies the visual idea of a globe is distinct from the tactile idea.
