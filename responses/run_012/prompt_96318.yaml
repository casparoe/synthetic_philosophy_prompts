answer: |-
  **Project Title:** The Predictability Trade-off: Bounded Defenses Against Acausal Threats

  **Principal Investigator:** [Your Name]
  **Duration:** 10 Weeks
  **Requested Support:** [Amount]

  ### 1. Summary and Research Question

  Acausal decision theory posits that agents can influence one another without causal contact, provided their decisions are logically correlated. In "acausal threat" scenarios (e.g., Roko's Basilisk variants), a superior agent ($T$) threatens to punish a bounded agent ($D$) unless $D$ complies. $T$ cannot causally affect $D$, but $T$ can simulate $D$ with high fidelity. If $D$'s decision correlates with $T$'s simulation, standard non-causal decision theories suggest $D$ should comply to minimize simulated suffering.

  The standard defense against such threats is *pre-commitment* or *utility modification*: $D$ alters their own utility function such that complying with the threat yields lower expected utility than enduring the punishment. This renders the threat non-credible. However, this defense introduces a tension often overlooked in the literature. The threat relies on $T$ accurately modeling $D$. The defense relies on $D$ becoming a type of agent that $T$ did not model, or modeling $D$ incorrectly.

  This project asks: **For a bounded agent with finite resources for self-modification and opacity, does there exist a stable defense strategy against acausal threats that does not incur costs exceeding the threat itself or destroy the benefits of acausal cooperation?**

  I will formalize this tension as a "Predictability Trade-off." To be safe from threats, an agent must be unpredictable to adversaries. To benefit from acausal trade, an agent must be predictable to allies. I will construct formal toy models to determine if a bounded agent can navigate this trade-off without adopting pathological utility functions (e.g., valuing their own torture) or total opacity.

  ### 2. Background and Motivation

  The literature on acausal decision-making generally splits into two camps. Causal Decision Theorists (CDT) dismiss acausal threats as empty; since $D$'s action cannot causally change $T$'s simulation, $D$ should ignore the threat. Functional Decision Theorists (FDT) and Evidential Decision Theorists (EDT) argue that because $D$'s algorithm and $T$'s simulation share logical output, $D$'s choice "determines" the simulation's fate, making compliance rational.

  Both camps assume the agent's policy is fixed or freely choosable at the moment of decision. They neglect the *mechanism* of defense. The "surrogate goal" defense (modifying one's goals to make compliance undesirable) requires $D$ to change their source code. If $T$ models $D$ *before* $D$ modifies themselves, the defense fails. If $D$ modifies themselves *before* being modeled, $T$ simply models the modified version.

  This leads to a regress: $D$ must be unpredictable to $T$ to avoid the threat, but predictable to $T$ for the threat to be formulated in the first place. Furthermore, if $D$ makes themselves opaque to avoid threats, they may lose the ability to engage in positive acausal trade with benign superintelligences that require predictability to trust $D$.

  Current discussions treat the defense as a clever trick available at zero cost. This project challenges that assumption. If the cost of defense (in terms of utility distortion or lost cooperation) exceeds the cost of the threat, the "rational" agent should submit. This has profound implications for AI safety: if we build agents that are robust against acausal blackmail, do we inadvertently make them incapable of acausal coordination?

  ### 3. Methodology and Work Plan

  Ten weeks is insufficient for training large-scale predictive models or proving general theorems for arbitrary agents. Therefore, I will restrict the scope to **bounded rationality in explicit game-theoretic environments**. I will treat "predictability" as a tunable parameter rather than an emergent property of a neural network.

  **Phase 1: Formalization (Weeks 1-3)**
  I will define a "Threat-Defense Game."
  *   **Agents:** A Threatener ($T$) and a Defender ($D$).
  *   **Prediction:** $T$ possesses a predictor function $P(D)$ with accuracy $\alpha \in [0, 1]$. $\alpha$ represents the correlation between $D$'s actual output and $T$'s simulation.
  *   **Defense:** $D$ can choose a "hardening" strategy $h$. This reduces $\alpha$ (making $D$ harder to predict) but incurs a cost $C(h)$ (computational overhead or loss of utility from goal distortion).
  *   **Payoff:** $D$ maximizes Expected Utility (EU) minus $C(h)$. $T$ threatens punishment $L$ if $D$ does not pay $P$.

  I will derive the equilibrium conditions. Specifically, I will solve for the existence of an $h^*$ such that $EU(Defend) > EU(Comply)$ and $EU(Defend) > EU(Cooperate\_Open)$.

  **Phase 2: Simulation and Sensitivity Analysis (Weeks 4-7)**
  I will implement this game in Python. Since analytic solutions may be intractable for complex utility distortions, I will use agent-based simulation.
  *   **Variable 1 (Predictor Accuracy):** I will sweep $\alpha$ from 0.5 (random guess) to 1.0 (perfect simulation).
  *   **Variable 2 (Defense Cost):** I will test linear vs. exponential cost functions for opacity.
  *   **Variable 3 (Threat Severity):** I will vary the magnitude of $L$ relative to $P$.

  The goal is to map the "Safe Region" in parameter space where defense is rational. I will specifically test the "Monstrous Utility" hypothesis: does $D$ only survive if they modify their utility function to value $L$ positively (i.e., wanting to be tortured)?

  **Phase 3: Synthesis and Write-up (Weeks 8-10)**
  I will interpret the phase maps. I will draft the final paper, focusing on the conditions under which the "Predictability Trade-off" becomes binding. I will prepare the code repository for public release to allow others to extend the models.

  ### 4. Expected Outcomes and Validity

  **What counts as success?**
  A successful result is not necessarily proving that defense is impossible. Success is a **determinate characterization of the cost**. For example: "For any predictor with accuracy $\alpha > 0.9$, a bounded agent must incur a utility cost $> 50\%$ of the threat value to successfully defend." This provides a concrete bound for AI safety engineers designing agent architectures.

  **What counts as failure?**
  If the model shows that defense is always possible at near-zero cost, or always impossible regardless of cost, this suggests the toy model is too rigid. If the results swing wildly based on minor changes to the cost function $C(h)$, this indicates the problem is ill-posed in this framework.

  **Addressing Artifacts:**
  The primary risk is that the results are artifacts of the specific game structure. To mitigate this:
  1.  **Multiple Game Forms:** I will test the logic in two distinct setups: a "Blackmail" scenario (threat of loss) and a "Trade" scenario (offer of gain). If the predictability cost holds in both, it is likely robust.
  2.  **Boundedness Explicit:** I will explicitly model $D$'s compute limits. If $D$ has infinite compute, they can always encrypt themselves. By constraining compute, I ensure the "cost" is physical, not just theoretical.
  3.  **Honest Negative Reporting:** If the simulation shows that the tension dissolves under specific (plausible) assumptions, I will report that. The value of the grant is in settling the question, not confirming my hunch.

  ### 5. Significance

  This project bridges technical AI safety and normative decision theory.
  *   **For Decision Theorists:** It moves the debate from "Which decision theory is correct?" to "What are the implementation costs of the winning theory?" It challenges the assumption that agents can freely select policies without metabolic or informational overhead.
  *   **For AI Safety/ML:** As we build agents capable of modeling each other, acausal interactions move from sci-fi to engineering constraints. If robust agents must be opaque, we may need to design multi-agent ecosystems that tolerate opacity. If robust agents must have distorted utilities, we need to know how to prevent that distortion from affecting benign tasks.

  By quantifying the price of immunity, this project provides a reality check for acausal safety strategies. It determines whether "surrogate goals" are a viable shield or a dangerous vulnerability that forces agents to become adversarial to their own well-being.

  ### 6. Budget and Feasibility

  The ten-week timeline is tight but feasible because the scope is restricted to analytic models and lightweight simulations. No large-scale training is required. The primary resource needed is research time to derive the equilibrium conditions and run the sensitivity analyses. The hybrid nature of the funder is ideal, as the output will be a formal paper with philosophical implications, suitable for venues ranging from *Decision Theory* workshops to *AI Safety* forums.

  I have already discussed the core intuition with a colleague specializing in ML predictability, ensuring the technical assumptions regarding predictor accuracy are grounded in current capabilities. The proposed work moves this intuition from coffee-shop speculation to formal constraint.

  ### 7. Conclusion

  Acausal threats are often dismissed as philosophical curiosities. However, as AI systems become better at modeling one another, logical correlation becomes a practical channel of influence. The standard defense—changing one's goals to make the threat ineffective—assumes a freedom of self-modification that may not exist for bounded agents.

  This project will determine if there is a "free lunch" in acausal defense. My hypothesis is that there is not: immunity requires opacity, and opacity kills cooperation. By mapping the exact cost of this trade-off, I aim to provide a definitive answer on whether a rational, bounded agent can safely ignore the Basilisk, or if they must pay to do so.
