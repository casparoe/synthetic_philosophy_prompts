  I'm a retired organic chemist whos been reading law blogs for fun and I keep getting confused by the way judges talk about statutes. The textualists say they go by the ordinary meaning of the words and not by what the legislators were trying to achieve. But then in hard cases they'll look at committee reports, or say a literal reading would be absurd, or ask what the statute is for. That looks like purposivism sneaking in the back door. What I want to know is what philosophical commitments this whole practice presupposes. Does it assume that a legal text has a meaning that floats free of any author's intention, or that there's a collective legislative intention, or that meaning is fixed by public conventions plus context? When a judge refuses the literal words to avoid an absurd result, is that a hidden theory of what the legislature must have meant, or is it just a policy override dressed up as interpretation? And what would have to change if we took seriously that a legislature is hundreds of people with different and conflicting aims, so the statute is a compromise that maybe no one intended as a whole? I dont need case names or citations, just the implicit philosophy, and tell me where the practice is underdetermined and could be licensed by several theories. I'm probly mixing up interpretation and legislation here, so set me straight.
