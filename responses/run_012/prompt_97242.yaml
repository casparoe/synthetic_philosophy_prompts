answer: |-
  You have spotted the central tension in modern legal theory. Your intuition is correct: the boundary between "interpreting" a text and "legislating" a policy is porous, and the philosophical justifications judges use often shift to suit the outcome.

  As a chemist, you might think of a statute as a synthesized molecule. The **Textualist** says, "Analyze the structure as it exists in the wild (public meaning)." The **Intentionalist** says, "Look at the lab notebook to see what the chemist was trying to build." The **Purposivist** says, "Determine what reaction this molecule is supposed to catalyze in the social solution."

  The confusion arises because the practice of law presupposes several conflicting philosophical commitments simultaneously. Here is the breakdown of the implicit philosophy, the problem of collective action, and where the practice is underdetermined.

  ### 1. The Ontology of Meaning: Where Does "Meaning" Reside?

  When judges argue about statutes, they are disagreeing about the metaphysical location of meaning. There are three competing commitments here:

  *   **Speaker's Meaning (Intentionalism):** This presupposes that meaning is a mental state. The text is merely evidence of what was in the legislators' minds. The philosophical commitment is that communication is a transfer of psychological states.
  *   **Audience's Meaning (Textualism):** This presupposes that meaning is fixed by public conventions at the time of utterance. It relies on **Speech Act Theory**. The commitment is that once a law is enacted, it detaches from the private minds of the drafters and becomes a public object. The meaning is what a "reasonable person" proficient in the language would understand it to be.
  *   **Reasonable Person/Context (Pragmatism):** This presupposes that meaning is not just semantic (dictionary definition) but pragmatic (contextual implication).

  **Your specific question:** *Does it assume meaning floats free of intention?*
  **Answer:** Modern Textualism argues that meaning is fixed by **public conventions**, not private intentions. It does not "float free"; it is anchored in the linguistic community. However, when a judge looks at committee reports (legislative history), they are implicitly admitting that public conventions are insufficient to fix meaning, and they are smuggling in **Intentionalism**.

  ### 2. The Metaphysics of the Legislature: The "Collective Mind" Problem

  You asked what happens if we take seriously that a legislature is hundreds of people with conflicting aims. This is the strongest philosophical critique of statutory interpretation.

  *   **The Fiction of Unity:** To interpret a statute as having a "purpose," the court must presuppose that the legislature is a single rational agent. Philosophically, this is a **constructive fiction**. We pretend the legislature is a person to make sense of the text.
  *   **The Compromise Theory:** If you reject the fiction of unity, the statute is merely a "deal." The text is the only thing that survived the vote. Different legislators voted for it for different reasons (some for purpose A, some for purpose B).
      *   *Philosophical Consequence:* If you take this seriously, **Purposivism becomes impossible.** You cannot ask "what was the purpose?" because there were 535 different purposes. The only coherent object is the text itself.
      *   *The Textualist Solution:* Textualists often rely on this. They argue that because we cannot know the collective mind, we must stick to the text, because the text is the only thing that was actually voted on and enacted.
      *   *The Skeptic's Solution:* If you push this further (Legal Realism), you conclude that there is no "law" in the statute, only power. The judge is simply choosing which faction's purpose to honor.

  ### 3. The Absurdity Doctrine: Linguistics or Policy Override?

  When a judge refuses a literal reading to avoid an "absurd result," they are navigating the boundary between semantics and norms.

  *   **The Linguistic Defense:** Textualists argue this is not policy; it is linguistics. In ordinary conversation, if someone says, "No vehicles in the park," and an ambulance rushes in to save a life, we do not understand the word "vehicle" to include "emergency ambulance in crisis." We understand the *pragmatic context* limits the semantic meaning. Therefore, avoiding absurdity is part of **reading**, not **rewriting**.
  *   **The Normative Defense:** Critics argue this is a policy override. If the text clearly covers the ambulance, but the judge excludes it, the judge is saying, "The legislature *should not* have meant this." This presupposes that the **Rule of Law** (fairness/rationality) trumps **Democratic Enactment** (the text).
  *   **The Hidden Theory:** When a judge invokes absurdity, they are usually presupposing a **Rational Lawgiver**. They assume the legislature *could not have* intended X, because X is irrational. This is a hidden theory of intention. It assumes the legislature is a rational agent, which circles back to the "Fiction of Unity" problem above.

  ### 4. Interpretation vs. Legislation (Construction)

  You suspected you might be mixing these up. In legal theory, there is a distinction (though often blurred) between:

  *   **Interpretation:** Discovering the semantic content of the text. (What do the words mean?)
  *   **Construction:** Determining the legal effect when the text is ambiguous or silent. (How do we apply this?)

  **The Philosophical Commitment:** The practice presupposes a **Separation of Powers**. Judges are supposed to Interpret; Legislators are supposed to Legislate.
  **The Reality:** When a text is vague (e.g., "reasonable care," "discrimination"), the judge *must* make a policy choice to resolve the case. This is **Construction**.
  **The Confusion:** Judges often describe their Construction work as Interpretation to maintain the illusion that they are not legislating. This is where your observation of "purposivism sneaking in the back door" is most accurate. When a judge uses "purpose" to resolve an ambiguity, they are often engaging in **normative construction** (making policy) but describing it as **semantic interpretation** (finding meaning).

  ### 5. Where the Practice is Underdetermined

  This is the crux of your question. There are specific zones where the judicial practice is compatible with multiple, conflicting theories. You cannot tell from the outside which philosophy the judge is using.

  **A. The Definition of "Context"**
  *   *Theory 1 (Textualist):* Context means other words in the statute and the grammatical structure.
  *   *Theory 2 (Purposivist):* Context means the social problem the statute was trying to fix.
  *   *Underdetermination:* A judge can say, "Looking at the context, the word means X." They do not have to specify *which* context. Both theories license the move, but they justify it differently.

  **B. The "Ordinary Meaning" Standard**
  *   *Theory 1:* Ordinary meaning is what a layperson reads in a dictionary.
  *   *Theory 2:* Ordinary meaning is what a reasonable person understands given the legal consequences.
  *   *Underdetermination:* If a judge says, "The ordinary meaning of 'vehicle' does not include airplanes," is that a linguistic fact or a policy choice to limit liability? Both theories yield the same sentence, but the philosophical commitment is different.

  **C. The Use of Legislative History**
  *   *Theory 1:* We look at reports to understand the *meaning* of ambiguous words (Linguistic aid).
  *   *Theory 2:* We look at reports to understand the *goal* of the statute (Purposive aid).
  *   *Underdetermination:* A judge cites a committee report. Are they using it as a dictionary (Textualist move) or as a statement of goal (Purposivist move)? The practice looks identical; the philosophy differs.

  ### Summary of Implicit Commitments

  To make the system function, the law presupposes a **hybrid philosophy** that is logically unstable but practically necessary:

  1.  **Objectivity:** It assumes texts have objective meanings (Textualism) to constrain judges.
  2.  **Rationality:** It assumes the legislature is a rational agent with coherent goals (Purposivism) to make the law functional.
  3.  **Authority:** It assumes the enacted text is the only legitimate source of law (Democracy) to preserve separation of powers.

  **The Chemist's Takeaway:**
  You are observing a system trying to balance **Structure** (Text) with **Function** (Purpose).
  *   If you prioritize Structure, you get rigid laws that may fail in new contexts (Literalism).
  *   If you prioritize Function, you get flexible laws that depend on the judge's view of the purpose (Purposivism).

  The "sneaking in the back door" you see is the system's immune response. Pure Textualism often leads to results that violate the system's own sense of justice. So, judges implicitly switch to Purposivism to save the system from itself, but they dress it in Textualist language to maintain the legitimacy of their authority. They claim they are "interpreting" (finding) when they are often "constructing" (making).

  **What would change if we took the "Collective Compromise" seriously?**
  If we truly accepted that there is no collective intention, only a coalition of votes:
  1.  **Purpose would vanish:** You couldn't ask "what is this law for?" because there is no single "for."
  2.  **Text would become absolute:** The only thing the coalition agreed on was the words.
  3.  **Judicial Power would shrink:** Judges would have no license to "fix" absurdities unless the text itself was contradictory.

  The fact that judges *don't* do this proves that the legal system presupposes a **Fiction of Coherence**. It treats the statute as if it were written by a single rational author, because without that fiction, the law becomes merely a record of political power struggles, which undermines its claim to authority.
