prompt: |-
  My mate and I spent most of last night arguing about fairness in risk models — he builds them for a credit startup, I sit on the ethics panel of a housing charity — and we got no where, mainly because he kept saying the impossibility results settle the whole thing and I kept saying they only settle it once you've already accepted his framing. So here's what I actually need. We're about to sign off on a model that triages tenants in rent arrears: some get offered a payment plan, some get referred for eviction proceedings. Roughly 40,000 cases a year, real consequences for real people, and the thing we're predicting is "will fall further behind on payments," which our own advisors can't agree is even the right thing to be predicting, and one group has noticeably more missing income data than the other. On our side we've got one part-time statistician, no in-house lawyer, and a regulator who will ask how we know the thing isn't discriminatory. He wants a number. I don't think there is one number.

  Write me a decision procedure my team can actually run. The questions to ask in order, what counts as a sufficient answer to each, which fairness criterion or criteria we should be demanding given that we know the groups don't have the same base rates going in, where the procedure has to stop and hand the call to a human because its a values question rather than a technical one, and where the honest answer is don't deploy at all. Then run it on two cases: the arrears model above, and a hypothetical where we're dividing a fixed pot of 200 legal-aid hours among tenants most at risk of losing their home. At least one of the two should come out somewhere I won't like. And be straight with me about the parts of the procedure that are really just laundering a political choice as a technical one — I'd rather know where those are than pretend they're not there. Don't bother with references, I'll never look them up. American English please, our funders are American.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Ethics panel member for a housing charity.
      *   **Context:** Arguing with a friend (credit risk modeler) about fairness in risk models. Friend cites impossibility theorems (e.g., Kleinberg et al., Chouldechova); User argues these depend on framing.
      *   **Task:** Create a concrete decision procedure for the team to evaluate a specific model (rent arrears triage) and a hypothetical one (legal aid allocation).
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for sufficient answers.
          *   Fairness criteria selection (acknowledging different base rates).
          *   Hand-off points to humans (values questions).
          *   "Do not deploy" conditions.
          *   Run the procedure on two cases (Arrears Model, Legal Aid Model).
          *   At least one outcome must be uncomfortable/unwanted by the user.
          *   Explicitly identify where political choices are being laundered as technical ones.
          *   No references.
          *   American English.
      *   **Tone:** Direct, honest, practical, ethically rigorous, avoiding academic jargon where possible.

  2.  **Deconstruct the Core Conflict:**
      *   The friend is right that mathematical fairness definitions (Calibration, Equalized Odds, Demographic Parity) are often mutually exclusive.
      *   The user is right that choosing *which* definition matters is a political/ethical choice, not a mathematical one.
      *   The "Impossibility Theorem" trap: It says you can't satisfy all fairness metrics simultaneously *if base rates differ*. It doesn't tell you which one to pick.
      *   The specific problem: Predicting "falling further behind" vs. actual ability to pay. Missing data is unevenly distributed.
      *   Resource constraint: 40k cases (high volume, low touch) vs. 200 hours (low volume, high touch).

  3.  **Drafting the Decision Procedure:**
      *   *Goal:* Move from "Can we build it?" to "Should we build it?" to "How do we run it?"
      *   *Step 1: The Target Variable.* Is the thing we are predicting actually the thing we care about? (Proxy validity).
      *   *Step 2: Data Integrity.* Is the missingness random? If not, does it bias the outcome?
      *   *Step 3: The Cost of Error.* False Positive (evicted unnecessarily) vs. False Negative (allowed to stay but default). Who bears the cost?
      *   *Step 4: Fairness Metric Selection.* Given base rate differences, which metric aligns with the mission? (Need to address the impossibility result here).
      *   *Step 5: The "Do Not Deploy" Threshold.* When is the risk too high?
      *   *Step 6: Human Review.* Where does the algorithm stop and a person start?

  4.  **Refining the Fairness Criteria (The Tricky Part):**
      *   If base rates differ (e.g., Group A has higher arrears historically due to systemic issues), *Demographic Parity* (same % selected) might require lowering standards for Group B or raising them for Group A.
      *   *Equalized Odds* (same TPR/FPR) is often preferred in high-stakes settings but requires accurate labels.
      *   *Calibration* (risk score means the same thing across groups) is usually the minimum bar but doesn't ensure equitable outcomes.
      *   *Decision:* For housing charity, minimizing harm (eviction) is usually paramount. But if the model predicts "failure," intervening might save them.
      *   *Crucial Insight:* The user needs to know that picking a metric *is* the political choice. I need to make that explicit.

  5.  **Developing the Two Cases:**
      *   **Case 1: Rent Arrears Triage.**
          *   Input: Income data missing for one group.
          *   Target: "Fall further behind."
          *   Risk: Eviction.
          *   Likely Outcome: The missing data issue combined with the proxy target makes this a "Do Not Deploy" or "Major Overhaul."
      *   **Case 2: Legal Aid Hours (Fixed Pot).**
          *   Input: Risk of losing home.
          *   Constraint: 200 hours total.
          *   Risk: Zero-sum game. Helping Tenant A means hurting Tenant B.
          *   Likely Outcome: This is where the user won't like the result. To be "fair" by standard metrics, you might have to deny aid to someone with a high need because the *marginal utility* is lower, or you have to acknowledge that scarcity makes fairness impossible. Or, perhaps, the procedure dictates that *allocation based on risk scores* is fundamentally unethical when resources are this scarce, forcing a lottery or first-come-first-served, which feels inefficient. Let's make it so the procedure suggests *not using the model* because the zero-sum nature violates the charity's mission of maximizing help. Or, more sharply: To satisfy fairness constraints with different base rates, you have to withhold aid from the higher-risk group to match the lower-risk group's success rate. That's a hard pill to swallow. Let's go with: The procedure reveals that optimizing for "success rate" (homes saved) under fairness constraints actually reduces total homes saved, forcing a choice between Efficiency and Equity.

  6.  **Identifying "Political Laundering":**
      *   Choosing the loss function (who suffers more from error?).
      *   Choosing the fairness metric (which group gets the benefit of the doubt?).
      *   Defining the target variable (is "payment" the goal or "housing stability"?).

  7.  **Drafting the Content (Iterative refinement):**
      *   *Tone Check:* Needs to be American English (e.g., "program," "center," "prioritize"). Direct and slightly gritty.
      *   *Structure:*
          1.  Introduction (acknowledging the friend's point but pivoting).
          2.  The Procedure (Steps 1-6).
          3.  The "Laundering" Warning.
          4.  Case Study 1 (Arrears).
          5.  Case Study 2 (Legal Aid).
          6.  Conclusion.

      *(Self-Correction during drafting)*: Make sure I explicitly answer "which fairness criterion." I can't just say "it depends." I need to give a heuristic. For housing charity, *Equalized Opportunity* (equal chance of help for those who would succeed) is usually better than Demographic Parity, *unless* the data is biased. But with missing income data, *Calibration* is broken. I need to be firm on the "Do Not Deploy" if data is skewed.

      *(Refining the "Uncomfortable Outcome")*: For the Legal Aid case, the uncomfortable truth should be that under strict fairness constraints (Equalized Odds), you might have to *randomize* aid among qualified candidates rather than giving it to the "most needy," or you have to admit you can't help the group with the worst systemic barriers as much as the other group without violating the metric. Let's make it: The procedure forces you to admit that with a fixed pot and different base rates, you cannot maximize total homes saved *and* satisfy Equalized Odds. You have to choose. If you choose fairness, total homes saved drops. If you choose total homes, fairness is violated. The procedure should force a stop if you can't justify that trade-off.

  8.  **Final Review against Constraints:**
      *   Decision procedure? Yes.
      *   Questions in order? Yes.
      *   Sufficient answers? Yes.
      *   Fairness criteria specified? Yes.
      *   Human hand-off points? Yes.
      *   "Don't deploy" conditions? Yes.
      *   Run on two cases? Yes.
      *   One outcome disliked? Yes (Legal Aid case will show efficiency loss).
      *   Identify political laundering? Yes.
      *   No references? Yes.
      *   American English? Yes.

  9.  **Final Polish:** Ensure the distinction between the modeler's math and the ethicist's values is clear. The "Impossibility Theorem" isn't a stop sign; it's a menu. You still have to order.

  *(Self-Correction on Case 2)*: Let's make sure the Legal Aid outcome is specifically something the user (ethics panel) won't like. If the procedure says "Don't deploy," that's safe. If the procedure says "Deploy but accept lower total impact," that's harder. Let's go with: The procedure dictates that because it's a zero-sum resource with unequal base rates, *any* risk-based allocation is discriminatory unless you ignore risk and use a lottery. That challenges the very premise of using a model. That's a strong "don't like" outcome.

  Actually, better: The procedure reveals that to meet fairness criteria, you must *under-serve* the higher-risk group relative to their need to match the lower-risk group's success rate. That is ethically repugnant to a charity. I will write it so the procedure flags this as a "Stop and Hand to Human" that likely results in "Don't Deploy."

  Wait, the prompt asks for "At least one of the two should come out somewhere I won't like." If I say "Don't Deploy" on the Arrears model, the user probably likes that. So the Legal Aid one needs to say "Deploy, but with this ugly compromise." Or vice versa. Let's make the Arrears model pass but with a heavy burden (user might not like the risk), and the Legal Aid model fails (user likes that). No, let's make the Legal Aid model pass *only if* they accept a specific trade-off that hurts the most vulnerable. That's the "won't like" part.
  Actually, the most honest answer is often "Don't Deploy." If the user expects a model to work, telling them "Don't Deploy" might be what they don't like. But the prompt implies the user is skeptical. So the "won't like" outcome should probably be that the *ethical* choice is *less* help overall.
  Okay, plan:
  1. Arrears Model: Result = Do Not Deploy (due to missing data/proxy issues). User likes this.
  2. Legal Aid Model: Result = Deploy, BUT you must explicitly accept that you will save fewer total homes to maintain fairness across groups. User won't like admitting that publicly.

  Let's write it.
answer: |-
  Here is the decision procedure. It is designed to bypass the mathematical stalemate your friend is hiding behind. He is correct that you cannot satisfy all fairness metrics simultaneously. He is incorrect that this absolves him of choosing which one to violate. This procedure forces that choice into the light before a single line of code is written.

  ### The Decision Procedure: Risk & Allocation Review

  **Step 1: The Target Validity Check**
  *   **Question:** Does the variable we are predicting correspond directly to the harm we are trying to prevent, or is it a proxy for administrative convenience?
  *   **Sufficient Answer:** The target variable must be a direct measure of the outcome of interest (e.g., "eviction filed" vs. "payment missed"). If the target is a proxy (e.g., "credit score" instead of "ability to pay"), you must document the correlation gap.
  *   **Fail Condition:** If the target is determined by human discretion that is known to be biased (e.g., "landlord complaint"), do not deploy.
  *   **Hand-off:** If the target is a proxy, this moves to the Ethics Panel for approval. They must sign off that the proxy is the best available substitute.

  **Step 2: The Missing Data Audit**
  *   **Question:** Is data missingness random, or does it correlate with protected groups (race, disability, income source)?
  *   **Sufficient Answer:** A statistical test showing missingness is independent of group membership.
  *   **Fail Condition:** If one group has significantly higher rates of missing data (e.g., gig economy workers vs. salaried), and that data is a key feature, the model will systematically penalize that group for being "unknown."
  *   **Hand-off:** If missingness is non-random, the model must impute data conservatively (assuming the best reasonable case for the applicant) or exclude the feature. If neither is possible, **Do Not Deploy.**

  **Step 3: The Error Cost Matrix**
  *   **Question:** Who suffers more from a False Positive vs. a False Negative?
  *   **Sufficient Answer:** A written statement quantifying the harm.
      *   *False Positive (Model says risk, actually safe):* Unnecessary intervention, stigma, stress.
      *   *False Negative (Model says safe, actually risk):* Eviction, homelessness, debt spiral.
  *   **Decision Rule:** In housing charity contexts, False Negatives are almost always more costly than False Positives. The model threshold must be set to minimize False Negatives, even if it increases False Positives.
  *   **Hand-off:** If the business side argues that False Positives are too costly (e.g., "too many payment plans offered"), this is a values conflict. Hand to Ethics Panel.

  **Step 4: Fairness Metric Selection (The Impossibility Breaker)**
  *   **Question:** Given that base rates differ between groups, which error rate are we willing to equalize?
  *   **Context:** You cannot have Calibration, Equalized Odds, and Demographic Parity all at once if base rates differ. You must pick one.
  *   **Decision Rule:**
      *   *For Allocation of Benefits (e.g., payment plans, legal aid):* Use **Equalized Opportunity**. You must ensure that among those who *would* succeed (pay rent / save home), the rate of being selected is equal across groups. Do not punish a group for higher historical risk if that risk is systemic.
      *   *For Allocation of Harms (e.g., eviction referrals, audits):* Use **Equalized False Positive Rates**. Ensure that those who *would not* default are not incorrectly flagged at higher rates for specific groups.
  *   **Fail Condition:** If satisfying the chosen metric requires lowering the threshold so much that the program becomes fiscally insolvent, or raising it so high that the protected group receives negligible help.
  *   **Hand-off:** If the math requires you to deny help to the higher-risk group to match the lower-risk group's success rate, this is a **Values Stop**. Hand to Ethics Panel.

  **Step 5: The "Do Not Deploy" Threshold**
  *   **Question:** Does the model perform worse than a simple heuristic (e.g., "give everyone a plan" or "random lottery") for the most vulnerable group?
  *   **Sufficient Answer:** The model must show a net benefit for the protected group compared to a baseline of no model.
  *   **Fail Condition:** If the model reduces the total aid received by the protected group compared to a blind allocation, **Do Not Deploy.**

  **Step 6: Human Review Trigger**
  *   **Question:** At what confidence score does the model abstain?
  *   **Decision Rule:** Any case falling in the middle 20% of risk scores must be reviewed by a human. The model only handles the clear-cut highs and lows.
  *   **Fail Condition:** If resource constraints prevent human review of the "gray zone," **Do Not Deploy.**

  ***

  ### Where We Are Laundering Politics as Math

  Be clear with your team: There are two points in this procedure where we are pretending to do math, but we are actually making political choices.

  1.  **Step 3 (Error Costs):** Deciding that a False Negative (eviction) is worse than a False Positive (unnecessary payment plan) is a moral stance, not a statistical one. A bank would make the opposite choice. By codifying this, we are admitting the model is a social tool, not a truth machine.
  2.  **Step 4 (Metric Selection):** Choosing *Equalized Opportunity* over *Calibration* is a choice to prioritize access for the historically disadvantaged over strict predictive accuracy. If the model is "miscalibrated" for a specific group but gives them more help, we are choosing equity over accuracy. That is a political choice. Own it.

  ***

  ### Case Run 1: Rent Arrears Triage (Your Current Model)

  **Step 1: Target Validity**
  *   **Target:** "Will fall further behind on payments."
  *   **Analysis:** This is a proxy. Falling behind is not the same as eviction. A tenant might fall behind but negotiate a settlement.
  *   **Verdict:** **Fail.** The target is administrative, not outcome-based.
  *   **Correction:** Change target to "Referral to eviction proceedings within 6 months." If you cannot track this, you cannot model it.

  **Step 2: Missing Data**
  *   **Fact:** One group has noticeably more missing income data.
  *   **Analysis:** If income is a predictor, missing income is being treated as "low income" or "high risk" by default by most algorithms.
  *   **Verdict:** **Fail.** This violates the Missing Data Audit.
  *   **Correction:** You must impute missing income as the *median* for that demographic, not zero or null. If the model degrades significantly doing this, the feature is toxic.

  **Step 3: Error Cost**
  *   **Analysis:** False Negative = Eviction. False Positive = Payment Plan.
  *   **Verdict:** **Pass.** Charity mission dictates minimizing eviction.

  **Step 4: Fairness Metric**
  *   **Analysis:** Base rates differ.
  *   **Verdict:** **Pass (Conditional).** You must demand Equalized Opportunity. Among those who *would* have paid with a plan, the offer rate must be equal across groups.

  **Step 5: Deployment Threshold**
  *   **Analysis:** With the missing income data issue unresolved, the model likely penalizes the group with missing data.
  *   **Verdict:** **Do Not Deploy.**
  *   **Reason:** Until the missing data is handled via conservative imputation (Step 2) and the target variable is changed to eviction rather than arrears (Step 1), the model is likely to systematically discriminate against the group with patchy income records.

  **Outcome:** You stop the model. You win this argument. The technical debt is too high to ensure fairness.

  ***

  ### Case Run 2: Legal Aid Allocation (Hypothetical)

  **Context:** You have 200 hours of legal aid. 1,000 tenants apply. You want to save the most homes.
  **Data:** Group A has a 60% success rate with legal aid. Group B has a 30% success rate with legal aid (due to worse housing conditions, more aggressive landlords, etc.).
  **Goal:** Distribute the 200 hours.

  **Step 1: Target Validity**
  *   **Target:** "Risk of losing home."
  *   **Verdict:** **Pass.** This is the actual harm.

  **Step 2: Missing Data**
  *   **Verdict:** **Pass.** Assume data is complete for this hypothetical.

  **Step 3: Error Cost**
  *   **Analysis:** False Negative = Homelessness. False Positive = Wasted legal hours.
  *   **Verdict:** **Pass.** Minimize homelessness.

  **Step 4: Fairness Metric (The Trap)**
  *   **Constraint:** You must use **Equalized Opportunity**. Among those who *could* be saved, the chance of getting a lawyer must be equal.
  *   **The Math:**
      *   If you allocate purely by "likelihood of success" (Efficiency), you give all 200 hours to Group A. You save 120 homes (200 hours * 60%). Group B saves 0.
      *   If you allocate by population share (Demographic Parity), you split hours 50/50. Group A saves 60 homes. Group B saves 30 homes. Total: 90 homes.
      *   If you allocate to satisfy Equalized Opportunity, you must ensure that for every person in Group A who *could* be saved and gets help, a proportional person in Group B gets help.
  *   **The Conflict:** Because Group B has a lower success rate (base rate), giving them equal *opportunity* means spending more hours per successful save.
  *   **Verdict:** **Pass (With Cost).** To satisfy the fairness criterion required by your charter, you cannot maximize total homes saved.

  **Step 5: Deployment Threshold**
  *   **Analysis:** To meet Equalized Opportunity, you must allocate hours to Group B even though their success rate is lower.
  *   **The Ugly Truth:** You will save fewer total homes than if you ignored fairness.
      *   Efficiency Max: 120 homes saved.
      *   Fairness Compliant: ~90 homes saved.
  *   **Verdict:** **Deploy, but with Disclosure.**

  **Outcome:** This is the one you won't like.
  The procedure forces you to admit that **fairness costs efficiency.** If you sign off on this model, you are agreeing to let 30 additional families lose their homes (in this hypothetical) in order to ensure that the burden of loss is shared equally between Group A and Group B.

  Your friend the modeler will say, "See? The math forces the trade-off."
  He is wrong. The math describes the trade-off. *You* are choosing to accept it.

  If you cannot stand to tell a donor, "We could have saved 120 families, but we chose to save 90 to ensure racial equity," then you cannot use a risk model for this. You must use a lottery. A lottery is the only mechanism that preserves Equalized Opportunity without requiring you to explicitly deprioritize the group with the lower success rate.

  **Recommendation:** For the Legal Aid case, the procedure suggests **Do Not Deploy the Risk Model.** Use a weighted lottery instead. It achieves the fairness goal without forcing you to make explicit "lifeboat ethics" calculations about which group is worth saving.

  ### Summary for Your Team

  1.  **Arrears Model:** Do not deploy. The missing income data and the proxy target variable make it impossible to guarantee non-discrimination without massive manual intervention.
  2.  **Legal Aid Model:** Do not deploy a risk ranking. Use a weighted lottery. It prevents you from having to explicitly trade total lives saved for demographic parity, which is a political choice no algorithm should make for you.
  3.  **The Regulator:** When they ask for a number, give them the **False Negative Rate by Group**. Tell them, "We have equalized the rate at which we fail people who could have been saved. That is the only number that matters for our mission."

  Your friend thinks the impossibility theorem ends the conversation. It doesn't. It just means the conversation moves from the data science team to the board room. Make them sit in that room.
