answer: |-
  **MEMORANDUM**

  **TO:** Interdisciplinary Research Committee, Larkspur Foundation
  **FROM:** Chair, Interdisciplinary Research Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Plant Cognition Grant Applications (Proposals 44-A and 44-B)

  **1. Purpose and Context**

  This memo serves to guide our vote this Thursday regarding two competing grant applications in the domain of plant signaling. As you know, both teams propose to study the same physiological pathway: a systemic signal produced by damaged leaves that alters future growth. Both teams agree on the empirical data and the adaptive nature of the response. The conflict arises entirely over terminology. Team A (Physiology) classifies this signal as a "representation," implying a minimal form of plant cognition. Team B (Philosophy) argues that applying the term "representation" is a category mistake, as the signal lacks specific logical properties required for genuine representation.

  Our committee is currently deadlocked between three positions: funding only Team B (on the grounds that Team A is conceptually confused), funding both (allowing the science to decide), or tabling both until terminology is resolved.

  Having analyzed the dispute through the lens of meta-ontology, specifically utilizing the two-part diagnostic test proposed by our committee logician, I recommend that we **fund both applications**, subject to specific conditions regarding collaboration and terminology. The following sections detail the application of the diagnostic tests, the residual underdetermination, and the rationale for this decision.

  **2. Diagnostic Framework: Defining the Terms**

  To ensure we are all operating from the same conceptual baseline, I will define the technical terms central to our logician's test and the grant dispute:

  *   **Merely Verbal Dispute:** A disagreement where parties appear to disagree but actually agree on all underlying facts and predictions; the conflict stems solely from using words with different definitions.
  *   **Substantive Dispute:** A disagreement where parties disagree on facts, predictions, or the viable pathways for future inquiry.
  *   **Decouplable Content:** A property of a representation where the internal state can occur *without* the external condition it usually indicates (e.g., a smoke detector ringing without fire).
  *   **Misrepresentation:** The possibility that a representation can be *wrong* (e.g., the plant signals "damage" when there is none). Team B argues genuine representation requires this possibility; Team A does not.

  Our logician proposes two tests to distinguish these dispute types:
  1.  **The Substitution Test:** If we replace the disputed term ("representation") with each party's specific definition, do the remaining claims become logically compatible and do they make the same predictions about observations?
  2.  **The Downstream-Question Test:** Does one definition make a class of research questions askable while the other definition forbids or renders nonsensical those same questions?

  **3. Application of the Tests**

  **A. The Substitution Test**
  When we apply the Substitution Test, the dispute appears **merely verbal**.
  *   *Team A Definition:* "Representation" = "A systemic signal that alters future growth based on damage."
  *   *Team B Definition:* "Representation" = "A state with decouplable content and the possibility of misrepresentation."

  If Team A states, "Plants produce systemic signals that alter growth," and Team B states, "Plants produce systemic signals that alter growth, but these are not decouplable states," there is no logical contradiction. Both teams agree on the physiology, the existence of the signal, and the adaptive outcome. Neither team predicts a different experimental outcome regarding the signaling pathway itself. Empirically, they are describing the exact same world.

  **B. The Downstream-Question Test**
  When we apply the Downstream-Question Test, the dispute appears **substantive**.
  *   *Team A's Framework:* By labeling the signal a "representation," Team A licenses questions such as: "What is the *content* of the plant's signal?" "Can we measure the *accuracy* of the plant's assessment?" "Does the plant integrate multiple signals into a *belief*?"
  *   *Team B's Framework:* By denying the label, Team B forbids these questions as category mistakes. Their research program focuses on: "What is the causal mechanism?" "Is the signal hardwired?" "How does selection pressure shape the threshold?"

  Here, the definitions dictate different research trajectories. Team A's vocabulary opens a heuristic path toward cognitive ethology; Team B's vocabulary closes that path to focus on mechanistic physiology. Because the definitions determine which questions are permissible, the dispute has substantive consequences for the direction of scientific inquiry.

  **4. What the Tests Leave Underdetermined**

  The tests yield conflicting results. The Substitution Test suggests we are arguing over words (Verbal), while the Downstream-Question Test suggests we are arguing over the future of the field (Substantive).

  This leaves **scientific utility** underdetermined. We cannot know *a priori* whether adopting the "cognition" vocabulary will yield novel discoveries or merely confuse the literature. It is possible that treating the signal as a representation will generate productive hypotheses about plant behavior that a strictly mechanistic view would miss. Conversely, it is possible that it will lead to anthropomorphic dead-ends. The tests tell us *that* the research paths diverge, but they cannot tell us *which* path is more fruitful. That is an empirical question, not a philosophical one.

  **5. Engagement with the Rejected Position**

  I know several members of this committee intend to vote for Team B only. The strongest argument on this side is that funding Team A legitimizes an **equivocation** that threatens the conceptual clarity of biology. As Team B argues, if we allow "representation" to apply to hardwired physiological signals that cannot misrepresent, we dilute the term until it loses explanatory power. If everything that responds adaptively is "cognitive," then "cognition" explains nothing. This is a serious concern regarding conceptual inflation.

  However, rejecting Team A on these grounds assumes we already know the outcome of the Downstream-Question Test. It assumes the "cognition" heuristic is *necessarily* unproductive. History suggests otherwise. In the 20th century, terms like "memory" and "feedback" were contested when applied to computers and genes. Critics argued these were category mistakes. Yet, adopting that vocabulary facilitated breakthroughs in genetics and cybernetics that a strict mechanistic vocabulary might have delayed.

  To fund only Team B is to decide a scientific question via philosophical fiat. It privileges conceptual purity over exploratory potential. While Team B is likely correct that plants do not possess "representations" in the robust human sense, they may be incorrect that the term is useless as a functional model. We should not pre-emptively censor a research program that might yield unexpected predictive success, provided the ambiguity is managed.

  **6. Recommendation and Conditions**

  Therefore, I move that the Larkspur Foundation **fund both proposals**.

  This decision acknowledges that while the dispute is verbally resolvable (Test 1), it is heuristically substantive (Test 2). We should support both heuristics to see which generates better science. However, to mitigate the risk of conceptual confusion, funding is contingent upon the following conditions:

  1.  **Joint Conceptual Workshop:** Within the first six months of the grant period, both Principal Investigators must co-host a workshop titled "Semantics and Signaling in Plant Biology." They must produce a joint white paper delineating exactly where their terminologies diverge and where they overlap.
  2.  **Cross-Referencing:** Publications resulting from these grants must cite the counterpart grant's relevant findings. Team A must acknowledge the philosophical constraints on "representation"; Team B must acknowledge the functional utility of the "cognitive" model where applicable.
  3.  **Terminology Appendix:** Any joint or parallel publications must include a standardized glossary defining how terms like "representation," "signal," and "information" are being used in that specific context.

  **7. Timeline**

  *   **Vote:** Thursday, October 26.
  *   **Grant Award:** November 15.
  *   **Workshop Deadline:** May 15 (Year 1).
  *   **White Paper Submission:** July 1 (Year 1).
  *   **Mid-Term Review:** The Foundation will review the White Paper to assess if the terminological friction is being productively managed before releasing the second year of funding.

  **8. Conclusion**

  We are not merely voting on plants; we are voting on how we adjudicate boundary disputes between philosophy and science. By funding both, we treat the definition of "cognition" as a hypothesis to be tested by the productivity of the research, rather than a premise to be enforced by the committee. This approach respects the empirical agreement highlighted by the Substitution Test while embracing the investigative divergence highlighted by the Downstream-Question Test.

  I look forward to our discussion on Thursday.
