answer: |-
  **Credence:** 65%

  **Decomposition:**

  *   **0.9 — Frequency of indirect dominance:** Over century-long timescales, trajectory changes mathematically overwhelm near-term welfare deltas in expected value calculations.
  *   **0.7 — Sign correlation:** Systemic effects (political equilibrium, institutional trust) have path dependence and momentum, behaving less like symmetric noise and more like biased random walks.
  *   **0.3 — Procedure recoverability:** There is only a 30% chance that robustness checks or toy models capture the specific variables that actually drive the tail-risk divergence between these causes.
  *   **0.6 — Effect divergence:** Deworming (demographic/economic stabilization) and pandemic prep (institutional/security stabilization) likely perturb different levers of the "swamp," preventing perfect cancellation.

  **Combination:**
  The 65% is not a strict product of these terms (which would be lower) but a weighted synthesis: Term 1 (Magnitude) acts as a multiplier on the uncertainty generated by Terms 2 and 4, while Term 3 (Recoverability) acts as the cap. Even if indirect effects are structured and divergent, if we could model them (Term 3), the "cluelessness" would vanish; since we likely can't, the swamp retains the tie-break.

  **Most Sensitive Term:**
  **Procedure recoverability (0.3).** If you can demonstrate that a specific, tractable decision rule (e.g., "maximize robust good") reliably tracks long-term value *even when* indirect effects dominate, the credence in the "swamp" claim collapses toward zero.

  **What Would Change My Mind:**
  **The Proxy Argument.** If you provide empirical or theoretical evidence that direct effects (e.g., QALYs saved) are highly correlated ($r > 0.8$) with positive indirect trajectory changes across a wide range of historical interventions. My reasoning is weakest at assuming the "swamp" is orthogonal to the "direct effect"; if doing good directly tends to *make* the long-term future better (rather than just changing it), the swamp doesn't need to be modeled to break the tie.

  **Weak Joint:**
  **Effect Divergence (0.6).** I am assuming deworming and pandemic prep push the political/economic equilibrium in *different* directions. If both primarily function by "increasing global state capacity" or "reducing existential anxiety," their indirect effects might be nearly identical, meaning the swamp cancels out in the *comparison* even if it dominates the *absolute* value.
