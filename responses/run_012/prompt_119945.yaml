      *   **Position 2 (Bookkeeping Reading):** Complexity is relative to representation, machine model, decision format. Finite instances are $O(1)$ (lookup tables). Hardness applies to infinite families, not actual situations. Encodings/machines change classifications. Hardness is about *accounting conventions*, not the world. Philosophy based on it inherits arbitrariness.
