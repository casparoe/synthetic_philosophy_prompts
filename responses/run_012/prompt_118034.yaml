  # Diagnostic Instrument: The Fanaticism Decision Tree

  **Instructions:** Proceed through the nodes sequentially. Answer **Yes** or **No** based on your intuitive judgment or committed theoretical stance regarding the specific case or claim presented. Follow the branch corresponding to your answer until you reach a leaf node.

  ### Branch Nodes

  **Node 1: Meaningfulness Claim**
  *Question:* Is a comparison between the utility of saving 10 people and saving $10^{100}$ people cognitively meaningful and mathematically valid?
  *   **No:** → Go to Leaf A.
  *   **Yes:** → Go to Node 2.

  **Node 2: Pascal's Mugging Case**
  *Case:* A stranger demands $5. They claim that if you pay, there is a $1$ in $10^9$ chance they will use magic to create $10^{10}$ units of utility (happy lives). If you refuse, nothing happens. Do you pay the $5?
  *   **No:** → Go to Node 7.
  *   **Yes:** → Go to Node 3.

  **Node 3: Astronomical Rescue Case**
  *Case:* Option A: Certainly cure a moderate disease in 10 people. Option B: A $1$ in $10^{100}$ chance to save all $10^{100}$ sentient beings from a lifetime of torture; otherwise, no one is saved. Do you choose Option B?
  *   **No:** → Go to Leaf B.
  *   **Yes:** → Go to Node 4.

  **Node 4: Infinite Metaphysics Claim**
  *Question:* Is it metaphysically possible for an outcome to contain *infinite* positive utility (not just arbitrarily large finite utility)?
  *   **No:** → Go to Leaf C.
  *   **Yes:** → Go to Node 5.

  **Node 5: Infinite Good Case**
  *Case:* Option A: Certainly create 100 units of utility. Option B: A $1$ in $10^9$ chance to create $\infty$ (infinite) units of utility; otherwise, 0 utility. Do you choose Option B?
  *   **No:** → Go to Leaf D.
  *   **Yes:** → Go to Node 6.

  **Node 6: Devil's Offer Case**
  *Case:* Option A: Certainly create 100 units of utility. Option B: A $1$ in $10^9$ chance to create $\infty$ utility, but also a $1$ in $10^9$ chance to create $-\infty$ (infinite suffering); otherwise, 0 utility. Do you choose Option B?
  *   **No:** → Go to Leaf E.
  *   **Yes:** → Go to Leaf F.

  **Node 7: Probability Zero Claim**
  *Question:* Is a probability of $1$ in $10^{100}$ cognitively and decision-theoretically equivalent to zero?
  *   **Yes:** → Go to Leaf G.
  *   **No:** → Go to Node 8.

  **Node 8: Lexical Certainty Claim**
  *Question:* Does the *certainty* of a finite good lexically outweigh the *expected magnitude* of an uncertain good, regardless of how large the expected value becomes?
  *   **Yes:** → Go to Leaf H.
  *   **No:** → Go to Leaf B.

  ---

  ### Leaf Nodes (Positions)

  **Leaf A: Quietist / Error-Theoretic Position**
  *   **Commitment:** Denies the decision problem is well-posed.
  *   **Awkward Commitment:** Must explain why existential risk planning is not nonsense despite relying on similar magnitude comparisons.

  **Leaf B: Unoccupied / Incoherent View**
  *   **Commitment:** Unnamed (Behaviorally inconsistent or theoretically unsupported).
  *   **Awkward Commitment:** Accepts small-probability fanaticism (Mugging) but rejects large-probability fanaticism (Astronomical), or rejects EV without a stated alternative rule.

  **Leaf C: Bounded-Value Fanaticism**
  *   **Commitment:** Accepts fanaticism for finite values but denies infinite values exist.
  *   **Awkward Commitment:** Must defend a specific metaphysical cap on value that decision theory cannot exceed, even in principle.

  **Leaf D: Two-Dimensional Fanaticism**
  *   **Commitment:** Accepts fanaticism for finite values but rejects maximizing infinite expectations.
  *   **Awkward Commitment:** Must explain why the decision rule changes discontinuously at infinity despite accepting arbitrarily large finite numbers.

  **Leaf E: Risk-Averse / Maximin Consequentialism**
  *   **Commitment:** Accepts positive fanaticism but rejects gambles with infinite downside risk.
  *   **Awkward Commitment:** Must justify why avoiding infinite suffering trumps maximizing infinite good, potentially paralyzing action in high-stakes existential scenarios.

  **Leaf F: Unrestricted Expected Value Fanaticism**
  *   **Commitment:** Maximizes expected value regardless of probability size or value magnitude.
  *   **Awkward Commitment:** Must accept that a tiny probability of infinite suffering can outweigh any certain finite good (The Devil's Offer).

  **Leaf G: Probability-Discounting / Non-Standard Decision Theory**
  *   **Commitment:** Rejects fanaticism because sufficiently small probabilities are discounted to zero.
  *   **Awkward Commitment:** Must define a non-arbitrary threshold where $1/n$ becomes 0 without violating continuity axioms.

  **Leaf H: Lexical Threshold / Satisficing View**
  *   **Commitment:** Rejects fanaticism because certainty or threshold goods trump expected value maximization.
  *   **Awkward Commitment:** Must accept passing up a chance to save the universe to guarantee a minor certain good.

  ---

  ### Instrument Notes & Analysis

  **Unoccupied Combinations:**
  *   **Leaf B (Inconsistent):** The combination of **Yes** to Node 2 (Mugging) and **No** to Node 3 (Astronomical) is marked as unoccupied. This view is generally considered **incoherent** because it accepts linear probability weighting at $10^{-9}$ but rejects it at $10^{-100}$ without a threshold mechanism (which would be caught at Node 7). It implies a violation of transitivity or scale-invariance that no named school defends.
  *   **Leaf B (No Reason):** The path **No** to Node 2, **No** to Node 7, and **No** to Node 8 leads here. This is **unexplored**; it rejects EV maximization but denies probability discounting or lexical certainty, leaving the decision rule unspecified.

  **Indistinguishable Leaves:**
  *   **Leaf C (Bounded-Value) and Leaf D (Two-Dimensional):** This instrument cannot separate these positions **extensionally** on finite cases. Both answer **No** to the Infinite Good Case (Node 5), though for different reasons (metaphysical impossibility vs. decisional rejection). They are separated here only by the self-reported metaphysical claim at Node 4. In practice, their policy recommendations for existential risk (which deal in finite but large numbers) are identical.

  **Coarse Separations:**
  *   **Leaf E (Risk-Averse) and Leaf H (Lexical Threshold):** Both may reject high-stakes gambles, but the tree separates them by *reason* (downside risk vs. certainty preference). However, if a student rejects the Devil's Offer (Node 6) solely because the certain good is lexically prior, they might be misclassified as Risk-Averse rather than Lexical. The instrument prioritizes the *case outcome* over the *justification* at Node 6 for simplicity.
