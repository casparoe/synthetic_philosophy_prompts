answer: |-
  **Exam Question**

  **Time Allowed:** 90 Minutes
  **Word Limit:** None (but quality of argument is paramount)

  **Question:**

  Consider a deep-shaft mine. By geological necessity, groundwater naturally floods the shaft within hours. To mine, humans dug the shaft and installed a pump to continuously remove water. Miners are currently working below.

  Agent X arrives and actively switches the pump off.
  Agent Y is responsible for refuelling the pump but negligently fails to do so, causing it to stop.
  In both cases, the water rises and the miners drown.

  Critically evaluate the moral significance of the distinction between doing and allowing harm in this context. Your answer should address: (1) what the distinction is purported to mark; (2) whether it can be drawn without relying on a normative baseline of "expected" events; (3) how the fact that the mine and pump are themselves interventions into a lethal natural course affects this baseline; and (4) whether the distinction generates moral verdicts independently, or merely codifies prior judgments about obligation.

  ***

  **Model Answer**

  The distinction between doing and allowing harm is traditionally understood as the difference between initiating a causal sequence that leads to death (commission) and failing to intervene in a sequence already leading to death (omission). In the mine scenario, Agent X appears to *do* harm by switching the pump off, while Agent Y appears to *allow* harm by failing to refuel. Intuitively, many hold that doing harm is morally worse than allowing it. However, this intuition relies on a stable description of the events, which the structural features of this case destabilize.

  To classify Y's inaction as "allowing," we must assume the pump stopping is the natural or expected course of events absent Y's input. Yet, the pump running is itself an artificial state. Without human intervention (digging the mine, installing the pump), the miners would not be there, and the water would not be a threat. The "baseline" against which we judge Y's failure is not nature, but a human-maintained status quo. If the baseline is defined by the immediate past (the pump was running), Y allows death. If the baseline is defined by the geological norm (mines flood), Y is merely ceasing to prevent a natural death. Thus, the doing/allowing distinction cannot be drawn physically; it depends entirely on a normative selection of which course of events counts as "normal."

  This reliance on a baseline becomes problematic when the baseline is the residue of prior interventions. The mine shaft creates the vulnerability. If we view the pump as part of a rescue mission from a natural state, stopping it is allowing death. If we view the mine as an intrusion into a safe natural state, maintaining the pump is sustaining a risky intervention, and stopping it is returning the site to safety. Consequently, the description of the act as "doing" or "allowing" shifts depending on how far back we trace the causal history. Since almost all modern baselines involve prior human maintenance (electricity, infrastructure, medicine), the distinction risks becoming arbitrary. We can describe any death as "allowing" by expanding the timeline to a point before the life-saving intervention began.

  This leads to the question of independent moral work. If the classification of an act as "doing" or "allowing" depends on selecting a baseline, and selecting that baseline depends on prior judgments about what agents are required to maintain, then the distinction does not generate moral verdicts; it reflects them. We likely judge X harshly because we assume a duty not to interfere with existing safety measures. We judge Y harshly if we assume a duty to maintain them. If we believed there was no duty to refuel, Y's action would be a permissible "allowing." Therefore, the moral weight lies in the duty, not the distinction.

  In conclusion, while the doing/allowing distinction tracks a difference in causal agency, it lacks independent normative force in cases involving sustained interventions. Because the "natural" baseline is obscured by prior human activity, the distinction collapses into a question of obligation. It serves as a label for verdicts reached on other grounds rather than a tool for reaching them.

  ***

  **Marking Scheme**

  **Total Marks:** 20

  **Must-Hit Points:**

  1.  **Characterization of the Distinction (4 marks)**
      *   *Requirement:* Clearly defines the distinction (e.g., initiating vs. failing to intervene in a causal sequence).
      *   *Characteristic Error:* Treating it as a purely physical difference without acknowledging the descriptive ambiguity.
  2.  **Baseline Dependency (4 marks)**
      *   *Requirement:* Explains that classifying an act as "allowing" requires a normative baseline of what counts as the "normal" course of events.
      *   *Characteristic Error:* Assuming the baseline is objectively given by nature or physics.
  3.  **The Artificial Baseline Problem (4 marks)**
      *   *Requirement:* Identifies that the mine/pump setup is itself an intervention, making the "status quo" artificial and the baseline contestable.
      *   *Characteristic Error:* Ignoring the fact that the miners' presence and the flood risk are created by human activity.
  4.  **Independent Moral Work (4 marks)**
      *   *Requirement:* Takes a clear stand on whether the distinction drives moral verdicts or merely reflects prior judgments about duty/obligation.
      *   *Characteristic Error:* Asserting the distinction is morally significant without explaining how it functions given the baseline problem.
  5.  **Synthesis and Coherence (4 marks)**
      *   *Requirement:* Integrates the four above points into a unified argument rather than treating them as a checklist.
      *   *Characteristic Error:* Disconnected paragraphs that address the prompt's sub-questions in isolation without logical flow.

  **Grading Boundary:**

  *   **A Grade (16–20):** Demonstrates critical synthesis; explicitly argues that the baseline is normative rather than natural and convincingly concludes that the distinction lacks independent force (or defends it against this collapse with novel reasoning). The argument flows logically from the structural problem to the moral conclusion.
  *   **B Grade (12–15):** Correctly identifies the baseline problem and the artificial nature of the mine scenario but hesitates on the conclusion regarding independent moral work, or treats the sub-questions as separate tasks rather than steps in a single argument.
