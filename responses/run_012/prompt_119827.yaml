prompt: |-
  Hi, I could really use some help writing something up and I'm not sure how to frame it.

  I'm on the board of a small arts nonprofit — we're all volunteers, nobody's an expert, we just care about the place. Last month we had to choose between three finalists for the director job, and honestly the way it went down was embarrasing. One of us spoke first, said she had a good feeling about finalist #2, and inside of ten minutes all seven of us had "agreed" on #2. Two people told me in the parking lot afterward that they'd actually leaned toward #1, but they figured the rest of us must know something they didn't. And here's the part that really bothers me: if she'd said #1 first, I'm pretty sure we'd have "agreed" on #1 instead. Noone was lying, nobody got bullied, everyone just... deferred. (The annoying part is that #2 turned out fine, so I can't even point to a disaster — I just don't trust how we got there.)

  I want to bring a proposal to the next meeting, but my two ideas kind of fight each other and I can't tell which to push. Idea one: the night before, we each email the secretary our pick plus one sentence of why; at the start of the meeting she reads them all out without saying who wrote what; then we discuss; then we vote on paper. Idea two: the secretary assigns each of us a different finalist to argue *for* out loud, no matter who we actually prefer, so that every candidate has to get a real case made for them.

  My worry with idea one is that it might not fix anything, since we all read the same three resumes and the same reference calls — so even if I'm "deciding on my own," I'm deciding on the same thin information as everyone else, and we could all just be confidently wrong together. My worry with idea two is that it feels like manufacturing disagreement, like I'm asking my friends to argue for someone they don't believe in, and maybe that just adds noise and burns an evening for nothing.

  Could you write the memo I'd send the board before the meeting? I want it to recommend one concrete thing we should actually do for the next hire — specific steps, who does what, when — and to be honest about the case against me, because if there's a real reason we should just let people defer to whoever seems most informed, I'd rather find out now than after the next hire. End it with something we can actually vote on, and keep it short enough that people will really read it. Also please don't make it sound like I'm calling anyone a sheep; half these people are my friends. Thanks!!
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Sender:** Board member of a small arts nonprofit (all volunteers, friends, non-experts).
      *   **Recipient:** The rest of the board.
      *   **Context:** Recent hiring process for a Director resulted in "groupthink." One person spoke first, everyone else deferred. Two members admitted later they preferred another candidate but stayed silent. The hired candidate (#2) is doing fine, but the *process* feels unreliable.
      *   **Goal:** Propose a new decision-making protocol for the *next* hire to prevent premature consensus/groupthink.
      *   **Options Considered by User:**
          1.  *Blind Submission:* Email picks/reasons to secretary, read aloud anonymously, discuss, then paper vote.
          2.  *Devil's Advocate:* Assign each member a candidate to argue *for*, regardless of personal preference.
      *   **User's Concerns:**
          *   Idea 1 might not fix the "thin information" problem (everyone confident but wrong together).
          *   Idea 2 feels artificial/manufactured and might waste time or feel disingenuous among friends.
          *   Needs to avoid sounding accusatory ("calling anyone a sheep").
          *   Needs to be honest about the counter-argument (maybe deference *is* okay?).
          *   Needs a concrete recommendation (pick one path).
          *   Needs a specific motion to vote on.
          *   Needs to be short/readable.

  2.  **Determine the Best Recommendation:**
      *   *Idea 1 (Blind Submission)* is generally better for reducing anchoring bias (the first opinion stated). It allows independent thought before social pressure kicks in. It addresses the specific problem described (one person speaking first swayed the room).
      *   *Idea 2 (Assigned Advocacy)* is cognitively demanding and can feel fake. In a small, volunteer board of friends, asking someone to argue passionately for a candidate they don't like might create friction or feel like a game.
      *   *Hybrid/Refinement:* Idea 1 is the stronger foundation. To address the "thin information" worry, the process should ensure everyone has the *same* information before deciding, but the *blind* aspect prevents the social cascade.
      *   *Decision:* I will recommend a refined version of Idea 1 (Anonymous Pre-Read + Structured Discussion). It's less artificial than Idea 2 and directly targets the "first speaker" bias.

  3.  **Drafting - Tone and Style:**
      *   **Tone:** Collaborative, humble, reflective, not accusatory. Use "we" language. Acknowledge the good outcome (#2 is fine) to lower defenses.
      *   **Structure:**
          1.  Subject Line (Clear & Non-threatening).
          2.  Opening (Positive reflection on the recent hire).
          3.  The "Why" (Honest reflection on the process, not the people).
          4.  The Proposal (Concrete steps).
          5.  The Counter-Argument (Addressing the "maybe deference is okay" point).
          6.  The Motion (Clear vote).
      *   **Length:** Short. Bullet points for steps.

  4.  **Drafting - Section by Section:**

      *   *Subject:* Needs to be about "Process Improvement," not "Fixing Our Mistakes."
      *   *Opening:* Acknowledge #2 is doing well. Relieve anxiety.
      *   *The Issue:* Frame it as "decision hygiene" or "process robustness." Mention the "first voice" phenomenon without naming names. Acknowledge the parking lot conversations gently.
      *   *The Proposal:* Go with the Anonymous Pre-Read (Idea 1). It's standard best practice for boards.
      *   *Addressing the Counter-Argument:* The user wants honesty. If we defer to the "most informed," that works if someone *is* more informed. But here, everyone had the same info. So deference was based on confidence, not expertise. I need to articulate this distinction.
      *   *The Motion:* Make it actionable for the next search committee.

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is Idea 1 too bureaucratic for a small volunteer board?
      *   *Fix:* Keep it lightweight. "Email the Secretary" is easy. "Read aloud" is easy. "Paper vote" is easy.
      *   *Critique:* Did I address the "thin information" worry?
      *   *Fix:* I should note that this doesn't fix *bad data*, but it fixes *social pressure*. That's the specific problem identified.
      *   *Critique:* Is it too personal?
      *   *Fix:* Ensure I admit my own susceptibility to the same bias. "I know I would have done the same."

  6.  **Final Polish:**
      *   Check word count.
      *   Ensure the "Motion" is clear.
      *   Make sure the "Counter-Argument" section feels genuine, not like a straw man.

  7.  **Final Review against constraints:**
      *   Recommend one concrete thing? Yes (Modified Idea 1).
      *   Honest about the case against? Yes.
      *   End with a vote? Yes.
      *   Short? Yes.
      *   No name-calling? Yes.

  *(Self-Correction on the Counter-Argument)*: The user specifically asked to be honest about the case against them: "if there's a real reason we should just let people defer to whoever seems most informed, I'd rather find out now." I need to make sure I articulate *why* someone might argue for the status quo (efficiency, trust) and why I think it doesn't apply here (equal information).

  *(Decision on Idea 1 vs 2)*: Idea 1 is much more standard for governance. Idea 2 is a debate tactic, not a hiring tactic. I will strongly steer toward Idea 1 but acknowledge the limitation (it doesn't create new info, just protects independent thought).

