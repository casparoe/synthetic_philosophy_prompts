prompt: |-
  I've been trying to work out what the no-trade theorem actually licenses me to say, and I keep landing on a conclusion I don't quite believe. As I understand it — Milgrom and Stokey — if traders share a prior, are commonly known to be rational, and the structure by which information is acquired is itself common knowledge, then no one can profit from private information, so no mutually agreeable trade will occur. If that is a claim about markets and not merely about models, it seems to say that every trade that does happen is either noise or exploitation: buyer and seller cannot both be expecting to gain, so one of them is a mark. Three things make me doubt my own reading. My firm's two analysts read the same earnings memo and take opposite positions, which on my reading means that at most one of them is rational. I buy insurance at a premium above my expected loss, and the insurer knowingly sells it. And I buy index funds from a dealer who is certainly better informed than I am about order flow. My suspicion is that the common prior assumption is just the technical statement that everyone is a Bayesian, and so does almost no work, and that the theorem is essentially the formal version of the efficient market hypothesis. So: is that right? What does the theorem actually rule out, and what may I infer from the mere fact that a trade occurred — in particular from the fact that someone was willing to take the other side of mine? Answer as exactly five numbered points, each a sentence or two, with no introduction and no closing summary.
