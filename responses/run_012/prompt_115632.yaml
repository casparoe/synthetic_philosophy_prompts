  # Activity Plan: The Card Ceiling

  **Session Length:** 90 Minutes
  **Class Size:** ~20 Students (10 Teams)
  **Level:** Second-Year Undergraduate Foundations of Quantum Mechanics
  **Goal:** Derive the CHSH classical bound (S ≤ 2) via enumeration of local hidden variable strategies, then contrast with a simulated quantum source (S = 2√2) to isolate the specific assumptions violated.

  ---

  ## 1. Materials & Preparation

  **Per Team (10 Teams):**
  *   10 Pairs of Envelopes (labeled "Round 1" to "Round 10", marked "Alice" and "Bob").
  *   20 Instruction Cards (small slips of paper).
  *   1 Score Sheet (grid for recording Settings and Outcomes).
  *   Pens.

  **Instructor:**
  *   Whiteboard/Projector for global scorekeeping.
  *   **The Quantum Box:** A laptop script or a prepared table of random digits.
      *   *Algorithm:* For each round, given settings $\theta_A, \theta_B$:
          1.  Generate Outcome $A \in \{+1, -1\}$ with $P=0.5$.
          2.  Calculate agreement probability $p = \sin^2((\theta_A - \theta_B)/2)$.
          3.  Generate Outcome $B$: Set $B=A$ with probability $p$, else $B=-A$.
      *   *Settings:* Alice $\{0^\circ, 90^\circ\}$, Bob $\{45^\circ, 135^\circ\}$.
      *   *Output:* Display the sequence of pairs $(A, B)$ for the class to verify marginals.
  *   **Referees:** 2 TAs or trusted students to patrol during data taking.

  ---

  ## 2. The Sign Convention (Instructor Key)

  To ensure the classical bound is $+2$ and the quantum value is $+2\sqrt{2}$ with the specified angles and singlet correlations ($E = -\cos\Delta$), use this specific CHSH sum definition:

  $$ S = -E(0^\circ, 45^\circ) + E(0^\circ, 135^\circ) - E(90^\circ, 45^\circ) - E(90^\circ, 135^\circ) $$

  *   **Classical Cards:** Max possible $S = 2$.
  *   **Quantum Box:** Expected $S = 2\sqrt{2} \approx 2.83$.
  *   **Marginals Check:** Students must verify $P(A=+1) \approx 0.5$ for all settings.

  ---

  ## 3. Round Structure & Time Budget

  | Phase | Time | Activity |
  | :--- | :--- | :--- |
  | **1. Setup** | 00–05 | Distribute materials. Explain the "No Communication" rule. |
  | **2. Build** | 05–25 | Teams create "Local Hidden Variable" cards. Seal envelopes. |
  | **3. Run** | 25–50 | Instructor calls settings. Teams record outcomes. (5 Rounds) |
  | **4. Enumerate** | 50–65 | Class lists all 16 possible cards. Calculate max $S$. |
  | **5. Quantum** | 65–80 | Run the "Quantum Box". Compare $S$ and check marginals. |
  | **6. Debrief** | 80–90 | Map activity to theorem assumptions and limitations. |

  ---

  ## 4. Activity Rules & Scoring

  ### Phase 2: Building the Device (20 mins)
  1.  **The Constraint:** You are building a pair of detectors. You must decide in advance what outcome (+1 or −1) each detector will produce for each possible setting.
  2.  **The Card:** On a slip of paper, write Alice's outcomes for $0^\circ$ and $90^\circ$. On a separate slip, write Bob's outcomes for $45^\circ$ and $135^\circ$.
      *   *Forbidden:* Alice's card cannot contain Bob's settings. Bob's card cannot contain Alice's settings.
  3.  **Sealing:** Place Alice's card in an "Alice" envelope, Bob's in a "Bob" envelope. Seal them inside the "Round 1" pair. Repeat for 5 rounds.
      *   *Strategy:* You may use the same card every time, or randomize which card pair goes into which envelope. **You must seal them before I announce the settings.**
  4.  **Enforcement:** Referees patrol. If Alice and Bob discuss settings or outcomes during construction, the team is disqualified from the "Classical Prize."

  ### Phase 3: Running the Experiment (25 mins)
  1.  **Settings:** For each round, the Instructor randomly announces one setting for Alice ($0^\circ$ or $90^\circ$) and one for Bob ($45^\circ$ or $135^\circ$).
  2.  **Measurement:** Teams open the corresponding round's envelopes. Alice looks up her setting on her card and writes the outcome. Bob does the same.
  3.  **No Communication:** Once envelopes are opened, no talking. Referees watch.
  4.  **Reporting:** Teams shout their outcomes $(A, B)$ for the round. Instructor records on global board.
  5.  **Scoring:** After 5 rounds, calculate the four correlations $E(\alpha, \beta) = \frac{N_{same} - N_{diff}}{N_{total}}$ and compute $S$.

  ### Phase 4: The Enumeration (15 mins)
  *   **Task:** Do not look at your data yet. On the board, we will list every possible instruction card combination.
  *   **Logic:** A full state is defined by $(A_0, A_1, B_0, B_1)$. Each is $\pm 1$. There are $2^4 = 16$ combinations.
  *   **Calculation:** For each of the 16 rows, compute $S_{card} = -A_0 B_0 + A_0 B_1 - A_1 B_0 - A_1 B_1$.
  *   **Discovery:** Students will find every row yields either $+2$ or $-2$.
  *   **Conclusion:** Any average of these cards (any probabilistic mixture) must yield $|S| \le 2$.

  ### Phase 5: The Quantum Box (15 mins)
  1.  **Run:** Instructor runs the script/tables for 50–100 pairs using the same random settings.
  2.  **Verify:** Students check the marginals (count Alice's +1s). It should be ~50%.
  3.  **Compute:** Calculate $S$ from the Box data. It will approach $2.83$.
  4.  **Shock:** The Box beats the Ceiling derived in Phase 4.

  ---

  ## 5. Debrief Script (10 mins)

  **1. Mapping the Assumptions (The "Locality" Split)**
  *   **Parameter Independence (PI):** "The setting on one wing does not affect the outcome on the other."
      *   *Activity:* Enforced by the rule: "Alice's card cannot list Bob's settings."
      *   *Box:* Verified by the marginals. Alice's outcomes were 50/50 regardless of Bob's setting. No signal was sent.
  *   **Outcome Independence (OI):** "The outcome on one wing does not affect the outcome on the other."
      *   *Activity:* Assumed by the card structure. Alice's outcome was fixed by her card alone, not by Bob's flip.
      *   *Box:* **Violated.** The Box satisfies PI (no signaling) but beats the bound. Therefore, the outcomes cannot be pre-determined independently. The correlation is stronger than the cards allow.
  *   **Pressure Point:** The activity puts **Outcome Independence (and Realism)** under pressure. It **quietly assumes Parameter Independence** in the card rules, which the Box also respects.

  **2. Honest Limitations (What This Did Not Prove)**
  *   **Stipulated Physics:** We did not measure nature. I gave you the Box. The value $2\sqrt{2}$ was handed to you, not derived from a physical apparatus. Real experiments must work harder to rule out apparatus bias.
  *   **Loopholes:** We ignored detection efficiency (we recorded every round) and locality (you sat in the same room). A real test separates the wings by light-years.
  *   **The Superdeterminism Escape:** A skeptic can say, "The Instructor chose settings based on how you filled the cards." This activity assumes **Measurement Independence** (free choice of settings). We have no answer to a skeptic who denies this.
  *   **Interpretation:** The Box supplies statistics, not ontology. Nonlocality? No definite outcomes? Retrocausality? This activity rules out *Local Realism*, but leaves the "Why" wide open.

  **3. Addressing Predictable Failures**
  *   **"We talked during the round."**
      *   *Debrief:* "You simulated signaling. You violated Parameter Independence. The Quantum Box does not signal (check marginals). Can you beat the bound *without* talking? No. That's the theorem."
  *   **"We spent 20 mins trying to find a better card."**
      *   *Debrief:* "Did you find one? No. The enumeration showed the ceiling is mathematical, not engineering. You were trying to solve $x + y = 3$ where $x,y \in \{0,1\}$."
  *   **"The Box is cheating."**
      *   *Debrief:* "The Box uses public random digits and a published formula ($-\cos\theta$). You can audit the code. The 'cheat' is that nature allows correlations that cards do not."

  ---

  ## 6. Contingency Plans

  **If a Team Finishes Early (Phase 4):**
  *   **Task:** "Calculate the $S$-value for all 16 possible cards. Prove that none exceed 2. Then prove that if you mix cards (e.g., 50% Card A, 50% Card B), the average $S$ still cannot exceed 2." (This pre-empts the mixture argument).

  **If Data is Noisy (Phase 3):**
  *   **Requirement:** 5 Rounds per team × 10 Teams = 50 data points per setting combination.
  *   **Stability:** With $N=50$, standard error on correlation is $\approx 0.14$. Error on $S \approx 0.28$.
  *   **Threshold:** Classical max is 2.00. Quantum is 2.83. The gap (0.83) is ~3 standard errors. It will be visible on the board. If time permits, run 10 rounds to tighten the error bars.

  **Enforcement Mechanisms:**
  *   **Sealed Envelopes:** Cards must be sealed *before* settings are called. If a team is caught writing after the setting is announced, their data is void.
  *   **Referees:** Must stand between Alice and Bob sides of the table during the "Run" phase.
  *   **Hard Time-Boxing:** Use a visible timer. When "Build" time ends, pens down. This prevents over-optimization.

  ---

  ## 7. Instructor Notes for the Quantum Box

  To ensure the Box behaves exactly as described:
  1.  **Marginals:** Do not generate pairs based on a joint distribution table directly. Generate $A$ first (coin flip), then $B$ conditional on $A$. This guarantees $P(A)=0.5$ by construction.
  2.  **Correlation:** Use $P(B=A) = \sin^2(\Delta/2)$.
      *   For $\Delta=45^\circ$, $p \approx 0.146$. (Mostly opposite).
      *   For $\Delta=135^\circ$, $p \approx 0.854$. (Mostly same).
      *   This yields $E = -\cos(\Delta)$.
  3.  **Transparency:** Project the random seed or use a physical random digit table (e.g., RAND Corporation million digits) projected on screen to drive the choices. This counters the "Instructor cheating" accusation.

  ---

  ## 8. Summary of the "Shock"

  The students will feel the ceiling from the inside during Phase 4. They will see that *every* possible local instruction set yields $S=\pm 2$. They will see that mixing them cannot help (linearity). Then, in Phase 5, they will see a source that respects the "no signaling" rule (flat marginals) but breaks the ceiling. The debrief forces them to admit that **pre-determined outcomes** (the cards) are the casualty, not **no-signaling** (the rule they followed).
