answer: |-
  1. An experience of being dead is no more evidence of survival than a dream of Paris is evidence about Paris. I observed phenomena, certainly, but observations require an observer, and the verification principle remains stubbornly intact.

  2. We possess no workable criterion for identifying the entity supposed to survive, which renders the inquiry linguistically sloppy. If the body remains here while something else proceeds there, we lack the vocabulary to distinguish the traveler from the luggage.

  3. Memory cannot carry the load of identity since memories can be copied, leaving you with two claimants and no way to choose the original. I am merely the local instance of a data set that may have been duplicated elsewhere without my consent.

  4. Some of what I underwent was strictly indescribable, and I log this ineffability as a defect rather than a sign of profundity. If a proposition cannot be stated clearly, it is nonsense, not a mystical truth.

  5. I confess the episode has slightly weakened my belief that death is the end, though admitting this is itself embarrassing. It represents a change in mood rather than evidence, and I apologize for the lapse in rigour.
