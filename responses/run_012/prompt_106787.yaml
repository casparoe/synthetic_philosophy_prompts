answer: |-
  There is no single, canonical noun in the social epistemology literature that isolates this specific failure mode with the lexical weight of "Groupthink." In formal treatments (e.g., Dietrich & Spiekermann, 2013; List & Goodin, 2001), this is standardly described as a **violation of the conditional independence assumption** due to a **common cause**. While precise, this is a technical description of the mathematical failure, not a phenomenological label for the social-epistemic dynamic you are describing.

  In engineering and risk analysis, the closest analog is **"Common Mode Failure"** (where multiple components fail due to a shared external stressor rather than internal wear). However, this lacks the epistemic nuance of *competent reasoning from flawed baselines*.

  Because the literature treats this primarily as a probabilistic violation rather than a distinct social phenomenon, I propose we carve it out with the term:

  ### **Upstream Evidential Coupling**

  Here is the conceptual map you requested, distinguishing the three descriptive frameworks, contrasting it with neighboring phenomena, and defining the boundary conditions.

  ---

  ### 1. The Three Descriptions (The Carving)

  You asked whether this is best described probabilistically, causally, or epistemically, and whether these descriptions can come apart. They are distinct layers, and their separation is where the philosophical work lies.

  *   **Probabilistic (Correlated Errors):**
      *   *Description:* The votes $V_1, \dots, V_n$ are not independent conditional on the state of the world $S$. That is, $P(V_1 \cap V_2 | S) \neq P(V_1 | S) \cdot P(V_2 | S)$.
      *   *Limit:* This describes the *symptom*, not the *mechanism*. It tells you the theorem fails, but not why.
  *   **Causal (Common Cause):**
      *   *Description:* There exists a variable $C$ (the memo, the instrument, the dataset) such that $C \rightarrow V_i$ and $C \rightarrow V_j$, where $C$ is not screened off by $S$.
      *   *Limit:* Causal common causes can be irrelevant. A shared coffee machine is a common cause of voting, but perhaps not of *accuracy*. The cause must be *efficacious* regarding the truth-tracking.
  *   **Epistemic (Shared Evidence):**
      *   *Description:* The voters share an evidential set $E$ that is incomplete or misleading, and their votes are functions of $E$ rather than independent samples of $S$.
      *   *Limit:* One can share evidence but interpret it differently (uncorrelated errors).

  **Can they come apart?**
  Yes. This tripartite distinction is crucial for your seminar.
  1.  **Shared Evidence without Correlated Errors:** If the shared dataset is *conclusive* (truth-tracking is perfect), the votes will be identical, but the error correlation is zero because there is no error. Coupling only becomes a failure mode when the shared evidence is *fallible*.
  2.  **Correlated Errors without Common Cause:** If voter $A$ influences voter $B$ directly (social pressure), errors correlate, but there is no *upstream* common cause; there is a *lateral* causal link.
  3.  **Common Cause without Epistemic Relevance:** If the group shares a training manual that covers only irrelevant administrative protocols, they have a common cause and shared evidence, but it does not couple their *truth-tracking* votes.

  **Upstream Evidential Coupling** specifically requires the intersection of all three: A causal common source ($C$) that provides the evidential basis ($E$) for competent reasoning, resulting in correlated fallibility ($P(\text{Error}_i \cap \text{Error}_j) > P(\text{Error}_i)P(\text{Error}_j)$).

  ---

  ### 2. Distinctions from Neighboring Phenomena

  To ensure the term does not collapse into existing diagnoses, here is how **Upstream Evidential Coupling** differs from the four concepts you listed:

  | Phenomenon | Locus of Dependence | Direction of Influence | Epistemic Status of Members |
  | :--- | :--- | :--- | :--- |
  | **Upstream Evidential Coupling** | **External Input** (Data, Instrument, Memo) | **One-to-Many** (Source $\rightarrow$ All Members) | **Competent & Honest.** Reasoning is sound; baseline is flawed. |
  | **Groupthink** | **Social Dynamics** (Norms, Cohesion) | **Many-to-Many** (Mutual monitoring/pressure) | **Compromised.** Members suppress dissent to maintain harmony. |
  | **Information Cascades** | **Observational Inference** (Others' Votes) | **Sequential** (Member $n$ observes $1 \dots n-1$) | **Rational.** Members ignore private signals because public signals are statistically stronger. |
  | **Echo Chambers** | **Selection/Exclusion** (Network Structure) | **Structural** (Outside sources are discredited/blocked) | **Polarized.** Members actively distrust external correction. |
  | **Shared Bias** | **Internal Heuristics** (Psychology/Culture) | **Internal** (Same processing flaw in each head) | **Variable.** Often implies a systematic cognitive distortion rather than a shared data source. |

  **Key Differentiator:** In Groupthink and Cascades, the dependence is *downstream* or *lateral* (voters affect voters). In Upstream Evidential Coupling, the dependence is *antecedent* (the environment affects voters). The voters never interact; they could be in separate rooms. Their consensus is a "phantom agreement" generated by the input, not by convergence on the truth.

  ---

  ### 3. Definition and Conditions

  **Term:** **Upstream Evidential Coupling**

  **Definition:** A structural failure mode in collective judgment where a group's reliability fails to scale with size because individual votes are conditionally dependent on a shared, fallible evidential source, despite individual competence and the absence of social influence.

  **Conditions of Obtention:**
  1.  **Competence:** Individual members have $P(\text{Vote} = \text{Truth} | \text{Evidence}) > 0.5$.
  2.  **Common Source:** All members derive their primary evidence from a single source $C$ (or a tightly coupled set of sources).
  3.  **Fallibility:** The source $C$ is not perfectly truth-tracking (it contains noise, bias, or error).
  4.  **Isolation:** Members do not update on each other's votes (no cascades) nor feel pressure to conform (no groupthink).
  5.  **Opacity:** The shared nature of the limitation is not common knowledge (if they knew the instrument was miscalibrated, they would adjust).

  **Result:** As $N \rightarrow \infty$, the probability of a correct majority verdict converges not to 1, but to the reliability of the common source $C$. The group becomes *precisely wrong* with high confidence.

  ---

  ### 4. A Boundary Case

  To test the utility of the term, consider this boundary case where it is unclear whether **Upstream Evidential Coupling** applies:

  **The Case of the Shared Training:**
  A hiring committee consists of five professors. All five were trained in the same doctoral program twenty years ago, under the same advisor, who taught a specific heuristic for evaluating candidate potential (e.g., "prioritize single-author papers over collaborations"). They vote independently, without discussing the candidates. They all reject a brilliant collaborative candidate.

  *   **Argument for Coupling:** The training acts as the "instrument." It is a common upstream cause ($C$) that filters their evidence. They are reasoning competently from the heuristic they were given.
  *   **Argument against Coupling (for Shared Bias):** The "instrument" is internalized. It is now part of their cognitive architecture, not an external briefing memo. The dependence is stored *in* the voters, not in the room. If one professor had forgotten the heuristic, the coupling would break. In the reagent case, if one scientist swaps the reagent, the coupling breaks.

  **Resolution:**
  This boundary highlights the **Epistemic vs. Causal** carving.
  *   If the training is treated as a **fixed prior**, it is *Shared Bias*.
  *   If the training is treated as a **lens through which evidence is interpreted**, it is *Upstream Evidential Coupling*.

  I suggest marking the boundary at **replaceability**. If the shared input can be swapped out *without changing the members* (e.g., issuing a new briefing memo, recalibrating the instrument, providing a new dataset), it is **Upstream Evidential Coupling**. If correcting the error requires *retraining the members* (changing their internal priors/heuristics), it borders on **Shared Bias**.

  In your seminar, this distinction is vital: **Coupling** is an institutional fix (change the memo); **Bias** is a psychological fix (change the people). The tragedy you describe is that institutions often treat Coupling as if it were Independence, assuming that aggregating more people solves the problem, when in fact they are simply aggregating the same error multiple times.
