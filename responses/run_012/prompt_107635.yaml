answer: |-
  Here is the translation of the four positions into the vocabulary of statistical mechanics and condensed matter, followed by the residue report and the committed verdicts you requested.

  ### Part I: The Four Positions Translated

  **1. The Conceptual Dissolution (Illusionism/Eliminativism)**
  The "Hard Problem" is a category error arising from a failure to define the domain of validity for your variables. You are treating a macroscopic order parameter as if it must have a microscopic conjugate variable. In this view, "experience" is a gauge artifact. It looks like a degree of freedom, but it is actually redundancy in the description. When you ask "why is there experience?", you are asking "why does the coarse-grained description exist?" The answer is trivial: because you chose to coarse-grain. There is no extra physical quantity here. The feeling of a "residue" is a bug in the bookkeeping, akin to asking why the center of mass of a gas cloud has a temperature. It doesn't; only the ensemble does. The problem dissolves when you realize the observable you are probing is not gauge-invariant.

  **2. The Identity Theory (Non-Reductive Physicalism/Functionalism)**
  Experience is an order parameter emerging in the thermodynamic limit. It is fully determined by the microstate Hamiltonian of the neural substrate, but it is not useful to calculate it from the bottom up. Just as "viscosity" is real but undefined for a single water molecule, "qualia" are real macroscopic states of the neural field. There is no extra term in the Lagrangian. The "explanatory gap" is simply the computational intractability of deriving the effective field theory (EFT) of consciousness from the Standard Model of particle physics. The macro-state *is* the micro-state, viewed through the lens of the system's own internal integration. The "felt side" is just the system's internal readout of its own order parameter. No new physics, just high-order correlation functions.

  **3. The Fundamentalist (Panpsychism/Property Dualism)**
  The current Hamiltonian is incomplete. You cannot derive the order parameter from the known micro-rules, no matter how many particles you add or how clever your coarse-graining is. This position argues that "experience" is a superselection sector that does not emerge from non-experiential matter. To make the theory work, you must add a new fundamental field or coupling constant to the universe's Lagrangian, akin to adding charge or mass. This is a boundary condition or a law, not an emergent property. It posits that information (in the physical sense) has an intrinsic "aspect" that is not captured by Shannon entropy or correlation. You have to put it in by hand.

  **4. The Error Theory (Evolutionary/Pragmatic)**
  Stop trying to solve for the order parameter and start solving for the measurement apparatus. The "Hard Problem" is a stable error signal generated by the system's self-model. The brain constructs a macroscopic variable labeled "self" and another labeled "world," and the interface between them generates a robust illusion of discontinuity. This is a problem of decoherence and information flow. The system is wired to report "I am experiencing" because that report is evolutionarily stable, not because the report corresponds to a fundamental ontological distinctness. The mystery is not in the dynamics, but in the specific boundary condition (the Past Hypothesis) that allowed for the evolution of a system complex enough to generate this specific false positive in its self-diagnostic routine.

  ***

  ### Part II: The Residue Report

  **What Maps Cleanly:**
  *   **Emergence vs. Fundamentalism:** The split between Positions 2 and 3 maps perfectly onto the distinction between an emergent order parameter (like magnetization in Ising) and a fundamental coupling constant (like the fine-structure constant).
  *   **The Explanatory Gap:** This maps cleanly onto Loschmidt's paradox in statistical mechanics. How do time-symmetric micro-rules yield time-asymmetric macro-behavior? The "gap" between neurons and feeling is structurally identical to the gap between reversible collisions and irreversible entropy increase.
  *   **Gauge Freedom:** Position 1 maps well to the idea that some variables are descriptive redundancy. If "qualia" are gauge, they have no physical effect, which matches the philosophical notion of "epiphenomenalism" often attached to this view.

  **What Maps Only With Distortion:**
  *   **The "What It Is Like" (Subjectivity):** In physics, an observable is defined by its measurement statistics across an ensemble. In consciousness, the "observable" is single-shot and indexical. To map this, you have to treat the system as its own ensemble, which strains the definition of a statistical ensemble. You have to distort "information" to mean "information accessible to the subsystem," which introduces a topological constraint not usually present in standard thermodynamics.
  *   **Normativity:** Philosophy often smuggles in "value" or "meaning." Physics has no operator for "meaning." Mapping this requires treating "meaning" as a stability condition in a control loop, which works technically but loses the phenomenological weight philosophers insist upon.

  **The Blind Spots vs. Insubstantial Claims:**
  *   **Physics Blind Spot:** Standard statistical mechanics assumes an external observer to define the macrostates. It has no formalism for a system that *is* its own observer without an external reference frame. This is a genuine gap in the vocabulary; we don't have a good "internal thermodynamics."
  *   **Insubstantial Claims:** Much of the philosophical insistence on the "Hard Problem" relies on the intuition that "conceivability implies possibility" (e.g., I can conceive of a zombie, therefore they are possible). In physics, this is nonsense. You cannot conceive of a violation of conservation laws just because you can imagine it. The claim that a functional duplicate could lack experience is physically insubstantial; it's like claiming a gear arrangement could transmit torque without "really" turning.

  ***

  ### Part III: The Commitments

  You asked for a verdict, not a menu. Here is the ledger.

  **1. Is this irreversibility or a further fact?**
  **Verdict:** It is irreversibility.
  **Defense:** The Hard Problem is the Reversibility Paradox wearing a different hat. Before Boltzmann, it seemed like a miracle that micro-reversible laws yielded macro-irreversible flow. You needed a "further fact" (a vital force for time?) to explain the arrow. Boltzmann showed it was a consequence of coarse-graining and boundary conditions (the Past Hypothesis). Consciousness is the same. It is what information processing *looks like* from the inside of the coarse-grained macrostate. To posit a "further fact" (Position 3) is to violate the parsimony of the Hamiltonian. We do not add new fundamental forces to explain turbulence; we do not need one to explain qualia. The "felt side" is the thermodynamic cost of maintaining the macrostate against decoherence.

  **2. Is the target vocabulary deficient or the claim insubstantial?**
  **Verdict:** The philosophical claim is less substantive than it sounds.
  **Defense:** Philosophers treat the "first-person perspective" as a datum that resists third-party description. In your vocabulary, this is simply the distinction between the microstate (the full phase space) and the macrostate (the reduced description). The "residue" they feel is the loss of information inherent in coarse-graining. They mistake the *loss* of information (the blurring of the micro-details) for the *presence* of a new substance. The vocabulary of statistical mechanics is sufficient; the philosophers are failing to recognize that "subjectivity" is just the system's access to its own coarse-grained variables. The "mystery" is an artifact of refusing to accept that the macro-description is all there is.

  **3. Is the consciousness case different in kind, or the same move?**
  **Verdict:** It is the same move.
  **Defense:** In soft matter, we accept that new physics (elasticity, viscosity, phase transitions) appears when you have enough particles to make the bookkeeping hopeless, but we know this isn't *fundamental* new physics. It is effective physics. The Hard Problem is the insistence that consciousness is *fundamental* new physics rather than *effective* new physics. It is the same move. The intuition that it is "different in kind" is a cognitive bias equivalent to pre-Newtonian intuition that celestial mechanics must be different from terrestrial mechanics. It feels different because the correlation length of the neural field is locked to the system's self-model, creating a feedback loop that doesn't exist in a block of iron. But structurally, it is just a phase transition in a complex adaptive system.

  **Final Ledger:**
  The Hard Problem is not a problem of physics; it is a problem of failing to apply statistical mechanics to the brain's self-model. The "residue" is the shadow cast by the coarse-graining. You do not need a new law. You need to accept that in the thermodynamic limit of a sufficiently integrated information processor, the distinction between the map and the territory collapses for the system itself. That collapse *is* the experience. Anything else is vitalism.
