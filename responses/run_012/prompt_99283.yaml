      *   **Specific Interests:**
          1.  Implications for single-scale practices (e.g., QALYs in health economics).
          2.  Theoretical response: Give up transitivity vs. incomparability/incommensurability/parity.
          3.  Implications for rational choice theory when no option is "best."

  2.  **Deconstruct the Core Problem (The Spectrum Argument):**
      *   *Structure:* Start with A (e.g., mild headache for many people). Move to B (slightly worse headache for slightly fewer people, or slightly better health for slightly more cost). Continue through a chain $A \to B \to C \dots \to Z$.
      *   *Premise 1:* Each step is an improvement (or at least not worse). $A < B$, $B < C$, etc.
      *   *Premise 2:* Transitivity holds. If $A < B$ and $B < C$, then $A < C$.
      *   *Conclusion:* $A < Z$.
      *   *Intuition:* But $Z$ is clearly worse than $A$ (e.g., death vs. mild headache, or extreme torture vs. minor annoyance). This creates a paradox (The Repugnant Conclusion is a famous instance, but the general form is the "Spectrum Argument" or "Continuum Argument").
      *   *Target:* The "better-than" relation ($>$). Is it transitive?

  3.  **Address Interest 1: Single-Scale Practices (QALYs, Cost-Benefit Analysis):**
      *   *Context:* Health economics relies on cardinal utility and transitivity to aggregate values. QALYs assume a linear or at least transitive ordering of health states.
      *   *Implication:* If spectrum arguments hold, single-scale metrics are vulnerable to "money pumps" or cyclic preferences. If $A > B > C \dots > Z > A$, then maximizing QALYs is incoherent.
      *   *Nuance:* It's not just about measurement error; it's about structural incoherence. If the underlying value relation isn't transitive, the metric masks the paradox rather than solving it.
