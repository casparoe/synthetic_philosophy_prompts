  2.  **Deconstruct the Gibbard–Satterthwaite Theorem:**
      *   *What it says:* For any deterministic voting rule with at least 3 outcomes, if it is surjective (onto), it is either dictatorial or manipulable.
      *   *Implication:* No perfect system exists. Strategic voting is inevitable in some scenarios.
      *   *Nuance:* "Dictator" means one voter determines the outcome regardless of others, not necessarily a tyrant. "Manipulable" means there exists *some* profile where lying helps, not that it happens *often* or is *easy*.
      *   *Workarounds:* Restricting preferences (single-peaked), Randomization (Gibbard's 1978 extension), or accepting manipulation as a cost of other benefits (simplicity, expressiveness).

  3.  **Drafting - Section by Section:**

