prompt: |-
  I work for a city council in a mid-sized city and we've somehow ended up committed to building a standing citizens' assembly -- not a one-off consultation, an actual permanent body that meets in cycles, gets a question from us, deliberates, and hands back a recommendation the council then votes on. My job is to write the operating manual: how members get drawn, how long they sit, how they're replaced, when we're allowed to deviate from a plain lottery, what we do when people decline. We have no statistician on staff, the clerk has to be able to run the thing, and the city attorney will read whatever I write before the council does. I've become a convert to the whole idea -- the fairness case (everyone gets an equal chance to hold power, not just an equal vote), the epistemic case (a random draw brings cognitive diversity that a self-selected room of the usual suspects never has), the fact that nobody in the room has to fundraise -- but i genuinely can't see how to get from any of that to rules a hostile councellor can't call rigged.

  So: turn the case for sortition into a decision procedure I can actually follow. Ordered questions, what counts as a sufficient answer to each, where it stops with a hard no, and where it stops and says "this one is a value call, get a human to sign off." The things I keep getting stuck on and need the procedure to resolve: which variables, if any, we stratify on when we draw, given that you can't stratify on everything without turning the lottery into a quota system; whether what actually matters is census-fidelity or diversity of *relevant* perspectives, and how that changes the answer; whether we recruit by address or let people sign up, given that volunteers are systematically more civically minded and more opinionated than the population; what to do about attrition when a third of the seats turn over mid-cycle; whether paying members changes who accepts and therefore corrupts the draw; who gets to frame the question and write the briefing materials, since that's where the real power sits; and whether the body should be able to bind us or only advise.

  Then run the procedure on three cases and show your work: (1) a proposal to run the draw as an open public sign-up, which we know will produce roughly three men for every woman who volunteers; (2) a councillor's motion to reserve eight of sixty seats for one particular group; (3) my own favourite, making the recommendations binding. I'll warn you I'm rooting for (3), and I'd rather you told me straight if the theory doesn't get us there.

  Don't give me citations or a reading list -- I can't look anything up right now and it would just be guessing. Cap it at 1200 words, I'd much rather have a tight procedure than an essay. And tell me what would change your mind about it: which argument or consideration would make you reorder or drop one of the steps, and where you think the procedure is most likely to break down in real use.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **User:** City council staff member tasked with writing an operating manual for a permanent citizens' assembly (sortition).
      *   **Goal:** Convert the theoretical case for sortition (fairness, epistemic diversity, no fundraising) into a concrete decision procedure (operating manual rules).
      *   **Constraints:**
          *   No statistician on staff (clerk must run it).
          *   City attorney will review (legal defensibility).
          *   Hostile councillors might call it rigged (needs robustness against bias accusations).
          *   No citations/reading lists.
          *   Max 1200 words.
          *   Must include a decision procedure (ordered questions, sufficient answers, hard nos, value calls).
          *   Must apply the procedure to three specific cases:
              1.  Open public sign-up (known gender imbalance).
              2.  Reserving 8/60 seats for a particular group.
              3.  Making recommendations binding (user's favorite).
          *   Must include: What would change my mind about the procedure? Where is it most likely to break down?
      *   **Tone:** Practical, direct, procedural, acknowledging the political reality (hostile councillors).

  2.  **Deconstruct the Decision Procedure:**
      *   Needs to be a flowchart-like logic in text form.
      *   Needs to address the specific sticking points mentioned: stratification vs. quota, census fidelity vs. relevant perspectives, recruitment method (address vs. sign-up), attrition, payment, question framing, binding vs. advisory.
      *   Needs to distinguish between *technical* decisions (clerk can do) and *value* decisions (council must sign off).

  3.  **Drafting the Procedure (Mental Outline):**
      *   *Step 1: Recruitment Method.* Cold contact (address) vs. Warm contact (sign-up). Cold is better for representation.
      *   *Step 2: Stratification.* When to adjust the lottery? Only for demographic variables correlated with the issue *and* where random draw fails to match census within a margin of error.
      *   *Step 3: Payment.* Mandatory to ensure participation across income levels.
      *   *Step 4: Mandate.* Advisory vs. Binding. This is a constitutional/legal change, not procedural.
      *   *Step 5: Framing.* Neutral party (clerk/external) vs. Council.

  4.  **Drafting the Case Applications:**
      *   *Case 1 (Sign-up):* Fails Step 1. Self-selection bias undermines the epistemic claim.
      *   *Case 2 (Reserved Seats):* Fails Step 2. Quotas turn lottery into representation-by-identity, risking legal challenge and losing the "random citizen" legitimacy.
      *   *Case 3 (Binding):* Fails Step 4 (likely). Requires charter change. Theory supports it, but procedure flags it as a "Value Call" for the Council/Charter, not the manual.

  5.  **Drafting the Reflection (Change Mind/Breakdown):**
      *   *Change Mind:* If evidence shows cold contact yields too high a refusal rate to function.
      *   *Breakdown:* Question framing/briefing materials. That's where bias hides.

  6.  **Writing - Section by Section (monitoring word count):**

      *   *Intro:* Acknowledge the task. Define the core principle: Legitimacy comes from the *process*, not the *outcome*.
      *   *The Procedure:* Use a numbered list for the decision logic.
          *   Q1: Recruitment. (Cold contact required).
          *   Q2: Stratification. (Only if random draw deviates >5% from census on key demographics).
          *   Q3: Payment. (Yes, stipend + childcare).
          *   Q4: Mandate. (Advisory unless Charter amended).
          *   Q5: Framing. (Neutral staff + external audit).
      *   *Case Runs:*
          *   (1) Sign-up: Reject. Violates Q1.
          *   (2) Reserved Seats: Reject. Violates Q2. Quota vs. Stratification.
          *   (3) Binding: Flag as Value Call. Violates Q4 (legal constraint).
      *   *Reflection:* What changes my mind? What breaks?

  7.  **Refining and Editing (Checking Constraints):**
      *   *Word Count:* Need to be tight. Avoid fluff.
      *   *Tone:* Professional, directive.
      *   *Specifics:* Ensure the distinction between stratification (correcting the lottery) and quotas (fixing outcomes) is clear, as this is the legal minefield.
      *   *Case 3:* The user wants to know if the theory gets them there. I need to be honest: Sortition theory supports binding, but the *procedure* for a council manual likely cannot authorize it without higher-level legal change. I should distinguish between "theoretically valid" and "procedurally allowable in this manual."
      *   *Attorney/Clerk constraint:* The procedure must protect the clerk.

  8.  **Drafting Content (Iterative):**

      *   *Procedure:*
          1.  **Recruitment Source:** Is the pool drawn from voter rolls/utility bills (cold) or open application (warm)?
              *   *Rule:* Must be cold. Warm pools self-select for intensity/privilege.
              *   *Stop:* If warm, Hard No.
          2.  **Stratification:** Do we adjust the draw to match census demographics?
              *   *Rule:* Yes, but only *post-draw correction* (reshuffle) if a key variable (age, gender, geography) deviates >5% from census. No fixed seats.
              *   *Stop:* If fixed seats (quotas), Hard No (legal risk).
          3.  **Compensation:** Is there a stipend?
              *   *Rule:* Yes, market rate for time + expenses.
              *   *Stop:* If no, Hard No (excludes working class).
          4.  **Mandate:** Is the output binding?
              *   *Rule:* Advisory unless City Charter amended.
              *   *Stop:* If binding without Charter change, Hard No (legal).
          5.  **Framing:** Who writes the question/brief?
              *   *Rule:* Clerk + External Neutral Auditor. Council votes on question text only.
              *   *Stop:* If Council writes brief, Hard No (bias).

      *   *Case Runs:*
          1.  *Sign-up:* Fails Q1. Self-selection bias invalidates the "mirror population" claim. Hostile councillors will prove the gender skew.
          2.  *Reserved Seats:* Fails Q2. This is a quota, not stratification. It implies the group cannot be selected by chance, undermining the equality premise. Attorney will flag equal protection issues.
          3.  *Binding:* Hits Q4. Theory supports it (why deliberate if ignored?), but the *manual* cannot authorize it. It's a Value Call for the Council/Charter. I must tell the user: The theory gets you there, the manual cannot.

      *   *Reflection:*
          *   *Change Mind:* If cold contact response rates drop below 5%. Then hybrid model needed.
          *   *Breakdown:* Q5 (Framing). Neutral briefs are impossible. Staff have biases.

      *   *Word Count Check:* Need to expand on the *why* briefly to meet the "show your work" requirement but keep it tight.

      *   *Re-evaluating Case 3:* The user asked "if the theory doesn't get us there." I need to be clear. Sortition theory *does* support binding (sortition as a second chamber). But the *procedure* for a staff manual must flag it as outside staff authority. I will distinguish between "Procedural Pass" and "Political/Legal Pass."

      *   *Refining the "Value Call" distinction:* The prompt asks for "where it stops and says 'this one is a value call, get a human to sign off.'" I need to make sure Q4 explicitly does this.

      *   *Refining Stratification:* The prompt asks about census fidelity vs. relevant perspectives. I need to address this in the procedure. Rule: Census fidelity on *demographics*, not *opinions*.

      *   *Refining Word Count:* I need to be concise. I'll combine the procedure and the rationale.

      *(Self-Correction during drafting)*: I need to make sure I don't exceed 1200 words. I will keep the procedure crisp.

      *(Final Plan)*:
      1.  Intro (50 words)
      2.  The Decision Procedure (400 words)
      3.  Case Applications (400 words)
      4.  Reflection (350 words)
      Total ~1200.

      Let's write.

      *Wait, one more check on Case 3:* The user says "I'm rooting for (3), and I'd rather you told me straight if the theory doesn't get us there."
      My answer should be: The theory supports it, but the *implementation* via a council manual is the bottleneck. I need to be straight.

      *Wait, one more check on Procedure:* "Ordered questions, what counts as a sufficient answer to each, where it stops with a hard no, and where it stops and says 'this one is a value call, get a human to sign off.'"
