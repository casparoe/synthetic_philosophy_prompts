answer: |-
  **The Sortition Operating Procedure**

  **Core Principle:** Legitimacy derives from the *process*, not the *outcome*. The Clerk's role is to protect the randomness; the Council's role is to accept the political risk.

  **Step 1: Recruitment Source**
  *   **Question:** Is the initial pool drawn from administrative records (voter rolls, utility bills, DMV) or open application?
  *   **Sufficient Answer:** Administrative records (Cold Contact).
  *   **Hard No:** Open application. Self-selection biases toward the civically engaged, wealthy, and opinionated. It invalidates the epistemic claim of cognitive diversity.
  *   **Value Call:** None. This is technical.

  **Step 2: Stratification vs. Quotas**
  *   **Question:** Do we adjust the draw to match population demographics?
  *   **Sufficient Answer:** Yes, via *reshuffling*. If a random draw deviates >5% from census data on key variables (age, gender, geography), discard and redraw until it matches.
  *   **Hard No:** Reserved seats (Quotas). Assigning specific seats to specific groups implies chance is insufficient for those groups, undermining the equality premise and inviting equal-protection legal challenges.
  *   **Value Call:** Which variables count as "key." Census fidelity is the default; Council must vote to add "relevant perspectives" (e.g., renters vs. owners) as stratification variables.

  **Step 3: Compensation**
  *   **Question:** Are members paid?
  *   **Sufficient Answer:** Yes. Stipend at local hourly wage + childcare + transport.
  *   **Hard No:** Unpaid. Excludes working class, corrupting the random sample toward the retired/wealthy.
  *   **Value Call:** None.

  **Step 4: Mandate (Binding vs. Advisory)**
  *   **Question:** Is the Assembly's recommendation binding on the Council?
  *   **Sufficient Answer:** Advisory, unless the City Charter is amended.
  *   **Hard No:** Staff cannot authorize binding outcomes via manual.
  *   **Value Call:** **Yes.** This is a transfer of sovereignty. The theory supports binding (otherwise why deliberate?), but the procedure flags this as a Council/Charter decision, not staff protocol.

  **Step 5: Framing and Briefing**
  *   **Question:** Who writes the question and background materials?
  *   **Sufficient Answer:** Clerk drafts, external neutral auditor certifies balance. Council votes on the question text only.
  *   **Hard No:** Council or advocacy groups writing the brief. This is where power hides.
  *   **Value Call:** Selection of the external auditor.

  ***

  **Case Applications**

  **Case 1: Open Public Sign-Up**
  *   **Procedure Run:** Fails Step 1 (Recruitment Source).
  *   **Verdict:** **Hard No.**
  *   **Work:** You noted the gender skew (3:1 men). A hostile councillor will use this to claim the body is unrepresentative. Because the pool is self-selected, you cannot statistically correct for this without turning it into a quota system (violating Step 2). The epistemic case collapses because the room contains only those who *want* to be there, not those who *were chosen*.
  *   **Outcome:** Reject. Use cold contact from voter rolls.

  **Case 2: Reserving 8 of 60 Seats**
  *   **Procedure Run:** Fails Step 2 (Stratification vs. Quotas).
  *   **Verdict:** **Hard No.**
  *   **Work:** This is a quota, not stratification. Stratification corrects the lottery to match the population; quotas fix the outcome regardless of the lottery. Legally, this treats citizens differently based on identity rather than chance. Politically, it tells the other 52 members their randomness was secondary. It invites litigation on equal protection grounds that the City Attorney cannot defend.
  *   **Outcome:** Reject. If representation is low, adjust the stratification variables in Step 2 (e.g., stratify by geography which correlates with the group), but do not reserve seats.

  **Case 3: Making Recommendations Binding**
  *   **Procedure Run:** Hits Step 4 (Mandate).
  *   **Verdict:** **Value Call.**
  *   **Work:** You asked if the theory gets us there. **Yes.** If the assembly is truly representative, its will *is* the people's will. Advisory status treats it as a focus group, wasting the epistemic value. However, the *procedure* stops me from authorizing this. A staff manual cannot override the Council's legislative authority or the City Charter.
  *   **Outcome:** I cannot write this into the manual. You must draft a Charter Amendment for the Council to vote on. The manual must assume advisory status to protect the Clerk, but the cover memo should explicitly recommend the Council consider binding status to fulfill the theory's promise.

  ***

  **Reflection: Vulnerabilities and Pivot Points**

  **What Would Change My Mind?**
  Step 1 (Cold Contact) is the weakest link practically. If the refusal rate exceeds 95%, the assembly cannot sit. If empirical data shows cold contact yields too few participants to function despite payment, I would reorder Step 1 to allow a **Hybrid Model**: Cold contact for 80% of seats, open application for 20%. This admits bias but ensures functionality. I would require the Council to sign off on this degradation of randomness as a "Value Call."

  **Where the Procedure Will Break Down**
  Step 5 (Framing and Briefing). This is the silent killer. We assume "neutral" briefs are possible. They are not. Staff selecting which expert testimony to include *is* decision-making. A hostile councillor will claim the brief was rigged to produce a specific outcome.
  *   **Risk:** The Clerk becomes the target.
  *   **Mitigation:** The procedure requires an external auditor, but who audits the auditor? In real use, this step will consume 80% of the political energy. The procedure assumes good faith; real use will not.

  **Final Advice on Case 3**
  You are rooting for binding recommendations. The theory is on your side, but the law is not. Do not try to sneak binding authority into the operating manual. The City Attorney will strike it, and it will poison the well for the whole project. Instead, use the manual to build a flawless *advisory* body. Let its first recommendation be so obviously correct, and so publicly supported, that the Council feels politically unsafe ignoring it. Soft power first; hard power later via Charter change.

  **Summary of Limits**
  *   **Clerk's Domain:** Recruitment, Stratification, Payment, Briefing Neutrality.
  *   **Council's Domain:** Mandate (Binding), Stratification Variables, Charter Amendments.
  *   **Attorney's Domain:** Quotas, Legal Authority.

  Stick to the procedure. It protects you from accusations of rigging because it removes discretion. If the outcome is unpopular, the process was followed. That is your shield.
