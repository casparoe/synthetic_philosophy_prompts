  The example that carries it
  Use the stick in water. Mirages are too distant ("maybe the air is weird there"), and hallucinations invite debates about mental health rather than perception. The stick is immediate and verifiable; everyone can see it bend. The risk is students saying "It's just refraction." Pre-empt this: agree it's refraction, but ask, "If your eyes report 'bent' and your brain knows 'straight,' which did you *see*?" You saw bent. Therefore, what you perceived wasn't the stick itself, but an appearance. This forces the wedge between object and perception. Stick with this single case. Don't clutter with dreams or drugs. If they grasp the stick, they grasp the gap between reality and experience.

  Misconceptions and where to kill them
