  Hey so I'm the president of my school's philosophy club (we're like eight people, mostly juniors, we meet in the library after school for 45 minutes and honestly a couple of them are only there because their friend drags them), and next week it's my turn to run the session. I want to do the thing where you argue that since perception can trick you -- the stick that looks bent in a glass of water, mirages, colors changing under different lights -- you never actually perceive the world directly, you only ever perceive some inner picture of it, and then the comeback that says veridical perception and hallucination aren't the same kind of thing at all, they just feel identical from the inside. I think the comeback is called disjunctivism?? Anyway, please don't just explain the topic to me, I basically get the gist and that's not what I need -- I need a plan for how to actually teach it to these guys, because last time I tried to explain something philosophical off the cuff it went terrible and everyone just stared at me.

  So: what has to come first, before the question even makes sense to them (do they need to already buy into some idea about 'direct' perception, or can I start cold)? What single example should carry the whole session, and why not the stick-in-water -- or if it should be the stick, tell me what's wrong with the alternatives I was thinking about, like a mirage or someone hallucinating a voice? Which misconceptions will they walk in with or form halfway through, and where exactly in the sequence do I stop and head each one off? I'm guessing the big ones are 'so disjunctivism means you can never be wrong about anything' and 'it means hallucinations aren't real' and something about 'if you can't tell them apart then they're seperate identical things,' but I'm probably missing the real traps. Also give me one question I can ask at the very end to check whether they actually got the difference between the two views or just nodded along, and tell me what I should openly skip at this level and say out loud that I'm skipping it (none of them have read any philosophy, and all I've got is a whiteboard and 45 minutes).

  Lay your answer out for me in these sections, in this order: "Where to start" (about 150 words), "The example that carries it" (about 150), "Misconceptions and where to kill them" (the big one, like 300), "The final check" (100 or so), and "What I'm skipping" (100 or so).
