  The biggest trap is the 'Common Kind Assumption': the idea that if a real perception and a hallucination feel the same, they must be the same *kind* of mental state. This is where students will nod along to indirect realism. Stop them here. When someone says, "But you can't tell the difference," intervene immediately. Say: "Indistinguishable doesn't mean identical. A fake diamond and a real diamond feel identical to a novice, but one is glass, one is carbon."
  Another trap: "Disjunctivism means hallucinations aren't real." Clarify early: Disjunctivism says the *experience* is real, but it's a different *type* of event than seeing. It's not seeing nothing; it's a different kind of happening. If you wait until the end, they'll think you're denying madness exists.
  Third trap: "So we can never know anything?" Stop skepticism early. Remind them this is about the *mechanism* of perception, not truth. You can still know the stick is straight.
  Address these immediately when they arise, not at the end. If you wait, the confusion solidifies into "philosophy is confusing." Watch for glazed eyes when you mention "inner pictures." That's the moment to ask, "Who thinks this means we're trapped in our heads?" and correct it. The goal is to show that Disjunctivism isn't denying the feeling, it's denying the classification. Don't let them leave thinking Disjunctivism is just stubbornness. It's a claim about categories, not feelings. Make sure you draw the fork on the board: Option A (Same state, different cause) vs. Option B (Different state entirely). If you don't visualize this split, they will assume Disjunctivism is just denying the hallucination happens at all.

