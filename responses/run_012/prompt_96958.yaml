      *   *Irrelevant Disanalogies:* "Clubs have handshakes, neighborhoods don't." (Doesn't affect the exclusion right).
      *   *Critical Disanalogies:*
          1.  **Sovereignty/State Action:** Private clubs use private property rights. Neighborhoods use *police power* (zoning). If the "club" controls the referee, it's not a fair game.
          2.  **Public Goods vs. Club Goods:** Schools and streets are funded by taxes but legally public. Excluding people from *public* infrastructure violates the social contract.
          3.  **Exit Costs:** In a club, leaving is easy. In housing, leaving is expensive/impossible for many. If exit is blocked, voice is the only option. If voice is blocked (by zoning), you have tyranny.
          4.  **Negative Externalities:** One club excluding doesn't hurt non-members much. One neighborhood excluding pushes density/poverty elsewhere, creating regional systemic failure.

  6.  **Analyzing the "Good" (Rivalrous/Excludable):**
      *   *Club Good:* Excludable, Rivalrous (e.g., golf course slot).
      *   *Neighborhood Reality:*
          *   *Quiet:* Non-rivalrous (my quiet doesn't stop your quiet) until congestion hits.
          *   *Schools:* Legally public, funded by taxes. Excluding tax-paying renters is the contradiction.
          *   *Housing:* Rivalrous (one person per unit), but zoning restricts *supply*, creating artificial rivalry.
      *   *Impact:* If the good is public (streets/safety), the club argument fails. If the good is artificial scarcity (zoning-limited housing), the club argument is circular.

  7.  **Analyzing "Birth" and "Government Control":**
      *   *Birth:* Private clubs don't usually inherit membership automatically with voting rights on new members. Neighborhoods do (homeowners vote, renters don't, even if renters pay "dues" via rent).
