  ### The Taxonomy of Moral Trade

  **Node 1:** Do the conflicting commitments reflect competing interpretations of a single ultimate good, or irreducibly distinct goods?
  *   **Branch A:** A single ultimate good.
      *   **Leaf 1: Value Monism.**
          *   *Hardest commitment:* Accepting that the animal advocate and the health advocate were, despite their protests, arguing about the same underlying metric all along.
  *   **Branch B:** Irreducibly distinct goods.
      *   **Node 2:** Can the satisfaction of one distinct good compensate for the sacrifice of another in a way that yields a net normative gain?
          *   **Branch A:** No.
              *   **Leaf 2: Radical Pluralism.**
                  *   *Hardest commitment:* Accepting that the swap produced no actual moral improvement despite both parties feeling better off.
          *   **Branch B:** Yes.
              *   **Node 3:** Should the parties treat their current preferences as fixed inputs for negotiation, or as provisional judgments subject to transformation through dialogue?
                  *   **Branch A:** Provisional judgments subject to transformation.
                      *   **Leaf 3: Deliberative Democracy.**
                          *   *Hardest commitment:* Accepting that a mutually beneficial swap is impermissible if it bypasses a process that might have changed the parties' minds.
                  *   **Branch B:** Fixed inputs.
                      *   **Node 4:** Are there some commitments that are prohibited from being traded regardless of the magnitude of the gains?
                          *   **Branch A:** Yes (Constrained).
                              *   **Node 5:** Does the prohibition on trading stem from the nature of the value itself, or from the effect trading has on the moral character of the agent?
                                  *   **Branch A:** The nature of the value itself.
                                      *   **Leaf 4: Sacred Value Theory.**
                                          *   *Hardest commitment:* Accepting that a trade is forbidden even in secret where no social meaning is altered, because the value itself forbids it.
                                  *   **Branch B:** The effect on the moral character of the agent.
                                      *   **Node 6:** Is the integrity at risk that of the individual voter, or of the collective body they constitute?
                                          *   **Branch A:** The collective body.
                                              *   **Leaf 5: Institutional Fiduciary Duty.**
                                                  *   *Hardest commitment:* Accepting that an individual member must vote against a trade they personally benefit from if it undermines the foundation's unified mission.
                                          *   **Branch B:** The individual voter.
                                              *   **Node 7:** Is the corruption caused by the act itself, or by the public perception of the act?
                                                  *   **Branch A:** The act itself.
                                                      *   **Leaf 6: Intrinsic Integrity Constraint.**
                                                          *   *Hardest commitment:* Accepting that an agent must sometimes accept a worse overall outcome to avoid soiling their own moral hands.
                                                  *   **Branch B:** The public perception.
                                                      *   **Leaf 7: Expressive Integrity Constraint.**
                                                          *   *Hardest commitment:* Accepting that a swap is permissible in secret but forbidden in public, even if the outcomes are identical.
                          *   **Branch B:** No (Unconstrained).
                              *   **Node 8:** Is the permissibility of the trade determined solely by the private preferences of the traders, or must it be justifiable to those outside the agreement?
                                  *   **Branch A:** Justifiable to outsiders.
                                      *   **Leaf 8: Public Reason Liberalism.**
                                          *   *Hardest commitment:* Accepting that a mutually beneficial swap must be rejected if it cannot be defended with reasons acceptable to all reasonable stakeholders.
                                  *   **Branch B:** Private preferences.
                                      *   **Node 9:** Does the trade require the consent of third parties who bear costs, or only the consent of the traders?
                                          *   **Branch A:** Only the traders.
                                              *   **Leaf 9: Efficiency Prioritarianism.**
                                                  *   *Hardest commitment:* Accepting that a swap is permissible even if it imposes unconsented costs on outsiders, provided the traders' gains are large enough.
                                          *   **Branch B:** Third parties must not bear costs.
                                              *   **Leaf 10: Pareto Liberalism.**
                                                  *   *Hardest commitment:* Accepting that a swap beneficial to traders must be blocked if it imposes even minor unconsented costs on outsiders.

