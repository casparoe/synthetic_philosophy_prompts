prompt: |-
  In a long argument I had recently about a conspiracy claim — the claim being that a certain government program existed, was later wound down, and was erased, with the participants bound to silence and the records destroyed — my interlocutor kept repeating "absence of evidence is not evidence of absence" every time I observed that no document, no participant, and no trace of the program had ever surfaced. I could not tell whether he was asserting something trivially true, something substantive and probably false, or something that quietly presupposes the very point at issue. Give me the menu.

  Lay out the distinct precise claims that sentence could be making, ordered from the near-vacuous to the strong, each stated as a claim I could actually assess. I expect the list to include at least: a deductive reading (no finite body of observation can refute a hypothesis); a probabilistic reading (about what a missing observation does or does not do to a hypothesis's posterior probability, and under what assumption about the chance that the evidence would have existed had the hypothesis been true); and a normative reading (about when one may believe something, as against when one may merely fail to disbelieve it). For each reading, say what would make it true or false, whether it is a platitude, a defensible thesis, or a falsehood, and — the part I care about — whether it actually licenses the move he made: treating the total absence of traces as no reason at all against the claim.

  Two distinctions I especially want drawn out. First, the difference between a hypothesis that merely permits the absence of evidence and one that predicts it, and whether, once that distinction is on the table, his use of the slogan retains any force. Second, whether the slogan does the same work when the missing evidence is the kind one would expect to survive (a program's worth of personnel, procurement, and paper) as when it is the kind one would expect to vanish. Where the answer turns on a technical notion — likelihood, confirmation, defeat, burden of proof, detection power — state the notion plainly rather than gesturing at it, since I intend to take this back to him.

  Finally, separate what is settled among people who study evidence and confirmation from what is genuinely contested, and do not present a contested position as though it were the consensus.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A debate about a conspiracy theory (secret government program, wound down, erased, participants silenced, records destroyed).
      *   **Opponent's Move:** Repeatedly using "Absence of evidence is not evidence of absence" (AENEOA) to counter the observation that *no* trace exists.
      *   **Task:** Create a "menu" of distinct precise claims the slogan could be making, ordered from vacuous to strong.
      *   **Required Readings:** Deductive (logical), Probabilistic (Bayesian/Confirmation), Normative (Epistemic/Justification).
      *   **Evaluation Criteria:** For each reading: Truth conditions, Status (platitude/thesis/falsehood), and crucially, *does it license the opponent's move* (treating total absence as no reason against the claim)?
      *   **Specific Distinctions:**
          1.  Hypothesis *permits* absence vs. *predicts* absence.
          2.  Evidence expected to survive vs. expected to vanish (Detection Power).
      *   **Technical Notions:** Define plainly (likelihood, confirmation, etc.).
      *   **Consensus vs. Contested:** Distinguish settled epistemology from debated points.

  2.  **Deconstruct the Slogan ("Absence of evidence is not evidence of absence"):**
      *   *Literal/Logical:* You can't prove a negative with absolute certainty via finite observation. (True, but weak).
      *   *Probabilistic:* Missing data doesn't *always* lower probability. (True, depends on expectations).
      *   *Rhetorical/Abusive:* You can't use missing data to argue against me *at all*. (False in most contexts).

  3.  **Drafting the Menu (Iterative Process):**

      *   *Item 1: The Deductive/Logical Reading.*
          *   Claim: No finite set of observations logically entails the non-existence of a hidden entity.
          *   Status: True (Platitude). Hume's problem of induction / Underdetermination.
          *   Licenses Move? No. It prevents *conclusive proof*, not *probabilistic support*.
      *   *Item 2: The Probabilistic Reading (The Core).*
          *   Claim: $P(H| \neg E) = P(H)$ (Evidence absence doesn't change probability).
          *   Condition: Only true if $P(E|H) = P(E|\neg H)$. i.e., The evidence was equally likely to be missing whether the hypothesis was true or false.
          *   Status: Contingent. Often false in conspiracy cases.
          *   Licenses Move? Only if the "Cover-up" hypothesis predicts the absence perfectly.
      *   *Item 3: The Normative/Epistemic Reading.*
          *   Claim: One is never rationally required to lower confidence in $H$ due to $\neg E$.
          *   Status: False. Violates Bayesian updating.
          *   Licenses Move? No, it's an error.
      *   *Item 4: The "Search Effort" Reading.*
          *   Claim: Absence is only evidence if a sufficient search was conducted.
          *   Status: True (Defensible). Relates to "Detection Power."
          *   Licenses Move? Only if the search was inadequate. In the prompt's case (long argument, no traces ever), search seems sufficient.

  4.  **Addressing the Specific Distinctions:**
      *   *Permits vs. Predicts:* If $H$ says "Records might exist," $\neg E$ hurts $H$. If $H$ says "Records were destroyed," $\neg E$ fits $H$. But $H$ must also explain *why* $\neg E$ happens if $\neg H$. (Likelihood Ratio).
      *   *Survive vs. Vanish:* Large programs leave physical traces (procurement, payroll). These are hard to erase completely. "Vanishing" evidence requires a secondary hypothesis (Cover-up). The Cover-up itself needs evidence.

  5.  **Refining Technical Notions:**
      *   *Likelihood:* Probability of evidence given hypothesis ($P(E|H)$).
      *   *Confirmation:* Increase in probability of hypothesis given evidence.
      *   *Detection Power:* Probability of finding evidence if it exists.

  6.  **Consensus vs. Contested:**
      *   *Consensus:* Bayesian updating is the standard model. Absence of evidence *is* evidence of absence *unless* the evidence was unlikely to be found even if true.
      *   *Contested:* Thresholds for belief, specific priors, handling of "unknown unknowns."

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the frustration. State the purpose of the menu.
      *   **The Menu (Ordered by Strength):**
          1.  Deductive (Logical Impossibility).
          2.  Search-Relative (Insufficient Effort).
          3.  Probabilistic (Likelihood Equality).
          4.  Normative (Immunity from Disconfirmation).
      *   **The Two Crucial Distinctions:**
          1.  Permitting vs. Predicting (The Likelihood Ratio).
          2.  Fragile vs. Robust Evidence (Detection Power).
      *   **Settled vs. Contested:** Clear demarcation.
      *   **Conclusion:** How to use this against the interlocutor.

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain *Likelihood* plainly? *Adjustment:* Define it as "How expected is the evidence if the story is true?"
      *   *Check:* Did I address the "Cover-up" aspect? *Adjustment:* Ensure the "Predicts Absence" section explicitly handles the "Records Destroyed" claim. The cover-up is part of the hypothesis.
      *   *Check:* Is the tone appropriate? *Adjustment:* Keep it analytical, precise, and philosophical but accessible.
      *   *Check:* Did I answer whether it licenses the move? *Adjustment:* Make sure every menu item has a explicit "Does it license the move?" verdict.

  9.  **Final Polish:** Ensure the distinction between "evidence of absence" (probabilistic lowering) and "proof of absence" (logical certainty) is sharp. The interlocutor conflates them. The prompt asks for "claims I could actually assess." Make them formalizable but readable. (e.g., using $P(H|E)$ notation where helpful but explaining it).

      *(Self-Correction on the "Predicts Absence" point)*: If the hypothesis is "Program existed AND was erased," then absence of records is predicted. *However*, the hypothesis also predicts traces of the *erasure* or traces of the *program's infrastructure* that are hard to erase (e.g., concrete, payroll taxes). So the slogan fails if the *total* absence includes the hard-to-erase stuff. I need to make sure this nuance is clear.

      *(Refining the "Consensus" section)*: Be careful not to say "All epistemologists are Bayesians." Say "Among those who model confirmation formally..."

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a menu of the distinct claims your interlocutor might be making with the slogan "Absence of evidence is not evidence of absence." They are ordered from the logically vacuous (true but useless) to the epistemologically strong (useful but false).

  For each claim, I have provided the **Assessment** (is it true?), the **Status** (platitude, defensible thesis, or falsehood), and the **License** (does it justify treating total silence as no reason to doubt the conspiracy?).

  ### The Menu of Claims

  #### 1. The Deductive Reading (Logical Impossibility)
  *   **The Claim:** No finite set of observations can logically entail the non-existence of a hypothetical entity with absolute certainty.
  *   **Plain English:** You cannot prove a negative with 100% logical guarantee just by looking around.
  *   **Assessment:** **True.** This is a standard point in logic and the philosophy of science (underdetermination). Even if you search everywhere, a proponent can always posit the evidence is hidden *just* outside your search parameters.
  *   **Status:** **Platitude.** It is trivially true but applies only to *conclusive proof*, not to *reasonable belief*.
  *   **License:** **No.** This claim prevents you from saying "It is *impossible* that the program existed." It does not prevent you from saying "It is *highly improbable* that the program existed." Your interlocutor is using a limit on *certainty* to block a reduction in *probability*.

  #### 2. The Search-Relative Reading (Insufficient Effort)
  *   **The Claim:** Absence of evidence counts as evidence of absence only if a sufficiently thorough search has been conducted.
  *   **Plain English:** If you haven't looked hard enough, finding nothing tells us nothing.
  *   **Assessment:** **True.** This relies on the technical notion of **Detection Power**. Detection power is the probability that you would find the evidence *if it were there*. If detection power is low, missing evidence is weak evidence.
  *   **Status:** **Defensible Thesis.** This is the only context where the slogan is practically useful (e.g., "We haven't found aliens yet, but we've only scanned a tiny fraction of the galaxy").
  *   **License:** **Conditional.** It licenses the move *only if* the search was inadequate. In your case (a government program involving personnel, procurement, and paper), the "search" is the normal functioning of bureaucracy, journalism, and history over decades. If the detection power for such a large program is high, this reading collapses.

  #### 3. The Probabilistic Reading (Likelihood Equality)
  *   **The Claim:** The absence of evidence does not lower the probability of the hypothesis if the evidence was equally unlikely to exist (or be found) whether the hypothesis is true or false.
  *   **Plain English:** Finding nothing only hurts the theory if you expected to find something. If you expected to find nothing either way, finding nothing changes nothing.
  *   **Assessment:** **True (Mathematically).** In Bayesian confirmation theory, evidence $E$ confirms Hypothesis $H$ only if $P(E|H) > P(E|\text{not-}H)$. Conversely, absence of evidence ($\neg E$) is evidence of absence only if $\neg E$ is more likely given $\text{not-}H$ than given $H$.
  *   **Status:** **Defensible Thesis.** This is the core technical truth behind the slogan.
  *   **License:** **No (in this context).** This licenses the move *only if* the conspiracy hypothesis predicts the absence of records just as well as the "no conspiracy" hypothesis does.
      *   *Hypothesis A (No Program):* Predicts no records.
      *   *Hypothesis B (Program + Cover-up):* Predicts no records *only if* the cover-up was perfect.
      *   Since perfect cover-ups are rare and difficult, Hypothesis B usually makes the absence of records *less* likely than Hypothesis A does (because B requires extra steps to succeed). Therefore, the absence *does* lower the probability of B.

  #### 4. The Normative Reading (Immunity from Disconfirmation)
  *   **The Claim:** One is never rationally required to lower one's confidence in a hypothesis solely due to missing evidence.
  *   **Plain English:** You can believe whatever you want regardless of what you fail to find.
  *   **Assessment:** **False.** This violates the basic norms of rational belief updating. If a hypothesis predicts traces, and traces are not found, rational confidence must drop.
  *   **Status:** **Falsehood.**
  *   **License:** **Yes, but illegitimately.** This is the only reading that actually licenses your interlocutor's move (treating total absence as irrelevant). However, it is an epistemological error. It treats hypotheses as unfalsifiable beliefs rather than empirical claims.

  ---

  ### The Two Crucial Distinctions

  To dismantle the slogan's utility in this specific argument, you must force your interlocutor to choose on these two points.

  #### 1. Permitting vs. Predicting (The Likelihood Ratio)
  There is a massive difference between a hypothesis that *allows* for missing evidence and one that *expects* it.
  *   **Permitting:** "The program existed, and maybe records exist, maybe they don't." If the hypothesis merely permits absence, then finding absence is evidence against it (because finding presence would have been stronger support).
  *   **Predicting:** "The program existed, *and* all records were systematically destroyed." This hypothesis predicts absence.

  **Why this kills the slogan:**
  Your interlocutor is using a "Predicting" version (the records were destroyed). However, this moves the goalposts. The hypothesis is no longer just "The Program Existed"; it is now "The Program Existed + A Perfect Cover-up Occurred."
  You must assess the **Likelihood Ratio**: How likely is total silence if the Program + Cover-up happened, versus how likely is total silence if *nothing* happened?
  *   If nothing happened, silence is 100% expected.
  *   If a program happened, even with a cover-up, silence is *not* 100% guaranteed (leaks, mistakes, physical infrastructure).
  *   Because silence is *more* likely under "Nothing Happened" than under "Program + Cover-up," the silence **is** evidence of absence. The slogan fails because it ignores that the "Cover-up" add-on makes the hypothesis *more complex and less likely* to result in total silence than the null hypothesis.

  #### 2. Fragile vs. Robust Evidence (Detection Power)
  The slogan works for fragile evidence (e.g., a footprint in the rain) but fails for robust evidence (e.g., a building foundation).
  *   **Fragile:** Evidence that naturally degrades or vanishes over time. Absence here is weak evidence of absence.
  *   **Robust:** Evidence that requires active effort to destroy (payroll records, concrete foundations, thousands of personnel memories).

  **Why this kills the slogan:**
  A government program of significant scale produces **Robust Evidence**. It creates procurement trails, budget allocations, and physical infrastructure.
  *   **Technical Notion:** **Detection Power.** For robust evidence, detection power is high. The probability of finding *some* trace given the program existed is near 1.
  *   Therefore, $P(\text{No Trace} | \text{Program})$ is very low.
  *   When $P(\text{No Trace} | \text{Program})$ is low, the observation of "No Trace" drastically reduces the probability of the Program.
  *   Your interlocutor's slogan assumes the evidence is the kind that might naturally vanish. You must argue that the evidence in question is the kind that *cannot* vanish without leaving traces of its destruction.

  ---

  ### Settled vs. Contested in Epistemology

  When you take this back to him, be careful not to present debated philosophical nuances as settled facts. Here is the division:

  **Settled (Consensus among formal epistemologists):**
  1.  **Absence of evidence is evidence of absence, provided the evidence was expected.** If a hypothesis predicts evidence with high probability, and that evidence is not found, the hypothesis is disconfirmed. This is a mathematical theorem of Bayesian confirmation theory.
  2.  **Underdetermination is real but practically limited.** While data cannot *logically prove* a negative (Deductive Reading), it can make a hypothesis so improbable that believing it is irrational (Probabilistic Reading).
  3.  **Ad Hoc Rescue.** Adding clauses to a hypothesis to explain away missing evidence (e.g., "records were destroyed") lowers the prior probability of that hypothesis. You cannot add "invisible cover-ups" without a cost to the theory's credibility.

  **Contested (Where philosophers disagree):**
  1.  **The Threshold of Belief.** Exactly *how much* absence is required before disbelief is mandatory? There is no consensus on the specific probability threshold for "knowledge" or "justified belief."
  2.  **Handling "Unknown Unknowns."** How to assign probabilities when we don't know what kind of traces a secret program *would* leave. (Your counter: We know what normal programs leave; the burden is on him to explain why this one is different).
  3.  **The Priors.** How much initial credence to give a conspiracy theory before looking at evidence. (This is subjective, but most argue for a very low prior on secret large-scale programs).

  ### Summary for your Interlocutor

  You can summarize the situation to him this way:

  > "You are using the **Deductive Reading** (you can't prove a negative) to defend a **Normative Claim** (I don't have to lower my belief).
  >
  > In formal terms: Absence of evidence is evidence of absence whenever the **Likelihood** of that absence is higher on the null hypothesis than on your hypothesis.
  >
  > Your hypothesis is not just 'The Program Existed.' It is 'The Program Existed AND a Perfect Cover-up Erased All Robust Traces.'
  >
  > Total silence is vastly more likely if nothing happened than if a massive program and a massive cover-up both happened perfectly. Therefore, the silence **is** evidence against your claim. The slogan only applies if the evidence was fragile or the search was weak. Neither is true here."
