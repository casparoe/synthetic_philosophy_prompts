          *   *Issue:* Object manifests M when C, has a base-like property, but intuitively lacks the disposition (e.g., a fragile glass protected by a guardian angel vs. a sturdy glass that breaks because a god wills it when struck).
          *   *Defender's Move:* Argue the "base" isn't the right intrinsic property.
          *   *Verdict:* This threatens the *specificity* of the base. If *any* base + laws works, it's too loose. If only *specific* bases work, we need an account of relevance.
