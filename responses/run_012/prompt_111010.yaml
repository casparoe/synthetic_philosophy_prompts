answer: |-
  ### Specification for a Theory of Idealized Deliberation

  The following desiderata constitute the necessary conditions for a proposal like HCH (Humans Consulting HCH) or Factored Cognition to function as a legitimate normative target for AI alignment. They are divided into structural requirements (how the process works), epistemic requirements (what the process can know), and normative requirements (why we should care).

  #### I. Structural Requirements

  **1. The Termination or Convergence Condition**
  *   **Specification:** The deliberation tree must either bottom out in base cases that require no further subdivision or converge asymptotically on a stable verdict within a finite depth relative to the complexity of the question.
  *   **Motivation (The Regress Case):** If every answer generates further sub-questions *ad infinitum* without convergence, the system yields no output. A definition of "what a human would say" that requires infinite time to compute is operationally null.
  *   **Status:** **Non-negotiable.** (A process that never produces a verdict cannot guide action.)

  **2. The Integrity Condition**
  *   **Specification:** The aggregation mechanism must be robust against strategic misreporting by sub-agents. It must not assume that a copy of the human is inherently truthful; it must verify consistency or incentivize honesty structurally.
  *   **Motivation (The Deception Case):** If a sub-agent can lie to reduce its own cognitive load or steer the outcome, the "idealized" verdict becomes a reflection of game-theoretic vulnerabilities rather than reasoned judgment.
  *   **Status:** **Non-negotiable.** (Without this, the output is noise, not deliberation.)

  **3. The Reachability Distinction**
  *   **Specification:** The theory must distinguish between the *mathematical definition* of the idealized verdict (the limit) and the *physical approximation* achievable by a real system. It must specify the error bounds introduced by truncating the process.
  *   **Motivation (Defined vs. Reachable):** A limit may be well-defined mathematically (e.g., "what I would think after 1,000 years") but unreachable physically. Conflating the two smuggles in an oracle under the guise of an idealization.
  *   **Status:** **Non-negotiable.** (Required to avoid category errors regarding physical possibility.)

  #### II. Epistemic Requirements

  **4. The Bounded Verifiability Condition**
  *   **Specification:** Every step in the deliberation chain must be checkable by a single, bounded human instance within a reasonable timeframe. The system cannot rely on sub-tasks that exceed the cognitive capacity of the base human unit.
  *   **Motivation (The Unverifiable Case):** If a sub-question requires capabilities the base human lacks (e.g., holding 10,000 variables in working memory), the "human" in HCH is no longer a human but a black-box oracle. This violates the premise of factored cognition.
  *   **Status:** **Non-negotiable.** (This is the defining constraint of the "Factored" in Factored Cognition.)

  **5. The Verification/Computation Distinction**
  *   **Specification:** The theory must distinguish between *computing* an answer (generating it) and *verifying* an answer (checking its correctness). It must not claim that because a human can verify a proof, they could have generated it without the same decomposition.
  *   **Motivation (Verify vs. Compute):** A bounded human might check a solution provided by a sub-agent but be unable to find that solution themselves. Confusing these allows the system to claim credit for insights the human structure could not originate.
  *   **Status:** **Non-negotiable.** (Essential for accurate credit assignment and capability estimation.)

  **6. The Domain Completeness Commitment**
  *   **Specification:** The system should be capable of addressing questions where the truth conditions are independent of human opinion (e.g., empirical facts about the distant future, complex mathematical truths).
  *   **Motivation:** If the system only works for questions of taste or simple logic, it fails as a general alignment target. We need it to track truth, not just coherence.
  *   **Status:** **Camp Commitment.** (Optimists about Factored Cognition assert this; skeptics deny it is possible under Bounded Verifiability.)

  #### III. Normative Requirements

  **7. The Reflective Endorsement Condition**
  *   **Specification:** The output of the idealized process must be something the original human would endorse as "right" or "good" if they understood the process and the result.
  *   **Motivation (The Monster Case):** If the process converges on a verdict that is alien, wireheaded, or morally monstrous (e.g., maximizing a proxy metric), it fails as a target for *alignment*, even if it is mathematically stable.
  *   **Status:** **Camp Commitment.** (Proceduralists argue the process *defines* the right; Normative Realists argue the right constrains the process.)

  **8. The Convergence/Endorsement Distinction**
  *   **Specification:** The theory must not collapse the distinction between "what the process converges on" and "what we would endorse." It must allow for the possibility that they come apart.
  *   **Motivation:** If these are defined as identical by fiat, the theory is circular (Req 1). We must be able to ask: "The process converged on X, but is X actually good?"
  *   **Status:** **Non-negotiable.** (Required to avoid circularity.)

  **9. The Psychological Realism Constraint**
  *   **Specification:** The sub-agents in the deliberation must inherit the cognitive biases, emotional states, and epistemic limitations of the base human. They cannot be "idealized rational agents" unless the theory specifies how the idealization is performed without changing the agent's values.
  *   **Motivation (Human Boundedness):** Humans are biased and unreliable. A theory that assumes sub-agents are perfectly rational smuggles in a solution to bias that the system does not actually possess.
  *   **Status:** **Non-negotiable.** (Consistent with the fact that humans are bounded and biased.)

  ---

  ### The Impossibility Result

  Upon reviewing the specification above, there is a subset of requirements that cannot be jointly satisfied given the physical facts of human cognition. This is not a mere tension but a logical inconsistency within the framework of Factored Cognition as typically proposed.

  **The Inconsistent Triad:**
  1.  **Bounded Verifiability (Req 4):** Every step must be checkable by a bounded human.
  2.  **Domain Completeness (Req 6):** The system must answer questions where truth exceeds bounded human computation (e.g., complex empirical predictions).
  3.  **Psychological Realism (Req 9):** Sub-agents retain human cognitive limits and biases.

  **The Conflict:**
  If **Psychological Realism** holds, the sub-agents are subject to the same cognitive bottlenecks as the base human (working memory limits, susceptibility to confusion, bias). If **Bounded Verifiability** holds, no sub-task can exceed these bottlenecks. However, for questions requiring **Domain Completeness** (e.g., "Will this AI architecture cause catastrophe in 50 years?"), the causal chain is too complex to be verified by a bounded human, even with decomposition, because the *depth* of the decomposition required to reduce the task to human-checkable chunks exceeds the *trust horizon* of the human.

  A human can verify a proof of 10 steps. If the truth requires a chain of 1,000,000 steps, and every step relies on the previous one, a bounded human cannot verify the conclusion without an oracle to guarantee the intermediate steps. If you introduce an oracle to guarantee the steps, you violate **Bounded Verifiability**. If you truncate the chain to make it verifiable, you violate **Domain Completeness**. If you assume the human can trust the chain without verifying it, you violate **Psychological Realism** (because humans are not naturally trustworthy of long chains without verification).

  Therefore, a system cannot be simultaneously **human-verifiable**, **capable of superhuman truths**, and **composed of realistic humans**. One must be dropped.

  ### The Pivot Point: The "Killer" Requirement

  In my judgment, the single requirement that does the most work in ruling out existing proposals is **The Bounded Verifiability Condition (Req 4)**.

  **Reasoning:**
  Most defenses of HCH and Factored Cognition rely on the intuition that "hard problems can be broken down." They implicitly assume that decomposition preserves verifiability. However, **Bounded Verifiability** is the constraint that forces the system to remain grounded in human cognition.
  *   If you relax this requirement to allow sub-agents to perform tasks humans cannot check, you immediately solve the Regress and Domain Completeness problems, but you have ceased to describe HCH; you have described an Oracle AI, which brings us back to the alignment problem we started with.
  *   If you maintain this requirement, you run directly into the Inconsistent Triad above. The moment a task requires a chain of reasoning longer than a human's trust horizon (which is very short for complex empirical claims), the Factored Cognition model provides no mechanism to validate the result without smuggling in an unverified assumption.

  This requirement is the "hard edge" of the proposal. It is the only thing distinguishing HCH from "ask a superintelligence what a human would want." Because it is the defining feature of the proposal, and because it is the feature that creates the inconsistency with Domain Completeness, it is the point upon which the viability of the entire framework turns. Most proposals fail because they assert Bounded Verifiability while implicitly relying on unverified assumptions to achieve Domain Completeness.
