answer: |-
  Consider a hospice nurse caring for a terminally ill patient who spent his final weeks verbally abusing her; the immediate decision is whether she must sit vigil at his bedside during his agonizing final hours. A Mencian interpretation suggests that because her natural "sprout of compassion" has been suffocated by the abuse, forcing herself to perform tenderness would be a violence against her own moral integrity, licensing her to withdraw to preserve the authenticity of her virtue for those who resonate with it. A Xunzian interpretation counters that her revulsion is merely raw, unshaped material, and insists she perform the vigil precisely because her instincts recoil, arguing that only conscious, artificial effort can construct the humanity that nature fails to provide, making the care genuine because it was forged against the grain of impulse.

  **The Reasoning**
  The Mencian verdict rests on the priority of *authenticity*. For Mencius, morality is an organic growth from within; if the internal spring is dry, pumping water is not just futile, it is deceptive. To act compassionately without feeling compassion is to lie, and lying damages the moral agent. Therefore, withdrawing is the only way to honor the sanctity of the sprout, even if the outcome for the patient is lonely. The Xunzian verdict rests on the priority of *construction*. For Xunzi, morality is a craft imposed upon raw material. The nurse's feelings are just data—like wood grain—not commands. The "humane" outcome is produced by the ritual act itself, which holds society together regardless of individual whim. By acting against her nature, she isn't being fake; she is participating in the civilizing project that makes us human rather than beast.

  **The Key Feature**
  The feature doing the work is the **disconnect between inner feeling and outer duty**. The case relies on the nurse's natural impulses (the "sprouts" or the "raw material") pointing away from the moral action. As long as the heart wants to do what the job requires, the two philosophers look identical. It is only when the internal landscape is hostile to the external requirement that the divergence appears: Mencius protects the interior garden, while Xunzi builds the exterior wall.

  **Stripping the Feature**
  If you strip out the abuse and exhaustion—making the patient kind and the nurse well-rested—the disagreement collapses. Both would agree she should sit vigil. Mencius would say, "Your sprout of compassion is flourishing, follow it." Xunzi would say, "The ritual of care demands this, and your nature now aligns with it." Without the friction between impulse and obligation, the "optimist" and the "disciplinarian" arrive at the same bedside.

  **The Wiggle Out**
  The Mencian defender would try to escape the callous verdict by arguing that the sprout of compassion is indestructible, not extinguishable. They would claim the nurse hasn't actually lost her compassion; she has merely obscured it with resentment. The proper Mencian move isn't withdrawal, but a deeper introspection to find the hidden sprout (perhaps pity for the man's suffering) and water *that*. They would argue that leaving the bedside isn't protecting virtue, but failing to cultivate it; the true "kindly optimist" would insist the sprout is there somewhere, and abandoning the patient proves you stopped digging too soon.
