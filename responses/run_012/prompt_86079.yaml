      *   *Xunzian Logic:* Human nature is raw. Feelings of revulsion are natural impulses. Ritual (professional ethics) requires we act contrary to impulse to maintain social order/humanity. We perform the care *because* it is hard, that is what makes it moral. (Humane: Patient cared for).
