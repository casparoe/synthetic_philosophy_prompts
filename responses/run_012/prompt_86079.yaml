      *   **Xunzi:** Human nature is raw material (desires, impulses). It isn't "evil" per se, but unchecked it leads to conflict/scarcity. Moral cultivation is *external* shaping through ritual (li), teachers, and conscious effort (wei). We need structure to become good.

  3.  **Brainstorming the Flip:**
