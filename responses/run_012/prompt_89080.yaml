answer: |-
  The epistemologists will argue that if inference cannot be justified by premises, it reduces to blind causation, and your only defense is to shift the locus of warrant from propositional acceptance to normative competence without explaining how competence avoids circularity.

  This objection targets your conclusion rather than your setup, forcing you to defend a negative claim (that justification projects are misbegotten) without a positive account of rationality that satisfies the demand for non-circular warrant. If you cannot explain how an act is rational without a justifying proposition, you leave the room with irrationalism; if you provide a justification, you restart the regress.

  ### Q&A Prep Sheet

  **1. The Epistemologists: "The Charge of Irrationalism"**
  *   **Objection:** "If you deny that modus ponens can be justified by premises the reasoner accepts, you're saying our most basic logical moves are arational causal pushes. How is this inference *rational* rather than just a habit we can't shake?"
  *   **Reply:** Rationality isn't always premise-driven; some competencies are constitutive of what it is to be a reasoner. Warrant here is internal to the practice, not external to it via a premise.
  *   **Soft Spot:** You lack a positive account of "constitutive competence" that doesn't sound like dogmatism. If pressed on *why* this competence is truth-conducive, you either beg the question or retreat to evolution/pragmatics, which undermines the a priori status.

  **2. The Normativity Person: "Norms as Propositions"**
  *   **Objection:** "You distinguish rules from premises, but norms are expressible as propositions (e.g., 'One ought to infer B from A'). Why isn't accepting that normative proposition enough to satisfy the Tortoise?"
  *   **Reply:** Accepting the normative proposition is still just another belief (state), not the act of inferring (performance). The 'ought' guides the act but doesn't constitute it.
  *   **Soft Spot:** She will argue that accepting the normative proposition *just is* the commitment to perform the act. If you deny this, you need a robust account of how one accepts a norm without being committed to acting on it, which is contentious.

  **3. The Proof Theorists: "Meta-Language Confusion"**
  *   **Objection:** "Your sequent calculus variant fails because you're treating a structural rule as an object-level sequent. The rule isn't in the system; it's how you use the system. The regress stops because the rule isn't available to be added."
  *   **Reply:** The Tortoise isn't confused about object vs. meta-language; she's asking why the meta-rule has authority. Writing it in sequent form doesn't explain why we move from premise-sequent to conclusion-sequent.
  *   **Soft Spot:** They are technically right that standard sequent calculus doesn't allow adding rules as lines. You risk looking like you're fighting a strawman unless you clarify the Tortoise is challenging the *authority* of the meta-rule, not its syntax.

  **4. The Wittgensteinian: "Triviality"**
  *   **Objection:** "This is just rule-following considerations dressed up. Rules bottom out in practice. What philosophical work is this diagnosis doing that wasn't done decades ago?"
  *   **Reply:** Carroll isolates the specific mechanism of the mistake (propositionalization) rather than just gesturing at 'practice'. It explains *why* we are tempted to add premises, not just that we shouldn't.
  *   **Soft Spot:** If pressed on the specific novelty, you might struggle to distinguish your "diagnosis" from standard quietism. You need to claim positive explanatory power about the structure of the regress, not just dissolution.

  **5. The Cognitive Scientist: "Psychological Irrelevance"**
  *   **Objection:** "Nobody actually reasons by consciously applying rules like modus ponens. Why does a regress about explicit rule-application matter for how reasoning works?"
  *   **Reply:** The puzzle is normative, not descriptive. It concerns what justifies inference, not how brains process information. Even if implicit, the authority structure remains.
  *   **Soft Spot:** If reasoning is entirely sub-personal, the "act of inferring" (your point iii) might not exist as a personal-level action you can analyze. You risk defending a folk-psychological notion of reasoning they reject.

  ### Concede Up Front
  *   Concede that the regress does not show logic is invalid or that deduction fails; it shows a limit on *explicit justification*.
  *   Concede that the proof theorists are right that natural deduction/sequent calculus avoids *writing* the rule as a premise, but maintain that this syntactic fix doesn't solve the philosophical problem of *authority*.
  *   Concede that at the bedrock, some circularity is inevitable; your claim is that this circularity is virtuous (constitutive) rather than vicious (premising).

  ### The Question You Hope Nobody Asks
  *   "If the act of inferring isn't guided by a representation of the rule, how do you distinguish a valid inference from a mere associative transition that happens to look like modus ponens?"
      *   *Why it hurts:* It forces you to explain the normativity of the act without appealing to the content of the rule, which is exactly the gap the epistemologists and normativity person are waiting to pounce on.
