      *   *Ship of Theseus:* Identity over time. If you replace all the planks (institutions, people, borders), is it the same ship? This addresses the "Latin turned into French" point. It suggests continuity of *function* or *identity* despite material change.
      *   *Complex Systems/Network Theory:* Maybe better than biology. Empires are networks of trade, loyalty, and logistics. They don't "die," they fragment or lose complexity (Tainter's *Collapse of Complex Societies*).

  4.  **Evaluate the "Inevitability" Claim (Request 4):**
      *   If biology is out, is determinism out?
