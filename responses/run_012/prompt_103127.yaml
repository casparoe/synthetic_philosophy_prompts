answer: |-
  The ink is dry upon the committee sheet,
  The evidence refuses to cohere.
  I count the voices in the quiet street,
  I cannot bear to end at death.

  The evidence refuses to cohere.
  Unless my good and the whole are made one.
  I cannot bear to end at death.
  Where reason finds no place to run.

  Unless my good and the whole are made one.
  The sittings pass like ghosts in glass.
  Where reason finds no place to run.
  And time allows no further pass.

  The sittings pass like ghosts in glass.
  The evidence refuses to cohere.
  And time allows no further pass.
  I cannot bear to end at death.

  ### what the form is doing

  The pantoum's circular structure mimics Sidgwick's intellectual trap: he cannot move forward, only around. The two refrains represent the Dualism of Practical Reason without naming it. Line B ("The evidence refuses to cohere") begins as methodological rigor, a scientist's caution. By the final stanza, surrounded by "ghosts" and expired time, it becomes an ache—the lament of a life's work yielding no comfort. Line D ("I cannot bear to end at death") begins as a private wish, almost a weakness. But by the end, following "time allows no further pass," it shifts from desire to necessity. It is no longer a hope he holds, but the only truth remaining. In free verse, these lines could be abandoned; here, the form forces them to return, just as Sidgwick was forced to return to the same unresolved problem until he died. The repetition enacts the stagnation of his conclusionless conclusion.
