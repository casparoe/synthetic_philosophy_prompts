answer: |-
  **Chapter One: The Criteria of Adequacy**

  Before we may adjudicate between competing accounts of self-deception, we must first agree upon what constitutes a successful account. The prevailing fragmentation in the literature—split between intentionalists, deflationists, eliminativists, and pretence theorists—suggests that the disagreement is not merely regarding the mechanics of the phenomenon, but regarding the criteria by which a theory is judged. Each camp tends to secure its own coherence by neglecting the cases central to its rivals. To avoid begging the question, we must lay out the desiderata explicitly. What follows is a catalogue of requirements that any adequate theory must satisfy, alongside an honest assessment of their negotiability and their mutual compatibility.

  ### I. Phenomenological Coverage

  A theory must account for the range of cases commonly labelled 'self-deception'. If a theory explains only a subset, it must justify why the remainder are misclassifications.

  **1. The Textbook Case (The Othello Constraint)**
  *   **The Case:** An individual sincerely avows a proposition (e.g., 'My spouse is faithful') despite possessing overwhelming evidence to the contrary, driven by a desire for the proposition to be true.
  *   **Requirement:** The theory must explain how the belief is acquired and maintained without the agent consciously acknowledging the counter-evidence.
  *   **Status:** *Non-negotiable.* This is the paradigm case; a theory that cannot explain this is not a theory of self-deception.

  **2. The Avowal-Conduct Split**
  *   **The Case:** A person avows confidence in their abilities but behaves in ways that betray deep-seated insecurity (e.g., procrastination, excessive reassurance-seeking).
  *   **Requirement:** The theory must accommodate the possibility that belief attribution relies on both speech and behaviour, and explain how these can diverge within a single agent.
  *   **Status:** *Non-negotiable.* It captures the opacity of the self to itself.

  **3. The Negative Case (The Depressive Constraint)**
  *   **The Case:** An individual believes themselves to be worthless or unlovable despite evidence of competence and affection from others.
  *   **Requirement:** The theory must explain self-deception that is *not* self-enhancing.
  *   **Status:** *Non-negotiable.* This is the primary failure point for pure 'wishful thinking' models. If self-deception is merely motivation bias towards the pleasant, this case becomes inexplicable.

  **4. The Socially Scaffolded Case**
  *   **The Case:** A group sustains a flattering falsehood (e.g., 'Our organisation is morally sound') that no single member would likely hold in isolation, maintained through silence and mutual reinforcement.
  *   **Requirement:** The theory must be scalable. It cannot rely solely on intrapsychic mechanisms if the deception is interpersonally distributed.
  *   **Status:** *Negotiable (with caution).* Some individualists argue this is merely aggregate individual self-deception. However, a theory that *cannot* accommodate social scaffolding is impoverished.

  **5. The Memory Distortion Case**
  *   **The Case:** An individual recalls a past event in a self-serving light without any awareness of manipulating the memory at the time of encoding or retrieval.
  *   **Requirement:** The theory must account for non-agential distortion. There is no moment of 'deciding' to deceive here.
  *   **Status:** *Non-negotiable.* It challenges the requirement for intention.

  **6. The Strategic Ignorance Case (The Borderline)**
  *   **The Case:** An individual suspects bad news (e.g., a medical test result) and deliberately chooses never to open the envelope.
  *   **Requirement:** The theory must distinguish between *avoiding* the formation of a belief and *holding* a false belief.
  *   **Status:** *Non-negotiable.* This marks the boundary between self-deception and mere ignorance.

  ### II. Conceptual Demarcation

  A theory must distinguish self-deception from neighbouring psychological phenomena. Collapsing these distinctions renders the concept useless.

  **7. Distinction from Weakness of Will (Akrasia)**
  *   **Consideration:** In akrasia, I believe I should not eat the cake, but I eat it. In self-deception, I believe the cake will not harm me.
  *   **Requirement:** The theory must distinguish between a failure of *action* against belief and a distortion of *belief* itself.
  *   **Status:** *Non-negotiable.*

  **8. Distinction from Wishful Thinking**
  *   **Consideration:** Wishful thinking may be a fleeting hope; self-deception involves a settled conviction.
  *   **Requirement:** The theory must explain the stability of the self-deceptive belief.
  *   **Status:** *Non-negotiable.*

  **9. Distinction from Self-Serving Bias**
  *   **Consideration:** Bias is a statistical tendency in attribution; self-deception is a specific state of an agent.
  *   **Requirement:** The theory must move from population-level heuristics to individual doxastic states.
  *   **Status:** *Negotiable.* Deflationists often argue self-deception *just is* biased assimilation. Intentionalists will reject this.

  **10. Distinction from Denial (Freudian)**
  *   **Consideration:** Denial often implies a complete rejection of reality at a conscious level, potentially without belief.
  *   **Requirement:** The theory must clarify whether the self-deceived person *believes* the falsehood or merely *acts as if* they do.
  *   **Status:** *Negotiable.* This depends on one's philosophy of belief.

  **11. Distinction from Lying to Others**
  *   **Consideration:** Interpersonal deception requires an audience distinct from the speaker.
  *   **Requirement:** The theory must explain how the 'deceiver' and 'deceived' can be the same entity without metaphorical collapse.
  *   **Status:** *Non-negotiable.* This is the core structural puzzle.

  ### III. Theoretical Constraints

  Finally, the theory must not violate established logical or empirical constraints.

  **12. The Belief Attribution Constraint**
  *   **Consideration:** We attribute beliefs based on a mixture of avowal and behaviour.
  *   **Requirement:** The theory cannot privilege avowal so heavily that it ignores conduct (or vice versa).
  *   **Status:** *Non-negotiable.*

  **13. The Constraint on Contradictory Beliefs**
  *   **Consideration:** It is logically impossible (or at least psychologically untenable) to hold outright contradictory beliefs ($p$ and $\neg p$) in the same respect at the same time.
  *   **Requirement:** The theory cannot posit that the agent simultaneously knows the truth and believes the falsehood in the same subsystem of the mind.
  *   **Status:** *Non-negotiable.* This is the 'Static Paradox'.

  **14. The Homunculus Constraint**
  *   **Consideration:** Explaining self-deception by positing a 'little person' inside the head who does the deceiving leads to an infinite regress.
  *   **Requirement:** The theory must explain the division of labour within the mind without invoking a homunculus.
  *   **Status:** *Non-negotiable.* This is the 'Dynamic Paradox'.

  **15. The Empirical Constraint**
  *   **Consideration:** Psychological findings on motivated reasoning and biased assimilation suggest much processing is unconscious.
  *   **Requirement:** The theory must be consistent with cognitive science regarding intention and awareness.
  *   **Status:** *Non-negotiable.* Philosophy of mind cannot ignore empirical psychology.

  ### IV. The Warning: Joint Unsatisfiability

  Here we arrive at the crux of the matter. It is my contention that a subset of these desiderata may be jointly unsatisfiable. Specifically, there is a profound tension between **The Textbook Case (1)**, **The Homunculus Constraint (14)**, and **The Constraint on Contradictory Beliefs (13)**.

  *   **The Conflict:** To satisfy the Textbook Case (where the agent seems responsible for the deception), we are tempted to posit an intention to deceive. However, to intend to deceive oneself, one must know the truth (to hide it). This violates the Constraint on Contradictory Beliefs (knowing $p$ and believing $\neg p$). To avoid the contradiction, we partition the mind. But if the partitions are agential enough to intend deception, we violate the Homunculus Constraint. If they are not agential, we lose the intuition of responsibility required by the Textbook Case.
  *   **The Implication:** If this triad is indeed inconsistent, then the 'real disagreement' you suspected is confirmed. The Intentionalists sacrifice the Homunculus Constraint (or bite the bullet on contradiction). The Deflationists sacrifice the intuition of Agency implicit in the Textbook Case. The Eliminativists sacrifice the phenomenon entirely.
  *   **Verdict:** This incompatibility is *Non-negotiable* in the sense that it cannot be wished away. A thesis must choose which horn of the trilemma to accept.

  ### V. The Exclusionary Requirement

  If I must identify the single requirement that does the most work in excluding popular theories, it is **The Negative Case (3)**.

  *   **Why:** The majority of historical and contemporary accounts (from Sartre to early Mele) model self-deception on the paradigm of *wish-fulfilment*. They define the phenomenon by the motivation to believe what is *pleasant*. The Negative Case (believing one is worthless against evidence) destroys this definition. It forces the theory to decouple self-deception from self-enhancement. Any theory that relies solely on 'desire for $p$' as the causal mechanism for 'belief that $p$' is immediately falsified by the depressive case. It forces the intentionalist to explain why one would intend to deceive oneself into misery, and the deflationist to explain what motivation is driving the bias if not pleasure.

  ### VI. Scorecard of the Camps

  Here is how the prevailing camps score against these desiderata prior to your adjudication.

  | Desideratum | Intentionalist (Partitionist) | Deflationist (Motivationalist) | Eliminativist | Pretence/Attention |
  | :--- | :--- | :--- | :--- | :--- |
  | **Textbook Case** | **Pass.** Captures the agency and deceit. | **Pass.** Captures the outcome via bias. | **Fail.** Denies the phenomenon exists. | **Pass.** Captures the 'as if' nature. |
  | **Negative Case** | **Fail.** Struggles to explain intent to suffer. | **Fail.** Struggles to explain non-wishful bias. | **Pass.** (Vacuously). | **Pass.** Can model negative pretence. |
  | **Avowal/Conduct** | **Pass.** Explained by partition. | **Pass.** Explained by conflicting dispositions. | **Fail.** | **Pass.** Pretence explains conduct split. |
  | **Social Case** | **Fail.** Too individualistic. | **Pass.** Bias scales socially. | **Pass.** | **Pass.** Social pretence is robust. |
  | **Memory Case** | **Fail.** Implies too much agency. | **Pass.** Fits unconscious processing. | **Pass.** | **Pass.** Attention fits well. |
  | **Strategic Ignorance**| **Pass.** Clear intention. | **Pass.** Avoidance is motivational. | **Fail.** | **Pass.** Attentional avoidance. |
  | **Vs. Akrasia** | **Pass.** Distinct mental states. | **Risk.** Often collapses into bias. | **Fail.** | **Pass.** Distinct attitude. |
  | **Vs. Lying** | **Risk.** Makes them too similar. | **Pass.** No intention in SD. | **Fail.** | **Pass.** Pretence $\neq$ Assertion. |
  | **Contradiction** | **Fail.** Risks simultaneous $p$ & $\neg p$. | **Pass.** No contradictory belief formed. | **Pass.** | **Pass.** No belief claimed. |
  | **Homunculus** | **Fail.** Risks little person in head. | **Pass.** No homunculus needed. | **Pass.** | **Pass.** No homunculus. |
  | **Empirical Fit** | **Fail.** Little evidence for partition. | **Pass.** Fits biased assimilation data. | **Pass.** | **Pass.** Fits attentional data. |

  **Summary of the Scorecard:**
  *   **Intentionalists** secure the phenomenology of agency and the Textbook Case but stumble badly on the Homunculus and Contradiction constraints, and struggle with the Negative Case.
  *   **Deflationists** secure the Empirical and Homunculus constraints but often fail to capture the *sense* of deceit in the Textbook Case and collapse under the Negative Case.
  *   **Eliminativists** are logically consistent but phenomenologically barren.
  *   **Pretence/Attention** theories offer a promising middle ground on the Contradiction constraint but risk changing the subject (is it really *deception* if there is no belief?).

  ### Conclusion for the Chapter

  This list serves not as a verdict, but as a map of the minefield. The subsequent chapters will not merely ask 'Which theory is true?' but 'Which of these non-negotiable constraints are we prepared to relax?' If the Joint Unsatisfiability warning holds, your thesis will not be a selection of the best theory, but a proposal for which paradox we ought to live with.
