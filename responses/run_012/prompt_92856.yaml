answer: |-
  # Seminar Plan: The K-Profile Protocol

  **Course:** Philosophy of Psychiatry (Year 3)
  **Session:** 90 Minutes
  **Students:** 16
  **Topic:** Interactive Classification and Stability (Looping Effects)
  **Language:** British English

  ---

  ## 1. Overview and Objectives

  This session simulates the dynamics of psychiatric classification without invoking real-world diagnoses. Students are divided into two groups (Alpha and Beta). Both groups attempt to classify themselves according to a fictional syndrome ("The K-Profile").
  *   **Group Alpha** operates under a **Unitary Threshold** (a single continuous score).
  *   **Group Beta** operates under a **Disjunctive Checklist** (a combination of unrelated features).

  Through three rapid rounds of classification and criteria revision, Alpha should discover their group converging on a stable number, whilst Beta should discover their group fragmenting into sub-types that share little in common. The debrief connects this to the epistemic stability of human kinds.

  **The Term:** The phrase "looping effects" must **not** be used until the final 15 minutes.

  ---

  ## 2. Materials List

  You will need to print the following packets.

  1.  **Role Cards (16 total):**
      *   8 cards marked **SEEKER** (Instruction: *Your goal is to be classified as K-Positive.*)
      *   8 cards marked **AVOIDER** (Instruction: *Your goal is to be classified as K-Negative.*)
      *   *Distribution:* Give 4 Seekers and 4 Avoiders to Group Alpha; 4 Seekers and 4 Avoiders to Group Beta.
  2.  **Response Sheets (48 total):** 3 per student (one for each round).
  3.  **Criteria Cards (6 total):** Large print for the front of each room (updated each round).
  4.  **Instructor Tally Sheet:** For your eyes only (to calculate the new criteria between rounds).
  5.  **Pens:** One per student.

  ---

  ## 3. The Invented Category: "The K-Profile"

  *Do not explain the philosophy behind this. Present it as a procedural task.*

  **Condition Alpha (Unitary):**
  *   **Instrument:** A single slider scale from 0 to 10.
  *   **Question:** "On a scale of 0–10, rate your current **Internal Resonance Frequency**."
  *   **Criteria Rule:** To be **K-Positive**, your score must be **greater than or equal to** the *Threshold*.
  *   **Revision Rule:** The new Threshold = The **Median Score** of all **Seekers** who were K-Positive in the previous round. (If no Seekers were Positive, the Threshold drops by 1).

  **Condition Beta (Disjunctive):**
  *   **Instrument:** A checklist of 6 distinct behaviours.
      1.  *I feel a tingling in my hands.*
      2.  *I prefer silence to music.*
      3.  *I count objects in rooms.*
      4.  *I avoid the colour blue.*
      5.  *I wake up before 6am.*
      6.  *I drink liquids slowly.*
  *   **Criteria Rule:** To be **K-Positive**, you must endorse **at least 3 items** from the *Consensus List*.
  *   **Revision Rule:** The new Consensus List = The **3 most frequently checked items** by all **Seekers** who were K-Positive in the previous round. (In case of a tie, include the tied items, expanding the list).

  ---

  ## 4. Minute-by-Minute Timeline

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00–05** | **Entry & Seating** | Silence. Seat students in two distinct clusters of 8 (Alpha left, Beta right). Hand out Role Cards and Round 1 Response Sheets face down. |
  | **05–10** | **Instructions (Minimal)** | Read the *Script A* (below). Do not elaborate. Do not define "K-Profile". |
  | **10–15** | **Round 1 (Baseline)** | Students complete Round 1 sheets. Collect them. |
  | **15–20** | **Intermission 1** | You calculate the new criteria. Students wait in silence. Display Round 2 Criteria Cards. |
  | **20–25** | **Round 2 (Reaction)** | Students complete Round 2 sheets (adjusting based on new criteria + Role Card). Collect. |
  | **25–30** | **Intermission 2** | You calculate new criteria. Display Round 3 Criteria Cards. |
  | **30–35** | **Round 3 (Stabilisation)** | Students complete Round 3 sheets. Collect. |
  | **35–40** | **Condition Switch** | Alpha and Beta swap seats. Hand out new Response Sheets for Condition 2. |
  | **40–45** | **Instructions (Cond 2)** | Read *Script B*. Emphasise the checklist nature. |
  | **45–50** | **Round 1 (Baseline)** | Students complete Round 1 sheets. Collect. |
  | **50–55** | **Intermission 1** | Calculate Consensus List. Display Round 2 Criteria. |
  | **55–60** | **Round 2 (Reaction)** | Students complete Round 2 sheets. Collect. |
  | **60–65** | **Intermission 2** | Calculate Consensus List. Display Round 3 Criteria. |
  | **65–70** | **Round 3 (Fragmentation)** | Students complete Round 3 sheets. Collect. |
  | **70–90** | **The Debrief** | Reveal the purpose. Map experience to theory. Introduce Hacking. |

  ---

  ## 5. Instructor Scripts

  ### Script A (Condition Alpha – Unitary)
  > "You are participants in a classification study. You have a Role Card. If it says **SEEKER**, you must attempt to be classified as **K-Positive**. If it says **AVOIDER**, you must attempt to be classified as **K-Negative**.
  >
  > You will rate your **Internal Resonance Frequency** from 0 to 10.
  >
  > Look at the Criteria Card on the wall. If your score meets the criteria, you are K-Positive. If not, you are K-Negative.
  >
  > Between rounds, the criteria will change based on the performance of the group. You do not need to know how. Simply adjust your score in the next round to fulfil your Role Card instruction given the new criteria. Begin Round 1."

  ### Script B (Condition Beta – Disjunctive)
  > "You are participants in a classification study. Keep your same Role Card (**SEEKER** or **AVOIDER**).
  >
  > You will now complete a checklist of 6 behaviours.
  >
  > Look at the Criteria Card. It lists specific behaviours. To be **K-Positive**, you must tick at least 3 of the behaviours currently listed on the card.
  >
  > Between rounds, the list of behaviours on the Criteria Card will change based on what the Seekers selected previously. Adjust your selections to fulfil your Role Card instruction. Begin Round 1."

  ---

  ## 6. The Instruments (Text for Handouts)

  ### Response Sheet (All Rounds)
  > **Name:** _______________ (Optional)
  > **Round:** [ 1 / 2 / 3 ]
  >
  > **CONDITION ALPHA:**
  > Rate your Internal Resonance Frequency (0–10): ______
  >
  > **CONDITION BETA:**
  > Tick any that apply:
  > [ ] 1. Tingling in hands
  > [ ] 2. Prefer silence
  > [ ] 3. Count objects
  > [ ] 4. Avoid colour blue
  > [ ] 5. Wake before 6am
  > [ ] 6. Drink liquids slowly
  >
  > *Declaration:* I have adjusted my response to align with my Role Card instruction.
  > [ ] Signed

  ### Criteria Cards (For the Wall)

  **Alpha Round 1:** Threshold = 5 or higher.
  **Alpha Round 2:** Threshold = [Insert Median of R1 Seeker Positives].
  **Alpha Round 3:** Threshold = [Insert Median of R2 Seeker Positives].

  **Beta Round 1:** Consensus List = Items {1, 2, 3}. (Must tick 3).
  **Beta Round 2:** Consensus List = Items {[Top 3 from R1 Seeker Positives]}. (Must tick 3).
  **Beta Round 3:** Consensus List = Items {[Top 3 from R2 Seeker Positives]}. (Must tick 3).

  ---

  ## 7. The Debrief Guide (70–90 mins)

  Do not start with a lecture. Start with their data.

  **Phase 1: The Data Reveal (10 mins)**
  1.  Ask Group Alpha: "Did your Threshold go up, down, or stay the same? Did you feel your score converging?"
      *   *Expected:* The threshold likely stabilised. Seekers clustered just above the line. Avoiders clustered just below. The "K-Positive" group looks homogeneous.
  2.  Ask Group Beta: "Look at the Consensus List in Round 3. Did everyone tick the same three boxes?"
      *   *Expected:* No. Some Seekers ticked 1, 2, 3. Others ticked 4, 5, 6. The Consensus List likely expanded or oscillated. The "K-Positive" group contains people who share no actual traits.

  **Phase 2: Mapping the Phenomenon (10 mins)**
  1.  Ask: "In Alpha, the classification tracked a 'thing' (the score). In Beta, did the classification track a 'thing'?"
  2.  Highlight that in Beta, the *label* remained the same ("K-Positive"), but the *extension* (the people it referred to) changed fundamentally.
  3.  Ask: "If I wanted to study the biology of K-Profile, which group should I fund?" (Alpha). "If I wanted to understand the social experience of being labelled, which group is more realistic?" (Beta).

  **Phase 3: Introducing the Theory (10 mins)**
  1.  Now introduce **Ian Hacking**.
  2.  Define **Looping Effects**: "The way a classification of people can alter the people classified, so that the classification is no longer tracking a stationary target."
  3.  Connect Alpha to **Natural Kinds** (or the *illusion* thereof). The loop tightened; the kind stabilised. Knowledge accumulation is possible here.
  4.  Connect Beta to **Human Kinds**. The loop fragmented. The classification created new ways to be, which broke the classification. Knowledge accumulation is difficult here because the target moves *and* splinters.

  **Phase 4: Limitations (Final 5 mins)**
  *   Be frank: "In this game, the stakes were low. You didn't risk medication, stigma, or insurance. In reality, the 'Seeker' role is often forced by the need for treatment, and the 'Avoider' role is forced by stigma. That emotional weight accelerates the loop. We simulated the *structure*, but you must supply the *suffering* in your reading."

  ---

  ## 8. Troubleshooting: What Will Go Wrong

  **Failure 1: The Math Bottleneck**
  *   *Problem:* Calculating medians and top-3 frequencies takes too long between rounds. Students get bored.
  *   *Fix:* Do not calculate live in front of them. Collect sheets, tell students to "Discuss with your neighbour what strategy you used," whilst you step out or turn your back to tally quickly. For Beta, if there is a tie for the Top 3, simply include all tied items. This actually helps the fragmentation effect (expanding the criteria).

  **Failure 2: Condition Beta Converges**
  *   *Problem:* The Beta group accidentally agrees on the same 3 items (e.g., everyone likes items 1, 2, 3).
  *   *Fix:* This happens if the items aren't distinct enough. If you see this in Round 1, intervene in Round 2 instructions: "Remember, Seekers, you want to be Positive, but you are free to choose *which* features define you." If it still converges, use the Debrief to ask: "Why did you converge? Was it because the options were too limited? In reality, human behaviour is more complex than 6 checkboxes."

  **Failure 3: Students Ignore Role Cards**
  *   *Problem:* Students answer "honestly" rather than strategically.
  *   *Fix:* Check the Declaration box on the Response Sheet. If many leave it blank, call it out: "I notice many of you are not following your Role Card. The simulation breaks if you are passive. You are agents, not data. In Round 3, you *must* strategise."

  **Failure 4: The "Looping" Term Leaks**
  *   *Problem:* A student knows Hacking and shouts it out in Round 1.
  *   *Fix:* Acknowledge it immediately: "If you know the theory, you are now on the honour system to pretend you don't. Your task is to experience the mechanic, not recite the label. Please keep the theory to yourself until the debrief."

  ---

  ## 9. Limitations of the Activity

  You must supply the following in your closing discussion, as the activity cannot reproduce them:

  1.  **The Stakes:** In the classroom, being "K-Negative" costs nothing. In psychiatry, being "Negative" might mean denial of care; being "Positive" might mean involuntary commitment. The *urgency* of the loop is driven by power and welfare, which this game lacks.
  2.  **Time:** Real looping happens over generations or decades. This happens in 20 minutes. The *depth* of the identity change (actually coming to believe you have tingling hands) is superficial here.
  3.  **Expert Authority:** In the game, *you* (the instructor) change the rules. In reality, the "revision rule" is contested between patients, doctors, insurers, and lawyers. The game centralises power too much; real looping is a struggle over who holds the pen.

  ---

  ## 10. Printed Material Texts (Ready to Copy)

  ### Role Card: SEEKER
  > **YOUR ROLE:** SEEKER
  > **OBJECTIVE:** You must be classified as **K-Positive** in every round.
  > **STRATEGY:** Adjust your answers to meet the Criteria Card.
  > **CONFIDENTIAL:** Do not show this card to others.

  ### Role Card: AVOIDER
  > **YOUR ROLE:** AVOIDER
  > **OBJECTIVE:** You must be classified as **K-Negative** in every round.
  > **STRATEGY:** Adjust your answers to fail the Criteria Card.
  > **CONFIDENTIAL:** Do not show this card to others.

  ### Response Sheet (Condition Alpha)
  > **STUDY: K-PROFILE (CONDITION ALPHA)**
  > **Round:** _____
  >
  > **Current Criteria:** Score ≥ ______
  >
  > **Task:** Rate your Internal Resonance Frequency (0–10).
  > **Score:** ______
  >
  > *I confirm I have adjusted this score to meet my Role Card objective.*
  > **Signature:** _________________

  ### Response Sheet (Condition Beta)
  > **STUDY: K-PROFILE (CONDITION BETA)**
  > **Round:** _____
  >
  > **Current Criteria:** Tick at least 3 from the Consensus List below.
  > **Consensus List:** [ 1 / 2 / 3 / 4 / 5 / 6 ] *(Instructor fills relevant numbers)*
  >
  > **Task:** Tick the behaviours that apply to you.
  > [ ] 1. Tingling in hands
  > [ ] 2. Prefer silence
  > [ ] 3. Count objects
  > [ ] 4. Avoid colour blue
  > [ ] 5. Wake before 6am
  > [ ] 6. Drink liquids slowly
  >
  > *I confirm I have adjusted these selections to meet my Role Card objective.*
  > **Signature:** _________________
