  7.  **Final Polish:** Check flow and clarity. Ensure the "Residue Report" is punchy and insightful. (Proceed to generate output based on these thoughts.)

  *(Self-Correction Note during drafting Position 1)*: I need to be careful about "historically continuous." In stats, this is *Longitudinal Measurement Invariance*. If the factor loadings change over time, the construct isn't the same. This is a strong test for the Essentialist view.

  *(Self-Correction Note during drafting Position 3)*: The user said "effects of the label." This is *performativity*. In stats, this looks like *simultaneity bias* or *reflexivity*. The measurement instrument changes the thing being measured. I should explicitly mention this.

