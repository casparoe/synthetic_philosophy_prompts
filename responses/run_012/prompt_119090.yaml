      *   **Residue Report:**
          *   *What's missing?* Normativity (values prescribe, stats describe), Teleology (direction of history), Agency (who is doing the labeling).
          *   *Why?* Stats is ontologically flat (variables are variables). Humanities deals with meaning and intent.
          *   *Verdict:* Both. Stats lacks semantic depth; Humanities often lacks operational clarity.

  4.  **Refining the Vocabulary:**
