      *   Make sure the distinction between *causal indicators* (formative) and *effect indicators* (reflective) is clear, as this is central to the user's worry about "effects of the label."
      *   Address the specific worry: "indicators... might be effects of the label rather than measures of a latent thing." This sounds like *reactivity* or *performativity*, which maps to endogeneity in stats.

