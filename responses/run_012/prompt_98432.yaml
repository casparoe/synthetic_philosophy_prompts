answer: |-
  There is no single canonical name for this exact structure, but it sits at the intersection of three distinct literatures: **Homuncular Functionalism** (philosophy of mind), **Iterated Amplification** (AI alignment), and **Predicative Hierarchies** (logic/type theory).

  To give you the "carving" you requested: this structure is best understood as a **Predicative Deliberative Hierarchy**. It is distinct from standard recursion because it enforces a *capacity gradient* rather than mere task decomposition, and it is distinct from foundationalism because the "bottom" is fluid rather than fixed.

  Here is the detailed breakdown of what this is, what it is not, and where its edges lie.

  ### 1. The Nearest Existing Names

  **A. Homuncular Functionalism (Philosophy of Mind)**
  The closest philosophical ancestor is Daniel Dennett's solution to the "Homunculus Fallacy."
  *   **The Match:** Dennett argues that to explain intelligence without magic, you must decompose a smart agent into sub-agents that are *stupider* than the parent, recursively, until you bottom out in mindless mechanisms. Your description ("consulting a version of herself who knows a little less") is precisely the homuncular requirement: the sub-agents must be strictly less capable to avoid an infinite regress of intelligence.
  *   **The Divergence:** Dennett uses this as an *explanatory* model for how the mind works (competence without comprehension). You are proposing it as a *normative* or *idealized* model of how deliberation *should* proceed to solve hard questions.

  **B. Iterated Amplification / HCH (AI Safety)**
  The closest technical implementation is Paul Christiano's **Iterated Distillation and Amplification (IDA)**, specifically the **HCH (Humans Consulting HCH)** idealization.
  *   **The Match:** In HCH, an agent answers a question by breaking it into sub-questions and asking copies of itself to answer them. The goal is to build a "stronger" agent from an army of "weaker" (or time-bounded) agents.
  *   **The Divergence:** Standard HCH often assumes the sub-agents are *identical* humans with *less time*. Your model stipulates they are *strictly weaker* (less knowledge/capacity). This aligns more closely with the **Amplification** step in IDA, where a strong agent is defined by its ability to coordinate weak agents.

  **C. Predicative Hierarchies (Logic)**
  The mathematical structure underlying your "strictly weaker" constraint is **Predicativity**.
  *   **The Match:** In standard recursion, a function is defined in terms of itself (impredicative). In your model, Level $N$ is defined in terms of Level $N-1$. This mirrors **Ramified Type Theory** (Russell), where a set of type $N$ can only contain sets of type $N-1$. This constraint exists specifically to prevent paradoxes and circularity.
  *   **The Divergence:** Type theory is static; your model is a dynamic process of inquiry.

  ### 2. The Carving: What It Is and Is Not

  To distinguish this from nearby concepts, we must look at the constraints you specified.

  **Vs. Standard Recursive Decomposition**
  *   **Standard Recursion:** $f(x)$ calls $f(y)$. The capability of the function is constant; only the input size changes.
  *   **Your Model:** $Agent_{capacity}(x)$ calls $Agent_{capacity-\delta}(y)$.
  *   **The Edge:** This distinction is vital. In standard recursion, if the base case is unreachable, you get a stack overflow (infinite loop). In your model, if the capacity degradation outpaces the difficulty reduction, the process "fizzles out" (the agent simply cannot answer). The termination condition is not depth, but the **intersection of difficulty and capacity**.

  **Vs. Bounded Rationality**
  *   **Bounded Rationality (Simon):** Focuses on *satisficing*. You stop searching when the cost of further search exceeds the expected benefit.
  *   **Your Model:** Focuses on *structural decomposition*. You don't stop because it's "too costly"; you stop because the question has become simple enough for the current capacity.
  *   **The Edge:** Bounded rationality is a constraint on the *outcome* (good enough). Your model is a constraint on the *architecture* (how the reasoning is constructed).

  **Vs. Foundationalism**
  *   **Foundationalism:** Beliefs are justified by tracing them back to indubitable "basic beliefs" (sense data, axioms).
  *   **Your Model:** There is "no privileged base." The bottom is wherever the question becomes easy *relative to the agent*.
  *   **The Edge:** This is a form of **Coherentism** structured hierarchically. Justification comes from the consistency of the tree, not the certainty of the leaves.

  ### 3. The Coherence Problem (The "Edge")

  You asked specifically about the idealization's coherence when **sub-questions are not independent**. This is the critical stress point of the structure.

  **The Problem:**
  If Level $N$ asks Question A and Question B, and both rely on Fact X, Level $N-1$ agents might answer A and B correctly based on their local understanding of X. However, if A and B have hidden tensions regarding X that require a broader context to resolve, the Level $N-1$ agents (being strictly weaker) cannot see the conflict.
  Level $N$ must then reconcile them. But if Level $N$ is only *marginally* stronger than Level $N-1$, it may lack the capacity to detect the inconsistency that the weaker agents created.

  **Where Existing Ideas Break:**
  *   **In HCH/Amplification:** This is known as the **Alignment/Consistency Problem**. If the weak agents are not perfectly aligned or if they lack context, the strong agent amplifies their errors. Current research suggests you need a **verification mechanism** (a "critic") that operates at the same level as the decomposer to check for global consistency.
  *   **In Homuncular Functionalism:** This is the **Frame Problem**. How do the dumb sub-agents know which facts are relevant to the whole without knowing the whole?

  **The Verdict on Coherence:**
  Your idealization remains coherent *only if* the decomposition preserves **informational locality**.
  1.  **Independent Sub-questions:** The model holds.
  2.  **Dependent Sub-questions:** The model requires that the "strictly weaker" constraint allows for enough overhead to manage dependencies. If the parent agent spends all its extra capacity answering its own direct question, it cannot reconcile the children.
  3.  **The Fix:** The structure implicitly requires that the "extra capacity" at Level $N$ (compared to Level $N-1$) is reserved not for answering the question directly, but for **integration and consistency checking**. If you remove that, the hierarchy collapses into contradictory silos.

  ### 4. Proposed Naming

  Since you are looking for whether it needs to be coined:

  *   **If emphasizing the philosophical lineage:** Call it **Degraded Homuncular Deliberation**.
  *   **If emphasizing the logical structure:** Call it a **Predicative Query Hierarchy**.
  *   **If emphasizing the cognitive process:** Call it **Capacity-Graded Recursion**.

  However, the most precise description of the *structure* you described is **Predicative Amplification**.
  *   **Predicative:** Because each level relies only on strictly weaker levels (avoiding circularity/self-reference).
  *   **Amplification:** Because the top level achieves a result that the bottom levels could not achieve alone (emergent capability).

  ### Summary of the Carving

  *   **What it is:** A method of solving problems by decomposing them into sub-problems solvable by agents of strictly diminishing capacity, terminating when problem difficulty matches agent capacity.
  *   **What it is not:** It is not standard recursion (capacity is not constant). It is not foundationalism (the base is not fixed). It is not standard bounded rationality (it is structural, not just economic).
  *   **Where the edge is:** The model breaks if the **dependency graph** of the sub-questions is denser than the **capacity gradient** of the agents. If the children share hidden dependencies that require more capacity to resolve than the parent possesses, the idealization fails. This implies the "strictly weaker" constraint must be calibrated: the parent must be weak enough to require help, but strong enough to integrate the help.

  This structure is a rigorous formalization of "thinking it through" that avoids the homunculus fallacy while acknowledging cognitive limits. It is a robust idealization, provided the integration cost does not exceed the capacity gain at each level.
