      *   *Wait, simpler path:* The distinction is about *Agency*. Persuasion enhances agency (gives reasons). Manipulation circumvents agency (uses levers). The Doctor case shows that sometimes circumventing agency is benevolent, but it's still circumventing agency. The distinction holds; the *condemnation* varies.
