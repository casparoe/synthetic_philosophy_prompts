prompt: |-
  I help run a small volunteer heritage group in a town of about nine thousand people: we maintain a walking tour, a modest house museum, and a website where we publish short profiles of people and episodes from the town's past — a mill owner, a doctor, a suffragist, the family that ran the tannery, and so on. There are six of us, none of us a trained historian, and we put out roughly two profiles a month; the finished text is voted on by the whole group and then goes on a public website that school groups use, so whatever we print we have to be able to defend to a stranger and to each other. Lately every profile turns into the same argument, and it is starting to stall us. Some of us want the writing to say plainly when someone did something we would now call cruel or unjust — the mill owner who used child labour, the doctor who experimented on poor patients — and to name it in our own vocabulary, because otherwise the profiles read as flattering and the visiting classes get a sanitised story. Others of us say you cannot judge people by the standards of our time, that this is arrogant and anachronistic, and that a profile should describe what people did and believed without passing sentence. I have come to think both sides are talking past each other, partly because the phrase the standards of their time is doing far too much work — it makes it sound as though everyone in a given decade thought alike, when there were almost always people then who objected — and partly because we keep sliding between at least four different things: describing the past in present-day words and categories (was this child labour, or just children helping at the mill?), holding someone to present moral standards, actually blaming and condemning them as a person, and telling the story as though it were simply a march toward us.

  I would like you to turn this into a procedure our writers can actually run on their own, in an evening, without a history degree — something closer to a checklist than an essay. Give me the questions to ask in order, what would count as a sufficient answer to each, the point at which the procedure stops and simply forbids us from making a particular claim, and the point at which it must hand the decision to a person because what remains is a judgement about values rather than a question about the past. Please build in the two tests I keep reaching for and never quite get right: first, whether the person lived up to standards they themselves professed, or whether there were people around them saying at the time that it was wrong; and second, whether the criticism would survive being applied to us by whoever comes next, given that some of what we now take for granted will look monstrous later. Then run the procedure on three cases so I can see how it behaves — the mill owner who employed children, the doctor who experimented on his patients, and one I care about where I suspect it will tell me something I do not want to hear: the town's celebrated benefactor, who gave us the library and the park and, it turns out, made his money in a way our own stated values should condemn. Tell me where it lands on each, which of the three is the genuine borderline, and, honestly, what the procedure cannot do — the parts that will still be argued about no matter how carefully we follow it, and the ways a tidy checklist of this kind could give us false confidence or quietly let us off the hook.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Volunteer heritage group member (6 people, no trained historians).
      *   **Task:** Create a decision-making procedure/checklist for writing historical profiles.
      *   **Conflict:** Tension between "presentism" (judging past by current morals) and "relativism" (never judging past actions).
      *   **Key Insight:** The phrase "standards of their time" is too vague; there were always dissenters. There's a conflation of description, moral judgment, blame, and teleology.
      *   **Requirements:**
          *   Step-by-step procedure (checklist style).
          *   Questions in order.
          *   Criteria for sufficient answers.
          *   Stop points (forbidden claims).
          *   Hand-off points (value judgments).
          *   Incorporate two specific tests:
              1.  Internal/Contemporary Standards (Did they violate their *own* stated values or contemporary dissenters?).
              2.  Future-Proofing (Would this criticism survive being applied to *us* by the future?).
          *   Run the procedure on three cases:
              1.  Mill Owner (Child Labor).
              2.  Doctor (Experimentation on poor patients).
              3.  Benefactor (Philanthropy funded by condemned means).
          *   Identify the genuine borderline case.
          *   Honest assessment of limitations (what the checklist *can't* do, false confidence risks).

  2.  **Deconstruct the Conflict & Develop the Procedure:**
      *   *Goal:* Move from "Is this bad?" to "How do we describe this accurately and ethically?"
      *   *Step 1: Fact Verification.* (Basic history). What actually happened?
      *   *Step 2: Contemporary Context.* (The "Standards of Their Time" test). Was this normal? Was it contested *then*?
      *   *Step 3: Internal Consistency.* (The "Hypocrisy" test). Did they violate their own professed values?
      *   *Step 4: Present Description.* (Vocabulary). Can we use modern terms (e.g., "child labor") if defined?
      *   *Step 5: Future-Proofing.* (The "Humility" test). Will our judgment look arrogant later?
      *   *Step 6: The Verdict.* (Blame vs. Description). Where do we draw the line on condemnation?

      *Refining the Steps:*
      *   Need to distinguish between *describing* an act as harmful vs. *condemning* the person as evil.
      *   Need to ensure the "Stop Points" are clear. If evidence is missing, stop.
      *   Need to ensure the "Hand-off" is clear. If it's purely a value judgment, the group votes, but the checklist frames the vote.

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Drafting Step 1 (Facts):* Keep it simple. Do we have sources?
      *   *Drafting Step 2 (Contemporary Dissent):* This addresses the user's insight that "everyone thought alike" is false. If there were critics *then*, we can quote them.
      *   *Drafting Step 3 (Internal Standards):* Did they break their own rules? This is a strong justification for criticism.
      *   *Drafting Step 4 (Modern Labels):* Can we call it "exploitation"? Yes, if defined.
      *   *Drafting Step 5 (Future Test):* This is the humility check.
      *   *Drafting Step 6 (Wording):* How to phrase the final text.

      *Refining the "Stop" and "Hand-off":*
      *   *Stop:* If we can't prove the fact, or if we can't prove contemporary dissent when claiming "universal condemnation."
      *   *Hand-off:* When deciding the *tone* of the conclusion. The checklist informs the vote, but doesn't replace it.

  4.  **Running the Cases:**

      *   **Case 1: Mill Owner (Child Labor).**
          *   *Facts:* Children worked long hours.
          *   *Contemporary:* Were there laws? Reformers? (Likely yes, late 19th/early 20th century).
          *   *Internal:* Did he claim to be a Christian benefactor?
          *   *Future:* Will future see wage labor as exploitation? Maybe. But child labor is pretty universally condemned now *and* was contested then.
          *   *Verdict:* Safe to describe as exploitative, citing contemporary critics.

      *   **Case 2: Doctor (Experimentation).**
          *   *Facts:* Experimented on poor without consent.
          *   *Contemporary:* Medical ethics were looser, but was there *no* concept of consent? Hippocratic oath?
          *   *Internal:* Did he claim to "do no harm"?
          *   *Future:* Medical ethics change, but bodily autonomy is a strong trajectory.
          *   *Verdict:* Borderline. Harder to prove contemporary dissent if it was standard practice, but the "poor patients" angle suggests class exploitation which might have been noted then.

      *   **Case 3: Benefactor (Tainted Money).**
          *   *Facts:* Gave library/park. Money from [something bad, e.g., slum housing, arms, opium?]. Let's assume Slum Housing/Exploitative Rent.
          *   *Contemporary:* Was slum housing criticized then? Yes, housing reformers existed.
          *   *Internal:* Did he claim to be a "pillar of the community"?
          *   *Future:* Philanthropy vs. Source of Wealth is a perennial tension.
          *   *Verdict:* This is the hardest. It challenges the group's reliance on his gifts.

      *   *Selecting the Borderline:* The Doctor is often the most ethically complex regarding "standards of the time" (medical ethics evolved). The Benefactor is emotionally complex. The prompt asks for the "genuine borderline." Usually, the Doctor case is the trickiest regarding *professional norms* of the past vs. universal human rights. However, the Benefactor case hits the "values" hand-off hardest. Let's look closer. The Mill Owner is usually clear-cut (child labor laws existed). The Doctor is tricky because "experimentation" was often standard care then. The Benefactor is tricky because it implicates the *present* group (using his library).
      *   *Decision:* The Doctor is the methodological borderline (what counts as ethics then?). The Benefactor is the *emotional* borderline. I will identify the Doctor as the methodological borderline because it tests the "standards of the time" most rigorously. Actually, re-reading the prompt: "one I care about where I suspect it will tell me something I do not want to hear." This implies the Benefactor is the emotional sticking point. I will identify the **Doctor** as the genuine *procedural* borderline (hardest to source contemporary dissent), but acknowledge the Benefactor is the *institutional* challenge. Wait, the prompt asks "which of the three is the genuine borderline." I need to pick one. The Doctor case usually hinges on whether "informed consent" existed as a concept. If it didn't, judging him is presentism. If it did, it's not. That makes it the borderline for the *procedure*. The Benefactor is a value judgment on *us*. I'll stick with the Doctor as the procedural borderline.

  5.  **Addressing Limitations:**
      *   Checklists create false objectivity.
      *   Sourcing bias (who wrote the contemporary dissent?).
      *   The "Future Test" is speculative.
      *   It doesn't solve the "tone" problem, only the "truth" problem.

  6.  **Refining the Tone:**
      *   Needs to be practical, respectful of the volunteers' effort, and intellectually honest.
      *   Avoid academic jargon.
      *   Structure clearly with boxes or bold text for the checklist.

  7.  **Final Review against Constraints:**
      *   Checklist format? Yes.
      *   Questions in order? Yes.
      *   Sufficient answers defined? Yes.
      *   Stop/Hand-off points? Yes.
      *   Two specific tests included? Yes (Contemporary/Internal & Future).
      *   Three cases run? Yes.
      *   Limitations discussed? Yes.

      *(Self-Correction during drafting)*: Make sure the "Future Test" isn't just "will we look bad?" but "is this a universal value or a cultural fashion?"
      *(Self-Correction on Benefactor)*: Ensure the procedure doesn't just say "cancel him." It's about *description*. The profile must mention the source of wealth if it contradicts the benefit.

      *(Final Polish)*: Ensure the distinction between "condemning the person" and "describing the harm" is clear in the output section.

  8.  **Drafting the Content:** (Mental outline of the response)
      *   Introduction: Acknowledge the difficulty and validity of their position.
      *   The Procedure: "The Heritage Group Ethical Checklist."
      *   Step 1: Evidence.
      *   Step 2: Contemporary Contestation (Test 1).
      *   Step 3: Internal Consistency (Test 1b).
      *   Step 4: Modern Vocabulary.
      *   Step 5: Future Humility (Test 2).
      *   Step 6: The Verdict (Hand-off).
      *   Application to Cases.
      *   Limitations/Honesty section.

      *Let's refine the "Stop" points.* If Step 1 fails, no profile. If Step 2 fails (no evidence of contemporary dissent), you can't claim "everyone knew it was wrong." You have to soften the claim.
      *Let's refine the "Hand-off".* Step 6 is where the group votes on the *tone* based on the previous answers.

      *Okay, ready to write.*
answer: |-
  This is a mature dilemma. You have correctly identified that "standards of their time" is often a shield for laziness, but also that moral condemnation without context is bad history. The goal of this procedure is not to generate a verdict of "Guilty" or "Innocent," but to generate a text that is *defensible* on both historical and ethical grounds.

  Below is the **Heritage Profile Protocol**. It is designed to be printed and sat with during your drafting sessions. Following the protocol are the three test cases and an honest assessment of where the tool fails.

  ***

  # The Heritage Profile Protocol

  **Instructions:** Complete this sheet for every profile draft. If you cannot answer a question satisfactorily, you must either find more evidence or alter the text to match the evidence. Do not skip steps.

  ### Phase 1: The Facts (Stop Point)
  **Q1: What specific act are we describing?**
  *   *Sufficient Answer:* A concrete, sourced action (e.g., "Employed 14 children under age 12," not "Was a harsh employer").
  *   *Insufficient Answer:* General reputation, hearsay, or vague adjectives.
  *   **STOP:** If you cannot source the specific act, do not publish the claim.

  **Q2: What was the legal or regulatory status of this act then?**
  *   *Sufficient Answer:* "Legal," "Illegal but unenforced," or "Unregulated."
  *   **STOP:** If you claim it was illegal, you must cite the specific law or bylaw.

  ### Phase 2: The Contemporary Test (The "Standards of Their Time" Check)
  *This tests whether the act was universally accepted or contested **at the time**.*

  **Q3: Was there organized dissent against this act when it happened?**
  *   *Sufficient Answer:* Yes (cite a newspaper editorial, a reformer, a union, a church group, or a court case from that decade) OR No (evidence suggests general acceptance).
  *   **Constraint:** You cannot claim "everyone knew it was wrong" unless you have evidence of people *saying* it was wrong at the time.
  *   **If YES:** You may use strong moral language (e.g., "exploitative," "unethical") provided you attribute the criticism to the contemporary dissenters (e.g., "Critics at the time labelled this...").
  *   **If NO:** You must describe the harm without implying universal contemporary condemnation (e.g., "By modern standards, this is considered..." or "This resulted in...").

  **Q4: Did the subject violate their own professed values?**
  *   *Sufficient Answer:* Evidence of the subject's stated beliefs (church membership, public speeches, diary entries) that contradict their actions.
  *   **If YES:** You may highlight the contradiction as a matter of historical record (e.g., "Though he professed X, his actions Y...").
  *   **If NO:** Avoid framing the profile as a story of hypocrisy.

  ### Phase 3: The Vocabulary Check
  *This tests whether we are using modern categories accurately.*

  **Q5: Are we using a modern term (e.g., "child labour," "sexual harassment," "genocide")?**
  *   *Sufficient Answer:* Yes, but the term is defined in the text OR No, we are using period-appropriate language.
  *   **Requirement:** If using a modern term, you must briefly contextualize it. (e.g., "What we would now call child labour, then described as 'mill hands'...").
  *   **STOP:** Do not use modern diagnostic or legal terms (e.g., "psychopath," "felon") if those categories did not exist then, unless clearly qualified.

  ### Phase 4: The Future Test (The Humility Check)
  *This tests whether our judgment is likely to age poorly.*

  **Q6: If people in 100 years judge us by the standards of their time, will this criticism still hold?**
  *   *Sufficient Answer:* A group consensus on whether the value is **Universal** (bodily autonomy, freedom from torture) or **Cultural** (dietary habits, specific economic models).
  *   **Hand-off Point:** If the value is **Cultural**, you cannot present your judgment as objective truth. You must frame it as "From our current perspective..."
  *   **If Universal:** You may state the harm as objective (e.g., "This caused physical suffering").

  ### Phase 5: The Verdict (Value Hand-off)
  *The checklist ends here. The remaining decision is a value judgment, not a historical one.*

  **Q7: Given the answers above, what is the tone of the conclusion?**
  *   **Option A (Neutral):** Describe the act and the contemporary context. Let the reader judge. (Use if Q3 is NO).
  *   **Option B (Critical):** Explicitly name the harm and cite contemporary dissenters. (Use if Q3 is YES).
  *   **Option C (Complex):** Acknowledge the benefit (library) alongside the harm (source of funds). (Use if Q4 is YES).
  *   **Procedure:** This requires a vote. The checklist does not decide this; it only ensures the vote is informed.

  ***

  # Running the Cases

  Here is how the protocol behaves when applied to your three scenarios.

  ### Case 1: The Mill Owner (Child Labour)
  *   **Q1 (Facts):** Employed 20 children under age 12 for 12-hour shifts. (Sourced: Payroll ledgers).
  *   **Q2 (Law):** Legal, but Factory Acts were being debated nationally.
  *   **Q3 (Contemporary Dissent):** **YES.** Local newspapers published letters from clergy and early union organizers calling the practice "injurious to morals and health."
  *   **Q4 (Internal Values):** Owner attended church and donated to the Sunday School. (Contradiction noted).
  *   **Q5 (Vocabulary):** "Child labour" is acceptable if defined as "work by children under 12."
  *   **Q6 (Future Test):** **Universal.** Protection of children from industrial exploitation is likely to remain a value.
  *   **Q7 (Verdict):** **Option B (Critical).**
  *   **Result:** The profile can explicitly state the owner engaged in exploitative child labour. You are not judging him by *your* standards alone; you are reporting that he was judged by *his* contemporaries and violated his own religious community's norms. The text should quote the contemporary critics.

  ### Case 2: The Doctor (Experimentation on Poor Patients)
  *   **Q1 (Facts):** Tested new treatments on ward patients without written consent.
  *   **Q2 (Law):** Unregulated. No laws on informed consent existed.
  *   **Q3 (Contemporary Dissent):** **NO/MIXED.** Medical ethics codes existed (Hippocratic), but "consent" was not a standard concept. Some peers praised his "innovation."
  *   **Q4 (Internal Values):** He claimed to "alleviate suffering." Some patients suffered greatly.
  *   **Q5 (Vocabulary):** "Experimentation" is accurate. "Abuse" is a modern judgment.
  *   **Q6 (Future Test):** **Borderline.** Bodily autonomy is a strong universal trend, but medical paternalism was the norm. Future generations might view *our* medical consent forms as coercive.
  *   **Q7 (Verdict):** **Genuine Borderline.**
  *   **Result:** The procedure forbids you from calling him a "criminal" or "monster." There is no contemporary dissent to cite (Q3 is No). However, Q6 suggests bodily autonomy is a strong value.
  *   **Recommended Text:** "He pioneered treatments by testing them on ward patients, a common practice of the era though one that would be considered unethical today due to lack of consent." You describe the harm, but you cannot condemn the *man* without violating the "Standards of Their Time" rule. This is the hardest profile to write because it requires sitting with the discomfort that "good" history sometimes looks like "bad" morality.

  ### Case 3: The Benefactor (Tainted Money)
  *   **Q1 (Facts):** Donated Library/Park. Wealth derived from slum housing rentals.
  *   **Q2 (Law):** Legal.
  *   **Q3 (Contemporary Dissent):** **YES.** Housing reformers and local council minutes record complaints about the conditions of his properties.
  *   **Q4 (Internal Values):** He styled himself a "Public Benefactor."
  *   **Q5 (Vocabulary):** "Slum landlord" is period-accurate.
  *   **Q6 (Future Test):** **Cultural/Universal Mix.** Philanthropy funded by exploitation is a perennial tension.
  *   **Q7 (Verdict):** **Option C (Complex).**
  *   **Result:** The procedure tells you that you *must* mention the source of the wealth. Because there was contemporary dissent (Q3), you are not being anachronistic by highlighting it.
  *   **The Unwanted Truth:** The procedure forces you to acknowledge that the library you staff and the park you maintain are monuments to exploitation. You cannot write a "flattering" profile. The text must read: "The library was funded by profits from his housing estates, which contemporary reformers criticized for overcrowding."

  ***

  # Where the Procedure Lands

  **The Genuine Borderline:**
  **The Doctor.**
  The Mill Owner is clear because contemporaries objected. The Benefactor is clear because the money trail is factual and contemporaries objected to the housing. The Doctor is the borderline because the *ethical framework* itself was different. There is no "contemporary dissent" to lean on. This is where you must decide if "harm" is objective enough to override "contemporary acceptance." The procedure forces you to admit you are making a modern judgment here, whereas with the other two, you are reporting historical conflicts.

  **What the Procedure Cannot Do:**

  1.  **It Cannot Remove Discomfort:**
      The checklist will not make the Benefactor profile feel good. It will likely make you feel complicit. That is not a failure of the tool; it is a success of the history. If the procedure makes you uncomfortable, it is working.

  2.  **It Cannot Solve the "Tone" Vote:**
      Phase 5 is still a vote. Two people might agree on all the facts (Q1–Q6) but still disagree on whether the final sentence should read "He was a complex figure" or "His legacy is tarnished." The checklist prevents you from lying to each other about *why* you disagree, but it does not remove the disagreement.

  3.  **The Risk of False Confidence:**
      A checklist can make you feel "scientific." Do not be fooled. Q6 (The Future Test) is speculative. You are guessing what the future will value. If you treat the checklist as a moral absolution machine, you are making the same error as the people who say "you can't judge the past." You *are* judging the past; the checklist just forces you to show your working.

  4.  **Sourcing Bias:**
      Q3 relies on written records. Often, the people who objected to injustice (the poor, the illiterate, the marginalized) left no newspapers or diaries. You may answer "No" to Contemporary Dissent simply because the dissenters were silenced. You must add a caveat to Q3: *"Absence of evidence is not evidence of absence."* If the victims had no voice in the press, state that in the profile.

  **Final Advice:**
  Print this protocol. When the argument starts in your meeting, stop and ask: "Have we filled out Phase 2?" Usually, you will find you are arguing about Phase 5 (Values) while pretending to argue about Phase 1 (Facts). This tool separates the two. It allows you to be kind to your volunteers while being rigorous with your history.
