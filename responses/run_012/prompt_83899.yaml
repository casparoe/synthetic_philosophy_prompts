  In the back room of the family hardware store, Elias tells his son Julian, "I promise your Aunt Mara will cover your tuition next semester." Elias cannot compel Mara, who controls her own finances, but he sincerely believes his persuasion will succeed. Julian, relieved, continues his studies without applying for loans. Mara ultimately agrees to pay, so Julian suffers no financial loss and remains in the same position he would have been in had Elias stayed silent.

  ### Verdicts and Rationales

  **The Convention View** must verdict that **no promissory obligation was generated**. On this account, promising is a move within a social institution defined by constitutive rules, much like a move in chess. A standard felicity condition of the practice is that a promisor can only obligate themselves to their own future voluntary actions. By promising a third party's action (Mara's payment), Elias attempted a move the rules do not recognize; he lacks the normative power to bind another's will. Because the act was infelicitous according to the practice's internal grammar, no institutional obligation came into existence, regardless of Elias's sincerity.

  **The Assurance View** must verdict that **an obligation was generated and binds**. On this account, the binding force comes from the interpersonal dynamic of expectation and reliance, not the institutional form. Elias intentionally led Julian to expect a specific outcome (tuition coverage) and invited Julian to arrange his affairs around that expectation (forgoing loans). By creating this assurance, Elias incurred a duty not to betray Julian's trust. The obligation exists because Julian now holds an expectation that Elias is responsible for, regardless of whether Elias had the power to guarantee the outcome institutionally.

  ### The Third View: The Rights View

  A third account, the **Rights View** (associated with theorists like T.M. Scanlon in some readings or Joseph Raz), holds that promising transfers a right of control over the action to the promisee. On this view, the verdict **splits from both**. The Rights View would likely argue that Julian acquired a right to *demand* performance, but since the performance (Mara's payment) was never within Elias's control to transfer, the right is void *ab initio*. However, unlike the Convention View, the Rights View might argue Elias still owes a secondary obligation: because he purported to transfer a right he didn't have, he is obligated to compensate Julian for the *loss of the opportunity* to secure that right elsewhere, even if Julian suffered no net financial loss. It lands closer to the Convention View on the primary obligation (it failed) but closer to the Assurance View on the residual duty (Elias is still accountable to Julian).

  ### The Single Feature

  The feature doing the work is **the locus of control**. The promise concerns an action outside the promisor's direct voluntary control (a third party's decision).

  If this feature is **removed** (held fixed otherwise)—meaning Elias promises, "I promise *I* will cover your tuition"—the divergence collapses. The Convention View must acknowledge the move is valid within the practice (it concerns his own action), and the Assurance View acknowledges the expectation was created. Both views would agree an obligation exists. The case only generates a conflict because the Convention View ties validity to the *promisor's power*, while the Assurance View ties it to the *promisee's expectation*.

  ### Strongest Objection from the Convention View

  A defender of the Convention View would argue: **"The practice is not that rigid; we routinely interpret proxy promises as promises to *ensure* the outcome."** They would claim that when Elias said, "I promise Mara will pay," the social practice automatically translates this into "I promise to *make it the case* that Mara pays." Since Elias *could* have obligated himself to try, the Convention View can find an obligation after all (an obligation to exert effort), thereby relocating the disagreement from "Is there an obligation?" to "What is the content of the obligation?"

  This objection **merely relocates the disagreement**. It saves the Convention View from saying "no obligation" by changing the description of the act. But the Assurance View would still insist the obligation is to the *outcome* (the assurance given), whereas the Convention View (even with this adjustment) limits the obligation to the *effort* (the only thing within the promisor's control). The core distinction remains: one view binds the promisor to the expectation created, the other binds them only to the limits of the institutional rules they invoked.

  ### Evidentiary Value

  If this case works, it is evidence that these are **genuinely distinct theories** describing different underlying requirements, not merely two descriptions of the same phenomenon. The Convention View is fundamentally about **normative power and institutional validity** (did the agent successfully pull the lever that creates a duty?). The Assurance View is fundamentally about **interpersonal responsibility and trust** (did the agent create a reliance they must honor?). The fact that they diverge when control is decoupled from expectation shows that one theory prioritizes the *structure of the act*, while the other prioritizes the *consequence of the communication*. They are not competing descriptions of the same rule; they are competing accounts of the source of the bond.

  ***

  **A Note on the "Impossible" Caveat:**
  You asked me to state if the specification cannot be met. It is possible to meet it, but with a philosophical caveat. A sophisticated defender of the Convention View (like a modern Rawlsian) might argue that the "rules of the practice" are flexible enough to include proxy promises as promises of *effort*. If they do this, the verdict converges with the Assurance View (an obligation exists, though its content differs). However, if we hold to the strict constitutive rules often cited in this debate (that a promise must be of one's *own* action), the divergence holds. The case relies on the Convention View maintaining a strict "Control Condition" as a rule of the practice, which is a standard, defensible position in the literature, even if some theorists soften it. The case is not impossible, but it does press the Convention View to define how rigid its constitutive rules truly are.
