      *Let's go.*
answer: |-
  **MEMORANDUM**

  **TO:** Board of Education
  **FROM:** Chair, Choice and Authorization Subcommittee
  **DATE:** October 24, 2023
  **SUBJECT:** Subcommittee Recommendations on Northside Classical Academy and Part-Time Enrollment Policy

  **Purpose**

  This memo outlines the Subcommittee's recommendations regarding two agenda items scheduled for Thursday's vote: the charter application from Northside Classical Academy (Item 1) and the proposed policy allowing part-time enrollment for homeschooled and private school students (Item 2). While these items appear distinct, they must be evaluated as a single fiscal and ethical package. Both concern how we allocate scarce public resources in a period of declining enrollment. After reviewing the record, the Subcommittee recommends denying the Northside charter application and approving the part-time enrollment policy.

  **Fiscal and Demographic Context**

  The backdrop for this decision is non-negotiable. District enrollment has dropped 9% over five years, and birth rates continue to fall. Three of our elementary schools are operating at approximately 60% capacity. Per-pupil funding follows the student; therefore, every student who leaves the district for a charter represents a direct loss of revenue without a commensurate reduction in fixed costs. Staff projections indicate the Northside charter alone would cost the district approximately $1.4 million annually at full scale. The fiscal impact of the part-time policy is indeterminate but likely marginal compared to the charter, as it utilizes existing excess capacity rather than creating parallel infrastructure.

  **Item 1: Northside Classical Academy**

  The applicants for Northside Classical Academy present a compelling case for innovation. They argue that their model offers rigorous classical education that is currently unavailable in our district. They have designed a lottery that weights applicants from our three lowest-income census tracts by 1.5x, ostensibly to ensure socioeconomic diversity. Furthermore, proponents argue that denying this application after approving other charters in the past, or denying the dual-language school two years ago, suggests an inconsistent standard that undermines parent trust. The argument that "founding families" deserve preference is rooted in the significant sweat equity they invested during the two-year planning phase.

  However, the Subcommittee finds that the structural barriers in Northside's design violate our statutory obligation to serve a student population that reflects the community. Specifically, the mandatory family covenant requiring 30 volunteer hours annually and nightly read-aloud commitments creates a screening mechanism that disproportionately excludes working-class families, regardless of the lottery weighting. A parent working two jobs cannot front 30 volunteer hours. By making enrollment contingent on parental labor, the school effectively privatizes access to a public charter. Additionally, the agreement directing 11% of per-pupil funding to a for-profit management company via an auto-renewing contract removes necessary board oversight over public dollars.

  Regarding the precedent of the dual-language denial: The applicants are correct that consistency matters. Two years ago, we denied a similar-sized application on fiscal-impact grounds. The fiscal reality today is more severe, not less. To approve a $1.4 million annual deficit now, when we denied a similar cost then, would be arbitrary. We cannot cure this inconsistency by approving Northside; we cure it by maintaining a firm fiscal boundary. Conditions cannot remedy the structural deficit; shrinking the school to fit the budget would defeat the purpose of the application. Therefore, the application must be denied.

  **Item 2: Part-Time Enrollment Policy**

  In contrast to the charter application, the part-time enrollment policy leverages our current under-utilization. With three elementaries at 60% capacity, we have empty seats and existing staff. Allowing homeschooled and private-school students to take up to two classes and participate in athletics generates marginal revenue while fostering community integration.

  Opponents argue this dilutes resources for full-time district students and creates administrative complexity. While the administrative burden is real, it is manageable. The fiscal drain is minimal compared to the charter because these students are not draining a full per-pupil allocation, and they are filling seats that would otherwise generate zero revenue. More importantly, this policy treats district schools as a community hub rather than a closed system. It invites collaboration rather than competition.

  **The Ethical Framework**

  As a board, we must confront the zero-sum nature of these decisions. Schooling is partly a race for position; one child's advantage can inadvertently become another's disadvantage. Parents have the agency to exit the system, but children do not get a vote. When we authorize a new charter that drains $1.4 million from the general fund, we are making a choice that reduces resources for the 90% of students who remain in traditional public schools.

  Northside's model accelerates stratification. The volunteer covenant ensures that the student body will reflect not just the community, but the *available time* of the community. Public education is supposed to mitigate the accidents of birth, not compound them. By denying the charter, we acknowledge that we cannot sustain a parallel system that siphons resources from the vulnerable students who remain in our under-capacity buildings. By approving the part-time rule, we offer choice without fragmentation.

  **Recommendations**

  **Item 1 (Northside Classical Academy): DENY.**
  The fiscal impact is unsustainable given current enrollment trends, and the family covenant requirements create inequitable barriers to access that violate the statutory requirement to reflect the community. The inconsistency with the dual-language denial is noted, but the fiscal constraint remains the controlling legal and ethical factor.

  **Item 2 (Part-Time Enrollment): APPROVE.**
  This policy should be implemented for the upcoming semester. Administration is directed to report back in six months with data on enrollment numbers and fiscal impact to ensure the marginal costs do not exceed projections.

  **Conclusion**

  We are stewarding a public trust in a time of contraction. We cannot be all things to all families if doing so bankrupts the system that serves the most vulnerable. We must choose the path that keeps our doors open to everyone, rather than building a new door that only some can afford to walk through.

  Respectfully submitted,

  Chair, Choice and Authorization Subcommittee
