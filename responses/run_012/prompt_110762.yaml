          2.  *Player Character:* Treatment expresses/cultivates player virtues/vices.
          3.  *Design Demand:* The game *as a made thing* makes a moral demand.
      *   **Key Mechanics to Address:** Fight vs. Spare, Save/Load (diegetic), Memory (Flowey/Chara/Sans), Genocide vs. Pacifist routes, Permanent marks (Steam flag, Soul corruption).
      *   **Philosophical Angles:** Paradox of Fiction (real emotions for unreal objects), Interactivity vs. Complicity, Community Practices.
      *   **Tone:** Nuanced, academic but accessible, avoiding a definitive verdict in favor of exploring the tension.

  2.  **Deconstruct the Three Frameworks in Relation to *Undertale*:**

      *   *Framework 1: Moral Patients (Do they suffer?)*
          *   *Support:* The game begs us to treat them as such (dialogue, fear, pleading). The Genocide route makes their death feel "real" through absence.
          *   *Resistance:* They are code. The Save/Load mechanic explicitly highlights their unreality (they reset). Flowey knows he's in a game, undermining the illusion.
          *   *Verdict:* The game *simulates* patient-hood to provoke the question, but ultimately admits they are fictional. The guilt comes from the *violation of the simulation's integrity*, not ontological reality.

      *   *Framework 2: Player Character (Virtue Ethics)*
          *   *Support:* Killing makes you feel bad. The game calls you out ("You're filled with DETERMINATION," but later "You're a monster"). The Genocide ending attacks *you*, the player.
          *   *Resistance:* Is it just a trick? If I kill pixels, am I cruel? The colleague's point holds here unless we argue that *practicing* cruelty in a safe space still shapes the self.
          *   *Verdict:* *Undertale* leans heavily here. It judges the *player*, not just the avatar.

      *   *Framework 3: Design Demand (The Game as Agent)*
          *   *Support:* The mechanics *force* reflection. You have to try hard to be genocidal (grinding). The game breaks the fourth wall (Sans judging your EXP, Flowey manipulating saves).
          *   *Resistance:* It's still a designed experience. Is the "demand" authentic or just a scripted reaction?
          *   *Verdict:* This is the strongest angle against the colleague. The game is an *artifact* that encodes ethical constraints.

  3.  **Address the Save/Load Mechanic:**
      *   This is the crux. It vindicates the "just code" argument (they reset) *and* undermines it (the game remembers).
      *   *Key Insight:* The *persistence of memory* despite the *reset of the world* is the moral core. It mimics conscience. You can undo the act, but not the guilt/knowledge.
      *   *Consent:* They cannot consent to the reset. This creates a power imbalance that feels ethically weighty.

  4.  **Address the Paradox of Fiction:**
      *   Standard view: Emotions are irrational because objects don't exist.
      *   *Undertale's* twist: The emotions are real *responses to a real system*. You aren't grieving a dead monster; you are grieving your own violation of a contract with the designer/system.
      *   *Interactivity:* Reader complicity is passive; Player complicity is active. You *did* the pressing.

  5.  **Drafting the Reading - Section by Section:**

      *   **Introduction:** Acknowledge the colleague's skepticism. Validate it (they are code). But pivot to why the *experience* of that code matters. Introduce the three frameworks.
      *   **Section 1: The Patient Problem (Ontology):** Discuss the "just code" argument. How *Undertale* admits this (Flowey) but asks us to ignore it (Toriel). The Save/Load mechanic as the ultimate test. *Conclusion:* They aren't patients, but the *simulation of patient-hood* is robust enough to trigger moral reflexes.
      *   **Section 2: The Player's Soul (Virtue Ethics):** Focus on EXP (Execution Points) and LV (Level of Violence). The game redefines RPG stats as moral metrics. The Genocide route requires *effort* to be evil. This suggests the moral weight is on the *will* of the player.
      *   **Section 3: The Artifact's Demand (Design Ethics):** The game as a moral agent. Sans's judgment. The "corrupted" save file. This answers the colleague: The design *is* the argument. It's not sentiment; it's structural consequence.
      *   **Section 4: The Paradox of Interactivity:** Distinguish reading from playing. The "dirty hands" of the player. The community aspect (wiki guides, speedruns vs. roleplay).
      *   **Conclusion:** Summarize the unresolved tension. The game doesn't prove monsters have rights; it proves players have consciences that can be triggered by systems.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Make sure I don't sound like I'm saying "games are real."
      *   *Correction:* Emphasize the *contract* between player and designer. The guilt is real because the *choice* was real, even if the victim was not.
      *   *Critique:* Don't ignore the Genocide route's specific ending (Chara).
      *   *Correction:* Use Chara as the embodiment of the "gamer" mindset (stats over story), showing the game critiquing its own medium.
      *   *Check:* Did I answer the specific question about Save/Load? Yes, frame it as "temporal violence."

  7.  **Final Polish:** Ensure the tone is suitable for an undergraduate seminar (philosophically rigorous but engaging). Use the terminology provided (moral patients, paradox of fiction, etc.). Ensure the colleague's objection is addressed respectfully but countered effectively.

      *(Self-Correction on the "Colleague" point)*: The colleague says it's a "trick." I need to argue that *all* art is a trick, but *Undertale* makes the trick the *subject* of the art. It's not hiding the strings; it's showing you the strings and asking if you feel bad about pulling them.

  8.  **Final Review against constraints:**
