answer: |-
  Here is a reading of *Undertale* designed for your seminar, structured around the three frameworks you provided. It is written to be distributed to students or used as a lecture foundation, directly engaging your colleague's skepticism without dismissing it.

  ***

  # Code, Conscience, and Contract: A Moral Reading of *Undertale*

  ### Introduction: The Colleague's Objection
  To begin, we must grant your colleague's point: *Undertale*'s monsters are not moral patients. They are arrays of data. When a monster "dies," no sentient being ceases to exist. When you "reset," no time travel occurs. The guilt the game solicits is, in a strict ontological sense, a trick. It is a manipulation of variables designed to trigger a psychological response to a stimulus that does not warrant it. This is the **Paradox of Fiction** applied to ludology: Why do we feel real guilt over fake deaths?

  However, to dismiss this as *mere* sentiment is to miss the specific philosophical work *Undertale* performs. The game does not ask us to believe the monsters are real. Instead, it uses the unreality of the monsters to isolate and examine the reality of the *player's agency*. It shifts the moral question from "Do they matter?" to "What does it mean that I can treat them this way?"

  To understand this, we must navigate three distinct frameworks of moral standing, observing where *Undertale* embraces them and where it deliberately breaks them.

  ### 1. The Ontological Framework: Are They Moral Patients?
  *The Question: Does the simulated suffering count directly?*

  *Undertale* initially invites this reading. The combat system forces you to look monsters in the eye. To attack, you must physically guide a weapon through their trembling hitboxes. To spare them, you must navigate social puzzles (complimenting a dog, listening to a ghost's regrets). The game creates a **simulation of patient-hood** so robust that violating it triggers our evolved moral reflexes.

  However, the game resists this reading through its central mechanic: **Save and Load.**
  In most fiction, death is final. In *Undertale*, death is provisional. You can kill a character, feel the grief, and then reload to undo it. If the characters were true moral patients, a reload would be a moral miracle (resurrection). Instead, the game treats it as a violation.
  *   **The Resistance:** Flowey, the first boss, reveals he knows about the saves. He tells you, "It's kill or be killed." He treats the world as a simulation to be exploited. If the monsters were truly real, Flowey's awareness would be impossible.
  *   **The Verdict:** The game admits the characters are not patients. They cannot suffer in a way that persists ontologically. However, the game introduces a crucial complication: **Memory.** While the world resets, the *game file* remembers. If you commit genocide and reset, certain characters (like Sans) hint at knowledge of previous timelines. This suggests that while the *characters* are not patients, the *history of actions* has a weight that transcends the reset. The suffering isn't real, but the *trace* of the suffering is permanent.

  ### 2. The Virtue Ethics Framework: What Does This Do to Us?
  *The Question: Does the treatment express or cultivate traits in the player?*

  This is where *Undertale* offers its strongest counter-argument to your colleague. Even if the monsters are code, the **choice** to delete that code is real. The game gamifies virtue ethics by redefining RPG statistics.
  *   **EXP (Execution Points):** In standard RPGs, EXP is good; it means growth. In *Undertale*, EXP is a measure of how much capacity for violence you have accumulated.
  *   **LV (Level of Violence):** This is not a measure of power, but of desensitization. As Sans explains in the Genocide route, LV stands for "Level of Violence." It measures your ability to distance yourself from the suffering of others.

  The game argues that the moral weight lies not in the victim's ontology, but in the **agent's will**. To complete the Genocide route, you cannot simply play normally; you must *grind*. You must hunt down monsters who are hiding. You must actively choose to be cruel when the game offers you an exit.
  *   **The Resistance:** One could argue this is still a "magic circle." Practicing cruelty in a safe space might actually *cathartically reduce* real-world cruelty, or it might be morally neutral because the object is unreal.
  *   **The Verdict:** *Undertale* rejects the "magic circle" defense. In the Genocide ending, the game breaks the fourth wall. The character Chara addresses *you*, the player, not the avatar. They ask if you think you are above consequences. The game posits that the **habituation of will** matters. If you train yourself to view beings (even simulated ones) as obstacles to be cleared for efficiency, you are cultivating a specific moral disposition. The guilt you feel is not a trick; it is the friction between your actual moral self and the actions you voluntarily performed.

  ### 3. The Design Framework: The Game as Moral Agent
  *The Question: Does the design itself make a moral demand?*

  This is the most radical reading and the best answer to the "just code" objection. *Undertale* is not just a story about morality; it is an **artifact that encodes ethical constraints.**
  Your colleague argues the guilt is a trick the designer plays. *Undertale* agrees, and then asks: **Does the source of the demand matter?**

  When you play a Genocide run, the game becomes hostile. Music distorts. NPCs vanish. The final boss fight against Sans is brutally difficult, designed to make you feel the weight of every mistake. Finally, if you complete the Genocide route, the game "corrupts" your save file. Even if you try to play a Pacifist run afterward, the ending is altered; the characters know you are capable of destroying them.
  *   **The Argument:** This constitutes a moral demand made by the *system*. The game refuses to let you have the "happy ending" without the "clean hands." It creates a **consequence structure** that mimics moral reality.
  *   **The Resistance:** Is this authentic morality, or just operant conditioning? If a dog doesn't sit, it doesn't get a treat. If a player kills, they get a "bad" ending. Is this ethics or just difficulty tuning?
  *   **The Verdict:** *Undertale* bridges this gap by making the **Save File** the locus of the soul. The game treats your save file as your conscience. By making the consequences persistent across playthroughs (the "permanent mark"), the game argues that **actions within a fiction can alter the reality of the engagement.** The game is a contract between designer and player. Violating the spirit of that contract (by killing when you were asked to spare) breaks the trust. The "bad ending" is not a punishment; it is the logical result of a broken relationship.

  ### The Paradox of Interactivity
  This brings us to the core philosophical contribution *Undertale* makes to the Paradox of Fiction.

  In literature, complicity is imaginative. If Hamlet kills Polonius, Shakespeare is the killer, you are the witness. In *Undertale*, complicity is **executive**. You pressed the button. You moved the knife.
  *   **The Save/Load Paradox:** The ability to reset vindicates the "just code" argument (nothing is permanent) but simultaneously creates a new moral horror: **Non-Consensual Temporal Power.** The monsters cannot consent to being reset. They are trapped in your loop of experimentation. When you reload to fix a mistake, you are erasing their lived experience of that timeline to suit your narrative preference. This makes the player a god, but a negligent one.
  *   **Emotional Engagement:** Does the game treat your guilt as evidence of the monsters' status? No. It treats your guilt as evidence of **your capacity for empathy.** The game shows that we do not need ontological reality to trigger moral obligation; we only need **recognizable agency.** If something can plead, and you can listen, a moral relation is formed, regardless of whether the pleader is made of flesh or pixels.

  ### Conclusion: What Is Unresolved?
  For your seminar, it is vital not to settle on a single verdict. *Undertale* leaves us with three unresolved tensions:

  1.  **The Stipulation:** The game *stipulates* that killing is wrong. It rigs the system so that sparing is mechanically interesting and killing is repetitive and grinding. It forces the moral conclusion by making immorality boring or difficult. Is this ethical teaching, or narrative coercion?
  2.  **The Demonstration:** The game *shows* that players feel genuine grief over data. This suggests that moral standing might not be an intrinsic property of the object (the monster), but a relational property constituted by the **practice of the player.** If we treat something as having standing, it acquires standing within that community of play.
  3.  **The Resistance:** The game admits it cannot truly be hurt. The "corrupted" ending is still just a video game ending. The monsters do not *actually* remember. The game ultimately confesses that it is a simulation.

  **To answer your colleague:** The guilt is a trick, but it is a *philosophically productive* trick. *Undertale* does not prove that video game characters have rights. It proves that human players have consciences that can be engaged by interactive systems. It demonstrates that **interactivity collapses the distance between observer and actor.**

  The moral standing of the monsters is not found in their code, but in the **space between the screen and the player.** *Undertale* argues that while the suffering is fictional, the responsibility is not. The game does not ask if the monsters matter; it asks if *you* do.

  ***

  ### Seminar Discussion Questions
  1.  **The Grind:** In the Genocide route, you must kill monsters until the message "But nobody came" appears. This requires active effort. Does the *effort* required to be evil make the evil more real, or does the fact that it is still optional make it less significant?
  2.  **The Reset:** If you kill a character, then reload and spare them, have you forgiven them, or have you erased them? Does the "perfect" Pacifist run require you to forget your own capacity for violence, or acknowledge it?
  3.  **The Artifact:** If a game design encourages cruelty (e.g., a game that rewards headshots on civilians), is the *game* immoral, or is it merely a mirror? Where does the moral agency lie: in the code, or the hand that presses the button?
  4.  **Community:** Many players look up guides to ensure they get the "best" ending. If you follow a guide to spare everyone, are you being moral, or are you just optimizing a system? Does moral worth require the possibility of failure?
