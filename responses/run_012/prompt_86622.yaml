answer: |-
  1. Nearest established concepts

  The closest existing framework is **Fluid Concepts** and **Conceptual Slippage**, originating in cognitive science and AI (specifically the Copycat project). This theory posits that concepts are not fixed symbols but probabilistic roles that shift under pressure during analogical mapping. It fails to cover your description only in that it focuses on the computational mechanism of the shift rather than the philosophical status of the post-hoc account (the "tidy fiction" aspect you highlight).

  Second is **Ad Hoc Concepts** (Psychology of Concepts). These are categories constructed on the fly for specific tasks (e.g., "things to save in a fire"). While this captures the "manufactured in the course of the task" feature, it focuses on category membership rather than the structural role-shifting (object vs. position vs. relation) within a relational system that you describe.

  Third is **Structure-Mapping Theory** (Cognitive Psychology). This describes aligning relational structures between domains. It captures the drive for relational consistency but traditionally assumes predicates are fixed initially. It fails to account for the ontological fluidity where the objects themselves change category (from individual to class) to facilitate the mapping, rather than just matching pre-existing relations.

  2. What my description is not

  You are correct to distinguish this from **Ambiguity**. Ambiguity implies a selection from a pre-existing menu of senses. Your phenomenon involves the *generation* of sense under pressure, not selection. A static lexicon cannot capture it.

  You are also correct regarding **Gestalt Switches**. perceptual alternation (duck/rabbit) implies mutual exclusivity; you note the solver can hold both readings. The shift here is functional and cumulative, not perceptual and displacing. The stimulus remains stable while the *ontology* of the stimulus changes.

  Your distinction from **Metaphor** is precise. Metaphor typically maps across distinct domains (love is a journey). Your cases are intra-domain role shifts (letter as object vs. letter as position). The material does not change domains; the *description* of the material's function changes.

  However, you may be too quick to dismiss **Theory Change**. While there is no second formal theory, the solver is effectively constructing a micro-theory of the puzzle's rules. The "no fixed original" you note is characteristic of radical theory change, where the old vocabulary is reinterpreted rather than discarded. Your phenomenon is essentially micro-scale theory change driven by structural alignment constraints.

  3. The phenomenon, carved

  The phenomenon is **Ontological Plasticity in Analogical Mapping**. It is defined as the context-driven capacity of a cognitive system to alter the categorical status of entities (object, role, relation) to satisfy structural alignment constraints.

  Essential features are: (1) **Pressure-Driven**: The shift occurs only when fixed descriptions fail to produce a mapping. (2) **Retroactive**: Earlier elements are re-described to fit the new ontology (the "quiet re-reading"). (3) **Indeterminate**: There is no single "true" description of the entities independent of the mapping solution.

  Your examples get nothing wrong about the mechanism, but they may obscure the *determinacy of the process* versus the *indeterminacy of the account*. In computational models (like Copycat), the slippage is determined by code and probabilities. Your observation that human accounts vary ("tidy fiction") highlights that the *verbal report* is underdetermined, even if the cognitive solution is stable. The phenomenon is one thing: a single mechanism of flexible representation. It manifests across domains (letters, blocks, words) because it is a core feature of analogical reasoning, not domain-specific.

  It is specific to tasks requiring **invention** or **discovery**. Mere application uses fixed rules. Here, the rules are discovered through the re-description of the elements. The "joint" you are cutting is the boundary between the object and its description. You have identified that in high-level reasoning, the object *is* its description, and when the description fails, the object changes. This is not a bug of language but a feature of cognition: ontology is functional, not fixed.

  4. Boundary cases

  **Legal Precedent Interpretation**: A past court case is re-described to fit a new situation (e.g., "speech" re-described as "money"). *Verdict: Yes.* The legal entity changes ontological status to preserve structural consistency in the law.

  **Debugging Code**: A variable is seen as data, then as a pointer, then as a flag during troubleshooting. *Verdict: Yes.* The symbol's role shifts driven by the demand to make the program's logic coherent.

  **Visual Occlusion**: Seeing a partly hidden object as a whole circle. *Verdict: No.* This is perceptual completion, not ontological re-description. The object's category (circle) does not shift; only its visible extent is inferred.

  **Child Learning 'Dog'**: A child calls a cat 'dog', then restricts the term. *Verdict: No.* This is category refinement (boundary adjustment), not structural role-shifting. The concept of 'dog' stabilizes; it does not fluidly become 'pet' or 'animal' to solve a relational puzzle.

  5. Name and verdict

  An existing term suffices: **Conceptual Slippage** (within the **Fluid Concepts** framework). You have independently rediscovered the core insight of Hofstadter and Mitchell's work on analogical reasoning.

  **Definition**: The context-driven shifting of an entity's conceptual role during analogical reasoning to preserve structural consistency.

  **Distinction**: It must not be confused with **Polysemy**, which implies fixed multiple meanings stored in memory, whereas slippage generates meaning dynamically during processing. Your specific contribution is the philosophical observation of the *indeterminate post-hoc account*, which enriches the standard cognitive definition.
