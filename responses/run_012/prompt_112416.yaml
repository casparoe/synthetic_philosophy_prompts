answer: |-
  **The Grammar of Absence**

  In the Republic of Ostra, the Revolution had burned the law books. In their place, the Bureau of Visual Truth raised walls of charts. The mandate was absolute: administrative prose was the language of obfuscation. Only the picture could be trusted.

  Elara sat at her drafting table, the air thick with the smell of ink and eraser dust. She was the Chief Architect of the Clear Script, the system that governed the state's knowledge. The rules were simple, born of a desperate hunger for honesty. First, every concept was a small, repeatable pictogram. Second, quantity was shown only by repetition. To show a thousand workers, you drew a thousand men in rows, not one giant man. A giant man was a lie; size could be manipulated. A row of identical men was a count. A citizen could look at a wall and know the grain supply without trusting a minister's word.

  For five years, it had worked. Wheat was a stalk. Iron was a ingot. Births were a cradle. But now the High Council demanded the Civic Virtue Index. They wanted the Script to speak of the invisible. They needed symbols for Loyalty, the Public Interest, Corruption, and, hardest of all, Negation.

  Elara stared at the blank grid. The first three were difficult, but manageable compromises. Loyalty became a hand resting on a shield. The Public Interest was a circle of figures holding hands. Corruption was a hand taking a coin from a public box. These were metaphors, certainly, but they were stable metaphors. Everyone agreed a shield was good, and everyone agreed stealing from the box was bad.

  The collapse came with Negation.

  The Council wanted to publish a report stating: *There is no Corruption in District Four.*

  In the Clear Script, how does one draw "no"?

  Elara tried the obvious. She drew the Corruption icon—the hand taking the coin. Then, she drew a heavy bar across it. But a bar was a convention. Why did a line mean "stop" or "not"? To a child, it might mean "broken." To a farmer, it might mean "fence." The Script claimed to be free of translation, yet here she was, inventing a grammar of slashes and crosses that required teaching.

  She tried a second approach. If the Script relied on presence to indicate quantity, perhaps absence indicated zero. She left the space for District Four blank.

  She stepped back. The wall showed District One with three Corruption icons. District Two with one. District Four was empty white plaster.

  It was a failure. A blank space did not assert *truth*; it suggested *error*. Did the Bureau forget to count? Was the data missing? Had the report been censored? In a language built on what *is*, the absence of a thing looks indistinguishable from the absence of information. To show a thing's absence is not the same as denying its existence. One is a void; the other is a claim.

  Elara rubbed her temples. The problem was not artistic; it was ontological. A picture resembles. It shows what is there. Logic asserts. It claims what is *not* there. The Clear Script was built to resemble reality, not to argue with it.

  She tried to draw a hand returning the coin. But that was "Restitution," not "Innocence." She tried drawing a happy face above the box. That was "Satisfaction," not "Integrity."

  The deeper horror settled in. The Script demanded to be read identically by everyone, to survive without convention. But concepts like Loyalty and Corruption were disputed by definition. To the Council, Loyalty was obedience. To the dissident, Loyalty was dissent. If Elara drew the hand on the shield, she codified the Council's definition as visual fact. The Script claimed to be neutral glass, but it was actually a mold.

  And Negation was the key that locked the door. To say "There is no Corruption" is not to describe a visible state of the world; it is to make a promise about hidden behaviors. It is an assertion of faith, not a record of sight.

  Elara picked up her pen. She looked at the row for District Four. If she drew the Corruption icon and crossed it out, she introduced a convention that broke the rule of universal intelligibility. If she left it blank, she introduced ambiguity that broke the rule of clarity.

  She realized then that the Revolution's dream was incomplete. You could count wheat with pictures. You could count bodies. But you could not picture a lie, because a lie is the gap between the picture and the world. To visualize "No Corruption" required the viewer to trust the designer not to hide the icon. But the entire system was built because trust was impossible.

  The room was quiet. The walls were covered in thousands of tiny, honest men and stalks of wheat, marching in perfect, truthful rows.

  Elara dipped her pen in black ink. She could not solve the impossible. She could not make a picture assert rather than resemble. She could not make emptiness speak.

  She drew the Corruption icon—the hand taking the coin. She drew it once. Then, she took her eraser and rubbed it out, leaving a smudge on the plaster.

  It was not a symbol. It was not a count. It was a stain. It said: *Here, something was removed.* It did not say why. It did not say if the removal was true. It simply showed that the record itself was vulnerable.

  She stepped back. It was the only honest thing on the wall. It admitted that the language could not hold the weight of the truth they demanded. The Council would hate it. They would call it sabotage. But it was the only way to show that some things cannot be shown, only confessed.

  Elara capped her pen. The Script would continue for the wheat and the workers. But for the virtues, there would only be smudges, and the silence of the white space where the numbers refused to stand.
