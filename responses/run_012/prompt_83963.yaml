answer: |-
  To sustain Hofstadter's pattern-theory of self, a metaphysics of identity must deliver the following specifications:

  1.  **Graded Ownership:** The theory must allow identity to be a matter of degree, not a binary switch. *Case:* The man who is 40% his mother. If identity is all-or-nothing, he either is her (absurd) or isn't (ignoring the data). The theory must quantify "how much" of one pattern resides in another substrate.
  2.  **Substrate Independence:** "Who" must be decoupled from "where." *Case:* The widow finishing sentences. The cognitive pattern runs on her hardware; if identity is bound strictly to biological organism, her access to his internal logic is merely observation, not instantiation.
  3.  **Instance Authority:** It must adjudicate conflicting instantiations of the same pattern. *Case:* Two mourners disagreeing on the dead friend's wishes. Both carry the pattern; both claim authority. The theory must explain why one might be a "truer" instance without appealing to biology alone.
  4.  **Origin Distinction:** It must distinguish shared blueprint from active copying. *Case:* Identical twins raised apart. Same laugh implies shared source code, not necessarily shared "I." The theory cannot conflate genetic determinism with pattern transplantation.
  5.  **The Algorithmic Successor (Original Case):** A student adopts a mentor's decision-making algorithms so thoroughly they act against their own prior self-interest consistently. The theory must distinguish high-fidelity learning from identity overwrite. Where does imitation end and migration begin?

  **Non-Negotiables vs. Preferences**
  *Non-Negotiable:* **Moral Accountability.** You cannot let the widow pay the husband's debts solely because she hosts his pattern. Identity theories must preserve legal and moral boundaries even if metaphysical boundaries blur.
  *Non-Negotiable:* **First-Person Authority.** The theory cannot deny the phenomenological reality that I feel like one distinct entity, not a distributed network, even if I am technically the latter.
  *Preference:* **Primary Substrate Veto.** Many prefer the original brain holds ultimate authority (the husband's view trumps the widow's). This is comforting but not logically required by pattern theory.

  **Incompatible Pairs**
  Your suspicion is correct: **Binary Identity vs. Graded Survival.**
  Classical identity is an equivalence relation: it is transitive (if A=B and B=C, then A=C). Hofstadterian survival is not. If the Dead Friend (A) is 50% in Mourners B and C, B and C may share 0% of each other. If you insist identity is one relation, you break transitivity. If you insist on transitivity, you must deny partial survival.
  You cannot have both. You must choose: either "person" is a fuzzy set (breaking logic) or "survival" is not identity (breaking the intuition that *you* survive). Most theories save logic by redefining survival as "psychological continuity" rather than strict identity, but this concedes that *you* do not survive, only something like you does. To take Hofstadter seriously requires breaking the logic of identity to save the reality of survival.
