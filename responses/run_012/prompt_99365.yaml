answer: |-
  Here are ten questions designed to press the machinery of her view without losing the conversational thread. I've included the likely follow-ups based on standard defenses of exemplarist theory (like Zagzebski or MacIntyrean virtue ethics).

  **1. The "Kill-Shot" on Flaws**
  "If a hagiography smooths over all the flaws to make the subject holy, doesn't that make the person un-imitatable—what exactly is the reader supposed to copy, and does the genre survive once you admit the flaws?"
  *Follow-up:* "So the flaw isn't noise to be edited out, it's the actual data point?"

  **2. The Reliability of Admiration**
  "Why should I trust my own admiration? I've admired people who turned out to be monsters, and half of who I admire is just luck about who I happened to meet; how does the view avoid building ethics on a faculty that's demonstrably unreliable?"
  *Follow-up:* "So we need a second-order check on the admiration itself?"

  **3. The Transfer Problem**
  "I've read a hundred stories of courage and I'm still a coward; what's the mechanism supposed to be, and what would the theory predict actually changes me?"
  *Follow-up:* "Then isn't the book just the spark, and the fire something else entirely?"

  **4. The Politics of the Canon**
  "Whose lives get held up? The exemplars we inherit are a pretty narrow set, and the canonization is a social and political process; does the theory have anything to say about that, or is it stuck with whatever gallery a culture happens to enshrine?"
  *Follow-up:* "So the theory relies on us finding new saints faster than culture makes old ones?"

  **5. Rival vs. Add-On**
  "Is this a rival to rule-based ethics or just a motivational add-on? If exemplars are supposed to tell us what to do, how do they do it without collapsing back into rules?"
  *Follow-up:* "So the rule is derivative, not foundational?"

  **6. Your Pet Theory (Possibility vs. Copying)**
  "My pet theory is that exemplars don't work by being copied at all — they work by quietly changing what seems possible for me, widening the range of lives I think I could live; is that a friendly amendment or does it gut the view?"
  *Follow-up (If she says it's friendly):* "Then why do we still talk about 'imitation' instead of 'inspiration'?"
  *Follow-up (If she says it guts the view):* "So without direct emulation, the moral link is broken?"

  **7. Truth vs. Inspiration**
  "The old lives of the saints were written to be imitated, and they were also often, let's say, factually loose; is there a real difference between 'a true life that inspires' and 'an inspiring story that isn't quite true,' or is the theory quietly committed to the story being true?"
  *Follow-up:* "So factual accuracy is secondary to moral coherence?"

  **8. Conflicting Exemplars**
  "What happens when my exemplars disagree? If I admire two people who would make opposite choices in the same situation, does the theory leave me stranded?"
  *Follow-up:* "So context selects the exemplar, not the other way around?"

  **9. Moral Autonomy**
  "There's a risk of moral outsourcing here; if I'm looking outside myself for how to live, am I surrendering the autonomy that ethics is supposed to protect?"
  *Follow-up:* "So you see autonomy as a product of the relationship, not a precondition?"

  **10. The Role of Community**
  "Plutarch was writing for a specific elite class, but I'm reading alone in my room; does this method require a community to vet the exemplars, or can it work in isolation like reading a book?"
  *Follow-up:* "So the text acts as a proxy for the community?"

  ***

  **Confidence & Critique**
  I'm about **85% confident** in this list. They target the specific philosophical vulnerabilities of exemplarism (the "admiration emotion" reliability, the derivation of rules, the truth-value of narrative) while respecting your personal stake in the topic.

  **The Weakest Question:**
  **Question 9 (Moral Autonomy).** This is a very standard objection to virtue ethics and exemplarism ("Isn't this just blind conformity?"). She will almost certainly have a rehearsed answer about how true autonomy is *developed* through emulation rather than undermined by it. It's a necessary question, but it's less likely to catch her off-guard or reveal new machinery than the others. If you need to cut one to keep the pace tight, cut this one.
