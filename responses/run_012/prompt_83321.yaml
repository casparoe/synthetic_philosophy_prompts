answer: |-
  **Scenario**

  A person named Alex is participating in a measurement experiment that requires them to curl up completely inside a small, sealed cubic container for exactly one minute. The container is rigid and just large enough to accommodate Alex's spatial dimensions with no room to spare. Once Alex is inside and the lid is locked, the researcher looks at the closed container and states, "The subject is entirely within the box." During this minute, Alex remains still, and no parts of Alex are added or removed; the situation is one of simple, static persistence without any change in intrinsic properties or spatial arrangement.

  ***

  **1. Verdicts and Reasoning**

  **Endurantism:** The endurantist accepts the researcher's statement as literally true. Since objects are wholly present at each moment of their existence, the very same object—Alex—is located at the region of space inside the box at every moment during the minute. When the researcher says "The subject is entirely within the box," they are referring to the whole person, and since the whole person is located there at that time, the claim is correct without qualification.

  **Perdurantism:** The perdurantist must heavily re-describe the researcher's statement to make it metaphysically accurate. On this view, Alex is a four-dimensional "worm" extended through time, and what is located inside the box at any single moment is only a temporal part of Alex, not the whole object. Therefore, the claim "The subject is entirely within the box" is strictly false if "the subject" refers to the whole persisting entity, because the whole entity extends beyond that moment in time. The perdurantist must interpret the statement as shorthand for "A temporal part of the subject is entirely within the box at this time," denying that the subject *itself* is wholly located there.

  **2. The Key Feature**

  The feature doing the work is the **ordinary implication of whole presence in locative claims**. The case relies on the intuitive rule that when we say an object is "entirely" at a location, we mean the whole object is present there, not just a segment of it. This feature forces a clash between the ordinary meaning of "is within" (which implies whole presence) and the perdurantist ontology (which dictates only partial presence at a time).

  **3. Removal or Reversal of the Feature**

  If this feature is removed—for example, if the researcher's claim is changed to "A stage of the subject is within the box"—the disagreement vanishes, and both views can agree on the description. If the feature is reversed, such that the scenario explicitly involves an object known to be spread out (like a queue of people), the claim "The object is entirely within the box" would be obviously false to everyone regardless of their metaphysics. Without the ordinary expectation of whole presence, the case collapses into a trivial semantic agreement or a standard property-check, losing the metaphysical tension.

  **4. The Perdurantist Reply and Its Cost**

  A committed perdurantist would attack the case by arguing that ordinary language is context-sensitive and does not track strict metaphysical truth. They would claim that in everyday contexts, "The subject is within the box" is understood to mean "The subject has a temporal part within the box," so their view does not actually deny the plain truth but rather explains its underlying structure. However, this reply costs them the claim that their ontology aligns with common sense. They must admit that ordinary speech is systematically imprecise or literally false when taken at face value, requiring philosophical paraphrase to be correct. This makes their view less "sensible as a default" for ordinary cases, as it treats straightforward descriptions as requiring hidden correction.

  **5. Honesty Check**

  This case satisfies the specifications, but with one caveat regarding the "Asymmetry" constraint. The asymmetry relies heavily on the premise that ordinary language implies whole presence. A sophisticated perdurantist might argue that ordinary language is neutral on metaphysics, allowing them to accept "The subject is within the box" as true without re-description by treating "is" as a temporally qualified relation. If they take this route, the asymmetry weakens, as the disagreement becomes purely about technical ontology rather than the truth of ordinary claims. I was forced to rely on the "ordinary implication of whole presence" because excluding property swaps and fission cases removes the standard leverage points for persistence puzzles. This makes the case somewhat dependent on linguistic intuition rather than physical paradox, but it remains the strongest way to highlight the "location at a moment" disagreement in an ordinary setting without violating the exclusions.
