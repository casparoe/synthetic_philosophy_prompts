      *   **Verdict on Claim 2:** It fails. The ant story supports ecological rationality (fit), but not necessarily satisficing *over* optimization without the cost benefit analysis found in the Scissors model. The colleague is skipping the "bounds" part of bounded rationality.
      *   **Better Analogy:** Need something that includes *search costs* and *stopping rules*. A forager in a patchy environment (Marginal Value Theorem) or a house-hunter (Simon's own example).

