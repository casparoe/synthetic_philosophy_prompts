      *   **Context:** A reading group discussion.
      *   **Colleague's Argument:** Uses the "ant on the beach" analogy to claim: (1) Complex behavior $\neq$ Complex mechanism (agreed by user), and (2) This vindicates satisficing/fast-and-frugal heuristics because the environment does the work, making optimization unnecessary.
      *   **User's Suspicion:** Claim 1 is right, Claim 2 is an overload of the analogy.
