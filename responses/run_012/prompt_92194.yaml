  # DECISION TREE: FROM MORAL PSYCHOLOGY TO NORMATIVE THEORY

  **ROOT PREMISE:** *Empirical Consensus.* Liberals and Conservatives differ systematically in what strikes them as morally relevant (e.g., Liberals prioritize Care/Fairness; Conservatives endorse those plus Loyalty/Authority/Purity).

  ### LEVEL 1: THE SEMANTIC CLAIM
  **Q1: Does labeling these psychological patterns "Moral Foundations" assert they are *normative bases* for moral truth, or merely *descriptive categories* of cognitive architecture?**

  *   **A. Normative Bases:** (Implies these intuitions ground truth). → Go to **Level 2A**.
  *   **B. Descriptive Categories:** (Implies these are just sources of feeling). → Go to **Level 2B**.

  ---

  ### LEVEL 2A (Normative Bases): THE BREADTH CLAIM
  **Q2: If foundations ground truth, does the empirical finding that Conservatives endorse *more* foundations (5-6) than Liberals (2-3) imply Conservatives have greater moral accuracy?**

  *   **A. Yes (Breadth = Accuracy):** → Go to **Level 3A**.
  *   **B. No (Breadth = Difference only):** → Go to **Level 3B**.

  ### LEVEL 2B (Descriptive Categories): THE ONTOLOGICAL CLAIM
  **Q2: Do these descriptive categories track *real moral properties* in the world, or merely *internal dispositions* to react?**

  *   **A. Real Properties:** (Psychology tracks Truth). → Go to **Level 3A**.
  *   **B. Internal Dispositions:** (Psychology tracks Feeling). → Go to **Level 3B**.

  ---

  ### LEVEL 3A (Truth-Tracking): THE EVOLUTIONARY CLAIM
  **Q3: Does the evolutionary story about where these intuitions come from provide a reason to distrust their ability to track truth?**

  *   **A. Yes (Origins Undermine):** → Go to **Level 4A**.
  *   **B. No (Origins Irrelevant):** → Go to **Level 4B**.

  ### LEVEL 3B (Feeling-Tracking): THE CONCRETE CASE
  **Q3: Consider a person who finds an act disgusting (Purity) but can give no reason why. Is this person making a valid moral judgment?**

  *   **A. Yes (Intuition Suffices):** → **LEAF: Sentimentalist Line**. (Moral truth is just whatever our sentiments settle on).
  *   **B. No (Reason Required):** → **LEAF: Empty/Incoherent**. (If foundations only track feelings, but feelings without reason don't count, you have no mechanism for truth. Collapses into Rationalist Comeback on the other branch).

  ---

  ### LEVEL 4A (Origins Undermine): THE SYMMETRY CLAIM
  **Q4: Does the evolutionary debunking argument apply symmetrically to *all* moral intuitions, or asymmetrically to specific ones?**

  *   **A. Symmetrically (All are tainted):** → **LEAF: Symmetric Debunking**. (Evolutionary origins undermine moral justification globally; leads to skepticism or error theory).
  *   **B. Asymmetrically (Only "their" instincts are tainted):** → **LEAF: Asymmetric Debunking**. (The "My side is reason, yours is instinct" view. *Note: Often unattractive if one accepts the Root Premise that all sides rely on intuition*).

  ---

  ### LEVEL 4B (Origins Irrelevant): THE ROLE OF REASON
  **Q4: Is moral reasoning a separate faculty capable of critiquing these intuitions, or merely a post-hoc press secretary for them?**

  *   **A. Press Secretary:** (Reason serves intuition). → **LEAF: Haidt-ish Reading**. (Only reachable if you answered **Level 2A: Yes**. If you answered **Level 2B**, this collapses into Sentimentalism). *Normative upshot: The Right's wider palate counts in its favor because it utilizes more of the available "taste buds" of the moral mind.*
  *   **B. Separate Faculty:** (Reason can critique intuition). → Go to **Level 5**.

  ---

  ### LEVEL 5: THE NORMATIVE UPSHOT
  **Q5: If Reason can critique Intuition, does this psychological map offer guidance on *who is morally correct*, or is it strictly a map of *disagreement*?**

  *   **A. Who is Correct:** → **LEAF: Rationalist Comeback**. (Foundations describe intuition; Reason is a separate faculty that can still criticize it to find objective truth).
  *   **B. Map of Disagreement:** → Go to **Level 6**.

  ---

  ### LEVEL 6: THE PRAGMATIC CLAIM
  **Q6: Is the goal of using this map to facilitate political persuasion (marketing) or merely to understand the landscape (science)?**

  *   **A. Facilitate Persuasion:** → **LEAF: Moral Reframing**. (*Note: Distinct only if it claims strategic value without normative truth. If it claims truth, it collapses into Rationalist Comeback. If it claims no truth value, it is Descriptive-only MFT with a budget.*)
  *   **B. Understand Landscape:** → **LEAF: Descriptive-only MFT**. (Psychology describes, doesn't prescribe. No normative upshot).

  ---

  ### SUMMARY OF LEAVES

  1.  **Sentimentalist Line:** Moral truth is constituted by settled sentiments (Level 3B-A).
  2.  **Empty/Incoherent:** Claims feelings track truth but unreasoned feelings don't count (Level 3B-B).
  3.  **Symmetric Debunking:** Evolutionary origins undermine all moral justification (Level 4A-A).
  4.  **Asymmetric Debunking:** Evolutionary origins undermine only the opposition's justification (Level 4A-B).
  5.  **Haidt-ish Reading:** Breadth of foundations implies greater moral accuracy; reason is a servant (Level 4B-A + Level 2A-A).
  6.  **Rationalist Comeback:** Reason is separate from intuition and can find objective truth (Level 5-A).
  7.  **Moral Reframing:** Descriptive map used for strategic persuasion (Level 6-A).
  8.  **Descriptive-only MFT:** Descriptive map used for scientific understanding (Level 6-B).
