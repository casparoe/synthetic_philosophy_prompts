answer: |-
  Good morning. I know it's early. I know there's no coffee yet. So I'm not going to start with a definition. Definitions are for when you're awake. I'm going to start with a story about a question I couldn't answer.

  Last semester, I was teaching an introductory machine learning course. We were halfway through, discussing validation sets. A student raised her hand. She was sharp, the kind who reads the footnotes. She asked, "How do we know the validation set is representative of the deployment environment?"

  Standard question. I gave the standard answer. "We assume the distribution is stationary. We test for drift."

  She didn't sit down. She asked, "But how do we know *that*? What test do we run to check the test?"

  I said, "Well, we look at historical performance."

  She said, "But that's just more past data. How do we know the future looks like the past?"

  I started to say something about induction, about how science requires that assumption. But I stopped. Because I realized I wasn't giving her a reason anymore. I was giving her a rule. I was essentially saying, "If you don't assume this, you can't do what we are doing in this room."

  She wasn't asking for a better metric. She was asking for a ground floor. And I realized I didn't have one. I had a threshold. A place where we stop asking because the cost of asking further is that the game ends.

  That moment—that specific silence—has been bothering me. And it's the reason I'm standing here trying to float a distinction that might be wrong, but feels useful.

  I want to suggest there are two kinds of certainty we deal in. I'm looking for names for them. For now, let's call them **Constitutive** and **Inertial**.

  The first kind, Constitutive, is the kind where doubting the thing doesn't just risk being wrong; it risks making your question meaningless. If I'm playing chess and I ask, "Can I move the rook diagonally?" you don't check the statistics of grandmaster games. You tell me I'm not playing chess anymore. The certainty isn't based on evidence; it's based on the rules that make the evidence possible. You can't run the practice of asking without them.

  The second kind, Inertial, is where we *could* ask, but we don't. We stopped asking a long time ago. It would be expensive to start again. Embarrassing, maybe. But in principle, the question still makes sense. It's certainty by momentum. It's the thing we treat as a hinge because it's too heavy to lift, not because it's bolted to the floor.

  Here is why I think this matters for this room, and for this workshop title, which I still maintain was not my choice.

  When we talk about what these machines "know," or whether they are "certain," I think we are sliding between these two kinds without noticing.

  Take a large language model. It outputs a statement with high confidence. "The capital of France is Paris." Is that certainty constitutive? In the context of the model's weights, yes. Given the architecture and the training, it *cannot* say otherwise without breaking its own internal consistency. It's a mathematical output.

  But is it constitutive for *us*? When we rely on that output to book a flight, or diagnose a patient, are we treating it as a rule of the game, or are we treating it as a fact that has simply stopped being questioned?

  I suspect most of what we call a model's knowledge is Inertial. It's sedimented practice. The model learned correlations that held in the training data. We accept them because they work on the benchmark. But the moment the distribution shifts—the moment the world changes—the certainty evaporates. It wasn't a rule; it was a habit.

  The trouble starts when we argue about safety, or alignment, or truth. One side says, "The model doesn't *really* know anything, it's just statistics." They are treating the certainty as Inertial—contingent, fragile, based on past data.

  The other side says, "But it passes the bar exam. It writes code that compiles. It functions as if it knows." They are treating the certainty as Constitutive—functional, reliable, a new kind of rule.

  We talk past each other because one group is talking about the geology of the data, and the other is talking about the grammar of the usage.

  Now, I know what some of you are thinking. I can see the emails being drafted in my head. Specifically, I know there is a contingent in this room—probably sitting near the back—who think this distinction is cute but ultimately false. You think that what I'm calling "Constitutive" is just "Inertial" with a very, very high prior. You think a hinge is just a belief we've agreed to stop updating for now.

  I am not going to fight you on that this morning. In fact, I need you to be right.

  Because if the distinction collapses, if hinges are just priors in a nicer outfit, then that means our certainties are always negotiable. It means we can always open the black box, pay the cost, and start asking again. It means the machine's certainty is just a reflection of our own stopped inquiries.

  But if the distinction holds—if there is a real difference between the rules of the game and the habits of the players—then we have a different problem. It means there are things the machines are doing that we cannot evaluate using our old tools, because they are playing a different game.

  I don't know which it is. That's why I'm not giving a paper today. I'm giving you a provocation.

  I want us to spend the day watching for the slide. When someone says "The model is certain," I want you to ask: Certain because the math forces it, or certain because we stopped checking? When someone says "That's a hallucination," I want you to ask: Is it a violation of logic, or a violation of expectation?

  This brings me to why we are all in this room. And I mean specifically *this* mix.

  If this were just a machine learning conference, we'd spend the day talking about calibration curves and loss landscapes. We'd treat certainty as a metric to be optimized. We'd try to make the Inertial look Constitutive by tightening the bounds.

  If this were just a philosophy workshop, we'd spend the day talking about language games and forms of life. We'd treat certainty as a conceptual puzzle. We'd likely conclude that the machines don't have "certainty" at all, only we do.

  Both of those conversations are necessary. But neither of them is sufficient.

  The machines are forcing us to externalize our epistemology. They are making us write down our hinges. When you prompt engineer, you are literally scripting the conditions under which a model is allowed to be certain. You are coding the hinge. When you fine-tune, you are deciding which uncertainties are worth the cost of resolving.

  We are building systems that operate on Inertial certainty—statistical regularities—and deploying them into contexts that demand Constitutive certainty—laws, medical diagnoses, infrastructure.

  That gap is where the risk lives. Not in the singularity, not in the robots taking over. The risk is in the slide. The risk is in us forgetting which kind of certainty we're dealing with until the model fails in a way we didn't think was possible.

  So, here is my request for the day.

  When you hear a talk, listen for the stop. Listen for the moment the speaker says, "We assume..." or "Obviously..." or "By definition..."

  Ask yourself: Is this a rule we can't break without changing the subject? Or is this a habit we're keeping because it's cheap?

  And if you think I'm wrong—if you think the distinction is nonsense, or if you think I've mischaracterized the technology—please, tell me. There are speakers this afternoon who are going to dismantle this. One of them is going to tell you that certainty is just a control variable. Another is going to tell you that the whole framework is outdated.

  I hope they do. Because if they succeed, it means we've moved the conversation forward.

  We are here because the machines are holding up a mirror to our own practices. They are showing us where we stop asking questions. Whether that stopping point is a foundation or just a resting place is the question.

  I've taken up fifteen minutes. I've got one idea, and I'm not sure it holds water. But I think it's the right thing to put on the table before we start digging.

  Let's see what breaks first: the models, or our certainty about them.

  Thank you.
