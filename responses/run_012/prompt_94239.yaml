prompt: |-
  I'm an applied microeconomist — RCTs, potential outcomes, diff-in-diff, variance decomposition, the usual program-evaluation toolkit — and I keep getting dragged into arguments about heritability, mostly about IQ and personality, and I honestly can't tell whether the disagreement is substantive or just two dialects talking past each other. Can you take the two main positions in that fight — roughly, the one that says heritability estimates tell us something real about why people differ, and the one that says they're close to useless for that purpose — and restate each of them in the vocabulary I actually use: treatment effects, identification, exogenous variation, counterfactuals, decomposition of variance? Be faithful and don't just map "heritability" onto "R-squared" and declare victory. I know what a heritability coefficient is roughly (some share of variance) but not much past that, so don't assume I know the behavioural-genetics jargon.

  Then give me the residue report: what carries over cleanly, what only carries over if you fudge it, and what can't be said in my vocabulary at all — and tell me whether the leftover is a hole in how economists think about variation, or a sign the original claim was vaguer than it sounded.

  Give it back as exactly five numbered points, a sentence or two each, no intro and no conclusion.
