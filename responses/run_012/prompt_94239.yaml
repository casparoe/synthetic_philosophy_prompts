answer: |-
  1. The pro-heritability position treats genetic endowment as an exogenous fixed effect, arguing that family-based variance decomposition identifies the causal share of biology in outcome dispersion absent environmental manipulation.
  2. The skeptic position counters that gene-environment correlation acts like severe selection bias, rendering the variance component endogenous and useless for predicting counterfactuals under policy intervention.
  3. Variance decomposition translates cleanly as a descriptive statistic, but interpreting it as a structural parameter requires assuming no interaction between genetic fixed effects and environmental treatments, which is rarely tested.
  4. The untranslatable residue is the concept of biological constraint itself, which econometrics treats as either pure noise or human capital, leaving no vocabulary for fixed biological limits on treatment responsiveness.
  5. This leftover indicates a hole in how economists model the production function of ability, rather than signaling that the original behavioral-genetics claim was vaguer than it sounded.
