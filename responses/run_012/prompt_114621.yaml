  | **State of Nature** | Possible World | Worlds are truth-value assignments; states in DT are often uncertain events. |
  | **Outcome** | (Credence, World) Pair | Outcomes are causal results; here they are evaluative pairings. |
  | **Utility Function** | Accuracy Scoring Rule | Utility measures subjective desire; Accuracy measures objective fit with reality. |
  | **Dominance Principle** | Accuracy Dominance | If C1 is more accurate than C2 in all worlds, C2 is irrational. |
  | **Dutch Book** | Accuracy Dominance Theorem | Incoherence implies existence of a more accurate alternative. |
  | **Option of Not Playing** | None | Agents can decline bets; agents cannot opt out of having credences. |

  The mapping treats belief formation as a betting scenario where truth pays out. The "Act" row is the most contentious: decision theory assumes you can choose your act, whereas you cannot simply choose to believe the sky is green. The "Utility" row is similarly contested; utility is internal preference satisfaction, while accuracy is an external score based on mind-independent truth. The "Option of Not Playing" row highlights that while you can refuse a gamble, you cannot refuse to have a degree of belief in a proposition you understand. These contested rows suggest the analogy is structural rather than ontological.

  Load-bearing or decorative

  The mathematical structure (scoring rules, dominance) is load-bearing; the decision-theoretic vocabulary (act, choice) is decorative. Joyce's argument for probabilism works even if agents cannot voluntarily change credences, provided those credences are evaluable. The normative force comes from the dominance relation, not the voluntariness. If the mapping requires voluntary choice to work, EUT fails; but the math works on states regardless of choice. So the "act" label is decorative, but the "evaluative target" slot is load-bearing. The "utility" slot is load-bearing only if interpreted as "normative goal," not "desire." The opponent treats the vocabulary as load-bearing to claim redundancy, but the engine is the scoring rule, not the decision frame.

  Where it breaks, ranked

  1.  **Dominance vs. Expectation (Critical):** The opponent's "empty" claim hinges on maximizing *expected* accuracy relative to current credence. Since proper scoring rules are self-recommending, $C$ maximizes $E_C[Accuracy]$. This is true. But Joyce's argument for probabilism uses **accuracy dominance**, not expectation. If your credences are incoherent, there is a coherent alternative that is *actually more accurate in every possible world*, regardless of your current expectations. You don't need to trust your current credences to see you should change; you see you are dominated. This saves EUT from emptiness for synchronic norms. The opponent confuses static self-validation (which is true but irrelevant for dominance) with rational pressure to change (which comes from recognizing dominance).
  2.  **Voluntarism (Critical):** DT governs choices; EUT governs states. You can refuse a bet; you cannot refuse to have a degree of belief. This changes the "ought." DT says "It is irrational to choose A." EUT says "It is irrational to be in state S." If rationality requires control, EUT struggles where DT does not. This matters for the "adds nothing" claim: practical rationality cannot explain norms for involuntary states. If you can't choose it, practical rationality has no grip, but epistemic rationality still evaluates the state.
  3.  **Subjectivity of Utility (Important):** In DT, utility is defined by the agent's preferences. In EUT, accuracy is defined by the world's structure (truth). DT is instrumental (given ends); EUT is constitutive (belief aims at truth). This means EUT establishes a goal DT assumes. DT tells you how to get what you want; EUT tells you what you *should* want (truth) if you are believing.
  4.  **State Independence (Minor):** The user hunches states aren't independent. In standard EUT, worlds are independent of credences (realism). This analogy holds better than expected. The dependency is only in the *score*, not the state itself. The break here is not independence, but *access*: in DT you often know the states available; in EUT, you don't know which world is actual, which is why dominance is required over expectation.

  What it smuggles in

  DT smuggles in the assumption that rationality is about satisfying preferences. EUT smuggles in the assumption that truth is the sole epistemic good. The opponent's analogy smuggles in the idea that because the math is similar, the normativity is identical. It ignores that DT validates preferences, while EUT validates alignment with reality. Also, DT typically assumes a prior probability to calculate expectations; EUT arguments for probabilism often try to derive the prior constraints without assuming them, using dominance instead. The opponent assumes EUT needs a prior to function, which ignores the dominance route. This smuggles in the conclusion that EUT is circular, when it is actually foundational.

  Does his conclusion survive

  Both halves fail. "Adds nothing" is false because EUT derives epistemic norms from truth-aiming, separating them from pragmatic success (money/pain). DT cannot explain why you shouldn't believe falsehoods that are useful; EUT can. It creates a distinct normative domain for belief that practical rationality cannot cover. "Empty" is false because the dominance argument does not rely on current credences to evaluate alternatives. It shows incoherent credences are objectively worse across all worlds, not just in expectation. The opponent confuses static self-validation (which is true but irrelevant for dominance) with rational pressure to change (which comes from recognizing dominance). The analogy is mathematically sound but normatively shallow. The framework tells you to change your mind not because your current self expects it to pay off, but because your current self is objectively dominated by a better alternative.

  A better analogy

  **Statistical Estimation Theory.** Credences are estimators; worlds are parameter values; accuracy is loss functions (e.g., mean squared error). This fixes the voluntarism issue (estimators are evaluated, not chosen in the moment) and highlights the external scoring (loss is calculated against reality, not preference). It captures the "objective score" vibe better than "decision," which implies choice. It preserves the math without implying you can "choose" your beliefs at will. It treats credences as tools for tracking reality, not bets for gaining utility.
