  My reading group has a guy who keeps saying that epistemic utility theory is just decision theory in a different costume, and I can't tell if he's right or if it's a bit he does. His story goes: a credence function is an act, a possible world is a state of nature, accuracy is the payoff, and "maximize expected accuracy" is "maximize expected utility" with truth playing the role of money. Once you see that, he says, the accuracy-first project adds nothing — epistemic rationality just is practical rationality pointed at truth, there's no seperate thing for it to explain, and the arguments for probabilism and for conditioning on your evidence are the argument you already had in decision theory with the labels swapped. His kicker is that the analogy also shows the whole thing is empty: expected accuracy gets computed with your own credences, so every credence function scores itself best, which means the framework can never tell anyone to change their mind — and he thinks that's not a bug waiting to be patched, it's the game.

  I want an audit, not a verdict from on high. Lay out the correspondence explicitly — what maps onto the act, the state, the outcome, the utility function, the dominance principle, the Dutch book, the option of not playing — then tell me which parts of that mapping are actually load-bearing for the arguments accuracy-first people run and which are just decorative. Then the places it breaks, but ranked: which disanalogies matter for his conclusion and which are the kind of wrinkle decision theory has anyway. I especially want the ones that matter. I have a hunch the act/credence slot is doing something sneaky, since you can decline to bet but you can't decline to have credences, and the "states" here don't look independent of the thing being evaluated the way they are in a normal decision problem. And a smaller thing that nags me: in decision theory the utility function is the agent's, it's about what she wants, whereas accuracy isn't something you want so much as something you're scored on — the payoff isn't inside the agent at all, and I don't know what that does to the mapping.

  Then tell me what the analogy smuggles in that decision theory has and credences don't, or the reverse, and finally whether his conclusion survives — both halves, the "adds nothing" and the "empty" — once the breaks are on the table. If a better analogy is available, say what it is and what it fixes; if the honest answer is that his analogy is fine and only the conclusion is wrong, say that. No reading list, I just want the argument.

  Format it as: "The mapping" — a correspondence table, plus a sentence per row wherever the row is contested, ~300 words; "Load-bearing or decorative" ~200; "Where it breaks, ranked" — the ones that matter first, ~500; "What it smuggles in" ~200; "Does his conclusion survive" ~250; "A better analogy" ~150. If a section comes out empty, say so and why.
