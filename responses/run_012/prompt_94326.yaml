answer: |-
  **Bottom line**
  No existing theory satisfies the whole list without qualification. The requirements expose a structural tension between normative force and metaphysical neutrality, forcing a trade-off rather than offering a clean solution.

  **The list**

  1.  **Basic Alignment.** If you know the objective chance of A is *x* and possess only admissible evidence, your credence in A must be *x*. This is forced by the foundational intuition that rational belief tracks objective probability; ignoring known chances constitutes irrational arbitrariness rather than caution.

  2.  **Admissibility Non-Circularity.** The theory must define admissible evidence without presupposing the chance facts it constrains. This is forced by the circularity risk: if chance information counts as inadmissible because it entails outcomes, the principle becomes vacuous, telling you to match chance only when you already know the outcome.

  3.  **Undermining Future Handling.** The theory must specify whether futures that would retroactively alter present chance assignments are possible and how the link handles them. This is forced by scenarios where a specific future sequence of events, if known, would make the current chance assignment false, threatening to make all evidence about the future inadmissible.

  4.  **Chance 1/0 Failure Accommodation.** The theory must explain rational response when chance-1 propositions fail or chance-0 propositions occur. This is forced by the logical possibility that probabilistic laws do not guarantee outcomes; a theory claiming chance-1 entails truth cannot handle empirical falsification of probabilistic laws.

  5.  **Higher-Order Dynamics.** The theory must dictate how credence in chance propositions updates as time passes and chances evolve. This is forced by the need to guide belief not just about outcomes, but about the chance facts themselves, which shift as physical conditions change and histories unfold.

  6.  **Indexical Clarification.** The theory must distinguish objective chance from agent-relative probability assessments. This is forced by cases where "chance for me" diverges from world-chance due to localized evidence, requiring a rule for which value commands deference when they conflict.

  7.  **Determinism Status.** The theory must specify whether the principle applies, vacuously holds, or fails in deterministic worlds. This is forced by the metaphysical dispute over whether deterministic systems possess non-extreme chances, requiring the link to clarify its ontological presuppositions.

  8.  **Expert Analogy Limits.** The theory must explain why chance deference differs from deference to fallible human experts. This is forced by the intuition that while experts deserve high credence, chance deserves exact matching, despite both being external guides prone to potential error.

  **Requirement or preference?**

  Basic Alignment, Admissibility Non-Circularity, and Expert Analogy Limits are non-negotiable; without them, the link ceases to be a guide for belief. The remaining items are artefacts of specific metaphysical pictures. Undermining Future Handling bites primarily if you assume chances supervene on the Humean mosaic; Primitivists often deny undermining is possible. Determinism Status depends on whether you view chance as compatible with causal determination or requiring indeterminism. Indexical Clarification varies based on whether you treat credence as centered or uncentered. These belong in the second section because they test specific ontologies rather than the normative link itself.

  **The squeeze**

  A trilemma emerges from Basic Alignment, Chance 1/0 Failure Accommodation, and Expert Analogy Limits. They cannot be jointly satisfied.

  1.  **Basic Alignment** requires credence to equal chance exactly.
  2.  **Chance 1/0 Failure** requires the theory to allow that a chance-0 event can occur (since we cannot rule this out a priori).
  3.  **Expert Analogy Limits** requires that chance commands exact matching, unlike fallible experts who command only high credence.

  Here is the derivation of the conflict. If Chance 1/0 Failure is possible, then a chance assignment of 0 does not guarantee non-occurrence. This means the chance mechanism is fallible; it can be wrong. If the chance mechanism is fallible, it functions epistemically like a human expert who is highly reliable but not infallible. Rational response to a fallible expert is to hedge credence slightly below their confidence level to account for error rates. However, Expert Analogy Limits demands we treat chance as infallible for the purpose of deference, requiring exact matching. If we match exactly (Alignment) while acknowledging fallibility (Failure), we violate norms of rational response to error. If we hedge to account for error, we violate Alignment. If we deny fallibility to save Alignment, we violate Failure Accommodation. You must drop one: either chance never fails (denying empirical openness), or credence need not match chance exactly (weakening the principle), or chance is not like an expert (requiring a new normative model).

  **Which requirement does the most work**

  Admissibility Non-Circularity kills the most candidate theories. Any theory that defines admissibility by referencing chance facts themselves collapses into triviality. This requirement eliminates circular definitions, forcing theories to ground admissibility in independent metaphysical or epistemological features, which most fail to provide without begging the question.
