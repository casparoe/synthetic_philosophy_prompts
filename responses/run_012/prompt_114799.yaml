      *   *Nuance:* Moore proves *an* external world. The Matrix proves *a different* external world. So Moore is technically right (there is *something* outside the mind), but the *content* of his proof ("Here is a hand") is false in the Matrix context.
      *   *Cypher:* He is crucial. He represents the rejection of the Methodist demand for truth. He accepts the Moorean premise ("Here is a steak") without caring about the metaphysical substrate.
      *   *The Mirror:* This is the visual representation of the failure of transmission. The sensory data (tactile) contradicts the categorical assumption (solid glass).

  7.  **Final Polish:** Check against all constraints in the prompt.
