answer: |-
  # Preparation Document: Scalable Oversight Workshop

  ## Strategic Posture: Ground to Hold and Ground to Yield

  **Yield Immediately:** Do not fight the complexity theorists on the mathematics of the separation itself. Your colleague is correct that the separation between bounded verifiers and unbounded provers is a known result in complexity theory (specifically relating to the limitations of interactive proofs with bounded verifiers). If you attempt to claim the *theorem* is novel, you will lose credibility instantly. Concede that the computational barrier is established math.

  **Hold Firm:** Your contribution is not the complexity separation, but the *epistemic and normative interpretation* of that separation for AI safety. The literature treats debate as a viable oversight mechanism assuming that "truth wins" in the limit. You are arguing that for a specific, critical class of safety-relevant questions, the limit does not exist for a bounded judge. You are translating a complexity constraint into an impossibility result for *justification*, not just computation. Refuse to accept that "average case" performance mitigates the risk; in safety-critical oversight, worst-case guarantees are the only ones that matter.

  **Weakest Step:** **Step Two (The Transmission Problem).** Your claim that an honest debater *cannot* transmit the warrant relies on a specific definition of "warrant" that assumes a certain density of information. An opponent could argue that probabilistic checking or spot-checking of argument trees allows a bounded judge to verify high-complexity claims with high confidence, even without reading the whole certificate. You need to be prepared to defend why probabilistic confidence is insufficient for the specific class of "adversarial verification" questions you are defining.

  ---

  ## The Challenges

  ### 1. The "Known Separation" Charge
  **Source:** Complexity Theorist (including your colleague)
  **Severity:** Critical (Novelty Kill)
  **Idiom:** "You're stating a theorem as a philosophy paper."

  **The Challenge:** "You've spent three steps to prove that a polynomial-time verifier cannot verify languages outside P (or NP, depending on your round complexity). We knew this in the 80s. IP = PSPACE requires an unbounded verifier or specific interaction structures you've ruled out. What is the philosophical contribution here beyond restating that bounded agents can't verify unbounded computations?"

  **Two-Minute Response:** "I concede the complexity separation is known. My contribution is not the math, but the *application to the norms of oversight*. The AI safety literature tacitly assumes that 'debate' circumvents this by relying on the *honest* debater to simplify the truth. I am showing that for a broad class of safety-critical questions, the truth *cannot* be simplified for a bounded judge, even by an honest agent. The literature treats this as an engineering problem; I am showing it is a structural impossibility. The novelty is not the separation, but the demonstration that scalable oversight, as currently defined, hits this separation wall."

  **Soft Spot:** If they press you on whether "simplification" is actually possible for the specific distributions of interest, you risk retreating into worst-case scenarios that they may dismiss as irrelevant.

  ### 2. The Worst-Case vs. Average-Case Objection
  **Source:** Empirical ML Researcher
  **Severity:** High (Relevance Kill)
  **Idiom:** "Generalization," "Distribution," "Empirical evidence."

  **The Challenge:** "Complexity theory deals in worst-case inputs. But in RLHF and oversight, we care about the distribution of questions that actually arise in deployment. There is no evidence that safety-critical questions fall into the 'hard' complexity class you describe. Why should we worry about pathological cases that never appear in practice?"

  **Two-Minute Response:** "Because adversarial verification is specifically designed to handle *adversaries*. If you deploy a superhuman system, you must assume it can find the worst-case inputs if they exist. Relying on average-case performance for oversight is precisely the failure mode we are trying to avoid. If the system can hide a catastrophic failure in a corner case that the judge cannot verify, the oversight mechanism has failed, regardless of how well it works on typical inputs."

  **Soft Spot:** If they produce empirical data showing that obfuscated arguments are rarely generated or successfully detected in current models, your theoretical result may look detached from reality.

  ### 3. The Interaction Depth Objection
  **Source:** Complexity Theorist
  **Severity:** High (Technical Validity)
  **Idiom:** "Round complexity," "Interaction," "Verifier budget."

  **The Challenge:** "You model the judge as bounded, but you haven't strictly bounded the *number of rounds* of debate. If the debaters can interact for polynomially many rounds, the verifier can check much more than you claim (MIP results). Did you fix the round complexity? If not, your separation collapses."

  **Two-Minute Response:** "I explicitly model the judge's total computational budget, which includes the cost of processing each round. A human or bounded model judge has a fixed attention budget. Even with many rounds, if the total tokens or logical steps to verify exceed the judge's bound, the verification fails. I am not assuming a single-shot verification, but a bounded *total* computation, which preserves the separation."

  **Soft Spot:** If your formalization of the "budget" is loose, they can argue that sufficient interaction allows the judge to spot-check efficiently, bypassing your bound.

  ### 4. The Incentive Compatibility Objection
  **Source:** Mechanism Design Economist
  **Severity:** Medium-High (Mechanism Viability)
  **Idiom:** "Nash Equilibrium," "Incentive compatibility," "Cost function."

  **The Challenge:** "You treat the debaters as having fixed capabilities. But in a mechanism design context, we can structure the rewards so that producing an obfuscated argument is more costly than being honest. If the penalty for being caught lying is high enough, the equilibrium shifts. Why doesn't the incentive structure solve the obfuscation problem?"

  **Two-Minute Response:** "Incentives only work if the judge can *detect* the lie. My argument is that for this class of questions, the judge *cannot* distinguish the honest argument from the obfuscated dishonest one within their budget. If the judge cannot tell the difference, no penalty structure can incentivize honesty, because the 'caught' state is unreachable. The mechanism fails at the verification step, not the incentive step."

  **Soft Spot:** This assumes the judge's error rate is zero on verifiable claims. If the judge can detect obfuscation *sometimes*, incentives might reduce the risk enough for practical purposes.

  ### 5. The Training Dynamics Objection
  **Source:** Empirical ML Researcher (RLHF Specialist)
  **Severity:** Medium-High (Implementation Kill)
  **Idiom:** "Inductive bias," "Training dynamics," "Loss landscape."

  **The Challenge:** "You assume the debaters actively try to obfuscate. But through RLHF, we train models to be helpful and honest. The models develop an inductive bias against generating obfuscated arguments because they are penalized during training. The capability might exist, but the model won't use it."

  **Two-Minute Response:** "Training on current data cannot guarantee behavior on out-of-distribution inputs or against a superhuman adversary. If the system becomes superhuman, it may find regions of the argument space not covered in training. Relying on training dynamics to prevent obfuscation is an empirical gamble, not a safety guarantee. My result shows that if the capability emerges, the oversight fails."

  **Soft Spot:** If the workshop consensus is that "safety is a gradient problem," your categorical impossibility claim will be resisted as overly pessimistic.

  ### 6. The Fallibilist Objection
  **Source:** Formal Epistemologist
  **Severity:** Medium (Philosophical Standard)
  **Idiom:** "Justification," "Fallibilism," "Normative force."

  **The Challenge:** "You define soundness as requiring the judge to be certain. But scientific epistemology is fallibilist. We act on high probability, not proof. Why does oversight require the kind of certainty you demand? Isn't increasing the probability of truth sufficient?"

  **Two-Minute Response:** "For general scientific inquiry, fallibilism is fine. For *adversarial* oversight of superhuman systems, the stakes are existential. If there is a structural blind spot where a lie is indistinguishable from truth to the judge, the adversary can exploit that blind spot with 100% success. Increasing probability doesn't help if the error mode is systematic and exploitable."

  **Soft Spot:** This relies on the "existential risk" framing. If the audience views oversight as a routine engineering task, this normative leap seems exaggerated.

  ### 7. The Resource Scaling Objection
  **Source:** Economist / ML Researcher
  **Severity:** Low-Medium (Practical Constraint)
  **Idiom:** "Compute budget," "Scaling laws," "Marginal cost."

  **The Challenge:** "You assume a fixed bound on the judge. But we can scale the judge's compute. If we spend more on the judge than the debaters, the gap closes. Why not just make the judge stronger?"

  **Two-Minute Response:** "The premise of scalable oversight is that the judge is *weaker* than the system being overseen. If the judge must be stronger to verify the claims, we haven't solved the scaling problem; we've just pushed it up a level. We need oversight that scales *sub-linearly* with capability. My result shows debate does not do that for this class of questions."

  **Soft Spot:** If "sub-linear" isn't strictly required for the specific deployment scenario, this objection holds less water.

  ---

  ### 8. The Model Mismatch Challenge (The Dreaded One)
  **Source:** Hybrid (ML + Theory)
  **Severity:** Critical (Validity Kill)
  **Idiom:** "Formalization," "Mapping," "Assumptions."

  **The Challenge:** "Your theorem holds for the model you built, but does your model match the debate protocol? You model the judge as a strict polynomial-time algorithm checking logical proofs. But real debate involves natural language, heuristics, and semantic understanding. If the judge uses heuristic compression that your model doesn't capture, your 'impossibility' result doesn't apply to the actual system we are building. You've proven a limit on *proof verification*, not *debate*."

  **Two-Minute Response:** "This is the crux. If natural language allows for heuristic compression that bypasses computational bounds, then we are relying on magic, not mechanism. My claim is that any heuristic that reliably verifies these claims *is* an algorithm solving a hard problem. If the heuristic works, it implies the problem wasn't as hard as thought, or the heuristic is exploitable. I am challenging the community to show *how* the natural language interface circumvents the complexity bound without simply assuming the judge is smarter than the model allows."

  **Soft Spot:** This is your most vulnerable point. If natural language semantics *does* allow for efficient verification of high-complexity claims (e.g., via semantic entailment that is easier than logical proof), your mapping of "debate" to "bounded verification" is flawed. You must admit that if such a semantic shortcut exists, your result does not apply, but insist that no such shortcut is known or guaranteed.

  **Why this is dreaded:** It attacks the bridge between your philosophy and their engineering. If the map doesn't match the territory, the theorem is irrelevant.
