answer: |-
  You have raised a version of the so-called prior sign objection, and I grant you that it is the sharpest tool in the incompatibilist's kit against the original Frankfurt examples. However, I think you are conflating the metaphysical conditions required to make the counterfactual intervener reliable with the conditions required for moral responsibility in the actual sequence. The case does not beg the question because it does not assume that determinism is true in a way that undermines responsibility; rather, it assumes only that the agent's own character and reasons are sufficient to produce the action in the actual world. When I say her decision was settled by her standing character, I am not smuggling in a responsibility-destroying causal determinism; I am simply describing an agent who is fully committed to her choice. The warden's device ensures she lacks alternative possibilities, but it is causally inert in the actual scenario. The question at hand is whether that lack of alternatives *itself* exonerates her, and the case isolates that variable by keeping the actual causal history identical to a standard case of responsibility while removing the alternatives.

  Your dilemma forces a choice between the decision being settled or the device firing, but this presupposes that the only way a decision can be settled is via a mechanism that bypasses the agent's ownership. I deny that. In the actual sequence, Dana's signing is settled by her own greed and deliberation, not by the warden's compulsion. The existence of a neural precursor that allows the warden to predict her choice does not mean the precursor causes the choice in a way that bypasses her agency; it merely means her agency is reliable enough to be predicted. If you insist that any settled outcome removes responsibility, you are simply asserting the incompatibilist conclusion rather than arguing for it. The Frankfurt defender's point is precisely that responsibility tracks the actual source of the action—guidance control—rather than the availability of other paths—regulative control. Even if we grant your point that the case requires a prior sign, that sign is just a marker of her own impending decision, not an external constraint on the actual history. Therefore, the intuition stands: she is responsible because she acted on her own reasons, and the fact that she could not have done otherwise is irrelevant to that actual sequence ownership.
