answer: |-
  **The Case**
  Alex works a rotating shift schedule with two colleagues, who have stable preferences for specific days. Alex holds the Monday shift. On Friday night, feeling social, Alex strictly prefers the Saturday shift and pays a colleague $20 to swap Monday for Saturday. On Saturday night, feeling active, Alex strictly prefers the Sunday shift and pays the other colleague $20 to swap Saturday for Sunday. On Sunday night, feeling exhausted, Alex strictly prefers the Monday shift and pays the first colleague $20 to swap Sunday for Monday. Alex ends the week with the original Monday shift but $60 poorer. Alex is fully sophisticated: on Friday, Alex anticipates the subsequent swaps and regrets the entire sequence, yet at each moment of choice, the trade is strictly preferred given current energy levels and mood. No external fees exist; the loss is purely the cash sweeteners required to motivate the counterparty to accept each swap.

  **Walkthrough**

  **1. Theories Endorsing vs. Condemning**
  **Synchronic Rationality** (or Time-Slice Rationality) endorses every individual step. At $t_1$, Alex prefers Saturday + $0$ over Monday + $20$; at $t_2$, Sunday + $0$ over Saturday + $20$, etc. Since preferences are complete and transitive *at each instant*, maximizing utility at that slice mandates the trade. **Diachronic Rationality** (or Global Rationality/Planning Agency) condemns the sequence. It views the agent as a single entity extended over time and judges the outcome (Monday shift - $60$) as strictly dominated by the starting point (Monday shift + $0$).

  **2. The Pumping Feature**
  The feature doing the work is **cyclical preference change**. Unlike a standard money pump, which relies on synchronic intransitivity ($A \succ B \succ C \succ A$ all at once), this relies on diachronic inconsistency ($A \succ_{t1} B$, $B \succ_{t2} C$, $C \succ_{t3} A$).

  **3. The Deletion Test**
  If you delete the preference shift (stabilize Alex's tastes), the case **dissolves entirely**; no trades occur, so it becomes neither an intransitivity pump nor a weakness-of-will story. This is crucial: it shows the problem is distinct from standard logical incoherence. However, if you delete the *authority of the current preference* (i.e., if you impose a norm that past plans bind future selves) and Alex trades anyway despite a prior resolution not to, *then* it degenerates into a plain **weakness-of-will (akrasia)** story. The pump only functions because the theory of rationality grants normative authority to the time-slice over the plan.

  **4. The Time-Slice Objection**
  A proponent of **Time-Slice Rationality** (e.g., Brian Hedden) attacks the case by denying the normative significance of the sequence. They argue there is no "global agent" to suffer the loss; there is only Alex-at-$t_1$, Alex-at-$t_2$, and Alex-at-$t_3$. Alex-at-$t_1$ made the best choice for Alex-at-$t_1$. The fact that Alex-at-$t_3$ is poorer is irrelevant to the rationality of Alex-at-$t_1$'s decision, just as your neighbor's poverty doesn't make your spending irrational. They view the demand for diachronic consistency as a category error, conflating prudential advice ("you'll regret this") with rational requirement ("this is incoherent").

  **5. Settled vs. Contested**
  Be straight: **Synchronic coherence is largely settled.** Almost no one defends synchronic intransitivity; Dutch Book and Money Pump arguments are accepted as decisive for static choice. **Diachronic coherence is genuinely contested.** There is no consensus on whether rationality requires us to constrain our future selves to satisfy our current plans. **Resoluteness** (sticking to a plan despite changed preferences) is viewed by some (e.g., Michael Bratman) as a constitutive norm of agency, and by others (e.g., Ed McClennen, though he argues for sophisticated choice, or Hedden) as irrational stubbornness that ignores new information (including new preferences). Your seminar should focus here: is the loss of $60 a failure of *rationality* or merely a failure of *prudence*? The field has not decided.
