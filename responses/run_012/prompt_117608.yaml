answer: |-
  The comparison between *An Inspector Calls* and Peter Singer's drowning child argument is seductive because both seek to collapse the distance between the comfortable observer and the suffering victim. However, to treat Priestley's play as a mere dramatisation of Singer's principle is to flatten the philosophical texture of both. Singer's argument is utilitarian and individualistic, rooted in the capacity to prevent harm; Priestley's is communitarian and structural, rooted in the constitutive ties of society. When we test the play against the three specific tensions you have identified, the rescue model begins to fracture.

  Regarding the first point, the nature of the harm, you are correct to suspect that the play displaces the positive duty to rescue in favour of a duty not to participate in an unjust structure. Singer's pond presents a discrete emergency: a bad thing happens unless I intervene. The Birlings, however, are not bystanders who happen upon a crisis; they are architects of the conditions that make the crisis inevitable. Arthur Birling's decision to sack Eva Smith is not a failure to pull her from the water; it is the act of pushing her in, justified by the economic logic of low wages and high profits. Sybil Birling's refusal of aid is not an omission born of ignorance, but a commission born of class prejudice. Priestley is not arguing that the Birlings failed to be charitable enough; he is arguing that their ordinary social functioning is predatory. Consequently, the play does not vindicate Singer's positive duty to prevent harm at small cost. Instead, it argues for a negative duty to refrain from actions that sustain exploitative systems, even when those actions are legally and socially sanctioned. The obligation is not to save Eva Smith from the outside, but to cease being the mechanism that destroys her. This is a claim about justice, not benevolence.

  This leads directly to the second point: the victim. Singer's argument relies heavily on the psychological immediacy of the identifiable victim to bypass our moral numbness. Priestley, conversely, deliberately withholds this certainty. By showing the photograph to one person at a time, the Inspector allows for the possibility that there was no single girl, but many. The family's relief upon discovering the Inspector may be a hoax hinges precisely on this fragmentation; if there is no single identifiable corpse, their specific guilt dissolves. This suggests that Priestley is not correcting Singer's reliance on the identifiable victim, but rather diagnosing the moral weakness that makes such reliance necessary. The play demonstrates that without the coercive presence of the Inspector—or the certainty of a specific body—human beings revert to statistical numbness. Sheila and Eric feel the guilt regardless of the photograph's authenticity, but Arthur and Sybil require the concrete evidence to feel bound. Priestley shows us that while the moral obligation should extend to the abstract class of 'Eva Smiths', human moral motivation rarely survives without the identifiable individual. In this sense, the play exposes a limitation in Singer's model: it assumes rational agents will act on the principle, whereas Priestley shows us that agents require a narrative of specific suffering to feel the force of the principle. The play is wishful thinking only if one believes the Inspector's lesson sticks; the ending suggests it likely will not.

  Third, on causation and demandingness, the play complicates Singer's individualism. Singer insists that my obligation is not diminished by the inaction of others; if I am one of millions who could save a child, I must still do my part. Priestley's Inspector proposes a model of collective responsibility: 'We are members of one body. We are responsible for each other.' This is not the sum of individual fair shares; it is a shared liability. The chain of causation in the play is distributed, yet the Inspector treats the guilt as cumulative rather than divisible. The ending dramatises the demandingness objection perfectly. When the immediate pressure is removed (the Inspector leaves), the family rationalises their way out of the obligation, citing the lack of legal proof and the possibility of different girls. This is the psychological reality of the demandingness problem: when the cost of moral consistency becomes too high (social scandal, admitted guilt), agents look for loopholes. The second telephone call reinstates the demand, suggesting that the obligation is objective and inescapable, regardless of their subjective relief. However, unlike Singer, who acknowledges the gap between his argument and his own advocacy, Priestley offers no such honesty. The play demands total conversion, yet provides no mechanism for sustaining it once the curtain falls. It vindicates the principle of collective responsibility but offers a pessimistic view of our capacity to bear it without external coercion.

  The ground of obligation in the play is therefore distinct from Singer's. Singer appeals to impartial benevolence: suffering is bad, and distance is morally irrelevant. Priestley appeals to social interdependence: we are bound together in a specific community, and harm to one is harm to the structure that supports all. This difference matters. Singer's argument is cosmopolitan and applies to a child in Bengal as much as in the pond. Priestley's argument is societal; the Inspector speaks of 'millions of Eva Smiths and John Smiths' still left with us, implying a national body politic. Singer asks us to be effective altruists; Priestley asks us to be good citizens. The play adds to the debate what argument cannot: it reveals the affective resistance to moral truth. Singer's essay appeals to reason; Priestley's play appeals to shame. It shows that obligations are not merely recognised but must be felt, and that feeling is fragile. It demonstrates how privilege constructs epistemic barriers—the Birlings literally cannot see the consequences of their actions until they are forced to recount them. The play shows that moral knowledge is not just propositional but narrative; we resist obligation by refusing the story that connects us to the victim.

  Where the play resists the reading you proposed is in its refusal to offer a clean utilitarian calculus. Singer asks us to weigh costs and benefits. The Inspector offers no such calculation; he offers only condemnation. There is no discussion of whether Arthur Birling could have afforded to keep Eva on without ruin; the act itself is the sin. Furthermore, the play's ambiguity regarding the Inspector's identity (is he a ghost, a socialist, God?) suggests that the ground of obligation is metaphysical or spiritual, not merely practical. Singer's argument works even if no one is watching; the Birlings behave morally only when they believe they are being watched.

  Ultimately, Priestley does not simply illustrate Singer's thesis; he exposes the sociological and psychological conditions required for such a thesis to hold water. He shows that without a sense of shared social body, the logic of the drowning child collapses into a series of discrete, deniable transactions.

  Verdict: COMPLICATES – The play shifts the ground from individual rescue to structural complicity and reveals that without a sense of collective identity, the moral demand collapses under the weight of psychological resistance.
