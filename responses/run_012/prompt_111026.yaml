answer: |-
  **Exam Question**

  Consider three predicates applicable to emeralds, all purportedly projecting "green" on past data: (a) Grue (green pre-2100, blue post); (b) Meridigrue (green north, blue south); (c) Retrogrue (blue pre-2020, green post). For (b) and (c), does Goodman's entrenchment solution yield the correct inductive verdict? Use these cases to argue whether the New Riddle is fundamentally about temporal predicates or linguistic weirdness. Finally, address the charge that entrenchment is circular: does distinguishing these cases require prior inductive judgments that undermine the solution? No citations needed.

  **Model Answer**

  Goodman's entrenchment solution selects "green" over "grue" because "green" has a history of successful projection in our linguistic community. Applied to (b) Meridigrue, entrenchment yields the intuitively correct verdict: "green" is deeply entrenched, while "meridigrue" is a gerrymandered novelty. However, this case reveals a crucial distinction: the failure of Meridigrue is not merely linguistic but empirical. Unlike Grue, which waits for 2100 to diverge from "green", Meridigrue diverges across space. One can travel south of the equator this afternoon and examine an emerald. If it is green, Meridigrue is falsified. Thus, Meridigrue represents a live empirical hypothesis subject to immediate testing, rather than a logical paradox of induction based on future uncertainty. Entrenchment aligns with intuition here, but the real epistemic work is done by spatial testability and background geological knowledge, not just linguistic history. This shows that not all "grue-like" predicates are equally problematic; some are merely false empirical claims disguised as logical puzzles.

  Case (c) Retrogrue is fundamentally different. By definition, it predicts blue for emeralds examined before 2020. Since all observed emeralds were examined before 2020 and are green, Retrogrue is empirically falsified by past data. It does not satisfy the fundamental condition of the New Riddle: fitting all available evidence. Therefore, it is not a paradox at all; it is simply a false hypothesis. This demonstrates that the New Riddle is not essentially about temporal predicates or syntactic weirdness. Retrogrue is temporal and structurally similar to Grue, yet it fails trivially. The core issue is constructing rival hypotheses that are logically compatible with all past evidence but diverge in unobserved cases. Grue succeeds formally where Retrogrue fails; Meridigrue fails empirically where Grue waits. Distinguishing these cases buys us clarity on the type of underdetermination at play: Grue is underdetermined by data and logic; Meridigrue is underdetermined by data alone; Retrogrue is determined by data.

  This distinction forces a confrontation with the circularity charge against entrenchment. Entrenchment solves the riddle by appealing to past linguistic practice: "green" is projectible because it has been projected successfully. But this invites the regress: why was it legitimate to project "green" in the past? If the answer is "because it is projectible," the justification is circular. Entrenchment describes our inductive habits but does not normatively justify them independent of those habits. In distinguishing (b) and (c), we rely on the fact that "green" was successfully entrenched previously. But confirming that success requires assuming "green" was the correct predicate to use then. We judge "meridigrue" as unentrenched because it wasn't used, but we didn't use it because we judged it unprojectible. Thus, entrenchment codifies inductive success without explaining the underlying basis for that success. It tells us which predicates we *do* use, not necessarily which we *should* use, unless "should" is defined purely by conformity to past practice. Goodman might argue that justification is internal to the practice, but this concedes that entrenchment cannot answer the skeptic who questions the practice itself. Ultimately, these cases show that while entrenchment tracks our intuitions, it masks the empirical falsifiability of spatial variants and the logical falsification of past-dependent variants, while resting on a justification that risks circularity regarding why past practice was valid. The riddle persists because entrenchment offers a sociological solution to a logical problem, resolving the selection of predicates without grounding the validity of the projection itself. Consequently, the student must recognize that entrenchment is a descriptive tool within a system, not an external validation of that system's reliability.

  **Marking Scheme**

  1.  **Identifies Meridigrue as empirically testable:** States that (b) can be falsified immediately by spatial sampling (going south), distinguishing it from Grue's temporal uncertainty.
  2.  **Identifies Retrogrue as falsified:** States that (c) contradicts past data (pre-2020 exams were green, not blue), so it is not a live paradox.
  3.  **Rejects time/weirdness as essential:** Argues that since (b) and (c) vary in space/time and status, the riddle concerns evidence-compatibility and divergence, not specific predicate syntax.
  4.  **Affirms entrenchment verdicts with caveats:** Acknowledges entrenchment selects "green" correctly for (b) and (c) but notes it misses the empirical/logical distinctions identified above.
  5.  **Confronts circularity:** Argues that entrenchment relies on past projectibility judgments to justify current projectibility, describing practice rather than normatively grounding it.

  **Where They Go Wrong**

  1.  Treats Meridigrue as purely logical/untestable like Grue rather than a live empirical hypothesis.
  2.  Treats Retrogrue as a live competing hypothesis rather than recognizing it is falsified by past data.
  3.  Claims the riddle is essentially about temporal predicates or syntactic weirdness based on these cases.
  4.  Says entrenchment fails to select Green or succeeds without noting it masks empirical differences.
  5.  Ignores the circularity charge or claims entrenchment fully justifies induction without presupposing past success.
