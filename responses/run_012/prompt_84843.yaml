  Working Note: Agreed: Blame is normative address; standing is a normative constraint; hypocrisy is pro tanto wrongful. Discard: "Blame requires agency" (too broad). Cruxes: Whether standing is alienable by conduct (A) or invariant under authorization (B); whether case (1) restores standing or confirms it never lapsed. Key divergence: Is standing a right to demand or a relational precondition? Case (6) tests if agency is required for standing.

  ***

  **1. Agreed Claims**

  1.  Blame functions as a normative address that holds a target accountable to a standard.
  2.  Standing operates as a normative constraint on blame distinct from the truth or fittingness of the blame's content.
  3.  Hypocrisy constitutes a distinct moral wrong independent of the wrong being blamed.
  4.  The case battery isolates the blamer's moral record from the blamee's culpability to test the source of standing. (Flagged: Potentially vacuous if "record" is defined inconsistently across camps.)
  5.  Both camps agree that there are conditions under which a blamer lacks the authority to blame, even if the blamee is guilty.
  6.  Neither camp holds that lacking standing renders the blamee innocent of the underlying wrongdoing.

  **2. Table of Disagreements**

  | Question at Issue | Camp A (Self-Relation) Formulation | Camp B (Authorization) Formulation | What Turns on the Answer |
  | :--- | :--- | :--- | :--- |
  | **Source of Standing** | Standing derives from the blamer's own participation in the moral relationship as a partner in good standing. | Standing derives from external authorization (community membership, role, or relation to victim). | Whether standing is an internal relational status or an external normative permission. |
  | **Alienability** | Standing is alienable; violating the standard one demands forfeits one's status as a participant in good standing. | Standing is inalienable regarding record; authorization persists regardless of the blamer's own violations. | Whether a hypocrite's blame is impermissible (A) or merely liable to counter-criticism (B). |
  | **Effect of Record** | A blamer's record directly determines the validity of the speech act of blaming. | A blamer's record determines the blamer's liability to criticism, not the validity of the speech act. | Whether the defect lies in the *act* of blaming or in the *character* of the blamer. |

  **3. Cruxes and Pre-Registered Predictions**

  | Case | Camp A Prediction | Camp B Prediction | Embarrassment Condition |
  | :--- | :--- | :--- | :--- |
  | **(1) Past wrong, amended** | Standing is restored. The repair of the self-relation reinstates the authority to address. | Standing was never lost. Authorization persists regardless of the past wrong; amendment affects fittingness only. | **A:** If intuition suggests standing never lapsed. **B:** If intuition suggests standing was temporarily voided. |
  | **(2) Current wrong** | No standing. The ongoing violation negates the claim to participate in the moral relationship. | Standing intact. Authorization remains; the blamer is hypocritical but licensed to blame. | **A:** If intuition permits the hypocrite to blame. **B:** If intuition forbids the hypocrite from blaming. |
  | **(3) Different wrong** | No standing. Violation of comparable standards undermines the claim to moral partnership generally. | Standing intact. Authorization is specific to the standard demanded or community membership, not general virtue. | **A:** If specific virtue is deemed unnecessary for standing. **B:** If general moral integrity is deemed necessary for authorization. |
  | **(4) Constitutionally incapable** | No standing. Innocence without resistance fails to establish the requisite moral participation. | Standing intact. Membership in the moral community suffices for authorization regardless of temperament. | **A:** If non-resistance is deemed sufficient for partnership. **B:** If resistance is deemed necessary for membership. |
  | **(5) Proxy blame** | No standing. The proxy's own record blocks the address even if speaking for a victim. | Standing intact. Authorization via the victim's relation overrides the proxy's personal record. | **A:** If proxy authority is seen as independent of proxy virtue. **B:** If proxy authority is seen as dependent on proxy virtue. |
  | **(6) Artificial System** | No standing. Lacks capacity for moral relationship required for self-relation. | No standing. Lacks community membership or role required for authorization. | **Both:** If intuition grants standing to non-agents. (Divergence lies in *why* standing is absent.) |

  **4. Verbal Dispute Analysis**

  There is a partial verbal dispute regarding the term "standing." Camp A uses "standing" to denote a relational status contingent on moral conduct, whereas Camp B uses "standing" to denote a normative license contingent on structural authorization. However, the dispute is not merely verbal. Once terminology is fixed—distinguishing between *relational status* and *normative license*—a substantive disagreement remains regarding the conditions under which a blame address is defective. Camp A contends the address itself is nullified by hypocrisy; Camp B contends the address is valid but the blamer is morally liable. The substantive core is whether the norm governing blame is internal to the relationship (A) or external to the agent's conduct (B).

  **5. Closing Statements**

  **Camp A (Self-Relation):** We would change our mind if it were demonstrated that the normative force of blame derives exclusively from community structure rather than interpersonal reciprocity, or if cases of justified hypocritical blame could be shown not to undermine the relational demand.

  **Camp B (Authorization):** We would change our mind if it were demonstrated that hypocrisy renders the speech act of blame infelicitous rather than merely making the blamer liable to criticism, or if authorization could be shown to be inherently contingent on moral conduct.

  *Signed,*

  *Camp A (Self-Relation)*

  *Camp B (Authorization)*
