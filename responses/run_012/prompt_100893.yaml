answer: |-
  ### Exam Question

  **Topic: Unilateral Action and Epistemic Correlation**

  Consider a scenario in which a large number $N$ of independent laboratories possess the authority to unilaterally deploy a novel prophylactic intervention. Each lab conducts an independent analysis based on a shared body of evidence. For any single lab, acting alone, the expected value is positive: there is a modest probability of a significant benefit, a modest probability of a comparable harm, and otherwise no effect. However, the aggregate dynamics are structured by two constraints: (1) **Benefit Saturation**, where the total social benefit is captured almost entirely by the first deployment, rendering subsequent deployments redundant; and (2) **Harm Accumulation**, where the risk of catastrophic side effects increases linearly with the number of distinct labs deploying the intervention, crossing a dangerous threshold if too many act. Furthermore, because the labs share evidence and analytical frameworks, their error terms are positively correlated; if one lab is overly optimistic, others likely are as well.

  Based on this scenario, answer the following:

  (a) Reconstruct the condition under which individually rational decisions lead to a collectively negative outcome. Express this as a relation between the marginal benefit schedule and the marginal harm schedule, and explain why this constitutes a coordination failure rather than mere miscalculation.

  (b) Assess the normative principle that a lab should act only if it would endorse every lab in its epistemic position acting likewise. Given the correlation of estimates, does this principle yield a determinate recommendation, and does it resolve the coordination failure or merely relocate the burden?

  (c) Evaluate a governance mechanism granting any single lab a **unilateral veto** over all deployments. Does this eliminate the unilateralist's curse, or does it introduce a distinct failure mode? On what factors does the net value of this fix depend?

  (d) Briefly describe the mirror-image case where actions are strategic complements rather than substitutes (i.e., independent action leads to undershooting). Explain why the unilateral veto is precisely the wrong remedy in that context.

  ***

  ### Model Answer

  The collective failure arises from the divergence between private and social marginal valuations. Let $MB(n)$ be the marginal social benefit of the $n$-th deployment and $MH(n)$ be the marginal social harm. Due to benefit saturation, $MB(1)$ is high, but $MB(n) \approx 0$ for $n > 1$. Conversely, due to harm accumulation, $MH(n)$ increases with $n$. Individually rational action occurs when a lab perceives $Private\ EV > 0$. However, collective rationality requires $\sum MB(n) > \sum MH(n)$. The curse manifests when $N \times Private\ EV > 0$ but $\sum MH(n) > MB(1)$. This is a coordination failure because each lab imposes a negative externality on the others: by acting, they consume the saturated benefit (making others' actions redundant) while adding to the cumulative risk pool. It is not mere miscalculation because, ex ante, each lab is correct that their solo action would be beneficial; the error arises only from the uncoordinated simultaneity of actions.

  The "endorse everyone" norm (a Kantian filter) requires a lab to ask: "What if all labs who see this evidence act?" Given positive epistemic correlation, the counterfactual "everyone acts" is not remote; if my evidence suggests action, it likely suggests action to others. Since harm accumulates with $n$, endorsing universal action implies endorsing catastrophic risk. Thus, the norm yields a determinate recommendation: do not act. This resolves the coordination failure by aligning individual incentives with the aggregate harm schedule. However, it relocates the burden to epistemic humility. It requires labs to discount their positive solo EV not because their data is wrong, but because their epistemic position is not unique. If labs doubt the correlation or the severity of accumulation, the norm loses force.

  A unilateral veto empowers any lab to block deployment. This effectively sets the threshold for action to $N$ consents. This eliminates the curse of over-action (commission error) because a single cautious lab can prevent the accumulation of harm. However, it substitutes a failure of omission. If even one lab is excessively risk-averse, misguided, or malicious, beneficial deployment is permanently blocked. The net value of the veto depends on the asymmetry of errors. If the cost of catastrophic harm (false positive) vastly exceeds the cost of delayed benefit (false negative), the veto is justified. If the harm threshold is high and the benefit urgent, the veto creates paralysis that is costlier than the risk accumulation.

  The mirror-image case involves strategic complements, such as funding a public good with a provision threshold. Here, $MB(n)$ increases with $n$ (critical mass), and independent action leads to undershooting. Applying a unilateral veto here is catastrophic: any single dissenter can prevent the group from reaching the necessary threshold, guaranteeing the failure of a potentially high-value project. In complement cases, the remedy is assurance mechanisms or subsidies to encourage participation, not veto rights that exacerbate the coordination problem by lowering the probability of reaching the critical mass.

  ***

  ### Marking Scheme (20 Marks)

  **Part (a): Condition & Coordination (5 Marks)**
  *   **3 Marks:** Correctly identifies the divergence: Marginal Benefit declines/saturates rapidly while Marginal Harm accumulates/increases. States that collective negative outcome occurs when Total Harm > First-Mover Benefit.
  *   **2 Marks:** Explains this is a coordination failure (externalities/redundancy) rather than individual error (solo EV is genuinely positive).
  *   *Common Error:* Treating it as simple aggregation of errors without referencing the saturation/accumulation structure.
  *   *A vs B:* A-grade answers explicitly define the marginal schedules; B-grade answers describe the outcome qualitatively without the marginal relation.

  **Part (b): Kantian Norm (5 Marks)**
  *   **3 Marks:** Notes that epistemic correlation makes the "everyone acts" counterfactual probable, forcing the agent to internalize the cumulative harm.
  *   **2 Marks:** Identifies that this cures over-action but relocates the burden to epistemic humility/discipline (relying on self-restraint).
  *   *Common Error:* Ignoring the correlation clause and treating the "everyone" scenario as unlikely.
  *   *A vs B:* A-grade answers discuss the relocation of the burden; B-grade answers simply say "it stops the action."

  **Part (c): Unilateral Veto (5 Marks)**
  *   **3 Marks:** Identifies that veto removes over-action but introduces paralysis/holdout risk (omission error).
  *   **2 Marks:** States the net value depends on the asymmetry of costs (catastrophe vs. delay).
  *   *Common Error:* Assuming the veto is an unqualified good or unqualified bad without trade-off analysis.
  *   *A vs B:* A-grade answers explicitly frame this as a trade-off between Type I and Type II errors; B-grade answers focus only on the prevention of harm.

  **Part (d): Mirror Image (5 Marks)**
  *   **3 Marks:** Correctly identifies the complement case (undershooting/threshold public goods).
  *   **2 Marks:** Explains veto is harmful here because it lowers the probability of reaching the critical mass needed for any benefit.
  *   *Common Error:* Failing to distinguish between substitutes (curse) and complements (mirror).
  *   *A vs B:* A-grade answers link the veto's failure to the structure of complements; B-grade answers vaguely mention "public goods."

  **Distinction Criteria**
  *   **A (17-20):** Integrates all four moves into a coherent argument; uses marginal language precisely; identifies trade-offs rather than absolute solutions.
  *   **B (13-16):** Addresses all four parts but treats them as isolated questions; qualitative rather than structural analysis; misses nuance on correlation or error asymmetry.
