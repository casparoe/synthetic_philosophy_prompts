  Dear Colleague,

  It is a pleasure to engage with you on this problem, which strikes me as one of the most fertile testing grounds for the limits of anthropic reasoning. You and your friend have constructed a variant that isolates the tension between physical token distinctness and qualitative identity in a way that the standard Sleeping Beauty or Incubator cases often obscure. You have asked for my credence in the specific claim that an agent reasoning correctly in this duplication variant should have a credence of approximately one in tails, and you have asked me to decompose that number according to four specific philosophical hinges. I will begin by telling you that my credence in that claim is roughly point five six. This places me slightly closer to your friend than to you, but my hesitation is significant enough that I suspect I understand the source of your unease. To explain how I arrive at point five six, I must walk you through the four sub-questions you identified, assigning a probability to each that reflects how much my final judgment relies on that particular premise holding true.

  The first and most foundational sub-question is whether the self-indication assumption is the correct framework for self-locating belief in the first place, as opposed to the self-sampling assumption or some hybrid like full non-indexical conditioning. My credence that the self-indication assumption is the broadly correct framework is about point eight. I lean this way primarily because the self-sampling assumption generates the Doomsday Argument, which implies that we should have been surprised to find ourselves living in an era with a relatively small past population compared to the potential future, a conclusion that feels like an artifact of the reference class selection rather than a genuine empirical discovery. The self-indication assumption avoids this by favoring hypotheses with more observers, which aligns better with standard Bayesian updating in cosmological contexts. However, I cannot assign a probability of one because the Presumptuous Philosopher objection remains a serious worry; if the self-indication assumption allows us to be overconfident about the size of the universe simply because we exist, it risks violating the principle that empirical evidence should constrain our beliefs about the physical world. Since the claim you are evaluating depends on the self-indication assumption being the operative rule, point eight of my confidence rests here, for if the self-sampling assumption is correct, the credence in tails reverts to one half regardless of duplication.

  The second sub-question concerns whether exact duplicates at a single time should be counted as one observer or as many for anthropic purposes. Conditional on the self-indication assumption being the correct framework, my credence that these duplicates count as many distinct observers is roughly point eight five. This is where your suspicion and your friend's confidence likely find their battleground. My reasoning is that the self-indication assumption is typically cashed out in terms of physical instantiations of observer-moments. Even if the two billion observers are qualitatively identical at the moment of waking, they occupy distinct spatial locations and have distinct causal futures, which is sufficient for token distinctness in most physicalist ontologies. If there are two bodies, there are two observers, even if their internal states are perfectly isomorphic. However, I withhold full confidence because there is a compelling argument that indexical reference requires a primitive this-ness that qualitative identity might undermine. If I cannot distinguish myself from my duplicate even in principle at the moment of waking, does the concept of I refer to a unique individual or to the qualitative state? If the latter, the count collapses to one. I assign point eight five because I think physical distinctness usually trumps qualitative identity in anthropic counting, but I acknowledge that the duplication variant is specifically designed to stress this intuition.

  The third sub-question is whether the proper unit of analysis is the individual, the observer-moment, or the centered world. My credence that the observer-moment is the correct unit, which supports the self-indication verdict in this case, is about point nine. This factor is less controversial in the literature than the first two. Most contemporary treatments of self-locating belief, including those by Bostrom and Bradley, treat observer-moments as the relevant entities for probability assignments because individuals persist through time and change their self-locating information. In your scenario, the divergence happens a moment after creation, so treating the waking instant as a distinct observer-moment is natural. If we treated the individual as the unit, we might worry about the identity conditions across the divergence, but since the question asks about the credence at the instant of creation, the observer-moment framework is the most robust tool we have. I assign this a high probability because rejecting it would require a radical overhaul of how we model temporal self-location, which seems unnecessary for solving this specific puzzle.

  The fourth and final sub-question is whether the question has a determinate answer at all, rather than being underdetermined by the constraints of rationality or settling into a mere bookkeeping convention. Here my credence drops significantly to about point six. This is the primary drag on my final number. There is a growing sentiment in the philosophy of science, championed by figures like Arntzenius and Titelbaum, that some anthropic puzzles are not questions about the world but questions about how we choose to index our language. If the answer is merely a convention, then the claim that an agent should have a credence of approximately one is false, because there is no rational requirement to adopt one convention over another. The duplication variant exacerbates this by making the distinction between the heads and tails observers purely numerical rather than qualitative. If rationality does not dictate a specific way to count qualitatively identical tokens, then the credence is indeterminate. I assign point six because while I hope there is a fact of the matter, the lack of a decision-theoretic penalty for choosing the wrong credence in this specific setup suggests we might be in the realm of verbal dispute.

  To explain how these combine into my final number of point five six, I do not simply multiply them as independent probabilities, because they are highly correlated. If the self-indication assumption is correct, it is much more likely that duplicates count as many and that observer-moments are the unit. Therefore, I treat the first three sub-questions as a coherent package, a self-indication worldview, to which I assign a joint probability of roughly point seven. This package entails that if the question is determinate, the answer is tails with high probability. I then treat the determinacy question as a multiplier on that package. If the question is indeterminate, the claim fails regardless of the framework. So, I take the point seven confidence in the self-indication package and multiply it by the point six confidence in determinacy, which yields point four two. However, I add a small buffer because even if the question is partially indeterminate, the self-indication reasoning is still the most pragmatically useful guide, nudging my final credence up to point five six. This calculation shows that while I lean toward your friend's conclusion, a substantial portion of my uncertainty is driven by the same metaphysical worries that drive your skepticism.

  Regarding which single sub-question my answer is most sensitive to, it is undoubtedly the fourth one, the question of determinacy. If I were convinced that there is a fact of the matter about what rationality requires in this case, my credence in the claim would jump from point five six to roughly point seven, reflecting my confidence in the self-indication package. Conversely, if I became convinced that all anthropic probability is merely a matter of linguistic convention without truth conditions, my credence would plummet to near zero, because the claim asserts a normative should that would no longer exist. The metaphysics of duplication is important, but it is secondary to the meta-ethical question of whether there is a correct answer to be had. This sensitivity suggests that the debate between you and your friend might be stalled not because of the physics of the duplicates, but because you are operating with different assumptions about whether rationality dictates a unique solution in underdetermined indexical cases.

  This leads me to where I believe you and your friend most plausibly diverge. Your friend, with a credence of point nine, likely assumes that the determinacy question is settled and that the counting of duplicates is trivial given physical distinctness. He probably assigns a probability near one to the idea that distinct bodies count as distinct observers regardless of qualitative identity. You, with a credence of point four, likely suspect that qualitative identity undermines the counting mechanism or that the determinacy condition is not met. I suspect the core divergence is on the second sub-question, the counting of duplicates. Your friend sees the billion bodies and counts a billion observers; you see one qualitative state and worry that counting them as billion is a category error. He views the duplication as a red herring because the physical tokens are distinct; you view it as the crux because the indexical reference seems to lack a unique anchor. If I had to place a wager on it, I would say your friend assigns a probability of point nine five to the counting premise, while you assign it something closer to point five, and this difference alone accounts for the gap between your point four and his point nine.

  Finally, you asked what argument, counterexample, or formal result would move my number the most in either direction. The single thing that would move my credence most decisively is a rigorous Dutch Book argument that applies specifically to the duplication variant. If it could be shown that an agent with a credence of one half is susceptible to a sure loss in a betting scenario that respects the physical setup of the duplication, while an agent with a credence of one is not, or vice versa, it would resolve the determinacy question. Currently, the lack of a clear decision-theoretic penalty is what fuels my skepticism about determinacy. A formal proof that rational action requires one credence over the other would bypass the metaphysical quibbles about counting and convention. It would demonstrate that the answer is not a matter of how we define observers, but of how we must act to avoid exploitation. Such a result would likely raise my credence in the claim to above point eight if it favored the self-indication verdict, or lower it to below point two if it favored the self-sampling verdict, because it would settle the fourth sub-question definitively. Until such a proof is offered, I remain suspended between the intuitive pull of the self-indication assumption and the metaphysical unease your duplication variant so effectively generates.

  I hope this decomposition helps you and your friend locate the precise fault line in your disagreement. It seems to me that you are both reasoning correctly from different premises about the nature of indexical facts, and that the resolution lies not in more thought experiments about coins and observers, but in a deeper analysis of the normative constraints on self-locating belief.

  Sincerely,

  A Colleague in Philosophy
