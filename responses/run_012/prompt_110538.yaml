prompt: |-
  I am a graduate student in philosophy of science, and for the past several weeks a friend and I have been working through the literature on self-locating belief — in particular Bostrom's distinction between the self-sampling assumption, on which you treat yourself as a random draw from the observers who actually exist in your reference class, and the self-indication assumption, on which you treat yourself as a random draw from all possible observers weighted by the probability of their existing, so that a hypothesis is favored in proportion to how many observers it contains. We have now stalled on a variant we constructed ourselves, and I would like your help. A machine flips a fair coin. On heads it creates a single observer, and that observer is you. On tails it creates a very large number of observers — call it a billion — and you are one of them, chosen uniformly at random. The wrinkle is that on tails all billion observers are created as exact duplicates of one another and of the lone observer in the heads case: identical bodies, identical memories, identical momentary experiences, and at the instant of creation nothing about the world distinguishes any of them from any other. They diverge only a moment later, when each begins to receive a different stream of experience. You wake at the instant of creation, before any divergence. The self-indication assumption appears to entail that your credence that the coin landed tails should be essentially 1, since your existence is a billion times more likely under tails; the self-sampling assumption appears to entail 1/2, since you were going to exist either way. My friend holds that the duplication is a red herring and that the self-indication verdict survives untouched; I suspect that once the observers are exact duplicates, the self-indication assumption's method of counting has either broken down or must be recast in terms of centered worlds or observer-moments rather than individuals, and that this may well change