      *   **Setup:** The 3x2 game is standard. $B$ is strictly dominated by $0.5T + 0.5M$.
      *   **Core Argument:** The claim is that allowing mixed strategies to dominate pure strategies assumes linearity (EU).
          *   *Math Check:* Yes, $0.5(1) + 0.5(0) = 0.5 > 0.4$. This requires the value of the mixture to be the average.
