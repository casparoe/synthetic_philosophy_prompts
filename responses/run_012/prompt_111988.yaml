prompt: |-
  Ok so my friend and I got into a huge argument last night about whether it's ever literally true to say an AI believes something — he reckons that when a model tells you the capital of Australia it "believes" Canberra in the same sense you or I do, and I reckon that's just us projecting a mind onto a text-predictor, and by the end we were both just repeating ourselves louder. I want to settle it with a proper case instead of vibes, so can you build me a thought experiment to order?

  Here's what I need it to do. I want a scenario where the intentional stance and the "it's got to be stored in there somewhere" picture of belief actually come apart — where the first says the thing believes P and the second says it doesn't (or the reverse, if that's the more interesting direction, you tell me which one is the hard one to build). Constraints: keep it realistic, something you could assemble today out of a language model plus a retrieval system or a long context window, no conscious androids, no exotic hardware, no uploading brains. One paragraph. And I want exactly one thing varied: hold the observable behaviour fixed and change only whether the content lives in the weights or gets assembled fresh from context on each pass. Everything else pinned.

  After the scenario, walk me through it: what the intentional stance says about the case and why, what the stored-representation account says and why, and be explicit about which feature of the case is doing the work. Then tell me what happens if I strip that feature out — if the content is baked into the weights instead, does the disagreement just collapse back into the boring case where everyone agrees? And give me the honest counter: if someone wanted to defend the intentional stance against my case, how would they go at it, and is that a good objection or a dodge?

  One more thing, and it's the bit I actually care about. The whole point of the case is to settle whether "the model believes P" is literally true or just a handy way of talking, so if you think that framing is confused, or that no thought experiment could settle it because the two sides aren't even disagreeing about the same thing, just say so straight rather than humoring me — I'd much rather be told my question is bad than get a tidy answer to a bad question. Same deal if the one-paragraph, one-variable constraint makes the case rig something, or if I've baked an assumption in that quietly begs the question. Call it out.
