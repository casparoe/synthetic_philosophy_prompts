answer: |-
  **MEMORANDUM**

  **TO:** Governing Board, Research Consortium
  **FROM:** Chair, Resource Allocation Committee (RAC)
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Instrument Allocation Mechanism (HPC & Cryo-EM)

  ### 1. Executive Summary

  The Resource Allocation Committee has reviewed the proposal to replace our current internal market for computing and microscopy time with a central optimization solver. After rigorous analysis, the Committee recommends adopting a **Hybrid Model**: we will retain the decentralized bidding and trading mechanism for allocation but reform the price-setting process to utilize the Vice-Chair's forecasting models.

  **Implementation Deadline:** The new price-discovery algorithm must be operational by the start of Q2 next fiscal year. Trading and bidding protocols will remain unchanged during this transition.

  This recommendation rejects the full centralization of allocation while acknowledging the deficiencies in our current price administration. It preserves the information-aggregating function of the market while correcting the arbitrariness of the price signals.

  ### 2. Context and Options

  We currently operate an internal market where the RAC sets administered prices per node-hour and microscope-hour. Institutes bid for time and may resell unused allocations. Our Vice-Chair proposes replacing this with a central optimizer: institutes would submit statements of need, and a solver would assign all hours to maximize aggregate scientific value, prohibiting post-allocation trading.

  The Board must choose among:
  1.  **The Optimizer:** Central assignment based on stated needs; no trading.
  2.  **The Status Quo:** Administered prices set by heuristic review; bidding and trading permitted.
  3.  **The Hybrid (Recommended):** Algorithmic price-setting based on forecasting models; bidding and trading permitted.

  ### 3. Theoretical Analysis: Knowledge, Prices, and Calculation

  The Vice-Chair's argument rests on the observation that our current prices are "arbitrary." She contends that if prices are administered by analysts rather than emergent from ownership, the market is a fiction that adds transaction costs without the benefit of price discovery. She argues a central solver, armed with historical data, can plan better than a flawed market.

  This memo confronts the economic theory underlying that claim to determine where it holds and where it fails in our specific context.

  **A. The Knowledge Problem vs. Ownership**
  The classical argument against central allocation (Hayek, 1945) posits that the knowledge required to make efficient decisions is dispersed, tacit, and context-dependent. It is not merely a matter of data processing but of local awareness (e.g., a sudden experimental breakthrough requiring immediate compute time, or a sample degradation risking a microscope slot).

  The Vice-Chair argues this problem depends on private ownership. This is incorrect. While private property provides the *incentive* to act on local knowledge, the *existence* of that knowledge is independent of ownership. Even in a consortium of common ownership, Institute A knows the urgency of its project better than the RAC. A "statement of needs" filed for an optimizer is cheap talk; a bid backed by a budget constraint is costly signaling. The market mechanism forces institutes to weigh opportunity costs locally. The optimizer removes this discipline, encouraging the overstatement of need.

  **B. The Trial-and-Error Rejoinder**
  A standard rejoinder to the knowledge problem is that a central board need not know everything directly; it can simulate the market by adjusting prices via trial and error (Lange-Lerner theorem). If utilization is high, raise prices; if low, lower them.

  For this to succeed in our context, three conditions must be met:
  1.  **Speed:** The feedback loop between price change and utilization data must be shorter than the planning horizon of the users.
  2.  **Granularity:** The analysts must distinguish between structural demand shifts and temporary noise.
  3.  **Neutrality:** The analysts must not impose their own scientific priorities on the price adjustments.

  Our current process (quarterly reviews by three analysts using spreadsheets) fails condition #1. By the time a price adjustment is made, the research opportunity may have passed. However, the Vice-Chair's forecasting model *could* satisfy condition #2 if used to set prices dynamically rather than to assign allocations directly.

  **C. The Calculation Problem**
  We must state plainly whether the "Socialist Calculation Problem" (Mises, 1920) applies here. In its strict sense, it does not. That argument relies on the absence of market prices for *capital goods* preventing rational cost accounting. Our instruments are already purchased capital goods held in common; we are not trying to calculate whether to *build* the cluster, but how to *use* it.

  However, a smaller, epistemic version of the problem remains. Because we lack a profit-and-loss signal at the institute level (budgets are largely fixed grants), we cannot measure "scientific value" in a common denominator. The Vice-Chair's optimizer requires a utility function to maximize "aggregate scientific value." No such function exists. Any weights assigned to different projects by the solver are effectively political decisions disguised as mathematical constraints. The market does not solve the valuation problem perfectly, but it pushes the valuation to the edge of the network where the science is happening, rather than centering it in the RAC.

  ### 4. Recommendation: The Hybrid Model

  We recommend the **Hybrid Model**.

  **Mechanism:**
  1.  **Allocation:** Decentralized. Institutes continue to bid for time and retain the right to resell unused allocations. This preserves the revelation of local knowledge and urgency.
  2.  **Pricing:** Centralized but Algorithmic. The RAC will adopt the Vice-Chair's forecasting model to set the base administered prices. The model will ingest historical utilization, seasonality, and maintenance schedules to output price recommendations.
  3.  **Oversight:** The RAC retains veto power on prices only in cases of extreme outlier deviation, preventing the model from pricing out critical strategic initiatives.

  **Rationale:**
  This approach accepts the Vice-Chair's premise that our current price-setting is too arbitrary and data-poor. It utilizes her engineering expertise to improve the *signal* (price) without discarding the *mechanism* (market) that allows users to respond to that signal based on private knowledge. It acknowledges that while we can forecast *demand* (load), we cannot forecast *value* (scientific outcome).

  ### 5. Implementation Path

  *   **Weeks 1-4:** Data Integration. The Vice-Chair's team will integrate historical bidding data and utilization logs into the forecasting model.
  *   **Weeks 5-8:** Shadow Testing. The model will run parallel to the current manual pricing process for one quarter. Discrepancies will be reviewed by the RAC.
  *   **Week 12:** Board Review. Presentation of shadow test results.
  *   **Week 16 (Start of Q2):** Go-Live. Model-determined prices become the official administered rates. Bidding and trading protocols remain active.

  ### 6. Weak Points and Conditions for Reversal

  This recommendation is not without risk. The strongest consideration against this Hybrid Model is the possibility that **scientific value is highly predictable ex-ante.**

  If the Vice-Chair's team can demonstrate, during the Shadow Testing phase, that the solver's allocation of time yields a higher correlation with high-impact publications than the market's allocation, the premise of this memo collapses. Specifically, if we find that:
  1.  >80% of the "value" of an instrument-hour is determined by the project design (knowable in the statement of needs) rather than the execution timing (knowable only to the user); **AND**
  2.  The transaction costs of the internal market (time spent bidding/trading) exceed 5% of the total operational budget;

  ...then the Board should reconsider the full Optimizer model. The market mechanism is only superior if it captures value that the central planner cannot see. If the value is visible centrally, the market is merely friction.

  **Evidence Required to Change Recommendation:**
  A pilot study in which a control group of institutes is assigned time via the Optimizer (no trading) while a treatment group uses the Market. If the Control Group produces statistically significantly higher scientific output per node-hour over two quarters, the Committee will recommend transitioning to the full Optimizer.

  ### 7. Conclusion

  We are not choosing between planning and chaos. We are choosing between centralizing the *intelligence* (Optimizer) or decentralizing the *intelligence* (Market). Given that scientific discovery is inherently uncertain and local, the Hybrid Model offers the most robust path: using data to set the cost of resources, but using the market to determine their worth.

  **Approved for Circulation:**
  [Signature]
  Chair, Resource Allocation Committee
