answer: |-
  Dear colleague,

  You know that stale air feeling well, the one that settles in a workshop room when the same debate cycles back around for the third time that day. You are right to want the spec sheet before you start dialing for quotes, because the debate persists precisely because everyone is arguing past one another with different implicit criteria for what counts as a legitimate lie. If you are looking for a unified theory of legitimate idealization that tells us exactly when a false assumption is acceptable and when it poisons the result, I have to tell you upfront that such a theory does not exist, and likely cannot exist in the universal form you are hoping for. However, we can draft the desiderata for what such a theory would have to achieve if it were possible, and in doing so, we can see exactly where the machinery jams.

  To begin with, any credible account of idealization must be able to distinguish between a simplification that isolates a mechanism and a simplification that manufactures a result. It needs to explain why the ideal gas law works beautifully despite assuming particles have no volume and no attraction, while rational-actor economics often fails despite assuming agents have perfect information and infinite computational power. The theory must account for the frictionless plane, where ignoring friction allows us to see the underlying Newtonian dynamics, versus a fisheries model where ignoring predator saturation leads to collapse predictions that never happen. It has to handle the SIR-style epidemic models that assume everyone mixes with everyone else, which works for early-stage exponential growth but fails for structured populations, and it must reconcile this with climate models that parameterize clouds rather than resolving them, a necessary omission that introduces uncertainty but allows for long-term forecasting. The first requirement is that the theory must differentiate idealization from approximation and from plain omission. An idealization is a deliberate distortion known to be false, like a massless string. An approximation is a claim that the false assumption is close enough to the truth, like treating a curved earth as flat for a building project. An omission is simply leaving something out. A theory of legitimate idealization must tell us when a deliberate distortion is more useful than a close approximation, which is a high bar to clear.

  Furthermore, this spec sheet must distinguish between a model that is a useful predictor and one that offers an explanation. The ideal gas law predicts pressure and temperature relationships with high accuracy, but it does not explain the mechanism of molecular collision in detail. Rational-actor models might predict market trends in some regimes but fail to explain human psychology. The theory must allow for an as-if reading, where we act as though voters are selfish calculators because the aggregate behavior mimics that, without committing to the literal truth that voters are selfish calculators. It also needs to track how errors behave over scale and time. A false assumption might be harmless in a small system but poison the result as you scale up, such as assuming constant returns to scale in an economy, or it might be stable over time like the frictionless plane, or it might diverge exponentially like weather models where initial condition errors grow. The theory must explain why some false models predict beautifully, often due to compensating errors, while some true mechanisms predict terribly once you add back the noise and factors you left out. It must accept that robustness and fragility are not the same thing as truth and falsity. A model can be robustly wrong, producing the same incorrect output despite varied inputs, or fragilely right, producing the correct output only under a narrow set of true conditions.

  Here is where I think your suspicion is correct, and where the spec sheet reveals a fundamental incompatibility. The requirement that cannot be satisfied alongside the others is the demand for both predictive accuracy in the regime you care about and mechanistic truth of the central engine. You suspected a conflict between wanting a model to predict well and wanting its mechanism to be true rather than merely convenient, and the history of modeling suggests this tension is unavoidable. If a model can score well while its engine is fake, and score badly while its engine is real, then any criterion that leans on one of those virtues will fight the other. The single requirement that does the most to throw candidates out is the demand for explanatory fidelity alongside predictive robustness. If you demand that the assumptions be literally true or at least mechanistically isomorphic to reality, you lose the ideal gas law and frictionless planes. If you demand only predictive accuracy, you let in rational-actor economics and potentially flawed climate parameterizations that get the right answer for the wrong reason. You cannot have a theory that validates the ideal gas law on mechanistic grounds while invalidating rational-actor models on the same grounds, unless you introduce a external criterion about the nature of the systems themselves, such as whether the system is physical versus social, which itself is a contentious boundary.

  This brings us to your flip test, which is a pragmatic tool for navigating this mess, though it is not a universal solvent. The flip test, where you relax an assumption to see if the conclusion survives or flips sign, is essentially a form of sensitivity analysis. It is a genuine requirement when you are making causal claims. If you claim that friction causes the slowdown, removing friction must change the outcome. If you claim that rationality drives the market crash, removing the rationality assumption must change the prediction. In these cases, if the conclusion flips when you relax the assumption, the assumption was load-bearing, and the burden is on the modeler to argue that the real system lives in the regime where the false assumption holds. However, the flip test is a trap when applied to complex, chaotic, or highly coupled systems. In climate modeling, relaxing the cloud parameterization might flip the sign of the temperature sensitivity, but that does not necessarily mean the parameterization was false in a way that invalidates the model; it might mean the system is sensitive to that parameter in a way we do not yet understand, or that other compensating errors were holding the model steady. In fisheries models, relaxing the assumption of homogeneous mixing might flip the prediction from stability to collapse, but if the real fish population is structured, the model with the false assumption was the one that was dangerous, even if it was stable. The flip test can also fail in cases of equifinality, where different mechanisms produce the same outcome. You might relax an assumption, the model flips, but the real world stays the same because a different mechanism took over. Conversely, you might relax an assumption and the model survives, not because the assumption was harmless, but because another false assumption compensated for it, creating a false sense of security.

  So, to answer your core question directly: you are right that there is a real conflict between predictive accuracy and mechanistic truth, and this is the fracture line that prevents a unified theory of idealization from holding. The requirement that throws out the most candidates is the demand that the model's internal logic map onto the world's causal structure while also delivering precise numerical predictions. In physics, we often forgive the mapping because the predictions are so precise, as with the ideal gas law. In social sciences, we often forgive the predictions because the mapping feels intuitive, as with rational actors. But you cannot have a single criterion that validates both without collapsing the distinction between prediction and explanation. The flip test is your best field tool for checking load-bearing assumptions, but you must use it knowing that passing it only proves robustness to that specific perturbation, not truth, and failing it only proves sensitivity, not falsity. The interesting part of your story is not who wins the fight between the defenders of false assumptions and the critics, but rather that the fight persists because the goals of modeling are plural and often contradictory. We want models to be true, but we also want them to be useful, and nature does not guarantee that the useful ones are true or that the true ones are useful. Your article will be strongest if you show that the criteria for legitimacy shift depending on whether the modeler is trying to forecast the weather, understand the climate, explain a market crash, or design a bridge, and that the frictionless plane is only legitimate because we know exactly how to add the friction back in when we build the real thing.

  I hope this helps you map the terrain before you start making calls. The lack of a spec sheet is not a failure of the scientists you are interviewing, but a feature of the practice itself.

  Best regards,

  A Fellow Traveler
