answer: |-
  This is a fantastic choice for an opening gambit. Using James (1890) allows you to bypass the calcified Gould/Lewontin (1979) debate and show that the tension between *mechanism* and *function* is constitutive of psychology itself, not just a late-20th-century squabble.

  Here is an analysis of where your framing holds, where it risks anachronism, and how to position James in the "Science vs. Just-So" narrative.

  ### 1. The Verdict: Is James a Critic or a Founder?
  **He is a Mechanistic Adaptationist.**
  He is not quite the "first evolutionary psychologist" (that title usually goes to Darwin or Wallace, or later Tooby/Cosmides), nor is he the "first just-so story critic" (that requires a skepticism about adaptation *itself*, which James lacks).

  Instead, James is a **critic of *Faculty Psychology* who uses Adaptationism as his weapon.**

  When he attacks the "older writings," he is attacking the reification of functions into mental entities (e.g., "The bird builds a nest because it possesses the *Nest-Building Faculty*"). He argues that labeling a behavior with a purpose-word explains nothing about the *mechanism*. In this sense, he is critiquing the *explanatory style* that modern critics accuse EP of using. However, unlike Gould, James does not doubt that the behavior is an adaptation. He doubts that the *animal* knows why it is doing it.

  ### 2. Decoding the Claims: Physiological, Methodological, or Both?
  You asked if the "reflex type" claim is physiological or methodological. **It is both, serving a naturalizing function.**

  *   **Physiological:** James is trying to ground psychology in the hard science of his day: neurophysiology. By claiming instincts are "complex reflexes," he is asserting that they are material, causal chains (Stimulus $\rightarrow$ Neural Path $\rightarrow$ Motor Output), not spiritual intuitions.
  *   **Methodological:** He is enforcing a rule of explanation: Do not explain behavior by referencing the *outcome* (the end) unless you can show the *machinery* that produces it.
  *   **The "Fatal as Sneezing" Point:** This is crucial. He is arguing against *volition*. If a cat chases a mouse, the modern EP might say "to maximize inclusive fitness." James says "No, the visual stimulus of the scurrying object triggers a motor chain." The *fitness consequence* is real (Nature's anticipation), but the *mental cause* is absent.

  ### 3. The Teleology Split (The Key to Your Class)
  Your intuition about "deflating teleology while still treating behaviour as functional" is exactly right. You can sharpen this using Ernst Mayr's later distinction (1961) between **Proximate** and **Ultimate** causation, even though James predates the terms.

  *   **James rejects Proximate Teleology:** The animal does not act *for the sake of* the future end. (The cat does not think "I must eat to survive.")
  *   **James accepts Ultimate Teleology:** The nervous system is structured *as if* it anticipated the future. (The cat's nerves are wired by evolution to react to scurrying shapes.)

  **Where your framing might need adjustment:**
  Modern "Just-So" critics (Gould, Richardson, etc.) often attack the **Ultimate** claim. They say, "You claim this trait was selected for X, but you have no comparative evidence."
  James attacks the **Proximate** claim. He says, "You claim the animal understands X, but you have no physiological evidence."

  If you present James as a "Just-So critic," students might confuse his critique of *mentalistic purpose* with the modern critique of *adaptationist history*. James believes the adaptation is real; the modern critic suspects the adaptation story is a fiction.

  ### 4. Where Your Framing is Most Likely Wrong (Risks of Anachronism)

  Here are the three specific traps to avoid when presenting this to your class:

  **A. The "Just-So" Label Mismatch**
  *   **Risk:** Equating James's complaint about "vague wonder" with the modern complaint about "adaptationist narratives."
  *   **Correction:** James is attacking **Faculty Psychology** (naming a behavior creates an explanation). Modern critics attack **Adaptationism** (assuming a behavior exists because it was useful). James would likely *agree* with EP that "cheater detection" is a real, preorganized adaptation. He would *disagree* if EP implied humans consciously calculate cheating algorithms. He demands the *circuitry*, not the *story*.
  *   **Class Tip:** Use James to show that "naming a function isn't explaining a mechanism" is a perennial rule of science, not just a weapon against EP.

  **B. The Definition of "Reflex"**
  *   **Risk:** Students will hear "reflex" and think "knee-jerk" or "Behaviorist S-R bond" (simple, rigid, unmodifiable).
  *   **Correction:** James's view of the reflex arc is surprisingly flexible. He argues that instincts can be inhibited by experience and that humans have *more* instincts than animals, not fewer, but they are more easily overridden by habit. He is not a rigid determinist.
  *   **Class Tip:** Clarify that for James, "reflex" means "automatic sensorimotor coordination," not "robotic rigidity." This prevents students from dismissing him as a crude behaviorist.

  **C. The "Anticipation" Language**
  *   **Risk:** Reading "in anticipation of" as if James believes in forward-looking evolution or Lamarckism.
  *   **Correction:** James is a Darwinian. "Anticipation" is metaphorical for "pre-fitted by past selection." However, James wrote before the Modern Synthesis (genetics + selection). He lacks a rigorous theory of *how* the preorganization is inherited. He assumes the nervous system is "preorganized" but is vague on the inheritance mechanism.
  *   **Class Tip:** Acknowledge that James has the *logic* of adaptationism without the *genetics*. This makes him a "Just-So" practitioner by modern standards (he asserts adaptation without population genetics), even while he critiques the *style* of Just-So stories.

  ### 5. How to Frame This for the Class

  I recommend positioning James as the **"Honest Broker"** of the debate.

  1.  **The Setup:** "Before Gould and Lewontin called them 'Spandrels,' and before Tooby and Cosmides built the 'Santa Barbara Institute,' William James laid out the rules of the game in 1890."
  2.  **The Jamesian Criterion:** "James argues that a functional explanation (what it's for) is worthless without a mechanistic explanation (how it works)."
  3.  **The Twist:** "But notice: James assumes the function *is real*. He thinks the nervous system *is* preorganized for the environment. So, is he an Evolutionary Psychologist? Yes, because he seeks biological bases for behavior. Is he a Critic? Yes, because he refuses to let a functional label count as a mechanism."
  4.  **The Modern Application:** "When modern critics say EP tells 'Just-So Stories,' they usually mean 'You haven't proved the adaptation history.' When James said the older writers told 'waste of words,' he meant 'You haven't proved the neural mechanism.' **Which critique is more damning?**"

  ### Summary for your Lecture Notes
  *   **James's Claim:** Instincts are automatic, sensorimotor reflexes, not conscious calculations.
  *   **James's Adaptationism:** He believes these reflexes exist *because* they were useful ("preorganized in anticipation"), but the animal is unaware of the utility.
  *   **The "Just-So" Parallel:** James critiques the **reification of function** (calling it an "Instinct" explains nothing). Modern critics critique the **assumption of optimization** (calling it an "Adaptation" explains nothing).
  *   **The Verdict:** James is a **Mechanistic Adaptationist**. He licenses adaptationist explanation *only if* paired with physiological plausibility.

  If you frame him this way, you avoid the anachronism of calling him a "Spandrels" critic while still using him to highlight the core methodological vulnerability of evolutionary psychology: **the gap between functional narrative and mechanistic reality.**
