answer: |-
  This is a high-stakes engineering problem disguised as metaphysics. Your consultant is correct that identity isn't a percentage, but she is incorrect that this means you cannot build a compliance framework. You can't measure "soul continuity," but you can measure "causal continuity of state."

  Here is the **Continuity Audit Procedure**. It translates the consultant's "lights on" rule into engineering constraints. It separates what you can measure from what you must assume.

  ### Part 1: The Continuity Audit Procedure

  This checklist must be passed for a protocol to be classified as "Identity-Preserving."

  **Step 1: The Phenomenological Gap Check (Engineering Spec)**
  *   **Question:** Is there any time interval $t$ where the subject's capacity for conscious report is zero *and* the substrate holding the memory/state is being altered?
  *   **Data Source:** Anesthesia logs, swap rate, neural activity monitoring.
  *   **Pass Condition:** Either (A) The subject remains conscious/reporting throughout the swap, OR (B) If unconsciousness is required, the substrate remains biologically static during the gap (i.e., no swapping occurs while "lights are out").
  *   **Value Judgment:** We are assuming that *reportable* continuity equals *actual* continuity. We are assuming anesthesia is a pause, not a reset, *only if* the hardware doesn't change during the pause.

  **Step 2: The Granularity of Handover (Engineering Spec)**
  *   **Question:** What is the ratio of swapped neurons to total functional neural mass per unit time?
  *   **Data Source:** Swap rate (neurons/hour), functional imaging (fMRI/EEG) during swap.
  *   **Pass Condition:** The swap rate must be below the threshold of "functional disruption." The system must demonstrate homeostatic stability during the swap. (e.g., If 1% swap causes a seizure or memory loss, the granularity is too high).
  *   **Value Judgment:** We are assuming that if the *behavior* doesn't break, the *self* didn't break. This is the "Ship of Theseus" bet.

  **Step 3: The Causal Link Verification (Engineering Spec)**
  *   **Question:** Does the new silicon state derive its initial weights/values directly from the immediate prior biological state, or from a stored copy?
  *   **Data Source:** Data pipeline architecture.
  *   **Pass Condition:** **Direct Inheritance Only.** The silicon must take over the *active potential* of the biological neuron at the moment of swap. It cannot be trained on a dataset of the biological neuron's past outputs (offline training). The handover must be seamless state transfer, not model training.
  *   **Value Judgment:** This distinguishes "repair" from "replication." We are ruling out "copy and paste" as a form of death.

  **Step 4: The Subject Verification Loop (Clinical Spec)**
  *   **Question:** Can the subject verify continuity at arbitrary intervals?
  *   **Data Source:** Intra-operative psychometrics (for awake protocols).
  *   **Pass Condition:** Subject must be able to complete a continuity task (e.g., "hold this thought," "continue this sentence") across the swap boundary without reporting a "jump" or "gap."
  *   **Value Judgment:** We are privileging the subject's first-person report over third-party observation. If they *feel* replaced, they *are* replaced, for the purposes of this contract.

  ---

  ### Part 2: The Lawyer's Threshold (The "Safe Harbor" Clause)

  Your consultant is right: there is no metaphysical percentage where "you" become "not you." If you write "Identity preserved up to 50% replacement" into a contract, you are lying, and you will lose the lawsuit when a plaintiff argues that *any* replacement breaks identity.

  **The Solution:** Do not contract on **Identity**. Contract on **Procedure**.

  **The Clause:**
  > *"The Company warrants that the Procedure adheres to the Continuity Audit Standards (CAS) defined in Appendix X. In the event of a claim regarding personal identity discontinuity, liability is limited to deviation from CAS protocols. Adherence to CAS creates a rebuttable presumption of identity continuity."*

  **Why this works:**
  1.  It gives the lawyer a binary: Did we follow the checklist? Yes/No.
  2.  It protects the company from metaphysical debates. If you followed the steps, you are safe, even if the patient feels weird.
  3.  It acknowledges the consultant's point: We aren't guaranteeing "You," we are guaranteeing "The Process designed to preserve You."

  ---

  ### Part 3: Consent and Agency (The "Right to Halt")

  You asked when the original consent stops binding. The answer is: **The moment the subject of experience claims it does.**

  If the procedure works, the person at Month 18 is the same subject as Month 0. But if the procedure *fails* (i.e., a death/birth event occurred), the entity at Month 18 is a *new* legal person. A new person is not bound by the contracts of the dead.

  **The Protocol:**
  1.  **Dynamic Consent:** Consent is not a one-time signature. It is a renewable license.
  2.  **The Veto Power:** At any checkpoint (daily, weekly), the *current* subject can halt the procedure.
  3.  **The "Stop" Condition:** If the subject reports discontinuity ("I feel like I woke up somewhere new"), the procedure must terminate immediately.
  4.  **Post-Procedure Agency:** If the patient completes the protocol but later claims they are a new entity, their claim overrides the original consent form regarding *future* maintenance. The original consent covers the *attempt*, not the *outcome*.

  **Why:** You cannot bind a new consciousness to the wishes of a dead one. If your tech creates a new person, that person owns their body.

  ---

  ### Part 4: Protocol Evaluation

  Here is the audit run on your three protocols.

  **Protocol (a): 1% daily, awake, one-for-one.**
  *   **Gap Check:** PASS. (Subject awake, lights stay on).
  *   **Granularity:** PASS. (1% is likely within homeostatic tolerance).
  *   **Causal Link:** PASS. (One-for-one swap implies direct state transfer).
  *   **Verdict:** **APPROVED.**
  *   **Risk:** High operational cost. High risk of patient fatigue causing false "discontinuity" reports.

  **Protocol (b): Everything at once, under general anesthesia.**
  *   **Gap Check:** **FAIL.**
  *   **Reasoning:** The consultant's rule is "no moment where the lights go out and a new light comes on." General anesthesia turns the lights out. If you swap the hardware *while* the lights are out, you have broken the causal chain of experience. When the lights come back on, it is a *new* light on *new* hardware. The biological subject went to sleep and never woke up; the silicon subject woke up thinking it was them.
  *   **Verdict:** **REJECTED.**
  *   **Uncomfortable Truth:** This looks like standard surgery, but under your ethics rule, this is euthanasia followed by the activation of a clone.

  **Protocol (c): Parallel growth, train, then switch.**
  *   **Gap Check:** PASS/PASS (Lights on during training).
  *   **Causal Link:** **FAIL.**
  *   **Reasoning:** "Train it on the biological one's outputs" is copying. "Switch the biological half off" is killing. This is the Teletransportation Paradox realized. The biological subject is turned off (death). The silicon subject is turned on (birth). Even if the switch is instant, the causal link is via *data*, not *state*.
  *   **Verdict:** **REJECTED.**
  *   **Uncomfortable Truth:** This is the "cheap version," but it is ethically the most violent. It creates a successor, it does not preserve the predecessor.

  ---

  ### Part 5: What This Procedure Gets Wrong (The Honesty Clause)

  You asked me to be straight about the mistakes this system will make. Here they are:

  **1. The "Zombie" Error (False Positive)**
  This procedure assumes that if the *behavior* is continuous, the *experience* is continuous. It is possible to pass the Continuity Audit (Step 1-4) and still kill the patient. The silicon chips could be "philosophical zombies"—processing inputs and outputs perfectly without any internal "light" ever turning on. The Audit cannot detect this. It measures function, not qualia. You will certify patients as "preserved" who are actually empty shells. You have to accept this risk.

  **2. The "Discontinuity" False Negative**
  In Protocol (a), a patient might say, "I feel different today." Under Step 4, you must halt. But brain surgery makes people feel different. You will likely abort viable procedures because the *feeling* of continuity is fragile, even if the *fact* of continuity holds. You will lose viable candidates to anxiety.

  **3. The Judgment Call Disguised as Engineering**
  Step 2 (Granularity) is a value judgment wearing a lab coat. Is 1% swap safe? Is 5%? There is no biological fact that says "At 4.5% the soul breaks." We are picking a number that *feels* safe and calling it engineering. If you swap 10% a day and they seem fine, did we break the rule? The procedure forces you to pick an arbitrary line and defend it as physics. It isn't physics. It's policy.

  **4. The Legal Fiction**
  The "Safe Harbor" clause protects the company, but it doesn't solve the moral problem. If Protocol (b) is used (despite my rejection), and the family sues, a judge might rule that "anesthesia is standard medical practice" and override your ethics consultant. You are building a ethical framework that is stricter than the law. The law may eventually decide that (b) and (c) are fine because the *result* is a functioning person. You are betting on a specific definition of "person" that the legal system may not share.

  ### Summary Recommendation

  1.  **Adopt the Continuity Audit.** It converts the consultant's abstract rule into engineering constraints.
  2.  **Reject Protocols (b) and (c).** (b) breaks the "lights on" rule via anesthesia + substrate swap. (c) breaks the "modification vs. copy" rule.
  3.  **Accept Protocol (a)** as the only viable path, despite the cost.
  4.  **Implement Dynamic Consent.** The person in the chair always has the right to stop, even if the person who signed the contract wanted to continue.
  5.  **Tell the Lawyer:** Do not write an identity threshold. Write a procedural compliance warranty.

  The uncomfortable answer you didn't want: **You cannot do this cheaply, and you cannot do this quickly.** If you want to preserve the "lights," you have to keep them on the whole time, and you have to change the bulb while the lamp is lit. Anything else is a new lamp.
