answer: |-
  # Decision Tree: Engines of Moral Revolution

  **Root Node:** When the practice stopped, what changed *first*?
  *   **Left:** The practice became **Unthinkable** (Moral belief/permission withdrew before behavior changed).
  *   **Right:** The practice became **Unworkable** (Behavior/conditions changed, moral belief caught up later).

  ---

  ## Branch A: The Practice Became Unthinkable (Belief-First)

  **Node A1:** What made the belief stick?
  *   **Left:** **Universal Consistency** (It violated a logical principle applicable to everyone).
  *   **Right:** **Social Identity** (It violated a code about who *we* are).

  > **Leaf 1: The Rationalist/Progress View** (From A1-Left)
  > *   **Position:** The arguments won. Once the contradiction between the practice and foundational principles (liberty, Christianity, reason) was exposed, honest people had to concede.
  > *   **Test Case:** Abolitionists proving slavery violates natural rights; anti-duelists proving violence violates Christian meekness.
  > *   **Awkward Commitment:** Assumes historical actors prioritize logical consistency over interest or tradition more than they actually do.

  > **Node A2:** (From A1-Right) What defined "Who We Are"?
  > *   **Left:** **Honor & Status** (The practice became markers of low character or backwardness).
  > *   **Right:** **Cultural Meaning** (The practice got semantically attached to a despised group, nation, or era).

  >> **Leaf 2: The Honor Code View (Appiah)** (From A2-Left)
  >> *   **Position:** People care more about social standing than moral truth; the practice ended when it became shameful rather than when it was proven wrong.
  >> *   **Test Case:** Gentlemen stopped dueling when it became "ungentlemanly"; slaveholders abandoned slavery when it became "uncivilized."
  >> *   **Awkward Commitment:** Struggles to explain why the honor code shifted *against* the practice rather than reinforcing it (e.g., why didn't honor demand defending property?).

  >> **Leaf 3: The Semantic Shift View** (From A2-Right) **[UNNAMED]**
  >> *   **Position:** The moral status didn't change, but the *category* did; the practice was re-described as something else (e.g., "business" vs. "slavery," "murder" vs. "dueling").
  >> *   **Status:** **Unexplored.** Historians use this (conceptual history), but philosophers often dismiss it as merely linguistic rather than moral.
  >> *   **Awkward Commitment:** Implies the moral reality didn't change, only the vocabulary, which undermines the "revolution" framing.

  ---

  ## Branch B: The Practice Became Unworkable (Condition-First)

  **Node B1:** What made it unworkable?
  *   **Left:** **Economic Viability** (The costs rose or the profits vanished).
  *   **Right:** **Political Utility** (It stopped serving the interests of those with power).

  > **Node B2:** (From B1-Left) How did the economics fail?
  > *   **Left:** **Absolute Decline** (The industry became unprofitable on its own terms).
  > *   **Right:** **Relative Opportunity** (New technologies or markets made the old practice inefficient by comparison).

  >> **Leaf 4: The Economic Decline View (Williams)** (From B2-Left)
  >> *   **Position:** The practice ended because it was no longer profitable; morality was a post-hoc justification for abandoning a sinking ship.
  >> *   **Test Case:** West Indian sugar profits falling before abolition; dueling becoming too costly for the expanding officer corps.
  >> *   **Awkward Commitment:** Requires evidence that elites were willing to sacrifice *some* profit, just not *declining* profit, which is hard to prove.

  >> **Leaf 5: The Market Substitution View** (From B2-Right) **[UNNAMED]**
  >> *   **Position:** The practice wasn't losing money, but alternatives (wage labor, legal courts) became cheaper and more scalable.
  >> *   **Status:** **Unattractive.** It renders the moral outrage entirely epiphenomenal to efficiency metrics.
  >> *   **Awkward Commitment:** Suggests that if slave labor had remained more efficient than wage labor, the moral revolution would never have happened.

  > **Node B3:** (From B1-Right) Whose political interests shifted?
  > *   **Left:** **External/Geopolitical** (War, empire, or international pressure made the practice a liability).
  > *   **Right:** **Internal/Domestic** (Elites or the State changed their calculation on utility).

  >> **Leaf 6: The Geopolitical Necessity View** (From B3-Left) **[UNNAMED]**
  >> *   **Position:** The practice ended because it weakened the state against rivals (e.g., arming slaves to fight, or stopping duels to preserve officers).
  >> *   **Status:** **Unexplored.** Often lumped into Economics, but distinct (security vs. profit).
  >> *   **Awkward Commitment:** Implies moral progress is purely a byproduct of winning wars or securing borders.

  >> **Node B4:** (From B3-Right) Why did domestic elites drop it?
  >> *   **Left:** **To Signal Distinction** (To separate themselves from lower classes or rivals).
  >> *   **Right:** **To Consolidate Power** (To monopolize violence or labor control).
  >> *   **Far Right:** **Historical Accident** (No strategic logic, just contingent convergence).

  >>> **Leaf 7: The Elite Signaling View** (From B4-Left)
  >>> *   **Position:** Elites abandoned the practice to distinguish themselves from those who still relied on it (e.g., industrialists vs. planters; professionals vs. warriors).
  >>> *   **Test Case:** British industrialists framing slavery as "backward" to elevate their own status.
  >>> *   **Awkward Commitment:** Hard to distinguish from the Honor View (Leaf 2); both rely on status, one internalized (shame), one strategic (branding). **[FLAGGED INSEPARABLE]**

  >>> **Leaf 8: The State-Building/Deflationary View** (From B4-Right)
  >>> *   **Position:** The "moral revolution" is a story told to mask a power grab; the state ended dueling to monopolize violence, or slavery to centralize labor control.
  >>> *   **Test Case:** Duels banned because the state won't tolerate private violence; slavery ended to integrate colonies into imperial administration.
  >>> *   **Awkward Commitment:** Requires cynicism about all moral language, making it impossible to take any reformer's stated reasons seriously.

  >>> **Leaf 9: The Contingency/Moral Luck View** (From B4-Far Right)
  >>> *   **Position:** The conditions shifted, but not enough to determine the outcome; it could easily have gone the other way without specific accidents.
  >>> *   **Test Case:** A specific election, a specific war outcome, or a specific charismatic leader that wasn't structurally inevitable.
  >>> *   **Awkward Commitment:** Admits the theory cannot predict or fully explain the outcome, reducing history to a sequence of lucky breaks.

  ---

  ### Notes on Indistinguishable Leaves

  1.  **Leaf 2 (Appiah/Honor) vs. Leaf 7 (Elite Signaling):**
      *   **The Bleed:** Both argue that *status* drives the change, not *truth*.
      *   **The Difference:** Appiah argues people internalized the shame (psychological); Signaling argues elites used it as a tool (sociological).
      *   **Problem:** In the archives, "I feel ashamed" and "I want to look better than them" often look identical. If you can't access private interiority, these leaves merge.

  2.  **Leaf 4 (Williams/Economics) vs. Leaf 6 (Geopolitics):**
      *   **The Bleed:** Both argue the practice became a *liability*.
      *   **The Difference:** Economics is about profit/loss; Geopolitics is about security/power.
      *   **Problem:** In empire, security *is* profit. A war that disrupts trade looks like both economic decline and geopolitical necessity. Separating them requires counterfactuals we can't test.
