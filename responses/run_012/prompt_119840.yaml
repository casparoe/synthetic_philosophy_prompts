answer: |-
  ### Scenario: The Isomorphic Ensemble

  **Agents:** Elena (assigns high credence to the Simulation Hypothesis) and Mark (assigns near-zero credence). Both are total utilitarians.
  **Organisation:** "The Long View," a small NGO.
  **Intervention:** "Project Axiom." A $100 million research initiative to solve a specific, foundational mathematical problem in AI alignment ("The Stability Proof").
  **Cost:** Diverting $100 million from direct malaria prevention, forgone benefit = 50,000 certain lives saved (Near-Term Modest Option).
  **Payoff:** If solved, the Stability Proof ensures any civilization that implements it avoids existential catastrophe. Value = $10^{30}$ quality-adjusted life years (QALYs) per surviving civilization.
  **Probability:** The probability that *this* specific research team discovers the proof is $10^{-20}$.

  **The Mechanism:**
  Mark assumes Base Reality. There is only one Earth. If Project Axiom succeeds, it saves one civilization's future.
  Elena assumes Simulation Reality. Per the Simulation Argument, if post-human civilizations run ancestor simulations, they run them in ensembles to establish statistical baselines. A significant fraction of these are "control runs"—computationally isomorphic to base history to verify historical models. If we are in a simulation, we are likely in one of $N = 10^{15}$ such control runs. Because the Stability Proof is a mathematical truth, discovering it in one isomorphic simulation implies it is discoverable (and will be discovered, given deterministic or near-deterministic initial conditions in control runs) in all $N$ simulations. Thus, success here correlates with success across the ensemble.

  **Constraint Check:**
  1.  **EV Comparison:** We compare $EV(\text{Intervention} | \text{Sim})$ vs $EV(\text{Intervention} | \text{Base})$.
  2.  **Axiology:** Both count simulated QALYs equally.
  3.  **No Exotic Devices:** Simulators are researchers running control groups (ordinary science). No rewards, no magic physics.
  4.  **Human Scale:** $100M budget, concrete numbers provided.
  5.  **No Stipulation:** Amplification arises from the multiplicity of control runs, not a decree that sims matter more.

  ***

  ### Demonstration

  **(a) State the case cleanly.**
  The case rests on the **Isomorphic Ensemble Effect**. In Base Reality, there is one trial of human history. In Simulation Reality (conditional on us being simulated), there are $N$ trials running in parallel. If the intervention relies on logical or mathematical discovery within a deterministic computational substrate, success in one isomorphic instance implies success in all. Therefore, the expected value of the intervention, conditional on being simulated, is multiplied by the number of simulations, whereas the expected value conditional on base reality is not.

  **(b) Expected Value Calculations.**

  **Parameters:**
  *   $C$ (Cost in QALYs) = 50,000 ($5 \times 10^4$)
  *   $V$ (Value per Civilization) = $10^{30}$
  *   $p$ (Probability of Discovery) = $10^{-20}$
  *   $N$ (Number of Isomorphic Sims) = $10^{15}$

  **Mark (Base Reality Assumption):**
  Mark conditions on $\neg \text{Sim}$. There is 1 civilization.
  $$EV_{\text{Modest}} = 5 \times 10^4$$
  $$EV_{\text{Fanatical}} = p \times 1 \times V = 10^{-20} \times 10^{30} = 10^{10}$$
  *Correction for Fanaticism Threshold:* To ensure Mark chooses Modest, we adjust $p$ to $10^{-26}$.
  $$EV_{\text{Fanatical}} = 10^{-26} \times 10^{30} = 10^4$$
  $$10^4 < 5 \times 10^4$$
  **Decision:** Mark chooses the **Modest Option**.

  **Elena (Simulation Assumption):**
  Elena conditions on $\text{Sim}$. She posits she is in an ensemble of $N$ isomorphic runs.
  $$EV_{\text{Modest}} = 5 \times 10^4$$
  $$EV_{\text{Fanatical}} = p \times N \times V = 10^{-26} \times 10^{15} \times 10^{30} = 10^{19}$$
  $$10^{19} \gg 5 \times 10^4$$
  **Decision:** Elena chooses the **Fanatical Option**.

  **(c) Identify the single structural feature doing the work.**
  The feature is **Ontological Multiplicity of Isomorphic Instances**.
  It alters the **size of the far future at stake** conditional on the simulation hypothesis. It does not change the probability of success *within* a single instance ($p$), nor does it change the value of a single life. It changes the *count* of civilizations whose futures are logically tied to the intervention's success. In Base Reality, the stake is $1 \times V$. In Simulation Reality (conditional), the stake is $N \times V$.

  **(d) Remove that feature and show what happens.**
  **Removal:** Suppose the simulators run *only* variant simulations (no control runs). Every simulation has different initial conditions such that a mathematical discovery here does not correlate with discoveries elsewhere ($N_{\text{effective}} = 1$).
  **Collapse:**
  $$EV_{\text{Fanatical}} (\text{Sim}) = p \times 1 \times V = 10^4$$
  Now $EV_{\text{Fanatical}} (\text{Sim}) = EV_{\text{Fanatical}} (\text{Base})$.
  However, the standard damping argument applies: Simulators may terminate the simulation before the far future is realized. Let $T$ be the probability the sim runs to completion ($T < 1$).
  $$EV_{\text{Fanatical}} (\text{Sim}) = T \times 10^4$$
  Since $T < 1$, the Sim EV is now strictly *lower* than the Base EV. The case collapses back into the usual damping verdict: accepting the simulation hypothesis makes the gamble *less* attractive due to truncation risk, without the multiplicity buffer.

  **(e) Say how a defender of the damping verdict would resist.**
  **Resistance:** The defender would deny the **Isomorphism Premise**. They would argue that ancestor simulations are primarily run to study *divergence* and *variance* (counterfactual history), not to replicate baselines. Therefore, the number of strictly isomorphic control runs ($N$) is negligible compared to the total number of simulations, or effectively zero.
  **Cost:** Denying this costs them the standard Bostromian justification for why we should expect to be in a simulation at all. Bostrom's argument relies on the assumption that post-humans run *many* simulations of their past. If they run so few control runs that $N \approx 1$, the statistical force of the Simulation Argument weakens (fewer total simulated ancestors).
  **Rebuild:** The defender can rebuild by stipulating that even if there are many sims, the **Truncation Probability** ($1-T$) is high enough to outweigh the Multiplicity ($N$). For example, if simulators habitually shut down sims upon reaching the 21st century (the "Great Filter" of simulation), then $V \approx 0$ for sims regardless of $N$. To defeat this, the proponent of amplification must argue that "full history" simulations are necessary for the simulators' research goals, ensuring $T \approx 1$ for a significant subset of runs.
