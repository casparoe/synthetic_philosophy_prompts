answer: |-
  ### The Triage Compass: A Decision Tree

  **Instructions:** Start at Question 1. Follow the arrow that matches your gut reaction. Don't overthink it; go with the answer that feels like *truth*, not the answer you think you *should* give. If you land on a "Leaf," read your profile. If you hit a contradiction, read the Editor's Note at the end.

  ***

  **Q1. The Lifeboat**
  You are steering a rescue boat. To your left, five strangers are treading water. To your right, one stranger is treading water. You have fuel for only one group.
  *   **A.** Steer left. Save the five. → **Go to Q2.**
  *   **B.** Flip a coin. Give them equal odds. → **Go to Leaf 1.**
  *   **C.** Steer right. Save the one. → **Go to Q2.** (Yes, really. We need to know why.)

  **Q2. The Bridge**
  To save the five, you must drop a heavy object to block the flood. The only object available is a person.
  *   **A.** I push the one person off the bridge. Their death stops the water. → **Go to Q3.**
  *   **B.** I refuse. I cannot kill the one to save the five. → **Go to Leaf 2.**

  **Q3. The Scale**
  Imagine the same boat scenario. Now it's two strangers on the left, one on the right.
  *   **A.** Save the two. Numbers win, even by a slim margin. → **Go to Q4.**
  *   **B.** Flip a coin. The gap isn't big enough to decide. → **Go to Leaf 3.**
  *   **C.** Save the one. (If you chose this, you likely believe in a "First Come, First Served" rule regardless of numbers). → **Go to Q7.**

  **Q4. The Lottery**
  You can't save the five for sure. But you can rig the odds. Do the five get five tickets in the raffle and the one gets one ticket?
  *   **A.** Yes. Five tickets vs. one. → **Go to Leaf 4.**
  *   **B.** No. If I can't save all five, I flip a fair coin. → **Go to Leaf 1.** (You are an Egalitarian, even if you liked Q1).
  *   **C.** No. The five get all the tickets. If it's not certain, I still prioritize the group. → **Go to Q5.**

  **Q5. The Brother**
  Back to the lifeboat. Five strangers on the left. On the right, it's your brother.
  *   **A.** Save my brother. → **Go to Leaf 5.**
  *   **B.** Save the five. Family doesn't change the math. → **Go to Q6.**

  **Q6. The Burden**
  To save the five, the one person on the right must not just die, but suffer greatly in the process (e.g., burned alive to create a signal fire).
  *   **A.** Save the five. The outcome matters more than the method. → **Go to Leaf 6.**
  *   **B.** Save the one. That cost is too high for a single person to bear. → **Go to Leaf 7.**

  **Q7. The Queue**
  The one person on the right was already hooked up to the ventilator first. The five arrived later.
  *   **A.** Save the one. First come, first served. → **Go to Leaf 7.** (Overlaps with Burden/Claim).
  *   **B.** Save the five. Need trumps procedure. → **Go to Leaf 6.**

  **Q8. The Mirror**
  The one person on the right is you.
  *   **A.** Save yourself. → **Go to Leaf 8.**
  *   **B.** Save the five. → **Go to Leaf 6.**

  ***

  ### The Leaves (Your Ethical Profile)

  **Leaf 1: The Coin-Flip Egalitarian**
  *You believe numbers never count.* To you, every life is a universe of one. Aggregating them feels like a math trick that devalues the individual. Whether it's 5 vs 1 or 100 vs 1, the only fair way to decide is random chance. You worry that counting heads turns people into units of meat.
  *   *Fault Line:* You prioritize **Equality** over **Outcome**.

  **Leaf 2: The Constrained Deontologist**
  *You believe you can't use the one as a means.* You might save the five if they are drowning and you just happen to be closer to them. But you will not actively kill the one to do it. There is a bright red line between "letting die" and "killing," and you won't cross it, even for a net gain of four lives.
  *   *Fault Line:* You prioritize **Rights** over **Results**.

  **Leaf 3: The Thresholdist**
  *You believe numbers count, but only as a tiebreaker.* 2 vs 1 feels too close to call; the difference is trivial. But 100 vs 1? That's obvious. You think small differences in numbers shouldn't override the equal worth of people, but massive differences create a moral obligation to act.
  *   *Fault Line:* You prioritize **Scale** over **Strict Rules**.

  **Leaf 4: The Weighted Lottery**
  *You believe five lives are worth more, but not five times more.* You want the five to have a better chance, but you refuse to give the one zero chance. This is a middle ground: you acknowledge the math without erasing the minority. You are comfortable with probability as a moral solvent.
  *   *Fault Line:* You prioritize **Proportionality** over **Certainty**.

  **Leaf 5: The Partialist**
  *You believe who you are matters.* Strangers might count equally, but you have special duties to your own kin. You reject the idea of a "view from nowhere." If you don't save your brother, who will? You think morality includes personal connection, not just abstract calculus.
  *   *Fault Line:* You prioritize **Relationships** over **Impartiality**.

  **Leaf 6: The Strict Aggregator**
  *You believe the numbers always count.* Five is more than one. Active or passive, kin or stranger, queue or no queue—the goal is to minimize body count. You are willing to make the hard trade-offs that keep the total death toll lowest. You see hesitation as a luxury the dead can't afford.
  *   *Fault Line:* You prioritize **Outcome** over **Process**.

  **Leaf 7: The Claim-Sensitive**
  *You believe numbers count unless the competing claim is strong.* You might save the five generally, but not if the one has a specific claim (like being first in line) or if the cost to the one is non-trivial (extreme suffering). You look for reasons *not* to sacrifice the minority, even if the math says do it.
  *   *Fault Line:* You prioritize **Fairness/Burden** over **Pure Utility**.

  **Leaf 8: The Self-Preserver**
  *You believe you are allowed to save yourself.* This isn't necessarily selfishness; it's an acknowledgment of agency. You are not a moral robot programmed to maximize global good. You have a prerogative to survive. (Note: Many Strict Aggregators falter here. If you passed Q5 but failed Q8, you are an **Impartial Aggregator**, not a Strict one).
  *   *Fault Line:* You prioritize **Agency** over **Self-Sacrifice**.

