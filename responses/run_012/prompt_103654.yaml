answer: |-
  You have identified a genuine and profound problem in legal and political theory. You are correct that it sits near the "game" analogy (Wittgenstein/Huizinga) and the "ultimate authority" problem (Kelsen/Hart), but it is distinct from both.

  There is no single, universally agreed-upon noun phrase for this specific structure in common parlance, but in legal theory, it is most precisely discussed under the heading of **Self-Embracing Sovereignty** (or **Self-Embracing Competence**). In systems theory and logic, it is a form of **Normative Recursion**.

  For your purposes as a novelist, I propose we name this structure **The Validity Loop**.

  Here is how it differs from the neighbors you identified, a definition of its edges, and an answer to whether your charter contains one instance of it or three.

  ### 1. Distinction from the "Neighbors"

  You mentioned two adjacent concepts. Here is why your problem is different:

  *   **Vs. "Changing Rules While Playing" (Wittgenstein/Game Theory):**
      *   *The Game:* In a language game or a card game, rules are descriptive of practice. If players agree to change a rule, the rule changes. The authority lies in the *practice* of the players, not the text.
      *   *Your Charter:* Your charter claims authority *from the text itself*. The trouble arises because the text tries to generate its own authority without relying on the external practice of the people. The "Validity Loop" is a crisis of *legitimacy*, not just habit. It asks: "Did the text allow this change to the text?" rather than "Do we agree to play this way now?"
  *   **Vs. "Ultimate Authority" (Kelsen's *Grundnorm* / Hart's *Rule of Recognition*):**
      *   *The Theory:* Kelsen and Hart argue that every legal system rests on a presupposed basic norm that *cannot* be legally validated (it is outside the system).
      *   *Your Charter:* Your characters are trying to keep everything *inside* the system. They are trying to make the "basic norm" mutable from within. The "Validity Loop" is what happens when a system tries to eat its own foundation. It is the attempt to turn the *Grundnorm* into a regular statute.

  ### 2. Definition: The Validity Loop

  **Definition:** A **Validity Loop** occurs when a normative system contains a rule that claims the power to alter the conditions of its own validity, thereby creating a logical circuit where the effect (the amendment) determines the cause (the authority to amend).

  It differs from simple self-reference (e.g., "This sentence is false") because it is *performative*. It doesn't just describe a paradox; it enacts a transfer of power that may or may not "stick."

  **The Edges (Boundary Cases):**
  To determine if a plot point counts as a Validity Loop, apply these three tests. If the answer is "Yes" to all three, you have an instance of the structure.

  1.  **The Source Test:** Does the rule derive its authority solely from the charter, with no external anchor (like a king, a god, or "the people" outside the assembly)?
  2.  **The Reflexivity Test:** Does the rule modify the mechanism that created the rule itself (the amendment clause, the membership definition, or the timeline of validity)?
  3.  **The Continuity Test:** Does the validity of the *new* rule depend on the validity of the *old* rule, even as the new rule abolishes or alters the old one?

  ### 3. One Instance or Three?

  You asked whether your three chapters represent one instance of this structure or three.

  **The Answer:** It is **One Structural Flaw** manifesting across **Three Vectors**.

  For a novelist, this is a gift. It means your settlement isn't suffering from three different legal bugs; it is suffering from one systemic disease that is infecting different organs. Treating them as facets of the same "Validity Loop" will give your book a deeper thematic unity.

  Here is how the three vectors break down:

  #### Vector A: Procedural Recursion (Your Chapter 1)
  *   **The Act:** Amending the amendment clause (2/3 majority changes the rule to unanimity).
  *   **The Loop:** The authority to change the rule comes from the old rule, but the new rule destroys the old authority.
  *   **The Tension:** *Temporal.* At the exact second the vote passes, does the 2/3 rule vanish? If it vanishes instantly, was the vote valid? If it lingers, when does it die?
  *   **Boundary Case:** If the charter said, "The amendment clause cannot be amended," and they amended it anyway, that is *Rebellion*, not a Validity Loop. The Loop requires the text to *allow* the self-destruction.

  #### Vector B: Ontological Recursion (Your Chapter 2)
  *   **The Act:** The assembly changing who counts as a member of the assembly.
  *   **The Loop:** The "Self" of the government is redefining itself.
  *   **The Tension:** *Identity.* If the assembly votes to exclude half its members, is the vote valid if those members voted against it? The body is pulling the rug out from under its own feet while standing on it.
  *   **Boundary Case:** If an external court decides who is a member, that breaks the loop. The loop only exists if the assembly is the sole judge of its own composition (*Kompetenz-Kompetenz*).

  #### Vector C: Temporal Recursion (Your Chapter 3)
  *   **The Act:** Ratifying past invalid amendments.
  *   **The Loop:** The present reaching back to heal the past.
  *   **The Tension:** *Causality.* An invalid act is legally "void" (it never existed). Can a new law bring something into existence that was legally dead? This is the legal equivalent of time travel.
  *   **Boundary Case:** If the charter simply says "We forgive past errors," that is mercy. If it says "Past errors are hereby declared to have been valid all along," that is a Validity Loop. It asserts that the present authority can rewrite the ontological status of the past.

  ### 4. How to Use This in the Narrative

  Since you are writing fiction, you can exploit the ambiguity of the Validity Loop. In real legal theory, there are two main schools of thought on how to resolve this, and your factions can embody them:

  1.  **The "Self-Embracing" View (The Reformers):** They argue the Loop is valid. The charter is a tool, and if the tool can modify itself, it does so. The moment the vote passes, the new rule is king. The past is healed. The assembly is whatever it says it is.
      *   *Philosophical Anchor:* Positivism (Law is what is enacted).
  2.  **The "Continuing" View (The Traditionalists):** They argue the Loop is impossible. The authority that created the charter is higher than the charter. You cannot use a ladder to pull up the ladder while you are standing on it. The amendment is void because it destroys the ground it stands on.
      *   *Philosophical Anchor:* Natural Law or Constituent Power (The People exist before the Charter).

  **Recommendation:**
  Do not resolve the question for the reader. The power of the **Validity Loop** is that it is undecidable from within the system.
  *   In Chapter 1, let the 2/3 vote pass. Have the Traditionalists argue it is void *ab initio* (from the start). Have the Reformers argue it is valid *ex nunc* (from now on).
  *   In Chapter 2, show the practical horror: If the assembly changes its membership, do the excluded members leave? Or do they claim the assembly is now illegal?
  *   In Chapter 3, use the retroactive clause as a "Get Out of Jail Free" card that everyone knows is fake but everyone accepts because the alternative is civil war.

  ### Summary for your Notes
  *   **Name:** The Validity Loop (or Normative Recursion).
  *   **Structure:** A rule that modifies the conditions of its own validity.
  *   **Distinction:** Unlike a game (practice-based) or a constitution (foundation-based), this is a system trying to be its own foundation.
  *   **Count:** One structural flaw, three vectors (Procedural, Ontological, Temporal).
  *   **Thematic Core:** The impossibility of a system bootstrapping its own legitimacy without an external anchor.

  This structure is the legal equivalent of a black hole: it bends the logic of the settlement around it until time and authority break down. It is an excellent engine for conflict.
