answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Moral Status of Everyday Conventions and Visitor Obligations
  **Parties:** Convention-Realists and Convention-Minimalists
  **Date:** October 26, 2023

  ## I. AGREED CLAIMS

  We, the undersigned parties, acknowledge that while we differ on the normative weight of social conventions, we share a common conceptual framework. To prevent further dialogue from collapsing into definitional confusion, we stipulate the following points of agreement:

  1.  **Definition of Convention:** A convention is a regular pattern of behavior within a group, sustained primarily by the expectation that others will follow it and the preference to follow it *because* others do. It is distinct from a law (no formal sanction) and a moral universal (not binding across all contexts).
  2.  **Localness:** A convention is "local" when its binding force is limited to a specific geography, institution, or social sphere. We agree that a visitor can identify a convention as local through observation or explicit instruction, even if they do not understand its historical origin.
  3.  **Expectation vs. Enforcement:** We agree that the mere existence of an expectation does not entail a right to enforce it. A community may expect a behavior without being morally permitted to shame, coerce, or punish a violator. The strength of the expectation is not identical to the severity of the sanction.
  4.  **Harm and Unfairness:** We agree that breaking a convention can cause harm, but we distinguish between *material setback* (physical injury, financial loss) and *frustration of expectation* (confusion, annoyance, disrupted coordination). We further agree that "unfairness" involves gaining an advantage within a cooperative scheme that others are sustaining. However, we reserve judgment on whether frustration of expectation *counts* as harm for moral purposes (see Disagreements Table).
  5.  **The "Dying Convention" Clause:** We agree that if a convention is visibly dying—such that a significant majority of locals no longer observe it themselves—the obligation to follow it diminishes for everyone, including visitors. A rule kept alive only by outsiders is not a living convention.
  6.  **Visitor Baseline:** We agree that a visitor who is transient (not joining the community) owes the host community a duty of **non-deception** and **non-disruption**. A visitor may not pretend to be a local to gain advantages reserved for locals, nor may they act in ways that halt the functioning of a shared system (e.g., blocking a doorway).
  7.  **The "Anti-Tip" Baseline:** We agree that in a town where a service charge is included and extra tipping is culturally read as an insult (implying the owner underpays staff), a visitor is informed of this norm, and the visitor tips generously anyway out of habit: this action is a deviation. We agree this deviation causes social friction. We disagree on whether that friction constitutes a moral wrong.

  ## II. DISAGREEMENTS TABLE

  The following table isolates the surviving substantive disagreements. For each, we identify the specific point of contention, the respective positions, the "crux" (the smaller question that, if settled, would shift the debate), and a test case with advance predictions.

  | Sub-Question | Convention-Realist Position | Convention-Minimalist Position | The Crux | Agreed Test Case / Evidence | Predictions (What settles the Crux) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Does a convention's being a fair solution to a shared problem give it moral force beyond the harm its breach would cause?** | **Yes.** A convention is a cooperative scheme. To breach it is to fail to do one's part in a fair system, even if the specific breach causes no observable damage. The wrong is in the free-riding, not the outcome. | **No.** The moral force is exhausted by the prevention of harm. If a breach causes no collision, delay, or confusion, there is no free-riding, only a difference in style. | **The Empty Stairway:** Is it wrong to walk on the "wrong" side of a narrow stairway if no one else is present to be inconvenienced? | **Case:** A narrow stairway in a private club where members walk on the left. A visitor walks on the right. The stairway is empty; no collision occurs; no one sees. | **Realist:** The visitor acted wrongly (violated the fair scheme).<br>**Minimalist:** The visitor acted permissibly (no harm done).<br>*Settler:* If the Minimalist admits a *pro tanto* reason existed but was overridden, the gap narrows. If the Realist admits no wrong occurred without an observer, the gap narrows. |
  | **2. Are such obligations owed to participants who have tacitly accepted the practice rather than to anyone who merely passes through it?** | **Yes, primarily to the practice.** The obligation is to uphold the integrity of the local normative order. A visitor disrupts the "moral ecology" even if no specific participant is harmed. | **No, to specific participants.** Obligations are interpersonal. If the specific people interacting with the visitor are not harmed or deceived, the visitor owes nothing to the "community" as an abstract entity. | **The Dying Queue:** A queue system (take-a-number) has an informal "courtesy gap" for people slipping out. Locals have stopped respecting the gap, but the rule remains on the books. | **Case:** A visitor sees locals ignoring the gap. The visitor also ignores the gap to save time. No one complains; the system functions. | **Realist:** The visitor compounded the degradation of the practice. They owed it to the *system* to uphold the gap even if locals didn't.<br>**Minimalist:** The visitor owed nothing. The locals abandoned the practice; the visitor merely matched the actual behavior of the participants.<br>*Settler:* If Realists concede the visitor's duty is zero when local compliance drops below 50%, the crux shifts to measurement. |
  | **3. Is benevolent deviation (doing "more" than required) morally permissible when it violates a local norm?** | **No, not if it undermines the norm.** Generosity that insults (e.g., tipping where it implies underpayment) disrespects the local moral agreement. It imposes an external value system on the host. | **Yes.** Moral liberty includes the freedom to be generous. Unless the deviation is coercive or deceptive, the visitor is free to follow their own conscience, even if it causes mild awkwardness. | **The Insulting Tip:** In the "Anti-Tip" town, is the visitor morally required to suppress their instinct to be generous to avoid the insult? | **Case:** A visitor leaves a 20% tip in a no-tipping zone. The server is annoyed (implies low wage) but keeps the money. The visitor feels good. | **Realist:** The visitor prioritized their own moral self-image over the community's dignity. This is morally selfish.<br>**Minimalist:** The visitor prioritized generosity. The server's annoyance is a preference, not a right. The tip is a gift.<br>*Settler:* If Minimalists agree the visitor has a duty to *learn* the norm first, the disagreement becomes about the weight of the offense. |

  ## III. ANALYSIS OF VERBAL DISPUTE

  We acknowledge that a portion of our quarrel is verbal, specifically regarding the label **"Moral Obligation."**

  1.  **The Realist Usage:** For the Realist, "moral obligation" denotes any normative reason that is **binding and non-optional**, regardless of the stakes. To them, the distinction between "immoral" and "rude" is a difference of degree (severity of sanction), not kind. If a convention creates a genuine reason to act, it falls under the moral umbrella.
  2.  **The Minimalist Usage:** For the Minimalist, "moral obligation" denotes a normative reason that involves **significant stakes regarding welfare, rights, or justice**. To them, the distinction between "immoral" and "rude" is a difference of kind. Etiquette creates *social* reasons, but not *moral* ones.
  3.  **Resolution:** We agree that this verbal dispute obscures a substantive agreement on **action-guidance**.
      *   If the Realist means, "You have a decisive reason to follow the convention unless outweighed by significant concerns," and
      *   The Minimalist means, "You have a strong social reason to follow the convention, but you are not 'immoral' if you don't,"
      *   **Then:** Both sides agree that the visitor *should* generally follow the convention, and both agree that there are exceptions (e.g., emergency, dying convention).

  **Conclusion on Verbality:** The quarrel is partly verbal insofar as we argue over the *label* ("Is this wrong?" vs. "Is this rude?"). However, it is **not merely verbal** because we disagree on the **consequences of violation**. The Realist believes the violator is liable to moral blame (guilt, standing to be condemned); the Minimalist believes the violator is liable only to social friction (annoyance, loss of reputation). This difference matters for how we judge the visitor's character after the fact.

  ## IV. RECOMMENDATION FOR SEMINAR DISCUSSION

  We recommend that future discussions abandon the binary question "Is it moral or etiquette?" and instead ask: **"What is the cost of deviation, and who bears it?"**

  *   In the **Stairway Case**, the cost is potential collision. If the risk is zero, the Minimalist view prevails.
  *   In the **Anti-Tip Case**, the cost is social meaning. If the meaning is insult, the Realist view prevails (generosity does not justify insult).
  *   In the **Dying Convention Case**, the cost is systemic degradation. If the system is already dead, neither view requires adherence.

  By focusing on the *mechanism* of the obligation (coordination, respect, or harm prevention) rather than the *label*, we can resolve specific cases without settling the metaphysical status of etiquette.

  ***

  **Signed,**

  *The Convention-Realist Camp*
  *The Convention-Minimalist Camp*
