prompt: |-
  You are a philosopher of education and a careful reader of fiction; think this through carefully, and begin by brainstorming the candidate readings before you commit to one. I am preparing a seminar on Locke's Some Thoughts Concerning Education and want to pair it with William Golding's Lord of the Flies — not the standard reading about the darkness of human nature, but a reading through Locke's actual educational machinery. Treat the plot as common knowledge and do not quote the text; I want interpretation, not citation. The claims I want tested are the specific ones: that habit and practice, not precept, form character, and must be laid down early; that esteem and disgrace are the mainsprings of discipline, which makes the rod both cruel and inept; that children should be reasoned with as rational creatures rather than commanded; that a tutor must study a particular child's temper and suit the method to it; and that the schoolroom corrupts precisely because a boy there is shaped by other boys rather than by one well-chosen adult. The island looks to me like Locke's system with the tutor deleted. Using concrete touchstones — the first assembly and the conch, the painted faces and the hunting dance, Piggy's glasses, Simon's death, the officer on the beach — say which scenes dramatize which claims and which quietly embarrass them. Where does the novel expose a presupposition of the theory, for instance that esteem and disgrace can only discipline a child who already cares about the opinion of the adults around him, so that the account requires the very formation it is meant to explain? Does the island confirm Locke's warning about boys shaping one another, or show that character formation is impossible without a social order he takes for granted? And does the novel exploit the tension between Locke the anti-innatist and Locke the tutor who tells us to study a child's native temper? End by saying what the novel contributes to this debate that argument alone does not, and be explicit about where the reading strains and the novel resists it.
