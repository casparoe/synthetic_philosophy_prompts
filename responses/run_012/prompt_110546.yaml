      *Refining the "Circularity" point:* Locke says use esteem/disgrace. But why does the child care? Because of habit/affection formed *early*. On the island, the boys are older (12-ish). They have *had* that formation, but it evaporates. This suggests Locke's formation is fragile and dependent on continuous enforcement, not just early laying down. Or, it suggests that "esteem" is transferable. If the adult leaves, esteem transfers to the alpha male. This challenges Locke's idea that the *tutor's* esteem is unique.

      *Refining the "Innatist" point:* Locke says no innate principles. But he says study the child's "inclination." If the inclination is toward blood (Jack), is that innate? Golding suggests yes. Locke would say it's a habit formed before the island. The novel leaves it ambiguous enough to torture the Lockean distinction.

