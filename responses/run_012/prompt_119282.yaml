answer: |-
  **What holds up**
  The core intuition you recall regarding adverse selection is robust and widely accepted: in a transaction driven solely by speculative information, the willingness of a counterparty to trade is indeed a signal you must account for. If you assume your counterpart is rational and better informed, accepting their offer implies you are accepting a losing bet. This insight, formalized as the Milgrom-Stokey No-Trade Theorem (1982), correctly identifies that if prices fully reflect all private information and traders share common prior beliefs, speculative volume should theoretically vanish. The summary accurately captures the logical tension between rational expectations and trading volume: if everyone is perfectly rational and prices are perfectly informative, there is no mutual gain from swapping assets based on differing opinions, because differing opinions shouldn't exist among rational agents with common priors.

  **Where it slips**
  The summary conflates several distinct economic concepts and overextends a theoretical baseline into a blanket statement about reality. First, it claims "none of them will ever agree to a trade," which is false; the theorem applies only to *speculative* trade driven by information differences, ignoring trade motivated by liquidity needs, hedging, or consumption smoothing. In standard models, "noise traders" or agents with exogenous cash shocks trade not because they think they have better information, but because they need cash or need to rebalance risk; their presence allows rational traders to provide liquidity without being "suckers." Second, the summary assumes "shared background beliefs" (common priors) is a realistic description of markets, whereas economists view this as a restrictive modeling assumption; if traders have heterogeneous priors (different interpretations of the same data), trade occurs naturally without anyone being irrational. Third, the leap to "markets only function because most participants are wrong" is a normative overreach; markets function because participants have different *needs* and *risk tolerances*, not necessarily because they are wrong about value. Fourth, the claim that "professional stock-pickers can't beat the index" is a statement of the Efficient Market Hypothesis (EMH), not the No-Trade Theorem; the No-Trade Theorem suggests volume should be zero, while EMH suggests excess returns should be zero, and these are not identical. Finally, the summary treats the "prices contain all information" claim as a settled fact derived from the theorem, whereas the theorem actually treats it as a precondition; it assumes information is already aggregated to prove trade won't happen, rather than explaining how information gets aggregated.

  **The defender's reply**
  An economist specializing in market microstructure would defend the theorem not as a description of reality, but as a "frictionless" benchmark similar to vacuum conditions in physics. They would argue the theorem's purpose is to isolate the specific conditions required for trade to occur: to explain why volume exists, you must explicitly model liquidity shocks, differences in risk aversion, or heterogeneous beliefs, rather than assuming them away. The defender would clarify that the theorem does not prove traders are irrational; rather, it proves that *purely information-driven* speculation between rational agents with common priors is impossible. Therefore, the existence of high volume is evidence that agents have different motives (hedging/liquidity) or different models of the world, not necessarily that they are "wrong." The theorem is a tool to force modelers to be precise about *why* trade happens, not a proof that trade is impossible in the real world.

  **What survives**
  After corrections, the enduring insight is that trading volume requires an explanation beyond simple information differences; you need liquidity traders or heterogeneous beliefs to get markets to move. The second claim you encountered—that if prices were perfectly informative no one would be paid to gather information—is **not** the same result; that is the Grossman-Stiglitz Paradox (1980). While the No-Trade Theorem asks "Why trade if prices are right?", the Grossman-Stiglitz Paradox asks "How do prices get right if no one is paid to find out?" Together, they suggest markets are a balance of informed traders, noise traders, and liquidity providers, rather than a binary of "rational" vs. "wrong."
