          *   It highlights the necessity of *noise traders* or *liquidity traders* to explain volume. It doesn't prove everyone is irrational, just that pure information-based speculation requires a non-rational counterparty or a different motive (hedging).
          *   Key assumptions: Common priors, rational expectations, no liquidity shocks.

      *   **What survives:**
