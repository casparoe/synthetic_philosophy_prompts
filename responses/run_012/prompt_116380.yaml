      *   *Better nuance:* The prompt asks about the *pattern*. Is the *pattern* irrational? Yes. Should you pick A or B? That depends on your utility function. But the *pattern* A & D is the problem.
      *   *Okay, I'll argue:* The pattern is irrational. A sensible person should align their preferences. If they value certainty so much, they should value it consistently (which leads to C > D). Since most people pick D > C, they reveal they *don't* actually value certainty enough to justify A > B. Therefore, they should switch to B.
      *   *Wait, if they value certainty, they pick A. If they pick D, they don't value the 1% risk of zero enough to forego the 5m.*
      *   *Let's go with:* The pattern is irrational. A sensible person should pick **B and D**. Why? Because the expected value difference is massive, and the "certainty" is a cognitive illusion when the probabilities are laid out transparently. The 89% common consequence should be cancelled.

      *   *Re-evaluating the "Sensible Person" advice:*
