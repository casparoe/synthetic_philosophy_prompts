          *   So EV maximization says B and D.
          *   EUT says B and D (assuming linear utility for money, or concave but not *that* concave).
          *   The Allais Paradox is specifically about the *switch*.
          *   I will advise that the sensible person should recognize the framing trick and choose **B and D**. This maximizes expected return and maintains consistency.

  7.  **Drafting - Section by Section:**
