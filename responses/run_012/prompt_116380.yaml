          *   Contradiction: The inequalities are opposites.
      *   *Core Issue:* The Independence Axiom. The 89% chance of £1m is common to A and B. If you cancel it out, you are left comparing C and D. Preferring A over B implies you should prefer C over D.

  3.  **Evaluate the Mate's Argument ("Certainty Bonus"):**
      *   The mate argues that certainty has intrinsic value (psychological or otherwise).
      *   *Counter:* EUT assumes utility is assigned to *outcomes*, not the *probability distribution* itself. If "certainty" is an outcome feature, it needs to be modeled. However, standard EUT treats probabilities linearly.
      *   *Regret Theory:* Loomes and Sugden suggest people anticipate regret. Choosing B and getting £0 is more painful than choosing A and getting £1m.
