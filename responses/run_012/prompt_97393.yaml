answer: |-
  Here is the argument you need to settle the bet.

  ### The Core Mechanism: Logical vs. Causal Dependence

  Your friend is correct that Program Equilibrium (PE) allows for mutual cooperation in a one-shot setup, but your intuition is also correct: this feels like it violates the standard dominance argument. The resolution lies in recognizing that PE does not solve the standard Prisoner's Dilemma (PD); it solves a *different game* by changing the ontology of the players.

  In the standard PD, the fundamental assumption is **causal independence**. My choice cannot causally influence your choice because we move simultaneously (or without knowledge of the move). Defection dominates because, causally, my move changes the outcome column, but not your row.

  In Program Equilibrium, the "move" is submitting a program. The programs then execute. Crucially, the programs have access to each other's source code *before* outputting a move. This creates **logical dependence**. If I submit a program that says, "I will do exactly what your program does," and you submit the same program, our outputs are logically locked together. It is not that my choice *causes* yours; it is that our choices are derived from the same logical truth.

  However, this logical lock is functionally identical to an enforceable contract. In the real world, if we could sign a binding contract saying "I will Cooperate if and only if you Cooperate," we would both Cooperate. The source code *is* that contract. The "code reading" is the enforcement mechanism that verifies the contract terms are met before execution. Therefore, PE is not a discovery of hidden rationality within the standard PD; it is the introduction of a **perfect, costless commitment device**.

  ### The Corruption Wrinkle

  This brings us to your 5% corruption scenario. This is the stress test that reveals the true nature of the equilibrium.

  Imagine you submit a "FairBot": `if (other_source == my_source) then Cooperate else Defect`.
  If the referee's sandbox flips one bit in the source code you read from your opponent, the string comparison fails. `other_source` is no longer identical to `my_source`. Your program Defects. Your opponent's program (reading your clean or corrupted code) likely also sees a mismatch and Defects. Mutual cooperation collapses immediately into mutual defection.

  Could you write a smarter program to survive this? You might try: `if (other_source is logically equivalent to me) then Cooperate`. But determining logical equivalence of arbitrary code is undecidable (the Halting Problem). You cannot write a general program that reliably recognizes "copies of itself" if those copies are obfuscated or slightly noisy, without risking exploitation by a Defector that mimics you just enough to pass the check but defects on execution.

  There are advanced constructions (like "Modal Agents" or logical inductors) that can achieve "robust cooperation" under some uncertainty, but they require the players to share a specific logical framework and trust the referee's noise model. If the corruption is an external, unmodeled environmental hazard, the logical link is severed.

  The fact that a tiny amount of noise destroys the equilibrium tells us something vital: **Logical dependence is brittle; causal commitment is robust.** Real-world commitment devices (escrow accounts, legal contracts) have error correction and enforcement mechanisms that survive noise. Program Equilibrium relies on perfect transparency and exact logical identity. When that perfection is compromised, the "rational" cooperation vanishes.

  ### The Verdict

  Program Equilibrium is a **commitment device in disguise**.

  It does not overturn the dominance argument of the standard PD. Instead, it bypasses it by transforming the game from one of causal choice to one of logical constraint. The "work" being done by the code-reading is the establishment of common knowledge of strategy *before* the move is finalized, which is the definition of binding pre-commitment.

  The corruption test confirms this. If PE were a fundamental feature of rationality (like Nash Equilibrium), it should be somewhat robust to small perturbations in information. The fact that cooperation collapses under source-code noise shows that the equilibrium rests on an idealized assumption of perfect transparency. It works only in a Platonic realm where code is perfectly readable and executable without error. In any physical instantiation where bits can flip, the logical tie breaks, and you revert to the standard causal PD where Defect dominates.

  Therefore, your friend is right that it yields cooperation, but you are right to be suspicious. It buys cooperation by changing the rules to allow perfect contracting, not by finding a flaw in decision theory.

