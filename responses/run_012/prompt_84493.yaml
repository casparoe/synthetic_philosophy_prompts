answer: |-
  1. Bottom line
  My credence in the thesis is 0.45, indicating significant skepticism about a non-instrumental duty persisting indefinitely without living beneficiaries. While remembrance is often valuable, grounding it strictly in obligations to the dead exceeds current metaphysical and ethical consensus.

  2. The proposition
  The thesis asserts that a political community owes a non-instrumental moral duty to maintain public remembrance of historical atrocities, grounded solely in respect for the dead rather than future prevention or identity. This proposition is true if such a duty exists independently of consequences and survives the death of all direct participants; it is false if the duty dissolves without instrumental benefits or living claimants.

  3. Decomposition
  To evaluate the thesis, I assess the likelihood that each necessary condition holds true enough to sustain a non-instrumental duty across generations. The following probabilities reflect my confidence that the answer to each sub-question supports the existence of such a duty rather than undermining it.

  (a) Can the dead be wronged? Probability: 0.60. Justification: Posthumous harm is metaphysically contested but ethically plausible in limited contexts regarding reputation or will. Probability of: The claim that dead individuals retain moral status capable of being violated by the living community's actions.
  (b) Is remembrance non-instrumental respect? Probability: 0.50. Justification: Respect often collapses into instrumental identity formation upon close philosophical scrutiny regarding public rituals. Probability of: Remembrance functioning as intrinsic respect rather than merely a tool for living communities to define themselves.
  (c) Is memory a public good owed to the community? Probability: 0.70. Justification: Political communities bear collective responsibilities distinct from the sum of individual citizen duties. Probability of: The state holding duties regarding memory that transcend individual citizen interests and private grieving processes.
  (d) Do generations weaken the duty? Probability: 0.40. Justification: Temporal distance typically attenuates special obligations unless grounded in universal human rights rather than specific history. Probability of: The duty persisting robustly despite the passing of direct causal links and relational proximity to victims.
  (e) Do costs override the duty? Probability: 0.50. Justification: Mandatory grief imposes psychological burdens that may trump abstract duties to the past in liberal societies. Probability of: The costs of remembrance remaining low enough not to extinguish the obligation under changing social conditions.
  (f) Is forgetting the default? Probability: 0.50. Justification: Moral neutrality suggests no inherent duty to remember without specific prior commitments or promises made. Probability of: The baseline moral state requiring active justification for continued remembrance rather than active justification for forgetting.
  (g) Does archival access suffice? Probability: 0.30. Justification: Ritual presence provides unique moral recognition that passive archives cannot replicate for the public sphere. Probability of: The claim that public ritual is necessary rather than merely historical knowledge being preserved for scholars.
  (h) Can duties exist without claimants? Probability: 0.50. Justification: Obligations usually require a rights-holder, which the dead cannot strictly be in legal or functional terms. Probability of: The coherence of duties owed to entities incapable of claiming, waiving, or acknowledging the obligation.

  This decomposition isolates the metaphysical and normative bottlenecks that determine the overall viability of the proposed non-instrumental duty across generations. The lower probabilities on generational attenuation and archival sufficiency suggest the thesis struggles to justify public ritual over private knowledge.

  4. Combination and sensitivity
  I combine these probabilities qualitatively rather than multiplicatively, as the conditions are interdependent rather than strictly conjunctive logical gates. The low scores on generational attenuation (0.40) and archival sufficiency (0.30) drag the overall credence down significantly, suggesting the duty weakens over time and ritual is not strictly required for moral satisfaction. My final credence of 0.45 reflects a weighted average where the strong collective duty (0.70) is offset by the weak metaphysical status of the dead (0.60) and the high cost of mandatory grief (0.50). The calculation is most sensitive to sub-question (a), regarding whether the dead can be wronged. If the dead cannot be subjects of harm, the non-instrumental duty collapses entirely into instrumentalism, rendering the thesis false by its own definition.

  The disagreement between your 0.3 and your colleague's 0.7 most likely lives in sub-question (a) and (b). You likely view the dead as morally inert, making the duty conceptual nonsense, while your colleague sees personhood as extending beyond death into the social realm. This is primarily a moral and conceptual disagreement, not empirical. It hinges on the ontology of personhood rather than data about atrocity prevention or social cohesion metrics. Your colleague likely assigns a much higher probability to the coherence of posthumous rights, whereas you prioritize the liberty of the living over the status of the dead. Resolving this requires agreeing on whether moral patients exist without consciousness. If the disagreement were empirical, we would argue about the effects of forgetting; instead, we argue about the status of the forgotten. This conceptual divide explains the wide variance in credence despite shared knowledge of the historical facts.

  5. What would move the number
  The strongest argument for the thesis is a Kantian demand for respect: treating victims merely as means to future prevention violates their dignity, requiring remembrance for their own sake. The strongest argument against is the "no claimant" problem: duties correlate with rights, and the dead cannot assert rights or feel the slight of forgetting. To shift my credence upward significantly, I would need a robust account of posthumous interests that does not rely on the psychological states of the living mourners. Specifically, evidence that forgetting constitutes an objective harm to the deceased's biographical life, independent of living perception, would raise my probability on sub-question (a). Conversely, demonstrating that mandatory public grief causes measurable social fragmentation would lower my credence by strengthening sub-question (e). Currently, the lack of a non-instrumental mechanism keeps my credence below 0.5. I remain unconvinced that ritual adds moral value over archives without instrumental benefits. A successful philosophical derivation of duty without a living beneficiary would be the key evidence required to move my number toward your colleague's 0.7. Until then, the burden of proof remains on those claiming the dead hold claims against the living.
