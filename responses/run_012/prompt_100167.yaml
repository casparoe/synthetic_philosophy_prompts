prompt: |-
  I have just spent a long evening arguing with a friend who does reward shaping in a robotics lab, and the argument pushed me to commit to a position I mean to present next month: inverse reinforcement learning has misdescribed its own target. I will argue that what should be inferred from behavior is not a utility function but a feasible set of constraints on admissible policies—what I call the constraint-first view—and that the standard reward-centered formulation is not merely underdetermined but conceptually backwards. The audience will be a lab meeting: mostly deep RL researchers who treat the reward signal as primitive, one economist who works on revealed preference and will ask how this differs from standard choice theory, and one cognitive scientist who studies how people actually decide. Prepare my Q&A prep sheet: the objections I will actually get from this audience, ordered by how likely and how damaging they are, each phrased the way that person would phrase it, with a two-minute reply, a note on where the reply is weakest, and what I should concede up front. Include the question I am hoping nobody asks. If my thesis is confused, or if the prep-sheet format cannot do what I am asking, say so plainly rather than humoring me.
reasoning: |-
