answer: |-
  **The Ballast Book**

  The smoke in the underwriting room was thick enough to chew, hanging over the green baize tables like a low ceiling. Elias Thorne dipped his pen into the inkwell and waited for the nib to stop trembling. It wasn't age making his hand shake; it was the file in front of him.

  The *SS Meridian*. A new turbine design. Route: London to Bombay.

  Julian Vane leaned over the desk, tapping the calculation sheet. "Five percent, Elias. We both agree. One in twenty she goes down. At the premium they're offering, the expected value is positive. It's free money."

  "It's not free if the ground isn't there," Thorne said. He opened the heavy leather ledger that sat between them. The firm called it the Ballast Book. It looked like any other account book, except for the second column.

  Column One was labeled *Probability*. Column Two was labeled *Anchor*.

  Thorne wrote *5%* in the first column. Then he picked up the stack of papers supporting the risk. There were three sheets: the builder's guarantee, a single sea trial report, and the captain's CV. He weighed the stack in his hand. It was light. Barely anything.

  In the *Anchor* column, Thorne wrote *1*.

  "Look at the Cornish run," Vane said, slapping a different file down. "Same risk. Five percent. But look at the Anchor."

  Thorne looked. The Cornish file was thick. Fifty years of logs, weather reports, repair manifests. In the Ballast Book, that entry read *5%* | *Anchor 10*.

  "The number is the same," Vane said, spreading his hands. "The profit is the same. Why does the thickness of the paper matter? The sea doesn't care how much we know about it. It only cares if the ship floats."

  "The sea doesn't care," Thorne agreed, closing the ledger. "But we do. If I'm wrong on the Cornish run, I was unlucky. If I'm wrong on the *Meridian*, I was blind. I won't write it."

  "You're leaving ten thousand pounds on the table because you're afraid of the dark."

  "I'm afraid of pretending the dark isn't there."

  Vane straightened his tie, exhaling a plume of cigarette smoke. "You look like a coward to the partners, Elias. They see a five percent risk. They don't see your 'Anchor.' They see a man turning away profit because he wants a guarantee God never promised."

  "Let them look."

  Vane walked away, leaving Thorne alone with the ledger. Thorne rubbed his eyes. He needed to clear the desk before the afternoon meeting. He picked up two other files waiting for review.

  The first was a warehouse in Manchester. Fire risk: 2%. Anchor: 9. Decades of data on brick construction, sprinkler systems, local fire brigade response times.

  The second was a cargo of experimental chemicals across the Atlantic. Explosion risk: 2%. Anchor: 2. One lab report, no shipping history.

  Thorne held the files in either hand. He needed to prioritize which one to reprice. Usually, you'd pick the riskier one. But the probabilities were identical. Two percent.

  He looked from the Manchester file to the Chemicals file. Which was safer?

  Logically, the number was the same. But the feeling was different. The Manchester risk felt solid, like a stone wall. The Chemicals risk felt like glass—transparent, but liable to shatter if you leaned on it. He tried to place them in order. *This one is safer than that one.* But the words wouldn't come. They weren't comparable. One was a known quantity with a low chance of failure. The other was an unknown quantity with a low chance of failure.

  To say one was "better" felt like comparing the weight of a brick to the weight of a promise.

  He set them down without ranking them. He couldn't do it. The scale wouldn't balance.

  The partners came in at four. They saw the *Meridian* file untouched. They saw the Ballast Book open to the page with the *1* in the Anchor column.

  "Thorne," the senior partner said, voice flat. "Vane says you're blocking the *Meridian*."

  "I am."

  "On what grounds? The math holds."

  "The math holds up the roof," Thorne said, tapping the Anchor column. "But there are no walls. We are pricing a ghost."

  "We are pricing a premium," the partner corrected. "We take the commission. If she sinks, we pay. If she doesn't, we eat. That is the business."

  "Not this business. Not under my name."

  They overruled him. It was a majority vote. The *Meridian* policy was written. Thorne was instructed to sign off on the Ballast Book, but he refused to enter the Anchor. He left the second column blank for that line.

  The commission hit the account the next week. Ten thousand pounds. The room felt brighter, lighter. Vane bought a round of drinks at the club. Thorne drank water.

  For three months, the *Meridian* was the talk of the floor. Every day the telegraph didn't bring news of a sinking, Vane glanced at Thorne. The probability was holding. The weight didn't matter. The ship was floating.

  Then, the winter storms hit the Bay of Biscay.

  Thorne sat at his desk, the Ballast Book open. He looked at the blank space in the Anchor column where the *Meridian* should have been. He picked up his pen. He didn't know if the ship would sink today. He didn't know if it would make it to Bombay. The probability hadn't changed—it was still the same unknown five percent it had been on day one. But the silence in the room was heavier.

  He closed the book. The cost wasn't the money they'd made. It was the feeling that when the news finally came, whether it was good or bad, it wouldn't tell them anything about whether they were smart, or just lucky.

