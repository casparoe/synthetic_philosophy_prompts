      *   **Consistency Check:** The tax vs. constitution tension reveals a *Liberal-Populist Hybrid*. Populist on structure, Liberal (Lockean) on property. It's not logically consistent in terms of "who is trusted," but it is consistent in terms of "protecting liberty from democracy."
      *   **Rival View:** Choose *Deliberative Democracy*.
