      *   *Popular Will:* The initiative process assumes the people *have* an answer if asked. It treats the will as latent but discoverable via the ballot.
      *   *Legitimacy:* Consent seems primary (you voted, you're bound). But the supermajority for taxes suggests a protection of rights/property against the majority, hinting at a substantive correctness or higher threshold for harm.
      *   *Polity Theory:* Switzerland's double majority is federalist (people + states). California's is more populist but constrained by constitutional locks (Prop 13 style).
      *   *Separability:* Single-subject rules assume issues *can* be separated. This is a strong assumption (logrolling is prevented, but synergy is lost).
      *   *Consistency:* There is a clear tension. Why is the constitution (foundational) easier to change in CA than a tax rate? This suggests a specific view of property rights vs. structural rules.

  3.  **Drafting the Reconstruction (Section by Section):**

      *   **Introduction:** Acknowledge the user's insight. The inconsistency *is* the theory. It's not a bug; it's a feature of a hybrid system.
