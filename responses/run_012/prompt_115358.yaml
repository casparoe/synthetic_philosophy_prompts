          *   California: Simple majority initiative for constitution, supermajority (2/3) for taxes (legislature & local), single-subject rule, voter pamphlets.
          *   Tension: Same electorate trusted with constitution (simple majority) but distrusted with taxes (supermajority).
      *   **Specific Questions to Answer:**
          *   Is a vote a preference or a judgment?
