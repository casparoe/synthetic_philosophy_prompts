answer: |-
  The inconsistencies you identify are not bugs in the software of direct democracy; they are the source code. The rules of Swiss and Californian direct democracy do not emerge from a single, unified political philosophy. Rather, they embody a **hybrid theory of sovereign populism constrained by liberal entrenchment.**

  Here is the reconstruction of the implicit theory, separated into its ontological, epistemic, and structural commitments, followed by an analysis of its tensions and a comparison with a rival view.

  ### I. The Ontology of the Vote: Command, Not Judgment
  The practice treats a vote primarily as a **sovereign command** rather than a deliberative judgment.
  *   **Aggregation vs. Weighing:** The mechanism is purely aggregative (counting heads), but the *status* of the input is treated as a judgment. By allowing a bare majority to amend a constitution (California) or overturn a statute (Switzerland), the system assumes the voter is acting as a legislator, not merely a consumer expressing preference.
  *   **The Silence on Turnout:** The lack of minimum turnout requirements is theoretically loud. It presupposes that legitimacy derives from the *opportunity* to consent, not the *act* of consent. Abstention is tacitly interpreted as acquiescence. This rules out the theory that legitimacy requires active, ongoing engagement (civic republicanism). Instead, it assumes a **negative liberty model of participation**: the people are sovereign because they *can* stop the government, not because they *must* run it.

  ### II. The Metaphysics of the Will: Latent and Determinate
  The initiative process presupposes a **determinate popular will that exists independently of the procedure.**
  *   **Discovery, Not Formation:** The rules assume the "people" already know what they want on a specific issue. The ballot is a measuring device, not a forum for forming opinion. If the will were formed *through* debate, the inability of parliament to amend an initiative (Switzerland) would be nonsensical; one would expect the representative body to refine the raw popular sentiment.
  *   **The Counter-Proposal Exception:** The Swiss provision for a parliamentary counter-proposal admits a slight crack in this theory. It acknowledges that the popular will might be inarticulate or impractical, but it still preserves the binary choice. The people must choose between *their* will and *parliament's* will; they cannot synthesize a third.

  ### III. Legitimacy: Consent with Substantive Constraints
  The system treats legitimacy primarily as **procedural consent**, but it layers **substantive correctness** on top of it for specific categories.
  *   **Why the Silence on Information?** The voter pamphlet (California) suggests an epistemic concern (voters *should* know), but the lack of binding standards for voter competence suggests this is merely accommodative. The system does not require voters to be right; it requires them to be sovereign.
  *   **The Tax/Constitution Tension:** You note the inconsistency: a majority is trusted with the constitution but distrusted with taxes. This is not a confusion of competence; it is a **theory of rights.**
      *   *Constitutional Amendments:* Treated as procedural rules of the game. A simple majority suffices because these are viewed as adjustments to the machinery of consent.
      *   *Taxation:* Treated as a violation of pre-political property rights. The supermajority requirement (California's Prop 13 legacy) presupposes that taxation is an inherent harm that requires a higher threshold of justification than ordinary governance.
      *   *Implicit Theory:* **Lockean Populism.** The people are trusted to define their political structure (social contract) but distrusted to infringe on individual economic liberty (natural rights) without an extraordinary consensus.

  ### IV. The Theory of the Polity: The Double Majority
  The Swiss double majority (people + cantons) presupposes that the polity is **not a monosomic mass of individuals, but a federal covenant of distinct peoples.**
  *   **Two Bodies:** It treats the electorate as having two bodies: the *demos* (sum of persons) and the *federation* (union of member units).
  *   **Legitimacy Condition:** A law is legitimate only if it commands the assent of the citizens *and* the assent of the states. This rules out a purely unitary theory of democracy. It assumes that small political communities have a veto right against the aggregate will of the larger population to prevent tyranny of the majority over minority cultures/regions.

  ### V. The Logic of Framing: Atomistic Separability
  The "single-subject" rule (California) and the take-it-or-leave-it initiative presuppose that **policy issues are atomistic and separable.**
  *   **No Logrolling:** It assumes that a coherent popular will can be disaggregated into distinct issues. It presumes that voters can decide on Issue A without needing to trade off against Issue B.
  *   **The Flaw:** This rules out the theory that governance requires *packaging* conflicting interests to build coalitions. It assumes that a majority on Issue A + a majority on Issue B equals a stable governing mandate, ignoring that the majority on A may be the minority on B. It presupposes a **mechanistic composition of wills**, assuming issue-wise majorities compose into a coherent whole without contradiction.

  ### VI. Strict Presuppositions vs. Accommodations
  To distinguish what is essential to this system from what is contingent:

  **Strict Presuppositions (The system breaks without these):**
  1.  **Majoritarian Sovereignty:** Ultimately, some majority must decide. (Even supermajorities are just a redefined majority).
  2.  **Binary Choice:** The ballot must reduce complexity to Yes/No. (Essential for the "latent will" theory).
  3.  **Finality:** The vote ends the debate. (Parliament cannot override the initiative result).

  **Underdetermined / Accommodations (Contingent design choices):**
  1.  **Turnout Quorums:** The system could require 50% turnout without breaking its logic, but currently chooses not to. This is a choice to prioritize stability over active consent.
  2.  **Voter Pamphlets:** These accommodate an epistemic ideal but are not strictly required by the aggregative theory.
  3.  **Signature Thresholds:** The specific % needed to trigger a referendum is arbitrary relative to the theory; it only needs to be high enough to prevent frivolity but low enough to allow access.

  **Views Quietly Ruled Out:**
  1.  **Parliamentary Sovereignty:** The legislature is not the supreme legal authority; the electorate is.
  2.  **Pure Deliberative Democracy:** There is no requirement for consensus or reasoned agreement, only counting.
  3.  **Technocracy:** Expert opinion (fiscal analysis) is provided but is not binding.
  4.  **Unitary Nationalism:** (Specifically in Switzerland) The nation is not a single homogenous will.

  ### VII. Consistency Judgment
  Are the tax supermajority and the initiative majority in genuine tension? **Yes, but it is a stable tension.**
  It reveals that the system is not trying to be logically pure; it is trying to balance **Democratic Authority** with **Liberal Restraint**.
  *   *The Initiative Majority* asserts Democratic Authority: The people are the ultimate source of law.
  *   *The Tax Supermajority* asserts Liberal Restraint: There are spheres (property) where the democratic will is suspect.
  *   *Verdict:* The system presupposes that the "People" are wise enough to govern but dangerous when they touch the purse. It is a **self-binding theory of democracy**. The inconsistency is the point: it is a machine designed to allow the people to drive the car, but with the brakes locked unless two-thirds of them press the pedal.

  ### VIII. The Rival View: Deliberative Democracy
  If we replaced the presupposed theory (Liberal Populism) with a **Deliberative Democratic** theory, the rules would require fundamental alteration. Deliberative theory holds that legitimacy arises from free, reasoned debate among equals, where preferences are transformed, not just aggregated.

  **Required Rule Changes:**
  1.  **Abolition of the "Take-it-or-Leave-it" Ballot:** Initiatives would not go directly to a vote. They would be referred to a **Citizens' Assembly** or parliamentary committee for revision. The goal would be to refine the proposal through argument, not merely record the raw will.
  2.  **Parliamentary Amendment Power:** Parliament must be allowed to amend initiatives to incorporate expert knowledge and compromise, transforming the binary choice into a negotiated text.
  3.  **Turnout Quorums:** To ensure the "public" is actually engaging in the deliberation, a minimum participation threshold would be required to validate the legitimacy of the decision.
  4.  **Removal of Single-Subject Rules:** Deliberation often requires trade-offs. Allowing multi-subject measures would enable the "packaging" necessary for complex compromise, acknowledging that issues are not atomistic.
  5.  **Mandatory Deliberative Period:** A binding waiting period between the qualification of an initiative and the vote, dedicated to funded public debate and town halls, rather than just a pamphlet.

  **Summary:**
  The current institutions presuppose a **latent, atomistic, sovereign will** that needs only to be counted, protected from its own fiscal appetite, and structured by federal geography. They treat the voter as a **monarch** (sovereign decision-maker) rather than a **citizen** (co-deliberator). The inconsistencies you perceive are the friction points where the desire for popular rule grinds against the fear of popular excess.
