      *(Self-Correction during drafting)*: Make sure to distinguish between Switzerland and California where they differ, but synthesize where they share the "Direct Democracy" genus. The prompt asks about "the institutions of direct democracy" generally but uses CH/CA as examples. I should treat the *genus* while noting specific variations.

      *Key Insight:* The silence on turnout is crucial. It implies legitimacy comes from the *possibility* of participation, not the *act*. This is negative liberty applied to voting.

      *Key Insight on Tension:* The tax supermajority isn't about competence; it's about *entrenchment*. It treats property rights as pre-political, whereas the constitution is political.

