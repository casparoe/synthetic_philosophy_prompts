      *   *Fix:* Use clear examples. "If you set Buy at \$4, I (Bookie) sell you the ticket for \$4."
      *   *Limitation:* The game simulates *epistemic* uncertainty (unknown bias). It doesn't fully capture *ontic* indeterminacy or the full philosophical weight of Levi's credal states without the debrief. Also, real dilation often happens with precise priors over a set of likelihoods; here we simulate it with a set of priors. I need to be candid about this in the limitations section.

  8.  **Refining the Debrief:**
      *   Map "Buy/Sell Spread" to Lower/Upper Probability.
      *   Map "Set of Biases" to Credal Set.
      *   Map "Match Evidence" to Dilation.
      *   Map "Split Vote" to Decision Rules (Maximin vs E-Admissibility).

  9.  **Final Review against Prompt:**
      *   90 mins? Yes.
      *   15 students? Yes.
      *   No real money? Yes (Points/Coffee).
      *   Experience Dilation? Yes (Prior 0.5 $\to$ Posterior 0.2-0.8).
      *   Experience Decision Rules? Yes (Split vote on Sure Thing).
      *   No jargon until debrief? Yes.
      *   Arithmetic checked? Yes.
      *   Pitfalls addressed? Yes.
      *   Limitations admitted? Yes.

