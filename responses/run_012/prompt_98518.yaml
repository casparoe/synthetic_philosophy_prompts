          *   This shows the *incompleteness* of preference.
          *   *Better for game:* Ask them to commit. If they commit to Bet, they follow Maximax/Admissibility. If they commit to Cash, they follow Maximin. The group will split. This highlights the need for a rule.

  7.  **Addressing Constraints & Pitfalls:**
      *   *Constraint:* No lecture up front.
      *   *Pitfall:* Students might treat the "Unknown Coin" as 50/50 (Principle of Indifference).
      *   *Fix:* Explicitly state the bias is *unknown and could be anything between 20% and 80%*. Do not let them collapse it to 50%.
