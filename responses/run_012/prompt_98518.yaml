answer: |-
  # Session Plan: The Trader's Dilemma
  **Time:** 90 Minutes  
  **Participants:** ~15 Graduate Students  
  **Facilitator Role:** The "House" (Bookie & Arbiter)  
  **Materials:** Whiteboard, 20 "Bias Cards" (labeled 0.20, 0.25, ..., 0.80), 30 "Bet Tickets", Play Money (or points tracked on board).

  ## 1. The Setup (0–10 Minutes)
  **Goal:** Establish the betting mechanism without theory.

  **Instructions to Group:**
  "You are traders. I am the House. We are trading tickets that pay **100 Points** if a specific event happens, and 0 otherwise.
  For every ticket, you must quote two prices:
  1.  **Buying Price:** The most you will pay to *hold* the ticket.
  2.  **Selling Price:** The least you will accept to *give up* the ticket (or short it).

  **Rule 1:** Your Buying Price must be $\le$ Your Selling Price. If Buy > Sell, you are 'arbitraged' immediately and lose 50 points.
  **Rule 2:** Once you quote, I (the House) can choose to buy from you at your Selling Price or sell to you at your Buying Price.
  **Goal:** Maximize your Points. The top three traders get first pick of next week's reading topic (and coffee)."

  **The Asset:**
  "Event $A$: A Fair Coin ($C_1$) lands **Heads**."
  *Demonstrate with a physical coin.* "Everyone quote a Buy/Sell spread for Event $A$."
  *Expected Outcome:* Most will quote 50/50 or 49/51.
  *Action:* Accept a few trades at 50. Flip the coin. Settle debts.
  *Point:* Establish that for a known fair coin, a precise price is rational.

  ## 2. The Dilation Trap (10–40 Minutes)
  **Goal:** Force the interval to widen upon receiving evidence.

  **New Information:**
  "We are adding a second coin, $C_2$. $C_2$ is biased, but the bias is unknown.
  I have a deck of cards representing the bias ($\theta$) of $C_2$. The cards range from 0.20 to 0.80.
  I have drawn one card. I know $\theta$. You do not. You only know $\theta \in [0.20, 0.80]$.
  $C_1$ (Fair) and $C_2$ (Biased) are tossed independently."

  **The Evidence:**
  "I will now look at the results of both tosses. I will tell you one thing: **Did they Match (HH/TT) or Mismatch (HT/TH)?**"
  *Flip both coins (simulated or actual). Look at results.*
  "I announce: **They Matched.**"

  **The Task:**
  "Quote a new Buy/Sell spread for Event $A$ ($C_1$ = Heads), *given* that they Matched."

  **The Trap (Facilitator Notes):**
  *   If a student quotes a single price (e.g., 50/50), you must Dutch Book them.
  *   *Secretly check your Bias Card.* Suppose you drew $\theta = 0.20$.
  *   The true probability of $C_1$=Heads given a Match is exactly $\theta$ (see Arithmetic below). So the true prob is 0.20.
  *   If the student Sells at 50, you Buy from them at 50. The ticket is worth 20. They lose 30 points.
  *   If the student Buys at 50, you Sell to them at 50. The ticket is worth 20. They lose 30 points.
  *   To be safe against *any* card in the deck ($0.20 \le \theta \le 0.80$), they *must* quote:
      *   **Buying Price $\le$ 20**
      *   **Selling Price $\ge$ 80**

  **Activity:**
  1.  Have students write their spreads privately.
  2.  Reveal a few. If anyone has a narrow spread (e.g., 45/55), challenge them: "I will take that bet." Reveal your Bias Card (e.g., 0.20). Show their loss.
  3.  Ask the survivors: "Why did your spread have to widen from ~50 to 20/80 after learning the coins matched?"
  4.  Do not explain *why* yet. Just enforce the loss avoidance.

  ## 3. The Decision Rule Conflict (40–60 Minutes)
  **Goal:** Show that intervals create decision paralysis/conflict.

  **The Choice:**
  "You now hold a ticket on $C_1$=Heads (given Match). Your valuation interval is [20, 80] Points.
  I offer you a trade. You can swap your ticket for a **Guaranteed 50 Points**."

  **Task:**
  "Vote: Keep the Ticket or Take the Cash?"
  *   **Group A (Keep):** Argue that 80 > 50, so the ticket *could* be better.
  *   **Group B (Cash):** Argue that 20 < 50, so the ticket *could* be worse.

  **Facilitator Move:**
  "Both groups are rational.
  *   Group B is following a **Safety Rule** (assume the worst: 20 < 50).
  *   Group A is following a **Possibility Rule** (assume the best: 80 > 50).
  *   There is no single 'correct' answer anymore. Your interval has broken the tie-breaking mechanism of expected utility."

  **Round 2 (Optional if time permits):**
  "New Offer: Swap ticket for Guaranteed 10 Points."
  *   Now everyone should Keep the Ticket (Min 20 > 10).
  "New Offer: Swap ticket for Guaranteed 90 Points."
  *   Now everyone should Take Cash (Max 80 < 90).
  *   *Point:* Only in the middle zone (the overlap) does the decision rule matter.

  ## 4. Debrief & Mapping (60–90 Minutes)
  **Goal:** Connect experience to theory.

  **1. The Interval (Credal Sets):**
  "When you quoted 20 to 80, you weren't being vague. You were being precise about your vagueness.
  *   **Lower Probability (20%):** The strongest commitment you can make to *buy*.
  *   **Upper Probability (80%):** The weakest commitment you need to *sell*.
  *   **Credal Set:** The deck of cards ($\theta \in [0.2, 0.8]$) represents your set of possible priors. You didn't have *one* probability; you had a *set*."

  **2. Dilation:**
  "Look at your first spread (around 50) vs. your second (20–80).
  *   **Prior:** Precise (0.5).
  *   **Posterior:** Imprecise (0.2 to 0.8).
  *   **Dilation:** Learning that the coins *Matched* made you *less* certain about $C_1$ than you were before. Usually, evidence narrows uncertainty. Here, because the evidence ($E$) was correlated with the unknown bias ($\theta$), it washed out the information from the fair coin.
  *   **Arithmetic:** $P(H_1 | \text{Match}) = \theta$. Since $\theta$ is unknown in $[0.2, 0.8]$, your posterior is that whole interval."

  **3. Decision Rules:**
  "When you voted on the 50-point cash offer, you split. This is the **Decision Rule Problem**.
  *   **Maximin (Group B):** Maximize the Minimum gain. Min(Ticket)=20. Min(Cash)=50. Choose Cash. (Protects against worst-case).
  *   **Maximality/E-Admissibility (Group A):** An option is permissible if no other option is strictly better in *all* states. Since Ticket > Cash if $\theta=0.8$, Ticket is admissible. Since Cash > Ticket if $\theta=0.2$, Cash is admissible. Both are rational.
  *   **Cost:** You lose the ability to make a unique recommendation without adding a new rule (like 'I am pessimistic')."

  ---

  ## Arithmetic Confirmation (For Facilitator)
  *   **Hypothesis ($H$):** Coin 1 is Heads. $P(H) = 0.5$.
  *   **Bias ($\theta$):** Probability Coin 2 is Heads. $\theta \in [0.2, 0.8]$.
  *   **Evidence ($E$):** Coins Match ($H_1 \leftrightarrow H_2$).
  *   **Likelihood:**
      *   $P(E | H, \theta) = P(H_2=H | \theta) = \theta$
      *   $P(E | \neg H, \theta) = P(H_2=T | \theta) = 1 - \theta$
  *   **Posterior Calculation:**
      $$P(H | E, \theta) = \frac{P(E | H, \theta)P(H)}{P(E | H, \theta)P(H) + P(E | \neg H, \theta)P(\neg H)}$$
      $$P(H | E, \theta) = \frac{\theta \cdot 0.5}{\theta \cdot 0.5 + (1-\theta) \cdot 0.5} = \frac{0.5\theta}{0.5} = \theta$$
  *   **Result:** The posterior probability is exactly the unknown bias $\theta$. Since $\theta \in [0.2, 0.8]$, the posterior interval is $[0.2, 0.8]$.
  *   **Dilation:** Prior width = 0. Posterior width = 0.6. **Confirmed.**

  ---

  ## Predicted Pitfalls & Mitigation

  | Pitfall | Why it happens | How to handle it |
  | :--- | :--- | :--- |
  | **Principle of Indifference** | Students will want to treat the unknown bias as 0.5 ("I have no reason to think it's 0.2 over 0.8"). | **Intervention:** "If you price at 50, and I drew the 0.2 card, I will take your bet and you will lose. Do you want to bet against my knowledge of the card?" Force them to respect the *range*, not the average. |
  | **Confusion on Buy/Sell** | Students may invert the prices or think "Sell" means they sell the coin. | **Clarification:** "You are trading *tickets*. Buying Price = You pay me, you get ticket. Selling Price = I pay you, I get ticket." Write formulas on board: Profit = Value - Buy; Profit = Sell - Value. |
  | **Time Overrun** | The Dilation Phase can drag if students argue about the fairness of the Bookie. | **Strict Timer:** Use a visible timer. If they argue, say "Take the loss for the sake of the experiment, we will discuss the fairness in the debrief." |
  | **Decision Apathy** | Students might say "I'm indifferent" to the Cash vs. Ticket choice. | **Push:** "Indifference is a verdict. It means your rule allows both. But if you *must* act (e.g., you need 50 points to pass the class), what do you do? That forces a rule." |

  ---

  ## Limitations (For Facilitator Candor)
  *Be prepared to admit these during the Q&A:*

  1.  **Aleatory vs. Epistemic:** The game simulates imprecise probability using a *randomly selected* bias card (aleatory uncertainty about a parameter). True Imprecise Probability often claims the uncertainty is *epistemic* (there is no "true" bias card, just a lack of information). The game uses a frequentist mixture to teach a Bayesian lesson.
  2.  **The "Bookie" is Omniscient:** In the game, I (Facilitator) know the true $\theta$. In real IP scenarios, *no one* knows the true probability. The "Dutch Book" threat is weaker in reality because there is no omniscient Bookie to exploit your single number. The game exaggerates the risk to make the interval feel necessary.
  3.  **Static Credal Set:** The deck of cards is fixed. In real scientific inquiry, the set of credible priors might shrink or shift with meta-evidence, not just dilate. The game hard-codes the dilation to ensure the phenomenon occurs within 90 minutes.

  ## Closing Statement for Debrief
  "Today you didn't just hear about imprecise probabilities; you were punished for ignoring them. You felt the **Dilation** when your spread widened despite getting 'information.' You felt the **Decision Problem** when half the room took the cash and half kept the ticket, both rational. The literature gives names to these feelings: *Credal Sets, Lower/Upper Expectations, and Maximality*. Your intuition is now ahead of the terminology."
