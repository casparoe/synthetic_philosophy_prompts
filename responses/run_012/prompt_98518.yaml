          *   $P(E) = P(H_1)P(H_2) + P(\neg H_1)P(\neg H_2) = 0.5\theta + 0.5(1-\theta) = 0.5$.
          *   $P(H_1 | E) = P(H_1 \cap E) / P(E) = P(H_1 \cap H_2) / 0.5 = 0.5\theta / 0.5 = \theta$.
