          *   Option B: Sure Thing (\$4.50).
          *   *Maximin (Pessimistic):* Min value of A is \$2. \$2 < \$4.50. Choose B.
          *   *Maximax (Optimistic):* Max value of A is \$8. \$8 > \$4.50. Choose A.
          *   *Maximality/Interval Dominance:* Does A dominate B? No. Does B dominate A? No. (Since intervals overlap).
          *   *E-Admissibility:* Is there a prior in the set where A is optimal? Yes (e.g., $\theta=0.8$). Is there one where B is optimal? Yes ($\theta=0.2$). Both are admissible.
