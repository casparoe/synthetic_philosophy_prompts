prompt: |-
  Since retiring from a career in the natural sciences I have been helping to run a graduate reading group on the foundations of probability, drawing about fifteen students from philosophy, statistics, and the sciences; we meet for a single 90-minute session. Having spent my working life reporting intervals rather than point estimates, I want an activity that makes the group feel the force of imprecise probabilities rather than merely hear the case for them, and in particular that forces them to run into two things a single-number credence conceals: first, that a rational agent may hold an interval of credences and defend it against a bookie; second, that this latitude has costs, because conditioning on new evidence can widen rather than narrow one's interval for a target proposition (the phenomenon the literature calls dilation), and because once an interval is in play the agent must still act, so a further decision rule has to be chosen, with maximin, maximality, and E-admissibility giving different verdicts on the same set of options.

  Please design the session as a game with rules, materials, and a payoff scheme that needs no real money. The rules and incentives should be arranged so that the participants meet dilation and the choice-rule problem themselves, in the doing, before either is named. If you build a concrete dilation example into the mechanics, work the arithmetic through and confirm that conditioning really does widen the interval. Include a debrief that maps what happened onto lower and upper probability, credal sets, and the decision-rule menu; say plainly what will predictably go wrong the first time this is run and how I should handle it; and be candid about which feature of the imprecise-probability view the activity cannot reproduce and that I will have to supply in discussion myself. No lecture up front, and they should not hear the term imprecise probability until the debrief.
reasoning: |-
  Here's a thinking process that leads to the suggested session design:

  1.  **Analyze the Request:**
      *   **Target Audience:** Graduate students (Philosophy, Statistics, Sciences), ~15 people. 90-minute session.
      *   **Facilitator:** Retired natural scientist, experienced in reporting intervals.
      *   **Goal:** Make students *feel* the force of imprecise probabilities (IP) rather than just hearing about them.
      *   **Key Concepts to Experience:**
          1.  Rationality of holding an interval of credences (defensible against a bookie).
          2.  Costs of intervals: Dilation (conditioning widens the interval).
          3.  Costs of intervals: Decision rules (Maximin, Maximality, E-admissibility yield different choices).
      *   **Format:** A game with rules, materials, payoff scheme (no real money).
      *   **Constraints:** No lecture up front. No mention of "imprecise probability" until debrief.
      *   **Requirements:** Work through the arithmetic for dilation. Include a debrief mapping experience to theory. Predict pitfalls and how to handle them. Admit limitations of the activity.

  2.  **Deconstruct the Challenge:**
      *   *Challenge 1: Intervals vs. Point Estimates.* How to force students to state an interval without telling them to? Usually, betting games force a single price. To get an interval, I need a mechanism where they can say "I'll buy at $X$ but won't sell at $Y$." This is the classic de Finetti/Good betting setup.
      *   *Challenge 2: Dilation.* This is the hardest part to gamify. Dilation requires a specific probabilistic structure (usually an urn or a coin with unknown bias linked to another event). I need a scenario where learning *something* makes them *less* sure about the target.
      *   *Challenge 3: Decision Rules.* Once they have intervals, they need to make a choice between acts where the expected utility depends on which end of the interval they pick.
      *   *Time:* 90 minutes is tight for a complex game + debrief. The game needs to be streamlined.

  3.  **Drafting the Game Mechanics:**

      *   *Scenario:* An Urn problem is usually best for dilation. Let's use the classic Walley/Seidenfeld example structure but simplified for a game.
      *   *Setup:* Two urns? Or one urn with a two-stage draw?
      *   *The Dilation Structure:*
          *   Hypothesis $H$: The coin is Heads (or Ball is Red).
          *   Evidence $E$: Some side information.
          *   Standard Dilation Example: A fair coin is tossed ($H$). A second mechanism generates evidence $E$ such that $P(E|H)$ and $P(E|\neg H)$ are imprecise.
          *   *Simpler version for a game:* The "Urn of Urns."
          *   Let's try the *Seidenfeld's Urn* setup.
          *   Urn A: 1 Red, 1 Black. (Known 50/50).
          *   Urn B: Unknown mix of Red/Black. (Imprecise).
          *   Wait, standard dilation usually involves a known probability event correlated with an unknown one.
          *   *Let's use the standard "Coin + Biased Coin" dilation example.*
          *   Event $H$: Fair Coin lands Heads ($P(H) = 0.5$).
          *   Event $E$: A second coin (unknown bias $\theta \in [0, 1]$) lands Heads.
          *   Actually, the classic dilation example is: $P(H) = 0.5$. $E$ is observed. $P(H|E)$ becomes $[0, 1]$ (or wider than prior).
          *   *Specific Model:* Let $X$ be a variable uniform on $[0,1]$. Let $Y$ be a variable uniform on $[0,1]$. Let $H$ be $X > 0.5$. Let $E$ be "The integer part of $10(X+Y)$ is even." (Too complex).
          *   *Let's use the simplest known dilation case:*
              *   Prior on $H$: $[0.4, 0.6]$ (Let's make it precise first to show dilation, or start imprecise? The prompt says "rational agent may hold an interval". So start with an interval).
              *   Actually, to *feel* dilation, they need to start with a precise or narrow interval, get evidence, and end up with a wider one.
              *   *Better:* Start with a set of priors (Credal Set).
              *   *Game Structure:*
                  1.  **Phase 1 (The Bookie):** Students set buying/selling prices for a bet on Event $A$. This establishes their interval.
                  2.  **Phase 2 (The Evidence):** Event $B$ is revealed. They must update prices for $A$ given $B$.
                  3.  **Phase 3 (The Choice):** They must choose between two actions based on their updated interval.

      *   *Refining the Dilation Example for the Game:*
          *   We need a concrete arithmetic example.
          *   Let's use the "Two Coins" example.
          *   Coin 1: Fair ($P(H_1) = 0.5$).
          *   Coin 2: Unknown bias ($P(H_2) \in [0.2, 0.8]$).
          *   Target: $H_1$.
          *   Evidence: $H_1 \iff H_2$ (They match) or $H_1 \neq H_2$.
          *   Wait, if Coin 1 is fair, $P(H_1)$ is 0.5. If we learn they match, does $P(H_1)$ dilate?
          *   Let's check the math.
          *   Let $\theta = P(H_2)$. $\theta \in [0.2, 0.8]$.
          *   $P(H_1) = 0.5$.
          *   $P(\text{Match}) = P(H_1 H_2) + P(\neg H_1 \neg H_2) = 0.5\theta + 0.5(1-\theta) = 0.5$.
          *   $P(H_1 | \text{Match}) = P(H_1 \cap \text{Match}) / P(\text{Match}) = P(H_1 H_2) / 0.5 = 0.5\theta / 0.5 = \theta$.
          *   So, prior for $H_1$ is $0.5$ (precise). Posterior for $H_1$ given Match is $\theta \in [0.2, 0.8]$.
          *   *This is perfect.* It shows precise $\to$ imprecise (dilation).
          *   *Wait, one catch:* The prompt asks to show that a rational agent may *hold* an interval. So maybe start with the interval on the unknown coin, and show that even knowing the fair coin is 0.5, the *joint* situation creates the interval.
          *   *Revised Plan:*
              *   **Asset:** A ticket paying \$100 if Coin 1 is Heads.
              *   **Prior:** Students know Coin 1 is Fair. They should price it at \$50.
              *   **Twist:** They are told Coin 2 exists (Unknown bias). They are told *before* betting that they will learn if the coins Match or Mismatch.
              *   **Task:** Set a Buying Price and a Selling Price *now* for the ticket, *conditional* on learning "Match".
              *   **Result:** If they try to set a single price (e.g., \$50), a Bookie (Facilitator) can Dutch Book them *after* the update. To avoid this, they must set an interval (e.g., Buy at \$20, Sell at \$80).
              *   **Decision Rule:** Then offer them a choice between keeping the ticket or swapping for a guaranteed \$45. Depending on the rule (Maximin vs Maximality), they choose differently.

  4.  **Developing the Payoff/Incentive Scheme:**
      *   No real money. Use "Points" redeemable for... prestige? Or just "Winner gets to choose the topic for next week." Let's use "Course Credit/Participation Points" or simply "Bragging Rights + Coffee." Let's suggest coffee/snacks for the winners.
      *   To make the "Bookie" threat real, the Facilitator plays the Bookie.
      *   If a student sets Buy > Sell, they lose points immediately.
      *   If they set a single price (Buy = Sell), the Facilitator demonstrates a Dutch Book strategy *after* the evidence is revealed.

  5.  **Step-by-Step Session Flow:**
      *   **0-10 min:** Setup & Rules. No theory. Just "You are traders."
      *   **10-30 min:** Round 1 (The Prior). Coin 1 (Fair). Establish point estimate comfort.
      *   **30-50 min:** Round 2 (The Dilation). Introduce Coin 2 (Unknown). Reveal "Match". Force interval pricing to avoid loss.
      *   **50-70 min:** Round 3 (The Decision). Offer a sure thing vs. the bet. Show disagreement based on rules.
      *   **70-90 min:** Debrief. Connect to IP, Credal Sets, Dilation, Decision Rules.

  6.  **Checking the Arithmetic (Crucial Step):**
      *   *Scenario:*
          *   $C_1$: Fair Coin. $P(H_1) = 0.5$.
          *   $C_2$: Biased Coin. Bias $\theta \in [0.2, 0.8]$. (Representing the group's uncertainty).
          *   Independence: Coins are independent conditional on $\theta$.
          *   Target Bet: Pays \$10 if $C_1 = H$.
          *   Evidence: $E = (C_1 = C_2)$ (They match).
      *   *Prior:* $P(H_1) = 0.5$. Expected Value (EV) = \$5.
      *   *Posterior:* $P(H_1 | E) = \theta$.
      *   *Range:* Since $\theta \in [0.2, 0.8]$, $P(H_1 | E) \in [0.2, 0.8]$.
      *   *EV Range:* \$2 to \$8.
      *   *Dilation:* Prior interval was $[0.5, 0.5]$ (width 0). Posterior interval is $[0.2, 0.8]$ (width 0.6). Dilation confirmed.
      *   *Decision:*
