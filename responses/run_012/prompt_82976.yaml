  The waiting room of VeriGen Solutions smelled of antiseptic and stale vending machine coffee. Leo shifted in the plastic chair, the paper gown crinkling under his thighs. Across from him, Sam was scrolling through his phone, legs sprawled out.

  "You're overthinking it," Sam said, not looking up. "You are the fire. The sperm and egg are just the sparks. If you use different sparks, you don't get the same fire. You get a different fire. Maybe it looks like a fire, maybe it warms the room, but it's not *your* fire."

  "That's poetic, Sam. It's also unhelpful."

  "It's physics, mate. You can't have *this* specific consciousness without *that* specific biological starting point. It's like asking if you could have written the same book if you'd used a different typewriter. Maybe the words are the same, but the mechanism... the mechanism makes the art."

  Leo rubbed his temples. "But if the output is identical. If I walk out of the womb looking like me, talking like me, loving the same stupid movies... where did *I* go? What part of me is tied to that microscopic tail wiggling toward an egg?"

  "The origin," Sam said. "It's the root. You cut the root, the tree dies. Even if you plant a new one that looks the same."

  "Mr. Vance?" A technician stood in the doorway. She wore a badge that read *Jenna, Level 3 Ontological Tech*. She held a tablet like a shield. "We're ready for the Continuity Verification."

  Leo stood up. "Wish me luck."

  "Don't lie on the form," Sam called out. "The machine hates liars."

  The procedure room was small, dominated by the Conception Emulator. It looked less like a medical device and more like a tanning bed mated with a server rack. A halo of sensors hung over the reclining chair.

  "Standard inheritance clause?" Jenna asked, tapping her screen. "Clause 14-B: *Beneficiary must demonstrate uninterrupted genetic origin from recorded gametes.*"

  "Grandma was paranoid," Leo said, climbing onto the chair. "She didn't trust IVF clinics in the nineties. She wanted to make sure I was... me."

  "Everyone says that until they see the Sibling Projection," Jenna said, adjusting the halo. "Okay. We'll run the baseline first. Confirm your actual historical conception data against the birth certificate."

  "Wait," Leo said. "I thought we were just doing the simulation?"

  "Protocol requires a baseline," Jenna said. "We need to lock in your actual origin before we show you the alternatives. Otherwise, the legal comparison is void."

  Leo swallowed. "Right. Baseline."

  He lay back. The sensors hummed, a low vibration that he felt in his teeth. The ceiling above him lit up with a soft blue grid.

  "Scanning somatic markers... tracing mitochondrial DNA... accessing parental archives," Jenna recited. She sounded like she was ordering lunch. "Okay. Mr. Vance, on your birth record, Father provided Sperm Sample A-402. Mother provided Egg Sample E-119. Correct?"

  "That's what the certificate says."

  "Okay. Locking those coordinates." The hum pitched up. "Now, for the verification. We are projecting the entity that *actually* resulted from this union."

  A hologram shimmered into existence above Leo's chest. It was a baby, rotating slowly. Then it aged, fast-forwarding through childhood, adolescence, stopping at Leo's current age. It was him. Same scar on the chin. Same slightly crooked nose.

  "Baseline confirmed," Jenna said. "Identity match: 100%. You are the product of Record A-402 and E-119."

  Leo let out a breath he didn't know he was holding. "Okay. Good. So I pass."

  "We're not done. The clause requires a Stress Test. We need to prove that *only* this origin produces *you*." Jenna tapped a new command. "Initiating Sperm-Swap Simulation. We will substitute Father's Sperm A-402 with Sperm A-403. The next available sample from the same donor."

  "Wait, why?"

  "Standard procedure. We need to show the court that a different sperm produces a different person. It validates your uniqueness."

  The hologram flickered. The baby reappeared. As it aged, the face shifted. The nose was straighter. The eyes were a shade greener. It looked like a brother. A close brother, but not Leo.

  "See?" Jenna said. "Different origin, different phenotype. Different person."

  "Okay," Leo said. "That makes sense. That's what Sam said."

  "Now," Jenna said, her finger hovering over a red button. "The Both-Swap. This is the expensive setting. Usually, people skip this. It substitutes both gametes with random samples from the parental pool. Total genetic stranger."

  "Do it," Leo said. He needed to be sure. He needed to know if the 'fire' argument held water.

  "Warning," the machine chimed. "Both-Swap simulation forces phenotypic convergence. The subject will resemble the client to facilitate identity comparison."

  "Proceed," Jenna said.

  The hologram flickered violently. The baby formed again. It aged. The face sharpened, the hair darkened, the posture adjusted. It stopped.

  It was Leo. Exactly Leo. The scar on the chin. The crooked nose. It was wearing the same paper gown.

  "Phenotypic convergence complete," Jenna said. "Visually identical. But genetically? Zero percent overlap with your recorded origin. This person is a stranger who happens to look like you."

  Leo stared at his own face hovering in the air. "If that person walked out of the machine... would they know me? Would they remember my childhood?"

  "The machine doesn't simulate memory," Jenna said. "It simulates biological potential. But legally? This projection is a stranger. You are defined by your origin, Mr. Vance. Not your output."

  She turned the screen toward him. "Now, I just need you to sign the Attestation. It states that you acknowledge your identity is bound to the Baseline Origin, and that any deviation results in a non-identical entity."

  Leo took the stylus. It felt heavy.

  "Wait," Jenna said, frowning at her tablet. "That's odd."

  "What?"

  "The Baseline scan. It's flagging a discrepancy."

  Leo's stomach dropped. "What kind of discrepancy?"

  "Metadata mismatch." Jenna tapped rapidly. "The sperm sample recorded on your birth certificate... A-402. The DNA profile we just pulled from your bone marrow... it doesn't match the father's archive for A-402."

  "Lab error," Leo said quickly.

  "Maybe." She didn't look up. "But it matches A-403."

  Leo went still. "The simulation? The brother?"

  "The Sperm-Swap simulation used A-403," Jenna said quietly. "The machine projected a brother because it thought it was swapping. But your body... your body *is* A-403."

  The hum of the machine seemed to get louder. The hologram of the 'stranger'—the Both-Swap Leo—still hovered above him, staring blankly forward.

  "So," Leo said, his voice sounding thin. "I wasn't born from the sperm on my birth certificate."

  "No."

  "I was born from the one you used for the 'Different Person' simulation."

  "Technically... yes."

  Leo looked at the Attestation form. *I hereby declare that my identity is inextricably linked to Gametic Record A-402.*

  "If I sign this," Leo said, "I'm lying. I'm saying I come from A-402. But I come from A-403."

  "If you don't sign," Jenna said, "the inheritance is void. The trust assumes the person named in the will is the person defined by Record A-402. If you are A-403, legally, you are a different beneficiary. Possibly ineligible."

  "But I'm me," Leo said. "I have the memories. I have the scar. I have the... the fire."

  "Legally," Jenna said, "you are a clerical error."

  Leo looked up at the hologram. The 'Brother' projection—the one the machine made when it thought it was simulating a swap—was still there, frozen in the air. It looked like a sibling. But Leo's body was made of that code.

  And the Both-Swap projection—the one that looked exactly like him but was a 'total stranger'—was also there. Two Leos hovering in the blue light. One was his biological truth (labeled 'Simulation'). One was his legal truth (labeled 'Baseline').

  "Sam's going to love this," Leo muttered.

  "Sam?"

  "My mate. He says I am the sparks. Not the fire." Leo looked at his hands. "If I sign this, I'm saying the sparks matter more than the fire. If I don't sign, I'm saying the fire matters more than the sparks."

  "We have other clients waiting, Mr. Vance."

  Leo held the stylus over the paper. The tip hovered millimetres above the line.

  If he signed, he admitted that the specific sperm mattered. That if it had been different, he wouldn't be here. That he was a product of a specific, fragile accident.

  If he didn't sign, he claimed that he was something else. Something that could survive a change in the ingredients. But the law didn't care about that. The law cared about the record.

  He looked at the 'Brother' hologram. It was his biological reality. It was a stranger on paper, but it was his blood.
  He looked at the 'Stranger' hologram. It was his visual reality. It was him on the surface, but a ghost in the code.

  "Does it change who I am?" Leo asked. "Knowing I came from the other one?"

  Jenna shrugged, a tiny, practiced movement. "Biologically? No. You're still you. Legally? Yes. You're now a fraud until we amend the birth certificate, which takes six weeks. By then, the inheritance window closes."

  She pushed the tablet closer. "So. Are you the record? Or are you the body?"

  Leo looked at the pen. He thought about the late-night argument, the beer, the certainty he'd felt then. He thought about the hologram looking back at him, wearing his face, born from a sperm that wasn't supposed to be his.

  He lowered the pen. The tip touched the paper. The ink bloomed, dark and permanent.

  He didn't know if he was signing his name, or someone else's.

  "Next," Jenna said, taking the tablet.

  Leo sat up. The holograms flickered and died, leaving him alone in the white light, wondering if the man who walked out the door was the same one who had walked in.
