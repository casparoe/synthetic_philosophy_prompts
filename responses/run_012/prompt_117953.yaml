  **The Property Line**

  **Setting:** A backyard border dispute between two neighbors, **Evan** and **Sally**, mediated by their friend **Dave**. The property line is defined in the deed as "the edge of the woods," but the forest fades gradually into a meadow. There is a specific oak tree standing in the twilight zone.

  **Evan** is an Epistemicist. **Sally** is a Supervaluationist. **Dave** is a Degree Theorist (and just wants to build a shed).

  **Evan:** (Staring intensely at the oak tree) "It's simple, Sally. There is a precise spatial coordinate where the woods end. A specific millimeter. That millimeter exists right now. I just can't know where it is."

  **Sally:** "But Evan, 'The woods end here' isn't true. And 'The woods end there' isn't true. There is no fact of the matter about the location."

  **Evan:** "But 'There *is* a location' is true! The cutoff exists, it's just unknowable. So, legally, that tree is either on your side or mine. I'm building the fence right through the trunk to be safe."

  **Sally:** "You can't do that. On some admissible precisifications of 'edge of the woods', the tree is mine. On others, it's yours. But on *no* precisification is the boundary *inside the tree*. The boundary exists, but it's not located anywhere in particular."

  **Evan:** "So where is it?"

  **Sally:** "It's in the logic, Evan. Not in the dirt. It's a sharp line that floats."

  **Dave:** (Holding a tape measure) "Look, the tree is like... 0.7 on your side, Sally. Can we just split the lumber?"

  **Evan:** "No! If I cut the tree, I might cross the unknowable threshold! I could be trespassing and never know it!"

  **Sally:** "And if you build the fence, you're asserting a specific precisification is the *real* one. That's false. All precisifications are equally unreal."

  **Evan:** "So what do we do?"

  **Sally:** "We acknowledge the boundary exists. We acknowledge it separates us. But we don't draw it."

  **Evan:** "So the fence is..."

  **Sally:** "Super-true."

  **Punchline:**
  Evan builds a fence made of opaque plexiglass so he never has to *see* which side of the line he's standing on. Sally agrees to the fence but refuses to install the posts, insisting the boundary is real but doesn't need to touch the ground. Dave builds his shed entirely on the oak tree, claiming it's now 1.0 "Shed" and 0.0 "Tree."
