      *   *Section 3: The Algorithm & The Addict:* Specific focus on the hard cases.
      *   *Section 4: The Final Question:* Is "free" one thing?
      *   *Tone Check:* Ensure I flag uncertainty. Don't cite Berlin or Pettit explicitly (no reading lists), but use the concepts.

  6.  **Refining the "New Test Cases":**
