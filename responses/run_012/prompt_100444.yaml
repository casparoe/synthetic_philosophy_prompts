      *   *Permission rules (never refused):* Unfree. (Dependency on will of another).
      *   *Co-op resident (more interference):* Free. (Democratic control/Non-domination).
      *   *Sleeping Dominator (relocation right):* Unfree. (Potential interference).
      *   *Collective Dominator (Algorithm):* Unfree. (Non-human agency?).
      *   *Tentative Formulation:* "Unfree to the extent that another agent's choice... fixes the terms of your life." (Breaks on Addict, Deaf, Co-op).

  3.  **Brainstorming Candidate Principles (The "Open" Phase):**
      *   *Negative Liberty:* Freedom is the absence of external interference.
          *   *Fit:* Domestic worker (yes), Entry right (maybe, if potential interference counts), Deaf (no, nature), Addict (no, internal).
          *   *Problem:* The caseworker calls the "unused entry right" unfreedom. Pure negative liberty usually requires actual interference or immediate threat. Also, the Co-op resident has *more* interference but is *free*. Negative liberty struggles with *legitimacy* of interference.
      *   *Republican Liberty (Non-Domination):* Freedom is absence of arbitrary power over you.
