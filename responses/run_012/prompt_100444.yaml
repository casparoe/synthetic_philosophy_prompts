answer: |-
  This is a profound piece of casework. You are doing applied political philosophy without the luxury of abstraction, and the friction you feel is the friction of concepts meeting reality. Your intuition is already tracking something sophisticated: you distinguish between *interference* (the door opening) and *power* (the right to open the door), and between *misfortune* (the storm) and *domination* (the landlord).

  Before I lay out the menu of principles, I need to be honest about where your own list wobbles. You say the Deaf resident suffers misfortune, not unfreedom, but the Addict resident suffers unfreedom, not weakness. Both are constraints on action. One is biological/physical, the other is psychological/pathological. Why is the brain's chemistry less "you" than the ear's physiology? If the ear is "nature," why isn't the impulse "nature"? This suggests you are secretly relying on a distinction between *human agency* and *everything else*, but then the Algorithm case breaks that, because an algorithm is human-made but acts like nature.

  I am uncertain whether a single coherent theory can save all your verdicts. But let us try to construct the principles that might, and see where they fracture.

  ### The Menu of Principles

  Here are four candidate definitions of freedom derived from your cases. I have sharpened them to show where they cut.

  #### 1. The Non-Interference Principle (Negative Liberty)
  **Statement:** A resident is free if and only if no other agent actively prevents them from doing what they wish to do. Potential power does not count; only actual obstruction counts.
  *   **Motivated by:** The Deaf resident (misfortune, not agency), the Domestic Worker (active locking of passport).
  *   **Predicts for new cases:**
      *   *The Benevolent Warden:* A warden checks your room daily but never touches anything. You are **free**.
      *   *The Broken Lock:* Your door is stuck shut due to rust. You are **free** (no agent is stopping you).
  *   **Incompatibilities:** This principle forces you to abandon your verdicts on the **Entry Right**, the **Permission Rules**, and the **Sleeping Dominator**. Under this view, if the operator *can* enter but *doesn't*, you are free. If they *can* refuse permission but *don't*, you are free. It also renders the **Co-op resident** unfree (since they face actual interference/inspections), contradicting your judgment that they are free.
  *   **Philosopher's Note:** This is the cleanest view legally, but it fails to capture the anxiety of living under a thumb. It treats freedom as a physical condition, not a social status.

  #### 2. The Non-Domination Principle (Republican Liberty)
  **Statement:** A resident is free if and only if no other agent has the arbitrary capacity to interfere in their life, regardless of whether they exercise it. Freedom is the absence of a master, not just the absence of a beating.
  *   **Motivated by:** The Entry Right (standing power), the Permission Rules (dependency on will), the Sleeping Dominator, and the Co-op resident (rules are non-arbitrary/controlled by residents).
  *   **Predicts for new cases:**
      *   *The Benevolent Warden:* A warden checks your room daily at their discretion. You are **unfree** (they *could* abuse it).
      *   *The Contractual Warden:* A warden checks your room daily, but you voted on the rule and can fire the warden. You are **free**.
  *   **Incompatibilities:** This principle struggles with the **Algorithm (Collective Dominator)**. Traditional republicanism requires a *dominus*—a human will capable of arbitrariness. An algorithm has no will, only code. To call it "domination" requires stretching the definition of "agent." It also struggles with the **Addict**. Is the addict dominated by themselves? Republicanism usually looks outward. If you call the addict unfree, you are mixing internal constraints with external power.
  *   **Philosopher's Note:** This fits your housing context best. It explains why the Co-op resident is free despite more interference: the interference is tracked, controlled, and non-arbitrary. It explains why the "unused right" is unfreedom: it creates a status of dependency.

  #### 3. The Effective Agency Principle (Positive Liberty)
  **Statement:** A resident is free if and only if they have the genuine capacity and resources to act on their own higher-order desires, free from internal compulsions and external barriers.
  *   **Motivated by:** The Addict (internal constraint), the "No Better Alternative" resident (economic constraint), and potentially the Born on Estate resident (adaptive preferences).
  *   **Predicts for new cases:**
      *   *The Illiterate Resident:* A resident cannot read the tenancy agreement and signs it blindly. They are **unfree** (lack of capacity), even if no one coerced them.
      *   *The Wealthy Recluse:* A resident chooses never to leave their room, though they could. They are **free** (authentic choice).
  *   **Incompatibilities:** This forces you to abandon the **Deaf Resident** verdict. If freedom is effective agency, the lack of an accessible intercom is a denial of freedom, not mere misfortune. It also risks making the **Co-op resident** unfree if the binding rules limit their "higher-order desires." Furthermore, it risks paternalism: who decides which desires are "higher-order"? If the Born on Estate resident says she is happy, do you know better?
  *   **Philosopher's Note:** This is the most humane view but the most dangerous for a caseworker. It turns every social problem into a freedom problem.

  #### 4. The Status-Independence Principle (A Hybrid)
  **Statement:** A resident is free if and only if their security does not depend on the goodwill of another. You are unfree if you must beg, plead, or hope for mercy to maintain your standing, even if mercy is always granted.
  *   **Motivated by:** The Permission Rules (never refused but still dependency), the Co-op (security based on rights, not goodwill), and the Entry Right (security depends on operator's restraint).
  *   **Predicts for new cases:**
      *   *The Golden Cage:* A resident lives in luxury provided by a benefactor who can evict them on a whim. They are **unfree**.
      *   *The Secure Slum:* A resident lives in poor conditions but has a legally enforceable lease no one can break. They are **free**.
  *   **Incompatibilities:** This principle is silent on the **Addict** (self-dependency isn't the same as social dependency). It also struggles with the **Algorithm**. Does an algorithm show "goodwill"? If the algorithm is opaque, you cannot appeal to its reason, which mimics the lack of goodwill. But strictly speaking, an algorithm has no will to be good or bad.
  *   **Philosopher's Note:** This is likely the "real work" principle in your drafting. It captures the dignity aspect of housing justice.

  ### The Hard Cases: Where the Principles Break

  You asked me to flag uncertainty. Here is where the map tears.

  **1. The Algorithm (Collective Dominator)**
  You say this is unfreedom. Your colleague says you can't be dominated by a process.
  *   *The Tension:* If freedom requires a human master (Republican), the colleague is right. An algorithm is a tool. But if the tool is opaque and unappealable, it functions *exactly* like an arbitrary master.
  *   *My Uncertainty:* I lean toward your verdict. In modern governance, "code is law." If no human can explain or overrule the decision, the residents are subject to a will they cannot contest, even if that "will" is mathematically frozen. However, to fit this into the **Non-Domination Principle**, we must expand "agent" to include "structural systems designed by agents." If we don't, you must abandon this verdict.

  **2. The Addict vs. The Deaf Resident**
  You call the Addict unfree (internal) and the Deaf resident misfortune (external/physical).
  *   *The Tension:* This is the inconsistency in your list. Both are biological constraints.
  *   *Resolution:* You can save this distinction *only* if you adopt the **Status-Independence** or **Non-Domination** view. The Addict is unfree because addiction compromises her *agency* (Positive Liberty bleed-over) OR because her vulnerability makes her susceptible to exploitation by others (she is easier to dominate). The Deaf resident is misfortune because the building's design is a natural barrier, *unless* the building was designed that way *knowing* Deaf people would live there.
  *   *My Uncertainty:* If the council knew Deaf residents would be housed there and installed audio-only intercoms, that is not misfortune; that is exclusion (unfreedom). If it was an old building retrofitted without budget, it leans toward misfortune. Your verdict holds only if the barrier is truly non-agential.

  ### Which Verdict Must You Abandon?

  If you force me to choose one judgment in your list that is philosophically unsustainable, it is this one:

  **"A resident who could move out tomorrow, but every available alternative is worse than staying: my colleague says she's free because she can leave; I say no."**

  Here is why: If you hold this verdict, you are forced into the **Effective Agency Principle**. You are saying freedom requires *acceptable options*, not just *formal options*. But if you accept that, you must also call the **Deaf Resident** unfree (she lacks the option to communicate). You must call the **Born on Estate** resident unfree (her preferences were shaped by limited options).

  To keep your list coherent under the **Non-Domination Principle** (which fits your housing context best), you should concede this point to your colleague. The resident is *dominated* by the operator, but she is not *unfree* to leave. She is *constrained by circumstances*, which is a hardship, but distinct from political unfreedom. Conflating "no good options" with "unfreedom" dilutes the specific charge of *injustice* you are trying to level at the operator. You want to prove the operator is a master, not that the housing market is tight.

  ### Is "Free" a Single Predicate?

  No. Your list is tracking a family of questions that you are rightly forcing into one column for legal leverage, but philosophically, they are distinct.

  1.  **Status:** (The Entry Right, The Permission Rules). Are you a citizen or a subject? This is Republican liberty.
  2.  **Capacity:** (The Addict, The Deaf Resident). Can you actually function? This is Positive liberty/Capability.
  3.  **Interference:** (The Domestic Worker). Is someone stopping you? This is Negative liberty.

  In court, you need to argue **Status**. The regulator cares about **Interference**. The social worker cares about **Capacity**.

  When you draft the "freedom audit," I recommend you stop using the word "freedom" as a monolith. Instead, categorize the grievances:
  *   **Violations of Security:** (The Entry Right, The Sleeping Dominator). This is about *arbitrary power*.
  *   **Violations of Agency:** (The Algorithm, The Permission Rules). This is about *opacity and dependency*.
  *   **Violations of Capability:** (The Deaf Resident, The Addict). This is about *access and health*.

  If you conflate them, your colleague will pick off the weak links (the Addict, the "No Better Alternative" resident) to dismiss the strong claims (The Entry Right, The Algorithm).

  **Final Advice:**
  Your tentative formulation ("another agent's choice... fixes the terms of your life") is 90% there. To fix the Algorithm case, change "agent's choice" to "structural power beyond your contestation." To fix the Addict case, exclude "internal pathologies unless exploited by external agents." To fix the Co-op case, add "unless that power is subject to your collective control."

  But be prepared to drop the "No Better Alternative" verdict. It is the weakest link. It turns a critique of the *operator* into a critique of the *economy*, and while the economy may be unjust, it does not help your specific case against this specific housing operator to argue that poverty itself is unfreedom. Keep the audit focused on the *relationship* between resident and operator. That is where the domination lies.
