      *   **Candidate 2: The Non-Domination Principle (Republican Liberty)**
          *   *Core:* You are free if no one has the *capacity* to interfere arbitrarily in your life, regardless of whether they use it.
          *   *Motivation:* Entry right, Sleeping Dominator, Permission rules, Co-op (rules are non-arbitrary/controlled).
          *   *Conflict:* The Algorithm (Collective Dominator). Is an algorithm an arbitrary master? Republicanism traditionally needs a human will. The Addict (internal vs external).
          *   *Verdict:* Fits most, but struggles with the Algorithm (needs expansion) and the Addict (needs distinction).

      *   **Candidate 3: The Autonomy/Capability Principle (Positive Liberty)**
          *   *Core:* You are free if you have the real capacity to shape your life according to your own values, free from internal and external constraints.
          *   *Motivation:* The Addict (internal constraint), No Better Alternative (economic constraint), Born on Estate (adaptive preferences).
          *   *Conflict:* The Deaf Resident. If freedom is capability, lack of intercom access is unfreedom. Caseworker calls it misfortune. Also risks calling the Co-op resident "unfree" if rules limit options too much.
          *   *Verdict:* Forces abandonment of the "Deaf = Misfortune" verdict.

      *   **Candidate 4: The Status-Independence Principle (A Hybrid/Refined Republicanism)**
          *   *Core:* Freedom is a social status where you are not dependent on the goodwill of another for your basic security.
          *   *Motivation:* Explains why "Permission never refused" is unfree (dependency). Explains Co-op (membership status).
          *   *Conflict:* The Algorithm. Does an algorithm have "goodwill"?
          *   *Verdict:* Strongest contender for the housing context.

  5.  **Drafting the Response (incorporating constraints):**
      *   *Intro:* Acknowledge the difficulty. Validate the "messy human cases."
