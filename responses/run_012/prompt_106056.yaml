  6.  **Critical Self-Correction/Check (The "Say So Plainly" Clause):**
      *   Is the user's distinction between text and speaker relevant? Yes. Radical Interpretation is usually about *speakers* in a context, not static *texts* divorced from use. Applying Davidson to a mystical text is tricky.
      *   Is the "Charity" slogan actually one thing? No, it's a cluster. The user is right to suspect equivocation.
