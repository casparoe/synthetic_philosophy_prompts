      *   *Quine:* Mostly methodological/heuristic. We translate to maximize agreement to get a foothold.
      *   *Davidson:* Stronger. Constitutive. Without massive agreement, there is no belief or meaning.
      *   *Grandy/Rescher:* Rationality vs. Truth.
      *   *The User's Scenario:* A mystical text that seems contradictory. The classmate uses Charity to say "You must interpret it as consistent/true." The user asks "But what if it *isn't*?"

  3.  **Drafting the Map (Weakest to Strongest):**

