answer: |-
  You are right to worry that you are reinventing a wheel, though perhaps not the exact one you fear. The thin versus thick distinction you are drawing is essentially the difference between informational semantics and functional role semantics, a debate that has been churned over in philosophy of mind since the nineteen eighties by people like Dretske and Millikan. In the mechanistic interpretability community, this maps almost directly onto the distinction between probing correlations and establishing causal mediation. If you present this as a novel philosophical insight, you will be immediately dismissed by anyone with a background in philosophy of cognitive science. The distinction does do work, but only if you explicitly anchor it in that existing literature rather than presenting it as a new taxonomy. You need to acknowledge that thin representation is basically mutual information and thick representation is basically causal utility, and then explain why existing frameworks fail to capture the specific nuances of neural network superposition and polysemanticity. If you do not cite the philosophical lineage, you look naive. If you do cite it, you need to show why neural networks force a revision of those old categories, perhaps because the substrate is so different from biological brains or classical symbolic systems.

  The circularity worry you have about the two-way test is well founded and currently fatal to the argument as stated. You define a representation as something you can read and write, but to perform the write-in test correctly, you must already know what the content is supposed to be to verify that the behavior changed in the right way. You say flip the feature and flip the behavior, but this assumes you have an independent grip on what the feature is prior to the intervention. If you define the feature by the direction that successfully intervenes, you have not explained representation, you have just defined a control vector. This is the same problem that plagues causal abstraction literature where the alignment between the high-level variable and the low-level state is often assumed rather than derived. To fix this, you need to decouple the definition of the content from the intervention itself. You might need to rely on the task structure or the data generating process to define the ground truth of the feature, rather than relying on the network's internal geometry to define it for you. Otherwise, you are just saying that a representation is whatever vector allows you to control the output, which collapses back into the thin definition because any sufficiently large vector in a high-dimensional space can control the output if you push hard enough.

  Your proposed solution to the gaming problem, the manifold condition, is the weakest part of the draft and likely mathematically incoherent in the context of deep learning. The notion of a manifold in a high-dimensional activation space is notoriously slippery, and enforcing interventions to stay on the training manifold often prevents you from testing the generalization capabilities that constitute genuine representation in the first place. If you restrict yourself to states the network has exactly encountered, you are testing memory, not representation. Furthermore, adversarial examples prove that you can stay on or near the manifold and still break the network, so proximity to the training distribution is not a sufficient condition for valid intervention. A cleaner fix might be to require that the intervention be minimal or orthogonal to nuisance variables, rather than strictly on-manifold. You need a condition that ensures the intervention targets the specific mechanism associated with the feature rather than brute-forcing the output. There is work in causal representation learning about independent mechanisms that might serve you better here than the vague appeal to manifolds. If you cannot formalize the manifold constraint, you should drop it and replace it with a constraint about the specificity of the behavioral change, requiring that the intervention affects only the tasks relevant to that feature and leaves others invariant.

  As for whether this is interesting to experts, the current draft feels like a restatement of the standard causal interventionist position without enough technical bite to satisfy the mechanistic interpretability crowd or enough philosophical rigor to satisfy the metaphysicians. The mech interp community already accepts that probes are insufficient and that interventions are necessary, so the payoff you promise is already partially claimed by existing work on causal tracing and activation patching. To make this novel, you need to tackle the hard case where the thin and thick come apart in ways that existing causal tests miss. For example, you should address superposition, where a feature is represented only in combination with others, or cases where the network uses a feature causally but does not encode it in a locally linear way. If you can show that your two-way test handles polysemanticity better than standard interchange interventions, then you have a contribution. Otherwise, you are just renaming the requirement for causal robustness. You need to stop treating the definition of representation as a purely philosophical problem and start treating it as an engineering constraint on how we validate circuits. If you can formulate the write-in condition such that it fails on known adversarial circuits but passes on robust ones, you will have something concrete. Until then, this reads like a philosophical preamble to work that has already been done empirically.
