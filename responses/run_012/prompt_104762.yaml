      *   *Correction:* I need to be careful not to just say "he's wrong." I need to show *why* the principle is controversial. The "Presumptuous Philosopher" thought experiment (by Bostrom) is the perfect tool here. It shows that SIA allows you to reject physical theories purely based on observer counts.
