answer: |-
  ### Brainstorming the Stages

  Before setting the meter, I need to map the economic mechanism onto the villanelle's repetitive structure. The form's returning lines are perfect for Hume's cyclical mechanism, but the *meaning* of those lines must shift as the poem progresses, mirroring the time-lag in the price-specie-flow mechanism.

  1.  **Stanza 1 (The Mercantilist Error):** Establish the premise. The merchant believes wealth is static stock (bullion), not flow (trade). The first refrain is a command; the second is a warning he ignores.
  2.  **Stanza 2 (The Hoard):** The policy is enacted. Export surplus achieved. Gold flows in. The merchant feels secure.
  3.  **Stanza 3 (The False Spring):** Hume's nuance. The inflow stimulates industry *before* prices rise. Things look good. The warning refrain sounds like pessimism against a booming background.
  4.  **Stanza 4 (The Price Rise):** The quantity theory kicks in. Domestic prices climb. Exports become "dear." The command refrain now sounds desperate.
  5.  **Stanza 5 (The Drain):** Imports look cheap. Gold flows out to pay the balance. The warning refrain now sounds like observation.
  6.  **Stanza 6 (The Equilibrium):** The balance returns to zero. Money is revealed as oil, not the wheel. The two refrains combine into a single sentence of cause and effect.

  **Refrain Choices:**
  *   **A1 (Mercantilist):** "Stack high the coin and call the bullion wealth." (Imperative, confident).
  *   **A2 (Humean):** "The gold you hold is the gold that leaves by stealth." (Predictive, inevitable).
  *   **Rhyme B:** -ade (Trade, Fade, Made, Paid, Shade).

  ***

  ### Of the Balance

  Stack high the coin and call the bullion wealth.
  The merchant locks the chest to stop the trade,
  The gold you hold is the gold that leaves by stealth.

  He thinks the state is built by what is made
  And kept indoors, where light and air have faded,
  Stack high the coin and call the bullion wealth.

  The surplus stirs the wheel before it's paid,
  A false spring blooms within the workshop's shade,
  The gold you hold is the gold that leaves by stealth.

  But soon the coin makes home-made goods o'er-paid,
  And foreign wares look cheap where ours have faded,
  Stack high the coin and call the bullion wealth.

  The balance finds its level unafraid,
  The oil runs out though wheels were freshly made,
  The gold you hold is the gold that leaves by stealth.

  No wheel is wealth, though oil must be paid,
  The tide returns to where the tide was made;
  Stack high the coin and call the bullion wealth,
  The gold you hold is the gold that leaves by stealth.
