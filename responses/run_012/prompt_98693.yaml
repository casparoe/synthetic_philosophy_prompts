answer: |-
  You have the setup slightly wrong because Dennett argues beliefs are objective real patterns rather than mere fictions, meaning there is a fact of the matter determined by predictive utility rather than physical composition. Dennett's core insight is that something can be real without being a physical object; centers of gravity are real, but you won't find one in a particle accelerator, and beliefs are the same kind of ontological citizen. The distinction between legitimate attribution and projection is strictly pragmatic: if treating the entity as a rational agent with specific beliefs allows you to predict its behavior more efficiently and accurately than the physical or design stances, the belief is real, but if the prediction fails, you are merely projecting. This logic applies identically to economies or countries; if treating "the market" or "France" as an agent with desires yields successful predictions about interest rates or diplomatic moves, then within that framework, those intentional states are factually real patterns. I would change my mind about your confusion if you could produce a passage where Dennett explicitly denies ontological status to intentional states beyond instrumental utility without invoking his "real patterns" argument to bridge the gap between physics and meaning.
