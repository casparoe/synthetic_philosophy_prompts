answer: |-
  ### Part 1: Brainstorming Spines

  Here are three potential structures for the activity, evaluated against your constraints (hands-on, cheap, forces commitment, embeds the "split/merge" and "universal" items).

  **Option 1: The "Alien Taxonomy" (Abstract Shapes)**
  *   **Concept:** Students receive a set of 20 cards with abstract geometric shapes and textures. They must classify them as "Species" of alien life.
  *   **Roles:** Evolutionary Biologist (lineage), Ecologist (niche), Resource Harvester (utility).
  *   **Pros:** Zero prior knowledge; pure classification.
  *   **Cons:** Too artificial. Students know it's a game immediately. It fails to generate the *ontological weight* of natural kinds because the objects have no causal powers they can intuit. They will treat it as a pattern-matching puzzle, not a metaphysical problem.

  **Option 2: The "Medical Triage" (Patient Files)**
  *   **Concept:** 20 case files with symptoms. Classify patients for treatment.
  *   **Roles:** Insurance Coder (billing categories), Physician (pathology), Researcher (genetic markers).
  *   **Pros:** High stakes; mirrors the "race/medicine" debate without using race.
  *   **Cons:** Ethical minefield. Students may disengage due to emotional load. Also, 300-level students often know too much about ICD codes, which shortcuts the philosophical friction.

  **Option 3: The "Salvage Yard Assay" (Mixed Materials)**
  *   **Concept:** A physical pile of 15-20 heterogeneous objects (rocks, metals, organics, composites). Students act as agencies sorting a disaster site or waste facility.
  *   **Roles:** Materials Recovery (composition), Safety Compliance (hazard), Historical Preservation (origin/artifact).
  *   **Pros:** Visceral ("build with hands"). Objects have real physical properties (weight, texture, smell) that resist arbitrary classification. Easy to embed the "universal" and "split/merge" constraints in specific objects.
  *   **Cons:** Requires gathering objects (but cheap/household).

  **Selection:** **Option 3 (The Salvage Yard Assay).**
  **Why:** It best satisfies the requirement that students "get burned." Physical objects push back. If you classify a magnet as "plastic" because it's painted, the next group finds out it sticks to metal. This creates the *resistance of the world* that realism requires, while the differing roles create the *pluralism* pressure. It avoids the "biology fatigue" you mentioned while preserving the structure of the species problem (individual vs. kind, intrinsic vs. relational).

  ***

  ### Part 2: The Activity Design

  **Title:** The Bureau of Classification
  **Time:** 90 Minutes
  **Materials:**
  *   **The Pile:** 15 distinct physical objects placed on a central table. (See "The Pile" below).
  *   **Role Cards:** 4 sets of index cards (one set per group).
  *   **Classification Sheets:** Blank paper (4 sheets per group for Round 1, 4+ for Round 2).
  *   **Whiteboard:** For the Debrief.
  *   **Pens.**

  **The Pile (15 Items):**
  *   *Common:* Quartz crystal, Iron nail, Cotton ball, Glass shard, Plastic bottle cap, Wooden block, Copper wire, Leather scrap, Paper sheet, Water (sealed vial).
  *   *The Universal Anchor:* **A Pure Gold Coin (or distinctively inert metal slug).** Everyone agrees it is "Metal," "Non-Toxic," and "Artifact." It resists all re-classification.
  *   *The Split/Merge Trigger:* **A Rusty Iron Bolt.**
      *   *Materials Recovery* sees: Iron + Iron Oxide (Two distinct chemical kinds).
      *   *Safety Compliance* sees: "Sharp Metal Hazard" (One functional kind).
      *   *Historical Preservation* sees: "Fastener" (One functional kind).
      *   *(Note: You need one group to split and one to merge. Assign Roles to ensure this clash happens. See Role Cards below).*
  *   *The Vagueness Trap:* **A piece of "Petrified Wood" or very dense, old wood.** Is it Wood or Stone? (Tests boundary drawing).

  **The Roles (4 Groups of 4 Students):**
  *   **Group 1: Materials Recovery Corp.**
      *   *Goal:* Maximize resale value of raw elements.
      *   *Constraint:* You must separate by chemical composition. Mixtures must be split.
      *   *Legitimacy:* Economic efficiency requires pure streams.
  *   **Group 2: Hazard Control Agency.**
      *   *Goal:* Prevent injury or contamination during transport.
      *   *Constraint:* You must group by risk profile. If two things burn the same way, they are the same kind.
      *   *Legitimacy:* Public safety requires standardized risk protocols.
  *   **Group 3: Historical Archive.**
      *   *Goal:* Preserve human intent and origin stories.
      *   *Constraint:* You must group by function/origin. A broken tool is still a tool.
      *   *Legitimacy:* Cultural heritage requires tracking provenance, not just matter.
  *   **Group 4: Logistics & Storage.**
      *   *Goal:* Maximize space and stability in the warehouse.
      *   *Constraint:* You must group by physical state and durability (Solid/Liquid, Fragile/Sturdy).
      *   *Legitimacy:* Physical infrastructure dictates storage limits.

  *(Note: I have assigned Group 1 to likely split the Rusty Bolt [Iron vs. Oxide] and Group 2/3 to likely merge it [Hazard/Fastener]. This sets up the debrief.)*

  ---

  ### Part 3: TA-Runnable Rules & Timeline

  **0:00 – 0:10: Setup & Briefing**
  *   **TA Script:** "You are four independent agencies tasked with cataloging this salvage pile. You cannot share information with other groups. You have one goal: Produce an Official Classification List.
  *   **Rule 1 (Commitment):** Your list must be exhaustive (every item classified) and mutually exclusive (an item appears in only one category).
  *   **Rule 2 (Consensus):** Every member of your group must sign the sheet. If one person disagrees, the list is rejected.
  *   **Rule 3 (Downstream Utility):** Imagine a robot with no eyes will sort these based *only* on your labels. If your labels are vague ('Stuff', 'Things'), the robot fails, and you are fired.
  *   **Action:** Hand out Role Cards. Do not let them read them aloud to other groups. Send groups to corners of the room."

  **0:10 – 0:35: Round 1 (The Forced Choice)**
  *   **Task:** Produce **one** single Classification List.
  *   **Constraint:** You may not create sub-categories. You must choose the *primary* way to sort.
  *   **TA Role:** Circulate. If a group says "It depends," remind them: "The robot needs one label. Pick the one that serves your Role's Goal best."
  *   **Stop:** Collect the 4 lists. Do not look at them yet. Post them on the board side-by-side.

  **0:35 – 0:45: The Collision (Whole Class)**
  *   **Action:** Reveal the lists.
  *   **TA Script:** "Look at Item #7 (The Rusty Bolt). Group 1 has it in two categories (Iron, Rust). Group 2 has it in one (Hazard). Look at Item #1 (Gold). Everyone agrees.
  *   **Discussion:** Ask Group 1: "Why did you split it?" Ask Group 2: "Why did you merge it?"
  *   **Trap:** If they say "Different purposes," press: "So is the bolt *actually* two things or one? Don't tell me what you *did*, tell me what the bolt *is*." (Let them struggle here. Do not solve it).

  **0:45 – 0:50: Round 2 Briefing**
  *   **TA Script:** "Round 1 was too rigid. Reality is complex. For Round 2, you are allowed **Pluralism**. You can create as many classification systems as you want (Chemical, Functional, Risk, etc.)."
  *   **The Catch (Cost):** "However, every classification system you propose costs 'Budget Points.' You start with 10 points.
      *   New Category Name: 1 point.
      *   Moving an item to a new category: 1 point.
      *   **Justification:** For every system you keep, you must write a 3-sentence 'Non-Arbitrariness Defense' on the back of the sheet explaining why this carving of nature is real and not just your opinion. If the defense is weak, I deduct 5 points."
  *   **Goal:** Maximize the utility of your sorting while staying in budget.

  **0:50 – 1:10: Round 2 (Expensive Pluralism)**
  *   **Task:** Groups rebuild their lists. They will likely try to keep multiple systems.
  *   **TA Role:** Be the harsh auditor. If a group writes "We sort by color because we like it," mark the defense as "Arbitrary" and deduct points. Force them to appeal to *causal powers* or *external constraints* to justify the cost.
  *   **Observation:** Watch if they revert to one "Real" system and treat others as "Derivative."

  **1:10 – 1:30: The Debrief (Philosophical Mapping)**
  *   **Setup:** Bring everyone to the whiteboard.
  *   **Step 1: The Universal (Realism).** Point to the Gold Coin. "Why did no one split this? Why didn't the Historian call it 'Currency' and the Chemist call it 'Element' and treat them as totally disjoint?"
      *   *Philosophical Move:* There are **Homeostatic Property Clusters (Boyd)**. The gold coin has properties that cluster together (density, color, inertness) that resist our interests. The world pushes back. This is the realist anchor.
  *   **Step 2: The Split Bolt (Pluralism vs. Vagueness).** Point to the Rusty Bolt lists. "Group 1 split it. Group 2 merged it. Was this because the boundary was *fuzzy* (vagueness)?"
      *   *Philosophical Move:* No. It was **Ontological Pluralism (Dupré)**. The bolt genuinely participates in two different causal networks (chemical decay vs. mechanical fastening). It's not that we don't know where the line is; it's that there are two different lines serving two different realities. Distinguish this from "vagueness."
  *   **Step 3: The Cost of Pluralism.** "In Round 2, did you keep all systems?"
      *   *Philosophical Move:* Pluralism isn't 'anything goes.' It's expensive. You had to defend **Non-Arbitrariness**. A kind is real if it supports **Inductive Inference** (if I know this is Iron, I know it will rust). If your category doesn't let you predict something, it's arbitrary.
  *   **Step 4: Individuals vs. Kinds.** "Did anyone treat an object as unique (an individual) rather than a kind?" (Likely the Historians).
      *   *Philosophical Move:* This is the **Species-as-Individuals** thesis. Some things are defined by their history/lineage, not their properties.

  ***

  ### Part 4: Failure Modes & Mitigation

  **Failure Mode 1: The "Gamer" Group**
  *   **Symptom:** One group realizes the "Budget" in Round 2 is abstract. They produce a list that says "Category A: Item 1, Item 2..." satisfying the letter of the rules but doing no philosophical work. They treat the activity as a logic puzzle to win, not a simulation.
  *   **Fix:** During Round 2, the TA must act as the "Downstream Robot." Tell the Gamers: "Your 'Category A' tells me nothing. I cannot sort based on this. Your Defense is rejected." Force them to use *predicates* (e.g., "Flammable," "Conductive") rather than labels ("Group 1").
  *   **Lean In?** Yes, in the debrief. "Group X tried to create a private language. This is the Nominalist trap. If your kinds don't communicate causal structure, they are useless."

  **Failure Mode 2: The "Cynic" Collapse**
  *   **Symptom:** A student says, "This is stupid. It's all just social constructs. The gold is only gold because we say it is."
  *   **Fix:** Hand them the gold coin. "Drop it on your toe. Now drop the cotton ball. Did the causal power change based on your social construct?"
  *   **Lean In?** Partially. Acknowledge that the *value* is social, but the *cluster of properties* is not. This distinguishes Social Kinds from Natural Kinds without denying the reality of either.

  **Failure Mode 3: Role Drift**
  *   **Symptom:** The "Historian" group starts classifying by chemistry because it's easier.
  *   **Fix:** The TA must enforce the Role Card constraints in Round 1. "You are the Historian. If you classify by chemistry, you are fired. Re-do it." This friction is necessary to generate the pluralism.

  ***

  ### Part 5: Limitations (What You Must Supply)

  Be frank with yourself about what this activity *cannot* do.

  1.  **Temporal Depth:** Natural kinds (especially species) are defined over time (lineage). This activity is synchronic (snapshot).
      *   *Your Job:* In the last 10 minutes, you must explain that scientific kinds often track *causal histories*, not just current properties. The "Historian" role hints at this, but you need to explicitly connect it to evolution/phylogeny.
  2.  **Discovery vs. Invention:** The activity feels like we are *imposing* categories. Real science often feels like *finding* them.
      *   *Your Job:* Highlight the "Universal Item" (Gold). Emphasize that they didn't invent its inertness; they discovered it. Use this to pivot to Scientific Realism: we invent the *labels*, but we discover the *clusters*.
  3.  **The "Carving at the Joints" Metaphor:** Students will leave thinking "Joints = Purposes."
      *   *Your Job:* Correct this. The "Joints" are where the causal powers cluster. Our *interests* determine which Joint we care about, but the Joint exists independently of the interest. (e.g., The chemical bond exists whether the Recycling Corp cares about it or not).

  **Final Note to Instructor:**
  The success of this hinges on your refusal to let them say "It depends" in the debrief. When they say it, reply: "That is the pragmatic answer. I am asking for the ontological one. If you walked away and the room burned down, would the bolt still be two things or one?" Make them sit with the discomfort of not knowing. That discomfort is the philosophy.
