answer: |-
  This is a sharp design. It leverages Dennett's "Three Stances" (Physical, Design, Intentional) to set up Churchland's Eliminativism without lecturing. The tension between *predictive success* and *ontological cost* is the right lever to pull.

  Here is the complete kit for the session.

  ### 1. Materials List
  *   **The Black Box:** A cardboard box or screen with a slot labeled "INPUT" and a slot labeled "OUTPUT." Behind it sits the "Operator" (you or a TA) with the Rule Sheet.
  *   **Card Decks:**
      *   *Input Deck (Situation):* 20 cards. (e.g., "Room is dark," "Cup is broken," "Guest is arriving," "Floor is wet").
      *   *Output Deck (Action):* 20 cards. (e.g., "Turn on light," "Sweep floor," "Hide mess," "Ignore").
      *   *Human Input Deck:* 15 request cards (e.g., "Can you pass the salt?", "Would you mind opening the window?", "Is the sky blue?").
  *   **Team Packets (4 teams of 3-4 students):**
      *   Prediction Sheets (3 sections: Physical, Functional, Intentional).
      *   **Ontology Chips:** 10 poker chips (or distinct paper tokens) per team.
      *   Pens.
  *   **Timer:** Visible to you (phone or watch).
  *   **The Handout:** The three paragraphs (see Section 6).

  ---

  ### 2. The Box Rule Sheet (For the Operator)
  *Do not give this to students. This is the "truth" of the machine.*

  **System:** TIDY-UP 3000
  **Mechanism:** Syntactic Lookup Table (No semantics, no goals, no memory).
  **Rule:** Match the **first noun** of the Input Card to the **Action Code**.

  | Input First Noun | Output Action Code |
  | :--- | :--- |
  | Room / Light | Turn on light |
  | Cup / Glass | Sweep floor |
  | Guest / Person | Hide mess |
  | Floor / Water | Ignore |
  | Door / Knock | Turn on light |
  | Cat / Animal | Sweep floor |
  | Book / Paper | Hide mess |
  | Food / Plate | Ignore |
  | **TRAP TRIALS (Round 3)** | |
  | Time / Clock | Turn on light |
  | Noise / Sound | Sweep floor |

  **Operator Instructions:**
  1.  Receive Input Card.
  2.  Identify First Noun.
  3.  Select corresponding Output Card immediately.
  4.  If a noun isn't on the list (unlikely if you stick to the deck), default to "Ignore."
  5.  **Crucial:** Do not act like you are thinking. You are a router.

  *Why this works:* For the first 8 trials, the pairs look vaguely rational (Light->Light, Cup->Sweep). But "Cup -> Sweep" is weird (why not wash?), and "Guest -> Hide mess" implies shame, not tidiness. "Floor/Water -> Ignore" is irrational for a cleaning bot. This creates enough noise that the Physical Stance fails, but enough signal that the Intentional Stance *seems* to work until the Trap Trials (Time/Clock -> Light) break the semantic link entirely.

  ---

  ### 3. Timeline & Round Rules (90 Minutes)

  **0:00 – 0:05 | Intro**
  Divide into 4 teams. Explain the goal: **Maximize Net Score.**
  *   **Prediction Point:** +1 for every correct output prediction.
  *   **Ontology Cost:** -1 Chip for every mental term (belief, desire, goal, memory, knows, wants) written in your "Explanation" column.
  *   **Starting Endowment:** 10 Chips per team.
  *   **Bankruptcy:** If you run out of chips, you may no longer use mental terms. If you do, you lose 5 points per violation.
  *   **Winning:** Highest (Points minus Chips Spent) at the end.

  **0:05 – 0:15 | Round 1: The Physical Stance**
  *   **Info:** Teams get a diagram of the box's wiring (drawn nonsense: "Sensor A connects to Wire B").
  *   **Task:** Predict the next 3 Outputs based *only* on the Input and the wiring diagram.
  *   **Expected Outcome:** Chaos. 0-1 correct predictions. No chips spent.
  *   **Debrief (1 min):** "Too complex. Too much data."

  **0:15 – 0:25 | Round 2: The Design Stance**
  *   **Info:** "This machine was built to tidy the room."
  *   **Task:** Predict the next 5 Outputs. Explain using *functions* (e.g., "It detects dirt to clean it").
  *   **Constraint:** Mental terms cost chips. Functional terms ("designed to," "function is") are free.
  *   **Expected Outcome:** Better (3-4 correct). The "Tidy" heuristic works for most, fails on "Floor/Water -> Ignore."
  *   **Debrief (1 min):** "Better, but the machine makes 'mistakes' relative to its function."

  **0:25 – 0:40 | Round 3: The Intentional Stance (The Trap)**
  *   **Info:** No new info. But tell them: "You need higher accuracy. Use whatever vocabulary gets the prediction right."
  *   **Task:** Predict the next 5 Outputs (including the 2 Trap Trials). Write explanations.
  *   **Expected Outcome:** Teams will instinctively spend chips. "It *believes* the guest is judging it," "It *wants* to hide the mess." They will get 4/5 right, maybe 5/5. They will feel confident. They will have spent 6-8 chips.
  *   **The Reveal (5 mins):** Show the Rule Sheet.
      *   "Does it believe the guest is judging it? No. It matches 'Guest' to 'Hide'."
      *   "Does it want to tidy? No. 'Floor/Water' -> 'Ignore'."
      *   **Ask:** "You spent chips to posit entities that do not exist. Did those entities help you predict? Yes. Does that make them real?"

  **0:40 – 1:00 | Round 4: The Human Confederate**
  *   **Setup:** A confederate (student or TA) sits behind a screen. They follow a **Syntactic Rule**, not a rational one.
  *   **The Rule:** "Answer 'Yes' if the request contains a **verb starting with M** (Make, Move, Mind, etc.). Answer 'No' otherwise."
  *   **Task:** Teams submit written requests (from a provided list or their own) and predict Yes/No. They must explain *why* using B/D ascriptions if they choose (costing chips).
  *   **Expected Outcome:** Teams will ascribe desires ("She wants to be helpful," "She is shy"). They will spend chips. They will get predictions wrong when the rule diverges from rationality (e.g., "Make tea" -> Yes [Rational]; "Move finger" -> Yes [Irrational context]; "Pass salt" -> No [Rational context but no M-verb]).
  *   **Contingency (Early Guessing):** If a team shouts "It's about the letter M!", acknowledge it immediately.
      *   *Response:* "Okay, you've adopted the Physical Stance on a human. You saved your chips. But look at Team 2, who said 'She wants to cooperate.' They predicted 60% accuracy. You predicted 100%. Was their explanation *false*, or just *coarse*?"
      *   *Don't let the game stop.* Have the confederate switch to Rule B ("Yes if request is polite") for the remaining teams if the secret is fully out, to keep the uncertainty alive for others.

  **1:00 – 1:10 | The Reveal & Score Count**
  *   Reveal the Human Rule.
  *   Tally scores. (Points - Chips).
  *   Likely Winner: The team that used mental terms sparingly or guessed the syntactic rule early.
  *   Likely Loser: The team that went all-in on rich psychological narratives.

  **1:10 – 1:30 | Debrief (See Section 5)**

  ---

  ### 4. Scoring Scheme Details
  To prevent hoarding (predicting nothing to save chips) or spending wildly:

  *   **Base Score:** 1 Point per correct prediction.
  *   **Ontology Tax:** 1 Chip per mental term in the *Explanation* column.
  *   **Net Score:** Total Points - Total Chips Spent.
  *   **The Kicker:** If a team predicts *correctly* using a mental term that is revealed to be **structurally impossible** (e.g., "It remembers the last turn" when the machine has no memory), they lose **2 Bonus Points** for "Hallucination."
      *   *Why:* This penalizes not just using mental terms, but using *specific* mental terms that imply architecture the system lacks. It forces them to wonder: "Can I say 'It wants' without implying 'It represents'?"

  ---

  ### 5. Debrief Plan: Mapping the Experience
  *Do not lecture. Ask questions that map their game experience to the literature.*

  **Phase 1: The Box (Eliminativism vs. Instrumentalism)**
  *   "Team 1, you wrote 'The box wants to hide the mess.' The rule sheet shows no 'wanting' module. Was your statement **false** (Churchland), or was it **useful shorthand** for a complex lookup table (Dennett)?"
  *   "If the prediction worked, what work was the word 'want' doing? Was it describing the box, or organizing your own strategy?"

  **Phase 2: The Human (The Hard Problem)**
  *   "The confederate followed a silly rule. You ascribed rational desires. You were wrong about the mechanism. Does that mean you were wrong about the **existence** of her beliefs?"
  *   "What is the difference between the Box and the Human? Is it just complexity? If we mapped every neuron, would we find a 'belief' or just a biological lookup table?"

  **Phase 3: The First-Person Gap (The Limitation)**
  *   "Nothing in this game accessed what it *felt like* to be the box or the confederate. Eliminativism attacks the third-person theory. Does your own first-person experience of having a belief save realism from this attack? Or is that just another internal signal?"

  **Structural Limitations (Be Honest):**
  1.  **First-Person Authority:** The game is purely third-person prediction. It cannot touch the *phenomenology* of belief (what it feels like to believe). Realists argue this inner feel is the proof eliminativists ignore.
  2.  **Normativity:** Beliefs aren't just predictors; they are subject to norms (truth, logic). The box has no norms, only rules. If students conflate "rule-following" with "reasoning," correct them.
  3.  **The "Real" Human:** The confederate *did* have beliefs (about the game, the rule, you). The game asked them to predict *outputs*, not internal states. This creates a confusion between "She has no beliefs about the request" (True) and "She has no beliefs at all" (False).

  ---

  ### 6. The Handout (Three Unnamed Paragraphs)
  *Print this half-page. Distribute at the end of the debrief. Ask each team to point to which paragraph their strategy inadvertently defended.*

  **A.**
  The vocabulary of belief and desire belongs to a theory we inherited from our ancestors, a theory used to predict behavior by positing internal states. History shows that successful prediction does not guarantee the reality of the posited entities. Phlogiston predicted fire behavior; witches predicted crop failure. If a more mature science of the brain explains behavior through neural activation patterns without needing "beliefs," then beliefs do not exist. We should not say beliefs are "reduced" to neurons, any more than witches were "reduced" to women. They are simply nothing. We must eliminate the terms, not save them.

  **B.**
  Asking whether beliefs "really" exist is a category mistake. Beliefs are not things inside the head like tumors or neurons. They are patterns in behavior that become visible only when we adopt a specific stance toward the system. If treating a system *as if* it has beliefs allows us to predict its actions efficiently, then it has beliefs, relative to that stance. The truth of the attribution lies in its utility, not in finding a matching object in the brain. To ask if the system "really" has beliefs independent of our interpretation is to ask a question that has no answer.

  **C.**
  Common sense tells us we have beliefs, and science should explain common sense, not abolish it. When we say someone believes it is raining, we are describing a real internal state that causes behavior and interacts with other states (like desires) according to logical rules. Neuroscience may find the physical substrate of these states, but the functional role they play is real and irreducible. If a theory of the brain cannot account for the causal power of beliefs, it is the neuroscience that is incomplete, not the folk psychology that is false.

  ---

  ### 7. Predictable Failures & Mitigations

  **Failure 1: Students treat "Function" and "Desire" as identical.**
  *   *Symptom:* In Round 2, they write "It wants to clean" but claim it's free because it's a "function."
  *   *Fix:* Be the strict banker. "Does 'want' imply a goal representation? That costs a chip. Does 'designed to' imply a goal? That's free." Force the distinction between *teleology* (Design Stance) and *psychology* (Intentional Stance).

  **Failure 2: The Confederate Round feels like a "Gotcha."**
  *   *Symptom:* Students feel tricked rather than enlightened. "Of course she wasn't rational, she was acting."
  *   *Fix:* In the debrief, emphasize: "She *is* a person. She *does* have beliefs. But your method for finding them (predicting behavior) failed to distinguish her from the box. If your detector can't tell the difference, is the detector broken, or are the things indistinguishable?"

  **Failure 3: One team dominates by guessing the syntactic rule early.**
  *   *Symptom:* They spend 0 chips and get 100% accuracy.
  *   *Fix:* This is actually a win for the lesson. In the debrief, put them on the pedestal. "This team adopted the Physical Stance on a human. It was hard, but it paid off. Why don't we do this in real life? Because it's too computationally expensive. We use the Intentional Stance not because it's true, but because it's cheap. Is truth worth the cost?"

  **Failure 4: Running out of time.**
  *   *Symptom:* Round 4 eats the debrief.
  *   *Fix:* Hard stop Round 4 at 1:00. Even if they haven't finished predictions. The confusion is more valuable than the completion. Cut the Score Count to 2 minutes; just ask "Who felt rich in chips? Who felt poor?"

  This setup forces them to pay for their ontology. When the bill comes due, they will feel the eliminativist's anxiety in their pockets.
