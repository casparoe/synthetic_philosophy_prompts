      *Drafting:*
      Center your novel on the **division of labor** (Question 5). This is upstream of everything. In your setup, voters choose the measure; therefore, they choose the reality. This is not technocracy; it is politics by another name. You can stage this as a campaign scene where candidates debate not policies, but metrics—arguing whether "welfare" means GDP, life expectancy, or happiness scores. This changes scenes because every lobby group becomes a metric lobbyist.

