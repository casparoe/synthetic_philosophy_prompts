      *Correction:* The prompt asks for desiderata for an *adequate account of what makes a pattern real*. This implies I should formulate criteria that a theory of real patterns *should* meet, drawing on Dennett's motivations but also standard metaphysical concerns.

      *Refining the "Two Teams" Case:* The user is unsure if better prediction bears on reality. The desiderata must force a decision here. If prediction is the *only* metric, it's instrumentalism. If prediction implies ontology, it's realism. I need a desideratum that clarifies this link. Let's call it **Ontological Commitment Threshold**.

