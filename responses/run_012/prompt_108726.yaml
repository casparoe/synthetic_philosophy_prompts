  2.  **Deconstruct Dennett's "Real Patterns":**
      *   Core text: "Real Patterns" (1991).
      *   Key concepts: Intentional Stance, Physical Stance, Design Stance, Indispensability, Compressibility, Noise vs. Pattern.
      *   The central tension: Realism vs. Instrumentalism. Dennett wants a "mild realism" (patterns are real *if* they support prediction/interpretation better than noise), but critics worry this collapses into instrumentalism (useful fictions).
      *   The User's specific worry: The "fixed point of compression" view (likely related to information theory/algorithmic complexity readings of Dennett) and the "better prediction by intentional stance" case.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Idea 1: Prediction.* A real pattern must predict something.
          *   *Refinement:* Not just *any* prediction. It must predict *better* than the noise or the baseline physical description.
          *   *Case:* Center of Gravity. It predicts tipping points better than tracking every atom.
          *   *Desideratum:* **Predictive Leverage.**

      *   *Idea 2: Independence.* If it's just in the eye of the beholder, is it real?
          *   *Refinement:* It needs to be there regardless of who looks, but Dennett says patterns are relative to a stance. This is tricky. Let's frame it as "Stance-Independence of the Data, Stance-Dependence of the Description." Or better: **Robustness across detection methods.**
