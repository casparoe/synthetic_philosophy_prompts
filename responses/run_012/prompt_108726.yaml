      *   *Most exclusionary:* Likely the Causal Relevance one.
      *   *Non-negotiable vs. Camp:* Distinguish between "Must predict" (Non-negotiable for Dennett) and "Must be causally potent in a robust sense" (Realist camp vs. Instrumentalist camp).

  6.  **Developing the Content (Mental Simulation of the Output):**

