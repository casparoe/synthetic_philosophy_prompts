      *   *The Desiderata:*
          1.  **The Noise/Payload Distinction:** (Based on "Real Patterns" text). A pattern must offer compression over raw data.
          2.  **Stance-Relative Objectivity:** (Based on Intentional Stance). It's not subjective whim, but relative to a strategy.
          3.  **Causal Relevance without Overdetermination:** (Based on Exclusion Argument). If beliefs are real, they matter, but physics is closed.
          4.  **Indispensability for Prediction:** (Based on the "Two Teams" case). If intentional is *strictly better*, does it mandate ontology?
