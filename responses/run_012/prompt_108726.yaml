      *   *Idea 5: The "Two Teams" Case.*
          *   *Scenario:* Intentional model predicts better than mechanistic simulation.
          *   *Problem:* Does better prediction = reality of beliefs? Or just better heuristic?
          *   *Desideratum:* **Explanatory Priority.** If the intentional model wins, does it win *ontology*?

  4.  **Refining and Structuring the Desiderata:**
      *   Need to make them sharp enough to test the "compression" view and the "two teams" case.
      *   Need to explicitly address the Realism vs. Instrumentalism divide.

      *   *Drafting D1 (The Noise Test):* Must distinguish pattern from noise. (Dennett's main point).
