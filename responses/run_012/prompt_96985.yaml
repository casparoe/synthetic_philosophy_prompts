answer: |-
  **BRAINSTORMING PASS: EPISTEMIC STATUS OF FAILED REPLICATIONS**

  **Frequentist Reading:** A well-powered replication ($N$ = 8x original) that yields $p > .05$ does not technically prove the null hypothesis (effect = 0). However, it allows us to reject the hypothesis that the effect size is as large as the original estimate. If the replication's confidence interval is tight around zero and excludes the original effect size, the original finding is statistically incompatible with the new data. The conclusion is not "the effect is impossible," but "the effect is not robustly detectable under these conditions." Priya's bright line is administratively useful but epistemically too blunt; a null result is a data point, not a gavel. However, her skepticism about the "operationalization" defense is warranted: without constraints, it renders theories unfalsifiable.

  **Bayesian Reading:** We update the probability of the hypothesis being true given the data. A high-powered null result provides a high Bayes Factor in favor of the null (or against the alternative). Sam is correct that a single null shouldn't erase a decade of work *if* the prior probability was extremely high. But in social psychology, priors should not be so strong that they resist 12-lab coordinated data. If the Bayes Factor indicates the data are, say, 10 times more likely under the null than the alternative, rational belief must shift significantly. Sam's requirement for formal Bayes Factors is methodologically sound but perhaps procedurally burdensome for P&T; the logic, however, should guide the weight we assign the failure.

  **Verdict on Colleagues:** Priya is right that we cannot allow post-hoc "construct validity" excuses to nullify high-quality replications, or we incentivize unfalsifiable research. Sam is right that $p > .05$ is not proof of absence, but wrong to suggest a decade of citations outweighs a direct, high-powered failure if that decade rests on the failed finding. The policy must treat a failed registered replication as strong evidence of non-generalizability, placing the burden of proof on the candidate to demonstrate why the replication does not apply to their claim.

  ***

  **MEMORANDUM**

  **TO:** Research-Evaluation Committee, Department of Psychology
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommended Guidelines for Evaluating Failed Replications in P&T Dossiers

  **1. Purpose**
  This memo proposes a standardized framework for evaluating publication records when a candidate's key findings have been subject to registered replication efforts that failed to reproduce the original effects. As the field shifts toward openness and reproducibility, our Promotion and Tenure guidelines must reflect the epistemic weight of replication data without punishing legitimate theoretical nuance.

  **2. Recommended Policy: The Compatibility and Burden Standard**

  **A. Defining a "Failed Replication"**
  For the purposes of evaluation, a replication is considered a "failure" of the original finding if:
  1.  The replication was preregistered with a sample size determined by power analysis based on the original effect size (ideally aiming for 90%+ power).
  2.  The replication effect size is statistically distinguishable from the original effect size (i.e., the original point estimate falls outside the replication's 95% compatibility interval), OR the replication Bayes Factor provides moderate-to-strong evidence in favor of the null hypothesis (BF$_{01} > 3$).
  3.  The replication protocol was vetted by the original authors (when possible) or independent methodologists to ensure procedural fidelity.

  **B. Weight in Evaluation**
  A failed replication as defined above constitutes significant negative evidence regarding the *generalizability* and *reliability* of the finding.
  *   **Flagship Findings:** If the failed replication concerns a "flagship" paper (defined as the primary theoretical contribution or most highly cited work under review), the finding cannot be counted as positive evidence of research impact or theoretical validity.
  *   **Cumulative Record:** A single failed replication does not automatically disqualify a candidate, but it requires the committee to assess whether the remaining body of work stands independently of the failed finding.

  **C. Adjudicating Defenses (The "Operationalization" and "Moderator" Clauses)**
  Candidates may contest the validity of a replication failure. To prevent unfalsifiable defenses, the following standards apply:
  *   **Operationalization Mismatch:** The candidate must demonstrate that the replication altered a *theoretically necessary* feature of the manipulation, not merely a superficial one. This claim must be supported by pilot data or prior literature showing the dropped feature is essential. Mere assertion is insufficient.
  *   **Heterogeneity/Moderators:** Claims that "the effect is conditional" must identify a specific, measurable moderator. Post-hoc speculation that "unknown moderators exist" is not admissible. The candidate must propose a testable model explaining why the multi-lab design averaged out a critical variable.

  **3. Procedure for Hard Cases**

  When a dossier contains a significant replication failure:
  1.  **External Review:** At least one external letter must be solicited from a methodologist or content expert specifically asked to evaluate the replication dispute (original vs. replication protocol).
  2.  **Burden of Proof:** The burden lies with the candidate to demonstrate why the replication does not invalidate the claim. The default assumption is that the higher-powered, preregistered study provides the more accurate estimate of the effect.
  3.  **Committee Deliberation:** The committee must vote separately on the "Reliability of Core Contributions" before voting on the overall promotion. If the core contribution is deemed unreliable due to replication failure, promotion should not proceed unless secondary contributions are independently sufficient for R1 tenure.

  **4. Illustrative Application: Current Candidate File**

  *Note: Although I am recused from voting on this specific candidate, I apply the above rule to the current file to demonstrate how the committee should utilize this framework.*

  **The Finding:** The candidate's 2016 flagship paper (4-digit citations) posits a specific social-cognitive mechanism.
  **The Replication:** A 12-lab registered replication with 8x the original sample size yielded a null result. The original effect size falls outside the replication's compatibility interval.
  **The Defense:**
  1.  *Operationalization:* The candidate argues the replication dropped a specific feature of the original manipulation.
  2.  *Moderators:* The candidate cites between-lab scatter as evidence of unmeasured moderators.

  **Evaluation under Proposed Rule:**
  1.  **Status of Finding:** Under Section 2A, this is a defined "Failed Replication." The power and preregistration standards are met. The original effect is statistically incompatible with the replication data.
  2.  **Assessment of Defense:**
      *   *Operationalization:* The candidate has not provided pilot data or prior literature establishing the dropped feature as theoretically necessary. This appears to be a post-hoc rescue of the hypothesis. Under Section 2C, this defense fails.
      *   *Moderators:* While lab scatter exists, the candidate has not identified a specific moderator or offered a testable model. Under Section 2C, this defense fails.
  3.  **Impact on Dossier:** As this is the flagship finding (Section 2B), it cannot count as positive evidence of theoretical validity. The citation count reflects interest, not reliability.
  4.  **Recommendation:** Based strictly on the research guidelines proposed here, the candidate's core contribution is currently unreliable. Unless the remaining portfolio demonstrates independent R1-level impact (separate from the 2016 paper), the recommendation should be **Negative**.

  **5. The Strongest Case Against This Recommendation**

  The committee should consider the following argument, which I believe represents the strongest opposition to the policy above:

  *Science is a long-term correction process, and P&T is a personnel decision.* By weighting a single replication effort (even a large one) so heavily, we risk punishing candidates for the field's transitional growing pains. The "Operationalization" defense is often dismissed as ad hoc, but construct validity is genuinely difficult. It is possible the replication *did* measure the wrong thing, and history may vindicate the original theory while discarding the specific protocol. Furthermore, requiring candidates to "prove" a moderator exists before tenure may stifle theoretical risk-taking. If we enforce a strict compatibility standard, we may incentivize safe, incremental work that replicates easily but advances the field slowly. Finally, the candidate's 10-year record includes mentorship, grants, and other papers that built a research program around the 2016 finding; declaring that finding "unreliable" now may retroactively invalidate work that was considered cutting-edge at the time. A more charitable view is to treat the replication as an open question rather than a disqualification, granting tenure contingent on the candidate resolving the discrepancy in the next three years.

  **6. Bottom Line and Vote**

  The argument above is charitable, but it places the burden of field-level uncertainty on the department's standards. We are an R1 institution; our tenure standard must be the reliability of knowledge production, not just productivity. Allowing a flagship finding to stand despite a 12-lab null result signals that we prioritize citation metrics over truth.

  **I recommend the committee adopt the "Compatibility and Burden Standard" outlined in Section 2.**

  **Regarding the current candidate:** Applying this standard objectively, the defense provided does not meet the burden of proof required to override the replication data. **I recommend voting No on Promotion** based on research reliability, regardless of personal relationships or citation counts. This sends a necessary signal about the department's commitment to rigorous science.

  **Action Required:**
  1.  Vote to adopt the proposed guidelines for future and current cycles.
  2.  Vote on the candidate's promotion based on the application of these guidelines.
