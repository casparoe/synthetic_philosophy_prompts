prompt: |-
  I'm a retired physiologist — thirty-odd years teaching renal and respiratory physiology to medical students, took the pension a few years back, and since then I've been reading philosophy of medicine in a slightly obsessive way; my wife calls it a mid-life crisis with footnotes. I've ended up with a view I'm presenting at a reading group run out of the bioethics centre at the university in town next month, and what I want from you is help with the question period, not with the talk. The view, roughly: the concept of disease does have a descriptive core — something like statistically subnormal functioning of a part or process relative to a reference class — so the naturalists (Boorse's biostatistical thing, I think that's what it's called) are right that "disease" isn't simply a value judgement in a lab coat. But the reference class is not handed to us by biology. Somebody chooses it, and the choice is where the values sneak in. And I want to push a distinction I haven't seen put this sharply: there are two quite different reference classes in play, a design class (what the part is for, what it did in the environment of evolutionary adaptedness, whatever the optimality story turns out to be) and a population class (what the part actually does in the people in front of you, age- and sex-matched or not). Nearly every live fight in the field, I think, is a fight about which class to use, conducted as if it were a fight about facts versus values. Blood pressure thresholds, "prediabetes", whether the fact that the large majority of young men in some East Asian cities are now short-sighted means short-sightedness has stopped being a disease, whether ageing is a disease — all of these, on my account, are reference-class disputes wearing a costume. I'd rather not have to defend the whole edifice live; I'd rather know what's coming at me.

  The room is a bit of a zoo, which is why I'm asking. About half are from the bioethics centre — normativist by temperament, they've read a lot of Foucauldian stuff about medicalisation and the sick role, deeply suspicious of anything that sounds like letting biology adjudicate what counts as illness, and they'll hear my "descriptive core" as a power play dressed up as a definition. Then there are two philosophers of biology from the other side of campus who are card-carrying naturalists; they know the biostatistical literature backwards and they'll go straight for the details — is my "design class" just the old evolutionary teleology in a new hat, do I have any principled way of picking the reference class that doesn't smuggle in the answer, and why should the fact that we can't agree on the class not just be an arguement for the normativists. There's also a consultant physician who's come along because she sits on the ethics committee and mainly wants to know whether any of this changes what she does on a Tuesday morning, and a historian of medicine who will say, politely, that all this was settled in the nineteenth century and I'm reinventing the wheel. It's a friendly crowd but not a shy one.

  So what I'd like is a prep sheet: the objections I'll actually get from these people, phrased in their own vocabularies, ordered by how much damage they'd do to the position rather than by how likely they are to come up. For each one, a two-minute reply I can actually deliver out loud, and a note on where that reply is soft — I'd much rather know the weak joints in advance than have them found for me. Tell me what to concede up front (I'm happy to give away more than I need to), what to hold, and which single reply has to land for the thing to survive at all. And tell me the question I'm definately hoping nobody asks — I think I know what it is, but I want to see whether you land on the same one. Write it in American English, please; I read enough of it these days that British spelling in a document like this throws me off when I'm rehearsing.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Retired physiologist (30+ years exp), teaching renal/respiratory physiology to med students. Now obsessed with philosophy of medicine. Self-deprecating humor ("mid-life crisis with footnotes").
      *   **Context:** Presenting a view at a university bioethics reading group.
      *   **The View:** Hybrid theory of disease. Acknowledges a descriptive core (naturalist/Boorse-like) but argues the *reference class* selection is value-laden. Distinguishes between "design class" (evolutionary function) and "population class" (statistical normality in current population). Claims most debates (BP thresholds, aging, myopia) are actually reference class disputes disguised as fact/value debates.
      *   **The Audience:**
          1.  Bioethicists (Normativists, Foucauldian, suspicious of biological determinism/power plays).
          2.  Philosophers of Biology (Hardcore Naturalists, know Boorse well, worry about teleology and circularity).
          3.  Consultant Physician (Pragmatist, wants clinical relevance).
          4.  Historian of Medicine (Thinks this is old news/19th-century debate).
      *   **The Task:** Create a prep sheet for the Q&A session.
          *   List objections phrased in the audience's vocabularies.
          *   Order by *damage potential* (not likelihood).
          *   Provide 2-minute oral replies.
          *   Identify weak joints in the reply.
          *   Advise on concessions vs. holding ground.
          *   Identify the "single reply" that must land.
          *   Identify the "question hoping nobody asks."
          *   **Style:** American English (crucial constraint).

  2.  **Deconstruct the User's Position:**
      *   *Core Claim:* Disease = Subnormal functioning relative to a reference class.
      *   *Innovation:* Two types of reference classes: Design (evolutionary) vs. Population (statistical).
      *   *Meta-Claim:* Disputes about disease status are actually disputes about which reference class to prioritize.
      *   *Vulnerability:* How do you choose between Design and Population without invoking values? If values choose the class, is the "descriptive core" doing any work, or is it just a shell?

  3.  **Drafting the Objections (Brainstorming by Audience):**

      *   *Bioethicists (Normativists):* "You're still privileging biology. Choosing the reference class is a political act. Who decides the 'design'?"
      *   *Philosophers of Biology (Naturalists):* "Design class is just Boorse's 'species-typical function' with extra steps. If you admit values choose the class, you've conceded to the normativists. Why keep the 'descriptive core'?"
      *   *Physician:* "Does this help me treat hypertension? If the reference class changes, does the treatment change?"
      *   *Historian:* "Virchow/Osler dealt with this. Normal vs. Pathological is old news."

  4.  **Ordering by Damage Potential:**
      *   *Highest Damage:* The "Hollow Core" objection (from Naturalists/Normativists alliance). If the choice of reference class is value-laden, the "descriptive core" is inert. The definition collapses into normativism.
      *   *High Damage:* The "Teleology Trap" (from Phil of Bio). If "design" implies intent or optimal past environments, it's scientifically shaky (evolution doesn't optimize for health).
      *   *Medium Damage:* The "Clinical Uselessness" (from Physician). If it doesn't change practice, why bother?
      *   *Low Damage:* The "Historical Redundancy" (from Historian). Interesting, but doesn't falsify the theory.

  5.  **Developing Replies and Weak Joints:**

      *   *Objection 1 (The Hollow Core):* If values pick the class, isn't the whole thing normative?
          *   *Reply:* Distinguish *constitutive* values from *contextual* values. The *measurement* is descriptive; the *threshold* is pragmatic. Like speed limits.
          *   *Weak Joint:* Speed limits are arbitrary; disease feels non-arbitrary.
      *   *Objection 2 (Teleology):* "Design" is unscientific.
          *   *Reply:* Use "selected effect" function, not intentional design. It's about what kept ancestors alive, not what was "meant" to be.
          *   *Weak Joint:* Evolutionary psychology baggage. Hard to prove specific past functions.
      *   *Objection 3 (Clinical Utility):* Does this change Tuesday morning?
          *   *Reply:* It clarifies *why* we disagree. It stops us pretending the disagreement is about lab results when it's about goals.
          *   *Weak Joint:* Busy doctors don't care about meta-ethics.
      *   *Objection 4 (History):* This is old.
          *   *Reply:* Canguilhem did this, but we have genomics now. The *mechanism* of the dispute is new.
          *   *Weak Joint:* Might look arrogant.

  6.  **Strategic Advice (Concessions/Holding Ground):**
      *   *Concede:* The choice of reference class is value-laden. (This is the user's thesis anyway).
      *   *Hold:* The *functioning* within that class is empirically measurable. There *is* a fact of the matter once the class is picked.
      *   *Must Land:* The distinction between Design and Population classes explains *why* the values clash. It maps the battlefield.

  7.  **The "Question Hoping Nobody Asks":**
      *   What kills hybrid theories? Usually, it's the "Line Drawing Problem."
      *   *Candidate:* "If the reference class is chosen by values, and the threshold within the class is chosen by values (e.g., what SD count counts as 'subnormal'), where is the objectivity?"
      *   *Better Candidate:* "What about conditions where the Design Class and Population Class align, but we still call it a disease (or not)?" Or, "What about *harm*?" Boorse requires dysfunction + harm. User didn't mention harm.
      *   *Best Candidate:* "If a trait is statistically normal (Population) and evolutionarily designed (Design), but causes suffering (e.g., childbirth pain, or perhaps aging), is it a disease?" Or conversely, "If a trait is dysfunctional by Design but universal in Population (e.g., bad backs), is it a disease?"
      *   *Refined:* The "Universal Dysfunction" problem. If everyone has it (Population = 100%), but it violates Design, is it a disease? (e.g., wisdom teeth, aging). If you say yes, you medicalize the human condition. If no, you ignore the Design class.
      *   *Actually, the strongest killer:* "Why keep the word 'disease' at all?" If it's a hybrid, why not just say "harmful dysfunction relative to goal X"? The term "disease" carries a specific normative weight you're trying to strip.
      *   *Let's go with the "Harm" omission.* Boorse requires dysfunction. Nordenfelt requires harm. User mentions functioning but not harm. If a dysfunction causes no harm, is it a disease?
      *   *Wait, the prompt asks what *I* think the user hopes nobody asks.* The user suspects I know it. The biggest hole in *this specific* formulation (Design vs. Population) is: **What happens when they conflict?** You say it's a value choice. But *which* values? And who decides? If you can't answer that, you haven't solved the problem, you've just relocated it.
      *   *Decision:* The "Who Decides?" question. If the choice of class is value-laden, who has the authority to make that choice? The state? The doctor? The patient? This opens the Foucauldian can of worms the user wants to keep shut.

  8.  **Review against Constraints:**
      *   American English (color, center, defense, etc.).
      *   Tone: Respectful, peer-to-peer (retired prof to active academics), pragmatic.
      *   Format: Prep sheet style.
      *   Content: Objections, Replies, Weak Joints, Strategy, The Forbidden Question.

  9.  **Refining the Output (Self-Correction during drafting):**
      *   *Check:* Did I capture the "Design vs. Population" distinction clearly in the replies? Yes.
      *   *Check:* Is the tone right? Needs to be collegial but sharp. "Here's the hit you're going to take."
      *   *Check:* American spelling. (Center, defense, program, etc.)
      *   *Check:* The "Must Land" reply. It needs to be the one that validates the *utility* of the distinction, even if the metaphysics are shaky.
      *   *Check:* The "Forbidden Question." It needs to be the one that exposes the political vulnerability.

      *(Self-Correction on the "Forbidden Question")*: The user's theory rests on the idea that reference class selection is where values enter. The killer question is: "If values select the reference class, isn't 'disease' just a label we slap on after we've already decided we don't like the condition?" This makes the 'descriptive core' epiphenomenal. I will frame this as the "Epiphenomenal Core" objection.

      *(Self-Correction on "Must Land")*: The most important thing is to show that distinguishing the *types* of reference classes clarifies the *source* of the disagreement. It doesn't solve the disagreement, but it diagnoses it. That's the value add.

  10. **Final Polish:** Ensure the voice sounds like a colleague helping a colleague, not an AI lecturing. Use phrases like "Here's the hit," "Soft underbelly," etc.

