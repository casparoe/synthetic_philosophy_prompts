      *   The accusation: "We are butchers with scalpel handles." vs "We are grave robbers with ventilators."

  7.  **Final Polish:** Check pacing. Ensure the medical ethics jargon (DCD, NRP, brain death, somatic integration) is used naturally. ( *Self-Correction: Make sure the distinction between Brain Death (DBD) and Circulatory Death (DCD) is clear in their arguments.*)

