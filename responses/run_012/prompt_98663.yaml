answer: |-
  This is a classic reconstruction of the St. Petersburg Paradox, and your officemate is correct that swapping "money" for "rescues" (with stipulated linear utility) blocks the standard Bernoulli solution. You are right to feel that something is breaking, but your second worry—that this refutes the *entire* expected-utility apparatus—is the key to locating the error.

  If an argument refutes a theory by constructing a scenario that the theory itself says is impossible (or incoherent), the fault lies in the construction's compatibility with the theory's axioms, not necessarily the theory itself.

  Here is the breakdown of where the argument goes wrong, why your intuition about step (3)-(4) is partially right but misdiagnosed, and what you actually have to give up to save decision theory.

  ### 1. Diagnosing the "Too Much" Worry
  Your second worry is the most philosophically productive: *"If it kills expected value maximization for any good without diminishing returns... it refutes the whole expected-utility apparatus."*

  This is a *reductio ad absurdum* of the officemate's conclusion, not of decision theory. Expected Utility Theory (EUT) is not a single monolithic claim; it is a representation theorem. It says: *If* your preferences satisfy certain axioms (completeness, transitivity, continuity, independence), *then* they can be represented as maximizing the expectation of a utility function.

  The St. Petersburg setup reveals that **Unbounded Utility** and **Infinite Expectations** are incompatible within that framework. You cannot have a utility function that is unbounded (linear rescues forever) *and* a decision rule that successfully handles lotteries with infinite expected utility. One must go.

  Since the lottery is mathematically definable (the officemate's "Imagine..."), the constraint must fall on the **Utility Function**. The argument doesn't prove EUT is dead; it proves that **a rational agent's utility function must be bounded**, even for goods that seem to have linear value locally.

  ### 2. Evaluating the Premises
  Let's look at the chain. The officemate's argument is valid, but it relies on a hidden premise that is false.

  *   **(1) A rational agent maximizes expected value.**
      *   *Status:* Acceptable, provided "value" means "utility" and the expectation is well-defined.
  *   **(2) The lottery's expected value is infinite.**
      *   *Status:* Mathematically true *given the setup*. $\sum (1/2^n) \cdot 2^n = \infty$.
  *   **(3) & (4) Infinite > Finite, so pay any finite fee.**
      *   *Status:* Your intuition flagged this as sneaky. It isn't sneaky *arithmetic*, but it is sneaky *ontology*. If $E[U] = \infty$ and $Cost < \infty$, then $E[U] - Cost = \infty$. The inference holds *if* you accept infinite utility as a coherent input for decision making. The "sneakiness" you feel is the realization that $\infty$ is not a number you can plug into a decision rule without breaking the rule's coherence.
  *   **(5) & (6) The outcome is irrational/reckless.**
      *   *Status:* This is the anchor. Our considered judgment is that betting everything on a 50% chance of 2 rescues is irrational.
  *   **(7) So (1) is false.**
      *   *Status:* **This is the error.** It concludes that *maximization* is the problem. The real problem is the assumption that a utility function can be **unbounded** over a domain that allows for St. Petersburg lotteries.

  ### 3. The Real Break Point: Bounded Utility
  The standard move in the foundations of probability (championed by Savage and others) is to reject the possibility of an unbounded utility function for a rational agent.

  Your officemate stipulates: *"The thousandth rescue is worth as much as the first."*
  This is a claim about the **good** (rescues), not the **agent's utility**. Decision theory is about the agent's preferences, not the ontology of the good.

  To save Expected Utility Theory, you must argue that while the *moral value* of rescues might be linear, a rational agent's *utility function* cannot be. Why?

  1.  **Coherence:** If your utility is unbounded, I can construct a St. Petersburg lottery for *any* good you care about. If you accept the lottery, you are vulnerable to "money pumps" or dynamic inconsistency (e.g., paying to swap tickets in ways that guarantee loss). To remain coherent, your utility *must* saturate.
  2.  **Finitude of the World:** Even if the 1000th rescue is as valuable as the 1st, there is a maximum number of people who can exist or be rescued. The series $2^n$ quickly exceeds the number of people in the universe. Once the payoff exceeds the total population, the marginal utility *must* drop to zero. Therefore, the expectation is actually finite, just very large.
  3.  **Epistemic Uncertainty:** In any real decision, you cannot be certain the "bank" can pay $2^{100}$ rescues. As $n$ rises, the probability that the offer is fraudulent or physically impossible approaches 1 faster than the payoff grows. This collapses the expectation back to finite.

  **The Cost:** You have to tell your officemate that his stipulation ("no diminishing marginal value") is incompatible with rational agency *in the context of infinite lotteries*. You aren't saying rescues have diminishing value; you are saying **rational preference orderings must be bounded.**

  ### 4. Addressing Your First Worry (Steps 3-4)
  You felt the jump from "prefer to any sure finite amount" to "willing to pay any finite fee" was doing something sneaky.

  In standard arithmetic, it isn't. But in decision theory, it highlights a category error.
  *   **Preference:** "I prefer Lottery L to Sure Thing S." This is an ordinal ranking.
  *   **Willingness to Pay:** This implies a cardinal trade-off between the lottery and your current endowment.

  When expectations are infinite, the ordinal ranking breaks down. If $E[L] = \infty$, then $L$ is preferred to any finite $S$. But if you pay a finite fee $F$, you are comparing $\infty - F$ to $\infty$. In standard hyperreal or extended real arithmetic, this is undefined.

  The "sneakiness" is that the officemate is treating infinite expectation as a **dominant reason for action** comparable to finite expectations. But infinite expectations do not obey the Law of Large Numbers. If you play the St. Petersburg game 1,000 times, your average payoff will *not* converge to the expected value (because there is no finite mean). Therefore, "Maximize Expected Value" loses its normative force (the justification for EV is usually that it guides you to the best long-run outcome). If the long-run doesn't converge, the EV rule has no pragmatic grounding.

  So, you can reject (3) not because the math is wrong, but because **Expected Value is not action-guiding when the expectation diverges.**

  ### 5. Conclusion: What to Tell Your Officemate
  The argument is not airtight. It proves that **Unbounded Utility + Infinite Expectations = Incoherence.** Since we want a coherent decision theory, and we can mathematically describe the lottery, we must restrict the Utility Function.

  **The Verdict:**
  Reject the implicit assumption that a rational agent can have an unbounded utility function.
  *   **Why:** Because if utility is unbounded, the agent is vulnerable to preference reversals and cannot make consistent choices over rich sets of lotteries.
  *   **Cost:** You must admit that "rationality" imposes structural constraints on valuation that go beyond the intrinsic properties of the good. Even if saving lives is linearly good, a rational agent *cannot* value them with an unbounded function.
  *   **Benefit:** This saves Expected Utility Theory. It remains the correct theory for **finite expectations** (which is 99.9% of decisions). The St. Petersburg case is a boundary condition, like dividing by zero in arithmetic. It shows where the domain of the theory ends, not that the theory is false within its domain.

  **Your "Too Much" worry was the correct instinct.** If the argument killed EV theory generally, it would be self-defeating (since the argument itself relies on logical inference, which is a form of rationality). The fact that it only breaks EV theory in the presence of *actual infinities* tells you that the problem is the infinity, not the rationality.

  Tell him: "You haven't killed Expected Utility. You've proved that rational utility functions must be bounded. The thousandth rescue might be morally equal to the first, but my utility function cannot reflect that linearity all the way to infinity without ceasing to be a function that can guide action."
