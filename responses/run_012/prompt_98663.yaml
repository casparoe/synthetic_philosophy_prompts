prompt: |-
  I'm a first-year PhD student in decision theory and my officemate has spent three weeks trying to convince me of something, and I finally wrote his argument down so I could look at it properly instead of arguing about it in the hallway. You're a philosopher who works on decision theory and the foundations of probability. Think carefully before you answer, and if it helps, brainstorm a bit first about what could be going on — I'd much rather have your reasoning than a verdict. Please don't just recite the usual line about the diminishing marginal utility of money; I already know that line, and his whole point is that he's picked a case where it doesn't apply. So here's the setup and then the argument.

  Setup. Forget money. Imagine a lottery that delivers a good he calls 'rescues' — each unit is one person pulled out of a burning building. He wants us to stipulate that there's no diminishing marginal value in rescues: the thousandth rescue is worth as much as the first, so the marginal value is flat. The lottery: a fair coin is flipped until it lands heads; if heads first lands on flip n, you get 2^n rescues; if it never lands heads, you get nothing. He points out the expected number of rescues is 1/2 x 2 + 1/4 x 4 + 1/8 x 8 + ... = 1 + 1 + 1 + ..., which diverges, while half the time you walk away with exactly 2 rescues.

  His argument:

  (1) A rational agent maximizes expected value.
  (2) The lottery's expected value is infinite.
  (3) Infinite value exceeds any finite amount, so a rational agent should prefer the lottery to any sure finite number of rescues, and should be willing to pay any finite fee to play it once.
  (4) Everything you own or could borrow is finite, so a rational agent should be willing to give all of it, and go as deep into debt as anyone will let him, to play once.
  (5) But with probability 1/2 the lottery delivers only 2 rescues, and an agent who has already given away everything will, in that branch, have made the world much worse than if he'd done nothing.
  (6) A rule that tells you to liquidate the world's resources for a coin flip that half the time helps almost no one is not a rule of rationality.
  (7) So (1) is false — and not just for money. Any good without diminishing marginal value gives you the same result, so expected value maximization is dead as a general theory.

  He says the money version of this is some famous old puzzle and that the only reason it ever seemed solved is that money happens to have diminishing marginal utility; swap in a good that doesn't, and the paradox comes roaring back with nothing left to stop it.

  Two things bother me and I can't tell if they're real objections or just me being slow. First, my gut says the break is somewhere around (3) or (4) — the jump from 'should prefer it to any sure finite amount' to 'should be willing to pay any finite fee' feels like it's doing something sneaky, but I can't say what. Second, and this is the one that really nags: if his argument is good, it seems to prove way too much. If it kills expected value maximization for any good without diminishing returns, and you can always invent a lottery like this for whatever an agent happens to care about, then it doesn't just refute one decision rule — it refutes the whole expected-utility apparatus, anyways. A reductio that takes out everything can't be pointing at the real problem.

  So: which premise or step should I reject, why does it look fine until you push on it, and what does rejecting it actually cost me? And if you think the argument is airtight and the honest move is to bite a bullet somewhere, tell me which premise is least costly to give up and what I'm buying. Just the reasoning please — no reading list.
