          *   (6) is the intuitive anchor.
      *   **The Solution:** Reject the implicit assumption that a rational agent can have an unbounded utility function over a domain that allows for St. Petersburg lotteries.
      *   **Why Bounded Utility?** Even for rescues. There is a maximum number of people who can exist/be saved. Or, epistemic uncertainty about the payoff structure (can the bank actually pay 2^100 rescues?).
