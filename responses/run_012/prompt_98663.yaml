      *   *The "Too Much" Worry:* The user is right to be worried. If linear utility + SPP kills EV theory, then EV theory can *never* work for any good with unbounded utility. That suggests the problem isn't EV theory, but the setup (infinite expectations).
      *   *Premise (1):* "Maximizes Expected Value." Is this the right norm? Or is it "Maximizes Expected Utility"? In this setup, Value = Utility (linear). So (1) is the target.
