      *   *Premise (3) -> (4):* The user suspects this jump. "Prefer to any sure finite amount" $\neq$ "Willing to pay any finite fee" *if* the payment affects the utility of the payoff or the probability structure. But here, the fee is paid *ex ante*. If I pay $F$, my net utility is $U(\text{rescues}) - U(F)$. If $U(\text{rescues})$ is infinite in expectation, and $U(F)$ is finite, EV says pay. This step seems valid *within* the EV framework.
