      *   *Specific point on (3)-(4):* The user thinks this is sneaky. I need to explain *why* it feels sneaky. It feels sneaky because in the real world, paying a fee changes your state, which might change the utility of the payoff (e.g., if you are destitute, saving 2 people matters less? No, stipulated linear). The sneakiness is actually that we are treating $\infty$ as a number.
      *   *The "Reductio" point:* The user says "If it kills EV for any good without diminishing returns... it refutes the whole apparatus." I need to correct this. It refutes the apparatus *only when applied to unbounded utilities with heavy-tailed distributions*. Most real decisions don't involve infinite expectations. So the apparatus survives for finite cases.
