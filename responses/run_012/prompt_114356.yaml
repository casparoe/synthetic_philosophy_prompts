prompt: |-
  A friend and I have been arguing for two years about the American vs. the European attitude toward inequality -- he's the American one (inequality is fine if the game was fair and the losers can still climb; resentment of the rich is the real vice) and I'm the European one (an order that leaves people that far behind isn't decent no matter how well the race was run, and 'he earned it' is mostly a story the winners tell). We keep re-litigating the same three examples and getting nowhere. Write the joint statement we could both sign after an honest adversarial collaboration: what we actually agree on about the facts (mobility, what people say in surveys vs. what they do, how much of the gap is inherited), then the disagreement stated in wording each of us would accept for our own side, then the cruxes. I think two of the cruxes are whether desert survives the discovery that effort is itself alot more inherited-ish than we'd like, and whether the American view is really a factual bet about mobility that would collapse if the mobility numbers came in low or whether it's held independently of them -- so for each crux give the case or evidence we'd both agree bears on it and write down in advance what each of us predicts. Two things I want tested: the fair-lottery case, where everyone starts genuinely equal and the inequality comes out of a fair coin-flip process -- does my side still object, does his still shrug? And the thing where the people just above the bottom are the angriest about redistribution because they can't stand to end up last -- is that a fact about them or about all of us. If part of the fight turns out to be about what 'fairness' means on each side (equal chances vs. nobody having power over anybody else), say which part and why. Numbered agreed-claims section first, then a disagreements table.
