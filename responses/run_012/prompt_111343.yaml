prompt: |-
  I'm a platform engineer with no philosophy background, and I keep running into coordination problems that turn out to be about what other people know that I know. Two recurring shapes: two teams each want a different tie-break rule for conflicting writes, where either rule is fine so long as both teams run the same one; and protocols where service A will only proceed if it is sure B will also proceed, so we bolt on confirmations — B acknowledges, A acknowledges the acknowledgement, and so on. These feel unlike ordinary bugs, but I lack the vocabulary for why, and I don't want to re-derive it at every design review.

  Please write a procedure I can run before shipping a coordination rule or a multi-party protocol, grounded in whatever the philosophy of convention and common knowledge actually establishes — the account on which a regularity is self-sustaining only when each party prefers to conform given that the others do, and the distinction between mere mutual knowledge and the stronger condition that I know that you know that I know, indefinitely. I want the steps in order, what counts as passing each one, where the procedure returns a no, and where it stops and hands the matter to a person because it concerns preferences or authority rather than engineering. Include the question I suspect I am missing: whether a given rule needs the relevant fact to be merely mutual knowledge or genuinely common knowledge, and what to do when only finite confirmation handshakes are available, since any message can fail to arrive and each confirmation appears to require one of its own. If the honest answer is that a specification document cannot manufacture the thing we need and it takes a focal point or a designated authority instead, say so.

  Then run the procedure on two cases: (1) two teams adopting a shared tie-break rule, where each is content to match the other's choice but neither cares which is chosen; and (2) the acknowledge-the-acknowledgement protocol above, where each side's payoff depends on the other's certainty. Tell me plainly if the procedure says the second cannot be made to work by adding messages, and what it directs me to do instead. The procedure will be used by engineers without formal training, signed off by our architecture lead, so it needs to be runnable in a thirty-minute review. Finish by telling me what this procedure cannot decide.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User Persona:** Platform engineer, no philosophy background.
      *   **Problem:** Recurring coordination problems (tie-break rules, infinite acknowledgment loops).
      *   **Core Concepts:** Convention (Lewis), Common Knowledge (Aumann/Lewis), Mutual Knowledge vs. Common Knowledge, Focal Points (Schelling).
      *   **Deliverable:** A runnable procedure (checklist/algorithm) for design reviews (30 mins max).
      *   **Requirements:**
          *   Grounded in philosophy of convention/common knowledge.
          *   Steps in order, pass/fail criteria.
          *   Identify where it hands off to authority/preferences.
          *   Address the "finite handshake vs. infinite requirement" paradox.
          *   Run the procedure on two specific cases (Tie-break rule, Ack-ack protocol).
          *   Plain language on whether the second case can work via messages.
          *   Conclusion on what the procedure *cannot* decide.
      *   **Tone:** Practical, engineering-focused, precise, authoritative but accessible.

  2.  **Theoretical Grounding (Mental Sandbox):**

      *   *David Lewis (Convention):* A convention is a regularity $R$ in a population $P$ where everyone conforms, everyone expects others to conform, and everyone prefers to conform *if* others conform. Crucially, it requires *Common Knowledge* (CK) that everyone conforms.
      *   *Common Knowledge:* $E$ is CK if everyone knows $E$, everyone knows everyone knows $E$, ad infinitum.
      *   *The Paradox:* In distributed systems with unreliable channels (TCP, HTTP, etc.), CK is impossible to achieve strictly (Two Generals Problem). You can only get $n$-th order mutual knowledge.
      *   *Schelling (Focal Points):* When communication is limited or impossible, people coordinate on salient features (defaults, standards, authority).
      *   *Engineering Translation:* You can't code your way out of a Common Knowledge requirement with unreliable links. You need a "Single Source of Truth" (authority) or a "Default Standard" (focal point) established *outside* the protocol loop.

  3.  **Drafting the Procedure (The "Coordination Sanity Check"):**

      *   *Goal:* Make it actionable.
      *   *Step 1: Dependency Check.* Is this actually a coordination problem? (Do I care what they do, or just what they do *relative* to me?)
      *   *Step 2: Knowledge Level.* Do we need Mutual Knowledge (MK) or Common Knowledge (CK)?
      *   *Step 3: Channel Reliability.* Can we actually achieve the required knowledge level with our transport?
      *   *Step 4: The Infinite Regress.* If CK is needed but channels are unreliable, stop.
      *   *Step 5: The Focal Point/Authority.* If Step 4 stops us, where does the truth come from? (Config, Leader, Standard).
      *   *Step 6: Preference Alignment.* Does everyone *want* to coordinate? (Game Theory check).

      *Refining the Steps for the Prompt:*
      The prompt asks for specific grounding in Lewis/Convention.
      *   *Step 1: Interdependence.* (Lewis condition: preference depends on others' actions).
      *   *Step 2: Epistemic Depth.* (MK vs. CK).
      *   *Step 3: Transport Reality.* (Can the network support the depth?).
      *   *Step 4: The Stop Rule.* (If CK needed + Unreliable -> Design Fail).
      *   *Step 5: The Outsourcing.* (Move the knowledge generation outside the protocol).

  4.  **Running the Procedure on Case 1 (Tie-Break Rule):**

      *   *Interdependence:* Yes. Both want to match.
      *   *Epistemic Depth:* Do they need CK? If Team A picks "Timestamp" and Team B picks "ID", they clash. They need to *know* the other picked "Timestamp". Is it enough that they know, or know that they know? In practice, for a static config, MK is usually enough *if* it's published. But strictly, for a convention to hold, CK is the ideal. However, this is usually solved by *Standardization* (Focal Point).
      *   *Transport:* Config management/Documentation. Reliable enough?
      *   *Verdict:* Don't solve via runtime protocol. Solve via Standard/Authority.

  5.  **Running the Procedure on Case 2 (Ack-Ack Protocol):**

      *   *Interdependence:* Yes. A proceeds only if sure B proceeds.
      *   *Epistemic Depth:* "Sure B proceeds" implies A knows B knows A knows... This is the Two Generals Problem. It requires CK.
      *   *Transport:* Network messages (unreliable).
      *   *Verdict:* Impossible to solve with more messages.
      *   *Action:* Change the requirement. Accept uncertainty (idempotency, sagas) or introduce Authority (Coordinator/Txn Manager).

  6.  **Addressing the "Missing Question":**

      *   The prompt asks to include the question about MK vs. CK and finite handshakes.
      *   *Answer:* No finite handshake creates CK. If the logic requires CK, the protocol is fundamentally flawed for unreliable networks.

  7.  **Structuring the Output:**

      *   **Introduction:** Acknowledge the philosophical roots (Lewis, Two Generals) but keep it brief.
      *   **The Procedure:** "The Coordination & Common Knowledge Check (CCKC)". 5 Steps. Clear Pass/Fail/Handoff.
      *   **Case Study 1:** Tie-Break Rule.
      *   **Case Study 2:** Ack-Ack Protocol.
      *   **Limitations:** What this doesn't solve (Business logic, malicious actors, etc.).

  8.  **Refining the Content (Self-Correction during drafting):**

      *   *Critique:* Is "Common Knowledge" too abstract for engineers?
      *   *Fix:* Define it operationally. MK = "I know X". CK = "I know you know I know X..." indefinitely.
      *   *Critique:* The prompt asks to specify where it hands off to authority.
      *   *Fix:* Make Step 5 explicitly about "Externalizing the Truth".
      *   *Critique:* Ensure the "30-minute review" constraint is met.
      *   *Fix:* Keep steps binary (Yes/No).
      *   *Critique:* The prompt specifically asks about the "finite confirmation handshakes".
      *   *Fix:* Ensure Step 3 explicitly cites the "Two Generals Problem" impossibility result.

  9.  **Final Polish:**

      *   Check tone: Professional, direct, no fluff.
      *   Check constraints: Did I answer the specific question about whether specs can manufacture CK? (Yes, say "No").
      *   Check the "What this cannot decide" section.

  10. **Final Review against Prompt:**
      *   Procedure grounded in philosophy? Yes (Lewis/Convention).
      *   Steps in order? Yes.
      *   Pass/Fail/Handoff criteria? Yes.
      *   MK vs CK question included? Yes.
      *   Finite handshake issue addressed? Yes.
      *   Case 1 & 2 run? Yes.
      *   Plain language on Case 2 failure? Yes.
      *   Limitations section? Yes.

  (Proceed to generate output based on this thought process.)
answer: |-
  # The Coordination & Common Knowledge Check (CCKC)

  **Purpose:** To determine if a proposed coordination mechanism is theoretically viable or if it relies on achieving impossible epistemic states (Common Knowledge) over unreliable channels.
  **Timebox:** 30 Minutes.
  **Audience:** Engineering Design Review.
  **Theoretical Basis:** David Lewis (Convention), Halpern & Moses (Distributed Knowledge), The Two Generals Problem.

  ---

  ## The Procedure

  Run these five steps in order. If any step returns **NO**, follow the **Action** column. Do not proceed to the next step until the Action is resolved.

  | Step | Question | Pass Condition | Fail Action |
  | :--- | :--- | :--- | :--- |
  | **1. Interdependence** | Does Party A's optimal outcome depend on Party B's action, *and* does Party B's depend on A's? (Is this a coordination game, not just a dependency?) | **YES:** Both prefer to match/conform if the other does. | **HANDOFF:** This is a standard API contract or data dependency. Treat as ordinary engineering. Stop. |
  | **2. Epistemic Depth** | To safely proceed, does Party A need to know that Party B knows that Party A knows... (indefinitely)? Or is "I know you know" (finite depth) sufficient? | **MUTUAL KNOWLEDGE:** Finite depth (e.g., "I know you got the message").<br>**COMMON KNOWLEDGE:** Infinite depth (e.g., "We both know we agree"). | **HANDOFF:** If **Common Knowledge** is required, go to Step 3. If Mutual Knowledge is sufficient, go to Step 4. |
  | **3. The Impossibility Check** | Are the communication channels between parties unreliable (packet loss, timeouts, crashes)? | **YES:** Channels are unreliable (standard network).<br>**NO:** Channels are physically atomic/reliable (e.g., shared memory, hardware bus). | **STOP:** If **Common Knowledge** is required + **Unreliable Channels**, the protocol **cannot work** via messaging. You must externalize the truth (see Step 5). |
  | **4. The Finite Handshake** | If Mutual Knowledge is sufficient, does the protocol terminate after a fixed number of messages? | **YES:** Protocol ends after $N$ messages. | **PASS:** Engineering implementation detail. Ensure timeouts/retries handle the $N$ messages. Stop. |
  | **5. Externalizing Truth** | Since messaging cannot create Common Knowledge, is there a Focal Point or Designated Authority that establishes the rule *outside* the message loop? | **YES:** Config, Leader Election, Standard Spec, or Single Writer. | **PASS:** The coordination is solved by authority, not protocol. Document the authority. Stop.<br>**NO:** **FAIL.** The design relies on magic. Redesign required. |

  ---

  ## The Missing Question: Mutual vs. Common Knowledge

  You suspected a distinction between "what we know" and "what we know that we know." Here is the operational definition for your reviews:

  *   **Mutual Knowledge (MK):** I know $X$, and you know $X$.
      *   *Engineering Equivalent:* Delivery Acknowledgement. I sent the packet; I got a 200 OK. I know you have it. You know you have it.
  *   **Common Knowledge (CK):** I know $X$, you know $X$, I know that you know $X$, you know that I know $X$... *ad infinitum*.
      *   *Engineering Equivalent:* Consensus on State. We both know we are in sync, and we both know that we both know it, so neither of us will ever revert.

  **The Hard Truth:** No finite sequence of messages over an unreliable channel can generate Common Knowledge. This is the **Two Generals Problem**. If your logic requires CK (Step 2), adding more "ack-of-ack" messages (Step 3) will never solve it. It only increases the probability of MK, it never reaches CK.

  **What to do:** If CK is required, you must stop trying to build it with messages. You must **outsource** the CK to a Focal Point (a standard everyone reads) or a Designated Authority (a leader who decides). The specification document cannot manufacture CK; only a shared external reference can.

  ---

  ## Case Study 1: The Tie-Break Rule

  **Scenario:** Team A and Team B write to a shared resource. Conflicts are rare. Either "Last-Writer-Wins" (LWW) or "High-ID-Wins" (HIW) is fine, provided both use the same one.

  **Running the CCKC:**

  1.  **Interdependence:** **YES.** If A uses LWW and B uses HIW, data corrupts. Both prefer to match.
  2.  **Epistemic Depth:** **COMMON KNOWLEDGE.** It is not enough that A knows the rule. A must know B knows the rule, and B must know A knows B knows the rule. If A suspects B might be using the old rule, A cannot safely write.
  3.  **Impossibility Check:** **YES (Unreliable).** Communication is via documentation, Slack, or config push (all potentially delayed or lost).
  4.  **Finite Handshake:** N/A (Stopped at Step 3).
  5.  **Externalizing Truth:** **REQUIRED.**
      *   *Solution:* Do not negotiate this at runtime. Do not rely on a handshake.
      *   *Action:* Establish a **Focal Point**. The rule is hardcoded in the shared library version 2.0, or mandated by the Architecture Lead in a signed RFC.
      *   *Result:* **PASS**, provided the rule is enforced by a shared dependency or authority, not by runtime negotiation.

  **Verdict:** The coordination is valid *only if* the rule is established outside the protocol (e.g., a shared library version bump). If teams try to negotiate the rule via a handshake at deploy time, the design **FAILS** at Step 3.

  ---

  ## Case Study 2: The Ack-Ack Protocol

  **Scenario:** Service A will only commit a transaction if it is *sure* Service B will also commit. Service B requires the same assurance. They begin bolting on confirmations: A sends Prepare, B sends Ack, A sends Ack-of-Ack...

  **Running the CCKC:**

  1.  **Interdependence:** **YES.** A's payoff (committing safely) depends on B's action.
  2.  **Epistemic Depth:** **COMMON KNOWLEDGE.** A proceeds only if "sure B will proceed." For B to proceed, B must be sure A is sure. This infinite regress is the definition of Common Knowledge.
  3.  **Impossibility Check:** **YES (Unreliable).** Network messages can be dropped.
  4.  **Finite Handshake:** **NO.** The protocol attempts to solve CK with finite messages.
  5.  **Externalizing Truth:** **NO.** The design attempts to generate certainty purely through bilateral messaging.

  **Verdict:** **FAIL.**
  **Plain Language:** This cannot be made to work by adding messages. You can add 100 acknowledgements, but there is always a non-zero probability the last one was lost, leaving one party uncertain.
  **Direction:** You must change the requirement.
  1.  **Accept Uncertainty:** Use Idempotency and Sagas. Allow A to commit, and if B fails later, run a compensating transaction.
  2.  **Introduce Authority:** Use a Two-Phase Commit (2PC) coordinator. The Coordinator is the **Designated Authority** (Step 5). A and B do not need to know what the *other* knows; they only need to obey the Coordinator. The Coordinator absorbs the uncertainty.

  ---

  ## What This Procedure Cannot Decide

  This procedure is a filter for theoretical viability, not a complete design tool. It cannot decide:

  1.  **Performance Trade-offs:** It will tell you 2PC is viable (via Authority), but not whether the latency cost is acceptable for your SLA.
  2.  **Malicious Actors:** It assumes parties are cooperative (coordination problems), not adversarial (Byzantine faults). If a team might lie about their state, you need cryptography/consensus (PBFT), not just convention.
  3.  **Business Logic Preferences:** It identifies when a decision must be handed to an Authority (Step 5), but it cannot tell you *which* rule the Authority should pick (e.g., LWW vs. HIW). That remains a product decision.
  4.  **Implementation Complexity:** It validates the epistemic model, not the code. A design can pass CCKC and still be unmaintainable spaghetti.

  **Sign-off:**
  If a design fails Step 3 (Impossibility Check), do not approve the PR. Require a redesign that either lowers the epistemic requirement (accepts uncertainty) or externalizes the truth (introduces authority/standards).
