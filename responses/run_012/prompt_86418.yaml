  70-90: Debrief.
  Stop them firmly at minute 70, even if they haven't "solved" it. The frustration is the data. If they claim success, ask them to prove it on the board. Most will stall at Criterion 3. Use the final 20 minutes to unpack the mathematical wall they hit. Ensure you keep an eye on the clock during the Criterion 3 phase.

  - **What I should expect to see happen** (~150 words):
  Initially, groups will optimize for simple accuracy, picking thresholds that maximize correct classifications. When Criterion 1 arrives, they will adjust thresholds per group to match outcome proportions within score bins. Criterion 2 forces them to lower thresholds for the lower-base-rate group to match false positive rates, breaking calibration. When Criterion 3 arrives, the math breaks. You will see them recalculating counts repeatedly, accusing the handout of errors, or trying to merge groups. The mood shifts from engineering puzzle to ethical impasse. They will feel the squeeze: satisfying two criteria violates the third. Some will try to game the score granularity.

  - **The debrief** (~300 words):
  Gather everyone. Ask who satisfied all three. When none raise hands, reveal the impossibility theorem. Explain that Calibration ensures individual fairness: a risk score must mean the same thing regardless of group membership. Equal Error Rates ensure group fairness: the burden of mistakes must be shared equally. The conflict arises solely because Group A and B have different base rates (30% vs 15%). You cannot have equal error rates and calibration unless base rates match.
  **The Twist:** Reveal that the Outcome column was a noisy proxy, measured with higher error for Group B. A rule satisfying all criteria on the proxy might still be unfair on the true construct. This compounds the impossibility: even if you could satisfy the math, the ground truth is shaky. Optimizing for proxy fairness can hide construct unfairness.
  **Escape Hatches:** You must either fix the upstream base rate (social intervention) or choose one criterion to drop (value judgment). Math cannot decide which fairness definition matters; that is a policy choice. Defend your choice explicitly. Dropping calibration means risk scores lie to users. Dropping error balance means one group bears more mistakes. There is no technical fix for a political problem. The noise twist shows that satisfying the math on bad data is dangerous. You must argue for the validity of the construct before optimizing the model. If the construct is flawed, the fairness metrics are meaningless. This is why you cannot outsource ethical decisions to optimization functions.

  - **What goes wrong the first time I run it** (~150 words):
  1. **Coarseness:** A group makes the score binary (0 or 1) to vacuously satisfy constraints. Counter: Require at least three score bins.
  2. **Moralizing:** A student refuses to build the tool. Counter: Acknowledge validity, but insist on analyzing the tool that *will* be built regardless.
  3. **Relabeling:** They change the Outcome column to force base rates equal. Counter: Remind them outcomes are historical facts for this exercise.
  4. **Time:** Criterion 3 consumes too much time. Counter: Give a 5-minute warning before handing out Criterion 3, and enforce the stop time strictly.
  Watch for students trying to average the groups to hide the disparity.

  - **What this activity can't do, that I'll have to supply** (~120 words):
  This activity demonstrates an instance, not a proof. Students might think a smarter score design could solve it; you must assert the theorem holds for any score. It doesn't cover continuous scores or more than two groups, which complicates the tradeoff further. Finally, the game doesn't justify why we'd choose a fair-but-less-accurate tool over an accurate-but-unfair one. You must argue that from the front: accuracy isn't the only virtue, and historical data encodes historical injustice. The activity shows the conflict, not the resolution.
