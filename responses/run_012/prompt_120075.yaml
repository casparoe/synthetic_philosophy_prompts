  ### Brainstorming and Framing

  Before settling on the final proposal, I considered three distinct ways to frame this research problem:

  1.  **The Normative/Political Framing:** This approach would ask whether futarchy is *democratically legitimate* in a small community. It would focus on power dynamics, asking if prediction markets disenfranchise members who lack capital or statistical literacy.
      *   *Rejection:* While important, this is a question of political philosophy, not social choice theory or epistemology. It risks becoming a debate about values rather than the mechanical validity of the decision rule. It doesn't address your specific insight about causal feedback.

  2.  **The Empirical/Behavioral Framing:** This approach would propose running a simulated co-op experiment to see if participants manipulate markets when they know the outcome determines policy.
      *   *Rejection:* A six-month timeline is too short for rigorous experimental design, recruitment, and data analysis. Furthermore, empirical results often lack generalizability. We need to know *why* it fails theoretically, not just *that* it fails in one instance.

  3.  **The Causal/Structural Framing (Selected):** This approach treats the prediction market as a causal variable within the system it is measuring. It asks whether the epistemic justification for futarchy relies on a hidden assumption that the measurement device does not alter the measured state.
      *   *Selection:* This aligns with your "modularity" intuition. It allows for a determinate theoretical answer (a proof or a set of necessary conditions) within six months. It bridges philosophy of science (measurement), social choice (voting rules), and causal inference.

  ***

  # Research Proposal: The Modularity Constraint in Futarchic Governance

  **Project Title:** Causal Feedback and the Epistemic Limits of Futarchy in Small-Scale Governance
  **Duration:** Six Months
  **Field:** Philosophy of Social Science / Social Choice Theory

  ### 1. Introduction and Problem Statement

  Futarchy proposes that communities should "vote on values, bet on beliefs." In this system, policy decisions are determined by prediction markets estimating the future welfare outcomes of those policies. The standard justification is epistemic: market prices aggregate dispersed information more efficiently than voting or deliberation, thereby selecting the policy with the highest expected utility.

  However, this justification relies on a specific view of the market as a passive measuring device. In large, open economies, a single prediction market may be too small to influence the underlying fundamentals it tracks. But in small-scale governance contexts—such as a 40-member housing cooperative, a small non-profit, or a decentralized autonomous organization (DAO)—the market is not external to the system. It is an internal communication channel that alters incentives, expectations, and behaviors.

  Consider the housing cooperative scenario: If a market predicts that "Building the Workshop" yields high welfare, that prediction itself may encourage workshop proponents to work harder (a self-fulfilling prophecy) or cause roof-proponents to disengage (a self-defeating prophecy). Conversely, the mere existence of the market might polarize the group, lowering overall welfare regardless of the policy chosen.

  This creates a causal loop: The market price influences the outcome, but the market price is supposed to reflect the outcome independent of the price. Your intuition identifies this as a failure of **modularity**: the assumption that the forecasting mechanism is causally separate from the target system. If this assumption fails, the market price no longer represents an unbiased expectation of welfare, but rather an equilibrium of a game where traders profit from shaping reality.

  Current literature on futarchy largely ignores this feedback loop. Proponents assume liquid, deep markets where individual traders are price-takers. Critics focus on manipulation by bad actors or the difficulty of defining welfare metrics. Neither side adequately addresses the structural problem of *endogenous feedback* in small-N systems. This project aims to formalize this "feedback problem" and determine whether futarchy can be salvaged under these conditions.

  ### 2. Precise Statement of the Research Question

  The central research question is:

  **Is causal modularity between the prediction mechanism and the policy outcome a necessary condition for the epistemic justification of futarchy, and if so, does any feasible modification to the decision rule preserve validity in the presence of causal feedback?**

  This question is designed to have a determinate answer. It is not asking "Is futarchy good?" but rather "Does the mathematical/philosophical justification hold when assumption X is violated?" The project will seek to prove either:
  1.  **The Impossibility Result:** That without causal modularity, the market price cannot converge to the true expected welfare, rendering the decision rule epistemically bankrupt.
  2.  **The Adjustment Condition:** A specific set of constraints (e.g., subsidization rules, market closure times, or modified scoring rules) under which the mechanism remains valid despite feedback.

  ### 3. Why Existing Positions Leave This Open

  To justify this independent study, we must identify the gap in current theoretical discourse.

  **The Standard Defense:** Proponents of futarchy argue that market incentives align truth-telling with profit. If a trader knows a policy will fail, they short the market. This defense assumes the truth is "out there" to be found. It treats the policy outcome as a function of external variables (weather, economic trends) rather than internal psychological states influenced by the market price itself. It fails to account for *performativity*, where the theory describing the system changes the system's behavior.

  **The Standard Objection:** Critics typically argue that welfare is unmeasurable, or that wealthy members will manipulate the market to suit their preferences. While valid, these are implementation hurdles, not structural flaws. A manipulation argument assumes there is a "correct" price that is being distorted. My proposed research questions whether a "correct" price *exists* when the trading activity itself shifts the probability distribution of the outcome.

  **The Gap:** Neither side addresses the *causal structure* of the measurement. In philosophy of science, a measurement is valid only if the instrument does not significantly perturb the system (the observer effect). In social choice, we assume voting reveals preferences but does not create them. Futarchy breaks this symmetry. The existing literature lacks a formal model that integrates causal inference with mechanism design in this specific context. This project fills that gap by treating the prediction market as a causal intervention rather than a passive observation.

  ### 4. Methodology: A Six-Month Plan

  This project will use conceptual analysis combined with formal modeling. We will not conduct surveys or simulations, as the problem is structural, not empirical. We need to determine what is *possible* in principle, not just what is probable in practice.

  **Month 1: Formalizing the Modularity Assumption**
  *   **Task:** Define the standard futarchy model using causal graphs (Directed Acyclic Graphs).
  *   **Action:** Map the causal pathway from Policy → Outcome → Welfare. Identify where the Market Price enters this graph in the standard model (usually as a parallel indicator).
  *   **Goal:** Produce a formal definition of "Causal Modularity." This will define the baseline condition where the market price has no causal arrow pointing to the Outcome or Welfare variables.

  **Month 2: Modeling the Feedback Loop**
  *   **Task:** Introduce endogenous feedback into the model.
  *   **Action:** Add a causal arrow from Market Price → Member Behavior → Outcome. Incorporate game-theoretic elements where traders anticipate that their trades influence the price, which influences the policy, which influences the outcome.
  *   **Goal:** Create a "Feedback Model" of futarchy. This will likely resemble models of reflexive markets or Keynesian beauty contests, but applied to policy selection.

  **Month 3: Analyzing Equilibrium Conditions**
  *   **Task:** Determine if a "truthful" equilibrium exists in the Feedback Model.
  *   **Action:** Analyze whether traders can profit by betting on the true expected welfare, or if the profit-maximizing strategy is to bet on the outcome they can *cause* to happen.
  *   **Goal:** Identify if the market price decouples from expected welfare. If the price reflects "causal power" rather than "predictive accuracy," the epistemic justification fails.

  **Month 4: Testing Modifications (The Salvage Attempt)**
  *   **Task:** Explore mechanism design adjustments to restore validity.
  *   **Action:** Model variations such as:
      *   *Subsidized Losses:* Paying traders even if the policy fails, to reduce the incentive to sabotage.
      *   *Blind Markets:* Markets that resolve after the policy is implemented but do not determine the policy (decoupling).
      *   *Counterfactual Markets:* Markets that bet on what *would* have happened, though this is notoriously difficult to resolve.
  *   **Goal:** Determine if any modification breaks the feedback loop without destroying the incentive to trade.

  **Month 5: Synthesis and Theorem Drafting**
  *   **Task:** Consolidate findings into a coherent argument.
  *   **Action:** Draft the core theoretical result. This will likely be a conditional statement: "If feedback strength exceeds threshold X, then price accuracy degrades by factor Y."
  *   **Goal:** A draft of the final paper or report containing the formal proofs and philosophical interpretation.

  **Month 6: Review and Refinement**
  *   **Task:** Stress-test the results against counter-examples.
  *   **Action:** Review the model against edge cases (e.g., unanimous agreement, zero-liquidity scenarios). Refine the language for a philosophical audience.
  *   **Goal:** Finalize the research paper suitable for submission to a journal in philosophy or social choice.

  **Why this approach?**
  Surveys would only tell us how people *feel* about futarchy, not whether the mechanism works. Simulations would require arbitrary parameter choices that could be challenged. Formal modeling allows us to prove impossibility results or necessary conditions that hold regardless of specific psychological parameters. It is the only method capable of answering the "Under what conditions..." question with certainty.

  ### 5. Success and Failure Conditions

  **Successful Result:**
  The project succeeds if it produces a formal proof or a rigorous logical argument that definitively categorizes the relationship between feedback and validity. Specifically, success looks like:
  1.  A clear definition of the "Modularity Assumption."
  2.  A demonstration that standard futarchy violates this assumption in small-N systems.
  3.  A determination of whether this violation is fatal (impossibility result) or fixable (mechanism design solution).
  Even a negative result (proving that futarchy cannot work in small groups due to feedback) is a success, as it provides a decisive theoretical boundary for the technology.

  **Project Failure:**
  The project would fail if the problem proves to be ill-defined. For example, if "welfare" cannot be formalized sufficiently to model the causal links, the mathematical model will collapse. Another failure mode is if the feedback effects are shown to be negligible in all plausible scenarios, rendering the research question moot (though your co-op example suggests this is unlikely). Finally, if the solution requires information that is logically inaccessible (e.g., knowing the counterfactual outcome with certainty), the project may conclude that no solution exists, which is a theoretical success but a practical dead-end.

  ### 6. Scope and Limitations

  **Scope:**
  This research is theoretical. It will not produce a software platform or a policy guide for your specific co-op. It focuses on the *class* of small-scale governance problems. The "small-scale" definition will be bounded by the point at which individual traders can influence market prices significantly.

  **Limitations:**
  1.  **Welfare Definition:** The model must assume a definable welfare metric. If welfare is fundamentally subjective or incommensurable, the model rests on a simplification. I will acknowledge this but proceed with a standard utility function for the sake of analysis.
  2.  **Rationality Assumptions:** The game-theoretic models will assume rational actors. Real humans may be irrational in ways that mitigate or exacerbate the feedback problem. The conclusions will hold for rational agents, with caveats applied to behavioral realities.
  3.  **Time:** Six months is sufficient for a theoretical framework but not for a comprehensive survey of all possible market mechanisms. I will focus on the standard continuous double auction model used in most futarchy proposals.

  ### 7. Significance

  This research matters because governance technology is outpacing governance theory. As more organizations adopt algorithmic or market-based decision-making, we risk importing mechanisms designed for large, liquid financial markets into small, tightly coupled social systems. If the modularity assumption is indeed necessary, then applying futarchy to small co-ops, DAOs, or community boards is not just risky—it is category error. Clarifying this boundary protects communities from adopting tools that are structurally unsound for their context. Conversely, if a modification can be found, it could unlock safer ways to use prediction markets for public good.

  ***

  ### Confidence and Uncertainty

  **Confidence Level:**
  I am **highly confident** (85%) in the central claim that standard futarchy relies on a causal modularity assumption that is violated in small-scale governance. The logic follows directly from causal inference principles: if the measurement affects the measured, the measurement is biased. The co-op example is a textbook case of this violation.

  **Least Sure Point:**
  I am **least sure** (40% confidence) about the possibility of a "fix." It is unclear whether a mechanism design adjustment (like subsidization or modified scoring rules) can fully decouple the incentive to manipulate from the incentive to predict without destroying market liquidity. It is possible that the only solution is to abandon futarchy for small groups entirely, but I want to leave the door open for a novel mechanism design solution during the research. Proving a negative (that *no* fix exists) is significantly harder than proving a positive (that *this* fix works).
