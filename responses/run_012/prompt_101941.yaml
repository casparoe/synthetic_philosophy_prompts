prompt: |-
  I'm a backend and distributed-systems engineer by trade, and the vocabulary I actually think in is schemas and primary keys, foreign-key constraints, transactions and isolation levels, replication and replica divergence, snapshots, and the practical question of when two database states ought to count as one state rather than two states that merely answer the same queries — a question I once spent an embarrassing week on, chasing a replication discrepancy that turned out to be nothing but a different assignment of surrogate keys. I've been reading about the hole argument in the philosophy of physics, and I have a nagging suspicion that the whole thing is something my world already has machinery for, so what I want from you is a careful translation and not a summary. Take the substantivalist/relationalist dispute as the hole argument generates it — a model of the theory, a diffeomorphism that is the identity everywhere outside some bounded region and a nontrivial rearrangement of the points inside that region, the resulting second model that satisfies the same equations and agrees with the first on everything outside the region, and the worry that if the points themselves are real individuals then these are two genuinely different worlds, so the laws plus everything outside the region fail to determine what happens inside. Restate the positions and the argument in my vocabulary as faithfully as you can, using whatever of schemas, keys, indexes, snapshots, and isomorphism-of-tables does the work, and resist flattering the translation: if the cleanest database reading makes the dispute look like an obvious confusion on one side, say so, and then say where that reading was doing illicit work.

  Then give me the residue report, which is the part I actually care about. Which parts survive the translation intact — for instance, is the claim that two models related by a mere relabeling are one possibility exactly the claim that two databases related by a bijection on their keys are one state, or does something about physical possibility get dropped in transit? Which parts survive only under distortion? And which parts have no counterpart at all in my vocabulary — I'm thinking of anything about the primitive identity of points across possible worlds, of the question whether a diffeomorphism is a gauge redundancy or a physical symmetry, and of the fact that in my world a schema always supplies the identity criteria for its rows in advance, whereas in the physics the identity of the points is precisely what is in dispute. Finally, tell me which way the residue cuts: is the leftover a genuine defect of my vocabulary, something about modality or about individuals that databases simply cannot express, or is it evidence that the philosophers' formulation smuggled in a metaphysical premise that only looks forced because of the words they chose? No reading lists or citations, please — I want the translation and the residue, not a bibliography.
