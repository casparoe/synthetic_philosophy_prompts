  1. Individual actors include Schabowski, the guards, Jäger, and the crowd, while macro-level facts include the regime's authority and the travel regulations. Describing the regime's authority as "evaporated" risks begging the question by presupposing a macro-property rather than a pattern of individual compliance.
  2. The causally decisive factors were Schabowski's specific misstatement and Jäger's individual choice to raise the barrier without superior authorization. Counterfactually, without that specific broadcast or Jäger's discretion, the crossing would not have occurred that night, regardless of broader social pressures.
  3. Macro facts function here as inputs into practical reasoning, since Jäger acted on the perceived collapse of regime authority rather than merely aggregating individual behaviors. Here downward causation earns its keep because the structural constraint of evaporating authority enabled the individual decision rather than just summarizing it.
  4. The individualist struggles to explain why superiors refused responsibility without invoking the macro-status of the regime, while the holist struggles to account for the precise timing driven by Schabowski's off-the-cuff remark. Each side leaves a gap: the former on the origin of discretionary power, and the latter on the contingency of the triggering event.
  5. The episode suggests methodological individualism is a thesis about the ontology of causes while its critics are making a point about the structure of explanations, and that these can come apart. It points to a refinement where macro-facts are ontologically reducible but explanatorily indispensable as premises in practical reasoning.
