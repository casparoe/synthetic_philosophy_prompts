answer: |-
  # Diagnostic Decision Tree: The Logical Space of Interpersonal Comparison

  **Instructions:** Start at Node 1. Answer the question based on your theoretical commitments regarding welfare. Follow the branch corresponding to your answer. Nodes 1–4 map the formal information structure (Measurability and Comparability); Nodes 5–7 map the substantive ground and ontology; Node 8 maps the aggregation rule. Where distinct named positions share the same logical path, they are listed together with a flag.

  **Node 1: Intra-personal Measurability**
  For a single individual, do differences between states carry information beyond the ranking of those states (i.e., is the magnitude of a gain meaningful)?
  *   **No:** Go to Node 2A (Ordinal Framework).
  *   **Yes:** Go to Node 2B (Cardinal/Ratio Framework).

  **Node 2A: Inter-personal Level Comparability (Ordinal Branch)**
  Given only ordinal rankings for each person, can we judge whether Person A is better off than Person B in a given state?
  *   **No:** Go to Node 5 (Non-Comparable).
  *   **Yes:** Go to Node 4A (Level-Comparable).

  **Node 2B: Inter-personal Unit Comparability (Cardinal Branch)**
  Given cardinal utilities for each person, can we judge whether Person A's gain is larger than Person B's gain?
  *   **No:** Go to Node 3 (Cardinal Non-Comparable).
  *   **Yes:** Go to Node 4B (Unit-Comparable).

  **Node 3: Individual Risk Only**
  *   **Leaf:** **Bayesian Decision Theory / VNM Individual.**
      *   *Awkward Commitment:* You possess a rigorous theory of rational choice under risk but must treat social welfare as a metaphor, as no arithmetic can be performed across persons.

  **Node 4A: Natural Zero Point (Ordinal Level-Comparable)**
  Is there a natural zero point (e.g., a specific threshold of primary goods or functionings) that allows for ratio statements, or is the scale interval?
  *   **Interval (No Natural Zero):** Go to Node 6 (Objective/Primary Goods).
  *   **Ratio (Natural Zero):** Go to Node 6 (Capability with Thresholds).

  **Node 4B: Natural Zero Point (Cardinal Unit-Comparable)**
  Is there a non-arbitrary zero point (e.g., non-existence or neutral existence) common to all persons?
  *   **No (Interval Scale):** Go to Node 7 (Common Unit, No Common Zero).
  *   **Yes (Ratio Scale):** Go to Node 7 (Common Ratio Scale).

  **Node 5: Grounds of Comparison (Non-Comparable)**
  What is the metric based on: mental states, preferences, objective lists, or behavior?
  *   **Preferences/Behavior:** Go to Node 8 (Social Choice).
  *   **Objective/Mental:** Go to Node 8 (Social Choice).
      *   *(Note: Without comparability, the ground does not alter the formal impossibility results.)*
      *   **Leaf:** **Arrow's Impossibility / Ordinal Social Choice.**
          *   *Awkward Commitment:* You must accept that no democratic aggregation rule can satisfy minimal consistency conditions without becoming dictatorial.

  **Node 6: Grounds of Comparison (Level-Comparable)**
  Is the metric defined by objective indices (goods/functionings) or subjective states?
  *   **Objective (Primary Goods/Functionings):** Go to Node 8 (Maximin).
  *   **Subjective (Hedonic/Pref):** Go to Node 8 (Ordinal Utilitarianism).
      *   **Leaf:** **Rawlsian Maximin (Primary Goods).**
          *   *Awkward Commitment:* You must ignore all gains to the better-off even if they are massive, provided the worst-off do not gain.
      *   **Leaf:** **Capability Approach (Basic Orderings).**
          *   *Awkward Commitment:* You must resist converting diverse functionings into a single cardinal index, limiting policy analysis to partial orderings.

  **Node 7: Grounds and Ontology (Unit/Ratio Comparable)**
  Is the metric a psychological fact, an idealized construction (e.g., veil of ignorance), or an "as-if" behavioural device?
  *   **Idealized Construction (Veil/Extended Sympathy):** Go to Node 8 (Contractarian).
  *   **Fact or As-If (Hedonic/WTP/QALY):** Go to Node 8 (Welfarist/Health Econ).
      *   **Leaf:** **Harsanyi's Veil of Ignorance.**
          *   *Awkward Commitment:* You must assume rational agents would ignore their actual identity and risk-aversion to maximize average utility.
      *   **Leaf:** **Quality-Adjusted Life Years (QALYs).**
          *   *Awkward Commitment:* You must treat a year of life in a specific health state as mathematically equivalent across all persons regardless of adaptation or context.

  **Node 8: Aggregation Rule (Cardinal Unit-Comparable)**
  How do we combine comparable units: summing totals, weighting the worse off, maximizing the minimum, or multiplying gains?
  *   **Sum (Linear):** Go to Final Leaves (Utilitarian).
  *   **Weighted Sum (Concave Transformation):** Go to Final Leaves (Prioritarian).
  *   **Maximize Minimum:** Go to Final Leaves (Cardinal Maximin).
  *   **Product (Nash):** Go to Final Leaves (Bargaining).
      *   **Leaf:** **Classical Utilitarianism.**
          *   *Awkward Commitment:* You must accept that a large gain for the well-off can morally outweigh the destruction of the poor, provided the sum increases.
      *   **Leaf:** **Prioritarianism (Worst-off Weighted).**
          *   *Awkward Commitment:* You must claim a gain matters more because of the recipient's absolute level, not because of diminishing marginal utility.
      *   **Leaf:** **Nash Bargaining Solution.**
          *   *Awkward Commitment:* You must accept that social welfare depends on the threat point (status quo), making justice path-dependent.
      *   **FLAGGED OVERLAP:** *Classical Utilitarianism, Prioritarianism, and Nash Bargaining all occupy the Cardinal Unit-Comparable (Interval) cell. They differ only in the aggregation function, not the comparability assumptions.*

  ***

  # The Logical Grid: Measurability vs. Comparability

  **Axes:**
  *   **X (Measurability):** Ordinal | Cardinal (Interval) | Ratio
  *   **Y (Comparability):** Non-Comparable | Level-Comparable | Unit-Comparable | Fully-Comparable (Level + Unit)

  | | **Non-Comparable** | **Level-Comparable** | **Unit-Comparable** | **Fully-Comparable** |
  | :--- | :--- | :--- | :--- | :--- |
  | **Ordinal** | **Occupied:**<br>Arrow's Social Choice.<br>*(Impossibility Theorems)* | **Occupied:**<br>Rawls (Primary Goods).<br>Capability (Partial Orderings). | **Empty:**<br>*Incoherent.*<br>Unit comparison presupposes cardinal differences; cannot compare units if only ranks are meaningful. | **Empty:**<br>*Incoherent.*<br>Full comparability presupposes unit comparability. |
  | **Cardinal (Interval)** | **Occupied:**<br>VNM Individual Theory.<br>*(No interpersonal arithmetic)* | **Unexplored:**<br>*Unattractive.*<br>If differences are measurable within persons, refusing to compare them across persons wastes information without gaining robustness. | **Occupied:**<br>Classical Utilitarianism.<br>Prioritarianism.<br>Nash Bargaining.<br>Harsanyi (Veil). | **Occupied:**<br>Classical Util (with common zero).<br>Harsanyi (with common zero). |
  | **Ratio** | **Occupied:**<br>Individual Risk (QALY within person). | **Empty:**<br>*Incoherent.*<br>Ratio scale implies unit comparability. | **Empty:**<br>*Redundant.*<br>Ratio scale implies full comparability if zero is common. | **Occupied:**<br>Health Economics (QALYs across persons).<br>Some Population Ethics. |

  **Diagnosis of Empty Cells:**
  *   **Ordinal + Unit/Full:** Logically incoherent. One cannot compare magnitudes (units) if the scale admits only monotonic transformations (ordinal).
  *   **Cardinal + Level Only:** Theoretically possible but unattractive. It retains the informational burden of cardinality without the aggregative power of unit comparability.
  *   **Ratio + Level/Unit Only:** Logically incoherent. A ratio scale (natural zero) inherently allows unit comparison; distinguishing them is redundant.

  ***

  Verdict: Can we judge whether Person A's gain is larger than Person B's gain? — This single distinction collapses the social choice impossibility results while simultaneously enabling the aggregation rules that critics find most objectionable.
