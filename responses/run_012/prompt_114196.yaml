answer: |-
  **Setup**
  Two tenants, Ali and Ben, occupy identical units in the same building, pay identical rent, hold identical keys, and possess the physical ability to remain overnight. Both understand their tenure conditions perfectly: Ali holds a fixed-term lease, while Ben occupies at the landlord's discretion, revocable without notice even mid-occupancy. Both choose to sleep in their units tonight (identical achieved functioning), and both hold identical preferences for long-term housing stability, though Ben remains perfectly serene about his precarious status.

  **(a) The Metrics**
  *   **Resources:** Verdict **Equal**. Both hold the same material means (keys, money, physical shelter). The metric counts tangible assets and income flow, neither of which differs here.
  *   **Capabilities:** Verdict **Equal** (on the snapshot reading). Both possess the effective freedom to achieve the functioning "sheltered tonight." The metric counts the current opportunity set; since the door locks and the landlord hasn't acted yet, the capability is present for both.
  *   **Welfare:** Verdict **Unequal**. Ben's expected preference satisfaction is lower because the object of his identical preference (stable housing) is structurally less likely to be sustained over time. The metric counts the satisfaction of preferences (or objective well-being), which is undermined by the risk of revocation even if current happiness is identical.

  **(b) The Working Feature**
  The sole variable is **revocability without cause**. It is not the content of the option (shelter) nor the agent's internal state, but the external durability of the permission granting access. The option exists for Ben only conditionally on the landlord's continued inaction, whereas for Ali it exists independently of immediate whim.

  **(c) Counterfactuals**
  *   **Remove Insecurity:** If Ben is given a lease, all three metrics converge on **Equal/Just**. The case collapses into agreement because the structural vulnerability is removed.
  *   **Insecurity in Head Only:** If Ben has a lease but *believes* he might be evicted (paranoia), Resources and Capabilities remain **Equal**, but Welfare drops to **Unequal**. This shifts the injustice from structural to psychological, altering the case from one about power relations to one about mental states.

  **(d) Capability Theorist Attacks**
  *   **Attack 1 (Security is Internal):** A theorist will argue that security is constitutive of capability, not an add-on. Nussbaum's "Control over One's Environment" explicitly requires political and material protection of choices. If the option can be withdrawn arbitrarily, it wasn't a real capability to begin with.
  *   **Attack 2 (Strawman Operationalization):** They will argue your metric counts *momentary opportunity* rather than *robust freedom*. Sen emphasizes command over resources over time; a freedom that vanishes upon exercise or whim is not effective freedom.
  *   **Honest Assessment:** **Attack 2 lands.** You have built a case against a crude, snapshot operationalization of capability, not the position itself. Sophisticated capability theory accounts for durability and risk; if you define capability as "secure effective freedom," the metric aligns with Welfare and says **Unequal**. To make the case stick, you must argue that standard operationalizations *tend* to measure snapshot access (e.g., in large-N datasets), making the critique empirical rather than theoretical.

  **Constraint Flags**
  *   **Preferences:** The Welfare verdict **requires** that both agents value stability. If Ben did not prefer stability, his welfare would not register a loss. You have not banned this (you banned *difference* in preferences), so the case survives, but it relies on a universal preference for security.
  *   **Serenity/Structure:** If Welfare is defined hedonically (mental states), the case **fails** under Ben's serenity. It only survives if Welfare is defined as **preference satisfaction** (where risk lowers expected satisfaction regardless of mood) or **Objective List** (where security is a good independent of feeling). You must specify a non-hedonic welfare metric, or the loss collapses into anxiety, violating your structural constraint.
