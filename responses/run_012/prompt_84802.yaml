prompt: |-
  I am a retired atmospheric physicist and, since retiring, I have been reading philosophy of science and decision theory. I sit as a lay member on the national scientific advisory council. The council is revising its protocol for cases in which accredited experts disagree after examining the same evidence. Our current rule says that such disagreement is prima facie evidence that at least one expert is irrational, biased, or acting in bad faith, because if the experts had a common prior and their posterior probabilities were common knowledge, those posteriors would have to coincide. The chair now wants to apply the rule to an upcoming assessment of a low-probability, high-consequence risk: two careful experts have reached different conclusions, and the chair proposes to discount the dissenting expert's testimony on the ground that the disagreement itself shows he must have made an error. I am not persuaded, but I need to give the council a written opinion it can act on. Please draft that opinion. It should recommend whether to retain, revise, or abandon the rule, and set out a concrete procedure for the upcoming case with a clear deadline. It should engage the strongest version of the chair's position, explain what the rule assumes about common priors, common knowledge, and rationality, and say what follows when the disagreement concerns the choice of prior itself rather than the updating. It should also address whether the council can legitimately treat a dissenting expert's testimony as evidence of error without first establishing that the relevant assumptions hold. Please write in British English, and keep the opinion suitable for circulation to a non-specialist council.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **User Persona:** Retired atmospheric physicist, reads philosophy of science/decision theory, lay member on a national scientific advisory council.
      *   **Task:** Draft a written opinion for the council regarding a specific protocol rule.
      *   **Context:** The council is revising its protocol for expert disagreement. Current rule: Disagreement = *prima facie* evidence of irrationality/bias/bad faith (based on Aumann's Agreement Theorem).
      *   **Specific Case:** Upcoming assessment of low-probability, high-consequence risk. Two careful experts disagree. Chair wants to discount the dissenter based *only* on the current rule.
      *   **Requirements:**
          *   Recommend retaining, revising, or abandoning the rule.
          *   Set out a concrete procedure for the upcoming case with a deadline.
          *   Engage the strongest version of the Chair's position (Aumann's Agreement Theorem).
          *   Explain assumptions (common priors, common knowledge, rationality).
          *   Address disagreement over priors vs. updating.
          *   Address legitimacy of treating testimony as error without establishing assumptions.
          *   **Tone/Style:** British English, suitable for a non-specialist council (clear, authoritative but accessible).

  2.  **Deconstruct the Scientific/Philosophical Core:**
      *   **The Rule:** It relies on Aumann's Agreement Theorem (1976).
      *   **The Theorem:** If two agents are Bayesian rationalists, share a *common prior*, and their posterior probabilities are *common knowledge*, they cannot agree to disagree.
      *   **The Flaw in Application:** Real-world experts rarely share common priors (especially in high-uncertainty contexts). Their posteriors are rarely common knowledge (they don't know exactly *how* the other processed every piece of data). Rationality is bounded.
      *   **The Chair's Argument:** Disagreement implies a violation of the theorem's conditions. Since we assume experts are rational, the violation must be bias or bad faith.
      *   **The Counter-Argument:** The violation is almost certainly in the *assumptions* (different priors, incomplete information exchange), not necessarily in the *agents' integrity or rationality*. In high-consequence/low-probability risks, priors are inherently subjective (precautionary principle vs. strict evidentialism).
      *   **Recommendation:** Abandon or radically revise the rule. It is scientifically unsound for policy advice.
      *   **Procedure:** Need a method to reconcile or present divergent views without discrediting individuals.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** Clear recommendation (Abandon/Revise) and immediate action for the specific case.
      *   **Introduction:** Acknowledge the Chair's position and the theoretical basis (Aumann). Validate the intent (seeking consensus) but challenge the mechanism.
      *   **The Theoretical Basis (The "Why"):** Explain Aumann's Agreement Theorem simply.
          *   Key conditions: Common Priors, Common Knowledge of Posteriors, Perfect Rationality.
          *   Why these fail in practice: Experts have different training/experience (different priors). They don't have access to each other's full mental models (not common knowledge).
      *   **The Specific Case (Low-Probability, High-Consequence):**
          *   This is where priors matter most. One expert might weight tail risks higher (precautionary). This isn't irrational; it's a value-laden scientific judgment.
          *   Discounting testimony based solely on disagreement is procedurally unfair and epistemically risky.
      *   **Legitimacy & Burden of Proof:** Can we assume error? No. The burden lies on showing *why* the assumptions hold, not assuming they do.
      *   **Recommendation on the Rule:** Abandon the current formulation. Replace with a protocol for "Structured Expert Judgement" or "Divergence Analysis."
      *   **Procedure for the Upcoming Case:**
          *   Don't discount.
          *   Facilitate a structured dialogue (identify source of divergence: data, model, or prior?).
          *   Report both views with reasoning.
          *   Deadline: Needs to be tight but realistic.
      *   **Conclusion:** Reiterate the value of dissent in science.

  4.  **Refining Tone and Language (British English):**
      *   Use "programme," "centre," "modelling," "prioritise."
      *   Tone should be respectful but firm (collegial but authoritative).
      *   Avoid overly dense jargon where possible, or explain it (e.g., explaining "common prior").
      *   Ensure the distinction between "irrationality" and "different starting assumptions" is clear.

  5.  **Self-Correction/Review during Drafting:**
      *   *Check:* Did I address the "common knowledge" aspect? *Yes, need to emphasize that experts don't actually know each other's full posteriors derivations.*
      *   *Check:* Did I address the "prior vs. updating" distinction? *Yes, crucial for high-consequence risk.*
      *   *Check:* Is the deadline concrete? *Need to propose a specific timeframe.*
      *   *Check:* Is the recommendation clear? *Abandon the rule, adopt a new process.*
      *   *Check:* Is it suitable for non-specialists? *Keep the math light, focus on the logic.*
      *   *Check:* Did I engage the Chair's position strongly? *Acknowledge that the theorem is mathematically sound, but its application here is category error.*

  6.  **Final Polish:** Check for flow and clarity. Ensure the distinction between the *general rule* and the *specific case* is managed well. (The opinion should solve the immediate problem while fixing the long-term policy).

  *(Self-Correction Note)*: I need to make sure I don't sound like I'm attacking the Chair personally. Frame it as "The Chair's interpretation is theoretically elegant but practically inapplicable." Also, ensure the "lay member" persona comes through—bridging the gap between high theory and practical governance.

  7.  **Final Output Generation** (Proceeding to draft based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** The National Scientific Advisory Council
  **FROM:** [Your Name], Lay Member
  **DATE:** 24 May 2024
  **SUBJECT:** Opinion on the Protocol for Expert Disagreement and Immediate Procedure for the Upcoming Risk Assessment

  **1. Executive Summary**

  The Council is currently asked to apply a standing rule which treats expert disagreement as *prima facie* evidence of irrationality, bias, or bad faith. This rule is derived from a specific theorem in decision theory (Aumann's Agreement Theorem). While the theorem is mathematically sound, its application to real-world scientific advisory contexts is fundamentally flawed.

  I recommend that the Council **abandon the current rule** and adopt a revised protocol that treats disagreement as a signal to investigate divergent assumptions rather than individual error. Regarding the upcoming assessment of low-probability, high-consequence risk, I advise that the Chair's proposal to discount the dissenting expert's testimony be **rejected**. Instead, the Council should commission a structured analysis of the sources of disagreement. A final report incorporating both views should be submitted within **four weeks**.

  **2. The Theoretical Basis: Engaging the Chair's Position**

  The Chair's position rests on a robust interpretation of Bayesian rationality. The argument is as follows: if two experts are rational, share the same initial assumptions (a 'common prior'), and know each other's final conclusions (posteriors are 'common knowledge'), they cannot logically arrive at different conclusions. Therefore, if they do disagree, at least one must be violating the conditions of rationality.

  This reasoning relies on Aumann's Agreement Theorem (1976). I acknowledge the elegance of this position. It appeals to our desire for consensus and objective truth. If the conditions of the theorem held in our proceedings, the Chair would be correct: disagreement would indeed imply error.

  However, for the theorem to apply, three strict conditions must be met:
  1.  **Common Priors:** The experts must have started with identical beliefs before seeing the specific evidence.
  2.  **Common Knowledge:** The experts must fully understand not just *what* the other concludes, but *how* they derived it, effectively sharing the same information set.
  3.  **Perfect Rationality:** The experts must process information without cognitive bounds or error.

  **3. Why the Rule Fails in Practice**

  In the context of national scientific advice, particularly regarding high-consequence risks, these conditions are rarely, if ever, met.

  *   **The Problem of Priors:** Experts do not arrive as blank slates. Their 'priors' are shaped by their specific disciplinary training, past case studies, and methodological preferences. In low-probability, high-consequence scenarios (such as pandemic preparedness or catastrophic climate thresholds), the choice of prior is often the most critical variable. One expert may adopt a 'precautionary' prior (weighting tail risks heavily), while another adopts an 'evidential' prior (weighting only observed frequencies). This is not irrationality; it is a legitimate divergence in scientific judgement regarding how to handle uncertainty.
  *   **The Problem of Common Knowledge:** Experts on this Council do not have access to each other's full mental models. They exchange summaries, not raw cognitive processing. Therefore, their posteriors are not 'common knowledge' in the strict sense required by the theorem.
  *   **The Problem of Rationality:** We assume our experts are *competent*, not logically perfect. Bounded rationality is a feature of human cognition, not a bug.

  **4. Legitimacy and the Burden of Proof**

  The Council cannot legitimately treat a dissenting expert's testimony as evidence of error without first establishing that the relevant assumptions (common priors, common knowledge) hold. To do so reverses the burden of proof.

  Currently, the rule assumes the theorem's conditions are met and demands the expert prove they are not biased. This is procedurally unsound. The burden should lie on the Council to demonstrate that the disagreement stems from malfeasance or logical failure, rather than assuming it does. To discount testimony solely on the ground of disagreement is to privilege consensus over accuracy. In the history of science, dissenting views have frequently proven correct precisely because they challenged the 'common prior' of the majority.

  **5. Recommendation on the Standing Rule**

  I recommend the Council **abandon the current rule** immediately. It creates a perverse incentive for experts to suppress genuine uncertainty to avoid accusations of bias. It risks groupthink and reduces the robustness of our advice.

  **Proposed Replacement Protocol:**
  In cases of accredited expert disagreement, the Council shall:
  1.  Classify the disagreement as 'Structural' (divergent models/priors) or 'Evidential' (interpretation of data).
  2.  Require a joint statement from the disagreeing parties identifying the specific source of divergence (e.g., 'Expert A weights Model X higher due to physical constraints; Expert B weights Model Y due to historical fit').
  3.  Present the range of conclusions to the government, accompanied by the reasoning for the variance, rather than a single false consensus.

  **6. Procedure for the Upcoming Case**

  Regarding the immediate assessment of the low-probability, high-consequence risk, discounting the dissenting expert would undermine the credibility of the Council. The stakes are too high to exclude valid alternative interpretations of the risk landscape.

  **Action Plan:**
  1.  **Retain Both Experts:** Both experts shall continue to contribute to the working group.
  2.  **Structured Dialogue:** The Secretariat will facilitate a one-day workshop between the two experts. Their task is not to force agreement, but to produce a 'Divergence Map' documenting exactly where their assessments part ways (e.g., is it the probability of the event, or the magnitude of the consequence?).
  3.  **Reporting:** The final assessment must present the majority view and the minority view side-by-side, with the Divergence Map attached.
  4.  **Deadline:** The Divergence Map is to be completed within **14 days**. The final Assessment Report is to be submitted to the Council within **28 days** (four weeks) from today.

  **7. Conclusion**

  We are advisors, not arbiters of logical perfection. Our value lies in capturing the nuance of scientific uncertainty, not in masking it behind a theorem that assumes away the very complexities we are paid to assess. By revising this rule, we protect the integrity of our experts and the quality of our advice.

  I move that the Council adopts this opinion and instructs the Secretariat to adjust the protocol accordingly.

  Signed,

  [Your Name]
  Lay Member, National Scientific Advisory Council
