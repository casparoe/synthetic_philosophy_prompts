prompt: |-
  I'm a machine learning engineer who spends most of his working hours on ensemble methods and on aggregating noisy human labels. The day job is mundane: a batch of annotators, each of whom is right somewhat more often than chance on a given item, and a majority vote at the end. I have a solid working grasp of the folklore here — that correlated annotator errors can survive any amount of voting, that a single systematic bias is fatal in a way that random noise is not, that there is a difference between a base model that is merely better than chance and one that is actually strong, and that a committee can provably converge on a target when the members are independent and each is slightly better than guessing. A friend in a political theory reading group recently handed me the Condorcet jury theorem and the surrounding debate over whether majority rule can be justified on the grounds that a large electorate of moderately competent voters is overwhelmingly likely to reach the correct answer. Reading it, I kept feeling that I already implement this. I'd like you to take that claim, together with the normative case that has been built on top of it, and restate it as faithfully as you can in the vocabulary I actually use: base learners and their error rates, aggregation rules, the independence or correlation of errors, sample size, weak versus strong learnability, and the precise conditions under which a committee can be shown to converge on the truth. Translate the theorem itself first, then translate the argument that is usually hung on it.

  Then give me the residue report, which is the part I actually want. Which pieces of the philosophical discussion map cleanly onto things I already know, which survive only after being distorted, and which have no counterpart in my vocabulary at all? I'm especially curious about the assumptions the theorem makes that I would never make in practice — the nature of the "correct answer" that is being voted on, what exactly "competence" is a property of, and whether the justification of majority rule is doing any work that a convergence result does not. For each piece of residue, tell me whether you think it exposes something my vocabulary is missing or whether it shows that the original claim was vaguer than it sounded. I would rather you keep the two vocabularies honest than force a tidy correspondence, and where the translation fails I want to know exactly where it fails and why.

  One last thing about how I'd like you to handle confidence. Please separate what is genuinely settled among people who study this — the mathematics of the theorem under its stated assumptions, say — from what is actually contested, such as whether the theorem lends support to any particular form of government or to any general claim about the wisdom of crowds. Do not present a contested interpretation as though it were the consensus, and flag it whenever a step in your translation depends on a reading that specialists dispute.
