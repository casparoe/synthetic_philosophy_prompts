      (Drafting content...)
      Good evening members of the honor council, faculty, parents, and fellow students. We are gathered here to vote on a policy that defines how our community responds to academic dishonesty, and while we all share the goal of fostering integrity, I have serious concerns about the philosophical coherence of the proposed sanction language. The preamble states that the goal is for the student to own the self that produced the act, and the operative clause requires a character remediation plan alongside a public affirmation that the student has chosen to become a person of integrity. This language assumes a level of control over our own identities that simply does not exist. There is a philosophical line of reasoning, often associated with Galen Strawson, which suggests that to be truly responsible for an action, you must be responsible for the way you are that led to that action. However, you cannot be responsible for the way you are without having chosen to be that way, and that choice would itself have to issue from how you already were at the time of the choice. This creates an infinite regress where you would need to have created yourself before you existed in order to be ultimately responsible for your current self. Since no one creates themselves from scratch, the demand that a student own the self that produced the act is asking for something metaphysically impossible.

      However, I want to be extremely clear that pointing out this impossibility is not an excuse for cheating. Recognizing that we lack ultimate responsibility for our character does not mean we should abolish accountability. We still live in a community where actions have consequences, and trust must be maintained. The distinction we need to make is between ultimate moral responsibility, which is impossible, and practical accountability, which is necessary. We can still enforce rules and impose sanctions without pretending that a student has total sovereign control over their own soul. The problem with the current policy is that it conflates these two concepts. By requiring a public affirmation that the student has chosen to become a person of integrity, we are asking students to perform a philosophical contradiction. We are asking them to claim a power of self-creation they do not possess. This risks turning the sanction into a performative ritual where students say what we want to hear without actually engaging with the harm they caused. It focuses on judging the person rather than addressing the action.

      Instead of asking students to fix their character, which is vague and deeply personal, we should ask them to fix the harm they caused, which is concrete and observable. I propose that we replace the character remediation clause with a repair and restitution clause. Under this model, the sanction would focus on restoring the academic integrity of the classroom and repairing the breach of trust with the teacher and peers. This might involve redoing the assignment under strict supervision, completing additional work to demonstrate mastery, or engaging in community service that benefits the academic environment. This approach holds students accountable for what they actually did and what they can actually control. It acknowledges that while we may not be the ultimate authors of our characters, we are still participants in a social contract that requires us to make things right when we break them. This shift moves us from a model of judgment to a model of restoration. It respects the intelligence of the student body by not demanding empty affirmations of moral transformation. It respects the faculty by ensuring that the consequences are educational and restorative rather than purely punitive or psychologically intrusive. And it respects the parents by showing that we are teaching practical responsibility rather than enforcing a metaphysical fiction.

      We can uphold honor without pretending to be gods who create ourselves. We can demand accountability without demanding the impossible. By focusing on repair and restitution, we create a policy that is philosophically sound and practically effective. We acknowledge that mistakes happen because of who we are, but we insist that growth happens through what we do next. I urge the council to vote against the current language and adopt a framework that prioritizes tangible repair over abstract character assessment. Let us build a culture of integrity based on actions we can verify, not selves we cannot fully own. Thank you.

      *Word Count Check:* Looks to be around 650-700 words. Speaking pace is usually 130-140 wpm. 700 words / 140 wpm = 5 minutes. This looks good.
      *Constraint Check:* No bold, no lists, continuous prose.
      *Tone Check:* Respectful, firm, philosophical but accessible.

      *Final Review:* Does it clearly distinguish Strawson's denial from ordinary accountability? Yes ("distinction we need to make is between ultimate moral responsibility... and practical accountability"). Does it propose the repair clause? Yes. Does it avoid being an excuse for cheating? Yes ("not an excuse for cheating").

