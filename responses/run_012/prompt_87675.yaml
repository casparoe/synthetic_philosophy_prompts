answer: |-
  If David Hume were to return and sit down with Elinor Ostrom's *Governing the Commons*, read Garrett Hardin, and review the experimental literature on altruistic punishment, he would find his empirical instincts vindicated but his political conclusions too binary. Hume was, above all, an empiricist; if the evidence showed that a thousand people could coordinate without a sovereign, he would accept it. However, he would argue that Ostrom's successful commons are not *exceptions* to his theory, but rather *instantiations* of it that he failed to imagine could be engineered.

  Here is where Hume holds his ground, where he concedes, and how his specific concepts map onto the modern literature.

  ### 1. The Scale Argument: Two Neighbors vs. A Thousand
  **Hume's Position:** In the *Treatise*, Hume argues that two neighbors can easily agree to drain a meadow because they know each other, can monitor each other, and the failure of one is immediately visible to the other. But "a thousand persons cannot agree" because the mutual interest becomes too diffuse, suspicion rises, and the incentive to free-ride (let others do the work) overwhelms the convention. He concludes this necessitates government.

  **The Verdict:** **Partial Concession.**
  Hume would have to concede that the number "a thousand" is not a hard ceiling. Ostrom's field studies (e.g., the *zanjera* irrigation systems in the Philippines or alpine grazing in Switzerland) show that hundreds, sometimes thousands, can cooperate without a central state.

  **Why Hume Concedes:** Hume's constraint was not actually *number*, but **transaction costs and monitoring**. He assumed that as numbers grow, the "sensible knave" becomes invisible. Ostrom's design principles (specifically *monitoring* and *graduated sanctions*) solve the visibility problem. If the thousand are organized into nested groups where monitoring remains local, the psychological conditions of the "two neighbors" are preserved within the larger mass.

  **Where He Holds Ground:** He would insist that Ostrom's successful commons are not "stateless" in the anarchist sense. They possess **micro-sovereignties**. The users who enforce sanctions *are* acting as magistrates. Hume would argue that Ostrom hasn't eliminated the need for coercive enforcement (the magistrate); she has merely distributed the magistracy among the participants. If the community loses the ability to sanction (e.g., if the state forbids them from punishing free-riders), the commons collapses. Thus, the *function* of government remains necessary, even if the *form* is decentralized.

  ### 2. Justice as an Artificial Virtue and Convention
  **Hume's Position:** Justice is not a "natural" virtue (like benevolence); it is an "artificial" virtue—a convention invented to solve coordination problems. Crucially, Hume argues these conventions arise without promises or contracts. Two rowers sync their oars without signing a pact; they do it because it serves their interest.

  **The Verdict:** **Strong Vindication.**
  This is the area where modern literature most strongly supports Hume. Ostrom explicitly rejects the "social contract" model (Hobbes/Locke) where people sit down and agree on rules. Instead, she finds that rules evolve iteratively through trial and error.

  **The Prediction:** Hume's account predicts that commons governance will look less like a written constitution and more like a **customary law**. He would point out that Ostrom's "design principles" are not usually top-down impositions but bottom-up conventions that have stabilized over time.
  *   **Boundaries:** Hume's theory of property relies on stable possession. Ostrom's first principle (clear boundaries) is exactly the Humean requirement for justice to begin. Without "mine and thine," there is no convention to stabilize.
  *   **No Promises Needed:** Hume would note that users in these commons do not obey rules because they "promised" to, but because the convention has created a **coordination equilibrium**. To defect is to lose the benefit of the convention (water, fish, timber).

  **The Update:** Hume thought these conventions were fragile at scale. Ostrom shows they are robust *if* they are **nested**. Hume would accept this as a mechanical improvement to the "artifice." He would view polycentric governance (nested enterprises) as a sophisticated piece of social engineering that extends the reach of artificial virtue.

  ### 3. The Sensible Knave and Experimental Sanctions
  **Hume's Position:** The "Sensible Knave" is someone who realizes that justice is good for society but thinks he can cheat occasionally without being caught. Hume worries that if the Knave prospers, others will emulate him, and the convention collapses. He believes only the "fear of the magistrate" keeps the Knave in line.

  **The Verdict:** **Nuanced Revision.**
  Experimental economics (Fehr, Gächter, etc.) shows that communities *will* punish free-riders, even at a personal cost (altruistic punishment). This vindicates Hume's fear that the Knave is a constant threat. However, it refutes his claim that only a *sovereign* can administer the punishment.

  **The Mechanism:** Hume assumed peer sanctioning was too costly or dangerous for individuals. The evidence shows that humans have a psychological predisposition to enforce norms ("strong reciprocity").
  *   **The Catch:** The prompt notes that sanctioning machinery can be turned on those who "refuse to go along with the local norm." Hume would be fascinated here. He warned that justice is a convention, not moral truth. If the local convention is oppressive (e.g., excluding outsiders, enforcing caste), the "peer sanctioning" mechanism enforces injustice just as efficiently as justice.
  *   **Hume's Warning:** He would argue that while Ostrom's communities solve the Free-Rider problem, they risk creating **insider/outsider tyrannies**. Without a higher sovereign to protect the rights of those *outside* the convention (or minorities within it), the "graduated sanctions" become tools of oppression. He would hold his ground that a neutral magistrate is still needed to adjudicate conflicts *between* commons or protect individuals *within* them from the tyranny of the majority.

  ### 4. The Unimaginable Commons: Digital and Global
  Here is where Hume's 18th-century constraints meet the 21st-century reality.

  **A. Open Source and Wikipedia (Non-Rivalrous Goods)**
  *   **The Context:** Code and knowledge are non-rivalrous. My use does not diminish yours. Scarcity is low.
  *   **Hume's Reaction:** Hume's theory of justice is predicated on **scarcity** and **moderate selfishness**. He explicitly states that if goods were infinite, justice would be useless.
  *   **Verdict:** **Hume is Bypassed.** He would argue that Wikipedia is not a "commons" in the sense that requires justice. It is a realm of abundance. The "free rider" problem doesn't exist in the same way (reading Wikipedia doesn't hurt it). However, he would note that *editing* Wikipedia requires labor (scarce). The governance of editors (banning vandals) reverts to his model: conventions, monitoring, and sanctions (bans). The "Sensible Knave" (the vandal) is still punished by the "magistrates" (admins).

  **B. The Atmosphere (Global Commons)**
  *   **The Context:** No boundaries, actors are nation-states, no higher sovereign.
  *   **Hume's Reaction:** **Total Vindication.**
  *   **Why:** This is the "thousand neighbors" problem scaled to the planet. Ostrom's design principles fail here because Principle #1 (Clear Boundaries) cannot be met. You cannot exclude a state from the atmosphere.
  *   **The Prediction:** Hume predicted that without a power to enforce justice, nations will act as Sensible Knaves. They will sign climate accords (conventions) but defect when it suits their immediate interest (free-ride on others' emissions cuts).
  *   **Conclusion:** Hume would argue that the climate crisis proves his point. Ostrom's methods work for *bounded* resources (forests, fisheries). For *unbounded* global resources, her nested enterprises hit a ceiling because there is no "outer nest." Without a global sovereign (or a hegemon willing to act as one), the tragedy is inevitable. Hume holds his ground firmly here: justice at the global scale requires power, not just convention.

  ### Summary: What Survives and What Doesn't

  | Humean Concept | Status | Explanation |
  | :--- | :--- | :--- |
  | **Justice as Artificial Virtue** | **Survives** | Vindicated by Ostrom. Rules evolve as conventions to solve coordination problems, not via social contract or natural law. |
  | **Two Neighbors vs. A Thousand** | **Conceded** | Hume underestimated the capacity for institutional design to lower monitoring costs. Scale is not a hard barrier if structure is nested. |
  | **Need for Enforcement** | **Survives** | Vindicated. Ostrom's commons fail without sanctions. Hume was right that "nice feelings" aren't enough; the Knave must be deterred. |
  | **Sovereign as Sole Enforcer** | **Conceded** | Hume thought only the State could punish. Evidence shows peer-sanctioning works *within* bounded groups. |
  | **Scarcity as Precondition** | **Survives** | Hume was right that justice is irrelevant in abundance. Digital commons function differently because they mimic abundance. |
  | **Global Commons Pessimism** | **Survives** | On issues like climate change, Hume's skepticism is warranted. Without boundaries or a sovereign, conventions collapse. |
  | **The Sensible Knave** | **Survives** | The psychological profile remains accurate. The only update is that peers, not just magistrates, fear the Knave enough to punish him. |

  ### Final Synthesis

  Hume would read Ostrom not as a refutation, but as a **technical manual for his philosophy**. He argued that justice is a human artifact constructed to manage self-interest. Ostrom simply showed that the artifact can be built with more complex materials than he imagined.

  He would say: *"You have shown me that the 'magistrate' need not be a single king, but can be a distributed network of peers, provided the boundaries are clear and the sanctions are credible. You have not shown me that the magistrate is unnecessary. And where boundaries vanish, as in the air we breathe, my old warning stands: without a power to overawe us all, the convention will dissolve, and the Knave will inherit the earth."*

  Hume gives up the **centralization** of power but keeps the **necessity** of power. He accepts that conventions can scale, but only if they are engineered to replicate the psychological intimacy of the "two neighbors" through monitoring and nesting. Where that engineering is impossible (the global atmosphere), his original pessimism remains the most robust prediction available.
