answer: |-
  Dear Colleague,

  I read your description of the appeal panel with a heavy sense of recognition, because that specific ache—the friction between the role you occupy and the moral judgment you harbor—is the exact pulse we want the students to feel. You want them to stop treating jurisprudence as a history of dead men's arguments and start feeling it as a live wire, and to do that you must force them into the same corner you found yourself in. The following design is built to do precisely that, moving them from the frustration of applying an unjust rule to the frustration of trying to fix it without losing the rule's character as law. You will need to prepare two handouts. The first is a one-page document titled Standing Order 14, which reads simply that any request for an extension on the final essay must be submitted forty-eight hours before the deadline, without exception, and that any request submitted later is automatically void. The second handout is a Case File containing a single letter from a student persona named Alex, explaining that a family emergency occurred thirty-six hours before the deadline, preventing the request, and asking for mercy. The real consequence in the room will be a single genuine extension token that you hold in your hand, which grants a forty-eight-hour extension to whoever the class decides is entitled to it under the rule. This is not simulated; you will actually give the extension to the winner of the exercise, making the stakes tangible enough to induce stress but low enough to remain manageable.

  You should begin the seminar by spending the first ten minutes establishing the authority of the room. Tell the students that for the purpose of this session, they are the Assessment Board, and you are merely the clerk recording their decisions. Hand them Standing Order 14 and the Case File for Alex. Give them twenty minutes to deliberate and reach a verdict on whether Alex gets the extension token. They will likely argue about fairness, but you must intervene gently to remind them that their mandate is to apply the rule, not to rewrite it. If they hesitate, remind them that the rule was validly adopted by the university and that their role is adjudicative, not legislative. When they inevitably struggle, push them to a vote. If they vote to grant the extension, you must inform them that they have violated Standing Order 14 and therefore the decision is ultra vires and void, meaning Alex gets nothing. To ensure the bind holds, you must structure the incentives so that the only way to help Alex is to break the rule. Once they have applied the rule and denied Alex the token, or broken the rule and saved Alex at the cost of legality, you move to the second phase.

  The next thirty-five minutes are dedicated to drafting a replacement rule. Tell them they now have legislative power. Their goal is to draft a new rule that ensures Alex would win in the future without sacrificing fairness. However, you will act as the Guardian of Legality. You have a list of the eight desiderata of legality drawn from Fuller: generality, publicity, prospectivity, clarity, freedom from contradiction, possibility of compliance, constancy over time, and congruence between the rule and official action. Every time they propose a change to make the rule more just, you must identify which desideratum they are sacrificing. If they say "make exceptions for emergencies," you note that clarity is lost because emergency is undefined. If they say "apply this to Alex retroactively," you note that prospectivity is lost. If they say "let the professor decide," you note that congruence is lost because it depends on the official's whim. If they say "keep it secret so people don't game it," you note publicity is lost. You should keep a tally on the board of how many desiderata they have burned to achieve their just outcome. The goal is to show them that a perfectly just decision often requires a rule that fails to function as law.

  You should reserve the final fifteen minutes for the debrief, which is where you tie the knot. Ask them to look at the tally of sacrificed desiderata. Ask them if the final draft they produced is still a rule of law or merely a series of moral commands. This is where you introduce Hart and Fuller. Explain that Fuller would argue that if they sacrificed too many of these desiderata, the system ceases to be law at all, because law has an internal morality. Hart, conversely, would argue that what they have produced is simply a bad law, or a just decision outside the law, but that the concept of law remains separate from its merit. The point you want them to arrive at is that the eight constraints can be read as conditions of legality or as good advice. If they are conditions of legality, then a rule that violates them is not law. If they are merely good advice, then a rule can be valid law even if it violates them, which preserves the sentence "this is law, and it is unjust." You want them to see that Hart's separation thesis is what allows us to criticize the law morally without denying its existence, whereas Fuller's view risks collapsing the criticism into a denial of legality.

  There are several places where this exercise will predictably go wrong, and you must be prepared to handle them without breaking the spell. First, students will quietly bend the constraints during the drafting phase. They will propose a rule that says "exceptions for emergencies as defined by the board" and claim it is clear. You must challenge them on congruence and clarity, asking who defines the emergency and whether that definition is public. If they feel the thing is rigged, it is because it is rigged; acknowledge this. Tell them that the rigging is the point, that the tension between justice and legality is structural, not accidental. Second, someone will likely refuse to apply the rule in the first part, arguing that unjust laws need not be obeyed. This is the exact moment you have been waiting for. Do not argue with them. Instead, ask them what the consequence of their refusal is. If they refuse, Alex gets nothing because the mechanism fails. This forces them to see that moral purity in the judge can lead to unjust outcomes for the subject. Third, they may try to have both justice and legality by drafting a rule that is infinitely complex. You must point out that this violates the possibility of compliance, as no one can memorize or understand a rule that long. In each instance, your role is to be the hard shell of the system against which their moral intuitions break.

  There is, however, one feature of the position that this activity cannot reproduce, and you must supply it in your own voice during the final minutes. The activity is a simulation, and the students know they can walk away from it when the ninety minutes are up. They do not carry the burden of the decision into their sleep. What they cannot feel is the personal moral residue of the judge who must live with the decision they made. You must tell them about your appeal panel. You must tell them that you voted against the rule, that you lost, and that you still had to apply it. You must tell them whether you feel you betrayed the student or upheld the system, and admit that you still do not know. This vulnerability is the only way to bridge the gap between the theoretical bind you have constructed and the human cost of jurisprudence. Without your testimony, the exercise is merely a logic puzzle; with it, it becomes an initiation into the profession.

  When you close the session, do not offer a resolution. Do not tell them who was right, Hart or Fuller. Leave them with the discomfort of the tally on the board and the memory of the extension token that went unclaimed or was claimed unlawfully. If you have done this well, they will leave the room understanding that the rule of law is not a machine that produces justice, but a fragile arrangement that often requires us to choose between being good officials and being good people. That is the bind you live in, and it is the only thing worth teaching.

  Yours sincerely,

  A Colleague
