      *   *Distinction:* In Asymbolia, is the *affect* missing, or is the *attitude* missing? Usually, asymbolia is described as missing the affective *quality*. But some philosophers argue it's missing the *reaction*. I will use the "Creature" case to split these.

  8.  **Final Polish:**
