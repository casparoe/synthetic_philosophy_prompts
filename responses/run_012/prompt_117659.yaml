  3. The friend versus politician case shows an apparent conflict between your broad anti-hypocrisy rule (c) and your practice regarding the politician. The cheap fix is to declare any violation forfeits standing, but you lose the ability to condemn systemic corruption while admitting human fallibility.
  4. Your endorsement of self-blame (g) tensions apparently with the rule that doing the wrong thing loses standing (c), since you have done the wrong thing you are blaming yourself for. You could exempt self-blame from standing rules, but you lose the unified account of what makes any blame legitimate.
