answer: |-
  **Scenario: The ICU Damper**

  Patient X is in a specialized isolation ward requiring continuous fresh air intake via a central duct. A motorized damper controls airflow. If the damper closes, Patient X suffocates within minutes. A sensor network monitors for pathogen leaks. The hospital policy, set by identical human operators in both cases, is: "Seal the ward immediately upon leak detection."

  At 14:00, a sensor glitches, falsely indicating a leak. The operators observe the alarm but do not intervene, trusting the automation. The patient dies at 14:05.

  **System Alpha (Active Seal):** The damper is spring-loaded to remain **Open**. It requires no power to stay open. To seal the room, the motor must actively drive the damper **Closed**. Upon the glitch, the system issues a voltage command: "Drive Closed." The motor engages, closing the damper.

  **System Beta (Passive Seal):** The damper is spring-loaded to remain **Closed**. It requires continuous power to hold the damper **Open**. To seal the room, the system must cease power. Upon the glitch, the system issues no command; it simply cuts the holding voltage. The spring engages, closing the damper.

  In both cases, the sensor input is identical. The policy logic ("Seal on leak") is identical. The physical position of the damper over time is identical. The operators' knowledge and actions are identical. The only difference is the failsafe polarity: Alpha kills by issuing a command (signal present); Beta kills by withholding a command (signal absent).

  ***

  **Analysis**

  **1. Verdicts**

  **Account I: The Signal Account**
  *Statement:* Doing consists in the production of a positive act or instruction; allowing consists in the absence of such instruction. The moral weight rests on the output signal of the agent.
  *Application:*
  *   **System Alpha:** The system generated a voltage pulse to drive the motor. It issued a positive instruction. **Verdict: Doing.**
  *   **System Beta:** The system ceased transmission. The lethal event coincided with the absence of a signal. **Verdict: Allowing.**
  *   *Result:* This account distinguishes the pair.

  **Account II: The Difference-Maker Account**
  *Statement:* Doing consists in the agent's being a difference-maker for an outcome that would not otherwise have occurred. If the agent intervenes in a process already under way—whether by acting or ceasing to act—such that the outcome changes from life to death, it counts as doing.
  *Application:*
  *   **System Alpha:** Without the system's command, the damper would have remained open and the patient would have lived. The system made the difference. **Verdict: Doing.**
  *   **System Beta:** Without the system's decision to cut power (i.e., if it had continued its prior behavior of holding open), the damper would have remained open and the patient would have lived. The system's cessation was the specific intervention that altered the course of events. **Verdict: Doing.**
  *   *Result:* This account disagrees with Account I regarding System Beta.

  **Account III: The Baseline Account**
  *Statement:* Doing consists in moving the world below a baseline fixed independently of the agent. Allowing consists in failing to raise the world above that baseline. The verdict turns on how the baseline is drawn.
  *Application:*
  *   **Choice A (Patient Status):** The baseline is the patient's physiological state on arrival (breathing).
      *   **Alpha & Beta:** Both systems moved the patient from breathing to non-breathing. **Verdict: Both Doing.**
  *   **Choice B (System Default):** The baseline is the state of the artifact when unpowered.
      *   **Alpha:** Unpowered state is Open. System moved it to Closed. **Verdict: Doing.**
      *   **Beta:** Unpowered state is Closed. System let it return to Closed. **Verdict: Allowing.**
  *   *Result:* This account is ambiguous. Its verdict flips based on whether the baseline is biological or mechanical.

  **2. What Is Doing the Work**

  The divergence in verdicts turns entirely on the **failsafe polarity** (spring-open vs. spring-closed). This is an engineering decision regarding risk management (e.g., failing safe vs. failing operational), not a moral one.

  **Removing the Feature:**
  If we remove the polarity difference by making both systems spring-closed (like Beta), both kill by withholding power. Account I now classifies both as "Allowing." The case collapses into an ordinary omission case. If we make both spring-open (like Alpha), both kill by commanding. Account I classifies both as "Doing." The case collapses into an ordinary commission case.

  **Invariance:**
  Account II (Difference-Maker) is invariant across the pair. It classifies both as "Doing" regardless of wiring. This reveals that Account II locates the distinction in the **world's causal structure** (the counterfactual dependence of death on the system's behavior) rather than in the agent's output syntax.

  **Engineering Implementation:**
  An engineering team could implement Account II, but it requires the system to represent counterfactual baselines it cannot directly observe (e.g., "Would the patient die if I did nothing?"). This requires a model of the environment, not just sensor readings. Account I is easier to implement (check signal state) but yields morally unstable verdicts dependent on hardware selection. Account III cannot be implemented without stipulating a baseline priority (biology vs. mechanics), which is a value judgment, not an engineering fact.

  **3. The Strongest Attack**

  The account that fares worst is **Account I (The Signal Account)**, because its verdict flips based on an arbitrary engineering convention (failsafe polarity). A defender of Account I must explain why the failsafe polarity is not morally arbitrary.

  **The Defense:**
  The strongest reply is: **"The default state is the agent's rest state, and rest is not action."** In System Beta, cutting power is returning to rest. In System Alpha, sending power is expending energy. Morality tracks energy expenditure and intrusion, not just outcomes. Our sense that the two systems are equivalent is an artifact of attending solely to outcomes, ignoring the metaphysical distinction between acting and refraining.

  **Critique:**
  This reply succeeds only if **moral significance attaches to the flow of electricity rather than the flow of blood.** It requires that "rest" be a non-arbitrary physical state. However, in engineering, "rest" is defined by the designer's choice of spring tension. There is no fact of the matter about whether a damper "wants" to be open or closed independent of human design.

  **Condition for Success:**
  For the defender's reply to succeed, it must be true that there is a **natural baseline of inertia** for artifacts independent of human design. Since artifacts have no natural states, only designed states, the defense fails unless one argues that the *design choice itself* creates the moral reality. This implies that engineers can legislate moral status (doing vs. allowing) by selecting springs, which undermines the purpose of using the distinction to constrain design. If the doing/allowing constraint is to guide engineering, it cannot be hostage to engineering decisions.
