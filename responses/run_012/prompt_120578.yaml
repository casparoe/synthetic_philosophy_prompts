answer: |-
  # Instructor's Guide: The Tiny Harms Decision Tree

  This tool maps the logical space of the "Torture vs. Dust Specks" problem. It is designed to separate students who arrive at the same verdict (e.g., "Torture is worse") for different underlying reasons. Hand this out after the initial vote. Ask students to answer the questions sequentially.

  ### The Decision Tree

  **Node 1: Comparability**
  Is there a determinate fact of the matter about which outcome is worse, or is the comparison vague/incomparable?
  *   **No Fact/Incomparable:** Go to **Leaf 1**.
  *   **Yes, Fact of the Matter:** Go to Node 2.

  **Node 2: Experience Requirement**
  For a harm to count morally, must it be experienced by a conscious subject? (e.g., Does moving a hair on a sleeping person or a rock count?)
  *   **No, Objective Harm:** Go to **Leaf 2**.
  *   **Yes, Must Be Felt:** Go to Node 3.

  **Node 3: Feasibility Constraint**
  Does the physical impossibility of the scenario (e.g., not enough atoms in the universe for that many people) invalidate the moral question?
  *   **Yes, It's a Dodge:** Go to **Leaf 3**.
  *   **No, Assume the Case:** Go to Node 4.

  **Node 4: Aggregation**
  Do tiny harms sum up linearly? (Can enough dust specks equal one torture session in total badness?)
  *   **No, They Do Not Sum:** Go to Node 5.
  *   **Yes, They Sum:** Go to Node 6.

  **Node 5: Threshold Source**
  If they don't sum, what blocks the aggregation? Is it the *Kind* of experience (agony vs. annoyance) or the *Magnitude* (intensity level)?
  *   **Kind (Lexical):** Go to **Leaf 4**.
  *   **Magnitude (Discontinuous):** Go to **Leaf 5**.

  **Node 6: Distribution**
  If they do sum, does it matter if the specks hit one person (10^20 specks) vs. many people (1 speck each)?
  *   **Yes, Spreading Matters:** Go to **Leaf 6**.
  *   **No, Total Sum Matters:** Go to Node 7.

  **Node 7: Cognitive Reliability**
  When the math says "Specks" but your gut says "Torture," which do you trust?
  *   **Trust Math:** Go to **Leaf 7**.
  *   **Trust Gut/Intuition:** Go to Node 8.

  **Node 8: Normative Focus**
  Is your judgment about which *State of Affairs* is better, or which *Action* an agent is permitted to do?
  *   **State of Affairs (Outcome):** Go to **Leaf 8**.
  *   **Action (Permission):** Go to **Leaf 9**.

  ---

  ### The Leaves (Positions)

  **Leaf 1: Incomparabilist**
  *   **Verdict:** No verdict / Category error.
  *   **Awkward Commitment:** You must accept that there are moral dilemmas where reason runs out and there is no right answer.

  **Leaf 2: Objective Harm Realist (Unnamed)**
  *   **Verdict:** Likely Specks (if N is huge).
  *   **Awkward Commitment:** You are committed to the view that damaging a rock or a corpse is morally equivalent to hurting a living person.

  **Leaf 3: Feasibility Skeptic**
  *   **Verdict:** Case Dismissed.
  *   **Awkward Commitment:** You imply that morality stops applying once physics makes a scenario impossible, even in principle.

  **Leaf 4: Lexical Prioritarian**
  *   **Verdict:** Torture is Worse.
  *   **Awkward Commitment:** You believe a single moment of agony outweighs an infinite duration of mild annoyance, regardless of the total volume of suffering.

  **Leaf 5: Discontinuous Value Theorist**
  *   **Verdict:** Torture is Worse.
  *   **Awkward Commitment:** You believe value jumps in steps based on intensity, meaning two pains slightly below a threshold cannot equal one pain slightly above it.

  **Leaf 6: Distributive Sensitive Aggregativist**
  *   **Verdict:** Torture is Worse (usually).
  *   **Awkward Commitment:** You believe spreading harm is better than concentrating it, even if the total amount of pain is identical.

  **Leaf 7: Strict Total Utilitarian**
  *   **Verdict:** Specks are Worse.
  *   **Awkward Commitment:** You must accept that you are obligated to prevent the specks even if it requires counter-intuitive sacrifices, because the math is absolute.

  **Leaf 8: Intuitionist Consequentialist**
  *   **Verdict:** Torture is Worse.
  *   **Awkward Commitment:** You believe the "good" is determined by human intuition rather than calculation, even when intuition contradicts arithmetic.

  **Leaf 9: Deontological Constraint Theorist**
  *   **Verdict:** Torture is Worse.
  *   **Awkward Commitment:** You believe an agent is forbidden from torturing one person even if doing so would prevent a greater total amount of suffering elsewhere.

  ---

  ### Logical Space Analysis

  **Empty Cells (Positions Nobody Occupies)**
  1.  **The "Felt Rock" Utilitarian:** A student who claims harm requires experience (Node 2: Yes) but also that rocks can be harmed (Node 2: No). *Why Empty:* Incoherent definition of experience.
  2.  **The "Impossible but Real" Incomparabilist:** A student who claims the case is physically impossible (Node 3: Yes) but also that there is no fact of the matter (Node 1: No). *Why Empty:* If the case is impossible, the question of comparability usually evaporates; holding both is redundant.
  3.  **The "Math-Trusting Intuitionist":** A student who trusts their gut over math (Node 7: Gut) but concludes the Specks are worse because the math says so. *Why Empty:* Psychologically unstable; if they trusted the gut, they would pick Torture.

  **Limitations: Two Leaves This Tree Cannot Separate**
  **Leaf 4 (Lexical Prioritarian)** and **Leaf 9 (Deontological Constraint Theorist)**.
  *   **Why:** Both typically answer "Torture is Worse," "Kind Threshold," and "Trust Gut." While Node 8 attempts to split them by Outcome vs. Action, many Deontologists argue that respecting rights *produces* the best outcome in the long run, or that rights are constraints on outcomes. A sophisticated Rights Theorist and a Value Lexicalist may answer identically here despite having different metaphysical foundations (Value vs. Duty).

  **Instructor Note: The Least Confident Split**
  **Node 5: Threshold Source (Kind vs. Magnitude).**
  *   **Why:** It is unclear if "Magnitude" thresholds are truly distinct from "Kind" thresholds. At a certain intensity, pain may qualitatively change the neural state, making a magnitude threshold effectively a kind threshold.
  *   **What Would Change My Mind:** If neuroscience demonstrated a continuous neural scale for pain with no qualitative shifts at high intensities, yet people still maintained a moral discontinuity, I would be confident the split is real. If neural discontinuity matches moral intuition perfectly, the split collapses.
