          *   No moral superiority claimed by the speaker.
          *   Must be intelligible and bearable to all parties (especially the pro-execution family members).
          *   Length: ~5 minutes spoken (approx. 750-900 words).
      *   **Core Argument:** The distinction between *what the killer deserves* (unknown/irrelevant to this decision) and *what the state is entitled to do*. Focus on the *mechanism* of state killing: planned, scheduled, rehearsed, divided labor (judge, governor, warden, doctor, executioner) allowing the community to kill while keeping hands clean.
      *   **Key Image/Thought:** Sister died at a time no one chose; the killer will die at a time we chose. Not equal, but significant.
      *   **Goal:** End with a clear request to recommend commutation.

  2.  **Determine Tone and Voice:**

      *   **Voice:** Plain, direct, teacher-like (clear, structured, but not academic), honest, vulnerable but firm.
