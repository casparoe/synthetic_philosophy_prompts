answer: |-
  Members of the Board, my family, and everyone present:

  My name is [Name]. I am the brother/sister of [Sister's Name]. She was murdered eighteen months ago. The man convicted of killing her is sitting in a cell down the road, and you are here to decide if he should be executed this spring.

  My mother and my brother are sitting behind me. They believe he should die. They believe that justice requires it. I love them, and I understand their anger because I share it. I know that by standing here, I am causing them pain. They hear my words as a betrayal of my sister. I need them to know that I am not standing here to betray her. I am standing here because I cannot stand anywhere else.

  I am not a philosopher. I teach eighth-grade history. I deal in facts, in timelines, in the mechanics of how things happen. And when I look at what is proposed here, I do not see justice. I see a procedure.

  I am not here to argue that the condemned man is innocent. He is not. I am not here to say he has reformed. I don't know. I am not here to say that life is sacred. I don't believe that. And I am certainly not here to say that I forgive him. I do not.

  The question before this board is not what he deserves. I will leave that question open. It is not mine to answer, and I do not believe it is yours. The question is what we are entitled to do.

  There is a difference between a killing and an execution. A killing is an act of violence. An execution is an act of administration. What is scheduled for this spring is not a punishment like a prison sentence. It is a death that will be planned, scheduled, and rehearsed. A date will be set. A room will be prepared. A specific person will be assigned to press the button or inject the line.

  This process allows us to kill a man while ensuring that no one here has to feel responsible for it. The judge signs the order. The governor approves the clemency or denial. The warden oversees the room. The doctor monitors the vitals. The executioner pulls the switch. The responsibility is divided so thinly that it disappears. We, as a community, get to say the man is dead, but we all get to say our hands are clean.

  I am not better than the man who killed my sister. I am only refusing to be one of the people who kills him.

  There is another distinction I cannot get past. My sister died at a time no one chose. It was violent, and sudden, and chaotic. The man on death row will die at a time we chose. We will pick the hour. We will lock the door. We will watch the clock.

  I do not say these two deaths are equal. They are not. My sister was innocent; he is guilty. Her death was a tragedy; his death would be a policy. But the fact that we can calendarize his end, that we can fit his death into a budget and a schedule, is something I cannot reconcile. It turns a human end into a bureaucratic task.

  I am not asking for a lesser punishment because he has earned it. I am asking you to refuse to do the one thing that cannot be taken back. Prison is severe. Life without parole is severe. But those punishments leave open the possibility of error, of change, of time. Execution closes the book permanently, not just on his life, but on our own relationship to violence.

  My sister was funny. She was impatient with sermons. She would have hated being used as a prop in this hearing. She would have hated knowing that her death was being used to justify a process she never asked for. To honor her, I have to speak the truth as I see it, not the truth that makes the room comfortable.

  I cannot stop the fact that she is gone. I cannot undo what he did. But I can refuse to participate in what comes next. I am asking you to do the same.

  I request that this board recommend commutation of the death sentence to life imprisonment. Not for his sake. For ours.

  Thank you.
