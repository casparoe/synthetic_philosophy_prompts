      *   *Question 2 (The Field Stop):* A student asked: When we stop, is he dead or are we done? Answer: Protocol isn't just about resource management. It's about recognizing irreversibility. When the protocol says stop, it says further effort cannot bring them back. You are not deciding to give up; you are recognizing the boundary of what medicine can do.
      *   *The Authority:* This is the hard part. You might feel like you're pretending. You aren't. You are the witness. You are the one who applies the standard so society can move forward (funerals, estates, donation).
