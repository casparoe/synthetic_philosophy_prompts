      *   **The Core Problem:** Introduce the reality they will face: declaring death when the body looks alive.
      *   **Addressing Question 1 (Donation/Neurological):** How to understand death when the heart beats. Focus on the integration of function vs. mechanical function. Avoid metaphysical debate, focus on the standard used.
      *   **Addressing Question 2 (Field Termination/Circulatory):** How to understand stopping resuscitation. Focus on the irreversibility and the protocol as a moral boundary, not just a medical one.
      *   **Synthesis/Authority:** How to hold these truths together. The authority comes from the trust placed in them to uphold the standard.
