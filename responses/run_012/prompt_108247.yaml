answer: |-
  # JOINT STATEMENT ON SUNK COSTS AND RATIONALITY
  **Seminar:** Philosophy of Economics & Decision Theory
  **Parties:** Side A (Decision-Theoretic Standard) & Side B (Normative Critic)

  ## I. Points of Agreement
  We agree on the following claims. These form the baseline for our remaining disagreement.

  1.  **Definition:** A cost is "sunk" if it has already been incurred and cannot be recovered, regardless of future action.
  2.  **Causal Independence:** Past expenditures cannot causally influence future physical outcomes except through the current state of the world (e.g., a built bridge exists; a spent dollar is gone).
  3.  **The Paradigm Fallacy:** It is irrational to continue a project *solely* because resources were spent on it, if continuing yields lower expected future value than abandoning it.
  4.  **Reputation is Forward-Looking:** Actions taken to maintain a reputation (e.g., a firm deterring entrants) are not sunk cost fallacies. The "cost" of stubbornness is an investment in future credibility.
  5.  **Analysis of Seed Cases:**
      *   **The Researcher:** We agree this is a mixed case. The four years and grad student time are sunk. The career damage from quitting is a *future* cost (reputation/signaling). Rationality requires weighing the future career cost against the future value of the project, ignoring the four years already lost.
      *   **The Firm:** This is not a sunk cost case. It is a strategic commitment problem. The "stubbornness" is a asset purchased to influence future competitors.
      *   **The Terrible Novel:** This is a paradigm sunk cost fallacy. If the novel will not be read and finishing brings no joy, the 400 pages are irrelevant.
      *   **The Dead Friend's Promise:** We agree there is no causal impact on the deceased. We disagree on whether the *act* of keeping it constitutes a reason for action (see Section III).
      *   **The Grave Visits:** We agree the visits change nothing about the physical future. We disagree on whether the value of the visits is derived from a "history-dependent preference" (A) or a "past-directed duty" (B).

  ## II. Residual Disagreements
  We disagree on the interpretation of rationality and the status of preferences.

  | Topic | Neutral Formulation | Side A (Decision Theorist) | Side B (Normative Critic) |
  | :--- | :--- | :--- | :--- |
  | **1. Scope of Rationality** | Does rationality require maximizing expected future value, or responding to all valid reasons? | Rationality is **instrumental**. An agent is rational if their actions maximize expected utility relative to their current preferences. | Rationality is **substantive**. An agent is rational if their actions respond correctly to normative reasons, including those generated by past commitments. |
  | **2. History-Dependent Preferences** | How do we classify an agent who prefers to finish things *because* they started them? | This is a **brute preference**. The agent's utility function includes a variable for "completion." Honoring the past is just satisfying a present desire. | This is a **normative commitment**. The agent values fidelity. Reducing this to a "desire" strips it of its normative force (the idea that they *should* finish, not just *want* to). |
  | **3. Temporal Neutrality** | Should reasons for action depend only on the future, or can the past generate reasons? | **Future-Only.** The past is fixed. Only the future can be shaped. Reasons must track causal leverage. | **Past-Inclusive.** The past constitutes identity and obligation. A promise made is a reason to act, even if breaking it has better future consequences. |

  ## III. The Cruxes
  We identify two fundamental divergences driving the dispute. We agree these are the pivot points.

  ### Crux 1: The Definition of "Rational"
  **The Issue:** Is "rational" a technical term meaning "internally consistent maximization" (A), or a thick normative term meaning "correct response to reasons" (B)?

  *   **Test Case:** *The Reflective Sunk-Cost Agent.*
      An agent knows she has a preference for finishing what she starts. She knows this preference reduces her total material welfare (she finishes bad projects). However, upon reflection, she endorses this preference. She believes a life of finishing commitments is better than a life of maximizing material output, even if she cannot explain why without circularity.
  *   **Predictions:**
      *   **Side A Predicts:** This agent is **rational**. She is maximizing her "integrity utility function." To call her irrational is to impose external values on her preferences.
      *   **Side B Predicts:** This agent is **rational**, but Side A's description is **empty**. Calling it a "utility function" explains nothing. She is rational because she is responding to the reason "I committed to this," which exists independently of her current desire to satisfy it.

  ### Crux 2: The Reality of Past-Directed Reasons
  **The Issue:** Are considerations rooted in the past (promises, identity, rituals) legitimate reasons for action, or are they always secretly forward-looking (e.g., avoiding guilt, maintaining self-image)?

  *   **Test Case:** *The Unobserved Deathbed Promise.*
      You promise a dying stranger to deliver $10 to a specific cause. You know with certainty: (1) No one will ever know if you break it, (2) You will feel no guilt, (3) It costs you $10. You keep the promise solely because you made it.
  *   **Predictions:**
      *   **Side A Predicts:** If the agent keeps the promise, there **must** be a forward-looking payoff (e.g., subtle self-concept maintenance) or it is a mistake. If there is truly *no* future value, keeping it is irrational.
      *   **Side B Predicts:** The agent keeps the promise because the **past act of promising** creates a reason. The reason exists even if the future contains no benefit and no penalty. Denying this makes the concept of "commitment" incoherent.

  ## IV. Conditions for Revising Views
  We specify what evidence or argument would cause us to abandon our current positions.

  | Party | What would move the needle? | Common Ground for Resolution |
  | :--- | :--- | :--- |
  | **Side A** | If it can be shown that ignoring sunk costs leads to **diachronic self-defeat** that the agent condemns upon reflection. If "maximizing future value" systematically prevents agents from achieving goods they retrospectively value most (e.g., integrity, deep commitment). | **The Regret Test:** We agree to look at cases of deep, reflective regret. If agents consistently regret *not* honoring sunk costs (even when it was "efficient" to quit), Side A must admit the standard model is missing a variable. |
  | **Side B** | If "past-directed reasons" can be fully **reduced to forward-looking psychological states** without losing explanatory power. If every case of "fidelity" can be modeled as "avoiding future self-disappointment" with perfect accuracy. | **The Modeling Test:** We agree to attempt to model the "Deathbed Promise" case using only forward-looking variables. If the model requires absurd contortions to fit the data, Side B gains ground. |

  ## V. Assessment of Verbal Dispute
  **Honest Call:** Approximately 60% of this dispute is verbal; 40% is substantive.

  *   **The Verbal Portion:** We are often using the word "Rational" to point at different targets. Side A uses it to mean *instrumental efficiency*. Side B uses it to mean *normative correctness*. If Side A says "It is rational to maximize your preference for fidelity," and Side B says "It is rational to honor commitments," they may be describing the same action with different vocabularies.
  *   **The Substantive Portion:** The disagreement over the **Unobserved Deathbed Promise** is not verbal. Side A claims a reason *must* cash out in future welfare (psychological or material). Side B claims the past *itself* generates normative force. This is a metaphysical disagreement about the nature of reasons, not just a definitional one.

  **Conclusion:** We agree that the "Sunk Cost Fallacy" is a real error in the "Terrible Novel" case. We disagree on whether "Honoring Commitments" is a distinct category of rational action or merely a complex preference satisfaction. We recommend focusing seminar discussion on the **Reflective Sunk-Cost Agent**, as this isolates the conflict between preference sovereignty and normative criticism.
